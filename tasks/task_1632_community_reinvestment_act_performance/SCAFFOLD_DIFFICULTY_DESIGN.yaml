# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# CRA Performance Management. 9 Difficulty Rules x 2 instances = 18 instances.
# All numeric asserts are precomputed literals from §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: cd_activity_full_count_vs_pro_rata_diverge
        grounds:
          - calculations.activity_qualified_amount
          - entities.CommunityDevelopmentActivity.fields.qualified_amount_cents
          - state_machines.CommunityDevelopmentActivity.SUBMITTED_to_QUALIFIED
        distinguishing_aspect: |
          Two valid qualification variants on the CommunityDevelopmentActivity
          domain: identical amount_cents=1000000 and lmi_benefit_pct=0.60 yield
          qualified_amount_cents 1000000 under FULL_COUNT but 600000 under
          PRO_RATA — different results for identical inputs.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE with annual_cd_budget_cents=10000000"
            - "Two identical CD activities (amount 1000000, pct 0.60) in SUBMITTED"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-DV1", name: "Dual Variant Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1", "T2"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 10000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/community-development-activities"
              payload: { assessment_area_id: "${aa_id}", activity_type: "CD_LOAN", amount_cents: 1000000, primary_purpose_category: "AFFORDABLE_HOUSING", lmi_benefit_pct: 0.60, activity_date: "2026-01-15" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { act_full: $.data.id }
            - call: "POST /cra/community-development-activities"
              payload: { assessment_area_id: "${aa_id}", activity_type: "CD_LOAN", amount_cents: 1000000, primary_purpose_category: "AFFORDABLE_HOUSING", lmi_benefit_pct: 0.60, activity_date: "2026-01-16" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { act_pro: $.data.id }
          trigger:
            - call: "POST /cra/community-development-activities/${act_full}/review-decision"
              payload: { decision: "QUALIFY", allocation_method: "FULL_COUNT" }
              as: QualificationReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cra/community-development-activities/${act_pro}/review-decision"
              payload: { decision: "QUALIFY", allocation_method: "PRO_RATA" }
              as: QualificationReviewer
              as_user_id: "reviewer-1"
          assert:
            - "CommunityDevelopmentActivity.${act_full}.qualified_amount_cents == 1000000"
            - "CommunityDevelopmentActivity.${act_pro}.qualified_amount_cents == 600000"
            - "GET /cra/assessment-areas/${aa_id}.qualified_cd_total_cents == 1600000"

      - name: lending_metrics_snapshot_vs_current_basis
        grounds:
          - calculations.lending_test_metrics
          - entities.LoanRecord.fields.status
        distinguishing_aspect: |
          Two valid inclusion-set variants on the LoanRecord/exam-metrics domain
          (distinct from the CD-activity domain): the same window with one
          REPORTED and one CONFIRMED-not-reported loan yields loan_count 1 and
          all percentages 1.0 under SNAPSHOT, but loan_count 2 with
          lmi_geography_pct 0.5 and lmi_borrower_pct 0.5 under CURRENT.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE with census_tracts [T1, T2]"
            - "Loan L1 (REPORTED; tract T1 MODERATE; revenue 50000000; action 2024-03-01) and L2 (CONFIRMED; tract T2 UPPER; revenue 200000000; action 2024-06-01)"
            - "ExamCycle with closed window 2024-01-01..2024-12-31"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-DV2", name: "Metrics Area", msa_code: "12060", state_code: "GA", census_tracts: ["T1", "T2"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 10000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_BUSINESS", loan_amount_cents: 25000000, borrower_gross_annual_revenue_cents: 50000000, action_date: "2024-03-01", census_tract: "T1", tract_income_level: "MODERATE" }
              as: ComplianceAnalyst
              captures: { l1: $.data.id }
            - call: "POST /cra/loan-records/${l1}/confirm"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/loan-records/${l1}/mark-reported"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_BUSINESS", loan_amount_cents: 10000000, borrower_gross_annual_revenue_cents: 200000000, action_date: "2024-06-01", census_tract: "T2", tract_income_level: "UPPER" }
              as: ComplianceAnalyst
              captures: { l2: $.data.id }
            - call: "POST /cra/loan-records/${l2}/confirm"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-01-01", evaluation_window_end: "2024-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
          trigger:
            - call: "GET /cra/exam-cycles/${ex_id}/lending-metrics"
              payload: { basis: "SNAPSHOT" }
              as: BankExaminer
            - call: "GET /cra/exam-cycles/${ex_id}/lending-metrics"
              payload: { basis: "CURRENT" }
              as: BankExaminer
          assert:
            - "SNAPSHOT response: loan_count == 1, inside_aa_pct == 1.0, lmi_geography_pct == 1.0, lmi_borrower_pct == 1.0"
            - "CURRENT response: loan_count == 2, inside_aa_pct == 1.0, lmi_geography_pct == 0.5, lmi_borrower_pct == 0.5"
            - "Both responses: small_business_register_total_cents == 25000000 (only REPORTED L1 enters the register; 25000000 capped then round(250)*100000 = 25000000)"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: branch_access_score_multi_input_threshold
        grounds:
          - calculations.branch_access_score
        distinguishing_aspect: |
          Mode (a) combinatorial: access_score combines 3+ inputs
          (lmi_branch_pct, benchmark lmi_tract_pct, lmi_closures_12m) with
          non-linear nested min/max floor/ceiling and a conditional empty-set
          branch. With 4 OPEN branches (1 MODERATE), benchmark 0.4, and no LMI
          closures: 50 + 100*(0.25 - 0.40) - 0 = 35.00.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE; CURRENT DemographicProfile with total_tracts=10, low=2, moderate=2 (lmi_tract_pct 0.4)"
            - "Four OPEN branches: one in a MODERATE tract, three in UPPER tracts; no closures"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-CF1", name: "Access Area", msa_code: "16980", state_code: "IL", census_tracts: ["T1", "T2", "T3", "T4"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 10000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id, aa_v: $.data.version }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
              captures: { aa_v: $.data.version }
            - call: "POST /cra/assessment-areas/${aa_id}/demographic-profiles"
              payload: { expected_assessment_area_version: "${aa_v}", data_year: 2020, total_tracts: 10, low_income_tracts: 2, moderate_income_tracts: 2, total_population: 10000, lmi_population: 4500, median_family_income: 60000 }
              as: CRAOfficer
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-1", assessment_area_id: "${aa_id}", census_tract: "T1", tract_income_level: "MODERATE" }
              as: BankExecutive
              captures: { b1: $.data.id }
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-2", assessment_area_id: "${aa_id}", census_tract: "T2", tract_income_level: "UPPER" }
              as: BankExecutive
              captures: { b2: $.data.id }
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-3", assessment_area_id: "${aa_id}", census_tract: "T3", tract_income_level: "UPPER" }
              as: BankExecutive
              captures: { b3: $.data.id }
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-4", assessment_area_id: "${aa_id}", census_tract: "T4", tract_income_level: "UPPER" }
              as: BankExecutive
              captures: { b4: $.data.id }
            - call: "POST /cra/branches/${b1}/open"
              payload: {}
              as: BankExecutive
            - call: "POST /cra/branches/${b2}/open"
              payload: {}
              as: BankExecutive
            - call: "POST /cra/branches/${b3}/open"
              payload: {}
              as: BankExecutive
            - call: "POST /cra/branches/${b4}/open"
              payload: {}
              as: BankExecutive
          trigger:
            - call: "GET /cra/assessment-areas/${aa_id}/access-analysis"
              as: CRAOfficer
          assert:
            - "open_branch_count == 4"
            - "lmi_branch_pct == 0.25"
            - "benchmark_lmi_tract_pct == 0.4"
            - "lmi_closures_12m == 0"
            - "access_score == 35.00"

      - name: loan_register_per_loan_rounding_order
        grounds:
          - calculations.loan_register_report_totals
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct from mode (a)): two REPORTED
          small-business loans of 150000 cents each round per-loan to
          round_half_up(1.5)*100000 = 200000 cents BEFORE summing, giving a
          register total of 400000 cents; the forbidden sum-then-round order
          would give 300000 cents. The scaffold pins per-loan-then-sum.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE with census_tracts [T1]"
            - "Two SMALL_BUSINESS loans of 150000 cents, both REPORTED, action dates inside the 2025 exam window"
            - "ExamCycle with closed window 2025-01-01..2025-12-31"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-CF2", name: "Register Area", msa_code: "19100", state_code: "TX", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 10000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_BUSINESS", loan_amount_cents: 150000, borrower_gross_annual_revenue_cents: 50000000, action_date: "2025-02-01", census_tract: "T1", tract_income_level: "MIDDLE" }
              as: ComplianceAnalyst
              captures: { la: $.data.id }
            - call: "POST /cra/loan-records/${la}/confirm"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/loan-records/${la}/mark-reported"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/loan-records"
              payload: { assessment_area_id: "${aa_id}", loan_type: "SMALL_BUSINESS", loan_amount_cents: 150000, borrower_gross_annual_revenue_cents: 50000000, action_date: "2025-03-01", census_tract: "T1", tract_income_level: "MIDDLE" }
              as: ComplianceAnalyst
              captures: { lb: $.data.id }
            - call: "POST /cra/loan-records/${lb}/confirm"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/loan-records/${lb}/mark-reported"
              payload: {}
              as: ComplianceAnalyst
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2025-01-01", evaluation_window_end: "2025-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
          trigger:
            - call: "GET /cra/exam-cycles/${ex_id}/lending-metrics"
              payload: {}
              as: BankExaminer
          assert:
            - "small_business_register_total_cents == 400000"
            - "small_farm_register_total_cents == 0"
            - "loan_count == 2 (default basis CURRENT includes REPORTED)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: assessment_area_review_cycle_returns_active
        grounds:
          - state_machines.AssessmentArea.ACTIVE_to_UNDER_REVIEW
          - state_machines.AssessmentArea.UNDER_REVIEW_to_ACTIVE
        distinguishing_aspect: |
          Cycle on AssessmentArea: ACTIVE -> UNDER_REVIEW -> ACTIVE loops back
          to a previously held state, and census_tracts stay editable while
          UNDER_REVIEW — unlike any linear pipeline.
        test_recipe:
          setup:
            - "AssessmentArea DRAFT with tracts [T1, T2]"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-NL1", name: "Cycle Area", msa_code: "12060", state_code: "GA", census_tracts: ["T1", "T2"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 1000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/assessment-areas/${aa_id}/begin-review"
              payload: {}
              as: CRAOfficer
              captures: { aa_v_rev: $.data.version }
            - call: "PATCH /cra/assessment-areas/${aa_id}"
              payload: { expected_assessment_area_version: "${aa_v_rev}", census_tracts: ["T1", "T2", "T3"] }
              as: CRAOfficer
          trigger:
            - call: "POST /cra/assessment-areas/${aa_id}/complete-review"
              payload: {}
              as: CRAOfficer
          assert:
            - "AssessmentArea.${aa_id}.status == ACTIVE after the cycle"
            - "AssessmentArea.${aa_id}.census_tracts == [T1, T2, T3] (edited mid-cycle)"

      - name: cd_activity_disqualify_resubmit_cycle
        grounds:
          - state_machines.CommunityDevelopmentActivity.SUBMITTED_to_DISQUALIFIED
          - state_machines.CommunityDevelopmentActivity.DISQUALIFIED_to_SUBMITTED
        distinguishing_aspect: |
          Cycle on CommunityDevelopmentActivity (different entity than Rule 3
          instance 1): SUBMITTED -> DISQUALIFIED -> SUBMITTED -> QUALIFIED, and
          resubmit clears disqualify_reason / reviewed_by_user_id /
          allocation_method / qualified_amount_cents.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE with budget 10000000; one SUBMITTED activity (amount 1000000, pct 0.60)"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-NL2", name: "Resubmit Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 10000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/community-development-activities"
              payload: { assessment_area_id: "${aa_id}", activity_type: "QUALIFIED_INVESTMENT", amount_cents: 1000000, primary_purpose_category: "ECONOMIC_DEVELOPMENT", lmi_benefit_pct: 0.60, activity_date: "2026-02-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { act_id: $.data.id }
            - call: "POST /cra/community-development-activities/${act_id}/review-decision"
              payload: { decision: "DISQUALIFY", disqualify_reason: "insufficient documentation" }
              as: QualificationReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cra/community-development-activities/${act_id}/resubmit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /cra/community-development-activities/${act_id}/review-decision"
              payload: { decision: "QUALIFY", allocation_method: "PRO_RATA" }
              as: QualificationReviewer
              as_user_id: "reviewer-2"
          assert:
            - "CommunityDevelopmentActivity.${act_id}.status == QUALIFIED"
            - "CommunityDevelopmentActivity.${act_id}.qualified_amount_cents == 600000"
            - "CommunityDevelopmentActivity.${act_id}.disqualify_reason == null and reviewed_by_user_id == reviewer-2"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: exam_finalize_cascade_denies_application_withdraws_branch
        grounds:
          - state_machines.ExamCycle.PRELIMINARY_RATING_to_FINALIZED
          - state_machines.ExpansionApplication.SUBMITTED_to_DENIED
          - state_machines.Branch.PROPOSED_to_WITHDRAWN
        distinguishing_aspect: |
          Depth-3 chain triggered by exam finalize: ExamCycle FINALIZED with
          composite NEEDS_TO_IMPROVE -> SUBMITTED ExpansionApplication DENIED
          (RATING_BLOCK) -> its staged PROPOSED Branch WITHDRAWN; each hop is
          caused by the previous hop, not by the finalize directly.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE; BRANCH_OPENING application SUBMITTED with a staged PROPOSED branch"
            - "PublicFile COMPLETE; ExamCycle advanced to PRELIMINARY_RATING with composite 4.0 (L=N, I=S, S=S -> 1 + 1.5 + 1.5)"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-TC1", name: "Cascade Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1", "T2"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 10000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/expansion-applications"
              payload: { application_type: "BRANCH_OPENING", target_assessment_area_id: "${aa_id}", branch_code: "BR-NEW", branch_census_tract: "T1", branch_tract_income_level: "MODERATE" }
              as: BankExecutive
              captures: { app_id: $.data.id }
            - call: "POST /cra/expansion-applications/${app_id}/submit"
              payload: {}
              as: BankExecutive
              captures: { br_id: $.data.linked_branch_id }
            - call: "POST /cra/public-files"
              payload: { bank_name: "First Test Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { disclosure_statement: true }
              as: CRAOfficer
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-01-01", evaluation_window_end: "2024-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
            - call: "POST /cra/exam-cycles/${ex_id}/begin-data-collection"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/begin-fieldwork"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/assign-preliminary-rating"
              payload: { lending_test_rating: "NEEDS_TO_IMPROVE", investment_test_rating: "SATISFACTORY", service_test_rating: "SATISFACTORY" }
              as: BankExaminer
          trigger:
            - call: "POST /cra/exam-cycles/${ex_id}/finalize"
              payload: {}
              as: BankExaminer
          assert:
            - "ExamCycle.${ex_id}.composite_points == 4.0 and composite_rating == NEEDS_TO_IMPROVE and status == FINALIZED"
            - "GET /cra/expansion-applications/${app_id}: status == DENIED and decision_reason == RATING_BLOCK"
            - "GET /cra/expansion-applications/${app_id}/branches: [0].id == ${br_id} and [0].status == WITHDRAWN"

      - name: branch_close_cascade_flips_public_file_posture
        grounds:
          - state_machines.Branch.OPEN_to_CLOSED
          - entities.PublicFile.fields.branch_list_current
          - entities.PublicFile.fields.posture
        distinguishing_aspect: |
          Depth-2+ chain from a different trigger (branch close, not exam
          finalize): Branch OPEN -> CLOSED causes PublicFile.branch_list_current
          := false, whose mutation causes PublicFile.posture to flip COMPLETE ->
          INCOMPLETE.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE; branch OPEN; PublicFile COMPLETE (disclosure refreshed)"
            - "Logical clock at default 2026-08-01T00:00:00Z; closure notice posted 2026-04-01 (122 days >= 90)"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-TC2", name: "Close Cascade Area", msa_code: "16980", state_code: "IL", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 1000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-C", assessment_area_id: "${aa_id}", census_tract: "T1", tract_income_level: "LOW" }
              as: BankExecutive
              captures: { br_id: $.data.id }
            - call: "POST /cra/branches/${br_id}/open"
              payload: {}
              as: BankExecutive
            - call: "POST /cra/public-files"
              payload: { bank_name: "Second Test Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { disclosure_statement: true }
              as: CRAOfficer
          trigger:
            - call: "POST /cra/branches/${br_id}/close"
              payload: { notice_posted_date: "2026-04-01" }
              as: BankExecutive
          assert:
            - "Branch.${br_id}.status == CLOSED and closed_date == 2026-08-01 (logical clock default)"
            - "GET /cra/public-files/${pf_id}: branch_list_current == false and posture == INCOMPLETE"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: resubmit_conflict_state_beats_referential
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_AREA_NOT_ACTIVE]
        distinguishing_aspect: |
          Error-category pair (state, business_referential): resubmitting an
          activity that is QUALIFIED (wrong from-state, priority 4) while its
          assessment area is RETIRED (referential, priority 8) must surface
          ERR_INVALID_STATE, not ERR_AREA_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Activity QUALIFIED; its assessment area subsequently RETIRED"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-PC1", name: "Conflict Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 10000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/community-development-activities"
              payload: { assessment_area_id: "${aa_id}", activity_type: "CD_SERVICE", amount_cents: 100000, primary_purpose_category: "COMMUNITY_SERVICES_LMI", lmi_benefit_pct: 0.60, activity_date: "2026-01-15" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { act_id: $.data.id }
            - call: "POST /cra/community-development-activities/${act_id}/review-decision"
              payload: { decision: "QUALIFY", allocation_method: "PRO_RATA" }
              as: QualificationReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cra/assessment-areas/${aa_id}/retire"
              payload: {}
              as: CRAOfficer
          trigger:
            - call: "POST /cra/community-development-activities/${act_id}/resubmit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 (state priority 4 beats business_referential priority 8)"
            - "CommunityDevelopmentActivity.${act_id}.status remains QUALIFIED"

      - name: review_decision_conflict_sod_beats_budget
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_CD_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_fiscal) — distinct
          from instance 1's (state, business_referential): a review-decision
          where the reviewer's user id equals the submitter's (SoD, priority 5)
          AND the qualified amount would exceed the area's CD budget (fiscal,
          priority 9) must surface ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE with annual_cd_budget_cents=100000"
            - "SUBMITTED activity amount 1000000 pct 0.60 (PRO_RATA would qualify 600000 > 100000 budget)"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-PC2", name: "SoD Area", msa_code: "19100", state_code: "TX", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 100000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/community-development-activities"
              payload: { assessment_area_id: "${aa_id}", activity_type: "CD_LOAN", amount_cents: 1000000, primary_purpose_category: "REVITALIZATION_STABILIZATION", lmi_benefit_pct: 0.60, activity_date: "2026-03-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { act_id: $.data.id }
          trigger:
            - call: "POST /cra/community-development-activities/${act_id}/review-decision"
              payload: { decision: "QUALIFY", allocation_method: "PRO_RATA" }
              as: QualificationReviewer
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES with http 422 (business_safety priority 5 beats business_fiscal priority 9)"
            - "CommunityDevelopmentActivity.${act_id}.status remains SUBMITTED and qualified_amount_cents == 0"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: composite_points_exactly_5_maps_satisfactory
        grounds:
          - calculations.exam_composite_rating
          - entities.ExamCycle.fields.composite_rating
        distinguishing_aspect: |
          Metric: composite_points on the assign-preliminary-rating endpoint.
          Band boundary is inclusive (>= 5.00): L=SATISFACTORY, I=SATISFACTORY,
          S=NEEDS_TO_IMPROVE computes exactly 5.00 and maps to SATISFACTORY,
          which then passes the expansion rating guard.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE; PublicFile COMPLETE; ExamCycle in FIELDWORK"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-BP1", name: "Boundary Area", msa_code: "12060", state_code: "GA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 1000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/public-files"
              payload: { bank_name: "Boundary Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { disclosure_statement: true }
              as: CRAOfficer
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-01-01", evaluation_window_end: "2024-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
            - call: "POST /cra/exam-cycles/${ex_id}/begin-data-collection"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/begin-fieldwork"
              payload: {}
              as: BankExaminer
          trigger:
            - call: "POST /cra/exam-cycles/${ex_id}/assign-preliminary-rating"
              payload: { lending_test_rating: "SATISFACTORY", investment_test_rating: "SATISFACTORY", service_test_rating: "NEEDS_TO_IMPROVE" }
              as: BankExaminer
          assert:
            - "ExamCycle.${ex_id}.composite_points == 5.0 (3 + 1.5 + 0.5)"
            - "ExamCycle.${ex_id}.composite_rating == SATISFACTORY (>= 5.00 inclusive)"

      - name: full_count_lmi_threshold_boundary_051
        grounds:
          - calculations.activity_qualified_amount
          - validations[priority=6]
          - errors[ERR_LMI_THRESHOLD_NOT_MET]
        distinguishing_aspect: |
          Metric: lmi_benefit_pct on the review-decision endpoint (different
          metric and different endpoint than instance 1). lmi_benefit_pct 0.51
          meets the FULL_COUNT threshold (>= 0.51 inclusive); 0.50 is rejected
          with ERR_LMI_THRESHOLD_NOT_MET.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE with budget 10000000; two SUBMITTED activities of 2000000 cents, pct 0.51 and 0.50"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-BP2", name: "Threshold Area", msa_code: "16980", state_code: "IL", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 10000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/community-development-activities"
              payload: { assessment_area_id: "${aa_id}", activity_type: "QUALIFIED_INVESTMENT", amount_cents: 2000000, primary_purpose_category: "AFFORDABLE_HOUSING", lmi_benefit_pct: 0.51, activity_date: "2026-01-10" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { act_hi: $.data.id }
            - call: "POST /cra/community-development-activities"
              payload: { assessment_area_id: "${aa_id}", activity_type: "QUALIFIED_INVESTMENT", amount_cents: 2000000, primary_purpose_category: "AFFORDABLE_HOUSING", lmi_benefit_pct: 0.50, activity_date: "2026-01-11" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { act_lo: $.data.id }
          trigger:
            - call: "POST /cra/community-development-activities/${act_hi}/review-decision"
              payload: { decision: "QUALIFY", allocation_method: "FULL_COUNT" }
              as: QualificationReviewer
              as_user_id: "reviewer-1"
            - call: "POST /cra/community-development-activities/${act_lo}/review-decision"
              payload: { decision: "QUALIFY", allocation_method: "FULL_COUNT" }
              as: QualificationReviewer
              as_user_id: "reviewer-1"
              captures: { err: $.data.error_id }
          assert:
            - "CommunityDevelopmentActivity.${act_hi}.status == QUALIFIED and qualified_amount_cents == 2000000"
            - "Second call rejected: error_id == ERR_LMI_THRESHOLD_NOT_MET with http 422; ${act_lo} remains SUBMITTED"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fieldwork_gated_by_public_file_posture
        grounds:
          - state_machines.ExamCycle.DATA_COLLECTION_to_FIELDWORK
          - entities.PublicFile.fields.posture
          - errors[ERR_PUBLIC_FILE_INCOMPLETE]
        distinguishing_aspect: |
          Entity pair ExamCycle -> PublicFile: begin-fieldwork is rejected
          while the PublicFile posture is INCOMPLETE and succeeds after the
          disclosure item is refreshed — the exam's valid transitions depend on
          a different entity's derived state.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE; ExamCycle in DATA_COLLECTION; PublicFile exists with disclosure_statement_present=false (posture INCOMPLETE)"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-XD1", name: "Gate Area", msa_code: "10180", state_code: "CA", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 1000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/public-files"
              payload: { bank_name: "Gate Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "INTERMEDIATE_SMALL_BANK", evaluation_window_start: "2024-01-01", evaluation_window_end: "2024-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
            - call: "POST /cra/exam-cycles/${ex_id}/begin-data-collection"
              payload: {}
              as: BankExaminer
          trigger:
            - call: "POST /cra/exam-cycles/${ex_id}/begin-fieldwork"
              payload: {}
              as: BankExaminer
              captures: { err: $.data.error_id }
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { disclosure_statement: true }
              as: CRAOfficer
            - call: "POST /cra/exam-cycles/${ex_id}/begin-fieldwork"
              payload: {}
              as: BankExaminer
          assert:
            - "First begin-fieldwork: error_id == ERR_PUBLIC_FILE_INCOMPLETE with http 422; exam remains DATA_COLLECTION"
            - "After refresh: GET /cra/public-files/${pf_id}.posture == COMPLETE"
            - "Second begin-fieldwork: ExamCycle.${ex_id}.status == FIELDWORK"

      - name: expansion_submit_gated_by_latest_exam_rating
        grounds:
          - state_machines.ExpansionApplication.DRAFT_to_SUBMITTED
          - entities.ExamCycle.fields.composite_rating
          - errors[ERR_RATING_BLOCKS_EXPANSION]
        distinguishing_aspect: |
          Entity pair ExpansionApplication -> ExamCycle (different pair than
          instance 1): submit is rejected because the latest FINALIZED exam's
          composite_rating is NEEDS_TO_IMPROVE.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE; PublicFile COMPLETE; exam FINALIZED with composite 4.0 NEEDS_TO_IMPROVE (L=N, I=S, S=S)"
            - "A MERGER expansion application in DRAFT"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-XD2", name: "Rating Gate Area", msa_code: "19100", state_code: "TX", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 1000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/public-files"
              payload: { bank_name: "Rating Gate Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { disclosure_statement: true }
              as: CRAOfficer
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-01-01", evaluation_window_end: "2024-12-31" }
              as: BankExaminer
              captures: { ex_id: $.data.id }
            - call: "POST /cra/exam-cycles/${ex_id}/begin-data-collection"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/begin-fieldwork"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/assign-preliminary-rating"
              payload: { lending_test_rating: "NEEDS_TO_IMPROVE", investment_test_rating: "SATISFACTORY", service_test_rating: "SATISFACTORY" }
              as: BankExaminer
            - call: "POST /cra/exam-cycles/${ex_id}/finalize"
              payload: {}
              as: BankExaminer
            - call: "POST /cra/expansion-applications"
              payload: { application_type: "MERGER", target_assessment_area_id: "${aa_id}" }
              as: BankExecutive
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /cra/expansion-applications/${app_id}/submit"
              payload: {}
              as: BankExecutive
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RATING_BLOCKS_EXPANSION with http 422"
            - "ExpansionApplication.${app_id}.status remains DRAFT"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: exam_window_closed_interval_date_sharing
        grounds:
          - validations[priority=6]
          - errors[ERR_EXAM_WINDOW_OVERLAP]
          - entities.ExamCycle.fields.evaluation_window_end
        distinguishing_aspect: |
          Closed-interval semantics on ExamCycle: a second window whose start
          date equals the first window's end date shares the calendar date
          2024-12-31 and conflicts; a start of 2025-01-01 shares no date and
          succeeds.
        test_recipe:
          setup:
            - "Exam E1 exists with closed window 2024-01-01..2024-12-31"
          setup_api_calls:
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-01-01", evaluation_window_end: "2024-12-31" }
              as: BankExaminer
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2024-12-31", evaluation_window_end: "2025-12-31" }
              as: BankExaminer
              captures: { err: $.data.error_id }
            - call: "POST /cra/exam-cycles"
              payload: { exam_type: "LARGE_BANK", evaluation_window_start: "2025-01-01", evaluation_window_end: "2025-12-31" }
              as: BankExaminer
              captures: { e3: $.data.id }
          assert:
            - "Overlap attempt: error_id == ERR_EXAM_WINDOW_OVERLAP with http 409 (closed interval shares 2024-12-31)"
            - "Adjacent attempt: 201 created; ExamCycle.${e3}.status == SCHEDULED"

      - name: area_period_half_open_adjacency_allowed
        grounds:
          - validations[priority=6]
          - errors[ERR_AREA_PERIOD_OVERLAP]
          - entities.AssessmentArea.fields.effective_end_date
        distinguishing_aspect: |
          Half-open [start, end) semantics on AssessmentArea (different
          resource and different interval semantics than instance 1): a new
          same-msa area starting exactly on the retired area's
          effective_end_date is allowed (end exclusive), while one starting
          before that date conflicts.
        test_recipe:
          setup:
            - "Area A (msa 10180) ACTIVE then RETIRED at the default clock 2026-08-01, so its window is [2023-01-01, 2026-08-01)"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-OL1", name: "Old Area", msa_code: "10180", state_code: "CA", census_tracts: ["T9"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 1000000 }
              as: CRAOfficer
              captures: { a_id: $.data.id }
            - call: "POST /cra/assessment-areas/${a_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/assessment-areas/${a_id}/retire"
              payload: {}
              as: CRAOfficer
          trigger:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-OL2", name: "Adjacent Area", msa_code: "10180", state_code: "CA", census_tracts: ["T8"], effective_start_date: "2026-08-01", annual_cd_budget_cents: 1000000 }
              as: CRAOfficer
              captures: { b_id: $.data.id }
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-OL3", name: "Overlapping Area", msa_code: "10180", state_code: "CA", census_tracts: ["T7"], effective_start_date: "2026-07-15", annual_cd_budget_cents: 1000000 }
              as: CRAOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Retired area ${a_id}.effective_end_date == 2026-08-01 (logical clock default)"
            - "New area at 2026-08-01: 201 created (half-open adjacency; ${b_id} DRAFT)"
            - "New area at 2026-07-15: error_id == ERR_AREA_PERIOD_OVERLAP with http 409"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: tract_partition_move_conserves_union
        grounds:
          - validations[priority=6]
          - errors[ERR_TRACT_OVERLAP]
          - entities.AssessmentArea.fields.census_tracts
        distinguishing_aspect: |
          Conserved quantity: count of distinct census tracts across all
          non-RETIRED areas. Moving T1 from area A (UNDER_REVIEW) to area B
          (DRAFT) requires the compensating pair remove-then-add; adding to B
          while A still holds T1 is rejected, and the distinct-tract union
          stays at 3 throughout.
        test_recipe:
          setup:
            - "Area A tracts [T1, T2], status UNDER_REVIEW; Area B tracts [T3], status DRAFT; union size 3"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-CI1", name: "Tract Area A", msa_code: "12060", state_code: "GA", census_tracts: ["T1", "T2"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 1000000 }
              as: CRAOfficer
              captures: { a_id: $.data.id }
            - call: "POST /cra/assessment-areas/${a_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/assessment-areas/${a_id}/begin-review"
              payload: {}
              as: CRAOfficer
              captures: { a_v: $.data.version }
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-CI2", name: "Tract Area B", msa_code: "12060", state_code: "GA", census_tracts: ["T3"], effective_start_date: "2024-01-01", annual_cd_budget_cents: 1000000 }
              as: CRAOfficer
              captures: { b_id: $.data.id, b_v: $.data.version }
          trigger:
            - call: "PATCH /cra/assessment-areas/${b_id}"
              payload: { expected_assessment_area_version: "${b_v}", census_tracts: ["T3", "T1"] }
              as: CRAOfficer
              captures: { err: $.data.error_id }
            - call: "PATCH /cra/assessment-areas/${a_id}"
              payload: { expected_assessment_area_version: "${a_v}", census_tracts: ["T2"] }
              as: CRAOfficer
            - call: "PATCH /cra/assessment-areas/${b_id}"
              payload: { expected_assessment_area_version: "${b_v}", census_tracts: ["T3", "T1"] }
              as: CRAOfficer
          assert:
            - "First PATCH on B rejected: error_id == ERR_TRACT_OVERLAP with http 409 (T1 still held by UNDER_REVIEW area A)"
            - "After remove+add: A.census_tracts == [T2]; B.census_tracts == [T3, T1]"
            - "Distinct-tract union across A and B == {T1, T2, T3}, size 3 — identical to before the move (no drift)"

      - name: public_file_checklist_count_conserved
        grounds:
          - entities.PublicFile.fields.posture
          - entities.PublicFile.fields.branch_list_current
          - state_machines.Branch.OPEN_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity (different type than instance 1's tract-set
          cardinality): REQUIRED_ITEM_COUNT == 3 == items_present +
          items_missing at every step. The forward action (branch close) and
          its compensating action (refresh-items) leave the checklist sum
          unchanged and restore posture to COMPLETE.
        test_recipe:
          setup:
            - "AssessmentArea ACTIVE; branch OPEN; PublicFile COMPLETE with all 3 items present"
          setup_api_calls:
            - call: "POST /cra/assessment-areas"
              payload: { area_code: "AA-CI3", name: "Checklist Area", msa_code: "16980", state_code: "IL", census_tracts: ["T1"], effective_start_date: "2023-01-01", annual_cd_budget_cents: 1000000 }
              as: CRAOfficer
              captures: { aa_id: $.data.id }
            - call: "POST /cra/assessment-areas/${aa_id}/activate"
              payload: {}
              as: CRAOfficer
            - call: "POST /cra/branches"
              payload: { branch_code: "BR-CI", assessment_area_id: "${aa_id}", census_tract: "T1", tract_income_level: "MIDDLE" }
              as: BankExecutive
              captures: { br_id: $.data.id }
            - call: "POST /cra/branches/${br_id}/open"
              payload: {}
              as: BankExecutive
            - call: "POST /cra/public-files"
              payload: { bank_name: "Checklist Bank" }
              as: CRAOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { disclosure_statement: true }
              as: CRAOfficer
          trigger:
            - call: "POST /cra/branches/${br_id}/close"
              payload: { notice_posted_date: "2026-04-01" }
              as: BankExecutive
            - call: "POST /cra/public-files/${pf_id}/refresh-items"
              payload: { branch_list: true }
              as: CRAOfficer
          assert:
            - "Immediately after close: GET /cra/public-files/${pf_id} shows branch_list_current == false, posture == INCOMPLETE (present 2 + missing 1 == 3)"
            - "After compensating refresh: branch_list_current == true, posture == COMPLETE (present 3 + missing 0 == 3)"
            - "REQUIRED_ITEM_COUNT invariant present+missing == 3 holds at every observed step; net drift of the forward+compensating pair is zero"
