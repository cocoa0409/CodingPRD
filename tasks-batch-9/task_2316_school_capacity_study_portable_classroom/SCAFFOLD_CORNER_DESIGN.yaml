      - name: portable_unit_condition_dimension_moves_while_allocation_holds
        claim_type: parallel
        grounds: [state_machines.PortableUnit, complexity_profile.state_machine_shape]
        distinguishing_aspect: "The unit carries two independent status dimensions. Downgrading a RESERVED unit to NEEDS_REHAB must change only the condition dimension - the reservation, the owning request and the pad are untouched - and restoring it to SERVICEABLE must not disturb the allocation either. Only the UNSAFE arm has cross-dimension consequences, so an implementation that collapses the two dimensions into one status field cannot express this state at all."
        test_recipe:
          setup: ["campus with a certified study, an assessed pad, an appropriation and a DRAFT placement request holding one unit, so that unit is RESERVED"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
