      - name: an_undeclared_trigger_for_the_current_state_is_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Permit.administrative_status.transitions
          - state_machines.PermitApplication.terminal_states
          - state_machines.OperatingPlan.transitions
          - state_machines.NoncomplianceAction.transitions
          - validations[ERR_PERMIT_NOT_OPERATIONAL]
          - validations[ERR_INVALID_APPLICATION_STATE]
          - validations[ERR_INVALID_PLAN_STATE]
          - validations[ERR_ACTION_NOT_APPEALABLE]
        distinguishing_aspect: |
          For every machine, a trigger that is not declared FROM the row's current state is refused with
          that machine's own state error — including triggers that would be perfectly legal one state
          later. Suspending or reinstating a permit that is merely ISSUED, denying or withdrawing an
          application that already produced a permit, reviewing or approving a plan still in DRAFT, and
          deciding an appeal that was never filed are four separate 409 dialects, not one generic error.
        test_recipe:
          setup:
            - "canonical BRW-01 chain: Alpine holds ISSUED permit ${p_id} from application ${app_id}"
