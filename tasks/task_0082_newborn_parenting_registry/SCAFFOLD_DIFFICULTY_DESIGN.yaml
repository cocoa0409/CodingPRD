          - validations[priority=13]
        distinguishing_aspect: |
          Numeric-threshold boundary on the mark-discharge-ready endpoint: discharge_readiness_score
          of exactly 70 (weight 2500g=40, no feeding=0, no open NICU=20, birth-cert SUBMITTED=10)
          satisfies the inclusive >= 70 gate, so the transition succeeds. 69 would fail.
        test_recipe:
          setup:
            - "Clock at 2026-03-05T12:00:00Z."
