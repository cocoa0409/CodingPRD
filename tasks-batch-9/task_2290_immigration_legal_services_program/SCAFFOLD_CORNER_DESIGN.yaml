              payload: { matter_id: "${matter_id}", event_type: "FACILITY_VISIT", starts_at_utc: "2026-08-05T08:59:59.999Z", ends_at_utc: "2026-08-05T10:00:00.000Z", location_code: "TX-ELP-DET", facility_id: "${facility_id}", assigned_representative_id: "${atty_a_id}", client_conflict_waived: true }
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "FACILITY_VISIT", starts_at_utc: "2026-08-05T09:00:00.000Z", ends_at_utc: "2026-08-05T10:00:00.000Z", location_code: "TX-ELP-DET", facility_id: "${facility_id}", assigned_representative_id: "${atty_b_id}", client_conflict_waived: true }
              as: ProgramDirector
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "FACILITY_VISIT", starts_at_utc: "2026-08-05T09:00:00.000Z", ends_at_utc: "2026-08-05T10:00:00.000Z", location_code: "TX-ELP-DET", facility_id: "${facility_id}", assigned_representative_id: "${atty_a_id}", client_conflict_waived: true }
              as: ProgramDirector
              captures: { v1: "$.data.id" }
            - call: "POST /calendar-events"
              payload: { matter_id: "${matter_id}", event_type: "FACILITY_VISIT", starts_at_utc: "2026-08-05T20:00:00.000Z", ends_at_utc: "2026-08-05T21:00:00.000Z", location_code: "TX-ELP-DET", facility_id: "${facility_id}", assigned_representative_id: "${screener_id}", client_conflict_waived: true }
              as: ProgramDirector
