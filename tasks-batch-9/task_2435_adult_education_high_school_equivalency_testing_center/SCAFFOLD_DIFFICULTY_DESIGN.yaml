scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: msg_variant_best_post_vs_latest_post_diverges
        grounds:
          - calculations.msg_determination
          - entities.TestEvent.fields.efl_level
          - entities.OutcomeRecord.fields.measure_type
          - validations[priority=64]
          - errors[ERR_MSG_NOT_SUPPORTED]
        distinguishing_aspect: |
          Dual variant on the Student/TestEvent assessment domain: BEST_POST selects the highest
          post-test in the funding window and reports msg_achieved true, while LATEST_POST selects
          the chronologically last post-test on the SAME rows and reports msg_achieved false, so
          EFL_GAIN certification is refused even though the programmatic view shows a gain.
        test_recipe:
          setup:
            - "FundingPeriod 2026-08-01..2026-12-31 open."
            - "Student ORIENTED then PLACED at EFL level 2 by a scored PRE_TEST (CASAS_R_900 scale 205) dated 2026-08-03T09:00:00Z."
            - "Enrollment on an OPEN HSE_PREP section with 40.00 posted hours."
            - "Two scored POST_TESTs in the window: 2026-09-02 scale 225 (EFL 4) and 2026-09-05 scale 208 (EFL 2) - a regression."
            - "One RECORDED EFL_GAIN OutcomeRecord for the student in that period."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: { label: "PY2026", start_date: "2026-08-01", end_date: "2026-12-31", rate_cents_per_weight: 10000, total_cents: 100000 }
              as: StateAuthority
              captures: { fp: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Ada Learner", email: "ada@x.test", primary_track: "HSE_PREP", self_pay_authorized: true }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-03T09:00:00Z" }
              as: Registrar
              captures: { te_pre: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: StateAuthority
            - call: "POST /test-events/${te_pre}/score"
              payload: { scale_score: 205 }
              as: Instructor
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "HSE Evening", instructor_user_id: "instructor-1", min_efl_level: 1, max_efl_level: 6, seats_total: 20, weekly_hours: 6.00 }
              as: ProgramCoordinator
              captures: { sec: $.data.id }
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
            - call: "POST /enrollments"
              payload: { student_id: "${s}", class_section_id: "${sec}" }
              as: ProgramCoordinator
              captures: { e: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-07T12:00:00Z" }
              as: StateAuthority
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-03", hours: 8.00 }
              as: Instructor
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-04", hours: 8.00 }
              as: Instructor
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-05", hours: 8.00 }
              as: Instructor
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-06", hours: 8.00 }
              as: Instructor
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-07", hours: 8.00 }
              as: Instructor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T09:00:00Z" }
              as: StateAuthority
            - call: "POST /test-events"
              payload: { student_id: "${s}", enrollment_id: "${e}", purpose: "POST_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-09-02T10:00:00Z" }
              as: Registrar
              captures: { te_p1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T11:00:00Z" }
              as: StateAuthority
            - call: "POST /test-events/${te_p1}/score"
              payload: { scale_score: 225 }
              as: Instructor
            - call: "POST /test-events"
              payload: { student_id: "${s}", enrollment_id: "${e}", purpose: "POST_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-09-05T10:00:00Z" }
              as: Registrar
              captures: { te_p2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T10:00:00Z" }
              as: StateAuthority
            - call: "POST /test-events/${te_p2}/score"
              payload: { scale_score: 208 }
              as: Instructor
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp}", measure_type: "EFL_GAIN", evidence_ref: "NRS-EFL-0001" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { o: $.data.id }
          trigger:
            - call: "GET /students/${s}/skill-gain"
              payload: { variant: "BEST_POST", funding_period_id: "${fp}" }
              as: ProgramCoordinator
            - call: "GET /students/${s}/skill-gain"
              payload: { variant: "LATEST_POST", funding_period_id: "${fp}" }
              as: ProgramCoordinator
            - call: "POST /outcome-records/${o}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
          assert:
            - "GET skill-gain variant=BEST_POST returns 200 with data.entry_efl_level == 2, data.post_efl_level == 4, data.best_post_scale_score == 225, data.levels_gained == 2, data.msg_achieved == true"
            - "GET skill-gain variant=LATEST_POST returns 200 with data.entry_efl_level == 2, data.post_efl_level == 2, data.latest_post_scale_score == 208, data.levels_gained == 0, data.msg_achieved == false"
            - "POST /outcome-records/${o}/certification returns 409 with data.error_id == ERR_MSG_NOT_SUPPORTED because certification uses the LATEST_POST variant"
            - "OutcomeRecord.${o}.status remains RECORDED and certified_by_user_id remains null"

      - name: funding_allocation_provisional_vs_final_diverges
        grounds:
          - calculations.funding_allocation
          - entities.FundingPeriod.fields.committed_cents
          - entities.OutcomeRecord.fields.allocation_status
          - concurrency_rules[allocation-run-stale-period]
        distinguishing_aspect: |
          Dual variant on the FundingPeriod/OutcomeRecord fiscal domain (a different entity domain and
          metric than msg_determination): PROVISIONAL admits RECORDED lines and projects 26500 cents,
          FINAL admits only CERTIFIED lines and projects 12500 cents from identical rows.
        test_recipe:
          setup:
            - "FundingPeriod PY2026 OPEN with rate_cents_per_weight 10000 and total_cents 100000."
            - "Student A with a CERTIFIED EMPLOYMENT_Q2 outcome (weight 1.25) recorded by coord-1 and certified by state-1."
            - "Student A with a RECORDED POSTSECONDARY_ENROLLMENT outcome (weight 1.40), never certified."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: { label: "PY2026", start_date: "2026-08-01", end_date: "2026-12-31", rate_cents_per_weight: 10000, total_cents: 100000 }
              as: StateAuthority
              captures: { fp: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Ben Learner", email: "ben@x.test", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp}", measure_type: "EMPLOYMENT_Q2", evidence_ref: "WAGE-Q2-0001" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { o_emp: $.data.id }
            - call: "POST /outcome-records/${o_emp}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "POST /outcome-records"
              payload: { student_id: "${s}", funding_period_id: "${fp}", measure_type: "POSTSECONDARY_ENROLLMENT", evidence_ref: "NSC-0001" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { o_post: $.data.id }
            - call: "GET /funding-periods/${fp}"
              payload: {}
              as: StateAuthority
              captures: { fp_v: $.data.version }
          trigger:
            - call: "GET /funding-periods/${fp}/allocation-preview"
              payload: { variant: "PROVISIONAL" }
              as: StateAuthority
            - call: "GET /funding-periods/${fp}/allocation-preview"
              payload: { variant: "FINAL" }
              as: StateAuthority
            - call: "POST /funding-periods/${fp}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${fp_v}" }
              as: StateAuthority
          assert:
            - "allocation-preview variant=PROVISIONAL returns 200 with data.line_count == 2, data.total_weight == 2.65, data.projected_committed_cents == 26500, data.projected_available_cents == 73500"
            - "allocation-preview variant=FINAL returns 200 with data.line_count == 1, data.total_weight == 1.25, data.projected_committed_cents == 12500, data.projected_available_cents == 87500"
            - "allocation-run variant=FINAL returns 200 with data.committed_cents == 12500, data.available_cents == 87500, data.allocation_run_count == 1, data.last_allocation_variant == FINAL"
            - "OutcomeRecord.${o_emp}.allocated_cents == 12500 and allocation_status == COMMITTED"
            - "OutcomeRecord.${o_post}.allocated_cents == 0 and allocation_status == UNALLOCATED"

  - rule_id: combinatorial_formula
    instances:
      - name: exam_fee_tiered_retake_surcharge_voucher_chain
        mode: a
        grounds:
          - calculations.exam_fee_assessment
          - entities.ExamRegistration.fields.gross_fee_cents
          - entities.Student.fields.voucher_balance_cents
          - endpoints[POST /exam-registrations]
        distinguishing_aspect: |
          Mode a - four independent inputs (session subtest, prior scored attempts on the same
          subtest, granted alternate format, and the student's cumulative instructional hours)
          combine non-linearly through a pinned nine-step order: the retake exponent multiplies the
          base, the alt-format surcharge is added AFTER that multiplication, the hour tier discount
          floors the sum of both, and only the residue draws down the voucher.
        test_recipe:
          setup:
            - "FULL_AUTHORIZED center with room R1 (buffer 45) and a certified proctor (cap 8.00)."
            - "Self-pay-authorized student PLACED at EFL 2 by a PRE_TEST scored 205 on 2026-08-03."
            - "First RLA sitting on 2026-08-04 registered at 0 hours and 0 voucher, then scored 150 (prior_scored_attempts becomes 1)."
            - "24.00 posted instructional hours (25% tier), an APPROVED BRAILLE accommodation, and a 2000-cent voucher grant."
            - "Second RLA sitting on 2026-08-06 whose supported_formats include BRAILLE."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Northside Testing Center", state_code: "OH" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R1", seat_capacity: 10, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Pat Proctor", daily_hour_cap: 8.00 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
            - call: "POST /students"
              payload: { full_name: "Cleo Learner", email: "cleo@x.test", primary_track: "HSE_PREP", self_pay_authorized: true }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-03T09:00:00Z" }
              as: Registrar
              captures: { te_pre: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: StateAuthority
            - call: "POST /test-events/${te_pre}/score"
              payload: { scale_score: 205 }
              as: Instructor
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "RLA", starts_at: "2026-08-04T09:00:00Z", ends_at: "2026-08-04T11:00:00Z", requested_seats: 5, supported_formats: ["STANDARD"] }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess_a: $.data.id }
            - call: "POST /exam-sessions/${sess_a}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess_a_v: $.data.version }
            - call: "POST /exam-registrations"
              payload: { student_id: "${s}", exam_session_id: "${sess_a}", expected_exam_session_version: "${sess_a_v}" }
              as: Registrar
              captures: { reg_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T09:00:00Z" }
              as: StateAuthority
            - call: "POST /exam-registrations/${reg_a}/identity-verification"
              payload: { decision: "VERIFIED", identity_document_type: "STATE_ID" }
              as: Proctor
              as_user_id: "${p}"
            - call: "POST /exam-registrations/${reg_a}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "${p}"
            - call: "POST /exam-registrations/${reg_a}/result"
              payload: { scale_score: 150 }
              as: Proctor
              as_user_id: "${p}"
            - call: "POST /class-sections"
              payload: { program_track: "HSE_PREP", title: "HSE Morning", instructor_user_id: "instructor-1", min_efl_level: 1, max_efl_level: 6, seats_total: 20, weekly_hours: 6.00 }
              as: ProgramCoordinator
              captures: { sec: $.data.id }
            - call: "POST /class-sections/${sec}/status-transition"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
            - call: "POST /enrollments"
              payload: { student_id: "${s}", class_section_id: "${sec}" }
              as: ProgramCoordinator
              captures: { e: $.data.id }
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-02", hours: 8.00 }
              as: Instructor
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-03", hours: 8.00 }
              as: Instructor
            - call: "POST /enrollments/${e}/attendance-entries"
              payload: { attendance_date: "2026-08-04", hours: 8.00 }
              as: Instructor
            - call: "POST /accommodation-requests"
              payload: { student_id: "${s}", requested_format: "BRAILLE", documentation_ref: "DOC-BR-1" }
              as: Registrar
              captures: { ar: $.data.id }
            - call: "POST /accommodation-requests/${ar}/decision"
              payload: { decision: "APPROVE", granted_format: "BRAILLE", valid_until: "2026-12-31T00:00:00Z" }
              as: CenterAdministrator
              as_user_id: "${c}"
            - call: "POST /students/${s}/voucher-adjustments"
              payload: { delta_cents: 2000 }
              as: ProgramCoordinator
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "RLA", starts_at: "2026-08-06T13:00:00Z", ends_at: "2026-08-06T15:00:00Z", requested_seats: 5, supported_formats: ["STANDARD", "BRAILLE"] }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess_b: $.data.id }
            - call: "POST /exam-sessions/${sess_b}/proctor-assignment"
              payload: { proctor_id: "${p}" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess_b_v: $.data.version }
          trigger:
            - call: "POST /exam-registrations"
              payload: { student_id: "${s}", exam_session_id: "${sess_b}", expected_exam_session_version: "${sess_b_v}", accommodation_request_id: "${ar}" }
              as: Registrar
              captures: { reg_b: $.data.id }
          assert:
            - "POST /exam-registrations returns 201 with data.prior_scored_attempts == 1"
            - "data.gross_fee_cents == 4250 (3400 base * 1.25 retake, round_half_up)"
            - "data.accommodation_surcharge_cents == 1200"
            - "data.discount_cents == 1362 (floor of 25% of 5450, not 25% of 4250)"
            - "data.voucher_applied_cents == 2000 and data.fee_due_cents == 2088"
            - "GET /students/${s} shows voucher_balance_cents == 0, voucher_spent_cents == 2000, exam_fee_owed_cents == 5488"
            - "first registration ${reg_a} still shows gross_fee_cents == 3400, discount_cents == 0, voucher_applied_cents == 0, fee_due_cents == 3400"

      - name: allocation_round_per_line_then_sum_pinned
        mode: b
        grounds:
          - calculations.funding_allocation
          - entities.FundingPeriod.fields.committed_cents
          - endpoints[POST /funding-periods/{periodId}/allocation-run]
        distinguishing_aspect: |
          Mode b - rounding-order sensitivity. With rate_cents_per_weight 33333 and two
          EMPLOYMENT_Q2 lines (weight 1.25) each line rounds 41666.25 down to 41666 and the sum is
          83332; summing the weights first (2.50 * 33333 = 83332.5) and rounding once yields 83333.
          The one-cent divergence is the entire point of the pinned order.
        test_recipe:
          setup:
            - "FundingPeriod PY2026 OPEN, rate_cents_per_weight 33333, total_cents 1000000."
            - "Two students each with one CERTIFIED EMPLOYMENT_Q2 outcome recorded by coord-1 and certified by state-1."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: { label: "PY2026", start_date: "2026-08-01", end_date: "2026-12-31", rate_cents_per_weight: 33333, total_cents: 1000000 }
              as: StateAuthority
              captures: { fp: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Dana Learner", email: "dana@x.test", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Eli Learner", email: "eli@x.test", primary_track: "HSE_PREP" }
              as: ProgramCoordinator
              captures: { s2: $.data.id }
            - call: "POST /outcome-records"
              payload: { student_id: "${s1}", funding_period_id: "${fp}", measure_type: "EMPLOYMENT_Q2", evidence_ref: "WAGE-1" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { o1: $.data.id }
            - call: "POST /outcome-records/${o1}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "POST /outcome-records"
              payload: { student_id: "${s2}", funding_period_id: "${fp}", measure_type: "EMPLOYMENT_Q2", evidence_ref: "WAGE-2" }
              as: ProgramCoordinator
              as_user_id: "coord-1"
              captures: { o2: $.data.id }
            - call: "POST /outcome-records/${o2}/certification"
              payload: { decision: "CERTIFY" }
              as: StateAuthority
              as_user_id: "state-1"
            - call: "GET /funding-periods/${fp}"
              payload: {}
              as: StateAuthority
              captures: { fp_v: $.data.version }
          trigger:
            - call: "GET /funding-periods/${fp}/allocation-preview"
              payload: { variant: "FINAL" }
              as: StateAuthority
            - call: "POST /funding-periods/${fp}/allocation-run"
              payload: { variant: "FINAL", expected_funding_period_version: "${fp_v}" }
              as: StateAuthority
          assert:
            - "allocation-preview returns 200 with data.total_weight == 2.50, data.line_count == 2, data.projected_committed_cents == 83332"
            - "allocation-run returns 200 with data.committed_cents == 83332 and data.available_cents == 916668"
            - "committed_cents is NOT 83333, which is what sum-the-weights-then-round-once would produce"
            - "OutcomeRecord ${o1}.allocated_cents == 41666 and ${o2}.allocated_cents == 41666, both allocation_status == COMMITTED"

      - name: transcript_charge_waiver_then_state_fee_order
        mode: c
        grounds:
          - calculations.transcript_charge
          - calculations.credential_eligibility
          - endpoints[POST /students/{studentId}/transcript-orders]
          - entities.TranscriptOrder.fields.total_charge_cents
        distinguishing_aspect: |
          Mode c - circular-looking dependency. The waiver tier is keyed on the order total and the
          order total includes a state-records fee that is itself keyed on the post-waiver total.
          The loop is cut by pinning base -> waiver -> net -> state fee, so a 2-copy standard order
          totals 2900; feeding the state fee back into the tier decision would produce 3150.
        test_recipe:
          setup:
            - "FULL_AUTHORIZED center, room R1 (buffer 45), proctor with daily_hour_cap 12.00, certified to 2027-01-01."
            - "Self-pay student PLACED at EFL 2 (PRE_TEST 205 on 2026-08-03)."
            - "Four sittings on 2026-08-10 in R1 at 08:00-10:00 (MATH), 10:45-12:45 (RLA), 13:30-15:30 (SCIENCE), 16:15-18:15 (SOCIAL_STUDIES), each proctored and each scored 150."
            - "Credential issued: subtest_scores 150 x 4, composite_score 600 >= 580."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Eastside Testing Center", state_code: "OH" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R1", seat_capacity: 10, turnaround_buffer_minutes: 45 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
            - call: "POST /testing-centers/${c}/proctors"
              payload: { full_name: "Quinn Proctor", daily_hour_cap: 12.00 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { p: $.data.id }
            - call: "POST /proctors/${p}/certification-decision"
              payload: { decision: "CERTIFY", certification_expires_at: "2027-01-01T00:00:00Z" }
              as: StateAuthority
            - call: "POST /students"
              payload: { full_name: "Finn Learner", email: "finn@x.test", primary_track: "HSE_PREP", self_pay_authorized: true }
              as: ProgramCoordinator
              captures: { s: $.data.id }
            - call: "POST /students/${s}/orientation-completion"
              payload: {}
              as: Registrar
            - call: "POST /test-events"
              payload: { student_id: "${s}", purpose: "PRE_TEST", test_form: "CASAS_R_900", scheduled_for: "2026-08-03T09:00:00Z" }
              as: Registrar
              captures: { te_pre: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
