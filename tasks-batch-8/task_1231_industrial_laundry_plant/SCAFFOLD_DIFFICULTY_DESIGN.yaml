              captures: { b_id: $.data.id }
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_id}", pieces: 20, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/lock"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/post"
              payload: {}
