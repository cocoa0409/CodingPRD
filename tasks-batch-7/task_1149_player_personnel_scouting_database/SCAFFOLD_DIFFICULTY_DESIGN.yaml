scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: normalized_grade_provisional_vs_final
        grounds:
          - calculations.normalized_grade
          - entities.Scout.fields.locked_grade_mean
          - state_machines.ScoutingReport.SUBMITTED_to_LOCKED
        distinguishing_aspect: |
          Identical raw_grade 7.00 yields normalized_grade 6.50 for a scout without
          locked offseason stats (provisional variant: mean 6.00, stdev 1.00) and 7.00
          for a scout with locked stats (final variant: mean 6.00, stdev 0.75) —
          same report data, different variants, on the ScoutingReport/Prospect domain.
        test_recipe:
          setup:
            - "scout1 AREA with season stats mean 6.00 stdev 1.00 and no locked stats (provisional)"
            - "scout2 AREA with season stats mean 6.00 stdev 1.00 and locked stats mean 6.00 stdev 0.75 (final)"
            - "one DIRECTOR scout to lock; two prospects each with one report raw_grade 7.00, submitted and locked"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "Prov Scout", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Fin Scout", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00, locked_grade_mean: 6.00, locked_grade_stdev: 0.75 }
              as: GeneralManager
              captures: { s2: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Dir One", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Prospect A", position: "QB", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Prospect B", position: "QB", college: "Tech" }
              as: AreaScout
              as_user_id: "${s2}"
              captures: { p2: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/prospects/${p2}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s2}"
              captures: { r2: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r2}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s2}"
          trigger:
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { n1: $.data.normalized_grade }
            - call: "POST /scouting/reports/${r2}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { n2: $.data.normalized_grade }
          assert:
            - "report ${r1} normalized_grade == 6.50 (provisional: 5.0 + 1.5*(7.00-6.00)/1.00)"
            - "report ${r2} normalized_grade == 7.00 (final: 5.0 + 1.5*(7.00-6.00)/0.75)"
            - "${n1} != ${n2} for identical raw_grade 7.00"

      - name: scout_accuracy_rmse_vs_hit_rate
        grounds:
          - calculations.scout_evaluation
          - entities.OutcomeRecord.fields.outcome_percentile
        distinguishing_aspect: |
          Same two locked reports (normalized 8.00 with outcome percentile 90, and 6.00
          with percentile 50) yield rmse_accuracy 90.00 but hit_rate_accuracy 100.00 —
          two variants of the same scout-evaluation read, on the Scout domain (different
          entity domain from normalized_grade's report/prospect domain).
        test_recipe:
          setup:
            - "scout s AREA, season stats mean 6.00 stdev 1.50, no locked stats"
            - "prospect p1 with locked report raw 9.00 (normalized 8.00), DRAFTED, outcome percentile 90"
            - "prospect p2 with locked report raw 7.00 (normalized 6.00), DRAFTED, outcome percentile 50"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "Eval Scout", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.50 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Dir One", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Hit Guy", position: "WR", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Miss Guy", position: "WR", college: "Tech" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p2: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 9.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/prospects/${p2}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r2: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r2}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/reports/${r2}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p2}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p2}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/mark-drafted"
              payload: {}
              as: GeneralManager
            - call: "POST /scouting/prospects/${p2}/mark-drafted"
              payload: {}
              as: GeneralManager
            - call: "POST /scouting/prospects/${p1}/outcomes"
              payload: { season_year: 2026, games_started: 16, pro_bowl: true, outcome_percentile: 90 }
              as: GeneralManager
            - call: "POST /scouting/prospects/${p2}/outcomes"
              payload: { season_year: 2026, games_started: 8, pro_bowl: false, outcome_percentile: 50 }
              as: GeneralManager
          trigger:
            - call: "GET /scouting/scouts/${s1}/evaluation"
              as: GeneralManager
              captures: { rmse: $.data.rmse_accuracy, hit: $.data.hit_rate_accuracy, cnt: $.data.evaluated_report_count }
          assert:
            - "evaluated_report_count == 2"
            - "rmse_accuracy == 90.00 (errors -1.0 and +1.0 -> RMSE 1.0 -> 100 - 10*1.0)"
            - "hit_rate_accuracy == 100.00 (one prediction >= 7.00, outcome 90 >= 70 -> 1/1)"
            - "rmse_accuracy != hit_rate_accuracy over identical inputs"

  # =========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fit_score_multi_input_interaction
        grounds:
          - calculations.fit_score
          - entities.DraftBoardEntry.fields.fit_score
        distinguishing_aspect: |
          Mode (a): four inputs (need base 70 from P2, scheme_fit 0.90, resolved HIGH
          medical multiplier 0.8, open CHARACTER deduction 15) interact non-linearly
          with min/max clamps: round2(min(100, max(0, 70*0.9*0.8 - 15))) = 35.40.
        test_recipe:
          setup:
            - "scout s1 (mean 6.00, stdev 1.00), director d1"
            - "OPEN RosterNeed P2 for QB season 2026"
            - "prospect p1 QB with LOCKED report (raw 7.00, scheme_fit 0.90), flag_status UNDER_REVIEW: one RESOLVED HIGH MEDICAL flag and one OPEN LOW CHARACTER flag"
            - "prospect advanced EVALUATED then BOARD_READY"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "Fit Scout", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Dir One", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/roster-needs"
              payload: { season_year: 2026, position: "QB", priority_tier: "P2" }
              as: GeneralManager
            - call: "POST /scouting/prospects"
              payload: { full_name: "Fit Prospect", position: "QB", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 0.90 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/flags"
              payload: { flag_type: "MEDICAL", severity: "HIGH", detail: "knee repair history" }
              as: MedicalStaff
              captures: { fmed: $.data.id }
            - call: "POST /scouting/flags/${fmed}/acknowledge"
              payload: {}
              as: MedicalStaff
            - call: "POST /scouting/flags/${fmed}/resolve"
              payload: { resolution_note: "cleared with note" }
              as: MedicalStaff
            - call: "POST /scouting/prospects/${p1}/flags"
              payload: { flag_type: "CHARACTER", severity: "LOW", detail: "missed one meeting" }
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p1}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { e1: $.data.id, fit: $.data.fit_score }
          assert:
            - "entry ${e1}.fit_score == 35.40"
            - "prospect ${p1}.composite_grade == 6.50 and tier == T3"
            - "prospect ${p1}.flag_status == UNDER_REVIEW (open CHARACTER flag)"

      - name: composite_round_per_contribution_then_sum
        grounds:
          - calculations.composite_prospect_grade
          - entities.Prospect.fields.composite_grade
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — round each weighted contribution
          to 2 decimals first, then sum, then round: 0.6*6.67 -> 4.00 and 0.4*7.36 -> 2.94
          sum to 6.94; the forbidden sum-then-round order would give round2(6.946) = 6.95.
        test_recipe:
          setup:
            - "scoutA AREA weight 1.5, season stats mean 6.00 stdev 2.00; report raw 8.23 -> normalized 6.67"
            - "scoutB AREA weight 1.0, season stats mean 6.00 stdev 1.00; report raw 7.57 -> normalized 7.36"
            - "one prospect with both reports LOCKED (normalized weights 0.6 / 0.4)"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "Scout A", level: "AREA", weight: 1.5, season_grade_mean: 6.00, season_grade_stdev: 2.00 }
              as: GeneralManager
              captures: { sa: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Scout B", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { sb: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Dir One", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Round Prospect", position: "OT", college: "State U" }
              as: AreaScout
              as_user_id: "${sa}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 8.23, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${sa}"
              captures: { ra: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.57, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${sb}"
              captures: { rb: $.data.id }
            - call: "POST /scouting/reports/${ra}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${sa}"
            - call: "POST /scouting/reports/${rb}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${sb}"
            - call: "POST /scouting/reports/${ra}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { na: $.data.normalized_grade }
          trigger:
            - call: "POST /scouting/reports/${rb}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { nb: $.data.normalized_grade }
            - call: "GET /scouting/prospects/${p1}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { comp: $.data.composite_grade, tier: $.data.tier }
          assert:
            - "report ${ra} normalized_grade == 6.67"
            - "report ${rb} normalized_grade == 7.36"
            - "prospect ${p1}.composite_grade == 6.94 (per-contribution rounding), NOT 6.95 (sum-then-round)"
            - "prospect ${p1}.tier == T3"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: report_revision_cycle
        grounds:
          - state_machines.ScoutingReport.DRAFT_to_SUBMITTED
          - state_machines.ScoutingReport.SUBMITTED_to_RETURNED
          - state_machines.ScoutingReport.RETURNED_to_SUBMITTED
          - state_machines.ScoutingReport.SUBMITTED_to_LOCKED
        distinguishing_aspect: |
          ScoutingReport supports a cyclic revision loop DRAFT -> SUBMITTED -> RETURNED
          -> SUBMITTED -> LOCKED; the cycle is on the report entity.
        test_recipe:
          setup:
            - "scout s1 and director d1 exist; prospect p1 with one DRAFT report by s1"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "Cycle Scout", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Dir One", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Cycle Prospect", position: "CB", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
              captures: { st1: $.data.status }
            - call: "POST /scouting/reports/${r1}/return"
              payload: { return_reason: "redo athleticism section" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { st2: $.data.status }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
              captures: { st3: $.data.status }
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { st4: $.data.status }
          assert:
            - "statuses in order: SUBMITTED, RETURNED, SUBMITTED, LOCKED"
            - "report ${r1}.normalized_grade == 6.50 after final lock"

      - name: board_freeze_unfreeze_revert
        grounds:
          - state_machines.DraftBoard.OPEN_to_FROZEN
          - state_machines.DraftBoard.FROZEN_to_OPEN
          - state_machines.DraftBoard.FROZEN_to_FINALIZED
        distinguishing_aspect: |
          DraftBoard supports a branching-with-revert loop OPEN -> FROZEN -> OPEN ->
          FROZEN -> FINALIZED; the revert is on the board entity (different entity from
          the report cycle).
        test_recipe:
          setup:
            - "director d1 exists; one OPEN board for season 2026"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "Dir One", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /scouting/draft-boards/${b1}/freeze"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { st1: $.data.status }
            - call: "POST /scouting/draft-boards/${b1}/unfreeze"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { st2: $.data.status }
            - call: "POST /scouting/draft-boards/${b1}/freeze"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { st3: $.data.status }
          assert:
            - "statuses in order: OPEN (create), FROZEN, OPEN, FROZEN"
            - "the revert FROZEN -> OPEN is accepted, proving non-linear shape"

  # =========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3+ and 2+)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: report_lock_cascade_to_board
        grounds:
          - state_machines.ScoutingReport.SUBMITTED_to_LOCKED
          - calculations.composite_prospect_grade
          - calculations.board_rerank
        distinguishing_aspect: |
          Depth-3 chain from the lock trigger: lock -> report.normalized_grade ->
          prospect.composite_grade/tier -> OPEN-board entries reranked ->
          DraftBoard.version incremented. A second lock raising prospect p2's composite
          from 6.00 to 7.00 swaps ranks 1 and 2 and bumps board version from 3 to 4.
        test_recipe:
          setup:
            - "s1 (mean 6.00 sd 1.00), s2 (mean 6.00 sd 1.50), s3 (mean 6.00 sd 1.50), director d1"
            - "p1 composite 6.50 (s1 raw 7.00 locked); p2 composite 6.00 (s2 raw 7.00 locked) plus a second SUBMITTED (not locked) report by s3 raw 9.00"
            - "both prospects BOARD_READY; OPEN board b1 with entries p1 rank 1, p2 rank 2; board version 3"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "S2", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.50 }
              as: GeneralManager
              captures: { s2: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "S3", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.50 }
              as: GeneralManager
              captures: { s3: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Dir One", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P One", position: "QB", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P Two", position: "WR", college: "Tech" }
              as: AreaScout
              as_user_id: "${s2}"
              captures: { p2: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/prospects/${p2}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s2}"
              captures: { r2: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r2}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s2}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/reports/${r2}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p2}/reports"
              payload: { raw_grade: 9.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s3}"
              captures: { r3: $.data.id }
            - call: "POST /scouting/reports/${r3}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s3}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p2}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p2}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p1}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p2}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "GET /scouting/draft-boards/${b1}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { bv_pre: $.data.version }
          trigger:
            - call: "POST /scouting/reports/${r3}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { n3: $.data.normalized_grade }
            - call: "GET /scouting/draft-boards/${b1}/entries"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { top_pid: "$.data[0].prospect_id", top_rank: "$.data[0].rank", second_pid: "$.data[1].prospect_id", second_rank: "$.data[1].rank" }
            - call: "GET /scouting/draft-boards/${b1}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { bv_post: $.data.version }
          assert:
            - "report ${r3} normalized_grade == 8.00; prospect ${p2}.composite_grade == 7.00 (3.00 + 4.00)"
            - "entries[0].prospect_id == ${p2} with rank 1 and entries[1].prospect_id == ${p1} with rank 2 (swap)"
            - "board version before lock (${bv_pre}) == 3 and after lock (${bv_post}) == 4"

      - name: flag_escalation_exclusion_cascade
        grounds:
          - state_machines.ConfidentialFlag.OPEN_to_ESCALATED
          - state_machines.Prospect.UNDER_REVIEW_to_EXCLUDED
          - calculations.board_rerank
        distinguishing_aspect: |
          Depth-2+ chain from a different trigger (escalate, not lock): escalate HIGH
          MEDICAL flag -> prospect.flag_status EXCLUDED -> board entries deactivated ->
          rerank compaction bumps board version from 3 to 4 and leaves the surviving
          entry at rank 1.
        test_recipe:
          setup:
            - "s1 (mean 6.00 sd 1.00), director d1"
            - "p1 composite 6.50 (raw 7.00), p2 composite 9.00 (raw 9.00 clamps 9.50 -> 9.00)"
            - "both BOARD_READY on OPEN board b1; after rerank p2 rank 1, p1 rank 2; board version 3"
            - "one OPEN HIGH MEDICAL flag on p1"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Dir One", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Risky", position: "QB", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Clean", position: "WR", college: "Tech" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p2: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/prospects/${p2}/reports"
              payload: { raw_grade: 9.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r2: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r2}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/reports/${r2}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p2}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p2}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p1}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p2}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/flags"
              payload: { flag_type: "MEDICAL", severity: "HIGH", detail: "degenerative knee" }
              as: MedicalStaff
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /scouting/flags/${f1}/escalate"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { fst: $.data.status }
            - call: "GET /scouting/prospects/${p1}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { pflag: $.data.flag_status }
            - call: "GET /scouting/draft-boards/${b1}/entries"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { e_p1_active: "$.data[0].active", e_top_rank: "$.data[0].rank" }
            - call: "GET /scouting/draft-boards/${b1}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { bv: $.data.version }
          assert:
            - "flag ${f1}.status == ESCALATED"
            - "prospect ${p1}.flag_status == EXCLUDED"
            - "entry of prospect ${p1} has active == false"
            - "entry of prospect ${p2} reranked to rank 1 (compaction)"
            - "board version ${bv} == 4 (3 from setup + 1 from exclusion cascade)"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_sign
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_TARGET_NOT_OFFERED]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          state (priority 5) vs business_fiscal (priority 9): signing an IDENTIFIED
          target whose cap hit also exceeds budget availability must return
          ERR_TARGET_NOT_OFFERED, never ERR_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "budget with base_cap 100000000, rollover 0 (available 100000000)"
            - "target t1 still IDENTIFIED with annual_cap_hit 150000000 > available"
          setup_api_calls:
            - call: "POST /scouting/budgets"
              payload: { season_year: 2026, base_cap_cents: 100000000, rollover_cents: 0 }
              as: GeneralManager
              captures: { bud: $.data.id }
            - call: "POST /scouting/free-agent-targets"
              payload: { player_name: "Big Vet", position: "WR", season_year: 2026, base_salary_cents: 150000000, signing_bonus_cents: 0, contract_years: 1 }
              as: GeneralManager
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /scouting/free-agent-targets/${t1}/sign"
              payload: { budget_id: "${bud}" }
              as: GeneralManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TARGET_NOT_OFFERED (state, priority 5)"
            - "NOT ERR_BUDGET_EXCEEDED even though 150000000 > 100000000"
            - "HTTP status == 409"

      - name: safety_beats_temporal_on_interview
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_FLAG_REVIEW_OPEN]
          - errors[ERR_INTERVIEW_OVERLAP]
        distinguishing_aspect: |
          business_safety (priority 6) vs business_temporal (priority 8): scheduling an
          interview for a prospect in UNDER_REVIEW whose slot also overlaps an existing
          session must return ERR_FLAG_REVIEW_OPEN, never ERR_INTERVIEW_OVERLAP.
        test_recipe:
          setup:
            - "scout s1, prospect p1 with an OPEN CHARACTER flag (flag_status UNDER_REVIEW)"
            - "existing SCHEDULED interview 2026-06-01T10:00:00Z..11:00:00Z"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA", weight: 1.0 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Flagged", position: "CB", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/interviews"
              payload: { start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", location: "Combine" }
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/prospects/${p1}/flags"
              payload: { flag_type: "CHARACTER", severity: "LOW", detail: "late to meetings" }
              as: AreaScout
              as_user_id: "${s1}"
          trigger:
            - call: "POST /scouting/prospects/${p1}/interviews"
              payload: { start_at: "2026-06-01T10:30:00Z", end_at: "2026-06-01T11:30:00Z", location: "Combine" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FLAG_REVIEW_OPEN (safety, priority 6)"
            - "NOT ERR_INTERVIEW_OVERLAP even though 10:30-11:30 overlaps 10:00-11:00"
            - "HTTP status == 409"

  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier_boundary_700_inclusive
        grounds:
          - calculations.tier_assignment
          - entities.Prospect.fields.tier
        distinguishing_aspect: |
          Metric: composite_grade. composite exactly 7.00 maps to T2 (>= inclusive);
          6.99 maps to T3. Observed via report lock + GET prospect.
        test_recipe:
          setup:
            - "scout s (mean 6.00 sd 1.50), director d1"
            - "p1 with report raw 8.00 -> normalized 7.00; p2 with report raw 7.99 -> normalized 6.99"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "Boundary Scout", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.50 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Dir One", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Edge High", position: "S", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Edge Low", position: "S", college: "Tech" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p2: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 8.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/prospects/${p2}/reports"
              payload: { raw_grade: 7.99, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r2: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r2}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
          trigger:
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/reports/${r2}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "GET /scouting/prospects/${p1}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { c1: $.data.composite_grade, t1: $.data.tier }
            - call: "GET /scouting/prospects/${p2}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { c2: $.data.composite_grade, t2: $.data.tier }
          assert:
            - "prospect ${p1}.composite_grade == 7.00 and tier == T2"
            - "prospect ${p2}.composite_grade == 6.99 and tier == T3"

      - name: budget_sign_exact_available_allowed
        grounds:
          - calculations.cap_hit_and_budget_posture
          - validations[priority=9]
        distinguishing_aspect: |
          Metric: available_cents. A sign whose cap hit equals available_cents exactly
          is allowed (<=), driving available to 0 and posture to TIGHT; a further sign
          of 100 cents is rejected ERR_BUDGET_EXCEEDED. Different metric and endpoint
          from the tier boundary.
        test_recipe:
          setup:
            - "budget base_cap 100000000 rollover 0"
            - "OPEN RosterNeed QB P3 season 2026"
            - "t1 OFFERED with hit 50000000; t2 OFFERED with hit exactly 50000000; t3 OFFERED with hit 100"
          setup_api_calls:
            - call: "POST /scouting/budgets"
              payload: { season_year: 2026, base_cap_cents: 100000000, rollover_cents: 0 }
              as: GeneralManager
              captures: { bud: $.data.id }
            - call: "POST /scouting/roster-needs"
              payload: { season_year: 2026, position: "QB", priority_tier: "P3" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets"
              payload: { player_name: "T1", position: "QB", season_year: 2026, base_salary_cents: 50000000, signing_bonus_cents: 0, contract_years: 1 }
              as: GeneralManager
              captures: { t1: $.data.id }
            - call: "POST /scouting/free-agent-targets"
              payload: { player_name: "T2", position: "QB", season_year: 2026, base_salary_cents: 50000000, signing_bonus_cents: 0, contract_years: 1 }
              as: GeneralManager
              captures: { t2: $.data.id }
            - call: "POST /scouting/free-agent-targets"
              payload: { player_name: "T3", position: "QB", season_year: 2026, base_salary_cents: 100, signing_bonus_cents: 0, contract_years: 1 }
              as: GeneralManager
              captures: { t3: $.data.id }
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "EVALUATING" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "APPROVED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "OFFERED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t2}/advance"
              payload: { to_state: "EVALUATING" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t2}/advance"
              payload: { to_state: "APPROVED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t2}/advance"
              payload: { to_state: "OFFERED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t3}/advance"
              payload: { to_state: "EVALUATING" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t3}/advance"
              payload: { to_state: "APPROVED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t3}/advance"
              payload: { to_state: "OFFERED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/sign"
              payload: { budget_id: "${bud}" }
              as: GeneralManager
          trigger:
            - call: "POST /scouting/free-agent-targets/${t2}/sign"
              payload: { budget_id: "${bud}" }
              as: GeneralManager
              captures: { t2st: $.data.status }
            - call: "GET /scouting/budgets/${bud}"
              as: GeneralManager
              captures: { avail: $.data.available_cents, post: $.data.posture }
            - call: "POST /scouting/free-agent-targets/${t3}/sign"
              payload: { budget_id: "${bud}" }
              as: GeneralManager
              captures: { err: $.data.error_id }
          assert:
            - "target ${t2} status == SIGNED (hit 50000000 == available 50000000 allowed)"
            - "budget available_cents == 0 and posture == TIGHT"
            - "target ${t3} sign rejected with ERR_BUDGET_EXCEEDED (100 > 0)"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: report_create_requires_scouting_phase
        grounds:
          - validations[priority=5]
          - state_machines.Prospect
        distinguishing_aspect: |
          Pair ScoutingReport -> Prospect: creating a report is rejected once the
          prospect's evaluation_status has reached BOARD_READY (allowed set is
          {NEW, SCOUTING, EVALUATED}).
        test_recipe:
          setup:
            - "s1, s2, director d1; prospect p1 with s1's report LOCKED and advanced to BOARD_READY"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "S2", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.00 }
              as: GeneralManager
              captures: { s2: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Dir One", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Ready Guy", position: "OT", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
          trigger:
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 8.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s2}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (BOARD_READY not in {NEW, SCOUTING, EVALUATED})"
            - "HTTP status == 409"

      - name: target_approve_requires_open_roster_need
        grounds:
          - validations[priority=5]
          - state_machines.FreeAgentTarget.EVALUATING_to_APPROVED
          - entities.RosterNeed.fields.status
        distinguishing_aspect: |
          Pair FreeAgentTarget -> RosterNeed (different pair): advancing to APPROVED
          without an OPEN RosterNeed matching position + season_year is rejected;
          creating the need afterwards makes the same call succeed.
        test_recipe:
          setup:
            - "target t1 CB season 2026 advanced to EVALUATING; no RosterNeed exists"
          setup_api_calls:
            - call: "POST /scouting/free-agent-targets"
              payload: { player_name: "Needy Vet", position: "CB", season_year: 2026, base_salary_cents: 5000000, signing_bonus_cents: 0, contract_years: 1 }
              as: GeneralManager
              captures: { t1: $.data.id }
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "EVALUATING" }
              as: GeneralManager
          trigger:
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "APPROVED" }
              as: GeneralManager
              captures: { err: $.data.error_id }
            - call: "POST /scouting/roster-needs"
              payload: { season_year: 2026, position: "CB", priority_tier: "P1" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "APPROVED" }
              as: GeneralManager
              captures: { st: $.data.status }
          assert:
            - "first advance to APPROVED -> error_id ERR_NO_ROSTER_NEED (409)"
            - "after creating an OPEN CB/2026 need, advance succeeds with status == APPROVED"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: interview_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_INTERVIEW_OVERLAP]
          - entities.InterviewSession
        distinguishing_aspect: |
          Resource: Prospect's calendar. Semantics: half-open [start, end) — a session
          starting exactly when another ends is allowed, while a strictly overlapping
          one is rejected.
        test_recipe:
          setup:
            - "scout s1; prospect p1 with flag_status CLEAR and one SCHEDULED interview 10:00-11:00"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S1", level: "AREA", weight: 1.0 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "Busy", position: "LB", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects/${p1}/interviews"
              payload: { start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", location: "Combine" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { iv1: $.data.id }
          trigger:
            - call: "POST /scouting/prospects/${p1}/interviews"
              payload: { start_at: "2026-06-01T11:00:00Z", end_at: "2026-06-01T12:00:00Z", location: "Combine" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { iv2: $.data.id }
            - call: "POST /scouting/prospects/${p1}/interviews"
              payload: { start_at: "2026-06-01T10:30:00Z", end_at: "2026-06-01T11:30:00Z", location: "Combine" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
          assert:
            - "adjacent 11:00-12:00 session is created (201), proving half-open semantics"
            - "overlapping 10:30-11:30 session -> error_id ERR_INTERVIEW_OVERLAP (409)"

      - name: facility_thirty_minute_buffer
        grounds:
          - validations[priority=8]
          - errors[ERR_FACILITY_BUFFER_CONFLICT]
          - entities.FacilityBooking
        distinguishing_aspect: |
          Resource: Facility. Semantics: buffer rule — a booking must leave >= 30
          minutes gap on both sides; adjacency (gap 0) is REJECTED here although the
          prospect calendar allowed it, and a gap of exactly 30 minutes is allowed.
        test_recipe:
          setup:
            - "facility f1 with one booking 10:00-11:00"
          setup_api_calls:
            - call: "POST /scouting/facilities"
              payload: { name: "Interview Room A", capacity: 6 }
              as: GeneralManager
              captures: { f1: $.data.id }
            - call: "POST /scouting/facilities/${f1}/bookings"
              payload: { start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", purpose: "formal interview" }
              as: GeneralManager
              captures: { bk1: $.data.id }
          trigger:
            - call: "POST /scouting/facilities/${f1}/bookings"
              payload: { start_at: "2026-06-01T11:00:00Z", end_at: "2026-06-01T12:00:00Z", purpose: "medical" }
              as: GeneralManager
              captures: { err: $.data.error_id }
            - call: "POST /scouting/facilities/${f1}/bookings"
              payload: { start_at: "2026-06-01T11:30:00Z", end_at: "2026-06-01T12:30:00Z", purpose: "medical" }
              as: GeneralManager
              captures: { bk2: $.data.id }
          assert:
            - "adjacent booking (gap 0) -> error_id ERR_FACILITY_BUFFER_CONFLICT (409)"
            - "booking with exactly 30-minute gap is created (201), proving >= buffer boundary"

  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: budget_sign_release_conserves_committed
        grounds:
          - calculations.cap_hit_and_budget_posture
          - state_machines.FreeAgentTarget.OFFERED_to_SIGNED
          - state_machines.FreeAgentTarget.SIGNED_to_RELEASED
          - entities.Budget.fields.committed_cents
        distinguishing_aspect: |
          Conserved quantity: budget.committed_cents (money). Sign (+hit) paired with
          its compensating release (-hit) returns committed_cents to exactly its
          pre-sign value, with no drift; mid-flight value 33333333 also verifies the
          bonus proration round_half_up(9999999/3) = 3333333.
        test_recipe:
          setup:
            - "budget base_cap 200000000 rollover 10000000 (total 210000000, committed 0)"
            - "OPEN need QB P2 2026; target OFFERED: base 30000000, bonus 9999999, years 3 -> hit 33333333"
          setup_api_calls:
            - call: "POST /scouting/budgets"
              payload: { season_year: 2026, base_cap_cents: 200000000, rollover_cents: 10000000 }
              as: GeneralManager
              captures: { bud: $.data.id, c0: $.data.committed_cents, a0: $.data.available_cents }
            - call: "POST /scouting/roster-needs"
              payload: { season_year: 2026, position: "QB", priority_tier: "P2" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets"
              payload: { player_name: "Pair Vet", position: "QB", season_year: 2026, base_salary_cents: 30000000, signing_bonus_cents: 9999999, contract_years: 3 }
              as: GeneralManager
              captures: { t1: $.data.id }
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "EVALUATING" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "APPROVED" }
              as: GeneralManager
            - call: "POST /scouting/free-agent-targets/${t1}/advance"
              payload: { to_state: "OFFERED" }
              as: GeneralManager
          trigger:
            - call: "POST /scouting/free-agent-targets/${t1}/sign"
              payload: { budget_id: "${bud}" }
              as: GeneralManager
            - call: "GET /scouting/budgets/${bud}"
              as: GeneralManager
              captures: { c_mid: $.data.committed_cents }
            - call: "POST /scouting/free-agent-targets/${t1}/release"
              payload: {}
              as: GeneralManager
            - call: "GET /scouting/budgets/${bud}"
              as: GeneralManager
              captures: { c_end: $.data.committed_cents, a_end: $.data.available_cents, post_end: $.data.posture }
          assert:
            - "committed_cents after sign == 33333333"
            - "committed_cents after release == ${c0} == 0 (invariant restored)"
            - "available_cents after release == 210000000 and posture == HEALTHY"

      - name: board_reorder_reverse_conserves_rank_mass
        grounds:
          - calculations.board_rerank
          - concurrency_rules[board-reorder-stale-version]
          - entities.DraftBoardEntry.fields.rank
        distinguishing_aspect: |
          Conserved quantity: rank ordinal mass. A manual reorder paired with its exact
          reverse keeps sum(rank) == N*(N+1)/2 == 6 at every step and restores the
          original permutation (different quantity type from committed_cents).
        test_recipe:
          setup:
            - "scout s (mean 6.00 sd 1.50), director d1"
            - "p1 composite 8.00 (raw 9.00), p2 composite 7.00 (raw 8.00), p3 composite 6.00 (raw 7.00); all BOARD_READY"
            - "board b1 with entries: after reranks ranks are p1=1, p2=2, p3=3; board version 4"
          setup_api_calls:
            - call: "POST /scouting/scouts"
              payload: { full_name: "S", level: "AREA", weight: 1.0, season_grade_mean: 6.00, season_grade_stdev: 1.50 }
              as: GeneralManager
              captures: { s1: $.data.id }
            - call: "POST /scouting/scouts"
              payload: { full_name: "Dir One", level: "DIRECTOR" }
              as: GeneralManager
              captures: { d1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P1", position: "QB", college: "State U" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p1: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P2", position: "WR", college: "Tech" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p2: $.data.id }
            - call: "POST /scouting/prospects"
              payload: { full_name: "P3", position: "CB", college: "College" }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { p3: $.data.id }
            - call: "POST /scouting/prospects/${p1}/reports"
              payload: { raw_grade: 9.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
            - call: "POST /scouting/prospects/${p2}/reports"
              payload: { raw_grade: 8.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r2: $.data.id }
            - call: "POST /scouting/prospects/${p3}/reports"
              payload: { raw_grade: 7.00, scheme_fit: 1.00 }
              as: AreaScout
              as_user_id: "${s1}"
              captures: { r3: $.data.id }
            - call: "POST /scouting/reports/${r1}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r2}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r3}/submit"
              payload: {}
              as: AreaScout
              as_user_id: "${s1}"
            - call: "POST /scouting/reports/${r1}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/reports/${r2}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/reports/${r3}/lock"
              payload: {}
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p1}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p2}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p2}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p3}/advance"
              payload: { to_state: "EVALUATED" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/prospects/${p3}/advance"
              payload: { to_state: "BOARD_READY" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "POST /scouting/draft-boards"
              payload: { season_year: 2026 }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { b1: $.data.id }
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p1}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { e1: $.data.id }
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p2}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { e2: $.data.id }
            - call: "POST /scouting/draft-boards/${b1}/entries"
              payload: { prospect_id: "${p3}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { e3: $.data.id }
            - call: "GET /scouting/draft-boards/${b1}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { bv1: $.data.version }
          trigger:
            - call: "POST /scouting/draft-boards/${b1}/entries/reorder"
              payload: { entry_id: "${e3}", new_rank: 1, expected_board_version: "${bv1}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "GET /scouting/draft-boards/${b1}/entries"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { m_top: "$.data[0].id", m_mid: "$.data[1].id", m_bot: "$.data[2].id" }
            - call: "GET /scouting/draft-boards/${b1}"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { bv2: $.data.version }
            - call: "POST /scouting/draft-boards/${b1}/entries/reorder"
              payload: { entry_id: "${e3}", new_rank: 3, expected_board_version: "${bv2}" }
              as: ScoutingDirector
              as_user_id: "${d1}"
            - call: "GET /scouting/draft-boards/${b1}/entries"
              as: ScoutingDirector
              as_user_id: "${d1}"
              captures: { f_top: "$.data[0].id", f_mid: "$.data[1].id", f_bot: "$.data[2].id" }
          assert:
            - "after forward reorder: ranks are e3=1, e1=2, e2=3 (insert semantics); sum(rank) == 6 == 3*4/2"
            - "after reverse reorder: original permutation restored e1=1, e2=2, e3=3; sum(rank) == 6"
            - "board version increments by 1 on each reorder (${bv1} -> ${bv2} -> ${bv2}+1)"
