# =============================================================================
# PRD Benchmark Scaffold — task_2015_adjunct_faculty_hiring_contract_management
#
# Community-college adjunct faculty hiring & per-course contract management:
# pool postings, credential/transcript verification, per-course contract
# issuance against versioned rate schedules, cancellation partial pay,
# benefits-eligibility load caps, reappointment/retention, cross-term payroll.
# =============================================================================

scenario: |
  2015. Adjunct Faculty Hiring & Contract Management (community college adjunct
  pool): pool posting & credential/transcript verification, per-course contract
  issuance & rate schedule, course cancellation clause & partial pay, class-load
  cap for benefits eligibility, semester-to-semester reappointment, evaluation &
  retention list, payroll timing across terms, onboarding compliance
  (training/background)

domain_name: adjunct-faculty-contracts
api_prefix: /adjunct-hr

complexity_profile:
  primary_archetype: workflow_orchestration      # application → verification → contract → completion/cancellation
  secondary_archetype: pricing_engine            # rate schedules, partial-pay tiers, payroll accrual splits
  complexity_layers:
    - cascading_side_effects                     # cancel course section → cancel contracts → recompute load → flip benefits eligibility → claw back payroll accrual
    - rate_threshold_triggers                    # benefits-eligibility load cap; cancellation pay tiers at census boundaries
    - derived_field_reconciliation               # AdjunctFaculty.term_load_units, benefits_eligible, retention_list_rank recomputed from children
    - optimistic_concurrency                     # OCC on AdjunctFaculty.version for contract issuance & reappointment supersede
    - ops_run_checkpoint                         # payroll_close run and term_rollover run advance epochs, expire applications, post payroll entries
    - scheduled_deferred_actions                 # contracts take effect on term start; cancellations before/after census dates
  entity_topology: flat                          # peer entities with FK references; no nested URL ownership
  state_machine_shape: branching                 # fork/join + revision loops + parallel dimensions
  relationship_patterns:
    - one_to_many                                # Posting → Application; Faculty → Contract; Contract → PayrollEntry
    - many_to_many                               # Faculty ↔ Department via RetentionEntry; Contract ↔ PayrollPeriod via PayrollEntry
    - cross_aggregate                            # Contract references RateSchedule, CourseSection, TermConfig, AdjunctFaculty
  role_model: segregation_of_duties              # whoever verifies a credential cannot approve the contract on the same application
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique department code, e.g. MATH", constraints: "unique across all departments; 2-12 uppercase alphanumerics" }
      - { name: name, type: string, source: input, description: "Department display name" }
      - { name: contact_hour_value, type: number, source: input, description: "Load units granted per weekly contact hour for load-cap math", constraints: "> 0, at most 2 decimal places" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive departments reject new postings, rate schedules, and contracts" }

  - name: TermConfig
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique term code, e.g. 2026FA", constraints: "unique" }
      - { name: start_date, type: string, source: input, description: "ISO date, inclusive first instructional day" }
      - { name: end_date, type: string, source: input, description: "ISO date, inclusive last instructional day", constraints: "end_date > start_date; at least 14 days span" }
      - { name: early_census_date, type: string, source: input, description: "ISO date; cancellation before this date (exclusive) pays the pre-census tier", constraints: "start_date <= early_census_date < late_census_date <= end_date" }
      - { name: late_census_date, type: string, source: input, description: "ISO date; cancellation on/after this date pays the post-census tier" }
      - { name: load_cap_units, type: number, source: input, description: "Benefits-eligibility threshold in load units", constraints: "> 0, at most 2 decimals" }
      - { name: rollover_status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | OPEN | ROLLED_OVER — gates whether contracts may be issued into this term" }

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; schedule applies only to that department" }
      - { name: education_tier, type: enum, source: input, description: "BACHELORS | MASTERS | DOCTORATE" }
      - { name: rate_basis, type: enum, source: input, description: "PER_CONTACT_HOUR | PER_COURSE" }
      - { name: base_rate_cents, type: integer, source: input, description: "Rate per contact-hour-unit or per course depending on rate_basis", constraints: ">= 1" }
      - { name: longevity_step_cents, type: integer, source: input, description: "Additional cents per completed prior term of service, capped by longevity_step_cap", constraints: ">= 0" }
      - { name: longevity_step_cap, type: integer, source: input, description: "Maximum number of prior terms credited", constraints: ">= 0" }
      - { name: effective_start_date, type: string, source: input, description: "ISO date, inclusive" }
      - { name: effective_end_date, type: string, source: input, description: "ISO date, exclusive", constraints: "effective_end_date > effective_start_date" }
      - { name: schedule_status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | RETIRED" }
      - { name: published_version, type: integer, source: computed, description: "Entity version value at the moment of publish; contracts pin this" }

  - name: AdjunctPoolPosting
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; hiring department" }
      - { name: term_code, type: string, source: input, description: "Term the pool hires for (free text; validated to exist as TermConfig.code on publish)" }
      - { name: title, type: string, source: input, description: "Posting title" }
      - { name: min_education_tier, type: enum, source: input, description: "BACHELORS | MASTERS | DOCTORATE — minimum credential tier applications must evidence" }
      - { name: open_date, type: string, source: input, description: "ISO date applications first accepted (inclusive)" }
      - { name: close_date, type: string, source: input, description: "ISO date applications last accepted (inclusive)", constraints: "close_date >= open_date" }
      - { name: posting_status, type: enum, source: system, default: DRAFT, description: "DRAFT | OPEN | SUSPENDED | CLOSED | ARCHIVED" }

  - name: AdjunctApplication
    parent: null
    common_fields: true
    fields:
      - { name: posting_id, type: string, source: input, description: "FK -> AdjunctPoolPosting.id; pool applied to" }
      - { name: applicant_name, type: string, source: input, description: "Full legal name" }
      - { name: applicant_email, type: string, source: input, description: "Contact email", constraints: "unique among applications in SUBMITTED/UNDER_REVIEW/APPROVED states per posting" }
      - { name: claimed_education_tier, type: enum, source: input, description: "BACHELORS | MASTERS | DOCTORATE — applicant's claim, checked against posting minimum" }
      - { name: application_status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | RETURNED_FOR_REVISION | APPROVED | REJECTED | WITHDRAWN | EXPIRED" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on each RETURNED_FOR_REVISION loop; capped at MAX_REVISIONS" }
      - { name: hired_faculty_id, type: string, source: system, description: "FK -> AdjunctFaculty.id; set when application is approved and faculty record is created" }

  - name: CredentialVerification
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> AdjunctApplication.id; application under verification" }
      - { name: kind, type: enum, source: input, description: "TRANSCRIPT | DEGREE | LICENSE | BACKGROUND_CHECK | TRAINING" }
      - { name: evidence_ref, type: string, source: input, description: "Opaque reference to uploaded evidence" }
      - { name: verified_education_tier, type: enum, source: input, description: "BACHELORS | MASTERS | DOCTORATE — tier evidenced by this record; only meaningful for TRANSCRIPT/DEGREE" }
      - { name: verification_status, type: enum, source: system, default: PENDING, description: "PENDING | VERIFIED | REJECTED" }
      - { name: verified_by_hr_id, type: string, source: system, description: "X-User-ID of HRReviewer who decided; recorded for segregation-of-duties checks" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of VERIFIED/REJECTED decision" }

  - name: AdjunctFaculty
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> AdjunctApplication.id; originating approved application" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; home department" }
      - { name: legal_name, type: string, source: input, description: "Legal name copied from application" }
      - { name: education_tier, type: enum, source: input, description: "BACHELORS | MASTERS | DOCTORATE — verified tier used for rate selection" }
      - { name: hire_date, type: string, source: input, description: "ISO date of hire" }
      - { name: compliance_status, type: enum, source: system, default: ONBOARDING, description: "ONBOARDING | COMPLIANT | LAPSED — parallel dimension 1; gates contract activation" }
      - { name: retention_status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | RETENTION_LISTED | NON_REAPPOINTED — parallel dimension 2" }
      - { name: completed_terms, type: integer, source: system, default: 0, description: "Terms with at least one COMPLETED contract; drives longevity step" }
      - { name: current_term_load_units, type: number, source: computed, default: 0, description: "Sum of load units over ACTIVE contracts in the current term (variant: scheduled vs actual)" }
      - { name: benefits_eligible, type: boolean, source: computed, default: false, description: "true iff current_term_load_units >= load_cap_units of the current term" }

  - name: CourseSection
    parent: null
    common_fields: true
    fields:
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; owning department" }
      - { name: term_code, type: string, source: input, description: "Term of the section; must match an existing TermConfig.code" }
      - { name: course_code, type: string, source: input, description: "e.g. ENG-101" }
      - { name: section_code, type: string, source: input, description: "e.g. 01", constraints: "(term_code, course_code, section_code) unique" }
      - { name: weekly_contact_hours, type: number, source: input, description: "Weekly contact hours for load computation", constraints: "> 0, at most 2 decimals" }
      - { name: credit_hours, type: integer, source: input, description: "Credit hours (informational)", constraints: ">= 0" }
      - { name: enrollment, type: integer, source: input, default: 0, description: "Current enrollment; drives low-enrollment cancellation policy", constraints: ">= 0" }
      - { name: min_enrollment, type: integer, source: input, description: "Below this at early census the section is cancellable as LOW_ENROLLMENT", constraints: ">= 0" }
      - { name: section_status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | RUNNING | CANCELLED | COMPLETED" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: faculty_id, type: string, source: input, description: "FK -> AdjunctFaculty.id; instructor of record" }
      - { name: section_id, type: string, source: input, description: "FK -> CourseSection.id; course covered" }
      - { name: rate_schedule_id, type: string, source: input, description: "FK -> RateSchedule.id; must be PUBLISHED and match faculty education_tier + section department" }
      - { name: pinned_schedule_version, type: integer, source: computed, description: "RateSchedule.published_version captured at issuance; stale-pin detection" }
      - { name: expected_faculty_version, type: integer, source: input, description: "OCC token: AdjunctFaculty.version last observed by issuer" }
      - { name: load_units, type: number, source: computed, description: "weekly_contact_hours * Department.contact_hour_value at issuance; frozen snapshot" }
      - { name: gross_pay_cents, type: integer, source: computed, description: "Full-term gross per calc contract_gross_pay (provisional variant at issuance)" }
      - { name: payable_cents, type: integer, source: computed, description: "Amount actually payable after cancellation/completion (final variant); equals gross until a terminal event" }
      - { name: contract_status, type: enum, source: system, default: ISSUED, description: "ISSUED | ACTIVE | CANCELLED_PRE_CENSUS | CANCELLED_LATE | COMPLETED | VOIDED" }
      - { name: cancelled_at, type: datetime, source: system, description: "Set on cancellation transitions" }
      - { name: cancellation_reason, type: enum, source: input, description: "LOW_ENROLLMENT | PROGRAM_CUT | FACULTY_INITIATED | ADMINISTRATIVE", constraints: "required on cancel" }

  - name: PayrollPeriod
    parent: null
    common_fields: true
    fields:
      - { name: period_code, type: string, source: input, description: "Unique code e.g. 2026FA-P1", constraints: "unique" }
      - { name: start_date, type: string, source: input, description: "ISO date inclusive" }
      - { name: end_date, type: string, source: input, description: "ISO date inclusive", constraints: "end_date >= start_date" }
      - { name: period_status, type: enum, source: system, default: OPEN, description: "OPEN | LOCKED | CLOSED" }

  - name: PayrollEntry
    parent: null
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; source contract" }
      - { name: payroll_period_id, type: string, source: system, description: "FK -> PayrollPeriod.id; period the entry posts to" }
      - { name: entry_kind, type: enum, source: system, description: "ACCRUAL | CANCELLATION_PAYOUT | CLAWBACK" }
      - { name: amount_cents, type: integer, source: computed, description: "Signed amount in cents" }
      - { name: split_variant, type: enum, source: system, description: "EQUAL_SPLIT | DAYS_WEIGHTED — which payroll_accrual_split variant produced this entry" }
      - { name: posted_at, type: datetime, source: system, description: "Timestamp the entry was posted by run_payroll_close" }
      - { name: reversal_of_entry_id, type: string, source: system, description: "FK -> PayrollEntry.id; set on CLAWBACK entries that reverse a prior accrual" }

  - name: EvaluationRecord
    parent: null
    common_fields: false
    fields:
      - { name: faculty_id, type: string, source: input, description: "FK -> AdjunctFaculty.id; evaluated faculty" }
      - { name: term_code, type: string, source: input, description: "Term evaluated" }
      - { name: teaching_score, type: number, source: input, description: "0.00-5.00 teaching effectiveness", constraints: "0 <= score <= 5, 2 decimals" }
      - { name: service_score, type: number, source: input, description: "0.00-5.00 service/availability", constraints: "0 <= score <= 5, 2 decimals" }
      - { name: compliance_score, type: number, source: input, description: "0.00-5.00 compliance timeliness", constraints: "0 <= score <= 5, 2 decimals" }
      - { name: composite_score, type: number, source: computed, description: "Weighted composite per calc retention_composite_score" }
      - { name: recorded_by_dean_id, type: string, source: system, description: "X-User-ID of Dean who recorded" }

  - name: RetentionEntry
    parent: null
    common_fields: true
    fields:
      - { name: faculty_id, type: string, source: input, description: "FK -> AdjunctFaculty.id; listed faculty" }
      - { name: department_id, type: string, source: input, description: "FK -> Department.id; list scope" }
      - { name: list_term_code, type: string, source: input, description: "Term the list applies to (the NEXT term hiring round)" }
      - { name: rank_position, type: integer, source: computed, description: "1-based rank within (department_id, list_term_code) by composite score" }
      - { name: entry_status, type: enum, source: system, default: LISTED, description: "LISTED | REAPPOINTED | NON_REAPPOINTED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: AdjunctPoolPosting
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /adjunct-hr/postings/{id}/publish"
        actor: DepartmentChair
        preconditions:
          - "posting.department_id references a Department with active == true"
          - "term_code matches a TermConfig.code whose rollover_status != ROLLED_OVER"
          - "current logical date <= close_date"
        side_effects:
          - "increments AdjunctPoolPosting.version by 1"
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /adjunct-hr/postings/{id}/suspend"
        actor: DepartmentChair
        preconditions: []
        side_effects: ["increments AdjunctPoolPosting.version by 1"]
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /adjunct-hr/postings/{id}/resume"
        actor: DepartmentChair
        preconditions: ["current logical date <= close_date"]
        side_effects: ["increments AdjunctPoolPosting.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "system (automatic when logical clock passes close_date 23:59:59.999Z) or POST /adjunct-hr/postings/{id}/close"
        actor: system
        preconditions: []
        side_effects:
          - "every AdjunctApplication with posting_id == this posting and application_status == SUBMITTED transitions to EXPIRED"
          - "increments AdjunctPoolPosting.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /adjunct-hr/postings/{id}/close"
        actor: DepartmentChair
        preconditions: []
        side_effects:
          - "every AdjunctApplication with posting_id == this posting and application_status == SUBMITTED transitions to EXPIRED"
          - "increments AdjunctPoolPosting.version by 1"
      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /adjunct-hr/postings/{id}/archive"
        actor: DepartmentChair
        preconditions:
          - "no AdjunctApplication with posting_id == this posting has application_status IN {UNDER_REVIEW, RETURNED_FOR_REVISION}"
        side_effects: ["increments AdjunctPoolPosting.version by 1"]

  - entity: AdjunctApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /adjunct-hr/applications/{id}/start-review"
        actor: HRReviewer
        preconditions:
          - "posting (via posting_id) has posting_status == OPEN"
        side_effects: ["increments AdjunctApplication.version by 1"]
      - from: UNDER_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /adjunct-hr/applications/{id}/return-for-revision"
        actor: HRReviewer
        preconditions:
          - "revision_count < MAX_REVISIONS (3)"
        side_effects:
          - "revision_count += 1"
          - "increments AdjunctApplication.version by 1"
      - from: RETURNED_FOR_REVISION
        to: UNDER_REVIEW
        trigger: "POST /adjunct-hr/applications/{id}/resubmit"
        actor: HRReviewer
        preconditions:
          - "posting (via posting_id) has posting_status IN {OPEN, SUSPENDED}"
        side_effects: ["increments AdjunctApplication.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /adjunct-hr/applications/{id}/approve"
        actor: HRReviewer
        preconditions:
          - "every CredentialVerification with application_id == this application and kind IN {TRANSCRIPT, DEGREE} has verification_status == VERIFIED"
          - "at least one VERIFIED credential evidences a verified_education_tier >= posting.min_education_tier (tier order BACHELORS < MASTERS < DOCTORATE)"
          - "no CredentialVerification with application_id == this application has verification_status == PENDING"
          - "the acting HRReviewer's X-User-ID differs from verified_by_hr_id on every VERIFIED CredentialVerification of this application (segregation of duties)"
        side_effects:
          - "creates AdjunctFaculty with application_id = this application, department_id = posting.department_id, education_tier = highest VERIFIED tier, legal_name = applicant_name, hire_date = current logical date, compliance_status = ONBOARDING, retention_status = PROVISIONAL"
          - "immediately evaluates the ONBOARDING -> COMPLIANT auto-transition against already-VERIFIED BACKGROUND_CHECK/TRAINING credentials on this application (so a fully-cleared applicant is created directly in COMPLIANT)"
          - "sets AdjunctApplication.hired_faculty_id to the new AdjunctFaculty.id"
          - "increments AdjunctApplication.version by 1"
        note: "cyclic revision loop UNDER_REVIEW -> RETURNED_FOR_REVISION -> UNDER_REVIEW bounded by revision_count cap"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /adjunct-hr/applications/{id}/reject"
        actor: HRReviewer
        preconditions: []
        side_effects: ["increments AdjunctApplication.version by 1"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /adjunct-hr/applications/{id}/withdraw"
        actor: HRReviewer
        preconditions: []
        side_effects: ["increments AdjunctApplication.version by 1"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /adjunct-hr/applications/{id}/withdraw"
        actor: HRReviewer
        preconditions: []
        side_effects: ["increments AdjunctApplication.version by 1"]
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (posting auto-close cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments AdjunctApplication.version by 1"]

  - entity: CredentialVerification
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /adjunct-hr/credentials/{id}/verify"
        actor: HRReviewer
        preconditions:
          - "application (via application_id) has application_status IN {UNDER_REVIEW, APPROVED} (post-hire compliance paperwork is verifiable after approval)"
        side_effects:
          - "sets verified_by_hr_id = acting X-User-ID and decided_at = current logical timestamp"
          - "increments CredentialVerification.version by 1"
          - "if the application is APPROVED and this verify completes the BACKGROUND_CHECK+TRAINING VERIFIED pair, faculty compliance_status ONBOARDING -> COMPLIANT"
      - from: PENDING
        to: REJECTED
        trigger: "POST /adjunct-hr/credentials/{id}/reject"
        actor: HRReviewer
        preconditions:
          - "application (via application_id) has application_status IN {UNDER_REVIEW, APPROVED}"
        side_effects:
          - "sets verified_by_hr_id = acting X-User-ID and decided_at = current logical timestamp"
          - "increments CredentialVerification.version by 1"

  - entity: AdjunctFaculty
    initial_state: "ONBOARDING (compliance_status) / PROVISIONAL (retention_status)"
    terminal_states: [NON_REAPPOINTED]
    transitions:
      - from: ONBOARDING
        to: COMPLIANT
        trigger: "system (automatic when faculty has VERIFIED BACKGROUND_CHECK and TRAINING CredentialVerifications on the originating application)"
        actor: system
        preconditions:
          - "exists CredentialVerification via application_id == faculty.application_id with kind == BACKGROUND_CHECK and verification_status == VERIFIED"
          - "exists CredentialVerification via application_id == faculty.application_id with kind == TRAINING and verification_status == VERIFIED"
        side_effects: ["increments AdjunctFaculty.version by 1"]
      - from: COMPLIANT
        to: LAPSED
        trigger: "system (automatic during run_term_rollover when faculty holds no ACTIVE or COMPLETED contract in the term being closed)"
        actor: system
        preconditions: []
        side_effects: ["increments AdjunctFaculty.version by 1"]
      - from: LAPSED
        to: COMPLIANT
        trigger: "POST /adjunct-hr/faculty/{id}/reinstate-compliance"
        actor: HRReviewer
        preconditions:
          - "exists CredentialVerification via application_id == faculty.application_id with kind == BACKGROUND_CHECK and verification_status == VERIFIED"
        side_effects: ["increments AdjunctFaculty.version by 1"]
      - from: PROVISIONAL
        to: RETENTION_LISTED
        trigger: "system (automatic when a RetentionEntry for this faculty is created in LISTED state)"
        actor: system
        preconditions: []
        side_effects: ["increments AdjunctFaculty.version by 1"]
      - from: RETENTION_LISTED
        to: RETENTION_LISTED
        trigger: "system (no-op dimension refresh when a new RetentionEntry for a later list_term_code is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETENTION_LISTED
        to: NON_REAPPOINTED
        trigger: "POST /adjunct-hr/retention-entries/{id}/mark-non-reappointed"
        actor: Dean
        preconditions:
          - "the RetentionEntry addressed by {id} has faculty_id == this faculty and entry_status == LISTED"
        side_effects:
          - "RetentionEntry.entry_status -> NON_REAPPOINTED"
          - "all ISSUED contracts with faculty_id == this faculty whose section term starts after the RetentionEntry.list_term_code start transition to VOIDED"
          - "recomputes current_term_load_units and benefits_eligible per calc term_load_units"
          - "increments AdjunctFaculty.version by 1"
        note: "parallel dimensions: compliance_status (ONBOARDING/COMPLIANT/LAPSED) evolves independently of retention_status (PROVISIONAL/RETENTION_LISTED/NON_REAPPOINTED) on the same row"

  - entity: RateSchedule
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /adjunct-hr/rate-schedules/{id}/publish"
        actor: HRAdmin
        preconditions:
          - "department (via department_id) has active == true"
          - "no other PUBLISHED RateSchedule exists with the same (department_id, education_tier) whose [effective_start_date, effective_end_date) overlaps this schedule's interval (half-open adjacency allowed)"
        side_effects:
          - "sets published_version = current entity version value"
          - "increments RateSchedule.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /adjunct-hr/rate-schedules/{id}/retire"
        actor: HRAdmin
        preconditions:
          - "no Contract references this rate_schedule_id with contract_status IN {ISSUED, ACTIVE}"
        side_effects: ["increments RateSchedule.version by 1"]

  - entity: CourseSection
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "system (automatic when logical clock reaches term start_date 00:00:00Z)"
        actor: system
        preconditions: []
        side_effects:
          - "every Contract with section_id == this section and contract_status == ISSUED transitions to ACTIVE"
          - "for each such contract, recompute AdjunctFaculty.current_term_load_units and benefits_eligible (load counts only ACTIVE contracts)"
          - "increments CourseSection.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /adjunct-hr/sections/{id}/cancel"
        actor: DepartmentChair
        preconditions:
          - "if cancellation_reason == LOW_ENROLLMENT then enrollment < min_enrollment and current logical date < term.early_census_date"
        side_effects:
          - "every Contract with section_id == this section and contract_status IN {ISSUED, ACTIVE} transitions to CANCELLED_PRE_CENSUS with cancelled_at = now"
          - "each cancelled contract's payable_cents recomputed per calc cancellation_partial_pay (pre-census tier)"
          - "recompute each affected AdjunctFaculty.current_term_load_units and benefits_eligible"
          - "increments CourseSection.version by 1"
      - from: RUNNING
        to: CANCELLED
        trigger: "POST /adjunct-hr/sections/{id}/cancel"
        actor: DepartmentChair
        preconditions: []
        side_effects:
          - "contracts in ISSUED/ACTIVE transition to CANCELLED_PRE_CENSUS if current logical date < term.early_census_date, else CANCELLED_LATE"
          - "payable_cents recomputed per calc cancellation_partial_pay at the applicable tier"
          - "CLAWBACK PayrollEntry rows posted for any prior ACCRUAL amounts exceeding the new payable_cents (per calc payroll_accrual_split reconciliation)"
          - "recompute each affected AdjunctFaculty.current_term_load_units and benefits_eligible"
          - "increments CourseSection.version by 1"
      - from: RUNNING
        to: COMPLETED
        trigger: "system (automatic during run_term_rollover) or POST /adjunct-hr/sections/{id}/complete"
        actor: system
        preconditions:
          - "current logical date > term.end_date"
        side_effects:
          - "every Contract with section_id == this section and contract_status == ACTIVE transitions to COMPLETED with payable_cents = gross_pay_cents (final variant)"
          - "each such contract's AdjunctFaculty.completed_terms += 1"
          - "recompute each affected AdjunctFaculty.current_term_load_units and benefits_eligible"
          - "increments CourseSection.version by 1"

  - entity: Contract
    initial_state: ISSUED
    terminal_states: [CANCELLED_PRE_CENSUS, CANCELLED_LATE, COMPLETED, VOIDED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "system (cascade from CourseSection SCHEDULED -> RUNNING at term start)"
        actor: system
        preconditions:
          - "faculty (via faculty_id) has compliance_status == COMPLIANT — otherwise the contract stays ISSUED and the section still flips RUNNING"
        side_effects:
          - "recompute AdjunctFaculty.current_term_load_units and benefits_eligible per calc term_load_units"
          - "increments Contract.version by 1"
        note: "guarded activation: a non-compliant faculty's contract remains ISSUED while the section runs"
      - from: ISSUED
        to: VOIDED
        trigger: "system (cascade from RetentionEntry mark-non-reappointed) or POST /adjunct-hr/contracts/{id}/void"
        actor: HRAdmin
        preconditions:
          - "contract is ISSUED (never activated)"
        side_effects:
          - "payable_cents = 0"
          - "any ACCRUAL PayrollEntry rows for this contract in OPEN periods are reversed with CLAWBACK entries"
          - "increments Contract.version by 1"
      - from: ISSUED
        to: CANCELLED_PRE_CENSUS
        trigger: "system (cascade from CourseSection cancel before early census)"
        actor: system
        preconditions: []
        side_effects:
          - "payable_cents recomputed per calc cancellation_partial_pay (pre-census tier)"
          - "recompute faculty load aggregates"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: CANCELLED_PRE_CENSUS
        trigger: "system (cascade from CourseSection cancel while current logical date < term.early_census_date)"
        actor: system
        preconditions: []
        side_effects:
          - "payable_cents recomputed per calc cancellation_partial_pay (pre-census tier)"
          - "CLAWBACK entries for accrued excess"
          - "recompute faculty load aggregates"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: CANCELLED_LATE
        trigger: "system (cascade from CourseSection cancel while current logical date >= term.early_census_date)"
        actor: system
        preconditions: []
        side_effects:
          - "payable_cents recomputed per calc cancellation_partial_pay (late tier: days-elapsed fraction with floor)"
          - "CLAWBACK entries for accrued excess"
          - "recompute faculty load aggregates"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (cascade from CourseSection completion)"
        actor: system
        preconditions: []
        side_effects:
          - "payable_cents = gross_pay_cents"
          - "faculty.completed_terms += 1"
          - "recompute faculty load aggregates"
          - "increments Contract.version by 1"

  - entity: PayrollPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /adjunct-hr/payroll-periods/{id}/lock"
        actor: PayrollOfficer
        preconditions: []
        side_effects: ["increments PayrollPeriod.version by 1"]
      - from: LOCKED
        to: CLOSED
        trigger: "POST /adjunct-hr/payroll-periods/{id}/close"
        actor: PayrollOfficer
        preconditions: []
        side_effects:
          - "posts ACCRUAL PayrollEntry rows for every Contract with contract_status IN {ISSUED, ACTIVE, CANCELLED_PRE_CENSUS, CANCELLED_LATE, COMPLETED} whose term window overlaps this period and which have not yet been accrued for this period, per calc payroll_accrual_split"
          - "posts CANCELLATION_PAYOUT entries (payable minus prior accruals minus clawbacks) for contracts cancelled before this close"
          - "increments PayrollPeriod.version by 1"
        note: "payroll close is the ops-run checkpoint that materializes PayrollEntry rows"

  - entity: RetentionEntry
    initial_state: LISTED
    terminal_states: [REAPPOINTED, NON_REAPPOINTED]
    transitions:
      - from: LISTED
        to: REAPPOINTED
        trigger: "POST /adjunct-hr/retention-entries/{id}/reappoint"
        actor: Dean
        preconditions:
          - "faculty (via faculty_id) has compliance_status == COMPLIANT"
          - "expected_faculty_version (request body) equals AdjunctFaculty.version (OCC)"
        side_effects:
          - "increments RetentionEntry.version by 1"
          - "increments AdjunctFaculty.version by 1 (reappointment touches faculty row)"
      - from: LISTED
        to: NON_REAPPOINTED
        trigger: "POST /adjunct-hr/retention-entries/{id}/mark-non-reappointed"
        actor: Dean
        preconditions:
          - "expected_faculty_version (request body) equals AdjunctFaculty.version (OCC)"
        side_effects:
          - "cascade per AdjunctFaculty RETENTION_LISTED -> NON_REAPPOINTED transition"
          - "increments RetentionEntry.version by 1"

# =============================================================================
# Table 2.1: Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: contract-issue-stale-faculty
    parent_entity: AdjunctFaculty
    write_endpoint: "POST /adjunct-hr/contracts"
    occ_field: "expected_faculty_version"
    description: |
      Issuing a Contract against an AdjunctFaculty whose version has advanced
      since the issuer last observed it is rejected. The legitimate case is a
      second issuer issuing a different section's contract against the same
      faculty after the first issuance bumped faculty.version; the second
      issuer's load-cap view is stale, so the write must re-read and retry.
    error_id: ERR_STALE_FACULTY_VERSION
    http_status: 412

  - rule_id: reappointment-stale-faculty
    parent_entity: AdjunctFaculty
    write_endpoint: "POST /adjunct-hr/retention-entries/{id}/reappoint"
    occ_field: "expected_faculty_version"
    description: |
      Reappointing from a RetentionEntry while carrying an AdjunctFaculty
      version the client observed before another reappointment/non-reappointment
      acted on the same faculty is rejected; the client's view of the faculty's
      retention state is stale.
    error_id: ERR_STALE_FACULTY_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: contract_gross_pay
    description: "Full-term gross pay for a contract at issuance (provisional) — tiered rate selection with longevity step"
    trigger: "on POST /adjunct-hr/contracts (issuance) and on re-read via GET /adjunct-hr/contracts/{id}"
    algorithm: tiered_pricing
    formula: |
      schedule = RateSchedule[contract.rate_schedule_id]
      steps = min(faculty.completed_terms, schedule.longevity_step_cap)
      effective_rate_cents = schedule.base_rate_cents + steps * schedule.longevity_step_cents
      if schedule.rate_basis == PER_CONTACT_HOUR:
          term_weeks = number of ISO calendar weeks the term spans, computed as
                       floor((term.end_date - term.start_date).days / 7)   # whole weeks only
          units = section.weekly_contact_hours * term_weeks                # keep full precision, no rounding here
          gross = effective_rate_cents * units
      else:  # PER_COURSE
          gross = effective_rate_cents * 1
      contract.gross_pay_cents = round_half_up(gross)   # single final rounding to integer cents
    input_set: "the Contract being issued; its CourseSection, TermConfig (via section.term_code), RateSchedule, and AdjunctFaculty"
    constants:
      WHOLE_WEEKS_ONLY: true
    precision: "integer cents; round_half_up exactly once at the end of the formula"
    variants:
      - name: provisional_gross
        when: "at issuance and while contract_status IN {ISSUED, ACTIVE}"
        difference: "computed from section.weekly_contact_hours as scheduled; this is the value stored in gross_pay_cents"
      - name: final_payable
        when: "at a terminal event (completion or cancellation)"
        difference: "completion: payable_cents = gross_pay_cents unchanged; cancellation: payable_cents = cancellation_partial_pay output, which generally differs from provisional gross"

  - name: cancellation_partial_pay
    description: "Pay owed when a section is cancelled — tiered by cancellation date against census boundaries with nested per-component rounding"
    trigger: "on Contract transitions ISSUED/ACTIVE -> CANCELLED_PRE_CENSUS and ACTIVE -> CANCELLED_LATE"
    algorithm: threshold
    formula: |
      term = TermConfig[section.term_code]
      cancel_date = date(cancelled_at)
      if cancel_date < term.early_census_date:
          tier = PRE_CENSUS
          payable = round_half_up(contract.gross_pay_cents * PRE_CENSUS_PCT)        # round the base component FIRST
          payable = payable + ONBOARDING_STIPEND_CENTS                                # then add the stipend (already integer)
      else:
          tier = LATE
          total_days = (term.end_date - term.start_date).days + 1                     # inclusive day count
          elapsed_days = (cancel_date - term.start_date).days + 1                     # inclusive through cancel date
          day_fraction = elapsed_days / total_days                                    # full-precision rational
          earned = round_half_up(contract.gross_pay_cents * day_fraction)             # round earned component first
          floor_amt = round_half_up(contract.gross_pay_cents * LATE_FLOOR_PCT)        # round floor component independently
          payable = max(earned, floor_amt)                                            # nested max of two independently-rounded components
      contract.payable_cents = payable
    input_set: "the cancelled Contract; its CourseSection; the TermConfig addressed by section.term_code; cancelled_at timestamp"
    constants:
      PRE_CENSUS_PCT: 0.10
      LATE_FLOOR_PCT: 0.25
      ONBOARDING_STIPEND_CENTS: 5000
    precision: "integer cents; each named component rounds round_half_up independently BEFORE the max/addition (order pinned)"
    variants:
      - name: pre_census_tier
        when: "cancel_date < early_census_date (strictly before)"
        difference: "flat 10% of gross plus fixed onboarding stipend; elapsed time irrelevant"
      - name: late_tier
        when: "cancel_date >= early_census_date (boundary inclusive)"
        difference: "max(days-elapsed fraction, 25% floor) of gross; stipend NOT paid"

  - name: term_load_units
    description: "Faculty load for benefits eligibility — dual-variant scheduled vs actual load"
    trigger: "on any Contract transition into or out of ACTIVE, on section cancel/complete, and on GET /adjunct-hr/faculty/{id}/load"
    algorithm: aggregation
    formula: |
      # SCHEDULED variant (provisional — used for pre-term planning previews)
      scheduled_load = sum(c.load_units for c in Contract
                           where c.faculty_id == faculty.id
                             and c.contract_status IN {ISSUED, ACTIVE}
                             and section(c).term_code == current_term.code)
      # ACTUAL variant (authoritative — gates benefits)
      actual_load = sum(c.load_units for c in Contract
                        where c.faculty_id == faculty.id
                          and c.contract_status == ACTIVE
                          and section(c).term_code == current_term.code)
      faculty.current_term_load_units = actual_load
      faculty.benefits_eligible = (actual_load >= TermConfig[current_term].load_cap_units)   # >= boundary, inclusive
    input_set: "Contracts of the faculty filtered by contract_status and by section term_code == the term whose start_date <= current logical date <= end_date (if none, the chronologically next term by start_date; ties broken by earliest TermConfig.created_at)"
    constants: {}
    precision: "load units kept at 2 decimals, round_half_up after summation"
    variants:
      - name: scheduled_load_variant
        when: "pre-term preview via GET /adjunct-hr/faculty/{id}/load?variant=scheduled"
        difference: "counts ISSUED + ACTIVE contracts, so identical contract data yields a HIGHER number than the actual variant before term start"
      - name: actual_load_variant
        when: "authoritative gate for benefits_eligible and the default GET load view"
        difference: "counts only ACTIVE contracts; an ISSUED-but-not-activated contract contributes 0"

  - name: payroll_accrual_split
    description: "Allocate a contract's payable amount across payroll periods overlapping the term — dual-variant split policy with chronological waterfall"
    trigger: "on PayrollPeriod LOCKED -> CLOSED (run_payroll_close) for each un-accrued contract overlapping the period"
    algorithm: waterfall_allocation
    formula: |
      # The split schedule for a contract is computed over ALL PayrollPeriods
      # (any status) whose closed date window intersects the term window, at the
      # moment each period closes; the entry posted at the close of period p is
      # exactly p's slice of that schedule (NOT the whole remaining payable).
      # Periods created later change the schedule only for periods not yet CLOSED.
      overlapping_periods = [p for p in PayrollPeriod
                             where [p.start_date, p.end_date] intersects [term.start_date, term.end_date]]
      # variant selection is pinned per contract by its rate schedule basis:
      #   PER_COURSE contracts use EQUAL_SPLIT; PER_CONTACT_HOUR contracts use DAYS_WEIGHTED.
      if variant == EQUAL_SPLIT:
          n = count(overlapping_periods)
          base = floor(contract.payable_cents / n)                        # integer division, cents
          remainder = contract.payable_cents - base * n
          # remainder cents distributed 1 cent each to the EARLIEST periods by start_date
          # (tie-break: earlier start_date first; then earlier period created_at)
          entry(p) = base + (1 if rank(p) < remainder else 0)
      else:  # DAYS_WEIGHTED
          days(p) = count of dates in [max(p.start_date, term.start_date), min(p.end_date, term.end_date)] inclusive
          total_days = sum(days(p) for p in overlapping_periods)
          # per-period rounding with the remainder swept into the chronologically LAST period:
          for p in overlapping_periods sorted by (start_date ASC, created_at ASC):
              if p is last:  entry(p) = contract.payable_cents - sum(entry(q) for q before p)
              else:          entry(p) = round_half_up(contract.payable_cents * days(p) / total_days)
      # At the close of period p the server posts ACCRUAL entry(p) minus any
      # amount already posted for p (normally zero). On cancellation after some
      # periods closed, the server posts, into the earliest period with
      # period_status == OPEN (tie-break: earliest start_date, then earliest
      # created_at), CLAWBACK entries reversing the excess of prior ACCRUALs
      # over the new payable_cents; if no OPEN period exists the clawback posts
      # into the period being closed.
    input_set: "Contracts in any non-VOIDED state whose section term window intersects the period being closed; VOIDED contracts are excluded entirely"
    constants: {}
    precision: "integer cents; DAYS_WEIGHTED rounds each non-final period round_half_up and sweeps the remainder into the chronologically last period so the per-contract total is exact"
    variants:
      - name: equal_split
        when: "contract's RateSchedule.rate_basis == PER_COURSE"
        difference: "identical base cents per period with remainder cents front-loaded to earliest periods"
      - name: days_weighted
        when: "contract's RateSchedule.rate_basis == PER_CONTACT_HOUR"
        difference: "amounts proportional to overlap days with remainder swept into the LAST period — same contract accrues different per-period amounts than equal_split"

  - name: retention_composite_score
    description: "Weighted composite of evaluation scores driving retention-list rank — combinatorial weighted scoring"
    trigger: "on POST /adjunct-hr/evaluations"
    algorithm: weighted_scoring
    formula: |
      # weights sum to 1.00; each component is scaled THEN rounded, then summed (pinned order)
      t = round_half_up(e.teaching_score * W_TEACHING * 100)     # integer hundredths
      s = round_half_up(e.service_score * W_SERVICE * 100)
      c = round_half_up(e.compliance_score * W_COMPLIANCE * 100)
      e.composite_score = (t + s + c) / 100                      # 2-decimal composite
      # rank: within (department_id, list_term_code) sort composite_score DESC,
      # tie-break by teaching_score DESC, then by earliest EvaluationRecord.created_at ASC
    input_set: "the single EvaluationRecord being created"
    constants:
      W_TEACHING: 0.60
      W_SERVICE: 0.25
      W_COMPLIANCE: 0.15
    precision: "components rounded to hundredths round_half_up BEFORE summation (round-per-component-then-sum, pinned)"

  - name: retention_list_rank
    description: "Rank positions on a department retention list — combinatorial ordering with circular-looking dependency (rank depends on entries; entry creation may re-rank prior entries)"
    trigger: "on POST /adjunct-hr/retention-entries (creation triggers re-rank of the whole list scope)"
    algorithm: constraint_propagation
    formula: |
      scope = [e for e in RetentionEntry
               where e.department_id == new.department_id
                 and e.list_term_code == new.list_term_code
                 and e.entry_status == LISTED]
      # evaluation order pinned: (1) gather scope AFTER inserting the new entry;
      # (2) order by composite DESC where composite = latest EvaluationRecord.composite_score
      #     for that faculty whose term_code < list_term_code, latest by created_at;
      # (3) ties by that record's teaching_score DESC, then record created_at ASC;
      # (4) faculty with NO prior evaluation sorts last, ordered among themselves
      #     by AdjunctFaculty.created_at ASC;
      # (5) assign rank_position 1..N in that order, rewriting all rows in scope.
    input_set: "all LISTED RetentionEntry rows in the (department_id, list_term_code) scope plus the new entry"
    constants: {}
    precision: "integer ranks; deterministic total order (no id-based tie-breaks anywhere)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and every *_id body field resolves to an existing entity, validated left-to-right (path before body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target entity is in a state from which the requested transition exists per §1.2 (covers ERR_INVALID_STATE, ERR_ALREADY_TERMINAL via the specific state errors below)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (publish/suspend/resume/close/archive, start-review/return-for-revision/resubmit/approve/reject/withdraw, verify/reject credential, cancel/complete section, void contract, lock/close payroll period, reappoint/mark-non-reappointed, reinstate-compliance)"
  - priority: 5
    category: state
    check: "posting-specific: POST /applications only while posting.posting_status == OPEN and current logical date within [open_date, close_date] inclusive"
    error_id: ERR_POSTING_NOT_OPEN
    http_status: 409
    applies_to: "POST /adjunct-hr/applications"
  - priority: 6
    category: business_safety
    check: "segregation of duties: application approve rejects when acting HRReviewer's X-User-ID equals verified_by_hr_id on any VERIFIED CredentialVerification of that application"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /adjunct-hr/applications/{id}/approve"
  - priority: 7
    category: business_safety
    check: "contract activation guard and compliance gates: reinstate-compliance requires a VERIFIED BACKGROUND_CHECK; reappoint requires faculty compliance_status == COMPLIANT"
    error_id: ERR_COMPLIANCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /adjunct-hr/faculty/{id}/reinstate-compliance, POST /adjunct-hr/retention-entries/{id}/reappoint"
  - priority: 8
    category: business_referential
    check: "credential completeness for approval: all TRANSCRIPT/DEGREE credentials VERIFIED, none PENDING, and at least one VERIFIED tier >= posting.min_education_tier"
    error_id: ERR_CREDENTIALS_INCOMPLETE
    http_status: 422
    applies_to: "POST /adjunct-hr/applications/{id}/approve"
  - priority: 9
    category: business_constraint
    check: "uniqueness: Department.code, TermConfig.code, PayrollPeriod.period_code, (term_code, course_code, section_code), and applicant_email among non-terminal applications per posting"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /adjunct-hr/departments, POST /adjunct-hr/terms, POST /adjunct-hr/payroll-periods, POST /adjunct-hr/sections, POST /adjunct-hr/applications"
  - priority: 10
    category: business_temporal
    check: "date coherence: end_date > start_date with >= 14 day span; census ordering start <= early < late <= end; rate-schedule half-open interval ordering; posting close_date >= open_date; payroll period end >= start"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /adjunct-hr/terms, POST /adjunct-hr/rate-schedules, POST /adjunct-hr/postings, POST /adjunct-hr/payroll-periods"
  - priority: 11
    category: business_temporal
    check: "rate-schedule overlap: publishing a schedule whose [start,end) overlaps an existing PUBLISHED schedule for the same (department_id, education_tier) — half-open adjacency (a.end == b.start) is NOT an overlap"
    error_id: ERR_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /adjunct-hr/rate-schedules/{id}/publish"
  - priority: 12
    category: business_temporal
    check: "payroll-period overlap: a new period whose [start_date, end_date] closed interval intersects any existing non-CLOSED period's closed interval is rejected; touching endpoints (a.end == b.start) IS an overlap for payroll (closed semantics)"
    error_id: ERR_PAYROLL_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /adjunct-hr/payroll-periods"
  - priority: 13
    category: business_temporal
    check: "LOW_ENROLLMENT cancellation policy: enrollment < min_enrollment AND current logical date < term.early_census_date (both strict)"
    error_id: ERR_CANCELLATION_POLICY
    http_status: 422
    applies_to: "POST /adjunct-hr/sections/{id}/cancel"
  - priority: 14
    category: business_referential
    check: "contract issuance references: rate schedule is PUBLISHED, its department matches section's department, its education_tier equals faculty.education_tier, and its effective window covers the section term start_date; section not CANCELLED/COMPLETED; faculty retention_status != NON_REAPPOINTED; term rollover_status != ROLLED_OVER"
    error_id: ERR_CONTRACT_REFERENCE_INVALID
    http_status: 422
    applies_to: "POST /adjunct-hr/contracts"
  - priority: 15
    category: business_fiscal
    check: "load cap guard at issuance: faculty prospective load (sum of load_units over existing ISSUED/ACTIVE contracts in the section's term, plus the new contract's load_units) must be <= load_cap_units + 1.00 (hard-coded OVERAGE_ALLOWANCE); rejection is strict-greater-than, so exactly cap+1.00 passes; the benefits boundary itself (>= load_cap_units) is a computed flag, not an error"
    error_id: ERR_LOAD_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /adjunct-hr/contracts"
  - priority: 16
    category: business_fiscal
    check: "payroll close guard: CLOSED periods reject further closes; a period can only close after all periods with earlier start_date are CLOSED (chronological close order)"
    error_id: ERR_PAYROLL_CLOSE_ORDER
    http_status: 422
    applies_to: "POST /adjunct-hr/payroll-periods/{id}/close"
  - priority: 17
    category: business_constraint
    check: "revision loop bound: return-for-revision requires revision_count < MAX_REVISIONS (3)"
    error_id: ERR_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /adjunct-hr/applications/{id}/return-for-revision"
  - priority: 18
    category: business_referential
    check: "retire guard: rate schedule cannot retire while referenced by ISSUED/ACTIVE contracts; posting cannot archive with UNDER_REVIEW/RETURNED_FOR_REVISION applications; department cannot deactivate (active=false via PATCH) while OPEN postings or ISSUED/ACTIVE contracts reference it"
    error_id: ERR_REFERENCE_IN_USE
    http_status: 409
    applies_to: "POST /adjunct-hr/rate-schedules/{id}/retire, POST /adjunct-hr/postings/{id}/archive, PATCH /adjunct-hr/departments/{id}"
  - priority: 19
    category: business_constraint
    check: "request body schema: required fields present, enum members valid, numeric ranges respected (contact_hour_value > 0, scores within 0-5 with <= 2 decimals, base_rate_cents >= 1, enrollment >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 20
    category: state
    check: "OCC: expected_faculty_version equals AdjunctFaculty.version at write time on OCC-guarded endpoints"
    error_id: ERR_STALE_FACULTY_VERSION
    http_status: 412
    applies_to: "POST /adjunct-hr/contracts, POST /adjunct-hr/retention-entries/{id}/reappoint, POST /adjunct-hr/retention-entries/{id}/mark-non-reappointed"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: /adjunct-hr/_clock/set_current_utc
    description: "Sets the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time. All date-sensitive rules (posting windows, census tiers, section activation, rollover) read this clock."
    roles: [HRAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "advancing the clock across a posting close_date auto-closes that posting (OPEN -> CLOSED with EXPIRED cascade on SUBMITTED applications)"
      - "advancing the clock to/past a term start_date flips that term's SCHEDULED sections to RUNNING and activates guarded contracts"

  # --- Department ---
  - method: POST
    path: /adjunct-hr/departments
    description: "Create a department"
    roles: [HRAdmin]
    code: 201
    input: [code, name, contact_hour_value, "active?"]
    output: Department
    side_effects: []
  - method: GET
    path: /adjunct-hr/departments/{id}
    description: "Fetch one department"
    roles: [HRAdmin, HRReviewer, DepartmentChair, Dean, PayrollOfficer]
    code: 200
    input: []
    output: Department
    side_effects: []
  - method: GET
    path: /adjunct-hr/departments
    description: "List departments"
    roles: [HRAdmin, HRReviewer, DepartmentChair, Dean, PayrollOfficer]
    code: 200
    input: [ "active?", "limit?", "offset?"]
    output: Department[]
    side_effects: []
  - method: PATCH
    path: /adjunct-hr/departments/{id}
    description: "Update mutable department fields (name, contact_hour_value, active); deactivation guarded by ERR_REFERENCE_IN_USE"
    roles: [HRAdmin]
    code: 200
    input: [ "name?", "contact_hour_value?", "active?"]
    output: Department
    side_effects: ["increments Department.version by 1"]

