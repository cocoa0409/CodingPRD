            - "MarkdownStep.${step4_id}.price_cents == 2499 (4999 - round_half_up(2499.5) == 4999 - 2500); rounding the price instead of the discount would return 2500"
            - "window_end_date_exclusive is '2026-11-30', '2026-12-14', '2026-12-28' and '2027-01-15' for rungs 1..4 - the last rung takes the plan's exit_date_target"
            - "MarkdownPlan.${plan_id}.ladder_step_count == 4 and every rung is PLANNED"
      - name: gross_markdown_counts_applied_executions_only
        claim_type: Input Set Filtering
        grounds:
          - calculations.markdown_liability_line.input_set
