  code: 200
  input: []
  output: MappingDecision
  side_effects:
  - SUBMITTED->HRBP_REVIEWED; version += 1
- method: POST
  path: /comp/mapping-decisions/{id}/comp-triage
  description: Comp analyst triage gate
  roles:
  - CompAnalyst
  code: 200
  input: []
  output: MappingDecision
  side_effects:
  - HRBP_REVIEWED->COMP_TRIAGED; version += 1
- method: POST
  path: /comp/mapping-decisions/{id}/approve
  description: Final approval; applies reslot salary; OCC-guarded on employee
  roles:
  - CompManager
  code: 200
  input:
  - expected_employee_version
  output: MappingDecision
  side_effects:
  - COMP_TRIAGED->APPROVED; FINAL adjustment applied to Employee; department pool debited; program payroll rollup recomputed; increments Employee.version by 1
- method: POST
  path: /comp/mapping-decisions/{id}/reject
  description: Reject a triaged decision
  roles:
  - CompManager
  code: 200
  input:
  - reason?
  output: MappingDecision
  side_effects:
  - COMP_TRIAGED->REJECTED; decided_by_user_id set
- method: POST
  path: /comp/mapping-decisions/{id}/return
  description: Return a submitted/reviewed decision to the manager
  roles:
  - HRBP
  - CompAnalyst
  code: 200
  input:
  - reason?
  output: MappingDecision
  side_effects:
  - SUBMITTED/HRBP_REVIEWED->RETURNED; version += 1
- method: POST
  path: /comp/mapping-decisions/{id}/resubmit
  description: Resubmit a returned decision (recomputes provisional estimate)
  roles:
  - DepartmentManager
  code: 200
  input: []
  output: MappingDecision
  side_effects:
  - RETURNED->SUBMITTED; PROVISIONAL re-run; version += 1
- method: POST
  path: /comp/mapping-decisions/{id}/withdraw
  description: Withdraw a decision (from DRAFT, SUBMITTED, or RETURNED)
  roles:
  - DepartmentManager
  code: 200
  input: []
  output: MappingDecision
  side_effects:
  - ->WITHDRAWN; version += 1
- method: POST
  path: /comp/mapping-decisions/{id}/reverse
  description: Compensate an approval within 30 days (restores salary/profile, credits pool)
  roles:
  - CompManager
  code: 200
  input: []
  output: MappingDecision
  side_effects:
  - APPROVED->REVERSED; compensation side effects per §1.2
- method: POST
  path: /comp/exception-requests
  description: Create an exception request (SUBMITTED) for an employee of the caller's department
  roles:
  - DepartmentManager
  code: 201
  input:
  - employee_id
  - pay_band_id
  - type
  - requested_salary_cents
  - justification
  output: ExceptionRequest
  side_effects:
  - 'status=SUBMITTED; finance_required computed; rolling-cap and cap checks run; ownership: employee.department_id must equal X-User-ID'
- method: GET
  path: /comp/exception-requests
  description: List exception requests
  roles:
  - CompAdmin
  - CompAnalyst
  - CompManager
  - HRBP
  - FinancePartner
  - DepartmentManager
  code: 200
  input:
  - limit?
  - offset?
  - employee_id?
  - pay_band_id?
  - status?
  output: ExceptionRequest[]
  side_effects: []
- method: GET
  path: /comp/exception-requests/{id}
  description: Get an exception request
  roles:
  - CompAdmin
  - CompAnalyst
  - CompManager
  - HRBP
  - FinancePartner
  - DepartmentManager
  code: 200
  input: []
  output: ExceptionRequest
  side_effects: []
- method: POST
  path: /comp/exception-requests/{id}/hrbp-pass
  description: HRBP gate pass
  roles:
  - HRBP
  code: 200
  input: []
  output: ExceptionRequest
  side_effects:
  - SUBMITTED->HRBP_PASSED; version += 1
- method: POST
  path: /comp/exception-requests/{id}/comp-pass
  description: Comp manager gate; branches to FINANCE_REVIEW (ABOVE_MAX_HIRE) or applies salary (others)
  roles:
  - CompManager
  code: 200
  input: []
  output: ExceptionRequest
  side_effects:
  - HRBP_PASSED->FINANCE_REVIEW or ->APPROVED per type; approval applies salary per §1.2
- method: POST
  path: /comp/exception-requests/{id}/finance-pass
  description: Finance gate; applies salary on pass
  roles:
  - FinancePartner
  code: 200
  input: []
  output: ExceptionRequest
  side_effects:
  - FINANCE_REVIEW->APPROVED; salary application per §1.2
- method: POST
  path: /comp/exception-requests/{id}/deny
  description: Deny at the caller's gate
  roles:
  - HRBP
  - CompManager
  - FinancePartner
  code: 200
  input:
  - reason?
  output: ExceptionRequest
  side_effects:
  - ->DENIED; version += 1
- method: POST
  path: /comp/exception-requests/{id}/return
  description: Return to submitter
  roles:
  - HRBP
  - CompManager
  code: 200
  input:
  - reason?
  output: ExceptionRequest
  side_effects:
  - ->RETURNED; version += 1
- method: POST
  path: /comp/exception-requests/{id}/resubmit
  description: Resubmit a returned request (original created_at retained)
  roles:
  - DepartmentManager
  code: 200
  input: []
  output: ExceptionRequest
  side_effects:
  - RETURNED->SUBMITTED; version += 1
- method: POST
  path: /comp/exception-requests/{id}/rescind
  description: Compensate an approval within 30 days (restores salary, credits pool)
  roles:
  - CompManager
  code: 200
  input: []
  output: ExceptionRequest
  side_effects:
  - APPROVED->RESCINDED; compensation per §1.2
- method: POST
  path: /comp/refresh-cycles
  description: Schedule a band refresh (PUBLISHED programs; half-open window conflict check)
  roles:
  - CompManager
  code: 201
  input:
  - comp_program_id
  - planned_window_start
  - planned_window_end
  - effective_date
  output: RefreshCycle
  side_effects:
  - status=SCHEDULED
- method: GET
  path: /comp/refresh-cycles
  description: List refresh cycles
  roles:
  - CompAdmin
  - CompAnalyst
  - CompManager
  - HRBP
  - FinancePartner
  - DepartmentManager
  code: 200
  input:
  - limit?
  - offset?
  - comp_program_id?
  - status?
  output: RefreshCycle[]
  side_effects: []
- method: GET
  path: /comp/refresh-cycles/{id}
  description: Get a refresh cycle
  roles:
  - CompAdmin
  - CompAnalyst
  - CompManager
  - HRBP
  - FinancePartner
  - DepartmentManager
  code: 200
  input: []
  output: RefreshCycle
  side_effects: []
- method: POST
  path: /comp/refresh-cycles/{id}/compute-impact
  description: Run refresh_budget_impact_rollup
  roles:
  - CompAnalyst
  code: 200
  input: []
  output: RefreshCycle
  side_effects:
  - SCHEDULED->IMPACT_COMPUTED; budget_impact_cents + affected_employee_count set; version += 1
- method: POST
  path: /comp/refresh-cycles/{id}/approve
  description: Finance approval gated on budget impact
  roles:
  - FinancePartner
  code: 200
  input: []
  output: RefreshCycle
  side_effects:
  - IMPACT_COMPUTED->APPROVED; version += 1
- method: POST
  path: /comp/refresh-cycles/{id}/apply
  description: Apply refresh on/after effective_date; supersedes bands, adjusts salaries, auto-creates red-circle exceptions; OCC-guarded on program
  roles:
  - CompManager
  code: 200
  input:
  - expected_comp_program_version
  output: RefreshCycle
  side_effects:
  - APPROVED->APPLIED; cascade per §1.2; increments CompProgram.version by 1
- method: POST
  path: /comp/refresh-cycles/{id}/cancel
  description: Cancel a scheduled or computed cycle
  roles:
  - CompManager
  code: 200
  input: []
  output: RefreshCycle
  side_effects:
  - ->CANCELLED; version += 1
- method: POST
  path: /comp/_clock/set_current_utc
  description: Set the server's logical clock (ISO8601). Startup default before any set call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to
    wall-clock time.
  roles:
  - CompAdmin
  code: 200
  input:
  - to_iso8601
  output:
    current_utc: string
  side_effects:
  - logical clock advanced; all date-sensitive rules read this clock
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: missing or unknown X-User-Role / missing X-User-ID
- id: ERR_FORBIDDEN_ROLE
  http: 403
  condition: role not listed for the endpoint
- id: ERR_INVALID_REQUEST
  http: 400
  condition: missing required field, non-ISO date, negative amount, sample_size < 1, or other body-shape violation
- id: ERR_INVALID_ENUM
  http: 400
  condition: enum field carries an undeclared member (e.g., target_percentile P90, to_state not in the machine)
- id: ERR_NOT_FOUND
  http: 404
  condition: path id or body FK reference does not exist
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_<parent>_version does not equal the parent's current version (OCC)
- id: ERR_PROGRAM_STATE_FORBIDS
  http: 409
  condition: CompProgram posture does not permit the operation (pricing, publish, submit, exception create, refresh create/apply)
- id: ERR_INVALID_STATE_TRANSITION
  http: 409
  condition: trigger not declared for the entity's current (non-terminal) state
- id: ERR_ALREADY_TERMINAL
  http: 409
  condition: entity sits in a terminal state; no further transitions
- id: ERR_FLSA_SALARY_BASIS_VIOLATION
  http: 422
  condition: EXEMPT classification or band approval would violate the FLSA salary-basis floor
- id: ERR_FLSA_TESTS_INCOMPLETE
  http: 409
  condition: profile submit/approve attempted while flsa_classification == PENDING
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: same X-User-ID attempting to approve what it submitted (exception comp-pass, mapping approve)
- id: ERR_OWNERSHIP_MISMATCH
  http: 403
  condition: DepartmentManager acting on an employee whose department_id != X-User-ID
- id: ERR_DUPLICATE_BAND
  http: 409
  condition: non-SUPERSEDED band already exists for (program, family, level, geo)
- id: ERR_DUPLICATE_POLICY
  http: 409
  condition: progression policy already exists for (family, from_level, to_level)
- id: ERR_BAND_OVERLAP_EXCEEDS_POLICY
  http: 422
  condition: unrounded overlap vs adjacent-lower band exceeds policy max
- id: ERR_PROGRESSION_BELOW_POLICY
  http: 422
  condition: unrounded midpoint progression below policy min
- id: ERR_NO_MARKET_DATA
  http: 422
  condition: pricing candidate set empty for the chosen variant
- id: ERR_GEO_CYCLE
  http: 422
  condition: geo zone parent chain forms a cycle
- id: ERR_PROFILE_IN_USE
  http: 409
  condition: retire attempted while ACTIVE employees reference the profile
- id: ERR_REFRESH_WINDOW_CONFLICT
  http: 409
  condition: planned window overlaps a non-terminal cycle of the same program (half-open intervals)
- id: ERR_REFRESH_NOT_DUE
  http: 409
  condition: apply attempted before effective_date (logical clock)
- id: ERR_REVERSE_WINDOW_EXPIRED
  http: 422
  condition: reverse/rescind attempted after anchor + 30 days
- id: ERR_CUT_TOO_CLOSE
  http: 422
  condition: market cut within 30 days of another cut for the same (job_profile_id, geo_zone_id)
- id: ERR_EXCEPTION_ROLLING_CAP
  http: 422
  condition: employee already has 2 in-flight-or-approved exception requests in the trailing 365 days
- id: ERR_EXCEPTION_CAP_EXCEEDED
  http: 422
  condition: requested_salary_cents exceeds exception_cap_evaluation cap
- id: ERR_DEPARTMENT_POOL_EXHAUSTED
  http: 422
  condition: positive adjustment exceeds department pool headroom (adjustment_pool_cents - committed_pool_cents)
- id: ERR_BUDGET_IMPACT_EXCEEDS
  http: 422
  condition: refresh budget_impact_cents exceeds program refresh_budget_cents
- id: ERR_REFERENCED_ENTITY_STATE
  http: 422
  condition: referenced entity in wrong state (profile not APPROVED, employee not ACTIVE, band not PUBLISHED, family RETIRED)
roles:
- name: CompAdmin
  description: Compensation administrator; owns framework configuration, program lifecycle, budgets, geo structure, employee data fixes, and the logical clock
  identity: opaque
  exclusive_operations:
  - programs create/patch/transition
  - job-families create/retire
  - job-levels create
  - geo-zones create
  - departments create
  - employees PATCH
  - logical clock
  shared_operations:
  - all list/get reads
- name: CompAnalyst
  description: Compensation analyst; drafts job profiles, market surveys/cuts, prices bands, triages mapping decisions, computes refresh impact
  identity: opaque
  exclusive_operations:
  - job-profiles create/determine-flsa/submit/revise
  - market-surveys create
  - market-cuts create/set-exclusion
  - pay-bands create/price
  - mapping-decisions comp-triage
  - refresh-cycles compute-impact
  shared_operations:
  - all list/get reads
  - mapping-decisions return
- name: CompManager
  description: Compensation manager; approves profiles, surveys, bands, mapping decisions; owns progression policies, exception comp gate, rescinds/reverses, refresh
    schedule/apply/cancel
  identity: opaque
  exclusive_operations:
  - job-profiles approve/return/retire
  - market-surveys accept/reject
  - progression-policies create
  - pay-bands approve/publish/reopen
  - mapping-decisions approve/reject/reverse
  - exception-requests comp-pass/rescind
  - refresh-cycles create/apply/cancel
  shared_operations:
  - all list/get reads
  - exception-requests deny/return
- name: HRBP
  description: HR business partner; creates/terminates employees, HRBP gate on mappings and exceptions
  identity: opaque
  exclusive_operations:
  - employees create/terminate
  - mapping-decisions hrbp-review
  - exception-requests hrbp-pass
  shared_operations:
  - all list/get reads
  - mapping-decisions return
  - exception-requests deny/return
- name: FinancePartner
  description: Finance partner; budget gates on exception finance review and refresh approval
  identity: opaque
  exclusive_operations:
  - exception-requests finance-pass
  - refresh-cycles approve
  shared_operations:
  - all list/get reads
  - exception-requests deny
- name: DepartmentManager
  description: Department manager acting for their own department (X-User-ID == Department.id); originates mapping decisions and exception requests for own employees
  identity: entity_backed:Department
  exclusive_operations:
  - mapping-decisions create/submit/resubmit/withdraw
  - exception-requests create/resubmit
  shared_operations:
  - all list/get reads
