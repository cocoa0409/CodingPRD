              payload: { target_status: "VOIDED", void_reason: "Issued against the wrong associate" }
              as: StoreManager
              as_user_id: "${sm1}"
            - call: "POST /price-integrity/refund-claims"
              payload: { scan_line_id: "${sl_over}", customer_ref: "CUST-1", expected_scanner_audit_version: "${audit_1_v}" }
              as: CustomerServiceDesk
              captures: { claim_1: $.data.id }
            - call: "POST /price-integrity/refund-claims/${claim_1}/settle"
              payload: { target_status: "DENIED", denial_reason: "No receipt presented" }
              as: CustomerServiceDesk
          trigger:
            - call: "POST /price-integrity/inspection-findings/${find_2}/transition"
              payload: { target_status: "REMEDIATION_PLANNED", remediation_action_code: "RELABEL", remediation_evidence_ref: "PHOTO-9" }
              as: ComplianceOfficer
              captures: { err_find: $.data.error_id }
            - call: "POST /price-integrity/accountability-actions/${act_1}/transition"
              payload: { target_status: "VOIDED", void_reason: "Voiding again" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { err_act: $.data.error_id }
            - call: "POST /price-integrity/refund-claims/${claim_1}/settle"
              payload: { target_status: "APPROVED" }
              as: CustomerServiceDesk
              captures: { err_claim: $.data.error_id }
          assert:
            - "WAIVED -> REMEDIATION_PLANNED: HTTP 409 with ${err_find} == ERR_FINDING_INVALID_STATE; InspectionFinding.${find_2}.status is still WAIVED and remediation_action_code is still null"
            - "VOIDED -> VOIDED: HTTP 409 with ${err_act} == ERR_ACTION_INVALID_STATE (priority 40 fires because VOIDED is terminal, so priority 41 is never consulted); void_reason is still 'Issued against the wrong associate'"
            - "DENIED -> APPROVED: HTTP 409 with ${err_claim} == ERR_REFUND_CLAIM_INVALID_STATE; RefundClaim.${claim_1}.status is still DENIED and denial_reason is still 'No receipt presented'"
            - "Associate.${la1}.accountability_score is still 100 — the voided action stayed out of the ISSUED weight sum and the failed re-void did not re-add it"
            - "InspectionFinding.${find_1}.status is still OPEN — the three refusals had no collateral effect"

