      - name: priority_conflict_employer_state_beats_blackout_window_on_exit_request
        grounds:
          - validations[priority=15]
          - validations[priority=47]
          - validations[priority=67]
          - errors.ERR_EMPLOYER_INVALID_STATE
          - errors.ERR_INVALID_BLACKOUT_WINDOW
        distinguishing_aspect: |
          One POST /pep/exit-transfers violates three rules at once — priority 15 (the employer
          is SUSPENDED, not ACTIVE), priority 47 (blackout_end_date precedes
          blackout_start_date) and priority 67 (an open LATE deposit correction) — and only the
          priority-15 state error may surface. An implementation that shape-checks dates before
          reading entity state returns 422 ERR_INVALID_BLACKOUT_WINDOW; one that runs the
          fiscal safety net first returns ERR_OPEN_LATE_DEPOSIT_CORRECTION. Both are wrong.
        test_recipe:
