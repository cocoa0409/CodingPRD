              as: BenefitsAdmin
              captures: { vl_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${vl_off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 0, employer_contribution_pct: 0.0, rate_per_1000_monthly_cents: 25 }
              as: BenefitsAdmin
              captures: { vl_tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${vl_tier_id}", coverage_amount_cents: 30000000, coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/submit-eoi"
              payload: {}
              as: BenefitsAdmin
            - call: "GET /eoi-requests?enrollment_id=${enr_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { eoi_id: $.data.0.id }
            - call: "POST /eoi-requests/${eoi_id}/decide"
              payload: { decision: "DENIED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /eoi-requests/${eoi_id}/decide"
              payload: { decision: "APPROVED" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (EOIRequest already DENIED, enrollment no longer PENDING_EOI)"
            - "Enrollment.${enr_id}.status == DRAFT (reverted by the prior DENIED decision)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: waiting_period_half_open_overlap_rejected_adjacency_allowed
        grounds:
          - validations[priority=10]
          - entities.WaitingPeriod.start_date
          - entities.WaitingPeriod.end_date
        distinguishing_aspect: |
          Half-open [start,end) interval semantics on WaitingPeriod: a window whose
          range intersects an existing one is rejected, but adjacency (new.start ==
          existing.end) is allowed because end is exclusive.
        test_recipe:
          setup:
            - "Employee with an INITIAL waiting period [2026-01-01, 2026-02-01)."
          setup_api_calls:
            - call: "POST /employees"
              payload: { full_name: "Op Yang", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
          trigger:
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "REINSTATEMENT", start_date: "2026-01-15", end_date: "2026-03-01" }
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Overlapping window (2026-01-15 intersects [2026-01-01,2026-02-01)) -> error_id == ERR_WAITING_PERIOD_OVERLAP"
            - "An adjacent window starting exactly 2026-02-01 would be accepted (end is exclusive)"

      - name: coverage_span_closed_overlap_rejected_adjacency_allowed
        grounds:
          - validations[priority=11]
          - entities.Enrollment.coverage_start_date
          - entities.Enrollment.coverage_end_date
        distinguishing_aspect: |
          Closed-inclusive [start,end] interval semantics on Enrollment coverage
          spans of the same benefit_type (different resource + different interval
          arithmetic from WaitingPeriod's half-open): two ACTIVE spans whose closed
          ranges share an endpoint overlap and are rejected; adjacency requires
          prev_end + 1 day == new_start.
        test_recipe:
          setup:
            - "Employee ELIGIBLE with one ACTIVE MEDICAL EMPLOYEE_ONLY enrollment covering [2026-02-01, open]."
            - "A second DRAFT MEDICAL enrollment with coverage_start_date 2026-02-15 (overlaps the open span)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees"
              payload: { full_name: "Pi Zhao", hire_date: "2026-01-01", employment_type: "FULL_TIME", payroll_schedule: "SEMI_MONTHLY", monthly_household_income_cents: 500000 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /employees/${emp_id}/waiting-periods"
              payload: { window_type: "INITIAL", start_date: "2026-01-01", end_date: "2026-02-01" }
              as: BenefitsAdmin
            - call: "POST /plan-offerings"
              payload: { benefit_type: "MEDICAL", name: "Gold PPO" }
              as: BenefitsAdmin
              captures: { gold_off_id: $.data.id }
            - call: "POST /plan-tiers"
              payload: { plan_offering_id: "${gold_off_id}", coverage_level: "EMPLOYEE_ONLY", monthly_premium_cents: 60000, employer_contribution_pct: 0.70 }
              as: BenefitsAdmin
              captures: { gold_tier_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-02-10T00:00:00Z" }
              as: BenefitsAdmin
            - call: "POST /employees/${emp_id}/enrollments"
              payload: { plan_tier_id: "${gold_tier_id}", coverage_start_date: "2026-02-01" }
              as: BenefitsAdmin
              captures: { enr1_id: $.data.id }
            - call: "GET /employees/${emp_id}"
              payload: {}
