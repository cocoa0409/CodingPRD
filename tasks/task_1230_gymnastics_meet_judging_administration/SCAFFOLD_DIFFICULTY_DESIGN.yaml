            - call: "POST /api/v1/scores/${sc_id}/inquiries"
              payload: { filed_by_coach_id: "${c_id}" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { inq_id: $.data.id }
          trigger:
            - call: "POST /api/v1/inquiries/${inq_id}/begin-review"
              payload: {}
              as: MeetReferee
            - call: "POST /api/v1/inquiries/${inq_id}/return-to-queue"
              payload: {}
              as: MeetReferee
            - call: "POST /api/v1/inquiries/${inq_id}/begin-review"
              payload: {}
              as: MeetReferee
            - call: "POST /api/v1/inquiries/${inq_id}/return-to-queue"
              payload: {}
              as: MeetReferee
            - call: "GET /api/v1/inquiries/${inq_id}"
              payload: {}
