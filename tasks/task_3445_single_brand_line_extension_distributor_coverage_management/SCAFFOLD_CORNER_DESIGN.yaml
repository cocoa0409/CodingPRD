  # ===========================================================================
  - section: errors
    instances:
      - name: lockdown_blocks_launch_and_lift_requires_clear_conditions
        claim_type: violation_to_error
        grounds:
          - errors.ERR_BRAND_IN_LOCKDOWN
          - errors.ERR_LOCKDOWN_CONDITIONS_UNMET
          - state_machines.Brand
        distinguishing_aspect: "PROTECTIVE_LOCKDOWN blocks launch with ERR_BRAND_IN_LOCKDOWN; lift-lockdown succeeds with a clean slate but fails with ERR_LOCKDOWN_CONDITIONS_UNMET while a severity-5 case is open."
        test_recipe:
          setup:
            - "Logical clock at the startup default. Brand with PILOT core line (sealed formulation); market exists."
          setup_api_calls:
            - *k_brand
            - *k_market
            - *k_line_core
            - *k_form
            - *k_seal
            - *k_review
            - call: "POST /brand-ops/brands/${brand_id}/lockdown"
              payload: { reason: "MANUAL" }
              as: ComplianceAuditor
              as_user_id: "ca-1"
          trigger:
            - call: "POST /brand-ops/product-lines/${line_id}/launch"
              payload: {}
              as: BrandManager
              captures: { error_id: $.data.error_id }
            - call: "POST /brand-ops/brands/${brand_id}/lift-lockdown"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "ca-1"
              captures: { brand_status: $.data.status }
            - call: "POST /brand-ops/brands/${brand_id}/counterfeit-cases"
              payload: { market_id: "${market_id}", channel: "HARDWARE", severity: 5 }
              as: ComplianceAuditor
              as_user_id: "ca-1"
              captures: { case_id: $.data.id }
            - call: "POST /brand-ops/brands/${brand_id}/lockdown"
              payload: { reason: "COUNTERFEIT_SURGE" }
              as: ComplianceAuditor
              as_user_id: "ca-1"
            - call: "POST /brand-ops/brands/${brand_id}/lift-lockdown"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "ca-1"
              captures: { error_id_2: $.data.error_id }
          assert:
            - "launch during lockdown: 409 ERR_BRAND_IN_LOCKDOWN"
            - "lift with no open severity-5 case and no recent breach: 200, status OPERATING, lockdown_reason null"
            - "second lockdown with reason COUNTERFEIT_SURGE: 200"
            - "lift while the severity-5 case is REPORTED: 409 ERR_LOCKDOWN_CONDITIONS_UNMET"

