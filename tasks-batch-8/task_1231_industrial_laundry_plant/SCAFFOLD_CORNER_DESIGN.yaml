  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_customers_pagination_envelope
        claim_type: pagination_envelope
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /plants/{p}/customers?limit=1&offset=0 returns response_type=array with total_count and has_more=true when 2 customers exist."
        test_recipe:
          setup: ["Plant P with 2 customers"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C1", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 1000 }
              as: PlantAdmin
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C2", customer_kind: "HEALTHCARE", billing_mode: "RENTAL", chip_tracking_enabled: false, credit_limit_cents: 1000 }
              as: PlantAdmin
          trigger:
            - call: "GET /plants/${p_id}/customers?limit=1&offset=0"
              as: PlantAdmin
          assert:
            - "response.meta.api_request_id is present"
            - "response.response_type == array"
            - "len(response.data) == 1"
            - "pagination block reports total_count == 2 and has_more == true"

      - name: error_envelope_shape
        claim_type: response_envelope
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses carry meta.api_request_id, response_type=error, data.error_id and data.message keys."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /plants/00000000-0000-0000-0000-000000000000"
              as: PlantAdmin
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "err == ERR_NOT_FOUND"
            - "msg is a non-empty string"

      - name: billing_preview_never_persists
        claim_type: computed_read
        grounds: [endpoints, calculations.cog_linen_charge]
        distinguishing_aspect: "billing-preview returns computed totals but creates no Invoice row; subsequent invoice list still empty."
        test_recipe:
          setup: ["COG customer C, no invoices"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /customers/${c_id}/billing-preview?billing_period_start=2026-05-01&billing_period_end=2026-06-01"
              payload: { billing_period_start: "2026-05-01", billing_period_end: "2026-06-01" }
              as: BillingClerk
            - call: "GET /customers/${c_id}/invoices"
              as: BillingClerk
          assert:
            - "invoice list response contains zero Invoice entries (empty array, total_count == 0)"

