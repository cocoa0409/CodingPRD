            - "First hangtag: HTTP 201 with a non-null ${h1_id}, and ${lv2} == ${lv1} + 1"
            - "Replay at the old parent version: HTTP 412 and ${e_stale} == \"ERR_STALE_LABEL_VERSION\", never ERR_STALE_STYLE_VERSION"
            - "Third call with the current parent version: HTTP 201 with a non-null ${h2_id} and ${h2_cons} == \"CONSISTENT\", and ${lv3} == ${lv2} + 1"
            - "GET /labeling/label-specs?parent_label_spec_id=${l1_id} returns total_count == 2 - the refused create left no row behind"

      - name: cascading_side_effects_reach_the_third_level
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / failed_reverification_cascades_test_to_style_to_permanent_labels_to_hangtags
          rationale: "All three §1.8 transitive_cascade instances walk a four-level chain end to end and assert the untouched siblings as well, which covers this layer more strongly than a dedicated corner case would."
      - name: dual_variant_results_diverge_on_the_same_data
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / origin_substantial_transformation_versus_yarn_forward_on_one_graph
          rationale: "Both §1.8 dual_variant_calc instances compute the two variants over one dataset, assert the divergence and then assert which variant the workflow actually pins, so the layer is already covered at its hardest point."
      - name: threshold_triggers_fire_at_their_breakpoints
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
        excluded_because:
          difficulty_instance: boundary_precision_check / suspension_ledger_threshold_is_strictly_greater_and_crossed_by_one_cent
          rationale: "The §1.8 boundary_precision_check instances sit exactly on the penalty-ledger posture thresholds and the severity escalation breakpoint, one cent and one unit either side, which is the strongest possible form of this layer's claim."

  - section: consistency_model
    instances:
      - name: a_disposition_response_already_shows_the_recomputed_audit_rollup
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.audit_rollup
          - endpoints[POST /labeling/audit-findings/{id}/disposition]
        distinguishing_aspect: "The rollup is denormalized onto the audit, yet it is recomputed inside the same request: the disposition response already carries units_unresolved 0 and the finding in REMEDIATED, and the audit read that immediately follows - with no intervening write and no clock advance - already shows critical_finding_count dropped to 1 while units_in_scope stays at 700, because that counter has no state filter."
        test_recipe:
          setup:
            - "Brand B1 owns styles NL-4410 and NL-4411. Audit A1 carries F1 (ORIGIN_MISSTATED, 400 units, CRITICAL) on NL-4410 and F2 (FIBER_CONTENT_MISSTATED, 300 units, CRITICAL) on NL-4411, so A1 is IN_REVIEW with open_finding_count 2, critical_finding_count 2 and units_in_scope 700."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4411", product_class: "KNIT_TOP", target_market_codes: ["US"], net_weight_grams: 200.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /labeling/compliance-audits"
              payload: { brand_id: "${brand_id}", scope: "STYLE_DOSSIER", audit_window_from: "2026-01-01T00:00:00Z", audit_window_to: "2026-12-31T00:00:00Z" }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { audit_id: $.data.id }
            - call: "POST /labeling/compliance-audits/${audit_id}/findings"
              payload: { style_id: "${s1_id}", finding_code: "ORIGIN_MISSTATED", units_affected: 400 }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f1_id: $.data.id, f1_sev: $.data.severity }
            - call: "POST /labeling/compliance-audits/${audit_id}/findings"
              payload: { style_id: "${s2_id}", finding_code: "FIBER_CONTENT_MISSTATED", units_affected: 300 }
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f2_id: $.data.id }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { open_before: $.data.open_finding_count, crit_before: $.data.critical_finding_count, scope_before: $.data.units_in_scope, state_before: $.data.state }
          trigger:
            - call: "POST /labeling/audit-findings/${f1_id}/disposition"
              payload: { units_relabeled: 0, units_destroyed: 150, units_released: 250 }
              as: LabelingSpecialist
              as_user_id: "user-spec-1"
              captures: { f1_state: $.data.state, f1_unresolved: $.data.units_unresolved, f1_recorded: $.data.disposition_recorded_at }
            - call: "POST /labeling/audit-findings/${f1_id}/verify"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { f1_state2: $.data.state, f1_verified: $.data.verified_at }
            - call: "GET /labeling/compliance-audits/${audit_id}"
              payload: {}
              as: Auditor
              as_user_id: "user-audit-1"
              captures: { open_after: $.data.open_finding_count, crit_after: $.data.critical_finding_count, scope_after: $.data.units_in_scope, state_after: $.data.state }
          assert:
            - "Setup sanity: ${f1_sev} == \"CRITICAL\", ${open_before} == 2, ${crit_before} == 2, ${scope_before} == 700 and ${state_before} == \"IN_REVIEW\""
            - "The disposition response itself already reports ${f1_state} == \"REMEDIATED\", ${f1_unresolved} == 0 and a non-null ${f1_recorded} - no second read is needed to see the effect"
            - "The verify response itself already reports ${f1_state2} == \"CLOSED\" with a non-null ${f1_verified}"
            - "${open_after} == 1 and ${crit_after} == 1 in the very next read, with no clock advance and no other write in between"
            - "${scope_after} == 700 - units_in_scope is invariant under disposition and verification, so immediacy is not confused with recomputation of the wrong field"
            - "${state_after} == \"IN_REVIEW\" - F2 is still open, so the audit cannot reach PENDING_CLOSURE yet"
