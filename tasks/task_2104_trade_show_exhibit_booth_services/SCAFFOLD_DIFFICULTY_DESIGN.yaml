          - state_machines.ServiceOrder.INVOICED_to_CREDITED
        distinguishing_aspect: |
          Conserved quantity one, money: Exhibitor.account_balance_cents, pinned as SUM(Invoice
          .total_cents where status in ISSUED or PARTIALLY_SETTLED) minus SUM(settled_cents over
          the same set) minus SUM(settled claim settlements), returns to exactly 0 after issue
          then void, with no residual drift on the order or the invoice.
        test_recipe:
          setup:
            - "A show OPEN_FOR_ORDERS, an exhibitor with a 5000000 cent credit limit, an OPEN booth and one 193858 cent service order"
            - "A DRAFT invoice sweeping that order, and two distinct finance operators fin-1 and fin-2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /venues"
              payload: { name: "Metro Convention Center", city: "Chicago", max_forklift_capacity_lbs: 6000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${venue_id}", name: "AutoTech 2026", discount_deadline: "2026-09-01T00:00:00Z", advance_warehouse_deadline: "2026-09-10T00:00:00Z", move_in_start: "2026-09-19T08:00:00Z", move_in_end: "2026-09-20T18:00:00Z", show_open: "2026-09-21T09:00:00Z", show_close: "2026-09-23T17:00:00Z", move_out_end: "2026-09-25T18:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "OPEN_FOR_ORDERS" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /exhibitors"
              payload: { company_name: "Acme Motors", contact_email: "ops@acme.test", credit_limit_cents: 5000000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { ex_id: $.data.id, balance_start: $.data.account_balance_cents }
            - call: "POST /booths"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex_id}", booth_number: "1024", sqft: 400, booth_type: "ISLAND" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /service-orders"
              payload: { booth_id: "${booth_id}", service_type: "ELECTRICAL", lines: [{ line_seq: 1, catalog_item_code: "ELEC-20A", unit_qty: 4, unit_rate_cents: 32500, discount_pct: 0 }, { line_seq: 2, catalog_item_code: "ELEC-LBR", unit_qty: 3, unit_rate_cents: 21750, discount_pct: 0.10 }], expected_booth_version: "${booth_v}" }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { so_id: $.data.id }
            - call: "POST /invoices"
              payload: { exhibitor_id: "${ex_id}", show_id: "${show_id}", service_order_ids: ["${so_id}"] }
              as: FinanceController
              as_user_id: "fin-1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: FinanceController
              as_user_id: "fin-1"
            - call: "GET /exhibitors/${ex_id}"
              payload: {}
              as: FinanceController
              as_user_id: "fin-1"
              captures: { balance_issued: $.data.account_balance_cents }
            - call: "POST /invoices/${inv_id}/void"
              payload: { reason: "Duplicate billing run" }
              as: FinanceController
              as_user_id: "fin-2"
          assert:
            - "${balance_start} == 0"
            - "${balance_issued} == 193858"
            - "Exhibitor.${ex_id}.account_balance_cents == 0"
            - "Invoice.${inv_id}.status == VOID"
            - "Invoice.${inv_id}.settled_cents == 0"
            - "Invoice.${inv_id}.voided_by_user_id == fin-2"
            - "ServiceOrder.${so_id}.billing_status == CREDITED"
            - "ServiceOrder.${so_id}.invoice_id == null"
            - "Booth.${booth_id}.posture == OPEN"

      - name: crate_checkin_then_ship_conserves_warehouse_committed_cwt
        grounds:
          - calculations.warehouse_committed_cwt
          - state_machines.Crate.REGISTERED_to_AT_ADVANCE_WAREHOUSE
          - state_machines.Crate.AT_ADVANCE_WAREHOUSE_to_IN_TRANSIT_TO_SHOW
          - state_machines.DrayageShipment.RECEIVED_to_IN_TRANSIT
        distinguishing_aspect: |
          Conserved quantity two, physical weight rather than money: Warehouse.committed_cwt,
          pinned as SUM(CEIL(weight_lbs/100)) over crates at the warehouse in status
          AT_ADVANCE_WAREHOUSE or RETURNED_TO_WAREHOUSE, rises to 13 on check-in and returns to
          exactly 0 once the crate ships out.
        test_recipe:
          setup:
            - "A warehouse of 1000 cwt capacity with committed_cwt 0"
            - "One 1250 lb crate already listed on a RECEIVED ADVANCE_WAREHOUSE shipment for a show that has reached ADVANCE_CLOSED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /venues"
              payload: { name: "Metro Convention Center", city: "Chicago", max_forklift_capacity_lbs: 6000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /warehouses"
              payload: { name: "Chicago Advance WH", city: "Chicago", capacity_cwt: 1000, dock_capacity_cwt: 300, free_days: 30, storage_rate_cents_per_cwt_per_month: 2200 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { wh_id: $.data.id, wh_v0: $.data.version, cwt_start: $.data.committed_cwt }
            - call: "POST /shows"
              payload: { venue_id: "${venue_id}", name: "AutoTech 2026", discount_deadline: "2026-09-01T00:00:00Z", advance_warehouse_deadline: "2026-09-10T00:00:00Z", move_in_start: "2026-09-19T08:00:00Z", move_in_end: "2026-09-20T18:00:00Z", show_open: "2026-09-21T09:00:00Z", show_close: "2026-09-23T17:00:00Z", move_out_end: "2026-09-25T18:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "OPEN_FOR_ORDERS" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /exhibitors"
              payload: { company_name: "Acme Motors", contact_email: "ops@acme.test", credit_limit_cents: 5000000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { ex_id: $.data.id }
            - call: "POST /crates"
              payload: { exhibitor_id: "${ex_id}", crate_label: "ACME-C1", crate_type: "WOOD_CRATE", weight_lbs: 1250 }
              as: Exhibitor
              as_user_id: "${ex_id}"
              captures: { crate_id: $.data.id }
            - call: "POST /drayage-shipments"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex_id}", channel: "ADVANCE_WAREHOUSE", warehouse_id: "${wh_id}", crate_ids: ["${crate_id}"], received_at: "2026-09-08T10:00:00Z", dock_window_start: "2026-09-08T08:00:00Z", dock_window_end: "2026-09-08T12:00:00Z", declared_value_coverage: false }
              as: WarehouseAgent
              as_user_id: "${wh_id}"
              captures: { ship_id: $.data.id }
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "ADVANCE_CLOSED" }
              as: ShowOperations
              as_user_id: "ops-1"
          trigger:
            - call: "POST /crates/${crate_id}/warehouse-check-in"
              payload: { warehouse_id: "${wh_id}", expected_warehouse_version: "${wh_v0}" }
              as: WarehouseAgent
              as_user_id: "${wh_id}"
            - call: "GET /warehouses/${wh_id}"
              payload: {}
              as: WarehouseAgent
              as_user_id: "${wh_id}"
              captures: { cwt_after_checkin: $.data.committed_cwt }
            - call: "POST /crates/${crate_id}/movements"
              payload: { to_status: "IN_TRANSIT_TO_SHOW" }
              as: WarehouseAgent
              as_user_id: "${wh_id}"
          assert:
            - "${cwt_start} == 0"
            - "${cwt_after_checkin} == 13"
            - "Warehouse.${wh_id}.committed_cwt == 0"
            - "Crate.${crate_id}.status == IN_TRANSIT_TO_SHOW"
            - "Crate.${crate_id}.warehouse_id == null"
            - "Crate.${crate_id}.stored_since == null"
            - "DrayageShipment.${ship_id}.status == IN_TRANSIT"
            - "DrayageShipment.${ship_id}.drayage_charge_cents == 127400"

      - name: labor_dispatch_then_cancel_conserves_committed_labor_hours
        grounds:
          - calculations.show_committed_labor_hours
          - state_machines.LaborCall.REQUESTED_to_DISPATCHED
          - state_machines.LaborCall.REQUESTED_to_CANCELLED
          - entities.Show.fields.cancelled_labor_call_count
        distinguishing_aspect: |
          Conserved quantity three, committed crew-hours rather than money or weight:
          Show.committed_labor_hours, pinned as SUM(crew_size * scheduled_hours) over calls in
          DISPATCHED or ON_SITE, rises to 16.0 on dispatch and returns to exactly 0.0 on cancel,
          while the one-way counter cancelled_labor_call_count deliberately does not unwind.
        test_recipe:
          setup:
            - "A show at ON_SITE with an OPEN booth and a RIGGING jurisdiction at its venue"
            - "One REQUESTED labor call of 4 workers scheduled for exactly 4 hours"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /venues"
              payload: { name: "Metro Convention Center", city: "Chicago", max_forklift_capacity_lbs: 6000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/union-jurisdictions"
              payload: { trade: "RIGGING", straight_time_rate_cents_per_hour: 14000, min_call_hours: 4, crew_max_size: 6, exhibitor_self_install_allowed: false, turnaround_buffer_minutes: 30 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { jur_id: $.data.id }
            - call: "POST /shows"
              payload: { venue_id: "${venue_id}", name: "AutoTech 2026", discount_deadline: "2026-09-01T00:00:00Z", advance_warehouse_deadline: "2026-09-10T00:00:00Z", move_in_start: "2026-09-19T08:00:00Z", move_in_end: "2026-09-20T18:00:00Z", show_open: "2026-09-21T09:00:00Z", show_close: "2026-09-23T17:00:00Z", move_out_end: "2026-09-25T18:00:00Z" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { show_id: $.data.id, hours_start: $.data.committed_labor_hours }
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "OPEN_FOR_ORDERS" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /exhibitors"
              payload: { company_name: "Acme Motors", contact_email: "ops@acme.test", credit_limit_cents: 5000000 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { ex_id: $.data.id }
            - call: "POST /booths"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex_id}", booth_number: "1024", sqft: 400, booth_type: "ISLAND" }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { booth_id: $.data.id }
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "ADVANCE_CLOSED" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "MOVE_IN" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /shows/${show_id}/status"
              payload: { to_status: "ON_SITE" }
              as: ShowOperations
              as_user_id: "ops-1"
            - call: "POST /labor-calls"
              payload: { booth_id: "${booth_id}", jurisdiction_id: "${jur_id}", scheduled_start: "2026-09-21T13:00:00Z", scheduled_end: "2026-09-21T17:00:00Z", crew_size: 4 }
              as: ShowOperations
              as_user_id: "ops-1"
              captures: { lc_id: $.data.id, sched_hours: $.data.scheduled_hours }
          trigger:
            - call: "POST /labor-calls/${lc_id}/dispatch"
              payload: {}
              as: LaborSupervisor
              as_user_id: "lab-1"
            - call: "GET /shows/${show_id}"
              payload: {}
              as: LaborSupervisor
              as_user_id: "lab-1"
              captures: { hours_dispatched: $.data.committed_labor_hours }
            - call: "POST /labor-calls/${lc_id}/cancel"
              payload: { reason: "Exhibitor deferred the hang" }
              as: LaborSupervisor
              as_user_id: "lab-1"
          assert:
            - "${hours_start} == 0"
            - "${sched_hours} == 4.00"
            - "${hours_dispatched} == 16.00"
            - "Show.${show_id}.committed_labor_hours == 0.00"
            - "Show.${show_id}.cancelled_labor_call_count == 1"
            - "LaborCall.${lc_id}.status == CANCELLED"
            - "LaborCall.${lc_id}.labor_charge_cents == null"
