      - name: claim_pay_cascade_depth_four_claim_to_sitter_to_bookings_to_owner_wallet
        grounds:
          - state_machines.InsuranceClaim.APPROVED_to_PAID
          - state_machines.Sitter.ACTIVE_to_SUSPENDED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Sitter.fields.claim_count
          - entities.Owner.fields.wallet_credit_cents
        distinguishing_aspect: |
          Depth-4 cascade originating from a different trigger
          (InsuranceClaim APPROVED→PAID, NOT BackgroundCheck FLAG).
          Link 1: ic.status → PAID.
          Link 2 (caused by link 1): Sitter.claim_count += 1; AND when
          claim_count == 2 with Sitter.status==ACTIVE, Sitter.status →
          SUSPENDED.
          Link 3 (caused by link 2 — the SUSPENDED transition): every
          CONFIRMED Booking on this Sitter → CANCELLED.
          Link 4 (caused by link 3): Owner.wallet_credit_cents incremented
          by the cancelled Booking's booking_quote_cents.
        test_recipe:
          setup:
            - "Owner o6 wallet_credit_cents==0; Sitter s6 ACTIVE BRONZE with one prior PAID claim (claim_count==1)."
            - "Pet p6; MeetAndGreet COMPLETED_APPROVED."
            - "Booking b6_done COMPLETED (basis for the second claim); Booking b6_next CONFIRMED in the future."
