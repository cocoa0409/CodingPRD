        grounds:
          - entities.Vendor
          - endpoints.POST_/erm/vendors
          - endpoints.GET_/erm/vendors/{id}
          - endpoints.GET_/erm/products
        distinguishing_aspect: |
          The Vendor surface is create + read only - §1.5 declares no update and no delete for it - so the
          round trip to assert is POST then GET by id returning the same three business fields, plus the
          reverse-reachability list GET /erm/products?vendor_id showing the vendor's (still empty) catalog.
        test_recipe:
          setup:
            - "An empty database; one vendor is created with archival_agency_code PORTICO and vpat_on_file true."
          setup_api_calls:
            - call: "POST /erm/vendors"
              payload: { name: "Atlas Scholarly", archival_agency_code: "PORTICO", vpat_on_file: true }
              as: ConsortiumAdmin
              as_user_id: "admin-1"
              captures: { vendor_id: $.data.id }
          trigger:
            - call: "GET /erm/vendors/${vendor_id}"
              payload: {}
              as: ConsortiumAdmin
              as_user_id: "admin-1"
          assert:
            - "response status == 200"
            - "response.data.id == ${vendor_id}"
            - "Vendor.${vendor_id}.name == Atlas Scholarly"
            - "Vendor.${vendor_id}.archival_agency_code == PORTICO"
            - "Vendor.${vendor_id}.vpat_on_file == true"
            - "Vendor.${vendor_id}.version == 1"
            - "GET /erm/products with vendor_id ${vendor_id} returns total_count == 0"
            - "no PATCH, PUT or DELETE endpoint for /erm/vendors/${vendor_id} exists in the API surface"
