              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
              captures: { err: $.data.error_id }
            - { call: "POST /assistance/applications/${app}/documents", payload: { doc_type: "LEASE_LEDGER", file_reference: "s3://docs/dc2.pdf" }, as: Caseworker, as_user_id: "cw-1" }
            - call: "POST /assistance/applications/${app}/submit"
