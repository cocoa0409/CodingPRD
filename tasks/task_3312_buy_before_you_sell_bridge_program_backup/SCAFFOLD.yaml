scenario: |
  Buy-Before-You-Sell Bridge Program & Backup Offer Guarantee (Knock): homeowner qualification
  combining departing home equity, new home purchase capacity and lending criteria, interim loan
  advancing funds for the down payment and carrying costs of the departing home, guaranteed backup
  offer on the departing home at a discounted price with a defined expiration, listing and marketing
  of the departing home while the customer occupies the new home, repair advance funding for
  pre-listing improvements repaid at closing, dual carrying cost accounting with interest, fees and
  program charges disclosed upfront, backup offer exercise mechanics and resale of the acquired home,
  agent partnership model with referral and transaction coordination.

domain_name: "buy-before-you-sell-bridge"
api_prefix: "/knock"

complexity_profile:
  primary_archetype: "multi-party negotiation"
  secondary_archetype: "pricing engine"
  complexity_layers:
    - "dual-variant calculation"
    - "optimistic concurrency"
    - "derived field reconciliation"
    - "scheduled / deferred actions"
  entity_topology: "flat"
  state_machine_shape: "parallel"
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: "peer_roles"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the household principal."
      - name: email
        type: string
        source: input
        description: "Contact email; unique across Homeowner."
        constraints: "unique per Homeowner"
      - name: credit_score
        type: integer
        source: input
        description: "Middle FICO score used by lending-criteria checks."
        constraints: "300 <= credit_score <= 850"
      - name: household_income_cents
        type: integer
        source: input
        description: "Annual verifiable household income in cents."
      - name: max_dti_bps
        type: integer
        source: input
        description: "Maximum debt-to-income ratio in basis points tolerated for this household."
        default: 4300
      - name: departing_equity_cents
        type: integer
        source: computed
        description: "Latest computed net equity across the household's DEPARTING properties; recomputed on Qualification approval."
      - name: program_status
        type: enum
        source: system
        description: "Household-level lifecycle summary."
        default: "NONE"
        constraints: "enum: NONE | QUALIFYING | ENROLLED | BRIDGED | SETTLED | WITHDRAWN"
      - name: sealed_flag
        type: boolean
        source: system
        description: "Set true when every BridgeProgram for this household has reached SETTLED."
        default: false

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; owning household."
      - name: address
        type: string
        source: input
        description: "Street address of the property."
      - name: kind
        type: enum
        source: input
        description: "Whether this is the home being left or the home being bought."
        constraints: "enum: DEPARTING | NEW"
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Third-party appraised market value in cents."
      - name: mortgage_payoff_cents
        type: integer
        source: input
        description: "Remaining mortgage payoff owed against the property in cents; 0 when owned free and clear."
        default: 0
      - name: appraisal_date
        type: datetime
        source: input
        description: "Date the appraised value was established (logical clock); appraisals older than APPRAISAL_VALIDITY_DAYS are stale."
        default: "2026-09-01T00:00:00Z"
      - name: purchase_price_cents
        type: integer
        source: input
        description: "Contract purchase price in cents (NEW homes only; 0 for DEPARTING)."
        default: 0
      - name: condition_grade
        type: enum
        source: input
        description: "Pre-listing condition grade assigned by the coordinator."
        constraints: "enum: A | B | C | D"
      - name: listing_status
        type: enum
        source: system
        description: "Marketing lifecycle of the property."
        default: "UNLISTED"
        constraints: "enum: UNLISTED | LISTED | UNDER_CONTRACT | SOLD_TO_PROGRAM | RESOLD"
      - name: repair_status
        type: enum
        source: system
        description: "Aggregate pre-listing repair progress for this property."
        default: "NOT_STARTED"
        constraints: "enum: NOT_STARTED | IN_PROGRESS | COMPLETE"
      - name: site_visit_count
        type: integer
        source: system
        description: "Count of coordinator site visits recorded for this property."
        default: 0
      - name: repair_progress_bps
        type: integer
        source: input
        description: "Site visits required before repair_status flips to COMPLETE (a proxy for completion, expressed as a required-visit count scaled by 100)."
        default: 300
      - name: program_inventory_flag
        type: boolean
        source: computed
        description: "True once the property has been acquired by the program via backup-offer exercise."
        default: false

  - name: Qualification
    parent: null
    common_fields: true
    fields:
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; household being qualified."
      - name: departing_property_id
        type: string
        source: input
        description: "FK -> Property.id; the departing home whose equity is counted."
      - name: new_property_id
        type: string
        source: input
        description: "FK -> Property.id; the new home being purchased."
      - name: target_purchase_price_cents
        type: integer
        source: input
        description: "Price the household intends to pay for the new home."
      - name: variant_used
        type: enum
        source: input
        description: "Which capacity variant the coordinator requests at creation time."
        default: "CONSERVATIVE"
        constraints: "enum: CONSERVATIVE | OPTIMISTIC"
      - name: capacity_cents
        type: integer
        source: computed
        description: "Purchase capacity produced by the selected variant."
      - name: equity_ratio
        type: number
        source: computed
        description: "Net departing equity divided by appraised value, 4 decimals."
      - name: status
        type: enum
        source: system
        description: "Qualification lifecycle."
        default: "PENDING"
        constraints: "enum: PENDING | APPROVED | DENIED | EXPIRED"
      - name: denial_reason
        type: string
        source: input
        description: "Free-text reason recorded when the qualification is denied."

  - name: BridgeProgram
    parent: null
    common_fields: true
    fields:
      - name: homeowner_id
        type: string
        source: input
        description: "FK -> Homeowner.id; enrolled household."
      - name: qualification_id
        type: string
        source: input
        description: "FK -> Qualification.id; the approved qualification funding this enrollment."
      - name: new_property_id
        type: string
        source: input
        description: "FK -> Property.id; the new home the household will occupy."
      - name: departing_property_id
        type: string
        source: input
        description: "FK -> Property.id; the home that will be listed and backup-offered."
      - name: projected_carry_months
        type: integer
        source: input
        description: "Planner's projection of how many months both homes will be carried."
        constraints: "1 <= projected_carry_months <= 24"
      - name: program_fee_basis_points
        type: integer
        source: input
        description: "Program fee rate in basis points applied to the interim loan principal."
        default: 150
      - name: advance_status
        type: enum
        source: system
        description: "Independent axis: interim funding progress."
        default: "PENDING"
        constraints: "enum: PENDING | FUNDING | FUNDED | SETTLED"
      - name: occupancy_status
        type: enum
        source: system
        description: "Independent axis: occupancy and marketing progress."
        default: "VACANT"
        constraints: "enum: VACANT | OCCUPYING_NEW | DEPARTING_LISTED | DEPARTING_SOLD"
      - name: outstanding_carrying_cost_cents
        type: integer
        source: computed
        description: "Sum of unpaid CarryingCost amounts for this program; recomputed on every CarryingCost mutation."
      - name: total_program_charge_cents
        type: integer
        source: computed
        description: "Disclosed program charges produced by the program_charge_disclosure calculation."
      - name: active_referral_count
        type: integer
        source: computed
        description: "Count of Referral rows for this program whose status is OPEN."
        default: 0

  - name: InterimLoan
    parent: null
    common_fields: true
    fields:
      - name: bridge_program_id
        type: string
        source: input
        description: "FK -> BridgeProgram.id; the enrollment this loan funds."
      - name: principal_cents
        type: integer
        source: input
        description: "Originated principal available to advance."
      - name: interest_rate_bps
        type: integer
        source: input
        description: "Simple annual interest rate in basis points."
      - name: drawn_cents
        type: integer
        source: system
        description: "Cumulative gross advances drawn against this loan."
        default: 0
      - name: outstanding_principal_cents
        type: integer
        source: computed
        description: "Gross advances minus cumulative repayments; never negative."
      - name: accrued_interest_cents
        type: computed
        source: computed
        description: "Interest accrued by the interior_loan_interest_accrual calculation."
      - name: status
        type: enum
        source: system
        description: "Interim loan lifecycle."
        default: "ORIGINATED"
        constraints: "enum: ORIGINATED | DRAWN | REPAYING | REPAID | DELINQUENT"
      - name: originated_at
        type: datetime
        source: system
        description: "Server-stamped origination timestamp (logical clock)."
  - name: BridgeAdvance
    parent: null
    common_fields: true
    fields:
      - name: bridge_program_id
        type: string
        source: input
        description: "FK -> BridgeProgram.id; program the advance draws against."
      - name: interim_loan_id
        type: string
        source: input
        description: "FK -> InterimLoan.id; loan that is debited."
      - name: purpose
        type: enum
        source: input
        description: "What the advance funds."
        constraints: "enum: DOWN_PAYMENT | CARRYING_COST | REPAIR | FEE | DISCLOSURE"
      - name: amount_cents
        type: integer
        source: input
        description: "Requested advance amount in cents."
        constraints: "amount_cents > 0"
      - name: status
        type: enum
        source: system
        description: "Advance lifecycle."
        default: "PENDING"
        constraints: "enum: PENDING | APPROVED | DISBURSED | REPAID | REJECTED"
      - name: advanced_at
        type: datetime
        source: system
        description: "Server-stamped disbursement timestamp (logical clock)."

  - name: CarryingCost
    parent: null
    common_fields: true
    fields:
      - name: bridge_program_id
        type: string
        source: input
        description: "FK -> BridgeProgram.id; program that owes the cost."
      - name: kind
        type: enum
        source: input
        description: "Which carrying bucket this charge belongs to."
        constraints: "enum: DEPARTING_TAX | DEPARTING_INSURANCE | DEPARTING_HOA | DEPARTING_UTILITY | NEW_TAX | NEW_INSURANCE | NEW_HOA | NEW_UTILITY"
      - name: amount_cents
        type: integer
        source: input
        description: "Charged amount in cents."
      - name: due_date
        type: datetime
        source: input
        description: "Date the cost falls due (logical clock)."
      - name: repayment_status
        type: enum
        source: system
        description: "Independent axis: whether the charge has been settled."
        default: "UNPAID"
        constraints: "enum: UNPAID | REPAID"
      - name: repaid_at
        type: datetime
        source: system
        description: "Server-stamped repayment timestamp (logical clock)."

  - name: RepairAdvance
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property being improved."
      - name: bridge_program_id
        type: string
        source: input
        description: "FK -> BridgeProgram.id; program funding the repair."
      - name: scope
        type: string
        source: input
        description: "Description of the pre-listing improvement scope."
      - name: approved_amount_cents
        type: integer
        source: input
        description: "Coordinator-approved repair funding ceiling."
      - name: escrow_release_mode
        type: enum
        source: input
        description: "How funds reach the contractor."
        default: "MILESTONE"
        constraints: "enum: LUMP_SUM | MILESTONE"
      - name: status
        type: enum
        source: system
        description: "Repair advance lifecycle."
        default: "REQUESTED"
        constraints: "enum: REQUESTED | APPROVED | DISBURSED | SETTLED"
      - name: repaid_cents
        type: integer
        source: system
        description: "Cumulative amount clawed back out of resale proceeds."
        default: 0

  - name: BackupOffer
    parent: null
    common_fields: true
    fields:
      - name: departing_property_id
        type: string
        source: input
        description: "FK -> Property.id; the departing home the offer backs up."
      - name: bridge_program_id
        type: string
        source: input
        description: "FK -> BridgeProgram.id; program that extends the guarantee."
      - name: offer_price_cents
        type: integer
        source: input
        description: "Contract offer price in cents."
      - name: window_days
        type: integer
        source: input
        description: "Length of the exercise window in days."
        constraints: "1 <= window_days <= 180"
      - name: window_start
        type: datetime
        source: input
        description: "Date the exercise window opens (logical clock)."
      - name: status
        type: enum
        source: system
        description: "Backup offer lifecycle."
        default: "DRAFT"
        constraints: "enum: DRAFT | ISSUED | EXPIRED | EXTENDED | EXERCISED | VOIDED"
      - name: expires_at
        type: datetime
        source: computed
        description: "window_start plus the effective duration; recomputed on every extension."
      - name: exercised_at
        type: datetime
        source: system
        description: "Server-stamped exercise timestamp (logical clock)."
      - name: price_basis_cents
        type: integer
        source: computed
        description: "The backup_offer_price_floor output used to bound offer_price_cents."

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - name: departing_property_id
        type: string
        source: input
        description: "FK -> Property.id; the home being marketed."
      - name: bridge_program_id
        type: string
        source: input
        description: "FK -> BridgeProgram.id; program that owns the listing."
      - name: list_price_cents
        type: integer
        source: input
        description: "Ask price in cents."
      - name: listed_at
        type: datetime
        source: system
        description: "Server-stamped listing timestamp (logical clock)."
      - name: status
        type: enum
        source: system
        description: "Listing lifecycle."
        default: "DRAFT"
        constraints: "enum: DRAFT | LIVE | PAUSED | CLOSED"
      - name: marketing_status
        type: enum
        source: system
        description: "Independent axis: marketing progress."
        default: "NOT_STARTED"
        constraints: "enum: NOT_STARTED | ACTIVE | STOPPED"
      - name: offer_count
        type: integer
        source: computed
        description: "Count of third-party external offers recorded against this listing."
        default: 0

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Agent legal name."
      - name: brokerage_name
        type: string
        source: input
        description: "Brokerage the agent is affiliated with."
      - name: license_number
        type: string
        source: input
        description: "State real-estate license number; unique across Agent."
        constraints: "unique per Agent"
      - name: referral_rate_bps
        type: integer
        source: input
        description: "Referral fee rate in basis points applied to the partner's qualifying transaction volume."
        default: 250
      - name: qualification_status
        type: enum
        source: system
        description: "Whether the agent may receive referrals."
        default: "PENDING"
        constraints: "enum: PENDING | QUALIFIED | SUSPENDED"
      - name: active_referral_count
        type: integer
        source: computed
        description: "Count of this agent's Referral rows whose status is OPEN."
        default: 0

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: agent_id
        type: string
        source: input
        description: "FK -> Agent.id; the receiving partner."
      - name: bridge_program_id
        type: string
        source: input
        description: "FK -> BridgeProgram.id; the program that generated the referral."
      - name: role_scope
        type: enum
        source: input
        description: "Which side of the transaction the agent coordinates."
        constraints: "enum: DEPARTING_SIDE | NEW_SIDE | RESALE_SIDE"
      - name: referral_rate_bps
        type: integer
        source: input
        description: "Rate locked onto this referral row; copied from the agent at creation or overridden."
        default: 250
      - name: qualifying_volume_cents
        type: integer
        source: input
        description: "Transaction volume the referral fee is computed against."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Referral lifecycle."
        default: "OPEN"
        constraints: "enum: OPEN | COMPLETED | VOIDED"
      - name: base_fee_cents
        type: computed
        description: "Referral fee on qualifying volume alone, rounded HALF_UP to cents."
        source: computed
      - name: reconciled_fee_cents
        type: computed
        description: "Referral fee after cross-entity bonus/coordination credits, rounded HALF_UP to cents."
        source: computed
      - name: fee_variance_cents
        type: computed
        description: "reconciled_fee_cents minus base_fee_cents."
        source: computed

  - name: CoordinationTask
    parent: null
    common_fields: true
    fields:
      - name: bridge_program_id
        type: string
        source: input
        description: "FK -> BridgeProgram.id; program this task coordinates."
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the referral relationship the task belongs to."
      - name: task_kind
        type: enum
        source: input
        description: "Kind of coordination work."
        constraints: "enum: PHOTOGRAPHY | INSPECTION | APPRAISAL | REPAIR_BID | CLOSING_PREP | RESALE_PREP"
      - name: due_date
        type: datetime
        source: input
        description: "Task due date (logical clock)."
      - name: status
        type: enum
        source: system
        description: "Coordination task lifecycle."
        default: "OPEN"
        constraints: "enum: OPEN | IN_PROGRESS | COMPLETED | CANCELLED"
      - name: completed_at
        type: datetime
        source: system
        description: "Server-stamped completion timestamp (logical clock)."

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - name: bridge_program_id
        type: string
        source: input
        description: "FK -> BridgeProgram.id; program receiving the settlement proceeds."
      - name: source_kind
        type: enum
        source: input
        description: "Which money source produced this settlement entry."
        constraints: "enum: CLOSING_SALE | RESALE | REPAIR_CLAWBACK"
      - name: amount_cents
        type: integer
        source: input
        description: "Settlement amount in cents."
      - name: status
        type: enum
        source: system
        description: "Settlement entry lifecycle."
        default: "RECORDED"
        constraints: "enum: RECORDED | APPLIED"
      - name: applied_to_principal_cents
        type: computed
        description: "Portion of the settlement applied to interim-loan principal."
        source: computed
      - name: applied_to_interest_cents
        type: computed
        description: "Portion of the settlement applied to accrued interest."
        source: computed
      - name: remainder_cents
        type: computed
        description: "Portion left after principal and interest are satisfied."
        source: computed

state_machines:
  - entity: Homeowner
    initial_state: NONE
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: NONE
        to: QUALIFYING
        trigger: "POST /knock/qualifications/{id}/approve"
        actor: Coordinator
        preconditions: ["linked Qualification.status == PENDING"]
        side_effects: ["set Homeowner.program_status = QUALIFYING", "recompute Homeowner.departing_equity_cents from the approved Qualification", "increment Homeowner.version"]
      - from: QUALIFYING
        to: ENROLLED
        trigger: "POST /knock/bridge-programs/{id}/fund"
        actor: Coordinator
        preconditions: ["linked Qualification.status == APPROVED"]
        side_effects: ["set Homeowner.program_status = ENROLLED", "set linked departing Property.listing_status = UNLISTED", "increment Homeowner.version"]
      - from: ENROLLED
        to: BRIDGED
        trigger: "POST /knock/bridge-advances/{id}/disburse with purpose == DOWN_PAYMENT"
        actor: Coordinator
        preconditions: ["linked BridgeProgram.advance_status == FUNDING"]
        side_effects: ["set Homeowner.program_status = BRIDGED", "increment BridgeProgram.version", "increment Homeowner.version"]
      - from: BRIDGED
        to: SETTLED
        trigger: "POST /knock/interim-loans/{id}/repayments final repayment"
        actor: Homeowner
        preconditions: ["linked InterimLoan.status == REPAYING", "amount_cents == InterimLoan.outstanding_principal_cents + InterimLoan.accrued_interest_cents"]
        side_effects: ["set Homeowner.sealed_flag = true when every BridgeProgram for this Homeowner is SETTLED", "increment Homeowner.version"]
      - from: QUALIFYING
        to: WITHDRAWN
        trigger: "POST /knock/qualifications/{id}/deny"
        actor: Coordinator
        preconditions: ["linked Qualification.status == PENDING"]
        side_effects: ["set Homeowner.program_status = WITHDRAWN", "increment Homeowner.version"]

  - entity: Qualification
    initial_state: PENDING
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /knock/qualifications/{id}/approve"
        actor: Coordinator
        preconditions: ["Qualification.status == PENDING", "Homeowner.credit_score >= 620"]
        side_effects: ["recompute Homeowner.departing_equity_cents", "set Homeowner.program_status = QUALIFYING", "increment Qualification.version"]
      - from: PENDING
        to: DENIED
        trigger: "POST /knock/qualifications/{id}/deny"
        actor: Coordinator
        preconditions: ["Qualification.status == PENDING", "denial_reason present"]
        side_effects: ["set Homeowner.program_status = WITHDRAWN", "increment Qualification.version", "increment Homeowner.version"]
      - from: APPROVED
        to: PENDING
        trigger: "PATCH /knock/qualifications/{id}"
        actor: Coordinator
        preconditions: ["Qualification.status IN {PENDING, APPROVED}", "no BridgeProgram references this Qualification in advance_status other than PENDING"]
        side_effects: ["recompute Qualification.capacity_cents under the new variant_used", "recompute Qualification.equity_ratio", "increment Qualification.version"]
      - from: PENDING
        to: EXPIRED
        trigger: "system event: logical clock reaches created_at + 90 days while status == PENDING"
        actor: system
        preconditions: ["Qualification.status == PENDING", "Post /_clock/set_current_utc value >= Qualification.created_at + 90 days"]
        side_effects: ["increment Qualification.version"]
      - from: APPROVED
        to: EXPIRED
        trigger: "system event: logical clock reaches approval + 90 days with zero BridgeProgram rows referencing this Qualification"
        actor: system
        preconditions: ["Qualification.status == APPROVED", "count of BridgeProgram where qualification_id == this.id == 0", "clock >= created_at + 90 days"]
        side_effects: ["increment Qualification.version"]

  - entity: BridgeProgram
    initial_state: PENDING
    terminal_states: [SETTLED]
    note: "Parallel axis A — advance_status. Axis B (occupancy_status) is declared in the next state machine."
    transitions:
      - from: PENDING
        to: FUNDING
        trigger: "POST /knock/bridge-programs/{id}/fund"
        actor: Coordinator
        preconditions: ["BridgeProgram.advance_status == PENDING", "linked Qualification.status == APPROVED", "linked new Property.kind == NEW", "count of InterimLoan where bridge_program_id == this.id == 0"]
        side_effects: ["create InterimLoan with status ORIGINATED and principal_cents = Qualification.capacity_cents", "create the program_charge Disclosure-backed BridgeAdvance rows", "recompute BridgeProgram.total_program_charge_cents", "set Homeowner.program_status = ENROLLED", "increment BridgeProgram.version"]
      - from: FUNDING
        to: FUNDED
        trigger: "POST /knock/bridge-advances/{id}/disburse with purpose == DOWN_PAYMENT"
        actor: Coordinator
        preconditions: ["BridgeProgram.advance_status == FUNDING", "the BridgeAdvance.status == APPROVED", "entry_occupancy_status IN {VACANT, OCCUPYING_NEW}"]
        side_effects: ["set BridgeProgram.advance_status = FUNDED", "increment InterimLoan.drawn_cents", "recompute InterimLoan.outstanding_principal_cents", "recompute InterimLoan.accrued_interest_cents", "set Homeowner.program_status = BRIDGED", "increment BridgeProgram.version"]
      - from: FUNDING
        to: PENDING
        trigger: "POST /knock/bridge-advances/{id}/reject on the sole DOWN_PAYMENT advance"
        actor: Underwriter
        preconditions: ["BridgeProgram.advance_status == FUNDING", "no BridgeAdvance for this program with purpose DOWN_PAYMENT and status DISBURSED"]
        side_effects: ["set BridgeProgram.advance_status = PENDING (compensation)", "set the InterimLoan.status = REPAID", "increment BridgeProgram.version"]
      - from: FUNDED
        to: SETTLED
        trigger: "POST /knock/interim-loans/{id}/repayments final repayment"
        actor: Homeowner
        preconditions: ["BridgeProgram.advance_status == FUNDED", "InterimLoan.status == REPAYING", "BridgeProgram.outstanding_carrying_cost_cents == 0", "every RepairAdvance for this program has status SETTLED"]
        side_effects: ["set BridgeProgram.advance_status = SETTLED", "recompute BridgeProgram.outstanding_carrying_cost_cents", "set Homeowner.sealed_flag = true when no other BridgeProgram for the Homeowner is non-terminal", "increment BridgeProgram.version"]

  - entity: BridgeProgram
    initial_state: VACANT
    terminal_states: [DEPARTING_SOLD]
    note: "Parallel axis B — occupancy_status, evolves independently of advance_status."
    transitions:
      - from: VACANT
        to: OCCUPYING_NEW
        trigger: "POST /knock/bridge-programs/{id}/occupy-new"
        actor: Homeowner
        preconditions: ["BridgeProgram.occupancy_status == VACANT", "BridgeProgram.advance_status IN {FUNDING, FUNDED}", "linked new Property.program_inventory_flag == false"]
        side_effects: ["increment BridgeProgram.version"]
      - from: OCCUPYING_NEW
        to: DEPARTING_LISTED
        trigger: "POST /knock/listings/{id}/go-live"
        actor: Coordinator
        preconditions: ["BridgeProgram.occupancy_status == OCCUPYING_NEW", "linked departing Property.repair_status == COMPLETE", "a Listing for the departing property is in status DRAFT"]
        side_effects: ["set BridgeProgram.occupancy_status = DEPARTING_LISTED", "set Property.listing_status = LISTED", "set Listing.marketing_status = ACTIVE", "increment BridgeProgram.version"]
      - from: DEPARTING_LISTED
        to: DEPARTING_SOLD
        trigger: "POST /knock/listings/{id}/close-sale"
        actor: Coordinator
        preconditions: ["BridgeProgram.occupancy_status == DEPARTING_LISTED", "linked Listing.status == LIVE", "linked Property.listing_status == UNDER_CONTRACT"]
        side_effects: ["set BridgeProgram.occupancy_status = DEPARTING_SOLD", "set Property.listing_status = RESOLD", "set Listing.status = CLOSED", "set Listing.marketing_status = STOPPED", "increment BridgeProgram.version"]

  - entity: InterimLoan
    initial_state: ORIGINATED
    terminal_states: [REPAID]
    transitions:
      - from: ORIGINATED
        to: DRAWN
        trigger: "POST /knock/bridge-advances/{id}/disburse with purpose == DOWN_PAYMENT"
        actor: Coordinator
        preconditions: ["InterimLoan.status == ORIGINATED", "BridgeAdvance.status == APPROVED", "InterimLoan.outstanding_principal_cents + BridgeAdvance.amount_cents <= InterimLoan.principal_cents"]
        side_effects: ["increment InterimLoan.drawn_cents by BridgeAdvance.amount_cents", "recompute InterimLoan.outstanding_principal_cents", "recompute InterimLoan.accrued_interest_cents", "set BridgeProgram.advance_status = FUNDED", "increment InterimLoan.version"]
      - from: DRAWN
        to: REPAID
        trigger: "POST /knock/interim-loans/{id}/repayments full-balance repayment"
        actor: Homeowner
        preconditions: ["InterimLoan.status == DRAWN", "amount_cents == InterimLoan.outstanding_principal_cents + InterimLoan.accrued_interest_cents"]
        side_effects: ["set InterimLoan.outstanding_principal_cents = 0", "set InterimLoan.accrued_interest_cents = 0", "set BridgeProgram.advance_status = SETTLED when outstanding_carrying_cost_cents == 0", "increment InterimLoan.version", "increment BridgeProgram.version"]
      - from: DRAWN
        to: REPAYING
        trigger: "POST /knock/interim-loans/{id}/repayments"
        actor: Homeowner
        preconditions: ["InterimLoan.status IN {DRAWN, DELINQUENT}", "amount_cents > 0", "amount_cents < InterimLoan.outstanding_principal_cents + InterimLoan.accrued_interest_cents"]
        side_effects: ["reduce InterimLoan.outstanding_principal_cents", "recompute InterimLoan.accrued_interest_cents", "set InterimLoan.status = REPAYING", "increment InterimLoan.version"]
      - from: REPAYING
        to: REPAID
        trigger: "POST /knock/interim-loans/{id}/repayments final repayment"
        actor: Homeowner
        preconditions: ["InterimLoan.status == REPAYING", "amount_cents == InterimLoan.outstanding_principal_cents + InterimLoan.accrued_interest_cents"]
        side_effects: ["set InterimLoan.outstanding_principal_cents = 0", "set InterimLoan.accrued_interest_cents = 0", "set BridgeProgram.advance_status = SETTLED when outstanding_carrying_cost_cents == 0", "increment InterimLoan.version", "increment BridgeProgram.version"]
      - from: DRAWN
        to: DELINQUENT
        trigger: "system event: logical clock passes the carrying-cost due frontier"
        actor: system
        preconditions: ["InterimLoan.status == DRAWN", "clock > earliest unpaid CarryingCost.due_date", "InterimLoan.accrued_interest_cents > 0"]
        side_effects: ["increment InterimLoan.version"]
      - from: DELINQUENT
        to: REPAYING
        trigger: "POST /knock/interim-loans/{id}/repayments"
        actor: Homeowner
        preconditions: ["InterimLoan.status == DELINQUENT", "amount_cents > 0"]
        side_effects: ["reduce InterimLoan.outstanding_principal_cents", "recompute InterimLoan.accrued_interest_cents", "increment InterimLoan.version"]
      - from: REPAID
        to: REPAYING
        trigger: "POST /knock/interim-loans/{id}/reopen-advance"
        actor: Underwriter
        preconditions: ["InterimLoan.status == REPAID", "a RepairAdvance for the same BridgeProgram is in status DISBURSED with repaid_cents < approved_amount_cents"]
        side_effects: ["set InterimLoan.outstanding_principal_cents = the un-clawed RepairAdvance amount", "set InterimLoan.status = REPAYING", "increment InterimLoan.version"]

  - entity: BridgeAdvance
    initial_state: PENDING
    terminal_states: [DISBURSED, REPAID, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /knock/bridge-advances/{id}/approve"
        actor: Underwriter
        preconditions: ["BridgeAdvance.status == PENDING", "BridgeAdvance.purpose == DOWN_PAYMENT when amount_cents > 9000000"]
        side_effects: ["increment BridgeAdvance.version"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /knock/bridge-advances/{id}/reject"
        actor: Underwriter
        preconditions: ["BridgeAdvance.status == PENDING"]
        side_effects: ["increment BridgeAdvance.version"]
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /knock/bridge-advances/{id}/disburse"
        actor: Coordinator
        preconditions: ["BridgeAdvance.status == APPROVED", "linked InterimLoan has capacity", "bridge_program.advance_status IN {FUNDING, FUNDED}"]
        side_effects: ["increment InterimLoan.drawn_cents", "recompute InterimLoan.outstanding_principal_cents", "set assignee CoordinationTask.status = IN_PROGRESS", "recompute CarryingCost impacts", "increment BridgeProgram.version", "increment BridgeAdvance.version"]
      - from: APPROVED
        to: REJECTED
        trigger: "POST /knock/bridge-advances/{id}/reject"
        actor: Underwriter
        preconditions: ["BridgeAdvance.status == APPROVED", "no CoordinationTask linked to the program is COMPLETED"]
        side_effects: ["compensate: set linked CoordinationTask.status = CANCELLED when its status == IN_PROGRESS", "set BridgeProgram.advance_status = PENDING when the rejected advance is the sole DOWN_PAYMENT advance", "increment BridgeAdvance.version", "increment BridgeProgram.version"]
      - from: DISBURSED
        to: REPAID
        trigger: "POST /knock/disbursements"
        actor: system
        preconditions: ["BridgeAdvance.status == DISBURSED", "a Disbursement with source_kind in {CLOSING_SALE, RESALE} fully covers the advance"]
        side_effects: ["increment RepairAdvance.repaid_cents when a bridged repair is present", "increment BridgeAdvance.version"]

  - entity: Property
    initial_state: UNLISTED
    terminal_states: [SOLD_TO_PROGRAM, RESOLD]
    transitions:
      - from: UNLISTED
        to: LISTED
        trigger: "POST /knock/listings/{id}/go-live"
        actor: Coordinator
        preconditions: ["Property.kind == DEPARTING", "Property.repair_status == COMPLETE"]
        side_effects: ["set listing marketing_status = ACTIVE", "increment Property.version"]
      - from: LISTED
        to: UNDER_CONTRACT
        trigger: "POST /knock/listings/{id}/under-contract"
        actor: Coordinator
        preconditions: ["Property.listing_status == LISTED", "the linked Listing.status == LIVE"]
        side_effects: ["increment Listing.offer_count", "set the linked BackupOffer.status = EXTENDED when its status == ISSUED", "increment Property.version"]
      - from: UNDER_CONTRACT
        to: RESOLD
        trigger: "POST /knock/listings/{id}/close-sale"
        actor: Coordinator
        preconditions: ["Property.listing_status == UNDER_CONTRACT"]
        side_effects: ["create a Disbursement with source_kind CLOSING_SALE", "set Property.program_inventory_flag = false", "recompute BridgeProgram.occupancy_status = DEPARTING_SOLD", "increment Property.version"]
      - from: LISTED
        to: SOLD_TO_PROGRAM
        trigger: "POST /knock/backup-offers/{id}/exercise"
        actor: Coordinator
        preconditions: ["Property.listing_status == LISTED", "linked BackupOffer.status == ISSUED", "clock <= BackupOffer.expires_at"]
        side_effects: ["set Property.program_inventory_flag = true", "create a Disbursement with source_kind RESALE", "set the linked Listing.status = PAUSED", "increment Property.version"]
      - from: SOLD_TO_PROGRAM
        to: RESOLD
        trigger: "POST /knock/disbursements with source_kind == RESALE"
        actor: system
        preconditions: ["Property.program_inventory_flag == true", "the resale Disbursement.amount_cents > 0"]
        side_effects: ["set Property.program_inventory_flag = false", "set Property.listing_status = RESOLD", "increment Property.version"]

  - entity: BackupOffer
    initial_state: DRAFT
    terminal_states: [EXPIRED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /knock/backup-offers/{id}/issue"
        actor: Coordinator
        preconditions: ["BackupOffer.status == DRAFT", "offer_price_cents <= Property.appraised_value_cents", "linked BridgeProgram.occupancy_status == DEPARTING_LISTED"]
        side_effects: ["recompute BackupOffer.expires_at = window_start + window_days", "increment BackupOffer.version"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system event: logical clock passes expires_at"
        actor: system
        preconditions: ["BackupOffer.status == ISSUED", "clock > BackupOffer.expires_at"]
        side_effects: ["increment BackupOffer.version"]
      - from: EXPIRED
        to: ISSUED
        trigger: "POST /knock/backup-offers/{id}/extend"
        actor: Coordinator
        preconditions: ["BackupOffer.status == EXPIRED", "Property.listing_status == LISTED"]
        side_effects: ["recompute BackupOffer.expires_at = clock + window_days", "increment BackupOffer.version"]
      - from: ISSUED
        to: EXTENDED
        trigger: "POST /knock/listings/{id}/under-contract"
        actor: Coordinator
        preconditions: ["BackupOffer.status == ISSUED"]
        side_effects: ["recompute BackupOffer.expires_at = current expires_at + 30 days", "increment BackupOffer.version", "increment Property.version"]
      - from: EXTENDED
        to: ISSUED
        trigger: "POST /knock/backup-offers/{id}/extend"
        actor: Coordinator
        preconditions: ["BackupOffer.status == EXTENDED", "clock <= BackupOffer.expires_at"]
        side_effects: ["recompute BackupOffer.expires_at = clock + window_days", "increment BackupOffer.version"]
      - from: ISSUED
        to: VOIDED
        trigger: "POST /knock/listings/{id}/close-sale"
        actor: system
        preconditions: ["BackupOffer.status == ISSUED", "Property.listing_status == UNDER_CONTRACT"]
        side_effects: ["void the guarantee because the departing home sold to a third party", "increment BackupOffer.version", "increment Property.version"]
      - from: EXTENDED
        to: VOIDED
        trigger: "POST /knock/listings/{id}/close-sale"
        actor: system
        preconditions: ["BackupOffer.status == EXTENDED", "Property.listing_status == UNDER_CONTRACT"]
        side_effects: ["void the guarantee because the departing home sold to a third party", "increment BackupOffer.version", "increment Property.version"]
      - from: ISSUED
        to: EXERCISED
        trigger: "POST /knock/backup-offers/{id}/exercise"
        actor: Coordinator
        preconditions: ["BackupOffer.status == ISSUED", "clock <= BackupOffer.expires_at", "Property.listing_status == LISTED"]
        side_effects: ["set Property.listing_status = SOLD_TO_PROGRAM", "set Property.program_inventory_flag = true", "create a Disbursement with source_kind RESALE", "set the linked Listing.status = PAUSED", "increment Property.version", "increment BackupOffer.version"]
      - from: EXTENDED
        to: EXPIRED
        trigger: "system event: logical clock passes expires_at after the last extension"
        actor: system
        preconditions: ["BackupOffer.status == EXTENDED", "clock > BackupOffer.expires_at"]
        side_effects: ["increment BackupOffer.version"]
      - from: EXTENDED
        to: EXERCISED
        trigger: "POST /knock/backup-offers/{id}/exercise"
        actor: Coordinator
        preconditions: ["BackupOffer.status == EXTENDED", "clock <= BackupOffer.expires_at", "Property.listing_status == LISTED"]
        side_effects: ["set Property.listing_status = SOLD_TO_PROGRAM", "create a Disbursement with source_kind RESALE", "increment Property.version", "increment BackupOffer.version"]

  - entity: Listing
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: LIVE
        trigger: "POST /knock/listings/{id}/go-live"
        actor: Coordinator
        preconditions: ["Listing.status == DRAFT", "linked Property.repair_status == COMPLETE", "list_price_cents > 0"]
        side_effects: ["set BridgeProgram.occupancy_status = DEPARTING_LISTED", "set Property.listing_status = LISTED", "set Listing.marketing_status = ACTIVE", "escalate every CoordinationTask for the program with due_date < clock and status == OPEN to IN_PROGRESS", "increment Listing.version", "increment BridgeProgram.version"]
      - from: LIVE
        to: PAUSED
        trigger: "POST /knock/backup-offers/{id}/exercise"
        actor: Coordinator
        preconditions: ["Listing.status == LIVE", "linked Property.listing_status == LISTED"]
        side_effects: ["set Listing.marketing_status = STOPPED", "increment Listing.version"]
      - from: PAUSED
        to: LIVE
        trigger: "PATCH /knock/listings/{id}"
        actor: Coordinator
        preconditions: ["Listing.status IN {DRAFT, PAUSED, LIVE}", "relist_after_pause == true"]
        side_effects: ["set Listing.marketing_status = ACTIVE", "increment Listing.version"]
      - from: LIVE
        to: CLOSED
        trigger: "POST /knock/listings/{id}/close-sale"
        actor: Coordinator
        preconditions: ["Listing.status == LIVE", "Property.listing_status == UNDER_CONTRACT"]
        side_effects: ["set Listing.marketing_status = STOPPED", "set BridgeProgram.occupancy_status = DEPARTING_SOLD", "increment Listing.version"]
      - from: PAUSED
        to: CLOSED
        trigger: "POST /knock/listings/{id}/close-sale"
        actor: Coordinator
        preconditions: ["Listing.status == PAUSED", "Property.listing_status == SOLD_TO_PROGRAM"]
        side_effects: ["set Listing.marketing_status = STOPPED", "increment Listing.version"]

  - entity: RepairAdvance
    initial_state: REQUESTED
    terminal_states: [SETTLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /knock/repair-advances/{id}/approve"
        actor: Underwriter
        preconditions: ["RepairAdvance.status == REQUESTED", "approved_amount_cents <= 5000000", "linked Property.kind == DEPARTING", "linked bridge_program.advance_status IN {FUNDING, FUNDED}"]
        side_effects: ["set linked Property.repair_status = IN_PROGRESS", "increment RepairAdvance.version", "increment Property.version"]
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /knock/repair-advances/{id}/disburse"
        actor: Coordinator
        preconditions: ["RepairAdvance.status == APPROVED", "every CoordinationTask with task_kind in {PHOTOGRAPHY, REPAIR_BID} for the program is COMPLETED"]
        side_effects: ["increment InterimLoan.drawn_cents", "recompute InterimLoan.outstanding_principal_cents", "increment InterimLoan.version", "increment RepairAdvance.version"]
      - from: DISBURSED
        to: SETTLED
        trigger: "POST /knock/disbursements with source_kind == REPAIR_CLAWBACK"
        actor: system
        preconditions: ["RepairAdvance.status == DISBURSED", "the clawback Disbursement.amount_cents <= approved_amount_cents - repaid_cents"]
        side_effects: ["increment RepairAdvance.repaid_cents", "set linked Property.repair_status = COMPLETE when repaid_cents == approved_amount_cents", "increment RepairAdvance.version", "increment Property.version"]

  - entity: Referral
    initial_state: OPEN
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /knock/referrals/{id}/complete"
        actor: Coordinator
        preconditions: ["Referral.status == OPEN", "every CoordinationTask where referral_id == this.id has status == COMPLETED", "qualifying_volume_cents > 0"]
        side_effects: ["recompute Referral.base_fee_cents", "recompute Referral.reconciled_fee_cents", "recompute BridgeProgram.active_referral_count", "recompute Agent.active_referral_count", "increment Referral.version", "increment Agent.version", "increment BridgeProgram.version"]
      - from: OPEN
        to: VOIDED
        trigger: "POST /knock/referrals/{id}/void"
        actor: Coordinator
        preconditions: ["Referral.status == OPEN", "the linked Agent.qualification_status == SUSPENDED"]
        side_effects: ["recompute Agent.active_referral_count", "recompute BridgeProgram.active_referral_count", "increment Referral.version", "increment Agent.version"]
      - from: COMPLETED
        to: OPEN
        trigger: "POST /knock/referrals/{id}/reopen"
        actor: Coordinator
        preconditions: ["Referral.status == COMPLETED", "a new CoordinationTask for the referral is created after completion"]
        side_effects: ["recompute Agent.active_referral_count", "recompute BridgeProgram.active_referral_count", "increment Referral.version"]

  - entity: CoordinationTask
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /knock/listings/{id}/go-live system escalation"
        actor: system
        preconditions: ["CoordinationTask.status == OPEN", "CoordinationTask.due_date < clock"]
        side_effects: ["increment CoordinationTask.version"]
      - from: OPEN
        to: COMPLETED
        trigger: "POST /knock/coordination-tasks/{id}/complete"
        actor: Agent
        preconditions: ["CoordinationTask.status IN {OPEN, IN_PROGRESS}"]
        side_effects: ["recompute Referral backfill eligibility when the completed task is the Referral's last OPEN task", "increment CoordinationTask.version", "increment Referral.version"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /knock/coordination-tasks/{id}/complete"
        actor: Agent
        preconditions: ["CoordinationTask.status == IN_PROGRESS", "task_kind in {REPAIR_BID, PHOTOGRAPHY} when a RepairAdvance for the program is in status APPROVED"]
        side_effects: ["recompute the linked Referral.status to COMPLETED when every task is terminal-in-success", "recompute Agent.active_referral_count", "increment CoordinationTask.version"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /knock/bridge-advances/{id}/reject compensation"
        actor: system
        preconditions: ["CoordinationTask.status == OPEN", "linked BridgeAdvance.status == REJECTED"]
        side_effects: ["increment CoordinationTask.version"]

  - entity: Agent
    initial_state: PENDING
    terminal_states: [SUSPENDED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /knock/agents/{id}/qualify"
        actor: Coordinator
        preconditions: ["Agent.qualification_status == PENDING", "Agent.license_number present"]
        side_effects: ["increment Agent.version"]
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /knock/agents/{id}/suspend"
        actor: Coordinator
        preconditions: ["Agent.qualification_status IN {PENDING, QUALIFIED}"]
        side_effects: ["set every Referral where agent_id == this.id and status == OPEN to VOIDED", "recompute BridgeProgram.active_referral_count for every affected program", "recompute Agent.active_referral_count", "increment Agent.version"]
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "PATCH /knock/agents/{id}"
        actor: Coordinator
        preconditions: ["Agent.qualification_status == SUSPENDED", "reinstatement_note present"]
        side_effects: ["increment Agent.version"]

  - entity: Disbursement
    initial_state: RECORDED
    terminal_states: [APPLIED]
    transitions:
      - from: RECORDED
        to: APPLIED
        trigger: "POST /knock/disbursements"
        actor: system
        preconditions: ["Disbursement.amount_cents > 0", "linked BridgeProgram.advance_status != SETTLED"]
        side_effects: ["recompute Disbursement.applied_to_principal_cents", "recompute Disbursement.applied_to_interest_cents", "recompute InterimLoan.outstanding_principal_cents", "recompute InterimLoan.accrued_interest_cents", "set BridgeAdvance.status = REPAID for covered advances", "increment InterimLoan.version", "increment BridgeProgram.version"]

calculations:
  - name: purchase_capacity
    trigger: "POST /knock/qualifications; PATCH /knock/qualifications/{id}; POST /knock/qualifications/{id}/approve"
    algorithm: forward_looking
    formula: |
      variant CONSERVATIVE:
        equity   = departing_property.appraised_value_cents - departing_property.mortgage_payoff_cents
        capacity = equity * (BASE_EQUITY_RATIO_BPS + condition_credit_bps) // 10000
      variant OPTIMISTIC:
        equity   = departing_property.appraised_value_cents - departing_property.mortgage_payoff_cents
        capacity = equity * (BASE_EQUITY_RATIO_BPS + condition_credit_bps + MARKET_APPRECIATION_BPS) // 10000
      where condition_credit_bps = max(0, CONDITION_CREDIT_BASE_BPS * (condition_rank - 3))
      and   condition_rank = {A:4, B:3, C:2, D:1}[departing_property.condition_grade]
      clamp: if capacity > household_income_cents * PMI_MAX_MULTIPLE // 10000:
               capacity = household_income_cents * PMI_MAX_MULTIPLE // 10000
      floor:  capacity = max(capacity, 0)
    input_set: "the single Qualification row being computed plus its linked Homeowner and departing Property; no other Qualification rows participate"
    constants:
      BASE_EQUITY_RATIO_BPS: 7000
      MARKET_APPRECIATION_BPS: 1000
      CONDITION_CREDIT_BASE_BPS: 500
      PMI_MAX_MULTIPLE: 50000
    precision: "integer cents, floor division throughout; no intermediate rounding"
    variants:
      - name: CONSERVATIVE
        when: "Qualification.variant_used == CONSERVATIVE"
        difference: "omits MARKET_APPRECIATION_BPS, so capacity is at least 1000 bps of equity lower"
      - name: OPTIMISTIC
        when: "Qualification.variant_used == OPTIMISTIC"
        difference: "adds MARKET_APPRECIATION_BPS to the ratio before the income clamp"

  - name: bridge_advance_headroom
    trigger: "POST /knock/bridge-advances; POST /knock/bridge-advances/{id}/approve; POST /knock/bridge-advances/{id}/disburse"
    algorithm: threshold
    formula: |
      debit = linked InterimLoan.principal_cents * PROGRAM_FEE_BPS // 10000
      headroom = linked InterimLoan.principal_cents - linked InterimLoan.outstanding_principal_cents - debit
      accepted = (amount_cents > 0) and (amount_cents <= headroom)
      standing  = DOWN_PAYMENT with amount_cents > STAKE_HOLDER_REVIEW_CENTS is downgraded to disclose_only and is not auto-approved
    input_set: "the BridgeAdvance under test plus its linked InterimLoan; only advances with status IN {PENDING, APPROVED} participate"
    constants:
      PROGRAM_FEE_BPS: 150
      STAKE_HOLDER_REVIEW_CENTS: 9000000
    precision: "integer cents; boundary is inclusive at headroom (amount_cents == headroom is accepted)"
    variants:
      - name: draw_headroom
        when: "purpose IN {DOWN_PAYMENT, CARRYING_COST, REPAIR, FEE, DISCLOSURE}"
        difference: "the program fee debit is reserved out of principal before headroom is measured"
      - name: fee_headroom
        when: "purpose == DISCLOSURE"
        difference: "only the DISCLOSURE portion may consume the fee reserve; a DISCLOSURE advance never causes the fee reserve itself to be debited twice"

  - name: interior_loan_interest_accrual
    trigger: "POST /knock/bridge-advances/{id}/disburse; POST /knock/interim-loans/{id}/repayments; POST /_clock/set_current_utc"
    algorithm: chronological
    formula: |
      order_advances = advance events for this loan sorted by (advanced_at ASC, created_at ASC)
      running_principal = 0
      accrued = 0
      for each event in order_advances:
          accrued = accrued + running_principal * interest_rate_bps * INTERIM_DAY_COUNT_BPS // (10000 * 10000)
          running_principal = running_principal + event.amount_cents
      accrued = accrued + running_principal * interest_rate_bps * INTERIM_DAY_COUNT_BPS // (10000 * 10000)
      accrued = accrued - repayments_applied_to_interest_cents
      accrued = max(accrued, 0)
    input_set: "all BridgeAdvance rows for the loan with status DISBURSED, plus all repayments; PENDING and REJECTED advances are excluded"
    constants:
      INTERIM_DAY_COUNT_BPS: 3000
    precision: "integer cents, floor at every term; accrual events processed strictly by ascending advanced_at"
    variants:
      - name: accrual_to_today
        when: "InterimLoan.status IN {DRAWN, REPAYING, DELINQUENT}"
        difference: "accrues through the current logical clock"
      - name: accrual_billed
        when: "a Disbursement with source_kind CLOSING_SALE has been applied"
        difference: "stops accruing at the first CLOSING_SALE Disbursement.created_at instead of at the clock"

  - name: carrying_cost_burden
    trigger: "POST /knock/carrying-costs; POST /knock/interim-loans/{id}/repayments; POST /knock/disbursements"
    algorithm: aggregation
    formula: |
      sum_then_prorate:
        total = sum of amount_cents over CarryingCost rows for the program
        by_kind = {k: sum of amount_cents over rows for the program with kind == k}
        all_kinds = [DEPARTING_TAX, DEPARTING_INSURANCE, DEPARTING_HOA, DEPARTING_UTILITY,
                    NEW_TAX, NEW_INSURANCE, NEW_HOA, NEW_UTILITY]
        for k in all_kinds (in that fixed order):
            bucket = by_kind.get(k, 0)
            if k == high_cost_bucket:
                bucket = bucket + total * NEW_CONSTRUCTION_ADJUSTMENT_BPS // 10000
            attributed[k] = bucket
      high_cost_bucket = NEW_CONSTRUCTION_INSURANCE when new_property.condition_grade in {A, B}
                         else NEW_TAX
      prorate_then_sum:
        for each CarryingCost row for the program:
            bucket_row = amount_cents
            if row.kind == high_cost_bucket:
                bucket_row = bucket_row + amount_cents * NEW_CONSTRUCTION_ADJUSTMENT_BPS // 10000
            attributed[row.kind] = attributed[row.kind] + bucket_row
      outstanding_carrying_cost_cents = sum over attributed[k] with CarryingCost.repayment_status == UNPAID
    input_set: "CarryingCost rows for the program with repayment_status IN {UNPAID, REPAID}; rows for other programs are excluded"
    constants:
      NEW_CONSTRUCTION_ADJUSTMENT_BPS: 2500
    precision: "integer cents; sum_then_prorate floors the pooled adjustment once, prorate_then_sum floors per row"
    variants:
      - name: sum_then_prorate
        when: "BridgeProgram.projected_carry_months >= 3"
        difference: "pools the construction adjustment on the aggregate total and floors once"
      - name: prorate_then_sum
        when: "BridgeProgram.projected_carry_months < 3"
        difference: "applies the adjustment per CarryingCost row before summing, producing different cents when rows straddle the bucket"

  - name: program_charge_disclosure
    trigger: "POST /knock/bridge-programs/{id}/fund; POST /knock/bridge-programs/{id}/disclosures/preview"
    algorithm: constraint_propagation
    formula: |
      origination = InterimLoan.principal_cents * program_fee_basis_points // 10000
      coordination = COORDINATION_FLAT_CENTS
      subtotal = origination + coordination
      if subtotal > DISCLOSURE_MIN_CENTS:
          # disclosed tier: the escalator tracks the actual subtotal
          escalator = subtotal * (ESCALATOR_HIGH_BPS if subtotal > DISCLOSURE_REVIEW_CENTS else ESCALATOR_LOW_BPS) // 10000
      else:
          # evaluation-order trap: the low band is evaluated against the FIXED reference
          # SUBTOTAL_REFERENCE_CENTS, not against the small actual subtotal
          escalator = SUBTOTAL_REFERENCE_CENTS * ESCALATOR_LOW_BPS // 10000
      total = subtotal + escalator
    input_set: "the BridgeProgram row plus its InterimLoan and its active Referral rows; historical programs are excluded"
    constants:
      COORDINATION_FLAT_CENTS: 45000
      DISCLOSURE_MIN_CENTS: 300000
      DISCLOSURE_REVIEW_CENTS: 500000
      ESCALATOR_LOW_BPS: 250
      ESCALATOR_HIGH_BPS: 500
      SUBTOTAL_REFERENCE_CENTS: 400000
    precision: "integer cents, floor at each term, escalator floored before addition"
    variants:
      - name: single_program
        when: "exactly one active Referral row for the program"
        difference: "coordination is the flat COORDINATION_FLAT_CENTS only"
      - name: multi_referral
        when: "two or more active Referral rows for the program"
        difference: "each additional OPEN referral adds REFERRAL_COORDINATION_CENTS to the coordination term before subtotal"

  - name: refer_discount_waterfall
    trigger: "POST /knock/bridge-advances/{id}/approve; POST /knock/referrals/{id}/complete"
    algorithm: waterfall_allocation
    formula: |
      pools = [AGENT_REFERRAL_POOL_CENTS, COORDINATION_CREDIT_CENTS] in that fixed order
      remaining = requested_discount_cents
      granted = 0
      for pool in pools:
          take = min(pool, remaining)
          granted = granted + take
          remaining = remaining - take
      granted_cents = granted
      unfunded_cents = max(remaining, 0)
    input_set: "discount requests for one BridgeAdvance approval; pools are consumed per-approval and do not carry across advances"
    constants:
      AGENT_REFERRAL_POOL_CENTS: 25000
      COORDINATION_CREDIT_CENTS: 10000
    precision: "integer cents; the first pool fills completely before the second is touched"
    variants:
      - name: agent_first
        when: "the requesting Referral.role_scope == DEPARTING_SIDE"
        difference: "consumes AGENT_REFERRAL_POOL_CENTS before COORDINATION_CREDIT_CENTS"
      - name: coordination_first
        when: "the requesting Referral.role_scope IN {NEW_SIDE, RESALE_SIDE}"
        difference: "consumes COORDINATION_CREDIT_CENTS before AGENT_REFERRAL_POOL_CENTS"

  - name: backup_offer_price_floor
    trigger: "POST /knock/backup-offers; POST /knock/backup-offers/{id}/issue; POST /knock/backup-offers/{id}/exercise"
    algorithm: weighted_scoring
    formula: |
      base = Property.appraised_value_cents * (10000 - DISCOUNT_BPS) // 10000
      condition_modifier_bps = [A:0, B:200, C:450, D:600][Property.condition_grade]
      floor = base * (10000 - condition_modifier_bps) // 10000
      offered_floor = floor
      regulatory_floor = Property.appraised_value_cents * REGULATORY_MIN_RATIO_BPS // 10000
      if regulatory_floor > offered_floor:
          offered_floor = regulatory_floor
    input_set: "the BackupOffer row with its linked Property; only offers whose status IN {DRAFT, ISSUED, EXPIRED, EXTENDED, EXERCISED} are bounded by this floor"
    constants:
      DISCOUNT_BPS: 1200
      REGULATORY_MIN_RATIO_BPS: 8500
    precision: "integer cents, floor at each term; the regulatory floor wins whenever it exceeds the discounted floor"
    variants:
      - name: standard
        when: "Property.condition_grade IN {A, B}"
        difference: "condition_modifier_bps <= 200, so the discounted base floor generally exceeds the regulatory floor"
      - name: distressed
        when: "Property.condition_grade IN {C, D}"
        difference: "condition_modifier_bps pushes the discounted floor below the regulatory floor, so the regulatory floor binds"

  - name: dual_carrying_cost_view
    trigger: "GET /knock/bridge-programs/{id}/summary"
    algorithm: forward_looking
    formula: |
      true_cost:
        drawn_interest = InterimLoan.outstanding_principal_cents * interest_rate_bps * ACTUAL_ELAPSED_MONTHS // (10000 * 100)
        true_cost_cents = BridgeProgram.outstanding_carrying_cost_cents + drawn_interest
      amortized_cost:
        amortized_cost_cents = BridgeProgram.outstanding_carrying_cost_cents 
                             + InterimLoan.principal_cents * interest_rate_bps * projected_carry_months // (10000 * 100)
      variance_cents = true_cost_cents - amortized_cost_cents
      ACTUAL_ELAPSED_MONTHS = count of whole calendar months between InterimLoan.originated_at and the logical clock
    input_set: "the BridgeProgram summary view; unpaid CarryingCost rows only, plus the linked InterimLoan"
    constants:
      ACTUAL_ELAPSED_MONTHS: computed from the logical clock
    precision: "integer cents, floor; variance may be negative when the loan has amortized faster than actual elapsed months"
    variants:
      - name: true_cost
        when: "the summary is requested for a program with advance_status == FUNDED"
        difference: "uses the current logical clock's actual elapsed months"
      - name: amortized_cost
        when: "the summary is requested for a program with advance_status IN {PENDING, FUNDING}"
        difference: "uses projected_carry_months instead of actual elapsed months"

  - name: referral_fee_reconciliation
    trigger: "POST /knock/referrals; POST /knock/referrals/{id}/complete; PATCH /knock/referrals/{id}"
    algorithm: weighted_scoring
    formula: |
      base = qualifying_volume_cents * Referral.referral_rate_bps // 10000
      if Agent.qualification_status == QUALIFIED:
          bonus = base * QUALIFIED_BONUS_BPS // 10000
      else:
          bonus = 0
      credits = min(COORDINATION_CREDIT_CENTS, CoordinationTask rows for this referral with status == COMPLETED * COORDINATION_CREDIT_PER_TASK_CENTS)
      reconciled = base + bonus + credits
      variance_cents = reconciled - base
    input_set: "the Referral row, its linked Agent, and its CoordinationTask rows with status IN {OPEN, IN_PROGRESS, COMPLETED}; CANCELLED tasks are excluded"
    constants:
      QUALIFIED_BONUS_BPS: 300
      COORDINATION_CREDIT_CENTS: 20000
      COORDINATION_CREDIT_PER_TASK_CENTS: 8000
    precision: "integer cents, floor; each term is floored independently before summation"
    variants:
      - name: base_only
        when: "Agent.qualification_status != QUALIFIED"
        difference: "bonus is 0, so reconciled == base + credits"
      - name: qualified
        when: "Agent.qualification_status == QUALIFIED"
        difference: "adds a QUALIFIED_BONUS_BPS bonus on base before credits"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and name a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is listed in the endpoint's roles[]"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "the X-User-ID acting as Coordinator on POST /knock/backup-offers/{id}/exercise must not be the same X-User-ID that issued that BackupOffer"
    error_id: ERR_SOD_BACKUP_APPROVER
    http_status: 403
    applies_to: "POST /knock/backup-offers/{id}/exercise"
  - priority: 4
    category: auth
    check: "PATCH /knock/listings/{id} may only relist a listing; a request that sets relist_after_pause false is rejected, because the endpoint cannot be used to take a live listing back to DRAFT"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "PATCH /knock/listings/{id}"
  - priority: 5
    category: business_constraint
    check: "every required input field for the endpoint is present and every supplied value satisfies its declared type and range constraint"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: existence
    check: "path-referenced Homeowner exists"
    error_id: ERR_HOMEOWNER_NOT_FOUND
    http_status: 404
    applies_to: "GET /knock/homeowners/{id}, GET /knock/properties, POST /knock/qualifications, POST /knock/bridge-programs"
  - priority: 7
    category: existence
    check: "path-referenced Property exists"
    error_id: ERR_PROPERTY_NOT_FOUND
    http_status: 404
    applies_to: "GET /knock/properties/{id}, POST /knock/properties/{id}/site-visits, POST /knock/backup-offers, POST /knock/listings, POST /knock/repair-advances"
  - priority: 8
    category: existence
    check: "path-referenced Qualification exists"
    error_id: ERR_QUALIFICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /knock/qualifications/{id}, POST /knock/qualifications/{id}/approve, POST /knock/qualifications/{id}/deny, PATCH /knock/qualifications/{id}, POST /knock/bridge-programs"
  - priority: 9
    category: existence
    check: "path-referenced BridgeProgram exists"
    error_id: ERR_BRIDGE_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "GET /knock/bridge-programs/{id}, POST /knock/bridge-programs/{id}/fund, POST /knock/bridge-programs/{id}/occupy-new"
  - priority: 10
    category: existence
    check: "path-referenced InterimLoan exists"
    error_id: ERR_LOAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /knock/interim-loans/{id}, POST /knock/interim-loans/{id}/repayments, POST /knock/interim-loans/{id}/reopen-advance"
  - priority: 11
    category: existence
    check: "path-referenced BridgeAdvance, CarryingCost, RepairAdvance, BackupOffer, Listing, Agent, Referral, CoordinationTask, or Disbursement exists"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all /{id} action and read endpoints for those entities"
  - priority: 12
    category: state
    check: "the target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 13
    category: state
    check: "the target resource is not already in a terminal state"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /knock/qualifications/{id}/approve, POST /knock/interim-loans/{id}/repayments, POST /knock/backup-offers/{id}/exercise"
  - priority: 14
    category: state
    check: "the linked BackupOffer.status == ISSUED and the logical clock <= BackupOffer.expires_at"
    error_id: ERR_BACKUP_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /knock/backup-offers/{id}/exercise"
  - priority: 15
    category: state
    check: "the linked Listing.status IN {DRAFT, PAUSED, LIVE} and the BridgeProgram.occupancy_status permits the requested marketing step"
    error_id: ERR_LISTING_STATE_CONFLICT
    http_status: 409
    applies_to: "PATCH /knock/listings/{id}, POST /knock/listings/{id}/go-live, POST /knock/listings/{id}/close-sale"
  - priority: 16
    category: state
    check: "the interim loan is not already REPAID, and no reopen-advance has already been applied for this repair"
    error_id: ERR_LOAN_ALREADY_REPAID
    http_status: 409
    applies_to: "POST /knock/interim-loans/{id}/reopen-advance"
  - priority: 17
    category: business_safety
    check: "Homeowner.credit_score >= 620 for the qualification being approved"
    error_id: ERR_CREDIT_SCORE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /knock/qualifications/{id}/approve"
  - priority: 18
    category: business_safety
    check: "the interim loan principal must not exceed 7500 bps of the new property's appraised value, measured as InterimLoan.principal_cents * 10000 // Property.appraised_value_cents <= 7500 for the NEW property"
    error_id: ERR_LTV_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /knock/bridge-programs/{id}/fund, POST /knock/interim-loans"
  - priority: 19
    category: business_safety
    check: "BackupOffer.offer_price_cents >= the backup_offer_price_floor for the departing property"
    error_id: ERR_REGULATORY_PRICE_FLOOR
    http_status: 422
    applies_to: "POST /knock/backup-offers, POST /knock/backup-offers/{id}/issue"
  - priority: 20
    category: business_safety
    check: "a DOWN_PAYMENT BridgeAdvance with amount_cents > STAKE_HOLDER_REVIEW_CENTS requires prior stakeholder review before it may be disbursed"
    error_id: ERR_STAKEHOLDER_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /knock/bridge-advances/{id}/disburse"
  - priority: 21
    category: business_constraint
    check: "the requested advance does not exceed the interim loan's outstanding draw headroom"
    error_id: ERR_NO_CAPACITY
    http_status: 422
    applies_to: "POST /knock/bridge-advances, POST /knock/bridge-advances/{id}/disburse, POST /knock/repair-advances/{id}/disburse"
  - priority: 22
    category: business_constraint
    check: "the request would not leave two active Referral rows with the same role_scope for the same BridgeProgram"
    error_id: ERR_DUPLICATE_ACTIVE_REFERRAL
    http_status: 409
    applies_to: "POST /knock/referrals"
  - priority: 23
    category: business_constraint
    check: "the new CoordinationTask interval [due_date - TASK_SLOT_DAYS, due_date] is half-open (a task ending exactly where another begins is ADJACENT, not overlapping) and must not overlap any non-terminal CoordinationTask for the same Referral"
    error_id: ERR_OVERLAPPING_TASK
    http_status: 409
    applies_to: "POST /knock/coordination-tasks"
  - priority: 24
    category: business_constraint
    check: "cumulative approved amount over all RepairAdvance rows for a property does not exceed the property's repair cap"
    error_id: ERR_REPAIR_SCOPE_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /knock/repair-advances, POST /knock/repair-advances/{id}/approve"
  - priority: 25
    category: business_constraint
    check: "the requested Listing go-live must not overlap another Listing for the same departing property that is currently LIVE; listings are CLOSED-interval (a new DRAFT may be created while an old listing is still LIVE, but go-live on a second listing requires the first to be CLOSED)"
    error_id: ERR_LISTING_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /knock/listings/{id}/go-live"
  - priority: 26
    category: business_constraint
    check: "a repair advance may only be approved while the linked BridgeProgram.advance_status IN {FUNDING, FUNDED}"
    error_id: ERR_ADVANCE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /knock/repair-advances/{id}/approve"
  - priority: 27
    category: business_fiscal
    check: "BridgeProgram.outstanding_carrying_cost_cents == 0 before the final interim-loan repayment may settle the program"
    error_id: ERR_CARRYING_COST_UNPAID
    http_status: 422
    applies_to: "POST /knock/interim-loans/{id}/repayments"
  - priority: 28
    category: business_fiscal
    check: "a final repayment must equal InterimLoan.outstanding_principal_cents + InterimLoan.accrued_interest_cents exactly"
    error_id: ERR_SETTLEMENT_NOT_FULL
    http_status: 422
    applies_to: "POST /knock/interim-loans/{id}/repayments"
  - priority: 29
    category: business_fiscal
    check: "the Disbursement amount does not exceed the combined outstanding principal and accrued interest"
    error_id: ERR_DISBURSEMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /knock/disbursements"
  - priority: 30
    category: business_constraint
    check: "the appraised value is no older than APPRAISAL_VALIDITY_DAYS relative to the logical clock"
    error_id: ERR_APPRAISAL_STALE
    http_status: 422
    applies_to: "POST /knock/bridge-programs/{id}/fund, POST /knock/backup-offers"
  - priority: 31
    category: business_constraint
    check: "the linked Property.repair_status == COMPLETE before the property may be listed"
    error_id: ERR_REPAIR_NOT_COMPLETE
    http_status: 422
    applies_to: "POST /knock/listings/{id}/go-live"
  - priority: 32
    category: business_referential
    check: "the Property.Kind of each referenced property matches the role it is used in (DEPARTING vs NEW)"
    error_id: ERR_PROPERTY_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /knock/qualifications, POST /knock/backup-offers, POST /knock/bridge-programs"
  - priority: 33
    category: business_referential
    check: "the referenced Homeowner owns the referenced Property"
    error_id: ERR_HOMEOWNER_MISMATCH
    http_status: 422
    applies_to: "POST /knock/qualifications, POST /knock/bridge-programs"
  - priority: 34
    category: business_referential
    check: "the referenced Agent.qualification_status IN {PENDING, QUALIFIED} at Referral creation"
    error_id: ERR_AGENT_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /knock/referrals"
  - priority: 35
    category: business_referential
    check: "POST /knock/listings/{id}/close-sale requires the linked Listing.offer_count >= 1 and Property.listing_status == UNDER_CONTRACT"
    error_id: ERR_LISTING_OFFER_REQUIRED
    http_status: 422
    applies_to: "POST /knock/listings/{id}/close-sale"
  - priority: 36
    category: business_temporal
    check: "the logical clock >= BackupOffer.window_start before an offer may be issued"
    error_id: ERR_EXERCISE_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /knock/backup-offers/{id}/issue"
  - priority: 37
    category: business_temporal
    check: "BridgeProgram.occupancy_status must be OCCUPYING_NEW before the departing property may be listed"
    error_id: ERR_LISTING_BEFORE_OCCUPANCY
    http_status: 422
    applies_to: "POST /knock/listings/{id}/go-live"
  - priority: 38
    category: business_constraint
    check: "expected_<parent>_version in the request body equals the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /knock/bridge-programs/{id}/fund, POST /knock/interim-loans/{id}/repayments, POST /knock/backup-offers/{id}/exercise, POST /knock/referrals/{id}/reopen"

concurrency_rules:
  - rule_id: fund-stale-bridge-program
    parent_entity: BridgeProgram
    write_endpoint: "POST /knock/bridge-programs/{id}/fund"
    occ_field: "expected_bridge_program_version"
    description: |
      Funding a BridgeProgram whose version has advanced since the client last observed it is
      rejected. This captures the case where another writer has just advanced the program (for
      example by approving a BridgeAdvance, which bumps BridgeProgram.version) and the current
      writer's view of the program is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: repayment-stale-interim-loan
    parent_entity: InterimLoan
    write_endpoint: "POST /knock/interim-loans/{id}/repayments"
    occ_field: "expected_interim_loan_version"
    description: |
      Posting a repayment against an InterimLoan whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has just drawn another
      advance against the same loan (which bumps InterimLoan.version) and the current writer's view
      of the loan balance is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: exercise-stale-backup-offer
    parent_entity: BackupOffer
    write_endpoint: "POST /knock/backup-offers/{id}/exercise"
    occ_field: "expected_backup_offer_version"
    description: |
      Exercising a BackupOffer whose version has advanced since the client last observed it is
      rejected. This captures the case where another writer has just extended the offer window
      (which bumps BackupOffer.version) and the current writer's view of the offer is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: reopen-stale-referral
    parent_entity: Referral
    write_endpoint: "POST /knock/referrals/{id}/reopen"
    occ_field: "expected_referral_version"
    description: |
      Reopening a Referral whose version has advanced since the client last observed it is rejected.
      This captures the case where another writer has just completed the referral (which bumps
      Referral.version) and the current writer's view of the referral is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

endpoints:
  - method: POST
    path: "/knock/homeowners"
    description: "Register a household."
    roles: [Coordinator]
    code: 201
    input: ["full_name", "email", "credit_score", "household_income_cents", "max_dti_bps?"]
    output: Homeowner
    side_effects: []
  - method: GET
    path: "/knock/homeowners/{id}"
    description: "Read a household."
    roles: [Coordinator, Homeowner]
    code: 200
    input: []
    output: Homeowner
    side_effects: []
  - method: POST
    path: "/knock/agents"
    description: "Register a partner agent."
    roles: [Coordinator]
    code: 201
    input: ["full_name", "brokerage_name", "license_number", "referral_rate_bps?"]
    output: Agent
    side_effects: []
  - method: GET
    path: "/knock/agents/{id}"
    description: "Read a partner agent."
    roles: [Coordinator, Agent]
    code: 200
    input: []
    output: Agent
    side_effects: []
  - method: POST
    path: "/knock/agents/{id}/qualify"
    description: "Mark an agent qualified to receive referrals."
    roles: [Coordinator]
    code: 200
    input: []
    output: Agent
    side_effects: ["transition Agent PENDING->QUALIFIED"]
  - method: POST
    path: "/knock/agents/{id}/suspend"
    description: "Suspend an agent and void their open referrals."
    roles: [Coordinator]
    code: 200
    input: []
    output: Agent
    side_effects: ["transition Agent QUALIFIED->SUSPENDED", "void all OPEN Referrals for the agent", "recompute active_referral_count on Agent and BridgeProgram"]
  - method: PATCH
    path: "/knock/agents/{id}"
    description: "Reinstate a suspended agent."
    roles: [Coordinator]
    code: 200
    input: ["reinstatement_note?"]
    output: Agent
    side_effects: ["transition Agent SUSPENDED->QUALIFIED"]
  - method: POST
