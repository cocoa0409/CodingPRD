            - { call: "GET /api/gap-findings", payload: { study_id: "${st}" }, as: CompAnalyst, captures: { ft: "$.data[0].id" } }
            - { call: "POST /api/gap-findings/${ft}/disposition", payload: { disposition: TARGETED }, as: CompAnalyst }
