              as: LibraryAdmin
            - call: "POST /library/purchase-orders"
              payload: { account_id: "${acct_id}", po_number: "PO-777", authorized_amount_cents: 500000, valid_from: "2026-08-01", valid_until: "2027-06-30" }
              as: BillingManager
              captures: { po_id: $.data.id }
