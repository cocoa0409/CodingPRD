              payload: { market_code: "MIA", metro_name: "Miami", country_code: "US", radius_miles: 50, exclusivity_window_days: 30, territory_rank: 1 }
              as: TourManager
              captures: { market_id: $.data.id }
            - call: "POST /tours/${tour_id}/venues"
              payload: { market_id: "${market_id}", venue_name: "Fillmore", capacity: 1500, base_rent_cents: 200000, curfew_local_time: "23:00", available_dates: ["2026-08-20"] }
              as: TourManager
              captures: { venue_id: $.data.id }
            - call: "POST /tours/${tour_id}/start-routing"
              payload: {}
              as: TourManager
            - call: "POST /tours/${tour_id}/shows"
              payload: { market_id: "${market_id}", venue_id: "${venue_id}", show_date: "2026-08-20", on_sale_at: "2026-07-01T00:00:00Z", avg_ticket_price_cents: 9000 }
              as: TourManager
              captures: { show_id: $.data.id }
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds"
              payload: { promoter_name: "P", guarantee_cents: 1000000, versus_pct: 75 }
              as: Promoter
              captures: { hold_id: $.data.id }
          trigger:
            - call: "POST /tours/${tour_id}/shows/${show_id}/holds/${hold_id}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tour_id}/shows/${show_id}"
              payload: {}
              as: TourManager
              captures: { st: $.data.status, cap: $.data.capacity, gp: $.data.gross_potential_cents }
          assert:
            - "st == HOLD_PLACED (link 1: accept→HOLD_PLACED)"
            - "cap == 1500 (link 2: snapshot from venue.capacity at accept)"
            - "gp == 13500000 (link 3: capacity * avg_ticket_price_cents = 1500 * 9000)"

  # -------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_settle_verify
        grounds:
          - validations[priority=6]
          - validations[priority=15]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BUDGET_OVERRUN]
        distinguishing_aspect: |
          Settlement verify on a DRAFT settlement (state violation, priority 6)
          AND a budget overrun (fiscal violation, priority 15). The state error
          must win because state (priority 6) precedes business_fiscal (15).
        test_recipe:
          setup:
            - "Show PERFORMED, Settlement still DRAFT (not yet SUBMITTED)"
            - "Show has a committed BudgetLine whose actual_cents exceeds the budget cap"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
