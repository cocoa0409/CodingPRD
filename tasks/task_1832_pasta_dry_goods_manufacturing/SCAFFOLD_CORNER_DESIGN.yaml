        claim_type: derived_field_reconciliation
        grounds: [entities.ProductionLine, "concurrency_rules[run-create-stale-line]"]
        distinguishing_aspect: "common_fields version semantics: create -> 1, start-cleaning -> 2, complete-cleaning -> 3, run creation -> 4; every mutation is observable as a version increment."
        test_recipe:
          setup: ["line L-VRM plus contract/lot/recipe for the run"]
          setup_api_calls:
            - call: "POST /production-lines"
              payload: { line_name: "L-VRM" }
              as: PlantManager
              captures: { line_id: $.data.id, v1: $.data.version }
            - call: "POST /production-lines/${line_id}/start-cleaning"
              payload: {}
              as: ProductionOperator
              captures: { v2: $.data.version }
            - call: "POST /production-lines/${line_id}/complete-cleaning"
              payload: {}
              as: ProductionOperator
              captures: { v3: $.data.version }
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-VRM", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
            - call: "POST /recipes"
              payload: { recipe_name: "Penne VRM", brand_type: "BRANDED", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { r_id: $.data.id }
            - call: "POST /recipes/${r_id}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
          trigger:
            - call: "POST /production-runs"
              payload: { recipe_id: "${r_id}", line_id: "${line_id}", semolina_lot_id: "${lot_id}", planned_input_kg: 50.0, scheduled_start: "2026-08-10T00:00:00Z", scheduled_end: "2026-08-11T00:00:00Z", expected_line_version: "${v3}" }
              as: ProductionOperator
            - call: "GET /production-lines/${line_id}"
              as: ProductionOperator
              captures: { v4: $.data.version }
          assert:
            - "v1 == 1 AND v2 == 2 AND v3 == 3 (each cleaning mutation increments)"
            - "v4 == 4 (run creation increments line.version)"

      - name: cascade_ordering_and_partial_states
        claim_type: cascading_side_effects
        grounds: [state_machines.WarehouseZone.CLEAR_to_QUARANTINED]
        excluded_because:
          difficulty_instance: "transitive_cascade / pest_critical_cascades_zone_lots_run_hold"
          rationale: "The 3-hop zone->lot->run cascade including BLOCKED-keeps-occupancy is asserted there; semolina_retest_reject_cascades_run_and_job and gluten_product_test_fail_auto_rejects_run_and_lots cover the other two triggers."

      - name: dual_variant_layer_coverage
        claim_type: dual_variant_calculation
        grounds: [calculations.semolina_grade, calculations.contract_settlement_price]
        excluded_because:
          difficulty_instance: "dual_variant_calc / settlement_price_index_lagged_vs_spot_blend_divergence"
          rationale: "Both dual-variant pairs are asserted by the two rule-1 instances."

      - name: rate_threshold_layer_coverage
        claim_type: rate_threshold_triggers
        grounds: [calculations.drying_moisture_projection, calculations.contract_settlement_price]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / drying_session_redry_loop_extends_required_hours"
          rationale: "Threshold resets/tier boundaries are asserted by the redry instance plus contract_tier_boundary_exact_20000_kg and packaging_partial_case_minimum_unit_boundary."

  # ============================================================ 9. Consistency Model
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_writes_and_cascades
        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: a created recipe is GET-able in the next call; the lot-reject cascade is visible on the run in the immediately following GET (no lag, no reconciliation delay)."
        test_recipe:
          setup: ["ACTIVE contract; ACCEPTED lot; APPROVED recipe; SCHEDULED run referencing the lot"]
          setup_api_calls:
            - call: "POST /ingredient-contracts"
              payload: { contract_code: "C-IMM2", supplier_name: "Durum Co", ingredient_type: "SEMOLINA", base_price_cents_per_kg: 500, reference_index_value: 100.0, pricing_method: "INDEX_LAGGED", effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: ProcurementManager
              captures: { c_id: $.data.id }
            - call: "POST /ingredient-contracts/${c_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /semolina-lots"
              payload: { contract_id: "${c_id}", delivery_date: "2026-08-01", received_weight_kg: 100.0, cert_protein_pct: 13.0, cert_moisture_pct: 14.5, cert_gluten_index: 80, cert_falling_number_s: 300 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
            - call: "POST /semolina-lots/${lot_id}/lab-results"
              payload: { lab_protein_pct: 13.8, lab_moisture_pct: 13.0, lab_gluten_index: 88, lab_falling_number_s: 340 }
              as: QATechnician
              as_user_id: "tech-1"
            - call: "POST /semolina-lots/${lot_id}/accept"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /recipes"
              payload: { recipe_name: "Penne IMM", brand_type: "BRANDED", shape_family: "LONG_CUT", gluten_free: false, target_moisture_pct: 12.5, drying_curve: "STANDARD", shelf_life_days: 365, unit_weight_g: 500, units_per_case: 30, case_weight_limit_kg: 12.0, cases_per_pallet: 40, ingredients: [ { ingredient_type: "SEMOLINA", percentage: 100.0 } ] }
              as: PlantManager
              as_user_id: "pm-1"
              captures: { r_id: $.data.id }
            - call: "POST /recipes/${r_id}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "POST /production-lines"
              payload: { line_name: "L-IMM" }
              as: PlantManager
              captures: { line_id: $.data.id, lv: $.data.version }
            - call: "POST /production-runs"
              payload: { recipe_id: "${r_id}", line_id: "${line_id}", semolina_lot_id: "${lot_id}", planned_input_kg: 50.0, scheduled_start: "2026-08-10T00:00:00Z", scheduled_end: "2026-08-11T00:00:00Z", expected_line_version: "${lv}" }
              as: ProductionOperator
              captures: { run_id: $.data.id }
          trigger:
            - call: "GET /recipes/${r_id}"
              as: ProductionOperator
            - call: "POST /semolina-lots/${lot_id}/lab-results"
              payload: { lab_protein_pct: 11.0, lab_moisture_pct: 14.0, lab_gluten_index: 55, lab_falling_number_s: 240 }
              as: QATechnician
              as_user_id: "tech-1"
            - call: "POST /semolina-lots/${lot_id}/reject"
              payload: {}
              as: QAManager
              as_user_id: "qa-mgr-1"
            - call: "GET /production-runs/${run_id}"
              as: ProductionOperator
              captures: { disp: $.data.quality_disposition }
          assert:
            - "GET recipe immediately after create returns APPROVED with all inputs intact"
            - "disp == HELD on the very next read after the reject response (cascade atomic within the reject request)"
