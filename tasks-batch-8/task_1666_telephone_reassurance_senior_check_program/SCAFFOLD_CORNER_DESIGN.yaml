            - { call: "POST /api/call-schedules/${sch}/archive", payload: {}, as: ProgramCoordinator }
            - { call: "POST /api/participants/${p_id}/call-schedules", payload: { weekday: "MON", window_start: "14:00", window_end: "15:00" }, as: ProgramCoordinator, captures: { sch2: $.data.id } }
          assert:
