          trigger:
            - call: "POST /surgical-cases/${case_id}/cancel"
              payload: { cancellation_reason: "PATIENT_REQUEST" }
              as: SchedulingCoordinator
          assert:
            - "before the trigger: BlockTime.${blk_id}.committed_minutes == 60, released_minutes == 0, open_minutes == 180, utilization_pct == 25.00, block_duration_minutes == 240 (60 + 0 + 180 == 240)"
            - "after the trigger: SurgicalCase.${case_id}.scheduling_status == CANCELLED with cancellation_reason == PATIENT_REQUEST"
            - "after the trigger: BlockTime.${blk_id}.committed_minutes == 0, released_minutes == 0, open_minutes == 240, utilization_pct == 0.00 (0 + 0 + 240 == 240)"
            - "released_minutes is STILL 0: a cancellation returns minutes to the sellable pool, unlike POST /block-times/{blockId}/release which parks them in released_minutes"
            - "after the trigger: BlockTime.${blk_id}.version == ${blk_v2} + 1 (the cancel cascade published a new block revision)"
            - "PreAnesthesiaEvaluation.${eval_id}.status == VOIDED with final_risk_score == 10.0 and risk_band == LOW retained, while SurgicalCase.${case_id}.clearance_status is still CLEARED (the two dimensions are independent)"

      - name: implant_unit_conservation_on_release
        conserved_quantity: "ImplantLot units: quantity_on_hand == available_quantity + quantity_reserved, with quantity_on_hand itself conserved only when the fixtures physically come back"
        grounds:
          - entities.ImplantLot.fields.quantity_on_hand
          - entities.ImplantLot.fields.available_quantity
          - state_machines[ImplantReservation.status] HELD -> RELEASED and HELD -> SHORTED
          - calculations.consignment_liability
        forward_operation: "POST /implant-reservations for 2 units of a 5-unit consignment lot, which moves 2 units from available into reserved and books a 48000-cent liability"
        compensating_operation: "POST /implant-reservations/{reservationId}/release with disposition RELEASED, which must undo the reservation exactly - units back, exposure down to the tiered restocking fee - and is then contrasted with a SHORTED disposition on a second reservation, where the units legitimately do NOT come back"
        drift_trap: |
          Three separate drifts. (1) Restoring available_quantity by recomputing it while forgetting to
          decrement quantity_reserved leaves the identity broken by 2 units. (2) Decrementing
          quantity_on_hand on RELEASED (copying the CONSUMED/SHORTED handler) silently destroys two
          fixtures that are sitting back in the cabinet. (3) Leaving the reservation's
          consignment_credit_cents at 12000 after release, or leaving the row inside
          Practice.consignment_committed_cents, keeps phantom exposure against the credit limit -
          the money compensation and the unit compensation have to happen together. The SHORTED
          contrast is what separates "the invariant held" from "the compensation was correct":
          both dispositions satisfy on_hand == available + reserved, but only one of them may
          change on_hand.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
            - "practice with consignment_credit_limit_cents 500000"
            - "one consignment ImplantLot: unit_cost_cents 30000, quantity_on_hand 5, expiry 2027-01-31"
            - "one DRAFT LOCAL_ONLY case (no scheduling state is required to reserve fixtures)"
            - "reservation A for 2 units (subtotal 60000) and reservation B for 1 unit (subtotal 30000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Cabinet OMS", state_code: "OH", recovery_bay_count: 2, consignment_credit_limit_cents: 500000 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Units", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80, dental_plan_active: true }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "IMPLANT", planned_start: "2026-09-20T13:00:00Z", planned_end: "2026-09-20T14:00:00Z", total_charge_cents: 90000 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /implant-lots"
              payload: { practice_id: "${prac_id}", manufacturer_code: "NOBEL", catalog_reference: "NB-4310", diameter_mm: 4.3, length_mm: 10.0, unit_cost_cents: 30000, quantity_on_hand: 5, expiry_date: "2027-01-31T00:00:00Z", is_consignment: true }
              as: InventoryManager
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /implant-reservations"
              payload: { case_id: "${case_id}", lot_id: "${lot_id}", quantity: 2, expected_lot_version: "${lot_v}" }
              as: InventoryManager
              captures: { resA_id: $.data.id }
            - call: "GET /implant-lots/${lot_id}"
              payload: {}
              as: InventoryManager
              captures: { lot_v2: $.data.version }
            - call: "POST /implant-reservations"
              payload: { case_id: "${case_id}", lot_id: "${lot_id}", quantity: 1, expected_lot_version: "${lot_v2}" }
              as: InventoryManager
              captures: { resB_id: $.data.id }
          trigger:
            - call: "POST /implant-reservations/${resA_id}/release"
              payload: { disposition: "RELEASED" }
              as: InventoryManager
            - call: "POST /implant-reservations/${resB_id}/release"
              payload: { disposition: "SHORTED" }
              as: InventoryManager
          assert:
            - "before the triggers: ImplantLot.${lot_id}.quantity_on_hand == 5, quantity_reserved == 3, available_quantity == 2 (5 == 2 + 3)"
            - "before the triggers: ImplantReservation.${resA_id} has line_subtotal_cents == 60000, restocking_fee_cents == 6000 (60000 sits in the 10% tier), consignment_credit_cents == 12000, consignment_liability_cents == 48000"
            - "before the triggers: ImplantReservation.${resB_id} has line_subtotal_cents == 30000, restocking_fee_cents == 4500 (15% tier), consignment_credit_cents == 6000, consignment_liability_cents == 24000, and Practice.${prac_id}.consignment_committed_cents == 72000"
            - "after trigger[0]: ImplantReservation.${resA_id}.status == RELEASED with consignment_credit_cents == 0 and consignment_liability_cents == 6000 (the liability collapses to the restocking fee)"
            - "after trigger[0]: ImplantLot.${lot_id}.quantity_on_hand is STILL 5, quantity_reserved == 1, available_quantity == 4 (5 == 4 + 1) - a return to the manufacturer never destroys cabinet units"
            - "after trigger[0]: Practice.${prac_id}.consignment_committed_cents == 24000 (only the HELD reservation B remains in the exposure sum; the RELEASED row drops out entirely, its 6000 fee included)"
            - "after trigger[1]: ImplantReservation.${resB_id}.status == SHORTED with restocking_fee_cents == 0, consignment_credit_cents == 0 and consignment_liability_cents == 30000 (the full subtotal is owed)"
            - "after trigger[1]: ImplantLot.${lot_id}.quantity_on_hand == 4, quantity_reserved == 0, available_quantity == 4 (4 == 4 + 0) - the unaccounted fixture leaves the cabinet, so on_hand is NOT conserved on this branch even though the three-way identity still is"
            - "after trigger[1]: Practice.${prac_id}.consignment_committed_cents == 0 (neither RELEASED nor SHORTED rows count toward exposure) while the SHORTED row's own 30000 liability remains readable on the reservation"

      - name: benefit_money_conservation_across_revision_loop
        conserved_quantity: "claim money: medical_allowed_cents + dental_allowed_cents + patient_responsibility_cents == SurgicalCase.total_charge_cents, plus the untouched Patient.dental_annual_remaining_cents ledger"
        grounds:
          - calculations.benefit_allocation
          - state_machines[BenefitDetermination.status] SUBMITTED -> PENDED -> SUBMITTED -> DENIED
          - entities.BenefitDetermination.fields.submission_count
          - entities.Patient.fields.dental_annual_remaining_cents
        forward_operation: "price and submit the determination, allocating 88888 medical / 11112 dental / 11110 patient against a 111110-cent case, then let the payer PEND it"
        compensating_operation: "resubmit out of PENDED (a full re-pricing against a fresh annual-maximum snapshot) and then record a DENIED payer response, which must zero both allowances and push the entire 111110 onto the patient WITHOUT touching the patient's annual dental remainder"
        drift_trap: |
          The denial is a compensation, not a deletion: zeroing medical_allowed_cents and
          dental_allowed_cents while leaving patient_responsibility_cents at 11110 breaks the money
          identity by 100000 cents. The mirror-image drift is on the ledger side - decrementing
          Patient.dental_annual_remaining_cents on submission (or failing to leave it alone on
          denial) burns 11112 cents of a benefit year the payer never paid; only the APPROVED branch
          may touch it. The revision loop adds a third trap: the resubmission must re-run the whole
          waterfall against a FRESH snapshot rather than reusing the frozen PENDED figures, and
          submission_count must reach 2, yet because nothing was approved in between the recomputed
          numbers must come out byte-identical - an implementation that decremented the remainder at
          submission time would produce a different second allocation and expose itself here.
        test_recipe:
          setup:
            - "logical clock 2026-09-11T10:00:00Z -> 2026-09-14T12:00:00Z"
            - "patient with BOTH plans active and dental_annual_remaining_cents 150000 -> route SPLIT"
            - "TRAUMA case (a MEDICAL_PRIMARY category, so primary_payer is MEDICAL) with total_charge_cents 111110, LOCAL_ONLY so no permit is needed"
            - "case evaluated, signed and VERIFIED (submission requires a VERIFIED evaluation)"
            - "two service lines of 55555 each, so the per-line rounding is visible (dental 5556 + 5556 == 11112, whereas rounding once at the end would give 11111)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Claims OMS", state_code: "OH", recovery_bay_count: 2 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Nia Author", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { author_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Val Verifier", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { verif_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Money", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80, medical_plan_active: true, dental_plan_active: true, dental_annual_remaining_cents: 150000 }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "TRAUMA", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 111110 }
              as: SchedulingCoordinator
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T12:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /surgical-cases/${case_id}/pre-anesthesia-evaluations"
              payload: { evaluator_staff_id: "${author_id}", asa_class_recorded: 2, airway_class_recorded: 2, comorbidity_count: 0, expected_case_version: "${case_v}" }
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/sign"
              payload: {}
              as: AnesthesiaCoordinator
              as_user_id: "${author_id}"
            - call: "POST /pre-anesthesia-evaluations/${eval_id}/day-of-verification"
              payload: { intent: "CLEAR", fasting_solids_last_at: "2026-09-14T05:00:00Z", fasting_clears_last_at: "2026-09-14T11:00:00Z", escort_confirmed: true, escort_name: "Ada Escort" }
              as: AnesthesiaCoordinator
              as_user_id: "${verif_id}"
            - call: "POST /benefit-determinations"
              payload: { case_id: "${case_id}", service_lines: [{ code: "D7140", charge_cents: 55555, benefit_class: "DENTAL" }, { code: "21445", charge_cents: 55555, benefit_class: "MEDICAL" }] }
              as: BenefitsSpecialist
              captures: { det_id: $.data.id }
            - call: "POST /benefit-determinations/${det_id}/submit"
              payload: {}
              as: BenefitsSpecialist
            - call: "POST /benefit-determinations/${det_id}/payer-response"
              payload: { outcome: "PENDED", pend_reason: "MEDICAL_NECESSITY_REVIEW" }
              as: BenefitsSpecialist
          trigger:
            - call: "POST /benefit-determinations/${det_id}/submit"
              payload: {}
              as: BenefitsSpecialist
            - call: "POST /benefit-determinations/${det_id}/payer-response"
              payload: { outcome: "DENIED", denial_reason: "NO_MEDICAL_NECESSITY" }
              as: BenefitsSpecialist
          assert:
            - "before the triggers: BenefitDetermination.${det_id}.route == SPLIT, primary_payer == MEDICAL, status == PENDED, submission_count == 1, pend_reason == MEDICAL_NECESSITY_REVIEW"
            - "before the triggers: medical_allowed_cents == 88888, dental_allowed_cents == 11112, patient_responsibility_cents == 11110 (88888 + 11112 + 11110 == 111110)"
            - "before the triggers: dental_annual_remaining_snapshot_cents == 150000 and Patient.${pat_id}.dental_annual_remaining_cents == 150000 (a submission never spends the annual maximum)"
            - "after trigger[0]: status == SUBMITTED, submission_count == 2, pend_reason == null, dental_annual_remaining_snapshot_cents == 150000 again"
            - "after trigger[0]: the recomputed allocation is unchanged - 88888 / 11112 / 11110 - because no APPROVED response has consumed any annual maximum in between"
            - "after trigger[1]: status == DENIED with denial_reason == NO_MEDICAL_NECESSITY, medical_allowed_cents == 0, dental_allowed_cents == 0, patient_responsibility_cents == 111110 (0 + 0 + 111110 == 111110)"
            - "after trigger[1]: Patient.${pat_id}.dental_annual_remaining_cents is STILL 150000 - the denial branch is explicitly forbidden from decrementing the ledger, and submission_count stays 2"
