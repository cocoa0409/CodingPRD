              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /wholesale/brands"
              payload: { name: "Brand J", contact_email: "j@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 150000, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S2", unit_price_cents: 1, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first trigger succeeds (201): available_cents 150000 >= subtotal 150000 exactly"
            - "second trigger is rejected with error_id == ERR_CREDIT_LIMIT_EXCEEDED: available headroom is 0, subtotal 1"
            - "CreditAccount.${ca_id}.available_cents == 0 after the accepted order's invoice is NOT yet issued — available reflects PLACED-order reservation of 150000"
      - name: territory_distance_boundary
        grounds:
          - calculations.territory_conflict_check
          - validations[priority=12]
        distinguishing_aspect: |
          The territory check uses strict < : a retailer whose storefront sits
          EXACTLY on the grant's radius circle (distance == radius_km) is NOT
          blocked, while one 0.001 km inside is rejected with
          ERR_TERRITORY_CONFLICT. Metric: haversine distance; endpoint: POST
          /orders — distinct metric and distinct gate from the credit boundary.
        test_recipe:
          setup:
            - "retailer A (holder) VERIFIED with credit account; retailer B VERIFIED with credit account, located at lat 41.0, lng -105.0"
            - "an ACTIVE brand (case pack 1, min 1000)"
            - "an ACTIVE ExclusivityGrant for the brand held by retailer A: center lat 40.0 lng -105.0, radius_km == haversine(40.0,-105.0 -> 41.0,-105.0) (about 110.574 km, computed in the same double-precision formula), window covering the default clock"
