            - call: "POST /water-treatment/equipment-packages/${pkg_d_id}/submit-for-review"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /water-treatment/equipment-packages/${pkg_d_id}/review-decision"
              payload: { decision: "APPROVE" }
