      - name: approving_an_exception_pending_transfer_reports_the_policy_carve_out_not_invalid_state
        claim_type: priority_conflict
        grounds:
          - validations[priority=13]
          - validations[priority=9]
          - errors[ERR_TRANSFER_POLICY_EXCEPTION_REQUIRED]
        distinguishing_aspect: |
          approve is not in the EXCEPTION_PENDING transition list, so priority 9
          would report 409 ERR_INVALID_STATE. §1.4 carves this exact pair out and
          hands it to priority 13, which must answer 422
          ERR_TRANSFER_POLICY_EXCEPTION_REQUIRED instead. The DEATH basis on a
          donor who is still ACTIVE is what forces the EXCEPTION_PENDING fork
          while leaving the cap at 1.00, so the 422 cannot be confused with a cap
          breach. After the PolicyCommittee grant, the identical approve call
          succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00.000Z."
            - "Donor A scored to certified_points 67.50 (5000000 cents RECEIVED, 2026-03-01) with donor_status ACTIVE, and Donor B scored to 0.00."
            - "One PointTransfer created with basis DEATH for 10.00 points, which lands in EXCEPTION_PENDING because the source donor is not DECEASED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Xan Source", email: "xan.source@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { xs_id: "$.data.id" }
            - call: "POST /athletics/donors/${xs_id}/gifts"
              payload: { gift_date: "2026-03-01T00:00:00.000Z", amount_cents: 5000000, designation: "ATHLETICS_ANNUAL", gift_status: "RECEIVED" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "POST /athletics/donors"
              payload: { full_name: "Xia Target", email: "xia.target@example.com", alumni_status: "NON_ALUMNUS", entity_type: "INDIVIDUAL" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { xt_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations"
              payload: { cycle_year: 2026, cutoff_date: "2026-06-30T23:59:59.999Z", dispute_window_end: "2026-09-30T00:00:00.000Z" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { xr_id: "$.data.id" }
            - call: "POST /athletics/point-recalculations/${xr_id}/run"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
            - call: "GET /athletics/donors/${xs_id}"
              payload: {}
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { xs_v: "$.data.version" }
            - call: "POST /athletics/point-transfers"
              payload: { source_donor_id: "${xs_id}", recipient_donor_id: "${xt_id}", basis: "DEATH", points_amount: 10.00, expected_source_donor_version: "${xs_v}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { xtr_id: "$.data.id" }
          trigger:
            - call: "POST /athletics/point-transfers/${xtr_id}/approve"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
            - call: "POST /athletics/point-transfers/${xtr_id}/policy-decision"
              payload: { decision: "GRANT", note: "Estate documentation received ahead of the status change" }
              as: PolicyCommittee
              as_user_id: "policy-1"
            - call: "POST /athletics/point-transfers/${xtr_id}/approve"
              payload: {}
              as: PointsCertifier
              as_user_id: "certifier-1"
          assert:
            - "Before the trigger: PointTransfer.${xtr_id}.status == \"EXCEPTION_PENDING\", exception_required == true, transfer_pct_cap == 1.00, max_transferable_points == 67.50"
            - "First approve: HTTP 422 with error.code == \"ERR_TRANSFER_POLICY_EXCEPTION_REQUIRED\" (NOT 409 ERR_INVALID_STATE, the priority 9 carve-out)"
            - "After the rejection: status is still \"EXCEPTION_PENDING\", Donor.${xs_id}.certified_points == 67.50 and Donor.${xt_id}.transferred_points_in == 0.00"
            - "policy-decision GRANT: HTTP 200, status == \"REQUESTED\", exception_granted_by_user_id == \"policy-1\", and NO points have moved yet (Donor.${xs_id}.certified_points still 67.50)"
            - "Second approve: HTTP 200 with status == \"APPROVED\" and approved_by_user_id == \"certifier-1\""
            - "Donor.${xs_id}.transferred_points_out == 10.00 with certified_points == 57.50, and Donor.${xt_id}.transferred_points_in == 10.00 with certified_points == 10.00"

      - name: picking_a_stale_slot_reports_event_slots_stale_not_invalid_state
        claim_type: priority_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=9]
          - errors[ERR_EVENT_SLOTS_STALE]
        distinguishing_aspect: |
          A pick on a slot in slot_status STALE is not a listed transition, so
          priority 9 would say 409 ERR_INVALID_STATE; §1.4 carves out the case
          where the parent event is in SLOTS_STALE and requires priority 12's
          ERR_EVENT_SLOTS_STALE instead. Staleness is induced by certifying a
          SECOND recalculation whose cycle_year is different and whose ranking
