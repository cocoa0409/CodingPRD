            - "Offer.${offB}.deadline_at == 2026-07-14T16:00:00Z (BUSINESS_HOURS: 1h Friday + 8h Monday + 7h Tuesday)"
            - "${dlA} != ${dlB}"
            - "${snapA} == 16 and ${snapB} == 16 (school override pinned over the 72h season default)"

  # ---------------------------------------------------------------------------
  # Rule 2: combinatorial_formula — two DIFFERENT modes: (a) tiered/conditional
  # nested-min formula vs (b) nested rounding where rounding order is pinned
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: stipend_tiered_formula_mode_a
        grounds:
          - calculations.stipend_amount
          - entities.Offer.fields.stipend_amount_cents
        distinguishing_aspect: |
          Mode (a): four inputs (region base, tiered distance bonus,
          CORE+METRO conditional surcharge, season-independent cap) with
          non-linear interaction — min(400000, 300000 + 150000 + 50000) =
          400000; the cap binds and the conditional surcharge fires.
        test_recipe:
          setup:
            - "Season (threshold 10, budget 10000000) with CORE+METRO school; candidate relocating 1600 miles; application driven to DECISION_PENDING; season at OFFER_PERIOD; clock 2026-07-06T10:00:00Z"
          setup_api_calls:
            - call: "POST /campus-recruiting/seasons"
              payload: { name: "S1", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 10, stipend_budget_cents: 10000000 }
              as: RecruitingAdmin
              captures: { sid: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/school-targets"
              payload: { school_name: "MetroU", tier: "CORE", application_cap: 10, stipend_region: "METRO" }
              as: RecruitingAdmin
              captures: { st_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-15T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/candidates"
              payload: { email: "a@x.com", full_name: "Candidate A", expected_graduation_date: "2027-05-15T00:00:00Z" }
              as: Anonymous
              captures: { cand_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/applications"
              payload: { candidate_id: "${cand_id}", school_target_id: "${st_id}", relocation_distance_miles: 1600 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { app_id: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/applications/${app_id}/screen"
              payload: { decision: "SHORTLIST" }
              as: Recruiter
            - call: "POST /campus-recruiting/seasons/${sid}/employees"
              payload: { full_name: "Eve", email: "ev@co.com", calibrated: true }
              as: RecruitingAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/interview-days"
              payload: { window_start_at: "2026-06-08T09:00:00Z", window_end_at: "2026-06-08T17:00:00Z", capacity: 5 }
              as: Recruiter
              captures: { day_id: $.data.id }
            - call: "POST /campus-recruiting/interview-days/${day_id}/interview-slots"
              payload: { application_id: "${app_id}", evaluator_id: "${ev_id}", start_at: "2026-06-08T10:00:00Z", end_at: "2026-06-08T11:00:00Z" }
              as: Recruiter
              captures: { slot_id: $.data.id }
            - call: "POST /campus-recruiting/interview-slots/${slot_id}/evaluations"
              payload: { score: 5, recommendation: "STRONG_HIRE" }
              as: Evaluator
              as_user_id: "${ev_id}"
            - call: "POST /campus-recruiting/seasons/${sid}/advance"
              payload: {}
              as: RecruitingAdmin
            - call: "POST /campus-recruiting/applications/${app_id}/offers"
              payload: { weekly_rate_cents: 150000, duration_weeks: 12 }
              as: Recruiter
              captures: { off_id: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T10:00:00Z" }
              as: RecruitingAdmin
          trigger:
            - call: "POST /campus-recruiting/offers/${off_id}/extend"
              payload: {}
              as: Recruiter
              captures: { stip: $.data.stipend_amount_cents }
          assert:
            - "Offer.${off_id}.stipend_amount_cents == 400000 (min(400000, 300000 METRO base + 150000 distance>=1500 + 50000 CORE+METRO surcharge) — cap binds)"
            - "${stip} == 400000"
      - name: offer_total_comp_rounding_order_mode_b
        grounds:
          - calculations.offer_total_comp
          - entities.Offer.fields.total_comp_cents
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode than stipend's mode (a)):
          per-component rounding pinned — round(100004*1*1.10)=110004 plus
          round(14*1.10)=15 sums to 110019, while the equally valid
          sum-then-round reading round((100004+14)*1.10) yields 110020.
        test_recipe:
          setup:
            - "Season (threshold 10) with REGIONAL TARGET school; application driven to DECISION_PENDING; season at OFFER_PERIOD"
