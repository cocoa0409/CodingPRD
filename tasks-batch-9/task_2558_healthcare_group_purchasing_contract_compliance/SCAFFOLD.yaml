# =============================================================================
# PRD Benchmark Scaffold — Healthcare Group Purchasing & Contract Compliance
# Generated per skills/prd-bench-scaffold-generator/SKILL.md §1.0–§1.7
# Sibling files: SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8), SCAFFOLD_CORNER_DESIGN.yaml (§1.9)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2558. Healthcare Group Purchasing & Contract Compliance (Vizient group purchasing
  organization): contract portfolio with tiered pricing based on committed volume and
  compliance percentage, member commitment election and tier requalification, item
  cross-reference between contract catalogs and member item masters, price activation,
  letters of participation and distributor file loads, compliance measurement from
  purchase data with off-contract leakage reporting, custom contracting and local
  pricing exceptions, administrative fee collection and member share distribution,
  clinical evidence review before a category conversion

domain_name: healthcare-group-purchasing-contract-compliance
api_prefix: /gpo

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.4 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # flat: eleven peer entities linked exclusively by FK fields carried in request
  # bodies. Every child is discovered through a FILTERED top-level list rather than a
  # nested read (`/contract-items?contract_id=`, `/clinical-evidence-reviews?contract_id=`,
  # `/admin-fee-distributions?contract_id=`, `/compliance-measurements?commitment_id=`,
  # `/purchase-lines?distributor_file_id=`, `/commitments?member_id=&contract_id=`,
  # `/item-cross-references?member_id=&contract_item_id=`, `/price-activations?commitment_id=`,
  # `/distributor-files?member_id=&contract_id=`), which is the FK reverse-reachability
  # surface. The single nested route in the whole API is the catalog create
  # `POST /gpo/contracts/{contract_id}/items`; every other mutation targets a top-level
  # collection and names its parents in the body.

  state_machine_shape: parallel
  # Commitment carries TWO independent state dimensions on the same row
  # (election_status × lop_status); each dimension is itself cyclic
  # (ACTIVE→REQUAL_REVIEW→ACTIVE, and ISSUED→…→VOID→ISSUED). ClinicalEvidenceReview
  # is cyclic with a bounded revision counter. PriceActivation branches on
  # activation_type (TIER_PRICE: DRAFT→ACTIVE; LOCAL_EXCEPTION:
  # DRAFT→ENDORSED→APPROVED→ACTIVE) with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Contract→ContractItem, DistributorFile→PurchaseLine
    - many_to_many         # ItemCrossReference joins Member.item_master ↔ ContractItem
    - self_referential     # PriceActivation.superseded_by_activation_id -> PriceActivation.id
    - cross_aggregate      # PriceActivation spans Commitment (member side) and ContractItem (supplier side)

  role_model: segregation_of_duties
  # Two SoD gates keyed on X-User-ID: (1) the ClinicalReviewer who submitted an
  # evidence review may not endorse it; (2) the ContractManager who endorsed a
  # LOCAL_EXCEPTION price activation may not approve it. Layered on peer-role
  # ownership (MemberMaterialsManager is entity_backed and member-scoped).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 11 entities / 58 endpoints / 44 error codes / 8 calculations (3 carrying
  # divergent variants) / 9 state machines across 8 entities. The surface is above
  # the Expert band because the scenario itself carries nine coupled workflows
  # (portfolio, election, cross-reference, activation, LOP, file load, measurement,
  # custom pricing, fee distribution, evidence review) and each one is load-bearing
  # for at least one §0.5 rule; every read endpoint beyond the FK reverse-reachability
  # minimum was removed rather than kept for symmetry.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Contract
    parent: null
    common_fields: true
    description: "GPO portfolio contract with an embedded tier ladder and an embedded holdback ladder. Configuration + lifecycle resource."
    fields:
      - name: contract_code
        type: string
        source: input
        description: "Human contract identifier, e.g. 'CTR-CARDIO-001'."
        constraints: "1..40 chars; globally unique (case-sensitive exact match)"
      - name: supplier_name
        type: string
        source: input
        description: "Awarded supplier name."
        constraints: "1..120 chars"
      - name: category_code
        type: string
        source: input
        description: "Clinical spend category the contract governs, e.g. 'CARDIO_STENT'."
        constraints: "1..40 chars"
      - name: effective_from
        type: string
        source: input
        description: "Contract term start, inclusive, ISO date YYYY-MM-DD."
        constraints: "valid ISO date"
      - name: effective_to
        type: string
        source: input
        description: "Contract term end, inclusive, ISO date YYYY-MM-DD."
        constraints: "valid ISO date; MUST be strictly after effective_from"
      - name: requires_clinical_review
        type: boolean
        source: input
        default: true
        description: "When true, the contract cannot be activated until an ENDORSED ClinicalEvidenceReview with conversion_recommendation == CONVERT exists for it."
      - name: admin_fee_bps
        type: integer
        source: input
        description: "Administrative fee rate in basis points applied to each ON_CONTRACT purchase line's extended cost."
        constraints: "0 <= admin_fee_bps <= 500"
      - name: member_share_bps
        type: integer
        source: input
        description: "Share of the net fee pool distributed to members in basis points; the remainder is retained by the GPO."
        constraints: "0 <= member_share_bps <= 10000"
      - name: share_basis
        type: enum
        source: input
        default: COLLECTED
        description: "Which fee pool this contract distributes from: ACCRUAL distributes the full fee earned in the period, COLLECTED distributes only what the supplier actually remitted. Selects which of the two AdminFeeDistribution distribute hops is legal (§1.2) and which variant of calculations.distribution_holdback applies."
        constraints: "one of {ACCRUAL, COLLECTED}"
      - name: leakage_alert_threshold_pct
        type: number
        source: input
        default: 15.00
        description: "Year-to-date off-contract leakage percentage above which a Commitment is flagged and its Member is watchlisted."
        constraints: "0.00 <= value <= 100.00, 2 decimal places"
      - name: tiers
        type: array
        source: input
        description: "Tier ladder. Array of objects {tier_code: string, min_committed_volume_units: integer, min_compliance_pct: number, discount_bps: integer}."
        constraints: >-
          1..5 entries; tier_code unique within the contract (a repeat is ERR_DUPLICATE_TIER_CODE, priority 15);
          exactly one entry MUST have
          min_committed_volume_units == 0 AND min_compliance_pct == 0.00 (the default tier);
          discount_bps in 0..5000; when entries are sorted by min_committed_volume_units ASC,
          discount_bps MUST be strictly increasing; violation -> ERR_INVALID_TIER_LADDER
      - name: holdback_tiers
        type: array
        source: input
        description: "GPO holdback ladder keyed on the GROSS fee pool. Array of objects {min_gross_pool_cents: integer, holdback_bps: integer}."
        constraints: >-
          1..4 entries; min_gross_pool_cents unique and >= 0; holdback_bps in 0..1000;
          when sorted by min_gross_pool_cents ASC, holdback_bps MUST be non-decreasing;
          violation -> ERR_INVALID_HOLDBACK_LADDER
      - name: default_tier_code
        type: string
        source: computed
        description: "tier_code of the single tiers[] entry whose min_committed_volume_units == 0 AND min_compliance_pct == 0.00. Recomputed only at creation."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Contract lifecycle state."
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED}"
      - name: evidence_endorsed
        type: boolean
        source: computed
        default: false
        description: "True iff at least one ClinicalEvidenceReview with contract_id == this contract has status == ENDORSED. Recomputed on every evidence-review endorse/reject."
      - name: active_commitment_count
        type: integer
        source: computed
        default: 0
        description: "Count of Commitment rows with contract_id == this contract AND election_status IN {ACTIVE, REQUAL_REVIEW}. Recomputed on LOP countersign, LOP void and commitment terminate."

  - name: ContractItem
    parent: null
    common_fields: true
    description: "One line of the supplier's contract catalog."
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract whose catalog carries this item."
      - name: vendor_item_number
        type: string
        source: input
        description: "Supplier catalog number."
        constraints: "1..40 chars; unique within (contract_id, vendor_item_number)"
      - name: item_description
        type: string
        source: input
        description: "Catalog description text."
        constraints: "1..200 chars"
      - name: uom
        type: enum
        source: input
        description: "Contract unit of measure."
        constraints: "one of {EA, BX, CS}"
      - name: units_per_uom
        type: integer
        source: input
        description: "Eaches contained in one contract UOM; descriptive only, never used in pricing."
        constraints: ">= 1"
      - name: base_price_cents
        type: integer
        source: input
        description: "Undiscounted contract price per contract UOM, in cents."
        constraints: "> 0"
      - name: floor_price_cents
        type: integer
        source: input
        description: "Hard price floor per contract UOM, in cents; no activation may price below it."
        constraints: ">= 0 AND <= base_price_cents"
      - name: requires_evidence
        type: boolean
        source: input
        default: false
        description: "When true, no PriceActivation for this item may reach ACTIVE unless the parent contract has an ENDORSED ClinicalEvidenceReview with conversion_recommendation == CONVERT (category-conversion gate)."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Catalog line state."
        constraints: "one of {ACTIVE, DELISTED}"
      - name: active_activation_count
        type: integer
        source: computed
        default: 0
        description: "Count of PriceActivation rows with contract_item_id == this item AND status == ACTIVE, across all commitments. Recomputed at most once per triggering transition, even when several activations changed in that transition."

  - name: Member
    parent: null
    common_fields: true
    description: "Participating health system member, and the identity backing the MemberMaterialsManager role."
    fields:
      - name: member_code
        type: string
        source: input
        description: "Member identifier, e.g. 'MB-001'."
        constraints: "1..40 chars; globally unique"
      - name: name
        type: string
        source: input
        description: "Member legal name."
        constraints: "1..120 chars"
      - name: aggregation_group_code
        type: string
        source: input
        description: "Aggregation group used for reporting; descriptive only."
        constraints: "1..40 chars"
      - name: item_master
        type: array
        source: input
        description: "Member item master. Array of objects {member_item_number: string, description: string, units_per_uom: integer}."
        constraints: "1..50 entries; member_item_number unique within the array"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Membership state."
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: watchlist_status
        type: enum
        source: system
        default: NONE
        description: "Set to WATCHLIST by the leakage cascade when any of this member's commitments raises leakage_flag; returned to NONE only when no commitment of this member has leakage_flag == true."
        constraints: "one of {NONE, WATCHLIST}"
      - name: fee_credit_balance_cents
        type: integer
        source: system
        default: 0
        description: "Cumulative administrative-fee share credited to this member; debited by an exact amount when a distribution is reversed."
        constraints: ">= 0"

  - name: ClinicalEvidenceReview
    parent: null
    common_fields: true
    description: "Clinical evidence dossier reviewed before a category conversion is allowed. Cyclic with a bounded revision counter."
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract whose category conversion is under review."
      - name: clinical_efficacy_score
        type: number
        source: input
        description: "Efficacy evidence score."
        constraints: "0.00 <= value <= 10.00, at most 2 decimal places"
      - name: safety_score
        type: number
        source: input
        description: "Safety evidence score."
        constraints: "0.00 <= value <= 10.00, at most 2 decimal places"
      - name: supply_resilience_score
        type: number
        source: input
        description: "Supply-resilience evidence score."
        constraints: "0.00 <= value <= 10.00, at most 2 decimal places"
      - name: summary
        type: string
        source: input
        default: ""
        description: "Free-text reviewer summary."
        constraints: "0..500 chars"
      - name: weighted_score
        type: number
        source: computed
        description: "Output of calculations.evidence_weighted_score, 2 decimal places."
      - name: conversion_recommendation
        type: enum
        source: computed
        description: "CONVERT iff weighted_score >= 7.00, else DO_NOT_CONVERT."
        constraints: "one of {CONVERT, DO_NOT_CONVERT}"
      - name: status
        type: enum
        source: system
        default: UNDER_REVIEW
        description: "Review state; UNDER_REVIEW→REVISION_REQUESTED→UNDER_REVIEW is a permitted cycle."
        constraints: "one of {UNDER_REVIEW, REVISION_REQUESTED, ENDORSED, REJECTED}"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: "Number of completed revision cycles; incremented on request-revision. A request-revision attempt when revision_round == 2 is rejected."
        constraints: "0 <= revision_round <= 2"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ClinicalReviewer who created the review, refreshed to the resubmitting reviewer's id on every resubmit."
      - name: endorsed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ClinicalReviewer who endorsed; MUST differ from submitted_by_user_id."

  - name: Commitment
    parent: null
    common_fields: true
    description: >-
      A member's tier election on a contract. Carries TWO independent state dimensions on
      the same row: election_status (the commercial lifecycle, cyclic through
      REQUAL_REVIEW) and lop_status (the letter-of-participation document lifecycle,
      cyclic through VOID). It also carries the year-to-date purchase ledger that the
      file-load cascade debits and the file-reversal compensation restores.
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the electing member. MUST equal X-User-ID on creation."
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract being committed to."
      - name: elected_tier_code
        type: string
        source: input
        description: "tier_code the member elects at signing; MUST exist in Contract.tiers."
      - name: committed_volume_units
        type: integer
        source: input
        description: "Annual volume the member commits to, in contract UOM units."
        constraints: "> 0; MUST be >= the elected tier's min_committed_volume_units"
      - name: effective_from
        type: string
        source: input
        description: "Commitment start date, inclusive, ISO date YYYY-MM-DD; MUST fall inside [Contract.effective_from, Contract.effective_to]."
      - name: election_status
        type: enum
        source: system
        default: ELECTED
        description: "Commercial lifecycle dimension. Cycle: ACTIVE→REQUAL_REVIEW→ACTIVE."
        constraints: "one of {ELECTED, ACTIVE, REQUAL_REVIEW, TERMINATED}"
      - name: lop_status
        type: enum
        source: system
        default: NOT_ISSUED
        description: "Letter-of-participation document dimension, independent of election_status. Cycle: ISSUED→(SIGNED)→VOID→ISSUED."
        constraints: "one of {NOT_ISSUED, ISSUED, SIGNED, COUNTERSIGNED, VOID}"
      - name: signer_name
        type: string
        source: system
        default: null
        description: "Name captured when the member signed the letter of participation."
      - name: current_tier_code
        type: string
        source: system
        default: null
        description: "Tier actually in force. Null until LOP countersign sets it to elected_tier_code; thereafter overwritten by the requalification cascade with the finalized measurement's qualified_tier_code."
      - name: requalification_round
        type: integer
        source: system
        default: 0
        description: "Number of finalized requalifications applied to this commitment."
      - name: last_final_compliance_pct
        type: number
        source: system
        default: null
        description: "compliance_pct of the most recently FINAL ComplianceMeasurement for this commitment, 2 decimal places."
      - name: ytd_on_contract_spend_cents
        type: integer
        source: system
        default: 0
        description: "Running sum of extended_cost_cents over ON_CONTRACT purchase lines loaded for this member+contract; decremented by exactly the loaded amount when a file is reversed."
        constraints: ">= 0"
      - name: ytd_total_category_spend_cents
        type: integer
        source: system
        default: 0
        description: "Running sum of extended_cost_cents over ON_CONTRACT + OFF_CONTRACT_LEAKAGE + UNMATCHED purchase lines loaded for this member+contract; conserved quantity of the file-reversal invariant."
        constraints: ">= 0"
      - name: ytd_measured_volume_units
        type: integer
        source: system
        default: 0
        description: "Running sum of contract_units over ON_CONTRACT purchase lines loaded for this member+contract; conserved quantity of the volume-units invariant."
        constraints: ">= 0"
      - name: ytd_leakage_pct
        type: number
        source: computed
        default: 0.00
        description: "round_half_up((ytd_total_category_spend_cents - ytd_on_contract_spend_cents) * 100 / ytd_total_category_spend_cents, 2), recomputed by the load cascade and by the reversal compensation; 0.00 when the denominator is 0. This is the rate the leakage alert is keyed on."
        constraints: "0.00..100.00, 2 decimal places"
      - name: leakage_flag
        type: boolean
        source: system
        default: false
        description: "Raised by the load cascade when ytd_leakage_pct exceeds Contract.leakage_alert_threshold_pct (strictly greater-than); lowered by the reversal compensation when it no longer does."

  - name: ItemCrossReference
    parent: null
    common_fields: true
    description: "Junction row mapping one member item-master number to one contract catalog item, with the UOM conversion factor used to convert purchased quantities into contract units."
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member whose item master is being mapped."
      - name: contract_item_id
        type: string
        source: input
        description: "FK -> ContractItem.id; the contract catalog line being mapped to."
      - name: member_item_number
        type: string
        source: input
        description: "The member-side item number; MUST appear in Member.item_master[].member_item_number."
        constraints: "1..40 chars"
      - name: match_type
        type: enum
        source: input
        description: "Quality of the mapping."
        constraints: "one of {EXACT, EQUIVALENT, MANUAL}"
      - name: conversion_factor
        type: number
        source: input
        description: "Contract units delivered by one member-item unit; purchased quantity_units is multiplied by this to obtain contract_units."
        constraints: "> 0, at most 4 decimal places"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Cross-reference approval state."
        constraints: "one of {PROPOSED, APPROVED, REJECTED}"
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ContractManager who approved the mapping."
      - name: reject_note
        type: string
        source: system
        default: null
        description: "Reason recorded when the mapping was rejected."

  - name: PriceActivation
    parent: null
    common_fields: true
    description: >-
      An activated price for one (commitment, contract item) over a closed date interval.
      activation_type branches the lifecycle: TIER_PRICE is a GPO-driven contract price
      (DRAFT→ACTIVE), LOCAL_EXCEPTION is a member-requested custom price that must be
      endorsed and then approved by two different ContractManagers
      (DRAFT→ENDORSED→APPROVED→ACTIVE). Self-referential via superseded_by_activation_id.
    fields:
      - name: commitment_id
        type: string
        source: input
        description: "FK -> Commitment.id; the commitment the price applies to."
      - name: contract_item_id
        type: string
        source: input
        description: "FK -> ContractItem.id; the catalog line being priced. Its contract_id MUST equal the commitment's contract_id."
      - name: activation_type
        type: enum
        source: input
        description: "Pricing track."
        constraints: "one of {TIER_PRICE, LOCAL_EXCEPTION}"
      - name: requested_price_cents
        type: integer
        source: input
        default: null
        description: "Member-requested custom price in cents. REQUIRED when activation_type == LOCAL_EXCEPTION, FORBIDDEN when activation_type == TIER_PRICE."
        constraints: "> 0 when present"
      - name: effective_from
        type: string
        source: input
        description: "First day the price applies, inclusive, ISO date YYYY-MM-DD."
      - name: effective_to
        type: string
        source: input
        description: "Last day the price applies, INCLUSIVE, ISO date YYYY-MM-DD; MUST be >= effective_from and the whole interval MUST sit inside [Contract.effective_from, Contract.effective_to]."
      - name: tier_code_at_activation
        type: string
        source: system
        description: "Commitment.current_tier_code observed when this row's price was derived (Contract.default_tier_code when current_tier_code is null)."
      - name: computed_price_cents
        type: integer
        source: computed
        description: "Output of calculations.tier_activated_price, in cents."
      - name: price_clamped
        type: boolean
        source: computed
        default: false
        description: "True iff the pre-floor candidate price was strictly below ContractItem.floor_price_cents and was raised to the floor."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Activation state; the reachable set depends on activation_type."
        constraints: "one of {DRAFT, ENDORSED, APPROVED, ACTIVE, DENIED, SUPERSEDED}"
      - name: endorsed_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ContractManager who endorsed a LOCAL_EXCEPTION."
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "X-User-ID of the ContractManager who approved a LOCAL_EXCEPTION; MUST differ from endorsed_by_user_id."
      - name: superseded_by_activation_id
        type: string
        source: system
        default: null
        description: "FK -> PriceActivation.id; self-referential pointer set on the losing row when the requalification cascade replaces it. Null unless status == SUPERSEDED."
      - name: replaces_activation_id
        type: string
        source: system
        default: null
        description: "FK -> PriceActivation.id; inverse pointer set on a cascade-created replacement row."
      - name: origin
        type: enum
        source: system
        default: REQUEST
        description: "REQUEST for rows created through POST /gpo/price-activations, REQUALIFICATION_CASCADE for rows synthesized by the finalize cascade."
        constraints: "one of {REQUEST, REQUALIFICATION_CASCADE}"
      - name: deny_note
        type: string
        source: system
        default: null
        description: "Reason recorded when a LOCAL_EXCEPTION was denied."

  - name: DistributorFile
    parent: null
    common_fields: true
    description: "One distributor sales-tracing file covering a HALF-OPEN period [period_start, period_end) for one (member, contract, distributor) triple."
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the purchasing member the file reports on."
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract whose category the file reports on."
      - name: distributor_code
        type: string
        source: input
        description: "Distributor identifier, e.g. 'D-CARD'."
        constraints: "1..40 chars"
      - name: period_start
        type: string
        source: input
        description: "First day covered, INCLUSIVE, ISO date YYYY-MM-DD."
      - name: period_end
        type: string
        source: input
        description: "Day after the last day covered, EXCLUSIVE, ISO date YYYY-MM-DD; MUST be strictly after period_start."
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: "File load state. PARTIALLY_LOADED means at least one line was accepted and at least one was rejected; REJECTED means zero lines were accepted."
        constraints: "one of {RECEIVED, VALIDATING, LOADED, PARTIALLY_LOADED, REJECTED, REVERSED}"
      - name: line_count
        type: integer
        source: computed
        default: 0
        description: "Number of PurchaseLine rows created from the submitted lines[] payload."
      - name: accepted_line_count
        type: integer
        source: computed
        default: 0
        description: "Number of lines with reject_reason == NONE after validation."
      - name: rejected_line_count
        type: integer
        source: computed
        default: 0
        description: "Number of lines with reject_reason != NONE after validation."
      - name: loaded_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the file was loaded, ISO 8601 UTC with three fractional digits."
      - name: reverse_note
        type: string
        source: system
        default: null
        description: "Reason recorded when the load was reversed."

  - name: PurchaseLine
    parent: null
    common_fields: false
    description: "One purchase record inside a distributor file. Append-only: created with the file, never updated by any client request; classification and contract_units are written only by the load cascade and cleared only by the reversal compensation."
    fields:
      - name: distributor_file_id
        type: string
        source: input
        description: "FK -> DistributorFile.id; the file this line arrived in."
      - name: member_item_number
        type: string
        source: input
        description: "Member-side item number as reported by the distributor; need NOT exist in Member.item_master (an unknown number classifies UNMATCHED)."
        constraints: "1..40 chars"
      - name: quantity_units
        type: integer
        source: input
        description: "Quantity purchased in member-item units."
        constraints: ">= 0"
      - name: unit_price_paid_cents
        type: integer
        source: input
        description: "Price actually paid per member-item unit, in cents."
        constraints: ">= 0"
      - name: purchase_date
        type: string
        source: input
        description: "Purchase date, ISO date YYYY-MM-DD."
      - name: extended_cost_cents
        type: integer
        source: computed
        description: "quantity_units * unit_price_paid_cents, computed at file creation."
      - name: contract_units
        type: integer
        source: computed
        default: 0
        description: "round_half_up(quantity_units * ItemCrossReference.conversion_factor) written by the load cascade for ON_CONTRACT and OFF_CONTRACT_LEAKAGE lines; 0 for UNMATCHED, rejected, unclassified and reversed lines."
      - name: matched_vendor_item_number
        type: string
        source: system
        default: null
        description: "ContractItem.vendor_item_number reached through the APPROVED cross-reference at load time; null when unmatched, rejected or reversed. Deliberately a value copy, not a foreign key, because distributor data is keyed by item numbers."
      - name: classification
        type: enum
        source: system
        default: UNCLASSIFIED
        description: "Load-time classification driving every compliance and fee calculation."
        constraints: "one of {UNCLASSIFIED, ON_CONTRACT, OFF_CONTRACT_LEAKAGE, UNMATCHED}"
      - name: reject_reason
        type: enum
        source: system
        default: NONE
        description: "Set during validation; rejected lines are excluded from every sum and from classification."
        constraints: "one of {NONE, DATE_OUT_OF_PERIOD, ZERO_QUANTITY}"

  - name: ComplianceMeasurement
    parent: null
    common_fields: true
    description: "A compliance and volume measurement for one commitment over a HALF-OPEN purchase-date period. The same row carries both the preliminary and the final result so their divergence is directly observable."
    fields:
      - name: commitment_id
        type: string
        source: input
        description: "FK -> Commitment.id; the commitment being measured."
      - name: period_start
        type: string
        source: input
        description: "First purchase date included, INCLUSIVE, ISO date YYYY-MM-DD."
      - name: period_end
        type: string
        source: input
        description: "Purchase date bound, EXCLUSIVE, ISO date YYYY-MM-DD; MUST be strictly after period_start."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Measurement state. SUPERSEDED is written when a newer measurement is created for the same (commitment_id, period_start, period_end)."
        constraints: "one of {DRAFT, PRELIMINARY, FINAL, SUPERSEDED}"
      - name: on_contract_spend_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of extended_cost_cents over included ON_CONTRACT lines."
      - name: leakage_spend_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of extended_cost_cents over included OFF_CONTRACT_LEAKAGE lines."
      - name: unmatched_spend_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of extended_cost_cents over included UNMATCHED lines."
      - name: total_category_spend_cents
        type: integer
        source: computed
        default: 0
        description: "Denominator actually used; its composition differs between the PRELIMINARY and FINAL variants."
      - name: compliance_pct
        type: number
        source: computed
        default: 0.00
        description: "on_contract_spend_cents * 100 / total_category_spend_cents, 2 decimal places, round_half_up; 0.00 when total_category_spend_cents == 0."
      - name: preliminary_compliance_pct
        type: number
        source: system
        default: null
        description: "compliance_pct as computed by the PRELIMINARY variant, retained unchanged when the row is finalized so the two variants can be compared on one row."
      - name: measured_volume_units
        type: integer
        source: computed
        default: 0
        description: "Sum of contract_units over included ON_CONTRACT lines."
      - name: qualified_tier_code
        type: string
        source: computed
        default: null
        description: "Output of calculations.tier_requalification for this measurement."
      - name: basis_empty
        type: boolean
        source: computed
        default: false
        description: "True iff total_category_spend_cents == 0 for the variant just computed."
      - name: computed_variant
        type: enum
        source: system
        default: null
        description: "Which variant produced the currently stored numbers."
        constraints: "one of {PRELIMINARY, FINAL}"

  - name: AdminFeeDistribution
    parent: null
    common_fields: true
    description: "Administrative fee accrual, collection and member-share distribution for one contract and one HALF-OPEN period."
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract whose admin fee is being settled."
      - name: period_start
        type: string
        source: input
        description: "First purchase date included, INCLUSIVE, ISO date YYYY-MM-DD."
      - name: period_end
        type: string
        source: input
        description: "Purchase date bound, EXCLUSIVE, ISO date YYYY-MM-DD; MUST be strictly after period_start."
      - name: status
        type: enum
        source: system
        default: ACCRUED
        description: "Settlement state."
        constraints: "one of {ACCRUED, COLLECTED, DISTRIBUTED, REVERSED}"
      - name: accrued_fee_cents
        type: integer
        source: computed
        description: "Output of calculations.admin_fee_accrual, computed once at creation and never recomputed."
      - name: collected_fee_cents
        type: integer
        source: input
        default: null
        description: "Amount actually collected from the supplier, recorded by POST /gpo/admin-fee-distributions/{distribution_id}/collect."
        constraints: ">= 0 AND <= accrued_fee_cents"
      - name: basis
        type: enum
        source: input
        default: null
        description: "Variant selector supplied at distribute time; decides whether the gross pool is accrued_fee_cents or collected_fee_cents."
        constraints: "one of {ACCRUAL, COLLECTED}"
      - name: gross_pool_cents
        type: integer
        source: computed
        default: 0
        description: "accrued_fee_cents when basis == ACCRUAL, collected_fee_cents when basis == COLLECTED."
      - name: holdback_bps_applied
        type: integer
        source: computed
        default: 0
        description: "holdback_bps of the Contract.holdback_tiers entry selected on the GROSS pool."
      - name: holdback_cents
        type: integer
        source: computed
        default: 0
        description: "round_half_up(gross_pool_cents * holdback_bps_applied / 10000)."
      - name: net_pool_cents
        type: integer
        source: computed
        default: 0
        description: "gross_pool_cents - holdback_cents."
      - name: member_pool_cents
        type: integer
        source: computed
        default: 0
        description: "floor(net_pool_cents * Contract.member_share_bps / 10000)."
      - name: member_shares
        type: array
        source: computed
        description: "Per-member allocation. Array of objects {member_id: string, commitment_id: string, weight_cents: integer, share_cents: integer} where weight_cents is that commitment's ytd_on_contract_spend_cents, ordered by share_cents DESC then Member.created_at ASC."
      - name: member_share_total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of member_shares[].share_cents; equals member_pool_cents whenever the eligible set is non-empty."
      - name: undistributed_cents
        type: integer
        source: computed
        default: 0
        description: "member_pool_cents when the eligible set is empty, otherwise 0; after a reversal it holds the whole collected/accrued gross pool."
      - name: gpo_retained_cents
        type: integer
        source: computed
        default: 0
        description: "gross_pool_cents - member_share_total_cents - undistributed_cents; the conservation identity of the fee invariant."
      - name: reverse_note
        type: string
        source: system
        default: null
        description: "Reason recorded when the distribution was reversed."

# =============================================================================
# §1.2 State Machine Table
# Nine machines over eight entities. Commitment carries two independent
# dimensions on one row (election_status × lop_status).
# =============================================================================
state_machines:

  - entity: Contract
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUSPENDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /gpo/contracts/{contract_id}/activate"
        actor: ContractManager
        preconditions:
          - "Contract.status == DRAFT"
          - "IF Contract.requires_clinical_review == true THEN Contract.evidence_endorsed == true AND at least one ClinicalEvidenceReview with contract_id == Contract.id has status == ENDORSED AND conversion_recommendation == CONVERT, else ERR_CLINICAL_REVIEW_NOT_ENDORSED"
        side_effects:
          - "Contract.status := ACTIVE"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /gpo/contracts/{contract_id}/suspend"
        actor: ComplianceAnalyst
        preconditions:
          - "Contract.status == ACTIVE"
        side_effects:
          - "Contract.status := SUSPENDED"
          - "increments Contract.version by 1"
        note: "SUSPENDED is terminal: no reinstatement endpoint exists. New commitments, new distributor files and new price activations are all refused while SUSPENDED; already-ACTIVE activations keep pricing purchases."

  - entity: ClinicalEvidenceReview
    state_field: status
    initial_state: UNDER_REVIEW
    terminal_states: [ENDORSED, REJECTED]
    transitions:
      - from: null
        to: UNDER_REVIEW
        trigger: "POST /gpo/clinical-evidence-reviews"
        actor: ClinicalReviewer
        preconditions:
          - "Contract exists"
          - "Contract.status IN {DRAFT, ACTIVE}"
        side_effects:
          - "ClinicalEvidenceReview created with status UNDER_REVIEW, revision_round 0"
          - "recompute ClinicalEvidenceReview.weighted_score per calculations.evidence_weighted_score"
          - "ClinicalEvidenceReview.conversion_recommendation := CONVERT iff weighted_score >= 7.00 else DO_NOT_CONVERT"
          - "ClinicalEvidenceReview.submitted_by_user_id := X-User-ID"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /gpo/clinical-evidence-reviews/{review_id}/request-revision"
        actor: ClinicalReviewer
        preconditions:
          - "ClinicalEvidenceReview.status == UNDER_REVIEW"
          - "ClinicalEvidenceReview.revision_round <= 1, else ERR_REVISION_LIMIT_REACHED"
        side_effects:
          - "ClinicalEvidenceReview.status := REVISION_REQUESTED"
          - "ClinicalEvidenceReview.revision_round += 1"
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /gpo/clinical-evidence-reviews/{review_id}/resubmit"
        actor: ClinicalReviewer
        preconditions:
          - "ClinicalEvidenceReview.status == REVISION_REQUESTED"
        side_effects:
          - "ClinicalEvidenceReview.status := UNDER_REVIEW (closing the revision cycle)"
          - "the three score fields are overwritten with the resubmitted values"
          - "recompute ClinicalEvidenceReview.weighted_score per calculations.evidence_weighted_score"
          - "ClinicalEvidenceReview.conversion_recommendation recomputed from the new weighted_score"
          - "ClinicalEvidenceReview.submitted_by_user_id := X-User-ID of the resubmitting reviewer"
        note: "The cycle may run at most twice: revision_round is capped at 2 by the request-revision precondition."
      - from: UNDER_REVIEW
        to: ENDORSED
        trigger: "POST /gpo/clinical-evidence-reviews/{review_id}/endorse"
        actor: ClinicalReviewer
        preconditions:
          - "ClinicalEvidenceReview.status == UNDER_REVIEW"
          - "X-User-ID != ClinicalEvidenceReview.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "ClinicalEvidenceReview.weighted_score >= 7.00, else ERR_EVIDENCE_SCORE_BELOW_THRESHOLD"
        side_effects:
          - "ClinicalEvidenceReview.status := ENDORSED"
          - "ClinicalEvidenceReview.endorsed_by_user_id := X-User-ID"
          - "recompute Contract.evidence_endorsed (cross-entity); increments Contract.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /gpo/clinical-evidence-reviews/{review_id}/reject"
        actor: ClinicalReviewer
        preconditions:
          - "ClinicalEvidenceReview.status == UNDER_REVIEW"
          - "X-User-ID != ClinicalEvidenceReview.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "ClinicalEvidenceReview.status := REJECTED"
          - "recompute Contract.evidence_endorsed (cross-entity); increments Contract.version by 1"

  - entity: Commitment
    state_field: election_status
    initial_state: ELECTED
    terminal_states: [TERMINATED]
    transitions:
      - from: null
        to: ELECTED
        trigger: "POST /gpo/commitments"
        actor: MemberMaterialsManager
        preconditions:
          - "Member exists AND Member.status == ACTIVE, else ERR_MEMBER_NOT_ACTIVE"
          - "X-User-ID == body member_id, else ERR_MEMBER_SCOPE_VIOLATION"
          - "Contract exists AND Contract.status == ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
          - "elected_tier_code exists in Contract.tiers, else ERR_TIER_CODE_UNKNOWN"
          - "no Commitment with the same (member_id, contract_id) has election_status IN {ELECTED, ACTIVE, REQUAL_REVIEW}, else ERR_DUPLICATE_COMMITMENT"
          - "effective_from inside [Contract.effective_from, Contract.effective_to], else ERR_PERIOD_OUTSIDE_CONTRACT_TERM"
          - "committed_volume_units >= the elected tier's min_committed_volume_units, else ERR_COMMITTED_VOLUME_BELOW_TIER"
        side_effects:
          - "Commitment created with election_status ELECTED, lop_status NOT_ISSUED, current_tier_code null and all four ytd/flag ledger fields at their defaults"
      - from: ELECTED
        to: ACTIVE
        trigger: "POST /gpo/commitments/{commitment_id}/lop/countersign (same request that drives lop_status SIGNED→COUNTERSIGNED)"
        actor: ContractManager
        preconditions:
          - "Commitment.election_status == ELECTED"
          - "Commitment.lop_status == SIGNED, else ERR_INVALID_LOP_STATE"
          - "Contract.status == ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
        side_effects:
          - "Commitment.election_status := ACTIVE"
          - "Commitment.current_tier_code := Commitment.elected_tier_code"
          - "recompute Contract.active_commitment_count (cross-entity); increments Contract.version by 1"
      - from: ACTIVE
        to: REQUAL_REVIEW
        trigger: "POST /gpo/commitments/{commitment_id}/open-requalification"
        actor: ComplianceAnalyst
        preconditions:
          - "Commitment.election_status == ACTIVE"
          - "Commitment.lop_status == COUNTERSIGNED, else ERR_INVALID_LOP_STATE"
        side_effects:
          - "Commitment.election_status := REQUAL_REVIEW"
        note: "Opening requalification is the only way to make a measurement finalizable; it does not itself change pricing."
      - from: REQUAL_REVIEW
        to: ACTIVE
        trigger: "system: hop 2 of the requalification cascade fired by POST /gpo/compliance-measurements/{measurement_id}/finalize"
        actor: system
        preconditions:
          - "Commitment.election_status == REQUAL_REVIEW"
          - "the finalized measurement's commitment_id == Commitment.id"
        side_effects:
          - "Commitment.election_status := ACTIVE (closing the requalification cycle)"
          - "Commitment.current_tier_code := ComplianceMeasurement.qualified_tier_code"
          - "Commitment.last_final_compliance_pct := ComplianceMeasurement.compliance_pct"
          - "Commitment.requalification_round += 1"
          - "IF the new current_tier_code differs from the previous one THEN hop 3 of the cascade fires (see PriceActivation ACTIVE→SUPERSEDED)"
      - from: ELECTED
        to: TERMINATED
        trigger: "POST /gpo/commitments/{commitment_id}/terminate"
        actor: ComplianceAnalyst
        preconditions:
          - "Commitment.election_status == ELECTED"
        side_effects:
          - "Commitment.election_status := TERMINATED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /gpo/commitments/{commitment_id}/terminate"
        actor: ComplianceAnalyst
        preconditions:
          - "Commitment.election_status == ACTIVE"
        side_effects:
          - "Commitment.election_status := TERMINATED"
          - "every PriceActivation with commitment_id == this commitment AND status IN {DRAFT, ENDORSED, APPROVED, ACTIVE} := SUPERSEDED with superseded_by_activation_id left null (no replacement is synthesized)"
          - "for each ContractItem touched by that supersede, recompute ContractItem.active_activation_count (one recompute per item, increments that item's version by 1)"
          - "recompute Contract.active_commitment_count (cross-entity); increments Contract.version by 1"
      - from: REQUAL_REVIEW
        to: TERMINATED
        trigger: "POST /gpo/commitments/{commitment_id}/terminate"
        actor: ComplianceAnalyst
        preconditions:
          - "Commitment.election_status == REQUAL_REVIEW"
        side_effects:
          - "Commitment.election_status := TERMINATED"
          - "every PriceActivation with commitment_id == this commitment AND status IN {DRAFT, ENDORSED, APPROVED, ACTIVE} := SUPERSEDED with superseded_by_activation_id left null"
          - "for each ContractItem touched by that supersede, recompute ContractItem.active_activation_count"
          - "recompute Contract.active_commitment_count (cross-entity); increments Contract.version by 1"

  - entity: Commitment
    state_field: lop_status
    initial_state: NOT_ISSUED
    terminal_states: []
    transitions:
      - from: NOT_ISSUED
        to: ISSUED
        trigger: "POST /gpo/commitments/{commitment_id}/lop/issue"
        actor: ContractManager
        preconditions:
          - "Commitment.lop_status == NOT_ISSUED"
          - "Commitment.election_status == ELECTED, else ERR_COMMITMENT_NOT_ELECTED"
        side_effects:
          - "Commitment.lop_status := ISSUED"
      - from: VOID
        to: ISSUED
        trigger: "POST /gpo/commitments/{commitment_id}/lop/issue (re-issue after a void)"
        actor: ContractManager
        preconditions:
          - "Commitment.lop_status == VOID"
          - "Commitment.election_status == ELECTED, else ERR_COMMITMENT_NOT_ELECTED"
        side_effects:
          - "Commitment.lop_status := ISSUED (closing the document cycle)"
          - "Commitment.signer_name := null"
      - from: ISSUED
        to: SIGNED
        trigger: "POST /gpo/commitments/{commitment_id}/lop/sign"
        actor: MemberMaterialsManager
        preconditions:
          - "Commitment.lop_status == ISSUED"
          - "X-User-ID == Commitment.member_id, else ERR_MEMBER_SCOPE_VIOLATION"
        side_effects:
          - "Commitment.lop_status := SIGNED"
          - "Commitment.signer_name := body signer_name"
      - from: SIGNED
        to: COUNTERSIGNED
        trigger: "POST /gpo/commitments/{commitment_id}/lop/countersign"
        actor: ContractManager
        preconditions:
          - "Commitment.lop_status == SIGNED"
          - "Commitment.election_status == ELECTED"
          - "Contract.status == ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
        side_effects:
          - "Commitment.lop_status := COUNTERSIGNED"
          - "drives election_status ELECTED→ACTIVE in the same request (see the election_status machine)"
      - from: ISSUED
        to: VOID
        trigger: "POST /gpo/commitments/{commitment_id}/lop/void"
        actor: ContractManager
        preconditions:
          - "Commitment.lop_status == ISSUED"
        side_effects:
          - "Commitment.lop_status := VOID"
      - from: SIGNED
        to: VOID
        trigger: "POST /gpo/commitments/{commitment_id}/lop/void"
        actor: ContractManager
        preconditions:
          - "Commitment.lop_status == SIGNED"
        side_effects:
          - "Commitment.lop_status := VOID"
          - "Commitment.signer_name := null"
        note: "Voiding is refused once lop_status == COUNTERSIGNED (ERR_INVALID_LOP_STATE): an in-force letter is unwound by terminating the commitment, not by voiding the document. election_status is untouched by every lop transition except countersign."

  - entity: ItemCrossReference
    state_field: status
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: null
        to: PROPOSED
        trigger: "POST /gpo/item-cross-references"
        actor: MemberMaterialsManager
        preconditions:
          - "Member exists; X-User-ID == body member_id, else ERR_MEMBER_SCOPE_VIOLATION"
          - "ContractItem exists AND ContractItem.status == ACTIVE, else ERR_CONTRACT_ITEM_NOT_ACTIVE"
          - "member_item_number appears in Member.item_master[].member_item_number, else ERR_MEMBER_ITEM_NOT_IN_MASTER"
          - "no ItemCrossReference with status == APPROVED exists for the same (member_id, contract_item_id), and none for the same (member_id, member_item_number), else ERR_DUPLICATE_XREF"
        side_effects:
          - "ItemCrossReference created with status PROPOSED"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /gpo/item-cross-references/{xref_id}/approve"
        actor: ContractManager
        preconditions:
          - "ItemCrossReference.status == PROPOSED, else ERR_XREF_NOT_PROPOSED"
          - "no other ItemCrossReference with status == APPROVED exists for the same (member_id, contract_item_id) or the same (member_id, member_item_number), else ERR_DUPLICATE_XREF"
        side_effects:
          - "ItemCrossReference.status := APPROVED"
          - "ItemCrossReference.approved_by_user_id := X-User-ID"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /gpo/item-cross-references/{xref_id}/reject"
        actor: ContractManager
        preconditions:
          - "ItemCrossReference.status == PROPOSED, else ERR_XREF_NOT_PROPOSED"
        side_effects:
          - "ItemCrossReference.status := REJECTED"
          - "ItemCrossReference.reject_note := body reason (or null when omitted)"

  - entity: PriceActivation
    state_field: status
    initial_state: DRAFT
    terminal_states: [DENIED, SUPERSEDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /gpo/price-activations"
        actor: ContractManager (activation_type TIER_PRICE) | MemberMaterialsManager (activation_type LOCAL_EXCEPTION)
        preconditions:
          - "Commitment exists AND Commitment.election_status IN {ELECTED, ACTIVE, REQUAL_REVIEW}"
          - "ContractItem exists AND ContractItem.contract_id == Commitment.contract_id, else ERR_ITEM_CONTRACT_MISMATCH"
          - "Contract.status == ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
          - "activation_type == TIER_PRICE requires role ContractManager; activation_type == LOCAL_EXCEPTION requires role MemberMaterialsManager with X-User-ID == Commitment.member_id, else ERR_ROLE_NOT_PERMITTED / ERR_MEMBER_SCOPE_VIOLATION"
          - "effective_to >= effective_from, else ERR_EFFECTIVE_WINDOW_INVALID"
          - "[effective_from, effective_to] inside [Contract.effective_from, Contract.effective_to], else ERR_PERIOD_OUTSIDE_CONTRACT_TERM"
          - "no other PriceActivation with the same (commitment_id, contract_item_id, activation_type) and status IN {DRAFT, ENDORSED, APPROVED, ACTIVE} has a CLOSED-interval collision with [effective_from, effective_to], else ERR_ACTIVATION_PERIOD_OVERLAP"
          - "requested_price_cents present iff activation_type == LOCAL_EXCEPTION, else ERR_REQUESTED_PRICE_REQUIRED / ERR_REQUESTED_PRICE_NOT_ALLOWED"
        side_effects:
          - "PriceActivation created with status DRAFT, origin REQUEST"
          - "PriceActivation.tier_code_at_activation := Commitment.current_tier_code, or Contract.default_tier_code when current_tier_code is null"
          - "recompute PriceActivation.computed_price_cents and PriceActivation.price_clamped per calculations.tier_activated_price"
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /gpo/price-activations/{activation_id}/activate (activation_type == TIER_PRICE branch)"
        actor: ContractManager
        preconditions:
          - "PriceActivation.status == DRAFT AND PriceActivation.activation_type == TIER_PRICE, else ERR_INVALID_ACTIVATION_STATE"
          - "Contract.status == ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
          - "IF ContractItem.requires_evidence == true THEN the parent contract has a ClinicalEvidenceReview with status == ENDORSED AND conversion_recommendation == CONVERT, else ERR_CLINICAL_REVIEW_NOT_ENDORSED"
          - "an ItemCrossReference with (member_id == Commitment.member_id, contract_item_id == PriceActivation.contract_item_id) exists with status == APPROVED, else ERR_XREF_NOT_APPROVED"
        side_effects:
          - "PriceActivation.status := ACTIVE"
          - "recompute ContractItem.active_activation_count (cross-entity); increments that ContractItem.version by 1"
      - from: DRAFT
        to: ENDORSED
        trigger: "POST /gpo/price-activations/{activation_id}/endorse (activation_type == LOCAL_EXCEPTION branch)"
        actor: ContractManager
        preconditions:
          - "PriceActivation.status == DRAFT AND PriceActivation.activation_type == LOCAL_EXCEPTION, else ERR_INVALID_ACTIVATION_STATE"
          - "Commitment.election_status != REQUAL_REVIEW, else ERR_REQUALIFICATION_IN_PROGRESS"
        side_effects:
          - "PriceActivation.status := ENDORSED"
          - "PriceActivation.endorsed_by_user_id := X-User-ID"
      - from: ENDORSED
        to: APPROVED
        trigger: "POST /gpo/price-activations/{activation_id}/approve"
        actor: ContractManager
        preconditions:
          - "PriceActivation.status == ENDORSED, else ERR_INVALID_ACTIVATION_STATE"
          - "X-User-ID != PriceActivation.endorsed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "Commitment.election_status != REQUAL_REVIEW, else ERR_REQUALIFICATION_IN_PROGRESS"
        side_effects:
          - "PriceActivation.status := APPROVED"
          - "PriceActivation.approved_by_user_id := X-User-ID"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /gpo/price-activations/{activation_id}/activate (activation_type == LOCAL_EXCEPTION branch)"
        actor: ContractManager
        preconditions:
          - "PriceActivation.status == APPROVED AND PriceActivation.activation_type == LOCAL_EXCEPTION, else ERR_INVALID_ACTIVATION_STATE"
          - "Contract.status == ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
          - "IF ContractItem.requires_evidence == true THEN the parent contract has a ClinicalEvidenceReview with status == ENDORSED AND conversion_recommendation == CONVERT, else ERR_CLINICAL_REVIEW_NOT_ENDORSED"
          - "an ItemCrossReference with (member_id == Commitment.member_id, contract_item_id == PriceActivation.contract_item_id) exists with status == APPROVED, else ERR_XREF_NOT_APPROVED"
        side_effects:
          - "PriceActivation.status := ACTIVE"
          - "recompute ContractItem.active_activation_count (cross-entity); increments that ContractItem.version by 1"
      - from: DRAFT
        to: DENIED
        trigger: "POST /gpo/price-activations/{activation_id}/deny"
        actor: ContractManager
        preconditions:
          - "PriceActivation.status IN {DRAFT, ENDORSED} AND PriceActivation.activation_type == LOCAL_EXCEPTION, else ERR_INVALID_ACTIVATION_STATE"
        side_effects:
          - "PriceActivation.status := DENIED"
          - "PriceActivation.deny_note := body reason (or null when omitted)"
      - from: ENDORSED
        to: DENIED
        trigger: "POST /gpo/price-activations/{activation_id}/deny"
        actor: ContractManager
        preconditions:
          - "PriceActivation.status == ENDORSED AND PriceActivation.activation_type == LOCAL_EXCEPTION"
        side_effects:
          - "PriceActivation.status := DENIED"
          - "PriceActivation.deny_note := body reason (or null when omitted)"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: hop 3 of the requalification cascade fired by POST /gpo/compliance-measurements/{measurement_id}/finalize (only when Commitment.current_tier_code actually changed in hop 2)"
        actor: system
        preconditions:
          - "PriceActivation.status == ACTIVE AND PriceActivation.activation_type == TIER_PRICE"
          - "PriceActivation.commitment_id == the requalified commitment"
        side_effects:
          - "PriceActivation.status := SUPERSEDED"
          - "IF PriceActivation.effective_to >= the logical clock's current date THEN a replacement PriceActivation is created with origin REQUALIFICATION_CASCADE, activation_type TIER_PRICE, status ACTIVE, effective_from := the logical clock's current date, effective_to := the superseded row's effective_to, tier_code_at_activation := the new Commitment.current_tier_code, computed_price_cents recomputed per calculations.tier_activated_price, replaces_activation_id := the superseded row's id; the superseded row's superseded_by_activation_id := the replacement's id"
          - "ELSE no replacement is created and superseded_by_activation_id stays null"
          - "this supersede is itself the cause of hop 4: for the same (commitment_id, contract_item_id) an ACTIVE LOCAL_EXCEPTION activation, if one exists, is re-derived (see the next transition)"
        note: "The overlap guard ignores rows in status SUPERSEDED/DENIED, so the replacement window may start inside the superseded row's window."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: hop 4 of the requalification cascade, caused by hop 3's supersede of the TIER_PRICE row for the same (commitment_id, contract_item_id)"
        actor: system
        preconditions:
          - "PriceActivation.status == ACTIVE AND PriceActivation.activation_type == LOCAL_EXCEPTION"
          - "a TIER_PRICE activation for the same (commitment_id, contract_item_id) was superseded by hop 3 in this same request"
        side_effects:
          - "PriceActivation.status := SUPERSEDED"
          - "IF PriceActivation.effective_to >= the logical clock's current date THEN a replacement PriceActivation is created with origin REQUALIFICATION_CASCADE, activation_type LOCAL_EXCEPTION, status ACTIVE, requested_price_cents copied from the superseded row, effective_from := the logical clock's current date, effective_to := the superseded row's effective_to, computed_price_cents recomputed per calculations.tier_activated_price under the NEW tier (so the min(requested_price_cents, tier_price_cents) ceiling moves), replaces_activation_id := the superseded row's id; the superseded row's superseded_by_activation_id := the replacement's id"
          - "hop 5 follows and is caused by these status writes: for each ContractItem touched in hops 3–4, recompute ContractItem.active_activation_count exactly once (increments that ContractItem.version by 1)"
        note: "A LOCAL_EXCEPTION is never re-derived on its own; it moves only because the tier row for the same item moved first. This is what makes the cascade transitive rather than a fan-out."

  - entity: DistributorFile
    state_field: status
    initial_state: RECEIVED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: null
        to: RECEIVED
        trigger: "POST /gpo/distributor-files"
        actor: DistributorAgent
        preconditions:
          - "Member exists AND Member.status == ACTIVE, else ERR_MEMBER_NOT_ACTIVE"
          - "Contract exists AND Contract.status == ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
          - "period_end strictly after period_start, else ERR_EFFECTIVE_WINDOW_INVALID"
          - "lines[] has at least one entry, else ERR_INVALID_REQUEST"
          - "no DistributorFile with the same (member_id, contract_id, distributor_code) and status NOT IN {REJECTED, REVERSED} has a HALF-OPEN interval collision with [period_start, period_end), else ERR_FILE_PERIOD_OVERLAP"
        side_effects:
          - "DistributorFile created with status RECEIVED"
          - "one PurchaseLine created per lines[] entry with classification UNCLASSIFIED, reject_reason NONE, contract_units 0 and extended_cost_cents := quantity_units * unit_price_paid_cents"
          - "DistributorFile.line_count := number of created lines"
      - from: RECEIVED
        to: VALIDATING
        trigger: "POST /gpo/distributor-files/{file_id}/validate"
        actor: DistributorAgent
        preconditions:
          - "DistributorFile.status == RECEIVED, else ERR_INVALID_FILE_STATE"
        side_effects:
          - "DistributorFile.status := VALIDATING"
          - "for each PurchaseLine: reject_reason := DATE_OUT_OF_PERIOD when purchase_date outside [period_start, period_end); else ZERO_QUANTITY when quantity_units == 0; else NONE"
          - "DistributorFile.accepted_line_count and DistributorFile.rejected_line_count recomputed"
        note: "DATE_OUT_OF_PERIOD is evaluated before ZERO_QUANTITY, so a zero-quantity line dated outside the period records DATE_OUT_OF_PERIOD."
      - from: VALIDATING
        to: LOADED
        trigger: "POST /gpo/distributor-files/{file_id}/load"
        actor: ComplianceAnalyst
        preconditions:
          - "DistributorFile.status == VALIDATING, else ERR_INVALID_FILE_STATE"
          - "DistributorFile.rejected_line_count == 0 AND DistributorFile.accepted_line_count > 0"
        side_effects:
          - "hop 1: every accepted PurchaseLine is classified per calculations.purchase_line_classification, writing classification, matched_vendor_item_number and contract_units"
          - "DistributorFile.status := LOADED; DistributorFile.loaded_at := the logical clock instant"
          - "hop 2, caused by hop 1's classification writes: the Commitment for (member_id, contract_id) with election_status IN {ELECTED, ACTIVE, REQUAL_REVIEW} has ytd_on_contract_spend_cents += sum of ON_CONTRACT extended_cost_cents, ytd_total_category_spend_cents += sum of ON_CONTRACT + OFF_CONTRACT_LEAKAGE + UNMATCHED extended_cost_cents, ytd_measured_volume_units += sum of ON_CONTRACT contract_units (no-op when no such commitment exists)"
          - "hop 3, caused by hop 2's ledger write: recompute ytd_leakage_pct := round_half_up((ytd_total_category_spend_cents - ytd_on_contract_spend_cents) * 100 / ytd_total_category_spend_cents, 2) (0.00 when the denominator is 0); IF ytd_leakage_pct > Contract.leakage_alert_threshold_pct THEN Commitment.leakage_flag := true"
          - "hop 4, caused by hop 3 raising the flag from false to true: Member.watchlist_status := WATCHLIST"
      - from: VALIDATING
        to: PARTIALLY_LOADED
        trigger: "POST /gpo/distributor-files/{file_id}/load"
        actor: ComplianceAnalyst
        preconditions:
          - "DistributorFile.status == VALIDATING"
          - "DistributorFile.rejected_line_count > 0 AND DistributorFile.accepted_line_count > 0"
        side_effects:
          - "identical to the VALIDATING→LOADED transition (hops 1–4), except DistributorFile.status := PARTIALLY_LOADED"
        note: "Rejected lines are never classified and never enter any sum. A PARTIALLY_LOADED file counts for the PRELIMINARY compliance variant but is excluded entirely by the FINAL variant."
      - from: VALIDATING
        to: REJECTED
        trigger: "POST /gpo/distributor-files/{file_id}/load"
        actor: ComplianceAnalyst
        preconditions:
          - "DistributorFile.status == VALIDATING"
          - "DistributorFile.accepted_line_count == 0"
        side_effects:
          - "DistributorFile.status := REJECTED"
          - "no line is classified and no Commitment ledger field moves"
      - from: LOADED
        to: REVERSED
        trigger: "POST /gpo/distributor-files/{file_id}/reverse"
        actor: ComplianceAnalyst
        preconditions:
          - "DistributorFile.status IN {LOADED, PARTIALLY_LOADED}, else ERR_INVALID_FILE_STATE"
        side_effects:
          - "DistributorFile.status := REVERSED; DistributorFile.reverse_note := body reason (or null)"
          - "compensation hop 1: for the same Commitment, ytd_on_contract_spend_cents, ytd_total_category_spend_cents and ytd_measured_volume_units are each decremented by exactly the amounts this file added at load time"
          - "compensation hop 2, caused by hop 1: ytd_leakage_pct is recomputed; IF it is <= Contract.leakage_alert_threshold_pct (including the 0-denominator case) THEN Commitment.leakage_flag := false"
          - "compensation hop 3, caused by hop 2 lowering the flag: IF no Commitment of that Member has leakage_flag == true THEN Member.watchlist_status := NONE"
          - "every PurchaseLine of the file: classification := UNCLASSIFIED, contract_units := 0, matched_vendor_item_number := null (reject_reason is left as validated)"
      - from: PARTIALLY_LOADED
        to: REVERSED
        trigger: "POST /gpo/distributor-files/{file_id}/reverse"
        actor: ComplianceAnalyst
        preconditions:
          - "DistributorFile.status == PARTIALLY_LOADED"
        side_effects:
          - "identical to the LOADED→REVERSED compensation"

  - entity: ComplianceMeasurement
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /gpo/compliance-measurements"
        actor: ComplianceAnalyst
        preconditions:
          - "Commitment exists AND Commitment.election_status IN {ACTIVE, REQUAL_REVIEW}, else ERR_COMMITMENT_NOT_ACTIVE"
          - "expected_commitment_version == Commitment.version, else ERR_STALE_COMMITMENT_VERSION (412)"
          - "period_end strictly after period_start, else ERR_EFFECTIVE_WINDOW_INVALID"
          - "no ComplianceMeasurement for the same commitment_id with status IN {DRAFT, PRELIMINARY, FINAL} has the same (period_start, period_end), else ERR_DUPLICATE_MEASUREMENT_PERIOD"
        side_effects:
          - "ComplianceMeasurement created with status DRAFT and every money/volume/pct field 0 (compliance_pct 0.00, preliminary_compliance_pct null, qualified_tier_code null, basis_empty false, computed_variant null)"
          - "increments Commitment.version by 1"
      - from: DRAFT
        to: PRELIMINARY
        trigger: "POST /gpo/compliance-measurements/{measurement_id}/measure"
        actor: ComplianceAnalyst
        preconditions:
          - "ComplianceMeasurement.status == DRAFT, else ERR_INVALID_MEASUREMENT_STATE"
        side_effects:
          - "recompute every money/volume field per calculations.compliance_measurement under variant PRELIMINARY; computed_variant := PRELIMINARY"
          - "ComplianceMeasurement.preliminary_compliance_pct := the computed compliance_pct"
          - "ComplianceMeasurement.qualified_tier_code := calculations.tier_requalification applied to the PRELIMINARY figures"
          - "ComplianceMeasurement.status := PRELIMINARY"
          - "no Commitment field changes: a preliminary measurement never retiers anybody"
      - from: PRELIMINARY
        to: FINAL
        trigger: "POST /gpo/compliance-measurements/{measurement_id}/finalize"
        actor: ComplianceAnalyst
        preconditions:
          - "ComplianceMeasurement.status == PRELIMINARY, else ERR_INVALID_MEASUREMENT_STATE"
          - "Commitment.election_status == REQUAL_REVIEW, else ERR_COMMITMENT_NOT_IN_REQUAL_REVIEW (this also guarantees Commitment.lop_status == COUNTERSIGNED, because REQUAL_REVIEW is reachable only through open-requalification, which requires a countersigned letter, and no transition ever leaves COUNTERSIGNED)"
        side_effects:
          - "hop 1: recompute every money/volume field per calculations.compliance_measurement under variant FINAL (preliminary_compliance_pct is preserved unchanged as the audit trail); computed_variant := FINAL; qualified_tier_code := calculations.tier_requalification applied to the FINAL figures; ComplianceMeasurement.status := FINAL"
          - "hop 2, caused by hop 1: Commitment.last_final_compliance_pct := the FINAL compliance_pct; Commitment.current_tier_code := qualified_tier_code; Commitment.requalification_round += 1; Commitment.election_status := ACTIVE"
          - "hop 3, caused by hop 2 only when current_tier_code actually changed: every ACTIVE TIER_PRICE PriceActivation of this commitment moves to SUPERSEDED with a replacement priced at the new tier (see PriceActivation.status)"
          - "hop 4, caused by hop 3: for each (commitment_id, contract_item_id) superseded in hop 3, an ACTIVE LOCAL_EXCEPTION activation is superseded and re-derived under the new tier ceiling"
          - "hop 5, caused by hops 3–4: ContractItem.active_activation_count recomputed once per touched ContractItem, incrementing that ContractItem.version by 1"
        note: "When qualified_tier_code equals the incumbent Commitment.current_tier_code, hops 3–5 do not fire at all and no PriceActivation or ContractItem row is touched."
      - from: PRELIMINARY
        to: SUPERSEDED
        trigger: "POST /gpo/compliance-measurements/{measurement_id}/supersede"
        actor: ComplianceAnalyst
        preconditions:
          - "ComplianceMeasurement.status IN {DRAFT, PRELIMINARY}, else ERR_INVALID_MEASUREMENT_STATE"
        side_effects:
          - "ComplianceMeasurement.status := SUPERSEDED"
          - "no Commitment field changes"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /gpo/compliance-measurements/{measurement_id}/supersede"
        actor: ComplianceAnalyst
        preconditions:
          - "ComplianceMeasurement.status == DRAFT"
        side_effects:
          - "ComplianceMeasurement.status := SUPERSEDED"
        note: "A FINAL measurement can never be superseded (ERR_INVALID_MEASUREMENT_STATE): the retier it caused is already reflected in the commitment and in the activation ladder."

  - entity: AdminFeeDistribution
    state_field: status
    initial_state: ACCRUED
    terminal_states: [REVERSED]
    transitions:
      - from: null
        to: ACCRUED
        trigger: "POST /gpo/admin-fee-distributions"
        actor: FinanceAdministrator
        preconditions:
          - "Contract exists AND Contract.status == ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
          - "period_end strictly after period_start, else ERR_EFFECTIVE_WINDOW_INVALID"
          - "no AdminFeeDistribution for the same contract_id with status NOT IN {REVERSED} has the same (period_start, period_end), else ERR_DUPLICATE_DISTRIBUTION_PERIOD"
        side_effects:
          - "AdminFeeDistribution created with status ACCRUED, collected_fee_cents 0, basis null, and every pool/share field 0 with member_shares []"
          - "AdminFeeDistribution.accrued_fee_cents := calculations.admin_fee_accrual over the period"
      - from: ACCRUED
        to: COLLECTED
        trigger: "POST /gpo/admin-fee-distributions/{distribution_id}/collect"
        actor: FinanceAdministrator
        preconditions:
          - "AdminFeeDistribution.status == ACCRUED, else ERR_INVALID_DISTRIBUTION_STATE"
          - "body collected_fee_cents >= 0, else ERR_INVALID_REQUEST"
          - "body collected_fee_cents <= AdminFeeDistribution.accrued_fee_cents, else ERR_COLLECTION_EXCEEDS_ACCRUAL"
        side_effects:
          - "AdminFeeDistribution.collected_fee_cents := body collected_fee_cents"
          - "AdminFeeDistribution.status := COLLECTED"
      - from: ACCRUED
        to: DISTRIBUTED
        trigger: "POST /gpo/admin-fee-distributions/{distribution_id}/distribute (variant ACCRUAL)"
        actor: FinanceAdministrator
        preconditions:
          - "AdminFeeDistribution.status == ACCRUED, else ERR_INVALID_DISTRIBUTION_STATE"
          - "Contract.share_basis == ACCRUAL, else the ACCRUED→DISTRIBUTED hop is not available and ERR_DISTRIBUTION_BASIS_NOT_COLLECTABLE is raised"
        side_effects:
          - "AdminFeeDistribution.basis := ACCRUAL; gross_pool_cents := accrued_fee_cents"
          - "holdback_bps_applied, holdback_cents, net_pool_cents, member_pool_cents computed per calculations.distribution_holdback"
          - "member_shares[], member_share_total_cents, undistributed_cents computed per calculations.distribution_waterfall"
          - "gpo_retained_cents := gross_pool_cents - member_share_total_cents - undistributed_cents"
          - "each eligible Member.fee_credit_balance_cents += that member's share_cents"
          - "AdminFeeDistribution.status := DISTRIBUTED"
      - from: COLLECTED
        to: DISTRIBUTED
        trigger: "POST /gpo/admin-fee-distributions/{distribution_id}/distribute (variant COLLECTED)"
        actor: FinanceAdministrator
        preconditions:
          - "AdminFeeDistribution.status == COLLECTED, else ERR_INVALID_DISTRIBUTION_STATE"
          - "Contract.share_basis == COLLECTED, else ERR_DISTRIBUTION_BASIS_MISMATCH"
        side_effects:
          - "AdminFeeDistribution.basis := COLLECTED; gross_pool_cents := collected_fee_cents"
          - "the same holdback then waterfall pipeline as the ACCRUAL variant, over the smaller gross pool"
          - "each eligible Member.fee_credit_balance_cents += that member's share_cents"
          - "AdminFeeDistribution.status := DISTRIBUTED"
        note: "share_basis is read off the Contract, so exactly one of the two distribute hops is legal for a given contract; the other returns ERR_DISTRIBUTION_BASIS_MISMATCH / ERR_DISTRIBUTION_BASIS_NOT_COLLECTABLE."
      - from: DISTRIBUTED
        to: REVERSED
        trigger: "POST /gpo/admin-fee-distributions/{distribution_id}/reverse"
        actor: FinanceAdministrator
        preconditions:
          - "AdminFeeDistribution.status == DISTRIBUTED, else ERR_INVALID_DISTRIBUTION_STATE"
        side_effects:
          - "for each entry of member_shares[]: that Member.fee_credit_balance_cents -= entry.share_cents (exactly, no re-derivation)"
          - "holdback_bps_applied := 0, holdback_cents := 0, net_pool_cents := 0, member_pool_cents := 0, member_shares := [], member_share_total_cents := 0, gpo_retained_cents := 0"
          - "undistributed_cents := gross_pool_cents, so the conservation identity member_share_total_cents + undistributed_cents + gpo_retained_cents == gross_pool_cents still holds after the reversal"
          - "AdminFeeDistribution.status := REVERSED; AdminFeeDistribution.reverse_note := body reason (or null)"
        note: "An ACCRUED or COLLECTED distribution cannot be reversed (ERR_INVALID_DISTRIBUTION_STATE) because no member credit has moved yet; it is abandoned by leaving it unfinished."

# ─────────────────────────────────────────────────────────────────────────────
# §1.2.1 Concurrency Rules (OCC only, on the parent entity's version)
# ─────────────────────────────────────────────────────────────────────────────
concurrency_rules:
  - rule_id: measurement-create-stale-commitment
    parent_entity: Commitment
    write_endpoint: "POST /gpo/compliance-measurements"
    occ_field: "expected_commitment_version"
    description: |
      Opening a ComplianceMeasurement against a Commitment whose version has
      advanced since the client last read it is rejected. Two measurements for
      different periods on the same commitment are both legitimate product
      operations, so nothing in the state machine stops the second write; the
      hazard is that the second writer computed its period boundaries and its
      expected tier from a commitment snapshot that the first measurement has
      already moved (the create bumps Commitment.version, and finalize later
      rewrites current_tier_code and requalification_round). The stale
      expected_commitment_version is therefore refused rather than silently
      measured against a commitment the writer never saw.
    error_id: ERR_STALE_COMMITMENT_VERSION
    http_status: 412
  - rule_id: item-price-update-stale-contract
    parent_entity: Contract
    write_endpoint: "PATCH /gpo/contract-items/{contract_item_id}/base-price"
    occ_field: "expected_contract_version"
    description: |
      Repricing a ContractItem while carrying a Contract version older than the
      contract's current one is rejected. Successive base-price edits on the same
      item are each legitimate under the product spec — a later edit supersedes an
      earlier one — so no state precondition rejects the second write. But the
      tier ladder and the floor semantics that make a base price meaningful live
      on the Contract, and every accepted edit advances Contract.version; a writer
      whose expected_contract_version is behind is repricing against a ladder that
      has already changed, so the write is refused.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# ─────────────────────────────────────────────────────────────────────────────
# §1.3 Calculation Rules
# ─────────────────────────────────────────────────────────────────────────────
calculations:
  - name: tier_activated_price
    trigger: "on POST /gpo/price-activations (at DRAFT creation), on every activate of that activation, and again for each replacement activation minted by hops 3-4 of the requalification cascade"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — resolve the tier row that applies to this activation.
      tier_code = PriceActivation.tier_code_at_activation
      tier      = the entry of Contract.tiers[] whose tier_code == tier_code
                  (absent => ERR_TIER_CODE_UNKNOWN)

      # STEP 2 — tier price off the item's own base price, ROUND_HALF_UP to whole cents.
      #          discount_bps is in basis points: 800 bps == 8.00%.
      tier_price_cents = round_half_up(
          Decimal(ContractItem.base_price_cents) * (Decimal(10000) - Decimal(tier.discount_bps)) / Decimal(10000),
          0)

      # STEP 3 — apply the local exception ceiling, if any. A LOCAL_EXCEPTION may only
      #          ever go DOWN from the tier price; asking for more is silently ceilinged,
      #          never rejected.
      if PriceActivation.activation_type == LOCAL_EXCEPTION:
          candidate_cents = min(PriceActivation.requested_price_cents, tier_price_cents)
      else:
          candidate_cents = tier_price_cents

      # STEP 4 — clamp at the item's contractual floor. The floor wins over both the
      #          tier discount and the local exception.
      if candidate_cents < ContractItem.floor_price_cents:
          computed_price_cents = ContractItem.floor_price_cents
          price_clamped        = true
      else:
          computed_price_cents = candidate_cents
          price_clamped        = false
    input_set: "A single (ContractItem, Contract.tiers[tier_code_at_activation]) pair plus, for LOCAL_EXCEPTION, the activation's own requested_price_cents. No other activation and no purchase data participates."
    constants:
      BPS_DENOMINATOR: 10000
    precision: "Decimal arithmetic throughout; a single ROUND_HALF_UP to 0 decimal places at STEP 2 only. STEP 3's min() and STEP 4's clamp operate on already-rounded whole cents, so the discount is never rounded twice and the floor is never crossed by a rounding artifact."
    note: |
      Mode-a combinatorial shape: the three composable factors are (discount tier) x
      (exception present or not) x (floor binding or not). Worked reference values on
      base_price_cents 10000 with tiers TIER_0 = 0 bps, TIER_1 = 800 bps,
      TIER_2 = 1500 bps: 10000 / 9200 / 8500. Rounding case: base 10010 at 1500 bps
      => 8508.5 => 8509. Exception case: requested 9000 under TIER_0 (tier price
      10000) with floor 8200 => min(9000, 10000) = 9000, above floor => 9000,
      price_clamped false. Clamp case: requested 8000 under TIER_2 (tier price 8500)
      with floor 8200 => min(8000, 8500) = 8000 < 8200 => 8200, price_clamped true.

  - name: purchase_line_classification
    trigger: "hop 1 of POST /gpo/distributor-files/{file_id}/load, for every PurchaseLine of the file whose reject_reason == NONE"
    algorithm: chronological
    formula: |
      # Rejected lines are skipped entirely and keep classification UNCLASSIFIED.
      xref = the ItemCrossReference with status == APPROVED whose
             member_id        == DistributorFile.member_id AND
             member_item_number == PurchaseLine.member_item_number AND
             whose contract_item_id belongs to DistributorFile.contract_id
      if xref is absent:
          classification              = UNMATCHED
          matched_vendor_item_number  = null
          contract_units              = 0
          return

      item                       = ContractItem(xref.contract_item_id)
      matched_vendor_item_number = item.vendor_item_number
      contract_units             = round_half_up(
                                     Decimal(PurchaseLine.quantity_units) * xref.conversion_factor, 0)

      # Which activation governs this line? Only ACTIVE activations whose CLOSED
      # window [effective_from, effective_to] contains purchase_date are eligible.
      # A LOCAL_EXCEPTION always outranks a TIER_PRICE for the same pair; among rows
      # of the same activation_type the latest effective_from wins, and created_at ASC
      # breaks a tie on effective_from.
      candidates = ACTIVE PriceActivations where
                     commitment_id    == the commitment for (member_id, contract_id) AND
                     contract_item_id == item.id AND
                     effective_from <= PurchaseLine.purchase_date <= effective_to
      if candidates is empty:
          classification = OFF_CONTRACT_LEAKAGE
          return
      governing = the candidate ranked by (activation_type LOCAL_EXCEPTION before
                  TIER_PRICE, then effective_from DESC, then created_at ASC) first row

      if PurchaseLine.unit_price_paid_cents <= governing.computed_price_cents:
          classification = ON_CONTRACT
      else:
          classification = OFF_CONTRACT_LEAKAGE
    input_set: "PurchaseLines of one DistributorFile with reject_reason == NONE; APPROVED ItemCrossReferences of that file's member; ACTIVE PriceActivations of that member's commitment on that contract. PROPOSED/REJECTED cross-references and DRAFT/ENDORSED/APPROVED/DENIED/SUPERSEDED activations are invisible here."
    constants: {}
    precision: "contract_units is a whole-unit integer, ROUND_HALF_UP from quantity_units x conversion_factor (conversion_factor carries 4 decimal places). Price comparison is an integer cent comparison, inclusive at equality: paying exactly the computed price is ON_CONTRACT."
    note: "Paying LESS than the contract price is still ON_CONTRACT — the member merely beat the ceiling. Paying one cent MORE is leakage. This is the boundary the compliance percentage is most sensitive to."

  - name: compliance_measurement
    trigger: "POST /gpo/compliance-measurements/{measurement_id}/measure (variant PRELIMINARY) and hop 1 of POST /gpo/compliance-measurements/{measurement_id}/finalize (variant FINAL)"
    algorithm: aggregation
    formula: |
      # Eligible files: the member+contract of the measurement's commitment, whose
      # HALF-OPEN period [period_start, period_end) lies inside the measurement's own
      # half-open period, and whose status is in the variant's status set (below).
      lines = every PurchaseLine of every eligible DistributorFile with reject_reason == NONE

      on_contract_spend_cents  = sum(extended_cost_cents of lines with classification ON_CONTRACT)
      leakage_spend_cents      = sum(extended_cost_cents of lines with classification OFF_CONTRACT_LEAKAGE)
      unmatched_spend_cents    = sum(extended_cost_cents of lines with classification UNMATCHED)
      measured_volume_units    = sum(contract_units of lines with classification ON_CONTRACT)

      total_category_spend_cents = on_contract_spend_cents + leakage_spend_cents
                                   + (unmatched_spend_cents if the variant counts UNMATCHED else 0)

      if total_category_spend_cents == 0:
          compliance_pct = Decimal("0.00")
          basis_empty    = true
      else:
          compliance_pct = round_half_up(
              Decimal(on_contract_spend_cents) * Decimal(100) / Decimal(total_category_spend_cents), 2)
          basis_empty    = false

      qualified_tier_code = tier_requalification(compliance_pct, measured_volume_units)
    input_set: "PurchaseLines with reject_reason == NONE belonging to DistributorFiles of the commitment's (member_id, contract_id) whose [period_start, period_end) is contained in the measurement's [period_start, period_end). REVERSED and RECEIVED/VALIDATING files are excluded by both variants."
    constants:
      PCT_SCALE: 100
    precision: "All sums are exact integer cents. compliance_pct is computed once, ROUND_HALF_UP to 2 decimal places, from unrounded integer sums — never by averaging per-file percentages."
    variants:
      - name: PRELIMINARY
        when: "the measure action, while the period may still be receiving distributor files"
        difference: |
          Eligible file statuses are {LOADED, PARTIALLY_LOADED} — a partially loaded
          file counts, because its accepted lines are real purchases. UNMATCHED spend
          is EXCLUDED from total_category_spend_cents: an unmatched line has not yet
          been proven to be in the contract's category, so charging it against the
          member early would understate compliance. The result is written to both
          compliance_pct and preliminary_compliance_pct, and no Commitment field moves.
      - name: FINAL
        when: "the finalize action, once the period is closed and every file has been fully loaded or reversed"
        difference: |
          Eligible file statuses are {LOADED} only — a PARTIALLY_LOADED file is
          dropped in its entirety, including its accepted lines, because a file with
          rejected lines is not a settleable statement of the period. UNMATCHED spend
          IS counted in total_category_spend_cents: at settlement an unmatched purchase
          is presumed in-category and therefore counts against the member. preliminary_compliance_pct
          is preserved unchanged, and the FINAL compliance_pct drives the retier cascade.
    note: |
      Divergence is real and signed in both directions, so the two variants cannot be
      collapsed. Reference fixture over the period [2026-08-01, 2026-09-01): a LOADED
      file contributes ON_CONTRACT 5000 units x 9500 = 47,500,000 and UNMATCHED
      500 x 6000 = 3,000,000; a PARTIALLY_LOADED file contributes OFF_CONTRACT_LEAKAGE
      1500 x 10500 = 15,750,000. PRELIMINARY: on 47,500,000, total 47,500,000 +
      15,750,000 = 63,250,000 => 75.10%. FINAL: on 47,500,000, total 47,500,000 +
      0 + 3,000,000 = 50,500,000 => 94.06%. Same stored data, 18.96 points apart.

  - name: tier_requalification
    trigger: "inside compliance_measurement (both variants) to set ComplianceMeasurement.qualified_tier_code, and consumed by hop 2 of finalize to rewrite Commitment.current_tier_code"
    algorithm: threshold
    formula: |
      eligible = [ t for t in Contract.tiers
                   if compliance_pct        >= t.min_compliance_pct
                   and measured_volume_units >= t.min_committed_volume_units ]
      if eligible is empty:
          qualified_tier_code = Contract.default_tier_code
      else:
          # Best tier the member has actually earned. Both comparisons are INCLUSIVE:
          # hitting a threshold exactly qualifies.
          qualified_tier_code = the entry of eligible ordered by
                                  discount_bps DESC,
                                  min_committed_volume_units DESC,
                                  tier_code ASC
                                first row .tier_code
    input_set: "Contract.tiers[] of the measurement's contract, evaluated against exactly one (compliance_pct, measured_volume_units) pair. No other member and no other period participates."
    constants: {}
    precision: "compliance_pct is compared at 2 decimal places against min_compliance_pct at 2 decimal places; measured_volume_units is an integer comparison. Both use >=, so a member landing exactly on a tier's volume floor qualifies for it."
    note: |
      Two-axis threshold: a member may satisfy the volume floor of a rich tier and miss
      its compliance floor, or the reverse, and then falls back to the best tier where
      BOTH hold — not to the nearer of the two. Reference ladder TIER_0 (0 bps,
      0.00 pct, 0 units), TIER_1 (800 bps, 80.00 pct, 2000 units), TIER_2 (1500 bps,
      90.00 pct, 5000 units), default_tier_code TIER_0: the PRELIMINARY fixture above
      (75.10 pct, 5000 units) qualifies TIER_0 only; the FINAL fixture (94.06 pct,
      5000 units) sits exactly on TIER_2's volume floor and qualifies TIER_2.

  - name: leakage_report
    trigger: "GET /gpo/commitments/{commitment_id}/leakage-report"
    algorithm: aggregation
    formula: |
      # Read-only projection over the same eligible-file rule as the FINAL variant's
      # sibling PRELIMINARY set: statuses {LOADED, PARTIALLY_LOADED}, files of this
      # commitment's (member_id, contract_id), whose [period_start, period_end) is
      # contained in the query window [from_date, to_date).
      leakage_lines   = lines with reject_reason == NONE and classification OFF_CONTRACT_LEAKAGE
      unmatched_lines = lines with reject_reason == NONE and classification UNMATCHED

      leakage_spend_cents   = sum(extended_cost_cents of leakage_lines)
      unmatched_spend_cents = sum(extended_cost_cents of unmatched_lines)
      on_contract_spend_cents = sum(extended_cost_cents of ON_CONTRACT lines)
      denominator = on_contract_spend_cents + leakage_spend_cents + unmatched_spend_cents
      leakage_pct = Decimal("0.00") if denominator == 0 else
                    round_half_up(Decimal(leakage_spend_cents) * 100 / Decimal(denominator), 2)

      # Top offenders: group leakage_lines by member_item_number.
      groups = [ { member_item_number, spend_cents: sum(extended_cost_cents),
                   quantity_units: sum(quantity_units) } ]
      top_items = groups ordered by spend_cents DESC, then member_item_number ASC
                  truncated to TOP_N
    input_set: "OFF_CONTRACT_LEAKAGE and UNMATCHED PurchaseLines (reject_reason NONE) of LOADED and PARTIALLY_LOADED files of this commitment inside the requested window. ON_CONTRACT lines are read only to build the denominator."
    constants:
      TOP_N: 3
    precision: "leakage_pct ROUND_HALF_UP to 2 decimal places from integer cent sums. Note this denominator ALWAYS includes unmatched spend, unlike the PRELIMINARY compliance variant — the report is a spend view, not a settlement view."
    note: "The ranking never touches id: ties on spend_cents are broken by member_item_number ASC, which is unique inside a member's item master."

  - name: evidence_weighted_score
    trigger: "POST /gpo/clinical-evidence-reviews and PATCH /gpo/clinical-evidence-reviews/{review_id}/scores"
    algorithm: weighted_scoring
    formula: |
      weighted_score = round_half_up(
            Decimal(clinical_efficacy_score)  * W_EFFICACY
          + Decimal(safety_score)             * W_SAFETY
          + Decimal(supply_resilience_score)  * W_RESILIENCE,
          2)
      conversion_recommendation =
          CONVERT        if weighted_score >= CONVERT_THRESHOLD
          DO_NOT_CONVERT otherwise
    input_set: "The three scores stored on this ClinicalEvidenceReview only. No other review and no contract field participates."
    constants:
      W_EFFICACY: "0.40"
      W_SAFETY: "0.35"
      W_RESILIENCE: "0.25"
      CONVERT_THRESHOLD: "7.00"
    precision: "Each score carries 2 decimal places; the three products are summed UNROUNDED and the sum is ROUND_HALF_UP to 2 decimal places exactly once. Weights sum to 1.00, so the score shares the 0.00-10.00 range of its inputs."
    note: |
      Reference values: (8.00, 7.00, 6.00) => 3.20 + 2.45 + 1.50 = 7.15 => CONVERT.
      (7.00, 7.00, 7.00) => exactly 7.00 => CONVERT (the threshold is inclusive).
      (6.50, 7.00, 6.00) => 2.60 + 2.45 + 1.50 = 6.55 => DO_NOT_CONVERT.
      (7.00, 7.00, 7.02) => 7.0050 => 7.01 under ROUND_HALF_UP (binary float would
      round this to 7.00 and is therefore wrong). The endorse transition additionally
      refuses any review whose weighted_score < 7.00.

  - name: admin_fee_accrual
    trigger: "POST /gpo/admin-fee-distributions, to set accrued_fee_cents"
    algorithm: aggregation
    formula: |
      # Per-line fee, rounded per line, then summed. The rounding boundary is the LINE.
      accrued_fee_cents = 0
      for line in eligible_lines ordered by (PurchaseLine.purchase_date ASC, PurchaseLine.created_at ASC):
          line_fee = round_half_up(
              Decimal(line.extended_cost_cents) * Decimal(Contract.admin_fee_bps) / Decimal(10000), 0)
          accrued_fee_cents += line_fee
    input_set: "PurchaseLines with reject_reason == NONE and classification == ON_CONTRACT belonging to LOADED DistributorFiles of this contract (any member) whose [period_start, period_end) is contained in the distribution's [period_start, period_end). PARTIALLY_LOADED and REVERSED files, leakage lines and unmatched lines never earn an administrative fee."
    constants:
      BPS_DENOMINATOR: 10000
    precision: "ROUND_HALF_UP to 0 decimal places ONCE PER LINE, then exact integer addition. Rounding the aggregate instead of each line is a different number and is wrong."
    note: |
      Mode-b combinatorial shape: identical inputs, different rounding boundary.
      Reference: two lines of extended_cost_cents 1150 at admin_fee_bps 300 give
      round(34.5) + round(34.5) = 35 + 35 = 70; the sum-then-round order would give
      round(69.0) = 69. The ordering clause is stated for reproducibility of any
      per-line audit listing; integer addition is order-insensitive, and the order
      never falls back to id.

  - name: distribution_holdback
    trigger: "POST /gpo/admin-fee-distributions/{distribution_id}/distribute, before the waterfall"
    algorithm: threshold
    formula: |
      # STEP 1 — the gross pool depends on the basis, and NOTHING downstream re-derives it.
      gross_pool_cents = accrued_fee_cents  if basis == ACCRUAL
                         collected_fee_cents if basis == COLLECTED

      # STEP 2 — the holdback ladder is keyed on the GROSS pool, never on the net pool
      #          and never on the member pool. Entries are read in descending
      #          min_gross_pool_cents order and the first satisfied row wins.
      row = the entry of Contract.holdback_tiers[] with the greatest
            min_gross_pool_cents such that gross_pool_cents >= min_gross_pool_cents
            (no row satisfied => holdback_bps_applied = 0)
      holdback_bps_applied = row.holdback_bps (or 0)

      # STEP 3 — one rounding, on the holdback itself.
      holdback_cents = round_half_up(
          Decimal(gross_pool_cents) * Decimal(holdback_bps_applied) / Decimal(10000), 0)
      net_pool_cents = gross_pool_cents - holdback_cents

      # STEP 4 — the member share of the net pool, again exactly one rounding.
      member_pool_cents = round_half_up(
          Decimal(net_pool_cents) * Decimal(Contract.member_share_bps) / Decimal(10000), 0)
    input_set: "One AdminFeeDistribution plus its Contract's holdback_tiers[], admin_fee_bps-derived accrual and member_share_bps. No member data participates in this stage."
    constants:
      BPS_DENOMINATOR: 10000
    precision: "Two roundings only, both ROUND_HALF_UP to 0 decimal places, in this fixed order: holdback off gross, then member pool off net. Any other order (member share first, or holdback keyed on net) yields a different, wrong number."
    variants:
      - name: ACCRUAL
        when: "Contract.share_basis == ACCRUAL — the distribute action fires straight from status ACCRUED"
        difference: "gross_pool_cents := accrued_fee_cents, the full fee earned in the period whether or not the supplier has paid it. The holdback ladder is keyed on this larger pool, so a contract on the accrual basis can land on a higher holdback tier than the same contract on the collected basis."
      - name: COLLECTED
        when: "Contract.share_basis == COLLECTED — the distribute action fires from status COLLECTED, after a collect recorded what the supplier actually remitted"
        difference: "gross_pool_cents := collected_fee_cents, which is <= accrued_fee_cents. Members share only cash in hand; the shortfall is simply never distributed and is not carried forward."
    note: |
      Mode-c combinatorial shape: the pinned step ORDER is the whole difficulty.
      Reference with holdback_tiers [{min_gross_pool_cents 0, holdback_bps 0},
      {min_gross_pool_cents 100000, holdback_bps 250}] and member_share_bps 6000:
      gross 100,200 => ladder row 250 bps => holdback 2505 => net 97,695 =>
      member_pool 58,617. Keying the ladder on the NET pool instead would pick the
      0-bps row and yield member_pool 60,120 — the counterfactual that proves the
      order. Dual-variant reference on the same period: accrued 142,500 with basis
      ACCRUAL => holdback round(3562.5) = 3563, net 138,937, member_pool 83,362;
      collected 100,200 with basis COLLECTED => holdback 2505, net 97,695,
      member_pool 58,617.

  - name: distribution_waterfall
    trigger: "POST /gpo/admin-fee-distributions/{distribution_id}/distribute, after distribution_holdback"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 — eligible members, and the weight each one carries.
      eligible = Commitments of this Contract with election_status == ACTIVE,
                 lop_status == COUNTERSIGNED,
                 leakage_flag == false, and
                 ytd_on_contract_spend_cents > 0
      total_weight = sum(c.ytd_on_contract_spend_cents for c in eligible)

      # STEP 2 — empty basis: nobody is eligible, or every eligible weight is zero.
      if eligible is empty or total_weight == 0:
          member_shares            = []
          member_share_total_cents = 0
          undistributed_cents      = member_pool_cents
          # gpo_retained_cents = gross_pool_cents - 0 - member_pool_cents
          return

      # STEP 3 — floor allocation, exact rational shares.
      for c in eligible:
          exact_c  = Decimal(member_pool_cents) * Decimal(c.ytd_on_contract_spend_cents) / Decimal(total_weight)
          floor_c  = floor(exact_c)
          frac_c   = exact_c - floor_c
      allocated = sum(floor_c)
      remainder = member_pool_cents - allocated        # 0 <= remainder < len(eligible)

      # STEP 4 — hand out the remainder one cent at a time, largest fractional part
      #          first; ties broken by the member's created_at ASC (never by id).
      order = eligible sorted by frac_c DESC, then Member.created_at ASC
      give one extra cent to each of the first `remainder` entries of `order`

      member_shares = [ { member_id, commitment_id, weight_cents: ytd_on_contract_spend_cents,
                          share_cents } for c in eligible ]
                      ordered by share_cents DESC, then Member.created_at ASC
      member_share_total_cents = sum(share_cents)      # == member_pool_cents exactly
      undistributed_cents      = member_pool_cents - member_share_total_cents   # 0 here
    input_set: "Commitments of the distribution's contract that are ACTIVE, COUNTERSIGNED, not leakage-flagged and carrying positive ytd_on_contract_spend_cents. Terminated commitments, unsigned letters of participation and leakage-flagged members are excluded even though their spend produced the fee."
    constants: {}
    precision: "Exact Decimal division, floor per member, then integer remainder distribution. The sum of shares equals member_pool_cents to the cent whenever at least one member is eligible; no share is ever rounded up and then reconciled."
    note: |
      Reference two-member case with member_pool_cents 58,617 and weights 4,750,000
      and 1,900,000 (total 6,650,000): exact shares 41,869.28... and 16,747.71...
      => floors 41,869 + 16,747 = 58,616, remainder 1 cent to the larger fractional
      part (0.714 > 0.285) => 41,869 and 16,748. Empty-basis reference: gross 70 with
      holdback_bps_applied 0 and member_share_bps 6000 gives member_pool 42; with no
      eligible member the row settles to member_share_total_cents 0,
      undistributed_cents 42, gpo_retained_cents 28 — and 0 + 42 + 28 == 70.

# ─────────────────────────────────────────────────────────────────────────────
# §1.4 Validation Rules (evaluated strictly in ascending priority; the first
#      violated rule's error_id is returned and no later rule is evaluated)
# ─────────────────────────────────────────────────────────────────────────────
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header is present and non-empty on every request except POST /gpo/_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-Role header is present, is one of the six roles in §1.7, and that role is permitted for the requested operation"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For the entity_backed role MemberMaterialsManager, X-User-ID must equal the member_id the operation touches (body member_id on create, or the member_id reachable from the path resource on every other call)"
    error_id: ERR_MEMBER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /gpo/commitments, POST /gpo/item-cross-references, POST /gpo/price-activations (activation_type LOCAL_EXCEPTION), POST /gpo/commitments/{commitment_id}/lop/sign, GET /gpo/commitments/{commitment_id}/leakage-report"
  - priority: 4
    category: existence
    check: "Every path id resolves to an existing row, validated left to right: contract_id, then contract_item_id, then member_id, then commitment_id, then xref_id, then activation_id, then file_id, then measurement_id, then distribution_id, then review_id, then purchase_line_id"
    error_id: ERR_CONTRACT_NOT_FOUND | ERR_CONTRACT_ITEM_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_XREF_NOT_FOUND | ERR_ACTIVATION_NOT_FOUND | ERR_FILE_NOT_FOUND | ERR_MEASUREMENT_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_PURCHASE_LINE_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints"
  - priority: 5
    category: existence
    check: "Every foreign key in the request body resolves to an existing row, validated in body-declaration order (contract_id, member_id, contract_item_id, commitment_id)"
    error_id: ERR_CONTRACT_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_CONTRACT_ITEM_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys"
  - priority: 6
    category: existence
    check: "Request body parses, every required field is present, every enum value is a declared member, every integer field is an integer within its declared range, every date/timestamp is ISO-8601, and every decimal carries at most its declared scale"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 7
    category: state
    check: "The parent Contract is in the state the operation requires: ACTIVE for commitment election, cross-reference proposal, activation create/activate, distributor file receipt and fee accrual; DRAFT for tier-ladder edits"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /gpo/commitments, POST /gpo/item-cross-references, POST /gpo/price-activations, POST /gpo/price-activations/{activation_id}/activate, POST /gpo/distributor-files, POST /gpo/admin-fee-distributions, PATCH /gpo/contracts/{contract_id}/tiers"
  - priority: 8
    category: state
    check: "The path resource itself is in a state from which the requested transition exists (see §1.2); this covers activation status, file status, measurement status, distribution status, review status, cross-reference status, election_status and lop_status"
    error_id: ERR_INVALID_ACTIVATION_STATE | ERR_INVALID_FILE_STATE | ERR_INVALID_MEASUREMENT_STATE | ERR_INVALID_DISTRIBUTION_STATE | ERR_INVALID_REVIEW_STATE | ERR_XREF_NOT_PROPOSED | ERR_COMMITMENT_NOT_ACTIVE | ERR_INVALID_LOP_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    check: "expected_<parent>_version in the body equals the parent's current version (§1.2.1)"
    error_id: ERR_STALE_COMMITMENT_VERSION | ERR_STALE_CONTRACT_VERSION
    http_status: 412
    applies_to: "POST /gpo/compliance-measurements, PATCH /gpo/contract-items/{contract_item_id}/base-price"
  - priority: 10
    category: business_safety
    check: "An item flagged requires_evidence may only be activated when its contract carries a ClinicalEvidenceReview in status ENDORSED with conversion_recommendation == CONVERT; and a category conversion (PATCH /gpo/contracts/{contract_id}/tiers on an ACTIVE contract) requires the same"
    error_id: ERR_CLINICAL_REVIEW_NOT_ENDORSED
    http_status: 409
    applies_to: "POST /gpo/price-activations/{activation_id}/activate, PATCH /gpo/contracts/{contract_id}/tiers"
  - priority: 11
    category: business_safety
    check: "The user endorsing a clinical evidence review is not the user who submitted it, and the user approving a local pricing exception is not the user who endorsed it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /gpo/clinical-evidence-reviews/{review_id}/endorse, POST /gpo/price-activations/{activation_id}/approve"
  - priority: 12
    category: business_safety
    check: "A clinical evidence review may not be endorsed while its weighted_score is below CONVERT_THRESHOLD (7.00), and may not re-enter review more than MAX_REVISION_ROUNDS (2) times"
    error_id: ERR_EVIDENCE_SCORE_BELOW_THRESHOLD | ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /gpo/clinical-evidence-reviews/{review_id}/endorse, POST /gpo/clinical-evidence-reviews/{review_id}/request-revision"
  - priority: 13
    category: business_referential
    check: "The referenced rows belong together: a ContractItem referenced by an activation belongs to the commitment's contract; a member_item_number referenced by a cross-reference exists in that Member's item_master; an activation may only be activated once an APPROVED ItemCrossReference links the member to the item"
    error_id: ERR_ITEM_CONTRACT_MISMATCH | ERR_MEMBER_ITEM_NOT_IN_MASTER | ERR_XREF_NOT_APPROVED
    http_status: 409
    applies_to: "POST /gpo/price-activations, POST /gpo/item-cross-references, POST /gpo/price-activations/{activation_id}/activate"
  - priority: 14
    category: business_referential
    check: "Cross-entity readiness for the requalification cascade: a measurement may only be finalized while its Commitment.election_status == REQUAL_REVIEW, and a local exception may not be endorsed or approved while its Commitment.election_status == REQUAL_REVIEW"
    error_id: ERR_COMMITMENT_NOT_IN_REQUAL_REVIEW | ERR_REQUALIFICATION_IN_PROGRESS
    http_status: 409
    applies_to: "POST /gpo/compliance-measurements/{measurement_id}/finalize, POST /gpo/price-activations/{activation_id}/endorse, POST /gpo/price-activations/{activation_id}/approve"
  - priority: 15
    category: business_constraint
    check: "Uniqueness: one non-terminated Commitment per (member_id, contract_id); one APPROVED ItemCrossReference per (member_id, contract_item_id) and per (member_id, member_item_number); one non-superseded ComplianceMeasurement per (commitment_id, period_start, period_end); one non-reversed AdminFeeDistribution per (contract_id, period_start, period_end); one tier_code per Contract.tiers[] entry"
    error_id: ERR_DUPLICATE_COMMITMENT | ERR_DUPLICATE_XREF | ERR_DUPLICATE_MEASUREMENT_PERIOD | ERR_DUPLICATE_DISTRIBUTION_PERIOD | ERR_DUPLICATE_TIER_CODE
    http_status: 409
    applies_to: "POST /gpo/commitments, POST /gpo/item-cross-references, POST /gpo/item-cross-references/{xref_id}/approve, POST /gpo/compliance-measurements, POST /gpo/admin-fee-distributions, PATCH /gpo/contracts/{contract_id}/tiers"
  - priority: 16
    category: business_constraint
    check: "Referenced enum-like codes exist in their ladder: elected_tier_code and tier_code_at_activation appear in Contract.tiers[].tier_code, and Contract.default_tier_code appears there too"
    error_id: ERR_TIER_CODE_UNKNOWN
    http_status: 409
    applies_to: "POST /gpo/commitments, POST /gpo/price-activations, PATCH /gpo/contracts/{contract_id}/tiers, POST /gpo/contracts/{contract_id}/activate"
  - priority: 17
    category: business_temporal
    check: "effective_to >= effective_from on a PriceActivation and period_end strictly after period_start on a DistributorFile, ComplianceMeasurement, AdminFeeDistribution or leakage-report query"
    error_id: ERR_EFFECTIVE_WINDOW_INVALID
    http_status: 409
    applies_to: "POST /gpo/price-activations, POST /gpo/distributor-files, POST /gpo/compliance-measurements, POST /gpo/admin-fee-distributions, GET /gpo/commitments/{commitment_id}/leakage-report"
  - priority: 18
    category: business_temporal
    check: "A PriceActivation window lies inside its Contract's [effective_from, effective_to]"
    error_id: ERR_PERIOD_OUTSIDE_CONTRACT_TERM
    http_status: 409
    applies_to: "POST /gpo/price-activations"
  - priority: 19
    category: business_temporal
    check: "No DistributorFile with the same (member_id, contract_id, distributor_code) and status outside {REJECTED, REVERSED} has a HALF-OPEN [period_start, period_end) collision with the new file; abutting periods where one ends exactly where the next begins are permitted"
    error_id: ERR_FILE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /gpo/distributor-files"
  - priority: 20
    category: business_temporal
    check: "No PriceActivation with the same (commitment_id, contract_item_id, activation_type) and status in {DRAFT, ENDORSED, APPROVED, ACTIVE} has a FULLY CLOSED [effective_from, effective_to] collision with the new window; sharing a single endpoint date is a collision"
    error_id: ERR_ACTIVATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /gpo/price-activations"
  - priority: 21
    category: business_fiscal
    check: "requested_price_cents is supplied for a LOCAL_EXCEPTION activation and omitted for a TIER_PRICE activation"
    error_id: ERR_REQUESTED_PRICE_REQUIRED | ERR_REQUESTED_PRICE_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /gpo/price-activations"
  - priority: 22
    category: business_fiscal
    check: "committed_volume_units on a commitment election is at least the min_committed_volume_units of the elected tier"
    error_id: ERR_COMMITTED_VOLUME_BELOW_TIER
    http_status: 409
    applies_to: "POST /gpo/commitments"
  - priority: 23
    category: business_fiscal
    check: "A new base price is a positive integer not below the item's floor_price_cents"
    error_id: ERR_BASE_PRICE_BELOW_FLOOR
    http_status: 409
    applies_to: "PATCH /gpo/contract-items/{contract_item_id}/base-price"
  - priority: 24
    category: business_fiscal
    check: "collected_fee_cents does not exceed accrued_fee_cents, and the distribute action matches Contract.share_basis"
    error_id: ERR_COLLECTION_EXCEEDS_ACCRUAL | ERR_DISTRIBUTION_BASIS_MISMATCH | ERR_DISTRIBUTION_BASIS_NOT_COLLECTABLE
    http_status: 409
    applies_to: "POST /gpo/admin-fee-distributions/{distribution_id}/collect, POST /gpo/admin-fee-distributions/{distribution_id}/distribute"

validation_priority_conflicts:
  - name: contract_state_beats_tier_volume_floor
    lower_priority_rule: "priority 22 (business_fiscal) — committed_volume_units below the elected tier's min_committed_volume_units → ERR_COMMITTED_VOLUME_BELOW_TIER"
    higher_priority_rule: "priority 7 (state) — the parent Contract is still DRAFT → ERR_CONTRACT_NOT_ACTIVE"
    scenario: |
      POST /gpo/commitments naming a DRAFT contract AND electing TIER_2 with
      committed_volume_units 100 (TIER_2 requires 5000). Both rules are violated by
      the same request.
    expected_error_id: ERR_CONTRACT_NOT_ACTIVE
    expected_http_status: 409
    rationale: "A contract that has not been activated has no binding tier ladder to measure a commitment against, so the state check fires first and the fiscal floor is never reached."
  - name: clinical_safety_beats_xref_referential
    lower_priority_rule: "priority 13 (business_referential) — no APPROVED ItemCrossReference for (member, item) → ERR_XREF_NOT_APPROVED"
    higher_priority_rule: "priority 10 (business_safety) — the item requires_evidence and the contract has no ENDORSED/CONVERT review → ERR_CLINICAL_REVIEW_NOT_ENDORSED"
    scenario: |
      POST /gpo/price-activations/{activation_id}/activate on a DRAFT TIER_PRICE
      activation whose ContractItem.requires_evidence is true, where the contract's
      only ClinicalEvidenceReview is still UNDER_REVIEW AND the member's cross
      reference for that item is still PROPOSED. Both rules are violated.
    expected_error_id: ERR_CLINICAL_REVIEW_NOT_ENDORSED
    expected_http_status: 409
    rationale: "Clinical safety outranks catalog hygiene: an unproven item must not be priced for anybody, so the missing evidence is reported even though the cross-reference is also unusable."
  - name: temporal_overlap_beats_fiscal_price_shape
    lower_priority_rule: "priority 21 (business_fiscal) — requested_price_cents supplied on a TIER_PRICE activation → ERR_REQUESTED_PRICE_NOT_ALLOWED"
    higher_priority_rule: "priority 20 (business_temporal) — the closed window collides with an existing DRAFT/ENDORSED/APPROVED/ACTIVE row for the same (commitment, item, activation_type) → ERR_ACTIVATION_PERIOD_OVERLAP"
    scenario: |
      POST /gpo/price-activations with activation_type TIER_PRICE, a
      requested_price_cents value that TIER_PRICE forbids, AND an effective window
      whose effective_from equals the effective_to of an existing ACTIVE TIER_PRICE
      activation for the same (commitment_id, contract_item_id). Both rules are
      violated.
    expected_error_id: ERR_ACTIVATION_PERIOD_OVERLAP
    expected_http_status: 409
    rationale: "The temporal ladder is what makes any price meaningful — a second price covering the same day cannot be reconciled at all — so the window conflict is reported before the body-shape complaint about requested_price_cents."

# ─────────────────────────────────────────────────────────────────────────────
# §1.5 API Endpoints (every path lives under the /gpo prefix)
# ─────────────────────────────────────────────────────────────────────────────
endpoints:
  # ── logical clock (test-driving endpoint, /_ namespace) ────────────────────
  - method: POST
    path: "/gpo/_clock/set_current_utc"
    description: "Sets the server's logical clock to an exact instant. The clock's startup default is 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Every date-window comparison, every loaded_at stamp and every cascade replacement's effective_from reads this clock."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["logical clock set to current_utc; no entity is modified"]

  # ── Contract ──────────────────────────────────────────────────────────────
  - method: POST
    path: "/gpo/contracts"
    description: "Registers a supplier contract in DRAFT with its tier ladder and administrative-fee holdback ladder."
    roles: [ContractManager]
    code: 201
    input: [contract_code, supplier_name, category_code, effective_from, effective_to, admin_fee_bps, member_share_bps, tiers, holdback_tiers, "requires_clinical_review?", "share_basis?", "leakage_alert_threshold_pct?"]
    output: Contract
    side_effects: ["Contract created with status DRAFT, evidence_endorsed false, active_commitment_count 0", "default_tier_code derived from the tiers[] entry whose min_committed_volume_units == 0 and min_compliance_pct == 0.00"]
  - method: GET
    path: "/gpo/contracts/{contract_id}"
    description: "Reads one contract with its tier ladder, holdback ladder and derived counters."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/gpo/contracts"
    description: "Lists contracts, newest last, filterable by status and category."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: ["status?", "category_code?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: PATCH
    path: "/gpo/contracts/{contract_id}/tiers"
    description: "Replaces the contract's tier ladder. On a DRAFT contract this is ordinary setup; on an ACTIVE contract it is a category conversion and requires an ENDORSED clinical evidence review recommending CONVERT."
    roles: [ContractManager]
    code: 200
    input: [tiers]
    output: Contract
    side_effects: ["Contract.tiers replaced", "Contract.default_tier_code re-derived", "increments Contract.version by 1"]
  - method: POST
    path: "/gpo/contracts/{contract_id}/activate"
    description: "Moves a DRAFT contract to ACTIVE, opening it for commitment elections, cross-references, price activations, distributor files and fee accrual."
    roles: [ContractManager]
    code: 200
    input: []
    output: Contract
    side_effects: ["Contract.status := ACTIVE", "increments Contract.version by 1"]
  - method: POST
    path: "/gpo/contracts/{contract_id}/suspend"
    description: "Suspends an ACTIVE contract. SUSPENDED is terminal: the contract can never be reinstated."
    roles: [ComplianceAnalyst]
    code: 200
    input: ["reason?"]
    output: Contract
    side_effects: ["Contract.status := SUSPENDED", "increments Contract.version by 1"]

  # ── ContractItem ──────────────────────────────────────────────────────────
  - method: POST
    path: "/gpo/contracts/{contract_id}/items"
    description: "Adds an item to a contract catalog with its base price, contractual floor price and evidence flag."
    roles: [ContractManager]
    code: 201
    input: [vendor_item_number, item_description, uom, units_per_uom, base_price_cents, floor_price_cents, "requires_evidence?"]
    output: ContractItem
    side_effects: ["ContractItem created with status ACTIVE and active_activation_count 0"]
  - method: GET
    path: "/gpo/contract-items"
    description: "Lists catalog items, filterable by contract (FK reverse-reachability for ContractItem.contract_id) and status."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: ContractItem[]
    side_effects: []
  - method: GET
    path: "/gpo/contract-items/{contract_item_id}"
    description: "Reads one catalog item, including its recomputed active_activation_count and version."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: []
    output: ContractItem
    side_effects: []
  - method: PATCH
    path: "/gpo/contract-items/{contract_item_id}/base-price"
    description: "Reprices a catalog item. Guarded by optimistic concurrency on the parent contract: expected_contract_version must equal the current Contract.version."
    roles: [ContractManager]
    code: 200
    input: [base_price_cents, expected_contract_version]
    output: ContractItem
    side_effects: ["ContractItem.base_price_cents := base_price_cents", "increments Contract.version by 1", "increments ContractItem.version by 1", "already-created PriceActivations keep their stored computed_price_cents; only activations minted after this call see the new base price"]
  - method: POST
    path: "/gpo/contract-items/{contract_item_id}/delist"
    description: "Delists a catalog item so no new cross-reference or activation can name it. Existing ACTIVE activations are untouched."
    roles: [ContractManager]
    code: 200
    input: ["reason?"]
    output: ContractItem
    side_effects: ["ContractItem.status := DELISTED", "increments ContractItem.version by 1"]

  # ── Member ────────────────────────────────────────────────────────────────
  - method: POST
    path: "/gpo/members"
    description: "Registers a member facility with its aggregation group and its item master."
    roles: [ContractManager]
    code: 201
    input: [member_code, name, aggregation_group_code, item_master]
    output: Member
    side_effects: ["Member created with status ACTIVE, watchlist_status NONE, fee_credit_balance_cents 0"]
  - method: GET
    path: "/gpo/members/{member_id}"
    description: "Reads one member, including watchlist_status and fee_credit_balance_cents."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/gpo/members"
    description: "Lists members, filterable by status, watchlist_status and aggregation group."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: ["status?", "watchlist_status?", "aggregation_group_code?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: PATCH
    path: "/gpo/members/{member_id}/item-master"
    description: "Replaces the member's item master. Cross-references already APPROVED against a removed member_item_number keep working; new cross-references must name a current entry."
    roles: [MemberMaterialsManager]
    code: 200
    input: [item_master]
    output: Member
    side_effects: ["Member.item_master replaced", "increments Member.version by 1"]
  - method: POST
    path: "/gpo/members/{member_id}/suspend"
    description: "Suspends a member so no new commitment election or distributor file can name it."
    roles: [ComplianceAnalyst]
    code: 200
    input: ["reason?"]
    output: Member
    side_effects: ["Member.status := SUSPENDED", "increments Member.version by 1"]

  # ── ClinicalEvidenceReview ────────────────────────────────────────────────
  - method: POST
    path: "/gpo/clinical-evidence-reviews"
    description: "Submits a clinical evidence dossier for a contract's category. The weighted score and conversion recommendation are computed on submission."
    roles: [ClinicalReviewer]
    code: 201
    input: [contract_id, clinical_efficacy_score, safety_score, supply_resilience_score, "summary?"]
    output: ClinicalEvidenceReview
    side_effects: ["ClinicalEvidenceReview created with status UNDER_REVIEW, revision_round 0, submitted_by_user_id := X-User-ID", "weighted_score and conversion_recommendation computed per calculations.evidence_weighted_score"]
  - method: GET
    path: "/gpo/clinical-evidence-reviews/{review_id}"
    description: "Reads one evidence review with its weighted score, recommendation, revision round and audit user ids."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: []
    output: ClinicalEvidenceReview
    side_effects: []
  - method: GET
    path: "/gpo/clinical-evidence-reviews"
    description: "Lists evidence reviews, filterable by contract (FK reverse-reachability for ClinicalEvidenceReview.contract_id) and status."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: ClinicalEvidenceReview[]
    side_effects: []
  - method: PATCH
    path: "/gpo/clinical-evidence-reviews/{review_id}/scores"
    description: "Revises the three evidence scores while the review is UNDER_REVIEW or REVISION_REQUESTED, re-scoring the dossier."
    roles: [ClinicalReviewer]
    code: 200
    input: [clinical_efficacy_score, safety_score, supply_resilience_score]
    output: ClinicalEvidenceReview
    side_effects: ["the three score fields replaced", "weighted_score and conversion_recommendation recomputed per calculations.evidence_weighted_score", "increments ClinicalEvidenceReview.version by 1"]
  - method: POST
    path: "/gpo/clinical-evidence-reviews/{review_id}/request-revision"
    description: "Sends an UNDER_REVIEW dossier back for revision, consuming one revision round. Refused once revision_round has reached 2."
    roles: [ClinicalReviewer]
    code: 200
    input: ["reason?"]
    output: ClinicalEvidenceReview
    side_effects: ["ClinicalEvidenceReview.status := REVISION_REQUESTED", "ClinicalEvidenceReview.revision_round += 1", "increments ClinicalEvidenceReview.version by 1"]
  - method: POST
    path: "/gpo/clinical-evidence-reviews/{review_id}/resubmit"
    description: "Returns a REVISION_REQUESTED dossier to UNDER_REVIEW with revised scores. The resubmitting reviewer becomes the new submitted_by_user_id, so segregation of duties is re-evaluated against whoever resubmitted last."
    roles: [ClinicalReviewer]
    code: 200
    input: [clinical_efficacy_score, safety_score, supply_resilience_score, "summary?"]
    output: ClinicalEvidenceReview
    side_effects: ["ClinicalEvidenceReview.status := UNDER_REVIEW", "the three score fields overwritten with the resubmitted values", "weighted_score and conversion_recommendation recomputed per calculations.evidence_weighted_score", "submitted_by_user_id := X-User-ID", "revision_round is NOT incremented here; the counter is consumed by request-revision", "increments ClinicalEvidenceReview.version by 1"]
  - method: POST
    path: "/gpo/clinical-evidence-reviews/{review_id}/endorse"
    description: "Endorses an UNDER_REVIEW dossier. Requires a weighted_score of at least 7.00 and a different user than the submitter."
    roles: [ClinicalReviewer]
    code: 200
    input: []
    output: ClinicalEvidenceReview
    side_effects: ["ClinicalEvidenceReview.status := ENDORSED", "endorsed_by_user_id := X-User-ID", "recomputes Contract.evidence_endorsed and increments Contract.version by 1"]
  - method: POST
    path: "/gpo/clinical-evidence-reviews/{review_id}/reject"
    description: "Rejects an UNDER_REVIEW dossier terminally."
    roles: [ClinicalReviewer]
    code: 200
    input: ["reason?"]
    output: ClinicalEvidenceReview
    side_effects: ["ClinicalEvidenceReview.status := REJECTED", "recomputes Contract.evidence_endorsed and increments Contract.version by 1"]

  # ── Commitment ────────────────────────────────────────────────────────────
  - method: POST
    path: "/gpo/commitments"
    description: "Elects a member onto an ACTIVE contract at a chosen tier with a committed volume."
    roles: [MemberMaterialsManager]
    code: 201
    input: [member_id, contract_id, elected_tier_code, committed_volume_units, effective_from]
    output: Commitment
    side_effects: ["Commitment created with election_status ELECTED, lop_status NOT_ISSUED, current_tier_code null, requalification_round 0, all ytd ledgers 0, leakage_flag false", "recomputes Contract.active_commitment_count and increments Contract.version by 1"]
  - method: GET
    path: "/gpo/commitments/{commitment_id}"
    description: "Reads one commitment with both state dimensions, its current tier and its year-to-date ledgers."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: []
    output: Commitment
    side_effects: []
  - method: GET
    path: "/gpo/commitments"
    description: "Lists commitments filtered by member and/or contract (FK reverse-reachability for Commitment.member_id and Commitment.contract_id)."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: ["member_id?", "contract_id?", "election_status?", "lop_status?", "limit?", "offset?"]
    output: Commitment[]
    side_effects: []
  - method: POST
    path: "/gpo/commitments/{commitment_id}/lop/issue"
    description: "Issues the letter of participation to the member, from NOT_ISSUED or after a void."
    roles: [ContractManager]
    code: 200
    input: []
    output: Commitment
    side_effects: ["Commitment.lop_status := ISSUED", "Commitment.signer_name := null", "increments Commitment.version by 1"]
  - method: POST
    path: "/gpo/commitments/{commitment_id}/lop/sign"
    description: "Records the member's signature on an ISSUED letter of participation."
    roles: [MemberMaterialsManager]
    code: 200
    input: [signer_name]
    output: Commitment
    side_effects: ["Commitment.lop_status := SIGNED", "Commitment.signer_name := signer_name", "increments Commitment.version by 1"]
  - method: POST
    path: "/gpo/commitments/{commitment_id}/lop/countersign"
    description: "Countersigns a SIGNED letter of participation, which is also what activates the election."
    roles: [ContractManager]
    code: 200
    input: []
    output: Commitment
    side_effects: ["Commitment.lop_status := COUNTERSIGNED", "Commitment.election_status := ACTIVE when it was ELECTED", "Commitment.current_tier_code := elected_tier_code", "increments Commitment.version by 1"]
  - method: POST
    path: "/gpo/commitments/{commitment_id}/lop/void"
    description: "Voids an ISSUED or SIGNED letter of participation so it can be re-issued. Refused once countersigned."
    roles: [ContractManager]
    code: 200
    input: ["reason?"]
    output: Commitment
    side_effects: ["Commitment.lop_status := VOID", "Commitment.signer_name := null", "election_status is untouched", "increments Commitment.version by 1"]
  - method: POST
    path: "/gpo/commitments/{commitment_id}/open-requalification"
    description: "Opens a requalification review on an ACTIVE commitment, which is the precondition for finalizing a compliance measurement."
    roles: [ComplianceAnalyst]
    code: 200
    input: ["reason?"]
    output: Commitment
    side_effects: ["Commitment.election_status := REQUAL_REVIEW", "increments Commitment.version by 1"]
  - method: POST
    path: "/gpo/commitments/{commitment_id}/terminate"
    description: "Terminates a commitment from ELECTED, ACTIVE or REQUAL_REVIEW, superseding its live price activations."
    roles: [ComplianceAnalyst]
    code: 200
    input: ["reason?"]
    output: Commitment
    side_effects: ["Commitment.election_status := TERMINATED", "every ACTIVE PriceActivation of this commitment moves to SUPERSEDED with no replacement", "recomputes ContractItem.active_activation_count for each touched item and increments that ContractItem.version by 1", "recomputes Contract.active_commitment_count and increments Contract.version by 1", "increments Commitment.version by 1"]
  - method: GET
    path: "/gpo/compliance-measurements"
    description: "Lists compliance measurements, filterable by commitment (FK reverse-reachability for ComplianceMeasurement.commitment_id) and status."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: ["commitment_id?", "status?", "limit?", "offset?"]
    output: ComplianceMeasurement[]
    side_effects: []
  - method: GET
    path: "/gpo/commitments/{commitment_id}/leakage-report"
    description: "Computed read: off-contract leakage for the commitment over a half-open window, with the top three leaking member item numbers."
    roles: [ComplianceAnalyst, ContractManager, MemberMaterialsManager]
    code: 200
    input: [from_date, to_date]
    output: { commitment_id: string, from_date: string, to_date: string, on_contract_spend_cents: integer, leakage_spend_cents: integer, unmatched_spend_cents: integer, denominator_cents: integer, leakage_pct: number, top_items: array }
    side_effects: []

  # ── ItemCrossReference ────────────────────────────────────────────────────
  - method: POST
    path: "/gpo/item-cross-references"
    description: "Proposes a cross-reference between a member item master number and a contract catalog item, with the conversion factor from member units to contract units."
    roles: [MemberMaterialsManager]
    code: 201
    input: [member_id, contract_item_id, member_item_number, match_type, conversion_factor]
    output: ItemCrossReference
    side_effects: ["ItemCrossReference created with status PROPOSED"]
  - method: GET
    path: "/gpo/item-cross-references/{xref_id}"
    description: "Reads one cross-reference with its status and approval audit id."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: []
    output: ItemCrossReference
    side_effects: []
  - method: GET
    path: "/gpo/item-cross-references"
    description: "Lists cross-references filtered by member and/or contract item (FK reverse-reachability for ItemCrossReference.member_id and ItemCrossReference.contract_item_id)."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: ["member_id?", "contract_item_id?", "status?", "limit?", "offset?"]
    output: ItemCrossReference[]
    side_effects: []
  - method: POST
    path: "/gpo/item-cross-references/{xref_id}/approve"
    description: "Approves a PROPOSED cross-reference, making the member's item number usable for on-contract classification."
    roles: [ContractManager]
    code: 200
    input: []
    output: ItemCrossReference
    side_effects: ["ItemCrossReference.status := APPROVED", "approved_by_user_id := X-User-ID", "increments ItemCrossReference.version by 1"]
  - method: POST
    path: "/gpo/item-cross-references/{xref_id}/reject"
    description: "Rejects a PROPOSED cross-reference terminally."
    roles: [ContractManager]
    code: 200
    input: ["reason?"]
    output: ItemCrossReference
    side_effects: ["ItemCrossReference.status := REJECTED", "reject_note := reason", "increments ItemCrossReference.version by 1"]

  # ── PriceActivation ───────────────────────────────────────────────────────
  - method: POST
    path: "/gpo/price-activations"
    description: "Requests a price activation for a (commitment, catalog item) pair over a closed effective window, either at the commitment's tier price or as a local pricing exception."
    roles: [ContractManager, MemberMaterialsManager]
    code: 201
    input: [commitment_id, contract_item_id, activation_type, effective_from, effective_to, "requested_price_cents?"]
    output: PriceActivation
    side_effects: ["PriceActivation created with status DRAFT and origin REQUEST", "tier_code_at_activation resolved from the commitment", "computed_price_cents and price_clamped computed per calculations.tier_activated_price"]
  - method: GET
    path: "/gpo/price-activations/{activation_id}"
    description: "Reads one price activation, including its computed price, clamp flag, supersede links and origin."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: []
    output: PriceActivation
    side_effects: []
  - method: GET
    path: "/gpo/price-activations"
    description: "Lists price activations filtered by commitment, catalog item, or either end of a supersede link (FK reverse-reachability for PriceActivation.commitment_id, contract_item_id, superseded_by_activation_id and replaces_activation_id). This is the only discovery channel for the replacement activations minted by the requalification cascade."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: ["commitment_id?", "contract_item_id?", "superseded_by_activation_id?", "replaces_activation_id?", "status?", "activation_type?", "origin?", "limit?", "offset?"]
    output: PriceActivation[]
    side_effects: []
  - method: POST
    path: "/gpo/price-activations/{activation_id}/endorse"
    description: "Endorses a DRAFT local pricing exception. Not available to tier-price activations, which skip straight to activation."
    roles: [ContractManager]
    code: 200
    input: []
    output: PriceActivation
    side_effects: ["PriceActivation.status := ENDORSED", "endorsed_by_user_id := X-User-ID", "increments PriceActivation.version by 1"]
  - method: POST
    path: "/gpo/price-activations/{activation_id}/approve"
    description: "Approves an ENDORSED local pricing exception. The approver must not be the endorser."
    roles: [ContractManager]
    code: 200
    input: []
    output: PriceActivation
    side_effects: ["PriceActivation.status := APPROVED", "approved_by_user_id := X-User-ID", "increments PriceActivation.version by 1"]
  - method: POST
    path: "/gpo/price-activations/{activation_id}/activate"
    description: "Activates a price: from DRAFT for a tier price, from APPROVED for a local exception. Requires an APPROVED cross-reference and, for an evidence-flagged item, an ENDORSED review recommending CONVERT."
    roles: [ContractManager]
    code: 200
    input: []
    output: PriceActivation
    side_effects: ["PriceActivation.status := ACTIVE", "recomputes ContractItem.active_activation_count and increments that ContractItem.version by 1", "increments PriceActivation.version by 1"]
  - method: POST
    path: "/gpo/price-activations/{activation_id}/deny"
    description: "Denies a DRAFT or ENDORSED local pricing exception terminally."
    roles: [ContractManager]
    code: 200
    input: ["reason?"]
    output: PriceActivation
    side_effects: ["PriceActivation.status := DENIED", "deny_note := reason", "increments PriceActivation.version by 1"]

  # ── DistributorFile and PurchaseLine ──────────────────────────────────────
  - method: POST
    path: "/gpo/distributor-files"
    description: "Receives a distributor purchase file for one member, contract and half-open period, creating one purchase line per submitted line. Each lines[] entry is an object {member_item_number: string, quantity_units: integer, unit_price_paid_cents: integer, purchase_date: string} and becomes exactly one PurchaseLine."
    roles: [DistributorAgent]
    code: 201
    input: [member_id, contract_id, distributor_code, period_start, period_end, lines]
    output: DistributorFile
    side_effects: ["DistributorFile created with status RECEIVED", "one PurchaseLine per lines[] entry with classification UNCLASSIFIED, reject_reason NONE, contract_units 0 and extended_cost_cents computed", "DistributorFile.line_count set"]
  - method: GET
    path: "/gpo/distributor-files/{file_id}"
    description: "Reads one distributor file with its status and its accepted/rejected line counters."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: []
    output: DistributorFile
    side_effects: []
  - method: GET
    path: "/gpo/distributor-files"
    description: "Lists distributor files filtered by member and/or contract (FK reverse-reachability for DistributorFile.member_id and DistributorFile.contract_id)."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: ["member_id?", "contract_id?", "distributor_code?", "status?", "limit?", "offset?"]
    output: DistributorFile[]
    side_effects: []
  - method: POST
    path: "/gpo/distributor-files/{file_id}/validate"
    description: "Validates a RECEIVED file's lines, stamping a reject_reason on each line outside the period or with zero quantity."
    roles: [DistributorAgent]
    code: 200
    input: []
    output: DistributorFile
    side_effects: ["DistributorFile.status := VALIDATING", "each PurchaseLine.reject_reason stamped (DATE_OUT_OF_PERIOD evaluated before ZERO_QUANTITY)", "accepted_line_count and rejected_line_count recomputed", "increments DistributorFile.version by 1"]
  - method: POST
    path: "/gpo/distributor-files/{file_id}/load"
    description: "Loads a VALIDATING file: classifies every accepted line, posts the member's year-to-date ledgers, and raises the leakage flag and member watchlist when the contract's leakage threshold is exceeded. Lands on LOADED, PARTIALLY_LOADED or REJECTED depending on the rejected/accepted line counts."
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: DistributorFile
    side_effects: ["every accepted PurchaseLine classified per calculations.purchase_line_classification", "DistributorFile.status := LOADED, PARTIALLY_LOADED or REJECTED; loaded_at stamped from the logical clock", "Commitment.ytd_on_contract_spend_cents, ytd_total_category_spend_cents and ytd_measured_volume_units incremented; increments Commitment.version by 1", "Commitment.leakage_flag raised when year-to-date leakage exceeds Contract.leakage_alert_threshold_pct", "Member.watchlist_status := WATCHLIST when the flag was raised; increments Member.version by 1", "increments DistributorFile.version by 1"]
  - method: POST
    path: "/gpo/distributor-files/{file_id}/reverse"
    description: "Reverses a LOADED or PARTIALLY_LOADED file, unwinding every ledger amount it posted and lowering the leakage flag and member watchlist when they are no longer warranted."
    roles: [ComplianceAnalyst]
    code: 200
    input: ["reason?"]
    output: DistributorFile
    side_effects: ["DistributorFile.status := REVERSED; reverse_note := reason", "the three Commitment ytd ledgers decremented by exactly the amounts this file posted; increments Commitment.version by 1", "Commitment.leakage_flag cleared when year-to-date leakage no longer exceeds the threshold", "Member.watchlist_status := NONE when no commitment of that member is flagged; increments Member.version by 1", "every PurchaseLine of the file reset to classification UNCLASSIFIED, contract_units 0, matched_vendor_item_number null", "increments DistributorFile.version by 1"]
  - method: GET
    path: "/gpo/purchase-lines"
    description: "Lists purchase lines with their classification, contract units and reject reason, filterable by file (FK reverse-reachability for PurchaseLine.distributor_file_id), classification and reject reason. Purchase lines are immutable records created only by the file receipt, so this list and the single-line read are their only discovery channels."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: ["distributor_file_id?", "classification?", "reject_reason?", "limit?", "offset?"]
    output: PurchaseLine[]
    side_effects: []
  - method: GET
    path: "/gpo/purchase-lines/{purchase_line_id}"
    description: "Reads one purchase line."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: []
    output: PurchaseLine
    side_effects: []

  # ── ComplianceMeasurement ─────────────────────────────────────────────────
  - method: POST
    path: "/gpo/compliance-measurements"
    description: "Opens a compliance measurement period for a commitment. Guarded by optimistic concurrency on the parent commitment: expected_commitment_version must equal the current Commitment.version."
    roles: [ComplianceAnalyst]
    code: 201
    input: [commitment_id, period_start, period_end, expected_commitment_version]
    output: ComplianceMeasurement
    side_effects: ["ComplianceMeasurement created with status DRAFT and every money/volume/pct field zeroed", "increments Commitment.version by 1"]
  - method: GET
    path: "/gpo/compliance-measurements/{measurement_id}"
    description: "Reads one compliance measurement with both the preliminary and the current compliance percentage, the qualified tier and which variant produced the stored figures."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: []
    output: ComplianceMeasurement
    side_effects: []
  - method: POST
    path: "/gpo/compliance-measurements/{measurement_id}/measure"
    description: "Runs the PRELIMINARY variant over the period: partially loaded files count and unmatched spend is excluded from the denominator. Retiers nobody."
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: ComplianceMeasurement
    side_effects: ["every money/volume field recomputed per calculations.compliance_measurement variant PRELIMINARY; computed_variant := PRELIMINARY", "preliminary_compliance_pct := the computed compliance_pct", "qualified_tier_code computed per calculations.tier_requalification", "ComplianceMeasurement.status := PRELIMINARY", "increments ComplianceMeasurement.version by 1"]
  - method: POST
    path: "/gpo/compliance-measurements/{measurement_id}/finalize"
    description: "Runs the FINAL variant and drives the requalification cascade: the commitment is retiered, its live tier-price activations are superseded and replaced at the new tier, each sibling local exception is re-derived under the new ceiling, and every touched catalog item's activation counter is recomputed. Requires the commitment to be in REQUAL_REVIEW, which is itself reachable only from a countersigned letter of participation."
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: ComplianceMeasurement
    side_effects: ["every money/volume field recomputed per calculations.compliance_measurement variant FINAL; computed_variant := FINAL; preliminary_compliance_pct preserved", "ComplianceMeasurement.status := FINAL", "Commitment.last_final_compliance_pct, current_tier_code and requalification_round updated; election_status := ACTIVE; increments Commitment.version by 1", "ACTIVE TIER_PRICE activations of the commitment superseded and replaced at the new tier price when the tier changed", "each ACTIVE LOCAL_EXCEPTION activation for a superseded (commitment, item) pair superseded and re-derived under the new tier ceiling", "ContractItem.active_activation_count recomputed once per touched item; increments that ContractItem.version by 1", "increments ComplianceMeasurement.version by 1"]
  - method: POST
    path: "/gpo/compliance-measurements/{measurement_id}/supersede"
    description: "Abandons a DRAFT or PRELIMINARY measurement. A FINAL measurement can never be superseded."
    roles: [ComplianceAnalyst]
    code: 200
    input: ["reason?"]
    output: ComplianceMeasurement
    side_effects: ["ComplianceMeasurement.status := SUPERSEDED", "no Commitment field changes", "increments ComplianceMeasurement.version by 1"]

  # ── AdminFeeDistribution ──────────────────────────────────────────────────
  - method: POST
    path: "/gpo/admin-fee-distributions"
    description: "Accrues the administrative fee earned by a contract over a period, rounding the fee per purchase line and then summing."
    roles: [FinanceAdministrator]
    code: 201
    input: [contract_id, period_start, period_end]
    output: AdminFeeDistribution
    side_effects: ["AdminFeeDistribution created with status ACCRUED and every pool/share field zeroed", "accrued_fee_cents computed per calculations.admin_fee_accrual"]
  - method: GET
    path: "/gpo/admin-fee-distributions/{distribution_id}"
    description: "Reads one distribution with its gross pool, holdback, net pool, member pool, per-member shares, undistributed remainder and GPO retention."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: []
    output: AdminFeeDistribution
    side_effects: []
  - method: GET
    path: "/gpo/admin-fee-distributions"
    description: "Lists fee distributions, filterable by contract (FK reverse-reachability for AdminFeeDistribution.contract_id) and status."
    roles: [ContractManager, ClinicalReviewer, ComplianceAnalyst, MemberMaterialsManager, DistributorAgent, FinanceAdministrator]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: AdminFeeDistribution[]
    side_effects: []
  - method: POST
    path: "/gpo/admin-fee-distributions/{distribution_id}/collect"
    description: "Records what the supplier actually remitted against an ACCRUED distribution. The remittance may not exceed the accrual."
    roles: [FinanceAdministrator]
    code: 200
    input: [collected_fee_cents]
    output: AdminFeeDistribution
    side_effects: ["AdminFeeDistribution.collected_fee_cents set", "AdminFeeDistribution.status := COLLECTED", "increments AdminFeeDistribution.version by 1"]
  - method: POST
    path: "/gpo/admin-fee-distributions/{distribution_id}/distribute"
    description: "Distributes the member share: keys the holdback ladder on the gross pool, takes the member share off the net pool, then allocates it across eligible commitments pro rata to on-contract spend with a floor-plus-remainder waterfall. Which gross pool applies is fixed by Contract.share_basis."
    roles: [FinanceAdministrator]
    code: 200
    input: []
    output: AdminFeeDistribution
    side_effects: ["basis and gross_pool_cents set from Contract.share_basis", "holdback_bps_applied, holdback_cents, net_pool_cents and member_pool_cents computed per calculations.distribution_holdback", "member_shares, member_share_total_cents and undistributed_cents computed per calculations.distribution_waterfall", "gpo_retained_cents := gross_pool_cents - member_share_total_cents - undistributed_cents", "each eligible Member.fee_credit_balance_cents credited by its share; increments that Member.version by 1", "AdminFeeDistribution.status := DISTRIBUTED", "increments AdminFeeDistribution.version by 1"]
  - method: POST
    path: "/gpo/admin-fee-distributions/{distribution_id}/reverse"
    description: "Reverses a DISTRIBUTED distribution: debits each member by exactly the share it was credited and returns the whole gross pool to undistributed, preserving the conservation identity."
    roles: [FinanceAdministrator]
    code: 200
    input: ["reason?"]
    output: AdminFeeDistribution
    side_effects: ["each member in member_shares debited by exactly its share_cents; increments that Member.version by 1", "holdback, net pool, member pool, member_shares, member_share_total_cents and gpo_retained_cents zeroed", "undistributed_cents := gross_pool_cents", "AdminFeeDistribution.status := REVERSED; reverse_note := reason", "increments AdminFeeDistribution.version by 1"]

# ─────────────────────────────────────────────────────────────────────────────
# §1.6 Error Code Catalog
# ─────────────────────────────────────────────────────────────────────────────
errors:
  # auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID header missing or empty on any endpoint other than POST /gpo/_clock/set_current_utc"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-Role missing, not one of the six declared roles, or not listed in the endpoint's roles"
  - id: ERR_MEMBER_SCOPE_VIOLATION
    http: 403
    condition: "A MemberMaterialsManager acts on a member other than the one its X-User-ID identifies"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The endorser of a clinical evidence review is also its submitter, or the approver of a local pricing exception is also its endorser"
  # existence
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract_id in the path or body matches no Contract"
  - id: ERR_CONTRACT_ITEM_NOT_FOUND
    http: 404
    condition: "contract_item_id in the path or body matches no ContractItem"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "member_id in the path or body matches no Member"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "commitment_id in the path or body matches no Commitment"
  - id: ERR_XREF_NOT_FOUND
    http: 404
    condition: "xref_id in the path matches no ItemCrossReference"
  - id: ERR_ACTIVATION_NOT_FOUND
    http: 404
    condition: "activation_id in the path matches no PriceActivation"
  - id: ERR_FILE_NOT_FOUND
    http: 404
    condition: "file_id in the path matches no DistributorFile"
  - id: ERR_MEASUREMENT_NOT_FOUND
    http: 404
    condition: "measurement_id in the path matches no ComplianceMeasurement"
  - id: ERR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "distribution_id in the path matches no AdminFeeDistribution"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "review_id in the path matches no ClinicalEvidenceReview"
  - id: ERR_PURCHASE_LINE_NOT_FOUND
    http: 404
    condition: "purchase_line_id in the path matches no PurchaseLine"
  # schema
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, unknown enum value, out-of-range number, malformed date, or a decimal carrying more places than its declared scale"
  - id: ERR_INVALID_TIER_LADDER
    http: 400
    condition: "tiers[] is empty, exceeds 5 entries, lacks the entry with min_committed_volume_units 0 and min_compliance_pct 0.00, or is not strictly increasing in discount_bps when sorted by min_committed_volume_units ASC (a repeated tier_code is ERR_DUPLICATE_TIER_CODE at priority 15, not a ladder-shape error)"
  - id: ERR_INVALID_HOLDBACK_LADDER
    http: 400
    condition: "holdback_tiers[] is empty, exceeds 4 entries, repeats a min_gross_pool_cents, carries a holdback_bps outside 0..1000, or is not non-decreasing in holdback_bps when sorted by min_gross_pool_cents ASC"
  # state
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "The parent Contract is not ACTIVE for an operation that requires an active contract, or is not DRAFT for a setup-only edit"
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 409
    condition: "The Member is SUSPENDED when electing a commitment or receiving a distributor file"
  - id: ERR_CONTRACT_ITEM_NOT_ACTIVE
    http: 409
    condition: "The ContractItem is DELISTED when proposing a cross-reference against it"
  - id: ERR_INVALID_REVIEW_STATE
    http: 409
    condition: "The requested evidence-review transition does not exist from the review's current status"
  - id: ERR_XREF_NOT_PROPOSED
    http: 409
    condition: "Approving or rejecting a cross-reference that is already APPROVED or REJECTED"
  - id: ERR_COMMITMENT_NOT_ELECTED
    http: 409
    condition: "Issuing or re-issuing a letter of participation on a commitment that is no longer ELECTED"
  - id: ERR_COMMITMENT_NOT_ACTIVE
    http: 409
    condition: "Opening a requalification on a commitment that is not ACTIVE, or opening a measurement on a commitment that is neither ACTIVE nor in REQUAL_REVIEW"
  - id: ERR_INVALID_LOP_STATE
    http: 409
    condition: "The requested letter-of-participation transition does not exist from the current lop_status, including any attempt to void a COUNTERSIGNED letter"
  - id: ERR_INVALID_ACTIVATION_STATE
    http: 409
    condition: "The requested price-activation transition does not exist from the activation's current status, or is not available for its activation_type"
  - id: ERR_INVALID_FILE_STATE
    http: 409
    condition: "The requested distributor-file transition does not exist from the file's current status"
  - id: ERR_INVALID_MEASUREMENT_STATE
    http: 409
    condition: "The requested measurement transition does not exist from the measurement's current status, including any attempt to supersede a FINAL measurement"
  - id: ERR_INVALID_DISTRIBUTION_STATE
    http: 409
    condition: "The requested distribution transition does not exist from the distribution's current status, including reversing an ACCRUED or COLLECTED row"
  # optimistic concurrency
  - id: ERR_STALE_COMMITMENT_VERSION
    http: 412
    condition: "expected_commitment_version does not equal the parent Commitment's current version on POST /gpo/compliance-measurements"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the parent Contract's current version on PATCH /gpo/contract-items/{contract_item_id}/base-price"
  # business — safety
  - id: ERR_CLINICAL_REVIEW_NOT_ENDORSED
    http: 409
    condition: "Activating a price for an item flagged requires_evidence, or converting an ACTIVE contract's tier ladder, without an ENDORSED ClinicalEvidenceReview recommending CONVERT"
  - id: ERR_EVIDENCE_SCORE_BELOW_THRESHOLD
    http: 409
    condition: "Endorsing an evidence review whose weighted_score is below 7.00"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "Requesting a revision on an evidence review whose revision_round is already 2"
  # business — referential
  - id: ERR_ITEM_CONTRACT_MISMATCH
    http: 409
    condition: "The referenced ContractItem belongs to a different contract than the commitment's"
  - id: ERR_MEMBER_ITEM_NOT_IN_MASTER
    http: 409
    condition: "member_item_number does not appear in that Member's item_master"
  - id: ERR_XREF_NOT_APPROVED
    http: 409
    condition: "Activating a price with no APPROVED ItemCrossReference linking the member to the catalog item"
  - id: ERR_COMMITMENT_NOT_IN_REQUAL_REVIEW
    http: 409
    condition: "Finalizing a measurement while its commitment's election_status is not REQUAL_REVIEW"
  - id: ERR_REQUALIFICATION_IN_PROGRESS
    http: 409
    condition: "Endorsing or approving a local pricing exception while its commitment is in REQUAL_REVIEW"
  # business — constraint / uniqueness
  - id: ERR_DUPLICATE_COMMITMENT
    http: 409
    condition: "A non-TERMINATED Commitment already exists for the same (member_id, contract_id)"
  - id: ERR_DUPLICATE_XREF
    http: 409
    condition: "An APPROVED ItemCrossReference already exists for the same (member_id, contract_item_id) or the same (member_id, member_item_number)"
  - id: ERR_DUPLICATE_MEASUREMENT_PERIOD
    http: 409
    condition: "A DRAFT, PRELIMINARY or FINAL ComplianceMeasurement already covers the same (commitment_id, period_start, period_end)"
  - id: ERR_DUPLICATE_DISTRIBUTION_PERIOD
    http: 409
    condition: "A non-REVERSED AdminFeeDistribution already covers the same (contract_id, period_start, period_end)"
  - id: ERR_DUPLICATE_TIER_CODE
    http: 409
    condition: "A submitted tier ladder repeats a tier_code"
  - id: ERR_TIER_CODE_UNKNOWN
    http: 409
    condition: "elected_tier_code, or a tier_code an activation must price against, does not appear in Contract.tiers[]"
  # business — temporal
  - id: ERR_EFFECTIVE_WINDOW_INVALID
    http: 409
    condition: "effective_to earlier than effective_from on an activation, or period_end not strictly after period_start on a file, measurement, distribution or leakage-report query"
  - id: ERR_PERIOD_OUTSIDE_CONTRACT_TERM
    http: 409
    condition: "A price activation window falls outside its contract's [effective_from, effective_to]"
  - id: ERR_FILE_PERIOD_OVERLAP
    http: 409
    condition: "A new distributor file's half-open period collides with an existing non-REJECTED, non-REVERSED file for the same (member_id, contract_id, distributor_code); abutting periods do not collide"
  - id: ERR_ACTIVATION_PERIOD_OVERLAP
    http: 409
    condition: "A new activation's closed window collides with an existing DRAFT, ENDORSED, APPROVED or ACTIVE activation for the same (commitment_id, contract_item_id, activation_type); sharing one endpoint date is a collision"
  # business — fiscal
  - id: ERR_REQUESTED_PRICE_REQUIRED
    http: 409
    condition: "activation_type LOCAL_EXCEPTION submitted without requested_price_cents"
  - id: ERR_REQUESTED_PRICE_NOT_ALLOWED
    http: 409
    condition: "activation_type TIER_PRICE submitted with requested_price_cents"
  - id: ERR_COMMITTED_VOLUME_BELOW_TIER
    http: 409
    condition: "committed_volume_units is below the elected tier's min_committed_volume_units"
  - id: ERR_BASE_PRICE_BELOW_FLOOR
    http: 409
    condition: "A new base price is below the item's floor_price_cents"
  - id: ERR_COLLECTION_EXCEEDS_ACCRUAL
    http: 409
    condition: "collected_fee_cents exceeds accrued_fee_cents"
  - id: ERR_DISTRIBUTION_BASIS_MISMATCH
    http: 409
    condition: "Distributing from a COLLECTED row while Contract.share_basis is ACCRUAL"
  - id: ERR_DISTRIBUTION_BASIS_NOT_COLLECTABLE
    http: 409
    condition: "Distributing directly from an ACCRUED row while Contract.share_basis is COLLECTED, i.e. before the remittance has been recorded"

# ─────────────────────────────────────────────────────────────────────────────
# §1.7 RBAC Matrix (segregation of duties)
# ─────────────────────────────────────────────────────────────────────────────
roles:
  - name: ContractManager
    description: "Contract portfolio owner: builds contracts and catalogs, approves cross-references, issues and countersigns letters of participation, and owns the price activation ladder."
    identity: "opaque"
    exclusive_operations:
      - "POST /gpo/contracts"
      - "PATCH /gpo/contracts/{contract_id}/tiers"
      - "POST /gpo/contracts/{contract_id}/activate"
      - "POST /gpo/contracts/{contract_id}/items"
      - "PATCH /gpo/contract-items/{contract_item_id}/base-price"
      - "POST /gpo/contract-items/{contract_item_id}/delist"
      - "POST /gpo/members"
      - "POST /gpo/item-cross-references/{xref_id}/approve"
      - "POST /gpo/item-cross-references/{xref_id}/reject"
      - "POST /gpo/commitments/{commitment_id}/lop/issue"
      - "POST /gpo/commitments/{commitment_id}/lop/countersign"
      - "POST /gpo/commitments/{commitment_id}/lop/void"
      - "POST /gpo/price-activations/{activation_id}/endorse"
      - "POST /gpo/price-activations/{activation_id}/approve"
      - "POST /gpo/price-activations/{activation_id}/activate"
      - "POST /gpo/price-activations/{activation_id}/deny"
    shared_operations:
      - "POST /gpo/price-activations (TIER_PRICE only; LOCAL_EXCEPTION belongs to MemberMaterialsManager)"
      - "POST /gpo/_clock/set_current_utc"
      - "GET /gpo/commitments/{commitment_id}/leakage-report"
      - "every GET endpoint"
  - name: ClinicalReviewer
    description: "Clinical evidence assessor: submits, re-scores, revises, endorses and rejects the evidence dossier that gates a category conversion. Endorsement is barred to the submitting user."
    identity: "opaque"
    exclusive_operations:
      - "POST /gpo/clinical-evidence-reviews"
      - "PATCH /gpo/clinical-evidence-reviews/{review_id}/scores"
      - "POST /gpo/clinical-evidence-reviews/{review_id}/request-revision"
      - "POST /gpo/clinical-evidence-reviews/{review_id}/resubmit"
      - "POST /gpo/clinical-evidence-reviews/{review_id}/endorse"
      - "POST /gpo/clinical-evidence-reviews/{review_id}/reject"
    shared_operations:
      - "POST /gpo/_clock/set_current_utc"
      - "every GET endpoint except GET /gpo/commitments/{commitment_id}/leakage-report"
  - name: ComplianceAnalyst
    description: "Compliance measurement owner: loads and reverses distributor files, opens requalifications, measures and finalizes periods, suspends contracts and members, and terminates commitments."
    identity: "opaque"
    exclusive_operations:
      - "POST /gpo/contracts/{contract_id}/suspend"
      - "POST /gpo/members/{member_id}/suspend"
      - "POST /gpo/commitments/{commitment_id}/open-requalification"
      - "POST /gpo/commitments/{commitment_id}/terminate"
      - "POST /gpo/distributor-files/{file_id}/load"
      - "POST /gpo/distributor-files/{file_id}/reverse"
      - "POST /gpo/compliance-measurements"
      - "POST /gpo/compliance-measurements/{measurement_id}/measure"
      - "POST /gpo/compliance-measurements/{measurement_id}/finalize"
      - "POST /gpo/compliance-measurements/{measurement_id}/supersede"
    shared_operations:
      - "POST /gpo/_clock/set_current_utc"
      - "GET /gpo/commitments/{commitment_id}/leakage-report"
      - "every GET endpoint"
  - name: MemberMaterialsManager
    description: "Acts for one member facility: maintains its item master, elects commitments, proposes cross-references, signs its letter of participation and requests local pricing exceptions. X-User-ID is that Member's id, and every write is scoped to it."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "PATCH /gpo/members/{member_id}/item-master"
      - "POST /gpo/commitments"
      - "POST /gpo/item-cross-references"
      - "POST /gpo/commitments/{commitment_id}/lop/sign"
    shared_operations:
      - "POST /gpo/price-activations (LOCAL_EXCEPTION only; TIER_PRICE belongs to ContractManager)"
      - "POST /gpo/_clock/set_current_utc"
      - "GET /gpo/commitments/{commitment_id}/leakage-report"
      - "every GET endpoint"
  - name: DistributorAgent
    description: "Distributor-side submitter: files purchase data for a member and contract period and validates its lines. Never sees compliance or fee outcomes as a writer."
    identity: "opaque"
    exclusive_operations:
      - "POST /gpo/distributor-files"
      - "POST /gpo/distributor-files/{file_id}/validate"
    shared_operations:
      - "POST /gpo/_clock/set_current_utc"
      - "every GET endpoint except GET /gpo/commitments/{commitment_id}/leakage-report"
  - name: FinanceAdministrator
    description: "Administrative fee owner: accrues the fee, records the supplier's remittance, distributes the member share and reverses a distribution. Cannot touch the compliance data the fee is computed from."
    identity: "opaque"
    exclusive_operations:
      - "POST /gpo/admin-fee-distributions"
      - "POST /gpo/admin-fee-distributions/{distribution_id}/collect"
      - "POST /gpo/admin-fee-distributions/{distribution_id}/distribute"
      - "POST /gpo/admin-fee-distributions/{distribution_id}/reverse"
    shared_operations:
      - "POST /gpo/_clock/set_current_utc"
      - "every GET endpoint except GET /gpo/commitments/{commitment_id}/leakage-report"
