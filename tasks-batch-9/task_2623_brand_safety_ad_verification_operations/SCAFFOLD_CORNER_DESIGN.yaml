      - name: claim_approval_and_rejection_forks_both_settle_their_own_batches
        claim_type: branching
        grounds:
          - state_machines.RefundClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.RefundClaim.UNDER_REVIEW_to_REJECTED
          - state_machines.MeasurementBatch.settlement_status.CLAIMED_to_CREDITED
          - state_machines.MeasurementBatch.settlement_status.CLAIMED_to_CLOSED_NO_CREDIT
          - calculations.claim_impression_basis
        distinguishing_aspect: |
          Two claims on the same campaign fork at review: the APPROVED branch
          must post an identical amount to both ledgers and move only ITS batch
          to CREDITED, while the REJECTED branch must leave both ledgers
          untouched and move only ITS batch to CLOSED_NO_CREDIT. Both branches
          decrement the same Campaign.open_claim_count, so a naive
          implementation that recomputes the counter instead of decrementing it
          double-counts one of the forks.
        test_recipe:
          setup:
