          - entities.Membership.fields.status
        distinguishing_aspect: |
          Entity pair AdmissionOrder -> Membership: a DRAFT order with a MEMBER ticket can only
          confirm when the referenced Membership.status==ACTIVE; a GRACE membership blocks the
          confirm with ERR_MEMBERSHIP_NOT_ACTIVE.
