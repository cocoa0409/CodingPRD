              payload: {}
              as: MemberDelegate
              as_user_id: "${m1_id}"
              captures: { err_id: $.data.error_id }
            - call: "GET /advocacy/members/${m2_id}/deductibility-notice"
              payload: {}
              as: MemberDelegate
              as_user_id: "${m2_id}"
          assert:
            - "Cross-member read: HTTP 403 with error_id ERR_MEMBER_SCOPE_VIOLATION"
            - "Self read: HTTP 200 with member_id == ${m2_id} and notice_method FLAT_FLOOR - proving only the identity, not the role, differed"
