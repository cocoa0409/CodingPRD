              payload: {}
              as: ProgramAuditor
              as_user_id: "auditor-1"
              captures: { s1: "$.data[0].id" }
            - call: "POST /cpo/audit-samples/${s1}/finding"
              payload: { finding: "FAIL", finding_code: "DOCUMENTATION_MISSING" }
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /cpo/dealers/${d1}"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/audit-runs"
              payload: {}
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /cpo/certifications/${c2}/audit-samples"
              payload: {}
              as: ProgramAuditor
              as_user_id: "auditor-1"
              captures: { s2: "$.data[0].id" }
            - call: "POST /cpo/audit-samples/${s2}/finding"
              payload: { finding: "FAIL", finding_code: "ELIGIBILITY_VIOLATION" }
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /cpo/dealers/${d1}"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/audit-runs"
              payload: {}
              as: ProgramAuditor
              as_user_id: "auditor-1"
          assert:
            - "trigger call 1 returns 201 with audit_run_id AR-1 and selected_count 1 == max(1, ceil(0.2 * 2)); the sample lands on C1 because both dealers-side risk scores are 0 and activated_at ASC breaks the tie"
            - "trigger call 2 shows the sample SELECTED with selection_rank 1, and Certification.${c1}.status UNDER_AUDIT with audit_sampled true"
            - "trigger call 4 shows audit_sample_count 1, audit_fail_count 1, audit_fail_rate 1.00, claim_ratio_effective 0.00 and risk_score 40 == round_half_up(0.00*100*0.60 + 1.00*100*0.40)"
            - "trigger call 4 shows privilege_status still ACTIVE with privilege_reason null: the rate is already maximal, but the cumulative count 1 has not reached audit_fail_suspension_count 2"
            - "trigger call 5 returns audit_run_id AR-2 with selected_count 1: C1 is out of the pool on both counts (DECERTIFIED and audit_sampled true), leaving C2 as the only candidate"
            - "trigger call 8 shows audit_fail_count 2 and privilege_status SUSPENDED with privilege_reason AUDIT_FAILURE_SUSPENSION, while audit_fail_rate is unchanged at 1.00 and risk_score is unchanged at 40 - the threshold that fired is the count, not the rate"
            - "trigger call 9 returns 201 with selected_count 0 and creates no AuditSample: the dealer is now SUSPENDED, so its certifications leave the pool entirely and an empty pool is a success, not an error"

      - name: wholesale_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: wholesale_event_four_hop_cascade
          rationale: |
            That instance walks the wholesale chain hop by hop - history event, certification
            decertification with its reason, forced listing withdrawal with its SLA deadline, and the
            vehicle and dealer counter corrections - asserting the state after each hop rather than only
            at the end, which is exactly the ordering-sensitivity claim this row asks for.

      - name: audit_failure_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: audit_failure_five_hop_dealer_suspension_cascade
          rationale: |
            The deepest chain in the domain - finding, sample FAILED, certification DECERTIFIED with the
            audit reason and fee credit, listing takedown, dealer counters and privilege - is driven there
            with per-hop assertions, including the fact that a partial failure at the last hop must not
            leave the earlier hops applied.

      - name: both_claim_ratio_variants_and_the_delta_on_switch
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: dealer_claim_ratio_trailing_window_variant
          rationale: |
            That instance and its twin dealer_claim_ratio_lifetime_cumulative_variant run the identical
            underlying rows through both variants and pin the delta produced purely by crossing
            claim_variant_volume_floor, which is the whole content of this claim.

      - name: probation_threshold_is_inclusive_at_its_boundary
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: claim_ratio_exactly_at_probation_threshold
          rationale: |
            The instantaneous-threshold boundary is driven there with a ratio landing exactly on
            claim_ratio_probation_threshold, proving the comparison is >= and not > while staying below
            the suspension threshold.

  # ===========================================================================
  # 9. From Consistency Model
  # ===========================================================================
  - section: consistency model
    instances:

      - name: every_derived_field_is_visible_in_the_approval_response_itself
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - state_machines.Certification.SUBMITTED_to_ACTIVE
          - calculations.certification_fee
        distinguishing_aspect: |
          Approval is the single densest write in the domain - fee, warranty interval, retention date,
          certification number, pinned config generation and four dealer counters all move at once - and
          the immediate consistency model forbids computing any of them lazily on a later read. Every
          value is asserted in the approval response body first, then re-read and required to be
          identical, so a derived field that is only materialised by the GET handler is caught.
        test_recipe:
          setup:
            - "Dealer D1, technician T1, published MPI-172 with P1, vehicle V1 in service 2023-05-10 at 30000 miles, and a PASSED inspection I1 whose certification C1 is SUBMITTED."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000041", model_year: 2023, in_service_date: "2023-05-10", odometer_miles: 30000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 30000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i1}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v1}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { ver1: $.data.version }
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v1}", inspection_id: "${i1}", expected_vehicle_version: "${ver1}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-1" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-1" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-1" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /cpo/certifications/${c1}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
              captures: { fee: $.data.fee_charged_cents, wend: $.data.warranty_end_date }
            - call: "GET /cpo/certifications/${c1}"
              payload: {}
              as: ProgramAuditor
              as_user_id: "auditor-1"
            - call: "GET /cpo/dealers/${d1}"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /cpo/vehicles/${v1}"
              payload: {}
              as: CustomerAdvocate
              as_user_id: "advocate-1"
          assert:
            - "the trigger call 1 response body already carries status ACTIVE, activated_at 2026-08-01T00:00:00Z, fee_base_cents 89900, fee_surcharge_cents 0, fee_discount_cents 0 and ${fee} == 89900 - age_days 1179 gives age_years 3, which is exactly the surcharge-free allowance, and 30000 miles is below the 40000-mile floor"
            - "the same response carries warranty_start_date 2026-08-01 (the factory basic term lapsed on 2026-05-10, so coverage is CERTIFICATION_ANCHORED), ${wend} == 2027-08-01, warranty_end_miles 42000 and retention_expires_at 2034-08-01"
            - "the same response carries a non-null certification_number derived from franchise_code FR-1001 and the dealer's submission sequence, plus program_config_version 1 pinned at approval"
            - "trigger call 2 returns byte-identical values for all of those fields: nothing was computed lazily on read, and no field is null in one view and populated in the other"
            - "trigger call 3 shows lifetime_activated_count 1, window_activated_count 1, active_certification_count 1, claim_ratio_effective 0.00 and risk_score 0 - the dealer counters moved inside the approval, not on a later sweep"
            - "trigger call 4 shows Vehicle.${v1}.cpo_state CERTIFIED, active_certification_count 1 and certified_certification_id ${c1} in the very next read, with no intermediate reconciliation call"
