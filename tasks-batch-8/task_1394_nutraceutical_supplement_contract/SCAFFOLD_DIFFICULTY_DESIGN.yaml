              as: ProductionPlanner
              captures: { b1_id: $.data.id }
            - call: "POST /api/batches/${b1_id}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /api/batches/${b1_id}/consumptions"
              payload: { material_lot_id: "${lot_id}", qty_consumed: 5500000 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /api/batches/${b1_id}/complete"
              payload: { actual_yield_units: 9800, actual_bulk_mass_g: 5390 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /api/production-lines/${line_id}/cleaning-validations"
              payload: { notes: "full clean" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cv_id: $.data.id }
            - call: "POST /api/cleaning-validations/${cv_id}/swab"
              payload: { result: "PASS" }
              as: QAChemist
              as_user_id: "chem-1"
            - call: "POST /api/cleaning-validations/${cv_id}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qm-1"
            - call: "POST /api/manufacturing-orders"
              payload: { customer_id: "${cust_id}", formula_id: "${f_id}", ordered_qty: 10000 }
              as: BrandRep
              as_user_id: "${cust_id}"
              captures: { mo2_id: $.data.id }
            - call: "POST /api/manufacturing-orders/${mo2_id}/schedule"
              payload: { production_line_id: "${line_id}", planned_start: "2026-09-02T08:00:00Z", planned_end: "2026-09-02T16:00:00Z" }
              as: ProductionPlanner
