              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/moderation-cases/${case2_id}/decide"
              payload: { outcome: "WARN" }
              as: Reviewer
              as_user_id: "${r1_id}"
            - call: "POST /moderation/appeals"
              payload: { case_id: "${case1_id}", grounds_text: "Removed in error" }
              as: AccountHolder
