          trigger:
            - { call: "POST /port-ops/invoices/${fin}/issue", as: BillingClerk }
            - { call: "POST /port-ops/invoices/${fin}/dispute", payload: { reason: "late penalty contested" }, as: VesselAgent, as_user_id: "${ves}" }
            - { call: "GET /port-ops/invoices/${fin}", as: BillingClerk, captures: { inv_v3: $.data.version, gross1: $.data.gross_cents, tot1: $.data.total_cents, st1: $.data.status } }
