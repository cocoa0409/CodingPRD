# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — EXPERT tier
# PR & Media-Relations Firm (task_0703)
# Single top-level key: scaffold_difficulty_design
# Nine Difficulty Rules (§0.5) x >= 2 instances each = 18 instances total.
# Every `grounds:` ref resolves to a declared element in SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are literals computed by code against §1.3.
# Logical clock startup default: 2026-03-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: media_value_estimated_vs_verified_on_coverage
        grounds:
          - calculations.media_value
          - entities.Coverage.fields.estimated_media_value_cents
          - entities.Coverage.fields.media_value_cents
          - state_machines.Coverage.DRAFT_to_VERIFIED
        distinguishing_aspect: |
          media_value's estimated variant applies a 0.8 provisional haircut at Coverage
          logging while the verified variant applies none at verify, so the SAME clip on
          the SAME Coverage row yields estimated_media_value_cents=3240000 but
          media_value_cents=4050000 — dual-variant logic on the Coverage/media-valuation domain.
        test_recipe:
          setup:
            - "An ENTERPRISE Client; an ACTIVE Campaign of that client."
            - "A NATIONAL Outlet with monthly_unique_visitors=2000000 (reach uncapped=3.0) and domain_authority=80 (auth=1.8)."
            - "An ACTIVE Journalist on that outlet, member of an ACTIVE MediaList for the campaign."
            - "A DRAFT Coverage clip with sentiment=POSITIVE, prominence=FEATURE on that campaign/journalist."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Acme", industry: "TECH", monthly_retainer_cents: 500000, monthly_hours_cap: 40, overage_rate_cents: 15000, account_tier: "ENTERPRISE" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Launch", objective: "LAUNCH", budget_cents: 5000000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "National Times", tier: "NATIONAL", monthly_unique_visitors: 2000000, domain_authority: 80 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Jane Reporter", email: "jane@nt.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "List A", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
            - call: "POST /agency/coverage"
              payload: { campaign_id: "${campaign_id}", journalist_id: "${journalist_id}", headline: "Big Launch", published_at: "2026-03-02T00:00:00Z", sentiment: "POSITIVE", prominence: "FEATURE" }
              as: MediaSpecialist
              captures: { coverage_id: $.data.id }
          trigger:
            - call: "POST /agency/coverage/${coverage_id}/verify"
              payload: {}
              as: MediaSpecialist
          assert:
            - "Coverage.${coverage_id}.estimated_media_value_cents == 3240000"
            - "Coverage.${coverage_id}.media_value_cents == 4050000"
            - "Coverage.${coverage_id}.status == VERIFIED"

      - name: retainer_billing_provisional_vs_final_on_period
        grounds:
          - calculations.retainer_billing
          - entities.RetainerPeriod.fields.provisional_total_cents
          - entities.RetainerPeriod.fields.final_total_cents
          - state_machines.RetainerPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          retainer_billing's provisional variant rounds per-entry then sums (and includes
          SUBMITTED) while the final variant sums then rounds (APPROVED only), so an identical
          set of APPROVED entries yields provisional_total_cents=501 but final_total_cents=500
          — dual-variant logic on the RetainerPeriod/hours-billing domain, a different entity
          domain from media_value's Coverage valuation.
        test_recipe:
          setup:
            - "A Client with monthly_hours_cap=10 and overage_rate_cents=333."
            - "An OPEN RetainerPeriod (snapshots hours_cap=10, overage_rate_cents=333)."
            - "Four TimeEntries logged in created_at order: 10.0h, 0.5h, 0.5h, 0.5h; all APPROVED."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Beta", industry: "FINANCE", monthly_retainer_cents: 300000, monthly_hours_cap: 10, overage_rate_cents: 333 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/retainer-periods"
              payload: { client_id: "${client_id}", period_month: "2026-03" }
              as: AccountManager
              captures: { period_id: $.data.id }
            - call: "POST /agency/time-entries"
              payload: { retainer_period_id: "${period_id}", staff_id: "staff-1", work_type: "STRATEGY", billable_hours: 10.0 }
              as: AccountManager
              captures: { te1: $.data.id }
            - call: "POST /agency/time-entries"
              payload: { retainer_period_id: "${period_id}", staff_id: "staff-1", work_type: "WRITING", billable_hours: 0.5 }
              as: AccountManager
              captures: { te2: $.data.id }
            - call: "POST /agency/time-entries"
              payload: { retainer_period_id: "${period_id}", staff_id: "staff-1", work_type: "WRITING", billable_hours: 0.5 }
              as: AccountManager
              captures: { te3: $.data.id }
            - call: "POST /agency/time-entries"
              payload: { retainer_period_id: "${period_id}", staff_id: "staff-1", work_type: "WRITING", billable_hours: 0.5 }
              as: AccountManager
              captures: { te4: $.data.id }
            - call: "POST /agency/time-entries/${te1}/approve"
              payload: {}
              as: AccountManager
            - call: "POST /agency/time-entries/${te2}/approve"
              payload: {}
              as: AccountManager
            - call: "POST /agency/time-entries/${te3}/approve"
              payload: {}
              as: AccountManager
            - call: "POST /agency/time-entries/${te4}/approve"
              payload: {}
              as: AccountManager
              captures: { period_v: $.data.id }
          trigger:
            - call: "GET /agency/retainer-periods/${period_id}"
              payload: {}
              as: AccountManager
              captures: { close_v: $.data.version }
            - call: "POST /agency/retainer-periods/${period_id}/close"
              payload: { expected_retainer_period_version: "${close_v}" }
              as: AccountManager
          assert:
            - "RetainerPeriod.${period_id}.provisional_total_cents == 501"
            - "RetainerPeriod.${period_id}.final_total_cents == 500"
            - "RetainerPeriod.${period_id}.status == CLOSED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: media_value_nested_min_and_tier_selection_mode_a
        grounds:
          - calculations.media_value
          - entities.Outlet.fields.monthly_unique_visitors
          - entities.Client.fields.account_tier
          - state_machines.Coverage.DRAFT_to_VERIFIED
        distinguishing_aspect: |
          media_value is mode (a): >=3 inputs (reach, authority, sentiment, prominence, tier)
          with a nested min(reach_factor, REACH_CAP=3.0) and ACCOUNT_TIER_MULT tier selection;
          a REGIONAL outlet with reach uncapped=3.5 is clamped to 3.0 so verified
          media_value_cents=270000, NOT the 315000 an uncapped reach would give.
        test_recipe:
          setup:
            - "A STANDARD Client; an ACTIVE Campaign."
            - "A REGIONAL Outlet with monthly_unique_visitors=2500000 (reach uncapped=3.5, clamped to 3.0) and domain_authority=50 (auth=1.5)."
            - "An ACTIVE Journalist on a MediaList of the campaign."
            - "A DRAFT Coverage with sentiment=NEUTRAL (0.5), prominence=MENTION (0.6)."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Gamma", industry: "CONSUMER", monthly_retainer_cents: 200000, monthly_hours_cap: 20, overage_rate_cents: 10000, account_tier: "STANDARD" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Awareness", objective: "AWARENESS", budget_cents: 1000000, target_beat: "CONSUMER" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "Regional Post", tier: "REGIONAL", monthly_unique_visitors: 2500000, domain_authority: 50 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Reg Writer", email: "reg@rp.com", beat: "CONSUMER" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "List R", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
            - call: "POST /agency/coverage"
              payload: { campaign_id: "${campaign_id}", journalist_id: "${journalist_id}", headline: "Reg Clip", published_at: "2026-03-02T00:00:00Z", sentiment: "NEUTRAL", prominence: "MENTION" }
              as: MediaSpecialist
              captures: { coverage_id: $.data.id }
          trigger:
            - call: "POST /agency/coverage/${coverage_id}/verify"
              payload: {}
              as: MediaSpecialist
          assert:
            - "Coverage.${coverage_id}.media_value_cents == 270000"
            - "Coverage.${coverage_id}.status == VERIFIED"

      - name: retainer_billing_round_order_divergence_mode_b
        grounds:
          - calculations.retainer_billing
          - entities.RetainerPeriod.fields.provisional_total_cents
          - entities.RetainerPeriod.fields.final_total_cents
          - state_machines.RetainerPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          retainer_billing is mode (b): rounding order is pinned, provisional=round-per-entry-then-sum,
          final=sum-then-round, so three 0.5h overage entries at rate 333 produce
          provisional_total_cents=501 (167*3) but final_total_cents=500 (round(499.5)) — the
          1-cent gap is purely the rounding-order axis, a different combinatorial mode than
          media_value's mode (a).
        test_recipe:
          setup:
            - "A Client with monthly_hours_cap=10 and overage_rate_cents=333."
            - "An OPEN RetainerPeriod; four APPROVED TimeEntries 10.0h, 0.5h, 0.5h, 0.5h (created_at order)."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Delta", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 10, overage_rate_cents: 333 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/retainer-periods"
              payload: { client_id: "${client_id}", period_month: "2026-04" }
              as: AccountManager
              captures: { period_id: $.data.id }
            - call: "POST /agency/time-entries"
              payload: { retainer_period_id: "${period_id}", staff_id: "staff-2", work_type: "OUTREACH", billable_hours: 10.0 }
              as: MediaSpecialist
              captures: { te1: $.data.id }
            - call: "POST /agency/time-entries"
              payload: { retainer_period_id: "${period_id}", staff_id: "staff-2", work_type: "OUTREACH", billable_hours: 0.5 }
              as: MediaSpecialist
              captures: { te2: $.data.id }
            - call: "POST /agency/time-entries"
              payload: { retainer_period_id: "${period_id}", staff_id: "staff-2", work_type: "OUTREACH", billable_hours: 0.5 }
              as: MediaSpecialist
              captures: { te3: $.data.id }
            - call: "POST /agency/time-entries"
              payload: { retainer_period_id: "${period_id}", staff_id: "staff-2", work_type: "OUTREACH", billable_hours: 0.5 }
              as: MediaSpecialist
              captures: { te4: $.data.id }
            - call: "POST /agency/time-entries/${te1}/approve"
              payload: {}
              as: AccountManager
            - call: "POST /agency/time-entries/${te2}/approve"
              payload: {}
              as: AccountManager
            - call: "POST /agency/time-entries/${te3}/approve"
              payload: {}
              as: AccountManager
            - call: "POST /agency/time-entries/${te4}/approve"
              payload: {}
              as: AccountManager
          trigger:
            - call: "GET /agency/retainer-periods/${period_id}"
              payload: {}
              as: AccountManager
              captures: { period_v: $.data.version }
            - call: "POST /agency/retainer-periods/${period_id}/close"
              payload: { expected_retainer_period_version: "${period_v}" }
              as: AccountManager
          assert:
            - "RetainerPeriod.${period_id}.provisional_total_cents == 501"
            - "RetainerPeriod.${period_id}.final_total_cents == 500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: crisis_event_parallel_severity_and_response_dimensions
        grounds:
          - state_machines.CrisisEvent.ASSESSING_to_ESCALATED
          - state_machines.CrisisEvent.DRAFTING_to_APPROVED
          - state_machines.CrisisEvent.APPROVED_to_PUBLISHED
          - entities.CrisisEvent.fields.severity_status
          - entities.CrisisEvent.fields.response_status
        distinguishing_aspect: |
          CrisisEvent carries two independent (parallel) state dimensions on one row:
          severity_status (ASSESSING/CONTAINED/ESCALATED) and response_status
          (DRAFTING/APPROVED/PUBLISHED); escalating severity leaves response_status at
          DRAFTING unchanged, proving the dimensions evolve independently on the same entity.
        test_recipe:
          setup:
            - "A Client; a CrisisEvent with severity=HIGH, severity_status=ASSESSING, response_status=DRAFTING, holding_statement set."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Eps", industry: "HEALTH", monthly_retainer_cents: 400000, monthly_hours_cap: 30, overage_rate_cents: 12000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/crisis-events"
              payload: { client_id: "${client_id}", summary: "Recall", severity: "HIGH", holding_statement: "We are investigating." }
              as: AccountManager
              captures: { crisis_id: $.data.id }
          trigger:
            - call: "POST /agency/crisis-events/${crisis_id}/escalate"
              payload: {}
              as: AccountManager
          assert:
            - "CrisisEvent.${crisis_id}.severity_status == ESCALATED"
            - "CrisisEvent.${crisis_id}.response_status == DRAFTING"

      - name: pitch_branch_responded_to_accepted_or_rejected
        grounds:
          - state_machines.Pitch.RESPONDED_to_ACCEPTED
          - state_machines.Pitch.RESPONDED_to_REJECTED
          - entities.Pitch.fields.status
          - state_machines.MediaList
        distinguishing_aspect: |
          Pitch forks at RESPONDED into ACCEPTED (eligible to anchor an Interview) versus
          REJECTED (terminal; may bubble its MediaList to EXHAUSTED) with divergent side-effect
          sets per branch — branching fork on the Pitch entity, a different entity from CrisisEvent.
        test_recipe:
          setup:
            - "An ACTIVE Campaign with an ACTIVE MediaList containing one ACTIVE Journalist."
            - "Two RESPONDED Pitches on that list/campaign for that journalist."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Zeta", industry: "TECH", monthly_retainer_cents: 250000, monthly_hours_cap: 25, overage_rate_cents: 9000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "TL", objective: "THOUGHT_LEADERSHIP", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "Trade Daily", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Jo Beat", email: "jo@td.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "List Z", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
            - call: "POST /agency/pitches"
              payload: { campaign_id: "${campaign_id}", media_list_id: "${media_list_id}", journalist_id: "${journalist_id}", angle: "angle A" }
              as: MediaSpecialist
              captures: { pitch_a: $.data.id }
            - call: "POST /agency/pitches"
              payload: { campaign_id: "${campaign_id}", media_list_id: "${media_list_id}", journalist_id: "${journalist_id}", angle: "angle B" }
              as: MediaSpecialist
              captures: { pitch_b: $.data.id }
            - call: "POST /agency/pitches/${pitch_a}/send"
              payload: {}
              as: MediaSpecialist
            - call: "POST /agency/pitches/${pitch_a}/respond"
              payload: {}
              as: MediaSpecialist
            - call: "POST /agency/pitches/${pitch_b}/send"
              payload: {}
              as: MediaSpecialist
            - call: "POST /agency/pitches/${pitch_b}/respond"
              payload: {}
              as: MediaSpecialist
          trigger:
            - call: "POST /agency/pitches/${pitch_a}/accept"
              payload: {}
              as: MediaSpecialist
            - call: "POST /agency/pitches/${pitch_b}/reject"
              payload: {}
              as: MediaSpecialist
          assert:
            - "Pitch.${pitch_a}.status == ACCEPTED"
            - "Pitch.${pitch_b}.status == REJECTED"
            - "MediaList.${media_list_id}.status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: campaign_archive_depth3_medialist_pitch_interview
        grounds:
          - state_machines.Campaign.COMPLETED_to_ARCHIVED
          - state_machines.MediaList
          - state_machines.Pitch
          - state_machines.Interview
        distinguishing_aspect: |
          cascade-campaign-archive is depth-3: archiving the Campaign moves its ACTIVE MediaList
          to ARCHIVED, that list move cascades its DRAFT/SENT/RESPONDED Pitches to CANCELLED, and
          each Pitch->CANCELLED cascades its REQUESTED/CONFIRMED Interviews to CANCELLED — each hop
          caused by the prior hop, not by the original archive.
        test_recipe:
          setup:
            - "A DRAFT Campaign (never activated, so its DRAFT Pitch and REQUESTED Interview stay non-terminal and archive is reachable via DRAFT->ARCHIVED)."
            - "An ACTIVE MediaList on the campaign with one ACTIVE Journalist; one DRAFT Pitch on the list (no send needed while DRAFT)."
            - "An ACTIVE Spokesperson; a REQUESTED Interview anchored on that DRAFT Pitch."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Eta", industry: "TECH", monthly_retainer_cents: 250000, monthly_hours_cap: 25, overage_rate_cents: 9000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Casc", objective: "LAUNCH", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/outlets"
              payload: { name: "Cas Trade", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Cas Jo", email: "casjo@ct.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "Cas List", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
            - call: "POST /agency/pitches"
              payload: { campaign_id: "${campaign_id}", media_list_id: "${media_list_id}", journalist_id: "${journalist_id}", angle: "casc angle" }
              as: MediaSpecialist
              captures: { pitch_id: $.data.id }
            - call: "POST /agency/spokespersons"
              payload: { client_id: "${client_id}", full_name: "Spoke Cas", title: "CEO" }
              as: AccountManager
              captures: { spokesperson_id: $.data.id }
            - call: "POST /agency/interviews"
              payload: { campaign_id: "${campaign_id}", spokesperson_id: "${spokesperson_id}", journalist_id: "${journalist_id}", pitch_id: "${pitch_id}", starts_at: "2026-04-10T10:00:00Z", ends_at: "2026-04-10T11:00:00Z" }
              as: SchedulingCoordinator
              captures: { interview_id: $.data.id }
          trigger:
            - call: "POST /agency/campaigns/${campaign_id}/archive"
              payload: {}
              as: AccountManager
          assert:
            - "Campaign.${campaign_id}.status == ARCHIVED"
            - "MediaList.${media_list_id}.status == ARCHIVED"
            - "Pitch.${pitch_id}.status == CANCELLED"
            - "Interview.${interview_id}.status == CANCELLED"

      - name: spokesperson_deactivate_depth2_interview_pitch_revert
        grounds:
          - state_machines.Spokesperson.ACTIVE_to_INACTIVE
          - state_machines.Interview
          - state_machines.Pitch.ACCEPTED_to_RESPONDED
        distinguishing_aspect: |
          cascade-spokesperson-deactivate is depth-2 from a different trigger: deactivating the
          Spokesperson cancels its REQUESTED/CONFIRMED Interviews, and each Interview->CANCELLED
          that had a pitch_id whose Pitch is ACCEPTED cascades that Pitch back ACCEPTED->RESPONDED
          (compensation) — the second hop is caused by the interview cancel, not the deactivate.
        test_recipe:
          setup:
            - "An ACTIVE Campaign; ACTIVE MediaList with an ACTIVE Journalist; one ACCEPTED Pitch."
            - "An ACTIVE Spokesperson; a REQUESTED Interview anchored on the ACCEPTED Pitch."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Theta", industry: "FINANCE", monthly_retainer_cents: 250000, monthly_hours_cap: 25, overage_rate_cents: 9000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Spk", objective: "LAUNCH", budget_cents: 800000, target_beat: "FINANCE" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "Fin Trade", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Fin Jo", email: "finjo@ft.com", beat: "FINANCE" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "Spk List", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
            - call: "POST /agency/pitches"
              payload: { campaign_id: "${campaign_id}", media_list_id: "${media_list_id}", journalist_id: "${journalist_id}", angle: "spk angle" }
              as: MediaSpecialist
              captures: { pitch_id: $.data.id }
            - call: "POST /agency/pitches/${pitch_id}/send"
              payload: {}
              as: MediaSpecialist
            - call: "POST /agency/pitches/${pitch_id}/respond"
