  - rule_id: boundary_precision_check
    instances:
      - name: fifty_percent_ratio_of_exactly_5000_bps_issues_while_4987_bps_is_refused
        grounds:
          - calculations.fifty_percent_aggregate_basis_test
          - calculations.bond_sizing
          - validations[priority=114]
          - errors[ERR_FIFTY_PERCENT_TEST_FAILED]
          - entities.Project.provisional_fifty_percent_ratio_bps
        distinguishing_aspect: |
          The pass side of FIFTY_PERCENT_THRESHOLD_BPS is inclusive. Two projects
          with the identical 400,000,000 aggregate basis differ only in eligible
          cost: 190,000,000 sizes to par 200,000,000 and lands on exactly 5000
          bps, which ISSUES; 189,500,000 sizes to par 199,500,000 and lands on
          floor(4987.5) = 4987 bps, one denomination step below, which is refused
          at priority 114. A >= written as > would break the first project, and a
          ratio computed with rounding rather than floor would turn 4987.5 into
          4988 and still not save the second - the floor is what makes the
          half-basis-point disappear.
        test_recipe:
          setup:
            - "One developer and one cap pool with total_cap_cents 600,000,000."
            - "Project P1: 10 units, 8500 sqft, land 40,000,000, depreciable 360,000,000 -> aggregate_basis_cents 400,000,000; four RESTRICTED units at ami 60 and six MARKET units; MIN_40_60 agreement recorded; cap awarded 200,000,000; bond created from eligible 190,000,000 + capitalized interest 6,000,000 -> par 200,000,000; ISSUED successfully."
            - "Project P2: 4 units, 3400 sqft, the same land 40,000,000 and depreciable 360,000,000 -> the same aggregate_basis_cents 400,000,000; two RESTRICTED units at ami 60 and two MARKET units; MIN_40_60 agreement recorded; cap awarded 199,500,000; bond created from eligible 189,500,000 + capitalized interest 6,000,000 -> provisional 195,500,000, allowance 3,910,000, unrounded 199,410,000, par 199,500,000 after the 500,000 ceiling step."
