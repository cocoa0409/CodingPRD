# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1620_conservation_easement_land_trust
# Test Targeting Index: 9 rules x >=2 instances = 19 instances.
# Standard permitted_use_matrix literal used across instances:
#   RESIDENTIAL_CONSTRUCTION: PROHIBITED, AGRICULTURE: PERMITTED,
#   TIMBER_HARVEST: DISCRETIONARY, ROAD_CONSTRUCTION: DISCRETIONARY,
#   COMMERCIAL_RECREATION: PROHIBITED, HUNTING: PERMITTED,
#   SUBDIVISION: PROHIBITED, CELL_TOWER: PROHIBITED
# Default logical clock at server start: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: endowment_draw_capacity_unitized_vs_policy
        grounds:
          - calculations.draw_capacity
          - calculations.carryover_allowance
          - entities.EndowmentFund.fields.unitized_draw_capacity_cents
          - entities.EndowmentFund.fields.policy_draw_allowance_cents
        distinguishing_aspect: |
          Two valid capacity algorithms on the SAME EndowmentFund ledger produce
          different ceilings for identical data: the provisional unitized ceiling
          is max(0, market_value - floor) = 400000 while the final policy ceiling
          frozen at close-year is round(500000 * 400bps, 0) + 0 = 20000.
        test_recipe:
          setup:
            - "RECORDED easement (500 ac) with an ACTIVE endowment fund: spending_rate_bps=400, principal_floor_cents=100000, one 500000-cent contribution, then one close-year so fiscal_year=2"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-DV1", grantor_name: "Grant One", parcel_acreage: 500, permitted_use_matrix: { RESIDENTIAL_CONSTRUCTION: PROHIBITED, AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY, ROAD_CONSTRUCTION: DISCRETIONARY, COMMERCIAL_RECREATION: PROHIBITED, HUNTING: PERMITTED, SUBDIVISION: PROHIBITED, CELL_TOWER: PROHIBITED }, monitoring_interval_months: 12 }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "Owner One", contact_email: "o1@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "intact forest", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 400, principal_floor_cents: 100000 }, as: TrustAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/contributions", payload: { amount_cents: 500000 }, as: TrustAdmin }
            - { call: "POST /stewardship/endowment-funds/${f_id}/close-year", payload: {}, as: TrustBoardReviewer }
          trigger:
            - { call: "GET /stewardship/endowment-funds/${f_id}", payload: {}, as: TrustAdmin, captures: { unitized: $.data.unitized_draw_capacity_cents, policy: $.data.policy_draw_allowance_cents, mv: $.data.market_value_cents, fy: $.data.fiscal_year } }
          assert:
            - "EndowmentFund.${f_id}.market_value_cents == 500000"
            - "EndowmentFund.${f_id}.fiscal_year == 2"
            - "EndowmentFund.${f_id}.unitized_draw_capacity_cents == 400000"
            - "EndowmentFund.${f_id}.policy_draw_allowance_cents == 20000"
            - "unitized != policy: 400000 - 20000 == 380000 divergence on identical ledger state"

      - name: appraisal_deduction_standard_vs_enhancement_adjusted
        grounds:
          - calculations.deductible_value
          - entities.Appraisal.fields.deductible_value_cents
          - entities.Appraisal.fields.contiguous_enhancement_applies
        distinguishing_aspect: |
          Two appraisals with identical delivered numbers (before 90000000, after
          55000000, enhancement 12000000) certify to different deductible values:
          the standard variant yields 35000000 while the enhancement-adjusted
          variant yields 23000000 — a different entity domain (Appraisal) than the
          endowment instance.
        test_recipe:
          setup:
            - "RECORDED easement (500 ac); baseline prepared by staff-prep-1; clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-DV2", grantor_name: "Grant Two", parcel_acreage: 500, permitted_use_matrix: { RESIDENTIAL_CONSTRUCTION: PROHIBITED, AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY, ROAD_CONSTRUCTION: DISCRETIONARY, COMMERCIAL_RECREATION: PROHIBITED, HUNTING: PERMITTED, SUBDIVISION: PROHIBITED, CELL_TOWER: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "Owner Two", contact_email: "o2@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "prairie", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/appraisals", payload: { easement_id: "${e_id}", appraiser_user_id: "appr-1", effective_on: "2026-08-15", gift_on: "2026-09-01", contiguous_enhancement_applies: false }, as: StewardshipCoordinator, captures: { ap1_id: $.data.id } }
            - { call: "POST /stewardship/appraisals", payload: { easement_id: "${e_id}", appraiser_user_id: "appr-2", effective_on: "2026-08-15", gift_on: "2026-09-01", contiguous_enhancement_applies: true }, as: StewardshipCoordinator, captures: { ap2_id: $.data.id } }
            - { call: "POST /stewardship/appraisals/${ap1_id}/deliver", payload: { before_value_cents: 90000000, after_value_cents: 55000000, enhancement_value_cents: 12000000 }, as: Appraiser, as_user_id: "appr-1" }
            - { call: "POST /stewardship/appraisals/${ap2_id}/deliver", payload: { before_value_cents: 90000000, after_value_cents: 55000000, enhancement_value_cents: 12000000 }, as: Appraiser, as_user_id: "appr-2" }
          trigger:
            - { call: "POST /stewardship/appraisals/${ap1_id}/certify", payload: {}, as: StewardshipCoordinator, captures: { ded1: $.data.deductible_value_cents } }
            - { call: "POST /stewardship/appraisals/${ap2_id}/certify", payload: {}, as: StewardshipCoordinator, captures: { ded2: $.data.deductible_value_cents } }
          assert:
            - "Appraisal.${ap1_id}.deductible_value_cents == 35000000 (standard variant; enhancement ignored)"
            - "Appraisal.${ap2_id}.deductible_value_cents == 23000000 (enhancement-adjusted variant)"
            - "ded1 - ded2 == 12000000 == enhancement_value_cents"

  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_draw_allocation_three_bucket_branch
        grounds:
          - calculations.waterfall_draw_allocation
          - entities.EndowmentTransaction.fields.from_policy_allowance_cents
          - entities.EndowmentTransaction.fields.from_principal_invasion_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input formula (amount, market value, floor, allowance,
          YTD, actor role) with nested min/max and a conditional branch on actor
          role — draw 300000 splits {15000, 285000, 0} across buckets, and the
          same 150000 draw is rejected for a coordinator (invasion branch) but
          succeeds for a TrustBoardReviewer with split {0, 95000, 55000}.
        test_recipe:
          setup:
            - "RECORDED easement; ACTIVE fund MV=500000, floor=100000, rate=400bps; one close-year so policy allowance = 20000, carryover = 0"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-WF", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { RESIDENTIAL_CONSTRUCTION: PROHIBITED, AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY, ROAD_CONSTRUCTION: DISCRETIONARY, COMMERCIAL_RECREATION: PROHIBITED, HUNTING: PERMITTED, SUBDIVISION: PROHIBITED, CELL_TOWER: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 400, principal_floor_cents: 100000 }, as: TrustAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/contributions", payload: { amount_cents: 500000 }, as: TrustAdmin }
            - { call: "POST /stewardship/endowment-funds/${f_id}/close-year", payload: {}, as: TrustBoardReviewer }
            - { call: "GET /stewardship/endowment-funds/${f_id}", payload: {}, as: TrustAdmin, captures: { fv_a: $.data.version } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/draws", payload: { amount_cents: 5000, purpose: MONITORING, expected_fund_version: "${fv_a}" }, as: StewardshipCoordinator, captures: { txa_id: $.data.id } }
            - { call: "GET /stewardship/endowment-funds/${f_id}", payload: {}, as: TrustAdmin, captures: { fv_b: $.data.version } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/draws", payload: { amount_cents: 300000, purpose: ENFORCEMENT, expected_fund_version: "${fv_b}" }, as: StewardshipCoordinator, captures: { txb_id: $.data.id } }
            - { call: "GET /stewardship/endowment-funds/${f_id}", payload: {}, as: TrustAdmin, captures: { fv_c: $.data.version } }
          trigger:
            - { call: "POST /stewardship/endowment-funds/${f_id}/draws", payload: { amount_cents: 150000, purpose: ENFORCEMENT, expected_fund_version: "${fv_c}" }, as: StewardshipCoordinator, captures: { err_c: $.data.error_id } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/draws", payload: { amount_cents: 150000, purpose: ENFORCEMENT, expected_fund_version: "${fv_c}" }, as: TrustBoardReviewer, captures: { txc_id: $.data.id, txc_allow: $.data.from_policy_allowance_cents, txc_excess: $.data.from_excess_cents, txc_inv: $.data.from_principal_invasion_cents } }
            - { call: "GET /stewardship/endowment-funds/${f_id}", payload: {}, as: TrustAdmin, captures: { mv_end: $.data.market_value_cents } }
          assert:
            - "EndowmentTransaction.${txa_id}.from_policy_allowance_cents == 5000 and from_excess_cents == 0 and from_principal_invasion_cents == 0"
            - "EndowmentTransaction.${txb_id}.from_policy_allowance_cents == 15000 and from_excess_cents == 285000 and from_principal_invasion_cents == 0"
            - "coordinator draw of 150000 is rejected: err_c == ERR_PRINCIPAL_INVASION_REQUIRES_BOARD (402)"
            - "rejected draw did not consume the fund version: the board retry with the SAME expected_fund_version succeeds"
            - "EndowmentTransaction.${txc_id}: from_policy_allowance_cents == 0, from_excess_cents == 95000, from_principal_invasion_cents == 55000"
            - "EndowmentFund.${f_id}.market_value_cents == 45000 (below the 100000 floor; only board authority could take it there)"

      - name: unitization_nested_rounding_order
        grounds:
          - calculations.unit_value_unitization
          - entities.EndowmentTransaction.fields.units
          - entities.EndowmentFund.fields.unit_value_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-units-to-4dp FIRST against the previous rounded unit value, then
          recompute UV. Computing units from the unrounded intermediate UV would
          give 810.8122 units for the second contribution; the pinned order gives
          810.8123.
        test_recipe:
          setup:
            - "Easement (any status) with an INITIALIZING fund; rate 400bps, floor 100000"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-UN", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 400, principal_floor_cents: 100000 }, as: TrustAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/contributions", payload: { amount_cents: 333333 }, as: TrustAdmin, captures: { tx1_units: $.data.units } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/returns", payload: { amount_cents: 77777 }, as: TrustAdmin }
          trigger:
            - { call: "POST /stewardship/endowment-funds/${f_id}/contributions", payload: { amount_cents: 100000 }, as: TrustAdmin, captures: { tx2_units: $.data.units } }
            - { call: "GET /stewardship/endowment-funds/${f_id}", payload: {}, as: TrustAdmin, captures: { u_out: $.data.units_outstanding, uv: $.data.unit_value_cents, mv: $.data.market_value_cents } }
          assert:
            - "first contribution issued tx1_units == 3333.3300 units at the 100.0000 anchor"
            - "after +77777 return, unit value = round(411110 / 3333.3300, 4) = 123.3331"
            - "second contribution issued tx2_units == 810.8123 (NOT 810.8122 from the unrounded-UV order)"
            - "EndowmentFund.${f_id}.units_outstanding == 4144.1423"
            - "EndowmentFund.${f_id}.unit_value_cents == 123.3331"
            - "EndowmentFund.${f_id}.market_value_cents == 511110"

      - name: carryover_allowance_pinned_evaluation_order
        grounds:
          - calculations.carryover_allowance
          - entities.EndowmentFund.fields.carryover_allowance_cents
          - entities.EndowmentFund.fields.policy_draw_allowance_cents
        distinguishing_aspect: |
          Mode (c): the carryover min() cap MUST use the closed year's policy
          amount (Step 3 before Step 4). With a shrinking fund (MV 500000 ->
          300000), the pinned order yields carryover 20000 and allowance 32000;
          the forbidden order (cap by next year's policy 12000) yields 24000.
        test_recipe:
          setup:
            - "Easement with fund rate=400bps floor=100000; year 1: contribute 500000 then close; year 2: post a -200000 investment loss then close again"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-CO", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 400, principal_floor_cents: 100000 }, as: TrustAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/contributions", payload: { amount_cents: 500000 }, as: TrustAdmin }
            - { call: "POST /stewardship/endowment-funds/${f_id}/close-year", payload: {}, as: TrustBoardReviewer }
            - { call: "POST /stewardship/endowment-funds/${f_id}/returns", payload: { amount_cents: -200000 }, as: TrustAdmin }
          trigger:
            - { call: "POST /stewardship/endowment-funds/${f_id}/close-year", payload: {}, as: TrustBoardReviewer }
            - { call: "GET /stewardship/endowment-funds/${f_id}", payload: {}, as: TrustAdmin, captures: { carry: $.data.carryover_allowance_cents, allow: $.data.policy_draw_allowance_cents, fy: $.data.fiscal_year, prior_mv: $.data.prior_year_close_mv_cents } }
          assert:
            - "EndowmentFund.${f_id}.fiscal_year == 3"
            - "EndowmentFund.${f_id}.prior_year_close_mv_cents == 300000"
            - "EndowmentFund.${f_id}.carryover_allowance_cents == 20000 (min(underused 20000, closed-year policy 20000))"
            - "EndowmentFund.${f_id}.policy_draw_allowance_cents == 32000 (12000 new policy + 20000 carryover); the forbidden evaluation order would yield 24000"
  - rule_id: non_linear_state_machine
    instances:
      - name: amendment_revision_cycle_resubmit_changes_materiality
        grounds:
          - state_machines.AmendmentRequest.STAFF_REVIEW_to_REVISION_REQUESTED
          - state_machines.AmendmentRequest.REVISION_REQUESTED_to_SUBMITTED
          - calculations.amendment_materiality_score
        distinguishing_aspect: |
          Cyclic machine on AmendmentRequest: the STAFF_REVIEW -> REVISION_REQUESTED
          -> SUBMITTED loop recomputes materiality on resubmit (65 STAFF at 250 ac,
          70 BOARD at 300 ac), so the same amendment changes review_path mid-cycle.
        test_recipe:
          setup:
            - "RECORDED easement (500 ac) with the standard matrix; clock default"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-AM", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { RESIDENTIAL_CONSTRUCTION: PROHIBITED, AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY, ROAD_CONSTRUCTION: DISCRETIONARY, COMMERCIAL_RECREATION: PROHIBITED, HUNTING: PERMITTED, SUBDIVISION: PROHIBITED, CELL_TOWER: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { ev: $.data.version } }
            - { call: "POST /stewardship/amendment-requests", payload: { easement_id: "${e_id}", expected_easement_version: "${ev}", submitted_by_user_id: "coord-1", requested_changes: [ { use_type: RESIDENTIAL_CONSTRUCTION, new_level: PERMITTED } ], affected_acreage: 250 }, as: StewardshipCoordinator, captures: { am_id: $.data.id, score1: $.data.materiality_score, path1: $.data.review_path } }
            - { call: "POST /stewardship/amendment-requests/${am_id}/start-review", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/amendment-requests/${am_id}/request-revision", payload: { revision_notes: "expand acreage" }, as: StewardshipCoordinator }
          trigger:
            - { call: "POST /stewardship/amendment-requests/${am_id}/resubmit", payload: { requested_changes: [ { use_type: RESIDENTIAL_CONSTRUCTION, new_level: PERMITTED } ], affected_acreage: 300 }, as: StewardshipCoordinator, captures: { score2: $.data.materiality_score, path2: $.data.review_path, st2: $.data.status } }
            - { call: "POST /stewardship/amendment-requests/${am_id}/start-review", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/amendment-requests/${am_id}/approve", payload: {}, as: StewardshipCoordinator, as_user_id: "coord-2", captures: { err_staff: $.data.error_id } }
            - { call: "POST /stewardship/amendment-requests/${am_id}/escalate-board", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/amendment-requests/${am_id}/approve", payload: {}, as: TrustBoardReviewer, as_user_id: "board-9", captures: { st_final: $.data.status } }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { matrix_cell: $.data.permitted_use_matrix, amend_n: $.data.amendment_count, ev_end: $.data.version } }
          assert:
            - "after create: score1 == 65 and path1 == STAFF (25 acreage + 10 change + 30 downgrade)"
            - "after resubmit: score2 == 70 and path2 == BOARD and st2 == SUBMITTED (loop back through the cycle)"
            - "staff approve from STAFF_REVIEW with score 70 is rejected: err_staff == ERR_MATERIALITY_REQUIRES_BOARD"
            - "st_final == APPROVED after board approval"
            - "Easement.${e_id}.permitted_use_matrix.RESIDENTIAL_CONSTRUCTION == PERMITTED (matrix mutated by approval)"
            - "Easement.${e_id}.amendment_count == 1"
            - "Easement version advanced by exactly 2 across create+approve: ev_end == ev + 2"

      - name: enforcement_breach_renegotiation_cycle
        grounds:
          - state_machines.EnforcementAction.EXECUTED_to_BREACHED
          - state_machines.EnforcementAction.BREACHED_to_PROPOSED
          - state_machines.Violation.ESCALATED_to_RESOLVED
        distinguishing_aspect: |
          Cyclic machine on EnforcementAction (different entity than the
          amendment loop): PROPOSED -> EXECUTED -> BREACHED -> PROPOSED ->
          EXECUTED -> COMPLETED, with the linked violation reaching RESOLVED only
          through the enforcement completion side effect.
        test_recipe:
          setup:
            - "RECORDED easement (500 ac); clock moved to 2026-08-10; a MATERIAL violation noticed and manually escalated, spawning a PROPOSED enforcement action"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-EN", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { RESIDENTIAL_CONSTRUCTION: PROHIBITED, AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY, ROAD_CONSTRUCTION: DISCRETIONARY, COMMERCIAL_RECREATION: PROHIBITED, HUNTING: PERMITTED, SUBDIVISION: PROHIBITED, CELL_TOWER: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TrustAdmin }
            - { call: "POST /stewardship/violations", payload: { easement_id: "${e_id}", detected_by_user_id: "coord-9", violation_type: RESIDENTIAL_CONSTRUCTION, severity: MATERIAL, detected_on: "2026-08-10" }, as: StewardshipCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /stewardship/violations/${v_id}/send-notice", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/violations/${v_id}/escalate", payload: {}, as: StewardshipCoordinator }
            - { call: "GET /stewardship/enforcement-actions", payload: { violation_id: "${v_id}" }, as: TrustAdmin, captures: { enf_id: "$.data[0].id", enf_st0: "$.data[0].status" } }
            - { call: "POST /stewardship/enforcement-actions/${enf_id}/execute", payload: { agreement_terms: "restore in 60d", remediation_cost_cents: 12000000 }, as: TrustBoardReviewer, as_user_id: "board-5", captures: { enf_st1: $.data.status } }
            - { call: "POST /stewardship/enforcement-actions/${enf_id}/breach", payload: { breach_notes: "missed milestone" }, as: TrustBoardReviewer, captures: { enf_st2: $.data.status } }
            - { call: "POST /stewardship/enforcement-actions/${enf_id}/renegotiate", payload: { agreement_terms: "restore in 90d v2", remediation_cost_cents: 15000000 }, as: StewardshipCoordinator, captures: { enf_st3: $.data.status } }
            - { call: "POST /stewardship/enforcement-actions/${enf_id}/execute", payload: { agreement_terms: "restore in 90d v2", remediation_cost_cents: 15000000 }, as: TrustBoardReviewer, as_user_id: "board-6", captures: { enf_st4: $.data.status } }
          trigger:
            - { call: "POST /stewardship/enforcement-actions/${enf_id}/complete", payload: {}, as: StewardshipCoordinator, as_user_id: "coord-2", captures: { enf_st5: $.data.status } }
            - { call: "GET /stewardship/violations/${v_id}", payload: {}, as: TrustAdmin, captures: { v_st: $.data.status, v_res: $.data.resolution_verified_by_user_id } }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { e_posture: $.data.posture, e_open: $.data.open_violation_count } }
          assert:
            - "cycle observed: enf_st0==PROPOSED, enf_st1==EXECUTED, enf_st2==BREACHED, enf_st3==PROPOSED, enf_st4==EXECUTED, enf_st5==COMPLETED"
            - "Violation.${v_id}.status == RESOLVED and resolution_verified_by_user_id == coord-2"
            - "Easement.${e_id}.open_violation_count == 0"
            - "Easement.${e_id}.posture == GOOD_STANDING (enforcement closed, no open violations, next due 2027-08-01 > clock 2026-08-10)"

  - rule_id: transitive_cascade
    instances:
      - name: clock_sweep_escalation_spawns_enforcement_and_flips_posture
        grounds:
          - state_machines.Violation.NOTICE_SENT_to_ESCALATED
          - state_machines.Violation.CURE_IN_PROGRESS_to_ESCALATED
          - calculations.cure_deadline
          - entities.Easement.fields.posture
        distinguishing_aspect: |
          Depth-3 cascade from the clock-set trigger: sweep escalates the
          violation (link 1), the escalation creates a PROPOSED EnforcementAction
          (link 2), and that creation flips Easement.posture to ENFORCEMENT_ACTIVE
          with a version bump (link 3) — each link caused by the previous one.
        test_recipe:
          setup:
            - "RECORDED easement (500 ac); clock at 2026-08-10; MATERIAL violation with notice served 2026-08-10 so cure_deadline_on == 2026-09-09"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-CS", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { RESIDENTIAL_CONSTRUCTION: PROHIBITED, AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY, ROAD_CONSTRUCTION: DISCRETIONARY, COMMERCIAL_RECREATION: PROHIBITED, HUNTING: PERMITTED, SUBDIVISION: PROHIBITED, CELL_TOWER: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TrustAdmin }
            - { call: "POST /stewardship/violations", payload: { easement_id: "${e_id}", detected_by_user_id: "coord-9", violation_type: SUBDIVISION, severity: MATERIAL, detected_on: "2026-08-10" }, as: StewardshipCoordinator, captures: { v_id: $.data.id } }
            - { call: "POST /stewardship/violations/${v_id}/send-notice", payload: {}, as: StewardshipCoordinator, captures: { dl: $.data.cure_deadline_on } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: TrustAdmin }
            - { call: "GET /stewardship/violations/${v_id}", payload: {}, as: TrustAdmin, captures: { v_st: $.data.status, v_by: $.data.escalated_by } }
            - { call: "GET /stewardship/enforcement-actions", payload: { violation_id: "${v_id}" }, as: TrustAdmin, captures: { enf_st: "$.data[0].status", enf_eas: "$.data[0].easement_id" } }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { e_posture: $.data.posture } }
          assert:
            - "cure_deadline_on == 2026-09-09 (notice 2026-08-10 + 30 MATERIAL days)"
            - "after clock 2026-09-10 (> deadline): Violation.${v_id}.status == ESCALATED and escalated_by == CLOCK_SWEEP (link 1)"
            - "exactly one EnforcementAction exists for the violation with status == PROPOSED and easement_id == ${e_id} (link 2, caused by link 1)"
            - "Easement.${e_id}.posture == ENFORCEMENT_ACTIVE (link 3, caused by link 2's enforcement creation)"

      - name: amendment_approval_auto_denies_pending_use_authorizations
        grounds:
          - state_machines.AmendmentRequest.STAFF_REVIEW_to_APPROVED
          - state_machines.UseAuthorization.REQUESTED_to_DENIED
          - entities.Easement.fields.permitted_use_matrix
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (amendment approve, not the
          clock): approval mutates Easement.permitted_use_matrix (link 1), and
          that matrix mutation auto-denies the REQUESTED use authorization on the
          changed cell with decision_reason AMENDMENT_SUPERSEDES (link 2).
        test_recipe:
          setup:
            - "RECORDED easement (500 ac); landowner has a REQUESTED use authorization for TIMBER_HARVEST (a DISCRETIONARY cell)"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-AA", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { RESIDENTIAL_CONSTRUCTION: PROHIBITED, AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY, ROAD_CONSTRUCTION: DISCRETIONARY, COMMERCIAL_RECREATION: PROHIBITED, HUNTING: PERMITTED, SUBDIVISION: PROHIBITED, CELL_TOWER: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { ev: $.data.version } }
            - { call: "POST /stewardship/use-authorizations", payload: { easement_id: "${e_id}", use_type: TIMBER_HARVEST, justification: "selective thinning" }, as: Landowner, as_user_id: "${lo_id}", captures: { ua_id: $.data.id } }
            - { call: "POST /stewardship/amendment-requests", payload: { easement_id: "${e_id}", expected_easement_version: "${ev}", submitted_by_user_id: "coord-1", requested_changes: [ { use_type: TIMBER_HARVEST, new_level: PROHIBITED } ], affected_acreage: 100 }, as: StewardshipCoordinator, captures: { am_id: $.data.id, am_score: $.data.materiality_score } }
            - { call: "POST /stewardship/amendment-requests/${am_id}/start-review", payload: {}, as: StewardshipCoordinator }
          trigger:
            - { call: "POST /stewardship/amendment-requests/${am_id}/approve", payload: {}, as: StewardshipCoordinator, as_user_id: "coord-2", captures: { am_st: $.data.status } }
            - { call: "GET /stewardship/use-authorizations/${ua_id}", payload: {}, as: TrustAdmin, captures: { ua_st: $.data.status, ua_reason: $.data.decision_reason } }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { e_matrix: $.data.permitted_use_matrix, e_ver: $.data.version } }
          assert:
            - "am_score == 20 (10 acreage + 10 change + 0 downgrade) so the STAFF path approves without board"
            - "am_st == APPROVED"
            - "Easement.${e_id}.permitted_use_matrix.TIMBER_HARVEST == PROHIBITED (link 1)"
            - "UseAuthorization.${ua_id}.status == DENIED and decision_reason == AMENDMENT_SUPERSEDES (link 2, caused by link 1's matrix mutation)"
            - "Easement version == ev + 2 (create +1, approve +1)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: draw_state_gate_beats_fiscal_check
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors[ERR_FUND_NOT_ACTIVE]
          - errors[ERR_DRAW_EXCEEDS_AUTHORITY]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): a 999999999-cent draw on
          an INITIALIZING fund violates both the fund-ACTIVE gate and the
          draw-authority ceiling; the state error ERR_FUND_NOT_ACTIVE must win.
        test_recipe:
          setup:
            - "Easement exists; EndowmentFund created but no contribution yet (status INITIALIZING, version 1, market_value_cents 0)"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-PP1", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 400, principal_floor_cents: 100000 }, as: TrustAdmin, captures: { f_id: $.data.id, fv: $.data.version } }
          trigger:
            - { call: "POST /stewardship/endowment-funds/${f_id}/draws", payload: { amount_cents: 999999999, purpose: ENFORCEMENT, expected_fund_version: "${fv}" }, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FUND_NOT_ACTIVE with http 409 (state priority 5 beats fiscal priority 12; the amount also exceeds every fiscal ceiling)"

      - name: certify_temporal_window_beats_appraiser_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_SUBSTANTIATION_WINDOW_EXPIRED]
          - errors[ERR_APPRAISER_CONFLICT]
        distinguishing_aspect: |
          Error-category pair (business_temporal vs business_referential): the
          certify call has BOTH an expired substantiation window (clock 2026-08-01
          > gift_on 2025-11-01 + 240d = 2026-06-29) AND an appraiser who prepared
          the baseline; the temporal error ERR_SUBSTANTIATION_WINDOW_EXPIRED must
          win.
        test_recipe:
          setup:
            - "RECORDED easement whose baseline was prepared by staff-prep-1; appraisal engaged to the SAME user id staff-prep-1 with gift_on 2025-11-01, delivered, at default clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-PP2", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/appraisals", payload: { easement_id: "${e_id}", appraiser_user_id: "staff-prep-1", effective_on: "2025-12-15", gift_on: "2025-11-01", contiguous_enhancement_applies: false }, as: StewardshipCoordinator, captures: { ap_id: $.data.id } }
            - { call: "POST /stewardship/appraisals/${ap_id}/deliver", payload: { before_value_cents: 90000000, after_value_cents: 55000000 }, as: Appraiser, as_user_id: "staff-prep-1" }
          trigger:
            - { call: "POST /stewardship/appraisals/${ap_id}/certify", payload: {}, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SUBSTANTIATION_WINDOW_EXPIRED with http 422 (temporal priority 10 beats referential priority 11 even though ERR_APPRAISER_CONFLICT also holds)"
            - "Appraisal.${ap_id}.status remains DELIVERED and deductible_value_cents remains null"

  - rule_id: boundary_precision_check
    instances:
      - name: materiality_exactly_70_routes_board
        grounds:
          - calculations.amendment_materiality_score
          - entities.AmendmentRequest.fields.review_path
        distinguishing_aspect: |
          Boundary metric = materiality score on POST /stewardship/amendment-requests:
          acreage_pts round(300/500*50)=30 + change 10 + downgrade 30 lands exactly
          on BOARD_THRESHOLD 70 and routes BOARD (>= semantics); the 250-acre sibling
          scores 65 and routes STAFF.
        test_recipe:
          setup:
            - "RECORDED easement (500 ac) with the standard matrix"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-B70", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { RESIDENTIAL_CONSTRUCTION: PROHIBITED, AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY, ROAD_CONSTRUCTION: DISCRETIONARY, COMMERCIAL_RECREATION: PROHIBITED, HUNTING: PERMITTED, SUBDIVISION: PROHIBITED, CELL_TOWER: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { ev: $.data.version } }
          trigger:
            - { call: "POST /stewardship/amendment-requests", payload: { easement_id: "${e_id}", expected_easement_version: "${ev}", submitted_by_user_id: "coord-1", requested_changes: [ { use_type: RESIDENTIAL_CONSTRUCTION, new_level: PERMITTED } ], affected_acreage: 300 }, as: StewardshipCoordinator, captures: { am_id: $.data.id, score: $.data.materiality_score, path: $.data.review_path } }
          assert:
            - "AmendmentRequest.${am_id}.materiality_score == 70 exactly (30 + 10 + 30)"
            - "AmendmentRequest.${am_id}.review_path == BOARD (>= 70 boundary is inclusive)"

      - name: monitoring_due_date_inclusive_boundary
        grounds:
          - calculations.monitoring_schedule
          - entities.MonitoringVisit.fields.on_time
        distinguishing_aspect: |
          Boundary metric = completion date vs due date on
          POST /stewardship/monitoring-visits/{id}/complete (a different metric and
          endpoint than the materiality score): actual_visit_on exactly equal to
          next_monitoring_due_on (2027-08-01) is on_time true; one day later is
          on_time false.
        test_recipe:
          setup:
            - "Two RECORDED easements E1 and E2 (both recorded at default clock 2026-08-01, interval 12 -> due 2027-08-01); clock advanced to 2027-07-20; each has a SCHEDULED visit over window [2027-07-25, 2027-08-08) with a distinct monitor"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-BM1", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED }, monitoring_interval_months: 12 }, as: TrustAdmin, captures: { e1: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e1}", owner_name: "O1", contact_email: "o1@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e1}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br1: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br1}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br1}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e1}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-BM2", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED }, monitoring_interval_months: 12 }, as: TrustAdmin, captures: { e2: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e2}", owner_name: "O2", contact_email: "o2@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e2}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br2: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br2}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br2}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-2" }
            - { call: "POST /stewardship/easements/${e2}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-07-20T00:00:00Z" }, as: TrustAdmin }
            - { call: "POST /stewardship/monitoring-visits", payload: { easement_id: "${e1}", monitor_user_id: "mon-1", window_start_on: "2027-07-25", window_end_on: "2027-08-08" }, as: StewardshipCoordinator, captures: { mv1: $.data.id } }
            - { call: "POST /stewardship/monitoring-visits", payload: { easement_id: "${e2}", monitor_user_id: "mon-2", window_start_on: "2027-07-25", window_end_on: "2027-08-08" }, as: StewardshipCoordinator, captures: { mv2: $.data.id } }
          trigger:
            - { call: "POST /stewardship/monitoring-visits/${mv1}/complete", payload: { actual_visit_on: "2027-08-01", findings_summary: "on due date", stewardship_cost_cents: 25000 }, as: FieldMonitor, as_user_id: "mon-1", captures: { ot1: $.data.on_time } }
            - { call: "POST /stewardship/monitoring-visits/${mv2}/complete", payload: { actual_visit_on: "2027-08-02", findings_summary: "one day late", stewardship_cost_cents: 25000 }, as: FieldMonitor, as_user_id: "mon-2", captures: { ot2: $.data.on_time } }
          assert:
            - "MonitoringVisit.${mv1}.on_time == true (actual == due date is inclusive)"
            - "MonitoringVisit.${mv2}.on_time == false (due date + 1 day)"
            - "Easement.${e1}.next_monitoring_due_on == 2028-08-01 after the on-time completion"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: easement_record_requires_accepted_baseline
        grounds:
          - state_machines.Easement.DRAFT_to_RECORDED
          - state_machines.BaselineReport
          - errors[ERR_BASELINE_NOT_ACCEPTED]
        distinguishing_aspect: |
          Entity pair Easement -> BaselineReport: record is rejected while the
          baseline is DRAFT, and only succeeds after the baseline reaches ACCEPTED.
        test_recipe:
          setup:
            - "Easement DRAFT with an ACTIVE landowner and a DRAFT baseline report"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-CE1", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
          trigger:
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { st: $.data.status, due: $.data.next_monitoring_due_on } }
          assert:
            - "first record attempt: err == ERR_BASELINE_NOT_ACCEPTED (409); easement stays DRAFT"
            - "after baseline acceptance: st == RECORDED"
            - "Easement.${e_id}.next_monitoring_due_on == 2027-08-01 (recorded 2026-08-01 + 12 months)"

      - name: use_auth_decide_frozen_by_inflight_amendment
        grounds:
          - state_machines.UseAuthorization.REQUESTED_to_APPROVED
          - state_machines.AmendmentRequest
          - errors[ERR_AMENDMENT_FREEZE_CONFLICT]
        distinguishing_aspect: |
          Entity pair UseAuthorization -> AmendmentRequest (different pair than
          Easement -> BaselineReport): decide is rejected while any amendment of
          the same easement touching the same use_type is in flight.
        test_recipe:
          setup:
            - "RECORDED easement; landowner holds a REQUESTED TIMBER_HARVEST authorization; an amendment touching TIMBER_HARVEST is in STAFF_REVIEW"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-CE2", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { RESIDENTIAL_CONSTRUCTION: PROHIBITED, AGRICULTURE: PERMITTED, TIMBER_HARVEST: DISCRETIONARY, ROAD_CONSTRUCTION: DISCRETIONARY, COMMERCIAL_RECREATION: PROHIBITED, HUNTING: PERMITTED, SUBDIVISION: PROHIBITED, CELL_TOWER: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin, captures: { lo_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin, captures: { ev: $.data.version } }
            - { call: "POST /stewardship/use-authorizations", payload: { easement_id: "${e_id}", use_type: TIMBER_HARVEST, justification: "thinning" }, as: Landowner, as_user_id: "${lo_id}", captures: { ua_id: $.data.id } }
            - { call: "POST /stewardship/amendment-requests", payload: { easement_id: "${e_id}", expected_easement_version: "${ev}", submitted_by_user_id: "coord-1", requested_changes: [ { use_type: TIMBER_HARVEST, new_level: PROHIBITED } ], affected_acreage: 100 }, as: StewardshipCoordinator, captures: { am_id: $.data.id } }
            - { call: "POST /stewardship/amendment-requests/${am_id}/start-review", payload: {}, as: StewardshipCoordinator }
          trigger:
            - { call: "POST /stewardship/use-authorizations/${ua_id}/decide", payload: { decision: APPROVED }, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_AMENDMENT_FREEZE_CONFLICT (409)"
            - "UseAuthorization.${ua_id}.status remains REQUESTED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: monitor_window_half_open_adjacency
        grounds:
          - validations[priority=10]
          - errors[ERR_MONITOR_WINDOW_OVERLAP]
          - entities.MonitoringVisit.fields.monitor_user_id
        distinguishing_aspect: |
          Half-open interval semantics on the MonitoringVisit resource: windows
          [2026-09-01, 2026-09-10) and [2026-09-10, 2026-09-20) for the same
          monitor touch but do NOT conflict, while [2026-09-09, 2026-09-11)
          intersects the first and is rejected.
        test_recipe:
          setup:
            - "RECORDED easement; monitor mon-1 has one SCHEDULED visit over [2026-09-01, 2026-09-10)"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-OV1", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/monitoring-visits", payload: { easement_id: "${e_id}", monitor_user_id: "mon-1", window_start_on: "2026-09-01", window_end_on: "2026-09-10" }, as: StewardshipCoordinator, captures: { va: $.data.id } }
          trigger:
            - { call: "POST /stewardship/monitoring-visits", payload: { easement_id: "${e_id}", monitor_user_id: "mon-1", window_start_on: "2026-09-10", window_end_on: "2026-09-20" }, as: StewardshipCoordinator, captures: { vb: $.data.id } }
            - { call: "POST /stewardship/monitoring-visits", payload: { easement_id: "${e_id}", monitor_user_id: "mon-1", window_start_on: "2026-09-09", window_end_on: "2026-09-11" }, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "adjacent window [2026-09-10, 2026-09-20) is accepted (half-open end == start touches without overlap)"
            - "interior-intersecting window [2026-09-09, 2026-09-11) is rejected: err == ERR_MONITOR_WINDOW_OVERLAP (409)"

      - name: appraisal_engagement_365_day_buffer
        grounds:
          - validations[priority=10]
          - errors[ERR_APPRAISAL_ENGAGEMENT_OVERLAP]
          - entities.Appraisal.fields.appraiser_user_id
        distinguishing_aspect: |
          Different interval semantics on a different resource: Appraisal
          engagements for the same (appraiser, easement) conflict when effective
          dates are < 365 days apart — a distance-with-buffer rule, not interval
          intersection; exactly 365 days apart is allowed.
        test_recipe:
          setup:
            - "RECORDED easement; appraiser appr-1 has an ENGAGED appraisal effective 2026-03-01"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-OV2", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "O", contact_email: "o@x.com" }, as: TrustAdmin }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/appraisals", payload: { easement_id: "${e_id}", appraiser_user_id: "appr-1", effective_on: "2026-03-01", gift_on: "2026-04-01", contiguous_enhancement_applies: false }, as: StewardshipCoordinator, captures: { apa: $.data.id } }
          trigger:
            - { call: "POST /stewardship/appraisals", payload: { easement_id: "${e_id}", appraiser_user_id: "appr-1", effective_on: "2026-12-01", gift_on: "2027-01-15", contiguous_enhancement_applies: false }, as: StewardshipCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /stewardship/appraisals", payload: { easement_id: "${e_id}", appraiser_user_id: "appr-1", effective_on: "2027-03-01", gift_on: "2027-04-01", contiguous_enhancement_applies: false }, as: StewardshipCoordinator, captures: { apc: $.data.id } }
          assert:
            - "275-day gap (2026-03-01 -> 2026-12-01) is rejected: err == ERR_APPRAISAL_ENGAGEMENT_OVERLAP (409)"
            - "exactly-365-day gap (2026-03-01 -> 2027-03-01) is accepted (boundary is strict <) and the new appraisal reaches ENGAGED"

  - rule_id: compensating_invariant
    instances:
      - name: fund_ledger_conservation_across_posting_types
        grounds:
          - calculations.unit_value_unitization
          - entities.EndowmentFund.fields.market_value_cents
          - entities.EndowmentFund.fields.units_outstanding
        distinguishing_aspect: |
          Conserved quantities: market_value_cents == sum of ledger amount_cents
          and units_outstanding == sum of ledger units after every posting type
          (contribution, positive return, draw, negative return) — forward and
          compensating postings leave both invariants exact.
        test_recipe:
          setup:
            - "Easement with ACTIVE fund (floor 100000, rate 400bps): contribution 500000, return +50000, draw 120000, return -20000"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-CI1", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds", payload: { easement_id: "${e_id}", spending_rate_bps: 400, principal_floor_cents: 100000 }, as: TrustAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/contributions", payload: { amount_cents: 500000 }, as: TrustAdmin, captures: { u1: $.data.units } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/returns", payload: { amount_cents: 50000 }, as: TrustAdmin }
            - { call: "GET /stewardship/endowment-funds/${f_id}", payload: {}, as: TrustAdmin, captures: { fv: $.data.version } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/draws", payload: { amount_cents: 120000, purpose: GENERAL_STEWARDSHIP, expected_fund_version: "${fv}" }, as: StewardshipCoordinator, captures: { u_draw: $.data.units, d_amt: $.data.amount_cents } }
            - { call: "POST /stewardship/endowment-funds/${f_id}/returns", payload: { amount_cents: -20000 }, as: TrustAdmin }
          trigger:
            - { call: "GET /stewardship/endowment-funds/${f_id}", payload: {}, as: TrustAdmin, captures: { mv: $.data.market_value_cents, u_out: $.data.units_outstanding } }
            - { call: "GET /stewardship/endowment-funds/${f_id}/transactions", payload: {}, as: TrustAdmin, captures: { tx0_amt: "$.data[0].amount_cents", tx1_amt: "$.data[1].amount_cents", tx2_amt: "$.data[2].amount_cents", tx3_amt: "$.data[3].amount_cents" } }
          assert:
            - "contribution issued u1 == 5000.0000 units at the 100.0000 anchor"
            - "draw redeemed u_draw == 1090.9091 units (round(120000 / 110.0000, 4)) with amount_cents == -120000"
            - "EndowmentFund.${f_id}.market_value_cents == 410000 == 500000 + 50000 - 120000 - 20000 == sum of ledger amount_cents"
            - "EndowmentFund.${f_id}.units_outstanding == 3909.0909 == 5000.0000 - 1090.9091 == sum of ledger units"
            - "ledger order is (posted_on, created_at): tx0==500000 CONTRIBUTION, tx1==50000 INVESTMENT_RETURN, tx2==-120000 DRAW, tx3==-20000 INVESTMENT_RETURN"

      - name: single_active_landowner_conserved_across_succession
        grounds:
          - state_machines.Landowner
          - state_machines.SuccessionNotice.ACKNOWLEDGED_to_RECORDED
          - entities.Easement.fields.current_landowner_id
        distinguishing_aspect: |
          A different conserved quantity than fund cents: the count of ACTIVE
          Landowner rows per easement is invariant at exactly 1 — recording a
          succession activates the successor and supersedes the predecessor in the
          same mutation, so the count neither dips to 0 nor doubles to 2.
        test_recipe:
          setup:
            - "RECORDED easement with ACTIVE landowner A; landowner A gives a succession notice (transfer 2026-09-15, 45 days after the 2026-08-01 default clock, satisfying the 30-day minimum), trust acknowledges it"
          setup_api_calls:
            - { call: "POST /stewardship/easements", payload: { easement_name: "E-CI2", grantor_name: "G", parcel_acreage: 500, permitted_use_matrix: { AGRICULTURE: PERMITTED, SUBDIVISION: PROHIBITED } }, as: TrustAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /stewardship/landowners", payload: { easement_id: "${e_id}", owner_name: "Owner A", contact_email: "a@x.com" }, as: TrustAdmin, captures: { lo_a: $.data.id } }
            - { call: "POST /stewardship/baseline-reports", payload: { easement_id: "${e_id}", prepared_by_user_id: "staff-prep-1", condition_narrative: "n", photo_point_count: 5 }, as: StewardshipCoordinator, captures: { br_id: $.data.id } }
            - { call: "POST /stewardship/baseline-reports/${br_id}/submit", payload: {}, as: StewardshipCoordinator }
            - { call: "POST /stewardship/baseline-reports/${br_id}/accept", payload: {}, as: TrustBoardReviewer, as_user_id: "board-1" }
            - { call: "POST /stewardship/easements/${e_id}/record", payload: {}, as: TrustAdmin }
            - { call: "POST /stewardship/succession-notices", payload: { easement_id: "${e_id}", successor_owner_name: "Owner B", successor_contact_email: "b@x.com", transfer_on: "2026-09-15" }, as: Landowner, as_user_id: "${lo_a}", captures: { sn_id: $.data.id, lo_b: $.data.successor_landowner_id } }
            - { call: "POST /stewardship/succession-notices/${sn_id}/acknowledge", payload: {}, as: TrustAdmin }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { ev: $.data.version } }
          trigger:
            - { call: "POST /stewardship/succession-notices/${sn_id}/record", payload: { expected_easement_version: "${ev}" }, as: TrustAdmin, captures: { sn_st: $.data.status } }
            - { call: "GET /stewardship/landowners", payload: { easement_id: "${e_id}", status: ACTIVE }, as: TrustAdmin, captures: { active0: "$.data[0].id" } }
            - { call: "GET /stewardship/landowners/${lo_a}", payload: {}, as: TrustAdmin, captures: { a_st: $.data.status } }
            - { call: "GET /stewardship/easements/${e_id}", payload: {}, as: TrustAdmin, captures: { cur: $.data.current_landowner_id } }
          assert:
            - "sn_st == RECORDED"
            - "exactly one ACTIVE landowner remains for the easement and its id == ${lo_b} (successor); invariant count(ACTIVE) == 1 holds before and after record"
            - "Landowner.${lo_a}.status == SUPERSEDED"
            - "Easement.${e_id}.current_landowner_id == ${lo_b}"
