      - name: correction_deadline_inclusive_then_lapse
        claim_type: temporal_validation
        grounds: ["validations[priority=8.1]", "state_machines.DocumentFinding", "errors[ERR_CORRECTION_WINDOW_EXPIRED]"]
        distinguishing_aspect: "file-correction on the deadline date itself (2028-12-31 for failure_year 2026) is accepted; after the clock crosses to 2029-01-01 the sweep lapses the still-open finding (REPORTED -> LAPSED), plan posture becomes LAPSED_FAILURE; and an operational-failure correction attempted past its own identical deadline is rejected with ERR_CORRECTION_WINDOW_EXPIRED (failures never auto-lapse, so the state gate passes and the temporal gate is the one that fires)."
        test_recipe:
          setup: ["ACTIVE plan; finding F1 with failure_year 2026 (deadline 2028-12-31); participant with account and a QUANTIFIED operational failure dated 2026-06-01 (deadline 2028-12-31)"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan CD", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
            - call: "POST /api/document-findings"
              payload: { plan_id: "${plan_id}", description: "Missing deferral election timing clause", failure_year: 2026 }
              as: ComplianceOfficer
              captures: { f1_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-CD", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /api/operational-failures"
              payload: { account_id: "${account_id}", failure_type: "LATE_PAYMENT", failure_date: "2026-06-01", amount_cents: 50000, description: "paid after scheduled date" }
              as: BenefitsAdministrator
              as_user_id: "ba-1"
              captures: { failure_id: $.data.id }
            - call: "POST /api/operational-failures/${failure_id}/quantify"
              payload: { correction_credit_cents: 0 }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-12-31T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/document-findings/${f1_id}/file-correction"
              payload: { correction_text: "Amendment restating election timing rules" }
              as: ComplianceOfficer
              captures: { f1_status: $.data.status }
            - call: "POST /api/document-findings/${f1_id}/adjudicate"
              payload: { outcome: "REJECTED" }
              as: PlanSponsor
              captures: { f1_back: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/document-findings/${f1_id}"
              as: ComplianceOfficer
              captures: { f1_lapsed: $.data.status }
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { posture: $.data.document_posture }
            - call: "POST /api/operational-failures/${failure_id}/correct"
              as: ComplianceOfficer
              captures: { late_err: $.data.error_id }
          assert:
            - "${f1_status} == CORRECTION_FILED (deadline date 2028-12-31 is inclusive)"
            - "${f1_back} == REPORTED (REJECTED adjudication cycles the finding back)"
            - "${f1_lapsed} == LAPSED (clock past deadline lapses the reopened finding)"
            - "${posture} == LAPSED_FAILURE"
            - "${late_err} == ERR_CORRECTION_WINDOW_EXPIRED (2029-01-01 > 2028-12-31)"
