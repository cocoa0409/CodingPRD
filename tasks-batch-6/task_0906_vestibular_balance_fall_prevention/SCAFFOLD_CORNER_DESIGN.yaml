scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: corner_create_patient_minimal
        claim_type: creation
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "POST /patients with the three required fields returns 201, echoes them, and stamps id/created_at/version=1/status=ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Amy Anvil", date_of_birth: "1950-01-01", insurance_member_id: "MEM-C-01" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "Patient.${pid}.full_name == 'Amy Anvil'"
            - "Patient.${pid}.status == ACTIVE"
            - "Patient.${pid}.version == 1"

      - name: corner_patient_not_found_on_get
        claim_type: not_found
        grounds: [entities.Patient, "errors[ERR_PATIENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /patients/{unknown-uuid} returns 404 ERR_PATIENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_PATIENT_NOT_FOUND"
            - "trigger response HTTP status == 404"

      - name: corner_assessment_missing_required_gait_returns_validation
        claim_type: required_field
        grounds: [entities.Assessment, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /assessments omitting gait_speed_m_s returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["A patient, referral, and clinician exist."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Bea Basel", date_of_birth: "1951-02-02", insurance_member_id: "MEM-C-02" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "falls" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr PT", discipline: "PT", npi: "2000000001" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", tug_seconds: 12.0, berg_balance_score: 30, medication_count: 2, self_report_fall_count: 1 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_VALIDATION"
            - "trigger response HTTP status == 400"

      - name: corner_room_invalid_enum_room_type
        claim_type: type_constraint
        grounds: [entities.TherapyRoom, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /rooms with room_type outside {BALANCE_GYM, EXAM, GAIT_LAB} returns 422 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rooms"
              payload: { name: "Closet", room_type: "CLOSET" }
              as: ClinicSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_ENUM"
            - "trigger response HTTP status == 422"

      - name: corner_patient_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Patient]
        distinguishing_aspect: "Client-supplied status/version on POST /patients are ignored; server stamps status=ACTIVE and version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Cal Cupula", date_of_birth: "1952-03-03", insurance_member_id: "MEM-C-03", status: "DISCHARGED", version: 99 }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
          assert:
            - "Patient.${pid}.status == ACTIVE"
            - "Patient.${pid}.version == 1"

  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_referral_decision_accept_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.Referral.RECEIVED_to_ACCEPTED]
        distinguishing_aspect: "POST /referrals/{id}/decision {ACCEPT} moves a RECEIVED referral to ACCEPTED."
        test_recipe:
          setup: ["A RECEIVED referral exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Dan Drum", date_of_birth: "1953-04-04", insurance_member_id: "MEM-C-04" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "falls" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /referrals/${rid}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
          assert:
            - "Referral.${rid}.status == ACCEPTED"

      - name: corner_finalize_assessment_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Assessment.DRAFT_to_FINALIZED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Finalizing an already-FINALIZED assessment returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A FINALIZED assessment exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Eli Eust", date_of_birth: "1954-05-05", insurance_member_id: "MEM-C-05" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "falls" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr PT", discipline: "PT", npi: "2000000002" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.55, tug_seconds: 14.0, berg_balance_score: 18, medication_count: 5, self_report_fall_count: 2 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
          trigger:
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "trigger response HTTP status == 409"

      - name: corner_activate_non_draft_plan_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CarePlan.DRAFT_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already-ACTIVE care plan returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ACTIVE care plan exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Fin Fovea", date_of_birth: "1955-06-06", insurance_member_id: "MEM-C-06" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "falls" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr PT", discipline: "PT", npi: "2000000003" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.55, tug_seconds: 14.0, berg_balance_score: 18, medication_count: 5, self_report_fall_count: 2 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /care-plans"
              payload: { patient_id: "${pid}", assessment_id: "${aid}" }
              as: IntakeCoordinator
              captures: { cpid: $.data.id }
            - call: "POST /care-plans/${cpid}/activate"
              payload: {}
              as: ClinicSupervisor
          trigger:
            - call: "POST /care-plans/${cpid}/activate"
              payload: {}
              as: ClinicSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "trigger response HTTP status == 409"

      - name: corner_device_dispense_before_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.AssistiveDeviceReferral.APPROVED_to_DISPENSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DISPENSE on a PENDING (not yet APPROVED) device referral returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PENDING manual device referral exists on a plan."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Gil Gasser", date_of_birth: "1956-07-07", insurance_member_id: "MEM-C-07" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "falls" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr OT", discipline: "OT", npi: "2000000004" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.55, tug_seconds: 14.0, berg_balance_score: 18, medication_count: 5, self_report_fall_count: 2 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /care-plans"
              payload: { patient_id: "${pid}", assessment_id: "${aid}" }
              as: IntakeCoordinator
              captures: { cpid: $.data.id }
            - call: "POST /device-referrals"
              payload: { patient_id: "${pid}", care_plan_id: "${cpid}", device_type: "CANE" }
              as: Clinician
              as_user_id: "${clid}"
              captures: { drid: $.data.id }
          trigger:
            - call: "POST /device-referrals/${drid}/decision"
              payload: { decision: "DISPENSE" }
              as: ClinicSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "trigger response HTTP status == 409"

  # =========================================================================
  - section: calculations
    instances:
      - name: corner_home_hazard_moderate_tier_no_cascade
        claim_type: correct_result
        grounds: [calculations.home_hazard_score, entities.HomeSafetyEvaluation.fields.hazard_tier]
        distinguishing_aspect: "Score 12 (loose_rugs 4) yields hazard_tier MODERATE and NO auto device referral (generated_device_referral_id null)."
        test_recipe:
          setup: ["ACTIVE plan; DRAFT home-safety evaluation with loose_rugs=4, others 0."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Hana Helix", date_of_birth: "1957-08-08", insurance_member_id: "MEM-C-08" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "home" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr OT", discipline: "OT", npi: "2000000005" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.55, tug_seconds: 14.0, berg_balance_score: 18, medication_count: 5, self_report_fall_count: 2 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /care-plans"
              payload: { patient_id: "${pid}", assessment_id: "${aid}" }
              as: IntakeCoordinator
              captures: { cpid: $.data.id }
            - call: "POST /care-plans/${cpid}/activate"
              payload: {}
              as: ClinicSupervisor
            - call: "POST /home-safety-evaluations"
              payload: { patient_id: "${pid}", care_plan_id: "${cpid}", loose_rugs: 4, poor_lighting_rooms: 0, missing_grab_bars: 0, unsecured_stairs: 0, clutter_pathways: 0 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { hseid: $.data.id }
          trigger:
            - call: "POST /home-safety-evaluations/${hseid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
          assert:
            - "HomeSafetyEvaluation.${hseid}.home_hazard_score == 12"
            - "HomeSafetyEvaluation.${hseid}.hazard_tier == MODERATE"
            - "HomeSafetyEvaluation.${hseid}.generated_device_referral_id == null"

      - name: corner_outcome_summary_no_reassessment
        claim_type: computed_field
        grounds: [calculations.outcome_summary, endpoints]
        distinguishing_aspect: "GET /care-plans/{id}/outcome with one attended visit and no finalized reassessment yields clinical_score_delta null, attended_visit_count 1, improvement_flag false."
        test_recipe:
          setup: ["ACTIVE HIGH plan; one attended session; no reassessment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /patients"
              payload: { full_name: "Ivo Incus", date_of_birth: "1958-09-09", insurance_member_id: "MEM-C-09" }
              as: IntakeCoordinator
              captures: { pid: $.data.id }
            - call: "POST /referrals"
              payload: { patient_id: "${pid}", referral_source: "Dr PCP", reason: "falls" }
              as: IntakeCoordinator
              captures: { rid: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr PT", discipline: "PT", npi: "2000000006" }
              as: ClinicSupervisor
              captures: { clid: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Balance Gym I", room_type: "BALANCE_GYM" }
              as: ClinicSupervisor
              captures: { roomid: $.data.id }
            - call: "POST /assessments"
              payload: { patient_id: "${pid}", referral_id: "${rid}", clinician_id: "${clid}", gait_speed_m_s: 0.55, tug_seconds: 14.0, berg_balance_score: 18, medication_count: 5, self_report_fall_count: 2 }
              as: Clinician
              as_user_id: "${clid}"
              captures: { aid: $.data.id }
            - call: "POST /assessments/${aid}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
            - call: "POST /care-plans"
              payload: { patient_id: "${pid}", assessment_id: "${aid}" }
              as: IntakeCoordinator
              captures: { cpid: $.data.id }
            - call: "POST /care-plans/${cpid}/activate"
              payload: {}
              as: ClinicSupervisor
            - call: "POST /authorizations"
              payload: { patient_id: "${pid}", care_plan_id: "${cpid}", payer_name: "Medicare", visits_authorized: 5, allowed_amount_cents: 15000, coinsurance_pct: 0.20 }
              as: IntakeCoordinator
              captures: { authid: $.data.id }
            - call: "POST /authorizations/${authid}/decision"
              payload: { decision: "APPROVE" }
              as: ClinicSupervisor
            - call: "POST /sessions"
              payload: { care_plan_id: "${cpid}", clinician_id: "${clid}", room_id: "${roomid}", authorization_id: "${authid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", cpt_code: "97116" }
              as: IntakeCoordinator
              captures: { sid: $.data.id }
            - call: "POST /sessions/${sid}/attend"
              payload: {}
              as: Clinician
              as_user_id: "${clid}"
          trigger:
            - call: "GET /care-plans/${cpid}/outcome"
              payload: {}
              as: ClinicSupervisor
              captures: { tier0: $.data.tier_at_intake, attended: $.data.attended_visit_count }
          assert:
            - "outcome.tier_at_intake == HIGH"
            - "outcome.tier_current == HIGH"
            - "outcome.clinical_score_delta == null"
            - "outcome.attended_visit_count == 1"
            - "outcome.total_patient_responsibility_cents == 3000"
            - "outcome.improvement_flag == false"

  # =========================================================================
  - section: validations
    instances:
      - name: corner_session_invalid_time_range_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_TIME_RANGE]"]
        distinguishing_aspect: "scheduled_end == scheduled_start returns 400 ERR_INVALID_TIME_RANGE."
