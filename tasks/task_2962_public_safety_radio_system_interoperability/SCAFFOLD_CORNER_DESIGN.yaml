              payload: { agency_id: "${agency_npt_id}", serial_number: "NPT0001", radio_id: 41001, model: "PORTABLE", emergency_button_enabled: true }
              as: AgencyRadioManager
              as_user_id: "${agency_npt_id}"
              captures: { unit_npt1: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_npt_id}", serial_number: "NPT0002", radio_id: 41002, model: "PORTABLE", emergency_button_enabled: true }
              as: AgencyRadioManager
              as_user_id: "${agency_npt_id}"
              captures: { unit_npt2: "$.data.id" }
            - call: "POST /radio-system/units/${unit_npt1}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_npt_id}" }
