  - { method: POST, path: "/mill/cell-bookings/{id}/complete", description: "Complete an IN_PROGRESS booking; SEW/UPHOLSTER completion advances the line", roles: [ProductionPlanner], code: 200, input: [], output: CellBooking, side_effects: ["status → COMPLETED; SEW → line SEWN; UPHOLSTER → line UPHOLSTERED (order may → QUALITY_REVIEW); cell.committed_hours recomputed (calculation cell_committed_hours)"] }
  - { method: POST, path: "/mill/cell-bookings/{id}/release", description: "Release a BOOKED booking", roles: [ProductionPlanner], code: 200, input: [], output: CellBooking, side_effects: ["status → RELEASED; cell.committed_hours recomputed (calculation cell_committed_hours)"] }

  # --- ComplianceCertificate ---
  - { method: POST, path: "/mill/compliance-certificates", description: "Create a flammability certificate (DRAFT) for an order", roles: [ComplianceOfficer], code: 201, input: [order_id, standard, label_lot_number, label_count], output: ComplianceCertificate, side_effects: ["one active (DRAFT or CERTIFIED) certificate per order (ERR_CERTIFICATE_EXISTS)"] }
  - { method: GET, path: "/mill/compliance-certificates", description: "List certificates with filters", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["order_id?", "limit?", "offset?"], output: "ComplianceCertificate[]", side_effects: [] }
  - { method: GET, path: "/mill/compliance-certificates/{id}", description: "Get a certificate", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: ComplianceCertificate, side_effects: [] }
  - { method: POST, path: "/mill/compliance-certificates/{id}/certify", description: "Certify a DRAFT certificate (segregation of duties vs lot inspector)", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceCertificate, side_effects: ["status → CERTIFIED; certified_by/certified_at set"] }
  - { method: POST, path: "/mill/compliance-certificates/{id}/void", description: "Void a certificate while the order is still in production/quality", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceCertificate, side_effects: ["status → VOID"] }

  # --- SupplyRequisition ---
  - { method: POST, path: "/mill/supply-requisitions", description: "Create a component requisition for a confirmed line (CONTAINER or DOMESTIC)", roles: [ProductionPlanner], code: 201, input: [order_line_id, component_code, quantity, source_type], output: SupplyRequisition, side_effects: ["ordered_quantity/unit_cost/extended_cost/available_date computed (requisition_sizing); requires order status ∈ {CONFIRMED, MATERIAL_HOLD, IN_PRODUCTION} (ERR_ORDER_NOT_BOOKABLE)"] }
  - { method: GET, path: "/mill/supply-requisitions", description: "List requisitions with filters", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["order_line_id?", "limit?", "offset?"], output: "SupplyRequisition[]", side_effects: [] }
  - { method: GET, path: "/mill/supply-requisitions/{id}", description: "Get a requisition", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: SupplyRequisition, side_effects: [] }
  - { method: POST, path: "/mill/supply-requisitions/{id}/place", description: "Place an OPEN requisition", roles: [ProductionPlanner], code: 200, input: [], output: SupplyRequisition, side_effects: ["status → PLACED"] }
  - { method: POST, path: "/mill/supply-requisitions/{id}/receive", description: "Receive a PLACED requisition (gated by available_date on the logical clock)", roles: [ProductionPlanner], code: 200, input: [], output: SupplyRequisition, side_effects: ["status → RECEIVED; received_at set"] }

  # --- ShowroomSample ---
  - { method: POST, path: "/mill/showroom-samples", description: "Issue a serialized showroom sample on loan to a dealer", roles: [SalesRep], code: 201, input: [dealer_id, model_id, unit_serial, sample_value_cents, "due_back_days?"], output: ShowroomSample, side_effects: ["disposition = ON_LOAN; loaned_at set; due_back_at computed; dealer.outstanding_sample_value_cents recomputed (calculation sample_allowance_ledger)"] }
  - { method: GET, path: "/mill/showroom-samples", description: "List samples with filters", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["dealer_id?", "model_id?", "disposition?", "limit?", "offset?"], output: "ShowroomSample[]", side_effects: [] }
  - { method: GET, path: "/mill/showroom-samples/{id}", description: "Get a sample", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: ShowroomSample, side_effects: [] }
  - { method: POST, path: "/mill/showroom-samples/{id}/return", description: "Record sample return (starts the 5-day refurb gap for the serial)", roles: [SalesRep], code: 200, input: [], output: ShowroomSample, side_effects: ["disposition → RETURNED; returned_at set; dealer outstanding recomputed (calculation sample_allowance_ledger)"] }
  - { method: POST, path: "/mill/showroom-samples/{id}/sell", description: "Sell the loaned sample to the dealer", roles: [SalesRep], code: 200, input: [], output: ShowroomSample, side_effects: ["disposition → SOLD; dealer outstanding recomputed (calculation sample_allowance_ledger)"] }
  - { method: POST, path: "/mill/showroom-samples/{id}/write-off", description: "Write off a loaned sample (allowance stays consumed)", roles: [SalesRep], code: 200, input: [], output: ShowroomSample, side_effects: ["disposition → WRITTEN_OFF; dealer outstanding UNCHANGED (calculation sample_allowance_ledger)"] }

  # --- Shipment ---
  - { method: POST, path: "/mill/shipments", description: "Create a shipment (DRAFT) for a confirmed-or-later order", roles: [ShippingCoordinator], code: 201, input: [order_id, carrier_name, weight_lb, length_in, width_in, height_in, "declared_value_cents?", piece_count, "condition_check_passed?"], output: Shipment, side_effects: ["method copied from order.delivery_method; one shipment per order (ERR_SHIPMENT_EXISTS); requires order status ∈ {CONFIRMED, MATERIAL_HOLD, IN_PRODUCTION, QUALITY_REVIEW, READY_TO_SHIP} (ERR_ORDER_NOT_READY_TO_SHIP)"] }
  - { method: GET, path: "/mill/shipments", description: "List shipments with filters", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: ["order_id?", "limit?", "offset?"], output: "Shipment[]", side_effects: [] }
  - { method: GET, path: "/mill/shipments/{id}", description: "Get a shipment", roles: [SalesRep, ProductionPlanner, MaterialReceiver, QualityInspector, ComplianceOfficer, ShippingCoordinator, PlantAdmin], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: POST, path: "/mill/shipments/{id}/rate", description: "Rate a DRAFT shipment (class + charge per method variant)", roles: [ShippingCoordinator], code: 200, input: [], output: Shipment, side_effects: ["density, freight_class, freight_charge_cents computed; status → RATED"] }
  - { method: POST, path: "/mill/shipments/{id}/tender", description: "Tender a RATED shipment (order must be READY_TO_SHIP)", roles: [ShippingCoordinator], code: 200, input: [], output: Shipment, side_effects: ["status → TENDERED"] }
  - { method: POST, path: "/mill/shipments/{id}/record-pickup", description: "Record carrier pickup; WHITE_GLOVE requires condition_check_passed true", roles: [ShippingCoordinator], code: 200, input: ["condition_check_passed?"], output: Shipment, side_effects: ["status → PICKED_UP; order → SHIPPED"] }
  - { method: POST, path: "/mill/shipments/{id}/record-delivery", description: "Record delivery", roles: [ShippingCoordinator], code: 200, input: [], output: Shipment, side_effects: ["status → DELIVERED; order → DELIVERED"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/mill/_clock/set_current_utc", description: "Set the server's logical clock (ISO8601 UTC). Startup default is exactly 2026-05-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time.", roles: [PlantAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced (monotonic not required; tests may move it backwards only between independent scenarios)"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not a declared role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted on this endpoint" }
  # --- input ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, illegal enum value, non-positive quantity/yards, end_at ≤ start_at, non-positive measured_width_inches on inspect PASS" }
  - { id: ERR_DUPLICATE_NATURAL_KEY, http: 409, condition: "model_code, fabric_code, dealer_code, cell_code, or order_number already exists" }
  # --- not found (one per entity) ---
  - { id: ERR_PRODUCT_MODEL_NOT_FOUND, http: 404, condition: "ProductModel id does not exist" }
  - { id: ERR_FABRIC_SPEC_NOT_FOUND, http: 404, condition: "FabricSpec id does not exist" }
  - { id: ERR_DEALER_NOT_FOUND, http: 404, condition: "DealerAccount id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "CustomerOrder id does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "OrderLine id does not exist" }
  - { id: ERR_MATERIAL_LOT_NOT_FOUND, http: 404, condition: "MaterialLot id does not exist" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "MaterialAllocation id does not exist" }
  - { id: ERR_CUT_PLAN_NOT_FOUND, http: 404, condition: "CutPlan id does not exist" }
  - { id: ERR_CELL_NOT_FOUND, http: 404, condition: "Cell id does not exist" }
  - { id: ERR_CELL_BOOKING_NOT_FOUND, http: 404, condition: "CellBooking id does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "ComplianceCertificate id does not exist" }
  - { id: ERR_REQUISITION_NOT_FOUND, http: 404, condition: "SupplyRequisition id does not exist" }
  - { id: ERR_SAMPLE_NOT_FOUND, http: 404, condition: "ShowroomSample id does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id does not exist" }
  # --- state ---
  - { id: ERR_MODEL_NOT_ACTIVE, http: 409, condition: "Line create references a DISCONTINUED ProductModel" }
  - { id: ERR_DEALER_SUSPENDED, http: 409, condition: "Order create/confirm or sample create against a SUSPENDED dealer" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "Line create or order confirm requires the order in DRAFT" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel requires DRAFT, CONFIRMED, or MATERIAL_HOLD" }
  - { id: ERR_ORDER_NOT_IN_QUALITY_REVIEW, http: 409, condition: "pass-quality, fail-quality, certificate certify/void require the order in the expected quality stage" }
  - { id: ERR_ORDER_NOT_BOOKABLE, http: 409, condition: "Booking create/start or requisition create requires order CONFIRMED or IN_PRODUCTION (bookings) / CONFIRMED, MATERIAL_HOLD, or IN_PRODUCTION (requisitions)" }
  - { id: ERR_ORDER_NOT_READY_TO_SHIP, http: 409, condition: "Shipment create requires order ∈ {CONFIRMED, MATERIAL_HOLD, IN_PRODUCTION, QUALITY_REVIEW, READY_TO_SHIP}; tender requires READY_TO_SHIP" }
  - { id: ERR_LINE_STAGE_MISMATCH, http: 409, condition: "Booking operation ahead of the line stage (SEW needs CUT, UPHOLSTER needs SEWN), cut-plan approve needs ALLOCATED, record-cut needs a COMPLETED CUT booking, fail-quality targets must be UPHOLSTERED" }
  - { id: ERR_LOT_INVALID_STATE, http: 409, condition: "receive requires EXPECTED; inspect requires RECEIVED; return-to-customer requires REJECTED" }
  - { id: ERR_LOT_NOT_AVAILABLE, http: 409, condition: "Allocation create, split, or reject-lot requires the lot AVAILABLE" }
  - { id: ERR_LOT_NOT_RETURNABLE, http: 409, condition: "return-to-customer on a PLANT-owned lot" }
  - { id: ERR_ALLOCATION_INVALID_STATE, http: 409, condition: "Release requires the allocation ACTIVE" }
  - { id: ERR_CUT_PLAN_NOT_DRAFT, http: 409, condition: "Approve requires the plan DRAFT" }
  - { id: ERR_CUT_PLAN_NOT_APPROVED, http: 409, condition: "revise/record-cut require the plan APPROVED" }
  - { id: ERR_BOOKING_INVALID_STATE, http: 409, condition: "start/release require BOOKED; complete requires IN_PROGRESS" }
  - { id: ERR_CERTIFICATE_NOT_DRAFT, http: 409, condition: "certify requires DRAFT; void requires DRAFT or CERTIFIED" }
  - { id: ERR_REQUISITION_INVALID_STATE, http: 409, condition: "place requires OPEN; receive requires PLACED" }
  - { id: ERR_SAMPLE_NOT_ON_LOAN, http: 409, condition: "return/sell/write-off require ON_LOAN" }
  - { id: ERR_SHIPMENT_INVALID_STATE, http: 409, condition: "rate requires DRAFT; tender requires RATED; pickup requires TENDERED; delivery requires PICKED_UP" }
  # --- business_safety ---
  - { id: ERR_COMPLIANCE_NOT_CERTIFIED, http: 409, condition: "pass-quality requires a CERTIFIED compliance certificate for the order (DRAFT or absent is not enough)" }
  - { id: ERR_CELL_CERTIFICATION_MISSING, http: 422, condition: "Booking a COM line on a cell lacking COM_HANDLING certification" }
  - { id: ERR_CELL_DOWN, http: 422, condition: "Booking on a cell with status DOWN" }
  - { id: ERR_FLAMMABILITY_STANDARD_MISMATCH, http: 422, condition: "Line's model standard differs from the order's common standard, or certificate standard ≠ order common standard" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Certificate certifier's X-User-ID equals inspected_by of a lot allocated (now or previously) to any line of the order" }
  # --- business_constraint ---
  - { id: ERR_OPTION_COMBO_RESTRICTED, http: 422, condition: "No allowed option-matrix row matches (fabric grade × finish code); exact finish row beats the ANY wildcard row" }
  - { id: ERR_CELL_TYPE_MISMATCH, http: 422, condition: "operation vs cell_type mismatch (CUT→CUTTING, SEW→SEWING, UPHOLSTER→UPHOLSTERY)" }
  - { id: ERR_CELL_OVERLAP, http: 409, condition: "Exclusive cell (capacity_slots == 1): new booking overlaps an active one (active == status BOOKED or IN_PROGRESS; COMPLETED/RELEASED do not block); half-open windows — adjacency (end == start) is allowed" }
  - { id: ERR_CELL_CAPACITY_EXCEEDED, http: 409, condition: "Cell with capacity_slots > 1: the new booking would make the count of overlapping active (BOOKED or IN_PROGRESS) bookings exceed capacity_slots; exactly at capacity is allowed" }
  - { id: ERR_COMPONENT_NOT_RECEIVED, http: 422, condition: "CUT booking while a required_component_code of the line's model has no RECEIVED requisition for the line" }
  - { id: ERR_UNIT_SERIAL_UNAVAILABLE, http: 409, condition: "Sample create for a unit_serial with another ON_LOAN sample" }
  - { id: ERR_SAMPLE_IN_REFURB, http: 409, condition: "Sample create for a unit_serial whose last RETURNED sample's returned_at + 5 days is still in the future (allowed exactly at the boundary)" }
  - { id: ERR_CERTIFICATE_EXISTS, http: 409, condition: "An active (DRAFT or CERTIFIED) certificate already exists for the order" }
  - { id: ERR_SHIPMENT_EXISTS, http: 409, condition: "A shipment already exists for the order" }
  - { id: ERR_LOT_BINDING_INVALID, http: 422, condition: "COM lot (spec origin CUSTOMER) created without order_line_id, or plant lot created with one" }
  - { id: ERR_ORDER_HAS_NO_LINES, http: 422, condition: "Confirm with zero lines" }
  - { id: ERR_LABEL_COUNT_MISMATCH, http: 422, condition: "certify with label_count ≠ Σ quantity of the order's lines" }
  - { id: ERR_OVER_RECEIPT, http: 422, condition: "received_yards ≤ 0 or > expected_yards × 1.10" }
  - { id: ERR_INSPECTION_YARDAGE_MISMATCH, http: 422, condition: "usable_yards + rejected_yards ≠ received_yards (3-decimal compare), or usable_yards ≤ 0 on PASS" }
  # --- business_temporal ---
  - { id: ERR_COMPONENT_NOT_YET_AVAILABLE, http: 422, condition: "Requisition receive before available_date on the logical clock" }
  # --- business_fiscal ---
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Confirm with total_cents > dealer.credit_limit_cents" }
  - { id: ERR_INSUFFICIENT_YARDAGE, http: 422, condition: "Allocation create with yards > lot.available_yards, or split with yards_to_move > available" }
  - { id: ERR_SAMPLE_ALLOWANCE_EXCEEDED, http: 422, condition: "Sample create with outstanding + value > sample_allowance_cents (exactly at the allowance is allowed)" }
  - { id: ERR_INSUFFICIENT_ALLOCATION, http: 422, condition: "Cut-plan approve with allocated_yards < computed required_yards_final" }
  # --- white glove ---
  - { id: ERR_WHITE_GLOVE_CHECK_REQUIRED, http: 422, condition: "record-pickup on a WHITE_GLOVE shipment without condition_check_passed == true" }
  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_line_version does not match the line's current version on cut-plan create" }

# =============================================================================
# §1.7 RBAC Matrix (all roles opaque: X-User-ID is an operator id, not an entity id)
# =============================================================================
roles:
  - name: SalesRep
    description: "Owns dealer accounts, customer orders, order lines, and the showroom sample program"
    identity: opaque
    exclusive_operations:
      - "POST /mill/dealer-accounts, POST /mill/dealer-accounts/{id}/set-status"
      - "POST /mill/customer-orders, POST /mill/customer-orders/{id}/confirm, POST /mill/customer-orders/{id}/cancel"
      - "POST /mill/order-lines"
      - "POST /mill/showroom-samples, POST /mill/showroom-samples/{id}/return, /sell, /write-off"
    shared_operations: ["GET endpoints (all roles)"]
  - name: ProductionPlanner
    description: "Owns product models, fabric specs, cells, allocations, cut plans, bookings, and supply requisitions"
    identity: opaque
    exclusive_operations:
      - "POST /mill/product-models, POST /mill/product-models/{id}/discontinue"
      - "POST /mill/fabric-specs"
      - "POST /mill/cells, POST /mill/cells/{id}/set-status"
      - "POST /mill/material-allocations, POST /mill/material-allocations/{id}/release"
      - "POST /mill/order-lines/{lineId}/cut-plans, POST /mill/cut-plans/{id}/approve, /revise, /record-cut"
      - "POST /mill/cell-bookings, POST /mill/cell-bookings/{id}/start, /complete, /release"
      - "POST /mill/supply-requisitions, POST /mill/supply-requisitions/{id}/place, /receive"
    shared_operations: ["GET endpoints (all roles)"]
  - name: MaterialReceiver
    description: "Owns lot registration, receiving, splits, and customer returns"
    identity: opaque
    exclusive_operations:
      - "POST /mill/material-lots, POST /mill/material-lots/{id}/receive"
      - "POST /mill/material-lots/{id}/split, POST /mill/material-lots/{id}/return-to-customer"
    shared_operations: ["GET endpoints (all roles)"]
  - name: QualityInspector
    description: "Inspects lots, recalls lots, and passes/fails order quality"
    identity: opaque
    exclusive_operations:
      - "POST /mill/material-lots/{id}/inspect, POST /mill/material-lots/{id}/reject-lot"
      - "POST /mill/customer-orders/{id}/pass-quality, POST /mill/customer-orders/{id}/fail-quality"
    shared_operations: ["GET endpoints (all roles)"]
  - name: ComplianceOfficer
    description: "Creates, certifies, and voids flammability compliance certificates"
    identity: opaque
    exclusive_operations:
      - "POST /mill/compliance-certificates, POST /mill/compliance-certificates/{id}/certify, /void"
    shared_operations: ["GET endpoints (all roles)"]
  - name: ShippingCoordinator
    description: "Owns shipments from rating through delivery"
    identity: opaque
    exclusive_operations:
      - "POST /mill/shipments, POST /mill/shipments/{id}/rate, /tender, /record-pickup, /record-delivery"
    shared_operations: ["GET endpoints (all roles)"]
  - name: PlantAdmin
    description: "Platform operator; owns the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /mill/_clock/set_current_utc"
    shared_operations: ["GET endpoints (all roles)"]
