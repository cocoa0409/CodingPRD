  # ===========================================================================
  - section: state_machines
    instances:

      - name: round_opening_moves_draft_to_open_and_increments_version
        claim_type: Valid Transition
        grounds:
          - state_machines.FundingRound.DRAFT_to_OPEN
          - endpoints[POST /funding-rounds/{id}/opening]
        distinguishing_aspect: "POST /funding-rounds/{id}/opening on a DRAFT round under an ACTIVE program with at least one ACTIVE source returns 200, sets status OPEN and increments version from 1 to 2 while leaving every other field untouched."
        test_recipe:
          setup:
            - "Program P1 is ACTIVE with three ACTIVE funding sources. Round R1 exists in DRAFT."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
          trigger:
            - *k_round1_open
          assert:
            - "the trigger returns HTTP 200"
            - "FundingRound.${round1_id}.status == OPEN"
            - "FundingRound.${round1_id}.version == 2"
            - "FundingRound.${round1_id}.pool_cents == 500000000 and round_label == 2026 Cycle A"
            - "FundingRound.${round1_id}.application_count == 0 and selected_count == 0"
            - "FundingRound.${round1_id}.ranked_at is null and score_basis is null"

      - name: application_filed_after_the_round_close_date_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.null_to_RECEIVED
          - validations[priority=18]
          - errors.ERR_ROUND_WINDOW_CLOSED
        distinguishing_aspect: "Round R1 closes 2026-09-30; at clock 2026-10-01 the round is still OPEN, yet POST /applications is refused 409 ERR_ROUND_WINDOW_CLOSED because the clock is outside [opens_on, closes_on] — the window test is separate from the round-status test."
        test_recipe:
          setup:
            - "Round R1 is OPEN with opens_on 2026-08-05 and closes_on 2026-09-30. Parcel PA1 is ELIGIBLE."
            - "The clock has been advanced to 2026-10-01, one day past closes_on."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_round1
            - *k_round1_open
            - *k_clk_1001
          trigger:
            - call: "POST /applications"
              payload: { funding_round_id: "${round1_id}", parcel_id: "${parcel_a_id}", landowner_id: "${lo_a_id}", requested_price_cents: 170000000 }
              as: Landowner
              as_user_id: "${lo_a_id}"
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_ROUND_WINDOW_CLOSED"
            - "FundingRound.${round1_id}.status == OPEN"
            - "FundingRound.${round1_id}.application_count == 0"
            - "Parcel.${parcel_a_id}.status == ELIGIBLE"
            - "GET /applications?funding_round_id=${round1_id} returns total_count == 0"

      - name: offer_issuance_appends_a_round_and_rewrites_every_derived_cost_field
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Application.RANKED_to_OFFER_ISSUED.side_effects
          - calculations.bargain_sale_and_admin_fee
          - endpoints[POST /applications/{id}/offers]
        distinguishing_aspect: "One offer call executes all six declared side effects at once: an OFFER NegotiationRound at round_index 1, negotiation_round_count 1, the structure/donation/expiry stamps, offer_issued_by_user_id, the full bargain-sale rewrite (donation 17,555,000; bargain-sale price 157,995,000; fee 2,369,925; total 160,364,925) and three null installment fields because structure != INSTALLMENT."
        test_recipe:
          setup:
            - "Application AP1 is RANKED with certified_easement_value_cents 175,550,000 and negotiation_round_count 0. Clock 2026-10-05."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - *k_clk_1005
            - *k_get_app_a_v1
          trigger:
            - *k_offer_a
          assert:
            - "the trigger returns HTTP 200"
            - "Application.${app_a_id}.status == OFFER_ISSUED"
            - "Application.${app_a_id}.negotiation_round_count == 1"
            - "GET /applications/${app_a_id}/negotiation-rounds returns total_count == 1 with kind == OFFER, round_index == 1, amount_cents == 175550000"
            - "Application.${app_a_id}.structure == BARGAIN_SALE and donation_pct == 0.10"
            - "Application.${app_a_id}.current_offer_cents == 175550000 and current_offer_expires_on == 2026-11-19T00:00:00Z"
            - "Application.${app_a_id}.proposed_price_cents == 175550000"
            - "Application.${app_a_id}.offer_issued_by_user_id == officer-1"
            - "Application.${app_a_id}.donation_cents == 17555000"
            - "Application.${app_a_id}.bargain_sale_price_cents == 157995000"
            - "Application.${app_a_id}.admin_fee_cents == 2369925"
            - "Application.${app_a_id}.total_program_cost_cents == 160364925"
            - "Application.${app_a_id}.first_installment_cents is null and final_installment_cents is null and installment_interest_total_cents is null"
            - "Application.${app_a_id}.funding_plan_status == UNFUNDED and closing_status == NOT_APPLICABLE"

      - name: counter_on_a_ranked_application_and_review_of_an_assigned_appraisal_are_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application.transitions
          - state_machines.Appraisal.transitions
          - validations[priority=12]
          - errors.ERR_INVALID_APPLICATION_STATE
          - errors.ERR_INVALID_APPRAISAL_STATE
        distinguishing_aspect: "COUNTER is declared only from OFFER_ISSUED and appraisal review only from SUBMITTED; firing each from the wrong source state yields the per-entity state error — ERR_INVALID_APPLICATION_STATE for the RANKED application and ERR_INVALID_APPRAISAL_STATE for the ASSIGNED appraisal — and neither row moves."
        test_recipe:
          setup:
            - "Application AP1 is RANKED at clock 2026-10-01. A second Appraisal AR2 on the same application sits in ASSIGNED with a non-conflicting engagement window."
          setup_api_calls:
            - *k_prog1
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_lo_a
            - *k_clk_0810
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
            - *k_clk_0820
            - *k_appr_submit_a
            - *k_appr_certify_a
            - *k_clk_1001
            - *k_rank_r1
            - call: "POST /applications/${app_a_id}/appraisals"
              payload: { appraiser_user_id: "appraiser-2", appraiser_firm: "Conestoga Valuation", engagement_start: "2026-09-10T00:00:00Z", engagement_end: "2026-09-20T00:00:00Z", method: "INCOME_CAPITALIZATION" }
              as: AcquisitionOfficer
              as_user_id: "officer-1"
              captures: { appr_a2_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_a_id}/counters"
              payload: { counter_cents: 100000000, rationale: "counter before any offer" }
              as: Landowner
              as_user_id: "${lo_a_id}"
            - call: "POST /appraisals/${appr_a2_id}/review"
              payload: { decision: "CERTIFY" }
              as: AppraisalReviewer
              as_user_id: "reviewer-1"
          assert:
            - "the first trigger call returns HTTP 409 with error_id ERR_INVALID_APPLICATION_STATE"
            - "the second trigger call returns HTTP 409 with error_id ERR_INVALID_APPRAISAL_STATE"
            - "Application.${app_a_id}.status == RANKED"
            - "Application.${app_a_id}.last_counter_cents is null and negotiation_round_count == 0"
            - "GET /applications/${app_a_id}/negotiation-rounds returns total_count == 0"
            - "Appraisal.${appr_a2_id}.status == ASSIGNED"
            - "Appraisal.${appr_a2_id}.certified_by_user_id is null"
            - "Application.${app_a_id}.certified_easement_value_cents == 175550000, unchanged by the failed review"

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds:
          - state_machines.FundingRound.initial_state
          - state_machines.Application.initial_state
          - state_machines.Appraisal.initial_state
          - state_machines.FundingSource.initial_state
        distinguishing_aspect: "Every §1.2 initial_state is honoured at creation, including the Application's three parallel dimensions at once: FundingRound DRAFT, FundingSource ACTIVE, Parcel ELIGIBLE, Application status RECEIVED plus closing_status NOT_APPLICABLE plus funding_plan_status UNFUNDED, and Appraisal ASSIGNED with basis CERTIFIED_APPRAISAL_BASIS and submission_count 0."
        test_recipe:
          setup:
            - "Program P1 exists with one Landowner and the clock at 2026-08-10."
          setup_api_calls:
            - *k_prog1
            - *k_lo_a
            - *k_clk_0810
          trigger:
            - *k_src_local
            - *k_src_state
            - *k_src_fed
            - *k_round1
            - *k_round1_open
            - *k_parcel_a
            - *k_app_a
            - *k_appraisal_a
          assert:
            - "FundingSource.${src_local_id}.status == ACTIVE with committed_cents == 0, reserved_cents == 0, disbursed_cents == 0 and available_cents == 60000000"
            - "FundingRound.${round1_id}.status was DRAFT immediately after POST /funding-rounds and OPEN only after the opening call"
            - "Parcel.${parcel_a_id}.status == ELIGIBLE"
            - "Application.${app_a_id}.status == RECEIVED"
            - "Application.${app_a_id}.closing_status == NOT_APPLICABLE"
            - "Application.${app_a_id}.funding_plan_status == UNFUNDED"
            - "Application.${app_a_id}.composite_score is null and rank_position is null and agreed_price_cents is null"
            - "Appraisal.${appr_a_id}.status == ASSIGNED"
