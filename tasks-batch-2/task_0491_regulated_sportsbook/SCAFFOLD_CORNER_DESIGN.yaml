        distinguishing_aspect: "Bettor A (X-User-ID = acctA) deposits to account B → ERR_FORBIDDEN (403); Bettor identity is entity_backed:Account so X-User-ID must equal the path account id."
        test_recipe:
          setup: ["Two verified accounts A and B."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "own_a@x.com", full_name: "Own A", date_of_birth: "1980-01-01", residence_state: "NJ" }
