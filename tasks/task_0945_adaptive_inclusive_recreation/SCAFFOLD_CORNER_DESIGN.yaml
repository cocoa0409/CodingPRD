  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: request_shape_rungs_reject_bad_pagination_and_bad_enum
        claim_type: Violation → Error
        grounds:
          - validations[priority=23]
          - validations[priority=24]
          - errors[ERR_INVALID_ENUM]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "limit 500 on a list endpoint returns 400 ERR_INVALID_PAGINATION (bounds 1..100), and an undeclared enum member for risk_tier returns 400 ERR_INVALID_ENUM rather than the generic ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /recreation/participants"
              payload: { legal_name: "Ada Rivera", date_of_birth: "2010-03-04", household_id: "HH-1", household_size: 3, income_band: "BAND_C", weight_kg: 40, mobility_profile: "AMBULATORY", guardianship_status: "GUARDIAN_REQUIRED" }
              as: IntakeCoordinator
              captures: { p1: "$.data.id" }
          trigger:
            - call: "GET /recreation/participants"
              payload: { limit: 500, offset: 0 }
              as: ProgramAdmin
              captures: { err_page: "$.data.error_id" }
            - call: "POST /recreation/activity-programs"
              payload: { name: "Bad Program", activity_type: "AQUATICS", risk_tier: "EXTREME", pricing_mode: "PER_SESSION", rounding_policy: "ROUND_ON_TOTAL", waitlist_policy: "FIFO", fee_multiplier_bp: 10000, scheduled_session_count: 1 }
              as: ProgramAdmin
              captures: { err_enum: "$.data.error_id" }
          assert:
            - "The list call returns HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "The program create returns HTTP 400 with data.error_id == ERR_INVALID_ENUM"
            - "No ActivityProgram row is created"

      - name: enrollment_create_rungs_reject_duplicate_inactive_and_late_requests
        claim_type: Priority Ordering
        grounds:
          - validations[priority=29]
          - validations[priority=31]
          - validations[priority=33]
          - errors[ERR_DUPLICATE_ENROLLMENT]
          - errors[ERR_PARTICIPANT_NOT_ACTIVE]
          - errors[ERR_ENROLLMENT_CUTOFF_PASSED]
        distinguishing_aspect: "Three distinct POST /recreation/enrollments rejections on one fixture: a second enrollment for the same participant and session is ERR_DUPLICATE_ENROLLMENT (409), an INACTIVE participant is ERR_PARTICIPANT_NOT_ACTIVE (409), and a request inside the 24-hour cutoff is ERR_ENROLLMENT_CUTOFF_PASSED (422)."
        test_recipe:
          setup:
            - "One OPEN session starting 2026-06-10T14:00Z with slot_capacity 4."
            - "Two ACTIVE INDEPENDENT participants; P1 already holds a REQUESTED enrollment."
          setup_api_calls:
            - call: "POST /recreation/fee-scale-bands"
              payload: { household_size_min: 1, household_size_max: 6, income_band: "BAND_C", per_session_cents: 4000, series_cents: 24000 }
