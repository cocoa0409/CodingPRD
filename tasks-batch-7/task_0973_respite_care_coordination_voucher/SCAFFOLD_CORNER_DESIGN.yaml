# =============================================================================
# Task 0973: Respite-Care Coordination & Voucher — §1.9 Corner Design
# Breadth coverage of every testable claim in §1.1–§1.7 not already covered by
# §1.8. Same replay rules: every setup_api_calls / trigger chain drives empty-DB
# -> precondition using only §1.5 endpoints. Clock default 2026-05-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: caregiver_create_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Caregiver.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field email from caregiver creation is rejected with ERR_INVALID_REQUEST (400); no caregiver row is created."
        test_recipe:
          setup: ["Program exists (schema validation runs before any state check)"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: caregiver_duplicate_email_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Second caregiver with an already-registered email is rejected with ERR_DUPLICATE_EMAIL (409) — uniqueness is enforced across caregivers."
        test_recipe:
          setup: ["Caregiver ann@x.com already enrolled"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
          trigger:
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Other", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "als" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_EMAIL"
            - "HTTP status == 409"

      - name: program_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROGRAM_NOT_FOUND]"]
        distinguishing_aspect: "Reading a program with a well-formed but non-existent UUID returns ERR_PROGRAM_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database; clock at default"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: FunderAdmin }
          trigger:
            - { call: "GET /respite/programs/00000000-0000-4000-8000-000000000000", as: FunderAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROGRAM_NOT_FOUND"
            - "HTTP status == 404"

      - name: caregiver_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Caregiver.fields.status, entities.Caregiver.fields.full_name]
        distinguishing_aspect: "Client-supplied status/version in the create payload are ignored: the server returns status ENROLLED and version 1 regardless."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin }
          trigger:
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia", status: "ACTIVE", version: 99 }, as: Anonymous, captures: { cg_status: $.data.status, cg_version: $.data.version } }
          assert:
            - "Caregiver.status == ENROLLED"
            - "Caregiver.version == 1"

      - name: allocation_buckets_computed_on_approval
        claim_type: computed_fields
        grounds: [entities.Allocation.fields.granted_hours, state_machines.Caregiver.ENROLLED_to_ACTIVE]
        distinguishing_aspect: "Approval auto-creates the Q2 allocation with granted_hours 80.00 (= quarterly_cap_hours), available 80.00, all other buckets 0.00, period 2026-04-01..2026-07-01 from the fiscal anchor."
        test_recipe:
          setup: ["Program (quarterly_cap 80, fiscal anchor 2026-01-01); caregiver ENROLLED with SUBMITTED application; clock at default 2026-05-01 (Q2)"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc_granted: "$.data[0].granted_hours", alloc_avail: "$.data[0].available_hours", alloc_ps: "$.data[0].period_start", alloc_pe: "$.data[0].period_end", alloc_status: "$.data[0].status" } }
          assert:
            - "Allocation.granted_hours == 80.00"
            - "Allocation.available_hours == 80.00"
            - "Allocation.status == OPEN"
            - "Allocation.period_start == 2026-04-01T00:00:00Z"
            - "Allocation.period_end == 2026-07-01T00:00:00Z"

      - name: budget_ledger_entry_immutable_no_version
        claim_type: immutability
        grounds: [entities.BudgetLedgerEntry]
        distinguishing_aspect: "BudgetLedgerEntry carries common_fields: false — ledger rows expose id and created_at but no version or updated_at fields, and no update endpoint exists."
        test_recipe:
          setup: ["Program; ACTIVE caregiver with allocation; one 5.00h voucher issued (creates one ENCUMBER ledger entry of 15000 cents)"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 5 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
          trigger:
            - { call: "GET /respite/programs/${prog}/budget-ledger", as: FunderAdmin, captures: { le_type: "$.data[0].entry_type", le_amt: "$.data[0].amount_cents" } }
          assert:
            - "BudgetLedgerEntry[0].entry_type == ENCUMBER"
            - "BudgetLedgerEntry[0].amount_cents == 15000"
            - "BudgetLedgerEntry[0] exposes id and created_at and no version or updated_at field"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: voucher_revoke_from_redeemed_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Voucher.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Revoke is declared only from ISSUED/COMMITTED; a REDEEMED voucher rejects revocation with ERR_INVALID_STATE and no bucket changes."
        test_recipe:
          setup: ["Monday-evening 2h service fully verified — voucher REDEEMED with consumed 2.00 / released 18.00"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/providers", payload: { name: "Prov A", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-04T00:00:00Z", end_at: "2026-05-15T00:00:00Z", capacity: 2 }, as: Provider, as_user_id: "${prov}", captures: { win: $.data.id } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 20 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-04T19:00:00Z", end_at: "2026-05-04T21:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk: $.data.id } }
            - { call: "POST /respite/bookings/${bk}/confirm", as: Provider, as_user_id: "${prov}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T19:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/bookings/${bk}/check-in", payload: { check_in_location: "37.77,-122.41" }, as: Provider, as_user_id: "${prov}", captures: { vis: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T21:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/visit-records/${vis}/check-out", payload: {}, as: Provider, as_user_id: "${prov}" }
            - { call: "POST /respite/visit-records/${vis}/verification-decisions", payload: { decision: "VERIFY" }, as: Coordinator }
          trigger:
            - { call: "POST /respite/vouchers/${vch}/revoke", payload: { reason: "clawback attempt" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Voucher.${vch}.status == REDEEMED"

      - name: booking_confirm_after_cancel_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Booking.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED (terminal) booking rejects a later confirm with ERR_INVALID_STATE; voucher commitment stays released."
        test_recipe:
          setup: ["Booking created then cancelled by the caregiver (voucher back to ISSUED)"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/providers", payload: { name: "Prov A", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-06T08:00:00Z", end_at: "2026-05-06T20:00:00Z", capacity: 1 }, as: Provider, as_user_id: "${prov}", captures: { win: $.data.id } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 10 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-06T10:00:00Z", end_at: "2026-05-06T12:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk: $.data.id } }
            - { call: "POST /respite/bookings/${bk}/cancel", payload: { reason: "plans changed" }, as: Caregiver, as_user_id: "${cg}" }
          trigger:
            - { call: "POST /respite/bookings/${bk}/confirm", as: Provider, as_user_id: "${prov}", captures: { err: $.data.error_id } }
            - { call: "GET /respite/vouchers/${vch}", as: Coordinator, captures: { v_status: $.data.status, v_committed: $.data.committed_hours } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Booking.${bk}.status == CANCELLED"
            - "Voucher.${vch}.status == ISSUED"
            - "Voucher.${vch}.committed_hours == 0.00"

      - name: provider_terminated_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Provider.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "TERMINATED is terminal: activating a terminated provider is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Provider in APPLIED, then TERMINATED"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin }
            - { call: "POST /respite/providers", payload: { name: "Prov A", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "TERMINATED", reason: "fraud" }, as: Coordinator }
          trigger:
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Provider.${prov}.credential_status == TERMINATED"

      - name: no_show_ops_run_releases_commitment
        claim_type: valid_transition
        grounds: [state_machines.Booking.CONFIRMED_to_NO_SHOW, state_machines.Voucher.COMMITTED_to_ISSUED]
        distinguishing_aspect: "A CONFIRMED booking with no check-in by start + 30-minute grace flips to NO_SHOW at the next ops-run and the voucher returns to ISSUED with committed_hours 0.00."
        test_recipe:
          setup: ["Booking 2026-05-06 10:00-12:00 CONFIRMED; clock advanced to 2026-05-06T10:31:00Z (past the 30-minute grace); no check-in performed"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/providers", payload: { name: "Prov A", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-06T08:00:00Z", end_at: "2026-05-06T20:00:00Z", capacity: 1 }, as: Provider, as_user_id: "${prov}", captures: { win: $.data.id } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 10 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-06T10:00:00Z", end_at: "2026-05-06T12:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk: $.data.id } }
            - { call: "POST /respite/bookings/${bk}/confirm", as: Provider, as_user_id: "${prov}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T10:31:00Z" }, as: FunderAdmin }
          trigger:
            - { call: "POST /respite/programs/${prog}/ops-runs", payload: { run_type: "STANDARD" }, as: Coordinator, captures: { snap: $.data.id } }
            - { call: "GET /respite/bookings/${bk}", as: Coordinator, captures: { bk_status: $.data.status } }
            - { call: "GET /respite/vouchers/${vch}", as: Coordinator, captures: { v_status: $.data.status, v_committed: $.data.committed_hours } }
          assert:
            - "Booking.${bk}.status == NO_SHOW"
            - "Voucher.${vch}.status == ISSUED"
            - "Voucher.${vch}.committed_hours == 0.00"

      - name: emergency_dispatch_creates_confirmed_booking
        claim_type: side_effect_execution
        grounds: [state_machines.EmergencyRequest.TRIAGED_to_DISPATCHED]
        distinguishing_aspect: "Dispatch side effects: emergency voucher (is_emergency true, allocation_id null), booking created directly in CONFIRMED (no provider confirm step), reserve debited 4.00h, provisional encumbrance 24000 cents (4 x 3000 x 2.0)."
        test_recipe:
          setup: ["Caregiver ACTIVE; ENHANCED provider ACTIVE accepting emergency; emergency request 2026-05-06 08:00-12:00 TRIAGED with approved_hours 4"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "POST /respite/providers", payload: { name: "Prov Enh", credential_level: "ENHANCED", service_zip: "94110", accepts_emergency: true }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/emergency-requests", payload: { caregiver_id: "${cg}", needed_start_at: "2026-05-06T08:00:00Z", needed_end_at: "2026-05-06T12:00:00Z", reason: "hospitalization" }, as: Caregiver, as_user_id: "${cg}", captures: { emg: $.data.id } }
            - { call: "POST /respite/emergency-requests/${emg}/triage", payload: { approved_hours: 4 }, as: Coordinator }
          trigger:
            - { call: "POST /respite/emergency-requests/${emg}/dispatch", as: Coordinator, captures: { emg_status: $.data.status, emg_bk: $.data.dispatched_booking_id, emg_prov: $.data.selected_provider_id } }
            - { call: "GET /respite/bookings/${emg_bk}", as: Coordinator, captures: { bk_status: $.data.status, bk_emerg: $.data.is_emergency } }
            - { call: "GET /respite/bookings?emergency_request_id=${emg}", as: Coordinator, captures: { bk_vch: "$.data[0].voucher_id" } }
            - { call: "GET /respite/vouchers/${bk_vch}", as: Coordinator, captures: { v_emerg: $.data.is_emergency, v_status: $.data.status } }
            - { call: "GET /respite/programs/${prog}", as: FunderAdmin, captures: { p_emerg_used: $.data.emergency_hours_used, p_enc: $.data.encumbered_cents } }
          assert:
            - "EmergencyRequest.${emg}.status == DISPATCHED"
            - "EmergencyRequest.${emg}.selected_provider_id == ${prov}"
            - "Booking.${emg_bk}.status == CONFIRMED"
            - "Booking.${emg_bk}.is_emergency == true and Booking.${emg_bk}.window_id is null"
            - "Voucher ${bk_vch} has is_emergency == true and allocation_id is null and status == COMMITTED"
            - "Program.${prog}.emergency_hours_used == 4.00"
            - "Program.${prog}.encumbered_cents == 24000"

      - name: application_appeal_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.EligibilityApplication.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Appeal is declared only from DENIED; appealing a SUBMITTED application is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Caregiver ENROLLED with a SUBMITTED application"]
