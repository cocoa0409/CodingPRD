  - rule_id: boundary_precision_check
    instances:
      - name: workshop_seat_boundary_at_exact_capacity
        grounds:
          - calculations.workshop_seat_allocation
          - entities.WorkshopSession.fields.enrolled_count
        distinguishing_aspect: |
          Metric: seat count. The blocking condition is enrolled_count >= capacity, so the
          enrollment at count == capacity-1 (=1 of 2) lands ENROLLED while the one at
          count == capacity lands WAITLISTED with waitlist_position 1 — a >= boundary on the
          workshop-enrollment endpoint.
        test_recipe:
          setup:
            - "Session (capacity 2) SCHEDULED for 2026-08-20; three cases A/B/C ready to enroll"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room W", capacity: 40 }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Orientation W", capacity: 2, starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T11:00:00Z" }
              as: CaseManager
              as_user_id: "${mgr1_id}"
              captures: { sess_id: $.data.id }
