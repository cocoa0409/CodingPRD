        grounds: ["errors[ERR_UNIT_NOT_AVAILABLE]", state_machines.ComponentUnit]
        distinguishing_aspect: "A unit already inducted (custody IN_SHOP under another work order) cannot be inducted again: second create fails 409 ERR_UNIT_NOT_AVAILABLE."
