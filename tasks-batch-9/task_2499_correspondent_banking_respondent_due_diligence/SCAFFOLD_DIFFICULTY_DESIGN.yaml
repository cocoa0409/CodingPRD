            - { call: "POST /correspondent-banking/respondents/${j_id}/licensing-verification", payload: { license_status: "ACTIVE", regulator_standing: "GOOD_STANDING", regulator_name: "BaFin" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "POST /correspondent-banking/respondents/${j_id}/beneficial-owners", payload: { owner_name: "Elbe Kontor Holding", owner_type: "NATURAL_PERSON", ownership_pct: 100.00, country_of_residence: "DE", is_pep: false }, as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { j_own: $.data.id } }
            - { call: "POST /correspondent-banking/beneficial-owners/${j_own}/verification", payload: { action: "VERIFY" }, as: ComplianceAnalyst, as_user_id: "user-analyst-01" }
            - { call: "GET /correspondent-banking/respondents/${j_id}", as: ComplianceAnalyst, as_user_id: "user-analyst-01", captures: { jv0: $.data.version } }
            - { call: "POST /correspondent-banking/respondents/${j_id}/questionnaires", payload: { questionnaire_version: 1, expected_respondent_version: "${jv0}", declared_nested_activity: false, declared_downstream_count: 0 }, as: RespondentContact, as_user_id: "${j_id}", captures: { jq: $.data.id } }
            - { call: "POST /correspondent-banking/questionnaires/${jq}/control-assessments", payload: { control_domain: "GOVERNANCE", self_rating: 3 }, as: RespondentContact, as_user_id: "${j_id}" }
            - { call: "POST /correspondent-banking/questionnaires/${jq}/control-assessments", payload: { control_domain: "KYC_ONBOARDING", self_rating: 3 }, as: RespondentContact, as_user_id: "${j_id}" }
