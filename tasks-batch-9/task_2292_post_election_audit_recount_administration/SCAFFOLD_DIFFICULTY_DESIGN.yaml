              payload: { audit_batch_id: "${ab3_id}", tally_team_id: "${t1_id}", session_start_at: "2026-11-05T09:00:00Z", session_end_at: "2026-11-05T11:00:00Z", counted_votes: { ALVAREZ: 520, BRENNAN: 480 }, ambiguous_ballot_count: 0, no_vote_count: 0 }
              as: TallyTeamLead
