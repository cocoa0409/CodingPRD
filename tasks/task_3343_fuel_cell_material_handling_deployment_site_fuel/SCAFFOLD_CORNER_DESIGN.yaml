            - call: "POST /api/sites/${site_id}/supply-contracts"
              payload: { supply_mode: "PIPELINE", start_date: "2026-10-01", end_date: "2026-12-31", base_price_per_kg: 2.5, reliability_sla_pct: 99.0, committed_monthly_kg: 10 }
              as: SiteManager
              captures: { c: $.data.id }
            - call: "POST /api/sites/${site_id}/supply-contracts/${c}/activate"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/stations"
              payload: { station_code: "ST-C4", location_type: "OUTDOOR", capacity_kg_per_day: 500, storage_capacity_kg: 1000, construction_start: "2026-10-01", construction_end: "2026-10-05" }
              as: SiteManager
              captures: { st: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "CONSTRUCTION", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pc: $.data.id }
            - call: "POST /api/stations/${st}/permits"
              payload: { permit_type: "FIRE", issued_date: "2026-10-01", expiry_date: "2027-01-01" }
              as: SiteManager
              captures: { pf: $.data.id }
            - call: "POST /api/stations/${st}/permits/${pc}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/permits/${pf}/issue"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/start-construction"
              payload: {}
              as: SiteManager
            - call: "POST /api/stations/${st}/commission"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /api/stations/${st}/fueling-events"
              payload: { forklift_id: "FL-C4", occurred_at: "2026-10-05T08:00:00Z", kg_dispensed: 20, supply_contract_id: "${c}" }
              as: SiteManager
              captures: { fe: $.data.id }
            - call: "POST /api/invoices"
              payload: { site_id: "${site_id}", supply_contract_id: "${c}", period_start: "2026-10-01", period_end: "2026-11-01" }
