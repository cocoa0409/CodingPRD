scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_divergence
        grounds:
          - calculations.provisional_quote
          - calculations.final_invoice
          - entities.WorkOrder.fields.provisional_quote_cents
          - entities.WorkOrder.fields.final_invoice_cents
        distinguishing_aspect: |
          WorkOrder-domain dual variant: identical order data yields provisional_quote_cents == 10175
          after prepare (planned_runs=1 at the 2000-cent unassigned rack fee, rework_count=0, no hazmat)
          but final_invoice_cents == 14100 at ship time — the 3925-cent delta is exactly the fixture fee
          uplift (2400 x 2 actual runs - 2000 unassigned = 2800) plus one rework surcharge (1125).
          This instance lives on the WorkOrder entity domain, distinct from the PlatingBath variant.
        test_recipe:
          setup:
            - "Customer C1 ACTIVE; RACK fixture F1 amortization 2400; SULFURIC ANODIZE bath B1 (600 Ah, target 5.0, band [4.0,6.0]) titrated to 4.900"
            - "Work order WO1: AL6061 ANODIZE RACK, 10 parts x 2.5 dm2, spec [12.0,18.0], masking 30 min, no salt spray; one full pass + one STAIN rework cycle + passing re-inspection, then shipped"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Acme Aerospace" }, as: ShopManager, captures: { c1: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /fixtures", payload: { fixture_code: "RACK-01", routing_mode: "RACK", capacity_dm2: 500, purchase_cost_cents: 120000, rated_uses: 50 }, as: ShopManager, captures: { f1: $.data.id } }
            - { call: "POST /baths", payload: { bath_code: "ANO-1", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["RACK", "BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b1: $.data.id } }
            - { call: "POST /baths/${b1}/titrations", payload: { titrant_volume_ml: 10.0, titrant_normality: 0.1, sample_volume_ml: 10.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c1}", part_number: "PN-100", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "RACK", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0, requires_masking: true }, as: Customer, as_user_id: "${c1}", captures: { wo1: $.data.id, quote_at_create: $.data.provisional_quote_cents } }
            - { call: "POST /work-orders/${wo1}/prepare", payload: { masking_minutes: 30 }, as: LineOperator, captures: { quote_after_prepare: $.data.provisional_quote_cents } }
            - { call: "POST /work-orders/${wo1}/route", payload: { bath_id: "${b1}", fixture_id: "${f1}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${b1}", as: LabChemist, captures: { b_v1: $.data.version } }
            - { call: "POST /work-orders/${wo1}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b_v1}" }, as: LineOperator, captures: { lr1: $.data.id } }
            - { call: "POST /load-runs/${lr1}/complete", as: LineOperator }
            - { call: "POST /work-orders/${wo1}/inspections", payload: { thickness_readings_um: [12.5, 13.0, 14.0], defect_type: "STAIN" }, as: QCInspector }
            - { call: "POST /work-orders/${wo1}/start-strip", payload: { strip_method: "CHEMICAL" }, as: LineOperator }
            - { call: "POST /work-orders/${wo1}/complete-strip", as: LineOperator }
            - { call: "POST /work-orders/${wo1}/route", payload: { bath_id: "${b1}", fixture_id: "${f1}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${b1}", as: LabChemist, captures: { b_v2: $.data.version } }
            - { call: "POST /work-orders/${wo1}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b_v2}" }, as: LineOperator, captures: { lr2: $.data.id } }
            - { call: "POST /load-runs/${lr2}/complete", as: LineOperator }
            - { call: "POST /work-orders/${wo1}/inspections", payload: { thickness_readings_um: [12.5, 13.0, 14.0], defect_type: "NONE" }, as: QCInspector }
          trigger:
            - { call: "POST /work-orders/${wo1}/ship", as: LineOperator, captures: { final_inv: $.data.final_invoice_cents } }
          assert:
            - "WorkOrder.${wo1}.provisional_quote_cents captured at prepare (${quote_after_prepare}) == 10175"
            - "WorkOrder.${wo1}.provisional_quote_cents captured at create (${quote_at_create}) == 7625 (masking not yet recorded)"
            - "WorkOrder.${wo1}.final_invoice_cents == 14100 after ship"
            - "Delta 14100 - 10175 == 3925 == fixture uplift (2400 x 2 runs - 2000 unassigned) 2800 + rework surcharge 1125"

      - name: bath_life_nameplate_vs_chemistry_adjusted
        grounds:
          - calculations.bath_life_projection
          - entities.PlatingBath.fields.nameplate_remaining_ah
          - entities.PlatingBath.fields.effective_remaining_ah
        distinguishing_aspect: |
          PlatingBath-domain dual variant: at concentration 4.9 vs target 5.0 and 0 Ah used of 600,
          nameplate_remaining_ah == 600.0 (optimistic) while effective_remaining_ah == 588 (pessimistic,
          floor(600 x 0.98)); routing a load estimated at 590 Ah is rejected by the pessimistic variant
          even though the optimistic variant (600 >= 590) would have allowed it. Distinct entity domain
          from the WorkOrder invoice variant instance.
        test_recipe:
          setup:
            - "Customer C2 ACTIVE; compatibility rule AL7075/ANODIZE/SULFURIC COMPATIBLE"
            - "Bath B2 SULFURIC ANODIZE, 600 Ah capacity, target 5.0, band [4.0, 6.0], titrated to exactly 4.900 (efficiency 0.98)"
            - "Work order WO2 prepared, surface 25 dm2, planned load estimate 590.0 Ah (944 min x 1.5 A/dm2)"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Beta Defense" }, as: ShopManager, captures: { c2: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL7075", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-2", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b2: $.data.id } }
            - { call: "POST /baths/${b2}/titrations", payload: { titrant_volume_ml: 10.0, titrant_normality: 0.1, sample_volume_ml: 10.0 }, as: LabChemist, captures: { t_conc: $.data.measured_concentration_g_l } }
            - { call: "POST /work-orders", payload: { customer_id: "${c2}", part_number: "PN-200", alloy_code: "AL7075", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c2}", captures: { wo2: $.data.id } }
            - { call: "POST /work-orders/${wo2}/prepare", payload: {}, as: LineOperator }
            - { call: "GET /baths/${b2}", as: LabChemist, captures: { b2_nameplate: $.data.nameplate_remaining_ah, b2_effective: $.data.effective_remaining_ah } }
          trigger:
            - { call: "POST /work-orders/${wo2}/route", payload: { bath_id: "${b2}", planned_duration_minutes: 944, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { err: $.data.error_id } }
          assert:
            - "titration measured_concentration_g_l == 4.9"
            - "bath B2 nameplate_remaining_ah == 600.0 (optimistic variant)"
            - "bath B2 effective_remaining_ah == 588 (pessimistic variant, floor(600 x 0.98))"
            - "route rejected: error_id == ERR_BATH_LIFE_INSUFFICIENT (590.0 estimate > 588 effective) even though 590.0 <= 600.0 nameplate"

  # =========================================================================
  # Rule 2 — combinatorial_formula (modes a, b, c — three different modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pricing_multifactor_tier_surcharge_mode_a
        grounds:
          - calculations.provisional_quote
          - calculations.final_invoice
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — final price of a low-tier BARREL order
          (surface 25 dm2, billing thickness 5.0 -> tier rate 12, barrel flat fee x 2 completed runs,
          20% rework surcharge on processing) yields exactly 4200 cents; each factor (tier band, run
          count, rework count, routing mode) changes the result non-linearly.
        test_recipe:
          setup:
            - "Customer C3; rule AL6061/ANODIZE/SULFURIC COMPATIBLE; bath B3 titrated to 4.9 (600 Ah)"
            - "WO3: BARREL, 10 parts x 2.5 dm2, spec [4.0, 6.0] (billing thickness 5.0 -> tier 12), no masking, no salt spray; first pass STAIN-rejected, stripped, replated, passed, shipped"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Gamma Wheels" }, as: ShopManager, captures: { c3: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "ANO-3", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["RACK", "BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b3: $.data.id } }
            - { call: "POST /baths/${b3}/titrations", payload: { titrant_volume_ml: 10.0, titrant_normality: 0.1, sample_volume_ml: 10.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c3}", part_number: "PN-300", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 4.0, thickness_spec_max_um: 6.0 }, as: Customer, as_user_id: "${c3}", captures: { wo3: $.data.id } }
            - { call: "POST /work-orders/${wo3}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wo3}/route", payload: { bath_id: "${b3}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${b3}", as: LabChemist, captures: { b3_v1: $.data.version } }
            - { call: "POST /work-orders/${wo3}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b3_v1}" }, as: LineOperator, captures: { lr3a: $.data.id } }
            - { call: "POST /load-runs/${lr3a}/complete", as: LineOperator }
            - { call: "POST /work-orders/${wo3}/inspections", payload: { thickness_readings_um: [4.5, 5.0, 5.5], defect_type: "STAIN" }, as: QCInspector }
            - { call: "POST /work-orders/${wo3}/start-strip", payload: { strip_method: "ELECTROLYTIC" }, as: LineOperator }
            - { call: "POST /work-orders/${wo3}/complete-strip", as: LineOperator }
            - { call: "POST /work-orders/${wo3}/route", payload: { bath_id: "${b3}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${b3}", as: LabChemist, captures: { b3_v2: $.data.version } }
            - { call: "POST /work-orders/${wo3}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b3_v2}" }, as: LineOperator, captures: { lr3b: $.data.id } }
            - { call: "POST /load-runs/${lr3b}/complete", as: LineOperator }
            - { call: "POST /work-orders/${wo3}/inspections", payload: { thickness_readings_um: [4.5, 5.0, 5.5], defect_type: "NONE" }, as: QCInspector }
          trigger:
            - { call: "POST /work-orders/${wo3}/ship", as: LineOperator, captures: { final3: $.data.final_invoice_cents } }
          assert:
            - "WorkOrder.${wo3}.final_invoice_cents == 4200 (masking 0 + barrel 1200 x 2 runs + processing round(25 x 5.0 x 12) = 1500 + surcharge round(1500 x 0.20) x 1 = 300; subtotal 4200, no discount, no hazmat)"

      - name: waste_mass_per_sample_rounding_mode_b
        grounds:
          - calculations.waste_mass_accounting
          - entities.WasteSample.fields.masses_g
          - entities.DischargePermit.fields.cumulative_mass_g
        distinguishing_aspect: |
          Mode (b): nested rounding order — two samples of NICKEL at 0.0005 mg/L x 1000 L each round
          to 0.001 g per sample BEFORE summing, giving cumulative_mass_g.NICKEL == 0.002; the forbidden
          sum-then-round order would give 0.001. Different mode from the pricing instances.
        test_recipe:
          setup:
            - "Permit P1 on OUTFALL-9, window [2026-08-01, 2026-08-31], limit NICKEL 2.0 mg/L / 500.0 g monthly cap; logical clock at default 2026-08-01T00:00:00Z (inside window, month 2026-08)"
          setup_api_calls:
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-9", effective_from: "2026-08-01", effective_to: "2026-08-31", limits: [{ analyte_code: "NICKEL", max_concentration_mg_l: 2.0, monthly_mass_cap_g: 500.0 }] }, as: EHSOfficer, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /discharge-permits/${p1}/samples", payload: { flow_liters: 1000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 0.0005 }] }, as: EHSOfficer, captures: { s1_mass: $.data.masses_g, s1_exc: $.data.is_exceedance } }
            - { call: "POST /discharge-permits/${p1}/samples", payload: { flow_liters: 1000, readings: [{ analyte_code: "NICKEL", concentration_mg_l: 0.0005 }] }, as: EHSOfficer }
            - { call: "GET /discharge-permits/${p1}", as: EHSOfficer, captures: { cum_ni: $.data.cumulative_mass_g } }
          assert:
            - "sample 1 masses_g.NICKEL == 0.001 (raw 0.0005 rounded half-up per-sample)"
            - "sample 1 is_exceedance == false"
            - "permit cumulative_mass_g.NICKEL == 0.002 after two samples (per-sample-round-then-sum); sum-then-round would yield 0.001"
            - "permit status remains ACTIVE and current_month == '2026-08'"

      - name: invoice_discount_tier_prediscount_subtotal_mode_c
        grounds:
          - calculations.provisional_quote
          - calculations.final_invoice
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — discount tier keys on the
          PRE-discount subtotal (571200 >= 500000 -> 5%) and the hazmat fee is added AFTER discounting;
          evaluating in the reverse order (tier on post-discount 542640 -> 0%, or hazmat inside the
          subtotal) yields different totals. Final invoice 545140; provisional (no routed family) 542640.
        test_recipe:
          setup:
            - "Customer C4; rule C360/PLATE/CYANIDE COMPATIBLE; CYANIDE PLATE bath B4 (1000 Ah, vol 1000 L, target 5.0, band [4.0, 6.0]) titrated to 4.9"
            - "WO4: BARREL, 1000 parts x 1.0 dm2 = 1000 dm2, spec [28.0, 32.0] (billing 30.0 -> tier 19), no masking/salt-spray; one clean pass then ship"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Delta Brassworks" }, as: ShopManager, captures: { c4: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "C360", process_type: "PLATE", chemistry_family: "CYANIDE", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /baths", payload: { bath_code: "PLT-4", process_type: "PLATE", chemistry_family: "CYANIDE", routing_modes_supported: ["BARREL"], volume_liters: 1000, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 1000 }, as: ShopManager, captures: { b4: $.data.id } }
            - { call: "POST /baths/${b4}/titrations", payload: { titrant_volume_ml: 10.0, titrant_normality: 0.1, sample_volume_ml: 10.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c4}", part_number: "PN-400", alloy_code: "C360", process_type: "PLATE", routing_mode: "BARREL", part_count: 1000, surface_area_dm2_per_part: 1.0, thickness_spec_min_um: 28.0, thickness_spec_max_um: 32.0 }, as: Customer, as_user_id: "${c4}", captures: { wo4: $.data.id, quote4: $.data.provisional_quote_cents } }
            - { call: "POST /work-orders/${wo4}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wo4}/route", payload: { bath_id: "${b4}", planned_duration_minutes: 10, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${b4}", as: LabChemist, captures: { b4_v: $.data.version } }
            - { call: "POST /work-orders/${wo4}/load-runs", payload: { duration_minutes: 10, current_density_a_dm2: 1.5, expected_bath_version: "${b4_v}" }, as: LineOperator, captures: { lr4: $.data.id } }
            - { call: "POST /load-runs/${lr4}/complete", as: LineOperator }
            - { call: "POST /work-orders/${wo4}/inspections", payload: { thickness_readings_um: [29.0, 30.0, 31.0], defect_type: "NONE" }, as: QCInspector }
          trigger:
            - { call: "POST /work-orders/${wo4}/ship", as: LineOperator, captures: { final4: $.data.final_invoice_cents } }
          assert:
            - "provisional quote at create == 542640 (subtotal 571200 = barrel 1200 + processing 570000; 5% discount 28560 keyed on PRE-discount subtotal; hazmat 0 before routing)"
            - "WorkOrder.${wo4}.final_invoice_cents == 545140 (571200 - 28560 + 2500 hazmat for CYANIDE, fee added after discount)"
            - "final - provisional == 2500 (exactly the hazmat fee; proves discount base identical and order pinned)"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: workorder_strip_replate_cycle
        grounds:
          - state_machines.WorkOrder.REJECTED_to_STRIPPING
          - state_machines.WorkOrder.STRIPPING_to_READY_FOR_ROUTING
          - state_machines.WorkOrder.AWAITING_INSPECTION_to_REJECTED
        distinguishing_aspect: |
          WorkOrder machine is cyclic: READY_FOR_ROUTING -> ROUTED -> IN_PROCESS -> AWAITING_INSPECTION
          -> REJECTED -> STRIPPING -> READY_FOR_ROUTING closes a rework loop, with rework_count
          incrementing per lap and predip_completed reset each lap. Distinct entity from the bath cycle.
        test_recipe:
          setup:
            - "Customer C5; rule AL6061/ANODIZE/SULFURIC COMPATIBLE; fixture F5 (amort 1500); bath B5 titrated to 5.000, capacity 600"
            - "WO5 RACK 25 dm2 spec [12,18], no masking; first pass STAIN reject"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Epsilon Fasteners" }, as: ShopManager, captures: { c5: $.data.id } }
            - { call: "POST /alloy-compatibility-rules", payload: { alloy_code: "AL6061", process_type: "ANODIZE", chemistry_family: "SULFURIC", compatibility: "COMPATIBLE" }, as: LabChemist }
            - { call: "POST /fixtures", payload: { fixture_code: "RACK-05", routing_mode: "RACK", capacity_dm2: 500, purchase_cost_cents: 60000, rated_uses: 40 }, as: ShopManager, captures: { f5: $.data.id } }
            - { call: "POST /baths", payload: { bath_code: "ANO-5", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["RACK"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { b5: $.data.id } }
            - { call: "POST /baths/${b5}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist }
            - { call: "POST /work-orders", payload: { customer_id: "${c5}", part_number: "PN-500", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "RACK", part_count: 10, surface_area_dm2_per_part: 2.5, thickness_spec_min_um: 12.0, thickness_spec_max_um: 18.0 }, as: Customer, as_user_id: "${c5}", captures: { wo5: $.data.id } }
            - { call: "POST /work-orders/${wo5}/prepare", payload: {}, as: LineOperator }
            - { call: "POST /work-orders/${wo5}/route", payload: { bath_id: "${b5}", fixture_id: "${f5}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { st_route1: $.data.status } }
            - { call: "GET /baths/${b5}", as: LabChemist, captures: { b5_v1: $.data.version } }
            - { call: "POST /work-orders/${wo5}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b5_v1}" }, as: LineOperator, captures: { lr5: $.data.id } }
            - { call: "POST /load-runs/${lr5}/complete", as: LineOperator }
            - { call: "POST /work-orders/${wo5}/inspections", payload: { thickness_readings_um: [13.0, 14.0, 15.0], defect_type: "STAIN" }, as: QCInspector, captures: { st_rej: $.data.disposition } }
          trigger:
            - { call: "POST /work-orders/${wo5}/start-strip", payload: { strip_method: "CHEMICAL" }, as: LineOperator, captures: { st_strip: $.data.status } }
            - { call: "POST /work-orders/${wo5}/complete-strip", as: LineOperator, captures: { st_ready: $.data.status, rc: $.data.rework_count, bath_link: $.data.bath_id, predip: $.data.predip_completed } }
            - { call: "POST /work-orders/${wo5}/route", payload: { bath_id: "${b5}", fixture_id: "${f5}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator, captures: { st_route2: $.data.status } }
          assert:
            - "disposition of STAIN rejection == REWORKABLE_REJECT"
            - "after start-strip status == STRIPPING"
            - "after complete-strip status == READY_FOR_ROUTING, rework_count == 1, bath_id == null, predip_completed == false"
            - "second route succeeds: status == ROUTED (loop closed: READY_FOR_ROUTING reached twice in one order's life)"

      - name: bath_exhaust_dump_renew_cycle
        grounds:
          - state_machines.PlatingBath.ACTIVE_to_EXHAUSTED
          - state_machines.PlatingBath.EXHAUSTED_to_DUMPED
          - state_machines.PlatingBath.DUMPED_to_ACTIVE
        distinguishing_aspect: |
          PlatingBath machine cycles ACTIVE -> EXHAUSTED -> DUMPED -> ACTIVE (life renewal), where dump
          writes a 960.0 kg BATH_DUMP line onto a DRAFT manifest and renew resets amp_hour_used to 0 and
          un-holds ROUTE_HELD work orders. Distinct entity from the WorkOrder rework cycle.
        test_recipe:
          setup:
            - "Customer C6; rule AL6063/ANODIZE/SULFURIC COMPATIBLE; bath B6 capacity 100 Ah titrated to 5.000"
            - "WO-W (waiting) routed to B6 with a 10 Ah planned estimate; WO-Y drives a single 100 Ah load to exhaustion"
            - "DRAFT manifest M6 created by EHS officer user 'ehs-1'"
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "Zeta Extrusions" }, as: ShopManager, captures: { c6: $.data.id } }
