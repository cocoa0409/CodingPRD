            - { call: "POST /buying-points/grade-sheets/${gs1}/finalize", payload: {}, as: GradingInspector, as_user_id: insp-1 }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
