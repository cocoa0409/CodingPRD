            - { call: "POST /bit/mandated-assessments/${a1}/record-outcome", payload: { outcome: NOT_CLEARED, findings_summary: "not cleared" }, as: CounselingEvaluator, as_user_id: "${ev}" }
            - { call: "GET /bit/leave-decisions", payload: { case_id: "${c1}" }, as: BITChair, as_user_id: "${chair}", captures: { ld1: "$.data[0].id" } }
            - { call: "POST /bit/leave-decisions/${ld1}/decide", payload: { decision: GRANT_LEAVE, rationale: "safety" }, as: DeanOfStudents, as_user_id: "${dean}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv2: $.data.version, c1_onleave: $.data.status } }
            - { call: "POST /bit/reentry-evaluations", payload: { case_id: "${c1}", expected_case_version: "${cv2}", petition_summary: "ready to return" }, as: CaseManager, as_user_id: "${cm}", captures: { ev1: $.data.id } }
          trigger:
            - { call: "POST /bit/reentry-evaluations/${ev1}/decide", payload: { outcome: DENIED, rationale: "insufficient treatment engagement" }, as: DeanOfStudents, as_user_id: "${dean2}", captures: { ev1_status: $.data.status } }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { c1_status: $.data.status } }
            - { call: "GET /bit/students/${s1}", as: BITChair, as_user_id: "${chair}", captures: { s1_enroll: $.data.enrollment_status } }
          assert:
            - "ReentryEvaluation.${ev1}.status == DENIED (decider ${dean2} differs from leave decider ${dean} — segregation satisfied)"
            - "CareCase.${c1}.status == ON_LEAVE (loop back, not terminal)"
            - "Student.${s1}.enrollment_status == LEAVE_OF_ABSENCE (unchanged)"

      - name: grant_revoke_from_requested_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.DisclosureGrant.APPROVED_to_REVOKED"
          - "errors[ERR_GRANT_NOT_APPROVED]"
        distinguishing_aspect: "revoke requires APPROVED; revoking a still-REQUESTED grant fails."
        test_recipe:
          setup: ["staff chair/cm/rep/po; student s1; case c1 INTAKE; grant g1 REQUESTED"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Privacy One", office: PRIVACY_OFFICE }, as: SystemAdmin, captures: { po: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0011", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
