# =============================================================================
# §1.9 Scaffold Corner Design — Card-Settlement Holdback Repayment Financing
# Breadth probe: every §1.1–§1.7 claim not already covered by §1.8.
# Fixture conventions shared with §1.8 (flat history 12 x 1,000,000 net;
# clock default 2026-09-01T00:00:00Z).
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: merchant_create_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["entities.Merchant.fields.legal_name", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /lending/merchants without legal_name is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /lending/merchants"
              payload: { state_code: "TX", owner_name: "No Name", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Captured err == ERR_INVALID_REQUEST"
            - "HTTP status 400"

      - name: merchant_create_computed_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Merchant.fields.lifetime_net_cents", "entities.Merchant.fields.seasonality_index"]
        distinguishing_aspect: "Client-supplied computed fields (lifetime_net_cents, seasonality_index) in the create body are ignored; the response carries system-computed zeros."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Override Co", state_code: "TX", owner_name: "Ov Err", processing_started_at: "2023-01-01T00:00:00Z", lifetime_net_cents: 99999999, seasonality_index: 9.9 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "GET /lending/merchants/${m_id}"
              as: PlatformAdmin
          assert:
            - "Merchant.${m_id}.lifetime_net_cents == 0 (input ignored)"
            - "Merchant.${m_id}.seasonality_index == 0"
            - "Merchant.${m_id}.status == ONBOARDING"

      - name: batch_create_defaults_applied
        claim_type: defaults
        grounds: ["entities.ProcessingDayBatch.fields.refunds_cents", "entities.ProcessingDayBatch.fields.chargebacks_cents", "entities.ProcessingDayBatch.fields.net_settled_cents"]
        distinguishing_aspect: "Omitting optional refunds_cents/chargebacks_cents defaults them to 0, so net_settled_cents equals gross_cents."
        test_recipe:
          setup: ["merchant exists"]
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Def Co", state_code: "TX", owner_name: "De Fault", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-09-01", gross_cents: 7500 }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
          assert:
            - "ProcessingDayBatch.${b_id}.refunds_cents == 0 and chargebacks_cents == 0"
            - "ProcessingDayBatch.${b_id}.net_settled_cents == 7500"

      - name: loan_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints[GET /lending/loans/{loanId}"]
        distinguishing_aspect: "GET with a well-formed but nonexistent loan id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /lending/loans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Captured err == ERR_NOT_FOUND"
            - "HTTP status 404"

      - name: merchant_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.Merchant.fields.state_code", "validations[priority=11]"]
        distinguishing_aspect: "state_code that is not two uppercase letters (e.g. 'Texas') violates the type constraint and is rejected."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Bad State Co", state_code: "Texas", owner_name: "Ba D", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Captured err == ERR_INVALID_REQUEST"

      - name: merchants_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /lending/merchants]"]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed response envelope."
        test_recipe:
          setup: ["two merchants exist"]
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "P1 Co", state_code: "TX", owner_name: "P One", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lending/merchants"
              payload: { legal_name: "P2 Co", state_code: "CA", owner_name: "P Two", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /lending/merchants?limit=1&offset=0"
              as: Auditor
          assert:
            - "Response meta contains pagination fields; total_count == 2; has_more == true; exactly 1 item returned"

      - name: guarantor_reverse_reachability_via_loan
        claim_type: parent_relationships
        grounds: ["entities.Guarantor.fields.loan_id", "endpoints[GET /lending/loans/{id}/guarantors]"]
        distinguishing_aspect: "The Guarantor FK to Loan is reverse-reachable: the sub-resource list returns the 0..1 guarantor created at offer acceptance."
        test_recipe:
          setup: ["flat merchant ELIGIBLE; offer accepted creating loan+guarantor"]
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Flat Co", state_code: "TX", owner_name: "Flat Line", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-09-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y1: $.data.id }
            - call: "POST /lending/processing_batches/${y1}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-10-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y2: $.data.id }
            - call: "POST /lending/processing_batches/${y2}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-11-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y3: $.data.id }
            - call: "POST /lending/processing_batches/${y3}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-12-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y4: $.data.id }
            - call: "POST /lending/processing_batches/${y4}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-01-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y5: $.data.id }
            - call: "POST /lending/processing_batches/${y5}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-02-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y6: $.data.id }
            - call: "POST /lending/processing_batches/${y6}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-03-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y7: $.data.id }
            - call: "POST /lending/processing_batches/${y7}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-04-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y8: $.data.id }
            - call: "POST /lending/processing_batches/${y8}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-05-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y9: $.data.id }
            - call: "POST /lending/processing_batches/${y9}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-06-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y10: $.data.id }
            - call: "POST /lending/processing_batches/${y10}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-07-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y11: $.data.id }
            - call: "POST /lending/processing_batches/${y11}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-08-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { y12: $.data.id }
            - call: "POST /lending/processing_batches/${y12}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/activate"
              as: PlatformAdmin
            - call: "POST /lending/merchants/${m_id}/offers"
              as: Underwriter
              captures: { o_id: $.data.id }
            - call: "POST /lending/offers/${o_id}/issue"
              as: Underwriter
            - call: "GET /lending/merchants/${m_id}"
              as: PlatformAdmin
              captures: { m_v: $.data.version }
            - call: "POST /lending/offers/${o_id}/accept"
              payload: { selected_principal_cents: 500000, accepted_holdback_pct: 0.08, guarantor_full_name: "G Name", guarantor_email: "g@x.com", guarantee_cap_cents: 1000000, expected_merchant_version: "${m_v}" }
              as: MerchantOwner
              as_user_id: "${m_id}"
              captures: { l_id: $.data.accepted_loan_id }
          trigger:
            - call: "GET /lending/loans/${l_id}/guarantors"
              as: PlatformAdmin
          assert:
            - "Response data is an array of length 1 whose element loan_id == ${l_id} and status == LINKED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: batch_finalize_from_finalized_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.ProcessingDayBatch.transitions", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Finalizing an already-FINALIZED batch is rejected; no aggregate recompute double-counts."
        test_recipe:
          setup: ["merchant with one FINALIZED batch"]
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "FF Co", state_code: "TX", owner_name: "F F", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-09-01", gross_cents: 1000 }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /lending/processing_batches/${b_id}/finalize"
              as: ServicerAgent
          trigger:
            - call: "POST /lending/processing_batches/${b_id}/finalize"
              as: ServicerAgent
              captures: { err: $.data.error_id }
          assert:
            - "Captured err == ERR_INVALID_STATE_TRANSITION"
            - "Merchant.${m_id}.lifetime_net_cents == 1000 (unchanged)"

      - name: offer_withdraw_from_accepted_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.LoanOffer.terminal_states", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "ACCEPTED is terminal for LoanOffer: withdraw from ACCEPTED is rejected."
        test_recipe:
          setup: ["flat merchant ELIGIBLE with an ACCEPTED offer"]
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Flat Co", state_code: "TX", owner_name: "Flat Line", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-09-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z1: $.data.id }
            - call: "POST /lending/processing_batches/${z1}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-10-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z2: $.data.id }
            - call: "POST /lending/processing_batches/${z2}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-11-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z3: $.data.id }
            - call: "POST /lending/processing_batches/${z3}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-12-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z4: $.data.id }
            - call: "POST /lending/processing_batches/${z4}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-01-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z5: $.data.id }
            - call: "POST /lending/processing_batches/${z5}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-02-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z6: $.data.id }
            - call: "POST /lending/processing_batches/${z6}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-03-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z7: $.data.id }
            - call: "POST /lending/processing_batches/${z7}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-04-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z8: $.data.id }
            - call: "POST /lending/processing_batches/${z8}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-05-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z9: $.data.id }
            - call: "POST /lending/processing_batches/${z9}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-06-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z10: $.data.id }
            - call: "POST /lending/processing_batches/${z10}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-07-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z11: $.data.id }
            - call: "POST /lending/processing_batches/${z11}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-08-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { z12: $.data.id }
            - call: "POST /lending/processing_batches/${z12}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/activate"
              as: PlatformAdmin
            - call: "POST /lending/merchants/${m_id}/offers"
              as: Underwriter
              captures: { o_id: $.data.id }
            - call: "POST /lending/offers/${o_id}/issue"
              as: Underwriter
            - call: "GET /lending/merchants/${m_id}"
              as: PlatformAdmin
              captures: { m_v: $.data.version }
            - call: "POST /lending/offers/${o_id}/accept"
              payload: { selected_principal_cents: 500000, accepted_holdback_pct: 0.08, guarantor_full_name: "G Name", guarantor_email: "g@x.com", guarantee_cap_cents: 1000000, expected_merchant_version: "${m_v}" }
              as: MerchantOwner
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /lending/offers/${o_id}/withdraw"
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "Captured err == ERR_INVALID_STATE_TRANSITION"
            - "LoanOffer.${o_id}.status == ACCEPTED"

      - name: guarantor_acknowledge_twice_rejected
        claim_type: idempotency
        grounds: ["state_machines.Guarantor.LINKED_to_ACTIVE", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Acknowledging an already-ACTIVE guarantee is not idempotent; the second call is rejected."
        test_recipe:
          setup: ["flat merchant ELIGIBLE; offer accepted; guarantor acknowledged once"]
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Flat Co", state_code: "TX", owner_name: "Flat Line", processing_started_at: "2023-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-09-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /lending/processing_batches/${m1}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-10-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m2: $.data.id }
            - call: "POST /lending/processing_batches/${m2}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-11-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m3: $.data.id }
            - call: "POST /lending/processing_batches/${m3}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2025-12-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m4: $.data.id }
            - call: "POST /lending/processing_batches/${m4}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-01-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m5: $.data.id }
            - call: "POST /lending/processing_batches/${m5}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-02-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m6: $.data.id }
            - call: "POST /lending/processing_batches/${m6}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-03-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m7: $.data.id }
            - call: "POST /lending/processing_batches/${m7}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-04-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m8: $.data.id }
            - call: "POST /lending/processing_batches/${m8}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-05-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m9: $.data.id }
            - call: "POST /lending/processing_batches/${m9}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-06-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m10: $.data.id }
            - call: "POST /lending/processing_batches/${m10}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-07-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m11: $.data.id }
            - call: "POST /lending/processing_batches/${m11}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/processing_batches"
              payload: { processing_date: "2026-08-01", gross_cents: 1000000 }
              as: PlatformAdmin
              captures: { m12: $.data.id }
            - call: "POST /lending/processing_batches/${m12}/finalize"
              as: ServicerAgent
            - call: "POST /lending/merchants/${m_id}/activate"
              as: PlatformAdmin
            - call: "POST /lending/merchants/${m_id}/offers"
              as: Underwriter
              captures: { o_id: $.data.id }
            - call: "POST /lending/offers/${o_id}/issue"
              as: Underwriter
            - call: "GET /lending/merchants/${m_id}"
              as: PlatformAdmin
              captures: { m_v: $.data.version }
            - call: "POST /lending/offers/${o_id}/accept"
              payload: { selected_principal_cents: 500000, accepted_holdback_pct: 0.08, guarantor_full_name: "G Name", guarantor_email: "g@x.com", guarantee_cap_cents: 1000000, expected_merchant_version: "${m_v}" }
              as: MerchantOwner
              as_user_id: "${m_id}"
              captures: { l_id: $.data.accepted_loan_id }
            - call: "GET /lending/loans/${l_id}/guarantors"
              as: PlatformAdmin
              captures: { g_id: "$.data[0].id" }
            - call: "POST /lending/guarantors/${g_id}/acknowledge"
              as: GuarantorPrincipal
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /lending/guarantors/${g_id}/acknowledge"
              as: GuarantorPrincipal
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Captured err == ERR_INVALID_STATE_TRANSITION"
            - "Guarantor.${g_id}.status == ACTIVE"

      - name: disclosure_acknowledge_before_deliver_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DisclosureStatement.transitions", "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Acknowledging a GENERATED (never delivered) disclosure is rejected — DELIVERED is the only valid source state."
        test_recipe:
          setup: ["flat merchant ELIGIBLE; offer accepted; disclosure exists in GENERATED"]
          setup_api_calls:
            - call: "POST /lending/merchants"
              payload: { legal_name: "Flat Co", state_code: "TX", owner_name: "Flat Line", processing_started_at: "2023-01-01T00:00:00Z" }
