scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 - dual_variant_calc (2 instances, different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sanction_severity_provisional_excludes_mitigating
        grounds:
          - calculations.calc_sanction_severity_score
          - entities.Determination.fields.provisional_severity_score
          - entities.Determination.fields.final_severity_score
        distinguishing_aspect: |
          Entity domain Determination/Sanction: for identical factor inputs (SEXUAL_ASSAULT base 40,
          1 prior, 2 aggravating, 2 mitigating), the PROVISIONAL variant computed at DRAFT yields 75
          (would-be TIER_4) while the FINAL variant computed at issue yields 65 (TIER_3) because only
          FINAL subtracts mitigating points - same inputs, observably different score and tier.
        test_recipe:
          setup:
            - "Case with categories [SEXUAL_ASSAULT] driven to DELIBERATION with a completed hearing"
            - "Determination factors: prior_responsible_findings=1, aggravating_factor_count=2, mitigating_factor_count=2"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Inv One", university_id: "U-INV-1", role_type: "STAFF", email: "inv1@example.edu" }, as: CaseAdministrator, captures: { inv_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "DM One", university_id: "U-DM-1", role_type: "FACULTY", email: "dm1@example.edu" }, as: CaseAdministrator, captures: { dm_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Adv C", university_id: "U-ADVC-1", role_type: "EXTERNAL", email: "advc@example.edu", advisor_eligible: true }, as: CaseAdministrator, captures: { advc_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Adv R", university_id: "U-ADVR-1", role_type: "EXTERNAL", email: "advr@example.edu", advisor_eligible: true }, as: CaseAdministrator, captures: { advr_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["SEXUAL_ASSAULT"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/confirm-jurisdiction", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/file-formal-complaint", as: Party, as_user_id: "${comp_id}" }
            - call: "POST /api/cases/${case_id}/investigator-assignments"
              payload: { investigator_id: "${inv_id}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { asg_id: $.data.id }
            - { call: "POST /api/investigator-assignments/${asg_id}/accept", as: Investigator, as_user_id: "${inv_id}" }
            - call: "POST /api/cases/${case_id}/evidence-items"
              payload: { submitted_by_side: "COMPLAINANT", evidence_type: "DOCUMENT", description: "Message thread" }
              as: Party
              as_user_id: "${comp_id}"
              captures: { ev_id: $.data.id }
            - { call: "POST /api/evidence-items/${ev_id}/begin-review", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/evidence-items/${ev_id}/rule-relevance", payload: { ruling: "ACCEPTED" }, as: Investigator, as_user_id: "${inv_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { case_v: $.data.version } }
            - call: "POST /api/cases/${case_id}/evidence-packets"
              payload: { expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { pkt_id: $.data.id }
            - { call: "POST /api/evidence-packets/${pkt_id}/attach-report", payload: { investigative_report_summary: "Findings narrative" }, as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/release", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/review-responses", payload: { party_side: "COMPLAINANT", response_text: "no comment" }, as: Party, as_user_id: "${comp_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/review-responses", payload: { party_side: "RESPONDENT", response_text: "no comment" }, as: Party, as_user_id: "${resp_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/finalize", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/cases/${case_id}/advisor-appointments", payload: { party_side: "COMPLAINANT", advisor_id: "${advc_id}" }, as: Party, as_user_id: "${comp_id}" }
            - { call: "POST /api/cases/${case_id}/advisor-appointments", payload: { party_side: "RESPONDENT", advisor_id: "${advr_id}" }, as: Party, as_user_id: "${resp_id}" }
            - call: "POST /api/cases/${case_id}/hearings"
              payload: { decision_maker_id: "${dm_id}", scheduled_at: "2026-09-01T10:00:00Z", estimated_duration_minutes: 60, modality: "VIRTUAL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { hr_id: $.data.id }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:00:00Z" }, as: CaseAdministrator }
            - { call: "POST /api/hearings/${hr_id}/convene", as: DecisionMaker, as_user_id: "${dm_id}" }
            - call: "POST /api/hearings/${hr_id}/cross-exam-questions"
              payload: { asked_by_advisor_id: "${advc_id}", target_side: "RESPONDENT", question_text: "Where were you?" }
              as: Advisor
              as_user_id: "${advc_id}"
              captures: { q_id: $.data.id }
            - { call: "POST /api/cross-exam-questions/${q_id}/rule", payload: { ruling: "ALLOWED" }, as: DecisionMaker, as_user_id: "${dm_id}" }
            - { call: "POST /api/hearings/${hr_id}/close-cross-exam", as: DecisionMaker, as_user_id: "${dm_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { case_v2: $.data.version } }
            - call: "POST /api/cases/${case_id}/determinations"
              payload: { responsibility_finding: "RESPONSIBLE", standard_of_evidence: "PREPONDERANCE", rationale: "Evidence preponderates", aggravating_factor_count: 2, mitigating_factor_count: 2, prior_responsible_findings: 1, expected_case_version: "${case_v2}" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { det_id: $.data.id, prov_score: $.data.provisional_severity_score }
          trigger:
            - call: "POST /api/determinations/${det_id}/issue"
              payload: { sanction_selections: [ { sanction_type: "SUSPENSION", duration_days: 120 } ] }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { fin_score: $.data.final_severity_score, fin_tier: $.data.final_tier }
          assert:
            - "Determination.${det_id}.provisional_severity_score == 75 (40 + 15*1 + 10*2, mitigating excluded)"
            - "Determination.${det_id}.final_severity_score == 65 (75 - 5*2, mitigating included)"
            - "Determination.${det_id}.final_tier == TIER_3 (65 in [50,74]) although the provisional 75 would have been TIER_4 - variants diverge for identical inputs"
            - "Sanction SUSPENSION duration_days == 120 accepted (within TIER_3 bounds 91..365)"

      - name: annual_statistics_published_snapshot_frozen_vs_live
        grounds:
          - calculations.calc_annual_statistics
          - entities.AnnualStatistic.fields.snapshot_counts
          - entities.AnnualStatistic.fields.amended_counts
        distinguishing_aspect: |
          Entity domain AnnualStatistic/Case-counting (distinct from the Determination domain of the
          sibling instance): the PUBLISHED variant freezes counts at publish time while the LIVE variant
          recomputes - a case dismissed after publish raises the live dismissed count to 1 while the
          frozen snapshot_counts.dismissed stays 0 for the same underlying rows.
        test_recipe:
          setup:
            - "Two cases received in 2026 (default clock 2026-08-01), both in JURISDICTION_REVIEW"
            - "Year 2026 statistics published while both cases in flight"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-06-01T20:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "EMAIL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case1_id: $.data.id }
            - { call: "POST /api/cases/${case1_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["SEXUAL_HARASSMENT"], occurred_at: "2026-06-20T20:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "IN_PERSON" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case2_id: $.data.id }
            - { call: "POST /api/cases/${case2_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/annual-statistics/2026/publish", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { snap_reports: $.data.snapshot_counts } }
            - { call: "POST /api/cases/${case2_id}/dismiss", payload: { dismissal_reason: "DISCRETIONARY_EVIDENCE_UNAVAILABLE", refer_to_conduct: false }, as: TitleIXCoordinator, as_user_id: "${coord_id}" }
          trigger:
            - { call: "GET /api/annual-statistics/2026", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { live_counts: $.data.counts, frozen_counts: $.data.snapshot_counts } }
          assert:
            - "GET /api/annual-statistics/2026 data.status == PUBLISHED"
            - "data.snapshot_counts.dismissed == 0 and data.snapshot_counts.reports_received == 2 (frozen at publish)"
            - "data.counts.dismissed == 1 and data.counts.reports_received == 2 (live recompute sees the post-publish dismissal)"
            - "LIVE and PUBLISHED variants therefore return different dismissed counts for the same underlying rows"

  # ==========================================================================
  # Rule 2 - combinatorial_formula (3 instances, modes (a), (c), (b))
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sanction_matrix_tier_boundary_mode_a
        grounds:
          - calculations.calc_sanction_severity_score
          - validations[priority=7]
          - errors[ERR_SANCTION_OUTSIDE_MATRIX]
        distinguishing_aspect: |
          Mode (a) - >=3 inputs with non-linear interaction (weighted sum feeding tiered-rate band
          selection with conditional per-tier sanction menus): final score exactly 50 lands in TIER_3
          (lower bound inclusive) so SUSPENSION 91d is legal, while the same draft offering PROBATION
          30d - legal in TIER_2 - is rejected because TIER_3 probation starts at 91d.
        test_recipe:
          setup:
            - "Case with categories [STALKING] in DELIBERATION; draft factors prior=1, aggravating=1, mitigating=1 -> final matrix score 30 + 15 + 10 - 5 = 50"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Inv One", university_id: "U-INV-1", role_type: "STAFF", email: "inv1@example.edu" }, as: CaseAdministrator, captures: { inv_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "DM One", university_id: "U-DM-1", role_type: "FACULTY", email: "dm1@example.edu" }, as: CaseAdministrator, captures: { dm_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Adv C", university_id: "U-ADVC-1", role_type: "EXTERNAL", email: "advc@example.edu", advisor_eligible: true }, as: CaseAdministrator, captures: { advc_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Adv R", university_id: "U-ADVR-1", role_type: "EXTERNAL", email: "advr@example.edu", advisor_eligible: true }, as: CaseAdministrator, captures: { advr_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["STALKING"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/confirm-jurisdiction", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/file-formal-complaint", as: Party, as_user_id: "${comp_id}" }
            - call: "POST /api/cases/${case_id}/investigator-assignments"
              payload: { investigator_id: "${inv_id}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { asg_id: $.data.id }
            - { call: "POST /api/investigator-assignments/${asg_id}/accept", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { case_v: $.data.version } }
            - call: "POST /api/cases/${case_id}/evidence-packets"
              payload: { expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { pkt_id: $.data.id }
            - { call: "POST /api/evidence-packets/${pkt_id}/attach-report", payload: { investigative_report_summary: "Findings narrative" }, as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/release", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/review-responses", payload: { party_side: "COMPLAINANT", response_text: "ok" }, as: Party, as_user_id: "${comp_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/review-responses", payload: { party_side: "RESPONDENT", response_text: "ok" }, as: Party, as_user_id: "${resp_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/finalize", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/cases/${case_id}/advisor-appointments", payload: { party_side: "COMPLAINANT", advisor_id: "${advc_id}" }, as: Party, as_user_id: "${comp_id}" }
            - { call: "POST /api/cases/${case_id}/advisor-appointments", payload: { party_side: "RESPONDENT", advisor_id: "${advr_id}" }, as: Party, as_user_id: "${resp_id}" }
            - call: "POST /api/cases/${case_id}/hearings"
              payload: { decision_maker_id: "${dm_id}", scheduled_at: "2026-09-01T10:00:00Z", estimated_duration_minutes: 60, modality: "VIRTUAL" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { hr_id: $.data.id }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T10:00:00Z" }, as: CaseAdministrator }
            - { call: "POST /api/hearings/${hr_id}/convene", as: DecisionMaker, as_user_id: "${dm_id}" }
            - { call: "POST /api/hearings/${hr_id}/close-cross-exam", as: DecisionMaker, as_user_id: "${dm_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { case_v2: $.data.version } }
            - call: "POST /api/cases/${case_id}/determinations"
              payload: { responsibility_finding: "RESPONSIBLE", standard_of_evidence: "PREPONDERANCE", rationale: "Stalking established", aggravating_factor_count: 1, mitigating_factor_count: 1, prior_responsible_findings: 1, expected_case_version: "${case_v2}" }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { det_id: $.data.id, prov_score: $.data.provisional_severity_score }
          trigger:
            - call: "POST /api/determinations/${det_id}/issue"
              payload: { sanction_selections: [ { sanction_type: "PROBATION", duration_days: 30 } ] }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /api/determinations/${det_id}/issue"
              payload: { sanction_selections: [ { sanction_type: "SUSPENSION", duration_days: 91 } ] }
              as: DecisionMaker
              as_user_id: "${dm_id}"
              captures: { fin_score: $.data.final_severity_score, fin_tier: $.data.final_tier }
          assert:
            - "first issue rejected: error_id == ERR_SANCTION_OUTSIDE_MATRIX (PROBATION 30d below TIER_3 probation floor of 91)"
            - "determination remains DRAFT after the rejected issue (no partial issue)"
            - "Determination.${det_id}.provisional_severity_score == 55 (30 + 15 + 10, mitigating excluded at draft)"
            - "second issue succeeds: final_severity_score == 50 (55 - 5*1) and final_tier == TIER_3 (50 is the inclusive lower bound of [50,74])"
            - "SUSPENSION duration_days == 91 accepted at the exact TIER_3 suspension floor"

      - name: restitution_pinned_evaluation_order_mode_c
        grounds:
          - calculations.calc_restitution_amount
          - entities.Sanction.fields.applied_restitution_cents
          - entities.Determination.fields.final_tier
        distinguishing_aspect: |
          Mode (c) - circular-looking dependency resolved by pinned order: the restitution cap comes
          from cap_tier = tier(matrix_score=55) = TIER_3 (cap $500.00), so items totalling $550.00 are
          clamped to $500.00 = 50000 cents; the resulting 500 restitution points then push total to 555
          so final_tier == TIER_4 - the cap does NOT re-index to TIER_4's $2500 even though the final
          tier is TIER_4.
        test_recipe:
          setup:
            - "Case [SEXUAL_ASSAULT] in DELIBERATION; draft factors prior=1, aggravating=0, mitigating=0 -> matrix score 40 + 15 = 55 (cap_tier TIER_3)"
            - "RESTITUTION selection with items [300.00, 250.00] dollars"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Inv One", university_id: "U-INV-1", role_type: "STAFF", email: "inv1@example.edu" }, as: CaseAdministrator, captures: { inv_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "DM One", university_id: "U-DM-1", role_type: "FACULTY", email: "dm1@example.edu" }, as: CaseAdministrator, captures: { dm_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Adv C", university_id: "U-ADVC-1", role_type: "EXTERNAL", email: "advc@example.edu", advisor_eligible: true }, as: CaseAdministrator, captures: { advc_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Adv R", university_id: "U-ADVR-1", role_type: "EXTERNAL", email: "advr@example.edu", advisor_eligible: true }, as: CaseAdministrator, captures: { advr_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["SEXUAL_ASSAULT"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/confirm-jurisdiction", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/file-formal-complaint", as: Party, as_user_id: "${comp_id}" }
            - call: "POST /api/cases/${case_id}/investigator-assignments"
              payload: { investigator_id: "${inv_id}" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { asg_id: $.data.id }
            - { call: "POST /api/investigator-assignments/${asg_id}/accept", as: Investigator, as_user_id: "${inv_id}" }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { case_v: $.data.version } }
            - call: "POST /api/cases/${case_id}/evidence-packets"
              payload: { expected_case_version: "${case_v}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { pkt_id: $.data.id }
            - { call: "POST /api/evidence-packets/${pkt_id}/attach-report", payload: { investigative_report_summary: "Findings narrative" }, as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/release", as: Investigator, as_user_id: "${inv_id}" }
