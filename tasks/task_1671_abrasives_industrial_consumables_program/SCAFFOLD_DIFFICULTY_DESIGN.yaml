# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Abrasives & Industrial Consumables Program
# 9 rules x 2 instances = 18 instances. All numeric asserts pre-computed.
# Logical clock default (unless set): 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: release_price_provisional_vs_final
        grounds:
          - calculations.release_price_at_date
          - state_machines.Release.PICKED_to_SHIPPED
          - entities.Release.fields.provisional_unit_price_cents
          - entities.Release.fields.final_unit_price_cents
        distinguishing_aspect: |
          Pricing domain on Release: identical contract/order/qty inputs yield a
          PROVISIONAL unit price evaluated at scheduled_ship_date (2026-09-01, inside
          price hold -> 10000) and a FINAL unit price evaluated at the ship-time clock
          (2027-01-15, past escalation effective -> 10400); the two variants differ by
          exactly the 4% escalation.
        test_recipe:
          setup:
            - "COATED product rpm 6000 (no shelf life); contract term 2026-01-01..2027-12-31, price_hold_end 2026-12-31, escalation 4% effective 2027-01-01, line base 10000c; blanket order committed 240, OPEN; lot of 300 units"
            - "release qty 240 scheduled 2026-09-01 (<= price_hold_end) then PICKED; logical clock later set to 2027-01-15 (escalation in force, contract still ACTIVE)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-240", name: "Coated Belt 240", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-1", contract_number: "C-1001", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.04, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 240 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 240, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-300", manufacture_date: "2026-06-01", qty_received: 300 }
              as: AccountManager
              captures: { lot_id: $.data.id }
            - call: "POST /api/releases/${rel_id}/pick"
              as: AccountManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/releases/${rel_id}/ship"
              as: AccountManager
              captures: { final_p: $.data.final_unit_price_cents, billed: $.data.billed_total_cents }
            - call: "GET /api/releases/${rel_id}"
              as: AccountManager
              captures: { prov_p: $.data.provisional_unit_price_cents }
          assert:
            - "Release.${rel_id}.provisional_unit_price_cents == 10000 (evaluated at scheduled_ship_date 2026-09-01, inside price hold)"
            - "Release.${rel_id}.final_unit_price_cents == 10400 (evaluated at ship clock 2027-01-15: round_half_up(10000 * 1.04))"
            - "Release.${rel_id}.billed_total_cents == 2496000 (240 x 10400; committed 240 < 500 -> tier 0)"
            - "Release.${rel_id}.status == SHIPPED"

      - name: lot_expiry_exact_vs_eom
        grounds:
          - calculations.lot_expiry_date
          - entities.InventoryLot.fields.expiry_date
          - entities.Product.fields.shelf_life_policy
        distinguishing_aspect: |
          Shelf-life domain on InventoryLot: identical manufacture_date 2026-01-15 and
          shelf_life_months 12 produce expiry 2027-01-15 under EXACT_DAY but 2027-01-31
          under END_OF_MONTH — the variant is selected by Product.shelf_life_policy,
          not by any release/ship context (different entity domain than instance 1).
        test_recipe:
          setup:
            - "Two BONDED products, identical except shelf_life_policy (EXACT_DAY vs END_OF_MONTH)"
            - "One lot each, manufacture_date 2026-01-15, shelf_life_months 12"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "BW-EX", name: "Bonded Wheel Exact", product_form: "BONDED", max_operating_speed_rpm: 6000, shelf_life_months: 12, shelf_life_policy: "EXACT_DAY" }
              as: ProgramAdmin
              captures: { p_ex: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "BW-EOM", name: "Bonded Wheel EOM", product_form: "BONDED", max_operating_speed_rpm: 6000, shelf_life_months: 12, shelf_life_policy: "END_OF_MONTH" }
              as: ProgramAdmin
              captures: { p_eom: $.data.id }
          trigger:
            - call: "POST /api/lots"
              payload: { product_id: "${p_ex}", lot_code: "L-EX", manufacture_date: "2026-01-15", qty_received: 10 }
              as: AccountManager
              captures: { lot_ex: $.data.id, ex_expiry: $.data.expiry_date }
            - call: "POST /api/lots"
              payload: { product_id: "${p_eom}", lot_code: "L-EOM", manufacture_date: "2026-01-15", qty_received: 10 }
              as: AccountManager
              captures: { lot_eom: $.data.id, eom_expiry: $.data.expiry_date }
          assert:
            - "InventoryLot.${lot_ex}.expiry_date == 2027-01-15 (EXACT_DAY anniversary)"
            - "InventoryLot.${lot_eom}.expiry_date == 2027-01-31 (END_OF_MONTH last day)"
            - "The two expiry dates differ for identical manufacture_date and shelf_life_months"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: billing_total_unit_first_rounding
        grounds:
          - calculations.release_billing_total
          - state_machines.Release.PICKED_to_SHIPPED
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-at-unit-then-multiply.
          base 10013c, escalation 4%, qty 2 -> pinned unit 10414c, total 20828c; the
          counterfactual order-level rounding round(10013*1.04*2)=20827c is WRONG.
        test_recipe:
          setup:
            - "COATED product; contract ACTIVE, price_hold_end 2026-12-31, escalation 4% effective 2027-01-01, line base 10013c; blanket order committed 100 (tier 0), OPEN; release qty 2 scheduled 2027-02-01 (escalated window); lot qty 10; clock advanced to 2027-02-01 before ship"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-RND", name: "Coated Roll", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-2", contract_number: "C-1002", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.04, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10013 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 100 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 2, scheduled_ship_date: "2027-02-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-RND", manufacture_date: "2026-06-01", qty_received: 10 }
              as: AccountManager
            - call: "POST /api/releases/${rel_id}/pick"
              as: AccountManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/releases/${rel_id}/ship"
              as: AccountManager
              captures: { billed: $.data.billed_total_cents, final_p: $.data.final_unit_price_cents }
          assert:
            - "Release.${rel_id}.final_unit_price_cents == 10414 (round_half_up(10013 * 1.04) at unit level)"
            - "Release.${rel_id}.billed_total_cents == 20828 (2 x 10414, tier 0 discount 0; NOT 20827 from order-level rounding)"
            - "Release.${rel_id}.status == SHIPPED"

      - name: usage_variance_rolling_window_trigger
        grounds:
          - calculations.consumption_variance
          - entities.UsageStandard.fields.needs_review
          - entities.MachineAsset.fields.consumption_flag
        distinguishing_aspect: |
          Mode (a) >=3 inputs with conditional branching: variance_pct derives from
          qty_used, parts_produced, and the covering standard rate, then a rolling
          5-record window count (>=3 OVER) flips standard.needs_review and the
          machine's consumption_flag — inputs interact non-linearly (band edges plus
          window composition), unlike instance 1's rounding-order mode.
        test_recipe:
          setup:
            - "COATED product rpm 6000; machine spindle 5000 guard NONE (ACTIVE); ACTIVE standard 0.0250 units/part window [2026-01-01, open); lot qty 5000"
            - "One IN_BAND record at exactly +10% (275/10000 -> 0.0275), then three OVER records (300/10000 -> 0.0300, +20%)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-VAR", name: "Coated Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-3", asset_tag: "BS-01", machine_type: "BELT_SANDER", spindle_max_rpm: 5000, guard_type: "NONE" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "WELD_BLEND", standard_qty_per_part: 0.0250, effective_from: "2026-01-01" }
              as: AccountManager
              captures: { std_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-VAR", manufacture_date: "2026-06-01", qty_received: 5000 }
              as: AccountManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 275, parts_produced: 10000 }
              as: AccountManager
              captures: { ur1: $.data.id, ur1_band: $.data.variance_band, ur1_var: $.data.variance_pct }
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 300, parts_produced: 10000 }
              as: AccountManager
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 300, parts_produced: 10000 }
              as: AccountManager
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 300, parts_produced: 10000 }
              as: AccountManager
              captures: { ur4: $.data.id, ur4_band: $.data.variance_band, ur4_var: $.data.variance_pct }
            - call: "GET /api/standards/${std_id}"
              as: AccountManager
              captures: { std_review: $.data.needs_review }
            - call: "GET /api/machines/${m_id}"
              as: AccountManager
              captures: { m_flag: $.data.consumption_flag }
          assert:
            - "UsageRecord.${ur1}.variance_pct == 0.1000 and variance_band == IN_BAND (exactly +10% is NOT over; strictly-greater rule)"
            - "UsageRecord.${ur4}.variance_pct == 0.2000 and variance_band == OVER"
            - "UsageStandard.${std_id}.needs_review == true (3 of the last 5 records OVER)"
            - "MachineAsset.${m_id}.consumption_flag == ELEVATED"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: machine_quarantine_reinstate_cycle
        grounds:
          - state_machines.MachineAsset.ACTIVE_to_QUARANTINED
          - state_machines.MachineAsset.QUARANTINED_to_ACTIVE
        distinguishing_aspect: |
          MachineAsset is cyclic (ACTIVE -> QUARANTINED -> ACTIVE -> QUARANTINED) on
          the same row; the cycle may repeat with version incrementing each pass.
        test_recipe:
          setup:
            - "One ACTIVE machine, spindle 5000, FIXED guard"
          setup_api_calls:
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-4", asset_tag: "GR-01", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id, m_v0: $.data.version }
          trigger:
            - call: "POST /api/machines/${m_id}/quarantine"
              as: EHSOfficer
              captures: { s1: $.data.status, v1: $.data.version }
            - call: "POST /api/machines/${m_id}/reinstate"
              as: EHSOfficer
              captures: { s2: $.data.status, v2: $.data.version }
            - call: "POST /api/machines/${m_id}/quarantine"
              as: EHSOfficer
              captures: { s3: $.data.status, v3: $.data.version }
          assert:
            - "MachineAsset status sequence: ACTIVE(create) -> QUARANTINED -> ACTIVE -> QUARANTINED (second quarantine succeeds — cycle, not one-way)"
            - "MachineAsset.${m_id}.version == 4 after the third transition (create v1 + 3 mutations)"

      - name: release_branching_cancel_side_effects
        grounds:
          - state_machines.Release.SCHEDULED_to_CANCELLED
          - state_machines.Release.PICKED_to_CANCELLED
        distinguishing_aspect: |
          Release branches to the SAME terminal CANCELLED from SCHEDULED vs PICKED
          with divergent side-effect sets: the PICKED branch restores allocation
          quantities to the same lots and clears allocations; the SCHEDULED branch
          never touches lots.
        test_recipe:
          setup:
            - "COATED product; contract ACTIVE (escalation 0); blanket order committed 100 OPEN; lot L qty 50; R1 qty 10 SCHEDULED, R2 qty 10 PICKED with allocations [{L,10}] (L on_hand 40)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-BR", name: "Coated Belt Br", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-5", contract_number: "C-1003", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 100 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 10, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { r1_id: $.data.id }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { bo_v3: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 10, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v3}" }
              as: AccountManager
              captures: { r2_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-BR", manufacture_date: "2026-06-01", qty_received: 50 }
              as: AccountManager
              captures: { lot_id: $.data.id }
            - call: "POST /api/releases/${r2_id}/pick"
              as: AccountManager
          trigger:
            - call: "POST /api/releases/${r1_id}/cancel"
              as: AccountManager
              captures: { r1_status: $.data.status }
            - call: "POST /api/releases/${r2_id}/cancel"
              as: AccountManager
              captures: { r2_status: $.data.status, r2_alloc: $.data.allocations }
            - call: "GET /api/lots/${lot_id}"
              as: AccountManager
              captures: { lot_qoh: $.data.qty_on_hand, lot_status: $.data.status }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { bo_rem: $.data.remaining_qty, bo_status: $.data.status }
          assert:
            - "Release.${r1_id}.status == CANCELLED (from SCHEDULED; no lot was ever allocated to it)"
            - "Release.${r2_id}.status == CANCELLED (from PICKED) and allocations == [] (cleared)"
            - "InventoryLot.${lot_id}.qty_on_hand == 50 (Picked-branch restore returned 10 units to the same lot) and status == AVAILABLE"
            - "BlanketOrder.${bo_id}.remaining_qty == 100 (both give-backs) and status == OPEN (remaining > 0, no auto-close)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: contract_amend_price_cascade_depth3
        grounds:
          - state_machines.Contract.ACTIVE_to_ACTIVE
          - concurrency_rules[contract-amend-stale-version]
          - entities.ContractLine.fields.current_unit_price_cents
          - entities.BlanketOrder.fields.provisional_remaining_value_cents
          - entities.Release.fields.provisional_unit_price_cents
        distinguishing_aspect: |
          Depth-3 chain from PATCH /api/contracts/{id}: amend mutates ContractLine
          (hop 1); each changed line mutates matching OPEN BlanketOrder provisional
          fields (hop 2); each order mutation re-stamps its SCHEDULED releases (hop 3).
          Trigger differs from instance 2 (product discontinuation).
        test_recipe:
          setup:
            - "Contract ACTIVE: base 10000c, escalation 4% effective 2027-01-01, hold to 2026-12-31, term to 2027-12-31; blanket order committed 100 OPEN (provisional 10000c); release qty 10 SCHEDULED for 2026-09-01 (provisional 10000c); remaining 90"
            - "Logical clock advanced to 2027-02-01 (escalation window) BEFORE the amend"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-AM", name: "Coated Belt Am", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-6", contract_number: "C-1004", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.04, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
              captures: { c_v: $.data.version }
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 100 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 10, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id, rel_prov0: $.data.provisional_unit_price_cents }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { swept_contracts: $.data.contracts_expired }
          trigger:
            - call: "PATCH /api/contracts/${c_id}"
              payload: { expected_contract_version: "${c_v}", escalation_pct: 0.05 }
              as: ProgramAdmin
              captures: { c_v2: $.data.version }
            - call: "GET /api/contract-lines"
              payload: { contract_id: "${c_id}" }
              as: ProgramAdmin
              captures: { line_price: "$.data[0].current_unit_price_cents" }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: ProgramAdmin
              captures: { bo_unit: $.data.provisional_unit_price_cents, bo_val: $.data.provisional_remaining_value_cents }
            - call: "GET /api/releases/${rel_id}"
              as: ProgramAdmin
              captures: { rel_prov: $.data.provisional_unit_price_cents }
          assert:
            - "Clock sweep before amend: contracts_expired == 0 (term_end 2027-12-31 not yet passed)"
            - "Release.${rel_id}.provisional_unit_price_cents was 10000 before amend (scheduled 2026-09-01 inside hold)"
            - "Hop 1: ContractLine.current_unit_price_cents == 10500 (round_half_up(10000 * 1.05) at clock 2027-02-01)"
            - "Hop 2: BlanketOrder.${bo_id}.provisional_unit_price_cents == 10500 and provisional_remaining_value_cents == 945000 (90 x 10500)"
            - "Hop 3: Release.${rel_id}.provisional_unit_price_cents == 10500 (re-stamped at its scheduled_ship_date under new escalation)"
            - "Contract.${c_id}.version advanced to 3 by the amend"

      - name: product_discontinue_cascade_depth2
        grounds:
          - state_machines.Product.ACTIVE_to_DISCONTINUED
          - state_machines.Release.SCHEDULED_to_ON_HOLD
          - entities.BlanketOrder.fields.substitution_status
          - entities.InventoryLot.fields.status
        distinguishing_aspect: |
          Depth-2 chain from POST /api/products/{id}/discontinue: discontinuation
          mutates OPEN blanket orders to substitution_status PENDING (hop 1); each
          order entering PENDING pushes its SCHEDULED releases to ON_HOLD (hop 2).
          Different triggering transition than instance 1 (discontinue vs amend).
        test_recipe:
          setup:
            - "Products P1 (COATED, 6000 rpm) and P2 (COATED, 6500 rpm, replacement); contract ACTIVE with lines for both (P1 9000c, P2 9500c, escalation 0); blanket order for P1 committed 50 OPEN; release qty 5 SCHEDULED; lot of P1 qty 20 AVAILABLE"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "AB-OLD", name: "Abrasive Old", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "AB-NEW", name: "Abrasive New", product_form: "COATED", max_operating_speed_rpm: 6500 }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-7", contract_number: "C-1005", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p1_id}", base_unit_price_cents: 9000 }, { product_id: "${p2_id}", base_unit_price_cents: 9500 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p1_id}", committed_qty: 50 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 5, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${p1_id}", lot_code: "L-DISC", manufacture_date: "2026-06-01", qty_received: 20 }
              as: AccountManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /api/products/${p1_id}/discontinue"
              payload: { replacement_product_id: "${p2_id}" }
              as: ProgramAdmin
              captures: { p1_status: $.data.status }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: ProgramAdmin
              captures: { bo_sub: $.data.substitution_status }
            - call: "GET /api/releases/${rel_id}"
              as: ProgramAdmin
              captures: { rel_status: $.data.status }
            - call: "GET /api/lots/${lot_id}"
              as: ProgramAdmin
              captures: { lot_status: $.data.status }
          assert:
            - "Product.${p1_id}.status == DISCONTINUED with replacement_product_id == Product.${p2_id}.id"
            - "Hop 1: BlanketOrder.${bo_id}.substitution_status == PENDING (order itself still OPEN)"
            - "Hop 2: Release.${rel_id}.status == ON_HOLD (mutated because its order entered PENDING, not directly by the discontinue call)"
            - "Fan-out: InventoryLot.${lot_id}.status == BLOCKED (remaining stock quarantined)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: usage_create_state_beats_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_MACHINE_NOT_ACTIVE]
          - errors[ERR_SPEED_RATING_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_safety: the machine is QUARANTINED AND the
          product's 4000 rpm rating is below the 5000 rpm spindle — both fail, and the
          state error ERR_MACHINE_NOT_ACTIVE (priority 6) must win over the safety
          error ERR_SPEED_RATING_EXCEEDED (priority 7).
        test_recipe:
          setup:
            - "COATED product max_operating_speed_rpm 4000; machine spindle_max_rpm 5000, guard FIXED, QUARANTINED; AVAILABLE lot of the product qty 100"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-SLOW", name: "Low-rated Disc", product_form: "COATED", max_operating_speed_rpm: 4000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-8", asset_tag: "GR-77", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/machines/${m_id}/quarantine"
              as: EHSOfficer
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-SLOW", manufacture_date: "2026-06-01", qty_received: 100 }
              as: AccountManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 10, parts_produced: 100 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_MACHINE_NOT_ACTIVE (state, priority 6) — NOT ERR_SPEED_RATING_EXCEEDED (safety, priority 7), even though both conditions hold"
            - "No UsageRecord is created; lot qty_on_hand stays 100"

      - name: release_create_temporal_beats_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_RELEASE_WINDOW_OUTSIDE_TERM]
          - errors[ERR_RELEASE_EXCEEDS_REMAINING]
        distinguishing_aspect: |
          Category pair business_temporal vs business_fiscal (different pair than
          instance 1): the release's scheduled_ship_date 2028-01-10 is outside the
          contract term ending 2027-12-31 AND qty 60 exceeds remaining 50 — the
          temporal error must win over the fiscal error.
        test_recipe:
          setup:
            - "COATED product; contract ACTIVE term 2026-01-01..2027-12-31; blanket order committed 50 OPEN (remaining 50)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-TF", name: "Coated Belt TF", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-9", contract_number: "C-1006", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 50 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
          trigger:
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 60, scheduled_ship_date: "2028-01-10", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_RELEASE_WINDOW_OUTSIDE_TERM (temporal, priority 9) — NOT ERR_RELEASE_EXCEEDS_REMAINING (fiscal, priority 10), even though both conditions hold"
            - "BlanketOrder.${bo_id}.remaining_qty == 50 (unchanged)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: release_qty_exactly_remaining_boundary
        grounds:
          - calculations.blanket_remaining_qty
          - validations[priority=10]
          - errors[ERR_RELEASE_EXCEEDS_REMAINING]
        distinguishing_aspect: |
          Metric: unit quantity on POST /api/blanket-orders/{orderId}/releases.
          qty == remaining_qty is ALLOWED (inclusive upper bound, drives remaining to
          exactly 0 without auto-closing while releases stay open); remaining + 1 is
          rejected.
        test_recipe:
          setup:
            - "COATED product; contract ACTIVE; blanket order committed 50 OPEN (remaining 50)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-BND", name: "Coated Belt Bnd", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-10", contract_number: "C-1007", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 50 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v2: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 30, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v2}" }
              as: AccountManager
              captures: { r1_id: $.data.id }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { bo_v3: $.data.version, rem_mid: $.data.remaining_qty }
          trigger:
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 20, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v3}" }
              as: AccountManager
              captures: { r2_id: $.data.id }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { bo_v4: $.data.version, rem_end: $.data.remaining_qty, bo_status: $.data.status }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 1, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v4}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "After R1 qty 30: remaining_qty == 20"
            - "R2 qty 20 (== remaining) succeeds: remaining_qty == 0 exactly"
            - "BlanketOrder stays OPEN at remaining 0 while R1/R2 are SCHEDULED (auto-close requires no open releases)"
            - "R3 qty 1 (== remaining + 1) fails with ERR_RELEASE_EXCEEDS_REMAINING"

      - name: hazard_month_mass_exactly_1000_boundary
        grounds:
          - calculations.hazard_month_mass
          - validations[priority=7]
          - errors[ERR_REGULATOR_REPORT_REQUIRED]
        distinguishing_aspect: |
          Metric: hazardous waste mass in kg on POST /api/disposal-records (different
          metric and endpoint than instance 1). Calendar-month total reaching EXACTLY
          1000.00 kg triggers the inclusive >= threshold: the record that lands the
          total on the boundary requires regulator_report_ref.
        test_recipe:
          setup:
            - "Product with used_media_hazard_class METAL_SWARF; customer_ref PLANT-HZ; two disposal records in the same calendar month (2026-08): 600.00 kg then 400.00 kg"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "GW-HZ", name: "Grinding Wheel HZ", product_form: "BONDED", max_operating_speed_rpm: 6000, shelf_life_months: 36, used_media_hazard_class: "METAL_SWARF" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /api/disposal-records"
              payload: { customer_ref: "PLANT-HZ", product_id: "${p_id}", qty_disposed: 10, gross_weight_kg: 600.00, disposal_method: "HAZARDOUS_WASTE_FACILITY", manifest_number: "MF-1", certified_facility_ref: "FAC-1", disposed_at: "2026-08-05" }
              as: EHSOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /api/disposal-records"
              payload: { customer_ref: "PLANT-HZ", product_id: "${p_id}", qty_disposed: 10, gross_weight_kg: 400.00, disposal_method: "HAZARDOUS_WASTE_FACILITY", manifest_number: "MF-2", certified_facility_ref: "FAC-1", disposed_at: "2026-08-06" }
              as: EHSOfficer
              captures: { err: $.data.error_id }
            - call: "POST /api/disposal-records"
              payload: { customer_ref: "PLANT-HZ", product_id: "${p_id}", qty_disposed: 10, gross_weight_kg: 400.00, disposal_method: "HAZARDOUS_WASTE_FACILITY", manifest_number: "MF-2", certified_facility_ref: "FAC-1", regulator_report_ref: "RR-9", disposed_at: "2026-08-06" }
              as: EHSOfficer
              captures: { d3_id: $.data.id }
          assert:
            - "First record (month total 600.00 kg < 1000.00) succeeds without regulator_report_ref"
            - "Second record bringing the month total to EXACTLY 1000.00 kg fails with ERR_REGULATOR_REPORT_REQUIRED (inclusive >=)"
            - "Same payload with regulator_report_ref RR-9 succeeds (201)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: usage_record_gated_by_machine_status
        grounds:
          - state_machines.MachineAsset
          - validations[priority=6]
          - errors[ERR_MACHINE_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair UsageRecord -> MachineAsset: usage recording is permitted only
          while the machine is ACTIVE; quarantining blocks it and reinstating
          re-enables it (both directions exercised).
        test_recipe:
          setup:
            - "COATED product rpm 6000; machine spindle 5000 guard FIXED; ACTIVE standard 0.0250 [2026-01-01, open); lot qty 100"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-G1", name: "Coated Belt G1", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-11", asset_tag: "GR-11", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "DEBURR", standard_qty_per_part: 0.0250, effective_from: "2026-01-01" }
              as: AccountManager
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-G1", manufacture_date: "2026-06-01", qty_received: 100 }
              as: AccountManager
              captures: { lot_id: $.data.id }
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 10, parts_produced: 500 }
              as: AccountManager
              captures: { ur_ok: $.data.id }
            - call: "POST /api/machines/${m_id}/quarantine"
              as: EHSOfficer
          trigger:
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 10, parts_produced: 500 }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "POST /api/machines/${m_id}/reinstate"
              as: EHSOfficer
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 5, parts_produced: 250 }
              as: AccountManager
              captures: { ur_ok2: $.data.id }
          assert:
            - "Usage while machine ACTIVE succeeds (UsageRecord.${ur_ok} created)"
            - "Usage while machine QUARANTINED fails with ERR_MACHINE_NOT_ACTIVE"
            - "Usage after reinstate succeeds again (UsageRecord.${ur_ok2} created)"

      - name: release_ship_gated_by_contract_status
        grounds:
          - state_machines.Release.PICKED_to_SHIPPED
          - state_machines.Contract.ACTIVE_to_EXPIRED
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Release -> Contract (different pair than instance 1): a PICKED
          release cannot ship once its governing contract has swept to EXPIRED past
          term_end; the release itself is in a valid ship-from state, so the failure
          is attributable solely to the contract's state.
        test_recipe:
          setup:
            - "COATED product; contract ACTIVE term ends 2027-12-31; blanket order committed 10 OPEN; release qty 4 scheduled 2027-06-01, PICKED from a lot of 10; clock then advanced to 2028-01-01 which sweeps the contract to EXPIRED"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-G2", name: "Coated Belt G2", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-12", contract_number: "C-1008", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 10 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 4, scheduled_ship_date: "2027-06-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-G2", manufacture_date: "2026-06-01", qty_received: 10 }
              as: AccountManager
            - call: "POST /api/releases/${rel_id}/pick"
              as: AccountManager
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { swept_contracts: $.data.contracts_expired }
          trigger:
            - call: "POST /api/releases/${rel_id}/ship"
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "GET /api/releases/${rel_id}"
              as: AccountManager
              captures: { rel_status: $.data.status }
            - call: "GET /api/contracts/${c_id}"
              as: AccountManager
              captures: { c_status: $.data.status }
          assert:
            - "Clock sweep: contracts_expired == 1 (term_end 2027-12-31 < 2028-01-01)"
            - "Ship fails with ERR_CONTRACT_NOT_ACTIVE even though the release is PICKED (valid source state)"
            - "Release.${rel_id} remains PICKED; Contract.${c_id}.status == EXPIRED"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: standard_window_half_open_overlap_rule
        grounds:
          - validations[priority=8]
          - errors[ERR_STANDARD_WINDOW_OVERLAP]
          - entities.UsageStandard.fields.effective_to
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [effective_from, effective_to) on the
          (machine_id, product_id) operation key — adjacency (new.from == old.to) is
          ALLOWED, any positive overlap rejected.
        test_recipe:
          setup:
            - "Machine and COATED product exist; ACTIVE standard S1 window [2026-01-01, 2026-07-01)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-SW", name: "Coated Belt SW", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-13", asset_tag: "GR-13", machine_type: "BENCH_GRINDER", spindle_max_rpm: 4000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "S1", standard_qty_per_part: 0.0100, effective_from: "2026-01-01", effective_to: "2026-07-01" }
              as: AccountManager
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "S2", standard_qty_per_part: 0.0120, effective_from: "2026-07-01" }
              as: AccountManager
              captures: { s2_id: $.data.id }
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "S3", standard_qty_per_part: 0.0110, effective_from: "2026-06-30", effective_to: "2026-12-01" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "S2 [2026-07-01, open) succeeds — adjacency to S1's exclusive end 2026-07-01 is allowed under half-open semantics"
            - "S3 [2026-06-30, 2026-12-01) fails with ERR_STANDARD_WINDOW_OVERLAP (overlaps S1 by one day: 2026-06-30 < 2026-07-01)"

      - name: trial_window_buffer_conflict_rule
        grounds:
          - validations[priority=8]
          - errors[ERR_TRIAL_WINDOW_CONFLICT]
          - entities.TrialCase.fields.scheduled_start
        distinguishing_aspect: |
          Interval semantics: CLOSED intervals on a MachineAsset with a mandatory
          1-calendar-day buffer between trials — adjacency with a zero-day gap is
          REJECTED (unlike instance 1 where adjacency is allowed), and a one-day gap
          is accepted.
        test_recipe:
          setup:
            - "Machine ACTIVE spindle 5000 FIXED guard; COATED trial product rpm 6000; trial T1 occupies [2026-03-10, 2026-03-12] (status ACTIVE)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-TW", name: "Trial Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-14", asset_tag: "GR-14", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/trials"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", scheduled_start: "2026-03-10", scheduled_end: "2026-03-12" }
              as: AccountManager
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /api/trials"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", scheduled_start: "2026-03-14", scheduled_end: "2026-03-15" }
              as: AccountManager
              captures: { t2_id: $.data.id }
            - call: "POST /api/trials"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", scheduled_start: "2026-03-13", scheduled_end: "2026-03-14" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "T2 [2026-03-14, 2026-03-15] succeeds — exactly one buffer day (2026-03-13) after T1's closed end 2026-03-12"
            - "T3 [2026-03-13, 2026-03-14] fails with ERR_TRIAL_WINDOW_CONFLICT — zero-day gap after T1 (and before T2) violates the 1-day buffer"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: blanket_order_units_conserved_on_cancel
        grounds:
          - calculations.blanket_remaining_qty
          - state_machines.Release.SCHEDULED_to_CANCELLED
          - entities.BlanketOrder.fields.remaining_qty
        distinguishing_aspect: |
          Conserved quantity: committed order units. Invariant committed_qty ==
          remaining_qty + sum(qty over releases in SCHEDULED|ON_HOLD|PICKED|SHIPPED)
          holds after every forward (create) and compensating (cancel) action.
        test_recipe:
          setup:
            - "COATED product; contract ACTIVE; blanket order committed 100 OPEN"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-INV1", name: "Coated Belt Inv1", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-15", contract_number: "C-1009", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 100 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v2: $.data.version, rem0: $.data.remaining_qty }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 40, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v2}" }
              as: AccountManager
              captures: { r1_id: $.data.id }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { bo_v3: $.data.version, rem1: $.data.remaining_qty }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 25, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v3}" }
              as: AccountManager
              captures: { r2_id: $.data.id }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { rem2: $.data.remaining_qty }
          trigger:
            - call: "POST /api/releases/${r1_id}/cancel"
              as: AccountManager
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { rem3: $.data.remaining_qty, bo_status: $.data.status }
          assert:
            - "remaining progression: 100 (confirm) -> 60 (after R1 qty 40) -> 35 (after R2 qty 25) -> 85 (after cancel R1)"
            - "Invariant holds at every step: committed 100 == remaining + active-release sum (100=100+0; 60+40=100; 35+40+25=100; 85+25=100)"
            - "BlanketOrder.${bo_id}.status == OPEN (cancel restored remaining above 0)"

      - name: lot_stock_conserved_on_pick_cancel
        grounds:
          - calculations.fefo_allocation
          - state_machines.Release.PICKED_to_CANCELLED
          - entities.InventoryLot.fields.qty_on_hand
        distinguishing_aspect: |
          Conserved quantity: physical stock units (different conserved quantity than
          instance 1's order-commitment units). Per product: sum(lot.qty_on_hand) +
          sum(qty outstanding on PICKED releases) + sum(qty on SHIPPED releases) ==
          sum(lot.qty_received) - sum(consumed). Pick then cancel returns the system
          to the pre-pick stock position exactly.
        test_recipe:
          setup:
            - "COATED product; contract ACTIVE; blanket order committed 10 OPEN; single lot L qty_received 10; release qty 6"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CB-INV2", name: "Coated Belt Inv2", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-16", contract_number: "C-1010", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 10 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-INV2", manufacture_date: "2026-06-01", qty_received: 10 }
              as: AccountManager
              captures: { lot_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 6, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
            - call: "POST /api/releases/${rel_id}/pick"
              as: AccountManager
              captures: { alloc: $.data.allocations }
            - call: "GET /api/lots/${lot_id}"
              as: AccountManager
              captures: { qoh_mid: $.data.qty_on_hand }
          trigger:
            - call: "POST /api/releases/${rel_id}/cancel"
              as: AccountManager
              captures: { rel_status: $.data.status, rel_alloc: $.data.allocations }
            - call: "GET /api/lots/${lot_id}"
              as: AccountManager
              captures: { qoh_end: $.data.qty_on_hand, lot_status: $.data.status }
          assert:
            - "After pick: InventoryLot.${lot_id}.qty_on_hand == 4 and Release.allocations == [{lot_id: ${lot_id}, qty: 6}] — stock identity 4 + 6 == 10 holds mid-flight"
            - "After cancel: InventoryLot.${lot_id}.qty_on_hand == 10 (restored to the SAME lot), status AVAILABLE, Release.allocations == []"
            - "Invariant restored exactly: sum(qty_on_hand) 10 + PICKED-outstanding 0 + SHIPPED 0 == qty_received 10 - consumed 0"
