              payload: { admitted_carrier_name: "Trinity Mutual Casualty", state_code: "TX", reason_code: "UNDERWRITING", declined_on: "2026-05-02T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
          trigger:
            - call: "POST /placements/${p_on_id}/complete-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
            - call: "POST /placements/${p_off_id}/complete-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id_off: $.data.error_id }
            - call: "POST /placements/${p_mix_id}/complete-search"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id_mix: $.data.error_id }
          assert:
            - "Placement.${p_on_id}.status == SEARCH_COMPLETE and declination_count == 3"
            - "the OFF request returns 422 and error_id_off == ERR_DILIGENT_SEARCH_INSUFFICIENT"
            - "Placement.${p_off_id}.status is still SEARCH_IN_PROGRESS and declination_count == 0"
            - "the MIX request returns 422 and error_id_mix == ERR_DILIGENT_SEARCH_INSUFFICIENT"
            - "Placement.${p_mix_id}.status is still SEARCH_IN_PROGRESS"

      - name: alien_carrier_trust_fund_minimum_is_inclusive_at_the_threshold
        grounds:
          - calculations.market_security_score
          - calculations.market_security_score.constants.ALIEN_TRUST_MIN_CENTS
          - entities.Carrier.fields.trust_fund_cents
          - state_machines.MarketSecurityReview.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          A third boundary on a third endpoint — POST
          /market-security-reviews/{id}/start — and on a scoring metric rather than a
          date or a premium. The alien trust-fund test is `>=`: a trust fund of
          exactly 540000000 earns the full 15 points and lifts the score to 80
          (APPROVE band), while 539999999 earns 0 and leaves it at 65 (CONDITION
          band). One cent moves the carrier across a decision band, so an implementer
          using `>` cannot approve the carrier at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two ALIEN-domiciled carriers, both am_best_rating A, capital_surplus_cents 1500000000 and naic_quarterly_listing true; one with trust_fund_cents exactly 540000000, the other with 539999999."
            - "A DRAFT review on each."
          setup_api_calls:
            - *c_clock
            - call: "POST /carriers"
              payload: { naic_number: "44444", legal_name: "Kestrel Alien Underwriters Ltd", domicile_type: "ALIEN", capital_surplus_cents: 1500000000, am_best_rating: "A", trust_fund_cents: 540000000, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { kestrel_id: $.data.id, kestrel_v0: $.data.version }
            - call: "POST /carriers"
              payload: { naic_number: "55555", legal_name: "Kittiwake Alien Underwriters Ltd", domicile_type: "ALIEN", capital_surplus_cents: 1500000000, am_best_rating: "A", trust_fund_cents: 539999999, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { kittiwake_id: $.data.id, kittiwake_v0: $.data.version }
            - call: "POST /carriers/${kestrel_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { kestrel_review_id: $.data.id }
            - call: "POST /carriers/${kittiwake_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { kittiwake_review_id: $.data.id }
          trigger:
            - call: "POST /market-security-reviews/${kestrel_review_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - call: "POST /market-security-reviews/${kittiwake_review_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
          assert:
            - "MarketSecurityReview.${kestrel_review_id}.score == 80"
            - "MarketSecurityReview.${kittiwake_review_id}.score == 65"
            - "MarketSecurityReview.${kestrel_review_id}.score != 65"
            - "POST /market-security-reviews/${kestrel_review_id}/decide with decision APPROVE and expected_carrier_version ${kestrel_v0} succeeds; Carrier.${kestrel_id}.security_status == APPROVED"
            - "POST /market-security-reviews/${kittiwake_review_id}/decide with decision APPROVE and expected_carrier_version ${kittiwake_v0} returns 422 ERR_DECISION_SCORE_MISMATCH"
            - "POST /market-security-reviews/${kittiwake_review_id}/decide with decision CONDITION, expected_carrier_version ${kittiwake_v0} and a non-empty conditions_note succeeds; Carrier.${kittiwake_id}.security_status == CONDITIONAL"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: policy_issuance_depends_on_the_carriers_security_status
        grounds:
          - validations.priority_12_business_referential
          - entities.Carrier.fields.security_status
          - errors.ERR_CARRIER_NOT_SECURITY_APPROVED
          - state_machines.MarketSecurityReview.UNDER_REVIEW_to_DECLINED
          - state_machines.MarketSecurityReview.UNDER_REVIEW_to_CONDITIONAL
        distinguishing_aspect: |
          The Policy → Carrier pair. Whether POST /policies is legal is decided by a
          field on a different aggregate that the request never mentions in a state
          role: Carrier.security_status. The gate is not binary — DECLINED blocks,
          but CONDITIONAL is explicitly acceptable alongside APPROVED, so an
          implementer who checks `security_status == "APPROVED"` rejects a perfectly
          bindable conditional market.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; brokerage with an ACTIVE TX SURPLUS_LINES license; StateProgram TX, NV and CA."
            - "Carrier Meridian reviewed and DECLINED (score 45); its TX white-list row was stripped by the decline cascade."
            - "Carrier Trident (ALIEN, capital_surplus_cents 2000000000, am_best_rating A, trust_fund_cents 539999999, listing true) reviewed and CONDITIONAL (score 65), then WHITE_LISTED in TX."
            - "One placement owned by the broker, at SEARCH_COMPLETE with three valid TX declinations."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - *c_lic_tx
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - call: "POST /carriers"
              payload: { naic_number: "22222", legal_name: "Meridian Surplus Indemnity Company", domicile_type: "US_STATE", capital_surplus_cents: 1600000000, am_best_rating: "NR", trust_fund_cents: 0, naic_quarterly_listing: false }
              as: PlatformAdmin
              captures: { meridian_id: $.data.id, meridian_v0: $.data.version }
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${meridian_id}", state_program_id: "${tx_program_id}", listed_on: "2026-01-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-tx"
            - call: "POST /carriers/${meridian_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { meridian_review_id: $.data.id }
            - call: "POST /market-security-reviews/${meridian_review_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - call: "POST /market-security-reviews/${meridian_review_id}/decide"
              payload: { decision: "DECLINE", expected_carrier_version: "${meridian_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - call: "POST /carriers"
              payload: { naic_number: "33333", legal_name: "Trident Alien Reinsurance Ltd", domicile_type: "ALIEN", capital_surplus_cents: 2000000000, am_best_rating: "A", trust_fund_cents: 539999999, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { trident_id: $.data.id, trident_v0: $.data.version }
            - call: "POST /carriers/${trident_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { trident_review_id: $.data.id }
            - call: "POST /market-security-reviews/${trident_review_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - call: "POST /market-security-reviews/${trident_review_id}/decide"
              payload: { decision: "CONDITION", expected_carrier_version: "${trident_v0}", conditions_note: "Bind only with quarterly trust-fund attestation." }
              as: ComplianceOfficer
              as_user_id: "co-anders"
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${trident_id}", state_program_id: "${tx_program_id}", listed_on: "2026-01-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-tx"
            - *c_placement
            - *c_begin_search
            - *c_decl_1
            - *c_decl_2
            - *c_decl_3
            - *c_complete_search
          trigger:
            - call: "POST /policies"
              payload: { placement_id: "${placement_id}", carrier_id: "${meridian_id}", policy_number: "SL-2026-0010", effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-08-01T00:00:00Z", original_gross_premium_cents: 1000000, policy_fee_cents: 25000, broker_fee_cents: 50000, min_earned_premium_pct: 0.25, expected_placement_version: "${placement_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "Carrier.${meridian_id}.security_status == DECLINED and Carrier.${trident_id}.security_status == CONDITIONAL"
            - "the response status is 409 and error_id == ERR_CARRIER_NOT_SECURITY_APPROVED"
            - "Placement.${placement_id}.status is still SEARCH_COMPLETE and its version is unchanged"
            - "contrast — the same POST /policies against carrier ${trident_id} succeeds with 201, because CONDITIONAL is an acceptable security posture"
            - "the issued policy has home_state TX, allocation_method_applied ALLOCATED_MULTI, status ISSUED and stamping_status PENDING"

      - name: batch_submission_depends_on_the_brokers_license_status
        grounds:
          - validations.priority_11_business_referential
          - entities.BrokerLicense.fields.status
          - errors.ERR_BROKER_LICENSE_NOT_ACTIVE
          - state_machines.FilingBatch.PREPARED_to_SUBMITTED
          - calculations.filing_batch_totals_and_penalty
        distinguishing_aspect: |
          A different entity pair — FilingBatch → BrokerLicense — and a dependency on
          a field that is never stored: BrokerLicense.status is recomputed from the
          logical clock on every read, so the same license that authorised issuance
          on 2026-08-01 blocks the filing on 2026-10-01 without any write having
          touched it. Advancing the clock also makes the batch late, so the recipe
          simultaneously pins the penalty floor: 10% of 16571 is 1657, below the
          2500-cent minimum, so penalty_cents is 2500.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home setup except that the broker's TX SURPLUS_LINES license has expires_on 2026-09-01T00:00:00Z."
            - "One policy issued and tax CALCULATED while the license is ACTIVE, producing three OPEN NEW_BUSINESS lines with period_key 2026-08."
            - "The clock is then advanced to 2026-10-01T00:00:00Z, after which the license status computes to LAPSED and the 2026-08 TX filing is past its 2026-09-30T23:59:59.999Z due date."
            - "A FilingBatch on the TX program for that broker with period_key 2026-08, prepared at the advanced clock."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - call: "POST /brokers/${broker_id}/licenses"
              payload: { state_code: "TX", license_number: "SL-TX-1001", license_type: "SURPLUS_LINES", expires_on: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { license_id: $.data.id }
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - *c_carrier
            - *c_review_new
            - *c_review_start
            - *c_review_approve
            - *c_elig_tx
            - *c_placement
            - *c_begin_search
            - *c_decl_1
            - *c_decl_2
            - *c_decl_3
            - *c_complete_search
            - *c_policy
            - *c_calc_tax
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: Any
            - *c_batch_tx
            - *c_batch_prepare
          trigger:
            - *c_batch_submit
          assert:
            - "GET /brokers/${broker_id}/licenses?license_type=SURPLUS_LINES&state_code=TX shows BrokerLicense.${license_id}.status == LAPSED at the advanced clock"
            - "FilingBatch.${batch_id}.line_count == 1, total_tax_cents == 16571, total_stamping_fee_cents == 512"
            - "FilingBatch.${batch_id}.due_date == 2026-09-30T23:59:59.999Z and late == true"
            - "FilingBatch.${batch_id}.penalty_cents == 2500 (the 2500-cent floor beats 10% of 16571, which is 1657)"
            - "FilingBatch.${batch_id}.total_due_cents == 19583"
            - "the submit response status is 409 and error_id == ERR_BROKER_LICENSE_NOT_ACTIVE"
            - "FilingBatch.${batch_id}.status is still PREPARED and its swept line is still BATCHED"
            - "contrast — after POST /brokers/${broker_id}/licenses adds a TX SURPLUS_LINES license with expires_on 2027-12-31T00:00:00Z, the identical submit succeeds: FilingBatch status SUBMITTED, the swept line status FILED, and Policy.${policy_id}.tax_status == FILED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: policy_terms_on_one_placement_are_half_open_so_adjacency_is_legal
        grounds:
          - validations.priority_14_business_safety
          - errors.ERR_POLICY_TERM_OVERLAP
          - entities.Policy.fields.effective_date
          - entities.Policy.fields.expiration_date
          - state_machines.Placement.SEARCH_COMPLETE_to_BOUND
        distinguishing_aspect: |
          The resource is the Placement, and the interval semantics are HALF-OPEN:
          [effective_date, expiration_date). A second policy starting 2027-07-01,
          one month before the first term ends, is rejected; a second policy starting
          exactly at 2027-08-01 — the instant the first term expires — is accepted,
          because the first term does not include its own endpoint. An implementer
          who models the term as a closed interval rejects the legal renewal.
        test_recipe:
          setup:
            - "The base TX-home setup with one policy already issued for the term 2026-08-01T00:00:00Z to 2027-08-01T00:00:00Z; the placement is therefore BOUND but still bindable."
            - "The placement's current version is re-read after the first issuance so the OCC field is fresh."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - *c_lic_tx
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - *c_carrier
            - *c_review_new
            - *c_review_start
            - *c_review_approve
            - *c_elig_tx
            - *c_placement
            - *c_begin_search
            - *c_decl_1
            - *c_decl_2
            - *c_decl_3
            - *c_complete_search
            - *c_policy
            - call: "GET /placements/${placement_id}"
              payload: {}
              as: Any
              as_user_id: "${broker_id}"
              captures: { placement_v2: $.data.version }
          trigger:
            - call: "POST /policies"
              payload: { placement_id: "${placement_id}", carrier_id: "${carrier_id}", policy_number: "SL-2026-0001-OVERLAP", effective_date: "2027-07-01T00:00:00Z", expiration_date: "2028-06-30T00:00:00Z", original_gross_premium_cents: 900000, policy_fee_cents: 0, broker_fee_cents: 0, min_earned_premium_pct: 0.25, expected_placement_version: "${placement_v2}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "Placement.${placement_id}.status == BOUND after the first issuance"
            - "the overlapping request returns 409 and error_id == ERR_POLICY_TERM_OVERLAP"
            - "GET /policies?placement_id=${placement_id} still returns exactly 1 row"
            - "Placement.${placement_id}.version is unchanged by the rejected request, so ${placement_v2} is still current"
            - "contrast — POST /policies with effective_date 2027-08-01T00:00:00Z, expiration_date 2028-07-31T00:00:00Z and expected_placement_version ${placement_v2} succeeds with 201 because adjacency is not overlap"
            - "after the adjacent issuance, GET /policies?placement_id=${placement_id} returns 2 rows and Placement.${placement_id}.status is still BOUND"

      - name: eligibility_windows_are_closed_intervals_with_a_thirty_day_cooling_off_buffer
        grounds:
          - validations.priority_14_business_safety
          - errors.ERR_ELIGIBILITY_WINDOW_CONFLICT
          - entities.CarrierEligibility.fields.listed_on
          - entities.CarrierEligibility.fields.removed_on
          - state_machines.CarrierEligibility.WHITE_LISTED_to_REMOVED
        distinguishing_aspect: |
          A different resource — the Carrier × StateProgram pair — under different
          interval arithmetic. Here the window is a CLOSED interval and it is
          followed by a 30-day cooling-off buffer, so unlike the half-open policy
          term, touching the endpoint is a collision: a window removed on 2026-06-01
          blocks a relisting on 2026-07-01 (exactly 30 days later, inside the buffer)
          and permits one on 2026-07-02. An open-ended window (removed_on null)
          swallows every later listed_on date.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "StateProgram TX exists; carrier Atlas is APPROVED."
            - "Atlas held a TX white-list window opened 2026-01-01 and struck with removed_on 2026-06-01, so it is REMOVED."
          setup_api_calls:
            - *c_clock
            - *c_prog_tx
            - *c_carrier
            - *c_review_new
            - *c_review_start
            - *c_review_approve
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${carrier_id}", state_program_id: "${tx_program_id}", listed_on: "2026-01-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-tx"
              captures: { elig_first_id: $.data.id }
            - call: "POST /carrier-eligibilities/${elig_first_id}/remove"
              payload: { removed_on: "2026-06-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-tx"
          trigger:
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${carrier_id}", state_program_id: "${tx_program_id}", listed_on: "2026-07-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-tx"
              captures: { error_id_buffer: $.data.error_id }
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${carrier_id}", state_program_id: "${tx_program_id}", listed_on: "2026-05-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-tx"
              captures: { error_id_inside: $.data.error_id }
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${carrier_id}", state_program_id: "${tx_program_id}", listed_on: "2026-07-02T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-tx"
              captures: { elig_second_id: $.data.id }
            - call: "POST /carrier-eligibilities"
              payload: { carrier_id: "${carrier_id}", state_program_id: "${tx_program_id}", listed_on: "2026-09-01T00:00:00Z" }
              as: StateRegulator
              as_user_id: "sr-tx"
              captures: { error_id_openended: $.data.error_id }
          assert:
            - "CarrierEligibility.${elig_first_id}.listing_status == REMOVED with removed_on == 2026-06-01T00:00:00Z"
            - "the 2026-07-01 relisting returns 409 and error_id_buffer == ERR_ELIGIBILITY_WINDOW_CONFLICT — exactly 30 days after removal is still inside the buffer"
            - "the 2026-05-01 relisting returns 409 and error_id_inside == ERR_ELIGIBILITY_WINDOW_CONFLICT — it falls inside the closed window 2026-01-01 to 2026-06-01"
            - "the 2026-07-02 relisting succeeds with 201: CarrierEligibility.${elig_second_id}.listing_status == WHITE_LISTED and removed_on is null"
            - "the 2026-09-01 relisting returns 409 and error_id_openended == ERR_ELIGIBILITY_WINDOW_CONFLICT — the open-ended second window has no end to sit after"
            - "GET /carrier-eligibilities?carrier_id=${carrier_id}&state_program_id=${tx_program_id} returns exactly 2 rows"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: tax_filing_line_ledger_always_reconciles_with_the_policy_tax_total
        grounds:
          - state_machines.Endorsement.DRAFT_to_ISSUED
          - state_machines.Endorsement.ISSUED_to_VOIDED
          - entities.TaxFilingLine.fields.tax_cents
          - entities.Policy.fields.total_tax_cents
          - complexity_layers.derived_field_reconciliation
        distinguishing_aspect: |
          The invariant is a ledger identity: at every observable moment,
          Policy.total_tax_cents equals the sum of tax_cents over that policy's
          TaxFilingLine rows whose status is not VOIDED. Voiding an issued
          endorsement must restore the identity by emitting the exact negation of
          the original per-state deltas rather than by deleting or editing the
          original lines — so the ledger grows from 3 rows to 6 to 9 while the total
          returns to precisely 38779, with no one-cent drift from the three-way
          largest-remainder split.
        test_recipe:
          setup:
            - "The base TX-home setup with tax CALCULATED: total_tax_cents 38779, total_stamping_fee_cents 1127, and three OPEN NEW_BUSINESS lines with tax_cents 10250 / 11958 / 16571 for CA / NV / TX."
            - "One DRAFT endorsement of endorsement_type PREMIUM_INCREASE with premium_delta_cents 200000."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - *c_lic_tx
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - *c_carrier
            - *c_review_new
            - *c_review_start
            - *c_review_approve
            - *c_elig_tx
            - *c_placement
            - *c_begin_search
            - *c_decl_1
            - *c_decl_2
            - *c_decl_3
            - *c_complete_search
            - *c_policy
            - *c_calc_tax
            - *c_get_policy_v
            - *c_endorsement_plus
            - *c_endorsement_issue
          trigger:
            - call: "POST /endorsements/${endorsement_id}/void"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
          assert:
            - "before the endorsement was issued: Policy.${policy_id}.total_tax_cents == 38779 and the sum of tax_cents over the 3 non-VOIDED lines of ${policy_id} == 38779"
            - "after the endorsement was issued: Policy.${policy_id}.total_tax_cents == 46346 and the sum of tax_cents over the 6 non-VOIDED lines of ${policy_id} == 46346"
            - "Endorsement.${endorsement_id}.status == VOIDED after the trigger"
            - "after the void: GET /tax-filing-lines?policy_id=${policy_id} returns 9 rows — the original 3 NEW_BUSINESS lines are untouched, the 3 ENDORSEMENT lines are untouched, and 3 compensating ENDORSEMENT lines carry tax_cents -2000 / -2334 / -3233 and stamping_fee_cents -120 / 0 / -100 for CA / NV / TX"
            - "after the void: Policy.${policy_id}.total_tax_cents == 38779 and total_stamping_fee_cents == 1127 — exactly the pre-endorsement values, with no drift"
            - "after the void: the sum of tax_cents over all non-VOIDED lines of ${policy_id} == 38779, and the sum of stamping_fee_cents == 1127"
            - "after the void: GET /policies/${policy_id}/allocations returns 3 rows with allocated_premium_cents 341667 / 341667 / 341666 for CA / NV / TX, exactly the pre-endorsement split"
            - "Policy.${policy_id}.tax_status == ADJUSTED"

      - name: state_allocation_parts_always_sum_to_the_amount_being_split
        grounds:
          - calculations.premium_tax_and_stamping_fee
          - calculations.return_premium_and_tax_adjustment
          - entities.PolicyStateAllocation.fields.allocated_premium_cents
          - entities.Policy.fields.taxable_premium_cents
          - entities.Cancellation.fields.return_premium_cents
        distinguishing_aspect: |
          A different invariant from the tax ledger: the conservation of the amount
          being split. Every largest-remainder distribution in this domain must be
          exact even though the three-way split of 1025000, 1225000 and 918750 across
          pinned percentages of 0.3333 (which sum to 0.9999, not 1) is not divisible.
          The invariant is asserted three times over the same policy — at issuance,
          after an endorsement, and over the cancellation refund — so an implementer
          who rounds each share independently, or who forgets to normalise the pinned
          percentages by their own sum, loses or gains cents at one of the three
          checkpoints.
        test_recipe:
          setup:
            - "The base TX-home setup with tax CALCULATED (taxable_premium_cents 1025000 split three ways), a +200000 PREMIUM_INCREASE endorsement already ISSUED (taxable_premium_cents 1225000), and a REQUESTED FLAT cancellation dated 2026-08-01T00:00:00Z, the policy's own effective date."
            - "Policy.min_earned_premium_pct is 0.25, so the minimum earned premium on the endorsed base is 306250."
          setup_api_calls:
            - *c_clock
            - *c_broker
            - *c_lic_tx
            - *c_prog_tx
            - *c_prog_nv
            - *c_prog_ca
            - *c_carrier
            - *c_review_new
            - *c_review_start
            - *c_review_approve
            - *c_elig_tx
            - *c_placement
            - *c_begin_search
            - *c_decl_1
            - *c_decl_2
            - *c_decl_3
            - *c_complete_search
            - *c_policy
            - *c_calc_tax
            - *c_get_policy_v
            - *c_endorsement_plus
            - *c_endorsement_issue
            - call: "POST /policies/${policy_id}/cancellations"
              payload: { cancellation_type: "FLAT", cancellation_date: "2026-08-01T00:00:00Z" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { cancellation_id: $.data.id }
          trigger:
            - call: "POST /cancellations/${cancellation_id}/process"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
          assert:
            - "checkpoint 1 — at issuance the three allocated_premium_cents values 341667 + 341667 + 341666 sum to exactly 1025000, equal to Policy.${policy_id}.taxable_premium_cents at that moment"
            - "checkpoint 2 — after the endorsement the three allocated_premium_cents values 408334 + 408333 + 408333 sum to exactly 1225000, equal to Policy.${policy_id}.taxable_premium_cents"
            - "checkpoint 2 — the allocation row count is still exactly 3; no fourth row and no orphaned row appears"
            - "Cancellation.${cancellation_id}.earned_premium_cents == 306250 and return_premium_cents == 918750, and the two sum to exactly 1225000"
            - "checkpoint 3 — the three CANCELLATION_RETURN filing lines carry taxable_premium_cents -306250 each, summing to exactly -918750"
            - "Cancellation.${cancellation_id}.tax_refund_cents == 24041 and stamping_fee_refund_cents == 551"
            - "the CANCELLATION_RETURN rows carry tax_cents -9188 / 0 / -14853 and stamping_fee_cents -551 / 0 / 0 for CA / NV / TX, in state_code ASC order"
            - "Policy.${policy_id}.status == CANCELLED and tax_status == ADJUSTED"
