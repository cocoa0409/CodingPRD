            - "CatalogVersion.${catB}.review_status == APPROVED_WITH_CONDITIONS and CatalogVersion.${catB}.conditions_note == Publish the refund policy in the printed catalog by 2027-01-31"
            - "Program.${progB}.approval_status == CONDITIONAL and Program.${progB}.approved_catalog_version_id == ${catB}"
            - "Immediately after trigger step 3 CatalogVersion.${catC}.review_status == REJECTED, Program.${progC}.approval_status == DRAFT and Program.${progC}.approved_catalog_version_id == null"
