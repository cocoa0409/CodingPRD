        distinguishing_aspect: |
          Numeric >= boundary on annual_premium_cents at the §1.3 tier ceiling:
          exactly 500000 uses TIER3_MULT 1.10 (>=), while 499999 uses TIER2_MULT
          1.05. Reached through POST /policies/{id}/activate. Different metric/
          endpoint from the renewal-window boundary below.
        test_recipe:
          setup:
