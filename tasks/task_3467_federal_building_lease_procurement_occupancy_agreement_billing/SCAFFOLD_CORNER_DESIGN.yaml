        grounds: ["calculations.headcount_projection", "calculations.security_level_determination", "entities.SpaceRequirement.fields.required_usable_sf"]
        distinguishing_aspect: "validate computes exact literals: 400 headcount growing 2% for 5 years projects to 442; at 150 sf/person plus a 2,000 sf SCIF that is 68,300 required sf; 53 ISC points with a SCIF floor resolves to security level 4."
