  - rule_id: compensating_invariant
    instances:
      - name: custody_conservation_across_supersede_conversion_and_release
        grounds:
          - calculations.plan_account_derived_balances
          - calculations.gross_assigned_amount
          - calculations.per_source_allocation
          - calculations.earnings_adjustment
          - calculations.ap_after_tax_basis_carryover
          - calculations.hold_aggregate_exposure
          - endpoints[POST /draft-orders]
          - endpoints[POST /draft-orders/{id}/qualify]
          - endpoints[POST /segregation-holds/{id}/release]
        distinguishing_aspect: |
          Two quantities must be conserved through the whole custody lifecycle, and every step is a chance
          to break one of them. (i) Money: the participant's vested_balance_cents plus every alternate
          payee balance created from it must always equal the 4300000 the account started with, and the
          drop at conversion is hold_amount_cents PLUS earnings_adjustment_cents (1600000 + 48001), not
          the hold alone — an implementation that transfers only the hold leaves 48001 stranded, and one
          that transfers the AP balance twice over-debits. (ii) After-tax basis: the payee's carried basis
          plus the basis left in the sources must equal the original 60000. Superseding receipts must
          RECOMPUTE the single hold rather than stacking a second one, holds must never debit a money
          source, and a release must restore available_balance_cents to the cent with no drift. The final
          state is checked from both directions: bottom-up from the money-source rows and top-down from
          the account's derived fields.
        test_recipe:
          setup:
            - "A PUBLISHED PERIOD_END plan (max_assignable_pct_bps 5000, max_assignable_amount_cents 2000000, segregation_period_days 548, requires_model_language true)."
            - "One participant, participation_start_date 1999-01-01, benefit_commenced false, with ONE plan account holding four money sources: AFTER_TAX 100000 with basis 60000, EMPLOYER_MATCH 1490125, PRE_TAX_DEFERRAL 2409875, all assignable, plus LOAN_RECEIVABLE 300000 not assignable. So vested_balance_cents 4300000 and assignable_base 4000000."
            - "Snapshots 2026-06-30 at 4000000 (the valuation date) and 2026-12-31 at 4120000 (the first snapshot on or after the segregation date), so the conversion growth is 300 bps."
            - "Case 1 covers [2012-03-01, 2026-02-01); case 2 covers [2000-01-01, 2012-03-01) and is merely adjacent, so both are admissible on the same participant."
