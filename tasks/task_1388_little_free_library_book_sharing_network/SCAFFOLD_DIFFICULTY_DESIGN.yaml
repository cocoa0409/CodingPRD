  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complaint_upheld_delist_recall_chain
        grounds:
          - state_machines.Complaint.UNDER_REVIEW_to_RESOLVED_UPHELD
          - state_machines.LibraryBox.FLAGGED_to_DELISTED
          - state_machines.Allocation.DISPATCHED_to_CANCELLED
          - state_machines.BookItem.DISPATCHED_to_AVAILABLE
          - state_machines.DistributionRun.DISPATCHED_to_COMPLETED
        distinguishing_aspect: |
          Depth-3 cascade from the complaint-resolve trigger: the third upheld complaint
          mutates LibraryBox (upheld_complaints_90d 2 -> 3, posture FLAGGED -> DELISTED);
          the DELISTED transition itself cancels the in-flight DISPATCHED Allocations of the
          box; each Allocation cancellation returns its BookItem to AVAILABLE; the last
          cancellation bubbles the DistributionRun to COMPLETED. Distinct trigger from the
          drive-completion cascade in the sibling instance.
        test_recipe:
          setup:
            - "ACTIVE steward with an ACTIVE LISTED box (capacity 10)"
            - "PUBLIC_DROP batch with 4 graded items, SORTED; run created, confirmed, dispatched: 4 allocations DISPATCHED to the box, 4 items DISPATCHED"
            - "Two complaints already upheld against the box within the 90-day window (posture FLAGGED, upheld_complaints_90d == 2)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
