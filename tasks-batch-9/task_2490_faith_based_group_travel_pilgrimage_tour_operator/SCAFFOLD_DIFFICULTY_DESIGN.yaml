  - rule_id: resource_temporal_overlap
    instances:
      - name: sacred_site_half_open_buffered_minute_overlap
        grounds:
          - validations.priority_63.ERR_SITE_SLOT_CONFLICT
          - entities.ServiceBooking.fields.buffered_end_utc
          - entities.SacredSite.fields.turnaround_buffer_minutes
        distinguishing_aspect: |
          The contended resource is one sacred site's timeline at minute granularity under a
          half-open buffered interval: a 07:15 start collides with a 06:00 + 60 minute service whose
          30 minute turnaround runs to 07:30, while a start at exactly 07:30 is admitted.
        test_recipe:
          setup:
            - "Sacred site Basilica of the Holy Sepulchre, turnaround_buffer_minutes 30, daily_capacity_pax 200, PERMIT_REQUIRED."
            - "Two Holy Land departures in PLANNING so each booking belongs to its own itinerary."
            - "Booking B1 holds 2026-11-02T06:00:00Z for 60 minutes, so its buffered_end_utc is 2026-11-02T07:30:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_1_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_2_id: $.data.id }
            - call: "POST /sacred-sites"
              payload: { name: "Basilica of the Holy Sepulchre", country: "IL", access_regime: "PERMIT_REQUIRED", daily_capacity_pax: 200, turnaround_buffer_minutes: 30, requires_local_clergy: true }
              as: ProgramManager
              captures: { site_id: $.data.id }
            - call: "POST /service-bookings"
              payload: { departure_id: "${dep_1_id}", sacred_site_id: "${site_id}", service_type: "MASS", scheduled_start_utc: "2026-11-02T06:00:00Z", duration_minutes: 60, pax_count: 20, permit_reference: "PRM-2026-501" }
              as: ProgramManager
              captures: { sb_1_id: $.data.id }
          trigger:
            - call: "POST /service-bookings"
              payload: { departure_id: "${dep_2_id}", sacred_site_id: "${site_id}", service_type: "GUIDED_VISIT", scheduled_start_utc: "2026-11-02T07:15:00Z", duration_minutes: 30, pax_count: 20, permit_reference: "PRM-2026-502" }
              as: ProgramManager
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SITE_SLOT_CONFLICT"
            - "ServiceBooking.${sb_1_id}.buffered_end_utc == 2026-11-02T07:30:00Z"
            - "ServiceBooking.${sb_1_id}.status == SITE_HELD"
          non_overlapping_case:
            trigger:
              - call: "POST /service-bookings"
                payload: { departure_id: "${dep_2_id}", sacred_site_id: "${site_id}", service_type: "GUIDED_VISIT", scheduled_start_utc: "2026-11-02T07:30:00Z", duration_minutes: 30, pax_count: 20, permit_reference: "PRM-2026-502" }
                as: ProgramManager
            assert:
              - "response.status == 201"
              - "response.data.status == SITE_HELD"
              - "response.data.buffered_end_utc == 2026-11-02T08:30:00Z"

      - name: land_resource_closed_inclusive_date_unit_capacity
        grounds:
          - validations.priority_65.ERR_LAND_RESOURCE_OVERSUBSCRIBED
          - entities.LandAssignment.fields.days_inclusive
          - entities.LandResource.fields.units_total
        distinguishing_aspect: |
          The contended resource is a unit pool over closed-inclusive calendar dates rather than a
          minute timeline: two motorcoach assignments that merely share their endpoint date
          2026-10-09 already stack to 4 units against a pool of 3, and 1 unit lands exactly on the
          pool ceiling.
        test_recipe:
          setup:
            - "Land resource: 3 motorcoaches from a Jerusalem ground operator, unit_rate_local_cents 127500, fx_rate_bp 10833."
            - "Two Holy Land departures in PLANNING, each consuming the same coach pool."
            - "Assignment A1 takes 2 units for 2026-10-05..2026-10-09 inclusive."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-10-05", return_date: "2026-10-15", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-09-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_1_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-10-09", return_date: "2026-10-19", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-09-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_2_id: $.data.id }
            - call: "POST /land-resources"
              payload: { operator_name: "Jerusalem Ground Services", country: "IL", resource_type: "MOTORCOACH", units_total: 3, unit_rate_local_cents: 127500, fx_rate_bp: 10833, force_majeure_notice_days: 30 }
              as: LandContractor
              captures: { lr_id: $.data.id }
            - call: "POST /land-assignments"
              payload: { land_resource_id: "${lr_id}", departure_id: "${dep_1_id}", date_from: "2026-10-05", date_to: "2026-10-09", units_requested: 2 }
              as: LandContractor
              captures: { la_1_id: $.data.id }
          trigger:
            - call: "POST /land-assignments"
              payload: { land_resource_id: "${lr_id}", departure_id: "${dep_2_id}", date_from: "2026-10-09", date_to: "2026-10-12", units_requested: 2 }
              as: LandContractor
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LAND_RESOURCE_OVERSUBSCRIBED"
            - "LandAssignment.${la_1_id}.days_inclusive == 5"
            - "LandAssignment.${la_1_id}.line_local_cents == 1275000"
            - "LandAssignment.${la_1_id}.line_usd_cents == 1381208"
          capacity_edge_case:
            trigger:
              - call: "POST /land-assignments"
                payload: { land_resource_id: "${lr_id}", departure_id: "${dep_2_id}", date_from: "2026-10-09", date_to: "2026-10-12", units_requested: 1 }
                as: LandContractor
            assert:
              - "response.status == 201"
              - "response.data.status == DRAFT"
              - "response.data.days_inclusive == 4"
              - "response.data.line_local_cents == 510000"
              - "response.data.line_usd_cents == 552483"

      - name: sacred_site_daily_pax_aggregate_capacity
        grounds:
          - validations.priority_64.ERR_SITE_DAILY_CAPACITY_EXCEEDED
          - calculations.site_capacity_conservation
          - entities.SacredSite.fields.daily_capacity_pax
        distinguishing_aspect: |
          The contended quantity is pax slots aggregated over a whole UTC calendar date, so two
          services that do not touch in time (09:00 and 11:00 at a site with a 15 minute turnaround)
          still collide once their pax counts sum past 40 — a purely additive limit, unlike the
          interval and unit-pool checks.
        test_recipe:
          setup:
            - "Sacred site Grotto of the Annunciation, daily_capacity_pax 40, turnaround_buffer_minutes 15, TICKETED_SLOT."
            - "Two Holy Land departures in PLANNING."
            - "Booking B1 holds 2026-11-03T09:00:00Z for 60 minutes with 25 pax, so 15 pax of the daily allowance remain."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_1_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_2_id: $.data.id }
            - call: "POST /sacred-sites"
              payload: { name: "Grotto of the Annunciation", country: "IL", access_regime: "TICKETED_SLOT", daily_capacity_pax: 40, turnaround_buffer_minutes: 15, requires_local_clergy: false }
              as: ProgramManager
              captures: { site_id: $.data.id }
            - call: "POST /service-bookings"
              payload: { departure_id: "${dep_1_id}", sacred_site_id: "${site_id}", service_type: "LITURGY", scheduled_start_utc: "2026-11-03T09:00:00Z", duration_minutes: 60, pax_count: 25, permit_reference: "SLOT-9911" }
              as: ProgramManager
              captures: { sb_1_id: $.data.id }
          trigger:
            - call: "POST /service-bookings"
              payload: { departure_id: "${dep_2_id}", sacred_site_id: "${site_id}", service_type: "GUIDED_VISIT", scheduled_start_utc: "2026-11-03T11:00:00Z", duration_minutes: 45, pax_count: 20, permit_reference: "SLOT-9912" }
              as: ProgramManager
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SITE_DAILY_CAPACITY_EXCEEDED"
            - "ServiceBooking.${sb_1_id}.status == SITE_HELD"
            - "ServiceBooking.${sb_1_id}.buffered_end_utc == 2026-11-03T10:15:00Z"
          capacity_edge_case:
            trigger:
              - call: "POST /service-bookings"
                payload: { departure_id: "${dep_2_id}", sacred_site_id: "${site_id}", service_type: "GUIDED_VISIT", scheduled_start_utc: "2026-11-03T11:00:00Z", duration_minutes: 45, pax_count: 15, permit_reference: "SLOT-9912" }
                as: ProgramManager
            assert:
              - "response.status == 201"
              - "response.data.status == SITE_HELD"
              - "response.data.pax_count == 15"

  - rule_id: compensating_invariant
    instances:
      - name: payment_reversal_restores_cash_allocation_conservation
        grounds:
          - calculations.payment_waterfall_allocation
          - calculations.pilgrim_cash_conservation
          - validations.priority_48.ERR_PAYMENT_ALREADY_REVERSED
          - entities.Payment.fields.status
        distinguishing_aspect: |
          The conserved quantity is money: reversing one 200000 payment must walk its recorded
          allocation backwards so installment 1 falls from 192390 to exactly its pre-payment 50000
          and installment 2 returns to 0, leaving allocated cash plus credit equal to
          cash_applied_cents 50000 with zero drift.
        test_recipe:
          setup:
            - "Holy Land departure OPEN_FOR_SALE, tier T1 587000 / deposit 50000."
            - "One CONFIRMED traveler with invoice_total 577168."
            - "A MONTHLY_3 plan created after the deposit, so its installments are 192390 / 192389 / 192389 and the 50000 credit drains into installment 1, leaving it PARTIALLY_PAID."
            - "A second payment of 200000 fills installment 1 (142390) and spills 57610 into installment 2."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Traveler A", date_of_birth: "1975-01-10", room_type_requested: "DOUBLE" }
              as: ProgramManager
              captures: { pil_id: $.data.id }
            - call: "POST /pilgrims/${pil_id}/payments"
              payload: { amount_cents: 50000, method: "PARISH_TRANSFER" }
              as: FinanceController
              captures: { pay_deposit_id: $.data.id }
            - call: "POST /pilgrims/${pil_id}/confirm"
              payload: {}
              as: ProgramManager
            - call: "GET /pilgrims/${pil_id}"
              payload: {}
              as: FinanceController
              captures: { pil_v: $.data.version }
            - call: "POST /pilgrims/${pil_id}/payment-plans"
              payload: { plan_type: "MONTHLY_3", first_due_date: "2026-08-15", expected_pilgrim_version: "${pil_v}" }
              as: FinanceController
              captures: { plan_id: $.data.id }
            - call: "POST /pilgrims/${pil_id}/payments"
              payload: { amount_cents: 200000, method: "CARD" }
              as: FinanceController
              captures: { pay_2_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_2_id}/reverse"
              payload: { reversal_reason: "CARD_CHARGEBACK" }
              as: FinanceController
          assert:
            - "Payment.${pay_2_id}.status == REVERSED"
            - "PaymentPlan.${plan_id}.installments[0].amount_due_cents == 192390"
            - "PaymentPlan.${plan_id}.installments[0].amount_paid_cents == 50000"
            - "PaymentPlan.${plan_id}.installments[0].status == PARTIALLY_PAID"
            - "PaymentPlan.${plan_id}.installments[1].amount_paid_cents == 0"
            - "PaymentPlan.${plan_id}.installments[1].status == SCHEDULED"
            - "PaymentPlan.${plan_id}.installments[2].amount_paid_cents == 0"
            - "PaymentPlan.${plan_id}.status == ACTIVE"
            - "Pilgrim.${pil_id}.cash_applied_cents == 50000"
            - "Pilgrim.${pil_id}.credit_balance_cents == 0"
            - "Pilgrim.${pil_id}.payment_status == PLAN_ACTIVE"
            - "Pilgrim.${pil_id}.booking_status == CONFIRMED"
          double_compensation_case:
            trigger:
              - call: "POST /payments/${pay_2_id}/reverse"
                payload: { reversal_reason: "CARD_CHARGEBACK" }
                as: FinanceController
            assert:
              - "response.status == 409"
              - "response.data.error_id == ERR_PAYMENT_ALREADY_REVERSED"
              - "PaymentPlan.${plan_id}.installments[0].amount_paid_cents == 50000"
              - "Pilgrim.${pil_id}.cash_applied_cents == 50000"

      - name: service_cancel_restores_sacred_site_pax_capacity
        grounds:
          - calculations.site_capacity_conservation
          - state_machines.ServiceBooking."SITE_HELD | CLERGY_CONFIRMED | CONFIRMED"_to_CANCELLED
          - validations.priority_64.ERR_SITE_DAILY_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          The conserved quantity is sacred-site pax slots on one calendar date, not money: a 25 pax
          hold that blocks a 20 pax request must return exactly 25 slots on cancellation, so the
          previously refused 20 pax request then succeeds and the day's occupancy is 20 rather than 45.
        test_recipe:
          setup:
            - "Sacred site Grotto of the Annunciation, daily_capacity_pax 40, turnaround_buffer_minutes 15."
            - "Two Holy Land departures in PLANNING."
            - "Booking B1 holds 25 pax on 2026-11-03 at 09:00, so a 20 pax request the same day is refused while B1 stands."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_1_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_2_id: $.data.id }
            - call: "POST /sacred-sites"
              payload: { name: "Grotto of the Annunciation", country: "IL", access_regime: "TICKETED_SLOT", daily_capacity_pax: 40, turnaround_buffer_minutes: 15, requires_local_clergy: false }
              as: ProgramManager
              captures: { site_id: $.data.id }
            - call: "POST /service-bookings"
              payload: { departure_id: "${dep_1_id}", sacred_site_id: "${site_id}", service_type: "LITURGY", scheduled_start_utc: "2026-11-03T09:00:00Z", duration_minutes: 60, pax_count: 25, permit_reference: "SLOT-9911" }
              as: ProgramManager
              captures: { sb_1_id: $.data.id }
          trigger:
            - call: "POST /service-bookings/${sb_1_id}/cancel"
              payload: { cancellation_reason: "SITE_CLOSED_FOR_RESTORATION" }
              as: ProgramManager
            - call: "POST /service-bookings"
              payload: { departure_id: "${dep_2_id}", sacred_site_id: "${site_id}", service_type: "GUIDED_VISIT", scheduled_start_utc: "2026-11-03T11:00:00Z", duration_minutes: 45, pax_count: 20, permit_reference: "SLOT-9912" }
              as: ProgramManager
              captures: { sb_2_id: $.data.id }
          assert:
            - "ServiceBooking.${sb_1_id}.status == CANCELLED"
            - "ServiceBooking.${sb_1_id}.cancelled_by_risk == false"
            - "response.status == 201"
            - "ServiceBooking.${sb_2_id}.status == SITE_HELD"
            - "ServiceBooking.${sb_2_id}.pax_count == 20"
            - "ServiceBooking.${sb_2_id}.buffered_end_utc == 2026-11-03T12:00:00Z"
          pre_compensation_case:
            trigger:
              - call: "POST /service-bookings"
                payload: { departure_id: "${dep_2_id}", sacred_site_id: "${site_id}", service_type: "GUIDED_VISIT", scheduled_start_utc: "2026-11-03T11:00:00Z", duration_minutes: 45, pax_count: 20, permit_reference: "SLOT-9912" }
                as: ProgramManager
            assert:
              - "response.status == 409"
              - "response.data.error_id == ERR_SITE_DAILY_CAPACITY_EXCEEDED"
              - "ServiceBooking.${sb_1_id}.status == SITE_HELD"
