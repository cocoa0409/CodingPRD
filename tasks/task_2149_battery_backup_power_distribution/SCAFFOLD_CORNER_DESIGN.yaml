          - entities.BatteryModel.fields.hazmat_class_code
          - entities.BatteryModel.fields.hazmat_severity_rank
        distinguishing_aspect: "LITHIUM_EXCEPTED_MAX_WH is compared with <=, so a 10 V by 2 Ah cell at exactly 20.0 Wh classifies NON_REGULATED with hazmat_severity_rank 0, while a 10 V by 2.1 Ah cell at 21.0 Wh classifies UN3480_SECTION_II with rank 5."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-LFP-20WH", chemistry: "LITHIUM_IRON_PHOSPHATE", nominal_voltage: 10, amp_hour_capacity: 2, peukert_exponent: 1.02, unit_weight_kg: 0.4, lead_content_kg: 0.0, core_deposit_cents: 0, list_price_cents: 6500, warranty_free_replacement_months: 36, warranty_prorata_months: 24, shelf_life_days: 1095, self_discharge_pct_per_month: 1.5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_on: $.data.id, wh_on: $.data.watt_hour_rating, cls_on: $.data.hazmat_class_code, rank_on: $.data.hazmat_severity_rank }
          trigger:
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-LFP-21WH", chemistry: "LITHIUM_IRON_PHOSPHATE", nominal_voltage: 10, amp_hour_capacity: 2.1, peukert_exponent: 1.02, unit_weight_kg: 0.45, lead_content_kg: 0.0, core_deposit_cents: 0, list_price_cents: 6800, warranty_free_replacement_months: 36, warranty_prorata_months: 24, shelf_life_days: 1095, self_discharge_pct_per_month: 1.5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_over: $.data.id, wh_over: $.data.watt_hour_rating, cls_over: $.data.hazmat_class_code, rank_over: $.data.hazmat_severity_rank }
          assert:
            - "${wh_on} == 20.0"
            - "${cls_on} == NON_REGULATED"
            - "${rank_on} == 0"
            - "${wh_over} == 21.0"
            - "${cls_over} == UN3480_SECTION_II"
            - "${rank_over} == 5"

  - section: state_machines
    instances:

      - name: order_cancel_cancels_the_attached_service_contract
        claim_type: Cascade down
        grounds:
          - state_machines.ServiceContract.ATTACHED_to_CANCELLED
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - entities.Order.fields.service_contract_fee_cents
        distinguishing_aspect: "Cancelling the SUBMITTED order drives its ATTACHED contract to CANCELLED by cascade and unwinds the full 236880 cent receivable, including the 118800 cent contract prepay, back to 0."
        test_recipe:
          setup:
            - "One hazmat-endorsed TX warehouse, models IB-AGM-95 and IB-LFP-100 and one STANDARD TX account."
            - "One order of 4 units submitted at total_cents 118080, with a GOLD contract sized to prepay_total_cents 118800 and ATTACHED, taking the order to total_cents 236880."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/accounts"
              payload: { name: "Delta Fleet", account_tier: "STANDARD", state_code: "TX", credit_limit_cents: 100000000, storm_priority_rank: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-AGM-95", chemistry: "AGM", nominal_voltage: 12, amp_hour_capacity: 95, peukert_exponent: 1.10, unit_weight_kg: 28.0, lead_content_kg: 13.0, core_deposit_cents: 2500, list_price_cents: 26000, warranty_free_replacement_months: 24, warranty_prorata_months: 36, shelf_life_days: 730, self_discharge_pct_per_month: 3.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_agm: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-LFP-100", chemistry: "LITHIUM_IRON_PHOSPHATE", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.02, unit_weight_kg: 13.0, lead_content_kg: 0.0, core_deposit_cents: 0, list_price_cents: 89000, warranty_free_replacement_months: 36, warranty_prorata_months: 24, shelf_life_days: 1095, self_discharge_pct_per_month: 1.5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_lfp: $.data.id }
            - call: "POST /distribution/orders"
              payload: { account_id: "${acct}", warehouse_id: "${wh_tx}", requested_ship_date: "2026-08-11" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord: $.data.id }
            - call: "POST /distribution/orders/${ord}/lines"
              payload: { battery_model_id: "${m_agm}", quantity: 4, core_expected_count: 0 }
              as: SalesRep
              as_user_id: "rep-1"
            - call: "POST /distribution/orders/${ord}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { ord_v: $.data.version }
            - call: "POST /distribution/service-contracts"
              payload: { account_id: "${acct}", coverage_tier: "GOLD", load_watts: 2400, required_runtime_minutes: 90, system_voltage: 48, ambient_temp_c: 10.0, allowed_chemistries: ["AGM", "LITHIUM_IRON_PHOSPHATE"] }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { sc: $.data.id }
            - call: "POST /distribution/service-contracts/${sc}/size"
              payload: {}
              as: SalesRep
              as_user_id: "rep-1"
              captures: { prepay: $.data.prepay_total_cents }
            - call: "POST /distribution/service-contracts/${sc}/attach"
              payload: { order_id: "${ord}", expected_order_version: "${ord_v}" }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { att_status: $.data.status }
            - call: "GET /distribution/orders/${ord}"
              as: SalesRep
              as_user_id: "rep-1"
              captures: { total_with_contract: $.data.total_cents }
          trigger:
            - call: "POST /distribution/orders/${ord}/cancel"
              payload: { cancellation_reason: "Budget freeze; the whole standby project is on hold." }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { fs: $.data.fulfillment_status }
          assert:
            - "${prepay} == 118800"
            - "${att_status} == ATTACHED"
            - "${total_with_contract} == 236880"
            - "HTTP status == 200"
            - "${fs} == CANCELLED"
            - "Order.${ord}.credit_status == CLOSED"
            - "ServiceContract.${sc}.status == CANCELLED"
            - "ServiceContract.${sc}.order_id == ${ord}"
            - "Account.${acct}.open_receivable_cents == 0"
            - "Order.${ord}.total_cents == 236880"
