              captures: { init_c: $.data.initial_date, due_c: $.data.recert_due_date }
          assert:
            - "${group_ii} == GROUP_II and ${group_i} == GROUP_I: the two studies differ only in saturation and the secondary finding"
            - "${init_a} == 2026-08-01 and ${due_a} == 2026-11-01: GROUP_II recertifies in min(3, 99) == 3 months, so a lifetime length of need does not extend the interval"
            - "${init_b} == 2026-08-01 and ${due_b} == 2027-02-01: GROUP_I would allow 12 months, but min(12, 6) takes the 6-month declared need"
            - "${status_a_after} == SUPERSEDED and ${due_a_after} == 2026-11-01: superseding does not rewrite the earlier certificate's computed due date"
            - "${expired_count} == 0 on the clock advance: ${cmn_b}'s recert_due_date 2027-02-01 is still in the future, so the ACTIVE -> EXPIRED sweep touches nothing"
            - "${init_c} == 2026-08-31 and ${due_c} == 2027-02-28: add_months clamps to the last day of February instead of spilling into March"
            - "${score_c} == 85.00: at 2026-08-31 the study is past its 2026-08-24T14:00:00Z expiry but inside the 15-day grace, so c_currency drops to 10 and the total lands exactly on DOCUMENTATION_PASS_THRESHOLD"
            - "${score_a} == 94.00 (c_group 24 for GROUP_II, and c_duration 5 for the lifetime need) while ${score_c} uses c_group 30 — the group points and the currency points move independently"
            - "Approving ${cmn_c} supersedes ${cmn_b}, so Patient.${p_id}.current_cmn_status is ACTIVE and exactly one ACTIVE certificate exists at every point"

      # --- Excluded: already carried by a §1.8 difficulty instance -------------
      - name: qualifying_group_spo2_boundary_corner
        claim_type: threshold
        grounds:
          - calculations.qualifying_group_determination
        distinguishing_aspect: |
          The saturation axis boundary at 88/89 and the cor_pulmonale conjunct are exercised in
          full by the difficulty instance, including the NON_QUALIFYING fall-through at 89 without
          a secondary finding.
        excluded_because:
          difficulty_instance: spo2_88_qualifies_group_i_89_requires_cor_pulmonale
          rationale: |
            That instance already drives 88, 89-with-finding and 89-without-finding through
            POST /home-oxygen/qualifying-tests and asserts all three groups; repeating it here
            would duplicate the same three calls with the same three expected values.

      - name: documentation_score_pass_threshold_corner
        claim_type: weighted_scoring
        grounds:
          - calculations.cmn_documentation_score
          - validations[priority=50]
        distinguishing_aspect: |
          The interesting corner is the inclusive 85.00 pass boundary at submit versus the
          84.38 rejection one narrative element below it, which is a validation-threshold pairing
          rather than an arithmetic property of the formula.
        excluded_because:
          difficulty_instance: documentation_score_exactly_85_passes_submit_84_38_fails
          rationale: |
            That instance already asserts both sides of the DOCUMENTATION_PASS_THRESHOLD comparison
            on certificates scoring exactly 85.00 and 84.38, including the ERR_DOCUMENTATION_INCOMPLETE
            rejection and the unchanged DRAFT status.

      - name: monthly_allowable_rounding_order_corner
        claim_type: precision
        grounds:
          - calculations.monthly_allowable_cents
        distinguishing_aspect: |
          The per-line-then-sum rounding order is only observable on a factor combination where
          summing first and rounding once differs by a cent, which is exactly what the difficulty
          instance constructs on the FEE_SCHEDULE_ADJUSTED basis.
        excluded_because:
          difficulty_instance: monthly_allowable_per_line_rounding_order_fee_schedule
          rationale: |
            That instance pins the three-line fee-schedule case whose per-line rounding differs from
            the round-once-at-the-end reading; the corner recipes here assert the ordinary
            competitive-bid and cash totals, and a third arithmetic recipe would add no new claim.

      - name: cap_month_position_variant_corner
        claim_type: variant_divergence
        grounds:
          - calculations.cap_month_position
        distinguishing_aspect: |
          Both variants must be evaluated over one identical posted-month ledger for the divergence
          to be visible, which is inherently a dual-variant construction.
        excluded_because:
          difficulty_instance: cap_position_variant_divergence_bid_vs_fee_schedule
          rationale: |
            That instance drives two contracts with identical ledgers under the two pricing bases and
            asserts both cap-summary positions plus the variant_applied field, which is the whole
            claim this corner would make.

      - name: oxygen_safety_risk_variant_corner
        claim_type: variant_divergence
        grounds:
          - calculations.oxygen_safety_risk_score
        distinguishing_aspect: |
          The weighted-average variant and the worst-factor-plus-breadth variant can only be
          separated by holding the factor vector fixed and changing the trigger.
        excluded_because:
          difficulty_instance: patient_risk_variant_divergence_initial_vs_surveillance
          rationale: |
            That instance builds one factor vector, drives the INITIAL_ASSESSMENT trigger and then the
            ONGOING_SURVEILLANCE trigger, and asserts both persisted scores and the compliance-hold
            flip; the malfunction recipe above already asserts the ONGOING sequence on its own.

      - name: travel_supply_pinned_step_order_corner
        claim_type: waterfall_allocation
        grounds:
          - calculations.travel_supply_authorization
        distinguishing_aspect: |
          The pinned evaluation order matters only where the handling surcharge is in play, since
          STEP 7 must read cylinders_raw rather than the post-surcharge count.
        excluded_because:
          difficulty_instance: travel_cylinder_pinned_evaluation_order_with_surcharge
          rationale: |
            That instance drives the 24-hour trip that reaches cylinders_raw 8 and therefore triggers
            the surcharge, asserting every intermediate step; the altitude recipe above deliberately
            stays below the surcharge threshold so the two do not overlap.

  # ===========================================================================
  - section: validations
    instances:

      - name: clinical_study_and_certificate_documentation_rules_reject
        claim_type: violation_to_error
        grounds:
          - validations[priority=70]
          - validations[priority=51]
          - validations[priority=60]
          - validations[priority=49]
          - validations[priority=50]
        distinguishing_aspect: |
          Four clinical-documentation rules on one patient pair, including the ordering pin that
          makes staleness (priority 49) beat documentation completeness (priority 50): a certificate
          drafted on a study past its grace window scores at most 80.00, so without that ordering
          the stale-study rule could never be observed.
        test_recipe:
          setup:
            - "One branch and two ACTIVE patients, A and B, so a study can be pointed at the wrong chart."
            - "Studies on A: a current GROUP_I resting study (2026-07-25T14:00:00Z), a NON_QUALIFYING resting study at spo2 92, and a stale GROUP_I study drawn 2026-06-01T00:00:00Z whose 30-day validity plus the 15-day grace expired on 2026-07-16."
