      - name: hr_ticket_full_cycle_assign_await_reply_escalate_resolve_reopen_close
        claim_type: valid_transition
        grounds:
          - state_machines.HrTicket.OPEN_to_IN_PROGRESS
          - state_machines.HrTicket.AWAITING_CLIENT_to_IN_PROGRESS
          - state_machines.HrTicket.RESOLVED_to_IN_PROGRESS
          - entities.HrTicket.fields.reopen_count
        distinguishing_aspect: "The advisory ticket walks its two cycles once each — AWAITING_CLIENT -> IN_PROGRESS (CLIENT_REPLY) and RESOLVED -> IN_PROGRESS (REOPEN, reopen_count 1) — ESCALATE forces priority HIGH, and CLOSE from RESOLVED is terminal."
        test_recipe:
          setup:
            - "ACTIVE client with one OPEN HR ticket raised by the ClientAdmin (priority NORMAL)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Omicron Co", fein: "20-0000015", state_code: "CA", service_agreement_signed: true }
              as: PeoAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
            - call: "POST /clients/${c_id}/hr-tickets"
              payload: { category: "LEAVE", subject: "FMLA question", body: "How much leave is available?" }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /hr-tickets/${t1}/transition"
              payload: { action: "ASSIGN" }
              as: HrAdvisor
              as_user_id: "adv-1"
            - call: "POST /hr-tickets/${t1}/transition"
              payload: { action: "AWAIT_CLIENT" }
              as: HrAdvisor
              as_user_id: "adv-1"
            - call: "POST /hr-tickets/${t1}/transition"
              payload: { action: "CLIENT_REPLY" }
              as: ClientAdmin
              as_user_id: "${c_id}"
            - call: "POST /hr-tickets/${t1}/transition"
              payload: { action: "ESCALATE" }
              as: HrAdvisor
              as_user_id: "adv-1"
            - call: "POST /hr-tickets/${t1}/transition"
              payload: { action: "DEESCALATE" }
              as: PeoAdmin
              as_user_id: "admin-1"
            - call: "POST /hr-tickets/${t1}/transition"
              payload: { action: "RESOLVE" }
              as: HrAdvisor
              as_user_id: "adv-1"
            - call: "POST /hr-tickets/${t1}/transition"
              payload: { action: "REOPEN" }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { rc: $.data.reopen_count }
            - call: "POST /hr-tickets/${t1}/transition"
              payload: { action: "RESOLVE" }
              as: HrAdvisor
              as_user_id: "adv-1"
            - call: "POST /hr-tickets/${t1}/transition"
              payload: { action: "CLOSE" }
              as: HrAdvisor
              as_user_id: "adv-1"
              captures: { final: $.data.status }
          assert:
            - "HrTicket.${t1} was created with status OPEN, priority NORMAL, reopen_count 0, assigned_advisor_user_id null"
            - "After ASSIGN: status == IN_PROGRESS and assigned_advisor_user_id == 'adv-1'"
            - "After ESCALATE: status == ESCALATED and priority == HIGH; after DEESCALATE: status == IN_PROGRESS and priority stays HIGH"
            - "After REOPEN: status == IN_PROGRESS and reopen_count == 1"
            - "After CLOSE: status == CLOSED; a further ASSIGN returns HTTP 409 ERR_TICKET_ACTION_NOT_ALLOWED (CLOSED is terminal)"

      - name: close_an_open_ticket_returns_ticket_action_not_allowed
        claim_type: invalid_transition
        grounds:
          - errors[ERR_TICKET_ACTION_NOT_ALLOWED]
          - validations[priority=41]
        distinguishing_aspect: "CLOSE is declared only from RESOLVED; issuing it against an OPEN ticket returns HTTP 409 ERR_TICKET_ACTION_NOT_ALLOWED (not the generic ERR_INVALID_STATE) and the ticket stays OPEN."
        test_recipe:
          setup:
            - "ACTIVE client with one OPEN HR ticket."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Pi Co", fein: "20-0000016", state_code: "CA", service_agreement_signed: true }
              as: PeoAdmin
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/activate"
              payload: {}
              as: PeoAdmin
            - call: "POST /clients/${c_id}/hr-tickets"
              payload: { category: "OTHER", subject: "Policy question", body: "Remote work policy?" }
              as: ClientAdmin
              as_user_id: "${c_id}"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /hr-tickets/${t1}/transition"
              payload: { action: "CLOSE" }
              as: HrAdvisor
              as_user_id: "adv-1"
          assert:
            - "HTTP 409 with data.error_id == 'ERR_TICKET_ACTION_NOT_ALLOWED'"
            - "HrTicket.${t1}.status == OPEN and version == 1"

