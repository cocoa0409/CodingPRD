  - section: consistency_model
    instances:
      - name: corner_immediate_consistency_every_cascade_is_visible_in_the_triggering_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.inspection_score
          - calculations.franchisee_compliance_score
        distinguishing_aspect: "The consistency model is immediate, so the single scoring call must already have written the club demotion and the franchisee's recomputed compliance score: an unconditional read of both aggregates in the same test - with no clock move, no second write and no retry - shows SUSPENDED / NON_COMPLIANT and 80 points."
        test_recipe:
          setup:
            - "One franchisee with one OPEN COMPLIANT CA club opened 2024-05-01 and one SCHEDULED inspection."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harborline Downtown", opened_on: "2024-05-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /franchise/clubs/${c1_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/inspections"
              payload: { club_id: "${c1_id}", inspection_date: "2026-07-15" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /franchise/inspections/${insp_id}/score"
              payload: { equipment_condition_pts: 60, cleanliness_pts: 60, safety_pts: 60, equipment_age_months_max: 60 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "GET /franchise/clubs/${c1_id}"
              payload: {}
              as: BrandAdministrator
            - call: "GET /franchise/franchisees/${f1_id}"
              payload: {}
              as: BrandAdministrator
          assert:
            - "the score response status == 200"
            - "the score response data.score == 51"
            - "the score response data.status == REMEDIATION_REQUIRED"
            - "the club read response data.status == SUSPENDED"
            - "the club read response data.equipment_compliance_state == NON_COMPLIANT"
            - "the club read response data.last_inspection_score == 51"
            - "the franchisee read response data.inspection_fail_streak == 1"
            - "the franchisee read response data.compliance_score == 80"
            - "the franchisee read response data.status == ACTIVE"

