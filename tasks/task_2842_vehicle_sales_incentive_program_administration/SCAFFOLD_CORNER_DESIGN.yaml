              captures: { a2_status: $.data.validation_status, a2_amount: $.data.approved_amount_cents }
          assert:
            - "${obj_a_status} == PROPOSED and ${claim_a_type} == STAIR_STEP_BONUS (derived from the program's incentive_type)"
            - "${err_proposed} == ERR_OBJECTIVE_NOT_FINAL (409) — the objective exists but is still PROPOSED, so its objective_units are not yet frozen and no bonus can be computed"
            - "${err_missing} == ERR_OBJECTIVE_NOT_FINAL (409) for dealer B, NOT ERR_OBJECTIVE_NOT_FOUND: `no matching objective` is folded into the same error_id, because the caller's fault is the same — the stair-step program has nothing to pay against"
            - "${fin_status} == FINAL with ${fin_units} == ${obj_a_units} == 5, ${fin_achieved} == 5 and ${fin_paid} == 0; ${fin_payout} == 60000 because attainment_bps = floor(5*10000/5) = 10000 attains tier 1, threshold_units = ceil(5*8000/10000) = 4, and MARGINAL pays only the band above it: (5 - 4 + 1) * 30000"
            - "${ok_status} == VALIDATED and ${ok_amount} == 60000 == ${fin_payout} - ${fin_paid} — the stair-step leg ignores the dealer's claimed_amount_cents of 150000 entirely and pays the unpaid remainder of the objective"
            - "${obj_a_status2} == PROTESTED with ${obj_a_round} == 1 — filing a protest un-finalizes an already FINAL objective"
            - "${err_unfinalized} == ERR_OBJECTIVE_NOT_FINAL — the gate closes again; a previously successful adjudication does not grant standing to the next one"
            - "${a2_status} == SUBMITTED and ${a2_amount} == 0 — the refused adjudication left the second claim untouched"
            - "the first claim keeps validation_status VALIDATED and approved_amount_cents 60000 across the protest; only its objective moved"

