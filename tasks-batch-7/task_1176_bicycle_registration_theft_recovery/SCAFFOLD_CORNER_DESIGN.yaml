  - section: cross_cutting_layers
    instances:
      - name: bicycle_patch_stale_version_rejected
        claim_type: occ_stale_conflict
        grounds: ["concurrency_rules[bicycle-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /registry/bicycles/{id} with the pre-update version after a successful patch returns 412 ERR_STALE_VERSION; two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["Owner o1 with bicycle b1, version v observed at creation (1)"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "OCC100", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 40000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id, b1_ver: $.data.version } }
          trigger:
            - { call: "PATCH /registry/bicycles/${b1_id}", payload: { expected_bicycle_version: "${b1_ver}", primary_color: "Blue" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_ver2: $.data.version } }
            - { call: "PATCH /registry/bicycles/${b1_id}", payload: { expected_bicycle_version: "${b1_ver}", primary_color: "Green" }, as: Owner, as_user_id: "${o1_id}", captures: { err: $.data.error_id } }
          assert:
            - "First patch succeeds: version advanced to ${b1_ver} + 1 (observed ${b1_ver2})"
            - "Second patch with stale ${b1_ver}: error_id == ERR_STALE_VERSION (observed ${err}); http 412"

      - name: bid_place_stale_auction_version_rejected
        claim_type: occ_stale_conflict
        grounds: ["concurrency_rules[bid-place-stale-auction-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Create-with-supersede: a newly accepted bid legitimately changes the auction's observable leading-bid state and bumps its version; a second bidder acting on the pre-bid version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["ACTIVE org; intake i1 UNCLAIMED; auction a1 [06-05, 06-10] OPENed, version v2; owners o1, o2"]
