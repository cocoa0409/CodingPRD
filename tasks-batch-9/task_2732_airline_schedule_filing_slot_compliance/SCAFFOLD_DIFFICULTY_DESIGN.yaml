  # =====================================================================
  # RULE 9 — compensating_invariant
  # Three DIFFERENT kinds of conserved quantity:
  #   I1 monetary ledger  (filing_charge_accrued_cents, cents)
  #   I2 discrete allocation count (attached_operations, operations)
  #   I3 outstanding-obligation count (open_obligation_count, obligations)
  # Each instance pins the invariant formula and asserts exactly zero drift
  # after the compensating operation.
  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: filing_charge_ledger_returns_to_exactly_zero_after_transmit_then_rejection
        grounds:
          - state_machines.FilingSubmission.QUEUED_to_TRANSMITTED
          - state_machines.FilingSubmission.TRANSMITTED_to_REJECTED
          - state_machines.ScheduleVersion.FILED_to_VALIDATED
          - calculations.filing_change_charge_cents
          - entities.ScheduleVersion.fields.filing_charge_accrued_cents
        distinguishing_aspect: |
          Conserved quantity is MONETARY. Pinned invariant, which must hold after every single write:
          ScheduleVersion.filing_charge_accrued_cents == SUM of FilingSubmission.total_charge_cents over
          submissions of that version whose status is TRANSMITTED or ACKNOWLEDGED. Transmit adds 22815,
          the REJECT acknowledgement subtracts the same 22815, and the ledger must land on exactly 0 —
          not 1, not -22815, and not a re-derived value. Implementations that recompute the charge at
          reversal time from the current leg set drift, because the reversal must use the submission's
          own stored total.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z, before filing_change_window_close_utc."
            - "Home carrier HX (DE); FRA LEVEL_3_COORDINATED gate_count 2; MUC LEVEL_2_FACILITATED gate_count 3; Season W26 OPEN."
            - "ScheduleVersion W26-L9 with the default filing_charge_budget_cents 100000."
            - "One FRA DEPARTURE holding at 2026-11-02T08:00:00Z days_of_week \"1\" series_weeks 5; four Monday FRA->MUC legs assigned to D-AHXA and slot-attached -> attached_operations 4, utilization_pct_as_filed 80.00, at_risk_of_loss false, score 100.00, CLEAN."
            - "Version validated by usr-comp-1; one EXPEDITED IATA_SSIM submission created by usr-file-1 with changed_leg_count 4, base_charge_subtotal_cents 16900, expedite_rate_pct 35.00, expedite_fee_cents 5915, total_charge_cents 22815, still QUEUED."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
