            - "PerformanceAttestation.${att_off_id}.typical_download_mbps == 120.00 and typical_upload_mbps == 40.00 (nearest rank ceil(0.20 * 3) == 1 selects the minimum)"
            - "PerformanceAttestation.${att_off_id}.typical_latency_ms == 50 (nearest rank ceil(0.95 * 3) == 3 selects the maximum)"
            - "PerformanceAttestation.${att_off_id}.download_margin_pct == 0.4000 and upload_margin_pct == 0.2857, so this attestation can never be certified"
  - rule_id: cross_entity_state_dependency
    instances:

      - name: label_publication_requires_certified_attestation
        grounds:
          - state_machines.LabelVersion.DRAFT_to_PUBLISHED
          - state_machines.PerformanceAttestation.DRAFT_to_CERTIFIED
          - errors.ERR_ATTESTATION_NOT_CERTIFIED
          - endpoints.POST_label_versions_id_publish
        distinguishing_aspect: |
          Entity pair LabelVersion x PerformanceAttestation: a label's own dimension-1 transition is
          gated on the *status of a sibling evidence entity*, and the same publish call that finally
          succeeds reaches into that sibling to pin its id and copy its typical_* figures, so the
          dependency is observable in both directions.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ServicePlan FIBER300 (advertised 300/140) with its five FeeLineItems."
            - "PUBLISHED MethodologyDocument MTH-2026-A (peak [19,23), min_samples_required 4, max_run_duration_days 7) and MeasurementProbe PRB-1 (max_concurrent_windows 2)."
            - "One INCLUDED TestRun A whose closed window is [2026-08-03T00:00:00Z, 2026-08-09T23:00:00Z], so its buffered end is 2026-08-10T00:00:00Z."

            - "A DRAFT (not yet certified) PEAK_HOUR_MEDIAN PerformanceAttestation: typical 240.00 / 115.00 / 42, margins 0.8000 / 0.8214."
            - "A DRAFT LabelVersion for FIBER300 (effective_from 2026-09-01, WCAG_AA) created by co-1, with a VERIFIED en-US LabelTranslation, so every publish precondition except the attestation one is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

            - call: "POST /service-plans"
