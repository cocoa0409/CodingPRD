    roles: [PracticeAdmin, FrontDesk]
    code: 200
    input: ["include_archived?", "limit?", "offset?"]
    output: CommissionTier[]
    side_effects: []

  # ---- Appointment ----
  - method: POST
    path: "/practice/appointments"
    description: "Book an appointment (runs consent, contraindication, intake, license, certification, table-suitability, table-overlap, therapist-overlap, and OCC gates). If payer == MEMBERSHIP, the credit is not debited until PRICE."
    roles: [FrontDesk, PracticeAdmin]
    code: 201
    input: ["client_id", "therapist_id", "table_id", "modality_id", "consent_id", "package_id?", "start_at", "duration_minutes?", "payer?", "gratuity_cents?", "expected_table_version"]
    output: Appointment
    side_effects: ["compute end_at = start_at + duration_minutes", "occupy table interval [start_at, end_at] with turnover buffer", "increments Table.version by 1 (OCC anchor)", "scheduling_status = SCHEDULED, settlement_status = UNSETTLED"]
  - method: GET
    path: "/practice/appointments"
    description: "List appointments; filter by client_id, therapist_id, table_id, modality_id, consent_id, or package_id (reverse-reachability for all Appointment FKs)."
    roles: [PracticeAdmin, FrontDesk, Therapist, Client]
    code: 200
    input: ["client_id?", "therapist_id?", "table_id?", "modality_id?", "consent_id?", "package_id?", "scheduling_status?", "settlement_status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: GET
    path: "/practice/appointments/{id}"
    description: "Fetch an appointment (includes both status axes, all computed money fields, version)."
    roles: [PracticeAdmin, FrontDesk, Therapist, Client]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/practice/appointments/{id}/check-in"
    description: "Check in a SCHEDULED appointment (re-validates license + consent within check-in window)."
    roles: [FrontDesk]
    code: 200
    input: []
    output: Appointment
    side_effects: ["set scheduling_status = CHECKED_IN", "increments Appointment.version by 1"]
  - method: POST
    path: "/practice/appointments/{id}/complete"
    description: "Complete a CHECKED_IN appointment; requires a FINALIZED/AMENDED SoapNote."
    roles: [Therapist, FrontDesk]
    code: 200
    input: []
    output: Appointment
    side_effects: ["set scheduling_status = COMPLETED", "increments Appointment.version by 1"]
  - method: POST
    path: "/practice/appointments/{id}/cancel"
    description: "Cancel a SCHEDULED/CHECKED_IN appointment; refund membership credit; possible late-cancel fee."
    roles: [FrontDesk, PracticeAdmin]
    code: 200
    input: [cancel_reason]
    output: Appointment
    side_effects: ["set scheduling_status = CANCELLED", "refund membership credit if redeemed (CreditLedgerEntry REFUND)", "no_show_fee_proration if inside free window -> settlement PRICED", "release table interval", "increments Appointment.version by 1"]
  - method: POST
    path: "/practice/appointments/{id}/no-show"
    description: "Mark a missed appointment NO_SHOW; assess prorated fee; bump client strike."
    roles: [FrontDesk, PracticeAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["set scheduling_status = NO_SHOW", "increment Client.no_show_strikes", "no_show_fee_proration", "settlement_status = PRICED with no_show_fee_cents", "refund membership credit if redeemed", "release table interval", "increments Appointment.version by 1", "increments Client.version by 1"]
  - method: POST
    path: "/practice/appointments/{id}/waive-no-show"
    description: "Waive a NO_SHOW: revert scheduling to SCHEDULED, decrement strike, void the fee."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["set scheduling_status = SCHEDULED", "decrement Client.no_show_strikes (floor 0)", "settlement_status = UNSETTLED, no_show_fee_cents = 0", "increments Appointment.version by 1", "increments Client.version by 1"]
  - method: POST
    path: "/practice/appointments/{id}/price"
    description: "Price a COMPLETED appointment (service_pricing + client_owed_resolution); redeem membership credit if applicable."
    roles: [FrontDesk, PracticeAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["compute service_charge_cents, client_owed_cents", "redeem membership credit (CreditLedgerEntry REDEEM) if payer == MEMBERSHIP", "set settlement_status = PRICED", "increments Appointment.version by 1"]
  - method: POST
    path: "/practice/appointments/{id}/pay"
    description: "Pay a PRICED appointment; charge HSA/wallet, credit therapist commission + gratuity."
    roles: [FrontDesk, PracticeAdmin]
    code: 200
    input: ["gratuity_cents?"]
    output: Appointment
    side_effects: ["decrement Client.hsa_balance_cents if payer == HSA", "decrement Client.wallet_credit_cents by applied amount", "tiered_commission calc; Therapist.mtd_service_revenue_cents += service_charge_cents; Therapist.accrued_commission_cents += commission + gratuity", "set settlement_status = PAID", "increments Appointment.version by 1", "increments Therapist.version by 1"]
  - method: POST
    path: "/practice/appointments/{id}/void"
    description: "Void an UNSETTLED/PRICED appointment; refund redeemed credit; void any superbill."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["set settlement_status = VOID", "refund membership credit if redeemed at PRICED", "void linked superbill", "increments Appointment.version by 1"]

  # ---- SoapNote ----
  - method: POST
    path: "/practice/soap-notes"
    description: "Create a DRAFT SOAP note for an appointment."
    roles: [Therapist]
    code: 201
    input: ["appointment_id", "subjective?", "objective?", "assessment?", "plan?", "clears_contraindication_tags?"]
    output: SoapNote
    side_effects: []
  - method: GET
    path: "/practice/soap-notes"
    description: "List SOAP notes; filter by appointment_id (reverse-reachability for SoapNote.appointment_id FK)."
    roles: [PracticeAdmin, Therapist, FrontDesk]
    code: 200
    input: ["appointment_id?", "limit?", "offset?"]
    output: SoapNote[]
    side_effects: []
  - method: GET
    path: "/practice/soap-notes/{id}"
    description: "Fetch a SOAP note."
    roles: [PracticeAdmin, Therapist, FrontDesk]
    code: 200
    input: []
    output: SoapNote
    side_effects: []
  - method: PATCH
    path: "/practice/soap-notes/{id}"
    description: "Edit a DRAFT SOAP note's S/O/A/P content."
    roles: [Therapist]
    code: 200
    input: ["subjective?", "objective?", "assessment?", "plan?", "clears_contraindication_tags?", "expected_soap_note_version"]
    output: SoapNote
    side_effects: ["update fields", "increments SoapNote.version by 1"]
  - method: POST
    path: "/practice/soap-notes/{id}/finalize"
    description: "Finalize a DRAFT note (DRAFT -> FINALIZED, or DRAFT -> AMENDED if previously finalized); applies contraindication clearances."
    roles: [Therapist]
    code: 200
    input: []
    output: SoapNote
    side_effects: ["set note_status = FINALIZED or AMENDED", "apply contraindication clearances", "increments SoapNote.version by 1"]
  - method: POST
    path: "/practice/soap-notes/{id}/reopen"
    description: "Reopen a FINALIZED note for amendment (FINALIZED -> DRAFT); revokes clearances."
    roles: [Therapist]
    code: 200
    input: []
    output: SoapNote
    side_effects: ["set note_status = DRAFT", "revoke contraindication clearances", "increments SoapNote.version by 1"]

  # ---- Superbill ----
  - method: POST
    path: "/practice/superbills"
    description: "Issue an insurance superbill for a PAID, non-membership appointment."
    roles: [FrontDesk, PracticeAdmin]
    code: 201
    input: [appointment_id, diagnosis_codes, cpt_code]
    output: Superbill
    side_effects: ["set client_id from appointment", "billable_amount_cents = appointment.service_charge_cents", "superbill_status = ISSUED"]
  - method: GET
    path: "/practice/superbills"
    description: "List superbills; filter by appointment_id or client_id (reverse-reachability for Superbill.appointment_id and client_id FKs)."
    roles: [PracticeAdmin, FrontDesk, Client]
    code: 200
    input: ["appointment_id?", "client_id?", "limit?", "offset?"]
    output: Superbill[]
    side_effects: []
  - method: GET
    path: "/practice/superbills/{id}"
    description: "Fetch a superbill."
    roles: [PracticeAdmin, FrontDesk, Client]
    code: 200
    input: []
    output: Superbill
    side_effects: []
  - method: POST
    path: "/practice/superbills/{id}/void"
    description: "Void an ISSUED superbill (claim correction/rebill)."
    roles: [FrontDesk, PracticeAdmin]
    code: 200
    input: []
    output: Superbill
    side_effects: ["set superbill_status = VOID", "increments Superbill.version by 1"]

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an explicit UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any set call, the logical clock reads exactly this default and never falls back to wall-clock time. All license/cert/intake expiry, cycle-end, check-in/no-show windows, and no-show lead-time proration read this clock."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["logical clock advanced/rewound to to_iso8601"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role, or missing X-User-ID for an entity-backed role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for the endpoint, or entity-backed identity acting on a resource it does not own."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource (by path id or FK body field) does not exist."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, invalid enum, out-of-range integer, bad duration value."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not allowed from the resource's current state (wrong scheduling_status / settlement_status / note_status / package_status / intake_status / consent_status)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_table_version on appointment-create does not match current Table.version (OCC)."
  - id: ERR_CONSENT_REQUIRED
    http: 422
    condition: "No ACTIVE consent, draping_policy == DECLINE_TREATMENT, or sensitive modality without sensitive_area_consent."
  - id: ERR_CONTRAINDICATION
    http: 422
    condition: "Modality contraindication tag matches a client intake risk_flag with no clearing FINALIZED/AMENDED SOAP note."
  - id: ERR_INTAKE_INVALID
    http: 422
    condition: "Client has no ACTIVE intake, or the ACTIVE intake's expires_at <= clock.now."
  - id: ERR_LICENSE_EXPIRED
    http: 422
    condition: "Assigned therapist's license_expiry <= clock.now at booking or check-in."
  - id: ERR_CERTIFICATION_REQUIRED
    http: 422
    condition: "Modality requires certification and the therapist lacks an ACTIVE matching TherapistCertification."
  - id: ERR_TABLE_UNSUITABLE
    http: 422
    condition: "PRENATAL modality on a table with supports_prenatal == false, or table archived."
  - id: ERR_TABLE_DOUBLE_BOOKED
    http: 409
    condition: "Requested interval (with turnover buffer) collides with another non-terminal appointment on the same table."
  - id: ERR_THERAPIST_DOUBLE_BOOKED
    http: 409
    condition: "Requested interval collides with another non-terminal appointment for the same therapist."
  - id: ERR_NO_CREDITS
    http: 422
    condition: "MEMBERSHIP payer at price time with credit_balance_sessions < 1, non-ACTIVE package, or package not owned by the client."
  - id: ERR_INSUFFICIENT_HSA
    http: 422
    condition: "HSA payer at pay time with hsa_balance_cents < client_owed_cents."
  - id: ERR_NOT_BILLABLE
    http: 422
    condition: "Superbill requested for a non-PAID appointment or a MEMBERSHIP-payer appointment."
  - id: ERR_RENEWAL_TOO_EARLY
    http: 422
    condition: "Package renewal attempted before current_cycle_end <= clock.now."

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: PracticeAdmin
    description: "Practice owner/manager: configures modalities, plans, tables, commission tiers, certifications; drives renewals, suspensions, voids, waivers, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /practice/modalities"
      - "POST /practice/therapists"
      - "POST /practice/therapists/{id}/reset-commission"
      - "POST /practice/certifications"
      - "POST /practice/tables"
      - "POST /practice/plans"
      - "POST /practice/commission-tiers"
      - "POST /practice/packages/{id}/renew"
      - "POST /practice/packages/{id}/suspend"
      - "POST /practice/packages/{id}/resume"
      - "POST /practice/packages/{id}/cancel-membership"
      - "POST /practice/clients/{id}/wallet-adjustments"
      - "POST /practice/appointments/{id}/waive-no-show"
      - "POST /practice/appointments/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /practice/clients"
      - "POST /practice/intakes"
      - "POST /practice/consent-records"
      - "POST /practice/consent-records/{id}/revoke"
      - "POST /practice/packages"
      - "POST /practice/appointments"
      - "POST /practice/appointments/{id}/cancel"
      - "POST /practice/appointments/{id}/no-show"
      - "POST /practice/appointments/{id}/complete"
      - "POST /practice/appointments/{id}/price"
      - "POST /practice/appointments/{id}/pay"
      - "POST /practice/superbills"
      - "POST /practice/superbills/{id}/void"
      - "all GET endpoints"

  - name: FrontDesk
    description: "Reception staff: registers clients, books/checks-in/cancels/no-shows, prices and collects payment, issues superbills."
    identity: opaque
    exclusive_operations:
      - "POST /practice/appointments/{id}/check-in"
    shared_operations:
      - "POST /practice/clients"
      - "POST /practice/intakes"
      - "POST /practice/intakes/{id}/sign"
      - "POST /practice/consent-records"
      - "POST /practice/packages"
      - "POST /practice/appointments"
      - "POST /practice/appointments/{id}/complete"
      - "POST /practice/appointments/{id}/cancel"
      - "POST /practice/appointments/{id}/no-show"
      - "POST /practice/appointments/{id}/price"
      - "POST /practice/appointments/{id}/pay"
      - "POST /practice/superbills"
      - "POST /practice/superbills/{id}/void"
      - "GET endpoints (non-clinical)"

  - name: Therapist
    description: "Licensed massage therapist: documents SOAP notes, finalizes/reopens, completes sessions; earns commission. Identity equals a Therapist row."
    identity: "entity_backed:Therapist"
    exclusive_operations:
      - "POST /practice/soap-notes"
      - "PATCH /practice/soap-notes/{id}"
      - "POST /practice/soap-notes/{id}/finalize"
      - "POST /practice/soap-notes/{id}/reopen"
    shared_operations:
      - "POST /practice/appointments/{id}/complete"
      - "GET /practice/appointments (own)"
      - "GET /practice/soap-notes"
      - "GET /practice/modalities"
      - "GET /practice/therapists/{id}"

  - name: Client
    description: "Patient/member: signs intake, grants/revokes consent, views own appointments/packages/superbills. Identity equals a Client row."
    identity: "entity_backed:Client"
    exclusive_operations:
