          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          LabelingItem dispatch validity depends on SpecUnit.status, a SpecUnit-to-LabelingItem
          cross-entity dependency, so a piece in a draft unit cannot be dispatched even when the
          piece itself is released.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
