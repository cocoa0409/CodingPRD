    claim_type: exclusive_operations
    grounds:
    - §1.7 the exclusive_operations and shared_operations lists of all seven roles
    - §1.0 role_model segregation_of_duties
    - §1.5 the full endpoint table roles column
    distinguishing_aspect: |
      The positive half of the RBAC obligation, and the only instance in this document where all seven roles act in one uninterrupted chain from an empty database to a CLOSED program. Its value is that it proves the permission table is not merely restrictive but sufficient: each exclusive operation is reachable by exactly the role §1.7 names, in the order the workflow demands, without any role needing to borrow another's privilege. The forbidden half is covered by role_matrix_refusals_are_returned_before_any_state_or_existence_check, and ownership by participant_identity_is_entity_backed_so_one_qualifier_cannot_touch_another.
