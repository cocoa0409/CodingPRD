            - "PATCH /carriage/distributors/${dm_id} as RevenueAccountant returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\" even though that role may place credit holds on the same record"

      - name: distributor_onboarding_is_shared_and_other_roles_cannot_onboard
        claim_type: shared_operations
        grounds:
          - rbac.NetworkAdmin
