# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Eating-Disorder & Behavioral Treatment Program — Expert band
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Standard "admit" setup chain (reused, all literals + captures):
#   facility -> program -> cohort -> patient -> assessment -> finalize
#   -> admission -> authorization -> review(APPROVE) -> promote -> admit
# Logical-clock default is 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: authorized_days_forward_vs_chronological
        grounds:
          - calculations.authorized_days_balance
          - entities.InsuranceAuthorization.fields.days_remaining
          - entities.InsuranceAuthorization.fields.days_consumed
          - state_machines.InsuranceAuthorization.PENDING_to_APPROVED
        distinguishing_aspect: |
          On the InsuranceAuthorization domain: the forward-looking variant reserves
          the full requested_length_of_stay_days while the chronological variant counts
          only window-time elapsed up to the clock; with a 7-day window approved and the
          clock at day 3, chronological days_consumed==3 / days_remaining==4 whereas the
          forward projection (LOS=7) would already reserve all 7 days.
        test_recipe:
          setup:
            - "Clock at 2026-01-01. An InsuranceAuthorization with one APPROVED 7-day window [2026-01-01,2026-01-08); advance clock to 2026-01-04."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat A", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id }
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 7 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-08T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-04T00:00:00Z" }
              as: Admin
          trigger:
            - call: "GET /edt/authorizations/${authid}"
              as: UtilizationReviewer
          assert:
            - "InsuranceAuthorization.${authid}.days_authorized == 7"
            - "InsuranceAuthorization.${authid}.days_consumed == 3"
            - "InsuranceAuthorization.${authid}.days_remaining == 4"

      - name: nutritional_risk_provisional_vs_reconciled
        grounds:
          - calculations.nutritional_risk_score
          - entities.Patient.fields.provisional_nutritional_risk_score
          - entities.Patient.fields.nutritional_risk_score
          - state_machines.MealPlan.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          On the Patient domain (a different entity than the authorization above): the
          provisional variant frozen at finalize stays 44.0 while the reconciled variant
          drops to 6.0 after a meal plan with 0.95 compliance closes (44 - round(40*0.95,2)
          = 44 - 38 = 6); the two fields diverge on the same patient.
        test_recipe:
          setup:
            - "A patient with FINALIZED assessment (composite 37) and bmi 17 -> provisional 44.0; admitted; a meal plan with four events averaging 0.95 compliance, then closed."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat B", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid: $.data.id }
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-15T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /edt/admissions/${aid}/promote"
              as: Intake
            - call: "POST /edt/admissions/${aid}/admit"
              as: Intake
            - call: "POST /edt/meal-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", required_meals_per_day: 4, supervision_level: "FULL" }
              as: Dietitian
              captures: { mpid: $.data.id }
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "BREAKFAST", completion_fraction: 1.0 }
              as: Dietitian
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "LUNCH", completion_fraction: 1.0 }
              as: Dietitian
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "DINNER", completion_fraction: 0.9 }
              as: Dietitian
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "SNACK", completion_fraction: 0.9 }
              as: Dietitian
          trigger:
            - call: "POST /edt/meal-plans/${mpid}/close"
              as: Dietitian
          assert:
            - "Patient.${pid}.provisional_nutritional_risk_score == 44.0"
            - "Patient.${pid}.nutritional_risk_score == 6.0"
            - "Patient.${pid}.medical_stability_posture == STABLE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: step_down_readiness_nonlinear_three_inputs
        grounds:
          - calculations.step_down_readiness_score
          - state_machines.Admission.level_of_care_step_down
          - entities.TreatmentPlan.fields.goals_met
          - entities.MealPlan.fields.meal_compliance_rate
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with conditional branch on posture and nested min.
          goals 5/5, meal rate 0.85, STABLE -> 100*(0.45*1 + 0.35*0.85 + 0.20*1.0) =
          round(94.75,2) == 94.75, which clears the 75 threshold; the stability_factor
          branch (STABLE=1.0 vs GUARDED=0.6) makes it non-linear in posture.
        test_recipe:
          setup:
            - "An ADMITTED, STABLE patient on RESIDENTIAL with an ACTIVE treatment plan (5/5 goals met) and a meal plan with 4 events averaging 0.85; step-down to PHP."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat C", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid: $.data.id }
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id, av: $.data.version }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-15T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /edt/admissions/${aid}/promote"
              as: Intake
            - call: "POST /edt/admissions/${aid}/admit"
              as: Intake
            - call: "POST /edt/treatment-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", goals_total: 5 }
              as: Clinician
              captures: { tpid: $.data.id }
            - call: "POST /edt/treatment-plans/${tpid}/sign"
              payload: { discipline: "THERAPY" }
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/sign"
              payload: { discipline: "MEDICAL" }
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/sign"
              payload: { discipline: "DIETITIAN" }
              as: Dietitian
            - call: "POST /edt/treatment-plans/${tpid}/activate"
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/goals/met"
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/goals/met"
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/goals/met"
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/goals/met"
              as: Clinician
            - call: "POST /edt/treatment-plans/${tpid}/goals/met"
              as: Clinician
            - call: "POST /edt/meal-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", required_meals_per_day: 4, supervision_level: "FULL" }
              as: Dietitian
              captures: { mpid: $.data.id }
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "BREAKFAST", completion_fraction: 0.9 }
              as: Dietitian
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "LUNCH", completion_fraction: 0.9 }
              as: Dietitian
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "DINNER", completion_fraction: 0.8 }
              as: Dietitian
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "SNACK", completion_fraction: 0.8 }
              as: Dietitian
          trigger:
            - call: "POST /edt/admissions/${aid}/step-down"
              as: Clinician
          assert:
            - "Admission.${aid}.level_of_care == PHP"
            - "Admission.${aid}.clinical_status == ADMITTED"

      - name: patient_responsibility_round_per_day_then_multiply
        grounds:
          - calculations.patient_responsibility_cents
          - entities.InsuranceAuthorization.fields.daily_rate_cents
          - entities.InsuranceAuthorization.fields.coinsurance_pct
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. daily_rate_cents 12345 *
          coinsurance 0.205 = 2530.725 -> round_half_up per day = 2531; * 3 consumed days
          = 7593. The forbidden order (multiply 12345*0.205*3=7592.175 then round once =
          7592) gives a DIFFERENT total; the scaffold pins round-per-day-first.
        test_recipe:
          setup:
            - "Authorization daily_rate_cents 12345, coinsurance 0.205; one APPROVED 5-day window [2026-01-01,2026-01-06); clock advanced to 2026-01-04 so days_consumed==3."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat D", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id }
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 5 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 12345, coinsurance_pct: 0.205 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-06T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-04T00:00:00Z" }
              as: Admin
          trigger:
            - call: "GET /edt/authorizations/${authid}/billing-summary"
              as: UtilizationReviewer
          assert:
            - "billing_summary.days_consumed == 3"
            - "billing_summary.patient_responsibility_cents == 7593"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: admission_parallel_dimensions_status_and_loc
        grounds:
          - state_machines.Admission.ADMITTED_to_MEDICAL_HOLD
          - state_machines.Admission.MEDICAL_HOLD_to_ADMITTED
          - state_machines.Admission.level_of_care_step_down
          - entities.Admission.fields.level_of_care
        distinguishing_aspect: |
          On the Admission entity: clinical_status cycles ADMITTED<->MEDICAL_HOLD while the
          orthogonal level_of_care ladder is unaffected; a hold then clear leaves
          clinical_status ADMITTED and level_of_care RESIDENTIAL unchanged - two
          independent dimensions on one row (parallel).
        test_recipe:
          setup:
            - "An ADMITTED RESIDENTIAL admission (STABLE patient)."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat E", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid: $.data.id }
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-15T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /edt/admissions/${aid}/promote"
              as: Intake
            - call: "POST /edt/admissions/${aid}/admit"
              as: Intake
            - call: "POST /edt/admissions/${aid}/medical-hold"
              as: Clinician
          trigger:
            - call: "POST /edt/admissions/${aid}/clear-hold"
              as: Clinician
          assert:
            - "Admission.${aid}.clinical_status == ADMITTED"
            - "Admission.${aid}.level_of_care == RESIDENTIAL"

      - name: authorization_denial_appeal_cycle
        grounds:
          - state_machines.InsuranceAuthorization.APPROVED_to_DENIED
          - state_machines.InsuranceAuthorization.DENIED_to_APPEALED
          - state_machines.InsuranceAuthorization.APPEALED_to_DENIED
        distinguishing_aspect: |
          On the InsuranceAuthorization entity (different entity than Admission): a true
          cycle PENDING->DENIED->APPEALED->DENIED via appeal and re-review, returning the
          authorization to DENIED after a second DENY decision - a revision/negotiation loop.
        test_recipe:
          setup:
            - "A PENDING authorization for an admission."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat F", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id }
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 7 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "DENY" }
              as: UtilizationReviewer
            - call: "POST /edt/authorizations/${authid}/appeal"
              as: UtilizationReviewer
          trigger:
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "DENY" }
              as: UtilizationReviewer
          assert:
            - "InsuranceAuthorization.${authid}.status == DENIED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: discharge_cascade_depth3_mealplan_risk_posture
        grounds:
          - state_machines.Admission.DISCHARGE_PENDING_to_DISCHARGED
          - state_machines.MealPlan.ACTIVE_to_CLOSED
          - calculations.nutritional_risk_score
          - calculations.medical_stability_posture
        distinguishing_aspect: |
          Depth-3 cascade from the discharge trigger: discharge -> MealPlan ACTIVE->CLOSED
          (hop1) -> that close reconciles Patient.nutritional_risk_score (hop2) -> the new
          score recomputes Patient.medical_stability_posture (hop3). Each link is caused
          by the previous, not by discharge directly. With provisional 44 and rate 0.95,
          reconciled = 44 - 38 = 6.0 -> STABLE.
        test_recipe:
          setup:
            - "An ADMITTED patient (provisional 44) with an ACTIVE meal plan at 0.95 compliance, a FINALIZED discharge plan and a WAIVED family program; admission moved to DISCHARGE_PENDING."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat G", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid: $.data.id }
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
