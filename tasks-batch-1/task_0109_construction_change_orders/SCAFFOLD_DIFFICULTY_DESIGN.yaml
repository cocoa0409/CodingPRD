          while billed == scheduled + 1 (600001) is rejected. Boundary is <= on
          scheduled_value_cents.
        test_recipe:
          setup:
            - "Project + SOV 001 sched 600000; PayApplication 1 created (ev 1) with a single line billing exactly 600000 this period (prev 0)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "BndP", owner_user_id: "owner-1", original_contract_sum_cents: 1000000, default_retainage_pct: 0.10 }
