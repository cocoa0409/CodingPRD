# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (non-difficulty claims)
# Breadth probe: entities, state machines, calculations, validations, endpoints,
# errors, RBAC, cross-cutting layers, consistency model.
# Boot abbreviations recur: program/store/agreement(submit+accept)/product.
# =============================================================================
scaffold_corner_design:
  # ============================ ENTITIES ============================
  - section: entities
    instances:
      - name: program_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Program.fields.promo_min_gap_days, entities.Program.fields.min_payout_cents, entities.Program.fields.default_settlement_cadence]
        distinguishing_aspect: "Omitting every optional input on POST /programs applies the declared defaults verbatim."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
          trigger:
            - { call: "POST /programs", payload: { name: "Defaults Co" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
          assert:
            - "Program.${prog}: status == ACTIVE, promo_min_gap_days == 1, min_payout_cents == 5000, default_settlement_cadence == WEEKLY, version == 1, id is a bare UUID"

      - name: store_create_missing_required_rejected
        claim_type: required_fields
        grounds: [entities.Store.fields.total_facings, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required total_facings is a 400, not a default."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
          trigger:
            - { call: "POST /stores", payload: { name: "NoFacings", store_code: "NF1" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: agreement_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.StoreAgreement.fields.markdown_liability, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "markdown_liability 'SPLIT' is not in {JOBBER, RETAILER, SHARED} -> 422."
        test_recipe:
          setup: ["program + store exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "EnumCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "EnumStore", store_code: "EN1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
          trigger:
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000, markdown_liability: "SPLIT" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_ENUM (http 422)"

      - name: agreement_create_duplicate_live_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_AGREEMENT_EXISTS]"]
        distinguishing_aspect: "Second live agreement for the same (program, store) is rejected while the first is DRAFT."
        test_recipe:
          setup: ["one DRAFT agreement for (prog, store)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "DupCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "DupStore", store_code: "DP1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
          trigger:
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.30, shrink_retailer_share_pct: 0.6, restock_value_cap_cents: 60000 }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_AGREEMENT_EXISTS (http 409)"

      - name: get_nonexistent_agreement_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
          trigger:
            - { call: "GET /agreements/00000000-0000-0000-0000-000000000000", payload: {}, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

      - name: product_create_status_input_ignored
        claim_type: system_fields
        grounds: [entities.Product.fields.status]
        distinguishing_aspect: "Client-supplied status on create is ignored; server initializes ACTIVE."
        test_recipe:
          setup: ["program exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "SysFieldCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
          trigger:
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "SYS-001", name: "Sys Test", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12, status: "DISCONTINUED" }, as: JobberAdmin, captures: { prod: "$.data.id" } }
          assert:
            - "Product.${prod}.status == ACTIVE — the injected status field was ignored"

      - name: inventory_balance_auto_created_on_confirm
        claim_type: computed_fields
        grounds: [entities.InventoryBalance, state_machines.ServiceVisit.COUNTS_SUBMITTED_to_CONFIRMED]
        distinguishing_aspect: "No POST endpoint exists for balances; the first confirmed restock auto-creates the (agreement, product) row with reorder_point copied from the product."
        test_recipe:
          setup: ["ACTIVE agreement; product units_per_facing 12; visit submitted restock 40"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "BalCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "BalStore", store_code: "BL1", total_facings: 60 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "BAL-001", name: "Balance Item", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route B", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { visit: "$.data.id" } }
            - { call: "POST /service-visits/${visit}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-1" }
            - { call: "POST /service-visits/${visit}/submit-counts", payload: { lines: [ { product_id: "${prod}", counted_units: 0, restock_units: 40 } ] }, as: RouteDriver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /service-visits/${visit}/confirm", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "GET /inventory-balances", payload: { store_agreement_id: "${agr}", product_id: "${prod}" }, as: JobberAdmin }
          assert:
            - "exactly one InventoryBalance row exists for the pair"
            - "row: on_hand_units == 40, lifetime_delivered_units == 40, reorder_point_units == 12, stock_posture == NORMAL"

      - name: scan_event_has_no_version_fields
        claim_type: immutability
        grounds: [entities.ScanEvent]
        distinguishing_aspect: "ScanEvent is common_fields: false — responses carry id and created_at but no version/updated_at."
        test_recipe:
          setup: ["ACTIVE agreement with directive 200"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "ImmutableCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "ImmStore", store_code: "IM1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "IMM-001", name: "Immutable Item", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
          trigger:
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 1, scanned_at: "2026-08-01T09:00:00Z", client_event_id: "imm-1" }, as: RetailerManager, as_user_id: "${store}", captures: { scan: "$.data.id" } }
          assert:
            - "ScanEvent.${scan} response contains id and created_at and does NOT contain version or updated_at"

      - name: list_pagination_envelope_defaults
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Default limit 10 / offset 0 are applied and echoed in meta with total_count and has_more."
        test_recipe:
          setup: ["program with 3 products"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "PageCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "PG-1", name: "P1", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 10 }, as: JobberAdmin }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "PG-2", name: "P2", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 10 }, as: JobberAdmin }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "PG-3", name: "P3", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 10 }, as: JobberAdmin }
          trigger:
            - { call: "GET /products", payload: { program_id: "${prog}" }, as: JobberAdmin }
          assert:
            - "response_type == 'array'; meta.limit == 10; meta.offset == 0; meta.total_count == 3; meta.has_more == false; len(data) == 3"

  # ============================ STATE MACHINES ============================
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.StoreAgreement, state_machines.ServiceVisit, state_machines.AuditCount, state_machines.Promotion, state_machines.MarkdownAuthorization, state_machines.SeasonalSet]
        distinguishing_aspect: "Every stateful entity lands in its declared initial state on creation."
        test_recipe:
          setup: ["ACTIVE agreement with directive; route drv-1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "InitCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "InitStore", store_code: "IN1", total_facings: 60 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id", agr_status: "$.data.status" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "INI-001", name: "Init Item", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route I", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
          trigger:
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { visit: "$.data.id", visit_status: "$.data.status" } }
            - { call: "POST /audit-counts", payload: { store_agreement_id: "${agr}", scope: "FULL" }, as: JobberAdmin, captures: { aud: "$.data.id", aud_status: "$.data.status" } }
            - { call: "POST /promotions", payload: { program_id: "${prog}", product_id: "${prod}", name: "Init Promo", depth_pct: 0.10, jobber_funding_pct: 0.5, start_date: "2026-08-01", end_date: "2026-08-05" }, as: JobberAdmin, captures: { promo: "$.data.id", promo_status: "$.data.status" } }
            - { call: "POST /markdown-authorizations", payload: { store_agreement_id: "${agr}", product_id: "${prod}", auth_type: "MARKDOWN", units: 1, markdown_price_cents: 180 }, as: JobberAdmin, captures: { md: "$.data.id", md_status: "$.data.status" } }
            - { call: "POST /seasonal-sets", payload: { store_agreement_id: "${agr}", theme: "Back to School", category: "SEASONAL", allocated_facings: 2, set_window_start: "2026-08-05", set_window_end: "2026-08-10", teardown_deadline: "2026-08-20" }, as: JobberAdmin, captures: { ss: "$.data.id", ss_status: "$.data.status" } }
          assert:
            - "agr_status == DRAFT; visit_status == SCHEDULED; aud_status == SCHEDULED; promo_status == DRAFT; md_status == REQUESTED; ss_status == PLANNED"

      - name: agreement_submit_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.StoreAgreement.DRAFT_to_PENDING_ACCEPTANCE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "submit on PENDING_ACCEPTANCE is not idempotent — second call is a 409."
        test_recipe:
          setup: ["agreement created and submitted once"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "TwiceCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "TwiceStore", store_code: "TW1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
          trigger:
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE (http 409); status remains PENDING_ACCEPTANCE"

      - name: agreement_terminated_is_locked_down
        claim_type: terminal_lockdown
        grounds: [state_machines.StoreAgreement, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "No transition fires from TERMINATED."
        test_recipe:
          setup: ["agreement terminated from ACTIVE (no live statements/seasonal sets)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "TermCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "TermStore", store_code: "TM1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /agreements/${agr}/terminate", payload: {}, as: JobberAdmin }
          trigger:
            - { call: "POST /agreements/${agr}/resume", payload: {}, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_ALREADY_TERMINAL (http 409); status remains TERMINATED"

      - name: visit_confirm_before_counts_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ServiceVisit.COUNTS_SUBMITTED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "confirm from CHECKED_IN (counts never submitted) is rejected."
        test_recipe:
          setup: ["ACTIVE agreement; route; visit checked in but no counts submitted"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "ConfCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "ConfStore", store_code: "CF1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /routes", payload: { program_id: "${prog}", name: "Route C", assigned_driver_id: "drv-1" }, as: JobberAdmin, captures: { route: "$.data.id" } }
            - { call: "POST /service-visits", payload: { route_id: "${route}", store_agreement_id: "${agr}", scheduled_date: "2026-08-01" }, as: JobberAdmin, captures: { visit: "$.data.id" } }
            - { call: "POST /service-visits/${visit}/check-in", payload: {}, as: RouteDriver, as_user_id: "drv-1" }
          trigger:
            - { call: "POST /service-visits/${visit}/confirm", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE; visit remains CHECKED_IN"

      - name: promo_cancel_after_end_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Promotion, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ENDED is terminal for cancel."
        test_recipe:
          setup: ["promo [2026-08-01, 2026-08-05] scheduled (ACTIVE immediately since clock in window) then ended"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "PromoTerm" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "PT-1", name: "Promo Item", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 10 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /promotions", payload: { program_id: "${prog}", product_id: "${prod}", name: "Flash", depth_pct: 0.10, jobber_funding_pct: 0.5, start_date: "2026-08-01", end_date: "2026-08-05" }, as: JobberAdmin, captures: { promo: "$.data.id" } }
            - { call: "POST /promotions/${promo}/schedule", payload: {}, as: JobberAdmin }
            - { call: "POST /promotions/${promo}/end", payload: {}, as: JobberAdmin }
          trigger:
            - { call: "POST /promotions/${promo}/cancel", payload: {}, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_STATE; status remains ENDED"

      - name: settlement_pay_before_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SettlementStatement.APPROVED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "pay from FINALIZED (skipping approve) is rejected — the approval chain cannot be skipped."
        test_recipe:
          setup: ["ACTIVE agreement; 10 scans @200; statement generated and FINALIZED (clock past period end)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "SkipCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "SkipStore", store_code: "SK1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000, estimated_shrink_rate: 0.0 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
