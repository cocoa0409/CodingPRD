  - rule_id: transitive_cascade
    instances:

      - name: insurance_revocation_cascades_through_lease_legs_crew_and_period
        grounds:
          - state_machines.InsuranceCertificate[ACTIVE -> REVOKED]
          - state_machines.LeaseAgreement[ACTIVE -> SUSPENDED]
          - state_machines.FlightLeg[SCHEDULED -> CANCELLED_LESSOR]
          - calculations.crew_duty_and_block_exposure
          - calculations.monthly_utilization_charge
          - endpoints[POST /wetlease/insurance-certificates/{certificateId}/revoke]
        distinguishing_aspect: |
          Four causal hops from one write: revoking the lease's only ACTIVE certificate (hop 1)
          suspends the lease with suspension_reason INSURANCE_LAPSED (hop 2), which cancels both
          SCHEDULED legs as CANCELLED_LESSOR / INSURANCE_LAPSE (hop 3), which in turn zeroes both
          crew members' rolling duty and block exposure and recomputes the OPEN period under the
          PROVISIONAL variant, converting a 720-minute duty exposure and a 2,400,000-cent base
          charge into 0 minutes and a 960,000-cent provisional charge carrying a 1,440,000-cent
          lessor-attributable shortfall credit (hop 4). Stopping at hop 2 or hop 3 leaves the
          crew counters at 720/510 and the credit at 0.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-09-01T00:00:00Z."
            - "ACTIVE lease on G-ACMI: rate 480000, mgh 5, shortfall_credit_pct 0.60, term 2026-09-01..2026-12-31, single ACTIVE certificate COI-88001."
            - "Two SCHEDULED REVENUE legs: L1 on 2026-09-03 with 330 scheduled block minutes and L2 on 2026-09-05 with 180."
            - "The clock is then advanced to 2026-09-06T00:00:00Z so both legs fall inside the half-open 7-day duty window, giving each crew member rolling_duty_minutes_7d 720 = (330 + 105) + (180 + 105) and rolling_block_minutes_28d 510."
