# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Luggage & Bag Storage Network — Expert. 9 rule_ids x 2 instances = 18.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: booking_estimate_vs_final_late_pickup
        grounds:
          - calculations.booking_estimate
          - calculations.booking_final_settlement
          - state_machines.Booking.STORED_to_COMPLETED
          - entities.Booking.fields.final_total_cents
        distinguishing_aspect: |
          On the Booking domain, estimate (forward-looking on requested dates) and final settlement
          (chronological on actual late pickup) yield 7200 vs 10200 for identical bags — a 3000 late-fee divergence.
        test_recipe:
          setup:
            - "Host (fee 20%), traveler, PREMIUM plan (200/bag/day), OPEN location (rate 500, oversize 300, cap 10)."
            - "Booking of 3 bags (one oversize, dim 160) for 2026-06-10..2026-06-13 (3 billable days), dropped off, then picked up one day late on 2026-06-14."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "Bounce Host", email: "h@x.com", platform_fee_bps: 2000, max_concurrent_bookings: 5 }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T One" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "PREMIUM", per_bag_coverage_cents: 50000, premium_cents_per_bag_day: 200 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "Downtown", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-13", bags: [ { declared_value_cents: 20000, dimension_sum_cm: 100 }, { declared_value_cents: 20000, dimension_sum_cm: 100 }, { declared_value_cents: 20000, dimension_sum_cm: 160 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id, est: $.data.estimated_total_cents }
            - call: "GET /bookings/${bkg_id}/bags"
              as: Host
              as_user_id: "${host_id}"
              captures: { bag0: "$.data[0].id", bag1: "$.data[1].id", bag2: "$.data[2].id" }
            - call: "POST /bookings/${bkg_id}/dropoff"
              payload: { seals: [ { bag_id: "${bag0}", seal_code: "SL-0", photo_url: "http://p/0" }, { bag_id: "${bag1}", seal_code: "SL-1", photo_url: "http://p/1" }, { bag_id: "${bag2}", seal_code: "SL-2", photo_url: "http://p/2" } ] }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${bkg_id}/pickup"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
              captures: { final: $.data.final_total_cents, ov: $.data.overage_days, lf: $.data.late_fee_cents }
          assert:
            - "Booking.${bkg_id}.estimated_total_cents == 7200"
            - "Booking.${bkg_id}.final_total_cents == 10200"
            - "Booking.${bkg_id}.overage_days == 1"
            - "Booking.${bkg_id}.late_fee_cents == 3000"

      - name: payout_provisional_vs_final_net_after_claim
        grounds:
          - calculations.payout_provisional
          - calculations.claim_award
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Payout.fields.net_cents
        distinguishing_aspect: |
          On the Payout domain, provisional_net (6720, before any claim) vs final_net (4720, after a 2000 claim
          approval) diverge for the same gross — a different entity domain than the Booking-cost dual variant.
        test_recipe:
          setup:
            - "Completed late booking from booking_estimate_vs_final_late_pickup (gross 8400, fee 1680, provisional net 6720)."
            - "One DAMAGE claim on a bag, reviewed and approved for 2000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "Bounce Host", email: "h@x.com", platform_fee_bps: 2000, max_concurrent_bookings: 5 }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T One" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "PREMIUM", per_bag_coverage_cents: 50000, premium_cents_per_bag_day: 200 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "Downtown", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-13", bags: [ { declared_value_cents: 20000, dimension_sum_cm: 100 }, { declared_value_cents: 20000, dimension_sum_cm: 100 }, { declared_value_cents: 20000, dimension_sum_cm: 160 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id }
            - call: "GET /bookings/${bkg_id}/bags"
              as: Host
              as_user_id: "${host_id}"
              captures: { bag0: "$.data[0].id", bag1: "$.data[1].id", bag2: "$.data[2].id" }
            - call: "POST /bookings/${bkg_id}/dropoff"
              payload: { seals: [ { bag_id: "${bag0}", seal_code: "SL-0", photo_url: "http://p/0" }, { bag_id: "${bag1}", seal_code: "SL-1", photo_url: "http://p/1" }, { bag_id: "${bag2}", seal_code: "SL-2", photo_url: "http://p/2" } ] }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${bkg_id}/pickup"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /payouts"
              payload: {}
              as: PlatformAdmin
              captures: { payout_id: "$.data[0].id", net_before: "$.data[0].net_cents" }
          trigger:
            - call: "POST /bookings/${bkg_id}/claims"
              payload: { bag_id: "${bag0}", reason: "DAMAGE", description: "scuffed", claimed_amount_cents: 2000 }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/decide"
              payload: { decision: "APPROVE", approved_amount_cents: 2000 }
              as: PlatformAdmin
            - call: "GET /payouts/${payout_id}"
              payload: {}
              as: PlatformAdmin
              captures: { net_after: $.data.net_cents, ded: $.data.claim_deduction_cents }
          assert:
            - "Payout net_cents == 6720 immediately after pickup (provisional_net)"
            - "Payout.${payout_id}.claim_deduction_cents == 2000 after approval"
            - "Payout.${payout_id}.net_cents == 4720 (final_net)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: booking_estimate_multiinput_nonlinear_mode_a
        grounds:
          - calculations.booking_estimate
          - entities.Booking.fields.estimated_total_cents
          - entities.Booking.fields.oversize_count
        distinguishing_aspect: |
          Mode (a): estimate = per_bag_day_rate*bag_count*days + oversize_surcharge*oversize_count*days +
          premium*bag_count*days — >=3 inputs with a conditional oversize term and a tier-selected premium.
        test_recipe:
          setup:
            - "OPEN location rate 500, oversize 300; PREMIUM plan premium 200; 3 bags (1 oversize) x 3 days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "PREMIUM", per_bag_coverage_cents: 50000, premium_cents_per_bag_day: 200 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "Downtown", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
          trigger:
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-13", bags: [ { declared_value_cents: 20000, dimension_sum_cm: 100 }, { declared_value_cents: 20000, dimension_sum_cm: 100 }, { declared_value_cents: 20000, dimension_sum_cm: 160 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id, est: $.data.estimated_total_cents, oc: $.data.oversize_count }
          assert:
            - "Booking.${bkg_id}.oversize_count == 1"
            - "Booking.${bkg_id}.billable_days == 3"
            - "Booking.${bkg_id}.estimated_total_cents == 7200"

      - name: host_payout_fee_round_per_booking_then_sum_mode_b
        grounds:
          - calculations.payout_provisional
          - entities.Host.fields.payout_balance_cents
          - entities.Payout.fields.platform_fee_cents
        distinguishing_aspect: |
          Mode (b): fee rounds PER BOOKING then sums into the host balance. Two 4500-gross payouts at 12.5%
          each round 562.5 -> 563, so balance is 2*(4500-563) = 7874, NOT 7875 (sum-then-round).
        test_recipe:
          setup:
            - "Host fee 12.5% (1250 bps); NONE plan; OPEN location rate 500."
            - "Two on-time 1-bag/9-day bookings (gross 4500 each), both picked up on 2026-06-19 and released after the 2-day hold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com", platform_fee_bps: 1250 }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "NONE", per_bag_coverage_cents: 0, premium_cents_per_bag_day: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "Downtown", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v1: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-19", bags: [ { declared_value_cents: 10000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v1}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg1: $.data.id }
            - call: "GET /bookings/${bkg1}/bags"
              as: Host
              as_user_id: "${host_id}"
              captures: { b1bag: "$.data[0].id" }
            - call: "POST /bookings/${bkg1}/dropoff"
              payload: { seals: [ { bag_id: "${b1bag}", seal_code: "K1", photo_url: "http://p/1" } ] }
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /locations/${loc_id}"
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v2: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-19", bags: [ { declared_value_cents: 10000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v2}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg2: $.data.id }
            - call: "GET /bookings/${bkg2}/bags"
              as: Host
              as_user_id: "${host_id}"
              captures: { b2bag: "$.data[0].id" }
            - call: "POST /bookings/${bkg2}/dropoff"
              payload: { seals: [ { bag_id: "${b2bag}", seal_code: "K2", photo_url: "http://p/2" } ] }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${bkg1}/pickup"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${bkg2}/pickup"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "GET /payouts"
              payload: {}
              as: PlatformAdmin
              captures: { po1: "$.data[0].id", po2: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /payouts/${po1}/release"
              payload: {}
              as: PlatformAdmin
            - call: "POST /payouts/${po2}/release"
              payload: {}
              as: PlatformAdmin
            - call: "GET /hosts/${host_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal: $.data.payout_balance_cents }
          assert:
            - "Each Payout.platform_fee_cents == 563 (round_half_up of 562.5)"
            - "Host.${host_id}.payout_balance_cents == 7874"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_needs_info_review_cycle
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Claim.NEEDS_INFO_to_UNDER_REVIEW
          - entities.Claim.fields.status
        distinguishing_aspect: |
          Claim cycles UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW (a genuine
          revision loop on the Claim entity), returning to UNDER_REVIEW after two request-info/resubmit rounds.
        test_recipe:
          setup:
            - "A COMPLETED booking with PREMIUM insurance and an OPEN claim on one of its bags."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "PREMIUM", per_bag_coverage_cents: 50000, premium_cents_per_bag_day: 200 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-11", bags: [ { declared_value_cents: 40000, dimension_sum_cm: 100 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id }
            - call: "GET /bookings/${bkg_id}/bags"
              as: Host
              as_user_id: "${host_id}"
              captures: { bag0: "$.data[0].id" }
            - call: "POST /bookings/${bkg_id}/dropoff"
              payload: { seals: [ { bag_id: "${bag0}", seal_code: "K1", photo_url: "http://p/1" } ] }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${bkg_id}/pickup"
              payload: {}
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${bkg_id}/claims"
              payload: { bag_id: "${bag0}", reason: "DAMAGE", description: "cracked", claimed_amount_cents: 10000 }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/request-info"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/resubmit"
              payload: {}
              as: Traveler
              as_user_id: "${traveler_id}"
            - call: "POST /claims/${claim_id}/request-info"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/resubmit"
              payload: {}
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { st: $.data.status }
          assert:
            - "Claim.${claim_id}.status == UNDER_REVIEW after the second resubmit"
            - "The claim traversed NEEDS_INFO twice, proving the UNDER_REVIEW<->NEEDS_INFO loop"

      - name: extension_branch_confirm_extends_booking
        grounds:
          - state_machines.Extension.REQUESTED_to_CONFIRMED
          - state_machines.Extension.REQUESTED_to_REJECTED
          - entities.Booking.fields.check_out_date
          - entities.Extension.fields.added_cost_cents
        distinguishing_aspect: |
          Extension is a REQUESTED->{CONFIRMED, REJECTED} fork on a different entity than Claim; the CONFIRM
          branch mutates booking.check_out_date and estimated_total, while the REJECT branch leaves them unchanged.
        test_recipe:
          setup:
            - "A STORED booking (3 bags/1 oversize, 2026-06-10..2026-06-13, estimate 7200) with a REQUESTED extension to 2026-06-16."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hosts"
              payload: { display_name: "H", email: "h@x.com" }
              as: PlatformAdmin
              captures: { host_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "t@x.com", full_name: "T" }
              as: Anonymous
              captures: { traveler_id: $.data.id }
            - call: "POST /insurance-plans"
              payload: { tier: "PREMIUM", per_bag_coverage_cents: 50000, premium_cents_per_bag_day: 200 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /hosts/${host_id}/locations"
              payload: { name: "D", address: "1 Main", daily_bag_capacity: 10, oversize_capacity: 5, per_bag_day_rate_cents: 500, oversize_surcharge_cents_per_day: 300 }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /locations/${loc_id}/status"
              payload: { to_status: "OPEN" }
              as: Host
              as_user_id: "${host_id}"
              captures: { loc_v: $.data.version }
            - call: "POST /bookings"
              payload: { location_id: "${loc_id}", traveler_id: "${traveler_id}", insurance_plan_id: "${plan_id}", check_in_date: "2026-06-10", check_out_date: "2026-06-13", bags: [ { declared_value_cents: 20000, dimension_sum_cm: 100 }, { declared_value_cents: 20000, dimension_sum_cm: 100 }, { declared_value_cents: 20000, dimension_sum_cm: 160 } ], expected_location_version: "${loc_v}" }
              as: Traveler
              as_user_id: "${traveler_id}"
              captures: { bkg_id: $.data.id }
            - call: "GET /bookings/${bkg_id}/bags"
              as: Host
              as_user_id: "${host_id}"
              captures: { bag0: "$.data[0].id", bag1: "$.data[1].id", bag2: "$.data[2].id" }
            - call: "POST /bookings/${bkg_id}/dropoff"
              payload: { seals: [ { bag_id: "${bag0}", seal_code: "K0", photo_url: "http://p/0" }, { bag_id: "${bag1}", seal_code: "K1", photo_url: "http://p/1" }, { bag_id: "${bag2}", seal_code: "K2", photo_url: "http://p/2" } ] }
              as: Host
              as_user_id: "${host_id}"
            - call: "POST /bookings/${bkg_id}/extensions"
              payload: { new_check_out_date: "2026-06-16" }
              as: Traveler
              as_user_id: "${traveler_id}"
