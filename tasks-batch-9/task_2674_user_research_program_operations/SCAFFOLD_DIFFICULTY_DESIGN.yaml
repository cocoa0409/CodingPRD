  - rule_id: cross_entity_state_dependency
    instances:
      - name: readout_delivery_gated_on_cited_finding_publication
        grounds:
          - validations[priority=28]
          - state_machines.Readout.DRAFT_to_DELIVERED
          - state_machines.Finding.EVIDENCE_LOCKED_to_PUBLISHED
          - entities.Study.fields.execution_status
