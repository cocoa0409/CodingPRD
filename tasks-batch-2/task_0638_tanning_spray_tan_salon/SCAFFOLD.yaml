# =============================================================================
# Task 0638 — Tanning & Spray-Tan Salon (Palm Beach Tan style) seed tables
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  638. Tanning & Spray-Tan Salon (Palm Beach Tan style): bed/booth & spray-room
  inventory, unlimited-membership tier & EFT billing, FDA UV exposure-schedule &
  skin-type limits, minor-consent & frequency rules, product retail & upgrade,
  session timing & equipment maintenance, freeze/cancel, walk-in vs reservation

domain_name: tanning-spray-tan-salon
api_prefix: /

# =============================================================================
# Complexity Profile (§0.1–§0.3) — Expert band
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on Member.version for upgrade-supersede race
    - cascading_side_effects        # session -> equipment -> dose ledger -> membership
    - dual_variant_calculation      # provisional vs settled proration; estimate vs actual dose
    - rate_threshold_triggers       # FDA cooldown, weekly minor frequency cap, dose escalation
    - derived_field_reconciliation  # member account_credit, salon deferred_revenue, product stock

  entity_topology: flat
  # Peer entities (Member, Equipment, SprayRoom, Session, Membership, Product …)
  # linked by foreign keys; URL paths are mostly flat with /members/{id} ownership.

  state_machine_shape: parallel
  # Membership carries two independent dimensions (lifecycle_status × billing_status);
  # Session has a cyclic reserve→cancel→reserve loop; Equipment is compound/guarded.

  relationship_patterns:
    - one_to_many        # Member -> Session, Member -> ConsentRecord
    - cross_aggregate    # Session references Equipment OR SprayRoom + Member + Membership

  role_model: peer_roles
  # Member (entity_backed), FrontDeskStaff / SalonManager / BillingSystem (opaque).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MembershipPlan
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only, never a business-decision input." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits." }
      - { name: tier_code, type: enum, source: input, description: "Tier identifier.", constraints: "one of {BASIC, PREMIUM, UNLIMITED}; unique across plans" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring EFT amount in cents.", constraints: ">= 0" }
      - { name: retail_discount_pct, type: number, source: input, description: "Fractional product discount for members on this plan (e.g. 0.10).", constraints: "0 <= x <= 0.5", default: 0 }
      - { name: weekly_uv_session_cap, type: integer, source: input, description: "Max COMPLETED+IN_PROGRESS UV sessions per ISO week for adult members on this plan; 0 means unlimited.", default: 0 }
      - { name: includes_spray, type: boolean, source: input, description: "Whether spray-room sessions are covered by the membership at no per-session charge.", default: true }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member legal name." }
      - { name: date_of_birth, type: datetime, source: input, description: "DOB (date at 00:00:00Z); drives minor classification against the logical clock." }
      - { name: skin_type, type: enum, source: input, description: "Fitzpatrick skin type.", constraints: "one of {I, II, III, IV, V, VI}" }
      - { name: plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; the member's current plan (null only when no membership ever activated)." }
      - { name: is_minor, type: boolean, source: computed, description: "True when (clock_now - date_of_birth) < 18 years; recomputed on read against the logical clock." }
      - { name: completed_uv_session_count, type: integer, source: computed, description: "Count of this member's Sessions with kind=UV and status=COMPLETED; drives FDA dose escalation.", default: 0 }
      - { name: account_credit_cents, type: integer, source: computed, description: "Prepaid/refund credit balance in cents; increased by freeze proration credit, decreased by retail purchases that draw on it.", default: 0 }
      - { name: status, type: enum, source: system, description: "Lifecycle dimension.", constraints: "one of {PENDING, ACTIVE, FROZEN, CANCELLED}" }
      - { name: billing_status, type: enum, source: system, description: "Billing dimension (parallel to status).", constraints: "one of {CURRENT, PAST_DUE, SUSPENDED}", default: CURRENT }
      - { name: cycle_anchor_at, type: datetime, source: system, description: "Start instant of the current 30-day billing cycle; advanced by each successful EFT charge." }
      - { name: frozen_at, type: datetime, source: system, description: "Instant the member entered FROZEN; null when not frozen." }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display label (e.g. 'Level 3 Bed #2')." }
      - { name: kind, type: enum, source: input, description: "Hardware class.", constraints: "one of {BED, BOOTH}" }
      - { name: max_exposure_seconds, type: integer, source: input, description: "FDA equipment ceiling for a single session on this unit.", constraints: ">= 1" }
      - { name: turnaround_seconds, type: integer, source: input, description: "Mandatory cool-down/cleaning buffer applied AFTER a session's end before the unit is bookable again.", default: 600 }
      - { name: status, type: enum, source: system, description: "Availability lifecycle.", constraints: "one of {AVAILABLE, IN_USE, MAINTENANCE, RETIRED}", default: AVAILABLE }
      - { name: sessions_since_service, type: integer, source: computed, description: "COMPLETED sessions on this unit since last maintenance reset; triggers mandatory service at the threshold.", default: 0 }

  - name: SprayRoom
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display label (e.g. 'Spray Room A')." }
      - { name: ventilation_buffer_seconds, type: integer, source: input, description: "Ventilation buffer applied AFTER a spray session's end before the room is bookable again.", default: 300 }
      - { name: status, type: enum, source: system, description: "Availability lifecycle.", constraints: "one of {AVAILABLE, IN_USE, MAINTENANCE, RETIRED}", default: AVAILABLE }

  - name: ConsentRecord
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; consent grant instant." }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the minor member this consent authorizes." }
      - { name: guardian_name, type: string, source: input, description: "Name of consenting parent/guardian." }
      - { name: expires_at, type: datetime, source: input, description: "Consent validity end instant; a UV reservation is gated on clock_now < expires_at." }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member taking the session." }
      - { name: kind, type: enum, source: input, description: "Service class.", constraints: "one of {UV, SPRAY}" }
      - { name: booking_mode, type: enum, source: input, description: "How the slot was obtained.", constraints: "one of {RESERVATION, WALK_IN}" }
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; the UV unit booked (required when kind=UV, null when kind=SPRAY)." }
      - { name: spray_room_id, type: string, source: input, description: "FK -> SprayRoom.id; the spray room booked (required when kind=SPRAY, null when kind=UV)." }
      - { name: start_at, type: datetime, source: input, description: "Half-open interval start instant for the booking." }
      - { name: requested_seconds, type: integer, source: input, description: "Requested exposure/spray duration in seconds; for UV must satisfy the dose schedule.", constraints: ">= 1" }
      - { name: end_at, type: datetime, source: computed, description: "start_at + requested_seconds (half-open interval end)." }
      - { name: allowed_seconds, type: integer, source: computed, description: "FDA-permitted exposure ceiling for this UV session at reservation time (skin/dose/equipment min); copied from the dose calc, null for SPRAY." }
      - { name: status, type: enum, source: system, description: "Session lifecycle.", constraints: "one of {RESERVED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW}" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit.", constraints: "unique across products" }
      - { name: name, type: string, source: input, description: "Display name (e.g. 'Bronzing Lotion 8oz')." }
      - { name: unit_price_cents, type: integer, source: input, description: "List price per unit in cents.", constraints: ">= 0" }
      - { name: initial_stock, type: integer, source: input, description: "Stock at creation; conserved against stock_on_hand + units_sold.", constraints: ">= 0" }
      - { name: stock_on_hand, type: integer, source: computed, description: "Remaining sellable units; decremented on sale, restored on refund.", default: 0 }
      - { name: units_sold, type: integer, source: computed, description: "Cumulative units sold (net of refunds); stock_on_hand + units_sold == initial_stock invariant.", default: 0 }

  - name: RetailOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; purchasing member (member discount sourced from member's plan)." }
      - { name: lines, type: array, source: input, description: "Array of {product_id, quantity}; product_id references Product.id, quantity >= 1." }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of per-line discounted, per-line-rounded totals (round-per-line-then-sum order is pinned)." }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Portion of subtotal covered by member.account_credit_cents (min of credit balance and subtotal)." }
      - { name: charged_cents, type: integer, source: computed, description: "subtotal_cents - credit_applied_cents; amount taken via EFT/card." }
      - { name: status, type: enum, source: system, description: "Order lifecycle.", constraints: "one of {PAID, REFUNDED}", default: PAID }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; charge attempt instant." }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the charged member." }
      - { name: kind, type: enum, source: input, description: "Charge type.", constraints: "one of {EFT_DUES, RETAIL, UPGRADE}" }
      - { name: amount_cents, type: integer, source: input, description: "Charge amount in cents.", constraints: ">= 0" }
      - { name: outcome, type: enum, source: input, description: "Processor result fed by the billing simulator.", constraints: "one of {SUCCEEDED, DECLINED}" }
      - { name: retail_order_id, type: string, source: input, description: "FK -> RetailOrder.id; set only when kind=RETAIL, else null." }

  - name: SalonLedger
    parent: null
    common_fields: true
    fields:
      - { name: singleton_key, type: string, source: input, description: "Fixed value 'SALON' enforcing a single ledger row.", constraints: "must equal 'SALON'; unique" }
      - { name: deferred_revenue_cents, type: integer, source: computed, description: "Outstanding freeze credits owed to members; rises when a freeze issues account_credit, falls when that credit is drawn or cancellation reverses it.", default: 0 }
      - { name: collected_dues_cents, type: integer, source: computed, description: "Cumulative SUCCEEDED EFT_DUES amounts collected.", default: 0 }
      - { name: collected_retail_cents, type: integer, source: computed, description: "Cumulative charged_cents collected on PAID retail orders (net of refunds).", default: 0 }

  - name: MaintenanceLog
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID; identity only." }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; service instant." }
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; the serviced unit." }
      - { name: reason, type: enum, source: input, description: "Why service occurred.", constraints: "one of {SCHEDULED_THRESHOLD, MANUAL}" }
      - { name: sessions_at_service, type: integer, source: input, description: "Equipment.sessions_since_service value captured at service time (before reset to 0)." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Member lifecycle dimension (parallel to billing_status) ----
  - entity: Member
    field: status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /members/{memberId}/activate"
        actor: BillingSystem
        preconditions:
          - "A SUCCEEDED EFT_DUES Payment exists for this member's first cycle (ERR_DUES_NOT_PAID)"
          - "member.plan_id resolves to an existing MembershipPlan (ERR_PLAN_NOT_FOUND)"
        side_effects:
          - "billing_status set to CURRENT"
          - "cycle_anchor_at set to clock_now"
          - "SalonLedger.collected_dues_cents += first charge amount (recorded when the EFT_DUES payment succeeded)"

      - from: ACTIVE
        to: FROZEN
        trigger: "POST /members/{memberId}/freeze"
        actor: Member
        preconditions:
          - "member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
          - "no Session for this member in status RESERVED or IN_PROGRESS (ERR_OPEN_SESSION_EXISTS)"
        side_effects:
          - "frozen_at set to clock_now"
          - "freeze_proration_credit computed and ADDED to member.account_credit_cents"
          - "SalonLedger.deferred_revenue_cents += same freeze_proration_credit (conserved with account_credit)"
          - "increments Member.version by 1"

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /members/{memberId}/unfreeze"
        actor: Member
        preconditions:
          - "member.status == FROZEN (ERR_MEMBER_NOT_FROZEN)"
        side_effects:
          - "frozen_at cleared to null"
          - "cycle_anchor_at advanced by the frozen duration (clock_now - frozen_at) so remaining cycle days are preserved"
          - "increments Member.version by 1"

      - from: [ACTIVE, FROZEN, PENDING]
        to: CANCELLED
        trigger: "POST /members/{memberId}/cancel"
        actor: Member
        preconditions:
          - "member.status in {PENDING, ACTIVE, FROZEN} (ERR_MEMBER_ALREADY_CANCELLED)"
          - "no Session for this member in status RESERVED or IN_PROGRESS (ERR_OPEN_SESSION_EXISTS)"
        side_effects:
          - "If member.status == FROZEN at cancel time: COMPENSATION — the freeze credit is reversed: member.account_credit_cents -= the freeze_proration_credit recorded at freeze AND SalonLedger.deferred_revenue_cents -= the same amount (deferred-revenue invariant restored)"
          - "increments Member.version by 1"

  # ---- Member billing dimension (parallel to lifecycle status) ----
  - entity: Member
    field: billing_status
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: CURRENT
        trigger: "POST /_billing/run-eft (charge SUCCEEDED)"
        actor: BillingSystem
        preconditions:
          - "member.status == ACTIVE (frozen members are skipped) (ERR_MEMBER_NOT_ACTIVE)"
          - "clock_now >= member.cycle_anchor_at + 30 days (ERR_CYCLE_NOT_DUE)"
        side_effects:
          - "Payment(kind=EFT_DUES, outcome=SUCCEEDED, amount=plan.monthly_fee_cents) created"
          - "cycle_anchor_at advanced by 30 days"
          - "SalonLedger.collected_dues_cents += plan.monthly_fee_cents"

      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /_billing/run-eft (charge DECLINED)"
        actor: BillingSystem
        preconditions:
          - "member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
          - "clock_now >= member.cycle_anchor_at + 30 days (ERR_CYCLE_NOT_DUE)"
        side_effects:
          - "Payment(kind=EFT_DUES, outcome=DECLINED) created"
          - "cycle_anchor_at NOT advanced"

      - from: PAST_DUE
        to: CURRENT
        trigger: "POST /_billing/run-eft (retry SUCCEEDED)"
        actor: BillingSystem
        preconditions:
          - "member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
        side_effects:
          - "Payment(kind=EFT_DUES, outcome=SUCCEEDED) created"
          - "cycle_anchor_at advanced by 30 days"
          - "SalonLedger.collected_dues_cents += plan.monthly_fee_cents"

      - from: PAST_DUE
        to: SUSPENDED
        trigger: "POST /_billing/run-eft (clock past grace window)"
        actor: BillingSystem
        preconditions:
          - "member.billing_status == PAST_DUE (ERR_NOT_PAST_DUE)"
          - "clock_now >= member.cycle_anchor_at + 30 days + 7 days grace (ERR_GRACE_NOT_ELAPSED)"
        side_effects:
          - "No new Payment created"
          - "Member becomes ineligible to reserve sessions (enforced as a precondition on session creation)"

  # ---- Session lifecycle (cyclic: RESERVED -> CANCELLED -> a fresh RESERVED is allowed) ----
  - entity: Session
    field: status
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: RESERVED
        to: IN_PROGRESS
        trigger: "POST /sessions/{sessionId}/start"
        actor: FrontDeskStaff
        preconditions:
          - "session.status == RESERVED (ERR_SESSION_NOT_RESERVED)"
          - "for UV: Equipment.status == AVAILABLE (ERR_EQUIPMENT_UNAVAILABLE)"
          - "for SPRAY: SprayRoom.status == AVAILABLE (ERR_ROOM_UNAVAILABLE)"
        side_effects:
          - "for UV: Equipment.status -> IN_USE"
          - "for SPRAY: SprayRoom.status -> IN_USE"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /sessions/{sessionId}/complete"
        actor: FrontDeskStaff
        preconditions:
          - "session.status == IN_PROGRESS (ERR_SESSION_NOT_IN_PROGRESS)"
        side_effects:
          - "for UV: CASCADE — Equipment.status -> AVAILABLE; Equipment.sessions_since_service += 1; Member.completed_uv_session_count += 1; if Equipment.sessions_since_service reaches SERVICE_THRESHOLD, Equipment.status -> MAINTENANCE (overrides the AVAILABLE set above)"
          - "for SPRAY: SprayRoom.status -> AVAILABLE"

      - from: RESERVED
        to: CANCELLED
        trigger: "POST /sessions/{sessionId}/cancel"
        actor: Member
        preconditions:
          - "session.status == RESERVED (ERR_SESSION_NOT_RESERVED)"
        side_effects:
          - "frees the reserved interval on the unit so a new RESERVED session may reuse the same slot (cyclic re-reservation)"

      - from: RESERVED
        to: NO_SHOW
        trigger: "POST /sessions/{sessionId}/no-show"
        actor: FrontDeskStaff
        preconditions:
          - "session.status == RESERVED (ERR_SESSION_NOT_RESERVED)"
          - "clock_now >= session.start_at (ERR_TOO_EARLY_FOR_NO_SHOW)"
        side_effects:
          - "frees the reserved interval; does NOT increment completed_uv_session_count"

  # ---- Equipment availability (compound/guarded) ----
  - entity: Equipment
    field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: IN_USE
        trigger: "system (UV Session start)"
        actor: system
        preconditions:
          - "Equipment.status == AVAILABLE (ERR_EQUIPMENT_UNAVAILABLE)"
        side_effects: []

      - from: IN_USE
        to: AVAILABLE
        trigger: "system (UV Session complete, threshold not reached)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_USE
        to: MAINTENANCE
        trigger: "system (UV Session complete, sessions_since_service reaches SERVICE_THRESHOLD)"
        actor: system
        preconditions:
          - "Equipment.sessions_since_service == SERVICE_THRESHOLD after the completing session"
        side_effects:
          - "Equipment becomes unbookable until serviced"

      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /equipment/{equipmentId}/service"
        actor: SalonManager
        preconditions:
          - "Equipment.status == MAINTENANCE (ERR_EQUIPMENT_NOT_IN_MAINTENANCE)"
        side_effects:
          - "MaintenanceLog created with reason and sessions_at_service"
          - "Equipment.sessions_since_service reset to 0"

      - from: [AVAILABLE, MAINTENANCE]
        to: RETIRED
        trigger: "POST /equipment/{equipmentId}/retire"
        actor: SalonManager
        preconditions:
          - "Equipment.status in {AVAILABLE, MAINTENANCE} (ERR_EQUIPMENT_IN_USE)"
        side_effects:
          - "Equipment permanently unbookable"

  # ---- RetailOrder (forward sale + compensating refund) ----
  - entity: RetailOrder
    field: status
    initial_state: PAID
    terminal_states: [REFUNDED]
    transitions:
      - from: PAID
        to: REFUNDED
        trigger: "POST /retail-orders/{orderId}/refund"
        actor: FrontDeskStaff
        preconditions:
          - "order.status == PAID (ERR_ORDER_ALREADY_REFUNDED)"
        side_effects:
          - "COMPENSATION — for each line: Product.stock_on_hand += quantity AND Product.units_sold -= quantity (stock invariant restored)"
          - "member.account_credit_cents += order.credit_applied_cents (credit returned)"
          - "SalonLedger.collected_retail_cents -= order.charged_cents"
          - "SalonLedger.deferred_revenue_cents += order.credit_applied_cents (re-deferred)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: upgrade-stale-member
    parent_entity: Member
    write_endpoint: "POST /members/{memberId}/upgrade"
    occ_field: "expected_member_version"
    description: |
      Upgrading a Member to a higher tier requires the client to pin the
      Member.version it last observed. If another upgrade (which legitimately
      supersedes the prior plan and bumps Member.version) has already been
      applied, the current request carries a stale version and is rejected.
      Stated purely as a stale-version precondition over Member.version — not
      in terms of overlapping requests.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: uv_dose_allowed_seconds
    trigger: "UV Session reservation (POST /sessions, kind=UV); copied into Session.allowed_seconds"
    algorithm: threshold
    formula: |
      if member.skin_type == "I":
        reject with ERR_SKIN_TYPE_UV_PROHIBITED   # Fitzpatrick I always burns
      base = SKIN_BASE_SECONDS[member.skin_type]
      cap  = SKIN_CAP_SECONDS[member.skin_type]
      escalated = base + member.completed_uv_session_count * STEP_SECONDS
      allowed_seconds = min(escalated, cap, equipment.max_exposure_seconds)
      # boundary: requested_seconds <= allowed_seconds passes; requested_seconds == allowed_seconds + 1 fails
      if session.requested_seconds > allowed_seconds:
        reject with ERR_DOSE_EXCEEDS_LIMIT
    input_set: "member.skin_type, member.completed_uv_session_count (only COMPLETED UV sessions counted), equipment.max_exposure_seconds"
    constants:
      STEP_SECONDS: 30
      SKIN_BASE_SECONDS: { II: 90, III: 120, IV: 180, V: 240, VI: 300 }
      SKIN_CAP_SECONDS:  { II: 240, III: 480, IV: 600, V: 720, VI: 900 }
    precision: "integer seconds, no rounding"
    variants:
      - name: reservation_estimate
        when: "at reservation, before any session in the cycle is completed"
        difference: "uses completed_uv_session_count as observed at reservation time (forward-looking estimate of the member's escalation tier)"
      - name: start_time_actual
        when: "re-checked at POST /sessions/{id}/start"
        difference: "re-evaluates with completed_uv_session_count as-of start; if intervening sessions COMPLETED, the actual escalated allowance is higher than the reservation-time estimate, so a previously-borderline requested_seconds remains valid (actual >= estimate)"

  - name: member_weekly_frequency
    trigger: "UV Session reservation (POST /sessions, kind=UV)"
    algorithm: aggregation
    formula: |
      iso_week = ISO-8601 week containing session.start_at (Mon 00:00:00Z .. next Mon 00:00:00Z, half-open)
      week_count = count Sessions where member_id == member.id
                     AND kind == UV
                     AND status IN {RESERVED, IN_PROGRESS, COMPLETED}   # NO_SHOW and CANCELLED excluded
                     AND start_at within iso_week
      # Minor cap is regulatory and overrides the plan cap.
      if member.is_minor:
        if week_count >= MINOR_WEEKLY_UV_CAP: reject ERR_MINOR_FREQUENCY_EXCEEDED
      else:
        cap = plan.weekly_uv_session_cap
        if cap != 0 and week_count >= cap: reject ERR_FREQUENCY_CAP_EXCEEDED
      # FDA cooldown: >= 24h between consecutive UV sessions
      last = latest Session (member_id, kind=UV, status IN {IN_PROGRESS, COMPLETED}) by start_at, tie-break created_at ASC
      if last exists and (session.start_at - last.start_at) < COOLDOWN_SECONDS:
        reject ERR_UV_COOLDOWN_NOT_ELAPSED
    input_set: "member's UV Sessions in the target ISO week; excludes NO_SHOW and CANCELLED from the week count"
    constants:
      MINOR_WEEKLY_UV_CAP: 1
      COOLDOWN_SECONDS: 86400
    precision: "integer counts; integer seconds"

  - name: freeze_proration_credit
    trigger: "POST /members/{memberId}/freeze (Member ACTIVE -> FROZEN)"
    algorithm: tiered_pricing
    formula: |
      daily_rate_cents = round_half_up(plan.monthly_fee_cents / 30)
      elapsed_days = floor((clock_now - member.cycle_anchor_at) / 86400 seconds)   # whole days used
      elapsed_days = clamp(elapsed_days, 0, 30)
      unused_days = 30 - elapsed_days
      freeze_proration_credit = daily_rate_cents * unused_days
      # This exact integer is added to member.account_credit_cents AND SalonLedger.deferred_revenue_cents.
    input_set: "member.plan.monthly_fee_cents, member.cycle_anchor_at, clock_now"
    constants:
      CYCLE_DAYS: 30
    precision: "round_half_up to whole cents for daily_rate_cents; credit is exact integer cents"

  - name: upgrade_proration_charge
    trigger: "POST /members/{memberId}/upgrade (tier change, Member ACTIVE)"
    algorithm: tiered_pricing
    formula: |
      if new_plan.monthly_fee_cents <= current_plan.monthly_fee_cents:
        reject ERR_NOT_AN_UPGRADE   # downgrades/lateral not handled here
      old_daily = round_half_up(current_plan.monthly_fee_cents / 30)
      new_daily = round_half_up(new_plan.monthly_fee_cents / 30)
      elapsed_days = clamp(floor((clock_now - member.cycle_anchor_at)/86400), 0, 30)
      remaining_days = 30 - elapsed_days
      upgrade_charge_cents = (new_daily - old_daily) * remaining_days
      # Charged as Payment(kind=UPGRADE). member.plan_id := new_plan.id on SUCCEEDED.
    input_set: "current_plan.monthly_fee_cents, new_plan.monthly_fee_cents, member.cycle_anchor_at, clock_now"
    constants:
      CYCLE_DAYS: 30
    precision: "round_half_up to whole cents for daily rates; charge is exact integer cents"

  - name: retail_order_total
    trigger: "POST /retail-orders (order creation)"
    algorithm: aggregation
    formula: |
      disc = member.plan.retail_discount_pct   # 0 if member has no active plan discount
      # ORDER PINNED: discount + round PER LINE, THEN sum. (Sum-then-round is explicitly NOT used.)
      subtotal_cents = 0
      for line in order.lines (process in the order submitted in the request array):
        product = Product[line.product_id]
        line_total = round_half_up(product.unit_price_cents * line.quantity * (1 - disc))
        subtotal_cents += line_total
      credit_applied_cents = min(member.account_credit_cents, subtotal_cents)
      charged_cents = subtotal_cents - credit_applied_cents
    input_set: "order.lines (each {product_id, quantity}), Product.unit_price_cents, member.plan.retail_discount_pct, member.account_credit_cents"
    constants: {}
    precision: "round_half_up per line BEFORE summation; subtotal is the sum of already-rounded line totals"
    variants:
      - name: per_line_then_sum
        when: "this scaffold's pinned order"
        difference: "each line discounted and rounded independently, then summed — differs from sum-then-round by up to a cent (e.g. 4945 vs 4946 for the worked example)"

  - name: equipment_service_due
    trigger: "UV Session complete (Equipment IN_USE -> AVAILABLE/MAINTENANCE)"
    algorithm: threshold
    formula: |
      Equipment.sessions_since_service += 1   # incremented on COMPLETED UV sessions only
      if Equipment.sessions_since_service >= SERVICE_THRESHOLD:
        Equipment.status := MAINTENANCE        # boundary: the Nth completing session (== threshold) trips it
      else:
        Equipment.status := AVAILABLE
    input_set: "COMPLETED UV sessions on this equipment since last service reset"
    constants:
      SERVICE_THRESHOLD: 2
    precision: "integer count; trips at >= threshold (the 2nd completed UV session since service trips MAINTENANCE)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7; for Member-owned writes the X-User-ID must equal the path member_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resources exist, validated left-to-right (member, then equipment/spray_room/session/plan/product/order)"
    error_id: "ERR_MEMBER_NOT_FOUND / ERR_EQUIPMENT_NOT_FOUND / ERR_ROOM_NOT_FOUND / ERR_SESSION_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_PRODUCT_NOT_FOUND / ERR_ORDER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints referencing an id"

  - priority: 4
    category: business_constraint
    check: "Request body shape valid: required fields present, enums in range, requested_seconds >= 1, kind/equipment-vs-room consistency (UV needs equipment_id and no spray_room_id; SPRAY needs spray_room_id and no equipment_id)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /sessions, POST /members, POST /retail-orders, POST /equipment, POST /spray-rooms"

  - priority: 5
    category: state
    check: "Target resource in correct state for the transition (member status, session status, equipment status, order status)"
    error_id: "ERR_MEMBER_NOT_ACTIVE / ERR_MEMBER_NOT_FROZEN / ERR_SESSION_NOT_RESERVED / ERR_SESSION_NOT_IN_PROGRESS / ERR_EQUIPMENT_UNAVAILABLE / ERR_ROOM_UNAVAILABLE / ERR_ORDER_ALREADY_REFUNDED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-entity gating: a UV/SPRAY reservation requires member.status == ACTIVE AND member.billing_status != SUSPENDED (suspended members cannot book)"
    error_id: ERR_MEMBER_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 7
    category: business_safety
    check: "Skin type I is UV-prohibited (Fitzpatrick I always burns)"
    error_id: ERR_SKIN_TYPE_UV_PROHIBITED
    http_status: 403
    applies_to: "POST /sessions (kind=UV)"

  - priority: 8
    category: business_safety
    check: "Minor members need a valid, unexpired ConsentRecord to reserve a UV session (clock_now < ConsentRecord.expires_at)"
    error_id: ERR_MINOR_CONSENT_REQUIRED
    http_status: 403
    applies_to: "POST /sessions (kind=UV, member.is_minor)"

  - priority: 9
    category: business_safety
    check: "Minor weekly UV frequency cap (1/ISO-week) — regulatory, overrides plan cap"
    error_id: ERR_MINOR_FREQUENCY_EXCEEDED
    http_status: 403
    applies_to: "POST /sessions (kind=UV, member.is_minor)"

  - priority: 10
    category: business_safety
    check: "FDA UV cooldown: >= 24h since member's last IN_PROGRESS/COMPLETED UV session start_at"
    error_id: ERR_UV_COOLDOWN_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /sessions (kind=UV)"

  - priority: 11
    category: business_safety
    check: "FDA dose ceiling: requested_seconds <= uv_dose_allowed_seconds (skin/escalation/equipment min)"
    error_id: ERR_DOSE_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /sessions (kind=UV)"

  - priority: 12
    category: business_constraint
    check: "Plan weekly UV cap for adults (when plan.weekly_uv_session_cap != 0)"
    error_id: ERR_FREQUENCY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /sessions (kind=UV, adult member)"

  - priority: 13
    category: business_temporal
    check: "UV-bed temporal overlap: requested [start_at, end_at) plus the unit's turnaround_seconds buffer after end must not collide with any RESERVED/IN_PROGRESS session on the same equipment. Adjacency at the exact buffer boundary (half-open) is allowed."
    error_id: ERR_EQUIPMENT_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /sessions (kind=UV)"

  - priority: 14
    category: business_temporal
    check: "Spray-room temporal overlap: requested [start_at, end_at) plus the room's ventilation_buffer_seconds after end must not collide with any RESERVED/IN_PROGRESS session on the same room. Adjacency at the exact buffer boundary (half-open) is allowed."
    error_id: ERR_ROOM_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /sessions (kind=SPRAY)"

  - priority: 15
    category: business_fiscal
    check: "EFT cycle not yet due (clock_now < cycle_anchor_at + 30 days) when running dues"
    error_id: ERR_CYCLE_NOT_DUE
    http_status: 409
    applies_to: "POST /_billing/run-eft"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- MembershipPlan ----
  - method: POST
    path: "/membership-plans"
    description: "Create a membership plan."
    roles: [SalonManager]
    code: 201
    input: [tier_code, monthly_fee_cents, "retail_discount_pct?", "weekly_uv_session_cap?", "includes_spray?"]
    output: MembershipPlan
    side_effects: []

  - method: GET
    path: "/membership-plans"
    description: "List membership plans."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "MembershipPlan[]"
    side_effects: []

  - method: GET
    path: "/membership-plans/{planId}"
    description: "Get a membership plan."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: []
    output: MembershipPlan
    side_effects: []

  # ---- Member ----
  - method: POST
    path: "/members"
    description: "Register a member (status PENDING) and create the first EFT_DUES charge attempt via the billing simulator handled separately."
    roles: [FrontDeskStaff]
    code: 201
    input: [full_name, date_of_birth, skin_type, plan_id]
    output: Member
    side_effects: ["status=PENDING, billing_status=CURRENT, account_credit_cents=0, completed_uv_session_count=0"]

  - method: GET
    path: "/members"
    description: "List members (filterable by plan_id)."
    roles: [SalonManager, FrontDeskStaff]
    code: 200
    input: ["plan_id?", "limit?", "offset?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/members/{memberId}"
    description: "Get a member (is_minor, completed_uv_session_count, account_credit recomputed)."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/members/{memberId}/activate"
    description: "Activate a PENDING member once first dues are paid."
    roles: [BillingSystem]
    code: 200
    input: []
    output: Member
    side_effects: ["status PENDING->ACTIVE; cycle_anchor_at=clock_now; billing_status=CURRENT"]

  - method: POST
    path: "/members/{memberId}/freeze"
    description: "Freeze an ACTIVE membership; issues prorated account credit."
    roles: [Member]
    code: 200
    input: [expected_member_version]
    output: Member
    side_effects: ["status ACTIVE->FROZEN; account_credit_cents += freeze_proration_credit; SalonLedger.deferred_revenue_cents += same; increments Member.version by 1"]

  - method: POST
    path: "/members/{memberId}/unfreeze"
    description: "Resume a FROZEN membership; preserves remaining cycle days."
    roles: [Member]
    code: 200
    input: [expected_member_version]
    output: Member
    side_effects: ["status FROZEN->ACTIVE; cycle_anchor_at advanced by frozen duration; increments Member.version by 1"]

  - method: POST
    path: "/members/{memberId}/upgrade"
    description: "Upgrade a member to a higher-fee plan; charges prorated difference. OCC-guarded on Member.version."
    roles: [Member]
    code: 200
    input: [new_plan_id, expected_member_version]
    output: Member
    side_effects: ["Payment(kind=UPGRADE) created; on SUCCEEDED member.plan_id := new_plan_id; increments Member.version by 1"]

  - method: POST
    path: "/members/{memberId}/cancel"
    description: "Cancel a membership; reverses any outstanding freeze credit."
    roles: [Member]
    code: 200
    input: [expected_member_version]
    output: Member
    side_effects: ["status->CANCELLED; if was FROZEN, freeze credit reversed from account_credit and SalonLedger.deferred_revenue; increments Member.version by 1"]

  # ---- ConsentRecord (FK reverse-reachability for Member) ----
  - method: POST
    path: "/members/{id}/consents"
    description: "Record guardian consent for a minor member."
    roles: [FrontDeskStaff]
    code: 201
    input: [guardian_name, expires_at]
    output: ConsentRecord
    side_effects: []

  - method: GET
    path: "/members/{id}/consents"
    description: "List consent records for a member (reverse-reachability for ConsentRecord.member_id)."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConsentRecord[]"
    side_effects: []

  # ---- Equipment ----
  - method: POST
    path: "/equipment"
    description: "Create a UV bed/booth unit."
    roles: [SalonManager]
    code: 201
    input: [name, kind, max_exposure_seconds, "turnaround_seconds?"]
    output: Equipment
    side_effects: ["status=AVAILABLE; sessions_since_service=0"]

  - method: GET
    path: "/equipment"
    description: "List equipment units."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "Equipment[]"
    side_effects: []

  - method: GET
    path: "/equipment/{equipmentId}"
    description: "Get an equipment unit."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  - method: POST
    path: "/equipment/{equipmentId}/service"
    description: "Service a unit in MAINTENANCE and reset its session counter."
    roles: [SalonManager]
    code: 200
    input: [reason]
    output: Equipment
    side_effects: ["status MAINTENANCE->AVAILABLE; MaintenanceLog created; sessions_since_service=0"]

  - method: POST
    path: "/equipment/{equipmentId}/retire"
    description: "Permanently retire a unit."
    roles: [SalonManager]
    code: 200
    input: []
    output: Equipment
    side_effects: ["status->RETIRED"]

  - method: GET
    path: "/equipment/{id}/maintenance-logs"
    description: "List maintenance logs for a unit (reverse-reachability for MaintenanceLog.equipment_id)."
    roles: [SalonManager, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: "MaintenanceLog[]"
    side_effects: []

  # ---- SprayRoom ----
  - method: POST
    path: "/spray-rooms"
    description: "Create a spray-tan room."
    roles: [SalonManager]
    code: 201
    input: [name, "ventilation_buffer_seconds?"]
    output: SprayRoom
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/spray-rooms"
    description: "List spray rooms."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "SprayRoom[]"
    side_effects: []

  - method: GET
    path: "/spray-rooms/{roomId}"
    description: "Get a spray room."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: []
    output: SprayRoom
    side_effects: []

  # ---- Session (walk-in vs reservation; UV vs SPRAY) ----
  - method: POST
    path: "/sessions"
    description: "Create a session (RESERVATION or WALK_IN). Runs the full UV/spray validation cascade and dose calc."
    roles: [FrontDeskStaff, Member]
    code: 201
    input: [member_id, kind, booking_mode, "equipment_id?", "spray_room_id?", start_at, requested_seconds]
    output: Session
    side_effects: ["status=RESERVED; end_at computed; for UV allowed_seconds set from uv_dose_allowed_seconds"]

  - method: GET
    path: "/sessions"
    description: "List sessions (filterable by member_id, equipment_id, spray_room_id)."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: ["member_id?", "equipment_id?", "spray_room_id?", "limit?", "offset?"]
    output: "Session[]"
    side_effects: []

  - method: GET
    path: "/sessions/{sessionId}"
    description: "Get a session."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: POST
    path: "/sessions/{sessionId}/start"
    description: "Begin a reserved session (re-checks dose; marks equipment/room IN_USE)."
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: Session
    side_effects: ["status RESERVED->IN_PROGRESS; equipment/room -> IN_USE"]

  - method: POST
    path: "/sessions/{sessionId}/complete"
    description: "Complete an in-progress session; cascades equipment service counter and UV dose count."
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: Session
    side_effects: ["status IN_PROGRESS->COMPLETED; for UV: equipment AVAILABLE/MAINTENANCE, sessions_since_service+=1, member.completed_uv_session_count+=1; for SPRAY: room->AVAILABLE"]

  - method: POST
    path: "/sessions/{sessionId}/cancel"
    description: "Cancel a reserved session, freeing the slot."
    roles: [FrontDeskStaff, Member]
    code: 200
    input: []
    output: Session
    side_effects: ["status RESERVED->CANCELLED; slot freed"]

  - method: POST
    path: "/sessions/{sessionId}/no-show"
    description: "Mark a reserved past-due session as no-show."
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: Session
    side_effects: ["status RESERVED->NO_SHOW; slot freed; no dose count increment"]

  # ---- Product & RetailOrder ----
  - method: POST
    path: "/products"
    description: "Create a retail product."
    roles: [SalonManager]
    code: 201
    input: [sku, name, unit_price_cents, initial_stock]
    output: Product
    side_effects: ["stock_on_hand=initial_stock; units_sold=0"]

  - method: GET
    path: "/products"
    description: "List products."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/products/{productId}"
    description: "Get a product."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: POST
    path: "/retail-orders"
    description: "Create a paid retail order; applies member discount, draws account credit, decrements stock."
    roles: [FrontDeskStaff, Member]
    code: 201
    input: [member_id, lines]
    output: RetailOrder
    side_effects: ["subtotal/credit_applied/charged computed; Product.stock_on_hand-=qty, units_sold+=qty; member.account_credit_cents-=credit_applied; SalonLedger updated; status=PAID"]

  - method: GET
    path: "/retail-orders"
    description: "List retail orders (filterable by member_id)."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: "RetailOrder[]"
    side_effects: []

  - method: GET
    path: "/retail-orders/{orderId}"
    description: "Get a retail order."
    roles: [SalonManager, FrontDeskStaff, Member]
    code: 200
    input: []
    output: RetailOrder
    side_effects: []

  - method: POST
    path: "/retail-orders/{orderId}/refund"
    description: "Refund a paid order; restores stock and returns applied credit."
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: RetailOrder
    side_effects: ["status PAID->REFUNDED; stock restored; account_credit returned; SalonLedger reversed"]

  # ---- Payment (FK reverse-reachability for Member + RetailOrder) ----
  - method: GET
    path: "/payments"
    description: "List payments (filterable by member_id and retail_order_id; reverse-reachability for Payment.member_id and Payment.retail_order_id)."
    roles: [SalonManager, FrontDeskStaff, BillingSystem]
    code: 200
    input: ["member_id?", "retail_order_id?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []

  - method: GET
    path: "/payments/{paymentId}"
    description: "Get a single payment (establishes the payments collection segment)."
    roles: [SalonManager, FrontDeskStaff, BillingSystem]
    code: 200
    input: []
    output: Payment
    side_effects: []

  # ---- SalonLedger (singleton) ----
  - method: GET
    path: "/salon-ledger"
    description: "Get the singleton salon ledger (deferred revenue, collected dues/retail)."
    roles: [SalonManager]
    code: 200
    input: []
    output: SalonLedger
    side_effects: []

  # ---- Test-driving endpoints (/_ namespace) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; the logical clock never falls back to wall-clock time. All deadline/cooldown/cycle/consent rules read this clock."
    roles: [SalonManager, BillingSystem]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["logical clock set to to_iso8601"]

  - method: POST
    path: "/_billing/charge-first-dues"
    description: "Billing simulator: record the first EFT_DUES Payment for a PENDING member with a pinned outcome (drives activate precondition). On SUCCEEDED, SalonLedger.collected_dues_cents += plan.monthly_fee_cents."
    roles: [BillingSystem]
    code: 201
    input: [member_id, outcome]
    output: Payment
    side_effects: ["Payment(kind=EFT_DUES) created with pinned outcome"]

  - method: POST
    path: "/_billing/run-eft"
    description: "Billing simulator: run the recurring EFT charge for one member with a pinned processor outcome; advances billing_status per the §1.2 billing dimension."
    roles: [BillingSystem]
    code: 200
    input: [member_id, outcome]
    output: Member
    side_effects: ["Payment(kind=EFT_DUES) created; billing_status/cycle_anchor_at transitions per §1.2"]

  - method: POST
    path: "/_billing/set-upgrade-outcome"
    description: "Billing simulator: pin the processor outcome for the NEXT POST /members/{id}/upgrade for a member (default SUCCEEDED if never set)."
    roles: [BillingSystem]
    code: 200
    input: [member_id, outcome]
    output: "{ member_id: string, outcome: string }"
    side_effects: ["next upgrade charge outcome pinned"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_AUTH_HEADERS, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or Member acting on a member_id other than its own X-User-ID" }
  # --- not found ---
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "MembershipPlan id does not exist" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "Equipment id does not exist" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "SprayRoom id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "Session id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist (incl. a line product_id)" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "RetailOrder id does not exist" }
  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, requested_seconds < 1, or UV/SPRAY kind inconsistent with equipment_id/spray_room_id presence" }
  # --- state ---
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Operation requires member.status == ACTIVE" }
  - { id: ERR_MEMBER_NOT_FROZEN, http: 409, condition: "Unfreeze requires member.status == FROZEN" }
  - { id: ERR_MEMBER_ALREADY_CANCELLED, http: 409, condition: "Member already CANCELLED" }
  - { id: ERR_DUES_NOT_PAID, http: 409, condition: "Activate requires a SUCCEEDED first EFT_DUES Payment" }
  - { id: ERR_OPEN_SESSION_EXISTS, http: 409, condition: "Freeze/cancel blocked by a RESERVED or IN_PROGRESS session" }
  - { id: ERR_SESSION_NOT_RESERVED, http: 409, condition: "Transition requires session.status == RESERVED" }
  - { id: ERR_SESSION_NOT_IN_PROGRESS, http: 409, condition: "Complete requires session.status == IN_PROGRESS" }
  - { id: ERR_TOO_EARLY_FOR_NO_SHOW, http: 409, condition: "No-show requires clock_now >= session.start_at" }
  - { id: ERR_EQUIPMENT_UNAVAILABLE, http: 409, condition: "Start requires Equipment.status == AVAILABLE" }
  - { id: ERR_ROOM_UNAVAILABLE, http: 409, condition: "Start requires SprayRoom.status == AVAILABLE" }
  - { id: ERR_EQUIPMENT_NOT_IN_MAINTENANCE, http: 409, condition: "Service requires Equipment.status == MAINTENANCE" }
  - { id: ERR_EQUIPMENT_IN_USE, http: 409, condition: "Retire blocked while Equipment.status == IN_USE" }
  - { id: ERR_ORDER_ALREADY_REFUNDED, http: 409, condition: "Refund requires order.status == PAID" }
  # --- billing fiscal ---
  - { id: ERR_CYCLE_NOT_DUE, http: 409, condition: "EFT run before cycle_anchor_at + 30 days" }
  - { id: ERR_NOT_PAST_DUE, http: 409, condition: "Suspend path requires billing_status == PAST_DUE" }
  - { id: ERR_GRACE_NOT_ELAPSED, http: 409, condition: "Suspend requires clock_now >= cycle_anchor_at + 30d + 7d grace" }
  - { id: ERR_NOT_AN_UPGRADE, http: 409, condition: "Upgrade target fee <= current plan fee" }
  # --- booking gating / safety ---
  - { id: ERR_MEMBER_NOT_BOOKABLE, http: 409, condition: "Booking requires member ACTIVE and billing_status != SUSPENDED" }
  - { id: ERR_SKIN_TYPE_UV_PROHIBITED, http: 403, condition: "Skin type I cannot use UV equipment" }
  - { id: ERR_MINOR_CONSENT_REQUIRED, http: 403, condition: "Minor UV reservation without a valid unexpired ConsentRecord" }
  - { id: ERR_MINOR_FREQUENCY_EXCEEDED, http: 403, condition: "Minor exceeded 1 UV session per ISO week" }
  - { id: ERR_FREQUENCY_CAP_EXCEEDED, http: 409, condition: "Adult exceeded plan.weekly_uv_session_cap" }
  - { id: ERR_UV_COOLDOWN_NOT_ELAPSED, http: 409, condition: "Less than 24h since last UV session start_at" }
  - { id: ERR_DOSE_EXCEEDS_LIMIT, http: 422, condition: "requested_seconds > uv_dose_allowed_seconds" }
  # --- temporal overlap ---
  - { id: ERR_EQUIPMENT_SLOT_CONFLICT, http: 409, condition: "UV booking collides with another reservation+turnaround on the same equipment" }
  - { id: ERR_ROOM_SLOT_CONFLICT, http: 409, condition: "Spray booking collides with another reservation+ventilation on the same room" }
  # --- concurrency ---
  - { id: ERR_STALE_MEMBER_VERSION, http: 412, condition: "expected_member_version != Member.version on upgrade/freeze/unfreeze/cancel" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "End customer; acts on their own membership and books their own sessions/orders."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /members/{id}/freeze — freeze own membership"
      - "POST /members/{id}/unfreeze — unfreeze own membership"
      - "POST /members/{id}/upgrade — upgrade own plan"
      - "POST /members/{id}/cancel — cancel own membership"
    shared_operations:
      - "POST /sessions — book own session (shared with FrontDeskStaff)"
      - "POST /sessions/{id}/cancel — cancel own reserved session (shared with FrontDeskStaff)"
      - "POST /retail-orders — buy products (shared with FrontDeskStaff)"
      - "GET reads on own member, plans, equipment, rooms, products, sessions, orders, consents"

  - name: FrontDeskStaff
    description: "Salon front-desk operator; registers members, runs sessions, sells retail."
    identity: "opaque"
    exclusive_operations:
      - "POST /members — register a member"
      - "POST /members/{id}/consents — record minor consent"
      - "POST /sessions/{id}/start — begin a session"
      - "POST /sessions/{id}/complete — complete a session"
      - "POST /sessions/{id}/no-show — mark no-show"
      - "POST /retail-orders/{id}/refund — refund an order"
    shared_operations:
      - "POST /sessions — book a session for a member (shared with Member)"
      - "POST /sessions/{id}/cancel — cancel a reserved session (shared with Member)"
      - "POST /retail-orders — create a retail order (shared with Member)"
      - "GET reads on members, plans, equipment, rooms, products, sessions, orders, consents, maintenance-logs, payments"

  - name: SalonManager
    description: "Manager; configures plans/equipment/rooms/products and services equipment."
    identity: "opaque"
    exclusive_operations:
      - "POST /membership-plans — create plan"
      - "POST /equipment — create equipment"
      - "POST /equipment/{id}/service — service equipment"
      - "POST /equipment/{id}/retire — retire equipment"
      - "POST /spray-rooms — create spray room"
      - "POST /products — create product"
      - "GET /salon-ledger — read salon ledger"
    shared_operations:
      - "POST /_clock/set_current_utc — set logical clock (shared with BillingSystem)"
      - "GET reads on all collections"

  - name: BillingSystem
    description: "Automated billing actor (opaque); runs EFT, activates members, pins charge outcomes."
    identity: "opaque"
    exclusive_operations:
      - "POST /members/{id}/activate — activate after dues"
      - "POST /_billing/charge-first-dues — record first dues"
      - "POST /_billing/run-eft — run recurring EFT"
      - "POST /_billing/set-upgrade-outcome — pin next upgrade outcome"
    shared_operations:
      - "POST /_clock/set_current_utc — set logical clock (shared with SalonManager)"
      - "GET /payments — read payments"
