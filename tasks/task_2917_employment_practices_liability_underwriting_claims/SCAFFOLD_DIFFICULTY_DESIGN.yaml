          - calculations.indemnity_waterfall
          - state_machines.IndemnityPayment.PENDING_APPROVAL_to_APPROVED
          - state_machines.Policy.limit_posture
          - endpoints["POST /epli/indemnity-payments/{payment_id}/approve"]
        distinguishing_aspect: |
          Metric: the insurer_portion_cents of an indemnity payment against
          aggregate_limit_remaining_cents, in whole cents, exercised on
          `POST /epli/indemnity-payments/{payment_id}/approve` — a money-equality metric
          on a third distinct endpoint. Two payments are drafted before either is
          approved: one whose insurer portion is 10000001 (one cent over the remaining
          10000000, which must be refused) and one whose insurer portion is exactly
          10000000 (which must be allowed and must drive limit_posture to EXHAUSTED).
          The check is `insurer_portion > remaining`, not `>=`, so an off-by-one
          implementation rejects the exact-fit payment or accepts the one-cent-over one.
        test_recipe:
          setup:
            - "Chain S: jurisdiction TX (T2), ACTIVE RatePlan, applicant 'Bayline Foods LLC', policy ACTIVE / OPEN for [2026-08-01, 2027-08-01) with aggregate_limit_cents 10000000 and per_claim_retention_cents 2500000."
