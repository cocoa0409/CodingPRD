              as_user_id: "${cust_id}"
          assert:
            - "first create with fresh version: CapacityReservation.${res1_id}.status == PENDING"
            - "line version advanced after first create: ${line_ver_after} == ${line_ver} + 1"
            - "second create replaying stale expected_line_version: response.http_status == 412"
            - "second create: response.error_id == ERR_STALE_VERSION"
            - "line version unchanged by the rejected create: ProductionLine.${line_id}.version == ${line_ver_after}"

      - name: dual_variant_layer_covered
        claim_type: dual_variant
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: dual_variant_calc / bin_energy_nominal_ignores_realized_yield
          rationale: "Both variants of bin_energy_wh exercised there (nominal energy-model invariant to realized run yield); printed vs adjusted covered by printed_vs_adjusted_content_pct."

      - name: cascade_layer_covered
        claim_type: cascade_chain
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / lot_quarantine_recalls_delivery_three_hop
          rationale: "N-level cascade verified end-to-end there (lot -> delivery recall -> confirm blocked), plus the suspend/resume cascade in line_suspend_constrains_reservation_blocks_delivery."

      - name: derived_field_layer_covered
        claim_type: derived_field_reconciliation
        grounds: [complexity_profile.complexity_layers, entities.ProductionLine.fields.committed_capacity_mw]
        excluded_because:
          difficulty_instance: compensating_invariant / line_capacity_buckets_conserved
          rationale: "Derived buckets (committed/reserved/available) asserted after create and after the compensating cancel, reconciling to annual_capacity_mw."

      - name: scheduled_close_quarter_layer_covered
        claim_type: scheduled_actions
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: combinatorial_formula / ramp_exit_requires_yield_and_quarter_gate
          rationale: "POST /v1/_ops/close_quarter's deferred effects (ramp advance, yield recompute, AT_CAPACITY promotion) asserted there; the reservation close-out sweep is asserted in closeout_sweep_completes_reservation_full_forfeit."

  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_reservation_create
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the GET right after create reflects the mutation in full — status PENDING, inputs echoed, computed defaults delivered_mw == 0.0 and deposit_forfeited_usd == 0.0 already materialized."
        test_recipe:
          setup: ["Customer C, series S6, line OH-L3 exist"]
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 125000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "GET /v1/capacity-reservations/${res_id}"
              payload: {}
              as: ContractsOfficer
          assert:
            - "response.http_status == 200"
            - "CapacityReservation.${res_id}.status == PENDING"
            - "CapacityReservation.${res_id}.contracted_mw == 10.0"
            - "CapacityReservation.${res_id}.delivered_mw == 0.0"
            - "CapacityReservation.${res_id}.deposit_forfeited_usd == 0.0"
