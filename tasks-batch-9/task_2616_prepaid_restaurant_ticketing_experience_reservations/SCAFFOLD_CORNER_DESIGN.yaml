      - name: rbac_restaurant_manager_drives_all_fifteen_exclusive_operations
        claim_type: Can perform all exclusive and shared operations
        grounds:
          - roles.RestaurantManager.exclusive_operations
          - state_machines[Service].transitions
          - state_machines[TicketClass].transitions
          - state_machines[Reservation].transitions.CONFIRMED_to_SEATED
          - state_machines[Reservation].transitions.CONFIRMED_to_NO_SHOW
          - calculations.release_run_allocation
        distinguishing_aspect: "Every one of the RestaurantManager's fifteen exclusive writes is executed once, in the only order the state machines permit, on rows belonging to the acting restaurant — catalogue (packages, add-ons, tables), inventory (services, publish, demand-tier both ways, ticket-classes, pause, resume, release-run, service cancel) and floor (assign-table, seat, complete, no-show). Each is asserted through its declared side effect, so a handler that returns 200 without pinning seat_to_utc, without crediting no_show_strikes or without flooring the release allocation fails even though the role check passed."
