  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_requires_active_agent_authorization
        grounds:
          - state_machines.SecuritiesFiling.READY_to_SUBMITTED
          - state_machines.FilingAgentAuthorization.ACTIVE_to_REVOKED
          - errors[ERR_AGENT_NOT_AUTHORIZED]
        distinguishing_aspect: |
          Entity pair SecuritiesFiling x FilingAgentAuthorization: submission is
          gated on the authorization for (issuer, X-User-ID) being ACTIVE;
          revoking it blocks an otherwise valid submit — a different entity pair
          than the sibling instance's SecurityTransaction x ReportingPerson.
        test_recipe:
          setup:
            - "Issuer I with edgar_ccc CCC12345; person P designated ACTIVE at the default clock 2026-08-01"
            - "Purchase dated 2026-08-01 confirmed; auto Form 4 moved to READY"
            - "Authorization for agent_1 created then REVOKED"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /filing-agent-authorizations"
              payload: { issuer_id: "${i_id}", agent_user_id: "agent_1" }
              as: ComplianceOfficer
              captures: { auth_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-01", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_id: $.data.id }
            - call: "POST /transactions/${t_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /filings"
              payload: { reporting_person_id: "${p_id}", form_type: "FORM_4", status: "DRAFT" }
              as: ComplianceOfficer
              captures: { f_id: "$.data[0].id" }
            - call: "POST /filings/${f_id}/ready"
              payload: {}
              as: FilingCoordinator
              as_user_id: "coord_1"
            - call: "POST /filing-agent-authorizations/${auth_id}/revoke"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /filings/${f_id}/submit"
              payload: { edgar_ccc: "CCC12345" }
              as: FilingAgent
              as_user_id: "agent_1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AGENT_NOT_AUTHORIZED (authorization REVOKED gates the filing's READY -> SUBMITTED transition)"

      - name: confirm_requires_active_reporting_person
        grounds:
          - state_machines.SecurityTransaction.INGESTED_to_CONFIRMED
          - state_machines.ReportingPerson.ACTIVE_to_EXITED
          - errors[ERR_PERSON_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair SecurityTransaction x ReportingPerson: confirmation is
          gated on the person's status == ACTIVE; an EXITED person blocks an
          otherwise valid confirm — a different entity pair than the sibling
          instance's SecuritiesFiling x FilingAgentAuthorization.
        test_recipe:
          setup:
            - "Issuer I; person P designated ACTIVE at the default clock 2026-08-01"
            - "Transaction T1 (2026-08-01) confirmed successfully while P is ACTIVE; then P EXITED; transaction T2 (2026-08-01) still INGESTED"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-01", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t1: $.data.id }
            - call: "POST /transactions/${t1}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { ok_status: $.data.status }
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "EXIT" }
              as: ComplianceOfficer
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-01", transaction_code: "P", security_type: "COMMON_STOCK", shares: 50, price_per_share: 11.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /transactions/${t2}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { err: $.data.error_id }
          assert:
            - "ok_status == CONFIRMED (dependency satisfied while person ACTIVE)"
            - "err == ERR_PERSON_NOT_ACTIVE (same transition blocked once the person is EXITED)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: blackout_windows_closed_interval_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_BLACKOUT_WINDOW_OVERLAP]
          - entities.BlackoutWindow.fields.start_date
        distinguishing_aspect: |
          Closed-interval semantics on the BlackoutWindow resource: windows
          [2026-09-28, 2026-10-02] and [2026-10-02, 2026-10-05] conflict because
          they share the single date 2026-10-02 — touching endpoints overlap
          here, unlike the sibling instance's half-open plan windows where
          adjacency is allowed.
        test_recipe:
          setup:
            - "Issuer I; one blackout window [2026-09-28, 2026-10-02] already created"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /blackout-windows"
              payload: { issuer_id: "${i_id}", start_date: "2026-09-28", end_date: "2026-10-02", reason: "Q3 earnings" }
              as: ComplianceOfficer
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /blackout-windows"
              payload: { issuer_id: "${i_id}", start_date: "2026-10-02", end_date: "2026-10-05", reason: "overlap attempt" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
            - call: "POST /blackout-windows"
              payload: { issuer_id: "${i_id}", start_date: "2026-10-03", end_date: "2026-10-09", reason: "adjacent but disjoint" }
              as: ComplianceOfficer
              captures: { w2: $.data.id }
          assert:
            - "err == ERR_BLACKOUT_WINDOW_OVERLAP (shared date 2026-10-02 under closed-interval semantics)"
            - "Second trigger call succeeds with a new id (start 2026-10-03 > existing end 2026-10-02, no shared date)"
            - "GET /blackout-windows?issuer_id returns exactly 2 entries"

      - name: plan_windows_half_open_overlap
        grounds:
          - state_machines.TradingPlan10b5_1.PENDING_APPROVAL_to_ADOPTED
          - errors[ERR_PLAN_WINDOW_OVERLAP]
          - entities.TradingPlan10b5_1.fields.first_trade_date
        distinguishing_aspect: |
          Half-open-interval semantics on the TradingPlan10b5_1 resource: plan B
          [2026-12-01, 2027-03-01) is approved although plan A occupies
          [2026-09-01, 2026-12-01), because A's end is exclusive; plan C starting
          2026-11-30 is rejected — adjacency is allowed here, unlike the sibling
          instance's closed blackout windows where touching dates conflict.
        test_recipe:
          setup:
            - "Issuer I; person P; clock 2026-08-03; plan A [2026-09-01, 2026-12-01) ADOPTED"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345", next_earnings_filing_date: "2026-10-30" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /trading-plans"
              payload: { reporting_person_id: "${p_id}", plan_name: "Plan A", first_trade_date: "2026-09-01", expiration_date: "2026-12-01" }
              as: ReportingInsider
              as_user_id: "${p_id}"
              captures: { pa: $.data.id }
            - call: "POST /trading-plans/${pa}/transitions"
              payload: { action: "SUBMIT_ADOPTION" }
              as: ReportingInsider
              as_user_id: "${p_id}"
            - call: "POST /trading-plans/${pa}/transitions"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /trading-plans"
              payload: { reporting_person_id: "${p_id}", plan_name: "Plan B", first_trade_date: "2026-12-01", expiration_date: "2027-03-01" }
              as: ReportingInsider
              as_user_id: "${p_id}"
              captures: { pb: $.data.id }
            - call: "POST /trading-plans/${pb}/transitions"
              payload: { action: "SUBMIT_ADOPTION" }
              as: ReportingInsider
              as_user_id: "${p_id}"
            - call: "POST /trading-plans"
              payload: { reporting_person_id: "${p_id}", plan_name: "Plan C", first_trade_date: "2026-11-30", expiration_date: "2027-02-28" }
              as: ReportingInsider
              as_user_id: "${p_id}"
              captures: { pc: $.data.id }
            - call: "POST /trading-plans/${pc}/transitions"
              payload: { action: "SUBMIT_ADOPTION" }
              as: ReportingInsider
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /trading-plans/${pb}/transitions"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              captures: { pb_status: $.data.status }
            - call: "POST /trading-plans/${pc}/transitions"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "pb_status == ADOPTED (B's start equals A's exclusive end: no intersection under half-open semantics)"
            - "err == ERR_PLAN_WINDOW_OVERLAP (C starts 2026-11-30 inside A's window [2026-09-01, 2026-12-01))"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: confirm_void_open_obligation_conservation
        grounds:
          - calculations.open_filing_obligations
          - state_machines.SecurityTransaction.CONFIRMED_to_VOID
          - state_machines.SecurityTransaction.INGESTED_to_CONFIRMED
        distinguishing_aspect: |
          Conserved quantity is a COUNT: the forward action (confirm creates the
          DRAFT Form 4, +1) paired with its compensation (void discards that
          filing, -1) leaves ReportingPerson.open_obligation_count == COUNT of
          the person's filings in {DRAFT, READY, SUBMITTED} unchanged — a
          different conserved quantity than the sibling instance's DATE.
        test_recipe:
          setup:
            - "Issuer I; person P designated ACTIVE at clock 2026-08-03 (Form 3 draft -> open_obligation_count == 1)"
            - "Purchase dated 2026-08-06 confirmed at clock 2026-08-06 (auto Form 4 draft -> count 2)"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /reporting-persons/${p_id}/transitions"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "GET /reporting-persons/${p_id}"
              as: ComplianceOfficer
              captures: { oc_base: $.data.open_obligation_count }
            - call: "POST /transactions"
              payload: { reporting_person_id: "${p_id}", transaction_date: "2026-08-06", transaction_code: "P", security_type: "COMMON_STOCK", shares: 100, price_per_share: 10.00 }
              as: EquityPlanAdmin
              as_user_id: "epa_1"
              captures: { t_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /transactions/${t_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /reporting-persons/${p_id}"
              as: ComplianceOfficer
              captures: { oc_fwd: $.data.open_obligation_count }
            - call: "GET /filings"
              payload: { reporting_person_id: "${p_id}", form_type: "FORM_4", status: "DRAFT" }
              as: ComplianceOfficer
              captures: { f_id: "$.data[0].id" }
          trigger:
            - call: "POST /transactions/${t_id}/void"
              payload: { reason: "duplicate feed row" }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /reporting-persons/${p_id}"
              as: ComplianceOfficer
              captures: { oc_end: $.data.open_obligation_count }
            - call: "GET /filings/${f_id}"
              as: ComplianceOfficer
              captures: { f_status: $.data.status }
          assert:
            - "oc_base == 1 AND oc_fwd == 2 (forward action added exactly one open obligation)"
            - "oc_end == 1 == oc_base (compensating void restores the conserved count; formula: count == COUNT(filings of P in {DRAFT, READY, SUBMITTED}))"
            - "f_status == DISCARDED (the auto Form 4 is discarded by the void cascade)"

      - name: suspend_reinstate_cooling_off_conservation
        grounds:
          - calculations.cooling_off_end_date
          - state_machines.TradingPlan10b5_1.ACTIVE_to_SUSPENDED
          - state_machines.TradingPlan10b5_1.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity is a DATE: the forward action (SUSPEND) paired with
          its compensation (REINSTATE) leaves plan.cooling_off_end_date — pinned
          once at approval as min(max(adoption + 90d, earnings + 2bd), adoption +
          120d) — unchanged at 2026-11-03 — a different conserved quantity than
          the sibling instance's COUNT.
        test_recipe:
          setup:
            - "Issuer I with next_earnings_filing_date 2026-10-30; officer person O"
            - "Plan approved at clock 2026-08-03 (cooling_off_end_date == 2026-11-03), activated at clock 2026-11-03"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345", next_earnings_filing_date: "2026-10-30" }
              as: ComplianceOfficer
              captures: { i_id: $.data.id }
            - call: "POST /reporting-persons"
              payload: { issuer_id: "${i_id}", full_name: "Dana Officer", person_cik: "0001000001", is_officer: true }
              as: ComplianceOfficer
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /trading-plans"
              payload: { reporting_person_id: "${p_id}", plan_name: "Plan A", first_trade_date: "2026-09-01", expiration_date: "2027-03-01" }
              as: ReportingInsider
              as_user_id: "${p_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "SUBMIT_ADOPTION" }
              as: ReportingInsider
              as_user_id: "${p_id}"
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "APPROVE" }
              as: ComplianceOfficer
              captures: { ce_at_approval: $.data.cooling_off_end_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "SUSPEND" }
              as: ComplianceOfficer
              captures: { ce_suspended: $.data.cooling_off_end_date }
            - call: "POST /trading-plans/${pl_id}/transitions"
              payload: { action: "REINSTATE" }
              as: ComplianceOfficer
              captures: { ce_reinstated: $.data.cooling_off_end_date, st_final: $.data.status }
          assert:
            - "ce_at_approval == \"2026-11-03\" (base 2026-11-01, earnings 2026-10-30 + 2bd = 2026-11-03, cap 2026-12-01 -> max then min = 2026-11-03)"
            - "ce_suspended == \"2026-11-03\" (suspension does not reset cooling-off)"
            - "ce_reinstated == \"2026-11-03\" AND st_final == ACTIVE (forward + compensating pair conserves the date)"
