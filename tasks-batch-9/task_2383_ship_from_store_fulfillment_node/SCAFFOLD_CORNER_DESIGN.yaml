              payload: { picked_units: 2, line_picks: [{ assignment_line_id: "${al2}", units_picked: 2 }] }
              as: StoreAssociate
              as_user_id: "${s1}"
            - call: "POST /fulfillment-network/assignments/${a2}/pack"
              payload: { package_type: "MEDIUM_BOX" }
              as: StoreAssociate
              as_user_id: "${s1}"
          trigger:
            - call: "POST /fulfillment-network/assignments/${a1}/ship"
