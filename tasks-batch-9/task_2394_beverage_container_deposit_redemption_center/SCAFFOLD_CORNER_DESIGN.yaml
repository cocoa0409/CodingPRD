        grounds:
          - errors[ERR_LOT_QUANTITY_INCONSISTENT]
          - validations[priority=9]
          - calculations.lot_acceptance_screening
        distinguishing_aspect: "6 out-of-state plus 5 contaminated against 10 presented is arithmetically impossible and dies at priority 9, while 6 plus 4 equals exactly 10 and is instead screened to accepted_quantity 0 with reject_reason MIXED."
        test_recipe:
          setup:
