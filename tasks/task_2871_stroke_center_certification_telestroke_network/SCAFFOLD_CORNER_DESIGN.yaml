        as: QualityAbstractor
        as_user_id: qa_bob
        captures:
          cr_open3: $.data.open_case_count
          cr_v3: $.data.version
          cr_ems3: $.data.ems_routing_posture
      assert:
      - ${cr_open1} == 2 — both live cases are counted
      - ${cr_eq1} == READY, ${cr_ems1} == ROUTINE and ${cr_pub1} == null before any report is published
      - 'the second GET, by a different role, is byte-identical on the derived fields: ${cr_v2} == ${cr_v1}, ${cr_ua2} == ${cr_ua1} and ${cr_open2} == 2 — reading never bumps the version'
      - after the abort ${cr_open3} == 1 and ${cr_ems3} == ROUTINE, so the derived count follows the write that caused it
      - '${cr_v3} != ${cr_v1}: the version moved because of the ABORT cascade, not because of the reads'
  - name: a_report_below_the_conditional_floor_is_returned_and_denied_and_cannot_be_published
    claim_type: conditional_action
    grounds:
    - endpoints.POST /stroke-network/certification-reports/{id}/decide
    - state_machines.CertificationReport SUBMITTED -> RETURNED, RETURNED -> SUBMITTED
    - calculations.composite_certification_score CERT_SCORE_CONDITIONAL_MIN 70.0
    - entities.StrokeCenter.consecutive_denied_report_count
    distinguishing_aspect: 'The decide endpoint is ONE call with two outcomes chosen by a number nobody supplies, and this is the branch the happy path never reaches: composite 0.00 must produce decision DENIED with status RETURNED, must leave a PROVISIONAL centre PROVISIONAL (only a CONDITIONAL centre is suspended by a denial), must increment consecutive_denied_report_count, and must leave the report re-submittable. Publication is then blocked because publish is conditional on ACCEPTED.'
