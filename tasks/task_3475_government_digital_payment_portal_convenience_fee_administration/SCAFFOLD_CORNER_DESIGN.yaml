        distinguishing_aspect: "Every resource family 404s with its OWN error id (never a shared ERR_NOT_FOUND): one sweep hits eight unknown ids across services, batches, accounts, authorizations, refunds, chargebacks, exceptions and payers."
        test_recipe:
          setup:
