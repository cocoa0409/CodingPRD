  # ═══════════════════════════════════════════════════════════════════════════
  - rule_id: non_linear_state_machine
    instances:
      - name: lop_void_reissue_cycle_leaves_election_status_untouched
        grounds:
          - state_machines.Commitment.lop_status.ISSUED_to_VOID
          - state_machines.Commitment.lop_status.SIGNED_to_VOID
          - state_machines.Commitment.lop_status.VOID_to_ISSUED
          - state_machines.Commitment.lop_status.SIGNED_to_COUNTERSIGNED
          - entities.Commitment.fields.signer_name
        distinguishing_aspect: |
          The non-linearity lives on Commitment.lop_status: a document cycle
          ISSUED -> SIGNED -> VOID -> ISSUED that can be re-entered, clears signer_name on
          the way back, and leaves the parallel election_status dimension frozen at ELECTED
          throughout — and the cycle door slams once the letter is COUNTERSIGNED.
        test_recipe:
          setup:
            - "ACTIVE contract with the shared three-tier ladder."
            - "Member M-1; a freshly created commitment at TIER_0, so election_status is ELECTED, lop_status is NOT_ISSUED, current_tier_code is null."
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractManager
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-SUT-1", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, share_basis: "COLLECTED", leakage_alert_threshold_pct: 15.00, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 }, { min_gross_pool_cents: 100000, holdback_bps: 250 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/members"
              payload: { member_code: "M-1", name: "Riverbend Regional Hospital", aggregation_group_code: "AGG-NORTH", item_master: [ { member_item_number: "MI-1", description: "Suture 3-0", units_per_uom: 1 } ] }
              as: ContractManager
              captures: { m1: $.data.id }
            - call: "POST /gpo/commitments"
              payload: { member_id: "${m1}", contract_id: "${c1}", elected_tier_code: "TIER_0", committed_volume_units: 100, effective_from: "2026-08-01" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
              captures: { k1: $.data.id }
          trigger:
            - call: "POST /gpo/commitments/${k1}/lop/issue"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${k1}/lop/sign"
              payload: { signer_name: "R. Vasquez" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${k1}/lop/void"
              payload: {}
              as: ContractManager
              captures: { void_lop: $.data.lop_status, void_election: $.data.election_status, void_signer: $.data.signer_name }
            - call: "POST /gpo/commitments/${k1}/lop/issue"
              payload: {}
              as: ContractManager
              captures: { reissue_lop: $.data.lop_status, reissue_election: $.data.election_status }
            - call: "POST /gpo/commitments/${k1}/lop/sign"
              payload: { signer_name: "A. Nolan" }
              as: MemberMaterialsManager
              as_user_id: "${m1}"
            - call: "POST /gpo/commitments/${k1}/lop/countersign"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/commitments/${k1}/lop/void"
              payload: {}
              as: ContractManager
              expect_error: ERR_INVALID_LOP_STATE
              expect_status: 409
          assert:
            - "${void_lop} == VOID"
            - "${void_signer} == null"
            - "${void_election} == ELECTED"
            - "${reissue_lop} == ISSUED"
            - "${reissue_election} == ELECTED"
            - "Commitment.${k1}.lop_status == COUNTERSIGNED"
            - "Commitment.${k1}.election_status == ACTIVE"
            - "Commitment.${k1}.current_tier_code == TIER_0"
            - "Commitment.${k1}.signer_name == A. Nolan"
            - "Contract.${c1}.active_commitment_count == 1"
            - "the final void attempt returns ERR_INVALID_LOP_STATE (409) and Commitment.${k1}.lop_status is still COUNTERSIGNED"

      - name: evidence_review_revision_cycle_capped_at_two_rounds
        grounds:
          - state_machines.ClinicalEvidenceReview.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.ClinicalEvidenceReview.REVISION_REQUESTED_to_UNDER_REVIEW
          - state_machines.ClinicalEvidenceReview.UNDER_REVIEW_to_ENDORSED
          - entities.ClinicalEvidenceReview.fields.revision_round
          - errors.ERR_REVISION_LIMIT_REACHED
        distinguishing_aspect: |
          A different entity's machine and a different kind of non-linearity: the
          UNDER_REVIEW <-> REVISION_REQUESTED loop is bounded by a counter guard
          (revision_round <= 1 on request-revision), so the loop runs exactly twice and the
          third entry is refused with ERR_REVISION_LIMIT_REACHED — whereas the lop cycle
          above is unbounded in count and closed instead by reaching a specific state.
          Each pass through the loop also re-scores the review, so the exit condition of the
          machine changes as the loop runs.
        test_recipe:
          setup:
            - "A DRAFT contract with requires_clinical_review true (the field default)."
            - "A ClinicalEvidenceReview submitted by user CR-1 with clinical_efficacy_score 6.00, safety_score 6.50, supply_resilience_score 7.50, so weighted_score is 6.55 and conversion_recommendation is DO_NOT_CONVERT, status UNDER_REVIEW, revision_round 0."
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractManager
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-CONV", supplier_name: "Northline Ortho", category_code: "CAT-ORTHO", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: true, share_basis: "COLLECTED", leakage_alert_threshold_pct: 15.00, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 }, { min_gross_pool_cents: 100000, holdback_bps: 250 } ] }
              as: ContractManager
              captures: { c1: $.data.id, c1v0: $.data.version }
            - call: "POST /gpo/clinical-evidence-reviews"
              payload: { contract_id: "${c1}", clinical_efficacy_score: 6.00, safety_score: 6.50, supply_resilience_score: 7.50, summary: "Initial category dossier: efficacy comparable, safety data thin." }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { r1: $.data.id, s0: $.data.weighted_score, rec0: $.data.conversion_recommendation }
          trigger:
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/request-revision"
              payload: { reason: "Expand the safety cohort." }
              as: ClinicalReviewer
              as_user_id: "CR-2"
              captures: { st1: $.data.status, rr1: $.data.revision_round }
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/resubmit"
              payload: { clinical_efficacy_score: 6.00, safety_score: 7.00, supply_resilience_score: 7.50, summary: "Safety cohort doubled." }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { st2: $.data.status, rr2: $.data.revision_round, s2: $.data.weighted_score }
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/request-revision"
              payload: { reason: "Supply resilience still single-source." }
              as: ClinicalReviewer
              as_user_id: "CR-2"
              captures: { st3: $.data.status, rr3: $.data.revision_round }
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/resubmit"
              payload: { clinical_efficacy_score: 7.00, safety_score: 7.00, supply_resilience_score: 7.60, summary: "Second source qualified; safety cohort final." }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              captures: { st4: $.data.status, rr4: $.data.revision_round, s4: $.data.weighted_score, rec4: $.data.conversion_recommendation }
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/request-revision"
              payload: { reason: "Third bite at the apple." }
              as: ClinicalReviewer
              as_user_id: "CR-2"
              expect_error: ERR_REVISION_LIMIT_REACHED
              expect_status: 409
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/endorse"
              payload: {}
              as: ClinicalReviewer
              as_user_id: "CR-2"
            - call: "POST /gpo/clinical-evidence-reviews/${r1}/resubmit"
              payload: { clinical_efficacy_score: 9.00, safety_score: 9.00, supply_resilience_score: 9.00 }
              as: ClinicalReviewer
              as_user_id: "CR-1"
              expect_error: ERR_INVALID_REVIEW_STATE
              expect_status: 409
          assert:
            - "${s0} == 6.55"
            - "${rec0} == DO_NOT_CONVERT"
            - "${st1} == REVISION_REQUESTED and ${rr1} == 1"
            - "${st2} == UNDER_REVIEW and ${rr2} == 1"
            - "${s2} == 6.73"
            - "${st3} == REVISION_REQUESTED and ${rr3} == 2"
            - "${st4} == UNDER_REVIEW and ${rr4} == 2"
            - "${s4} == 7.15"
            - "${rec4} == CONVERT"
            - "the third request-revision returns ERR_REVISION_LIMIT_REACHED (409) and ClinicalEvidenceReview.${r1}.revision_round is still 2"
            - "ClinicalEvidenceReview.${r1}.status == ENDORSED"
            - "ClinicalEvidenceReview.${r1}.endorsed_by_user_id == CR-2"
            - "Contract.${c1}.evidence_endorsed == true"
            - "the post-endorse resubmit returns ERR_INVALID_REVIEW_STATE (409): ENDORSED is terminal, so the cycle cannot be re-entered"

  # ═══════════════════════════════════════════════════════════════════════════
  - rule_id: transitive_cascade
    instances:
      - name: finalize_retier_supersedes_tier_row_then_local_exception_then_item_counter
        depth: 5
        grounds:
          - state_machines.ComplianceMeasurement.PRELIMINARY_to_FINAL
          - state_machines.Commitment.election_status.REQUAL_REVIEW_to_ACTIVE
          - state_machines.PriceActivation.ACTIVE_to_SUPERSEDED
          - entities.PriceActivation.fields.replaces_activation_id
          - entities.ContractItem.fields.active_activation_count
        distinguishing_aspect: |
          Trigger: finalizing a compliance measurement. Depth 5, and every hop is caused by
          the one before it rather than fanned out from the trigger: (1) the FINAL recompute
          produces qualified_tier_code TIER_2, (2) which rewrites Commitment.current_tier_code,
          (3) which — only because the tier actually moved — supersedes the ACTIVE TIER_PRICE
          row and mints a replacement at the new tier, (4) which — only because the tier row
          for that same (commitment, item) pair moved — supersedes the ACTIVE LOCAL_EXCEPTION
          row and re-derives it under the new min() ceiling, (5) which forces exactly one
          recompute of that ContractItem.active_activation_count. Cutting hop 2 (a measurement
          whose qualified tier equals the incumbent) stops the chain dead at depth 2.
        test_recipe:
          setup:
            - "ACTIVE contract C-SUT-1 with the shared three-tier ladder; catalog item V-1 at base 10000 / floor 8200."
            - "Member M-1 with item_master MI-1 and MI-9; an ACTIVE COUNTERSIGNED commitment at TIER_0 (current_tier_code TIER_0); APPROVED cross-reference MI-1 -> V-1 and NO cross-reference for MI-9."
            - "Two ACTIVE activations on that (commitment, item) pair: a TIER_PRICE row at 10000 and a LOCAL_EXCEPTION row requesting 9600, both windowed [2026-08-01, 2026-12-31]."
            - "A LOADED file D-A over [2026-08-01, 2026-09-01) with 5000 units of MI-1 at 9500 (ON_CONTRACT, 5000 contract units) and 500 units of MI-9 at 6000 (UNMATCHED), and a PARTIALLY_LOADED file D-B over the same period with 1500 units of MI-1 at 10500 (OFF_CONTRACT_LEAKAGE) plus one zero-quantity rejected line."
            - "The commitment moved to REQUAL_REVIEW, and a measurement over [2026-08-01, 2026-09-01) already measured to PRELIMINARY 75.10 with qualified_tier_code TIER_0."
            - "The logical clock advanced to 2026-09-02 so the cascade's replacement rows start at a date still inside the superseded rows' effective_to."
          setup_api_calls:
            - call: "POST /gpo/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractManager
            - call: "POST /gpo/contracts"
              payload: { contract_code: "C-SUT-1", supplier_name: "Acme Surgical", category_code: "CAT-SUT", effective_from: "2026-01-01", effective_to: "2026-12-31", admin_fee_bps: 300, member_share_bps: 6000, requires_clinical_review: false, share_basis: "COLLECTED", leakage_alert_threshold_pct: 15.00, tiers: [ { tier_code: "TIER_0", min_committed_volume_units: 0, min_compliance_pct: 0.00, discount_bps: 0 }, { tier_code: "TIER_1", min_committed_volume_units: 2000, min_compliance_pct: 80.00, discount_bps: 800 }, { tier_code: "TIER_2", min_committed_volume_units: 5000, min_compliance_pct: 90.00, discount_bps: 1500 } ], holdback_tiers: [ { min_gross_pool_cents: 0, holdback_bps: 0 }, { min_gross_pool_cents: 100000, holdback_bps: 250 } ] }
              as: ContractManager
              captures: { c1: $.data.id }
            - call: "POST /gpo/contracts/${c1}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /gpo/contracts/${c1}/items"
              payload: { vendor_item_number: "V-1", item_description: "Suture 3-0 absorbable", uom: "EA", units_per_uom: 1, base_price_cents: 10000, floor_price_cents: 8200, requires_evidence: false }
              as: ContractManager
              captures: { i1: $.data.id }
            - call: "POST /gpo/members"
