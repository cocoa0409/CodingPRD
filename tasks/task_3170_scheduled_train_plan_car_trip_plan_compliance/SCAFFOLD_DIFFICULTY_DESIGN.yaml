            - "CrewPool.${pool}.crews_booked == 1, crews_available == 1, status == EXHAUSTED"
            - "TrainDeparture.${d2}.status == SCHEDULED (no partial booking recorded)"

      - name: locomotive_single_assignment_overlap_and_reposition
        grounds:
          - state_machines.Locomotive.AVAILABLE_to_ASSIGNED
          - errors[ERR_UNIT_NOT_AVAILABLE]
          - errors[ERR_UNIT_WRONG_YARD]
        distinguishing_aspect: |
          A DIFFERENT interval semantics on a DIFFERENT resource: a
          locomotive's ASSIGNED window is an exclusive-lock occupation (a
          second schedule is rejected by STATE, not by aggregate count), and
          after the window closes at finalize the unit's positioning changes
          — the same unit at its NEW yard fails origin-positioning for a
          departure from the OLD yard with ERR_UNIT_WRONG_YARD.
        test_recipe:
