            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${drb}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-10T23:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { by: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${drb}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-11T00:30:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { bz: $.data.id } }
            - { call: "POST /endoscopy/bookings/${bx}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${by}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${bz}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            # BX: in 23:30, out exactly period_start
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T23:30:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${bx}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${bx}/start", payload: { scope_id: "${sp1}" }, as: Endoscopist, as_user_id: "${drb}" }
            - { call: "POST /endoscopy/bookings/${bx}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${drb}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${bx}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 500, adenomas_detected: 1 }, as: Endoscopist, as_user_id: "${drb}" }
            # BY: in 23:00, out exactly period_end 23:59:59
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T23:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${by}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${by}/start", payload: { scope_id: "${sp2}" }, as: Endoscopist, as_user_id: "${drb}" }
            - { call: "POST /endoscopy/bookings/${by}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${drb}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T23:59:59Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${by}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 450, adenomas_detected: 0 }, as: Endoscopist, as_user_id: "${drb}" }
            # BZ: completes 2026-08-11T00:00:00 (outside)
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:30:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${bz}/check-in", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/bookings/${bz}/start", payload: { scope_id: "${sp3}" }, as: Endoscopist, as_user_id: "${drb}" }
            - { call: "POST /endoscopy/bookings/${bz}/record-prep-assessment", payload: { bbps_left: 2, bbps_right: 2, bbps_transverse: 2 }, as: Endoscopist, as_user_id: "${drb}" }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T01:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${bz}/complete", payload: { cecum_intubated: true, withdrawal_time_seconds: 480, adenomas_detected: 1 }, as: Endoscopist, as_user_id: "${drb}" }
          trigger:
            - { call: "POST /endoscopy/quality-reports", payload: { provider_id: "${drb}", period_start: "2026-08-10T00:00:00Z", period_end: "2026-08-10T23:59:59Z", metric_variant: "STRICT" }, as: QualityOfficer, captures: { rep: $.data.id, rep_den: $.data.adr_denominator, rep_num: $.data.adr_numerator, rep_rate: $.data.adenoma_detection_rate } }
          assert:
            - "adr_denominator == 2: BX (actual_end == period_start) and BY (actual_end == period_end) both INCLUDED (closed interval)"
            - "adr_numerator == 1 (BX), adenoma_detection_rate == 50.0"
            - "BZ (actual_end 2026-08-11T01:00 > period_end) excluded"
            - "withdrawal_time_avg_seconds == 450.0 over sample_size == 1 (BY only; BX has adenomas >= 1)"
      - name: hld_boundary_stub
        claim_type: boundary
        grounds: [calculations.reprocessing_step_windows]
        excluded_because:
          difficulty_instance: hld_contact_time_600_second_boundary
          rationale: "The 599s/600s HLD contact boundary is asserted in the named §1.8 instance."
      - name: adr_empty_denominator_stub
        claim_type: boundary
        grounds: [calculations.adenoma_detection_rate]
        excluded_because:
          difficulty_instance: adr_null_when_denominator_zero
          rationale: "Null-rate-on-empty-denominator is asserted in the named §1.8 instance."
      - name: withdrawal_specimen_exclusion_stub
        claim_type: input_set_filtering
        grounds: [calculations.withdrawal_time_average]
        excluded_because:
          difficulty_instance: adr_screening_strict_vs_expanded_denominators
          rationale: "The 480.0 / sample-size-1 assertion in the named §1.8 instance pins the specimen-based exclusion (B7) along with the adenoma and cecum exclusions."
      - name: cecal_and_prep_rate_correctness_stub
        claim_type: correct_result
        grounds: [calculations.cecal_intubation_and_prep_rates]
        excluded_because:
          difficulty_instance: adr_screening_strict_vs_expanded_denominators
          rationale: "CIR 83.3 and prep-adequacy 71.4 are asserted on the same fixture in the named §1.8 instance."

  - section: validations
    instances:
      - name: patient_create_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before role or existence checks."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-NA", full_name: "No Auth", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) — the test sends NO auth headers"]
      - name: endoscopist_create_patient_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A validly-authenticated Endoscopist calling POST /patients (not in its roles) gets 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["provider DR1 exists so the Endoscopist identity resolves"]
          setup_api_calls:
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Fb", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
          trigger:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-FB", full_name: "Pat Fb", date_of_birth: "1990-05-05" }, as: Endoscopist, as_user_id: "${dr1}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN_ROLE (403)"]
      - name: missing_auth_and_wrong_role_returns_400
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=2]"]
        distinguishing_aspect: "A request that is both unauthenticated AND would be role-forbidden returns the priority-1 auth error (400), never the 403."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Nobody", specialty: "GASTROENTEROLOGY" }, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) — the test sends NO auth headers; role check never runs"]
      - name: not_found_beats_stale_version_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=5]"]
        distinguishing_aspect: "PATCH on a non-existent booking id with a (well-formed but meaningless) expected version returns 404 ERR_BOOKING_NOT_FOUND — existence (priority 3) precedes the OCC check (priority 5)."
        test_recipe:
          setup: ["one real booking exists to source a legitimate version value"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-NF", full_name: "Pat Nf", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Nf", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-NF", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id, bv: $.data.version } }
          trigger:
            - { call: "PATCH /endoscopy/bookings/00000000-0000-0000-0000-000000000000", payload: { expected_booking_version: "${bv}", notes: "ghost" }, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_BOOKING_NOT_FOUND (404), not ERR_STALE_BOOKING_VERSION (412)"]
      - name: ownership_beats_state_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]", "errors[ERR_PROVIDER_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "Endoscopist DR2 starting DR1's CANCELLED booking gets 403 ERR_PROVIDER_OWNERSHIP_MISMATCH — ownership (priority 6) precedes the booking-state check (priority 7)."
        test_recipe:
          setup: ["DR1's booking B created then cancelled; DR2 exists"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-OW", full_name: "Pat Ow", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr One", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Two", specialty: "COLORECTAL_SURGERY" }, as: UnitAdmin, captures: { dr2: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-OW", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-OW", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sc1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/cancel", payload: { reason: "x" }, as: SchedulingCoordinator }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sc1}" }, as: Endoscopist, as_user_id: "${dr2}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_PROVIDER_OWNERSHIP_MISMATCH (403), not ERR_BOOKING_NOT_CHECKED_IN (409)"]
      - name: safety_beats_referential_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=11]", "errors[ERR_SCOPE_STORAGE_EXPIRED]"]
        distinguishing_aspect: "An explicit scope that is BOTH storage-expired (safety, priority 8) AND the wrong type for the procedure (referential, priority 11) is rejected with ERR_SCOPE_STORAGE_EXPIRED, not ERR_SCOPE_TYPE_MISMATCH."
        test_recipe:
          setup:
            - "COLONO booking checked in at 2026-08-24T09:00"
            - "Scope SG_EXP: GASTROSCOPE whose cycle dried 2026-08-20T08:26 (expired 2026-08-23T08:26 < now)"
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-SR", full_name: "Pat Sr", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Sr", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-SR", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SG-EXP", scope_type: "GASTROSCOPE" }, as: UnitAdmin, captures: { sg: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-24T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/scopes/${sg}/send-to-reprocessing", payload: {}, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles", payload: { scope_id: "${sg}" }, as: ReprocessingTechnician, as_user_id: "tech-1", captures: { cy: $.data.id } }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "PRECLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:06:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "CLEANED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:16:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "DISINFECTED", hld_solution_lot: "LOT-SR", hld_concentration_ppm: 350 }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:26:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "DRIED" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/reprocessing-cycles/${cy}/steps/advance", payload: { to_step: "COMPLETE" }, as: ReprocessingTechnician }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T09:00:00Z" }, as: UnitAdmin }
            - { call: "POST /endoscopy/bookings/${b1}/check-in", payload: {}, as: SchedulingCoordinator }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/start", payload: { scope_id: "${sg}" }, as: Endoscopist, as_user_id: "${dr1}", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_SCOPE_STORAGE_EXPIRED (409) — the safety gate fires before the scope-type referential check (422)"]
      - name: lead_time_exactly_24h_accepted
        claim_type: satisfaction_pass
        grounds: [calculations.reprocessing_step_windows, "errors[ERR_PREP_LEAD_TIME_INSUFFICIENT]", "validations[priority=9]"]
        distinguishing_aspect: "SPLIT_DOSE lead-time boundary: a booking at exactly now+24h (>= inclusive) is accepted; now+23:59:59 is rejected with ERR_PREP_LEAD_TIME_INSUFFICIENT."
        test_recipe:
          setup: ["patient, DR1, COLONO (SPLIT_DOSE), rooms R1/R2; logical clock set to 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-LT", full_name: "Pat Lt", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Lt", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R1", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R2", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r2: $.data.id } }
            - { call: "POST /endoscopy/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: UnitAdmin }
          trigger:
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-02T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b_ok: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r2}", scheduled_start: "2026-08-02T08:59:59Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "Exactly now+24h: booking ${b_ok} created (201)"
            - "One second short: error_id == ERR_PREP_LEAD_TIME_INSUFFICIENT (422)"
      - name: scheduled_start_in_past_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCHEDULED_START_IN_PAST]", "validations[priority=9]"]
        distinguishing_aspect: "scheduled_start equal to the logical clock (not strictly future) is rejected 422 ERR_SCHEDULED_START_IN_PAST."
        test_recipe:
          setup: ["patient, DR1, COLONO, room; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-PS", full_name: "Pat Ps", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Ps", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "EGD", display_name: "Upper endoscopy", base_duration_minutes: 25, prep_protocol: "NONE", colonoscopy_family: false, adr_relevant: false, required_scope_type: "GASTROSCOPE" }, as: UnitAdmin, captures: { t_egd: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-PS", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_egd}", room_id: "${r1}", scheduled_start: "2026-08-01T00:00:00Z", indication: "DIAGNOSTIC", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_SCHEDULED_START_IN_PAST (422) — NONE prep has 0h lead, but the start must still be strictly in the future"]
      - name: specimen_transport_120_minute_boundary
        claim_type: boundary
        grounds: ["errors[ERR_TRANSPORT_WINDOW_EXCEEDED]", state_machines.Specimen.IN_TRANSIT_to_RECEIVED_BY_LAB]
        distinguishing_aspect: "Transport window is inclusive at 120 minutes: receive at exactly collected_at+120min succeeds; at +121min it fails with ERR_TRANSPORT_WINDOW_EXCEEDED, and the specimen can then only be rejected."
        test_recipe:
          setup: ["booking IN_PROGRESS at 2026-08-03T09:00; SP1 collected 09:10, labeled, handed off; SP2 collected 09:10, labeled, handed off"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-TW", full_name: "Pat Tw", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Tw", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-TW", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/scopes", payload: { serial_number: "SC-TW", scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { sc1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id } }
            - { call: "POST /endoscopy/bookings/${b1}/confirm-prep", payload: {}, as: SchedulingCoordinator }
