# ---------------------------------------------------------------------------
# §1.9 Scaffold Corner Design — breadth probe over the §1.1-§1.7 surface of
# SCAFFOLD.yaml (domain renewable-diesel-feedstock-sourcing).
#
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Corners already asserted by a §1.8
# instance carry an `excluded_because:` stub and no test_recipe.
# Every literal in an `assert:` was computed against the §1.3 formula and its
# `constants:` before being written here.
# ---------------------------------------------------------------------------
scaffold_corner_design:
  - section: entities
    instances:
      - name: supplier_creation_returns_declared_fields_and_pending_dd_status
        claim_type: Creation
        grounds:
          - entities.Supplier
          - endpoints["POST /suppliers"]
          - response_envelope.success
        distinguishing_aspect: "POST /suppliers with every required field returns 201 with dd_status PENDING, dd_document_type_count 0, version 1 and the declared success envelope."
        test_recipe:
          setup:
            - "Empty database; clock at the 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO", "TALLOW"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
          assert:
            - "response.status == 201"
            - "response body has meta.api_request_id and meta.api_request_timestamp"
            - "response.response_type == 'object'"
            - "Supplier.${sup_id}.legal_name == 'Gulf Coast Renderers LLC'"
            - "Supplier.${sup_id}.country_code == 'US'"
            - "Supplier.${sup_id}.feedstock_types == ['UCO', 'TALLOW']"
            - "Supplier.${sup_id}.is_high_risk_origin == false"
            - "Supplier.${sup_id}.dd_status == PENDING"
            - "Supplier.${sup_id}.dd_document_type_count == 0"
            - "Supplier.${sup_id}.dd_verified_at == null"
            - "Supplier.${sup_id}.dd_expires_at == null"
            - "Supplier.${sup_id}.suspension_reason == null"
            - "Supplier.${sup_id}.version == 1"

      - name: hedge_position_retrieval_returns_stored_margin_fields
        claim_type: Retrieval
        grounds:
          - entities.HedgePosition
          - endpoints["GET /hedge-positions/{id}"]
          - calculations.hedge_margin_requirement
        distinguishing_aspect: "GET /hedge-positions/{id} returns exactly the row POST created, including the five margin fields stamped at creation."
        test_recipe:
          setup:
            - "One OPEN RIN_FORWARD position of 10000 units at 2.50 with maturity 2026-12-31 (gross 25000.00, base 3000.00, T1, adder 30.00, total 3030.00)."
          setup_api_calls:
            - call: "POST /hedge-positions"
              payload: { instrument: "RIN_FORWARD", notional_units: 10000, strike_price_usd: 2.50, maturity_at: "2026-12-31T00:00:00Z" }
              as: FeedstockTrader
              captures: { pos_id: $.data.id }
          trigger:
            - call: "GET /hedge-positions/${pos_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
          assert:
            - "response.status == 200"
            - "HedgePosition.${pos_id}.instrument == RIN_FORWARD"
            - "HedgePosition.${pos_id}.notional_units == 10000"
            - "HedgePosition.${pos_id}.gross_notional_usd == 25000.00"
            - "HedgePosition.${pos_id}.base_margin_usd == 3000.00"
            - "HedgePosition.${pos_id}.volatility_tier == T1"
            - "HedgePosition.${pos_id}.volatility_adder_usd == 30.00"
            - "HedgePosition.${pos_id}.total_margin_usd == 3030.00"
            - "HedgePosition.${pos_id}.status == OPEN"
            - "HedgePosition.${pos_id}.settlement_price_usd == null"
            - "HedgePosition.${pos_id}.realized_pnl_usd == 0.00 (the declared default while OPEN)"

      - name: feedstock_lot_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /feedstock-lots"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three lots stored, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true; offset 2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One PENDING UCO supplier with three RECEIVED lots created in a known order."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", mass_mt: 100.000, attested_ci_gco2e_per_mj: 32.50, purchase_price_usd_per_mt: 900.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", mass_mt: 200.000, attested_ci_gco2e_per_mj: 33.00, purchase_price_usd_per_mt: 905.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", mass_mt: 300.000, attested_ci_gco2e_per_mj: 34.00, purchase_price_usd_per_mt: 910.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
          trigger:
            - call: "GET /feedstock-lots"
              payload: { supplier_id: "${sup_id}", limit: 2, offset: 0 }
              as: FeedstockTrader
            - call: "GET /feedstock-lots"
              payload: { supplier_id: "${sup_id}", limit: 2, offset: 2 }
              as: FeedstockTrader
          assert:
            - "First call: response.status == 200, response_type == 'array', 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "First call rows are ordered created_at ASC: mass_mt values 100.000 then 200.000"
            - "Second call: 1 row returned with mass_mt == 300.000, total_count == 3, has_more == false"

      - name: unknown_feedstock_lot_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_LOT_NOT_FOUND]
          - validations[priority=3]
          - endpoints["GET /feedstock-lots/{id}"]
        distinguishing_aspect: "GET /feedstock-lots with an id that was never minted returns 404 ERR_LOT_NOT_FOUND and the declared error envelope, not an empty 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /feedstock-lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FeedstockTrader
          assert:
            - "response.status == 404"
            - "response.response_type == 'error'"
            - "response.error_id == ERR_LOT_NOT_FOUND"
            - "response body has meta.api_request_id"

      - name: feedstock_lot_missing_required_mass_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.FeedstockLot.fields.mass_mt
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting mass_mt, which has source input and no default, returns 422 ERR_INVALID_REQUEST and creates no lot."
        test_recipe:
          setup:
            - "One PENDING UCO supplier."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", attested_ci_gco2e_per_mj: 32.50, purchase_price_usd_per_mt: 900.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_INVALID_REQUEST"
            - "GET /feedstock-lots?supplier_id=${sup_id} returns total_count == 0"

      - name: feedstock_lot_defaults_to_received_status_and_zero_allocated_mass
        claim_type: Defaults
        grounds:
          - entities.FeedstockLot.fields.status
          - entities.FeedstockLot.fields.allocated_mass_mt
          - entities.FeedstockLot.fields.remaining_mass_mt
          - endpoints["POST /feedstock-lots"]
        distinguishing_aspect: "A newly booked lot defaults to status RECEIVED with allocated_mass_mt 0.000, remaining_mass_mt equal to mass_mt, pretreatment_tier NONE and pretreatment_fee_usd 0.00."
        test_recipe:
          setup:
            - "One PENDING UCO supplier."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", mass_mt: 450.500, attested_ci_gco2e_per_mj: 32.50, purchase_price_usd_per_mt: 900.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_id: $.data.id }
          assert:
            - "response.status == 201"
            - "FeedstockLot.${lot_id}.status == RECEIVED"
            - "FeedstockLot.${lot_id}.allocated_mass_mt == 0.000"
            - "FeedstockLot.${lot_id}.remaining_mass_mt == 450.500"
            - "FeedstockLot.${lot_id}.pretreatment_tier == NONE"
            - "FeedstockLot.${lot_id}.pretreatment_fee_usd == 0.00"
            - "FeedstockLot.${lot_id}.pretreatment_loss_mt == 0.000"
            - "FeedstockLot.${lot_id}.pretreatment_consumed_mt == 0.000"
            - "FeedstockLot.${lot_id}.source_lot_id == null"
            - "FeedstockLot.${lot_id}.version == 1"

      - name: processing_run_run_days_computed_from_window_bounds
        claim_type: Computed Fields
        grounds:
          - entities.ProcessingRun.fields.run_days
          - endpoints["POST /processing-runs"]
        distinguishing_aspect: "run_days is derived from the window rather than supplied: a [2026-09-01, 2026-09-08) window yields run_days 7 with reserved and consumed masses at 0.000 and every yield field null."
        test_recipe:
          setup:
            - "HTU-1 with an approved catalyst-change window and one ACTIVE charge."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "CATALYST_CHANGE", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              captures: { win_id: $.data.id }
            - call: "POST /turnaround-windows/${win_id}/approvals"
              payload: {}
              as: PlantOperator
            - call: "POST /hydrotreating-units/${unit_id}/catalyst-charges"
              payload: { design_throughput_mt: 60000.0, installed_at: "2026-08-02T00:00:00Z" }
              as: PlantOperator
              captures: { charge_id: $.data.id }
          trigger:
            - call: "POST /processing-runs"
              payload: { unit_id: "${unit_id}", catalyst_charge_id: "${charge_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-08T00:00:00Z", target_saf_share_pct: 5.00 }
              as: PlantOperator
              captures: { run_id: $.data.id }
          assert:
            - "response.status == 201"
            - "ProcessingRun.${run_id}.run_days == 7"
            - "ProcessingRun.${run_id}.status == PLANNED"
            - "ProcessingRun.${run_id}.reserved_mass_mt == 0.000"
            - "ProcessingRun.${run_id}.consumed_mass_mt == 0.000"
            - "ProcessingRun.${run_id}.blend_ci_gco2e_per_mj == null"
            - "ProcessingRun.${run_id}.required_h2_kg_per_day == null"
            - "ProcessingRun.${run_id}.provisional_yield_pct == null"
            - "ProcessingRun.${run_id}.final_yield_pct == null"
            - "ProcessingRun.${run_id}.abort_reason == null"

      - name: supplier_system_fields_stamped_from_logical_clock
        claim_type: System Fields
        grounds:
          - entities.Supplier.fields.created_at
          - endpoints["POST /_clock/set_current_utc"]
          - endpoints["POST /suppliers"]
        distinguishing_aspect: "created_at and updated_at are stamped from the logical clock, so a supplier created after the clock is moved to 2026-08-15T00:00:00Z carries exactly that timestamp and version 1."
        test_recipe:
          setup:
            - "Clock moved forward to 2026-08-15T00:00:00Z before the supplier is created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: FeedstockTrader
          trigger:
            - call: "POST /suppliers"
              payload: { legal_name: "Midwest Tallow Partners", country_code: "US", feedstock_types: ["TALLOW"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Supplier.${sup_id}.created_at == 2026-08-15T00:00:00Z"
            - "Supplier.${sup_id}.updated_at == 2026-08-15T00:00:00Z"
            - "Supplier.${sup_id}.version == 1"
            - "Supplier.${sup_id}.id is server-minted and was not present in the request payload"

      - name: feedstock_lot_rejects_unknown_feedstock_type_enum
        claim_type: Type Constraints
        grounds:
          - entities.FeedstockLot.fields.feedstock_type
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "feedstock_type PALM_OIL is not a declared enum member, so the request is refused with 422 ERR_INVALID_REQUEST before any supplier-scope check."
        test_recipe:
          setup:
            - "One PENDING supplier whose feedstock_types is ['UCO']."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "PALM_OIL", mass_mt: 100.000, attested_ci_gco2e_per_mj: 40.00, purchase_price_usd_per_mt: 800.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_INVALID_REQUEST (never ERR_FEEDSTOCK_TYPE_NOT_SUPPLIED — the enum check runs first inside the priority 6 band)"
            - "GET /feedstock-lots?supplier_id=${sup_id} returns total_count == 0"

      - name: feedstock_lot_rejects_type_absent_from_supplier_feedstock_types
        claim_type: Type Constraints
        grounds:
          - entities.Supplier.fields.feedstock_types
          - validations[priority=6]
          - errors[ERR_FEEDSTOCK_TYPE_NOT_SUPPLIED]
        distinguishing_aspect: "A declared enum member the supplier does not sell (CANOLA_OIL against a UCO-only supplier) is refused with 422 ERR_FEEDSTOCK_TYPE_NOT_SUPPLIED, distinguishing the schema check from the supplier-capability check inside the same priority band."
        test_recipe:
          setup:
            - "One PENDING supplier whose feedstock_types is ['UCO']."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "CANOLA_OIL", mass_mt: 100.000, attested_ci_gco2e_per_mj: 45.00, purchase_price_usd_per_mt: 950.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_FEEDSTOCK_TYPE_NOT_SUPPLIED"
            - "GET /feedstock-lots?supplier_id=${sup_id} returns total_count == 0"

      - name: lot_listing_rejects_limit_above_declared_maximum
        claim_type: Type Constraints
        grounds:
          - response_envelope.pagination_defaults
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100 and returns 422 ERR_INVALID_REQUEST rather than being silently clamped."
        test_recipe:
          setup:
            - "Empty database is sufficient — the pagination bound is checked before any query runs."
          setup_api_calls: []
          trigger:
            - call: "GET /feedstock-lots"
              payload: { limit: 101, offset: 0 }
              as: FeedstockTrader
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: quality_test_rows_are_immutable_and_append_only
        claim_type: Immutability
        grounds:
          - entities.QualityTest
          - calculations.governing_quality_test
          - endpoints["GET /feedstock-lots/{id}/quality-tests"]
        distinguishing_aspect: "QualityTest is declared with common_fields false: a retest appends a second row and never mutates the first, the rows carry no version field, and only the later sampled_at governs the lot's tier and fee."
        test_recipe:
          setup:
            - "One 200.000 MT UCO lot with a PASS test sampled 2026-08-01 (tier NONE, fee 0.00)."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", mass_mt: 200.000, attested_ci_gco2e_per_mj: 32.50, purchase_price_usd_per_mt: 900.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /feedstock-lots/${lot_id}/quality-tests"
              payload: { ffa_pct: 1.00, moisture_pct: 0.20, insolubles_ppm: 100, phosphorus_ppm: 5, sampled_at: "2026-08-01T00:00:00Z", expected_lot_version: "${lot_v0}" }
              as: QualityAnalyst
            - call: "GET /feedstock-lots/${lot_id}"
              payload: {}
              as: QualityAnalyst
              captures: { lot_v1: $.data.version }
          trigger:
            - call: "POST /feedstock-lots/${lot_id}/quality-tests"
              payload: { ffa_pct: 6.00, moisture_pct: 0.20, insolubles_ppm: 100, phosphorus_ppm: 5, sampled_at: "2026-08-02T00:00:00Z", expected_lot_version: "${lot_v1}" }
              as: QualityAnalyst
          assert:
            - "response.status == 201"
            - "GET /feedstock-lots/${lot_id}/quality-tests returns exactly 2 rows ordered created_at ASC"
            - "The first row still has ffa_pct == 1.00, tier == NONE and disposition == PASS"
            - "The second row has ffa_pct == 6.00, ffa_tier_index == 2, tier == HEAVY and disposition == PRETREAT"
            - "Neither QualityTest row exposes a version field and no update endpoint for QualityTest exists in §1.5"
            - "FeedstockLot.${lot_id}.status == PRETREAT_REQUIRED"
            - "FeedstockLot.${lot_id}.pretreatment_tier == HEAVY"
            - "FeedstockLot.${lot_id}.pretreatment_fee_usd == 10260.00"

      - name: traceability_document_under_unknown_supplier_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.TraceabilityDocument.fields.supplier_id
          - validations[priority=3]
          - errors[ERR_SUPPLIER_NOT_FOUND]
        distinguishing_aspect: "A nested create under a supplier id that does not exist returns 404 ERR_SUPPLIER_NOT_FOUND, so the child cannot be orphaned."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /suppliers/00000000-0000-0000-0000-000000000000/traceability-documents"
              payload: { doc_type: "ORIGIN_ATTESTATION", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-orphan-2702" }
              as: FeedstockTrader
          assert:
            - "response.status == 404"
            - "response.error_id == ERR_SUPPLIER_NOT_FOUND"

  - section: state_machines
    instances:
      - name: lot_acceptance_transitions_tested_to_accepted
        claim_type: Valid Transition
        grounds:
          - state_machines[FeedstockLot.status].transitions[TESTED -> ACCEPTED]
          - endpoints["POST /feedstock-lots/{id}/acceptances"]
        distinguishing_aspect: "A lot whose governing test passed (tier NONE) accepts cleanly: status ACCEPTED and version 3 after create(1) + test(2) + acceptance(3)."
        test_recipe:
          setup:
            - "One 500.000 MT UCO lot with a PASS test (ffa 1.00, moisture 0.20, insolubles 100, phosphorus 5 -> tier NONE, fee 0.00)."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "UCO", mass_mt: 500.000, attested_ci_gco2e_per_mj: 32.50, purchase_price_usd_per_mt: 900.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /feedstock-lots/${lot_id}/quality-tests"
              payload: { ffa_pct: 1.00, moisture_pct: 0.20, insolubles_ppm: 100, phosphorus_ppm: 5, sampled_at: "2026-08-01T00:00:00Z", expected_lot_version: "${lot_v0}" }
              as: QualityAnalyst
          trigger:
            - call: "POST /feedstock-lots/${lot_id}/acceptances"
              payload: {}
              as: QualityAnalyst
          assert:
            - "response.status == 200"
            - "FeedstockLot.${lot_id}.status == ACCEPTED"
            - "FeedstockLot.${lot_id}.pretreatment_tier == NONE"
            - "FeedstockLot.${lot_id}.pretreatment_fee_usd == 0.00"
            - "FeedstockLot.${lot_id}.remaining_mass_mt == 500.000"
            - "FeedstockLot.${lot_id}.version == 3"

      - name: catalyst_charge_install_outside_approved_window_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=25]
          - errors[ERR_CATALYST_CHANGE_OUTSIDE_WINDOW]
          - endpoints["POST /hydrotreating-units/{id}/catalyst-charges"]
        distinguishing_aspect: "installed_at 2026-08-03T00:00:00Z is the exclusive end of the approved [2026-08-01, 2026-08-03) CATALYST_CHANGE window, so the install is refused with 409 even though the window exists and is approved."
        test_recipe:
          setup:
            - "HTU-1 with one APPROVED CATALYST_CHANGE window covering [2026-08-01T00:00:00Z, 2026-08-03T00:00:00Z)."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "CATALYST_CHANGE", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              captures: { win_id: $.data.id }
            - call: "POST /turnaround-windows/${win_id}/approvals"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /hydrotreating-units/${unit_id}/catalyst-charges"
              payload: { design_throughput_mt: 60000.0, installed_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_CATALYST_CHANGE_OUTSIDE_WINDOW"
            - "HydrotreatingUnit.${unit_id}.active_catalyst_charge_id == null"
            - "A second install at installed_at 2026-08-02T00:00:00Z (inside the half-open window) returns 201, proving only the boundary was at fault"

      - name: turnaround_window_start_sets_unit_down_turnaround
        claim_type: Side Effect Execution
        grounds:
          - state_machines[TurnaroundWindow.status].transitions[APPROVED -> IN_PROGRESS]
          - state_machines[HydrotreatingUnit.status].transitions[IDLE -> DOWN_TURNAROUND]
          - endpoints["POST /turnaround-windows/{id}/starts"]
        distinguishing_aspect: "Starting an approved window writes two rows: the window becomes IN_PROGRESS and the unit it names becomes DOWN_TURNAROUND with its own version bumped."
        test_recipe:
          setup:
            - "HTU-1 IDLE at version 1 with an APPROVED CATALYST_CHANGE window over [2026-08-01, 2026-08-03); clock inside the window."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "CATALYST_CHANGE", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              captures: { win_id: $.data.id }
            - call: "POST /turnaround-windows/${win_id}/approvals"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /turnaround-windows/${win_id}/starts"
              payload: {}
              as: PlantOperator
          assert:
            - "response.status == 200"
            - "TurnaroundWindow.${win_id}.status == IN_PROGRESS"
            - "HydrotreatingUnit.${unit_id}.status == DOWN_TURNAROUND"
            - "HydrotreatingUnit.${unit_id}.version == 2"
            - "A following POST /turnaround-windows/${win_id}/completions returns the window to COMPLETED and the unit to IDLE with unit.version == 3"

      - name: turnaround_window_start_before_its_window_opens_is_rejected
        claim_type: guarded transitions
        grounds:
          - state_machines[TurnaroundWindow.status].transitions[APPROVED -> IN_PROGRESS].preconditions
          - validations[priority=8]
          - errors[ERR_INVALID_WINDOW_STATE]
        distinguishing_aspect: "The APPROVED -> IN_PROGRESS hop is guarded on the clock, not only on status: an approved window whose start_at is a month away is refused with 409 ERR_INVALID_WINDOW_STATE and the unit stays IDLE."
        test_recipe:
          setup:
            - "HTU-1 with an APPROVED CATALYST_CHANGE window over [2026-09-10, 2026-09-12); clock still at the 2026-08-01 default."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "CATALYST_CHANGE", start_at: "2026-09-10T00:00:00Z", end_at: "2026-09-12T00:00:00Z" }
              as: PlantOperator
              captures: { win_id: $.data.id }
            - call: "POST /turnaround-windows/${win_id}/approvals"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /turnaround-windows/${win_id}/starts"
              payload: {}
              as: PlantOperator
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_INVALID_WINDOW_STATE"
            - "TurnaroundWindow.${win_id}.status == APPROVED"
            - "HydrotreatingUnit.${unit_id}.status == IDLE"

      - name: rejected_lot_cannot_be_accepted
        claim_type: Invalid Transitions
        grounds:
          - state_machines[FeedstockLot.status].terminal_states
          - validations[priority=8]
          - errors[ERR_INVALID_LOT_STATE]
        distinguishing_aspect: "ffa_pct 20.00 exceeds the 15.00 outright-rejection ceiling, so the lot lands in the terminal REJECTED state with tier HEAVY but fee 0.00, and acceptance is then refused with 409."
        test_recipe:
          setup:
            - "One 300.000 MT TALLOW lot with a REJECT test."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Midwest Tallow Partners", country_code: "US", feedstock_types: ["TALLOW"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /feedstock-lots"
              payload: { supplier_id: "${sup_id}", feedstock_type: "TALLOW", mass_mt: 300.000, attested_ci_gco2e_per_mj: 28.00, purchase_price_usd_per_mt: 850.00, received_at: "2026-08-01T00:00:00Z" }
              as: FeedstockTrader
              captures: { lot_id: $.data.id, lot_v0: $.data.version }
            - call: "POST /feedstock-lots/${lot_id}/quality-tests"
              payload: { ffa_pct: 20.00, moisture_pct: 0.30, insolubles_ppm: 200, phosphorus_ppm: 5, sampled_at: "2026-08-01T00:00:00Z", expected_lot_version: "${lot_v0}" }
              as: QualityAnalyst
          trigger:
            - call: "POST /feedstock-lots/${lot_id}/acceptances"
              payload: {}
              as: QualityAnalyst
          assert:
            - "The setup test returned 201 with disposition == REJECT and tier == HEAVY"
            - "FeedstockLot.${lot_id}.status == REJECTED"
            - "FeedstockLot.${lot_id}.pretreatment_tier == HEAVY"
            - "FeedstockLot.${lot_id}.pretreatment_fee_usd == 0.00 (rejection short-circuits the fee before the linear term)"
            - "Trigger response.status == 409 and response.error_id == ERR_INVALID_LOT_STATE"
            - "FeedstockLot.${lot_id}.status is still REJECTED"

      - name: pathway_registration_starts_in_draft_with_zero_revision_rounds
        claim_type: Initial State
        grounds:
          - state_machines[PathwayRegistration.status].initial_state
          - endpoints["POST /pathway-registrations"]
        distinguishing_aspect: "A freshly registered pathway is DRAFT with revision_round 0, variance_strikes 0, certified_ci null and info_request null — nothing is pre-approved."
        test_recipe:
          setup:
            - "HTU-1 exists."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /pathway-registrations"
              payload: { unit_id: "${unit_id}", program: "LCFS", feedstock_type: "UCO", proposed_ci_gco2e_per_mj: 41.25 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { pathway_id: $.data.id }
          assert:
            - "response.status == 201"
            - "PathwayRegistration.${pathway_id}.status == DRAFT"
            - "PathwayRegistration.${pathway_id}.revision_round == 0"
            - "PathwayRegistration.${pathway_id}.variance_strikes == 0"
            - "PathwayRegistration.${pathway_id}.certified_ci_gco2e_per_mj == null"
            - "PathwayRegistration.${pathway_id}.info_request == null"
            - "PathwayRegistration.${pathway_id}.registered_by_user_id == 'officer-a'"
            - "PathwayRegistration.${pathway_id}.version == 1"

      - name: denied_pathway_cannot_be_resubmitted
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines[PathwayRegistration.status].terminal_states
          - validations[priority=8]
          - errors[ERR_INVALID_PATHWAY_STATE]
        distinguishing_aspect: "DENIED is terminal: a further submission is refused with 409 ERR_INVALID_PATHWAY_STATE and revision_round stays 0, so denial is not just another return-for-info."
        test_recipe:
          setup:
            - "One VERIFIED UCO supplier (so submission passes priority 18) and one pathway driven UNDER_REVIEW then DENIED."
          setup_api_calls:
            - call: "POST /suppliers"
              payload: { legal_name: "Gulf Coast Renderers LLC", country_code: "US", feedstock_types: ["UCO"], is_high_risk_origin: false }
              as: FeedstockTrader
              captures: { sup_id: $.data.id }
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "ORIGIN_ATTESTATION", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-orig-2702-c1" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/traceability-documents"
              payload: { doc_type: "MASS_BALANCE_STATEMENT", issued_at: "2026-07-01T00:00:00Z", valid_until: "2027-12-31T00:00:00Z", doc_hash: "h-mb-2702-c1" }
              as: FeedstockTrader
            - call: "POST /suppliers/${sup_id}/due-diligence-verifications"
              payload: { valid_months: 12 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
            - call: "POST /pathway-registrations"
              payload: { unit_id: "${unit_id}", program: "LCFS", feedstock_type: "UCO", proposed_ci_gco2e_per_mj: 41.25 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { pathway_id: $.data.id }
            - call: "POST /pathway-registrations/${pathway_id}/submissions"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /pathway-registrations/${pathway_id}/review-starts"
              payload: {}
              as: IndependentVerifier
              as_user_id: "verifier-a"
            - call: "POST /pathway-registrations/${pathway_id}/review-decisions"
              payload: { decision: "DENY" }
              as: IndependentVerifier
              as_user_id: "verifier-a"
          trigger:
            - call: "POST /pathway-registrations/${pathway_id}/submissions"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_INVALID_PATHWAY_STATE (never ERR_REVISION_LIMIT_EXCEEDED — the state gate fires first)"
            - "PathwayRegistration.${pathway_id}.status == DENIED"
            - "PathwayRegistration.${pathway_id}.revision_round == 0"
            - "PathwayRegistration.${pathway_id}.certified_ci_gco2e_per_mj == null"

      - name: duplicate_nomination_cancellation_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines[HydrogenNomination.status].transitions[CONFIRMED -> CANCELLED]
          - errors[ERR_INVALID_NOMINATION_STATE]
          - endpoints["POST /hydrogen-nominations/{id}/cancellations"]
        distinguishing_aspect: "Cancelling an already CANCELLED nomination is an error, not a no-op: the second call returns 409 and the contract's peak_committed_kg_per_day is not decremented twice."
        test_recipe:
          setup:
            - "HTU-1 with an ACTIVE charge, a PLANNED run over [2026-09-01, 2026-09-06), and a 2600.0 kg/day nomination against a 5000.0 kg/day contract."
          setup_api_calls:
            - call: "POST /hydrotreating-units"
              payload: { name: "HTU-1", nameplate_capacity_mt_per_day: 400.0, max_saf_share_pct: 40.00 }
              as: PlantOperator
              captures: { unit_id: $.data.id }
            - call: "POST /hydrotreating-units/${unit_id}/turnaround-windows"
              payload: { scope: "CATALYST_CHANGE", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-03T00:00:00Z" }
              as: PlantOperator
              captures: { win_id: $.data.id }
            - call: "POST /turnaround-windows/${win_id}/approvals"
              payload: {}
              as: PlantOperator
            - call: "POST /hydrotreating-units/${unit_id}/catalyst-charges"
              payload: { design_throughput_mt: 60000.0, installed_at: "2026-08-02T00:00:00Z" }
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /hydrogen-contracts"
              payload: { vendor_name: "Praxair Gulf", daily_capacity_kg: 5000.0, price_usd_per_kg: 3.50, window_start: "2026-08-25T00:00:00Z", window_end: "2026-09-30T00:00:00Z", hydrogen_ci_gco2e_per_mj: 90.00 }
              as: FeedstockTrader
              captures: { contract_id: $.data.id }
            - call: "POST /processing-runs"
              payload: { unit_id: "${unit_id}", catalyst_charge_id: "${charge_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-06T00:00:00Z", target_saf_share_pct: 10.00 }
              as: PlantOperator
              captures: { run_id: $.data.id }
            - call: "POST /hydrogen-contracts/${contract_id}/nominations"
              payload: { run_id: "${run_id}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-05T00:00:00Z", kg_per_day: 2600.0 }
              as: PlantOperator
              captures: { nom_id: $.data.id }
            - call: "POST /hydrogen-nominations/${nom_id}/cancellations"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /hydrogen-nominations/${nom_id}/cancellations"
              payload: {}
              as: PlantOperator
          assert:
            - "The first cancellation returned 200 with HydrogenNomination.${nom_id}.status == CANCELLED and HydrogenSupplyContract.${contract_id}.peak_committed_kg_per_day == 0.0"
            - "Trigger response.status == 409 and response.error_id == ERR_INVALID_NOMINATION_STATE"
            - "HydrogenSupplyContract.${contract_id}.peak_committed_kg_per_day is still 0.0 and was not driven negative"
            - "HydrogenNomination.${nom_id}.version did not change on the refused call"

      - name: hedge_position_linear_open_to_unwound_returns_margin
        claim_type: linear
        grounds:
          - state_machines[HedgePosition.status].transitions[OPEN -> UNWOUND]
          - endpoints["POST /hedge-positions/{id}/unwinds"]
        distinguishing_aspect: "HedgePosition is a one-hop linear machine: the unwind stamps realized_pnl_usd (3.00 - 2.50) * 10000 = 5000.00 and returns the margin by resetting all three margin fields to 0.00 and the tier to T1."
        test_recipe:
          setup:
            - "One OPEN RIN_FORWARD position: 10000 units at 2.50, maturity 2026-12-31 (base margin 3000.00, T1 adder 30.00, total 3030.00)."
          setup_api_calls:
            - call: "POST /hedge-positions"
              payload: { instrument: "RIN_FORWARD", notional_units: 10000, strike_price_usd: 2.50, maturity_at: "2026-12-31T00:00:00Z" }
              as: FeedstockTrader
              captures: { pos_id: $.data.id }
          trigger:
            - call: "POST /hedge-positions/${pos_id}/unwinds"
              payload: { settlement_price_usd: 3.00 }
              as: FeedstockTrader
          assert:
            - "response.status == 200"
            - "HedgePosition.${pos_id}.status == UNWOUND"
            - "HedgePosition.${pos_id}.settlement_price_usd == 3.00"
            - "HedgePosition.${pos_id}.realized_pnl_usd == 5000.00"
            - "HedgePosition.${pos_id}.base_margin_usd == 0.00"
            - "HedgePosition.${pos_id}.volatility_adder_usd == 0.00"
            - "HedgePosition.${pos_id}.total_margin_usd == 0.00"
            - "HedgePosition.${pos_id}.volatility_tier == T1"
            - "HedgePosition.${pos_id}.gross_notional_usd == 25000.00 (notional is history and is not zeroed)"

      - name: cyclic_pathway_review_loop
        claim_type: cyclic
        excluded_because:
          difficulty_instance: pathway_return_resubmit_cycle_exhausts_revision_rounds
          rationale: "That §1.8 instance walks SUBMITTED -> UNDER_REVIEW -> RETURNED_FOR_INFO -> SUBMITTED three times and asserts revision_round 1/2/3 plus the ERR_REVISION_LIMIT_EXCEEDED refusal on the fourth, which is strictly stronger than a single-lap cycle probe."

      - name: parallel_certification_and_distribution_dimensions
        claim_type: parallel
        excluded_because:
          difficulty_instance: saf_batch_certification_cycle_independent_of_distribution
          rationale: "That §1.8 instance drives ProductBatch.cert_status through CERT_PENDING -> CERT_REJECTED -> CERT_PENDING -> CERTIFIED while distribution_status independently moves IN_TANK -> RESERVED -> IN_TANK -> RESERVED -> SHIPPED, covering the parallel-dimension claim end to end."

      - name: cascade_down_from_supplier_suspension
        claim_type: Cascade down
        excluded_because:
          difficulty_instance: supplier_suspension_cascades_five_levels_to_hydrogen_capacity
          rationale: "That §1.8 instance asserts all five cascade levels of POST /suppliers/{id}/suspensions (supplier SUSPENDED, lots QUARANTINED, allocations RELEASED, run downgraded from HYDROGEN_SECURED, nominations CANCELLED and contract peak recomputed) in one trigger."

      - name: bubble_up_verification_strike_to_pathway
        claim_type: Bubble up
        excluded_because:
          difficulty_instance: second_adjusted_verification_suspends_pathway_and_blocks_sibling_block
          rationale: "That §1.8 instance is exactly the bubble-up case: a child CreditBlock verification decision increments the parent pathway's variance_strikes and, on the second strike, suspends the pathway and blocks its sibling DRAFT block."

      - name: compensation_on_allocation_release
        claim_type: Compensation
        excluded_because:
          difficulty_instance: allocation_release_restores_lot_mass_and_unwinds_hydrogen_securement
          rationale: "That §1.8 instance asserts the full compensating path of POST /feedstock-allocations/{id}/releases: lot mass restored, run reserved mass reduced, blend CI and hydrogen requirement recomputed, and the run demoted out of HYDROGEN_SECURED."

      - name: cross_entity_gate_on_run_start
        claim_type: Cross-entity
        excluded_because:
          difficulty_instance: run_start_blocked_by_unit_taken_down_for_turnaround
          rationale: "That §1.8 instance asserts the cross-entity precondition that a run may only start while its HydrotreatingUnit is IDLE, including the recovery once the turnaround window completes."

      - name: ledger_sync_on_retirement_reversal
        claim_type: Ledger sync
        excluded_because:
          difficulty_instance: retirement_reversal_restores_pathway_credit_balance_exactly
          rationale: "That §1.8 instance asserts the block-to-pathway ledger synchronization on retirement and reversal, including the exact restored pathway outstanding balance."

  - section: calculations
