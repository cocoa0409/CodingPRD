              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${f1_id}", "${f2_id}"], ship_date: "2026-05-05T00:00:00Z", due_date: "2026-05-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { kit_id: $.data.id }
            - call: "POST /optical/home-try-on-kits/${kit_id}/ship"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /optical/home-try-on-kits/${kit_id}/return"
              payload: { kept_frame_ids: ["${f2_id}"] }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "HomeTryOnKit.${kit_id}.status == RETURNED"
            - "HomeTryOnKit.${kit_id}.item_count == 2"
            - "HomeTryOnKit.${kit_id}.kept_count == 1"
            - "HomeTryOnKit.${kit_id}.late_fee_cents == 0"
            - "The TryOnKitItem with frame_id ${f1_id} has outcome == RETURNED"
            - "The TryOnKitItem with frame_id ${f2_id} has outcome == KEPT"
            - "Frame.${f1_id}.tryon_available == 2"
            - "Frame.${f2_id}.tryon_available == 1"
            - "Customer.${cust_id}.lifetime_kit_count == 1"
            - "Customer.${cust_id}.return_risk_score == 0"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: confirm_state_rx_not_verified_beats_fiscal_insufficient_benefit
        grounds:
          - validations[priority=42]
          - validations[priority=72]
          - errors[ERR_PRESCRIPTION_NOT_VERIFIED]
          - errors[ERR_INSUFFICIENT_BENEFIT]
        distinguishing_aspect: |
          Category pair `state` (priority 42, ERR_PRESCRIPTION_NOT_VERIFIED) vs `business_fiscal`
