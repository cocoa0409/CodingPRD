              captures: { patient_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "caller hung up mid intake" }
              as: IntakeAgent
              captures: { call_one_id: $.data.id }
            - call: "POST /triage-calls/${call_one_id}/match-patient"
              payload: { patient_id: "${patient_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_one_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_one_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
            - call: "GET /nurses/${nurse_a_id}"
              as: ChargeNurse
              as_user_id: "${nurse_a_id}"
              captures: { load_after_assign: $.data.active_call_load }
          trigger:
            - call: "POST /triage-calls/${call_one_id}/abandon"
              payload: { abandon_reason: "Caller disconnected before triage could begin." }
              as: IntakeAgent
            - call: "GET /nurses/${nurse_a_id}"
              as: ChargeNurse
              as_user_id: "${nurse_a_id}"
              captures: { load_after_abandon: $.data.active_call_load }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "caller rang back" }
              as: IntakeAgent
              captures: { call_two_id: $.data.id }
            - call: "POST /triage-calls/${call_two_id}/match-patient"
              payload: { patient_id: "${patient_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_two_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_two_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
          assert:
            - "${load_after_assign} == 1"
            - "${load_after_abandon} == 0"
            - "TriageCall.${call_one_id}.status == ABANDONED"
            - "TriageCall.${call_one_id}.abandon_reason == Caller disconnected before triage could begin."
            - "TriageCall.${call_one_id}.assigned_nurse_id == ${nurse_a_id}"
            - "TriageCall.${call_two_id}.status == ASSIGNED"
            - "TriageCall.${call_two_id}.assigned_nurse_id == ${nurse_a_id}"
            - "TriageCall.${call_two_id}.deferred_assignment_count == 0"
            - "Nurse.${nurse_a_id}.active_call_load == 1"
            - "Nurse.${nurse_a_id}.pending_high_risk_count == 0"

      - name: complete_reopen_complete_leaves_both_practice_ledgers_without_a_cent_of_drift
        grounds:
          - calculations.practice_ledger_conservation
          - calculations.call_advice_fee
          - state_machines.TriageCall.CLOSED_to_DISPOSITIONED
          - endpoints[POST /triage-calls/{id}/reopen]
        distinguishing_aspect: "The reopen debit must reuse the values frozen on the call, so an 18-minute completion (85 cents, 20 minutes) reverses to exactly zero on both ledgers and a subsequent 13-minute completion leaves 63 cents and 15 minutes — an implementation that recomputes the debit, or forgets to reset the call's own frozen figures, strands 85 cents or double-counts 20 minutes."
        test_recipe:
          setup:
            - "Clock at 2026-08-03T14:30:00Z (in-hours) with per_minute_rate_millicents 4225."
            - "A HOME_CARE protocol scored with zero red flags, so requires_callback is false and no CallbackTask interferes with the ledger arithmetic."
            - "nurse_b holds the ChargeNurse role that performs the reopen; nurse_a stays the assigned nurse throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, weekend_is_after_hours: true, consent_recording_required: false, variance_review_threshold: 1, audit_period_start_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
              captures: { nurse_a_id: $.data.id }
            - call: "POST /nurses/${nurse_a_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-11111", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /nurses/${nurse_a_id}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurses"
              payload: { full_name: "Ben Ortiz", seniority_level: 4, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
              captures: { nurse_b_id: $.data.id }
            - call: "POST /nurses/${nurse_b_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-22222", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /symptom-protocols"
              payload: { code: "SORE-THROAT", title: "Sore Throat Without Red Flags", base_severity: 20, min_age_years: 0, max_age_years: 120, pregnancy_sensitive: false, emergency_override: false, min_disposition_level: "HOME_CARE", infant_modifier_points: 22 }
              as: PlatformAdmin
              captures: { protocol_id: $.data.id }
            - call: "POST /practices/${practice_id}/patients"
              payload: { full_name: "Dana Reyes", dob: "1990-03-15", sex: "FEMALE", pregnancy_status: "NOT_PREGNANT", phone: "+14155550100", mrn: "MRN-0001" }
              as: PlatformAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "sore throat, no fever" }
              as: IntakeAgent
              captures: { call_id: $.data.id }
            - call: "POST /triage-calls/${call_id}/match-patient"
              payload: { patient_id: "${patient_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/assessments"
              payload: { protocol_id: "${protocol_id}", confirmation_mode: "CONFIRMED", red_flag_count: 0, confirmed_pregnancy_status: "NOT_PREGNANT" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { assessment_id: $.data.id }
            - call: "GET /triage-calls/${call_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { call_version: $.data.version }
            - call: "POST /dispositions"
              payload: { call_id: "${call_id}", assessment_id: "${assessment_id}", final_level: "HOME_CARE", expected_call_version: "${call_version}" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { disposition_id: $.data.id }
          trigger:
            - call: "POST /triage-calls/${call_id}/complete"
              payload: { handle_minutes: 18 }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
            - call: "GET /practices/${practice_id}"
              as: PlatformAdmin
              captures: { accrued_after_first_complete: $.data.advice_fee_accrued_cents, minutes_after_first_complete: $.data.billed_advice_minutes_total }
            - call: "POST /triage-calls/${call_id}/reopen"
              payload: { reopen_reason: "Caller rang back within the hour to add symptoms." }
              as: ChargeNurse
              as_user_id: "${nurse_b_id}"
            - call: "GET /practices/${practice_id}"
              as: PlatformAdmin
              captures: { accrued_after_reopen: $.data.advice_fee_accrued_cents, minutes_after_reopen: $.data.billed_advice_minutes_total }
            - call: "POST /triage-calls/${call_id}/complete"
              payload: { handle_minutes: 13 }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
          assert:
            - "${accrued_after_first_complete} == 85"
            - "${minutes_after_first_complete} == 20"
            - "${accrued_after_reopen} == 0"
            - "${minutes_after_reopen} == 0"
            - "Practice.${practice_id}.advice_fee_accrued_cents == 63"
            - "Practice.${practice_id}.billed_advice_minutes_total == 15"
            - "TriageCall.${call_id}.status == CLOSED"
            - "TriageCall.${call_id}.handle_minutes == 13"
            - "TriageCall.${call_id}.billable_minutes == 15"
            - "TriageCall.${call_id}.advice_fee_cents == 63"
            - "TriageCall.${call_id}.reopen_count == 1"
            - "Disposition.${disposition_id}.requires_callback == false"
            - "Practice.${practice_id}.open_callback_count == 0"
            - "Nurse.${nurse_a_id}.active_call_load == 0"
