  - name: cohort_below_minimum_suppresses_the_ratio_and_the_flag
    claim_type: constants_applied
    grounds:
    - calculations.outcome_oe_ratio
    - calculations.outcome_oe_ratio.constants.MIN_COHORT_SIZE
    - entities.ProgramOutcomeReview.fields.expected_survivor_count
    - entities.ProgramOutcomeReview.fields.requires_improvement_plan
    distinguishing_aspect: expected_survivor_count is still computed and stored (7.2) for a 9-case cohort,
      but MIN_COHORT_SIZE 10 suppresses oe_ratio to null and forces flag_level NONE even though 3 of 9
      survivors would otherwise rate catastrophically.
    test_recipe:
      setup:
      - Program NLT-01 has expected_one_year_survival_rate 0.80 and a QualityOfficer on staff.
      - The review covers 2025-01-01..2025-12-31 with cohort_size 9 and observed_survivor_count 3.
      - expected_survivor_count = round_half_up(9 * 0.80, 2) = 7.2; the raw ratio 3 / 7.2 would be 0.4167
        -> FLAGGED.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Quality Officer One
          staff_role: QUALITY_OFFICER
          npi: '1000000005'
        as: ProgramAdmin
        captures:
          qo_id: $.data.id
      trigger:
        call: POST /outcome-reviews
        payload:
          program_id: ${prog_id}
          period_start_on: '2025-01-01'
          period_end_on: '2025-12-31'
          cohort_size: 9
          observed_survivor_count: 3
        as: QualityOfficer
        as_user_id: ${qo_id}
      assert:
      - HTTP 201 with status == DRAFT
      - expected_survival_rate_used == 0.80 and expected_survivor_count == 7.2
      - oe_ratio is null
      - flag_level == NONE and requires_improvement_plan == false
      - TransplantProgram.${prog_id}.compliance_posture remains OPEN (a DRAFT review never moves the posture)
      - finalized_at is null and version == 1
  - name: calculation_risk_index_variant_divergence_covered_by_difficulty_design
    claim_type: variant_divergence
    grounds:
    - calculations.donor_risk_index
    excluded_because:
      difficulty_instance: dual_variant_calc / donor_risk_index_screening_vs_final_on_same_donor
      rationale: That §1.8 instance drives both variants on ONE donor with identical inputs and asserts
        the 0.6/0.4 versus 0.5/0.5 divergence plus the deferral and NDD surcharges, which is exactly the
        variant-divergence claim.
  - name: calculation_cost_variant_selection_covered_by_difficulty_design
    claim_type: variant_selection
    grounds:
    - calculations.donor_cost_reimbursement
    excluded_because:
      difficulty_instance: dual_variant_calc / donor_cost_claim_estimated_vs_adjudicated_waterfall
      rationale: That §1.8 instance shows the estimated variant written at creation and the adjudicated
        variant written at approval on the same claim, which is the variant-selection claim for this rule.
  - name: calculation_fund_ledger_reconciliation_covered_by_difficulty_design
    claim_type: reconciliation
    grounds:
    - calculations.donor_fund_ledger
    - calculations.chain_commitment_conservation
    excluded_because:
      difficulty_instance: compensating_invariant / donor_fund_ledger_restored_by_claim_reversal
      rationale: That §1.8 instance asserts the ledger returns to its exact pre-adjudication figures after
        a reversal with no residue, which is the reconciliation claim.
  - name: calculation_component_rounding_precision_covered_by_difficulty_design
    claim_type: precision
    grounds:
    - calculations.waitlist_priority_score
    excluded_because:
      difficulty_instance: combinatorial_formula / waitlist_priority_component_rounding_order
      rationale: That §1.8 instance contrasts per-component half-up rounding with rounding the sum once
        and pins the 0.01 divergence, which is the precision claim for this rule.
  - name: calculation_chain_topology_ordering_covered_by_difficulty_design
    claim_type: topological
    grounds:
    - calculations.chain_topology
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / participant_eligibility_precedes_topology_on_chain_validation
      rationale: That §1.8 instance walks the ordered topology rungs (contiguity, linkage, uniqueness,
        ABO, loop closure) against the participant-eligibility rungs, which is the topological claim.
  - name: calculation_posture_constraint_propagation_covered_by_difficulty_design
    claim_type: constraint_propagation
    grounds:
    - calculations.compliance_posture
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / chain_commitment_blocked_by_frozen_program_posture
      rationale: That §1.8 instance propagates a review flag through the posture derivation into a refused
        child write, which is the constraint-propagation claim.
  - name: calculation_cooling_off_nested_ceiling_covered_by_difficulty_design
    claim_type: threshold
    grounds:
    - calculations.cooling_off_window
    excluded_because:
      difficulty_instance: combinatorial_formula / cooling_off_window_nested_max_ceil_on_re_disclosure
      rationale: That §1.8 instance drives the nested max(MIN_RE_DISCLOSURE_DAYS, ceil(base/2)) branch
        with the non-directed surcharge already applied, which is this rule's threshold claim.
