scaffold_difficulty_design:

  # =============================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_estimate_vs_final_boundary_at_24h
        grounds:
          - calculations.appointment_refund
          - calculations.appointment_refund.variants.forward_refund_estimate
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
          - endpoints.GET_/counseling/appointments/{id}/refund-estimate
          - endpoints.POST_/counseling/appointments/{id}/cancel
        distinguishing_aspect: |
          Operates on the Appointment entity (cost-accounting domain): the forward estimate uses STRICT
          hours_to_start > 24 to predict FULL refund, while the final cancellation transition uses
          hours_to_start >= 24, so at exactly 24.0 hours the estimate says PARTIAL but the cancellation
          settles FULL. Two valid algorithms produce different cents for the same Appointment row.
        test_recipe:
          setup:
            - "Clock pinned at T0 = 2026-06-01T00:00:00Z."
            - "ACTIVE Counselor C with revenue_share_bps=7000 and supported_channels including VIDEO."
            - "Client K with assessment_status=COMPLETED, package_balance_sessions=0."
            - "AvailabilitySlot S for C at start_at = T0 + 25h, end_at = +26h, channel=VIDEO."
            - "POST /counseling/appointments creates Appointment A in HOLD on slot S, payment_mode=PAY_PER_SESSION, appointment_type=STANDARD."
            - "POST /counseling/appointments/{A}/confirm authorises payment; SettlementLedger CHARGE row L with gross_amount_cents=12000 inserted."
            - "POST /_clock/advance to T0 + 1h (so now() == start_at - 24h exactly)."
          trigger:
            - "GET /counseling/appointments/{A}/refund-estimate"
            - "POST /counseling/appointments/{A}/cancel with reason=CLIENT_CANCEL"
          assert:
            - "GET refund-estimate returns refund_state == 'PARTIAL_REFUNDED' and refund_gross_cents == 6000."
            - "POST cancel returns Appointment.refund_state == 'FULL_REFUNDED'."
            - "After cancel a SettlementLedger REFUND row exists with gross_amount_cents == -12000 and counselor_share_cents == -8400 and tax_cents == -1050 and platform_share_cents == -3600."

      - name: charge_breakdown_pay_per_session_vs_package_same_session
        grounds:
          - calculations.settlement_charge_breakdown
          - calculations.settlement_charge_breakdown.variants.package_vs_per_session
          - state_machines.Appointment.HOLD_to_CONFIRMED
          - entities.SettlementLedger.fields.counselor_share_cents
          - entities.SettlementLedger.fields.platform_share_cents
          - endpoints.POST_/counseling/appointments/{id}/confirm
        distinguishing_aspect: |
          Operates on the SettlementLedger entity (revenue-share domain), not on Appointment cost. For
          identical session inputs (same counselor, same list price 12000), PAY_PER_SESSION yields
          counselor_share=8400, platform_share=3600, tax=1050; PACKAGE yields counselor_share=6300,
          platform_share=-6300, tax=0. Same session data, two valid revenue-share algorithms, different
          cents on a different entity than refund.
        test_recipe:
          setup:
            - "Clock pinned at T0 = 2026-06-01T00:00:00Z."
            - "ACTIVE Counselor C with revenue_share_bps=7000."
            - "Two clients K1, K2 each with assessment_status=COMPLETED."
            - "K1.package_balance_sessions=0; K2.package_balance_sessions=5 (admin credited via POST /clients/{id}/credit-package)."
            - "Two slots S1 (for K1) and S2 (for K2) at distinct times >= T0 + 2h, each channel=VIDEO."
            - "POST /counseling/appointments for both, payment_mode=PAY_PER_SESSION (A1), payment_mode=PACKAGE (A2)."
          trigger:
            - "POST /counseling/appointments/{A1}/confirm"
            - "POST /counseling/appointments/{A2}/confirm"
          assert:
            - "GET /counseling/settlement-ledger?appointment_id={A1} returns one row with gross_amount_cents == 12000, tax_cents == 1050, counselor_share_cents == 8400, platform_share_cents == 3600, direction == 'CHARGE'."
            - "GET /counseling/settlement-ledger?appointment_id={A2} returns one row with gross_amount_cents == 0, tax_cents == 0, counselor_share_cents == 6300, platform_share_cents == -6300, direction == 'CHARGE'."
            - "Client K2.package_balance_sessions == 4 after confirm."

  # =============================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: refund_three_input_nested_branches
        grounds:
          - calculations.appointment_refund
          - validations[priority=18]
          - endpoints.POST_/counseling/appointments/{id}/cancel
        distinguishing_aspect: |
          Mode (a): formula has THREE inputs (cancellation_reason, hours_to_start, payment_mode) with
          NON-LINEAR interaction — refund_state is a tiered selection (FULL/PARTIAL/NON_REFUNDABLE) that
          depends on cancellation_reason as an outer branch and on hours_to_start tier as an inner
          branch, then payment_mode controls whether the refund goes to ledger cash or package balance.
        test_recipe:
          setup:
            - "Clock at T0; ACTIVE Counselor C; Client K with assessment_status=COMPLETED, package_balance_sessions=2."
            - "Three confirmed appointments A1, A2, A3 with PACKAGE payment_mode and start_at at T0+1h, T0+5h, T0+30h respectively."
            - "Client K consumed 3 packages -> package_balance_sessions=2 - 3 = ... seed K.package_balance_sessions=5; after three confirms it is 2."
          trigger:
            - "POST /counseling/appointments/{A1}/cancel reason=CLIENT_CANCEL  # hours_to_start=1 -> NON_REFUNDABLE"
            - "POST /counseling/appointments/{A2}/cancel reason=CLIENT_CANCEL  # hours_to_start=5 -> PARTIAL_REFUNDED"
            - "POST /counseling/appointments/{A3}/cancel reason=CLIENT_CANCEL  # hours_to_start=30 -> FULL_REFUNDED"
          assert:
            - "A1.refund_state == 'NON_REFUNDABLE' and Client K.package_balance_sessions does NOT change for A1."
            - "A2.refund_state == 'PARTIAL_REFUNDED' and a SettlementLedger REFUND row exists with gross_amount_cents == -6000."
            - "A3.refund_state == 'FULL_REFUNDED' and Client K.package_balance_sessions increments by 2 (for A2 and A3 only): final value == 4."

      - name: settlement_per_component_vs_sum_then_round
        grounds:
          - calculations.settlement_charge_breakdown
          - calculations.settlement_charge_breakdown.variants.rounding_order_pin
          - entities.SettlementLedger.fields.platform_share_cents
        distinguishing_aspect: |
          Mode (b): rounding ORDER matters. Spec pins 'counselor_share rounded first, platform_share = base
          - counselor_share' (per-component then subtract). The alternate order 'round(base * (1 -
          share_bps/10000))' produces a different cent at base=12345 cents and share_bps=6667 (method A
          gives platform=4115; method B gives platform=4115 as well in that case, but with base=12345 and
          share_bps=6789, method A: counselor=round_half_up(12345*6789/10000)=round_half_up(8381.0205)=8381,
          platform=12345-8381=3964; method B: round_half_up(12345*3211/10000)=round_half_up(3963.9795)=3964
          — they tie here too because both halves round the same direction. Spec WRITTEN order is method A,
          so a custom test uses a counselor with revenue_share_bps=6667 and list_price_cents=10001:
          method A counselor=round_half_up(10001*6667/10000)=round_half_up(6667.6667)=6668, platform=10001-6668=3333;
          method B platform=round_half_up(10001*3333/10000)=round_half_up(3333.3333)=3333. Spec pinned A: 6668/3333.)
        test_recipe:
          setup:
            - "ACTIVE Counselor C with revenue_share_bps=6667."
            - "Override list_price_cents seed to 10001 by creating a system-config slot price (or use Counselor-specific override if available; otherwise direct charge through admin /clients/{id}/credit-package not applicable; in this scaffold list_price_cents defaults 12000 — use the default 12000 with share_bps=6667 instead)."
            - "(Effective setup) Counselor C revenue_share_bps=6667; Client K assessment_status=COMPLETED; SLOT and confirmed Appointment A with PAY_PER_SESSION at default list_price_cents=12000."
          trigger:
            - "POST /counseling/appointments/{A}/confirm"
          assert:
            - "SettlementLedger row counselor_share_cents == 8000   # round_half_up(12000*6667/10000) = round_half_up(8000.4) = 8000"
            - "SettlementLedger row platform_share_cents == 4000   # 12000 - 8000 = 4000 (method A); method B would give round_half_up(12000*3333/10000)=round_half_up(3999.6)=4000 — tie at this point. Use the boundary case 12345 by setting list_price_cents override at counselor profile level if supported; otherwise the test asserts the exact pinned formula behaviour 8000/4000 for this fixture."
            - "Asserted invariant: counselor_share_cents + platform_share_cents == gross_amount_cents (12000) — independent of which order; the rounding-order pin is asserted via the calculation comment in audit log."

  # =============================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: counselor_active_suspended_cycle
        grounds:
          - state_machines.Counselor
          - state_machines.Counselor.ACTIVE_to_SUSPENDED
          - state_machines.Counselor.SUSPENDED_to_ACTIVE
          - state_machines.CertificationCycle.OPEN_to_EXPIRED
          - state_machines.CertificationCycle.UNDER_REVIEW_to_APPROVED
          - endpoints.POST_/counseling/_sweep/recert
          - endpoints.POST_/counseling/certification-cycles/{id}/approve
        distinguishing_aspect: |
          Counselor exhibits a CYCLE: ACTIVE -> SUSPENDED (via cycle EXPIRED sweep) -> ACTIVE (via next
          cycle APPROVED). This is non-linear cycle shape on the Counselor entity.
        test_recipe:
          setup:
            - "Clock at T0; PlatformAdmin registers Counselor C; cycle 1 OPEN with window_end_at=T0+365d."
            - "Approve cycle 1 (after seeding required_supervision_hours=40 + required_ce_hours=12 of approved sup/CE within window). Counselor C.status -> ACTIVE; cycle 2 auto-created OPEN with window_end_at=T0+365d+730d."
          trigger:
            - "POST /_clock/advance to T0 + 365d + 730d + 1s (past cycle 2 deadline)."
            - "POST /_sweep/recert  # cycle 2 OPEN -> EXPIRED; Counselor ACTIVE -> SUSPENDED."
            - "Admin POST /counselors/{C}/certification-cycles  # creates cycle 3 OPEN."
            - "Seed 20h supervision + 12h CE approved within cycle 3 window via POST /supervision-sessions, /approve, /ce-records, /approve."
            - "POST /certification-cycles/{cycle_3}/submit"
            - "POST /certification-cycles/{cycle_3}/approve  # SUSPENDED -> ACTIVE."
          assert:
            - "After sweep: Counselor C.status == 'SUSPENDED'."
            - "After cycle 3 approval: Counselor C.status == 'ACTIVE'."
            - "Counselor C.status field has been written values 'PENDING_CERT', 'ACTIVE', 'SUSPENDED', 'ACTIVE' in order (audit-log RECERT_DECISION entries in that sequence)."

      - name: crisis_branching_severity_dependent_path
        grounds:
          - state_machines.CrisisIncident
          - state_machines.CrisisIncident.HANDED_OVER_to_EMERGENCY_NOTIFIED
          - state_machines.CrisisIncident.HANDED_OVER_to_FOLLOW_UP_SCHEDULED
          - state_machines.CrisisIncident.EMERGENCY_NOTIFIED_to_FOLLOW_UP_SCHEDULED
          - validations[priority=27]
        distinguishing_aspect: |
          Branching fork on a different entity: CrisisIncident at HANDED_OVER forks based on severity into
          either {HANDED_OVER -> EMERGENCY_NOTIFIED -> FOLLOW_UP_SCHEDULED} when severity IN {MEDIUM, HIGH}
          OR directly {HANDED_OVER -> FOLLOW_UP_SCHEDULED} when severity = LOW (notify-emergency rejected
          with ERR_NOTIFY_NOT_REQUIRED). Different entity than Counselor; different non-linear shape (fork
          rather than cycle).
        test_recipe:
          setup:
            - "ACTIVE Counselor C; Client K with emergency_contact_phone set; Appointment A1 IN_SESSION; Appointment A2 IN_SESSION (different sessions)."
            - "POST /crisis-incidents creates CI_LOW for A1 with detection_source=COUNSELOR_TRIGGERED."
            - "POST /crisis-incidents creates CI_HIGH for A2 with detection_source=COUNSELOR_TRIGGERED."
          trigger:
            - "CrisisResponder POST /crisis-incidents/{CI_LOW}/handover  body severity=LOW"
            - "CrisisResponder POST /crisis-incidents/{CI_LOW}/notify-emergency  -> expect ERR_NOTIFY_NOT_REQUIRED 422"
            - "CrisisResponder POST /crisis-incidents/{CI_LOW}/schedule-follow-up"
            - "CrisisResponder POST /crisis-incidents/{CI_HIGH}/handover  body severity=HIGH"
            - "CrisisResponder POST /crisis-incidents/{CI_HIGH}/notify-emergency"
            - "CrisisResponder POST /crisis-incidents/{CI_HIGH}/schedule-follow-up"
          assert:
            - "CI_LOW.status transitions: DETECTED -> HANDED_OVER -> FOLLOW_UP_SCHEDULED (skipping EMERGENCY_NOTIFIED)."
            - "CI_HIGH.status transitions: DETECTED -> HANDED_OVER -> EMERGENCY_NOTIFIED -> FOLLOW_UP_SCHEDULED."
            - "CI_LOW.emergency_notified_at is null; CI_HIGH.emergency_notified_at != null."

  # =============================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: disqualify_chain_depth_3
        grounds:
          - state_machines.Counselor.ACTIVE_to_DISQUALIFIED
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
          - calculations.appointment_refund
          - entities.Client.fields.package_balance_sessions
          - endpoints.POST_/counseling/counselors/{id}/disqualify
        distinguishing_aspect: |
          Trigger: POST /counselors/{id}/disqualify. Hop 1: Counselor.status -> DISQUALIFIED mutates the
          Counselor row. Hop 2: BECAUSE of hop 1 (not as fan-out from the original action), each owned
          CONFIRMED future Appointment is mutated to CANCELLED with refund_state=FULL_REFUNDED. Hop 3:
          BECAUSE the appointment refunded, each PACKAGE-mode appointment credits Client.package_balance_sessions
          and a SettlementLedger REFUND row is inserted with negative gross/tax/share. Depth 3, all causal.
        test_recipe:
          setup:
            - "ACTIVE Counselor C with revenue_share_bps=7000."
            - "Client K with package_balance_sessions=5, assessment_status=COMPLETED."
            - "Two CONFIRMED appointments far in future (T0+5d, T0+6d): A1 PAY_PER_SESSION at list_price_cents=12000, A2 PACKAGE."
            - "Confirms have produced ledger CHARGE rows: A1 -> CHARGE(gross=12000, tax=1050, share=8400, platform=3600); A2 -> CHARGE(gross=0, tax=0, share=6300, platform=-6300). Client K.package_balance_sessions == 4 after A2 confirm."
          trigger:
            - "POST /counselors/{C}/disqualify"
          assert:
            - "Counselor C.status == 'DISQUALIFIED'."
            - "Appointment A1.status == 'CANCELLED' AND A1.refund_state == 'FULL_REFUNDED' AND A1.cancellation_reason == 'COUNSELOR_CANCEL'."
            - "SettlementLedger has a REFUND row for A1 with gross_amount_cents == -12000 AND tax_cents == -1050 AND counselor_share_cents == -8400 AND platform_share_cents == -3600."
            - "Appointment A2.status == 'CANCELLED' AND A2.refund_state == 'FULL_REFUNDED'."
            - "SettlementLedger has a REFUND row for A2 with gross_amount_cents == 0 AND tax_cents == 0 AND counselor_share_cents == -6300 AND platform_share_cents == 6300."
            - "Client K.package_balance_sessions == 5 (incremented from 4 by 1 because of A2's package credit-back)."
            - "AvailabilitySlot rows for A1, A2 have status == 'RELEASED'."
            - "AuditLogEntry with action == 'COUNSELOR_DISQUALIFIED' exists with target_id == C.id."

      - name: cycle_expiry_chain_depth_3
        grounds:
          - state_machines.CertificationCycle.OPEN_to_EXPIRED
          - state_machines.Counselor.ACTIVE_to_SUSPENDED
          - state_machines.AvailabilitySlot.OPEN_to_BLOCKED
          - state_machines.Appointment.HOLD_to_CANCELLED
          - endpoints.POST_/counseling/_sweep/recert
        distinguishing_aspect: |
          Trigger: POST /_sweep/recert (different trigger from disqualify cascade). Hop 1: CertificationCycle
          OPEN -> EXPIRED mutates the cycle. Hop 2: BECAUSE the cycle expired (not as a parallel fan-out),
          Counselor ACTIVE -> SUSPENDED. Hop 3: BECAUSE the counselor was suspended, OPEN AvailabilitySlot
          rows -> BLOCKED and HOLD Appointments -> CANCELLED. Depth 3, distinct from disqualify chain in
          both trigger and propagation pattern.
        test_recipe:
          setup:
            - "ACTIVE Counselor C (cycle 1 already approved); Client K with assessment_status=COMPLETED."
            - "OPEN AvailabilitySlot S1 at T0 + 2d, channel=VIDEO."
            - "Appointment A in HOLD on S1 (held_until = T0 + 15m)."
            - "Cycle 2 OPEN with window_end_at = T0 + 1h."
            - "Sweep no-op at T0 (cycle still open)."
          trigger:
            - "POST /_clock/advance to T0 + 1h + 1s"
            - "POST /_sweep/recert"
          assert:
            - "CertificationCycle 2.status == 'EXPIRED' AND decided_by_user_id is null."
            - "Counselor C.status == 'SUSPENDED'."
            - "AvailabilitySlot S1.status == 'BLOCKED'."
            - "Appointment A.status == 'CANCELLED' AND A.cancellation_reason == 'COUNSELOR_CANCEL'."
            - "AuditLogEntry with action == 'RECERT_DECISION' AND target_id == cycle 2.id exists."

  # =============================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_record_create
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - endpoints.POST_/counseling/counseling-records
        distinguishing_aspect: |
          Pair = (state, business_safety). Two checks fail simultaneously: appointment is not in
          COMPLETED (state) AND the encrypted note contains a RISK_KEYWORD (business_safety). Per priority
          ordering ERR_INVALID_STATE (P5, state) wins over ERR_CRISIS_AUTO_RAISED (P7, business_safety).
        test_recipe:
          setup:
            - "ACTIVE Counselor C; Client K assessment_status=COMPLETED; Appointment A in HOLD (NOT COMPLETED)."
          trigger:
            - "Counselor POST /counseling-records {appointment_id: A, encrypted_note_blob: <ciphertext containing keyword 'suicide'>}"
          assert:
            - "Response status == 409."
            - "Response body data.error_id == 'ERR_INVALID_STATE' (NOT 'ERR_CRISIS_AUTO_RAISED')."

      - name: business_temporal_vs_business_fiscal_on_confirm
        grounds:
          - validations[priority=17]
          - validations[priority=20]
          - endpoints.POST_/counseling/appointments/{id}/confirm
        distinguishing_aspect: |
          Pair = (business_temporal, business_fiscal) — different from the (state, business_safety) pair
          above. Two checks fail simultaneously on confirm: now() crosses start_at - 1h (business_temporal)
          AND PACKAGE balance is 0 (business_fiscal). Per priority ordering ERR_BOOKING_TOO_LATE (P17,
          business_temporal) wins over ERR_INSUFFICIENT_PACKAGE_BALANCE (P20, business_fiscal).
        test_recipe:
          setup:
            - "ACTIVE Counselor C; Client K assessment_status=COMPLETED, package_balance_sessions=0."
            - "Slot S start_at = T0 + 30m; Appointment A in HOLD on S, payment_mode=PACKAGE, held_until=T0+15m."
            - "Note: created appointment passed P17 because at T0 hours_to_start=30m > 1h? No — 30m < 1h means it would have failed at create. So the test needs a different setup: clock at T0+0; create slot for T0+2h; create+hold appointment with PACKAGE; advance clock past start_at - 1h (i.e., to T0+1h+1s) BEFORE confirming."
            - "(Effective) Slot S start_at = T0 + 2h; Appointment A in HOLD with PACKAGE; held_until = T0 + 15m."
            - "POST /_clock/advance to T0 + 1h + 1s (past start_at - 1h boundary; held_until also expired but P5 hold-expired check is at P19 still after temporal P17)."
          trigger:
            - "POST /counseling/appointments/{A}/confirm"
          assert:
            - "Response status == 422."
            - "Response body data.error_id == 'ERR_BOOKING_TOO_LATE' (NOT 'ERR_INSUFFICIENT_PACKAGE_BALANCE')."

  # =============================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =============================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: refund_boundary_24h_inclusive
        grounds:
          - calculations.appointment_refund
          - validations[priority=18]
          - endpoints.POST_/counseling/appointments/{id}/cancel
        distinguishing_aspect: |
          Numeric threshold metric (hours_to_start) on the cancel endpoint. Boundary at exactly 24.0:
          final transition uses >= so 24.0 -> FULL_REFUNDED; estimate uses > so 24.0 -> PARTIAL_REFUNDED.
        test_recipe:
          setup:
            - "Confirmed Appointment A with start_at = T0 + 25h (so at T0+1h hours_to_start = 24.0)."
            - "POST /_clock/advance to T0 + 1h."
          trigger:
            - "POST /counseling/appointments/{A}/cancel reason=CLIENT_CANCEL"
          assert:
            - "Appointment A.refund_state == 'FULL_REFUNDED'."
            - "SettlementLedger REFUND row gross_amount_cents == -12000."

      - name: daily_cap_boundary_480_strict_exceed
        grounds:
          - calculations.counselor_session_scheduling_invariants
          - validations[priority=15]
          - endpoints.POST_/counseling/availability-slots
        distinguishing_aspect: |
          DIFFERENT metric (daily-cap minutes) on a DIFFERENT endpoint (availability-slots). Boundary uses
          strict > on (daily_minutes + 60) > 480: 7 existing 60-min slots (=420) plus a new 60 -> 480
          (== cap, ALLOWED), 8 existing -> 480 + 60 = 540 > 480 (REJECTED).
        test_recipe:
          setup:
            - "ACTIVE Counselor C (cycle 1 approved). Counselor.timezone='America/Los_Angeles'."
            - "Create 7 slots on the same local calendar day, non-overlapping with at least 15-min gaps, all 60-min, channel=VIDEO."
          trigger:
            - "POST /counseling/availability-slots — 8th slot on the SAME local day (call it boundary slot B; should succeed if rest interval permits because daily_minutes + 60 = 420 + 60 = 480 ≤ 480)."
            - "POST /counseling/availability-slots — 9th slot on the SAME local day (call it overflow slot D; should fail with ERR_DAILY_CAP_EXCEEDED because 480 + 60 = 540 > 480)."
          assert:
            - "8th slot creation returns 201 with status=OPEN."
            - "9th slot creation returns 422 with error_id == 'ERR_DAILY_CAP_EXCEEDED'."

  # =============================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: appointment_confirm_depends_on_counselor_active
        grounds:
          - state_machines.Appointment.HOLD_to_CONFIRMED
          - state_machines.Counselor.ACTIVE_to_SUSPENDED
          - validations[priority=6]
          - endpoints.POST_/counseling/appointments/{id}/confirm
        distinguishing_aspect: |
          Pair = (Appointment, Counselor). Appointment HOLD -> CONFIRMED requires Counselor.status=ACTIVE.
          If Counselor flips to SUSPENDED (e.g., via cycle expiry), the in-flight confirm fails with
          ERR_COUNSELOR_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Counselor C ACTIVE; Client K assessment_status=COMPLETED; Appointment A in HOLD on slot S, payment_mode=PAY_PER_SESSION."
            - "Cycle 2 OPEN with window_end_at = T0 + 30m."
            - "POST /_clock/advance to T0 + 31m."
            - "POST /_sweep/recert  # Counselor C.status -> SUSPENDED."
          trigger:
            - "POST /counseling/appointments/{A}/confirm"
          assert:
            - "Response status == 409."
            - "Response body data.error_id == 'ERR_COUNSELOR_NOT_ACTIVE'."
            - "Appointment A.status remains 'HOLD' (or becomes CANCELLED via SUSPENDED cascade — assertion: A.status IN {'HOLD', 'CANCELLED'})."

      - name: slot_hold_depends_on_client_assessment
        grounds:
          - state_machines.AvailabilitySlot.OPEN_to_HELD
          - entities.Client.fields.assessment_status
          - validations[priority=9]
          - endpoints.POST_/counseling/appointments
        distinguishing_aspect: |
          DIFFERENT entity pair (AvailabilitySlot, Client) with DIFFERENT cross-entity dependency. Slot
          OPEN -> HELD via POST /appointments rejects when Client.assessment_status=PENDING and the
          appointment_type != INTAKE.
        test_recipe:
          setup:
            - "ACTIVE Counselor C; Client K with assessment_status=PENDING (default for newly registered)."
            - "AvailabilitySlot S in OPEN, channel=VIDEO."
          trigger:
            - "POST /counseling/appointments {counselor_id: C, client_id: K, slot_id: S, appointment_type: STANDARD, payment_mode: PAY_PER_SESSION}"
          assert:
            - "Response status == 422."
            - "Response body data.error_id == 'ERR_INTAKE_REQUIRED'."
            - "AvailabilitySlot S.status remains 'OPEN'."

  # =============================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_overlap_with_pre_buffer_rest_interval
        grounds:
          - calculations.counselor_session_scheduling_invariants
          - validations[priority=13]
          - validations[priority=14]
          - endpoints.POST_/counseling/availability-slots
        distinguishing_aspect: |
          Resource = AvailabilitySlot (per counselor). Interval semantics: half-open intervals; adjacent
          (gap == 0) is ALLOWED; rest-interval rejection only when gap is in OPEN range (0, 15) minutes —
          ASYMMETRIC (no post-buffer enforcement; pre-only matters because slots are 60-min identical
          shapes). Different from supervision overlap below.
        test_recipe:
          setup:
            - "ACTIVE Counselor C with channel=VIDEO; existing slot S1 at [T0+10:00, T0+11:00)."
          trigger:
            - "POST /counseling/availability-slots S2 at [T0+11:00, T0+12:00)  # adjacent, gap=0 minutes."
            - "POST /counseling/availability-slots S3 at [T0+11:05, T0+12:05)  # overlap with S2 already created."
            - "POST /counseling/availability-slots S4 (alternate run, S2/S3 not present) at [T0+11:10, T0+12:10) on top of just S1  # gap=10 minutes after S1."
          assert:
            - "S2 creation returns 201 (adjacency at boundary allowed; half-open semantics)."
            - "S3 creation returns 422 with error_id == 'ERR_SLOT_OVERLAP'."
            - "S4 creation (replayed) returns 422 with error_id == 'ERR_REST_INTERVAL'."

      - name: supervision_symmetric_30m_buffer
        grounds:
          - calculations.supervision_overlap_check
          - endpoints.POST_/counseling/supervision-sessions
        distinguishing_aspect: |
          DIFFERENT resource (Supervisor on SupervisionSession) with DIFFERENT interval semantics:
          SYMMETRIC ±30-minute buffer around scheduled_at (interval = [scheduled_at - 30m, scheduled_at +
          30m)), so two supervisions for the same supervisor scheduled less than 60 minutes apart collide,
          regardless of duration. Slot overlap above is duration-based half-open intersection; this rule
          is point-buffer based. Different interval arithmetic.
        test_recipe:
          setup:
            - "Two ACTIVE Counselors: SUP (supervisor role) and C (supervisee), with overlapping specialty_tags."
            - "C has a COMPLETED Appointment A1 in cycle 1 window."
            - "Supervisor SUP already has SupervisionSession SS1 PENDING_REVIEW with scheduled_at = T0 + 10:00."
          trigger:
            - "C POST /counseling/supervision-sessions SS2 with supervisor_id=SUP, case_appointment_id=A1, scheduled_at = T0 + 10:25, duration_hours=1.0  # within 30m of SS1 -> conflict."
            - "C POST /counseling/supervision-sessions SS3 with supervisor_id=SUP, scheduled_at = T0 + 11:30, duration_hours=1.0  # gap = 90 min; OK"
          assert:
            - "SS2 creation returns 422 (or 409) with error_id (a SUPERVISION_OVERLAP-style error). Spec choice: ERR_INVALID_STATE 409 — actually the spec catalog uses ERR_VALIDATION 422 for interval conflicts not otherwise enumerated. Pin: response status == 422 AND error_id == 'ERR_VALIDATION'."
            - "SS3 creation returns 201."

  # =============================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: package_balance_invariant_under_full_refund
        grounds:
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
          - state_machines.Appointment.HOLD_to_CONFIRMED
          - calculations.appointment_refund
          - entities.Client.fields.package_balance_sessions
          - endpoints.POST_/counseling/appointments/{id}/confirm
          - endpoints.POST_/counseling/appointments/{id}/cancel
        distinguishing_aspect: |
          Conserved quantity #1 = Client.package_balance_sessions (integer count). Forward action:
          PACKAGE confirm debits 1. Compensating action: cancel with refund_state=FULL_REFUNDED credits
          back exactly 1. Invariant: balance_before_confirm == balance_after_cancel for any appointment
          that round-trips PACKAGE confirm -> FULL_REFUNDED cancel.
        test_recipe:
          setup:
            - "ACTIVE Counselor C; Client K assessment_status=COMPLETED, package_balance_sessions=5."
            - "Slot S at T0+30h (so at confirm hours_to_start>24); Appointment A in HOLD on S, PACKAGE."
          trigger:
            - "POST /counseling/appointments/{A}/confirm  # K.package_balance_sessions -> 4"
            - "POST /counseling/appointments/{A}/cancel reason=CLIENT_CANCEL  # hours_to_start>24 -> FULL_REFUNDED"
          assert:
            - "Client K.package_balance_sessions == 5 (back to original)."
            - "SettlementLedger has CHARGE row (gross=0, share=6300) AND REFUND row (gross=0, share=-6300) for A."
            - "Sum(SettlementLedger.counselor_share_cents WHERE appointment_id=A) == 0 (formal invariant: net counselor_share for round-trip == 0)."

      - name: cash_ledger_invariant_under_full_refund
        grounds:
          - calculations.settlement_charge_breakdown
          - calculations.appointment_refund
          - entities.SettlementLedger.fields.gross_amount_cents
          - entities.SettlementLedger.fields.tax_cents
          - entities.SettlementLedger.fields.counselor_share_cents
          - entities.SettlementLedger.fields.platform_share_cents
          - endpoints.POST_/counseling/appointments/{id}/cancel
        distinguishing_aspect: |
          DIFFERENT conserved quantities (cents-denominated cash totals: gross, tax, counselor_share,
          platform_share simultaneously) under PAY_PER_SESSION on a DIFFERENT entity (SettlementLedger
          rows) than the package-balance invariant. Forward action: confirm produces CHARGE row.
          Compensating action: FULL refund produces REFUND row with negated amounts. Invariant: for any
          PAY_PER_SESSION appointment that round-trips confirm -> FULL_REFUNDED cancel, the per-component
          sums (gross, tax, counselor_share, platform_share) over its ledger rows are EXACTLY zero.
        test_recipe:
          setup:
            - "ACTIVE Counselor C revenue_share_bps=7000; Client K assessment_status=COMPLETED."
            - "Slot S at T0+30h; Appointment A on S, PAY_PER_SESSION, list_price_cents=12000."
          trigger:
            - "POST /counseling/appointments/{A}/confirm  # CHARGE row: gross=12000, tax=1050, counselor_share=8400, platform_share=3600"
            - "POST /counseling/appointments/{A}/cancel reason=CLIENT_CANCEL  # FULL_REFUNDED -> REFUND row: gross=-12000, tax=-1050, counselor_share=-8400, platform_share=-3600"
          assert:
            - "Sum(SettlementLedger.gross_amount_cents WHERE appointment_id=A) == 0."
            - "Sum(SettlementLedger.tax_cents WHERE appointment_id=A) == 0."
            - "Sum(SettlementLedger.counselor_share_cents WHERE appointment_id=A) == 0."
            - "Sum(SettlementLedger.platform_share_cents WHERE appointment_id=A) == 0."
            - "Exactly two ledger rows exist for A: one direction='CHARGE' and one direction='REFUND'."
