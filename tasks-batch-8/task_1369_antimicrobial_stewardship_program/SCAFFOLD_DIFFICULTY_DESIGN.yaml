  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: guideline_adoption_requires_published_antibiogram
        grounds:
          - state_machines.EmpiricGuideline.DRAFT_to_ADOPTED
          - state_machines.Antibiogram
          - validations[priority=21]
        distinguishing_aspect: |
          Entity pair EmpiricGuideline -> Antibiogram: the guideline's DRAFT->ADOPTED
          transition is gated on the referenced antibiogram's status == PUBLISHED.
          Distinct pair from approval->order.
        test_recipe:
          setup:
            - "Hospital H (min_isolates 1); MB microbiologist; DIR director; MD"
            - "Antibiogram AB in DRAFT with 1 reportable row for AMPICILLIN/E_COLI (pct 100.00)"
            - "Guideline G referencing AB (DRAFT) with first-line AMPICILLIN, syndrome UTI"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1", antibiogram_min_isolates: 1 }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MB", license_no: "L-MB-1", discipline: "MICROBIOLOGIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { mb_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr DIR", license_no: "L-DIR-1", discipline: "PHYSICIAN", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { dir_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "AMPICILLIN", drug_class: "NARROW_PENICILLIN", is_restricted: false, has_po_form: true }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/culture-reports"
              payload: { patient_case_id: "${p_id}", specimen_source: "URINE", collected_at: "2026-08-01T00:00:00Z", organism: "E_COLI" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { c_id: $.data.id }
            - call: "POST /stewardship/culture-reports/${c_id}/susceptibility-results"
              payload: { antimicrobial_id: "${drug_id}", interpretation: "S", mic_value: 2.0 }
              as: Microbiologist
              as_user_id: "${mb_id}"
            - call: "POST /stewardship/culture-reports/${c_id}/finalize"
              payload: {}
              as: Microbiologist
              as_user_id: "${mb_id}"
            - call: "POST /stewardship/antibiograms"
              payload: { hospital_id: "${h_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { ab_id: $.data.id }
            - call: "POST /stewardship/empiric-guidelines"
              payload: { hospital_id: "${h_id}", syndrome: "UTI", first_line_antimicrobial_id: "${drug_id}", source_antibiogram_id: "${ab_id}" }
              as: StewardshipDirector
              as_user_id: "${dir_id}"
              captures: { g_id: $.data.id }
            - call: "GET /stewardship/hospitals/${h_id}"
              payload: {}
              as: StewardshipDirector
              as_user_id: "${dir_id}"
              captures: { h_ver: $.data.version }
          trigger:
            - call: "POST /stewardship/empiric-guidelines/${g_id}/adopt"
              payload: { expected_hospital_version: "${h_ver}" }
              as: StewardshipDirector
              as_user_id: "${dir_id}"
              captures: { err1: $.data.error_id }
          assert:
            - "First adopt attempt fails: error_id == ERR_ANTIBIOGRAM_NOT_PUBLISHED (AB still DRAFT)"
            - "Guideline.${g_id}.status remains DRAFT"

      - name: approval_decision_gated_on_order_approval_pending
        grounds:
          - state_machines.ApprovalRequest.SUBMITTED_to_APPROVED
          - state_machines.AntibioticOrder
          - validations[priority=20]
        distinguishing_aspect: |
          Entity pair ApprovalRequest -> AntibioticOrder: decide is gated on the ORDER's
          approval_status == PENDING (not merely the request's own state). Withdrawing
          the request flips the order to NOT_REQUIRED; a stale decide afterwards must
          fail at the cross-entity precondition.
        test_recipe:
          setup:
            - "Hospital H; MD requester; PH pharmacist decider"
            - "Restricted order O (PENDING / AWAITING_APPROVAL); approval request AR SUBMITTED"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "MEROPENEM", drug_class: "CARBAPENEM", is_restricted: true, has_po_form: false }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "IV", dose_mg: 1000, frequency_per_day: 3, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /stewardship/approval-requests"
              payload: { antibiotic_order_id: "${ord_id}", requester_id: "${md_id}", justification: "Suspected ESBL bacteremia per prior cultures" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ar_id: $.data.id }
            - call: "POST /stewardship/approval-requests/${ar_id}/withdraw"
              payload: { withdrawer_id: "${md_id}" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
          trigger:
            - call: "POST /stewardship/approval-requests/${ar_id}/decide"
              payload: { decision: "APPROVED", decider_id: "${ph_id}" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPROVAL_NOT_PENDING (request left SUBMITTED after withdraw)"
            - "AntibioticOrder.${ord_id}.approval_status == NOT_REQUIRED (unchanged by the rejected decide)"
            - "AntibioticOrder.${ord_id}.therapy_status == DISCONTINUED (set by withdraw cascade; decide must not resurrect it)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: antibiogram_half_open_window_overlap
        grounds:
          - validations[priority=15]
          - calculations.antibiogram_susceptibility_rate
          - errors[ERR_ANTIBIOGRAM_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Half-open [start, end) interval semantics on the Antibiogram resource: a second
          window whose start equals the first window's end is ALLOWED (adjacency is not
          overlap), while start one second earlier is rejected.
        test_recipe:
          setup:
            - "Hospital H; MB microbiologist"
            - "Existing antibiogram AB1 window [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MB", license_no: "L-MB-1", discipline: "MICROBIOLOGIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { mb_id: $.data.id }
            - call: "POST /stewardship/antibiograms"
              payload: { hospital_id: "${h_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { ab1_id: $.data.id }
          trigger:
            - call: "POST /stewardship/antibiograms"
              payload: { hospital_id: "${h_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { ab2_id: $.data.id }
            - call: "POST /stewardship/antibiograms"
              payload: { hospital_id: "${h_id}", period_start: "2026-08-31T23:59:59Z", period_end: "2026-10-01T00:00:00Z" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent window accepted: Antibiogram.${ab2_id} created (201) — half-open semantics treat end==start as non-overlapping"
            - "Overlapping window rejected: error_id == ERR_ANTIBIOGRAM_WINDOW_OVERLAP (start 1 second before AB1.end)"

      - name: first_isolate_rolling_365_day_lookback
        grounds:
          - entities.CultureReport.fields.is_first_isolate
          - validations[priority=12]
        distinguishing_aspect: |
          Different interval semantics on a different resource: CultureReport first-isolate
          uses a ROLLING 365-day lookback anchored at each report's collected_at (not a
          fixed calendar window, and closed-interval inclusion at exactly 365 days prior).
          A same-(organism, source) culture collected exactly 365 days after an earlier one
          is NOT a first isolate; one collected 366 days after IS.
        test_recipe:
          setup:
            - "Hospital H; MB; MD; patient P"
            - "Culture C0: E_COLI/URINE collected 2026-08-01T00:00:00Z (first isolate)"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MB", license_no: "L-MB-1", discipline: "MICROBIOLOGIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { mb_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/culture-reports"
              payload: { patient_case_id: "${p_id}", specimen_source: "URINE", collected_at: "2026-08-01T00:00:00Z", organism: "E_COLI" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { c0_id: $.data.id, c0_first: $.data.is_first_isolate }
          trigger:
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2027-08-01T00:00:00Z" }
              as: StewardshipAdmin
            - call: "POST /stewardship/culture-reports"
              payload: { patient_case_id: "${p_id}", specimen_source: "URINE", collected_at: "2027-08-01T00:00:00Z", organism: "E_COLI" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { c365_id: $.data.id, c365_first: $.data.is_first_isolate }
            - call: "POST /stewardship/culture-reports"
              payload: { patient_case_id: "${p_id}", specimen_source: "URINE", collected_at: "2027-08-02T00:00:00Z", organism: "E_COLI" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { c366_id: $.data.id, c366_first: $.data.is_first_isolate }
          assert:
            - "C0.is_first_isolate == true (no prior isolate)"
            - "C365.is_first_isolate == false (collected exactly 365 days after C0 — within the closed rolling lookback [collected_at - 365d, collected_at])"
            - "C366.is_first_isolate == false (still within 365d of C365 — rolling window anchors on EACH new report, suppressing chains)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: dot_conservation_across_complete
        grounds:
          - calculations.days_of_therapy
          - state_machines.AntibioticOrder
          - entities.AntibioticOrder.fields.dot_calendar
        distinguishing_aspect: |
          Conserved quantity: total DOT. Completing an order (the forward lifecycle
          action) paired with reading its DOT before vs after must leave
          dot_calendar + administered-dose totals unchanged — completion freezes but
          never mutates the accrual (no drift introduced by the state flip itself).
        test_recipe:
          setup:
            - "Hospital H; MD; patient P; unrestricted drug D; order O with 3 administrations on 2 distinct dates (dot_calendar 2, administered_doses 3, dot_dose 0.75 at frequency 4)"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "LEVOFLOXACIN", drug_class: "FLUOROQUINOLONE", is_restricted: false, has_po_form: true }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-01T08:00:00Z" }
              as: StewardshipAdmin
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "PO", dose_mg: 500, frequency_per_day: 4, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-01T08:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-01T12:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/administrations"
              payload: { administered_at: "2026-08-02T08:00:00Z" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "GET /stewardship/antibiotic-orders/${ord_id}"
              payload: {}
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { dot_cal_pre: $.data.dot_calendar, dot_dose_pre: $.data.dot_dose }
          trigger:
            - call: "POST /stewardship/antibiotic-orders/${ord_id}/complete"
              payload: {}
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "GET /stewardship/antibiotic-orders/${ord_id}"
              payload: {}
              as: AttendingPhysician
              as_user_id: "${md_id}"
          assert:
            - "Pre-complete: dot_calendar == 2, dot_dose == 0.75"
            - "Post-complete: dot_calendar == 2 and dot_dose == 0.75 (conserved: forward stop action introduces zero drift)"
            - "AntibioticOrder.${ord_id}.therapy_status == COMPLETED"

      - name: intervention_count_conservation_through_appeal_cycle
        grounds:
          - state_machines.AuditIntervention.APPEALED_to_RECOMMENDED
          - state_machines.AuditIntervention.RECOMMENDED_to_REJECTED
        distinguishing_aspect: |
          Different conserved quantity: AuditIntervention cardinality per order. The
          REJECTED -> APPEALED -> RECOMMENDED cycle (forward rejection + compensating
          appeal/uphold pair) must NOT create new intervention rows — the count of
          interventions for the order is invariant across the loop (no duplicate
          RECOMMENDED row materializes on UPHOLD).
        test_recipe:
          setup:
            - "Hospital H; MD; PH; DIR; patient P; unrestricted order O; intervention I issued"
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr DIR", license_no: "L-DIR-1", discipline: "PHYSICIAN", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { dir_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "CEFTRIAXONE", drug_class: "CEPHALOSPORIN", is_restricted: false, has_po_form: false }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "IV", dose_mg: 1000, frequency_per_day: 1, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /stewardship/audit-interventions"
              payload: { antibiotic_order_id: "${ord_id}", auditor_id: "${ph_id}", intervention_type: "DURATION_REDUCTION", recommendation_text: "Reduce total course from 14 to 7 days per guideline" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
              captures: { int_id: $.data.id }
            - call: "POST /stewardship/audit-interventions/${int_id}/issue"
              payload: {}
              as: IDPharmacist
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /stewardship/audit-interventions/${int_id}/respond"
              payload: { response: "REJECTED", responder_id: "${md_id}" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/audit-interventions/${int_id}/appeal"
              payload: { appealer_id: "${ph_id}" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
            - call: "POST /stewardship/audit-interventions/${int_id}/adjudicate"
              payload: { verdict: "UPHOLD", adjudicator_id: "${dir_id}" }
              as: StewardshipDirector
              as_user_id: "${dir_id}"
            - call: "GET /stewardship/audit-interventions"
              payload: { antibiotic_order_id: "${ord_id}" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
          assert:
            - "List AuditIntervention for order returns exactly 1 row (count invariant across REJECTED->APPEALED->RECOMMENDED loop)"
            - "The single row's id == ${int_id} (same row cycled; no replacement row created)"
            - "The single row's recommendation_status == RECOMMENDED"
