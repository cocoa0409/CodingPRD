scaffold_corner_design:
  # ==========================================================================
  # Section: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: shop_creation_applies_defaults_and_computed_fields
        claim_type: creation_defaults
        grounds: [entities.Shop, entities.Shop.fields.currency]
        distinguishing_aspect: "POST /shops with all required fields and currency omitted returns 201, currency defaulted to USD, version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "GET /shops/${shop_id}"
              as: ShopAdmin
          assert:
            - "Shop.currency == USD"
            - "Shop.version == 1"
            - "Shop.created_at == 2026-08-01T00:00:00.000Z   # default logical clock"

      - name: customer_missing_company_name_returns_invalid_input
        claim_type: required_fields
        grounds: [entities.Customer.fields.company_name, "errors[ERR_INVALID_INPUT]"]
        distinguishing_aspect: "POST /shops/{id}/customers without company_name is rejected 400 ERR_INVALID_INPUT."
        test_recipe:
          setup: ["shop exists"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/customers"
              payload: {}
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_INPUT"

      - name: motor_duplicate_serial_per_shop_rejected
        claim_type: type_constraints
        grounds: [entities.Motor.fields.serial_number, "validations[priority=9]", "errors[ERR_DUPLICATE_ACTIVE]"]
        distinguishing_aspect: "Two motors with the same serial_number in one shop -> ERR_DUPLICATE_ACTIVE on the second; same serial in a different shop is allowed."
        test_recipe:
          setup: ["shop exists; customer exists; one motor with serial DUP-1"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "DUP-1", rated_kw: 10, frame_mm: 132, voltage_v: 460, manufacture_year: 2021 }
              as: ServiceManager
          trigger:
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "DUP-1", rated_kw: 15, frame_mm: 160, voltage_v: 460, manufacture_year: 2022 }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_ACTIVE"

      - name: pool_spare_motor_defaults_custody_in_pool
        claim_type: defaults
        grounds: [entities.Motor.fields.custody, entities.Motor.fields.is_pool_spare]
        distinguishing_aspect: "POST /shops/{id}/motors with is_pool_spare=true yields custody IN_POOL at creation; without the flag yields WITH_CUSTOMER."
        test_recipe:
          setup: ["shop; customer"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "PS-1", rated_kw: 75, frame_mm: 200, voltage_v: 460, manufacture_year: 2019, is_pool_spare: true }
              as: ServiceManager
              captures: { m_pool: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "CU-1", rated_kw: 75, frame_mm: 200, voltage_v: 460, manufacture_year: 2019 }
              as: ServiceManager
              captures: { m_cust: $.data.id }
          assert:
            - "Motor.${m_pool}.custody == IN_POOL"
            - "Motor.${m_cust}.custody == WITH_CUSTOMER"

      - name: test_record_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.TestRecord, endpoints]
        distinguishing_aspect: "TestRecord (common_fields: false) is append-only: §1.5 declares no PUT/PATCH/DELETE route for it; re-reading the record after later mutations shows stored fields unchanged and the entity carries no updated_at/version fields."
        test_recipe:
          setup: ["shop; customer; motor; work order with one INCOMING test recorded, then a diagnosis mutation on the parent work order"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-T1", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
              captures: { tr_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 5, materials_cents: 10000, replacement_cost_cents: 999999 }
              as: Technician
          trigger:
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}/tests"
              as: Technician
          assert:
            - "TestRecord.${tr_id} still reads insulation_megohms == 500 after the parent mutation (no update path exists)"
            - "TestRecord has no version field in the response (common_fields: false)"
            - "§1.5 declares no PUT/PATCH/DELETE endpoint matching .../tests — append-only by construction"

      - name: coil_data_record_immutable_and_lists_per_work_order
        claim_type: immutability
        grounds: [entities.CoilDataRecord, endpoints]
        distinguishing_aspect: "CoilDataRecord has no update endpoint and is reachable via GET .../coil-data returning an array (0..n because the rework loop can produce multiple records)."
        test_recipe:
          setup: ["work order driven to BALANCING (one coil record exists)"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-T2", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "winding short", rewind_hours: 5, materials_cents: 10000, replacement_cost_cents: 999999 }
              as: Technician
              as_user_id: "op-t"
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes"
              payload: { expected_work_order_version: "${wo_v}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q_id}/send"
              as: Estimator
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q_id}/accept"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/start-rewind"
              as: WindingTechnician
              as_user_id: "op-w"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/coil-data"
              payload: { wire_gauge_awg: "14", turns_per_coil: 22, coils_per_phase: 6, connection: "WYE", winding_resistance_ohms: 0.42 }
              as: WindingTechnician
              as_user_id: "op-w"
          trigger:
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}/coil-data"
              as: ServiceManager
          assert:
            - "response is an array of length 1 with easa_form_version pinned (EASA-AR100-2024) and recorded_by == op-w"

      - name: motor_supersedes_self_reference_resolves
        claim_type: parent_relationships
        grounds: [entities.Motor.fields.supersedes_motor_id]
        distinguishing_aspect: "A replacement motor record may reference a scrapped predecessor via supersedes_motor_id; a dangling supersedes_motor_id is rejected ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup: ["shop; customer; motor M-OLD exists"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-OLD", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2001 }
              as: ServiceManager
              captures: { m_old: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-NEW", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2026, supersedes_motor_id: "${m_old}" }
              as: ServiceManager
              captures: { m_new: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-BAD", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2026, supersedes_motor_id: "00000000-0000-0000-0000-000000000000" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "Motor.${m_new}.supersedes_motor_id == ${m_old}"
            - "Second create with dangling supersedes id -> ERR_REFERENCE_NOT_FOUND"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: work_order_starts_in_intake
        claim_type: initial_state
        grounds: [state_machines.WorkOrder]
        distinguishing_aspect: "Newly created WorkOrder has status INTAKE and invoice_total_cents == 0; Motor custody flips to IN_SHOP."
        test_recipe:
          setup: ["shop; customer; motor"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-I1", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
          assert:
            - "WorkOrder.${wo_id}.status == INTAKE"
            - "WorkOrder.${wo_id}.invoice_total_cents == 0"
            - "Motor.${motor_id}.custody == IN_SHOP"

      - name: diagnose_from_intake_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder.INCOMING_TEST_to_DIAGNOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST .../diagnose while WorkOrder is INTAKE (no incoming test) fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["work order in INTAKE"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-I2", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 5, materials_cents: 10000, replacement_cost_cents: 999999 }
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: terminal_work_order_accepts_no_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WorkOrder]
        distinguishing_aspect: "From SCRAPPED every action (diagnose, start-rewind, deliver, close, tests) is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["work order scrapped from INTAKE"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-I3", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/scrap"
              as: ServiceManager
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/start-rewind"
              as: WindingTechnician
              as_user_id: "op-w"
              captures: { err1: $.data.error_id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/close"
              as: ServiceManager
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_STATE and err2 == ERR_INVALID_STATE"
            - "Motor.${motor_id}.custody == WITH_CUSTOMER after scrap"

      - name: quote_decline_side_effects_release_motor
        claim_type: side_effect_execution
        grounds: [state_machines.Quote.ISSUED_to_DECLINED, state_machines.WorkOrder.AWAITING_APPROVAL_to_DECLINED]
        distinguishing_aspect: "Declining a sent quote sets Quote DECLINED, WorkOrder DECLINED, and Motor custody WITH_CUSTOMER in one atomic action."
        test_recipe:
          setup: ["work order AWAITING_APPROVAL with issued quote"]
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-I4", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/diagnose"
              payload: { failure_diagnosis: "x", rewind_hours: 5, materials_cents: 10000, replacement_cost_cents: 999999 }
              as: Technician
            - call: "GET /shops/${shop_id}/work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v: $.data.version }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes"
              payload: { expected_work_order_version: "${wo_v}" }
              as: Estimator
              captures: { q_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q_id}/send"
              as: Estimator
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/quotes/${q_id}/decline"
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Quote.${q_id}.status == DECLINED"
            - "WorkOrder.${wo_id}.status == DECLINED"
            - "Motor.${motor_id}.custody == WITH_CUSTOMER"

      - name: second_accept_on_accepted_quote_is_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Quote.ISSUED_to_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating accept on an already-ACCEPTED quote returns ERR_INVALID_STATE (terminal lockdown), not a silent 200."
        test_recipe:
          setup: ["work order APPROVED (quote already accepted)"]
          setup_api_calls:
            - call: "POST /shops"
