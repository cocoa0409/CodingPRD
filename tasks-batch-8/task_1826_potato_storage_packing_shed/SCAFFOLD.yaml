  roles:
  - ShedAdmin
  - IntakeClerk
  - StorageManager
  - QualityAssuranceManager
  - SalesManager
  - PackLineSupervisor
  - SettlementClerk
  - Grower
  code: 200
  input: []
  output: FieldLot
  side_effects: []
- method: GET
  path: /potato-shed/field-lots
  description: 'List field lots (reverse-reach FieldLot.grower_id and FieldLot.bin_id); list order pinned: created_at ASC'
  roles:
  - ShedAdmin
  - IntakeClerk
  - StorageManager
  - QualityAssuranceManager
  - SalesManager
  - SettlementClerk
  - Grower
