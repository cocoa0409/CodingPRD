            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-24", generic_ecoli_mpn: 50 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/water-tests"
              payload: { block_id: "${blk}", sample_date: "2026-07-28", generic_ecoli_mpn: 60 }
              as: FoodSafetyOfficer
              as_user_id: "fso-1"
            - call: "POST /berry-ops/crews"
              payload: { name: "CREW-CE2", labor_program: "DOMESTIC", supervisor_user_id: "sup-1", planned_head_count: 1, contract_start_date: "2026-07-01", contract_end_date: "2026-09-30" }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { crew: $.data.id }
            - call: "POST /berry-ops/harvest-windows"
              payload: { block_id: "${blk}", crew_id: "${crew}", start_at: "2026-08-03T05:00:00Z", end_at: "2026-08-03T17:00:00Z", forecast_brix: 8.5, planned_volume_lbs: 150.00, piece_rate_cents_per_clamshell: 45, clamshell_net_weight_lbs: 1.00 }
              as: HarvestManager
              as_user_id: "hm-1"
              captures: { win: $.data.id }
            - call: "POST /berry-ops/cooling-tunnels"
              payload: { name: "TUN-CE2", slot_capacity: 4, target_pulp_temp_f: 34.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { tun: $.data.id, tun_v1: $.data.version }
            - call: "POST /berry-ops/fruit-lots"
              payload: { harvest_window_id: "${win}", block_id: "${blk}", pick_date: "2026-08-03", variety: "STRAWBERRY", grade: "A", clamshell_count: 80, clamshell_net_weight_lbs: 1.00, pack_completed_at: "2026-08-03T06:00:00Z", field_pulp_temp_f: 63.0 }
              as: PackhouseOperator
              as_user_id: "pack-1"
              captures: { lot: $.data.id }
            - call: "POST /berry-ops/fruit-lots/${lot}/start-cooling"
              payload: { cooling_tunnel_id: "${tun}", cool_start_at: "2026-08-03T08:00:00Z", planned_cool_end_at: "2026-08-03T12:00:00Z", entry_pulp_temp_f: 57.0, pallet_slots: 1, expected_cooling_tunnel_version: "${tun_v1}" }
              as: PackhouseOperator
              as_user_id: "pack-1"
            - call: "POST /berry-ops/buyer-commitments"
              payload: { buyer_name: "MarketOne", buyer_user_id: "buyer-4", variety: "STRAWBERRY", volume_commitment_lbs: 80.00, price_cents_per_lb: 450, shelf_life_guarantee_days: 3, window_start_date: "2026-08-01", window_end_date: "2026-08-10" }
              as: SalesManager
              as_user_id: "sales-1"
              captures: { com: $.data.id, com_v1: $.data.version }
            - call: "POST /berry-ops/lot-allocations"
