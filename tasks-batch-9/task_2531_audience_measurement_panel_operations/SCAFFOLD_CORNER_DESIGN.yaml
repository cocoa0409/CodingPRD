          assert:
            - "HTTP 201 with ${run13_minutes} == 2160 - 36 whole hours between the two bounds"
            - "data.state == OPEN, data.weight_variant == null, data.opened_by_user_id == stat-opener-c13, data.published_by_user_id == null"
            - "data.intab_snapshot_count == 0, data.contributing_household_count == 0, data.total_weight_mass == 0, data.projected_average_audience == null, data.limitation_disclosures == []"
            - "data.repin_required_reason == null and data.superseded_by_run_id == null"

      - name: client_tier_derived_fields_supplied_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Client
          - endpoints[POST /clients]
        distinguishing_aspect: "The STANDARD tier fixes 65000 / 72h / 3 from the tier table; a body that also supplies tier_base_fee_cents and custom_analysis_quota has those values discarded."
        test_recipe:
          setup:
            - "Market DMA-614 exists so contract_market_ids can name a real market."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Metro Xi", market_code: "DMA-614", dma_rank: 114, incentive_budget_cents: 500000 }
