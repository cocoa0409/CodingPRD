            - { call: "POST /endowment/donors", payload: { donor_name: "D RD", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { rd2_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${rd2_fund}", donor_id: "${rd2_donor}", external_ref: "RD1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { rd2_g1: $.data.id } }
            - { call: "POST /endowment/funds/${rd2_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${rd2_g1}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${rd2_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${rd2_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { rd2_v1: $.data.id } }
            - { call: "GET /endowment/pools/${rd2_pool}", as: InvestmentOfficer, captures: { rd2_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${rd2_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${rd2_pv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${rd2_mgr}", quarter_index: 2, beginning_mv_cents: 10000000, ending_mv_cents: 10000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${rd2_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { rd2_v2: $.data.id } }
            - { call: "GET /endowment/pools/${rd2_pool}", as: InvestmentOfficer, captures: { rd2_pv2: $.data.version } }
            - { call: "POST /endowment/valuations/${rd2_v2}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${rd2_pv2}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${rd2_mgr}", quarter_index: 3, beginning_mv_cents: 10000000, ending_mv_cents: 10000000, flows: [], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${rd2_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { rd2_v3: $.data.id } }
            - { call: "GET /endowment/pools/${rd2_pool}", as: InvestmentOfficer, captures: { rd2_pv3: $.data.version } }
