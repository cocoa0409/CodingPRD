  # ===========================================================================
  # Rule 4 — transitive_cascade
  # Each instance drives a chain of at least three hops where a later hop is only
  # reachable because an earlier hop already landed.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: device_mismatch_denial_cascades_to_listing_suspension_and_lifecycle_revert
        grounds:
          - validations[priority=22]
          - calculations.patron_fraud_risk_score
          - state_machines.DeniedEntryIncident.initial_state
          - state_machines.ResaleListing.LISTED_to_SUSPENDED
          - state_machines.Ticket.LISTED_to_ISSUED
          - state_machines.Ticket.NOT_ADMITTED_to_DENIED_FLAGGED
          - entities.Patron.fields.fraud_risk_score
        distinguishing_aspect: |
          A single scan produces a five-hop chain: ScanEvent (DENIED_DEVICE_MISMATCH) →
          DeniedEntryIncident OPEN/DEVICE_MISMATCH → Patron.strike_count 1 and
          fraud_risk_score 45 → because 45 >= FRAUD_BLOCK_THRESHOLD 40 the seller's open
          ResaleListing goes SUSPENDED → and because the listing is no longer live the
          Ticket's lifecycle_status reverts LISTED → ISSUED. Hop 4 exists only because
          hop 3 crossed the threshold: an implementation that stops at the incident, or
          that suspends the listing without restoring lifecycle_status, fails.
        test_recipe:
          setup:
            - "Event ON_SALE with price_cap_regime VENUE_POLICY; AccessZone GA1 (fire_code_capacity 200); Gate G1."
            - "Ada verified, holding a PAID 12000-cent ticket bound to DEV-ADA and listed on VERIFIED_PRIMARY at 14500 cents (the exact cap), so lifecycle_status == LISTED."
