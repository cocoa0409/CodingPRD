            - { call: "POST /sustainability/questionnaire-responses/${qr}/transition", payload: { to_state: "IN_REVIEW" }, as: DisclosureLead, as_user_id: "lead-1" }
            - { call: "POST /sustainability/questionnaire-responses/${qr}/review-decision", payload: { decision: "APPROVE", review_notes: "Looks good" }, as: SustainabilityManager, as_user_id: "manager-1", captures: { st2: $.data.status } }
