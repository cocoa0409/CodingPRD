              as: BillingAnalyst
              captures: { cz1_id: $.data.id }
            - call: "POST /district-energy/connection-agreements/${cz1_id}/activate"
              payload: {}
              as: BillingAnalyst
            - call: "POST /district-energy/load-forecasts"
              payload: { loop_id: "${loop_z1_id}", service_date: "2026-08-06T00:00:00Z", occupancy_profile: "WEEKDAY_FULL", heating_degree_hours: 0.0, cooling_degree_hours: 0.0 }
              as: DispatchOperator
              captures: { f_z_id: $.data.id }
            - call: "POST /district-energy/load-forecasts/${f_z_id}/publish"
              payload: { variant: "WEATHER_NORMAL_PROVISIONAL" }
              as: DispatchOperator
