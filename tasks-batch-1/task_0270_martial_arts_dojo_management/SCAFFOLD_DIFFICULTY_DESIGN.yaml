              as: FrontDesk
              captures: { m2_id: $.data.id, m2_v: $.data.version }
            - call: "POST /dojo/enrollments"
              payload: { member_id: "${m1_id}", program_id: "${prog_id}", expected_member_version: "${m1_v}" }
              as: FrontDesk
              captures: { enr1_id: $.data.id }
            - call: "POST /dojo/enrollments"
              payload: { member_id: "${m2_id}", program_id: "${prog_id}", expected_member_version: "${m2_v}" }
              as: FrontDesk
              captures: { enr2_id: $.data.id }
            - call: "POST /dojo/class-sessions"
              payload: { program_id: "${prog_id}", instructor_id: "${ins_id}", starts_at: "2026-01-05T10:00:00Z", ends_at: "2026-01-05T11:00:00Z", capacity: 1 }
              as: FrontDesk
              captures: { cls_id: $.data.id, cls_v: $.data.version }
            - call: "POST /dojo/attendances"
              payload: { enrollment_id: "${enr1_id}", class_session_id: "${cls_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /dojo/class-sessions/${cls_id}/cancel"
              payload: { expected_class_session_version: "${cls_v}" }
              as: FrontDesk
          trigger:
            - call: "POST /dojo/attendances"
              payload: { enrollment_id: "${enr2_id}", class_session_id: "${cls_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Check-in to the CANCELLED, formerly-full class returns ERR_INVALID_STATE (state priority 8 beats capacity priority 17)"
            - "error_id != ERR_CLASS_FULL"

