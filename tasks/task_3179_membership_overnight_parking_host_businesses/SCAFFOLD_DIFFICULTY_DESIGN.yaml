            - "Member.${ma}.removal_status == \"REMOVED\" — hop 3's threshold crossing"
            - "StayRequest.${rb}.request_status == \"DECLINED\" — hop 4, the removed member released its countable reservation"
            - "capacity_summary.posture == \"SUSPENDED\" and capacity_summary.effective_capacity == 0"

      - name: verify_patronization_two_hop_credit_cascade
        grounds:
          - state_machines.HostPatronizationRecord.PENDING_to_VERIFIED
