        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_OPEN_SEATS]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / waitlist_promotion_blocked_when_school_posture_not_open
          rationale: "ERR_NO_OPEN_SEATS triggering is the failure path of the §1.8 cross-entity instance."

      - name: error_ERR_DUPLICATE_RESOURCE_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_RESOURCE]"]
        excluded_because:
          difficulty_instance: entity_applicant_email_unique_lowercase_normalized
