          TIER_3_THRESHOLD is 75 and the comparison is >=, so a HEAD_COACH with minor-athlete
          contact and three jurisdiction codes scores exactly 75 and MUST be TIER_3, while the
          same role with only two jurisdiction codes scores 70 and MUST be TIER_2 - the two
          members differ by a single jurisdiction code worth 5 points.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' exists with no members, no audits and no screening orders, so history_points is 0 for every new member"
          setup_api_calls:
