  - name: break_even_reaches_a_fixed_point
    claim_type: constraint_propagation
    grounds:
    - calculations.break_even_analysis
    excluded_because:
      difficulty_instance: combinatorial_formula / break_even_circular_gross_solve_with_pool_floor
      rationale: That §1.8 instance drives the seed-then-walk solver and asserts break_even_gross_cents, the four-decimal capacity percentage and the run-rate projection as literals.
  - name: wrap_settlement_variants_diverge_on_identical_inputs
    claim_type: variant_divergence
    grounds:
    - calculations.wrap_settlement.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / wrap_settlement_fixed_gross_vs_pool_basis_delta
      rationale: That §1.8 instance certifies two wraps with identical inputs under the two bases and asserts the exact per-field delta.
  - name: recoupment_variants_reconcile_on_switch
    claim_type: reconciliation
    grounds:
    - calculations.recoupment_progress.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / recoupment_progress_cash_vs_accrual_basis_divergence
      rationale: That §1.8 instance reads both recoupment variants off one data set and asserts the deferral and receivable adjustments that separate them.
  - name: recoupment_threshold_boundary_triple
    claim_type: threshold
    grounds:
    - calculations.recoupment_progress
    - entities.Production.recoupment_status
    excluded_because:
      difficulty_instance: boundary_precision_check / recoupment_flips_at_exactly_target_cents
      rationale: That §1.8 instance plus its one-cent-short sibling cover the at-threshold and threshold-minus-one cases of the >= comparison.
