# =============================================================================
# Section 1.8: Scaffold Difficulty Design (Test Targeting Index)
# 9 difficulty rules x 2 instances = 18 instances. Every grounds ref resolves
# into SCAFFOLD.yaml sections 1.1-1.7. All chains replay from empty-DB using
# only section 1.5 endpoints. All numeric asserts are literals computed from the
# pinned constants (FCL flat 480000c, LTL 9000c/m3, threshold 67 m3, lead
# penalty 25000c/day, fee tiers 5/8/12% at 0.80/0.95 utilization).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: budget_variance_commitment_vs_final_view
        grounds:
          - calculations.budget_line_variance
          - entities.BudgetLine.fields.variance_commitment_cents
          - entities.BudgetLine.fields.variance_final_cents
        distinguishing_aspect: |
          Same BudgetLine and same underlying data: the commitment_view variant subtracts open
          PO commitments (variance_commitment_cents = 7400000) while the final_view variant
          ignores them (variance_final_cents = 8000000); entity domain is fiscal (BudgetLine),
          disjoint from the logistics freight-allocation domain of the sibling instance.
        test_recipe:
          setup:
            - "Project (total 10000000c, unallocated 100000c) in PROCUREMENT with a FURNITURE budget line budgeted 8000000c"
            - "Spec (2/room x 20 rooms = 40 total) BRAND_APPROVED; bid VENDA (15000c unit, 0 freight, 14d lead) awarded"
            - "PO for VENDA with one line: 40 units x 15000c = 600000c committed, cube 10; nothing received"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-DV1", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 100000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent, captures: { bl_id: $.data.id } }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Guest chair", brand_standard_ref: "MS-GR-01", quantity_per_room: 2, room_count: 20, unit_budget_cents: 15000, required_lead_days: 21 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 15000, freight_estimate_cents: 0, lead_time_days: 14 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 40, declared_cube_m3: 10 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
          trigger:
            - { call: "GET /api/budget-lines/${bl_id}", as: PurchasingAgent }
          assert:
            - "BudgetLine.${bl_id}.committed_cents == 600000"
            - "BudgetLine.${bl_id}.actual_cents == 0"
            - "BudgetLine.${bl_id}.variance_commitment_cents == 7400000"
            - "BudgetLine.${bl_id}.variance_final_cents == 8000000"
            - "variance_commitment_cents != variance_final_cents for identical underlying data"

      - name: freight_allocation_provisional_cube_vs_final_units
        grounds:
          - calculations.freight_mode_and_allocation
          - entities.POLine.fields.freight_alloc_provisional_cents
          - entities.POLine.fields.freight_alloc_final_cents
        distinguishing_aspect: |
          Same shipment, same freight_total_cents (480000 FCL): the provisional variant allocates by
          declared cube share (30/70, 40/70 -> 205714 / 274286) while the final variant allocates by
          received-units share (100/160, 60/160 -> 300000 / 180000); entity domain is logistics
          (Shipment/POLine), disjoint from the fiscal BudgetLine domain of the sibling instance.
        test_recipe:
          setup:
            - "Project in PROCUREMENT; FURNITURE budgeted 8000000c"
            - "Spec A (5/room x 20 = 100 total, unit 1000c) and spec B (3/room x 20 = 60 total, unit 2000c), each BRAND_APPROVED and awarded to VENDA"
            - "PO VENDA with line A (100 units, cube 30) and line B (60 units, cube 40): total cube 70 >= 67"
            - "Shipment sealed (FCL 480000c, provisional split 205714/274286), departed, and fully received (100 good on A, 60 good on B)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-DV2", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 100000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Chair A", brand_standard_ref: "MS-A", quantity_per_room: 5, room_count: 20, unit_budget_cents: 1000 }, as: PurchasingAgent, captures: { sa_id: $.data.id } }
            - { call: "POST /api/spec-items/${sa_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${sa_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${sa_id}", vendor_name: "VENDA", unit_price_cents: 1000, freight_estimate_cents: 0, lead_time_days: 10 }, as: Vendor, captures: { ba_id: $.data.id } }
            - { call: "POST /api/bids/${ba_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${ba_id}/award", as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Lamp B", brand_standard_ref: "MS-B", quantity_per_room: 3, room_count: 20, unit_budget_cents: 2000 }, as: PurchasingAgent, captures: { sb_id: $.data.id } }
            - { call: "POST /api/spec-items/${sb_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${sb_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${sb_id}", vendor_name: "VENDA", unit_price_cents: 2000, freight_estimate_cents: 0, lead_time_days: 10 }, as: Vendor, captures: { bb_id: $.data.id } }
            - { call: "POST /api/bids/${bb_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${bb_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${sa_id}", quantity_ordered: 100, declared_cube_m3: 30 }, as: PurchasingAgent, captures: { la_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${sb_id}", quantity_ordered: 60, declared_cube_m3: 40 }, as: PurchasingAgent, captures: { lb_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent, captures: { mode: $.data.freight_mode, total_f: $.data.freight_total_cents } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${la_id}", qty_received: 100, qty_damaged: 0 }, { po_line_id: "${lb_id}", qty_received: 60, qty_damaged: 0 } ] }, as: WarehouseReceiver, captures: { ev_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
          trigger:
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "RECEIVED" }, as: PurchasingAgent }
            - { call: "GET /api/po-lines/${la_id}", as: PurchasingAgent }
            - { call: "GET /api/po-lines/${lb_id}", as: PurchasingAgent }
          assert:
            - "Shipment.${sh_id}.freight_mode == FCL and freight_total_cents == 480000 (total cube 70 >= 67)"
            - "POLine.${la_id}.freight_alloc_provisional_cents == 205714 and freight_alloc_final_cents == 300000"
            - "POLine.${lb_id}.freight_alloc_provisional_cents == 274286 and freight_alloc_final_cents == 180000"
            - "freight_alloc_provisional_cents != freight_alloc_final_cents on both lines for identical shipment data"
            - "sum of final allocations 300000 + 180000 == freight_total_cents == 480000"

  - rule_id: combinatorial_formula
    instances:
      - name: freight_rounding_residual_to_largest_share
        grounds:
          - calculations.freight_mode_and_allocation
        distinguishing_aspect: |
          Mode (b) nested rounding: the contract pins round-each-line-half-up THEN reconcile the
          residual to the largest raw share. Cube shares 3/26/38 of 67 m3 give raw 21492.54 /
          186268.66 / 272238.81 -> rounded 21493 / 186269 / 272239, sum 480001, residual -1
          subtracted from the largest raw share (line C): 21493 / 186269 / 272238. Sum-then-round
          would give a different per-line split; sibling instance exercises mode (c), not (b).
        test_recipe:
          setup:
            - "Project in PROCUREMENT; FURNITURE budgeted 8000000c; three specs (C1 3 units x 1000c, C2 26 units x 1000c, C3 38 units x 1000c) each approved and awarded to VENDA"
            - "PO VENDA with lines cube 3, 26, 38 (created in that order, so C-line created_at order is A < B < C); total cube exactly 67 (FCL boundary)"
            - "Shipment CONSOLIDATING with the PO attached"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-CF1", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 100000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "C1", brand_standard_ref: "MS-C1", quantity_per_room: 1, room_count: 3, unit_budget_cents: 1000 }, as: PurchasingAgent, captures: { s1_id: $.data.id } }
            - { call: "POST /api/spec-items/${s1_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s1_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s1_id}", vendor_name: "VENDA", unit_price_cents: 1000, freight_estimate_cents: 0, lead_time_days: 10 }, as: Vendor, captures: { b1_id: $.data.id } }
            - { call: "POST /api/bids/${b1_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b1_id}/award", as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "C2", brand_standard_ref: "MS-C2", quantity_per_room: 2, room_count: 13, unit_budget_cents: 1000 }, as: PurchasingAgent, captures: { s2_id: $.data.id } }
            - { call: "POST /api/spec-items/${s2_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s2_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s2_id}", vendor_name: "VENDA", unit_price_cents: 1000, freight_estimate_cents: 0, lead_time_days: 10 }, as: Vendor, captures: { b2_id: $.data.id } }
            - { call: "POST /api/bids/${b2_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b2_id}/award", as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "C3", brand_standard_ref: "MS-C3", quantity_per_room: 2, room_count: 19, unit_budget_cents: 1000 }, as: PurchasingAgent, captures: { s3_id: $.data.id } }
            - { call: "POST /api/spec-items/${s3_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s3_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s3_id}", vendor_name: "VENDA", unit_price_cents: 1000, freight_estimate_cents: 0, lead_time_days: 10 }, as: Vendor, captures: { b3_id: $.data.id } }
            - { call: "POST /api/bids/${b3_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b3_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s1_id}", quantity_ordered: 3, declared_cube_m3: 3 }, as: PurchasingAgent, captures: { l1_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s2_id}", quantity_ordered: 26, declared_cube_m3: 26 }, as: PurchasingAgent, captures: { l2_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s3_id}", quantity_ordered: 38, declared_cube_m3: 38 }, as: PurchasingAgent, captures: { l3_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
          trigger:
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "GET /api/po-lines/${l1_id}", as: PurchasingAgent }
            - { call: "GET /api/po-lines/${l2_id}", as: PurchasingAgent }
            - { call: "GET /api/po-lines/${l3_id}", as: PurchasingAgent }
          assert:
            - "Shipment.${sh_id}.freight_mode == FCL and freight_total_cents == 480000 (cube exactly 67 >= 67)"
            - "POLine.${l1_id}.freight_alloc_provisional_cents == 21493"
            - "POLine.${l2_id}.freight_alloc_provisional_cents == 186269"
            - "POLine.${l3_id}.freight_alloc_provisional_cents == 272238 (largest raw share 272238.81 absorbs residual -1)"
            - "21493 + 186269 + 272238 == 480000 exactly"

      - name: contingency_fee_prefee_utilization_tier
        grounds:
          - calculations.contingency_draw_fee
          - state_machines.ChangeOrder.PROPOSED_to_APPLIED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by evaluation order: the fee tier is chosen on
          utilization computed BEFORE the fee itself is added. committed+actual = 8000000c, POS =
          500000c, total 10000000c -> pre-fee u = 0.85 -> tier 0.08 -> fee = 40000c; a post-fee
          reading ((8500000+fee)/10000000 still 0.854) would be a spec violation of the pinned order,
          and sibling instance exercises mode (b), not (c).
        test_recipe:
          setup:
            - "Project total 10000000c, unallocated_contingency 1000000c; FURNITURE budgeted 9000000c; status PROCUREMENT"
            - "Spec approved + awarded to VENDA; PO VENDA with line 40 units x 200000c = 8000000c committed (posture stays OPEN: 8000000 <= 10000000)"
            - "ChangeOrder (+500000c to the FURNITURE line) PROPOSED by PurchasingAgent pa-1"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-CF2", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 1000000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 9000000 }, as: PurchasingAgent, captures: { bl_id: $.data.id } }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Desk", brand_standard_ref: "MS-D", quantity_per_room: 2, room_count: 20, unit_budget_cents: 200000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 200000, freight_estimate_cents: 0, lead_time_days: 10 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 40, declared_cube_m3: 10 }, as: PurchasingAgent }
            - { call: "POST /api/change-orders", payload: { project_id: "${p_id}", title: "Owner adds king rooms", adjustments: [ { budget_line_id: "${bl_id}", delta_cents: 500000 } ] }, as: PurchasingAgent, as_user_id: "pa-1", captures: { co_id: $.data.id } }
            - { call: "GET /api/projects/${p_id}", as: OwnerRep, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /api/change-orders/${co_id}/apply", payload: {expected_project_version: "${p_v}" }, as: OwnerRep, as_user_id: "owner-1" }
            - { call: "GET /api/change-orders/${co_id}", as: OwnerRep }
            - { call: "GET /api/projects/${p_id}", as: OwnerRep }
            - { call: "GET /api/budget-lines/${bl_id}", as: OwnerRep }
          assert:
            - "ChangeOrder.${co_id}.status == APPLIED and fee_cents == 40000 (u = (8000000+0+500000)/10000000 = 0.85, tier 0.08, fee = round(0.08*500000))"
            - "FFEProject.${p_id}.unallocated_contingency_cents == 460000 (1000000 - 500000 - 40000)"
            - "FFEProject.${p_id}.sunk_fees_cents == 40000"
            - "BudgetLine.${bl_id}.budgeted_cents == 9500000"

  - rule_id: non_linear_state_machine
    instances:
      - name: spec_brand_review_revision_cycle
        grounds:
          - state_machines.SpecItem.BRAND_REJECTED_to_SUBMITTED
          - state_machines.SpecItem.SUBMITTED_to_BRAND_REJECTED
        distinguishing_aspect: |
          Cyclic machine on SpecItem: SUBMITTED -> BRAND_REJECTED -> SUBMITTED -> BRAND_APPROVED
          traverses the revision loop; the sibling non-linear instance is on a different entity
          (PurchaseOrder parallel axes), not a second loop on SpecItem.
        test_recipe:
          setup:
            - "Project in PROCUREMENT with FURNITURE budget line; spec S created (DRAFT)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-NL1", hotel_name: "H", brand_program: "INDIE_SOFT", total_budget_cents: 5000000, unallocated_contingency_cents: 0 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 4000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Headboard", brand_standard_ref: "IS-HB", quantity_per_room: 1, room_count: 30, unit_budget_cents: 90000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "REJECT", notes: "fabric off-standard" }, as: BrandApprover }
          trigger:
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "GET /api/spec-items/${s_id}", as: PurchasingAgent, captures: { mid_status: $.data.status } }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "GET /api/spec-items/${s_id}", as: PurchasingAgent, captures: { end_status: $.data.status } }
          assert:
            - "After rejection the spec is BRAND_REJECTED and submit from BRAND_REJECTED succeeds (cycle), status back to SUBMITTED"
            - "Second brand-review APPROVE moves spec to BRAND_APPROVED"
            - "SpecItem.${s_id}.status == BRAND_APPROVED at the end"

      - name: po_parallel_fulfillment_invoice_axes
        grounds:
          - state_machines.PurchaseOrder
          - validations[priority=9]
        distinguishing_aspect: |
          Parallel state dimensions on one entity: invoice axis advances UNBILLED -> INVOICED while
          fulfillment remains READY_TO_SHIP (independent axes on PurchaseOrder), and the cross-axis
          guard ERR_INVOICE_BEFORE_DELIVERY blocks PAID until fulfillment reaches DELIVERED; the
          sibling instance is a cycle on SpecItem, a different entity and different non-linear shape.
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec approved, bid awarded; PO VENDA with one line 10 x 10000c, ACKNOWLEDGED then READY_TO_SHIP"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-NL2", hotel_name: "H", brand_program: "MARQUEE_LUXE", total_budget_cents: 5000000, unallocated_contingency_cents: 0 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 4000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Sofa", brand_standard_ref: "ML-SF", quantity_per_room: 1, room_count: 10, unit_budget_cents: 10000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 10000, freight_estimate_cents: 0, lead_time_days: 5 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 10, declared_cube_m3: 5 }, as: PurchasingAgent }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
          trigger:
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "INVOICE", to_status: "INVOICED" }, as: PurchasingAgent }
            - { call: "GET /api/purchase-orders/${po_id}", as: PurchasingAgent, captures: { f_axis: $.data.fulfillment_status, i_axis: $.data.invoice_status } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "INVOICE", to_status: "PAID" }, as: PurchasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "After INVOICE transition: fulfillment_status == READY_TO_SHIP (unchanged) and invoice_status == INVOICED — axes moved independently"
            - "PAID attempt while fulfillment READY_TO_SHIP is rejected with error_id == ERR_INVOICE_BEFORE_DELIVERY (409)"
            - "PurchaseOrder.${po_id}.invoice_status remains INVOICED after the rejected PAID attempt"

  - rule_id: transitive_cascade
    instances:
      - name: shipment_receive_five_link_cascade
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_RECEIVED
          - calculations.freight_mode_and_allocation
          - calculations.receiving_reconciliation
          - calculations.budget_line_variance
        distinguishing_aspect: |
          Depth-5 chain triggered by shipment RECEIVED: shipment -> PO DELIVERED (link 1) -> line
          qty_short finalized (link 2, caused by the delivery) -> final freight by received units
          (link 3) -> BudgetLine.actual_cents recompute (link 4) -> project actual_spend/posture
          (link 5). Triggering transition differs from the sibling cascade (damage-claim resolve).
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec A 100 units x 1000c cube 30 and spec B 60 units x 2000c cube 40 on one VENDA PO"
            - "Shipment SEALED (FCL 480000c) then IN_TRANSIT; receiving event POSTED: A 100 good, B 50 good (10 of B undelivered)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-TC1", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 100000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent, captures: { bl_id: $.data.id } }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Chair A", brand_standard_ref: "MS-A", quantity_per_room: 5, room_count: 20, unit_budget_cents: 1000 }, as: PurchasingAgent, captures: { sa_id: $.data.id } }
            - { call: "POST /api/spec-items/${sa_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${sa_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${sa_id}", vendor_name: "VENDA", unit_price_cents: 1000, freight_estimate_cents: 0, lead_time_days: 10 }, as: Vendor, captures: { ba_id: $.data.id } }
            - { call: "POST /api/bids/${ba_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${ba_id}/award", as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Lamp B", brand_standard_ref: "MS-B", quantity_per_room: 3, room_count: 20, unit_budget_cents: 2000 }, as: PurchasingAgent, captures: { sb_id: $.data.id } }
            - { call: "POST /api/spec-items/${sb_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${sb_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${sb_id}", vendor_name: "VENDA", unit_price_cents: 2000, freight_estimate_cents: 0, lead_time_days: 10 }, as: Vendor, captures: { bb_id: $.data.id } }
            - { call: "POST /api/bids/${bb_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${bb_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${sa_id}", quantity_ordered: 100, declared_cube_m3: 30 }, as: PurchasingAgent, captures: { la_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${sb_id}", quantity_ordered: 60, declared_cube_m3: 40 }, as: PurchasingAgent, captures: { lb_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${la_id}", qty_received: 100, qty_damaged: 0 }, { po_line_id: "${lb_id}", qty_received: 50, qty_damaged: 0 } ] }, as: WarehouseReceiver, captures: { ev_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
          trigger:
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "RECEIVED" }, as: PurchasingAgent }
            - { call: "GET /api/purchase-orders/${po_id}", as: PurchasingAgent }
            - { call: "GET /api/po-lines/${la_id}", as: PurchasingAgent }
            - { call: "GET /api/po-lines/${lb_id}", as: PurchasingAgent }
            - { call: "GET /api/budget-lines/${bl_id}", as: PurchasingAgent }
            - { call: "GET /api/projects/${p_id}", as: PurchasingAgent }
          assert:
            - "Link 1: PurchaseOrder.${po_id}.fulfillment_status == DELIVERED"
            - "Link 2: POLine.${lb_id}.qty_short == 10 and status == PARTIALLY_RECEIVED; POLine.${la_id}.status == FULLY_RECEIVED"
            - "Link 3: final freight by received units 100:50 -> la 320000, lb 160000 (freight_alloc_final_cents)"
            - "Link 4: la.actual_landed_cents == 100*1000 + 320000 == 420000; lb.actual_landed_cents == 50*2000 + 160000 == 260000; BudgetLine.${bl_id}.actual_cents == 680000"
            - "Link 5: FFEProject.${p_id}.actual_spend_cents == 680000 and committed_cents == 0 (DELIVERED PO leaves the committed set)"

      - name: damage_credit_three_link_cascade
        grounds:
          - state_machines.DamageClaim.SUBMITTED_to_RESOLVED_CREDIT
          - calculations.budget_line_variance
          - calculations.receiving_reconciliation
        distinguishing_aspect: |
          Depth-3 chain triggered by claim resolution: claim RESOLVED_CREDIT -> POLine
          damage_credit_cents/actual_landed recompute (link 1) -> BudgetLine.actual_cents recompute
          (link 2) -> project actual_spend/posture recompute (link 3). Triggering transition differs
          from the sibling cascade (shipment RECEIVED), and each link is caused by the previous link.
        test_recipe:
          setup:
            - "Project in PROCUREMENT, FURNITURE budgeted 8000000c; spec 40 units x 15000c cube 10 awarded to VENDA and ordered on a PO"
            - "Shipment sealed (LTL: 10 m3 x 9000c = 90000c freight), in transit, receiving POSTED: 40 received, 10 damaged; shipment RECEIVED (line actual_landed = 600000 + 90000 = 690000c)"
            - "DAMAGE claim qty 10 claimed 100000c, SUBMITTED"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-TC2", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 100000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent, captures: { bl_id: $.data.id } }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Guest chair", brand_standard_ref: "MS-GR-01", quantity_per_room: 2, room_count: 20, unit_budget_cents: 15000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 15000, freight_estimate_cents: 0, lead_time_days: 14 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "VENDA" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 40, declared_cube_m3: 10 }, as: PurchasingAgent, captures: { l_id: $.data.id } }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "ACKNOWLEDGED" }, as: Vendor }
            - { call: "POST /api/purchase-orders/${po_id}/transitions", payload: { axis: "FULFILLMENT", to_status: "READY_TO_SHIP" }, as: Vendor }
            - { call: "POST /api/shipments", payload: { project_id: "${p_id}", carrier_name: "CARR" }, as: PurchasingAgent, captures: { sh_id: $.data.id } }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "CONSOLIDATING" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/purchase-orders", payload: { purchase_order_id: "${po_id}" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "SEALED" }, as: PurchasingAgent }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "IN_TRANSIT" }, as: PurchasingAgent }
            - { call: "POST /api/receiving-events", payload: { shipment_id: "${sh_id}", lines: [ { po_line_id: "${l_id}", qty_received: 40, qty_damaged: 10 } ] }, as: WarehouseReceiver, captures: { ev_id: $.data.id } }
            - { call: "POST /api/receiving-events/${ev_id}/transitions", payload: { to_status: "POSTED" }, as: WarehouseReceiver }
            - { call: "POST /api/shipments/${sh_id}/transitions", payload: { to_status: "RECEIVED" }, as: PurchasingAgent }
            - { call: "POST /api/damage-claims", payload: { po_line_id: "${l_id}", claim_type: "DAMAGE", quantity: 10, claimed_credit_cents: 100000 }, as: PurchasingAgent, captures: { cl_id: $.data.id } }
            - { call: "POST /api/damage-claims/${cl_id}/transitions", payload: { to_status: "SUBMITTED" }, as: PurchasingAgent }
            - { call: "GET /api/budget-lines/${bl_id}", as: PurchasingAgent, captures: { actual_before: $.data.actual_cents } }
          trigger:
            - { call: "POST /api/damage-claims/${cl_id}/transitions", payload: { to_status: "RESOLVED_CREDIT", approved_credit_cents: 80000 }, as: PurchasingAgent }
            - { call: "GET /api/po-lines/${l_id}", as: PurchasingAgent }
            - { call: "GET /api/budget-lines/${bl_id}", as: PurchasingAgent }
            - { call: "GET /api/projects/${p_id}", as: PurchasingAgent }
          assert:
            - "BudgetLine.${bl_id}.actual_cents before resolution == 690000 (600000 goods + 90000 LTL freight)"
            - "Link 1: POLine.${l_id}.damage_credit_cents == 80000, qty_damaged_unresolved == 0, qty_damaged_credited == 10, actual_landed_cents == 610000"
            - "Link 2: BudgetLine.${bl_id}.actual_cents == 610000 after resolution"
            - "Link 3: FFEProject.${p_id}.actual_spend_cents == 610000 and posture recomputed (still OPEN: 610000 <= 10000000 and no window IN_PROGRESS)"
            - "DamageClaim.${cl_id}.status == RESOLVED_CREDIT and approved_credit_cents == 80000"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: co_approve_state_before_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - state_machines.ChangeOrder.PROPOSED_to_APPLIED
        distinguishing_aspect: |
          Error-category pair {state, business_fiscal}: the change order is already REJECTED (state,
          priority 5) AND its +500000c draw is unfunded against unallocated 100000c (fiscal, priority
          11); the dual-failure response must be ERR_CO_NOT_PROPOSED, not ERR_CHANGE_ORDER_UNFUNDED.
          Sibling instance exercises the different pair {business_referential, business_fiscal}.
        test_recipe:
          setup:
            - "Project total 10000000c with unallocated_contingency only 100000c, in PROCUREMENT with FURNITURE budget line 9000000c"
            - "ChangeOrder CO1 (+500000c to FURNITURE) proposed by PurchasingAgent pa-1, then REJECTED by OwnerRep owner-1"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-PP1", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 100000 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 9000000 }, as: PurchasingAgent, captures: { bl_id: $.data.id } }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/change-orders", payload: { project_id: "${p_id}", title: "CO1 unfunded draw", adjustments: [ { budget_line_id: "${bl_id}", delta_cents: 500000 } ] }, as: PurchasingAgent, as_user_id: "pa-1", captures: { co_id: $.data.id } }
            - { call: "POST /api/change-orders/${co_id}/reject", as: OwnerRep, as_user_id: "owner-1" }
            - { call: "GET /api/projects/${p_id}", as: OwnerRep, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /api/change-orders/${co_id}/apply", payload: {expected_project_version: "${p_v}" }, as: OwnerRep, as_user_id: "owner-2", captures: { err: $.data.error_id } }
          assert:
            - "Response 409 with error_id == ERR_CO_NOT_PROPOSED (state, priority 5) even though the draw is also unfunded (500000 + fee > 100000 unallocated, priority 11)"
            - "ChangeOrder.${co_id}.status remains REJECTED; no budget or contingency mutation occurred"

      - name: line_add_referential_before_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_NO_AWARDED_BID]
        distinguishing_aspect: |
          Error-category pair {business_referential, business_fiscal}: the spec's awarded bid belongs
          to vendor VENDA but the PO is for vendor OTHERV (referential, priority 8) AND the FURNITURE
          line is budgeted only 1000c so any plausible extended amount would exceed it (fiscal,
          priority 11); the response must be ERR_NO_AWARDED_BID. Sibling instance exercises
          {state, business_fiscal} — a different category pair.
        test_recipe:
          setup:
            - "Project in PROCUREMENT; FURNITURE budget line budgeted only 1000c"
            - "Spec approved; bid from VENDA (unit 15000c) sample-approved and awarded"
            - "PO created for vendor OTHERV (posture OPEN)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-PP2", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 10000000, unallocated_contingency_cents: 0 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 1000 }, as: PurchasingAgent, captures: { bl_id: $.data.id } }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Guest chair", brand_standard_ref: "MS-GR-01", quantity_per_room: 2, room_count: 20, unit_budget_cents: 15000 }, as: PurchasingAgent, captures: { s_id: $.data.id } }
            - { call: "POST /api/spec-items/${s_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${s_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${s_id}", vendor_name: "VENDA", unit_price_cents: 15000, freight_estimate_cents: 0, lead_time_days: 14 }, as: Vendor, captures: { b_id: $.data.id } }
            - { call: "POST /api/bids/${b_id}/sample-decision", payload: { outcome: "APPROVED" }, as: PurchasingAgent }
            - { call: "POST /api/bids/${b_id}/award", as: PurchasingAgent }
            - { call: "POST /api/purchase-orders", payload: { project_id: "${p_id}", vendor_name: "OTHERV" }, as: PurchasingAgent, captures: { po_id: $.data.id } }
          trigger:
            - { call: "POST /api/purchase-orders/${po_id}/lines", payload: { spec_item_id: "${s_id}", quantity_ordered: 40, declared_cube_m3: 10 }, as: PurchasingAgent, captures: { err: $.data.error_id } }
          assert:
            - "Response 409 with error_id == ERR_NO_AWARDED_BID (referential, priority 8), not ERR_BUDGET_LINE_EXCEEDED (fiscal, priority 11: 40 x 15000 = 600000 > 1000 budgeted)"
            - "No POLine is created: GET /api/spec-items/${s_id}/po-lines returns an empty list"

  - rule_id: boundary_precision_check
    instances:
      - name: seal_cube_threshold_fcl_vs_ltl
        grounds:
          - calculations.freight_mode_and_allocation
          - state_machines.Shipment.CONSOLIDATING_to_SEALED
        distinguishing_aspect: |
          Metric: shipment total cube in m3. total_cube_m3 == 67 satisfies the >= threshold and
          selects FCL flat 480000c; total_cube_m3 == 66 selects LTL at 66 x 9000 = 594000c. Endpoint
          under test is the shipment seal transition; the sibling boundary is a cumulative claim
          quantity on the damage-claim creation endpoint — different metric, different endpoint.
        test_recipe:
          setup:
            - "Project in PROCUREMENT; FURNITURE budgeted 8000000c; specs approved and awarded to VENDA"
            - "PO-A with one line cube 67 (shipment A CONSOLIDATING, attached) and PO-B with one line cube 66 (shipment B CONSOLIDATING, attached)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "P-BP1", hotel_name: "H", brand_program: "MARQUEE_SELECT", total_budget_cents: 20000000, unallocated_contingency_cents: 0 }, as: PurchasingAgent, captures: { p_id: $.data.id } }
            - { call: "POST /api/budget-lines", payload: { project_id: "${p_id}", category: "FURNITURE", budgeted_cents: 8000000 }, as: PurchasingAgent }
            - { call: "POST /api/projects/${p_id}/lifecycle-transitions", payload: { to_status: "PROCUREMENT" }, as: PurchasingAgent }
            - { call: "POST /api/spec-items", payload: { project_id: "${p_id}", category: "FURNITURE", description: "Bulk chairs", brand_standard_ref: "MS-BC", quantity_per_room: 5, room_count: 20, unit_budget_cents: 1000 }, as: PurchasingAgent, captures: { sa_id: $.data.id } }
            - { call: "POST /api/spec-items/${sa_id}/submit", as: PurchasingAgent }
            - { call: "POST /api/spec-items/${sa_id}/brand-review", payload: { decision: "APPROVE" }, as: BrandApprover }
            - { call: "POST /api/bids", payload: { spec_item_id: "${sa_id}", vendor_name: "VENDA", unit_price_cents: 1000, freight_estimate_cents: 0, lead_time_days: 10 }, as: Vendor, captures: { ba_id: $.data.id } }
