# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules × >=2 instances = 21 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.6. All numeric asserts were precomputed by executing
# the pinned §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_preliminary_vs_final_divergence
        grounds:
          - calculations.imbalance_settlement
          - calculations.congestion_loss_allocation
          - entities.SettlementStatement.fields.net_amount_cents
        distinguishing_aspect: |
          Two settlement variants (preliminary vs final) run over the SAME
          physical operating day and telemetry produce different net amounts
          (energy-settlement domain) — the divergence is driven purely by the
          rt_prelim vs rt_final price sets selected by the run.
        test_recipe:
          setup:
            - "INVESTMENT_GRADE participant with one 10 MW generator at WEST_HUB"
            - "Operating day 2026-08-03 (gate 2026-08-02T10:30:00Z); offer 10 MW @ 5000 SUBMITTED and CLEARED (LMP 5300)"
            - "Telemetry: uniform 8 MW on all 24 intervals (dev −2 MW/interval; deadband 0.5 MW)"
            - "Preliminary run with rt_prelim {E 4000, Cg 50, L 25}; final run with rt_final {E 6000, Cg 150, L 75}"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Alpha Gen Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "UNIT-1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 10, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /market/offers/${o_id}/submit", as: Trader, as_user_id: "${p_id}" }
            - call: "POST /market/operating-days/${d_id}/run-day-ahead-market"
              payload: { node_prices: [ { node_name: "WEST_HUB", da_energy_cents_per_mwh: 5000, da_congestion_cents_per_mwh: 200, da_loss_cents_per_mwh: 100 } ] }
              as: IsoOperator
            - call: "POST /market/generators/${g_id}/telemetry"
              payload:
                operating_day_id: "${d_id}"
                expected_generator_asset_version: "${g_v}"
                readings: [ { interval_index: 1, actual_mw: 8 }, { interval_index: 2, actual_mw: 8 }, { interval_index: 3, actual_mw: 8 }, { interval_index: 4, actual_mw: 8 }, { interval_index: 5, actual_mw: 8 }, { interval_index: 6, actual_mw: 8 }, { interval_index: 7, actual_mw: 8 }, { interval_index: 8, actual_mw: 8 }, { interval_index: 9, actual_mw: 8 }, { interval_index: 10, actual_mw: 8 }, { interval_index: 11, actual_mw: 8 }, { interval_index: 12, actual_mw: 8 }, { interval_index: 13, actual_mw: 8 }, { interval_index: 14, actual_mw: 8 }, { interval_index: 15, actual_mw: 8 }, { interval_index: 16, actual_mw: 8 }, { interval_index: 17, actual_mw: 8 }, { interval_index: 18, actual_mw: 8 }, { interval_index: 19, actual_mw: 8 }, { interval_index: 20, actual_mw: 8 }, { interval_index: 21, actual_mw: 8 }, { interval_index: 22, actual_mw: 8 }, { interval_index: 23, actual_mw: 8 }, { interval_index: 24, actual_mw: 8 } ]
              as: Trader
              as_user_id: "${p_id}"
            - call: "POST /market/operating-days/${d_id}/close-real-time"
              payload: { rt_node_prices_prelim: [ { node_name: "WEST_HUB", rt_prelim_energy_cents_per_mwh: 4000, rt_prelim_congestion_cents_per_mwh: 50, rt_prelim_loss_cents_per_mwh: 25 } ] }
              as: IsoOperator
            - { call: "POST /market/operating-days/${d_id}/run-preliminary-settlement", as: IsoOperator }
            - call: "GET /market/statements"
              payload: { operating_day_id: "${d_id}", market_participant_id: "${p_id}", run_type: "PRELIMINARY" }
              as: IsoOperator
              captures: { s_pre: "$.data[0].id", s_pre_net: "$.data[0].net_amount_cents" }
          trigger:
            - call: "POST /market/operating-days/${d_id}/run-final-settlement"
              payload: { rt_node_prices_final: [ { node_name: "WEST_HUB", rt_final_energy_cents_per_mwh: 6000, rt_final_congestion_cents_per_mwh: 150, rt_final_loss_cents_per_mwh: 75 } ] }
              as: IsoOperator
            - call: "GET /market/statements"
              payload: { operating_day_id: "${d_id}", market_participant_id: "${p_id}", run_type: "FINAL" }
              as: IsoOperator
              captures: { s_fin: "$.data[0].id", s_fin_net: "$.data[0].net_amount_cents" }
            - call: "GET /market/statements/${s_pre}"
              as: IsoOperator
              captures: { s_pre_status: $.data.status }
          assert:
            - "SettlementStatement.${s_pre}.net_amount_cents == -918000 (preliminary variant: imbalance 206400 + congestion 50400 + loss 25200 − da_energy_credit 1200000)"
            - "SettlementStatement.${s_fin}.net_amount_cents == -807600 (final variant over identical telemetry: 309600 + 55200 + 27600 − 1200000)"
            - "s_fin_net − s_pre_net == 110400 — same inputs, two valid price-set variants, different dollars"
            - "SettlementStatement.${s_pre}.status == SUPERSEDED after the final run"

      - name: collateral_requirement_gross_vs_net_tiers
        grounds:
          - calculations.collateral_requirement
          - entities.MarketParticipant.fields.collateral_requirement_cents
          - entities.MarketParticipant.fields.credit_rating_tier
        distinguishing_aspect: |
          Two participants with byte-identical settlement ledgers (+400000 and
          −9000 across two days) get different collateral requirements because
          credit_rating_tier selects the gross_exposure (409000) vs
          net_exposure (391000) variant — a dual-variant calculation on the
          MarketParticipant credit domain, distinct from the settlement-energy
          domain of settlement_preliminary_vs_final_divergence.
        test_recipe:
          setup:
            - "P1 INVESTMENT_GRADE with generator A (10 MW, WEST_HUB); P2 BELOW_INVESTMENT_GRADE with generator B (10 MW, WEST_HUB); identical obligations 10 MW @ 1000000 for 2026-08"
            - "Day1 2026-08-10: both units average 6 MW over event intervals 1-2 → 400000 penalty each → FINAL statement net +400000"
            - "Day2 2026-08-11: REGULATION award 5 MW (1200/300, mileage 2.0, intervals 1-4) fully delivered → revenue 9000 → FINAL statement net −9000"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Ig Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p1: $.data.id }
            - call: "POST /market/participants"
              payload: { company_name: "Big Co", credit_rating_tier: "BELOW_INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p2: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p1}", unit_name: "A1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { ga: $.data.id, ga_v: $.data.version }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p2}", unit_name: "B1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { gb: $.data.id, gb_v: $.data.version }
            - { call: "POST /market/obligations", payload: { generator_asset_id: "${ga}", delivery_period: "2026-08", obligated_mw: 10, capacity_rate_cents_per_mw: 1000000 }, as: IsoOperator }
            - { call: "POST /market/obligations", payload: { generator_asset_id: "${gb}", delivery_period: "2026-08", obligated_mw: 10, capacity_rate_cents_per_mw: 1000000 }, as: IsoOperator }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-10", da_gate_close_at: "2026-08-09T10:30:00Z" }
              as: IsoOperator
              captures: { d1: $.data.id }
            - { call: "POST /market/operating-days/${d1}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
            - call: "POST /market/generators/${ga}/telemetry"
              payload: { operating_day_id: "${d1}", expected_generator_asset_version: "${ga_v}", readings: [ { interval_index: 1, actual_mw: 6 }, { interval_index: 2, actual_mw: 6 } ] }
              as: Trader
              as_user_id: "${p1}"
            - call: "POST /market/generators/${gb}/telemetry"
              payload: { operating_day_id: "${d1}", expected_generator_asset_version: "${gb_v}", readings: [ { interval_index: 1, actual_mw: 6 }, { interval_index: 2, actual_mw: 6 } ] }
              as: Trader
              as_user_id: "${p2}"
            - call: "POST /market/operating-days/${d1}/performance-events"
              payload: { start_interval: 1, end_interval: 2 }
              as: IsoOperator
              captures: { ev1: $.data.id }
            - { call: "POST /market/events/${ev1}/activate", as: IsoOperator }
            - { call: "POST /market/events/${ev1}/complete", as: IsoOperator }
            - { call: "POST /market/operating-days/${d1}/close-real-time", payload: { rt_node_prices_prelim: [] }, as: IsoOperator }
            - { call: "POST /market/operating-days/${d1}/run-preliminary-settlement", as: IsoOperator }
            - { call: "POST /market/operating-days/${d1}/run-final-settlement", payload: { rt_node_prices_final: [] }, as: IsoOperator }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-11", da_gate_close_at: "2026-08-10T10:30:00Z" }
              as: IsoOperator
              captures: { d2: $.data.id }
            - { call: "POST /market/operating-days/${d2}/awards", payload: { generator_asset_id: "${ga}", service_type: "REGULATION", awarded_mw: 5, capacity_price_cents: 1200, performance_price_cents: 300, mileage_ratio: 2.0, start_interval: 1, end_interval: 4 }, as: IsoOperator }
            - { call: "POST /market/operating-days/${d2}/awards", payload: { generator_asset_id: "${gb}", service_type: "REGULATION", awarded_mw: 5, capacity_price_cents: 1200, performance_price_cents: 300, mileage_ratio: 2.0, start_interval: 1, end_interval: 4 }, as: IsoOperator }
            - { call: "POST /market/operating-days/${d2}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
            - call: "GET /market/generators/${ga}"
              as: IsoOperator
              captures: { ga_v2: $.data.version }
            - call: "GET /market/generators/${gb}"
              as: IsoOperator
              captures: { gb_v2: $.data.version }
            - call: "POST /market/generators/${ga}/telemetry"
              payload: { operating_day_id: "${d2}", expected_generator_asset_version: "${ga_v2}", readings: [ { interval_index: 1, actual_mw: 5 }, { interval_index: 2, actual_mw: 5 }, { interval_index: 3, actual_mw: 5 }, { interval_index: 4, actual_mw: 5 } ] }
              as: Trader
              as_user_id: "${p1}"
            - call: "POST /market/generators/${gb}/telemetry"
              payload: { operating_day_id: "${d2}", expected_generator_asset_version: "${gb_v2}", readings: [ { interval_index: 1, actual_mw: 5 }, { interval_index: 2, actual_mw: 5 }, { interval_index: 3, actual_mw: 5 }, { interval_index: 4, actual_mw: 5 } ] }
              as: Trader
              as_user_id: "${p2}"
            - { call: "POST /market/operating-days/${d2}/close-real-time", payload: { rt_node_prices_prelim: [] }, as: IsoOperator }
            - { call: "POST /market/operating-days/${d2}/run-preliminary-settlement", as: IsoOperator }
            - { call: "POST /market/operating-days/${d2}/run-final-settlement", payload: { rt_node_prices_final: [] }, as: IsoOperator }
          trigger:
            - call: "POST /market/participants/${p1}/evaluate-credit"
              as: IsoOperator
              captures: { req1: $.data.collateral_requirement_cents, alw1: $.data.unsecured_allowance_cents }
            - call: "POST /market/participants/${p2}/evaluate-credit"
              as: IsoOperator
              captures: { req2: $.data.collateral_requirement_cents, alw2: $.data.unsecured_allowance_cents }
          assert:
            - "MarketParticipant.${p1}.collateral_requirement_cents == 391000 (net variant: max(0, 400000 − 9000))"
            - "MarketParticipant.${p2}.collateral_requirement_cents == 409000 (gross variant: |400000| + |−9000|)"
            - "req1 != req2 despite identical statement ledgers — variant selected by credit_rating_tier"
            - "MarketParticipant.${p1}.unsecured_allowance_cents == 100000 and MarketParticipant.${p2}.unsecured_allowance_cents == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: ancillary_tiered_revenue_with_regulation_branch
        grounds:
          - calculations.ancillary_revenue
          - entities.AncillaryServiceAward.fields.performance_score
        distinguishing_aspect: |
          Mode (a) combinatorial: revenue = f(awarded_mw, capacity_price,
          performance_price, mileage_ratio, performance_score) with tiered
          multiplier selection AND a conditional branch on service_type — a
          REGULATION award at score 0.75 (tier boundary, inclusive) yields 8100
          while a SYNC_RESERVE award at score 1.00 yields 6000 (no mileage
          branch).
        test_recipe:
          setup:
            - "Participant with one 10 MW generator; day 2026-08-03"
            - "Award R: REGULATION 5 MW, cap 1200, perf 300, mileage 2.0, intervals 1-4; telemetry 5,5,5,0 → score 3/4 = 0.75"
            - "Award S: SYNC_RESERVE 5 MW, cap 1200, intervals 5-8; telemetry 5,5,5,5 → score 1.00"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Anc Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
            - call: "POST /market/operating-days/${d_id}/awards"
              payload: { generator_asset_id: "${g_id}", service_type: "REGULATION", awarded_mw: 5, capacity_price_cents: 1200, performance_price_cents: 300, mileage_ratio: 2.0, start_interval: 1, end_interval: 4 }
              as: IsoOperator
              captures: { aw_r: $.data.id }
            - { call: "POST /market/operating-days/${d_id}/awards", payload: { generator_asset_id: "${g_id}", service_type: "SYNC_RESERVE", awarded_mw: 5, capacity_price_cents: 1200, start_interval: 5, end_interval: 8 }, as: IsoOperator, captures: { aw_s: $.data.id } }
            - { call: "POST /market/operating-days/${d_id}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
            - call: "POST /market/generators/${g_id}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${g_v}", readings: [ { interval_index: 1, actual_mw: 5 }, { interval_index: 2, actual_mw: 5 }, { interval_index: 3, actual_mw: 5 }, { interval_index: 4, actual_mw: 0 }, { interval_index: 5, actual_mw: 5 }, { interval_index: 6, actual_mw: 5 }, { interval_index: 7, actual_mw: 5 }, { interval_index: 8, actual_mw: 5 } ] }
              as: Trader
              as_user_id: "${p_id}"
            - { call: "POST /market/operating-days/${d_id}/close-real-time", payload: { rt_node_prices_prelim: [] }, as: IsoOperator }
            - { call: "POST /market/operating-days/${d_id}/run-preliminary-settlement", as: IsoOperator }
          trigger:
            - call: "GET /market/statements"
              payload: { operating_day_id: "${d_id}", market_participant_id: "${p_id}" }
              as: IsoOperator
              captures: { s_id: "$.data[0].id", s_anc: "$.data[0].ancillary_revenue_cents" }
            - call: "GET /market/awards/${aw_r}"
              as: IsoOperator
              captures: { aw_r_rev: $.data.revenue_cents, aw_r_score: $.data.performance_score, aw_r_status: $.data.status }
            - call: "GET /market/awards/${aw_s}"
              as: IsoOperator
              captures: { aw_s_rev: $.data.revenue_cents }
          assert:
            - "AncillaryServiceAward.${aw_r}.performance_score == 0.75 (3 of 4 intervals >= 4.5 MW floor)"
            - "AncillaryServiceAward.${aw_r}.revenue_cents == 8100 (0.75 → tier 0.85 inclusive: 5×1200×0.85 + 2.0×300×5 = 5100 + 3000)"
            - "AncillaryServiceAward.${aw_s}.revenue_cents == 6000 (score 1.00 → tier 1.00; SYNC_RESERVE takes no performance/mileage branch: 5×1200×1.00)"
            - "SettlementStatement.${s_id}.ancillary_revenue_cents == 14100 and both awards are SETTLED"

      - name: congestion_per_interval_rounding_order
        grounds:
          - calculations.congestion_loss_allocation
          - entities.SettlementStatement.fields.congestion_charge_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding where order matters — the
          scaffold pins round-per-interval-then-sum, so two intervals with
          fractional 87.5-cent RT congestion contribute 176, not the 175 that
          sum-then-round would produce; the 1-cent delta is the assertion.
        test_recipe:
          setup:
            - "Participant, 10 MW generator at WEST_HUB; day 2026-08-03; offer 10 MW @ 5000 CLEARED"
            - "Telemetry only intervals 1-2 at 7.5 MW (dev −2.5); intervals 3-24 missing → actual 0 (dev −10)"
            - "rt_prelim {E 4000, Cg 35, L 15}; DA {E 5000, Cg 200, L 100}"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Round Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 10, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /market/offers/${o_id}/submit", as: Trader, as_user_id: "${p_id}" }
            - call: "POST /market/operating-days/${d_id}/run-day-ahead-market"
              payload: { node_prices: [ { node_name: "WEST_HUB", da_energy_cents_per_mwh: 5000, da_congestion_cents_per_mwh: 200, da_loss_cents_per_mwh: 100 } ] }
              as: IsoOperator
            - call: "POST /market/generators/${g_id}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${g_v}", readings: [ { interval_index: 1, actual_mw: 7.5 }, { interval_index: 2, actual_mw: 7.5 } ] }
              as: Trader
              as_user_id: "${p_id}"
            - call: "POST /market/operating-days/${d_id}/close-real-time"
              payload: { rt_node_prices_prelim: [ { node_name: "WEST_HUB", rt_prelim_energy_cents_per_mwh: 4000, rt_prelim_congestion_cents_per_mwh: 35, rt_prelim_loss_cents_per_mwh: 15 } ] }
              as: IsoOperator
            - { call: "POST /market/operating-days/${d_id}/run-preliminary-settlement", as: IsoOperator }
          trigger:
            - call: "GET /market/statements"
              payload: { operating_day_id: "${d_id}", market_participant_id: "${p_id}" }
              as: IsoOperator
              captures: { s_id: "$.data[0].id", s_cong: "$.data[0].congestion_charge_cents", s_loss: "$.data[0].loss_charge_cents", s_imb: "$.data[0].imbalance_charge_cents", s_net: "$.data[0].net_amount_cents" }
          assert:
            - "SettlementStatement.${s_id}.congestion_charge_cents == 55876 (48000 DA + round(2.5×35)=88 twice + 350×22; sum-then-round would give 55875 — the pinned per-interval order wins)"
            - "SettlementStatement.${s_id}.loss_charge_cents == 27376 (24000 DA + round(2.5×15)=38 twice + 150×22)"
            - "SettlementStatement.${s_id}.imbalance_charge_cents == 985200 (10800×2 + 43800×22)"
            - "SettlementStatement.${s_id}.net_amount_cents == -131548"

      - name: capacity_stop_loss_evaluation_order
        grounds:
          - calculations.capacity_stop_loss_close
          - entities.CapacityObligation.fields.charged_penalty_cents
        distinguishing_aspect: |
          Mode (c) combinatorial: the stop-loss cap is keyed on GROSS revenue
          computed before any penalty offset (pinned evaluation order steps
          1-4), so a 400000 accrued penalty against a 10×1000 gross closes at
          charged 15000 / forgiven 385000 — any other evaluation order (cap on
          net, or net feedback into gross) yields different numbers.
        test_recipe:
          setup:
            - "Participant with 10 MW generator; obligation 2026-08: 10 MW @ 1000 (gross 10000, cap 15000)"
            - "Day 2026-08-10 event intervals 1-2; telemetry 6 MW → shortfall 4 × 50000 × 2h = 400000 accrued penalty"
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Cap Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /market/obligations"
              payload: { generator_asset_id: "${g_id}", delivery_period: "2026-08", obligated_mw: 10, capacity_rate_cents_per_mw: 1000 }
              as: IsoOperator
              captures: { ob_id: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-10", da_gate_close_at: "2026-08-09T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
            - { call: "POST /market/operating-days/${d_id}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
            - call: "POST /market/generators/${g_id}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${g_v}", readings: [ { interval_index: 1, actual_mw: 6 }, { interval_index: 2, actual_mw: 6 } ] }
              as: Trader
