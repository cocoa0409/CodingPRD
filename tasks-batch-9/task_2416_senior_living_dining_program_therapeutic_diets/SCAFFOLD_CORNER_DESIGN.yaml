              captures: { sa_committed: $.data.committed_seats, sa_open: $.data.open_seats }
          assert:
            - "${v_v1} == 1 and ${res_a_status} == RESERVED"
            - "${stale_error} == ERR_STALE_VERSION with HTTP 412 — capacity was never the problem, the observed version was"
            - "${v_v_read} == 2 — only the accepted reservation bumped it"
            - "${res_b_status} == RESERVED, ${sa_committed} == 2 and ${sa_open} == 10"
      - name: reservation_listing_filter_with_limit_and_offset
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /seating-reservations]
        distinguishing_aspect: "The status filter is applied before the window, so total_count reports the filtered population (2) rather than all three rows, and the released row disappears from the RESERVED page while still being reachable under its own filter."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community, one OPEN MAIN_DINING venue with seat_capacity 12."
            - "Three ACTIVE residents A, B, C, each with an APPROVED, ACTIVE REGULAR/THIN diet order."
            - "Reservations were created in the order A, B, C for 2026-08-11 LUNCH, then B was released, leaving A and C RESERVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Aldergate Main Dining", venue_kind: "MAIN_DINING", seat_capacity: 12, care_levels_served: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { v_id: $.data.id, v_v1: $.data.version }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Resident A", care_level: "ASSISTED_LIVING", baseline_weight_kg: 70.0 }
              as: ProgramAdministrator
              captures: { ra_id: $.data.id, ra_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${ra_id}", texture_level: "REGULAR", liquid_consistency: "THIN", expected_resident_version: "${ra_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { doa_id: $.data.id }
            - call: "POST /diet-orders/${doa_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Resident B", care_level: "ASSISTED_LIVING", baseline_weight_kg: 71.0 }
              as: ProgramAdministrator
              captures: { rb_id: $.data.id, rb_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${rb_id}", texture_level: "REGULAR", liquid_consistency: "THIN", expected_resident_version: "${rb_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { dob_id: $.data.id }
            - call: "POST /diet-orders/${dob_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Resident C", care_level: "ASSISTED_LIVING", baseline_weight_kg: 72.0 }
              as: ProgramAdministrator
              captures: { rc_id: $.data.id, rc_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${rc_id}", texture_level: "REGULAR", liquid_consistency: "THIN", expected_resident_version: "${rc_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { doc_id: $.data.id }
            - call: "POST /diet-orders/${doc_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
            - call: "POST /seating-reservations"
              payload: { resident_id: "${ra_id}", venue_id: "${v_id}", service_date: "2026-08-11", meal_period: "LUNCH", seat_start_utc: "2026-08-11T12:00:00Z", party_size: 1, expected_venue_version: "${v_v1}" }
              as: DiningServicesManager
              captures: { res_a: $.data.id }
            - call: "GET /venues/${v_id}"
              payload: {}
              as: DiningServicesManager
              captures: { v_v2: $.data.version }
            - call: "POST /seating-reservations"
              payload: { resident_id: "${rb_id}", venue_id: "${v_id}", service_date: "2026-08-11", meal_period: "LUNCH", seat_start_utc: "2026-08-11T12:00:00Z", party_size: 1, expected_venue_version: "${v_v2}" }
              as: DiningServicesManager
              captures: { res_b: $.data.id }
            - call: "GET /venues/${v_id}"
              payload: {}
              as: DiningServicesManager
              captures: { v_v3: $.data.version }
            - call: "POST /seating-reservations"
              payload: { resident_id: "${rc_id}", venue_id: "${v_id}", service_date: "2026-08-11", meal_period: "LUNCH", seat_start_utc: "2026-08-11T12:00:00Z", party_size: 1, expected_venue_version: "${v_v3}" }
              as: DiningServicesManager
              captures: { res_c: $.data.id }
            - call: "POST /seating-reservations/${res_b}/release"
              payload: { reason: "family took the resident out" }
              as: DiningServicesManager
              captures: { res_b_status: $.data.status }
          trigger:
            - call: "GET /seating-reservations"
              payload: { venue_id: "${v_id}", service_date: "2026-08-11", meal_period: "LUNCH", status: "RESERVED", limit: 1, offset: 0 }
              as: DiningServicesManager
              captures: { p1_total: $.meta.total_count, p1_has_more: $.meta.has_more, p1_first: "$.data[0].id" }
            - call: "GET /seating-reservations"
              payload: { venue_id: "${v_id}", service_date: "2026-08-11", meal_period: "LUNCH", status: "RESERVED", limit: 1, offset: 1 }
              as: DiningServicesManager
              captures: { p2_total: $.meta.total_count, p2_has_more: $.meta.has_more, p2_first: "$.data[0].id" }
            - call: "GET /seating-reservations"
              payload: { venue_id: "${v_id}", service_date: "2026-08-11", meal_period: "LUNCH", status: "RESERVED", limit: 1, offset: 2 }
              as: DiningServicesManager
              captures: { p3_total: $.meta.total_count, p3_has_more: $.meta.has_more }
            - call: "GET /seating-reservations"
              payload: { venue_id: "${v_id}", status: "RELEASED" }
              as: DiningServicesManager
              captures: { rel_total: $.meta.total_count, rel_first: "$.data[0].id" }
          assert:
            - "${res_b_status} == RELEASED"
            - "${p1_total} == 2, ${p1_has_more} == true and ${p1_first} == ${res_a} (created_at ASC)"
            - "${p2_total} == 2, ${p2_has_more} == false and ${p2_first} == ${res_c} — the released row is skipped, not merely reordered"
            - "${p3_total} == 2, ${p3_has_more} == false and the page is empty — an offset past the end is not an error"
            - "${rel_total} == 1 and ${rel_first} == ${res_b}"
      - name: community_pending_review_count_reconciles_across_writes
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Community.fields.pending_dietitian_review_count
          - state_machines.DietOrder
        distinguishing_aspect: "The counter is a full recompute over two independent axes at once, so an APPROVE (review axis) and a DISCONTINUE (clinical axis) each remove a row from the same count, and a REQUEST_CHANGES keeps it counted rather than clearing it."
        test_recipe:
          setup:
            - "One community with two ACTIVE residents A and B."
            - "cs-1 recorded one AWAITING_DIETITIAN order for each resident."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id, count0: $.data.pending_dietitian_review_count }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Resident A", care_level: "ASSISTED_LIVING", baseline_weight_kg: 70.0 }
              as: ProgramAdministrator
              captures: { ra_id: $.data.id, ra_v: $.data.version }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Resident B", care_level: "ASSISTED_LIVING", baseline_weight_kg: 71.0 }
              as: ProgramAdministrator
              captures: { rb_id: $.data.id, rb_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${ra_id}", texture_level: "REGULAR", liquid_consistency: "THIN", expected_resident_version: "${ra_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { doa_id: $.data.id }
            - call: "POST /diet-orders"
              payload: { resident_id: "${rb_id}", texture_level: "MINCED_MOIST", liquid_consistency: "THIN", expected_resident_version: "${rb_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { dob_id: $.data.id }
            - call: "GET /communities/${c_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { count2: $.data.pending_dietitian_review_count, active_cycle: $.data.active_menu_cycle_id }
          trigger:
            - call: "POST /diet-orders/${dob_id}/dietitian-review"
              payload: { decision: "REQUEST_CHANGES", reviewer_note: "confirm swallow assessment" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
              captures: { dob_review: $.data.review_status }
            - call: "GET /communities/${c_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { count_after_changes: $.data.pending_dietitian_review_count }
            - call: "POST /diet-orders/${doa_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
              captures: { doa_review: $.data.review_status, doa_clinical: $.data.clinical_status }
            - call: "GET /communities/${c_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { count_after_approve: $.data.pending_dietitian_review_count }
            - call: "POST /diet-orders/${dob_id}/discontinue"
              payload: { reason: "resident transferred" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { dob_clinical: $.data.clinical_status, dob_review_final: $.data.review_status }
            - call: "GET /communities/${c_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { count_final: $.data.pending_dietitian_review_count }
          assert:
            - "${count0} == 0 (declared default) and ${active_cycle} == null"
            - "${count2} == 2 — one per AWAITING_DIETITIAN order"
            - "${dob_review} == CHANGES_REQUESTED and ${count_after_changes} == 2 — CHANGES_REQUESTED is still counted as pending"
            - "${doa_review} == APPROVED with ${doa_clinical} == ACTIVE and ${count_after_approve} == 1"
            - "${dob_clinical} == DISCONTINUED with ${dob_review_final} == CHANGES_REQUESTED, yet ${count_final} == 0 — the clinical axis alone drops it out of the count"
      - name: temperature_escalation_cascades_into_waitlist_holds
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DiningVenue.temp_compliance_posture
          - endpoints[POST /venues/{id}/temperature-logs]
          - entities.SeatingReservation.fields.suspension_hold
        excluded_because:
          difficulty_instance: transitive_cascade / ticket_void_three_hop_waitlist_chain
          rationale: "The three-hop posture cascade (log -> posture SUSPENDED -> future RESERVED rows become WAITLISTED with suspension_hold true) is walked end to end there, and the four-hop observation chain is covered by intake_observation_four_hop_monitoring_chain."
      - name: ledger_and_census_variants_diverge_on_same_period
        claim_type: dual_variant_calculation
        grounds:
          - calculations.meal_count_reconciliation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / meal_count_ledger_vs_census_billing
          rationale: "That instance computes both variants over one period and asserts the exact signed variance delta between them."
      - name: rolling_weight_loss_threshold_at_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.weight_trend_monitoring.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / rolling_weight_loss_inclusive_minus_five_boundary
          rationale: "That instance probes the -4.99 / -5.00 pair around the inclusive trigger threshold and asserts the PlanOfCareReview is opened only at -5.00."

  - section: consistency_model
    instances:
      - name: intake_observation_response_and_reads_agree_immediately
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.intake_risk_score
          - state_machines.PlanOfCareReview
        distinguishing_aspect: "Every denormalized consequence of one write — the resident's rolling and baseline percentages, the averaged intake, the risk score and the newly opened review — is already correct in that write's own response body, and an immediate re-read returns byte-identical values with no second write."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T08:00:00Z, later advanced to 2026-08-20T08:00:00Z."
            - "One community and one ACTIVE resident with baseline_weight_kg 78.0 and no observations."
            - "A first observation on 2026-08-02 recorded 80.0 kg with intake 60."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T08:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Greta Halvorsen", care_level: "ASSISTED_LIVING", baseline_weight_kg: 78.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id }
            - call: "POST /residents/${r_id}/intake-observations"
              payload: { observation_date: "2026-08-02", meal_period: "LUNCH", intake_pct: 60, weight_kg: 80.0 }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { obs1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /residents/${r_id}/intake-observations"
              payload: { observation_date: "2026-08-20", meal_period: "LUNCH", intake_pct: 80, weight_kg: 76.0 }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { obs2_id: $.data.id, obs2_weight: $.data.weight_kg, obs2_by: $.data.recorded_by_user_id }
            - call: "GET /residents/${r_id}"
              payload: {}
              as: ClinicalStaff
              captures: { r_current: $.data.current_weight_kg, r_rolling: $.data.rolling_30d_weight_change_pct, r_baseline: $.data.baseline_weight_change_pct, r_avg: $.data.avg_intake_pct_7d, r_risk: $.data.intake_risk_score }
            - call: "GET /plan-of-care-reviews"
              payload: { resident_id: "${r_id}", status: "OPEN" }
              as: RegisteredDietitian
              captures: { rev_total: $.meta.total_count, rev_id: "$.data[0].id", rev_trigger: "$.data[0].trigger_observation_id", rev_reason: "$.data[0].trigger_reason", rev_score: "$.data[0].risk_score_at_open" }
            - call: "GET /residents/${r_id}"
              payload: {}
              as: RegisteredDietitian
              captures: { r_rolling2: $.data.rolling_30d_weight_change_pct, r_risk2: $.data.intake_risk_score }
          assert:
            - "${obs2_weight} == 76.0 and ${obs2_by} == cs-1"
            - "${r_current} == 76.0, ${r_rolling} == -5.00 ((76.0 - 80.0) * 100 / 80.0) and ${r_baseline} == -2.56 ((76.0 - 78.0) * 100 / 78.0, HALF_UP)"
            - "${r_avg} == 80.00 — only the 2026-08-20 observation falls inside the trailing 7-day window at the current clock"
            - "${rev_total} == 1 with ${rev_trigger} == ${obs2_id}, ${rev_reason} == WEIGHT_LOSS and ${rev_score} == ${r_risk}"
            - "${r_rolling2} == ${r_rolling} and ${r_risk2} == ${r_risk} — the immediate re-read adds no drift and required no follow-up write"
