  - rule_id: cross_entity_state_dependency
    instances:
      - name: pilot_order_refused_while_a_sibling_pilot_occupies_the_slate_stage
        grounds:
          - validations[priority=40]
          - entities.Slate.fields.max_concurrent_pilot_shoots
          - state_machines.PilotOrder
          - endpoints["POST /pilot-orders"]
          - endpoints["POST /pilot-orders/{id}/contingency-clearances"]
        distinguishing_aspect: |
          Dependency across the PilotOrder <-> Slate <-> sibling-PilotOrder triangle:
          whether project P2 may order a pilot at all depends on the production_status
          of a pilot belonging to an unrelated project P1 on the same slate. Nothing
          about P2 changes between the refusal and the success - only P1's pilot
          moving ORDERED -> COLLAPSED frees the stage, so the dependency is on a
          third row's state, not on any field of the entity being written.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one slate with max_concurrent_pilot_shoots 1 and total_dev_budget_cents 400000000"
