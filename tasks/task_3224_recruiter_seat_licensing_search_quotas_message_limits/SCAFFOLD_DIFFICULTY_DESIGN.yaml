scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: proration_remaining_on_lite_vs_elapsed_on_corp
        grounds:
          - calculations.proration_credit
          - entities.RecruiterContract.fields.product_tier
          - entities.RenewalEvent.fields.proration_credit_cents
        distinguishing_aspect: |
          The proration_credit calculation selects its variant from the
          contract's tier domain (LITE/PRO -> REMAINING, CORP -> ELAPSED), so
          two RenewalEvents with identical seats_delta and identical clock
          position produce different proration_credit_cents on different
          contract tiers; this instance operates on the RenewalEvent /
          RecruiterContract domain.
        test_recipe:
          setup:
            - "Two ACTIVE contracts: LITE with seats_purchased=2 (monthly_credit_per_seat=30 -> per-seat period cost 3000 cents), CORP with seats_purchased=2 (150 -> 15000 cents), both activated at the default clock 2026-09-01T00:00:00Z"
            - "Logical clock advanced to 2026-09-11T00:00:00Z so days_elapsed=10, days_remaining=20"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-LITE-1", product_tier: "RECRUITER_LITE", seat_cap: 10 }
              as: ContractAdmin
              captures: { cid_lite: $.data.id }
            - call: "POST /contracts/${cid_lite}/activate"
              payload: { seats_purchased_initial: 2 }
              as: ContractAdmin
            - call: "POST /contracts"
              payload: { contract_number: "C-CORP-1", product_tier: "RECRUITER_CORP", seat_cap: 10 }
              as: ContractAdmin
              captures: { cid_corp: $.data.id }
            - call: "POST /contracts/${cid_corp}/activate"
              payload: { seats_purchased_initial: 2 }
              as: ContractAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: ContractAdmin
            - call: "GET /contracts/${cid_lite}"
              as: ContractAdmin
              captures: { lite_v: $.data.version }
            - call: "GET /contracts/${cid_corp}"
              as: ContractAdmin
              captures: { corp_v: $.data.version }
          trigger:
            - call: "POST /contracts/${cid_lite}/renewal-events"
              payload: { event_kind: "TRUE_UP", seats_delta: -1, expected_contract_version: "${lite_v}" }
              as: Auditor
              captures: { ev_lite: $.data.id }
            - call: "POST /renewal-events/${ev_lite}/approve"
              as: Auditor
            - call: "POST /contracts/${cid_corp}/renewal-events"
              payload: { event_kind: "TRUE_UP", seats_delta: -1, expected_contract_version: "${corp_v}" }
              as: Auditor
              captures: { ev_corp: $.data.id }
            - call: "POST /renewal-events/${ev_corp}/approve"
              as: Auditor
          assert:
            - "RenewalEvent.${ev_lite}.proration_credit_cents == 2000   # REMAINING: 1 * 3000 * 20/30"
            - "RenewalEvent.${ev_corp}.proration_credit_cents == 5000   # ELAPSED:   1 * 15000 * 10/30"
            - "RenewalEvent.${ev_lite}.proration_credit_cents != RenewalEvent.${ev_corp}.proration_credit_cents"

      - name: budget_pacing_even_vs_front_loaded_same_spend
        grounds:
          - calculations.budget_pacing
          - entities.JobPosting.fields.pacing_mode
        distinguishing_aspect: |
          The budget_pacing calculation selects its variant from the
          JobPosting's pacing_mode field, so two postings with identical
          budget_cents, daily_cap_cents, start_at, end_at, and identical
          spend amount disagree on acceptance: EVEN rejects a 1200-cent
          day-1 spend while FRONT_LOADED accepts it; this instance operates
          on the JobPosting / PromotedSlot domain.
        test_recipe:
          setup:
            - "ACTIVE contract (PRO tier, seats_purchased=1) with one seat assigned to a recruiter"
            - "Two DRAFT postings, each budget_cents=10000, daily_cap_cents=5000, 10-day window 2026-09-01..2026-09-11, one EVEN and one FRONT_LOADED, each with one RESERVED PromotedSlot, both ACTIVE"
            - "Logical clock at the default 2026-09-01T00:00:00Z (day 1: elapsed_days=1)"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-PACE-1", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r1@x.com", full_name: "R One", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/job-postings"
              payload: { title: "Even Job", budget_cents: 10000, daily_cap_cents: 5000, pacing_mode: "EVEN", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-11T00:00:00Z", created_by_seat_id: "${seat1}" }
              as: SeatAdmin
              captures: { jp_even: $.data.id }
            - call: "POST /contracts/${cid}/job-postings"
              payload: { title: "Front Job", budget_cents: 10000, daily_cap_cents: 5000, pacing_mode: "FRONT_LOADED", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-11T00:00:00Z", created_by_seat_id: "${seat1}" }
              as: SeatAdmin
              captures: { jp_front: $.data.id }
            - call: "POST /contracts/${cid}/job-postings/${jp_even}/promoted-slots"
              payload: { slot_date: "2026-09-01", reserved_cents: 5000 }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/job-postings/${jp_front}/promoted-slots"
              payload: { slot_date: "2026-09-01", reserved_cents: 5000 }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/job-postings/${jp_even}/activate"
              as: SeatAdmin
            - call: "POST /contracts/${cid}/job-postings/${jp_front}/activate"
              as: SeatAdmin
          trigger:
            - call: "POST /contracts/${cid}/job-postings/${jp_even}/record-spend"
              payload: { amount_cents: 1200 }
              as: SeatAdmin
              captures: { even_err: $.data.error_id }
            - call: "POST /contracts/${cid}/job-postings/${jp_front}/record-spend"
              payload: { amount_cents: 1200 }
              as: SeatAdmin
              captures: { front_spent: $.data.spent_cents }
          assert:
            - "even call rejected with ERR_PACING_VIOLATION (EVEN cumulative_cap day 1 = floor(10000*1/10) = 1000 < 1200)"
            - "JobPosting.${jp_front}.spent_cents == 1200 (FRONT_LOADED cumulative_cap day 1 = floor(10000*1.5/10) = 1500 >= 1200)"

  # =====================================================================
  # Rule 2 — combinatorial_formula (2 instances, different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pacing_nested_min_max_with_daily_cap_and_budget
        grounds:
          - calculations.budget_pacing
          - errors[ERR_PACING_VIOLATION]
        distinguishing_aspect: |
          Mode (a): the pacing accept rule is a >=3-input non-linear
          interaction (amount vs daily_cap vs cumulative_cap vs budget_cents)
          with nested min() over cumulative_cap and budget and conditional
          branches on pacing_mode and elapsed_days; a spend that fits the
          daily cap but overshoots the cumulative cap is rejected.
        test_recipe:
          setup:
            - "ACTIVE PRO contract with one assigned seat; EVEN posting budget_cents=9000, daily_cap_cents=2000, 10-day window, ACTIVE with RESERVED slot; clock at day 1"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-PACE-2", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r2@x.com", full_name: "R Two", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/job-postings"
              payload: { title: "Cap Job", budget_cents: 9000, daily_cap_cents: 2000, pacing_mode: "EVEN", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-11T00:00:00Z", created_by_seat_id: "${seat1}" }
              as: SeatAdmin
              captures: { jp: $.data.id }
            - call: "POST /contracts/${cid}/job-postings/${jp}/promoted-slots"
              payload: { slot_date: "2026-09-01", reserved_cents: 2000 }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/job-postings/${jp}/activate"
              as: SeatAdmin
          trigger:
            - call: "POST /contracts/${cid}/job-postings/${jp}/record-spend"
              payload: { amount_cents: 900 }
              as: SeatAdmin
              captures: { spent1: $.data.spent_cents }
            - call: "POST /contracts/${cid}/job-postings/${jp}/record-spend"
              payload: { amount_cents: 200 }
              as: SeatAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "first spend accepted: JobPosting.${jp}.spent_cents == 900 (cumulative_cap day 1 = floor(9000/10) = 900)"
            - "second spend rejected with ERR_PACING_VIOLATION even though 200 <= daily_cap_cents=2000 (900+200=1100 > cumulative_cap 900)"

      - name: proration_rounding_order_per_seat_then_multiply
        grounds:
          - calculations.proration_credit
          - entities.RenewalEvent.fields.proration_credit_cents
        distinguishing_aspect: |
          Mode (b): nested rounding — the scaffold pins the order
          'abs(seats_delta) * per_seat_period_cost_cents * days_fraction,
          rounded half-up only at the final step', NOT 'round each seat's
          credit first then multiply'; with LITE tier (3000 cents/seat),
          days_remaining=7, seats_delta=-2 the pinned order yields
          2*3000*7/30 = 1400 exactly, and any intermediate-rounding order
          the scaffold forbids would diverge on fractional cases.
        test_recipe:
          setup:
            - "ACTIVE LITE contract with seats_purchased=3, seats_assigned=0, activated at default clock 2026-09-01T00:00:00Z"
            - "Logical clock advanced to 2026-09-24T00:00:00Z so days_remaining = 7 (period ends 2026-10-01)"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-LITE-2", product_tier: "RECRUITER_LITE", seat_cap: 10 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 3 }
              as: ContractAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-24T00:00:00Z" }
              as: ContractAdmin
            - call: "GET /contracts/${cid}"
              as: ContractAdmin
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /contracts/${cid}/renewal-events"
              payload: { event_kind: "TRUE_UP", seats_delta: -2, expected_contract_version: "${cv}" }
              as: Auditor
              captures: { ev: $.data.id }
            - call: "POST /renewal-events/${ev}/approve"
              as: Auditor
          assert:
            - "RenewalEvent.${ev}.proration_credit_cents == 1400   # 2 * 3000 * 7/30, half-up at final step"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: message_parallel_delivery_x_response_dimensions
        grounds:
          - state_machines.Message
          - entities.Message.fields.delivery_status
          - entities.Message.fields.response_status
        distinguishing_aspect: |
          Message carries two independent state dimensions
          (delivery_status x response_status) that evolve on separate
          triggers: delivery moves PENDING->SENT at send time while
          response_status stays AWAITING, and only a later record-response
          advances the response dimension; a FAILED delivery leaves the
          response dimension frozen.
        test_recipe:
          setup:
            - "ACTIVE PRO contract with one assigned seat, one OPEN SearchProject, one visible CandidateProfile (PUBLIC privacy)"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-MSG-1", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r3@x.com", full_name: "R Three", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/projects"
              payload: { name: "P1", owner_seat_id: "${seat1}" }
              as: SeatAdmin
              captures: { proj1: $.data.id }
            - call: "POST /projects/${proj1}/open"
              as: SeatAdmin
            - call: "POST /candidate-profiles"
              payload: { member_id: "m-1", full_name: "Cand One", headline: "Eng", privacy_setting: "PUBLIC", open_to_work: false, open_to_work_visibility: "NONE", years_experience: 5, current_title: "Engineer" }
              as: ContractAdmin
              captures: { cand1: $.data.id }
          trigger:
            - call: "POST /seats/${seat1}/messages"
              payload: { candidate_id: "${cand1}", project_id: "${proj1}", body: "hello" }
              as: RecruiterUser
              as_user_id: "${rec1}"
              captures: { msg1: $.data.id, msg_ds: $.data.delivery_status, msg_rs: $.data.response_status, msg_cc: $.data.credit_consumed }
            - call: "POST /messages/${msg1}/record-response"
              payload: { response_kind: "RESPONDED" }
              as: AtsService
              captures: { msg_rs2: $.data.response_status, msg_cr: $.data.credit_returned_flag }
          assert:
            - "after send: Message.${msg1}.delivery_status == SENT and response_status == AWAITING (dimensions independent)"
            - "credit_consumed == 1 (candidate not open-to-work ALL_MEMBERS)"
            - "after record-response: response_status == RESPONDED while delivery_status remains SENT"
            - "credit_returned_flag == true"

      - name: project_open_hold_open_cycle
        grounds:
          - state_machines.SearchProject
        distinguishing_aspect: |
          SearchProject is cyclic (OPEN -> ON_HOLD -> OPEN) on the same
          trigger endpoint /open used from two different from-states,
          unlike the linear Seat pipeline; the cycle can repeat an
          arbitrary number of times until CLOSED.
        test_recipe:
          setup:
            - "ACTIVE PRO contract with one assigned seat and a DRAFT project"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-PRJ-1", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r4@x.com", full_name: "R Four", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/projects"
              payload: { name: "CycP", owner_seat_id: "${seat1}" }
              as: SeatAdmin
              captures: { proj1: $.data.id }
          trigger:
            - call: "POST /projects/${proj1}/open"
              as: SeatAdmin
              captures: { s1: $.data.project_status }
            - call: "POST /projects/${proj1}/hold"
              as: SeatAdmin
              captures: { s2: $.data.project_status }
            - call: "POST /projects/${proj1}/open"
              as: SeatAdmin
              captures: { s3: $.data.project_status }
            - call: "POST /projects/${proj1}/hold"
              as: SeatAdmin
              captures: { s4: $.data.project_status }
          assert:
            - "SearchProject.${proj1}.project_status sequence == [OPEN, ON_HOLD, OPEN, ON_HOLD]"
            - "the second /open succeeded from ON_HOLD, proving the cycle"

  # =====================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers; one depth>=3, one depth>=2)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: contract_suspend_cascade_seat_then_message
        grounds:
          - state_machines.RecruiterContract.ACTIVE_to_SUSPENDED
          - state_machines.Seat.ASSIGNED_to_SUSPENDED
          - state_machines.Message
        distinguishing_aspect: |
          Depth-3 cascade: Auditor suspends the Contract (link 1), which
          cascades each ASSIGNED Seat to SUSPENDED (link 2), whose own
          transition side-effect expires every AWAITING Message on that
          seat (link 3); each hop is caused by the previous hop's
          transition, not by the original suspend call.
        test_recipe:
          setup:
            - "ACTIVE PRO contract with one seat assigned to a recruiter, one OPEN project, one SENT message with response_status=AWAITING"
            - "an APPROVED RenewalEvent of kind=SUSPENSION exists for the contract"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-CAS-1", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r5@x.com", full_name: "R Five", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
            - call: "POST /contracts/${cid}/projects"
              payload: { name: "PC", owner_seat_id: "${seat1}" }
              as: SeatAdmin
              captures: { proj1: $.data.id }
            - call: "POST /projects/${proj1}/open"
              as: SeatAdmin
            - call: "POST /candidate-profiles"
              payload: { member_id: "m-2", full_name: "Cand Two", headline: "Eng", privacy_setting: "PUBLIC", open_to_work: false, open_to_work_visibility: "NONE", years_experience: 3, current_title: "Engineer" }
              as: ContractAdmin
              captures: { cand1: $.data.id }
            - call: "POST /seats/${seat1}/messages"
              payload: { candidate_id: "${cand1}", project_id: "${proj1}", body: "hi" }
              as: RecruiterUser
              as_user_id: "${rec1}"
              captures: { msg1: $.data.id }
            - call: "GET /contracts/${cid}"
              as: ContractAdmin
              captures: { cv: $.data.version }
            - call: "POST /contracts/${cid}/renewal-events"
              payload: { event_kind: "SUSPENSION", expected_contract_version: "${cv}" }
              as: Auditor
              captures: { ev: $.data.id }
            - call: "POST /renewal-events/${ev}/approve"
              as: Auditor
          trigger:
            - call: "POST /contracts/${cid}/suspend"
              as: Auditor
            - call: "GET /contracts/${cid}/seats/${seat1}"
              as: Auditor
              captures: { seat_st: $.data.seat_status }
            - call: "GET /messages/${msg1}"
              as: Auditor
              captures: { msg_rs: $.data.response_status }
          assert:
            - "Seat.${seat1}.seat_status == SUSPENDED (link 2 fired)"
            - "Message.${msg1}.response_status == EXPIRED (link 3 fired via the seat suspension, not directly)"

      - name: recruiter_deactivate_cascade_seat_release
        grounds:
          - endpoints: "POST /recruiters/{recruiter_id}/deactivate"
          - state_machines.Seat.ASSIGNED_to_UNASSIGNED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: deactivating a
          Recruiter (link 1) forces the linked Seat ASSIGNED -> UNASSIGNED
          and clears assigned_recruiter_id (link 2), which in turn
          decrements RecruiterContract.seats_assigned (the seat's own
          side effect); originates from the deactivate endpoint, not from
          a seat-scoped call.
        test_recipe:
          setup:
            - "ACTIVE PRO contract with one seat assigned to recruiter R; R.active_seat_id = seat"
          setup_api_calls:
            - call: "POST /contracts"
              payload: { contract_number: "C-CAS-2", product_tier: "RECRUITER_PRO", seat_cap: 5 }
              as: ContractAdmin
              captures: { cid: $.data.id }
            - call: "POST /contracts/${cid}/activate"
              payload: { seats_purchased_initial: 1 }
              as: ContractAdmin
            - call: "POST /recruiters"
              payload: { email: "r6@x.com", full_name: "R Six", home_contract_id: "${cid}" }
              as: ContractAdmin
              captures: { rec1: $.data.id }
            - call: "GET /contracts/${cid}/seats"
              as: ContractAdmin
              captures: { seat1: $.data.0.id, seat1_v: $.data.0.version }
            - call: "POST /contracts/${cid}/seats/${seat1}/assign"
              payload: { recruiter_id: "${rec1}", expected_seat_version: "${seat1_v}" }
              as: SeatAdmin
          trigger:
            - call: "POST /recruiters/${rec1}/deactivate"
              as: ContractAdmin
            - call: "GET /contracts/${cid}/seats/${seat1}"
              as: Auditor
              captures: { seat_st: $.data.seat_status, seat_ar: $.data.assigned_recruiter_id }
            - call: "GET /recruiters/${rec1}"
              as: Auditor
              captures: { rec_st: $.data.recruiter_status, rec_seat: $.data.active_seat_id }
          assert:
            - "Recruiter.${rec1}.recruiter_status == DEACTIVATED and active_seat_id == null"
            - "Seat.${seat1}.seat_status == UNASSIGNED and assigned_recruiter_id == null (link 2 fired)"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (2 instances, different category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: antispam_throttle_beats_no_credits
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_ANTISPAM_THROTTLED]
          - errors[ERR_NO_CREDITS_REMAINING]
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal: a send that
          violates BOTH the anti-spam throttle (pool THROTTLED,
          spam_strike_count >= 3) AND the no-credits check
          (credits_available == 0) MUST surface ERR_ANTISPAM_THROTTLED
          (priority 5), not ERR_NO_CREDITS_REMAINING (priority 11).
        test_recipe:
          setup:
            - "ACTIVE LITE contract (monthly_credit_per_seat=30) with one assigned seat, one OPEN project, one visible PUBLIC candidate C"
