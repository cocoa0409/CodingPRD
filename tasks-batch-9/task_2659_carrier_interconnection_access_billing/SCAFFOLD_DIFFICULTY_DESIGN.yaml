- rule_id: combinatorial_formula
  instances:
  - name: trunk_sizing_nested_max_with_direction_and_ds1_quantization
    grounds:
    - calculations.trunk_sizing_and_blocking
    - state_machines.TrunkGroup.NONE_to_AUGMENT_ORDERED
    - entities.TrunkGroup.fields.required_trunks
    - entities.TrunkAugmentOrder.fields.requested_additional_trunks
    distinguishing_aspect: |
      Mode (a): trunk_sizing_and_blocking interacts four inputs non-linearly — a nested max(measured busy-hour CCS, round(forecast * 1.15, 2)), a branch on TrunkGroup.direction selecting 31 versus 27 CCS per trunk, a ceil to whole trunks and a second ceil quantizing the shortfall to 24-trunk DS1 blocks — so the identical 3.00% blocking event yields 24, 48 and 24 additional trunks on three trunk groups. This is not the nested-rounding mode (b) or the pinned-evaluation-order mode (c) carried by the other two instances of this rule.
    test_recipe:
      setup:
      - An EFFECTIVE agreement with poi_facility_capacity_trunks 192.
      - 'Three IN_SERVICE trunk groups, each forecast at 1200.00 busy-hour CCS: TWO_WAY 48 trunks at DLLSTXCTDS0, ONE_WAY_OUTBOUND 48 trunks at DLLSTXCTDS0, TWO_WAY 24 trunks at HSTNTXCTDS0.'
      - Logical clock at the 2026-08-01T00:00:00Z default.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
      - call: POST /interconnection/tariff-filings
        payload:
          filing_docket: TF-2026-LOC-001
          rate_element: LOCAL_RECIPROCAL_COMP
          rate_per_mou_usd: 0.061250
          benchmark_interstate_rate_per_mou_usd: 0.512500
          effective_date: '2026-08-01T00:00:00.000Z'
          expiry_date: '2027-01-01T00:00:00.000Z'
        as: RegulatoryAffairsSpecialist
        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/agreements
        payload:
          carrier_id: ${car_id}
          agreement_label: ICA-NORTHSTAR-2026
          proposed_reciprocal_rate_per_mou_usd: 0.061250
          proposed_term_months: 36
          transit_traffic_allowed: false
          effective_date: '2026-08-01T00:00:00.000Z'
          poi_facility_capacity_trunks: 192
        as: InterconnectionManager
        captures:
          agr_id: $.data.id
          agr_v0: $.data.version
      - call: POST /interconnection/agreements/${agr_id}/offers
        payload:
          expected_agreement_version: ${agr_v0}
          offer_type: PROPOSAL
          reciprocal_rate_per_mou_usd: 0.061250
          term_months: 36
          poi_financial_responsibility: SHARED
          transit_traffic_allowed: false
        as: InterconnectionManager
        captures:
          offer1_id: $.data.id
      - call: POST /interconnection/negotiation-offers/${offer1_id}/accept
        payload: {}
        as: CarrierRepresentative
        as_user_id: ${car_id}
      - call: POST /interconnection/agreements/${agr_id}/activate
        payload: {}
        as: InterconnectionManager
      - &id001
        call: POST /interconnection/trunk-groups
        payload:
          agreement_id: ${agr_id}
          trunk_group_serial: TG-DLLS-TWOWAY-001
          poi_clli_code: DLLSTXCTDS0
          lata_code: '552'
          poi_type: MEET_POINT
          direction: TWO_WAY
          traffic_type: LOCAL_INTERCONNECTION
          forecast_busy_hour_ccs: 1200.00
          forecast_horizon_quarters: 4
        as: NetworkPlanner
        captures:
          tg1_id: $.data.id
      - &id002
        call: POST /interconnection/trunk-groups/${tg1_id}/provision
        payload:
          provisioned_trunks: 48
        as: NetworkPlanner
      - &id003
        call: POST /interconnection/trunk-groups/${tg1_id}/activate
        payload: {}
        as: NetworkPlanner
      - &id005
        call: POST /interconnection/trunk-groups
        payload:
          agreement_id: ${agr_id}
          trunk_group_serial: TG-DLLS-OUT-002
          poi_clli_code: DLLSTXCTDS0
          lata_code: '552'
          poi_type: MEET_POINT
          direction: ONE_WAY_OUTBOUND
          traffic_type: LOCAL_INTERCONNECTION
          forecast_busy_hour_ccs: 1200.00
          forecast_horizon_quarters: 4
        as: NetworkPlanner
        captures:
          tg2_id: $.data.id
      - &id006
        call: POST /interconnection/trunk-groups/${tg2_id}/provision
        payload:
          provisioned_trunks: 48
        as: NetworkPlanner
      - &id007
        call: POST /interconnection/trunk-groups/${tg2_id}/activate
        payload: {}
        as: NetworkPlanner
      - call: POST /interconnection/trunk-groups
        payload:
          agreement_id: ${agr_id}
          trunk_group_serial: TG-HSTN-TWOWAY-003
          poi_clli_code: HSTNTXCTDS0
          lata_code: '560'
          poi_type: MEET_POINT
          direction: TWO_WAY
          traffic_type: LOCAL_INTERCONNECTION
          forecast_busy_hour_ccs: 1200.00
          forecast_horizon_quarters: 4
        as: NetworkPlanner
        captures:
          tg3_id: $.data.id
      - call: POST /interconnection/trunk-groups/${tg3_id}/provision
        payload:
          provisioned_trunks: 24
        as: NetworkPlanner
      - call: POST /interconnection/trunk-groups/${tg3_id}/activate
        payload: {}
        as: NetworkPlanner
      trigger:
      - call: POST /interconnection/trunk-groups/${tg1_id}/traffic-measurements
        payload:
          measurement_period_start: '2026-07-01T00:00:00.000Z'
          measurement_period_end: '2026-07-31T00:00:00.000Z'
          offered_calls: 10000
          blocked_calls: 300
          busy_hour_ccs: 2100.00
        as: NetworkPlanner
      - call: POST /interconnection/trunk-groups/${tg2_id}/traffic-measurements
        payload:
          measurement_period_start: '2026-07-01T00:00:00.000Z'
          measurement_period_end: '2026-07-31T00:00:00.000Z'
          offered_calls: 10000
          blocked_calls: 300
          busy_hour_ccs: 2100.00
        as: NetworkPlanner
      - call: POST /interconnection/trunk-groups/${tg3_id}/traffic-measurements
        payload:
          measurement_period_start: '2026-07-01T00:00:00.000Z'
          measurement_period_end: '2026-07-31T00:00:00.000Z'
          offered_calls: 10000
          blocked_calls: 300
          busy_hour_ccs: 1000.00
        as: NetworkPlanner
      - call: GET /interconnection/trunk-augment-orders
        payload:
          trunk_group_id: ${tg1_id}
          status: PENDING
        as: NetworkPlanner
        captures:
          o1_id: $.data[0].id
      - call: GET /interconnection/trunk-augment-orders
        payload:
          trunk_group_id: ${tg2_id}
          status: PENDING
        as: NetworkPlanner
        captures:
          o2_id: $.data[0].id
      - call: GET /interconnection/trunk-augment-orders
        payload:
          trunk_group_id: ${tg3_id}
          status: PENDING
        as: NetworkPlanner
        captures:
