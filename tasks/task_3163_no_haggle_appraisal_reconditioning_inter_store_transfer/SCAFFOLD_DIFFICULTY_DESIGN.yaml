            - "TransferRequest.${tr2} is created with from_store_id == ${s_dal} (vehicle had moved) and supersedes_request_id == ${tr1}"
            - "no TRANSFER_FEE_REFUND ledger entry exists for ${tr1} (hold expiry forfeits the fee)"

      - name: appraisal_validity_single_active_per_vehicle
        grounds:
          - entities.Appraisal.fields.valid_until
          - state_machines.Appraisal.ACTIVE_to_EXPIRED
          - errors.ERR_CROSS_ENTITY_STATE
        distinguishing_aspect: "Aggregate-capacity interval semantics on resource Vehicle: at most one non-terminal appraisal (PENDING_INSPECTION or ACTIVE) may exist per vehicle at any instant — a second appraisal creation during the first offer's validity window is rejected even though the two windows would merely touch, a different geometric rule than the transfer hold's half-open occupancy and on a different resource axis (appraisal vs transfer)."
        test_recipe:
          setup:
            - "Clock 2026-09-01. V_A appraised by CUST1 to PENDING_INSPECTION. CUST2 attempts a second appraisal on the same vehicle while the first is non-terminal. Then CUST1's appraisal is voided from ACTIVE later scenarios use the APPRAISED->APPRAISED re-appraisal path; here the coverage target is the aggregate-capacity rejection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/stores"
              payload: { store_code: "PHX-01", display_name: "Phoenix", region: "WEST" }
              as: PlatformAdmin
              captures: { s_phx: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Customer One", email: "c1@x.com", credit_score: 720, stated_annual_income_cents: 9000000 }
              as: PlatformAdmin
              captures: { cust1: $.data.id }
            - call: "POST /v1/customers"
              payload: { full_name: "Customer Two", email: "c2@x.com", credit_score: 700, stated_annual_income_cents: 8000000 }
              as: PlatformAdmin
              captures: { cust2: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Appraiser One", store_id: "${s_phx}", role_kind: "APPRAISER" }
              as: PlatformAdmin
              captures: { ap1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Inspector One", store_id: "${s_phx}", role_kind: "INSPECTOR" }
              as: PlatformAdmin
              captures: { in1: $.data.id }
            - call: "POST /v1/associates"
              payload: { display_name: "Manager One", store_id: "${s_phx}", role_kind: "MANAGER" }
              as: PlatformAdmin
              captures: { mgr1: $.data.id }
            - call: "POST /v1/vehicles"
              payload: { vin: "VINAAAAAAAAAAAAAAAA", make: "Honda", model: "Accord", model_year: 2022, odometer_miles: 30000, book_value_cents: 2000000, current_store_id: "${s_phx}" }
              as: StoreManager
              as_user_id: "${mgr1}"
              captures: { veh_a: $.data.id }
            - call: "POST /v1/appraisals"
              payload: { vehicle_id: "${veh_a}", customer_id: "${cust1}", appraiser_id: "${ap1}" }
              as: Appraiser
              as_user_id: "${ap1}"
              captures: { appr_a1: $.data.id }
          trigger:
            - call: "POST /v1/appraisals"
              payload: { vehicle_id: "${veh_a}", customer_id: "${cust2}", appraiser_id: "${ap1}" }
              as: Appraiser
              as_user_id: "${ap1}"
              captures: { err_id: $.data.error_id }
            - call: "GET /v1/vehicles/${veh_a}/appraisals"
              payload: {}
              as: Appraiser
              as_user_id: "${ap1}"
          assert:
            - "second appraisal rejected: 409 with error ERR_CROSS_ENTITY_STATE (a non-terminal appraisal already exists for the vehicle)"
            - "GET /v1/vehicles/${veh_a}/appraisals returns exactly 1 row, Appraisal.${appr_a1} in PENDING_INSPECTION"
            - "Appraisal.${appr_a1}.provisional_offer_cents == 1680000"

