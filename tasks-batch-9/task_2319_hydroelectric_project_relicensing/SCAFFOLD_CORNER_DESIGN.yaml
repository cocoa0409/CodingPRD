            - "${stl_after} == EXECUTED, ${inc_after} == 1 and ${ms_after} == INCLUDED (the rejected withdrawal reversed nothing)"
            - "${cost_after} == 98000.00, ${burden_after} == 130548.60 and ${stage_after} == LICENSED"
            - "${err_new} == ERR_SETTLEMENT_STATE_INVALID with HTTP 409 (an EXECUTED settlement blocks a replacement even at the correct project version)"

      - name: certification_decision_and_party_payload_shape_rejected
        claim_type: triggerability
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /relicensing/water-quality-certifications/{wqc_id}/decision"]
          - endpoints["POST /relicensing/parties"]
        distinguishing_aspect: "ERR_INVALID_REQUEST covers conditional body shape, not just missing fields: ISSUE_WITH_CONDITIONS with an empty conditions list, DENY with no denial_reason and a non-agency party claiming conditioning authority are all shape violations, and none of them may leave a partial write behind."
        test_recipe:
          setup:
            - "Project P-9049 in STUDY_PHASE with one REQUESTED certification and no parties."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9049", project_name: "Shape Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/water-quality-certifications"
              payload: { project_id: "${proj}", certifying_agency_name: "State DEQ" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { wqc: $.data.id, st0: $.data.status }
          trigger:
            - call: "POST /relicensing/water-quality-certifications/${wqc}/decision"
              payload: { decision: "ISSUE_WITH_CONDITIONS", conditions: [] }
              as: StateCertifier
              as_user_id: "u_state_1"
              captures: { err_empty: $.data.error_id }
            - call: "POST /relicensing/water-quality-certifications/${wqc}/decision"
              payload: { decision: "DENY" }
              as: StateCertifier
              as_user_id: "u_state_1"
              captures: { err_deny: $.data.error_id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "River Tribe", party_type: "TRIBE", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_tribe" }
              as: Regulator
              captures: { err_party: $.data.error_id }
            - call: "GET /relicensing/water-quality-certifications/${wqc}"
              payload: {}
              as: Regulator
              captures: { st1: $.data.status, cc1: $.data.condition_count, dec1: $.data.decided_at }
            - call: "GET /relicensing/pme-measures"
              payload: { project_id: "${proj}" }
              as: Regulator
            - call: "POST /relicensing/water-quality-certifications/${wqc}/decision"
              payload: { decision: "DENY", denial_reason: "state standards cannot be met" }
              as: StateCertifier
              as_user_id: "u_state_1"
              captures: { st2: $.data.status, reason2: $.data.denial_reason }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Regulator
              captures: { pwqc: $.data.wqc_status, posture: $.data.regulatory_posture }
          assert:
            - "${st0} == REQUESTED"
            - "${err_empty} == ERR_INVALID_REQUEST with HTTP 400 (ISSUE_WITH_CONDITIONS needs at least one condition)"
            - "${err_deny} == ERR_INVALID_REQUEST with HTTP 400 (DENY needs a denial_reason)"
            - "${err_party} == ERR_INVALID_REQUEST with HTTP 400 (has_conditioning_authority requires party_type AGENCY)"
            - "${st1} == REQUESTED, ${cc1} == 0 and ${dec1} == null after the rejected decisions"
            - "the measure list for the project returns total_count == 0 (no condition measure was created by the rejected call)"
            - "${st2} == DENIED with ${reason2} == state standards cannot be met, and ${pwqc} == DENIED with ${posture} == FROZEN"

      - name: application_filing_before_study_acceptance_and_certification_rejected
        claim_type: triggerability
        grounds:
          - errors[ERR_STUDY_NOT_ACCEPTED]
          - errors[ERR_WQC_STATE_INVALID]
          - validations[priority=53]
          - validations[priority=54]
        distinguishing_aspect: "Filing walks a ladder of prerequisites that must be repaired one at a time: with an APPROVED plan but an unreviewed study the filing fails on the study rule, and once the study is ACCEPTED the very same call fails on wqc_status NONE instead."
        test_recipe:
          setup:
            - "Project P-9050 in STUDY_PHASE with an APPROVED study plan whose single study is still NOT_SUBMITTED, and no certification requested."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
