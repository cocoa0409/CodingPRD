      - "on FAILED for purpose == PERIODIC_AUDIT: the sampled lot moves RELEASED -> QUARANTINED (quarantine_reason_code AUDIT_FAILURE), the listing moves LISTED -> SUSPENDED (suspension_reason AUDIT_FAILURE), the product moves RETAIL_RELEASED -> STOP_SHIP (stop_ship_reason_code LISTING_SUSPENDED), and that product's PLANNED campaigns and their HELD reservations are CANCELLED"
    errors: [ERR_TEST_CAMPAIGN_NOT_FOUND, ERR_CAMPAIGN_STATE_INVALID, ERR_REQUIRED_TESTS_MISSING, ERR_AUDIT_SAMPLE_SHORT]

