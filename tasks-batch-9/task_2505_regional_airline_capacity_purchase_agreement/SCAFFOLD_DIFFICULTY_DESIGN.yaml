              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM5002", origin: "ORD", destination: "DTW", scheduled_departure_utc: "2026-09-10T10:35:00Z", scheduled_arrival_utc: "2026-09-10T11:35:00Z", planned_block_hours: 1.000 }
              as: MainlineScheduler
          assert:
            - "The 10:34 attempt returns HTTP 409 with error.code == ERR_AIRCRAFT_TURN_CONFLICT — 34 minutes of separation is strictly less than AIRCRAFT_MIN_TURN_MINUTES"
            - "Immediately after that rejection ScheduleCycle.${cyc}.open_leg_count == 1"
            - "The 10:35 attempt returns HTTP 201 with status == SCHEDULED and scheduled_departure_utc == \"2026-09-10T10:35:00Z\" — exactly 35 minutes is accepted"
            - "ScheduleCycle.${cyc}.open_leg_count == 2 and ScheduleCycle.${cyc}.recorded_completed_legs == 0"
            - "The accepted leg's total for the captain is 3.000 planned block hours in the window, well under PILOT_ROLLING_BLOCK_CAP_HOURS, so error.code is never ERR_PILOT_DUTY_CAP_EXCEEDED"

      - name: pilot_rolling_duty_cap_aggregate_sixteen_hours
        grounds:
          - validations[priority=54]
          - errors[ERR_PILOT_DUTY_CAP_EXCEEDED]
          - entities.FlightLeg.fields.planned_block_hours
          - entities.FlightLeg.fields.captain_pilot_id
        distinguishing_aspect: |
          AGGREGATE-CAPACITY interval semantics on a DIFFERENT resource entity
          (Pilot): no two legs overlap in clock time at all, yet their summed
          planned_block_hours inside the rolling ±24h window around the new
          departure decides admission. 15.000 existing hours plus 1.500 is rejected,
          while 15.000 plus exactly 1.000 is accepted at the 16.000 boundary.
        test_recipe:
          setup:
            - "ACTIVE agreement, one base (pilots_required_per_aircraft 1, aircraft_allocation_cap 2) with two LINE_QUALIFIED pilots so both tails stay IN_SERVICE."
            - "Two REGIONAL_OWNED tails N1401RG and N1402RG IN_SERVICE."
            - "OPEN cycle 2026-09 with published_departures 10 and two SCHEDULED legs for captain P1 on different tails: 2026-09-15T00:00:00Z (8.000 planned, arriving 08:00) on N1401RG and 2026-09-15T10:00:00Z (7.000 planned, arriving 17:00) on N1402RG — 15.000 hours already inside the window."
