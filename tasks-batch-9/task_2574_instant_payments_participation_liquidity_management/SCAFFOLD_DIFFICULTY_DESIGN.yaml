          assert:
            - "GET /position-accounts/${acct_id}/ledger-entries returns exactly 2 rows: sequence_no 1 is TRANSFER_DEBIT with amount_cents == -250000000 and balance_after_cents == 950000000; sequence_no 2 is RETURN_CREDIT with amount_cents == 250000000 and balance_after_cents == 1200000000"
            - "The invariant closes: PrefundedPositionAccount.${acct_id}.current_balance_cents == 1200000000 == opening_balance_cents == 1200000000 + (-250000000) + 250000000"
            - "Neither entry was mutated or removed: the TRANSFER_DEBIT row still carries amount_cents == -250000000 and business_date == 2026-08-03 after the honor"
