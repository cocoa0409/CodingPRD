              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /events/${ev_id}/approve-security"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AGREEMENT_NOT_ACTIVE (no ACTIVE agreement on host center)"
            - "Event.${ev_id}.status == SECURITY_REVIEW (unchanged)"
      - name: tour_approve_unsigned_talent_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_TALENT_AGREEMENT_UNSIGNED]"
          - entities.Event.fields.talent_agreement_signed
        distinguishing_aspect: "With agreement level sufficient (3 >= 2), the talent-agreement precondition is the one that fires: unsigned talent blocks approval."
        test_recipe:
          setup: ["Center with ACTIVE agreement security_level 3; tour requiring level 2 with talent_agreement_signed false"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
