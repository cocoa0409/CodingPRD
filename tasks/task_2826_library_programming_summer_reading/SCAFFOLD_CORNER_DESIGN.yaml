          - calculations.contract_cancellation_fee
        excluded_because:
          difficulty_instance: weather_close_cascade_four_links_from_contract_kill_fee_to_branch_counter
          rationale: "The four-link upward propagation (contract kill fee -> program committed -> budget posture -> Branch.programs_over_budget_count) is exactly that §1.8 instance's subject, including the posture flip that decrements the branch counter."

      - name: flagged_screening_conditionally_reverts_a_confirmed_program
        claim_type: conditional_cascade
        grounds:
          - state_machines.Presenter.screening_decision[PENDING -> FLAGGED]
          - state_machines.Program.compliance_status[CLEARED -> BLOCKED]
        excluded_because:
          difficulty_instance: flagged_screening_cascade_blocks_contract_program_and_returns_the_supply_draw
          rationale: "CASCADE-B's conditional fourth link (the CONFIRMED -> SCHEDULED revert fires only when the program was CONFIRMED) is asserted there; this file instead probes the reverse compensation through cleared_with_conditions_adjudication_restores_a_blocked_contract_to_offered."

      - name: award_revocation_keeps_the_prize_ledger_in_step_with_inventory
        claim_type: ledger_sync
        grounds:
          - state_machines.TierAward.status[RESERVED -> REVOKED]
          - calculations.prize_award_cost
        excluded_because:
          difficulty_instance: prize_unit_and_cents_conservation_survives_an_award_revocation
          rationale: "The lot-quantity and prize-cents conservation identities after a REVOKED award are that §1.8 instance's entire assertion set, so the ledger_sync corner is already pinned."

  # ============================================================== §1.3 CALCULATIONS
  - section: calculations
    instances:

      - name: materials_contingency_rate_flips_at_a_draw_subtotal_of_exactly_twenty_thousand
        claim_type: threshold
        grounds:
          - calculations.materials_commitment_with_contingency
          - calculations.materials_commitment_with_contingency.constants.MATERIALS_CONTINGENCY_THRESHOLD_CENTS
        distinguishing_aspect: "A draw_subtotal of 19500 takes the LOW 10% rate and commits 21450, while a subtotal of exactly 20000 takes the HIGH 5% rate and commits only 21000 — the larger draw commits less money."
        test_recipe:
          setup:
            - "Branch CEN with a 0/0-buffer room and a 100-unit CRAFT-KIT lot at 500 cents; two SCHEDULED programs at 14:00..15:00 (attendance_target 39 -> units_required 39 -> draw_subtotal 19500) and 16:00..17:00 (attendance_target 40 -> draw_subtotal 20000), each with materials_budget_cents 50000."
