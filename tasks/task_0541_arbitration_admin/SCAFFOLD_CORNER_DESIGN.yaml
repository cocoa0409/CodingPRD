            - "Hearing.${h}.status == HELD"

      - name: withdraw_case_cascades_candidate_not_selected
        claim_type: cascade_down
        grounds:
          - state_machines.Case.SELECTION_to_WITHDRAWN
          - state_machines.Candidate.DISCLOSED_to_NOT_SELECTED
        distinguishing_aspect: |
          Withdrawing a SELECTION case cascades its DISCLOSED candidate to NOT_SELECTED (distinct
          from the appoint cascade covered in §1.8).
        test_recipe:
          setup:
