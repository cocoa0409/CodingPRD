            - "response http_status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: penalty_threshold_ge_12_boundary
        grounds:
          - calculations.operator_penalty_score
          - state_machines.Operator.ACTIVE_to_SUSPENDED
          - entities.Operator.fields.rolling_penalty_points
        distinguishing_aspect: |
          Boundary is `>=`: rolling_penalty_points reaching EXACTLY 12 (6+6) suspends the
          operator on the ASSESS call; the metric is a numeric point threshold reached via
          POST /v1/violations/{id}/transitions.
        test_recipe:
          setup:
            - "Operator ACTIVE; one ASSESSED AVI_MISMATCH (6) and one OPEN NO_DECAL (6); clock 2026-03-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Edge Co", operator_type: "TNC", contact_email: "e@x.com" }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/violations"
              payload: { operator_id: "${op_id}", violation_type: "AVI_MISMATCH" }
              as: AirportAuthority
              captures: { vio1_id: $.data.id }
            - call: "POST /v1/violations/${vio1_id}/transitions"
              payload: { action: "ASSESS" }
              as: AirportAuthority
            - call: "POST /v1/violations"
              payload: { operator_id: "${op_id}", violation_type: "NO_DECAL" }
              as: AirportAuthority
              captures: { vio2_id: $.data.id }
          trigger:
            - call: "POST /v1/violations/${vio2_id}/transitions"
              payload: { action: "ASSESS" }
              as: AirportAuthority
              captures: { rp: $.data.id }
          assert:
            - "Operator.${op_id}.rolling_penalty_points == 12"
            - "Operator.${op_id}.status == SUSPENDED"

      - name: settlement_close_zero_trips_empty_set_no_wav_shortfall
        grounds:
          - calculations.wav_compliance_check
          - state_machines.SettlementStatement.OPEN_to_CLOSED
          - entities.SettlementStatement.fields.total_trip_count
        distinguishing_aspect: |
          Empty-collection edge on a DIFFERENT metric/endpoint: closing a statement with
          total_trip_count == 0 leaves gross/net at 0 and issues NO WAV_SHORTFALL violation
          (the ratio is undefined for zero trips), even though pledge_pct is 0.5.
        test_recipe:
          setup:
            - "Operator ACTIVE with wheelchair_pledge_pct 0.5 and no trips; an OPEN 2026-07 statement; clock 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AirportAuthority
            - call: "POST /v1/operators"
              payload: { legal_name: "Zero Co", operator_type: "SHUTTLE", contact_email: "z@x.com", wheelchair_pledge_pct: 0.5 }
              as: AirportAuthority
              captures: { op_id: $.data.id }
            - call: "POST /v1/operators/${op_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/settlements"
              payload: { operator_id: "${op_id}", period_year: 2026, period_month: 7 }
              as: AirportAuthority
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /v1/settlements/${stmt_id}/transitions"
              payload: { action: "CLOSE" }
              as: AirportAuthority
              captures: { tc: $.data.total_trip_count, net: $.data.net_due_cents }
          assert:
            - "SettlementStatement.${stmt_id}.total_trip_count == 0"
            - "SettlementStatement.${stmt_id}.gross_fees_cents == 0"
            - "SettlementStatement.${stmt_id}.net_due_cents == 0"
            - "GET /v1/violations?operator_id=${op_id} has total_count == 0 (no WAV_SHORTFALL issued)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_requires_operator_active
        grounds:
          - validations[priority=8]
          - state_machines.Operator.status
          - entities.Trip.fields.operator_id
        distinguishing_aspect: |
          Trip creation (dispatch) is gated on the OWNING Operator's status==ACTIVE:
          a PENDING operator whose vehicle sits at the queue head cannot be dispatched
          -> ERR_OPERATOR_NOT_ACTIVE. Pair: Trip -> Operator.
        test_recipe:
          setup:
            - "Operator PENDING (never activated); ACTIVE vehicle+permit queued at head; clock 2026-04-15T10:00:00Z."
          setup_api_calls:
