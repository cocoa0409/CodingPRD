        actor: ProgramManager
        preconditions: []
        side_effects:
          - "referenced segments (or all segments when segment_ids empty) become frozen"
          - "project posture recomputed (FROZEN while any change order is APPROVED)"
      - from: APPROVED
        to: INCORPORATED
        trigger: "POST /api/change-orders/{id}/transition {to: INCORPORATED}"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "incorporation cascade: (1) project.estimated_total_cost_cents += delta_cost_cents, cumulative_delay_days += delta_delay_days;"
          - "(2) provisional_cost_share recomputed for all non-withdrawn participants;"
          - "(3) variance_flag updated per participant; project posture recomputed"
          - "segments unfreeze"
          - "project liquidated_damages_cents recomputed per delay_liquidated_damages"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/change-orders/{id}/transition {to: REJECTED}"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: PRICED
        to: REJECTED
        trigger: "POST /api/change-orders/{id}/transition {to: REJECTED}"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: PROPOSED
