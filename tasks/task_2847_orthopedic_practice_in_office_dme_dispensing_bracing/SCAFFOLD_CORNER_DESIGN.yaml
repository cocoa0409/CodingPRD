            - call: "POST /dme/clinics"
              payload: { name: "North Ortho", state_code: "OH", accreditation_body: "ABC", accreditation_expires_on: "2027-06-30", ioas_supervision_level: "DIRECT", dispensing_specialties: ["HAND"] }
