          assert:
            - "err == 'ERR_DUPLICATE_REPORT' (HTTP 409)"
      - name: activate_with_past_due_billing_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=28]", "errors[ERR_BILLING_NOT_CURRENT]"]
        distinguishing_aspect: "Activation requires billing CURRENT; a subscription in PROVISIONING with a FAILED payment recorded (billing PAST_DUE) is rejected ERR_BILLING_NOT_CURRENT (409)."
        test_recipe:
          setup: ["Senior with kit INSTALLED (appointment completed) and subscription PROVISIONING with one FAILED payment"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_bc: $.data.id } }
