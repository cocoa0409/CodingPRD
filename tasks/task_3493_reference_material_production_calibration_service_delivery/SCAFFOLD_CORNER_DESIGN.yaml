  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_pagination_and_status_filter
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /metrology/material-lots with a status filter returns only matching rows and the fixed envelope pagination fields (limit default 10, offset 0, total_count, has_more false)."
        test_recipe:
          setup: ["program P; lots L1, L2 in SOURCING; L3 driven to VALUE_ASSIGNMENT"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C38", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
              captures: { prog_c38: $.data.id }
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c38}", material_code: "SRM-C38A", matrix_description: "m", total_units_produced: 10 }
              as: ProgramAdmin
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c38}", material_code: "SRM-C38B", matrix_description: "m", total_units_produced: 10 }
              as: ProgramAdmin
            - call: "POST /metrology/material-lots"
              payload: { program_id: "${prog_c38}", material_code: "SRM-C38C", matrix_description: "m", total_units_produced: 10 }
              as: ProgramAdmin
              captures: { lot_c38: $.data.id }
            - call: "POST /metrology/material-lots/${lot_c38}/transitions"
              payload: { to: HOMOGENEITY_TESTING, bottle_means: [10.0, 10.0, 10.0, 10.0], within_bottle_std: 0.5, replicates_per_bottle: 2 }
              as: Metrologist
          trigger:
            - call: "GET /metrology/material-lots"
              payload: { program_id: "${prog_c38}", status: "SOURCING" }
              as: InventoryManager
          assert:
            - "response_type == array; total_count == 2; has_more == false; limit == 10; offset == 0"
            - "both returned rows have status SOURCING and program_id ${prog_c38}"

      - name: error_envelope_shape
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "An error response carries response_type error and data.error_id / data.message, with meta.api_request_id present."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /metrology/material-lots/11111111-2222-4333-8444-555555555555"
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "envelope response_type == error and data.message is a non-empty string; meta.api_request_id present"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: duplicate_program_code_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_PROGRAM_CODE]", "validations[priority=9]"]
        distinguishing_aspect: "Second program with the same program_code is rejected 409 ERR_DUPLICATE_PROGRAM_CODE."
        test_recipe:
          setup: ["program NIST-RM-C39 exists"]
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-C39", name: "P", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
