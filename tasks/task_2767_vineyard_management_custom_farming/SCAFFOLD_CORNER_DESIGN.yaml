      - name: governing_estimate_takes_latest_sample_date_then_latest_created_at
        claim_type: chronological
        grounds:
          - calculations.governing_yield_estimate_selector
          - entities.Block.fields.governing_estimate_tons
          - entities.Block.fields.remaining_estimated_tons
        distinguishing_aspect: "Selection is chronological, never by magnitude: after a CLUSTER_COUNT estimate sampled 2026-07-20 (91.47 t) the block governs at 91.47; filing a lower BERRY_SAMPLE estimate sampled 2026-08-01 (68.97 t) moves governing_estimate_tons DOWN to 68.97; filing a second estimate for the same 2026-08-01 sample_date moves it back to 91.47 on the created_at tie-break."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 (5.0 x 8.0 ft, 12.5 acres, vine_count 13612)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
