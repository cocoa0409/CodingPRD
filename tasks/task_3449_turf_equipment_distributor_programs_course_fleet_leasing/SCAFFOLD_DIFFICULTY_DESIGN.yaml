            - "WarrantyClaim.${cl1}.status == PAID after the full dispute cycle"
            - "WarrantyClaim.${cl1}.payable_total_cents == 62200 after re-approval on full hours"
            - "WarrantyClaim.${cl1}.version == 7 (six OCC-guarded transitions from version 1)"
      - name: appraisal_dispute_revaluation_rounds
        grounds:
          - state_machines.TradeInAppraisal.DISPUTED_to_VALUED
          - state_machines.TradeInAppraisal.VALUED_to_DISPUTED
          - calculations.trade_in_valuation
        distinguishing_aspect: |
          Non-linear cycle on TradeInAppraisal (different entity from the claim
          machine): two full VALUED -> DISPUTED -> VALUED rounds; each revalue
          re-runs both variants and the policy override flips valued_cents between
          3571429 (BOOK) and 2773125 (MARKET) without recreating the appraisal.
        test_recipe:
          setup:
            - "D1 ACTIVE; C1 CLUB; M1; lease L1 in DRAFT; one BOOK appraisal A1 (hours 2200, grade B)"
          setup_api_calls:
            - call: "POST /turf/distributors"
