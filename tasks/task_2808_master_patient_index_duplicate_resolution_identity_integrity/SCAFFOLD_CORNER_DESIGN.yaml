              as: IdentityStewardApprover
              as_user_id: "steward-1"
              captures: { merge_cda_id: $.data.id }
            - call: "PATCH /mpi/downstream-systems/${sys_fire_id}"
              payload: { status: "PAUSED" }
              as: MpiAdmin
