        excluded_because:
          difficulty_instance: non_linear_state_machine / unit_build_and_compliance_dimensions_advance_independently
          rationale: "That instance asserts build_status frozen at FRAME_WELDED while compliance_status advances, then the re-coupling call."
      - name: state_model_certification_machine_is_cyclic
        claim_type: cyclic
        grounds:
          - state_machines.TrailerModel.CERTIFIED_to_IN_ENGINEERING_REVIEW
          - entities.TrailerModel.fields.revision_round
        excluded_because:
          difficulty_instance: non_linear_state_machine / model_certification_cycle_with_revision_round
          rationale: "That instance walks CERTIFIED -> IN_ENGINEERING_REVIEW -> DRAFT -> IN_ENGINEERING_REVIEW -> CERTIFIED and pins revision_round."
      - name: state_warranty_negotiation_loop_has_a_termination_condition
        claim_type: cyclic
        grounds:
