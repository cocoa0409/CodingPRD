            - "${ok_status} == \"RECORDS_PRODUCED\" and ${ok_total} == 400 — the withdrawal was still in INITIATED and remained usable"
            - "GET /cosmetics/distribution-records?withdrawal_id=${wd_id} returns exactly one row"

      - name: recovery_entries_are_bounded_by_the_records_outstanding_units
        claim_type: aggregate_validation
        grounds:
          - validations[priority=55]
          - errors[ERR_RECOVERY_EXCEEDS_OUTSTANDING]
          - calculations.distribution_unit_conservation
        distinguishing_aspect: |
          The bound is the RUNNING per-record outstanding total, not the original units_shipped: after a
          600-unit verified return against a 1000-unit record, a 500-unit entry is refused
          (ERR_RECOVERY_EXCEEDS_OUTSTANDING, 422) even though 500 < 1000, while exactly 400 — the
          remaining outstanding, an inclusive bound — is accepted and drives outstanding to zero.
        test_recipe:
          setup:
            - "one REGISTERED facility, one listing with a single 1000-unit record, an accepted recall, a withdrawal with that record produced, and a 600-unit VERIFIED_RETURN already posted"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example", lot_authorized_units: 5000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-D", consignee_name: "Gulf Coast Retail Group", consignee_class: "RETAIL", ship_date: "2026-08-05T00:00:00Z", delivery_date: "2026-08-08T00:00:00Z", units_shipped: 1000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/recall-actions"
              payload: { initiation_basis: "MANDATORY_ORDER", hazard_class: "CLASS_II" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_id: $.data.id }
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan"
              payload: { corrective_summary: "Retail-level retrieval of lot LOT-D", distribution_depth: "RETAIL" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan-decision"
              payload: { decision: "ACCEPT" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_v: $.data.version }
            - call: "POST /cosmetics/recall-actions/${ra_id}/withdrawals"
              payload: { scope_depth: "RETAIL", expected_recall_action_version: "${ra_v}" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { wd_id: $.data.id }
            - call: "POST /cosmetics/withdrawals/${wd_id}/records-production"
              payload: { distribution_record_ids: ["${rec_id}"] }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "VERIFIED_RETURN", distribution_record_id: "${rec_id}", units: 600 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { out_after_600: $.data.units_outstanding }
          trigger:
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "REPORTED_RETURN", distribution_record_id: "${rec_id}", units: 500 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { err: $.data.error_id }
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "REPORTED_RETURN", distribution_record_id: "${rec_id}", units: 400 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { out_after_400: $.data.units_outstanding }
          assert:
            - "${out_after_600} == 400 — the running outstanding total after the verified return"
            - "${err} == \"ERR_RECOVERY_EXCEEDS_OUTSTANDING\" with HTTP 422 — 500 > 400 outstanding even though 500 < 1000 shipped"
            - "${out_after_400} == 0 — exactly the outstanding balance is allowed (inclusive bound)"
            - "MarketWithdrawal ${wd_id}: verified_recovered_units == 600, reported_recovered_units == 400, outstanding_units_total == 0"
            - "GET /cosmetics/withdrawals/${wd_id}/recovery-entries returns exactly two rows — the rejected 500-unit attempt persisted nothing"

      - name: designation_cap_of_one_blocks_the_second_listing_for_that_person
        claim_type: aggregate_validation
        grounds:
          - validations[priority=53]
          - errors[ERR_DESIGNATION_CAP_EXCEEDED]
          - entities.ResponsiblePerson.fields.active_designation_count
        distinguishing_aspect: |
          The cap counts ACTIVE designations across listings, so a person capped at 1 is refused the
          second listing with ERR_DESIGNATION_CAP_EXCEEDED (422) while a second, differently-capped person
          takes the same payload immediately — proving the ceiling is per-person aggregate state rather
          than a per-request limit.
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson with designation_cap 1 already holding one listing, and a second uncapped-default ResponsiblePerson"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example", designation_cap: 1 }
              as: ResponsiblePersonAgent
              captures: { rp_capped: $.data.id, cap_value: $.data.designation_cap }
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Brightline Compliance LLC", us_address_line: "88 Canal St, Newark NJ 07102", contact_phone: "+1-202-555-0177", contact_email: "rp@brightline.example" }
              as: ResponsiblePersonAgent
              captures: { rp_spare: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_capped}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_capped}"
              captures: { lst_first: $.data.id }
          trigger:
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_capped}", product_name: "Aster Cleansing Gel", category_code: "07A", product_form: "RINSE_OFF", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_capped}"
              captures: { err: $.data.error_id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_spare}", product_name: "Aster Cleansing Gel", category_code: "07A", product_form: "RINSE_OFF", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_spare}"
              captures: { ok_status: $.data.listing_status }
          assert:
            - "${cap_value} == 1 — the explicitly supplied cap overrides the declared default"
            - "${err} == \"ERR_DESIGNATION_CAP_EXCEEDED\" with HTTP 422 — the capped person already holds one active designation"
            - "${ok_status} == \"DRAFT\" — the same payload against the second person is created (201)"
            - "ResponsiblePerson ${rp_capped}.active_designation_count == 1 and status == \"ACTIVE\""
            - "ResponsiblePerson ${rp_spare}.active_designation_count == 1"
            - "GET /cosmetics/listings?facility_id=${fac_id} returns exactly two rows"

      - name: stale_listing_version_is_answered_before_the_same_person_transfer_target
        claim_type: priority_conflict
        grounds:
          - validations[priority=18]
          - validations[priority=49]
          - concurrency_rules.transfer-designation-stale-listing
        excluded_because:
          difficulty_instance: stale_listing_version_outranks_same_person_transfer_target
          rationale: |
            That §1.8 instance constructs exactly this doubly-invalid transfer request — stale
            expected_listing_version AND a responsible_person_id equal to the incumbent — and pins
            ERR_STALE_LISTING_VERSION (412) ahead of ERR_TRANSFER_TARGET_SAME_PERSON, then repairs the
            version to reveal the lower-priority error.

      - name: allergen_gap_is_answered_before_the_designation_cap_at_submit
        claim_type: priority_ordering
        grounds:
          - validations[priority=32]
          - validations[priority=53]
          - errors[ERR_ALLERGEN_DISCLOSURE_INCOMPLETE]
        excluded_because:
          difficulty_instance: allergen_disclosure_gap_outranks_designation_cap_at_submit
          rationale: |
            The §1.8 priority-pair instance already builds a submit request that violates both rules at
            once and pins the numerically lower priority (32) as the reported error, then clears the
            disclosure gap to expose ERR_DESIGNATION_CAP_EXCEEDED.

      - name: distribution_lot_windows_aggregate_against_the_authorized_ceiling
        claim_type: aggregate_validation
        grounds:
          - validations[priority=44]
          - validations[priority=54]
          - errors[ERR_LOT_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: distribution_lot_windows_touch_and_aggregate_against_lot_ceiling
          rationale: |
            The half-open lot-window adjacency (touching endpoints allowed, true overlap rejected with
            ERR_LOT_WINDOW_CONFLICT) and the per-lot unit ceiling at exactly the boundary and one unit
            past it are jointly pinned by that §1.8 resource_temporal_overlap instance.

      - name: same_type_inspection_buffer_is_enforced_across_adjacent_windows
        claim_type: temporal_validation
        grounds:
          - validations[priority=42]
          - validations[priority=43]
          - errors[ERR_INSPECTION_TYPE_BUFFER_VIOLATION]
        excluded_because:
          difficulty_instance: inspection_half_open_windows_allow_adjacency_but_enforce_same_type_buffer
          rationale: |
            That §1.8 instance covers the whole overlap family on one facility — abutting windows of
            different types accepted, genuine overlap rejected, and a same-type window inside the buffer
            rejected — which is the complete temporal-validation claim for inspections.

      - name: parent_facility_posture_gates_listing_submission
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=21]
          - errors[ERR_FACILITY_POSTURE_FROZEN]
          - calculations.facility_compliance_posture
        excluded_because:
          difficulty_instance: listing_submit_gated_by_parent_facility_posture_while_still_registered
          rationale: |
            The §1.8 cross-entity instance shows a still-REGISTERED facility whose FROZEN posture blocks
            submission with ERR_FACILITY_POSTURE_FROZEN and then permits it once the posture recovers,
            distinguishing the posture gate from the registration gate probed above.

      - name: open_recall_blocks_delist_until_the_withdrawal_closes
        claim_type: conditional_validation
        grounds:
          - validations[priority=48]
          - errors[ERR_OPEN_RECALL_BLOCKS_DELIST]
        excluded_because:
          difficulty_instance: delist_gated_by_open_recall_then_permitted_after_effective_closure
          rationale: |
            That §1.8 instance drives the same conditional gate end to end: delist refused while
            open_recall_count is positive, then accepted after the effectiveness check closes the
            withdrawal and the recall together.

  - section: endpoints
    instances:
      - name: responsible_person_create_then_read_round_trips_every_stored_field
        claim_type: standard_crud
        grounds:
          - endpoints[POST /cosmetics/responsible-persons]
          - endpoints[GET /cosmetics/responsible-persons/{id}]
          - entities.ResponsiblePerson
        distinguishing_aspect: |
          The only entity in the domain with a create-then-read pair and no list endpoint: the GET must
          return the four supplied contact fields verbatim plus the derived designation status
          field and active_designation_count, and the read must not mutate anything (identical version on a second
          read).
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example", designation_cap: 3 }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id, v_create: $.data.version }
            - call: "GET /cosmetics/responsible-persons/${rp_id}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { name_read: $.data.legal_name, phone_read: $.data.contact_phone, cap_read: $.data.designation_cap, status_read: $.data.status, count_read: $.data.active_designation_count, v_read: $.data.version }
            - call: "GET /cosmetics/responsible-persons/${rp_id}"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { v_read2: $.data.version }
          assert:
            - "the create returns HTTP 201 with a UUID id and created_at == updated_at"
            - "${name_read} == \"Aster Brands Inc\", ${phone_read} == \"+1-202-555-0110\" and ${cap_read} == 3"
            - "${status_read} == \"DORMANT\" and ${count_read} == 0 — a person with no listings yet"
            - "${v_read} == ${v_create} and ${v_read2} == ${v_create} — reads never bump the version"
            - "both reads succeed for a RegulatoryReviewer and for the owning ResponsiblePersonAgent (shared read scope)"

      - name: records_production_is_atomic_across_three_records
        claim_type: bulk_action
        grounds:
          - endpoints[POST /cosmetics/withdrawals/{id}/records-production]
          - errors[ERR_DISTRIBUTION_RECORD_NOT_FOUND]
          - entities.MarketWithdrawal.fields.shipped_units_total
        distinguishing_aspect: |
          The bulk link is all-or-nothing: a batch of three ids where the last one does not exist links
          NONE of the two valid records and returns ERR_DISTRIBUTION_RECORD_NOT_FOUND (404), leaving the
          withdrawal in INITIATED with shipped_units_total 0. The corrected batch of three then links all
          three at once and sums 400 + 250 + 100 = 750.
        test_recipe:
          setup:
            - "one REGISTERED facility, one listing with three distribution records (400, 250, 100 units), an accepted recall and a withdrawal in INITIATED"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example", lot_authorized_units: 5000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-E", consignee_name: "Gulf Coast Retail Group", consignee_class: "RETAIL", ship_date: "2026-08-05T00:00:00Z", delivery_date: "2026-08-08T00:00:00Z", units_shipped: 400 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { rec1: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-E", consignee_name: "Northway Wholesale", consignee_class: "WHOLESALE", ship_date: "2026-08-06T00:00:00Z", delivery_date: "2026-08-09T00:00:00Z", units_shipped: 250 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { rec2: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-E", consignee_name: "Harbor Drug Mart", consignee_class: "RETAIL", ship_date: "2026-08-07T00:00:00Z", delivery_date: "2026-08-10T00:00:00Z", units_shipped: 100 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { rec3: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/recall-actions"
              payload: { initiation_basis: "MANDATORY_ORDER", hazard_class: "CLASS_I" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_id: $.data.id }
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan"
              payload: { corrective_summary: "Consumer-level retrieval of lot LOT-E", distribution_depth: "CONSUMER" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan-decision"
              payload: { decision: "ACCEPT" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_v: $.data.version }
            - call: "POST /cosmetics/recall-actions/${ra_id}/withdrawals"
              payload: { scope_depth: "CONSUMER", expected_recall_action_version: "${ra_v}" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { wd_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/withdrawals/${wd_id}/records-production"
              payload: { distribution_record_ids: ["${rec1}", "${rec2}", "00000000-0000-4000-8000-000000000fff"] }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { err: $.data.error_id }
            - call: "GET /cosmetics/withdrawals/${wd_id}"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { status_mid: $.data.status, total_mid: $.data.shipped_units_total }
            - call: "POST /cosmetics/withdrawals/${wd_id}/records-production"
              payload: { distribution_record_ids: ["${rec1}", "${rec2}", "${rec3}"] }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { status_final: $.data.status, total_final: $.data.shipped_units_total, out_final: $.data.outstanding_units_total }
          assert:
            - "${err} == \"ERR_DISTRIBUTION_RECORD_NOT_FOUND\" with HTTP 404 for the unknown third id"
            - "${status_mid} == \"INITIATED\" and ${total_mid} == 0 — the two valid ids were NOT partially linked"
            - "GET /cosmetics/distribution-records?withdrawal_id=${wd_id} is empty immediately after the failed batch"
            - "${status_final} == \"RECORDS_PRODUCED\", ${total_final} == 750 and ${out_final} == 750"
            - "GET /cosmetics/distribution-records?withdrawal_id=${wd_id} then returns exactly three rows"

      - name: transfer_relinks_a_draft_listing_and_moves_exactly_one_designation_slot
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /cosmetics/listings/{id}/transfer-responsible-person]
          - entities.ResponsiblePerson.fields.active_designation_count
          - entities.ProductListing.fields.responsible_person_id
        distinguishing_aspect: |
          The link move is conservative and version-guarded: the outgoing person drops to 0 active
          designations (status back to DORMANT) exactly as the incoming person rises to 1, the listing's
          version increments once, and the sum of active designations across both persons is unchanged
          before and after.
        test_recipe:
          setup:
            - "one REGISTERED facility, two ResponsiblePersons, one DRAFT listing designated to the first"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_from: $.data.id }
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Brightline Compliance LLC", us_address_line: "88 Canal St, Newark NJ 07102", contact_phone: "+1-202-555-0177", contact_email: "rp@brightline.example" }
              as: ResponsiblePersonAgent
              captures: { rp_to: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_from}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_from}"
              captures: { lst_id: $.data.id, lst_v: $.data.version }
          trigger:
            - call: "POST /cosmetics/listings/${lst_id}/transfer-responsible-person"
              payload: { responsible_person_id: "${rp_to}", expected_listing_version: "${lst_v}" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_from}"
              captures: { rp_after: $.data.responsible_person_id, v_after: $.data.version }
            - call: "GET /cosmetics/responsible-persons/${rp_from}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { from_count: $.data.active_designation_count, from_status: $.data.status }
            - call: "GET /cosmetics/responsible-persons/${rp_to}"
              payload: {}
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { to_count: $.data.active_designation_count, to_status: $.data.status }
          assert:
            - "${rp_after} == ${rp_to} and ${v_after} == ${lst_v} + 1 — exactly one version bump for the relink"
            - "${from_count} == 0 and ${from_status} == \"DORMANT\" — the outgoing person released its slot"
            - "${to_count} == 1 and ${to_status} == \"ACTIVE\" — the incoming person took exactly one slot"
            - "the total active designations across both persons is 1 before and 1 after the transfer"
            - "ProductListing ${lst_id}.listing_status is still \"DRAFT\" and label_contact_value is unchanged"
            - "GET /cosmetics/listings?responsible_person_id=${rp_to} returns the listing; ?responsible_person_id=${rp_from} returns an empty list"

      - name: clock_endpoint_reports_the_instant_it_replaced
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /cosmetics/_clock/set_current_utc]
          - complexity_profile.deterministic_clock
        distinguishing_aspect: |
          The ops clock returns BOTH the new and the displaced instant, so a chain of two calls must
          report previous_utc equal to the value set by the immediately preceding call — not the seed
          value — and the second call's current_utc must be the one the domain then uses (a subsequent
          received_at at that instant is accepted rather than future-dated).
        test_recipe:
          setup:
            - "empty database with the clock seeded to the declared initial instant"
          setup_api_calls: []
          trigger:
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
              captures: { cur1: $.data.current_utc }
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T12:34:56Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
              captures: { cur2: $.data.current_utc, prev2: $.data.previous_utc }
          assert:
            - "${cur1} == \"2026-08-01T00:00:00Z\""
            - "${cur2} == \"2026-09-15T12:34:56Z\" and ${prev2} == \"2026-08-01T00:00:00Z\" — previous_utc is the displaced value, not the seed"
            - "the endpoint returns a plain object (no id/version envelope) and creates no entity rows"
            - "a subsequent adverse-event create with received_at == \"2026-09-15T12:34:56Z\" is accepted, confirming the clock actually moved"

      - name: compliance_sweep_on_a_quiet_database_returns_all_seven_zero_counts
        claim_type: bulk_action
        grounds:
          - endpoints[POST /cosmetics/_ops/compliance-sweep]
          - complexity_layers.ops_run_checkpoint
        distinguishing_aspect: |
          The sweep must be a pure no-op when nothing is due: a freshly REGISTERED facility with one
          in-window listing and no overdue events yields all seven counters at 0 and a swept_at equal to
          the current clock — and a second call at the same clock repeats the all-zero report rather than
          re-processing or erroring.
        test_recipe:
          setup:
            - "one REGISTERED facility with one DRAFT listing, clock at 2026-08-01T00:00:00Z, nothing due"
          setup_api_calls:
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
