          - calculations.assignment_labor_cost.variants.final
        distinguishing_aspect: "NIGHT_START_HOUR_UTC is 23 and the test is on the inclusive edge: a segment starting at exactly 23:00Z is a night segment, so the 120 realised minutes bill 2000 * 2 * 1.15 == 4600 rather than 4000, and the flag night_differential_applied is persisted on the entry. The provisional for the same watch carries no differential at all."
