      - name: finalize_before_deadline_returns_sell_through_open
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_SELL_THROUGH_OPEN]
        distinguishing_aspect: "Finalize one day before the 90-day sell-through deadline fails ERR_SELL_THROUGH_OPEN; the item stays SELL_THROUGH."
        test_recipe:
          setup: ["Case approved at default clock 2026-09-01 (deadline 2026-11-30); clock advanced only to 2026-11-29"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA18", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA18", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { p_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${p_id}", sku_code: "SKU-VA18", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 10 }, as: PortfolioManager, captures: { i_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases", payload: { item_id: "${i_id}" }, as: PortfolioManager, as_user_id: "pm-proposer-1", captures: { c_id: $.data.id } }
            - { call: "POST /portfolio/rationalization-cases/${c_id}/decide", payload: { decision: "APPROVE" }, as: PortfolioManager, as_user_id: "pm-decider-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-29T00:00:00Z" }, as: PortfolioManager }
          trigger:
            - { call: "POST /portfolio/rationalization-cases/${c_id}/finalize", payload: {}, as: PortfolioManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SELL_THROUGH_OPEN and http status 409 (2026-11-29 < 2026-11-30)"
            - "item remains SELL_THROUGH and case remains EXECUTING"
      - name: transfer_same_plant_and_source_mismatch_referential_errors
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_SAME_PLANT]
          - errors[ERR_SOURCE_PLANT_MISMATCH]
        distinguishing_aspect: "Transfer referential integrity: target == source fails ERR_SAME_PLANT; source != item.primary_plant_id fails ERR_SOURCE_PLANT_MISMATCH — pinned in that order within priority 12."
        test_recipe:
          setup: ["Item I LISTED at plant S; plants T and T2 OPERATING"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA19", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA19-S", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { ps_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA19-T", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pt_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA19-T2", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pt2_id: $.data.id } }
            - { call: "POST /portfolio/items", payload: { brand_id: "${b_id}", primary_plant_id: "${ps_id}", sku_code: "SKU-VA19", annual_units: 4000, unit_net_revenue_cents: 2000, unit_cost_cents: 1700, units_on_hand: 0 }, as: PortfolioManager, captures: { i_id: $.data.id } }
          trigger:
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${i_id}", source_plant_id: "${ps_id}", target_plant_id: "${ps_id}" }, as: SupplyChainPlanner, captures: { err1: $.data.error_id } }
            - { call: "POST /portfolio/product-transfers", payload: { item_id: "${i_id}", source_plant_id: "${pt_id}", target_plant_id: "${pt2_id}" }, as: SupplyChainPlanner, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_SAME_PLANT (target == source)"
            - "err2 == ERR_SOURCE_PLANT_MISMATCH (source ${pt_id} != item.primary_plant_id ${ps_id})"
            - "both http 422 and no transfer persisted for the item"

  - section: endpoints
    instances:
