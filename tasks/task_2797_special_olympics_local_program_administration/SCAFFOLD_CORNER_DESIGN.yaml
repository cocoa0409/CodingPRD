          rationale: "ERR_UNDERSIZED_DIVISION_PRESENT is triggered by the §1.8 priority instance, which locks a season carrying a surviving UNDERSIZED division once the posture gate above it has been cleared. Triggering it again here would add no distinct behaviour."

