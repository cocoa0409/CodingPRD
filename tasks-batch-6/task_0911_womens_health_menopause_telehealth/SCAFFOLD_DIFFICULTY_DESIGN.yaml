              as: Patient
              as_user_id: "${pat_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /visits/${v1_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /prescriptions"
              payload: { visit_id: "${v1_id}", hrt_type: "ESTROGEN_PATCH", days_supply_per_fill: 20, total_refills_authorized: 2, lab_required_before_refill: false, coverage_days: 20, refill_price_cents: 15000 }
              as: Provider
