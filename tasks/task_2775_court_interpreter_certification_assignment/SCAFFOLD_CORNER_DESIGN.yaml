  # =========================================================================
  - section: Calculations
    instances:

      - name: priority_score_clamps_at_one_hundred_and_class_b_floor_is_inclusive_at_fifty_five
        claim_type: Correct Result
        grounds: [calculations.hearing_priority_score, calculations.hearing_priority_score.constants, entities.Hearing.priority_class]
        distinguishing_aspect: "Three hearings created at the same logical clock exercise the two clamps and the class ladder: 50+25+15+20 = 110 clamps to 100 (class A), 30+25+0+0 = 55 lands exactly on CLASS_B_FLOOR (class B), and 40+0+0+14 = 54 sits one point under it (class C)."
        test_recipe:
          setup:
            - "Logical clock at its fixed startup default 2026-08-01T00:00:00Z, so lead_time_days is deterministic for every hearing below."
            - "Languages mix (RARE, RARITY_BONUS 15) and spa (DESIGNATED, RARITY_BONUS 0); courthouse CH_MAIN."
            - "No interpreter, credential or rate schedule is needed: the score is frozen at hearing creation and reads only the hearing and its Language row."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "mix", name: "Mixteco Bajo", tier_class: "RARE", oral_exam_available: false, telephonic_vendor_available: true }
              as: ProgramAdmin
              captures: { lang_mix: "$.data.id" }
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000 }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
          trigger:
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_mix}", case_number: "CR-2026-1001", hearing_type: "ARRAIGNMENT", in_custody: true, scheduled_start: "2026-08-01T09:00:00.000Z", scheduled_end: "2026-08-01T10:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { hA: "$.data.id", hA_score: "$.data.priority_score", hA_class: "$.data.priority_class", hA_lead: "$.data.lead_time_days" }
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CR-2026-1002", hearing_type: "PLEA", in_custody: true, scheduled_start: "2026-09-15T09:00:00.000Z", scheduled_end: "2026-09-15T10:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { hB: "$.data.id", hB_score: "$.data.priority_score", hB_class: "$.data.priority_class", hB_lead: "$.data.lead_time_days" }
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CR-2026-1003", hearing_type: "TRIAL", in_custody: false, scheduled_start: "2026-08-04T09:00:00.000Z", scheduled_end: "2026-08-04T12:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
              captures: { hC: "$.data.id", hC_score: "$.data.priority_score", hC_class: "$.data.priority_class", hC_lead: "$.data.lead_time_days" }
          assert:
            - "${hA_lead} == 0 (9 hours of lead time floors to 0 whole days) so urgency == 20, and ${hA_score} == 100 with ${hA_class} == A — the raw sum 110 is clamped by min(100, ...)"
            - "${hB_lead} == 45 so urgency == max(0, 20 - 90) == 0, and ${hB_score} == 55 with ${hB_class} == B — exactly CLASS_B_FLOOR is class B, not C"
            - "${hC_lead} == 3 so urgency == 14, and ${hC_score} == 54 with ${hC_class} == C — one point under the floor drops a class"
            - "all three hearings return status == SCHEDULED, continuance_count == 0, continuance_reason_code == null"

      - name: pay_claim_pins_the_rate_schedule_effective_on_the_hearing_date_not_the_newest_one
        claim_type: Input Set Filtering
        grounds: [calculations.assignment_pay.input_set, "validations[priority=34]", entities.PayClaim.rate_schedule_id, "endpoints[GET /rate-schedules]"]
        distinguishing_aspect: "Two schedules govern two hearing dates: the August hearing bills at RS1 (8750/h) and the September hearing at RS2 (9000/h), and publishing RS2 after RS1's claim exists never rewrites that claim — the schedule is selected by the hearing's scheduled_start date, not by the logical clock or by recency."
