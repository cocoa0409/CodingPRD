      - name: discovery_window_exact_close_boundary
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "errors[ERR_DISCOVERY_WINDOW_CLOSED]", entities.RateCase.fields.discovery_close_at]
        distinguishing_aspect: "The discovery window closes on a strict inequality: issuing at exactly discovery_close_at (2026-11-29T00:00:00Z) is allowed; one second later fails ERR_DISCOVERY_WINDOW_CLOSED."
