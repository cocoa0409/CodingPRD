            - { call: "POST /estimates/${e2}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { j2: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${j1}", file_uri: "s3://g1.pdf" }, as: PrepressOperator, captures: { p1: $.data.id } }
            - { call: "POST /proofs", payload: { job_id: "${j2}", file_uri: "s3://g2.pdf" }, as: PrepressOperator, captures: { p2: $.data.id } }
            - { call: "POST /proofs/${p1}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /proofs/${p2}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /gang-runs", payload: { paper_stock_id: "${stock}", press_type: "WEB", anchor_due_date: "2026-08-20T00:00:00Z" }, as: PressScheduler, captures: { gang: $.data.id, gv: $.data.version } }
            - { call: "POST /gang-runs/${gang}/members", payload: { job_id: "${j1}", expected_gang_run_version: "${gv}" }, as: PressScheduler, captures: { gv2: $.data.version } }
