            - { call: "POST /api/planting-plans/${p2}/open-harvest", payload: {}, as: FarmManager }
            - { call: "POST /api/kilns", payload: { name: "K1" }, as: FarmManager, captures: { k_id: $.data.id } }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p1}", wet_lbs: 1875 }, as: FarmManager, captures: { lot_a: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_a}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T08:00:00Z", kiln_window_end: "2026-08-20T12:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_a}/finish-drying", payload: { dried_lbs: 500 }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_a}/release", payload: {}, as: FarmManager }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p2}", wet_lbs: 1875 }, as: FarmManager, captures: { lot_b: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_b}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T12:30:00Z", kiln_window_end: "2026-08-20T16:00:00Z" }, as: FarmManager }
            - { call: "POST /api/harvest-lots/${lot_b}/finish-drying", payload: { dried_lbs: 500 }, as: FarmManager }
          trigger:
            - { call: "POST /api/pellet-lots", payload: { source_lot_ids: ["${lot_a}", "${lot_b}"], storage_room: "R1" }, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_LOT_NOT_DRIED (referential outranks the mixed-variety constraint, which also fails)"

