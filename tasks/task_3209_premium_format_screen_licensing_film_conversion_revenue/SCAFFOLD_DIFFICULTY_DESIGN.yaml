      - name: safety_beats_fiscal_on_return_to_service
        grounds:
          - validations.priority_8_safety
          - validations.priority_9_fiscal
          - errors.ERR_UNRESOLVED_CRITICAL_ALERTS
        distinguishing_aspect: |
          Pair: business_safety (priority 8) vs business_fiscal (priority 9).
          Return-to-service on a DEGRADED auditorium with unresolved CRITICAL
          alerts must surface the safety error even when other capacity /
          fiscal checks would also fail.
        test_recipe:
          setup:
            - "Standard setup with OPERATING auditorium and CONFIRMED slot. Raise a CRITICAL QAAlert so auditorium → DEGRADED and slot → SUSPENDED."
            - "Do NOT acknowledge or resolve the alert."
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
