  - rule_id: compensating_invariant
    instances:

      - name: site_headcount_identity_survives_select_then_rescind
        grounds:
          - calculations.site_headcount_identity
          - state_machines.Selection.PROPOSED_to_SELECTED
          - state_machines.Selection.SELECTED_to_RESCINDED
          - entities.Site.fields.active_headcount
          - entities.Site.fields.roster_count
        distinguishing_aspect: |
          The conserved quantity is headcount, pinned as
          Site.roster_count == active_headcount + pending_separation_count +
          separated_count. Selecting Alice moves one unit from active to pending
          (3/0/0 -> 2/1/0) and rescinding moves exactly that unit back (-> 3/0/0), with
          roster_count fixed at 3 throughout and Employee.separation_date returned to null.
        test_recipe:
          setup:
            - "A TX site with three full-time employees and no WarnRule configured."
            - "A plan with LOCKED criteria and one PROPOSED selection for Alice dated 2026-12-01."
