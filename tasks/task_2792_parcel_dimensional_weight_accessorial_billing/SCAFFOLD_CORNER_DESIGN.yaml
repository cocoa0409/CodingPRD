            - "The second issue returns HTTP 409 with ${err} == ERR_INVOICE_NOT_IN_STATE"
            - "${st2} == ISSUED, ${v2} == ${v1} and ${issued2} == ${issued1} — the rejected replay changed nothing"
            - "Invoice.${inv}.dispute_deadline_utc is unchanged by the second call"
            - "${open_charges} == 2660, NOT 5320 — the ledger was credited exactly once"

      - name: voiding_an_issued_invoice_cascades_down_to_lines_shipments_and_adjustments
        claim_type: cascade_down
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.Shipment.billing_status.BILLED_to_UNBILLED
          - state_machines.BillingAdjustment.PROPOSED_to_REJECTED
        distinguishing_aspect: |
          One void request fires four cascade hops in a single transaction: the line is
          voided, its shipment returns to UNBILLED, the shipper's counters and
          open_charges_cents are recomputed, and the still-PROPOSED adjustment on that line
          is force-REJECTED — nothing is left pending against a void invoice.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
            - "Parcel 1Z-Z-0001 (12 x 10 x 8 in, 6.0 lb, zone 2) is delivered and swept onto INV1 (one line, 2660), which is ISSUED, so open_charges_cents == 2660."
            - "BillingOps user billing.one has proposed a -500 MANUAL adjustment against that line; it is still PROPOSED."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-Z-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id }
            - call: "POST /shipments/${p}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: BillingOps
              captures: { inv_v: $.data.version }
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}" }
              as: BillingOps
              captures: { line: "$.data[0].id" }
            - call: "POST /billing-adjustments"
              payload: { invoice_line_id: "${line}", reason: "MANUAL", delta_cents: -500, expected_invoice_version: "${inv_v}" }
              as: BillingOps
              as_user_id: "billing.one"
              captures: { adj: $.data.id }
          trigger:
            - call: "POST /invoices/${inv}/void"
              payload: {}
              as: BillingOps
              captures: { inv_status: $.data.status }
            - call: "GET /invoice-lines/${line}"
              payload: {}
              as: BillingOps
              captures: { voided: $.data.voided }
            - call: "GET /shipments/${p}"
              payload: {}
              as: BillingOps
              captures: { bill_status: $.data.billing_status }
            - call: "GET /billing-adjustments/${adj}"
              payload: {}
              as: BillingOps
              captures: { adj_status: $.data.status }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: BillingOps
              captures: { unbilled: $.data.unbilled_shipment_count, billed: $.data.billed_shipment_count, open_charges: $.data.open_charges_cents }
          assert:
            - "${inv_status} == VOID (hop 0) and Invoice.${inv}.pending_adjustment_count == 0 with has_pending_adjustments == false"
            - "${voided} == true (hop 1) — the line survives as a record but is excluded from every total"
            - "${bill_status} == UNBILLED (hop 2) — the parcel is sweepable again"
            - "${unbilled} == 1 and ${billed} == 0 (hop 3)"
            - "${open_charges} == 0 — voiding an ISSUED invoice releases its net_amount_cents from the ledger"
            - "${adj_status} == REJECTED (hop 4) with applied_by_user_id null and applied_at null — the PROPOSED adjustment was force-rejected by the cascade, not applied"
            - "ShipperAccount.${sh}.credit_balance_cents == 0 — a rejected adjustment moves no money"

      - name: activating_a_successor_contract_supersedes_and_truncates_its_predecessor
        claim_type: cross_entity
        grounds:
          - state_machines.RateContract.DRAFT_to_ACTIVE
          - state_machines.RateContract.ACTIVE_to_SUPERSEDED
          - entities.ShipperAccount.fields.account_number
        distinguishing_aspect: |
          Activating C2 with supersedes_contract_id C1 reaches across three entities in one
          request: C2 becomes ACTIVE, C1 becomes SUPERSEDED with its effective_to truncated
          from 2026-12-31 to 2026-06-30 (the day before C2 starts), and the ShipperAccount's
          version is bumped so any client holding the stale contract view is rejected next
          time.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with contract C1 covering [2026-01-01, 2026-12-31] already ACTIVE."
            - "Contract C2 covering [2026-07-01, 2027-06-30] has been drafted with supersedes_contract_id == C1; the overlap check exempts the superseded target, so the draft was accepted."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-07-01"
                effective_to: "2027-06-30"
                dim_divisor: 166
                min_charge_cents: 1295
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 400}, {zone: 2, min_lbs: 21, max_lbs: 9999, cents_per_lb: 360}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 600}]
                supersedes_contract_id: "${c1}"
              as: CarrierAdmin
              captures: { c2: $.data.id }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: CarrierAdmin
              captures: { sh_v2: $.data.version }
          trigger:
            - call: "POST /rate-contracts/${c2}/activate"
              payload: { expected_shipper_account_version: "${sh_v2}" }
              as: CarrierAdmin
              captures: { c2_status: $.data.status }
            - call: "GET /rate-contracts/${c1}"
              payload: {}
              as: CarrierAdmin
              captures: { c1_status: $.data.status, c1_to: $.data.effective_to }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: CarrierAdmin
              captures: { sh_v3: $.data.version }
            - call: "GET /rate-contracts"
              payload: { shipper_id: "${sh}", status: "ACTIVE" }
              as: CarrierAdmin
          assert:
            - "${c2_status} == ACTIVE with a non-null activated_at equal to the logical clock 2026-08-01T00:00:00.000Z"
            - "${c1_status} == SUPERSEDED (hop 1) and ${c1_to} == 2026-06-30, truncated from 2026-12-31 to the day before C2's effective_from"
            - "RateContract.${c1}.version incremented by 1 as part of the same request, and so did RateContract.${c2}.version"
            - "${sh_v3} == ${sh_v2} + 1 (hop 2) — the shipper version moved because a superseded contract's dates changed"
            - "GET /rate-contracts with status ACTIVE returns total_count == 1 holding only ${c2} — the shipper never has two overlapping ACTIVE contracts"
            - "GET /rate-contracts with supersedes_contract_id ${c1} returns total_count == 1 holding ${c2}"

      - name: the_billing_sweep_keeps_the_shipper_ledger_in_lockstep
        claim_type: ledger_sync
        grounds:
          - state_machines.Shipment.billing_status.UNBILLED_to_BILLED
          - state_machines.Invoice.OPEN_to_ISSUED
          - entities.ShipperAccount.fields.open_charges_cents
        distinguishing_aspect: |
          The shipper's aggregates move only when the state machines move: induction sets
          unbilled 2 / billed 0, the sweep flips both parcels to BILLED (unbilled 0 / billed
          2) while open_charges_cents stays 0 because the invoice is still OPEN, and only the
          issue transition pushes 5320 into open_charges_cents.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
            - "Two parcels 1Z-G-0001 and 1Z-G-0002 (12 x 10 x 8 in, 6.0 lb, zone 2, transportation 2660 each) are inducted on 2026-08-01 and both delivered."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-G-0001", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p1: $.data.id }
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-G-0002", zone: 2, residential_declared: false, declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p2: $.data.id }
            - call: "POST /shipments/${p1}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /shipments/${p2}/deliver"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: BillingOps
              captures: { total_before: $.data.total_shipment_count, unbilled_before: $.data.unbilled_shipment_count, billed_before: $.data.billed_shipment_count, open_before: $.data.open_charges_cents }
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingOps
              captures: { inv: $.data.id, net: $.data.net_amount_cents }
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: BillingOps
              captures: { unbilled_mid: $.data.unbilled_shipment_count, billed_mid: $.data.billed_shipment_count, open_mid: $.data.open_charges_cents }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: BillingOps
            - call: "GET /shipper-accounts/${sh}"
              payload: {}
              as: BillingOps
              captures: { unbilled_after: $.data.unbilled_shipment_count, billed_after: $.data.billed_shipment_count, open_after: $.data.open_charges_cents }
          assert:
            - "${total_before} == 2, ${unbilled_before} == 2, ${billed_before} == 0 and ${open_before} == 0"
            - "The sweep returns line_count == 2, transportation_subtotal_cents == 5320, accessorial_subtotal_cents == 0, tier_discount_bps == 0 and ${net} == 5320"
            - "Both Shipment.${p1}.billing_status and Shipment.${p2}.billing_status == BILLED"
            - "${unbilled_mid} == 0 and ${billed_mid} == 2 — the counters moved with the shipments, in the same request"
            - "${open_mid} == 0 — an OPEN invoice is not yet a receivable"
            - "${open_after} == 5320 while ${unbilled_after} == 0 and ${billed_after} == 2 — only the issue transition touches open_charges_cents"
            - "ShipperAccount.${sh}.total_shipment_count is still 2 throughout — billing never changes the total"

      - name: a_manual_reweigh_verifies_the_measurement_without_minting_an_adjustment
        claim_type: side_effect_execution
        grounds:
          - state_machines.Shipment.measurement_status.SCANNED_to_VERIFIED
          - calculations.billing_reconciliation_branch
          - validations[priority=44]  # ERR_LINE_ALREADY_FROZEN
        distinguishing_aspect: |
          A MANUAL_REWEIGH after the invoice is issued deliberately does NOT create a
          BillingAdjustment: the frozen line stays at 35380 and the preview jumps to 65875,
          so the reweigh feeds dispute review only — the divergence between preview and
          frozen line is the evidence, not an automatic credit.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and ServiceLevel EXPRESS."
            - "Parcel 1Z-M-0001 declared 40 x 20 x 20 in at 45.0 lb, zone 2: cube 16000, dim weight 116 lb, billable 116 lb DIMENSIONAL at 305 -> 35380."
            - "It was scanned once WITHIN_TOLERANCE, delivered, swept onto INV1 and the invoice was ISSUED, so the line is frozen at 35380."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-M-0001", zone: 2, residential_declared: false, declared_length_in: 40, declared_width_in: 20, declared_height_in: 20, declared_weight_lbs: 45.0 }
              as: CarrierOps
              captures: { p: $.data.id, p_v1: $.data.version }
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "AUTOMATED_DWS", scanned_length_in: 40, scanned_width_in: 20, scanned_height_in: 20, scanned_weight_lbs: 45.0, expected_shipment_version: "${p_v1}" }
              as: CarrierOps
            - call: "POST /shipments/${p}/deliver"
              payload: {}
              as: CarrierOps
            - call: "POST /invoices"
              payload: { shipper_id: "${sh}", period_start: "2026-08-01", period_end: "2026-08-01" }
              as: BillingOps
              captures: { inv: $.data.id }
            - call: "POST /invoices/${inv}/issue"
              payload: {}
              as: BillingOps
            - call: "GET /invoice-lines"
              payload: { invoice_id: "${inv}" }
              as: BillingOps
              captures: { line: "$.data[0].id" }
            - call: "GET /shipments/${p}"
              payload: {}
              as: CarrierOps
              captures: { p_v2: $.data.version }
          trigger:
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "MANUAL_REWEIGH", scanned_length_in: 50, scanned_width_in: 22, scanned_height_in: 22, scanned_weight_lbs: 47.0, expected_shipment_version: "${p_v2}" }
              as: CarrierOps
              captures: { scan2: $.data.id }
            - call: "GET /shipments/${p}"
              payload: {}
              as: BillingOps
              captures: { ms: $.data.measurement_status, bw: $.data.billable_weight_lbs }
            - call: "GET /invoice-lines/${line}"
              payload: {}
              as: BillingOps
              captures: { frozen_total: $.data.line_total_cents }
            - call: "GET /shipments/${p}/billing-preview"
              payload: {}
              as: BillingOps
              captures: { preview_total: $.data.line_total_cents }
            - call: "GET /billing-adjustments"
              payload: { invoice_line_id: "${line}" }
              as: BillingOps
          assert:
            - "${ms} == VERIFIED and ${bw} == 175 (cube 50 x 22 x 22 == 24200, ceil(24200 / 139) == 175, which beats the 47 lb scale weight)"
            - "GET /shipments/${p}/accessorials shows one ASSESSED AUTO OVERSIZE charge (longest 50 plus girth 2 x (22 + 22) == 138 > 130), amount_cents 12500"
            - "${preview_total} == 65875 (transportation 175 x 305 == 53375 plus OVERSIZE 12500)"
            - "${frozen_total} == 35380 — the issued line is frozen and the reweigh did not reprice it"
            - "GET /billing-adjustments with invoice_line_id ${line} returns total_count == 0 — a MANUAL_REWEIGH never auto-creates money movement"
            - "Invoice.${inv}.status is still ISSUED with net_amount_cents 35380 and pending_adjustment_count 0"

      - name: shipment_measurement_axis_recovers_while_movement_axis_advances
        claim_type: parallel
        excluded_because:
          difficulty_instance: shipment_measurement_axis_recovers_while_movement_axis_advances
          rationale: |
            The §1.8 non_linear_state_machine instance already drives the measurement axis
            PENDING_SCAN -> TOLERANCE_FLAGGED -> SCANNED -> VERIFIED while the movement axis
            independently advances IN_TRANSIT -> DELIVERED, asserting that neither axis
            constrains the other and that billing_status stays UNBILLED throughout. A second
            parallel-axis corner here would duplicate that walk exactly.

      - name: reversing_adjustment_pair_restores_the_money_invariant
        claim_type: compensation
        excluded_because:
          difficulty_instance: reversing_adjustment_pair_restores_the_money_invariant_through_a_zero_net_invoice
          rationale: |
            The §1.8 compensating_invariant instance already applies a credit and its exact
            debit mirror to one line, then asserts that InvoiceLine.line_total_cents,
            Invoice.net_amount_cents and ShipperAccount.credit_balance_cents all return to
            their pre-adjustment values while both APPLIED adjustment rows survive. That is
            the compensation claim in full.

      - name: approved_guarantee_claim_cascades_to_refunded_only_after_release
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: approved_guarantee_claim_cascades_to_refunded_only_after_release
          rationale: |
            The §1.8 transitive_cascade instance already proves that adjudicating a claim
            APPROVED leaves it APPROVED with refund_cents 0 until the guarded
            PROPOSED -> APPLIED release fires, and that the reject branch instead drives
            APPROVED -> DENIED with refund_cents still 0. Both guarded edges out of APPROVED
            are covered there.

  # =====================================================================
  # SECTION 3 — CALCULATIONS (§1.4)
  # =====================================================================
  - section: calculations
    instances:
      - name: an_extended_delivery_area_prices_at_its_own_class_rate
        claim_type: correct_result
        grounds:
          - calculations.accessorial_assessment
          - calculations.transportation_charge
          - entities.Shipment.fields.delivery_area_class
        distinguishing_aspect: |
          DELIVERY_AREA is the one accessorial whose rate comes from a class table rather
          than a single default: an EXTENDED parcel is charged 650 (not the DAS 425 and not
          the 0 of class NONE), so the line total is 2660 + 650 == 3310.
        test_recipe:
          setup:
            - "SH-2001 is ACTIVE with ACTIVE contract C1 (divisor 139, min charge 1195, zone-2 rows 380/340/305) and NO accessorial_rate_overrides, so the class table governs."
            - "ServiceLevel EXPRESS exists."
            - "Parcel 1Z-A-0001 is 12 x 10 x 8 in at 6.0 lb, zone 2, non-residential, delivery_area_class EXTENDED: cube 960, dim weight 7, billable 7 DIMENSIONAL at 380 -> 2660."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /service-levels"
              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
          trigger:
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-A-0001", zone: 2, residential_declared: false, delivery_area_class: "EXTENDED", declared_length_in: 12, declared_width_in: 10, declared_height_in: 8, declared_weight_lbs: 6.0 }
              as: CarrierOps
              captures: { p: $.data.id, acc: $.data.accessorial_total_cents }
