              payload: { member_id: "${rita_id}", season_year: 2026, billable_months: 4, due_at: "2026-09-01T00:00:00Z", locker_requested: true }
              as: ClubAdmin
              captures: { invoice_id: $.data.id }
          trigger:
            - call: "POST /boathouse/dues-invoices/${invoice_id}/true-up"
              payload: { note: "season close on actual usage" }
              as: ClubAdmin
          assert:
            - "Member.${rita_id}.logged_session_count == 7 (only the seven RETURNED sessions count)"
            - "DuesInvoice.${invoice_id}.assessed_cents == 36500 (trueup_actual: max(4500*7, round_half_up(61500*0.40)) + 5000 == max(31500, 24600) + 5000)"
            - "DuesInvoice.${invoice_id}.variant_basis == TRUEUP"
            - "DuesInvoice.${invoice_id}.trueup_cents == 8916 (36500 minus the 27584 the provisional_seasonal variant had assessed at creation)"
            - "DuesInvoice.${invoice_id}.status == ISSUED (a true-up does not settle the invoice)"
            - "Member.${rita_id}.dues_balance_cents == 36500"
            - "Member.${rita_id}.boathouse_access_level == SUPERVISED"

      - name: shell_condition_index_conservative_vs_optimistic_divergence
        grounds:
          - calculations.shell_condition_index
          - entities.Shell.fields.condition_index_conservative
          - entities.Shell.fields.condition_index_optimistic
          - entities.DamageReport.fields.severity_points
          - state_machines.DamageReport.REPAIR_SCHEDULED_to_VERIFIED
        distinguishing_aspect: |
          The second dual variant sits in a different entity domain — condition scoring on Shell,
          not money — and the two variants differ by input-set membership rather than by formula
          shape: conservative retains VERIFIED reports at VERIFIED_RESIDUAL_FACTOR 0.25 while
          optimistic drops them entirely, so one identical report history yields 90 conservative
          against 94 optimistic on the same row.
        test_recipe:
          setup:
            - "one 1X hull, one reporting member (Rita) and one member acting as EquipmentManager (never the reporter, so the self-triage bar is respected)"
            - "a MAJOR report filed at clock 2026-05-04T00:00:00Z, triaged to REPAIR and scheduled into BAY-A for 2026-05-05T08:00:00Z..12:00:00Z"
            - "a MINOR report filed at clock 2026-07-02T00:00:00Z and left in TRIAGED"
            - "clock advanced to 2026-08-01T00:00:00Z so the MAJOR report is 89 days old (2 decay periods) and the MINOR report is 30 days old (1 decay period)"
          setup_api_calls:
            - call: "POST /boathouse/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "RECREATIONAL", body_weight_kg: 70.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { rita_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Enid Boatman", tier: "RECREATIONAL", body_weight_kg: 75.0, club_roles: ["EQUIPMENT_MANAGER"] }
              as: ClubAdmin
              captures: { equip_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Heron", boat_class: "1X", hull_weight_kg: 14.5, home_bay: "BAY-1" }
              as: ClubAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /boathouse/damage-reports"
              payload: { shell_id: "${shell_id}", reported_by_member_id: "${rita_id}", severity: "MAJOR", narrative: "cracked rib at seat 1" }
              as: Member
              as_user_id: "${rita_id}"
              captures: { major_report_id: $.data.id }
            - call: "POST /boathouse/damage-reports/${major_report_id}/triage"
              payload: { disposition: "REPAIR" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/damage-reports/${major_report_id}/schedule-repair"
              payload: { assigned_repair_bay: "BAY-A", repair_window_start_at: "2026-05-05T08:00:00Z", repair_window_end_at: "2026-05-05T12:00:00Z" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /boathouse/damage-reports"
              payload: { shell_id: "${shell_id}", reported_by_member_id: "${rita_id}", severity: "MINOR", narrative: "scuffed bow ball" }
              as: Member
              as_user_id: "${rita_id}"
              captures: { minor_report_id: $.data.id }
            - call: "POST /boathouse/damage-reports/${minor_report_id}/triage"
              payload: { disposition: "REPAIR" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
            - call: "POST /boathouse/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /boathouse/damage-reports/${major_report_id}/verify-repair"
              payload: { note: "rib laminated and faired" }
              as: EquipmentManager
              as_user_id: "${equip_id}"
          assert:
            - "DamageReport.${major_report_id}.status == VERIFIED"
            - "DamageReport.${major_report_id}.severity_points == 17.0 (18 - 0.5 * floor(89/30))"
            - "DamageReport.${minor_report_id}.severity_points == 5.5 (6 - 0.5 * floor(30/30))"
            - "Shell.${shell_id}.condition_index_conservative == 90 (100 - round_half_up(17.0 * 0.25 + 5.5) == 100 - round_half_up(9.75))"
            - "Shell.${shell_id}.condition_index_optimistic == 94 (100 - round_half_up(5.5), the VERIFIED report excluded from the input set)"
            - "Shell.${shell_id}.condition_index_conservative != Shell.${shell_id}.condition_index_optimistic"
            - "Shell.${shell_id}.status == AVAILABLE"

  - rule_id: combinatorial_formula
    instances:
      - name: dues_per_component_rounding_order_pinned_mode_b
        grounds:
          - calculations.dues_assessment
          - entities.DuesInvoice.fields.assessed_cents
          - entities.DuesInvoice.fields.billable_months
          - entities.DuesInvoice.fields.locker_requested
          - entities.Member.fields.dues_balance_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order decides the cent: the scaffold pins
          round-each-component-then-sum, so RECREATIONAL with billable_months 4 and a locker
          assesses 20500 + 4167 + 2917 == 27584, one cent above the 27583 that sum-the-three-
          unrounded-components-then-round-once would produce.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default"
            - "one RECREATIONAL member with no invoices and no logged sessions"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Rita Rower", tier: "RECREATIONAL", body_weight_kg: 70.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { rita_id: $.data.id }
          trigger:
            - call: "POST /boathouse/dues-invoices"
              payload: { member_id: "${rita_id}", season_year: 2026, billable_months: 4, due_at: "2026-09-01T00:00:00Z", locker_requested: true }
              as: ClubAdmin
              captures: { invoice_id: $.data.id }
          assert:
            - "DuesInvoice.${invoice_id}.assessed_cents == 27584"
            - "27584 decomposes as round_half_up(61500 * 4/12) == 20500 plus round_half_up(12500 * 4/12) == 4167 plus round_half_up(8750 * 4/12) == 2917"
            - "DuesInvoice.${invoice_id}.assessed_cents != 27583, the value the rejected sum-then-round order yields"
            - "DuesInvoice.${invoice_id}.variant_basis == PROVISIONAL"
            - "DuesInvoice.${invoice_id}.paid_cents == 0 and DuesInvoice.${invoice_id}.trueup_cents == null"
            - "Member.${rita_id}.dues_balance_cents == 27584"

      - name: entry_fee_late_pct_keyed_on_presubtotal_mode_c
        grounds:
          - calculations.regatta_entry_fee
          - entities.RegattaEntry.fields.base_fee_cents
          - entities.RegattaEntry.fields.transport_levy_cents
          - entities.RegattaEntry.fields.late_fee_cents
          - entities.RegattaEntry.fields.total_fee_cents
          - entities.Regatta.fields.net_fee_cents
          - state_machines.RegattaEntry.LINEUP_DECLARED_to_SUBMITTED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order: the late-fee
          percentage is keyed on the pre-late-fee levy subtotal (23500 -> 0.10 -> 2350 -> total
          25850), not on total_fee_cents, whose self-consistent fixed point would be 0.15 ->
          3525 -> 27025.
        test_recipe:
          setup:
            - "one COMPETITIVE coach with a valid coach certification, one certified coxswain, four rowers with current swim tests"
            - "one 4+ hull with tier_restriction ANY and condition_index_conservative 100"
            - "one AWAY regatta, entry_deadline_at 2026-08-05T00:00:00Z, still OPEN_FOR_ENTRY"
            - "one RegattaEntry in LINEUP_DECLARED with all five seats declared"
            - "logical clock moved to 2026-08-06T09:00:00Z, i.e. after the entry deadline"
          setup_api_calls:
            - call: "POST /boathouse/members"
              payload: { full_name: "Cora Coach", tier: "COMPETITIVE", body_weight_kg: 78.0, club_roles: ["COACH"], swim_test_passed_on: "2026-04-01T00:00:00Z", coach_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Kip Cox", tier: "COMPETITIVE", body_weight_kg: 52.0, club_roles: ["COXSWAIN"], swim_test_passed_on: "2026-04-01T00:00:00Z", coxswain_cert_expires_at: "2027-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { cox_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Row One", tier: "COMPETITIVE", body_weight_kg: 82.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Row Two", tier: "COMPETITIVE", body_weight_kg: 83.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Row Three", tier: "COMPETITIVE", body_weight_kg: 84.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { r3_id: $.data.id }
            - call: "POST /boathouse/members"
              payload: { full_name: "Row Four", tier: "COMPETITIVE", body_weight_kg: 85.0, club_roles: ["ATHLETE"], swim_test_passed_on: "2026-04-01T00:00:00Z" }
              as: ClubAdmin
              captures: { r4_id: $.data.id }
            - call: "POST /boathouse/shells"
              payload: { hull_name: "Osprey", boat_class: "4+", hull_weight_kg: 51.0, home_bay: "BAY-2" }
              as: ClubAdmin
              captures: { shell4_id: $.data.id }
            - call: "POST /boathouse/regattas"
              payload: { name: "Riverside Sprints", host_club: "Riverside RC", venue_kind: "AWAY", race_date_at: "2026-08-08T08:00:00Z", entry_deadline_at: "2026-08-05T00:00:00Z", scratch_deadline_at: "2026-08-07T00:00:00Z", weigh_in_opens_at: "2026-08-07T06:00:00Z", weigh_in_closes_at: "2026-08-07T10:00:00Z" }
              as: ClubAdmin
              captures: { regatta_id: $.data.id }
            - call: "POST /boathouse/regatta-entries"
              payload: { regatta_id: "${regatta_id}", shell_id: "${shell4_id}", event_code: "MIXED_4PLUS_OPEN", boat_class: "4+", seed_time_seconds: 400.0 }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { entry_id: $.data.id, entry_v: $.data.version }
            - call: "POST /boathouse/regatta-entries/${entry_id}/lineup"
              payload: { expected_regatta_entry_version: "${entry_v}", seats: [{ member_id: "${cox_id}", seat_number: 0, seat_role: "COXSWAIN" }, { member_id: "${r1_id}", seat_number: 1, seat_role: "ROWER" }, { member_id: "${r2_id}", seat_number: 2, seat_role: "ROWER" }, { member_id: "${r3_id}", seat_number: 3, seat_role: "ROWER" }, { member_id: "${r4_id}", seat_number: 4, seat_role: "ROWER" }] }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /boathouse/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: ClubAdmin
          trigger:
            - call: "POST /boathouse/regatta-entries/${entry_id}/submit"
              payload: { note: "late entry accepted by host" }
              as: Coach
              as_user_id: "${coach_id}"
          assert:
            - "RegattaEntry.${entry_id}.base_fee_cents == 13500"
            - "RegattaEntry.${entry_id}.transport_levy_cents == 10000 (5000 * CLASS_SLOT_UNITS['4+'] == 5000 * 2, AWAY venue)"
            - "RegattaEntry.${entry_id}.late_fee_cents == 2350 (round_half_up(23500 * 0.10); the 23500 subtotal is below the 25000 threshold)"
            - "RegattaEntry.${entry_id}.total_fee_cents == 25850"
            - "RegattaEntry.${entry_id}.late_fee_cents != 3525 and RegattaEntry.${entry_id}.total_fee_cents != 27025, the fixed point of the rejected total-keyed reading"
            - "RegattaEntry.${entry_id}.status == SUBMITTED"
            - "Regatta.${regatta_id}.net_fee_cents == 25850"

      - name: session_launch_requirement_nested_min_over_three_flags_mode_a
        grounds:
          - calculations.session_launch_requirement
          - calculations.water_posture_evaluation
          - entities.WaterSession.fields.required_launch_count
          - entities.WaterSession.fields.assigned_launch_count
          - validations[priority=32]
          - state_machines.WaterSession.PLANNED_to_CLEARED
        distinguishing_aspect: |
          Mode (a) — a three-input non-linear formula: session_kind, the reading's cold_water_flag
          and the reading's posture each add one launch, and the nested min against
          MAX_LAUNCHES_PER_SESSION clamps the raw base of 3 down to required_launch_count 2, which
          exactly matches the two assigned drivers so clearance passes.
