              as: PlatformAdmin
              captures: { nurse_a_id: $.data.id }
            - call: "POST /nurses/${nurse_a_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-11111", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /nurses/${nurse_a_id}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /nurses"
              payload: { full_name: "Cira Lund", seniority_level: 2, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
              captures: { nurse_c_id: $.data.id }
            - call: "POST /nurses/${nurse_c_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-33333", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /symptom-protocols"
              payload: { code: "CHEST_PAIN", title: "Chest Pain In Adults", base_severity: 62, min_age_years: 0, max_age_years: 120, pregnancy_sensitive: false, emergency_override: false, min_disposition_level: "HOME_CARE" }
              as: PlatformAdmin
              captures: { protocol_id: $.data.id }
