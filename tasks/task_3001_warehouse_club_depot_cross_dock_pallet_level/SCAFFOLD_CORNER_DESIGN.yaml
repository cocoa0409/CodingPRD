              payload: { name: "Vend AH", vendor_code: "V480048" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "D AH", dock_count: 1, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
          trigger:
