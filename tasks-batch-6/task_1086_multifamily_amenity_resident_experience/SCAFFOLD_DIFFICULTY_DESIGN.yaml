              payload: { property_id: "${prop_id}", unit_number: "902", bedrooms: 1 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /residents"
              payload: { unit_id: "${unit_id}", full_name: "Quin", email: "quin@x.com" }
              as: PropertyManager
              captures: { resident_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /amenities"
              payload: { property_id: "${prop_id}", name: "Gym", amenity_type: "GYM", capacity: 1, base_rate_cents_per_hour: 4000, deposit_cents: 0, buffer_minutes: 0, open_minute: 0, close_minute: 1440 }
              as: PropertyManager
              captures: { amenity_id: $.data.id, amenity_v: $.data.version }
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-08T10:00:00Z", end_at: "2026-06-08T11:00:00Z", expected_amenity_version: "${amenity_v}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { booking_a_id: $.data.id }
            - call: "POST /amenity-bookings/${booking_a_id}/cancel"
              payload: {}
              as: Resident
              as_user_id: "${resident_id}"
            - call: "GET /amenities/${amenity_id}"
              payload: {}
              as: PropertyManager
              captures: { amenity_v2: $.data.version }
          trigger:
            - call: "POST /amenity-bookings"
              payload: { amenity_id: "${amenity_id}", resident_id: "${resident_id}", start_at: "2026-06-08T10:00:00Z", end_at: "2026-06-08T11:00:00Z", expected_amenity_version: "${amenity_v2}" }
              as: Resident
              as_user_id: "${resident_id}"
              captures: { booking_b_id: $.data.id }
          assert:
            - "AmenityBooking.${booking_b_id}.status == CONFIRMED"
