scenario: |
  1909. Holiday Toy Drive & Adopt-a-Family Program (Salvation Army Angel Tree style): family referral & eligibility verification from partner agencies, wish list intake with age/size/interest, donor/adopter matching & gift guidelines, gift return deadline & unfulfilled family backfill, sorting/distribution event logistics, duplicate-registration prevention across agencies, privacy of family information, post-season donor thank-you & retention

domain_name: holiday-toy-drive
api_prefix: /toy-drive

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: season_year
        type: integer
        source: input
        description: Four-digit calendar year of the holiday season; unique across all campaigns
        constraints: ">= 2020 and <= 2100; unique"
      - name: status
        type: enum
        source: system
        description: Lifecycle state of the campaign
        default: DRAFT
        constraints: "one of {DRAFT, INTAKE_OPEN, MATCHING, DISTRIBUTION_PREP, DISTRIBUTION, RECONCILIATION, CLOSED}"
      - name: intake_open_at
        type: datetime
        source: input
        description: ISO8601 UTC instant when partner agencies may begin submitting referrals
      - name: intake_close_at
        type: datetime
        source: input
        description: ISO8601 UTC instant after which new referrals are rejected
      - name: gift_return_deadline
        type: datetime
        source: input
        description: ISO8601 UTC instant after which unfulfilled adoptions are auto-cancelled and children moved to backfill
      - name: distribution_date
        type: datetime
        source: input
        description: ISO8601 UTC calendar day on which distribution events occur
      - name: max_children_per_family
        type: integer
        source: input
        description: Cap on children registered under one family for this campaign
        constraints: ">= 1 and <= 12"
      - name: max_gift_value_cents
        type: integer
        source: input
        description: Per-child suggested total gift value cap in cents; drives wish-list validation
        constraints: ">= 1000 and <= 100000"
      - name: min_gift_value_cents
        type: integer
        source: input
        description: Per-child minimum gift value in cents that an adopter must commit to
        constraints: ">= 0 and < max_gift_value_cents"
      - name: backfill_budget_cents
        type: integer
        source: input
        description: Total central-pool budget available to purchase gifts for unfulfilled children
        constraints: ">= 0"
      - name: backfill_spent_cents
        type: integer
        source: computed
        description: Sum of BackfillPurchase.final_cost_cents over all purchases in status PURCHASED for this campaign
        default: 0
      - name: privacy_mode
        type: enum
        source: input
        description: Controls whether donor-facing views show child first name + age band only (STRICT) or also interest text (STANDARD)
        default: STRICT
        constraints: "one of {STRICT, STANDARD}"
      - name: version
        type: integer
        source: system
        description: OCC version counter; increments on every mutation

  - name: PartnerAgency
    parent: null
    common_fields: true
    fields:
      - name: agency_code
        type: string
        source: input
        description: Stable short code printed on referral forms; unique
        constraints: "3-16 uppercase alphanumerics; unique"
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the partner agency
      - name: status
        type: enum
        source: system
        description: Whether the agency may submit referrals
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: referral_quota
        type: integer
        source: input
        description: Maximum number of families this agency may refer per campaign
        constraints: ">= 1 and <= 500"
      - name: referral_used_count
        type: integer
        source: computed
        description: Count of Family rows in non-terminal states referred by this agency for the current campaign
        default: 0
      - name: contact_email
        type: string
        source: input
        description: Program contact email

  - name: Family
    parent: PartnerAgency
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "FK -> PartnerAgency.id; referring agency"
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; campaign this referral belongs to"
      - name: primary_caregiver_name
        type: string
        source: input
        description: Full legal name of the primary caregiver; PII, never exposed to donors
      - name: caregiver_dob
        type: string
        source: input
        description: Date of birth YYYY-MM-DD of the primary caregiver; PII used in duplicate detection hash
      - name: household_size
        type: integer
        source: input
        description: Number of persons in the household including caregiver
        constraints: ">= 1 and <= 20"
      - name: address_text
        type: string
        source: input
        description: Free-form street address; PII, drives duplicate detection geohash
      - name: phone_last4
        type: string
        source: input
        description: Last four digits of the caregiver phone; PII, feeds duplicate hash
        constraints: "exactly 4 digits"
      - name: duplicate_hash
        type: string
        source: computed
        description: SHA-256 of normalized (caregiver_dob | phone_last4 | normalized address digits); indexed for cross-agency duplicate detection
      - name: status
        type: enum
        source: system
        description: Family referral lifecycle state
        default: REFERRED
        constraints: "one of {REFERRED, UNDER_REVIEW, VERIFIED, REJECTED, MATCHED, PARTIALLY_FULFILLED, FULFILLED, BACKFILLED, CLOSED, WITHDRAWN}"
      - name: verification_note
        type: string
        source: input
        description: Caseworker note recorded at verification; optional free text
        default: ""
      - name: verified_at
        type: datetime
        source: system
        description: Timestamp when family transitioned into VERIFIED; null until verified
      - name: fulfilled_children_count
        type: integer
        source: computed
        description: Count of children whose gift commitments reached DELIVERED or BACKFILL_PURCHASED
        default: 0
      - name: total_children_count
        type: integer
        source: computed
        description: Count of Child rows belonging to this family
        default: 0
      - name: duplicate_of_family_id
        type: string
        source: system
        description: "FK -> Family.id; set when this family was auto- or manually-flagged as a duplicate of another family row; self-referential"
      - name: version
        type: integer
        source: system
        description: OCC version counter

  - name: Child
    parent: Family
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id"
      - name: first_name
        type: string
        source: input
        description: Child first name only; PII-safe display field for donors under STANDARD privacy
      - name: dob
        type: string
        source: input
        description: Date of birth YYYY-MM-DD; PII; used to compute age_band
      - name: gender
        type: enum
        source: input
        description: Gender marker used by some donors for gift selection
        constraints: "one of {F, M, X}"
      - name: age_band
        type: enum
        source: computed
        description: Derived from dob at campaign.distribution_date; one of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE, PRETEEN, TEEN}
        constraints: "one of {INFANT, TODDLER, PRESCHOOL, SCHOOL_AGE, PRETEEN, TEEN}"
      - name: clothing_size
        type: string
        source: input
        description: Free-text clothing size descriptor (e.g. 'youth M', 'toddler 4T')
      - name: interest_tags
        type: array
        source: input
        description: List of lowercase interest keywords (e.g. ['lego', 'soccer', 'art'])
      - name: status
        type: enum
        source: system
        description: Per-child fulfillment lifecycle
        default: REGISTERED
        constraints: "one of {REGISTERED, WISH_LOCKED, ADOPTED, GIFT_RECEIVED, DELIVERED, BACKFILL_ELIGIBLE, BACKFILL_PURCHASED, CLOSED}"
      - name: gift_estimate_cents
        type: integer
        source: computed
        description: Sum of WishItem.estimated_price_cents over items in status REQUESTED or APPROVED for this child
        default: 0

  - name: WishItem
    parent: Child
    common_fields: true
    fields:
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id"
      - name: description
        type: string
        source: input
        description: Free-text wish description shown to the adopter
      - name: category
        type: enum
        source: input
        description: Gift category used for distribution sorting
        constraints: "one of {TOY, CLOTHING, BOOK, SPORTS, ELECTRONICS, ART, OTHER}"
      - name: estimated_price_cents
        type: integer
        source: input
        description: Caseworker-estimated retail price in cents
        constraints: ">= 100 and <= campaign.max_gift_value_cents"
      - name: priority_rank
        type: integer
        source: input
        description: 1 = most-wanted; unique per child across that child's wish items
        constraints: ">= 1 and <= 10; unique per child"
      - name: status
        type: enum
        source: system
        description: Wish item lifecycle
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, REJECTED, COMMITTED, RECEIVED, DELIVERED, BACKFILL_SOURCED}"

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Donor login email; unique
        constraints: "RFC5322 email; unique"
      - name: display_name
        type: string
        source: input
        description: Public display name used on thank-you letters
      - name: status
        type: enum
        source: system
        description: Donor account status
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}"
      - name: max_adoptions_per_season
        type: integer
        source: input
        description: Per-donor cap on concurrent non-terminal adoptions in one campaign
        default: 5
        constraints: ">= 1 and <= 50"
      - name: preferred_age_bands
        type: array
        source: input
        description: Optional list of age_band values the donor prefers; used by matching selector as a soft signal
        default: []
      - name: giving_history_cents
        type: integer
        source: computed
        description: Running total of Gift.declared_value_cents over Gifts in status RECEIVED or DELIVERED attributed to this donor across all campaigns
        default: 0
      - name: thank_you_opt_in
        type: boolean
        source: input
        description: Whether the donor consents to post-season thank-you outreach
        default: true

  - name: Adoption
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id"
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id"
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id being adopted"
      - name: scope
        type: enum
        source: input
        description: WHOLE_FAMILY commits to every VERIFIED child in the family; CHILD_LIST commits only to listed children
        constraints: "one of {WHOLE_FAMILY, CHILD_LIST}"
      - name: child_ids
        type: array
        source: input
        description: List of Child.id values covered when scope == CHILD_LIST; empty for WHOLE_FAMILY
        default: []
      - name: commitment_cents
        type: integer
        source: computed
        description: Pledged total = sum of gift_estimate_cents over covered children at the moment of adoption; frozen snapshot
      - name: status
        type: enum
        source: system
        description: Adoption lifecycle
        default: PLEDGED
        constraints: "one of {PLEDGED, CONFIRMED, PARTIALLY_RECEIVED, FULFILLED, LATE_CANCELLED, DONOR_CANCELLED, ADMIN_CANCELLED, EXPIRED}"
      - name: pledged_at
        type: datetime
        source: system
        description: Timestamp the adoption entered PLEDGED
      - name: confirmed_at
        type: datetime
        source: system
        description: Timestamp the donor confirmed the pledge
      - name: return_deadline
        type: datetime
        source: system
        description: Snapshot of campaign.gift_return_deadline at adoption-confirm time; gifts must be RECEIVED before this instant
      - name: version
        type: integer
        source: system
        description: OCC version counter

  - name: Gift
    parent: Adoption
    common_fields: true
    fields:
      - name: adoption_id
        type: string
        source: input
        description: "FK -> Adoption.id"
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id receiving this gift"
      - name: wish_item_id
        type: string
        source: input
        description: "FK -> WishItem.id this gift satisfies; null allowed when donor substitutes an off-list gift"
      - name: description
        type: string
        source: input
        description: Donor-supplied description of the physical gift
      - name: declared_value_cents
        type: integer
        source: input
        description: Donor-declared purchase value in cents; audited against campaign.max_gift_value_cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Gift lifecycle
        default: COMMITTED
        constraints: "one of {COMMITTED, IN_TRANSIT, RECEIVED, SORTED, STAGED, DELIVERED, RETURNED_TO_DONOR, BACKFILL_REPLACED}"
      - name: received_at
        type: datetime
        source: system
        description: Timestamp gift intake scanned the gift; null until RECEIVED
      - name: sorted_at
        type: datetime
        source: system
        description: Timestamp the gift was scanned into a distribution sorting bin
      - name: slot_id
        type: string
        source: system
        description: "FK -> DistributionSlot.id the gift is staged into; null until staging"

  - name: BackfillPurchase
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id"
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id being backfilled"
      - name: wish_item_id
        type: string
        source: input
        description: "FK -> WishItem.id being sourced from the central pool"
      - name: quoted_cost_cents
        type: integer
        source: input
        description: Purchasing volunteer's quoted price at order time
        constraints: ">= 0"
      - name: final_cost_cents
        type: integer
        source: system
        description: Actual receipt cost recorded when purchase is marked PURCHASED; drives campaign.backfill_spent_cents
      - name: status
        type: enum
        source: system
        description: Backfill purchase lifecycle
        default: ORDERED
        constraints: "one of {ORDERED, PURCHASED, SORTED, DELIVERED, CANCELLED}"
      - name: purchased_at
        type: datetime
        source: system
        description: Timestamp when status flipped to PURCHASED

  - name: DistributionEvent
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id"
      - name: site_name
        type: string
        source: input
        description: Human-readable venue name
      - name: start_at
        type: datetime
        source: input
        description: ISO8601 UTC event start
      - name: end_at
        type: datetime
        source: input
        description: ISO8601 UTC event end; must be strictly greater than start_at
      - name: status
        type: enum
        source: system
        description: Event lifecycle
        default: PLANNED
        constraints: "one of {PLANNED, OPEN_FOR_SLOTS, SORTING, LOCKED, COMPLETED, CANCELLED}"
      - name: capacity_slots
        type: integer
        source: input
        description: Total number of DistributionSlot rows that may be created under this event
        constraints: ">= 1 and <= 1000"
      - name: version
        type: integer
        source: system
        description: OCC version counter

  - name: DistributionSlot
    parent: DistributionEvent
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> DistributionEvent.id"
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id picking up at this slot"
      - name: window_start
        type: datetime
        source: input
        description: ISO8601 UTC pickup window start; must lie within parent event [start_at, end_at)
      - name: window_end
        type: datetime
        source: input
        description: ISO8601 UTC pickup window end; strictly greater than window_start; must lie within parent event window
      - name: lane
        type: enum
        source: input
        description: Physical staging lane at the venue
        constraints: "one of {A, B, C, D}"
      - name: status
        type: enum
        source: system
        description: Slot lifecycle
        default: RESERVED
        constraints: "one of {RESERVED, CHECKED_IN, COMPLETED, NO_SHOW, CANCELLED}"
      - name: gifts_staged_count
        type: integer
        source: computed
        description: Count of Gift rows in status STAGED with slot_id == this slot
        default: 0

  - name: DuplicateFlag
    parent: Family
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id flagged as potential duplicate"
      - name: other_family_id
        type: string
        source: input
        description: "FK -> Family.id of the suspected primary record"
      - name: detected_by
        type: enum
        source: system
        description: How the flag was raised
        constraints: "one of {AUTO_HASH, MANUAL_REPORT}"
      - name: status
        type: enum
        source: system
        description: Review state of the flag
        default: OPEN
        constraints: "one of {OPEN, CONFIRMED_DUPLICATE, DISMISSED}"
      - name: resolution_note
        type: string
        source: input
        description: Reviewer note recorded at resolution
        default: ""

  - name: ThankYouNote
    parent: Campaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id"
      - name: donor_id
        type: string
        source: input
        description: "FK -> Donor.id being thanked"
      - name: template
        type: enum
        source: input
        description: Letter template selector
        constraints: "one of {STANDARD, MAJOR_DONOR, FIRST_TIME, LAPSED_RETURNING}"
      - name: status
        type: enum
        source: system
        description: Note lifecycle
        default: QUEUED
        constraints: "one of {QUEUED, SENT, BOUNCED, CANCELLED}"
      - name: sent_at
        type: datetime
        source: system
        description: Timestamp note was dispatched; null until SENT
      - name: personalization_token
        type: string
        source: computed
        description: Server-computed hash token embedded in the letter for retention analytics; deterministic on (donor_id, campaign_id, template)

  - name: FamilyAuditEvent
    parent: Family
    common_fields: false
    fields:
      - name: family_id
        type: string
        source: system
        description: "FK -> Family.id; the family row this event concerns"
      - name: actor_role
        type: string
        source: system
        description: X-User-Role of the actor who caused the event
      - name: actor_id
        type: string
        source: system
        description: X-User-ID of the actor
      - name: event_type
        type: enum
        source: system
        description: Kind of audit event
        constraints: "one of {PII_VIEW, PII_EXPORT, STATUS_CHANGE, DUPLICATE_FLAGGED, DUPLICATE_RESOLVED, CONSENT_CHANGE}"
      - name: payload_json
        type: object
        source: system
        description: Free-form structured details (before/after values, reason codes)
      - name: occurred_at
        type: datetime
        source: system
        description: Server-stamped UTC timestamp of the event

  - name: SeasonSettings
    parent: null
    common_fields: true
    fields:
      - name: singleton_key
        type: string
        source: input
        description: Hard-coded literal 'GLOBAL'; unique — exactly one row exists
        constraints: "must equal 'GLOBAL'; unique"
      - name: duplicate_auto_detect_enabled
        type: boolean
        source: input
        description: Whether family-create auto-computes duplicate_hash and raises DuplicateFlag rows
        default: true
      - name: duplicate_hash_salt
        type: string
        source: input
        description: Installation-wide salt mixed into duplicate_hash so hashes are not portable across deployments
      - name: late_donor_grace_hours
        type: integer
        source: input
        description: Hours after campaign.gift_return_deadline during which a gift may still be marked RECEIVED with an override note
        default: 0
        constraints: ">= 0 and <= 72"
      - name: major_donor_threshold_cents
        type: integer
        source: input
        description: giving_history_cents at or above which a donor is classified MAJOR for thank-you template selection
        default: 50000
        constraints: ">= 0"
      - name: version
        type: integer
        source: system
        description: OCC version counter

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: INTAKE_OPEN
        trigger: "POST /toy-drive/campaigns/{id}/open-intake"
        actor: PlatformAdmin
        preconditions:
          - "campaign.status == DRAFT"
          - "campaign.intake_open_at <= current_utc <= campaign.intake_close_at"
        side_effects:
          - "stamps campaign.updated_at; increments campaign.version"
      - from: INTAKE_OPEN
        to: MATCHING
        trigger: "POST /toy-drive/campaigns/{id}/close-intake"
        actor: PlatformAdmin
        preconditions:
          - "campaign.status == INTAKE_OPEN"
          - "current_utc >= campaign.intake_close_at"
        side_effects:
          - "for every Family in REFERRED or UNDER_REVIEW under this campaign: transition family to REJECTED with reason INTAKE_CLOSED_INCOMPLETE"
          - "increments campaign.version"
      - from: MATCHING
        to: DISTRIBUTION_PREP
        trigger: "POST /toy-drive/campaigns/{id}/advance"
        actor: PlatformAdmin
        preconditions:
          - "campaign.status == MATCHING"
          - "current_utc >= campaign.gift_return_deadline"
        side_effects:
          - "auto-cancels every Adoption in PLEDGED or CONFIRMED whose return_deadline < current_utc -> status EXPIRED (see Adoption.EXPIRED cascade)"
          - "recomputes every Child.status in ADOPTED whose adoption expired -> BACKFILL_ELIGIBLE"
          - "increments campaign.version"
      - from: DISTRIBUTION_PREP
        to: DISTRIBUTION
        trigger: "POST /toy-drive/campaigns/{id}/advance"
        actor: PlatformAdmin
        preconditions:
          - "campaign.status == DISTRIBUTION_PREP"
          - "at least one DistributionEvent under campaign is in status OPEN_FOR_SLOTS or later"
        side_effects:
          - "increments campaign.version"
      - from: DISTRIBUTION
        to: RECONCILIATION
        trigger: "POST /toy-drive/campaigns/{id}/advance"
        actor: PlatformAdmin
        preconditions:
          - "campaign.status == DISTRIBUTION"
          - "every DistributionEvent under campaign is in {COMPLETED, CANCELLED}"
        side_effects:
          - "for every Family still in MATCHED / PARTIALLY_FULFILLED / FULFILLED / BACKFILLED: family -> CLOSED"
          - "increments campaign.version"
      - from: RECONCILIATION
        to: CLOSED
        trigger: "POST /toy-drive/campaigns/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "campaign.status == RECONCILIATION"
          - "no Adoption in {PLEDGED, CONFIRMED, PARTIALLY_RECEIVED} remains under campaign"
          - "no DuplicateFlag in OPEN remains under any family of campaign"
        side_effects:
          - "stamps campaign.updated_at; increments campaign.version"

  - entity: Family
    initial_state: REFERRED
    terminal_states: [REJECTED, CLOSED, WITHDRAWN]
    transitions:
      - from: REFERRED
        to: UNDER_REVIEW
        trigger: "POST /toy-drive/families/{id}/begin-review"
        actor: CaseWorker
        preconditions:
          - "family.status == REFERRED"
          - "no OPEN DuplicateFlag exists with family_id == family.id or other_family_id == family.id"
        side_effects:
          - "writes FamilyAuditEvent(event_type=STATUS_CHANGE)"
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /toy-drive/families/{id}/verify"
        actor: CaseWorker
        preconditions:
          - "family.status == UNDER_REVIEW"
          - "family.total_children_count >= 1"
          - "every Child of family has age_band computed (non-null)"
          - "no OPEN DuplicateFlag references family.id in either direction"
        side_effects:
          - "stamps family.verified_at = current_utc"
          - "for every Child of family: child.status REGISTERED -> WISH_LOCKED"
          - "writes FamilyAuditEvent(event_type=STATUS_CHANGE)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /toy-drive/families/{id}/reject"
        actor: CaseWorker
        preconditions:
          - "family.status == UNDER_REVIEW"
        side_effects:
          - "for every Child of family: child -> CLOSED"
          - "for every WishItem of those children: item -> REJECTED"
          - "writes FamilyAuditEvent(event_type=STATUS_CHANGE)"
      - from: UNDER_REVIEW
        to: REFERRED
        trigger: "POST /toy-drive/families/{id}/return-to-referral"
        actor: CaseWorker
        preconditions:
          - "family.status == UNDER_REVIEW"
        side_effects:
          - "writes FamilyAuditEvent(event_type=STATUS_CHANGE)"
        note: cyclic revision loop — caseworker may bounce family back for more documentation any number of times
      - from: VERIFIED
        to: MATCHED
        trigger: "system (on Adoption confirm covering this family)"
        actor: system
        preconditions:
          - "an Adoption reaches CONFIRMED with family_id == family.id"
        side_effects:
          - "writes FamilyAuditEvent(event_type=STATUS_CHANGE)"
      - from: MATCHED
        to: PARTIALLY_FULFILLED
        trigger: "system (on first Gift reaching RECEIVED for a child of this family)"
        actor: system
        preconditions:
          - "family.status == MATCHED"
          - "a Gift with child.family_id == family.id transitions to RECEIVED"
        side_effects:
          - "recomputes family.fulfilled_children_count"
      - from: PARTIALLY_FULFILLED
        to: FULFILLED
        trigger: "system (when fulfilled_children_count == total_children_count and total > 0)"
        actor: system
        preconditions:
          - "family.fulfilled_children_count == family.total_children_count"
          - "family.total_children_count > 0"
        side_effects:
          - "recomputes family.fulfilled_children_count"
      - from: MATCHED
        to: FULFILLED
        trigger: "system (whole-family adoption whose every gift arrives in one scan batch)"
        actor: system
        preconditions:
          - "family.fulfilled_children_count == family.total_children_count"
          - "family.total_children_count > 0"
        side_effects:
          - "recomputes family.fulfilled_children_count"
      - from: PARTIALLY_FULFILLED
        to: BACKFILLED
        trigger: "system (when every remaining non-DELIVERED child reaches BACKFILL_PURCHASED)"
        actor: system
        preconditions:
          - "every Child of family is in {DELIVERED, BACKFILL_PURCHASED, CLOSED}"
          - "at least one Child is in BACKFILL_PURCHASED"
        side_effects:
          - "recomputes family.fulfilled_children_count"
      - from: MATCHED
        to: BACKFILLED
        trigger: "system (adoption expired with zero gifts received; all children backfilled)"
        actor: system
        preconditions:
          - "every Child of family is in {BACKFILL_PURCHASED, CLOSED}"
          - "at least one Child is in BACKFILL_PURCHASED"
        side_effects:
          - "recomputes family.fulfilled_children_count"
      - from: VERIFIED
        to: WITHDRAWN
        trigger: "POST /toy-drive/families/{id}/withdraw"
        actor: CaseWorker
        preconditions:
          - "family.status == VERIFIED"
          - "no Adoption in {PLEDGED, CONFIRMED, PARTIALLY_RECEIVED} references family.id"
        side_effects:
          - "every Child of family -> CLOSED"
          - "writes FamilyAuditEvent(event_type=STATUS_CHANGE)"

  - entity: Child
    initial_state: REGISTERED
    terminal_states: [DELIVERED, BACKFILL_PURCHASED, CLOSED]
    transitions:
      - from: REGISTERED
        to: WISH_LOCKED
        trigger: "system (family verified)"
        actor: system
        preconditions:
          - "child.family.status transitions to VERIFIED"
        side_effects: []
      - from: WISH_LOCKED
        to: ADOPTED
        trigger: "system (adoption confirm covering child)"
        actor: system
        preconditions:
          - "Adoption covering child transitions to CONFIRMED"
        side_effects: []
      - from: ADOPTED
        to: GIFT_RECEIVED
        trigger: "system (first gift for child reaches RECEIVED)"
        actor: system
        preconditions:
          - "a Gift with child_id == child.id transitions to RECEIVED"
        side_effects: []
      - from: GIFT_RECEIVED
        to: DELIVERED
        trigger: "POST /toy-drive/distribution-slots/{slot_id}/complete"
        actor: DistributionVolunteer
        preconditions:
          - "slot.family_id == child.family_id"
          - "slot.status == CHECKED_IN"
          - "every Gift staged into slot has been scanned"
        side_effects:
          - "every Gift with child_id == child.id and status STAGED -> DELIVERED"
          - "recomputes family.fulfilled_children_count"
      - from: ADOPTED
        to: BACKFILL_ELIGIBLE
        trigger: "system (adoption expired or donor-cancelled before any gift received)"
        actor: system
        preconditions:
          - "the Adoption covering child transitions to EXPIRED / DONOR_CANCELLED / ADMIN_CANCELLED / LATE_CANCELLED"
          - "no Gift for child has ever reached RECEIVED"
        side_effects: []
      - from: BACKFILL_ELIGIBLE
        to: BACKFILL_PURCHASED
        trigger: "POST /toy-drive/backfill-purchases/{id}/mark-purchased (for a purchase with child_id == child.id)"
        actor: PlatformAdmin
        preconditions:
          - "BackfillPurchase.child_id == child.id"
          - "BackfillPurchase.status == ORDERED"
        side_effects:
          - "recomputes family.fulfilled_children_count"
          - "child terminal"
      - from: REGISTERED
        to: CLOSED
        trigger: "system (family rejected / withdrawn / intake closed)"
        actor: system
        preconditions:
          - "child.family.status transitions to REJECTED or WITHDRAWN, or campaign intake closes with family still non-VERIFIED"
        side_effects: []

  - entity: WishItem
    initial_state: REQUESTED
    terminal_states: [REJECTED, DELIVERED, BACKFILL_SOURCED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /toy-drive/wish-items/{id}/approve"
        actor: CaseWorker
        preconditions:
          - "item.status == REQUESTED"
          - "item.child.status in {REGISTERED, WISH_LOCKED}"
          - "sum of APPROVED + this item's estimated_price_cents for child <= campaign.max_gift_value_cents"
        side_effects:
          - "recomputes child.gift_estimate_cents"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /toy-drive/wish-items/{id}/reject"
        actor: CaseWorker
        preconditions:
          - "item.status == REQUESTED"
        side_effects:
          - "recomputes child.gift_estimate_cents"
      - from: APPROVED
        to: COMMITTED
        trigger: "system (adoption confirm creates Gift referencing item)"
        actor: system
        preconditions:
          - "a Gift is created with wish_item_id == item.id"
        side_effects: []
      - from: COMMITTED
        to: RECEIVED
        trigger: "system (gift reaches RECEIVED)"
        actor: system
        preconditions:
          - "gift.wish_item_id == item.id and gift.status transitions to RECEIVED"
        side_effects: []
      - from: RECEIVED
        to: DELIVERED
        trigger: "system (gift delivered at slot completion)"
        actor: system
        preconditions:
          - "gift.wish_item_id == item.id and gift.status transitions to DELIVERED"
        side_effects: []
      - from: APPROVED
        to: BACKFILL_SOURCED
        trigger: "system (backfill purchase marks item sourced)"
        actor: system
        preconditions:
          - "a BackfillPurchase with wish_item_id == item.id transitions to PURCHASED"
        side_effects: []

  - entity: Adoption
    initial_state: PLEDGED
    terminal_states: [FULFILLED, LATE_CANCELLED, DONOR_CANCELLED, ADMIN_CANCELLED, EXPIRED]
    transitions:
      - from: PLEDGED
        to: CONFIRMED
        trigger: "POST /toy-drive/adoptions/{id}/confirm"
        actor: Donor
        preconditions:
          - "adoption.status == PLEDGED"
          - "X-User-ID == adoption.donor_id"
          - "current_utc <= adoption.pledged_at + 72 hours"
          - "family.status == VERIFIED (re-checked at confirm time)"
          - "donor concurrent non-terminal adoptions < donor.max_adoptions_per_season"
        side_effects:
          - "stamps adoption.confirmed_at; snapshots adoption.return_deadline = campaign.gift_return_deadline"
          - "for every Child covered: child WISH_LOCKED -> ADOPTED; every APPROVED WishItem of covered children -> COMMITTED"
          - "family VERIFIED -> MATCHED"
          - "increments family.version and adoption.version"
      - from: PLEDGED
        to: EXPIRED
        trigger: "system (pledge confirmation window elapsed)"
        actor: system
        preconditions:
          - "adoption.status == PLEDGED"
          - "current_utc > adoption.pledged_at + 72 hours"
        side_effects:
          - "family remains VERIFIED (no MATCHED side effect ever fired)"
          - "agency.referral_used_count recomputed"
      - from: CONFIRMED
        to: PARTIALLY_RECEIVED
        trigger: "system (first Gift under this adoption reaches RECEIVED)"
        actor: system
        preconditions:
          - "a Gift with adoption_id == adoption.id transitions to RECEIVED"
        side_effects: []
      - from: CONFIRMED
        to: FULFILLED
        trigger: "system (every covered child DELIVERED)"
        actor: system
        preconditions:
          - "every Child covered by adoption is in {DELIVERED, BACKFILL_PURCHASED, CLOSED}"
        side_effects: []
      - from: PARTIALLY_RECEIVED
        to: FULFILLED
        trigger: "system (every covered child DELIVERED)"
        actor: system
        preconditions:
          - "every Child covered by adoption is in {DELIVERED, BACKFILL_PURCHASED, CLOSED}"
        side_effects: []
      - from: CONFIRMED
        to: DONOR_CANCELLED
        trigger: "POST /toy-drive/adoptions/{id}/cancel"
        actor: Donor
        preconditions:
          - "adoption.status == CONFIRMED"
          - "X-User-ID == adoption.donor_id"
          - "no Gift under adoption is in {RECEIVED, SORTED, STAGED, DELIVERED}"
          - "current_utc <= adoption.return_deadline"
        side_effects:
          - "every Gift under adoption in {COMMITTED, IN_TRANSIT} -> RETURNED_TO_DONOR"
          - "every covered Child ADOPTED -> BACKFILL_ELIGIBLE"
          - "every COMMITTED WishItem of covered children -> APPROVED"
          - "family MATCHED -> VERIFIED if no other CONFIRMED adoption covers family, else recompute"
      - from: CONFIRMED
        to: LATE_CANCELLED
        trigger: "POST /toy-drive/adoptions/{id}/cancel with reason=LATE"
        actor: Donor
        preconditions:
          - "adoption.status == CONFIRMED"
          - "X-User-ID == adoption.donor_id"
          - "current_utc > adoption.return_deadline"
          - "no Gift under adoption is in {RECEIVED, SORTED, STAGED, DELIVERED}"
        side_effects:
          - "same cascades as DONOR_CANCELLED"
          - "donor.status remains ACTIVE but a FamilyAuditEvent-style donor strike is recorded via ThankYouNote suppression"
      - from: CONFIRMED
        to: ADMIN_CANCELLED
        trigger: "POST /toy-drive/adoptions/{id}/admin-cancel"
        actor: PlatformAdmin
        preconditions:
          - "adoption.status in {CONFIRMED, PARTIALLY_RECEIVED}"
        side_effects:
          - "every Gift under adoption in {COMMITTED, IN_TRANSIT} -> RETURNED_TO_DONOR; gifts in RECEIVED remain RECEIVED but flagged"
          - "covered Children with no RECEIVED gift -> BACKFILL_ELIGIBLE"
      - from: CONFIRMED
        to: EXPIRED
        trigger: "system (campaign advance past gift_return_deadline with unfulfilled children)"
        actor: system
        preconditions:
          - "campaign.status transitions MATCHING -> DISTRIBUTION_PREP"
          - "adoption has at least one covered Child still in ADOPTED"
        side_effects:
          - "every Gift in {COMMITTED, IN_TRANSIT} -> RETURNED_TO_DONOR"
          - "every covered Child in ADOPTED -> BACKFILL_ELIGIBLE"
          - "family MATCHED -> recompute per remaining confirmed adoptions"

  - entity: Gift
    initial_state: COMMITTED
    terminal_states: [DELIVERED, RETURNED_TO_DONOR, BACKFILL_REPLACED]
    transitions:
      - from: COMMITTED
        to: IN_TRANSIT
        trigger: "POST /toy-drive/gifts/{id}/ship"
        actor: Donor
        preconditions:
          - "gift.status == COMMITTED"
          - "X-User-ID == gift.adoption.donor_id"
        side_effects: []
      - from: COMMITTED
        to: RECEIVED
        trigger: "POST /toy-drive/gifts/{id}/receive"
        actor: DistributionVolunteer
        preconditions:
          - "gift.status in {COMMITTED, IN_TRANSIT}"
          - "current_utc <= gift.adoption.return_deadline OR (current_utc <= return_deadline + SeasonSettings.late_donor_grace_hours AND override_note provided)"
        side_effects:
          - "stamps gift.received_at"
          - "adoption CONFIRMED -> PARTIALLY_RECEIVED if first gift"
          - "child ADOPTED -> GIFT_RECEIVED"
          - "wish_item COMMITTED -> RECEIVED"
          - "family MATCHED -> PARTIALLY_FULFILLED and family.fulfilled_children_count recomputed"
          - "donor.giving_history_cents += gift.declared_value_cents"
      - from: RECEIVED
        to: SORTED
        trigger: "POST /toy-drive/gifts/{id}/sort"
        actor: DistributionVolunteer
        preconditions:
          - "gift.status == RECEIVED"
          - "parent campaign.status in {DISTRIBUTION_PREP, DISTRIBUTION}"
          - "a DistributionEvent under campaign is in SORTING or later"
        side_effects:
          - "stamps gift.sorted_at"
      - from: SORTED
        to: STAGED
        trigger: "POST /toy-drive/gifts/{id}/stage"
        actor: DistributionVolunteer
        preconditions:
          - "gift.status == SORTED"
          - "target DistributionSlot.status == RESERVED or CHECKED_IN"
          - "target slot.family_id == gift.child.family_id"
          - "target slot event.status == SORTING"
        side_effects:
          - "sets gift.slot_id"
          - "increments slot.gifts_staged_count"
      - from: STAGED
        to: DELIVERED
        trigger: "system (slot completion)"
        actor: system
        preconditions:
          - "slot completion transition fires"
        side_effects:
          - "wish_item RECEIVED -> DELIVERED"
      - from: COMMITTED
        to: RETURNED_TO_DONOR
        trigger: "system (adoption cancelled or expired)"
        actor: system
        preconditions:
          - "gift.adoption transitions to one of {DONOR_CANCELLED, LATE_CANCELLED, ADMIN_CANCELLED, EXPIRED}"
        side_effects: []
      - from: IN_TRANSIT
        to: RETURNED_TO_DONOR
        trigger: "system (adoption cancelled or expired)"
        actor: system
        preconditions:
          - "gift.adoption transitions to one of {DONOR_CANCELLED, LATE_CANCELLED, ADMIN_CANCELLED, EXPIRED}"
        side_effects: []
      - from: COMMITTED
        to: BACKFILL_REPLACED
        trigger: "system (central pool purchased a substitute for the same wish item)"
        actor: system
        preconditions:
          - "a BackfillPurchase with wish_item_id == gift.wish_item_id transitions to PURCHASED"
        side_effects: []

  - entity: BackfillPurchase
    initial_state: ORDERED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: ORDERED
        to: PURCHASED
        trigger: "POST /toy-drive/backfill-purchases/{id}/mark-purchased"
        actor: PlatformAdmin
        preconditions:
          - "purchase.status == ORDERED"
          - "campaign.backfill_spent_cents + final_cost_cents <= campaign.backfill_budget_cents"
        side_effects:
          - "stamps purchase.purchased_at and purchase.final_cost_cents"
          - "campaign.backfill_spent_cents += final_cost_cents"
          - "child BACKFILL_ELIGIBLE -> BACKFILL_PURCHASED"
          - "wish_item APPROVED -> BACKFILL_SOURCED"
          - "any COMMITTED Gift referencing same wish_item -> BACKFILL_REPLACED"
          - "family recompute to FULFILLED or BACKFILLED per sibling states"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /toy-drive/backfill-purchases/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "purchase.status == ORDERED"
        side_effects: []
      - from: PURCHASED
        to: SORTED
        trigger: "POST /toy-drive/backfill-purchases/{id}/sort"
        actor: DistributionVolunteer
        preconditions:
          - "purchase.status == PURCHASED"
          - "campaign.status in {DISTRIBUTION_PREP, DISTRIBUTION}"
        side_effects: []
      - from: SORTED
        to: DELIVERED
        trigger: "system (slot completion)"
        actor: system
        preconditions:
          - "the DistributionSlot for purchase.child.family completes"
        side_effects: []

  - entity: DistributionEvent
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: OPEN_FOR_SLOTS
        trigger: "POST /toy-drive/distribution-events/{id}/open-slots"
        actor: PlatformAdmin
        preconditions:
          - "event.status == PLANNED"
          - "campaign.status == DISTRIBUTION_PREP"
        side_effects: []
      - from: OPEN_FOR_SLOTS
        to: SORTING
        trigger: "POST /toy-drive/distribution-events/{id}/begin-sorting"
        actor: PlatformAdmin
        preconditions:
          - "event.status == OPEN_FOR_SLOTS"
          - "every DistributionSlot under event has window_start >= event.start_at and window_end <= event.end_at"
        side_effects: []
      - from: SORTING
        to: LOCKED
        trigger: "POST /toy-drive/distribution-events/{id}/lock"
        actor: PlatformAdmin
        preconditions:
          - "event.status == SORTING"
          - "no Gift with slot.event_id == event.id is in status RECEIVED (all intake gifts either SORTED/STAGED or excluded)"
        side_effects:
          - "no new Gift.stage calls accepted for this event thereafter"
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /toy-drive/distribution-events/{id}/complete"
        actor: PlatformAdmin
        preconditions:
          - "event.status == LOCKED"
          - "every DistributionSlot under event is in {COMPLETED, NO_SHOW, CANCELLED}"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /toy-drive/distribution-events/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "event.status in {PLANNED, OPEN_FOR_SLOTS}"
        side_effects:
          - "every DistributionSlot under event in {RESERVED, CHECKED_IN} -> CANCELLED"
          - "gifts STAGED into those slots revert to SORTED and slot_id cleared"

  - entity: DistributionSlot
    initial_state: RESERVED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /toy-drive/distribution-slots/{id}/check-in"
        actor: DistributionVolunteer
        preconditions:
          - "slot.status == RESERVED"
          - "current_utc >= slot.window_start and current_utc <= slot.window_end"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /toy-drive/distribution-slots/{id}/complete"
        actor: DistributionVolunteer
        preconditions:
          - "slot.status == CHECKED_IN"
          - "every Gift with slot_id == slot.id is in STAGED"
        side_effects:
          - "every Gift STAGED into slot -> DELIVERED"
          - "every child of slot.family in GIFT_RECEIVED -> DELIVERED"
          - "every BackfillPurchase SORTED for slot.family -> DELIVERED"
      - from: RESERVED
        to: NO_SHOW
        trigger: "system (window_end elapsed without check-in)"
        actor: system
        preconditions:
          - "slot.status == RESERVED"
          - "current_utc > slot.window_end"
        side_effects:
          - "gifts STAGED into slot revert to SORTED and slot_id cleared"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /toy-drive/distribution-slots/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "slot.status == RESERVED"
        side_effects:
          - "gifts STAGED into slot revert to SORTED and slot_id cleared"

  - entity: DuplicateFlag
    initial_state: OPEN
    terminal_states: [CONFIRMED_DUPLICATE, DISMISSED]
    transitions:
      - from: OPEN
        to: CONFIRMED_DUPLICATE
        trigger: "POST /toy-drive/duplicate-flags/{id}/confirm"
        actor: CaseWorker
        preconditions:
          - "flag.status == OPEN"
        side_effects:
          - "flag.family.status -> REJECTED (if not terminal) with reason CONFIRMED_DUPLICATE"
          - "flag.family.duplicate_of_family_id = flag.other_family_id"
          - "writes FamilyAuditEvent(event_type=DUPLICATE_RESOLVED) on both families"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /toy-drive/duplicate-flags/{id}/dismiss"
        actor: CaseWorker
        preconditions:
          - "flag.status == OPEN"
        side_effects:
          - "writes FamilyAuditEvent(event_type=DUPLICATE_RESOLVED)"

  - entity: ThankYouNote
    initial_state: QUEUED
    terminal_states: [SENT, BOUNCED, CANCELLED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /toy-drive/thank-you-notes/{id}/send"
        actor: PlatformAdmin
        preconditions:
          - "note.status == QUEUED"
          - "donor.thank_you_opt_in == true"
          - "campaign.status == RECONCILIATION or CLOSED"
        side_effects:
          - "stamps note.sent_at"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /toy-drive/thank-you-notes/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "note.status == QUEUED"
        side_effects: []
      - from: SENT
        to: BOUNCED
        trigger: "POST /toy-drive/thank-you-notes/{id}/mark-bounced"
        actor: PlatformAdmin
        preconditions:
          - "note.status == SENT"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: adoption-create-stale-family
    parent_entity: Family
    write_endpoint: "POST /toy-drive/adoptions"
    occ_field: "expected_family_version"
    description: |
      Creating an Adoption against a Family whose version has advanced since the
      donor last observed it is rejected. The canonical case: a duplicate-flag
      resolution or a sibling adoption confirm mutated family.status between the
      donor's browse and pledge calls, making the donor's view of the family
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: slot-book-stale-event
    parent_entity: DistributionEvent
    write_endpoint: "POST /toy-drive/distribution-slots"
    occ_field: "expected_event_version"
    description: |
      Creating a DistributionSlot against a DistributionEvent whose version has
      advanced since the volunteer last observed it is rejected. This captures
      the case where another volunteer has just booked the final open slot
      (legitimately consuming event capacity) and the current volunteer's view
      of remaining capacity is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: campaign-advance-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /toy-drive/campaigns/{id}/advance"
    occ_field: "expected_campaign_version"
    description: |
      Advancing a Campaign whose version has advanced since the admin last
      observed it is rejected. Back-to-back advance calls must each observe the
      freshest version because the prior advance's cascades (adoption expiry,
      child backfill-eligibility flips) silently bump campaign.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: settings-update-stale-settings
    parent_entity: SeasonSettings
    write_endpoint: "PUT /toy-drive/season-settings"
    occ_field: "expected_settings_version"
    description: |
      Updating the SeasonSettings singleton with a stale expected version is
      rejected so two admins cannot each believe their own update was the one
      that landed (e.g. both toggling duplicate_auto_detect_enabled with
      different values).
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: child_age_band
    trigger: "on Child create, on Child dob update, and again lazily when campaign.distribution_date is changed"
    algorithm: threshold
    formula: |
      age_days = (campaign.distribution_date - child.dob) in whole days, floored
      age_years = floor(age_days / 365.25)
      band = INFANT      if age_years < 1
             TODDLER     if 1 <= age_years < 3
             PRESCHOOL   if 3 <= age_years < 5
             SCHOOL_AGE  if 5 <= age_years < 10
             PRETEEN     if 10 <= age_years < 13
             TEEN        if 13 <= age_years < 19
      Children with age_years >= 19 are REJECTED at Child create (ERR_CHILD_TOO_OLD).
    input_set: "Child.dob and parent campaign.distribution_date"
    constants:
      DAYS_PER_YEAR: 365.25
      MAX_AGE_YEARS: 19
    precision: "whole years, floor"
    variants:
      - name: at_intake
        when: "computed eagerly at Child create using the campaign's current distribution_date"
        difference: "uses the distribution_date value at the moment of the POST"
      - name: at_distribution
        when: "recomputed lazily if PlatformAdmin later PATCHes campaign.distribution_date"
        difference: "uses the new distribution_date; children whose band would change keep the old band but a FamilyAuditEvent is written"

  - name: wish_list_value
    trigger: "on WishItem approve / reject / delete; read by Adoption confirm to freeze commitment_cents"
    algorithm: aggregation
    formula: |
      child.gift_estimate_cents = sum(WishItem.estimated_price_cents)
        over WishItem where child_id == child.id
          and status in {REQUESTED, APPROVED}
    input_set: "WishItem rows belonging to the child filtered to status in {REQUESTED, APPROVED}; REJECTED, COMMITTED, RECEIVED, DELIVERED, BACKFILL_SOURCED are excluded"
    precision: "integer cents"
    variants: []

  - name: adoption_commitment_snapshot
    trigger: "on Adoption create (PLEDGED)"
    algorithm: aggregation
    formula: |
      if scope == WHOLE_FAMILY:
        covered = every Child c where c.family_id == adoption.family_id
                  and c.status in {WISH_LOCKED}
      else:
        covered = Child rows whose id in adoption.child_ids and status == WISH_LOCKED
      commitment_cents = sum(c.gift_estimate_cents for c in covered)
      # Snapshot semantics: stored on the adoption row at PLEDGED time and NEVER
      # recomputed, even if a WishItem is later edited.
    input_set: "Children in WISH_LOCKED state covered by scope; their current gift_estimate_cents"
    precision: "integer cents"
    variants: []

  - name: donor_concurrent_adoption_count
    trigger: "validated on Adoption create and Adoption confirm"
    algorithm: aggregation
    formula: |
      concurrent = count(Adoption a where a.donor_id == donor.id
                         and a.campaign_id == campaign.id
                         and a.status in {PLEDGED, CONFIRMED, PARTIALLY_RECEIVED})
      must satisfy: concurrent < donor.max_adoptions_per_season
    input_set: "Adoptions for this donor in this campaign filtered to non-terminal, non-cancelled statuses"
    precision: "integer count"
    variants: []

  - name: backfill_budget_projection
    trigger: "on BackfillPurchase create (provisional) and mark-purchased (final)"
    algorithm: forward_looking
    formula: |
      provisional_remaining = campaign.backfill_budget_cents
                              - campaign.backfill_spent_cents
                              - sum(quoted_cost_cents over BackfillPurchase where status == ORDERED)
      # At mark-purchased time:
      final_spent = campaign.backfill_spent_cents + final_cost_cents
      must satisfy: final_spent <= campaign.backfill_budget_cents
    input_set: "ORDERED purchases contribute at quoted_cost_cents to the provisional; PURCHASED contribute at final_cost_cents to the actual"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "computed at POST /backfill-purchases using quoted_cost_cents"
        difference: "optimistic — quoted cost may differ from receipt cost"
      - name: final
        when: "computed at POST /backfill-purchases/{id}/mark-purchased using final_cost_cents"
        difference: "authoritative — only variant that mutates campaign.backfill_spent_cents"

  - name: backfill_child_selector
    trigger: "on POST /toy-drive/campaigns/{id}/backfill/select — picks the next batch of BACKFILL_ELIGIBLE children to source"
    algorithm: weighted_scoring
    formula: |
      candidates = Child c where c.status == BACKFILL_ELIGIBLE
                   and c.family.campaign_id == campaign.id
                   and c.family.status in {MATCHED, PARTIALLY_FULFILLED}
      score(c) = (100 * priority_weight(c)) + age_urgency(c) + wait_days(c)
      priority_weight(c) = min(c.wish_items[status==APPROVED].priority_rank)  # lower rank -> higher weight: (11 - rank) / 10
      age_urgency(c)     = (18 - age_years(c)) * 2  # younger children prioritized
      wait_days(c)       = whole days between c.family.verified_at and current_utc, capped at 30
      rank descending by score; tie-break by family.verified_at ASC, then by child.created_at ASC
      select top N by rank; if budget is insufficient for a child's full wish list, skip that child and continue down the ranking
    input_set: "Children in BACKFILL_ELIGIBLE whose family is MATCHED or PARTIALLY_FULFILLED"
    constants:
      WAIT_DAY_CAP: 30
      AGE_BASELINE: 18
    precision: "score to 2 decimal places, round_half_up"
    variants: []

  - name: distribution_slot_overlap
    trigger: "on POST /toy-drive/distribution-slots and PATCH /toy-drive/distribution-slots/{id}"
    algorithm: interval_merge
    formula: |
      # A new slot [window_start, window_end) for family F in lane L is rejected iff
      # there exists another slot S for the SAME family (any lane) such that
      #   S.window_start < new.window_end AND new.window_start < S.window_end
      # i.e. half-open interval overlap on the family axis. Adjacent windows
      # (new.window_start == S.window_end) are permitted.
      # Separately, a lane-level aggregate capacity check applies: within any
      # 30-minute bucket, count(slots in same lane overlapping the bucket) must
      # be <= LANE_BUCKET_CAPACITY.
    input_set: "DistributionSlot rows under the same event filtered by family_id (first check) and by lane + overlapping 30-min bucket (second check)"
    constants:
      LANE_BUCKET_CAPACITY: 4
      BUCKET_MINUTES: 30
    precision: "intervals are half-open [start, end); bucket boundaries align to :00 and :30 UTC"
    variants: []

  - name: duplicate_hash
    trigger: "on Family create and on Family PATCH of caregiver_dob / phone_last4 / address_text"
    algorithm: aggregation
    formula: |
      normalized = lower(trim(caregiver_dob)) | "|" | phone_last4 | "|" | digits_only(address_text)
      duplicate_hash = SHA256( SeasonSettings.duplicate_hash_salt | ":" | normalized ) as lowercase hex
      # On create: scan Family rows in same campaign with identical duplicate_hash;
      # for each match, create a DuplicateFlag(detected_by=AUTO_HASH, family_id=new, other_family_id=match).
    input_set: "Family rows in the same campaign with equal duplicate_hash and status not in {REJECTED, WITHDRAWN, CLOSED}"
    precision: "64-char lowercase hex"
    variants: []

  - name: thank_you_template_selector
    trigger: "on POST /toy-drive/campaigns/{id}/thank-you-notes/generate"
    algorithm: tiered_pricing
    formula: |
      for each Donor d with giving_history_cents > 0 in this campaign and d.thank_you_opt_in:
        prior_seasons = count(distinct campaigns c' < campaign.season_year where d gave)
        if d.giving_history_cents_all_time >= SeasonSettings.major_donor_threshold_cents:
          template = MAJOR_DONOR
        elif prior_seasons == 0:
          template = FIRST_TIME
        elif d's most recent gift before this campaign was >= 2 seasons ago:
          template = LAPSED_RETURNING
        else:
          template = STANDARD
      # Personalization token: SHA256(donor.id | campaign.id | template)[:16]
    input_set: "Donors with at least one Gift in {RECEIVED, DELIVERED} attributed to this campaign"
    precision: "template is an enum; token is 16-char hex"
    variants: []

  - name: family_fulfillment_rollup
    trigger: "on every Child status transition; maintains family.fulfilled_children_count and may flip family.status"
    algorithm: aggregation
    formula: |
      fulfilled = count(Child c where c.family_id == family.id
                        and c.status in {DELIVERED, BACKFILL_PURCHASED})
      total = count(Child c where c.family_id == family.id
                    and c.status != CLOSED)
      family.fulfilled_children_count = fulfilled
      family.total_children_count = total
      # Status rollup rules:
      #   fulfilled == 0                    -> MATCHED (if family was MATCHED/PARTIALLY_FULFILLED)
      #   0 < fulfilled < total             -> PARTIALLY_FULFILLED
      #   fulfilled == total and total > 0  -> FULFILLED if all via DELIVERED,
      #                                        BACKFILLED if at least one via BACKFILL_PURCHASED
    input_set: "Child rows of the family, excluding CLOSED"
    precision: "integer counts"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and in declared role set; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role in X-User-Role is permitted for this endpoint per §1.5 roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id templated into the URL path resolves to an existing row (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every *_id field in request body resolves to an existing row (e.g. family_id, child_ids, wish_item_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all POST/PUT/PATCH with body FKs"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "OCC expected_*_version, when the endpoint declares one, equals the current row version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints listed in §1.2.1 concurrency_rules"

  - priority: 7
    category: business_safety
    check: "PII access: donor-facing reads NEVER return caregiver name, dob, address, phone; only first_name, age_band, interest_tags (and clothing_size only under STANDARD privacy_mode)"
    error_id: ERR_PRIVACY_VIOLATION
    http_status: 403
    applies_to: "GET endpoints under /toy-drive/donor/*"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the CaseWorker who began review on a family (FamilyAuditEvent STATUS_CHANGE REFERRED->UNDER_REVIEW) MUST NOT also be the actor of verify; likewise a PlatformAdmin who created a BackfillPurchase MUST NOT mark it purchased"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /toy-drive/families/{id}/verify; POST /toy-drive/backfill-purchases/{id}/mark-purchased"

  - priority: 9
    category: business_temporal
    check: "Campaign window: family-create requires intake_open_at <= current_utc <= intake_close_at and campaign.status == INTAKE_OPEN"
    error_id: ERR_INTAKE_CLOSED
    http_status: 409
    applies_to: "POST /toy-drive/families"

  - priority: 10
    category: business_temporal
    check: "Gift receive window: gift receive requires current_utc <= adoption.return_deadline OR (within grace window AND override_note non-empty)"
    error_id: ERR_RETURN_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /toy-drive/gifts/{id}/receive"

  - priority: 11
    category: business_temporal
    check: "Slot check-in window: check-in requires window_start <= current_utc <= window_end"
    error_id: ERR_OUTSIDE_SLOT_WINDOW
    http_status: 409
    applies_to: "POST /toy-drive/distribution-slots/{id}/check-in"

  - priority: 12
    category: business_temporal
    check: "Adoption confirm window: confirm requires current_utc <= pledged_at + 72h"
    error_id: ERR_PLEDGE_EXPIRED
    http_status: 409
    applies_to: "POST /toy-drive/adoptions/{id}/confirm"

  - priority: 13
    category: business_constraint
    check: "Uniqueness: campaign.season_year unique; agency.agency_code unique; donor.email unique; WishItem.priority_rank unique per child"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST/PATCH on the respective collections"

  - priority: 14
    category: business_constraint
    check: "Referral quota: agency.referral_used_count < agency.referral_quota (families in non-terminal status count; REJECTED/WITHDRAWN do not)"
    error_id: ERR_AGENCY_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /toy-drive/families"

  - priority: 15
    category: business_constraint
    check: "Per-family child cap: family.total_children_count < campaign.max_children_per_family"
    error_id: ERR_FAMILY_CHILD_CAP
    http_status: 409
    applies_to: "POST /toy-drive/families/{family_id}/children"

  - priority: 16
    category: business_constraint
    check: "Child age: computed age_years at campaign.distribution_date < 19"
    error_id: ERR_CHILD_TOO_OLD
    http_status: 422
    applies_to: "POST /toy-drive/families/{family_id}/children"

  - priority: 17
    category: business_constraint
    check: "Wish-item value: sum of child's APPROVED + REQUESTED items after this write <= campaign.max_gift_value_cents"
    error_id: ERR_WISH_VALUE_EXCEEDED
    http_status: 422
    applies_to: "POST /toy-drive/children/{child_id}/wish-items; POST /toy-drive/wish-items/{id}/approve"

  - priority: 18
    category: business_constraint
    check: "Donor concurrent adoption cap: count(adoptions in {PLEDGED, CONFIRMED, PARTIALLY_RECEIVED} for this donor & campaign) < donor.max_adoptions_per_season"
    error_id: ERR_ADOPTION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /toy-drive/adoptions; POST /toy-drive/adoptions/{id}/confirm"

  - priority: 19
    category: business_constraint
    check: "Slot overlap (family axis): no two slots for same family may have overlapping half-open windows"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /toy-drive/distribution-slots; PATCH /toy-drive/distribution-slots/{id}"

  - priority: 20
    category: business_constraint
    check: "Lane bucket capacity: within any 30-minute bucket, slots in same lane <= LANE_BUCKET_CAPACITY (4)"
    error_id: ERR_LANE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /toy-drive/distribution-slots; PATCH /toy-drive/distribution-slots/{id}"

  - priority: 21
    category: business_referential
    check: "Adoption coverage: every child_id in adoption.child_ids belongs to adoption.family_id and is in WISH_LOCKED; for WHOLE_FAMILY scope, family must have >= 1 WISH_LOCKED child"
    error_id: ERR_ADOPTION_COVERAGE_INVALID
    http_status: 422
    applies_to: "POST /toy-drive/adoptions"

  - priority: 22
    category: business_referential
    check: "Gift-to-wish-item consistency: if gift.wish_item_id is supplied, wish_item.child_id must equal gift.child_id and wish_item.status must be APPROVED or COMMITTED"
    error_id: ERR_GIFT_WISH_MISMATCH
    http_status: 422
    applies_to: "POST /toy-drive/gifts"

  - priority: 23
    category: business_referential
    check: "Slot family consistency: slot.family_id must be in {MATCHED, PARTIALLY_FULFILLED, FULFILLED, BACKFILLED} under the same campaign as the event"
    error_id: ERR_SLOT_FAMILY_MISMATCH
    http_status: 422
    applies_to: "POST /toy-drive/distribution-slots"

  - priority: 24
    category: business_referential
    check: "Stage consistency: gift may only be staged into a slot whose family_id == gift.child.family_id and whose event is in SORTING"
    error_id: ERR_STAGE_SLOT_MISMATCH
    http_status: 422
    applies_to: "POST /toy-drive/gifts/{id}/stage"

  - priority: 25
    category: business_fiscal
    check: "Wish-item minimum value: at adoption confirm, commitment_cents must be >= campaign.min_gift_value_cents * covered_child_count"
    error_id: ERR_COMMITMENT_TOO_LOW
    http_status: 422
    applies_to: "POST /toy-drive/adoptions/{id}/confirm"

  - priority: 26
    category: business_fiscal
    check: "Backfill budget: campaign.backfill_spent_cents + final_cost_cents <= campaign.backfill_budget_cents"
    error_id: ERR_BACKFILL_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /toy-drive/backfill-purchases/{id}/mark-purchased"

  - priority: 27
    category: business_fiscal
    check: "Gift declared value: gift.declared_value_cents <= campaign.max_gift_value_cents (per-item cap)"
    error_id: ERR_GIFT_VALUE_EXCEEDED
    http_status: 422
    applies_to: "POST /toy-drive/gifts"

  - priority: 28
    category: business_constraint
    check: "Event window sanity: event.end_at > event.start_at; slot window within event window"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /toy-drive/distribution-events; POST /toy-drive/distribution-slots; PATCH endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Campaign ---
  - method: POST
    path: "/toy-drive/campaigns"
    description: Create a new campaign in DRAFT
    roles: [PlatformAdmin]
    code: 201
    input: [season_year, intake_open_at, intake_close_at, gift_return_deadline, distribution_date, max_children_per_family, max_gift_value_cents, min_gift_value_cents, backfill_budget_cents, "privacy_mode?"]
    output: Campaign
    side_effects: []

  - method: GET
    path: "/toy-drive/campaigns"
    description: List campaigns with pagination
    roles: [PlatformAdmin, CaseWorker, AgencyCoordinator, Donor, DistributionVolunteer]
    code: 200
    input: ["limit?", "offset?", "status?", "season_year?"]
    output: Campaign[]
    side_effects: []

  - method: GET
    path: "/toy-drive/campaigns/{id}"
    description: Fetch one campaign
    roles: [PlatformAdmin, CaseWorker, AgencyCoordinator, Donor, DistributionVolunteer]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: PATCH
    path: "/toy-drive/campaigns/{id}"
    description: Edit campaign fields while DRAFT; distribution_date may shift while INTAKE_OPEN with child-age-band side effects
    roles: [PlatformAdmin]
    code: 200
    input: ["intake_open_at?", "intake_close_at?", "gift_return_deadline?", "distribution_date?", "max_children_per_family?", "max_gift_value_cents?", "min_gift_value_cents?", "backfill_budget_cents?", "privacy_mode?"]
    output: Campaign
    side_effects: ["increments campaign.version", "if distribution_date changed: recompute every Child.age_band under campaign"]

  - method: POST
    path: "/toy-drive/campaigns/{id}/open-intake"
    description: DRAFT -> INTAKE_OPEN
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: ["campaign.status transition", "increments campaign.version"]

  - method: POST
    path: "/toy-drive/campaigns/{id}/close-intake"
    description: INTAKE_OPEN -> MATCHING; rejects incomplete families
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: ["campaign.status transition", "cascade-reject REFERRED/UNDER_REVIEW families", "increments campaign.version"]

  - method: POST
    path: "/toy-drive/campaigns/{id}/advance"
    description: MATCHING -> DISTRIBUTION_PREP -> DISTRIBUTION -> RECONCILIATION stepper with OCC
    roles: [PlatformAdmin]
    code: 200
    input: [expected_campaign_version]
    output: Campaign
    side_effects: ["campaign.status transition", "expiry cascades", "increments campaign.version"]

  - method: POST
    path: "/toy-drive/campaigns/{id}/close"
    description: RECONCILIATION -> CLOSED
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: ["increments campaign.version"]

  - method: POST
    path: "/toy-drive/campaigns/{id}/backfill/select"
    description: Run the backfill child selector, creating BackfillPurchase rows in ORDERED status for the top-N eligible children
    roles: [PlatformAdmin]
    code: 201
    input: [limit]
    output: BackfillPurchase[]
    side_effects: ["creates BackfillPurchase rows per backfill_child_selector calculation"]

  - method: POST
    path: "/toy-drive/campaigns/{id}/thank-you-notes/generate"
    description: Generate QUEUED ThankYouNote rows per donor for this campaign
    roles: [PlatformAdmin]
    code: 201
    input: []
    output: ThankYouNote[]
    side_effects: ["creates ThankYouNote rows per thank_you_template_selector calculation"]

  # --- PartnerAgency ---
  - method: POST
    path: "/toy-drive/agencies"
    description: Register a partner agency
    roles: [PlatformAdmin]
    code: 201
    input: [agency_code, legal_name, referral_quota, contact_email]
    output: PartnerAgency
    side_effects: []

  - method: GET
    path: "/toy-drive/agencies"
    description: List agencies
    roles: [PlatformAdmin, CaseWorker, AgencyCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: PartnerAgency[]
    side_effects: []

  - method: GET
    path: "/toy-drive/agencies/{id}"
    description: Fetch one agency
    roles: [PlatformAdmin, CaseWorker, AgencyCoordinator]
    code: 200
    input: []
    output: PartnerAgency
    side_effects: []

  - method: POST
    path: "/toy-drive/agencies/{id}/suspend"
    description: Suspend an agency; blocks new referrals
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PartnerAgency
    side_effects: ["agency.status -> SUSPENDED", "increments agency.version"]

  - method: GET
    path: "/toy-drive/agencies/{id}/families"
    description: "Reverse-reachability: list families referred by an agency"
    roles: [PlatformAdmin, CaseWorker, AgencyCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Family[]
    side_effects: []

  # --- Family ---
  - method: POST
    path: "/toy-drive/families"
    description: Submit a family referral
    roles: [AgencyCoordinator]
    code: 201
    input: [agency_id, campaign_id, primary_caregiver_name, caregiver_dob, household_size, address_text, phone_last4]
    output: Family
    side_effects: ["computes duplicate_hash", "creates DuplicateFlag rows for any hash collision when SeasonSettings.duplicate_auto_detect_enabled", "writes FamilyAuditEvent(STATUS_CHANGE)"]

  - method: GET
    path: "/toy-drive/families"
    description: List families (filtered by campaign/agency/status); donors get PII-scrubbed view
    roles: [PlatformAdmin, CaseWorker, AgencyCoordinator, Donor]
    code: 200
    input: ["limit?", "offset?", "campaign_id?", "agency_id?", "status?", "duplicate_of_family_id?"]
    output: Family[]
    side_effects: ["writes FamilyAuditEvent(PII_VIEW) when role is Donor"]

  - method: GET
    path: "/toy-drive/families/{id}"
    description: Fetch one family; donor role receives PII-scrubbed view
    roles: [PlatformAdmin, CaseWorker, AgencyCoordinator, Donor]
    code: 200
    input: []
    output: Family
    side_effects: ["writes FamilyAuditEvent(PII_VIEW) when role is Donor"]

  - method: GET
    path: "/toy-drive/families/{id}/children"
    description: "Reverse-reachability: list children of a family"
    roles: [PlatformAdmin, CaseWorker, AgencyCoordinator, Donor]
    code: 200
    input: ["limit?", "offset?"]
    output: Child[]
    side_effects: []

  - method: GET
    path: "/toy-drive/families/{id}/audit-events"
    description: "Reverse-reachability: list FamilyAuditEvent rows for a family (admin/caseworker only)"
    roles: [PlatformAdmin, CaseWorker]
    code: 200
    input: ["limit?", "offset?", "event_type?"]
    output: FamilyAuditEvent[]
    side_effects: []

  - method: POST
    path: "/toy-drive/families/{id}/begin-review"
    description: REFERRED -> UNDER_REVIEW
    roles: [CaseWorker]
    code: 200
    input: []
    output: Family
    side_effects: ["writes FamilyAuditEvent(STATUS_CHANGE)"]

  - method: POST
    path: "/toy-drive/families/{id}/verify"
    description: UNDER_REVIEW -> VERIFIED; enforces segregation of duties vs begin-review actor
    roles: [CaseWorker]
    code: 200
    input: ["verification_note?"]
    output: Family
    side_effects: ["stamps verified_at", "cascades children to WISH_LOCKED", "writes FamilyAuditEvent(STATUS_CHANGE)"]

  - method: POST
    path: "/toy-drive/families/{id}/reject"
    description: UNDER_REVIEW -> REJECTED
    roles: [CaseWorker]
    code: 200
    input: ["verification_note?"]
    output: Family
    side_effects: ["cascade-closes children and wish items", "writes FamilyAuditEvent(STATUS_CHANGE)"]

  - method: POST
    path: "/toy-drive/families/{id}/return-to-referral"
    description: UNDER_REVIEW -> REFERRED (cyclic revision loop)
    roles: [CaseWorker]
    code: 200
    input: ["verification_note?"]
    output: Family
    side_effects: ["writes FamilyAuditEvent(STATUS_CHANGE)"]

  - method: POST
    path: "/toy-drive/families/{id}/withdraw"
    description: VERIFIED -> WITHDRAWN when no active adoption exists
    roles: [CaseWorker]
    code: 200
    input: ["verification_note?"]
    output: Family
