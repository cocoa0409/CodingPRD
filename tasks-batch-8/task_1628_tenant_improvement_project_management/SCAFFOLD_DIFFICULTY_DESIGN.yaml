              payload: { contractor_id: "${ctr_id}", waiver_type: "UNCONDITIONAL_PROGRESS", amount_cents: 10000000 }
              as: ContractorRep
              as_user_id: "${ctr_id}"
              captures: { w3: $.data.id }
            - call: "POST /api/lien-waivers/${w3}/verify"
              as: LandlordPM
            - call: "POST /api/disbursement-requests/${d3}/approve"
              payload: { approved_amount_cents: 10000000 }
              as: LandlordApprover
              as_user_id: "approver-1"
            - call: "GET /api/ti-projects/${proj_id}"
              as: LandlordPM
              captures: { pv4: $.data.version }
            - call: "POST /api/ti-projects/${proj_id}/disbursement-requests"
              payload: { period_end_date: "2026-08-14T00:00:00Z", requested_amount_cents: 5000000, is_final_draw: true, expected_ti_project_version: "${pv4}" }
              as: ContractorRep
              as_user_id: "${ctr_id}"
              captures: { d4: $.data.id }
            - call: "POST /api/disbursement-requests/${d4}/submit"
              as: ContractorRep
              as_user_id: "${ctr_id}"
            - call: "POST /api/disbursement-requests/${d4}/lien-waivers"
              payload: { contractor_id: "${ctr_id}", waiver_type: "UNCONDITIONAL_FINAL", amount_cents: 5000000 }
              as: ContractorRep
              as_user_id: "${ctr_id}"
              captures: { w4: $.data.id }
            - call: "POST /api/lien-waivers/${w4}/verify"
              as: LandlordPM
            - call: "POST /api/disbursement-requests/${d4}/approve"
              payload: { approved_amount_cents: 5000000 }
              as: LandlordApprover
              as_user_id: "approver-1"
          trigger:
            - call: "POST /api/disbursement-requests/${d4}/pay"
              as: LandlordPM
            - call: "GET /api/ti-projects/${proj_id}"
              as: LandlordPM
              captures: { held_end: $.data.retainage_held_cents, released_end: $.data.retainage_released_cents, consumed_end: $.data.allowance_consumed_cents }
          assert:
            - "Before pay: final draw retainage_held_cents == 0 (final-draw branch), net_payment_cents == 5000000"
            - "After pay: TIProject.${proj_id}.retainage_held_cents == 0"
            - "TIProject.${proj_id}.retainage_released_cents == 3000000"
            - "Escrow invariant: held(0) + released(3000000) == sum of per-draw retainage withheld (1000000+1500000+500000 == 3000000)"
            - "TIProject.${proj_id}.allowance_consumed_cents == 40000000"
