            - "After cancel: PurchaseOrder.${po_id}.fulfillment_status == READY_TO_SHIP and shipment_id == null (compensation of the attach)"
            - "BudgetLine.${bl_id}.committed_cents == 600000 unchanged (detach is not a cancellation; no fiscal drift)"
            - "Terminal lockdown: IN_TRANSIT from CANCELLED rejected 409 ERR_INVALID_SHIPMENT_TRANSITION"
            - "Shipment.${sh1_id}.status == CANCELLED"

      - name: project_completion_blocked_by_open_windows
        claim_type: precondition_enforcement
        grounds: ["state_machines.FFEProject.INSTALLATION_to_COMPLETED", "errors[ERR_WINDOWS_OUTSTANDING]"]
