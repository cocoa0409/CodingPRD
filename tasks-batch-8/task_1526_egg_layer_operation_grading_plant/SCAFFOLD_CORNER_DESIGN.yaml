# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Egg Layer Operation & Grading Plant. Breadth probe across §1.1–§1.7 claims
# not already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml (stubs mark those).
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------- entities
  - section: entities
    instances:
      - name: farm_creation_defaults_and_envelope
        claim_type: creation
        grounds: [entities.Farm, response_envelope]
        distinguishing_aspect: "POST /api/farms returns 201 with server fields and computed defaults: compliance_posture CLEAR, active_flock_count 0, version 1; success envelope carries meta.api_request_id, meta.api_request_timestamp, response_type == object."
        test_recipe:
          setup: ["empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/farms"
              payload: { name: "Default Farm", certification_program: "CAGE_FREE", daily_overhead_cents: 9000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
          assert:
            - "HTTP 201; envelope has meta.api_request_id and meta.api_request_timestamp and response_type == object"
            - "Farm.${farm_id}: compliance_posture == CLEAR, active_flock_count == 0, version == 1, id is a UUID"
      - name: flock_computed_age_and_lay_rate
        claim_type: computed_fields
        grounds: [entities.Flock.fields.age_weeks, entities.Flock.fields.current_lay_rate_pct, calculations.lay_curve_projection]
        distinguishing_aspect: "age_weeks derives from placement_date vs logical clock (2026-08-01 default): placement 2026-01-05 -> age_weeks 29; rate is 0.00 while PLACED and 95.00 (peak plateau) once the ops run advances the flock to LAYING."
        test_recipe:
          setup: ["farm + house exist; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Age Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: "$.data.id" }
          trigger:
            - call: "GET /api/flocks/${flock_id}"
              payload: {}
              as: FarmManager
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/flocks/${flock_id}"
              payload: {}
              as: FarmManager
          assert:
            - "before ops run: status == PLACED, age_weeks == 29, current_lay_rate_pct == 0.00 (non-LAYING branch)"
            - "after ops run: status == LAYING (PLACED->GROWING->LAYING in one run), current_lay_rate_pct == 95.00"
      - name: production_day_immutable_event_shape
        claim_type: immutability
        grounds: [entities.ProductionDay]
        distinguishing_aspect: "ProductionDay is common_fields:false (append-only event): the §1.5 surface declares no PUT/PATCH/DELETE route for it, and the GET response carries id and created_at but NO version or updated_at fields (unlike common_fields:true resources such as Flock)."
        test_recipe:
          setup: ["farm, house, LAYING flock; one production day recorded"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Event Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: "$.data.id" }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 100, rejected_eggs: 2, feed_issued_kg: 0, mortality_count: 0 }
              as: FarmManager
              captures: { pd_id: "$.data.id" }
          trigger:
            - call: "GET /api/production-days/${pd_id}"
              payload: {}
              as: FarmManager
            - call: "GET /api/flocks/${flock_id}"
              payload: {}
              as: FarmManager
          assert:
            - "ProductionDay.${pd_id} has id and created_at but no version and no updated_at keys (event entity)"
            - "Flock.${flock_id} DOES have version >= 2 (incremented by the production-day ledger update) — contrasting common_fields:true shape"
      - name: house_get_missing_returns_not_found
        claim_type: not_found
        grounds: [entities.House, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND (existence, priority 4)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/houses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: FarmManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404; err == ERR_NOT_FOUND"
      - name: lot_list_pagination_and_filter
        claim_type: listing
        grounds: [entities.EggLot, response_envelope]
        distinguishing_aspect: "GET /api/lots honors limit/offset with total_count and has_more; lifecycle_status filter narrows the set; deterministic order created_at ASC then size_class rank DESC puts the JUMBO lot first."
        test_recipe:
          setup: ["farm; LAYING flock; production 480 eggs; confirmed run (240 JUMBO + 240 LARGE) -> 2 lots"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Page Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: "$.data.id" }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 480, rejected_eggs: 0, feed_issued_kg: 0, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_id}", grade: "A", eggs_to_grade: 480 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_id: "$.data.id" }
            - call: "POST /api/grading-runs/${run_id}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 240, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
            - call: "POST /api/grading-runs/${run_id}/confirm"
              payload: {}
              as: QAManager
              as_user_id: "qa-1"
          trigger:
            - call: "GET /api/lots?limit=1&offset=0"
              payload: {}
              as: QAManager
            - call: "GET /api/lots?limit=1&offset=1"
              payload: {}
              as: QAManager
            - call: "GET /api/lots?lifecycle_status=FRESH"
              payload: {}
              as: QAManager
          assert:
            - "page 1: data length 1, total_count == 2, has_more == true, data[0].size_class == JUMBO (size-rank tie-break)"
            - "page 2: data length 1, has_more == false, data[0].size_class == LARGE"
            - "filter lifecycle_status=FRESH returns both lots (total_count == 2)"
      - name: production_day_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ProductionDay.fields.mortality_count, "errors[ERR_VALIDATION]", "validations[priority=5]"]
        distinguishing_aspect: "Omitting mortality_count (source input, no default) from POST /api/production-days is a 400 ERR_VALIDATION at priority 5."
        test_recipe:
          setup: ["farm; house; LAYING flock"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Req Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: "$.data.id" }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 100, rejected_eggs: 2, feed_issued_kg: 0 }
              as: FarmManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400; err == ERR_VALIDATION"

  # ---------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: lot_initial_state_after_confirm
        claim_type: initial_state
        grounds: [state_machines.EggLot, entities.EggLot.fields.sell_by_date, calculations.size_distribution_materialization]
        distinguishing_aspect: "A lot materialized by confirm starts lifecycle_status FRESH + hold_status CLEAR, with pack_date == clock date and sell_by_date == pack_date + 45 (CONVENTIONAL farm)."
        test_recipe:
          setup: ["CONVENTIONAL farm; LAYING flock; production 240 eggs; run confirmed at default clock 2026-08-01"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Init Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: "$.data.id" }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 240, rejected_eggs: 0, feed_issued_kg: 0, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_id}", grade: "AA", eggs_to_grade: 240 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_id: "$.data.id" }
            - call: "POST /api/grading-runs/${run_id}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 0, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
            - call: "POST /api/grading-runs/${run_id}/confirm"
              payload: {}
              as: QAManager
              as_user_id: "qa-1"
          trigger:
            - call: "GET /api/lots?grading_run_id=${run_id}"
              payload: {}
              as: QAManager
              captures: { lot_id: "$.data[0].id" }
          assert:
            - "EggLot.${lot_id}: lifecycle_status == FRESH, hold_status == CLEAR, grade == AA, size_class == LARGE, dozen_count == 20"
            - "pack_date == 2026-08-01 and sell_by_date == 2026-09-15 (45-day CONVENTIONAL shelf life); claim_program == CONVENTIONAL"
      - name: ship_shipped_lot_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.EggLot, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SHIPPED is a one-way door: the only outgoing edge is the system cascade to CLOSED, so a second POST /ship is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["farm; LAYING flock; production 240 eggs; confirmed run; contract ACTIVE; lot RELEASED + ALLOCATED + SHIPPED (clock 2026-08-01)"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Ship Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: "$.data.id" }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 240, rejected_eggs: 0, feed_issued_kg: 0, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_id}", grade: "A", eggs_to_grade: 240 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_id: "$.data.id" }
            - call: "POST /api/grading-runs/${run_id}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 0, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
            - call: "POST /api/grading-runs/${run_id}/confirm"
              payload: {}
              as: QAManager
              as_user_id: "qa-1"
            - call: "GET /api/lots?grading_run_id=${run_id}"
              payload: {}
              as: QAManager
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /api/contracts"
              payload: { farm_id: "${farm_id}", retailer_name: "RetailCo", pricing_model: "MARKET_INDEX", spread_cents: 5, margin_pct: 0, claim_premium_pct: 0, claim_required: "NONE", effective_start: "2026-01-01", effective_end: "2026-12-31", weekly_min_dozen: 10, max_open_dozen: 1000 }
              as: ContractManager
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/contracts/${contract_id}/activate"
              payload: {}
              as: ContractManager
            - call: "POST /api/lots/${lot_id}/release"
              payload: {}
              as: QAManager
            - call: "POST /api/lots/${lot_id}/allocate"
              payload: { contract_id: "${contract_id}" }
              as: ContractManager
            - call: "POST /api/lots/${lot_id}/ship"
              payload: {}
              as: ContractManager
          trigger:
            - call: "POST /api/lots/${lot_id}/ship"
              payload: {}
              as: ContractManager
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE; EggLot.${lot_id}.lifecycle_status remains SHIPPED; contract.shipped_dozen unchanged (20)"
      - name: release_expired_lot_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.EggLot, calculations.shelf_life_expiry, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Once the ops run moves a FRESH lot past its sell_by_date to EXPIRED (terminal), release is rejected ERR_INVALID_STATE — terminal states accept no transitions."
        test_recipe:
          setup: ["CONVENTIONAL farm; LAYING flock; production 240 eggs; run confirmed at clock 2026-08-01 (sell_by 2026-09-15); clock advanced to 2026-09-16 and ops run executed -> lot EXPIRED"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Lock Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: "$.data.id" }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 240, rejected_eggs: 0, feed_issued_kg: 0, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_id}", grade: "A", eggs_to_grade: 240 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_id: "$.data.id" }
            - call: "POST /api/grading-runs/${run_id}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 0, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
            - call: "POST /api/grading-runs/${run_id}/confirm"
              payload: {}
              as: QAManager
              as_user_id: "qa-1"
            - call: "GET /api/lots?grading_run_id=${run_id}"
              payload: {}
              as: QAManager
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/lots/${lot_id}/release"
              payload: {}
              as: QAManager
              captures: { err: "$.data.error_id" }
          assert:
            - "ops run moved the lot to EXPIRED (lots_expired == 1 in the run response)"
            - "err == ERR_INVALID_STATE; lifecycle_status remains EXPIRED"
      - name: grading_double_submit_rejected
        claim_type: idempotency
        grounds: [state_machines.GradingRun, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Repeating the submit trigger on an already-SUBMITTED run is not a silent no-op: the second submit is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["farm; LAYING flock; production 240 eggs; DRAFT run of 240"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Dup Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: "$.data.id" }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
              payload: { flock_id: "${flock_id}", lay_date: "2026-07-31", eggs_collected: 240, rejected_eggs: 0, feed_issued_kg: 0, mortality_count: 0 }
              as: FarmManager
            - call: "POST /api/grading-runs"
              payload: { flock_id: "${flock_id}", grade: "A", eggs_to_grade: 240 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { run_id: "$.data.id" }
            - call: "POST /api/grading-runs/${run_id}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 0, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
          trigger:
            - call: "POST /api/grading-runs/${run_id}/submit"
              payload: { peewee_count: 0, small_count: 0, medium_count: 0, large_count: 240, xlarge_count: 0, jumbo_count: 0, cracked_count: 0, dirty_count: 0, blood_spot_count: 0 }
              as: QualityGrader
              as_user_id: "grader-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_STATE; GradingRun.${run_id}.status remains SUBMITTED"

      - name: ops_run_expires_allocated_lot_and_releases_contract
        claim_type: side_effect_execution
        grounds: [state_machines.EggLot.ALLOCATED_to_EXPIRED, calculations.shelf_life_expiry, endpoints]
        distinguishing_aspect: "The daily ops run's shelf-life sweep also unwinds allocations: an ALLOCATED lot past sell_by becomes EXPIRED, its contract_id is cleared, and the contract's allocated_dozen drops back by dozen_count (20)."
        test_recipe:
          setup: ["CONVENTIONAL farm; LAYING flock; production 240 eggs; run confirmed at 2026-08-01; contract ACTIVE; lot RELEASED + ALLOCATED (allocated_dozen 20); clock advanced to 2026-09-16"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Sweep Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house_id: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house_id}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
              as: FarmManager
              captures: { flock_id: "$.data.id" }
            - call: "POST /api/ops/run-daily"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/production-days"
