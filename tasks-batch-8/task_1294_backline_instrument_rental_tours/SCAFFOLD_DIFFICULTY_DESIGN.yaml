  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_source
        grounds:
          - validations[priority=4]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DEPOSIT_INSUFFICIENT]
        distinguishing_aspect: |
          Pair state-vs-business_fiscal on the source endpoint: the rider line
          is already CANCELLED (state violation, priority 4) AND the STANDARD
          artist's balance 0 cannot cover the 55000 hold (fiscal violation,
          priority 14); the response must be ERR_INVALID_STATE, never
          ERR_DEPOSIT_INSUFFICIENT.
        test_recipe:
          setup:
            - "STANDARD artist with balance 0 (no top-up); rider line created then cancelled; unit AVAILABLE"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Conflict Act", tier: "STANDARD" }
              as: OpsManager
              captures: { xa: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "XC-AMP-1", category: "AMP", daily_rate_cents: 10000, replacement_value_cents: 300000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { xm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${xm}", serial_number: "XC-U1", home_city_code: "LAX" }
              as: OpsManager
            - call: "POST /backline/tours"
              payload: { artist_id: "${xa}", name: "Conflict Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", insurance_policy_id: "POL-X" }
              as: TourManager
              captures: { xt: $.data.id }
            - call: "POST /backline/tours/${xt}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
              captures: { xs: $.data.id }
            - call: "POST /backline/tour-stops/${xs}/rider-lines"
              payload: { gear_model_id: "${xm}", quantity: 1 }
              as: TourManager
              captures: { xrl: $.data.id }
            - call: "POST /backline/rider-lines/${xrl}/cancel"
              payload: {}
              as: TourManager
          trigger:
            - call: "POST /backline/rider-lines/${xrl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-11T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { act_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 (state beats fiscal even though artist balance 0 would also fail ERR_DEPOSIT_INSUFFICIENT)"

      - name: safety_vs_referential_on_damage_assess
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_VENDOR_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Pair business_safety-vs-business_referential on a different error
          axis: a DamageClaim assess attempted by the same user who filed it,
          where the claim's reservation is also cross-rental-linked to a
          SUSPENDED vendor, must return ERR_SEGREGATION_OF_DUTIES (priority 6
          safety beats priority 13 referential).
        test_recipe:
          setup:
            - "Claim FILED by warehouse tech user WT-1 (filed_by_user_id WT-1) on a delivered reservation"
            - "The reservation's tour references vendor V which has since been SUSPENDED (referential inconsistency present)"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "SoD Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
              captures: { sa: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "SD-GTR-1", category: "GUITAR", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { sm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${sm}", serial_number: "SD-U1", home_city_code: "LAX" }
