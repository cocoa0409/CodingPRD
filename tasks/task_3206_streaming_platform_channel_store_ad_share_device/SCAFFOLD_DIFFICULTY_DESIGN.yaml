            - call: "POST /channels"
              payload: { publisher_id: "${p1}", name: "SC1", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${p1}"
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /channels"
              payload: { publisher_id: "${p2}", name: "SC2", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${p2}"
              captures: { c2: $.data.id, c2_v: $.data.version }
            - call: "POST /channels/${c1}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${c1_v}" }
              as: Publisher
              as_user_id: "${p1}"
              captures: { v1: $.data.id }
            - call: "POST /channels/${c2}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${c2_v}" }
              as: Publisher
              as_user_id: "${p2}"
              captures: { v2: $.data.id }
            - call: "POST /channel-versions/${v1}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${v1}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channel-versions/${v2}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${v2}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${c1}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channels/${c2}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${p1}", channel_id: "${c1}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 100000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${p1}"
              captures: { k1: $.data.id }
            - call: "POST /campaigns"
              payload: { publisher_id: "${p2}", channel_id: "${c2}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 100000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${p2}"
              captures: { k2: $.data.id }
            - call: "POST /campaigns/${k1}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${p1}"
            - call: "POST /campaigns/${k1}/start"
              payload: {}
              as: AdOps
            - call: "POST /campaigns/${k2}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${p2}"
            - call: "POST /campaigns/${k2}/start"
              payload: {}
              as: AdOps
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k1}", slot_code: "HOME_ROW_2", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: Publisher
              as_user_id: "${p1}"
              captures: { b1: $.data.id }
            - call: "POST /channels/${c2}/policy-hold"
              payload: { held: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k2}", slot_code: "HOME_ROW_2", window_start: "2026-09-10T11:00:00Z", window_end: "2026-09-10T13:00:00Z" }
              as: Publisher
              as_user_id: "${p2}"
              captures: { err: $.data.error_id }
          assert:
            - "Channel.${c2}.status == PUBLISHED and policy_hold == true (safety gate violated without a state violation)"
            - "The requested window [11:00,13:00) overlaps booking ${b1} [09:00,12:00) (temporal gate violated)"
            - "err == ERR_CONTENT_POLICY_BLOCK with http 422 — business_safety (priority 8) beats business_temporal (priority 9)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ad_slot_split_floor_at_exactly_divisible_vs_off_by_one
        grounds:
          - calculations.ad_slot_split
          - entities.AdSlotGrant.fields.publisher_slots
          - endpoints.POST_/ad-slot-grants
        distinguishing_aspect: |
          Metric: integer slot-count floor. At total_slots=1000 with 7000 bps the
          product is exactly divisible (700 publisher / 300 platform); at
          total_slots=1001 the floor discards 0.7 of a slot and the platform
          absorbs the remainder (700 / 301). Reached via POST /ad-slot-grants.
        test_recipe:
          setup:
            - "Clock default. Publisher P (ad bps 7000) with two PUBLISHED channels C1, C2."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Bnd Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "BC1", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "BC2", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { c2: $.data.id, c2_v: $.data.version }
            - call: "POST /channels/${c1}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${c1_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { v1: $.data.id }
            - call: "POST /channels/${c2}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${c2_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { v2: $.data.id }
            - call: "POST /channel-versions/${v1}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${v1}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channel-versions/${v2}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${v2}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${c1}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channels/${c2}/publish"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /ad-slot-grants"
              payload: { channel_id: "${c1}", period: "2026-09", total_slots: 1000 }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /ad-slot-grants"
              payload: { channel_id: "${c2}", period: "2026-09", total_slots: 1001 }
              as: PlatformAdmin
              captures: { g2: $.data.id }
          assert:
            - "AdSlotGrant.${g1}: publisher_slots == 700 and platform_slots == 300 (exact division, no remainder)"
            - "AdSlotGrant.${g2}: publisher_slots == 700 and platform_slots == 301 (floor(700.7) discards the fraction; platform absorbs it)"
            - "INV-SLOT holds on both: 700+300 == 1000 and 700+301 == 1001"

      - name: placement_booking_half_open_adjacency_and_zero_length
        grounds:
          - calculations.placement_overlap_check
          - errors.ERR_SLOT_OVERLAP
          - endpoints.POST_/placement-bookings
        distinguishing_aspect: |
          Metric: interval adjacency on a time window (not a count). On the same
          slot, [12:00,14:00) after [09:00,12:00) succeeds because touching
          endpoints do not overlap in half-open semantics; [11:00,13:00) fails
          with ERR_SLOT_OVERLAP; [12:00,12:00) is a zero-length shape error.
          Reached via POST /placement-bookings.
        test_recipe:
          setup:
            - "Clock default. Publisher P, channel C PUBLISHED, campaign K ACTIVE with flight covering 2026-09. Existing HELD booking B1 on HOME_ROW_3 [2026-09-10T09:00, 2026-09-10T12:00)."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Adj Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Adj Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 100000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { k: $.data.id }
            - call: "POST /campaigns/${k}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /campaigns/${k}/start"
              payload: {}
              as: AdOps
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k}", slot_code: "HOME_ROW_3", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k}", slot_code: "HOME_ROW_3", window_start: "2026-09-10T12:00:00Z", window_end: "2026-09-10T14:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { b2: $.data.id }
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k}", slot_code: "HOME_ROW_3", window_start: "2026-09-10T11:00:00Z", window_end: "2026-09-10T13:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /placement-bookings"
              payload: { campaign_id: "${k}", slot_code: "HOME_ROW_3", window_start: "2026-09-10T15:00:00Z", window_end: "2026-09-10T15:00:00Z" }
