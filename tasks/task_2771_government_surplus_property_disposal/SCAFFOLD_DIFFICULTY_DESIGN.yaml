              as: DisposalOfficer
              as_user_id: "officer-01"
            - call: "POST /screening-cycles"
              payload: { asset_id: "${a_c}", opens_at: "2026-08-14T00:00:00Z", tier_window_days: 5 }
              as: DisposalOfficer
              as_user_id: "officer-01"
              captures: { cyc_c: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
