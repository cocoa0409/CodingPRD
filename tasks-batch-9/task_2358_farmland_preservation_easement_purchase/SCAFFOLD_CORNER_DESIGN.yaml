              call: "POST /applications/${app_t3_id}/appraisals"
              payload: { appraiser_user_id: "appraiser-2", appraiser_firm: "Octoraro Valuation", engagement_start: "2026-08-12T00:00:00Z", engagement_end: "2026-08-26T00:00:00Z", method: "PAIRED_SALES" }
              as: AcquisitionOfficer
