  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: vote_meeting_state_beats_recusal_safety_check
        grounds:
          - validations[priority=42]
          - validations[priority=51]
          - errors[ERR_MEETING_NOT_OPEN]
          - errors[ERR_RECUSED_MEMBER_VOTED]
          - calculations.disclosure_recusal_classification
        distinguishing_aspect: |
          One request violates a `state` rule at priority 42 (the parent meeting is still NOTICED,
          not OPEN) and a `business_safety` rule at priority 51 (bm2 holds a FINANCIAL disclosure on
          the item's policy and appears in yes_member_ids). The response must be
          ERR_MEETING_NOT_OPEN with HTTP 409, never ERR_RECUSED_MEMBER_VOTED. Category pair:
          state versus business_safety.
        test_recipe:
          setup:
            - "Three SEATED trustees; bm1 holds office PRESIDENT."
            - "Policy BP-4119 (category PERSONNEL) with one DRAFT version pv1."
            - "bm2 filed a FINANCIAL conflict disclosure on that policy, so the disclosure is RECUSAL_REQUIRED."
            - "Meeting M (REGULAR, 2026-09-10T18:00:00Z) is NOTICED with a POSTED first-reading item; the meeting was never opened and the clock rests at 2026-08-01T00:00:00Z."
