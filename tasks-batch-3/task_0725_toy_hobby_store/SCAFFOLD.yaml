  - { id: ERR_OVERPAYMENT, http: 409, condition: "Order payment would exceed remaining balance" }
  - { id: ERR_LAYAWAY_OVERPAYMENT, http: 409, condition: "Layaway payment exceeds remaining_cents" }
  - { id: ERR_STALE_SPECIAL_ORDER_VERSION, http: 412, condition: "expected_special_order_version != current SpecialOrder.version" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Product.sku already exists" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Customer.email already exists" }
  - { id: ERR_ORDER_NOT_FULFILLED, http: 409, condition: "Return requested/approved on a non-FULFILLED order" }
  - { id: ERR_ORDER_NOT_READY, http: 409, condition: "Fulfill on an order not in READY" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "Fulfill on an order not fully PAID" }
  - { id: ERR_DUPLICATE_EVENT_REGISTRATION, http: 409, condition: "Customer already registered for this event" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CatalogAdmin
    description: "Manages product catalog, safety labeling, recalls, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /products, PATCH /products/{id}, activate, discontinue"
      - "POST /stores"
      - "POST /recalls, POST /recalls/{id}/issue"
      - "POST /_clock/set_current_utc"
    shared_operations: []

  - name: StoreManager
    description: "Manages allocations, special-order quotes, return approvals"
    identity: opaque
    exclusive_operations:
      - "POST /allocations, POST /allocations/{id}/release"
      - "POST /special-orders/{id}/quotes"
      - "POST /returns/{id}/approve"
    shared_operations: []

  - name: StoreAssociate
    description: "Front-line operations: inventory, orders on behalf, layaway, special orders, events, returns intake"
    identity: opaque
    exclusive_operations:
      - "POST /inventory, POST /inventory/{id}/receive"
      - "POST /customers"
      - "POST /orders/{id}/mark-ready, /fulfill"
      - "POST /layaways, /layaways/{id}/cancel"
      - "POST /special-orders, /special-orders/{id}/convert"
      - "POST /events"
      - "POST /returns"
    shared_operations:
      - "POST /orders, /orders/{id}/lines, /submit, /pay, /cancel (shared with Customer)"
      - "POST /layaways/{id}/payments (shared with Customer)"

  - name: Customer
    description: "Loyalty member acting on own orders, layaway payments, registries, event registration, special-order approval"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /registries, /registries/{id}/items, /registries/{id}/close"
      - "POST /events/{id}/register"
      - "POST /special-orders/{id}/approve"
    shared_operations:
      - "POST /orders, /orders/{id}/lines, /submit, /pay, /cancel (own customer_id only)"
      - "POST /layaways/{id}/payments (own layaway only)"

  - name: Any
    description: "Read access for all authenticated roles"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints (products, stores, inventory, allocations, customers, orders, order-lines, layaways, special-orders, recalls, events, registries, registry-items, returns)"
