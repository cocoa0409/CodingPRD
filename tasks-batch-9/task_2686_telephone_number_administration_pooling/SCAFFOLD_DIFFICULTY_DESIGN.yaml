            - "Level 5 reaches the untouched sibling: RateCenter.${rc_other_id}.jeopardy_flag == true and accepts_initial_requests == false"

      - name: reclamation_execution_strikes_carrier_into_probation_and_stalls_request
        grounds:
          - state_machines.ReclamationOrder.SURRENDER_ACKNOWLEDGED_to_EXECUTED
          - state_machines.NumberBlock.RECLAMATION_PENDING_to_AGING
          - state_machines.Carrier.ELIGIBLE_to_PROBATION
          - state_machines.AllocationRequest.PENDING_REVIEW_to_INFO_REQUESTED
          - calculations.activation_and_aging_schedule
          - entities.Carrier.fields.reclamation_strike_count
        distinguishing_aspect: |
          The second EXECUTE runs a four-level cascade that the first EXECUTE
          does not: block to AGING, blocks_held_count and strike counter,
          strike 2 flipping the carrier to PROBATION, and the probation
          reaching sideways into an unrelated PENDING_REVIEW GROWTH request
          which becomes INFO_REQUESTED without any reviewer touching it.
