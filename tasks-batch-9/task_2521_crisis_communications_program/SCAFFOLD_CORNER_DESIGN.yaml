      - name: corner_error_statement_reference_not_found_on_notice_create
        claim_type: Not Found
        excluded_because:
          difficulty_instance: priority_existence_outranks_incident_state_on_notice_create
          rationale: "ERR_STATEMENT_NOT_FOUND is raised there for an unknown statement_id, and the same instance proves it outranks the incident's response_state."

      - name: corner_error_task_already_decided_returns_not_pending
        claim_type: "Violation → Error"
        excluded_because:
          difficulty_instance: priority_task_state_outranks_review_deadline_on_decide
          rationale: "That instance decides an APPROVED task past the review deadline and asserts ERR_APPROVAL_TASK_NOT_PENDING rather than the deadline error."

      - name: corner_error_review_deadline_passed_on_late_decision
        claim_type: "Violation → Error"
        excluded_because:
          difficulty_instance: boundary_review_deadline_equality_on_decide
          rationale: "The deadline error is asserted at deadline + 1 second there, together with the accepting case at exact equality."

      - name: corner_error_escalation_threshold_not_met_below_seventy
        claim_type: "Violation → Error"
        excluded_because:
          difficulty_instance: boundary_escalation_score_at_exactly_seventy_on_escalate
          rationale: "69.99 / 70.00 / 70.01 are all exercised there against a LINKED signal, which is the only state in which the threshold is reachable."

      - name: corner_error_embargo_and_sequence_refusals_on_release
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: priority_embargo_outranks_notice_sequence_on_release
          rationale: "Both ERR_EMBARGO_NOT_REACHED and ERR_NOTICE_SEQUENCE_VIOLATION are produced there, in the order the validation table declares."

      - name: corner_error_statement_not_published_on_release
        claim_type: "Violation → Error"
        excluded_because:
          difficulty_instance: cross_entity_notice_release_gated_by_statement_publication
          rationale: "The unpublished-statement refusal and the success after publication are both asserted there."

      - name: corner_error_training_not_current_on_confirm
        claim_type: "Violation → Error"
        excluded_because:
          difficulty_instance: cross_entity_interview_confirmation_gated_by_member_training
          rationale: "A lapsed and an EXPIRED training status are both refused there, with the same booking confirming once training is renewed."

      - name: corner_error_escalation_path_unverified_on_platform_escalation
        claim_type: "Violation → Error"
        excluded_because:
          difficulty_instance: cross_entity_platform_escalation_gated_by_channel_verification
          rationale: "The refusal on an UNVERIFIED channel and the success after verification are asserted there."

      - name: corner_error_spokesperson_double_booked_within_the_buffer
        claim_type: "Violation → Error"
        excluded_because:
          difficulty_instance: overlap_spokesperson_calendar_closed_interval_with_thirty_minute_buffer
          rationale: "The buffer-widened closed-interval refusal is asserted there at 29, 30 and 31 minutes of separation."

      - name: corner_error_channel_correction_capacity_exhausted
        claim_type: "Violation → Error"
        excluded_because:
          difficulty_instance: overlap_channel_correction_airtime_half_open_aggregate_capacity
          rationale: "The capacity refusal and the touching-window acceptance are both asserted there against max_concurrent_corrections."

  - section: rbac
    instances:
      - name: corner_rbac_missing_x_user_header_is_unauthenticated
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations.priority_1_identity_headers
        distinguishing_aspect: "Authentication is checked before anything else, including role membership and body validation: a request with a valid role header but no X-User-ID is 401, and the same is true on a GET, so 401 never degrades into 403 or 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one TeamMember exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
          trigger:
            - call: "GET /crisis/team-members/${lead_id}"
              payload: {}
              as: ProgramAdmin
            - call: "POST /crisis/incidents"
              payload: { title: "Attempt with no identity", scenario_code: "SERVICE_OUTAGE" }
              as: IncidentLead
          assert:
            - "both requests are sent with X-User-Role present but the X-User-ID header omitted entirely"
            - "the GET returns status 401 with data.error_id ERR_UNAUTHENTICATED"
            - "the POST returns status 401 with data.error_id ERR_UNAUTHENTICATED, not ERR_ROLE_NOT_PERMITTED and not ERR_INVALID_REQUEST"
            - "sending X-User-ID as an empty string produces the same 401 on both calls"
            - "GET /crisis/incidents (with valid headers) returns total_count 0 — the refused POST created nothing"

