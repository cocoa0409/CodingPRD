      - name: appeal_remand_returns_a_counted_incident_to_under_review_and_voids_its_invoice
        grounds:
          - state_machines.Appeal.HEARD_to_REMANDED
          - state_machines.FalseAlarmIncident.APPEALED_to_UNDER_REVIEW
          - state_machines.PenaltyInvoice.PARTIALLY_PAID_to_VOIDED
          - calculations.payment_waterfall_allocation
          - entities.AlarmSite.fields.credit_balance_cents
        distinguishing_aspect: >-
          REMANDED drives the incident backwards out of a terminal-looking COUNTED state into
          UNDER_REVIEW, voiding its partially paid invoice, reversing the 5000-cent allocation into
          AlarmSite.credit_balance_cents, and dropping chargeable_count_window to 2 — then a second
          determination by a different review officer re-enters the cycle and issues a brand new
          15750-cent invoice while the voided one keeps its assessed_cents for audit.
        test_recipe:
          setup:
            - "Same fixture as appeal_denied_cycles_the_incident_back_to_counted_and_thaws_frozen_dunning up to the third COUNTED incident (occurrence_index 3, assessed 15000, invoice 15750)."
            - "A 5000-cent CHECK payment is posted EXPLICITly against that fee invoice on 2026-02-22, leaving it PARTIALLY_PAID with outstanding 10750."
            - "The appeal is filed 2026-02-25, scheduled onto the 2026-03-10T09:00Z session, and the session is held at 2026-03-10T10:00Z."
            - "No nightly run occurs in this instance, so the permit-issue invoices stay at 5500 each."
