            - "SimulationRun.${sim_c2}.bottleneck_segment_code == 'S-02' and bottleneck_availability_pct == 100"
            - "SimulationRun.${sim_c2}.shortfall_cph == 50 = 1250 - 1200"
            - "ConveyorSegment.${seg_c2a}.flow_share_bps == 5000 and ConveyorSegment.${seg_c2b}.flow_share_bps == 5000"
            - "ConveyorSegment.${seg_c2a}.derated_capacity_cph == 1500 and ConveyorSegment.${seg_c2b}.derated_capacity_cph == 600"

