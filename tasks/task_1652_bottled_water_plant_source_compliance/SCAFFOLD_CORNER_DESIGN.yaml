  # ---------------------------------------------------------------------------
  # Section: rbac
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: qa_officer_cannot_run_compliance_checkpoint
        claim_type: role_denied
        grounds: [roles.PlantAdmin.exclusive_operations]
        distinguishing_aspect: "POST /api/plants/{id}/compliance-runs is PlantAdmin-exclusive; QAOfficer is rejected 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["One plant exists"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant RB1" }, as: PlantAdmin, captures: { plant: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/compliance-runs", as: QAOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"

      - name: sanitation_lead_cannot_validate_run
        claim_type: role_denied
        grounds: [roles.QAOfficer.exclusive_operations]
        distinguishing_aspect: "POST /api/treatment-runs/{id}/validate is QAOfficer-exclusive; SanitationLead is rejected 403 ERR_FORBIDDEN even on a run that is ready to validate."
        test_recipe:
          setup: ["Plant with SPRING permit; run started with passing parameters recorded by pl-1"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant RB2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-RB2", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
            - { call: "POST /api/treatment-runs/${run}/start", as: ProductionLead, as_user_id: "pl-1" }
            - { call: "POST /api/treatment-runs/${run}/record-parameters", payload: { uv_dose_mj_cm2: 40.0, ozone_ct_mg_min_l: 1.6, turbidity_ntu: 0.3, micro_pore_micron: 0.2 }, as: ProductionLead, as_user_id: "pl-1" }
          trigger:
            - { call: "POST /api/treatment-runs/${run}/validate", as: SanitationLead, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
            - "TreatmentRun.${run}.status == IN_PROGRESS (rejection left state untouched)"

      - name: production_lead_cannot_publish_report
        claim_type: role_denied
        grounds: [roles.ComplianceOfficer.exclusive_operations]
        distinguishing_aspect: "POST /api/community-reports/{id}/publish is ComplianceOfficer-exclusive; ProductionLead is rejected 403 ERR_FORBIDDEN on an existing DRAFT."
        test_recipe:
          setup: ["Plant; DRAFT report for (2026, 8)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant RB3" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/community-reports", payload: { period_year: 2026, period_month: 8 }, as: ComplianceOfficer, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /api/community-reports/${rep}/publish", as: ProductionLead, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"
            - "CommunityWaterReport.${rep}.status == DRAFT"

      - name: compliance_officer_cannot_record_withdrawal
        claim_type: role_denied
        grounds: [roles.SourceMonitor.exclusive_operations]
        distinguishing_aspect: "Withdrawal recording is SourceMonitor-exclusive; the ComplianceOfficer (who owns the permit lifecycle) is rejected 403 ERR_FORBIDDEN — peer roles do not overlap."
        test_recipe:
          setup: ["Plant with SPRING permit"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant RB4" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-RB4", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 100, meter_reading_start_gallons: 0, meter_reading_end_gallons: 100, expected_permit_version: "${pv}" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN"

      - name: all_roles_can_read_plant
        claim_type: role_allowed
        grounds: [roles.PlantAdmin.shared_operations]
        distinguishing_aspect: "GET endpoints are shared by every declared role: all six roles read the same plant successfully."
        test_recipe:
          setup: ["One plant exists"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant RB5" }, as: PlantAdmin, captures: { plant: $.data.id } }
          trigger:
            - { call: "GET /api/plants/${plant}", as: PlantAdmin, captures: { r1: $.data.id } }
            - { call: "GET /api/plants/${plant}", as: SourceMonitor, captures: { r2: $.data.id } }
            - { call: "GET /api/plants/${plant}", as: QAOfficer, captures: { r3: $.data.id } }
            - { call: "GET /api/plants/${plant}", as: ProductionLead, captures: { r4: $.data.id } }
            - { call: "GET /api/plants/${plant}", as: SanitationLead, captures: { r5: $.data.id } }
            - { call: "GET /api/plants/${plant}", as: ComplianceOfficer, captures: { r6: $.data.id } }
          assert:
            - "${r1} == ${plant} and ${r2} == ${plant} and ${r3} == ${plant} and ${r4} == ${plant} and ${r5} == ${plant} and ${r6} == ${plant}"

  # ---------------------------------------------------------------------------
  # Section: cross-cutting complexity layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_permit_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[withdrawal-event-create-stale-permit]", "errors[ERR_STALE_PERMIT_VERSION]"]
        distinguishing_aspect: "Two strictly sequential posts: after the first event advances the permit version 1 -> 2, a second post still carrying expected_permit_version 1 is rejected 412 ERR_STALE_PERMIT_VERSION; re-reading and re-sending with the fresh version succeeds."
        test_recipe:
          setup: ["Plant with SPRING permit (version 1 captured at creation)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CC1" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CC1", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 1000, meter_reading_start_gallons: 0, meter_reading_end_gallons: 1000, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { ev1: $.data.id } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 500, meter_reading_start_gallons: 1000, meter_reading_end_gallons: 1500, expected_permit_version: "${pv}" }, as: SourceMonitor, captures: { err: $.data.error_id } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv2: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 500, meter_reading_start_gallons: 1000, meter_reading_end_gallons: 1500, expected_permit_version: "${pv2}" }, as: SourceMonitor, captures: { ev2: $.data.id } }
          assert:
            - "${pv} == 1"
            - "${err} == ERR_STALE_PERMIT_VERSION and http status == 412 (the client's version-1 view went stale when the first post advanced the permit to 2)"
            - "WithdrawalEvent.${ev2}.status == RECORDED (re-based retry succeeds)"
            - "${pv2} == 2"

      - name: occ_stale_line_version_rejected_with_progression
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lot-create-stale-line]", "concurrency_rules[preform-delivery-create-stale-line]", "errors[ERR_STALE_LINE_VERSION]"]
        distinguishing_aspect: "The line ledger's version increments on every mutation (create 1 -> delivery 2 -> QC 3 -> lot 4); a lot create carrying the stale version 1 is rejected 412 ERR_STALE_LINE_VERSION, and the same call with the fresh version succeeds."
        test_recipe:
          setup: ["Plant with SPRING permit and SCHEDULED run; line created (version 1 captured)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CC2" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CC2", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
          trigger:
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 1000, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/preform-deliveries/${del}/qc-verdict", payload: { verdict: "ACCEPTED", accepted_units: 1000 }, as: QAOfficer, as_user_id: "qa-1" }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { err: $.data.error_id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv3: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/production-lots", payload: { treatment_run_id: "${run}", label_classification: "SPRING", planned_units: 100, scheduled_start: "2026-08-04T08:00:00Z", scheduled_end: "2026-08-04T12:00:00Z", expected_line_version: "${lv3}" }, as: ProductionLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}", as: ProductionLead, captures: { lv4: $.data.version } }
          assert:
            - "${lv} == 1"
            - "${err} == ERR_STALE_LINE_VERSION (delivery create and QC verdict advanced the line to 3 while the client held 1)"
            - "${lv3} == 3"
            - "ProductionLot.${lot}.status == PLANNED (re-based create succeeds)"
            - "${lv4} == 4 (the lot create itself bumped the version)"

      - name: posture_watch_at_ninety_percent_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.plant_compliance_posture]
        distinguishing_aspect: "The cumulative WATCH threshold binds at exact equality: with monthly_cap 10000, withdrawing 8999 keeps the posture GREEN and the next single gallon (9000 == exactly 90.0%) flips it to WATCH — >= semantics on an exact-integer comparison."
        test_recipe:
          setup: ["Plant with SPRING permit (daily 10000, monthly 10000)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CC3" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CC3", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 10000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, pv: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 8999, meter_reading_start_gallons: 0, meter_reading_end_gallons: 8999, expected_permit_version: "${pv}" }, as: SourceMonitor }
          trigger:
            - { call: "GET /api/plants/${plant}", as: PlantAdmin, captures: { posture1: $.data.compliance_posture } }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { pv2: $.data.version } }
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 1, meter_reading_start_gallons: 8999, meter_reading_end_gallons: 9000, expected_permit_version: "${pv2}" }, as: SourceMonitor }
            - { call: "GET /api/plants/${plant}", as: PlantAdmin, captures: { posture2: $.data.compliance_posture } }
          assert:
            - "${posture1} == GREEN (8999 < 90.0% of 10000)"
            - "${posture2} == WATCH (9000 >= 90.0% of 10000, exactly at the threshold)"

      - name: updated_at_refreshes_on_mutation
        claim_type: derived_field_reconciliation
        grounds: [entities.WaterSourcePermit.fields.withdrawn_month_provisional_gallons]
        distinguishing_aspect: "Derived reconciliation is immediate: posting an event refreshes the permit's aggregates AND its updated_at in the same request cycle; version increments in lockstep."
        test_recipe:
          setup: ["Plant with SPRING permit (created_at/updated_at captured)"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CC4" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-CC4", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id, ua0: $.data.updated_at, pv: $.data.version } }
          trigger:
            - { call: "POST /api/permits/${perm}/withdrawal-events", payload: { withdrawal_date: "2026-08-01", gallons: 250, meter_reading_start_gallons: 0, meter_reading_end_gallons: 250, expected_permit_version: "${pv}" }, as: SourceMonitor }
            - { call: "GET /api/permits/${perm}", as: SourceMonitor, captures: { ua1: $.data.updated_at, pv1: $.data.version, prov: $.data.withdrawn_month_provisional_gallons } }
          assert:
            - "${ua1} != ${ua0} (updated_at refreshed by the cascaded aggregate update)"
            - "${pv1} == 2"
            - "${prov} == 250"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.LabTest.SCHEDULED_to_COMPLETED_FAIL, state_machines.ProductionLot.RELEASED_to_RECALLED]
        excluded_because:
          difficulty_instance: transitive_cascade / recall_initiation_cascade_lots_then_bottles
          rationale: "Both multi-hop cascades are asserted end-to-end by the named §1.8 instance and its sibling."

      - name: dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.permit_withdrawal_remaining, calculations.bottle_loop_availability]
        excluded_because:
          difficulty_instance: dual_variant_calc / permit_remaining_provisional_vs_certified
          rationale: "Variant divergence and reconciliation-on-finalize are asserted by the named §1.8 instance and its bottle-pool sibling."

  # ---------------------------------------------------------------------------
  # Section: consistency model (immediate)
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Consistency is immediate: the bottle created by POST appears in the very next GET /api/plants read (pools 1/1) and in GET /api/bottles/{id} — no delay, no stale read."
        test_recipe:
          setup: ["One plant exists"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant CM1" }, as: PlantAdmin, captures: { plant: $.data.id } }
          trigger:
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-CM1" }, as: SanitationLead, captures: { b: $.data.id } }
            - { call: "GET /api/plants/${plant}", as: PlantAdmin, captures: { gross: $.data.bottle_gross_pool_units, san: $.data.bottle_sanitized_pool_units } }
            - { call: "GET /api/bottles/${b}", as: SanitationLead, captures: { st: $.data.status } }
          assert:
            - "${gross} == 1 and ${san} == 1 (visible in the immediately-following read)"
            - "${st} == SANITIZED"

  # ---------------------------------------------------------------------------
  # Section: endpoints (second group — list/read surface sweep)
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_and_read_surface_sweep
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Every list and read endpoint answers with the envelope contract: the filtered-list GETs (permits, bottling-lines, preform-deliveries, recalls, wash-batches, treatment-runs, bottles, community-reports) and the sub-resource GETs (plant permits/recalls/wash-batches, line preform-deliveries) each return 200 with total_count reflecting the fixture, and the single-read GETs echo their entity."
        test_recipe:
          setup: ["Plant with one permit, one line with one PENDING_QC delivery, one SCHEDULED wash batch, one bottle, one DRAFT report, one SCHEDULED treatment run; no recalls"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EP5" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-EP5", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottling-lines", payload: { line_code: "LINE-1", daily_capacity_units: 8000 }, as: PlantAdmin, captures: { line: $.data.id, lv: $.data.version } }
            - { call: "POST /api/bottling-lines/${line}/preform-deliveries", payload: { supplier: "ACME", delivered_units: 500, expected_line_version: "${lv}" }, as: ProductionLead, as_user_id: "pl-1", captures: { del: $.data.id } }
            - { call: "POST /api/plants/${plant}/wash-batches", payload: { washer_unit: "WASHER_A", scheduled_start: "2026-08-06T09:00:00Z", scheduled_end: "2026-08-06T10:00:00Z" }, as: SanitationLead, captures: { batch: $.data.id } }
            - { call: "POST /api/plants/${plant}/bottles", payload: { bottle_code: "B-EP5" }, as: SanitationLead, captures: { b: $.data.id } }
            - { call: "POST /api/plants/${plant}/community-reports", payload: { period_year: 2026, period_month: 8 }, as: ComplianceOfficer, captures: { rep: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
          trigger:
            - { call: "GET /api/permits?plant_id=${plant}", as: SourceMonitor, captures: { x1: "$.data[0].id" } }
            - { call: "GET /api/plants/${plant}/permits", as: SourceMonitor, captures: { x2: "$.data[0].id" } }
            - { call: "GET /api/bottling-lines?plant_id=${plant}", as: ProductionLead, captures: { x3: "$.data[0].id" } }
            - { call: "GET /api/preform-deliveries?line_id=${line}", as: ProductionLead, captures: { x4: "$.data[0].id" } }
            - { call: "GET /api/preform-deliveries/${del}", as: ProductionLead, captures: { x5: $.data.id } }
            - { call: "GET /api/bottling-lines/${line}/preform-deliveries", as: ProductionLead, captures: { x6: "$.data[0].id" } }
            - { call: "GET /api/recalls?plant_id=${plant}", as: ComplianceOfficer }
            - { call: "GET /api/plants/${plant}/recalls", as: ComplianceOfficer }
            - { call: "GET /api/wash-batches?plant_id=${plant}&washer_unit=WASHER_A", as: SanitationLead, captures: { x9: "$.data[0].id" } }
            - { call: "GET /api/plants/${plant}/wash-batches", as: SanitationLead, captures: { x10: "$.data[0].id" } }
            - { call: "GET /api/wash-batches/${batch}", as: SanitationLead, captures: { x11: $.data.id } }
            - { call: "GET /api/treatment-runs?plant_id=${plant}&status=SCHEDULED", as: QAOfficer, captures: { x12: "$.data[0].id" } }
            - { call: "GET /api/bottles?plant_id=${plant}&status=SANITIZED", as: SanitationLead, captures: { x13: "$.data[0].id" } }
            - { call: "GET /api/community-reports?plant_id=${plant}&status=DRAFT", as: ComplianceOfficer, captures: { x14: "$.data[0].id" } }
          assert:
            - "${x1} == ${perm} and ${x2} == ${perm}"
            - "${x3} == ${line}"
            - "${x4} == ${del} and ${x5} == ${del} and ${x6} == ${del}"
            - "Both recall lists return total_count == 0 (empty collections are well-formed, has_more == false)"
            - "${x9} == ${batch} and ${x10} == ${batch} and ${x11} == ${batch}"
            - "${x12} == ${run}"
            - "${x13} == ${b}"
            - "${x14} == ${rep}"

      - name: treatment_run_cancel_from_scheduled_then_locked
        claim_type: valid_transition
        grounds: [state_machines.TreatmentRun.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel moves a SCHEDULED run to CANCELLED; a second cancel is rejected ERR_INVALID_STATE because CANCELLED is terminal."
        test_recipe:
          setup: ["Plant with SPRING permit; one SCHEDULED run"]
          setup_api_calls:
            - { call: "POST /api/plants", payload: { name: "Plant EP6" }, as: PlantAdmin, captures: { plant: $.data.id } }
            - { call: "POST /api/plants/${plant}/permits", payload: { permit_number: "SP-EP6", source_classification: "SPRING", daily_cap_gallons: 10000, monthly_cap_gallons: 200000, valid_from: "2026-01-01", valid_to: "2026-12-31" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
            - { call: "POST /api/plants/${plant}/treatment-runs", payload: { source_permit_id: "${perm}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: ProductionLead, captures: { run: $.data.id } }
          trigger:
            - { call: "POST /api/treatment-runs/${run}/cancel", as: ProductionLead, as_user_id: "pl-1", captures: { st: $.data.status } }
            - { call: "POST /api/treatment-runs/${run}/cancel", as: ProductionLead, as_user_id: "pl-1", captures: { err: $.data.error_id } }
          assert:
            - "${st} == CANCELLED"
            - "${err} == ERR_INVALID_STATE"
