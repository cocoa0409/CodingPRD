  - section: cross_cutting
    instances:
      - name: bay_version_increments_on_each_booking
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appointment-create-stale-bay]", "entities.ServiceBay.fields.version"]
        distinguishing_aspect: "ServiceBay.version increments by 1 on a successful appointment booking (from 1 to 2)."
        test_recipe:
          setup: ["An OPEN bay (version 1) and an APPROVED order."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "eo@x.com", full_name: "O", phone: "555-2015" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "TOYOTA", model: "CAMRY", model_year: 2022, oe_tire_size: "235/45R18", rim_diameter_in: 18, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "PRIMACY", size_token: "235/45R18", load_index: 94, speed_rating: "V", unit_price_cents: 10000, mileage_warranty_miles: 60000, original_tread_32nds: 10, stock_qty: 8 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /service-bays"
              payload: { bay_name: "BayK", alignment_capable: false, turnover_buffer_min: 15 }
              as: InventoryManager
              captures: { bay_id: $.data.id, bay_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /appointments"
              payload: { work_order_id: "${wo_id}", service_bay_id: "${bay_id}", scheduled_start: "2026-08-04T09:00:00.000Z", scheduled_end: "2026-08-04T10:00:00.000Z", expected_service_bay_version: "${bay_v0}" }
              as: ServiceAdvisor
              captures: { appt_id: $.data.id }
          assert:
            - "response.status == 201"
            - "ServiceBay.${bay_id}.version == 2"

      - name: bay_close_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appointment-create-stale-bay]", "state_machines.ServiceBay.OPEN_to_OUT_OF_SERVICE", "errors[ERR_STALE_BAY_VERSION]"]
        distinguishing_aspect: "Closing a bay with a stale expected_service_bay_version (the pre-booking value, one behind after a booking bumped it) returns ERR_STALE_BAY_VERSION (412)."
        test_recipe:
          setup: ["An OPEN bay (version 1) that then receives one booking advancing it to version 2; an order whose appointment was subsequently cancelled so the close precondition (no active appointments) holds."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ep@x.com", full_name: "P", phone: "555-2016" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "TOYOTA", model: "CAMRY", model_year: 2022, oe_tire_size: "235/45R18", rim_diameter_in: 18, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "PRIMACY", size_token: "235/45R18", load_index: 94, speed_rating: "V", unit_price_cents: 10000, mileage_warranty_miles: 60000, original_tread_32nds: 10, stock_qty: 8 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /service-bays"
              payload: { bay_name: "BayL", alignment_capable: false, turnover_buffer_min: 15 }
              as: InventoryManager
              captures: { bay_id: $.data.id, bay_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
            - call: "POST /appointments"
              payload: { work_order_id: "${wo_id}", service_bay_id: "${bay_id}", scheduled_start: "2026-08-05T09:00:00.000Z", scheduled_end: "2026-08-05T10:00:00.000Z", expected_service_bay_version: "${bay_v0}" }
              as: ServiceAdvisor
              captures: { appt_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /service-bays/${bay_id}/close"
              payload: { expected_service_bay_version: "${bay_v0}" }
              as: InventoryManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_BAY_VERSION"

      - name: road_hazard_warranty_reverse_reachable_by_line
        claim_type: derived_field_reconciliation
        grounds: [entities.RoadHazardWarranty.fields.work_order_line_id, endpoints]
        distinguishing_aspect: "After approving an opted TIRE line, GET /road-hazard-warranties?work_order_line_id={line} returns the ACTIVE warranty with premium_cents 1200 (floor branch, unit 8000 qty 1)."
        test_recipe:
          setup: ["An APPROVED order with one opted TIRE line (unit 8000, qty 1)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "eq@x.com", full_name: "Q", phone: "555-2017" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "HONDA", model: "FIT", model_year: 2019, oe_tire_size: "185/60R15", rim_diameter_in: 15, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "GENERIC", model_name: "ECON", size_token: "185/60R15", load_index: 84, speed_rating: "T", unit_price_cents: 8000, mileage_warranty_miles: 0, original_tread_32nds: 9, stock_qty: 4 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "APPROVED_PLUS" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 1, road_hazard_opted: true, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { line_id: $.data.id, wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
          trigger:
            - call: "GET /road-hazard-warranties"
              payload: { work_order_line_id: "${line_id}" }
              as: ServiceAdvisor
          assert:
            - "response.status == 200"
            - "response.data is an array of length 1"
            - "response.data[0].premium_cents == 1200"
            - "response.data[0].status == ACTIVE"

  # =====================================================================
  # Consistency Model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: approve_pricing_visible_in_same_response
        claim_type: immediate
        grounds: [calculations.work_order_pricing, state_machines.WorkOrder.DRAFT_to_APPROVED]
        excluded_because:
          difficulty_instance: combinatorial_formula / work_order_pricing_per_line_round_then_tax_order_mode_b
          rationale: "Immediate visibility of all computed pricing fields in the approve response is asserted by the combinatorial pricing §1.8 instance."
