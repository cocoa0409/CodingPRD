          setup:
            - "One Willow Creek Dairy operation with one EARTHEN_LAGOON of operating capacity 4488300.00"
            - "One StorageInspection on 2026-07-25 with measured_freeboard_in 18, which drives the structure to FREEBOARD_ALERT and the operation to RESTRICTED"
