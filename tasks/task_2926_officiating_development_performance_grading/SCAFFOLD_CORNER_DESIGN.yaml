            - *k_off_dan
            - *k_dan_exam
            - *k_dan_phys
            - *k_off_lee
            - *k_lee_exam
            - *k_lee_phys
          trigger:
            - call: "POST /advancement-applications"
              payload: { official_id: "${dan_id}", target_tier: "TIER_1" }
              as: Official
              as_user_id: "${dan_id}"
              captures: { dan_app_id: $.data.id, dan_app_status: $.data.status, dan_app_returns: $.data.return_count }
            - call: "POST /advancement-applications/${dan_app_id}/screen"
              payload: {}
              as: FieldEvaluator
              as_user_id: "eval-1"
              captures: { err_criteria: $.data.error_id }
            - call: "GET /advancement-applications/${dan_app_id}"
              payload: {}
              as: FieldEvaluator
              captures: { dan_app_status_after: $.data.status, dan_app_screened_after: $.data.screened_at }
            - call: "POST /advancement-applications"
              payload: { official_id: "${lee_id}", target_tier: "TIER_2" }
              as: Official
              as_user_id: "${lee_id}"
              captures: { lee_app2_id: $.data.id }
            - call: "POST /advancement-applications/${lee_app2_id}/screen"
              payload: {}
              as: FieldEvaluator
              as_user_id: "eval-1"
              captures: { lee_app2_status: $.data.status, lee_app2_screened: $.data.screened_at }
          assert:
            - "${dan_app_status} == SUBMITTED with ${dan_app_returns} == 0 — filing is always allowed; the criteria are checked at screening"
            - "screening Dan returns HTTP 422 with ${err_criteria} == ERR_ADVANCEMENT_CRITERIA_NOT_MET (6 < MIN_EXPERIENCE_FOR_TIER_1 8)"
            - "${dan_app_status_after} == SUBMITTED and ${dan_app_screened_after} == null"
            - "Lee's TIER_2 application screens successfully: ${lee_app2_status} == SCREENED with ${lee_app2_screened} == 2026-08-01T00:00:00Z, because 7 >= MIN_EXPERIENCE_FOR_TIER_2 5 and TIER_3 -> TIER_2 is adjacent"

      - name: submit_to_committee_below_the_evaluation_bar_is_rejected
        claim_type: violation_error
        grounds:
