              captures: { forf: $.data.forfeited_cents, refd: $.data.refunded_cents }
            - call: "POST /refund-exceptions"
              payload: { reservation_id: "${res1}", reason_code: "MEDICAL", requested_cents: 4361 }
              as: GuestServices
