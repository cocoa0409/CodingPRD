          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION with http 409 (priority 5 state) — NOT ERR_BATCH_SAFETY_PENDING (priority 7)"

      - name: ship_safety_violation_beats_window_closed
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - endpoints."POST /farm/shipments/{id}/ship"
        distinguishing_aspect: |
          Pair business_safety(7) vs business_temporal(9): the line batch is QUARANTINED by a
          failed sanitation cascade AND the dock window has already closed; the response MUST be
          ERR_BATCH_QUARANTINED (422), proving safety outranks temporal — a different category
          pair than the state-vs-safety sibling.
