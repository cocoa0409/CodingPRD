  - name: listing_state_error_outranks_joint_safety_error_on_release
    claim_type: priority_ordering
    grounds:
    - validations[priority=16]
    - validations[priority=26]
    excluded_because:
      difficulty_instance: release_state_error_outranks_joint_safety_error
      rationale: That §1.8 priority_pair_validation_conflict instance is exactly this pairing (priority 16 versus priority 26) on the release endpoint.
  - name: referential_error_outranks_temporal_overlap_error_on_campaign_create
    claim_type: priority_ordering
    grounds:
    - validations[priority=33]
    - validations[priority=56]
    excluded_because:
      difficulty_instance: campaign_referential_error_outranks_window_overlap_error
      rationale: The §1.8 instance already violates both rules in one request and pins the priority-33 error as the winner.
  - name: retail_release_without_active_listing_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=40]
    - errors[ERR_NO_ACTIVE_LISTING]
    excluded_because:
      difficulty_instance: retail_release_gated_on_listing_record_state
      rationale: That §1.8 cross_entity_state_dependency instance drives release-to-retail against an APPLIED-only listing and asserts ERR_NO_ACTIVE_LISTING.
  - name: start_production_on_superseded_revision_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=36]
    - errors[ERR_REVISION_NOT_APPROVED]
    excluded_because:
      difficulty_instance: production_blocked_by_superseded_design_revision
      rationale: The §1.8 cross_entity_state_dependency instance already pins the revision to SUPERSEDED and asserts ERR_REVISION_NOT_APPROVED at start-production.
  - name: campaign_on_another_products_revision_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=32]
    - errors[ERR_REVISION_PRODUCT_MISMATCH]
    excluded_because:
      difficulty_instance: campaign_referential_error_outranks_window_overlap_error
      rationale: That §1.8 instance fires POST /test-campaigns with a revision belonging to another product and asserts ERR_REVISION_PRODUCT_MISMATCH as the winning error, so this corner would repeat the
        same call with the same expected error_id.
  - name: bench_reservation_overlapping_cooldown_buffer_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=55]
    - errors[ERR_BENCH_WINDOW_CONFLICT]
    excluded_because:
      difficulty_instance: bench_reservation_half_open_window_with_cooldown_buffer
      rationale: That §1.8 resource_temporal_overlap instance tests the buffered half-open rule at both the colliding and the abutting boundary.
  - name: audit_window_touching_endpoint_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=56]
    - errors[ERR_AUDIT_WINDOW_OVERLAP]
    excluded_because:
      difficulty_instance: audit_window_closed_interval_touching_endpoints_collide
      rationale: The closed-interval audit rule, including the touching-endpoint case, is the whole subject of that §1.8 instance.
  - name: acknowledge_before_notification_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=22]
    - errors[ERR_REGISTRATION_NOT_NOTIFIED]
    excluded_because:
      difficulty_instance: recall_acknowledgement_gated_on_notification_state
      rationale: That §1.8 cross_entity_state_dependency instance acknowledges a REGISTERED (not yet NOTIFIED) row and asserts ERR_REGISTRATION_NOT_NOTIFIED.
  - name: release_with_no_joint_samples_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=26]
    - errors[ERR_NO_JOINT_SAMPLES]
    excluded_because:
      difficulty_instance: release_with_empty_joint_sample_set_rejected
      rationale: The empty-sample-set boundary (conformance_index null rather than 0.00) is the §1.8 boundary_precision_check instance itself.
  - name: duplicate_sample_seq_on_same_lot_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=57]
    - errors[ERR_DUPLICATE_KEY]
    distinguishing_aspect: 'sample_seq is unique per lot, not globally: reusing seq 1 on the same lot is 409, while seq 1 on a different lot of the same product is accepted.'
