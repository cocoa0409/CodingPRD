  - name: layer_occ_plan_entry_create_and_clearance_guard_two_different_parents
    claim_type: optimistic_concurrency
    grounds:
    - §1.2.1 concurrency_rules plan-entry-create-stale-exhibit
    - §1.2.1 concurrency_rules clearance-stale-species-quota
    - §1.6 ERR_STALE_EXHIBIT_VERSION (412) and ERR_STALE_SPECIES_VERSION (412)
    - §1.5 POST /aquarium/collection-plan-entries (expected_exhibit_version)
    - §1.5 POST /aquarium/acquisition-requests/{id}/clearance (expected_species_version)
    distinguishing_aspect: 'Two OCC rules guard two DIFFERENT parents in one story: a second plan line created against a stale Exhibit.version is 412 ERR_STALE_EXHIBIT_VERSION, while a clearance against a stale Species.version is 412 ERR_STALE_SPECIES_VERSION. Each token is scoped to its own parent — the exhibit token does not protect the quota pool and vice versa.'
