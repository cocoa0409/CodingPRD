              as: SalesAssociate
              captures: { sale_106_v2: $.data.version }
            - call: "POST /sales/${sale_106}/lines"
              payload: { product_id: "${p_whisky}", qty: 1, expected_sale_version: "${sale_106_v2}" }
              as: SalesAssociate
            - call: "POST /sales/${sale_106}/clear-eligibility"
              payload: {}
              as: SalesAssociate
          assert:
            - "the pickup from CART returns HTTP 409 with error_id ERR_SALE_NOT_CLEARED"
            - "the bag issuance from CART returns HTTP 409 with error_id ERR_SALE_NOT_CLEARED"
            - "the clear-eligibility from CART returns HTTP 200"
            - "the line add after clearance returns HTTP 409 with error_id ERR_SALE_NOT_IN_CART, not ERR_STALE_SALE_VERSION - the state check at priority 60 outranks the OCC check at priority 66"
            - "the second clear-eligibility returns HTTP 409 with error_id ERR_SALE_NOT_IN_CART"
            - "Sale.${sale_106}.version == ${sale_106_v2} - none of the four refused calls bumped the version"
            - "Sale.${sale_106}.gross_amount_cents == 16000 - the refused line was never appended"
            - "GET /sale-lines filtered by sale_id ${sale_106} returns exactly 1 line"
            - "GET /sealed-bags filtered by sale_id ${sale_106} returns 0 bags"

      - claim_type: terminal_state_lockdown
        name: voided_sale_refuses_every_further_trigger_at_priority_59
        grounds:
          - validations[priority=59]
          - errors.ERR_SALE_ALREADY_TERMINAL
          - state_machines.Sale.terminal_states
        distinguishing_aspect: |
          VOIDED is the single terminal state of the till dimension, and ERR_SALE_ALREADY_TERMINAL sits
          at priority 59 - ABOVE the ordinary state errors at 60 - so a VOIDED sale answers
          ERR_SALE_ALREADY_TERMINAL rather than ERR_SALE_NOT_IN_CART or ERR_SALE_NOT_CLEARED for every
          trigger including a second void.
        test_recipe:
          setup:
            - "Terminal SIN in SG, one LISTED LIQUOR product with 10 units, AU/LIQUOR allowance 5"
            - "A scanned itinerary SIN to AU departing 2026-08-25 and a CART sale with one line of qty 2, then VOIDED"
          setup_api_calls:
