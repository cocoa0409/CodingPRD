  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: stakeout_schedule_cancel_conserves_invoice_total_money
        grounds:
          - state_machines.Stakeout.SCHEDULED_to_CANCELLED
          - entities.ServiceRequest.fields.final_fee_cents
          - entities.InvoiceLine.fields.voided
          - calculations.service_fee
        distinguishing_aspect: |
          Conserved quantity = money (ServiceRequest.final_fee_cents). Scheduling a
          stakeout (+12000) then cancelling it (compensating action) returns
          final_fee_cents to its pre-stakeout value 7575, with the invariant
          final_fee_cents == sum(amount_cents for InvoiceLine where voided==false).
        test_recipe:
          setup:
            - "Non-rush 3-page request ASSIGNED; baseline final_fee=7575 (base 7500 + printing 75)."
            - "Schedule one stakeout -> final_fee 19575; then cancel that stakeout."
          setup_api_calls:
            - call: "POST /counties"
              payload: { name: "Inyo", state_code: "CA", e_file_enabled: false, min_diligent_attempts: 1 }
              as: Admin
              captures: { county_id: $.data.id }
