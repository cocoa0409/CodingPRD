        distinguishing_aspect: |
          A different metric (elapsed days versus a lag constant) on a different endpoint from the
          ratio boundary above. The cutoff is inclusive: at clock 2026-06-29 the cutoff is
          2026-03-31 and the 2026-04-01 hold is not yet matured, while at 2026-06-30 the cutoff is
          exactly 2026-04-01 and the whole 50000 cents becomes releasable. Off-by-one lag arithmetic
          fails one of the two days.
        test_recipe:
          setup:
            - "one ACTIVE merchant, funding_state NORMAL, ROLLING reserve with release_lag_days 90"
            - "a single HOLD entry of 50000 cents with effective_date 2026-04-01"
