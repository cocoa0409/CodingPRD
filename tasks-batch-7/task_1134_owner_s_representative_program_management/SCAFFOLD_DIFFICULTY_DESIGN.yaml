  - rule_id: non_linear_state_machine
    instances:
      - name: change_order_revision_cycle_and_override_fork
        grounds:
          - state_machines.ChangeOrder.UNDER_REVIEW_to_DRAFT
          - state_machines.ChangeOrder.RECOMMEND_REJECTION_to_APPROVED
          - state_machines.ChangeOrder.APPROVED_to_VOID
        distinguishing_aspect: |
          ChangeOrder is non-linear: it cycles UNDER_REVIEW -> DRAFT -> UNDER_REVIEW
          (revision loop) and its fork branches diverge — an owner APPROVE from
          RECOMMEND_REJECTION still fires the full approval cascade, then APPROVED ->
          VOID runs the compensation cascade. A linear pipeline cannot express this.
        test_recipe:
          setup:
            - "Program ACTIVE: budget 10000000, contingency 1000000, single line CC-100; CT1 EXECUTED 4500000"
            - "CO1 amount 100000 against CT1"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_name: "P-CO", owner_organization: "OwnerOrg" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { prog: $.data.id } }
            - { call: "POST /charters", payload: { program_id: "${prog}", objectives: "obj", scope_statement: "scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ch: $.data.id } }
            - { call: "POST /charters/${ch}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv: $.data.version } }
            - { call: "POST /charters/${ch}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /baselines", payload: { program_id: "${prog}", total_budget_cents: 10000000, contingency_total_cents: 1000000, target_finish_date: "2027-03-31", lines: [ { cost_code: "CC-100", amount_cents: 10000000 } ] }, as: OwnerRepPM, as_user_id: "pm-1", captures: { bl: $.data.id } }
            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V1", contract_type: "CONTRACTOR", solicitation_estimate_cents: 4500000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct1: $.data.id } }
            - { call: "POST /contracts/${ct1}/begin-negotiation", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts/${ct1}/execute", payload: { awarded_amount_cents: 4500000 }, as: OwnerRepExecutive, as_user_id: "exec-1" }
            - { call: "POST /change-orders", payload: { contract_id: "${ct1}", title: "CO1", reason: "rev", amount_cents: 100000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { co1: $.data.id } }
            - { call: "POST /change-orders/${co1}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /change-orders/${co1}/request-revision", payload: { revision_note: "fix scope" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { st1: $.data.status } }
            - { call: "POST /change-orders/${co1}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { st2: $.data.status } }
            - { call: "POST /change-orders/${co1}/recommend", payload: { recommendation: "REJECT", analysis_note: "too costly" }, as: OwnerRepPM, as_user_id: "pm-1", captures: { st3: $.data.status } }
            - { call: "POST /change-orders/${co1}/decide", payload: { decision: "APPROVE" }, as: Owner, as_user_id: "owner-1", captures: { st4: $.data.status } }
            - { call: "GET /contracts/${ct1}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { comm: $.data.current_commitment_cents } }
            - { call: "POST /change-orders/${co1}/void", payload: { void_reason: "owner reversed" }, as: Owner, as_user_id: "owner-1", captures: { st5: $.data.status } }
            - { call: "GET /contracts/${ct1}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { comm2: $.data.current_commitment_cents } }
          assert:
            - "st1 == DRAFT   # revision loop back-edge"
            - "st2 == UNDER_REVIEW   # resubmission after revision"
            - "st3 == RECOMMEND_REJECTION"
            - "st4 == APPROVED   # owner override fork: cascade fires despite REJECT recommendation"
            - "comm == 4600000   # 4500000 + 100000: cascade link 1 executed on the override branch"
            - "st5 == VOID"
            - "comm2 == 4500000   # compensation restored commitment exactly"

