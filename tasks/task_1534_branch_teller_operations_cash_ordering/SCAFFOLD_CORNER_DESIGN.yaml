      - name: teller_acting_on_other_tellers_drawer_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "roles[Teller]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Entity-backed identity: a teller whose X-User-ID does not equal the drawer's teller_id is rejected with 403 ERR_FORBIDDEN even though the role is correct."
        test_recipe:
          setup: ["Branch B; tellers T1 (with OPEN drawer) and T2; account A"]
          setup_api_calls:
