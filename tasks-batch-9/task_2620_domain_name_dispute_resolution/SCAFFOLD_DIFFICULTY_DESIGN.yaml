            - call: "POST /udrp/cases/${case_1_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "The registrant parked the name for advertising revenue.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_1_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 150000, reference: "WIRE-1808" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
