              captures: { err: $.data.error_id }
          assert:
            - "RetailPartner.${partner_ca_id}.partner_status == SUSPENDED"
            - "the response status is 422 and err == ERR_PARTNER_SUSPENDED"
            - "err != ERR_PARTNER_NOT_AUTHORIZED_FOR_STATE, because CA is in the partner's allowed list"
            - "the partner's state list is unchanged at [\"CA\"]"
