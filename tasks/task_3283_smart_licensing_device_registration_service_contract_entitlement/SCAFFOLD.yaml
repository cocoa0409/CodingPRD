scenario: "Smart Licensing, Device Registration & Service Contract Entitlement (Cisco): product license registration to a smart account with virtual account segmentation by business unit or site, license consumption reporting from devices with periodic synchronization and out-of-compliance grace periods, subscription and perpetual license coexistence with feature tier upgrades, service contract attachment to serial numbers governing software updates, hardware replacement and technical support access, hardware replacement logistics with advance replacement service levels and depot returns, license transfer during hardware refresh or between accounts with approval, end-of-life and end-of-support milestones driving migration planning, partner-managed accounts and delegated administration"
domain_name: "smart-licensing-device-registration-entitlement"
api_prefix: "/api"
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - scheduled_actions
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: delegated_authority
  consistency_model: immediate
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: SmartAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_ref, type: string, source: input, description: "Human-readable unique account reference (tenant key)", constraints: "unique across all SmartAccount rows" }
      - { name: display_name, type: string, source: input, description: "Legal customer display name" }
      - { name: status, type: enum, source: system, description: "Lifecycle of the smart account", default: ACTIVE, constraints: "one of {ACTIVE, SUSPENDED, CLOSED}" }
      - { name: managing_partner_id, type: string, source: input, description: "Optional FK -> PartnerOrg.id; when set the partner may administer the account subject to PartnerDelegation grants", default: null }
      - { name: compliance_posture, type: enum, source: computed, description: "Aggregate posture derived from all LicensePool rows under this account: COMPLIANT if every pool is COMPLIANT; GRACE if any pool is IN_GRACE and none is OUT_OF_COMPLIANCE; NON_COMPLIANT if any pool is OUT_OF_COMPLIANCE", constraints: "one of {COMPLIANT, GRACE, NON_COMPLIANT}" }
  - name: PartnerOrg
    parent: null
    common_fields: true
    fields:
      - { name: partner_ref, type: string, source: input, description: "Unique partner reference", constraints: "unique" }
      - { name: display_name, type: string, source: input, description: "Partner legal name" }
      - { name: status, type: enum, source: system, description: "Partner lifecycle", default: ACTIVE, constraints: "one of {ACTIVE, SUSPENDED}" }
  - name: PartnerDelegation
    parent: null
    common_fields: true
    fields:
      - { name: partner_org_id, type: string, source: input, description: "FK -> PartnerOrg.id; the delegating partner organization" }
      - { name: smart_account_id, type: string, source: input, description: "FK -> SmartAccount.id; the customer account being administered" }
      - { name: scope, type: enum, source: input, description: "Delegated capability set", constraints: "one of {LICENSING, SERVICE_CONTRACTS, FULL}" }
      - { name: status, type: enum, source: system, description: "Grant lifecycle", default: ACTIVE, constraints: "one of {ACTIVE, REVOKED}" }
      - { name: granted_at, type: datetime, source: system, description: "When the grant was created (logical clock)" }
      - { name: revoked_at, type: datetime, source: system, description: "When revoked; null while ACTIVE", default: null }
  - name: VirtualAccount
    parent: SmartAccount
    common_fields: true
    fields:
      - { name: smart_account_id, type: string, source: input, description: "FK -> SmartAccount.id; owning smart account" }
      - { name: name, type: string, source: input, description: "Business-unit or site segment name", constraints: "unique within smart_account_id" }
      - { name: status, type: enum, source: system, description: "Segment lifecycle", default: ACTIVE, constraints: "one of {ACTIVE, ARCHIVED}" }
  - name: LicensePool
    parent: VirtualAccount
    common_fields: true
    fields:
      - { name: virtual_account_id, type: string, source: input, description: "FK -> VirtualAccount.id; owning segment" }
      - { name: sku, type: string, source: input, description: "License SKU this pool meters", constraints: "unique within virtual_account_id" }
      - { name: license_model, type: enum, source: input, description: "PERPETUAL or SUBSCRIPTION coexistence marker", constraints: "one of {PERPETUAL, SUBSCRIPTION}" }
      - { name: feature_tier, type: enum, source: input, description: "Feature tier of this pool", default: ESSENTIALS, constraints: "one of {ESSENTIALS, ADVANTAGE, PREMIER}" }
      - { name: purchased_quantity, type: integer, source: input, description: "Total entitlement count purchased", constraints: ">= 0" }
      - { name: consumed_quantity, type: integer, source: computed, description: "Sum of quantities from latest accepted UsageReport lines for this pool plus active assignments; recomputed on every usage sync and assignment change", default: 0 }
      - { name: compliance_state, type: enum, source: computed, description: "COMPLIANT when consumed_quantity <= purchased_quantity; IN_GRACE when overage and grace deadline in future; OUT_OF_COMPLIANCE when overage past grace deadline", default: COMPLIANT, constraints: "one of {COMPLIANT, IN_GRACE, OUT_OF_COMPLIANCE}" }
      - { name: grace_deadline, type: datetime, source: computed, description: "Set to overage_detected_at + GRACE_PERIOD_DAYS when pool first becomes overdrawn; cleared when pool returns to compliance", default: null }
      - { name: overage_detected_at, type: datetime, source: computed, description: "Logical-clock timestamp when consumed_quantity first exceeded purchased_quantity in the current overage episode", default: null }
      - { name: subscription_expires_at, type: datetime, source: input, description: "Only for SUBSCRIPTION pools: entitlement end date; pool stops counting purchased_quantity after this instant", default: null }
  - name: Device
    parent: VirtualAccount
    common_fields: true
    fields:
      - { name: virtual_account_id, type: string, source: input, description: "FK -> VirtualAccount.id; segment the device is registered to" }
      - { name: serial_number, type: string, source: input, description: "Hardware serial number", constraints: "unique globally" }
      - { name: product_family, type: string, source: input, description: "Product family code used to look up lifecycle milestones" }
      - { name: registration_state, type: enum, source: system, description: "Device registration lifecycle", default: PENDING, constraints: "one of {PENDING, REGISTERED, DEREGISTERED, RETIRED}" }
      - { name: registered_at, type: datetime, source: system, description: "Logical-clock timestamp of registration", default: null }
      - { name: last_sync_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest accepted usage sync from this device", default: null }
  - name: DeviceLicenseAssignment
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id" }
      - { name: license_pool_id, type: string, source: input, description: "FK -> LicensePool.id" }
      - { name: quantity, type: integer, source: input, description: "License units this device consumes from the pool", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "Assignment lifecycle", default: ACTIVE, constraints: "one of {ACTIVE, RELEASED}" }
      - { name: assigned_at, type: datetime, source: system, description: "Logical-clock assignment time" }
  - name: UsageReport
    parent: Device
    common_fields: false
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; reporting device" }
      - { name: reported_at, type: datetime, source: input, description: "Device-side logical timestamp of measurement" }
      - { name: lines, type: array, source: input, description: "Array of {license_pool_id, quantity} consumption lines; each line references a LicensePool in the same VirtualAccount as the device" }
      - { name: status, type: enum, source: system, description: "ACCEPTED when applied to pools; REJECTED when stale or malformed", constraints: "one of {ACCEPTED, REJECTED}" }
      - { name: rejection_reason, type: string, source: system, description: "Set when status is REJECTED", default: null }
  - name: ComplianceEvent
    parent: LicensePool
    common_fields: false
    fields:
      - { name: license_pool_id, type: string, source: system, description: "FK -> LicensePool.id; pool this event belongs to" }
      - { name: event_type, type: enum, source: system, description: "Kind of compliance transition recorded", constraints: "one of {OVERAGE_DETECTED, GRACE_STARTED, GRACE_EXPIRED, RESTORED_TO_COMPLIANCE}" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp of the event" }
      - { name: consumed_quantity, type: integer, source: system, description: "Pool consumption snapshot at event time" }
      - { name: purchased_quantity, type: integer, source: system, description: "Pool entitlement snapshot at event time" }
  - name: ProductLifecycleMilestone
    parent: null
    common_fields: false
    fields:
      - { name: product_family, type: string, source: input, description: "Product family the milestone applies to" }
      - { name: milestone_type, type: enum, source: input, description: "Lifecycle milestone kind", constraints: "one of {END_OF_SALE, END_OF_LIFE, END_OF_SUPPORT}" }
      - { name: effective_date, type: datetime, source: input, description: "Logical date from which the milestone applies (inclusive)" }
  - name: ServiceContract
    parent: SmartAccount
    common_fields: true
    fields:
      - { name: smart_account_id, type: string, source: input, description: "FK -> SmartAccount.id; customer account owning the contract" }
      - { name: contract_number, type: string, source: input, description: "External contract reference", constraints: "unique" }
      - { name: service_level, type: enum, source: input, description: "Replacement service level", constraints: "one of {DEPOT_RETURN, ADVANCE_NBD, ADVANCE_4H}" }
      - { name: support_tier, type: enum, source: input, description: "Technical support access tier", constraints: "one of {SOFTWARE_ONLY, SOFTWARE_HARDWARE, FULL}" }
      - { name: start_date, type: datetime, source: input, description: "Coverage start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Coverage end (exclusive); must be after start_date" }
      - { name: status, type: enum, source: system, description: "Contract lifecycle", default: ACTIVE, constraints: "one of {ACTIVE, EXPIRED, CANCELLED}" }
  - name: ContractCoverage
    parent: null
    common_fields: true
    fields:
      - { name: service_contract_id, type: string, source: input, description: "FK -> ServiceContract.id" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; covered serial number", constraints: "at most one ACTIVE coverage row per device_id" }
      - { name: status, type: enum, source: system, description: "Coverage lifecycle", default: ACTIVE, constraints: "one of {ACTIVE, RELEASED, VOIDED}" }
      - { name: covered_from, type: datetime, source: system, description: "Logical-clock time the coverage attached" }
  - name: RmaCase
    parent: null
    common_fields: true
    fields:
      - { name: contract_coverage_id, type: string, source: input, description: "FK -> ContractCoverage.id; coverage authorizing this RMA" }
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; copied from coverage at creation" }
      - { name: failure_description, type: string, source: input, description: "Free-text failure description" }
      - { name: status, type: enum, source: system, description: "RMA logistics lifecycle", default: OPENED, constraints: "one of {OPENED, REPLACEMENT_SHIPPED, REPLACEMENT_DELIVERED, DEFECTIVE_RETURNED, CLOSED, CANCELLED}" }
      - { name: ship_by, type: datetime, source: computed, description: "SLA deadline for shipping the replacement, derived from service_level: ADVANCE_4H = opened_at + 4h; ADVANCE_NBD = opened_at + 24h; DEPOT_RETURN = null (no advance ship)" }
      - { name: opened_at, type: datetime, source: system, description: "Logical-clock open time" }
      - { name: sla_breached, type: boolean, source: computed, description: "True when replacement not shipped by ship_by (ADVANCE levels) or defective unit not returned within DEPOT_RETURN_WINDOW_DAYS of delivery (DEPOT_RETURN)", default: false }
  - name: LicenseTransferRequest
    parent: null
    common_fields: true
    fields:
      - { name: source_pool_id, type: string, source: input, description: "FK -> LicensePool.id; pool licenses move out of" }
      - { name: target_virtual_account_id, type: string, source: input, description: "FK -> VirtualAccount.id; destination segment" }
      - { name: quantity, type: integer, source: input, description: "Units to transfer", constraints: ">= 1" }
      - { name: reason, type: enum, source: input, description: "Transfer motivation", constraints: "one of {HARDWARE_REFRESH, ACCOUNT_REORG, PARTNER_EXIT}" }
      - { name: status, type: enum, source: system, description: "Approval workflow state", default: PENDING_APPROVAL, constraints: "one of {PENDING_APPROVAL, APPROVED, REJECTED, EXECUTED, CANCELLED}" }
      - { name: requested_by_partner_org_id, type: string, source: system, description: "FK -> PartnerOrg.id; set when a partner initiated the request, else null", default: null }
      - { name: decided_by, type: string, source: system, description: "Actor id that approved or rejected", default: null }

state_machines:
  - entity: SmartAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/smart-accounts/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["SmartAccount.status == ACTIVE"]
        side_effects: ["blocks new Device activation, LicensePool creation, and ContractCoverage attachment for this account", "increments SmartAccount.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/smart-accounts/{id}/reactivate"
        actor: PlatformAdmin
        preconditions: ["SmartAccount.status == SUSPENDED"]
        side_effects: ["increments SmartAccount.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/smart-accounts/{id}/close"
        actor: PlatformAdmin
        preconditions: ["SmartAccount.status == ACTIVE", "no Device under this account in registration_state REGISTERED", "no RmaCase under this account in non-terminal status {OPENED, REPLACEMENT_SHIPPED, REPLACEMENT_DELIVERED, DEFECTIVE_RETURNED}", "no LicenseTransferRequest touching this account in status PENDING_APPROVAL or APPROVED"]
        side_effects: ["all VirtualAccount rows under this account transition ACTIVE -> ARCHIVED", "all ACTIVE ServiceContract rows under this account transition ACTIVE -> CANCELLED, which itself VOIDs their ACTIVE ContractCoverage rows", "all ACTIVE PartnerDelegation rows for this account transition ACTIVE -> REVOKED", "increments SmartAccount.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /api/smart-accounts/{id}/close"
        actor: PlatformAdmin
        preconditions: ["same as ACTIVE -> CLOSED"]
        side_effects: ["same cascade as ACTIVE -> CLOSED", "increments SmartAccount.version by 1"]
  - entity: PartnerDelegation
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/partner-delegations/{id}/revoke, or cascaded from SmartAccount close"
        actor: AccountAdmin | PlatformAdmin | system
        preconditions: ["PartnerDelegation.status == ACTIVE"]
        side_effects: ["sets revoked_at to current logical clock", "increments PartnerDelegation.version by 1"]
  - entity: VirtualAccount
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /api/virtual-accounts/{id}/archive, or cascaded from SmartAccount close"
        actor: AccountAdmin | PartnerManager | PlatformAdmin | system
        preconditions: ["VirtualAccount.status == ACTIVE", "no Device under this VirtualAccount in registration_state REGISTERED or PENDING", "no LicensePool under this VirtualAccount with compliance_state IN {IN_GRACE, OUT_OF_COMPLIANCE}"]
        side_effects: ["increments VirtualAccount.version by 1"]
  - entity: Device
    initial_state: PENDING
    terminal_states: [RETIRED]
    transitions:
      - from: PENDING
        to: REGISTERED
        trigger: "POST /api/devices/{id}/activate"
        actor: AccountAdmin | PartnerManager | PlatformAdmin
        preconditions: ["Device.registration_state == PENDING", "owning VirtualAccount.status == ACTIVE", "owning SmartAccount.status == ACTIVE", "owning SmartAccount.compliance_posture != NON_COMPLIANT", "no ProductLifecycleMilestone of type END_OF_LIFE for Device.product_family with effective_date <= current logical clock"]
        side_effects: ["sets registered_at and last_sync_at to current logical clock", "increments Device.version by 1"]
      - from: REGISTERED
        to: DEREGISTERED
        trigger: "POST /api/devices/{id}/deregister"
        actor: AccountAdmin | PartnerManager | PlatformAdmin
        preconditions: ["Device.registration_state == REGISTERED", "no RmaCase for this device in non-terminal status"]
        side_effects: ["all ACTIVE DeviceLicenseAssignment rows for this device transition ACTIVE -> RELEASED, each release itself triggering recomputation of the referenced LicensePool.consumed_quantity and compliance_state", "increments Device.version by 1"]
      - from: DEREGISTERED
        to: REGISTERED
        trigger: "POST /api/devices/{id}/activate (re-registration cycle)"
        actor: AccountAdmin | PartnerManager | PlatformAdmin
        preconditions: ["Device.registration_state == DEREGISTERED", "owning VirtualAccount.status == ACTIVE", "owning SmartAccount.status == ACTIVE", "owning SmartAccount.compliance_posture != NON_COMPLIANT", "no END_OF_LIFE milestone in effect for Device.product_family"]
        side_effects: ["sets registered_at and last_sync_at to current logical clock", "increments Device.version by 1"]
      - from: DEREGISTERED
        to: RETIRED
        trigger: "POST /api/devices/{id}/retire"
        actor: AccountAdmin | PartnerManager | PlatformAdmin
        preconditions: ["Device.registration_state == DEREGISTERED", "no ContractCoverage row for this device in status ACTIVE"]
        side_effects: ["increments Device.version by 1"]
  - entity: LicensePool
    initial_state: COMPLIANT
    terminal_states: []
    note: "compliance_state is computed, not directly settable; the machine cycles COMPLIANT -> IN_GRACE -> OUT_OF_COMPLIANCE and back to COMPLIANCE on cure. SUBSCRIPTION pools additionally lose purchased_quantity at subscription_expires_at (treated as 0 after expiry), which can itself trigger overage."
    transitions:
      - from: COMPLIANT
        to: IN_GRACE
        trigger: "system recompute after usage sync, assignment create, or subscription expiry pushes consumed_quantity > purchased_quantity"
        actor: system
        preconditions: ["consumed_quantity > effective purchased_quantity", "previously compliant"]
        side_effects: ["sets overage_detected_at to current logical clock and grace_deadline = overage_detected_at + GRACE_PERIOD_DAYS", "appends ComplianceEvent OVERAGE_DETECTED and GRACE_STARTED", "recomputes owning SmartAccount.compliance_posture (GRACE when no pool is OUT_OF_COMPLIANCE)", "increments LicensePool.version by 1"]
      - from: IN_GRACE
        to: OUT_OF_COMPLIANCE
        trigger: "system evaluation at logical clock advance: current time > grace_deadline while still overdrawn"
        actor: system
        preconditions: ["compliance_state == IN_GRACE", "current logical clock > grace_deadline", "consumed_quantity still > purchased_quantity"]
        side_effects: ["appends ComplianceEvent GRACE_EXPIRED", "recomputes owning SmartAccount.compliance_posture to NON_COMPLIANT", "increments LicensePool.version by 1"]
      - from: IN_GRACE
        to: COMPLIANT
        trigger: "system recompute after purchase increase, assignment release, transfer-in, or usage sync brings consumed_quantity <= purchased_quantity"
        actor: system
        preconditions: ["consumed_quantity <= effective purchased_quantity"]
        side_effects: ["clears overage_detected_at and grace_deadline", "appends ComplianceEvent RESTORED_TO_COMPLIANCE", "recomputes owning SmartAccount.compliance_posture", "increments LicensePool.version by 1"]
      - from: OUT_OF_COMPLIANCE
        to: COMPLIANT
        trigger: "system recompute after cure (same conditions as IN_GRACE -> COMPLIANT)"
        actor: system
        preconditions: ["consumed_quantity <= effective purchased_quantity"]
        side_effects: ["clears overage fields", "appends ComplianceEvent RESTORED_TO_COMPLIANCE", "recomputes owning SmartAccount.compliance_posture", "increments LicensePool.version by 1"]
  - entity: DeviceLicenseAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /api/license-assignments/{id}/release, or cascaded from Device deregister/retire"
        actor: AccountAdmin | PartnerManager | PlatformAdmin | system
        preconditions: ["DeviceLicenseAssignment.status == ACTIVE"]
        side_effects: ["recomputes LicensePool.consumed_quantity (removes this assignment's quantity), which cascades into compliance_state recompute and SmartAccount.compliance_posture recompute", "increments DeviceLicenseAssignment.version by 1"]
  - entity: UsageReport
    initial_state: ACCEPTED
    terminal_states: [ACCEPTED, REJECTED]
    note: "Reports are append-only; REJECTED rows never mutate pools. A report whose reported_at is strictly older than the device's last accepted report timestamp is REJECTED (stale)."
    transitions:
      - from: ACCEPTED
        to: ACCEPTED
        trigger: "n/a (immutable)"
        actor: system
        preconditions: []
        side_effects: []
  - entity: ServiceContract
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system evaluation at logical clock advance: current time >= end_date"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects: ["all ACTIVE ContractCoverage rows under this contract transition ACTIVE -> VOIDED, each VOID itself blocking future RMA creation on that device", "increments ServiceContract.version by 1"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/service-contracts/{id}/cancel, or cascaded from SmartAccount close"
        actor: PlatformAdmin | AccountAdmin | system
        preconditions: ["status == ACTIVE", "no RmaCase under this contract in non-terminal status"]
        side_effects: ["all ACTIVE ContractCoverage rows under this contract transition ACTIVE -> VOIDED", "increments ServiceContract.version by 1"]
  - entity: ContractCoverage
    initial_state: ACTIVE
    terminal_states: [RELEASED, VOIDED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /api/contract-coverages/{id}/release"
        actor: AccountAdmin | PartnerManager | PlatformAdmin
        preconditions: ["status == ACTIVE", "no RmaCase under this coverage in non-terminal status"]
        side_effects: ["increments ContractCoverage.version by 1"]
      - from: ACTIVE
        to: VOIDED
        trigger: "cascaded from ServiceContract EXPIRED or CANCELLED"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects: ["increments ContractCoverage.version by 1"]
  - entity: RmaCase
    initial_state: OPENED
    terminal_states: [CLOSED, CANCELLED]
    note: "Branching machine: ADVANCE_* levels follow OPENED -> REPLACEMENT_SHIPPED -> REPLACEMENT_DELIVERED -> DEFECTIVE_RETURNED -> CLOSED. DEPOT_RETURN follows OPENED -> DEFECTIVE_RETURNED (customer ships first) -> REPLACEMENT_SHIPPED -> REPLACEMENT_DELIVERED -> CLOSED. Branch is selected by the contract's service_level at creation."
    transitions:
      - from: OPENED
        to: REPLACEMENT_SHIPPED
        trigger: "POST /api/rma-cases/{id}/ship-replacement (ADVANCE_NBD / ADVANCE_4H branch)"
        actor: LogisticsAgent | PlatformAdmin
        preconditions: ["status == OPENED", "contract service_level IN {ADVANCE_NBD, ADVANCE_4H}"]
        side_effects: ["sets sla_breached when current logical clock > ship_by", "increments RmaCase.version by 1"]
      - from: OPENED
        to: DEFECTIVE_RETURNED
        trigger: "POST /api/rma-cases/{id}/receive-defective (DEPOT_RETURN branch: defective unit arrives first)"
        actor: LogisticsAgent | PlatformAdmin
        preconditions: ["status == OPENED", "contract service_level == DEPOT_RETURN"]
        side_effects: ["increments RmaCase.version by 1"]
      - from: DEFECTIVE_RETURNED
        to: REPLACEMENT_SHIPPED
        trigger: "POST /api/rma-cases/{id}/ship-replacement (DEPOT_RETURN branch: ship only after defective received)"
        actor: LogisticsAgent | PlatformAdmin
        preconditions: ["status == DEFECTIVE_RETURNED", "contract service_level == DEPOT_RETURN"]
        side_effects: ["increments RmaCase.version by 1"]
      - from: REPLACEMENT_SHIPPED
        to: REPLACEMENT_DELIVERED
        trigger: "POST /api/rma-cases/{id}/confirm-delivery"
        actor: LogisticsAgent | PlatformAdmin
        preconditions: ["status == REPLACEMENT_SHIPPED"]
        side_effects: ["on ADVANCE branches, sets sla_breached when defective unit still outstanding past delivery + DEPOT_RETURN_WINDOW_DAYS (evaluated lazily on subsequent reads and transitions)", "increments RmaCase.version by 1"]
      - from: REPLACEMENT_DELIVERED
        to: DEFECTIVE_RETURNED
        trigger: "POST /api/rma-cases/{id}/receive-defective (ADVANCE branches: customer returns defective after receiving replacement)"
        actor: LogisticsAgent | PlatformAdmin
        preconditions: ["status == REPLACEMENT_DELIVERED", "contract service_level IN {ADVANCE_NBD, ADVANCE_4H}"]
        side_effects: ["sets sla_breached when current logical clock > delivery time + DEPOT_RETURN_WINDOW_DAYS", "increments RmaCase.version by 1"]
      - from: DEFECTIVE_RETURNED
        to: CLOSED
        trigger: "POST /api/rma-cases/{id}/close"
        actor: LogisticsAgent | PlatformAdmin
        preconditions: ["status == DEFECTIVE_RETURNED", "replacement has been delivered (REPLACEMENT_DELIVERED was reached on the path)"]
        side_effects: ["increments RmaCase.version by 1"]
      - from: OPENED
        to: CANCELLED
        trigger: "POST /api/rma-cases/{id}/cancel"
        actor: AccountAdmin | PartnerManager | PlatformAdmin
        preconditions: ["status == OPENED"]
        side_effects: ["increments RmaCase.version by 1"]
  - entity: LicenseTransferRequest
    initial_state: PENDING_APPROVAL
    terminal_states: [EXECUTED, REJECTED, CANCELLED]
    note: "Approval-chain machine: PENDING_APPROVAL -> APPROVED -> EXECUTED, with REJECTED and CANCELLED branches. Approve and request must come from different actors when the requester is a partner (delegated administration cannot self-approve)."
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /api/license-transfer-requests/{id}/approve"
        actor: AccountAdmin | PlatformAdmin
        preconditions: ["status == PENDING_APPROVAL", "when requested_by_partner_org_id is not null, approver must be AccountAdmin of the SOURCE pool's SmartAccount (partner cannot approve own request)", "source pool's purchased_quantity - consumed_quantity >= quantity (only un-consumed units may move)"]
        side_effects: ["records decided_by", "increments LicenseTransferRequest.version by 1"]
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /api/license-transfer-requests/{id}/reject"
        actor: AccountAdmin | PlatformAdmin
        preconditions: ["status == PENDING_APPROVAL"]
        side_effects: ["records decided_by", "increments LicenseTransferRequest.version by 1"]
      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /api/license-transfer-requests/{id}/cancel"
        actor: AccountAdmin | PartnerManager | PlatformAdmin
        preconditions: ["status == PENDING_APPROVAL", "canceller belongs to the same side that created the request (partner requester or account admin)"]
        side_effects: ["increments LicenseTransferRequest.version by 1"]
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /api/license-transfer-requests/{id}/execute"
        actor: PlatformAdmin
        preconditions: ["status == APPROVED", "source pool still satisfies purchased_quantity - consumed_quantity >= quantity", "target VirtualAccount.status == ACTIVE", "target SmartAccount.status == ACTIVE"]
        side_effects: ["decrements source LicensePool.purchased_quantity by quantity and increments source LicensePool.version by 1", "creates or tops up a LicensePool in the target VirtualAccount with same sku, license_model, feature_tier (increments its purchased_quantity by quantity; version by 1 if existing)", "each pool mutation recomputes that pool's compliance_state and its SmartAccount.compliance_posture", "increments LicenseTransferRequest.version by 1"]

concurrency_rules:
  - rule_id: pool-purchase-stale-version
    parent_entity: LicensePool
    write_endpoint: "POST /api/license-pools/{id}/purchase-adjustment"
    occ_field: "expected_pool_version"
    description: |
      Adjusting purchased_quantity on a LicensePool whose version has advanced
      since the client last observed it is rejected. This captures the case where
      a usage sync or transfer execution has already legitimately changed the
      pool and the writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-approve-stale-version
    parent_entity: LicenseTransferRequest
    write_endpoint: "POST /api/license-transfer-requests/{id}/approve"
    occ_field: "expected_transfer_version"
    description: |
      Approving a LicenseTransferRequest whose version has advanced since the
      approver last observed it is rejected; a prior approve/reject/cancel has
      already legitimately decided the request and the writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: pool_consumed_quantity
    trigger: "on every accepted UsageReport, DeviceLicenseAssignment create/release, and LicenseTransferRequest execute touching the pool"
    algorithm: aggregation
    formula: |
      effective_purchased = (pool.license_model == SUBSCRIPTION and now >= pool.subscription_expires_at) ? 0 : pool.purchased_quantity
      consumed = sum of quantity over DeviceLicenseAssignment rows with status == ACTIVE and license_pool_id == pool.id
      pool.consumed_quantity := consumed
      compliance: COMPLIANT if consumed <= effective_purchased
                  IN_GRACE if consumed > effective_purchased and overage episode younger than GRACE_PERIOD_DAYS
                  OUT_OF_COMPLIANCE if consumed > effective_purchased and now > grace_deadline
    input_set: "DeviceLicenseAssignment rows with status ACTIVE only; RELEASED rows excluded"
    constants:
      GRACE_PERIOD_DAYS: 90
    precision: "integer units; no rounding"
    variants:
      - name: provisional_consumption
        when: "between usage syncs, before any UsageReport line lands for the current period"
        difference: "consumed_quantity reflects assignments only; device-reported usage lines from the latest ACCEPTED UsageReport REPLACE the per-pool assignment baseline for that device (report truth supersedes assumed install)"
      - name: reconciled_consumption
        when: "after an ACCEPTED UsageReport"
        difference: "pool.consumed_quantity = (assignments for devices with no accepted report in current period) + (report line quantities for devices whose latest report is ACCEPTED); a device whose latest ACCEPTED report omits the pool contributes 0 from that device"
  - name: grace_deadline_projection
    trigger: "when a pool transitions COMPLIANT -> IN_GRACE (overage detected)"
    algorithm: threshold
    formula: |
      overage_detected_at := now (logical clock)
      grace_deadline := overage_detected_at + GRACE_PERIOD_DAYS * 86400 seconds
      OUT_OF_COMPLIANCE triggers when now > grace_deadline (strictly greater; exactly AT the deadline the pool remains IN_GRACE)
    input_set: "single LicensePool entering overage"
    constants:
      GRACE_PERIOD_DAYS: 90
    precision: "second precision on ISO8601 datetimes"
  - name: rma_ship_by
    trigger: "on RmaCase creation"
    algorithm: threshold
    formula: |
      if contract.service_level == ADVANCE_4H:  ship_by = opened_at + 4 * 3600 seconds
      if contract.service_level == ADVANCE_NBD: ship_by = opened_at + 24 * 3600 seconds
      if contract.service_level == DEPOT_RETURN: ship_by = null
      sla_breached (ship side) := replacement shipped at time t with t > ship_by, or still OPENED when now > ship_by
    input_set: "RmaCase + its ServiceContract.service_level"
    constants:
      ADVANCE_4H_SECONDS: 14400
      ADVANCE_NBD_SECONDS: 86400
    precision: "second precision"
  - name: depot_return_sla
    trigger: "on REPLACEMENT_DELIVERED transition and lazily on RmaCase reads/transitions thereafter (ADVANCE branches)"
    algorithm: threshold
    formula: |
      return_deadline := delivered_at + DEPOT_RETURN_WINDOW_DAYS * 86400 seconds
      sla_breached := (defective not returned) and (now > return_deadline)
      Exactly AT the deadline (now == return_deadline) the case is NOT breached; breach requires strictly greater.
    input_set: "RmaCase on an ADVANCE_* branch that reached REPLACEMENT_DELIVERED"
    constants:
      DEPOT_RETURN_WINDOW_DAYS: 30
    precision: "second precision"
  - name: transfer_recompute
    trigger: "on LicenseTransferRequest APPROVED -> EXECUTED"
    algorithm: waterfall_allocation
    formula: |
      Evaluation order pinned: (1) decrement source.purchased_quantity by quantity;
      (2) if target VirtualAccount already holds a LicensePool with same (sku, license_model, feature_tier), increment its purchased_quantity by quantity, else create a new pool with purchased_quantity = quantity;
      (3) recompute source pool consumed/compliance via pool_consumed_quantity;
      (4) recompute target pool compliance (creation of a fresh pool cannot be out of compliance; top-up re-evaluates an existing IN_GRACE/OUT_OF_COMPLIANCE pool and may cure it);
      (5) recompute both SmartAccount.compliance_posture values (same account transfer: recompute once).
    input_set: "source pool, target virtual account pools with matching (sku, license_model, feature_tier)"
    constants: {}
    precision: "integer units"
  - name: tier_upgrade_proration
    trigger: "on POST /api/license-pools/{id}/tier-upgrade"
    algorithm: tiered_pricing
    formula: |
      Remaining-term credit for the OLD tier on SUBSCRIPTION pools:
        days_total = (subscription_expires_at - pool.created_at) / 86400, floor to whole days
        days_left = (subscription_expires_at - now) / 86400, floor to whole days, min 0
        credit_units = purchased_quantity * days_left / days_total, rounded DOWN to whole units (round down first, then apply)
        new purchased_quantity := purchased_quantity + credit_units
      PERPETUAL pools: tier upgrade changes feature_tier only; purchased_quantity unchanged; no proration.
      TIER_MULTIPLIER: ESSENTIALS=1, ADVANTAGE=2, PREMIER=3 (informational; multiplier only documents tier ordering)
      Rounding order pinned: compute days_left/days_total as exact rationals, multiply by purchased_quantity, round DOWN to integer units last.
    input_set: "single LicensePool; SUBSCRIPTION and PERPETUAL take different variants"
    constants:
      TIER_MULTIPLIER_ESSENTIALS: 1
      TIER_MULTIPLIER_ADVANTAGE: 2
      TIER_MULTIPLIER_PREMIER: 3
    precision: "whole units, always round DOWN"
    variants:
      - name: subscription_proration
        when: "pool.license_model == SUBSCRIPTION"
        difference: "applies credit_units formula above"
      - name: perpetual_flat
        when: "pool.license_model == PERPETUAL"
        difference: "feature_tier flips, purchased_quantity untouched, credit_units = 0"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present for all non-anonymous calls"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.7; PartnerManager additionally requires an ACTIVE PartnerDelegation whose partner_org_id == X-User-ID, whose smart_account_id owns the target resource, and whose scope covers the operation (LICENSING for license/device operations, SERVICE_CONTRACTS for contract/RMA operations, FULL for both); revoked or missing delegation -> ERR_FORBIDDEN"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all mutating endpoints"
  - priority: 3
    category: existence
    check: "Every id in the path and every FK in the body exists, validated left-to-right (path first, then body fields in declared order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Request body contains all required input fields with correct types; enum values within declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the invoked transition exists per §1.2 (e.g., activate requires PENDING or DEREGISTERED; approve requires PENDING_APPROVAL)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Owning SmartAccount.status == ACTIVE for device activation, pool creation/adjustment, coverage attachment, transfer creation; SUSPENDED or CLOSED blocks the mutation"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "device activate, license-pool create/adjust/tier-upgrade, contract-coverage create, transfer create"
  - priority: 7
    category: state
    check: "Owning SmartAccount.compliance_posture != NON_COMPLIANT for Device activation (a NON_COMPLIANT account may not register new devices; GRACE still may)"
    error_id: ERR_ACCOUNT_NON_COMPLIANT
    http_status: 409
    applies_to: "POST /api/devices/{id}/activate"
  - priority: 8
    category: business_safety
    check: "Device activation blocked when an END_OF_LIFE ProductLifecycleMilestone for the device's product_family has effective_date <= current logical clock (EOL products cannot newly register); END_OF_SALE alone does NOT block activation; END_OF_SUPPORT blocks coverage attachment instead"
    error_id: ERR_PRODUCT_END_OF_LIFE
    http_status: 409
    applies_to: "POST /api/devices/{id}/activate"
  - priority: 9
    category: business_safety
    check: "Partner-initiated LicenseTransferRequest cannot be approved by the same partner side: when requested_by_partner_org_id is not null, approve requires an AccountAdmin of the source pool's SmartAccount or PlatformAdmin"
    error_id: ERR_SELF_APPROVAL_FORBIDDEN
    http_status: 403
    applies_to: "POST /api/license-transfer-requests/{id}/approve"
  - priority: 10
    category: business_temporal
    check: "ServiceContract end_date strictly after start_date; coverage attach requires current logical clock within [start_date, end_date) and contract status ACTIVE; END_OF_SUPPORT milestone with effective_date <= now for the device's product_family blocks new coverage attachment"
    error_id: ERR_CONTRACT_WINDOW_INVALID
    http_status: 422
    applies_to: "service-contract create, contract-coverage create"
  - priority: 11
    category: business_referential
    check: "ContractCoverage device uniqueness: no other ACTIVE ContractCoverage row may reference the same device_id"
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /api/contract-coverages"
  - priority: 12
    category: business_referential
    check: "UsageReport line references: every line's license_pool_id must belong to the same VirtualAccount as the reporting device; cross-virtual-account lines reject the whole report"
    error_id: ERR_REPORT_POOL_MISMATCH
    http_status: 422
    applies_to: "POST /api/devices/{id}/usage-reports"
  - priority: 13
    category: business_temporal
    check: "UsageReport staleness: a report with reported_at strictly earlier than the device's last ACCEPTED report reported_at is REJECTED (status REJECTED, no pool mutation), returned as ERR_STALE_REPORT"
    error_id: ERR_STALE_REPORT
    http_status: 422
    applies_to: "POST /api/devices/{id}/usage-reports"
  - priority: 14
    category: business_fiscal
    check: "LicenseTransferRequest creation and execution: source pool's un-consumed balance (purchased_quantity - consumed_quantity) >= quantity; re-checked at execute time against current pool state"
    error_id: ERR_INSUFFICIENT_TRANSFERABLE
    http_status: 422
    applies_to: "license-transfer-requests create, approve, execute"
  - priority: 15
    category: business_fiscal
    check: "Pool purchase adjustment cannot reduce purchased_quantity below 0; reductions that leave consumed_quantity > purchased_quantity are allowed (they trigger overage) but reductions below 0 are not"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "POST /api/license-pools/{id}/purchase-adjustment"
  - priority: 16
    category: business_constraint
    check: "RmaCase creation requires an ACTIVE ContractCoverage on the device whose ServiceContract.status == ACTIVE and current logical clock within [start_date, end_date); support_tier must include hardware (SOFTWARE_HARDWARE or FULL) for RMA; SOFTWARE_ONLY contracts never authorize RMA"
    error_id: ERR_NO_ACTIVE_COVERAGE
    http_status: 422
    applies_to: "POST /api/rma-cases"
  - priority: 17
    category: business_constraint
    check: "RMA branch enforcement: ship-replacement from OPENED requires ADVANCE_* service level; receive-defective from OPENED requires DEPOT_RETURN; the DEPOT_RETURN branch must receive defective before shipping replacement"
    error_id: ERR_RMA_BRANCH_VIOLATION
    http_status: 409
    applies_to: "rma-cases ship-replacement, receive-defective"
  - priority: 18
    category: business_constraint
    check: "Uniqueness: SmartAccount.account_ref, PartnerOrg.partner_ref, ServiceContract.contract_number globally unique; Device.serial_number globally unique; VirtualAccount.name unique within smart_account_id; LicensePool.(sku) unique within virtual_account_id"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "create endpoints"

endpoints:
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Test-driving endpoint: sets the logical clock. Server startup default (before any call) is exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock. Advancing the clock triggers lazy evaluation of pool grace expiry, subscription expiry, contract expiry, and RMA SLA breach.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["evaluates LicensePool IN_GRACE -> OUT_OF_COMPLIANCE when now > grace_deadline", "evaluates ServiceContract ACTIVE -> EXPIRED when now >= end_date", "evaluates subscription pool effective purchased_quantity", "evaluates RmaCase sla_breached"] }
  - { method: POST, path: "/api/smart-accounts", description: "Create a SmartAccount", roles: [PlatformAdmin], code: 201, input: [account_ref, display_name, "managing_partner_id?"], output: SmartAccount, side_effects: ["compliance_posture initialized to COMPLIANT"] }
  - { method: GET, path: "/api/smart-accounts", description: "List smart accounts with pagination", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: ["limit?", "offset?"], output: "SmartAccount[]", side_effects: [] }
  - { method: GET, path: "/api/smart-accounts/{id}", description: "Get one smart account including computed compliance_posture", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: SmartAccount, side_effects: [] }
  - { method: POST, path: "/api/smart-accounts/{id}/suspend", description: "Suspend an account", roles: [PlatformAdmin], code: 200, input: [], output: SmartAccount, side_effects: ["status ACTIVE -> SUSPENDED", "increments SmartAccount.version by 1"] }
  - { method: POST, path: "/api/smart-accounts/{id}/reactivate", description: "Reactivate a suspended account", roles: [PlatformAdmin], code: 200, input: [], output: SmartAccount, side_effects: ["status SUSPENDED -> ACTIVE", "increments SmartAccount.version by 1"] }
  - { method: POST, path: "/api/smart-accounts/{id}/close", description: "Close an account; cascades archive/void/revoke", roles: [PlatformAdmin], code: 200, input: [], output: SmartAccount, side_effects: ["VirtualAccount ACTIVE -> ARCHIVED", "ServiceContract ACTIVE -> CANCELLED which VOIDs ACTIVE ContractCoverage", "PartnerDelegation ACTIVE -> REVOKED", "increments SmartAccount.version by 1"] }
  - { method: GET, path: "/api/smart-accounts/{id}/virtual-accounts", description: "List virtual accounts of a smart account", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: ["limit?", "offset?"], output: "VirtualAccount[]", side_effects: [] }
  - { method: GET, path: "/api/smart-accounts/{id}/service-contracts", description: "List service contracts of a smart account", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: ["limit?", "offset?"], output: "ServiceContract[]", side_effects: [] }
  - { method: POST, path: "/api/partner-orgs", description: "Create a partner organization", roles: [PlatformAdmin], code: 201, input: [partner_ref, display_name], output: PartnerOrg, side_effects: [] }
  - { method: GET, path: "/api/partner-orgs/{id}", description: "Get one partner org", roles: [PlatformAdmin, PartnerManager], code: 200, input: [], output: PartnerOrg, side_effects: [] }
  - { method: GET, path: "/api/partner-orgs/{id}/delegations", description: "List delegations granted to a partner org", roles: [PlatformAdmin, PartnerManager], code: 200, input: ["limit?", "offset?"], output: "PartnerDelegation[]", side_effects: [] }
  - { method: POST, path: "/api/partner-delegations", description: "Grant a partner delegated administration over a smart account", roles: [PlatformAdmin, AccountAdmin], code: 201, input: [partner_org_id, smart_account_id, scope], output: PartnerDelegation, side_effects: ["sets granted_at to logical clock"] }
  - { method: GET, path: "/api/partner-delegations", description: "List delegations; filterable by smart_account_id or partner_org_id", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: ["smart_account_id?", "partner_org_id?", "limit?", "offset?"], output: "PartnerDelegation[]", side_effects: [] }
  - { method: GET, path: "/api/partner-delegations/{id}", description: "Get one delegation", roles: [PlatformAdmin, PartnerManager, AccountAdmin], code: 200, input: [], output: PartnerDelegation, side_effects: [] }
  - { method: POST, path: "/api/partner-delegations/{id}/revoke", description: "Revoke a delegation", roles: [PlatformAdmin, AccountAdmin], code: 200, input: [], output: PartnerDelegation, side_effects: ["status ACTIVE -> REVOKED", "sets revoked_at", "increments PartnerDelegation.version by 1"] }
  - { method: POST, path: "/api/virtual-accounts", description: "Create a virtual account segment under a smart account", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 201, input: [smart_account_id, name], output: VirtualAccount, side_effects: [] }
  - { method: GET, path: "/api/virtual-accounts/{id}", description: "Get one virtual account", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: VirtualAccount, side_effects: [] }
  - { method: POST, path: "/api/virtual-accounts/{id}/archive", description: "Archive an empty/compliant virtual account", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: [], output: VirtualAccount, side_effects: ["status ACTIVE -> ARCHIVED", "increments VirtualAccount.version by 1"] }
  - { method: GET, path: "/api/virtual-accounts/{id}/license-pools", description: "List license pools of a virtual account", roles: [PlatformAdmin, AccountAdmin, PartnerManager], code: 200, input: ["limit?", "offset?"], output: "LicensePool[]", side_effects: [] }
