      - name: corner_val_sequence_gap_checked_before_season_window
        claim_type: Cascading validation
        grounds:
          - validations[priority=19]
          - validations[priority=22]
          - errors[ERR_EPISODE_SEQUENCE_GAP]
          - errors[ERR_SEASON_WINDOW_VIOLATION]
        distinguishing_aspect: |
          An episode submitted with sequence_no 3 when only sequence 1 exists AND a
          planned_release_at outside the season window returns ERR_EPISODE_SEQUENCE_GAP: the
          roadmap slot is resolved first, so the window check never reports.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE, 2026-08-01 -> 2026-10-30."
            - "Only Episode 1 exists, so the next admissible sequence_no is 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
