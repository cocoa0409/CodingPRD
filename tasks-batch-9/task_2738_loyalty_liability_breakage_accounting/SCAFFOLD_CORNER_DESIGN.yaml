  # ============================================================================
  # SECTION 8 of 9 - cross_cutting_complexity_layers (8 instances)
  # complexity_profile.complexity_layers declares dual_variant_calculation,
  # cascading_side_effects, optimistic_concurrency and
  # derived_field_reconciliation. Both §1.7 concurrency_rules get a full recipe;
  # the two cascade chains and the two dual-variant calculations are already
  # driven at depth by SCAFFOLD_DIFFICULTY_DESIGN.yaml and are stubbed.
  # ============================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: ccl_occ_stale_program_version_blocks_estimate_approval
