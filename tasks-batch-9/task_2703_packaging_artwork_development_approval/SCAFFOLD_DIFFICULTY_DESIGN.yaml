              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { claim_b: "$.data.id" }
            - call: "POST /marketing-claims"
              payload: {claim_code: "CLM-NAS-01", claim_text: "NO ADDED SUGAR", claim_type: "NUTRIENT_CONTENT", market_code: "US", substantiation_ref: "DOSSIER-NAS-2026-01"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { claim_c: "$.data.id" }
            - call: "POST /marketing-claims"
              payload: {claim_code: "CLM-NAS-01", claim_text: "NO ADDED SUGAR", claim_type: "NUTRIENT_CONTENT", market_code: "CA", substantiation_ref: "DOSSIER-NAS-2026-01"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { claim_d: "$.data.id" }
            - call: "POST /marketing-claims"
