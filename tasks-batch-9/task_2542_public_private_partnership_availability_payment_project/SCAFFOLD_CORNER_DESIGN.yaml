      - name: an_upheld_dispute_cascade_runs_five_links_deep
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.DeductionDispute
        excluded_because:
          difficulty_instance: dispute_upheld_cascade_reaches_the_concessionaire_at_depth_five
          rationale: |
            CASCADE A is driven end-to-end there — dispute UPHELD, event allowance zeroed,
            period money and payment axis restated, concession YTD and breach flag recomputed
            — with the intermediate values asserted at every link. A breadth instance would
            have to rebuild the same five-link fixture to observe a strict subset.

      - name: disbursement_cascade_seeds_the_lifecycle_reserve
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints[POST /ppp/drawdown-milestones/{id}/disburse]
        excluded_because:
          difficulty_instance: milestone_disbursement_cascade_seeds_the_reserve_at_depth_four
          rationale: |
            CASCADE B's four links, the CONSTRUCTION_START_PCT gate that decides whether link
            3 fires at all, and the seeded ledger entry are all asserted there; every corner
            in this file that reaches OPERATIONS already relies on that cascade's output as
            its fixture.

      - name: the_two_cap_variants_are_computed_from_the_same_event_set
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.period_deduction_cap_allocation
        excluded_because:
          difficulty_instance: deduction_cap_allocation_sequential_vs_pro_rata_diverge_per_event
          rationale: |
            The divergence, the pinned SEQUENTIAL-feeds-payment rule and the per-event delta
            are exhausted there. The breadth angle that remains — that the two totals agree
            in aggregate once the cap binds — is asserted in the payment-summary computed-read
            instance in the endpoints section.

      - name: the_termination_variant_is_chosen_by_the_contractual_ground
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.termination_compensation
        excluded_because:
          difficulty_instance: termination_compensation_variant_selected_by_trigger_reason
          rationale: |
            All four variants are run off one shared fixture there, including the arms where
            terms drop out entirely, so variant selection is fully covered; this file only
            adds the conditional-input refusal for the market-value variant and the
            AUTHORITY_VOLUNTARY arm reached through the settlement cascade.

      - name: withdrawing_an_event_clears_the_persistent_breach_flag
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.persistent_breach_evaluation
          - endpoints[POST /ppp/deduction-events/{id}/withdraw]
        distinguishing_aspect: |
          The reset half of the threshold layer. persistent_breach_flag is declared as
          RECOMPUTED rather than latched, so a withdrawal that drops the ISSUED|DISPUTED
          point total from exactly 500 back to 300 must clear the flag — a latched
          implementation passes every rising-edge test and fails only here. The boundary walk
          itself (300 / 499 / 500 with >=) lives in the calculations section; this instance
          owns the descent, and pairs it with the money identity: the withdrawn event's
          allowance goes to 0 and the period's net returns to 8229167.
        test_recipe:
          setup:
            - "The base chain with ServicePeriod 1 verified at (100, 2, 4). Two events issued by officer-alpha: 300 points (raw 375000) and 200 points (raw 250000). Total 500 points -> persistent_breach_flag true; total_deduction 625000, net 7979167."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessions/${csn_id}/certify-service-commencement"
              payload: { actual_commencement_date: "2027-01-21" }
              as: IndependentCertifier
            - call: "POST /ppp/concessions/${csn_id}/service-periods"
              payload: { period_index: 1, period_start: "2027-03-01", period_end: "2027-04-01" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { sp1_id: $.data.id, sp1_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/service-periods/${sp1_id}/performance-reports"
              payload: { unavailable_minutes: 100, category_a_failures: 2, category_b_failures: 4, expected_service_period_version: "${sp1_v}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
            - call: "POST /ppp/service-periods/${sp1_id}/verify"
              payload: { verified_unavailable_minutes: 100, verified_category_a_failures: 2, verified_category_b_failures: 4 }
              as: AuthorityOfficer
              as_user_id: "officer-beta"
            - call: "POST /ppp/service-periods/${sp1_id}/deduction-events"
              payload: { deduction_type: "UNAVAILABILITY", points: 300 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { de1_id: $.data.id }
            - call: "POST /ppp/service-periods/${sp1_id}/deduction-events"
              payload: { deduction_type: "PERFORMANCE_FAILURE", points: 200 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { de2_id: $.data.id }
            - call: "GET /ppp/concessions/${csn_id}/payment-summary"
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
          trigger:
            - call: "POST /ppp/deduction-events/${de2_id}/withdraw"
              payload: { withdrawal_reason: "Category B failures were double counted." }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
          assert:
            - "the setup's payment-summary read showed deduction_points_ytd == 500 and persistent_breach_flag == true"
            - "HTTP status is 200"
            - "DeductionEvent.${de2_id}.status == \"WITHDRAWN\" with allowed_amount_cents == 0 and pro_rata_amount_cents == 0"
            - "DeductionEvent.${de2_id}.points == 200 and raw_amount_cents == 250000 — the raw record is preserved, only the allowance is voided"
            - "DeductionEvent.${de1_id}.status == \"ISSUED\" and allowed_amount_cents == 375000"
            - "ServicePeriod.${sp1_id}.total_deduction_cents == 375000 and net_payment_cents == 8229167"
            - "Concession.${csn_id}.persistent_breach_flag == false — recomputed at 300 points, not latched at the earlier 500"
            - "Concession.${csn_id}.availability_deduction_ytd_cents == 375000"
            - "a follow-up GET /ppp/concessions/${csn_id}/payment-summary reports deduction_points_ytd == 300 and persistent_breach_flag == false"

  - section: consistency_model
    instances:
      - name: verification_returns_money_that_depends_on_a_row_it_just_created
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /ppp/service-periods/{id}/verify]
          - calculations.self_report_variance
          - calculations.service_period_net_payment
        distinguishing_aspect: |
          The hardest form of the immediate-consistency claim available in this surface: the
          verify request appends a SELF_REPORT_UNDERSTATEMENT DeductionEvent as a side effect
          and then must return a ServicePeriod body whose money already reflects that unseen
          row. An implementation that computes the response before running the variance step
          — or that defers the recompute to the next read — returns the undeducted gross
          8604167 here and looks correct on a follow-up GET. Nothing may lag: the 200 body
          and an immediately following GET must be identical.
        test_recipe:
          setup:
            - "The base chain to OPERATIONS with ServicePeriod 1 [2027-03-01, 2027-04-01), gross 8604167, cap 1720833."
            - "The concessionaire under-reports: (40, 1, 1) -> reported_points 40*2 + 40 + 10 = 130."
            - "The authority verifies (100, 2, 4) -> verified 320; variance (320-130)/130 = 1.4615 > 0.05; understatement points round_half_up(190 * 1.25) = 238; raw 238 * 1250 = 297500; net 8604167 - 297500 = 8306667."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
              as: PlatformAdmin
              captures: { cnr_id: $.data.id }
            - call: "POST /ppp/concessions"
              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessions/${csn_id}/certify-service-commencement"
              payload: { actual_commencement_date: "2027-01-21" }
              as: IndependentCertifier
            - call: "POST /ppp/concessions/${csn_id}/service-periods"
              payload: { period_index: 1, period_start: "2027-03-01", period_end: "2027-04-01" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { sp1_id: $.data.id, sp1_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/service-periods/${sp1_id}/performance-reports"
              payload: { unavailable_minutes: 40, category_a_failures: 1, category_b_failures: 1, expected_service_period_version: "${sp1_v}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { pr1_id: $.data.id }
          trigger:
            - call: "POST /ppp/service-periods/${sp1_id}/verify"
              payload: { verified_unavailable_minutes: 100, verified_category_a_failures: 2, verified_category_b_failures: 4 }
              as: AuthorityOfficer
              as_user_id: "officer-beta"
          assert:
            - "HTTP status is 200"
            - "the 200 body's reporting_status == \"VERIFIED\" and payment_status == \"UNBILLED\""
            - "the 200 body's unavailable_minutes_verified == 100 and deduction_points_total == 320 and availability_ratio == 0.9978"
            - "the 200 body's total_deduction_cents == 297500 and relief_credit_cents == 0 and net_payment_cents == 8306667"
            - "an immediately following GET /ppp/service-periods/${sp1_id} returns the same total_deduction_cents and net_payment_cents — no field lags"
            - "PerformanceReport.${pr1_id}.status == \"VERIFIED\" and reported_points == 130 and variance_pct == 1.4615"
            - "GET /ppp/deduction-events?service_period_id=${sp1_id} returns total_count == 1 with deduction_type == \"SELF_REPORT_UNDERSTATEMENT\", points == 238, raw_amount_cents == 297500, allowed_amount_cents == 297500 and status == \"ISSUED\""
            - "Concession.${csn_id}.availability_deduction_ytd_cents == 297500 and deduction_points_ytd == 238 and persistent_breach_flag == false"
            - "GET /ppp/concessions/${csn_id}/payment-summary reports availability_deduction_ytd_cents == 297500 in the same breath"

      - name: the_disbursement_response_already_shows_the_seeded_reserve
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /ppp/drawdown-milestones/{id}/disburse]
        excluded_because:
          difficulty_instance: milestone_disbursement_cascade_seeds_the_reserve_at_depth_four
          rationale: |
            That instance asserts the concession's recomputed drawn totals, status and reserve
            balance immediately after the disbursing request, which is the same
            same-request-visibility claim applied to the other end of the model; repeating it
            here would add a second identical read of an already-asserted cascade.
