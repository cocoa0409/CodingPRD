            - call: "POST /weather-events"
              payload: { course_id: "${course_id}", event_type: "FROST", delay_minutes: 30, expected_clear_at: "2026-08-01T07:30:00Z", expected_course_version: "${course_v_fresh}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { we_id: $.data.id }
          assert:
            - "${course_v_read} == 1 and ${course_v_fresh} == 2"
            - "the first declaration returns HTTP 412 with ${err_id} == ERR_STALE_COURSE_VERSION"
            - "after the refusal GET /courses/${course_id}/weather-events returns total_count == 0 and ${posture_before} == OPEN with frost_delay_minutes == 0"
            - "the retry returns HTTP 201: WeatherEvent.${we_id}.status == ACTIVE and declared_at == 2026-08-01T05:00:00Z"
            - "Course.${course_id}.play_posture == FROST_DELAY, frost_delay_minutes == 30 and version == 3"

      - name: occ_stale_pump_version_blocks_run_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[irrigation-run-create-stale-pump]
