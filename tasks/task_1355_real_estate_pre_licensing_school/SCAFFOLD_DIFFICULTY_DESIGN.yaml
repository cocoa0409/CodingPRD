          trigger:
            - { call: "POST /credit-reports/${rep}/revise", as: ComplianceOfficer, captures: { stRev: $.data.status } }
            - { call: "POST /credit-reports/${rep}/submit", as: ComplianceOfficer, captures: { cnt2: $.data.submission_count, late2: $.data.late_days } }
            - { call: "POST /credit-reports/${rep}/acknowledge", as: StateCommission, captures: { stAck: $.data.status } }
          assert:
            - "CreditReport.${rep}.total_credit_hours == 7.5           # per-line rounded snapshot"
            - "first submit: late_fee_cents == 0 and submission_count == 1   # 2026-09-15 <= deadline 2026-10-30"
            - "after revise: status == DRAFT (cycle back) and submitted_at == null"
            - "after resubmit: submission_count == 2 and late_days == 0"
            - "final status == ACKNOWLEDGED"

  # ---------------------------------------------------------------- rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: exam_invalidation_depth4_cascade
        grounds:
          - state_machines.ExamAttempt.SCORED_to_INVALIDATED
          - state_machines.Enrollment.COMPLETED_to_SEAT_TIME_MET
          - state_machines.Certificate.ACTIVE_to_REVOKED
          - entities.CreditReport.fields.amendment_of_id
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /exam-attempts/{id}/invalidate: attempt INVALIDATED
          (1) causes enrollment COMPLETED -> SEAT_TIME_MET regression (2), which revokes the
          ACTIVE certificate (3), which auto-drafts a negated amendment CreditReport on the
          ACKNOWLEDGED report (4). Different trigger from the offering-cancel and
          approval-expiry cascades.
        test_recipe:
          setup:
            - "LICENSED school; CE course (ce_credit_hours 7.5, required 60 min); enrollment COMPLETED with certificate issued 2026-09-11; base credit report 2026-09-01..2026-09-30 SUBMITTED at 2026-09-15 and ACKNOWLEDGED"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "CE-75", title: "CE Elective", course_type: "CONTINUING_ED", required_seat_minutes: 60, tuition_cents: 10000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 7.5 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Pat Proctor", license_number: "INS-002" }, as: Registrar, captures: { pro: $.data.id } }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu One", email: "s1@x.com", license_goal_state: "TX" }, as: Registrar, captures: { st: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${st}" }, as: Registrar, captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/attendance-records", payload: { session_date: "2026-09-03", minutes: 60 }, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /enrollments/${enr}/exam-attempts", payload: { scheduled_at: "2026-09-11T14:00:00Z", proctor_instructor_id: "${pro}" }, as: Registrar, captures: { att: $.data.id } }
            - { call: "POST /exam-attempts/${att}/verify", as: Proctor, as_user_id: "${pro}" }
            - { call: "POST /exam-attempts/${att}/score", payload: { score_pct: 90 }, as: Instructor, as_user_id: "${ins}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T09:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /enrollments/${enr}/certificate", as: Registrar, captures: { cert: $.data.id } }
            - { call: "POST /credit-reports", payload: { school_id: "${sch}", period_start: "2026-09-01", period_end: "2026-09-30" }, as: ComplianceOfficer, captures: { rep: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T09:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /credit-reports/${rep}/submit", as: ComplianceOfficer }
            - { call: "POST /credit-reports/${rep}/acknowledge", as: StateCommission }
          trigger:
            - { call: "POST /exam-attempts/${att}/invalidate", payload: { reason: "identity verification failed" }, as: Proctor, as_user_id: "${pro}" }
            - { call: "GET /enrollments/${enr}", as: Registrar, captures: { acad: $.data.academic_status, used: $.data.exam_attempts_used } }
            - { call: "GET /certificates/${cert}", as: Registrar, captures: { cst: $.data.status, cwhy: $.data.revoked_reason } }
            - { call: "GET /credit-reports?amendment_of_id=${rep}", as: ComplianceOfficer, captures: { amd: "$.data[0].id", ast: "$.data[0].status", atot: "$.data[0].total_credit_hours" } }
          assert:
            - "ExamAttempt.${att}.status == INVALIDATED                                   # L0 trigger"
            - "Enrollment.${enr}.academic_status == SEAT_TIME_MET                         # L1 regression from COMPLETED"
            - "Enrollment.${enr}.exam_attempts_used == 0                                  # INVALIDATED attempts do not consume slots"
            - "Certificate.${cert}.status == REVOKED and revoked_reason == EXAM_INVALIDATED  # L2"
            - "CreditReport.${amd}.status == DRAFT and amendment_of_id == ${rep}          # L3 auto-amendment"
            - "CreditReport.${amd}.total_credit_hours == -7.5                             # negated revoked line"

      - name: offering_cancel_withdrawal_refund_cascade
        grounds:
          - state_machines.CourseOffering.PUBLISHED_to_CANCELLED
          - state_machines.Enrollment.IN_PROGRESS_to_WITHDRAWN
          - entities.RefundRequest.fields.granted_refund_cents
          - calculations.enrolled_count_seats
        distinguishing_aspect: |
          Depth-2 mutation chain (cancel -> enrollment WITHDRAWN -> RefundRequest
          auto-created) plus aggregate recompute, triggered by
          POST /offerings/{id}/cancel — a different trigger than exam invalidation and
          approval expiry; refund branch collapses to 100% under SCHOOL_CANCELLED.
        test_recipe:
          setup:
            - "LICENSED school; PUBLISHED offering capacity 2; two enrollments both PAID 51500 (charge_total 51500 each); no attendance"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu A", email: "sa@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sa: $.data.id } }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu B", email: "sb@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sb: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sa}" }, as: Registrar, captures: { ea: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sb}" }, as: Registrar, captures: { eb: $.data.id } }
            - { call: "POST /enrollments/${ea}/pay", payload: { amount_cents: 51500 }, as: Registrar }
            - { call: "POST /enrollments/${eb}/pay", payload: { amount_cents: 51500 }, as: Registrar }
          trigger:
            - { call: "POST /offerings/${off}/cancel", as: SchoolDirector, captures: { ost: $.data.status, oc: $.data.enrolled_count, osa: $.data.seats_available } }
            - { call: "GET /refund-requests?enrollment_id=${ea}", as: Registrar, captures: { rra: "$.data[0].id", rraG: "$.data[0].granted_refund_cents" } }
            - { call: "GET /refund-requests?enrollment_id=${eb}", as: Registrar, captures: { rrb: "$.data[0].id", rrbG: "$.data[0].granted_refund_cents" } }
            - { call: "POST /refund-requests/${rra}/approve", as: SchoolDirector }
            - { call: "POST /refund-requests/${rra}/pay", as: Registrar }
            - { call: "GET /enrollments/${ea}", as: Registrar, captures: { eap: $.data.payment_status, ear: $.data.retained_cents } }
          assert:
            - "both Enrollment.${ea} and .${eb}: academic_status == WITHDRAWN, withdrawal_reason == SCHOOL_CANCELLED   # L1"
            - "RefundRequest.${rra}.granted_refund_cents == 51500 and RefundRequest.${rrb}.granted_refund_cents == 51500   # L2, 100% branch auto-created PENDING"
            - "CourseOffering.${off}: status == CANCELLED, enrolled_count == 0, seats_available == 2                  # L3 recompute"
            - "after approve+pay: RefundRequest.${rra}.status == PAID; Enrollment.${ea}.payment_status == REFUNDED (granted == paid), retained_cents == 0"

      - name: approval_expiry_grant_suspend_resume_cascade
        grounds:
          - state_machines.CourseApproval.EXPIRING_to_EXPIRED
          - state_machines.EquivalencyGrant.ACTIVE_to_SUSPENDED
          - state_machines.EquivalencyGrant.SUSPENDED_to_ACTIVE
          - concurrency_rules[grant-create-stale-course]
        distinguishing_aspect: |
          Depth-2 chain triggered by the regulatory sweep (system actor): CourseApproval
          EXPIRING -> EXPIRED (1) forces the equivalency grant ACTIVE -> SUSPENDED (2); the
          reverse cascade fires on renewal approval (grant SUSPENDED -> ACTIVE). Distinct
          trigger (sweep) from the invalidate and cancel cascades.
        test_recipe:
          setup:
            - "LICENSED school; course with CourseApproval TX APPROVED valid_until 2026-09-30; ACTIVE EquivalencyGrant TX -> NM (created with OCC version from course activation)"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2026-09-30" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector, captures: { cv: $.data.version } }
            - { call: "POST /equivalency-grants", payload: { course_id: "${crs}", home_state_code: "TX", recognized_state_code: "NM", expected_course_version: "${cv}" }, as: ComplianceOfficer, captures: { gr: $.data.id, gst0: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /_admin/run-regulatory-sweep", as: ComplianceOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /_admin/run-regulatory-sweep", as: ComplianceOfficer, captures: { n_susp: $.data.grants_suspended } }
            - { call: "GET /equivalency-grants/${gr}", as: ComplianceOfficer, captures: { gst1: $.data.status } }
            - { call: "POST /approvals/${cap}/renew", as: ComplianceOfficer }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-10-01", valid_until: "2027-09-30" }, as: StateCommission, captures: { arnd: $.data.application_round } }
            - { call: "GET /equivalency-grants/${gr}", as: ComplianceOfficer, captures: { gst2: $.data.status } }
          assert:
            - "grant created ACTIVE (gst0 == ACTIVE)"
            - "after 2026-10-01 sweep: CourseApproval.${cap} EXPIRED and EquivalencyGrant.${gr} SUSPENDED; sweep grants_suspended == 1   # forward cascade"
            - "late renewal allowed (2026-10-01 <= valid_until + 30d): renewal approval -> application_round == 2"
            - "after renewal approval: EquivalencyGrant.${gr}.status == ACTIVE                                            # reverse cascade auto-resume"

  # ---------------------------------------------------------------- rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: enroll_suspended_school_beats_offering_full
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_SCHOOL_NOT_LICENSED]
          - errors[ERR_OFFERING_FULL]
        distinguishing_aspect: |
          Error-category pair state (priority 6) x business_constraint (priority 10): the
          enrollment violates BOTH (school SUSPENDED; offering seats_available == 0) and the
          state error ERR_SCHOOL_NOT_LICENSED must win over ERR_OFFERING_FULL.
        test_recipe:
          setup:
            - "LICENSED school; PUBLISHED offering capacity 1 already filled by student A; school then SUSPENDED by the commission"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 1, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu A", email: "sa@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sa: $.data.id } }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu B", email: "sb@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sb: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sa}" }, as: Registrar }
            - { call: "POST /schools/${sch}/suspend", as: StateCommission }
          trigger:
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sb}" }, as: Registrar, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SCHOOL_NOT_LICENSED (http 409)   # state priority 6 wins"
            - "error_id != ERR_OFFERING_FULL                    # constraint priority 10 loses despite seats_available == 0"
            - "offering enrolled_count remains 1"

      - name: seat_time_state_beats_proctor_sod
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_SEAT_TIME_NOT_MET]
          - errors[ERR_PROCTOR_IS_INSTRUCTOR]
        distinguishing_aspect: |
          Error-category pair state (priority 6) x business_safety (priority 7): the attempt
          creation violates BOTH (enrollment only IN_PROGRESS; proctor equals the offering's
          instructor — segregation-of-duties violation) and ERR_SEAT_TIME_NOT_MET must win
          over ERR_PROCTOR_IS_INSTRUCTOR.
        test_recipe:
          setup:
            - "LICENSED school; course required 3000; PUBLISHED offering; enrollment with only 60 VERIFIED minutes (IN_PROGRESS, seat time not met); proctor id set to the offering's own instructor"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
