          Numeric threshold boundary on the verification endpoint: a client whose
          whole-year age at approval is exactly 18 (DOB 2008-06-01, approval
          2026-06-01) PASSES the >= 18 gate (verified_age_years == 18); one day
          younger would fail. Metric = age; endpoint = id-verification/approve.
