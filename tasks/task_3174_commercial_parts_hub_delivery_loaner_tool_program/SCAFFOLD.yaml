    output: PartOrder
    side_effects:
      - "parts_subtotal_cents, tier_discount_cents, core_charge_total_cents, refundable_deposit_cents, delivery_fee_cents and satisfaction_cents recomputed"
      - "fulfillment_route and promised_at re-derived"

  - method: POST
    path: "/commercial/part-orders/{orderId}/confirm"
