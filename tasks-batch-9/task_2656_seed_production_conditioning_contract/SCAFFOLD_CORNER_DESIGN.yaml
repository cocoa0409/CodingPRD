  # ===========================================================================
  - section: endpoints
    instances:
      - name: eligibility_assessment_computed_read_returns_both_variants
        claim_type: computed_read
        grounds:
          - endpoints.POST /seed-ops/production-fields/{production_field_id}/eligibility-assessments
          - calculations.field_eligibility_assessment
        distinguishing_aspect: "The assessment endpoint reports both variants and every component for the same field: two restricted records decay to 25.00 + 50.00 == 75.00, a 50.0 m isolation shortfall adds 25.00, and the 100.00 total puts DECAY_WEIGHTED as well as STRICT_HISTORY at INELIGIBLE without mutating anything."
        test_recipe:
          setup:
            - "Field F-South-4 has isolation_distance_m 150.0 against the variety's 200.0 m minimum"
            - "It carries WHEAT 2024 and WHEAT 2025 history records, both restricted and both inside the 3-year look-back for season 2026"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/growers"
              payload: { grower_name: "Prairie Ridge Farms", region_code: "ND-07", contact_email: "ops@prairieridge.example" }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /seed-ops/production-fields"
              payload: { grower_id: "${g_id}", field_code: "F-South-4", acres: 320.0, isolation_distance_m: 150.0 }
              as: ProgramAdmin
              captures: { f_id: $.data.id }
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "WHEAT", crop_year: 2024 }
              as: FieldOfficer
            - call: "POST /seed-ops/production-fields/${f_id}/history"
              payload: { crop_kind: "WHEAT", crop_year: 2025 }
              as: FieldOfficer
          trigger:
            - call: "POST /seed-ops/production-fields/${f_id}/eligibility-assessments"
              payload: { variety_id: "${v_id}", season_year: 2026, seed_class: "COMMERCIAL_INCREASE" }
              as: FieldOfficer
          assert:
            - "Returns 200 with restricted_record_count == 2 and isolation_shortfall_m == 50.0"
            - "history_component == 75.00 (25.00 for the 2024 record plus 50.00 for the 2025 record) and isolation_component == 25.00"
            - "contamination_risk_score == 100.00, above DECAY_ELIGIBILITY_MAX_SCORE 25.00"
            - "strict_history_result == INELIGIBLE and decay_weighted_result == INELIGIBLE"
            - "applied_variant == DECAY_WEIGHTED (seed_class COMMERCIAL_INCREASE) and applied_result == INELIGIBLE and blocking_error_id == ERR_FIELD_HISTORY_RESTRICTED"
            - "GET /seed-ops/production-fields/${f_id} shows version unchanged at 1 - the assessment is a pure read"

      - name: cleanout_certification_links_equipment_to_variety
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST /seed-ops/harvest-equipment/{harvest_equipment_id}/cleanout-certification
          - entities.HarvestEquipment.fields.last_cleanout_variety_id
        distinguishing_aspect: "Both sides of the link must exist: an unknown variety_id returns 404 ERR_VARIETY_NOT_FOUND, while the valid pairing stamps cleanout_certified, last_cleanout_variety_id and last_cleanout_at on the equipment."
        test_recipe:
          setup:
            - "One variety and one COMBINE CMB-7 exist; logical clock at 2026-09-14T00:00:00Z"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /seed-ops/harvest-equipment"
              payload: { equipment_code: "CMB-7", equipment_kind: "COMBINE", cleanout_minutes_required: 45 }
              as: ConditioningManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /seed-ops/harvest-equipment/${eq_id}/cleanout-certification"
              payload: { variety_id: "00000000-0000-0000-0000-000000000000", cleaned_at: "2026-09-09T18:00:00Z" }
              as: ConditioningManager
            - call: "POST /seed-ops/harvest-equipment/${eq_id}/cleanout-certification"
              payload: { variety_id: "${v_id}", cleaned_at: "2026-09-09T18:00:00Z" }
              as: ConditioningManager
          assert:
            - "First call returns 404 with data.error_id == ERR_VARIETY_NOT_FOUND and HarvestEquipment.${eq_id}.cleanout_certified == false"
            - "Second call returns 200 with HarvestEquipment.${eq_id}.cleanout_certified == true and last_cleanout_variety_id == ${v_id}"
            - "HarvestEquipment.${eq_id}.last_cleanout_at == 2026-09-09T18:00:00Z and status == AVAILABLE"
            - "GET /seed-ops/harvest-equipment?last_cleanout_variety_id=${v_id} returns total_count 1"

      - name: bagging_conditional_on_variety_treatment_requirement
        claim_type: conditional_action
        grounds:
          - validations.priority_30_ERR_STAGE_OUT_OF_ORDER
          - entities.Variety.fields.treatment_required
          - validations.priority_21_ERR_TREATMENT_LABEL_INCOMPLETE
        distinguishing_aspect: "For a variety with treatment_required true the SIZED lot may not jump to BAGGING - that returns 409 ERR_STAGE_OUT_OF_ORDER - and the TREATING run is accepted only with a label carrying the EPA registration number and the DYED statement."
        test_recipe:
