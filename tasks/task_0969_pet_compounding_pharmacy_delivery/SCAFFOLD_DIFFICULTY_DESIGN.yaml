  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocate_requires_prescription_verified
        grounds:
          - state_machines.CompoundOrder.CREATED_to_ALLOCATED
          - validations[priority=8]
          - errors[ERR_PRESCRIPTION_NOT_VERIFIED]
        distinguishing_aspect: |
          Entity pair CompoundOrder -> Prescription: order creation/allocation is gated
          on the Prescription being VERIFIED; while the prescription sits in
          VET_VERIFICATION_PENDING the create is rejected, and only the vet-confirm
          transition on the OTHER entity unlocks the full order lifecycle.
        test_recipe:
          setup:
            - "Prescription submitted and awaiting vet verification; lot and bench ready"
          setup_api_calls:
            - { call: "POST /owners", payload: { full_name: "Owen X1", email: "x1@x.com", phone: "555-61", ship_to_address: "13 Main St" }, as: PharmacyAdmin, captures: { own: $.data.id } }
