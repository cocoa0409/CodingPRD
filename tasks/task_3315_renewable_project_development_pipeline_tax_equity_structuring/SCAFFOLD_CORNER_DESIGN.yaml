            - call: "POST /api/projects/${p}/supply-agreements"
              payload: { equipment_type: "MODULE", supplier_name: "FirstSolar", total_contract_usd: 12000000 }
              as: ProcurementLead
              captures: { sa: $.data.id }
            - call: "POST /api/supply-agreements/${sa}/transitions"
              payload: { to: "EXECUTED" }
              as: ProcurementLead
            - call: "POST /api/supply-agreements/${sa}/procurement-orders"
              payload: { order_amount_usd: 10000000, safe_harbor_method: "FIVE_PERCENT_COST", eligible_cost_basis_usd: 10000000 }
              as: ProcurementLead
              captures: { po: $.data.id }
            - call: "POST /api/procurement-orders/${po}/transitions"
