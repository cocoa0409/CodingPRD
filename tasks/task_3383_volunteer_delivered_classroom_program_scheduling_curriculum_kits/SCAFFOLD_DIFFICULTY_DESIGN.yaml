          Mode (a) formula with >=3 inputs and non-linear interaction: the tier is selected by an
          ordered cascade of AND/OR gates over hours, funding_received_cents, and tier precedence.
          With 10.0 delivered hours and zero funding the AND gate (hours>=10 AND funding>=500000)
          fails and the funding-only path (>=2000000) fails, so tier stays NONE; recording 500000
          of funding flips the SAME hours to BRONZE — and the ordered selection yields BRONZE, not
          GOLD, because GOLD's AND gate needs funding >= 2000000.
