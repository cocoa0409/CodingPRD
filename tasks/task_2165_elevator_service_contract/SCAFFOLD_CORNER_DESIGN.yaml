        distinguishing_aspect: "Two callbacks whose outage intervals overlap ([09:00,15:00) and [13:00,17:00)) merge to a single 480-minute interval, giving uptime_pct_inclusive 98.92; naively summing 360 + 240 = 600 minutes would give 98.66."
