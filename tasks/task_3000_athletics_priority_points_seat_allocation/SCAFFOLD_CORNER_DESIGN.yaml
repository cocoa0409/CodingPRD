          The computed read's validity depends entirely on ANOTHER field's state —
          the parent recalculation's status — rather than on anything in the
          request. A COMMUNICATED cycle with fully computed donor points must
          still be refused with 409 ERR_RECALCULATION_NOT_CERTIFIED, and the
          identical call must succeed the moment certification lands, proving the
          gate is the status and not the availability of the numbers. The pass
