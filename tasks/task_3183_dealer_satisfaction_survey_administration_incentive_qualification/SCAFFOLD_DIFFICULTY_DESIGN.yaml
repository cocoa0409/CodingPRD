  - rule_id: compensating_invariant
    instances:
      - name: wave_invitation_partition_invariant_under_respond
        grounds:
          - entities.SurveyWave.fields.invitations_total
          - entities.SurveyWave.fields.sent_count
          - entities.SurveyWave.fields.responded_count
          - state_machines.SurveyInvitation.SENT_to_RESPONDED
        distinguishing_aspect: |
          Conserved quantity: wave invitation partition. The forward action
          (respond) and its reverse conceptual compensation (wave counters
          must remain a partition of invitations_total) — invariant:
          invitations_total == queued + sent + responded + expired +
          opted_out + suppressed at every observable step. Tested across a
          respond transition on SENT -> RESPONDED.
