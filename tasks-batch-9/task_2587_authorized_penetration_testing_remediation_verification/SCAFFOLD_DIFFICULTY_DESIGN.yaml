          setup:
            - "Asset C: NETWORK, criticality_tier 2, compliance_regimes [SOC2], exposure_score 55, last_tested_at 2026-01-05T00:00:00Z -> COOLDOWN_HOURS 24 and priority_score 62.25, above the admission threshold of 60."
