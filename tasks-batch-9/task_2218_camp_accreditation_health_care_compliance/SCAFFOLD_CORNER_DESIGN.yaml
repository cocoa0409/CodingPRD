            - call: "POST /accreditation/camps"
              payload: { name: "Scope Camp B", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "RN_ONSITE" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_b_id: "$.data.id" }
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-SCP", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
