    code: 200
    input: []
    output: ReportCard
    side_effects: []
  - method: POST
    path: "/report-cards/{id}/finalize"
    description: "Finalize a report card (OCC-guarded, freezes grades)"
    roles: [Teacher]
    code: 200
    input: [expected_report_card_version]
    output: ReportCard
    side_effects: ["status -> FINALIZED", "line_items/overall_gpa/credits_earned frozen", "increments ReportCard.version by 1"]
  - method: POST
    path: "/report-cards/{id}/reopen"
    description: "Reopen a finalized report card"
    roles: [Administrator]
    code: 200
    input: []
