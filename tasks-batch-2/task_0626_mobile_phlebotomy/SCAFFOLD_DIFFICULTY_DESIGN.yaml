  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: qns_redraw_cascade_depth4
        grounds:
          - state_machines.Specimen.MANIFESTED_to_QNS_REJECTED
          - state_machines.LabOrder.DRAW_COMPLETED_to_REDRAW_REQUIRED
          - entities.RouteDay.fields.booked_stop_count
          - entities.Phlebotomist.fields.redraw_strike_count
        distinguishing_aspect: |
          Depth-4 cascade triggered by QNS rejection: specimen→QNS_REJECTED (A) causes LabOrder→REDRAW_REQUIRED
          (B); B causes Appointment→CANCELLED (C); C causes RouteDay.booked_stop_count -=1 (D); and B also drives
          Phlebotomist.redraw_strike_count +=1. Each hop is caused by the previous hop, not directly by the QNS call.
        test_recipe:
          setup:
            - "DRAW_COMPLETED order on route day rd (booked_stop_count==1), 1 MANIFESTED specimen on IN_TRANSIT manifest, phlebotomist strike_count==0"
