  - section: consistency_model
    instances:
      - name: cascade_is_visible_immediately_in_the_same_request_cycle
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.LocalizationOrder.MIXING_to_QC
          - state_machines.MixJob.MIXED_to_CONFORMED
        distinguishing_aspect: |
          Consistency is immediate, not eventual: the conform response itself already reports MixJob CONFORMED and an immediately following read of the order reports QC with a version bumped by exactly one, with no retry or delay anywhere.
        test_recipe:
          setup:
          - "An order in MIXING whose MixJob is MIXED with conformance_index 0.8400"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
