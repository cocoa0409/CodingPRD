              as: DistrictManager
          assert:
            - "at 2026-07-08T23:59:59Z MinePlan.${plan_v}.status == APPROVED"
            - "at 2026-07-09T00:00:00Z MinePlan.${plan_v}.status == REVISION_DUE (due instant is inclusive)"
            - "MinePlan.${plan_v}.next_revision_due_at == 2026-07-09T00:00:00Z (approved_at + 180 days)"

