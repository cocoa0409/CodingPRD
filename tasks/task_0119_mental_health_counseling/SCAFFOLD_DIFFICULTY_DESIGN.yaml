scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: patient_responsibility_contract_mode_variants
        grounds:
          - calculations.patient_responsibility
          - entities.InsurancePlan.fields.contract_mode
          - entities.BillingClaim.fields.patient_responsibility_cents
        distinguishing_aspect: |
          Two BillingClaims with IDENTICAL allowed_amount=9550c, copay=2500c, and
          Patient.deductible_remaining_cents=20000c produce DIFFERENT patient_responsibility_cents
          depending on the InsurancePlan.contract_mode field: DEDUCTIBLE_FIRST yields
          patient_responsibility_cents=9550 / insurer_paid_cents=0, while COPAY_ONLY yields
          patient_responsibility_cents=2500 / insurer_paid_cents=7050. The dual variant lives
          on the BillingClaim entity, distinct from the Therapist-supervision dual variant below.
        test_recipe:
          setup:
            - "PracticeAdmin creates Therapist T (LICENSED, rack_90834=15000c), ACTIVE NY license, ACTIVE credential."
            - "PracticeAdmin creates Plan A (IN_NETWORK, contract_mode=DEDUCTIBLE_FIRST, allowed_90834=9550, copay=2500) and Plan B (IN_NETWORK, contract_mode=COPAY_ONLY, allowed_90834=9550, copay=2500)."
            - "PracticeAdmin creates Patient PA on Plan A and Patient PB on Plan B, both with deductible_remaining_cents=20000 (PATCH-set)."
          trigger:
            - "Schedule, check-in, create-session, and complete a 90834 appointment for PA → BillingClaim CA created."
            - "Schedule, check-in, create-session, and complete a 90834 appointment for PB → BillingClaim CB created."
          assert:
            - "BillingClaim CA.patient_responsibility_cents == 9550 AND CA.insurer_paid_cents == 0."
            - "BillingClaim CB.patient_responsibility_cents == 2500 AND CB.insurer_paid_cents == 7050."
            - "CA.charged_amount_cents == CB.charged_amount_cents == 9550 (identical inputs, different outputs)."

      - name: supervision_hours_accrual_forward_vs_reverse
        grounds:
          - calculations.supervision_hours_accrual
          - state_machines.Session.IN_PROGRESS_to_COMPLETED
          - state_machines.BillingClaim.POSTED_to_VOIDED
          - entities.Therapist.fields.supervision_hours_accrued
          - entities.Therapist.fields.licensure_exam_eligible
        distinguishing_aspect: |
          The supervision_hours_accrual calculation runs forward on Session COMPLETED
          (+1.00 for INDIVIDUAL, +1.50 for INTAKE) and reverse on BillingClaim VOIDED
          (-1.00 or -1.50). For identical session inputs, the resulting
          Therapist.supervision_hours_accrued differs by 0.00 (post then void) vs +1.00
          (post and keep). This dual-variant lives on the Therapist entity domain —
          distinct from the BillingClaim domain of the variant above.
        test_recipe:
          setup:
            - "Create PRE_LICENSED Therapist T2 with rack_90834=10000c, ACTIVE NY license, ACTIVE SupervisionAssignment, credential_status=PROVISIONAL (pre-licensed associates run sessions while PROVISIONAL); T2.supervision_hours_accrued starts at 0.00."
            - "Create self-pay Patient P (no insurance, household_size=2, income=3066000c → tier=40%)."
            - "Schedule, check-in, create-session, complete a 90834 appointment → Session S1 COMPLETED, BillingClaim C1 POSTED."
          trigger:
            - "Read Therapist T2 → record hours_after_complete."
            - "POST /practice/claims/{C1.id}/void (within 7-day window)."
            - "Read Therapist T2 → record hours_after_void."
          assert:
            - "hours_after_complete == 1.00 (forward variant applied)."
            - "hours_after_void == 0.00 (reverse variant restored the credit)."
            - "Therapist.licensure_exam_eligible == false at both reads (below 3000.00 threshold)."

  # =========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, DIFFERENT modes among a/b/c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: patient_responsibility_three_input_branching
        grounds:
          - calculations.patient_responsibility
          - entities.InsurancePlan.fields.contract_mode
          - entities.InsurancePlan.fields.copay_cents
          - entities.Patient.fields.deductible_remaining_cents
        distinguishing_aspect: |
          Mode (a) — non-linear interaction across ≥3 inputs: the result depends on
          (contract_mode, deductible_remaining_cents, allowed_amount, copay) interacting
          via min(allowed, deductible_remaining) AND a conditional branch on whether
          deductible is met. The cell {DEDUCTIBLE_FIRST, deductible_remaining > 0} chooses
          min(allowed, remaining); {DEDUCTIBLE_FIRST, deductible_remaining == 0} chooses copay;
          {COPAY_ONLY, *} chooses copay regardless. Three inputs, three discrete branches.
        test_recipe:
          setup:
            - "Create PracticeAdmin-owned LICENSED Therapist T3 with ACTIVE NY license, rack_90834=15000c."
            - "Create Plan DF (DEDUCTIBLE_FIRST, allowed_90834=9550, copay=2500)."
            - "Create Patient P_partial on Plan DF with deductible_remaining_cents=4000."
          trigger:
            - "Schedule, check-in, create-session, complete a 90834 appointment for P_partial → BillingClaim C_partial."
          assert:
            - "C_partial.charged_amount_cents == 9550."
            - "C_partial.patient_responsibility_cents == 4000 (min(9550, 4000))."
            - "C_partial.insurer_paid_cents == 5550 (9550 - 4000)."
            - "Post-completion Patient.deductible_remaining_cents == 0 (decremented by min(9550,4000)=4000)."

      - name: crisis_score_per_factor_round_then_sum
        grounds:
          - calculations.crisis_composite_score
          - calculations.crisis_risk_bucket
          - entities.CrisisAssessment.fields.composite_score
          - entities.CrisisAssessment.fields.risk_level
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold PINS
          per-factor round-half-up THEN sum (NOT sum then round). For inputs
          (si=3, pa=1, su=2, so=2, am=1), per-then-sum yields composite_score=23.56
          while sum-then-round yields 23.54. The pinned order causes risk_level=HIGH
          (>= 23.55), whereas the wrong order would yield risk_level=MODERATE.
          This is structurally different from instance (a), which is non-linear-interaction.
        test_recipe:
          setup:
            - "Create LICENSED Therapist T_assessor with ACTIVE NY license and ACTIVE credential."
            - "Create Patient P_crisis (any insurance/self-pay)."
            - "Therapist T_assessor previously held a CHECKED_IN appointment with P_crisis within the last 90 days."
          trigger:
            - "POST /practice/patients/{P_crisis.id}/crisis-assessments with si=3, pa=1, su=2, so=2, am=1."
          assert:
            - "CrisisAssessment.composite_score == 23.56 (per-then-sum exact)."
            - "CrisisAssessment.risk_level == 'HIGH' (23.56 >= 23.55)."
            - "Patient.latest_crisis_level == 'HIGH'."
            - "Patient.safety_plan_required == true (no active SafetyPlan present)."

  # =========================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances on DIFFERENT entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: therapist_credential_cycle
        grounds:
          - state_machines.Therapist.PROVISIONAL_to_ACTIVE
          - state_machines.Therapist.ACTIVE_to_SUSPENDED
          - state_machines.Therapist.SUSPENDED_to_ACTIVE
          - state_machines.Therapist.SUSPENDED_to_DEACTIVATED
        distinguishing_aspect: |
          The Therapist machine contains a cycle ACTIVE→SUSPENDED→ACTIVE (reinstate),
          plus branching ACTIVE→DEACTIVATED and SUSPENDED→DEACTIVATED (terminal). This is
          a cycle on the Therapist entity, structurally distinct from the Appointment
          fork-join in the second instance.
        test_recipe:
          setup:
            - "Create LICENSED Therapist Tcyc with ACTIVE NY license; activate to credential_status=ACTIVE."
            - "Schedule one future 90834 appointment Afut for Tcyc with a self-pay Patient."
          trigger:
            - "POST /practice/therapists/{Tcyc.id}/suspend."
            - "POST /practice/therapists/{Tcyc.id}/reinstate."
          assert:
            - "After suspend: Therapist.credential_status == 'SUSPENDED' AND Afut.status == 'HELD' AND Afut.hold_reason == 'LICENSE_GAP'."
            - "After reinstate: Therapist.credential_status == 'ACTIVE' AND Afut.status == 'SCHEDULED' AND Afut.hold_reason is null."

      - name: appointment_fork_join_to_held
        grounds:
          - state_machines.Appointment.SCHEDULED_to_HELD
          - state_machines.Appointment.HELD_to_SCHEDULED
          - state_machines.Appointment.HELD_to_CANCELLED
          - entities.Appointment.fields.hold_reason
        distinguishing_aspect: |
          Appointment has branching with revert: SCHEDULED→HELD can be triggered from
          multiple distinct upstream causes (Therapist.suspend, StateLicense expiry/revoke,
          OR CrisisAssessment HIGH with no active SafetyPlan), and HELD→SCHEDULED can be
          driven by ANY of three distinct clearing events. Plus HELD→CANCELLED is a
          divergent branch with a different side-effect set than HELD→SCHEDULED. This is
          fork-join branching on the Appointment entity — distinct from the Therapist cycle.
        test_recipe:
          setup:
            - "Create LICENSED Therapist Tfj (ACTIVE NY license, ACTIVE credential). Create Patient Pfj (any plan). Schedule future Appt Afj."
            - "Therapist Tassess previously held a CHECKED_IN appointment with Pfj within the last 90 days."
          trigger:
            - "POST /practice/patients/{Pfj.id}/crisis-assessments si=3 pa=1 su=2 so=2 am=1 (HIGH)."
            - "Read Afj.status and Afj.hold_reason."
            - "POST /practice/patients/{Pfj.id}/safety-plans referencing the HIGH assessment with all required fields."
            - "Read Afj.status and Afj.hold_reason again."
          assert:
            - "After HIGH assessment: Afj.status == 'HELD' AND Afj.hold_reason == 'SAFETY_PLAN_MISSING'."
            - "After safety-plan creation: Afj.status == 'SCHEDULED' AND Afj.hold_reason is null (revert branch)."

  # =========================================================================
  # Rule 4 — transitive_cascade (≥2 instances, different triggers, depth ≥3 and ≥2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: session_complete_depth3_chain
        grounds:
          - state_machines.Session.IN_PROGRESS_to_COMPLETED
          - calculations.patient_responsibility
          - calculations.supervision_hours_accrual
          - entities.Patient.fields.deductible_remaining_cents
          - entities.Therapist.fields.supervision_hours_accrued
          - entities.Therapist.fields.licensure_exam_eligible
        distinguishing_aspect: |
          Depth-3 chain originating from POST /practice/sessions/{id}/complete:
          (1) Session COMPLETED → (2) BillingClaim auto-POSTED with computed amounts →
          (3) Patient.deductible_remaining_cents decremented (depends on the posted
          claim's charged_amount, NOT directly on the session itself). Parallel chain
          on the same trigger: (1) Session COMPLETED → (2) Therapist.supervision_hours_accrued
          updated → (3) Therapist.licensure_exam_eligible recomputed. Each link is
          caused by the previous link, not by /complete directly.
        test_recipe:
          setup:
            - "Create PRE_LICENSED Therapist Tch with rack_90834=10000c, ACTIVE NY license, ACTIVE SupervisionAssignment, credential_status=PROVISIONAL (pre-licensed associates may run sessions while PROVISIONAL); supervision_hours_accrued starts at 0.00."
            - "Create Plan Pl (IN_NETWORK, DEDUCTIBLE_FIRST, allowed_90834=8000, copay=2000). Patient Pch on Pl with deductible_remaining_cents=10000 (set via PATCH /practice/patients/{id})."
          trigger:
            - "Schedule, check-in, create-session, complete one 90834 appointment for Pch."
          assert:
            - "Hop 2 — BillingClaim auto-created: status=='POSTED', charged_amount_cents==8000, patient_responsibility_cents==8000, insurer_paid_cents==0."
            - "Hop 3a — Patient.deductible_remaining_cents == 2000 (10000 - min(8000,10000))."
            - "Hop 3b — Therapist.supervision_hours_accrued == 1.00 (0.00 + 1.00 for one INDIVIDUAL) AND Therapist.licensure_exam_eligible == false (1.00 < 3000.00; eligibility unchanged)."

      - name: license_expiry_depth2_clock_cascade
        grounds:
          - state_machines.StateLicense.ACTIVE_to_EXPIRED
          - state_machines.Appointment.SCHEDULED_to_HELD
          - entities.Appointment.fields.hold_reason
        distinguishing_aspect: |
          Depth-2 chain originating from POST /practice/_clock/advance (different trigger
          than the session-complete chain): (1) system clock crosses StateLicense.expires_on
          → StateLicense ACTIVE→EXPIRED → (2) because the therapist now lacks license
          coverage for the appointment's patient_state_on_day, the future Appointment
          SCHEDULED→HELD with hold_reason=LICENSE_GAP. The second hop is caused by the
          EXPIRY event, not directly by /clock/advance.
        test_recipe:
          setup:
            - "Create LICENSED Therapist Tex with EXACTLY ONE ACTIVE NY license expiring at 2026-06-01T00:00:00Z; credential ACTIVE."
            - "Patient Pex (any plan, residence=NY). Schedule future 90834 Appt Aex at 2026-06-02T10:00 patient_state_on_day=NY → status=SCHEDULED."
          trigger:
            - "POST /practice/_clock/advance to '2026-06-01T00:00:00Z'."
          assert:
            - "Hop 1 — StateLicense.status == 'EXPIRED'."
            - "Hop 2 — Aex.status == 'HELD' AND Aex.hold_reason == 'LICENSE_GAP'."

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: safety_vs_referential_license_conflict
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors.ERR_SAFETY_PLAN_REQUIRED
          - errors.ERR_LICENSE_GAP_FOR_STATE
        distinguishing_aspect: |
          Pair (business_safety vs business_referential): a check-in for an
          Appointment whose status remained SCHEDULED has TWO simultaneous failures:
          (a) the patient.safety_plan_required is true, AND (b) the therapist
          holds no ACTIVE license for patient_state_on_day. The scaffold pins
          ERR_SAFETY_PLAN_REQUIRED (priority 8, safety) winning over
          ERR_LICENSE_GAP_FOR_STATE (priority 12, referential). The wrong ordering
          would return the license-gap error.
        test_recipe:
          setup:
            - "LICENSED Therapist Tsp with ACTIVE CA license only (no NY license), psypact_enrolled=false, ACTIVE credential."
            - "Patient Psp on any plan. Tsp previously had a CHECKED_IN appt with Psp within 90 days (to authorize Tsp to perform crisis assessment)."
            - "POST a HIGH crisis assessment for Psp (si=3 pa=1 su=2 so=2 am=1) → patient.safety_plan_required=true. (No future appointments exist at this moment, so the cascade has nothing to HOLD.)"
            - "AFTER the assessment, schedule a 90834 telehealth Appt Asp for Tsp/Psp with patient_state_on_day=NY at some future time (status starts SCHEDULED — but the precondition allows scheduling even if it will fail at check-in; appointment creation does not check safety_plan_required nor cross-state license)."
            - "Advance clock into Asp's check-in window."
          trigger:
            - "Tsp POSTs /practice/appointments/{Asp.id}/check-in."
          assert:
            - "Response status 409 with error_id == 'ERR_SAFETY_PLAN_REQUIRED' (priority 8 wins over priority 12)."

      - name: state_vs_referential_session_complete_conflict
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors.ERR_SESSION_NOT_OPEN
          - errors.ERR_THERAPIST_NOT_ACTIVE
        distinguishing_aspect: |
          Pair (state vs business_referential): A POST /practice/sessions/{id}/complete
          where BOTH (a) the owning Appointment.status != CHECKED_IN AND (b) the
          Therapist.credential_status is SUSPENDED. The scaffold pins
          ERR_SESSION_NOT_OPEN (priority 6, state) winning over ERR_THERAPIST_NOT_ACTIVE
          (priority 11, referential). Different error-category pair than the
          safety/referential conflict above.
        test_recipe:
          setup:
            - "LICENSED Therapist Tcc with ACTIVE NY license, ACTIVE credential."
            - "Patient Pcc; schedule, check-in 90834 Appt; create Session Scc IN_PROGRESS."
            - "PracticeAdmin POSTs /practice/sessions/{Scc.id}/void → Session.status=VOIDED, Appointment.status=CANCELLED."
            - "PracticeAdmin POSTs /practice/therapists/{Tcc.id}/suspend → credential_status=SUSPENDED."
          trigger:
            - "Tcc POSTs /practice/sessions/{Scc.id}/complete."
          assert:
            - "Response status 409 with error_id == 'ERR_SESSION_NOT_OPEN' (priority 6 fires; priority 11 NOT consulted)."

      - name: license_gap_vs_fiscal_amount_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=20]
          - errors.ERR_LICENSE_GAP_FOR_STATE
          - errors.ERR_INVALID_AMOUNT
        distinguishing_aspect: |
          Pair (business_referential vs business_fiscal): a PATCH attempt that BOTH
          sets pricing_rack_90834_cents=-100 (fiscal failure, priority 20) AND would
          implicitly invalidate license coverage is blocked first by ERR_INVALID_AMOUNT
          because the priority-20 fiscal-validation check runs after referential checks
          have passed on PATCH /therapists/{id}. Conversely, a check-in attempt with
          BOTH missing license coverage (priority 12) AND a downstream negative-amount
          implication on the related plan returns ERR_LICENSE_GAP_FOR_STATE because
          priority 12 fires first. This pair is distinct from the safety/temporal pair above.
        test_recipe:
          setup:
            - "LICENSED Therapist Tlg with ACTIVE CA license only (no NY license), psypact_enrolled=false, ACTIVE credential, rack_90834=12000c."
            - "Patient Plg (any plan). Schedule future 90834 telehealth Appt Alg with patient_state_on_day=NY → SCHEDULED."
            - "Advance clock to a moment inside the check-in window [start-15m, start+30m]."
          trigger:
            - "Tlg POSTs /practice/appointments/{Alg.id}/check-in."
          assert:
            - "Response.error_id == 'ERR_LICENSE_GAP_FOR_STATE' (priority 12 fires; priority 19 temporal and priority 20 fiscal NOT consulted)."

  # =========================================================================
  # Rule 6 — boundary_precision_check (≥2 instances, different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: void_window_seven_day_threshold_inclusive
        grounds:
          - validations[priority=23]
          - state_machines.BillingClaim.POSTED_to_VOIDED
          - errors.ERR_VOID_WINDOW_EXPIRED
        distinguishing_aspect: |
          Numeric threshold crossing on the elapsed-time-since-posting metric for
          claim void. The boundary is "Owning Session was COMPLETED within the last
          7 days" — exactly 7 days (168.0 hours) elapsed since posted_at is
          INCLUSIVE (still voidable); anything strictly past 7 days is REJECTED with
          ERR_VOID_WINDOW_EXPIRED. Reached through POST /practice/claims/{id}/void
          using the clock-advance endpoint to drive the boundary precisely. This is
          a temporal-numeric metric, structurally distinct from the empty-collection
          boundary below.
        test_recipe:
          setup:
            - "LICENSED Therapist Tvw with ACTIVE NY license, ACTIVE credential, rack_90834=10000c."
            - "Plan Pvw IN_NETWORK DEDUCTIBLE_FIRST allowed=9550 copay=2500. Patient Pat_vw on Pvw with deductible_remaining_cents=20000."
            - "POST /practice/_clock/advance to '2026-05-01T10:00:00Z'."
            - "Schedule, check-in, create-session, complete 90834 Appt at 2026-05-01T10:00:00Z → BillingClaim Cvw POSTED at this instant."
          trigger:
            - "Test A: POST /practice/_clock/advance to '2026-05-08T10:00:00Z' (exactly +7d, inclusive boundary). POST /practice/claims/{Cvw.id}/void."
            - "Test B: re-run from scratch; advance clock to '2026-05-08T10:00:01Z' (+7d+1s, just past). POST /practice/claims/{Cvw.id}/void."
          assert:
            - "Test A: 200 OK; BillingClaim.status == 'VOIDED' (the inclusive boundary admits the void)."
            - "Test B: 409 with error_id == 'ERR_VOID_WINDOW_EXPIRED' (strictly past the 7-day window)."

      - name: safety_plan_empty_contacts_zero_check
        grounds:
          - entities.SafetyPlan.fields.support_contacts
          - validations[priority=9]
          - errors.ERR_HIGH_ASSESSMENT_REQUIRED
        distinguishing_aspect: |
          Zero/empty-collection boundary on SafetyPlan.support_contacts (len >= 1).
          A SafetyPlan POST body with support_contacts=[] must be rejected, but
          support_contacts with exactly one entry must succeed. This is reached
          through POST /practice/patients/{pid}/safety-plans, structurally distinct
          from the numeric-threshold endpoint above.
        test_recipe:
          setup:
            - "LICENSED Therapist Tsf with ACTIVE NY license, ACTIVE credential."
            - "Patient Psf; Tsf previously had a CHECKED_IN appt with Psf within 90 days."
            - "POST a HIGH crisis assessment for Psf (si=3 pa=1 su=2 so=2 am=1) → CrisisAssessment Hsf."
          trigger:
            - "POST /practice/patients/{Psf.id}/safety-plans with trigger_assessment_id=Hsf.id, support_contacts=[] and all other required fields."
            - "Then POST again with support_contacts=[{name:'A', phone:'555-0001'}]."
          assert:
            - "First call → 400/422 with error_id == 'ERR_VALIDATION' (support_contacts len < 1 fails schema constraint)."
            - "Second call → 201 SafetyPlan ACTIVE."

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (≥2 instances, different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: appointment_checkin_depends_on_therapist_credential
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CHECKED_IN
          - state_machines.Therapist.ACTIVE_to_SUSPENDED
          - entities.Therapist.fields.credential_status
          - validations[priority=11]
          - errors.ERR_THERAPIST_NOT_ACTIVE
        distinguishing_aspect: |
          Appointment's SCHEDULED→CHECKED_IN transition is gated by the OTHER entity
          Therapist's credential_status (must be ACTIVE). Entity pair (Appointment ↔
          Therapist) — distinct from the (Session ↔ SupervisionAssignment) pair below.
        test_recipe:
          setup:
            - "LICENSED Therapist Tcd with ACTIVE NY license, ACTIVE credential."
            - "Patient Pcd; schedule SCHEDULED 90834 Appt Acd for Tcd/Pcd in NY."
            - "PracticeAdmin POSTs /practice/therapists/{Tcd.id}/suspend. (Suspend cascade HOLDs Acd → Acd.status='HELD', hold_reason='LICENSE_GAP'.)"
            - "Advance clock to be inside Acd's check-in window."
          trigger:
            - "Tcd POSTs /practice/appointments/{Acd.id}/check-in."
            - "PracticeAdmin POSTs /practice/therapists/{Tcd.id}/reinstate."
            - "Tcd POSTs /practice/appointments/{Acd.id}/check-in again."
          assert:
            - "First check-in: 409 with error_id == 'ERR_APPT_NOT_OPEN' (state check at priority 7 fires deterministically — Acd is HELD because of the cascade from Tcd's suspend; this asserts Appointment's transition depends on Therapist's credential_status across the entity pair)."
            - "After reinstate: Acd returns to SCHEDULED automatically (cascade)."
            - "Second check-in: 200 with Acd.status == 'CHECKED_IN' (after Tcd returns to ACTIVE, the dependency is satisfied)."

      - name: session_complete_depends_on_supervision_assignment
        grounds:
          - state_machines.Session.IN_PROGRESS_to_COMPLETED
          - state_machines.SupervisionAssignment.transitions[0]
          - entities.SupervisionAssignment.fields.status
          - validations[priority=13]
          - errors.ERR_NO_ACTIVE_SUPERVISOR
        distinguishing_aspect: |
          Session's IN_PROGRESS→COMPLETED transition for a PRE_LICENSED therapist
          depends on SupervisionAssignment.status=ACTIVE existing for that therapist
          at completion time. Entity pair (Session ↔ SupervisionAssignment) —
          distinct from the (Appointment ↔ Therapist) pair above.
        test_recipe:
          setup:
            - "PRE_LICENSED Therapist Tpl with ACTIVE NY license, credential_status=PROVISIONAL (pre-licensed associates may run sessions while PROVISIONAL provided supervision is active)."
            - "PracticeAdmin creates SupervisionAssignment SA for Tpl with status=ACTIVE."
            - "Patient Ppl (any plan). Schedule 90834 Appt in NY for Tpl/Ppl. Advance clock into check-in window. Tpl checks in. Tpl POSTs /practice/appointments/{Apl.id}/sessions → Session Spl IN_PROGRESS."
            - "POST /practice/supervision-assignments/{SA.id}/terminate → SA.status=TERMINATED."
          trigger:
            - "Tpl POSTs /practice/sessions/{Spl.id}/complete."
          assert:
            - "Response status 409 with error_id == 'ERR_NO_ACTIVE_SUPERVISOR' (priority 13 fires: PRE_LICENSED + no ACTIVE SupervisionAssignment)."
            - "Reverse case: PracticeAdmin creates a NEW ACTIVE SupervisionAssignment SA2 for Tpl. Schedule a second appointment, check in, create a new IN_PROGRESS session Spl2, then /complete → 200 with Session.status=='COMPLETED'."

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: therapist_double_booking_halfopen
        grounds:
          - validations[priority=17]
          - errors.ERR_THERAPIST_DOUBLE_BOOKED
          - entities.Appointment.fields.scheduled_start
          - entities.Appointment.fields.scheduled_end
        distinguishing_aspect: |
          Half-open interval semantics [start, end): for the SAME therapist resource,
          adjacency (A.scheduled_end == B.scheduled_start) is ALLOWED — back-to-back
          appointments at 09:00-10:00 and 10:00-11:00 both succeed. Only true overlap
          (any shared interior point) is rejected. Resource = Therapist.
        test_recipe:
          setup:
            - "LICENSED Therapist Tth with ACTIVE NY license, ACTIVE credential."
            - "Patients Pa and Pb (different patients to isolate the per-therapist rule)."
            - "POST appointment A1 for Tth/Pa, scheduled_start=2026-07-10T09:00Z, scheduled_end=2026-07-10T10:00Z → 201."
          trigger:
            - "POST appointment A2 for Tth/Pb at 2026-07-10T10:00Z–11:00Z (adjacency)."
            - "POST appointment A3 for Tth/Pb at 2026-07-10T09:30Z–10:30Z (overlap)."
          assert:
            - "A2 → 201 (adjacency allowed under half-open semantics)."
            - "A3 → 409 with error_id == 'ERR_THERAPIST_DOUBLE_BOOKED'."

      - name: patient_min_gap_closed_with_buffer
        grounds:
          - validations[priority=18]
          - errors.ERR_PATIENT_DOUBLE_BOOKED
          - entities.Appointment.fields.scheduled_start
          - entities.Appointment.fields.scheduled_end
        distinguishing_aspect: |
          Closed-interval semantics WITH MANDATORY 5-MINUTE GAP for the SAME patient
          resource (different resource entity than the therapist case): adjacency is
          REJECTED. 09:00-10:00 followed by 10:00-11:00 fails; 09:00-10:00 followed by
          10:05-11:00 (exactly 5 minutes gap) also fails (gap must be > 0... actually
          the rule says ">= 5min", so 10:05-11:00 succeeds while 10:04-11:00 fails).
          The interval arithmetic differs structurally from the therapist half-open rule.
        test_recipe:
          setup:
            - "Two LICENSED Therapists Ta and Tb (each with ACTIVE NY license, ACTIVE credential)."
            - "One Patient Ppat."
            - "POST appointment B1 for Ta/Ppat, 2026-07-11T09:00-10:00Z → 201."
          trigger:
            - "POST appointment B2 for Tb/Ppat at 10:00-11:00Z (adjacency)."
            - "POST appointment B3 for Tb/Ppat at 10:04-11:00Z (4-min gap)."
            - "POST appointment B4 for Tb/Ppat at 10:05-11:00Z (exactly 5-min gap)."
          assert:
            - "B2 → 409 ERR_PATIENT_DOUBLE_BOOKED (adjacency rejected)."
            - "B3 → 409 ERR_PATIENT_DOUBLE_BOOKED (gap < 5min)."
            - "B4 → 201 (gap >= 5min)."

  # =========================================================================
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deductible_round_trip_preservation
        grounds:
          - state_machines.Session.IN_PROGRESS_to_COMPLETED
          - state_machines.BillingClaim.POSTED_to_VOIDED
          - entities.Patient.fields.deductible_remaining_cents
          - calculations.patient_responsibility
        distinguishing_aspect: |
          Conserved quantity = Patient.deductible_remaining_cents. The forward action
          (Session COMPLETE → BillingClaim POSTED) decrements deductible_remaining_cents
          by min(charged_amount, deductible_remaining_at_post). The compensating action
          (BillingClaim VOID within window) MUST restore deductible_remaining_cents to
          its exact pre-post value. Pinned formula:
            deductible_remaining_after_void == deductible_remaining_before_complete.
          Distinct from the supervision-hours invariant below.
        test_recipe:
          setup:
            - "LICENSED Therapist Tdr (rack ignored; insurance path), ACTIVE NY license, ACTIVE credential."
            - "Plan Pdr (IN_NETWORK, DEDUCTIBLE_FIRST, allowed_90834=9550, copay=2500)."
            - "Patient Pat_dr on Pdr with deductible_remaining_cents=20000."
            - "Schedule, check-in, create-session 90834 Appt → Session Sdr IN_PROGRESS."
          trigger:
            - "POST /practice/sessions/{Sdr.id}/complete → BillingClaim Cdr POSTED; capture Patient.deductible_remaining_cents (= 10450)."
            - "POST /practice/claims/{Cdr.id}/void within 7-day window."
          assert:
            - "Immediately after complete: Patient.deductible_remaining_cents == 10450 (20000 - min(9550, 20000) = 10450)."
            - "Immediately after void: Patient.deductible_remaining_cents == 20000 (restored)."
            - "BillingClaim.status == 'VOIDED'; Session.status == 'VOIDED'; Appointment.status == 'CANCELLED'."

      - name: supervision_hours_round_trip_preservation
        grounds:
          - state_machines.Session.IN_PROGRESS_to_COMPLETED
          - state_machines.BillingClaim.POSTED_to_VOIDED
          - entities.Therapist.fields.supervision_hours_accrued
          - calculations.supervision_hours_accrual
        distinguishing_aspect: |
          Conserved quantity = Therapist.supervision_hours_accrued (a different
          conserved quantity than the deductible above — accrued hours vs cents
          remaining). The forward action increments by 1.00 (INDIVIDUAL) or 1.50
          (INTAKE); the compensating void must subtract the same delta. Pinned formula:
            supervision_hours_accrued_after_void == supervision_hours_accrued_before_complete.
        test_recipe:
          setup:
            - "PRE_LICENSED Therapist Tsh, rack_90834=10000c, ACTIVE NY license, ACTIVE SupervisionAssignment, credential_status=PROVISIONAL (pre-licensed associates may run sessions while PROVISIONAL), supervision_hours_accrued=0.00."
            - "Self-pay Patient Psh (household_size=2, income=3066000c → tier=40%)."
            - "Schedule, check-in, create-session 90834 Appt → Session Ssh IN_PROGRESS."
          trigger:
            - "POST /practice/sessions/{Ssh.id}/complete → Session Ssh COMPLETED, BillingClaim Csh POSTED."
            - "Read Therapist Tsh → capture supervision_hours_accrued_mid."
            - "POST /practice/claims/{Csh.id}/void."
            - "Read Therapist Tsh → capture supervision_hours_accrued_final."
          assert:
            - "supervision_hours_accrued_mid == 1.00 (delta for INDIVIDUAL)."
            - "supervision_hours_accrued_final == 0.00 (restored to baseline)."
            - "Therapist.licensure_exam_eligible == false at all times during the cycle."
