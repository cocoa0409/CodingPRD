# ============================================================================
# SCAFFOLD.yaml — Nuclear Refueling Outage Management
# Sections §1.0 – §1.7. Difficulty/corner design indices live in sibling files.
# ============================================================================

scenario: |
  Nuclear Refueling Outage Management (nuclear generating station): outage scope
  development with work orders, modifications and inspections prioritized against a
  duration target, fuel reload design with core loading pattern, fuel receipt and spent
  fuel pool capacity planning, supplemental workforce onboarding with access
  authorization, training and badging for thousands of temporary workers, schedule
  development with critical path activities and shutdown safety function protection,
  radiological work planning with dose estimates, shielding and
  as-low-as-reasonably-achievable reviews, contingency planning for emergent work
  discovered during inspections, startup testing sequence with regulatory hold points and
  reactivity management, post-outage review with duration, dose and cost performance
  analysis.

domain_name: nuclear-refueling-outage-management
api_prefix: ""          # flat top-level collections: /outages, /work-orders, /rwps, ...

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Peer top-level collections joined by foreign keys, plus a self-referential
  # ScheduleActivity predecessor chain (DAG) and cross-aggregate references
  # (RadiologicalWorkPermit -> WorkOrder + RadArea + Outage).

  state_machine_shape: compound
  # Outage.status auto-advances from the aggregate state of its StartupTest children,
  # and Outage.schedule_posture / Outage.alara_posture are derived aggregates that gate
  # child operations. WorkOrder adds a cycle (APPROVED -> PLANNED -> APPROVED),
  # SupplementalWorker adds a branching fork-join, ScheduleActivity adds two
  # independent parallel state dimensions, and RadiologicalWorkPermit adds a
  # posture-driven DRAFT <-> HELD_FOR_ALARA cycle.

  relationship_patterns:
    - one_to_many          # Outage -> WorkOrder / ScheduleActivity / StartupTest / ...
    - self_referential     # ScheduleActivity.predecessor_activity_id -> ScheduleActivity.id
    - cross_aggregate      # RadiologicalWorkPermit spans Outage, WorkOrder, RadArea
                           # PoolCellReservation spans Outage and SpentFuelPool

  role_model: segregation_of_duties
  # Two SoD gates: the ReactorEngineer who created a CoreLoadPattern may not approve it,
  # and the RegulatoryAffairs user who created a REGULATORY-hold-point StartupTest may
  # not be the one who satisfies it. Beyond SoD the roles are peer roles: each owns a
  # different resource type.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: Outage
    parent: null
    common_fields: true
    fields:
      - name: station_unit
        type: enum
        source: input
        description: "Generating unit the refueling outage belongs to"
        constraints: "one of {UNIT_1, UNIT_2}"
      - name: designation
        type: string
        source: input
        description: "Station outage designation such as 1R24"
        constraints: "1..32 chars; unique per station_unit"
      - name: duration_target_hours
        type: number
        source: input
        description: "Committed breaker-to-breaker duration target in hours"
        constraints: "> 0"
      - name: dose_budget_total_mrem
        type: number
        source: input
        description: "Total collective dose budget for the outage in mrem"
        constraints: "> 0"
      - name: cost_budget_usd
        type: number
        source: input
        description: "Approved outage cost budget in USD"
        constraints: "> 0"
      - name: scope_freeze_at
        type: datetime
        source: input
        description: "Scope-freeze instant; discretionary scope additions are barred at or after it"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: required_training_modules
        type: integer
        source: input
        default: 4
        description: "Number of general-employee-training modules a supplemental worker must complete before badging"
        constraints: ">= 0"
      - name: required_badged_workers
        type: integer
        source: input
        default: 0
        description: "Minimum badged_worker_count needed before execution may commence"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: PLANNING
        description: "Outage lifecycle state (see §1.2)"
        constraints: "one of {PLANNING, SCOPE_LOCKED, EXECUTION, STARTUP, ONLINE, REVIEWED}"
      - name: schedule_posture
        type: enum
        source: computed
        default: ON_TRACK
        description: "Derived duration posture; gates discretionary scope (see calculations.outage_schedule_posture)"
        constraints: "one of {ON_TRACK, AT_RISK, RECOVERY_REQUIRED}"
      - name: alara_posture
        type: enum
        source: computed
        default: NORMAL
        description: "Derived dose posture; gates RWP approval (see calculations.outage_alara_posture)"
        constraints: "one of {NORMAL, RESTRICTED, SUSPENDED}"
      - name: projected_duration_hours
        type: number
        source: computed
        default: 0
        description: "Deterministic critical-path length over non-cancelled ScheduleActivity rows"
        constraints: "2 decimal places"
      - name: risk_adjusted_duration_hours
        type: number
        source: computed
        default: 0
        description: "Contingency-inflated critical-path length (second variant of the same calculation)"
        constraints: "2 decimal places"
      - name: critical_path_activity_id
        type: string
        source: computed
        default: null
        description: "Identity of the ScheduleActivity that terminates the deterministic longest path; identity only, never a decision input; null when the outage has no non-cancelled activity"
      - name: dose_committed_mrem
        type: number
        source: computed
        default: 0
        description: "Signed sum of the outage's DoseTransaction rows (see calculations.outage_dose_ledger)"
        constraints: "2 decimal places"
      - name: dose_budget_remaining_mrem
        type: number
        source: computed
        description: "dose_budget_total_mrem - dose_committed_mrem; may go negative on actual-dose overrun"
        constraints: "2 decimal places"
      - name: approved_scope_cost_usd
        type: number
        source: computed
        default: 0
        description: "Sum of estimated_cost_usd over WorkOrder rows in status APPROVED, EXECUTING or COMPLETE"
        constraints: "2 decimal places"
      - name: scope_contingency_usd
        type: number
        source: computed
        default: 0
        description: "Tiered contingency on approved_scope_cost_usd (see calculations.outage_scope_cost_rollup)"
        constraints: "2 decimal places"
      - name: total_scope_cost_usd
        type: number
        source: computed
        default: 0
        description: "approved_scope_cost_usd + scope_contingency_usd"
        constraints: "2 decimal places"
      - name: approved_emergent_hours
        type: number
        source: computed
        default: 0
        description: "Sum of estimated_hours over EmergentWorkItem rows in status APPROVED whose discovering WorkOrder belongs to this outage"
        constraints: "2 decimal places"
      - name: badged_worker_count
        type: integer
        source: computed
        default: 0
        description: "Count of SupplementalWorker rows for this outage in status BADGED"
        constraints: ">= 0"
      - name: scope_locked_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which lock-scope succeeded; null before that"
      - name: actual_duration_hours
        type: number
        source: input
        default: null
        description: "As-worked breaker-to-breaker duration supplied at post-outage review"
        constraints: "> 0 when present"
      - name: actual_cost_usd
        type: number
        source: input
        default: null
        description: "As-spent outage cost supplied at post-outage review"
        constraints: ">= 0 when present"
      - name: review_notes
        type: string
        source: input
        default: null
        description: "Free-text post-outage review commentary"
        constraints: "0..2000 chars"
      - name: duration_variance_pct
        type: number
        source: computed
        default: null
        description: "Gross duration variance against duration_target_hours (see calculations.outage_performance_review)"
        constraints: "2 decimal places"
      - name: adjusted_duration_variance_pct
        type: number
        source: computed
        default: null
        description: "Duration variance after removing approved_emergent_hours (second variant)"
        constraints: "2 decimal places"
      - name: dose_variance_pct
        type: number
        source: computed
        default: null
        description: "Dose variance of dose_committed_mrem against dose_budget_total_mrem"
        constraints: "2 decimal places"
      - name: cost_variance_pct
        type: number
        source: computed
        default: null
        description: "Cost variance of actual_cost_usd against cost_budget_usd"
        constraints: "2 decimal places"
      - name: outage_performance_index
        type: number
        source: computed
        default: null
        description: "Composite index using duration_variance_pct (gross variant)"
        constraints: "2 decimal places, floor 0"
      - name: adjusted_performance_index
        type: number
        source: computed
        default: null
        description: "Composite index using adjusted_duration_variance_pct (adjusted variant)"
        constraints: "2 decimal places, floor 0"
      - name: created_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the OutageDirector that created the outage; audit only"

  - name: SpentFuelPool
    parent: null
    common_fields: true
    fields:
      - name: station_unit
        type: enum
        source: input
        description: "Generating unit the pool serves"
        constraints: "one of {UNIT_1, UNIT_2}"
      - name: cells_total
        type: integer
        source: input
        description: "Total storage cells in the pool rack"
        constraints: "> 0"
      - name: cells_baseline_occupied
        type: integer
        source: input
        description: "Cells already occupied by legacy inventory at pool registration"
        constraints: ">= 0 and <= cells_total"
      - name: full_core_offload_reserve_cells
        type: integer
        source: input
        description: "Cells that must remain free to preserve full-core-offload capability"
        constraints: ">= 0"
      - name: cells_occupied
        type: integer
        source: computed
        description: "cells_baseline_occupied plus cells of PoolCellReservation rows in status CONSUMED"
        constraints: ">= 0"
      - name: cells_reserved
        type: integer
        source: computed
        default: 0
        description: "Sum of cells_requested over PoolCellReservation rows in status RESERVED"
        constraints: ">= 0"
      - name: cells_available
        type: integer
        source: computed
        description: "cells_total - cells_occupied - cells_reserved (nominal availability variant)"
        constraints: ">= 0"
      - name: protected_cells_available
        type: integer
        source: computed
        description: "cells_available - full_core_offload_reserve_cells (full-core-protected availability variant); may be negative"

  - name: RadArea
    parent: null
    common_fields: true
    fields:
      - name: station_unit
        type: enum
        source: input
        description: "Generating unit the radiological area belongs to"
        constraints: "one of {UNIT_1, UNIT_2}"
      - name: area_code
        type: string
        source: input
        description: "Station radiological area code such as CTMT-EL471"
        constraints: "1..32 chars; unique per station_unit"
      - name: dose_rate_mrem_per_hr
        type: number
        source: input
        description: "General-area dose rate used for RWP dose estimation"
        constraints: "> 0"
      - name: occupancy_limit_workers
        type: integer
        source: input
        description: "Occupancy limit on the number of workers permitted in the area"
        constraints: ">= 1"
      - name: survey_buffer_hours
        type: number
        source: input
        description: "Post-work survey/decay buffer appended to the end of every occupied window"
        constraints: ">= 0"

  - name: SafetyFunction
    parent: null
    common_fields: true
    fields:
      - name: station_unit
        type: enum
        source: input
        description: "Generating unit the shutdown safety function protects"
        constraints: "one of {UNIT_1, UNIT_2}"
      - name: function_code
        type: enum
        source: input
        description: "Shutdown safety function identifier"
        constraints: "one of {DECAY_HEAT_REMOVAL, INVENTORY_CONTROL, ELECTRICAL_POWER, CONTAINMENT, REACTIVITY_CONTROL}; unique per station_unit"
      - name: trains_total
        type: integer
        source: input
        description: "Total redundant trains implementing the function"
        constraints: ">= 1"
      - name: min_trains_required
        type: integer
        source: input
        description: "Trains that must stay in service at all times during the outage"
        constraints: ">= 0 and <= trains_total"
      - name: max_concurrent_oos_trains
        type: integer
        source: computed
        description: "trains_total - min_trains_required; the aggregate out-of-service capacity"
        constraints: ">= 0"

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - name: outage_id
        type: string
        source: input
        description: "FK -> Outage.id; supplied by the path segment of POST /outages/{id}/work-orders"
      - name: wo_type
        type: enum
        source: input
        description: "Scope classification driving the base priority weight"
        constraints: "one of {MAINTENANCE, MODIFICATION, INSPECTION}"
      - name: title
        type: string
        source: input
        description: "Short work-order title"
        constraints: "1..200 chars"
      - name: estimated_hours
        type: number
        source: input
        description: "Estimated execution hours, used for duration pressure scoring"
        constraints: "> 0"
      - name: estimated_cost_usd
        type: number
        source: input
        description: "Estimated cost, rolled up into Outage.approved_scope_cost_usd once APPROVED"
        constraints: ">= 0"
      - name: estimated_dose_mrem
        type: number
        source: input
        description: "Estimated collective dose, used as a priority penalty"
        constraints: ">= 0"
      - name: regulatory_commitment
        type: boolean
        source: input
        default: false
        description: "True when the work discharges a docketed regulatory commitment"
      - name: safety_function_id
        type: string
        source: input
        default: null
        description: "FK -> SafetyFunction.id; the shutdown safety function this work order touches, or null"
      - name: requires_rad_work
        type: boolean
        source: input
        default: false
        description: "True when the work order needs at least one RadiologicalWorkPermit"
      - name: priority_score
        type: number
        source: computed
        description: "Weighted score (see calculations.work_order_priority_score)"
        constraints: "0..100, 2 decimal places"
      - name: priority
        type: enum
        source: computed
        description: "Priority band derived from priority_score thresholds"
        constraints: "one of {CRITICAL, HIGH, DISCRETIONARY}"
      - name: status
        type: enum
        source: system
        default: SCOPED
        description: "Work-order lifecycle state (see §1.2)"
        constraints: "one of {SCOPED, PLANNED, APPROVED, EXECUTING, COMPLETE, DEFERRED}"
      - name: origin
        type: enum
        source: system
        default: PLANNED_SCOPE
        description: "PLANNED_SCOPE for operator-created work orders; EMERGENT for work orders minted by an APPROVED emergent-item disposition"
        constraints: "one of {PLANNED_SCOPE, EMERGENT}"
      - name: deferral_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on the transition into DEFERRED; the literal SCHEDULE_POSTURE_AUTO_DEFERRAL when set by cascade"
      - name: return_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on the most recent return-to-planning transition"

  - name: ScheduleActivity
    parent: null
    common_fields: true
    fields:
      - name: outage_id
        type: string
        source: input
        description: "FK -> Outage.id; supplied by the path segment of POST /outages/{id}/schedule-activities"
      - name: work_order_id
        type: string
        source: input
        default: null
        description: "FK -> WorkOrder.id; the work order this activity executes, or null for a non-work activity such as a plant evolution"
      - name: label
        type: string
        source: input
        description: "Schedule activity label"
        constraints: "1..200 chars"
      - name: planned_start_offset_hours
        type: number
        source: input
        description: "Planned start expressed as hours after breaker-open (outage hour zero)"
        constraints: ">= 0"
      - name: planned_duration_hours
        type: number
        source: input
        description: "Planned activity duration in hours; the only duration input the critical path uses"
        constraints: "> 0"
      - name: predecessor_activity_id
        type: string
        source: input
        default: null
        description: "FK -> ScheduleActivity.id; the single logic predecessor forming the self-referential activity chain, or null for a chain root"
      - name: oos_safety_function_id
        type: string
        source: input
        default: null
        description: "FK -> SafetyFunction.id; the shutdown safety function whose train this activity takes out of service, or null"
      - name: oos_train_label
        type: string
        source: input
        default: null
        description: "Train label taken out of service; required when oos_safety_function_id is present"
        constraints: "1..8 chars when present"
      - name: execution_status
        type: enum
        source: system
        default: NOT_STARTED
        description: "First parallel state dimension: as-worked progress"
        constraints: "one of {NOT_STARTED, IN_PROGRESS, COMPLETE, CANCELLED}"
      - name: constraint_status
        type: enum
        source: computed
        default: CLEAR
        description: "Second parallel state dimension: CLEAR when predecessor_activity_id is null or the predecessor's execution_status is COMPLETE, otherwise BLOCKED"
        constraints: "one of {CLEAR, BLOCKED}"
      - name: path_length_hours
        type: number
        source: computed
        description: "planned_duration_hours plus the predecessor's path_length_hours (0 when the predecessor is null or CANCELLED)"
        constraints: "2 decimal places"
      - name: risk_adjusted_path_length_hours
        type: number
        source: computed
        description: "Contingency-inflated cumulative path length (see calculations.outage_critical_path)"
        constraints: "2 decimal places"
      - name: is_critical_path
        type: boolean
        source: computed
        default: false
        description: "True when this activity's id equals Outage.critical_path_activity_id"
      - name: started_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the activity moved to IN_PROGRESS"
      - name: completed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the activity moved to COMPLETE"

  - name: CoreLoadPattern
    parent: null
    common_fields: true
    fields:
      - name: outage_id
        type: string
        source: input
        description: "FK -> Outage.id; supplied by the path segment of POST /outages/{id}/core-load-patterns"
      - name: cycle_length_mwd_mtu
        type: number
        source: input
        description: "Target cycle burnup in MWd/MTU driving the reactivity penalty"
        constraints: "> 0"
      - name: fresh_assembly_count
        type: integer
        source: input
        description: "Fresh assemblies loaded by this pattern"
        constraints: ">= 1"
      - name: discharge_assembly_count
        type: integer
        source: input
        description: "Assemblies discharged to the spent fuel pool by this pattern"
        constraints: ">= 0"
      - name: reactivity_margin_pcm
        type: number
        source: computed
        description: "Predicted shutdown margin (see calculations.core_load_reactivity_margin)"
        constraints: "2 decimal places"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Reload-design review state (see §1.2)"
        constraints: "one of {DRAFT, APPROVED, SUPERSEDED}"
      - name: created_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ReactorEngineer that created the pattern; the segregation-of-duties comparand"
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: "Opaque X-User-ID of the ReactorEngineer that approved the pattern; null while DRAFT"

  - name: PoolCellReservation
    parent: null
    common_fields: true
    fields:
      - name: outage_id
        type: string
        source: input
        description: "FK -> Outage.id; the outage consuming pool capacity"
      - name: spent_fuel_pool_id
        type: string
        source: input
        description: "FK -> SpentFuelPool.id; the pool whose cells are reserved"
      - name: cells_requested
        type: integer
        source: input
        description: "Cells reserved by this request"
        constraints: ">= 1"
      - name: purpose
        type: enum
        source: input
        description: "Reservation purpose; selects which availability variant gates the request"
        constraints: "one of {DISCHARGE, FRESH_STAGING, CONTINGENCY}"
      - name: availability_variant
        type: enum
        source: computed
        description: "FULL_CORE_PROTECTED when purpose is DISCHARGE or FRESH_STAGING; NOMINAL when purpose is CONTINGENCY"
        constraints: "one of {FULL_CORE_PROTECTED, NOMINAL}"
      - name: status
        type: enum
        source: system
        default: RESERVED
        description: "Reservation lifecycle state (see §1.2)"
        constraints: "one of {RESERVED, CONSUMED, RELEASED}"
      - name: release_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on the transition into RELEASED"

  - name: SupplementalWorker
    parent: null
    common_fields: true
    fields:
      - name: outage_id
        type: string
        source: input
        description: "FK -> Outage.id; supplied by the path segment of POST /outages/{id}/supplemental-workers"
      - name: full_name
        type: string
        source: input
        description: "Worker name as printed on the badge"
        constraints: "1..120 chars"
      - name: craft
        type: enum
        source: input
        description: "Craft classification"
        constraints: "one of {PIPEFITTER, ELECTRICIAN, INSULATOR, SCAFFOLD_BUILDER, RAD_TECH, LABORER}"
      - name: sponsoring_contractor
        type: string
        source: input
        description: "Contractor sponsoring the worker's site access"
        constraints: "1..120 chars"
      - name: background_status
        type: enum
        source: system
        default: PENDING
        description: "Access-authorization background screening branch"
        constraints: "one of {PENDING, CLEAR, ADVERSE}"
      - name: training_modules_completed
        type: integer
        source: system
        default: 0
        description: "Cumulative general-employee-training modules recorded for the worker"
        constraints: ">= 0"
      - name: training_status
        type: enum
        source: computed
        default: PENDING
        description: "COMPLETE when training_modules_completed >= Outage.required_training_modules, else PENDING"
        constraints: "one of {PENDING, COMPLETE}"
      - name: badge_number
        type: string
        source: system
        default: null
        description: "Issued badge number; unique among BADGED workers of the same outage"
        constraints: "1..24 chars when present"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Onboarding state; the fork-join over background_status and training_status (see §1.2)"
        constraints: "one of {REQUESTED, SCREENING, BADGE_READY, BADGED, DENIED}"

  - name: RadiologicalWorkPermit
    parent: null
    common_fields: true
    fields:
      - name: outage_id
        type: string
        source: system
        description: "FK -> Outage.id; copied from the parent WorkOrder at creation"
      - name: work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; supplied by the path segment of POST /work-orders/{id}/rwps"
      - name: rad_area_id
        type: string
        source: input
        description: "FK -> RadArea.id; the radiological area the permit occupies"
      - name: worker_count
        type: integer
        source: input
        description: "Workers covered by the permit; checked against RadArea.occupancy_limit_workers"
        constraints: ">= 1"
      - name: shielding_factor
        type: number
        source: input
        description: "Fractional dose reduction credited to temporary shielding"
        constraints: ">= 0 and <= 0.95"
      - name: planned_start_offset_hours
        type: number
        source: input
        description: "Permit window start expressed as hours after outage hour zero"
        constraints: ">= 0"
      - name: planned_duration_hours
        type: number
        source: input
        description: "Permit window length in hours"
        constraints: "> 0"
      - name: per_worker_dose_mrem
        type: number
        source: computed
        description: "Rounded per-worker dose estimate (see calculations.rwp_committed_dose)"
        constraints: "2 decimal places"
      - name: collective_dose_mrem
        type: number
        source: computed
        description: "per_worker_dose_mrem * worker_count, rounded"
        constraints: "2 decimal places"
      - name: contingency_dose_mrem
        type: number
        source: computed
        description: "Dose contingency applied on top of collective_dose_mrem"
        constraints: "2 decimal places"
      - name: committed_dose_mrem
        type: number
        source: computed
        description: "collective_dose_mrem + contingency_dose_mrem; the amount debited from the outage dose budget on approval"
        constraints: "2 decimal places"
      - name: alara_review_required
        type: boolean
        source: computed
        description: "True when collective_dose_mrem >= ALARA_REVIEW_THRESHOLD_MREM"
      - name: alara_review_reference
        type: string
        source: system
        default: null
        description: "ALARA review record reference captured at approval; null while unapproved"
        constraints: "1..64 chars when present"
      - name: actual_dose_mrem
        type: number
        source: system
        default: null
        description: "As-worked collective dose recorded at closeout; null until CLOSED"
        constraints: ">= 0 when present"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Permit lifecycle state (see §1.2)"
        constraints: "one of {DRAFT, HELD_FOR_ALARA, APPROVED, CLOSED, VOIDED}"
      - name: void_reason
        type: string
        source: system
        default: null
        description: "Reason recorded on the transition into VOIDED; the literal WORK_ORDER_DEFERRED when set by cascade"

  - name: DoseTransaction
    parent: null
    common_fields: false
    fields:
      - name: rwp_id
        type: string
        source: system
        description: "FK -> RadiologicalWorkPermit.id; the permit that produced this ledger row"
      - name: direction
        type: enum
        source: system
        description: "COMMIT debits the outage dose budget; RELEASE credits it back"
        constraints: "one of {COMMIT, RELEASE}"
      - name: amount_mrem
        type: number
        source: system
        description: "Unsigned magnitude of the ledger movement"
        constraints: "> 0, 2 decimal places"
      - name: reason
        type: enum
        source: system
        description: "Which transition appended the row"
        constraints: "one of {RWP_APPROVED, RWP_CLOSED_UNDERRUN, RWP_CLOSED_OVERRUN, RWP_VOIDED, WORK_ORDER_DEFERRED}"

  - name: EmergentWorkItem
    parent: null
    common_fields: true
    fields:
      - name: discovered_from_work_order_id
        type: string
        source: input
        description: "FK -> WorkOrder.id; the inspection or maintenance work order during which the condition was found"
      - name: description
        type: string
        source: input
        description: "Description of the discovered condition"
        constraints: "1..500 chars"
      - name: estimated_hours
        type: number
        source: input
        description: "Estimated hours to correct; becomes the minted work order's estimated_hours"
        constraints: "> 0"
      - name: estimated_cost_usd
        type: number
        source: input
        description: "Estimated cost to correct"
        constraints: ">= 0"
      - name: estimated_dose_mrem
        type: number
        source: input
        description: "Estimated collective dose to correct"
        constraints: ">= 0"
      - name: discovered_during_inspection
        type: boolean
        source: input
        default: true
        description: "True when the condition was found during an inspection activity; audit only"
      - name: status
        type: enum
        source: system
        default: REPORTED
        description: "Disposition state (see §1.2)"
        constraints: "one of {REPORTED, APPROVED, REJECTED, ABSORBED}"
      - name: disposition_note
        type: string
        source: system
        default: null
        description: "Note recorded at disposition; null while REPORTED"
      - name: created_work_order_id
        type: string
        source: computed
        default: null
        description: "Identity of the WorkOrder minted by an APPROVED disposition; identity only, never a decision input; null for REPORTED, REJECTED and ABSORBED items"

  - name: StartupTest
    parent: null
    common_fields: true
    fields:
      - name: outage_id
        type: string
        source: input
        description: "FK -> Outage.id; supplied by the path segment of POST /outages/{id}/startup-tests"
      - name: test_code
        type: string
        source: input
        description: "Startup test procedure code"
        constraints: "1..32 chars"
      - name: sequence_index
        type: integer
        source: input
        description: "Position in the startup test sequence; lower indices must be satisfied first"
        constraints: ">= 1; unique per outage_id"
      - name: hold_point_type
        type: enum
        source: input
        description: "Hold point classification governing release requirements"
        constraints: "one of {REGULATORY, STATION, NONE}"
      - name: predicted_reactivity_pcm
        type: number
        source: input
        description: "Predicted reactivity worth in pcm for the test point"
      - name: measured_reactivity_pcm
        type: number
        source: system
        default: null
        description: "Measured reactivity worth supplied at satisfy time"
      - name: reactivity_deviation_pcm
        type: number
        source: computed
        default: null
        description: "abs(measured_reactivity_pcm - predicted_reactivity_pcm); null until a satisfy attempt is made"
        constraints: "2 decimal places"
      - name: nrc_release_reference
        type: string
        source: system
        default: null
        description: "Regulator release reference captured when a REGULATORY hold point is satisfied"
        constraints: "1..64 chars when present"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Test state (see §1.2)"
        constraints: "one of {PENDING, SATISFIED, FAILED}"
      - name: created_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the RegulatoryAffairs user that declared the test; the segregation-of-duties comparand"
      - name: satisfied_by_user_id
        type: string
        source: system
        default: null
        description: "Opaque X-User-ID of the RegulatoryAffairs user whose satisfy call moved the test to SATISFIED"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: Outage
    state_field: status
    initial_state: PLANNING
    terminal_states: [REVIEWED]
    transitions:
      - from: PLANNING
        to: SCOPE_LOCKED
        trigger: "POST /outages/{id}/lock-scope"
        actor: OutageDirector
        preconditions:
          - "Outage.status == PLANNING"
          - "at least one WorkOrder row with outage_id == Outage.id has status == APPROVED, else ERR_WORK_ORDER_STATE_INVALID"
          - "at least one CoreLoadPattern row with outage_id == Outage.id has status == APPROVED, else ERR_CORE_LOAD_PATTERN_NOT_APPROVED"
        side_effects:
          - "sets Outage.scope_locked_at to the current logical-clock instant"
          - "cascade down (conditional): every WorkOrder with outage_id == Outage.id and status == SCOPED transitions SCOPED -> DEFERRED with deferral_reason SCOPE_LOCK_AUTO_DEFERRAL, processed in ascending WorkOrder.created_at order"
          - "for each work order deferred by the previous bullet: its ScheduleActivity rows with execution_status == NOT_STARTED transition to CANCELLED, and its RadiologicalWorkPermit rows in status {DRAFT, HELD_FOR_ALARA} transition to VOIDED with void_reason WORK_ORDER_DEFERRED (a SCOPED work order can hold no APPROVED permit, so no DoseTransaction is appended here)"
          - "recomputes Outage.approved_scope_cost_usd, Outage.scope_contingency_usd and Outage.total_scope_cost_usd (calculations.outage_scope_cost_rollup)"
          - "recomputes Outage.projected_duration_hours, Outage.risk_adjusted_duration_hours, Outage.critical_path_activity_id (calculations.outage_critical_path) and then Outage.schedule_posture (calculations.outage_schedule_posture)"
          - "increments Outage.version by 1"
      - from: SCOPE_LOCKED
        to: EXECUTION
        trigger: "POST /outages/{id}/commence-execution"
        actor: OutageDirector
        preconditions:
          - "Outage.status == SCOPE_LOCKED"
          - "Outage.badged_worker_count >= Outage.required_badged_workers, else ERR_BADGED_WORKFORCE_INSUFFICIENT"
        side_effects:
          - "increments Outage.version by 1"
        note: "Breaker-open. ScheduleActivity rows can only start once the outage is in EXECUTION."
      - from: EXECUTION
        to: STARTUP
        trigger: "POST /outages/{id}/authorize-startup"
        actor: OutageDirector
        preconditions:
          - "Outage.status == EXECUTION"
          - "count of StartupTest rows with outage_id == Outage.id is >= 1, else ERR_STARTUP_SEQUENCE_EMPTY"
          - "no WorkOrder row with outage_id == Outage.id has status IN {SCOPED, PLANNED, APPROVED, EXECUTING}, else ERR_OPEN_WORK_ORDERS_REMAIN"
          - "every ScheduleActivity row with outage_id == Outage.id and oos_safety_function_id IS NOT NULL has execution_status IN {COMPLETE, CANCELLED}, else ERR_ACTIVITY_STATE_INVALID (shutdown safety functions must be restored before startup)"
        side_effects:
          - "increments Outage.version by 1"
      - from: STARTUP
        to: ONLINE
        trigger: "system: the last StartupTest row of the outage transitions to SATISFIED (bubble-up from POST /startup-tests/{id}/satisfy)"
        actor: system
        preconditions:
          - "Outage.status == STARTUP"
          - "every StartupTest row with outage_id == Outage.id has status == SATISFIED"
        side_effects:
          - "increments Outage.version by 1"
        note: "Compound/aggregate transition: the parent's state is a function of its StartupTest children."
      - from: ONLINE
        to: REVIEWED
        trigger: "POST /outages/{id}/post-outage-review"
        actor: OutageDirector
        preconditions:
          - "Outage.status == ONLINE"
        side_effects:
          - "stores Outage.actual_duration_hours, Outage.actual_cost_usd and Outage.review_notes from the request body"
          - "computes Outage.duration_variance_pct, Outage.adjusted_duration_variance_pct, Outage.dose_variance_pct, Outage.cost_variance_pct, Outage.outage_performance_index and Outage.adjusted_performance_index (calculations.outage_performance_review)"
          - "increments Outage.version by 1"

  - entity: WorkOrder
    state_field: status
    initial_state: SCOPED
    terminal_states: [COMPLETE]
    transitions:
      - from: SCOPED
        to: PLANNED
        trigger: "POST /work-orders/{id}/plan"
        actor: OutagePlanner
        preconditions:
          - "WorkOrder.status == SCOPED"
          - "Outage.status IN {PLANNING, SCOPE_LOCKED, EXECUTION}, else ERR_OUTAGE_STATE_INVALID"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: PLANNED
        to: APPROVED
        trigger: "POST /work-orders/{id}/approve-scope"
        actor: OutageDirector
        preconditions:
          - "WorkOrder.status == PLANNED"
          - "Outage.status IN {PLANNING, SCOPE_LOCKED}, else ERR_OUTAGE_STATE_INVALID"
          - "if WorkOrder.priority == DISCRETIONARY then Outage.schedule_posture == ON_TRACK, else ERR_SCOPE_FROZEN"
        side_effects:
          - "recomputes Outage.approved_scope_cost_usd, Outage.scope_contingency_usd and Outage.total_scope_cost_usd"
          - "increments Outage.version by 1"
      - from: APPROVED
        to: PLANNED
        trigger: "POST /work-orders/{id}/return-to-planning"
        actor: OutageDirector
        preconditions:
          - "WorkOrder.status == APPROVED"
          - "no ScheduleActivity row with work_order_id == WorkOrder.id has execution_status IN {IN_PROGRESS, COMPLETE}, else ERR_ACTIVITY_STATE_INVALID"
        side_effects:
          - "sets WorkOrder.return_reason from the request body"
          - "recomputes Outage.approved_scope_cost_usd, Outage.scope_contingency_usd and Outage.total_scope_cost_usd"
          - "increments Outage.version by 1"
        note: "Revision cycle: APPROVED -> PLANNED -> APPROVED may repeat any number of times."
      - from: DEFERRED
        to: PLANNED
        trigger: "POST /work-orders/{id}/return-to-planning"
        actor: OutageDirector
        preconditions:
          - "WorkOrder.status == DEFERRED"
          - "Outage.status IN {PLANNING, SCOPE_LOCKED, EXECUTION}, else ERR_OUTAGE_STATE_INVALID"
        side_effects:
          - "sets WorkOrder.return_reason from the request body and clears WorkOrder.deferral_reason to null"
          - "increments WorkOrder.version by 1"
        note: "Reinstatement cycle: DEFERRED -> PLANNED closes the second loop in this machine."
      - from: PLANNED
        to: DEFERRED
        trigger: "POST /work-orders/{id}/defer"
        actor: OutageDirector
        preconditions:
          - "WorkOrder.status == PLANNED"
        side_effects:
          - "sets WorkOrder.deferral_reason from the request body"
          - "cascade: this work order's ScheduleActivity rows with execution_status == NOT_STARTED transition to CANCELLED, in ascending ScheduleActivity.created_at order"
          - "cascade: this work order's RadiologicalWorkPermit rows in status {DRAFT, HELD_FOR_ALARA} transition to VOIDED with void_reason WORK_ORDER_DEFERRED"
          - "recomputes Outage.projected_duration_hours, Outage.risk_adjusted_duration_hours, Outage.critical_path_activity_id and Outage.schedule_posture"
          - "increments Outage.version by 1"
      - from: APPROVED
        to: DEFERRED
        trigger: "POST /work-orders/{id}/defer"
        actor: OutageDirector
        preconditions:
          - "WorkOrder.status == APPROVED"
          - "no ScheduleActivity row with work_order_id == WorkOrder.id has execution_status IN {IN_PROGRESS, COMPLETE}, else ERR_ACTIVITY_STATE_INVALID"
        side_effects:
          - "sets WorkOrder.deferral_reason from the request body"
          - "cascade hop 1: this work order's ScheduleActivity rows with execution_status == NOT_STARTED transition to CANCELLED, in ascending ScheduleActivity.created_at order"
          - "cascade hop 2: this work order's RadiologicalWorkPermit rows in status {DRAFT, HELD_FOR_ALARA, APPROVED} transition to VOIDED with void_reason WORK_ORDER_DEFERRED; each permit that was APPROVED appends a DoseTransaction {direction: RELEASE, amount_mrem: committed_dose_mrem, reason: WORK_ORDER_DEFERRED}, processed in ascending RadiologicalWorkPermit.created_at order"
          - "cascade hop 3: the appended RELEASE rows drive a recompute of Outage.dose_committed_mrem and Outage.dose_budget_remaining_mrem"
          - "cascade hop 4: Outage.alara_posture is recomputed from the new remaining/total ratio; if it returns to NORMAL every RadiologicalWorkPermit of this outage in status HELD_FOR_ALARA returns to DRAFT, in ascending created_at order"
          - "recomputes Outage.approved_scope_cost_usd, Outage.scope_contingency_usd, Outage.total_scope_cost_usd, Outage.projected_duration_hours, Outage.risk_adjusted_duration_hours, Outage.critical_path_activity_id and Outage.schedule_posture"
          - "increments Outage.version by 1"
      - from: SCOPED
        to: DEFERRED
        trigger: "system: POST /outages/{id}/lock-scope"
        actor: system
        preconditions:
          - "WorkOrder.status == SCOPED at the instant the owning outage leaves PLANNING"
        side_effects:
          - "sets WorkOrder.deferral_reason to the literal SCOPE_LOCK_AUTO_DEFERRAL"
          - "increments WorkOrder.version by 1"
      - from: SCOPED
        to: DEFERRED
        trigger: "system: POST /emergent-items/{id}/dispose with disposition APPROVED drives Outage.schedule_posture out of ON_TRACK"
        actor: system
        preconditions:
          - "WorkOrder.priority == DISCRETIONARY"
          - "WorkOrder.status == SCOPED"
          - "Outage.schedule_posture was ON_TRACK before this request and is AT_RISK or RECOVERY_REQUIRED after step 5 of the dispose cascade"
        side_effects:
          - "sets WorkOrder.deferral_reason to the literal SCHEDULE_POSTURE_AUTO_DEFERRAL"
          - "increments WorkOrder.version by 1"
      - from: PLANNED
        to: DEFERRED
        trigger: "system: POST /emergent-items/{id}/dispose with disposition APPROVED drives Outage.schedule_posture out of ON_TRACK"
        actor: system
        preconditions:
          - "WorkOrder.priority == DISCRETIONARY"
          - "WorkOrder.status == PLANNED"
          - "Outage.schedule_posture was ON_TRACK before this request and is AT_RISK or RECOVERY_REQUIRED after step 5 of the dispose cascade"
        side_effects:
          - "sets WorkOrder.deferral_reason to the literal SCHEDULE_POSTURE_AUTO_DEFERRAL"
          - "cascade: the deferred work order's NOT_STARTED ScheduleActivity rows transition to CANCELLED and its RadiologicalWorkPermit rows in {DRAFT, HELD_FOR_ALARA, APPROVED} transition to VOIDED (APPROVED permits append a RELEASE DoseTransaction with reason WORK_ORDER_DEFERRED)"
          - "increments WorkOrder.version by 1"
      - from: APPROVED
        to: EXECUTING
        trigger: "system: POST /schedule-activities/{id}/start on an activity whose work_order_id is this work order"
        actor: system
        preconditions:
          - "WorkOrder.status == APPROVED"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: EXECUTING
        to: COMPLETE
        trigger: "system: POST /schedule-activities/{id}/complete leaves every ScheduleActivity of this work order in execution_status IN {COMPLETE, CANCELLED}"
        actor: system
        preconditions:
          - "WorkOrder.status == EXECUTING"
          - "every ScheduleActivity row with work_order_id == WorkOrder.id has execution_status IN {COMPLETE, CANCELLED} and at least one is COMPLETE"
        side_effects:
          - "increments WorkOrder.version by 1"

  - entity: ScheduleActivity
    state_field: execution_status
    initial_state: NOT_STARTED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /schedule-activities/{id}/start"
        actor: OutagePlanner
        preconditions:
          - "ScheduleActivity.execution_status == NOT_STARTED"
          - "ScheduleActivity.constraint_status == CLEAR, else ERR_PREDECESSOR_NOT_COMPLETE"
          - "Outage.status == EXECUTION, else ERR_OUTAGE_STATE_INVALID"
          - "ScheduleActivity.work_order_id IS NULL or WorkOrder.status IN {APPROVED, EXECUTING}, else ERR_WORK_ORDER_NOT_APPROVED"
        side_effects:
          - "sets ScheduleActivity.started_at to the current logical-clock instant"
          - "cross-entity: if work_order_id IS NOT NULL and that WorkOrder.status == APPROVED, the work order transitions APPROVED -> EXECUTING"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /schedule-activities/{id}/complete"
        actor: OutagePlanner
        preconditions:
          - "ScheduleActivity.execution_status == IN_PROGRESS"
        side_effects:
          - "sets ScheduleActivity.completed_at to the current logical-clock instant"
          - "cascade hop 1 (parallel dimension): every ScheduleActivity whose predecessor_activity_id == this.id recomputes constraint_status to CLEAR, in ascending created_at order; their execution_status is untouched"
          - "cascade hop 2 (bubble-up): if work_order_id IS NOT NULL and every ScheduleActivity of that work order now has execution_status IN {COMPLETE, CANCELLED}, the work order transitions EXECUTING -> COMPLETE"
          - "recomputes Outage.projected_duration_hours, Outage.risk_adjusted_duration_hours, Outage.critical_path_activity_id and Outage.schedule_posture; increments Outage.version by 1"
        note: "planned_duration_hours, never a recorded actual, is what the critical path consumes; completing an activity therefore does not change projected_duration_hours."
      - from: NOT_STARTED
        to: CANCELLED
        trigger: "system: the owning WorkOrder transitions to DEFERRED (manual defer, scope-lock auto-deferral, or schedule-posture auto-deferral)"
        actor: system
        preconditions:
          - "ScheduleActivity.execution_status == NOT_STARTED"
          - "ScheduleActivity.work_order_id IS NOT NULL"
        side_effects:
          - "the activity leaves the critical-path input set, so Outage.projected_duration_hours and Outage.risk_adjusted_duration_hours are recomputed over the remaining non-cancelled activities"
          - "successors keep constraint_status == BLOCKED: a CANCELLED predecessor never satisfies the CLEAR predicate"

  - entity: ScheduleActivity
    state_field: constraint_status
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: BLOCKED
        trigger: "system: evaluated at POST /outages/{id}/schedule-activities and re-evaluated at POST /schedule-activities/{id}/set-predecessor, when predecessor_activity_id IS NOT NULL and that predecessor's execution_status != COMPLETE"
        actor: system
        preconditions:
          - "ScheduleActivity.predecessor_activity_id IS NOT NULL"
          - "predecessor ScheduleActivity.execution_status != COMPLETE"
        side_effects:
          - "the activity cannot be started until it returns to CLEAR; its execution_status dimension is unaffected"
        note: "Second parallel dimension. Creation evaluates the predicate once; a new activity whose predecessor is already COMPLETE is created directly in CLEAR."
      - from: BLOCKED
        to: CLEAR
        trigger: "system: POST /schedule-activities/{id}/complete on this activity's predecessor, or POST /schedule-activities/{id}/set-predecessor naming a predecessor that is already COMPLETE or null"
        actor: system
        preconditions:
          - "predecessor ScheduleActivity.execution_status == COMPLETE"
        side_effects:
          - "this activity becomes startable; execution_status stays NOT_STARTED"

  - entity: CoreLoadPattern
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /core-load-patterns/{id}/approve"
        actor: ReactorEngineer
        preconditions:
          - "CoreLoadPattern.status == DRAFT"
          - "Outage.status == PLANNING, else ERR_OUTAGE_STATE_INVALID"
          - "X-User-ID != CoreLoadPattern.created_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "CoreLoadPattern.reactivity_margin_pcm >= MIN_SHUTDOWN_MARGIN_PCM (1000), else ERR_SHUTDOWN_MARGIN_INSUFFICIENT"
        side_effects:
          - "sets CoreLoadPattern.approved_by_user_id to the acting X-User-ID"
          - "every other CoreLoadPattern with the same outage_id and status == APPROVED transitions APPROVED -> SUPERSEDED, in ascending created_at order"
          - "increments Outage.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: another CoreLoadPattern of the same outage is approved"
        actor: system
        preconditions:
          - "CoreLoadPattern.status == APPROVED"
        side_effects:
          - "increments CoreLoadPattern.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: POST /outages/{id}/core-load-patterns creates a newer pattern for the same outage"
        actor: system
        preconditions:
          - "CoreLoadPattern.status == DRAFT"
        side_effects:
          - "increments CoreLoadPattern.version by 1"
        note: "A reload design under revision is superseded, not deleted; only one DRAFT pattern per outage is ever live."

  - entity: PoolCellReservation
    state_field: status
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /pool-cell-reservations/{id}/consume"
        actor: ReactorEngineer
        preconditions:
          - "PoolCellReservation.status == RESERVED"
          - "Outage.status IN {SCOPE_LOCKED, EXECUTION}, else ERR_OUTAGE_STATE_INVALID"
        side_effects:
          - "ledger sync: SpentFuelPool.cells_reserved drops by cells_requested and SpentFuelPool.cells_occupied rises by cells_requested; cells_available and protected_cells_available are recomputed (calculations.pool_cell_ledger)"
          - "increments SpentFuelPool.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /pool-cell-reservations/{id}/release"
        actor: ReactorEngineer
        preconditions:
          - "PoolCellReservation.status == RESERVED"
        side_effects:
          - "sets PoolCellReservation.release_reason from the request body"
          - "compensation: SpentFuelPool.cells_reserved drops by cells_requested with cells_occupied untouched, so cells_available and protected_cells_available return to their pre-reservation values"
          - "increments SpentFuelPool.version by 1"

  - entity: SupplementalWorker
    state_field: status
    initial_state: REQUESTED
    terminal_states: [BADGED, DENIED]
    transitions:
      - from: REQUESTED
        to: SCREENING
        trigger: "POST /supplemental-workers/{id}/background-result with outcome CLEAR"
        actor: AccessAuthority
        preconditions:
          - "SupplementalWorker.status IN {REQUESTED, SCREENING}, else ERR_WORKER_STATE_INVALID"
        side_effects:
          - "sets SupplementalWorker.background_status to CLEAR"
          - "fork branch A of the onboarding fork-join is now complete"
      - from: REQUESTED
        to: SCREENING
        trigger: "POST /supplemental-workers/{id}/training-completion"
        actor: AccessAuthority
        preconditions:
          - "SupplementalWorker.status IN {REQUESTED, SCREENING}, else ERR_WORKER_STATE_INVALID"
        side_effects:
          - "sets SupplementalWorker.training_modules_completed to the submitted modules_completed value"
          - "recomputes SupplementalWorker.training_status: COMPLETE when training_modules_completed >= Outage.required_training_modules, else PENDING"
          - "fork branch B of the onboarding fork-join is complete only when training_status becomes COMPLETE"
      - from: SCREENING
        to: BADGE_READY
        trigger: "system: join — evaluated at the end of every background-result and training-completion request"
        actor: system
        preconditions:
          - "SupplementalWorker.background_status == CLEAR"
          - "SupplementalWorker.training_status == COMPLETE"
        side_effects:
          - "increments SupplementalWorker.version by 1"
        note: "Join point of the fork-join: neither branch alone reaches BADGE_READY."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /supplemental-workers/{id}/background-result with outcome ADVERSE"
        actor: AccessAuthority
        preconditions:
          - "SupplementalWorker.status IN {REQUESTED, SCREENING}, else ERR_WORKER_STATE_INVALID"
        side_effects:
          - "sets SupplementalWorker.background_status to ADVERSE; the training branch is abandoned and no badge can ever be issued"
      - from: SCREENING
        to: DENIED
        trigger: "POST /supplemental-workers/{id}/background-result with outcome ADVERSE"
        actor: AccessAuthority
        preconditions:
          - "SupplementalWorker.status == SCREENING"
        side_effects:
          - "sets SupplementalWorker.background_status to ADVERSE"
        note: "Divergent branch side-effect set: the ADVERSE branch never touches Outage.badged_worker_count, the CLEAR-plus-training branch eventually does."
      - from: BADGE_READY
        to: BADGED
        trigger: "POST /supplemental-workers/{id}/badge"
        actor: AccessAuthority
        preconditions:
          - "SupplementalWorker.status == BADGE_READY, else ERR_WORKER_STATE_INVALID"
          - "no other SupplementalWorker with the same outage_id and status == BADGED holds the submitted badge_number, else ERR_BADGE_NUMBER_TAKEN"
        side_effects:
          - "sets SupplementalWorker.badge_number from the request body"
          - "ledger sync: Outage.badged_worker_count rises by 1; increments Outage.version by 1"

  - entity: RadiologicalWorkPermit
    state_field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /rwps/{id}/approve"
        actor: RadProtectionManager
        preconditions:
          - "RadiologicalWorkPermit.status == DRAFT, else ERR_RWP_STATE_INVALID"
          - "Outage.status IN {SCOPE_LOCKED, EXECUTION}, else ERR_OUTAGE_STATE_INVALID"
          - "WorkOrder.status == APPROVED, else ERR_WORK_ORDER_NOT_APPROVED"
          - "Outage.alara_posture != SUSPENDED, else ERR_ALARA_POSTURE_SUSPENDED"
          - "RadiologicalWorkPermit.alara_review_required == false OR the request supplies alara_review_reference, else ERR_ALARA_REVIEW_REQUIRED"
          - "no other RadiologicalWorkPermit with the same rad_area_id and status == APPROVED occupies an overlapping buffered window (validations priority 15), else ERR_RAD_AREA_WINDOW_CONFLICT"
          - "RadiologicalWorkPermit.committed_dose_mrem <= Outage.dose_budget_remaining_mrem, else ERR_DOSE_BUDGET_EXCEEDED"
        side_effects:
          - "sets RadiologicalWorkPermit.alara_review_reference from the request body when supplied"
          - "cascade hop 1: appends DoseTransaction {rwp_id: this.id, direction: COMMIT, amount_mrem: committed_dose_mrem, reason: RWP_APPROVED}"
          - "cascade hop 2: that ledger row drives a recompute of Outage.dose_committed_mrem and Outage.dose_budget_remaining_mrem (calculations.outage_dose_ledger)"
          - "cascade hop 3: the new remaining/total ratio drives a recompute of Outage.alara_posture (calculations.outage_alara_posture)"
          - "cascade hop 4: if Outage.alara_posture moved out of NORMAL in this request, every RadiologicalWorkPermit with the same outage_id, status == DRAFT and committed_dose_mrem > ALARA_RESTRICTED_HOLD_MREM (200) transitions DRAFT -> HELD_FOR_ALARA, in ascending created_at order"
          - "increments Outage.version by 1"
      - from: DRAFT
        to: HELD_FOR_ALARA
        trigger: "system: Outage.alara_posture moves from NORMAL to RESTRICTED or SUSPENDED (hop 4 of an approve or close cascade)"
        actor: system
        preconditions:
          - "RadiologicalWorkPermit.status == DRAFT"
          - "RadiologicalWorkPermit.committed_dose_mrem > ALARA_RESTRICTED_HOLD_MREM (200)"
        side_effects:
          - "increments RadiologicalWorkPermit.version by 1"
      - from: HELD_FOR_ALARA
        to: DRAFT
        trigger: "system: Outage.alara_posture returns to NORMAL after a RELEASE DoseTransaction (void, underrun closeout, or work-order deferral)"
        actor: system
        preconditions:
          - "RadiologicalWorkPermit.status == HELD_FOR_ALARA"
          - "Outage.alara_posture == NORMAL after the recompute"
        side_effects:
          - "increments RadiologicalWorkPermit.version by 1"
        note: "Closes the posture-driven cycle DRAFT -> HELD_FOR_ALARA -> DRAFT."
      - from: APPROVED
        to: CLOSED
        trigger: "POST /rwps/{id}/close"
        actor: RadProtectionPlanner
        preconditions:
          - "RadiologicalWorkPermit.status == APPROVED, else ERR_RWP_STATE_INVALID"
          - "Outage.status IN {EXECUTION, STARTUP}, else ERR_OUTAGE_STATE_INVALID"
        side_effects:
          - "sets RadiologicalWorkPermit.actual_dose_mrem from the request body"
          - "if actual_dose_mrem < committed_dose_mrem appends DoseTransaction {direction: RELEASE, amount_mrem: committed_dose_mrem - actual_dose_mrem, reason: RWP_CLOSED_UNDERRUN}"
          - "if actual_dose_mrem > committed_dose_mrem appends DoseTransaction {direction: COMMIT, amount_mrem: actual_dose_mrem - committed_dose_mrem, reason: RWP_CLOSED_OVERRUN}"
          - "if actual_dose_mrem == committed_dose_mrem appends no ledger row at all"
          - "recomputes Outage.dose_committed_mrem, Outage.dose_budget_remaining_mrem and Outage.alara_posture, then runs the DRAFT <-> HELD_FOR_ALARA cascade in whichever direction the posture moved"
          - "increments Outage.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /rwps/{id}/void"
        actor: RadProtectionManager
        preconditions:
          - "RadiologicalWorkPermit.status == DRAFT"
        side_effects:
          - "sets RadiologicalWorkPermit.void_reason from the request body; appends no DoseTransaction because an unapproved permit holds no committed dose"
          - "increments RadiologicalWorkPermit.version by 1"
      - from: HELD_FOR_ALARA
        to: VOIDED
        trigger: "POST /rwps/{id}/void"
        actor: RadProtectionManager
        preconditions:
          - "RadiologicalWorkPermit.status == HELD_FOR_ALARA"
        side_effects:
          - "sets RadiologicalWorkPermit.void_reason from the request body; appends no DoseTransaction"
          - "increments RadiologicalWorkPermit.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /rwps/{id}/void"
        actor: RadProtectionManager
        preconditions:
          - "RadiologicalWorkPermit.status == APPROVED"
        side_effects:
          - "sets RadiologicalWorkPermit.void_reason from the request body"
          - "compensation hop 1: appends DoseTransaction {direction: RELEASE, amount_mrem: committed_dose_mrem, reason: RWP_VOIDED} — exactly reversing the COMMIT written at approval"
          - "compensation hop 2: recomputes Outage.dose_committed_mrem and Outage.dose_budget_remaining_mrem"
          - "compensation hop 3: recomputes Outage.alara_posture; if it returns to NORMAL every HELD_FOR_ALARA permit of the outage returns to DRAFT, in ascending created_at order"
          - "increments Outage.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "system: the owning WorkOrder transitions to DEFERRED"
        actor: system
        preconditions:
          - "RadiologicalWorkPermit.status IN {DRAFT, HELD_FOR_ALARA, APPROVED}"
        side_effects:
          - "sets RadiologicalWorkPermit.void_reason to the literal WORK_ORDER_DEFERRED"
          - "appends DoseTransaction {direction: RELEASE, amount_mrem: committed_dose_mrem, reason: WORK_ORDER_DEFERRED} only when the prior status was APPROVED"
          - "increments RadiologicalWorkPermit.version by 1"

  - entity: EmergentWorkItem
    state_field: status
    initial_state: REPORTED
    terminal_states: [APPROVED, REJECTED, ABSORBED]
    transitions:
      - from: REPORTED
        to: APPROVED
        trigger: "POST /emergent-items/{id}/dispose with disposition APPROVED"
        actor: OutageDirector
        preconditions:
          - "EmergentWorkItem.status == REPORTED, else ERR_EMERGENT_ITEM_STATE_INVALID"
          - "Outage.status IN {SCOPE_LOCKED, EXECUTION}, else ERR_OUTAGE_STATE_INVALID"
        side_effects:
          - "step 1: sets EmergentWorkItem.status to APPROVED and disposition_note from the request body"
          - "step 2 (cascade hop 1): mints a WorkOrder with outage_id = the discovering work order's outage_id, origin EMERGENT, status APPROVED, wo_type MAINTENANCE, title 'EMERGENT: ' + description, estimated_hours/estimated_cost_usd/estimated_dose_mrem copied from the item, regulatory_commitment false, safety_function_id copied from the discovering work order, requires_rad_work copied from the discovering work order; priority_score and priority are computed exactly as for an operator-created work order. Sets EmergentWorkItem.created_work_order_id to the new work order"
          - "step 3 (cascade hop 2): mints a ScheduleActivity for that work order with label 'EMERGENT: ' + description, planned_duration_hours = item.estimated_hours, predecessor_activity_id = the discovering work order's terminal activity (selector pinned in the note below), planned_start_offset_hours = that predecessor's planned_start_offset_hours + planned_duration_hours (0 when the selector returns no candidate), oos_safety_function_id and oos_train_label null"
          - "step 4 (cascade hop 3): the new activity drives a recompute of Outage.projected_duration_hours, Outage.risk_adjusted_duration_hours, Outage.critical_path_activity_id, Outage.approved_emergent_hours, Outage.approved_scope_cost_usd, Outage.scope_contingency_usd and Outage.total_scope_cost_usd"
          - "step 5 (cascade hop 4): Outage.schedule_posture is recomputed from the step-4 projected_duration_hours"
          - "step 6 (cascade hop 5): if schedule_posture was ON_TRACK before this request and is AT_RISK or RECOVERY_REQUIRED after step 5, every WorkOrder of the outage with priority == DISCRETIONARY and status IN {SCOPED, PLANNED} transitions to DEFERRED with deferral_reason SCHEDULE_POSTURE_AUTO_DEFERRAL, processed in ascending WorkOrder.created_at order"
          - "step 7 (cascade hop 6): each work order deferred in step 6 cancels its NOT_STARTED ScheduleActivity rows and voids its RadiologicalWorkPermit rows in {DRAFT, HELD_FOR_ALARA, APPROVED}; each formerly APPROVED permit appends a RELEASE DoseTransaction with reason WORK_ORDER_DEFERRED"
          - "step 8: Outage.projected_duration_hours, Outage.risk_adjusted_duration_hours, Outage.critical_path_activity_id, Outage.approved_scope_cost_usd, Outage.scope_contingency_usd, Outage.total_scope_cost_usd, Outage.dose_committed_mrem, Outage.dose_budget_remaining_mrem and Outage.alara_posture are recomputed a final time. Outage.schedule_posture is NOT re-evaluated after step 7 — the value fixed in step 5 is the value this request returns"
          - "increments Outage.version by 1"
        note: |
          Terminal-activity selector (deterministic, pinned): eligibility = ScheduleActivity rows with
          work_order_id == the discovering WorkOrder.id and execution_status != CANCELLED; ranking =
          descending (planned_start_offset_hours + planned_duration_hours); tie-break = ascending
          created_at; empty-candidate fallback = predecessor_activity_id null and
          planned_start_offset_hours 0. Activity ids never participate in this decision.
      - from: REPORTED
        to: REJECTED
        trigger: "POST /emergent-items/{id}/dispose with disposition REJECTED"
        actor: OutageDirector
        preconditions:
          - "EmergentWorkItem.status == REPORTED"
          - "Outage.status IN {SCOPE_LOCKED, EXECUTION}"
        side_effects:
          - "sets disposition_note; created_work_order_id stays null; no WorkOrder, ScheduleActivity or Outage field changes at all"
        note: "Divergent branch: the REJECTED path deliberately has an empty side-effect set."
      - from: REPORTED
        to: ABSORBED
        trigger: "POST /emergent-items/{id}/dispose with disposition ABSORBED"
        actor: OutageDirector
        preconditions:
          - "EmergentWorkItem.status == REPORTED"
          - "Outage.status IN {SCOPE_LOCKED, EXECUTION}"
          - "the terminal-activity selector over the discovering work order returns a candidate, else ERR_ACTIVITY_STATE_INVALID"
        side_effects:
          - "adds EmergentWorkItem.estimated_hours to the selected terminal activity's planned_duration_hours (no new WorkOrder and no new ScheduleActivity are created; created_work_order_id stays null)"
          - "recomputes Outage.projected_duration_hours, Outage.risk_adjusted_duration_hours, Outage.critical_path_activity_id and Outage.schedule_posture; Outage.approved_emergent_hours is NOT increased (only APPROVED items count)"
          - "increments Outage.version by 1"

  - entity: StartupTest
    state_field: status
    initial_state: PENDING
    terminal_states: [SATISFIED]
    transitions:
      - from: PENDING
        to: SATISFIED
        trigger: "POST /startup-tests/{id}/satisfy with reactivity_deviation_pcm <= REACTIVITY_TOLERANCE_PCM"
        actor: RegulatoryAffairs
        preconditions:
          - "StartupTest.status IN {PENDING, FAILED}, else ERR_STARTUP_TEST_STATE_INVALID"
          - "Outage.status == STARTUP, else ERR_OUTAGE_STATE_INVALID"
          - "every StartupTest of the same outage with a lower sequence_index has status == SATISFIED, else ERR_STARTUP_SEQUENCE_OUT_OF_ORDER"
          - "if hold_point_type == REGULATORY the request supplies nrc_release_reference, else ERR_REGULATORY_HOLD_POINT_NOT_RELEASED"
          - "if hold_point_type == REGULATORY then X-User-ID != StartupTest.created_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets measured_reactivity_pcm, reactivity_deviation_pcm, nrc_release_reference and satisfied_by_user_id"
          - "bubble-up: if every StartupTest of the outage is now SATISFIED, the outage transitions STARTUP -> ONLINE and Outage.version increments by 1"
      - from: FAILED
        to: SATISFIED
        trigger: "POST /startup-tests/{id}/satisfy with a retest whose reactivity_deviation_pcm <= REACTIVITY_TOLERANCE_PCM"
        actor: RegulatoryAffairs
        preconditions:
          - "StartupTest.status == FAILED"
          - "Outage.status == STARTUP"
          - "every StartupTest of the same outage with a lower sequence_index has status == SATISFIED"
        side_effects:
          - "overwrites measured_reactivity_pcm and reactivity_deviation_pcm with the retest values"
          - "bubble-up: if every StartupTest of the outage is now SATISFIED, the outage transitions STARTUP -> ONLINE"
      - from: PENDING
        to: FAILED
        trigger: "POST /startup-tests/{id}/satisfy with reactivity_deviation_pcm > REACTIVITY_TOLERANCE_PCM (200 response, not an error)"
        actor: RegulatoryAffairs
        preconditions:
          - "all preconditions of the PENDING -> SATISFIED transition hold; only the reactivity tolerance check fails"
        side_effects:
          - "sets measured_reactivity_pcm and reactivity_deviation_pcm; satisfied_by_user_id stays null"
          - "cross-entity: Outage.schedule_posture is forced to RECOVERY_REQUIRED regardless of projected_duration_hours, and stays there until another schedule recompute runs; increments Outage.version by 1"
      - from: FAILED
        to: FAILED
        trigger: "POST /startup-tests/{id}/satisfy on a retest that is still out of tolerance"
        actor: RegulatoryAffairs
        preconditions:
          - "StartupTest.status == FAILED"
          - "reactivity_deviation_pcm > REACTIVITY_TOLERANCE_PCM"
        side_effects:
          - "overwrites measured_reactivity_pcm and reactivity_deviation_pcm; Outage.schedule_posture stays RECOVERY_REQUIRED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` — the only mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: core-load-pattern-create-stale-outage
    parent_entity: Outage
    write_endpoint: "POST /outages/{id}/core-load-patterns"
    occ_field: "expected_outage_version"
    description: |
      Creating a CoreLoadPattern against an Outage whose version has advanced past the
      value the client last observed is rejected. A new reload design legitimately
      supersedes the outage's live DRAFT pattern (§1.2 CoreLoadPattern DRAFT ->
      SUPERSEDED), so a writer holding a stale view of the outage would silently discard
      a design it never saw. The check is a stale-version comparison on Outage.version,
      not a timing rule.
    error_id: ERR_OUTAGE_VERSION_STALE
    http_status: 412

  - rule_id: pool-reservation-create-stale-pool
    parent_entity: SpentFuelPool
    write_endpoint: "POST /pool-cell-reservations"
    occ_field: "expected_spent_fuel_pool_version"
    description: |
      Creating a PoolCellReservation against a SpentFuelPool whose version has advanced
      past the value the client last observed is rejected. Because a reservation is
      admitted against the pool's availability at the instant the client read it, and
      because both cells_reserved and cells_occupied move on every reservation, consume
      and release, a writer whose expected_spent_fuel_pool_version is behind the stored
      version has sized its request against capacity that no longer exists. The check is
      a stale-version comparison on SpentFuelPool.version.
    error_id: ERR_POOL_VERSION_STALE
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules
# All money, dose, hour, percent and score values are Decimal, 2 decimal
# places, ROUND_HALF_UP, unless a rule pins a different precision.
# ---------------------------------------------------------------------------
calculations:

  - name: work_order_priority_score
    trigger: "POST /outages/{id}/work-orders (operator-created) and step 2 of the POST /emergent-items/{id}/dispose APPROVED cascade (system-minted work order); writes WorkOrder.priority_score and WorkOrder.priority"
    algorithm: weighted_scoring
    formula: |
      type_weight       = SAFETY_WEIGHT_BY_TYPE[WorkOrder.wo_type]
      sf_bonus          = SF_BONUS            if WorkOrder.safety_function_id IS NOT NULL else 0
      reg_bonus         = REGULATORY_BONUS    if WorkOrder.regulatory_commitment == true   else 0

      # duration_pressure is cross-entity: it is normalised against the OWNING
      # outage's duration_target_hours, so the same work order scores differently
      # under a 720-hour target than under a 360-hour target.
      raw_pressure      = WorkOrder.estimated_hours / Outage.duration_target_hours * DURATION_PRESSURE_MULTIPLIER
      duration_pressure = min(DURATION_PRESSURE_CAP, round_half_up(raw_pressure, 2))

      # dose_penalty is a FLOOR of completed 100-mrem blocks, not a rounded ratio:
      # 199 mrem penalises exactly as much as 100 mrem.
      dose_penalty      = min(DOSE_PENALTY_CAP, floor(WorkOrder.estimated_dose_mrem / DOSE_PENALTY_DIVISOR))

      priority_score    = round_half_up(type_weight + sf_bonus + reg_bonus + duration_pressure - dose_penalty, 2)

      priority = CRITICAL       if priority_score >= PRIORITY_CRITICAL_MIN
                 HIGH           if priority_score >= PRIORITY_HIGH_MIN
                 DISCRETIONARY  otherwise
    input_set: "A single WorkOrder row plus the duration_target_hours of the Outage named by its outage_id. No other work order participates."
    constants:
      SAFETY_WEIGHT_BY_TYPE: { MAINTENANCE: 20, MODIFICATION: 35, INSPECTION: 30 }
      SF_BONUS: 25
      REGULATORY_BONUS: 20
      DURATION_PRESSURE_MULTIPLIER: 300
      DURATION_PRESSURE_CAP: 30
      DOSE_PENALTY_DIVISOR: 100
      DOSE_PENALTY_CAP: 15
      PRIORITY_CRITICAL_MIN: 75
      PRIORITY_HIGH_MIN: 45
    precision: "2 decimal places, round_half_up; the band comparison uses >= on the rounded score, so exactly 75.00 is CRITICAL and 74.99 is HIGH"

  - name: rwp_committed_dose
    trigger: "POST /work-orders/{id}/rwps; writes RadiologicalWorkPermit.per_worker_dose_mrem, collective_dose_mrem, contingency_dose_mrem, committed_dose_mrem and alara_review_required"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED. The per-worker figure is rounded to 2 dp FIRST
      # and the rounded value is then multiplied by worker_count. Multiplying the
      # unrounded per-worker figure and rounding the product afterwards is a
      # DIFFERENT, WRONG answer for most inputs.
      per_worker_raw     = RadArea.dose_rate_mrem_per_hr
                           * RadiologicalWorkPermit.planned_duration_hours
                           * (1 - RadiologicalWorkPermit.shielding_factor)
      per_worker_dose_mrem = round_half_up(per_worker_raw, 2)

      collective_dose_mrem = round_half_up(per_worker_dose_mrem * RadiologicalWorkPermit.worker_count, 2)
      contingency_dose_mrem = round_half_up(collective_dose_mrem * DOSE_CONTINGENCY_PCT, 2)
      committed_dose_mrem  = round_half_up(collective_dose_mrem + contingency_dose_mrem, 2)

      # The ALARA gate reads the PRE-contingency collective figure, never the
      # post-contingency committed figure.
      alara_review_required = collective_dose_mrem >= ALARA_REVIEW_THRESHOLD_MREM
    input_set: "One RadiologicalWorkPermit draft plus the RadArea named by its rad_area_id. dose_rate_mrem_per_hr is read at draft time and is NOT re-read if the RadArea is later edited."
    constants:
      DOSE_CONTINGENCY_PCT: 0.20
      ALARA_REVIEW_THRESHOLD_MREM: 300
    precision: "2 decimal places, round_half_up, applied at each of the four pinned steps"

  - name: outage_dose_ledger
    trigger: "every DoseTransaction append — POST /rwps/{id}/approve, POST /rwps/{id}/close, POST /rwps/{id}/void, and the WORK_ORDER_DEFERRED cascade of POST /work-orders/{id}/defer and POST /emergent-items/{id}/dispose; writes Outage.dose_committed_mrem and Outage.dose_budget_remaining_mrem"
    algorithm: projection
    formula: |
      committed = 0.00
      for txn in DoseTransaction rows whose rwp_id belongs to a RadiologicalWorkPermit
                 with outage_id == Outage.id, replayed in ascending DoseTransaction.created_at
                 order (ties broken by ascending created_at only — never by id):
          if txn.direction == COMMIT:  committed = committed + txn.amount_mrem
          if txn.direction == RELEASE: committed = committed - txn.amount_mrem

      Outage.dose_committed_mrem      = round_half_up(committed, 2)
      Outage.dose_budget_remaining_mrem = round_half_up(Outage.dose_budget_total_mrem - Outage.dose_committed_mrem, 2)
    input_set: "Every DoseTransaction row reachable from the outage through RadiologicalWorkPermit.rwp_id, with no status filter — the ledger is append-only and a VOIDED permit's rows stay in the replay. RadiologicalWorkPermit rows that never reached APPROVED contribute nothing because no COMMIT row was ever written for them."
    constants: {}
    precision: "2 decimal places, round_half_up; the running accumulator is Decimal throughout, rounded once at the end"

  - name: outage_alara_posture
    trigger: "immediately after every outage_dose_ledger recompute; writes Outage.alara_posture and drives the RadiologicalWorkPermit DRAFT <-> HELD_FOR_ALARA cascade"
    algorithm: threshold
    formula: |
      remaining = Outage.dose_budget_remaining_mrem
      ratio     = remaining / Outage.dose_budget_total_mrem      # unrounded Decimal division

      alara_posture = SUSPENDED  if remaining <= 0
                      RESTRICTED if ratio <= ALARA_RESTRICTED_RATIO
                      NORMAL     otherwise

      # Cascade, applied in the same request:
      #   NORMAL -> {RESTRICTED, SUSPENDED}: every DRAFT permit of the outage whose
      #     committed_dose_mrem > ALARA_RESTRICTED_HOLD_MREM moves to HELD_FOR_ALARA
      #     (ascending created_at).
      #   {RESTRICTED, SUSPENDED} -> NORMAL: every HELD_FOR_ALARA permit of the
      #     outage moves back to DRAFT (ascending created_at).
    input_set: "The two Outage dose fields only. The comparison is on the UNROUNDED ratio: a remaining/total of 250/1000 is exactly 0.25 and IS RESTRICTED, while 251/1001 is 0.2507... and is NORMAL."
    constants:
      ALARA_RESTRICTED_RATIO: 0.25
      ALARA_RESTRICTED_HOLD_MREM: 200
    precision: "ratio compared as an unrounded Decimal quotient; do not round the ratio to 2 dp before comparing"

  - name: outage_scope_cost_rollup
    trigger: "POST /work-orders/{id}/approve-scope, POST /work-orders/{id}/return-to-planning, POST /work-orders/{id}/defer, POST /outages/{id}/lock-scope, and step 4 of the POST /emergent-items/{id}/dispose APPROVED cascade; writes Outage.approved_scope_cost_usd, Outage.scope_contingency_usd and Outage.total_scope_cost_usd"
    algorithm: tiered_pricing
    formula: |
      approved_scope_cost_usd = round_half_up(
          sum of WorkOrder.estimated_cost_usd over WorkOrder rows with
          outage_id == Outage.id and status IN {APPROVED, EXECUTING, COMPLETE}, 2)

      # TIER SELECTION IS PINNED TO THE BASE, NOT THE TOTAL. Choosing the tier from
      # approved_scope_cost_usd + scope_contingency_usd is a different, wrong answer
      # whenever the contingency pushes the base across a tier boundary.
      rate = 0.08  if approved_scope_cost_usd <  SCOPE_TIER_1_CEILING
             0.12  if approved_scope_cost_usd <  SCOPE_TIER_2_CEILING
             0.15  otherwise

      scope_contingency_usd = round_half_up(approved_scope_cost_usd * rate, 2)
      total_scope_cost_usd  = round_half_up(approved_scope_cost_usd + scope_contingency_usd, 2)
    input_set: "WorkOrder rows of this outage in status APPROVED, EXECUTING or COMPLETE. SCOPED, PLANNED and DEFERRED rows are excluded, so deferring an approved work order lowers the base and can drop the rate a whole tier."
    constants:
      SCOPE_TIER_1_CEILING: 5000000
      SCOPE_TIER_2_CEILING: 20000000
      SCOPE_TIER_1_RATE: 0.08
      SCOPE_TIER_2_RATE: 0.12
      SCOPE_TIER_3_RATE: 0.15
    precision: "2 decimal places, round_half_up; the rate is a single flat rate applied to the whole base, not a marginal rate applied per band"

  - name: outage_critical_path
    trigger: "POST /outages/{id}/schedule-activities, POST /schedule-activities/{id}/set-predecessor, POST /schedule-activities/{id}/complete, POST /work-orders/{id}/defer, POST /outages/{id}/lock-scope, and steps 4 and 8 of the POST /emergent-items/{id}/dispose cascade; writes ScheduleActivity.path_length_hours, ScheduleActivity.risk_adjusted_path_length_hours, ScheduleActivity.is_critical_path, Outage.projected_duration_hours, Outage.risk_adjusted_duration_hours and Outage.critical_path_activity_id"
    algorithm: topological
    formula: |
      # Input set: ScheduleActivity rows with outage_id == Outage.id and
      # execution_status != CANCELLED. A CANCELLED row is invisible to the walk, so
      # a successor whose predecessor was cancelled is treated as a ROOT for the
      # length walk (its constraint_status stays BLOCKED regardless — the two
      # dimensions are independent).
      def risk_factor(a):
          if a.work_order_id IS NULL: return UNLINKED_CONTINGENCY_PCT
          return CONTINGENCY_BY_PRIORITY[WorkOrder(a.work_order_id).priority]

      # Walk in topological order over the predecessor_activity_id edges. Ties in
      # the walk order are resolved by ascending created_at.
      for a in topological_order(input_set):
          pred = the row in input_set whose id == a.predecessor_activity_id, else NONE
          base_len  = 0.00 if pred is NONE else pred.path_length_hours
          base_risk = 0.00 if pred is NONE else pred.risk_adjusted_path_length_hours

          a.path_length_hours = round_half_up(base_len + a.planned_duration_hours, 2)
          a.risk_adjusted_path_length_hours = round_half_up(
              base_risk + a.planned_duration_hours * (1 + risk_factor(a)), 2)

      Outage.projected_duration_hours      = max path_length_hours over input_set, else 0.00
      Outage.risk_adjusted_duration_hours  = max risk_adjusted_path_length_hours over input_set, else 0.00

      # Selector for critical_path_activity_id — eligibility: input_set;
      # ranking: descending path_length_hours; tie-break: ascending created_at;
      # empty-set fallback: null. Activity ids never decide the winner.
      Outage.critical_path_activity_id = the winner's id, or null when input_set is empty

      # is_critical_path is true for the winner and for every ancestor reached by
      # following predecessor_activity_id from the winner back to a root; false for
      # every other row in input_set and for every CANCELLED row.
    input_set: "ScheduleActivity rows with outage_id == Outage.id and execution_status IN {NOT_STARTED, IN_PROGRESS, COMPLETE}. planned_duration_hours is always what is consumed — started_at/completed_at never enter the arithmetic, so completing an activity leaves projected_duration_hours unchanged."
    constants:
      CONTINGENCY_BY_PRIORITY: { CRITICAL: 0.25, HIGH: 0.15, DISCRETIONARY: 0.05 }
      UNLINKED_CONTINGENCY_PCT: 0.10
    precision: "2 decimal places, round_half_up, applied per activity at each hop of the walk (not once at the end) — the risk-adjusted chain therefore accumulates rounded hop values"

  - name: outage_schedule_posture
    trigger: "immediately after every outage_critical_path recompute; writes Outage.schedule_posture. Also forced to RECOVERY_REQUIRED, bypassing this formula, by a StartupTest transition into FAILED."
    algorithm: threshold
    formula: |
      target    = Outage.duration_target_hours
      projected = Outage.projected_duration_hours

      schedule_posture = ON_TRACK          if projected <= target
                         AT_RISK           if projected <= round_half_up(target * SCHEDULE_AT_RISK_FACTOR, 2)
                         RECOVERY_REQUIRED otherwise
    input_set: "The two Outage duration fields only. Boundary semantics: projected exactly equal to target is ON_TRACK; projected exactly equal to target * 1.10 is AT_RISK."
    constants:
      SCHEDULE_AT_RISK_FACTOR: 1.10
    precision: "2 decimal places, round_half_up on the AT_RISK ceiling before comparison"

  - name: outage_emergent_hours_rollup
    trigger: "step 4 of the POST /emergent-items/{id}/dispose APPROVED cascade; writes Outage.approved_emergent_hours"
    algorithm: aggregation
    formula: |
      Outage.approved_emergent_hours = round_half_up(
          sum of EmergentWorkItem.estimated_hours over EmergentWorkItem rows whose
          discovered_from_work_order_id points at a WorkOrder with outage_id == Outage.id
          and whose status == APPROVED, 2)
    input_set: "EmergentWorkItem rows in status APPROVED only. REPORTED, REJECTED and ABSORBED rows are excluded — in particular an ABSORBED item lengthens an existing activity but never enters approved_emergent_hours, which is what makes the adjusted performance variant diverge from the gross one."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: outage_badging_rollup
    trigger: "POST /supplemental-workers/{id}/badge; writes Outage.badged_worker_count"
    algorithm: aggregation
    formula: |
      Outage.badged_worker_count = count of SupplementalWorker rows with
          outage_id == Outage.id and status == BADGED
    input_set: "SupplementalWorker rows in status BADGED only. REQUESTED, SCREENING, BADGE_READY and DENIED rows are excluded."
    constants: {}
    precision: "integer count"

  - name: core_load_reactivity_margin
    trigger: "POST /outages/{id}/core-load-patterns; writes CoreLoadPattern.reactivity_margin_pcm"
    algorithm: threshold
    formula: |
      reactivity_margin_pcm = round_half_up(
            BASE_SHUTDOWN_MARGIN_PCM
          + FRESH_ASSEMBLY_WORTH_PCM * CoreLoadPattern.fresh_assembly_count
          - CYCLE_BURNUP_PENALTY_PCM_PER_GWD * (CoreLoadPattern.cycle_length_mwd_mtu / 1000), 2)

      # The margin is a stored computed field; the acceptance gate lives in §1.4
      # (ERR_SHUTDOWN_MARGIN_INSUFFICIENT) and rejects the create outright when
      # reactivity_margin_pcm < MIN_SHUTDOWN_MARGIN_PCM.
    input_set: "One CoreLoadPattern draft's own fields. discharge_assembly_count does not enter the margin arithmetic."
    constants:
      BASE_SHUTDOWN_MARGIN_PCM: 800
      FRESH_ASSEMBLY_WORTH_PCM: 12
      CYCLE_BURNUP_PENALTY_PCM_PER_GWD: 15
      MIN_SHUTDOWN_MARGIN_PCM: 1000
    precision: "2 decimal places, round_half_up; the burnup term divides by 1000 before the penalty multiplier is applied"

  - name: pool_cell_ledger
    trigger: "POST /pool-cell-reservations, POST /pool-cell-reservations/{id}/consume, POST /pool-cell-reservations/{id}/release; writes SpentFuelPool.cells_occupied, cells_reserved, cells_available and protected_cells_available"
    algorithm: aggregation
    formula: |
      cells_occupied = SpentFuelPool.cells_baseline_occupied
                       + sum of PoolCellReservation.cells_requested over rows with
                         spent_fuel_pool_id == SpentFuelPool.id and status == CONSUMED

      cells_reserved = sum of PoolCellReservation.cells_requested over rows with
                         spent_fuel_pool_id == SpentFuelPool.id and status == RESERVED

      cells_available = SpentFuelPool.cells_total - cells_occupied - cells_reserved

      # May go negative when the protected block is legitimately drawn down by a
      # NOMINAL reservation; it is a headroom figure, not a count of cells.
      protected_cells_available = cells_available - SpentFuelPool.full_core_offload_reserve_cells
    input_set: "PoolCellReservation rows in status RESERVED and CONSUMED. RELEASED rows are excluded entirely, which is what makes reserve-then-release an exact compensation."
    constants: {}
    precision: "integer cell counts"

  - name: pool_cell_admission
    trigger: "POST /pool-cell-reservations, evaluated before the reservation row is written; decides ERR_POOL_CAPACITY_EXCEEDED"
    algorithm: threshold
    formula: |
      availability_variant = FULL_CORE_PROTECTED if purpose IN {DISCHARGE, FRESH_STAGING}
                             NOMINAL              if purpose == CONTINGENCY

      headroom = SpentFuelPool.protected_cells_available  if availability_variant == FULL_CORE_PROTECTED
                 SpentFuelPool.cells_available            if availability_variant == NOMINAL

      admitted = cells_requested <= headroom       # exactly equal is admitted
    input_set: "The requested cells_requested plus the two headroom fields the pool_cell_ledger last wrote. No other reservation is consulted directly."
    constants: {}
    precision: "integer comparison, inclusive upper bound (<=)"
    variants:
      - name: full_core_protected
        when: "purpose IN {DISCHARGE, FRESH_STAGING} — a planned, long-dwell occupancy"
        difference: "Admits against protected_cells_available, i.e. cells_available minus full_core_offload_reserve_cells. A planned occupancy may never encroach on the block held open for an unplanned full-core offload."
      - name: nominal
        when: "purpose == CONTINGENCY — precisely the unplanned condition the reserve exists to absorb"
        difference: "Admits against cells_available, so the whole pool including the full-core-offload reserve is fair game. For identical pool state and identical cells_requested this variant admits requests the FULL_CORE_PROTECTED variant rejects; the delta is exactly full_core_offload_reserve_cells."

  - name: rad_area_window_occupancy
    trigger: "POST /rwps/{id}/approve; decides ERR_RAD_AREA_WINDOW_CONFLICT"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval, buffer on the trailing edge only.
      def window(p):   # p is a RadiologicalWorkPermit, area = RadArea(p.rad_area_id)
          start = p.planned_start_offset_hours
          end   = p.planned_start_offset_hours + p.planned_duration_hours + area.survey_buffer_hours
          return [start, end)          # start INCLUSIVE, end EXCLUSIVE

      conflict = any existing RadiologicalWorkPermit q with
                     q.rad_area_id == p.rad_area_id and q.status == APPROVED and q.id != p.id
                 such that window(p) intersects window(q)

      # Adjacency is explicitly ALLOWED: a permit starting exactly at another
      # permit's buffered end offset does not conflict.
    input_set: "RadiologicalWorkPermit rows sharing the incoming permit's rad_area_id with status == APPROVED. DRAFT, HELD_FOR_ALARA, CLOSED and VOIDED rows never block."
    constants: {}
    precision: "offsets are Decimal hours with 2 decimal places; the buffer is read from the RadArea, so two areas with different survey_buffer_hours give different verdicts for identical permits"

  - name: safety_function_oos_capacity
    trigger: "POST /outages/{id}/schedule-activities when oos_safety_function_id IS NOT NULL; decides ERR_SAFETY_FUNCTION_CAPACITY_EXCEEDED"
    algorithm: interval_merge
    formula: |
      # CLOSED interval — touching endpoints DO conflict. This is the deliberate
      # opposite of rad_area_window_occupancy's half-open semantics.
      def window(a):
          return [a.planned_start_offset_hours,
                  a.planned_start_offset_hours + a.planned_duration_hours]      # BOTH inclusive

      capacity = SafetyFunction.trains_total - SafetyFunction.min_trains_required
                 # stored on the SafetyFunction as max_concurrent_oos_trains

      overlapping = ScheduleActivity rows b with
                        b.oos_safety_function_id == a.oos_safety_function_id
                        and b.execution_status != CANCELLED
                        and b.id != a.id
                        and window(a) intersects window(b)

      distinct_labels = the set of b.oos_train_label over `overlapping`, UNION {a.oos_train_label}

      breach = count(distinct_labels) > capacity
    input_set: "ScheduleActivity rows of ANY outage that name the same oos_safety_function_id and are not CANCELLED — a safety function is a plant asset shared across units, so out-of-service windows aggregate across outages. The aggregate is over DISTINCT oos_train_label values, so two activities taking the SAME train out at overlapping times consume one unit of capacity, not two."
    constants: {}
    precision: "offsets are Decimal hours with 2 decimal places; capacity is an integer count of distinct train labels"

  - name: outage_performance_review
    trigger: "POST /outages/{id}/post-outage-review; writes Outage.duration_variance_pct, adjusted_duration_variance_pct, dose_variance_pct, cost_variance_pct, outage_performance_index and adjusted_performance_index"
    algorithm: weighted_scoring
    formula: |
      duration_variance_pct = round_half_up(
          (Outage.actual_duration_hours - Outage.duration_target_hours)
          / Outage.duration_target_hours * 100, 2)

      adjusted_hours = Outage.actual_duration_hours - Outage.approved_emergent_hours
      adjusted_duration_variance_pct = round_half_up(
          (adjusted_hours - Outage.duration_target_hours)
          / Outage.duration_target_hours * 100, 2)

      dose_variance_pct = round_half_up(
          (Outage.dose_committed_mrem - Outage.dose_budget_total_mrem)
          / Outage.dose_budget_total_mrem * 100, 2)

      cost_variance_pct = round_half_up(
          (Outage.actual_cost_usd - Outage.cost_budget_usd)
          / Outage.cost_budget_usd * 100, 2)

      # ONE-SIDED penalty: only overruns cost points. An underrun contributes 0,
      # it does NOT earn credit. Rounding order is pinned: each variance pct is
      # rounded to 2 dp FIRST, each rounded pct is multiplied by its weight, the
      # three products are summed UNROUNDED, and the single subtraction from 100
      # is rounded once at the end.
      def index(dur_pct):
          penalty = WEIGHT_DURATION * max(0, dur_pct)
                  + WEIGHT_DOSE     * max(0, dose_variance_pct)
                  + WEIGHT_COST     * max(0, cost_variance_pct)
          return round_half_up(100 - penalty, 2)

      outage_performance_index   = index(duration_variance_pct)
      adjusted_performance_index = index(adjusted_duration_variance_pct)
    input_set: "The outage's own target/budget fields, the actuals supplied in the request body, Outage.dose_committed_mrem as the dose ledger last left it, and Outage.approved_emergent_hours as outage_emergent_hours_rollup last left it."
    constants:
      WEIGHT_DURATION: 0.5
      WEIGHT_DOSE: 0.3
      WEIGHT_COST: 0.2
    precision: "2 decimal places, round_half_up, at the pinned points above"
    variants:
      - name: gross
        when: "outage_performance_index — the headline number reported to the fleet"
        difference: "Uses duration_variance_pct, computed from raw actual_duration_hours. Every hour spent on approved emergent work counts against the crew."
      - name: emergent_adjusted
        when: "adjusted_performance_index — the number used for crew performance review"
        difference: "Uses adjusted_duration_variance_pct, computed from actual_duration_hours minus approved_emergent_hours. Hours the crew could not have foreseen are excluded, so for identical stored data the two indices differ whenever approved_emergent_hours > 0 — and the sign of the duration term can flip from overrun to underrun, zeroing the duration penalty entirely."

  - name: startup_test_reactivity_deviation
    trigger: "POST /startup-tests/{id}/satisfy; writes StartupTest.measured_reactivity_pcm and StartupTest.reactivity_deviation_pcm, and decides whether the test lands in SATISFIED or FAILED"
    algorithm: threshold
    formula: |
      reactivity_deviation_pcm = round_half_up(
          absolute_value(StartupTest.measured_reactivity_pcm
                         - StartupTest.predicted_reactivity_pcm), 2)

      # The deviation is UNSIGNED: a core 150 pcm more reactive than predicted and a
      # core 150 pcm less reactive than predicted are equally unacceptable.
      outcome = SATISFIED if reactivity_deviation_pcm <= REACTIVITY_TOLERANCE_PCM
                FAILED    otherwise

      # A FAILED outcome is a 200 response, not an error: the measurement is
      # recorded and Outage.schedule_posture is forced to RECOVERY_REQUIRED.
    input_set: "One StartupTest row's predicted_reactivity_pcm plus the measured_reactivity_pcm supplied in the request body."
    constants:
      REACTIVITY_TOLERANCE_PCM: 100
    precision: "2 decimal places, round_half_up; the tolerance comparison is inclusive, so a deviation of exactly 100.00 pcm is SATISFIED and 100.01 pcm is FAILED"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules — evaluated in ascending `priority`. The FIRST rule
# whose condition is violated determines the response; no later rule is
# evaluated. Domain ordering inside the business block is: nuclear/radiological
# safety first, then referential graph integrity, then temporal windows, then
# administrative constraints, then fiscal budgets last.
# ---------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the called endpoint's `roles:` list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id embedded in the request path resolves to a stored row, validated left-to-right"
    error_id: "ERR_OUTAGE_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_SCHEDULE_ACTIVITY_NOT_FOUND | ERR_CORE_LOAD_PATTERN_NOT_FOUND | ERR_POOL_RESERVATION_NOT_FOUND | ERR_SPENT_FUEL_POOL_NOT_FOUND | ERR_WORKER_NOT_FOUND | ERR_RWP_NOT_FOUND | ERR_EMERGENT_ITEM_NOT_FOUND | ERR_STARTUP_TEST_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 4
    category: existence
    check: "Request body conforms to the endpoint's `input:` schema — every required field present, every value the declared type, every enum member a declared constraint value, every Decimal within its stated bound (worker_count >= 1, cells_requested >= 1, shielding_factor in [0, 1), planned_duration_hours > 0, sequence_index >= 1, non-negative money and hours). Unknown fields are rejected."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request BODY resolves to a stored row (safety_function_id, rad_area_id, spent_fuel_pool_id, outage_id, work_order_id, predecessor_activity_id)"
    error_id: "ERR_SAFETY_FUNCTION_NOT_FOUND | ERR_RAD_AREA_NOT_FOUND | ERR_SPENT_FUEL_POOL_NOT_FOUND | ERR_OUTAGE_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_SCHEDULE_ACTIVITY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /outages/{id}/work-orders, POST /outages/{id}/schedule-activities, POST /schedule-activities/{id}/set-predecessor, POST /pool-cell-reservations, POST /work-orders/{id}/rwps"

  - priority: 6
    category: state
    check: "The TARGET resource named in the path is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_OUTAGE_STATE_INVALID | ERR_WORK_ORDER_STATE_INVALID | ERR_ACTIVITY_STATE_INVALID | ERR_CORE_LOAD_PATTERN_STATE_INVALID | ERR_POOL_RESERVATION_STATE_INVALID | ERR_WORKER_STATE_INVALID | ERR_RWP_STATE_INVALID | ERR_EMERGENT_ITEM_STATE_INVALID | ERR_STARTUP_TEST_STATE_INVALID"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 7
    category: state
    check: "Cross-entity state guards: the owning Outage is in an admissible status for the operation; a RadiologicalWorkPermit may only be approved when its WorkOrder.status == APPROVED (ERR_WORK_ORDER_NOT_APPROVED); a DISCHARGE PoolCellReservation may only be created when the outage owns a CoreLoadPattern with status == APPROVED (ERR_CORE_LOAD_PATTERN_NOT_APPROVED); a ScheduleActivity may only be started when its predecessor has left constraint_status BLOCKED (ERR_PREDECESSOR_NOT_COMPLETE); an outage may only leave EXECUTION when no WorkOrder of the outage is in {SCOPED, PLANNED, APPROVED, EXECUTING} (ERR_OPEN_WORK_ORDERS_REMAIN) and at least one StartupTest exists (ERR_STARTUP_SEQUENCE_EMPTY); an outage may only leave SCOPE_LOCKED when badged_worker_count >= required_badged_workers (ERR_BADGED_WORKFORCE_INSUFFICIENT)"
    error_id: "ERR_OUTAGE_STATE_INVALID | ERR_WORK_ORDER_NOT_APPROVED | ERR_CORE_LOAD_PATTERN_NOT_APPROVED | ERR_PREDECESSOR_NOT_COMPLETE | ERR_OPEN_WORK_ORDERS_REMAIN | ERR_STARTUP_SEQUENCE_EMPTY | ERR_BADGED_WORKFORCE_INSUFFICIENT"
    http_status: 409
    applies_to: "POST /rwps/{id}/approve, POST /pool-cell-reservations, POST /schedule-activities/{id}/start, POST /outages/{id}/authorize-startup, POST /outages/{id}/commence-execution, POST /outages/{id}/lock-scope, and every action endpoint that declares an Outage-status precondition in §1.2"

  - priority: 8
    category: state
    check: "Optimistic concurrency: the submitted expected_<parent>_version equals the stored parent version (§1.2.1)"
    error_id: "ERR_OUTAGE_VERSION_STALE | ERR_POOL_VERSION_STALE"
    http_status: 412
    applies_to: "POST /outages/{id}/core-load-patterns, POST /pool-cell-reservations"

  - priority: 9
    category: business_safety
    check: "A CoreLoadPattern's computed reactivity_margin_pcm is at least MIN_SHUTDOWN_MARGIN_PCM (1000). A core that cannot be held subcritical is never persisted."
    error_id: ERR_SHUTDOWN_MARGIN_INSUFFICIENT
    http_status: 422
    applies_to: "POST /outages/{id}/core-load-patterns"

  - priority: 10
    category: business_safety
    check: "The owning Outage.alara_posture is not SUSPENDED — a fully consumed dose budget blocks every further dose commitment"
    error_id: ERR_ALARA_POSTURE_SUSPENDED
    http_status: 409
    applies_to: "POST /rwps/{id}/approve"

  - priority: 11
    category: business_safety
    check: "When RadiologicalWorkPermit.alara_review_required == true the approve request supplies a non-empty alara_review_reference"
    error_id: ERR_ALARA_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /rwps/{id}/approve"

  - priority: 12
    category: business_safety
    check: "When StartupTest.hold_point_type == REGULATORY the satisfy request supplies a non-empty nrc_release_reference"
    error_id: ERR_REGULATORY_HOLD_POINT_NOT_RELEASED
    http_status: 422
    applies_to: "POST /startup-tests/{id}/satisfy"

  - priority: 13
    category: business_safety
    check: "Aggregate shutdown-safety-function protection (calculations.safety_function_oos_capacity): over the CLOSED window [planned_start_offset_hours, planned_start_offset_hours + planned_duration_hours], the count of DISTINCT oos_train_label values among all non-CANCELLED ScheduleActivity rows naming the same oos_safety_function_id — including the incoming row — does not exceed SafetyFunction.max_concurrent_oos_trains"
    error_id: ERR_SAFETY_FUNCTION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /outages/{id}/schedule-activities when oos_safety_function_id is supplied"

  - priority: 14
    category: business_referential
    check: "A supplied predecessor_activity_id names a ScheduleActivity whose outage_id equals the outage in the path (for POST /schedule-activities/{id}/set-predecessor: equals the re-sequenced activity's own outage_id), and a supplied work_order_id names a WorkOrder whose outage_id equals the outage in the path"
    error_id: ERR_PREDECESSOR_OUTAGE_MISMATCH
    http_status: 422
    applies_to: "POST /outages/{id}/schedule-activities, POST /schedule-activities/{id}/set-predecessor"

  - priority: 15
    category: business_temporal
    check: "Radiological area occupancy (calculations.rad_area_window_occupancy): the incoming permit's HALF-OPEN window [planned_start_offset_hours, planned_start_offset_hours + planned_duration_hours + RadArea.survey_buffer_hours) does not intersect that of any other APPROVED RadiologicalWorkPermit in the same rad_area_id. Exact adjacency (new start == existing buffered end) is admitted."
    error_id: ERR_RAD_AREA_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /rwps/{id}/approve"

  - priority: 16
    category: business_referential
    check: "Following predecessor_activity_id from the incoming ScheduleActivity must terminate at a root; a chain that revisits an already-seen activity is rejected. At creation the chain is a DAG by construction, so this rule is decided at POST /schedule-activities/{id}/set-predecessor: naming the activity itself, or any activity whose own predecessor chain already reaches the activity, closes a loop and is rejected"
    error_id: ERR_ACTIVITY_CYCLE
    http_status: 422
    applies_to: "POST /outages/{id}/schedule-activities, POST /schedule-activities/{id}/set-predecessor"

  - priority: 17
    category: business_constraint
    check: "Every StartupTest of the same outage with a strictly lower sequence_index already has status == SATISFIED"
    error_id: ERR_STARTUP_SEQUENCE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /startup-tests/{id}/satisfy"

  - priority: 18
    category: business_constraint
    check: "sequence_index is unique among the StartupTest rows of the same outage_id"
    error_id: ERR_STARTUP_SEQUENCE_DUPLICATE
    http_status: 409
    applies_to: "POST /outages/{id}/startup-tests"

  - priority: 19
    category: business_constraint
    check: "The submitted badge_number is not already held by another SupplementalWorker with the same outage_id and status == BADGED"
    error_id: ERR_BADGE_NUMBER_TAKEN
    http_status: 409
    applies_to: "POST /supplemental-workers/{id}/badge"

  - priority: 20
    category: business_constraint
    check: "Segregation of duties on X-User-ID: the user approving a CoreLoadPattern is not the user who created it, and the user satisfying a REGULATORY hold-point StartupTest is not the user who created it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /core-load-patterns/{id}/approve, POST /startup-tests/{id}/satisfy"

  - priority: 21
    category: business_constraint
    check: "Approving the scope of a DISCRETIONARY WorkOrder requires Outage.schedule_posture == ON_TRACK; once the outage is AT_RISK or RECOVERY_REQUIRED the discretionary scope window is closed"
    error_id: ERR_SCOPE_FROZEN
    http_status: 409
    applies_to: "POST /work-orders/{id}/approve-scope"

  - priority: 22
    category: business_fiscal
    check: "Spent fuel pool admission (calculations.pool_cell_admission): cells_requested <= the headroom selected by the reservation's availability_variant — protected_cells_available for FULL_CORE_PROTECTED, cells_available for NOMINAL. Exact equality is admitted."
    error_id: ERR_POOL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /pool-cell-reservations"

  - priority: 23
    category: business_fiscal
    check: "RadiologicalWorkPermit.committed_dose_mrem <= Outage.dose_budget_remaining_mrem. Exact equality is admitted and drives alara_posture to SUSPENDED."
    error_id: ERR_DOSE_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /rwps/{id}/approve"

# ---------------------------------------------------------------------------
# §1.5 API Endpoints
# api_prefix is "" — every collection is a flat top-level segment. Every first
# path parameter is spelled literally `{id}`.
# Read endpoints are open to all nine roles; write endpoints are narrowed.
# ---------------------------------------------------------------------------
endpoints:

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which stamps created_at/updated_at, Outage.scope_locked_at, ScheduleActivity.started_at and ScheduleActivity.completed_at. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [StationAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["subsequent server-stamped timestamps use the supplied instant"]

  # --- plant configuration --------------------------------------------------
  - method: POST
    path: "/spent-fuel-pools"
    description: "Registers a spent fuel pool with its total cell count, baseline occupancy and the block of cells held open for an unplanned full-core offload."
    roles: [StationAdmin]
    code: 201
    input: [station_unit, cells_total, cells_baseline_occupied, full_core_offload_reserve_cells]
    output: SpentFuelPool
    side_effects: ["initialises cells_occupied to cells_baseline_occupied, cells_reserved to 0, and computes cells_available and protected_cells_available (calculations.pool_cell_ledger)"]

  - method: GET
    path: "/spent-fuel-pools/{id}"
    description: "Reads one spent fuel pool including its live occupancy ledger and both headroom figures."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: SpentFuelPool
    side_effects: []

  - method: POST
    path: "/rad-areas"
    description: "Registers a radiological area with its dose rate and the post-work survey buffer appended to every permit window in the area."
    roles: [StationAdmin]
    code: 201
    input: [station_unit, area_code, dose_rate_mrem_per_hr, occupancy_limit_workers, survey_buffer_hours]
    output: RadArea
    side_effects: []

  - method: GET
    path: "/rad-areas/{id}"
    description: "Reads one radiological area."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: RadArea
    side_effects: []

  - method: POST
    path: "/safety-functions"
    description: "Registers a shutdown safety function with its train count and the minimum number of trains that must stay in service."
    roles: [StationAdmin]
    code: 201
    input: [station_unit, function_code, trains_total, min_trains_required]
    output: SafetyFunction
    side_effects: ["computes max_concurrent_oos_trains as trains_total - min_trains_required"]

  - method: GET
    path: "/safety-functions/{id}"
    description: "Reads one shutdown safety function including its computed out-of-service capacity."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: SafetyFunction
    side_effects: []

  # --- outage ---------------------------------------------------------------
  - method: POST
    path: "/outages"
    description: "Opens a refueling outage in PLANNING with its duration, dose and cost targets."
    roles: [StationAdmin, OutageDirector]
    code: 201
    input: ["station_unit", "designation", "duration_target_hours", "dose_budget_total_mrem", "cost_budget_usd", "scope_freeze_at", "required_training_modules?", "required_badged_workers?"]
    output: Outage
    side_effects: ["initialises status PLANNING, schedule_posture ON_TRACK, alara_posture NORMAL, all ledger and rollup fields to 0.00, projected_duration_hours 0.00, critical_path_activity_id null, badged_worker_count 0; stores X-User-ID as created_by_user_id"]

  - method: GET
    path: "/outages/{id}"
    description: "Reads one outage including every computed posture, ledger, rollup, critical-path and post-outage-performance field."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: Outage
    side_effects: []

  - method: POST
    path: "/outages/{id}/lock-scope"
    description: "Freezes outage scope: PLANNING -> SCOPE_LOCKED, auto-deferring every work order still in SCOPED."
    roles: [OutageDirector]
    code: 200
    input: []
    output: Outage
    side_effects: ["stamps scope_locked_at", "cascades SCOPED work orders to DEFERRED with deferral_reason SCOPE_LOCK_AUTO_DEFERRAL, cancelling their NOT_STARTED activities and voiding their DRAFT/HELD_FOR_ALARA permits", "recomputes outage_scope_cost_rollup, outage_critical_path and outage_schedule_posture"]

  - method: POST
    path: "/outages/{id}/commence-execution"
    description: "Breaker-open: SCOPE_LOCKED -> EXECUTION once the badged temporary workforce has reached required_badged_workers."
    roles: [OutageDirector]
    code: 200
    input: []
    output: Outage
    side_effects: ["schedule activities become startable"]

  - method: POST
    path: "/outages/{id}/authorize-startup"
    description: "EXECUTION -> STARTUP once no work order is still open and every out-of-service safety function has been restored."
    roles: [OutageDirector]
    code: 200
    input: []
    output: Outage
    side_effects: ["startup tests become satisfiable in sequence_index order"]

  - method: POST
    path: "/outages/{id}/post-outage-review"
    description: "ONLINE -> REVIEWED, recording actuals and computing both the gross and the emergent-adjusted performance indices."
    roles: [OutageDirector]
    code: 200
    input: ["actual_duration_hours", "actual_cost_usd", "review_notes?"]
    output: Outage
    side_effects: ["computes duration_variance_pct, adjusted_duration_variance_pct, dose_variance_pct, cost_variance_pct, outage_performance_index and adjusted_performance_index (calculations.outage_performance_review)"]

  # --- work orders ----------------------------------------------------------
  - method: POST
    path: "/outages/{id}/work-orders"
    description: "Adds a work order to the outage scope in SCOPED and scores its priority against the outage's duration target."
    roles: [OutagePlanner, OutageDirector]
    code: 201
    input: ["wo_type", "title", "estimated_hours", "estimated_cost_usd", "estimated_dose_mrem", "regulatory_commitment?", "safety_function_id?", "requires_rad_work?"]
    output: WorkOrder
    side_effects: ["computes priority_score and priority (calculations.work_order_priority_score)", "sets origin to PLANNED_SCOPE"]

  - method: GET
    path: "/work-orders/{id}"
    description: "Reads one work order including its computed priority_score and priority."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "Lists work orders, filterable by outage, safety function, status, priority and origin. Reverse-reachability channel for WorkOrder.outage_id and WorkOrder.safety_function_id, and the only discovery channel for work orders minted by the emergent-item cascade."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: ["outage_id?", "safety_function_id?", "status?", "priority?", "origin?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/plan"
    description: "SCOPED -> PLANNED."
    roles: [OutagePlanner]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/approve-scope"
    description: "PLANNED -> APPROVED. A DISCRETIONARY work order is admitted only while the outage is ON_TRACK."
    roles: [OutageDirector]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["recomputes Outage.approved_scope_cost_usd, scope_contingency_usd and total_scope_cost_usd (calculations.outage_scope_cost_rollup)"]

  - method: POST
    path: "/work-orders/{id}/return-to-planning"
    description: "Reopens a work order for revision: APPROVED -> PLANNED, or reinstates a deferred one: DEFERRED -> PLANNED."
    roles: [OutageDirector]
    code: 200
    input: [return_reason]
    output: WorkOrder
    side_effects: ["on APPROVED -> PLANNED recomputes outage_scope_cost_rollup", "on DEFERRED -> PLANNED clears deferral_reason to null"]

  - method: POST
    path: "/work-orders/{id}/defer"
    description: "Drops a work order from the outage: PLANNED -> DEFERRED or APPROVED -> DEFERRED, cancelling its not-started activities and voiding its permits."
    roles: [OutageDirector]
    code: 200
    input: [deferral_reason]
    output: WorkOrder
    side_effects: ["cancels NOT_STARTED activities in ascending created_at order", "voids DRAFT/HELD_FOR_ALARA/APPROVED permits; each formerly APPROVED permit appends a RELEASE DoseTransaction with reason WORK_ORDER_DEFERRED", "recomputes outage_dose_ledger, outage_alara_posture, outage_scope_cost_rollup, outage_critical_path and outage_schedule_posture"]

  # --- schedule -------------------------------------------------------------
  - method: POST
    path: "/outages/{id}/schedule-activities"
    description: "Adds a schedule activity to the outage, optionally linked to a work order, optionally chained behind a predecessor, and optionally taking one train of a shutdown safety function out of service."
    roles: [OutagePlanner]
    code: 201
    input: ["label", "planned_start_offset_hours", "planned_duration_hours", "work_order_id?", "predecessor_activity_id?", "oos_safety_function_id?", "oos_train_label?"]
    output: ScheduleActivity
    side_effects: ["evaluates constraint_status once: BLOCKED when a predecessor is supplied whose execution_status != COMPLETE, else CLEAR", "recomputes path_length_hours, risk_adjusted_path_length_hours and is_critical_path across the outage, then Outage.projected_duration_hours, risk_adjusted_duration_hours, critical_path_activity_id and schedule_posture"]

  - method: GET
    path: "/schedule-activities/{id}"
    description: "Reads one schedule activity including both computed path lengths and its critical-path flag."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: ScheduleActivity
    side_effects: []

  - method: GET
    path: "/schedule-activities"
    description: "Lists schedule activities, filterable by outage, work order, predecessor, out-of-service safety function and either state dimension. Reverse-reachability channel for all four ScheduleActivity foreign keys and the only discovery channel for the activity minted by the emergent-item cascade."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: ["outage_id?", "work_order_id?", "predecessor_activity_id?", "oos_safety_function_id?", "execution_status?", "constraint_status?", "limit?", "offset?"]
    output: ScheduleActivity[]
    side_effects: []

  - method: POST
    path: "/schedule-activities/{id}/set-predecessor"
    description: "Re-sequences a NOT_STARTED activity behind a different predecessor, or detaches it when predecessor_activity_id is null. Re-evaluates the activity's constraint gate and the outage critical path. The predecessor chain reachable from the activity must terminate at a root (validations priority 16)."
    roles: [OutagePlanner]
    code: 200
    input: [predecessor_activity_id]
    output: ScheduleActivity
    side_effects: ["sets ScheduleActivity.predecessor_activity_id from the request body (null detaches the activity and makes it a root)", "re-evaluates this activity's constraint_status: CLEAR when the new predecessor is null or its execution_status == COMPLETE, else BLOCKED", "recomputes path_length_hours, risk_adjusted_path_length_hours and is_critical_path across the outage, then Outage.projected_duration_hours, risk_adjusted_duration_hours, critical_path_activity_id and schedule_posture", "increments Outage.version by 1"]

  - method: POST
    path: "/schedule-activities/{id}/start"
    description: "NOT_STARTED -> IN_PROGRESS. Requires constraint_status CLEAR and an outage in EXECUTION."
    roles: [OutagePlanner]
    code: 200
    input: []
    output: ScheduleActivity
    side_effects: ["stamps started_at", "moves a linked APPROVED work order to EXECUTING"]

  - method: POST
    path: "/schedule-activities/{id}/complete"
    description: "IN_PROGRESS -> COMPLETE, releasing successors on the constraint_status dimension."
    roles: [OutagePlanner]
    code: 200
    input: []
    output: ScheduleActivity
    side_effects: ["stamps completed_at", "moves every successor's constraint_status BLOCKED -> CLEAR in ascending created_at order without touching their execution_status", "bubbles a fully finished work order EXECUTING -> COMPLETE", "recomputes outage_critical_path and outage_schedule_posture"]

  # --- fuel reload ----------------------------------------------------------
  - method: POST
    path: "/outages/{id}/core-load-patterns"
    description: "Submits a core loading pattern in DRAFT, superseding the outage's live DRAFT pattern. Guarded by optimistic concurrency on the outage."
    roles: [ReactorEngineer]
    code: 201
    input: [cycle_length_mwd_mtu, fresh_assembly_count, discharge_assembly_count, expected_outage_version]
    output: CoreLoadPattern
    side_effects: ["computes reactivity_margin_pcm (calculations.core_load_reactivity_margin) and rejects the create when it falls below MIN_SHUTDOWN_MARGIN_PCM", "moves any existing DRAFT pattern of the outage to SUPERSEDED", "stores X-User-ID as created_by_user_id", "increments Outage.version by 1"]

  - method: GET
    path: "/core-load-patterns/{id}"
    description: "Reads one core loading pattern including its computed reactivity margin."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: CoreLoadPattern
    side_effects: []

  - method: GET
    path: "/outages/{id}/core-load-patterns"
    description: "Lists the outage's core loading patterns. Reverse-reachability channel for CoreLoadPattern.outage_id."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CoreLoadPattern[]
    side_effects: []

  - method: POST
    path: "/core-load-patterns/{id}/approve"
    description: "DRAFT -> APPROVED under segregation of duties: the approving X-User-ID must differ from created_by_user_id."
    roles: [OutageDirector, ReactorEngineer]
    code: 200
    input: []
    output: CoreLoadPattern
    side_effects: ["stores X-User-ID as approved_by_user_id"]

  - method: POST
    path: "/pool-cell-reservations"
    description: "Reserves spent fuel pool cells for the outage. The purpose selects which headroom the request is admitted against. Guarded by optimistic concurrency on the pool."
    roles: [ReactorEngineer]
    code: 201
    input: [outage_id, spent_fuel_pool_id, cells_requested, purpose, expected_spent_fuel_pool_version]
    output: PoolCellReservation
    side_effects: ["derives availability_variant from purpose and admits or rejects against the selected headroom (calculations.pool_cell_admission)", "recomputes the pool ledger (calculations.pool_cell_ledger)", "increments SpentFuelPool.version by 1"]

  - method: GET
    path: "/pool-cell-reservations/{id}"
    description: "Reads one pool cell reservation including its derived availability_variant."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: PoolCellReservation
    side_effects: []

  - method: GET
    path: "/pool-cell-reservations"
    description: "Lists pool cell reservations, filterable by outage, pool, purpose and status. Reverse-reachability channel for PoolCellReservation.outage_id and PoolCellReservation.spent_fuel_pool_id."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: ["outage_id?", "spent_fuel_pool_id?", "purpose?", "status?", "limit?", "offset?"]
    output: PoolCellReservation[]
    side_effects: []

  - method: POST
    path: "/pool-cell-reservations/{id}/consume"
    description: "RESERVED -> CONSUMED: reserved cells become occupied cells."
    roles: [ReactorEngineer]
    code: 200
    input: []
    output: PoolCellReservation
    side_effects: ["moves cells_requested from cells_reserved to cells_occupied and recomputes both headroom figures", "increments SpentFuelPool.version by 1"]

  - method: POST
    path: "/pool-cell-reservations/{id}/release"
    description: "RESERVED -> RELEASED: an exact compensation that returns the pool ledger to its pre-reservation values."
    roles: [ReactorEngineer]
    code: 200
    input: [release_reason]
    output: PoolCellReservation
    side_effects: ["drops cells_reserved by cells_requested without touching cells_occupied and recomputes both headroom figures", "increments SpentFuelPool.version by 1"]

  # --- supplemental workforce ----------------------------------------------
  - method: POST
    path: "/outages/{id}/supplemental-workers"
    description: "Requests access authorization for one temporary outage worker, in REQUESTED."
    roles: [ContractorCoordinator]
    code: 201
    input: [full_name, craft, sponsoring_contractor]
    output: SupplementalWorker
    side_effects: ["initialises background_status PENDING, training_status PENDING, training_modules_completed 0, badge_number null"]

  - method: GET
    path: "/supplemental-workers/{id}"
    description: "Reads one supplemental worker including both onboarding branch statuses."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: SupplementalWorker
    side_effects: []

  - method: GET
    path: "/outages/{id}/supplemental-workers"
    description: "Lists the outage's supplemental workers. Reverse-reachability channel for SupplementalWorker.outage_id."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: ["status?", "craft?", "limit?", "offset?"]
    output: SupplementalWorker[]
    side_effects: []

  - method: POST
    path: "/supplemental-workers/{id}/background-result"
    description: "Records the access-authorization background result — branch A of the onboarding fork."
    roles: [AccessAuthority]
    code: 200
    input: [outcome]
    output: SupplementalWorker
    side_effects: ["outcome CLEAR moves the worker to SCREENING and may complete the join", "outcome ADVERSE moves the worker to DENIED and abandons the training branch"]

  - method: POST
    path: "/supplemental-workers/{id}/training-completion"
    description: "Records completed outage training modules — branch B of the onboarding fork."
    roles: [AccessAuthority, ContractorCoordinator]
    code: 200
    input: [modules_completed]
    output: SupplementalWorker
    side_effects: ["recomputes training_status against Outage.required_training_modules and may complete the join to BADGE_READY"]

  - method: POST
    path: "/supplemental-workers/{id}/badge"
    description: "BADGE_READY -> BADGED, issuing a badge number unique among the outage's badged workers."
    roles: [AccessAuthority]
    code: 200
    input: [badge_number]
    output: SupplementalWorker
    side_effects: ["increments Outage.badged_worker_count (calculations.outage_badging_rollup)", "increments Outage.version by 1"]

  # --- radiological work planning ------------------------------------------
  - method: POST
    path: "/work-orders/{id}/rwps"
    description: "Drafts a radiological work permit against a rad area, computing its per-worker, collective, contingency and committed dose figures and its ALARA review flag."
    roles: [RadProtectionPlanner]
    code: 201
    input: [rad_area_id, worker_count, shielding_factor, planned_start_offset_hours, planned_duration_hours]
    output: RadiologicalWorkPermit
    side_effects: ["copies the work order's outage_id onto the permit", "computes per_worker_dose_mrem, collective_dose_mrem, contingency_dose_mrem, committed_dose_mrem and alara_review_required (calculations.rwp_committed_dose)", "no dose is committed to the outage until approval"]

  - method: GET
    path: "/rwps/{id}"
    description: "Reads one radiological work permit including all four dose figures and its ALARA review flag."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: RadiologicalWorkPermit
    side_effects: []

  - method: GET
    path: "/rwps"
    description: "Lists radiological work permits, filterable by outage, work order, rad area and status. Reverse-reachability channel for all three RadiologicalWorkPermit foreign keys."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: ["outage_id?", "work_order_id?", "rad_area_id?", "status?", "limit?", "offset?"]
    output: RadiologicalWorkPermit[]
    side_effects: []

  - method: POST
    path: "/rwps/{id}/approve"
    description: "DRAFT -> APPROVED, committing the permit's dose against the outage budget and re-evaluating the outage's ALARA posture."
    roles: [RadProtectionManager]
    code: 200
    input: ["alara_review_reference?"]
    output: RadiologicalWorkPermit
    side_effects: ["appends a COMMIT DoseTransaction", "recomputes outage_dose_ledger then outage_alara_posture", "moves DRAFT permits over ALARA_RESTRICTED_HOLD_MREM to HELD_FOR_ALARA when the posture leaves NORMAL, in ascending created_at order", "increments Outage.version by 1"]

  - method: POST
    path: "/rwps/{id}/close"
    description: "APPROVED -> CLOSED, reconciling the actual dose against the committed dose."
    roles: [RadProtectionPlanner, RadProtectionManager]
    code: 200
    input: [actual_dose_mrem]
    output: RadiologicalWorkPermit
    side_effects: ["appends a RELEASE row on underrun, a COMMIT row on overrun, and no row at all on an exact match", "recomputes outage_dose_ledger then outage_alara_posture and runs the DRAFT <-> HELD_FOR_ALARA cascade in whichever direction the posture moved", "increments Outage.version by 1"]

  - method: POST
    path: "/rwps/{id}/void"
    description: "Voids a permit from DRAFT, HELD_FOR_ALARA or APPROVED. Voiding an APPROVED permit exactly reverses its dose commitment."
    roles: [RadProtectionManager]
    code: 200
    input: [void_reason]
    output: RadiologicalWorkPermit
    side_effects: ["appends a RELEASE DoseTransaction with reason RWP_VOIDED only when the prior status was APPROVED", "recomputes outage_dose_ledger then outage_alara_posture; a return to NORMAL releases every HELD_FOR_ALARA permit back to DRAFT", "increments Outage.version by 1"]

  - method: GET
    path: "/rwps/{id}/dose-transactions"
    description: "Reads the permit's append-only dose ledger rows in ascending created_at order. Reverse-reachability channel for DoseTransaction.rwp_id and the only discovery channel for cascade-appended ledger rows."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: ["direction?", "limit?", "offset?"]
    output: DoseTransaction[]
    side_effects: []

  # --- emergent work --------------------------------------------------------
  - method: POST
    path: "/work-orders/{id}/emergent-items"
    description: "Reports emergent work discovered while executing a work order, in REPORTED."
    roles: [OutagePlanner, RadProtectionPlanner]
    code: 201
    input: ["description", "estimated_hours", "estimated_cost_usd", "estimated_dose_mrem", "discovered_during_inspection?"]
    output: EmergentWorkItem
    side_effects: ["created_work_order_id starts null; nothing on the outage changes until disposition"]

  - method: GET
    path: "/emergent-items/{id}"
    description: "Reads one emergent work item including the id of any work order minted for it."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: EmergentWorkItem
    side_effects: []

  - method: GET
    path: "/work-orders/{id}/emergent-items"
    description: "Lists the emergent items discovered from this work order. Reverse-reachability channel for EmergentWorkItem.discovered_from_work_order_id."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EmergentWorkItem[]
    side_effects: []

  - method: POST
    path: "/emergent-items/{id}/dispose"
    description: "Dispositions an emergent item as APPROVED (mint a work order and a schedule activity, then propagate through the whole outage), REJECTED (no effect anywhere) or ABSORBED (lengthen the discovering work order's terminal activity)."
    roles: [OutageDirector]
    code: 200
    input: ["disposition", "disposition_note?"]
    output: EmergentWorkItem
    side_effects: ["APPROVED: mints a WorkOrder (origin EMERGENT, status APPROVED) and a ScheduleActivity behind the discovering work order's terminal activity, then recomputes outage_emergent_hours_rollup, outage_scope_cost_rollup, outage_critical_path and outage_schedule_posture, auto-defers DISCRETIONARY work orders when the posture leaves ON_TRACK, and cascades their activity cancellations and permit voids; schedule_posture is fixed before the auto-deferrals and is not re-evaluated afterwards", "REJECTED: no side effects at all", "ABSORBED: adds estimated_hours to the terminal activity's planned_duration_hours and recomputes outage_critical_path and outage_schedule_posture without touching approved_emergent_hours"]

  # --- startup --------------------------------------------------------------
  - method: POST
    path: "/outages/{id}/startup-tests"
    description: "Adds a startup test to the outage's ordered startup sequence, in PENDING."
    roles: [ReactorEngineer, RegulatoryAffairs]
    code: 201
    input: [test_code, sequence_index, hold_point_type, predicted_reactivity_pcm]
    output: StartupTest
    side_effects: ["stores X-User-ID as created_by_user_id; sequence_index must be unique within the outage"]

  - method: GET
    path: "/startup-tests/{id}"
    description: "Reads one startup test including its measured and deviation reactivity figures."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: []
    output: StartupTest
    side_effects: []

  - method: GET
    path: "/outages/{id}/startup-tests"
    description: "Lists the outage's startup tests in ascending sequence_index order. Reverse-reachability channel for StartupTest.outage_id."
    roles: [StationAdmin, OutageDirector, OutagePlanner, ReactorEngineer, ContractorCoordinator, AccessAuthority, RadProtectionPlanner, RadProtectionManager, RegulatoryAffairs]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StartupTest[]
    side_effects: []

  - method: POST
    path: "/startup-tests/{id}/satisfy"
    description: "Records a startup test measurement. Within tolerance the test lands in SATISFIED; outside tolerance it lands in FAILED with a 200 response and forces the outage into RECOVERY_REQUIRED. REGULATORY hold points require an NRC release reference and a different user than the test's author."
    roles: [RegulatoryAffairs]
    code: 200
    input: ["measured_reactivity_pcm", "nrc_release_reference?"]
    output: StartupTest
    side_effects: ["computes reactivity_deviation_pcm (calculations.startup_test_reactivity_deviation)", "SATISFIED: stores satisfied_by_user_id and bubbles the outage STARTUP -> ONLINE once every test of the outage is SATISFIED", "FAILED: forces Outage.schedule_posture to RECOVERY_REQUIRED and increments Outage.version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:

  # --- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role names a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "X-User-ID equals CoreLoadPattern.created_by_user_id on approve, or equals StartupTest.created_by_user_id when satisfying a REGULATORY hold-point test"

  # --- not found ------------------------------------------------------------
  - id: ERR_OUTAGE_NOT_FOUND
    http: 404
    condition: "No Outage row with the supplied id"
  - id: ERR_SPENT_FUEL_POOL_NOT_FOUND
    http: 404
    condition: "No SpentFuelPool row with the supplied id"
  - id: ERR_RAD_AREA_NOT_FOUND
    http: 404
    condition: "No RadArea row with the supplied id"
  - id: ERR_SAFETY_FUNCTION_NOT_FOUND
    http: 404
    condition: "No SafetyFunction row with the supplied id"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "No WorkOrder row with the supplied id"
  - id: ERR_SCHEDULE_ACTIVITY_NOT_FOUND
    http: 404
    condition: "No ScheduleActivity row with the supplied id (path id, work_order_id target, or predecessor_activity_id)"
  - id: ERR_CORE_LOAD_PATTERN_NOT_FOUND
    http: 404
    condition: "No CoreLoadPattern row with the supplied id"
  - id: ERR_POOL_RESERVATION_NOT_FOUND
    http: 404
    condition: "No PoolCellReservation row with the supplied id"
  - id: ERR_WORKER_NOT_FOUND
    http: 404
    condition: "No SupplementalWorker row with the supplied id"
  - id: ERR_RWP_NOT_FOUND
    http: 404
    condition: "No RadiologicalWorkPermit row with the supplied id"
  - id: ERR_EMERGENT_ITEM_NOT_FOUND
    http: 404
    condition: "No EmergentWorkItem row with the supplied id"
  - id: ERR_STARTUP_TEST_NOT_FOUND
    http: 404
    condition: "No StartupTest row with the supplied id"

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, undeclared enum member, unknown field, or a numeric outside its declared bound (worker_count < 1, cells_requested < 1, shielding_factor outside [0, 1), planned_duration_hours <= 0, sequence_index < 1, negative money/hours/dose)"

  # --- own-state preconditions ---------------------------------------------
  - id: ERR_OUTAGE_STATE_INVALID
    http: 409
    condition: "The Outage is not in a status from which the requested operation is declared in §1.2 — e.g. lock-scope on a SCOPE_LOCKED outage, or drafting a permit against a PLANNING outage"
  - id: ERR_WORK_ORDER_STATE_INVALID
    http: 409
    condition: "The WorkOrder is not in a status from which the requested transition is declared — e.g. plan on an APPROVED work order, or lock-scope with no APPROVED work order in the outage"
  - id: ERR_ACTIVITY_STATE_INVALID
    http: 409
    condition: "The ScheduleActivity is not in an execution_status from which the requested transition is declared, an activity of the work order is already IN_PROGRESS or COMPLETE, an out-of-service activity has not been restored before startup, or the ABSORBED disposition finds no eligible terminal activity"
  - id: ERR_CORE_LOAD_PATTERN_STATE_INVALID
    http: 409
    condition: "The CoreLoadPattern is not in DRAFT when approve is called"
  - id: ERR_POOL_RESERVATION_STATE_INVALID
    http: 409
    condition: "The PoolCellReservation is not in RESERVED when consume or release is called"
  - id: ERR_WORKER_STATE_INVALID
    http: 409
    condition: "The SupplementalWorker is not in a status from which the requested onboarding step is declared — e.g. badging a worker still in SCREENING, or recording a background result for a DENIED or BADGED worker"
  - id: ERR_RWP_STATE_INVALID
    http: 409
    condition: "The RadiologicalWorkPermit is not in a status from which the requested transition is declared — e.g. approving a HELD_FOR_ALARA permit, or closing a DRAFT permit"
  - id: ERR_EMERGENT_ITEM_STATE_INVALID
    http: 409
    condition: "The EmergentWorkItem is not in REPORTED when dispose is called"
  - id: ERR_STARTUP_TEST_STATE_INVALID
    http: 409
    condition: "The StartupTest is already SATISFIED when satisfy is called"

  # --- cross-entity state guards -------------------------------------------
  - id: ERR_WORK_ORDER_NOT_APPROVED
    http: 409
    condition: "A RadiologicalWorkPermit is approved while its WorkOrder.status != APPROVED, or a ScheduleActivity with a linked work order is started while that work order is not in {APPROVED, EXECUTING}"
  - id: ERR_CORE_LOAD_PATTERN_NOT_APPROVED
    http: 409
    condition: "A DISCHARGE PoolCellReservation is created, or an outage is scope-locked, while the outage owns no CoreLoadPattern with status == APPROVED"
  - id: ERR_PREDECESSOR_NOT_COMPLETE
    http: 409
    condition: "A ScheduleActivity is started while its constraint_status is BLOCKED"
  - id: ERR_OPEN_WORK_ORDERS_REMAIN
    http: 409
    condition: "authorize-startup is called while a WorkOrder of the outage is still in {SCOPED, PLANNED, APPROVED, EXECUTING}"
  - id: ERR_STARTUP_SEQUENCE_EMPTY
    http: 409
    condition: "authorize-startup is called on an outage with zero StartupTest rows — the empty-set corner of the startup sequence"
  - id: ERR_BADGED_WORKFORCE_INSUFFICIENT
    http: 409
    condition: "commence-execution is called while Outage.badged_worker_count < Outage.required_badged_workers"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_OUTAGE_VERSION_STALE
    http: 412
    condition: "expected_outage_version does not equal the stored Outage.version on POST /outages/{id}/core-load-patterns"
  - id: ERR_POOL_VERSION_STALE
    http: 412
    condition: "expected_spent_fuel_pool_version does not equal the stored SpentFuelPool.version on POST /pool-cell-reservations"

  # --- nuclear / radiological safety ---------------------------------------
  - id: ERR_SHUTDOWN_MARGIN_INSUFFICIENT
    http: 422
    condition: "A submitted CoreLoadPattern's computed reactivity_margin_pcm is below MIN_SHUTDOWN_MARGIN_PCM (1000)"
  - id: ERR_ALARA_POSTURE_SUSPENDED
    http: 409
    condition: "A permit is approved while the outage's alara_posture is SUSPENDED"
  - id: ERR_ALARA_REVIEW_REQUIRED
    http: 422
    condition: "A permit whose alara_review_required is true is approved without an alara_review_reference"
  - id: ERR_REGULATORY_HOLD_POINT_NOT_RELEASED
    http: 422
    condition: "A REGULATORY hold-point StartupTest is satisfied without an nrc_release_reference"
  - id: ERR_SAFETY_FUNCTION_CAPACITY_EXCEEDED
    http: 409
    condition: "The count of distinct out-of-service train labels over the incoming activity's CLOSED window exceeds SafetyFunction.max_concurrent_oos_trains"

  # --- referential graph integrity -----------------------------------------
  - id: ERR_PREDECESSOR_OUTAGE_MISMATCH
    http: 422
    condition: "A supplied predecessor_activity_id or work_order_id belongs to a different outage than the one in the path"
  - id: ERR_ACTIVITY_CYCLE
    http: 422
    condition: "Following predecessor_activity_id from the incoming activity revisits an already-seen activity"

  # --- temporal windows -----------------------------------------------------
  - id: ERR_RAD_AREA_WINDOW_CONFLICT
    http: 409
    condition: "The incoming permit's buffered HALF-OPEN window intersects that of another APPROVED permit in the same rad area; exact adjacency is admitted"

  # --- administrative constraints ------------------------------------------
  - id: ERR_STARTUP_SEQUENCE_OUT_OF_ORDER
    http: 409
    condition: "A StartupTest is satisfied while a test of the same outage with a lower sequence_index is not yet SATISFIED"
  - id: ERR_STARTUP_SEQUENCE_DUPLICATE
    http: 409
    condition: "A StartupTest is created with a sequence_index already used in the same outage"
  - id: ERR_BADGE_NUMBER_TAKEN
    http: 409
    condition: "The submitted badge_number is already held by another BADGED worker of the same outage"
  - id: ERR_SCOPE_FROZEN
    http: 409
    condition: "The scope of a DISCRETIONARY WorkOrder is approved while Outage.schedule_posture is AT_RISK or RECOVERY_REQUIRED"

  # --- fiscal / capacity budgets (evaluated last) --------------------------
  - id: ERR_POOL_CAPACITY_EXCEEDED
    http: 409
    condition: "cells_requested exceeds the headroom selected by the reservation's availability_variant — protected_cells_available for FULL_CORE_PROTECTED, cells_available for NOMINAL"
  - id: ERR_DOSE_BUDGET_EXCEEDED
    http: 409
    condition: "A permit's committed_dose_mrem exceeds Outage.dose_budget_remaining_mrem at approval"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — peer roles with segregation of duties. Every role is an
# operator identifier, so every `identity:` is `opaque`; X-User-ID is recorded
# for audit and compared against itself for the two SoD gates, but it is never
# required to equal any entity's id.
# ---------------------------------------------------------------------------
roles:

  - name: StationAdmin
    description: "Plant configuration authority. Registers spent fuel pools, rad areas and shutdown safety functions, opens outages, and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /spent-fuel-pools"
      - "POST /rad-areas"
      - "POST /safety-functions"
    shared_operations:
      - "POST /outages (shared with OutageDirector)"
      - "every GET endpoint"

  - name: OutageDirector
    description: "Single accountable owner of the outage. Freezes scope, opens the breaker, authorizes startup, dispositions emergent work and signs the post-outage review."
    identity: opaque
    exclusive_operations:
      - "POST /outages/{id}/lock-scope"
      - "POST /outages/{id}/commence-execution"
      - "POST /outages/{id}/authorize-startup"
      - "POST /outages/{id}/post-outage-review"
      - "POST /work-orders/{id}/approve-scope"
      - "POST /work-orders/{id}/return-to-planning"
      - "POST /work-orders/{id}/defer"
      - "POST /emergent-items/{id}/dispose"
    shared_operations:
      - "POST /outages (shared with StationAdmin)"
      - "POST /outages/{id}/work-orders (shared with OutagePlanner)"
      - "POST /core-load-patterns/{id}/approve (shared with ReactorEngineer, under segregation of duties)"
      - "every GET endpoint"

  - name: OutagePlanner
    description: "Builds the outage scope and the schedule. Plans work orders, creates and drives schedule activities, and reports emergent work found in the field."
    identity: opaque
    exclusive_operations:
      - "POST /work-orders/{id}/plan"
      - "POST /outages/{id}/schedule-activities"
      - "POST /schedule-activities/{id}/set-predecessor"
      - "POST /schedule-activities/{id}/start"
      - "POST /schedule-activities/{id}/complete"
    shared_operations:
      - "POST /outages/{id}/work-orders (shared with OutageDirector)"
      - "POST /work-orders/{id}/emergent-items (shared with RadProtectionPlanner)"
      - "every GET endpoint"

  - name: ReactorEngineer
    description: "Owns fuel reload design and spent fuel pool capacity. Submits core loading patterns and manages pool cell reservations through their lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /outages/{id}/core-load-patterns"
      - "POST /pool-cell-reservations"
      - "POST /pool-cell-reservations/{id}/consume"
      - "POST /pool-cell-reservations/{id}/release"
    shared_operations:
      - "POST /core-load-patterns/{id}/approve (shared with OutageDirector, under segregation of duties — never the same X-User-ID that created the pattern)"
      - "POST /outages/{id}/startup-tests (shared with RegulatoryAffairs)"
      - "every GET endpoint"

  - name: ContractorCoordinator
    description: "Sponsors the supplemental workforce. Requests access authorization for temporary workers and records their training progress."
    identity: opaque
    exclusive_operations:
      - "POST /outages/{id}/supplemental-workers"
    shared_operations:
      - "POST /supplemental-workers/{id}/training-completion (shared with AccessAuthority)"
      - "every GET endpoint"

  - name: AccessAuthority
    description: "Station access authorization. Records background results and issues badges; cannot add workers to the roster or approve outage scope."
    identity: opaque
    exclusive_operations:
      - "POST /supplemental-workers/{id}/background-result"
      - "POST /supplemental-workers/{id}/badge"
    shared_operations:
      - "POST /supplemental-workers/{id}/training-completion (shared with ContractorCoordinator)"
      - "every GET endpoint"

  - name: RadProtectionPlanner
    description: "Drafts radiological work permits with dose estimates, shielding and ALARA figures; closes permits against actual dose. Cannot approve a permit it drafted or any other."
    identity: opaque
    exclusive_operations:
      - "POST /work-orders/{id}/rwps"
    shared_operations:
      - "POST /rwps/{id}/close (shared with RadProtectionManager)"
      - "POST /work-orders/{id}/emergent-items (shared with OutagePlanner)"
      - "every GET endpoint"

  - name: RadProtectionManager
    description: "Radiation protection approval authority. Approves and voids permits, committing and releasing dose against the outage budget."
    identity: opaque
    exclusive_operations:
      - "POST /rwps/{id}/approve"
      - "POST /rwps/{id}/void"
    shared_operations:
      - "POST /rwps/{id}/close (shared with RadProtectionPlanner)"
      - "every GET endpoint"

  - name: RegulatoryAffairs
    description: "Holds the regulatory interface. Satisfies startup tests and releases NRC hold points; may author tests but never satisfy a REGULATORY hold-point test it authored."
    identity: opaque
    exclusive_operations:
      - "POST /startup-tests/{id}/satisfy"
    shared_operations:
      - "POST /outages/{id}/startup-tests (shared with ReactorEngineer)"
      - "every GET endpoint"
