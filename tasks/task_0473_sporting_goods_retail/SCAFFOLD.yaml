# =============================================================================
# SCAFFOLD.yaml — Sporting Goods Retail (Dick's style)
# Tier: Expert (§0.4)
# =============================================================================

scenario: |
  473. Sporting Goods Retail (Dick's style): SKU by sport/size, footwear fitment &
  inventory, team/bulk order & embroidery, equipment service (skate sharpen/string),
  buy-online-pickup & ship-from-store, loyalty & price-match, license/permit item
  (fishing) sale, seasonal/clearance

domain_name: sporting-goods-retail
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"          # per-store inventory pool reserved/committed/released across BOPIS, SFS, team orders, service holds
  secondary_archetype: "Pricing engine"            # loyalty tiers, price-match, seasonal/clearance markdowns, embroidery surcharge
  complexity_layers:
    - "Optimistic concurrency"                       # OCC on StoreInventory.version for reservation, and on Order.version for fulfillment
    - "Cascading side effects"                       # order placement -> reserve inventory -> debit pool; fulfillment -> commit -> loyalty accrual -> tier recompute
    - "Dual-variant calculation"                     # provisional order total at placement vs. final settled total at fulfillment (price-match + clearance drift)
    - "Derived field reconciliation"                 # StoreInventory.available_qty = on_hand - reserved must stay consistent

  entity_topology: flat
  # Peer entities linked by foreign keys (Sku, Store, StoreInventory, Order, Customer,
  # ServiceTicket, FishingLicense, PriceMatchClaim, etc.). No deep URL nesting; ids in body.

  state_machine_shape: parallel
  # Order carries two independent axes: payment_status x fulfillment_status.
  # ServiceTicket has a cycle (IN_PROGRESS -> NEEDS_PARTS -> IN_PROGRESS).
  # FishingLicense is linear. StoreInventory is posture-free (counters, not states).

  relationship_patterns:
    - one_to_many        # Store -> StoreInventory, Order -> OrderLine, Customer -> Order
    - cross_aggregate    # OrderLine references Sku and Store; ServiceTicket references Sku and Store
    - many_to_many       # Order <-> Sku via OrderLine (junction)

  role_model: peer_roles
  # Customer owns own orders/claims/licenses; StoreAssociate fulfills at a store;
  # ServiceTech owns service tickets; PriceAdmin owns pricing/markdown config;
  # PlatformAdmin operational superset for seed/clock/inventory receiving.

  consistency_model: immediate
  # All reservations, debits, and derived-field recomputes are atomic within a request.

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Sku
    parent: null
    common_fields: true
    fields:
      - name: sport
        type: enum
        source: input
        description: "Sport category the SKU belongs to."
        constraints: "one of {HOCKEY, BASEBALL, FOOTWEAR, FISHING, TEAMWEAR, APPAREL}"
      - name: name
        type: string
        source: input
        description: "Display name of the product variant."
      - name: size_label
        type: string
        source: input
        description: "Human size label, e.g. '10.5D', 'L', 'YOUTH-M'. Required for FOOTWEAR/APPAREL/TEAMWEAR; may be 'NA' for FISHING licenses and service-only SKUs."
        default: "NA"
      - name: is_footwear
        type: boolean
        source: computed
        description: "Derived true when sport == FOOTWEAR. Drives fitment-required checks. Input value ignored."
      - name: base_price_cents
        type: integer
        source: input
        description: "List price in cents before any markdown or loyalty discount."
        constraints: ">= 0"
      - name: requires_license_permit
        type: boolean
        source: input
        description: "True for items that may only be sold together with a valid FishingLicense (e.g., certain fishing tackle bundles)."
        default: false
      - name: embroiderable
        type: boolean
        source: input
        description: "True if this SKU can carry an embroidery customization on a team/bulk order."
        default: false
      - name: lifecycle
        type: enum
        source: computed
        description: "Selling lifecycle; STANDARD by default, becomes SEASONAL or CLEARANCE when a Markdown is applied to this SKU. Input ignored."
        default: "STANDARD"
        constraints: "one of {STANDARD, SEASONAL, CLEARANCE, DISCONTINUED}"
      - name: active_markdown_id
        type: string
        source: computed
        description: "Denormalized pointer to the Markdown.id currently effective for this SKU given the logical clock, or null if none (not an ownership FK; discover markdowns via GET /markdowns?sku_id). Recomputed on read and on markdown create/expire."
        default: null

  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Store display name."
      - name: state_code
        type: string
        source: input
        description: "US two-letter state code where the store is physically located. Gates fishing-license issuance jurisdiction."
        constraints: "2 uppercase letters"
      - name: ship_from_store_enabled
        type: boolean
        source: input
        description: "Whether this store participates in ship-from-store fulfillment."
        default: true
      - name: pickup_enabled
        type: boolean
        source: input
        description: "Whether this store participates in buy-online-pickup-in-store (BOPIS)."
        default: true

  - name: StoreInventory
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store holding this stock row."
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the SKU stocked at this store."
      - name: on_hand_qty
        type: integer
        source: system
        description: "Physical units in the store. Increased by receiving, decreased by COMMIT (pickup/ship) of a reservation. Never goes negative."
        default: 0
        constraints: ">= 0"
      - name: reserved_qty
        type: integer
        source: system
        description: "Units soft-held by non-terminal OrderLines and active ServiceTicket parts holds. Increased on RESERVE, decreased on COMMIT or RELEASE."
        default: 0
        constraints: ">= 0"
      - name: available_qty
        type: integer
        source: computed
        description: "Derived: on_hand_qty - reserved_qty. Must stay consistent on every reserve/commit/release. Never negative."
        default: 0
        constraints: ">= 0; equals on_hand_qty - reserved_qty"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique customer email (case-insensitive unique)."
      - name: full_name
        type: string
        source: input
        description: "Customer full name."
      - name: home_state_code
        type: string
        source: input
        description: "Customer's residency state; used for resident-vs-nonresident fishing-license pricing."
        constraints: "2 uppercase letters"
      - name: loyalty_points
        type: integer
        source: computed
        description: "Lifetime accrued loyalty points; +1 per whole dollar of final settled merchandise total on fulfilled orders. Never decreases on the standard path."
        default: 0
        constraints: ">= 0"
      - name: loyalty_tier
        type: enum
        source: computed
        description: "Derived from loyalty_points via §1.3 tier thresholds. Recomputed after every accrual. Input ignored."
        default: "BRONZE"
        constraints: "one of {BRONZE, SILVER, GOLD, PLATINUM}"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the placing customer."
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the fulfilling store for BOPIS or SFS."
      - name: fulfillment_type
        type: enum
        source: input
        description: "BOPIS = buy-online-pickup-in-store; SFS = ship-from-store."
        constraints: "one of {BOPIS, SFS}"
      - name: payment_status
        type: enum
        source: system
        description: "Independent payment axis (parallel to fulfillment_status)."
        default: "UNPAID"
        constraints: "one of {UNPAID, AUTHORIZED, CAPTURED, REFUNDED}"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Independent fulfillment axis (parallel to payment_status)."
        default: "DRAFT"
        constraints: "one of {DRAFT, RESERVED, READY, FULFILLED, CANCELLED}"
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "Order total computed at placement using prices and markdowns effective at placement time (§1.3 order_total_provisional)."
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Order total recomputed at fulfillment using prices, markdowns, and approved price-match claims effective at fulfillment time (§1.3 order_total_final). Null until FULFILLED."
        default: null
      - name: loyalty_points_awarded
        type: integer
        source: computed
        description: "Points granted to the customer on fulfillment; +1 per whole dollar of final_total_cents merchandise subtotal."
        default: 0

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the owning order."
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the purchased SKU."
      - name: store_inventory_id
        type: string
        source: computed
        description: "FK -> StoreInventory.id; the stock row this line reserves against (resolved from Order.store_id + sku_id at add time)."
      - name: quantity
        type: integer
        source: input
        description: "Units ordered on this line."
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Per-unit price captured at placement (post-markdown, pre-loyalty)."
        default: 0
      - name: embroidery_text
        type: string
        source: input
        description: "Optional embroidery customization text; only allowed when the SKU is embroiderable."
        default: null
      - name: line_status
        type: enum
        source: system
        description: "Per-line reservation lifecycle, parallel to the parent order's fulfillment_status."
        default: "RESERVED"
        constraints: "one of {RESERVED, COMMITTED, RELEASED}"

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the requesting customer."
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the servicing store."
      - name: service_type
        type: enum
        source: input
        description: "SKATE_SHARPEN or RACKET_STRING (string-and-tension equipment service)."
        constraints: "one of {SKATE_SHARPEN, RACKET_STRING}"
      - name: part_sku_id
        type: string
        source: input
        description: "FK -> Sku.id; consumable part (e.g., string) reserved for the job; null for SKATE_SHARPEN which consumes no inventory."
        default: null
      - name: part_store_inventory_id
        type: string
        source: computed
        description: "Denormalized pointer to the StoreInventory.id the part hold reserves against; null when part_sku_id is null (not an ownership FK; the stock row is discoverable via GET /store-inventory?store_id=&sku_id=)."
        default: null
      - name: status
        type: enum
        source: system
        description: "Service lifecycle with a NEEDS_PARTS<->IN_PROGRESS cycle."
        default: "RECEIVED"
        constraints: "one of {RECEIVED, IN_PROGRESS, NEEDS_PARTS, COMPLETED, CANCELLED}"
      - name: service_fee_cents
        type: integer
        source: computed
        description: "Labor fee computed at completion from service_type and customer loyalty_tier discount (§1.3 service_fee)."
        default: 0

  - name: FishingLicense
    parent: null
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the license holder."
      - name: issuing_store_id
        type: string
        source: input
        description: "FK -> Store.id; the store that issued the permit. Determines license jurisdiction state."
      - name: residency
        type: enum
        source: computed
        description: "RESIDENT when Customer.home_state_code == issuing Store.state_code, else NONRESIDENT. Drives fee."
        constraints: "one of {RESIDENT, NONRESIDENT}"
      - name: valid_from
        type: datetime
        source: system
        description: "Issuance instant (= logical clock at issuance). Half-open validity window [valid_from, valid_until)."
      - name: valid_until
        type: datetime
        source: computed
        description: "valid_from + 365 days; license expires at this instant (exclusive)."
      - name: fee_cents
        type: integer
        source: computed
        description: "License fee from residency (§1.3 license_fee). RESIDENT cheaper than NONRESIDENT."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while clock < valid_until, else EXPIRED. Recomputed on read."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, EXPIRED}"

  - name: PriceMatchClaim
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order the claim adjusts (must still be pre-fulfillment)."
      - name: order_line_id
        type: string
        source: input
        description: "FK -> OrderLine.id; the specific line whose price is challenged."
      - name: competitor_price_cents
        type: integer
        source: input
        description: "Competitor advertised per-unit price the customer submits as evidence."
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle: SUBMITTED -> {APPROVED, REJECTED}."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, APPROVED, REJECTED}"
      - name: approved_unit_price_cents
        type: integer
        source: computed
        description: "On approval, the matched per-unit price applied to the line at fulfillment (= competitor_price_cents, floored at §1.3 price_match_floor). Null unless APPROVED."
        default: null

  - name: Markdown
    parent: null
    common_fields: true
    fields:
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the SKU this markdown applies to."
      - name: markdown_kind
        type: enum
        source: input
        description: "SEASONAL or CLEARANCE; sets the SKU lifecycle and the discount basis."
        constraints: "one of {SEASONAL, CLEARANCE}"
      - name: percent_off
        type: integer
        source: input
        description: "Whole-percent reduction off base_price_cents (e.g., 30 = 30% off)."
        constraints: "1..90 inclusive"
      - name: effective_from
        type: datetime
        source: input
        description: "Instant the markdown becomes effective (inclusive)."
      - name: effective_until
        type: datetime
        source: input
        description: "Instant the markdown stops being effective (exclusive). Half-open window [effective_from, effective_until)."
      - name: status
        type: enum
        source: computed
        description: "SCHEDULED before effective_from, ACTIVE within window, EXPIRED at/after effective_until. Recomputed on read."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, ACTIVE, EXPIRED}"

  - name: TeamOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the team coordinator placing the bulk order."
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the fulfilling store."
      - name: team_name
        type: string
        source: input
        description: "Team name applied as default embroidery if a line omits embroidery_text."
      - name: status
        type: enum
        source: system
        description: "DRAFT -> SUBMITTED -> {APPROVED, REJECTED}; APPROVED spawns a child Order."
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED}"
      - name: total_units
        type: integer
        source: computed
        description: "Sum of quantity across all TeamOrderLine rows. Drives bulk-tier discount."
        default: 0
      - name: spawned_order_id
        type: string
        source: computed
        description: "Denormalized pointer to the Order.id created when the TeamOrder is APPROVED; null before approval (not an ownership FK; the spawned order is fetched by id via GET /orders/{id})."
        default: null

  - name: TeamOrderLine
    parent: null
    common_fields: true
    fields:
      - name: team_order_id
        type: string
        source: input
        description: "FK -> TeamOrder.id; the owning team order."
      - name: sku_id
        type: string
        source: input
        description: "FK -> Sku.id; the SKU requested (must be embroiderable for teamwear lines)."
      - name: quantity
        type: integer
        source: input
        description: "Units requested for this team line."
        constraints: ">= 1"
      - name: embroidery_text
        type: string
        source: input
        description: "Per-line embroidery override; defaults to the parent TeamOrder.team_name when omitted."
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Order: PARALLEL dimensions (payment_status x fulfillment_status) ----
  - entity: Order
    initial_state: "fulfillment_status=DRAFT, payment_status=UNPAID"
    terminal_states: ["fulfillment_status=FULFILLED", "fulfillment_status=CANCELLED"]
    transitions:
      # ---- fulfillment axis ----
      - from: "fulfillment_status=DRAFT"
        to: "fulfillment_status=RESERVED"
        trigger: "POST /orders/{id}/place"
        actor: Customer
        preconditions:
          - "order has >= 1 OrderLine"
          - "for every line: target StoreInventory.available_qty >= line.quantity"
          - "for every line whose Sku.requires_license_permit: the customer holds a FishingLicense with status ACTIVE issued at Order.store_id"
          - "payment_status == UNPAID"
        side_effects:
          - "RESERVE: for each line, StoreInventory.reserved_qty += line.quantity; recompute StoreInventory.available_qty (cascade: line.line_status stays RESERVED)"
          - "compute Order.provisional_total_cents via §1.3 order_total_provisional and each OrderLine.unit_price_cents"
          - "payment axis transitions UNPAID -> AUTHORIZED (auth hold for provisional_total_cents)"
          - "increments Order.version by 1"
      - from: "fulfillment_status=RESERVED"
        to: "fulfillment_status=READY"
        trigger: "POST /orders/{id}/ready"
        actor: StoreAssociate
        preconditions:
          - "fulfillment_status == RESERVED"
          - "payment_status == AUTHORIZED"
        side_effects:
          - "marks the order picked/staged; no inventory change"
          - "increments Order.version by 1"
      - from: "fulfillment_status=READY"
        to: "fulfillment_status=FULFILLED"
        trigger: "POST /orders/{id}/fulfill"
        actor: StoreAssociate
        preconditions:
          - "fulfillment_status == READY"
          - "payment_status == AUTHORIZED"
          - "expected_order_version matches Order.version (OCC)"
        side_effects:
          - "COMMIT cascade: for each line StoreInventory.on_hand_qty -= line.quantity AND StoreInventory.reserved_qty -= line.quantity; recompute available_qty; line.line_status RESERVED -> COMMITTED"
          - "recompute Order.final_total_cents via §1.3 order_total_final (applies any APPROVED PriceMatchClaim and fulfillment-time markdown drift)"
          - "payment axis AUTHORIZED -> CAPTURED for final_total_cents"
          - "loyalty cascade: Customer.loyalty_points += floor(final_total_cents merchandise subtotal / 100); then recompute Customer.loyalty_tier (§1.3 loyalty_tier)"
          - "set Order.loyalty_points_awarded to the amount accrued"
          - "increments Order.version by 1"
      - from: "fulfillment_status=DRAFT"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: ["fulfillment_status == DRAFT"]
        side_effects:
          - "no inventory was reserved yet; nothing to release"
          - "increments Order.version by 1"
      - from: "fulfillment_status=RESERVED"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: ["fulfillment_status == RESERVED"]
        side_effects:
          - "RELEASE compensation: for each line StoreInventory.reserved_qty -= line.quantity; recompute available_qty; line.line_status RESERVED -> RELEASED (invariant: on_hand_qty unchanged; reserved returns to pre-place value)"
          - "payment axis AUTHORIZED -> REFUNDED (void of the auth hold; net captured == 0)"
          - "increments Order.version by 1"
      - from: "fulfillment_status=READY"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/cancel"
        actor: StoreAssociate
        preconditions: ["fulfillment_status == READY"]
        side_effects:
          - "RELEASE compensation identical to RESERVED->CANCELLED (reserved_qty returned, on_hand_qty unchanged, lines RELEASED)"
          - "payment axis AUTHORIZED -> REFUNDED"
          - "increments Order.version by 1"

  # ---- ServiceTicket: CYCLIC (IN_PROGRESS <-> NEEDS_PARTS) ----
  - entity: ServiceTicket
    initial_state: RECEIVED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: IN_PROGRESS
        trigger: "POST /service-tickets/{id}/start"
        actor: ServiceTech
        preconditions:
          - "status == RECEIVED"
          - "if part_sku_id is set: target StoreInventory.available_qty >= 1"
        side_effects:
          - "if part_sku_id is set: RESERVE 1 unit -> StoreInventory.reserved_qty += 1; recompute available_qty (cascade onto StoreInventory)"
          - "increments ServiceTicket.version by 1"
      - from: IN_PROGRESS
        to: NEEDS_PARTS
        trigger: "POST /service-tickets/{id}/flag-parts"
        actor: ServiceTech
        preconditions: ["status == IN_PROGRESS"]
        side_effects:
          - "no inventory change (part already reserved at start if applicable)"
          - "increments ServiceTicket.version by 1"
      - from: NEEDS_PARTS
        to: IN_PROGRESS
        trigger: "POST /service-tickets/{id}/resume"
        actor: ServiceTech
        preconditions: ["status == NEEDS_PARTS"]
        side_effects:
          - "cycle back into work; no inventory change"
          - "increments ServiceTicket.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /service-tickets/{id}/complete"
        actor: ServiceTech
        preconditions: ["status == IN_PROGRESS"]
        side_effects:
          - "if part_sku_id is set: COMMIT 1 unit -> StoreInventory.on_hand_qty -= 1 AND reserved_qty -= 1; recompute available_qty"
          - "compute ServiceTicket.service_fee_cents via §1.3 service_fee (uses customer loyalty_tier)"
          - "increments ServiceTicket.version by 1"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: ServiceTech
        preconditions: ["status == RECEIVED"]
        side_effects:
          - "no part reserved yet; nothing to release"
          - "increments ServiceTicket.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: ServiceTech
        preconditions: ["status == IN_PROGRESS"]
        side_effects:
          - "if part_sku_id is set: RELEASE 1 unit -> StoreInventory.reserved_qty -= 1; recompute available_qty (invariant: on_hand_qty unchanged)"
          - "increments ServiceTicket.version by 1"
      - from: NEEDS_PARTS
        to: CANCELLED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: ServiceTech
        preconditions: ["status == NEEDS_PARTS"]
        side_effects:
          - "if part_sku_id is set: RELEASE 1 unit -> StoreInventory.reserved_qty -= 1; recompute available_qty (invariant: on_hand_qty unchanged)"
          - "increments ServiceTicket.version by 1"

  # ---- TeamOrder: BRANCHING (DRAFT->SUBMITTED->{APPROVED,REJECTED}) ----
  - entity: TeamOrder
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /team-orders/{id}/submit"
        actor: Customer
        preconditions:
          - "team order has >= 1 TeamOrderLine"
          - "every line's Sku.embroiderable == true"
        side_effects:
          - "recompute TeamOrder.total_units = sum of TeamOrderLine.quantity"
          - "increments TeamOrder.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /team-orders/{id}/approve"
        actor: StoreAssociate
        preconditions:
          - "status == SUBMITTED"
          - "for every line: target StoreInventory.available_qty >= line.quantity (aggregate per sku across lines)"
        side_effects:
          - "SPAWN cascade: create a child Order(fulfillment_type=BOPIS) with one OrderLine per TeamOrderLine (embroidery_text defaulted to TeamOrder.team_name when null), then RESERVE each line's StoreInventory (reserved_qty += quantity; recompute available_qty)"
          - "compute spawned Order.provisional_total_cents via §1.3 order_total_provisional including bulk-tier discount (§1.3 team_bulk_discount)"
          - "spawned Order.fulfillment_status set to RESERVED, payment_status AUTHORIZED"
          - "set TeamOrder.spawned_order_id to the new Order.id"
          - "increments TeamOrder.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /team-orders/{id}/reject"
        actor: StoreAssociate
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "no Order spawned; no inventory reserved"
          - "increments TeamOrder.version by 1"

  # ---- PriceMatchClaim: BRANCHING (SUBMITTED->{APPROVED,REJECTED}) ----
  - entity: PriceMatchClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /price-match-claims/{id}/approve"
        actor: PriceAdmin
        preconditions:
          - "status == SUBMITTED"
          - "referenced Order.fulfillment_status IN {DRAFT, RESERVED, READY} (cross-entity: cannot match a fulfilled/cancelled order)"
          - "competitor_price_cents < the OrderLine.unit_price_cents (must be a genuine reduction)"
        side_effects:
          - "set approved_unit_price_cents = max(competitor_price_cents, §1.3 price_match_floor over the line)"
          - "the approved price is applied to the line only at Order fulfillment via §1.3 order_total_final (no immediate ledger change)"
          - "increments PriceMatchClaim.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /price-match-claims/{id}/reject"
        actor: PriceAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "approved_unit_price_cents stays null; line price unchanged at fulfillment"
          - "increments PriceMatchClaim.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent.version only)
# =============================================================================
concurrency_rules:
  - rule_id: order-fulfill-stale-version
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/fulfill"
    occ_field: "expected_order_version"
    description: |
      Fulfilling an Order whose version has advanced since the client last
      observed it is rejected. This captures the case where an approved
      PriceMatchClaim (or another staff action) has mutated the order — bumping
      its version — between the client's read and this fulfill call, so the
      client's view of the order (and therefore of which final price applies)
      is stale and must be re-fetched before committing inventory.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: inventory-receive-stale-version
    parent_entity: StoreInventory
    write_endpoint: "POST /store-inventory/{id}/receive"
    occ_field: "expected_store_inventory_version"
    description: |
      Receiving stock against a StoreInventory row whose version has advanced
      since the client last observed it is rejected. This captures the case
      where a reservation (order place or service start) has already mutated the
      row's reserved_qty/available_qty between the operator's read and this
      receive call, so the operator's on_hand baseline is stale.
    error_id: ERR_STALE_INVENTORY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  # ---- Dual variant pair on Order (provisional vs final) ----
  - name: order_total_provisional
    trigger: "On POST /orders/{id}/place (fulfillment DRAFT->RESERVED)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER PINNED: round each line to whole cents, THEN sum.
      merchandise_subtotal = 0
      for each OrderLine L (processed in created_at ASC, ties broken by created_at then sequence of insertion):
        eff_unit = effective_unit_price(L.sku_id, clock=placement_time)   # see effective_unit_price
        line_cents = eff_unit * L.quantity
        embroidery = (L.embroidery_text != null) ? EMBROIDERY_SURCHARGE_CENTS * L.quantity : 0
        L.unit_price_cents = eff_unit                                      # captured per-line
        merchandise_subtotal += line_cents + embroidery
      loyalty_disc = loyalty_discount(customer.loyalty_tier, merchandise_subtotal)  # rounded once on the subtotal
      provisional_total_cents = merchandise_subtotal - loyalty_disc
    input_set: "All OrderLines of the order; markdowns ACTIVE at placement_time; loyalty_tier as of placement."
    constants:
      EMBROIDERY_SURCHARGE_CENTS: 500
    precision: "integer cents; round_half_up when applying percentage discounts; per-line then sum"
    variants:
      - name: provisional
        when: "computed at placement; uses placement-time markdowns and IGNORES price-match claims (claims may still be SUBMITTED)"
        difference: "no PriceMatchClaim applied; markdown snapshot is placement-time"

  - name: order_total_final
    trigger: "On POST /orders/{id}/fulfill (fulfillment READY->FULFILLED)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER PINNED: round each line to whole cents, THEN sum (same order as provisional).
      merchandise_subtotal = 0
      for each OrderLine L (processed in created_at ASC):
        if exists APPROVED PriceMatchClaim PMC on L:
          eff_unit = PMC.approved_unit_price_cents
        else:
          eff_unit = effective_unit_price(L.sku_id, clock=fulfillment_time)  # re-snapshot markdown at fulfillment
        line_cents = eff_unit * L.quantity
        embroidery = (L.embroidery_text != null) ? EMBROIDERY_SURCHARGE_CENTS * L.quantity : 0
        merchandise_subtotal += line_cents + embroidery
      loyalty_disc = loyalty_discount(customer.loyalty_tier, merchandise_subtotal)
      final_total_cents = merchandise_subtotal - loyalty_disc
    input_set: "All OrderLines; APPROVED PriceMatchClaims; markdowns ACTIVE at fulfillment_time; loyalty_tier as of fulfillment."
    constants:
      EMBROIDERY_SURCHARGE_CENTS: 500
    precision: "integer cents; round_half_up; per-line then sum"
    variants:
      - name: final
        when: "computed at fulfillment; APPLIES approved price-match and re-snapshots markdown effective at fulfillment_time"
        difference: "vs provisional: approved price-match overrides the line price, and a markdown that became ACTIVE/EXPIRED between placement and fulfillment changes the line price"

  # ---- Dual variant pair on Customer/Sku domain (risk-free) -> loyalty tiering vs license fee ----
  - name: loyalty_tier
    trigger: "On Customer loyalty_points change (POST /orders/{id}/fulfill loyalty cascade)"
    algorithm: threshold
    formula: |
      pts = customer.loyalty_points
      if pts >= 5000: PLATINUM
      elif pts >= 2000: GOLD
      elif pts >= 500: SILVER
      else: BRONZE
    input_set: "Customer.loyalty_points only."
    constants:
      SILVER_MIN: 500
      GOLD_MIN: 2000
      PLATINUM_MIN: 5000
    precision: "integer points; boundary is >= (exactly 500 points => SILVER, 499 => BRONZE)"

  - name: loyalty_discount
    trigger: "Sub-step of order_total_provisional and order_total_final"
    algorithm: tiered_pricing
    formula: |
      pct = { BRONZE:0, SILVER:5, GOLD:10, PLATINUM:15 }[tier]
      loyalty_disc = round_half_up(subtotal_cents * pct / 100)   # rounded once on the merchandise subtotal
    input_set: "loyalty_tier and the merchandise subtotal."
    constants:
      SILVER_PCT: 5
      GOLD_PCT: 10
      PLATINUM_PCT: 15
    precision: "integer cents; round_half_up applied once to the whole subtotal (NOT per line)"

  - name: effective_unit_price
    trigger: "Sub-step of both order_total variants and of bulk discount"
    algorithm: threshold
    formula: |
      base = sku.base_price_cents
      m = the Markdown for sku with status ACTIVE at the given clock (window [effective_from, effective_until)),
          if multiple ACTIVE pick the one with the greatest percent_off; tie-break greatest percent_off then created_at ASC
      if m exists: eff = round_half_up(base * (100 - m.percent_off) / 100)
      else: eff = base
    input_set: "sku.base_price_cents and the markdown ACTIVE at the supplied clock instant."
    constants: {}
    precision: "integer cents; round_half_up"

  - name: team_bulk_discount
    trigger: "On POST /team-orders/{id}/approve when computing spawned Order.provisional_total_cents"
    algorithm: tiered_pricing
    formula: |
      # COMBINATORIAL (mode a): >=3 inputs (total_units, per-line eff price, tier breakpoints) with tier selection.
      units = TeamOrder.total_units
      bulk_pct = (units >= 100) ? 20 : (units >= 50) ? 12 : (units >= 20) ? 6 : 0   # marginal-free flat tier on whole order
      merchandise_subtotal = 0
      for each TeamOrderLine TL (created_at ASC):
        eff = effective_unit_price(TL.sku_id, clock=approval_time)
        embroidery = EMBROIDERY_SURCHARGE_CENTS * TL.quantity   # team lines always embroidered (team_name default)
        merchandise_subtotal += eff * TL.quantity + embroidery
      bulk_disc = round_half_up(merchandise_subtotal * bulk_pct / 100)
      loyalty_disc = loyalty_discount(customer.loyalty_tier, merchandise_subtotal - bulk_disc)  # PINNED ORDER: bulk first, then loyalty on the reduced base
      provisional_total_cents = merchandise_subtotal - bulk_disc - loyalty_disc
    input_set: "All TeamOrderLines; markdowns ACTIVE at approval_time; total_units; customer loyalty_tier."
    constants:
      EMBROIDERY_SURCHARGE_CENTS: 500
      TIER1_UNITS: 20
      TIER2_UNITS: 50
      TIER3_UNITS: 100
      TIER1_PCT: 6
      TIER2_PCT: 12
      TIER3_PCT: 20
    precision: "integer cents; round_half_up; EVALUATION ORDER PINNED: bulk discount computed on subtotal, THEN loyalty discount on (subtotal - bulk_disc)"

  - name: service_fee
    trigger: "On POST /service-tickets/{id}/complete (IN_PROGRESS->COMPLETED)"
    algorithm: tiered_pricing
    formula: |
      base = { SKATE_SHARPEN: 1000, RACKET_STRING: 2500 }[service_type]
      tier_disc_pct = { BRONZE:0, SILVER:5, GOLD:10, PLATINUM:15 }[customer.loyalty_tier]
      service_fee_cents = round_half_up(base * (100 - tier_disc_pct) / 100)
    input_set: "service_type and customer loyalty_tier at completion."
    constants:
      SKATE_SHARPEN_BASE_CENTS: 1000
      RACKET_STRING_BASE_CENTS: 2500
    precision: "integer cents; round_half_up"

  - name: license_fee
    trigger: "On POST /fishing-licenses (issuance)"
    algorithm: threshold
    formula: |
      residency = (customer.home_state_code == issuing_store.state_code) ? RESIDENT : NONRESIDENT
      fee_cents = (residency == RESIDENT) ? RESIDENT_FEE_CENTS : NONRESIDENT_FEE_CENTS
    input_set: "Customer.home_state_code and issuing Store.state_code."
    constants:
      RESIDENT_FEE_CENTS: 2500
      NONRESIDENT_FEE_CENTS: 6500
    precision: "integer cents"

  - name: price_match_floor
    trigger: "Sub-step of PriceMatchClaim approval"
    algorithm: threshold
    formula: |
      # The matched price may never fall below 50% of the line's captured unit_price_cents.
      floor = ceil(orderline.unit_price_cents * PRICE_MATCH_FLOOR_PCT / 100)   # ceil so floor rounds UP (more conservative)
      approved_unit_price_cents = max(competitor_price_cents, floor)
    input_set: "OrderLine.unit_price_cents and the submitted competitor_price_cents."
    constants:
      PRICE_MATCH_FLOOR_PCT: 50
    precision: "integer cents; ceil for the floor (boundary: competitor at exactly floor => approved = floor)"

# =============================================================================
# 1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers and POST /stores and POST /skus (seed) — those still require PlatformAdmin"

  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "entity_backed acting role owns the resource (Customer.id == X-User-ID for own order/claim/license/team-order)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /orders/{id}/place, /cancel; POST /team-orders/{id}/submit; POST /price-match-claims (claim on own order)"

  - priority: 4
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: validation
    check: "Request body well-formed: required fields present, enums valid, integers in declared ranges, quantity >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all writes"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_referential
    check: "OrderLine.embroidery_text only allowed when Sku.embroiderable == true; TeamOrderLine SKUs must be embroiderable"
    error_id: ERR_EMBROIDERY_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /orders/{id}/lines, POST /team-orders/{id}/lines"

  - priority: 8
    category: business_referential
    check: "Footwear OrderLine requires a non-NA size_label on the SKU (fitment specified)"
    error_id: ERR_FITMENT_REQUIRED
    http_status: 422
    applies_to: "POST /orders/{id}/lines"

  - priority: 9
    category: business_safety
    check: "License/permit gating: a line whose Sku.requires_license_permit may only be PLACED if the customer holds a FishingLicense with status ACTIVE issued at Order.store_id"
    error_id: ERR_LICENSE_REQUIRED
    http_status: 422
    applies_to: "POST /orders/{id}/place"

  - priority: 10
    category: business_temporal
    check: "Fishing license issuance jurisdiction: issuing store's state_code must be a valid 2-letter code; cannot issue against an unknown store"
    error_id: ERR_INVALID_JURISDICTION
    http_status: 422
    applies_to: "POST /fishing-licenses"

  - priority: 11
    category: business_constraint
    check: "Markdown window validity: effective_from < effective_until; percent_off in 1..90"
    error_id: ERR_INVALID_MARKDOWN_WINDOW
    http_status: 422
    applies_to: "POST /markdowns"

  - priority: 12
    category: business_constraint
    check: "Markdown overlap: a SKU may not have two markdowns whose [effective_from, effective_until) windows overlap (half-open; adjacent touching at a shared instant is allowed)"
    error_id: ERR_MARKDOWN_OVERLAP
    http_status: 409
    applies_to: "POST /markdowns"

  - priority: 13
    category: business_constraint
    check: "Price-match genuineness: competitor_price_cents must be strictly less than the OrderLine.unit_price_cents"
    error_id: ERR_PRICE_MATCH_NOT_LOWER
    http_status: 422
    applies_to: "POST /price-match-claims/{id}/approve"

  - priority: 14
    category: state
    check: "Price-match target order must be pre-fulfillment: Order.fulfillment_status IN {DRAFT, RESERVED, READY} (cross-entity dependency on Order)"
    error_id: ERR_ORDER_NOT_MATCHABLE
    http_status: 409
    applies_to: "POST /price-match-claims/{id}/approve"

  - priority: 15
    category: business_constraint
    check: "Inventory availability: a reservation (order place, service start, team approve) requires StoreInventory.available_qty >= requested units"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /orders/{id}/place, POST /service-tickets/{id}/start, POST /team-orders/{id}/approve"

  - priority: 16
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the live parent.version"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/fulfill (and POST /store-inventory/{id}/receive -> ERR_STALE_INVENTORY_VERSION)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- seed / config ----
  - method: POST
    path: "/skus"
    description: "Create a SKU."
    roles: [PlatformAdmin]
    code: 201
    input: [sport, name, base_price_cents, "size_label?", "requires_license_permit?", "embroiderable?"]
    output: Sku
    side_effects: ["is_footwear derived from sport; lifecycle=STANDARD; active_markdown_id=null"]
  - method: GET
    path: "/skus/{id}"
    description: "Get a SKU (recomputes active_markdown_id and lifecycle against the clock)."
    roles: [PlatformAdmin, PriceAdmin, StoreAssociate, ServiceTech, Customer]
    code: 200
    input: []
    output: Sku
    side_effects: []
  - method: GET
    path: "/skus"
    description: "List SKUs with pagination and optional sport filter."
    roles: [PlatformAdmin, PriceAdmin, StoreAssociate, ServiceTech, Customer]
    code: 200
    input: ["sport?", "limit?", "offset?"]
    output: Sku[]
    side_effects: []

  - method: POST
    path: "/stores"
    description: "Create a store."
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, "ship_from_store_enabled?", "pickup_enabled?"]
    output: Store
    side_effects: []
  - method: GET
    path: "/stores/{id}"
    description: "Get a store."
    roles: [PlatformAdmin, PriceAdmin, StoreAssociate, ServiceTech, Customer]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: POST
    path: "/customers"
    description: "Register a customer."
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, home_state_code]
    output: Customer
    side_effects: ["loyalty_points=0; loyalty_tier=BRONZE"]
  - method: GET
    path: "/customers/{id}"
    description: "Get a customer (loyalty_points and loyalty_tier reflect latest accruals)."
    roles: [PlatformAdmin, PriceAdmin, StoreAssociate, ServiceTech, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # ---- inventory ----
  - method: POST
    path: "/store-inventory"
    description: "Create a stock row pairing a store and a SKU (on_hand_qty/reserved_qty start at 0)."
    roles: [PlatformAdmin]
    code: 201
    input: [store_id, sku_id]
    output: StoreInventory
    side_effects: ["available_qty computed = 0"]
  - method: GET
    path: "/store-inventory/{id}"
    description: "Get a stock row with derived available_qty."
    roles: [PlatformAdmin, StoreAssociate, ServiceTech, Customer, PriceAdmin]
    code: 200
    input: []
    output: StoreInventory
    side_effects: []
  - method: GET
    path: "/store-inventory"
    description: "List/filter stock rows by store_id and/or sku_id (reverse-reachability for Store and Sku FKs)."
    roles: [PlatformAdmin, StoreAssociate, ServiceTech, Customer, PriceAdmin]
    code: 200
    input: ["store_id?", "sku_id?", "limit?", "offset?"]
    output: StoreInventory[]
    side_effects: []
  - method: POST
    path: "/store-inventory/{id}/receive"
    description: "Receive stock into a row. OCC-guarded on StoreInventory.version. Default clock start is 2026-01-01T00:00:00Z."
    roles: [PlatformAdmin]
    code: 200
    input: [quantity, expected_store_inventory_version]
    output: StoreInventory
    side_effects: ["on_hand_qty += quantity; recompute available_qty; increments StoreInventory.version by 1"]

  # ---- orders ----
  - method: POST
    path: "/orders"
    description: "Create a DRAFT order (no lines yet)."
    roles: [Customer]
    code: 201
    input: [customer_id, store_id, fulfillment_type]
    output: Order
    side_effects: ["fulfillment_status=DRAFT; payment_status=UNPAID; provisional_total_cents=0; final_total_cents=null"]
  - method: GET
    path: "/orders/{id}"
    description: "Get an order with both status axes and totals."
    roles: [PlatformAdmin, StoreAssociate, PriceAdmin, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List/filter orders by customer_id and/or store_id (reverse-reachability for Customer and Store FKs)."
    roles: [PlatformAdmin, StoreAssociate, PriceAdmin, Customer]
    code: 200
    input: ["customer_id?", "store_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/lines"
    description: "Add a line to a DRAFT order (resolves store_inventory_id; checks fitment/embroidery)."
    roles: [Customer]
    code: 201
    input: [sku_id, quantity, "embroidery_text?"]
    output: OrderLine
    side_effects: ["resolve store_inventory_id from order.store_id+sku_id; line_status=RESERVED placeholder until place"]
  - method: GET
    path: "/orders/{id}/lines"
    description: "List the lines of an order (reverse-reachability for OrderLine.order_id FK)."
    roles: [PlatformAdmin, StoreAssociate, PriceAdmin, Customer]
    code: 200
    input: []
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/order-lines"
    description: "Filter order lines by sku_id and/or store_inventory_id (reverse-reachability for OrderLine.sku_id and store_inventory_id FKs)."
    roles: [PlatformAdmin, StoreAssociate, PriceAdmin, Customer]
    code: 200
    input: ["sku_id?", "store_inventory_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []
  - method: GET
    path: "/order-lines/{id}"
    description: "Get a single order line by id (anchors the order-lines collection segment)."
    roles: [PlatformAdmin, StoreAssociate, PriceAdmin, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []
  - method: POST
    path: "/orders/{id}/place"
    description: "Place a DRAFT order: reserve inventory, compute provisional total, authorize payment."
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["RESERVE cascade on each line's StoreInventory; provisional_total_cents computed; payment UNPAID->AUTHORIZED; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/ready"
    description: "Mark a RESERVED order READY for pickup/ship."
    roles: [StoreAssociate]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment RESERVED->READY; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/fulfill"
    description: "Fulfill a READY order: commit inventory, compute final total, capture payment, accrue loyalty. OCC-guarded on Order.version."
    roles: [StoreAssociate]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects: ["COMMIT cascade on lines; final_total_cents via order_total_final; payment AUTHORIZED->CAPTURED; loyalty cascade -> Customer.loyalty_points + tier recompute; increments Order.version by 1"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order (DRAFT/RESERVED/READY): release any reservation, refund auth."
    roles: [Customer, StoreAssociate]
    code: 200
    input: []
    output: Order
    side_effects: ["RELEASE compensation if reserved (reserved_qty returned, on_hand unchanged); payment AUTHORIZED->REFUNDED if applicable; increments Order.version by 1"]

  # ---- service tickets ----
  - method: POST
    path: "/service-tickets"
    description: "Open a RECEIVED service ticket (skate sharpen / racket string)."
    roles: [Customer, ServiceTech]
    code: 201
    input: [customer_id, store_id, service_type, "part_sku_id?"]
    output: ServiceTicket
    side_effects: ["resolve part_store_inventory_id from store_id+part_sku_id when part_sku_id set; status=RECEIVED"]
  - method: GET
    path: "/service-tickets/{id}"
    description: "Get a service ticket."
    roles: [PlatformAdmin, ServiceTech, Customer, StoreAssociate]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: []
  - method: GET
    path: "/service-tickets"
    description: "Filter service tickets by customer_id and/or store_id and/or part_sku_id (reverse-reachability)."
    roles: [PlatformAdmin, ServiceTech, Customer, StoreAssociate]
    code: 200
    input: ["customer_id?", "store_id?", "part_sku_id?", "limit?", "offset?"]
    output: ServiceTicket[]
    side_effects: []
  - method: POST
    path: "/service-tickets/{id}/start"
    description: "Start work; reserve 1 part unit if part_sku_id set."
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["RECEIVED->IN_PROGRESS; reserve 1 part unit if applicable; increments ServiceTicket.version by 1"]
  - method: POST
    path: "/service-tickets/{id}/flag-parts"
    description: "Flag that more parts are needed (IN_PROGRESS->NEEDS_PARTS)."
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["IN_PROGRESS->NEEDS_PARTS; increments ServiceTicket.version by 1"]
  - method: POST
    path: "/service-tickets/{id}/resume"
    description: "Resume work after parts arrive (NEEDS_PARTS->IN_PROGRESS, cyclic)."
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["NEEDS_PARTS->IN_PROGRESS; increments ServiceTicket.version by 1"]
  - method: POST
    path: "/service-tickets/{id}/complete"
    description: "Complete the job; commit part if any; compute service_fee."
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["IN_PROGRESS->COMPLETED; COMMIT 1 part unit if applicable; service_fee_cents via service_fee; increments ServiceTicket.version by 1"]
  - method: POST
    path: "/service-tickets/{id}/cancel"
    description: "Cancel a ticket; release any reserved part."
    roles: [ServiceTech]
    code: 200
    input: []
    output: ServiceTicket
    side_effects: ["->CANCELLED; RELEASE 1 part unit if reserved (on_hand unchanged); increments ServiceTicket.version by 1"]

  # ---- fishing licenses ----
  - method: POST
    path: "/fishing-licenses"
    description: "Issue a fishing license; residency and fee derived; valid for 365 days from clock. Default clock start 2026-01-01T00:00:00Z."
    roles: [StoreAssociate]
    code: 201
    input: [customer_id, issuing_store_id]
    output: FishingLicense
    side_effects: ["residency derived; fee_cents via license_fee; valid_from=clock; valid_until=clock+365d; status=ACTIVE"]
  - method: GET
    path: "/fishing-licenses/{id}"
    description: "Get a license (recomputes status against the clock)."
    roles: [PlatformAdmin, StoreAssociate, Customer]
    code: 200
    input: []
    output: FishingLicense
    side_effects: []
  - method: GET
    path: "/fishing-licenses"
    description: "Filter licenses by customer_id and/or issuing_store_id (reverse-reachability)."
    roles: [PlatformAdmin, StoreAssociate, Customer]
    code: 200
    input: ["customer_id?", "issuing_store_id?", "limit?", "offset?"]
    output: FishingLicense[]
    side_effects: []

  # ---- markdowns ----
  - method: POST
    path: "/markdowns"
    description: "Schedule a seasonal/clearance markdown on a SKU; validates window and overlap."
    roles: [PriceAdmin]
    code: 201
    input: [sku_id, markdown_kind, percent_off, effective_from, effective_until]
    output: Markdown
    side_effects: ["sets Sku.lifecycle SEASONAL/CLEARANCE when ACTIVE; sku.active_markdown_id recomputed; status derived"]
  - method: GET
    path: "/markdowns/{id}"
    description: "Get a markdown (recomputes status against the clock)."
    roles: [PlatformAdmin, PriceAdmin, StoreAssociate, Customer]
    code: 200
    input: []
    output: Markdown
    side_effects: []
  - method: GET
    path: "/markdowns"
    description: "Filter markdowns by sku_id (reverse-reachability for Markdown.sku_id FK)."
    roles: [PlatformAdmin, PriceAdmin, StoreAssociate, Customer]
    code: 200
    input: ["sku_id?", "limit?", "offset?"]
    output: Markdown[]
    side_effects: []

  # ---- price-match claims ----
  - method: POST
    path: "/price-match-claims"
    description: "Submit a price-match claim against an order line."
    roles: [Customer]
    code: 201
    input: [order_id, order_line_id, competitor_price_cents]
    output: PriceMatchClaim
    side_effects: ["status=SUBMITTED"]
  - method: GET
    path: "/price-match-claims/{id}"
    description: "Get a price-match claim."
    roles: [PlatformAdmin, PriceAdmin, Customer]
    code: 200
    input: []
    output: PriceMatchClaim
    side_effects: []
  - method: GET
    path: "/price-match-claims"
    description: "Filter claims by order_id and/or order_line_id (reverse-reachability)."
    roles: [PlatformAdmin, PriceAdmin, Customer]
    code: 200
    input: ["order_id?", "order_line_id?", "limit?", "offset?"]
    output: PriceMatchClaim[]
    side_effects: []
  - method: POST
    path: "/price-match-claims/{id}/approve"
    description: "Approve a claim; set approved_unit_price_cents (floored)."
    roles: [PriceAdmin]
    code: 200
    input: []
    output: PriceMatchClaim
    side_effects: ["SUBMITTED->APPROVED; approved_unit_price_cents via price_match_floor; bumps referenced Order.version by 1 (so a stale fulfill is rejected)"]
  - method: POST
    path: "/price-match-claims/{id}/reject"
    description: "Reject a claim."
    roles: [PriceAdmin]
    code: 200
    input: []
    output: PriceMatchClaim
    side_effects: ["SUBMITTED->REJECTED"]

  # ---- team orders ----
  - method: POST
    path: "/team-orders"
    description: "Create a DRAFT team/bulk order."
    roles: [Customer]
    code: 201
    input: [customer_id, store_id, team_name]
    output: TeamOrder
    side_effects: ["status=DRAFT; total_units=0; spawned_order_id=null"]
  - method: GET
    path: "/team-orders/{id}"
    description: "Get a team order."
    roles: [PlatformAdmin, StoreAssociate, Customer]
    code: 200
    input: []
    output: TeamOrder
    side_effects: []
  - method: GET
    path: "/team-orders"
    description: "Filter team orders by customer_id and/or store_id (reverse-reachability)."
    roles: [PlatformAdmin, StoreAssociate, Customer]
    code: 200
    input: ["customer_id?", "store_id?", "limit?", "offset?"]
    output: TeamOrder[]
    side_effects: []
  - method: POST
    path: "/team-orders/{id}/lines"
    description: "Add a line to a DRAFT team order (SKU must be embroiderable)."
    roles: [Customer]
    code: 201
    input: [sku_id, quantity, "embroidery_text?"]
    output: TeamOrderLine
    side_effects: ["embroidery_text defaults to TeamOrder.team_name when omitted"]
  - method: GET
    path: "/team-orders/{id}/lines"
    description: "List team-order lines (reverse-reachability for TeamOrderLine.team_order_id FK)."
    roles: [PlatformAdmin, StoreAssociate, Customer]
    code: 200
    input: []
    output: TeamOrderLine[]
    side_effects: []
  - method: GET
    path: "/team-order-lines"
    description: "Filter team-order lines by sku_id (reverse-reachability for TeamOrderLine.sku_id FK)."
    roles: [PlatformAdmin, StoreAssociate, Customer]
    code: 200
    input: ["sku_id?", "limit?", "offset?"]
    output: TeamOrderLine[]
    side_effects: []
  - method: GET
    path: "/team-order-lines/{id}"
    description: "Get a single team-order line by id (anchors the team-order-lines collection segment)."
    roles: [PlatformAdmin, StoreAssociate, Customer]
    code: 200
    input: []
    output: TeamOrderLine
    side_effects: []
  - method: POST
    path: "/team-orders/{id}/submit"
    description: "Submit a DRAFT team order for approval; recompute total_units."
    roles: [Customer]
    code: 200
    input: []
    output: TeamOrder
    side_effects: ["DRAFT->SUBMITTED; total_units recomputed; increments TeamOrder.version by 1"]
  - method: POST
    path: "/team-orders/{id}/approve"
    description: "Approve a SUBMITTED team order: spawn a reserved Order with bulk-discounted total."
    roles: [StoreAssociate]
    code: 200
    input: []
    output: TeamOrder
    side_effects: ["SUBMITTED->APPROVED; SPAWN child Order + lines; RESERVE inventory; provisional_total via team_bulk_discount; spawned_order_id set; increments TeamOrder.version by 1"]
  - method: POST
    path: "/team-orders/{id}/reject"
    description: "Reject a SUBMITTED team order."
    roles: [StoreAssociate]
    code: 200
    input: []
    output: TeamOrder
    side_effects: ["SUBMITTED->REJECTED; no spawn; increments TeamOrder.version by 1"]

  # ---- clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an ISO8601 instant. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set; markdown/license status recomputed on subsequent reads"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed role acting on a resource it does not own."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path or FK-referenced resource does not exist."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, bad enum, out-of-range integer, quantity < 1."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state."
  - id: ERR_EMBROIDERY_NOT_ALLOWED
    http: 422
    condition: "embroidery_text supplied (or team line) for a SKU that is not embroiderable."
  - id: ERR_FITMENT_REQUIRED
    http: 422
    condition: "Footwear order line lacks a non-NA size_label on the SKU."
  - id: ERR_LICENSE_REQUIRED
    http: 422
    condition: "Placing an order containing a license/permit-gated SKU without an ACTIVE FishingLicense issued at the order's store."
  - id: ERR_INVALID_JURISDICTION
    http: 422
    condition: "Fishing license issuance against a store with an invalid/unknown jurisdiction."
  - id: ERR_INVALID_MARKDOWN_WINDOW
    http: 422
    condition: "Markdown effective_from >= effective_until, or percent_off outside 1..90."
  - id: ERR_MARKDOWN_OVERLAP
    http: 409
    condition: "New markdown window overlaps an existing markdown window on the same SKU (half-open)."
  - id: ERR_PRICE_MATCH_NOT_LOWER
    http: 422
    condition: "competitor_price_cents not strictly less than the line's unit_price_cents."
  - id: ERR_ORDER_NOT_MATCHABLE
    http: 409
    condition: "Price-match approval against an order that is FULFILLED or CANCELLED."
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "Reservation requested but StoreInventory.available_qty < requested units."
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version != live Order.version on fulfill."
  - id: ERR_STALE_INVENTORY_VERSION
    http: 412
    condition: "expected_store_inventory_version != live StoreInventory.version on receive."
  - id: ERR_DUPLICATE_INVENTORY_ROW
    http: 409
    condition: "A StoreInventory row already exists for this (store_id, sku_id) pair."
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "A customer with this email (case-insensitive) already exists."
  - id: ERR_VALIDATION_PAGINATION
    http: 422
    condition: "limit/offset outside allowed bounds (limit 1..100, offset >= 0)."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational superset: seed SKUs/stores/customers/inventory, receive stock, set clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /skus"
      - "POST /stores"
      - "POST /customers"
      - "POST /store-inventory"
      - "POST /store-inventory/{id}/receive"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"

  - name: Customer
    description: "Shops: places orders, opens service tickets, submits price-match claims, places team orders, holds licenses."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/place"
      - "POST /price-match-claims"
      - "POST /team-orders"
      - "POST /team-orders/{id}/lines"
      - "POST /team-orders/{id}/submit"
    shared_operations:
      - "POST /orders/{id}/cancel (shared with StoreAssociate)"
      - "POST /service-tickets (shared with ServiceTech)"
      - "GET on own orders/claims/licenses/team-orders and public catalog"

  - name: StoreAssociate
    description: "In-store fulfillment: ready/fulfill orders, approve/reject team orders, issue fishing licenses."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/ready"
      - "POST /orders/{id}/fulfill"
      - "POST /team-orders/{id}/approve"
      - "POST /team-orders/{id}/reject"
      - "POST /fishing-licenses"
    shared_operations:
      - "POST /orders/{id}/cancel (shared with Customer)"
      - "GET on orders/team-orders/inventory/catalog"

  - name: ServiceTech
    description: "Equipment service desk: runs the service-ticket lifecycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-tickets/{id}/start"
      - "POST /service-tickets/{id}/flag-parts"
      - "POST /service-tickets/{id}/resume"
      - "POST /service-tickets/{id}/complete"
      - "POST /service-tickets/{id}/cancel"
    shared_operations:
      - "POST /service-tickets (shared with Customer)"
      - "GET on service-tickets/inventory/catalog"

  - name: PriceAdmin
    description: "Pricing desk: schedules markdowns, adjudicates price-match claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /markdowns"
      - "POST /price-match-claims/{id}/approve"
      - "POST /price-match-claims/{id}/reject"
    shared_operations:
      - "GET on markdowns/claims/orders/catalog"
