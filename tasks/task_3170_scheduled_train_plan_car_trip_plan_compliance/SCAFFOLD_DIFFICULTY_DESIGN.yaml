            - call: "POST /rail/train-plans/${p}/retire"
              payload: { expected_train_plan_version: "${p_v2}" }
              as: NetworkPlanner
          assert:
            - "first retire: error_id == ERR_PLAN_IN_USE because a PLANNED TripLeg references the plan"
            - "after shipment cancel cascades the leg to REPLACED: second retire succeeds, TrainPlan.${p}.status == RETIRED"
            - "TrainPlan.${p}.version == 3 after successful retirement (1 create + 1 activate + 1 retire)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_pool_epoch_capacity_gate
        grounds:
          - entities.CrewPool.fields.crews_booked
          - calculations.crew_hos_check
          - errors[ERR_NO_CREW_AVAILABLE]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics: a CrewPool epoch (one
          service_date at one home yard) admits at most crews_available crew
          bookings — the SECOND finalize against a 1-crew pool is rejected
          not by clock-overlap geometry but by the aggregate count crossing
          the epoch capacity.
        test_recipe:
          setup:
            - "Yards OL-A, OL-B; ACTIVE plan OL-P; pool OL-POOL crews_available 1; locomotives OL-L1, OL-L2; departure OL-D1 already finalized at 08:00 (pool EXHAUSTED); departure OL-D2 SCHEDULED on the same pool."
