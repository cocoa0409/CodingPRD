            - "after the setup, GET /dno/policies/${policy1_id}/coverage-parts shows SIDE_A, SIDE_B and SIDE_C all RELEASED, and GET /dno/insureds/${insured_id} shows the released capacity re-consumed by P2: aggregate_bound_side_c_usd == 5000000, available_side_c_capacity_usd == 20000000, capacity_posture == OPEN, open_policy_count == 1"
