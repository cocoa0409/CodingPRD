            - "Production.${prod_id}.status is still PROVISIONED (not REHEARSED, not SURVEYED) and readiness_score_certified is still 85.00"
            - "GET /broadcast-ops/productions/${prod_id}/rehearsals?status=ABORTED returns total_count == 1"
            - "A second outcome call on the same rehearsal returns HTTP 409 with error_id == ERR_REHEARSAL_STATE_INVALID (priority 26 - COMPLETED and ABORTED are both terminal)"

      - name: repeat_survey_submit_rejected_rather_than_replayed
        claim_type: idempotency
        grounds:
          - validations[priority=21]
          - errors[ERR_SURVEY_STATE_INVALID]
          - endpoints[POST /broadcast-ops/venue-surveys/{id}/submit]
        distinguishing_aspect: |
          This scaffold declares no idempotency layer, so a repeated action is an error, not a replay:
          the second submit of an already SUBMITTED survey must return ERR_SURVEY_STATE_INVALID and
          must NOT re-stamp submitted_by_user_id or bump the row's version - which is what a naive
          "apply then check" implementation would do.
        test_recipe:
          setup:
            - "One TIER_3 production with a survey that holds one 150 ft position and has already been submitted by td-001."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { sv1: $.data.version, sub1: $.data.submitted_by_user_id }
          trigger:
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-002"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_SURVEY_STATE_INVALID"
            - "VenueSurvey.${survey_id}.status is still SUBMITTED and submitted_by_user_id is still td-001 (not td-002)"
            - "VenueSurvey.${survey_id}.version is unchanged from ${sv1}"

      - name: truck_arrive_from_available_rejected_as_undeclared_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.ProductionTruck
          - validations[priority=20]
          - errors[ERR_TRUCK_STATE_INVALID]
        distinguishing_aspect: |
          arrive and service-complete are declared only from IN_TRANSIT and IN_MAINTENANCE
          respectively. Firing either at an AVAILABLE truck must be refused with
          ERR_TRUCK_STATE_INVALID and must not touch the engine-hour ledger - the counter is only ever
          advanced by wrap, so a rejected arrive leaves engine_hours_since_service at 100.
        test_recipe:
          setup:
            - "One AVAILABLE truck at 100 engine hours, never assigned to any production."
          setup_api_calls:
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-07", tier_rating: "TIER_2", camera_channel_capacity: 8, power_draw_amps: 90, home_base_code: "DEN", engine_hours_since_service: 100, service_interval_hours: 500 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/trucks/${truck_id}/arrive"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err1: $.data.error_id }
            - call: "POST /broadcast-ops/trucks/${truck_id}/service-complete"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err2: $.data.error_id }
          assert:
            - "Both calls return HTTP 409 with error_id == ERR_TRUCK_STATE_INVALID"
            - "ProductionTruck.${truck_id}.status is still AVAILABLE, engine_hours_since_service == 100, hours_to_service == 400, last_service_completed_at == null"

      - name: booking_prep_and_call_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.PathBooking.initial_state
          - state_machines.SystemPrep.initial_state
          - state_machines.CrewCall.initial_state
        distinguishing_aspect: |
          Three machines created in one flow must each land on their declared initial state - RESERVED,
          PENDING, OFFERED - with their derived counters already coherent: the booking has
          test_attempt_count 0 and has already moved the path's committed_mbps_total to 200, the prep
          has feed_validated_at null, and the offered call already carries a provisional reserve.
        test_recipe:
          setup:
            - "One TIER_3 production, a FIBER PRIMARY_ELIGIBLE path (300 Mbps), an ACTIVE LIVE_STATS feed and one STAFF member certified TIER_3."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/transmission-paths"
              payload: { path_code: "FIB-01", path_type: "FIBER", carrier_code: "LUMEN", capacity_mbps: 300, redundancy_class: "PRIMARY_ELIGIBLE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { path_id: $.data.id }
            - call: "POST /broadcast-ops/data-feeds"
              payload: { provider_code: "STATSCO", feed_kind: "LIVE_STATS", latency_ms: 120, contract_expiry_utc: "2026-09-01T00:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { feed_id: $.data.id, feed_status: $.data.status }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_id}", path_id: "${path_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T12:00:00Z", window_end_utc: "2026-08-16T02:00:00Z", requested_mbps: 200, expected_production_version: "${pv1}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { booking_id: $.data.id, bstat: $.data.status }
            - call: "POST /broadcast-ops/system-preps"
              payload: { production_id: "${prod_id}", data_feed_id: "${feed_id}", system_kind: "GRAPHICS" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { prep_id: $.data.id, pstat: $.data.status }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv2: $.data.version }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv2}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call_id: $.data.id, cstat: $.data.status }
          assert:
            - "PathBooking.${booking_id}.status == RESERVED, test_attempt_count == 0, test_window_start_utc == null"
            - "TransmissionPath.${path_id}.committed_mbps_total == 200 and active_booking_count == 1"
            - "SystemPrep.${prep_id}.status == PENDING, feed_validated_at == null; DataFeed.${feed_id}.status == ACTIVE and active_consumer_count == 0"
            - "CrewCall.${call_id}.status == OFFERED, provisional_total_cents == 104000, settled_total_cents == 0, meal_penalty_units == 0, turnaround_minutes_before_call == null"
            - "Production.${prod_id}.labor_committed_cents == 104000, labor_available_cents == 1896000, readiness_score_preflight == 52.50 (0 survey + 25 reserved primary + 20 pending prep + 15 x 1/2 crew), readiness_score_certified == 0.00"

      - name: feed_suspension_cascade_reverts_prep_and_holds_the_show
        claim_type: cascade_down
        grounds:
          - state_machines.SystemPrep[VALIDATED -> PENDING]
          - endpoints[POST /broadcast-ops/data-feeds/{id}/suspend]
        excluded_because:
          difficulty_instance: transitive_cascade / feed_suspension_cascades_prep_then_production_then_rehearsal_and_show_hold
          rationale: "That instance suspends the feed and asserts every link of the cascade in one recipe - prep VALIDATED -> PENDING with feed_validated_at null and active_consumer_count 0, production REHEARSED -> SURVEYED with certified readiness 80.00, the SCHEDULED rehearsal aborted while the COMPLETED one is untouched, and readiness_hold set on the PRE_SHOW show only."

      - name: crew_call_cancellation_reverses_its_labor_reserve
        claim_type: compensation
        grounds:
          - state_machines.CrewCall[ACCEPTED -> CANCELLED]
          - calculations.production_labor_commitment
        excluded_because:
          difficulty_instance: compensating_invariant / crew_call_cancellation_restores_labor_budget_exactly
          rationale: "That instance offers, accepts and cancels a call and asserts labor_committed_cents / labor_available_cents return bit-identical to their pre-offer values, which is exactly the compensation claim for this transition."

      - name: booking_release_reconciles_the_path_bandwidth_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.PathBooking[CONFIRMED -> RELEASED]
          - calculations.path_committed_mbps_total
        excluded_because:
          difficulty_instance: compensating_invariant / path_booking_release_restores_committed_bandwidth_exactly
          rationale: "That instance walks create/confirm/release on the same path and asserts committed_mbps_total and active_booking_count reconcile to their pre-create values after every step, which is the ledger-sync claim for this side effect."

      - name: show_air_and_signal_dimensions_are_independent
        claim_type: parallel_state_dimensions
        grounds:
          - state_machines.ShowExecution[air dimension]
          - state_machines.ShowExecution[signal dimension]
        excluded_because:
          difficulty_instance: non_linear_state_machine / show_execution_air_and_signal_dimensions_advance_independently
          rationale: "That instance drives air_status PRE_SHOW -> ON_AIR -> IN_EXTENDED_PLAY -> ON_AIR while signal_status moves NOMINAL -> ON_BACKUP and asserts each dimension's value after every step, including that returning from extended play does not reset signal_status."

      - name: show_execution_starts_pre_show_and_nominal
        claim_type: initial_state
        grounds:
          - state_machines.ShowExecution.initial_state
          - endpoints[POST /broadcast-ops/show-executions]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / show_execution_creation_depends_on_production_stage
          rationale: "That instance asserts the freshly created show has air_status PRE_SHOW, signal_status NOMINAL, readiness_hold false and all four minute counters at 0, plus the stage gate that governs creation."

      - name: prep_validation_is_guarded_by_the_feeds_state
        claim_type: guarded_transition
        grounds:
          - validations[priority=25]
          - state_machines.SystemPrep[PENDING -> VALIDATED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / prep_validation_depends_on_data_feed_status
          rationale: "That instance validates a prep against an ACTIVE feed, suspends the feed, and retries the same call to assert ERR_FEED_STATE_INVALID - the cross-entity guard on this transition, tested from both sides."

  # ===========================================================================
  - section: calculations
    instances:
      - name: survey_signal_loss_exactly_at_budget_is_accepted
        claim_type: precision
        grounds:
          - calculations.survey_signal_loss_budget
          - validations[priority=41]
          - endpoints[POST /broadcast-ops/venue-surveys/{id}/submit]
        distinguishing_aspect: |
          A 150 ft run rounds half-up to 2.03 (2.025 exactly) and a 600 ft run gives 8.10, so the
          survey total is exactly MAX_SIGNAL_LOSS_BUDGET_DB (10.13) and submit must SUCCEED - the gate
          rejects only strictly-greater totals. An implementation that rounds 2.025 down to 2.02 gets
          10.12 and passes for the wrong reason; one that treats the ceiling as exclusive rejects a
          legal plot.
        test_recipe:
          setup:
            - "One TIER_3 production with a DRAFT survey holding a 150 ft HARD position and a 600 ft HARD position."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
