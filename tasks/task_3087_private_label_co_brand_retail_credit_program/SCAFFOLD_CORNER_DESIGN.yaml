          assert:
            - "PromoPlan.${pp_id}.subsidy_at_application_cents == 19188"
            - "PromoPlan.${pp_id}.subsidy_at_risk_cents == 5756"
            - "PromoPlan.${pp_id}.plan_status == ACTIVE and qualifying_flag == true"
            - "GET /servicing/credit-programs/${g_id}/summary free_look_exposure_cents == 5756"

      - name: account_minimum_payment_applies_the_two_percent_floor
        claim_type: Constants Applied
        grounds:
          - calculations.account_minimum_payment
          - entities.Account.fields.outstanding_balance_cents
        distinguishing_aspect: "The 2% balance fraction and the 3500-cent floor combine so a 100000-cent balance services exactly 3500 (2% would be 2000, below the floor) while a 200000-cent balance services 4000."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two accounts on one program with 100000 and 200000 principal."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/accounts/${acct_id}/balances"
              payload: { principal_balance_cents: 100000, balance_bucket: "PRINCIPAL" }
              as: ProgramAdmin
            - call: "POST /servicing/applications"
              payload: { program_id: "${g_id}", source_channel: "DIGITAL", requested_credit_limit_cents: 900000 }
              as: Applicant
              captures: { app_b: "$.data.id" }
            - call: "POST /servicing/applications/${app_b}/decide"
              payload: {}
              as: Underwriter
            - call: "GET /servicing/accounts?program_id=${g_id}"
              payload: {}
              as: ProgramAdmin
              captures: { acct_a: "$.data[0].id", acct_b: "$.data[1].id" }
            - call: "POST /servicing/accounts/${acct_b}/balances"
              payload: { principal_balance_cents: 200000, balance_bucket: "PRINCIPAL" }
              as: ProgramAdmin
          trigger:
            - call: "GET /servicing/credit-programs/${g_id}/summary"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Account.${acct_a}.outstanding_balance_cents == 100000 and its minimum payment due == 3500 (the floor, not the 2000 two-percent figure)"
            - "Account.${acct_b}.outstanding_balance_cents == 200000 and its minimum payment due == 4000"
            - "the floor binds strictly below 175000 cents, where 2% first reaches 3500"

      - name: program_profitability_subtracts_acquisition_cost_per_account
        claim_type: Constants Applied
        grounds:
          - calculations.program_profitability
          - entities.CreditProgram.fields.program_profitability_cents
        distinguishing_aspect: "With a single account, the acquisition cost constant is charged once: the settled contribution 25396 minus 4200 yields program_profitability_cents 21196."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program with one account, two promo plans and one settled batch."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
