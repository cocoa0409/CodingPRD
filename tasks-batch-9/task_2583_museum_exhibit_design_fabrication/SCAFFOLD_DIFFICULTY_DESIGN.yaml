  - rule_id: non_linear_state_machine
    instances:
      - name: case_status_and_mount_status_are_two_independent_dimensions_of_one_row
        grounds:
          - state_machines.ArtifactCase.status
          - state_machines.ArtifactCase.mount_status
          - entities.ArtifactCase.fields.mount_status
          - validations.priority_49
        distinguishing_aspect: |
          ArtifactCase carries TWO state fields with two separate machines
          (dimension conservation_approval and dimension mount_making). A
          single-dimension implementation collapses them: it either refuses
          MOUNT_DESIGN while the case is still in CONSERVATOR_REVIEW, or it
          resets mount_status when the conservation dimension moves. Both are
          wrong. mount_status must sit at MOUNT_DESIGN across the whole
          CONSERVATOR_REVIEW -> APPROVED move without being touched, and the
          NEXT mount step must then be refused for a reason that lives in a
          third entity entirely (no APPROVED ShopDrawing names this case), not
          because the conservation dimension is in the wrong place.
        test_recipe:
          setup:
            - "project in phase SCHEMATIC with an APPROVED SCHEMATIC design package"
            - "one gallery zone with case_slot_capacity 2, one STABLE ENHANCED artifact"
            - "case C-01 holding that artifact, submitted for conservation (status CONSERVATOR_REVIEW) and already advanced to mount_status MOUNT_DESIGN"
