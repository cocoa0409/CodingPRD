  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: storage_tier_boundary_day8_uses_tier2
        claim_type: correct_result
        grounds: [calculations.storage_accrual]
        distinguishing_aspect: "Tier boundary: lay days 1-7 bill at 50c/ft (7 x 2000 = 14000); the close that accrues day 8 adds exactly 2600 (tier 2, 65c/ft) for a running total of 16600."
        test_recipe:
          setup: ["40 ft vessel, DAILY job hauled 2026-08-02; first close at 2026-08-08 (7 days), second close at 2026-08-09 (8 days)"]
          setup_api_calls:
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: YardManager }
            - { call: "POST /yard/vessels", payload: { name: "MV Tier", owner_name: "O T", owner_user_id: "owner-1", loa_ft: 40, beam_ft: 13, hull_type: "POWER", displacement_tons: 20 }, as: ServiceWriter, captures: { v_id: $.data.id } }
            - { call: "POST /yard/insurance-certificates", payload: { vessel_id: "${v_id}", provider: "P", policy_no: "PT2", liability_coverage_cents: 200000000, effective_date: "2026-01-01", expiry_date: "2027-06-01" }, as: ServiceWriter }
            - { call: "POST /yard/refit-jobs", payload: { vessel_id: "${v_id}" }, as: ServiceWriter, captures: { j_id: $.data.id } }
            - { call: "POST /yard/refit-jobs/${j_id}/submit", payload: {}, as: ServiceWriter }
            - { call: "POST /yard/yard-rows", payload: { code: "TB", total_stands: 8 }, as: YardManager, captures: { row_id: $.data.id, row_v: $.data.version } }
            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T12:00:00Z" }, as: YardManager }
            - { call: "POST /yard/ops/run-daily-close", payload: {}, as: YardManager, captures: { posted1: $.data.storage_entries_posted } }
          trigger:
            - { call: "GET /yard/refit-jobs/${j_id}/statement", payload: {}, as: Accountant, captures: { store_7: $.data.storage_charges_cents } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T12:00:00Z" }, as: YardManager }
            - { call: "POST /yard/ops/run-daily-close", payload: {}, as: YardManager, captures: { posted2: $.data.storage_entries_posted } }
            - { call: "GET /yard/refit-jobs/${j_id}/statement", payload: {}, as: Accountant, captures: { store_8: $.data.storage_charges_cents, days_8: $.data.lay_days } }
          assert:
            - "after 7 lay days storage_charges_cents == 14000 (7 x 2000, all tier 1) and first close posted 7 entries"
            - "second close posts exactly 1 entry (day 8)"
            - "after 8 lay days storage_charges_cents == 16600 (14000 + 2600 at tier 2)"

      - name: monthly_block_second_block_at_day31
        claim_type: correct_result
        grounds: [calculations.storage_accrual]
        distinguishing_aspect: "MONTHLY_CONTRACT posts a 56000-cent block on lay-day indexes 1 and 31: after 31 accrued days storage totals 112000 while a DAILY job would show 77200 — block semantics confirmed at the 30/31 boundary."
        test_recipe:
          setup: ["40 ft vessel, MONTHLY_CONTRACT job hauled 2026-08-02; close executed at 2026-09-01 (31 lay days)"]
