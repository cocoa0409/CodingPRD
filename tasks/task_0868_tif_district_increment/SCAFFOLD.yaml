  - id: ERR_DISBURSEMENT_NOT_FOUND
    http: 404
    condition: "Disbursement id does not exist"
  - id: ERR_INCREMENT_RECORD_NOT_FOUND
    http: 404
    condition: "IncrementRecord id does not exist"
  - id: ERR_ANNUAL_REPORT_NOT_FOUND
    http: 404
    condition: "AnnualReport id does not exist"
  - id: ERR_TAXING_BODY_NOT_IN_DISTRICT
