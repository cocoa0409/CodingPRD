scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: labor_union_vs_non_union_ruleset
        grounds:
          - calculations.crew_call_labor_cost
          - entities.Venue.fields.union_ruleset
          - entities.CrewCall.fields.labor_cost_cents
          - entities.CrewAssignment.fields.labor_charge_cents
        distinguishing_aspect: |
          Dual-variant labor costing on the CrewCall/CrewAssignment entity domain: identical
          worked hours (10.00) and rate (10000 cents) cost 130000 cents under the IATSE union
          variant (8 ST + 2x1.5 OT1 + 2h meal penalty at 2x = 13 paid hours) but 100000 cents
          under the NON_UNION variant (10 ST = 10 paid hours) — the variant is selected by the
          VENUE's union_ruleset, not by any field on the call.
        test_recipe:
          setup:
            - "Venue V1 with union_ruleset IATSE (min_call 4, ot1 8, ot2 12) and venue V2 with union_ruleset NON_UNION, identical numeric parameters"
            - "Production P1 at V1 and P2 at V2, both PLANNING"
            - "Each production has a PUBLISHED-then-CONFIRMED LIGHTING crew call 2026-09-01T08:00:00Z..2026-09-01T18:00:00Z, headcount 1, with one CONFIRMED assignment (technician hourly_rate_cents 10000) that has reported 10.00 worked hours"
            - "Logical clock at 2026-09-01T18:00:00Z (>= call_end)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/venues", payload: { name: "Hall NonUnion", union_ruleset: NON_UNION, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v2: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/productions", payload: { venue_id: "${v2}", name: "P2", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p2: $.data.id } }
            - { call: "POST /api/productions/${p2}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/technicians", payload: { full_name: "Lt One", union_card_no: "U-1001", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager, captures: { t1: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Lt Two", union_card_no: "U-1002", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager, captures: { t2: $.data.id } }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T18:00:00Z", required_headcount: 1 }, as: ProductionManager, captures: { c1: $.data.id } }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c1}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { a1: $.data.id } }
            - { call: "POST /api/crew-assignments/${a1}/transition", payload: { to: CONFIRMED }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/crew-assignments/${a1}/transition", payload: { to: WORKED, worked_hours: 10.00 }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/productions/${p2}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T18:00:00Z", required_headcount: 1 }, as: ProductionManager, captures: { c2: $.data.id } }
            - { call: "POST /api/crew-calls/${c2}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c2}/assignments", payload: { technician_id: "${t2}" }, as: ProductionManager, captures: { a2: $.data.id } }
            - { call: "POST /api/crew-assignments/${a2}/transition", payload: { to: CONFIRMED }, as: CrewChief, as_user_id: "${t2}" }
            - { call: "POST /api/crew-assignments/${a2}/transition", payload: { to: WORKED, worked_hours: 10.00 }, as: CrewChief, as_user_id: "${t2}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T18:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: COMPLETED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c2}/transition", payload: { to: COMPLETED }, as: ProductionManager }
            - { call: "GET /api/crew-calls/${c1}", as: ProductionManager, captures: { c1_cost: $.data.labor_cost_cents } }
            - { call: "GET /api/crew-calls/${c2}", as: ProductionManager, captures: { c2_cost: $.data.labor_cost_cents } }
            - { call: "GET /api/crew-assignments/${a1}", as: ProductionManager, captures: { a1_charge: $.data.labor_charge_cents, a1_status: $.data.status } }
          assert:
            - "CrewCall.${c1}.labor_cost_cents == 130000 (IATSE: 8 ST + 2h OT1 x1.5 + 2h meal penalty = 13 paid hours x 10000)"
            - "CrewCall.${c2}.labor_cost_cents == 100000 (NON_UNION: 10 ST x 10000, no meal penalty)"
            - "CrewAssignment.${a1}.labor_charge_cents == 130000 and status == RECONCILED"
            - "labor_cost values differ by exactly 30000 cents for identical inputs across the two venue rulesets"

      - name: damage_depreciated_vs_repair_quote
        grounds:
          - calculations.damage_valuation
          - entities.DamageReport.fields.assessed_charge_cents
          - entities.EquipmentAsset.fields.replacement_cost_cents
        distinguishing_aspect: |
          Dual-variant valuation on the DamageReport/EquipmentAsset domain (distinct from the
          labor domain of the sibling instance): two identical assets (replacement 100000 cents,
          acquired 2024-08-01T00:00:00Z, age 2 full years at the 2026-09-01 clock) assessed on
          the same day produce 80000 cents under DEPRECIATED (factor 0.80) versus 57500 cents
          under REPAIR_QUOTE (50000 quote x 1.15 diminution).
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 fully ready (plot with one APPROVED point, APPROVED house power plan, two PREPPED pull entries on assets A1/A2, one CONFIRMED crew call), moved through READY_FOR_LOADIN to LOAD_IN at 2026-09-01T08:00:00Z"
            - "Truck T1 (capacity 10000) with an AUTHORIZED LOAD_IN schedule at dock 0, window 2026-09-01T08:00:00Z..2026-09-01T12:00:00Z"
            - "Both entries checked OUT on that schedule; two DAMAGE reports filed (R1 on E1, R2 on E2)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp1: $.data.id } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "POST /api/productions/${p1}/power-plans", payload: { phase_l1_watts: 10000, phase_l2_watts: 10000, phase_l3_watts: 10000, feeder_length_m: 0, generator_required: false }, as: ProductionManager, captures: { pp1: $.data.id } }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: APPROVED }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-001", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief, captures: { a1: $.data.id } }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-002", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief, captures: { a2: $.data.id } }
            - { call: "POST /api/productions/${p1}/pull-list-entries", payload: { asset_id: "${a1}" }, as: WarehouseChief, captures: { e1: $.data.id } }
            - { call: "POST /api/productions/${p1}/pull-list-entries", payload: { asset_id: "${a2}" }, as: WarehouseChief, captures: { e2: $.data.id } }
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: RESERVED }, as: WarehouseChief }
            - { call: "POST /api/pull-list-entries/${e2}/transition", payload: { to: RESERVED }, as: WarehouseChief }
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: PREPPED, prep_window_start: "2026-08-25T09:00:00Z", prep_window_end: "2026-08-25T17:00:00Z" }, as: WarehouseChief }
            - { call: "POST /api/pull-list-entries/${e2}/transition", payload: { to: PREPPED, prep_window_start: "2026-08-25T09:00:00Z", prep_window_end: "2026-08-25T17:00:00Z" }, as: WarehouseChief }
            - { call: "POST /api/trucks", payload: { plate_no: "T-1", capacity_kg: 10000 }, as: WarehouseChief, captures: { tr1: $.data.id } }
            - { call: "POST /api/productions/${p1}/load-schedules", payload: { truck_id: "${tr1}", direction: LOAD_IN, dock_door_index: 0, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z" }, as: ProductionManager, captures: { ls1: $.data.id } }
            - { call: "POST /api/load-schedules/${ls1}/transition", payload: { to: CONFIRMED }, as: ProductionManager }
            - { call: "POST /api/technicians", payload: { full_name: "Lt One", union_card_no: "U-1001", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager, captures: { t1: $.data.id } }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T18:00:00Z", required_headcount: 1 }, as: ProductionManager, captures: { c1: $.data.id } }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c1}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { as1: $.data.id } }
            - { call: "POST /api/crew-assignments/${as1}/transition", payload: { to: CONFIRMED }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: CONFIRMED }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: READY_FOR_LOADIN }, as: ProductionManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: LOAD_IN }, as: ProductionManager }
            - { call: "POST /api/load-schedules/${ls1}/transition", payload: { to: AUTHORIZED }, as: ProductionManager }
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: OUT, load_schedule_id: "${ls1}" }, as: WarehouseChief }
            - { call: "POST /api/pull-list-entries/${e2}/transition", payload: { to: OUT, load_schedule_id: "${ls1}" }, as: WarehouseChief }
            - { call: "POST /api/productions/${p1}/damage-reports", payload: { pull_list_entry_id: "${e1}", report_type: DAMAGE }, as: WarehouseChief, captures: { r1: $.data.id } }
            - { call: "POST /api/productions/${p1}/damage-reports", payload: { pull_list_entry_id: "${e2}", report_type: DAMAGE }, as: WarehouseChief, captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /api/damage-reports/${r1}/assess", payload: { valuation_method: DEPRECIATED }, as: WarehouseChief, captures: { r1_charge: $.data.assessed_charge_cents } }
            - { call: "POST /api/damage-reports/${r2}/assess", payload: { valuation_method: REPAIR_QUOTE, repair_quote_cents: 50000 }, as: WarehouseChief, captures: { r2_charge: $.data.assessed_charge_cents } }
            - { call: "GET /api/pull-list-entries/${e1}", as: WarehouseChief, captures: { e1_rental: $.data.rental_charge_cents, e1_status: $.data.status } }
          assert:
            - "DamageReport.${r1}.assessed_charge_cents == 80000 (DEPRECIATED: 100000 x max(0.20, 1 - 0.10x2))"
            - "DamageReport.${r2}.assessed_charge_cents == 57500 (REPAIR_QUOTE: 50000 x 1.15)"
            - "PullListEntry.${e1}.status == DAMAGED and rental_charge_cents == 5000 (same-day billing window, 1 day at tier 1)"
            - "assessed charges differ by 22500 cents for identical assets assessed on the same day"

      - name: settlement_provisional_vs_final_damage_inclusion
        grounds:
          - calculations.settlement_totals
          - entities.SettlementStatement.fields.provisional_damage_cents
          - entities.SettlementStatement.fields.damage_total_cents
        distinguishing_aspect: |
          Dual-variant aggregation on the SettlementStatement domain (distinct from labor and
          equipment domains): at DRAFT creation the PROVISIONAL variant counts the ASSESSED
          report (provisional_damage_cents 80000), while the FINAL variant after the report is
          WAIVED counts CHARGED only (damage_total_cents 0) — same production, same underlying
          events, grand totals 185000 vs 105000.
        test_recipe:
          setup:
            - "Production P1 at IATSE venue carried end-to-end: READY -> LOAD_IN -> gear OUT -> DAMAGE report R1 assessed DEPRECIATED at 80000 -> RIGGING/ELECTRICAL/FINAL inspections PASSED -> SHOW_READY -> SHOW_COMPLETE -> LOAD_OUT -> load schedule COMPLETE -> crew call COMPLETED (labor 100000) -> CLOSED"
            - "Logical clock 2026-09-02T20:00:00Z when the call completes; entry E1 rental billed 5000 at assessment (same-day)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp1: $.data.id } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "POST /api/productions/${p1}/power-plans", payload: { phase_l1_watts: 10000, phase_l2_watts: 10000, phase_l3_watts: 10000, feeder_length_m: 0, generator_required: false }, as: ProductionManager, captures: { pp1: $.data.id } }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: APPROVED }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-001", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief, captures: { a1: $.data.id } }
            - { call: "POST /api/productions/${p1}/pull-list-entries", payload: { asset_id: "${a1}" }, as: WarehouseChief, captures: { e1: $.data.id } }
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: RESERVED }, as: WarehouseChief }
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: PREPPED, prep_window_start: "2026-08-25T09:00:00Z", prep_window_end: "2026-08-25T17:00:00Z" }, as: WarehouseChief }
            - { call: "POST /api/trucks", payload: { plate_no: "T-1", capacity_kg: 10000 }, as: WarehouseChief, captures: { tr1: $.data.id } }
            - { call: "POST /api/productions/${p1}/load-schedules", payload: { truck_id: "${tr1}", direction: LOAD_IN, dock_door_index: 0, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z" }, as: ProductionManager, captures: { ls1: $.data.id } }
            - { call: "POST /api/load-schedules/${ls1}/transition", payload: { to: CONFIRMED }, as: ProductionManager }
            - { call: "POST /api/technicians", payload: { full_name: "Lt One", union_card_no: "U-1001", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager, captures: { t1: $.data.id } }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T18:00:00Z", required_headcount: 1 }, as: ProductionManager, captures: { c1: $.data.id } }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c1}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { as1: $.data.id } }
            - { call: "POST /api/crew-assignments/${as1}/transition", payload: { to: CONFIRMED }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: CONFIRMED }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: READY_FOR_LOADIN }, as: ProductionManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: LOAD_IN }, as: ProductionManager }
            - { call: "POST /api/load-schedules/${ls1}/transition", payload: { to: AUTHORIZED }, as: ProductionManager }
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: OUT, load_schedule_id: "${ls1}" }, as: WarehouseChief }
            - { call: "POST /api/productions/${p1}/damage-reports", payload: { pull_list_entry_id: "${e1}", report_type: DAMAGE }, as: WarehouseChief, captures: { r1: $.data.id } }
            - { call: "POST /api/damage-reports/${r1}/assess", payload: { valuation_method: DEPRECIATED }, as: WarehouseChief }
            - { call: "POST /api/productions/${p1}/inspections", payload: { inspection_type: RIGGING }, as: ProductionManager, captures: { ir: $.data.id } }
            - { call: "POST /api/inspections/${ir}/transition", payload: { to: IN_PROGRESS }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/inspections/${ir}/transition", payload: { to: PASSED }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/productions/${p1}/inspections", payload: { inspection_type: ELECTRICAL }, as: ProductionManager, captures: { ie: $.data.id } }
            - { call: "POST /api/inspections/${ie}/transition", payload: { to: IN_PROGRESS }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/inspections/${ie}/transition", payload: { to: PASSED }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/productions/${p1}/inspections", payload: { inspection_type: FINAL }, as: ProductionManager, captures: { if_: $.data.id } }
            - { call: "POST /api/inspections/${if_}/transition", payload: { to: IN_PROGRESS }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/inspections/${if_}/transition", payload: { to: PASSED }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T20:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: SHOW_COMPLETE }, as: ProductionManager }
            - { call: "POST /api/crew-assignments/${as1}/transition", payload: { to: WORKED, worked_hours: 8.00 }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: COMPLETED }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: LOAD_OUT }, as: ProductionManager }
            - { call: "POST /api/load-schedules/${ls1}/transition", payload: { to: COMPLETE }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: CLOSED }, as: ProductionManager }
          trigger:
            - { call: "POST /api/productions/${p1}/settlement", payload: {}, as: ProductionManager, captures: { st1: $.data.id, st_prov_dmg: $.data.provisional_damage_cents, st_prov_grand: $.data.provisional_grand_total_cents, st_grand0: $.data.grand_total_cents } }
            - { call: "POST /api/damage-reports/${r1}/transition", payload: { to: WAIVED }, as: ProductionManager }
            - { call: "POST /api/settlements/${st1}/transition", payload: { to: ISSUED }, as: ProductionManager, captures: { st_dmg_final: $.data.damage_total_cents, st_grand_final: $.data.grand_total_cents } }
            - { call: "GET /api/settlements/${st1}", as: ProductionManager, captures: { st_prov_after: $.data.provisional_grand_total_cents } }
          assert:
            - "SettlementStatement.${st1}.provisional_damage_cents == 80000 at creation (ASSESSED report included in the provisional variant)"
            - "SettlementStatement.${st1}.provisional_grand_total_cents == 185000 (100000 labor + 5000 equipment + 80000 provisional damage)"
            - "grand_total_cents at creation == 105000 (CHARGED-only variant: no report charged yet)"
            - "after waive + ISSUED: damage_total_cents == 0 and grand_total_cents == 105000, while provisional_grand_total_cents stays frozen at 185000"

  - rule_id: combinatorial_formula
    instances:
      - name: rigging_factored_load_conditional_factors
        grounds:
          - calculations.rigging_point_factored_load
          - entities.RiggingPoint.fields.factored_load_kg
          - entities.RiggingPoint.fields.utilization
        distinguishing_aspect: |
          Mode (a) — a >=3-input formula with conditional branches on entity state: with
          deadweight 100 kg and 2 motors, BRIDLE yields (100x1.10 + 40) x 1.15 = 172.50 kg
          while STRAIGHT yields 150.00 kg for identical numeric inputs; only the hang_type
          branch differs. Utilization is computed at 4dp against the 500 kg point capacity.
        test_recipe:
          setup:
            - "IATSE venue V1 (max_point_capacity_kg 500); production P1 in PLANNING; plot PL1 in DRAFT at version 1"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
          trigger:
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "B1", bay_index: 0, hang_type: BRIDLE, motor_count: 2, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp_b: $.data.id, rp_b_load: $.data.factored_load_kg, rp_b_util: $.data.utilization } }
            - { call: "GET /api/plots/${pl1}", as: RiggingSupervisor, captures: { plv1: $.data.version, pl_total: $.data.total_factored_load_kg } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "S1", bay_index: 0, hang_type: STRAIGHT, motor_count: 2, deadweight_kg: 100, expected_plot_version: "${plv1}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp_s: $.data.id, rp_s_load: $.data.factored_load_kg, rp_s_util: $.data.utilization } }
          assert:
            - "RiggingPoint.${rp_b}.factored_load_kg == 172.50 and utilization == 0.3450"
            - "RiggingPoint.${rp_s}.factored_load_kg == 150.00 and utilization == 0.3000"
            - "after the BRIDLE point alone, plot.total_factored_load_kg == 172.50 (observed via GET before the second create)"

      - name: crew_labor_per_line_rounding_order
        grounds:
          - calculations.crew_call_labor_cost
          - entities.CrewCall.fields.labor_cost_cents
          - entities.CrewAssignment.fields.labor_charge_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters and the scaffold pins per-line-first:
          two NON_UNION assignments at 6667 cents/h each working 10.50h (10 ST + 0.5 OT1 x1.5 =
          10.75 paid hours) round to 71670 cents per line, so the call totals 143340; the
          forbidden sum-then-round order would yield round(143340.50) = 143341 — one cent apart.
        test_recipe:
          setup:
            - "NON_UNION venue V2; production P2 PLANNING; crew call LIGHTING 2026-09-01T08:00:00Z..2026-09-01T18:00:00Z headcount 2, PUBLISHED"
            - "Technicians T1 and T2 (LIGHTING_TECH, hourly_rate_cents 6667) assigned, CONFIRMED, and each reported 10.50 worked hours; call CONFIRMED; clock at 2026-09-01T18:00:00Z"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Hall NonUnion", union_ruleset: NON_UNION, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v2: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v2}", name: "P2", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p2: $.data.id } }
            - { call: "POST /api/productions/${p2}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/technicians", payload: { full_name: "Lt One", union_card_no: "U-1001", classification: LIGHTING_TECH, hourly_rate_cents: 6667 }, as: ProductionManager, captures: { t1: $.data.id } }
            - { call: "POST /api/technicians", payload: { full_name: "Lt Two", union_card_no: "U-1002", classification: LIGHTING_TECH, hourly_rate_cents: 6667 }, as: ProductionManager, captures: { t2: $.data.id } }
            - { call: "POST /api/productions/${p2}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T18:00:00Z", required_headcount: 2 }, as: ProductionManager, captures: { c2: $.data.id } }
            - { call: "POST /api/crew-calls/${c2}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c2}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { a1: $.data.id } }
            - { call: "POST /api/crew-calls/${c2}/assignments", payload: { technician_id: "${t2}" }, as: ProductionManager, captures: { a2: $.data.id } }
            - { call: "POST /api/crew-assignments/${a1}/transition", payload: { to: CONFIRMED }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/crew-assignments/${a2}/transition", payload: { to: CONFIRMED }, as: CrewChief, as_user_id: "${t2}" }
            - { call: "POST /api/crew-assignments/${a1}/transition", payload: { to: WORKED, worked_hours: 10.50 }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/crew-assignments/${a2}/transition", payload: { to: WORKED, worked_hours: 10.50 }, as: CrewChief, as_user_id: "${t2}" }
            - { call: "POST /api/crew-calls/${c2}/transition", payload: { to: CONFIRMED }, as: ProductionManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T18:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/crew-calls/${c2}/transition", payload: { to: COMPLETED }, as: ProductionManager, captures: { call_total: $.data.labor_cost_cents } }
            - { call: "GET /api/crew-assignments/${a1}", as: ProductionManager, captures: { a1_charge: $.data.labor_charge_cents } }
            - { call: "GET /api/crew-assignments/${a2}", as: ProductionManager, captures: { a2_charge: $.data.labor_charge_cents } }
          assert:
            - "CrewAssignment.${a1}.labor_charge_cents == 71670 (round_half_up(6667 x 10.75) = round_half_up(71670.25))"
            - "CrewAssignment.${a2}.labor_charge_cents == 71670"
            - "CrewCall.${c2}.labor_cost_cents == 143340 (per-line sum), NOT 143341 (sum-then-round)"

      - name: power_sizing_pinned_evaluation_order
        grounds:
          - calculations.power_distribution_sizing
          - entities.PowerPlan.fields.total_load_watts
          - entities.PowerPlan.fields.required_kva
          - entities.PowerPlan.fields.selected_generator_tier_kva
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: feeder loss is a
          function of the phase subtotal, and the generator tier is a function of the
          loss-inclusive total; with 3x10000 W and a 200 m feeder, the pinned order yields
          total_load_watts 31800.00, required_kva 44.17, tier 45 — computing loss on the total
          (wrong order) or sizing on the pre-loss subtotal (41.67 kva, still tier 45 but a
          different stored required_kva) produces observably different persisted fields.
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 in PLANNING; power plan PP1 in DRAFT with 10000 W per phase, feeder_length_m 200, generator_required true"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/power-plans", payload: { phase_l1_watts: 10000, phase_l2_watts: 10000, phase_l3_watts: 10000, feeder_length_m: 200, generator_required: true }, as: ProductionManager, captures: { pp1: $.data.id } }
          trigger:
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: SUBMITTED }, as: ProductionManager, captures: { pp_total: $.data.total_load_watts, pp_kva: $.data.required_kva, pp_tier: $.data.selected_generator_tier_kva, pp_imb: $.data.max_phase_imbalance_pct, pp_status: $.data.status } }
          assert:
            - "PowerPlan.${pp1}.status == SUBMITTED"
            - "total_load_watts == 31800.00 (30000 + 30000 x 0.03 x 2)"
            - "required_kva == 44.17 (31800 / (0.9 x 0.8 x 1000), 2dp round_half_up)"
            - "selected_generator_tier_kva == 45 and max_phase_imbalance_pct == 0.0000"

  - rule_id: non_linear_state_machine
    instances:
      - name: lighting_plot_revision_cycle
        grounds:
          - state_machines.LightingPlot.DRAFT_to_SUBMITTED
          - state_machines.LightingPlot.SUBMITTED_to_DRAFT
          - state_machines.LightingPlot.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on LightingPlot: DRAFT -> SUBMITTED -> DRAFT (engineering reject with
          reason) -> SUBMITTED -> APPROVED; the rejection_reason field is set by the reject hop
          and cleared by the resubmit hop, proving the loop is a true cycle rather than two
          linear pipelines.
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 PLANNING; plot PL1 DRAFT with one RESERVED point (DEAD_HANG 100 kg)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1 }
          trigger:
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager, captures: { s1: $.data.status } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: DRAFT, rejection_reason: "Trim heights missing" }, as: StructuralEngineer, as_user_id: eng-1, captures: { s2: $.data.status, s2_reason: $.data.rejection_reason } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager, captures: { s3: $.data.status, s3_reason: $.data.rejection_reason } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1, captures: { s4: $.data.status, s4_by: $.data.approved_by_user_id } }
          assert:
            - "status sequence observed: SUBMITTED -> DRAFT -> SUBMITTED -> APPROVED"
            - "rejection_reason == 'Trim heights missing' after reject and null after resubmit"
            - "approved_by_user_id == 'eng-1' after the final hop"

      - name: safety_inspection_reinspection_loop
        grounds:
          - state_machines.SafetyInspection.IN_PROGRESS_to_FAILED
          - state_machines.SafetyInspection.FAILED_to_SCHEDULED
          - state_machines.SafetyInspection.SCHEDULED_to_IN_PROGRESS
        distinguishing_aspect: |
          Cyclic machine on SafetyInspection (a different entity than LightingPlot):
          SCHEDULED -> IN_PROGRESS -> FAILED -> SCHEDULED (attempt_no increments to 2,
          inspector_user_id and findings reset) -> IN_PROGRESS -> PASSED — the loop counter is
          observable and monotonic across cycles.
        test_recipe:
          setup:
            - "Production P1 at IATSE venue V1 in LOAD_IN with its plot's single point APPROVED (full readiness chain executed); a RIGGING inspection IR scheduled; clock at 2026-09-01T08:00:00Z"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp1: $.data.id } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "POST /api/productions/${p1}/power-plans", payload: { phase_l1_watts: 10000, phase_l2_watts: 10000, phase_l3_watts: 10000, feeder_length_m: 0, generator_required: false }, as: ProductionManager, captures: { pp1: $.data.id } }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: APPROVED }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/technicians", payload: { full_name: "Lt One", union_card_no: "U-1001", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager, captures: { t1: $.data.id } }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T18:00:00Z", required_headcount: 1 }, as: ProductionManager, captures: { c1: $.data.id } }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c1}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { as1: $.data.id } }
            - { call: "POST /api/crew-assignments/${as1}/transition", payload: { to: CONFIRMED }, as: CrewChief, as_user_id: "${t1}" }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: CONFIRMED }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: READY_FOR_LOADIN }, as: ProductionManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: LOAD_IN }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/inspections", payload: { inspection_type: RIGGING }, as: ProductionManager, captures: { ir: $.data.id, ir_attempt0: $.data.attempt_no } }
          trigger:
            - { call: "POST /api/inspections/${ir}/transition", payload: { to: IN_PROGRESS }, as: SafetyInspector, as_user_id: si-1 }
            - { call: "POST /api/inspections/${ir}/transition", payload: { to: FAILED, findings: "Secondary steel not safetied" }, as: SafetyInspector, as_user_id: si-1, captures: { f_status: $.data.status, f_attempt: $.data.attempt_no } }
            - { call: "POST /api/inspections/${ir}/transition", payload: { to: SCHEDULED }, as: ProductionManager, captures: { r_status: $.data.status, r_attempt: $.data.attempt_no, r_inspector: $.data.inspector_user_id } }
            - { call: "POST /api/inspections/${ir}/transition", payload: { to: IN_PROGRESS }, as: SafetyInspector, as_user_id: si-2 }
            - { call: "POST /api/inspections/${ir}/transition", payload: { to: PASSED }, as: SafetyInspector, as_user_id: si-2, captures: { p_status: $.data.status } }
          assert:
            - "attempt_no == 1 after the first failure, == 2 after reschedule"
            - "inspector_user_id is null immediately after reschedule (reset for the new cycle)"
            - "final status == PASSED after the second cycle; production remains LOAD_IN (RIGGING pass does not certify)"

      - name: rigging_point_reject_revise_cycle
        grounds:
          - state_machines.RiggingPoint.UNDER_REVIEW_to_REJECTED
          - state_machines.RiggingPoint.REJECTED_to_RESERVED
          - state_machines.RiggingPoint.RESERVED_to_UNDER_REVIEW
          - state_machines.RiggingPoint.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on RiggingPoint (third distinct entity): RESERVED -> UNDER_REVIEW ->
          REJECTED -> RESERVED (revise with reduced load, recomputing factored_load_kg from
          450.00 to 400.00) -> UNDER_REVIEW -> APPROVED, with the version pin re-captured on
          the second submission.
        test_recipe:
          setup:
            - "IATSE venue V1 (point capacity 500); production P1 PLANNING; plot PL1 SUBMITTED; point RP1 created at DEAD_HANG 450 kg, currently UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 450, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp1: $.data.id } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1 }
          trigger:
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: REJECTED }, as: StructuralEngineer, as_user_id: eng-1, captures: { rj: $.data.status } }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: RESERVED, deadweight_kg: 400, motor_count: 0 }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rv_status: $.data.status, rv_load: $.data.factored_load_kg } }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1, captures: { ap_status: $.data.status, ap_by: $.data.reviewed_by_user_id } }
          assert:
            - "status sequence: REJECTED -> RESERVED -> (UNDER_REVIEW) -> APPROVED"
            - "factored_load_kg recomputed to 400.00 on revise (DEAD_HANG factor 1.00, no motors)"
            - "reviewed_by_user_id == 'eng-1' and SoD held (submitter rig-1 != approver eng-1)"

  - rule_id: transitive_cascade
    instances:
      - name: entry_cancel_waitlist_promotion_chain
        grounds:
          - state_machines.PullListEntry.RESERVED_to_CANCELLED
          - state_machines.EquipmentAsset.RESERVED_to_AVAILABLE
          - state_machines.PullListEntry.REQUESTED_to_RESERVED
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          Depth-4 transitive cascade triggered by a pull-list cancellation (distinct trigger
          from the production-cancel cascade): entry E1 -> CANCELLED causes asset A -> AVAILABLE
          (L2), which causes the waitlisted entry E2 of a DIFFERENT production -> RESERVED (L3),
          which re-mutates asset A -> RESERVED (L4). Each hop is caused by the previous
          mutation, not by the original request.
        test_recipe:
          setup:
            - "IATSE venue V1; productions P1 (window 2026-09-01..03) and P2 (window 2026-09-10..12), both PLANNING"
            - "Asset A (MOVING_LIGHT); E1 = P1's entry on A in RESERVED (A is RESERVED); E2 = P2's entry on A in REQUESTED (waitlisted, created after E1 so created_at orders it next)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P2", load_in_at: "2026-09-10T08:00:00Z", show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-12T23:00:00Z" }, as: ProductionManager, captures: { p2: $.data.id } }
            - { call: "POST /api/productions/${p2}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-001", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief, captures: { a1: $.data.id } }
            - { call: "POST /api/productions/${p1}/pull-list-entries", payload: { asset_id: "${a1}" }, as: WarehouseChief, captures: { e1: $.data.id } }
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: RESERVED }, as: WarehouseChief }
            - { call: "POST /api/productions/${p2}/pull-list-entries", payload: { asset_id: "${a1}" }, as: WarehouseChief, captures: { e2: $.data.id, e2_status: $.data.status } }
          trigger:
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: CANCELLED }, as: WarehouseChief }
            - { call: "GET /api/pull-list-entries/${e2}", as: WarehouseChief, captures: { e2_after: $.data.status } }
            - { call: "GET /api/assets/${a1}", as: WarehouseChief, captures: { a1_after: $.data.status } }
          assert:
            - "PullListEntry.${e1}.status == CANCELLED"
            - "PullListEntry.${e2}.status == RESERVED (promoted by the cascade, never touched directly)"
            - "EquipmentAsset.${a1}.status == RESERVED after the chain (AVAILABLE was only an intermediate hop)"

      - name: production_cancel_cascade_chain
        grounds:
          - state_machines.Production.PLANNING_to_CANCELLED
          - state_machines.CrewCall.PUBLISHED_to_CANCELLED
          - state_machines.CrewAssignment.transitions
          - state_machines.RiggingPoint.transitions
        distinguishing_aspect: |
          Depth-3 transitive cascade from a different trigger (production cancellation, not a
          pull-list action): Production -> CANCELLED causes its PUBLISHED crew call -> CANCELLED
          (L2), which causes the call's ASSIGNED assignment -> CANCELLED (L3); sibling branches
          of the same cascade move the RESERVED rigging point -> RELEASED and the RESERVED pull
          entry -> CANCELLED with its asset -> AVAILABLE.
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 PLANNING with: plot PL1 DRAFT holding point RP1 (RESERVED); asset A1 with entry E1 RESERVED; crew call C1 PUBLISHED with assignment AS1 ASSIGNED"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp1: $.data.id } }
            - { call: "POST /api/assets", payload: { asset_tag: "ML-001", asset_class: MOVING_LIGHT, weight_kg: 25, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief, captures: { a1: $.data.id } }
            - { call: "POST /api/productions/${p1}/pull-list-entries", payload: { asset_id: "${a1}" }, as: WarehouseChief, captures: { e1: $.data.id } }
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: RESERVED }, as: WarehouseChief }
            - { call: "POST /api/technicians", payload: { full_name: "Lt One", union_card_no: "U-1001", classification: LIGHTING_TECH, hourly_rate_cents: 10000 }, as: ProductionManager, captures: { t1: $.data.id } }
            - { call: "POST /api/productions/${p1}/crew-calls", payload: { department: LIGHTING, call_start: "2026-09-01T08:00:00Z", call_end: "2026-09-01T18:00:00Z", required_headcount: 1 }, as: ProductionManager, captures: { c1: $.data.id } }
            - { call: "POST /api/crew-calls/${c1}/transition", payload: { to: PUBLISHED }, as: ProductionManager }
            - { call: "POST /api/crew-calls/${c1}/assignments", payload: { technician_id: "${t1}" }, as: ProductionManager, captures: { as1: $.data.id } }
          trigger:
            - { call: "POST /api/productions/${p1}/transition", payload: { to: CANCELLED }, as: ProductionManager, captures: { p1_after: $.data.status } }
            - { call: "GET /api/crew-calls/${c1}", as: ProductionManager, captures: { c1_after: $.data.status } }
            - { call: "GET /api/crew-assignments/${as1}", as: ProductionManager, captures: { as1_after: $.data.status } }
            - { call: "GET /api/rigging-points/${rp1}", as: ProductionManager, captures: { rp1_after: $.data.status } }
            - { call: "GET /api/pull-list-entries/${e1}", as: ProductionManager, captures: { e1_after: $.data.status } }
            - { call: "GET /api/assets/${a1}", as: ProductionManager, captures: { a1_after: $.data.status } }
          assert:
            - "Production.${p1}.status == CANCELLED"
            - "CrewCall.${c1}.status == CANCELLED (L2) and CrewAssignment.${as1}.status == CANCELLED (L3)"
            - "RiggingPoint.${rp1}.status == RELEASED and PullListEntry.${e1}.status == CANCELLED"
            - "EquipmentAsset.${a1}.status == AVAILABLE (freed by the entry cascade; no waitlist pending)"

      - name: plot_approval_supersede_cascade
        grounds:
          - state_machines.LightingPlot.SUBMITTED_to_APPROVED
          - state_machines.LightingPlot.APPROVED_to_SUPERSEDED
          - state_machines.RiggingPoint.transitions
        distinguishing_aspect: |
          Depth-3 cascade from a third distinct trigger (plot approval): approving plot PL2
          causes sibling plot PL1 -> SUPERSEDED (L2), which causes PL1's APPROVED point RP1 ->
          RELEASED (L3) and recomputes PL1.total_factored_load_kg from 100.00 to 0 — a
          supersede propagating through two entity boundaries.
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 PLANNING; plot PL1 APPROVED with point RP1 APPROVED (full engineering flow); plot PL2 SUBMITTED with point RP2 RESERVED (DEAD_HANG 100, label B1)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig v1", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, pl1v0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${pl1v0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp1: $.data.id } }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
            - { call: "POST /api/plots/${pl1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1 }
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1 }
            - { call: "GET /api/productions/${p1}", as: ProductionManager, captures: { pv2: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig v2", expected_production_version: "${pv2}" }, as: ProductionManager, captures: { pl2: $.data.id, pl2v0: $.data.version } }
            - { call: "POST /api/plots/${pl2}/rigging-points", payload: { point_label: "B1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${pl2v0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp2: $.data.id } }
            - { call: "POST /api/plots/${pl2}/transition", payload: { to: SUBMITTED }, as: ProductionManager }
          trigger:
            - { call: "POST /api/plots/${pl2}/transition", payload: { to: APPROVED }, as: StructuralEngineer, as_user_id: eng-1, captures: { pl2_after: $.data.status } }
            - { call: "GET /api/plots/${pl1}", as: ProductionManager, captures: { pl1_status: $.data.status, pl1_load: $.data.total_factored_load_kg } }
            - { call: "GET /api/rigging-points/${rp1}", as: ProductionManager, captures: { rp1_after: $.data.status } }
          assert:
            - "LightingPlot.${pl2}.status == APPROVED"
            - "LightingPlot.${pl1}.status == SUPERSEDED and total_factored_load_kg == 0 (all its points released by the cascade)"
            - "RiggingPoint.${rp1}.status == RELEASED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_over_safety_on_power_plan_approve
        grounds:
          - validations[priority=8]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PHASE_IMBALANCE]
        distinguishing_aspect: |
          Error-category pair (state, business_safety): approving a power plan that is both in
          the wrong state (DRAFT — its imbalanced phases already failed SUBMITTED) and still
          carrying the imbalance must yield ERR_INVALID_STATE (priority 8), never
          ERR_PHASE_IMBALANCE (priority 14).
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 PLANNING; power plan PP1 created with phases 40000/40000/30000 (imbalance 25%) — its earlier SUBMITTED attempt failed with ERR_PHASE_IMBALANCE, leaving it DRAFT"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/productions/${p1}/power-plans", payload: { phase_l1_watts: 40000, phase_l2_watts: 40000, phase_l3_watts: 30000, feeder_length_m: 0, generator_required: false }, as: ProductionManager, captures: { pp1: $.data.id } }
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: SUBMITTED }, as: ProductionManager, captures: { submit_err: $.data.error_id } }
          trigger:
            - { call: "POST /api/power-plans/${pp1}/transition", payload: { to: APPROVED }, as: SafetyInspector, as_user_id: si-1, captures: { ap_err: $.data.error_id } }
          assert:
            - "setup confirms the failed submit returned ERR_PHASE_IMBALANCE and the plan stayed DRAFT"
            - "the approve attempt on the still-DRAFT, still-imbalanced plan returns error_id ERR_INVALID_STATE (HTTP 409), not ERR_PHASE_IMBALANCE"

      - name: safety_over_referential_on_checkout
        grounds:
          - validations[priority=15]
          - validations[priority=32]
          - errors[ERR_TRUCK_OVERLOAD]
          - errors[ERR_SCHEDULE_NOT_AUTHORIZED]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_referential): checking out a 600 kg
          asset against a truck of capacity 500 kg whose schedule is still PLANNED violates
          both the pack-weight safety rule and the authorized-schedule referential rule; the
          safety error ERR_TRUCK_OVERLOAD (priority 15) must win over
          ERR_SCHEDULE_NOT_AUTHORIZED (priority 32).
        test_recipe:
          setup:
            - "IATSE venue V1; production P1 PLANNING; asset A1 (weight 600) with entry E1 PREPPED; truck T1 capacity 500 with a PLANNED LOAD_IN schedule LS1 (never confirmed/authorized)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager }
            - { call: "POST /api/assets", payload: { asset_tag: "TRUSS-001", asset_class: TRUSS_12IN, weight_kg: 600, daily_rate_cents: 5000, replacement_cost_cents: 100000, acquired_at: "2024-08-01T00:00:00Z" }, as: WarehouseChief, captures: { a1: $.data.id } }
            - { call: "POST /api/productions/${p1}/pull-list-entries", payload: { asset_id: "${a1}" }, as: WarehouseChief, captures: { e1: $.data.id } }
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: RESERVED }, as: WarehouseChief }
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: PREPPED, prep_window_start: "2026-08-25T09:00:00Z", prep_window_end: "2026-08-25T17:00:00Z" }, as: WarehouseChief }
            - { call: "POST /api/trucks", payload: { plate_no: "T-1", capacity_kg: 500 }, as: WarehouseChief, captures: { tr1: $.data.id } }
            - { call: "POST /api/productions/${p1}/load-schedules", payload: { truck_id: "${tr1}", direction: LOAD_IN, dock_door_index: 0, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z" }, as: ProductionManager, captures: { ls1: $.data.id } }
          trigger:
            - { call: "POST /api/pull-list-entries/${e1}/transition", payload: { to: OUT, load_schedule_id: "${ls1}" }, as: WarehouseChief, captures: { co_err: $.data.error_id } }
          assert:
            - "check-out returns error_id ERR_TRUCK_OVERLOAD (HTTP 422): pack weight 600 x 1.02 = 612.00 > 500"
            - "ERR_SCHEDULE_NOT_AUTHORIZED is NOT returned even though LS1 is PLANNED (safety precedes referential)"
            - "PullListEntry.${e1}.status remains PREPPED"

      - name: temporal_over_referential_on_engineering_submit
        grounds:
          - validations[priority=24]
          - validations[priority=28]
          - errors[ERR_ENGINEERING_DEADLINE_PASSED]
          - errors[ERR_PLOT_NOT_SUBMITTED]
        distinguishing_aspect: |
          Error-category pair (business_temporal, business_referential): submitting a point to
          engineering after the 72-hour deadline while its plot is still DRAFT violates both
          rules; the temporal error ERR_ENGINEERING_DEADLINE_PASSED (priority 24) must win over
          ERR_PLOT_NOT_SUBMITTED (priority 28).
        test_recipe:
          setup:
            - "IATSE venue V1 (engineering_submission_lead_hours 72); production P1 PLANNING with load_in_at 2026-09-01T08:00:00Z (deadline 2026-08-29T08:00:00Z); plot PL1 DRAFT with point RP1 RESERVED; logical clock at 2026-08-30T08:00:00Z (past the deadline)"
          setup_api_calls:
            - { call: "POST /api/venues", payload: { name: "Arena IATSE", union_ruleset: IATSE, max_point_capacity_kg: 500, bay_aggregate_limit_kg: 2000, house_power_amps_per_phase: 200, dock_doors: 2, min_call_hours: 4, ot1_threshold_hours: 8, ot2_threshold_hours: 12, turnaround_min_hours: 8, crew_call_publish_lead_hours: 48, engineering_submission_lead_hours: 72 }, as: ProductionManager, captures: { v1: $.data.id } }
            - { call: "POST /api/productions", payload: { venue_id: "${v1}", name: "P1", load_in_at: "2026-09-01T08:00:00Z", show_at: "2026-09-02T19:00:00Z", load_out_at: "2026-09-03T23:00:00Z" }, as: ProductionManager, captures: { p1: $.data.id, pv0: $.data.version } }
            - { call: "POST /api/productions/${p1}/transition", payload: { to: PLANNING }, as: ProductionManager, captures: { pv1: $.data.version } }
            - { call: "POST /api/productions/${p1}/plots", payload: { title: "Main Rig", expected_production_version: "${pv1}" }, as: ProductionManager, captures: { pl1: $.data.id, plv0: $.data.version } }
            - { call: "POST /api/plots/${pl1}/rigging-points", payload: { point_label: "A1", bay_index: 0, hang_type: DEAD_HANG, motor_count: 0, deadweight_kg: 100, expected_plot_version: "${plv0}" }, as: RiggingSupervisor, as_user_id: rig-1, captures: { rp1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T08:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/rigging-points/${rp1}/transition", payload: { to: UNDER_REVIEW }, as: RiggingSupervisor, as_user_id: rig-1, captures: { er_err: $.data.error_id } }
          assert:
            - "returns error_id ERR_ENGINEERING_DEADLINE_PASSED (HTTP 422), not ERR_PLOT_NOT_SUBMITTED"
            - "RiggingPoint.${rp1}.status remains RESERVED"

  - rule_id: boundary_precision_check
    instances:
      - name: rigging_utilization_exactly_one_passes
        grounds:
          - calculations.rigging_point_factored_load
          - validations[priority=10]
          - errors[ERR_POINT_OVERLOAD]
        distinguishing_aspect: |
          Numeric-threshold boundary on the rigging-load metric via POST
