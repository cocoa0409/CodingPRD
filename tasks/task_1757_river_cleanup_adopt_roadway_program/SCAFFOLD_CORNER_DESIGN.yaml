            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 3 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
            - { call: "POST /program/events/${e}/supplies", payload: { depot_id: "${d}" }, as: GroupLeader, as_user_id: "${g}", captures: { dist: $.data.id } }
            - { call: "POST /program/supplies/${dist}/return", payload: { returned_vests: 3, returned_grabbers: 2 }, as: GroupLeader, as_user_id: "${g}" }
          trigger:
            - { call: "POST /program/supplies/${dist}/return", payload: { returned_vests: 0, returned_grabbers: 0 }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SUPPLY_ALREADY_RECONCILED"

      - name: open_hazard_blocks_event_creation
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_HAZARD_UNRESOLVED]"]
        distinguishing_aspect: "On an ACTIVE agreement, an unresolved hazard alone blocks event creation with ERR_HAZARD_UNRESOLVED; after acknowledge + resolve the same create succeeds (safety gate lifts only at RESOLVED)."
        test_recipe:
          setup: ["approved agreement; hazard REPORTED on its segment"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/hazards", payload: { segment_id: "${s}", hazard_type: "PROPANE_TANK", description: "tank in shallows", location_note: "MP 5.0" }, as: GroupLeader, as_user_id: "${g}", captures: { h: $.data.id } }
          trigger:
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
            - { call: "POST /program/hazards/${h}/acknowledge", payload: {}, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { err2: $.data.error_id } }
            - { call: "POST /program/hazards/${h}/resolve", payload: { resolution_note: "removed by hazmat crew" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { ok_status: $.data.status } }
          assert:
            - "err == ERR_HAZARD_UNRESOLVED (REPORTED blocks)"
            - "err2 == ERR_HAZARD_UNRESOLVED (ACKNOWLEDGED still blocks)"
            - "ok_status == SCHEDULED (RESOLVED lifts the gate)"

      - name: briefing_with_unknown_waiver_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_WAIVER_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 3) beats safety (priority 7): a briefing naming a non-existent waiver id returns ERR_WAIVER_NOT_FOUND, not ERR_WAIVER_INVALID_ATTENDEE."
        test_recipe:
          setup: ["approved agreement; event SCHEDULED 2026-09-10"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
          trigger:
            - { call: "POST /program/events/${e}/briefing", payload: { attendee_waiver_ids: ["00000000-0000-0000-0000-000000000000"] }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_WAIVER_NOT_FOUND"

      - name: supply_issue_with_unknown_depot_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_DEPOT_NOT_FOUND]"]
        distinguishing_aspect: "Issuing supplies against a non-existent depot_id returns ERR_DEPOT_NOT_FOUND (404) at existence priority, before any allocation or stock check."
        test_recipe:
          setup: ["approved agreement; event SCHEDULED"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
          trigger:
            - { call: "POST /program/events/${e}/supplies", payload: { depot_id: "00000000-0000-0000-0000-000000000000" }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DEPOT_NOT_FOUND"

      - name: segment_double_adoption_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SEGMENT_NOT_AVAILABLE]", state_machines.RoadSegment]
        distinguishing_aspect: "A second application against an ADOPTED segment fails at creation with ERR_SEGMENT_NOT_AVAILABLE; and when two PENDING applications raced through review, approving the second also fails because the first approval flipped the segment to ADOPTED."
        test_recipe:
          setup: ["segment adopted by group A's approved agreement; group B's application submitted afterward; and a separate segment with two PENDING applications of which one gets approved"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Group A", org_type: "CIVIC", contact_name: "A Lead", contact_email: "a@a.org" }, as: GroupLeader, captures: { ga: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "Alpha Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { sa: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${ga}", segment_id: "${sa}", contact_email: "a@a.org" }, as: GroupLeader, as_user_id: "${ga}", captures: { aga: $.data.id } }
            - { call: "POST /program/agreements/${aga}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/groups", payload: { name: "Group B", org_type: "SCHOOL", contact_name: "B Lead", contact_email: "b@b.org" }, as: GroupLeader, captures: { gb: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "Beta Rd", mile_marker_start: 8.0, mile_marker_end: 9.0, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { sb: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${ga}", segment_id: "${sb}", contact_email: "a@a.org" }, as: GroupLeader, as_user_id: "${ga}", captures: { agb1: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${gb}", segment_id: "${sb}", contact_email: "b@b.org" }, as: GroupLeader, as_user_id: "${gb}", captures: { agb2: $.data.id } }
          trigger:
            - { call: "POST /program/agreements", payload: { group_id: "${gb}", segment_id: "${sa}", contact_email: "b@b.org" }, as: GroupLeader, as_user_id: "${gb}", captures: { err1: $.data.error_id } }
            - { call: "POST /program/agreements/${agb1}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/agreements/${agb2}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_SEGMENT_NOT_AVAILABLE (create-time guard on an ADOPTED segment)"
            - "err2 == ERR_SEGMENT_NOT_AVAILABLE (approval-time guard: the first approval flipped the segment)"

      - name: clock_rejects_backward_move
        claim_type: violation_to_error
        grounds: [endpoints, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "The logical clock only moves forward: setting 2026-07-01 after 2026-09-10 returns ERR_INVALID_REQUEST and the clock stays put."
        test_recipe:
          setup: ["clock advanced to 2026-09-10"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T00:00:00Z" }, as: ProgramCoordinator, captures: { now: $.data.current_utc } }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "now == 2026-09-12T00:00:00Z (forward moves still work; the rejected move had no effect)"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: success_envelope_shape_on_object_and_array
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every success response wraps data in the fixed envelope: meta.api_request_id + meta.api_request_timestamp present, response_type object for single-entity reads and array for list reads with the four pagination fields."
        test_recipe:
          setup: ["one group registered"]
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
          trigger:
            - { call: "GET /program/groups/${g}", payload: {}, as: ProgramCoordinator }
            - { call: "GET /program/agreements", payload: {}, as: ProgramCoordinator }
          assert:
            - "GET single: response_type == object; meta.api_request_id non-empty; meta.api_request_timestamp is ISO8601"
            - "GET list: response_type == array and data carries limit/offset/total_count/has_more with defaults limit == 10, offset == 0"

      - name: error_envelope_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every error response uses the fixed error envelope: response_type error with data.error_id and data.message both present."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /program/groups/00000000-0000-0000-0000-000000000000", payload: {}, as: ProgramCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "response_type == error and err == ERR_GROUP_NOT_FOUND and data.message is a non-empty string"

      - name: metrics_computed_read_empty_program
        claim_type: computed_read
        grounds: [calculations.program_metrics]
        distinguishing_aspect: "On an empty program the computed read returns zeros across all six metrics rather than erroring."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /program/metrics", payload: {}, as: ProgramCoordinator, captures: { m_active: $.data.active_agreements, m_adopted: $.data.adopted_miles, m_avail: $.data.available_miles, m_debris: $.data.total_debris_lbs, m_cleanups: $.data.completed_cleanups, m_hazards: $.data.open_hazards } }
          assert:
            - "m_active == 0 and m_adopted == 0.0 and m_avail == 0.0"
            - "m_debris == 0.0 and m_cleanups == 0 and m_hazards == 0"

      - name: partial_supply_return_then_completion
        claim_type: action_endpoint
        grounds: [state_machines.SupplyDistribution.ISSUED_to_PARTIALLY_RETURNED, state_machines.SupplyDistribution.PARTIALLY_RETURNED_to_RECONCILED]
        distinguishing_aspect: "A partial return moves the distribution ISSUED -> PARTIALLY_RETURNED (depot restocked only by the returned amount), and a later return with mark_remaining_lost=true writes off the balance: lost_grabbers 1 recorded, depot grabbers pool permanently down by 1."
        test_recipe:
          setup: ["depot 100 bags/40 vests/20 grabbers; approved agreement; event V=3 issued (vests 3, grabbers 2, bags 15)"]
          setup_api_calls:
            - { call: "POST /program/depots", payload: { name: "South Depot", bags_on_hand: 100, vests_on_hand: 40, grabbers_on_hand: 20 }, as: ProgramCoordinator, captures: { d: $.data.id } }
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 3 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
            - { call: "POST /program/events/${e}/supplies", payload: { depot_id: "${d}" }, as: GroupLeader, as_user_id: "${g}", captures: { dist: $.data.id } }
          trigger:
            - { call: "POST /program/supplies/${dist}/return", payload: { returned_vests: 3, returned_grabbers: 1 }, as: GroupLeader, as_user_id: "${g}", captures: { st1: $.data.status } }
            - { call: "POST /program/supplies/${dist}/return", payload: { returned_vests: 0, returned_grabbers: 0, mark_remaining_lost: true }, as: ProgramCoordinator, captures: { st2: $.data.status, lost_g: $.data.lost_grabbers } }
            - { call: "GET /program/depots/${d}", payload: {}, as: ProgramCoordinator, captures: { dep_grab: $.data.grabbers_on_hand, dep_lost_g: $.data.lost_grabbers_total } }
          assert:
            - "st1 == PARTIALLY_RETURNED"
            - "st2 == RECONCILED and lost_g == 1 (2 issued - 1 returned)"
            - "dep_grab == 19 and dep_lost_g == 1 (lost unit written off, not restocked; 19 + 0 outstanding + 1 lost == 20 pool_total)"

