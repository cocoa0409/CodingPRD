          Discrete aggregate boundary rather than a temporal one, and it is approached from a
          non-obvious direction: with capacity_units 5 and SIZE_UNITS QUEEN 2 / TWIN 1, two QUEEN
          slots leave booked_units 4, so a third QUEEN (6 > 5) must be refused while a TWIN
