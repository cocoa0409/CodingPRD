scenario: "Child Welfare & Foster Care: hotline intake/screening, investigation/safety assessment, removal/placement, foster home licensing/matching, case plan/visitation, dependency hearing, permanency (reunification/adoption), aging-out"
domain_name: child-welfare-foster-care
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - scheduled_actions

  entity_topology: graph
  # Child <-> Case <-> Placement <-> FosterHome form a cross-referenced graph;
  # Referral/Investigation feed the graph; Visitation/Hearing/CasePlan hang off Case.

  state_machine_shape: branching
  # Referral screens IN or OUT (fork); Case reunifies OR adopts OR APPLA (fork);
  # Placement may DISRUPT and loop back to a new placement (cycle). Mix of
  # branching forks and a disruption cycle on Placement.

  relationship_patterns:
    - one_to_many        # Case -> Child, Case -> Hearing, Case -> Visitation, FosterHome -> Placement
    - cross_aggregate    # Placement spans Child aggregate and FosterHome aggregate
    - polymorphic        # (light) Visitation participant is a Child; subject of Investigation is a Referral

  role_model: segregation_of_duties
  # The IntakeScreener who screens a Referral IN cannot be the assigned Investigator
  # on the resulting Investigation (conflict-free fact-finding). LicensingWorker owns
  # FosterHome licensing; Caseworker owns Case/Placement/Plan; Judge owns Hearings.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Caseworker
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Caseworker legal name.
      - name: role_type
        type: enum
        source: input
        description: Which segregated duty this worker performs.
        constraints: "one of {SCREENER, INVESTIGATOR, CASEWORKER, LICENSING}"
      - name: email
        type: string
        source: input
        description: Unique login email.
        constraints: "unique across all Caseworker rows"
      - name: active
        type: boolean
        source: input
        default: true
        description: Whether the worker may be assigned new work.

  # ---------------------------------------------------------------------------
  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: Intake lifecycle status.
        constraints: "one of {RECEIVED, SCREENED_IN, SCREENED_OUT, LINKED}"
      - name: reporter_type
        type: enum
        source: input
        description: Who called the hotline.
        constraints: "one of {MANDATED, ANONYMOUS, RELATIVE, SELF}"
      - name: child_name
        type: string
        source: input
        description: Alleged victim child name as reported.
      - name: alleged_maltreatment
        type: enum
        source: input
        description: Primary alleged maltreatment type.
        constraints: "one of {PHYSICAL_ABUSE, SEXUAL_ABUSE, NEGLECT, EMOTIONAL_ABUSE}"
      - name: priority_factors
        type: array
        source: input
        description: List of present danger factor codes asserted by the reporter.
        constraints: "subset of {PRIOR_REPORT, CAREGIVER_SUBSTANCE, INJURY_VISIBLE, AGE_UNDER_3, NO_CAREGIVER}"
      - name: response_priority
        type: enum
        source: computed
        description: Computed response timeframe from screening score; null until screened.
        constraints: "one of {P1_24H, P2_72H, P3_10D} or null"
      - name: screening_score
        type: integer
        source: computed
        description: Weighted intake risk score; null until screened.
      - name: screened_in_by
        type: string
        source: system
        description: "FK -> Caseworker.id; the SCREENER who screened this referral IN; null otherwise."
      - name: linked_case_id
        type: string
        source: system
        description: "FK -> Case.id; set when a screened-in referral is linked to an opened Case; null otherwise."

  # ---------------------------------------------------------------------------
  - name: Investigation
    parent: null
    common_fields: true
    fields:
      - name: referral_id
        type: string
        source: input
        description: "FK -> Referral.id; the screened-in referral under investigation."
      - name: investigator_id
        type: string
        source: input
        description: "FK -> Caseworker.id; the assigned INVESTIGATOR (must differ from screened_in_by)."
      - name: status
        type: enum
        source: system
        default: ASSIGNED
        description: Investigation lifecycle.
        constraints: "one of {ASSIGNED, IN_PROGRESS, SAFE, UNSAFE, CONDITIONALLY_SAFE}"
      - name: safety_factors
        type: array
        source: input
        description: Danger-factor codes confirmed during the home visit.
        constraints: "subset of {NO_FOOD, VIOLENCE_PRESENT, SUPERVISION_ABSENT, MEDICAL_NEGLECT, DRUG_ENV, UNSAFE_SLEEP}"
      - name: protective_capacity
        type: integer
        source: input
        description: Caregiver protective-capacity rating, 0..10, recorded at visit.
        constraints: "integer 0..10"
      - name: safety_decision_score
        type: integer
        source: computed
        description: Computed weighted safety score; null until decision recorded.
      - name: removal_recommended
        type: boolean
        source: computed
        description: Whether the computed decision recommends removal; null until decision recorded.

  # ---------------------------------------------------------------------------
  - name: Case
    parent: null
    common_fields: true
    fields:
      - name: investigation_id
        type: string
        source: input
        description: "FK -> Investigation.id; the UNSAFE/CONDITIONALLY_SAFE investigation that opened this case."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Dependency case lifecycle.
        constraints: "one of {OPEN, IN_PLACEMENT, PERMANENCY_PLANNING, CLOSED_REUNIFIED, CLOSED_ADOPTED, CLOSED_APPLA}"
      - name: removal_date
        type: datetime
        source: system
        description: UTC timestamp the child was first removed into care; null until first placement; anchors the ASFA permanency clock.
      - name: permanency_goal
        type: enum
        source: system
        default: REUNIFICATION
        description: Current concurrent permanency goal.
        constraints: "one of {REUNIFICATION, ADOPTION, APPLA}"
      - name: months_in_care
        type: integer
        source: computed
        description: Whole months elapsed from removal_date to the current clock; 0 when not yet removed.
      - name: tpr_clock_breached
        type: boolean
        source: computed
        description: True once the child has been in care 15 of the most recent 22 months (ASFA filing trigger).

  # ---------------------------------------------------------------------------
  - name: Child
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the dependency case this child belongs to."
      - name: full_name
        type: string
        source: input
        description: Child legal name.
      - name: date_of_birth
        type: datetime
        source: input
        description: UTC date of birth; drives age and aging-out eligibility.
      - name: status
        type: enum
        source: system
        default: IN_HOME
        description: Child placement lifecycle.
        constraints: "one of {IN_HOME, REMOVED, PLACED, TRIAL_HOME_VISIT, PERMANENT, AGED_OUT}"
      - name: current_placement_id
        type: string
        source: system
        description: "FK -> Placement.id; the child's currently ACTIVE placement; null when not placed."
      - name: age_years
        type: integer
        source: computed
        description: Whole years from date_of_birth to the current clock.

  # ---------------------------------------------------------------------------
  - name: FosterHome
    parent: null
    common_fields: true
    fields:
      - name: licensing_worker_id
        type: string
        source: input
        description: "FK -> Caseworker.id; the LICENSING worker who owns this home's license."
      - name: home_name
        type: string
        source: input
        description: Foster family / facility name.
      - name: bed_capacity
        type: integer
        source: input
        description: Maximum number of concurrent ACTIVE placements (beds) the home may hold at once.
        constraints: "integer >= 1"
      - name: license_status
        type: enum
        source: system
        default: PENDING
        description: Licensing lifecycle.
        constraints: "one of {PENDING, LICENSED, PROVISIONAL, SUSPENDED, EXPIRED}"
      - name: license_expires_at
        type: datetime
        source: system
        description: UTC instant the license lapses; null until first licensed.
      - name: max_age_years
        type: integer
        source: input
        description: Oldest child age (years) this home is licensed to accept.
        constraints: "integer 0..21"
      - name: accepts_maltreatment
        type: array
        source: input
        description: Maltreatment categories this home will accept matched children for.
        constraints: "subset of {PHYSICAL_ABUSE, SEXUAL_ABUSE, NEGLECT, EMOTIONAL_ABUSE}"
      - name: active_placement_count
        type: integer
        source: computed
        description: Count of this home's placements currently in ACTIVE state.
      - name: clearances_complete
        type: boolean
        source: computed
        description: True only when every CaregiverScreening for this home is CLEARED.

  # ---------------------------------------------------------------------------
  - name: CaregiverScreening
    parent: null
    common_fields: true
    fields:
      - name: foster_home_id
        type: string
        source: input
        description: "FK -> FosterHome.id; the home this household-member background check belongs to."
      - name: member_name
        type: string
        source: input
        description: Household member full name.
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Background-check lifecycle.
        constraints: "one of {PENDING, CLEARED, FLAGGED}"
      - name: disqualifying
        type: boolean
        source: input
        default: false
        description: Whether the returned record contains a disqualifying offense.

  # ---------------------------------------------------------------------------
  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id; the placed child."
      - name: foster_home_id
        type: string
        source: input
        description: "FK -> FosterHome.id; the home holding the bed."
      - name: case_id
        type: string
        source: system
        description: "FK -> Case.id; copied from the child's case at placement time."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: Placement lifecycle.
        constraints: "one of {ACTIVE, DISRUPTED, ENDED_REUNIFIED, ENDED_ADOPTED}"
      - name: start_at
        type: datetime
        source: system
        description: UTC instant the placement began (current clock at creation).
      - name: end_at
        type: datetime
        source: system
        description: UTC instant the placement ended; null while ACTIVE.
      - name: match_score
        type: integer
        source: computed
        description: Computed child-to-home match suitability score recorded at creation.

  # ---------------------------------------------------------------------------
  - name: CasePlan
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the case this plan governs."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Case-plan lifecycle.
        constraints: "one of {DRAFT, ACTIVE, REVISION, COMPLETED}"
      - name: required_visits_per_month
        type: integer
        source: input
        description: Number of parent-child visits the plan mandates per month.
        constraints: "integer 0..12"
      - name: objectives_total
        type: integer
        source: input
        description: Total count of reunification objectives in this plan.
        constraints: "integer >= 1"
      - name: objectives_met
        type: integer
        source: system
        default: 0
        description: Count of objectives marked complete so far.
      - name: compliance_pct
        type: number
        source: computed
        description: Percent of objectives met, recomputed on every objective update.

  # ---------------------------------------------------------------------------
  - name: Visitation
    parent: null
    common_fields: true
    fields:
      - name: case_plan_id
        type: string
        source: input
        description: "FK -> CasePlan.id; the plan that mandates this visit."
      - name: child_id
        type: string
        source: input
        description: "FK -> Child.id; the child attending the visit."
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Visit lifecycle.
        constraints: "one of {SCHEDULED, OCCURRED, MISSED, CANCELLED}"
      - name: supervision
        type: enum
        source: input
        description: Required supervision level.
        constraints: "one of {SUPERVISED, UNSUPERVISED}"
      - name: window_start
        type: datetime
        source: input
        description: UTC start of the scheduled visit window.
      - name: window_end
        type: datetime
        source: input
        description: UTC end of the scheduled visit window; must be after window_start.

  # ---------------------------------------------------------------------------
  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> Case.id; the dependency case being heard."
      - name: hearing_type
        type: enum
        source: input
        description: Statutory hearing type.
        constraints: "one of {SHELTER, ADJUDICATION, DISPOSITION, REVIEW, PERMANENCY, TPR}"
      - name: status
        type: enum
        source: system
        default: SCHEDULED
        description: Hearing lifecycle.
        constraints: "one of {SCHEDULED, HELD, CONTINUED, VACATED}"
      - name: scheduled_at
        type: datetime
        source: input
        description: UTC instant the hearing is set for.
      - name: ruling
        type: enum
        source: input
        description: Judge ruling recorded when the hearing is HELD; null otherwise.
        constraints: "one of {CONTINUE_PLACEMENT, RETURN_HOME, CHANGE_GOAL_ADOPTION, TERMINATE_RIGHTS} or null"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Referral
    initial_state: RECEIVED
    terminal_states: [SCREENED_OUT, LINKED]
    transitions:
      - from: RECEIVED
        to: SCREENED_IN
        trigger: "POST /referrals/{id}/screen"
        actor: IntakeScreener
        preconditions:
          - "referral.status == RECEIVED"
          - "computed screening_score >= SCREEN_IN_THRESHOLD (45)"
        side_effects:
          - "compute screening_score via intake_screening_score calculation"
          - "set response_priority from screening_score band"
          - "set screened_in_by = acting SCREENER's id (X-User-ID)"
          - "increments Referral.version by 1"
        note: "Branch A of the screen fork: score at or above threshold."
      - from: RECEIVED
        to: SCREENED_OUT
        trigger: "POST /referrals/{id}/screen"
        actor: IntakeScreener
        preconditions:
          - "referral.status == RECEIVED"
          - "computed screening_score < SCREEN_IN_THRESHOLD (45)"
        side_effects:
          - "compute screening_score via intake_screening_score calculation"
          - "set response_priority from screening_score band"
          - "increments Referral.version by 1"
        note: "Branch B of the screen fork: below threshold; terminal, no investigation."
      - from: SCREENED_IN
        to: LINKED
        trigger: "system event: Case opened from this referral's Investigation"
        actor: system
        preconditions:
          - "referral.status == SCREENED_IN"
          - "a Case was created from an Investigation whose referral_id == this referral"
        side_effects:
          - "set linked_case_id = new Case.id"
          - "increments Referral.version by 1"
        note: "Bubble-up: opening a Case marks the originating referral LINKED."

  # ---------------------------------------------------------------------------
  - entity: Investigation
    initial_state: ASSIGNED
    terminal_states: [SAFE, UNSAFE, CONDITIONALLY_SAFE]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /investigations/{id}/start"
        actor: Investigator
        preconditions:
          - "investigation.status == ASSIGNED"
          - "investigation.investigator_id == acting INVESTIGATOR (X-User-ID)"
        side_effects:
          - "increments Investigation.version by 1"
      - from: IN_PROGRESS
        to: SAFE
        trigger: "POST /investigations/{id}/decision"
        actor: Investigator
        preconditions:
          - "investigation.status == IN_PROGRESS"
          - "computed safety_decision_score < UNSAFE_THRESHOLD (40) and no NO_CAREGIVER-equivalent factor"
        side_effects:
          - "compute safety_decision_score via safety_assessment_score calculation"
          - "set removal_recommended = false"
          - "increments Investigation.version by 1"
        note: "Branch: safe finding, no case opens."
      - from: IN_PROGRESS
        to: CONDITIONALLY_SAFE
        trigger: "POST /investigations/{id}/decision"
        actor: Investigator
        preconditions:
          - "investigation.status == IN_PROGRESS"
          - "computed safety_decision_score in [UNSAFE_THRESHOLD (40), REMOVAL_THRESHOLD (70))"
        side_effects:
          - "compute safety_decision_score via safety_assessment_score calculation"
          - "set removal_recommended = false (in-home safety plan)"
          - "increments Investigation.version by 1"
        note: "Branch: safety plan keeps child in home; a Case may still open."
      - from: IN_PROGRESS
        to: UNSAFE
        trigger: "POST /investigations/{id}/decision"
        actor: Investigator
        preconditions:
          - "investigation.status == IN_PROGRESS"
          - "computed safety_decision_score >= REMOVAL_THRESHOLD (70)"
        side_effects:
          - "compute safety_decision_score via safety_assessment_score calculation"
          - "set removal_recommended = true"
          - "increments Investigation.version by 1"
        note: "Branch: removal recommended."

  # ---------------------------------------------------------------------------
  - entity: Case
    initial_state: OPEN
    terminal_states: [CLOSED_REUNIFIED, CLOSED_ADOPTED, CLOSED_APPLA]
    transitions:
      - from: OPEN
        to: IN_PLACEMENT
        trigger: "POST /placements (first placement for a child on this case)"
        actor: Caseworker
        preconditions:
          - "case.status == OPEN"
          - "the placed child belongs to this case"
        side_effects:
          - "set case.removal_date = current clock if still null (anchors ASFA clock)"
          - "set child.status = PLACED"
          - "increments Case.version by 1"
        note: "Cascade origin: first placement removes the child and starts the permanency clock."
      - from: IN_PLACEMENT
        to: PERMANENCY_PLANNING
        trigger: "POST /cases/{id}/advance-permanency"
        actor: Caseworker
        preconditions:
          - "case.status == IN_PLACEMENT"
          - "a PERMANENCY hearing for this case is HELD"
        side_effects:
          - "increments Case.version by 1"
      - from: PERMANENCY_PLANNING
        to: CLOSED_REUNIFIED
        trigger: "POST /cases/{id}/close"
        actor: Caseworker
        preconditions:
          - "case.status == PERMANENCY_PLANNING"
          - "case.permanency_goal == REUNIFICATION"
          - "the case's CasePlan.status == COMPLETED"
          - "the child's active placement (if any) is ENDED_REUNIFIED"
        side_effects:
          - "set child.status = PERMANENT"
          - "increments Case.version by 1"
        note: "Branch A of permanency fork."
      - from: PERMANENCY_PLANNING
        to: CLOSED_ADOPTED
        trigger: "POST /cases/{id}/close"
        actor: Caseworker
        preconditions:
          - "case.status == PERMANENCY_PLANNING"
          - "case.permanency_goal == ADOPTION"
          - "a TPR hearing for this case is HELD with ruling == TERMINATE_RIGHTS"
        side_effects:
          - "set child.status = PERMANENT"
          - "increments Case.version by 1"
        note: "Branch B of permanency fork."
      - from: PERMANENCY_PLANNING
        to: CLOSED_APPLA
        trigger: "POST /cases/{id}/close"
        actor: Caseworker
        preconditions:
          - "case.status == PERMANENCY_PLANNING"
          - "case.permanency_goal == APPLA"
          - "the child's age_years >= 16"
        side_effects:
          - "set child.status = PERMANENT"
          - "increments Case.version by 1"
        note: "Branch C of permanency fork (Another Planned Permanent Living Arrangement)."

  # ---------------------------------------------------------------------------
  - entity: Child
    initial_state: IN_HOME
    terminal_states: [PERMANENT, AGED_OUT]
    transitions:
      - from: IN_HOME
        to: PLACED
        trigger: "POST /placements (first placement)"
        actor: Caseworker
        preconditions:
          - "child.status == IN_HOME"
          - "child.case_id is set"
        side_effects:
          - "set child.current_placement_id = new Placement.id"
          - "set child.status = PLACED"
          - "increments Child.version by 1"
        note: "Driven by placement creation; the Case machine also fires on this event."
      - from: REMOVED
        to: PLACED
        trigger: "POST /placements (re-placement of a disrupted child)"
        actor: Caseworker
        preconditions:
          - "child.status == REMOVED"
          - "child.case_id is set"
        side_effects:
          - "set child.current_placement_id = new Placement.id"
          - "set child.status = PLACED"
          - "increments Child.version by 1"
        note: "Cycle: a child REMOVED by disruption/suspension/expiry is re-placed into a new home; the Case is already IN_PLACEMENT so removal_date is unchanged."
      - from: PLACED
        to: TRIAL_HOME_VISIT
        trigger: "POST /children/{id}/trial-home-visit"
        actor: Caseworker
        preconditions:
          - "child.status == PLACED"
          - "the case's CasePlan.compliance_pct >= TRIAL_VISIT_COMPLIANCE (80)"
          - "case.permanency_goal == REUNIFICATION"
        side_effects:
          - "increments Child.version by 1"
        note: "Reunification trial: child physically home but legally in care."
      - from: TRIAL_HOME_VISIT
        to: PLACED
        trigger: "POST /children/{id}/revoke-trial"
        actor: Caseworker
        preconditions:
          - "child.status == TRIAL_HOME_VISIT"
        side_effects:
          - "increments Child.version by 1"
        note: "Cycle: a failed trial returns the child to PLACED."
      - from: PLACED
        to: PERMANENT
        trigger: "system event: Case closed (reunified/adopted/APPLA)"
        actor: system
        preconditions:
          - "child.status in {PLACED, TRIAL_HOME_VISIT}"
          - "owning Case transitioned to a CLOSED_* state"
        side_effects:
          - "increments Child.version by 1"
      - from: PLACED
        to: AGED_OUT
        trigger: "POST /children/{id}/age-out"
        actor: Caseworker
        preconditions:
          - "child.status in {PLACED, TRIAL_HOME_VISIT}"
          - "child.age_years >= AGING_OUT_AGE (18)"
        side_effects:
          - "if child has an ACTIVE placement, transition that placement to DISRUPTED and decrement the home's active_placement_count"
          - "increments Child.version by 1"
        note: "Emancipation; releases the bed."

  # ---------------------------------------------------------------------------
  - entity: FosterHome
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: LICENSED
        trigger: "POST /foster-homes/{id}/license"
        actor: LicensingWorker
        preconditions:
          - "foster_home.license_status == PENDING"
          - "foster_home.clearances_complete == true (every CaregiverScreening CLEARED)"
        side_effects:
          - "set license_expires_at = current clock + LICENSE_TERM_DAYS (365)"
          - "increments FosterHome.version by 1"
      - from: PENDING
        to: PROVISIONAL
        trigger: "POST /foster-homes/{id}/license-provisional"
        actor: LicensingWorker
        preconditions:
          - "foster_home.license_status == PENDING"
          - "at least one CaregiverScreening is still PENDING and none is FLAGGED"
        side_effects:
          - "set license_expires_at = current clock + PROVISIONAL_TERM_DAYS (90)"
          - "increments FosterHome.version by 1"
        note: "Branch: provisional license allows placement before full clearances."
      - from: PROVISIONAL
        to: LICENSED
        trigger: "POST /foster-homes/{id}/license"
        actor: LicensingWorker
        preconditions:
          - "foster_home.license_status == PROVISIONAL"
          - "foster_home.clearances_complete == true"
        side_effects:
          - "set license_expires_at = current clock + LICENSE_TERM_DAYS (365)"
          - "increments FosterHome.version by 1"
      - from: LICENSED
        to: SUSPENDED
        trigger: "POST /foster-homes/{id}/suspend"
        actor: LicensingWorker
        preconditions:
          - "foster_home.license_status == LICENSED"
        side_effects:
          - "for each ACTIVE placement in this home, transition placement to DISRUPTED and set child.status = REMOVED and clear child.current_placement_id"
          - "set active_placement_count = 0"
          - "increments FosterHome.version by 1"
        note: "Cascade down: suspending a home disrupts all its active placements."
      - from: SUSPENDED
        to: LICENSED
        trigger: "POST /foster-homes/{id}/reinstate"
        actor: LicensingWorker
        preconditions:
          - "foster_home.license_status == SUSPENDED"
          - "foster_home.clearances_complete == true"
        side_effects:
          - "set license_expires_at = current clock + LICENSE_TERM_DAYS (365)"
          - "increments FosterHome.version by 1"
        note: "Cycle: SUSPENDED -> LICENSED."
      - from: LICENSED
        to: EXPIRED
        trigger: "POST /foster-homes/{id}/expire-check (system clock past license_expires_at)"
        actor: system
        preconditions:
          - "foster_home.license_status in {LICENSED, PROVISIONAL}"
          - "current clock > foster_home.license_expires_at"
        side_effects:
          - "for each ACTIVE placement in this home, transition placement to DISRUPTED and set child.status = REMOVED and clear child.current_placement_id"
          - "set active_placement_count = 0"
          - "increments FosterHome.version by 1"
        note: "Terminal; lapse disrupts placements like suspension."

  # ---------------------------------------------------------------------------
  - entity: CaregiverScreening
    initial_state: PENDING
    terminal_states: [CLEARED, FLAGGED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /caregiver-screenings/{id}/resolve"
        actor: LicensingWorker
        preconditions:
          - "caregiver_screening.status == PENDING"
          - "caregiver_screening.disqualifying == false"
        side_effects:
          - "recompute owning FosterHome.clearances_complete"
          - "increments CaregiverScreening.version by 1"
        note: "Clean record clears."
      - from: PENDING
        to: FLAGGED
        trigger: "POST /caregiver-screenings/{id}/resolve"
        actor: LicensingWorker
        preconditions:
          - "caregiver_screening.status == PENDING"
          - "caregiver_screening.disqualifying == true"
        side_effects:
          - "recompute owning FosterHome.clearances_complete (stays false)"
          - "increments CaregiverScreening.version by 1"
        note: "Disqualifying record flags; the home can never be fully licensed while any screening is FLAGGED."

  # ---------------------------------------------------------------------------
  - entity: Placement
    initial_state: ACTIVE
    terminal_states: [DISRUPTED, ENDED_REUNIFIED, ENDED_ADOPTED]
    transitions:
      - from: ACTIVE
        to: DISRUPTED
        trigger: "POST /placements/{id}/disrupt"
        actor: Caseworker
        preconditions:
          - "placement.status == ACTIVE"
        side_effects:
          - "set placement.end_at = current clock"
          - "set child.status = REMOVED and clear child.current_placement_id"
          - "decrement foster_home.active_placement_count by 1"
          - "increments Placement.version by 1"
        note: "Cycle origin: a disrupted child is REMOVED and may be re-placed via a new Placement."
      - from: ACTIVE
        to: ENDED_REUNIFIED
        trigger: "POST /placements/{id}/end-reunified"
        actor: Caseworker
        preconditions:
          - "placement.status == ACTIVE"
          - "the child's case.permanency_goal == REUNIFICATION"
          - "the case's CasePlan.status == COMPLETED"
        side_effects:
          - "set placement.end_at = current clock"
          - "decrement foster_home.active_placement_count by 1"
          - "increments Placement.version by 1"
      - from: ACTIVE
        to: ENDED_ADOPTED
        trigger: "POST /placements/{id}/end-adopted"
        actor: Caseworker
        preconditions:
          - "placement.status == ACTIVE"
          - "the child's case.permanency_goal == ADOPTION"
          - "a TPR hearing for the case is HELD with ruling == TERMINATE_RIGHTS"
        side_effects:
          - "set placement.end_at = current clock"
          - "decrement foster_home.active_placement_count by 1"
          - "increments Placement.version by 1"

  # ---------------------------------------------------------------------------
  - entity: CasePlan
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /case-plans/{id}/activate"
        actor: Caseworker
        preconditions:
          - "case_plan.status == DRAFT"
          - "a DISPOSITION hearing for the case is HELD"
        side_effects:
          - "increments CasePlan.version by 1"
      - from: ACTIVE
        to: REVISION
        trigger: "POST /case-plans/{id}/revise"
        actor: Caseworker
        preconditions:
          - "case_plan.status == ACTIVE"
        side_effects:
          - "increments CasePlan.version by 1"
        note: "Cycle: plan sent back for revision after a REVIEW hearing."
      - from: REVISION
        to: ACTIVE
        trigger: "POST /case-plans/{id}/activate"
        actor: Caseworker
        preconditions:
          - "case_plan.status == REVISION"
        side_effects:
          - "increments CasePlan.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /case-plans/{id}/complete"
        actor: Caseworker
        preconditions:
          - "case_plan.status == ACTIVE"
          - "case_plan.compliance_pct >= PLAN_COMPLETE_COMPLIANCE (100)"
        side_effects:
          - "increments CasePlan.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Visitation
    initial_state: SCHEDULED
    terminal_states: [OCCURRED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: OCCURRED
        trigger: "POST /visitations/{id}/mark-occurred"
        actor: Caseworker
        preconditions:
          - "visitation.status == SCHEDULED"
          - "current clock >= visitation.window_start"
        side_effects:
          - "increments Visitation.version by 1"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /visitations/{id}/mark-missed"
        actor: Caseworker
        preconditions:
          - "visitation.status == SCHEDULED"
          - "current clock >= visitation.window_end"
        side_effects:
          - "increments Visitation.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /visitations/{id}/cancel"
        actor: Caseworker
        preconditions:
          - "visitation.status == SCHEDULED"
          - "current clock < visitation.window_start"
        side_effects:
          - "increments Visitation.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, VACATED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /hearings/{id}/hold"
        actor: Judge
        preconditions:
          - "hearing.status == SCHEDULED"
          - "current clock >= hearing.scheduled_at"
          - "ruling is provided"
        side_effects:
          - "if ruling == CHANGE_GOAL_ADOPTION set case.permanency_goal = ADOPTION"
          - "if ruling == RETURN_HOME and case.status == PERMANENCY_PLANNING keep goal REUNIFICATION"
          - "increments Hearing.version by 1"
        note: "A HELD PERMANENCY/TPR hearing gates Case permanency transitions."
      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /hearings/{id}/continue"
        actor: Judge
        preconditions:
          - "hearing.status == SCHEDULED"
        side_effects:
          - "increments Hearing.version by 1"
        note: "Cycle: a CONTINUED hearing is rescheduled into a new SCHEDULED hearing."
      - from: CONTINUED
        to: SCHEDULED
        trigger: "POST /hearings/{id}/reschedule"
        actor: Judge
        preconditions:
          - "hearing.status == CONTINUED"
          - "new scheduled_at provided"
        side_effects:
          - "set hearing.scheduled_at = new value"
          - "increments Hearing.version by 1"
      - from: SCHEDULED
        to: VACATED
        trigger: "POST /hearings/{id}/vacate"
        actor: Judge
        preconditions:
          - "hearing.status == SCHEDULED"
        side_effects:
          - "increments Hearing.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: placement-create-stale-foster-home
    parent_entity: FosterHome
    write_endpoint: "POST /placements"
    occ_field: "expected_foster_home_version"
    description: |
      Creating a Placement against a FosterHome whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has just consumed the home's last open bed (a prior placement that
      legitimately filled capacity), so the current writer's view of the home —
      and of its remaining beds — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: license-stale-foster-home
    parent_entity: FosterHome
    write_endpoint: "POST /foster-homes/{id}/license"
    occ_field: "expected_foster_home_version"
    description: |
      Issuing a full license against a FosterHome whose version has advanced since
      the client last observed it is rejected. A prior writer may have already
      added or cleared a CaregiverScreening (bumping the home version), so the
      current licensing decision is made on a stale clearance picture.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- (1) Intake screening score (Referral domain) -------------------------
  - name: intake_screening_score
    trigger: "POST /referrals/{id}/screen"
    algorithm: weighted_scoring
    formula: |
      base = MALTREATMENT_WEIGHT[alleged_maltreatment]
      factor_sum = sum(FACTOR_WEIGHT[f] for f in priority_factors)   # set, no duplicates
      reporter_bonus = REPORTER_BONUS[reporter_type]
      raw = base + factor_sum + reporter_bonus
      screening_score = min(100, raw)                # ceiling clamp at 100
      # Response priority band (computed from the CLAMPED score):
      #   screening_score >= 75            -> P1_24H
      #   45 <= screening_score < 75       -> P2_72H
      #   screening_score < 45             -> P3_10D  (and referral SCREENS OUT)
    input_set: "Single Referral's own input fields at screen time."
    constants:
      SCREEN_IN_THRESHOLD: 45
      P1_BAND: 75
      MALTREATMENT_WEIGHT: { SEXUAL_ABUSE: 50, PHYSICAL_ABUSE: 40, NEGLECT: 25, EMOTIONAL_ABUSE: 20 }
      FACTOR_WEIGHT: { PRIOR_REPORT: 10, CAREGIVER_SUBSTANCE: 12, INJURY_VISIBLE: 15, AGE_UNDER_3: 18, NO_CAREGIVER: 30 }
      REPORTER_BONUS: { MANDATED: 8, RELATIVE: 4, SELF: 2, ANONYMOUS: 0 }
    precision: "integer; min() applied AFTER summation (ceiling clamp), band compares on clamped value"
    variants:
      - name: screen_in
        when: "screening_score >= 45"
        difference: "Referral -> SCREENED_IN, response_priority P1 or P2."
      - name: screen_out
        when: "screening_score < 45"
        difference: "Referral -> SCREENED_OUT (terminal), response_priority P3_10D."

  # --- (2) Safety assessment score (Investigation domain) -------------------
  # Dual-variant pair with (1): DIFFERENT entity domain (Investigation vs Referral),
  # AND combinatorial mode (a): 3+ inputs with nested min/max + conditional branch.
  - name: safety_assessment_score
    trigger: "POST /investigations/{id}/decision"
    algorithm: weighted_scoring
    formula: |
      danger = sum(DANGER_WEIGHT[f] for f in safety_factors)         # set, no duplicates
      # protective_capacity OFFSETS danger but only up to a capped credit:
      credit = min(danger, protective_capacity * PC_MULTIPLIER)      # nested min: credit cannot exceed danger
      net = max(0, danger - credit)                                  # nested max: floor at 0
      # Conditional branch on a categorical present-danger override:
      if "VIOLENCE_PRESENT" in safety_factors or "SUPERVISION_ABSENT" in safety_factors:
          safety_decision_score = max(net, REMOVAL_THRESHOLD)        # force into removal band
      else:
          safety_decision_score = net
      # Decision bands (on safety_decision_score):
      #   >= 70            -> UNSAFE (removal_recommended = true)
      #   40 <= s < 70     -> CONDITIONALLY_SAFE (in-home safety plan)
      #   s < 40           -> SAFE
    input_set: "Single Investigation's safety_factors set + protective_capacity at decision time."
    constants:
      UNSAFE_THRESHOLD: 40
      REMOVAL_THRESHOLD: 70
      PC_MULTIPLIER: 6
      DANGER_WEIGHT: { NO_FOOD: 25, VIOLENCE_PRESENT: 35, SUPERVISION_ABSENT: 30, MEDICAL_NEGLECT: 28, DRUG_ENV: 22, UNSAFE_SLEEP: 18 }
    precision: "integer; evaluate credit (min) then net (max) then conditional override, in that fixed order"
    variants:
      - name: removal
        when: "safety_decision_score >= 70 (or present-danger override fired)"
        difference: "Investigation -> UNSAFE; removal_recommended = true."
      - name: safety_plan
        when: "40 <= safety_decision_score < 70"
        difference: "Investigation -> CONDITIONALLY_SAFE; child stays in home."
      - name: safe
        when: "safety_decision_score < 40"
        difference: "Investigation -> SAFE; no case opens."

  # --- (3) Match score (Placement domain) -----------------------------------
  # Combinatorial mode (c): circular-looking dependency pinned to an evaluation
  # order — base_fit depends on home capacity headroom, which the same placement
  # is about to consume; we PIN that headroom is read BEFORE the new bed is taken.
  - name: placement_match_score
    trigger: "POST /placements"
    algorithm: weighted_scoring
    formula: |
      # Step order is fixed and load-bearing:
      # 1. headroom is read from the home's PRE-placement state (capacity - active_placement_count)
      headroom = foster_home.bed_capacity - foster_home.active_placement_count   # BEFORE this placement increments the count
      # 2. age_fit: penalty grows as child age approaches the home's max_age_years ceiling
      age_gap = foster_home.max_age_years - child.age_years
      age_fit = clamp(age_gap * AGE_FIT_PER_YEAR, 0, AGE_FIT_CAP)                 # min/max clamp
      # 3. maltreatment_fit: full credit only if the case's originating maltreatment is accepted
      malt_fit = MALT_FIT_ACCEPT if (case_maltreatment in foster_home.accepts_maltreatment) else 0
      # 4. capacity_fit rewards homes with more spare beds (but headroom>=1 already gated by validation)
      capacity_fit = min(headroom, CAP_FIT_BEDS) * CAP_FIT_PER_BED
      match_score = age_fit + malt_fit + capacity_fit
    input_set: "One candidate Placement: its Child, its FosterHome (pre-increment), and the child's Case maltreatment."
    constants:
      AGE_FIT_PER_YEAR: 4
      AGE_FIT_CAP: 40
      MALT_FIT_ACCEPT: 30
      CAP_FIT_BEDS: 3
      CAP_FIT_PER_BED: 10
    precision: "integer; headroom read strictly BEFORE active_placement_count is incremented by this placement"
    variants:
      - name: accepting_home
        when: "case maltreatment in foster_home.accepts_maltreatment"
        difference: "malt_fit = 30 added."
      - name: non_accepting_home
        when: "case maltreatment NOT in foster_home.accepts_maltreatment"
        difference: "malt_fit = 0; create still allowed but score lower (placement_match is advisory, not gating)."

  # --- (4) Permanency clock / months-in-care (Case domain) ------------------
  # Combinatorial mode (b): rounding/window ORDER matters — whole-month counting
  # from removal_date, with a pinned 'completed whole months' rule (floor), NOT
  # calendar-day division.
  - name: permanency_clock
    trigger: "computed on read of a Case and on POST /cases/{id}/recompute-clock"
    algorithm: threshold
    formula: |
      if case.removal_date is null:
          months_in_care = 0
          tpr_clock_breached = false
      else:
          # Completed whole months between removal_date and current clock.
          # PIN: count completed month anniversaries (floor), NOT days/30.4.
          months_in_care = completed_whole_months(case.removal_date, current_clock)
          # ASFA 15-of-most-recent-22: with a single continuous removal episode,
          # the child has been in care for `months_in_care` consecutive months,
          # so the 15-of-22 trigger reduces to months_in_care >= TPR_TRIGGER_MONTHS.
          tpr_clock_breached = (months_in_care >= TPR_TRIGGER_MONTHS)
    input_set: "Single Case's removal_date vs current clock."
    constants:
      TPR_TRIGGER_MONTHS: 15
      ASFA_WINDOW_MONTHS: 22
    precision: "integer months; completed-whole-month floor (a removal on the 3rd counts month N only once the same day-of-month is reached)"
    variants:
      - name: under_clock
        when: "months_in_care < 15"
        difference: "tpr_clock_breached = false; no ASFA filing pressure."
      - name: clock_breached
        when: "months_in_care >= 15"
        difference: "tpr_clock_breached = true; agency must file TPR or document a compelling exception."

  # --- (5) Plan compliance percentage (CasePlan domain) ---------------------
  - name: plan_compliance_pct
    trigger: "POST /case-plans/{id}/objectives (every objective update)"
    algorithm: aggregation
    formula: |
      compliance_pct = round( (objectives_met / objectives_total) * 100, 2 )   # round_half_up, 2 dp
    input_set: "Single CasePlan's objectives_met and objectives_total."
    constants:
      TRIAL_VISIT_COMPLIANCE: 80
      PLAN_COMPLETE_COMPLIANCE: 100
    precision: "2 decimal places, round_half_up; objectives_met clamped to [0, objectives_total]"
    variants:
      - name: in_progress
        when: "objectives_met < objectives_total"
        difference: "compliance_pct < 100; plan cannot COMPLETE."
      - name: fully_compliant
        when: "objectives_met == objectives_total"
        difference: "compliance_pct == 100.00; plan eligible to COMPLETE."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right in the path then body FKs."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined (see §1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 5
    category: business_safety
    check: "Segregation of duties: the Investigation's investigator_id MUST NOT equal the originating Referral's screened_in_by."
    error_id: ERR_SOD_CONFLICT
    http_status: 409
    applies_to: "POST /investigations"

  - priority: 6
    category: business_safety
    check: "A child may only be placed in a FosterHome whose license_status is LICENSED or PROVISIONAL (not PENDING/SUSPENDED/EXPIRED)."
    error_id: ERR_HOME_NOT_LICENSED
    http_status: 409
    applies_to: "POST /placements"

  - priority: 7
    category: business_safety
    check: "Background-check gate: a FosterHome with any FLAGGED CaregiverScreening cannot be licensed."
    error_id: ERR_CLEARANCE_FLAGGED
    http_status: 409
    applies_to: "POST /foster-homes/{id}/license, POST /foster-homes/{id}/license-provisional, POST /foster-homes/{id}/reinstate"

  - priority: 8
    category: business_constraint
    check: "Placement age fit: child.age_years MUST be <= foster_home.max_age_years."
    error_id: ERR_AGE_NOT_LICENSED
    http_status: 409
    applies_to: "POST /placements"

  - priority: 9
    category: business_temporal
    check: "Visitation window_end MUST be strictly after window_start."
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /visitations"

  - priority: 10
    category: business_temporal
    check: "Visitation overlap: a SCHEDULED visit for the same child whose [window_start, window_end) half-open interval overlaps an existing SCHEDULED visit for that child is rejected (touching endpoints, end==start, do NOT overlap)."
    error_id: ERR_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /visitations"

  - priority: 11
    category: business_temporal
    check: "Hearing capacity overlap on a Case's docket: a new SCHEDULED hearing whose scheduled_at falls within HEARING_BUFFER_MINUTES (closed buffer, +/- 30 min inclusive) of an existing SCHEDULED hearing on the same case is rejected."
    error_id: ERR_HEARING_OVERLAP
    http_status: 409
    applies_to: "POST /hearings"

  - priority: 12
    category: business_constraint
    check: "Bed capacity: a FosterHome's active_placement_count MUST be < bed_capacity before a new ACTIVE placement is created."
    error_id: ERR_NO_BEDS
    http_status: 409
    applies_to: "POST /placements"

  - priority: 13
    category: business_constraint
    check: "OCC: expected_foster_home_version MUST equal the FosterHome's current version on placement create and full license."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /placements, POST /foster-homes/{id}/license"

  - priority: 14
    category: business_constraint
    check: "Request body field types and enum membership are valid; required fields present."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- system clock (test-driving) -----------------------------------------
  - method: POST
    path: "/_clock/set"
    description: "Set the system UTC clock to a fixed instant (test-driving)."
    roles: [Admin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["all subsequent computed clocks read this instant"]

  # ---- Caseworkers ---------------------------------------------------------
  - method: POST
    path: "/caseworkers"
    description: "Register a caseworker (screener/investigator/caseworker/licensing)."
    roles: [Admin]
    code: 201
    input: [full_name, role_type, email, "active?"]
    output: Caseworker
    side_effects: []
  - method: GET
    path: "/caseworkers/{id}"
    description: "Fetch a caseworker."
    roles: [Admin, IntakeScreener, Investigator, Caseworker, LicensingWorker, Judge]
    code: 200
    input: []
    output: Caseworker
    side_effects: []
  - method: GET
    path: "/caseworkers"
    description: "List caseworkers (filterable by role_type)."
    roles: [Admin]
    code: 200
    input: ["role_type?", "limit?", "offset?"]
    output: Caseworker[]
    side_effects: []

  # ---- Referrals -----------------------------------------------------------
  - method: POST
    path: "/referrals"
    description: "Record a hotline referral."
    roles: [IntakeScreener]
    code: 201
    input: [reporter_type, child_name, alleged_maltreatment, "priority_factors?"]
    output: Referral
    side_effects: ["status=RECEIVED"]
  - method: GET
    path: "/referrals/{id}"
    description: "Fetch a referral."
    roles: [Admin, IntakeScreener, Investigator, Caseworker]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/referrals"
    description: "List referrals (filterable by status, screened_in_by, linked_case_id)."
    roles: [Admin, IntakeScreener, Caseworker]
    code: 200
    input: ["status?", "screened_in_by?", "linked_case_id?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/referrals/{id}/screen"
    description: "Screen a referral IN or OUT; computes screening_score and response_priority."
    roles: [IntakeScreener]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "compute intake_screening_score; set screening_score, response_priority"
      - "branch RECEIVED->SCREENED_IN (set screened_in_by) or RECEIVED->SCREENED_OUT"
      - "increments Referral.version by 1"

  # ---- Investigations ------------------------------------------------------
  - method: POST
    path: "/investigations"
    description: "Open an investigation on a screened-in referral; assign an investigator."
    roles: [Caseworker]
    code: 201
    input: [referral_id, investigator_id, "safety_factors?", "protective_capacity?"]
    output: Investigation
    side_effects: ["status=ASSIGNED"]
  - method: GET
    path: "/investigations/{id}"
    description: "Fetch an investigation."
    roles: [Admin, Caseworker, Investigator]
    code: 200
    input: []
    output: Investigation
    side_effects: []
  - method: GET
    path: "/investigations"
    description: "List investigations (filterable by referral_id, investigator_id, status)."
    roles: [Admin, Caseworker, Investigator]
    code: 200
    input: ["referral_id?", "investigator_id?", "status?", "limit?", "offset?"]
    output: Investigation[]
    side_effects: []
  - method: POST
    path: "/investigations/{id}/start"
    description: "Investigator begins the home visit."
    roles: [Investigator]
    code: 200
    input: []
    output: Investigation
    side_effects: ["ASSIGNED->IN_PROGRESS", "increments Investigation.version by 1"]
  - method: POST
    path: "/investigations/{id}/decision"
    description: "Record safety factors + protective capacity; compute safety decision; branch SAFE/CONDITIONALLY_SAFE/UNSAFE."
    roles: [Investigator]
    code: 200
    input: [safety_factors, protective_capacity]
    output: Investigation
    side_effects:
      - "compute safety_assessment_score; set safety_decision_score, removal_recommended"
      - "branch IN_PROGRESS->SAFE/CONDITIONALLY_SAFE/UNSAFE"
      - "increments Investigation.version by 1"

  # ---- Cases ---------------------------------------------------------------
  - method: POST
    path: "/cases"
    description: "Open a dependency case from an UNSAFE/CONDITIONALLY_SAFE investigation; marks the originating referral LINKED."
    roles: [Caseworker]
    code: 201
    input: [investigation_id]
    output: Case
    side_effects:
      - "status=OPEN; permanency_goal=REUNIFICATION"
      - "set originating Referral.linked_case_id and Referral status RECEIVED->LINKED (bubble-up)"
  - method: GET
    path: "/cases/{id}"
    description: "Fetch a case (includes computed months_in_care, tpr_clock_breached)."
    roles: [Admin, Caseworker, Judge]
    code: 200
    input: []
    output: Case
    side_effects: ["recompute permanency_clock on read"]
  - method: GET
    path: "/cases"
    description: "List cases (filterable by status, permanency_goal, investigation_id)."
    roles: [Admin, Caseworker, Judge]
    code: 200
    input: ["status?", "permanency_goal?", "investigation_id?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/cases/{id}/recompute-clock"
    description: "Recompute and persist months_in_care and tpr_clock_breached against the current clock."
    roles: [Caseworker]
    code: 200
    input: []
    output: Case
    side_effects: ["compute permanency_clock; set months_in_care, tpr_clock_breached"]
  - method: POST
    path: "/cases/{id}/advance-permanency"
    description: "Advance an in-placement case into permanency planning (requires a HELD PERMANENCY hearing)."
    roles: [Caseworker]
    code: 200
    input: []
    output: Case
    side_effects: ["IN_PLACEMENT->PERMANENCY_PLANNING", "increments Case.version by 1"]
  - method: POST
    path: "/cases/{id}/close"
    description: "Close the case to its permanency outcome (reunified/adopted/APPLA); cascades child to PERMANENT."
    roles: [Caseworker]
    code: 200
    input: []
    output: Case
    side_effects:
      - "PERMANENCY_PLANNING->CLOSED_REUNIFIED/CLOSED_ADOPTED/CLOSED_APPLA per permanency_goal + gates"
      - "set child.status = PERMANENT (cascade)"
      - "increments Case.version by 1"

  # ---- Children ------------------------------------------------------------
  - method: POST
    path: "/children"
    description: "Register a child on an open case."
    roles: [Caseworker]
    code: 201
    input: [case_id, full_name, date_of_birth]
    output: Child
    side_effects: ["status=IN_HOME"]
  - method: GET
    path: "/children/{id}"
    description: "Fetch a child (includes computed age_years)."
    roles: [Admin, Caseworker, Judge]
    code: 200
    input: []
    output: Child
    side_effects: ["recompute age_years on read"]
  - method: GET
    path: "/children"
    description: "List children (filterable by case_id, status, current_placement_id)."
    roles: [Admin, Caseworker, Judge]
    code: 200
    input: ["case_id?", "status?", "current_placement_id?", "limit?", "offset?"]
    output: Child[]
    side_effects: []
  - method: POST
    path: "/children/{id}/trial-home-visit"
    description: "Begin a reunification trial home visit."
    roles: [Caseworker]
    code: 200
    input: []
    output: Child
    side_effects: ["PLACED->TRIAL_HOME_VISIT", "increments Child.version by 1"]
  - method: POST
    path: "/children/{id}/revoke-trial"
    description: "Revoke a failing trial; return child to PLACED."
    roles: [Caseworker]
    code: 200
    input: []
    output: Child
    side_effects: ["TRIAL_HOME_VISIT->PLACED", "increments Child.version by 1"]
  - method: POST
    path: "/children/{id}/age-out"
    description: "Emancipate a child who has reached aging-out age; releases the bed."
    roles: [Caseworker]
    code: 200
    input: []
    output: Child
    side_effects:
      - "PLACED/TRIAL_HOME_VISIT->AGED_OUT"
      - "if active placement exists, disrupt it and decrement home active_placement_count (cascade)"
      - "increments Child.version by 1"

  # ---- Foster homes --------------------------------------------------------
  - method: POST
    path: "/foster-homes"
    description: "Register a foster home (PENDING license)."
    roles: [LicensingWorker]
    code: 201
    input: [licensing_worker_id, home_name, bed_capacity, max_age_years, accepts_maltreatment]
    output: FosterHome
    side_effects: ["license_status=PENDING"]
  - method: GET
    path: "/foster-homes/{id}"
    description: "Fetch a foster home (includes computed active_placement_count, clearances_complete)."
    roles: [Admin, LicensingWorker, Caseworker]
    code: 200
    input: []
    output: FosterHome
    side_effects: ["recompute active_placement_count, clearances_complete on read"]
  - method: GET
    path: "/foster-homes"
    description: "List foster homes (filterable by license_status, licensing_worker_id)."
    roles: [Admin, LicensingWorker, Caseworker]
    code: 200
    input: ["license_status?", "licensing_worker_id?", "limit?", "offset?"]
    output: FosterHome[]
    side_effects: []
  - method: POST
    path: "/foster-homes/{id}/license"
    description: "Issue a full license (all clearances CLEARED required); OCC-guarded."
    roles: [LicensingWorker]
    code: 200
    input: [expected_foster_home_version]
    output: FosterHome
    side_effects:
      - "PENDING/PROVISIONAL->LICENSED; set license_expires_at"
      - "increments FosterHome.version by 1"
  - method: POST
    path: "/foster-homes/{id}/license-provisional"
    description: "Issue a provisional license (no FLAGGED clearance; at least one still PENDING)."
    roles: [LicensingWorker]
    code: 200
    input: []
    output: FosterHome
    side_effects: ["PENDING->PROVISIONAL; set license_expires_at", "increments FosterHome.version by 1"]
  - method: POST
    path: "/foster-homes/{id}/suspend"
    description: "Suspend a licensed home; disrupts all active placements (cascade)."
    roles: [LicensingWorker]
    code: 200
    input: []
    output: FosterHome
    side_effects:
      - "LICENSED->SUSPENDED"
      - "disrupt every ACTIVE placement; set each child REMOVED; zero active_placement_count (cascade)"
      - "increments FosterHome.version by 1"
  - method: POST
    path: "/foster-homes/{id}/reinstate"
    description: "Reinstate a suspended home (clearances complete required)."
    roles: [LicensingWorker]
    code: 200
    input: []
    output: FosterHome
    side_effects: ["SUSPENDED->LICENSED; set license_expires_at", "increments FosterHome.version by 1"]
  - method: POST
    path: "/foster-homes/{id}/expire-check"
    description: "System sweep: expire a home whose license_expires_at is past the clock; disrupts active placements."
    roles: [Admin]
    code: 200
    input: []
    output: FosterHome
    side_effects:
      - "LICENSED/PROVISIONAL->EXPIRED when clock past expiry"
      - "disrupt every ACTIVE placement; set each child REMOVED; zero active_placement_count (cascade)"
      - "increments FosterHome.version by 1"

  # ---- Caregiver screenings -----------------------------------------------
  - method: POST
    path: "/caregiver-screenings"
    description: "Add a household-member background check to a foster home."
    roles: [LicensingWorker]
    code: 201
    input: [foster_home_id, member_name, "disqualifying?"]
    output: CaregiverScreening
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/caregiver-screenings/{id}"
    description: "Fetch a caregiver screening."
    roles: [Admin, LicensingWorker]
    code: 200
    input: []
    output: CaregiverScreening
    side_effects: []
  - method: GET
    path: "/caregiver-screenings"
    description: "List caregiver screenings (filterable by foster_home_id, status)."
    roles: [Admin, LicensingWorker]
    code: 200
    input: ["foster_home_id?", "status?", "limit?", "offset?"]
    output: CaregiverScreening[]
    side_effects: []
  - method: POST
    path: "/caregiver-screenings/{id}/resolve"
    description: "Resolve a pending screening to CLEARED or FLAGGED (FLAGGED when disqualifying)."
    roles: [LicensingWorker]
    code: 200
    input: []
    output: CaregiverScreening
    side_effects:
      - "PENDING->CLEARED (disqualifying==false) or PENDING->FLAGGED (disqualifying==true)"
      - "recompute owning FosterHome.clearances_complete"
      - "increments CaregiverScreening.version by 1"

  # ---- Placements ----------------------------------------------------------
  - method: POST
    path: "/placements"
    description: "Place a child into a licensed home's bed; OCC-guarded on the home; computes match_score."
    roles: [Caseworker]
    code: 201
    input: [child_id, foster_home_id, expected_foster_home_version]
    output: Placement
    side_effects:
      - "status=ACTIVE; compute placement_match_score; copy case_id from child"
      - "increment foster_home.active_placement_count; increments FosterHome.version by 1"
      - "child IN_HOME->PLACED; set child.current_placement_id"
      - "if first placement on case: case OPEN->IN_PLACEMENT, set case.removal_date (cascade)"
  - method: GET
    path: "/placements/{id}"
    description: "Fetch a placement."
    roles: [Admin, Caseworker, LicensingWorker]
    code: 200
    input: []
    output: Placement
    side_effects: []
  - method: GET
    path: "/placements"
    description: "List placements (filterable by child_id, foster_home_id, case_id, status)."
    roles: [Admin, Caseworker, LicensingWorker]
    code: 200
    input: ["child_id?", "foster_home_id?", "case_id?", "status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []
  - method: POST
    path: "/placements/{id}/disrupt"
    description: "Disrupt an active placement; child REMOVED, bed released (cascade)."
    roles: [Caseworker]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "ACTIVE->DISRUPTED; set end_at"
      - "child PLACED/TRIAL_HOME_VISIT->REMOVED; clear current_placement_id; decrement home active_placement_count (cascade)"
      - "increments Placement.version by 1"
  - method: POST
    path: "/placements/{id}/end-reunified"
    description: "End an active placement to reunification (plan COMPLETED + goal REUNIFICATION)."
    roles: [Caseworker]
    code: 200
    input: []
    output: Placement
    side_effects: ["ACTIVE->ENDED_REUNIFIED; set end_at; decrement home active_placement_count", "increments Placement.version by 1"]
  - method: POST
    path: "/placements/{id}/end-adopted"
    description: "End an active placement to adoption (TPR HELD + goal ADOPTION)."
    roles: [Caseworker]
    code: 200
    input: []
    output: Placement
    side_effects: ["ACTIVE->ENDED_ADOPTED; set end_at; decrement home active_placement_count", "increments Placement.version by 1"]

  # ---- Case plans ----------------------------------------------------------
  - method: POST
    path: "/case-plans"
    description: "Create a case plan (DRAFT) for a case."
    roles: [Caseworker]
    code: 201
    input: [case_id, required_visits_per_month, objectives_total]
    output: CasePlan
    side_effects: ["status=DRAFT; objectives_met=0; compliance_pct=0"]
  - method: GET
    path: "/case-plans/{id}"
    description: "Fetch a case plan (includes computed compliance_pct)."
    roles: [Admin, Caseworker, Judge]
    code: 200
    input: []
    output: CasePlan
    side_effects: []
  - method: GET
    path: "/case-plans"
    description: "List case plans (filterable by case_id, status)."
    roles: [Admin, Caseworker, Judge]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: CasePlan[]
    side_effects: []
  - method: POST
    path: "/case-plans/{id}/objectives"
    description: "Update objectives_met (set to an absolute count); recomputes compliance_pct."
    roles: [Caseworker]
    code: 200
    input: [objectives_met]
    output: CasePlan
    side_effects: ["clamp objectives_met to [0, objectives_total]; compute plan_compliance_pct"]
  - method: POST
    path: "/case-plans/{id}/activate"
    description: "Activate a DRAFT/REVISION plan (DISPOSITION hearing HELD required for DRAFT)."
    roles: [Caseworker]
    code: 200
    input: []
    output: CasePlan
    side_effects: ["DRAFT/REVISION->ACTIVE", "increments CasePlan.version by 1"]
  - method: POST
    path: "/case-plans/{id}/revise"
    description: "Send an active plan back for revision."
    roles: [Caseworker]
    code: 200
    input: []
    output: CasePlan
    side_effects: ["ACTIVE->REVISION", "increments CasePlan.version by 1"]
  - method: POST
    path: "/case-plans/{id}/complete"
    description: "Complete an active plan (compliance_pct >= 100 required)."
    roles: [Caseworker]
    code: 200
    input: []
    output: CasePlan
    side_effects: ["ACTIVE->COMPLETED", "increments CasePlan.version by 1"]

  # ---- Visitations ---------------------------------------------------------
  - method: POST
    path: "/visitations"
    description: "Schedule a parent-child visit under a case plan (window + overlap checks)."
    roles: [Caseworker]
    code: 201
    input: [case_plan_id, child_id, supervision, window_start, window_end]
    output: Visitation
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/visitations/{id}"
    description: "Fetch a visitation."
    roles: [Admin, Caseworker]
    code: 200
    input: []
    output: Visitation
    side_effects: []
  - method: GET
    path: "/visitations"
    description: "List visitations (filterable by case_plan_id, child_id, status)."
    roles: [Admin, Caseworker]
    code: 200
    input: ["case_plan_id?", "child_id?", "status?", "limit?", "offset?"]
    output: Visitation[]
    side_effects: []
  - method: POST
    path: "/visitations/{id}/mark-occurred"
    description: "Mark a scheduled visit as occurred."
    roles: [Caseworker]
    code: 200
    input: []
    output: Visitation
    side_effects: ["SCHEDULED->OCCURRED", "increments Visitation.version by 1"]
  - method: POST
    path: "/visitations/{id}/mark-missed"
    description: "Mark a scheduled visit as missed (window elapsed)."
    roles: [Caseworker]
    code: 200
    input: []
    output: Visitation
    side_effects: ["SCHEDULED->MISSED", "increments Visitation.version by 1"]
  - method: POST
    path: "/visitations/{id}/cancel"
    description: "Cancel a scheduled visit before its window opens."
    roles: [Caseworker]
    code: 200
    input: []
    output: Visitation
    side_effects: ["SCHEDULED->CANCELLED", "increments Visitation.version by 1"]

  # ---- Hearings ------------------------------------------------------------
  - method: POST
    path: "/hearings"
    description: "Schedule a dependency hearing on a case (docket buffer check)."
    roles: [Caseworker, Judge]
    code: 201
    input: [case_id, hearing_type, scheduled_at]
    output: Hearing
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/hearings/{id}"
    description: "Fetch a hearing."
    roles: [Admin, Caseworker, Judge]
    code: 200
    input: []
    output: Hearing
    side_effects: []
  - method: GET
    path: "/hearings"
    description: "List hearings (filterable by case_id, hearing_type, status)."
    roles: [Admin, Caseworker, Judge]
    code: 200
    input: ["case_id?", "hearing_type?", "status?", "limit?", "offset?"]
    output: Hearing[]
    side_effects: []
  - method: POST
    path: "/hearings/{id}/hold"
    description: "Hold a scheduled hearing and record a ruling; may change the case permanency goal."
    roles: [Judge]
    code: 200
    input: [ruling]
    output: Hearing
    side_effects:
      - "SCHEDULED->HELD"
      - "if ruling==CHANGE_GOAL_ADOPTION set case.permanency_goal=ADOPTION (cross-entity)"
      - "increments Hearing.version by 1"
  - method: POST
    path: "/hearings/{id}/continue"
    description: "Continue (pause) a scheduled hearing."
    roles: [Judge]
    code: 200
    input: []
    output: Hearing
    side_effects: ["SCHEDULED->CONTINUED", "increments Hearing.version by 1"]
  - method: POST
    path: "/hearings/{id}/reschedule"
    description: "Reschedule a continued hearing to a new time."
    roles: [Judge]
    code: 200
    input: [scheduled_at]
    output: Hearing
    side_effects: ["CONTINUED->SCHEDULED; set scheduled_at", "increments Hearing.version by 1"]
  - method: POST
    path: "/hearings/{id}/vacate"
    description: "Vacate a scheduled hearing."
    roles: [Judge]
    code: 200
    input: []
    output: Hearing
    side_effects: ["SCHEDULED->VACATED", "increments Hearing.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this endpoint per §1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced resource (path or body FK) does not exist."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body: missing required field, bad type, or invalid enum value."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is defined."
  - id: ERR_SOD_CONFLICT
    http: 409
    condition: "Investigation investigator_id equals the originating referral's screened_in_by (segregation of duties)."
  - id: ERR_REFERRAL_NOT_SCREENED_IN
    http: 409
    condition: "Opening an investigation against a referral whose status is not SCREENED_IN."
  - id: ERR_INVESTIGATION_NOT_REMOVAL
    http: 409
    condition: "Opening a case from an investigation that is not UNSAFE or CONDITIONALLY_SAFE."
  - id: ERR_HOME_NOT_LICENSED
    http: 409
    condition: "Placing a child into a home whose license_status is not LICENSED or PROVISIONAL."
  - id: ERR_CLEARANCE_FLAGGED
    http: 409
    condition: "Licensing a home that has a FLAGGED caregiver screening."
  - id: ERR_CLEARANCES_INCOMPLETE
    http: 409
    condition: "Issuing a full license/reinstating while some caregiver screening is still PENDING."
  - id: ERR_AGE_NOT_LICENSED
    http: 409
    condition: "Child age_years exceeds the foster home's max_age_years."
  - id: ERR_NO_BEDS
    http: 409
    condition: "Foster home active_placement_count has reached bed_capacity."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_foster_home_version does not match the foster home's current version."
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "Visitation window_end is not strictly after window_start."
  - id: ERR_VISIT_OVERLAP
    http: 409
    condition: "A scheduled visit for the same child overlaps an existing scheduled visit (half-open intervals)."
  - id: ERR_HEARING_OVERLAP
    http: 409
    condition: "A new hearing falls within the docket buffer of an existing scheduled hearing on the same case."
  - id: ERR_PLAN_NOT_COMPLETE
    http: 409
    condition: "Completing a plan whose compliance_pct < 100, or ending/closing that requires a COMPLETED plan."
  - id: ERR_GOAL_MISMATCH
    http: 409
    condition: "A permanency action requires a different permanency_goal than the case currently holds."
  - id: ERR_HEARING_PREREQ_MISSING
    http: 409
    condition: "A transition requires a HELD hearing of a specific type (DISPOSITION/PERMANENCY/TPR) that does not exist."
  - id: ERR_AGE_NOT_ELIGIBLE
    http: 409
    condition: "Aging-out attempted on a child below AGING_OUT_AGE, or APPLA close on a child under 16."
  - id: ERR_TPR_NOT_TERMINATED
    http: 409
    condition: "Adoption end/close attempted without a HELD TPR hearing ruling TERMINATE_RIGHTS."
  - id: ERR_VALIDATION_LIMIT
    http: 422
    condition: "A numeric input violates its declared range (e.g., bed_capacity < 1, protective_capacity outside 0..10, objectives_total < 1)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Admin
    description: "Platform operator: registers caseworkers, runs system sweeps and the clock."
    identity: opaque
    exclusive_operations:
      - "POST /caseworkers"
      - "GET /caseworkers (list)"
      - "POST /foster-homes/{id}/expire-check"
      - "POST /_clock/set"
    shared_operations:
      - "all GET reads"

  - name: IntakeScreener
    description: "Hotline intake worker; records and screens referrals. Cannot also investigate a referral they screened in."
    identity: entity_backed:Caseworker
    exclusive_operations:
      - "POST /referrals"
      - "POST /referrals/{id}/screen"
    shared_operations:
      - "GET /referrals, GET /referrals/{id}"

  - name: Investigator
    description: "Conducts the safety assessment for an assigned investigation."
    identity: entity_backed:Caseworker
    exclusive_operations:
      - "POST /investigations/{id}/start"
      - "POST /investigations/{id}/decision"
    shared_operations:
      - "GET /investigations, GET /investigations/{id}, GET /referrals/{id}"

  - name: Caseworker
    description: "Owns the dependency case: opens investigations & cases, places children, manages plans/visits/hearings scheduling."
    identity: entity_backed:Caseworker
    exclusive_operations:
      - "POST /investigations"
      - "POST /cases"
      - "POST /cases/{id}/advance-permanency"
      - "POST /cases/{id}/close"
      - "POST /cases/{id}/recompute-clock"
      - "POST /children"
      - "POST /children/{id}/trial-home-visit"
      - "POST /children/{id}/revoke-trial"
      - "POST /children/{id}/age-out"
      - "POST /placements"
      - "POST /placements/{id}/disrupt"
      - "POST /placements/{id}/end-reunified"
      - "POST /placements/{id}/end-adopted"
      - "POST /case-plans"
      - "POST /case-plans/{id}/objectives"
      - "POST /case-plans/{id}/activate"
      - "POST /case-plans/{id}/revise"
      - "POST /case-plans/{id}/complete"
      - "POST /visitations"
      - "POST /visitations/{id}/mark-occurred"
      - "POST /visitations/{id}/mark-missed"
      - "POST /visitations/{id}/cancel"
    shared_operations:
      - "POST /hearings (with Judge)"
      - "case/child/placement/plan/hearing GET reads"

  - name: LicensingWorker
    description: "Owns foster home licensing and caregiver background checks."
    identity: entity_backed:Caseworker
    exclusive_operations:
      - "POST /foster-homes"
      - "POST /foster-homes/{id}/license"
      - "POST /foster-homes/{id}/license-provisional"
      - "POST /foster-homes/{id}/suspend"
      - "POST /foster-homes/{id}/reinstate"
      - "POST /caregiver-screenings"
      - "POST /caregiver-screenings/{id}/resolve"
    shared_operations:
      - "GET foster-homes, GET caregiver-screenings, GET placements"

  - name: Judge
    description: "Presides over dependency hearings; records rulings that gate permanency."
    identity: opaque
    exclusive_operations:
      - "POST /hearings/{id}/hold"
      - "POST /hearings/{id}/continue"
      - "POST /hearings/{id}/reschedule"
      - "POST /hearings/{id}/vacate"
    shared_operations:
      - "POST /hearings (with Caseworker)"
      - "case/hearing/child GET reads"
