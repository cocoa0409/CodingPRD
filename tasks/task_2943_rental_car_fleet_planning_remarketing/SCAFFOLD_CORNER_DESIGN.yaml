  # ===========================================================================
  - section: state_machines
    instances:

      - name: fleet_plan_is_created_in_draft_with_open_posture_and_zero_counters
        claim_type: initial_state
        grounds:
          - state_machines[FleetPlan].initial_state
          - entities.FleetPlan.fields.posture
        distinguishing_aspect: "FleetPlan's initial state carries three derived companions: status DRAFT, posture OPEN and both unit counters at 0 - the posture is computed even before any allocation exists rather than left null."
        test_recipe:
          setup:
            - "One ACTIVE ATL market."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
          trigger:
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_new: $.data.id }
          assert:
            - "HTTP 201 with data.status == \"DRAFT\", the declared initial_state"
            - "data.posture == \"OPEN\", data.allocated_unit_count == 0 and data.in_fleeted_unit_count == 0"
            - "data.version == 1"

      - name: fleet_plan_lock_moves_draft_to_locked_and_bumps_version
        claim_type: valid_transition
        grounds:
          - state_machines[FleetPlan] DRAFT -> LOCKED
          - endpoints[POST /fleet/fleet-plans/{plan_id}/lock]
        distinguishing_aspect: "The lock transition is the plan's only human-driven edge; it recomputes posture from allocated_unit_count (still 0, so OPEN) and increments version, which is what makes the OCC token for the first allocation."
        test_recipe:
          setup:
            - "One DRAFT ATL PEAK 2026 plan with planned_unit_count 10."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_atl: $.data.id }
          trigger:
            - call: "POST /fleet/fleet-plans/${plan_atl}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { plan_v1: $.data.version }
          assert:
            - "HTTP 200 with data.status == \"LOCKED\" and data.posture == \"OPEN\""
            - "data.version == 2, one greater than the value the create returned"
            - "GET /fleet/fleet-plans/${plan_atl} confirms LOCKED and version ${plan_v1}"

      - name: second_lock_on_a_locked_plan_returns_409_plan_not_draft
        claim_type: idempotency
        grounds:
          - validations[priority 10 ERR_PLAN_NOT_DRAFT]
          - state_machines[FleetPlan] DRAFT -> LOCKED
        distinguishing_aspect: "Re-firing lock is NOT idempotent: the second call is a 409 ERR_PLAN_NOT_DRAFT rather than a 200 replay, and it must leave version untouched so an in-flight allocation token stays valid."
        test_recipe:
          setup:
            - "One LOCKED ATL PEAK 2026 plan."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_atl: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_atl}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { plan_v1: $.data.version }
          trigger:
            - call: "POST /fleet/fleet-plans/${plan_atl}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { relock_error: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_PLAN_NOT_DRAFT\""
            - "GET /fleet/fleet-plans/${plan_atl} still reports version ${plan_v1} - the refusal did not bump the version"

      - name: plan_lock_on_a_suspended_market_returns_409_market_suspended
        claim_type: precondition_enforcement
        grounds:
          - state_machines[FleetPlan] DRAFT -> LOCKED precondition Market.status == ACTIVE
          - validations[priority 19 ERR_MARKET_SUSPENDED]
        distinguishing_aspect: "The lock's cross-entity precondition is on the plan's PARENT market, and it is checked at priority 19 - after the status gate - so a DRAFT plan in a suspended market reports ERR_MARKET_SUSPENDED and not ERR_PLAN_NOT_DRAFT."
        test_recipe:
          setup:
            - "One DRAFT ATL plan; the ATL market is then suspended, which is a one-way transition with no reactivate endpoint."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
