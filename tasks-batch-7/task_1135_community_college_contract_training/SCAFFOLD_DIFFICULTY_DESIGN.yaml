  - rule_id: compensating_invariant
    instances:
      - name: grant_program_fund_conservation
        grounds:
          - calculations.grant_program_fund_rollup
          - state_machines.GrantApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.GrantApplication.APPROVED_to_CLAIMED
          - state_machines.GrantApplication.CLAIMED_to_PAID
          - entities.GrantProgram.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity: program money. available+reserved+committed+reimbursed ==
          appropriation_cents (10000000) after approve (reserve), claim (convert with
          partial release), and mark_paid (disburse); the expired/denied release path
          restores available exactly.
        test_recipe:
          setup:
            - "Program GP: appropriation 10000000, share 0.5, cap 50000, window 2026-06-30, claim_deadline_days 60"
            - "Application GAPA on cohort A: requested 500000, APPROVED (provisional 500000 reserved) — full fixture as in grant_reimbursement_provisional_vs_final"
            - "Application GAPB on cohort B (second employer, 2 enrollees): requested 80000, SUBMITTED -> UNDER_REVIEW -> APPROVED (provisional 80000); both approvals happen at the default clock 2026-05-01 so both carry claim_by 2026-06-30 and neither cohort is credentialed before the sweep"
          setup_api_calls:
            - call: "POST /ct/grant-programs"
              payload: { code: "GP-F", name: "Fund Conservation", appropriation_cents: 10000000, max_share_pct: 0.5, cap_per_trainee_cents: 50000, application_window_end: "2026-06-30T23:59:59Z", claim_deadline_days: 60 }
