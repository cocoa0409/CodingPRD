            - { call: "POST /lotteries", payload: { zone_id: "${z1}", entry_fee_cents: 2500, term_start_at: "2026-07-01T09:00:00Z", term_end_at: "2026-07-01T17:00:00Z" }, as: PermitOfficer, captures: { lot1: "$.data.id" } }
          trigger:
            - { call: "POST /lotteries/${lot1}/entries", payload: { permit_id: "${p1}", preferred_spot_ids: ["${spot1}"] }, as: Vendor, as_user_id: "${v1}", captures: { err: "$.data.error_id" } }
