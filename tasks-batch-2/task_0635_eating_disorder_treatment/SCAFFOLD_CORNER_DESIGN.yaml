        distinguishing_aspect: "POST /edt/treatment-plans/{id}/sign discipline=DIETITIAN as Clinician -> ERR_UNAUTHORIZED (403); only Dietitian signs the DIETITIAN discipline."
        test_recipe:
          setup: ["A DRAFT treatment plan on an admission."]
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Cedar EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat KK", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id }
            - call: "POST /edt/admissions"
