# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3171_multimodal_shipment_visibility_network_carrier_onboarding
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: carrier_create_returns_system_fields_and_version_one
        claim_type: Creation
        grounds: [entities.Carrier, endpoints.POST_/carriers]
        distinguishing_aspect: "A carrier created with only carrier_name and scac_code comes back 201 with a server-minted UUID id, created_at/updated_at, and version 1 — no client-supplied system fields."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carriers"
              payload: { carrier_name: "Corner Freight", scac_code: "CRNF" }
              as: NetworkOps
              captures: { c0_id: $.data.id }
          assert:
            - "response status 201, response_type object"
            - "Carrier.${c0_id}.carrier_name == \"Corner Freight\" and scac_code == \"CRNF\""
            - "Carrier.${c0_id}.version == 1 and id/created_at/updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp present"

      - name: connection_get_round_trips_stored_and_computed_fields
        claim_type: Retrieval
        grounds: ["entities.CarrierConnection",  "endpoints.GET_/connections/{connectionId}"]
        distinguishing_aspect: "GET on a DRAFT connection returns channel TMS, cadence_minutes 240 (derived from channel), status DRAFT, null scores and null last_heartbeat_at — computed defaults visible before any heartbeat."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. One carrier with a DRAFT TMS connection."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "RoundTrip", scac_code: "RTCO" }
              as: NetworkOps
              captures: { c1_car: $.data.id }
            - call: "POST /carriers/${c1_car}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD", "RAIL"] }
              as: NetworkOps
              captures: { c1_conn: $.data.id }
          trigger:
            - call: "GET /connections/${c1_conn}"
              payload: {}
              as: NetworkOps
          assert:
            - "CarrierConnection.${c1_conn}.channel == TMS and cadence_minutes == 240"
            - "CarrierConnection.${c1_conn}.status == DRAFT"
            - "data_quality_score and instantaneous_quality_score are null; missed_heartbeat_streak == 0"

      - name: shipments_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds: [endpoints.GET_/shipments, response_envelope.pagination_defaults]
        distinguishing_aspect: "With two shipments on one connection, limit=1&offset=0 returns 1 row with total_count 2 and has_more true; offset=1 returns the second row with has_more false; connection_id filter narrows to the owning connection."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. TESTING connection, shipper with two shipments."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "PageCo", scac_code: "PAGC" }
              as: NetworkOps
              captures: { c2_car: $.data.id }
            - call: "POST /carriers/${c2_car}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { c2_conn: $.data.id }
            - call: "POST /connections/${c2_conn}/submit-credentials"
              payload: { credential_ref: "vault://pagc" }
              as: CarrierRep
              as_user_id: "${c2_car}"
            - call: "POST /connections/${c2_conn}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "PageShip" }
              as: PlatformAdmin
              captures: { c2_shp: $.data.id }
            - call: "POST /shippers/${c2_shp}/shipments"
              payload: { carrier_id: "${c2_car}", connection_id: "${c2_conn}", mode: "TRUCKLOAD", tracking_reference: "PG-1", mode_reference: "PRO-P1", destination_code: "DAL", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${c2_shp}"
            - call: "POST /shippers/${c2_shp}/shipments"
              payload: { carrier_id: "${c2_car}", connection_id: "${c2_conn}", mode: "TRUCKLOAD", tracking_reference: "PG-2", mode_reference: "PRO-P2", destination_code: "DAL", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${c2_shp}"
          trigger:
            - call: "GET /shipments"
              payload: { connection_id: "${c2_conn}", limit: 1, offset: 0 }
              as: NetworkOps
          assert:
            - "response status 200, response_type array, exactly 1 row, total_count == 2, has_more == true"
            - "GET /shipments?connection_id=${c2_conn}&limit=1&offset=1 returns exactly 1 row with has_more == false"
            - "GET /shipments with no parameters returns 2 rows (limit defaults to 10, offset 0)"

      - name: shipment_get_unknown_id_returns_shipment_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET_/shipments/{shipmentId}", "errors.ERR_SHIPMENT_NOT_FOUND"]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the shipment path produces 404 ERR_SHIPMENT_NOT_FOUND, not a generic error."
        test_recipe:
          setup: ["Empty database except the logical clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /shipments/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: NetworkOps
              captures: { c3_err: $.data.error_id }
          assert:
            - "response status 404 with error_id ERR_SHIPMENT_NOT_FOUND"

      - name: purchase_order_missing_po_number_rejected
        claim_type: Required Fields
        grounds: [entities.PurchaseOrder.fields.po_number, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required po_number on PO creation fails 400 ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. One shipper."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shippers"
              payload: { company_name: "ReqShip" }
              as: PlatformAdmin
              captures: { c4_shp: $.data.id }
          trigger:
            - call: "POST /shippers/${c4_shp}/purchase-orders"
              payload: { destination_code: "LAX", booking_reference: "BK-R" }
              as: ShipperRep
              as_user_id: "${c4_shp}"
              captures: { c4_err: $.data.error_id }
          assert:
            - "response status 400 with error_id ERR_INVALID_REQUEST"
            - "GET /shippers/${c4_shp}/purchase-orders returns 0 rows"

      - name: shipment_po_reference_claim_defaults_to_empty_string
        claim_type: Defaults
        grounds: [entities.Shipment.fields.po_reference_claim]
        distinguishing_aspect: "A shipment created without po_reference_claim stores the empty-string default, which contributes 0 to identity_match_score even when a PO has an empty po_number — the '' != '' guard never fires a match."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. TESTING connection, shipper."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "DefCo", scac_code: "DEFC" }
              as: NetworkOps
              captures: { c5_car: $.data.id }
            - call: "POST /carriers/${c5_car}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { c5_conn: $.data.id }
            - call: "POST /connections/${c5_conn}/submit-credentials"
              payload: { credential_ref: "vault://defc" }
              as: CarrierRep
              as_user_id: "${c5_car}"
            - call: "POST /connections/${c5_conn}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "DefShip" }
              as: PlatformAdmin
              captures: { c5_shp: $.data.id }
          trigger:
            - call: "POST /shippers/${c5_shp}/shipments"
              payload: { carrier_id: "${c5_car}", connection_id: "${c5_conn}", mode: "TRUCKLOAD", tracking_reference: "DF-1", mode_reference: "PRO-D1", destination_code: "DAL", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${c5_shp}"
              captures: { c5_ship: $.data.id }
          assert:
            - "Shipment.${c5_ship}.po_reference_claim == \"\" (default applied)"
            - "Shipment.${c5_ship}.identity_state == UNRESOLVED and eta_variant == SCHEDULED_BASELINE"

      - name: connection_cadence_minutes_computed_from_channel
        claim_type: Computed Fields
        grounds: [entities.CarrierConnection.fields.cadence_minutes]
        distinguishing_aspect: "cadence_minutes is server-derived from channel — TELEMATICS 15, TMS 240, MANUAL 1440 — and any client-supplied cadence value is ignored."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. One carrier."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "CadCo", scac_code: "CADC" }
              as: NetworkOps
              captures: { c6_car: $.data.id }
          trigger:
            - call: "POST /carriers/${c6_car}/connections"
              payload: { channel: "MANUAL", supported_modes: ["TRUCKLOAD", "OCEAN"] }
              as: NetworkOps
              captures: { c6_conn: $.data.id }
          assert:
            - "CarrierConnection.${c6_conn}.cadence_minutes == 1440"
            - "CarrierConnection.${c6_conn}.supported_modes == [TRUCKLOAD, OCEAN] (order preserved)"

      - name: tracking_event_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TrackingEvent]
        distinguishing_aspect: "TrackingEvent is common_fields false: no version or updated_at on the record; correction is only via the void endpoint which flips voided rather than mutating event fields."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. ACTIVE connection, shipment with one event."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "ImmCo", scac_code: "IMMC" }
              as: NetworkOps
              captures: { c7_car: $.data.id }
            - call: "POST /carriers/${c7_car}/connections"
              payload: { channel: "TELEMATICS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { c7_conn: $.data.id }
            - call: "POST /connections/${c7_conn}/submit-credentials"
              payload: { credential_ref: "vault://immc" }
              as: CarrierRep
              as_user_id: "${c7_car}"
            - call: "POST /connections/${c7_conn}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /connections/${c7_conn}/heartbeats"
              payload: { reported_at: "2026-09-01T00:00:00Z", payload_completeness_pct: 100 }
              as: CarrierRep
              as_user_id: "${c7_car}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:15:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
            - call: "POST /connections/${c7_conn}/activate"
              payload: {}
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "ImmShip" }
              as: PlatformAdmin
              captures: { c7_shp: $.data.id }
            - call: "POST /shippers/${c7_shp}/shipments"
              payload: { carrier_id: "${c7_car}", connection_id: "${c7_conn}", mode: "TRUCKLOAD", tracking_reference: "IM-1", mode_reference: "PRO-I1", destination_code: "DAL", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${c7_shp}"
              captures: { c7_ship: $.data.id }
          trigger:
            - call: "POST /shipments/${c7_ship}/events"
              payload: { event_time: "2026-09-01T06:00:00Z", event_type: "DEPARTED" }
              as: CarrierRep
              as_user_id: "${c7_car}"
              captures: { c7_evt: $.data.id }
          assert:
            - "TrackingEvent.${c7_evt} carries id, created_at, event_time, event_type, is_late false, voided false — and no version field"
            - "event_time read back exactly as posted (2026-09-01T06:00:00Z)"

      - name: manual_channel_with_parcel_mode_rejected
        claim_type: Type Constraints
        grounds: [entities.CarrierConnection.fields.supported_modes, errors.ERR_INVALID_MODE_CONFIG]
        distinguishing_aspect: "MANUAL connections may not serve PARCEL: supported_modes [PARCEL] on a MANUAL connection fails 400 ERR_INVALID_MODE_CONFIG, while the same modes on TELEMATICS succeed."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. One carrier."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "ModeCo", scac_code: "MODC" }
              as: NetworkOps
              captures: { c8_car: $.data.id }
          trigger:
            - call: "POST /carriers/${c8_car}/connections"
              payload: { channel: "MANUAL", supported_modes: ["PARCEL"] }
              as: NetworkOps
              captures: { c8_err: $.data.error_id }
            - call: "POST /carriers/${c8_car}/connections"
              payload: { channel: "TELEMATICS", supported_modes: ["PARCEL"] }
              as: NetworkOps
              captures: { c8_conn: $.data.id }
          assert:
            - "first create fails 400 with error_id ERR_INVALID_MODE_CONFIG"
            - "second create succeeds 201 with channel TELEMATICS"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: activate_from_draft_returns_connection_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CarrierConnection, errors.ERR_CONNECTION_INVALID_STATE]
        distinguishing_aspect: "Activate is only valid from TESTING; calling it on a DRAFT connection fails 409 ERR_CONNECTION_INVALID_STATE and no quality-gate check is evaluated."
        test_recipe:
          setup: ["Logical clock 2026-09-01T00:00:00Z. DRAFT connection."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "DraftCo", scac_code: "DRFC" }
              as: NetworkOps
              captures: { s1_car: $.data.id }
            - call: "POST /carriers/${s1_car}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { s1_conn: $.data.id }
          trigger:
            - call: "POST /connections/${s1_conn}/activate"
              payload: {}
              as: NetworkOps
              captures: { s1_err: $.data.error_id }
          assert:
            - "response status 409 with error_id ERR_CONNECTION_INVALID_STATE"
            - "CarrierConnection.${s1_conn}.status remains DRAFT"

      - name: resume_without_remediation_heartbeat_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.CarrierConnection.SUSPENDED_to_ACTIVE, errors.ERR_REMEDIATION_NOT_PROVEN]
        distinguishing_aspect: "Resume from SUSPENDED requires last_heartbeat_at strictly after suspended_at; resuming with the last heartbeat older than the suspension fails 409 ERR_REMEDIATION_NOT_PROVEN."
        test_recipe:
          setup: ["ACTIVE connection whose only heartbeat is at 2026-09-01T00:00:00Z; suspended at 2026-09-02T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "RemCo", scac_code: "REMC" }
              as: NetworkOps
              captures: { s2_car: $.data.id }
            - call: "POST /carriers/${s2_car}/connections"
              payload: { channel: "TELEMATICS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { s2_conn: $.data.id }
            - call: "POST /connections/${s2_conn}/submit-credentials"
              payload: { credential_ref: "vault://remc" }
              as: CarrierRep
              as_user_id: "${s2_car}"
            - call: "POST /connections/${s2_conn}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /connections/${s2_conn}/heartbeats"
              payload: { reported_at: "2026-09-01T00:00:00Z", payload_completeness_pct: 100 }
              as: CarrierRep
              as_user_id: "${s2_car}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:15:00Z" }
              as: PlatformAdmin
            - call: "POST /_ops/run-checkpoint"
              payload: {}
              as: PlatformAdmin
            - call: "POST /connections/${s2_conn}/activate"
              payload: {}
              as: NetworkOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /connections/${s2_conn}/suspend"
              payload: { reason: "audit" }
              as: NetworkOps
          trigger:
            - call: "POST /connections/${s2_conn}/resume"
              payload: {}
              as: NetworkOps
              captures: { s2_err: $.data.error_id }
          assert:
            - "response status 409 with error_id ERR_REMEDIATION_NOT_PROVEN (last heartbeat 2026-09-01T00:00:00Z < suspended_at 2026-09-02T00:00:00Z)"
            - "CarrierConnection.${s2_conn}.status remains SUSPENDED"

      - name: reject_confirmed_link_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ShipmentIdentityLink, errors.ERR_LINK_NOT_PROPOSED]
        distinguishing_aspect: "REJECTED is terminal: a second reject on an already-REJECTED link fails 409 ERR_LINK_NOT_PROPOSED; reject is valid only from PROPOSED or CONFIRMED."
        test_recipe:
          setup: ["PROPOSED link (score 1.0 setup) already rejected once."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "LockCo", scac_code: "LCKC" }
              as: NetworkOps
              captures: { s3_car: $.data.id }
            - call: "POST /carriers/${s3_car}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { s3_conn: $.data.id }
            - call: "POST /connections/${s3_conn}/submit-credentials"
              payload: { credential_ref: "vault://lckc" }
              as: CarrierRep
              as_user_id: "${s3_car}"
            - call: "POST /connections/${s3_conn}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "LockShip" }
              as: PlatformAdmin
              captures: { s3_shp: $.data.id }
            - call: "POST /shippers/${s3_shp}/purchase-orders"
              payload: { po_number: "PO-L", destination_code: "LAX", booking_reference: "BK-L" }
              as: ShipperRep
              as_user_id: "${s3_shp}"
              captures: { s3_po: $.data.id, s3_po_v: $.data.version }
            - call: "POST /shippers/${s3_shp}/shipments"
              payload: { carrier_id: "${s3_car}", connection_id: "${s3_conn}", mode: "TRUCKLOAD", tracking_reference: "BK-L", mode_reference: "PRO-L", destination_code: "LAX", po_reference_claim: "PO-L", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${s3_shp}"
              captures: { s3_ship: $.data.id }
            - call: "POST /shipments/${s3_ship}/identity-links"
              payload: { purchase_order_id: "${s3_po}", expected_po_version: "${s3_po_v}" }
              as: NetworkOps
              captures: { s3_link: $.data.id }
            - call: "POST /identity-links/${s3_link}/reject"
              payload: {}
              as: ShipperRep
              as_user_id: "${s3_shp}"
          trigger:
            - call: "POST /identity-links/${s3_link}/reject"
              payload: {}
              as: ShipperRep
              as_user_id: "${s3_shp}"
              captures: { s3_err: $.data.error_id }
          assert:
            - "second reject fails 409 with error_id ERR_LINK_NOT_PROPOSED"
            - "ShipmentIdentityLink.${s3_link}.status remains REJECTED"

      - name: resolve_from_open_requires_acknowledge_first
        claim_type: invalid_transition
        grounds: [state_machines.ExceptionAlert, errors.ERR_ALERT_INVALID_STATE]
        distinguishing_aspect: "Resolve is valid only from ACKNOWLEDGED: resolving an OPEN alert fails 409 ERR_ALERT_INVALID_STATE — the workflow cannot skip acknowledgement."
        test_recipe:
          setup: ["An OPEN DELAY_RISK alert created by a 300-minute delay on a TRUCKLOAD shipment (tolerance 60)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "SkipCo", scac_code: "SKPC" }
              as: NetworkOps
              captures: { s4_car: $.data.id }
            - call: "POST /carriers/${s4_car}/connections"
              payload: { channel: "TELEMATICS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { s4_conn: $.data.id }
            - call: "POST /connections/${s4_conn}/submit-credentials"
