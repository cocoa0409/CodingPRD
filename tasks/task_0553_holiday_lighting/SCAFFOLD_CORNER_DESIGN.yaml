scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: customer_create_returns_all_fields
        claim_type: Creation
        grounds: [entities.Customer.fields.name, entities.Customer.fields.outstanding_balance_cents]
        distinguishing_aspect: "POST /customers with all required fields returns 201 with the input echoed, outstanding_balance_cents defaulting to 0, and server-minted id/version."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "Test Owner", service_address: "100 Main St", roofline_feet: 200 }
              as: SalesRep
              captures: { cust_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Customer.${cust_id}.name == Test Owner"
            - "Customer.${cust_id}.roofline_feet == 200"
            - "Customer.${cust_id}.outstanding_balance_cents == 0"
            - "Customer.${cust_id}.status == ACTIVE"
            - "Customer.${cust_id}.version == 1"

      - name: customer_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Customer.fields.roofline_feet, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /customers omitting roofline_feet returns ERR_INVALID_REQUEST (422); no customer is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { name: "No Roof", service_address: "101 Main St" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: get_nonexistent_customer_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{unknown uuid} returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: contract_default_storage_included_false
        claim_type: Defaults
        grounds: [entities.SeasonalContract.fields.storage_included, entities.SeasonalContract.fields.subtotal_cents]
        distinguishing_aspect: "POST /contracts omitting storage_included defaults it to false, so after sign subtotal_cents equals base_season_fee_cents (60000) with the surcharge excluded; discount 3000, price 57000."
        test_recipe:
          setup: ["Default clock (2026-05-01, <= cutoff). A DRAFT contract base 60000, no storage fields supplied."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Def Owner", service_address: "102 Main St", roofline_feet: 120 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 60000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
          assert:
            - "SeasonalContract.${contract_id}.storage_included == false"
            - "SeasonalContract.${contract_id}.subtotal_cents == 60000"
            - "SeasonalContract.${contract_id}.discount_cents == 3000"
            - "SeasonalContract.${contract_id}.contract_price_cents == 57000"

      - name: contract_invalid_enum_contract_type_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.SeasonalContract.fields.contract_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /contracts with contract_type not in {SEASONAL_RENTAL, PERMANENT_PURCHASE} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Enum Owner", service_address: "103 Main St", roofline_feet: 110 }
              as: SalesRep
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "LEASE", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: estimate_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Estimate.fields.status, entities.Estimate.fields.quoted_total_cents]
        distinguishing_aspect: "POST /estimates returns a DRAFT estimate with version 1, null quoted_total_cents/final_total_cents, and server-minted id."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Sys Owner", service_address: "104 Main St", roofline_feet: 100 }
              as: SalesRep
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /estimates"
              payload: { customer_id: "${cust_id}", product_line: "SEASONAL", estimated_footage: 120, roofline_complexity: "SIMPLE" }
              as: SalesRep
              captures: { est_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Estimate.${est_id}.status == DRAFT"
            - "Estimate.${est_id}.version == 1"
            - "Estimate.${est_id}.accessory_count == 0"

  # =================================================================
  - section: state_machines
    instances:
      - name: sign_non_draft_contract_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.SeasonalContract.DRAFT_to_ACTIVE, "errors[ERR_CONTRACT_NOT_SIGNABLE]"]
        distinguishing_aspect: "Signing an already-ACTIVE contract returns ERR_CONTRACT_NOT_SIGNABLE (409)."
        test_recipe:
          setup: ["A contract signed to ACTIVE."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Sign Owner", service_address: "105 Main St", roofline_feet: 130 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_CONTRACT_NOT_SIGNABLE"

      - name: accept_non_quoted_estimate_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Estimate.QUOTED_to_ACCEPTED, "errors[ERR_ESTIMATE_NOT_QUOTED]"]
        distinguishing_aspect: "Accepting a DRAFT (not QUOTED) estimate the acting customer owns returns ERR_ESTIMATE_NOT_QUOTED (409)."
        test_recipe:
          setup: ["A customer with a DRAFT estimate (never quoted)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Acc Owner", service_address: "106 Main St", roofline_feet: 140 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /estimates"
              payload: { customer_id: "${cust_id}", product_line: "SEASONAL", estimated_footage: 120, roofline_complexity: "SIMPLE" }
              as: SalesRep
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_ESTIMATE_NOT_QUOTED"

      - name: reschedule_non_held_job_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Job.RESCHEDULED_to_SCHEDULED, "errors[ERR_JOB_NOT_HELD]"]
        distinguishing_aspect: "Calling reschedule on a SCHEDULED job (not RESCHEDULED) returns ERR_JOB_NOT_HELD (409)."
        test_recipe:
          setup: ["An ACTIVE contract with a SCHEDULED job."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Res Owner", service_address: "107 Main St", roofline_feet: 150 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /jobs"
              payload: { contract_id: "${contract_id}", job_type: "TAKEDOWN", scheduled_date: "2026-12-01T09:00:00Z" }
              as: Dispatcher
              captures: { job_id: $.data.id }
          trigger:
            - call: "POST /jobs/${job_id}/reschedule"
              payload: { new_scheduled_date: "2026-12-05T09:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_JOB_NOT_HELD"

      - name: void_non_issued_invoice_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Invoice.ISSUED_to_VOID, "errors[ERR_INVOICE_NOT_ISSUED]"]
        distinguishing_aspect: "Voiding an already-VOID invoice returns ERR_INVOICE_NOT_ISSUED (409); no further balance change."
        test_recipe:
          setup: ["A customer with an ISSUED invoice already voided."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Void Owner", service_address: "108 Main St", roofline_feet: 100 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /invoices"
              payload: { customer_id: "${cust_id}", source_type: "MANUAL", tax_rate_bps: 0, line_items: [ { description: "L1", amount_cents: 5000, taxable: false } ] }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_INVOICE_NOT_ISSUED"

      - name: reverse_non_posted_payment_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Payment.POSTED_to_REVERSED, "errors[ERR_PAYMENT_NOT_POSTED]"]
        distinguishing_aspect: "Reversing an already-REVERSED payment returns ERR_PAYMENT_NOT_POSTED (409); plan principal is not restored twice."
        test_recipe:
          setup: ["A PERMANENT plan with one payment posted then reversed."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Rev Owner", service_address: "109 Main St", roofline_feet: 210 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "PERMANENT_PURCHASE", season_year: 2026, base_season_fee_cents: 80000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /financing-plans"
              payload: { contract_id: "${contract_id}", original_principal_cents: 1200000, apr_bps: 1000, term_months: 12 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /financing-plans/${plan_id}/payments"
              payload: { amount_cents: 110000 }
              as: BillingAdmin
              captures: { pay_id: $.data.id }
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: BillingAdmin
          trigger:
            - call: "POST /payments/${pay_id}/reverse"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_PAYMENT_NOT_POSTED"
            - "FinancingPlan.${plan_id}.remaining_principal_cents == 1200000"

      - name: classify_non_open_service_call_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceCall.OPEN_to_CLASSIFIED, "errors[ERR_SERVICE_CALL_INVALID_STATE]"]
        distinguishing_aspect: "Classifying an already-CLASSIFIED service call returns ERR_SERVICE_CALL_INVALID_STATE (409)."
        test_recipe:
          setup: ["An ACTIVE contract with a CLASSIFIED service call."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Cls Owner", service_address: "110 Main St", roofline_feet: 100 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /service-calls"
              payload: { contract_id: "${contract_id}", reported_issue: "flicker", cause: "DEFECT", service_fee_cents: 5000 }
              as: BillingAdmin
              captures: { sc_id: $.data.id }
            - call: "POST /service-calls/${sc_id}/classify"
              payload: { classification: "WARRANTY" }
              as: BillingAdmin
          trigger:
            - call: "POST /service-calls/${sc_id}/classify"
              payload: { classification: "BILLABLE" }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_SERVICE_CALL_INVALID_STATE"

      - name: dispatch_non_planned_route_day_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.RouteDay.PLANNED_to_DISPATCHED, "errors[ERR_ROUTE_DAY_NOT_PLANNED]"]
        distinguishing_aspect: "Dispatching an already-DISPATCHED route day returns ERR_ROUTE_DAY_NOT_PLANNED (409)."
        test_recipe:
          setup: ["A dispatched route day."]
          setup_api_calls:
            - call: "POST /crews"
              payload: { name: "Crew H", home_zone: "N", daily_stop_capacity: 5 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /route-days"
              payload: { crew_id: "${crew_id}", service_date: "2026-12-03T00:00:00Z", zone: "N", max_stops: 5 }
              as: Dispatcher
              captures: { rd_id: $.data.id }
            - call: "POST /route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_ROUTE_DAY_NOT_PLANNED"

      - name: contract_cancel_from_cancelled_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.SeasonalContract.ACTIVE_to_CANCELLED, "errors[ERR_CONTRACT_NOT_ACTIVE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED (terminal) contract returns ERR_CONTRACT_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["A cancelled contract."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Can Owner", service_address: "111 Main St", roofline_feet: 100 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /contracts/${contract_id}/cancel"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /contracts/${contract_id}/cancel"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_CONTRACT_NOT_ACTIVE"

      - name: renew_creates_child_contract
        claim_type: Valid Transition
        grounds: [state_machines.SeasonalContract.ACTIVE_to_RENEWED, entities.SeasonalContract.fields.renewed_from_id]
        distinguishing_aspect: "Renewing an ACTIVE contract sets it to RENEWED and returns a new DRAFT contract whose renewed_from_id equals the prior contract id."
        test_recipe:
          setup: ["An ACTIVE contract."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Ren Owner", service_address: "112 Main St", roofline_feet: 100 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /contracts/${contract_id}/renew"
              payload: { season_year: 2027, base_season_fee_cents: 52000, early_bird_cutoff: "2027-08-15T00:00:00Z" }
              as: SalesRep
              captures: { new_id: $.data.id, new_parent: $.data.renewed_from_id }
          assert:
            - "response.status == 201"
            - "SeasonalContract.${contract_id}.status == RENEWED"
            - "SeasonalContract.${new_id}.renewed_from_id == ${contract_id}"
            - "SeasonalContract.${new_id}.status == DRAFT"

      - name: route_day_dispatch_promotes_assignment
        claim_type: Side Effect Execution
        grounds: [state_machines.RouteDay.PLANNED_to_DISPATCHED, state_machines.RouteAssignment.BOOKED_to_DISPATCHED]
        distinguishing_aspect: "Dispatching a route day promotes its BOOKED assignment to DISPATCHED while booked_stops stays at 1 (DISPATCHED still counts)."
        test_recipe:
          setup: ["An ACTIVE contract; a job booked (BOOKED) onto a PLANNED route day."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Dis Owner", service_address: "113 Main St", roofline_feet: 100 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /jobs"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL", scheduled_date: "2026-12-04T09:00:00Z" }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew I", home_zone: "N", daily_stop_capacity: 5 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /route-days"
              payload: { crew_id: "${crew_id}", service_date: "2026-12-04T00:00:00Z", zone: "N", max_stops: 5 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-assignments"
              payload: { route_day_id: "${rd_id}", job_id: "${job_id}", window_start: "2026-12-04T09:00:00Z", window_end: "2026-12-04T11:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
          assert:
            - "RouteDay.${rd_id}.status == DISPATCHED"
            - "RouteAssignment.${ra_id}.status == DISPATCHED"
            - "RouteDay.${rd_id}.booked_stops == 1"

      - name: takedown_job_start_complete_happy_path
        claim_type: Valid Transition
        grounds: [state_machines.Job.SCHEDULED_to_IN_PROGRESS, state_machines.Job.IN_PROGRESS_to_COMPLETED]
        distinguishing_aspect: "A TAKEDOWN job on a DISPATCHED route day started and completed by the owning crew reaches COMPLETED (no estimate finalization)."
        test_recipe:
          setup: ["An ACTIVE contract; a TAKEDOWN job booked and its route day dispatched."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Hap Owner", service_address: "114 Main St", roofline_feet: 100 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", contract_type: "SEASONAL_RENTAL", season_year: 2026, base_season_fee_cents: 50000, early_bird_cutoff: "2027-01-01T00:00:00Z" }
              as: SalesRep
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /jobs"
              payload: { contract_id: "${contract_id}", job_type: "TAKEDOWN", scheduled_date: "2026-12-06T09:00:00Z" }
              as: Dispatcher
              captures: { job_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew J", home_zone: "N", daily_stop_capacity: 5 }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /route-days"
              payload: { crew_id: "${crew_id}", service_date: "2026-12-06T00:00:00Z", zone: "N", max_stops: 5 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-assignments"
              payload: { route_day_id: "${rd_id}", job_id: "${job_id}", window_start: "2026-12-06T09:00:00Z", window_end: "2026-12-06T11:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
            - call: "POST /route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /jobs/${job_id}/start"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /jobs/${job_id}/complete"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
          assert:
            - "Job.${job_id}.status == COMPLETED"

  # =================================================================
  - section: calculations
    instances:
      - name: footage_quote_seasonal_complex_correct_result
        claim_type: Correct Result
        grounds: [calculations.footage_estimate_quote]
        distinguishing_aspect: "SEASONAL base 15000 + round(65000*1.30)=84500 footage cost + 0 accessories = 99500 for footage 250 (tiers 30000+25000+10000) at COMPLEX."
        test_recipe:
          setup: ["A DRAFT SEASONAL estimate, footage 250, COMPLEX, 0 accessories."]
          setup_api_calls:
            - call: "POST /customers"
