              payload: { checkpoint_id: "${cp_id}", state: "RAISED" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { th_tk: "$.data[0].id" }
            - call: "POST /escalation-tickets/${th_tk}/acknowledge"
              payload: {}
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
            - call: "POST /escalation-tickets/${th_tk}/resolve"
              payload: { resolution: "MITIGATED_BY_DIVERSION", diverted_pax_count: 12 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { th_res: $.data.state, th_div: $.data.diverted_pax_count }
            - call: "GET /checkpoints/${cp_id}/throughput-analysis"
              payload: {}
              as: CheckpointManager
              captures: { th2_total: $.data.total_forecast_pax, th2_run: $.data.max_consecutive_shortfall_bands, th2_rate: $.data.diversion_rate, th2_flag: $.data.design_change_recommended }
            - *c_forecast2
            - call: "GET /checkpoints/${cp_id}/throughput-analysis"
              payload: {}
              as: CheckpointManager
              captures: { th3_total: $.data.total_forecast_pax, th3_run: $.data.max_consecutive_shortfall_bands, th3_rate: $.data.diversion_rate, th3_flag: $.data.design_change_recommended, th3_div: $.data.diverted_pax_total }
          assert:
            - "after forecasting band 1 only: ${th1_total} == 120, served_capacity_pax == 90 and 90/120 == 0.75 < THROUGHPUT_SHORTFALL_RATIO so the band is a shortfall, ${th1_run} == 1, ${th1_rate} == \"0.0000\" and ${th1_flag} == false"
            - "${th_res} == RESOLVED_DIVERTED with ${th_div} == 12, so Checkpoint.diverted_pax_total becomes 12"
            - "${th2_total} == 120 with ${th2_rate} == \"0.1000\" (>= DIVERSION_RATE_DESIGN_THRESHOLD) yet ${th2_run} == 1, so ${th2_flag} == false — the diversion leg alone is not enough"
            - "after forecasting band 2: ${th3_total} == 240, ${th3_run} == 2 == CONSECUTIVE_SHORTFALL_BANDS_REQUIRED, ${th3_rate} == \"0.0500\" == round_half_up(12/240, 4) which is exactly the threshold and therefore satisfies >=, so ${th3_flag} == true"
            - "${th3_div} == 12 and the un-forecast band count is 0 — band_results carries exactly the two forecast bands in band_start_utc order"

      - name: suspended_masks_surge_in_the_posture_branch_ladder
        claim_type: constants_applied
        grounds:
          - calculations.checkpoint_posture
          - state_machines.Checkpoint
        distinguishing_aspect: "The posture ladder is evaluated strictly top to bottom: with two open escalations the checkpoint is SURGE, but the suspended flag masks it, and the SUSPENDED -> NORMAL edge additionally refuses to fire while open_escalation_count > 0 — so masking is not the same as clearing."
        test_recipe:
          setup:
            - "one OPEN STANDARD lane, a supervisor, and two open escalation tickets (one per lane_type)"
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_open
            - *c_off_sup
            - *c_obs_breach_1
            - *c_obs_breach_2
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "EXPEDITED", sampled_wait_seconds: 1200, measurement_method: "BLE_SENSOR", sample_size: 10 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { xp1: $.data.published_wait_minutes_snapshot, xp1_breach: $.data.breached_threshold }
            - call: "POST /checkpoints/${cp_id}/wait-observations"
              payload: { lane_type: "EXPEDITED", sampled_wait_seconds: 1200, measurement_method: "BLE_SENSOR", sample_size: 10 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { xp2: $.data.published_wait_minutes_snapshot }
          trigger:
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { surge_posture: $.data.posture, surge_std_streak: $.data.consecutive_breach_count_standard, surge_exp_streak: $.data.consecutive_breach_count_expedited }
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { suspended: true }
              as: CheckpointManager
              captures: { masked_posture: $.data.posture, masked_flag: $.data.suspended }
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { suspended: false }
              as: CheckpointManager
              expect_status: 409
              captures: { unsuspend_error: $.data.error_id }
            - call: "GET /escalation-tickets"
              payload: { checkpoint_id: "${cp_id}", state: "RAISED", lane_type_scope: "STANDARD" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { m_tk_std: "$.data[0].id" }
            - call: "GET /escalation-tickets"
              payload: { checkpoint_id: "${cp_id}", state: "RAISED", lane_type_scope: "EXPEDITED" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { m_tk_exp: "$.data[0].id" }
            - call: "POST /escalation-tickets/${m_tk_std}/acknowledge"
              payload: {}
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
            - call: "POST /escalation-tickets/${m_tk_std}/resolve"
              payload: { resolution: "MITIGATED_BY_DIVERSION", diverted_pax_count: 1 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { m_std_state: $.data.state }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: CheckpointManager
              captures: { still_susp: $.data.posture }
            - call: "POST /escalation-tickets/${m_tk_exp}/acknowledge"
              payload: {}
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
            - call: "POST /escalation-tickets/${m_tk_exp}/resolve"
              payload: { resolution: "MITIGATED_BY_DIVERSION", diverted_pax_count: 1 }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { suspended: false }
              as: CheckpointManager
              captures: { final_posture: $.data.posture, final_flag: $.data.suspended }
            - call: "GET /lanes/${lane_id}"
              payload: {}
              as: CheckpointManager
              captures: { final_lane_state: $.data.lane_state }
          assert:
            - "${xp1} == 20 and ${xp1_breach} == true against wait_threshold_minutes_expedited 8; STANDARD and EXPEDITED keep separate runs, so ${surge_std_streak} == 2 and ${surge_exp_streak} == 2"
            - "${surge_posture} == SURGE — open_escalation_count 2 >= SURGE_OPEN_ESCALATION_THRESHOLD"
            - "${masked_flag} == true and ${masked_posture} == SUSPENDED — branch 1 of the ladder wins over the SURGE branch even though both counters still hold"
            - "${unsuspend_error} == ERR_INVALID_STATE_TRANSITION (409) — the SUSPENDED -> NORMAL edge requires open_escalation_count == 0"
            - "${m_std_state} == RESOLVED_DIVERTED and ${still_susp} == SUSPENDED with one ticket left open — resolving under suspension does not un-mask"
            - "${final_flag} == false and ${final_posture} == NORMAL once both tickets are terminal and no lane is OUT_OF_SERVICE"
            - "${final_lane_state} == PAUSED — un-suspending never auto-reopens the lane the suspension cascade paused"

      - name: forecast_two_variants_diverge_on_identical_flight_data
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: "dual_variant_calc / forecast_variant_divergence_schedule_only_vs_curve_blended"
          rationale: "That §1.8 instance already forecasts the same band twice and asserts two different integers (100 vs 80) plus the exact reason for the delta (SCHEDULE_ONLY ignores bucket shares, the connecting discount and the seasonal multiplier), which is the full variant-divergence claim."

      - name: forecast_rounds_each_flight_contribution_before_summing
        claim_type: precision
        excluded_because:
          difficulty_instance: "combinatorial_formula / forecast_rounding_order_round_per_flight_then_sum"
          rationale: "That §1.8 instance pins the rounding ORDER for the forecast with a fixture whose round-then-sum and sum-then-round answers differ by a whole passenger; adding a second forecast-precision probe here would restate it."

      - name: duty_ledger_variant_selection_by_call_context
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: "dual_variant_calc / officer_duty_ledger_planned_vs_chronological_actual_divergence"
          rationale: "That §1.8 instance asserts both that FORWARD_LOOKING_PLANNED is the default when ?variant= is omitted and that the pre-write overtime check uses the planned variant while payroll reads the chronological one, covering variant selection as well as divergence."

      - name: admin_fee_rate_keyed_on_subtotal_not_total
        claim_type: correct_result
        excluded_because:
          difficulty_instance: "combinatorial_formula / plan_cost_admin_fee_tier_keyed_on_subtotal_not_total"
          rationale: "That §1.8 instance resolves the apparent circular dependency (fee depends on subtotal, total depends on fee) with a fixture where keying the tier off total_cost_cents selects a different rate, which subsumes a plain correct-result probe of the fee formula."

  # ===========================================================================
  - section: validations
    instances:

      - name: assignment_rejects_lane_and_band_belonging_to_another_checkpoint
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 19]
          - errors[ERR_LANE_CHECKPOINT_MISMATCH]
          - errors[ERR_TIME_BAND_CHECKPOINT_MISMATCH]
        distinguishing_aspect: "Both ids exist, so this is not a 404: the failure depends on a THIRD entity's field (the plan's checkpoint_id). The two error codes are distinct and, when both are foreign, the lane is reported first because it is declared earlier in the endpoint's input list."
        test_recipe:
          setup:
            - "two checkpoints, each with its own equipped STANDARD lane and its own 10:00 band"
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_officer
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - &c_cp2
              call: "POST /checkpoints"
              payload: { name: "T2 West", terminal_code: "T2", total_lane_positions: 4, wait_threshold_minutes_standard: 15, wait_threshold_minutes_expedited: 8, connecting_pax_discount_pct: 0, secondary_slot_capacity: 1, plan_cost_cap_cents: 10000000 }
              as: PlatformAdmin
              captures: { cp2_id: $.data.id }
            - &c_lane_other
              call: "POST /lanes"
              payload: { checkpoint_id: "${cp2_id}", lane_type: "STANDARD", position_index: 1, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 0 }
              as: CheckpointManager
              captures: { other_lane_id: $.data.id }
            - &c_band_other
              call: "POST /time-bands"
              payload: { checkpoint_id: "${cp2_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { other_band_id: $.data.id }
            - *c_cpver
            - *c_plan
          trigger:
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_id}", time_band_id: "${other_band_id}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 422
              captures: { band_mismatch_error: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${other_lane_id}", officer_id: "${off_id}", time_band_id: "${band1_id}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 422
              captures: { lane_mismatch_error: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${other_lane_id}", officer_id: "${off_id}", time_band_id: "${other_band_id}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 422
              captures: { both_mismatch_error: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_id}", time_band_id: "${band1_id}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { ok_asg_id: $.data.id, ok_asg_state: $.data.assignment_state }
          assert:
            - "${band_mismatch_error} == ERR_TIME_BAND_CHECKPOINT_MISMATCH (422) — the band exists but hangs off T2 while the plan hangs off T1"
            - "${lane_mismatch_error} == ERR_LANE_CHECKPOINT_MISMATCH (422)"
            - "${both_mismatch_error} == ERR_LANE_CHECKPOINT_MISMATCH — lane_id precedes time_band_id in the endpoint's input declaration, so the lane check reports first"
            - "the satisfaction case succeeds: ${ok_asg_state} == SCHEDULED with planned_minutes 30, proving the rule passes when both parents share the plan's checkpoint"
            - "no LaneAssignment row was created by any of the three rejected calls: GET /lane-assignments?staffing_plan_id=${plan_id} returns exactly one row"

      - name: assignment_rejects_band_outside_the_plans_operational_date
        claim_type: temporal_validation
        grounds:
          - validations[priority 21]
          - errors[ERR_BAND_OUTSIDE_OPERATIONAL_DATE]
        distinguishing_aspect: "The band and the plan agree on the checkpoint, so priority 19 passes and only the date-window rule fires. The last band of the day (23:30-00:00) must be ACCEPTED because the interval is half-open and ends exactly at midnight, while the first band of the next day is rejected."
        test_recipe:
          setup: ["a DRAFT plan for operational_date 2026-09-10 on an equipped checkpoint"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_officer
            - *c_curve
            - *c_cpver
            - *c_plan
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T23:30:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { last_band_id: $.data.id, last_band_end: $.data.band_end_utc }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-11T00:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { next_day_band_id: $.data.id }
          trigger:
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_id}", time_band_id: "${next_day_band_id}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 422
              captures: { outside_error: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_id}", time_band_id: "${last_band_id}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { midnight_asg_state: $.data.assignment_state }
          assert:
            - "${last_band_end} == 2026-09-11T00:00:00Z"
            - "${outside_error} == ERR_BAND_OUTSIDE_OPERATIONAL_DATE (422) for the 2026-09-11T00:00 band"
            - "${midnight_asg_state} == SCHEDULED — [23:30, 00:00) is entirely inside 2026-09-10 because the interval is half-open at the end"
            - "the accepted assignment reached the rule at all only because priorities 1-20 passed, so this is a clean single-rule probe"

      - name: referral_begin_rejected_when_other_secondary_slots_fill_the_capacity
        claim_type: aggregate_validation
        grounds:
          - validations[priority 27]
          - errors[ERR_SECONDARY_CAPACITY_EXHAUSTED]
        distinguishing_aspect: "Each referral is individually legal; only the collective breaches. The rule must also exclude the referral's OWN already-held slot from the count, otherwise a capacity of 2 would only ever admit one secondary screening."
        test_recipe:
          setup:
            - "an OPEN lane on a checkpoint with secondary_slot_capacity 2, a supervisor and a certified resolver"
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_open
            - *c_off_sup
            - &c_off_res
              call: "POST /officers"
              payload: { badge_number: "B-2002", full_name: "Rin Res", certifications: ["STANDARD_LANE", "SPECIAL_PROCEDURES", "ETD_RESOLUTION"], base_rate_cents_per_minute: 110, weekly_regular_minutes_cap: 2400, weekly_overtime_minutes_cap: 600 }
              as: PlatformAdmin
              captures: { res_id: $.data.id }
            - call: "POST /officers/${res_id}/duty-status"
              payload: { duty_status: "ON_DUTY" }
              as: CheckpointManager
              captures: { res_duty: $.data.duty_status }
            - *c_referral_raise
            - call: "POST /screening-referrals"
              payload: { lane_id: "${lane_id}", referral_reason: "RANDOM", passenger_category: "ADULT", requires_private_screening: false }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { ref2_id: $.data.id }
            - call: "POST /screening-referrals"
              payload: { lane_id: "${lane_id}", referral_reason: "RANDOM", passenger_category: "ADULT", requires_private_screening: false }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { ref3_id: $.data.id }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { slots_three_raised: $.data.secondary_slots_in_use }
          trigger:
            - call: "POST /screening-referrals/${ref_id}/begin"
              payload: { resolving_officer_id: "${res_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { b1_state: $.data.state }
            - call: "POST /screening-referrals/${ref2_id}/begin"
              payload: { resolving_officer_id: "${res_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { b2_state: $.data.state }
            - call: "POST /screening-referrals/${ref3_id}/begin"
              payload: { resolving_officer_id: "${res_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              expect_status: 409
              captures: { b3_error: $.data.error_id }
            - call: "POST /screening-referrals/${ref_id}/resolve"
              payload: { outcome: "CLEARED" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { r1_state: $.data.state }
            - call: "POST /screening-referrals/${ref3_id}/begin"
              payload: { resolving_officer_id: "${res_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { b3_retry_state: $.data.state }
          assert:
            - "${res_duty} == ON_DUTY — begin requires the nominated resolver to be on duty"
            - "${slots_three_raised} == 3 — the slot is reserved at CREATION, so three RAISED referrals already exceed the capacity of 2 without any begin"
            - "${b1_state} == IN_PROGRESS and ${b2_state} == IN_PROGRESS — each begin counts only the OTHER held slots (0 and 1), both below capacity 2"
            - "${b3_error} == ERR_SECONDARY_CAPACITY_EXHAUSTED (409) — the other two slots now number exactly secondary_slot_capacity"
            - "${r1_state} == CLEARED releases a slot (secondary_slots_in_use 3 -> 2) and Checkpoint.cleared_referral_count == 1"
            - "${b3_retry_state} == IN_PROGRESS — the same call succeeds once a slot is freed, so the rule reads live aggregate state rather than a per-referral flag"

      - name: plan_submit_checks_band_forecast_before_lane_coverage
        claim_type: cascading_validation
        grounds:
          - validations[priority 28]
          - errors[ERR_BAND_NOT_FORECAST]
