  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dispatch_state_beats_permit_safety
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_CONTAINER_NOT_AVAILABLE]
          - errors[ERR_PERMIT_NOT_APPROVED]
        distinguishing_aspect: |
          On POST /rental-orders/{id}/dispatch-delivery, a state violation
          (container OUT_OF_SERVICE -> ERR_CONTAINER_NOT_AVAILABLE, priority 5
          category state) and a business_safety violation (requires_street_permit
          with no APPROVED permit -> ERR_PERMIT_NOT_APPROVED, priority 7) both hold;
          the state error wins. Categories: state vs business_safety.
        test_recipe:
          setup:
            - "Order BOOKED, requires_street_permit=true, permit only REQUESTED (not approved)"
            - "Container retired to OUT_OF_SERVICE before dispatch"
          setup_api_calls:
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-01" }
              as: YardAdmin
            - call: "POST /container-types"
