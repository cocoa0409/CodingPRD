      - name: sar_continuing_filing_supersedes_prior
        claim_type: side_effect_execution
        grounds: [state_machines.SARFiling.FILED_to_SUPERSEDED]
        distinguishing_aspect: "Filing a continuing SAR (prior_filing_id set, case DECIDED_FILED) flips the prior FILED filing to SUPERSEDED; the continuing filing's deadline = prior filed date + 120d (2026-05-01 -> 2026-08-29)."
