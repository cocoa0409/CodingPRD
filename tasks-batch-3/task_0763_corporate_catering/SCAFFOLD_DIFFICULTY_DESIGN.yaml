      - name: confirm_invalid_state_beats_insufficient_inventory
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.CateringOrder.APPROVED_to_CONFIRMED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: "state (priority 5, ERR_INVALID_STATE) beats business_fiscal (priority 10, ERR_INSUFFICIENT_INVENTORY): a SUBMITTED (not APPROVED) order with zero inventory is confirmed -> ERR_INVALID_STATE, not the inventory error."
