      - name: session_quorum_power_sizing
        grounds:
          - calculations.required_panelist_count
          - entities.EvaluationSession.fields.required_panelist_count
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order.
          Session S1 (delta 2.0, no ANALYZED sessions yet -> default variance
          2.25) is created with required_panelist_count == 9; after S1 is
          ANALYZED with engineered OVERALL variance 0.277778, a new session S2
          for the same study is sized with the OBSERVED variance ->
          ceil(15.68*0.277778/4) = 2 -> clamped to 4. The count is frozen at
          creation: S1 stays 9 even after the variance update.
        test_recipe:
          setup:
            - "REAL_TIME study (delta 2.0, threshold 6.0, target 60), 1 time point (day 0), 2 arms (control STANDARD_FILM, variant MAP), chamber capacity 30"
            - "S1 (control arm, tp0, 10:00-11:00) created while SCHEDULED: required_panelist_count == 9 (default variance)"
            - "Study activated; 9 units pulled for the control arm; 9 QUALIFIED panelists assigned to S1; S1 opened at 10:00; OVERALL scores are 7,8,7,8,7,8,7,8,7 (sample variance 0.277778); all other attributes scored 9; S1 LOCKED then ANALYZED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: LabDirector }
            - { call: "POST /sensory-lab/clients", payload: { name: "Power Co", contact_email: "power@acme.com" }, as: LabDirector, captures: { client_id: $.data.id } }
            - { call: "POST /sensory-lab/clients/${client_id}/retainer-topups", payload: { hours: 100 }, as: LabDirector }
            - { call: "POST /sensory-lab/studies", payload: { client_id: "${client_id}", product_name: "Salsa", study_type: "REAL_TIME", storage_temp_c: 20, target_shelf_life_days: 60, sensory_fail_threshold: 6.0, min_detectable_difference: 2.0, planned_start_utc: "2026-08-01T00:00:00Z" }, as: SensoryScientist, captures: { study_id: $.data.id } }
            - { call: "POST /sensory-lab/study-arms", payload: { study_id: "${study_id}", packaging_variant: "STANDARD_FILM", is_control: true }, as: SensoryScientist, captures: { arm_c: $.data.id } }
