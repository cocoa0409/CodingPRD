# =============================================================================
# Task 0646 — Personal Training & Online Coaching (Trainerize style)
# Difficulty: Expert
# =============================================================================

scenario: "646. Personal Training & Online Coaching (Trainerize style): client intake & assessment/goals, program & workout-plan delivery, in-person session-pack vs online subscription, check-in & progress (photos/measurements), nutrition/macro plan, messaging & habit tracking, package billing & no-show, calendar/booking"

domain_name: personal-training-coaching
api_prefix: /

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing      # calendar/booking with overlap + buffer rules
  secondary_archetype: pricing_engine         # session-pack ledger vs subscription proration, no-show fees, invoice round-order
  complexity_layers:
    - optimistic_concurrency                  # OCC on Booking.version for slot booking; on Client.version for engagement create
    - dual_variant_calculation                # provisional vs settled session-pack ledger; macro plan estimate vs locked
    - cascading_side_effects                  # session no-show -> pack debit -> engagement balance recompute -> auto-pause
    - rate_threshold_triggers                 # no-show strike threshold auto-suspends booking privileges; pack depletion gates

  entity_topology: flat                       # peer entities linked by FK; no deep nesting in URL paths
  state_machine_shape: cyclic                 # Engagement PAUSED<->ACTIVE loop; Booking reschedule loop; CheckIn revision loop
  relationship_patterns:
    - one_to_many                             # Client 1:N Engagement, Engagement 1:N Booking/CheckIn
    - cross_aggregate                         # Booking references SessionPack (different aggregate); CheckIn gates ProgramAssignment
    - self_referential                        # Booking.rescheduled_from_booking_id -> Booking.id

  role_model: peer_roles                      # Trainer owns programs/plans/billing; Client owns intake/checkins/bookings; PlatformAdmin operational
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Trainer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: full_name, type: string, source: input, description: "Trainer display name" }
      - { name: email, type: string, source: input, description: "Unique login email", constraints: "unique across Trainer" }
      - { name: timezone, type: string, source: input, default: "UTC", description: "IANA tz used for booking-window display only; all stored times are UTC" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DEACTIVATED" }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: trainer_id, type: string, source: input, description: "FK -> Trainer.id; the coaching trainer" }
      - { name: full_name, type: string, source: input, description: "Client name" }
      - { name: email, type: string, source: input, description: "Unique login email", constraints: "unique across Client" }
      - { name: sex, type: enum, source: input, description: "MALE | FEMALE; drives Mifflin-St Jeor BMR constant" }
      - { name: birth_year, type: integer, source: input, description: "Used to derive age = current_year - birth_year for BMR" }
      - { name: height_cm, type: number, source: input, description: "Height in centimeters for BMR" }
      - { name: intake_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | ASSESSED; gates engagement creation" }
      - { name: latest_weight_kg, type: number, source: computed, description: "Weight from the most recent ASSESSED-or-later CheckIn (latest by measured_at; tie-break created_at ASC); null until first check-in. Drives macro recompute." }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Count of Bookings for this client in {NO_SHOW, LATE_CANCELLED} across all engagements; threshold gates booking" }
      - { name: booking_privilege, type: enum, source: computed, default: "ALLOWED", description: "ALLOWED | SUSPENDED; SUSPENDED when no_show_strikes >= NO_SHOW_STRIKE_LIMIT" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the enrolled client" }
      - { name: trainer_id, type: string, source: computed, description: "FK -> Trainer.id; copied from Client.trainer_id at creation" }
      - { name: billing_model, type: enum, source: input, description: "SESSION_PACK | ONLINE_SUBSCRIPTION; immutable after create" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | PAUSED | ENDED" }
      - { name: wallet_credit_cents, type: integer, source: computed, default: 0, description: "Refunds/credits owed back to client, in cents; never negative" }
      - { name: pause_reason, type: enum, source: system, default: "NONE", description: "NONE | PACK_DEPLETED | MANUAL" }

  - name: SessionPack
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; pack belongs to a SESSION_PACK engagement" }
      - { name: total_sessions, type: integer, source: input, description: "Sessions purchased in this pack; > 0" }
      - { name: price_cents, type: integer, source: input, description: "Total price paid for the pack in cents; > 0" }
      - { name: per_session_value_cents, type: integer, source: computed, description: "round_half_up(price_cents / total_sessions); used for no-show fees and refunds" }
      - { name: sessions_committed, type: integer, source: computed, default: 0, description: "Count of Bookings against this pack currently holding a seat (status IN {BOOKED, COMPLETED, NO_SHOW, LATE_CANCELLED})" }
      - { name: sessions_remaining, type: integer, source: computed, description: "total_sessions - sessions_committed; gates new bookings at 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DEPLETED | REFUNDED" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; the engagement this session belongs to" }
      - { name: session_pack_id, type: string, source: input, description: "FK -> SessionPack.id; null for ONLINE_SUBSCRIPTION engagements, required for SESSION_PACK" }
      - { name: trainer_id, type: string, source: computed, description: "FK -> Trainer.id; copied from engagement for overlap detection" }
      - { name: start_utc, type: datetime, source: input, description: "Session start, ISO 8601 UTC" }
      - { name: end_utc, type: datetime, source: input, description: "Session end, ISO 8601 UTC; must be > start_utc" }
      - { name: rescheduled_from_booking_id, type: string, source: system, default: null, description: "FK -> Booking.id; set when this booking was created by rescheduling another (self-referential)" }
      - { name: fee_charged_cents, type: integer, source: computed, default: 0, description: "No-show / late-cancel fee debited from engagement wallet/owed for this booking" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | COMPLETED | CANCELLED | LATE_CANCELLED | NO_SHOW | RESCHEDULED" }

  - name: ProgramAssignment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; the program is delivered within an engagement" }
      - { name: title, type: string, source: input, description: "Program/workout-plan title" }
      - { name: planned_workouts_per_week, type: integer, source: input, description: "Planned workout count per 7-day window; denominator for adherence workout_ratio; > 0" }
      - { name: habit_checks_target, type: integer, source: input, description: "Target habit completions per check-in window; denominator for habit_ratio; > 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PUBLISHED | ARCHIVED; client may only log habits against PUBLISHED" }

  - name: MacroPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; one active macro plan per engagement" }
      - { name: goal, type: enum, source: input, description: "FAT_LOSS | MAINTENANCE | MUSCLE_GAIN; drives calorie adjustment + macro split" }
      - { name: activity_level, type: enum, source: input, description: "SEDENTARY | MODERATE | ACTIVE; drives TDEE multiplier" }
      - { name: snapshot_weight_kg, type: number, source: computed, description: "Client.latest_weight_kg captured at compute time; null-weight falls back to no plan (rejected)" }
      - { name: target_calories, type: integer, source: computed, description: "Provisional from current weight; recomputed on new check-in until LOCKED" }
      - { name: protein_g, type: integer, source: computed, description: "Protein grams from split" }
      - { name: carb_g, type: integer, source: computed, description: "Carb grams from split" }
      - { name: fat_g, type: integer, source: computed, description: "Fat grams from split" }
      - { name: status, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL | LOCKED; PROVISIONAL recomputes on check-in, LOCKED freezes the numbers" }

  - name: CheckIn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; the check-in's engagement" }
      - { name: measured_at, type: datetime, source: input, description: "Instant the measurement was taken, ISO 8601 UTC; window key for adherence and latest-weight" }
      - { name: weight_kg, type: number, source: input, description: "Body weight measurement in kg; > 0" }
      - { name: photo_urls, type: array, source: input, default: [], description: "Progress photo URLs" }
      - { name: window_start_utc, type: datetime, source: input, description: "Inclusive start of the adherence window this check-in summarizes" }
      - { name: window_end_utc, type: datetime, source: input, description: "Exclusive end of the adherence window; must be > window_start_utc" }
      - { name: adherence_score, type: integer, source: computed, description: "0-100 weighted score over HabitLogs + completed workouts in [window_start_utc, window_end_utc)" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | REVISION_REQUESTED | ASSESSED; cyclic SUBMITTED<->REVISION_REQUESTED" }

  - name: HabitLog
    parent: null
    common_fields: false                       # append-only event; only id + created_at
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; the engagement this log belongs to" }
      - { name: program_assignment_id, type: string, source: input, description: "FK -> ProgramAssignment.id; must reference a PUBLISHED program" }
      - { name: kind, type: enum, source: input, description: "WORKOUT_COMPLETED | NUTRITION_LOGGED | HABIT_CHECK; classifies the log for adherence ratios" }
      - { name: logged_at, type: datetime, source: input, description: "Instant the habit/workout occurred, ISO 8601 UTC; binned into check-in windows" }

  - name: Message
    parent: null
    common_fields: false                       # append-only event; only id + created_at
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; thread is scoped to an engagement" }
      - { name: sender_role, type: enum, source: system, description: "TRAINER | CLIENT; derived from X-User-Role of the caller" }
      - { name: body, type: string, source: input, description: "Message text; non-empty" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    field: intake_status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /clients/{clientId}/submit-intake"
        actor: Client
        preconditions:
          - "Client.intake_status == DRAFT (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: ASSESSED
        trigger: "POST /clients/{clientId}/assess"
        actor: Trainer
        preconditions:
          - "Client.intake_status == SUBMITTED (else ERR_INTAKE_NOT_SUBMITTED)"
        side_effects:
          - "Enables Engagement creation for this client (cross-entity gate)"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /clients/{clientId}/return-intake"
        actor: Trainer
        preconditions:
          - "Client.intake_status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: []
        note: "Cyclic revision loop on intake: SUBMITTED -> DRAFT -> SUBMITTED."

  - entity: Engagement
    field: status
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "system (SessionPack depletes: sessions_remaining hits 0) OR POST /engagements/{engagementId}/pause"
        actor: [system, Trainer]
        preconditions:
          - "Engagement.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Sets pause_reason = PACK_DEPLETED (automatic depletion path) | MANUAL (POST /pause path)"
          - "Blocks new Booking creation while PAUSED (cross-entity gate on Booking)"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /engagements/{engagementId}/resume"
        actor: Trainer
        preconditions:
          - "Engagement.status == PAUSED (else ERR_INVALID_STATE)"
          - "If pause_reason == PACK_DEPLETED: an ACTIVE SessionPack with sessions_remaining > 0 must exist for the engagement (else ERR_NO_SESSIONS_REMAINING)"
        side_effects:
          - "Sets pause_reason = NONE"
        note: "Cyclic loop ACTIVE<->PAUSED (revision/negotiation-style rounds)."
      - from: [ACTIVE, PAUSED]
        to: ENDED
        trigger: "POST /engagements/{engagementId}/end"
        actor: Trainer
        preconditions:
          - "Engagement.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "All Bookings in {BOOKED} for this engagement -> CANCELLED (cascade-down, no fee), each releasing its pack seat"
          - "For SESSION_PACK: each ACTIVE SessionPack with sessions_remaining > 0 refunds sessions_remaining * per_session_value_cents into Engagement.wallet_credit_cents, then pack -> REFUNDED"
          - "MacroPlan (if PROVISIONAL) -> LOCKED"
          - "ProgramAssignment in {DRAFT, PUBLISHED} -> ARCHIVED"

  - entity: SessionPack
    field: status
    initial_state: ACTIVE
    terminal_states: [REFUNDED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (Booking commit raises sessions_committed to total_sessions)"
        actor: system
        preconditions:
          - "sessions_remaining == 0 after the committing booking"
        side_effects:
          - "Parent Engagement ACTIVE -> PAUSED with pause_reason = PACK_DEPLETED (bubble-up cascade)"
      - from: DEPLETED
        to: ACTIVE
        trigger: "system (a committed Booking is CANCELLED freeing a seat so sessions_remaining > 0)"
        actor: system
        preconditions:
          - "sessions_remaining > 0 after the release"
        side_effects: []
        note: "Cyclic ACTIVE<->DEPLETED as seats are committed and freed."
      - from: ACTIVE
        to: REFUNDED
        trigger: "system (Engagement end with remaining seats)"
        actor: system
        preconditions:
          - "Engagement transition ACTIVE/PAUSED -> ENDED"
        side_effects:
          - "Engagement.wallet_credit_cents += sessions_remaining * per_session_value_cents"

  - entity: Booking
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW, RESCHEDULED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /bookings/{bookingId}/complete"
        actor: Trainer
        preconditions:
          - "Booking.status == BOOKED (else ERR_INVALID_STATE)"
          - "current_clock_utc >= Booking.start_utc (else ERR_SESSION_NOT_STARTED)"
        side_effects:
          - "Seat stays committed (COMPLETED still occupies the pack seat)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: [Client, Trainer]
        preconditions:
          - "Booking.status == BOOKED (else ERR_INVALID_STATE)"
          - "(Booking.start_utc - current_clock_utc) >= NO_SHOW_CUTOFF_SECONDS, i.e. cancellation is at least 24h ahead (else routed to LATE_CANCELLED)"
        side_effects:
          - "For SESSION_PACK: SessionPack seat released (sessions_committed -= 1); if pack was DEPLETED it returns to ACTIVE (cross-entity)"
          - "No fee; fee_charged_cents stays 0"
      - from: BOOKED
        to: LATE_CANCELLED
        trigger: "POST /bookings/{bookingId}/cancel"
        actor: [Client, Trainer]
        preconditions:
          - "Booking.status == BOOKED"
          - "(Booking.start_utc - current_clock_utc) < NO_SHOW_CUTOFF_SECONDS (within 24h)"
        side_effects:
          - "Seat stays committed (session consumed)"
          - "fee_charged_cents = round_half_up(SessionPack.per_session_value_cents * NO_SHOW_FEE_PCT) for SESSION_PACK; 0 for ONLINE_SUBSCRIPTION"
          - "Client.no_show_strikes recomputed (LATE_CANCELLED counts as a strike)"
          - "If recomputed Client.no_show_strikes >= NO_SHOW_STRIKE_LIMIT: Client.booking_privilege -> SUSPENDED (threshold cascade)"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /bookings/{bookingId}/mark-no-show"
        actor: Trainer
        preconditions:
          - "Booking.status == BOOKED (else ERR_INVALID_STATE)"
          - "current_clock_utc >= Booking.end_utc (else ERR_SESSION_NOT_ENDED)"
        side_effects:
          - "Seat stays committed (session consumed)"
          - "fee_charged_cents = round_half_up(SessionPack.per_session_value_cents * NO_SHOW_FEE_PCT) for SESSION_PACK; 0 for ONLINE_SUBSCRIPTION"
          - "Client.no_show_strikes recomputed (NO_SHOW counts as a strike)"
          - "If recomputed Client.no_show_strikes >= NO_SHOW_STRIKE_LIMIT: Client.booking_privilege -> SUSPENDED (threshold cascade)"
      - from: BOOKED
        to: RESCHEDULED
        trigger: "POST /bookings/{bookingId}/reschedule"
        actor: [Client, Trainer]
        preconditions:
          - "Booking.status == BOOKED (else ERR_INVALID_STATE)"
          - "(Booking.start_utc - current_clock_utc) >= NO_SHOW_CUTOFF_SECONDS (cannot reschedule within 24h, else ERR_RESCHEDULE_TOO_LATE)"
          - "New [start_utc,end_utc) clears the TRAINER buffer geometry against live trainer Bookings (else ERR_BOOKING_OVERLAP)"
          - "New [start_utc,end_utc) clears the CLIENT half-open geometry against live client Bookings (else ERR_CLIENT_DOUBLE_BOOKED)"
        side_effects:
          - "Creates a new Booking (status BOOKED) with rescheduled_from_booking_id = this booking's id, reusing the same pack seat (no net seat change)"
          - "This booking -> RESCHEDULED (terminal; seat handed to successor)"

  - entity: CheckIn
    field: status
    initial_state: SUBMITTED
    terminal_states: [ASSESSED]
    transitions:
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /check-ins/{checkInId}/request-revision"
        actor: Trainer
        preconditions:
          - "CheckIn.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /check-ins/{checkInId}/resubmit"
        actor: Client
        preconditions:
          - "CheckIn.status == REVISION_REQUESTED (else ERR_INVALID_STATE)"
        side_effects:
          - "adherence_score recomputed over the window"
        note: "Cyclic SUBMITTED<->REVISION_REQUESTED revision loop."
      - from: SUBMITTED
        to: ASSESSED
        trigger: "POST /check-ins/{checkInId}/assess"
        actor: Trainer
        preconditions:
          - "CheckIn.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "Client.latest_weight_kg recomputed from latest ASSESSED check-in (this one if newest by measured_at)"
          - "If a PROVISIONAL MacroPlan exists for the engagement: target_calories/protein_g/carb_g/fat_g recomputed from new weight (cross-entity ledger sync)"

  - entity: ProgramAssignment
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /program-assignments/{programId}/publish"
        actor: Trainer
        preconditions:
          - "ProgramAssignment.status == DRAFT (else ERR_INVALID_STATE)"
          - "Parent Engagement.status == ACTIVE (else ERR_ENGAGEMENT_NOT_ACTIVE)"
        side_effects:
          - "HabitLogs may now reference this program"
      - from: [DRAFT, PUBLISHED]
        to: ARCHIVED
        trigger: "POST /program-assignments/{programId}/archive OR system (Engagement end cascade)"
        actor: [Trainer, system]
        preconditions:
          - "ProgramAssignment.status IN {DRAFT, PUBLISHED}"
        side_effects: []

  - entity: MacroPlan
    field: status
    initial_state: PROVISIONAL
    terminal_states: [LOCKED]
    transitions:
      - from: PROVISIONAL
        to: LOCKED
        trigger: "POST /macro-plans/{macroPlanId}/lock OR system (Engagement end cascade)"
        actor: [Trainer, system]
        preconditions:
          - "MacroPlan.status == PROVISIONAL (else ERR_INVALID_STATE)"
        side_effects:
          - "Freezes target_calories/protein_g/carb_g/fat_g; later check-ins no longer recompute them"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: booking-create-stale-pack
    parent_entity: SessionPack
    write_endpoint: "POST /bookings"
    occ_field: "expected_session_pack_version"
    description: |
      Creating a Booking that commits a SessionPack seat against a pack whose
      version has advanced since the client last observed it is rejected. This
      captures the case where another writer has already committed the last
      remaining seat (legitimately depleting the pack under the booking rules)
      so the current writer's view of sessions_remaining is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: engagement-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /engagements"
    occ_field: "expected_client_version"
    description: |
      Creating an Engagement against a Client whose version has advanced since
      the client record was last observed is rejected. This captures the case
      where the client was re-assessed or returned to DRAFT after the writer
      read it, so the writer's view of intake_status is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: per_session_value_cents
    trigger: "SessionPack creation (POST /engagements/{id}/session-packs)"
    algorithm: aggregation
    formula: |
      per_session_value_cents = round_half_up(price_cents / total_sessions)
    input_set: "single SessionPack at creation"
    precision: "integer cents, round_half_up"

  - name: session_pack_balance
    trigger: "Booking create/cancel/reschedule/complete/no-show; Engagement end"
    algorithm: aggregation
    formula: |
      sessions_committed = COUNT(Booking WHERE session_pack_id == pack.id
                                  AND status IN {BOOKED, COMPLETED, NO_SHOW, LATE_CANCELLED})
      sessions_remaining = total_sessions - sessions_committed
      # RESCHEDULED and CANCELLED bookings do NOT occupy a seat.
    input_set: "Bookings of the pack filtered by the status set above"
    precision: "integer count"
    variants:
      - name: provisional_committed
        when: "while pack is ACTIVE/DEPLETED (sessions still consumable)"
        difference: "BOOKED seats are counted as committed (forward-looking hold)"
      - name: settled_consumed
        when: "at Engagement end, computing refund"
        difference: "only COMPLETED/NO_SHOW/LATE_CANCELLED seats are truly consumed; remaining BOOKED seats are refunded as sessions_remaining (chronological settle), so refund = (total_sessions - consumed) * per_session_value_cents differs from the provisional sessions_remaining whenever BOOKED seats exist"

  - name: no_show_fee
    trigger: "Booking BOOKED->NO_SHOW and BOOKED->LATE_CANCELLED transitions"
    algorithm: threshold
    formula: |
      delta_seconds = booking.start_utc - current_clock_utc   # at cancel time
      # Routing (cancel only): delta_seconds >= NO_SHOW_CUTOFF_SECONDS -> CANCELLED (free);
      #                        delta_seconds <  NO_SHOW_CUTOFF_SECONDS -> LATE_CANCELLED (fee).
      if engagement.billing_model == SESSION_PACK:
        fee_charged_cents = round_half_up(pack.per_session_value_cents * NO_SHOW_FEE_PCT)
      else:
        fee_charged_cents = 0
    input_set: "single Booking + its pack"
    constants:
      NO_SHOW_CUTOFF_SECONDS: 86400      # exactly 24 hours; boundary is >= (free) vs < (fee)
      NO_SHOW_FEE_PCT: 0.50
    precision: "integer cents, round_half_up"

  - name: no_show_strikes_and_privilege
    trigger: "Booking BOOKED->NO_SHOW and BOOKED->LATE_CANCELLED transitions (recompute on the booking's client)"
    algorithm: threshold
    formula: |
      no_show_strikes = COUNT(Booking b WHERE b.engagement_id IN (engagements of this client)
                              AND b.status IN {NO_SHOW, LATE_CANCELLED})
      if no_show_strikes >= NO_SHOW_STRIKE_LIMIT:
        booking_privilege = SUSPENDED
      else:
        booking_privilege = ALLOWED
    input_set: "all Bookings of the client across engagements in {NO_SHOW, LATE_CANCELLED}"
    constants:
      NO_SHOW_STRIKE_LIMIT: 3            # boundary: strike 2 -> still ALLOWED, strike 3 -> SUSPENDED (>= )
    precision: "integer count; enum result"

  - name: booking_overlap_check
    trigger: "Booking create (POST /bookings) and reschedule (POST /bookings/{id}/reschedule)"
    algorithm: interval_merge
    formula: |
      proposed = [start_utc, end_utc)   # half-open
      # TRAINER geometry (11a) — padded both sides, gap must be >= TRAINER_BUFFER_SECONDS:
      for each live Booking b on the SAME trainer (b.status IN {BOOKED, COMPLETED}):
        padded = [b.start_utc - TRAINER_BUFFER_SECONDS, b.end_utc + TRAINER_BUFFER_SECONDS)
        if proposed.start < padded.end AND padded.start < proposed.end: reject ERR_BOOKING_OVERLAP
      # CLIENT geometry (11b) — strict half-open, NO buffer, touching allowed:
      for each live Booking c of the SAME client (c.status IN {BOOKED, COMPLETED}):
        if proposed.start < c.end_utc AND c.start_utc < proposed.end: reject ERR_CLIENT_DOUBLE_BOOKED
    input_set: "live Bookings sharing the trainer (11a) or the client (11b)"
    constants:
      TRAINER_BUFFER_SECONDS: 900        # 15-minute pad between a trainer's sessions
    precision: "datetime arithmetic in seconds"
    note: "Two overlap geometries differ: trainer pads both endpoints by 900s (back-to-back rejected); client uses zero-buffer half-open (touching allowed)."

  - name: subscription_cancel_refund
    trigger: "ONLINE_SUBSCRIPTION engagement end mid-cycle (POST /engagements/{id}/end)"
    algorithm: forward_looking
    formula: |
      cycle_days = whole days in [cycle_start_utc, cycle_end_utc)   # always 30 for monthly
      elapsed_days = floor((current_clock_utc - cycle_start_utc) / 86400 seconds)
      remaining_days = cycle_days - elapsed_days        # clamped to [0, cycle_days]
      refund_cents = round_half_up(monthly_fee_cents * remaining_days / cycle_days)
      Engagement.wallet_credit_cents += refund_cents
    input_set: "the subscription's current billing cycle vs current clock"
    constants:
      MONTHLY_CYCLE_DAYS: 30
    precision: "integer cents, round_half_up"
    note: "Distinct subject (subscription engagement) from session_pack settle — dual-variant across domains."

  - name: macro_plan_targets
    trigger: "MacroPlan create; recompute on CheckIn assess while PROVISIONAL"
    algorithm: weighted_scoring
    formula: |
      age = CURRENT_YEAR - client.birth_year                      # CURRENT_YEAR from logical clock
      if client.sex == MALE:
        bmr = 10*weight_kg + 6.25*client.height_cm - 5*age + 5
      else:  # FEMALE
        bmr = 10*weight_kg + 6.25*client.height_cm - 5*age - 161
      tdee = bmr * ACTIVITY_MULT[activity_level]
      # EVALUATION ORDER PINNED: (1) bmr, (2) tdee, (3) target_calories from goal, (4) macro split from target_calories.
      if goal == FAT_LOSS:      target_calories = round_half_up(tdee * (1 - 0.20))
      elif goal == MAINTENANCE: target_calories = round_half_up(tdee * 1.00)
      else:                     target_calories = round_half_up(tdee * (1 + 0.10))   # MUSCLE_GAIN
      (pp, cp, fp) = SPLIT[goal]   # protein/carb/fat fractions of calories
      protein_g = round_half_up(target_calories * pp / 4)
      carb_g    = round_half_up(target_calories * cp / 4)
      fat_g     = round_half_up(target_calories * fp / 9)
    input_set: "client demographics + snapshot_weight_kg (= Client.latest_weight_kg at compute time)"
    constants:
      ACTIVITY_MULT: { SEDENTARY: 1.2, MODERATE: 1.55, ACTIVE: 1.725 }
      SPLIT: { FAT_LOSS: [0.40, 0.30, 0.30], MAINTENANCE: [0.30, 0.40, 0.30], MUSCLE_GAIN: [0.30, 0.45, 0.25] }
    precision: "target_calories and grams are integers, round_half_up; weight uses provided precision"
    variants:
      - name: provisional_estimate
        when: "MacroPlan.status == PROVISIONAL"
        difference: "recomputed from Client.latest_weight_kg each time a CheckIn is ASSESSED, so the same plan yields different numbers as weight changes"
      - name: locked_final
        when: "MacroPlan.status == LOCKED"
        difference: "numbers frozen at lock time; later check-ins do NOT recompute, so a locked plan and a provisional plan on identical inputs can diverge after a subsequent check-in"

  - name: adherence_score
    trigger: "CheckIn create; recompute on resubmit and assess"
    algorithm: weighted_scoring
    formula: |
      window = [check_in.window_start_utc, check_in.window_end_utc)   # half-open
      window_days = ceil((window_end_utc - window_start_utc) / 86400 seconds)
      planned_workouts = program.planned_workouts_per_week * (window_days / 7)   # exact rational, no early round
      completed_workouts = COUNT(HabitLog WHERE engagement match AND kind==WORKOUT_COMPLETED AND logged_at in window)
      nutrition_days     = COUNT(DISTINCT calendar-UTC-date of HabitLog WHERE kind==NUTRITION_LOGGED AND logged_at in window)
      habit_checks       = COUNT(HabitLog WHERE kind==HABIT_CHECK AND logged_at in window)
      workout_ratio   = min(1.0, completed_workouts / planned_workouts)        # capped at 1
      nutrition_ratio = min(1.0, nutrition_days / window_days)
      habit_ratio     = min(1.0, habit_checks / program.habit_checks_target)
      # SINGLE final rounding — ratios kept full precision until the end:
      adherence_score = round_half_up(100 * (W_WORKOUT*workout_ratio + W_NUTRITION*nutrition_ratio + W_HABIT*habit_ratio))
    input_set: "HabitLogs of the engagement whose logged_at is in the half-open window, joined to the engagement's PUBLISHED program"
    constants:
      W_WORKOUT: 0.50
      W_NUTRITION: 0.30
      W_HABIT: 0.20
    precision: "integer 0-100, round_half_up; ratios NOT rounded before weighting (round-once)"

  - name: package_invoice_total
    trigger: "POST /engagements/{id}/session-packs/invoice (price breakdown for a session-pack purchase)"
    algorithm: tiered_pricing
    formula: |
      # Line items: the pack base price plus zero or more add-on line items, each with a per-line discount_pct.
      # EVALUATION ORDER PINNED — round per-line, THEN sum, THEN tax once (NOT sum-then-round):
      for each line i:
        line_net_cents[i] = round_half_up(line.list_price_cents * (1 - line.discount_pct))
      subtotal_cents = SUM(line_net_cents[i])
      tax_cents = round_half_up(subtotal_cents * TAX_PCT)
      invoice_total_cents = subtotal_cents + tax_cents
    input_set: "the line items submitted in the invoice request body"
    constants:
      TAX_PCT: 0.0875
    precision: "integer cents, round_half_up applied per line and once for tax"
    note: "Round-per-line-then-sum vs sum-then-round diverge: three lines of list 201 @ 0.50 give subtotal 303 (pinned) not 302, total 330 not 328."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7; entity_backed role acting on a resource it does not own is forbidden"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (clientId, engagementId, then bookingId/checkInId/etc.)"
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_CHECKIN_NOT_FOUND | ERR_PROGRAM_NOT_FOUND | ERR_MACROPLAN_NOT_FOUND | ERR_PACK_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids

  - priority: 4
    category: existence
    check: "Referenced FK ids in body exist (trainer_id, client_id, engagement_id, session_pack_id, program_assignment_id)"
    error_id: "ERR_TRAINER_NOT_FOUND | ERR_CLIENT_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_PACK_NOT_FOUND | ERR_PROGRAM_NOT_FOUND"
    http_status: 404
    applies_to: "endpoints carrying FK fields in body"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, numeric fields > 0 where required (total_sessions, price_cents, weight_kg, planned_workouts_per_week, habit_checks_target), end > start, window_end > window_start"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all mutating endpoints

  - priority: 6
    category: state
    check: "Target resource in correct state for the transition (see §1.2 preconditions)"
    error_id: "ERR_INVALID_STATE | ERR_INTAKE_NOT_SUBMITTED"
    http_status: 409
    applies_to: state transition endpoints

  - priority: 7
    category: business_referential
    check: "Engagement creation requires Client.intake_status == ASSESSED"
    error_id: ERR_INTAKE_NOT_ASSESSED
    http_status: 409
    applies_to: "POST /engagements"

  - priority: 8
    category: business_referential
    check: "Booking on a SESSION_PACK engagement requires session_pack_id of a pack belonging to that engagement (any pack lifecycle status); ONLINE_SUBSCRIPTION bookings must omit session_pack_id. This check is about billing-model fit and pack ownership, NOT remaining-seat availability (that is priority 12)."
    error_id: ERR_PACK_MODEL_MISMATCH
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 9
    category: state
    check: "Booking creation requires parent Engagement.status == ACTIVE"
    error_id: ERR_ENGAGEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /bookings, POST /program-assignments, POST /program-assignments/{id}/publish"

  - priority: 10
    category: business_safety
    check: "Booking creation requires acting Client.booking_privilege == ALLOWED (no-show strikes under limit)"
    error_id: ERR_BOOKING_PRIVILEGE_SUSPENDED
    http_status: 403
    applies_to: "POST /bookings"

  - priority: "11a"
    category: business_temporal
    check: "TRAINER calendar: the proposed [start_utc,end_utc) plus a TRAINER_BUFFER_SECONDS pad on BOTH sides must not collide with any live Booking (status IN {BOOKED, COMPLETED}) on the same trainer. Two trainer sessions must be separated by at least TRAINER_BUFFER_SECONDS of gap; back-to-back (gap < buffer, including touching end==start) is rejected."
    error_id: ERR_BOOKING_OVERLAP
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/reschedule"

  - priority: "11b"
    category: business_temporal
    check: "CLIENT calendar: the proposed [start_utc,end_utc) must not overlap any live Booking (status IN {BOOKED, COMPLETED}) of the SAME client (across all that client's engagements), with strict half-open semantics and NO buffer — a session that starts exactly when another ends (end_utc == start_utc) is allowed (touching is permitted). Differs from 11a's padded geometry."
    error_id: ERR_CLIENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/reschedule"

  - priority: 12
    category: business_constraint
    check: "SESSION_PACK booking requires the referenced pack to have sessions_remaining > 0 (regardless of ACTIVE/DEPLETED status)"
    error_id: ERR_NO_SESSIONS_REMAINING
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 13
    category: business_fiscal
    check: "OCC: expected_session_pack_version / expected_client_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bookings, POST /engagements"

  - priority: 14
    category: business_referential
    check: "HabitLog requires program_assignment_id of a PUBLISHED program in the same engagement; logged_at must be within an open engagement"
    error_id: ERR_PROGRAM_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /habit-logs"

  - priority: 15
    category: business_constraint
    check: "MacroPlan create requires Client.latest_weight_kg not null (at least one ASSESSED check-in with weight) and at most one PROVISIONAL/LOCKED MacroPlan per engagement"
    error_id: ERR_NO_WEIGHT_FOR_MACROS
    http_status: 409
    applies_to: "POST /engagements/{id}/macro-plans"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an explicit UTC instant. Server startup default is 2026-04-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. CURRENT_YEAR for age derivation comes from this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Logical clock set; affects no-show routing, completion gating, subscription proration, age"]

  # ---- Trainer ----
  - method: POST
    path: "/trainers"
    description: "Register a trainer"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, "timezone?"]
    output: Trainer
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/trainers/{trainerId}"
    description: "Get a trainer"
    roles: [PlatformAdmin, Trainer]
    code: 200
    input: []
    output: Trainer
    side_effects: []

  # ---- Client (api_prefix collection) ----
  - method: POST
    path: "/clients"
    description: "Create a client intake record (DRAFT)"
    roles: [Trainer]
    code: 201
    input: [trainer_id, full_name, email, sex, birth_year, height_cm]
    output: Client
    side_effects: ["intake_status=DRAFT, no_show_strikes=0, booking_privilege=ALLOWED"]

  - method: GET
    path: "/clients/{clientId}"
    description: "Get a client (includes computed latest_weight_kg, no_show_strikes, booking_privilege)"
    roles: [Trainer, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/clients"
    description: "List clients; filter by trainer_id"
    roles: [Trainer, PlatformAdmin]
    code: 200
    input: ["trainer_id?", "limit?", "offset?"]
    output: "Client[]"
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/submit-intake"
    description: "Client submits intake for assessment"
    roles: [Client]
    code: 200
    input: []
    output: Client
    side_effects: ["intake_status DRAFT -> SUBMITTED"]

  - method: POST
    path: "/clients/{clientId}/assess"
    description: "Trainer marks intake ASSESSED"
    roles: [Trainer]
    code: 200
    input: []
    output: Client
    side_effects: ["intake_status SUBMITTED -> ASSESSED"]

  - method: POST
    path: "/clients/{clientId}/return-intake"
    description: "Trainer returns intake to DRAFT for revision"
    roles: [Trainer]
    code: 200
    input: []
    output: Client
    side_effects: ["intake_status SUBMITTED -> DRAFT"]

  # ---- Engagement ----
  - method: POST
    path: "/engagements"
    description: "Create an engagement for an ASSESSED client (OCC on client.version)"
    roles: [Trainer]
    code: 201
    input: [client_id, billing_model, expected_client_version, "monthly_fee_cents?", "cycle_start_utc?"]
    output: Engagement
    side_effects: ["status=ACTIVE; trainer_id copied from Client; increments Client.version by 1; for ONLINE_SUBSCRIPTION stores cycle window from cycle_start_utc + 30 days and monthly_fee_cents"]

  - method: GET
    path: "/engagements/{engagementId}"
    description: "Get an engagement (includes wallet_credit_cents, pause_reason)"
    roles: [Trainer, Client]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: GET
    path: "/engagements"
    description: "List engagements; filter by client_id or trainer_id"
    roles: [Trainer, Client, PlatformAdmin]
    code: 200
    input: ["client_id?", "trainer_id?", "limit?", "offset?"]
    output: "Engagement[]"
    side_effects: []

  - method: POST
    path: "/engagements/{engagementId}/pause"
    description: "Trainer manually pauses an engagement"
    roles: [Trainer]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status ACTIVE -> PAUSED, pause_reason=MANUAL"]

  - method: POST
    path: "/engagements/{engagementId}/resume"
    description: "Trainer resumes a paused engagement"
    roles: [Trainer]
    code: 200
    input: []
    output: Engagement
    side_effects: ["status PAUSED -> ACTIVE, pause_reason=NONE"]

  - method: POST
    path: "/engagements/{engagementId}/end"
    description: "End an engagement; cascades cancellations, pack refunds, subscription proration, plan lock/archive"
    roles: [Trainer]
    code: 200
    input: []
    output: Engagement
    side_effects:
      - "Cancels BOOKED bookings (no fee), releasing seats"
      - "Refunds remaining session-pack seats to wallet_credit_cents; packs -> REFUNDED"
      - "ONLINE_SUBSCRIPTION: subscription_cancel_refund added to wallet_credit_cents"
      - "PROVISIONAL MacroPlan -> LOCKED; DRAFT/PUBLISHED ProgramAssignment -> ARCHIVED"
      - "status -> ENDED"

  # ---- SessionPack (sub-resource of Engagement) ----
  - method: POST
    path: "/engagements/{engagementId}/session-packs"
    description: "Purchase a session pack for a SESSION_PACK engagement"
    roles: [Trainer]
    code: 201
    input: [total_sessions, price_cents]
    output: SessionPack
    side_effects: ["status=ACTIVE; per_session_value_cents computed; sessions_committed=0; sessions_remaining=total_sessions"]

  - method: GET
    path: "/engagements/{id}/session-packs"
    description: "List session packs for an engagement (reverse-reachability for SessionPack.engagement_id)"
    roles: [Trainer, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "SessionPack[]"
    side_effects: []

  - method: GET
    path: "/session-packs/{packId}"
    description: "Get a session pack (includes sessions_remaining, version)"
    roles: [Trainer, Client]
    code: 200
    input: []
    output: SessionPack
    side_effects: []

  - method: POST
    path: "/engagements/{engagementId}/session-packs/invoice"
    description: "Compute a session-pack purchase invoice (price breakdown) without persisting a pack"
    roles: [Trainer]
    code: 200
    input: [line_items]
    output: "{ subtotal_cents: integer, tax_cents: integer, invoice_total_cents: integer }"
    side_effects: ["package_invoice_total computed; no persistence"]

  # ---- Booking ----
  - method: POST
    path: "/bookings"
    description: "Book a session (OCC on session_pack.version for SESSION_PACK)"
    roles: [Trainer, Client]
    code: 201
    input: [engagement_id, start_utc, end_utc, "session_pack_id?", "expected_session_pack_version?"]
    output: Booking
    side_effects:
      - "status=BOOKED; trainer_id copied from engagement"
      - "SESSION_PACK: sessions_committed += 1; increments SessionPack.version by 1; if sessions_remaining hits 0 pack -> DEPLETED and engagement -> PAUSED (PACK_DEPLETED)"

  - method: GET
    path: "/bookings/{bookingId}"
    description: "Get a booking"
    roles: [Trainer, Client]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings; filter by engagement_id, session_pack_id, trainer_id, or rescheduled_from_booking_id (reverse-reachability for those FKs)"
    roles: [Trainer, Client, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "session_pack_id?", "trainer_id?", "rescheduled_from_booking_id?", "limit?", "offset?"]
    output: "Booking[]"
    side_effects: []

  - method: POST
    path: "/bookings/{bookingId}/cancel"
    description: "Cancel a booking; routes to CANCELLED (>=24h, free) or LATE_CANCELLED (<24h, fee)"
    roles: [Trainer, Client]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "CANCELLED: releases pack seat (sessions_committed -= 1); DEPLETED pack -> ACTIVE"
      - "LATE_CANCELLED: seat consumed; no_show_fee charged; strikes recomputed; privilege may SUSPEND"

  - method: POST
    path: "/bookings/{bookingId}/complete"
    description: "Mark a booking COMPLETED (after start)"
    roles: [Trainer]
    code: 200
    input: []
    output: Booking
    side_effects: ["status BOOKED -> COMPLETED; seat stays committed"]

  - method: POST
    path: "/bookings/{bookingId}/mark-no-show"
    description: "Mark a booking NO_SHOW (after end); charges fee, recomputes strikes"
    roles: [Trainer]
    code: 200
    input: []
    output: Booking
    side_effects: ["status BOOKED -> NO_SHOW; no_show_fee charged; strikes recomputed; privilege may SUSPEND"]

  - method: POST
    path: "/bookings/{bookingId}/reschedule"
    description: "Reschedule a booking to a new time (>=24h ahead); creates successor booking"
    roles: [Trainer, Client]
    code: 201
    input: [start_utc, end_utc]
    output: Booking
    side_effects: ["this booking -> RESCHEDULED; new BOOKED booking created with rescheduled_from_booking_id; seat handed over (no net change)"]

  # ---- ProgramAssignment ----
  - method: POST
    path: "/program-assignments"
    description: "Create a workout-plan/program assignment (DRAFT)"
    roles: [Trainer]
    code: 201
    input: [engagement_id, title, planned_workouts_per_week, habit_checks_target]
    output: ProgramAssignment
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/program-assignments/{programId}"
    description: "Get a program assignment"
    roles: [Trainer, Client]
    code: 200
    input: []
    output: ProgramAssignment
    side_effects: []

  - method: GET
    path: "/program-assignments"
    description: "List program assignments; filter by engagement_id"
    roles: [Trainer, Client, PlatformAdmin]
    code: 200
    input: ["engagement_id?", "limit?", "offset?"]
    output: "ProgramAssignment[]"
    side_effects: []

  - method: POST
    path: "/program-assignments/{programId}/publish"
    description: "Publish a program (DRAFT -> PUBLISHED)"
    roles: [Trainer]
    code: 200
    input: []
    output: ProgramAssignment
    side_effects: ["status -> PUBLISHED; HabitLogs may reference it"]

  - method: POST
    path: "/program-assignments/{programId}/archive"
    description: "Archive a program (DRAFT/PUBLISHED -> ARCHIVED)"
    roles: [Trainer]
    code: 200
    input: []
    output: ProgramAssignment
    side_effects: ["status -> ARCHIVED"]

  # ---- MacroPlan ----
  - method: POST
    path: "/engagements/{engagementId}/macro-plans"
    description: "Create a macro/nutrition plan (PROVISIONAL); requires a weight from an ASSESSED check-in"
    roles: [Trainer]
    code: 201
    input: [goal, activity_level]
    output: MacroPlan
    side_effects: ["status=PROVISIONAL; snapshot_weight_kg, target_calories, protein_g, carb_g, fat_g computed"]

  - method: GET
    path: "/macro-plans/{macroPlanId}"
    description: "Get a macro plan"
    roles: [Trainer, Client]
    code: 200
    input: []
    output: MacroPlan
    side_effects: []

  - method: GET
    path: "/engagements/{id}/macro-plans"
    description: "List macro plans for an engagement (reverse-reachability for MacroPlan.engagement_id)"
    roles: [Trainer, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "MacroPlan[]"
    side_effects: []

  - method: POST
    path: "/macro-plans/{macroPlanId}/lock"
    description: "Lock a macro plan (PROVISIONAL -> LOCKED); freezes targets"
    roles: [Trainer]
    code: 200
    input: []
    output: MacroPlan
    side_effects: ["status -> LOCKED; targets frozen"]

  # ---- CheckIn ----
  - method: POST
    path: "/engagements/{engagementId}/check-ins"
    description: "Submit a check-in with weight/photos/measurements and adherence window"
    roles: [Client, Trainer]
    code: 201
    input: [measured_at, weight_kg, window_start_utc, window_end_utc, "photo_urls?"]
    output: CheckIn
    side_effects: ["status=SUBMITTED; adherence_score computed over window"]

  - method: GET
    path: "/check-ins/{checkInId}"
    description: "Get a check-in (includes adherence_score)"
    roles: [Trainer, Client]
    code: 200
    input: []
    output: CheckIn
    side_effects: []

  - method: GET
    path: "/engagements/{id}/check-ins"
    description: "List check-ins for an engagement (reverse-reachability for CheckIn.engagement_id)"
    roles: [Trainer, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: "CheckIn[]"
    side_effects: []

  - method: POST
    path: "/check-ins/{checkInId}/request-revision"
    description: "Trainer requests a revision (SUBMITTED -> REVISION_REQUESTED)"
    roles: [Trainer]
    code: 200
    input: []
    output: CheckIn
    side_effects: ["status -> REVISION_REQUESTED"]

  - method: POST
    path: "/check-ins/{checkInId}/resubmit"
    description: "Client resubmits a revised check-in (REVISION_REQUESTED -> SUBMITTED)"
    roles: [Client]
    code: 200
    input: ["weight_kg?", "photo_urls?"]
    output: CheckIn
    side_effects: ["status -> SUBMITTED; adherence_score recomputed"]

  - method: POST
    path: "/check-ins/{checkInId}/assess"
    description: "Trainer assesses a check-in (SUBMITTED -> ASSESSED); recomputes latest weight and provisional macro targets"
    roles: [Trainer]
    code: 200
    input: []
    output: CheckIn
    side_effects: ["status -> ASSESSED; Client.latest_weight_kg recomputed; PROVISIONAL MacroPlan targets recomputed"]

  # ---- HabitLog (append-only) ----
  - method: POST
    path: "/habit-logs"
    description: "Log a workout/nutrition/habit event against a PUBLISHED program"
    roles: [Client, Trainer]
    code: 201
    input: [engagement_id, program_assignment_id, kind, logged_at]
    output: HabitLog
    side_effects: ["append-only; feeds adherence_score on next check-in compute"]

  - method: GET
    path: "/habit-logs/{habitLogId}"
    description: "Get a habit log (defines HabitLog collection segment for reverse-reachability)"
    roles: [Trainer, Client]
    code: 200
    input: []
    output: HabitLog
    side_effects: []

  - method: GET
    path: "/habit-logs"
    description: "List habit logs; filter by engagement_id or program_assignment_id (reverse-reachability for those FKs)"
    roles: [Trainer, Client]
    code: 200
    input: ["engagement_id?", "program_assignment_id?", "limit?", "offset?"]
    output: "HabitLog[]"
    side_effects: []

  # ---- Message (append-only) ----
  - method: POST
    path: "/messages"
    description: "Post a message into an engagement thread; sender_role derived from X-User-Role"
    roles: [Trainer, Client]
    code: 201
    input: [engagement_id, body]
    output: Message
    side_effects: ["append-only; sender_role set from caller role"]

  - method: GET
    path: "/messages/{messageId}"
    description: "Get a message (defines Message collection segment for reverse-reachability)"
    roles: [Trainer, Client]
    code: 200
    input: []
    output: Message
    side_effects: []

  - method: GET
    path: "/messages"
    description: "List messages; filter by engagement_id (reverse-reachability for Message.engagement_id)"
    roles: [Trainer, Client]
    code: 200
    input: ["engagement_id?", "limit?", "offset?"]
    output: "Message[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for the operation, or entity_backed role acting on a resource it does not own" }
  # --- existence ---
  - { id: ERR_TRAINER_NOT_FOUND, http: 404, condition: "Trainer id does not exist" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Client id does not exist" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "Engagement id does not exist" }
  - { id: ERR_PACK_NOT_FOUND, http: 404, condition: "SessionPack id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Booking id does not exist" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "ProgramAssignment id does not exist" }
  - { id: ERR_MACROPLAN_NOT_FOUND, http: 404, condition: "MacroPlan id does not exist" }
  - { id: ERR_CHECKIN_NOT_FOUND, http: 404, condition: "CheckIn id does not exist" }
  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad enum, non-positive numeric, or end<=start / window_end<=window_start" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_INTAKE_NOT_SUBMITTED, http: 409, condition: "Assess/return requires Client.intake_status == SUBMITTED" }
  - { id: ERR_INTAKE_NOT_ASSESSED, http: 409, condition: "Engagement creation requires Client.intake_status == ASSESSED" }
  - { id: ERR_ENGAGEMENT_NOT_ACTIVE, http: 409, condition: "Operation requires parent Engagement.status == ACTIVE" }
  - { id: ERR_PROGRAM_NOT_PUBLISHED, http: 409, condition: "HabitLog requires a PUBLISHED program in the same engagement" }
  # --- business referential / constraint ---
  - { id: ERR_PACK_MODEL_MISMATCH, http: 409, condition: "session_pack_id present for ONLINE_SUBSCRIPTION, missing for SESSION_PACK, or pack not of this engagement / not ACTIVE" }
  - { id: ERR_NO_SESSIONS_REMAINING, http: 409, condition: "SESSION_PACK booking attempted with sessions_remaining == 0, or resume requires available sessions" }
  - { id: ERR_NO_WEIGHT_FOR_MACROS, http: 409, condition: "MacroPlan create with Client.latest_weight_kg null, or a MacroPlan already exists for the engagement" }
  # --- safety / threshold ---
  - { id: ERR_BOOKING_PRIVILEGE_SUSPENDED, http: 403, condition: "Acting client's booking_privilege == SUSPENDED (no_show_strikes >= limit)" }
  # --- temporal ---
  - { id: ERR_BOOKING_OVERLAP, http: 409, condition: "New/rescheduled booking interval overlaps (incl. TRAINER_BUFFER_SECONDS pad) a live booking on the same trainer" }
  - { id: ERR_CLIENT_DOUBLE_BOOKED, http: 409, condition: "New/rescheduled booking interval overlaps (strict half-open, no buffer) a live booking of the same client" }
  - { id: ERR_RESCHEDULE_TOO_LATE, http: 409, condition: "Reschedule attempted within NO_SHOW_CUTOFF_SECONDS of start_utc" }
  - { id: ERR_SESSION_NOT_STARTED, http: 409, condition: "Complete attempted before current_clock_utc >= start_utc" }
  - { id: ERR_SESSION_NOT_ENDED, http: 409, condition: "mark-no-show attempted before current_clock_utc >= end_utc" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational role; registers trainers, sets the logical clock, reads across tenants"
    identity: opaque
    exclusive_operations:
      - "POST /trainers — register trainer"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET /clients, GET /engagements, GET /bookings, GET /program-assignments — operational reads"

  - name: Trainer
    description: "Coach; owns clients, engagements, programs, macro plans, billing, and session lifecycle. entity_backed: X-User-ID equals a Trainer.id and must match the resource's trainer_id for owned resources."
    identity: "entity_backed:Trainer"
    exclusive_operations:
      - "POST /clients — create client intake"
      - "POST /clients/{id}/assess — assess intake"
      - "POST /clients/{id}/return-intake — return intake"
      - "POST /engagements — create engagement"
      - "POST /engagements/{id}/pause | /resume | /end — engagement lifecycle"
      - "POST /engagements/{id}/session-packs — purchase pack"
      - "POST /engagements/{id}/session-packs/invoice — price a pack"
      - "POST /bookings/{id}/complete — complete session"
      - "POST /bookings/{id}/mark-no-show — mark no-show"
      - "POST /program-assignments + /publish + /archive — program lifecycle"
      - "POST /engagements/{id}/macro-plans + /macro-plans/{id}/lock — macro plan lifecycle"
      - "POST /check-ins/{id}/request-revision | /assess — review check-ins"
    shared_operations:
      - "POST /bookings — create booking (with Client)"
      - "POST /bookings/{id}/cancel — cancel booking (with Client)"
      - "POST /bookings/{id}/reschedule — reschedule (with Client)"
      - "POST /engagements/{id}/check-ins — submit check-in (with Client)"
      - "POST /habit-logs — log habit (with Client)"
      - "POST /messages — message (with Client)"
      - "GET reads on owned clients/engagements/bookings/packs/programs/macro-plans/check-ins/habit-logs/messages"

  - name: Client
    description: "Enrolled trainee; owns own intake, bookings, check-ins, habit logs, messages. entity_backed: X-User-ID equals a Client.id and must match the resource's client_id (directly or via engagement.client_id)."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /clients/{id}/submit-intake — submit own intake"
      - "POST /check-ins/{id}/resubmit — resubmit own check-in"
    shared_operations:
      - "POST /bookings — create booking (with Trainer)"
      - "POST /bookings/{id}/cancel — cancel booking (with Trainer)"
      - "POST /bookings/{id}/reschedule — reschedule (with Trainer)"
      - "POST /engagements/{id}/check-ins — submit check-in (with Trainer)"
      - "POST /habit-logs — log habit (with Trainer)"
      - "POST /messages — message (with Trainer)"
      - "GET reads on own client/engagements/bookings/packs/programs/macro-plans/check-ins/habit-logs/messages"
