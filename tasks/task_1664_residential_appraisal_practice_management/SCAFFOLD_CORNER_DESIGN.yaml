  - section: errors
    instances:
      - name: error_envelope_contains_error_id_and_message
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_CLIENT_NOT_FOUND]"]
        distinguishing_aspect: "Every catalog error is reachable through the instances of the other sections (see grounds there); this instance pins the fixed error envelope: data.error_id + data.message with response_type 'error'."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /appraisal/clients/11111111-1111-1111-1111-111111111111"
              as: FirmAdmin
              captures: { err: $.data.error_id, msg: $.data.message }
          assert: ["data.error_id == ERR_CLIENT_NOT_FOUND and data.message is a non-empty string (captured ${err}/${msg})"]

  - section: rbac
    instances:
      - name: clientuser_cannot_create_clients
        claim_type: role_denial
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "ClientUser calling FirmAdmin-exclusive POST /appraisal/clients -> 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /appraisal/clients"
              payload: { name: "C", client_type: AMC, contact_email: "c@x.example", default_turn_time_days: 7 }
              as: ClientUser
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { err: $.data.error_id }
          assert: ["error_id == ERR_FORBIDDEN_ROLE (captured ${err})"]

      - name: clientuser_cannot_read_foreign_order
        claim_type: role_denial
        grounds: [roles, "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "ClientUser A reading an order whose client_id is B -> 403 ERR_NOT_RESOURCE_OWNER (ownership check beyond role membership)."
        test_recipe:
          setup: ["clients A and B; one order owned by B"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "A", client_type: AMC, contact_email: "a@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /appraisal/clients"
              payload: { name: "B", client_type: AMC, contact_email: "b@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /appraisal/orders"
              payload: { client_id: "${cb_id}", property_address: "9 B St", property_type: SFR, estimated_value_cents: 45000000, loan_type: CONVENTIONAL, requested_turn_days: 7 }
              as: ClientUser
              as_user_id: "${cb_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "GET /appraisal/orders/${o_id}"
              as: ClientUser
              as_user_id: "${ca_id}"
              captures: { err: $.data.error_id }
          assert: ["error_id == ERR_NOT_RESOURCE_OWNER (captured ${err})"]

      - name: clientuser_cannot_cancel_foreign_order
        claim_type: role_denial
        grounds: [roles, "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "ClientUser A cancelling client B's order -> 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["clients A and B; one RECEIVED order owned by B"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
