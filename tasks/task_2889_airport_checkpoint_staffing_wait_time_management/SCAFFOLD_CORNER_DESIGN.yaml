      - name: duty_ledger_drops_cancelled_rows_from_both_variants
        claim_type: input_set_filtering
        grounds:
          - calculations.officer_duty_ledger.input_set
          - endpoints.GET_officers_duty-ledger
        distinguishing_aspect: "CANCELLED is the one assignment_state excluded from BOTH ledger variants and from the plan cost, and the exclusion must also unwind Officer.committed_duty_minutes. REASSIGN_PENDING, by contrast, is excluded from FORWARD_LOOKING_PLANNED yet still counts toward committed_duty_minutes — so 'excluded from the ledger' and 'released from the commitment' are deliberately different sets."
        test_recipe:
          setup:
            - "a DRAFT plan with two 30-minute assignments for one officer across two adjacent bands"
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_officer
            - *c_curve
            - *c_band1000
            - *c_band1030
            - *c_flight1030
            - *c_flight1100
            - *c_forecast1
            - *c_forecast2
            - *c_cpver
            - *c_plan
            - *c_asg1
            - &c_asg2
              call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_id}", time_band_id: "${band2_id}" }
              as: StaffingPlanner
              as_user_id: planner-1
              captures: { asg2_id: $.data.id }
          trigger:
            - call: "GET /officers/${off_id}/duty-ledger"
              payload: {}
              as: StaffingPlanner
              captures: { led_worked_before: $.data.worked_minutes, led_reg_before: $.data.regular_minutes, led_ot_before: $.data.overtime_minutes, led_head_before: $.data.cap_headroom_minutes }
            - call: "POST /lane-assignments/${asg2_id}/duty"
              payload: { action: "CANCEL" }
              as: DutyManager
              captures: { cancel_state: $.data.assignment_state }
            - call: "GET /officers/${off_id}/duty-ledger"
              payload: { variant: "FORWARD_LOOKING_PLANNED" }
              as: StaffingPlanner
              captures: { led_worked_after: $.data.worked_minutes, led_ot_after: $.data.overtime_minutes }
            - call: "GET /officers/${off_id}/duty-ledger"
              payload: { variant: "CHRONOLOGICAL_ACTUAL" }
              as: StaffingPlanner
              captures: { led_actual_after: $.data.worked_minutes }
            - call: "GET /officers/${off_id}"
              payload: {}
              as: StaffingPlanner
              captures: { off_committed_after_cancel: $.data.committed_duty_minutes }
            - call: "GET /staffing-plans/${plan_id}/cost-summary"
              payload: {}
              as: StaffingPlanner
              captures: { cost_after_cancel: $.data.base_cost_cents, ot_after_cancel: $.data.overtime_cost_cents }
          assert:
            - "${led_worked_before} == 60 (two SCHEDULED rows x planned_minutes 30), ${led_reg_before} == 45, ${led_ot_before} == 15 and ${led_head_before} == 585 == 600 - 15"
            - "${cancel_state} == CANCELLED"
            - "${led_worked_after} == 30 and ${led_ot_after} == 0 — the CANCELLED row left the FORWARD_LOOKING_PLANNED input set"
            - "${led_actual_after} == 0 — CHRONOLOGICAL_ACTUAL never counted either row because neither has checked_in_at_utc"
            - "${off_committed_after_cancel} == 30 — the cancel debited the conserved ledger by exactly this row's planned_minutes"
            - "${cost_after_cancel} == 3000 and ${ot_after_cancel} == 0 — the plan cost was recomputed from the surviving row alone (base 30 x 100)"

      - name: throughput_design_change_requires_both_diversion_rate_and_shortfall_run
        claim_type: aggregation
        grounds:
          - calculations.throughput_and_diversion_index
          - endpoints.GET_checkpoints_throughput-analysis
        distinguishing_aspect: "design_change_recommended is a conjunction, and the fixture reaches a state where the diversion leg alone is satisfied (rate 0.1000 with a shortfall run of 1) before the second band is forecast and pushes the run to 2. An implementation using OR flips true one step early."
        test_recipe:
          setup:
            - "one OPEN STANDARD lane (capacity 90/band) and two bands each fed by a 120-passenger flight"
          setup_api_calls:
            - *c_clock08
