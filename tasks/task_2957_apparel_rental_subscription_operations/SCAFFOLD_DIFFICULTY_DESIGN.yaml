  - rule_id: combinatorial_formula
    instances:
      - name: damage_fee_three_input_nonlinear_composition
        grounds:
          - "1.3 calculation damage_fee_assessment with constants RESIDUAL_RATE_BY_GRADE, SEVERITY_BASE_CENTS and SEVERITY_PCT"
          - "1.5 POST /damage-claims/{claim_id}/assessment"
          - "1.1 DamageClaim.residual_value_cents, gross_fee_cents, waiver_applied_cents, net_fee_cents"
          - "1.1 Inspection.condition_grade_after and damage_severity"
          - "1.1 Style.retail_price_cents"
        distinguishing_aspect: >-
          gross_fee_cents composes three independent inputs - Style.retail_price_cents, the inspection's
          condition_grade_after and its damage_severity - through min(residual, max(severity_base,
          round_half_up(severity_pct * residual))). The composition is non-linear: holding retail price and grade B
          fixed at residual_value_cents 19200, a MODERATE inspection is decided by the flat SEVERITY_BASE_CENTS floor
          (9000 beats the 6720 percentage term) while a SEVERE inspection is decided by the residual ceiling (19200
          clips the 22000 base). Neither arm is a scaled version of the other, so an implementation that keeps only
          the percentage term, only the flat base, or drops the residual ceiling gets exactly one of the two numbers
          right.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "plan SIG4 (item_slots 3), two certified technicians, style AUR-GOWN-01 with retail_price_cents 48000, two grade-A size-M units"
            - "member on SIG4 with waiver_active false, so waiver_applied_cents stays 0 in both arms and gross_fee_cents equals net_fee_cents"
            - "turn 1 on unit 001 (2026-08-10 to 2026-08-16, received 2026-08-18) is inspected NONE soil / MODERATE damage / condition_grade_after B"
            - "turn 2 on unit 002 (2026-08-20 to 2026-08-26, received 2026-08-28) is inspected NONE soil / SEVERE damage / condition_grade_after B"
            - "the two outbound legs are planned 2026-08-08 and 2026-08-18, ten days apart, so the shipping cadence window of 7 days is not violated"
            - "both jobs stay in PROCESSING with an OPEN claim; neither claim is charged, so the member keeps outstanding_fee_cents 0 until the assessments run"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
