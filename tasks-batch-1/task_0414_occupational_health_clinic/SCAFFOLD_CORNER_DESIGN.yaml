        distinguishing_aspect: "GET /clinic/drug-screens?encounter_id=X returns the (0-or-1) DrugScreen[] for that DRUG_SCREEN encounter — the FK reverse-reachability discovery channel for cascade-created children."
        test_recipe:
          setup:
            - "Employer ACTIVE; DRUG_NON_DOT encounter checked in; one drug screen created."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "DSList Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
