    instances:
      # --- Instance 1: BasePrepScope.finalize depends on DesignLayout.ACCEPTED
      - name: finalize_scope_requires_accepted_design
        grounds:
          - state_machines.BasePrepScope.DRAFT_to_FINALIZED
          - state_machines.DesignLayout.DRAFT_to_ACCEPTED
          - entities.BasePrepScope.fields.design_layout_id
        distinguishing_aspect: |
          Entity pair BasePrepScope -> DesignLayout: a scope can only FINALIZE when its
          referenced DesignLayout.status == ACCEPTED; finalize against a still-DRAFT design
          is rejected ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "STANDARD project MEASURED with a DRAFT design (not yet accepted) and a DRAFT scope referencing it."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mae M", email: "mae@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-STD11", name: "Std Turf", pile_height_mm: 35, price_per_sqft_cents: 500, roll_width_ft: 15 }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-SIL11", name: "Silica", material: "SILICA", price_per_sqft_cents: 100, coverage_lbs_per_sqft: 2 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "14 Lawn Way" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { measure_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${measure_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { design_id: $.data.id }
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_depth_in: 3 }
              as: SalesRep
              captures: { scope_id: $.data.id }
          trigger:
            - call: "POST /base-prep-scopes/${scope_id}/finalize"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "finalize returns ERR_INVALID_STATE (409) because DesignLayout.${design_id}.status == DRAFT"
            - "BasePrepScope.${scope_id}.status remains DRAFT"

      # --- Instance 2: InstallJob scheduling depends on Project.workflow + Crew cert
      - name: schedule_install_requires_deposit_paid_and_certified_crew
        grounds:
          - state_machines.Project.workflow_status.DEPOSIT_PAID_to_SCHEDULED
          - entities.Crew.fields.certified_putting
          - validations[priority=13]
        distinguishing_aspect: |
          Entity pair InstallJob -> Crew (different pair than instance 1): scheduling a
          PUTTING_GREEN install requires the assigned Crew.certified_putting == true; an
          uncertified crew is rejected ERR_CREW_NOT_CERTIFIED even though the project is DEPOSIT_PAID.
        test_recipe:
          setup:
            - "PUTTING_GREEN project DEPOSIT_PAID (billable_area 420). One crew exists with certified_putting=false, capacity 2000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ned N", email: "ned@x.com" }
              as: OpsAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /turf-products"
              payload: { sku: "T-PUTT", name: "Putt Turf", pile_height_mm: 15, price_per_sqft_cents: 700, roll_width_ft: 15, putting_rated: true }
              as: OpsAdmin
              captures: { turf_id: $.data.id }
            - call: "POST /infill-products"
              payload: { sku: "I-SIL12", name: "Silica", material: "SILICA", price_per_sqft_cents: 120, coverage_lbs_per_sqft: 3 }
              as: OpsAdmin
              captures: { infill_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Uncertified Crew", daily_capacity_sqft: 2000, certified_putting: false }
              as: OpsAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", site_address: "15 Lawn Way" }
              as: SalesRep
              captures: { proj_id: $.data.id }
            - call: "POST /site-measures"
              payload: { project_id: "${proj_id}", gross_area_sqft: 400, longest_run_ft: 10, slope_pct: 1.0 }
              as: SalesRep
              captures: { measure_id: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${proj_id}", site_measure_id: "${measure_id}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "PUTTING_GREEN" }
              as: SalesRep
              captures: { design_id: $.data.id }
            - call: "POST /design-layouts/${design_id}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_depth_in: 4 }
              as: SalesRep
              captures: { scope_id: $.data.id }
            - call: "POST /base-prep-scopes/${scope_id}/finalize"
              payload: {}
              as: SalesRep
            - call: "POST /quotes"
              payload: { project_id: "${proj_id}", design_layout_id: "${design_id}", base_prep_scope_id: "${scope_id}", deposit_pct: 0.30 }
              as: SalesRep
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: SalesRep
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OpsAdmin
              captures: { v_pre_accept: $.data.version }
            - call: "POST /quotes/${quote_id}/accept"
              payload: { expected_project_version: "${v_pre_accept}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /payments"
              payload: { project_id: "${proj_id}", kind: "DEPOSIT", amount_cents: 180558 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dep_pay_id: $.data.id }
            - call: "POST /_payments/settle"
              payload: { payment_id: "${dep_pay_id}" }
              as: OpsAdmin
          trigger:
            - call: "POST /install-jobs"
              payload: { project_id: "${proj_id}", crew_id: "${crew_id}", scheduled_start: "2026-04-20T09:00:00Z", scheduled_end: "2026-04-20T17:00:00Z" }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "scheduling returns ERR_CREW_NOT_CERTIFIED (422)"
            - "Project.${proj_id}.workflow_status remains DEPOSIT_PAID"
            - "Project.${proj_id}.variant == PUTTING_GREEN"

