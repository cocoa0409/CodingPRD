      - name: daily_close_cancels_stale_scheduled_assignments
        claim_type: valid_transition
        grounds:
          - state_machines.Assignment.SCHEDULED_to_CANCELLED
          - "endpoints[POST /v1/sites/{siteId}/daily-close]"
        distinguishing_aspect: "Ops-run checkpoint: a SCHEDULED assignment whose window_start + 24h has passed without confirmation is auto-CANCELLED by daily-close and reported in cancelled_assignment_ids; a CONFIRMED assignment survives."
        test_recipe:
          setup: ["QUOTED job with assignment A SCHEDULED (window 2026-08-01 06:00-14:00, never confirmed) and assignment B (unit 2) SCHEDULED then CONFIRMED; clock advanced to 2026-08-02T07:00"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
