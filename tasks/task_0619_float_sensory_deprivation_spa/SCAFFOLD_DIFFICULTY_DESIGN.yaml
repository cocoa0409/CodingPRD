            - "error_id == ERR_TANK_UNAVAILABLE"
            - "Booking.${bk_id}.status == CONFIRMED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- A: Tank booking overlap WITH turnover buffer (half-open)
      - name: rto_tank_buffer_overlap
        grounds:
          - validations[priority=9]
          - state_machines.Booking.RESERVED_to_CONFIRMED
          - entities.Tank.fields.turnover_buffer_minutes
          - entities.Booking.fields.end_utc
        distinguishing_aspect: |
          Tank interval semantics INCLUDE the turnover buffer: occupied window is
          [start, end + turnover_buffer_minutes). A second booking starting inside the buffer of the
          first (10:00-11:00 + 30m buffer -> blocked until 11:30) is rejected with
          ERR_TANK_TIME_CONFLICT; a booking at exactly 11:30 (buffer end, half-open) is allowed.
        test_recipe:
          setup:
            - "SINGLE tank buffer 30m; Booking#1 60m at 10:00 exists (occupies [10:00,11:30))"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "SOLO", monthly_fee_cents: 8000, included_floats_per_cycle: 4, rollover_cap: 4, retail_float_cents: 5000 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "rto1@x.com", full_name: "Are One" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /tanks"
              payload: { name: "Pod-Rto1", capacity_kind: "SINGLE", turnover_buffer_minutes: 30 }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-12-02T10:00:00Z", pay_source: "CASH" }
              as: FrontDesk
              captures: { bk1: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2026-12-02T11:15:00Z", pay_source: "CASH" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "error_id == ERR_TANK_TIME_CONFLICT"

      # ---- B: Attendant orientation overlap, NO buffer, adjacency allowed (different resource + semantics)
      - name: rto_attendant_no_buffer_overlap
        grounds:
          - validations[priority=10]
          - entities.Orientation.fields.start_utc
          - entities.Orientation.fields.end_utc
        distinguishing_aspect: |
          Attendant interval semantics use the raw [start, end) window with NO buffer (distinct
          resource entity and distinct interval arithmetic from the buffered Tank rule): a second
          orientation overlapping the first on the same attendant is rejected with
          ERR_ATTENDANT_TIME_CONFLICT, but a back-to-back orientation at exactly the first's end_utc
          is allowed.
        test_recipe:
          setup:
            - "Attendant with one SCHEDULED orientation 2026-12-05T09:00-10:00 for member A"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-04T00:00:00Z" }
              as: Admin
            - call: "POST /members"
              payload: { email: "rto2a@x.com", full_name: "Are Two A" }
              as: FrontDesk
              captures: { mem_a: $.data.id }
            - call: "POST /members"
              payload: { email: "rto2b@x.com", full_name: "Are Two B" }
              as: FrontDesk
              captures: { mem_b: $.data.id }
            - call: "POST /attendants"
              payload: { full_name: "La" }
              as: Admin
              captures: { att_id: $.data.id }
            - call: "POST /orientations"
              payload: { member_id: "${mem_a}", attendant_id: "${att_id}", start_utc: "2026-12-05T09:00:00Z", end_utc: "2026-12-05T10:00:00Z" }
              as: FrontDesk
              captures: { ori_a: $.data.id }
          trigger:
            - call: "POST /orientations"
              payload: { member_id: "${mem_b}", attendant_id: "${att_id}", start_utc: "2026-12-05T09:30:00Z", end_utc: "2026-12-05T10:30:00Z" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "error_id == ERR_ATTENDANT_TIME_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # ---- A: float-credit ledger conservation (credit_balance == sum(ledger.delta))
      - name: ci_credit_ledger_conservation_consume
        grounds:
          - calculations.credit_balance_reconcile
          - entities.Membership.fields.credit_balance
          - entities.CreditLedgerEntry.fields.delta
          - state_machines.Booking.CONFIRMED_to_CHECKED_IN
          - state_machines.Membership.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity = FLOAT CREDITS, pinned as the invariant
          (Membership.credit_balance - sum(CreditLedgerEntry.delta)) == 0. The GRANT at activation
          (+4) and the CONSUME at check-in (-1) are each written as ledger entries, and the stored
          balance (3) always equals the running ledger sum (4 - 1 = 3) — zero drift in the named
          quantity across the forward grant and the consuming action.
        test_recipe:
          setup:
            - "SOLO plan included 4; oriented active member; ACTIVE membership balance 4; SINGLE tank CLEAN"
            - "A CREDIT 60m booking confirmed then checked in (consumes 1 credit)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "SOLO", monthly_fee_cents: 8000, included_floats_per_cycle: 4, rollover_cap: 4, retail_float_cents: 5000 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "ci1@x.com", full_name: "See One" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /attendants"
              payload: { full_name: "Ma" }
              as: Admin
              captures: { att_id: $.data.id }
            - call: "POST /orientations"
              payload: { member_id: "${mem_id}", attendant_id: "${att_id}", start_utc: "2027-01-01T01:00:00Z", end_utc: "2027-01-01T01:30:00Z" }
              as: FrontDesk
              captures: { ori_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T01:05:00Z" }
              as: Admin
            - call: "POST /orientations/${ori_id}/complete"
              payload: {}
              as: FrontDesk
            - call: "POST /memberships"
              payload: { member_id: "${mem_id}", plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { ship_id: $.data.id }
            - call: "POST /memberships/${ship_id}/activate"
              payload: {}
              as: FrontDesk
              captures: { bal0: $.data.credit_balance }
            - call: "POST /tanks"
              payload: { name: "Pod-Ci1", capacity_kind: "SINGLE", turnover_buffer_minutes: 30 }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2027-01-02T10:00:00Z", pay_source: "CREDIT", membership_id: "${ship_id}" }
              as: FrontDesk
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/confirm"
              payload: {}
              as: FrontDesk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T09:55:00Z" }
              as: Admin
          trigger:
            - call: "POST /bookings/${bk_id}/check-in"
              payload: {}
              as: FrontDesk
              captures: { bal1: $.data.credits_consumed }
            - call: "GET /memberships/${ship_id}"
              payload: {}
              as: FrontDesk
              captures: { balm: $.data.credit_balance }
          assert:
            - "Membership.${ship_id}.credit_balance == 3"
            - "sum of CreditLedgerEntry.delta for membership ${ship_id} == 3 (GRANT +4, CONSUME -1)"
            - "Booking.${bk_id}.credits_consumed == 1"

      # ---- B: money conservation on a gift card (hold + refund leaves balance unchanged)
      - name: ci_giftcard_money_conservation_hold_refund
        grounds:
          - calculations.gift_card_balance
          - entities.GiftCard.fields.remaining_balance_cents
          - entities.Payment.fields.amount_cents
          - state_machines.Booking.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = MONEY (distinct from credits). A GIFT_CARD booking holds a deposit
          (DEPOSIT_HOLD +2000 debits the card to 8000); a TIMELY cancel posts DEPOSIT_REFUND -2000
          restoring the card to exactly 10000 — the forward+compensating pair leaves
          remaining_balance_cents unchanged.
        test_recipe:
          setup:
            - "Gift card initial 10000; oriented active member; SINGLE tank; GIFT_CARD 60m booking RESERVED start 2027-02-10T10:00Z"
            - "Clock well before the 24h cutoff so the cancel is timely"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: Admin
            - call: "POST /plans"
              payload: { tier: "SOLO", monthly_fee_cents: 8000, included_floats_per_cycle: 4, rollover_cap: 4, retail_float_cents: 5000 }
              as: Admin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "ci2@x.com", full_name: "See Two" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /tanks"
              payload: { name: "Pod-Ci2", capacity_kind: "SINGLE", turnover_buffer_minutes: 30 }
              as: Admin
              captures: { tank_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { code: "GC-CI2", initial_balance_cents: 10000 }
              as: FrontDesk
              captures: { gc_id: $.data.id }
            - call: "POST /bookings"
              payload: { member_id: "${mem_id}", tank_id: "${tank_id}", session_minutes: 60, start_utc: "2027-02-10T10:00:00Z", pay_source: "GIFT_CARD", gift_card_id: "${gc_id}" }
              as: FrontDesk
              captures: { bk_id: $.data.id, dep: $.data.deposit_cents }
            - call: "GET /gift-cards/${gc_id}"
              payload: {}
              as: FrontDesk
              captures: { rem_after_hold: $.data.remaining_balance_cents }
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              payload: {}
              as: FrontDesk
            - call: "GET /gift-cards/${gc_id}"
              payload: {}
              as: FrontDesk
              captures: { rem_final: $.data.remaining_balance_cents }
          assert:
            - "After hold GiftCard.${gc_id}.remaining_balance_cents == 8000"
            - "After timely cancel GiftCard.${gc_id}.remaining_balance_cents == 10000"
            - "A Payment kind=DEPOSIT_HOLD source=GIFT_CARD amount_cents=2000 and a Payment kind=DEPOSIT_REFUND source=GIFT_CARD amount_cents=-2000 both exist for ${bk_id}"
