        distinguishing_aspect: "The logical clock starts at exactly 2026-08-01T00:00:00Z and may only move forward or stay put; a request for 2026-07-31T00:00:00Z answers HTTP 409 ERR_CLOCK_NOT_MONOTONIC and the clock still reads 2026-09-01T00:00:00Z."
        test_recipe:
          setup:
            - "the logical clock advanced once to 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          assert:
            - "the backwards call returns HTTP 409 with data.error_id == ERR_CLOCK_NOT_MONOTONIC"
            - "the equal-instant call returns HTTP 200 with current_utc == 2026-09-01T00:00:00Z (the comparison is >=)"

      - name: obsolete_part_with_no_stock_cannot_be_put_on_a_line
