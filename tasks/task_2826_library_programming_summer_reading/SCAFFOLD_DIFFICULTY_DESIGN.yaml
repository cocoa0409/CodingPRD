# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Library Programming & Summer Reading — 9 rule_id blocks, 18 instances.
# Every literal in every `assert:` line was computed by executing the matching
# §1.3 formula against the pinned setup inputs.
# Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00.000Z
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: attendance_attainment_funder_vs_internal_denominator_divergence
        grounds:
          - calculations.program_attendance_attainment
          - entities.Program.fields.attendance_attainment_funder_pct
          - entities.Program.fields.attendance_attainment_internal_pct
          - entities.Program.fields.confirmed_room_capacity
          - calculations.room_effective_capacity
        distinguishing_aspect: |
          Domain is Program outcome reporting: one and the same close-out produces
          attendance_attainment_funder_pct 60.0 (denominator attendance_target 55, the number
          promised to the funder) and attendance_attainment_internal_pct 64.7 (denominator
          confirmed_room_capacity 51, the seats that physically existed after the wheelchair
          layout), a 4.7-point divergence from identical attendance data.
        test_recipe:
          setup:
            - "One branch with a 60-seat wheelchair-accessible community room."
            - "One SCHOOL_AGE, IN_BRANCH, REGISTRATION program running 2026-08-15T14:00Z-15:00Z with attendance_target 55, attendance_cap 55, accessibility_accommodations [WHEELCHAIR_LAYOUT] and supply_units_per_attendee 0 (no materials draw)."
            - "A CONFIRMED room reservation whose effective_capacity_seats is 51 = floor(60 * 0.85)."
            - "39 seats registered; the program CONFIRMED; the clock moved past the program's end instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Community Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15, accessibility_features: ["WHEELCHAIR_ACCESSIBLE", "HEARING_LOOP"], status: "AVAILABLE" }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Family Storytime", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-15T14:00:00.000Z", end_utc: "2026-08-15T15:00:00.000Z", attendance_target: 55, attendance_cap: 55, supply_sku: "KIT-STORY", supply_units_per_attendee: 0, materials_budget_cents: 12000, presenter_fee_budget_cents: 100000, accessibility_accommodations: ["WHEELCHAIR_LAYOUT"] }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /library/programs/${prog}/schedule"
              payload: {}
              as: ProgramCoordinator
              captures: { prog_v: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-15T13:30:00.000Z", end_utc: "2026-08-15T15:15:00.000Z", setup_minutes: 30, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
              captures: { resv: $.data.id }
            - call: "POST /library/reservations/${resv}/confirm"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog}/registrations"
              payload: { registrant_reference: "FAMILY-BLOCK-1", seats: 39 }
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog}/confirm"
              payload: {}
              as: ProgramManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T16:00:00.000Z" }
              as: ProgramManager
          trigger:
            - call: "POST /library/programs/${prog}/close-out"
              payload: { verified_registrant_attendance: 33, drop_in_headcount: 0, surveys_collected: 12 }
              as: ProgramManager
          assert:
            - "Program.${prog}.confirmed_room_capacity == 51"
            - "Program.${prog}.gross_attendance == 33"
            - "Program.${prog}.attendance_attainment_funder_pct == 60.0"
            - "Program.${prog}.attendance_attainment_internal_pct == 64.7"
            - "Program.${prog}.attendance_attainment_internal_pct - Program.${prog}.attendance_attainment_funder_pct == 4.7"
            - "Program.${prog}.no_show_count == 6"
            - "Program.${prog}.survey_response_rate_pct == 36.4"
            - "Program.${prog}.operational_status == CLOSED_OUT"

      - name: correction_policy_ledger_truth_revokes_where_high_water_retains
        grounds:
          - calculations.participant_progress_ledger
          - entities.ReadingChallenge.fields.correction_policy
          - entities.Participant.fields.awarded_tier_index
          - state_machines.TierAward.RESERVED_to_REVOKED
          - entities.ReadingChallenge.fields.prize_committed_cents
        distinguishing_aspect: |
          Different entity domain from the attendance variant: this one scores reader progress on
          Participant/TierAward. Two challenges receive byte-identical log and correction data;
          the LEDGER_TRUTH reader ends at awarded_tier_index 1 with prize_committed_cents 100
          while the HIGH_WATER reader keeps awarded_tier_index 2 and prize_committed_cents 569.
        test_recipe:
          setup:
            - "One branch; two challenges over 2026-06-01..2026-08-31 with logging_method MINUTES, prize_budget_cents 100000 — challenge A with correction_policy LEDGER_TRUTH, challenge B with HIGH_WATER."
            - "Each challenge has tier_index 1 (threshold 60) and tier_index 2 (threshold 150); challenge A draws prizes PRIZE-A1/PRIZE-A2, challenge B draws PRIZE-B1/PRIZE-B2."
            - "PRIZE lots at the readers' home branch: PRIZE-A1 and PRIZE-B1 at 100 cents/unit, PRIZE-A2 and PRIZE-B2 at 469 cents/unit, 100 units each, reuse_pool false (no cross-branch surcharge)."
            - "One participant per challenge; each logs 100 units on 2026-06-10 and 80 units on 2026-06-11, reaching cumulative_units 180 and holding both tier awards."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "PRIZE", sku: "PRIZE-A1", unit_cost_cents: 100, quantity_procured: 100, reuse_pool: false }
              as: ProgramManager
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "PRIZE", sku: "PRIZE-A2", unit_cost_cents: 469, quantity_procured: 100, reuse_pool: false }
              as: ProgramManager
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "PRIZE", sku: "PRIZE-B1", unit_cost_cents: 100, quantity_procured: 100, reuse_pool: false }
              as: ProgramManager
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "PRIZE", sku: "PRIZE-B2", unit_cost_cents: 469, quantity_procured: 100, reuse_pool: false }
              as: ProgramManager
            - call: "POST /library/reading-challenges"
              payload: { name: "Summer A", logging_method: "MINUTES", unit_label: "minute", start_on: "2026-06-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 100000 }
              as: ProgramManager
              captures: { ch_a: $.data.id }
            - call: "POST /library/reading-challenges/${ch_a}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 60, prize_sku: "PRIZE-A1", prize_units_per_participant: 1 }
              as: ProgramManager
            - call: "POST /library/reading-challenges/${ch_a}/incentive-tiers"
              payload: { tier_index: 2, threshold_units: 150, prize_sku: "PRIZE-A2", prize_units_per_participant: 1 }
              as: ProgramManager
            - call: "POST /library/reading-challenges/${ch_a}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /library/reading-challenges"
              payload: { name: "Summer B", logging_method: "MINUTES", unit_label: "minute", start_on: "2026-06-01", end_on: "2026-08-31", correction_policy: "HIGH_WATER", prize_budget_cents: 100000 }
              as: ProgramManager
              captures: { ch_b: $.data.id }
            - call: "POST /library/reading-challenges/${ch_b}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 60, prize_sku: "PRIZE-B1", prize_units_per_participant: 1 }
              as: ProgramManager
            - call: "POST /library/reading-challenges/${ch_b}/incentive-tiers"
              payload: { tier_index: 2, threshold_units: 150, prize_sku: "PRIZE-B2", prize_units_per_participant: 1 }
              as: ProgramManager
            - call: "POST /library/reading-challenges/${ch_b}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /library/participants"
              payload: { challenge_id: "${ch_a}", home_branch_id: "${br}", display_name: "Reader A", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { p_a: $.data.id }
            - call: "POST /library/participants"
              payload: { challenge_id: "${ch_b}", home_branch_id: "${br}", display_name: "Reader B", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { p_b: $.data.id }
            - call: "POST /library/participants/${p_a}/log-entries"
              payload: { units: 100, logged_on: "2026-06-10", source: "STAFF_DESK" }
              as: ProgramCoordinator
              captures: { e_a1: $.data.id }
            - call: "POST /library/participants/${p_a}/log-entries"
              payload: { units: 80, logged_on: "2026-06-11", source: "STAFF_DESK" }
              as: ProgramCoordinator
            - call: "POST /library/participants/${p_b}/log-entries"
              payload: { units: 100, logged_on: "2026-06-10", source: "STAFF_DESK" }
              as: ProgramCoordinator
              captures: { e_b1: $.data.id }
            - call: "POST /library/participants/${p_b}/log-entries"
              payload: { units: 80, logged_on: "2026-06-11", source: "STAFF_DESK" }
              as: ProgramCoordinator
            - call: "GET /library/participants/${p_a}"
              payload: {}
              as: ProgramCoordinator
              captures: { p_a_v: $.data.version }
            - call: "GET /library/participants/${p_b}"
              payload: {}
              as: ProgramCoordinator
              captures: { p_b_v: $.data.version }
          trigger:
            - call: "POST /library/participants/${p_a}/log-corrections"
              payload: { corrected_entry_id: "${e_a1}", units_delta: -50, expected_participant_version: "${p_a_v}", note: "double-counted session" }
              as: ProgramCoordinator
            - call: "POST /library/participants/${p_b}/log-corrections"
              payload: { corrected_entry_id: "${e_b1}", units_delta: -50, expected_participant_version: "${p_b_v}", note: "double-counted session" }
              as: ProgramCoordinator
          assert:
            - "Participant.${p_a}.cumulative_units == 130 and Participant.${p_b}.cumulative_units == 130"
            - "Participant.${p_a}.eligible_tier_index == 1 and Participant.${p_b}.eligible_tier_index == 1"
            - "Participant.${p_a}.awarded_tier_index == 1"
            - "Participant.${p_b}.awarded_tier_index == 2"
            - "GET /library/tier-awards?participant_id=${p_a}&status=REVOKED returns exactly 1 award and its tier is the tier_index 2 tier of challenge ${ch_a}"
            - "GET /library/tier-awards?participant_id=${p_b}&status=RESERVED returns exactly 2 awards"
            - "ReadingChallenge.${ch_a}.prize_committed_cents == 100"
            - "ReadingChallenge.${ch_b}.prize_committed_cents == 569"
            - "The PRIZE-A2 lot has quantity_reserved == 0 and quantity_available == 100; the PRIZE-B2 lot has quantity_reserved == 1 and quantity_available == 99"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: contract_total_fee_seven_step_order_with_premium_on_full_subtotal
        mode: a
        grounds:
          - calculations.contract_total_fee
          - entities.PresenterContract.fields.travel_fee_cents
          - entities.PresenterContract.fields.escort_fee_cents
          - entities.PresenterContract.fields.insurance_rider_fee_cents
          - entities.PresenterContract.fields.weekend_premium_cents
          - entities.PresenterContract.fields.total_fee_cents
        distinguishing_aspect: |
          Four independent non-linear inputs interact in one payable total: tiered mileage
          (75 miles straddles the 60-mile tier boundary), the minors escort flat fee (driven by
          age_group, not by any fee input), the insurance rider (driven by a date comparison against
          program end + 30 days) and the weekend premium (driven by the UTC weekday of start_utc and
          applied to the POST-additions subtotal). Every component is asserted separately, so an
          implementation that applies the 10% premium to base_cents alone lands on 108775 instead of
          109753 and is caught by weekend_premium_cents == 9978 rather than only by the total.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one branch with per_program_fee_cap_cents 150000 (the system PROGRAM_FEE_CAP_CENTS is 250000, so the branch cap binds)."
            - "One SCHOOL_AGE (serves_minors true) IN_BRANCH program on Saturday 2026-08-15T14:00Z-15:00Z, left in DRAFT (execute admits DRAFT and SCHEDULED), materials_budget_cents 12000, presenter_fee_budget_cents 100000."
            - "One presenter whose insurance_certificate_expires_on is 2026-09-10: on or after the program end date (so priority 20 passes) but inside the 30-day rider window that ends 2026-09-14 (so the rider is charged)."
            - "That presenter screened NAME_CHECK with result CLEAR decided_on 2026-07-01, giving screening_valid_until 2027-07-01 and screening_status ACTIVE at the clock."
            - "A contract with round_trip_miles 75 (40 miles in tier 1, 15 miles in tier 2) offered at 90000 by one user, executed by a different user (segregation of duties)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Saturday Science", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-15T14:00:00.000Z", end_utc: "2026-08-15T15:00:00.000Z", attendance_target: 40, attendance_cap: 40, supply_sku: "KIT-SCI", supply_units_per_attendee: 0, materials_budget_cents: 12000, presenter_fee_budget_cents: 100000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /library/presenters"
              payload: { legal_name: "Ada Reyes", presenter_type: "INDIVIDUAL", insurance_certificate_expires_on: "2026-09-10", quoted_fee_cents: 90000 }
              as: ProgramCoordinator
              captures: { pres: $.data.id }
            - call: "POST /library/presenters/${pres}/screening-requests"
              payload: { screening_tier: "NAME_CHECK" }
              as: ScreeningOfficer
            - call: "POST /library/presenters/${pres}/screening-results"
              payload: { result: "CLEAR", decided_on: "2026-07-01" }
              as: ScreeningOfficer
            - call: "POST /library/contracts"
              payload: { presenter_id: "${pres}", program_id: "${prog}", round_trip_miles: 75 }
              as: ProgramCoordinator
              as_user_id: "user-coord-1"
              captures: { ct: $.data.id }
            - call: "POST /library/contracts/${ct}/offer"
              payload: { offered_fee_cents: 90000 }
              as: ProgramCoordinator
              as_user_id: "user-coord-1"
          trigger:
            - call: "POST /library/contracts/${ct}/execute"
              payload: {}
              as: ProgramManager
              as_user_id: "user-mgr-1"
          assert:
            - "PresenterContract.${ct}.travel_fee_cents == 3275"
            - "PresenterContract.${ct}.escort_fee_cents == 4000"
            - "PresenterContract.${ct}.insurance_rider_fee_cents == 2500"
            - "PresenterContract.${ct}.weekend_premium_cents == 9978"
            - "PresenterContract.${ct}.agreed_fee_cents == 90000"
            - "PresenterContract.${ct}.total_fee_cents == 109753"
            - "PresenterContract.${ct}.total_fee_cents != 108775 (premium applied to base_cents alone)"
            - "PresenterContract.${ct}.status == EXECUTED"
            - "Presenter.${pres}.engagement_status == ACTIVE and Presenter.${pres}.executed_contract_count == 1"
            - "Program.${prog}.compliance_status == CLEARED and Program.${prog}.operational_status == DRAFT"
            - "Program.${prog}.presenter_fee_committed_cents == 109753"
            - "Program.${prog}.budget_variance_cents == 2247 and Program.${prog}.budget_posture == WITHIN_BUDGET"

      - name: prize_surcharge_rounded_per_award_never_over_the_challenge_total
        mode: b
        grounds:
          - calculations.prize_award_cost
          - entities.TierAward.fields.transfer_surcharge_cents
          - entities.ReadingChallenge.fields.prize_committed_cents
          - entities.InventoryLot.fields.quantity_reserved
        distinguishing_aspect: |
          Same formula, different discriminating property: this instance holds the inputs fixed and
          varies only the rounding site. Two readers each draw one 469-cent prize unit from a
          cross-branch reuse lot; per-award rounding gives round_half_up(37.52) = 38 twice, so
          prize_committed_cents is 1014, while rounding 8% once over the combined base 938 gives 75
          and 1013. A one-cent gap in a challenge-level ledger field is the only observable.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; two branches — home branch H and a second branch O."
            - "A single PRIZE lot for sku PRIZE-X exists, and it belongs to branch O with reuse_pool true, unit_cost_cents 469 and quantity_procured 10; branch H holds no PRIZE-X lot, so both awards must fall through to bucket 2 and pay the 8% cross-branch surcharge."
            - "One OPEN challenge (MINUTES, 2026-06-01..2026-08-31, prize_budget_cents 100000) with a single tier: tier_index 1, threshold_units 60, prize_sku PRIZE-X, prize_units_per_participant 1."
            - "Two participants whose home_branch_id is H."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Hill Branch", branch_code: "HIL", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br_h: $.data.id }
            - call: "POST /library/branches"
              payload: { name: "Oak Branch", branch_code: "OAK", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br_o: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br_o}", category: "PRIZE", sku: "PRIZE-X", unit_cost_cents: 469, quantity_procured: 10, reuse_pool: true, description: "shared telescope kits" }
              as: ProgramManager
              captures: { lot: $.data.id }
            - call: "POST /library/reading-challenges"
              payload: { name: "Summer Minutes", logging_method: "MINUTES", unit_label: "minute", start_on: "2026-06-01", end_on: "2026-08-31", correction_policy: "HIGH_WATER", prize_budget_cents: 100000 }
              as: ProgramManager
              captures: { ch: $.data.id }
            - call: "POST /library/reading-challenges/${ch}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 60, prize_sku: "PRIZE-X", prize_units_per_participant: 1 }
              as: ProgramManager
              captures: { tier: $.data.id }
            - call: "POST /library/reading-challenges/${ch}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /library/participants"
              payload: { challenge_id: "${ch}", home_branch_id: "${br_h}", display_name: "Reader One", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { p1: $.data.id }
            - call: "POST /library/participants"
              payload: { challenge_id: "${ch}", home_branch_id: "${br_h}", display_name: "Reader Two", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { p2: $.data.id }
            - call: "POST /library/participants/${p1}/log-entries"
              payload: { units: 60, logged_on: "2026-07-15", source: "STAFF_DESK" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /library/participants/${p2}/log-entries"
              payload: { units: 60, logged_on: "2026-07-15", source: "STAFF_DESK" }
              as: ProgramCoordinator
          assert:
            - "Each of the two TierAwards has units == 1, unit_cost_cents == 469, line_cost_cents == 469, transfer_surcharge_cents == 38 and award_total_cents == 507"
            - "ReadingChallenge.${ch}.prize_committed_cents == 1014"
            - "ReadingChallenge.${ch}.prize_committed_cents != 1013 (8% rounded once over the combined base 938)"
            - "ReadingChallenge.${ch}.prize_available_cents == 98986"
            - "ReadingChallenge.${ch}.prize_spent_cents == 0"
            - "InventoryLot.${lot}.quantity_reserved == 2 and InventoryLot.${lot}.quantity_available == 8 and InventoryLot.${lot}.status == ACTIVE"
            - "IncentiveTier.${tier}.award_count == 2 and IncentiveTier.${tier}.deferred_count == 0"
            - "Participant.${p1}.awarded_tier_index == 1 and Participant.${p2}.awarded_tier_index == 1"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: negotiation_cycle_terminates_on_the_fourth_offer_not_the_fourth_counter
        grounds:
          - state_machines.PresenterContract.OFFERED_to_COUNTERED
          - state_machines.PresenterContract.COUNTERED_to_OFFERED
          - entities.PresenterContract.fields.negotiation_round
          - validations[priority=44]
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          Cycle shape: OFFERED -> COUNTERED -> OFFERED is a genuine loop whose termination condition
          counts only offers. Three offers and three counters are all legal (negotiation_round reaches
          exactly MAX_NEGOTIATION_ROUNDS 3); the fourth offer is rejected with
          ERR_NEGOTIATION_ROUNDS_EXHAUSTED while the contract stays in COUNTERED with
          negotiation_round frozen at 3 and its countered_fee_cents untouched — the counter side of the
          loop is never the thing that exhausts the budget.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one branch; one ADULT IN_BRANCH program left in DRAFT (no screening or room needed for the negotiation loop)."
            - "One presenter, one contract, then three full loop passes: offer 90000 / counter 96000, offer 92000 / counter 95000, offer 93000 / counter 94000."
            - "After the third counter the contract is COUNTERED with negotiation_round == 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Author Talk", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T18:00:00.000Z", end_utc: "2026-08-12T19:00:00.000Z", attendance_target: 40, attendance_cap: 40, supply_sku: "KIT-TALK", supply_units_per_attendee: 0, materials_budget_cents: 5000, presenter_fee_budget_cents: 120000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /library/presenters"
