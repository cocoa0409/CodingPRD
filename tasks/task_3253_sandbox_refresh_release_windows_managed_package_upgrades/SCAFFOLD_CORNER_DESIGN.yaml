# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe.
# Enumerates the testable claims of SCAFFOLD.yaml §1.1–§1.7 that §1.8 does not
# already exercise. Corners already covered by a §1.8 instance appear as
# `excluded_because:` stubs with no `test_recipe`.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: environment_create_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Environment
          - endpoints.POST_/platform/environments
        distinguishing_aspect: "An environment created from only name and type comes back 201 with every declared default (refresh_interval_days 30, aperture_limit 2, masked_field_count 0, storage_cap_bytes 5242880000), release_status CONFIG, level 1 and version 1, while next_refresh_at derives from the fixed clock default."
        test_recipe:
          setup:
            - "Logical clock never set, so it reads the startup default 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /platform/environments"
              payload: { name: "Defaults Dev", type: "DEVELOPER" }
              as: PlatformAdmin
              captures: { env_def_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Environment.${env_def_id}.release_status == CONFIG and version == 1 and level == 1"
            - "Environment.${env_def_id}.refresh_interval_days == 30 and aperture_limit == 2 and aperture_used == 0"
            - "Environment.${env_def_id}.masked_field_count == 0 and storage_cap_bytes == 5242880000"
            - "Environment.${env_def_id}.storage_used_bytes == 0 and storage_total_bytes == 0 and storage_breach == false"
            - "Environment.${env_def_id}.next_refresh_at is null, because refresh_window_next_at first materialises on the first refresh completion"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: production_environment_without_parent_has_null_level_chain
        claim_type: Parent Relationships
        grounds:
          - entities.Environment.fields.parent_environment_id
          - entities.Environment.fields.level
          - endpoints.POST_/platform/environments
        distinguishing_aspect: "The self-referential clone link drives level: a PRODUCTION environment has parent_environment_id null and level 1, a sandbox naming it as parent has level 2, and the parent's reverse-reachability read lists exactly that one child."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Prod Org", type: "PRODUCTION" }
              as: PlatformAdmin
              captures: { env_prod_id: $.data.id }
          trigger:
            - call: "POST /platform/environments"
              payload: { name: "Copy Of Prod", type: "FULL_COPY", parent_environment_id: "${env_prod_id}", refresh_interval_days: 14 }
              as: PlatformAdmin
              captures: { env_child_id: $.data.id }
            - call: "GET /platform/environments/${env_prod_id}/sandboxes"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Environment.${env_prod_id}.parent_environment_id is null and level == 1"
            - "Environment.${env_child_id}.parent_environment_id == \"${env_prod_id}\" and level == 2"
            - "GET /platform/environments/${env_prod_id}/sandboxes returns exactly 1 row and it is Environment.${env_child_id}"
            - "GET /platform/environments/${env_child_id}/sandboxes returns an empty array with total_count 0"

      - name: environment_read_round_trips_every_declared_field
        claim_type: Retrieval
        grounds:
          - entities.Environment
          - endpoints.GET_/platform/environments/{id}
        distinguishing_aspect: "Every stored configuration field round-trips through the single-environment read unchanged, including the null last_refresh_at and applied_release_version and the empty installed_version_ids array."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PARTIAL sandbox created with a non-default interval and cap."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Round Trip", type: "PARTIAL", refresh_interval_days: 21, masked_field_count: 7, storage_cap_bytes: 268435456, release_schedule_mode: "FLAG_ONLY", aperture_limit: 4 }
              as: PlatformAdmin
              captures: { env_rt_id: $.data.id }
          trigger:
            - call: "GET /platform/environments/${env_rt_id}"
              payload: {}
              as: PlatformAdmin
              captures: { rt_v: $.data.version }
          assert:
            - "Environment.${env_rt_id}.name == \"Round Trip\" and type == PARTIAL"
            - "Environment.${env_rt_id}.refresh_interval_days == 21 and masked_field_count == 7 and aperture_limit == 4"
            - "Environment.${env_rt_id}.storage_cap_bytes == 268435456 and release_schedule_mode == \"FLAG_ONLY\""
            - "Environment.${env_rt_id}.last_refresh_at is null and scheduled_release_version is null and applied_release_version is null"
            - "Environment.${env_rt_id}.installed_version_ids == []"
            - "Environment.${env_rt_id}.version == ${rt_v} and it is a positive integer"

      - name: storage_ledger_listing_paginates_with_total_count
        claim_type: Listing
        grounds:
          - entities.StorageLedger
          - endpoints.GET_/platform/environments/{id}/storage-ledgers
        distinguishing_aspect: "The paginated list envelope is honoured on a storage-ledger collection: limit 2 over three rows returns two rows with total_count 3 and has_more true, and the offset 2 page returns one row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with three ledgers."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Paged Env", type: "DEVELOPER", storage_cap_bytes: 104857600, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_pg_id: $.data.id }
            - call: "POST /platform/environments/${env_pg_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 1048576, rank_index: 1 }
              as: StorageArchivist
              captures: { pg1_id: $.data.id }
            - call: "POST /platform/environments/${env_pg_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 2097152, rank_index: 2 }
              as: StorageArchivist
              captures: { pg2_id: $.data.id }
            - call: "POST /platform/environments/${env_pg_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 3145728, rank_index: 3 }
              as: StorageArchivist
              captures: { pg3_id: $.data.id }
          trigger:
            - call: "GET /platform/environments/${env_pg_id}/storage-ledgers?limit=2"
              payload: {}
              as: StorageArchivist
            - call: "GET /platform/environments/${env_pg_id}/storage-ledgers?limit=2&offset=2"
              payload: {}
              as: StorageArchivist
          assert:
            - "the first page carries response_type array and length 2 with meta.total_count 3 and meta.has_more true"
            - "the second page carries length 1 with meta.total_count 3 and meta.has_more false"
            - "the default page size is 10 when limit is omitted, so the unfiltered read returns all 3 rows"
            - "the union of both pages is exactly StorageLedger.${pg1_id}, ${pg2_id} and ${pg3_id} with no repeats"

      - name: filtered_list_narrows_by_status_and_user
        claim_type: Listing
        grounds:
          - entities.StorageLedger.fields.status
          - entities.PermissionAssignment.fields.user_id
          - endpoints.GET_/platform/environments/{id}/storage-ledgers
          - endpoints.GET_/platform/environments/{id}/permissions
        distinguishing_aspect: "The filtered-list form of both reverse-reachability reads respects its optional filter: status=ARCHIVED returns only archived ledgers and user_id returns only that operator's grants, with both lists still returning arrays."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A PARTIAL sandbox released onto SU26 with two ledgers, one archived, and two grants for different operators."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Filter Env", type: "PARTIAL", storage_cap_bytes: 104857600, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_fl_id: $.data.id }
            - call: "POST /platform/environments/${env_fl_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 1048576, rank_index: 1 }
              as: StorageArchivist
              captures: { fl_a_id: $.data.id }
            - call: "POST /platform/environments/${env_fl_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 2097152, rank_index: 2 }
              as: StorageArchivist
              captures: { fl_b_id: $.data.id }
            - call: "POST /platform/environments/${env_fl_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "ProfileOne", user_id: "0050a000050001" }
              as: SecurityAuditor
              captures: { fl_p1_id: $.data.id }
            - call: "POST /platform/environments/${env_fl_id}/permissions"
              payload: { principal_type: "PERMISSION_SET", principal_name: "SetTwo", user_id: "0050a000050002" }
              as: SecurityAuditor
              captures: { fl_p2_id: $.data.id }
            - call: "POST /platform/environments/${env_fl_id}/schedule-release"
              payload: { target_release_version: "SU26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_fl_id}/apply-release"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/environments/${env_fl_id}/storage/archive"
              payload: { from_rank: 1, to_rank: 1 }
              as: StorageArchivist
          trigger:
            - call: "GET /platform/environments/${env_fl_id}/storage-ledgers?status=ARCHIVED"
              payload: {}
              as: StorageArchivist
            - call: "GET /platform/environments/${env_fl_id}/permissions?user_id=0050a000050002"
              payload: {}
              as: SecurityAuditor
          assert:
            - "the ARCHIVED filter returns exactly 1 row and it is StorageLedger.${fl_a_id}"
            - "the user filter returns exactly 1 row and it is PermissionAssignment.${fl_p2_id}"
            - "the unfiltered ledger read returns 2 rows and the unfiltered permission read returns 2 rows"
            - "both filtered reads carry response_type array and meta.total_count 1"

      - name: unknown_environment_returns_environment_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_ENVIRONMENT_NOT_FOUND]
          - validations[priority=3]
          - endpoints.GET_/platform/environments/{id}
        distinguishing_aspect: "A syntactically valid but unknown environment UUID returns ERR_ENVIRONMENT_NOT_FOUND with 404 and response_type error, and the same identifier nested under a valid parent still reports the environment error because path templates resolve left to right."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox exists."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Existing Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ex_id: $.data.id }
          trigger:
            - call: "GET /platform/environments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_env_nf: $.data.error_id }
          assert:
            - "the response carries error_id ERR_ENVIRONMENT_NOT_FOUND with http 404 and response_type error"
            - "the message field is non-empty"
            - "the parent read of Environment.${env_ex_id} still returns 200, so no side effect leaked from the failed lookup"

      - name: unknown_refresh_job_returns_resource_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=4]
          - endpoints.POST_/platform/refresh-jobs/{id}/complete-masking
        distinguishing_aspect: "The second not-found tier is distinct from the environment tier: a valid environment with an unknown refresh job returns ERR_RESOURCE_NOT_FOUND, so the two 404 error ids are not interchangeable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox exists."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "NF Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_nf_id: $.data.id }
          trigger:
            - call: "POST /platform/refresh-jobs/00000000-0000-4000-8000-000000000001/complete-masking"
              payload: {}
              as: EnvironmentAdmin
              captures: { err_rj_nf: $.data.error_id }
          assert:
            - "the response carries error_id ERR_RESOURCE_NOT_FOUND with http 404"
            - "the error_id is ERR_RESOURCE_NOT_FOUND and not ERR_ENVIRONMENT_NOT_FOUND"
            - "GET /platform/environments/${env_nf_id}/refresh-jobs still returns an empty array"

      - name: package_version_requires_name_field
        claim_type: Required Fields
        grounds:
          - entities.PackageVersion.fields.name
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/platform/package-versions
        distinguishing_aspect: "The name field is a required input with no default, so publishing a version with only namespace and major_version is rejected with ERR_INVALID_REQUEST and no PackageVersion row is stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1 }
              as: PlatformAdmin
              captures: { err_missing_name: $.data.error_id }
          assert:
            - "the response carries error_id ERR_INVALID_REQUEST with http 400"
            - "the response_type is error and data.error_id is present while data.id is absent"
            - "no PackageVersion with namespace acme resolves afterwards, because the rejected request stored nothing"

      - name: package_version_numeric_and_enum_constraints
        claim_type: Type Constraints
        grounds:
          - entities.PackageVersion.fields.major_version
          - entities.Environment.fields.type
          - endpoints.POST_/platform/package-versions
          - endpoints.POST_/platform/environments
        distinguishing_aspect: "Declared ranges and enum sets are enforced on two different entities: major_version 0 is rejected against its >= 1 range and environment type SCRATCH is rejected against the four-member type set."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 0, name: "Zero Version" }
              as: PlatformAdmin
              captures: { err_range: $.data.error_id }
            - call: "POST /platform/environments"
              payload: { name: "Bad Type Env", type: "SCRATCH" }
              as: PlatformAdmin
              captures: { err_enum: $.data.error_id }
          assert:
            - "the major_version 0 publish returns error_id ERR_INVALID_REQUEST with http 400"
            - "the type SCRATCH create returns error_id ERR_INVALID_REQUEST with http 400"
            - "the accepted type set is exactly PRODUCTION, FULL_COPY, PARTIAL and DEVELOPER"

      - name: storage_ledger_rank_index_is_unique_per_environment
        claim_type: Type Constraints
        grounds:
          - entities.StorageLedger.fields.rank_index
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/platform/environments/{id}/storage-ledgers
        distinguishing_aspect: "The rank_index uniqueness scope is the environment, not the whole ledger table: the same rank_index is accepted under a second environment and rejected under the first."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two DEVELOPER sandboxes."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Rank Env One", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_rk1_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Rank Env Two", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_rk2_id: $.data.id }
            - call: "POST /platform/environments/${env_rk1_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 1048576, rank_index: 1 }
              as: StorageArchivist
              captures: { rk1_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_rk1_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 2097152, rank_index: 1 }
              as: StorageArchivist
              captures: { err_rank: $.data.error_id }
            - call: "POST /platform/environments/${env_rk2_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 2097152, rank_index: 1 }
              as: StorageArchivist
              captures: { rk2_id: $.data.id }
          assert:
            - "the duplicate rank_index under Rank Env One returns error_id ERR_INVALID_REQUEST with http 400"
            - "the same rank_index under Rank Env Two returns http 201 and StorageLedger.${rk2_id}.rank_index == 1"
            - "GET /platform/environments/${env_rk1_id}/storage-ledgers returns exactly 1 row"
            - "StorageLedger.${rk2_id}.status == LIVE and archived_at is null"

      - name: refresh_job_defaults_and_consumed_aperture_marker
        claim_type: Defaults
        grounds:
          - entities.RefreshJob
          - endpoints.POST_/platform/refresh-jobs
        distinguishing_aspect: "A newly opened refresh job carries status PENDING, consumed_aperture false and a null supersedes_job_id, and none of those three are client-supplied even when the payload supplies a masked_field_count."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "RJ Default Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_rjd_id: $.data.id }
          trigger:
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_rjd_id}", partition: "ACCOUNT_PARTIAL" }
              as: EnvironmentAdmin
              captures: { rjd_id: $.data.id }
          assert:
            - "the response status is 201 and RefreshJob.${rjd_id}.status == PENDING"
            - "RefreshJob.${rjd_id}.consumed_aperture == false"
            - "RefreshJob.${rjd_id}.masked_field_count == 0 and supersedes_job_id is null"
            - "RefreshJob.${rjd_id}.version == 1 and RefreshJob.${rjd_id}.environment_id == \"${env_rjd_id}\""

      - name: installed_package_namespace_is_derived_not_supplied
        claim_type: Computed Fields
        grounds:
          - entities.InstalledPackage.fields.namespace
          - endpoints.POST_/platform/environments/{id}/package-installations
        distinguishing_aspect: "InstalledPackage.namespace is a computed denormalization of the installed version's namespace and is not a request field, so the stored value follows the package version and never the client."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox and one published orbit package version."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "orbit", major_version: 3, name: "Orbit Core 3" }
              as: PlatformAdmin
              captures: { pv_ns_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "NS Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ns_id: $.data.id, env_ns_v: $.data.version }
          trigger:
            - call: "POST /platform/environments/${env_ns_id}/package-installations"
              payload: { package_version_id: "${pv_ns_id}", expected_environment_version: "${env_ns_v}" }
              as: ReleaseManager
              captures: { pkg_ns_id: $.data.id }
          assert:
            - "the response status is 201 and InstalledPackage.${pkg_ns_id}.namespace == \"orbit\""
            - "InstalledPackage.${pkg_ns_id}.status == INSTALLED and stale == false"
            - "InstalledPackage.${pkg_ns_id}.refreshed_at is null"
            - "PackageVersion.${pv_ns_id}.install_count == 1"
  - section: state_machines
    instances:
      - name: environment_release_schedule_valid_transition_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.Environment.CONFIG_to_SCHEDULED
          - state_machines.Environment.SCHEDULED_to_RELEASED
          - endpoints.POST_/platform/environments/{id}/schedule-release
        distinguishing_aspect: "The forward half of the release cycle works end to end: the same environment moves CONFIG to SCHEDULED to RELEASED and reports an increasing release_window_index at each step."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox at level 1."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Forward Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_fw_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_fw_id}/schedule-release"
              payload: { target_release_version: "SP26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_fw_id}/apply-release"
              payload: {}
              as: ReleaseManager
          assert:
            - "after schedule-release Environment.${env_fw_id}.release_status == SCHEDULED and scheduled_release_version == \"SP26\""
            - "after apply-release Environment.${env_fw_id}.release_status == RELEASED and applied_release_version == \"SP26\""
            - "Environment.${env_fw_id}.refresh_generation == 1, bumped by the apply-release side effect"
            - "the release_window_index for SP26 is 2, so it is strictly greater than the CONFIG index of 1"

      - name: refresh_job_invalid_from_rejection
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RefreshJob
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/platform/refresh-jobs/{id}/complete-masking
        distinguishing_aspect: "Triggers that are not in the transition list are rejected from each state: complete-masking on an already COMPLETED job, and complete-refresh on a PENDING job, both return ERR_INVALID_STATE with no state change."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with two refresh jobs, one completed and one pending."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Invalid Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_inv_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_inv_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { rj_inv_done_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${rj_inv_done_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${rj_inv_done_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_inv_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { rj_inv_pend_id: $.data.id }
          trigger:
            - call: "POST /platform/refresh-jobs/${rj_inv_done_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
              captures: { err_inv_done: $.data.error_id }
            - call: "POST /platform/refresh-jobs/${rj_inv_pend_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
              captures: { err_inv_pend: $.data.error_id }
          assert:
            - "complete-masking on the COMPLETED job returns error_id ERR_INVALID_STATE with http 409"
            - "complete-refresh on the PENDING job returns error_id ERR_INVALID_STATE with http 409"
            - "RefreshJob.${rj_inv_done_id}.status remains COMPLETED and RefreshJob.${rj_inv_pend_id}.status remains PENDING"
            - "Environment.${env_inv_id}.aperture_used remains 1 after both refusals"

      - name: access_audit_terminal_state_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AccessAudit.CLOSED
          - validations[priority=7]
          - endpoints.POST_/platform/access-audits/{id}/close
        distinguishing_aspect: "CLOSED is terminal for the audit axis, so a second close attempt returns ERR_INVALID_STATE and leaves grade, finding and overreach_count exactly as the first close produced them."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER sandbox with two layered grants for one operator and an open audit reviewing them."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Lockdown Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_lk_id: $.data.id }
            - call: "POST /platform/environments/${env_lk_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "LayeredProfile", user_id: "0050a000060001" }
              as: SecurityAuditor
              captures: { lk_p1_id: $.data.id }
            - call: "POST /platform/environments/${env_lk_id}/permissions"
              payload: { principal_type: "PERMISSION_SET", principal_name: "LayeredSet", user_id: "0050a000060001" }
              as: SecurityAuditor
              captures: { lk_p2_id: $.data.id }
            - call: "POST /platform/access-audits"
              payload: { environment_id: "${env_lk_id}", reviewed_assignment_ids: ["${lk_p1_id}", "${lk_p2_id}"] }
              as: SecurityAuditor
              captures: { audit_lk_id: $.data.id }
            - call: "POST /platform/access-audits/${audit_lk_id}/close"
              payload: { finding: "RETAIN" }
              as: SecurityAuditor
          trigger:
            - call: "POST /platform/access-audits/${audit_lk_id}/close"
              payload: { finding: "REVOKE" }
              as: SecurityAuditor
              captures: { err_lockdown: $.data.error_id }
          assert:
            - "the second close returns error_id ERR_INVALID_STATE with http 409"
            - "AccessAudit.${audit_lk_id}.status remains CLOSED and finding remains RETAIN"
            - "AccessAudit.${audit_lk_id}.grade is unchanged by the refused close"
            - "PermissionAssignment.${lk_p1_id}.revoked == false and PermissionAssignment.${lk_p2_id}.revoked == false, because the refused REVOKE never applied"

      - name: storage_ledger_archive_restore_is_not_idempotent
        claim_type: Idempotency
        grounds:
          - state_machines.StorageLedger
          - validations[priority=7]
          - endpoints.POST_/platform/storage-ledgers/{id}/restore
        distinguishing_aspect: "Repeating a completed action is refused rather than silently accepted: restoring an already LIVE ledger returns ERR_INVALID_STATE, so the compensating pair cannot double-count storage."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER sandbox released onto SU26 with one FILE ledger."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Idem Ledger Env", type: "DEVELOPER", storage_cap_bytes: 104857600, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_il_id: $.data.id }
            - call: "POST /platform/environments/${env_il_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 1048576, rank_index: 1 }
              as: StorageArchivist
              captures: { il_l_id: $.data.id }
            - call: "POST /platform/environments/${env_il_id}/schedule-release"
              payload: { target_release_version: "SU26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_il_id}/apply-release"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/environments/${env_il_id}/storage/archive"
              payload: { from_rank: 1, to_rank: 1 }
              as: StorageArchivist
            - call: "POST /platform/storage-ledgers/${il_l_id}/restore"
              payload: {}
              as: StorageArchivist
          trigger:
            - call: "POST /platform/storage-ledgers/${il_l_id}/restore"
              payload: {}
              as: StorageArchivist
              captures: { err_idem_restore: $.data.error_id }
          assert:
            - "the second restore returns error_id ERR_INVALID_STATE with http 409"
            - "StorageLedger.${il_l_id}.status remains LIVE"
            - "Environment.${env_il_id}.storage_used_bytes remains 1048576 and storage_archived_bytes remains 0"
            - "Environment.${env_il_id}.storage_total_bytes remains 1048576"

      - name: change_set_terminal_failed_state_blocks_validate
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.MetadataChangeSet.FAILED
          - validations[priority=7]
          - endpoints.POST_/platform/change-sets/{id}/deploy
        distinguishing_aspect: "FAILED is terminal for the change set axis and sits alongside DEPLOYED: a validate attempt against a change set whose validation was recorded as failed returns ERR_INVALID_STATE rather than silently re-validating."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER source sandbox, a DEVELOPER target sandbox and a DRAFT change set with an empty component list."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Failed Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_fs_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Failed Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ft_id: $.data.id, env_ft_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_fs_id}", target_environment_id: "${env_ft_id}", component_list: [], component_dependencies: [], expected_environment_version: "${env_ft_v}" }
              as: ReleaseManager
              captures: { cs_fail_id: $.data.id }
          trigger:
            - call: "POST /platform/change-sets/${cs_fail_id}/validate"
              payload: {}
              as: ReleaseManager
              captures: { err_empty: $.data.error_id }
            - call: "POST /platform/change-sets/${cs_fail_id}/deploy"
              payload: { idempotency_key: "fail-key" }
              as: ReleaseManager
              captures: { err_fail_deploy: $.data.error_id }
          assert:
            - "the validate on an empty component list returns error_id ERR_EMPTY_COMPONENT_LIST with http 422 and MetadataChangeSet.${cs_fail_id}.status stays DRAFT"
            - "the deploy returns error_id ERR_INVALID_STATE with http 409, because the change set never reached APPROVED"
            - "MetadataChangeSet.${cs_fail_id}.component_digests == {}"
            - "GET /platform/change-sets/${cs_fail_id}/deployments returns an empty array"

      - name: deployment_job_queued_initial_state
        claim_type: Initial State
        grounds:
          - entities.DeploymentJob
          - state_machines.DeploymentJob
          - endpoints.POST_/platform/change-sets/{id}/deploy
        distinguishing_aspect: "A newly opened deployment job starts in QUEUED with applied_component_count 0 and validated_digest_match false, and the change set stays APPROVED until the job itself succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An approved change set with two components."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Queued Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_qs_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Queued Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_qt_id: $.data.id, env_qt_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_qs_id}", target_environment_id: "${env_qt_id}", component_list: [{ component: "acme_controller", version_tag: 1 }, { component: "acme_layout", version_tag: 1 }], component_dependencies: [], expected_environment_version: "${env_qt_v}" }
              as: ReleaseManager
              captures: { cs_q_id: $.data.id }
            - call: "POST /platform/change-sets/${cs_q_id}/validate"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/change-sets/${cs_q_id}/approve"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /platform/change-sets/${cs_q_id}/deploy"
              payload: { idempotency_key: "queued-key" }
              as: ReleaseManager
              captures: { dj_q_id: $.data.id }
          assert:
            - "the response status is 201 and DeploymentJob.${dj_q_id}.status == QUEUED"
            - "DeploymentJob.${dj_q_id}.applied_component_count == 0 and validated_digest_match == false"
            - "DeploymentJob.${dj_q_id}.version == 1 and change_set_id == \"${cs_q_id}\""
            - "MetadataChangeSet.${cs_q_id}.status is still APPROVED, because DEPLOYED is reached only through job success"

      - name: governor_publish_side_effects_fire_on_accept
        claim_type: Side Effect Execution
        grounds:
          - state_machines.GovernorLimitRequest.SUBMITTED_to_ACCEPTED
          - endpoints.POST_/platform/governor-limit-requests/{id}/approve
        distinguishing_aspect: "Each declared side effect of the accept transition is applied: status becomes ACCEPTED and governor_headroom_units is recomputed against the organization ceiling net of the other accepted requests."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with one submitted request of 1000 units."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Gov Accept Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ga_id: $.data.id }
            - call: "POST /platform/environments/${env_ga_id}/governor-limit-requests"
              payload: { request_kind: "SCHEDULED", scope_count: 500, callout_graph: [], max_concurrent_jobs: 5 }
              as: AppDeveloper
              captures: { gov_ga_id: $.data.id }
            - call: "POST /platform/governor-limit-requests/${gov_ga_id}/submit"
              payload: {}
              as: AppDeveloper
          trigger:
            - call: "POST /platform/governor-limit-requests/${gov_ga_id}/approve"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GovernorLimitRequest.${gov_ga_id}.status == ACCEPTED"
            - "GovernorLimitRequest.${gov_ga_id}.projected_governor_units == 1000"
            - "GovernorLimitRequest.${gov_ga_id}.governor_headroom_units == 99000"
            - "the request_kind enum value SCHEDULED is reachable through the declared create endpoint, so no enum value is a dead end"

  - section: calculations
    instances:
      - name: release_window_index_applied_and_scheduled_variants
        claim_type: Variant Divergence
        grounds:
          - calculations.release_window_index
          - calculations.release_window_index.variants.release_window_index_applied
          - calculations.release_window_index.variants.release_window_index_scheduled
          - endpoints.POST_/platform/environments/{id}/schedule-release
        distinguishing_aspect: "Variant selection on one environment: while the release is merely scheduled the preview returns the scheduled ordinal, and once applied the projection returns the launch-protected applied ordinal, so the two variants disagree by exactly 3 for WI26 against SU26."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox at level 1."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Variant Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_vr_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_vr_id}/schedule-release"
              payload: { target_release_version: "SU26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_vr_id}/apply-release"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/environments/${env_vr_id}/schedule-release"
              payload: { target_release_version: "WI26" }
              as: ReleaseManager
          assert:
            - "while scheduled on SU26 the release_window_index is 3, the scheduled ordinal"
            - "after applying SU26 the applied variant returns max(0, 3 - 2) == 1"
            - "after scheduling WI26 the scheduled variant returns 4 while the applied variant still returns 1, a delta of 3"
            - "Environment.${env_vr_id}.applied_release_version == \"SU26\" and scheduled_release_version == \"WI26\""

      - name: package_conflict_resolution_install_order_variant
        claim_type: Variant Divergence
        grounds:
          - calculations.package_conflict_resolution
          - calculations.package_conflict_resolution.variants.package_conflict_resolution_install_order
          - entities.InstalledPackage.fields.installed_at
          - endpoints.POST_/platform/installed-packages/{id}/upgrade
        distinguishing_aspect: "The audited-replay variant ranks by the recorded installed_at instant rather than by the dependency-depth tuple, so for an environment where the shallower package was installed first the two variants name different winners."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox installing acme-core 1 first and acme-ui 2 (which requires acme-core) second."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_vo_core_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "ui", major_version: 1, name: "Acme UI 1" }
              as: PlatformAdmin
              captures: { pv_vo_ui1_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "ui", major_version: 2, name: "Acme UI 2", supersedes_version_id: "${pv_vo_ui1_id}", requires_namespace: "acme", requires_min_version_id: "${pv_vo_core_id}" }
              as: PlatformAdmin
              captures: { pv_vo_ui2_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Variant Order Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_vo_id: $.data.id, env_vo_v: $.data.version }
            - call: "POST /platform/environments/${env_vo_id}/package-installations"
              payload: { package_version_id: "${pv_vo_core_id}", expected_environment_version: "${env_vo_v}" }
              as: ReleaseManager
              captures: { pkg_vo_core_id: $.data.id }
            - call: "POST /platform/environments/${env_vo_id}/package-installations"
              payload: { package_version_id: "${pv_vo_ui1_id}", expected_environment_version: "${env_vo_v}" }
              as: ReleaseManager
              captures: { pkg_vo_ui_id: $.data.id }
          trigger:
            - call: "POST /platform/installed-packages/${pkg_vo_ui_id}/upgrade"
              payload: { target_package_version_id: "${pv_vo_ui2_id}" }
              as: ReleaseManager
              captures: { vo_ui_v: $.data.version }
          assert:
            - "the dependency-depth winner is PackageVersion.${pv_vo_ui2_id}, whose requires chain depth is 1"
            - "the install-order variant names PackageVersion.${pv_vo_core_id}, installed at the earliest instant"
            - "the two variants therefore name different winners for the same environment"
            - "InstalledPackage.${pkg_vo_ui_id}.status == UPGRADED and package_version_id == \"${pv_vo_ui2_id}\""

      - name: release_window_index_threshold_ordinals
        claim_type: Constants Applied
        grounds:
          - calculations.release_window_index
          - constants.RELEASE_ORDINALS
          - constants.LAUNCH_PROTECT_GENERATIONS
          - endpoints.POST_/platform/environments/{id}/schedule-release
        distinguishing_aspect: "The RELEASE_ORDINALS table and the LAUNCH_PROTECT_GENERATIONS constant are applied numerically: SP26 maps to 2 and WI26 to 4, and the applied projection subtracts exactly 2, so a WI26 environment projects 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox at level 1."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Ordinal Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_or_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_or_id}/schedule-release"
              payload: { target_release_version: "WI26" }
              as: ReleaseManager
            - call: "POST /platform/environments/${env_or_id}/apply-release"
              payload: {}
              as: ReleaseManager
          assert:
            - "the scheduled ordinal for WI26 is 4 and for SP26 is 2"
            - "after applying WI26 the applied projection is 4 - 2 == 2"
            - "the CONFIG projection is 1 regardless of any release ordinal"
            - "Environment.${env_or_id}.release_status == RELEASED and applied_release_version == \"WI26\""

      - name: aperture_evaluation_ignores_failed_children
        claim_type: Input Set Filtering
        grounds:
          - calculations.aperture_consumption_evaluation
          - entities.RefreshJob.fields.status
          - endpoints.POST_/platform/refresh-jobs/{id}/fail
        distinguishing_aspect: "The evaluation input set is filtered to COMPLETED children only: two failed refresh jobs contribute nothing to aperture_used while a single completed one does."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A level-2 sandbox with aperture_limit 2 and two failed refresh jobs."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Filter Parent", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_fp1_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Filter Sandbox", type: "DEVELOPER", parent_environment_id: "${env_fp1_id}", aperture_limit: 2 }
              as: PlatformAdmin
              captures: { env_fp2_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_fp2_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { fp_rj1_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${fp_rj1_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${fp_rj1_id}/fail"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_fp2_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { fp_rj2_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${fp_rj2_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${fp_rj2_id}/fail"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_fp2_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { fp_rj3_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${fp_rj3_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
          trigger:
            - call: "POST /platform/refresh-jobs/${fp_rj3_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
          assert:
            - "two of the three jobs are FAILED and contribute nothing to the aperture"
            - "Environment.${env_fp2_id}.aperture_used == 1, counting only the COMPLETED child"
            - "RefreshJob.${fp_rj1_id}.consumed_aperture == false and RefreshJob.${fp_rj2_id}.consumed_aperture == false"
            - "RefreshJob.${fp_rj3_id}.consumed_aperture == true despite aperture_used being below aperture_limit 2"

      - name: storage_breach_comparison_is_inclusive_at_cap
        claim_type: Boundary / Precision
        grounds:
          - calculations.storage_breach_evaluation
          - constants.STORAGE_BREACH_COMPARISON
          - entities.Environment.fields.storage_breach
          - endpoints.POST_/platform/environments/{id}/storage-ledgers
        distinguishing_aspect: "The breach comparison is pinned to >= rather than >: a resource whose live bytes land exactly on the cap is already in breach, while one byte below the cap is not."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two DEVELOPER sandboxes both capped at 4 MiB."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Cap Equal", type: "DEVELOPER", storage_cap_bytes: 4194304, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ceq_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Cap Below", type: "DEVELOPER", storage_cap_bytes: 4194304, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cbl_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_ceq_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 4194304, rank_index: 1 }
              as: StorageArchivist
              captures: { ceq_id: $.data.id }
            - call: "POST /platform/environments/${env_cbl_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 4194303, rank_index: 1 }
              as: StorageArchivist
              captures: { cbl_id: $.data.id }
          assert:
            - "Environment.${env_ceq_id}.storage_breach == true at exactly the cap"
            - "Environment.${env_cbl_id}.storage_breach == false one byte below the cap"
            - "Environment.${env_ceq_id}.storage_headroom_bytes == 0"
            - "Environment.${env_cbl_id}.storage_headroom_bytes == -1"

      - name: governor_projection_empty_callout_graph_zero_cell_term
        claim_type: Boundary / Precision
        grounds:
          - calculations.governor_cost_projection
          - entities.GovernorLimitRequest.fields.callout_graph
          - endpoints.POST_/platform/environments/{id}/governor-limit-requests
        distinguishing_aspect: "The empty-collection edge of the projection: with no callout graph the cell term collapses to zero and with scope_count 0 the whole projection is zero, so an empty graph is not treated as an error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Empty Graph Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_eg_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_eg_id}/governor-limit-requests"
              payload: { request_kind: "QUEUEABLE", scope_count: 0, callout_graph: [], max_concurrent_jobs: 3 }
              as: AppDeveloper
              captures: { eg_rq_id: $.data.id }
          assert:
            - "GovernorLimitRequest.${eg_rq_id}.projected_governor_units == 0"
            - "GovernorLimitRequest.${eg_rq_id}.governor_headroom_units == 100000"
            - "the empty callout_graph is accepted, so depth 0 is not a rejection condition"
            - "the request is stored in status DRAFT"

  - section: validations
    instances:
      - name: missing_headers_return_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints.GET_/platform/environments/{id}
        distinguishing_aspect: "The lowest-priority-number check is the first one evaluated on every endpoint: a read with no X-User-Role header returns ERR_UNAUTHENTICATED with 401 and response_type error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox exists."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Auth Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_au_id: $.data.id }
          trigger:
            - call: "GET /platform/environments/${env_au_id}"
              payload: {}
              as: NotARole
              captures: { err_auth: $.data.error_id }
          assert:
            - "the response carries error_id ERR_UNAUTHENTICATED with http 401"
            - "the error_id is ERR_UNAUTHENTICATED and not ERR_UNAUTHORIZED"
            - "response_type is error and the data object carries no environment fields"

      - name: app_developer_cannot_schedule_release
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
          - roles.AppDeveloper
          - endpoints.POST_/platform/environments/{id}/schedule-release
        distinguishing_aspect: "Role separation is enforced on the release rail: an authenticated AppDeveloper may read environments and submit governor requests but is refused the exclusive ReleaseManager schedule operation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox exists."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "RBAC Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_rb_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_rb_id}/schedule-release"
              payload: { target_release_version: "SP26" }
              as: AppDeveloper
              captures: { err_rbac: $.data.error_id }
          assert:
            - "the response carries error_id ERR_UNAUTHORIZED with http 403"
            - "Environment.${env_rb_id}.release_status remains CONFIG and scheduled_release_version is null"
            - "the same operator's GET /platform/environments/${env_rb_id} succeeds with 200, so the denial is operation-scoped and not identity-scoped"

      - name: environment_admin_cannot_apply_release
        claim_type: Violation → Error
        grounds:
          - roles.EnvironmentAdmin
          - errors[ERR_UNAUTHORIZED]
          - endpoints.POST_/platform/environments/{id}/apply-release
        distinguishing_aspect: "A second exclusive-operation denial on a different role pair: EnvironmentAdmin owns the refresh lifecycle but cannot apply a seasonal release, which is ReleaseManager's exclusive operation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox scheduled onto SP26."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Separation Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_sp_id: $.data.id }
            - call: "POST /platform/environments/${env_sp_id}/schedule-release"
              payload: { target_release_version: "SP26" }
              as: ReleaseManager
          trigger:
            - call: "POST /platform/environments/${env_sp_id}/apply-release"
              payload: {}
              as: EnvironmentAdmin
              captures: { err_sep: $.data.error_id }
          assert:
            - "the response carries error_id ERR_UNAUTHORIZED with http 403"
            - "Environment.${env_sp_id}.release_status remains SCHEDULED"
            - "Environment.${env_sp_id}.refresh_generation remains 0"
            - "Environment.${env_sp_id}.applied_release_version is still null"

      - name: archive_window_with_unarchivable_ledger_returns_window_closed
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_ARCHIVE_WINDOW_CLOSED]
          - entities.StorageLedger.fields.archivable
          - endpoints.POST_/platform/environments/{id}/storage/archive
        distinguishing_aspect: "Archival before any release has been applied is refused with ERR_ARCHIVE_WINDOW_CLOSED even though the batch size is well within the three-file cap, so the release-ordinal gate is evaluated before any other archival rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER sandbox that has never been released, holding one FILE ledger."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Closed Window Env", type: "DEVELOPER", storage_cap_bytes: 104857600, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cw_id: $.data.id }
            - call: "POST /platform/environments/${env_cw_id}/storage-ledgers"
              payload: { kind: "FILE", bytes: 1048576, rank_index: 1 }
              as: StorageArchivist
              captures: { cw_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_cw_id}/storage/archive"
              payload: { from_rank: 1, to_rank: 1 }
              as: StorageArchivist
              captures: { err_cw: $.data.error_id }
          assert:
            - "the response carries error_id ERR_ARCHIVE_WINDOW_CLOSED with http 422"
            - "StorageLedger.${cw_id}.archivable == false because no release has been applied"
            - "StorageLedger.${cw_id}.status remains LIVE and StorageLedger.${cw_id}.archive_batch_id is null"
            - "Environment.${env_cw_id}.applied_release_version is null"

      - name: full_package_sweep_all_members_admitted
        claim_type: Satisfaction → Pass
        grounds:
          - endpoints.POST_/platform/environments/{id}/package-installations
          - entities.Environment.fields.installed_version_ids
          - validations[priority=9]
        distinguishing_aspect: "The all-pass side of the same install sweep: three namespaces with their dependency floors satisfied all install, no error is raised, and the environment's installed set grows by exactly three."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox plus acme-core 1, orbit-core 1 and a dependent orbit-ui that requires orbit-core."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_pass_acme_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "orbit", major_version: 1, name: "Orbit Core 1" }
              as: PlatformAdmin
              captures: { pv_pass_core_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "orbit", major_version: 2, name: "Orbit UI 2", supersedes_version_id: "${pv_pass_core_id}", requires_namespace: "acme", requires_min_version_id: "${pv_pass_acme_id}" }
              as: PlatformAdmin
              captures: { pv_pass_ui_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "All Pass Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ap_id: $.data.id, env_ap_v: $.data.version }
          trigger:
            - call: "POST /platform/environments/${env_ap_id}/package-installations"
              payload: { package_version_id: "${pv_pass_acme_id}", expected_environment_version: "${env_ap_v}" }
              as: ReleaseManager
              captures: { pkg_pass_acme_id: $.data.id }
            - call: "POST /platform/environments/${env_ap_id}/package-installations"
              payload: { package_version_id: "${pv_pass_core_id}", expected_environment_version: "${env_ap_v}" }
              as: ReleaseManager
              captures: { pkg_pass_core_id: $.data.id }
            - call: "POST /platform/environments/${env_ap_id}/package-installations"
              payload: { package_version_id: "${pv_pass_ui_id}", expected_environment_version: "${env_ap_v}" }
              as: ReleaseManager
              captures: { pkg_pass_ui_id: $.data.id }
          assert:
            - "all three installs return http 201 with no error_id"
            - "InstalledPackage.${pkg_pass_acme_id}.status == INSTALLED and InstalledPackage.${pkg_pass_core_id}.status == INSTALLED and InstalledPackage.${pkg_pass_ui_id}.status == INSTALLED"
            - "Environment.${env_ap_id}.installed_version_ids has exactly 3 entries"
            - "PackageVersion.${pv_pass_acme_id}.install_count == 1"

      - name: duplicate_namespace_prefers_already_installed_error
        claim_type: Priority Ordering
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_PACKAGE_ALREADY_INSTALLED]
          - endpoints.POST_/platform/environments/{id}/package-installations
        distinguishing_aspect: "Within the business_constraint band the earlier priority wins: a request re-installing the already-present namespace using a deprecated version satisfies both priority 11 and priority 12, and ERR_PACKAGE_ALREADY_INSTALLED is returned."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with acme-core 1 installed, plus acme-core 1b published and then superseded so it carries deprecated true."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_pri_a_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 2, name: "Acme Core 1b", supersedes_version_id: "${pv_pri_a_id}" }
              as: PlatformAdmin
              captures: { pv_pri_b_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Priority Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_pri_id: $.data.id, env_pri_v: $.data.version }
            - call: "POST /platform/environments/${env_pri_id}/package-installations"
              payload: { package_version_id: "${pv_pri_a_id}", expected_environment_version: "${env_pri_v}" }
              as: ReleaseManager
              captures: { pkg_pri_id: $.data.id }
          trigger:
            - call: "POST /platform/environments/${env_pri_id}/package-installations"
              payload: { package_version_id: "${pv_pri_b_id}", expected_environment_version: "${env_pri_v}" }
              as: ReleaseManager
              captures: { err_pri_dup: $.data.error_id }
          assert:
            - "PackageVersion.${pv_pri_b_id}.deprecated == true, so the deprecated-version rule is also violated"
            - "the response carries error_id ERR_PACKAGE_ALREADY_INSTALLED with http 409, not ERR_VERSION_DEPRECATED"
            - "Environment.${env_pri_id}.installed_version_ids still has exactly 1 entry"
            - "PackageVersion.${pv_pri_a_id}.install_count == 1"

      - name: audit_revoke_finding_flips_in_scope_grants_only
        claim_type: Conditional Validation
        grounds:
          - state_machines.AccessAudit.OPEN_to_CLOSED
          - calculations.permission_overreach_resolution
          - endpoints.POST_/platform/access-audits/{id}/close
        distinguishing_aspect: "The revoke branch is conditional on the audit finding: closing with REVOKE flips only the in-scope assignments judged to overreach, while closing with RETAIN leaves every grant untouched, so the same grant set produces different stored state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox with a two-layer operator and a one-layer operator."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Conditional Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cd_id: $.data.id }
            - call: "POST /platform/environments/${env_cd_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "CondProfile", user_id: "0050a000070001" }
              as: SecurityAuditor
              captures: { cd_p1_id: $.data.id }
            - call: "POST /platform/environments/${env_cd_id}/permissions"
              payload: { principal_type: "PERMISSION_SET", principal_name: "CondSet", user_id: "0050a000070001" }
              as: SecurityAuditor
              captures: { cd_p2_id: $.data.id }
            - call: "POST /platform/environments/${env_cd_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "SoloProfile", user_id: "0050a000070002" }
              as: SecurityAuditor
              captures: { cd_p3_id: $.data.id }
            - call: "POST /platform/access-audits"
              payload: { environment_id: "${env_cd_id}", reviewed_assignment_ids: ["${cd_p1_id}", "${cd_p2_id}", "${cd_p3_id}"] }
              as: SecurityAuditor
              captures: { audit_cd_id: $.data.id }
          trigger:
            - call: "POST /platform/access-audits/${audit_cd_id}/close"
              payload: { finding: "REVOKE" }
              as: SecurityAuditor
          assert:
            - "AccessAudit.${audit_cd_id}.status == CLOSED and closed_at == 2026-09-01T00:00:00Z"
            - "the findings array holds exactly 3 entries, one per reviewed assignment"
            - "the operator holding two layers is reported with overreach true and their grants PermissionAssignment.${cd_p1_id} and PermissionAssignment.${cd_p2_id} both carry revoked == true"
            - "the single-layer operator is reported with overreach false and PermissionAssignment.${cd_p3_id}.revoked == false"

  - section: endpoints
    instances:
      - name: deployment_job_completion_drives_change_set_to_deployed
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/platform/deployment-jobs/{id}/complete
          - state_machines.MetadataChangeSet.APPROVED_to_DEPLOYED
          - entities.DeploymentJob.fields.applied_component_count
          - entities.DeploymentJob.fields.validated_digest_match
        distinguishing_aspect: "The action endpoint on the deployment job is what drives its referencing change set to DEPLOYED, and it reports the applied component count equal to the change set's component list length."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. An approved change set with two components and one queued deployment job."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Complete Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cs2_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Complete Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_ct2_id: $.data.id, env_ct2_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_cs2_id}", target_environment_id: "${env_ct2_id}", component_list: [{ component: "acme_controller", version_tag: 1 }, { component: "acme_layout", version_tag: 3 }], component_dependencies: [], expected_environment_version: "${env_ct2_v}" }
              as: ReleaseManager
              captures: { cs_complete_id: $.data.id }
            - call: "POST /platform/change-sets/${cs_complete_id}/validate"
              payload: {}
              as: ReleaseManager
            - call: "POST /platform/change-sets/${cs_complete_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /platform/change-sets/${cs_complete_id}/deploy"
              payload: { idempotency_key: "complete-key" }
              as: ReleaseManager
              captures: { dj_complete_id: $.data.id }
          trigger:
            - call: "POST /platform/deployment-jobs/${dj_complete_id}/complete"
              payload: {}
              as: EnvironmentAdmin
          assert:
            - "DeploymentJob.${dj_complete_id}.status == SUCCEEDED and validated_digest_match == true"
            - "DeploymentJob.${dj_complete_id}.applied_component_count == 2, equal to the change set's component list length"
            - "MetadataChangeSet.${cs_complete_id}.status == DEPLOYED"
            - "MetadataChangeSet.${cs_complete_id}.component_digests == {\"acme_controller\": 1, \"acme_layout\": 3}"

      - name: environment_posture_read_reflects_derived_rollups
        claim_type: Computed read
        grounds:
          - endpoints.GET_/platform/environments/{id}
          - entities.Environment.fields.storage_total_bytes
          - entities.Environment.fields.permission_layer_total
          - entities.Environment.fields.aperture_used
        distinguishing_aspect: "The single-environment read is a computed projection: storage roll-ups, aperture_used and permission_layer_total all report values derived from child rows rather than anything stored on the environment row itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER sandbox with one ledger, one grant and one completed refresh."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Projection Env", type: "DEVELOPER", storage_cap_bytes: 104857600, aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_pj_id: $.data.id }
            - call: "POST /platform/environments/${env_pj_id}/storage-ledgers"
              payload: { kind: "DATA", bytes: 8388608, rank_index: 1 }
              as: StorageArchivist
              captures: { pj_l_id: $.data.id }
            - call: "POST /platform/environments/${env_pj_id}/permissions"
              payload: { principal_type: "PROFILE", principal_name: "ProjectionProfile", user_id: "0050a000080001" }
              as: SecurityAuditor
              captures: { pj_p_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_pj_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 2 }
              as: EnvironmentAdmin
              captures: { pj_rj_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${pj_rj_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${pj_rj_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
          trigger:
            - call: "GET /platform/environments/${env_pj_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Environment.${env_pj_id}.storage_used_bytes == 8388608 and storage_total_bytes == 8388608 and storage_breach == false"
            - "Environment.${env_pj_id}.aperture_used == 1, derived from the single COMPLETED refresh job"
            - "Environment.${env_pj_id}.permission_layer_total == 1, derived from the single profile grant"
            - "Environment.${env_pj_id}.refresh_generation == 1 and last_refresh_at == 2026-09-01T00:00:00Z"

      - name: conditional_upgrade_refused_when_target_deprecated
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/platform/installed-packages/{id}/upgrade
          - validations[priority=12]
          - errors[ERR_VERSION_DEPRECATED]
          - entities.InstalledPackage.fields.status
        distinguishing_aspect: "The same action endpoint is permitted or refused purely on the target version's deprecated flag, so conditional behavior is decided by entity configuration rather than by the request body."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PARTIAL sandbox with acme-core 1 installed and two newer candidate versions, one of them deprecated."
          setup_api_calls:
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 1, name: "Acme Core 1" }
              as: PlatformAdmin
              captures: { pv_cond1_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 2, name: "Acme Core 2" }
              as: PlatformAdmin
              captures: { pv_cond2_id: $.data.id }
            - call: "POST /platform/package-versions"
              payload: { namespace: "acme", major_version: 3, name: "Acme Core 3", supersedes_version_id: "${pv_cond2_id}" }
              as: PlatformAdmin
              captures: { pv_cond3_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Conditional Upgrade Env", type: "PARTIAL", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_cond_id: $.data.id, env_cond_v: $.data.version }
            - call: "POST /platform/environments/${env_cond_id}/package-installations"
              payload: { package_version_id: "${pv_cond1_id}", expected_environment_version: "${env_cond_v}" }
              as: ReleaseManager
              captures: { pkg_cond_id: $.data.id }
            - call: "POST /platform/refresh-jobs"
              payload: { environment_id: "${env_cond_id}", partition: "ACCOUNT_PARTIAL", masked_field_count: 3 }
              as: EnvironmentAdmin
              captures: { cond_rj_id: $.data.id }
            - call: "POST /platform/refresh-jobs/${cond_rj_id}/complete-masking"
              payload: {}
              as: EnvironmentAdmin
            - call: "POST /platform/refresh-jobs/${cond_rj_id}/complete-refresh"
              payload: {}
              as: EnvironmentAdmin
          trigger:
            - call: "POST /platform/installed-packages/${pkg_cond_id}/upgrade"
              payload: { target_package_version_id: "${pv_cond2_id}" }
              as: ReleaseManager
              captures: { err_cond_dep: $.data.error_id }
            - call: "POST /platform/installed-packages/${pkg_cond_id}/upgrade"
              payload: { target_package_version_id: "${pv_cond3_id}" }
              as: ReleaseManager
          assert:
            - "PackageVersion.${pv_cond2_id}.deprecated == true after the third version is published, because the publish cascade deprecates the superseded version"
            - "upgrading onto the deprecated version returns error_id ERR_VERSION_DEPRECATED with http 409"
            - "upgrading onto PackageVersion.${pv_cond3_id} succeeds with InstalledPackage.${pkg_cond_id}.status == UPGRADED"
            - "InstalledPackage.${pkg_cond_id}.package_version_id == \"${pv_cond3_id}\" and stale == false"

      - name: invalid_state_on_deploy_before_validation
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/platform/change-sets/{id}/deploy
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - state_machines.MetadataChangeSet
        distinguishing_aspect: "The deploy action endpoint refuses a change set that has not been approved, so the pipeline stages are ordered rather than freely invocable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER source sandbox and a DEVELOPER target sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Stage Source", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_stg_s_id: $.data.id }
            - call: "POST /platform/environments"
              payload: { name: "Stage Target", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_stg_t_id: $.data.id, env_stg_t_v: $.data.version }
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_stg_s_id}", target_environment_id: "${env_stg_t_id}", component_list: [{ component: "acme_controller", version_tag: 1 }], component_dependencies: [], expected_environment_version: "${env_stg_t_v}" }
              as: ReleaseManager
              captures: { cs_stage_id: $.data.id }
          trigger:
            - call: "POST /platform/change-sets/${cs_stage_id}/deploy"
              payload: { idempotency_key: "stage-key" }
              as: ReleaseManager
              captures: { err_stage: $.data.error_id }
          assert:
            - "the deploy returns error_id ERR_INVALID_STATE with http 409"
            - "MetadataChangeSet.${cs_stage_id}.status remains DRAFT"
            - "GET /platform/change-sets/${cs_stage_id}/deployments returns an empty array"
            - "validation of the same change set succeeds afterwards with MetadataChangeSet.${cs_stage_id}.status == VALIDATED"
  - section: errors
    instances:
      - name: change_set_source_may_not_equal_target
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - endpoints.POST_/platform/environments/{id}/change-sets
        distinguishing_aspect: "A deployment candidate whose source and target are the same environment is refused with ERR_SEGREGATION_OF_DUTIES at 403, so the pipeline cannot be used to promote an environment onto itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One DEVELOPER sandbox."
          setup_api_calls:
            - call: "POST /platform/environments"
              payload: { name: "Self Promote Env", type: "DEVELOPER", aperture_limit: 5 }
              as: PlatformAdmin
              captures: { env_self_id: $.data.id, env_self_v: $.data.version }
          trigger:
            - call: "POST /platform/change-sets"
              payload: { source_environment_id: "${env_self_id}", target_environment_id: "${env_self_id}", component_list: [{ component: "acme_controller", version_tag: 1 }], component_dependencies: [], expected_environment_version: "${env_self_v}" }
              as: ReleaseManager
              captures: { err_self: $.data.error_id }
          assert:
            - "the response carries error_id ERR_SEGREGATION_OF_DUTIES with http 403"
            - "GET /platform/environments/${env_self_id}/change-sets returns an empty array"
            - "Environment.${env_self_id}.version == ${env_self_v}, because the refused create did not advance the environment"

      - name: same_operator_cannot_author_and_approve_source
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.MetadataChangeSet.fields.approved_by_user_id
          - endpoints.POST_/platform/change-sets/{id}/approve
        distinguishing_aspect: "The approving operator must differ from the operator who last approved a change set out of the same source environment, so approving two change sets from one source with the same X-User-ID is refused the second time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A DEVELOPER source sandbox, two DEVELOPER target sandboxes, and one change set out of the source already approved by operator 0050a0000aaa01."
          setup_api_calls:
            - call: "POST /platform/environments"
