# =============================================================================
# Task 1651 — CPAP Resupply & Sleep Therapy Adherence (sleep DME supplier)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  CPAP Resupply & Sleep Therapy Adherence (sleep DME supplier): eligibility per
  payer schedule & documentation of adherence, resupply cadence by component
  with reminder outreach, order authorization & shipment, adherence data
  download & compliance threshold enforcement, mask fit issue & exchange
  policy, machine setup/education & follow-up, insurance rental-to-purchase
  conversion, discontinuation & equipment retrieval.

domain_name: cpap-resupply-adherence
api_prefix: /sleep-therapy

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # payer-schedule eligibility, adherence documentation, segregation of duties on clinical vs fiscal steps
  secondary_archetype: temporal_windowing    # resupply cadence windows, adherence 30-day look-back, rental-month intervals, mask-exchange 30-day window
  complexity_layers:
    - cascading_side_effects          # order authorization -> shipment -> rental month advancement -> conversion eligibility; mask exchange -> resupply clock reset
    - dual_variant_calculation        # provisional vs finalized adherence; straight-line vs actual-usage rental accrual
    - rate_threshold_triggers         # 70% / 4-hour compliance thresholds; 30-day exchange window; payer cadence days
    - derived_field_reconciliation    # adherence_percentage, rental_months_billed, conversion_eligible recomputed across entities
    - scheduled_actions               # reminder outreach scheduled at cadence-lookahead; rental anniversaries; retrieval deadlines
    - optimistic_concurrency          # OCC on Patient.therapy_version for order authorization + adherence download settlement

  entity_topology: flat                # Patient, PayerPolicy, DeviceEnrollment, ComponentSupplyPlan, ResupplyOrder, AdherenceReport, MaskExchange, RentalContract, RetrievalCase all peer entities linked by FKs
  state_machine_shape: parallel        # ResupplyOrder has auth_status x fulfillment_status; RentalContract has billing_status x equipment_status; AdherenceReport cycles

  relationship_patterns:
    - one_to_many                     # Patient -> ResupplyOrder, AdherenceReport, MaskExchange
    - cross_aggregate                 # ResupplyOrder references PayerPolicy + ComponentSupplyPlan + DeviceEnrollment
    - self_referential                # MaskExchange.superseded_by_exchange_id (exchange-of-exchange within window)

  role_model: segregation_of_duties    # IntakeCoordinator creates patient/order; RespiratoryTherapist performs setup + adherence review; BillingSpecialist authorizes + bills; no single role may both clinically clear and fiscally authorize the same order

  consistency_model: immediate         # all mutations atomic per-request; computed fields refreshed synchronously

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO-8601 date (YYYY-MM-DD)" }
      - { name: payer_policy_id, type: string, source: input, description: "FK -> PayerPolicy.id; active payer policy governing this patient" }
      - { name: prescribing_clinician_npi, type: string, source: input, description: "10-digit NPI of the prescribing clinician" }
      - { name: patient_status, type: enum, source: system, description: "INTAKE | ACTIVE_THERAPY | NON_COMPLIANT_HOLD | DISCONTINUING | DISCONTINUED" }
      - { name: therapy_started_on, type: string, source: system, description: "ISO date of first successful machine setup; null until setup completed" }
      - { name: adherence_percentage, type: number, source: computed, description: "Latest finalized adherence percentage from most recent AdherenceReport in FINALIZED status; null if none" }
      - { name: is_compliance_current, type: boolean, source: computed, description: "True iff adherence_percentage >= payer_policy.compliance_threshold_pct as of latest FINALIZED report" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of ResupplyOrder.patient_responsibility_cents for orders in INVOICED status minus payments applied" }
      - { name: current_device_enrollment_id, type: string, source: system, description: "FK -> DeviceEnrollment.id of the patient's currently-active device enrollment; null if none" }
      - { name: current_rental_contract_id, type: string, source: system, description: "FK -> RentalContract.id of the active rental contract; null if patient owns device outright or has none" }

  - name: PayerPolicy
    parent: null
    common_fields: true
    fields:
      - { name: payer_name, type: string, source: input, description: "Payer display name" }
      - { name: plan_code, type: string, source: input, description: "Payer plan code; unique across policies" }
      - { name: compliance_threshold_pct, type: integer, source: input, description: "Minimum adherence percentage (integer 1..100) required for continued coverage; CMS standard is 70" }
      - { name: compliance_min_hours_per_night, type: number, source: input, description: "Minimum hours of usage per night counted as compliant (CMS standard 4.0)" }
      - { name: compliance_window_days, type: integer, source: input, description: "Consecutive-day look-back window over which adherence is computed (CMS standard 30)" }
      - { name: compliance_min_nights, type: integer, source: input, description: "Minimum number of compliant nights within window required (derived on read as ceil(compliance_threshold_pct/100 * compliance_window_days) but pinned at intake for audit)" }
      - { name: rental_months_to_own, type: integer, source: input, description: "Number of billed rental months after which ownership converts (typically 10 or 13)" }
      - { name: mask_cadence_days, type: integer, source: input, description: "Minimum days between billable full-mask resupply (typically 90)" }
      - { name: cushion_cadence_days, type: integer, source: input, description: "Minimum days between billable cushion resupply (typically 30)" }
      - { name: filter_cadence_days, type: integer, source: input, description: "Minimum days between billable filter resupply (typically 14)" }
      - { name: tubing_cadence_days, type: integer, source: input, description: "Minimum days between billable tubing resupply (typically 90)" }
      - { name: mask_exchange_window_days, type: integer, source: input, description: "Days from mask setup/last exchange during which a no-cost fit exchange is permitted (typically 30)" }
      - { name: max_exchanges_per_window, type: integer, source: input, description: "Maximum no-cost mask exchanges allowed within one mask_exchange_window_days window" }
      - { name: requires_prior_auth, type: boolean, source: input, description: "If true, every ResupplyOrder requires a separate BillingSpecialist authorization step before shipment" }

  - name: DeviceEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: device_serial, type: string, source: input, description: "Manufacturer serial number; unique across enrollments" }
      - { name: device_model, type: string, source: input, description: "Device model code" }
      - { name: acquisition_type, type: enum, source: input, description: "RENTAL | PURCHASE — RENTAL creates a RentalContract; PURCHASE does not" }
      - { name: enrollment_status, type: enum, source: system, description: "PENDING_SETUP | SETUP_IN_PROGRESS | ACTIVE | RETRIEVAL_PENDING | RETRIEVED | RETURNED_TO_PAYER | DECOMMISSIONED" }
      - { name: setup_completed_on, type: string, source: system, description: "ISO date when RespiratoryTherapist completed setup/education; null until then" }
      - { name: last_adherence_download_on, type: string, source: system, description: "ISO date of most recent AdherenceReport ingestion; null if never" }

  - name: ComponentSupplyPlan
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: component_type, type: enum, source: input, description: "MASK | CUSHION | FILTER | TUBING" }
      - { name: quantity_per_cycle, type: integer, source: input, description: "Units dispensed per resupply cycle (>=1)" }
      - { name: last_dispensed_on, type: string, source: system, description: "ISO date of most recent SHIPPED ResupplyOrder containing this component; null if never dispensed" }
      - { name: next_eligible_on, type: string, source: system, description: "ISO date; computed as last_dispensed_on + cadence_days from payer policy; null until first dispense (first dispense always eligible once setup completed)" }
      - { name: reminder_sent_on, type: string, source: system, description: "ISO date of the most recent outreach reminder for this component; null if none" }
      - { name: plan_status, type: enum, source: system, description: "ACTIVE | SUSPENDED_NON_COMPLIANCE | SUSPENDED_DISCONTINUATION | CLOSED" }

  - name: ResupplyOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: component_supply_plan_id, type: string, source: input, description: "FK -> ComponentSupplyPlan.id being fulfilled" }
      - { name: expected_patient_version, type: integer, source: input, description: "OCC field: client's last-observed Patient.version; must equal current Patient.version at authorization time" }
      - { name: auth_status, type: enum, source: system, description: "PENDING_CLINICAL_CLEARANCE | PENDING_PAYER_AUTH | AUTHORIZED | DENIED | CANCELLED — parallel dimension 1" }
      - { name: fulfillment_status, type: enum, source: system, description: "NOT_READY | READY_TO_SHIP | SHIPPED | DELIVERED | INVOICED | RETURNED — parallel dimension 2" }
      - { name: requested_quantity, type: integer, source: input, description: "Units requested; must equal component_supply_plan.quantity_per_cycle" }
      - { name: unit_allowable_cents, type: integer, source: system, description: "Payer-allowable per unit snapshotted from payer fee schedule at authorization time" }
      - { name: patient_responsibility_cents, type: integer, source: computed, description: "Coinsurance share billed to patient after invoice; computed at INVOICED transition" }
      - { name: clinical_cleared_by_user_id, type: string, source: system, description: "X-User-ID of the RespiratoryTherapist who cleared; recorded for segregation-of-duties" }
      - { name: authorized_by_user_id, type: string, source: system, description: "X-User-ID of the BillingSpecialist who authorized; recorded for segregation-of-duties" }
      - { name: shipped_on, type: string, source: system, description: "ISO date of SHIPPED transition" }
      - { name: denial_reason_code, type: string, source: system, description: "Payer denial reason; set when auth_status -> DENIED" }

  - name: AdherenceReport
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: device_enrollment_id, type: string, source: input, description: "FK -> DeviceEnrollment.id the data came from" }
      - { name: window_end_on, type: string, source: input, description: "ISO date of last day in the reporting window (inclusive)" }
      - { name: window_start_on, type: string, source: system, description: "Computed as window_end_on - (payer.compliance_window_days - 1) days" }
      - { name: nights_reported, type: integer, source: input, description: "Count of nightly usage records submitted in this report" }
      - { name: compliant_nights, type: integer, source: input, description: "Count of nights with usage_hours >= payer.compliance_min_hours_per_night" }
      - { name: adherence_pct_provisional, type: number, source: computed, description: "compliant_nights / nights_reported * 100, round-half-up to 1 decimal — provisional variant, available immediately on ingestion" }
      - { name: adherence_pct_final, type: number, source: computed, description: "compliant_nights / payer.compliance_window_days * 100, round-half-up to 1 decimal — final variant, denominator is the full window (missing nights count as non-compliant); set only on finalize" }
      - { name: report_status, type: enum, source: system, description: "RECEIVED | UNDER_REVIEW | FINALIZED | REJECTED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of the RespiratoryTherapist who finalized; null until finalized" }

  - name: MaskExchange
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: device_enrollment_id, type: string, source: input, description: "FK -> DeviceEnrollment.id" }
      - { name: original_mask_plan_id, type: string, source: input, description: "FK -> ComponentSupplyPlan.id of the MASK component being exchanged" }
      - { name: superseded_by_exchange_id, type: string, source: system, description: "FK -> MaskExchange.id of a later exchange that replaced this one; null if this is the latest" }
      - { name: reason_code, type: enum, source: input, description: "FIT_LEAK | SKIN_IRRITATION | WRONG_SIZE | PRESSURE_INTOLERANCE" }
      - { name: exchange_status, type: enum, source: system, description: "REQUESTED | APPROVED | SHIPPED | COMPLETED | DENIED | CANCELLED" }
      - { name: window_anchor_on, type: string, source: system, description: "ISO date anchoring the current no-cost exchange window. Selector: 'prior exchange' = the most recently created MaskExchange for this patient with id != this.id (created_at DESC, tie-break id never used). Equals DeviceEnrollment.setup_completed_on if no prior exchange exists; else prior.window_anchor_on if the prior window is still open (current_date <= prior.window_anchor_on + payer.mask_exchange_window_days); else prior.completed_on (rolls the window forward only after the prior window has expired)" }
      - { name: completed_on, type: string, source: system, description: "ISO date exchange reached COMPLETED; null until then" }

  - name: RentalContract
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: device_enrollment_id, type: string, source: input, description: "FK -> DeviceEnrollment.id; must have acquisition_type=RENTAL" }
      - { name: payer_policy_id, type: string, source: system, description: "FK -> PayerPolicy.id snapshotted at contract creation" }
      - { name: rental_start_on, type: string, source: system, description: "ISO date; equals DeviceEnrollment.setup_completed_on at the time the contract activates" }
      - { name: rental_months_billed, type: integer, source: computed, description: "Count of monthly rental invoices issued; increments on bill_rental_month" }
      - { name: monthly_rental_cents, type: integer, source: input, description: "Payer-allowable monthly rental amount" }
      - { name: billing_status, type: enum, source: system, description: "SCHEDULED | BILLING | PAUSED_NON_COMPLIANCE | CONVERTED_TO_OWNERSHIP | TERMINATED — parallel dimension 1" }
      - { name: equipment_status, type: enum, source: system, description: "WITH_PATIENT | RETRIEVAL_REQUESTED | RETRIEVED | OWNERSHIP_TRANSFERRED — parallel dimension 2" }
      - { name: conversion_eligible_on, type: string, source: computed, description: "ISO date on which rental_months_billed will reach payer.rental_months_to_own; computed as rental_start_on + rental_months_to_own months" }

  - name: RetrievalCase
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: device_enrollment_id, type: string, source: input, description: "FK -> DeviceEnrollment.id of the device to retrieve" }
      - { name: rental_contract_id, type: string, source: system, description: "FK -> RentalContract.id if the device is under rental; null for owned devices" }
      - { name: reason_code, type: enum, source: input, description: "THERAPY_DISCONTINUED | PROLONGED_NON_COMPLIANCE | PAYER_STOPPED_COVERAGE | PATIENT_REQUEST" }
      - { name: retrieval_status, type: enum, source: system, description: "OPEN | SCHEDULED | IN_TRANSIT | RECEIVED | RECONCILED | CLOSED_UNRECOVERABLE" }
      - { name: due_on, type: string, source: system, description: "ISO date by which equipment must be returned; computed as created date + 14 days" }
      - { name: received_on, type: string, source: system, description: "ISO date equipment physically received; null until then" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Patient
    initial_state: INTAKE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: INTAKE
        to: ACTIVE_THERAPY
        trigger: "POST /sleep-therapy/device-enrollments/{id}/complete-setup (on the patient's first DeviceEnrollment)"
        actor: RespiratoryTherapist
        preconditions:
          - "Patient in INTAKE (ERR_PATIENT_NOT_IN_INTAKE)"
          - "DeviceEnrollment in SETUP_IN_PROGRESS (ERR_ENROLLMENT_NOT_READY_FOR_SETUP)"
          - "Payer policy exists and patient linked (ERR_PAYER_POLICY_NOT_FOUND)"
        side_effects:
          - "Patient.patient_status -> ACTIVE_THERAPY"
          - "Patient.therapy_started_on := current date"
          - "Patient.current_device_enrollment_id := this enrollment id"
          - "If enrollment.acquisition_type == RENTAL: create RentalContract (billing_status=SCHEDULED, equipment_status=WITH_PATIENT, rental_start_on=today, rental_months_billed=0) and set Patient.current_rental_contract_id"
          - "Create 4 ComponentSupplyPlan rows (MASK, CUSHION, FILTER, TUBING) all in ACTIVE with last_dispensed_on=null, next_eligible_on=null"
          - "DeviceEnrollment.enrollment_status -> ACTIVE, setup_completed_on := today"
      - from: ACTIVE_THERAPY
        to: NON_COMPLIANT_HOLD
        trigger: "system — automatic when an AdherenceReport finalizes with adherence_pct_final < payer.compliance_threshold_pct"
        actor: system
        preconditions:
          - "AdherenceReport just finalized"
          - "adherence_pct_final < payer.compliance_threshold_pct"
        side_effects:
          - "Patient.patient_status -> NON_COMPLIANT_HOLD"
          - "All ComponentSupplyPlan rows for this patient in ACTIVE -> SUSPENDED_NON_COMPLIANCE"
          - "If active RentalContract in BILLING: billing_status -> PAUSED_NON_COMPLIANCE (rental_months_billed does NOT advance while paused)"
      - from: NON_COMPLIANT_HOLD
        to: ACTIVE_THERAPY
        trigger: "system — automatic when a subsequent AdherenceReport finalizes with adherence_pct_final >= payer.compliance_threshold_pct"
        actor: system
        preconditions:
          - "AdherenceReport just finalized"
          - "adherence_pct_final >= payer.compliance_threshold_pct"
        side_effects:
          - "Patient.patient_status -> ACTIVE_THERAPY"
          - "All ComponentSupplyPlan rows in SUSPENDED_NON_COMPLIANCE -> ACTIVE"
          - "If active RentalContract in PAUSED_NON_COMPLIANCE: billing_status -> BILLING"
      - from: ACTIVE_THERAPY
        to: DISCONTINUING
        trigger: "POST /sleep-therapy/patients/{id}/initiate-discontinuation"
        actor: RespiratoryTherapist
        preconditions:
          - "Patient in ACTIVE_THERAPY or NON_COMPLIANT_HOLD (ERR_PATIENT_NOT_DISCONTINUABLE)"
        side_effects:
          - "Patient.patient_status -> DISCONTINUING"
          - "All ComponentSupplyPlan rows -> SUSPENDED_DISCONTINUATION"
          - "If active RentalContract: create RetrievalCase (reason_code=THERAPY_DISCONTINUED, retrieval_status=OPEN, due_on = today+14), set RentalContract.equipment_status=RETRIEVAL_REQUESTED"
      - from: NON_COMPLIANT_HOLD
        to: DISCONTINUING
        trigger: "POST /sleep-therapy/patients/{id}/initiate-discontinuation"
        actor: RespiratoryTherapist
        preconditions:
          - "Patient in ACTIVE_THERAPY or NON_COMPLIANT_HOLD (ERR_PATIENT_NOT_DISCONTINUABLE)"
        side_effects:
          - "Patient.patient_status -> DISCONTINUING"
          - "All ComponentSupplyPlan rows -> SUSPENDED_DISCONTINUATION"
          - "If active RentalContract: create RetrievalCase (OPEN, due_on=today+14), RentalContract.equipment_status=RETRIEVAL_REQUESTED"
      - from: DISCONTINUING
        to: DISCONTINUED
        trigger: "system — automatic cascade when the open RetrievalCase transitions to RECONCILED or CLOSED_UNRECOVERABLE (synchronous with the retrieval-cases/{id}/reconcile or close-unrecoverable call)"
        actor: system
        preconditions:
          - "Patient in DISCONTINUING"
          - "Linked RetrievalCase transitioning to {RECONCILED, CLOSED_UNRECOVERABLE} in the same request"
        side_effects:
          - "Patient.patient_status -> DISCONTINUED"
          - "All ComponentSupplyPlan rows -> CLOSED"
          - "If RentalContract: billing_status -> TERMINATED (if not already CONVERTED_TO_OWNERSHIP)"
          - "DeviceEnrollment.enrollment_status -> RETRIEVED if equipment recovered, else DECOMMISSIONED"

  - entity: DeviceEnrollment
    initial_state: PENDING_SETUP
    terminal_states: [RETRIEVED, RETURNED_TO_PAYER, DECOMMISSIONED]
    transitions:
      - from: PENDING_SETUP
        to: SETUP_IN_PROGRESS
        trigger: "POST /sleep-therapy/device-enrollments/{id}/begin-setup"
        actor: RespiratoryTherapist
        preconditions:
          - "Enrollment in PENDING_SETUP (ERR_ENROLLMENT_NOT_PENDING_SETUP)"
          - "Patient in INTAKE (ERR_PATIENT_NOT_IN_INTAKE)"
        side_effects: ["enrollment_status -> SETUP_IN_PROGRESS"]
      - from: SETUP_IN_PROGRESS
        to: ACTIVE
        trigger: "POST /sleep-therapy/device-enrollments/{id}/complete-setup"
        actor: RespiratoryTherapist
        preconditions:
          - "Enrollment in SETUP_IN_PROGRESS (ERR_ENROLLMENT_NOT_READY_FOR_SETUP)"
        side_effects:
          - "Cascades to Patient INTAKE->ACTIVE_THERAPY (see Patient state machine)"
      - from: ACTIVE
        to: RETRIEVAL_PENDING
        trigger: "system — automatic when a RetrievalCase opens for this device"
        actor: system
        preconditions: ["RetrievalCase just created for this enrollment"]
        side_effects: ["enrollment_status -> RETRIEVAL_PENDING"]
      - from: RETRIEVAL_PENDING
        to: RETRIEVED
        trigger: "POST /sleep-therapy/retrieval-cases/{id}/mark-received (for the case linked to this enrollment)"
        actor: IntakeCoordinator
        preconditions: ["Linked RetrievalCase reached RECEIVED"]
        side_effects: ["enrollment_status -> RETRIEVED"]
      - from: RETRIEVED
        to: RETURNED_TO_PAYER
        trigger: "POST /sleep-therapy/device-enrollments/{id}/return-to-payer"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment in RETRIEVED (ERR_ENROLLMENT_NOT_RETRIEVED)"
          - "RentalContract exists and equipment_status == RETRIEVED (ERR_RENTAL_NOT_IN_RETRIEVAL)"
        side_effects: ["enrollment_status -> RETURNED_TO_PAYER"]

  - entity: ResupplyOrder
    initial_state: PENDING_CLINICAL_CLEARANCE  # auth_status initial; fulfillment_status starts NOT_READY
    terminal_states: [INVOICED, DENIED, CANCELLED, RETURNED]   # evaluated on the pair (auth_status, fulfillment_status); terminal when auth_status IN {DENIED, CANCELLED} OR fulfillment_status IN {INVOICED, RETURNED}
    transitions:
      # ---- creation lands in PENDING_CLINICAL_CLEARANCE ----
      - from: "<creation>"
        to: PENDING_CLINICAL_CLEARANCE
        trigger: "POST /sleep-therapy/resupply-orders"
        actor: IntakeCoordinator
        preconditions:
          - "Patient in ACTIVE_THERAPY (ERR_PATIENT_NOT_IN_ACTIVE_THERAPY)"
          - "ComponentSupplyPlan in ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "requested_quantity == ComponentSupplyPlan.quantity_per_cycle (ERR_QUANTITY_MISMATCH)"
          - "Cadence gate: plan.next_eligible_on is null OR current_date >= plan.next_eligible_on (ERR_CADENCE_NOT_MET)"
          - "If payer.requires_prior_auth: a prior-auth reference must be supplied (ERR_PRIOR_AUTH_REQUIRED)"
        side_effects:
          - "auth_status = PENDING_CLINICAL_CLEARANCE; fulfillment_status = NOT_READY"
      - from: PENDING_CLINICAL_CLEARANCE
        to: PENDING_PAYER_AUTH
        trigger: "POST /sleep-therapy/resupply-orders/{id}/clinical-clear"
        actor: RespiratoryTherapist
        preconditions:
          - "auth_status == PENDING_CLINICAL_CLEARANCE (ERR_ORDER_NOT_PENDING_CLINICAL)"
          - "Patient.is_compliance_current == true OR patient has no FINALIZED adherence report yet (first-fill grace) (ERR_COMPLIANCE_NOT_CURRENT)"
        side_effects:
          - "auth_status -> PENDING_PAYER_AUTH"
          - "clinical_cleared_by_user_id := X-User-ID"
      - from: PENDING_PAYER_AUTH
        to: AUTHORIZED
        trigger: "POST /sleep-therapy/resupply-orders/{id}/authorize"
        actor: BillingSpecialist
        preconditions:
          - "auth_status == PENDING_PAYER_AUTH (ERR_ORDER_NOT_PENDING_AUTH)"
          - "fulfillment_status == NOT_READY"
          - "Segregation of duties: X-User-ID != clinical_cleared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "OCC: expected_patient_version == Patient.version (ERR_STALE_PATIENT_VERSION)"
        side_effects:
          - "auth_status -> AUTHORIZED; fulfillment_status -> READY_TO_SHIP"
          - "authorized_by_user_id := X-User-ID"
          - "unit_allowable_cents := payer fee-schedule snapshot"
          - "increments Patient.version by 1"
      - from: PENDING_PAYER_AUTH
        to: DENIED
        trigger: "POST /sleep-therapy/resupply-orders/{id}/deny"
        actor: BillingSpecialist
        preconditions: ["auth_status == PENDING_PAYER_AUTH"]
        side_effects:
          - "auth_status -> DENIED; denial_reason_code := input"
          - "increments Patient.version by 1"
      # ---- fulfillment dimension ----
      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "POST /sleep-therapy/resupply-orders/{id}/ship"
        actor: IntakeCoordinator
        preconditions:
          - "auth_status == AUTHORIZED (ERR_ORDER_NOT_AUTHORIZED)"
          - "fulfillment_status == READY_TO_SHIP (ERR_ORDER_NOT_READY_TO_SHIP)"
        side_effects:
          - "fulfillment_status -> SHIPPED; shipped_on := today"
          - "ComponentSupplyPlan.last_dispensed_on := today"
          - "ComponentSupplyPlan.next_eligible_on := today + cadence_days(component_type)  (MASK->payer.mask_cadence_days, CUSHION->payer.cushion_cadence_days, FILTER->payer.filter_cadence_days, TUBING->payer.tubing_cadence_days)"
          - "increments Patient.version by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /sleep-therapy/resupply-orders/{id}/mark-delivered"
        actor: IntakeCoordinator
        preconditions: ["fulfillment_status == SHIPPED (ERR_ORDER_NOT_SHIPPED)"]
        side_effects: ["fulfillment_status -> DELIVERED"]
      - from: DELIVERED
        to: INVOICED
        trigger: "POST /sleep-therapy/resupply-orders/{id}/invoice"
        actor: BillingSpecialist
        preconditions: ["fulfillment_status == DELIVERED (ERR_ORDER_NOT_DELIVERED)"]
        side_effects:
          - "fulfillment_status -> INVOICED"
          - "patient_responsibility_cents := patient_coinsurance_share(unit_allowable_cents * requested_quantity)"
          - "Patient.outstanding_balance_cents += patient_responsibility_cents"
      - from: DELIVERED
        to: RETURNED
        trigger: "POST /sleep-therapy/resupply-orders/{id}/mark-returned"
        actor: IntakeCoordinator
        preconditions: ["fulfillment_status == DELIVERED"]
        side_effects: ["fulfillment_status -> RETURNED; no invoice, no balance impact"]
      - from: PENDING_CLINICAL_CLEARANCE
        to: CANCELLED
        trigger: "POST /sleep-therapy/resupply-orders/{id}/cancel"
        actor: IntakeCoordinator
        preconditions: ["auth_status IN {PENDING_CLINICAL_CLEARANCE, PENDING_PAYER_AUTH} AND fulfillment_status == NOT_READY (ERR_ORDER_NOT_CANCELLABLE)"]
        side_effects: ["auth_status -> CANCELLED"]
      - from: PENDING_PAYER_AUTH
        to: CANCELLED
        trigger: "POST /sleep-therapy/resupply-orders/{id}/cancel"
        actor: IntakeCoordinator
        preconditions: ["auth_status IN {PENDING_CLINICAL_CLEARANCE, PENDING_PAYER_AUTH} AND fulfillment_status == NOT_READY"]
        side_effects: ["auth_status -> CANCELLED"]

  - entity: AdherenceReport
    initial_state: RECEIVED
    terminal_states: [FINALIZED, REJECTED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /sleep-therapy/adherence-reports/{id}/begin-review"
        actor: RespiratoryTherapist
        preconditions: ["report_status == RECEIVED (ERR_REPORT_NOT_RECEIVED)"]
        side_effects: ["report_status -> UNDER_REVIEW"]
      - from: UNDER_REVIEW
        to: FINALIZED
        trigger: "POST /sleep-therapy/adherence-reports/{id}/finalize"
        actor: RespiratoryTherapist
        preconditions:
          - "report_status == UNDER_REVIEW (ERR_REPORT_NOT_UNDER_REVIEW)"
          - "window arithmetic valid: window_start_on = window_end_on - (payer.compliance_window_days - 1) (ERR_INVALID_WINDOW)"
        side_effects:
          - "report_status -> FINALIZED; reviewed_by_user_id := X-User-ID"
          - "Compute adherence_pct_final = round_half_up(compliant_nights / payer.compliance_window_days * 100, 1)"
          - "Patient.adherence_percentage := adherence_pct_final"
          - "Patient.is_compliance_current := (adherence_pct_final >= payer.compliance_threshold_pct)"
          - "DeviceEnrollment.last_adherence_download_on := today"
          - "Cascade: Patient status NON_COMPLIANT_HOLD <-> ACTIVE_THERAPY per threshold; ComponentSupplyPlans suspend/resume; RentalContract pause/resume (see Patient state machine)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /sleep-therapy/adherence-reports/{id}/reject"
        actor: RespiratoryTherapist
        preconditions: ["report_status == UNDER_REVIEW"]
        side_effects: ["report_status -> REJECTED; Patient fields NOT updated"]

  - entity: MaskExchange
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /sleep-therapy/mask-exchanges/{id}/approve"
        actor: RespiratoryTherapist
        preconditions:
          - "exchange_status == REQUESTED (ERR_EXCHANGE_NOT_REQUESTED)"
          - "Window check: current_date <= window_anchor_on + payer.mask_exchange_window_days (ERR_EXCHANGE_WINDOW_EXPIRED)"
          - "Count check: number of COMPLETED MaskExchanges for this patient with window_anchor_on == this.window_anchor_on < payer.max_exchanges_per_window (ERR_EXCHANGE_LIMIT_REACHED)"
        side_effects:
          - "exchange_status -> APPROVED"
      - from: APPROVED
        to: SHIPPED
        trigger: "POST /sleep-therapy/mask-exchanges/{id}/ship"
        actor: IntakeCoordinator
        preconditions: ["exchange_status == APPROVED (ERR_EXCHANGE_NOT_APPROVED)"]
        side_effects: ["exchange_status -> SHIPPED"]
      - from: SHIPPED
        to: COMPLETED
        trigger: "POST /sleep-therapy/mask-exchanges/{id}/complete"
        actor: IntakeCoordinator
        preconditions: ["exchange_status == SHIPPED (ERR_EXCHANGE_NOT_SHIPPED)"]
        side_effects:
          - "exchange_status -> COMPLETED; completed_on := today"
          - "ComponentSupplyPlan(MASK).last_dispensed_on := today; next_eligible_on := today + payer.mask_cadence_days (exchange resets the mask resupply clock)"
          - "Supersession: the most recent prior MaskExchange on this patient with superseded_by_exchange_id == null and id != this.id (selected by created_at DESC) has superseded_by_exchange_id := this.id"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /sleep-therapy/mask-exchanges/{id}/deny"
        actor: RespiratoryTherapist
        preconditions: ["exchange_status == REQUESTED"]
        side_effects: ["exchange_status -> DENIED"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /sleep-therapy/mask-exchanges/{id}/cancel"
        actor: IntakeCoordinator
        preconditions: ["exchange_status IN {REQUESTED, APPROVED}"]
        side_effects: ["exchange_status -> CANCELLED"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /sleep-therapy/mask-exchanges/{id}/cancel"
        actor: IntakeCoordinator
        preconditions: ["exchange_status IN {REQUESTED, APPROVED}"]
        side_effects: ["exchange_status -> CANCELLED"]

  - entity: RentalContract
    initial_state: SCHEDULED   # billing_status; equipment_status starts WITH_PATIENT
    terminal_states: [CONVERTED_TO_OWNERSHIP, TERMINATED]
    transitions:
      - from: SCHEDULED
        to: BILLING
        trigger: "system — automatic when current_date >= rental_start_on + 1 month and billing_status == SCHEDULED"
        actor: system
        preconditions: []
        side_effects: ["billing_status -> BILLING"]
      - from: BILLING
        to: BILLING  # self-loop: monthly invoice
        trigger: "POST /sleep-therapy/rental-contracts/{id}/bill-rental-month"
        actor: BillingSpecialist
        preconditions:
          - "billing_status == BILLING (ERR_RENTAL_NOT_BILLING)"
          - "rental_months_billed < payer.rental_months_to_own (ERR_RENTAL_ALREADY_CONVERTED)"
          - "current_date >= rental_start_on + rental_months_billed months + 1 month (ERR_RENTAL_PERIOD_NOT_DUE)"
        side_effects:
          - "rental_months_billed += 1"
          - "If rental_months_billed == payer.rental_months_to_own: billing_status -> CONVERTED_TO_OWNERSHIP; equipment_status -> OWNERSHIP_TRANSFERRED"
      - from: BILLING
        to: PAUSED_NON_COMPLIANCE
        trigger: "system — automatic on Patient ACTIVE_THERAPY -> NON_COMPLIANT_HOLD"
        actor: system
        preconditions: []
        side_effects: ["billing_status -> PAUSED_NON_COMPLIANCE; rental clock pauses"]
      - from: PAUSED_NON_COMPLIANCE
        to: BILLING
        trigger: "system — automatic on Patient NON_COMPLIANT_HOLD -> ACTIVE_THERAPY"
        actor: system
        preconditions: []
        side_effects: ["billing_status -> BILLING; rental clock resumes"]
      - from: BILLING
        to: CONVERTED_TO_OWNERSHIP
        trigger: "system — automatic when bill-rental-month causes rental_months_billed == payer.rental_months_to_own"
        actor: system
        preconditions: []
        side_effects:
          - "billing_status -> CONVERTED_TO_OWNERSHIP"
          - "equipment_status -> OWNERSHIP_TRANSFERRED"
      - from: SCHEDULED
        to: TERMINATED
        trigger: "system — on Patient DISCONTINUING -> DISCONTINUED (if not converted)"
        actor: system
        preconditions: []
        side_effects: ["billing_status -> TERMINATED"]
      - from: BILLING
        to: TERMINATED
        trigger: "system — on Patient DISCONTINUING -> DISCONTINUED (if not converted)"
        actor: system
        preconditions: []
        side_effects: ["billing_status -> TERMINATED"]
      - from: PAUSED_NON_COMPLIANCE
        to: TERMINATED
        trigger: "system — on Patient DISCONTINUING -> DISCONTINUED (if not converted)"
        actor: system
        preconditions: []
        side_effects: ["billing_status -> TERMINATED"]
      # equipment_status dimension (parallel)
      - from: WITH_PATIENT
        to: RETRIEVAL_REQUESTED
        trigger: "system — on RetrievalCase creation"
        actor: system
        preconditions: []
        side_effects: ["equipment_status -> RETRIEVAL_REQUESTED"]
      - from: RETRIEVAL_REQUESTED
        to: RETRIEVED
        trigger: "POST /sleep-therapy/retrieval-cases/{id}/mark-received"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: ["equipment_status -> RETRIEVED"]

  - entity: RetrievalCase
    initial_state: OPEN
    terminal_states: [RECONCILED, CLOSED_UNRECOVERABLE]
    transitions:
      - from: OPEN
        to: SCHEDULED
        trigger: "POST /sleep-therapy/retrieval-cases/{id}/schedule-pickup"
        actor: IntakeCoordinator
        preconditions: ["retrieval_status == OPEN (ERR_RETRIEVAL_NOT_OPEN)"]
        side_effects: ["retrieval_status -> SCHEDULED"]
      - from: SCHEDULED
        to: IN_TRANSIT
        trigger: "POST /sleep-therapy/retrieval-cases/{id}/mark-picked-up"
        actor: IntakeCoordinator
        preconditions: ["retrieval_status == SCHEDULED (ERR_RETRIEVAL_NOT_SCHEDULED)"]
        side_effects: ["retrieval_status -> IN_TRANSIT"]
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /sleep-therapy/retrieval-cases/{id}/mark-received"
        actor: IntakeCoordinator
        preconditions: ["retrieval_status == IN_TRANSIT (ERR_RETRIEVAL_NOT_IN_TRANSIT)"]
        side_effects:
          - "retrieval_status -> RECEIVED; received_on := today"
          - "DeviceEnrollment.enrollment_status -> RETRIEVED"
          - "RentalContract.equipment_status -> RETRIEVED (if linked)"
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /sleep-therapy/retrieval-cases/{id}/reconcile"
        actor: IntakeCoordinator
        preconditions: ["retrieval_status == RECEIVED (ERR_RETRIEVAL_NOT_RECEIVED)"]
        side_effects:
          - "retrieval_status -> RECONCILED"
          - "Cascade (synchronous): Patient DISCONTINUING -> DISCONTINUED; all ComponentSupplyPlans -> CLOSED; RentalContract.billing_status -> TERMINATED"
      - from: OPEN
        to: CLOSED_UNRECOVERABLE
        trigger: "POST /sleep-therapy/retrieval-cases/{id}/close-unrecoverable"
        actor: IntakeCoordinator
        preconditions:
          - "retrieval_status IN {OPEN, SCHEDULED, IN_TRANSIT} (ERR_RETRIEVAL_NOT_CLOSABLE)"
          - "current_date > due_on (ERR_RETRIEVAL_NOT_OVERDUE)"
        side_effects:
          - "retrieval_status -> CLOSED_UNRECOVERABLE"
          - "Cascade (synchronous): Patient DISCONTINUING -> DISCONTINUED; DeviceEnrollment -> DECOMMISSIONED; ComponentSupplyPlans -> CLOSED; RentalContract.billing_status -> TERMINATED"
      - from: SCHEDULED
        to: CLOSED_UNRECOVERABLE
        trigger: "POST /sleep-therapy/retrieval-cases/{id}/close-unrecoverable"
        actor: IntakeCoordinator
        preconditions: ["retrieval_status IN {OPEN, SCHEDULED, IN_TRANSIT}", "current_date > due_on"]
        side_effects: ["retrieval_status -> CLOSED_UNRECOVERABLE; cascades as above"]
      - from: IN_TRANSIT
        to: CLOSED_UNRECOVERABLE
        trigger: "POST /sleep-therapy/retrieval-cases/{id}/close-unrecoverable"
        actor: IntakeCoordinator
        preconditions: ["retrieval_status IN {OPEN, SCHEDULED, IN_TRANSIT}", "current_date > due_on"]
        side_effects: ["retrieval_status -> CLOSED_UNRECOVERABLE; cascades as above"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-authorize-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /sleep-therapy/resupply-orders/{id}/authorize"
    occ_field: "expected_patient_version"
    description: |
      Authorizing a ResupplyOrder against a Patient whose `version` has advanced
      since the IntakeCoordinator created the order (or since the client last
      read the Patient) is rejected. This captures the case where a concurrent
      business event — an AdherenceReport finalize flipping the patient into
      NON_COMPLIANT_HOLD, a mask-exchange completion resetting the supply clock,
      or a discontinuation initiation — has advanced Patient.version and made
      the client's snapshot stale. The OCC check reduces the race to a
      deterministic stale-version comparison, not wall-clock simultaneity.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

  - rule_id: order-ship-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /sleep-therapy/resupply-orders/{id}/ship"
    occ_field: "expected_patient_version"
    description: |
      Shipping a ResupplyOrder against a Patient whose `version` no longer
      matches the version captured at order creation is rejected. Shipping has
      the side effect of resetting ComponentSupplyPlan cadence and advancing
      Patient.version, so a ship request carrying a stale snapshot would
      double-advance the cadence clock if a prior ship or exchange already
      bumped it.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: adherence_percentage_dual_variant
    trigger: "AdherenceReport ingestion (provisional) and finalize (final)"
    algorithm: threshold
    formula: |
      INPUT: report.nights_reported (N), report.compliant_nights (C),
             payer.compliance_window_days (W)

      PROVISIONAL (available at ingestion, status=RECEIVED):
        adherence_pct_provisional = round_half_up( C / N * 100, 1 )   if N > 0
        adherence_pct_provisional = 0.0                                if N == 0

      FINAL (available only after finalize, status=FINALIZED):
        adherence_pct_final = round_half_up( C / W * 100, 1 )

      DIFFERENCE: provisional divides by nights actually reported; final
      divides by the full payer window, so missing nights count as
      non-compliant in the final variant but not in the provisional.
    input_set: "Single AdherenceReport; only nights within [window_start_on, window_end_on] inclusive"
    constants:
      ROUNDING: round_half_up
      DECIMAL_PLACES: 1
    precision: "1 decimal place, round_half_up"
    variants:
      - name: provisional
        when: "report_status IN {RECEIVED, UNDER_REVIEW} — used for clinician preview"
        difference: "Denominator = nights_reported (missing nights ignored)"
      - name: final
        when: "report_status == FINALIZED — drives Patient.is_compliance_current and all downstream gates"
        difference: "Denominator = payer.compliance_window_days (missing nights count as non-compliant)"

  - name: compliance_determination
    trigger: "AdherenceReport finalize"
    algorithm: threshold
    formula: |
      compliant_threshold_nights = ceil( payer.compliance_threshold_pct / 100 * payer.compliance_window_days )
      is_compliant = ( adherence_pct_final >= payer.compliance_threshold_pct )
      BOUNDARY: the comparison is >= (inclusive). A patient whose final
      percentage equals the threshold exactly IS compliant.
    input_set: "Single AdherenceReport in FINALIZED status"
    constants:
      BOUNDARY_SEMANTIC: "inclusive (>=)"

  - name: cadence_eligibility_per_component
    trigger: "ResupplyOrder creation"
    algorithm: chronological
    formula: |
      IF plan.last_dispensed_on IS NULL:
        eligible = (Patient.patient_status == ACTIVE_THERAPY)   # first-fill
      ELSE:
        cadence_days = CASE plan.component_type
          WHEN MASK    THEN payer.mask_cadence_days
          WHEN CUSHION THEN payer.cushion_cadence_days
          WHEN FILTER  THEN payer.filter_cadence_days
          WHEN TUBING  THEN payer.tubing_cadence_days
        next_eligible_on = plan.last_dispensed_on + cadence_days   # calendar days
        eligible = ( current_date >= next_eligible_on )
      BOUNDARY: current_date >= next_eligible_on (inclusive). An order placed
      ON next_eligible_on is eligible; one day prior is not.
    input_set: "ComponentSupplyPlan + PayerPolicy cadence for plan.component_type"
    constants:
      BOUNDARY_SEMANTIC: "inclusive (>=)"

  - name: mask_exchange_window_check
    trigger: "MaskExchange approve"
    algorithm: interval_merge
    formula: |
      window_start = exchange.window_anchor_on          # inclusive
      window_end   = exchange.window_anchor_on + payer.mask_exchange_window_days   # exclusive of the day AFTER; i.e. last valid day is window_anchor_on + mask_exchange_window_days - 1 ... pinned below

      # PINNED SEMANTICS (inclusive-exclusive on day count):
      # An exchange is within-window iff
      #   current_date <= window_anchor_on + mask_exchange_window_days
      # where both dates are calendar dates and the comparison is date <=.
      # i.e. if anchor = 2026-03-01 and window = 30 days, last valid day = 2026-03-31.
      within_window = ( current_date <= window_anchor_on + payer.mask_exchange_window_days )

      completed_same_window = COUNT(MaskExchange M
        WHERE M.patient_id = this.patient_id
          AND M.exchange_status == COMPLETED
          AND M.window_anchor_on == this.window_anchor_on
          AND M.id != this.id)
      count_ok = ( completed_same_window < payer.max_exchanges_per_window )
      # BOUNDARY: count check uses strict <. If max_exchanges_per_window=1,
      # the first exchange in the window is allowed, the second is not.
    input_set: "MaskExchanges for patient sharing the same window_anchor_on, excluding self"
    constants:
      BOUNDARY_SEMANTIC_DATE: "inclusive (current_date <= anchor + window)"
      BOUNDARY_SEMANTIC_COUNT: "strict less-than (<)"

  - name: rental_month_accrual_dual_variant
    trigger: "RentalContract bill-rental-month and conversion-eligibility read"
    algorithm: chronological
    formula: |
      # Variant A — STRAIGHT-LINE (used for conversion_eligible_on projection at intake):
      #   conversion_eligible_on = rental_start_on + payer.rental_months_to_own months
      #   Assumes one rental month billed per calendar month with no pause.
      #
      # Variant B — ACTUAL-USAGE (drives billing_status and conversion at runtime):
      #   rental_months_billed counts only months in which billing_status was BILLING
      #   for the entire monthly anniversary. Months spent in PAUSED_NON_COMPLIANCE
      #   do NOT increment rental_months_billed and push the effective conversion
      #   date later than the straight-line projection.
      #
      # DIFFERENCE: a patient who spent 2 months in PAUSED_NON_COMPLIANCE reaches
      # rental_months_billed == rental_months_to_own two calendar months AFTER
      # the straight-line conversion_eligible_on date.
      ON bill-rental-month:
        ASSERT billing_status == BILLING
        ASSERT current_date >= rental_start_on + rental_months_billed months + 1 month
        rental_months_billed := rental_months_billed + 1
        IF rental_months_billed == payer.rental_months_to_own:
          billing_status := CONVERTED_TO_OWNERSHIP
          equipment_status := OWNERSHIP_TRANSFERRED
    input_set: "Single RentalContract"
    constants:
      BOUNDARY_SEMANTIC: "inclusive (>=) on monthly anniversary"
    variants:
      - name: straight_line_projection
        when: "At contract creation; sets conversion_eligible_on"
        difference: "Ignores future pauses; pure calendar projection"
      - name: actual_usage
        when: "At each bill-rental-month and conversion check"
        difference: "Counts only BILLING months; pauses defer conversion"

  - name: patient_coinsurance_share
    trigger: "ResupplyOrder invoice"
    algorithm: tiered_pricing
    formula: |
      # Per-line rounding first, then sum — PINNED ORDER
      line_total_cents     = order.unit_allowable_cents * order.requested_quantity
      patient_share_cents  = round_half_up( line_total_cents * COINSURANCE_RATE )
      # COINSURANCE_RATE is the patient's coinsurance fraction (e.g. 0.20 for 20%).
      # Rounding applies per-order (not per-unit) — round the line total, not each unit.
    input_set: "Single ResupplyOrder at INVOICED transition"
    constants:
      COINSURANCE_RATE: 0.20
      ROUNDING: round_half_up
      ROUNDING_ORDER: "round line total after multiplication; do NOT round per-unit"
    precision: "integer cents, round_half_up"

  - name: outstanding_balance_aggregation
    trigger: "ResupplyOrder invoice; patient payment application"
    algorithm: aggregation
    formula: |
      Patient.outstanding_balance_cents =
        SUM( ResupplyOrder.patient_responsibility_cents
             WHERE patient_id = Patient.id
               AND fulfillment_status == INVOICED )
        - SUM( payments_applied_cents )   # out of scope of this scaffold; exposed for downstream extension
    input_set: "All ResupplyOrders for patient in INVOICED status"
    precision: "integer cents"

  - name: reminder_outreach_scheduling
    trigger: "daily system sweep (modeled as ops-run via POST /sleep-therapy/_ops/run-daily-sweep)"
    algorithm: forward_looking
    formula: |
      FOR each ComponentSupplyPlan plan WHERE plan.plan_status == ACTIVE:
        cadence_days = cadence for plan.component_type (per PayerPolicy)
        IF plan.last_dispensed_on IS NULL:  CONTINUE   # first-fill not yet; no reminder
        next_eligible = plan.last_dispensed_on + cadence_days
        lookahead_date = next_eligible - REMINDER_LOOKAHEAD_DAYS
        IF current_date >= lookahead_date AND (plan.reminder_sent_on IS NULL OR plan.reminder_sent_on < lookahead_date):
          EMIT reminder event; plan.reminder_sent_on := current_date
    input_set: "ComponentSupplyPlan rows in ACTIVE status"
    constants:
      REMINDER_LOOKAHEAD_DAYS: 7

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameters must resolve to existing entities (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: existence
    check: "Body-referenced FK ids (patient_id, payer_policy_id, component_supply_plan_id, device_enrollment_id, original_mask_plan_id) must resolve"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with FK body fields"

  - priority: 5
    category: state
    check: "Patient must be in ACTIVE_THERAPY for resupply order creation"
    error_id: ERR_PATIENT_NOT_IN_ACTIVE_THERAPY
    http_status: 409
    applies_to: "POST /sleep-therapy/resupply-orders"

  - priority: 6
    category: state
    check: "ComponentSupplyPlan must be ACTIVE for resupply order creation"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sleep-therapy/resupply-orders"

  - priority: 7
    category: business_constraint
    check: "requested_quantity must equal ComponentSupplyPlan.quantity_per_cycle"
    error_id: ERR_QUANTITY_MISMATCH
    http_status: 422
    applies_to: "POST /sleep-therapy/resupply-orders"

  - priority: 8
    category: business_temporal
    check: "Cadence gate: plan.next_eligible_on is null OR current_date >= next_eligible_on"
    error_id: ERR_CADENCE_NOT_MET
    http_status: 409
    applies_to: "POST /sleep-therapy/resupply-orders"

  - priority: 9
    category: business_safety
    check: "If payer.requires_prior_auth, prior-auth reference must be present"
    error_id: ERR_PRIOR_AUTH_REQUIRED
    http_status: 422
    applies_to: "POST /sleep-therapy/resupply-orders (when payer.requires_prior_auth)"

  - priority: 10
    category: state
    check: "Order auth_status must be PENDING_CLINICAL_CLEARANCE for clinical-clear"
    error_id: ERR_ORDER_NOT_PENDING_CLINICAL
    http_status: 409
    applies_to: "POST /sleep-therapy/resupply-orders/{id}/clinical-clear"

  - priority: 11
    category: business_safety
    check: "Patient compliance must be current (or first-fill grace) for clinical clearance"
    error_id: ERR_COMPLIANCE_NOT_CURRENT
    http_status: 422
    applies_to: "POST /sleep-therapy/resupply-orders/{id}/clinical-clear"

  - priority: 12
    category: state
    check: "Order auth_status must be PENDING_PAYER_AUTH for authorize"
    error_id: ERR_ORDER_NOT_PENDING_AUTH
    http_status: 409
    applies_to: "POST /sleep-therapy/resupply-orders/{id}/authorize"

  - priority: 13
    category: business_safety
    check: "Segregation of duties: authorizer must differ from clinical clearer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /sleep-therapy/resupply-orders/{id}/authorize"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_patient_version must equal Patient.version"
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    applies_to: "POST /sleep-therapy/resupply-orders/{id}/authorize, POST /sleep-therapy/resupply-orders/{id}/ship"

  - priority: 15
    category: state
    check: "Order auth_status must be AUTHORIZED and fulfillment_status READY_TO_SHIP for ship"
    error_id: ERR_ORDER_NOT_READY_TO_SHIP
    http_status: 409
    applies_to: "POST /sleep-therapy/resupply-orders/{id}/ship"

  - priority: 16
    category: state
    check: "Order fulfillment_status must be SHIPPED for mark-delivered"
    error_id: ERR_ORDER_NOT_SHIPPED
    http_status: 409
    applies_to: "POST /sleep-therapy/resupply-orders/{id}/mark-delivered"

  - priority: 17
    category: state
    check: "Order fulfillment_status must be DELIVERED for invoice"
    error_id: ERR_ORDER_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /sleep-therapy/resupply-orders/{id}/invoice"

  - priority: 18
    category: business_temporal
    check: "MaskExchange approve: current_date <= window_anchor_on + payer.mask_exchange_window_days"
    error_id: ERR_EXCHANGE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /sleep-therapy/mask-exchanges/{id}/approve"

  - priority: 19
    category: business_constraint
    check: "MaskExchange approve: completed exchanges in same window < payer.max_exchanges_per_window"
    error_id: ERR_EXCHANGE_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /sleep-therapy/mask-exchanges/{id}/approve"

  - priority: 20
    category: business_temporal
    check: "RentalContract bill-rental-month: current_date >= rental_start_on + rental_months_billed months + 1 month"
    error_id: ERR_RENTAL_PERIOD_NOT_DUE
    http_status: 409
    applies_to: "POST /sleep-therapy/rental-contracts/{id}/bill-rental-month"

  - priority: 21
    category: state
    check: "RentalContract must be BILLING (not PAUSED/CONVERTED/TERMINATED) to bill"
    error_id: ERR_RENTAL_NOT_BILLING
    http_status: 409
    applies_to: "POST /sleep-therapy/rental-contracts/{id}/bill-rental-month"

  - priority: 22
    category: business_fiscal
    check: "RentalContract must not already be converted (rental_months_billed < rental_months_to_own)"
    error_id: ERR_RENTAL_ALREADY_CONVERTED
    http_status: 409
    applies_to: "POST /sleep-therapy/rental-contracts/{id}/bill-rental-month"

  - priority: 23
    category: state
    check: "RetrievalCase must be in correct state for each retrieval action"
    error_id: ERR_RETRIEVAL_INVALID_STATE
    http_status: 409
    applies_to: "POST /sleep-therapy/retrieval-cases/{id}/* actions"

  - priority: 24
    category: business_temporal
    check: "RetrievalCase close-unrecoverable only when current_date > due_on"
    error_id: ERR_RETRIEVAL_NOT_OVERDUE
    http_status: 409
    applies_to: "POST /sleep-therapy/retrieval-cases/{id}/close-unrecoverable"

  - priority: 25
    category: state
    check: "AdherenceReport must be UNDER_REVIEW to finalize or reject"
    error_id: ERR_REPORT_NOT_UNDER_REVIEW
    http_status: 409
    applies_to: "POST /sleep-therapy/adherence-reports/{id}/finalize, reject"

  - priority: 26
    category: business_constraint
    check: "AdherenceReport window: window_end_on - window_start_on == payer.compliance_window_days - 1"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /sleep-therapy/adherence-reports"

  - priority: 27
    category: business_constraint
    check: "Request body must contain all required fields with valid types/enums"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/sleep-therapy/_clock/set_current_utc"
    description: "Advance the logical clock. Startup default is 2026-08-01T00:00:00Z before any set call; never falls back to wall-clock."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["sets logical clock"]

  # --- Ops-run sweep (test-driving for reminder/outreach + auto-transitions) ---
  - method: POST
    path: "/sleep-therapy/_ops/run-daily-sweep"
    description: "Drive system-side daily sweep: reminder outreach scheduling, SCHEDULED->BILLING rental activation, DISCONTINUING->DISCONTINUED on retrieval close"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: { reminders_sent: integer, rental_activations: integer, patient_discontinuations: integer }
    side_effects:
      - "reminder_outreach_scheduling calculation"
      - "RentalContract SCHEDULED->BILLING when due"
      - "Patient DISCONTINUING->DISCONTINUED when linked RetrievalCase reaches RECONCILED or CLOSED_UNRECOVERABLE"

  # --- Payer Policies ---
  - method: POST
    path: "/sleep-therapy/payer-policies"
    description: "Create a payer policy"
    roles: [OpsAdmin]
    code: 201
    input: [payer_name, plan_code, compliance_threshold_pct, compliance_min_hours_per_night, compliance_window_days, compliance_min_nights, rental_months_to_own, mask_cadence_days, cushion_cadence_days, filter_cadence_days, tubing_cadence_days, mask_exchange_window_days, max_exchanges_per_window, requires_prior_auth]
    output: PayerPolicy
    side_effects: []

  - method: GET
    path: "/sleep-therapy/payer-policies"
    description: "List payer policies"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "PayerPolicy[]"
    side_effects: []

  - method: GET
    path: "/sleep-therapy/payer-policies/{id}"
    description: "Get payer policy"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: []
    output: PayerPolicy
    side_effects: []

  # --- Patients ---
  - method: POST
    path: "/sleep-therapy/patients"
    description: "Register a new patient (INTAKE)"
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, date_of_birth, payer_policy_id, prescribing_clinician_npi]
    output: Patient
    side_effects: ["patient_status=INTAKE"]

  - method: GET
    path: "/sleep-therapy/patients"
    description: "List patients (filterable by patient_status, payer_policy_id, current_device_enrollment_id, current_rental_contract_id)"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: ["patient_status?", "payer_policy_id?", "current_device_enrollment_id?", "current_rental_contract_id?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/sleep-therapy/patients/{id}"
    description: "Get patient detail (includes computed adherence_percentage, is_compliance_current, outstanding_balance_cents)"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: POST
    path: "/sleep-therapy/patients/{id}/initiate-discontinuation"
    description: "Initiate therapy discontinuation; opens RetrievalCase if rental"
    roles: [RespiratoryTherapist]
    code: 200
    input: [reason_code]
    output: Patient
    side_effects:
      - "patient_status ACTIVE_THERAPY|NON_COMPLIANT_HOLD -> DISCONTINUING"
      - "ComponentSupplyPlans -> SUSPENDED_DISCONTINUATION"
      - "RetrievalCase created if rental contract active"

  # --- Device Enrollments ---
  - method: POST
    path: "/sleep-therapy/device-enrollments"
    description: "Enroll a device for a patient"
    roles: [IntakeCoordinator]
    code: 201
    input: [patient_id, device_serial, device_model, acquisition_type]
    output: DeviceEnrollment
    side_effects: ["enrollment_status=PENDING_SETUP"]

  - method: GET
    path: "/sleep-therapy/device-enrollments"
    description: "List device enrollments (filterable by patient_id, enrollment_status)"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: ["patient_id?", "enrollment_status?", "limit?", "offset?"]
    output: "DeviceEnrollment[]"
    side_effects: []

  - method: GET
    path: "/sleep-therapy/device-enrollments/{id}"
    description: "Get device enrollment"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: []
    output: DeviceEnrollment
    side_effects: []

  - method: POST
    path: "/sleep-therapy/device-enrollments/{id}/begin-setup"
    description: "Begin machine setup (PENDING_SETUP -> SETUP_IN_PROGRESS)"
    roles: [RespiratoryTherapist]
    code: 200
    input: []
    output: DeviceEnrollment
    side_effects: []

  - method: POST
    path: "/sleep-therapy/device-enrollments/{id}/complete-setup"
    description: "Complete machine setup/education; cascades Patient->ACTIVE_THERAPY, creates ComponentSupplyPlans and RentalContract (if RENTAL)"
    roles: [RespiratoryTherapist]
    code: 200
    input: []
    output: DeviceEnrollment
    side_effects:
      - "enrollment_status -> ACTIVE; setup_completed_on=today"
      - "Patient INTAKE -> ACTIVE_THERAPY"
      - "4 ComponentSupplyPlan rows created"
      - "RentalContract created if acquisition_type=RENTAL"

  - method: POST
    path: "/sleep-therapy/device-enrollments/{id}/return-to-payer"
    description: "Return a retrieved rental device to the payer"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: DeviceEnrollment
    side_effects: ["enrollment_status RETRIEVED -> RETURNED_TO_PAYER"]

  # --- Component Supply Plans ---
  - method: GET
    path: "/sleep-therapy/component-supply-plans"
    description: "List supply plans (filterable by patient_id, component_type, plan_status)"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: ["patient_id?", "component_type?", "plan_status?", "limit?", "offset?"]
    output: "ComponentSupplyPlan[]"
    side_effects: []

  - method: GET
    path: "/sleep-therapy/component-supply-plans/{id}"
    description: "Get a supply plan"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: []
    output: ComponentSupplyPlan
    side_effects: []

  # --- Resupply Orders ---
  - method: POST
    path: "/sleep-therapy/resupply-orders"
    description: "Create a resupply order (PENDING_CLINICAL_CLEARANCE)"
    roles: [IntakeCoordinator]
    code: 201
    input: [patient_id, component_supply_plan_id, requested_quantity, expected_patient_version]
    output: ResupplyOrder
    side_effects: ["auth_status=PENDING_CLINICAL_CLEARANCE; fulfillment_status=NOT_READY"]

  - method: GET
    path: "/sleep-therapy/resupply-orders"
    description: "List resupply orders (filterable by patient_id, component_supply_plan_id, auth_status, fulfillment_status)"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: ["patient_id?", "component_supply_plan_id?", "auth_status?", "fulfillment_status?", "limit?", "offset?"]
    output: "ResupplyOrder[]"
    side_effects: []

  - method: GET
    path: "/sleep-therapy/resupply-orders/{id}"
    description: "Get resupply order"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: []
    output: ResupplyOrder
    side_effects: []

  - method: POST
    path: "/sleep-therapy/resupply-orders/{id}/clinical-clear"
    description: "RespiratoryTherapist clears order clinically"
    roles: [RespiratoryTherapist]
    code: 200
    input: []
    output: ResupplyOrder
    side_effects: ["auth_status PENDING_CLINICAL_CLEARANCE -> PENDING_PAYER_AUTH"]

  - method: POST
    path: "/sleep-therapy/resupply-orders/{id}/authorize"
    description: "BillingSpecialist authorizes order; OCC on Patient.version"
    roles: [BillingSpecialist]
    code: 200
    input: [expected_patient_version]
    output: ResupplyOrder
    side_effects:
      - "auth_status -> AUTHORIZED; fulfillment_status -> READY_TO_SHIP"
      - "unit_allowable_cents snapshot"
      - "increments Patient.version by 1"

  - method: POST
    path: "/sleep-therapy/resupply-orders/{id}/deny"
    description: "BillingSpecialist denies order"
    roles: [BillingSpecialist]
    code: 200
    input: [denial_reason_code]
    output: ResupplyOrder
    side_effects: ["auth_status -> DENIED", "increments Patient.version by 1"]

  - method: POST
    path: "/sleep-therapy/resupply-orders/{id}/ship"
    description: "Ship an authorized order; OCC on Patient.version"
    roles: [IntakeCoordinator]
    code: 200
    input: [expected_patient_version]
    output: ResupplyOrder
    side_effects:
      - "fulfillment_status -> SHIPPED; shipped_on=today"
      - "ComponentSupplyPlan.last_dispensed_on=today; next_eligible_on recomputed"
      - "increments Patient.version by 1"

  - method: POST
    path: "/sleep-therapy/resupply-orders/{id}/mark-delivered"
    description: "Mark order delivered"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: ResupplyOrder
    side_effects: ["fulfillment_status -> DELIVERED"]

  - method: POST
    path: "/sleep-therapy/resupply-orders/{id}/invoice"
    description: "Invoice a delivered order; computes patient_responsibility_cents"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: ResupplyOrder
    side_effects:
      - "fulfillment_status -> INVOICED"
      - "patient_responsibility_cents computed via patient_coinsurance_share"
      - "Patient.outstanding_balance_cents += patient_responsibility_cents"

  - method: POST
    path: "/sleep-therapy/resupply-orders/{id}/mark-returned"
    description: "Mark a delivered order as returned (no invoice)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: ResupplyOrder
    side_effects: ["fulfillment_status DELIVERED -> RETURNED"]

  - method: POST
    path: "/sleep-therapy/resupply-orders/{id}/cancel"
    description: "Cancel a pre-authorization order"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: ResupplyOrder
    side_effects: ["auth_status -> CANCELLED (from PENDING_CLINICAL_CLEARANCE|PENDING_PAYER_AUTH)"]

  # --- Adherence Reports ---
  - method: POST
    path: "/sleep-therapy/adherence-reports"
    description: "Ingest an adherence data download"
    roles: [RespiratoryTherapist]
    code: 201
    input: [patient_id, device_enrollment_id, window_end_on, nights_reported, compliant_nights]
    output: AdherenceReport
    side_effects:
      - "report_status=RECEIVED"
      - "window_start_on computed"
      - "adherence_pct_provisional computed"

  - method: GET
    path: "/sleep-therapy/adherence-reports"
    description: "List adherence reports (filterable by patient_id, device_enrollment_id, report_status)"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: ["patient_id?", "device_enrollment_id?", "report_status?", "limit?", "offset?"]
    output: "AdherenceReport[]"
    side_effects: []

  - method: GET
    path: "/sleep-therapy/adherence-reports/{id}"
    description: "Get adherence report"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: []
    output: AdherenceReport
    side_effects: []

  - method: POST
    path: "/sleep-therapy/adherence-reports/{id}/begin-review"
    description: "Begin clinician review"
    roles: [RespiratoryTherapist]
    code: 200
    input: []
    output: AdherenceReport
    side_effects: ["report_status RECEIVED -> UNDER_REVIEW"]

  - method: POST
    path: "/sleep-therapy/adherence-reports/{id}/finalize"
    description: "Finalize report; drives Patient compliance status + cascades"
    roles: [RespiratoryTherapist]
    code: 200
    input: []
    output: AdherenceReport
    side_effects:
      - "report_status -> FINALIZED; reviewed_by_user_id set"
      - "adherence_pct_final computed"
      - "Patient.adherence_percentage, is_compliance_current updated"
      - "Cascades: Patient status hold/resume; plan suspend/resume; rental pause/resume"

  - method: POST
    path: "/sleep-therapy/adherence-reports/{id}/reject"
    description: "Reject report (no Patient update)"
    roles: [RespiratoryTherapist]
    code: 200
    input: []
    output: AdherenceReport
    side_effects: ["report_status -> REJECTED"]

  # --- Mask Exchanges ---
  - method: POST
    path: "/sleep-therapy/mask-exchanges"
    description: "Request a mask fit exchange"
    roles: [IntakeCoordinator]
    code: 201
    input: [patient_id, device_enrollment_id, original_mask_plan_id, reason_code]
    output: MaskExchange
    side_effects: ["exchange_status=REQUESTED; window_anchor_on computed"]

  - method: GET
    path: "/sleep-therapy/mask-exchanges"
    description: "List mask exchanges (filterable by patient_id, device_enrollment_id, original_mask_plan_id, superseded_by_exchange_id, exchange_status)"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: ["patient_id?", "device_enrollment_id?", "original_mask_plan_id?", "superseded_by_exchange_id?", "exchange_status?", "limit?", "offset?"]
    output: "MaskExchange[]"
    side_effects: []

  - method: GET
    path: "/sleep-therapy/mask-exchanges/{id}"
    description: "Get mask exchange"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: []
    output: MaskExchange
    side_effects: []

  - method: POST
    path: "/sleep-therapy/mask-exchanges/{id}/approve"
    description: "RespiratoryTherapist approves exchange (window + count checks)"
    roles: [RespiratoryTherapist]
    code: 200
    input: []
    output: MaskExchange
    side_effects: ["exchange_status -> APPROVED"]

  - method: POST
    path: "/sleep-therapy/mask-exchanges/{id}/ship"
    description: "Ship exchange replacement"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: MaskExchange
    side_effects: ["exchange_status APPROVED -> SHIPPED"]

  - method: POST
    path: "/sleep-therapy/mask-exchanges/{id}/complete"
    description: "Complete exchange; resets mask supply clock, supersedes prior exchanges"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: MaskExchange
    side_effects:
      - "exchange_status -> COMPLETED; completed_on=today"
      - "MASK ComponentSupplyPlan.last_dispensed_on=today; next_eligible_on recomputed"
      - "prior exchanges superseded via superseded_by_exchange_id"

  - method: POST
    path: "/sleep-therapy/mask-exchanges/{id}/deny"
    description: "Deny exchange"
    roles: [RespiratoryTherapist]
    code: 200
    input: []
    output: MaskExchange
    side_effects: ["exchange_status REQUESTED -> DENIED"]

  - method: POST
    path: "/sleep-therapy/mask-exchanges/{id}/cancel"
    description: "Cancel a REQUESTED or APPROVED exchange"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: MaskExchange
    side_effects: ["exchange_status -> CANCELLED"]

  # --- Rental Contracts ---
  - method: GET
    path: "/sleep-therapy/rental-contracts"
    description: "List rental contracts (filterable by patient_id, device_enrollment_id, payer_policy_id, billing_status, equipment_status)"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: ["patient_id?", "device_enrollment_id?", "payer_policy_id?", "billing_status?", "equipment_status?", "limit?", "offset?"]
    output: "RentalContract[]"
    side_effects: []

  - method: GET
    path: "/sleep-therapy/rental-contracts/{id}"
    description: "Get rental contract"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: []
    output: RentalContract
    side_effects: []

  - method: POST
    path: "/sleep-therapy/rental-contracts/{id}/bill-rental-month"
    description: "Bill one rental month; auto-converts at rental_months_to_own"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: RentalContract
    side_effects:
      - "rental_months_billed += 1"
      - "if rental_months_billed == payer.rental_months_to_own: billing_status -> CONVERTED_TO_OWNERSHIP; equipment_status -> OWNERSHIP_TRANSFERRED"

  # --- Retrieval Cases ---
  - method: GET
    path: "/sleep-therapy/retrieval-cases"
    description: "List retrieval cases (filterable by patient_id, device_enrollment_id, rental_contract_id, retrieval_status)"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: ["patient_id?", "device_enrollment_id?", "rental_contract_id?", "retrieval_status?", "limit?", "offset?"]
    output: "RetrievalCase[]"
    side_effects: []

  - method: GET
    path: "/sleep-therapy/retrieval-cases/{id}"
    description: "Get retrieval case"
    roles: [OpsAdmin, IntakeCoordinator, RespiratoryTherapist, BillingSpecialist]
    code: 200
    input: []
    output: RetrievalCase
    side_effects: []

  - method: POST
    path: "/sleep-therapy/retrieval-cases/{id}/schedule-pickup"
    description: "Schedule pickup"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: RetrievalCase
    side_effects: ["retrieval_status OPEN -> SCHEDULED"]

  - method: POST
    path: "/sleep-therapy/retrieval-cases/{id}/mark-picked-up"
    description: "Mark picked up"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: RetrievalCase
    side_effects: ["retrieval_status SCHEDULED -> IN_TRANSIT"]

  - method: POST
    path: "/sleep-therapy/retrieval-cases/{id}/mark-received"
    description: "Mark equipment received; cascades DeviceEnrollment + RentalContract"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: RetrievalCase
    side_effects:
      - "retrieval_status IN_TRANSIT -> RECEIVED"
      - "DeviceEnrollment -> RETRIEVED"
      - "RentalContract.equipment_status -> RETRIEVED"

  - method: POST
    path: "/sleep-therapy/retrieval-cases/{id}/reconcile"
    description: "Reconcile received case; cascades Patient DISCONTINUING->DISCONTINUED"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: RetrievalCase
    side_effects:
      - "retrieval_status RECEIVED -> RECONCILED"
      - "Patient DISCONTINUING -> DISCONTINUED"

  - method: POST
    path: "/sleep-therapy/retrieval-cases/{id}/close-unrecoverable"
    description: "Close unrecoverable (only after due_on)"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: RetrievalCase
    side_effects:
      - "retrieval_status -> CLOSED_UNRECOVERABLE"
      - "Patient DISCONTINUING -> DISCONTINUED"
      - "DeviceEnrollment -> DECOMMISSIONED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint" }

  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-parameter resource does not exist" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body-referenced FK id does not resolve" }

  # --- Patient state ---
  - { id: ERR_PATIENT_NOT_IN_INTAKE, http: 409, condition: "Patient not in INTAKE for setup operations" }
  - { id: ERR_PATIENT_NOT_IN_ACTIVE_THERAPY, http: 409, condition: "Patient not in ACTIVE_THERAPY for resupply order creation" }
  - { id: ERR_PATIENT_NOT_DISCONTINUABLE, http: 409, condition: "Patient not in ACTIVE_THERAPY or NON_COMPLIANT_HOLD for discontinuation" }

  # --- Plan state ---
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "ComponentSupplyPlan not ACTIVE for resupply" }

  # --- Resupply order state ---
  - { id: ERR_QUANTITY_MISMATCH, http: 422, condition: "requested_quantity != ComponentSupplyPlan.quantity_per_cycle" }
  - { id: ERR_CADENCE_NOT_MET, http: 409, condition: "current_date < plan.next_eligible_on" }
  - { id: ERR_PRIOR_AUTH_REQUIRED, http: 422, condition: "Payer requires prior-auth reference, none supplied" }
  - { id: ERR_ORDER_NOT_PENDING_CLINICAL, http: 409, condition: "auth_status != PENDING_CLINICAL_CLEARANCE for clinical-clear" }
  - { id: ERR_COMPLIANCE_NOT_CURRENT, http: 422, condition: "Patient compliance not current (and not first-fill grace)" }
  - { id: ERR_ORDER_NOT_PENDING_AUTH, http: 409, condition: "auth_status != PENDING_PAYER_AUTH for authorize" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Authorizer X-User-ID equals clinical_cleared_by_user_id" }
  - { id: ERR_STALE_PATIENT_VERSION, http: 412, condition: "expected_patient_version != Patient.version (OCC)" }
  - { id: ERR_ORDER_NOT_READY_TO_SHIP, http: 409, condition: "auth_status != AUTHORIZED or fulfillment_status != READY_TO_SHIP for ship" }
  - { id: ERR_ORDER_NOT_SHIPPED, http: 409, condition: "fulfillment_status != SHIPPED for mark-delivered" }
  - { id: ERR_ORDER_NOT_DELIVERED, http: 409, condition: "fulfillment_status != DELIVERED for invoice" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Order not in cancellable (auth_status pre-ship) state" }
  - { id: ERR_ORDER_NOT_AUTHORIZED, http: 409, condition: "auth_status != AUTHORIZED" }

  # --- Adherence report ---
  - { id: ERR_REPORT_NOT_RECEIVED, http: 409, condition: "report_status != RECEIVED for begin-review" }
  - { id: ERR_REPORT_NOT_UNDER_REVIEW, http: 409, condition: "report_status != UNDER_REVIEW for finalize/reject" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "window arithmetic inconsistent with payer.compliance_window_days" }

  # --- Mask exchange ---
  - { id: ERR_EXCHANGE_NOT_REQUESTED, http: 409, condition: "exchange_status != REQUESTED for approve/deny" }
  - { id: ERR_EXCHANGE_WINDOW_EXPIRED, http: 409, condition: "current_date > window_anchor_on + payer.mask_exchange_window_days" }
  - { id: ERR_EXCHANGE_LIMIT_REACHED, http: 409, condition: "completed exchanges in window >= payer.max_exchanges_per_window" }
  - { id: ERR_EXCHANGE_NOT_APPROVED, http: 409, condition: "exchange_status != APPROVED for ship" }
  - { id: ERR_EXCHANGE_NOT_SHIPPED, http: 409, condition: "exchange_status != SHIPPED for complete" }

  # --- Rental ---
  - { id: ERR_RENTAL_NOT_BILLING, http: 409, condition: "billing_status != BILLING for bill-rental-month" }
  - { id: ERR_RENTAL_PERIOD_NOT_DUE, http: 409, condition: "current_date before next monthly anniversary" }
  - { id: ERR_RENTAL_ALREADY_CONVERTED, http: 409, condition: "rental_months_billed >= rental_months_to_own" }
  - { id: ERR_RENTAL_NOT_IN_RETRIEVAL, http: 409, condition: "RentalContract.equipment_status != RETRIEVED for return-to-payer" }

  # --- Device enrollment ---
  - { id: ERR_ENROLLMENT_NOT_PENDING_SETUP, http: 409, condition: "enrollment_status != PENDING_SETUP for begin-setup" }
  - { id: ERR_ENROLLMENT_NOT_READY_FOR_SETUP, http: 409, condition: "enrollment_status != SETUP_IN_PROGRESS for complete-setup" }
  - { id: ERR_ENROLLMENT_NOT_RETRIEVED, http: 409, condition: "enrollment_status != RETRIEVED for return-to-payer" }

  # --- Retrieval ---
  - { id: ERR_RETRIEVAL_NOT_OPEN, http: 409, condition: "retrieval_status != OPEN for schedule-pickup" }
  - { id: ERR_RETRIEVAL_NOT_SCHEDULED, http: 409, condition: "retrieval_status != SCHEDULED for mark-picked-up" }
  - { id: ERR_RETRIEVAL_NOT_IN_TRANSIT, http: 409, condition: "retrieval_status != IN_TRANSIT for mark-received" }
  - { id: ERR_RETRIEVAL_NOT_RECEIVED, http: 409, condition: "retrieval_status != RECEIVED for reconcile" }
  - { id: ERR_RETRIEVAL_NOT_CLOSABLE, http: 409, condition: "retrieval_status not in {OPEN, SCHEDULED, IN_TRANSIT} for close-unrecoverable" }
  - { id: ERR_RETRIEVAL_NOT_OVERDUE, http: 409, condition: "current_date <= due_on for close-unrecoverable" }
  - { id: ERR_RETRIEVAL_INVALID_STATE, http: 409, condition: "Generic retrieval state violation" }

  # --- Request ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request body, missing required field, invalid enum" }
  - { id: ERR_PAYER_POLICY_NOT_FOUND, http: 404, condition: "Payer policy referenced by patient does not exist" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Platform operator; manages payer policies and drives ops sweeps and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /sleep-therapy/payer-policies"
      - "POST /sleep-therapy/_clock/set_current_utc"
      - "POST /sleep-therapy/_ops/run-daily-sweep"
    shared_operations:
      - "GET reads across all resources"

  - name: IntakeCoordinator
    description: "Front-desk intake; creates patients, device enrollments, resupply orders, mask exchanges, drives shipment and retrieval logistics"
    identity: opaque
    exclusive_operations:
      - "POST /sleep-therapy/patients"
      - "POST /sleep-therapy/device-enrollments"
      - "POST /sleep-therapy/device-enrollments/{id}/return-to-payer"
      - "POST /sleep-therapy/resupply-orders"
      - "POST /sleep-therapy/resupply-orders/{id}/ship"
      - "POST /sleep-therapy/resupply-orders/{id}/mark-delivered"
      - "POST /sleep-therapy/resupply-orders/{id}/mark-returned"
      - "POST /sleep-therapy/resupply-orders/{id}/cancel"
      - "POST /sleep-therapy/mask-exchanges"
      - "POST /sleep-therapy/mask-exchanges/{id}/ship"
      - "POST /sleep-therapy/mask-exchanges/{id}/complete"
      - "POST /sleep-therapy/mask-exchanges/{id}/cancel"
      - "POST /sleep-therapy/retrieval-cases/{id}/schedule-pickup"
      - "POST /sleep-therapy/retrieval-cases/{id}/mark-picked-up"
      - "POST /sleep-therapy/retrieval-cases/{id}/mark-received"
      - "POST /sleep-therapy/retrieval-cases/{id}/reconcile"
      - "POST /sleep-therapy/retrieval-cases/{id}/close-unrecoverable"
    shared_operations:
      - "GET reads across all resources"

  - name: RespiratoryTherapist
    description: "Clinical role; performs machine setup/education, reviews adherence, clinically clears orders, approves mask exchanges, initiates discontinuation. Segregated from fiscal authorization."
    identity: opaque
    exclusive_operations:
      - "POST /sleep-therapy/device-enrollments/{id}/begin-setup"
      - "POST /sleep-therapy/device-enrollments/{id}/complete-setup"
      - "POST /sleep-therapy/patients/{id}/initiate-discontinuation"
      - "POST /sleep-therapy/resupply-orders/{id}/clinical-clear"
      - "POST /sleep-therapy/adherence-reports"
      - "POST /sleep-therapy/adherence-reports/{id}/begin-review"
      - "POST /sleep-therapy/adherence-reports/{id}/finalize"
      - "POST /sleep-therapy/adherence-reports/{id}/reject"
      - "POST /sleep-therapy/mask-exchanges/{id}/approve"
      - "POST /sleep-therapy/mask-exchanges/{id}/deny"
    shared_operations:
      - "GET reads across all resources"

  - name: BillingSpecialist
    description: "Fiscal role; authorizes resupply orders, invoices delivered orders, bills rental months. Segregated from clinical clearance."
    identity: opaque
    exclusive_operations:
      - "POST /sleep-therapy/resupply-orders/{id}/authorize"
      - "POST /sleep-therapy/resupply-orders/{id}/deny"
      - "POST /sleep-therapy/resupply-orders/{id}/invoice"
      - "POST /sleep-therapy/rental-contracts/{id}/bill-rental-month"
    shared_operations:
      - "GET reads across all resources"
