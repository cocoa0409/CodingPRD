      - name: indirect_rate_tier_boundaries_at_five_million_and_twenty_million
        claim_type: tiered_pricing
        grounds:
          - calculations.grant_obligation_rollup
          - entities.GrantAward.fields.indirect_rate
          - entities.GrantAward.fields.indirect_pool_cents
          - entities.GrantAward.fields.obligated_cents
        distinguishing_aspect: |
          Both declared tier ceilings are probed from immediately below and from exactly on, using
          PROFESSIONAL_DEVELOPMENT lines whose federal share is 1.0 so approved_cents equals gross_cents and the direct
          total is fully controlled. The 5000000 ceiling is exclusive, so one extra cent of direct spend moves the rate
          from 0.0812 to 0.065 and the total obligation actually FALLS from 5405999 to 5325000 — a marginal-rate
          implementation, which would leave the first 4999999 at 0.0812 and only tax the increment, cannot reproduce
          that drop.
