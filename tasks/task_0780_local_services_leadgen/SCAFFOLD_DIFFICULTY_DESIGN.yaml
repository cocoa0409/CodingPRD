  - rule_id: priority_pair_validation_conflict
    instances:
      - name: refund_state_beats_temporal_window
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "On POST /leads/{id}/refund-request a lead already REFUNDED (state, prio 5) AND past the refund window (business_temporal, prio 9) returns ERR_INVALID_STATE — state outranks temporal (pair state vs business_temporal)."
        test_recipe:
          setup:
            - "Lead refunded once within the window; clock then advanced past distributed_at+24h so a second refund also violates the window."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
