            - "ServiceCase.${case}.assessment_basis == 'SHORTFALL_SEVERITY' and credit_cents == 7680   # round(102400 x min(3.00/100 x 2.5, 0.6))"
            - "ServiceCase.${case}.response_deadline_at == '2027-02-05T17:00:00.000Z' (GOLD 8h x MAJOR 1.0) and response_breached == false"
            - "ServiceCase.${case}.denial_reason is null and replacement_module_id is null   # the swap happens at fulfil, not at approval"
            - "GET /service-cases?resolved_faulty_module_id=${m1} returns the case; GET /service-cases?resolved_faulty_module_id=${m2} returns an empty page"

      - name: warranty_credit_variants_diverge_on_the_same_claim
        claim_type: variant_divergence
        grounds:
          - calculations.case_warranty_credit_cents
          - endpoints[POST /service-cases/{service_case_id}/assess]
        excluded_because:
          difficulty_instance: warranty_credit_pro_rata_vs_shortfall_severity_diverge
          rationale: |
            That §1.8 instance runs one identical claim through both
            PRO_RATA_REMAINING_TERM and SHORTFALL_SEVERITY and pins the two credit
            figures plus their delta against the same cabinet value and the same
            elapsed month count. A §1.9 duplicate would re-derive the identical
            pair of formulas with nothing new to isolate.

      - name: warranty_basis_is_chosen_by_the_assessing_call
        claim_type: variant_selection
        grounds:
          - calculations.case_warranty_credit_cents
          - endpoints[POST /service-cases/{service_case_id}/assess]
        excluded_because:
          difficulty_instance: warranty_credit_pro_rata_vs_shortfall_severity_diverge
          rationale: |
            Variant selection here is entirely a function of the assessment_basis
            argument on POST /service-cases/{id}/assess, and that §1.8 instance
            already sends both values and shows the stored assessment_basis and
            credit_cents following the request rather than a default.

      - name: uniformity_baseline_freeze_and_delta_after_a_swap
        claim_type: reconciliation
        grounds:
          - calculations.cabinet_uniformity_score
          - entities.Cabinet
        excluded_because:
          difficulty_instance: cabinet_uniformity_as_built_vs_qa_baseline_diverge
          rationale: |
            The AS_BUILT / QA_BASELINE pair is the reconciliation case in this
            scaffold: that §1.8 instance freezes baseline_module_ids at QA, swaps a
            module, and asserts that as_built moves while the baseline holds, plus
            the resulting delta. Repeating it here would re-run the same frozen-set
            arithmetic.

  - section: validations
    instances:
      - name: request_shape_is_checked_before_anything_resolves
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors.ERR_VALIDATION_FAILED
        distinguishing_aspect: |
          Priority 3 is a single rule with five distinct surfaces — unknown enum
          member, inverted time window, over-large limit, negative offset, missing
          required field — and all five must answer 400 ERR_VALIDATION_FAILED
          rather than a domain-specific code. Because the rule sits ABOVE every
          existence check, a malformed window still returns 400 even when the
          project_id and crew id in the same body are pure invention.
        test_recipe:
          setup:
            - "One FP10-IN DisplayModel exists; no project, crew or cabinet is needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Bad Enum Wall", install_environment: "AIRPORT", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /projects"
              payload: { install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err_missing: $.data.error_id }
            - call: "POST /commissioning-visits"
              payload: { project_id: "00000000-0000-4000-8000-000000000000", commissioning_crew_id: "00000000-0000-4000-8000-000000000001", window_start: "2026-08-05T08:00:00.000Z", window_end: "2026-08-05T08:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { err_window: $.data.error_id }
            - call: "GET /modules?limit=101"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { err_limit: $.data.error_id }
            - call: "GET /modules?offset=-1"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { err_offset: $.data.error_id }
          assert:
            - "trigger call 1 -> 400 with ${err_enum} == 'ERR_VALIDATION_FAILED'   # AIRPORT is not an install_environment"
            - "trigger call 2 -> 400 with ${err_missing} == 'ERR_VALIDATION_FAILED'   # customer_name omitted"
            - "trigger call 3 -> 400 with ${err_window} == 'ERR_VALIDATION_FAILED'   # window_end == window_start, and NOT ERR_PROJECT_NOT_FOUND / ERR_REFERENCE_NOT_FOUND"
            - "trigger call 4 -> 400 with ${err_limit} == 'ERR_VALIDATION_FAILED'   # limit above 100"
            - "trigger call 5 -> 400 with ${err_offset} == 'ERR_VALIDATION_FAILED'   # negative offset"
            - "no DisplayProject and no CommissioningVisit was created by any of the five calls"

      - name: viewing_distance_below_the_pitch_derived_minimum_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=29]
          - errors.ERR_VIEWING_DISTANCE_TOO_SHORT
          - entities.DisplayModel.fields.recommended_min_viewing_distance_m
        distinguishing_aspect: |
          The minimum is not a project input: it is derived from the model's pixel
          pitch (2.5 mm -> 2.5 m) and compared at ONE decimal with >=, so 2.4 m is
          rejected while 2.5 m passes. An implementation that reads a hard-coded
          floor, or that compares the raw pitch in millimetres against metres,
          cannot separate these two requests.
        test_recipe:
          setup:
            - "One FP25-OUT DisplayModel (pixel_pitch_mm 2.5 -> recommended_min_viewing_distance_m 2.5)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
