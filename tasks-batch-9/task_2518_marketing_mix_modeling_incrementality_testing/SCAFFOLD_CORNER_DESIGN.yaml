      - name: calibration_multiplier_out_of_range_rejected
        claim_type: violation_to_error
        grounds:
          - "errors ERR_CALIBRATION_MULTIPLIER_OUT_OF_RANGE (422) - validations priority 64, check the raw quotient lies inside [CALIBRATION_MULTIPLIER_FLOOR, CALIBRATION_MULTIPLIER_CEILING] = [0.25, 4.00]"
          - "calculations.calibration_multiplier formula - if the raw quotient is outside the clamp range the record is NOT created"
          - "calculations.calibration_multiplier input_set - one Experiment with status IN {READ_OUT, ACCEPTED}, so no accept is needed to file a record"
        distinguishing_aspect: |
          The clamp is a rejection, not a saturation: an experiment measuring only 1.00 percent lift
          against a model-implied 18.8835 gives a raw quotient of 0.052957, which is below the 0.25 floor,
          so no CalibrationRecord is written, the run stays at calibration_status NOT_REQUIRED and its
          version does not move - an implementation that clamps to 0.25 and files the record instead
          silently corrupts every downstream calibrated contribution.
          
        test_recipe:
          setup:
            - "Fixture F1 published: A_SEARCH contribution_units 3653.3333 of modeled_sales_units 23000, giving model_implied_lift_pct 18.8835."
            - "Experiment E1 on A_SEARCH is AUDIENCE_SPLIT / DIFF_IN_DIFF with arms 245000/245000 and was read out with treatment_conversions 4704, control_conversions 4900, pre_treatment_conversions 4655 and pre_control_conversions 4900, so measured_lift_pct is 100 * (4704 - 4655) / 4900 = 1.00."
            - "The experiment is left in READ_OUT and is never accepted - the input_set admits READ_OUT, and its interval [-2.88, 4.88] would fail the accept gate anyway."
            - "1.00 / 18.8835 = 0.052957, which is below CALIBRATION_MULTIPLIER_FLOOR 0.25."
            - "The run version is captured before the trigger so the OCC token is current and the priority-30 check cannot mask the priority-64 one."
