          - errors.ERR_LINE_HEADCOUNT_EXCEEDED
        distinguishing_aspect: |
          A different category pair from the state-versus-safety instance: business_safety (priority 23)
          versus business_fiscal (priority 38). A single-chute plan staffed with 30 core associates
          blows the 22-per-line ergonomic cap AND its 1000-cent budget (planned_labor_cents 516000), and
