  # ===================================================================
  # Rule 4 — transitive_cascade (depth >=3 and >=2, different triggers)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: certify_freeze_cascade_depth4
        grounds:
          - state_machines.ValuationRun.transitions.COMPUTED_to_CERTIFIED
          - calculations.benefit_restriction_posture
          - calculations.minimum_required_contribution
          - entities.ParticipantAccrual.fields.frozen
        distinguishing_aspect: |
          Depth-4 chain triggered by certify: (1) certify -> Plan posture
          recomputed ACCRUAL_FROZEN (AFTAP 59.99); (2) posture -> this run's
          ParticipantAccrual.frozen set true; (3) freeze -> ContributionDemand
          normal-cost component zeroed (tentative 6875.39 -> 6137.29);
          (4) recompute -> outstanding_amount and status re-evaluated. Each hop
