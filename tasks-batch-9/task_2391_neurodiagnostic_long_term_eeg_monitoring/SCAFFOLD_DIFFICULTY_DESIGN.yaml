        grounds:
          - state_machines.ExportPackage.BUILT_to_REVOKED
          - calculations.export_package_gb
          - calculations.unit_storage_pressure
          - entities.MonitoringUnit.fields.storage_used_gb
          - entities.ExportPackage.fields.package_gb
        distinguishing_aspect: "Conserved quantity: unit storage GB. Building allocates 36.00 GB on top of the study's own 90.00 GB and revoking must return storage_used_gb to exactly 90.00 and storage_pressure_pct to 18.00 with no rounding drift, while package_gb is retained as the historical allocation record."
        test_recipe:
          setup:
            - "Unit storage_quota_gb 500.00; admission admitted 2026-08-02T00:00:00Z; 25-channel INPATIENT_VEEG study completed 2026-08-04T12:00:00Z -> stored_gb 90.00, storage_used_gb 90.00, storage_pressure_pct 18.00."
            - "Report issued prelim by epi-1 and final by epi-2, unblocking export creation."
            - "ExportPackage created with include_video false and built -> package_gb round_half_up(90.00 / 2.5, 2) == 36.00, storage_used_gb 126.00, storage_pressure_pct 25.20."
          setup_api_calls:
            - call: "POST /neurodiagnostics/units"
              payload: { name: "EMU A", bed_count: 2, storage_quota_gb: 500.00 }
              as: UnitCoordinator
              captures: { unit_id: $.data.id }
