              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${p7_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${m7_id}"
              payload: {}
              as: MinePlanner
              captures: { m7_v: $.data.version }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m7_id}", panel_id: "${p7_id}", planned_tons: 7000, hoist_window_start: "2026-08-11T00:00:00Z", hoist_window_end: "2026-08-11T08:00:00Z", expected_mine_version: "${m7_v}" }
              as: MinePlanner
              captures: { r7_id: $.data.id }
            - call: "POST /salt/production-runs/${r7_id}/hoist"
              payload: { hoisted_tons: 7000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Depot A", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
              captures: { d7a: $.data.id }
            - call: "POST /salt/depots"
              payload: { name: "Depot B", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
              captures: { d7b: $.data.id }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${r7_id}", depot_id: "${d7a}", product_line: "HIGHWAY_DEICING", screen_spec: "MEDIUM", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 1000, moisture_pct: 0.0, storage_kind: "COVERED" }
              as: QualityLab
