    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "status=VOIDED"
      - "territory.total_severe_incidents recomputed per §1.3 territory_total_severe_incidents, removing this report from the count"
      - "increments IncidentReport.version by 1"

