            - call: "POST /investors/${i1_id}/deposit"
              payload: { amount_cents: 5000000 }
              as: PlatformAdmin
            - call: "POST /investors"
              payload: { display_name: "Inv D2", max_single_loan_pct: 1 }
              as: PlatformAdmin
              captures: { i2_id: $.data.id }
            - call: "POST /investors/${i2_id}/deposit"
