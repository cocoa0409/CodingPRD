scaffold_corner_design:

  # ===========================================================================
  # SECTION: entities  (claim-extraction-guide Table 1)
  # Creation, retrieval, listing, not-found, required-field, default, computed,
  # system, type-constraint, immutability, and FK-integrity corners.
  # ===========================================================================
  - section: entities
    instances:
      - name: create_applicant_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - entities.Applicant.fields.full_legal_name
          - entities.Applicant.fields.date_of_birth
          - entities.Applicant.fields.email
          - endpoints["POST /applicants"]
        distinguishing_aspect: "POST /applicants with full_legal_name, date_of_birth, email returns 201 and a server-minted id, created_at, version==1, total_fees_paid_cents==0."
        test_recipe:
          setup:
            - "Empty DB; clock at a fixed date so is_minor is deterministic for an adult DOB."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Adjudicator
          trigger:
            - call: "POST /applicants"
              payload: { full_legal_name: "Casey Adult", date_of_birth: "1990-01-01", email: "casey@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id", v0: "$.data.version", paid0: "$.data.total_fees_paid_cents" }
          assert:
            - "response status == 201"
            - "Applicant.${appl_id}.full_legal_name == \"Casey Adult\""
            - "Applicant.${appl_id}.version == 1"
            - "Applicant.${appl_id}.total_fees_paid_cents == 0"
            - "Applicant.${appl_id}.is_minor == false"

      - name: get_application_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints["GET /applications/{id}"]
          - entities.Application.fields.status
        distinguishing_aspect: "GET /applications/{id} on a freshly created DRAFT application returns status DRAFT, name_change_status NONE, and the same applicant_id supplied at creation."
        test_recipe:
          setup:
            - "One DRAFT NEW BOOK application exists for an adult applicant."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Read Me", date_of_birth: "1990-01-01", email: "readme@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "GET /applications/${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { st: "$.data.status", nc: "$.data.name_change_status", aid: "$.data.applicant_id" }
          assert:
            - "response status == 200"
            - "Application.${app_id}.status == \"DRAFT\""
            - "Application.${app_id}.name_change_status == \"NONE\""
            - "Application.${app_id}.applicant_id == ${appl_id}"

      - name: list_applications_filter_by_status_paginated
        claim_type: Listing
        grounds:
          - endpoints["GET /applications"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /applications?status=DRAFT&limit=1 returns an array envelope with total_count and has_more reflecting two DRAFT applications for one applicant."
        test_recipe:
          setup:
            - "An applicant owns two DRAFT applications."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Lister", date_of_birth: "1990-01-01", email: "lister@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "CARD", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
          trigger:
            - call: "GET /applications?applicant_id=${appl_id}&status=DRAFT&limit=1&offset=0"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { total: "$.meta", has_more_flag: "$.data" }
          assert:
            - "response status == 200"
            - "response_type == \"array\""
            - "total_count == 2"
            - "has_more == true (limit 1 of 2)"
            - "len(data) == 1"

      - name: get_application_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints["GET /applications/{id}"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /applications/{random-uuid} for an id that was never created returns ERR_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "An authenticated applicant exists; the target application id does not."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "NF", date_of_birth: "1990-01-01", email: "nf@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
          trigger:
            - call: "GET /applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 404"
            - "data.error_id == \"ERR_NOT_FOUND\""

      - name: create_application_missing_required_application_type
        claim_type: Required Fields
        grounds:
          - entities.Application.fields.application_type
          - endpoints["POST /applications"]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /applications omitting the required application_type field returns ERR_INVALID_REQUEST (400); application_type has source input and no default."
        test_recipe:
          setup:
            - "An applicant exists."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Req", date_of_birth: "1990-01-01", email: "req@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 400"
            - "data.error_id == \"ERR_INVALID_REQUEST\""

      - name: create_application_default_service_level_routine
        claim_type: Defaults
        grounds:
          - entities.Application.fields.service_level
          - endpoints["POST /applications"]
        distinguishing_aspect: "POST /applications omitting service_level applies the declared default ROUTINE; name_change_requested defaults to false."
        test_recipe:
          setup:
            - "An applicant exists."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Def", date_of_birth: "1990-01-01", email: "def@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", sl: "$.data.service_level", ncr: "$.data.name_change_requested" }
          assert:
            - "response status == 201"
            - "Application.${app_id}.service_level == \"ROUTINE\""
            - "Application.${app_id}.name_change_requested == false"

      - name: applicant_is_minor_computed_true_under_16
        claim_type: Computed Fields
        grounds:
          - entities.Applicant.fields.is_minor
          - endpoints["POST /applicants"]
        distinguishing_aspect: "is_minor is computed strictly < 16 years before the current clock: a child born 2015-01-01 at clock 2026-06-01 is is_minor==true; any client-sent is_minor is ignored."
        test_recipe:
          setup:
            - "Clock set to 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Adjudicator
          trigger:
            - call: "POST /applicants"
              payload: { full_legal_name: "Kid", date_of_birth: "2015-01-01", email: "kid@x.com" }
              as: Applicant
              captures: { kid_id: "$.data.id", minor: "$.data.is_minor" }
          assert:
            - "response status == 201"
            - "Applicant.${kid_id}.is_minor == true"

      - name: applicant_is_minor_computed_false_exactly_16
        claim_type: Computed Fields
        grounds:
          - entities.Applicant.fields.is_minor
          - calculations.fee_assessment
        distinguishing_aspect: "Boundary: an applicant who has reached exactly the 16th birthday at the current clock (born 2010-06-01, clock 2026-06-01) is is_minor==false because the rule is strictly less than 16 years."
        test_recipe:
          setup:
            - "Clock set to 2026-06-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Adjudicator
          trigger:
            - call: "POST /applicants"
              payload: { full_legal_name: "Sixteen", date_of_birth: "2010-06-01", email: "sixteen@x.com" }
              as: Applicant
              captures: { teen_id: "$.data.id", minor: "$.data.is_minor" }
          assert:
            - "response status == 201"
            - "Applicant.${teen_id}.is_minor == false"

      - name: system_fields_id_and_version_server_minted_ignored_on_input
        claim_type: System Fields
        grounds:
          - entities.Applicant.common_fields
          - endpoints["POST /applicants"]
        distinguishing_aspect: "id, created_at, updated_at, version are server-generated: a client-supplied id/version in the POST body is ignored; the returned version is 1 and id is a fresh UUID."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /applicants"
              payload: { full_legal_name: "Sys", date_of_birth: "1990-01-01", email: "sys@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id", v: "$.data.version", ca: "$.data.created_at" }
          assert:
            - "response status == 201"
            - "Applicant.${appl_id}.version == 1"
            - "Applicant.${appl_id}.id is a non-empty UUID string with no type prefix"
            - "Applicant.${appl_id}.created_at is an ISO 8601 UTC timestamp"

      - name: create_application_invalid_enum_application_type
        claim_type: Type Constraints
        grounds:
          - entities.Application.fields.application_type
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /applications"]
        distinguishing_aspect: "POST /applications with application_type==\"PASSPORT\" (not in {NEW,RENEWAL,MINOR}) returns ERR_INVALID_REQUEST (400) on enum membership failure."
        test_recipe:
          setup:
            - "An applicant exists."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Enum", date_of_birth: "1990-01-01", email: "enum@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "PASSPORT", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 400"
            - "data.error_id == \"ERR_INVALID_REQUEST\""

      - name: photo_nonpositive_dimension_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Photo.fields.width_px
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /applications/{id}/photos"]
        distinguishing_aspect: "POST /applications/{id}/photos with width_px==0 violates the > 0 constraint and returns ERR_INVALID_REQUEST (400) (non-positive dimension), distinct from a photo_validation FAIL."
        test_recipe:
          setup:
            - "A DRAFT application exists."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Px", date_of_birth: "1990-01-01", email: "px@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 0, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 400"
            - "data.error_id == \"ERR_INVALID_REQUEST\""

      - name: photo_head_fraction_out_of_open_interval_validation_error
        claim_type: Type Constraints
        grounds:
          - entities.Photo.fields.head_height_fraction
          - errors[ERR_VALIDATION]
          - endpoints["POST /applications/{id}/photos"]
        distinguishing_aspect: "POST /applications/{id}/photos with head_height_fraction==1.5 is outside the declared open interval (0,1) and returns ERR_VALIDATION (422) for an out-of-range field value, distinct from a normal photo FAIL."
        test_recipe:
          setup:
            - "A DRAFT application exists."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Frac", date_of_birth: "1990-01-01", email: "frac@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 1.5, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "data.error_id == \"ERR_VALIDATION\""

      - name: photo_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Photo.common_fields
          - endpoints["POST /applications/{id}/photos"]
        distinguishing_aspect: "Photo has common_fields false: its creation response exposes id and created_at but no version field (and no updated_at); revalidate is the only mutation channel and is not an OCC write."
        test_recipe:
          setup:
            - "A DRAFT application exists."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Immut", date_of_birth: "1990-01-01", email: "immut@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { photo_id: "$.data.id", res: "$.data.validation_result" }
          assert:
            - "response status == 201"
            - "Photo.${photo_id} response has no \"version\" field"
            - "Photo.${photo_id}.validation_result == \"PASS\""

      - name: create_application_fk_applicant_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Application.fields.applicant_id
          - errors[ERR_FK_NOT_FOUND]
          - endpoints["POST /applications"]
          - validations[priority=4]
        distinguishing_aspect: "POST /applications whose applicant_id body FK references a non-existent Applicant returns ERR_FK_NOT_FOUND (422), distinct from a path-id ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "An authenticated applicant exists, but the applicant_id in the body is a never-created id."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Auth", date_of_birth: "1990-01-01", email: "auth@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "11111111-1111-4111-8111-111111111111", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "data.error_id == \"ERR_FK_NOT_FOUND\""

      - name: book_appointment_fk_counter_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Appointment.fields.counter_id
          - errors[ERR_FK_NOT_FOUND]
          - endpoints["POST /appointments"]
          - validations[priority=4]
        distinguishing_aspect: "POST /appointments with resource_kind URGENT_TRAVEL_COUNTER and a counter_id that was never created returns ERR_FK_NOT_FOUND (422) — a flat-topology FK-integrity corner on the polymorphic resource field."
        test_recipe:
          setup:
            - "An adult NEW BOOK application is SUBMITTED so it can carry an appointment; no urgent-travel counter with the referenced id exists."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "FkC", date_of_birth: "1990-01-01", email: "fkc@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_v1: "$.data.version" }
          trigger:
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", resource_kind: "URGENT_TRAVEL_COUNTER", counter_id: "22222222-2222-4222-8222-222222222222", start_utc: "2026-06-09T09:00:00Z", end_utc: "2026-06-09T09:30:00Z", expected_application_version: "${app_v1}" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "data.error_id == \"ERR_FK_NOT_FOUND\""

      - name: unique_email_duplicate_applicant_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Applicant.fields.email
          - endpoints["POST /applicants"]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Email is declared unique across Applicants (lowercase-normalized): registering a second applicant with the same email (or a case variant) is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup:
            - "One applicant already registered with email dup@x.com."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "First Dup", date_of_birth: "1990-01-01", email: "dup@x.com" }
              as: Applicant
              captures: { first_id: "$.data.id" }
          trigger:
            - call: "POST /applicants"
              payload: { full_legal_name: "Second Dup", date_of_birth: "1991-01-01", email: "DUP@x.com" }
              as: Applicant
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 422"
            - "data.error_id == \"ERR_VALIDATION\""

  # ===========================================================================
  # SECTION: state_machines  (claim-extraction-guide Table 2)
  # Valid transitions, invalid-from rejection, terminal lockdown, idempotency,
  # initial state, side-effect execution, guarded/cascade patterns.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: application_initial_state_is_draft
        claim_type: Initial State
        grounds:
          - state_machines.Application.initial_state
          - entities.Application.fields.status
        distinguishing_aspect: "A freshly created Application starts in status DRAFT (the declared initial_state) with name_change_status NONE."
        test_recipe:
          setup:
            - "An applicant exists."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Init", date_of_birth: "1990-01-01", email: "init@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", st: "$.data.status" }
          assert:
            - "Application.${app_id}.status == \"DRAFT\""

      - name: submit_from_draft_valid_transition_creates_fee_and_event
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - entities.FeeAssessment.fields.payment_status
          - entities.ApplicationStatusEvent.fields.to_status
        distinguishing_aspect: "DRAFT->SUBMITTED stamps submitted_at, creates an UNPAID FeeAssessment, appends a DRAFT->SUBMITTED ApplicationStatusEvent, and bumps Application.version from its pre-submit value to that value plus one."
        test_recipe:
          setup:
            - "Adult NEW BOOK application in DRAFT with a PASS photo and IDENTITY+CITIZENSHIP docs attached."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Submitter", date_of_birth: "1990-01-01", email: "sub@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
