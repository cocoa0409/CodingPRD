# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator; owns restaurant provisioning and the logical test clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /api/restaurants"
    shared_operations:
      - "All GET endpoints"
  - name: MenuAdmin
    description: "Corporate menu administrator; owns menu revisions, recipes, and prep item catalog"
    identity: opaque
    exclusive_operations:
      - "POST /api/menu-revisions and all /api/menu-revisions/{id}/* transitions"
      - "POST /api/recipes"
      - "POST /api/prep-items and /api/prep-items/{id}/retire"
    shared_operations:
      - "All GET endpoints"
  - name: KitchenManager
    description: "Restaurant kitchen manager; runs forecasts, prep lists, stations, pars approval, cooks, shifts, ticket voids and allergen clearance"
    identity: "entity_backed:Cook"
    exclusive_operations:
      - "POST /api/restaurants/{id}/update-waitlist"
      - "POST /api/stations"
      - "POST /api/station-pars, approve-adjustment, reject-adjustment"
      - "POST /api/cooks and /api/cooks/{id}/complete-retraining"
      - "POST /api/demand-forecasts and submit/finalize/amend"
      - "POST /api/prep-lists and generate/regenerate/lock"
      - "POST /api/prep-batches/{id}/expire"
      - "POST /api/shift-assignments and confirm/complete/cancel/mark-no-show"
      - "POST /api/service-tickets/{id}/void and clear-allergen-review"
    shared_operations:
      - "POST /api/prep-batches (shared with PrepCook)"
      - "POST /api/station-pars/{id}/propose-adjustment (shared with LineCook, PrepCook)"
      - "All GET endpoints"
  - name: PrepCook
    description: "Prep cook; plans and preps batches, records consumption and waste"
    identity: "entity_backed:Cook"
    exclusive_operations:
      - "POST /api/prep-batches/{id}/mark-prepped"
    shared_operations:
      - "POST /api/prep-batches (shared with KitchenManager)"
      - "POST /api/prep-batches/{id}/record-consumption (shared with LineCook)"
      - "POST /api/waste-entries (shared with LineCook, PastryChef)"
      - "POST /api/station-pars/{id}/propose-adjustment (shared)"
      - "All GET endpoints"
  - name: LineCook
    description: "Line cook; opens and works service tickets, records consumption and waste"
    identity: "entity_backed:Cook"
    exclusive_operations:
      - "POST /api/service-tickets and fire/mark-ready/serve/recall"
    shared_operations:
      - "POST /api/prep-batches/{id}/record-consumption (shared with PrepCook)"
      - "POST /api/waste-entries (shared)"
      - "POST /api/station-pars/{id}/propose-adjustment (shared)"
      - "All GET endpoints"
  - name: PastryChef
    description: "Pastry chef; owns bakery orders from draft through receive and yield reconciliation"
    identity: "entity_backed:Cook"
    exclusive_operations:
      - "POST /api/bakery-orders and submit/receive/reconcile-yield"
    shared_operations:
      - "POST /api/bakery-orders/{id}/cancel (shared with InventoryController)"
      - "POST /api/waste-entries (shared)"
      - "All GET endpoints"
  - name: InventoryController
    description: "Central production controller; confirms bakery orders against budget"
    identity: opaque
    exclusive_operations:
      - "POST /api/bakery-orders/{id}/confirm"
    shared_operations:
      - "POST /api/bakery-orders/{id}/cancel (shared with PastryChef)"
      - "All GET endpoints"
