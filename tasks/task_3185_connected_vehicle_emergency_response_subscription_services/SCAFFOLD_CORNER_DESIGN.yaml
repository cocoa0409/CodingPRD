              as: SystemIngestion
              captures: { dr_z: $.data.id }
          assert:
            - "DiagnosticReport.${dr_z}.health_score == 0 (clamped, not negative)"
            - "DiagnosticReport.${dr_z}.status == GENERATED"

      - name: insurance_score_excludes_reports_older_than_ninety_days
        claim_type: input_set_filtering
        grounds:
          - calculations.insurance_score
        distinguishing_aspect: "The trailing-90-day window filters the input set: a report created at clock 2026-09-01 is excluded when the insurance consent is granted at clock 2026-12-15 (104 days later), so the score is the 50.00 empty-set baseline despite data existing."
        test_recipe:
