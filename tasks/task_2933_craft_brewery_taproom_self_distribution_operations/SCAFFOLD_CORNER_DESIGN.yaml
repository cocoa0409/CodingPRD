        distinguishing_aspect: "Priority 12 is explicitly evaluated before the body is inspected, so a TaproomStaff request to POST /batches carrying a body that is ALSO missing every required field must return 403 ERR_FORBIDDEN_ROLE - never the 400 that the same body would earn from CellarOperator."
        test_recipe:
          setup:
            - "Brewery ACTIVE. No batch, tank or beer is needed: the request never reaches the body."
