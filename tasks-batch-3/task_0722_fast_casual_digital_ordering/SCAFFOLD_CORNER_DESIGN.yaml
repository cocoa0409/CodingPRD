scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_store_returns_201_with_queue_open
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints
        distinguishing_aspect: "POST /stores with required fields returns 201 and queue_status initialized to OPEN."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", throughput_capacity_per_slot: 5, locker_count: 2 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
          assert:
            - "response.http_status == 201"
            - "Store.${sid}.queue_status == OPEN"
            - "Store.${sid}.version == 1"

      - name: get_store_not_found
        claim_type: Not Found
        grounds:
          - entities.Store
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /stores/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_menu_item_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.MenuItem
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /menu-items omitting base_price_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A store exists."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /menu-items"
              payload: { store_id: "${sid}", name: "X", base_calories: 100 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 400"

      - name: menu_item_allergen_tags_default_empty
        claim_type: Defaults
        grounds:
          - entities.MenuItem.fields.allergen_tags
        distinguishing_aspect: "Omitting allergen_tags on POST /menu-items applies default empty array."
        test_recipe:
          setup: ["A store exists."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /menu-items"
              payload: { store_id: "${sid}", name: "X", base_price_cents: 500, base_calories: 100 }
              as: PlatformAdmin
              captures: { mid: $.data.id }
          assert:
            - "MenuItem.${mid}.allergen_tags == []"

      - name: order_line_effective_allergens_computed_union
        claim_type: Computed Fields
        grounds:
          - entities.OrderLine.fields.effective_allergen_tags
          - calculations.line_calories
        distinguishing_aspect: "OrderLine.effective_allergen_tags is the union of item allergen_tags and applied modifier adds_allergen_tags."
        test_recipe:
          setup: ["Store, item with allergen DAIRY, a modifier adding NUTS, a CART order."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${sid}", name: "X", base_price_cents: 500, base_calories: 100, allergen_tags: ["DAIRY"] }
              as: PlatformAdmin
              captures: { mid: $.data.id }
            - call: "POST /modifiers"
              payload: { menu_item_id: "${mid}", name: "AddNuts", price_delta_cents: 50, calorie_delta: 20, adds_allergen_tags: ["NUTS"] }
              as: PlatformAdmin
              captures: { modid: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${sid}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e@x.com", full_name: "E", home_store_id: "${sid}" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cid}", store_id: "${sid}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { oid: $.data.id }
          trigger:
            - call: "POST /orders/${oid}/lines"
              payload: { menu_item_id: "${mid}", quantity: 1, modifier_ids: ["${modid}"] }
              as: Customer
              as_user_id: "${cid}"
              captures: { lid: $.data.id }
          assert:
            - "OrderLine.${lid}.effective_allergen_tags contains DAIRY and NUTS"

      - name: duplicate_customer_email_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Customer.fields.email
          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "Registering a second customer with an existing email returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A customer with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /customers"
              payload: { email: "dup@x.com", full_name: "D1", home_store_id: "${sid}" }
              as: Customer
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /customers"
              payload: { email: "dup@x.com", full_name: "D2", home_store_id: "${sid}" }
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"
            - "response.http_status == 409"

      - name: ledger_entry_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.PointsLedgerEntry
        distinguishing_aspect: "PointsLedgerEntry has common_fields false: append-only, no version field, no update endpoint."
        test_recipe:
          setup: ["A loyalty account seeded with one ADJUSTMENT entry."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /customers"
              payload: { email: "im@x.com", full_name: "IM", home_store_id: "${sid}" }
              as: Customer
              captures: { cid: $.data.id, la: $.data.loyalty_account_id }
            - call: "POST /points-ledger-entries"
              payload: { loyalty_account_id: "${la}", delta_points: 100, reason: "ADJUSTMENT" }
              as: PlatformAdmin
              captures: { e1: $.data.loyalty_account_id }
          trigger:
            - call: "GET /points-ledger-entries"
              payload: { loyalty_account_id: "${la}" }
              as: PlatformAdmin
          assert:
            - "response.response_type == array"
            - "every entry has no version field"

  # =========================================================================
  - section: state_machines
    instances:
      - name: advance_cart_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Order.PLACED_to_PREPARING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Advancing a CART (un-placed) order returns ERR_INVALID_STATE; advance is only valid from PLACED/PREPARING."
        test_recipe:
          setup: ["A CART order with one line, never placed."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${sid}", name: "X", base_price_cents: 500, base_calories: 100 }
              as: PlatformAdmin
              captures: { mid: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${sid}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "a1@x.com", full_name: "A1", home_store_id: "${sid}" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cid}", store_id: "${sid}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { menu_item_id: "${mid}", quantity: 1 }
              as: Customer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /orders/${oid}/advance"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: complete_completed_order_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order.READY_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A COMPLETED order is terminal on the order_status axis; completing again returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A COMPLETED COUNTER order."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${sid}", name: "X", base_price_cents: 500, base_calories: 100 }
              as: PlatformAdmin
              captures: { mid: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${sid}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "tl@x.com", full_name: "TL", home_store_id: "${sid}" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cid}", store_id: "${sid}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { menu_item_id: "${mid}", quantity: 1 }
              as: Customer
              as_user_id: "${cid}"
            - call: "POST /orders/${oid}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cid}"
            - call: "POST /orders/${oid}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/advance"
              payload: {}
              as: StoreManager
            - call: "POST /orders/${oid}/complete"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /orders/${oid}/complete"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: challenge_start_round_when_in_progress_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LoyaltyChallenge.ROUND_COMPLETE_to_IN_PROGRESS
          - errors[ERR_CHALLENGE_NOT_READY]
        distinguishing_aspect: "start-round on an IN_PROGRESS challenge returns ERR_CHALLENGE_NOT_READY (only valid from ROUND_COMPLETE)."
        test_recipe:
          setup: ["An IN_PROGRESS challenge with no completed orders."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /customers"
              payload: { email: "ch@x.com", full_name: "CH", home_store_id: "${sid}" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /loyalty-challenges"
              payload: { customer_id: "${cid}", target_order_count: 3, bonus_points: 500 }
              as: Customer
              as_user_id: "${cid}"
              captures: { chid: $.data.id }
          trigger:
            - call: "POST /loyalty-challenges/${chid}/start-round"
              payload: {}
              as: Customer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CHALLENGE_NOT_READY"
            - "response.http_status == 409"

      - name: order_initial_state_is_cart
        claim_type: Initial State
        grounds:
          - state_machines.Order
          - entities.Order.fields.order_status
        distinguishing_aspect: "A newly created order starts in order_status CART and settlement_status UNSETTLED."
        test_recipe:
          setup: ["Store, slot, customer exist."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${sid}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "is@x.com", full_name: "IS", home_store_id: "${sid}" }
              as: Customer
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cid}", store_id: "${sid}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { oid: $.data.id }
          assert:
            - "Order.${oid}.order_status == CART"
            - "Order.${oid}.settlement_status == UNSETTLED"

      - name: place_slot_reservation_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Order.CART_to_PLACED
          - entities.PickupSlot.fields.reserved_count
        distinguishing_aspect: "Placing an order increments PickupSlot.reserved_count by 1 and bumps the slot version."
        test_recipe:
          setup: ["A CART order with one line; slot reserved_count 0, version 1."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${sid}", name: "X", base_price_cents: 500, base_calories: 100 }
              as: PlatformAdmin
              captures: { mid: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${sid}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "se@x.com", full_name: "SE", home_store_id: "${sid}" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cid}", store_id: "${sid}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { menu_item_id: "${mid}", quantity: 1 }
              as: Customer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /orders/${oid}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cid}"
          assert:
            - "PickupSlot.${slot_id}.reserved_count == 1"
            - "PickupSlot.${slot_id}.version == 2"
            - "Order.${oid}.settlement_status == CAPTURED"

  # =========================================================================
  - section: calculations
    instances:
      - name: delivery_fee_locker_not_waived_by_subscription
        claim_type: Constants Applied
        grounds:
          - calculations.delivery_fee
        distinguishing_aspect: "LOCKER fee 99 is charged even with a free_delivery subscription; subtotal 500 LOCKER order delivery_fee_cents == 99, total 599."
        test_recipe:
          setup: ["CA store locker_count 5; LOCKER slot; customer with ACTIVE free_delivery subscription; order subtotal 500."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA", throughput_capacity_per_slot: 5, locker_count: 5 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${sid}", name: "X", base_price_cents: 500, base_calories: 100 }
              as: PlatformAdmin
              captures: { mid: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${sid}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "LOCKER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /subscription-plans"
              payload: { tier_name: "FREEDEL", monthly_fee_cents: 999, free_delivery: true }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "lk@x.com", full_name: "LK", home_store_id: "${sid}" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cid}", plan_id: "${plan_id}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/pay"
              payload: { payment_outcome: "SUCCEEDED" }
              as: Customer
              as_user_id: "${cid}"
            - call: "POST /orders"
              payload: { customer_id: "${cid}", store_id: "${sid}", pickup_slot_id: "${slot_id}", subscription_id: "${sub}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { menu_item_id: "${mid}", quantity: 1 }
              as: Customer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /orders/${oid}/place"
              payload: { points_redeemed: 0, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cid}"
          assert:
            - "Order.${oid}.delivery_fee_cents == 99"
            - "Order.${oid}.total_cents == 599"

      - name: redemption_value_partial_block_floored
        claim_type: Correct Result
        grounds:
          - calculations.redemption_value
        distinguishing_aspect: "Redeeming 150 points (MIN_REDEEM_BLOCK 100) yields discount 100 cents; the partial 50 is floored away."
        test_recipe:
          setup: ["Customer with points_balance 150; COUNTER order subtotal 500."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${sid}", name: "X", base_price_cents: 500, base_calories: 100 }
              as: PlatformAdmin
              captures: { mid: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${sid}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "rd@x.com", full_name: "RD", home_store_id: "${sid}" }
              as: Customer
              captures: { cid: $.data.id, la: $.data.loyalty_account_id }
            - call: "POST /points-ledger-entries"
              payload: { loyalty_account_id: "${la}", delta_points: 150, reason: "ADJUSTMENT" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cid}", store_id: "${sid}", pickup_slot_id: "${slot_id}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/lines"
              payload: { menu_item_id: "${mid}", quantity: 1 }
              as: Customer
              as_user_id: "${cid}"
          trigger:
            - call: "POST /orders/${oid}/place"
              payload: { points_redeemed: 150, expected_pickup_slot_version: "${slot_v}" }
              as: Customer
              as_user_id: "${cid}"
          assert:
            - "Order.${oid}.discount_cents == 100"
            - "Order.${oid}.total_cents == 400"

      - name: tier_gold_boundary_inclusive
        claim_type: Constants Applied
        grounds:
          - calculations.tier_recompute
          - entities.LoyaltyAccount.fields.tier
        distinguishing_aspect: "lifetime_points_earned exactly 5000 maps to GOLD (>= boundary inclusive)."
        test_recipe:
          setup: ["A loyalty account with 5000 lifetime points seeded via a positive ADJUSTMENT."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /customers"
              payload: { email: "tg@x.com", full_name: "TG", home_store_id: "${sid}" }
              as: Customer
              captures: { cid: $.data.id, la: $.data.loyalty_account_id }
          trigger:
            - call: "POST /points-ledger-entries"
              payload: { loyalty_account_id: "${la}", delta_points: 5000, reason: "ADJUSTMENT" }
              as: PlatformAdmin
              captures: { la2: $.data.loyalty_account_id }
          assert:
            - "LoyaltyAccount.${la}.lifetime_points_earned == 5000"
            - "LoyaltyAccount.${la}.tier == GOLD"

      - name: line_calories_per_unit_floored_at_zero
        claim_type: Correct Result
        grounds:
          - calculations.line_calories
        distinguishing_aspect: "Per-unit calories are floored at 0 before multiplying by quantity: base 600 with a -700 modifier on qty 2 gives line_calories 0, not -200."
        test_recipe:
          setup: ["Store, item base_calories 600, modifier calorie_delta -700, a CART order."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "TX", throughput_capacity_per_slot: 5, locker_count: 0 }
              as: PlatformAdmin
              captures: { sid: $.data.id }
            - call: "POST /menu-items"
              payload: { store_id: "${sid}", name: "X", base_price_cents: 500, base_calories: 600 }
              as: PlatformAdmin
              captures: { mid: $.data.id }
            - call: "POST /modifiers"
              payload: { menu_item_id: "${mid}", name: "LightCal", price_delta_cents: 0, calorie_delta: -700 }
              as: PlatformAdmin
              captures: { modid: $.data.id }
            - call: "POST /pickup-slots"
              payload: { store_id: "${sid}", window_start_utc: "2026-03-01T00:00:00Z", window_end_utc: "2026-03-02T00:00:00Z", channel: "COUNTER" }
              as: PlatformAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /customers"
