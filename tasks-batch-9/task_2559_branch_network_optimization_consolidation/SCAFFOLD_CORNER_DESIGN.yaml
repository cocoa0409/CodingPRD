          assert:
            - "${snap_composite} == 4535 (factors 4000 / 6000 / 5400 and profitability 3750 from an efficiency ratio of 7500 bps) and ${snap_band} == STABLE"
            - "${err_peer_write} == ERR_BRANCH_OWNERSHIP_REQUIRED with HTTP 403, and Branch.${b102_id}.snapshot_count is still 0 with performance_band UNSCORED"
            - "${err_peer_read} == ERR_BRANCH_OWNERSHIP_REQUIRED with HTTP 403 — the ownership scope covers the read-only score endpoint too"
            - "${own_score} == 4535, ${own_band} == STABLE and ${own_count} == 1 for the manager's own branch"
            - "Branch.${b101_id}.snapshot_count == 1 and Branch.${b101_id}.performance_score_bps == 4535 under the default TRAILING_BLEND variant, whose single-snapshot prefix renormalizes to that one composite"
            - "PerformanceSnapshot.${snap_id} exposes no version field and no update endpoint exists for it"

      - name: the_case_author_and_the_approver_must_be_different_users
        claim_type: segregation_of_duties
        grounds:
          - roles.ConsolidationApprover.exclusive_operations
          - validations.priority_3_ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "The approver role and the author identity are checked independently, so one user holding both roles is still refused on their own case."
        excluded_because:
          difficulty_instance: segregation_then_stale_version_then_savings_floor_ladder
          rationale: "That §1.8 instance already refuses the author's own APPROVE at priority 3 and then shows a second approver succeeding on the identical payload, which is the whole content of this claim."

  - section: cross-cutting complexity layers
    instances:
      - name: case_create_with_a_stale_branch_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.case-create-stale-branch
          - validations.priority_9_ERR_STALE_BRANCH_VERSION
          - errors[ERR_STALE_BRANCH_VERSION]
        distinguishing_aspect: "A performance snapshot posted between the client's read and its write bumps Branch.version, so the previously valid expected_branch_version now yields ERR_STALE_BRANCH_VERSION 412 and no case row is created; re-reading the branch and resubmitting the identical body succeeds."
        test_recipe:
          setup:
            - "Harbor Metro holds RB-101 and RB-102; the client has captured RB-101's version at creation."
            - "A snapshot is then posted against RB-101, which refreshes its score and increments its version."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor Metro", region_code: "MD-01", population: 240000, median_household_income_cents: 7200000, deposit_market_total_cents: 900000000000, competitor_branch_count: 60, household_growth_pct_bps: 180, digital_penetration_bps: 5200 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_id: $.data.id, b101_v0: $.data.version }
            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-102", branch_type: "FULL_SERVICE", tenure_class: "OWNED", deposit_balance_cents: 9600000000, monthly_transaction_count: 8100, digital_adoption_bps: 6100, annual_noninterest_expense_cents: 52000000, annual_revenue_cents: 96000000, fte_count: 14, atm_count: 3, opened_on: "1998-07-15" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b102_id: $.data.id }
            - call: "POST /distribution/branches/${b101_id}/performance-snapshots"
              payload: { period_label: "2026-Q2", period_end_date: "2026-06-30", deposits_cents: 4800000000, transaction_count: 5400, digital_active_bps: 5400, revenue_cents: 40000000, noninterest_expense_cents: 30000000 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { snap_composite: $.data.composite_score_bps }
          trigger:
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b101_id}", receiving_branch_id: "${b102_id}", rationale_code: "LOW_PERFORMANCE", planned_closure_date: "2026-12-01", expected_branch_version: "${b101_v0}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { err_stale: $.data.error_id }
            - call: "GET /distribution/branches/${b101_id}"
              payload: {}
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { b101_v1: $.data.version, b101_band: $.data.performance_band, b101_status: $.data.status }
            - call: "POST /distribution/consolidation-cases"
              payload: { closing_branch_id: "${b101_id}", receiving_branch_id: "${b102_id}", rationale_code: "LOW_PERFORMANCE", planned_closure_date: "2026-12-01", expected_branch_version: "${b101_v1}" }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { case_id: $.data.id, case_status: $.data.status }
          assert:
            - "${snap_composite} == 4535 and ${b101_band} == STABLE — the snapshot is what moved the branch row"
            - "${err_stale} == ERR_STALE_BRANCH_VERSION with HTTP 412"
            - "no ConsolidationCase row exists after the refused create (GET /distribution/consolidation-cases returns total_count 0) and ${b101_status} == ACTIVE, never UNDER_REVIEW"
            - "${b101_v1} > ${b101_v0} — the snapshot incremented Branch.version, which is precisely what invalidated the client's token"
            - "the retried create with ${b101_v1} returns HTTP 201 with ${case_status} == DRAFT and Branch.${b101_id}.status == UNDER_REVIEW"
            - "Branch.${b101_id}.version increments again on the accepted create, so the consumed token cannot be replayed"

      - name: forecast_create_with_a_stale_case_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.forecast-create-stale-case
          - validations.priority_10_ERR_STALE_CASE_VERSION
          - errors[ERR_STALE_CASE_VERSION]
        distinguishing_aspect: "A forecast create carrying the case version observed before an intervening write is refused with 412 and leaves the earlier ACTIVE forecast in place."
        excluded_because:
          difficulty_instance: segregation_then_stale_version_then_savings_floor_ladder
          rationale: "That §1.8 instance already replays a consumed expected_case_version against the forecast endpoint, asserts the 412, and then proves the refreshed token succeeds and rewrites the case's retention fields."

      - name: execute_closure_drives_a_four_level_side_effect_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ConsolidationCase.transitions.NOTICE_FILED_to_CLOSURE_EXECUTED
          - calculations.net_consolidation_savings
          - calculations.property_carry_cost
        distinguishing_aspect: "One call must walk case -> branch -> property disposition -> savings recompute -> market flag, in that order, with the ordering itself observable in the final numbers."
        excluded_because:
          difficulty_instance: execute_closure_four_hop_cascade_flips_case_to_savings_watch
          rationale: "That §1.8 instance asserts every hop of the chain plus the pinned evaluation order that makes the incentive tier follow gross rather than net; a §1.9 restatement would add no new observable."

      - name: the_two_scoring_variants_disagree_on_identical_snapshot_history
        claim_type: dual_variant_calculation
        grounds:
          - calculations.branch_performance_score.variants
          - entities.Branch.fields.scoring_variant
        distinguishing_aspect: "POINT_IN_TIME and TRAILING_BLEND consume the same snapshot rows and must produce different scores and different bands, with the query-string variant never overwriting the persisted one."
        excluded_because:
          difficulty_instance: branch_score_point_in_time_vs_trailing_blend_band_divergence
          rationale: "That §1.8 instance pins both variant results as literals on one snapshot history, shows the band flipping between them, and asserts the persisted variant and version are untouched by the read."

