  # =========================================================================
  # R6 boundary_precision_check
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: blended_discount_exactly_at_tier_three_lower_bound_selects_level_three
        grounds:
          - calculations.C3_blended_discount_and_approval_level
          - entities.ApprovalTier.fields.min_discount_pct
          - entities.ApprovalTier.fields.max_discount_pct
          - entities.Quote.fields.required_approval_level
          - entities.ApprovalRequest.fields.required_level
        distinguishing_aspect: |
          Band membership is tested on the 6-decimal rounded value with min inclusive and max exclusive,
          so a blended discount of exactly 0.250000 belongs to tier 3 (VPSales) and not to tier 2 whose
          max_discount_pct is also 0.25, while 0.240000 on an otherwise identical quote stays in tier 2 —
          one 6-decimal step decides which of two adjacent bands owns the deal.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "Quote A: term_months 12, payment_terms_days 30, one Premium Support line of quantity 10 at requested_discount_pct 0.25 — extended_list_cents 300000, final_net_cents 225000, no rebate (below 5000000) and no uplift, so final_blended_discount_pct is exactly 0.250000 and final_margin_pct 0.733333 clears the floor."
            - "Quote B: identical except requested_discount_pct 0.24 — final_net_cents 228000 and final_blended_discount_pct 0.240000."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Boundary Quote A", term_months: 12, payment_terms_days: 30, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { qa_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${qa_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.25 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { qa_line_id: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Boundary Quote B", term_months: 12, payment_terms_days: 30, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { qb_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${qb_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.24 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { qb_line_id: $.data.id }
          trigger:
            - call: "POST /quotes/${qa_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { qa_level: $.data.required_approval_level }
            - call: "POST /quotes/${qb_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { qb_level: $.data.required_approval_level }
            - call: "GET /quotes/${qa_id}/approval-requests"
              payload: {}
              as: DealDeskAnalyst
              captures: { qa_req_id: "$.data[0].id", qa_req_level: "$.data[0].required_level" }
            - call: "GET /quotes/${qb_id}/approval-requests"
              payload: {}
              as: DealDeskAnalyst
              captures: { qb_req_id: "$.data[0].id", qb_req_level: "$.data[0].required_level" }
          assert:
            - "QuoteLine.${qa_line_id}.final_net_cents == 225000"
            - "Quote.${qa_id}.final_blended_discount_pct == 0.250000"
            - "Quote.${qa_id}.final_margin_pct == 0.733333"
            - "${qa_level} == 3"
            - "${qa_req_level} == 3"
            - "QuoteLine.${qb_line_id}.final_net_cents == 228000"
            - "Quote.${qb_id}.final_blended_discount_pct == 0.240000"
            - "Quote.${qb_id}.final_margin_pct == 0.736842"
            - "${qb_level} == 2"
            - "${qb_req_level} == 2"
            - "ApprovalRequest.${qa_req_id}.current_level == 1"
            - "ApprovalRequest.${qb_req_id}.current_level == 1"

      - name: sla_sweep_at_exact_surge_adjusted_due_instant_is_not_a_breach
        grounds:
          - calculations.C5_service_levels_and_expiry
          - state_machines.ApprovalStep.PENDING_to_ESCALATED
          - entities.ApprovalStep.fields.sla_due_at
          - entities.ApprovalStep.fields.sla_hours_effective
          - entities.ApprovalRequest.fields.escalation_count
        distinguishing_aspect: |
          Breach is strict on the surge-adjusted instant: with surge_sla_multiplier 0.5 the level-1
          service level of 8 hours becomes 4.00 hours and sla_due_at is 2026-09-21T04:00:00.000Z, a sweep
          run at exactly that instant escalates nothing, and a sweep one second later at
          2026-09-21T04:00:01Z escalates the step — the same step, one second apart, two different
          outcomes.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain, with the clock moved to 2026-09-21T00:00:00Z, the first instant of the 10-day surge window before the 2026-10-01T00:00:00Z quarter end."
            - "One quote created and submitted at that instant, term_months 12, payment_terms_days 30, one Premium Support line of quantity 10 at 0.20 (final_blended_discount_pct 0.200000, required_approval_level 2), so a level-1 step is PENDING inside the surge window."
            - "One escalation sweep already run at exactly 2026-09-21T04:00:00Z, which must have escalated nothing."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Quarter End Surge Deal", term_months: 12, payment_terms_days: 30, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id, q_expires: $.data.expires_at }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.20 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { sup_line_id: $.data.id }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
            - call: "GET /approval-steps"
              payload: { decision: "PENDING" }
              as: DealDeskAnalyst
              captures: { step1_id: "$.data[0].id", req_id: "$.data[0].approval_request_id", step1_surge: "$.data[0].in_surge_window", step1_sla_hours: "$.data[0].sla_hours_effective", step1_due: "$.data[0].sla_due_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T04:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sla-escalation-sweeps"
              payload: {}
              as: PlatformAdmin
              captures: { sweep1_escalated: $.data.escalated_step_ids, sweep1_created: $.data.created_step_ids }
            - call: "GET /approval-steps/${step1_id}"
              payload: {}
              as: DealDeskAnalyst
              captures: { mid_decision: $.data.decision }
            - call: "GET /quotes/${q_id}/approval-requests"
              payload: {}
              as: DealDeskAnalyst
              captures: { mid_sla_state: "$.data[0].sla_state", mid_escalations: "$.data[0].escalation_count" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T04:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sla-escalation-sweeps"
              payload: {}
              as: PlatformAdmin
              captures: { sweep2_escalated: $.data.escalated_step_ids, sweep2_created: $.data.created_step_ids }
            - call: "GET /approval-steps"
              payload: { decision: "PENDING" }
              as: DealDeskAnalyst
              captures: { step_repl_id: "$.data[0].id", repl_level: "$.data[0].level", repl_role: "$.data[0].assigned_role", repl_from: "$.data[0].escalated_from_step_level", repl_sla_hours: "$.data[0].sla_hours_effective", repl_due: "$.data[0].sla_due_at" }
          assert:
            - "${q_expires} == 2026-10-21T00:00:00.000Z"
            - "${step1_surge} == true"
            - "${step1_sla_hours} == 4.00"
            - "${step1_due} == 2026-09-21T04:00:00.000Z"
            - "${sweep1_escalated} == []"
            - "${sweep1_created} == []"
            - "${mid_decision} == PENDING"
            - "${mid_sla_state} == ON_TRACK"
            - "${mid_escalations} == 0"
            - "${sweep2_escalated} == [${step1_id}]"
            - "ApprovalStep.${step1_id}.decision == ESCALATED"
            - "${repl_level} == 3"
            - "${repl_role} == VPSales"
            - "${repl_from} == 1"
            - "${repl_sla_hours} == 12.00"
            - "${repl_due} == 2026-09-21T16:00:01.000Z"
            - "ApprovalRequest.${req_id}.escalation_count == 1"
            - "ApprovalRequest.${req_id}.sla_state == BREACHED"
            - "ApprovalRequest.${req_id}.required_level == 3"
            - "ApprovalRequest.${req_id}.current_level == 3"
            - "ApprovalRequest.${req_id}.at_backstop == false"
            - "ApprovalRequest.${req_id}.status == OPEN"
            - "Quote.${q_id}.status == PENDING_APPROVAL"

  # =========================================================================
  # R7 cross_entity_state_dependency
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_blocked_by_account_credit_hold_then_allowed_after_release
        grounds:
          - validations.P16_order_acceptance_criteria
          - entities.Account.fields.credit_status
          - entities.Account.fields.booked_arr_cents
          - state_machines.OrderForm.SIGNED_to_BOOKED
          - endpoints.POST_/accounts/{id}/credit-decisions
          - errors.ERR_ACCOUNT_CREDIT_HOLD
        distinguishing_aspect: |
          Whether a fully signed OrderForm can book depends on no field of the OrderForm or the Quote
          but on Account.credit_status: with the account moved to HOLD by a CFO credit decision the
          identical book call returns ERR_ACCOUNT_CREDIT_HOLD (409) and leaves the form in SIGNED with
          Account.booked_arr_cents 0, and after the very same account is moved back to CLEAR the
          unchanged call succeeds and books 300000 cents of ARR.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain; Account.credit_status starts at its CLEAR default."
            - "One quote with a single Premium Support line of quantity 10 at requested_discount_pct 0 (term_months 12, payment_terms_days 30): final_net_total_cents 300000, final_blended_discount_pct 0.000000 so required_approval_level is 0, and final_margin_pct 0.800000 clears the floor, therefore submit auto-approves the quote in the same request."
            - "One OrderForm generated from the approved quote, sent by the owning rep and signed through the signature route, so it sits in SIGNED with generated_from_quote_version equal to Quote.version."
            - "A CFO credit decision that moves the account to HOLD after the form is already signed."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Support Renewal", term_months: 12, payment_terms_days: 30, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { line_id: $.data.id }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_status: $.data.status, q_level: $.data.required_approval_level, q_expires: $.data.expires_at, q_v: $.data.version }
            - call: "POST /order-forms"
              payload: { quote_id: "${q_id}", signer_name: "Dana Reeves", signer_email: "dana.reeves@northwind.example", expected_quote_version: "${q_v}" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { of_id: $.data.id, of_from_version: $.data.generated_from_quote_version }
            - call: "POST /order-forms/${of_id}/send"
              payload: {}
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { of_sent_status: $.data.status }
            - call: "POST /order-forms/${of_id}/signature"
              payload: { outcome: "SIGNED", signed_by_name: "Dana Reeves" }
