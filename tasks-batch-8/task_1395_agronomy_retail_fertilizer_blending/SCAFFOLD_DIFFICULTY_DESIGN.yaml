              as: Agronomist
            - call: "POST /agronomy/soil-tests/${st_id}/recommendations"
              payload: { crop: "CORN", yield_goal_bu_per_acre: 220, rate_variant: "BUILD_RATE", valid_until: "2027-06-01T00:00:00Z" }
              as: Agronomist
              captures: { rec_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /agronomy/recommendations/${rec_id}/submit"
              payload: {}
              as: Agronomist
              captures: { st1: $.data.status }
            - call: "POST /agronomy/recommendations/${rec_id}/return"
              payload: { reason: "revise K rate" }
              as: ComplianceOfficer
              captures: { st2: $.data.status, rr: $.data.return_reason }
            - call: "POST /agronomy/recommendations/${rec_id}/submit"
              payload: {}
              as: Agronomist
              captures: { st3: $.data.status }
            - call: "POST /agronomy/recommendations/${rec_id}/approve"
              payload: {}
              as: ComplianceOfficer
              captures: { st4: $.data.status, v4: $.data.version }
          assert:
            - "v0 == 1"
            - "st1 == PENDING_REVIEW"
            - "st2 == DRAFT and rr == 'revise K rate' (loop back)"
            - "st3 == PENDING_REVIEW (second pass through the cycle)"
            - "st4 == APPROVED and v4 == 5 (one version bump per transition)"

      - name: permit_expiry_renewal_cycle
        grounds:
          - state_machines.EnvironmentalPermit
          - endpoints."POST /agronomy/_clock/set_current_utc"
        distinguishing_aspect: |
          EnvironmentalPermit is a CYCLIC machine driven by the logical clock:
          ACTIVE -> EXPIRED (lazy, clock past expires_at) -> RENEWAL -> ACTIVE —
          a renewal loop on a third entity type, distinct from BlendOrder
          (parallel dims) and Recommendation (review cycle).
        test_recipe:
          setup:
            - "BLENDER_SITE permit for SITE-1 activated with expires_at 2026-08-10T00:00:00Z (default clock 2026-08-01)"
          setup_api_calls:
            - call: "POST /agronomy/environmental-permits"
              payload: { permit_type: "BLENDER_SITE", site_code: "SITE-1", setback_ft: 150 }
              as: ComplianceOfficer
              captures: { pm_id: $.data.id }
            - call: "POST /agronomy/environmental-permits/${pm_id}/begin-inspection"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /agronomy/environmental-permits/${pm_id}/activate"
              payload: { expires_at: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
              captures: { st_a: $.data.status }
          trigger:
            - call: "POST /agronomy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: BranchAdmin
            - call: "GET /agronomy/environmental-permits/${pm_id}"
              as: ComplianceOfficer
              captures: { st_b: $.data.status }
            - call: "POST /agronomy/environmental-permits/${pm_id}/renew"
              payload: {}
              as: ComplianceOfficer
              captures: { st_c: $.data.status }
            - call: "POST /agronomy/environmental-permits/${pm_id}/activate"
              payload: { expires_at: "2027-01-31T00:00:00Z" }
              as: ComplianceOfficer
              captures: { st_d: $.data.status }
          assert:
            - "st_a == ACTIVE"
            - "st_b == EXPIRED (lazy transition fired by the clock move)"
            - "st_c == RENEWAL"
            - "st_d == ACTIVE (cycle closed: ACTIVE -> EXPIRED -> RENEWAL -> ACTIVE)"

