# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2371_research_security_foreign_influence_disclosure
# Nine §0.5 rule_ids, 21 instances. Every instance grounds in SCAFFOLD.yaml §1.1–§1.7.
# Convention used throughout: an `expected_*_version` payload value is ALWAYS captured
# from a GET issued immediately before the OCC write, because recomputation cascades
# bump the parent's version between its creation and that write.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: subaward_screening_direct_match_vs_ownership_transitive_diverge
        grounds:
          - calculations.subaward_screening_outcome
          - calculations.organization_effective_designation
          - entities.Subaward.fields.applied_screening_variant
          - entities.Subaward.fields.screening_risk_points
          - state_machines.Subaward.PENDING_to_CLEARED
          - state_machines.Subaward.PENDING_to_BLOCKED
        distinguishing_aspect: |
          Two subawards pointing at the SAME organization, screened with the two declared
          variants, produce opposite outcomes: DIRECT_MATCH reads own_designation NONE and
          returns CLEARED with 0 risk points and match_depth 0, while OWNERSHIP_TRANSITIVE
          reads effective_designation SDN inherited through a 60% parent and returns BLOCKED
          with 90 risk points and match_depth 1.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "ORG_PARENT registered with own_designation SDN."
            - "ORG_CHILD registered with parent_organization_id ORG_PARENT and parent_ownership_pct 60 (>= the 50 control threshold), own_designation NONE."
            - "One STANDARD project in PENDING_CLEARANCE (so no security cascade fires on BLOCKED)."
            - "Two PENDING subawards, both on ORG_CHILD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Parent Holdings", country_code: "CN", org_type: "COMPANY", own_designation: "SDN", designated_on: "2026-01-15T00:00:00Z" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_parent_id: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Child Institute", country_code: "CN", org_type: "INSTITUTE", parent_organization_id: "${org_parent_id}", parent_ownership_pct: 60, own_designation: "NONE" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_child_id: $.data.id, org_child_eff: $.data.effective_designation }
            - call: "POST /projects"
              payload: { title: "Photonics Array", agency_code: "NSF", sensitivity_level: "STANDARD", award_amount_cents: 50000000, period_start: "2026-09-01T00:00:00Z", period_end: "2028-08-31T00:00:00Z", controlled_area_capacity: 0 }
              as: SystemAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subawards"
              payload: { project_id: "${p_id}", organization_id: "${org_child_id}", scope: "Optics fabrication", amount_cents: 4000000 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { sub_direct_id: $.data.id }
            - call: "POST /subawards"
              payload: { project_id: "${p_id}", organization_id: "${org_child_id}", scope: "Optics characterization", amount_cents: 3000000 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { sub_trans_id: $.data.id }
          trigger:
            - call: "POST /subawards/${sub_direct_id}/screen"
              payload: { variant: "DIRECT_MATCH" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "POST /subawards/${sub_trans_id}/screen"
              payload: { variant: "OWNERSHIP_TRANSITIVE" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          assert:
            - "ForeignOrganization.${org_child_id}.effective_designation == SDN"
            - "ForeignOrganization.${org_child_id}.effective_designation_depth == 1"
            - "Subaward.${sub_direct_id}.status == CLEARED"
            - "Subaward.${sub_direct_id}.applied_screening_variant == DIRECT_MATCH"
            - "Subaward.${sub_direct_id}.screening_designation == NONE"
            - "Subaward.${sub_direct_id}.screening_risk_points == 0"
            - "Subaward.${sub_direct_id}.screening_match_depth == 0"
            - "Subaward.${sub_direct_id}.screening_matched_organization_id == ${org_child_id}"
            - "Subaward.${sub_trans_id}.status == BLOCKED"
            - "Subaward.${sub_trans_id}.applied_screening_variant == OWNERSHIP_TRANSITIVE"
            - "Subaward.${sub_trans_id}.screening_designation == SDN"
            - "Subaward.${sub_trans_id}.screening_risk_points == 90"
            - "Subaward.${sub_trans_id}.screening_match_depth == 1"
            - "Subaward.${sub_trans_id}.screening_matched_organization_id == ${org_parent_id}"
            - "Project.${p_id}.security_status == PENDING_CLEARANCE (no cascade, the project was never CLEARED)"

      - name: support_statement_strict_agency_vs_institutional_rollup_flip_verdict
        grounds:
          - calculations.support_statement_reconciliation
          - entities.SupportStatement.fields.applied_variant
          - entities.SupportStatement.fields.institutional_person_months
          - entities.SupportStatement.fields.verdict
          - state_machines.SupportStatement.SUBMITTED_to_RECONCILED
          - state_machines.SupportStatement.RECONCILED_to_INCONSISTENT
        distinguishing_aspect: |
          The SAME statement row reconciled twice flips verdict because the variants disagree on
          the inclusion set: STRICT_AGENCY counts only the NIH personnel row (2.00 pm), yielding
          institutional_person_months 2.00, variance 0.00 and CONSISTENT, while
          INSTITUTIONAL_ROLLUP adds the DOD row and converts 480 outside hours at 160 h per
          person-month, yielding 8.00, variance 6.00, omission_count 1 and MATERIAL_DISCREPANCY.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Investigator INV with institutional_base_effort_pct 0."
            - "Disclosure D for INV, CERTIFIED, carrying one FOREIGN_APPOINTMENT item (320 annual_effort_hours) and one TALENT_PROGRAM item (160 annual_effort_hours) on a NONE-designated organization."
            - "Project P_NIH (agency_code NIH) and Project P_DOD (agency_code DOD), each with an ACTIVE personnel row for INV: 2.00 and 3.00 committed_person_months."
            - "SupportStatement ST on P_NIH / NIH / CURRENT_AND_PENDING declaring 2.00 person-months, 1 appointment and 0 outside-support entries."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
              payload: { full_name: "Ada Reed", email: "ada.reed@uni.edu", appointment_type: "FACULTY", home_department: "Materials", institutional_base_effort_pct: 0 }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Neutral Academy", country_code: "SG", org_type: "UNIVERSITY", own_designation: "NONE" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_id: $.data.id }
            - call: "GET /investigators/${inv_id}"
              payload: {}
              as: SystemAdmin
              captures: { inv_ver: $.data.version }
            - call: "POST /disclosures"
              payload: { investigator_id: "${inv_id}", cycle_label: "2026-ANNUAL", disclosure_type: "ANNUAL", expected_investigator_version: "${inv_ver}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { d_id: $.data.id }
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "FOREIGN_APPOINTMENT", foreign_organization_id: "${org_id}", start_date: "2025-03-01T00:00:00Z", annual_effort_hours: 320, is_paid: true }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "TALENT_PROGRAM", foreign_organization_id: "${org_id}", start_date: "2025-06-01T00:00:00Z", annual_effort_hours: 160, is_paid: false }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /disclosures/${d_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /disclosures/${d_id}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "POST /disclosures/${d_id}/review"
              payload: { action: "CERTIFY" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "POST /projects"
              payload: { title: "NIH Imaging Core", agency_code: "NIH", sensitivity_level: "STANDARD", award_amount_cents: 90000000, period_start: "2026-09-01T00:00:00Z", period_end: "2029-08-31T00:00:00Z", controlled_area_capacity: 0 }
              as: SystemAdmin
              captures: { p_nih_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "DOD Sensing Study", agency_code: "DOD", sensitivity_level: "STANDARD", award_amount_cents: 70000000, period_start: "2026-09-01T00:00:00Z", period_end: "2029-08-31T00:00:00Z", controlled_area_capacity: 0 }
              as: SystemAdmin
              captures: { p_dod_id: $.data.id }
            - call: "POST /projects/${p_nih_id}/personnel"
              payload: { investigator_id: "${inv_id}", role_on_project: "PI", committed_person_months: 2.00 }
              as: SystemAdmin
              captures: { pers_nih_id: $.data.id }
            - call: "POST /projects/${p_dod_id}/personnel"
              payload: { investigator_id: "${inv_id}", role_on_project: "PI", committed_person_months: 3.00 }
              as: SystemAdmin
              captures: { pers_dod_id: $.data.id }
            - call: "POST /project-personnel/${pers_nih_id}/status"
              payload: { to_status: "ACTIVE" }
              as: SystemAdmin
            - call: "POST /project-personnel/${pers_dod_id}/status"
              payload: { to_status: "ACTIVE" }
              as: SystemAdmin
            - call: "POST /support-statements"
              payload: { investigator_id: "${inv_id}", project_id: "${p_nih_id}", agency_code: "NIH", document_type: "CURRENT_AND_PENDING", declared_person_months: 2.00, declared_appointment_count: 1, declared_support_count: 0 }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /support-statements/${st_id}/reconcile"
              payload: { variant: "STRICT_AGENCY" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "POST /support-statements/${st_id}/reconcile"
              payload: { variant: "INSTITUTIONAL_ROLLUP" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          assert:
            - "After the first reconcile: SupportStatement.${st_id}.applied_variant == STRICT_AGENCY"
            - "After the first reconcile: SupportStatement.${st_id}.institutional_person_months == 2.00"
            - "After the first reconcile: SupportStatement.${st_id}.variance_person_months == 0.00"
            - "After the first reconcile: SupportStatement.${st_id}.omission_count == 0"
            - "After the first reconcile: SupportStatement.${st_id}.verdict == CONSISTENT"
            - "After the first reconcile: SupportStatement.${st_id}.status == RECONCILED"
            - "After the second reconcile: SupportStatement.${st_id}.applied_variant == INSTITUTIONAL_ROLLUP"
            - "After the second reconcile: SupportStatement.${st_id}.institutional_person_months == 8.00"
            - "After the second reconcile: SupportStatement.${st_id}.variance_person_months == 6.00"
            - "After the second reconcile: SupportStatement.${st_id}.omission_count == 1"
            - "After the second reconcile: SupportStatement.${st_id}.verdict == MATERIAL_DISCREPANCY"
            - "After the second reconcile: SupportStatement.${st_id}.status == INCONSISTENT"
            - "After the second reconcile: Investigator.${inv_id}.material_discrepancy_count == 1"
            - "After the second reconcile: Project.${p_nih_id}.activation_blockers contains SUPPORT_INCONSISTENT"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_per_item_rounding_then_cap_then_clamp
        grounds:
          - calculations.investigator_risk_score
          - calculations.investigator_disclosure_posture
          - entities.Investigator.fields.risk_score
          - entities.DisclosureItem.fields.item_risk_points
          - state_machines.DisclosureItem.DECLARED_to_VERIFIED
        distinguishing_aspect: |
          Multi-factor composition where three ordered stages each change the answer: per-item
          points are rounded to an integer BEFORE summing (TALENT_PROGRAM 30 x SDN 3.0 = 90 plus
          the 5 paid surcharge = 95; FOREIGN_APPOINTMENT 12 x NONE 1.0 = 12), the 60-point
          ITEM_POINT_CAP is applied to the 107 subtotal, and only then is the 0..100 clamp
          applied — so risk_score is exactly 60 and the posture threshold at 60 is reached.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Investigator INV with institutional_base_effort_pct 0."
            - "ORG_SDN with own_designation SDN; ORG_NONE with own_designation NONE."
            - "Disclosure D in SUBMITTED with a paid TALENT_PROGRAM item on ORG_SDN and an unpaid FOREIGN_APPOINTMENT item on ORG_NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
              payload: { full_name: "Bo Chan", email: "bo.chan@uni.edu", appointment_type: "FACULTY", home_department: "Chemistry", institutional_base_effort_pct: 0 }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Listed Defence Works", country_code: "RU", org_type: "GOVERNMENT_AGENCY", own_designation: "SDN", designated_on: "2025-11-01T00:00:00Z" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_sdn_id: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Neutral Academy", country_code: "SG", org_type: "UNIVERSITY", own_designation: "NONE" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_none_id: $.data.id }
            - call: "GET /investigators/${inv_id}"
              payload: {}
              as: SystemAdmin
              captures: { inv_ver: $.data.version }
            - call: "POST /disclosures"
              payload: { investigator_id: "${inv_id}", cycle_label: "2026-ANNUAL", disclosure_type: "ANNUAL", expected_investigator_version: "${inv_ver}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { d_id: $.data.id }
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "TALENT_PROGRAM", foreign_organization_id: "${org_sdn_id}", start_date: "2025-01-10T00:00:00Z", annual_effort_hours: 0, is_paid: true }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { item_talent_id: $.data.id }
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "FOREIGN_APPOINTMENT", foreign_organization_id: "${org_none_id}", start_date: "2025-02-10T00:00:00Z", annual_effort_hours: 0, is_paid: false }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { item_appt_id: $.data.id }
            - call: "POST /disclosures/${d_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /disclosure-items/${item_talent_id}/status"
              payload: { to_status: "VERIFIED" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "POST /disclosure-items/${item_appt_id}/status"
              payload: { to_status: "VERIFIED" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          assert:
            - "DisclosureItem.${item_talent_id}.item_risk_points == 95"
            - "DisclosureItem.${item_appt_id}.item_risk_points == 12"
            - "Investigator.${inv_id}.risk_score == 60"
            - "Investigator.${inv_id}.disclosure_posture == RESTRICTED"
            - "Investigator.${inv_id}.outside_effort_pct == 0.00 (both items declare 0 annual_effort_hours)"

      - name: commitment_totals_round_per_row_and_per_item_before_summation
        grounds:
          - calculations.investigator_commitment_totals
          - entities.Investigator.fields.committed_effort_pct
          - entities.Investigator.fields.outside_effort_pct
          - entities.Investigator.fields.total_commitment_pct
          - state_machines.ProjectPersonnel.PROPOSED_to_ACTIVE
        distinguishing_aspect: |
          Rounding order is the whole answer: three ACTIVE rows of 1.00 committed_person_months
          each give round(8.3333,2)=8.33 three times = 24.99 (never 25.00), three VERIFIED items
          of 100 annual_effort_hours each give round(4.8077,2)=4.81 three times = 14.43 (never
          14.42), and total_commitment_pct is the un-rerounded sum 0 + 24.99 + 14.43 = 39.42.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
            - "Investigator INV with institutional_base_effort_pct 0."
            - "Three STANDARD projects, each with an ACTIVE personnel row for INV at 1.00 committed_person_months."
            - "Disclosure D in SUBMITTED with three OUTSIDE_SUPPORT items of 100 annual_effort_hours each on a NONE-designated organization."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
              payload: { full_name: "Cy Duarte", email: "cy.duarte@uni.edu", appointment_type: "RESEARCH_STAFF", home_department: "Bioengineering", institutional_base_effort_pct: 0 }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Neutral Academy", country_code: "SG", org_type: "UNIVERSITY", own_designation: "NONE" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Grant One", agency_code: "NSF", sensitivity_level: "STANDARD", award_amount_cents: 10000000, period_start: "2026-09-01T00:00:00Z", period_end: "2028-08-31T00:00:00Z", controlled_area_capacity: 0 }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Grant Two", agency_code: "NSF", sensitivity_level: "STANDARD", award_amount_cents: 10000000, period_start: "2026-09-01T00:00:00Z", period_end: "2028-08-31T00:00:00Z", controlled_area_capacity: 0 }
              as: SystemAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Grant Three", agency_code: "NSF", sensitivity_level: "STANDARD", award_amount_cents: 10000000, period_start: "2026-09-01T00:00:00Z", period_end: "2028-08-31T00:00:00Z", controlled_area_capacity: 0 }
              as: SystemAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /projects/${p1_id}/personnel"
              payload: { investigator_id: "${inv_id}", role_on_project: "PI", committed_person_months: 1.00 }
              as: SystemAdmin
              captures: { pers1_id: $.data.id }
            - call: "POST /projects/${p2_id}/personnel"
              payload: { investigator_id: "${inv_id}", role_on_project: "CO_PI", committed_person_months: 1.00 }
              as: SystemAdmin
              captures: { pers2_id: $.data.id }
            - call: "POST /projects/${p3_id}/personnel"
              payload: { investigator_id: "${inv_id}", role_on_project: "CO_PI", committed_person_months: 1.00 }
              as: SystemAdmin
              captures: { pers3_id: $.data.id }
            - call: "GET /investigators/${inv_id}"
              payload: {}
              as: SystemAdmin
              captures: { inv_ver: $.data.version }
            - call: "POST /disclosures"
              payload: { investigator_id: "${inv_id}", cycle_label: "2026-ANNUAL", disclosure_type: "ANNUAL", expected_investigator_version: "${inv_ver}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { d_id: $.data.id }
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "OUTSIDE_SUPPORT", foreign_organization_id: "${org_id}", start_date: "2025-04-01T00:00:00Z", annual_effort_hours: 100, is_paid: false }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { it1_id: $.data.id }
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "OUTSIDE_SUPPORT", foreign_organization_id: "${org_id}", start_date: "2025-05-01T00:00:00Z", annual_effort_hours: 100, is_paid: false }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { it2_id: $.data.id }
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "OUTSIDE_SUPPORT", foreign_organization_id: "${org_id}", start_date: "2025-06-01T00:00:00Z", annual_effort_hours: 100, is_paid: false }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { it3_id: $.data.id }
            - call: "POST /disclosures/${d_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /project-personnel/${pers1_id}/status"
              payload: { to_status: "ACTIVE" }
              as: SystemAdmin
            - call: "POST /project-personnel/${pers2_id}/status"
              payload: { to_status: "ACTIVE" }
              as: SystemAdmin
            - call: "POST /project-personnel/${pers3_id}/status"
              payload: { to_status: "ACTIVE" }
              as: SystemAdmin
            - call: "POST /disclosure-items/${it1_id}/status"
              payload: { to_status: "VERIFIED" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "POST /disclosure-items/${it2_id}/status"
              payload: { to_status: "VERIFIED" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
            - call: "POST /disclosure-items/${it3_id}/status"
              payload: { to_status: "VERIFIED" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          assert:
            - "Investigator.${inv_id}.committed_effort_pct == 24.99"
            - "Investigator.${inv_id}.outside_effort_pct == 14.43"
            - "Investigator.${inv_id}.total_commitment_pct == 39.42"
            - "Investigator.${inv_id}.overcommitment_pct == 0.00"
            - "Investigator.${inv_id}.risk_score == 24"
            - "Investigator.${inv_id}.disclosure_posture == CLEAR"

      - name: completeness_tier_penalty_keyed_on_raw_score_not_penalized_score
        grounds:
          - calculations.disclosure_completeness_score
          - entities.Disclosure.fields.completeness_score
          - entities.Disclosure.fields.completeness_tier
          - entities.Disclosure.fields.late_item_count
          - state_machines.Disclosure.UNDER_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.Disclosure.UNDER_REVIEW_to_CERTIFIED
        distinguishing_aspect: |
          The formula looks circular but the order is pinned: raw = 100 - 8*3 late items -
          6*1 revision round = 70, tier B is selected from the RAW 70, and the 5-point tier
          penalty gives 65. An implementation that re-derives the tier from 65 lands on tier C
          and 58, which is below MIN_CERTIFY_SCORE 60, so the same request would additionally
          fail certification with ERR_COMPLETENESS_TOO_LOW instead of succeeding.
        test_recipe:
          setup:
            - "Logical clock at the default 2026-08-01T00:00:00Z."
