          - state_machines.AffectedVehicle.UNREPAIRED_to_UNREACHABLE
          - entities.AffectedVehicle.fields.outreach_attempt_count
          - endpoints[POST /affected-vehicles/{id}/outreach-attempts]
        distinguishing_aspect: |
          The threshold is cumulative and inclusive: two NO_RESPONSE attempts leave the row
          UNREPAIRED, and only the third attempt (UNREACHABLE_ATTEMPT_THRESHOLD == 3) flips it to
          UNREACHABLE; because the outcome is NO_RESPONSE rather than BAD_ADDRESS the Vehicle's
          owner_address_valid stays true.
        test_recipe:
          setup:
            - "BASE-FILED for 26V-211 with one matched NE build record (owner_address_valid true)."
            - "Two outreach attempts with outcome NO_RESPONSE have already been logged, so outreach_attempt_count is 2 and the row is still UNREPAIRED."
