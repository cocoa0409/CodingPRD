scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:

      - name: vote_tally_dual_variant_initial_vs_continuing
        grounds:
          - calculations.vote_tally_outcome
          - state_machines.AgendaItem.OPEN_FOR_VOTING_to_RESOLVED
          - state_machines.Application.IN_REVIEW_to_APPROVED
          - state_machines.AnnualReport.SCHEDULED_FOR_REVIEW_to_RESOLVED
        distinguishing_aspect: |
          Identical vote counts produce different downstream effects across two ENTITY DOMAINS:
          the initial_review_tally variant operates on Application via AgendaItem and writes outcome
          to Resolution+Application; the continuing_review_tally variant operates on AnnualReport and
          maps the same counts to CONTINUE/SUSPEND/TERMINATE, producing different Application
          transitions (APPROVED→COMPLETED vs APPROVED→SUSPENDED). The two variants live on different
          entity domains (Application vs AnnualReport).
        test_recipe:
          setup:
            - "POST /ethics/_clock/advance to 2026-06-01T00:00:00Z (baseline)"
            - "Seed 9 active CommitteeMembers (1 MEDICAL_EXPERT for convener, others mixed qualifications)"
            - "Create Application A1 (sponsor=ACME) with full submission; pre-screen PASS → status PENDING_REVIEW"
            - "Schedule a STANDARD Meeting M1 at 2026-06-10T00:00:00Z (>168h lead); add AgendaItem AI1 review_kind=INITIAL_REVIEW for A1"
            - "POST publish-agenda then advance clock to 2026-06-10T00:00:00Z; POST open"
            - "All 9 members confirm attendance; cast votes: 6 APPROVE, 2 APPROVE_WITH_MODIFICATION, 1 REJECT"
          trigger:
            - "POST /ethics/agenda-items/AI1/resolve"
            - "Independently: drive A1 through full review (APPROVED), wait one year, submit ANNUAL_PROGRESS AnnualReport AR1; schedule Meeting M2 with ANNUAL_REVIEW agenda item AI2; receive same 6/2/1 vote split; resolve"
          assert:
            - "Resolution(AI1).outcome == 'APPROVE'"
            - "Application.status == 'APPROVED' after AI1 resolve"
            - "Resolution(AI2).outcome == 'APPROVE'"
            - "AnnualReport(AR1).outcome == 'CONTINUE'"
            - "Application.status remains 'APPROVED' after AI2 (no transition to COMPLETED — only FINAL_REPORT triggers that)"
            - "Two AuditLog REVIEW_DECISION rows exist, differing in payload.review_kind (INITIAL_REVIEW vs ANNUAL_REVIEW)"

      - name: safety_alert_chronological_vs_forward_pinned
        grounds:
          - calculations.safety_alert_score
          - entities.AnnualReport.fields.safety_alert_flag
          - validations[priority=16]
        distinguishing_aspect: |
          Operates on the AnnualReport entity domain — distinct from vote_tally_outcome which operates on
          AgendaItem/Application. The pinned CHRONOLOGICAL variant excludes pending/in-flight safety events;
          the documented FORWARD_LOOKING alternative would include them. With reported inputs (SAE=1,
          total=2, enrollment=20) the chronological rate is 2/20 = 0.10 (< 0.20) so flag=false; the
          forward-looking variant adding even one pending event would push numerator to 3 and rate to
          0.15 — still false — but with two pending events rate would be 4/20 = 0.20 ≥ 0.20 and flag would
          flip to true. The scaffold pins CHRONOLOGICAL; tests assert that pinned behavior literal-for-literal.
        test_recipe:
          setup:
            - "Drive Application A2 to APPROVED status via the standard happy path"
            - "POST /ethics/_clock/advance to T+365 days"
          trigger:
            - "POST /ethics/applications/A2/annual-reports with serious_adverse_event_count=1, total_adverse_event_count=2, enrollment_count=20, report_kind=ANNUAL_PROGRESS  (Report R_LO)"
            - "POST /ethics/applications/A2/annual-reports with serious_adverse_event_count=2, total_adverse_event_count=4, enrollment_count=20, report_kind=ANNUAL_PROGRESS  (Report R_RATE)"
            - "POST /ethics/applications/A2/annual-reports with serious_adverse_event_count=3, total_adverse_event_count=4, enrollment_count=10, report_kind=ANNUAL_PROGRESS  (Report R_SAE)"
          assert:
            - "AnnualReport(R_LO).safety_alert_flag == false   # SAE 1<3 AND rate 2/20=0.10 < 0.20"
            - "AnnualReport(R_RATE).safety_alert_flag == true  # SAE 2<3 BUT rate 4/20=0.20 >= 0.20 (boundary inclusive)"
            - "AnnualReport(R_SAE).safety_alert_flag == true   # SAE 3>=3 short-circuit branch"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:

      - name: quorum_max_ceil_rounding_order
        grounds:
          - calculations.quorum_and_eligible_voter_freeze
          - entities.AgendaItem.fields.quorum_required
          - entities.AgendaItem.fields.eligible_voter_count
          - state_machines.Meeting.SCHEDULED_to_AGENDA_PUBLISHED
        distinguishing_aspect: |
          MODE (b) nested rounding ORDER. Formula is max(QUORUM_MIN_ABSOLUTE=5, ceil(0.67*N)). With N=5,
          ceil(0.67*5)=ceil(3.35)=4, then max(5,4)=5. The reversed order ceil(max(5, 0.67*5))=ceil(max(5,3.35))=
          ceil(5)=5 happens to match here, but with N=6 the pinned order gives max(5, ceil(0.67*6))=max(5,
          ceil(4.02))=max(5,5)=5 while reversed gives ceil(max(5, 4.02))=ceil(5)=5 — equal. With N=7 pinned
          gives max(5, ceil(0.67*7))=max(5, ceil(4.69))=max(5,5)=5 and reversed gives ceil(max(5,4.69))=
          ceil(5)=5. The boundary the scaffold pins is QUORUM_MIN_ABSOLUTE behavior when eligible_voter_count
          is small (recusal-heavy applications). Differs from instance 2 (mode-a tiered selection).
        test_recipe:
          setup:
            - "Seed 7 active CommitteeMembers (1 MEDICAL_EXPERT chair)"
            - "Seed Application A3 (sponsor=ACME)"
            - "Pre-declare conflicts for 2 of the 7 members against A3 (conflict_type=SPONSOR_RELATION)"
            - "Schedule STANDARD Meeting M3 with >168h lead time and add AgendaItem AI3 for A3"
          trigger:
            - "POST /ethics/meetings/M3/publish-agenda"
          assert:
            - "AgendaItem(AI3).eligible_voter_count == 5  # 7 active − 2 recused"
            - "AgendaItem(AI3).quorum_required == 5      # max(5, ceil(0.67*5)) = max(5, 4) = 5 — floor dominates"
            - "Cast 5 APPROVE votes from the 5 non-recused; resolve → outcome=APPROVE"
            - "If only 4 votes are cast, resolve returns 200 with Resolution.outcome=NO_QUORUM (boundary: 4 < 5)"

      - name: lead_time_tiered_selection_and_boundary
        grounds:
          - calculations.agenda_lead_time_check
          - entities.Meeting.fields.lead_time_hours
          - validations[priority=10]
          - state_machines.Meeting.SCHEDULED_to_AGENDA_PUBLISHED
        distinguishing_aspect: |
          MODE (a) tiered selection: required_hours is selected from a 2-tier table by meeting_type, then
          combined with a continuous temporal-delta comparison — three inputs (meeting_type, scheduled_at,
          now()) with a conditional branch. Boundary direction is strict-less-than (< not <=) so exactly
          168h is allowed for STANDARD and exactly 24h is allowed for EXPEDITED. Distinct from instance 1
          which is mode-b rounding order.
        test_recipe:
          setup:
            - "POST /ethics/_clock/advance to 2026-06-01T00:00:00Z"
            - "Seed minimal members + AgendaItem prerequisites"
            - "Create three Meetings: MEET_STD_OK at 2026-06-08T00:00:00Z (168h exact), MEET_STD_FAIL at 2026-06-07T23:59:59Z (167h59m59s), MEET_EXP_OK at 2026-06-02T00:00:00Z type EXPEDITED (24h exact)"
            - "Add one AgendaItem to each meeting"
          trigger:
            - "POST /ethics/meetings/MEET_STD_OK/publish-agenda"
            - "POST /ethics/meetings/MEET_STD_FAIL/publish-agenda"
            - "POST /ethics/meetings/MEET_EXP_OK/publish-agenda"
          assert:
            - "MEET_STD_OK publish-agenda → 200, Meeting.status == 'AGENDA_PUBLISHED'"
            - "MEET_STD_FAIL publish-agenda → 422 with error_id == 'ERR_AGENDA_LEAD_TIME_VIOLATION'"
            - "MEET_EXP_OK publish-agenda → 200 (24h boundary inclusive on the allowed side)"

  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:

      - name: application_cyclic_rework_loop
        grounds:
          - state_machines.Application
          - state_machines.Application.PENDING_PRESCREEN_to_REWORK_REQUIRED
          - state_machines.Application.REWORK_REQUIRED_to_PENDING_PRESCREEN
          - state_machines.Application.SUSPENDED_to_APPROVED
        distinguishing_aspect: |
          CYCLE on Application entity: PENDING_PRESCREEN → REWORK_REQUIRED → PENDING_PRESCREEN allows
          arbitrarily many rework rounds, and a separate SUSPENDED → APPROVED cycle allows lifted
          suspensions. Two distinct cycles on the same entity, but the cycle property alone qualifies
          and the entity domain is Application (different from Rectification, instance 2).
        test_recipe:
          setup:
            - "Seed Application A4 with full submission v1 (checklist_complete=true)"
            - "POST submit → PENDING_PRESCREEN"
          trigger:
            - "POST /ethics/applications/A4/prescreen decision=REJECT → REWORK_REQUIRED"
            - "POST /ethics/applications/A4/submissions (v2)"
            - "POST /ethics/applications/A4/submit → PENDING_PRESCREEN (second time)"
            - "POST /ethics/applications/A4/prescreen decision=REJECT → REWORK_REQUIRED (second time)"
          assert:
            - "Application.status visits PENDING_PRESCREEN at least twice across the timeline"
            - "Application.current_submission_version == 2"
            - "Two Submission rows exist (v1.is_current=false, v2.is_current=true)"
            - "Two AuditLog REVIEW_DECISION rows exist for prescreen rejections"

      - name: rectification_secondary_review_branching
        grounds:
          - state_machines.Rectification
          - state_machines.Rectification.OPEN_to_RESPONDED
          - state_machines.Rectification.UNDER_SECONDARY_REVIEW_to_CLOSED_APPROVED
          - state_machines.Rectification.UNDER_SECONDARY_REVIEW_to_CLOSED_REJECTED
          - state_machines.Rectification.OPEN_to_EXPIRED
        distinguishing_aspect: |
          BRANCHING fork on Rectification entity (different entity from instance 1): from
          UNDER_SECONDARY_REVIEW the state machine forks to {CLOSED_APPROVED, CLOSED_REJECTED} with
          divergent cascades (DEFERRED→PENDING_REVIEW vs IN_REVIEW→REJECTED). A second fork lives
          on OPEN → {RESPONDED, EXPIRED}. Branching shape qualifies; entity domain Rectification ≠
          Application.
        test_recipe:
          setup:
            - "Drive Application A5 through full review to outcome=DEFER (creates Rectification R5)"
            - "Capture Rectification R5"
          trigger:
            - "POST /ethics/rectifications/R5/respond with applicant_response_uri='https://docs/resp1'"
            - "Schedule a STANDARD meeting + SECONDARY_REVIEW agenda item AI5 for A5 referencing R5"
            - "Publish, open, vote (split for APPROVE), resolve"
            - "Separately: in another timeline (or fresh app), let an open Rectification age past due_at then POST /ethics/_sweep/run"
          assert:
            - "Rectification(R5).status transitions OPEN → RESPONDED → UNDER_SECONDARY_REVIEW → CLOSED_APPROVED"
            - "Application(A5).status transitions DEFERRED → PENDING_REVIEW after CLOSED_APPROVED cascade"
            - "Separate aged rectification transitions OPEN → EXPIRED after sweep with now() ≥ due_at"

  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:

      - name: resolve_with_modification_cascade_depth_3
        grounds:
          - state_machines.AgendaItem.OPEN_FOR_VOTING_to_RESOLVED
          - state_machines.Application.IN_REVIEW_to_APPROVED_WITH_MOD
          - state_machines.Rectification.OPEN_to_EXPIRED
          - calculations.rectification_due_date
          - calculations.applicant_response_lateness_check
        distinguishing_aspect: |
          Depth-3 transitive chain triggered by POST /ethics/agenda-items/{id}/resolve when vote tally
          yields APPROVE_WITH_MODIFICATION:
            (1) AgendaItem → RESOLVED;
            (2) THAT transition triggers Resolution insert → Application IN_REVIEW → APPROVED_WITH_MOD,
                and as a consequence of THAT new Application state, a Rectification row is inserted with
                due_at = resolution.created_at + 30 days;
            (3) THAT rectification, when sweep clock-advances past due_at without a response, triggers
                Rectification → EXPIRED which itself transitions Application APPROVED_WITH_MOD → REJECTED.
          Each link is caused by the immediately preceding mutation, not by the original resolve call.
          Trigger origin: agenda-items/resolve.
        test_recipe:
          setup:
            - "Run baseline setup creating Application A6, full review with vote split (3 APPROVE, 4 APPROVE_WITH_MODIFICATION, 0 REJECT, 0 DEFER) — quorum=7, votes_cast=7, AWM(4)>APPROVE(3)"
          trigger:
            - "POST /ethics/agenda-items/AI6/resolve"
            - "POST /ethics/_clock/advance to (resolution.created_at + 31 days)"
            - "POST /ethics/_sweep/run"
          assert:
            - "After resolve: Resolution.outcome == 'APPROVE_WITH_MODIFICATION'"
            - "After resolve: Application(A6).status == 'APPROVED_WITH_MOD'"
            - "After resolve: exactly one Rectification row exists with status=='OPEN'"
            - "After sweep: Rectification.status == 'EXPIRED'"
            - "After sweep: Application(A6).status == 'REJECTED'"
            - "AuditLog rows trace: REVIEW_DECISION (resolve) → REVIEW_DECISION (RECTIFICATION_EXPIRED)"

      - name: prescreen_reject_then_rework_cascade_depth_2
        grounds:
          - state_machines.Application.PENDING_PRESCREEN_to_REWORK_REQUIRED
          - state_machines.Submission.PENDING_to_REJECTED
          - state_machines.Application.REWORK_REQUIRED_to_PENDING_PRESCREEN
        distinguishing_aspect: |
          Depth-2 transitive chain triggered by POST /ethics/applications/{id}/prescreen with decision=REJECT
          (different origin from instance 1 which originates at /resolve):
            (1) Submission.is_current row flips PENDING → REJECTED via that prescreen call;
            (2) THAT submission state change directly forces Application to REWORK_REQUIRED (rather than
                the prescreen call setting both fields independently in parallel — the Application transition
                is a consequence of the submission rejection).
          Different origin endpoint (prescreen) from instance 1 (resolve); chain depth 2 satisfies the
          relaxed-link requirement for the second cascade.
        test_recipe:
          setup:
            - "Seed Application A7 with full submission v1 and POST submit"
          trigger:
            - "POST /ethics/applications/A7/prescreen decision=REJECT, prescreen_notes='missing power calculation'"
          assert:
            - "Submission(v1).prescreen_status == 'REJECTED'"
            - "Application(A7).status == 'REWORK_REQUIRED'"
            - "AuditLog REVIEW_DECISION row exists with subject_entity='Application', subject_id=A7, payload.decision='REJECT'"

  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: recused_member_votes_on_closed_item_recusal_wins
        grounds:
          - validations[priority=7]   # state check
          - validations[priority=8]   # recusal check (higher priority)
          - errors[ERR_INVALID_STATE]
          - errors[ERR_MEMBER_RECUSED]
        distinguishing_aspect: |
          ERROR-CATEGORY PAIR: business_safety (priority 8 recusal) vs state (priority 7 invalid state).
          A recused member votes on an already-RESOLVED (CLOSED) agenda item. Both checks fail; the
          higher-priority recusal check wins → ERR_MEMBER_RECUSED. Distinct from instance 2's pair
          (business_constraint vs business_temporal).
        test_recipe:
          setup:
            - "Run resolve_with_modification_cascade setup; capture AgendaItem AI8 in RESOLVED state"
            - "Identify member M_REC with active ConflictDeclaration for the underlying Application"
          trigger:
            - "POST /ethics/agenda-items/AI8/votes as M_REC with vote_mode=APPROVE"
          assert:
            - "Response status == 403"
            - "Response error_id == 'ERR_MEMBER_RECUSED' (not ERR_INVALID_STATE)"

      - name: late_response_with_duplicate_vote_temporal_wins
        grounds:
          - validations[priority=11]   # business_temporal: rectification expired
          - validations[priority=13]   # business_constraint: duplicate vote
          - errors[ERR_RECTIFICATION_EXPIRED]
          - errors[ERR_DUPLICATE_VOTE]
        distinguishing_aspect: |
          ERROR-CATEGORY PAIR: business_temporal (priority 11) vs business_constraint (priority 13).
          Tested on two separate endpoints (rectifications/respond vs agenda-items/votes) where the
          temporally-prior check wins in each case. Demonstrates the priority discipline beyond
          recusal-vs-state.
        test_recipe:
          setup:
            - "Open Rectification R_LATE with due_at = now + 30 days"
            - "Member M_VOTE has already cast a vote on AgendaItem AI_DUP"
            - "POST /ethics/_clock/advance to (Rectification.due_at + 1h)"
          trigger:
            - "POST /ethics/rectifications/R_LATE/respond with applicant_response_uri='https://x'"
            - "POST /ethics/agenda-items/AI_DUP/votes as M_VOTE with vote_mode=REJECT"
          assert:
            - "First call → 409 with error_id == 'ERR_RECTIFICATION_EXPIRED'"
            - "Second call → 409 with error_id == 'ERR_DUPLICATE_VOTE'"

  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:

      - name: quorum_boundary_votes_cast_equals_quorum_required
        grounds:
          - calculations.vote_tally_outcome
          - entities.AgendaItem.fields.quorum_required
          - validations[priority=14]
        distinguishing_aspect: |
          Numeric threshold boundary: votes_cast >= quorum_required uses ">=", so exactly equal must
          succeed and one fewer must trigger NO_QUORUM. Endpoint: POST /ethics/agenda-items/{id}/resolve.
          Metric: integer vote count. Distinct from instance 2 (empty collection on attendance).
        test_recipe:
          setup:
            - "9 members, all eligible; quorum_required computed as max(5, ceil(0.67*9))=max(5,7)=7"
            - "Confirm 9 attendances; cast exactly 7 votes (5 APPROVE, 2 APPROVE_WITH_MODIFICATION, 0 others)"
          trigger:
            - "POST /ethics/agenda-items/AI9/resolve  (success path: 7 == 7)"
            - "On a fresh agenda item AI10 with same eligible_voter_count=9, cast only 6 votes (5 APPROVE, 1 APPROVE_WITH_MOD) and resolve"
          assert:
            - "AI9 resolve → 200, Resolution.outcome == 'APPROVE'  # APPROVE(5)+AWM(2)=7 ≥ ceil(2/3*7)=5; AWM(2)<APPROVE(5) → APPROVE"
            - "AI10 resolve → 200, Resolution.outcome == 'NO_QUORUM'  # 6 < 7"
            - "AI10 AgendaItem.status == 'CLOSED_WITHOUT_QUORUM'"

      - name: empty_agenda_publish_rejected
        grounds:
          - state_machines.Meeting.SCHEDULED_to_AGENDA_PUBLISHED
          - entities.AgendaItem
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Empty-collection boundary: publish-agenda requires at least one AgendaItem. Endpoint
          POST /ethics/meetings/{id}/publish-agenda. Metric: count(AgendaItem WHERE meeting_id=M) == 0
          must reject. Distinct from instance 1 (numeric threshold).
        test_recipe:
          setup:
            - "Create Meeting M_EMPTY at 2026-06-15T00:00:00Z with lead time >168h"
            - "Do NOT create any agenda items"
          trigger:
            - "POST /ethics/meetings/M_EMPTY/publish-agenda"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_INVALID_STATE'"
            - "Meeting.status remains 'SCHEDULED'"

  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:

      - name: agenda_item_open_requires_meeting_in_session
        grounds:
          - state_machines.AgendaItem.PUBLISHED_to_OPEN_FOR_VOTING
          - state_machines.Meeting.AGENDA_PUBLISHED_to_IN_SESSION
          - validations[priority=7]
        distinguishing_aspect: |
          Cross-entity pair: AgendaItem ⟶ Meeting. AgendaItem cannot transition PUBLISHED →
          OPEN_FOR_VOTING unless its parent Meeting is in IN_SESSION. Vote attempts on a
          PUBLISHED (not-yet-open) AgendaItem are rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Create Meeting M_X with one AgendaItem AI_X"
            - "publish-agenda → Meeting=AGENDA_PUBLISHED, AI_X=PUBLISHED"
            - "Do NOT call /open"
          trigger:
            - "POST /ethics/agenda-items/AI_X/votes as an eligible member with vote_mode=APPROVE"
          assert:
            - "Response status == 409"
            - "Response error_id == 'ERR_INVALID_STATE'"
            - "Subsequent: POST /ethics/meetings/M_X/open → 200, then same vote → 201"

      - name: annual_report_review_requires_application_approved
        grounds:
          - entities.AnnualReport.fields.application_id
          - state_machines.AnnualReport.SUBMITTED_to_SCHEDULED_FOR_REVIEW
          - state_machines.Application.IN_REVIEW_to_APPROVED
          - validations[priority=7]
        distinguishing_aspect: |
          Cross-entity pair AnnualReport ⟶ Application (different from instance 1 pair AgendaItem⟶Meeting).
          AnnualReport may only be created when Application.status ∈ {APPROVED, APPROVED_WITH_MOD,
          SUSPENDED}. Submitting against a DRAFT or REJECTED application is rejected.
        test_recipe:
          setup:
            - "Seed Application A_DRAFT in DRAFT status (no submission); seed Application A_OK in APPROVED status"
          trigger:
            - "POST /ethics/applications/A_DRAFT/annual-reports with report_kind=ANNUAL_PROGRESS"
            - "POST /ethics/applications/A_OK/annual-reports with same body"
          assert:
            - "A_DRAFT call → 409 with error_id == 'ERR_INVALID_STATE'"
            - "A_OK call → 201 with AnnualReport.status == 'SUBMITTED'"

  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:

      - name: rectification_window_buffered_overlap_on_application
        grounds:
          - calculations.rectification_due_date
          - calculations.applicant_response_lateness_check
          - state_machines.Rectification.OPEN_to_EXPIRED
          - state_machines.Rectification.OPEN_to_RESPONDED
        distinguishing_aspect: |
          INTERVAL SEMANTICS: half-open right-closed window [resolution.created_at, due_at). The
          response endpoint uses STRICT now() < due_at to accept (so 'at due_at' fails). The sweep
          uses now() >= due_at to flip status to EXPIRED. This is the "exact-instant-counts-as-expired"
          adjacency rule — distinct from instance 2 which uses lead-time minimum-gap adjacency on
          Meeting (a different entity).
        test_recipe:
          setup:
            - "Create Rectification R_EDGE with due_at = T0 + 30 days; resolution.created_at = T0"
          trigger:
            - "POST /ethics/_clock/advance to T0 + 30 days exactly"
            - "POST /ethics/rectifications/R_EDGE/respond as applicant"
            - "POST /ethics/_sweep/run"
          assert:
            - "/respond → 409 with error_id == 'ERR_RECTIFICATION_EXPIRED' (now() == due_at fails strict <)"
            - "After sweep: Rectification(R_EDGE).status == 'EXPIRED'"

      - name: meeting_lead_time_minimum_gap_on_meeting
        grounds:
          - calculations.agenda_lead_time_check
          - entities.Meeting.fields.lead_time_hours
          - state_machines.Meeting.SCHEDULED_to_AGENDA_PUBLISHED
        distinguishing_aspect: |
          INTERVAL SEMANTICS: minimum-gap adjacency between two temporal points (now and
          scheduled_at). Required gap selected per meeting_type (168h or 24h); comparison uses
          STRICT < to reject (so exactly-the-gap is allowed). Resource entity is Meeting, distinct
          from Rectification in instance 1, and the geometric rule (minimum forward gap) differs
          from instance 1's half-open window expiry.
        test_recipe:
          setup:
            - "POST /ethics/_clock/advance to T0"
            - "Create Meeting M_GAP_OK at T0 + 168h (STANDARD) with one agenda item"
            - "Create Meeting M_GAP_FAIL at T0 + 167h59m (STANDARD) with one agenda item"
          trigger:
            - "POST /ethics/meetings/M_GAP_OK/publish-agenda"
            - "POST /ethics/meetings/M_GAP_FAIL/publish-agenda"
          assert:
            - "M_GAP_OK → 200, status='AGENDA_PUBLISHED'"
            - "M_GAP_FAIL → 422, error_id='ERR_AGENDA_LEAD_TIME_VIOLATION'"

  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: submission_version_monotonicity_conserved_quantity
        grounds:
          - state_machines.Application.REWORK_REQUIRED_to_PENDING_PRESCREEN
          - entities.Submission.fields.version_number
          - entities.Application.fields.current_submission_version
          - concurrency_rules
        distinguishing_aspect: |
          CONSERVED QUANTITY: max(Submission.version_number for application_id=X) MUST equal
          Application(X).current_submission_version after every mutation pair (create_submission +
          set_is_current). The forward action /submissions inserts a new row; the implicit
          compensating action (rolling back is_current on the previous version) leaves the
          conserved invariant intact: ∀ application_id, |{is_current=true}| == 1 AND
          max(version_number) == current_submission_version. Different conserved quantity from
          instance 2 (quorum-tally arithmetic).
        test_recipe:
          setup:
            - "Seed Application A_INV with submission v1, current_submission_version=1, v1.is_current=true"
          trigger:
            - "POST /ethics/applications/A_INV/submissions (creates v2)"
            - "POST /ethics/applications/A_INV/submissions (creates v3)"
          assert:
            - "max(version_number) over Submissions of A_INV == 3"
            - "Application(A_INV).current_submission_version == 3"
            - "count(Submission where application_id=A_INV AND is_current=true) == 1"
            - "Submission(v1).is_current == false AND Submission(v2).is_current == false AND Submission(v3).is_current == true"

      - name: vote_tally_quorum_arithmetic_invariant
        grounds:
          - calculations.vote_tally_outcome
          - calculations.quorum_and_eligible_voter_freeze
          - entities.Resolution.fields.tally
          - state_machines.AgendaItem.OPEN_FOR_VOTING_to_RESOLVED
        distinguishing_aspect: |
          CONSERVED QUANTITY: tally.APPROVE + tally.APPROVE_WITH_MODIFICATION + tally.REJECT +
          tally.DEFER == tally.total_votes_cast for every Resolution, AND total_votes_cast <=
          eligible_voter_count. The 'compensation' is implicit: every accepted vote increments
          the matching bucket and the sum; every rejected/recused vote attempt MUST NOT alter
          any bucket nor total_votes_cast. Different conserved quantity (vote-count arithmetic)
          from instance 1 (version-number monotonicity).
        test_recipe:
          setup:
            - "Run boundary_precision_check instance-1 setup (9 members, quorum=7)"
            - "Pre-declare a conflict on member M_REC for the application"
          trigger:
            - "POST attendance+vote as 7 non-recused members (5 APPROVE, 2 APPROVE_WITH_MOD)"
            - "POST vote as M_REC → rejected with ERR_MEMBER_RECUSED"
            - "POST duplicate vote by one of the 7 → rejected with ERR_DUPLICATE_VOTE"
            - "POST /ethics/agenda-items/{id}/resolve"
          assert:
            - "Resolution.tally.APPROVE == 5"
            - "Resolution.tally.APPROVE_WITH_MODIFICATION == 2"
            - "Resolution.tally.REJECT == 0 AND Resolution.tally.DEFER == 0"
            - "Resolution.tally.total_votes_cast == 7"
            - "Resolution.tally.APPROVE + APPROVE_WITH_MODIFICATION + REJECT + DEFER == total_votes_cast"
            - "Resolution.tally.total_votes_cast <= Resolution.tally.eligible_voter_count == 9"
            - "Recused/duplicate failed attempts left no trace in the tally (invariant preserved)"
