  # =====================================================================================
  # Rule 7 - cross-entity state dependencies on DIFFERENT entity pairs
  # =====================================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: checkin_requires_event_in_progress
        grounds:
          - validations[priority=11]
          - state_machines.StaffAssignment.SCHEDULED_to_CHECKED_IN
          - state_machines.Event.PLANNED_to_IN_PROGRESS
          - errors.ERR_EVENT_STATE_INVALID
          - constants.LATE_GRACE_MINUTES
        distinguishing_aspect: |
          Entity pair StaffAssignment -> Event. The dependency is deliberately asymmetric within one
          endpoint: POST /staff-assignments is legal while the Event is merely PLANNED, so the row can
          exist, but the CHECK_IN action on that very row requires the Event to be exactly IN_PROGRESS.
          The child's own state is unimpeachable (SCHEDULED) and the member is ACTIVE, so the only
          possible cause of the refusal is the parent's state - and after the parent advances, the
          identical request succeeds with no other change.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T15:00:00Z; Event in PLANNED (its only plan is ACTIVE, not yet LOCKED)."
            - "TICKET_TAKER PositionType with no required certifications; one slot 16:00-20:00 with required_headcount_override 1."
            - "One ACTIVE member with a SCHEDULED / PENDING assignment on that slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T15:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Parent State Gate Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T15:30:00Z", doors_close_at: "2026-09-12T21:00:00Z", expected_attendance: 20000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z920", shift_start: "2026-09-12T16:00:00Z", shift_end: "2026-09-12T20:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Abe Larkin", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { sm_1: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${sm_1}" }
              as: StaffingCoordinator
              captures: { asg_1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T16:00:00Z" }
              as: StaffingCoordinator
          trigger:
            - call: "POST /staff-assignments/${asg_1}/attendance"
              payload: { action: "CHECK_IN" }
              as: StaffMember
              as_user_id: "${sm_1}"
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-assignments/${asg_1}/attendance"
              payload: { action: "CHECK_IN" }
              as: StaffMember
              as_user_id: "${sm_1}"
          assert:
            - "the first CHECK_IN returns 409 with data.error_id == ERR_EVENT_STATE_INVALID while Event.${ev_id}.status == PLANNED"
            - "after that refusal StaffAssignment.${asg_1}.attendance_status == SCHEDULED, check_in_at == null, late_check_in == false and payout_status == PENDING"
            - "the lifecycle call moves Event.${ev_id}.status to IN_PROGRESS and StaffingPlan.${plan_id}.status to LOCKED"
            - "the second, byte-identical CHECK_IN returns 200: attendance_status == CHECKED_IN and check_in_at == 2026-09-12T16:00:00.000Z"
            - "late_check_in == false because check_in_at equals shift_start (LATE_GRACE_MINUTES 5 is not exceeded), proving the retry was not penalised for the parent's delay"
            - "the assignment's creation succeeded while the parent was only PLANNED, so the gate is action-specific rather than entity-wide"
            - "PositionSlot.${slot_id}.filled_headcount == 1 and status == FILLED throughout, unaffected by the refusal"

      - name: issue_assign_requires_active_certified_member
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - state_machines.GuestIssue.OPEN_to_IN_PROGRESS
          - state_machines.StaffMember.ACTIVE_to_SUSPENDED
          - errors.ERR_STAFF_MEMBER_NOT_ACTIVE
          - errors.ERR_CERTIFICATION_MISSING
        distinguishing_aspect: |
          A DIFFERENT entity pair - GuestIssue -> StaffMember - and the dependency runs sideways
          across the graph rather than up an ownership hierarchy: the issue is not a child of the
          member. The recipe also pins the ORDER of the two member-side gates by walking a three-step
          ladder on one unchanged issue: a SUSPENDED but fully certified member yields
          ERR_STAFF_MEMBER_NOT_ACTIVE (priority 11 before priority 12), an ACTIVE but uncertified
          member yields ERR_CERTIFICATION_MISSING, and only an ACTIVE certified member is accepted.
        test_recipe:
          setup:
            - "Clock pinned at 2026-09-12T19:00:00Z; Event IN_PROGRESS with a LOCKED plan."
            - "M1 holds a VALID CODE_OF_CONDUCT certification and has then been SUSPENDED, so its refusal cannot be attributed to certification."
