            - { call: "POST /resin-lots", payload: { resin_grade: "PP-H", supplier_lot_code: "L-77", qty_kg_received: 500, moisture_bp: 120 }, as: PlantAdmin, captures: { lot_id: $.data.id } }
            - { call: "POST /resin-lots/${lot_id}/disposition", payload: { decision: "RELEASE" }, as: QualityEngineer }
            - { call: "POST /production-jobs", payload: { quote_id: "${quote_id}", planned_qty: 20000, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T16:00:00Z", press_id: "${p150_id}" }, as: ProcessEngineer, captures: { job_id: $.data.id } }
