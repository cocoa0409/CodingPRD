          - entities.Selection.fields.npsh_provisional_margin_m
          - entities.Selection.fields.npsh_safety_factor
          - entities.Selection.fields.npshr_certified_m
          - entities.Selection.fields.npsh_margin_m
        distinguishing_aspect: |
          Mode (c) pinned evaluation order that breaks an apparent circularity: with
          npsha_available_m 5.10 and npshr_catalog_m 3.52 the provisional margin is 1.58 so the
          tier is 1.15, giving npshr_certified_m 4.05 and npsh_margin_m 1.05; choosing the tier
          from the certified margin instead (1.05 -> 1.25) yields 4.40 and 0.70, so the
          instance is falsified by any implementation that re-derives the factor from its own
          output.
