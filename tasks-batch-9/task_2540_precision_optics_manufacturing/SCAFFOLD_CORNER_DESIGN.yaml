      - name: optical_design_create_rejects_out_of_range_and_non_enum_values
        claim_type: type_constraints
        grounds:
          - validations.priority_5
          - errors.ERR_INVALID_REQUEST
          - entities.OpticalDesign.fields.tolerance_method
          - entities.OpticalDesign.fields.min_index_homogeneity_grade
          - entities.OpticalDesign.fields.aperture_mm
        distinguishing_aspect: |
          Four separately malformed creates must each return ERR_INVALID_REQUEST (400) — a non-member enum
          value, a negative number, a non-member grade and a non-integer wavelength — and none of them may
          leave a row behind, which the trailing list read proves by returning total_count 1 for the
          single well-formed create.
        test_recipe:
          setup:
            - "Empty database."
            - "Logical clock at its start value 2026-08-01T00:00:00Z (conventions.logical_clock)."
            - "Each malformed create differs from the well-formed one in exactly one field."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-BAD-1", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050, tolerance_method: "AVERAGE" }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-BAD-2", aperture_mm: -120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-BAD-3", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050, min_index_homogeneity_grade: "H9" }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-BAD-4", aperture_mm: 120.0, wavelength_min_nm: 450.5, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-GOOD", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "GET /optics/optical-designs"
              payload: { limit: 10, offset: 0 }
              as: OpticsEngineer
          assert:
            - "the AVERAGE tolerance_method create returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the negative aperture_mm create returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the H9 min_index_homogeneity_grade create returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the non-integer wavelength_min_nm create returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the well-formed create returns HTTP 201 with OpticalDesign.${d1}.tolerance_method == STATISTICAL"
            - "the list read returns total_count == 1, so no rejected create persisted a row"

      - name: work_order_pinned_design_revision_is_frozen_against_a_later_revision
        claim_type: immutability
        grounds:
          - entities.WorkOrder.fields.pinned_design_revision
          - endpoints.POST_/optics/optical-designs/{id}/revisions
          - state_machines.OpticalDesign.RELEASED_to_SUPERSEDED
          - concurrency_rules.design-revision-supersede
        distinguishing_aspect: |
          pinned_design_revision is frozen at work-order create: superseding the design afterwards moves
          the predecessor to SUPERSEDED and mints revision 2, but the open work order keeps
          pinned_design_revision 1, keeps design_id pointing at the superseded row and keeps its own
          version 1 — the revision must not silently re-point live shop-floor work at new geometry.
        test_recipe:
          setup:
            - "A RELEASED design d1 at design_revision 1 (version 3 after create, analysis and release) and one open work order WO-2540-1 against it."
            - "A RELEASED lot GL-2540-1 with total_blank_count 20."
            - "Logical clock at its start value 2026-08-01T00:00:00Z (conventions.logical_clock)."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: OpticsEngineer
              captures: { d1v: $.data.version }
          trigger:
            - call: "POST /optics/optical-designs/${d1}/revisions"
              payload: { expected_design_version: "${d1v}", design_code: "OD-2540-A-R2" }
              as: OpticsEngineer
              captures: { d2: $.data.id }
            - call: "GET /optics/work-orders/${w1}"
              payload: {}
              as: ProcessTechnician
            - call: "GET /optics/optical-designs/${d1}"
              payload: {}
              as: OpticsEngineer
          assert:
            - "the revision returns HTTP 201"
            - "OpticalDesign.${d2}.design_revision == 2 and supersedes_design_id == ${d1}"
            - "OpticalDesign.${d2}.design_status == DRAFT and tolerance_verdict == PENDING"
            - "OpticalDesign.${d2}.rss_stack_waves == null (allocations are not inherited by the revision)"
            - "OpticalDesign.${d2}.tolerance_budget_waves == 0.0800 (copied from the predecessor because the payload omitted it)"
            - "OpticalDesign.${d1}.design_status == SUPERSEDED"
            - "OpticalDesign.${d1}.version == 4 (create 1, analysis 2, release 3, revision 4)"
            - "WorkOrder.${w1}.pinned_design_revision == 1"
            - "WorkOrder.${w1}.design_id == ${d1}"
            - "WorkOrder.${w1}.version == 1 and process_status == BLANKS_RESERVED"

      - name: assembly_component_body_foreign_keys_are_validated_left_to_right_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_4
          - errors.ERR_ASSEMBLY_NOT_FOUND
          - errors.ERR_WORK_ORDER_NOT_FOUND
          - complexity_profile.entity_topology
          - endpoints.POST_/optics/assembly-components
        distinguishing_aspect: |
          In a flat topology the link row carries two body foreign keys and §1.4 priority 4 validates them
          in the order they are listed in the endpoint's input: with both ids unstored the answer is
          ERR_ASSEMBLY_NOT_FOUND (assembly_id is listed first), and only once assembly_id resolves does
          the unstored work_order_id surface as ERR_WORK_ORDER_NOT_FOUND — and neither refusal creates a
          link.
        test_recipe:
          setup:
            - "One stored Assembly AS-2540-1 in KITTED at version 1; no work order exists at all."
            - "Logical clock at its start value 2026-08-01T00:00:00Z (conventions.logical_clock)."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/assemblies"
              payload: { design_id: "${d1}", assembly_code: "AS-2540-1" }
              as: ProcessTechnician
              captures: { a1: $.data.id, a1v: $.data.version }
          trigger:
            - call: "POST /optics/assembly-components"
              payload: { assembly_id: "00000000-0000-0000-0000-000000000000", work_order_id: "00000000-0000-0000-0000-000000000000", slot_index: 1, decenter_um: 10.0, tilt_arcmin: 1.0, element_wavefront_rms_waves: 0.0600, expected_assembly_version: "${a1v}" }
              as: ProcessTechnician
            - call: "POST /optics/assembly-components"
              payload: { assembly_id: "${a1}", work_order_id: "00000000-0000-0000-0000-000000000000", slot_index: 1, decenter_um: 10.0, tilt_arcmin: 1.0, element_wavefront_rms_waves: 0.0600, expected_assembly_version: "${a1v}" }
              as: ProcessTechnician
            - call: "GET /optics/assemblies/${a1}/components"
              payload: { limit: 10, offset: 0 }
              as: ProcessTechnician
          assert:
            - "the first trigger returns HTTP 404 with error_id ERR_ASSEMBLY_NOT_FOUND"
            - "the second trigger returns HTTP 404 with error_id ERR_WORK_ORDER_NOT_FOUND"
            - "the component listing returns total_count == 0"
            - "Assembly.${a1}.version == 1 and assembly_status == KITTED after both refusals"

      - name: export_classification_computes_the_inclusive_aperture_and_rms_boundary
        claim_type: computed_fields
        grounds:
          - calculations.export_control_classification
          - calculations.export_control_classification.constants.CONTROLLED_APERTURE_MM
          - calculations.export_control_classification.constants.LICENSE_EXEMPT_DESTINATIONS
          - entities.ExportClassification.fields.figure_of_merit
          - state_machines.ExportClassification.LICENSE_REQUIRED_to_EXEMPT_CLEARED
        distinguishing_aspect: |
          A design sitting exactly on both control thresholds (aperture 100.0 mm, required RMS 0.0500
          waves) is controlled through the AND branch even though its figure_of_merit is only 2000.00, far
          below the 4000.00 OR branch; because the destination CA is licence-exempt the same row is
          nevertheless born EXEMPT_CLEARED with license_required false while still carrying the controlled
          ECCN 6A004.A.1.
        test_recipe:
          setup:
            - "Empty database except the design created in the trigger."
            - "Logical clock at its start value 2026-08-01T00:00:00Z (conventions.logical_clock)."
            - "figure_of_merit = round_half_up(100.0 / 0.0500, 2) = 2000.00, which is below CONTROLLED_FIGURE_OF_MERIT 4000.0, so only the aperture/RMS branch can control this design."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-BOUND", aperture_mm: 100.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0500, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/export-classifications"
              payload: { design_id: "${d1}", destination_country: "CA" }
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
              captures: { x1: $.data.id }
            - call: "GET /optics/export-classifications/${x1}"
              payload: {}
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
          assert:
            - "the classification create returns HTTP 201"
            - "ExportClassification.${x1}.figure_of_merit == 2000.00"
            - "ExportClassification.${x1}.eccn == 6A004.A.1"
            - "ExportClassification.${x1}.license_required == false"
            - "ExportClassification.${x1}.classification_status == EXEMPT_CLEARED"
            - "ExportClassification.${x1}.license_number == null and decided_by_user_id == null and decision_note == null"
            - "ExportClassification.${x1}.end_use_statement == null and version == 1"
            - "ExportClassification.${x1}.design_id == ${d1} and destination_country == CA"

