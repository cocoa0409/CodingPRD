            - "trigger response error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_notary_version_on_renewal_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[renewal-create-stale-notary]"
          - "errors[ERR_STALE_VERSION]"
          - endpoints
        distinguishing_aspect: "After a first renewal supersedes the notary (version advances), a second renewal carrying the pre-advance expected_notary_version is rejected ERR_STALE_VERSION 412."
        test_recipe:
          setup: ["ACTIVE notary; a second ACTIVE bond for the renewal; client observed version BEFORE the first renewal bumped it"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "TX", ron_allowed: true, bond_minimum_cents: 500000, commission_term_months: 48, renewal_grace_days: 30, session_act_fee_cap_cents: 1200, ron_surcharge_cap_cents: 2500 }
              as: CommissionAuthority
              captures: { jx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CommissionAuthority
            - call: "POST /notaries"
              payload: { jurisdiction_id: "${jx}", full_name: "OCC N", email: "occ@x.com" }
              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond1: $.data.id }
            - call: "POST /bonds/${bond1}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "GET /notaries/${nota}"
              payload: {}
              as: CommissionAuthority
              captures: { v0: $.data.version }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2030-06-01T00:00:01Z", coverage_end_at: "2034-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond2: $.data.id }
            - call: "POST /bonds/${bond2}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /renewals"
              payload: { notary_id: "${nota}", expected_notary_version: "${v0}", new_bond_id: "${bond2}" }
              as: CommissionAuthority
              captures: { rnw1: $.data.id }
          trigger:
            - call: "POST /renewals"
              payload: { notary_id: "${nota}", expected_notary_version: "${v0}", new_bond_id: "${bond2}" }
              as: CommissionAuthority
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_STALE_VERSION"
            - "trigger response status code == 412"

      - name: occ_correct_version_on_renewal_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[renewal-create-stale-notary]"
          - endpoints
          - entities.Notary.fields.version
        distinguishing_aspect: "A renewal carrying the CURRENT expected_notary_version succeeds (201) and the side-effect increments Notary.version by 1."
        test_recipe:
