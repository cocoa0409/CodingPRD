        distinguishing_aspect: "The activation response body itself must already carry line_item_status SERVING, priority_tier TIER_2 and reserved_cents 1000000 — not just the row after a follow-up read — and the sibling rows mutated by the same request (plan ACTIVE, campaign DELIVERING, slot occupancy 1) must be readable immediately afterwards with no propagation delay."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with an APPROVED 2026-Q3 plan committed at 2000000; an ONSITE_ONLY campaign approved and activated with one ELIGIBLE line item holding a hero assignment."
