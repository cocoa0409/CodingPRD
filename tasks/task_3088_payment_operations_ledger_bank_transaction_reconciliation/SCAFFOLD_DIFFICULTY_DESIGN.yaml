- rule_id: boundary_precision_check
  instances:
  - name: sole_open_virtual_account_cardinality_boundary
    grounds:
    - calculations.deposit_attribution
    - calculations.deposit_attribution.variants.sole_open_branch
    - entities.VirtualAccount.fields.status
    - entities.ExceptionItem.fields.kind
    - endpoints.POST_/exceptions/{exceptionId}/reevaluate_aging
    distinguishing_aspect: 'The boundary is on the cardinality of the candidate set rather than on a number: a 100000-cent
      line is left unattributed while TWO open virtual accounts exist (neither the reference branch nor the sole-open
      branch can pick one), and closing one of them flips the very same deposit to attributable by the sole-open
      branch while its amount stays 100000 — an ambiguous-set edge reachable through the virtual-account close endpoint
