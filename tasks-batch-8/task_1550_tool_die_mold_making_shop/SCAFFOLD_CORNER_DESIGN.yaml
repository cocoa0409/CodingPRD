# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Breadth walk of SCAFFOLD.yaml §1.1–§1.7 per references/claim-extraction-guide.
# Fixture conventions shared with §1.8: clock default 2026-08-01T00:00:00Z;
# invoices issued by FinanceAdmin fin-a; payments recorded by fin-b.
# =============================================================================
scaffold_corner_design:
  # ================================================================ entities ==
  - section: entities
    instances:
      - name: customer_creation_defaults_and_system_fields
        claim_type: defaults
        grounds: [entities.Customer.fields.credit_limit_cents, entities.Customer.fields.status]
        distinguishing_aspect: "Omitting credit_limit_cents applies the default 0 (unlimited); status starts ACTIVE; id/created_at/updated_at/version are server-managed (created_at == logical clock default 2026-08-01T00:00:00Z, version == 1)."
        test_recipe:
          setup: ["empty database; logical clock never set"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: {company_name: "Default Co", contact_email: "df@x.com"}
              as: ShopAdmin
              captures: {c1: $.data.id}
          assert:
            - "Customer.${c1}.credit_limit_cents == 0"
            - "Customer.${c1}.status == ACTIVE"
            - "Customer.${c1}.outstanding_balance_cents == 0"
            - "Customer.${c1}.version == 1"
            - "Customer.${c1}.created_at == 2026-08-01T00:00:00Z (logical clock default, not wall clock)"
            - "Customer.${c1}.id is a bare UUID with no type prefix"

      - name: customer_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Customer.fields.company_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /customers without company_name fails at priority 3 with ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: {contact_email: "nofields@x.com"}
              as: ShopAdmin
              captures: {err1: $.data.error_id}
          assert:
            - "http 400, error_id == ERR_INVALID_REQUEST"
            - "captured err1 == ERR_INVALID_REQUEST"
            - "GET /customers returns total_count == 0"

      - name: design_invalid_die_class_enum_rejected
        claim_type: type_constraints
        grounds: [entities.ToolDesign.fields.die_class, "errors[ERR_INVALID_ENUM_VALUE]"]
        distinguishing_aspect: "die_class CLASS_999 is outside the declared enum domain and is rejected ERR_INVALID_ENUM_VALUE before any state change."
        test_recipe:
          setup: ["Customer C exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Enum Co", contact_email: "en@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
          trigger:
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-E1", tool_type: "INJECTION_MOLD", die_class: "CLASS_999", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {err1: $.data.error_id}
          assert:
            - "http 400, error_id == ERR_INVALID_ENUM_VALUE"
            - "captured err1 == ERR_INVALID_ENUM_VALUE"

      - name: nonexistent_quote_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_QUOTE_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET /quotes/{random-uuid} fails at existence priority 4 with ERR_QUOTE_NOT_FOUND (404); the error envelope carries error_id and message keys."
        test_recipe:
          setup: ["empty database is sufficient"]
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "NF Co", contact_email: "nf@x.com", credit_limit_cents: 0}
              as: ShopAdmin
          trigger:
            - call: "GET /quotes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Any
              captures: {err1: $.data.error_id}
          assert:
            - "http 404, error_id == ERR_QUOTE_NOT_FOUND"
            - "captured err1 == ERR_QUOTE_NOT_FOUND"
            - "error envelope has meta.api_request_id and response_type == error"

      - name: payment_entity_immutable_no_version
        claim_type: immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment (common_fields: false) exposes id and created_at but NO version or updated_at keys, and no update endpoint exists — the append-only event record."
        test_recipe:
          setup:
            - "CLASS_103 job with milestone 1 INVOICED (2100000) — invoice issued by fin-a"
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Imm Co", contact_email: "im@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-IM1", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
            - call: "POST /quotes/${q1}/issue"
              as: Estimator
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /build-jobs"
              payload: {quote_id: "${q1}"}
              as: ProjectManager
              captures: {j1: $.data.id}
            - call: "GET /build-milestones"
              payload: {build_job_id: "${j1}"}
              as: Any
              captures: {m1: "$.data[0].id"}
            - call: "POST /build-milestones/${m1}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${m1}/invoice"
              as: FinanceAdmin
              as_user_id: "fin-a"
              captures: {inv1: $.data.id}
          trigger:
            - call: "GET /build-jobs/${j1}"
              as: Any
              captures: {j1_ver: $.data.version}
            - call: "POST /build-jobs/${j1}/payments"
              payload: {amount_cents: 1, expected_build_job_version: "${j1_ver}"}
              as: FinanceAdmin
              as_user_id: "fin-b"
              captures: {p1: $.data.id}
          assert:
            - "Payment.${p1} JSON object contains id and created_at keys"
            - "Payment.${p1} JSON object does NOT contain version or updated_at keys"
            - "Payment.${p1}.allocations == [{invoice_id: ${inv1}, applied_cents: 1}]"
            - "ProgressInvoice.${inv1}.status == PARTIALLY_PAID and balance_due_cents == 2099999"

      - name: build_job_creation_materializes_milestones_and_tool
        claim_type: side_effect_execution
        grounds: [entities.BuildMilestone.fields.planned_amount_cents, entities.ToolAsset.fields.warranty_shot_limit]
        distinguishing_aspect: "POST /build-jobs atomically mints six milestones with the pinned 20/25/25/15/10/5 split [2100000, 2625000, 2625000, 1575000, 1050000, 525000] plus one ToolAsset (serial set, warranty_shot_limit 250000 for CLASS_103, ownership SHOP_RETAINED, physical IN_BUILD)."
        test_recipe:
          setup: ["ACCEPTED FIRM quote (total 10500000) for a RELEASED CLASS_103 design"]
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Mat Co", contact_email: "mt@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-MT1", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
            - call: "POST /quotes/${q1}/issue"
              as: Estimator
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${c1}"
          trigger:
            - call: "POST /build-jobs"
              payload: {quote_id: "${q1}"}
              as: ProjectManager
              captures: {j1: $.data.id}
          assert:
            - "BuildJob.${j1}.status == BOOKED and version == 1 and contract_value_cents == 10500000"
            - "GET /build-milestones?build_job_id=${j1} returns exactly 6 rows, seq 1..6, all PENDING"
            - "milestone planned_amount_cents == [2100000, 2625000, 2625000, 1575000, 1050000, 525000] in seq order"
            - "milestone billing_pct == [20, 25, 25, 15, 10, 5] and codes DESIGN_COMPLETE..DELIVERY_ACCEPTED"
            - "GET /tool-assets?build_job_id=${j1} returns exactly 1 row: physical_status IN_BUILD, ownership_status SHOP_RETAINED, warranty_shot_limit == 250000, contract_snapshot_cents == 10500000, lifetime_shots == 0, warranty_expires_at == null"
            - "ToolAsset.serial_number is non-null"

      - name: quote_computed_price_fields_excluded_because
        claim_type: computed_fields
        grounds: [entities.Quote.fields.total_price_cents]
        excluded_because:
          difficulty_instance: quote_price_compression_expedited_compound_stack
          rationale: "Computed price fields asserted with literal values in the named §1.8 instance (base/surcharge/subtotal/total)."

  # ========================================================== state_machines ==
  - section: state_machines
    instances:
      - name: design_rejection_loops_back_to_draft
        claim_type: valid_transition
        grounds: [state_machines.ToolDesign.SUBMITTED_to_DRAFT]
        distinguishing_aspect: "Review REJECTED reverts SUBMITTED -> DRAFT (revision loop, not terminal); the same design can be re-submitted and then released — each mutation bumps version."
        test_recipe:
          setup: ["Customer C; design D created (DRAFT, version 1) and submitted (SUBMITTED, version 2)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Loop Co", contact_email: "lp@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-L1", tool_type: "TRANSFER_DIE", die_class: "CLASS_102", cavity_count: 2, design_complexity_score: 8}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
          trigger:
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "REJECTED", review_note: "thin web at station 3"}
              as: ToolingEngineer
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
          assert:
            - "after REJECTED: ToolDesign.${d1}.status == DRAFT and version == 3"
            - "re-submit succeeds: status == SUBMITTED, version == 4"
            - "second review RELEASED succeeds: status == RELEASED, version == 5"

      - name: design_revise_self_referential_chain
        claim_type: side_effect_execution
        grounds: [state_machines.ToolDesign.RELEASED_to_SUPERSEDED, entities.ToolDesign.fields.supersedes_design_id]
        distinguishing_aspect: "POST /tool-designs/{id}/revise mints a new DRAFT with revision_number 2 and supersedes_design_id pointing at the old design (self-referential FK); when the revision is RELEASED the old design auto-transitions RELEASED -> SUPERSEDED, preserving the one-RELEASED-per-part invariant."
        test_recipe:
          setup: ["Customer C; design D1 (PN-L2) RELEASED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Rev Co", contact_email: "rv@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-L2", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
          trigger:
            - call: "POST /tool-designs/${d1}/revise"
              payload: {design_complexity_score: 12}
              as: ToolingEngineer
              captures: {d2: $.data.id}
            - call: "POST /tool-designs/${d2}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d2}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
          assert:
            - "ToolDesign.${d2}.revision_number == 2 and supersedes_design_id == ${d1}"
            - "ToolDesign.${d2}.design_complexity_score == 12 (override) and cavity_count == 4 (inherited)"
            - "after D2 release: ToolDesign.${d1}.status == SUPERSEDED"
            - "ToolDesign.${d2}.status == RELEASED"

      - name: duplicate_released_design_per_part_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_DUPLICATE_RELEASED_DESIGN]", "validations[priority=10]"]
        distinguishing_aspect: "A second, unrelated design (no supersedes link) for the same (customer_id, part_number) cannot be released while the first is RELEASED."
        test_recipe:
          setup: ["Customer C; design A (PN-DUP) RELEASED; design B (same part PN-DUP, no revision link) SUBMITTED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Dup Co", contact_email: "dp@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-DUP", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {da: $.data.id}
            - call: "POST /tool-designs/${da}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${da}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-DUP", tool_type: "INJECTION_MOLD", die_class: "CLASS_104", cavity_count: 2, design_complexity_score: 5}
              as: Customer
              as_user_id: "${c1}"
              captures: {db: $.data.id}
            - call: "POST /tool-designs/${db}/submit"
              as: Customer
              as_user_id: "${c1}"
          trigger:
            - call: "POST /tool-designs/${db}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {err1: $.data.error_id}
          assert:
            - "http 409, error_id == ERR_DUPLICATE_RELEASED_DESIGN"
            - "captured err1 == ERR_DUPLICATE_RELEASED_DESIGN"
            - "ToolDesign.${db}.status == SUBMITTED"
            - "ToolDesign.${da}.status == RELEASED (untouched)"

      - name: quote_expiry_lazy_transition_on_respond
        claim_type: valid_transition
        grounds: [state_machines.Quote.ISSUED_to_EXPIRED, "errors[ERR_QUOTE_EXPIRED]"]
        distinguishing_aspect: "A respond attempted after valid_until (FIRM: issued 2026-08-01T00:00:00Z + 30d = 2026-08-31T00:00:00Z) fails ERR_QUOTE_EXPIRED and the quote itself transitions ISSUED -> EXPIRED as a lazy side effect of the rejected call."
        test_recipe:
          setup: ["Customer C; design RELEASED; FIRM quote ISSUED at clock default; clock then advanced to 2026-09-01 (past valid_until)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Exp Co", contact_email: "ex@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-EX1", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
            - call: "POST /quotes/${q1}/issue"
              as: Estimator
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-09-01T00:00:00Z"}
              as: ShopAdmin
          trigger:
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${c1}"
              captures: {err1: $.data.error_id}
          assert:
            - "http 409, error_id == ERR_QUOTE_EXPIRED"
            - "captured err1 == ERR_QUOTE_EXPIRED"
            - "Quote.${q1}.status == EXPIRED (lazy transition persisted by the rejected call)"
            - "Quote.${q1}.valid_until == 2026-08-31T00:00:00Z (FIRM 30-day validity)"

      - name: quote_terminal_lockdown_double_respond_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.Quote]
        distinguishing_aspect: "A DECLINED quote is terminal: a second respond call fails ERR_INVALID_STATE and the first decision stands."
        test_recipe:
          setup: ["Customer C; design RELEASED; FIRM quote ISSUED then DECLINED"]
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Term Co", contact_email: "tm@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-TM1", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
            - call: "POST /quotes/${q1}/issue"
              as: Estimator
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "DECLINED"}
              as: Customer
              as_user_id: "${c1}"
          trigger:
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${c1}"
              captures: {err1: $.data.error_id}
          assert:
            - "http 409, error_id == ERR_INVALID_STATE"
            - "captured err1 == ERR_INVALID_STATE"
            - "Quote.${q1}.status == DECLINED"

      - name: job_hold_blocks_ops_and_resume_returns_prior_state
        claim_type: valid_transition
        grounds: [state_machines.BuildJob.TRYOUT_PHASE_to_ON_HOLD, state_machines.BuildJob.ON_HOLD_to_TRYOUT_PHASE, "errors[ERR_JOB_ON_HOLD]"]
        distinguishing_aspect: "hold from TRYOUT_PHASE stores hold_return_state; while ON_HOLD a milestone completion is rejected ERR_JOB_ON_HOLD; resume returns the job to exactly TRYOUT_PHASE and clears hold_return_state (branching with revert, not a linear pipeline)."
        test_recipe:
          setup: ["CLASS_103 job TRYOUT_PHASE (machine reserved, press window, sample created); milestone 1 PENDING"]
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Hold Co", contact_email: "hd@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-HD1", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
            - call: "POST /quotes/${q1}/issue"
              as: Estimator
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /build-jobs"
              payload: {quote_id: "${q1}"}
              as: ProjectManager
              captures: {j1: $.data.id}
            - call: "GET /build-milestones"
              payload: {build_job_id: "${j1}"}
              as: Any
              captures: {m1: "$.data[0].id"}
            - call: "POST /machine-reservations"
              payload: {build_job_id: "${j1}", machine_id: "CNC_1", start_time: "2026-08-03T08:00:00Z", end_time: "2026-08-03T16:00:00Z"}
              as: ProjectManager
            - call: "POST /build-jobs/${j1}/advance"
              payload: {target_state: "IN_BUILD"}
              as: ProjectManager
            - call: "POST /press-reservations"
              payload: {build_job_id: "${j1}", press_id: "PRESS_500T", start_time: "2026-08-10T08:00:00Z", end_time: "2026-08-10T16:00:00Z"}
              as: ProjectManager
              captures: {pr1: $.data.id}
            - call: "POST /tryout-samples"
              payload: {build_job_id: "${j1}", press_reservation_id: "${pr1}"}
              as: ProjectManager
              captures: {s1: $.data.id}
          trigger:
            - call: "POST /build-jobs/${j1}/hold"
              as: ProjectManager
            - call: "POST /build-milestones/${m1}/complete"
              as: ProjectManager
              captures: {err1: $.data.error_id}
            - call: "POST /build-jobs/${j1}/resume"
              as: ProjectManager
          assert:
            - "after hold: BuildJob.${j1}.status == ON_HOLD and hold_return_state == TRYOUT_PHASE"
