          A Lease cannot transition MOVED_OUT -> CLOSED while any TenantStatement of
          that lease has payment_status in {UNPAID, PARTIALLY_PAID, DELINQUENT,
          IN_COLLECTIONS}; close is rejected ERR_LEASE_HAS_OPEN_BALANCE. Entity pair
          Lease -> TenantStatement, distinct from instance 2's VendorBill ->
          BillingCycle pair.
