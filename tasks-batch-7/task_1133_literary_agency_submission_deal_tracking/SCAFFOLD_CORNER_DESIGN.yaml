            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "MEMOIR", word_count: 70000 }, as: Agent, as_user_id: "${agent1}", captures: { s2: $.data.triage_score } }
          assert:
            - "${s1} == 40   # 10 + 20 + 10"
            - "${s2} == 60   # 10 + 40 + 10"

