              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /cra/loan-records/${l_id}/confirm"
              payload: {}
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AREA_NOT_ACTIVE with http 422; loan remains DRAFT"

      - name: qualify_exceeds_cd_budget
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CD_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "With SoD satisfied (different reviewer), a PRO_RATA qualification of 120000 against a 100000 budget fails ERR_CD_BUDGET_EXCEEDED 422."
        test_recipe:
          setup: ["AssessmentArea ACTIVE budget 100000; SUBMITTED activity amount 200000 pct 0.60 (PRO_RATA 120000)"]
          setup_api_calls:
