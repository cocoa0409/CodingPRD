      - name: genre_balance_factor_steps_to_085_between_the_soft_and_hard_caps
        claim_type: constants_applied
        grounds:
          - calculations.genre_balance_share
          - calculations.offer_guarantee_ceiling
          - entities.Offer.fields.genre_balance_factor
        distinguishing_aspect: |
          Two live ELECTRONIC offers put the excluding share at 3000000 / 9500000 =
          0.3158, strictly between GENRE_SOFT_PCT and GENRE_CAP_PCT, so the third
          ELECTRONIC offer's factor is 0.85 and its ceiling is floor(925000 * 0.85) =
          786250 - the floor is applied once, after the multiplication, so 786250 rather
          than 786250.0 rounded from a per-input scaling. A ROCK act with the identical
          draw_score 37 gets factor 1.00 and ceiling 925000 from the same fixture, which
          isolates the factor as the only difference.
        test_recipe:
          setup:
            - "Canonical base fixture (allocatable 9500000) plus three more acts: Halcyon Drift (ELECTRONIC, draw 100), Static Bloom (ELECTRONIC, draw 20) and Vela Roan (ROCK, draw 37); Nova Kade's roster row is replaced by an ELECTRONIC act with draw_score 37."
