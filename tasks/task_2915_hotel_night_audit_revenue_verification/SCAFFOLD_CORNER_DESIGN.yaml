        grounds: ["validations[priority=50]", "validations[priority=51]", "errors[ERR_SELF_APPROVAL_FORBIDDEN]", "errors[ERR_SELF_REVERSAL_FORBIDDEN]", "roles.RevenueManager"]
        distinguishing_aspect: "The declared role model has four separate originator fields on four separate entities, and this probe walks the two that no depth instance touches - filed_by_user_id on a document review and posted_by_user_id on a journal reversal, which raises a different code - plus the settlement site, showing the rule is about identity rather than about role."
