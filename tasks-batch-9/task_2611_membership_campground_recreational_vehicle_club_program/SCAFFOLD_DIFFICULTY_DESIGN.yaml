              as: ClubAdmin
              captures: { park_tp_id: "$.data.id", park_tp_network_type: "$.data.network_type" }
            - call: "POST /parks/${park_tp_id}/season-openings"
              payload: {}
              as: ClubAdmin
            - call: "POST /members"
              payload: { full_name: "Ines Falk", email: "ines@example.com" }
              as: ClubAdmin
              captures: { mbr_ines_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Onur Baptiste", email: "onur@example.com" }
              as: ClubAdmin
              captures: { mbr_onur_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_ines_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_ines_id: "$.data.id" }
            - call: "POST /memberships"
              payload: { member_id: "${mbr_onur_id}", tier_id: "${tier_pres_id}", upfront_paid_cents: 1850000 }
              as: ClubAdmin
              captures: { ms_onur_id: "$.data.id" }
          trigger:
            - call: "POST /reservations"
              payload: { park_id: "${park_tp_id}", membership_id: "${ms_ines_id}", arrival_date: "2026-09-10", scheduled_departure_date: "2026-09-13" }
              as: Member
              as_user_id: "${mbr_ines_id}"
              captures: { res_ines_id: "$.data.id", res_ines_affiliate_nights: "$.data.affiliate_nights_charged" }
            - call: "POST /affiliate-agreements/${agr_th_id}/status-changes"
              payload: { new_status: "SUSPENDED" }
              as: ClubAdmin
            - call: "POST /reservations"
              payload: { park_id: "${park_tp_id}", membership_id: "${ms_onur_id}", arrival_date: "2026-09-10", scheduled_departure_date: "2026-09-13" }
              as: Member
              as_user_id: "${mbr_onur_id}"
              captures: { inactive_agreement_error_id: "$.data.error_id" }
          assert:
