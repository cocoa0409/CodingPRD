  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_requires_post_open
        grounds:
          - state_machines.Claim.transitions
          - state_machines.GiftPost.DRAFT_to_OPEN
          - errors[ERR_POST_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair Claim -> GiftPost: a claim can only be created while the
          referenced post is OPEN; the same call against the same post in DRAFT
          is rejected, and succeeds immediately after publish flips the post.
        test_recipe:
          setup:
            - "Clock 2026-05-10T09:00:00Z; group with G and M; post P exists in DRAFT"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/members"
