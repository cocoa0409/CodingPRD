            - "PA and PB have both had their permits applied for, issued, and slots booked, so both sit at permit_status INSPECTION_SCHEDULED: PA on [2026-08-10T09:00:00.000Z, 2026-08-10T11:00:00.000Z] and PB on [2026-08-10T10:00:00.000Z, 2026-08-10T12:00:00.000Z]."
