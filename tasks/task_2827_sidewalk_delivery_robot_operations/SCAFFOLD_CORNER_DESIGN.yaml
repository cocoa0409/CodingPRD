            - call: "POST /merchants/${m}/integration-transitions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /merchants/${m}/integration-transitions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /merchants/${m}/integration-transitions"
              payload: { action: "SUSPEND", reason: "annual audit" }
              as: PlatformAdmin
            - call: "POST /merchants/${m}/integration-transitions"
