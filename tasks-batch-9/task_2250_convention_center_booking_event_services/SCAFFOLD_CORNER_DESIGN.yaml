        excluded_because:
          difficulty_instance: boundary_precision_check / facility_fee_tier_boundary_at_exactly_five_million_subtotal_takes_mid_rate
          rationale: "The named §1.8 instance pins the strict less-than tier comparison at the exact FEE_TIER_1_CENTS boundary."

      - name: error_union_crew_hours_daily_aggregation
        claim_type: aggregation
        grounds:
          - calculations.union_crew_hours_committed
        excluded_because:
          difficulty_instance: resource_temporal_overlap / union_day_capacity_accepts_exact_fill_then_refuses_one_more_call
          rationale: "The named §1.8 instance accumulates billed_hours across calls on one work_date up to the per-day cap."

      - name: error_settlement_rental_basis_variant_reconciliation
