            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T05:45:00Z" }, as: PlantAdmin }
            - { call: "POST /inspector-shifts/${shift_id}/check-in", payload: {}, as: Inspector, as_user_id: "insp-01", captures: { st: $.data.status, cin: $.data.checked_in_at } }
          assert:
            - "at 04:00: error_id == ERR_SHIFT_CHECKIN_OUTSIDE_WINDOW and HTTP status == 422"
            - "at 05:45 (exactly start - 15 min, inclusive): check-in succeeds, status == ON_PREMISE, checked_in_at == 2026-08-01T05:45:00Z"

      - name: deviation_verify_by_monitor_returns_segregation_error
        claim_type: violation_to_error
        grounds: ["validations[priority=35]", "errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]", entities.Deviation.fields.verified_by]
        distinguishing_aspect: "Segregation of duties: the user who monitored the observation cannot verify the resulting deviation, even holding the QAManager role."
        test_recipe:
          setup: ["OPEN day; deviation D spawned by qa-tech-1's out-of-limit observation; corrective action logged by qa-mgr-1"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-32", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
