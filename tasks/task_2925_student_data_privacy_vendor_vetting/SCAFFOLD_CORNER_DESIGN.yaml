      - name: detection_dispositions_gated_by_classification_and_active_entry
        claim_type: Violation → Error
        grounds:
          - validations[priority=30]
          - validations[priority=41]
          - errors[ERR_WHITELIST_REQUIRES_ACTIVE_ENTRY]
          - errors[ERR_DISPOSITION_NOT_APPLICABLE]
        distinguishing_aspect: |
          On an UNAUTHORIZED detection (registered application, no catalog entry) two
          dispositions must be refused for two DIFFERENT reasons: WHITELIST fails at
          priority 30 with ERR_WHITELIST_REQUIRES_ACTIVE_ENTRY because
          matched_catalog_entry_id is null, and CONFIRM_AUTHORIZED fails at priority 41
          with ERR_DISPOSITION_NOT_APPLICABLE because the classification is not AUTHORIZED.
          BLOCK is the only sensible outcome and must succeed.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Vendor V with Application A registered and NO catalog entry."
            - "One detection D on A's domain, 30 distinct users and 120 sessions, observed 2026-07-31T12:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Brightpath Reading Co", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /applications"
              payload: { vendor_id: "${v_id}", name: "Brightpath Readers", category: "INSTRUCTIONAL_CONTENT", grade_band_low: 3, grade_band_high: 5, sso_protocol: "LTI13", accessibility_conformance_level: "WCAG21_AA", vpat_on_file: true }
              as: PrivacyOfficeAdmin
              captures: { app_id: $.data.id }
            - call: "POST /telemetry-detections"
              payload: { observed_domain: "readers.brightpath.example", application_id: "${app_id}", school_code: "ES-11", source: "MDM_INVENTORY", observed_at: "2026-07-31T12:00:00Z", distinct_user_count: 30, session_count: 120 }
              as: TelemetryAgent
              captures: { det_id: $.data.id }
          trigger:
            - call: "POST /telemetry-detections/${det_id}/triage"
              payload: { disposition: "WHITELIST", note: "No entry to whitelist against." }
              as: PrivacyOfficeAdmin
              captures: { err_wl: $.data.error_id }
            - call: "POST /telemetry-detections/${det_id}/triage"
              payload: { disposition: "CONFIRM_AUTHORIZED", note: "Classification does not support this." }
              as: PrivacyOfficeAdmin
              captures: { err_ca: $.data.error_id }
            - call: "POST /telemetry-detections/${det_id}/triage"
              payload: { disposition: "BLOCK", note: "Blocked at the filter." }
              as: PrivacyOfficeAdmin
          assert:
            - "TelemetryDetection.${det_id}.classification == UNAUTHORIZED and exposure_score == 63.00"
            - "first trigger call: status == 422 and ${err_wl} == ERR_WHITELIST_REQUIRES_ACTIVE_ENTRY"
            - "second trigger call: status == 422 and ${err_ca} == ERR_DISPOSITION_NOT_APPLICABLE"
            - "after both refusals TelemetryDetection.${det_id}.status == NEW and triaged_by_user_id is null"
            - "third trigger call: status == 200 and TelemetryDetection.${det_id}.status == BLOCKED"

      - name: validation_priority_conflict_pairs
        claim_type: Priority conflict
        grounds:
          - validations[priority=10]
          - validations[priority=42]
        excluded_because:
          difficulty_instance: review_open_state_gate_beats_analyst_capacity
          rationale: "That §1.8 priority_pair_validation_conflict instance already violates two rules on one request and proves the low-priority error wins (priority 10 ERR_REQUEST_NOT_TRIAGED over priority 42 ERR_ANALYST_CAPACITY_EXCEEDED); publication_posture_safety_beats_window_overlap covers the second pair (24 over 31)."

      - name: temporal_validation_future_window_conflict
        claim_type: Temporal validation
        grounds:
          - validations[priority=31]
        excluded_because:
          difficulty_instance: catalog_window_adjacency_legal_one_second_overlap_rejected
          rationale: "That §1.8 resource_temporal_overlap instance already pins the half-open window semantics on publication (adjacency at the shared instant succeeds, a one-second overlap is 409 ERR_AUTHORIZATION_WINDOW_OVERLAP), and incident_buffer_window_touching_endpoints_collide covers the opposite closed-interval convention."

  - section: endpoints
    instances:

      - name: sweep_moves_the_window_and_reports_its_own_counts
        claim_type: Bulk action
        grounds:
          - endpoints[POST /compliance-sweeps]
          - state_machines.CatalogEntry.PUBLISHED_to_EXPIRING_SOON
          - state_machines.CatalogEntry.EXPIRING_SOON_to_EXPIRED
          - calculations.catalog_reauthorization_due_at
          - calculations.application_catalog_visibility
        distinguishing_aspect: |
          The sweep is the ONLY thing that moves a catalog entry through its window, and
          its response counts must describe the work it actually did: the first sweep
          reports expiring_soon_count 1 / expired_count 0, the second reports
          expiring_soon_count 0 / expired_count 1. Re-running the sweep at the same clock
          must be a no-op with zero counts, which an implementation that re-reports
          already-moved rows gets wrong.
