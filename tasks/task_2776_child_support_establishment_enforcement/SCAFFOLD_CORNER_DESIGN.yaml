          - "validations[priority 5]"
          - "errors[ERR_NOT_CASE_PARTY]"
          - "errors[ERR_NOT_IWO_EMPLOYER]"
        distinguishing_aspect: >
          The three entity-backed roles share endpoints with staff roles but are
          scoped by identity rather than by role, and the scoping is field-specific:
          presenting the noncustodial party's id under the CustodialParty role is
          refused on the SAME case the id belongs to, because priority 4 compares
          against the CORRESPONDING party field. The employer scoping is the mirror
