      - name: test_chamber_aggregate_draw_over_half_open_windows
        grounds:
          - validations[priority 15 -> ERR_CHAMBER_CAPACITY_EXCEEDED]
          - entities.TestChamber.fields.power_cap_kw
          - endpoints[POST /capacity-tests]
        distinguishing_aspect: |
          A different resource entity (TestChamber) with genuinely different interval
          semantics: HALF-OPEN [start, end) windows, no exclusivity at all, and a
          CUMULATIVE capacity constraint - any number of tests may share the chamber
          while the instantaneous sum of draw_kw stays <= power_cap_kw. Adjacency is
          therefore free (a window starting exactly when another ends contributes
          nothing), which is the opposite of the bay's touching-endpoints-collide rule,
          and a sum landing exactly on the cap is accepted.
        test_recipe:
          setup:
            - "One chamber with power_cap_kw 10.00; three CERTIFIED assemblies on a lot still in ASSEMBLY (tests may be scheduled from ASSEMBLY or LOT_TESTING)."
