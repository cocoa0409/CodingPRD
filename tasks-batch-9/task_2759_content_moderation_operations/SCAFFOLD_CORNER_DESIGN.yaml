      - name: effective_confidence_constants_covered_by_difficulty_design
        claim_type: constants_applied
        grounds:
          - calculations.effective_confidence.constants
        excluded_because:
          difficulty_instance: effective_confidence_tier_and_repeat_nonlinear
          rationale: "TIER_CONFIDENCE_MULTIPLIER, REPEAT_BONUS_PER_POINT and REPEAT_BONUS_CAP_POINTS are all applied and pinned there, including the clamp-before-rounding order."
      - name: effective_confidence_threshold_boundary_covered_by_difficulty_design
        claim_type: threshold
        grounds:
          - calculations.effective_confidence
          - calculations.routing_disposition
        excluded_because:
          difficulty_instance: effective_confidence_exactly_at_auto_action_threshold
          rationale: "The at-threshold, one-tick-below and one-tick-above cases of the auto_action_threshold comparison are all asserted there on the same endpoint."
      - name: strike_points_weighted_scoring_covered_by_difficulty_design
        claim_type: weighted_scoring
        grounds:
          - calculations.strike_points_applied
        excluded_because:
          difficulty_instance: strike_points_multiply_then_ceil_once
          rationale: "The severity-weight times repeat-multiplier product, the single ceil at the end and the read-before-write ordering of lifetime_removed_count are asserted there."
      - name: account_strike_ledger_aggregation_covered_by_difficulty_design
        claim_type: aggregation
        grounds:
          - calculations.account_strike_ledger
        excluded_because:
          difficulty_instance: strike_point_ledger_restored_by_appeal_overturn
          rationale: "The running total is reconciled after an addition and again after a reversal, which is exactly the aggregation claim for account_strike_ledger."
      - name: transparency_variant_divergence_covered_by_difficulty_design
        claim_type: variant_divergence
        grounds:
          - calculations.transparency_enforcement_volumes.variants
        excluded_because:
          difficulty_instance: transparency_provisional_vs_restated_volume_diverge
          rationale: "Both variants are computed over identical data there and the volume delta is asserted field by field."
      - name: accuracy_variant_selection_covered_by_difficulty_design
        claim_type: variant_selection
        grounds:
          - calculations.reviewer_accuracy_score.variants
        excluded_because:
          difficulty_instance: reviewer_accuracy_audit_only_vs_blended_diverge
          rationale: "That instance pins which variant the gate consumes — audit_only with zero terminal appeals, blended_final as soon as one exists — which is the variant-selection claim."
      - name: transparency_variant_reconciliation_covered_by_difficulty_design
        claim_type: reconciliation
        grounds:
          - calculations.transparency_enforcement_volumes.variants
        excluded_because:
          difficulty_instance: transparency_provisional_vs_restated_volume_diverge
          rationale: "The same report row is recomputed from PROVISIONAL to RESTATED there, so the delta applied on the variant switch is already asserted."

