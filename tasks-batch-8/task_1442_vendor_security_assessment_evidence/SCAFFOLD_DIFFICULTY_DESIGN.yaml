scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: questionnaire_provisional_vs_final_scoring
        grounds:
          - calculations.questionnaire_response_score
          - state_machines.QuestionnaireResponse.SUBMITTED_to_ACCEPTED
          - entities.AssessmentCycle.fields.questionnaire_score
        distinguishing_aspect: |
          Dual variant on the QuestionnaireResponse domain: the provisional
          variant at submission applies NO revision penalty, while the final
          variant at analyst scoring subtracts 5% of raw per revision_count
          (capped at 20). Identical answers produce different scores.
        test_recipe:
          setup:
            - "Active tier policy; PUBLISHED template T with 4 items weights 1,2,3,4 covering TIER_1"
            - "Vendor V (INTERNAL/READ_ONLY/LOW -> TIER_1) with issued cycle C pinning T version 1"
            - "Response R with answers YES/PARTIAL/NO/YES; returned once then resubmitted (revision_count=1)"
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {}, tier1_reassessment_months: 36, tier2_reassessment_months: 24, tier3_reassessment_months: 12, tier4_reassessment_months: 6 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "T1", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"}, {item_key: "b", prompt: "p", weight: 2, control_domain: "d"}, {item_key: "c", prompt: "p", weight: 3, control_domain: "d"}, {item_key: "d", prompt: "p", weight: 4, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { tmpl_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${tmpl_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V1", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${tmpl_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses"
              payload: { submitted_by: "vc@x.com", answers: [ {item_key: "a", answer_value: "YES"}, {item_key: "b", answer_value: "PARTIAL"}, {item_key: "c", answer_value: "NO"}, {item_key: "d", answer_value: "YES"} ] }
              as: VendorContact
              captures: { r_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/submit"
              payload: {}
              as: VendorContact
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/return"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/submit"
              payload: {}
              as: VendorContact
          trigger:
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/score"
              payload: {}
              as: RiskAnalyst
          assert:
            - "QuestionnaireResponse.${r_id}.raw_score == 60.0"
            - "AssessmentCycle.${c_id}.questionnaire_score == 57.0 (raw 60.0 minus penalty min(60*0.05*1,20)=3.0)"
            - "provisional variant (60.0) != final variant (57.0) for identical answers"

      - name: evidence_score_standard_vs_strict_window
        grounds:
          - calculations.evidence_review_score
          - entities.AssessmentCycle.fields.evidence_score
        distinguishing_aspect: |
          Dual variant on the EvidenceArtifact domain: the standard_window
          variant (TIER_1/TIER_2) normalises the coverage gap penalty over 365
          days, while the strict_window variant (TIER_3/TIER_4) normalises over
          180 days. An artifact with gap_days=180 scores 85.21 under standard
          but 70.0 under strict for identical report data.
        test_recipe:
          setup:
            - "Two vendors: V_low TIER_1 (INTERNAL/READ_ONLY/LOW) and V_high TIER_3 (CONFIDENTIAL/OPERATOR/HIGH)"
            - "Each has a cycle that has reached EVIDENCE_REVIEW with a single SOC2_TYPE2 artifact gap_days=180, zero exceptions"
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {}, tier1_reassessment_months: 36, tier2_reassessment_months: 24, tier3_reassessment_months: 12, tier4_reassessment_months: 6 }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "TL", applies_to_tiers: ["TIER_1", "TIER_3"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { tl_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${tl_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "VL", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { vl_id: $.data.id, vl_ver: $.data.version }
            - call: "POST /vsa/vendors/${vl_id}/cycles"
              payload: { template_id: "${tl_id}", expected_vendor_version: "${vl_ver}" }
              as: RiskAnalyst
              captures: { cl_id: $.data.id }
            - call: "POST /vsa/vendors/${vl_id}/cycles/${cl_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${vl_id}/cycles/${cl_id}/responses"
              payload: { submitted_by: "vc@x.com", answers: [ {item_key: "a", answer_value: "YES"} ] }
              as: VendorContact
              captures: { rl_id: $.data.id }
            - call: "POST /vsa/vendors/${vl_id}/cycles/${cl_id}/responses/${rl_id}/submit"
              payload: {}
              as: VendorContact
            - call: "POST /vsa/vendors/${vl_id}/cycles/${cl_id}/score"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${vl_id}/cycles/${cl_id}/evidence"
              payload: { kind: "SOC2_TYPE2", period_start: "2025-02-02T00:00:00Z", period_end: "2026-02-02T00:00:00Z", issued_by: "AuditCo" }
              as: VendorContact
              captures: { el_id: $.data.id }
            - call: "POST /vsa/vendors/${vl_id}/cycles/${cl_id}/evidence/${el_id}/start-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vsa/vendors/${vl_id}/cycles/${cl_id}/evidence/${el_id}/complete-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "VH", data_sensitivity: "CONFIDENTIAL", access_level: "OPERATOR", criticality: "HIGH" }
              as: RiskAnalyst
              captures: { vh_id: $.data.id, vh_ver: $.data.version }
            - call: "POST /vsa/vendors/${vh_id}/cycles"
              payload: { template_id: "${tl_id}", expected_vendor_version: "${vh_ver}" }
              as: RiskAnalyst
              captures: { ch_id: $.data.id }
            - call: "POST /vsa/vendors/${vh_id}/cycles/${ch_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${vh_id}/cycles/${ch_id}/responses"
              payload: { submitted_by: "vc@x.com", answers: [ {item_key: "a", answer_value: "YES"} ] }
              as: VendorContact
              captures: { rh_id: $.data.id }
            - call: "POST /vsa/vendors/${vh_id}/cycles/${ch_id}/responses/${rh_id}/submit"
              payload: {}
              as: VendorContact
            - call: "POST /vsa/vendors/${vh_id}/cycles/${ch_id}/score"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${vh_id}/cycles/${ch_id}/evidence"
              payload: { kind: "SOC2_TYPE2", period_start: "2025-02-02T00:00:00Z", period_end: "2026-02-02T00:00:00Z", issued_by: "AuditCo" }
              as: VendorContact
              captures: { eh_id: $.data.id }
            - call: "POST /vsa/vendors/${vh_id}/cycles/${ch_id}/evidence/${eh_id}/start-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${vh_id}/cycles/${ch_id}/evidence/${eh_id}/complete-review"
              payload: {}
              as: RiskAnalyst
          trigger:
            - call: "POST /vsa/vendors/${vl_id}/cycles/${cl_id}/evidence-review/complete"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${vh_id}/cycles/${ch_id}/evidence-review/complete"
              payload: {}
              as: RiskAnalyst
          assert:
            - "EvidenceArtifact.${el_id}.coverage_gap_days == 180"
            - "AssessmentCycle.${cl_id}.evidence_score == 85.21 (standard_window: 100 - 180/365*30 = 85.2054... round_half_up 2dp)"
            - "AssessmentCycle.${ch_id}.evidence_score == 70.0 (strict_window: 100 - min(180,180)/180*30)"
            - "standard_window value 85.21 != strict_window value 70.0 for identical artifact"

      - name: vendor_risk_score_posture_base_variants
        grounds:
          - calculations.vendor_risk_score
          - entities.Vendor.fields.risk_score
        distinguishing_aspect: |
          Dual variant on the Vendor domain: vendor_risk_score yields a
          different value for identical alert/exception modifiers depending on
          the posture base (APPROVED=20 vs CONDITIONAL=45), so two vendors
          with the same open-alert set but different postures diverge.
        test_recipe:
          setup:
            - "Vendor VA APPROVED with one OPEN CRITICAL alert; Vendor VC CONDITIONAL with one OPEN CRITICAL alert"
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {}, tier1_reassessment_months: 36, tier2_reassessment_months: 24, tier3_reassessment_months: 12, tier4_reassessment_months: 6 }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "TL", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { tl_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${tl_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "VA", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { va_id: $.data.id, va_ver: $.data.version }
            - call: "POST /vsa/vendors/${va_id}/cycles"
              payload: { template_id: "${tl_id}", expected_vendor_version: "${va_ver}" }
              as: RiskAnalyst
              captures: { ca_id: $.data.id }
            - call: "POST /vsa/vendors/${va_id}/cycles/${ca_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${va_id}/cycles/${ca_id}/responses"
              payload: { submitted_by: "vc@x.com", answers: [ {item_key: "a", answer_value: "YES"} ] }
              as: VendorContact
              captures: { ra_id: $.data.id }
            - call: "POST /vsa/vendors/${va_id}/cycles/${ca_id}/responses/${ra_id}/submit"
              payload: {}
              as: VendorContact
            - call: "POST /vsa/vendors/${va_id}/cycles/${ca_id}/score"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${va_id}/cycles/${ca_id}/evidence"
              payload: { kind: "SOC2_TYPE2", period_start: "2025-08-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", issued_by: "AuditCo" }
              as: VendorContact
              captures: { ea_id: $.data.id }
            - call: "POST /vsa/vendors/${va_id}/cycles/${ca_id}/evidence/${ea_id}/start-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${va_id}/cycles/${ca_id}/evidence/${ea_id}/complete-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${va_id}/cycles/${ca_id}/evidence-review/complete"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${va_id}/monitoring-alerts"
              payload: { signal: "BREACH_REPORT", severity: "CRITICAL", detected_at: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ma_id: $.data.id }
          trigger:
            - call: "GET /vsa/vendors/${va_id}"
              payload: {}
              as: RiskAnalyst
              captures: { va_risk: $.data.risk_score }
          assert:
            - "Vendor.${va_id}.posture == APPROVED"
            - "Vendor.${va_id}.risk_score == 30.0 (base APPROVED 20 + OPEN CRITICAL alert 10)"
            - "a CONDITIONAL vendor with the same alert would score 55.0 (base 45 + 10); posture variant diverges"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: evidence_score_multi_input_tiered_mode_a
        grounds:
          - calculations.evidence_review_score
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction:
          evidence_review_score combines per-artifact base-by-kind, a
          min()-clamped coverage-gap penalty (different denominator per tier
          variant), and severity-weighted exception deductions, then applies a
          max(0, ...) floor. Changing any one input non-linearly shifts the
          output.
        test_recipe:
          setup:
            - "TIER_1 vendor cycle with two artifacts: SOC2_TYPE2 gap=365 and ISO27001 gap=0, plus one OPEN HIGH evidence exception"
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {}, tier1_reassessment_months: 36, tier2_reassessment_months: 24, tier3_reassessment_months: 12, tier4_reassessment_months: 6 }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "TL", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { tl_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${tl_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${tl_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses"
              payload: { submitted_by: "vc@x.com", answers: [ {item_key: "a", answer_value: "YES"} ] }
              as: VendorContact
              captures: { r_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/submit"
              payload: {}
              as: VendorContact
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/score"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence"
              payload: { kind: "SOC2_TYPE2", period_start: "2024-08-01T00:00:00Z", period_end: "2025-08-01T00:00:00Z", issued_by: "AuditCo" }
              as: VendorContact
              captures: { e1_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence"
              payload: { kind: "ISO27001", period_start: "2025-08-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", issued_by: "CertBody" }
              as: VendorContact
              captures: { e2_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e1_id}/start-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e2_id}/start-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e1_id}/complete-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence/${e2_id}/complete-review"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/exceptions"
              payload: { source: "EVIDENCE", severity: "HIGH", description: "gap in change mgmt", evidence_artifact_id: "${e1_id}" }
              as: RiskAnalyst
          trigger:
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/evidence-review/complete"
              payload: {}
              as: RiskAnalyst
          assert:
            - "AssessmentCycle.${c_id}.evidence_score == 67.5 (avg((100-30),(95-0)) = 82.5 minus HIGH deduction 15)"
            - "AssessmentCycle.${c_id}.status == REMEDIATION"

      - name: questionnaire_score_na_exclusion_ordering_mode_b
        grounds:
          - calculations.questionnaire_response_score
        distinguishing_aspect: |
          Mode (b) — evaluation-order pinned: per-item products are NOT
          rounded, NA items are excluded from BOTH numerator and denominator
          BEFORE the single final round_half_up, and only then is the revision
          penalty (a function of the rounded raw) subtracted and rounded
          again. Reordering these steps changes the cents.
        test_recipe:
          setup:
            - "TIER_1 cycle; template items weights 1,2,3,4; answers YES, NA(with justification), PARTIAL, YES; revision_count=0"
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {}, tier1_reassessment_months: 36, tier2_reassessment_months: 24, tier3_reassessment_months: 12, tier4_reassessment_months: 6 }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "TL", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"}, {item_key: "b", prompt: "p", weight: 2, control_domain: "d"}, {item_key: "c", prompt: "p", weight: 3, control_domain: "d"}, {item_key: "d", prompt: "p", weight: 4, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { tl_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${tl_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${tl_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses"
              payload: { submitted_by: "vc@x.com", answers: [ {item_key: "a", answer_value: "YES"}, {item_key: "b", answer_value: "NA", na_justification: "no such system"}, {item_key: "c", answer_value: "PARTIAL"}, {item_key: "d", answer_value: "YES"} ] }
              as: VendorContact
              captures: { r_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/submit"
              payload: {}
              as: VendorContact
          trigger:
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/score"
              payload: {}
              as: RiskAnalyst
          assert:
            - "QuestionnaireResponse.${r_id}.raw_score == 81.25 (earned 6.5 / possible 8 — NA excluded from both)"
            - "AssessmentCycle.${c_id}.questionnaire_score == 81.25 (revision_count=0 => no penalty)"
            - "possible_sum excludes weight 2 of the NA item; including it would give 65.0, so NA handling is observable"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: questionnaire_response_revision_loop
        grounds:
          - state_machines.QuestionnaireResponse.SUBMITTED_to_RETURNED
          - state_machines.QuestionnaireResponse.RETURNED_to_SUBMITTED
          - state_machines.AssessmentCycle.RESPONSE_RECEIVED_to_RESPONSE_RECEIVED
        distinguishing_aspect: |
          QuestionnaireResponse has a SUBMITTED -> RETURNED -> SUBMITTED cycle
          (revision loop) with revision_count incrementing per lap; the parent
          cycle stays RESPONSE_RECEIVED across the loop.
        test_recipe:
          setup:
            - "Issued TIER_1 cycle; response submitted once"
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {}, tier1_reassessment_months: 36, tier2_reassessment_months: 24, tier3_reassessment_months: 12, tier4_reassessment_months: 6 }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "TL", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { tl_id: $.data.id }
            - call: "POST /vsa/questionnaire-templates/${tl_id}/publish"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${tl_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses"
              payload: { submitted_by: "vc@x.com", answers: [ {item_key: "a", answer_value: "YES"} ] }
              as: VendorContact
              captures: { r_id: $.data.id }
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/submit"
              payload: {}
              as: VendorContact
          trigger:
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/return"
              payload: {}
              as: RiskAnalyst
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/responses/${r_id}/submit"
              payload: {}
              as: VendorContact
