            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R8I1-GONX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v0: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R8I1-FIRST", expected_rail_car_version: "${car_v0}" }
