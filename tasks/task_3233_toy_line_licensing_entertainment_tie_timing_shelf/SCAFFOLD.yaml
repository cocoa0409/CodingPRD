  # --- Retailer ---
  - method: POST
    path: "/toy-licensing/retailers"
    description: "Register a retailer"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region]
    output: Retailer
    side_effects: ["credit_balance_cents 0; violation_count 0"]
  - method: GET
    path: "/toy-licensing/retailers/{id}"
    description: "Get a retailer"
    roles: [PlatformAdmin, BrandManager, RetailerOps]
    code: 200
    input: []
    output: Retailer
    side_effects: []

  # --- LineReview ---
  - method: POST
    path: "/toy-licensing/line-reviews"
    description: "Schedule a line review window for a retailer (starts PENDING_APPROVAL)"
    roles: [RetailerOps]
    code: 201
    input: [retailer_id, window_start, window_end, commitment_deadline, shelf_slots_total]
    output: LineReview
    side_effects: ["status PENDING_APPROVAL; shelf_slots_used 0; half-open non-overlap enforced per retailer"]
  - method: POST
    path: "/toy-licensing/line-reviews/{id}/approve"
    description: "BrandManager co-approves a scheduled review (segregation of duties)"
    roles: [BrandManager]
    code: 200
    input: []
    output: LineReview
    side_effects: ["PENDING_APPROVAL -> CONFIRMED; version increments"]
  - method: GET
    path: "/toy-licensing/line-reviews/{id}"
    description: "Get a line review"
    roles: [PlatformAdmin, BrandManager, RetailerOps]
    code: 200
    input: []
    output: LineReview
    side_effects: []
  - method: GET
    path: "/toy-licensing/line-reviews"
    description: "List line reviews"
    roles: [PlatformAdmin, BrandManager, RetailerOps]
    code: 200
    input: ["retailer_id?", "limit?", "offset?"]
    output: "LineReview[]"
    side_effects: []

  # --- AssortmentCommitment ---
  - method: POST
    path: "/toy-licensing/assortment-commitments"
    description: "Commit shelf slots + units to a SKU inside an open review"
    roles: [BrandManager]
    code: 201
    input: [line_review_id, sku_id, committed_units, unit_price_cents, shelf_slots]
    output: AssortmentCommitment
    side_effects: ["status COMMITTED; line_review.shelf_slots_used += shelf_slots; host review must be lifecycle OPEN"]
  - method: GET
    path: "/toy-licensing/assortment-commitments/{id}"
    description: "Get a commitment"
    roles: [PlatformAdmin, BrandManager, RetailerOps]
    code: 200
    input: []
    output: AssortmentCommitment
    side_effects: []
  - method: GET
    path: "/toy-licensing/assortment-commitments"
    description: "List commitments"
    roles: [PlatformAdmin, BrandManager, RetailerOps]
    code: 200
    input: ["line_review_id?", "sku_id?", "status?", "limit?", "offset?"]
    output: "AssortmentCommitment[]"
    side_effects: []
  - method: POST
    path: "/toy-licensing/assortment-commitments/{id}/cancel"
    description: "Cancel a commitment while the review is open"
    roles: [BrandManager]
    code: 200
    input: []
    output: AssortmentCommitment
    side_effects: ["COMMITTED/AT_RISK -> CANCELLED; shelf_slots_used decremented; version increments"]
  - method: POST
    path: "/toy-licensing/assortment-commitments/{id}/reinstate"
    description: "Reinstate an AT_RISK commitment while the review is open"
    roles: [BrandManager]
    code: 200
    input: []
    output: AssortmentCommitment
    side_effects: ["AT_RISK -> COMMITTED; version increments"]

  # --- Shipment ---
  - method: POST
    path: "/toy-licensing/shipments"
    description: "Plan a shipment against a commitment"
    roles: [BrandManager]
    code: 201
    input: [commitment_id, planned_ship_date, units]
    output: Shipment
    side_effects: ["status PLANNED; street_date copied from SKU line target_street_date; sold_units 0; penalty NONE"]
  - method: GET
    path: "/toy-licensing/shipments/{id}"
    description: "Get a shipment"
    roles: [PlatformAdmin, BrandManager, RetailerOps]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: GET
    path: "/toy-licensing/shipments"
    description: "List shipments"
    roles: [PlatformAdmin, BrandManager, RetailerOps]
    code: 200
    input: ["commitment_id?", "status?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []
  - method: POST
    path: "/toy-licensing/shipments/{id}/record_sale"
    description: "Record sell-through; assesses embargo penalty when clock < street_date"
    roles: [RetailerOps]
    code: 200
    input: [units_sold]
    output: Shipment
    side_effects: ["embargo_penalty runs; retailer.credit_balance_cents and violation_count updated on breach; version increments"]
  - method: POST
    path: "/toy-licensing/shipments/{id}/waive_penalty"
    description: "Waive an open embargo penalty"
    roles: [BrandManager]
    code: 200
    input: []
    output: Shipment
    side_effects: ["penalty_status OPEN -> WAIVED; retailer.credit_balance_cents += penalty_cents; violation_count NOT decremented; version increments"]

  # --- SafetyTest ---
  - method: POST
    path: "/toy-licensing/safety-tests"
    description: "Submit a SKU for safety testing"
    roles: [SafetyEngineer]
    code: 201
    input: [sku_id, test_type, lab_name, claimed_age_grade_months]
    output: SafetyTest
    side_effects: ["status SUBMITTED; sku.safety_status -> TESTING"]
  - method: GET
    path: "/toy-licensing/safety-tests/{id}"
    description: "Get a safety test"
    roles: [PlatformAdmin, BrandManager, SafetyEngineer]
    code: 200
    input: []
    output: SafetyTest
    side_effects: []
  - method: GET
    path: "/toy-licensing/safety-tests"
    description: "List safety tests"
    roles: [PlatformAdmin, BrandManager, SafetyEngineer]
    code: 200
    input: ["sku_id?", "status?", "limit?", "offset?"]
    output: "SafetyTest[]"
    side_effects: []
  - method: POST
    path: "/toy-licensing/safety-tests/{id}/record_result"
    description: "Record lab outcome; drives SKU safety_status"
    roles: [SafetyEngineer]
    code: 200
    input: [outcome, result_age_grade_months, validated_claims]
    output: SafetyTest
    side_effects: ["PASS with age/claims conformance -> PASSED else FAILED; SKU fields updated per Sku machine"]

  # --- Test-driving endpoints ---
  - method: POST
    path: "/toy-licensing/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-09-01T00:00:00Z before any set call; the clock never falls back to wall-clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Recomputes Property.lifecycle and LineReview.lifecycle; COMMITTED ToyLines whose target_street_date <= clock auto-advance to ON_SHELF"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or entity_backed ownership check failed (e.g. RetailerOps acting on another retailer's shipment)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in wrong state for the requested lifecycle action (agreement not NEGOTIATION on activate, line gates unmet, shipment already fully sold, etc.)" }
  - { id: ERR_SAFETY_GATE, http: 422, condition: "Safety rule violated: age grade outside 36..168, packaging claim outside enum, record_result PASS with age/claims mismatch, or advance to TOOLED with a non-PASSED SKU" }
  - { id: ERR_CONFIDENTIALITY_BREACH, http: 422, condition: "Licensed-line artifact creation attempted while property.lifecycle == CONFIDENTIAL (or STRICT studio before reveal_date)" }
  - { id: ERR_CONSTRAINT_VIOLATION, http: 422, condition: "Structural integrity violated: sku not under toy_line on tooling order, commitment into non-OPEN review, invalid review window ordering" }
  - { id: ERR_REVIEW_WINDOW_OVERLAP, http: 409, condition: "Line review window overlaps an existing window for the same retailer under half-open semantics" }
  - { id: ERR_FACTORY_CAPACITY_EXCEEDED, http: 409, condition: "Tooling order would push the factory's production-month load beyond capacity_units_per_month" }
  - { id: ERR_SHELF_OVERFLOW, http: 422, condition: "Commitment would push shelf_slots_used beyond shelf_slots_total" }
  - { id: ERR_SHIPMENT_OVERSOLD, http: 422, condition: "sold_units + units_sold exceeds shipment.units on record_sale" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version on an OCC-guarded endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or invalid enum member" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Internal operator; owns studios, factories, retailers, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /toy-licensing/studios"
      - "POST /toy-licensing/factories"
      - "POST /toy-licensing/retailers"
      - "POST /toy-licensing/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: BrandManager
    description: "Toy-company line owner; drafts agreements, manages lines, SKUs, tooling, commitments, shipments"
    identity: "opaque"
    exclusive_operations:
      - "POST /toy-licensing/license-agreements (create)"
      - "POST /toy-licensing/license-agreements/{id}/amend"
      - "POST /toy-licensing/license-agreements/{id}/close_quarter"
      - "POST /toy-licensing/line-reviews/{id}/approve"
      - "POST /toy-licensing/toy-lines and all line lifecycle actions"
      - "POST /toy-licensing/skus and PATCH /toy-licensing/skus/{id}"
      - "POST /toy-licensing/tooling-orders and scrap/complete"
      - "POST /toy-licensing/assortment-commitments and cancel/reinstate"
      - "POST /toy-licensing/shipments (create) and waive_penalty"
    shared_operations:
      - "POST /toy-licensing/license-agreements/{id}/activate (only when approval_rights_required == false)"
      - "All GET endpoints"
  - name: StudioRep
    description: "Licensor representative; registers properties, shifts releases, approves agreements and amendments"
    identity: "opaque"
    exclusive_operations:
      - "POST /toy-licensing/properties"
      - "POST /toy-licensing/properties/{id}/shift_release"
      - "POST /toy-licensing/license-agreements/{id}/amendments/approve"
      - "POST /toy-licensing/license-agreements/{id}/amendments/reject"
    shared_operations:
      - "POST /toy-licensing/license-agreements/{id}/activate"
      - "All GET endpoints"
  - name: RetailerOps
    description: "Retail chain operator; schedules own line reviews and records sell-through on own shipments"
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /toy-licensing/line-reviews"
      - "POST /toy-licensing/shipments/{id}/record_sale (only for shipments whose host review belongs to X-User-ID)"
    shared_operations:
      - "All GET endpoints"
  - name: SafetyEngineer
    description: "Accredited lab liaison; submits safety tests and records results"
    identity: "opaque"
    exclusive_operations:
      - "POST /toy-licensing/safety-tests"
      - "POST /toy-licensing/safety-tests/{id}/record_result"
    shared_operations:
      - "All GET endpoints"

# =============================================================================
# Compensating-action invariants (Rule 9 anchors; exercised by §1.8)
# =============================================================================
invariants:
  - name: advance_recoup_conservation
    formula: |
      For any LicenseAgreement: advance_guarantee_cents - recouped_cents >= 0
      at all times, and close_quarter changes recouped_cents by exactly
      min(earned_cents, advance_guarantee_cents - recouped_cents). A waived or
      re-run quarter must never push recouped_cents above advance_guarantee_cents.
  - name: embargo_ledger_conservation
    formula: |
      For any Retailer: credit_balance_cents == -(sum of penalty_cents over
      shipments with penalty_status == OPEN belonging to that retailer's
      reviews). Assessing a penalty debits the ledger; waiving the same
      penalty credits back exactly penalty_cents; net drift after
      assess+waive must be zero, and violation_count is monotonic
      (waive does NOT decrement it).
  - name: closeout_shelf_conservation
    formula: |
      For any LineReview: shelf_slots_used == sum of shelf_slots over its
      commitments with status in {COMMITTED, AT_RISK}. Enter_closeout cancels
      a line's commitments and frees exactly their slots; a later
      exit_closeout + fresh commitment may re-occupy freed slots, so
      enter_closeout followed by exit_closeout leaves shelf_slots_used
      strictly lower by the cancelled commitments' slots.
