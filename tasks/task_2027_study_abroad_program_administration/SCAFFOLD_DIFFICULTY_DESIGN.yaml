scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: billing_home_tuition_vs_program_fee_charge
        grounds:
          - calculations.billing_charge_calculation
          - entities.BillingStatement.fields.charge_cents
          - state_machines.Application.APPROVED_to_COMMITTED
        distinguishing_aspect: |
          Billing-domain dual variant: two students with identical aid awards
          (900000 cents) commit to two programs that differ only in
          billing_model; the HOME_TUITION program charges 1540000 cents while
          the PROGRAM_FEE (1800000) program charges 940000 cents — same student
          data, two valid billing algorithms, different results.
        test_recipe:
          setup:
            - "FR program: PROGRAM_FEE model, fee 1800000, agreement insurance_required=true; student aid 900000 -> committed"
            - "JP program: HOME_TUITION model, agreement insurance_required=true; student aid 900000 -> committed"
            - "logical clock at default 2026-08-01T00:00:00Z (before the 2026-11-01 deadline)"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_fr: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_fr}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_fr}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_fr: $.data.id }
            - call: "POST /api/v1/programs/${prog_fr}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Fee Student", email: "fee@uni.edu", gpa: 3.10, conduct_standing: "GOOD_STANDING", aid_award_cents: 900000 }
              as: ProgramCoordinator
              captures: { stu_fee: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_fee}", program_id: "${prog_fr}" }
              as: Student
              as_user_id: "${stu_fee}"
              captures: { app_fee: $.data.id }
            - call: "POST /api/v1/applications/${app_fee}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
            - call: "POST /api/v1/applications/${app_fee}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
            - call: "POST /api/v1/applications/${app_fee}/commit"
              as: Student
              as_user_id: "${stu_fee}"
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Kyoto University", country_code: "JP", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 1.0, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_jp: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_jp}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_jp}", name: "Kyoto Year 2027", country_code: "JP", host_institution: "Kyoto University", term: "ACADEMIC_YEAR", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "HOME_TUITION", min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_jp: $.data.id }
            - call: "POST /api/v1/programs/${prog_jp}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Tuition Student", email: "tuition@uni.edu", gpa: 3.10, conduct_standing: "GOOD_STANDING", aid_award_cents: 900000 }
              as: ProgramCoordinator
              captures: { stu_tui: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_tui}", program_id: "${prog_jp}" }
              as: Student
              as_user_id: "${stu_tui}"
              captures: { app_tui: $.data.id }
            - call: "POST /api/v1/applications/${app_tui}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
            - call: "POST /api/v1/applications/${app_tui}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
            - call: "POST /api/v1/applications/${app_tui}/commit"
              as: Student
              as_user_id: "${stu_tui}"
          trigger:
            - call: "GET /api/v1/billing-statements"
              payload: { application_id: "${app_fee}" }
              as: BursarOffice
              captures: { fee_base: "$.data[0].base_cents", fee_aid: "$.data[0].aid_portable_cents", fee_charge: "$.data[0].charge_cents", fee_out: "$.data[0].outstanding_cents" }
            - call: "GET /api/v1/billing-statements"
              payload: { application_id: "${app_tui}" }
              as: BursarOffice
              captures: { tui_base: "$.data[0].base_cents", tui_aid: "$.data[0].aid_portable_cents", tui_charge: "$.data[0].charge_cents" }
          assert:
            - "PROGRAM_FEE statement: base_cents == 1800000, aid_portable_cents == 900000 (min(900000, floor(0.60*1800000)=1080000)), charge_cents == 940000, outstanding_cents == 940000"
            - "HOME_TUITION statement: base_cents == 2400000, aid_portable_cents == 900000 (min(900000, floor(1.00*2400000))), charge_cents == 1540000"
            - "identical student aid data yields ${tui_charge} - ${fee_charge} == 600000 cents delta across the two variants"
      - name: credit_posting_provisional_vs_final
        grounds:
          - calculations.transfer_credit_conversion
          - entities.CreditPosting.fields.provisional_credits
          - entities.CreditPosting.fields.final_credits
        distinguishing_aspect: |
          Credit-domain dual variant (different entity domain from billing):
          one transcript (HIST310 host 3 credits grade 3.0; ART220 host 5
          credits grade 1.7; factor 0.75) yields provisional_credits == 6.5
          counting all lines but final_credits == 2.5 counting only
          grade >= 2.0 lines — same input set, two valid inclusion rules,
          different results.
        test_recipe:
          setup:
            - "FR program (fee model, factor 0.75 agreement) with a committed, insured, departed, returned application"
            - "two APPROVED course pre-approvals: HIST310 host_credits 3, ART220 host_credits 5"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Credit Student", email: "credit@uni.edu", gpa: 3.20, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/course-preapprovals"
              payload: { course_code: "HIST310", course_title: "Modern French History", host_credits: 3, expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { cpa1_id: $.data.id }
            - call: "POST /api/v1/course-preapprovals/${cpa1_id}/review"
              payload: { decision: "APPROVED" }
              as: FacultyApprover
              as_user_id: "fac-1"
            - call: "GET /api/v1/applications/${app_id}"
              as: ProgramCoordinator
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/course-preapprovals"
              payload: { course_code: "ART220", course_title: "Studio Art", host_credits: 5, expected_application_version: "${app_v2}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { cpa2_id: $.data.id }
            - call: "POST /api/v1/course-preapprovals/${cpa2_id}/review"
              payload: { decision: "APPROVED" }
              as: FacultyApprover
              as_user_id: "fac-1"
            - call: "POST /api/v1/applications/${app_id}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
            - call: "POST /api/v1/applications/${app_id}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
            - call: "POST /api/v1/applications/${app_id}/commit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /api/v1/insurance-enrollments"
              payload: { application_id: "${app_id}", provider: "GlobalCare", coverage_start_date: "2027-01-01T00:00:00Z", coverage_end_date: "2027-05-31T00:00:00Z" }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /api/v1/applications/${app_id}/lifecycle"
              payload: { action: "DEPART" }
              as: ProgramCoordinator
            - call: "POST /api/v1/applications/${app_id}/lifecycle"
              payload: { action: "RECORD_RETURN" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /api/v1/applications/${app_id}/credit-postings"
              payload: { lines: [ { course_preapproval_id: "${cpa1_id}", grade_points: 3.0 }, { course_preapproval_id: "${cpa2_id}", grade_points: 1.7 } ] }
              as: FacultyApprover
              as_user_id: "fac-1"
              captures: { post_id: $.data.id, prov: $.data.provisional_credits, fin: $.data.final_credits }
          assert:
            - "CreditPosting.${post_id}.provisional_credits == 6.5 (2.5 + 4.0, all lines included)"
            - "CreditPosting.${post_id}.final_credits == 2.5 (ART220 grade 1.7 < 2.0 contributes 0)"
            - "same lines produce divergent variant outputs: ${prov} != ${fin}, delta == 4.0"

  - rule_id: combinatorial_formula
    instances:
      - name: billing_aid_cap_min_branch
        grounds:
          - calculations.billing_charge_calculation
          - validations[priority=11]
        distinguishing_aspect: |
          Mode (a) combinatorial formula: >= 3 inputs (billing_model branch,
          insurance_required branch, aid snapshot) with a non-linear nested
          min(); a student whose aid (1500000) exceeds floor(0.60 * 1800000)
          lands on the cap branch, so aid_portable_cents == 1080000 and
          charge_cents == 760000 — not the uncapped 340000.
        test_recipe:
          setup:
            - "FR PROGRAM_FEE program (fee 1800000, insurance required) OPEN"
            - "student with aid_award_cents 1500000, committed"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Rich Aid", email: "rich@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING", aid_award_cents: 1500000 }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
            - call: "POST /api/v1/applications/${app_id}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
            - call: "POST /api/v1/applications/${app_id}/approve"
              as: ProgramCoordinator
              as_user_id: "coord-b"
            - call: "POST /api/v1/applications/${app_id}/commit"
              as: Student
              as_user_id: "${stu_id}"
          trigger:
            - call: "GET /api/v1/billing-statements"
              payload: { application_id: "${app_id}" }
              as: BursarOffice
              captures: { s_base: "$.data[0].base_cents", s_prem: "$.data[0].insurance_premium_cents", s_fee: "$.data[0].application_fee_cents", s_aid: "$.data[0].aid_portable_cents", s_charge: "$.data[0].charge_cents", s_out: "$.data[0].outstanding_cents" }
          assert:
            - "aid_portable_cents == 1080000 (cap branch: floor(0.60 * 1800000) < 1500000 snapshot)"
            - "charge_cents == 760000 (1800000 + 35000 + 5000 - 1080000)"
            - "outstanding_cents == 760000 at ISSUED"
      - name: credit_rounding_per_course_then_sum
        grounds:
          - calculations.transfer_credit_conversion
          - entities.CoursePreApproval.fields.home_credits_est
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode from the min()-branch
          instance): with factor 0.75, host 3 -> raw 2.25 -> 2.5 and host 5 ->
          raw 3.75 -> 4.0 when rounding EACH course to the nearest 0.5 before
          summing; the alternate order (sum raw 6.0, then round) would give
          6.0. The scaffold pins per-course-then-sum, so home_credits_est must
          be 2.5 and 4.0 individually.
        test_recipe:
          setup:
            - "FR program OPEN, agreement factor 0.75; one SUBMITTED application"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Round Student", email: "round@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id, app_v: $.data.version }
          trigger:
            - call: "POST /api/v1/applications/${app_id}/course-preapprovals"
              payload: { course_code: "HIST310", course_title: "Modern French History", host_credits: 3, expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { est1: $.data.home_credits_est }
            - call: "GET /api/v1/applications/${app_id}"
              as: ProgramCoordinator
              captures: { app_v2: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/course-preapprovals"
              payload: { course_code: "ART220", course_title: "Studio Art", host_credits: 5, expected_application_version: "${app_v2}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { est2: $.data.home_credits_est }
          assert:
            - "HIST310 home_credits_est == 2.5 (round_half_up(2.25 to nearest 0.5))"
            - "ART220 home_credits_est == 4.0 (round_half_up(3.75 to nearest 0.5))"
            - "per-course-then-sum yields 6.5, provably different from sum-then-round 6.0 for the same inputs"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_loop
        grounds:
          - state_machines.Application.SUBMITTED_to_RETURNED_FOR_REVISION
          - state_machines.Application.RETURNED_FOR_REVISION_to_SUBMITTED
        distinguishing_aspect: |
          Application's machine is cyclic: SUBMITTED -> RETURNED_FOR_REVISION
          -> SUBMITTED loops back to a prior state, and the loop resets
          clearance_recorded_by to null so a fresh clearance review is
          required after resubmission.
        test_recipe:
          setup:
            - "FR program OPEN; one application SUBMITTED"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Loop Student", email: "loop@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/v1/applications/${app_id}/clearance"
              payload: { decision: "RETURNED_FOR_REVISION", notes: "essay incomplete" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
              captures: { st_returned: $.data.status, clr1: $.data.clearance_recorded_by }
            - call: "POST /api/v1/applications/${app_id}/resubmit"
              as: Student
              as_user_id: "${stu_id}"
              captures: { st_back: $.data.status, clr2: $.data.clearance_recorded_by }
            - call: "POST /api/v1/applications/${app_id}/clearance"
              payload: { decision: "CLEARED" }
              as: ProgramCoordinator
              as_user_id: "coord-a"
              captures: { st_cleared: $.data.status }
          assert:
            - "after RETURNED_FOR_REVISION: status == RETURNED_FOR_REVISION and clearance_recorded_by == coord-a"
            - "after resubmit: status == SUBMITTED (cycle back to a prior state) and clearance_recorded_by == null"
            - "loop is reusable: second clearance reaches CLEARED"
      - name: course_preapproval_revision_loop
        grounds:
          - state_machines.CoursePreApproval.PENDING_to_NEEDS_REVISION
          - state_machines.CoursePreApproval.NEEDS_REVISION_to_PENDING
        distinguishing_aspect: |
          CoursePreApproval's machine is cyclic on a DIFFERENT entity than
          Application: PENDING -> NEEDS_REVISION -> PENDING, and the revise
          transition recomputes home_credits_est from the new host_credits
          (4 -> 3.0 becomes 5 -> 4.0 at factor 0.75).
        test_recipe:
          setup:
            - "FR program OPEN (factor 0.75); one SUBMITTED application"
          setup_api_calls:
            - call: "POST /api/v1/partner-agreements"
              payload: { host_institution: "Universite Lyon", country_code: "FR", effective_from: "2026-01-01T00:00:00Z", effective_to: "2028-12-31T23:59:59Z", credit_conversion_factor: 0.75, insurance_required: true }
              as: ProgramCoordinator
              captures: { agr_id: $.data.id }
            - call: "POST /api/v1/partner-agreements/${agr_id}/activate"
              as: ProgramCoordinator
            - call: "POST /api/v1/programs"
              payload: { partner_agreement_id: "${agr_id}", name: "Lyon Spring 2027", country_code: "FR", host_institution: "Universite Lyon", term: "SPRING", start_date: "2027-01-10T00:00:00Z", end_date: "2027-05-10T00:00:00Z", application_deadline: "2026-11-01T00:00:00Z", capacity: 30, billing_model: "PROGRAM_FEE", program_fee_cents: 1800000, min_gpa: 2.75 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /api/v1/programs/${prog_id}/publish"
              as: ProgramCoordinator
            - call: "POST /api/v1/students"
              payload: { full_name: "Revise Student", email: "revise@uni.edu", gpa: 3.00, conduct_standing: "GOOD_STANDING", aid_award_cents: 0 }
              as: ProgramCoordinator
              captures: { stu_id: $.data.id }
            - call: "POST /api/v1/applications"
              payload: { student_id: "${stu_id}", program_id: "${prog_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /api/v1/applications/${app_id}/course-preapprovals"
