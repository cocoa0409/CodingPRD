        distinguishing_aspect: "The gate must be able to refuse a publication that satisfies every other precondition."
        excluded_because:
          difficulty_instance: publication_blocked_while_a_filed_appeal_holds_the_consensus_gate
          rationale: "That §1.8 constraint-interaction instance files an appeal against a CONSENSUS_APPROVED work item whose draft, disposition and IP state are all publishable, asserts ERR_CONSENSUS_GATE_BLOCKED on the publish attempt and then asserts that denying the appeal reopens the gate and lets the same call through — so the code is already triggered from both sides."

