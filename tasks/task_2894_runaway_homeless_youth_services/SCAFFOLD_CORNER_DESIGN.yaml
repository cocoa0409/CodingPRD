              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { idem_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${idem_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { idem_gn_id: "$.data[0].id" }
            - call: "POST /ryhs/guardian-notifications/${idem_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/guardian-notifications/${idem_gn_id}/resolve"
              payload: { outcome: "CONTACTED" }
