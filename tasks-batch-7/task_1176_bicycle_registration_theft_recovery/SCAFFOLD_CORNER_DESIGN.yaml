            - { call: "POST /registry/events", payload: { host_org_id: "${org_id}", title: "E1", venue: "Quad", starts_at: "2026-06-01T09:00:00Z", ends_at: "2026-06-01T12:00:00Z", capacity: 5 }, as: Admin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_HOST_NOT_CAMPUS (observed ${err})"

      - name: report_already_open_constraint
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_REPORT_ALREADY_OPEN]"]
        distinguishing_aspect: "A second theft report on a bicycle with an UNDER_REVIEW report fails ERR_REPORT_ALREADY_OPEN — one non-terminal report per bicycle."
        test_recipe:
          setup: ["Owner o1 with Bicycle b1; report r1 UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "ROP100", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 40000, photo_url: "https://x/p.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-03T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}" }
          trigger:
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${b1_id}", occurred_at: "2026-05-04T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { err: $.data.error_id } }
