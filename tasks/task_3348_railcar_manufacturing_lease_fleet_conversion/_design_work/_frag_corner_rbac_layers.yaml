          - POST /api/v1/retrofit-programs/{id}/void
        distinguishing_aspect: "RegulatoryRetrofitist drives four of its five exclusive_operations plus its shared POST /car-types in one chain — mandate opened PLANNED at cost 0, coverage row bound, started to IN_PROGRESS and voided — with each write advancing the program's version by exactly one."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
