  - rule_id: resource_temporal_overlap
    instances:
      - name: therapist_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=8]
          - errors[ERR_THERAPIST_DOUBLE_BOOKED]
          - entities.Appointment.fields.start_time
          - entities.Appointment.fields.end_time
        distinguishing_aspect: |
          Therapist resource uses PLAIN half-open intervals [start, end): a new
          appointment whose start_time exactly equals an existing appointment's
          end_time (09:45 == 09:45) does NOT conflict (adjacency allowed), while a
          true overlap (09:30 inside 09:00-09:45) is rejected
          ERR_THERAPIST_DOUBLE_BOOKED. Resource = Therapist; no buffer.
        test_recipe:
          setup:
            - "SLP therapist with one SCHEDULED appointment 09:00-09:45 for child A on 2026-06-08. Authorization with visits for a SECOND child B booked back-to-back at 09:45 (adjacent, allowed)."
