  - rule_id: priority_pair_validation_conflict
    instances:

      - name: not_sellable_state_beats_insufficient_seats_constraint
        grounds:
          - validations.priority_15_ERR_TICKET_CLASS_NOT_SELLABLE
          - validations.priority_59_ERR_INSUFFICIENT_SEATS
          - state_machines.TicketClass.status
        distinguishing_aspect: |
          A single POST /reservations violates a priority 15 `state` rule and a
          priority 59 `business_constraint` rule at once: the class is PAUSED
          and it also has only 1 of the 2 requested seats available. The state
          error must win. Resuming the class without touching the seat pool then
          surfaces the constraint error from the identical request, proving both
          conditions were genuinely live. Category pair: state versus
          business_constraint.
