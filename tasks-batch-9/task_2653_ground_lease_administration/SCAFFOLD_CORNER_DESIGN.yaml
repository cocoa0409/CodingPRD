            - "trigger[5] returns 201, trigger[6] returns 200 with transfer_fee_total_cents 1230000 (gross 1200000 at 300 bps on 40000000 plus the 250 bps admin charge 30000) and trigger[7] returns 200 with the transfer ACTIVE"
            - "after trigger[7] GET /portfolio/leases/${lease_a} reports lessee_id equal to ${lessee_b} - the assignment rewrote the tenant of record"
