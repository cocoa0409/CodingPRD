  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: station_committed_ledger_restored_by_cancelling_hired_overtime_seat
        grounds:
          - calculations.ot_committed_ledger
          - state_machines.ShiftAssignment.SCHEDULED_to_CANCELLED
          - state_machines.Vacancy.FILLED_to_OPEN
          - entities.Station.fields.ot_committed_cents
          - endpoints["POST /fire-ops/shift-assignments/{shift_assignment_id}/cancel"]
        distinguishing_aspect: |
          The conserved quantity is money — Station.ot_committed_cents: hiring
          encumbers 152532 cents and cancelling the resulting seat must return the
          ledger to exactly 0 with no residue, while also unwinding the vacancy's
          fill pointer and the shift's staffing counters.
        test_recipe:
          setup:
            - "Station 58 with staffing floor 1, a 9,000,000-cent budget over 2026-08-01 .. 2026-09-30, one company ENGINE-58 (minimum_crew_size 2, no required certifications) and a VOLUNTARY_OT roster scoped NONE."
            - "Member ff58a: platoon C, Kelly 1, seniority 1, rate 4237 cents, voluntary_ot_hours_charged 0."
            - "Member ff58b: platoon C, Kelly 4, seniority 9, rate 5000 cents, the company officer, seated REGULAR first so that only ff58a remains as an overtime candidate."
            - "The 2026-08-11 shift is published; after ff58b's REGULAR seat, exactly one OPEN vacancy remains, so the shift is HIRING with assigned_headcount 1 and leave_floor_headcount 1."
            - "ff58a accepted a 24-hour VOLUNTARY offer priced at 152532 cents (4237 * 24 * 1.5, no certification or fatigue uplift), so the vacancy is FILLED, the shift is STAFFED and Station.ot_committed_cents is 152532."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 58", battalion_code: "C2", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 9000000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-09-30" }
              as: StaffingOfficer
              captures: { st58: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st58}", unit_designation: "ENGINE-58", apparatus_type: "ENGINE", minimum_crew_size: 2, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng58: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st58}", full_name: "K Kaur", rank: "FIREFIGHTER", platoon: "C", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4237 }
              as: StaffingOfficer
              captures: { ff58a: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st58}", full_name: "L Lund", rank: "CAPTAIN", platoon: "C", seniority_rank: 9, kelly_day_cycle_position: 4, certifications: [], hourly_rate_cents: 5000 }
              as: StaffingOfficer
              captures: { ff58b: "$.data.id" }
            - call: "GET /fire-ops/work-periods"
              payload: { firefighter_id: "${ff58a}" }
              as: PayrollAnalyst
              captures: { wp58a: "$.data[0].id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st58}", roster_type: "VOLUNTARY_OT", certification_scope: "NONE" }
              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st58}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh58: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh58}/publish"
              payload: {}
              as: StaffingOfficer
              captures: { sh58_v0: "$.data.version" }
            - call: "POST /fire-ops/shift-assignments"
              payload: { duty_shift_id: "${sh58}", firefighter_id: "${ff58b}", apparatus_id: "${eng58}", assignment_type: "REGULAR", seat_certification: "NONE", scheduled_hours: 24, expected_duty_shift_version: "${sh58_v0}" }
              as: CompanyOfficer
              as_user_id: "${ff58b}"
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh58}", status: "OPEN" }
              as: StaffingOfficer
              captures: { vac58: "$.data[0].id" }
            - call: "POST /fire-ops/vacancies/${vac58}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { off58: "$.data.id" }
            - call: "POST /fire-ops/overtime-offers/${off58}/response"
              payload: { response: "ACCEPT" }
              as: Firefighter
              as_user_id: "${ff58a}"
            - call: "GET /fire-ops/shift-assignments"
              payload: { source_offer_id: "${off58}" }
              as: StaffingOfficer
              captures: { asg58ot: "$.data[0].id" }
          trigger:
            - call: "POST /fire-ops/shift-assignments/${asg58ot}/cancel"
              payload: { reason: "member reported sick before the tour began" }
              as: CompanyOfficer
              as_user_id: "${ff58b}"
          assert:
            - "Before the trigger Station.${st58}.ot_committed_cents == 152532; after it the value is exactly 0 — the compensating credit equals the original encumbrance to the cent"
            - "Station.${st58}.ot_actual_cents == 0 and Station.${st58}.budget_posture == \"WITHIN\""
            - "ShiftAssignment.${asg58ot}.status == \"CANCELLED\" and projected_premium_cents == 152532 (the historical record is preserved, only the ledger is credited)"
            - "Vacancy.${vac58}.status == \"OPEN\" and Vacancy.${vac58}.filled_by_assignment_id == null"
            - "OvertimeOffer.${off58}.status == \"ACCEPTED\" — the accepted offer is not retroactively rewritten"
            - "DutyShift.${sh58}.status == \"HIRING\", assigned_headcount == 1, open_vacancy_count == 1, staffing_gap == 1, staffing_posture == \"SHORT\""
            - "WorkPeriod.${wp58a}.scheduled_hours == 0, adjusted_scheduled_hours == 0, projected_flsa_overtime_hours == 0 and flsa_premium_cents == 0"
            - "Firefighter.${ff58a}.pending_offer_count == 0 and voluntary_ot_hours_charged == 24 — the hours ledger that governs hiring order is deliberately NOT credited back"

      - name: work_period_scheduled_hours_restored_by_leave_revoke
