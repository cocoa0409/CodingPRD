            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "orgB", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { orgB_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${orgA_id}", name: "pubrepo" }
              as: OrgAdmin
              captures: { repo_id: $.data.id, repo_v: $.data.version }
            - call: "POST /organizations/${orgB_id}/runners"
              payload: { name: "rB", os_type: "LINUX", allowed_on_public_repos: false }
              as: OrgAdmin
              captures: { runner_id: $.data.id }
            - call: "POST /runners/${runner_id}/heartbeat"
              payload: {}
              as: RunnerAgent
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "CONFIGURE" }
              as: EnterpriseAdmin
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "ENFORCE" }
              as: EnterpriseAdmin
            - call: "PATCH /repositories/${repo_id}"
              payload: { visibility: "PUBLIC" }
              as: OrgAdmin
          trigger:
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "SELF_HOSTED", os_type: "LINUX", requested_minutes: 10, runner_id: "${runner_id}", expected_repository_version: "${repo_v} + 1" }
              as: OrgAdmin
              captures: { err: $.data.error_id }
          assert:
