# Scaffold Difficulty Design (Test Targeting Index) - task_2902_dog_show_performance_trial_management
# Nine §0.5 difficulty rules, two differentiated instances each (18 instances).
# Every literal in an `assert:` line was computed by executing the matching
# calculations[].formula with its constants; see the per-instance comments.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: entry_fee_provisional_versus_final_on_show_ledger
        grounds:
          - calculations.entry_fee_assessment
          - state_machines.Entry.RECEIVED_to_CONFIRMED
          - state_machines.ShowClass.OPEN_to_CLOSED
          - entities.Entry.fields.fee_basis
          - entities.Show.fields.fee_assessment_delta_cents
        distinguishing_aspect: |
          This instance is dual-variant on MONEY carried by Entry and the Show ledger: the provisional
          variant sees only the entries confirmed so far, so the household discount reaches entry 3 alone
          (11813 cents charged), while the final variant sees the whole confirmed population at once and
          applies the same discount retroactively to entries 1 and 2 (10971 cents charged, delta -842).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z, inside the show's entry window"
            - "One ACTIVE club, one ACTIVE handler, one ACTIVE judge approved for SPORTING"
            - "One APPROVED CONFORMATION show with championship_points_scale SCALE_A"
            - "One OPEN BREED class GR-OPEN-D with entry_limit 10, assigned to a CONFIRMED panel slot"
            - "Three dogs of the same handler, each entered in that class and CONFIRMED in creation order"
            - "After the third confirmation: Entry 1 = 4663, Entry 2 = 3763, Entry 3 = 3387, Show.fee_charged_cents = 11813, every fee_basis = PROVISIONAL"
          setup_api_calls:
            - call: "POST /dog-shows/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/clubs"
              payload: { name: "Northshore Kennel Club", club_code: "NSKC", region_code: "NE", annual_event_allowance: 2 }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { club_id: $.data.id }
            - call: "POST /dog-shows/handlers"
              payload: { handler_name: "Ada Vance", member_number: "M-1001", region_code: "NE" }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { h1_id: $.data.id }
            - call: "POST /dog-shows/judges"
              payload: { judge_number: "J-77", full_name: "Rex Calder", approved_breed_group_codes: ["SPORTING"], approved_performance_disciplines: ["OBEDIENCE"], home_region_code: "NE", max_daily_dog_count: 175 }
              as: SanctionOfficer
              as_user_id: "so-alpha"
              captures: { j1_id: $.data.id, j1_v: $.data.version }
            - call: "POST /dog-shows/shows"
              payload: { club_id: "${club_id}", show_name: "Autumn Classic", show_date: "2026-09-12", show_type: "CONFORMATION", venue_name: "Northshore Park", outdoor_venue: false, entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T23:59:59Z", max_total_entries: 100, championship_points_scale: "SCALE_A" }
              as: ClubOfficer
              as_user_id: "${club_id}"
              captures: { show_id: $.data.id }
            - call: "POST /dog-shows/shows/${show_id}/submit"
              payload: {}
              as: ClubOfficer
              as_user_id: "${club_id}"
            - call: "POST /dog-shows/shows/${show_id}/approve"
              payload: {}
              as: SanctionOfficer
              as_user_id: "so-alpha"
            - call: "POST /dog-shows/panel-slots"
              payload: { show_id: "${show_id}", judge_id: "${j1_id}", panel_role: "BREED_JUDGE", expected_judge_version: "${j1_v}" }
              as: ShowSecretary
              captures: { slot1_id: $.data.id }
            - call: "POST /dog-shows/panel-slots/${slot1_id}/respond"
              payload: { decision: "ACCEPT" }
              as: Judge
              as_user_id: "${j1_id}"
            - call: "POST /dog-shows/classes"
              payload: { show_id: "${show_id}", class_code: "GR-OPEN-D", class_level: "BREED", breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING", entry_limit: 10 }
              as: ShowSecretary
              captures: { c1_id: $.data.id }
            - call: "POST /dog-shows/classes/${c1_id}/assign-judge"
              payload: { slot_id: "${slot1_id}" }
              as: ShowSecretary
            - call: "POST /dog-shows/dogs"
              payload: { registration_number: "SR-0001", call_name: "Ripple", breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING", sex: "BITCH", birth_date: "2024-05-10", owner_handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /dog-shows/dogs"
              payload: { registration_number: "SR-0002", call_name: "Bramble", breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING", sex: "DOG", birth_date: "2024-05-10", owner_handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /dog-shows/dogs"
              payload: { registration_number: "SR-0003", call_name: "Cinder", breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING", sex: "DOG", birth_date: "2024-05-10", owner_handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { d3_id: $.data.id }
            - call: "POST /dog-shows/entries"
              payload: { show_id: "${show_id}", class_id: "${c1_id}", dog_id: "${d1_id}", handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /dog-shows/entries"
              payload: { show_id: "${show_id}", class_id: "${c1_id}", dog_id: "${d2_id}", handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { e2_id: $.data.id }
            - call: "POST /dog-shows/entries"
              payload: { show_id: "${show_id}", class_id: "${c1_id}", dog_id: "${d3_id}", handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { e3_id: $.data.id }
            - call: "POST /dog-shows/entries/${e1_id}/confirm"
              payload: {}
              as: ShowSecretary
            - call: "POST /dog-shows/entries/${e2_id}/confirm"
              payload: {}
              as: ShowSecretary
            - call: "POST /dog-shows/entries/${e3_id}/confirm"
              payload: {}
              as: ShowSecretary
          trigger:
            - call: "POST /dog-shows/classes/${c1_id}/close-entries"
              payload: {}
              as: ShowSecretary
          assert:
            - "Entry.${e1_id}.entry_fee_cents == 4197"
            - "Entry.${e2_id}.entry_fee_cents == 3387"
            - "Entry.${e3_id}.entry_fee_cents == 3387"
            - "Entry.${e1_id}.fee_basis == FINAL"
            - "Show.${show_id}.fee_charged_cents == 10971"
            - "Show.${show_id}.fee_assessment_delta_cents == -842"
            - "ShowClass.${c1_id}.final_assessment_done == true"
            - "ShowClass.${c1_id}.status == CLOSED"

      - name: championship_points_scale_a_versus_scale_b_on_dog_totals
        grounds:
          - calculations.championship_points_award
          - entities.ShowClass.fields.points_scale_override
          - entities.Show.fields.championship_points_scale
          - entities.Dog.fields.championship_points_total
          - state_machines.ShowClass.CLOSED_to_COMPLETED
        distinguishing_aspect: |
          This instance is dual-variant on CHAMPIONSHIP POINTS carried by ShowClass and Dog, not on money:
          two classes with identical populations (one dog checked in, one dog absent) award 1 point under
          SCALE_A (counted_dog_count 2, absentees counted) and 0 points under the class-level SCALE_B
          override (counted_dog_count 1, absentees dropped).
