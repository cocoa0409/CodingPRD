            - call: "PATCH /tour-stops/${stop_dal}/logistics"
              payload: { preceding_stop_id: "${stop_oma}" }
              as: SeriesPromoter
              captures: { e_future: "$.data.error_id" }
            - call: "PATCH /tour-stops/${stop_dal}/logistics"
              payload: { preceding_stop_id: "${stop_atl}", haul_distance_miles: 800 }
