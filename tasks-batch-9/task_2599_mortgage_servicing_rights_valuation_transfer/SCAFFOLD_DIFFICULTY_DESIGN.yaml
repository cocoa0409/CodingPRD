  - rule_id: priority_pair_validation_conflict
    instances:

      - name: package_state_check_outranks_reserve_price_check
        grounds:
          - validations[priority=11]
          - validations[priority=44]
          - validation_priority_notes
          - errors[ERR_PACKAGE_NOT_ACCEPTING_BIDS]
          - errors[ERR_BID_BELOW_RESERVE]
        distinguishing_aspect: |
          The pair is state-lifecycle (11) versus fiscal-floor (44), and the gap is 33 priorities.
          The SAME request body — 40 bps on Fixture T, worth 160001 against a reserve of 162997 —
          is used twice: on a PUBLISHED package it returns 422 ERR_BID_BELOW_RESERVE, and after a
          curve publication suspends the package it returns 409 ERR_PACKAGE_NOT_ACCEPTING_BIDS even
          though the reserve violation is still present. The reserve is never quoted once the
          package is no longer open.
        test_recipe:
          setup:
            - "Fixture T is published with reserve_price_cents 162997 and no bids yet."
            - "Control: a 40 bps bid is filed while the package is PUBLISHED and is rejected on the reserve alone."
            - "RateCurveSnapshot C2 (as_of_date 2026-08-20, 4050 bps) is then published, staling the bound run and suspending the package."
