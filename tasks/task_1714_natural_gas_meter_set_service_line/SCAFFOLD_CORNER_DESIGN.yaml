              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id, app_v: $.data.version }
          trigger:
            - { call: "PATCH /service-applications/${app_id}", payload: { expected_application_version: "${app_v}", city: "Chatham" }, as: Builder, as_user_id: "${b_id}" }
            - call: "PATCH /service-applications/${app_id}"
              payload: { expected_application_version: "${app_v}", postal_code: "62702" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH succeeds (city == Chatham, version 2)"
            - "second PATCH → HTTP 412 ERR_STALE_VERSION; postal_code remains 62701"

      - name: commitment_revision_occ_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[commitment-revision-stale]", "errors[ERR_STALE_VERSION]", state_machines.TimelineCommitment.REVISION_PENDING_to_ACCEPTED]
        distinguishing_aspect: "The true-race case: propose (v2→v3) → REJECT round-trips the state back to ACCEPTED (v4), so a retried propose presenting the OLD version 2 sees a legal state but a stale version → 412. State preconditions alone cannot reject it; only OCC can."
        test_recipe:
          setup: ["application QUOTED; commitment PROPOSED then ACCEPTED (version 2)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - call: "POST /builders"
              payload: { company_name: "Acme Homes", contact_email: "ops@acme.example", license_number: "ST-12345" }
              as: NewBusinessRep
              captures: { b_id: $.data.id }
            - call: "POST /service-applications"
              payload: { builder_id: "${b_id}", service_address: "12 Main St", city: "Springfield", state_code: "IL", postal_code: "62701", requested_in_service_date: "2026-10-01" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { app_id: $.data.id }
            - { call: "POST /appliance-loads", payload: { service_application_id: "${app_id}", appliance_type: FURNACE, quantity: 1, btuh_input_rating: 80000 }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/submit", payload: {}, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /service-applications/${app_id}/confirm-load", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - { call: "POST /main-extensions", payload: { service_application_id: "${app_id}", design_footage_ft: 100, crossings: [], rock_excavation_expected: false }, as: DesignEngineer, as_user_id: "eng-1", captures: { me_id: $.data.id } }
            - { call: "POST /main-extensions/${me_id}/submit-design", payload: {}, as: DesignEngineer, as_user_id: "eng-1" }
            - { call: "POST /main-extensions/${me_id}/approve-design", payload: {}, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "GET /timeline-commitments?service_application_id=${app_id}"
              payload: {}
              as: Builder
              as_user_id: "${b_id}"
              captures: { tc_id: "$.data[0].id", tc_v1: "$.data[0].version" }
            - call: "POST /timeline-commitments/${tc_id}/accept"
              payload: {}
              as: Builder
              as_user_id: "${b_id}"
              captures: { tc_v2: $.data.version }
          trigger:
            - { call: "POST /timeline-commitments/${tc_id}/propose-revision", payload: { requested_completion_date: "2026-09-10", expected_commitment_version: "${tc_v2}" }, as: Builder, as_user_id: "${b_id}" }
            - { call: "POST /timeline-commitments/${tc_id}/respond-revision", payload: { decision: REJECT }, as: NewBusinessRep, as_user_id: "rep-1" }
            - call: "POST /timeline-commitments/${tc_id}/propose-revision"
              payload: { requested_completion_date: "2026-09-11", expected_commitment_version: "${tc_v2}" }
              as: Builder
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first propose succeeds (ACCEPTED→REVISION_PENDING, version 3); REJECT returns it to ACCEPTED (version 4)"
            - "retried propose with the stale version ${tc_v2} → HTTP 412 ERR_STALE_VERSION even though status is again ACCEPTED"
            - "committed_completion_date unchanged (still the conservative date 2026-08-12)"

