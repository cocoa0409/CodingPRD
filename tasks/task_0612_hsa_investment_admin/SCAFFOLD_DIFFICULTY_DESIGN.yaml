# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# HSA Investment & Administration Platform — EXPERT band.
# Nine §0.5 rules × 2 instances = 18 instances.
# All amounts integer cents. Logical clock default 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: limit_last_month_rule_vs_prorated_on_account
        grounds:
          - calculations.contribution_limit
          - entities.HsaAccount.fields.applicable_limit_cents
          - entities.CoveragePeriod.fields.coverage_tier
        distinguishing_aspect: |
          Same FAMILY HDHP coverage (months 6..12) yields applicable_limit_cents=862500
          under the DEFAULT LAST_MONTH_RULE variant (December covered -> full annual) but
          503125 under PRORATED (sum-of-monthly / 12, floored once). This dual-variant logic
          lives on HsaAccount/CoveragePeriod — a different entity domain than instance #2 (Distribution).
        test_recipe:
          setup:
            - "Clock at 2026-01-01. One ACTIVE HsaAccount (plan_year 2026) with a single ATTESTED FAMILY CoveragePeriod covering months 6..12; holder not catch-up eligible (DOB 1985)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Dana Young", email: "dana.young@x.com", date_of_birth: "1985-06-01" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "FAMILY", effective_month: 6, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
          trigger:
            - call: "GET /hsa/accounts/${acc_id}"
              as: AccountAdmin
              captures: { lmr_limit: $.data.applicable_limit_cents }
            - call: "POST /hsa/accounts/${acc_id}/limit-variant"
              payload: { variant: "PRORATED" }
              as: AccountAdmin
              captures: { prorated_limit: $.data.applicable_limit_cents }
          assert:
            - "HsaAccount.${acc_id}.applicable_limit_cents == 862500 under LAST_MONTH_RULE (captured lmr_limit)"
            - "HsaAccount.${acc_id}.applicable_limit_cents == 503125 under PRORATED (captured prorated_limit)"
            - "862500 != 503125 — same coverage, divergent limit by variant"

      - name: distribution_gross_vs_taxable_on_distribution
        grounds:
          - calculations.distribution_tax_basis
          - entities.TaxForm.fields.gross_amount_cents
          - entities.TaxForm.fields.nonqualified_amount_cents
        distinguishing_aspect: |
          For three CLEARED distributions (50000 QUALIFIED, 30000 NONQUALIFIED, 12000 UNSUBSTANTIATED),
          the FORM_1099_SA gross box reports 92000 (GROSS_REPORTING: all amounts) while the taxable
          box reports 42000 (TAXABLE_REPORTING: NONQUALIFIED + UNSUBSTANTIATED-as-NONQUALIFIED).
          This dual-variant logic operates on Distribution/TaxForm — a different entity domain than instance #1.
        test_recipe:
          setup:
            - "ACTIVE account with cash >= 92000 funded by a posted INDIVIDUAL contribution of 200000; three distributions REQUESTED by the holder then CLEARED by adminA; distribution d1 (50000) substantiated QUALIFIED by adminB with a qualifying receipt, d2 (30000) substantiated NONQUALIFIED by adminB with a non-qualifying receipt, d3 (12000) left UNSUBSTANTIATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Lee Park", email: "lee.park@x.com", date_of_birth: "1980-04-04" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 200000 }
              as: AccountAdmin
              captures: { contrib_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${contrib_id}/post"
              as: AccountAdmin
            - call: "POST /hsa/receipts"
              payload: { account_id: "${acc_id}", merchant: "Clinic", service_date: "2026-01-20T00:00:00Z", amount_cents: 60000, is_qualified_medical: true }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { rcpt_q: $.data.id }
            - call: "POST /hsa/receipts"
              payload: { account_id: "${acc_id}", merchant: "Spa", service_date: "2026-01-21T00:00:00Z", amount_cents: 40000, is_qualified_medical: false }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { rcpt_n: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/distributions"
              payload: { method: "REIMBURSEMENT", amount_cents: 50000 }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { d1: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/distributions"
              payload: { method: "REIMBURSEMENT", amount_cents: 30000 }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { d2: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/distributions"
              payload: { method: "REIMBURSEMENT", amount_cents: 12000 }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { d3: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/distributions/${d1}/clear"
              as: AccountAdmin
              as_user_id: "adminA"
            - call: "POST /hsa/accounts/${acc_id}/distributions/${d2}/clear"
              as: AccountAdmin
              as_user_id: "adminA"
            - call: "POST /hsa/accounts/${acc_id}/distributions/${d3}/clear"
              as: AccountAdmin
              as_user_id: "adminA"
            - call: "POST /hsa/accounts/${acc_id}/distributions/${d1}/substantiate"
              payload: { receipt_id: "${rcpt_q}" }
              as: AccountAdmin
              as_user_id: "adminB"
            - call: "POST /hsa/accounts/${acc_id}/distributions/${d2}/substantiate"
              payload: { receipt_id: "${rcpt_n}" }
              as: AccountAdmin
              as_user_id: "adminB"
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/tax-forms"
              payload: { form_type: "FORM_1099_SA", tax_year: 2026 }
              as: AccountAdmin
              captures: { gross: $.data.gross_amount_cents, taxable: $.data.nonqualified_amount_cents }
          assert:
            - "TaxForm.gross_amount_cents == 92000"
            - "TaxForm.nonqualified_amount_cents == 42000"
            - "92000 != 42000 — gross vs taxable diverge on the same Distribution set"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: investable_cash_sweep_nested_min_floor
        grounds:
          - calculations.investable_cash_sweep
          - entities.HsaAccount.fields.invest_threshold_cents
          - entities.HsaAccount.fields.sweep_increment_cents
          - entities.InvestmentSweep.fields.swept_amount_cents
        distinguishing_aspect: |
          MODE (a): swept_amount = floor(min(max(0, cash-threshold), requested)/increment)*increment uses
          4 inputs (cash, threshold, increment, requested) with nested max/min and a final floor. With
          cash=250000, threshold=200000, increment=10000, requested=23000 the result is 20000
          (min(50000,23000)=23000 -> floor(23000/10000)*10000). Distinct mode from instance #2 (mode c).
        test_recipe:
          setup:
            - "ACTIVE account, defaults invest_threshold_cents=200000 sweep_increment_cents=10000, cash_balance_cents=250000 from a posted INDIVIDUAL contribution of 250000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Sam Roe", email: "sam.roe@x.com", date_of_birth: "1982-02-02" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 250000 }
              as: AccountAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c_id}/post"
              as: AccountAdmin
            - call: "GET /hsa/accounts/${acc_id}"
              as: AccountAdmin
              captures: { acc_v: $.data.version }
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/sweeps"
              payload: { requested_amount_cents: 23000, expected_account_version: "${acc_v}" }
              as: AccountAdmin
              captures: { swept: $.data.swept_amount_cents }
          assert:
            - "InvestmentSweep.swept_amount_cents == 20000"
            - "After sweep HsaAccount.${acc_id}.cash_balance_cents == 230000"
            - "After sweep HsaAccount.${acc_id}.invested_balance_cents == 20000"

      - name: contribution_accrual_pinned_eval_order
        grounds:
          - calculations.contribution_accrual
          - calculations.contribution_limit
          - entities.HsaAccount.fields.excess_contribution_cents
          - entities.HsaAccount.fields.contribution_posture
        distinguishing_aspect: |
          MODE (c): a circular-looking dependency pinned by explicit order — contributions_ytd (step1)
          and applicable_limit (step2) feed excess (step3) which feeds posture (step5), while the
          catch-up sub-limit guard (step4) is evaluated BEFORE the general excess. Posting SELF_ONLY
          full-year contributions of 432000 then 1 more cent path is avoided; instead posting 432000
          to the 432000 limit leaves excess=0 posture OPEN, and the order is observable. Distinct mode
          from instance #1 (mode a).
        test_recipe:
          setup:
            - "ACTIVE account, SELF_ONLY full-year coverage (LMR limit 432000), holder not catch-up eligible; one PENDING INDIVIDUAL contribution of 432000 ready to post."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Ivy Cho", email: "ivy.cho@x.com", date_of_birth: "1979-09-09" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 432000 }
              as: AccountAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c_id}/post"
              as: AccountAdmin
          assert:
            - "After post HsaAccount.${acc_id}.contributions_ytd_cents == 432000 (step1)"
            - "HsaAccount.${acc_id}.applicable_limit_cents == 432000 (step2)"
            - "HsaAccount.${acc_id}.excess_contribution_cents == 0 (step3: 432000-432000)"
            - "HsaAccount.${acc_id}.contribution_posture == OPEN (step5: ACTIVE and excess==0)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: account_parallel_lifecycle_x_posture
        grounds:
          - state_machines.HsaAccount.ACTIVE_to_FROZEN
          - state_machines.HsaAccount.OPEN_to_LOCKED
          - entities.HsaAccount.fields.lifecycle_status
          - entities.HsaAccount.fields.contribution_posture
        distinguishing_aspect: |
          HsaAccount carries TWO independent state dimensions: lifecycle_status and contribution_posture.
          Freezing an ACTIVE account with excess==0 moves lifecycle ACTIVE->FROZEN AND independently
          forces contribution_posture OPEN->LOCKED, demonstrating parallel dimensions on ONE entity.
          (Different entity than instance #2, DebitCard.)
        test_recipe:
          setup:
            - "ACTIVE account, no excess, contribution_posture OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Ana Diaz", email: "ana.diaz@x.com", date_of_birth: "1983-03-03" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/freeze"
              as: AccountAdmin
          assert:
            - "HsaAccount.${acc_id}.lifecycle_status == FROZEN"
            - "HsaAccount.${acc_id}.contribution_posture == LOCKED (forced by FROZEN even with excess_contribution_cents == 0)"

      - name: debitcard_cyclic_active_suspended
        grounds:
          - state_machines.DebitCard.ACTIVE_to_SUSPENDED
          - state_machines.DebitCard.SUSPENDED_to_ACTIVE
          - entities.DebitCard.fields.status
        distinguishing_aspect: |
          A DebitCard cycles ACTIVE -> SUSPENDED -> ACTIVE via repeated suspend/activate, a true
          A->B->A loop (different entity than instance #1's parallel-dimension account). After
          activate-suspend-activate the card returns to ACTIVE with version incremented each hop.
        test_recipe:
          setup:
            - "ACTIVE account with one ISSUED DebitCard owned by the holder."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Bo Kim", email: "bo.kim@x.com", date_of_birth: "1990-10-10" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/cards"
              payload: { last_four: "4242" }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { card_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/cards/${card_id}/activate"
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/cards/${card_id}/suspend"
              as: Accountholder
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/cards/${card_id}/activate"
              as: Accountholder
              as_user_id: "${h_id}"
          assert:
            - "DebitCard.${card_id}.status == ACTIVE after activate->suspend->activate cycle"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: correction_execute_depth3_cascade
        grounds:
          - state_machines.ExcessCorrection.REQUESTED_to_COMPLETED
          - state_machines.Contribution.POSTED_to_REVERSED
          - calculations.excess_correction_sweep
          - entities.HsaAccount.fields.contribution_posture
        distinguishing_aspect: |
          Depth-3 cascade from correction execute: execute(ExcessCorrection) -> Contribution POSTED->REVERSED
          (link1) -> that reversal lowers cash_balance_cents AND contributions_ytd_cents on HsaAccount
          (link2) -> the lowered contributions_ytd_cents drives excess_contribution_cents to 0 which flips
          contribution_posture LOCKED->OPEN (link3). Distinct trigger from instance #2 (coverage supersede).
        test_recipe:
          setup:
            - "ACTIVE account, FAMILY full-year coverage (LMR limit 862500). Three POSTED INDIVIDUAL contributions c1=400000 (posted 2026-03-01), c2=400000 (posted 2026-03-02), c3=200000 (posted 2026-03-03); contributions_ytd=1000000, excess=137500, posture LOCKED. A REQUESTED ExcessCorrection for 137500 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Cy Tan", email: "cy.tan@x.com", date_of_birth: "1978-08-08" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "FAMILY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 400000 }
              as: AccountAdmin
              captures: { c1: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c1}/post"
              as: AccountAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 400000 }
              as: AccountAdmin
              captures: { c2: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c2}/post"
              as: AccountAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 200000 }
              as: AccountAdmin
              captures: { c3: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c3}/post"
              as: AccountAdmin
            - call: "GET /hsa/accounts/${acc_id}"
              as: AccountAdmin
              captures: { acc_v: $.data.version }
            - call: "POST /hsa/accounts/${acc_id}/corrections"
              payload: { requested_amount_cents: 137500, expected_account_version: "${acc_v}" }
              as: AccountAdmin
              captures: { corr_id: $.data.id }
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/corrections/${corr_id}/execute"
              as: AccountAdmin
          assert:
            - "ExcessCorrection.${corr_id}.status == COMPLETED with corrected_amount_cents == 137500"
            - "Contribution.${c3}.status == REVERSED (latest-posted reversed first); c1 and c2 remain POSTED"
            - "HsaAccount.${acc_id}.contributions_ytd_cents == 800000 and cash_balance_cents == 800000"
            - "HsaAccount.${acc_id}.excess_contribution_cents == 0 and contribution_posture == OPEN"

      - name: coverage_supersede_depth2_cascade
        grounds:
          - state_machines.CoveragePeriod.ATTESTED_to_SUPERSEDED
          - calculations.contribution_limit
          - entities.HsaAccount.fields.applicable_limit_cents
          - entities.HsaAccount.fields.contribution_posture
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (coverage-period supersede): supersede(CoveragePeriod)
          -> applicable_limit_cents recomputed downward on HsaAccount (link1) -> the lower limit raises
          excess_contribution_cents above 0 which flips contribution_posture OPEN->LOCKED (link2). The
          contributions are untouched; only the limit side moves.
        test_recipe:
          setup:
            - "ACTIVE account with FAMILY full-year coverage cp (LMR limit 862500) and a POSTED INDIVIDUAL contribution of 600000 (excess 0, posture OPEN). Superseding cp drops coverage to none-in-December so the limit recomputes to 0, making 600000 fully excess."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Di Fox", email: "di.fox@x.com", date_of_birth: "1981-01-01" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "FAMILY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 600000 }
              as: AccountAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c_id}/post"
              as: AccountAdmin
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods/${cp_id}/supersede"
              as: AccountAdmin
          assert:
            - "CoveragePeriod.${cp_id}.status == SUPERSEDED"
            - "HsaAccount.${acc_id}.applicable_limit_cents == 0 (no ATTESTED coverage remains)"
            - "HsaAccount.${acc_id}.excess_contribution_cents == 600000 and contribution_posture == LOCKED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: payroll_disabled_beats_posture_locked
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_PAYROLL_DISABLED]
          - errors[ERR_POSTURE_LOCKED]
        distinguishing_aspect: |
          Posting a PAYROLL contribution when BOTH the employer has payroll disabled (business_safety, p10)
          AND the account posture is LOCKED (business_constraint, p11) returns ERR_PAYROLL_DISABLED — the
          lower-priority-number safety check wins. Category pair business_safety vs business_constraint
          (distinct from instance #2's state vs business_fiscal).
        test_recipe:
          setup:
