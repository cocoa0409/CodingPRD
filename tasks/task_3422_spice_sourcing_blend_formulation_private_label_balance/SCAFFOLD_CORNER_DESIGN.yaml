          - complexity_profile.consistency_model
          - "endpoints: POST /spice/lots"
        distinguishing_aspect: "Immediate consistency: a lot created by POST /spice/lots is fully readable by the very next GET with identical field values, and a mutation (first test post) advances version to 2 on the immediately following read."
        test_recipe:
          setup: ["supplier S"]
          setup_api_calls:
            - { call: "POST /spice/suppliers", payload: { name: "Malabar Exports", origin_country: "IN" }, as: SupplyPlanner, captures: { sup: $.data.id } }
          trigger:
            - { call: "POST /spice/lots", payload: { supplier_id: "${sup}", spice_code: CINNAMON, origin_region: "Galle", crop_year: 2025, quantity_kg: 25, flavor_intensity_units: 65.0, moisture_pct: 9.0, cost_per_kg_cents: 400, allergen_profile: NONE }, as: SupplyPlanner, captures: { lot: $.data.id } }
            - { call: "GET /spice/lots/${lot}", payload: {}, as: SupplyPlanner, captures: { qty: $.data.quantity_kg, st: $.data.status, v1: $.data.version } }
            - { call: "POST /spice/lots/${lot}/tests", payload: { test_type: MICRO, measured_value: 1000, lab_code: "LAB-A" }, as: QualityAnalyst, as_user_id: "qa-1" }
            - { call: "GET /spice/lots/${lot}", payload: {}, as: SupplyPlanner, captures: { st2: $.data.status, v2: $.data.version } }
          assert:
            - "read-after-write: ${qty} == 25, ${st} == RECEIVED, ${v1} == 1 — no lag, no read-your-writes gap"
            - "after the test-post mutation: ${st2} == IN_TEST and ${v2} == 2 on the immediately following GET"
