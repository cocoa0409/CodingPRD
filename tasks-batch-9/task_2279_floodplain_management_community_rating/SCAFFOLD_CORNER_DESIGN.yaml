          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_DUPLICATE_DECLARATION_CODE'"
            - "PostDisasterInspection.${insp_id}.declaration_code == 'DR-4700'"
            - "PostDisasterInspection.${insp_id}.disaster_event_date == '2026-01-01T00:00:00Z'"
            - "PostDisasterInspection.${insp_id}.deadline_at == '2026-01-31T00:00:00Z'"

      - name: second_active_order_for_one_violation_is_rejected
        claim_type: aggregate_validation
        grounds:
          - validations.priority_78
          - errors.ERR_ORDER_ALREADY_ACTIVE
          - validations.priority_40
        distinguishing_aspect: |
          The priority-40 state gate deliberately admits a violation already in ORDER_ISSUED,
          so the duplicate order is caught one rule later at priority 78 with 409
          ERR_ORDER_ALREADY_ACTIVE — not with ERR_VIOLATION_NOT_ACTIONABLE — and the first
          order keeps its 2026-09-01 deadline.
        test_recipe:
          setup:
            - "Community and parcel; MAJOR violation with one ISSUED remediation order."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/violations"
              payload: { property_id: "${prop_id}", violation_type: "NO_PERMIT", severity: "MAJOR" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { viol_id: $.data.id }
            - call: "POST /floodplain/remediation-orders"
              payload: { violation_id: "${viol_id}", required_action: "Obtain a permit or remove the work", deadline_at: "2026-09-01T00:00:00Z" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /floodplain/remediation-orders"
              payload: { violation_id: "${viol_id}", required_action: "Duplicate order", deadline_at: "2026-10-01T00:00:00Z" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_ORDER_ALREADY_ACTIVE'"
            - "RemediationOrder.${order_id}.status == ISSUED"
            - "RemediationOrder.${order_id}.deadline_at == '2026-09-01T00:00:00Z'"
            - "Violation.${viol_id}.status == ORDER_ISSUED"

      - name: second_reversal_of_the_same_record_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_78
          - errors.ERR_RECORD_ALREADY_REVERSED
          - entities.ImprovementRecord.fields.reversed
        distinguishing_aspect: |
          Once a record carries reversed true, a second REVERSAL against it returns 409
          ERR_RECORD_ALREADY_REVERSED, so the ledger cannot be driven negative: the aggregates
          stay at the post-first-reversal values of 0 and 0.00.
        test_recipe:
          setup:
            - "Canonical base fixture through the structure; one 60000.00 record on 2026-03-01, then one REVERSAL of it."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-03-01T00:00:00Z", cost_usd: 60000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "REVERSAL", event_date: "2026-03-01T00:00:00Z", reverses_record_id: "${rec_id}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "REVERSAL", event_date: "2026-03-01T00:00:00Z", reverses_record_id: "${rec_id}" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_RECORD_ALREADY_REVERSED'"
            - "ImprovementRecord.${rec_id}.reversed == true"
