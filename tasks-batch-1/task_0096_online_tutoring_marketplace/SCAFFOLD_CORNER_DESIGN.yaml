# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Online Tutoring Marketplace — breadth probe over the claim-extraction taxonomy.
# Same chain conventions and policy values as SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_subject_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Subject, endpoints]
        distinguishing_aspect: "POST /subjects with code/display_name/category returns 201 and a server-minted id, status ACTIVE."
        test_recipe:
          setup: ["Empty DB; PlatformAdmin context."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subjects"
              payload: { code: "ENG_ESSAY", display_name: "Essay Writing", category: "HUMANITIES" }
              as: PlatformAdmin
              captures: { sid: $.data.id, st: $.data.status }
          assert:
            - "HTTP 201; response data.id is a UUID; data.status == ACTIVE; data.requires_credential == false (default)"

      - name: create_tutor_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Tutor.fields.base_hourly_rate_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /tutors omitting base_hourly_rate_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["PlatformAdmin context."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tutors"
              payload: { email: "t@x.com", full_name: "No Rate" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_VALIDATION"

      - name: subject_default_requires_credential_false_applied
        claim_type: Defaults
        grounds: [entities.Subject.fields.requires_credential]
        distinguishing_aspect: "Omitting requires_credential on POST /subjects yields requires_credential == false."
        test_recipe:
          setup: ["PlatformAdmin context."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subjects"
              payload: { code: "MUS_PIANO", display_name: "Piano", category: "MUSIC" }
              as: PlatformAdmin
              captures: { rc: $.data.requires_credential }
          assert:
            - "data.requires_credential == false"

      - name: tutor_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.Tutor.fields.verification_status]
        distinguishing_aspect: "verification_status is system-set to UNVERIFIED on create; any client-supplied value is ignored."
        test_recipe:
          setup: ["PlatformAdmin context."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /tutors"
              payload: { email: "t@x.com", full_name: "T", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { vs: $.data.verification_status, ver: $.data.version }
          assert:
            - "data.verification_status == UNVERIFIED; data.version == 1; data.id is a server UUID"

      - name: tutor_computed_lifetime_earnings_starts_zero
        claim_type: Computed Fields
        grounds: [entities.Tutor.fields.lifetime_net_earnings_cents, entities.Tutor.fields.payout_balance_cents]
        distinguishing_aspect: "A freshly created tutor has lifetime_net_earnings_cents == 0 and payout_balance_cents == 0 (computed)."
        test_recipe:
          setup: ["PlatformAdmin context."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tutors"
              payload: { email: "t@x.com", full_name: "T", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tid: $.data.id }
          trigger:
            - call: "GET /tutors/${tid}"
              payload: {}
              as: PlatformAdmin
              captures: { lne: $.data.lifetime_net_earnings_cents, pb: $.data.payout_balance_cents }
          assert:
            - "data.lifetime_net_earnings_cents == 0; data.payout_balance_cents == 0; data.active_subject_count == 0"

      - name: get_tutor_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_TUTOR_NOT_FOUND]"]
        distinguishing_aspect: "GET /tutors/{unknown} returns ERR_TUTOR_NOT_FOUND (404)."
        test_recipe:
          setup: ["PlatformAdmin context."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /tutors/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_TUTOR_NOT_FOUND"

      - name: student_immutable_after_archive_listed_filtered
        claim_type: Listing
        grounds: [entities.Student.fields.status, endpoints]
        distinguishing_aspect: "GET /parent-accounts/{id}/students?status=ACTIVE excludes an ARCHIVED student."
        test_recipe:
          setup: ["Parent with two students; one archived."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /parent-accounts"
              payload: { email: "p@x.com", full_name: "P" }
              as: ParentGuardian
              captures: { pid: $.data.id }
            - call: "POST /parent-accounts/${pid}/students"
              payload: { display_name: "Keep", grade_level: 9 }
              as: ParentGuardian
              as_user_id: "${pid}"
              captures: { s_keep: $.data.id }
            - call: "POST /parent-accounts/${pid}/students"
              payload: { display_name: "Gone", grade_level: 10 }
              as: ParentGuardian
              as_user_id: "${pid}"
              captures: { s_gone: $.data.id }
            - call: "POST /students/${s_gone}/archive"
              payload: {}
              as: ParentGuardian
              as_user_id: "${pid}"
          trigger:
            - call: "GET /parent-accounts/${pid}/students?status=ACTIVE"
              payload: {}
              as: ParentGuardian
              as_user_id: "${pid}"
          assert:
            - "response array contains the ACTIVE student ${s_keep} and excludes the ARCHIVED student ${s_gone}"
            - "ParentAccount ${pid}.child_count == 1 after the archive"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_session_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Session.REPORTED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a session a second time (already CONFIRMED) returns ERR_INVALID_STATE; no second Settlement is created."
        test_recipe:
          setup: ["One trial session already CONFIRMED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /commission-policies"
              payload: { name: "P1", tier_breakpoints_cents: [0, 100000, 1000000], tier_rates_bps: [2500, 1500, 800], trial_commission_bps: 5000, trial_max_billed_minutes: 30, refund_window_hours: 168 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /commission-policies/${policy_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
            - call: "POST /parent-accounts"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: ParentGuardian
              captures: { parent_id: $.data.id }
            - call: "POST /parent-accounts/${parent_id}/deposit"
              payload: { amount_cents: 100000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /parent-accounts/${parent_id}/students"
              payload: { display_name: "Kid", grade_level: 9 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { student_id: $.data.id }
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-02T10:00:00Z", planned_minutes: 30 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/deliver"
              payload: { actual_minutes: 30 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { session_id: $.data.id }
            - call: "POST /sessions/${session_id}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
          trigger:
            - call: "POST /sessions/${session_id}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE; exactly one Settlement exists for ${session_id}"

      - name: approve_already_revoked_tag_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.TutorSubjectTag.APPROVED_to_REVOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a tag that is REVOKED (terminal) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PROPOSED tag that was revoked while PROPOSED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/revoke"
              payload: {}
              as: TrustOfficer
          trigger:
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE; TutorSubjectTag ${tag_id}.status remains REVOKED"

      - name: new_credential_initial_state_submitted
        claim_type: Initial State
        grounds: [state_machines.Credential]
        distinguishing_aspect: "A newly created Credential starts in SUBMITTED."
        test_recipe:
          setup: ["A tutor and subject exist."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
          trigger:
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cs: $.data.status }
          assert:
            - "data.status == SUBMITTED"

      - name: cancel_after_lesson_time_rejected_invalid_state
        claim_type: guarded transitions
        grounds: [state_machines.Booking.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a booking once the clock has passed scheduled_start is rejected (precondition clock < scheduled_start fails) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SCHEDULED booking whose start time is now in the past relative to the clock."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /commission-policies"
              payload: { name: "P1", tier_breakpoints_cents: [0, 100000, 1000000], tier_rates_bps: [2500, 1500, 800], trial_commission_bps: 5000, trial_max_billed_minutes: 30, refund_window_hours: 168 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /commission-policies/${policy_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
            - call: "POST /parent-accounts"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: ParentGuardian
              captures: { parent_id: $.data.id }
            - call: "POST /parent-accounts/${parent_id}/deposit"
              payload: { amount_cents: 100000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /parent-accounts/${parent_id}/students"
              payload: { display_name: "Kid", grade_level: 9 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { student_id: $.data.id }
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-02T10:00:00Z", planned_minutes: 30 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T11:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${booking_id}/cancel"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE; Booking ${booking_id}.status remains SCHEDULED"

      - name: no_show_releases_hold_and_penalizes_reliability
        claim_type: Side Effect Execution
        grounds: [state_machines.Booking.SCHEDULED_to_NO_SHOW, entities.Tutor.fields.reliability_score, entities.ParentAccount.fields.held_balance_cents]
        distinguishing_aspect: "mark-no-show releases the parent hold (held_balance -> 0) and lowers Tutor.reliability_score by the acute no-show penalty."
        test_recipe:
          setup: ["A SCHEDULED booking past its start time on a VERIFIED tutor with one prior confirmed session (reliability 100)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /commission-policies"
              payload: { name: "P1", tier_breakpoints_cents: [0, 100000, 1000000], tier_rates_bps: [2500, 1500, 800], trial_commission_bps: 5000, trial_max_billed_minutes: 30, refund_window_hours: 168 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /commission-policies/${policy_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
            - call: "POST /parent-accounts"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: ParentGuardian
              captures: { parent_id: $.data.id }
            - call: "POST /parent-accounts/${parent_id}/deposit"
              payload: { amount_cents: 100000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /parent-accounts/${parent_id}/students"
              payload: { display_name: "Kid", grade_level: 9 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { student_id: $.data.id }
            # first booking (trial) delivered+confirmed to establish reliability 100 from one confirmed session
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-02T08:00:00Z", planned_minutes: 30 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { b_trial: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${b_trial}/deliver"
              payload: { actual_minutes: 30 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { s_trial: $.data.id }
            - call: "POST /sessions/${s_trial}/confirm"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
            # second booking that will be a no-show
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-03T10:00:00Z", planned_minutes: 60 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-03T11:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${booking_id}/mark-no-show"
              payload: {}
              as: Tutor
              as_user_id: "${tutor_id}"
          assert:
            - "Booking ${booking_id}.status == NO_SHOW"
            - "ParentAccount ${parent_id}.held_balance_cents == 0 (hold released)"
            - "Tutor ${tutor_id}.reliability_score == 42.0 (chronic 100*1/(1+1)=50 minus 8 no-show penalty)"

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_user_context_header_rejected
        claim_type: Violation -> Error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no/invalid user-context headers returns ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["Subject create attempted without a valid role header."]
          setup_api_calls: []
          trigger:
            - call: "POST /subjects"
              payload: { code: "X", display_name: "X", category: "STEM" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: booking_time_in_past_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=10]", "errors[ERR_BOOKING_TIME_INVALID]"]
        distinguishing_aspect: "A booking with scheduled_start not strictly in the future returns ERR_BOOKING_TIME_INVALID (422)."
        test_recipe:
          setup: ["VERIFIED tutor with APPROVED tag; funded parent + student; clock at 2026-06-05."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
