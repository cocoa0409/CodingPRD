            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 8000000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_b}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 100000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a2: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "PLAN_TRANSFER", source_account_id: "${a2}", receiving_plan_id: "${plan_a}", receiving_account_id: "${a1}" }, as: Participant, as_user_id: "${p1}", captures: { ct: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${ct}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
