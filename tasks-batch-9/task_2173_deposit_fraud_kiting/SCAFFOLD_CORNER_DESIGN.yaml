  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: settling_returned_without_a_reason_is_rejected_and_settling_twice_is_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=10]
          - validations[priority=40]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_ITEM_ALREADY_SETTLED]
        distinguishing_aspect: "outcome RETURNED without return_reason returns 400 ERR_INVALID_REQUEST at priority 10, and once the item has legitimately settled CLEARED a second settle returns 409 ERR_ITEM_ALREADY_SETTLED at priority 40."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount with one PENDING CHECK deposit of 30000 cents."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Settle Guard Depositor", tin_last4: "0027" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_sg: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_sg}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_sg: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_sg}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1020" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_sg: "$.data.id", md_sg: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_sg}/verification-attempts"
              payload: { micro_deposit_cents: "${md_sg}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_sg}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_sg: "$.data.id" }
          trigger:
            - call: "POST /deposit-fraud/deposit-items/${item_sg}/settle"
              payload: { outcome: "RETURNED" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { err_no_reason: "$.data.error_id" }
            - call: "POST /deposit-fraud/deposit-items/${item_sg}/settle"
              payload: { outcome: "CLEARED" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { st_cleared: "$.data.status" }
            - call: "POST /deposit-fraud/deposit-items/${item_sg}/settle"
              payload: { outcome: "RETURNED", return_reason: "NSF" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { err_already: "$.data.error_id" }
          assert:
            - "${err_no_reason} == ERR_INVALID_REQUEST with HTTP 400"
            - "${st_cleared} == CLEARED"
            - "${err_already} == ERR_ITEM_ALREADY_SETTLED with HTTP 409"
            - "GET /deposit-fraud/accounts/${acct_sg} returns ledger_balance_cents == 30000 and available_balance_cents == 30000, proving the two rejections mutated nothing"

      - name: override_review_requesting_more_than_the_hold_is_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=62]
          - errors[ERR_RELEASE_EXCEEDS_HOLD]
          - entities.CheckHold.fields.held_amount_cents
        distinguishing_aspect: "Requesting 7501 cents against a 7500-cent hold returns 422 ERR_RELEASE_EXCEEDS_HOLD, while exactly 7500 is accepted, proving the comparison is <= and not <."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount with one CHECK deposit of 30000 cents and its ACTIVE 7500-cent hold."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Release Cap Depositor", tin_last4: "0028" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_rc: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_rc}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_rc: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_rc}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1021" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_rc: "$.data.id", md_rc: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_rc}/verification-attempts"
              payload: { micro_deposit_cents: "${md_rc}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_rc}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_rc: "$.data.id" }
            - call: "GET /deposit-fraud/deposit-items/${item_rc}/holds"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { hold_rc: "$.data[0].id", hold_rc_v: "$.data[0].version" }
          trigger:
            - call: "POST /deposit-fraud/check-holds/${hold_rc}/override-reviews"
              payload: { requested_release_cents: 7501, release_effective_at: "2026-08-01T00:00:00Z", release_window_end_at: "2026-08-02T00:00:00Z", justification: "Over-request", expected_check_hold_version: "${hold_rc_v}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { err_exceeds: "$.data.error_id" }
            - call: "POST /deposit-fraud/check-holds/${hold_rc}/override-reviews"
              payload: { requested_release_cents: 7500, release_effective_at: "2026-08-01T00:00:00Z", release_window_end_at: "2026-08-02T00:00:00Z", justification: "Exact-amount request", expected_check_hold_version: "${hold_rc_v}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { rev_rc: "$.data.id" }
          assert:
            - "${err_exceeds} == ERR_RELEASE_EXCEEDS_HOLD with HTTP 422"
            - "HoldOverrideReview.${rev_rc}.requested_release_cents == 7500 and status == DRAFT"
            - "GET /deposit-fraud/check-holds/${hold_rc}/override-reviews returns total_count == 1, proving the rejected attempt created nothing"

      - name: matured_hold_cannot_receive_a_new_override_review
        claim_type: Temporal validation
        grounds:
          - validations[priority=55]
          - errors[ERR_HOLD_ALREADY_MATURED]
          - entities.CheckHold.fields.hold_release_at
        distinguishing_aspect: "Once the logical clock reaches the hold's 2026-08-10T00:00:00Z release instant the early-release window is closed, so creating a review returns 422 ERR_HOLD_ALREADY_MATURED even though the hold is still ACTIVE."
        test_recipe:
          setup:
            - "One ACTIVE DepositAccount opened at 2026-08-01T00:00:00Z with one CHECK deposit of 30000 cents, minting an ACTIVE EXCEPTION_NEW_ACCOUNT hold whose hold_release_at is 2026-08-10T00:00:00Z."
            - "The logical clock is then moved to exactly 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Matured Hold Depositor", tin_last4: "0029" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_mh: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_mh}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_mh: "$.data.id" }
            - call: "POST /deposit-fraud/accounts/${acct_mh}/funding-sources"
              payload: { source_type: "EXTERNAL_ACH", routing_last4: "1022" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { fs_mh: "$.data.id", md_mh: "$.data.micro_deposit_cents" }
            - call: "POST /deposit-fraud/funding-sources/${fs_mh}/verification-attempts"
              payload: { micro_deposit_cents: "${md_mh}" }
              as: OperationsAdmin
              as_user_id: "ops-1"
            - call: "POST /deposit-fraud/accounts/${acct_mh}/deposit-items"
              payload: { item_type: "CHECK", amount_cents: 30000 }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { item_mh: "$.data.id" }
            - call: "GET /deposit-fraud/deposit-items/${item_mh}/holds"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { hold_mh: "$.data[0].id", hold_mh_v: "$.data[0].version", release_mh: "$.data[0].hold_release_at" }
            - call: "POST /deposit-fraud/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: OperationsAdmin
              as_user_id: "ops-1"
          trigger:
            - call: "POST /deposit-fraud/check-holds/${hold_mh}/override-reviews"
              payload: { requested_release_cents: 7500, release_effective_at: "2026-08-10T00:00:00Z", release_window_end_at: "2026-08-11T00:00:00Z", justification: "Too late to matter", expected_check_hold_version: "${hold_mh_v}" }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { err_matured: "$.data.error_id" }
          assert:
            - "${release_mh} == 2026-08-10T00:00:00Z"
            - "${err_matured} == ERR_HOLD_ALREADY_MATURED with HTTP 422"
            - "GET /deposit-fraud/check-holds/${hold_mh} returns status == ACTIVE, held_amount_cents == 7500 and version unchanged at ${hold_mh_v}"

      - name: duplicate_and_self_referential_account_links_are_rejected
        claim_type: Aggregate validation
        grounds:
          - validations[priority=30]
          - validations[priority=32]
          - errors[ERR_SELF_LINK]
          - errors[ERR_DUPLICATE_LINK]
        distinguishing_aspect: "Uniqueness is on the ordered triple: repeating (from, to, SHARED_DEVICE) returns 409 ERR_DUPLICATE_LINK, a link whose from equals its to returns 422 ERR_SELF_LINK, and the reversed (to, from, SHARED_DEVICE) direction is accepted as a distinct edge."
        test_recipe:
          setup:
            - "One Customer owning two DepositAccounts, with one existing AccountLink from the first to the second of type SHARED_DEVICE at 8000 bps."
          setup_api_calls:
            - call: "POST /deposit-fraud/customers"
              payload: { legal_name: "Link Uniqueness Depositor", tin_last4: "0030" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { cust_lu: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_lu}", product_type: "CHECKING", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_lu1: "$.data.id" }
            - call: "POST /deposit-fraud/accounts"
              payload: { customer_id: "${cust_lu}", product_type: "SAVINGS", open_channel: "BRANCH" }
              as: OperationsAdmin
              as_user_id: "ops-1"
              captures: { acct_lu2: "$.data.id" }
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_lu1}", to_account_id: "${acct_lu2}", link_type: "SHARED_DEVICE", confidence_bps: 8000 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { link_lu1: "$.data.id" }
          trigger:
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_lu1}", to_account_id: "${acct_lu2}", link_type: "SHARED_DEVICE", confidence_bps: 9500 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { err_dup_link: "$.data.error_id" }
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_lu1}", to_account_id: "${acct_lu1}", link_type: "SHARED_PHONE", confidence_bps: 9500 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { err_self_link: "$.data.error_id" }
            - call: "POST /deposit-fraud/account-links"
              payload: { from_account_id: "${acct_lu2}", to_account_id: "${acct_lu1}", link_type: "SHARED_DEVICE", confidence_bps: 8000 }
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { link_lu2: "$.data.id" }
          assert:
            - "${err_dup_link} == ERR_DUPLICATE_LINK with HTTP 409"
            - "${err_self_link} == ERR_SELF_LINK with HTTP 422"
            - "AccountLink.${link_lu2}.is_risk_bearing == true"
            - "GET /deposit-fraud/accounts/${acct_lu1}/links returns total_count == 2, containing ${link_lu1} and ${link_lu2}"

      - name: second_open_mule_case_on_one_account_is_rejected_while_a_kiting_case_is_allowed
        claim_type: Conditional validation
        grounds:
          - validations[priority=34]
          - errors[ERR_DUPLICATE_OPEN_CASE]
