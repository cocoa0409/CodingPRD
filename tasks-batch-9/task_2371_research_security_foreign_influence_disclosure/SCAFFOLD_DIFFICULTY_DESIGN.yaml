  - rule_id: transitive_cascade
    instances:
      - name: critical_incident_cascades_posture_grants_counts_and_project_security
        grounds:
          - state_machines.SecurityIncident.INVESTIGATING_to_SUBSTANTIATED
          - calculations.incident_severity_and_deadline
          - calculations.investigator_disclosure_posture
          - calculations.project_controlled_area_posture
          - calculations.project_activation_blockers
          - entities.Project.fields.active_grant_count
        distinguishing_aspect: |
          One status write propagates four hops in a fixed order: severity is frozen at 65 points
          (40 type + 15 ACTIVE award + 10 RESTRICTED project) which selects CRITICAL and a 5-day
          deadline; CRITICAL forces posture SUSPENDED; SUSPENDED posture suspends the
          investigator's grants with status_reason INVESTIGATOR_RESTRICTED; only then does the
          CRITICAL project cascade suspend the project. Because the grant was already SUSPENDED
          by the posture hop, its status_reason stays INVESTIGATOR_RESTRICTED and is never
          overwritten with PROJECT_SUSPENDED — hop order is observable in a stored value.
