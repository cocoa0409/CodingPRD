# =============================================================================
# PRD Benchmark Scaffold — task_3076_mortgage_backed_security_pooling_issuer_approval
# §1.0–§1.7 (difficulty & corner designs live in sibling files)
# =============================================================================

scenario: |
  Mortgage-Backed Security Pooling & Issuer Approval (Ginnie Mae): issuer
  application with net worth, liquidity and origination experience requirements,
  pooling of government-insured loans into securities with pool type, term and
  note rate constraints, custodial account structure separating principal and
  interest from tax and insurance escrow, monthly investor reporting and
  pass-through payment obligations regardless of borrower delinquency, issuer
  liquidity monitoring against advance obligations, defaulted issuer portfolio
  extinguishment and transfer to a successor, document custodian certification
  of loan files, delinquency threshold monitoring and corrective action plans

domain_name: mbs-pooling-issuer-approval
api_prefix: ""

# Flat multi-root topology: every resource is addressed at its own collection;
# parent linkage is expressed via canonical FK fields only.
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: IssuerApplication
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Applicant legal entity name" }
      - { name: net_worth_cents, type: integer, source: input, description: "Applicant declared net worth in cents" }
      - { name: liquid_assets_cents, type: integer, source: input, description: "Applicant declared liquid assets in cents" }
      - { name: unused_credit_lines_cents, type: integer, source: input, default: 0, description: "Committed unused warehouse/credit lines in cents" }
      - { name: origination_experience_months, type: integer, source: input, description: "Months of government-insured loan origination experience" }
      - { name: branch_count, type: integer, source: input, description: "Number of operating branches (>= 1)" }
      - { name: annual_origination_volume_cents, type: integer, source: input, description: "Prior-12-month origination volume in cents" }
      - { name: net_worth_requirement_cents, type: integer, source: computed, description: "Read-only: tiered minimum net worth per net_worth_requirement calculation" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | DENIED" }
      - { name: approved_issuer_id, type: string, source: system, description: "Server-set id of the Issuer created at approval; null until APPROVED" }

  - name: Issuer
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> IssuerApplication.id; the application this issuer was approved from" }
      - { name: legal_name, type: string, source: system, description: "Copied from the approved application" }
      - { name: net_worth_cents, type: integer, source: system, description: "Net worth snapshot from the approved application" }
      - { name: liquid_assets_cents, type: integer, source: input, description: "Current liquid assets in cents (maintained via PATCH financials)" }
      - { name: unused_credit_lines_cents, type: integer, source: input, default: 0, description: "Current committed unused credit lines in cents" }
      - { name: advance_obligation_cents, type: integer, source: computed, description: "Read-only: sum of amount_cents over LiquidityAdvance rows with status OPEN for this issuer" }
      - { name: liquidity_ratio_excluding_credit_bps, type: integer, source: computed, description: "Read-only: floor(liquid_assets_cents * 10000 / advance_obligation_cents); null when advance_obligation_cents == 0" }
      - { name: liquidity_ratio_including_credit_bps, type: integer, source: computed, description: "Read-only: floor((liquid_assets_cents + unused_credit_lines_cents) * 10000 / advance_obligation_cents); null when advance_obligation_cents == 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WATCH | SUSPENDED | DEFAULTED | EXTINGUISHED" }

  - name: DocumentCustodian
    parent: null
    common_fields: true
    fields:
      - { name: firm_name, type: string, source: input, description: "Custodian firm legal name" }

  - name: CustodianEngagement
    parent: null
    common_fields: true
    fields:
      - { name: custodian_id, type: string, source: input, description: "FK -> DocumentCustodian.id; engaged custodian" }
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id; engaging issuer" }
      - { name: window_start, type: string, source: input, description: "Engagement window start date YYYY-MM-DD (inclusive)" }
      - { name: window_end, type: string, source: input, description: "Engagement window end date YYYY-MM-DD (exclusive); half-open [start, end) semantics" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED" }

  - name: Pool
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id; issuing issuer" }
      - { name: custodian_id, type: string, source: input, description: "FK -> DocumentCustodian.id; document custodian for this pool" }
      - { name: pool_type, type: enum, source: input, description: "SINGLE_FAMILY | MANUFACTURED_HOME | MULTIFAMILY" }
      - { name: term_months, type: integer, source: input, description: "Pool term: SINGLE_FAMILY -> 360 or 180; MANUFACTURED_HOME -> 240; MULTIFAMILY -> 360" }
      - { name: note_rate_bps, type: integer, source: input, description: "Security note rate in basis points" }
      - { name: aggregate_principal_cents, type: integer, source: computed, description: "Read-only: sum of principal_balance_cents over loans in this pool with status != PAID_OFF" }
      - { name: delinquency_rate_bps, type: integer, source: computed, description: "Read-only: round_half_up(delinquent principal * 10000 / aggregate_principal_cents); 0 when denominator 0; delinquent = status in {DELINQ_60, DELINQ_90_PLUS, FORECLOSURE}" }
      - { name: status, type: enum, source: system, description: "DRAFT | ASSEMBLED | CERTIFIED | LIVE | TRANSFER_PENDING | TERMINATED" }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: system, description: "FK -> Pool.id; pool this loan is pooled into" }
      - { name: principal_balance_cents, type: integer, source: input, description: "Unpaid principal balance in cents" }
      - { name: note_rate_bps, type: integer, source: input, description: "Mortgage note rate in basis points; must be within [pool.note_rate_bps + 50, pool.note_rate_bps + 150] inclusive" }
      - { name: government_insurance, type: enum, source: input, description: "FHA | VA | USDA | PIH" }
      - { name: escrow_monthly_cents, type: integer, source: input, description: "Monthly tax-and-insurance escrow collected with the payment" }
      - { name: status, type: enum, source: system, description: "CURRENT | DELINQ_30 | DELINQ_60 | DELINQ_90_PLUS | FORECLOSURE | PAID_OFF" }

  - name: CustodialAccount
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: input, description: "FK -> Issuer.id; owning issuer" }
      - { name: account_type, type: enum, source: input, description: "P_AND_I (principal & interest) | T_AND_I (tax & insurance escrow); at most one of each per issuer" }
      - { name: principal_balance_cents, type: integer, source: computed, description: "Read-only: P_AND_I principal component balance" }
      - { name: interest_balance_cents, type: integer, source: computed, description: "Read-only: P_AND_I interest component balance" }
      - { name: tax_balance_cents, type: integer, source: computed, description: "Read-only: T_AND_I tax escrow component balance" }
      - { name: insurance_balance_cents, type: integer, source: computed, description: "Read-only: T_AND_I insurance escrow component balance" }
      - { name: balance_cents, type: integer, source: computed, description: "Read-only: sum of the two component balances of this account type" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FROZEN | CLOSED" }

  - name: AccountTransaction
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CustodialAccount.id; account this entry posts to" }
      - { name: direction, type: enum, source: system, description: "DEPOSIT | DISBURSEMENT" }
      - { name: component, type: enum, source: input, description: "PRINCIPAL | INTEREST | TAX | INSURANCE | ESCROW" }
      - { name: amount_cents, type: integer, source: input, description: "Posted amount in cents (> 0)" }
      - { name: loan_id, type: string, source: input, description: "Optional informational reference to Loan.id the funds were collected from" }
      - { name: tax_split_cents, type: integer, source: computed, description: "Read-only: for ESCROW deposits, the tax share per escrow_split calculation; null otherwise" }
      - { name: insurance_split_cents, type: integer, source: computed, description: "Read-only: for ESCROW deposits, amount_cents - tax_split_cents; null otherwise" }

  - name: LoanFileCertification
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: system, description: "FK -> Pool.id; pool whose loan files are certified" }
      - { name: custodian_id, type: string, source: system, description: "Reference to DocumentCustodian.id of the certifying custodian (from pool)" }
      - { name: decision, type: enum, source: input, description: "CERTIFIED | EXCEPTION" }
      - { name: exception_loan_ids, type: array, source: input, description: "Loan ids flagged when decision is EXCEPTION; empty array otherwise" }

  - name: InvestorReport
    parent: null
    common_fields: true
    fields:
      - { name: pool_id, type: string, source: system, description: "FK -> Pool.id; reported pool" }
      - { name: period_month, type: string, source: input, description: "Reporting month YYYY-MM (closed monthly granularity)" }
      - { name: scheduled_payment_cents, type: integer, source: computed, description: "Read-only: scheduled variant of pass_through_payment at report creation" }
      - { name: actual_collected_cents, type: integer, source: computed, description: "Read-only: actual-collected variant of pass_through_payment at report creation" }
      - { name: advance_required_cents, type: integer, source: computed, description: "Read-only: scheduled_payment_cents - actual_collected_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }

  - name: PassThroughPayment
    parent: null
    common_fields: true
    fields:
      - { name: report_id, type: string, source: system, description: "FK -> InvestorReport.id; accepted report that generated this obligation" }
      - { name: amount_cents, type: integer, source: computed, description: "Read-only: scheduled_payment_cents of the accepted report (owed regardless of borrower delinquency)" }
      - { name: funding_source, type: enum, source: system, description: "CUSTODIAL | ADVANCE; null until settled" }
      - { name: status, type: enum, source: system, description: "DUE | PAID | ADVANCED" }

  - name: LiquidityAdvance
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id; advancing issuer" }
      - { name: payment_id, type: string, source: system, description: "FK -> PassThroughPayment.id; payment this advance funded" }
      - { name: amount_cents, type: integer, source: computed, description: "Read-only: amount advanced (equals payment amount_cents)" }
      - { name: status, type: enum, source: system, description: "OPEN | REIMBURSED | WRITTEN_OFF" }

  - name: DelinquencyBreach
    parent: null
    common_fields: true
    fields:
      - { name: issuer_id, type: string, source: system, description: "FK -> Issuer.id; issuer owning the breaching pool" }
      - { name: pool_id, type: string, source: system, description: "FK -> Pool.id; breaching pool" }
      - { name: delinquency_rate_bps_at_breach, type: integer, source: system, description: "Pool delinquency_rate_bps at breach creation" }
      - { name: status, type: enum, source: system, description: "OPEN | MITIGATING | CLOSED" }

  - name: CorrectiveActionPlan
    parent: null
    common_fields: true
    fields:
      - { name: breach_id, type: string, source: system, description: "FK -> DelinquencyBreach.id; breach this plan remediates" }
      - { name: plan_summary, type: string, source: input, description: "Free-text remediation plan" }
      - { name: target_cure_month, type: string, source: input, description: "YYYY-MM month by which the issuer commits to cure" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED" }

  - name: PortfolioTransfer
    parent: null
    common_fields: true
    fields:
      - { name: defaulted_issuer_id, type: string, source: system, description: "FK -> Issuer.id; defaulted issuer whose portfolio moves" }
      - { name: successor_issuer_id, type: string, source: input, description: "FK -> Issuer.id; successor issuer receiving the portfolio" }
      - { name: status, type: enum, source: system, description: "INITIATED | ACCEPTED | REJECTED | COMPLETED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IssuerApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /issuer-applications/{id}/submit"
        actor: ApplicantOfficer
        preconditions:
          - "application.status == DRAFT (ERR_APPLICATION_INVALID_STATE)"
          - "net_worth_cents >= net_worth_requirement_cents per net_worth_requirement (ERR_NET_WORTH_DEFICIENT)"
          - "net_worth_cents >= liquid_assets_cents (ERR_LIQUIDITY_EXCEEDS_NET_WORTH)"
          - "origination_experience_months >= 24 (ERR_INSUFFICIENT_EXPERIENCE)"
        side_effects:
          - "increments IssuerApplication.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /issuer-applications/{id}/review"
        actor: AgencyReviewer
        preconditions:
          - "application.status == SUBMITTED (ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "increments IssuerApplication.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /issuer-applications/{id}/approve"
        actor: AgencyReviewer
        preconditions:
          - "application.status == UNDER_REVIEW (ERR_APPLICATION_INVALID_STATE)"
          - "acting reviewer must not be the officer who submitted the application (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "creates Issuer (status ACTIVE) copying legal_name / net_worth_cents / liquid_assets_cents / unused_credit_lines_cents from the application"
          - "application.approved_issuer_id set to the new Issuer.id"
          - "increments IssuerApplication.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /issuer-applications/{id}/deny"
        actor: AgencyReviewer
        preconditions:
          - "application.status == UNDER_REVIEW (ERR_APPLICATION_INVALID_STATE)"
          - "acting reviewer must not be the officer who submitted the application (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "increments IssuerApplication.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /issuer-applications/{id}/request-revision"
        actor: AgencyReviewer
        preconditions:
          - "application.status == UNDER_REVIEW (ERR_APPLICATION_INVALID_STATE)"
        side_effects:
          - "increments IssuerApplication.version by 1"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "PATCH /issuer-applications/{id}"
        actor: ApplicantOfficer
        preconditions:
          - "application.status == REVISION_REQUESTED (ERR_APPLICATION_INVALID_STATE)"
          - "PATCH body must carry expected_application_version equal to current version (OCC, ERR_STALE_VERSION)"
        side_effects:
          - "fields patched; status returns to DRAFT (revision cycle — application may loop DRAFT→...→REVISION_REQUESTED→DRAFT repeatedly)"
          - "increments IssuerApplication.version by 1"

  - entity: Pool
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ASSEMBLED
        trigger: "POST /pools/{id}/assemble"
        actor: IssuerOfficer
        preconditions:
          - "pool.status == DRAFT (ERR_POOL_INVALID_STATE)"
          - "pool.issuer_id == X-User-ID for IssuerOfficer (ERR_NOT_RESOURCE_OWNER)"
          - "Issuer.status == ACTIVE (ERR_ISSUER_NOT_ACTIVE)"
          - "at least one Loan with pool_id == pool.id exists (ERR_POOL_EMPTY)"
          - "loan count <= MAX_LOANS_PER_POOL for pool_type (ERR_POOL_LOAN_COUNT_EXCEEDED)"
          - "aggregate_principal_cents >= MIN_POOL_PRINCIPAL_CENTS (ERR_POOL_BELOW_MINIMUM_PRINCIPAL)"
        side_effects:
          - "increments Pool.version by 1"
      - from: ASSEMBLED
        to: CERTIFIED
        trigger: "POST /pools/{id}/certifications with decision CERTIFIED"
        actor: CustodianOfficer
        preconditions:
          - "pool.status == ASSEMBLED (ERR_POOL_INVALID_STATE)"
          - "custodian engagement ACTIVE covering the request date exists for (pool.issuer_id, pool.custodian_id) (ERR_CUSTODIAN_ENGAGEMENT_GAP)"
          - "request decision == CERTIFIED and exception_loan_ids == []"
        side_effects:
          - "creates LoanFileCertification (decision CERTIFIED)"
          - "increments Pool.version by 1"
      - from: ASSEMBLED
        to: ASSEMBLED
        trigger: "POST /pools/{id}/certifications with decision EXCEPTION"
        actor: CustodianOfficer
        preconditions:
          - "pool.status == ASSEMBLED (ERR_POOL_INVALID_STATE)"
          - "exception_loan_ids non-empty"
        side_effects:
          - "creates LoanFileCertification (decision EXCEPTION); pool stays ASSEMBLED (retry loop until a CERTIFIED certification lands)"
      - from: CERTIFIED
        to: LIVE
        trigger: "POST /pools/{id}/activate"
        actor: IssuerOfficer
        preconditions:
          - "pool.status == CERTIFIED (ERR_POOL_INVALID_STATE)"
          - "pool.issuer_id == X-User-ID for IssuerOfficer (ERR_NOT_RESOURCE_OWNER)"
          - "Issuer.status == ACTIVE (ERR_ISSUER_NOT_ACTIVE)"
        side_effects:
          - "creates InvestorReport for the current clock month in DRAFT with collection_rate_bps = 10000 (scheduled/actual/advance fields computed at creation per pass_through_payment)"
          - "increments Pool.version by 1"
      - from: LIVE
        to: TRANSFER_PENDING
        trigger: "POST /portfolio-transfers referencing this pool's issuer (cascade when defaulted issuer has LIVE pools)"
        actor: system
        preconditions:
          - "pool.status == LIVE"
          - "pool issuer status == DEFAULTED"
        side_effects:
          - "pool custodial exposure parked pending successor acceptance"
          - "increments Pool.version by 1"
      - from: TRANSFER_PENDING
        to: LIVE
        trigger: "system (cascade from POST /portfolio-transfers/{id}/accept)"
        actor: system
        preconditions:
          - "transfer.status == ACCEPTED for the transfer covering this pool"
        side_effects:
          - "pool.issuer_id reassigned to transfer.successor_issuer_id"
          - "increments Pool.version by 1"
      - from: TRANSFER_PENDING
        to: TERMINATED
        trigger: "system (cascade from POST /portfolio-transfers/{id}/reject)"
        actor: system
        preconditions:
          - "transfer.status == REJECTED for the transfer covering this pool"
        side_effects:
          - "pool is extinguished with the defaulted issuer's portfolio"
          - "increments Pool.version by 1"
      - from: LIVE
        to: TERMINATED
        trigger: "POST /pools/{id}/terminate"
        actor: IssuerOfficer
        preconditions:
          - "pool.status == LIVE (ERR_POOL_INVALID_STATE)"
          - "aggregate_principal_cents == 0 — every loan PAID_OFF (ERR_POOL_NOT_FULLY_PAID)"
          - "no InvestorReport for this pool in {DRAFT, SUBMITTED} (ERR_UNRESOLVED_RECORDS_EXIST)"
        side_effects:
          - "increments Pool.version by 1"

  - entity: Loan
    initial_state: CURRENT
    terminal_states: [PAID_OFF]
    transitions:
      - from: CURRENT
        to: DELINQ_30
        trigger: "POST /loans/{id}/delinquency-status {to_status: DELINQ_30}"
        actor: IssuerOfficer
        preconditions:
          - "loan.status == CURRENT (ERR_LOAN_INVALID_STATE)"
          - "issuer owning the loan's pool is the acting IssuerOfficer (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Pool.delinquency_rate_bps recomputed"
          - "pool_threshold_evaluation runs: if rate >= POOL_DELINQUENCY_THRESHOLD_BPS create DelinquencyBreach(OPEN) and set issuer status ACTIVE→WATCH"
          - "increments Loan.version by 1"
      - from: DELINQ_30
        to: DELINQ_60
        trigger: "POST /loans/{id}/delinquency-status {to_status: DELINQ_60}"
        actor: IssuerOfficer
        preconditions: ["loan.status == DELINQ_30 (ERR_LOAN_INVALID_STATE)"]
        side_effects:
          - "Pool.delinquency_rate_bps recomputed; pool_threshold_evaluation runs (DELINQ_60 enters delinquent set)"
          - "increments Loan.version by 1"
      - from: DELINQ_60
        to: DELINQ_90_PLUS
        trigger: "POST /loans/{id}/delinquency-status {to_status: DELINQ_90_PLUS}"
        actor: IssuerOfficer
        preconditions: ["loan.status == DELINQ_60 (ERR_LOAN_INVALID_STATE)"]
        side_effects:
          - "Pool.delinquency_rate_bps recomputed; pool_threshold_evaluation runs"
          - "increments Loan.version by 1"
      - from: DELINQ_90_PLUS
        to: FORECLOSURE
        trigger: "POST /loans/{id}/delinquency-status {to_status: FORECLOSURE}"
        actor: IssuerOfficer
        preconditions: ["loan.status == DELINQ_90_PLUS (ERR_LOAN_INVALID_STATE)"]
        side_effects:
          - "Pool.delinquency_rate_bps recomputed; pool_threshold_evaluation runs"
          - "increments Loan.version by 1"
      - from: DELINQ_30
        to: CURRENT
        trigger: "POST /loans/{id}/delinquency-status {to_status: CURRENT}"
        actor: IssuerOfficer
        preconditions: ["loan.status == DELINQ_30 (ERR_LOAN_INVALID_STATE)"]
        side_effects:
          - "Pool.delinquency_rate_bps recomputed (loan leaves delinquent set only at DELINQ_60+; DELINQ_30 never counted)"
          - "increments Loan.version by 1"
      - from: DELINQ_60
        to: CURRENT
        trigger: "POST /loans/{id}/delinquency-status {to_status: CURRENT}"
        actor: IssuerOfficer
        preconditions: ["loan.status == DELINQ_60 (ERR_LOAN_INVALID_STATE)"]
        side_effects:
          - "Pool.delinquency_rate_bps recomputed; pool_threshold_evaluation runs (rate may fall below threshold — issuer stays WATCH until CAP closes the breach)"
          - "increments Loan.version by 1"
      - from: DELINQ_90_PLUS
        to: CURRENT
        trigger: "POST /loans/{id}/delinquency-status {to_status: CURRENT}"
        actor: IssuerOfficer
        preconditions: ["loan.status == DELINQ_90_PLUS (ERR_LOAN_INVALID_STATE)"]
        side_effects:
          - "Pool.delinquency_rate_bps recomputed; pool_threshold_evaluation runs"
          - "increments Loan.version by 1"
      - from: any non-terminal
        to: PAID_OFF
        trigger: "POST /loans/{id}/delinquency-status {to_status: PAID_OFF}"
        actor: IssuerOfficer
        preconditions: ["loan.status != PAID_OFF (ERR_LOAN_INVALID_STATE)"]
        side_effects:
          - "Pool.aggregate_principal_cents and delinquency_rate_bps recomputed (paid-off loans leave both numerator and denominator)"
          - "pool_threshold_evaluation runs"
          - "increments Loan.version by 1"

  - entity: CustodianEngagement
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /custodian-engagements/{id}/end"
        actor: IssuerOfficer
        preconditions:
          - "engagement.status == ACTIVE (ERR_ENGAGEMENT_INVALID_STATE)"
          - "engagement.issuer_id == X-User-ID for IssuerOfficer (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "window_end adjusted to the request date if later than request date"
          - "increments CustodianEngagement.version by 1"

  - entity: CustodialAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "system (cascade: issuer transitions to SUSPENDED / DEFAULTED / EXTINGUISHED, or portfolio-transfer reject extinguishment)"
        actor: system
        preconditions: ["account.status == ACTIVE"]
        side_effects:
          - "increments CustodialAccount.version by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "system (cascade: issuer returns to ACTIVE from SUSPENDED, or successor acceptance re-activates transferred portfolio)"
        actor: system
        preconditions: ["account.status == FROZEN"]
        side_effects:
          - "increments CustodialAccount.version by 1"
      - from: FROZEN
        to: CLOSED
        trigger: "system (cascade: issuer extinguished without successor)"
        actor: system
        preconditions: ["account.status == FROZEN"]
        side_effects:
          - "increments CustodialAccount.version by 1"

  - entity: InvestorReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /investor-reports/{id}/submit"
        actor: IssuerOfficer
        preconditions:
          - "report.status == DRAFT (ERR_REPORT_INVALID_STATE)"
          - "pool of report is in {CERTIFIED, LIVE} and issuer of pool == acting IssuerOfficer (ERR_NOT_RESOURCE_OWNER)"
          - "no other InvestorReport for same pool_id and period_month exists (ERR_DUPLICATE_REPORT_PERIOD)"
        side_effects:
          - "increments InvestorReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /investor-reports/{id}/accept"
        actor: AgencyReviewer
        preconditions: ["report.status == SUBMITTED (ERR_REPORT_INVALID_STATE)"]
        side_effects:
          - "creates PassThroughPayment (status DUE, amount_cents = scheduled_payment_cents)"
          - "increments InvestorReport.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /investor-reports/{id}/reject"
        actor: AgencyReviewer
        preconditions: ["report.status == SUBMITTED (ERR_REPORT_INVALID_STATE)"]
        side_effects:
          - "increments InvestorReport.version by 1"

  - entity: PassThroughPayment
    initial_state: DUE
    terminal_states: [PAID, ADVANCED]
    transitions:
      - from: DUE
        to: PAID
        trigger: "POST /pass-through-payments/{id}/settle"
        actor: IssuerOfficer
        preconditions:
          - "payment.status == DUE (ERR_PAYMENT_INVALID_STATE)"
          - "P_AND_I CustodialAccount of the pool issuer is ACTIVE (a FROZEN account routes the settle to the ADVANCE path instead)"
          - "P_AND_I principal_balance_cents + interest_balance_cents >= amount_cents (a shortfall routes the settle to the ADVANCE path instead)"
        side_effects:
          - "funding_source = CUSTODIAL"
          - "creates AccountTransaction DISBURSEMENT amount_cents debiting P_AND_I (allocation per custodial_allocation)"
          - "custodial_reconciliation invariant holds across the settle"
          - "increments PassThroughPayment.version by 1"
      - from: DUE
        to: ADVANCED
        trigger: "POST /pass-through-payments/{id}/settle when the custodial path is unavailable (account not ACTIVE or balance shortfall)"
        actor: IssuerOfficer
        preconditions:
          - "payment.status == DUE (ERR_PAYMENT_INVALID_STATE)"
          - "P_AND_I account not ACTIVE, or principal_balance_cents + interest_balance_cents < amount_cents"
        side_effects:
          - "funding_source = ADVANCE"
          - "creates LiquidityAdvance (status OPEN, amount_cents = payment amount_cents) for the pool issuer"
          - "Issuer.advance_obligation_cents recomputed; liquidity ratios recomputed; liquidity_threshold_evaluation runs"
          - "advance_conservation invariant holds across the settle"
          - "increments PassThroughPayment.version by 1"

  - entity: LiquidityAdvance
    initial_state: OPEN
    terminal_states: [REIMBURSED, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: REIMBURSED
        trigger: "POST /liquidity-advances/{id}/reimburse"
        actor: IssuerOfficer
        preconditions:
          - "advance.status == OPEN (ERR_ADVANCE_INVALID_STATE)"
          - "advance.issuer_id == X-User-ID for IssuerOfficer (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Issuer.advance_obligation_cents recomputed; liquidity ratios recomputed; liquidity_threshold_evaluation runs (may lift SUSPENDED → ACTIVE when ratio restored and no blocking breach)"
          - "advance_conservation invariant holds across the reimburse"
          - "increments LiquidityAdvance.version by 1"
      - from: OPEN
        to: WRITTEN_OFF
        trigger: "system (cascade from defaulted-issuer extinguishment without successor)"
        actor: system
        preconditions: ["advance.status == OPEN"]
        side_effects:
          - "advance removed from issuer advance_obligation_cents (obligation extinguished with portfolio)"

  - entity: Issuer
    initial_state: ACTIVE
    terminal_states: [EXTINGUISHED]
    transitions:
      - from: ACTIVE
        to: WATCH
        trigger: "system (cascade: first DelinquencyBreach created for any of issuer's pools)"
        actor: system
        preconditions: ["issuer.status == ACTIVE"]
        side_effects:
          - "issuer remains operational; pool transitions still allowed while WATCH"
          - "increments Issuer.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascade: liquidity_threshold_evaluation finds liquidity_ratio_excluding_credit_bps < LIQUIDITY_HARD_FLOOR_BPS)"
        actor: system
        preconditions: ["issuer.status == ACTIVE"]
        side_effects:
          - "issuer CustodialAccounts ACTIVE → FROZEN"
          - "pool assemble/activate, engagement creation, and custodial deposit/disbursement operations blocked while SUSPENDED; pass-through settle continues (routes to the ADVANCE path because accounts are FROZEN)"
          - "increments Issuer.version by 1"
      - from: WATCH
        to: SUSPENDED
        trigger: "system (cascade: liquidity_threshold_evaluation finds liquidity_ratio_excluding_credit_bps < LIQUIDITY_HARD_FLOOR_BPS)"
        actor: system
        preconditions: ["issuer.status == WATCH"]
        side_effects:
          - "same as ACTIVE → SUSPENDED"
          - "increments Issuer.version by 1"
      - from: WATCH
        to: ACTIVE
        trigger: "system (cascade: CorrectiveActionPlan accepted AND no other OPEN/MITIGATING breach on issuer AND liquidity ratio not below hard floor)"
        actor: system
        preconditions: ["issuer.status == WATCH"]
        side_effects:
          - "increments Issuer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (cascade: LiquidityAdvance reimbursed such that liquidity_ratio_excluding_credit_bps >= LIQUIDITY_HARD_FLOOR_BPS again)"
        actor: system
        preconditions: ["issuer.status == SUSPENDED", "no OPEN/MITIGATING breach keeps issuer at WATCH — if a breach exists, issuer returns to WATCH instead"]
        side_effects:
          - "issuer CustodialAccounts FROZEN → ACTIVE"
          - "increments Issuer.version by 1"
      - from: SUSPENDED
        to: WATCH
        trigger: "system (cascade: liquidity restored but an OPEN/MITIGATING DelinquencyBreach still exists)"
        actor: system
        preconditions: ["issuer.status == SUSPENDED"]
        side_effects:
          - "issuer CustodialAccounts FROZEN → ACTIVE"
          - "increments Issuer.version by 1"
      - from: WATCH
        to: DEFAULTED
        trigger: "POST /issuers/{id}/default"
        actor: AgencyReviewer
        preconditions: ["issuer.status in {ACTIVE, WATCH, SUSPENDED} (ERR_ISSUER_INVALID_STATE)"]
        side_effects:
          - "issuer CustodialAccounts ACTIVE → FROZEN"
          - "increments Issuer.version by 1"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /issuers/{id}/default"
        actor: AgencyReviewer
        preconditions: ["issuer.status in {ACTIVE, WATCH, SUSPENDED} (ERR_ISSUER_INVALID_STATE)"]
        side_effects:
          - "issuer CustodialAccounts ACTIVE → FROZEN"
          - "increments Issuer.version by 1"
      - from: SUSPENDED
        to: DEFAULTED
        trigger: "POST /issuers/{id}/default"
        actor: AgencyReviewer
        preconditions: ["issuer.status in {ACTIVE, WATCH, SUSPENDED} (ERR_ISSUER_INVALID_STATE)"]
        side_effects:
          - "issuer CustodialAccounts remain FROZEN"
          - "increments Issuer.version by 1"
      - from: DEFAULTED
        to: EXTINGUISHED
        trigger: "system (cascade from POST /portfolio-transfers/{id}/reject — portfolio extinguished without successor)"
        actor: system
        preconditions: ["issuer.status == DEFAULTED"]
        side_effects:
          - "all issuer pools TRANSFER_PENDING → TERMINATED"
          - "issuer CustodialAccounts FROZEN → CLOSED"
          - "all OPEN LiquidityAdvances → WRITTEN_OFF"
          - "increments Issuer.version by 1"

  - entity: DelinquencyBreach
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: MITIGATING
        trigger: "system (cascade: CorrectiveActionPlan accepted for this breach)"
        actor: system
        preconditions: ["breach.status == OPEN"]
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /delinquency-breaches/{id}/close"
        actor: AgencyReviewer
        preconditions:
          - "breach.status == OPEN (ERR_BREACH_INVALID_STATE)"
          - "breach pool's current delinquency_rate_bps < POOL_DELINQUENCY_THRESHOLD_BPS (ERR_BREACH_STILL_BREACHING)"
        side_effects:
          - "issuer status re-evaluated: WATCH → ACTIVE if no other OPEN/MITIGATING breach and liquidity not below hard floor"
      - from: MITIGATING
        to: CLOSED
        trigger: "POST /delinquency-breaches/{id}/close"
        actor: AgencyReviewer
        preconditions:
          - "breach.status == MITIGATING (ERR_BREACH_INVALID_STATE)"
          - "breach pool's current delinquency_rate_bps < POOL_DELINQUENCY_THRESHOLD_BPS (ERR_BREACH_STILL_BREACHING)"
        side_effects:
          - "issuer status re-evaluated as above"

  - entity: CorrectiveActionPlan
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /corrective-action-plans/{id}/accept"
        actor: AgencyReviewer
        preconditions: ["plan.status == SUBMITTED (ERR_PLAN_INVALID_STATE)"]
        side_effects:
          - "DelinquencyBreach OPEN → MITIGATING"
          - "issuer status re-evaluated (WATCH → ACTIVE when this was the only blocking breach and liquidity not below hard floor)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /corrective-action-plans/{id}/reject"
        actor: AgencyReviewer
        preconditions: ["plan.status == SUBMITTED (ERR_PLAN_INVALID_STATE)"]
        side_effects: []

  - entity: PortfolioTransfer
    initial_state: INITIATED
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: INITIATED
        to: ACCEPTED
        trigger: "POST /portfolio-transfers/{id}/accept"
        actor: AgencyReviewer
        preconditions:
          - "transfer.status == INITIATED (ERR_TRANSFER_INVALID_STATE)"
          - "successor issuer status == ACTIVE (ERR_SUCCESSOR_NOT_ACTIVE)"
          - "successor issuer liquidity_ratio_including_credit_bps >= LIQUIDITY_MONITOR_THRESHOLD_BPS after assuming defaulted issuer's advance obligations (ERR_SUCCESSOR_UNDERCAPITALIZED)"
        side_effects:
          - "each LIVE pool of defaulted issuer: TRANSFER_PENDING → LIVE with issuer_id = successor_issuer_id"
          - "defaulted issuer OPEN LiquidityAdvances reassigned to successor issuer (obligation transfers; advance_conservation holds)"
          - "defaulted issuer → EXTINGUISHED; its CustodialAccounts FROZEN → CLOSED"
          - "successor advance_obligation_cents / liquidity ratios recomputed; liquidity_threshold_evaluation runs for successor"
      - from: INITIATED
        to: REJECTED
        trigger: "POST /portfolio-transfers/{id}/reject"
        actor: AgencyReviewer
        preconditions: ["transfer.status == INITIATED (ERR_TRANSFER_INVALID_STATE)"]
        side_effects:
          - "each TRANSFER_PENDING pool of defaulted issuer → TERMINATED"
          - "defaulted issuer → EXTINGUISHED; CustodialAccounts FROZEN → CLOSED; OPEN advances → WRITTEN_OFF"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: pool-create-stale-issuer
    parent_entity: Issuer
    write_endpoint: "POST /pools"
    occ_field: expected_issuer_version
    description: |
      Creating a Pool against an Issuer whose version has advanced since the
      client last observed it is rejected, because issuer-level mutations
      (financial refresh, status cascades) may have changed the issuer's
      pooling eligibility since the client computed it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: report-create-stale-pool
    parent_entity: Pool
    write_endpoint: "POST /investor-reports"
    occ_field: expected_pool_version
    description: |
      Creating an InvestorReport against a Pool whose version has advanced
      since the client last observed it is rejected, because pool membership
      or certification changes alter the payment computation basis.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: transfer-create-stale-issuer
    parent_entity: Issuer
    write_endpoint: "POST /portfolio-transfers"
    occ_field: expected_defaulted_issuer_version
    description: |
      Creating a PortfolioTransfer against a defaulted Issuer whose version
      has advanced since the client last observed it is rejected, because a
      new pool or advance may have entered the extinguishment set.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: issuer-financials-stale-issuer
    parent_entity: Issuer
    write_endpoint: "PATCH /issuers/{id}/financials"
    occ_field: expected_issuer_version
    description: |
      Updating an Issuer's liquid_assets_cents / unused_credit_lines_cents
      with a stale expected version is rejected, because a status cascade may
      have frozen the issuer since the client last read it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: application-patch-stale-application
    parent_entity: IssuerApplication
    write_endpoint: "PATCH /issuer-applications/{id}"
    occ_field: expected_application_version
    description: |
      Patching an IssuerApplication with a stale expected version is rejected;
      the applicant must re-read the application before editing financials.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_worth_requirement
    trigger: "IssuerApplication submit (and re-checked on each revision PATCH)"
    algorithm: tiered_pricing
    formula: |
      branch_component = (branch_count - 1) * PER_BRANCH_NET_WORTH_CENTS
      required = max(MIN_NET_WORTH_CENTS + branch_component,
                     floor(annual_origination_volume_cents * VOLUME_NET_WORTH_BPS / 10000))
      eligible = (net_worth_cents >= required)
    input_set: "single IssuerApplication row"
    constants:
      MIN_NET_WORTH_CENTS: 250000000        # $2.5M
      PER_BRANCH_NET_WORTH_CENTS: 25000000  # +$250k per additional branch
      VOLUME_NET_WORTH_BPS: 10              # 0.10% of origination volume
    precision: "integer cents, no rounding"
    variants:
      - name: branch_tier_binding
        when: "branch component dominates volume component"
        difference: "required = MIN + branch_component"
      - name: volume_tier_binding
        when: "volume component dominates"
        difference: "required = floor(volume * 10bps); floor, not round"

  - name: liquidity_ratio
    trigger: "advance creation, advance reimbursement, issuer financial PATCH, transfer accept"
    algorithm: threshold
    formula: |
      if advance_obligation_cents == 0:
        ratio_excluding = null; ratio_including = null; breach = false
      else:
        ratio_excluding = floor(liquid_assets_cents * 10000 / advance_obligation_cents)
        ratio_including = floor((liquid_assets_cents + unused_credit_lines_cents) * 10000 / advance_obligation_cents)
        soft_breach = ratio_excluding < LIQUIDITY_MONITOR_THRESHOLD_BPS
        hard_breach = ratio_excluding < LIQUIDITY_HARD_FLOOR_BPS
      # hard floor evaluated on EXCLUDING ratio; soft monitoring threshold
      # gates successor eligibility on INCLUDING ratio — different numerators.
    input_set: "single Issuer row + its OPEN LiquidityAdvance rows"
    constants:
      LIQUIDITY_MONITOR_THRESHOLD_BPS: 500  # 5% of advance obligations
      LIQUIDITY_HARD_FLOOR_BPS: 300         # 3% hard floor -> SUSPENDED
    precision: "integer basis points, floor"
    variants:
      - name: excluding_credit
        when: "hard-floor suspension test; issuer self-monitoring"
        difference: "numerator = liquid_assets_cents only"
      - name: including_credit
        when: "successor eligibility test at portfolio transfer accept"
        difference: "numerator = liquid_assets_cents + unused_credit_lines_cents; same denominator, different numerator -> different bps for identical obligation"

  - name: pass_through_payment
    trigger: "InvestorReport creation (values pinned at report creation, not recomputed later)"
    algorithm: forward_looking
    formula: |
      For pool loans with status != PAID_OFF:
        per-loan scheduled interest = floor(principal_balance_cents * pool.note_rate_bps / 10000 / 12)
      scheduled_payment = sum(per-loan scheduled interest)   # note rate = security pass-through rate
      # Evaluation order is pinned: round each loan's interest FIRST, then sum.
      # (Sum-then-round is a different, wrong algorithm.)
      scheduled_ratio = sum(principal_balance_cents * pool.note_rate_bps for loans) / 10000 / 12
      actual_collected = floor(scheduled_ratio * collection_rate_bps / 10000)
      advance_required = scheduled_payment - actual_collected
    input_set: "loans of the pool with status != PAID_OFF at report creation"
    constants:
      PASS_THROUGH_MONTHS: 12
    precision: "integer cents; per-loan interest floored before summing"
    variants:
      - name: scheduled_variant
        when: "scheduled_payment_cents field; also fixes PassThroughPayment.amount_cents — owed regardless of borrower delinquency"
        difference: "assumes full collection (collection_rate = 10000 bps); sum of per-loan floored interest"
      - name: actual_variant
        when: "actual_collected_cents field"
        difference: "scales the UNROUNDED aggregate ratio by collection_rate_bps, then floors once — not a per-loan rounding of actuals; differs from scheduled by both the collection rate AND the rounding order"

  - name: pool_delinquency_rate
    trigger: "every Loan delinquency-status change and PAID_OFF transition"
    algorithm: aggregation
    formula: |
      delinquent_set = loans of pool with status in {DELINQ_60, DELINQ_90_PLUS, FORECLOSURE}
      numerator = sum(delinquent_set.principal_balance_cents)
      denominator = aggregate_principal_cents = sum(loans.principal_balance_cents where status != PAID_OFF)
      if denominator == 0: delinquency_rate_bps = 0
      else: delinquency_rate_bps = round_half_up(numerator * 10000 / denominator)
      # NOTE: numerator is a subset of denominator; PAID_OFF exits BOTH.
    input_set: "all loans of the pool"
    precision: "integer basis points, round_half_up"

  - name: pool_threshold_evaluation
    trigger: "runs immediately after every pool_delinquency_rate recompute"
    algorithm: threshold
    formula: |
      breach_exists = exists DelinquencyBreach for pool with status in {OPEN, MITIGATING}
      if delinquency_rate_bps >= POOL_DELINQUENCY_THRESHOLD_BPS and not breach_exists:
        create DelinquencyBreach(OPEN, delinquency_rate_bps_at_breach = current rate)
        if issuer.status == ACTIVE: issuer.status = WATCH
      # Closing a breach is NEVER automatic: even when the rate falls back below
      # threshold, the breach stays OPEN until AgencyReviewer closes it.
    input_set: "the recomputed pool + issuer"
    constants:
      POOL_DELINQUENCY_THRESHOLD_BPS: 500   # 5% of aggregate principal
    precision: "integer bps comparison, >= is inclusive (exactly 500 breaches)"

  - name: liquidity_threshold_evaluation
    trigger: "runs immediately after every liquidity_ratio recompute"
    algorithm: threshold
    formula: |
      if ratio_excluding != null and ratio_excluding < LIQUIDITY_HARD_FLOOR_BPS:
        if issuer.status in {ACTIVE, WATCH}: issuer -> SUSPENDED (+ account freeze cascade)
      # recovery: on advance reimbursement,
      #   ratio_excluding >= LIQUIDITY_HARD_FLOOR_BPS and no OPEN/MITIGATING breach -> SUSPENDED -> ACTIVE
      #   ratio restored but breach exists -> SUSPENDED -> WATCH
    input_set: "issuer + its breaches"
    constants:
      LIQUIDITY_HARD_FLOOR_BPS: 300
    precision: "integer bps, strict < for suspension; >= for recovery (exactly 300 does NOT suspend)"

  - name: escrow_split
    trigger: "POST /custodial-accounts/{id}/transactions with component ESCROW on a T_AND_I account"
    algorithm: waterfall_allocation
    formula: |
      tax_split = floor(amount_cents * ESCROW_TAX_SHARE_BPS / 10000)
      insurance_split = amount_cents - tax_split
      # rounding remainder goes to insurance — pinned, never the reverse
    input_set: "single transaction"
    constants:
      ESCROW_TAX_SHARE_BPS: 6000   # 60% tax, 40% insurance (+ remainder)
    precision: "integer cents"

  - name: custodial_allocation
    trigger: "PassThroughPayment settle via CUSTODIAL"
    algorithm: waterfall_allocation
    formula: |
      remaining = payment.amount_cents
      interest_draw = min(remaining, account.interest_balance_cents)
      remaining -= interest_draw
      principal_draw = min(remaining, account.principal_balance_cents)
      remaining -= principal_draw
      if remaining > 0: the settle does NOT debit partially; the payment routes
        to the ADVANCE path instead (see PassThroughPayment DUE -> ADVANCED).
        ERR_INSUFFICIENT_CUSTODIAL_FUNDS therefore fires only on raw
        DISBURSEMENT AccountTransactions, never on settle.
      # interest bucket drains before principal — pinned order
    input_set: "issuer's P_AND_I CustodialAccount"
    precision: "integer cents"

  - name: pool_composition_check
    trigger: "POST /pools/{id}/assemble"
    algorithm: aggregation
    formula: |
      count = number of loans in pool
      if count > MAX_LOANS_PER_POOL[pool_type]: reject ERR_POOL_LOAN_COUNT_EXCEEDED
      if aggregate_principal_cents < MIN_POOL_PRINCIPAL_CENTS: reject ERR_POOL_BELOW_MINIMUM_PRINCIPAL
    input_set: "all loans of the pool"
    constants:
      MIN_POOL_PRINCIPAL_CENTS: 100000000   # $1M minimum pool balance
      MAX_LOANS_PER_POOL: {SINGLE_FAMILY: 3, MANUFACTURED_HOME: 3, MULTIFAMILY: 2}
    precision: "integer"

  - name: custodial_reconciliation
    trigger: "every AccountTransaction creation"
    algorithm: aggregation
    formula: |
      invariant: account.balance_cents == sum(DEPOSIT amounts) - sum(DISBURSEMENT amounts)
                 over all AccountTransactions of the account, and
                 balance_cents == principal_balance_cents + interest_balance_cents (P_AND_I)
                 or tax_balance_cents + insurance_balance_cents (T_AND_I)
      A transaction that would drive any component negative is rejected
      (ERR_INSUFFICIENT_CUSTODIAL_FUNDS); the invariant therefore holds after
      every accepted posting.
    input_set: "all AccountTransactions of the account"

  - name: advance_conservation
    trigger: "pass-through settle-as-advance, advance reimbursement, transfer accept/reject extinguishment"
    algorithm: aggregation
    formula: |
      invariant across any forward action + its compensating action:
        global_open_advance_cents == sum(OPEN LiquidityAdvance.amount_cents over ALL issuers)
      settle-as-advance (+X) then reimburse (-X) restores the prior global total;
      transfer accept moves OPEN advances from defaulted issuer to successor with
      zero change to the global total; extinguishment write-off is the ONLY
      sanctioned reduction and is paired with issuer EXTINGUISHED.
    input_set: "all LiquidityAdvance rows with status OPEN"

  - name: engagement_coverage_check
    trigger: "POST /pools (creation) and POST /pools/{id}/certifications"
    algorithm: interval_merge
    formula: |
      A pool creation or certification at request date D requires an
      engagement e with e.custodian_id == pool.custodian_id,
      e.issuer_id == pool.issuer_id, e.status == ACTIVE, and
      e.window_start <= D < e.window_end   (half-open interval).
      Two engagements on the same (custodian_id, issuer_id) pair with
      status ACTIVE must have DISJOINT half-open windows: touching windows
      (a.window_end == b.window_start) are allowed, any positive overlap
      is rejected with ERR_ENGAGEMENT_WINDOW_OVERLAP.
    input_set: "engagements of the (custodian, issuer) pair"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role value recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist (validated left-to-right through the path)"
    error_id: "ERR_APPLICATION_NOT_FOUND | ERR_ISSUER_NOT_FOUND | ERR_CUSTODIAN_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_POOL_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_ADVANCE_NOT_FOUND | ERR_BREACH_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_TRANSFER_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: auth
    check: "Ownership: for IssuerOfficer, X-User-ID must equal the issuer id that owns the target resource (pool.issuer_id, engagement.issuer_id, advance.issuer_id, account.issuer_id, loan pool issuer, report/payment pool issuer, plan breach pool issuer)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "IssuerOfficer write endpoints"
  - priority: 5
    category: state
    check: "Target entity in a state from which the requested transition exists per §1.2"
    error_id: "ERR_APPLICATION_INVALID_STATE | ERR_ISSUER_INVALID_STATE | ERR_POOL_INVALID_STATE | ERR_LOAN_INVALID_STATE | ERR_ACCOUNT_INVALID_STATE | ERR_REPORT_INVALID_STATE | ERR_PAYMENT_INVALID_STATE | ERR_ADVANCE_INVALID_STATE | ERR_BREACH_INVALID_STATE | ERR_PLAN_INVALID_STATE | ERR_TRANSFER_INVALID_STATE | ERR_ENGAGEMENT_INVALID_STATE"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_*_version equals current parent version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /pools, POST /investor-reports, POST /portfolio-transfers, PATCH /issuers/{id}/financials, PATCH /issuer-applications/{id}"
  - priority: 7
    category: business_constraint
    check: "Request shape: required fields present, enums valid, integers in range, dates parseable, term_months valid for pool_type"
    error_id: "ERR_INVALID_REQUEST | ERR_POOL_TERM_INVALID"
    http_status: 400
    applies_to: "create/patch endpoints"
  - priority: 8
    category: business_referential
    check: "Loan government_insurance allowed for pool_type (MULTIFAMILY requires FHA); loan note rate within [pool note_rate+50, pool note_rate+150] bps; at most one CustodialAccount per (issuer, account_type); no duplicate InvestorReport for (pool, period_month); engagement windows disjoint on the (custodian, issuer) pair; custodian engagement covers the request date at pool create and certify"
    error_id: "ERR_INSURER_NOT_ALLOWED | ERR_LOAN_NOTE_RATE_OUT_OF_RANGE | ERR_ACCOUNT_TYPE_DUPLICATE | ERR_DUPLICATE_REPORT_PERIOD | ERR_ENGAGEMENT_WINDOW_OVERLAP | ERR_CUSTODIAN_ENGAGEMENT_GAP"
    http_status: 422
    applies_to: "loan create, account create, report create, engagement create, pool create, certification create"
  - priority: 9
    category: business_safety
    check: "Compliance gates: issuer application thresholds (net worth tier, liquidity <= net worth, experience >= 24 months); segregation of duties at approve/deny; successor capitalization at transfer accept; pool composition (loan count, min principal); custodian certification required before activate"
    error_id: "ERR_NET_WORTH_DEFICIENT | ERR_LIQUIDITY_EXCEEDS_NET_WORTH | ERR_INSUFFICIENT_EXPERIENCE | ERR_SEGREGATION_OF_DUTIES | ERR_SUCCESSOR_UNDERCAPITALIZED | ERR_SUCCESSOR_NOT_ACTIVE | ERR_POOL_LOAN_COUNT_EXCEEDED | ERR_POOL_BELOW_MINIMUM_PRINCIPAL | ERR_POOL_EMPTY | ERR_CERTIFICATION_REQUIRED"
    http_status: 422
    applies_to: "application submit, application approve/deny, transfer accept, pool assemble, pool activate"
  - priority: 10
    category: business_fiscal
    check: "Funds/capacity: custodial component balances cover raw disbursements; account ACTIVE for deposit/disbursement transactions; issuer not SUSPENDED/DEFAULTED/EXTINGUISHED for pool or account operations"
    error_id: "ERR_INSUFFICIENT_CUSTODIAL_FUNDS | ERR_ACCOUNT_FROZEN | ERR_ISSUER_NOT_ACTIVE"
    http_status: 422
    applies_to: "transaction create, payment settle, pool assemble/activate, engagement create"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (the fixed startup default) and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: {current_utc: string}
    side_effects: []

  # --- IssuerApplication ---
  - method: POST
    path: "/issuer-applications"
    description: "Create issuer application in DRAFT"
    roles: [ApplicantOfficer]
    code: 201
    input: [legal_name, net_worth_cents, liquid_assets_cents, "unused_credit_lines_cents?", origination_experience_months, branch_count, annual_origination_volume_cents]
    output: IssuerApplication
    side_effects: ["net_worth_requirement_cents computed per net_worth_requirement"]
  - method: GET
    path: "/issuer-applications"
    description: "List issuer applications"
    roles: [ApplicantOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "IssuerApplication[]"
    side_effects: []
  - method: GET
    path: "/issuer-applications/{id}"
    description: "Get an issuer application"
    roles: [ApplicantOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: []
    output: IssuerApplication
    side_effects: []
  - method: PATCH
    path: "/issuer-applications/{id}"
    description: "Edit application fields (DRAFT); from REVISION_REQUESTED also returns the application to DRAFT"
    roles: [ApplicantOfficer]
    code: 200
    input: [expected_application_version, "legal_name?", "net_worth_cents?", "liquid_assets_cents?", "unused_credit_lines_cents?", "origination_experience_months?", "branch_count?", "annual_origination_volume_cents?"]
    output: IssuerApplication
    side_effects: ["net_worth_requirement_cents recomputed", "increments IssuerApplication.version by 1", "REVISION_REQUESTED -> DRAFT"]
  - method: POST
    path: "/issuer-applications/{id}/submit"
    description: "Submit application for review (runs threshold gates)"
    roles: [ApplicantOfficer]
    code: 200
    input: []
    output: IssuerApplication
    side_effects: ["DRAFT -> SUBMITTED"]
  - method: POST
    path: "/issuer-applications/{id}/review"
    description: "Open review"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: IssuerApplication
    side_effects: ["SUBMITTED -> UNDER_REVIEW"]
  - method: POST
    path: "/issuer-applications/{id}/request-revision"
    description: "Send application back for revision"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: IssuerApplication
    side_effects: ["UNDER_REVIEW -> REVISION_REQUESTED"]
  - method: POST
    path: "/issuer-applications/{id}/approve"
    description: "Approve application; creates Issuer"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: IssuerApplication
    side_effects: ["UNDER_REVIEW -> APPROVED", "creates Issuer (ACTIVE)"]
  - method: POST
    path: "/issuer-applications/{id}/deny"
    description: "Deny application"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: IssuerApplication
    side_effects: ["UNDER_REVIEW -> DENIED"]

  # --- Issuer ---
  - method: GET
    path: "/issuers"
    description: "List issuers"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin, DocumentCustodian]
    code: 200
    input: ["application_id?", "limit?", "offset?"]
    output: "Issuer[]"
    side_effects: []
  - method: GET
    path: "/issuers/{id}"
    description: "Get issuer incl. computed advance obligations and liquidity ratios"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin, DocumentCustodian]
    code: 200
    input: []
    output: Issuer
    side_effects: []
  - method: PATCH
    path: "/issuers/{id}/financials"
    description: "Update issuer liquid assets / unused credit lines (OCC-guarded)"
    roles: [IssuerOfficer]
    code: 200
    input: [expected_issuer_version, "liquid_assets_cents?", "unused_credit_lines_cents?"]
    output: Issuer
    side_effects: ["liquidity ratios recomputed; liquidity_threshold_evaluation runs", "increments Issuer.version by 1"]
  - method: POST
    path: "/issuers/{id}/default"
    description: "Declare issuer default (agency action)"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: Issuer
    side_effects: ["issuer -> DEFAULTED", "CustodialAccounts ACTIVE -> FROZEN"]

  # --- DocumentCustodian ---
  - method: POST
    path: "/document-custodians"
    description: "Register a document custodian"
    roles: [PlatformAdmin]
    code: 201
    input: [firm_name]
    output: DocumentCustodian
    side_effects: []
  - method: GET
    path: "/document-custodians"
    description: "List custodians"
    roles: [PlatformAdmin, AgencyReviewer, IssuerOfficer, DocumentCustodian]
    code: 200
    input: ["limit?", "offset?"]
    output: "DocumentCustodian[]"
    side_effects: []
  - method: GET
    path: "/document-custodians/{id}"
    description: "Get a custodian"
    roles: [PlatformAdmin, AgencyReviewer, IssuerOfficer, DocumentCustodian]
    code: 200
    input: []
    output: DocumentCustodian
    side_effects: []

  # --- CustodianEngagement ---
  - method: POST
    path: "/custodian-engagements"
    description: "Create custodian engagement with half-open [window_start, window_end)"
    roles: [IssuerOfficer]
    code: 201
    input: [custodian_id, issuer_id, window_start, window_end]
    output: CustodianEngagement
    side_effects: ["engagement_coverage_check disjointness validated"]
  - method: GET
    path: "/custodian-engagements"
    description: "List engagements (filterable)"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin, DocumentCustodian]
    code: 200
    input: ["custodian_id?", "issuer_id?", "limit?", "offset?"]
    output: "CustodianEngagement[]"
    side_effects: []
  - method: GET
    path: "/custodian-engagements/{id}"
    description: "Get an engagement"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin, DocumentCustodian]
    code: 200
    input: []
    output: CustodianEngagement
    side_effects: []
  - method: POST
    path: "/custodian-engagements/{id}/end"
    description: "End an engagement"
    roles: [IssuerOfficer]
    code: 200
    input: []
    output: CustodianEngagement
    side_effects: ["ACTIVE -> ENDED"]

  # --- Pool ---
  - method: POST
    path: "/pools"
    description: "Create pool in DRAFT (OCC-guarded on issuer version)"
    roles: [IssuerOfficer]
    code: 201
    input: [issuer_id, custodian_id, pool_type, term_months, note_rate_bps, expected_issuer_version]
    output: Pool
    side_effects: ["engagement coverage checked at current clock date", "increments Issuer.version by 1"]
  - method: GET
    path: "/pools"
    description: "List pools"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin, DocumentCustodian]
    code: 200
    input: ["issuer_id?", "custodian_id?", "limit?", "offset?"]
    output: "Pool[]"
    side_effects: []
  - method: GET
    path: "/pools/{id}"
    description: "Get pool incl. computed aggregate principal and delinquency rate"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin, DocumentCustodian]
    code: 200
    input: []
    output: Pool
    side_effects: []
  - method: POST
    path: "/pools/{id}/assemble"
    description: "Assemble pool (composition gates)"
    roles: [IssuerOfficer]
    code: 200
    input: []
    output: Pool
    side_effects: ["DRAFT -> ASSEMBLED"]
  - method: POST
    path: "/pools/{id}/certifications"
    description: "Custodian certifies loan files (CERTIFIED or EXCEPTION)"
    roles: [DocumentCustodian]
    code: 201
    input: [decision, "exception_loan_ids?"]
    output: LoanFileCertification
    side_effects: ["CERTIFIED: pool ASSEMBLED -> CERTIFIED; engagement coverage checked at current clock date"]
  - method: GET
    path: "/pools/{id}/certifications"
    description: "List certifications for a pool"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin, DocumentCustodian]
    code: 200
    input: ["limit?", "offset?"]
    output: "LoanFileCertification[]"
    side_effects: []
  - method: POST
    path: "/pools/{id}/activate"
    description: "Activate certified pool; creates first monthly InvestorReport (DRAFT)"
    roles: [IssuerOfficer]
    code: 200
    input: []
    output: Pool
    side_effects: ["CERTIFIED -> LIVE", "creates InvestorReport DRAFT for current month"]
  - method: POST
    path: "/pools/{id}/terminate"
    description: "Terminate a fully-paid pool with no open reports"
    roles: [IssuerOfficer]
    code: 200
    input: []
    output: Pool
    side_effects: ["LIVE -> TERMINATED"]

  # --- Loan ---
  - method: POST
    path: "/loans"
    description: "Add a loan to a DRAFT pool"
    roles: [IssuerOfficer]
    code: 201
    input: [pool_id, principal_balance_cents, note_rate_bps, government_insurance, escrow_monthly_cents]
    output: Loan
    side_effects: ["pool aggregate_principal_cents / delinquency_rate_bps recomputed"]
  - method: GET
    path: "/loans"
    description: "List loans"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin, DocumentCustodian]
    code: 200
    input: ["pool_id?", "limit?", "offset?"]
    output: "Loan[]"
    side_effects: []
  - method: GET
    path: "/loans/{id}"
    description: "Get a loan"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin, DocumentCustodian]
    code: 200
    input: []
    output: Loan
    side_effects: []
  - method: POST
    path: "/loans/{id}/delinquency-status"
    description: "Move a loan along the delinquency ladder or to PAID_OFF"
    roles: [IssuerOfficer]
    code: 200
    input: [to_status]
    output: Loan
    side_effects: ["pool delinquency recomputed; pool_threshold_evaluation may create breach and WATCH the issuer"]

  # --- CustodialAccount / AccountTransaction ---
  - method: POST
    path: "/custodial-accounts"
    description: "Open a custodial account (P_AND_I or T_AND_I) for an issuer"
    roles: [IssuerOfficer]
    code: 201
    input: [issuer_id, account_type]
    output: CustodialAccount
    side_effects: ["uniqueness per (issuer_id, account_type) enforced"]
  - method: GET
    path: "/custodial-accounts"
    description: "List custodial accounts"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: ["issuer_id?", "limit?", "offset?"]
    output: "CustodialAccount[]"
    side_effects: []
  - method: GET
    path: "/custodial-accounts/{id}"
    description: "Get account incl. component balances"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: []
    output: CustodialAccount
    side_effects: []
  - method: POST
    path: "/custodial-accounts/{id}/transactions"
    description: "Post a deposit or disbursement; ESCROW deposits split per escrow_split"
    roles: [IssuerOfficer]
    code: 201
    input: [component, amount_cents, "loan_id?"]
    output: AccountTransaction
    side_effects: ["component balance updated; custodial_reconciliation invariant maintained", "account must be ACTIVE (ERR_ACCOUNT_FROZEN)"]
  - method: GET
    path: "/custodial-accounts/{id}/transactions"
    description: "List transactions for an account"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "AccountTransaction[]"
    side_effects: []

  # --- InvestorReport ---
  - method: POST
    path: "/investor-reports"
    description: "Create monthly investor report (OCC-guarded on pool version); scheduled/actual/advance computed at creation"
    roles: [IssuerOfficer]
    code: 201
    input: [pool_id, period_month, collection_rate_bps, expected_pool_version]
    output: InvestorReport
    side_effects: ["pass_through_payment computed and pinned on the report"]
  - method: GET
    path: "/investor-reports"
    description: "List investor reports"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: ["pool_id?", "limit?", "offset?"]
    output: "InvestorReport[]"
    side_effects: []
  - method: GET
    path: "/investor-reports/{id}"
    description: "Get an investor report"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: []
    output: InvestorReport
    side_effects: []
  - method: POST
    path: "/investor-reports/{id}/submit"
    description: "Submit report"
    roles: [IssuerOfficer]
    code: 200
    input: []
    output: InvestorReport
    side_effects: ["DRAFT -> SUBMITTED"]
  - method: POST
    path: "/investor-reports/{id}/accept"
    description: "Accept report; generates PassThroughPayment DUE"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: InvestorReport
    side_effects: ["SUBMITTED -> ACCEPTED", "creates PassThroughPayment"]
  - method: POST
    path: "/investor-reports/{id}/reject"
    description: "Reject report"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: InvestorReport
    side_effects: ["SUBMITTED -> REJECTED"]

  # --- PassThroughPayment ---
  - method: GET
    path: "/pass-through-payments"
    description: "List pass-through payments"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: ["report_id?", "limit?", "offset?"]
    output: "PassThroughPayment[]"
    side_effects: []
  - method: GET
    path: "/pass-through-payments/{id}"
    description: "Get a payment"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: []
    output: PassThroughPayment
    side_effects: []
  - method: POST
    path: "/pass-through-payments/{id}/settle"
    description: "Settle payment from P_AND_I custodial account, or fund by LiquidityAdvance when custodial funds insufficient"
    roles: [IssuerOfficer]
    code: 200
    input: []
    output: PassThroughPayment
    side_effects: ["DUE -> PAID (custodial) or DUE -> ADVANCED (+ LiquidityAdvance OPEN)", "issuer advance obligation and liquidity ratios recomputed on advance"]

  # --- LiquidityAdvance ---
  - method: GET
    path: "/liquidity-advances"
    description: "List advances"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: ["issuer_id?", "payment_id?", "limit?", "offset?"]
    output: "LiquidityAdvance[]"
    side_effects: []
  - method: GET
    path: "/liquidity-advances/{id}"
    description: "Get an advance"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: []
    output: LiquidityAdvance
    side_effects: []
  - method: POST
    path: "/liquidity-advances/{id}/reimburse"
    description: "Reimburse an open advance"
    roles: [IssuerOfficer]
    code: 200
    input: []
    output: LiquidityAdvance
    side_effects: ["OPEN -> REIMBURSED", "issuer ratios recomputed; liquidity_threshold_evaluation may lift SUSPENDED"]

  # --- DelinquencyBreach / CorrectiveActionPlan ---
  - method: GET
    path: "/delinquency-breaches"
    description: "List breaches"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: ["issuer_id?", "pool_id?", "limit?", "offset?"]
    output: "DelinquencyBreach[]"
    side_effects: []
  - method: GET
    path: "/delinquency-breaches/{id}"
    description: "Get a breach"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: []
    output: DelinquencyBreach
    side_effects: []
  - method: POST
    path: "/delinquency-breaches/{id}/close"
    description: "Close a breach whose pool is back under threshold (agency action)"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: DelinquencyBreach
    side_effects: ["breach -> CLOSED", "issuer status re-evaluated"]
  - method: POST
    path: "/corrective-action-plans"
    description: "Submit a corrective action plan against a breach"
    roles: [IssuerOfficer]
    code: 201
    input: [breach_id, plan_summary, target_cure_month]
    output: CorrectiveActionPlan
    side_effects: []
  - method: GET
    path: "/corrective-action-plans"
    description: "List plans"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: ["breach_id?", "limit?", "offset?"]
    output: "CorrectiveActionPlan[]"
    side_effects: []
  - method: GET
    path: "/corrective-action-plans/{id}"
    description: "Get a plan"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []
  - method: POST
    path: "/corrective-action-plans/{id}/accept"
    description: "Accept plan; breach -> MITIGATING; issuer re-evaluated"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["SUBMITTED -> ACCEPTED", "DelinquencyBreach OPEN -> MITIGATING"]
  - method: POST
    path: "/corrective-action-plans/{id}/reject"
    description: "Reject plan"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["SUBMITTED -> REJECTED"]

  # --- PortfolioTransfer ---
  - method: POST
    path: "/portfolio-transfers"
    description: "Initiate defaulted-issuer portfolio transfer to successor (OCC-guarded on defaulted issuer version); cascades defaulted issuer pools to TRANSFER_PENDING"
    roles: [AgencyReviewer]
    code: 201
    input: [defaulted_issuer_id, successor_issuer_id, expected_defaulted_issuer_version]
    output: PortfolioTransfer
    side_effects: ["defaulted issuer LIVE pools -> TRANSFER_PENDING", "increments defaulted Issuer.version by 1"]
  - method: GET
    path: "/portfolio-transfers"
    description: "List transfers"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: ["defaulted_issuer_id?", "successor_issuer_id?", "limit?", "offset?"]
    output: "PortfolioTransfer[]"
    side_effects: []
  - method: GET
    path: "/portfolio-transfers/{id}"
    description: "Get a transfer"
    roles: [IssuerOfficer, AgencyReviewer, PlatformAdmin]
    code: 200
    input: []
    output: PortfolioTransfer
    side_effects: []
  - method: POST
    path: "/portfolio-transfers/{id}/accept"
    description: "Successor accepts; pools and advances move to successor; defaulted issuer EXTINGUISHED; terminal COMPLETED"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: PortfolioTransfer
    side_effects: ["INITIATED -> COMPLETED via accept gate", "pool issuer reassignment", "advance reassignment", "defaulted issuer -> EXTINGUISHED"]
  - method: POST
    path: "/portfolio-transfers/{id}/reject"
    description: "Successor rejects; portfolio extinguished, pools TERMINATED, advances WRITTEN_OFF; terminal REJECTED"
    roles: [AgencyReviewer]
    code: 200
    input: []
    output: PortfolioTransfer
    side_effects: ["INITIATED -> REJECTED", "extinguishment cascade"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID / X-User-Role missing or role unrecognized" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "IssuerOfficer X-User-ID does not own the target resource" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reviewer approving/denying an application submitted by the same user id" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "IssuerApplication id does not exist" }
  - { id: ERR_ISSUER_NOT_FOUND, http: 404, condition: "Issuer id does not exist" }
  - { id: ERR_CUSTODIAN_NOT_FOUND, http: 404, condition: "DocumentCustodian id does not exist" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "CustodianEngagement id does not exist" }
  - { id: ERR_POOL_NOT_FOUND, http: 404, condition: "Pool id does not exist" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "Loan id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "CustodialAccount id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "InvestorReport id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "PassThroughPayment id does not exist" }
  - { id: ERR_ADVANCE_NOT_FOUND, http: 404, condition: "LiquidityAdvance id does not exist" }
  - { id: ERR_BREACH_NOT_FOUND, http: 404, condition: "DelinquencyBreach id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "CorrectiveActionPlan id does not exist" }
  - { id: ERR_TRANSFER_NOT_FOUND, http: 404, condition: "PortfolioTransfer id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, or invalid enum value" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Application not in a state permitting the requested transition" }
  - { id: ERR_ISSUER_INVALID_STATE, http: 409, condition: "Issuer not in a state permitting default (must be ACTIVE/WATCH/SUSPENDED)" }
  - { id: ERR_POOL_INVALID_STATE, http: 409, condition: "Pool not in a state permitting the requested transition" }
  - { id: ERR_LOAN_INVALID_STATE, http: 409, condition: "Loan delinquency transition invalid from current status" }
  - { id: ERR_ACCOUNT_INVALID_STATE, http: 409, condition: "Account not in a state permitting the operation" }
  - { id: ERR_REPORT_INVALID_STATE, http: 409, condition: "Report not in a state permitting the requested transition" }
  - { id: ERR_PAYMENT_INVALID_STATE, http: 409, condition: "Payment not DUE" }
  - { id: ERR_ADVANCE_INVALID_STATE, http: 409, condition: "Advance not OPEN" }
  - { id: ERR_BREACH_INVALID_STATE, http: 409, condition: "Breach not in a state permitting close" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "Plan not SUBMITTED" }
  - { id: ERR_TRANSFER_INVALID_STATE, http: 409, condition: "Transfer not INITIATED" }
  - { id: ERR_ENGAGEMENT_INVALID_STATE, http: 409, condition: "Engagement already ENDED" }
  - { id: ERR_NET_WORTH_DEFICIENT, http: 422, condition: "net_worth_cents below tiered requirement at submit" }
  - { id: ERR_LIQUIDITY_EXCEEDS_NET_WORTH, http: 422, condition: "liquid_assets_cents > net_worth_cents at submit" }
  - { id: ERR_INSUFFICIENT_EXPERIENCE, http: 422, condition: "origination_experience_months < 24 at submit" }
  - { id: ERR_POOL_TERM_INVALID, http: 422, condition: "term_months not in the allowed set for pool_type" }
  - { id: ERR_INSURER_NOT_ALLOWED, http: 422, condition: "government_insurance not allowed for pool_type (MULTIFAMILY requires FHA)" }
  - { id: ERR_LOAN_NOTE_RATE_OUT_OF_RANGE, http: 422, condition: "loan note_rate_bps outside [pool note_rate_bps + 50, + 150] inclusive" }
  - { id: ERR_ACCOUNT_TYPE_DUPLICATE, http: 422, condition: "Issuer already has a custodial account of this type" }
  - { id: ERR_DUPLICATE_REPORT_PERIOD, http: 422, condition: "An InvestorReport already exists for this pool and period_month" }
  - { id: ERR_ENGAGEMENT_WINDOW_OVERLAP, http: 422, condition: "Engagement half-open window overlaps another ACTIVE engagement for the same (custodian, issuer)" }
  - { id: ERR_CUSTODIAN_ENGAGEMENT_GAP, http: 422, condition: "No ACTIVE engagement covers the request date for (pool.custodian_id, pool.issuer_id)" }
  - { id: ERR_POOL_EMPTY, http: 422, condition: "Assemble requires at least one loan" }
  - { id: ERR_POOL_LOAN_COUNT_EXCEEDED, http: 422, condition: "Loan count exceeds MAX_LOANS_PER_POOL for pool_type" }
  - { id: ERR_POOL_BELOW_MINIMUM_PRINCIPAL, http: 422, condition: "aggregate_principal_cents < MIN_POOL_PRINCIPAL_CENTS at assemble" }
  - { id: ERR_POOL_NOT_FULLY_PAID, http: 422, condition: "Terminate requires aggregate_principal_cents == 0" }
  - { id: ERR_CERTIFICATION_REQUIRED, http: 422, condition: "Activate requires pool CERTIFIED" }
  - { id: ERR_UNRESOLVED_RECORDS_EXIST, http: 422, condition: "DRAFT/SUBMITTED InvestorReports block pool termination" }
  - { id: ERR_ACCOUNT_FROZEN, http: 422, condition: "Custodial account FROZEN or CLOSED blocks deposits/disbursements/settles" }
  - { id: ERR_INSUFFICIENT_CUSTODIAL_FUNDS, http: 422, condition: "Raw DISBURSEMENT transaction exceeds the targeted custodial component balance" }
  - { id: ERR_ISSUER_NOT_ACTIVE, http: 422, condition: "Issuer SUSPENDED/DEFAULTED/EXTINGUISHED blocks pool assemble/activate and engagement creation" }
  - { id: ERR_SUCCESSOR_NOT_ACTIVE, http: 422, condition: "Successor issuer not ACTIVE at transfer accept" }
  - { id: ERR_SUCCESSOR_UNDERCAPITALIZED, http: 422, condition: "Successor liquidity_ratio_including_credit_bps would fall below LIQUIDITY_MONITOR_THRESHOLD_BPS after assuming obligations" }
  - { id: ERR_BREACH_STILL_BREACHING, http: 422, condition: "Pool delinquency_rate_bps still >= threshold at breach close" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ApplicantOfficer
    description: "Officer of the applying organization; authors and submits issuer applications"
    identity: opaque
    exclusive_operations:
      - "POST /issuer-applications"
      - "PATCH /issuer-applications/{id}"
      - "POST /issuer-applications/{id}/submit"
    shared_operations:
      - "GET /issuer-applications, GET /issuer-applications/{id}"
  - name: AgencyReviewer
    description: "Ginnie Mae agency reviewer; adjudicates applications, reports, plans, transfers; declares default"
    identity: opaque
    exclusive_operations:
      - "POST /issuer-applications/{id}/review | /request-revision | /approve | /deny"
      - "POST /investor-reports/{id}/accept | /reject"
      - "POST /corrective-action-plans/{id}/accept | /reject"
      - "POST /delinquency-breaches/{id}/close"
      - "POST /issuers/{id}/default"
      - "POST /portfolio-transfers, /portfolio-transfers/{id}/accept, /reject"
    shared_operations:
      - "GET on all resources"
  - name: IssuerOfficer
    description: "Officer of an approved issuer; owns pooling, loans, custodial accounts, reporting, settlement, advances, plans"
    identity: "entity_backed:Issuer"
    exclusive_operations:
      - "POST /custodian-engagements, /custodian-engagements/{id}/end"
      - "POST /pools, /pools/{id}/assemble, /pools/{id}/activate, /pools/{id}/terminate"
      - "POST /loans, /loans/{id}/delinquency-status"
      - "POST /custodial-accounts, /custodial-accounts/{id}/transactions"
      - "POST /investor-reports, /investor-reports/{id}/submit"
      - "POST /pass-through-payments/{id}/settle"
      - "POST /liquidity-advances/{id}/reimburse"
      - "POST /corrective-action-plans"
      - "PATCH /issuers/{id}/financials"
    shared_operations:
      - "GET on issuer-scoped resources"
  - name: DocumentCustodian
    description: "Document custodian; certifies pool loan files"
    identity: "entity_backed:DocumentCustodian"
    exclusive_operations:
      - "POST /pools/{id}/certifications"
    shared_operations:
      - "GET /pools, /loans, /document-custodians, /custodian-engagements, /issuers"
  - name: PlatformAdmin
    description: "Operations administrator; registers custodians and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /document-custodians"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"
