              payload: { household_id: "HH-1", first_name: "Ana", last_name: "Reyes", date_of_birth: "2014-04-02", residency_state: "TX", prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", income_band: "BAND_B", category_flags: ["DISABILITY_IEP"], has_enrolled_sibling: false }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
