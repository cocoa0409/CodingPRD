            - "Well.${w1}.integrity_state == MIT_CURRENT and operational_state == IN_SERVICE"
            - "Well.${w1}.shut_in_reason == null and service_change_count == 0"
            - "Well.${w1}.last_mit_passed_at == 2026-06-01T00:00:00Z and mit_due_at == 2027-06-01T00:00:00Z (a PASS-only refresh did not happen)"
            - "Well.${w1}.casing_pressure_psig == 0 (the INCONCLUSIVE pressure was not copied onto the well)"
            - "the remediation-programs list returns HTTP 200 with total_count == 0"
            - "StorageField.${f1}.field_posture == OPEN, wells_in_service_count == 1, rates 150000 / 150000"

      - name: mit_result_recording_gated_by_the_window_with_an_inclusive_end_boundary
        claim_type: precondition_enforcement
        grounds:
          - validations.priority_20_ERR_MIT_WINDOW_IN_PAST
          - validations.priority_21_ERR_MIT_WINDOW_NOT_ELAPSED
          - state_machines.MechanicalIntegrityTest.transitions.SCHEDULED_to_PASSED
          - errors.ERR_MIT_WINDOW_IN_PAST
          - errors.ERR_MIT_WINDOW_NOT_ELAPSED
        distinguishing_aspect: |
          The two temporal gates sit on opposite endpoints and carry different HTTP classes: a
          scheduled_start_at behind the clock is a 422 at creation (ERR_MIT_WINDOW_IN_PAST) while a
          result recorded before scheduled_end_at is a 409 (ERR_MIT_WINDOW_NOT_ELAPSED), and the
          elapsed test is `clock >= scheduled_end_at`, so a clock landing EXACTLY on
          scheduled_end_at admits the result.
        test_recipe:
          setup:
            - "Field F_MINI with one MIT_CURRENT well MINI-1; the clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "PRESSURE_TEST", scheduled_start_at: "2026-07-31T00:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e1: $.data.error_id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "PRESSURE_TEST", scheduled_start_at: "2026-08-01T06:00:00Z", scheduled_end_at: "2026-08-01T18:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { m1: $.data.id }
            - call: "POST /mechanical-integrity-tests/${m1}/record-result"
              payload: { outcome: "PASS", result_pressure_psig: 1200 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e2: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T18:00:00Z" }
              as: FieldOperator
            - call: "POST /mechanical-integrity-tests/${m1}/record-result"
              payload: { outcome: "PASS", result_pressure_psig: 1200 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
          assert:
            - "${e1} == ERR_MIT_WINDOW_IN_PAST with HTTP 422 and no MechanicalIntegrityTest row is created"
            - "the second call returns HTTP 201 with MechanicalIntegrityTest.${m1}.status == SCHEDULED, outcome == null, result_pressure_psig == null, recorded_at == null, recorded_by_user_id == null"
            - "${e2} == ERR_MIT_WINDOW_NOT_ELAPSED with HTTP 409 (clock 2026-08-01T00:00:00Z is before scheduled_end_at)"
            - "after the clock lands exactly on 2026-08-01T18:00:00Z the same call returns HTTP 200 with status == PASSED and recorded_at == 2026-08-01T18:00:00Z"
            - "Well.${w1}.last_mit_passed_at == 2026-08-01T18:00:00Z, mit_due_at == 2027-08-01T18:00:00Z, casing_pressure_psig == 1200"
            - "GET /mechanical-integrity-tests with well_id ${w1} and limit 100 returns total_count == 1"

      - name: remediation_completion_by_an_independent_engineer_clears_the_failure
        claim_type: valid_transition
        grounds:
          - state_machines.RemediationProgram.transitions.OPEN_to_COMPLETED
          - state_machines.Well.transitions.MIT_FAILED_to_REMEDIATED
          - global_constants.REMEDIATION_DUE_DAYS
          - entities.RemediationProgram.fields.due_at
          - endpoints[POST /remediation-programs/{id}/complete]
        distinguishing_aspect: |
          The cascaded program is stamped from the clock at the moment the MIT failed, so opened_at
          2026-08-02T06:00:00Z gives due_at exactly 2026-09-16T06:00:00Z (45 days across a 31-day
          August), and completion is a HALF recovery: integrity_state moves MIT_FAILED ->
          REMEDIATED and shut_in_reason drops to null, but operational_state deliberately stays
          SHUT_IN and service_change_count stays 0 — the well only returns to service on an
          explicit service-change.
        test_recipe:
          setup:
            - "Field F_MINI with two wells MINI-1 and MINI-2 (both rated 600000), so a single shut-in leaves the field with one in-service well."
            - "A PRESSURE_TEST on MINI-1 covering 2026-08-01T06:00:00Z to 2026-08-02T06:00:00Z is recorded FAIL by eng-a with the clock at 2026-08-02T06:00:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
