scenario: |
  2986. Recreational Drone Pilot Certification & Airspace Authorization (drone operations service): pilot certification pathway with knowledge testing, currency requirements and recreational versus commercial rule distinctions, aircraft registration and remote identification compliance with broadcast module verification, airspace classification checks and controlled airspace authorization requests with altitude ceilings, waiver applications for operations over people, at night or beyond visual line of sight with safety case documentation, flight logging with location, altitude and incident records, restricted area and temporary flight restriction monitoring before each flight, insurance coverage and client indemnification for commercial work, accident reporting and post-incident investigation

domain_name: "drone-pilot-certification-airspace-authorization"
api_prefix: "/drone-ops"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - selector_policy

  entity_topology: graph
  # graph: Flight is a junction of Pilot x Aircraft x AirspaceZone x AirspaceAuthorization x
  # Waiver x InsurancePolicy; Certification references itself through supersedes_certification_id.

  state_machine_shape: cyclic
  # Pilot (CERTIFIED->LAPSED->CERTIFIED, SUSPENDED->CERTIFIED), Waiver
  # (SUBMITTED->UNDER_REVIEW->REVISION_REQUESTED->SUBMITTED), AccidentReport
  # (INVESTIGATING->REMEDIATION_REQUIRED->INVESTIGATING), RemoteIdModule
  # (VERIFICATION_FAILED->VERIFICATION_PENDING) all loop; Flight additionally carries two
  # independent state dimensions (status x investigation_status).

  relationship_patterns:
    - one_to_many          # Pilot -> KnowledgeTest / Aircraft / Waiver / InsurancePolicy / Flight
    - self_referential     # Certification.supersedes_certification_id -> Certification.id
    - cross_aggregate      # Flight -> AirspaceAuthorization -> AirspaceZone; Flight -> InsurancePolicy
    - polymorphic_free     # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # The operator who clears a SafetyCase may not approve that Waiver; the operator who approved
  # the AirspaceAuthorization used by a Flight may not close that Flight's AccidentReport.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Pilot
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the remote pilot
        constraints: "1..120 chars, non-blank"
      - name: email
        type: string
        source: input
        description: contact address, globally unique across Pilot
        constraints: "must contain '@'; unique (case-insensitive)"
      - name: operator_category
        type: enum
        source: input
        description: the rule set the pilot operates under
        constraints: "RECREATIONAL | COMMERCIAL"
      - name: status
        type: enum
        source: computed
        description: certification lifecycle state, driven by §1.2 Pilot state machine
        default: UNCERTIFIED
        constraints: "UNCERTIFIED | KNOWLEDGE_PENDING | CERTIFIED | LAPSED | SUSPENDED | REVOKED"
      - name: certified_at
        type: datetime
        source: computed
        description: issued_at of the pilot's ACTIVE Certification; null while no ACTIVE Certification exists
        default: null
      - name: currency_expires_at
        type: datetime
        source: computed
        description: instant the pilot's currency lapses, produced by calculations.pilot_currency_expiry using currency_basis
        default: null
      - name: currency_basis
        type: enum
        source: computed
        description: "which variant of calculations.pilot_currency_expiry applies: RECREATIONAL_BASIS when operator_category == RECREATIONAL, COMMERCIAL_BASIS when operator_category == COMMERCIAL"
        constraints: "RECREATIONAL_BASIS | COMMERCIAL_BASIS"
      - name: last_completed_flight_end
        type: datetime
        source: computed
        description: actual_end of the pilot's most recent Flight with status == COMPLETED (max over actual_end; tie-break created_at ASC); null when the pilot has no COMPLETED Flight
        default: null
      - name: knowledge_attempt_count
        type: integer
        source: computed
        description: count of KnowledgeTest rows for this pilot whose status IN {PASSED, FAILED}
        default: 0
      - name: risk_score
        type: integer
        source: computed
        description: cross-entity weighted score produced by calculations.pilot_risk_score over the pilot's Flight and AccidentReport rows
        default: 0
        constraints: "integer 0..100"
      - name: open_waiver_count
        type: integer
        source: computed
        description: count of Waiver rows for this pilot whose status IN {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, CLEARED, APPROVED}
        default: 0
      - name: suspension_reason
        type: string
        source: system
        description: reason recorded on the transition into SUSPENDED or REVOKED; null otherwise
        default: null

  - name: KnowledgeTest
    parent: Pilot
    common_fields: true
    fields:
      - name: pilot_id
        type: string
        source: input
        description: "FK -> Pilot.id; the candidate sitting the test"
      - name: test_code
        type: enum
        source: input
        description: which knowledge exam is sat; determines the pass mark in calculations.knowledge_test_pass_determination
        constraints: "TRUST_RECREATIONAL | PART107_COMMERCIAL"
      - name: scheduled_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the sitting is booked for; also the attempt-window anchor
      - name: status
        type: enum
        source: computed
        description: grading state driven by §1.2 KnowledgeTest transitions
        default: SCHEDULED
        constraints: "SCHEDULED | PASSED | FAILED"
      - name: attempt_number
        type: integer
        source: computed
        description: 1 + count of pre-existing KnowledgeTest rows for the same pilot_id (any status), assigned at creation
        constraints: "integer >= 1"
      - name: raw_score
        type: integer
        source: system
        description: score supplied at grading; null before grading
        default: null
        constraints: "integer 0..100"
      - name: passed
        type: boolean
        source: computed
        description: raw_score >= pass mark for test_code per calculations.knowledge_test_pass_determination; null before grading
        default: null
      - name: graded_at
        type: datetime
        source: system
        description: logical-clock instant the grade was recorded; null before grading
        default: null

  - name: Certification
    parent: Pilot
    common_fields: true
    fields:
      - name: pilot_id
        type: string
        source: system
        description: "FK -> Pilot.id; holder of the certificate"
      - name: originating_test_id
        type: string
        source: system
        description: "FK -> KnowledgeTest.id; the PASSED sitting that produced this certificate"
      - name: supersedes_certification_id
        type: string
        source: system
        description: "FK -> Certification.id; the prior ACTIVE certificate this one replaced, null for a first issuance"
        default: null
      - name: certificate_number
        type: string
        source: system
        description: "human-readable certificate number, format 'CERT-' + zero-padded 6-digit issuance sequence (CERT-000001, CERT-000002, ... in created_at ASC order)"
      - name: category
        type: enum
        source: system
        description: mirrors the pilot's operator_category at issuance
        constraints: "RECREATIONAL | COMMERCIAL"
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of issuance; the anchor of calculations.pilot_currency_expiry
      - name: expires_at
        type: datetime
        source: computed
        description: issued_at + CERT_VALIDITY_MONTHS calendar months (calculations.pilot_currency_expiry base_expiry)
      - name: status
        type: enum
        source: computed
        description: certificate lifecycle
        default: ACTIVE
        constraints: "ACTIVE | SUPERSEDED | EXPIRED | REVOKED"

  - name: Aircraft
    parent: Pilot
    common_fields: true
    fields:
      - name: owner_pilot_id
        type: string
        source: input
        description: "FK -> Pilot.id; registered owner and only pilot permitted to fly it"
      - name: model
        type: string
        source: input
        description: manufacturer model designation
        constraints: "1..80 chars, non-blank"
      - name: serial_number
        type: string
        source: input
        description: manufacturer serial, unique per owner_pilot_id
        constraints: "1..40 chars; unique within owner_pilot_id"
      - name: takeoff_weight_g
        type: integer
        source: input
        description: maximum takeoff weight in grams; drives remote_id_required
        constraints: "integer 1..25000"
      - name: max_altitude_ft
        type: integer
        source: input
        description: manufacturer altitude limit in feet AGL; an input of calculations.authorization_altitude_ceiling
        constraints: "integer 1..5000"
      - name: remote_id_required
        type: boolean
        source: computed
        description: takeoff_weight_g > REMOTE_ID_WEIGHT_THRESHOLD_G (strictly greater; exactly the threshold is exempt)
      - name: registration_number
        type: string
        source: system
        description: authority-issued registration marking, set on the REGISTERED transition; null before
        default: null
      - name: registration_status
        type: enum
        source: computed
        description: registration lifecycle driven by §1.2 Aircraft transitions
        default: PENDING_REGISTRATION
        constraints: "PENDING_REGISTRATION | REGISTERED | GROUNDED | DEREGISTERED"
      - name: grounding_reason
        type: string
        source: system
        description: reason recorded on the transition into GROUNDED or DEREGISTERED; null otherwise
        default: null

  - name: RemoteIdModule
    parent: Aircraft
    common_fields: true
    fields:
      - name: aircraft_id
        type: string
        source: system
        description: "FK -> Aircraft.id; the airframe the broadcast module is fitted to"
      - name: module_serial
        type: string
        source: input
        description: broadcast module serial, unique per aircraft_id
        constraints: "1..40 chars; unique within aircraft_id"
      - name: broadcast_protocol
        type: enum
        source: input
        description: radio protocol the module broadcasts remote ID on
        constraints: "WIFI_NAN | BLUETOOTH_LE"
      - name: firmware_version
        type: string
        source: input
        description: firmware build reported by the module
        constraints: "1..20 chars, non-blank"
      - name: broadcast_sample_ref
        type: string
        source: input
        description: reference to the captured broadcast sample submitted for verification; null before submission
        default: null
      - name: status
        type: enum
        source: computed
        description: verification lifecycle driven by §1.2 RemoteIdModule transitions
        default: UNVERIFIED
        constraints: "UNVERIFIED | VERIFICATION_PENDING | VERIFIED | VERIFICATION_FAILED | EXPIRED"
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant verification was granted; null otherwise
        default: null
      - name: verified_until
        type: datetime
        source: input
        description: end of the verification validity window, supplied by the verifying officer on a VERIFIED outcome
        default: null
      - name: failure_reason
        type: string
        source: input
        description: reason recorded on a FAILED verification outcome; null otherwise
        default: null

  - name: AirspaceZone
    parent: null
    common_fields: true
    fields:
      - name: designator
        type: string
        source: input
        description: airspace designator, globally unique
        constraints: "1..30 chars; unique"
      - name: class_code
        type: enum
        source: input
        description: airspace classification
        constraints: "B | C | D | E | G"
      - name: class_ceiling_ft
        type: integer
        source: input
        description: hard ceiling for the class in feet AGL; an input of calculations.authorization_altitude_ceiling
        constraints: "integer 100..2000"
      - name: requires_authorization
        type: boolean
        source: input
        description: true for controlled airspace; a Flight in such a zone needs an APPROVED AirspaceAuthorization
      - name: max_concurrent_authorizations
        type: integer
        source: input
        description: aggregate capacity used by calculations.zone_slot_occupancy
        constraints: "integer 1..20"
      - name: structure_relief_eligible
        type: boolean
        source: input
        description: true when structure relief may raise a COMMERCIAL operator's category cap by STRUCTURE_RELIEF_FT
        default: false
      - name: reserved_slot_count
        type: integer
        source: computed
        description: denormalized count of AirspaceAuthorization rows for this zone whose status IN {APPROVED, ACTIVE}; conserved quantity of invariant zone_slot_conservation
        default: 0

  - name: AirspaceAuthorization
    parent: AirspaceZone
    common_fields: true
    fields:
      - name: pilot_id
        type: string
        source: input
        description: "FK -> Pilot.id; requesting pilot"
      - name: aircraft_id
        type: string
        source: input
        description: "FK -> Aircraft.id; airframe the authorization is bound to"
      - name: zone_id
        type: string
        source: input
        description: "FK -> AirspaceZone.id; controlled airspace being requested"
      - name: waiver_id
        type: string
        source: input
        description: "FK -> Waiver.id; APPROVED waiver whose granted_ceiling_ft feeds calculations.authorization_altitude_ceiling, null when none is cited"
        default: null
      - name: requested_ceiling_ft
        type: integer
        source: input
        description: ceiling the pilot asks for, in feet AGL
        constraints: "integer 1..2000"
      - name: window_start
        type: datetime
        source: input
        description: inclusive start of the requested occupation window
      - name: window_end
        type: datetime
        source: input
        description: exclusive end of the requested occupation window (half-open [window_start, window_end))
      - name: status
        type: enum
        source: computed
        description: authorization lifecycle driven by §1.2 AirspaceAuthorization transitions
        default: REQUESTED
        constraints: "REQUESTED | APPROVED | DENIED | ACTIVE | CONSUMED | REVOKED | EXPIRED"
      - name: granted_ceiling_ft
        type: integer
        source: computed
        description: output of calculations.authorization_altitude_ceiling, written on the APPROVED transition; null before
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the AirspaceAuthority operator who approved; null before approval; consumed by the accident-close segregation-of-duties rule
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the approve/deny decision; null before
        default: null
      - name: denial_reason
        type: string
        source: input
        description: reason recorded on a DENY decision; null otherwise
        default: null

  - name: Waiver
    parent: Pilot
    common_fields: true
    fields:
      - name: pilot_id
        type: string
        source: input
        description: "FK -> Pilot.id; applicant"
      - name: aircraft_id
        type: string
        source: input
        description: "FK -> Aircraft.id; airframe the waiver privileges attach to"
      - name: waiver_type
        type: enum
        source: input
        description: special operation being applied for
        constraints: "OVER_PEOPLE | NIGHT | BVLOS"
      - name: requested_ceiling_ft
        type: integer
        source: input
        description: ceiling relief requested, in feet AGL
        constraints: "integer 1..2000"
      - name: operation_description
        type: string
        source: input
        description: prose description of the intended operation
        constraints: "1..500 chars, non-blank"
      - name: status
        type: enum
        source: computed
        description: waiver lifecycle driven by §1.2 Waiver transitions (cyclic through REVISION_REQUESTED)
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | CLEARED | APPROVED | DENIED | SUPERSEDED | REVOKED"
      - name: revision_round
        type: integer
        source: computed
        description: number of completed REVISION_REQUESTED rounds; incremented on each request-revision transition; compared against MAX_REVISION_ROUNDS
        default: 0
      - name: granted_ceiling_ft
        type: integer
        source: input
        description: ceiling granted by the approver on the APPROVED transition; null otherwise
        default: null
      - name: valid_until
        type: datetime
        source: computed
        description: decided instant + WAIVER_VALIDITY_DAYS days, written on the APPROVED transition; null otherwise
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the WaiverApprover who decided; null before decision
        default: null
      - name: denial_reason
        type: string
        source: input
        description: reason recorded on a DENY decision; null otherwise
        default: null

  - name: SafetyCase
    parent: Waiver
    common_fields: true
    fields:
      - name: waiver_id
        type: string
        source: system
        description: "FK -> Waiver.id; the application this safety case documents"
      - name: mitigation_summary
        type: string
        source: input
        description: mitigations proposed for the operation
        constraints: "1..1000 chars, non-blank"
      - name: ground_risk_class
        type: integer
        source: input
        description: ground risk class 1..4; an input of calculations.safety_case_sail_level
        constraints: "integer 1..4"
      - name: air_risk_class
        type: enum
        source: input
        description: air risk class; ARC_A..ARC_D map to index 0..3 in calculations.safety_case_sail_level
        constraints: "ARC_A | ARC_B | ARC_C | ARC_D"
      - name: contingency_procedures
        type: string
        source: input
        description: contingency and emergency procedures
        constraints: "1..1000 chars, non-blank"
      - name: sail_level
        type: integer
        source: computed
        description: output of calculations.safety_case_sail_level
        constraints: "integer 1..6"
      - name: review_status
        type: enum
        source: computed
        description: reviewer disposition of this safety case
        default: PENDING
        constraints: "PENDING | REVISION_REQUESTED | CLEARED"
      - name: reviewer_findings
        type: string
        source: input
        description: findings recorded on a request-revision transition; null otherwise
        default: null
      - name: cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the SafetyReviewer who cleared this case; null before clearance; consumed by the waiver-decision segregation-of-duties rule
        default: null

  - name: InsurancePolicy
    parent: Pilot
    common_fields: true
    fields:
      - name: pilot_id
        type: string
        source: input
        description: "FK -> Pilot.id; insured operator"
      - name: insurer_name
        type: string
        source: input
        description: underwriter name
        constraints: "1..80 chars, non-blank"
      - name: policy_number
        type: string
        source: input
        description: underwriter policy number, unique per pilot_id
        constraints: "1..40 chars; unique within pilot_id"
      - name: coverage_limit_cents
        type: integer
        source: input
        description: aggregate liability limit in cents; the conserved total of invariant coverage_ledger_conservation
        constraints: "integer >= 0"
      - name: deductible_cents
        type: integer
        source: input
        description: per-occurrence deductible in cents, subtracted in calculations.accident_settlement
        constraints: "integer >= 0"
      - name: effective_from
        type: datetime
        source: input
        description: inclusive start of cover
      - name: effective_until
        type: datetime
        source: input
        description: exclusive end of cover
      - name: indemnification_clause_accepted
        type: boolean
        source: input
        description: whether the client indemnification clause required for COMMERCIAL work has been accepted
      - name: coverage_status
        type: enum
        source: computed
        description: policy lifecycle
        default: PENDING_VERIFICATION
        constraints: "PENDING_VERIFICATION | ACTIVE | REJECTED | INSUFFICIENT | EXPIRED"
      - name: open_reserved_cents_total
        type: integer
        source: computed
        description: sum of reserved_cents over AccidentReport rows against this policy whose status IN {FILED, INVESTIGATING, REMEDIATION_REQUIRED}
        default: 0
      - name: settled_cents_total
        type: integer
        source: computed
        description: sum of settlement_cents over AccidentReport rows against this policy whose status == CLOSED
        default: 0
      - name: remaining_coverage_cents
        type: integer
        source: computed
        description: coverage_limit_cents - open_reserved_cents_total - settled_cents_total
        default: 0

  - name: Flight
    parent: Pilot
    common_fields: true
    fields:
      - name: pilot_id
        type: string
        source: input
        description: "FK -> Pilot.id; pilot in command"
      - name: aircraft_id
        type: string
        source: input
        description: "FK -> Aircraft.id; airframe flown"
      - name: zone_id
        type: string
        source: input
        description: "FK -> AirspaceZone.id; airspace the operation takes place in"
      - name: authorization_id
        type: string
        source: input
        description: "FK -> AirspaceAuthorization.id; APPROVED authorization cited for controlled airspace, null for uncontrolled operations"
        default: null
      - name: waiver_id
        type: string
        source: input
        description: "FK -> Waiver.id; APPROVED waiver cited for the single special-operation flag set on this flight, null when no flag is set"
        default: null
      - name: covering_policy_id
        type: string
        source: system
        description: "FK -> InsurancePolicy.id; policy selected by the covering-policy selector at flight creation, null for RECREATIONAL operations"
        default: null
      - name: operation_category
        type: enum
        source: input
        description: rule set the flight is conducted under; COMMERCIAL requires a COMMERCIAL pilot and a covering policy
        constraints: "RECREATIONAL | COMMERCIAL"
      - name: planned_start
        type: datetime
        source: input
        description: inclusive planned start of the operation
      - name: planned_end
        type: datetime
        source: input
        description: inclusive planned end of the operation (closed interval for the aircraft turnaround rule)
      - name: planned_max_altitude_ft
        type: integer
        source: input
        description: planned maximum altitude in feet AGL
        constraints: "integer 1..2000"
      - name: launch_latitude
        type: number
        source: input
        description: launch point latitude in decimal degrees
        constraints: "-90.0 .. 90.0"
      - name: launch_longitude
        type: number
        source: input
        description: launch point longitude in decimal degrees
        constraints: "-180.0 .. 180.0"
      - name: over_people
        type: boolean
        source: input
        description: operation over people; requires an APPROVED OVER_PEOPLE waiver
        default: false
      - name: night_operation
        type: boolean
        source: input
        description: operation at night; requires an APPROVED NIGHT waiver
        default: false
      - name: beyond_visual_line_of_sight
        type: boolean
        source: input
        description: BVLOS operation; requires an APPROVED BVLOS waiver
        default: false
      - name: status
        type: enum
        source: computed
        description: operational dimension of the §1.2 Flight parallel state machine
        default: PLANNED
        constraints: "PLANNED | PREFLIGHT_CLEARED | IN_PROGRESS | COMPLETED | CANCELLED"
      - name: investigation_status
        type: enum
        source: computed
        description: investigation dimension of the §1.2 Flight parallel state machine, evolving independently of status
        default: NONE
        constraints: "NONE | OPEN | CLOSED"
      - name: actual_start
        type: datetime
        source: system
        description: logical-clock instant of launch; null before
        default: null
      - name: actual_end
        type: datetime
        source: input
        description: end instant supplied at completion; null before
        default: null
      - name: max_altitude_reached_ft
        type: integer
        source: input
        description: highest altitude logged, supplied at completion; null before
        default: null
      - name: incident_occurred
        type: boolean
        source: input
        description: whether an in-flight incident occurred, supplied at completion
        default: null
      - name: incident_summary
        type: string
        source: input
        description: narrative supplied when incident_occurred is true; null otherwise
        default: null
      - name: altitude_exceedance
        type: boolean
        source: computed
        description: max_altitude_reached_ft > effective ceiling (authorization.granted_ceiling_ft when authorization_id is set, else BASE_CEILING_FT), evaluated at completion
        default: false
      - name: logged_minutes
        type: integer
        source: computed
        description: whole minutes between actual_start and actual_end, floor; 0 before completion
        default: 0
      - name: cancellation_reason
        type: string
        source: input
        description: reason recorded on the CANCELLED transition, including cascade-written values AUTHORIZATION_REVOKED and COVERAGE_INSUFFICIENT
        default: null

  - name: PreflightCheck
    parent: Flight
    common_fields: false
    fields:
      - name: flight_id
        type: string
        source: system
        description: "FK -> Flight.id; the flight this immutable check record belongs to"
      - name: checked_at
        type: datetime
        source: system
        description: logical-clock instant the check ran
      - name: result
        type: enum
        source: computed
        description: PASSED when blocking_findings is empty, FAILED otherwise
        constraints: "PASSED | FAILED"
      - name: blocking_findings
        type: array
        source: computed
        description: "sorted-ascending array of finding codes drawn from {AIRCRAFT_NOT_REGISTERED, AUTHORIZATION_NOT_APPROVED, CURRENCY_LAPSED, REMOTE_ID_INVALID, TFR_UNACKNOWLEDGED, TFR_TOTAL_BAN, WAIVER_MISSING}; empty array when the check passes"
      - name: active_tfr_ids
        type: array
        source: computed
        description: ids of TemporaryFlightRestriction rows on the flight's zone that are ACTIVE and overlap the flight window, ordered by TemporaryFlightRestriction.created_at ASC
      - name: acknowledged_tfr_ids
        type: array
        source: input
        description: TFR ids the pilot declares awareness of; must cover every entry of active_tfr_ids
        default: []
      - name: airspace_class_code
        type: enum
        source: system
        description: snapshot of the zone's class_code at check time
        constraints: "B | C | D | E | G"
      - name: effective_ceiling_ft
        type: integer
        source: computed
        description: authorization.granted_ceiling_ft when the flight cites an authorization, else BASE_CEILING_FT

  - name: AccidentReport
    parent: Flight
    common_fields: true
    fields:
      - name: flight_id
        type: string
        source: input
        description: "FK -> Flight.id; the flight involved; at most one non-WITHDRAWN report per flight"
      - name: policy_id
        type: string
        source: system
        description: "FK -> InsurancePolicy.id; copied from the flight's covering_policy_id at filing, null when the flight had no covering policy"
        default: null
      - name: occurred_at
        type: datetime
        source: input
        description: instant of the accident
      - name: injury_level
        type: enum
        source: input
        description: worst injury sustained; selects INJURY_RESERVE_CENTS in calculations.accident_settlement
        constraints: "NONE | MINOR | SERIOUS"
      - name: reported_property_damage_cents
        type: integer
        source: input
        description: pilot's reported property damage in cents; input of the PROVISIONAL reserve variant
        constraints: "integer >= 0"
      - name: narrative
        type: string
        source: input
        description: pilot's account of the accident
        constraints: "1..2000 chars, non-blank"
      - name: status
        type: enum
        source: computed
        description: investigation lifecycle driven by §1.2 AccidentReport transitions (cyclic through REMEDIATION_REQUIRED)
        default: FILED
        constraints: "FILED | INVESTIGATING | REMEDIATION_REQUIRED | CLOSED | WITHDRAWN"
      - name: remediation_round
        type: integer
        source: computed
        description: number of completed REMEDIATION_REQUIRED rounds
        default: 0
      - name: remediation_findings
        type: string
        source: input
        description: findings recorded on a require-remediation transition; null otherwise
        default: null
      - name: damage_line_items
        type: array
        source: input
        description: "array of objects { label: string, amount_cents: integer >= 0 } supplied at close; the per-line rounding input of calculations.accident_settlement FINAL variant; ordered as supplied"
        default: null
      - name: reserved_cents
        type: integer
        source: computed
        description: PROVISIONAL variant output of calculations.accident_settlement, held while status IN {FILED, INVESTIGATING, REMEDIATION_REQUIRED}, released to 0 on CLOSED or WITHDRAWN
        default: 0
      - name: settlement_cents
        type: integer
        source: computed
        description: FINAL variant output of calculations.accident_settlement, written on the CLOSED transition; null otherwise
        default: null
      - name: probable_cause
        type: string
        source: input
        description: investigator's probable cause, supplied at close; null otherwise
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: X-User-ID of the InvestigationOfficer who closed the report; null otherwise
        default: null

  - name: TemporaryFlightRestriction
    parent: AirspaceZone
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> AirspaceZone.id; airspace the restriction covers"
      - name: reason
        type: string
        source: input
        description: reason for the restriction
        constraints: "1..200 chars, non-blank"
      - name: effective_from
        type: datetime
        source: input
        description: inclusive start of the restriction window
      - name: effective_until
        type: datetime
        source: input
        description: exclusive end of the restriction window (half-open [effective_from, effective_until))
      - name: max_permitted_altitude_ft
        type: integer
        source: input
        description: altitude below which operations remain permitted; null means a total ban that acknowledgement cannot clear
        default: null
        constraints: "integer 0..2000 or null"
      - name: status
        type: enum
        source: computed
        description: restriction lifecycle
        default: ACTIVE
        constraints: "ACTIVE | LIFTED | EXPIRED"
      - name: published_by_user_id
        type: string
        source: system
        description: X-User-ID of the AirspaceAuthority operator who published the restriction

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Pilot
    initial_state: UNCERTIFIED
    terminal_states: [REVOKED]
    transitions:
      - from: UNCERTIFIED
        to: KNOWLEDGE_PENDING
        trigger: "POST /drone-ops/pilots/{id}/knowledge-tests"
        actor: ComplianceOfficer
        preconditions:
          - "pilot.status IN {UNCERTIFIED, LAPSED}"
          - "count of KnowledgeTest for this pilot with scheduled_at >= current_utc - 365 days (inclusive) is < MAX_ATTEMPTS_PER_12_MONTHS"
        side_effects:
          - "creates KnowledgeTest with status SCHEDULED and attempt_number = 1 + count of pre-existing KnowledgeTest rows for this pilot"
          - "increments Pilot.version by 1"
        note: "LAPSED pilots re-enter the testing loop through the same trigger, which is why this transition is also declared from LAPSED below."
      - from: LAPSED
        to: KNOWLEDGE_PENDING
        trigger: "POST /drone-ops/pilots/{id}/knowledge-tests"
        actor: ComplianceOfficer
        preconditions:
          - "pilot.status == LAPSED"
          - "count of KnowledgeTest for this pilot with scheduled_at >= current_utc - 365 days (inclusive) is < MAX_ATTEMPTS_PER_12_MONTHS"
        side_effects:
          - "creates KnowledgeTest with status SCHEDULED"
          - "increments Pilot.version by 1"
        note: "Second leg of the recurrent-training cycle CERTIFIED -> LAPSED -> KNOWLEDGE_PENDING -> CERTIFIED."
      - from: KNOWLEDGE_PENDING
        to: CERTIFIED
        trigger: "POST /drone-ops/knowledge-tests/{id}/grade with passed == true"
        actor: ComplianceOfficer
        preconditions:
          - "knowledge_test.status == SCHEDULED"
          - "raw_score >= pass mark for test_code (calculations.knowledge_test_pass_determination)"
        side_effects:
          - "KnowledgeTest.status -> PASSED; raw_score, passed, graded_at written"
          - "creates Certification with status ACTIVE, category = pilot.operator_category, issued_at = current_utc, expires_at per calculations.pilot_currency_expiry base_expiry, originating_test_id = the graded test"
          - "any pre-existing Certification for this pilot with status ACTIVE transitions to SUPERSEDED and its id is written to the new Certification.supersedes_certification_id"
          - "Pilot.certified_at = new Certification.issued_at; Pilot.currency_expires_at and Pilot.currency_basis recomputed by calculations.pilot_currency_expiry"
          - "Pilot.knowledge_attempt_count recomputed"
          - "increments Pilot.version by 1"
      - from: KNOWLEDGE_PENDING
        to: UNCERTIFIED
        trigger: "POST /drone-ops/knowledge-tests/{id}/grade with passed == false"
        actor: ComplianceOfficer
        preconditions:
          - "knowledge_test.status == SCHEDULED"
          - "raw_score < pass mark for test_code"
        side_effects:
          - "KnowledgeTest.status -> FAILED; raw_score, passed, graded_at written"
          - "Pilot.knowledge_attempt_count recomputed"
          - "no Certification is created; Pilot.currency_expires_at unchanged"
          - "increments Pilot.version by 1"
        note: "Failure returns the pilot to UNCERTIFIED so the UNCERTIFIED -> KNOWLEDGE_PENDING -> UNCERTIFIED cycle can repeat up to MAX_ATTEMPTS_PER_12_MONTHS times."
      - from: CERTIFIED
        to: LAPSED
        trigger: "POST /drone-ops/pilots/{id}/currency-review, or system evaluation inside POST /drone-ops/flights/{id}/preflight-check"
        actor: ComplianceOfficer | system
        preconditions:
          - "pilot.status == CERTIFIED"
          - "recomputed currency_expires_at <= current_utc"
        side_effects:
          - "Pilot.currency_expires_at and Pilot.currency_basis rewritten by calculations.pilot_currency_expiry"
          - "Certification rows for this pilot with status ACTIVE and expires_at <= current_utc transition to EXPIRED"
          - "Pilot.risk_score recomputed by calculations.pilot_risk_score (the LAPSED term now contributes W_LAPSED_CURRENCY)"
          - "increments Pilot.version by 1"
      - from: LAPSED
        to: CERTIFIED
        trigger: "POST /drone-ops/pilots/{id}/currency-review"
        actor: ComplianceOfficer
        preconditions:
          - "pilot.status == LAPSED"
          - "recomputed currency_expires_at > current_utc"
        side_effects:
          - "Pilot.currency_expires_at and Pilot.currency_basis rewritten"
          - "Pilot.risk_score recomputed (LAPSED term drops out)"
          - "increments Pilot.version by 1"
        note: "Closes the CERTIFIED -> LAPSED -> CERTIFIED cycle after a fresh Certification or a fresh COMPLETED flight moved the anchor forward."
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /drone-ops/pilots/{id}/suspend, or system evaluation when calculations.pilot_risk_score reaches RISK_SUSPEND_THRESHOLD"
        actor: ComplianceOfficer | system
        preconditions:
          - "pilot.status IN {CERTIFIED, LAPSED}"
        side_effects:
          - "Pilot.suspension_reason written (MANUAL reason text, or RISK_THRESHOLD_REACHED for the system path)"
          - "CASCADE link 2: every Aircraft with owner_pilot_id == pilot.id and registration_status == REGISTERED transitions to GROUNDED with grounding_reason OWNER_SUSPENDED, processed in Aircraft.created_at ASC order"
          - "CASCADE link 3: because each of those Aircraft became GROUNDED, every AirspaceAuthorization with that aircraft_id and status IN {APPROVED, ACTIVE} transitions to REVOKED, processed in AirspaceAuthorization.created_at ASC order; each revocation decrements AirspaceZone.reserved_slot_count by 1 and increments AirspaceZone.version by 1"
          - "CASCADE link 4: because each of those AirspaceAuthorization rows became REVOKED, every Flight with that authorization_id and status IN {PLANNED, PREFLIGHT_CLEARED} transitions to CANCELLED with cancellation_reason AUTHORIZATION_REVOKED, processed in Flight.created_at ASC order"
          - "increments Pilot.version by 1"
        note: "Depth-4 transitive cascade; each link is caused by the mutation of the previous link, not by the original suspend call."
      - from: LAPSED
        to: SUSPENDED
        trigger: "POST /drone-ops/pilots/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "pilot.status == LAPSED"
        side_effects:
          - "same depth-4 cascade as CERTIFIED -> SUSPENDED"
          - "increments Pilot.version by 1"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /drone-ops/pilots/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "pilot.status == SUSPENDED"
          - "every AccidentReport whose flight_id belongs to a Flight of this pilot has status IN {CLOSED, WITHDRAWN}"
          - "recomputed currency_expires_at > current_utc"
        side_effects:
          - "Pilot.suspension_reason -> null"
          - "Pilot.risk_score recomputed"
          - "grounded Aircraft are NOT returned to service automatically; POST /drone-ops/aircraft/{id}/return-to-service is required per airframe"
          - "increments Pilot.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /drone-ops/pilots/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "pilot.status == SUSPENDED"
        side_effects:
          - "Pilot.suspension_reason overwritten with the revocation reason"
          - "every Certification of this pilot with status IN {ACTIVE, SUPERSEDED, EXPIRED} transitions to REVOKED"
          - "every Aircraft with owner_pilot_id == pilot.id and registration_status IN {PENDING_REGISTRATION, REGISTERED, GROUNDED} transitions to DEREGISTERED with grounding_reason OWNER_REVOKED"
          - "every Waiver of this pilot with status IN {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, CLEARED, APPROVED} transitions to REVOKED"
          - "increments Pilot.version by 1"

  - entity: KnowledgeTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /drone-ops/knowledge-tests/{id}/grade"
        actor: ComplianceOfficer
        preconditions:
          - "knowledge_test.status == SCHEDULED"
          - "raw_score >= pass mark for test_code"
        side_effects:
          - "drives Pilot KNOWLEDGE_PENDING -> CERTIFIED with its Certification issuance chain"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /drone-ops/knowledge-tests/{id}/grade"
        actor: ComplianceOfficer
        preconditions:
          - "knowledge_test.status == SCHEDULED"
          - "raw_score < pass mark for test_code"
        side_effects:
          - "drives Pilot KNOWLEDGE_PENDING -> UNCERTIFIED"

  - entity: Certification
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system, on issuance of a newer Certification for the same pilot_id"
        actor: system
        preconditions:
          - "certification.status == ACTIVE"
          - "a newer Certification is being issued for the same pilot_id"
        side_effects:
          - "new Certification.supersedes_certification_id = this certification.id"
          - "increments Certification.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, inside POST /drone-ops/pilots/{id}/currency-review"
        actor: system
        preconditions:
          - "certification.status == ACTIVE"
          - "certification.expires_at <= current_utc"
        side_effects:
          - "increments Certification.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "system, on Pilot SUSPENDED -> REVOKED"
        actor: system
        preconditions:
          - "certification.status IN {ACTIVE, SUPERSEDED, EXPIRED}"
        side_effects:
          - "increments Certification.version by 1"
      - from: SUPERSEDED
        to: REVOKED
        trigger: "system, on Pilot SUSPENDED -> REVOKED"
        actor: system
        preconditions:
          - "certification.status == SUPERSEDED"
        side_effects:
          - "increments Certification.version by 1"
      - from: EXPIRED
        to: REVOKED
        trigger: "system, on Pilot SUSPENDED -> REVOKED"
        actor: system
        preconditions:
          - "certification.status == EXPIRED"
        side_effects:
          - "increments Certification.version by 1"

  - entity: Aircraft
    initial_state: PENDING_REGISTRATION
    terminal_states: [DEREGISTERED]
    transitions:
      - from: PENDING_REGISTRATION
        to: REGISTERED
        trigger: "POST /drone-ops/aircraft/{id}/register"
        actor: ComplianceOfficer
        preconditions:
          - "aircraft.registration_status == PENDING_REGISTRATION"
          - "owner pilot.status NOT IN {SUSPENDED, REVOKED}"
          - "if aircraft.remote_id_required is true: at least one RemoteIdModule with aircraft_id == aircraft.id has status == VERIFIED and verified_until > current_utc"
        side_effects:
          - "registration_number written from the request"
          - "increments Aircraft.version by 1"
        note: "Cross-entity guard: Aircraft's forward transition depends on RemoteIdModule state."
      - from: REGISTERED
        to: GROUNDED
        trigger: "POST /drone-ops/aircraft/{id}/ground, or CASCADE link 2 of Pilot -> SUSPENDED"
        actor: ComplianceOfficer | InvestigationOfficer | system
        preconditions:
          - "aircraft.registration_status == REGISTERED"
        side_effects:
          - "grounding_reason written"
          - "every AirspaceAuthorization with this aircraft_id and status IN {APPROVED, ACTIVE} transitions to REVOKED (created_at ASC), decrementing AirspaceZone.reserved_slot_count by 1 and incrementing AirspaceZone.version by 1 per revocation"
          - "every Flight with an authorization_id revoked by the previous bullet and status IN {PLANNED, PREFLIGHT_CLEARED} transitions to CANCELLED with cancellation_reason AUTHORIZATION_REVOKED (created_at ASC)"
          - "increments Aircraft.version by 1"
      - from: GROUNDED
        to: REGISTERED
        trigger: "POST /drone-ops/aircraft/{id}/return-to-service"
        actor: ComplianceOfficer
        preconditions:
          - "aircraft.registration_status == GROUNDED"
          - "owner pilot.status NOT IN {SUSPENDED, REVOKED}"
          - "if aircraft.remote_id_required is true: at least one RemoteIdModule with aircraft_id == aircraft.id has status == VERIFIED and verified_until > current_utc"
        side_effects:
          - "grounding_reason -> null"
          - "revoked AirspaceAuthorization rows are NOT restored"
          - "increments Aircraft.version by 1"
        note: "Second leg of the GROUNDED <-> REGISTERED cycle."
      - from: PENDING_REGISTRATION
        to: DEREGISTERED
        trigger: "system, on Pilot SUSPENDED -> REVOKED"
        actor: system
        preconditions:
          - "aircraft.registration_status IN {PENDING_REGISTRATION, REGISTERED, GROUNDED}"
        side_effects:
          - "grounding_reason = OWNER_REVOKED"
          - "increments Aircraft.version by 1"
      - from: REGISTERED
        to: DEREGISTERED
        trigger: "system, on Pilot SUSPENDED -> REVOKED"
        actor: system
        preconditions:
          - "aircraft.registration_status == REGISTERED"
        side_effects:
          - "grounding_reason = OWNER_REVOKED"
          - "increments Aircraft.version by 1"
      - from: GROUNDED
        to: DEREGISTERED
        trigger: "system, on Pilot SUSPENDED -> REVOKED"
        actor: system
        preconditions:
          - "aircraft.registration_status == GROUNDED"
        side_effects:
          - "grounding_reason = OWNER_REVOKED"
          - "increments Aircraft.version by 1"

  - entity: RemoteIdModule
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: VERIFICATION_PENDING
        trigger: "POST /drone-ops/remote-id-modules/{id}/submit-verification"
        actor: Pilot
        preconditions:
          - "module.status IN {UNVERIFIED, VERIFICATION_FAILED, EXPIRED}"
          - "X-User-ID == aircraft.owner_pilot_id of the module's aircraft"
        side_effects:
          - "broadcast_sample_ref written"
          - "increments RemoteIdModule.version by 1"
      - from: VERIFICATION_FAILED
        to: VERIFICATION_PENDING
        trigger: "POST /drone-ops/remote-id-modules/{id}/submit-verification"
        actor: Pilot
        preconditions:
          - "module.status == VERIFICATION_FAILED"
        side_effects:
          - "broadcast_sample_ref overwritten; failure_reason -> null"
          - "increments RemoteIdModule.version by 1"
        note: "Re-submission cycle VERIFICATION_PENDING -> VERIFICATION_FAILED -> VERIFICATION_PENDING."
      - from: EXPIRED
        to: VERIFICATION_PENDING
        trigger: "POST /drone-ops/remote-id-modules/{id}/submit-verification"
        actor: Pilot
        preconditions:
          - "module.status == EXPIRED"
        side_effects:
          - "broadcast_sample_ref overwritten"
          - "increments RemoteIdModule.version by 1"
      - from: VERIFICATION_PENDING
        to: VERIFIED
        trigger: "POST /drone-ops/remote-id-modules/{id}/verify with outcome VERIFIED"
        actor: ComplianceOfficer
        preconditions:
          - "module.status == VERIFICATION_PENDING"
          - "verified_until is supplied and verified_until > current_utc"
        side_effects:
          - "verified_at = current_utc; verified_until written; failure_reason -> null"
          - "increments RemoteIdModule.version by 1"
      - from: VERIFICATION_PENDING
        to: VERIFICATION_FAILED
        trigger: "POST /drone-ops/remote-id-modules/{id}/verify with outcome FAILED"
        actor: ComplianceOfficer
        preconditions:
          - "module.status == VERIFICATION_PENDING"
          - "failure_reason is supplied"
        side_effects:
          - "failure_reason written; verified_at and verified_until stay null"
          - "increments RemoteIdModule.version by 1"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system, inside POST /drone-ops/flights/{id}/preflight-check or POST /drone-ops/flights/{id}/launch"
        actor: system
        preconditions:
          - "module.status == VERIFIED"
          - "module.verified_until <= current_utc"
        side_effects:
          - "increments RemoteIdModule.version by 1"

  - entity: AirspaceAuthorization
    initial_state: REQUESTED
    terminal_states: [DENIED, CONSUMED, REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /drone-ops/airspace-authorizations/{id}/decide with decision APPROVE"
        actor: AirspaceAuthority
        preconditions:
          - "authorization.status == REQUESTED"
          - "pilot.status == CERTIFIED"
          - "aircraft.registration_status == REGISTERED"
          - "calculations.zone_slot_occupancy conflict_count for [window_start, window_end) on this zone is < zone.max_concurrent_authorizations"
        side_effects:
          - "granted_ceiling_ft = calculations.authorization_altitude_ceiling output"
          - "approved_by_user_id = X-User-ID; decided_at = current_utc"
          - "AirspaceZone.reserved_slot_count += 1 and AirspaceZone.version += 1"
          - "increments AirspaceAuthorization.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /drone-ops/airspace-authorizations/{id}/decide with decision DENY"
        actor: AirspaceAuthority
        preconditions:
          - "authorization.status == REQUESTED"
          - "denial_reason is supplied"
        side_effects:
          - "denial_reason written; decided_at = current_utc; granted_ceiling_ft stays null"
          - "AirspaceZone.reserved_slot_count unchanged"
          - "increments AirspaceAuthorization.version by 1"
        note: "Fork sibling of REQUESTED -> APPROVED with a disjoint side-effect set: no slot is reserved and no ceiling is computed."
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /drone-ops/flights/{id}/launch on a Flight citing this authorization"
        actor: Pilot
        preconditions:
          - "authorization.status == APPROVED"
          - "authorization.window_start <= current_utc < authorization.window_end"
        side_effects:
          - "AirspaceZone.reserved_slot_count unchanged (APPROVED and ACTIVE both occupy a slot)"
          - "increments AirspaceAuthorization.version by 1"
      - from: ACTIVE
        to: CONSUMED
        trigger: "POST /drone-ops/flights/{id}/complete on the Flight citing this authorization"
        actor: Pilot
        preconditions:
          - "authorization.status == ACTIVE"
        side_effects:
          - "AirspaceZone.reserved_slot_count -= 1 and AirspaceZone.version += 1"
          - "increments AirspaceAuthorization.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /drone-ops/airspace-authorizations/{id}/revoke, or CASCADE link 3 of Pilot -> SUSPENDED via Aircraft -> GROUNDED"
        actor: AirspaceAuthority | system
        preconditions:
          - "authorization.status IN {APPROVED, ACTIVE}"
        side_effects:
          - "AirspaceZone.reserved_slot_count -= 1 and AirspaceZone.version += 1"
          - "CASCADE: every Flight with this authorization_id and status IN {PLANNED, PREFLIGHT_CLEARED} transitions to CANCELLED with cancellation_reason AUTHORIZATION_REVOKED, processed in Flight.created_at ASC order"
          - "increments AirspaceAuthorization.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /drone-ops/airspace-authorizations/{id}/revoke"
        actor: AirspaceAuthority
        preconditions:
          - "authorization.status == ACTIVE"
        side_effects:
          - "AirspaceZone.reserved_slot_count -= 1 and AirspaceZone.version += 1"
          - "the in-progress Flight is left IN_PROGRESS; only PLANNED and PREFLIGHT_CLEARED flights are cancelled"
          - "increments AirspaceAuthorization.version by 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system, inside POST /drone-ops/flights/{id}/preflight-check or POST /drone-ops/flights/{id}/launch"
        actor: system
        preconditions:
          - "authorization.status == APPROVED"
          - "authorization.window_end <= current_utc"
        side_effects:
          - "AirspaceZone.reserved_slot_count -= 1 and AirspaceZone.version += 1"
          - "increments AirspaceAuthorization.version by 1"

  - entity: Waiver
    initial_state: DRAFT
    terminal_states: [DENIED, SUPERSEDED, REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /drone-ops/waivers/{id}/submit"
        actor: Pilot
        preconditions:
          - "waiver.status IN {DRAFT, REVISION_REQUESTED}"
          - "pilot.status == CERTIFIED"
          - "at least one SafetyCase exists with waiver_id == waiver.id"
        side_effects:
          - "Pilot.open_waiver_count recomputed"
          - "increments Waiver.version by 1"
        note: "Cross-entity guard: Waiver's forward transition depends on Pilot.status."
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /drone-ops/waivers/{id}/submit"
        actor: Pilot
        preconditions:
          - "waiver.status == REVISION_REQUESTED"
          - "pilot.status == CERTIFIED"
          - "the waiver's SafetyCase has review_status == REVISION_REQUESTED"
        side_effects:
          - "SafetyCase.review_status -> PENDING; SafetyCase.reviewer_findings -> null"
          - "increments Waiver.version by 1"
        note: "Closes the SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED review cycle."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /drone-ops/waivers/{id}/begin-review"
        actor: SafetyReviewer
        preconditions:
          - "waiver.status == SUBMITTED"
        side_effects:
          - "increments Waiver.version by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /drone-ops/waivers/{id}/request-revision"
        actor: SafetyReviewer
        preconditions:
          - "waiver.status == UNDER_REVIEW"
          - "waiver.revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "waiver.revision_round += 1"
          - "SafetyCase.review_status -> REVISION_REQUESTED; SafetyCase.reviewer_findings written"
          - "increments Waiver.version by 1"
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "POST /drone-ops/waivers/{id}/clear-safety-case"
        actor: SafetyReviewer
        preconditions:
          - "waiver.status == UNDER_REVIEW"
          - "SafetyCase.sail_level <= MAX_APPROVABLE_SAIL"
        side_effects:
          - "SafetyCase.review_status -> CLEARED; SafetyCase.cleared_by_user_id = X-User-ID"
          - "increments Waiver.version by 1"
      - from: CLEARED
        to: APPROVED
        trigger: "POST /drone-ops/waivers/{id}/decide with decision APPROVE"
        actor: WaiverApprover
        preconditions:
          - "waiver.status == CLEARED"
          - "X-User-ID != SafetyCase.cleared_by_user_id (segregation of duties)"
          - "granted_ceiling_ft is supplied and granted_ceiling_ft <= waiver.requested_ceiling_ft"
        side_effects:
          - "granted_ceiling_ft written; valid_until = current_utc + WAIVER_VALIDITY_DAYS days; approved_by_user_id = X-User-ID"
          - "Pilot.open_waiver_count recomputed"
          - "increments Waiver.version by 1"
      - from: CLEARED
        to: DENIED
        trigger: "POST /drone-ops/waivers/{id}/decide with decision DENY"
        actor: WaiverApprover
        preconditions:
          - "waiver.status == CLEARED"
          - "X-User-ID != SafetyCase.cleared_by_user_id (segregation of duties)"
          - "denial_reason is supplied"
        side_effects:
          - "denial_reason written; granted_ceiling_ft and valid_until stay null"
          - "Pilot.open_waiver_count recomputed"
          - "increments Waiver.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system, on POST /drone-ops/waivers creating a new Waiver with the same pilot_id and waiver_type"
        actor: system
        preconditions:
          - "waiver.status == APPROVED"
          - "a new Waiver with identical pilot_id and waiver_type is being created"
        side_effects:
          - "Pilot.open_waiver_count recomputed; Pilot.version += 1"
          - "increments Waiver.version by 1"
      - from: APPROVED
        to: REVOKED
        trigger: "system, on Pilot SUSPENDED -> REVOKED"
        actor: system
        preconditions:
          - "waiver.status IN {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, CLEARED, APPROVED}"
        side_effects:
          - "increments Waiver.version by 1"
      - from: DRAFT
        to: REVOKED
        trigger: "system, on Pilot SUSPENDED -> REVOKED"
        actor: system
        preconditions:
          - "waiver.status == DRAFT"
        side_effects:
          - "increments Waiver.version by 1"

  - entity: SafetyCase
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: REVISION_REQUESTED
        trigger: "POST /drone-ops/waivers/{id}/request-revision"
        actor: SafetyReviewer
        preconditions:
          - "safety_case.review_status == PENDING"
          - "parent waiver.status == UNDER_REVIEW"
        side_effects:
          - "reviewer_findings written"
          - "increments SafetyCase.version by 1"
      - from: REVISION_REQUESTED
        to: PENDING
        trigger: "POST /drone-ops/waivers/{id}/submit from REVISION_REQUESTED"
        actor: Pilot
        preconditions:
          - "safety_case.review_status == REVISION_REQUESTED"
        side_effects:
          - "reviewer_findings -> null"
          - "increments SafetyCase.version by 1"
      - from: PENDING
        to: CLEARED
        trigger: "POST /drone-ops/waivers/{id}/clear-safety-case"
        actor: SafetyReviewer
        preconditions:
          - "safety_case.review_status == PENDING"
          - "safety_case.sail_level <= MAX_APPROVABLE_SAIL"
        side_effects:
          - "cleared_by_user_id = X-User-ID"
          - "increments SafetyCase.version by 1"

  - entity: InsurancePolicy
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /drone-ops/insurance-policies/{id}/verify with outcome ACTIVE"
        actor: ComplianceOfficer
        preconditions:
          - "policy.coverage_status == PENDING_VERIFICATION"
          - "policy.effective_until > current_utc"
        side_effects:
          - "remaining_coverage_cents = coverage_limit_cents - open_reserved_cents_total - settled_cents_total"
          - "increments InsurancePolicy.version by 1"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /drone-ops/insurance-policies/{id}/verify with outcome REJECTED"
        actor: ComplianceOfficer
        preconditions:
          - "policy.coverage_status == PENDING_VERIFICATION"
        side_effects:
          - "increments InsurancePolicy.version by 1"
      - from: ACTIVE
        to: INSUFFICIENT
        trigger: "system, CASCADE link 3 of POST /drone-ops/accident-reports"
        actor: system
        preconditions:
          - "policy.coverage_status == ACTIVE"
          - "recomputed remaining_coverage_cents < MIN_COMMERCIAL_COVERAGE_CENTS"
        side_effects:
          - "CASCADE link 4: every Flight with covering_policy_id == policy.id, operation_category == COMMERCIAL and status == PLANNED transitions to CANCELLED with cancellation_reason COVERAGE_INSUFFICIENT, processed in Flight.created_at ASC order"
          - "increments InsurancePolicy.version by 1"
      - from: INSUFFICIENT
        to: ACTIVE
        trigger: "system, on AccidentReport -> WITHDRAWN or AccidentReport -> CLOSED"
        actor: system
        preconditions:
          - "policy.coverage_status == INSUFFICIENT"
          - "recomputed remaining_coverage_cents >= MIN_COMMERCIAL_COVERAGE_CENTS"
        side_effects:
          - "already-CANCELLED flights are NOT restored"
          - "increments InsurancePolicy.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, inside POST /drone-ops/flights when the policy is evaluated by the covering-policy selector"
        actor: system
        preconditions:
          - "policy.coverage_status IN {ACTIVE, INSUFFICIENT}"
          - "policy.effective_until <= current_utc"
        side_effects:
          - "increments InsurancePolicy.version by 1"
      - from: INSUFFICIENT
        to: EXPIRED
        trigger: "system, inside POST /drone-ops/flights when the policy is evaluated by the covering-policy selector"
        actor: system
        preconditions:
          - "policy.coverage_status == INSUFFICIENT"
          - "policy.effective_until <= current_utc"
        side_effects:
          - "increments InsurancePolicy.version by 1"

  - entity: Flight
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: PREFLIGHT_CLEARED
        trigger: "POST /drone-ops/flights/{id}/preflight-check producing result PASSED"
        actor: Pilot
        preconditions:
          - "flight.status == PLANNED"
          - "the produced PreflightCheck.blocking_findings is empty"
        side_effects:
          - "creates an immutable PreflightCheck row with result PASSED, active_tfr_ids and effective_ceiling_ft"
          - "lazy evaluations run first: RemoteIdModule VERIFIED -> EXPIRED, AirspaceAuthorization APPROVED -> EXPIRED, TemporaryFlightRestriction ACTIVE -> EXPIRED, Pilot CERTIFIED -> LAPSED"
          - "increments Flight.version by 1"
      - from: PLANNED
        to: PLANNED
        trigger: "POST /drone-ops/flights/{id}/preflight-check producing result FAILED"
        actor: Pilot
        preconditions:
          - "flight.status == PLANNED"
          - "the produced PreflightCheck.blocking_findings is non-empty"
        side_effects:
          - "creates an immutable PreflightCheck row with result FAILED and the sorted blocking_findings array"
          - "flight.status is unchanged; Flight.version is NOT incremented"
        note: "A failed preflight check is a recorded advisory, not an error response; the hard gate lives on launch."
      - from: PREFLIGHT_CLEARED
        to: IN_PROGRESS
        trigger: "POST /drone-ops/flights/{id}/launch"
        actor: Pilot
        preconditions:
          - "flight.status == PREFLIGHT_CLEARED"
          - "pilot.status == CERTIFIED and recomputed currency_expires_at > current_utc"
          - "aircraft.registration_status == REGISTERED"
          - "if aircraft.remote_id_required: a RemoteIdModule of the aircraft has status == VERIFIED and verified_until > current_utc"
          - "no TemporaryFlightRestriction on flight.zone_id with status ACTIVE blocks the flight per validations priority 22"
          - "if flight.authorization_id is set: authorization.status == APPROVED and window_start <= current_utc < window_end"
        side_effects:
          - "actual_start = current_utc"
          - "cited AirspaceAuthorization APPROVED -> ACTIVE"
          - "increments Flight.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /drone-ops/flights/{id}/complete"
        actor: Pilot
        preconditions:
          - "flight.status == IN_PROGRESS"
          - "actual_end > flight.actual_start"
        side_effects:
          - "actual_end, max_altitude_reached_ft, incident_occurred, incident_summary written"
          - "logged_minutes = floor((actual_end - actual_start) in minutes)"
          - "altitude_exceedance = max_altitude_reached_ft > (authorization.granted_ceiling_ft when authorization_id is set, else BASE_CEILING_FT)"
          - "cited AirspaceAuthorization ACTIVE -> CONSUMED, releasing the zone slot"
          - "Pilot.last_completed_flight_end = actual_end; Pilot.currency_expires_at recomputed by calculations.pilot_currency_expiry"
          - "Pilot.risk_score recomputed by calculations.pilot_risk_score; when the recomputed score >= RISK_SUSPEND_THRESHOLD the Pilot CERTIFIED -> SUSPENDED transition fires with its depth-4 cascade"
          - "increments Flight.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /drone-ops/flights/{id}/cancel, or CASCADE link 4 of Pilot -> SUSPENDED, or CASCADE link 4 of InsurancePolicy ACTIVE -> INSUFFICIENT"
        actor: Pilot | system
        preconditions:
          - "flight.status IN {PLANNED, PREFLIGHT_CLEARED}"
        side_effects:
          - "cancellation_reason written (request value, AUTHORIZATION_REVOKED, or COVERAGE_INSUFFICIENT)"
          - "no zone slot is released by the flight itself; slot accounting belongs to the AirspaceAuthorization"
          - "increments Flight.version by 1"
      - from: PREFLIGHT_CLEARED
        to: CANCELLED
        trigger: "POST /drone-ops/flights/{id}/cancel, or CASCADE link 4 of Pilot -> SUSPENDED"
        actor: Pilot | system
        preconditions:
          - "flight.status == PREFLIGHT_CLEARED"
        side_effects:
          - "cancellation_reason written"
          - "increments Flight.version by 1"
      - from: NONE
        to: OPEN
        trigger: "POST /drone-ops/accident-reports naming this flight (investigation_status dimension)"
        actor: Pilot | InvestigationOfficer
        preconditions:
          - "flight.investigation_status == NONE"
          - "flight.status IN {IN_PROGRESS, COMPLETED, CANCELLED}"
        side_effects:
          - "CASCADE link 2: because this flight entered investigation, the policy named by flight.covering_policy_id (when non-null) reserves calculations.accident_settlement PROVISIONAL output: open_reserved_cents_total += reserve and remaining_coverage_cents -= reserve, InsurancePolicy.version += 1"
          - "flight.status (operational dimension) is NOT changed by this transition"
          - "increments Flight.version by 1"
        note: "Parallel dimension: investigation_status evolves independently of status; a COMPLETED flight can be OPEN, and an IN_PROGRESS flight can be OPEN."
      - from: OPEN
        to: CLOSED
        trigger: "POST /drone-ops/accident-reports/{id}/close or POST /drone-ops/accident-reports/{id}/withdraw (investigation_status dimension)"
        actor: InvestigationOfficer
        preconditions:
          - "flight.investigation_status == OPEN"
        side_effects:
          - "flight.status (operational dimension) is unchanged"
          - "increments Flight.version by 1"

  - entity: AccidentReport
    initial_state: FILED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: FILED
        to: INVESTIGATING
        trigger: "POST /drone-ops/accident-reports/{id}/open-investigation"
        actor: InvestigationOfficer
        preconditions:
          - "report.status == FILED"
        side_effects:
          - "reserved_cents unchanged (the reserve was taken at filing)"
          - "increments AccidentReport.version by 1"
      - from: INVESTIGATING
        to: REMEDIATION_REQUIRED
        trigger: "POST /drone-ops/accident-reports/{id}/require-remediation"
        actor: InvestigationOfficer
        preconditions:
          - "report.status == INVESTIGATING"
          - "report.remediation_round < MAX_REMEDIATION_ROUNDS"
        side_effects:
          - "remediation_round += 1; remediation_findings written"
          - "increments AccidentReport.version by 1"
      - from: REMEDIATION_REQUIRED
        to: INVESTIGATING
        trigger: "POST /drone-ops/accident-reports/{id}/resume-investigation"
        actor: InvestigationOfficer
        preconditions:
          - "report.status == REMEDIATION_REQUIRED"
        side_effects:
          - "increments AccidentReport.version by 1"
        note: "Closes the INVESTIGATING -> REMEDIATION_REQUIRED -> INVESTIGATING cycle, bounded by MAX_REMEDIATION_ROUNDS."
      - from: INVESTIGATING
        to: CLOSED
        trigger: "POST /drone-ops/accident-reports/{id}/close"
        actor: InvestigationOfficer
        preconditions:
          - "report.status == INVESTIGATING"
          - "damage_line_items and probable_cause are supplied"
          - "when the report's Flight cites an AirspaceAuthorization: X-User-ID != that authorization.approved_by_user_id (segregation of duties)"
        side_effects:
          - "settlement_cents = calculations.accident_settlement FINAL output; reserved_cents -> 0; closed_by_user_id = X-User-ID"
          - "policy.open_reserved_cents_total, policy.settled_cents_total and policy.remaining_coverage_cents recomputed; InsurancePolicy.version += 1"
          - "policy INSUFFICIENT -> ACTIVE when recomputed remaining_coverage_cents >= MIN_COMMERCIAL_COVERAGE_CENTS"
          - "Flight.investigation_status OPEN -> CLOSED"
          - "Pilot.risk_score recomputed (the open-accident term drops out)"
          - "increments AccidentReport.version by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /drone-ops/accident-reports/{id}/withdraw"
        actor: InvestigationOfficer
        preconditions:
          - "report.status IN {FILED, INVESTIGATING}"
        side_effects:
          - "reserved_cents -> 0; settlement_cents stays null"
          - "policy.open_reserved_cents_total and policy.remaining_coverage_cents recomputed, restoring the pre-filing values exactly (invariant coverage_ledger_conservation); InsurancePolicy.version += 1"
          - "policy INSUFFICIENT -> ACTIVE when recomputed remaining_coverage_cents >= MIN_COMMERCIAL_COVERAGE_CENTS"
          - "Flight.investigation_status OPEN -> CLOSED"
          - "Pilot.risk_score recomputed"
          - "increments AccidentReport.version by 1"
      - from: INVESTIGATING
        to: WITHDRAWN
        trigger: "POST /drone-ops/accident-reports/{id}/withdraw"
        actor: InvestigationOfficer
        preconditions:
          - "report.status == INVESTIGATING"
        side_effects:
          - "same compensating side-effect set as FILED -> WITHDRAWN"
          - "increments AccidentReport.version by 1"

  - entity: TemporaryFlightRestriction
    initial_state: ACTIVE
    terminal_states: [LIFTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /drone-ops/tfrs/{id}/lift"
        actor: AirspaceAuthority
        preconditions:
          - "tfr.status == ACTIVE"
        side_effects:
          - "increments TemporaryFlightRestriction.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, inside POST /drone-ops/flights/{id}/preflight-check or POST /drone-ops/flights/{id}/launch"
        actor: system
        preconditions:
          - "tfr.status == ACTIVE"
          - "tfr.effective_until <= current_utc"
        side_effects:
          - "increments TemporaryFlightRestriction.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: authorization-create-stale-zone
    parent_entity: AirspaceZone
    write_endpoint: "POST /drone-ops/airspace-authorizations"
    occ_field: "expected_zone_version"
    description: |
      Creating an AirspaceAuthorization against an AirspaceZone whose version has advanced since
      the client last read it is rejected. A request legitimately succeeds on its own terms — the
      zone still has nominal capacity and the pilot is eligible — but the client's picture of the
      zone's occupancy is stale, because another writer has already lodged or had approved a
      request that consumed part of that capacity and bumped the zone's version.
    error_id: ERR_STALE_ZONE_VERSION
    http_status: 412

  - rule_id: waiver-create-stale-pilot
    parent_entity: Pilot
    write_endpoint: "POST /drone-ops/waivers"
    occ_field: "expected_pilot_version"
    description: |
      Creating a Waiver against a Pilot whose version has advanced since the client last read it
      is rejected. This captures the supersede pattern: a new Waiver of the same waiver_type
      legitimately supersedes the pilot's prior APPROVED waiver of that type, so the write would
      succeed under the natural product semantics; the stale pilot version signals that the
      applicant's view of their own waiver holdings (open_waiver_count and the prior APPROVED
      waiver) predates another accepted mutation.
    error_id: ERR_STALE_PILOT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: knowledge_test_pass_determination
    trigger: "POST /drone-ops/knowledge-tests/{id}/grade"
    algorithm: threshold
    formula: |
      pass_mark = PASS_SCORE_TRUST      if test.test_code == "TRUST_RECREATIONAL"
      pass_mark = PASS_SCORE_PART107    if test.test_code == "PART107_COMMERCIAL"
      test.passed = (test.raw_score >= pass_mark)          # inclusive: equality passes
      test.status = "PASSED" if test.passed else "FAILED"
    input_set: "the single KnowledgeTest addressed by the path id, which MUST have status == SCHEDULED"
    constants:
      PASS_SCORE_TRUST: 100
      PASS_SCORE_PART107: 70
      MAX_ATTEMPTS_PER_12_MONTHS: 3
    precision: "integer scores 0..100; comparison is inclusive (>=)"
    variants: []
    note: |
      The attempt cap is a separate gate applied at scheduling time (POST
      /drone-ops/pilots/{id}/knowledge-tests): the count of KnowledgeTest rows for the pilot whose
      scheduled_at >= current_utc - 365 days (lower bound inclusive, upper bound the current clock
      inclusive) MUST be < MAX_ATTEMPTS_PER_12_MONTHS.

  - name: pilot_currency_expiry
    trigger: "grade transition into CERTIFIED, POST /drone-ops/pilots/{id}/currency-review, POST /drone-ops/flights/{id}/complete, and the read-only projection GET /drone-ops/pilots/{id}/currency-projection"
    algorithm: forward_looking
    formula: |
      # Anchors. cert = the pilot's Certification with status == ACTIVE (exactly one when present;
      # if none, the pilot has no currency and currency_expires_at is null).
      base_expiry   = add_calendar_months(cert.issued_at, CERT_VALIDITY_MONTHS)
                      # calendar-month arithmetic on the UTC instant, clamping the day-of-month
                      # down to the last day of the target month; time-of-day preserved.
      recency_anchor = pilot.last_completed_flight_end
                       if pilot.last_completed_flight_end is not null else cert.issued_at
      recency_expiry = recency_anchor + COMMERCIAL_RECENCY_DAYS days

      # RECREATIONAL_BASIS  : certificate validity alone governs.
      projected_RECREATIONAL = base_expiry
      # COMMERCIAL_BASIS    : certificate validity AND 90-day recency, whichever bites first.
      projected_COMMERCIAL   = min(base_expiry, recency_expiry)

      pilot.currency_basis = "RECREATIONAL_BASIS" if pilot.operator_category == "RECREATIONAL"
                             else "COMMERCIAL_BASIS"
      pilot.currency_expires_at = projected_RECREATIONAL if pilot.currency_basis == "RECREATIONAL_BASIS"
                                  else projected_COMMERCIAL
    input_set: "the pilot's single Certification with status == ACTIVE, plus Flight rows of that pilot with status == COMPLETED (only the maximum actual_end matters; tie-break created_at ASC)"
    constants:
      CERT_VALIDITY_MONTHS: 24
      COMMERCIAL_RECENCY_DAYS: 90
    precision: "every datetime the API emits is an ISO 8601 UTC instant at whole-second precision with a literal Z suffix and no fractional part (for example 2026-06-13T12:00:00Z); comparisons against current_utc are strict (<= current_utc means lapsed)"
    variants:
      - name: RECREATIONAL_BASIS
        when: "pilot.operator_category == RECREATIONAL, and whenever GET /drone-ops/pilots/{id}/currency-projection is called with basis=RECREATIONAL_BASIS"
        difference: "ignores last_completed_flight_end entirely; expiry is cert.issued_at + 24 calendar months"
      - name: COMMERCIAL_BASIS
        when: "pilot.operator_category == COMMERCIAL, and whenever GET /drone-ops/pilots/{id}/currency-projection is called with basis=COMMERCIAL_BASIS"
        difference: "clamps the 24-month certificate expiry down to last_completed_flight_end + 90 days (or cert.issued_at + 90 days when the pilot has never completed a flight), so identical inputs yield an earlier instant than RECREATIONAL_BASIS whenever the 90-day recency window closes first"

  - name: authorization_altitude_ceiling
    trigger: "POST /drone-ops/airspace-authorizations/{id}/decide with decision APPROVE"
    algorithm: constraint_propagation
    formula: |
      # Step 1 - hard physical/regulatory caps.
      class_cap    = zone.class_ceiling_ft
      aircraft_cap = aircraft.max_altitude_ft
      # Step 2 - waiver relief (only an APPROVED waiver whose valid_until > authorization.window_end
      #          and whose id equals authorization.waiver_id contributes; otherwise the base ceiling).
      waiver_cap   = waiver.granted_ceiling_ft
                     if (authorization.waiver_id is not null
                         and waiver.status == "APPROVED"
                         and waiver.valid_until > authorization.window_end)
                     else BASE_CEILING_FT
      # Step 3 - category cap, branching on the pilot's rule set and the zone's relief flag.
      if pilot.operator_category == "RECREATIONAL":
          category_cap = RECREATIONAL_CAP_FT
      else:
          category_cap = BASE_CEILING_FT + STRUCTURE_RELIEF_FT if zone.structure_relief_eligible
                         else BASE_CEILING_FT
      # Step 4 - nested min/max: relief is the better of waiver and category, then clipped by the
      #          hard caps and by what was actually requested.
      granted_ceiling_ft = min(authorization.requested_ceiling_ft,
                               class_cap,
                               aircraft_cap,
                               max(waiver_cap, category_cap))
    input_set: "the authorization under decision, its zone, its aircraft, its requesting pilot, and the single Waiver named by authorization.waiver_id (status must be APPROVED to contribute)"
    constants:
      BASE_CEILING_FT: 400
      RECREATIONAL_CAP_FT: 400
      STRUCTURE_RELIEF_FT: 200
    precision: "integer feet; no rounding (all inputs are integers)"
    variants: []
    note: |
      Request-time validation is deliberately weaker than the grant-time clamp: POST
      /drone-ops/airspace-authorizations rejects requested_ceiling_ft > min(class_cap, aircraft_cap)
      with ERR_ALTITUDE_CEILING_EXCEEDED, while the category/waiver relief only clamps the granted
      value at decision time. A request for 700 ft in a Class D zone (class_ceiling_ft 700) with a
      900 ft airframe is therefore accepted and then granted 600 ft for a COMMERCIAL pilot in a
      structure-relief zone with no waiver.

  - name: safety_case_sail_level
    trigger: "POST /drone-ops/waivers/{id}/safety-cases (at creation)"
    algorithm: weighted_scoring
    formula: |
      arc_index = { "ARC_A": 0, "ARC_B": 1, "ARC_C": 2, "ARC_D": 3 }[safety_case.air_risk_class]
      bvlos_uplift = 1 if parent_waiver.waiver_type == "BVLOS" else 0
      sail_level = min(SAIL_CEILING, safety_case.ground_risk_class + arc_index + bvlos_uplift)
    input_set: "the SafetyCase being created plus its parent Waiver's waiver_type"
    constants:
      SAIL_CEILING: 6
      MAX_APPROVABLE_SAIL: 5
    precision: "integer 1..6"
    variants: []
    note: "clear-safety-case rejects sail_level > MAX_APPROVABLE_SAIL with ERR_SAIL_LEVEL_UNACCEPTABLE."

  - name: accident_settlement
    trigger: "PROVISIONAL variant on POST /drone-ops/accident-reports (filing); FINAL variant on POST /drone-ops/accident-reports/{id}/close"
    algorithm: waterfall_allocation
    formula: |
      # ---------- PROVISIONAL (filing) ----------
      injury_reserve = INJURY_RESERVE_CENTS[report.injury_level]
      raw_reserve    = round_half_up(report.reported_property_damage_cents * PROVISIONAL_RESERVE_FACTOR)
                       + injury_reserve
      report.reserved_cents = min(policy.remaining_coverage_cents, raw_reserve)   # 0 when policy_id is null

      # ---------- FINAL (close) ----------
      # (b) rounding order is PINNED: round each covered line first, THEN sum. Summing the raw
      #     amounts and rounding once at the end is WRONG and produces a different cent figure.
      covered_lines = [ round_half_up(line.amount_cents * COINSURANCE_RATE)
                        for line in report.damage_line_items ]      # request order preserved
      subtotal_cents = sum(covered_lines)
      net_cents      = max(0, subtotal_cents - policy.deductible_cents)
      # (c) circular-looking dependency, order PINNED: the surcharge tier is selected from
      #     net_cents (the pre-surcharge figure) and NEVER from the post-surcharge total, even
      #     though the surcharge becomes part of that total.
      if net_cents <= SURCHARGE_TIER1_MAX_CENTS:            surcharge = 0
      elif net_cents <= SURCHARGE_TIER2_MAX_CENTS:          surcharge = round_half_up(net_cents * SURCHARGE_TIER2_RATE)
      else:                                                 surcharge = round_half_up(net_cents * SURCHARGE_TIER3_RATE)
      uncapped_total = net_cents + surcharge
      headroom       = policy.coverage_limit_cents - policy.settled_cents_total
      report.settlement_cents = min(uncapped_total, headroom)
      report.reserved_cents   = 0
    input_set: "PROVISIONAL: the report being filed and the policy named by flight.covering_policy_id. FINAL: the report's damage_line_items in request order, the policy's deductible_cents, coverage_limit_cents and settled_cents_total over AccidentReport rows with status == CLOSED against that policy (the report being closed is excluded from settled_cents_total while it is computed)."
    constants:
      COINSURANCE_RATE: 0.85
      PROVISIONAL_RESERVE_FACTOR: 1.25
      INJURY_RESERVE_CENTS: { NONE: 0, MINOR: 250000, SERIOUS: 1500000 }
      SURCHARGE_TIER1_MAX_CENTS: 500000
      SURCHARGE_TIER2_MAX_CENTS: 2000000
      SURCHARGE_TIER2_RATE: 0.02
      SURCHARGE_TIER3_RATE: 0.05
      MAX_REMEDIATION_ROUNDS: 2
    precision: "integer cents throughout; every multiplication is rounded with round_half_up to whole cents at the point shown in the formula, never later"
    variants:
      - name: PROVISIONAL
        when: "at filing (POST /drone-ops/accident-reports), while status IN {FILED, INVESTIGATING, REMEDIATION_REQUIRED}"
        difference: "works off the single reported_property_damage_cents figure inflated by PROVISIONAL_RESERVE_FACTOR plus a flat injury reserve, capped by remaining_coverage_cents; it is a hold, not a payment, and it is released in full on close or withdrawal"
      - name: FINAL
        when: "at close (POST /drone-ops/accident-reports/{id}/close)"
        difference: "works off itemised damage_line_items at COINSURANCE_RATE with per-line rounding, subtracts the deductible, adds a tier surcharge keyed on the pre-surcharge net, and is capped by unused coverage_limit headroom - so the same accident yields a different cent figure from the PROVISIONAL reserve on identical inputs"

  - name: pilot_risk_score
    trigger: "POST /drone-ops/flights/{id}/complete, POST /drone-ops/accident-reports, POST /drone-ops/accident-reports/{id}/close, POST /drone-ops/accident-reports/{id}/withdraw, POST /drone-ops/pilots/{id}/currency-review, POST /drone-ops/pilots/{id}/reinstate"
    algorithm: weighted_scoring
    formula: |
      incident_flight_count   = count(Flight where pilot_id == pilot.id
                                      and status == "COMPLETED" and incident_occurred == true)
      exceedance_flight_count = count(Flight where pilot_id == pilot.id
                                      and status == "COMPLETED" and altitude_exceedance == true)
      open_accident_count     = count(AccidentReport whose Flight.pilot_id == pilot.id
                                      and status IN {"FILED","INVESTIGATING","REMEDIATION_REQUIRED"})
      clean_flight_count      = count(Flight where pilot_id == pilot.id and status == "COMPLETED"
                                      and incident_occurred == false and altitude_exceedance == false)
      lapsed_term             = W_LAPSED_CURRENCY if pilot.status == "LAPSED" else 0

      raw = (W_INCIDENT * incident_flight_count
             + W_EXCEEDANCE * exceedance_flight_count
             + W_OPEN_ACCIDENT * open_accident_count
             + lapsed_term
             - DECAY_PER_CLEAN_FLIGHT * clean_flight_count)
      pilot.risk_score = min(SCORE_CEILING, max(SCORE_FLOOR, raw))
      # Threshold is inclusive: >= RISK_SUSPEND_THRESHOLD suspends. Exactly 70 suspends.
      if pilot.risk_score >= RISK_SUSPEND_THRESHOLD and pilot.status IN {"CERTIFIED","LAPSED"}:
          fire Pilot -> SUSPENDED with suspension_reason "RISK_THRESHOLD_REACHED"
    input_set: "Flight rows of the pilot with status == COMPLETED (PLANNED, PREFLIGHT_CLEARED, IN_PROGRESS and CANCELLED flights are excluded) and AccidentReport rows against those flights with status IN {FILED, INVESTIGATING, REMEDIATION_REQUIRED} (CLOSED and WITHDRAWN excluded)"
    constants:
      W_INCIDENT: 25
      W_EXCEEDANCE: 15
      W_OPEN_ACCIDENT: 30
      W_LAPSED_CURRENCY: 10
      DECAY_PER_CLEAN_FLIGHT: 5
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
      RISK_SUSPEND_THRESHOLD: 70
    precision: "integer score, clamped to [0, 100]; threshold comparison is inclusive (>=)"
    variants: []

  - name: zone_slot_occupancy
    trigger: "POST /drone-ops/airspace-authorizations/{id}/decide with decision APPROVE"
    algorithm: interval_merge
    formula: |
      # Half-open interval semantics: [window_start, window_end). Touching windows do NOT collide.
      conflict_count = count(AirspaceAuthorization a
                             where a.zone_id == candidate.zone_id
                               and a.id != candidate.id
                               and a.status IN {"APPROVED", "ACTIVE"}
                               and a.window_start <  candidate.window_end
                               and a.window_end   >  candidate.window_start)
      approve_allowed = (conflict_count < zone.max_concurrent_authorizations)
      # On approval the denormalized counter is maintained:
      #   zone.reserved_slot_count = count(AirspaceAuthorization where zone_id == zone.id
      #                                    and status IN {"APPROVED","ACTIVE"})
    input_set: "AirspaceAuthorization rows on the same zone_id with status IN {APPROVED, ACTIVE}; REQUESTED, DENIED, CONSUMED, REVOKED and EXPIRED rows are excluded"
    constants: {}
    precision: "integer counts; interval comparison strictly half-open, so a.window_end == candidate.window_start is not a conflict"
    variants: []

  - name: aircraft_turnaround_conflict
    trigger: "POST /drone-ops/flights"
    algorithm: interval_merge
    formula: |
      # Closed interval semantics WITH a symmetric buffer: the candidate is padded by
      # AIRCRAFT_TURNAROUND_MINUTES on both ends and touching endpoints DO collide.
      pad_start = candidate.planned_start - AIRCRAFT_TURNAROUND_MINUTES minutes
      pad_end   = candidate.planned_end   + AIRCRAFT_TURNAROUND_MINUTES minutes
      conflict  = exists(Flight f where f.aircraft_id == candidate.aircraft_id
                         and f.status IN {"PLANNED","PREFLIGHT_CLEARED","IN_PROGRESS"}
                         and f.planned_start <= pad_end
                         and f.planned_end   >= pad_start)
      # A gap of exactly AIRCRAFT_TURNAROUND_MINUTES therefore CONFLICTS (endpoints touch);
      # a gap of AIRCRAFT_TURNAROUND_MINUTES + 1 minute is clear.
    input_set: "Flight rows on the same aircraft_id with status IN {PLANNED, PREFLIGHT_CLEARED, IN_PROGRESS}; COMPLETED and CANCELLED flights are excluded"
    constants:
      AIRCRAFT_TURNAROUND_MINUTES: 30
    precision: "minute resolution; comparisons inclusive on both ends (<=, >=)"
    variants: []

  - name: covering_policy_selection
    trigger: "POST /drone-ops/flights with operation_category == COMMERCIAL"
    algorithm: chronological
    formula: |
      # (a) eligibility filter - explicit predicate over InsurancePolicy fields:
      candidates = [ p for p in InsurancePolicy
                     where p.pilot_id == flight.pilot_id
                       and p.coverage_status == "ACTIVE"
                       and p.indemnification_clause_accepted == true
                       and p.effective_from <= flight.planned_start
                       and p.effective_until >  flight.planned_end
                       and p.remaining_coverage_cents >= MIN_COMMERCIAL_COVERAGE_CENTS ]
      # Policies whose effective_until <= current_utc are first transitioned ACTIVE -> EXPIRED and
      # therefore drop out of the candidate set.
      # (b) ranking expression: remaining_coverage_cents DESC
      # (c) tie-break: created_at ASC (never id)
      # (d) empty candidate set: reject the flight creation. Which error is returned is pinned by
      #     validations priority 35/36/37: ERR_INSURANCE_NOT_ACTIVE when the pilot has no
      #     ACTIVE policy at all, ERR_INDEMNIFICATION_NOT_ACCEPTED when an ACTIVE policy exists
      #     covering the window but indemnification_clause_accepted is false, and
      #     ERR_INSURANCE_COVERAGE_INSUFFICIENT when an ACTIVE indemnified policy covers the
      #     window but its remaining_coverage_cents < MIN_COMMERCIAL_COVERAGE_CENTS.
      flight.covering_policy_id = sort(candidates, key=(-remaining_coverage_cents, created_at))[0].id
      # RECREATIONAL flights never run the selector: covering_policy_id stays null.
    input_set: "InsurancePolicy rows of the flight's pilot with coverage_status == ACTIVE; PENDING_VERIFICATION, REJECTED, INSUFFICIENT and EXPIRED policies are excluded"
    constants:
      MIN_COMMERCIAL_COVERAGE_CENTS: 1000000
    precision: "integer cents; ranking on remaining_coverage_cents DESC then created_at ASC"
    variants: []

  - name: flight_log_compliance_summary
    trigger: "GET /drone-ops/pilots/{id}/flight-summary"
    algorithm: aggregation
    formula: |
      window_start = request.window_start if supplied else pilot.created_at
      window_end   = request.window_end   if supplied else current_utc
      # Source set: COMPLETED flights only, keyed on actual_end, lower bound INCLUSIVE, upper
      # bound EXCLUSIVE.
      logged = [ f for f in Flight where f.pilot_id == pilot.id and f.status == "COMPLETED"
                 and f.actual_end >= window_start and f.actual_end < window_end ]
      completed_flight_count  = len(logged)
      total_logged_minutes    = sum(f.logged_minutes for f in logged)                # 0 when empty
      max_altitude_reached_ft = max(f.max_altitude_reached_ft for f in logged) if logged else 0
      incident_flight_count   = count(f in logged where f.incident_occurred == true)
      exceedance_flight_count = count(f in logged where f.altitude_exceedance == true)
      # Empty-set rule is PINNED: every numeric output is 0 and average_duration_minutes is 0.0,
      # never null and never a division by zero.
      average_duration_minutes = 0.0 if completed_flight_count == 0 else
                                 round_half_up(total_logged_minutes / completed_flight_count, 1)
    input_set: "Flight rows of the pilot with status == COMPLETED whose actual_end falls in [window_start, window_end); PLANNED, PREFLIGHT_CLEARED, IN_PROGRESS and CANCELLED flights are excluded"
    constants: {}
    precision: "counts and minutes are integers; average_duration_minutes is a number with 1 decimal place, round_half_up"
    variants: []

  - name: zone_slot_conservation
    trigger: "invariant; re-established after every AirspaceAuthorization status change and asserted by GET /drone-ops/airspace-zones/{id}"
    algorithm: aggregation
    formula: |
      # Conserved quantity: airspace occupancy slots on one zone.
      AirspaceZone.reserved_slot_count
        == count(AirspaceAuthorization a where a.zone_id == zone.id
                 and a.status IN {"APPROVED", "ACTIVE"})
      # Compensating-action form: for any zone Z and any authorization A on Z,
      #   slots_before(approve A) == slots_after(approve A then revoke A)
      # holds exactly, for every path that leaves A in {DENIED, CONSUMED, REVOKED, EXPIRED}:
      # approve (+1) is undone by exactly one of revoke (-1), consume (-1) or expire (-1), and
      # never by two of them, because those transitions are mutually exclusive on one row.
    input_set: "all AirspaceAuthorization rows of the zone; REQUESTED, DENIED, CONSUMED, REVOKED and EXPIRED rows contribute 0"
    constants: {}
    precision: "integer slot count; never negative"
    variants: []

  - name: coverage_ledger_conservation
    trigger: "invariant; re-established after every AccidentReport status change and asserted by GET /drone-ops/insurance-policies/{id}"
    algorithm: aggregation
    formula: |
      # Conserved quantity: insured money on one policy.
      InsurancePolicy.coverage_limit_cents
        == InsurancePolicy.remaining_coverage_cents
         + InsurancePolicy.open_reserved_cents_total
         + InsurancePolicy.settled_cents_total
      where open_reserved_cents_total = sum(r.reserved_cents for AccidentReport r
                                            where r.policy_id == policy.id
                                            and r.status IN {"FILED","INVESTIGATING","REMEDIATION_REQUIRED"})
        and settled_cents_total       = sum(r.settlement_cents for AccidentReport r
                                            where r.policy_id == policy.id and r.status == "CLOSED")
      # Compensating-action form: filing a report (reserve R) followed by withdrawing it releases
      # exactly R, so remaining_coverage_cents returns to its pre-filing value with zero drift and
      # settled_cents_total stays untouched.
    input_set: "AccidentReport rows whose policy_id == policy.id; WITHDRAWN rows contribute 0 to both sums"
    constants: {}
    precision: "integer cents; the three terms sum exactly to coverage_limit_cents at all times"
    variants: []

  - name: aircraft_remote_id_requirement
    trigger: "POST /drone-ops/aircraft (writes Aircraft.remote_id_required); re-read on every registration, return-to-service and launch gate"
    algorithm: threshold
    formula: |
      remote_id_required = (aircraft.takeoff_weight_g > REMOTE_ID_WEIGHT_THRESHOLD_G)
      # Strictly greater. An airframe at exactly REMOTE_ID_WEIGHT_THRESHOLD_G grams is exempt and
      # may be registered and launched with no RemoteIdModule row at all; at threshold + 1 g the
      # airframe requires a module in status VERIFIED whose verified_until > current_utc.
      # The field is written once at creation from the submitted takeoff_weight_g and is never
      # recomputed, because takeoff_weight_g is immutable after creation.
    input_set: "the single Aircraft row being created; no other rows participate"
    constants:
      REMOTE_ID_WEIGHT_THRESHOLD_G: 250
    precision: "integer grams; comparison is strictly greater-than, so 250 is exempt and 251 is not"
    variants: []

  - name: waiver_validity_window
    trigger: "POST /drone-ops/waivers/{id}/decide with decision APPROVE (writes Waiver.valid_until); revision budget read on POST /drone-ops/waivers/{id}/request-revision"
    algorithm: threshold
    formula: |
      # (1) Validity window of an approved waiver.
      waiver.valid_until = current_utc + WAIVER_VALIDITY_DAYS days
      # A Flight citing this waiver requires waiver.valid_until > flight.planned_end (strict),
      # so a flight ending exactly at valid_until is rejected.
      # (2) Revision budget of a waiver under review.
      request-revision is permitted only while waiver.revision_round < MAX_REVISION_ROUNDS;
      each granted revision sets revision_round = revision_round + 1, so a waiver may be sent
      back at most MAX_REVISION_ROUNDS times and the (MAX_REVISION_ROUNDS + 1)-th attempt is
      rejected with ERR_REVISION_LIMIT_EXCEEDED while the waiver stays in UNDER_REVIEW.
    input_set: "the single Waiver row being decided or revised"
    constants:
      WAIVER_VALIDITY_DAYS: 180
      MAX_REVISION_ROUNDS: 2
    precision: "whole days added to the decision instant, preserving time-of-day; revision_round is an integer counter"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty strings"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles declared in §1.7 and that role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for X-User-Role == Pilot, X-User-ID equals the owning Pilot id of the addressed resource (Aircraft.owner_pilot_id, RemoteIdModule -> Aircraft.owner_pilot_id, Waiver.pilot_id, Flight.pilot_id, AirspaceAuthorization.pilot_id, AccidentReport -> Flight.pilot_id) and equals any pilot_id/owner_pilot_id supplied in the body"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "all Pilot-role endpoints"
  - priority: 4
    category: auth
    check: "on POST /drone-ops/waivers/{id}/decide, X-User-ID differs from the SafetyCase.cleared_by_user_id of the waiver's safety case"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /drone-ops/waivers/{id}/decide"
  - priority: 5
    category: auth
    check: "on POST /drone-ops/accident-reports/{id}/close, when the report's Flight cites an AirspaceAuthorization, X-User-ID differs from that authorization.approved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /drone-ops/accident-reports/{id}/close"
  - priority: 6
    category: existence
    check: "every id in the request path exists, validated left to right"
    error_id: ERR_PILOT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id (the error_id names the entity of the failing segment: ERR_PILOT_NOT_FOUND, ERR_KNOWLEDGE_TEST_NOT_FOUND, ERR_AIRCRAFT_NOT_FOUND, ERR_MODULE_NOT_FOUND, ERR_ZONE_NOT_FOUND, ERR_AUTHORIZATION_NOT_FOUND, ERR_WAIVER_NOT_FOUND, ERR_SAFETY_CASE_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_FLIGHT_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_TFR_NOT_FOUND)"
  - priority: 7
    category: business_constraint
    check: "request body shape: all required fields present, enum members valid, integers in range, strings non-blank, arrays well-formed; pagination limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 8
    category: business_temporal
    check: "supplied interval fields are ordered: window_end > window_start, planned_end > planned_start, effective_until > effective_from, and planned_start >= current_utc on flight creation"
    error_id: ERR_INVALID_WINDOW
    http_status: 400
    applies_to: "POST /drone-ops/airspace-authorizations, POST /drone-ops/flights, POST /drone-ops/insurance-policies, POST /drone-ops/tfrs"
  - priority: 9
    category: existence
    check: "every foreign key supplied in the body resolves to an existing row (pilot_id, owner_pilot_id, aircraft_id, zone_id, authorization_id, waiver_id, flight_id)"
    error_id: ERR_AIRCRAFT_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying foreign keys (error_id names the unresolved entity, as in priority 6)"
  - priority: 10
    category: business_constraint
    check: "uniqueness, each with its own code: Pilot.email globally (ERR_DUPLICATE_PILOT_EMAIL), Aircraft.serial_number within owner_pilot_id (ERR_DUPLICATE_AIRCRAFT_SERIAL), RemoteIdModule.module_serial within aircraft_id (ERR_DUPLICATE_MODULE_SERIAL), AirspaceZone.designator globally (ERR_DUPLICATE_ZONE_DESIGNATOR), InsurancePolicy.policy_number within pilot_id (ERR_DUPLICATE_POLICY_NUMBER)"
    error_id: ERR_DUPLICATE_AIRCRAFT_SERIAL
    http_status: 409
    applies_to: "POST /drone-ops/pilots, POST /drone-ops/aircraft, POST /drone-ops/aircraft/{id}/remote-id-modules, POST /drone-ops/airspace-zones, POST /drone-ops/insurance-policies"
  - priority: 11
    category: state
    check: "OCC: expected_zone_version equals the current AirspaceZone.version"
    error_id: ERR_STALE_ZONE_VERSION
    http_status: 412
    applies_to: "POST /drone-ops/airspace-authorizations"
  - priority: 12
    category: state
    check: "OCC: expected_pilot_version equals the current Pilot.version"
    error_id: ERR_STALE_PILOT_VERSION
    http_status: 412
    applies_to: "POST /drone-ops/waivers"
  - priority: 13
    category: state
    check: "the addressed resource is in a state from which this transition is declared in §1.2 (KnowledgeTest.status == SCHEDULED, RemoteIdModule.status per transition, Aircraft.registration_status per transition, AirspaceAuthorization.status per transition, Waiver.status per transition, Flight.status per transition, AccidentReport.status per transition, InsurancePolicy.coverage_status == PENDING_VERIFICATION, TemporaryFlightRestriction.status == ACTIVE). Single carve-out: on POST /drone-ops/flights/{id}/launch a flight whose status is PLANNED is NOT rejected here but is passed through to priority 14, which owns the pre-flight-clearance message; every other launch-time status (IN_PROGRESS, COMPLETED, CANCELLED) is rejected at this priority with ERR_FLIGHT_INVALID_STATE"
    error_id: ERR_FLIGHT_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints; the error_id names the entity whose state blocks the transition: ERR_PILOT_INVALID_STATE, ERR_TEST_ALREADY_GRADED, ERR_MODULE_INVALID_STATE, ERR_AIRCRAFT_INVALID_STATE, ERR_AUTHORIZATION_INVALID_STATE, ERR_WAIVER_INVALID_STATE, ERR_FLIGHT_INVALID_STATE, ERR_REPORT_INVALID_STATE, ERR_POLICY_INVALID_STATE, ERR_TFR_INVALID_STATE"
  - priority: 14
    category: state
    check: "POST /drone-ops/flights/{id}/launch requires flight.status == PREFLIGHT_CLEARED; a flight still in PLANNED - because its last PreflightCheck was FAILED, or because it has no PreflightCheck at all - is rejected here (priority 13 deliberately defers PLANNED launches to this rule)"
    error_id: ERR_PREFLIGHT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /drone-ops/flights/{id}/launch"
  - priority: 15
    category: business_safety
    check: "pilot suspension gate: the acting/target Pilot.status is not SUSPENDED and not REVOKED"
    error_id: ERR_PILOT_SUSPENDED
    http_status: 409
    applies_to: "POST /drone-ops/aircraft, POST /drone-ops/aircraft/{id}/register, POST /drone-ops/aircraft/{id}/return-to-service, POST /drone-ops/airspace-authorizations, POST /drone-ops/waivers, POST /drone-ops/flights, POST /drone-ops/flights/{id}/launch"
  - priority: 16
    category: business_safety
    check: "pilot certification gate: Pilot.status == CERTIFIED"
    error_id: ERR_PILOT_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /drone-ops/airspace-authorizations, POST /drone-ops/waivers/{id}/submit, POST /drone-ops/flights, POST /drone-ops/flights/{id}/launch, POST /drone-ops/airspace-authorizations/{id}/decide"
  - priority: 17
    category: business_safety
    check: "pilot currency gate: recomputed currency_expires_at > current_utc (and > planned_end for flight creation); a CERTIFIED pilot found lapsed here is first transitioned to LAPSED"
    error_id: ERR_PILOT_CURRENCY_LAPSED
    http_status: 409
    applies_to: "POST /drone-ops/airspace-authorizations, POST /drone-ops/flights, POST /drone-ops/flights/{id}/launch"
  - priority: 18
    category: business_safety
    check: "aircraft registration gate: Aircraft.registration_status == REGISTERED (PENDING_REGISTRATION and DEREGISTERED airframes are rejected)"
    error_id: ERR_AIRCRAFT_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /drone-ops/airspace-authorizations, POST /drone-ops/flights, POST /drone-ops/flights/{id}/launch, POST /drone-ops/airspace-authorizations/{id}/decide"
  - priority: 19
    category: business_safety
    check: "aircraft grounding gate: Aircraft.registration_status != GROUNDED"
    error_id: ERR_AIRCRAFT_GROUNDED
    http_status: 409
    applies_to: "POST /drone-ops/airspace-authorizations, POST /drone-ops/flights, POST /drone-ops/flights/{id}/launch"
  - priority: 20
    category: business_safety
    check: "remote ID compliance: when aircraft.remote_id_required, some RemoteIdModule of the aircraft has status == VERIFIED (a module in UNVERIFIED, VERIFICATION_PENDING or VERIFICATION_FAILED, or no module at all, fails here)"
    error_id: ERR_REMOTE_ID_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /drone-ops/aircraft/{id}/register, POST /drone-ops/aircraft/{id}/return-to-service, POST /drone-ops/flights/{id}/launch"
  - priority: 21
    category: business_safety
    check: "remote ID validity window: the VERIFIED module's verified_until > current_utc; a module found stale here is first transitioned VERIFIED -> EXPIRED"
    error_id: ERR_REMOTE_ID_EXPIRED
    http_status: 422
    applies_to: "POST /drone-ops/aircraft/{id}/register, POST /drone-ops/aircraft/{id}/return-to-service, POST /drone-ops/flights/{id}/launch"
  - priority: 22
    category: business_safety
    check: "TFR gate: for every TemporaryFlightRestriction on flight.zone_id with status ACTIVE whose [effective_from, effective_until) overlaps [flight.planned_start, flight.planned_end), the restriction must be non-blocking - max_permitted_altitude_ft is not null AND flight.planned_max_altitude_ft <= max_permitted_altitude_ft; a null max_permitted_altitude_ft is a total ban that acknowledgement cannot clear"
    error_id: ERR_TFR_ACTIVE
    http_status: 422
    applies_to: "POST /drone-ops/flights/{id}/launch"
  - priority: 23
    category: business_safety
    check: "special-operation waiver gate: when exactly one of over_people, night_operation, beyond_visual_line_of_sight is true, waiver_id must be supplied and reference a Waiver of the matching waiver_type with status == APPROVED, same pilot_id and aircraft_id, and valid_until > planned_end; setting more than one flag on a single flight is an ERR_INVALID_REQUEST at priority 7"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /drone-ops/flights"
  - priority: 24
    category: business_constraint
    check: "controlled airspace gate: when zone.requires_authorization is true, authorization_id must be supplied and reference an AirspaceAuthorization with status == APPROVED, matching pilot_id, aircraft_id and zone_id"
    error_id: ERR_AUTHORIZATION_REQUIRED
    http_status: 422
    applies_to: "POST /drone-ops/flights"
  - priority: 25
    category: business_temporal
    check: "authorization window containment: [flight.planned_start, flight.planned_end] must satisfy planned_start >= authorization.window_start and planned_end < authorization.window_end"
    error_id: ERR_AUTHORIZATION_WINDOW_MISMATCH
    http_status: 422
    applies_to: "POST /drone-ops/flights"
  - priority: 26
    category: business_constraint
    check: "altitude ceiling: on authorization creation requested_ceiling_ft <= min(zone.class_ceiling_ft, aircraft.max_altitude_ft); on flight creation planned_max_altitude_ft <= (authorization.granted_ceiling_ft when authorization_id is supplied, else BASE_CEILING_FT)"
    error_id: ERR_ALTITUDE_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /drone-ops/airspace-authorizations, POST /drone-ops/flights"
  - priority: 27
    category: business_constraint
    check: "recreational/commercial rule distinction: a Flight with operation_category == COMMERCIAL requires pilot.operator_category == COMMERCIAL; a Pilot with operator_category == RECREATIONAL may only sit test_code TRUST_RECREATIONAL and may only fly RECREATIONAL operations"
    error_id: ERR_RECREATIONAL_OPERATION_FORBIDDEN
    http_status: 403
    applies_to: "POST /drone-ops/flights, POST /drone-ops/pilots/{id}/knowledge-tests"
  - priority: 28
    category: business_temporal
    check: "zone capacity: calculations.zone_slot_occupancy conflict_count on the half-open window is < zone.max_concurrent_authorizations"
    error_id: ERR_ZONE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /drone-ops/airspace-authorizations/{id}/decide"
  - priority: 29
    category: business_temporal
    check: "aircraft turnaround: calculations.aircraft_turnaround_conflict finds no colliding Flight on the same airframe once the candidate window is padded by AIRCRAFT_TURNAROUND_MINUTES on both ends"
    error_id: ERR_AIRCRAFT_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /drone-ops/flights"
  - priority: 30
    category: business_referential
    check: "waiver submission requires at least one SafetyCase with waiver_id == waiver.id"
    error_id: ERR_SAFETY_CASE_MISSING
    http_status: 422
    applies_to: "POST /drone-ops/waivers/{id}/submit"
  - priority: 31
    category: business_referential
    check: "safety case acceptability: SafetyCase.sail_level <= MAX_APPROVABLE_SAIL"
    error_id: ERR_SAIL_LEVEL_UNACCEPTABLE
    http_status: 422
    applies_to: "POST /drone-ops/waivers/{id}/clear-safety-case"
  - priority: 32
    category: business_referential
    check: "revision budget: Waiver.revision_round < MAX_REVISION_ROUNDS on request-revision; AccidentReport.remediation_round < MAX_REMEDIATION_ROUNDS on require-remediation"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /drone-ops/waivers/{id}/request-revision, POST /drone-ops/accident-reports/{id}/require-remediation"
  - priority: 33
    category: business_referential
    check: "at most one AccidentReport with status IN {FILED, INVESTIGATING, REMEDIATION_REQUIRED, CLOSED} exists per flight_id"
    error_id: ERR_ACCIDENT_REPORT_DUPLICATE
    http_status: 409
    applies_to: "POST /drone-ops/accident-reports"
  - priority: 34
    category: business_referential
    check: "knowledge test attempt cap: fewer than MAX_ATTEMPTS_PER_12_MONTHS KnowledgeTest rows for this pilot with scheduled_at >= current_utc - 365 days"
    error_id: ERR_TEST_ATTEMPT_LIMIT
    http_status: 409
    applies_to: "POST /drone-ops/pilots/{id}/knowledge-tests"
  - priority: 35
    category: business_fiscal
    check: "commercial insurance presence: an InsurancePolicy of the pilot with coverage_status == ACTIVE covering [planned_start, planned_end] exists (checked for COMMERCIAL flights, and for authorization requests by COMMERCIAL pilots)"
    error_id: ERR_INSURANCE_NOT_ACTIVE
    http_status: 402
    applies_to: "POST /drone-ops/flights, POST /drone-ops/airspace-authorizations"
  - priority: 36
    category: business_fiscal
    check: "client indemnification: the covering policy has indemnification_clause_accepted == true"
    error_id: ERR_INDEMNIFICATION_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /drone-ops/flights"
  - priority: 37
    category: business_fiscal
    check: "coverage adequacy: the covering policy's remaining_coverage_cents >= MIN_COMMERCIAL_COVERAGE_CENTS"
    error_id: ERR_INSURANCE_COVERAGE_INSUFFICIENT
    http_status: 402
    applies_to: "POST /drone-ops/flights, POST /drone-ops/airspace-authorizations"
  - priority: 38
    category: business_temporal
    check: "logical clock is monotonic: to_iso8601 > the current logical clock value"
    error_id: ERR_CLOCK_REWIND_FORBIDDEN
    http_status: 409
    applies_to: "POST /drone-ops/_clock/set_current_utc"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# All paths are prefixed with the api_prefix `/drone-ops`. Every request carries
# X-User-Role and X-User-ID headers. Every list endpoint accepts limit? / offset?
# and returns the paginated envelope declared in §1.0.
# ---------------------------------------------------------------------------
endpoints:

  # --- test-driving surface -------------------------------------------------
  - method: POST
    path: "/drone-ops/_clock/set_current_utc"
    description: "Sets the server's logical clock to an explicit UTC instant. The clock's startup default is exactly 2026-08-01T00:00:00Z and the server MUST NOT fall back to real wall-clock time; every deadline, currency window, TFR window and authorization window is evaluated against this logical clock. Moving the clock backwards is rejected."
    roles: [ComplianceOfficer, AirspaceAuthority, SafetyReviewer, WaiverApprover, InvestigationOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, previous_utc: datetime }"
    side_effects:
      - "logical clock advanced; no entity rows are written"
      - "subsequent reads of Pilot.currency_expires_at, RemoteIdModule.verified_until and TemporaryFlightRestriction windows are evaluated against the new instant"

  # --- pilots ---------------------------------------------------------------
  - method: POST
    path: "/drone-ops/pilots"
    description: "Registers a pilot in UNCERTIFIED status with no certification and no currency."
    roles: [ComplianceOfficer]
    code: 201
    input: [full_name, email, operator_category]
    output: Pilot
    side_effects:
      - "status = UNCERTIFIED; currency_expires_at = null; currency_basis derived from operator_category"
      - "risk_score = 0; knowledge_attempt_count = 0; open_waiver_count = 0; version = 1"
  - method: GET
    path: "/drone-ops/pilots/{id}"
    description: "Reads one pilot, including the current version needed for OCC writes against the pilot."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority, SafetyReviewer, WaiverApprover, InvestigationOfficer]
    code: 200
    input: []
    output: Pilot
    side_effects: []
  - method: GET
    path: "/drone-ops/pilots"
    description: "Lists pilots, newest first by created_at DESC, optionally filtered by status or operator_category."
    roles: [ComplianceOfficer, AirspaceAuthority, SafetyReviewer, WaiverApprover, InvestigationOfficer]
    code: 200
    input: ["status?", "operator_category?", "limit?", "offset?"]
    output: Pilot[]
    side_effects: []
  - method: POST
    path: "/drone-ops/pilots/{id}/suspend"
    description: "Suspends a CERTIFIED or LAPSED pilot. Head of cascade A: grounds the pilot's airframes, revokes their live airspace authorizations and cancels the dependent flights."
    roles: [ComplianceOfficer]
    code: 200
    input: [suspension_reason]
    output: Pilot
    side_effects:
      - "Pilot -> SUSPENDED; suspension_reason stored; version incremented"
      - "CASCADE link 2: every Aircraft of the pilot in REGISTERED -> GROUNDED with grounding_reason = OWNER_SUSPENDED"
      - "CASCADE link 3: every AirspaceAuthorization of those airframes in APPROVED or ACTIVE -> REVOKED; AirspaceZone.reserved_slot_count decremented by 1 per revocation and AirspaceZone.version incremented"
      - "CASCADE link 4: every Flight citing a revoked authorization in PLANNED or PREFLIGHT_CLEARED -> CANCELLED with cancellation_reason = AUTHORIZATION_REVOKED"
      - "COMPLETED and IN_PROGRESS flights, DENIED/CONSUMED/REVOKED/EXPIRED authorizations and PENDING_REGISTRATION airframes are left untouched"
  - method: POST
    path: "/drone-ops/pilots/{id}/reinstate"
    description: "Lifts a suspension and returns the pilot to CERTIFIED. Grounded airframes are NOT automatically returned to service and cancelled flights are NOT resurrected."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Pilot
    side_effects:
      - "Pilot SUSPENDED -> CERTIFIED; suspension_reason cleared; risk_score reset to 0; version incremented"
  - method: POST
    path: "/drone-ops/pilots/{id}/revoke"
    description: "Permanently revokes a SUSPENDED pilot. Terminal for the pilot and for every certification, airframe and waiver they hold."
    roles: [ComplianceOfficer]
    code: 200
    input: [suspension_reason]
    output: Pilot
    side_effects:
      - "Pilot SUSPENDED -> REVOKED (terminal); version incremented"
      - "every Certification of the pilot -> REVOKED from ACTIVE, SUPERSEDED or EXPIRED"
      - "every Aircraft of the pilot -> DEREGISTERED from PENDING_REGISTRATION, REGISTERED or GROUNDED"
      - "every Waiver of the pilot in DRAFT or APPROVED -> REVOKED"
  - method: POST
    path: "/drone-ops/pilots/{id}/currency-review"
    description: "Re-evaluates the pilot's currency against the logical clock using calculations.pilot_currency_expiry and moves the pilot between CERTIFIED and LAPSED accordingly."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Pilot
    side_effects:
      - "currency_expires_at and currency_basis recomputed by calculations.pilot_currency_expiry"
      - "CERTIFIED -> LAPSED when currency_expires_at <= current_utc; LAPSED -> CERTIFIED when a fresh ACTIVE certification pushes currency_expires_at > current_utc"
      - "Certification ACTIVE -> EXPIRED when its expires_at <= current_utc"
      - "risk_score recomputed by calculations.pilot_risk_score; a score >= RISK_SUSPEND_THRESHOLD suspends the pilot and fires cascade A"
      - "version incremented"
  - method: GET
    path: "/drone-ops/pilots/{id}/currency-projection"
    description: "Computed read. Projects the pilot's currency expiry under an explicit basis without writing anything, exposing both variants of calculations.pilot_currency_expiry for the same stored data. Defaults to the basis implied by operator_category."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority]
    code: 200
    input: ["basis?"]
    output: "{ projected_expires_at: datetime, basis_applied: string, base_expiry: datetime, recency_expiry: datetime, days_remaining: integer, lapse_due: boolean }"
    side_effects: []
  - method: GET
    path: "/drone-ops/pilots/{id}/flight-summary"
    description: "Computed read over calculations.flight_log_compliance_summary. Aggregates the pilot's COMPLETED flights whose actual_end falls in the half-open window [window_start, window_end); window_start defaults to pilot.created_at and window_end to current_utc. An empty set yields all zeros, never nulls."
    roles: [Pilot, ComplianceOfficer, InvestigationOfficer]
    code: 200
    input: ["window_start?", "window_end?"]
    output: "{ completed_flight_count: integer, total_logged_minutes: integer, average_duration_minutes: number, max_altitude_reached_ft: integer, incident_flight_count: integer, exceedance_flight_count: integer, window_start: datetime, window_end: datetime }"
    side_effects: []

  # --- knowledge tests and certifications -----------------------------------
  - method: POST
    path: "/drone-ops/pilots/{id}/knowledge-tests"
    description: "Schedules a knowledge test for the pilot. A RECREATIONAL pilot may only sit TRUST_RECREATIONAL; a COMMERCIAL pilot may only sit PART107_COMMERCIAL."
    roles: [ComplianceOfficer]
    code: 201
    input: [test_code, scheduled_at]
    output: KnowledgeTest
    side_effects:
      - "attempt_number = pilot.knowledge_attempt_count + 1; Pilot.knowledge_attempt_count incremented"
      - "Pilot UNCERTIFIED -> KNOWLEDGE_PENDING or LAPSED -> KNOWLEDGE_PENDING; Pilot.version incremented"
      - "KnowledgeTest created in SCHEDULED"
  - method: GET
    path: "/drone-ops/knowledge-tests/{id}"
    description: "Reads one knowledge test with its grade and pass flag."
    roles: [Pilot, ComplianceOfficer]
    code: 200
    input: []
    output: KnowledgeTest
    side_effects: []
  - method: GET
    path: "/drone-ops/knowledge-tests"
    description: "Lists knowledge tests, created_at ASC, optionally filtered by pilot_id or status."
    roles: [Pilot, ComplianceOfficer]
    code: 200
    input: ["pilot_id?", "status?", "limit?", "offset?"]
    output: KnowledgeTest[]
    side_effects: []
  - method: POST
    path: "/drone-ops/knowledge-tests/{id}/grade"
    description: "Grades a SCHEDULED knowledge test. calculations.knowledge_test_pass_determination decides pass or fail against the test_code's own threshold, and a pass issues a Certification, superseding the pilot's prior ACTIVE certificate."
    roles: [ComplianceOfficer]
    code: 200
    input: [raw_score]
    output: KnowledgeTest
    side_effects:
      - "passed computed by calculations.knowledge_test_pass_determination; graded_at = current_utc"
      - "KnowledgeTest SCHEDULED -> PASSED or SCHEDULED -> FAILED (terminal either way)"
      - "on pass: a Certification is created in ACTIVE with issued_at = current_utc, expires_at = issued_at + CERT_VALIDITY_MONTHS calendar months, originating_test_id = this test, and supersedes_certification_id set to the pilot's prior ACTIVE certificate when one exists"
      - "on pass: the prior Certification ACTIVE -> SUPERSEDED; Pilot KNOWLEDGE_PENDING -> CERTIFIED with certified_at and currency_expires_at written by calculations.pilot_currency_expiry"
      - "on fail: Pilot KNOWLEDGE_PENDING -> UNCERTIFIED; no Certification is created"
      - "Pilot.version incremented"
  - method: GET
    path: "/drone-ops/certifications/{id}"
    description: "Reads one certification."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: GET
    path: "/drone-ops/certifications"
    description: "Lists certifications, created_at ASC. The only discovery channel for a Certification, which is always created as a side effect of grading rather than by a direct POST."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority]
    code: 200
    input: ["pilot_id?", "originating_test_id?", "supersedes_certification_id?", "status?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  # --- aircraft and remote identification -----------------------------------
  - method: POST
    path: "/drone-ops/aircraft"
    description: "Registers an airframe in PENDING_REGISTRATION. remote_id_required is computed once from takeoff_weight_g by calculations.aircraft_remote_id_requirement and is never recomputed."
    roles: [Pilot, ComplianceOfficer]
    code: 201
    input: [owner_pilot_id, model, serial_number, takeoff_weight_g, max_altitude_ft]
    output: Aircraft
    side_effects:
      - "remote_id_required = takeoff_weight_g > REMOTE_ID_WEIGHT_THRESHOLD_G"
      - "registration_status = PENDING_REGISTRATION; registration_number = null"
  - method: GET
    path: "/drone-ops/aircraft/{id}"
    description: "Reads one airframe with its registration status and remote-ID requirement flag."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority, InvestigationOfficer]
    code: 200
    input: []
    output: Aircraft
    side_effects: []
  - method: GET
    path: "/drone-ops/aircraft"
    description: "Lists airframes, created_at ASC, optionally filtered by owner_pilot_id or registration_status."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority, InvestigationOfficer]
    code: 200
    input: ["owner_pilot_id?", "registration_status?", "limit?", "offset?"]
    output: Aircraft[]
    side_effects: []
  - method: POST
    path: "/drone-ops/aircraft/{id}/register"
    description: "Issues a registration number and moves a PENDING_REGISTRATION airframe to REGISTERED. When remote_id_required is true this requires a RemoteIdModule in VERIFIED status whose verified_until is still in the future."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Aircraft
    side_effects:
      - "registration_number assigned; Aircraft PENDING_REGISTRATION -> REGISTERED"
      - "a VERIFIED module whose verified_until <= current_utc is first moved VERIFIED -> EXPIRED and the registration is then rejected with ERR_REMOTE_ID_EXPIRED"
  - method: POST
    path: "/drone-ops/aircraft/{id}/ground"
    description: "Grounds a REGISTERED airframe for maintenance or enforcement, revoking its live airspace authorizations and cancelling the flights that depend on them."
    roles: [ComplianceOfficer]
    code: 200
    input: [grounding_reason]
    output: Aircraft
    side_effects:
      - "Aircraft REGISTERED -> GROUNDED; grounding_reason stored"
      - "every AirspaceAuthorization of this airframe in APPROVED or ACTIVE -> REVOKED; AirspaceZone.reserved_slot_count decremented per revocation and AirspaceZone.version incremented"
      - "every Flight citing a revoked authorization in PLANNED or PREFLIGHT_CLEARED -> CANCELLED with cancellation_reason = AIRCRAFT_GROUNDED"
  - method: POST
    path: "/drone-ops/aircraft/{id}/return-to-service"
    description: "Returns a GROUNDED airframe to REGISTERED. Re-checks remote-ID compliance, so an airframe whose module expired while grounded cannot fly again until the module is re-verified."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Aircraft
    side_effects:
      - "Aircraft GROUNDED -> REGISTERED; grounding_reason cleared"
      - "revoked authorizations and cancelled flights are NOT restored"
  - method: POST
    path: "/drone-ops/aircraft/{id}/remote-id-modules"
    description: "Attaches a remote identification broadcast module to an airframe in UNVERIFIED status."
    roles: [Pilot, ComplianceOfficer]
    code: 201
    input: [module_serial, broadcast_protocol, firmware_version, "broadcast_sample_ref?"]
    output: RemoteIdModule
    side_effects:
      - "RemoteIdModule created in UNVERIFIED; verified_at and verified_until null"
  - method: GET
    path: "/drone-ops/remote-id-modules/{id}"
    description: "Reads one broadcast module with its verification status and validity window."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority]
    code: 200
    input: []
    output: RemoteIdModule
    side_effects: []
  - method: GET
    path: "/drone-ops/remote-id-modules"
    description: "Lists broadcast modules, created_at ASC, optionally filtered by aircraft_id or status."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority]
    code: 200
    input: ["aircraft_id?", "status?", "limit?", "offset?"]
    output: RemoteIdModule[]
    side_effects: []
  - method: POST
    path: "/drone-ops/remote-id-modules/{id}/submit-verification"
    description: "Submits a broadcast sample for verification, moving the module to VERIFICATION_PENDING. Accepted from UNVERIFIED, VERIFICATION_FAILED and EXPIRED, which is how a failed or lapsed module re-enters the queue."
    roles: [Pilot, ComplianceOfficer]
    code: 200
    input: [broadcast_sample_ref]
    output: RemoteIdModule
    side_effects:
      - "RemoteIdModule -> VERIFICATION_PENDING; broadcast_sample_ref stored; failure_reason cleared"
  - method: POST
    path: "/drone-ops/remote-id-modules/{id}/verify"
    description: "Adjudicates a VERIFICATION_PENDING module. outcome VERIFIED requires verified_until; outcome FAILED requires failure_reason."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "verified_until?", "failure_reason?"]
    output: RemoteIdModule
    side_effects:
      - "on VERIFIED: VERIFICATION_PENDING -> VERIFIED; verified_at = current_utc; verified_until stored"
      - "on FAILED: VERIFICATION_PENDING -> VERIFICATION_FAILED; failure_reason stored; verified_until cleared"

  # --- airspace zones and temporary flight restrictions ----------------------
  - method: POST
    path: "/drone-ops/airspace-zones"
    description: "Publishes an airspace zone with its classification, ceiling, authorization requirement and concurrent-authorization capacity."
    roles: [AirspaceAuthority]
    code: 201
    input: [designator, class_code, class_ceiling_ft, requires_authorization, max_concurrent_authorizations, "structure_relief_eligible?"]
    output: AirspaceZone
    side_effects:
      - "reserved_slot_count = 0; version = 1"
  - method: GET
    path: "/drone-ops/airspace-zones/{id}"
    description: "Reads one zone, including reserved_slot_count and the version an authorization request must echo in expected_zone_version."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority, InvestigationOfficer]
    code: 200
    input: []
    output: AirspaceZone
    side_effects: []
  - method: GET
    path: "/drone-ops/airspace-zones"
    description: "Lists zones, created_at ASC, optionally filtered by class_code."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority, InvestigationOfficer]
    code: 200
    input: ["class_code?", "limit?", "offset?"]
    output: AirspaceZone[]
    side_effects: []
  - method: POST
    path: "/drone-ops/tfrs"
    description: "Publishes a temporary flight restriction over a zone. Omitting max_permitted_altitude_ft declares a total ban that no acknowledgement can clear."
    roles: [AirspaceAuthority]
    code: 201
    input: [zone_id, reason, effective_from, effective_until, "max_permitted_altitude_ft?"]
    output: TemporaryFlightRestriction
    side_effects:
      - "TemporaryFlightRestriction created in ACTIVE; published_by_user_id = X-User-ID"
  - method: GET
    path: "/drone-ops/tfrs/{id}"
    description: "Reads one temporary flight restriction."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority]
    code: 200
    input: []
    output: TemporaryFlightRestriction
    side_effects: []
  - method: GET
    path: "/drone-ops/tfrs"
    description: "Lists temporary flight restrictions, created_at ASC, optionally filtered by zone_id or status."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority]
    code: 200
    input: ["zone_id?", "status?", "limit?", "offset?"]
    output: TemporaryFlightRestriction[]
    side_effects: []
  - method: POST
    path: "/drone-ops/tfrs/{id}/lift"
    description: "Lifts an ACTIVE temporary flight restriction ahead of its effective_until."
    roles: [AirspaceAuthority]
    code: 200
    input: []
    output: TemporaryFlightRestriction
    side_effects:
      - "TemporaryFlightRestriction ACTIVE -> LIFTED (terminal); flights that were blocked by it are not resurrected but new preflight checks stop reporting it"

  # --- airspace authorizations ----------------------------------------------
  - method: POST
    path: "/drone-ops/airspace-authorizations"
    description: "Requests controlled-airspace access for one airframe over one zone in one window. Optimistically concurrent on the zone: expected_zone_version must equal the zone's current version, which advances on every approval or revocation."
    roles: [Pilot]
    code: 201
    input: [pilot_id, aircraft_id, zone_id, "waiver_id?", requested_ceiling_ft, window_start, window_end, expected_zone_version]
    output: AirspaceAuthorization
    side_effects:
      - "AirspaceAuthorization created in REQUESTED; granted_ceiling_ft null until decided"
      - "no slot is reserved at request time; reserved_slot_count only moves on approval"
  - method: GET
    path: "/drone-ops/airspace-authorizations/{id}"
    description: "Reads one airspace authorization with its granted ceiling and decision metadata."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority, InvestigationOfficer]
    code: 200
    input: []
    output: AirspaceAuthorization
    side_effects: []
  - method: GET
    path: "/drone-ops/airspace-authorizations"
    description: "Lists airspace authorizations, created_at ASC, optionally filtered by pilot_id, aircraft_id, zone_id, waiver_id or status."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority, InvestigationOfficer]
    code: 200
    input: ["pilot_id?", "aircraft_id?", "zone_id?", "waiver_id?", "status?", "limit?", "offset?"]
    output: AirspaceAuthorization[]
    side_effects: []
  - method: POST
    path: "/drone-ops/airspace-authorizations/{id}/decide"
    description: "Approves or denies a REQUESTED authorization. Approval computes granted_ceiling_ft by calculations.authorization_altitude_ceiling and consumes one of the zone's concurrent-authorization slots, checked by calculations.zone_slot_occupancy over the half-open request window."
    roles: [AirspaceAuthority]
    code: 200
    input: [decision, "denial_reason?"]
    output: AirspaceAuthorization
    side_effects:
      - "on APPROVE: REQUESTED -> APPROVED; granted_ceiling_ft written by calculations.authorization_altitude_ceiling; approved_by_user_id = X-User-ID; decided_at = current_utc"
      - "on APPROVE: AirspaceZone.reserved_slot_count incremented by 1 and AirspaceZone.version incremented, preserving calculations.zone_slot_conservation"
      - "on DENY: REQUESTED -> DENIED (terminal); denial_reason stored; no slot consumed and the zone's version is unchanged"
  - method: POST
    path: "/drone-ops/airspace-authorizations/{id}/revoke"
    description: "Revokes an APPROVED or ACTIVE authorization, releasing its zone slot. The compensating action for approval."
    roles: [AirspaceAuthority]
    code: 200
    input: ["denial_reason?"]
    output: AirspaceAuthorization
    side_effects:
      - "AirspaceAuthorization APPROVED or ACTIVE -> REVOKED (terminal)"
      - "AirspaceZone.reserved_slot_count decremented by 1 and AirspaceZone.version incremented, restoring calculations.zone_slot_conservation to its pre-approval value"
      - "every Flight citing this authorization in PLANNED or PREFLIGHT_CLEARED -> CANCELLED with cancellation_reason = AUTHORIZATION_REVOKED"

  # --- waivers and safety cases ---------------------------------------------
  - method: POST
    path: "/drone-ops/waivers"
    description: "Opens a waiver application in DRAFT for operations over people, at night or beyond visual line of sight. Optimistically concurrent on the pilot: expected_pilot_version must equal the pilot's current version, because a new waiver of the same waiver_type supersedes the pilot's prior APPROVED waiver."
    roles: [Pilot]
    code: 201
    input: [pilot_id, aircraft_id, waiver_type, requested_ceiling_ft, operation_description, expected_pilot_version]
    output: Waiver
    side_effects:
      - "Waiver created in DRAFT with revision_round = 0 and valid_until null"
      - "the pilot's prior APPROVED Waiver of the same waiver_type -> SUPERSEDED"
      - "Pilot.open_waiver_count incremented and Pilot.version incremented"
  - method: GET
    path: "/drone-ops/waivers/{id}"
    description: "Reads one waiver with its revision round, granted ceiling and validity window."
    roles: [Pilot, ComplianceOfficer, SafetyReviewer, WaiverApprover, AirspaceAuthority]
    code: 200
    input: []
    output: Waiver
    side_effects: []
  - method: GET
    path: "/drone-ops/waivers"
    description: "Lists waivers, created_at ASC, optionally filtered by pilot_id, aircraft_id, waiver_type or status."
    roles: [Pilot, ComplianceOfficer, SafetyReviewer, WaiverApprover, AirspaceAuthority]
    code: 200
    input: ["pilot_id?", "aircraft_id?", "waiver_type?", "status?", "limit?", "offset?"]
    output: Waiver[]
    side_effects: []
  - method: POST
    path: "/drone-ops/waivers/{id}/safety-cases"
    description: "Attaches safety case documentation to a DRAFT or REVISION_REQUESTED waiver. sail_level is computed from ground_risk_class and air_risk_class by calculations.safety_case_sail_level."
    roles: [Pilot]
    code: 201
    input: [mitigation_summary, ground_risk_class, air_risk_class, contingency_procedures]
    output: SafetyCase
    side_effects:
      - "sail_level computed by calculations.safety_case_sail_level; SafetyCase created in PENDING"
  - method: GET
    path: "/drone-ops/safety-cases/{id}"
    description: "Reads one safety case with its computed SAIL level, review status and clearing officer."
    roles: [Pilot, ComplianceOfficer, SafetyReviewer, WaiverApprover]
    code: 200
    input: []
    output: SafetyCase
    side_effects: []
  - method: GET
    path: "/drone-ops/safety-cases"
    description: "Lists safety cases, created_at ASC, optionally filtered by waiver_id or review_status. The channel through which an approver reads cleared_by_user_id before deciding, which is what makes the segregation-of-duties check observable."
    roles: [Pilot, ComplianceOfficer, SafetyReviewer, WaiverApprover]
    code: 200
    input: ["waiver_id?", "review_status?", "limit?", "offset?"]
    output: SafetyCase[]
    side_effects: []
  - method: POST
    path: "/drone-ops/waivers/{id}/submit"
    description: "Submits a DRAFT or REVISION_REQUESTED waiver for review. Requires at least one SafetyCase and a CERTIFIED pilot."
    roles: [Pilot]
    code: 200
    input: []
    output: Waiver
    side_effects:
      - "Waiver DRAFT -> SUBMITTED, or REVISION_REQUESTED -> SUBMITTED"
      - "on resubmission from REVISION_REQUESTED: every SafetyCase of the waiver REVISION_REQUESTED -> PENDING"
  - method: POST
    path: "/drone-ops/waivers/{id}/begin-review"
    description: "Takes a SUBMITTED waiver under review."
    roles: [SafetyReviewer]
    code: 200
    input: []
    output: Waiver
    side_effects:
      - "Waiver SUBMITTED -> UNDER_REVIEW"
  - method: POST
    path: "/drone-ops/waivers/{id}/request-revision"
    description: "Sends an UNDER_REVIEW waiver back to the applicant. Permitted only while revision_round < MAX_REVISION_ROUNDS."
    roles: [SafetyReviewer]
    code: 200
    input: [reviewer_findings]
    output: Waiver
    side_effects:
      - "Waiver UNDER_REVIEW -> REVISION_REQUESTED; revision_round incremented"
      - "every SafetyCase of the waiver PENDING -> REVISION_REQUESTED with reviewer_findings stored"
  - method: POST
    path: "/drone-ops/waivers/{id}/clear-safety-case"
    description: "Clears the safety case of an UNDER_REVIEW waiver. Requires sail_level <= MAX_APPROVABLE_SAIL and stamps the reviewer's own user id onto the safety case, which the later approval decision must differ from."
    roles: [SafetyReviewer]
    code: 200
    input: ["reviewer_findings?"]
    output: Waiver
    side_effects:
      - "Waiver UNDER_REVIEW -> CLEARED"
      - "every SafetyCase of the waiver PENDING -> CLEARED with cleared_by_user_id = X-User-ID"
  - method: POST
    path: "/drone-ops/waivers/{id}/decide"
    description: "Approves or denies a CLEARED waiver. Segregated from safety review: the deciding X-User-ID must differ from the safety case's cleared_by_user_id. Approval writes valid_until = current_utc + WAIVER_VALIDITY_DAYS days."
    roles: [WaiverApprover]
    code: 200
    input: [decision, "granted_ceiling_ft?", "denial_reason?"]
    output: Waiver
    side_effects:
      - "on APPROVE: CLEARED -> APPROVED; granted_ceiling_ft stored; valid_until = current_utc + WAIVER_VALIDITY_DAYS days; approved_by_user_id = X-User-ID"
      - "on DENY: CLEARED -> DENIED (terminal); denial_reason stored"
      - "Pilot.open_waiver_count decremented and Pilot.version incremented either way"

  # --- insurance -------------------------------------------------------------
  - method: POST
    path: "/drone-ops/insurance-policies"
    description: "Files a liability policy for a pilot in PENDING_VERIFICATION. No coverage is available until an officer verifies it."
    roles: [Pilot, ComplianceOfficer]
    code: 201
    input: [pilot_id, insurer_name, policy_number, coverage_limit_cents, deductible_cents, effective_from, effective_until, indemnification_clause_accepted]
    output: InsurancePolicy
    side_effects:
      - "coverage_status = PENDING_VERIFICATION; remaining_coverage_cents = 0; open_reserved_cents_total = 0; settled_cents_total = 0"
  - method: GET
    path: "/drone-ops/insurance-policies/{id}"
    description: "Reads one policy with its live coverage ledger: remaining, open reserves and settled totals."
    roles: [Pilot, ComplianceOfficer, InvestigationOfficer]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/drone-ops/insurance-policies"
    description: "Lists policies, created_at ASC, optionally filtered by pilot_id or coverage_status."
    roles: [Pilot, ComplianceOfficer, InvestigationOfficer]
    code: 200
    input: ["pilot_id?", "coverage_status?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []
  - method: POST
    path: "/drone-ops/insurance-policies/{id}/verify"
    description: "Adjudicates a PENDING_VERIFICATION policy. Activation opens the coverage ledger at the full coverage limit."
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome]
    output: InsurancePolicy
    side_effects:
      - "on ACTIVE: PENDING_VERIFICATION -> ACTIVE; remaining_coverage_cents = coverage_limit_cents, establishing calculations.coverage_ledger_conservation"
      - "on REJECTED: PENDING_VERIFICATION -> REJECTED (terminal); remaining_coverage_cents stays 0"

  # --- flights ---------------------------------------------------------------
  - method: POST
    path: "/drone-ops/flights"
    description: "Plans a flight. Runs the full eligibility ladder of §1.4 - pilot certification, currency and suspension, airframe registration and grounding, waiver coverage for the special-operation flags, controlled-airspace authorization and its window, altitude ceiling, airframe turnaround separation and, for commercial work, the covering insurance policy chosen by calculations.covering_policy_selection."
    roles: [Pilot]
    code: 201
    input: [pilot_id, aircraft_id, zone_id, "authorization_id?", "waiver_id?", operation_category, planned_start, planned_end, planned_max_altitude_ft, launch_latitude, launch_longitude, "over_people?", "night_operation?", "beyond_visual_line_of_sight?"]
    output: Flight
    side_effects:
      - "Flight created in PLANNED with investigation_status NONE, logged_minutes 0 and altitude_exceedance false"
      - "for COMMERCIAL operations: covering_policy_id written by calculations.covering_policy_selection; an ACTIVE policy whose effective_until <= current_utc is first moved ACTIVE -> EXPIRED and skipped by the selector"
      - "airframe separation checked by calculations.aircraft_turnaround_conflict over the padded window"
  - method: GET
    path: "/drone-ops/flights/{id}"
    description: "Reads one flight with both of its state dimensions, its logged telemetry and its covering policy."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority, InvestigationOfficer]
    code: 200
    input: []
    output: Flight
    side_effects: []
  - method: GET
    path: "/drone-ops/flights"
    description: "Lists flights, created_at ASC, optionally filtered by pilot_id, aircraft_id, zone_id, authorization_id, waiver_id, covering_policy_id, status or investigation_status."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority, InvestigationOfficer]
    code: 200
    input: ["pilot_id?", "aircraft_id?", "zone_id?", "authorization_id?", "waiver_id?", "covering_policy_id?", "status?", "investigation_status?", "limit?", "offset?"]
    output: Flight[]
    side_effects: []
  - method: POST
    path: "/drone-ops/flights/{id}/preflight-check"
    description: "Runs the pre-flight restricted-area and TFR sweep for a PLANNED flight and appends an immutable PreflightCheck record. A PASSED result clears the flight for launch; a FAILED result leaves the flight PLANNED and lists the blocking findings."
    roles: [Pilot]
    code: 201
    input: ["acknowledged_tfr_ids?"]
    output: PreflightCheck
    side_effects:
      - "active_tfr_ids collected from ACTIVE restrictions on the flight's zone overlapping the flight window; blocking_findings lists every unmet gate"
      - "lapsed currency moves Pilot CERTIFIED -> LAPSED; a stale module moves RemoteIdModule VERIFIED -> EXPIRED; a past-window authorization moves AirspaceAuthorization APPROVED -> EXPIRED; a past-window restriction moves TemporaryFlightRestriction ACTIVE -> EXPIRED"
      - "on PASSED: Flight PLANNED -> PREFLIGHT_CLEARED; on FAILED: Flight stays PLANNED and may be re-checked"
      - "effective_ceiling_ft recorded from the flight's authorization or BASE_CEILING_FT"
  - method: GET
    path: "/drone-ops/flights/{id}/preflight-checks"
    description: "Lists the immutable pre-flight check records of one flight, created_at ASC. The only discovery channel for a PreflightCheck, which has no direct read endpoint of its own."
    roles: [Pilot, ComplianceOfficer, AirspaceAuthority, InvestigationOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PreflightCheck[]
    side_effects: []
  - method: POST
    path: "/drone-ops/flights/{id}/launch"
    description: "Launches a PREFLIGHT_CLEARED flight, re-running the safety gates against the clock at launch time so that a clearance which has since gone stale cannot be flown."
    roles: [Pilot]
    code: 200
    input: []
    output: Flight
    side_effects:
      - "Flight PREFLIGHT_CLEARED -> IN_PROGRESS; actual_start = current_utc"
      - "the cited AirspaceAuthorization APPROVED -> ACTIVE, holding its zone slot"
      - "stale gates first transition their own rows: RemoteIdModule VERIFIED -> EXPIRED, AirspaceAuthorization APPROVED -> EXPIRED, TemporaryFlightRestriction ACTIVE -> EXPIRED, Pilot CERTIFIED -> LAPSED"
  - method: POST
    path: "/drone-ops/flights/{id}/complete"
    description: "Logs an IN_PROGRESS flight as flown, recording the achieved altitude and whether an incident occurred."
    roles: [Pilot]
    code: 200
    input: [actual_end, max_altitude_reached_ft, incident_occurred, "incident_summary?"]
    output: Flight
    side_effects:
      - "Flight IN_PROGRESS -> COMPLETED; logged_minutes = whole minutes between actual_start and actual_end"
      - "altitude_exceedance = max_altitude_reached_ft > effective ceiling of the flight"
      - "the cited AirspaceAuthorization ACTIVE -> CONSUMED; AirspaceZone.reserved_slot_count decremented and AirspaceZone.version incremented"
      - "Pilot.last_completed_flight_end updated, currency recomputed by calculations.pilot_currency_expiry, risk_score recomputed by calculations.pilot_risk_score, Pilot.version incremented"
      - "a recomputed risk_score >= RISK_SUSPEND_THRESHOLD suspends the pilot and fires cascade A"
  - method: POST
    path: "/drone-ops/flights/{id}/cancel"
    description: "Cancels a PLANNED or PREFLIGHT_CLEARED flight, releasing nothing on the zone because the slot belongs to the authorization rather than the flight."
    roles: [Pilot, ComplianceOfficer]
    code: 200
    input: [cancellation_reason]
    output: Flight
    side_effects:
      - "Flight -> CANCELLED (terminal); cancellation_reason stored"
      - "the cited AirspaceAuthorization keeps its APPROVED status and its zone slot"

  # --- accidents and investigations -----------------------------------------
  - method: POST
    path: "/drone-ops/accident-reports"
    description: "Files an accident report against a COMPLETED or IN_PROGRESS flight. Head of cascade B: opens the flight's investigation dimension, debits a provisional reserve against the covering policy by the PROVISIONAL variant of calculations.accident_settlement, and cancels the pilot's planned commercial flights when the reserve leaves the policy under-covered."
    roles: [Pilot, InvestigationOfficer]
    code: 201
    input: [flight_id, occurred_at, injury_level, reported_property_damage_cents, narrative]
    output: AccidentReport
    side_effects:
      - "AccidentReport created in FILED; policy_id copied from the flight's covering_policy_id; reserved_cents computed by the PROVISIONAL variant of calculations.accident_settlement"
      - "CASCADE link 2: Flight.investigation_status NONE -> OPEN"
      - "CASCADE link 3: InsurancePolicy.open_reserved_cents_total increased and remaining_coverage_cents decreased by reserved_cents, preserving calculations.coverage_ledger_conservation; the policy moves ACTIVE -> INSUFFICIENT when remaining_coverage_cents < MIN_COMMERCIAL_COVERAGE_CENTS"
      - "CASCADE link 4: when the policy becomes INSUFFICIENT, every PLANNED COMMERCIAL Flight covered by it -> CANCELLED with cancellation_reason = COVERAGE_INSUFFICIENT"
      - "Pilot.risk_score recomputed by calculations.pilot_risk_score and Pilot.version incremented; when the recomputed score >= RISK_SUSPEND_THRESHOLD the Pilot CERTIFIED -> SUSPENDED transition fires with suspension_reason RISK_THRESHOLD_REACHED and its depth-4 cascade A"
  - method: GET
    path: "/drone-ops/accident-reports/{id}"
    description: "Reads one accident report with its reserve, settlement and remediation round."
    roles: [Pilot, ComplianceOfficer, InvestigationOfficer]
    code: 200
    input: []
    output: AccidentReport
    side_effects: []
  - method: GET
    path: "/drone-ops/accident-reports"
    description: "Lists accident reports, created_at ASC, optionally filtered by flight_id, policy_id or status."
    roles: [Pilot, ComplianceOfficer, InvestigationOfficer]
    code: 200
    input: ["flight_id?", "policy_id?", "status?", "limit?", "offset?"]
    output: AccidentReport[]
    side_effects: []
  - method: POST
    path: "/drone-ops/accident-reports/{id}/open-investigation"
    description: "Opens the formal investigation of a FILED report."
    roles: [InvestigationOfficer]
    code: 200
    input: []
    output: AccidentReport
    side_effects:
      - "AccidentReport FILED -> INVESTIGATING"
  - method: POST
    path: "/drone-ops/accident-reports/{id}/require-remediation"
    description: "Sends an INVESTIGATING report back for operator remediation. Permitted only while remediation_round < MAX_REMEDIATION_ROUNDS."
    roles: [InvestigationOfficer]
    code: 200
    input: [remediation_findings]
    output: AccidentReport
    side_effects:
      - "AccidentReport INVESTIGATING -> REMEDIATION_REQUIRED; remediation_round incremented; remediation_findings stored"
      - "the reserve is untouched, so the policy stays INSUFFICIENT for the whole remediation loop"
  - method: POST
    path: "/drone-ops/accident-reports/{id}/resume-investigation"
    description: "Returns a REMEDIATION_REQUIRED report to INVESTIGATING once the operator has responded."
    roles: [InvestigationOfficer]
    code: 200
    input: []
    output: AccidentReport
    side_effects:
      - "AccidentReport REMEDIATION_REQUIRED -> INVESTIGATING"
  - method: POST
    path: "/drone-ops/accident-reports/{id}/close"
    description: "Closes an INVESTIGATING report with the itemised damages, replacing the provisional reserve with the FINAL variant of calculations.accident_settlement. Segregated from airspace approval: the closing X-User-ID must differ from the approved_by_user_id of the flight's authorization."
    roles: [InvestigationOfficer]
    code: 200
    input: [damage_line_items, probable_cause]
    output: AccidentReport
    side_effects:
      - "AccidentReport INVESTIGATING -> CLOSED (terminal); settlement_cents computed by the FINAL variant of calculations.accident_settlement; closed_by_user_id = X-User-ID"
      - "InsurancePolicy.open_reserved_cents_total decreased by reserved_cents and settled_cents_total increased by settlement_cents; remaining_coverage_cents recomputed, preserving calculations.coverage_ledger_conservation"
      - "InsurancePolicy INSUFFICIENT -> ACTIVE when the recomputed remaining_coverage_cents >= MIN_COMMERCIAL_COVERAGE_CENTS"
      - "Flight.investigation_status OPEN -> CLOSED"
  - method: POST
    path: "/drone-ops/accident-reports/{id}/withdraw"
    description: "Withdraws a FILED or INVESTIGATING report, releasing the provisional reserve in full. The compensating action for filing."
    roles: [InvestigationOfficer]
    code: 200
    input: ["probable_cause?"]
    output: AccidentReport
    side_effects:
      - "AccidentReport -> WITHDRAWN (terminal); reserved_cents zeroed; settlement_cents stays null"
      - "InsurancePolicy.open_reserved_cents_total decreased by the released reserve and remaining_coverage_cents restored to its pre-filing value with zero drift"
      - "InsurancePolicy INSUFFICIENT -> ACTIVE when the restored remaining_coverage_cents >= MIN_COMMERCIAL_COVERAGE_CENTS"
      - "Flight.investigation_status OPEN -> CLOSED; cancelled flights are NOT resurrected"
      - "Pilot.risk_score recomputed by calculations.pilot_risk_score and Pilot.version incremented"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication and authorization ------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or present but an empty / whitespace-only string"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles - e.g. a Pilot calling POST /drone-ops/airspace-authorizations/{id}/decide, or a SafetyReviewer calling POST /drone-ops/waivers/{id}/decide"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "a Pilot addresses a resource owned by another pilot, or supplies a pilot_id / owner_pilot_id in the body that differs from their own X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the segregated counterpart step: clearing the waiver's safety case before deciding it, or approving the flight's airspace authorization before closing its accident report"
  # --- existence ------------------------------------------------------------
  - id: ERR_PILOT_NOT_FOUND
    http: 404
    condition: "no Pilot with the given id, in the path or in a pilot_id / owner_pilot_id body field"
  - id: ERR_KNOWLEDGE_TEST_NOT_FOUND
    http: 404
    condition: "no KnowledgeTest with the given id"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "no Certification with the given id"
  - id: ERR_AIRCRAFT_NOT_FOUND
    http: 404
    condition: "no Aircraft with the given id, in the path or in an aircraft_id body field"
  - id: ERR_MODULE_NOT_FOUND
    http: 404
    condition: "no RemoteIdModule with the given id"
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "no AirspaceZone with the given id, in the path or in a zone_id body field"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "no AirspaceAuthorization with the given id, in the path or in an authorization_id body field"
  - id: ERR_WAIVER_NOT_FOUND
    http: 404
    condition: "no Waiver with the given id, in the path or in a waiver_id body field"
  - id: ERR_SAFETY_CASE_NOT_FOUND
    http: 404
    condition: "no SafetyCase with the given id"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "no InsurancePolicy with the given id"
  - id: ERR_FLIGHT_NOT_FOUND
    http: 404
    condition: "no Flight with the given id, in the path or in a flight_id body field"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "no AccidentReport with the given id"
  - id: ERR_TFR_NOT_FOUND
    http: 404
    condition: "no TemporaryFlightRestriction with the given id, in the path or in an acknowledged_tfr_ids entry"
  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is missing, an enum value is outside its declared member set, an integer is negative or out of range, a string is blank, more than one of over_people / night_operation / beyond_visual_line_of_sight is set on a single flight, or limit is outside 1..100 or offset is negative"
  - id: ERR_INVALID_WINDOW
    http: 400
    condition: "an interval is not strictly ordered: window_end <= window_start, planned_end <= planned_start, effective_until <= effective_from, or planned_start earlier than the logical clock on flight creation"
  # --- uniqueness -----------------------------------------------------------
  - id: ERR_DUPLICATE_PILOT_EMAIL
    http: 409
    condition: "a Pilot already exists with this email"
  - id: ERR_DUPLICATE_AIRCRAFT_SERIAL
    http: 409
    condition: "the owning pilot already has an Aircraft with this serial_number"
  - id: ERR_DUPLICATE_MODULE_SERIAL
    http: 409
    condition: "the airframe already carries a RemoteIdModule with this module_serial"
  - id: ERR_DUPLICATE_ZONE_DESIGNATOR
    http: 409
    condition: "an AirspaceZone already exists with this designator"
  - id: ERR_DUPLICATE_POLICY_NUMBER
    http: 409
    condition: "the pilot already holds an InsurancePolicy with this policy_number"
  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_ZONE_VERSION
    http: 412
    condition: "expected_zone_version on POST /drone-ops/airspace-authorizations does not equal the zone's current version, because an approval, a revocation or a completion has advanced the zone's occupancy since the client read it"
  - id: ERR_STALE_PILOT_VERSION
    http: 412
    condition: "expected_pilot_version on POST /drone-ops/waivers does not equal the pilot's current version, because a grading, a currency review, a waiver decision, a completed flight or a cascade has advanced the pilot since the client read it"
  # --- state ----------------------------------------------------------------
  - id: ERR_PILOT_INVALID_STATE
    http: 409
    condition: "the pilot is not in a state from which this transition is declared - reinstating a pilot who is not SUSPENDED, revoking a pilot who is not SUSPENDED, or scheduling a knowledge test for a pilot in KNOWLEDGE_PENDING, CERTIFIED or REVOKED"
  - id: ERR_TEST_ALREADY_GRADED
    http: 409
    condition: "grading a KnowledgeTest that is already PASSED or FAILED"
  - id: ERR_AIRCRAFT_INVALID_STATE
    http: 409
    condition: "registering an airframe that is not PENDING_REGISTRATION, grounding one that is not REGISTERED, returning to service one that is not GROUNDED, or acting on a DEREGISTERED airframe"
  - id: ERR_MODULE_INVALID_STATE
    http: 409
    condition: "submitting a module for verification from VERIFICATION_PENDING or VERIFIED, or verifying a module that is not VERIFICATION_PENDING"
  - id: ERR_AUTHORIZATION_INVALID_STATE
    http: 409
    condition: "deciding an authorization that is not REQUESTED, or revoking one that is not APPROVED or ACTIVE"
  - id: ERR_WAIVER_INVALID_STATE
    http: 409
    condition: "a waiver transition attempted from a state the §1.2 machine does not declare - submitting from SUBMITTED or UNDER_REVIEW, beginning review on a DRAFT waiver, requesting revision on a CLEARED waiver, clearing a SUBMITTED waiver, deciding a waiver that is not CLEARED, or attaching a safety case to a waiver that is not DRAFT or REVISION_REQUESTED"
  - id: ERR_POLICY_INVALID_STATE
    http: 409
    condition: "verifying an InsurancePolicy that is not PENDING_VERIFICATION"
  - id: ERR_FLIGHT_INVALID_STATE
    http: 409
    condition: "a flight transition attempted from a state the §1.2 machine does not declare - pre-flight checking a flight that is not PLANNED, launching one that is not PREFLIGHT_CLEARED, completing one that is not IN_PROGRESS, or cancelling a COMPLETED, CANCELLED or IN_PROGRESS flight"
  - id: ERR_PREFLIGHT_NOT_CLEARED
    http: 409
    condition: "launching a PLANNED flight that has no PreflightCheck at all, or whose most recent PreflightCheck result was FAILED"
  - id: ERR_REPORT_INVALID_STATE
    http: 409
    condition: "opening an investigation on a report that is not FILED, requiring remediation on one that is not INVESTIGATING, resuming one that is not REMEDIATION_REQUIRED, closing one that is not INVESTIGATING, or withdrawing a CLOSED or WITHDRAWN report"
  - id: ERR_TFR_INVALID_STATE
    http: 409
    condition: "lifting a TemporaryFlightRestriction that is already LIFTED or EXPIRED"
  - id: ERR_CLOCK_REWIND_FORBIDDEN
    http: 409
    condition: "POST /drone-ops/_clock/set_current_utc with to_iso8601 at or before the current logical clock value"
  # --- pilot eligibility (safety) -------------------------------------------
  - id: ERR_PILOT_SUSPENDED
    http: 409
    condition: "the pilot's status is SUSPENDED or REVOKED and the operation requires an operating pilot"
  - id: ERR_PILOT_NOT_CERTIFIED
    http: 409
    condition: "the pilot's status is UNCERTIFIED, KNOWLEDGE_PENDING or LAPSED and the operation requires status CERTIFIED"
  - id: ERR_PILOT_CURRENCY_LAPSED
    http: 409
    condition: "the pilot's recomputed currency_expires_at is at or before the logical clock, or at or before the flight's planned_end; the pilot is moved CERTIFIED -> LAPSED as part of the rejection"
  - id: ERR_RECREATIONAL_OPERATION_FORBIDDEN
    http: 403
    condition: "a RECREATIONAL pilot attempts a COMMERCIAL flight or a PART107_COMMERCIAL knowledge test, or a COMMERCIAL flight is planned by a pilot whose operator_category is RECREATIONAL"
  # --- aircraft and remote identification (safety) --------------------------
  - id: ERR_AIRCRAFT_NOT_REGISTERED
    http: 409
    condition: "the airframe's registration_status is PENDING_REGISTRATION or DEREGISTERED and the operation requires REGISTERED"
  - id: ERR_AIRCRAFT_GROUNDED
    http: 409
    condition: "the airframe's registration_status is GROUNDED"
  - id: ERR_REMOTE_ID_NOT_VERIFIED
    http: 422
    condition: "the airframe's remote_id_required is true and it has no RemoteIdModule in status VERIFIED - the module is UNVERIFIED, VERIFICATION_PENDING or VERIFICATION_FAILED, or there is no module row at all"
  - id: ERR_REMOTE_ID_EXPIRED
    http: 422
    condition: "the airframe's only VERIFIED module has verified_until at or before the logical clock; the module is moved VERIFIED -> EXPIRED as part of the rejection"
  # --- airspace (safety and constraint) -------------------------------------
  - id: ERR_TFR_ACTIVE
    http: 422
    condition: "an ACTIVE TemporaryFlightRestriction overlaps the flight window on the flight's zone and either declares a total ban (max_permitted_altitude_ft null) or caps altitude below the flight's planned_max_altitude_ft"
  - id: ERR_AUTHORIZATION_REQUIRED
    http: 422
    condition: "the zone's requires_authorization is true and the flight supplies no authorization_id, or the referenced authorization is not APPROVED, or its pilot_id / aircraft_id / zone_id do not match the flight's"
  - id: ERR_AUTHORIZATION_WINDOW_MISMATCH
    http: 422
    condition: "the flight's [planned_start, planned_end] is not contained in the authorization's [window_start, window_end) - planned_start earlier than window_start, or planned_end at or after window_end"
  - id: ERR_ALTITUDE_CEILING_EXCEEDED
    http: 422
    condition: "requested_ceiling_ft exceeds min(zone.class_ceiling_ft, aircraft.max_altitude_ft) on an authorization request, or planned_max_altitude_ft exceeds the flight's effective ceiling (the authorization's granted_ceiling_ft, or BASE_CEILING_FT when the zone needs no authorization)"
  - id: ERR_ZONE_CAPACITY_EXCEEDED
    http: 409
    condition: "approving the authorization would make the count of APPROVED or ACTIVE authorizations overlapping its half-open window reach the zone's max_concurrent_authorizations"
  - id: ERR_AIRCRAFT_SCHEDULE_CONFLICT
    http: 409
    condition: "another PLANNED, PREFLIGHT_CLEARED or IN_PROGRESS Flight on the same airframe lies within AIRCRAFT_TURNAROUND_MINUTES of the requested window, boundaries inclusive"
  # --- waivers and safety cases ---------------------------------------------
  - id: ERR_WAIVER_REQUIRED
    http: 422
    condition: "the flight sets over_people, night_operation or beyond_visual_line_of_sight and supplies no matching APPROVED Waiver of the corresponding waiver_type for the same pilot and airframe, or the waiver's valid_until is at or before planned_end"
  - id: ERR_SAFETY_CASE_MISSING
    http: 422
    condition: "submitting a waiver that has no SafetyCase attached"
  - id: ERR_SAIL_LEVEL_UNACCEPTABLE
    http: 422
    condition: "clearing a safety case whose computed sail_level exceeds MAX_APPROVABLE_SAIL"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "requesting a revision on a waiver whose revision_round already equals MAX_REVISION_ROUNDS, or requiring remediation on a report whose remediation_round already equals MAX_REMEDIATION_ROUNDS"
  # --- certification volume -------------------------------------------------
  - id: ERR_TEST_ATTEMPT_LIMIT
    http: 409
    condition: "the pilot already has MAX_ATTEMPTS_PER_12_MONTHS KnowledgeTest rows whose scheduled_at falls within the trailing 365 days of the logical clock"
  # --- accidents ------------------------------------------------------------
  - id: ERR_ACCIDENT_REPORT_DUPLICATE
    http: 409
    condition: "the flight already has an AccidentReport in FILED, INVESTIGATING, REMEDIATION_REQUIRED or CLOSED; only a WITHDRAWN report frees the flight for a new filing"
  # --- insurance (fiscal) ---------------------------------------------------
  - id: ERR_INSURANCE_NOT_ACTIVE
    http: 402
    condition: "no InsurancePolicy of the pilot is ACTIVE across the requested window - every candidate is PENDING_VERIFICATION, REJECTED, EXPIRED or INSUFFICIENT, or none spans the window"
  - id: ERR_INDEMNIFICATION_NOT_ACCEPTED
    http: 422
    condition: "the selected covering policy has indemnification_clause_accepted false, so commercial work has no client indemnification behind it"
  - id: ERR_INSURANCE_COVERAGE_INSUFFICIENT
    http: 402
    condition: "the selected covering policy's remaining_coverage_cents is below MIN_COMMERCIAL_COVERAGE_CENTS, typically because an open accident reserve has eaten the limit"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Pilot
    description: "The operator. Owns airframes, remote-ID modules, waiver applications with their safety cases, insurance filings, airspace authorization requests and flights. Can read and act only on their own resources."
    identity: "entity_backed:Pilot"
    exclusive_operations:
      - "POST /drone-ops/airspace-authorizations (request controlled-airspace access, carrying expected_zone_version)"
      - "POST /drone-ops/waivers (open a waiver application, carrying expected_pilot_version)"
      - "POST /drone-ops/waivers/{id}/safety-cases"
      - "POST /drone-ops/waivers/{id}/submit"
      - "POST /drone-ops/flights"
      - "POST /drone-ops/flights/{id}/preflight-check"
      - "POST /drone-ops/flights/{id}/launch"
      - "POST /drone-ops/flights/{id}/complete"
    shared_operations:
      - "POST /drone-ops/aircraft and POST /drone-ops/aircraft/{id}/remote-id-modules (shared with ComplianceOfficer)"
      - "POST /drone-ops/remote-id-modules/{id}/submit-verification (shared with ComplianceOfficer)"
      - "POST /drone-ops/insurance-policies (shared with ComplianceOfficer)"
      - "POST /drone-ops/flights/{id}/cancel (shared with ComplianceOfficer)"
      - "POST /drone-ops/accident-reports (shared with InvestigationOfficer)"
      - "all GET reads of their own pilots, knowledge-tests, certifications, aircraft, remote-id-modules, airspace-zones, tfrs, airspace-authorizations, waivers, safety-cases, insurance-policies, flights, preflight-checks and accident-reports"
  - name: ComplianceOfficer
    description: "Certification registrar and airworthiness authority. Registers pilots, schedules and grades knowledge tests, reviews currency, registers and grounds airframes, verifies remote-ID broadcast modules and verifies insurance filings. Holds the suspension power that heads cascade A. Cannot approve airspace, review waivers, decide waivers or investigate accidents."
    identity: "opaque"
    exclusive_operations:
      - "POST /drone-ops/pilots"
      - "POST /drone-ops/pilots/{id}/knowledge-tests"
      - "POST /drone-ops/knowledge-tests/{id}/grade"
      - "POST /drone-ops/pilots/{id}/currency-review"
      - "POST /drone-ops/pilots/{id}/suspend"
      - "POST /drone-ops/pilots/{id}/reinstate"
      - "POST /drone-ops/pilots/{id}/revoke"
      - "POST /drone-ops/aircraft/{id}/register"
      - "POST /drone-ops/aircraft/{id}/ground"
      - "POST /drone-ops/aircraft/{id}/return-to-service"
      - "POST /drone-ops/remote-id-modules/{id}/verify"
      - "POST /drone-ops/insurance-policies/{id}/verify"
    shared_operations:
      - "POST /drone-ops/aircraft, POST /drone-ops/aircraft/{id}/remote-id-modules, POST /drone-ops/remote-id-modules/{id}/submit-verification, POST /drone-ops/insurance-policies (shared with Pilot)"
      - "POST /drone-ops/flights/{id}/cancel (shared with Pilot)"
      - "POST /drone-ops/_clock/set_current_utc (shared with every operator role)"
      - "all GET reads across every pilot's resources"
  - name: AirspaceAuthority
    description: "Publishes airspace zones and temporary flight restrictions and decides controlled-airspace authorization requests, which is where zone slots are consumed and released. Cannot certify pilots, review or decide waivers, or close accident investigations - closing an accident on a flight this officer authorised is blocked by segregation of duties."
    identity: "opaque"
    exclusive_operations:
      - "POST /drone-ops/airspace-zones"
      - "POST /drone-ops/tfrs"
      - "POST /drone-ops/tfrs/{id}/lift"
      - "POST /drone-ops/airspace-authorizations/{id}/decide"
      - "POST /drone-ops/airspace-authorizations/{id}/revoke"
    shared_operations:
      - "POST /drone-ops/_clock/set_current_utc (shared with every operator role)"
      - "GET reads of pilots, certifications, aircraft, airspace-zones, tfrs, airspace-authorizations, waivers, flights and preflight-checks"
  - name: SafetyReviewer
    description: "Reviews waiver safety cases: takes submitted applications under review, sends them back for revision within the revision budget, and clears the safety case, stamping their own user id onto it. Deliberately barred from deciding the waiver they cleared."
    identity: "opaque"
    exclusive_operations:
      - "POST /drone-ops/waivers/{id}/begin-review"
      - "POST /drone-ops/waivers/{id}/request-revision"
      - "POST /drone-ops/waivers/{id}/clear-safety-case"
    shared_operations:
      - "POST /drone-ops/_clock/set_current_utc (shared with every operator role)"
      - "GET reads of pilots, waivers and safety-cases"
  - name: WaiverApprover
    description: "Grants or denies cleared waivers for operations over people, at night or beyond visual line of sight, writing the granted ceiling and the validity window. Cannot review or clear safety cases, and cannot decide a waiver whose safety case they cleared themselves."
    identity: "opaque"
    exclusive_operations:
      - "POST /drone-ops/waivers/{id}/decide"
    shared_operations:
      - "POST /drone-ops/_clock/set_current_utc (shared with every operator role)"
      - "GET reads of pilots, waivers and safety-cases"
  - name: InvestigationOfficer
    description: "Runs post-incident investigation: opens investigations, drives the remediation loop, closes reports with the itemised final settlement and withdraws reports filed in error. Cannot certify pilots, approve airspace or decide waivers, and cannot close a report on a flight whose airspace authorization they approved."
    identity: "opaque"
    exclusive_operations:
      - "POST /drone-ops/accident-reports/{id}/open-investigation"
      - "POST /drone-ops/accident-reports/{id}/require-remediation"
      - "POST /drone-ops/accident-reports/{id}/resume-investigation"
      - "POST /drone-ops/accident-reports/{id}/close"
      - "POST /drone-ops/accident-reports/{id}/withdraw"
    shared_operations:
      - "POST /drone-ops/accident-reports (shared with Pilot)"
      - "POST /drone-ops/_clock/set_current_utc (shared with every operator role)"
      - "GET reads of pilots, aircraft, airspace-zones, airspace-authorizations, insurance-policies, flights, preflight-checks and accident-reports"
