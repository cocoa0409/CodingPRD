      - name: reportable_severity_boundary_probed_below_on_and_above_five_percent
        claim_type: threshold
        grounds:
          - calculations.material_event_severity_and_deadline
          - state_machines.MaterialEvent.UNASSESSED_to_NOT_REPORTABLE
          - state_machines.MaterialEvent.UNASSESSED_to_REPORTABLE
          - validations[priority=29]
          - errors[ERR_EVENT_DETERMINATION_CONFLICT]
          - entities.ReportingCycle.fields.open_material_event_count
        distinguishing_aspect: |
          MATERIALITY_REPORTABLE_PCT is probed on all three sides against a materiality_base_amount of
          10000000: magnitude 499000 gives severity_score 4.99 and MAY be assessed NOT_REPORTABLE,
          magnitude 500000 gives exactly 5.00 and MAY NOT (the test is `>=`, so the boundary value is
          already reportable and the call returns ERR_EVENT_DETERMINATION_CONFLICT), and magnitude 501000
          gives 5.01. The REPORTABLE branch is where current_report_deadline_utc appears: four business
          days after 2026-08-03 (Monday) is 2026-08-07T17:30:00Z, while the NOT_REPORTABLE row keeps
          current_report_deadline_utc null.
        test_recipe:
          setup:
            - "An ADOPTED charter (min_quorum_count 1, required_functions [LEGAL]) with one ACTIVE voting LEGAL member."
            - "A cycle in PLANNING with materiality_base_amount 10000000."
            - "Three MaterialEvent rows on that cycle, all UNASSESSED, all discovered 2026-08-03T09:00:00Z, with magnitude_amount 499000, 500000 and 501000."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Standing Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 1, required_functions: ["LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
