            - "trigger[0] response carries no version and no updated_at field - AppraisalSubmission is declared common_fields false"
            - "trigger[1] returns ERR_DUPLICATE_RECORD (409): one submission per (revaluation_id, appointed_by, round_number)"
            - "after trigger[1] AppraisalSubmission.${sub_id}.appraised_annual_rent_cents is still 14000000 and GET /portfolio/appraisal-submissions?revaluation_id=${reval_id} returns exactly 1 row"

      - name: lease_creation_with_unknown_lessee_id_returns_404
        claim_type: parent_relationships
        grounds:
