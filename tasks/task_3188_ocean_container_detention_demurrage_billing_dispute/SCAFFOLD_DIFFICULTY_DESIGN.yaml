            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${term_oak}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000110", equipment_type: "DRY40", customer_account_id: "${acct_j}", service_contract_id: "${ctr_j}", terminal_id: "${term_oak}", discharge_ts: "2026-08-31T12:00:00Z", available_ts: "2026-09-01T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_j: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_j}/mark-available"
