# =============================================================================
# task_2135 — §1.9 Scaffold Corner Design (breadth coverage index)
# Walks references/claim-extraction-guide.md section by section against
# SCAFFOLD.yaml §1.1–§1.7. Corners already exercised by §1.8 are emitted as
# `excluded_because:` stubs. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: facility_creation_initialises_every_trust_bucket_and_covenant_posture
        claim_type: Creation
        grounds:
          - entities.Facility.fields.trust_lifetime_received_cents
          - entities.Facility.fields.bond_coverage_status
          - endpoints[POST /rac/facilities]
        distinguishing_aspect: "POST /rac/facilities with all required fields returns 201, every trust_* bucket at 0, bond_coverage_status DEFICIENT, overflow_stalls_available equal to overflow_lot_stalls, and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100, overflow_daily_surcharge_cents: 400, remittance_grace_days: 20 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Facility.${fac_id}.trust_lifetime_received_cents == 0 and trust_debt_service_reserve_cents == 0 and trust_debt_service_funded_cents == 0"
            - "Facility.${fac_id}.trust_om_reserve_cents == 0 and trust_capital_fund_cents == 0 and trust_unallocated_cents == 0"
            - "Facility.${fac_id}.trust_encumbered_cents == 0 and trust_disbursed_cents == 0"
            - "Facility.${fac_id}.bond_coverage_status == DEFICIENT"
            - "Facility.${fac_id}.overflow_stalls_allocated == 0 and overflow_stalls_available == 100"
            - "Facility.${fac_id}.funded_obligation_count == 0 and version == 1"
            - "Facility.${fac_id}.current_utc == 2026-08-01T00:00:00Z"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: get_facility_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_FACILITY_NOT_FOUND]
          - validations[priority=4]
          - endpoints[GET /rac/facilities/{facility_id}]
        distinguishing_aspect: "A syntactically valid UUID that matches no Facility row returns HTTP 404 with data.error_id ERR_FACILITY_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /rac/facilities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_FACILITY_NOT_FOUND"
            - "response_type == error"

      - name: create_concessionaire_missing_brand_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /rac/concessionaires]
        distinguishing_aspect: "Omitting the required brand_code field on POST /rac/concessionaires returns HTTP 400 ERR_INVALID_REQUEST and creates no row."
        test_recipe:
          setup: ["One facility exists."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", contact_email: "ops@avex.example" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /rac/concessionaires filtered by facility_id ${fac_id} returns total_count == 0"

      - name: facility_optional_fields_take_declared_defaults_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Facility.fields.overflow_daily_surcharge_cents
          - entities.Facility.fields.remittance_grace_days
          - endpoints[POST /rac/facilities]
        distinguishing_aspect: "Omitting overflow_daily_surcharge_cents and remittance_grace_days yields the declared defaults 0 and 20 respectively, not null."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /rac/facilities"
              payload: { code: "PHX", name: "PHX ConRAC", cfc_rate_per_transaction_day_cents: 600, ds_reserve_requirement_cents: 0, om_reserve_requirement_cents: 0, capital_fund_cap_cents: 1000000, overflow_lot_stalls: 10 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
          assert:
            - "Facility.${fac_id}.overflow_daily_surcharge_cents == 0"
            - "Facility.${fac_id}.remittance_grace_days == 20"
            - "Facility.${fac_id}.bond_coverage_status == SATISFIED because ds_reserve_requirement_cents is 0"

      - name: agreement_creation_zeroes_every_computed_ledger_field
        claim_type: Computed Fields
        grounds:
          - entities.ConcessionAgreement.fields.gross_revenue_ytd_cents
          - entities.ConcessionAgreement.fields.rent_tier
          - endpoints[POST /rac/concession-agreements]
        distinguishing_aspect: "A freshly drafted agreement reports gross_revenue_ytd_cents 0, rent_billed_to_date_cents 0, accepted_report_count 0, rent_tier MAG_FLOOR, contract_status DRAFT and compliance_status COMPLIANT."
        test_recipe:
          setup: ["One facility and one concessionaire exist."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "ops@avex.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
          trigger:
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { agr_id: $.data.id }
          assert:
            - "ConcessionAgreement.${agr_id}.gross_revenue_ytd_cents == 0 and transaction_days_ytd == 0 and accepted_report_count == 0"
            - "ConcessionAgreement.${agr_id}.percentage_rent_accrued_cents == 0 and rent_billed_to_date_cents == 0 and last_installment_cents == 0"
            - "ConcessionAgreement.${agr_id}.rent_tier == MAG_FLOOR and mag_shortfall_cents == 0"
            - "ConcessionAgreement.${agr_id}.contract_status == DRAFT and compliance_status == COMPLIANT"
            - "ConcessionAgreement.${agr_id}.counter_units_assigned == 0 and fleet_stalls_allocated == 0"
            - "Concessionaire.${conc_a_id}.agreement_count == 1"

      - name: agreement_system_fields_are_server_minted_uuid_and_version_one
        claim_type: System Fields
        grounds:
          - entities.ConcessionAgreement.common_fields
          - endpoints[POST /rac/concession-agreements]
        distinguishing_aspect: "id is a bare UUID with no type prefix, created_at and updated_at are ISO 8601 UTC with three fractional digits, and version starts at 1."
        test_recipe:
          setup: ["One facility and one concessionaire exist."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "ops@avex.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
          trigger:
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { agr_id: $.data.id }
          assert:
            - "ConcessionAgreement.${agr_id}.id matches the bare UUID form 8-4-4-4-12 with no prefix"
            - "ConcessionAgreement.${agr_id}.version == 1"
            - "ConcessionAgreement.${agr_id}.created_at and updated_at are ISO 8601 UTC with exactly three fractional digits"

      - name: agreement_invalid_rent_settlement_basis_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - entities.ConcessionAgreement.fields.rent_settlement_basis
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "rent_settlement_basis outside {CUMULATIVE_YTD, MONTHLY_STANDALONE} returns HTTP 400 ERR_INVALID_REQUEST and creates no agreement."
        test_recipe:
          setup: ["One facility and one concessionaire exist."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "ops@avex.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
          trigger:
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "QUARTERLY_BLEND" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /rac/concession-agreements filtered by facility_id ${fac_id} returns total_count == 0"

      - name: concessionaire_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /rac/concessionaires]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three concessionaires at one facility, GET /rac/concessionaires?facility_id=&limit=2&offset=0 returns 2 rows, total_count 3 and has_more true; offset 2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One facility with concessionaires AVX, BUD and CRZ."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "a@x.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Budline Auto Rental", brand_code: "BUD", contact_email: "b@x.example" }
              as: FacilityAdmin
              captures: { conc_b_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Cruzo Cars", brand_code: "CRZ", contact_email: "c@x.example" }
              as: FacilityAdmin
              captures: { conc_c_id: $.data.id }
          trigger:
            - call: "GET /rac/concessionaires"
              payload: { facility_id: "${fac_id}", limit: 2, offset: 0 }
              as: FacilityAdmin
            - call: "GET /rac/concessionaires"
              payload: { facility_id: "${fac_id}", limit: 2, offset: 2 }
              as: FacilityAdmin
          assert:
            - "first call: response_type == array, len(data) == 2, total_count == 3, has_more == true"
            - "second call: len(data) == 1, total_count == 3, has_more == false"
            - "the union of the two pages contains exactly ${conc_a_id}, ${conc_b_id} and ${conc_c_id}"

      - name: pagination_limit_above_maximum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - response_envelope.pagination_defaults
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "limit=101 exceeds the declared maximum of 100 and returns HTTP 400 ERR_INVALID_REQUEST rather than being silently clamped."
        test_recipe:
          setup: ["One facility exists."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "GET /rac/concessionaires"
              payload: { facility_id: "${fac_id}", limit: 101, offset: 0 }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: counter_space_retrieval_returns_exactly_what_was_stored
        claim_type: Retrieval
        grounds:
          - endpoints[GET /rac/counter-spaces/{counter_space_id}]
          - entities.CounterSpace.fields.space_class
        distinguishing_aspect: "GET /rac/counter-spaces/{id} echoes terminal_code, space_label and space_class as stored, with active_assignment_id null and assignment_count 0."
        test_recipe:
          setup: ["One facility with a READY_RETURN space labelled RR-14."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/counter-spaces"
              payload: { facility_id: "${fac_id}", terminal_code: "GT", space_label: "RR-14", space_class: "READY_RETURN" }
              as: FacilityAdmin
              captures: { cs_id: $.data.id }
          trigger:
            - call: "GET /rac/counter-spaces/${cs_id}"
              payload: {}
              as: AuditOfficer
              as_user_id: "aud-1"
          assert:
            - "CounterSpace.${cs_id}.terminal_code == GT and space_label == RR-14 and space_class == READY_RETURN"
            - "CounterSpace.${cs_id}.active_assignment_id == null and assignment_count == 0"
            - "CounterSpace.${cs_id}.facility_id == ${fac_id}"

      - name: shuttle_cost_allocation_rows_are_immutable_and_carry_no_version
        claim_type: Immutability
        grounds:
          - entities.ShuttleCostAllocation.common_fields
          - endpoints[GET /rac/shuttle-cost-allocations/{shuttle_allocation_id}]
        distinguishing_aspect: "ShuttleCostAllocation declares common_fields false, so a fetched line exposes id and created_at but no updated_at and no version, and §1.5 declares no mutating endpoint for it."
        test_recipe:
          setup:
            - "One facility, one ACTIVE agreement with an ACCEPTED 2026-01 report of 1,000 transaction days."
            - "One ShuttleCostPeriod for 2026-01 with total_cost_cents 100,000 on the TRANSACTION_DAYS basis, already ALLOCATED."
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "a@x.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { agr_a_id: $.data.id }
            - call: "POST /rac/concession-agreements/${agr_a_id}/execute"
              payload: {}
              as: FacilityAdmin
            - call: "POST /rac/transaction-day-reports"
              payload: { agreement_id: "${agr_a_id}", period_year: 2026, period_month: 1, reported_gross_revenue_cents: 6000000, reported_on_airport_transaction_days: 1000 }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /rac/transaction-day-reports/${rep_id}/submit"
              payload: {}
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
            - call: "POST /rac/transaction-day-reports/${rep_id}/begin-audit"
              payload: {}
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/transaction-day-reports/${rep_id}/accept"
              payload: { audited_gross_revenue_cents: 6000000, audited_on_airport_transaction_days: 1000 }
              as: AuditOfficer
              as_user_id: "aud-1"
            - call: "POST /rac/shuttle-cost-periods"
              payload: { facility_id: "${fac_id}", period_year: 2026, period_month: 1, total_cost_cents: 100000, allocation_basis: "TRANSACTION_DAYS" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { per_id: $.data.id }
            - call: "POST /rac/shuttle-cost-periods/${per_id}/allocate"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
          trigger:
            - call: "GET /rac/shuttle-cost-allocations"
              payload: { shuttle_period_id: "${per_id}" }
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { line_id: "$.data[0].id" }
          assert:
            - "the list returns total_count == 1"
            - "ShuttleCostAllocation.${line_id}.amount_cents == 100000 and basis_value == 1000 and share_bps == 10000"
            - "ShuttleCostAllocation.${line_id} exposes id and created_at but no updated_at and no version field"
            - "ShuttleCostAllocation.${line_id}.agreement_id == ${agr_a_id} and shuttle_period_id == ${per_id}"

      - name: agreement_with_unknown_concessionaire_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_CONCESSIONAIRE_NOT_FOUND]
          - entities.ConcessionAgreement.fields.concessionaire_id
        distinguishing_aspect: "A flat-topology foreign key that points at no row is rejected at body-FK existence (priority 5) with ERR_CONCESSIONAIRE_NOT_FOUND 404, not with a 400."
        test_recipe:
          setup: ["One facility exists; no concessionaire matches the supplied id."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "00000000-0000-4000-8000-000000000000", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_CONCESSIONAIRE_NOT_FOUND"

      - name: capital_project_with_unknown_predecessor_returns_project_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_PROJECT_NOT_FOUND]
          - entities.CapitalProject.fields.predecessor_project_id
        distinguishing_aspect: "The self-referential predecessor_project_id is validated for existence like any other foreign key: an unknown id returns ERR_PROJECT_NOT_FOUND 404 and no project is created."
        test_recipe:
          setup: ["One facility exists; no capital project matches the supplied predecessor id."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /rac/capital-projects"
              payload: { facility_id: "${fac_id}", project_name: "Phase 2 deck build", budget_cents: 3000000, predecessor_project_id: "00000000-0000-4000-8000-000000000000" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_PROJECT_NOT_FOUND"
            - "GET /rac/capital-projects filtered by facility_id ${fac_id} returns total_count == 0"

  - section: state_machines
    instances:

      - name: execute_an_already_active_agreement_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ConcessionAgreement.DRAFT_to_ACTIVE
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The execute action declares only DRAFT as a from-state; issuing it against an ACTIVE agreement returns HTTP 409 ERR_INVALID_STATE and does not bump the agreement's version."
        test_recipe:
          setup: ["One facility, one concessionaire and one agreement already executed to ACTIVE."]
          setup_api_calls:
            - call: "POST /rac/facilities"
              payload: { code: "DEN", name: "DEN ConRAC", cfc_rate_per_transaction_day_cents: 500, ds_reserve_requirement_cents: 5000000, om_reserve_requirement_cents: 1000000, capital_fund_cap_cents: 50000000, overflow_lot_stalls: 100 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /rac/concessionaires"
              payload: { facility_id: "${fac_id}", legal_name: "Avex Rent A Car", brand_code: "AVX", contact_email: "a@x.example" }
              as: FacilityAdmin
              captures: { conc_a_id: $.data.id }
            - call: "POST /rac/concession-agreements"
              payload: { facility_id: "${fac_id}", concessionaire_id: "${conc_a_id}", contract_year_index: 1, term_start_date: "2026-01-01", term_end_date: "2026-12-31", mag_annual_cents: 12000000, percentage_rent_rate_bps: 1000, rent_settlement_basis: "CUMULATIVE_YTD" }
              as: FacilityAdmin
              captures: { agr_a_id: $.data.id }
            - call: "POST /rac/concession-agreements/${agr_a_id}/execute"
              payload: {}
              as: FacilityAdmin
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /rac/concession-agreements/${agr_a_id}/execute"
              payload: {}
              as: FacilityAdmin
