              as: GroupAdmin
              as_user_id: "${grp_go}"
              captures: { e_occ_grp: "$.data.error_id" }
            - call: "GET /paywall/group-accounts/${grp_go}"
              payload: {}
              as: GroupAdmin
              as_user_id: "${grp_go}"
              captures: { grp_go_v1: "$.data.version" }
            - call: "POST /paywall/group-accounts/${grp_go}/seats"
              payload: { reader_id: "${rd_go_2}", starts_on: "2026-09-02", expected_group_account_version: "${grp_go_v1}" }
              as: GroupAdmin
              as_user_id: "${grp_go}"
              captures: { seat_go_2: "$.data.id" }
          assert:
            - "the replayed invite returns 412 with ${e_occ_grp} == ERR_STALE_GROUP_ACCOUNT_VERSION and not ERR_SEAT_CAPACITY_EXCEEDED"
            - "after the refusal Seat rows on GroupAccount.${grp_go} == 1 and seats_assigned_count == 1"
            - "${grp_go_v1} equals ${grp_go_v0} + 1"
            - "the re-read retry returns 201 with Seat.${seat_go_2}.status == INVITED, and GroupAccount.${grp_go}.seats_assigned_count == 2 with seats_available_count == 1"

      - name: version_increments_once_per_mutating_write_on_the_plan
        claim_type: optimistic_concurrency
        grounds:
          - entities.OfferPlan.fields.version
          - endpoints[POST /paywall/offer-plans/{id}/activate]
          - endpoints[POST /paywall/offer-plans/{id}/price-change]
          - endpoints[POST /paywall/offer-plans/{id}/price-change/notices]
        distinguishing_aspect: "Every mutating write on the plan bumps version by exactly one - create 1, activate 2, price-change 3, notices 4 - while a GET in between bumps nothing, which is what makes the two stale-version guards usable at all."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, empty database."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Versioned", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_vv: "$.data.id", v_create: "$.data.version" }
            - call: "GET /paywall/offer-plans/${plan_vv}"
              payload: {}
              as: RevenueManager
              captures: { v_read: "$.data.version" }
            - call: "POST /paywall/offer-plans/${plan_vv}/activate"
              payload: {}
              as: RevenueManager
              captures: { v_activate: "$.data.version" }
            - call: "POST /paywall/offer-plans/${plan_vv}/price-change"
              payload: { pending_price_cents: 1599, pending_effective_on: "2026-10-05", grandfather_policy: "TENURE_12_CYCLES", expected_offer_plan_version: "${v_activate}" }
              as: RevenueManager
              captures: { v_price: "$.data.version" }
            - call: "POST /paywall/offer-plans/${plan_vv}/price-change/notices"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-9"
              captures: { v_notice: "$.data.version" }
          assert:
            - "${v_create} == 1 and ${v_read} == 1 (the read is side-effect free)"
            - "${v_activate} == 2, ${v_price} == 3, ${v_notice} == 4"
            - "OfferPlan.${plan_vv}.status == ACTIVE, price_change_state == NOTICE_SENT, notice_sent_on == 2026-09-01, notice_sent_by_user_id == officer-9"
            - "OfferPlan.${plan_vv}.standard_price_cents is still 1499 (notices do not move the price)"

      - name: meter_threshold_trips_on_the_nth_distinct_article
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.cross_cutting_complexity_layers
        excluded_because:
          difficulty_instance: boundary_precision_check / meter_allowance_boundary_grants_exactly_four_distinct_articles
          rationale: "That instance walks the meter to its exact allowance, shows the next distinct article blocked and a re-read of an already-metered article still granted."

      - name: final_decline_cascade_propagates_across_entities
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.cross_cutting_complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / final_decline_cascades_five_hops_to_released_credit
          rationale: "All five hops (invoice write-off, dunning FAILED_FINAL, lifecycle CANCELLED_NONPAY, released holds/reclaimed seats, recomputed credit) are asserted there in one response."

      - name: preview_quote_and_billed_amount_are_separate_variants
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.cross_cutting_complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / cycle_price_preview_quote_diverges_from_billed_amount
          rationale: "The divergence of the forward-looking preview_quote from the billed amount on the same subscription is exactly that instance's claim; the second variant pair is covered by engagement_rolling_30d_diverges_from_cohort_normalized."

  # Consistency model: which effects are visible in the writer's own response versus
  # only after the nightly batch reaches the relevant pass.
  - section: consistency_model
    instances:
      - name: cancellation_confirm_effects_readable_without_a_billing_run
        claim_type: immediate
        grounds:
          - consistency_model
          - state_machines.CancellationRequest.INITIATED_to_CONFIRMED
        distinguishing_aspect: "Confirming a cancellation is immediately consistent: the subscription's CANCEL_SCHEDULED lifecycle, access_until, stopped print fulfilment and released future holds are all readable through separate GETs before any billing run executes."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; ACTIVE DIGITAL_ONLY subscription (cycle 1 of 499 paid, paid_through_on 2026-10-01) with one SCHEDULED PAUSE_BILLING hold starting 2026-10-20."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Immediate", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_ic: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_ic}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_ic_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "immediate@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_ic: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_ic}", offer_plan_id: "${plan_ic}", expected_offer_plan_version: "${plan_ic_v}" }
              as: SubscriptionOpsAgent
              captures: { sub_ic: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_ic}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_ic: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_ic}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 499 }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/subscriptions/${sub_ic}/holds"
              payload: { hold_type: "PAUSE_BILLING", start_date: "2026-10-20", end_date: "2026-10-26" }
              as: Reader
              as_user_id: "${rd_ic}"
              captures: { hold_ic: "$.data.id" }
            - call: "POST /paywall/subscriptions/${sub_ic}/cancellation-requests"
              payload: { reason_code: "PRICE" }
              as: Reader
              as_user_id: "${rd_ic}"
              captures: { cr_ic: "$.data.id" }
          trigger:
            - call: "POST /paywall/cancellation-requests/${cr_ic}/confirm"
              payload: {}
              as: Reader
              as_user_id: "${rd_ic}"
              captures: { cr_ic_eff: "$.data.effective_on" }
            - call: "GET /paywall/subscriptions/${sub_ic}"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { sub_ic_life: "$.data.lifecycle_status", sub_ic_until: "$.data.access_until" }
            - call: "GET /paywall/holds/${hold_ic}"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { hold_ic_status: "$.data.status" }
          assert:
            - "${cr_ic_eff} == 2026-10-01 and CancellationRequest.${cr_ic}.confirmed_on == 2026-09-01"
            - "${sub_ic_life} == CANCEL_SCHEDULED and ${sub_ic_until} == 2026-10-01, read back without any billing run"
            - "${hold_ic_status} == RELEASED because the hold starts after access_until"
            - "Subscription.${sub_ic}.print_fulfillment_status == NOT_APPLICABLE for this digital plan, and Reader.${rd_ic}.entitlement_source == SUBSCRIPTION until access_until passes"

      - name: scheduled_cancellation_completes_only_in_the_expiry_pass
        claim_type: eventual
        grounds:
          - consistency_model
          - state_machines.Subscription.CANCEL_SCHEDULED_to_CANCELLED
          - endpoints[POST /paywall/billing-runs]
        distinguishing_aspect: "The terminal step is batch-driven and strictly after the effective date: an EXPIRY_ONLY run at 2026-10-01 leaves the subscription CANCEL_SCHEDULED (cancellations_completed empty), and only the run at 2026-10-02 flips it to CANCELLED - the clock alone never completes it."
        test_recipe:
          setup:
            - "Continue from cancellation_confirm_effects_readable_without_a_billing_run: subscription CANCEL_SCHEDULED with cancel_effective_on 2026-10-01, request CONFIRMED."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Eventual", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_ev: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_ev}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_ev_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "eventual@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_ev: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_ev}", offer_plan_id: "${plan_ev}", expected_offer_plan_version: "${plan_ev_v}" }
              as: SubscriptionOpsAgent
              captures: { sub_ev: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_ev}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_ev: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_ev}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 499 }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/subscriptions/${sub_ev}/cancellation-requests"
              payload: { reason_code: "OTHER" }
              as: Reader
              as_user_id: "${rd_ev}"
              captures: { cr_ev: "$.data.id" }
            - call: "POST /paywall/cancellation-requests/${cr_ev}/confirm"
              payload: {}
              as: Reader
              as_user_id: "${rd_ev}"
          trigger:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "GET /paywall/subscriptions/${sub_ev}"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { ev_life_before: "$.data.lifecycle_status" }
            - call: "POST /paywall/billing-runs"
              payload: { scope: "EXPIRY_ONLY" }
              as: SubscriptionOpsAgent
              captures: { ev_life_same_day: "$.data.cancellations_completed" }
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/billing-runs"
              payload: { scope: "EXPIRY_ONLY" }
              as: SubscriptionOpsAgent
              captures: { ev_completed: "$.data.cancellations_completed" }
            - call: "GET /paywall/subscriptions/${sub_ev}"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { ev_life_after: "$.data.lifecycle_status" }
          assert:
            - "${ev_life_before} == CANCEL_SCHEDULED even though the clock has reached cancel_effective_on 2026-10-01"
            - "${ev_life_same_day} is an empty array (the transition needs clock_date strictly greater than cancel_effective_on)"
            - "${ev_completed} has length 1 and contains ${sub_ev}"
            - "${ev_life_after} == CANCELLED, CancellationRequest.${cr_ev}.status == COMPLETED and Reader.${rd_ev}.entitlement_source == NONE"
            - "no invoice for cycle 2 exists: Invoice rows on Subscription.${sub_ev} == 1 (the EXPIRY_ONLY scope never reached the BILLING pass)"
