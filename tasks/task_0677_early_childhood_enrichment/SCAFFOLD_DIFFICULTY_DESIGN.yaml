scaffold_difficulty_design:

  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_full_cycle_vs_mid_cycle_prorated_membership_domain
        grounds:
          - calculations.membership_cycle_invoice
          - entities.Invoice.fields.total_cents
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: >
          Same membership + same two 2500-cent child lines produce total_cents=9500 under
          the full_cycle variant but total_cents=6499 under the mid_cycle_prorated variant
          (10/30 active days); divergence lives on the Membership/Invoice billing domain.
        test_recipe:
          setup:
            - "One Program (level 0, tuition 2500, age band wide, participation false)."
            - "Family with two ENROLLED_ELIGIBLE children, both ENROLLED RECURRING on a level-0 session billed to one ACTIVE PLUS membership; the membership was never frozen, so renew runs over a full cycle (active_days clamps to CYCLE_DAYS=30 => full tuition, the full_cycle variant). The mid_cycle_prorated counterpart is exercised by combinatorial_formula/prorated_invoice_round_per_line_then_sum_mode_b."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id, prog0_level: $.data.level_index }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Ms. Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 10 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /enrichment/families"
              payload: { account_email: "fam1@x.com", primary_contact_name: "Pat" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "Kid One", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kid1_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "Kid Two", birth_date: "2024-02-01" }
              as: FrontDeskStaff
              captures: { kid2_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "PLUS", cycle_anchor_day: 1 }
              as: FrontDeskStaff
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: FrontDeskStaff
              captures: { mem_v_active: $.data.version }
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kid1_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v0}" }
              as: FrontDeskStaff
              captures: { enr1_id: $.data.id }
            - call: "GET /enrichment/sessions/${sess_id}"
              payload: {}
              as: FrontDeskStaff
              captures: { sess_v1: $.data.version }
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kid2_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v1}" }
              as: FrontDeskStaff
              captures: { enr2_id: $.data.id }
          trigger:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/memberships/${mem_id}/renew"
              payload: {}
              as: FrontDeskStaff
              captures: { inv_full_id: $.data.id, inv_full_total: $.data.total_cents }
          assert:
            - "Invoice.${inv_full_id}.subtotal_cents == 10000"
            - "Invoice.${inv_full_id}.sibling_discount_cents == 500"
            - "Invoice.${inv_full_id}.total_cents == 9500"

      - name: makeup_credit_issuance_vs_redemption_valuation_credit_domain
        grounds:
          - calculations.makeup_credit_valuation
          - state_machines.ClassSession.SCHEDULED_to_CANCELLED
          - entities.MakeupCredit.fields.issued_tuition_cents
        distinguishing_aspect: >
          A credit minted at issued_tuition_cents=2500 (issuance variant) is redeemed onto a
          higher-level target session of tuition 3500: the redemption variant caps coverage at
          min(2500,3500)=2500 with residual_owed_cents=max(0,3500-2500)=1000; divergence lives on
          the MakeupCredit/Program credit-ledger domain, not billing.
        test_recipe:
          setup:
            - "A level-0 session (tuition 2500) is cancelled, minting one AVAILABLE credit (issued_tuition_cents=2500) on the membership."
            - "A level-1 SCHEDULED session of tuition 3500 exists as the redemption target; the child is age-eligible for both (band 6-60), and makeup redemption is exempt from level-match."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds-2500", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { progA_id: $.data.id }
            - call: "POST /enrichment/programs"
              payload: { name: "Beasts-3500", level_index: 1, min_age_months: 6, max_age_months: 60, tuition_cents: 3500, participation_required: false }
              as: StudioAdmin
              captures: { progB_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Ms. Lee", certified_level_indices: [0, 1], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${progA_id}", room_id: "${room_a_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sessA_id: $.data.id, sessA_v0: $.data.version }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${progB_id}", room_id: "${room_a_id}", instructor_id: "${inst_id}", start_at: "2026-05-17T09:00:00Z", end_at: "2026-05-17T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sessB_id: $.data.id, sessB_v0: $.data.version }
            - call: "POST /enrichment/families"
              payload: { account_email: "fam2@x.com", primary_contact_name: "Sam" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "Kid", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kid_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "CORE", cycle_anchor_day: 1 }
              as: FrontDeskStaff
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kid_id}", session_id: "${sessA_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sessA_v0}" }
              as: FrontDeskStaff
              captures: { enrA_id: $.data.id }
            - call: "POST /enrichment/sessions/${sessA_id}/cancel"
              payload: {}
              as: FrontDeskStaff
            - call: "GET /enrichment/sessions/${sessB_id}"
              payload: {}
              as: FrontDeskStaff
              captures: { sessB_v_live: $.data.version }
          trigger:
            - call: "POST /enrichment/enrollments/${enrA_id}/redeem-makeup"
              payload: { target_session_id: "${sessB_id}", expected_session_version: "${sessB_v_live}" }
              as: FrontDeskStaff
              captures: { redeem_enr_id: $.data.id, residual: $.data.residual_owed_cents }
          assert:
            - "Membership.${mem_id}.makeup_credit_balance == 0"
            - "ClassSession.${sessB_id}.enrolled_count == 1"
            - "Enrollment.${redeem_enr_id}.status == ENROLLED"
            - "Enrollment.${redeem_enr_id}.residual_owed_cents == 1000"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes (a) and (b)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sibling_discount_tiered_three_children_mode_a
        grounds:
          - calculations.sibling_discount
          - calculations.membership_cycle_invoice
          - entities.Family.fields.child_count
          - entities.Invoice.fields.sibling_discount_cents
        distinguishing_aspect: >
          Mode (a): the discount is a tiered, >=3-input non-linear formula — three ENROLLED_ELIGIBLE
          children at 4000-cent lines on a PLUS membership select the n==3 rate 0.15 over tuition_only
          12000, yielding sibling_discount_cents=1800 and total_cents=15200.
        test_recipe:
          setup:
            - "PLUS membership with three children, each ENROLLED RECURRING on a level-0 session (tuition 4000)."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 4000, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Ms. Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 10 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /enrichment/families"
              payload: { account_email: "fam3@x.com", primary_contact_name: "Lee" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "A", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kidA_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "B", birth_date: "2024-02-01" }
              as: FrontDeskStaff
              captures: { kidB_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "C", birth_date: "2024-03-01" }
              as: FrontDeskStaff
              captures: { kidC_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "PLUS", cycle_anchor_day: 1 }
              as: FrontDeskStaff
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kidA_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v0}" }
              as: FrontDeskStaff
            - call: "GET /enrichment/sessions/${sess_id}"
              payload: {}
              as: FrontDeskStaff
              captures: { sess_v1: $.data.version }
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kidB_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v1}" }
              as: FrontDeskStaff
            - call: "GET /enrichment/sessions/${sess_id}"
              payload: {}
              as: FrontDeskStaff
              captures: { sess_v2: $.data.version }
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kidC_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v2}" }
              as: FrontDeskStaff
          trigger:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/memberships/${mem_id}/renew"
              payload: {}
              as: FrontDeskStaff
              captures: { inv_id: $.data.id }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 17000"
            - "Invoice.${inv_id}.sibling_discount_cents == 1800"
            - "Invoice.${inv_id}.total_cents == 15200"

      - name: prorated_invoice_round_per_line_then_sum_mode_b
        grounds:
          - calculations.membership_cycle_invoice
          - state_machines.Membership.ACTIVE_to_FROZEN
          - state_machines.Membership.FROZEN_to_ACTIVE
          - entities.Invoice.fields.subtotal_cents
        distinguishing_aspect: >
          Mode (b): rounding ORDER is pinned — two 2500-cent lines prorated at 10/30 round
          per line to 833 each (sum 1666), not round-of-sum 1667; subtotal_cents=6666 proves
          sum-of-rounded was used.
        test_recipe:
          setup:
            - "PLUS membership with two children ENROLLED RECURRING on a level-0 session (tuition 2500)."
            - "Membership frozen, then reactivated 20 days before renew so active_days=10 of CYCLE_DAYS=30."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Ms. Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 10 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /enrichment/families"
              payload: { account_email: "fam4@x.com", primary_contact_name: "Ray" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "A", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kidA_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "B", birth_date: "2024-02-01" }
              as: FrontDeskStaff
              captures: { kidB_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "PLUS", cycle_anchor_day: 1 }
              as: FrontDeskStaff
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kidA_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v0}" }
              as: FrontDeskStaff
            - call: "GET /enrichment/sessions/${sess_id}"
              payload: {}
              as: FrontDeskStaff
              captures: { sess_v1: $.data.version }
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kidB_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v1}" }
              as: FrontDeskStaff
            - call: "POST /enrichment/memberships/${mem_id}/freeze"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-22T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
          trigger:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/memberships/${mem_id}/renew"
              payload: {}
              as: FrontDeskStaff
              captures: { inv_id: $.data.id }
          assert:
            # current_cycle_start reset to 2026-05-22 on reactivation; renew at 2026-06-01 => active_days=10 of CYCLE_DAYS=30.
            # Per-line: round_half_up(2500*10/30)=833 each; sum-of-rounded subtotal_tuition=1666 (round-of-sum would be 1667).
            # subtotal=5000+1666=6666; sibling(n=2)=round(0.10*1666)=167; total=6666-167=6499.
            - "Invoice.${inv_id}.subtotal_cents == 6666"
            - "Invoice.${inv_id}.sibling_discount_cents == 167"
            - "Invoice.${inv_id}.total_cents == 6499"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_active_freeze_reactivate_cycle
        grounds:
          - state_machines.Membership.ACTIVE_to_FROZEN
          - state_machines.Membership.FROZEN_to_ACTIVE
          - entities.Membership.fields.status
        distinguishing_aspect: >
          Cyclic shape on Membership: ACTIVE->FROZEN->ACTIVE returns the same row to ACTIVE,
          and makeup_credit_balance is preserved across the freeze (not reset).
        test_recipe:
          setup:
            - "ACTIVE CORE membership that holds one AVAILABLE makeup credit before freezing."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Ms. Lee", certified_level_indices: [0], buffer_minutes: 15 }
              as: StudioAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /enrichment/sessions"
              payload: { program_id: "${prog0_id}", room_id: "${room_a_id}", instructor_id: "${inst_id}", start_at: "2026-05-10T09:00:00Z", end_at: "2026-05-10T10:00:00Z", capacity: 5 }
              as: FrontDeskStaff
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /enrichment/families"
              payload: { account_email: "fam5@x.com", primary_contact_name: "Jo" }
              as: FrontDeskStaff
              captures: { fam_id: $.data.id }
            - call: "POST /enrichment/children"
              payload: { family_id: "${fam_id}", full_name: "Kid", birth_date: "2024-01-01" }
              as: FrontDeskStaff
              captures: { kid_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${fam_id}", tier: "CORE", cycle_anchor_day: 1 }
              as: FrontDeskStaff
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /enrichment/enrollments"
              payload: { child_id: "${kid_id}", session_id: "${sess_id}", membership_id: "${mem_id}", kind: "RECURRING", expected_session_version: "${sess_v0}" }
              as: FrontDeskStaff
            - call: "POST /enrichment/sessions/${sess_id}/cancel"
              payload: {}
              as: FrontDeskStaff
            - call: "POST /enrichment/memberships/${mem_id}/freeze"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
          trigger:
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
              captures: { mem_status: $.data.status }
          assert:
            - "Membership.${mem_id}.status == ACTIVE"
            - "Membership.${mem_id}.makeup_credit_balance == 1"

      - name: enrollment_enrolled_waitlisted_promote_cycle
        grounds:
          - state_machines.Enrollment.ENROLLED_to_WAITLISTED
          - state_machines.Enrollment.WAITLISTED_to_ENROLLED
          - state_machines.Enrollment.ENROLLED_to_CANCELLED
          - entities.Enrollment.fields.waitlist_seq
        distinguishing_aspect: >
          Cyclic shape on Enrollment (a different entity from Membership): a WAITLISTED row is
          promoted back to ENROLLED when the occupant cancels, exercising the ENROLLED<->WAITLISTED loop.
        test_recipe:
          setup:
            - "Capacity-1 level-0 session with one ENROLLED child and a second child WAITLISTED behind it."
          setup_api_calls:
            - call: "POST /enrichment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /enrichment/programs"
              payload: { name: "Birds", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500, participation_required: false }
              as: StudioAdmin
              captures: { prog0_id: $.data.id }
            - call: "POST /enrichment/rooms"
              payload: { name: "Room A", physical_capacity: 12 }
              as: StudioAdmin
              captures: { room_a_id: $.data.id }
            - call: "POST /enrichment/instructors"
              payload: { full_name: "Ms. Lee", certified_level_indices: [0], buffer_minutes: 15 }
