          tier: PLUS
        as: ClubAdmin
        captures:
          ma_id: $.data.id
          ma_v: $.data.version
      - call: POST /members/${ma_id}/dues-payments
        payload:
          amount_cents: 9000
          term_years: 1
          expected_member_version: ${ma_v}
        as: ClubAdmin
