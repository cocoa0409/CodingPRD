          setup:
            - "The CHAIN-Y fixture funded: tower T4, tenant BBB's amendment am_b EXECUTED at 1600 load units, tenant AAA's app_a MODIFICATION_REQUIRED and quoted at 20000000 cents, tenant CCC's app_c in review."
