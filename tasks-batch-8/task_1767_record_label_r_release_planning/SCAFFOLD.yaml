# =============================================================================
# PRD Benchmark Seed Tables — Record Label A&R & Release Planning
# =============================================================================

scenario: |
  Record Label A&R & Release Planning (independent record label): artist scouting & deal structure (advance/royalty/recoupment), recording budget & studio delivery milestones, release calendar & marketing beat plan, single/album asset delivery to distributors, playlist/radio promotion campaign tracking, tour support & recoupable expense accounting, royalty statement & artist portal, option pickup & contract term

domain_name: record-label-release-planning
api_prefix: /api

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation        # advances, recoupment waterfall, royalty statements, provisional-vs-final
  secondary_archetype: workflow_orchestration     # recording -> assets -> delivery -> live pipeline with gated stages
  complexity_layers:
    - dual_variant_calculation    # provisional vs final royalty statement; MASTER_ONLY vs CROSS_COLLATERALIZED recoupment
    - cascading_side_effects      # track block -> release asset revert -> distribution unschedule -> delivery cancel; finalize run -> statements -> waterfall -> payout flip
    - optimistic_concurrency      # OCC on DealMemo / RecordingProject / RoyaltyStatement versions
    - rate_threshold_triggers     # tiered royalty rates at cumulative-unit thresholds; budget posture at 85%
  entity_topology: flat                           # peer resources joined by FKs; nested paths only for create-under-parent and reverse-lookup GETs
  state_machine_shape: cyclic                     # DealMemo PROPOSED<->COUNTERED; Contract ACTIVE->OPTION_WINDOW->EXTENDED->OPTION_WINDOW; Release carries parallel asset x distribution dimensions
  relationship_patterns:
    - one_to_many        # Contract -> projects/releases/tour-supports; Project -> milestones/tracks; Release -> beats/campaigns/deliveries
    - self_referential   # Track.version_of_track_id (radio edit / remix lineage)
    - cross_aggregate    # RevenueReport -> Distributor + Release; RoyaltyStatement -> RoyaltyRun + Contract
  role_model: approval_chain                      # AnRManager proposes -> LabelAdmin approves/executes -> FinanceController funds; segregation-of-duties on tour funding
  consistency_model: immediate                    # all side effects atomic within the triggering request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Label
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Label display name" }
      - { name: advance_cap_cents, type: integer, source: input, default: 5000000, description: "Maximum advance_cents allowed on any executed deal memo" }
      - { name: reserve_rate_bps, type: integer, source: input, default: 1000, description: "Provisional-statement reserve in basis points of (royalty_earned - projected_recoupment)" }
      - { name: sign_threshold_score, type: number, source: input, default: 40.0, description: "Minimum scouting_score required to propose a deal memo" }
      - { name: option_window_days, type: integer, source: input, default: 90, description: "Days before current_term_end_date during which an option may be exercised" }
      - { name: release_lead_days, type: integer, source: input, default: 21, description: "Minimum days between schedule date and release_date (inclusive boundary)" }
      - { name: beat_pre_release_days, type: integer, source: input, default: 42, description: "Beats may start no earlier than release_date minus this many days" }
      - { name: beat_post_release_days, type: integer, source: input, default: 30, description: "Beats must end no later than release_date plus this many days" }
      - { name: campaign_gap_days, type: integer, source: input, default: 7, description: "Minimum gap in days between two non-KILLED promo campaigns on the same release+channel" }
      - { name: genre_multipliers, type: object, source: input, default: "{POP: 1.10, HIPHOP: 1.05, ROCK: 1.00, ELECTRONIC: 0.95, OTHER: 0.90}", description: "Scouting-score multiplier per genre" }
      - { name: channel_deduction_bps, type: object, source: input, default: "{STREAMING: 3000, DOWNLOAD: 1500, PHYSICAL: 2500, SYNC: 0}", description: "Distribution/channel deduction in basis points applied to gross revenue per line" }
      - { name: tier_thresholds, type: array, source: input, default: "[{units: 0, delta_bps: 0}, {units: 500000, delta_bps: 200}, {units: 2000000, delta_bps: 300}]", description: "Marginal royalty-rate escalations by cumulative units; a unit at position strictly greater than threshold earns the delta" }
      - { name: tour_category_caps_bps, type: object, source: input, default: "{TRAVEL: 5000, LODGING: 3000, PRODUCTION: 4000, MISC: 1000}", description: "Per-category cap as basis points of the tour support approved_budget_cents" }

  - name: Artist
    parent: Label
    common_fields: true
    fields:
      - { name: label_id, type: string, source: input, description: "FK -> Label.id; owning label" }
      - { name: stage_name, type: string, source: input, description: "Artist stage name" }
      - { name: genre, type: enum, source: input, description: "POP | HIPHOP | ROCK | ELECTRONIC | OTHER" }
      - { name: birth_date, type: string, source: input, description: "YYYY-MM-DD; drives the minor/guardian rule at deal execution" }
      - { name: monthly_streams, type: integer, source: input, description: "Scouting metric: trailing monthly streams" }
      - { name: social_followers, type: integer, source: input, description: "Scouting metric: total social followers" }
      - { name: engagement_rate, type: number, source: input, description: "Scouting metric in [0,1]" }
      - { name: live_draw_avg, type: integer, source: input, description: "Scouting metric: average headline draw" }
      - { name: scouting_score, type: number, source: computed, description: "Weighted scouting score, 1 decimal, clamped [0,100]; see scouting_score calculation" }
      - { name: status, type: enum, source: system, description: "SCOUTED | IN_NEGOTIATION | SIGNED | ACTIVE | HIATUS | DROPPED" }
      - { name: pre_hiatus_status, type: enum, source: system, default: null, description: "SIGNED | ACTIVE recorded when entering HIATUS; reactivate restores it" }

  - name: DealMemo
    parent: Artist
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: system, description: "FK -> Artist.id; artist under negotiation" }
      - { name: advance_cents, type: integer, source: input, description: "Proposed advance; >= 0; label advance_cap_cents enforced at propose/execute" }
      - { name: base_royalty_rate_bps, type: integer, source: input, description: "Base royalty rate in basis points, 1000..3000" }
      - { name: recoupment_scope, type: enum, source: input, description: "MASTER_ONLY | CROSS_COLLATERALIZED; selects waterfall bucket eligibility" }
      - { name: promo_costs_recoupable, type: boolean, source: input, description: "Whether promo campaign spend debits the promo recoupment bucket" }
      - { name: options_total, type: integer, source: input, description: "Number of label options, 0..3" }
      - { name: option_term_months, type: integer, source: input, description: "Months added per exercised option: 12 | 24" }
      - { name: option_escalation_bps, type: integer, source: input, description: "Royalty basis-point escalation added per exercised option" }
      - { name: term_months, type: integer, source: input, description: "Initial term: 12 | 24 | 36" }
      - { name: valid_until_date, type: string, source: input, description: "YYYY-MM-DD; memo auto-expires after this date" }
      - { name: guardian_name, type: string, source: input, default: null, description: "Required at execute when artist is under 18" }
      - { name: guardian_email, type: string, source: input, default: null, description: "Required at execute when artist is under 18" }
      - { name: round_count, type: integer, source: system, default: 0, description: "Negotiation rounds; +1 on every counter" }
      - { name: contract_id, type: string, source: system, default: null, description: "FK -> Contract.id; set when EXECUTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | COUNTERED | APPROVED | EXECUTED | REJECTED | EXPIRED" }

  - name: Contract
    parent: Artist
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: system, description: "FK -> Artist.id" }
      - { name: deal_memo_id, type: string, source: system, description: "FK -> DealMemo.id; source memo" }
      - { name: advance_cents, type: integer, source: system, description: "Copied from executed memo" }
      - { name: base_royalty_rate_bps, type: integer, source: system, description: "Copied from executed memo" }
      - { name: recoupment_scope, type: enum, source: system, description: "MASTER_ONLY | CROSS_COLLATERALIZED; copied from memo" }
      - { name: promo_costs_recoupable, type: boolean, source: system, description: "Copied from memo" }
      - { name: options_total, type: integer, source: system, description: "Copied from memo" }
      - { name: options_exercised, type: integer, source: system, default: 0, description: "+1 per exercise-option" }
      - { name: option_escalation_bps, type: integer, source: system, description: "Copied from memo" }
      - { name: option_term_months, type: integer, source: system, description: "Copied from memo" }
      - { name: term_start_date, type: string, source: system, description: "YYYY-MM-DD of execution (logical clock)" }
      - { name: current_term_end_date, type: string, source: system, description: "term_start + term_months, then += option_term_months per exercise" }
      - { name: advance_status, type: enum, source: system, description: "PENDING | FUNDED; FUNDED immediately at execute when advance_cents == 0, else via disburse-advance" }
      - { name: effective_base_rate_bps, type: integer, source: computed, description: "min(base_royalty_rate_bps + options_exercised * option_escalation_bps, 3000)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OPTION_WINDOW | EXTENDED | EXPIRED | TERMINATED" }

  - name: RecoupmentAccount
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id; 1:1, created at deal execution" }
      - { name: recording_balance_cents, type: integer, source: system, default: 0, description: "Unrecouped recording (milestone) costs" }
      - { name: advance_balance_cents, type: integer, source: system, default: 0, description: "Unrecouped advance" }
      - { name: tour_support_balance_cents, type: integer, source: system, default: 0, description: "Unrecouped approved tour expenses" }
      - { name: promo_balance_cents, type: integer, source: system, default: 0, description: "Unrecouped recoupable promo spend" }
      - { name: total_unrecouped_cents, type: integer, source: computed, description: "Sum of the four bucket balances" }
      - { name: total_recouped_cents, type: integer, source: system, default: 0, description: "Lifetime recouped via royalty waterfalls" }
      - { name: writeoff_cents, type: integer, source: system, default: 0, description: "Amount written off at contract termination" }
      - { name: payout_status, type: enum, source: system, description: "RECOUPING | EARNING; flips to EARNING when total_unrecouped_cents reaches 0 via a waterfall" }

  - name: RecordingProject
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: title, type: string, source: input, description: "Working title" }
      - { name: project_type, type: enum, source: input, description: "SINGLE | EP | ALBUM" }
      - { name: budget_cents, type: integer, source: input, description: "Recording budget ceiling; amendable while not DELIVERED/CANCELLED" }
      - { name: spent_cents, type: integer, source: system, default: 0, description: "Sum of PAID milestone payments" }
      - { name: committed_cents, type: integer, source: system, default: 0, description: "Sum of APPROVED-but-unpaid milestone payments" }
      - { name: budget_posture, type: enum, source: computed, description: "WITHIN_BUDGET | AT_RISK; AT_RISK when spent+committed >= 85% of budget_cents (inclusive)" }
      - { name: status, type: enum, source: system, description: "PLANNED | RECORDING | POST_PRODUCTION | DELIVERED | CANCELLED" }

  - name: RecordingMilestone
    parent: RecordingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> RecordingProject.id" }
      - { name: name, type: string, source: input, description: "Milestone name (e.g., 'drum tracking complete')" }
      - { name: sequence, type: integer, source: input, description: "Ordering within project; unique per project among non-CANCELLED milestones" }
      - { name: due_date, type: string, source: input, description: "YYYY-MM-DD deliverable due date" }
      - { name: payment_cents, type: integer, source: input, description: "Amount paid on approval; > 0" }
      - { name: deliverable_note, type: string, source: input, default: null, description: "Optional note attached at submit" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the LabelAdmin who approved" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | APPROVED | REJECTED | PAID | CANCELLED" }

  - name: Track
    parent: RecordingProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> RecordingProject.id" }
      - { name: title, type: string, source: input, description: "Track title" }
      - { name: duration_seconds, type: integer, source: input, description: "> 0" }
      - { name: isrc, type: string, source: input, description: "Recording code; unique per label across all tracks" }
      - { name: contains_sample, type: boolean, source: input, default: false, description: "True when the master contains a third-party sample" }
      - { name: clearance_ref, type: string, source: input, default: null, description: "Sample clearance reference; required to reach CLEARED when contains_sample" }
      - { name: version_of_track_id, type: string, source: input, default: null, description: "FK -> Track.id; self-referential lineage for radio edits/remixes; must be a track of the same label" }
      - { name: status, type: enum, source: system, description: "DEMO | TRACKED | MIXED | MASTERED | CLEARED | BLOCKED" }

  - name: Release
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: project_id, type: string, source: input, description: "FK -> RecordingProject.id; primary project the release draws from" }
      - { name: title, type: string, source: input, description: "Release title" }
      - { name: release_type, type: enum, source: input, description: "SINGLE | ALBUM; SINGLE requires exactly one track" }
      - { name: release_date, type: string, source: input, description: "YYYY-MM-DD commercial date" }
      - { name: track_ids, type: array, source: input, description: "Member track ids; every track must belong to a project of the same contract and be in MIXED/MASTERED/CLEARED at creation" }
      - { name: went_live_date, type: string, source: system, default: null, description: "YYYY-MM-DD set at first go-live" }
      - { name: asset_status, type: enum, source: system, description: "DRAFT | ASSEMBLED | LOCKED; independent state dimension" }
      - { name: distribution_status, type: enum, source: system, description: "PLANNED | SCHEDULED | DELIVERED | LIVE | TAKEN_DOWN | CANCELLED; independent state dimension" }

  - name: Distributor
    parent: Label
    common_fields: true
    fields:
      - { name: label_id, type: string, source: input, description: "FK -> Label.id" }
      - { name: name, type: string, source: input, description: "Distributor name" }
      - { name: channel_type, type: enum, source: input, description: "DSP | PHYSICAL | RADIO" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Inactive distributors reject new deliveries" }

  - name: AssetDelivery
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: system, description: "FK -> Release.id" }
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id; at most one non-terminal delivery per (release, distributor)" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "+1 on each transmit" }
      - { name: status, type: enum, source: system, description: "QUEUED | TRANSMITTED | ACKNOWLEDGED | REJECTED | CANCELLED" }

  - name: MarketingBeat
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: system, description: "FK -> Release.id" }
      - { name: beat_type, type: enum, source: input, description: "TEASER | SINGLE_DROP | VIDEO | PRESS | TOUR_ANNOUNCE" }
      - { name: channel, type: enum, source: input, description: "PLAYLIST | RADIO | SOCIAL | PRESS" }
      - { name: start_date, type: string, source: input, description: "YYYY-MM-DD; half-open window start" }
      - { name: end_date, type: string, source: input, description: "YYYY-MM-DD; half-open window end (exclusive); must be > start_date" }
      - { name: budget_cents, type: integer, source: input, description: "Planned spend; >= 0" }
      - { name: impressions, type: integer, source: system, default: null, description: "Set at measure" }
      - { name: engagement_score, type: number, source: system, default: null, description: "Set at measure" }
      - { name: status, type: enum, source: system, description: "PLANNED | READY | EXECUTED | MEASURED | SKIPPED | CANCELLED" }

  - name: PromoCampaign
    parent: Release
    common_fields: true
    fields:
      - { name: release_id, type: string, source: system, description: "FK -> Release.id" }
      - { name: channel, type: enum, source: input, description: "PLAYLIST | RADIO" }
      - { name: start_date, type: string, source: input, description: "YYYY-MM-DD; closed interval start" }
      - { name: end_date, type: string, source: input, description: "YYYY-MM-DD; closed interval end (inclusive); must be >= start_date" }
      - { name: spend_cap_cents, type: integer, source: input, description: "Max cumulative spend; > 0" }
      - { name: spend_cents, type: integer, source: system, default: 0, description: "Cumulative recorded spend" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | COMPLETED | KILLED" }

  - name: TourSupport
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: tour_name, type: string, source: input, description: "Tour identifier" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Artist-requested support; > 0" }
      - { name: approved_budget_cents, type: integer, source: system, default: null, description: "Set at approve; must be <= requested_amount_cents" }
      - { name: advanced_amount_cents, type: integer, source: system, default: null, description: "Cash advanced at advance-funds; <= approved_budget_cents" }
      - { name: approved_expense_total_cents, type: integer, source: system, default: 0, description: "Sum of APPROVED expense amounts (net of voids)" }
      - { name: unspent_returned_cents, type: integer, source: system, default: null, description: "max(0, advanced - approved_expense_total) computed at reconcile" }
      - { name: approved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of approving LabelAdmin" }
      - { name: funded_by_user_id, type: string, source: system, default: null, description: "X-User-ID of FinanceController advancing funds; must differ from approver" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | DECLINED | ADVANCED | RECONCILED | CLOSED | CANCELLED" }

  - name: TourExpense
    parent: TourSupport
    common_fields: true
    fields:
      - { name: tour_support_id, type: string, source: system, description: "FK -> TourSupport.id" }
      - { name: category, type: enum, source: input, description: "TRAVEL | LODGING | PRODUCTION | MISC" }
      - { name: amount_cents, type: integer, source: input, description: "> 0" }
      - { name: expense_date, type: string, source: input, description: "YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | VOIDED" }

  - name: RevenueReport
    parent: Label
    common_fields: false
    fields:
      - { name: label_id, type: string, source: input, description: "FK -> Label.id" }
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id" }
      - { name: release_id, type: string, source: input, description: "FK -> Release.id; release distribution_status must be DELIVERED, LIVE, or TAKEN_DOWN" }
      - { name: period, type: string, source: input, description: "Royalty period 'YYYY-Qn' (n in 1..4); lexicographic order equals chronological order" }
      - { name: channel, type: enum, source: input, description: "STREAMING | DOWNLOAD | PHYSICAL | SYNC" }
      - { name: units, type: integer, source: input, description: "Streams/downloads/units; > 0; feeds cumulative-unit royalty tiers" }
      - { name: gross_revenue_cents, type: integer, source: input, description: "> 0; append-only once created" }
      - { name: note, type: string, source: input, default: null, description: "Optional ingest note" }

  - name: RoyaltyRun
    parent: Label
    common_fields: true
    fields:
      - { name: label_id, type: string, source: system, description: "FK -> Label.id" }
      - { name: period, type: string, source: input, description: "'YYYY-Qn'; unique per label" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | CALCULATED | FINALIZED | PAID" }

  - name: RoyaltyStatement
    parent: RoyaltyRun
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> RoyaltyRun.id" }
      - { name: contract_id, type: string, source: system, description: "FK -> Contract.id" }
      - { name: period, type: string, source: system, description: "Copied from run" }
      - { name: gross_revenue_cents, type: integer, source: system, description: "Sum of eligible report gross for this contract's releases in the period" }
      - { name: net_revenue_cents, type: integer, source: system, description: "Sum of per-line rounded net revenue" }
      - { name: royalty_earned_cents, type: integer, source: system, description: "Sum of per-line rounded line royalties (tiered marginal rates; SYNC lines at flat 50%)" }
      - { name: projected_recoupment_cents, type: integer, source: system, description: "Waterfall projection computed at calculate; does not mutate buckets" }
      - { name: recoupment_applied_cents, type: integer, source: system, default: 0, description: "Waterfall actually applied at finalize; mutates buckets" }
      - { name: reserve_held_cents, type: integer, source: system, description: "Provisional reserve = reserve_rate_bps x (royalty_earned - projected_recoupment); zeroed at finalize" }
      - { name: adjustment_cents, type: integer, source: system, default: 0, description: "Sum of manual adjustments (signed); added AFTER reserve computation" }
      - { name: net_payable_cents, type: integer, source: computed, description: "PROVISIONAL: earned - projected - reserve + adjustment; FINAL/DISPUTED/PAID: earned - applied + adjustment" }
      - { name: dispute_note, type: string, source: system, default: null, description: "Artist's note recorded at dispute" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | DISPUTED | PAID" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Artist
    initial_state: SCOUTED
    terminal_states: [DROPPED]
    transitions:
      - { from: SCOUTED, to: IN_NEGOTIATION, trigger: "side effect of POST /api/deal-memos/{id}/propose (first open memo)", actor: system, preconditions: [], side_effects: [] }
      - { from: IN_NEGOTIATION, to: SCOUTED, trigger: "side effect of memo reject or sweep-expiry when no other open memo and no contract exists", actor: system, preconditions: ["No other DealMemo of this artist in DRAFT/PROPOSED/COUNTERED/APPROVED", "No Contract exists for this artist"], side_effects: [] }
      - { from: IN_NEGOTIATION, to: SIGNED, trigger: "side effect of POST /api/deal-memos/{id}/execute", actor: system, preconditions: [], side_effects: [] }
      - { from: SIGNED, to: ACTIVE, trigger: "side effect of first POST /api/releases/{id}/go-live on a release of this artist's contract", actor: system, preconditions: [], side_effects: [] }
      - { from: SIGNED, to: HIATUS, trigger: "POST /api/artists/{id}/hiatus", actor: AnRManager, preconditions: [], side_effects: ["pre_hiatus_status = SIGNED"] }
      - { from: ACTIVE, to: HIATUS, trigger: "POST /api/artists/{id}/hiatus", actor: AnRManager, preconditions: [], side_effects: ["pre_hiatus_status = ACTIVE"] }
      - { from: HIATUS, to: SIGNED, trigger: "POST /api/artists/{id}/reactivate", actor: AnRManager, preconditions: ["pre_hiatus_status == SIGNED"], side_effects: ["pre_hiatus_status = null"] }
      - { from: HIATUS, to: ACTIVE, trigger: "POST /api/artists/{id}/reactivate", actor: AnRManager, preconditions: ["pre_hiatus_status == ACTIVE"], side_effects: ["pre_hiatus_status = null"] }
      - { from: SIGNED, to: DROPPED, trigger: "POST /api/artists/{id}/drop", actor: LabelAdmin, preconditions: ["Every Contract of this artist is EXPIRED or TERMINATED (ERR_INVALID_STATE)"], side_effects: [] }
      - { from: ACTIVE, to: DROPPED, trigger: "POST /api/artists/{id}/drop", actor: LabelAdmin, preconditions: ["Every Contract of this artist is EXPIRED or TERMINATED (ERR_INVALID_STATE)"], side_effects: [] }
      - { from: HIATUS, to: DROPPED, trigger: "POST /api/artists/{id}/drop", actor: LabelAdmin, preconditions: ["Every Contract of this artist is EXPIRED or TERMINATED (ERR_INVALID_STATE)"], side_effects: [] }

  - entity: DealMemo
    initial_state: DRAFT
    terminal_states: [EXECUTED, REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /api/deal-memos/{id}/propose"
        actor: AnRManager
        preconditions:
          - "Not expired: today <= valid_until_date, else memo -> EXPIRED and ERR_DEAL_MEMO_EXPIRED"
          - "Artist status in {SCOUTED, IN_NEGOTIATION, SIGNED, ACTIVE} (ERR_ARTIST_NOT_SIGNABLE)"
          - "No other memo of this artist in DRAFT/PROPOSED/COUNTERED/APPROVED (ERR_DEAL_MEMO_ALREADY_OPEN)"
          - "artist.scouting_score >= label.sign_threshold_score (ERR_SCOUTING_SCORE_TOO_LOW)"
        side_effects: ["Artist SCOUTED -> IN_NEGOTIATION when artist was SCOUTED; SIGNED/ACTIVE unchanged", "increments DealMemo.version by 1"]
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /api/deal-memos/{id}/counter"
        actor: AnRManager | ArtistPortal
        preconditions:
          - "expected_deal_memo_version == DealMemo.version (ERR_STALE_VERSION, 412)"
          - "Not expired: today <= valid_until_date, else memo -> EXPIRED and ERR_DEAL_MEMO_EXPIRED"
          - "ArtistPortal caller must own memo's artist (ERR_ARTIST_OWNERSHIP_MISMATCH)"
        side_effects: ["round_count += 1", "supplied term fields overwrite prior values", "increments DealMemo.version by 1"]
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /api/deal-memos/{id}/counter"
        actor: AnRManager | ArtistPortal
        preconditions:
          - "expected_deal_memo_version == DealMemo.version (ERR_STALE_VERSION, 412)"
          - "Not expired: today <= valid_until_date, else memo -> EXPIRED and ERR_DEAL_MEMO_EXPIRED"
          - "ArtistPortal caller must own memo's artist (ERR_ARTIST_OWNERSHIP_MISMATCH)"
        side_effects: ["round_count += 1", "supplied term fields overwrite prior values", "increments DealMemo.version by 1"]
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /api/deal-memos/{id}/approve"
        actor: LabelAdmin
        preconditions: ["Not expired: today <= valid_until_date, else memo -> EXPIRED and ERR_DEAL_MEMO_EXPIRED"]
        side_effects: []
      - from: COUNTERED
        to: APPROVED
        trigger: "POST /api/deal-memos/{id}/approve"
        actor: LabelAdmin
        preconditions: ["Not expired: today <= valid_until_date, else memo -> EXPIRED and ERR_DEAL_MEMO_EXPIRED"]
        side_effects: []
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /api/deal-memos/{id}/execute"
        actor: LabelAdmin
        preconditions:
          - "Not expired: today <= valid_until_date, else memo -> EXPIRED and ERR_DEAL_MEMO_EXPIRED"
          - "Guardian rule: if artist under 18 at today, guardian_name and guardian_email required on memo (ERR_GUARDIAN_CONSENT_REQUIRED)"
          - "advance_cents <= label.advance_cap_cents (ERR_ADVANCE_CAP_EXCEEDED)"
        side_effects:
          - "Create Contract (ACTIVE; term_start_date = today; current_term_end_date = today + term_months; terms copied from memo)"
          - "Create RecoupmentAccount 1:1 for the contract (all buckets 0, RECOUPING)"
          - "Contract.advance_status = FUNDED when advance_cents == 0, else PENDING"
          - "Artist IN_NEGOTIATION -> SIGNED"
          - "memo.contract_id set"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /api/deal-memos/{id}/reject"
        actor: AnRManager
        preconditions: []
        side_effects: ["Artist IN_NEGOTIATION -> SCOUTED when no other open memo and no contract"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /api/deal-memos/{id}/reject"
        actor: AnRManager
        preconditions: []
        side_effects: ["Artist IN_NEGOTIATION -> SCOUTED when no other open memo and no contract"]
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /api/deal-memos/{id}/reject"
        actor: AnRManager
        preconditions: []
        side_effects: ["Artist IN_NEGOTIATION -> SCOUTED when no other open memo and no contract"]
      - from: DRAFT
        to: EXPIRED
        trigger: "POST /api/labels/{id}/ops/sweep (today > valid_until_date) or lazily on any guarded transition attempt"
        actor: LabelAdmin | system
        preconditions: ["today > valid_until_date"]
        side_effects: ["Artist IN_NEGOTIATION -> SCOUTED when no other open memo and no contract"]
      - from: PROPOSED
        to: EXPIRED
        trigger: "POST /api/labels/{id}/ops/sweep (today > valid_until_date) or lazily on any guarded transition attempt"
        actor: LabelAdmin | system
        preconditions: ["today > valid_until_date"]
        side_effects: ["Artist IN_NEGOTIATION -> SCOUTED when no other open memo and no contract"]
      - from: COUNTERED
        to: EXPIRED
        trigger: "POST /api/labels/{id}/ops/sweep (today > valid_until_date) or lazily on any guarded transition attempt"
        actor: LabelAdmin | system
        preconditions: ["today > valid_until_date"]
        side_effects: ["Artist IN_NEGOTIATION -> SCOUTED when no other open memo and no contract"]
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /api/labels/{id}/ops/sweep (today > valid_until_date) or lazily on execute attempt"
        actor: LabelAdmin | system
        preconditions: ["today > valid_until_date"]
        side_effects: ["Artist IN_NEGOTIATION -> SCOUTED when no other open memo and no contract"]

  - entity: Contract
    initial_state: ACTIVE
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: OPTION_WINDOW
        trigger: "POST /api/labels/{id}/ops/sweep"
        actor: LabelAdmin
        preconditions: ["today >= current_term_end_date - label.option_window_days", "today <= current_term_end_date", "options_exercised < options_total"]
        side_effects: []
      - from: EXTENDED
        to: OPTION_WINDOW
        trigger: "POST /api/labels/{id}/ops/sweep"
        actor: LabelAdmin
        preconditions: ["today >= current_term_end_date - label.option_window_days", "today <= current_term_end_date", "options_exercised < options_total"]
        side_effects: []
      - from: OPTION_WINDOW
        to: EXTENDED
        trigger: "POST /api/contracts/{id}/exercise-option"
        actor: LabelAdmin
        preconditions:
          - "today <= current_term_end_date (ERR_OPTION_WINDOW_CLOSED)"
          - "No DealMemo of this contract's artist in DRAFT/PROPOSED/COUNTERED/APPROVED (ERR_RENEGOTIATION_IN_PROGRESS)"
        side_effects:
          - "options_exercised += 1"
          - "current_term_end_date += option_term_months (calendar months)"
          - "effective_base_rate_bps recomputed: min(base + options_exercised * escalation, 3000)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /api/labels/{id}/ops/sweep"
        actor: LabelAdmin
        preconditions: ["today > current_term_end_date"]
        side_effects: []
      - from: OPTION_WINDOW
        to: EXPIRED
        trigger: "POST /api/labels/{id}/ops/sweep"
        actor: LabelAdmin
        preconditions: ["today > current_term_end_date"]
        side_effects: []
      - from: EXTENDED
        to: EXPIRED
        trigger: "POST /api/labels/{id}/ops/sweep"
        actor: LabelAdmin
        preconditions: ["today > current_term_end_date"]
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/contracts/{id}/terminate"
        actor: LabelAdmin
        preconditions: ["If recoupment account total_unrecouped_cents > 0 then write_off_unrecouped must be true (ERR_UNRECOUPED_BALANCE)"]
        side_effects: ["When write_off_unrecouped: account.writeoff_cents = total_unrecouped_cents and all four bucket balances set to 0"]
      - from: OPTION_WINDOW
        to: TERMINATED
        trigger: "POST /api/contracts/{id}/terminate"
        actor: LabelAdmin
        preconditions: ["If recoupment account total_unrecouped_cents > 0 then write_off_unrecouped must be true (ERR_UNRECOUPED_BALANCE)"]
        side_effects: ["When write_off_unrecouped: account.writeoff_cents = total_unrecouped_cents and all four bucket balances set to 0"]
      - from: EXTENDED
        to: TERMINATED
        trigger: "POST /api/contracts/{id}/terminate"
        actor: LabelAdmin
        preconditions: ["If recoupment account total_unrecouped_cents > 0 then write_off_unrecouped must be true (ERR_UNRECOUPED_BALANCE)"]
        side_effects: ["When write_off_unrecouped: account.writeoff_cents = total_unrecouped_cents and all four bucket balances set to 0"]
      - { from: ACTIVE, to: ACTIVE, trigger: "POST /api/contracts/{id}/disburse-advance (status unchanged; advance_status PENDING -> FUNDED)", actor: FinanceController, preconditions: ["advance_status == PENDING (ERR_INVALID_STATE)"], side_effects: ["RecoupmentAccount.advance_balance_cents += advance_cents", "advance_status = FUNDED", "increments Contract.version by 1"] }

  - entity: RecoupmentAccount
    initial_state: RECOUPING
    terminal_states: []
    transitions:
      - from: RECOUPING
        to: EARNING
        trigger: "system side effect of POST /api/royalty-runs/{id}/finalize waterfall"
        actor: system
        preconditions: ["total_unrecouped_cents == 0 after applying the waterfall"]
        side_effects: []

  - entity: RecordingProject
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RECORDING
        trigger: "POST /api/recording-projects/{id}/start"
        actor: AnRManager
        preconditions:
          - "Contract status in {ACTIVE, OPTION_WINDOW, EXTENDED} (ERR_INVALID_STATE)"
          - "Contract advance_status == FUNDED (ERR_CONTRACT_NOT_FUNDED)"
          - "Artist status not in {HIATUS, DROPPED} (ERR_INVALID_STATE)"
          - "budget_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: RECORDING
        to: POST_PRODUCTION
        trigger: "POST /api/recording-projects/{id}/advance-stage"
        actor: AnRManager
        preconditions: ["No milestone of this project in {PENDING, SUBMITTED} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: POST_PRODUCTION
        to: DELIVERED
        trigger: "POST /api/recording-projects/{id}/advance-stage"
        actor: AnRManager
        preconditions:
          - "Every non-CANCELLED milestone is PAID (ERR_INVALID_STATE)"
          - "Every track of this project is in {MASTERED, CLEARED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/recording-projects/{id}/cancel"
        actor: AnRManager
        preconditions: ["No milestone in APPROVED (ERR_INVALID_STATE)"]
        side_effects: ["Milestones in {PENDING, SUBMITTED, REJECTED} -> CANCELLED"]
      - from: RECORDING
        to: CANCELLED
        trigger: "POST /api/recording-projects/{id}/cancel"
        actor: AnRManager
        preconditions: ["No milestone in APPROVED (ERR_INVALID_STATE)"]
        side_effects: ["Milestones in {PENDING, SUBMITTED, REJECTED} -> CANCELLED"]
      - from: POST_PRODUCTION
        to: CANCELLED
        trigger: "POST /api/recording-projects/{id}/cancel"
        actor: AnRManager
        preconditions: ["No milestone in APPROVED (ERR_INVALID_STATE)"]
        side_effects: ["Milestones in {PENDING, SUBMITTED, REJECTED} -> CANCELLED"]

  - entity: RecordingMilestone
    initial_state: PENDING
    terminal_states: [PAID, CANCELLED]
    transitions:
      - { from: PENDING, to: SUBMITTED, trigger: "POST /api/milestones/{id}/submit", actor: AnRManager, preconditions: ["Project status in {RECORDING, POST_PRODUCTION} (ERR_INVALID_STATE)"], side_effects: [] }
      - { from: REJECTED, to: SUBMITTED, trigger: "POST /api/milestones/{id}/submit (resubmission)", actor: AnRManager, preconditions: ["Project status in {RECORDING, POST_PRODUCTION} (ERR_INVALID_STATE)"], side_effects: [] }
      - { from: SUBMITTED, to: APPROVED, trigger: "POST /api/milestones/{id}/approve", actor: LabelAdmin, preconditions: [], side_effects: ["RecordingProject.committed_cents += payment_cents", "approved_by_user_id = caller X-User-ID", "RecordingProject.budget_posture recomputed"] }
      - { from: SUBMITTED, to: REJECTED, trigger: "POST /api/milestones/{id}/reject", actor: LabelAdmin, preconditions: [], side_effects: [] }
      - from: APPROVED
        to: PAID
        trigger: "POST /api/milestones/{id}/pay"
        actor: FinanceController
        preconditions:
          - "Project status in {RECORDING, POST_PRODUCTION} (ERR_INVALID_STATE)"
          - "project.spent_cents + payment_cents <= project.budget_cents (ERR_PROJECT_BUDGET_EXCEEDED); equality allowed"
        side_effects:
          - "RecordingProject.committed_cents -= payment_cents; spent_cents += payment_cents; budget_posture recomputed"
          - "RecoupmentAccount.recording_balance_cents += payment_cents (ledger sync, link 2 of pay cascade)"
          - "RecoupmentAccount.total_unrecouped_cents recomputed"

  - entity: Track
    initial_state: DEMO
    terminal_states: []
    transitions:
      - { from: DEMO, to: TRACKED, trigger: "POST /api/tracks/{id}/advance-stage", actor: AnRManager, preconditions: ["Project not CANCELLED/DELIVERED (ERR_INVALID_STATE)"], side_effects: [] }
      - { from: TRACKED, to: MIXED, trigger: "POST /api/tracks/{id}/advance-stage", actor: AnRManager, preconditions: ["Project not CANCELLED/DELIVERED (ERR_INVALID_STATE)"], side_effects: [] }
      - { from: MIXED, to: MASTERED, trigger: "POST /api/tracks/{id}/advance-stage", actor: AnRManager, preconditions: ["Project not CANCELLED/DELIVERED (ERR_INVALID_STATE)"], side_effects: [] }
      - { from: MASTERED, to: CLEARED, trigger: "POST /api/tracks/{id}/advance-stage", actor: AnRManager, preconditions: ["Project not CANCELLED/DELIVERED (ERR_INVALID_STATE)", "If contains_sample then clearance_ref must be non-null (ERR_SAMPLE_CLEARANCE_MISSING)"], side_effects: [] }
      - from: TRACKED
        to: BLOCKED
        trigger: "POST /api/tracks/{id}/block"
        actor: AnRManager
        preconditions: []
        side_effects:
          - "Link 1: every non-CANCELLED Release containing this track with asset_status in {ASSEMBLED, LOCKED} reverts asset_status -> DRAFT"
          - "Link 2: each Release whose asset_status reverted AND whose distribution_status == SCHEDULED reverts distribution_status -> PLANNED"
          - "Link 3: each AssetDelivery of such a Release in {QUEUED, TRANSMITTED} -> CANCELLED"
      - from: MIXED
        to: BLOCKED
        trigger: "POST /api/tracks/{id}/block"
        actor: AnRManager
        preconditions: []
        side_effects: ["Same 3-link release/delivery cascade as TRACKED->BLOCKED"]
      - from: MASTERED
        to: BLOCKED
        trigger: "POST /api/tracks/{id}/block"
        actor: AnRManager
        preconditions: []
        side_effects: ["Same 3-link release/delivery cascade as TRACKED->BLOCKED"]
      - from: CLEARED
        to: BLOCKED
        trigger: "POST /api/tracks/{id}/block"
        actor: AnRManager
        preconditions: []
        side_effects: ["Same 3-link release/delivery cascade as TRACKED->BLOCKED"]
      - { from: BLOCKED, to: TRACKED, trigger: "POST /api/tracks/{id}/rework", actor: AnRManager, preconditions: ["Project not CANCELLED/DELIVERED (ERR_INVALID_STATE)"], side_effects: [] }

  - entity: Release (asset_status dimension)
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - { from: DRAFT, to: ASSEMBLED, trigger: "POST /api/releases/{id}/assemble", actor: AnRManager, preconditions: ["distribution_status == PLANNED (ERR_INVALID_STATE)", "Every track in track_ids is CLEARED (ERR_TRACKS_NOT_CLEARED)"], side_effects: [] }
      - { from: ASSEMBLED, to: LOCKED, trigger: "POST /api/releases/{id}/lock-assets", actor: AnRManager, preconditions: ["cover_art_confirmed == true (ERR_COVER_ART_MISSING)"], side_effects: [] }
      - { from: ASSEMBLED, to: DRAFT, trigger: "system cascade from POST /api/tracks/{id}/block on a member track", actor: system, preconditions: [], side_effects: [] }
      - { from: LOCKED, to: DRAFT, trigger: "system cascade from POST /api/tracks/{id}/block on a member track", actor: system, preconditions: [], side_effects: ["If distribution_status == SCHEDULED: distribution_status -> PLANNED and that release's QUEUED/TRANSMITTED deliveries -> CANCELLED"] }

  - entity: Release (distribution_status dimension)
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - { from: PLANNED, to: SCHEDULED, trigger: "POST /api/releases/{id}/schedule", actor: MarketingManager, preconditions: ["asset_status == LOCKED (ERR_ASSETS_NOT_LOCKED)", "release_date >= today + label.release_lead_days (ERR_RELEASE_LEAD_TIME); equality allowed"], side_effects: [] }
      - { from: SCHEDULED, to: DELIVERED, trigger: "system bubble-up from POST /api/asset-deliveries/{id}/acknowledge", actor: system, preconditions: ["At least one non-CANCELLED AssetDelivery exists and every non-CANCELLED delivery is ACKNOWLEDGED"], side_effects: [] }
      - { from: DELIVERED, to: LIVE, trigger: "POST /api/releases/{id}/go-live", actor: MarketingManager, preconditions: ["today >= release_date (ERR_RELEASE_DATE_NOT_REACHED)"], side_effects: ["went_live_date = today", "Artist SIGNED -> ACTIVE when this is the artist's first LIVE release"] }
      - { from: LIVE, to: TAKEN_DOWN, trigger: "POST /api/releases/{id}/takedown", actor: MarketingManager, preconditions: [], side_effects: [] }
      - { from: TAKEN_DOWN, to: LIVE, trigger: "POST /api/releases/{id}/relaunch", actor: MarketingManager, preconditions: [], side_effects: [] }
      - { from: SCHEDULED, to: PLANNED, trigger: "system cascade from member-track block", actor: system, preconditions: [], side_effects: ["QUEUED/TRANSMITTED AssetDeliveries of this release -> CANCELLED"] }
      - { from: PLANNED, to: CANCELLED, trigger: "POST /api/releases/{id}/cancel", actor: AnRManager | LabelAdmin, preconditions: [], side_effects: ["Beats in {PLANNED, READY} -> CANCELLED", "PromoCampaigns in {DRAFT, ACTIVE, PAUSED} -> KILLED", "AssetDeliveries in {QUEUED, TRANSMITTED} -> CANCELLED"] }
      - { from: SCHEDULED, to: CANCELLED, trigger: "POST /api/releases/{id}/cancel", actor: AnRManager | LabelAdmin, preconditions: [], side_effects: ["Same cancel cascade as PLANNED->CANCELLED"] }
      - { from: DELIVERED, to: CANCELLED, trigger: "POST /api/releases/{id}/cancel", actor: AnRManager | LabelAdmin, preconditions: [], side_effects: ["Same cancel cascade as PLANNED->CANCELLED"] }
      - { from: TAKEN_DOWN, to: CANCELLED, trigger: "POST /api/releases/{id}/cancel", actor: AnRManager | LabelAdmin, preconditions: [], side_effects: ["Same cancel cascade as PLANNED->CANCELLED"] }

  - entity: AssetDelivery
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED, CANCELLED]
    transitions:
      - { from: QUEUED, to: TRANSMITTED, trigger: "POST /api/asset-deliveries/{id}/transmit", actor: MarketingManager, preconditions: ["Release distribution_status == SCHEDULED (ERR_INVALID_STATE)"], side_effects: ["attempt_count += 1"] }
      - { from: TRANSMITTED, to: ACKNOWLEDGED, trigger: "POST /api/asset-deliveries/{id}/acknowledge", actor: MarketingManager, preconditions: [], side_effects: ["Bubble-up: when every non-CANCELLED delivery of the release is ACKNOWLEDGED and at least one exists, Release distribution_status SCHEDULED -> DELIVERED"] }
      - { from: TRANSMITTED, to: REJECTED, trigger: "POST /api/asset-deliveries/{id}/reject", actor: MarketingManager, preconditions: [], side_effects: [] }
      - { from: REJECTED, to: QUEUED, trigger: "POST /api/asset-deliveries/{id}/retry", actor: MarketingManager, preconditions: ["Release distribution_status == SCHEDULED (ERR_INVALID_STATE)"], side_effects: [] }
      - { from: QUEUED, to: CANCELLED, trigger: "system cascade (release cancel or member-track block)", actor: system, preconditions: [], side_effects: [] }
      - { from: TRANSMITTED, to: CANCELLED, trigger: "system cascade (release cancel or member-track block)", actor: system, preconditions: [], side_effects: [] }

  - entity: MarketingBeat
    initial_state: PLANNED
    terminal_states: [MEASURED, SKIPPED, CANCELLED]
    transitions:
      - { from: PLANNED, to: READY, trigger: "POST /api/beats/{id}/ready", actor: MarketingManager, preconditions: [], side_effects: [] }
      - { from: READY, to: EXECUTED, trigger: "POST /api/beats/{id}/execute", actor: MarketingManager, preconditions: [], side_effects: [] }
      - { from: EXECUTED, to: MEASURED, trigger: "POST /api/beats/{id}/measure", actor: MarketingManager, preconditions: [], side_effects: ["impressions = input impressions", "engagement_score = input engagement_score"] }
      - { from: PLANNED, to: SKIPPED, trigger: "POST /api/beats/{id}/skip", actor: MarketingManager, preconditions: [], side_effects: [] }
      - { from: READY, to: SKIPPED, trigger: "POST /api/beats/{id}/skip", actor: MarketingManager, preconditions: [], side_effects: [] }
      - { from: PLANNED, to: CANCELLED, trigger: "system cascade from release cancel", actor: system, preconditions: [], side_effects: [] }
      - { from: READY, to: CANCELLED, trigger: "system cascade from release cancel", actor: system, preconditions: [], side_effects: [] }

  - entity: PromoCampaign
    initial_state: DRAFT
    terminal_states: [COMPLETED, KILLED]
    transitions:
      - { from: DRAFT, to: ACTIVE, trigger: "POST /api/promo-campaigns/{id}/activate", actor: MarketingManager, preconditions: ["Release distribution_status in {SCHEDULED, DELIVERED, LIVE} (ERR_INVALID_STATE)"], side_effects: [] }
      - { from: ACTIVE, to: PAUSED, trigger: "POST /api/promo-campaigns/{id}/pause", actor: MarketingManager, preconditions: [], side_effects: [] }
      - { from: PAUSED, to: ACTIVE, trigger: "POST /api/promo-campaigns/{id}/resume", actor: MarketingManager, preconditions: ["Release distribution_status in {SCHEDULED, DELIVERED, LIVE} (ERR_INVALID_STATE)"], side_effects: [] }
      - { from: ACTIVE, to: COMPLETED, trigger: "POST /api/promo-campaigns/{id}/complete", actor: MarketingManager, preconditions: [], side_effects: [] }
      - { from: PAUSED, to: COMPLETED, trigger: "POST /api/promo-campaigns/{id}/complete", actor: MarketingManager, preconditions: [], side_effects: [] }
      - { from: DRAFT, to: KILLED, trigger: "POST /api/promo-campaigns/{id}/kill or release-cancel cascade", actor: MarketingManager | system, preconditions: [], side_effects: [] }
      - { from: ACTIVE, to: KILLED, trigger: "POST /api/promo-campaigns/{id}/kill or release-cancel cascade", actor: MarketingManager | system, preconditions: [], side_effects: [] }
      - { from: PAUSED, to: KILLED, trigger: "POST /api/promo-campaigns/{id}/kill or release-cancel cascade", actor: MarketingManager | system, preconditions: [], side_effects: [] }

  - entity: TourSupport
    initial_state: PROPOSED
    terminal_states: [DECLINED, CLOSED, CANCELLED]
    transitions:
      - { from: PROPOSED, to: APPROVED, trigger: "POST /api/tour-supports/{id}/approve", actor: LabelAdmin, preconditions: ["approved_budget_cents <= requested_amount_cents (ERR_APPROVED_EXCEEDS_REQUESTED)"], side_effects: ["approved_budget_cents = input", "approved_by_user_id = caller X-User-ID"] }
      - { from: PROPOSED, to: DECLINED, trigger: "POST /api/tour-supports/{id}/decline", actor: LabelAdmin, preconditions: [], side_effects: [] }
      - { from: APPROVED, to: ADVANCED, trigger: "POST /api/tour-supports/{id}/advance-funds", actor: FinanceController, preconditions: ["amount_cents <= approved_budget_cents (ERR_INVALID_REQUEST)", "caller X-User-ID != approved_by_user_id (ERR_SEGREGATION_OF_DUTIES)"], side_effects: ["advanced_amount_cents = input amount_cents", "funded_by_user_id = caller X-User-ID"] }
      - { from: ADVANCED, to: RECONCILED, trigger: "POST /api/tour-supports/{id}/reconcile", actor: FinanceController, preconditions: [], side_effects: ["unspent_returned_cents = max(0, advanced_amount_cents - approved_expense_total_cents)"] }
      - { from: RECONCILED, to: CLOSED, trigger: "POST /api/tour-supports/{id}/close", actor: FinanceController, preconditions: [], side_effects: [] }
      - { from: APPROVED, to: CANCELLED, trigger: "POST /api/tour-supports/{id}/cancel", actor: AnRManager, preconditions: [], side_effects: [] }

  - entity: TourExpense
    initial_state: SUBMITTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/tour-expenses/{id}/approve"
        actor: FinanceController
        preconditions:
          - "TourSupport status == ADVANCED (ERR_INVALID_STATE)"
          - "Category cap: sum(APPROVED amounts in this category) + amount_cents <= label.tour_category_caps_bps[category] x approved_budget_cents / 10000 (ERR_CATEGORY_CAP_EXCEEDED); equality allowed"
          - "Total cap: approved_expense_total_cents + amount_cents <= approved_budget_cents (ERR_TOUR_BUDGET_EXCEEDED); equality allowed"
        side_effects:
          - "RecoupmentAccount.tour_support_balance_cents += amount_cents"
          - "TourSupport.approved_expense_total_cents += amount_cents"
          - "RecoupmentAccount.total_unrecouped_cents recomputed"
      - { from: SUBMITTED, to: REJECTED, trigger: "POST /api/tour-expenses/{id}/reject", actor: FinanceController, preconditions: [], side_effects: [] }
      - from: APPROVED
        to: VOIDED
        trigger: "POST /api/tour-expenses/{id}/void"
        actor: FinanceController
        preconditions: ["TourSupport status != CLOSED (ERR_INVALID_STATE)"]
        side_effects:
          - "RecoupmentAccount.tour_support_balance_cents -= amount_cents (compensation)"
          - "TourSupport.approved_expense_total_cents -= amount_cents"
          - "RecoupmentAccount.total_unrecouped_cents recomputed"

  - entity: RoyaltyRun
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - { from: OPEN, to: CLOSED, trigger: "POST /api/royalty-runs/{id}/close", actor: FinanceController, preconditions: [], side_effects: ["Revenue intake frozen for the period (snapshot semantics for calculate)"] }
      - from: CLOSED
        to: CALCULATED
        trigger: "POST /api/royalty-runs/{id}/calculate"
        actor: FinanceController
        preconditions: []
        side_effects:
          - "Create one PROVISIONAL RoyaltyStatement per contract in {ACTIVE, OPTION_WINDOW, EXTENDED} having >= 1 eligible RevenueReport in the run period"
          - "Per statement: compute gross/net/earned (royalty_statement_computation), projected_recoupment_cents (recoupment_waterfall projection, no bucket mutation), reserve_held_cents, provisional net_payable_cents"
      - from: CALCULATED
        to: FINALIZED
        trigger: "POST /api/royalty-runs/{id}/finalize"
        actor: FinanceController
        preconditions: []
        side_effects:
          - "Link 1: every statement PROVISIONAL -> FINAL; reserve_held_cents released (set to 0); final variant recomputed"
          - "Link 2: each finalized statement applies recoupment_waterfall to its contract's RecoupmentAccount: bucket balances reduced in priority order, recoupment_applied_cents set, total_recouped_cents += applied"
          - "Link 3: each account whose total_unrecouped_cents reaches 0 flips payout_status RECOUPING -> EARNING"
      - { from: FINALIZED, to: PAID, trigger: "POST /api/royalty-runs/{id}/mark-paid", actor: FinanceController, preconditions: ["Every statement of the run is PAID (ERR_RUN_HAS_UNPAID_STATEMENTS)"], side_effects: [] }

  - entity: RoyaltyStatement
    initial_state: PROVISIONAL
    terminal_states: [PAID]
    transitions:
      - { from: PROVISIONAL, to: FINAL, trigger: "system cascade of POST /api/royalty-runs/{id}/finalize", actor: system, preconditions: [], side_effects: ["reserve_held_cents = 0", "recoupment_applied_cents = waterfall result", "net_payable_cents recomputed under final variant"] }
      - { from: FINAL, to: DISPUTED, trigger: "POST /api/royalty-statements/{id}/dispute", actor: ArtistPortal, preconditions: ["Caller owns statement's contract's artist (ERR_ARTIST_OWNERSHIP_MISMATCH)"], side_effects: ["dispute_note = input dispute_note"] }
      - { from: DISPUTED, to: FINAL, trigger: "POST /api/royalty-statements/{id}/resolve-dispute", actor: FinanceController, preconditions: [], side_effects: [] }
      - { from: FINAL, to: PAID, trigger: "POST /api/royalty-statements/{id}/pay", actor: FinanceController, preconditions: ["RoyaltyRun status == FINALIZED (ERR_INVALID_STATE)", "net_payable_cents >= 0 (ERR_NEGATIVE_PAYABLE)"], side_effects: [] }

# =============================================================================
# Section 1.2.1: Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: deal-memo-counter-stale-version
    parent_entity: DealMemo
    write_endpoint: "POST /api/deal-memos/{id}/counter"
    occ_field: expected_deal_memo_version
    description: |
      Countering a DealMemo whose version has advanced since the client last
      observed it is rejected. Countering is legitimate from both PROPOSED and
      COUNTERED (a second sequential counter would succeed under the natural
      semantics), so the stale observation of the memo is resolved purely by
      the OCC version check.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: project-budget-amend-stale-version
    parent_entity: RecordingProject
    write_endpoint: "POST /api/recording-projects/{id}/amend-budget"
    occ_field: expected_recording_project_version
    description: |
      Amending a RecordingProject budget whose version has advanced since the
      client last observed it is rejected. Budget amendment is repeatable from
      every non-terminal project status, so the only thing that invalidates a
      stale-base amendment is the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: statement-adjust-stale-version
    parent_entity: RoyaltyStatement
    write_endpoint: "POST /api/royalty-statements/{id}/adjust"
    occ_field: expected_royalty_statement_version
    description: |
      Adjusting a RoyaltyStatement whose version has advanced since the client
      last observed it is rejected. Adjustment is repeatable while the
      statement is PROVISIONAL or DISPUTED, so a stale base is caught only by
      the OCC version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: scouting_score
    trigger: "Artist creation (POST /api/artists)"
    algorithm: weighted_scoring
    formula: |
      norm(x, cap) = min(x / cap, 1)
      raw = 100 * ( 0.30 * norm(monthly_streams, 1000000)
                  + 0.20 * norm(social_followers, 2000000)
                  + 0.25 * engagement_rate
                  + 0.25 * norm(live_draw_avg, 2000) )
      score = clamp(round_half_up(raw * label.genre_multipliers[genre], 1 decimal), 0, 100)
    input_set: "The artist's four scouting metrics plus the label's genre multiplier for the artist's genre"
    precision: "1 decimal place, round_half_up"
    variants: []

  - name: effective_base_rate
    trigger: "Contract creation; every exercise-option"
    algorithm: constraint_propagation
    formula: |
      effective_base_rate_bps = min(base_royalty_rate_bps + options_exercised * option_escalation_bps, 3000)
    input_set: "The contract itself"
    constants:
      MAX_BASE_RATE_BPS: 3000
    precision: "integer basis points"
    variants: []

  - name: royalty_statement_computation
    trigger: "POST /api/royalty-runs/{id}/calculate"
    algorithm: tiered_pricing
    formula: |
      Eligible reports: RevenueReport rows whose release belongs to the contract,
      whose period <= run.period (string compare on 'YYYY-Qn'), and which have not
      been counted by an earlier run's statement (each report counted at most once
      across runs; a report joins the earliest run with run.period >= report.period).
      Current-period lines: eligible reports with period == run.period.
      Prior cumulative units: sum of units over eligible reports with period < run.period.

      Evaluation order (pinned, circular-looking dependency resolved):
        (1) sort current-period lines by (created_at ASC, gross_revenue_cents ASC)
        (2) walk lines in that order maintaining cumulative_units (starts at prior cumulative)
        (3) each line's own units ARE added before its tier is selected:
            cumulative_units += line.units; tier = last tier with cumulative_units > threshold
        (4) line rate = effective_base_rate_bps + tier.delta_bps   [STREAMING/DOWNLOAD/PHYSICAL]
            SYNC lines ignore tiers: line royalty = round_half_up(line_net * 0.50)
        (5) line_net = round_half_up(gross_revenue_cents * (10000 - label.channel_deduction_bps[channel]) / 10000)
        (6) line_royalty = round_half_up(line_net * line_rate_bps / 10000)
      PINNED ROUNDING ORDER: round per line, then sum. Never sum-then-round.
      gross_revenue_cents (statement) = sum of current-period line gross
      net_revenue_cents (statement)   = sum of current-period line_net
      royalty_earned_cents            = sum of current-period line_royalty
    input_set: "RevenueReports of the contract's releases for the run period, plus all earlier eligible reports for cumulative units"
    precision: "integer cents, round_half_up per line"
    variants: []

  - name: recoupment_waterfall
    trigger: "projected at POST /api/royalty-runs/{id}/calculate (no mutation); applied at POST /api/royalty-runs/{id}/finalize (mutates buckets)"
    algorithm: waterfall_allocation
    formula: |
      Bucket priority order (pinned): recording_balance_cents, advance_balance_cents,
        tour_support_balance_cents, promo_balance_cents.
      Eligible buckets depend on contract.recoupment_scope:
        MASTER_ONLY            -> {recording, advance}
        CROSS_COLLATERALIZED   -> {recording, advance, tour_support, promo}
      distributable = min(royalty_earned_cents, sum(eligible bucket balances))
      Walk buckets in priority order; each bucket takes min(balance, remaining).
      Remainder (should distributable not divide evenly) cannot occur: integer cents,
      bucket-wise min subtraction is exact.
      Projection returns the would-be applied total; application also writes
      recoupment_applied_cents and total_recouped_cents += applied.
    input_set: "RecoupmentAccount of the statement's contract at calculation/finalization time"
    precision: "integer cents, exact"
    variants:
      - name: master_only_scope
        when: "contract.recoupment_scope == MASTER_ONLY"
        difference: "Tour-support and promo buckets are invisible to the waterfall; earnings recoup only recording and advance balances, so recoupment_applied_cents can be 0 while tour/promo balances are positive"
      - name: cross_collateralized_scope
        when: "contract.recoupment_scope == CROSS_COLLATERALIZED"
        difference: "All four buckets eligible; identical earnings produce a strictly larger applied amount whenever tour_support_balance_cents + promo_balance_cents > 0 and the upstream buckets are exhausted"

  - name: statement_net_payable
    trigger: "calculate (provisional variant), finalize (final variant), adjust (recompute within current variant)"
    algorithm: aggregation
    formula: |
      Pinned evaluation order (circular-looking, resolved):
        (1) base = royalty_earned_cents
        (2) applied = projected_recoupment_cents (PROVISIONAL) or recoupment_applied_cents (FINAL/DISPUTED/PAID)
        (3) remainder = base - applied
        (4) reserve = round_half_up(remainder * label.reserve_rate_bps / 10000) when PROVISIONAL, else 0
        (5) net_payable_cents = remainder - reserve + adjustment_cents
      Adjustments are added AFTER the reserve is computed: an adjustment never
      changes reserve_held_cents.
    input_set: "The statement row itself plus label.reserve_rate_bps"
    precision: "integer cents, round_half_up for the reserve"
    variants:
      - name: provisional
        when: "status == PROVISIONAL"
        difference: "Uses projected_recoupment_cents and holds a reserve; identical inputs yield a LOWER net than the final variant whenever reserve_rate_bps > 0 and remainder > 0"
      - name: final
        when: "status in {FINAL, DISPUTED, PAID}"
        difference: "Uses recoupment_applied_cents and releases the reserve (reserve_held_cents = 0)"

  - name: budget_posture_and_gate
    trigger: "milestone approve, milestone pay, amend-budget"
    algorithm: threshold
    formula: |
      spent_cents     = sum(payment_cents of milestones PAID)
      committed_cents = sum(payment_cents of milestones APPROVED)
      pay gate: spent_cents + payment_cents <= budget_cents   (equality allowed)
      amend gate: new budget_cents >= spent_cents             (equality allowed)
      posture: AT_RISK when (spent_cents + committed_cents) * 100 >= 85 * budget_cents, else WITHIN_BUDGET
    input_set: "Milestones of the project in APPROVED or PAID"
    constants:
      AT_RISK_THRESHOLD_BPS: 8500
    precision: "integer cents"
    variants: []

  - name: beat_window_overlap
    trigger: "POST /api/releases/{id}/beats"
    algorithm: interval_merge
    formula: |
      Window bounds: start_date >= release.release_date - label.beat_pre_release_days
                     AND end_date <= release.release_date + label.beat_post_release_days
                     (ERR_BEAT_OUTSIDE_WINDOW; boundaries inclusive)
      Overlap: half-open intervals [start_date, end_date). For every other beat of the
      SAME release and SAME channel with status in {PLANNED, READY, EXECUTED, MEASURED}
      (SKIPPED and CANCELLED excluded): overlap iff a.start_date < b.end_date AND
      b.start_date < a.end_date (ERR_BEAT_WINDOW_OVERLAP). Adjacency
      (a.end_date == b.start_date) is allowed.
    input_set: "Non-terminal beats of the same release on the same channel"
    precision: "date granularity"
    variants: []

  - name: campaign_window_gap
    trigger: "POST /api/releases/{id}/promo-campaigns"
    algorithm: interval_merge
    formula: |
      Closed intervals [start_date, end_date] (both inclusive). For every other
      campaign of the SAME release and SAME channel with status != KILLED:
      conflict iff NOT (a.end_date + label.campaign_gap_days <= b.start_date
      OR b.end_date + label.campaign_gap_days <= a.start_date)
      (ERR_CAMPAIGN_WINDOW_CONFLICT). A gap of exactly campaign_gap_days is allowed.
      Different semantics from beat_window_overlap: closed intervals plus a
      mandatory buffer, vs half-open intervals with adjacency allowed.
    input_set: "Non-KILLED campaigns of the same release on the same channel"
    precision: "date granularity"
    variants: []

  - name: tour_expense_caps
    trigger: "POST /api/tour-expenses/{id}/approve"
    algorithm: threshold
    formula: |
      category_cap_cents(c) = label.tour_category_caps_bps[c] * tour.approved_budget_cents / 10000  (integer division, floor)
      category gate: sum(APPROVED expense amounts in category c) + amount_cents <= category_cap_cents(c)
      total gate:    tour.approved_expense_total_cents + amount_cents <= tour.approved_budget_cents
      Both boundaries inclusive (== allowed).
    input_set: "APPROVED expenses of the same tour support"
    precision: "integer cents; category cap uses floor division"
    variants: []

  - name: tour_reconciliation
    trigger: "POST /api/tour-supports/{id}/reconcile"
    algorithm: aggregation
    formula: |
      unspent_returned_cents = max(0, advanced_amount_cents - approved_expense_total_cents)
      The tour_support recoupment bucket is NOT touched by advances or reconcile;
      it moves only on expense approve (+=) and void (-=).
    input_set: "The tour support row"
    precision: "integer cents"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles list", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "ArtistPortal callers: X-User-ID must equal the Artist.id owning the addressed resource (memo, contract, account, statement, tour via its contract)", error_id: ERR_ARTIST_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "ArtistPortal-accessible endpoints" }
  - { priority: 4, category: existence, check: "Path ids exist, left-to-right; body FK references exist and belong to the same label", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 5, category: existence, check: "Required fields present; types, enum membership, and numeric ranges valid (e.g., base_royalty_rate_bps in 1000..3000, options_total in 0..3, term_months in {12,24,36}, end_date after start_date)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints with a body" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version equals the parent's current version on the three OCC-guarded endpoints", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "counter / amend-budget / adjust" }
  - { priority: 7, category: state, check: "State-machine precondition: transition is declared from the entity's current status (terminal-state trigger attempts included)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: business_safety, check: "Deal execute: artist under 18 at today requires guardian_name and guardian_email on the memo", error_id: ERR_GUARDIAN_CONSENT_REQUIRED, http_status: 422, applies_to: "POST /api/deal-memos/{id}/execute" }
  - { priority: 9, category: business_safety, check: "Track advance to CLEARED: contains_sample requires non-null clearance_ref", error_id: ERR_SAMPLE_CLEARANCE_MISSING, http_status: 422, applies_to: "POST /api/tracks/{id}/advance-stage" }
  - { priority: 10, category: business_constraint, check: "At most one open memo per artist (none other in DRAFT/PROPOSED/COUNTERED/APPROVED)", error_id: ERR_DEAL_MEMO_ALREADY_OPEN, http_status: 409, applies_to: "POST /api/artists/{id}/deal-memos, POST /api/deal-memos/{id}/propose" }
  - { priority: 11, category: business_constraint, check: "artist.scouting_score >= label.sign_threshold_score at propose", error_id: ERR_SCOUTING_SCORE_TOO_LOW, http_status: 422, applies_to: "POST /api/deal-memos/{id}/propose" }
  - { priority: 12, category: business_constraint, check: "ISRC unique per label across all tracks", error_id: ERR_ISRC_CONFLICT, http_status: 409, applies_to: "POST /api/recording-projects/{id}/tracks" }
  - { priority: 13, category: business_constraint, check: "Milestone sequence unique per project among non-CANCELLED milestones", error_id: ERR_MILESTONE_SEQUENCE_CONFLICT, http_status: 409, applies_to: "POST /api/recording-projects/{id}/milestones" }
  - { priority: 14, category: business_constraint, check: "SINGLE release carries exactly 1 track; ALBUM carries 2..30; all tracks belong to projects of the same contract and are in {MIXED, MASTERED, CLEARED}", error_id: ERR_SINGLE_TRACK_COUNT, http_status: 422, applies_to: "POST /api/contracts/{id}/releases" }
  - { priority: 15, category: business_constraint, check: "At most one non-terminal AssetDelivery per (release, distributor)", error_id: ERR_DUPLICATE_DELIVERY, http_status: 409, applies_to: "POST /api/releases/{id}/deliveries" }
  - { priority: 16, category: business_constraint, check: "Distributor is_active for new deliveries", error_id: ERR_DISTRIBUTOR_INACTIVE, http_status: 422, applies_to: "POST /api/releases/{id}/deliveries" }
  - { priority: 17, category: business_constraint, check: "RevenueReport unique per (label, distributor, release, period, channel)", error_id: ERR_DUPLICATE_REVENUE_REPORT, http_status: 409, applies_to: "POST /api/revenue-reports" }
  - { priority: 18, category: business_constraint, check: "RoyaltyRun period unique per label", error_id: ERR_RUN_PERIOD_CONFLICT, http_status: 409, applies_to: "POST /api/royalty-runs" }
  - { priority: 19, category: business_referential, check: "Contract advance_status == FUNDED before a recording project may start", error_id: ERR_CONTRACT_NOT_FUNDED, http_status: 409, applies_to: "POST /api/recording-projects/{id}/start" }
  - { priority: 20, category: business_referential, check: "Artist status permits the operation: memo create/propose requires SCOUTED/IN_NEGOTIATION/SIGNED/ACTIVE; project create+start, release create, tour-support create require SIGNED or ACTIVE", error_id: ERR_ARTIST_NOT_SIGNABLE, http_status: 409, applies_to: "memo create/propose; project create/start; release create; tour-support create" }
  - { priority: 21, category: business_referential, check: "Option exercise blocked while any memo of the artist is open (renegotiation in progress)", error_id: ERR_RENEGOTIATION_IN_PROGRESS, http_status: 409, applies_to: "POST /api/contracts/{id}/exercise-option" }
  - { priority: 22, category: business_referential, check: "Terminate with total_unrecouped_cents > 0 requires write_off_unrecouped=true", error_id: ERR_UNRECOUPED_BALANCE, http_status: 422, applies_to: "POST /api/contracts/{id}/terminate" }
  - { priority: 23, category: business_referential, check: "RevenueReport.release must be in distribution_status {DELIVERED, LIVE, TAKEN_DOWN}", error_id: ERR_RELEASE_NOT_LIVE, http_status: 422, applies_to: "POST /api/revenue-reports" }
  - { priority: 24, category: business_temporal, check: "Memo guarded transitions while today > valid_until_date: memo -> EXPIRED and error", error_id: ERR_DEAL_MEMO_EXPIRED, http_status: 422, applies_to: "propose / counter / approve / execute on deal memos" }
  - { priority: 25, category: business_temporal, check: "Option exercise only while today <= current_term_end_date", error_id: ERR_OPTION_WINDOW_CLOSED, http_status: 422, applies_to: "POST /api/contracts/{id}/exercise-option" }
  - { priority: 26, category: business_temporal, check: "Schedule: release_date >= today + label.release_lead_days (equality allowed)", error_id: ERR_RELEASE_LEAD_TIME, http_status: 422, applies_to: "POST /api/releases/{id}/schedule" }
  - { priority: 27, category: business_temporal, check: "Go-live only when today >= release_date", error_id: ERR_RELEASE_DATE_NOT_REACHED, http_status: 422, applies_to: "POST /api/releases/{id}/go-live" }
  - { priority: 28, category: business_temporal, check: "Beat window within [release_date - beat_pre_release_days, release_date + beat_post_release_days] inclusive", error_id: ERR_BEAT_OUTSIDE_WINDOW, http_status: 422, applies_to: "POST /api/releases/{id}/beats" }
  - { priority: 29, category: business_temporal, check: "Beat half-open overlap on same release+channel among non-terminal beats", error_id: ERR_BEAT_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /api/releases/{id}/beats" }
  - { priority: 30, category: business_temporal, check: "Campaign closed-interval minimum gap on same release+channel among non-KILLED campaigns", error_id: ERR_CAMPAIGN_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /api/releases/{id}/promo-campaigns" }
  - { priority: 31, category: business_fiscal, check: "Execute: advance_cents <= label.advance_cap_cents", error_id: ERR_ADVANCE_CAP_EXCEEDED, http_status: 422, applies_to: "POST /api/deal-memos/{id}/execute" }
  - { priority: 32, category: business_fiscal, check: "Milestone pay: project.spent_cents + payment_cents <= budget_cents (equality allowed)", error_id: ERR_PROJECT_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /api/milestones/{id}/pay" }
  - { priority: 33, category: business_fiscal, check: "Amend budget: new budget_cents >= project.spent_cents (equality allowed)", error_id: ERR_BUDGET_BELOW_SPEND, http_status: 422, applies_to: "POST /api/recording-projects/{id}/amend-budget" }
  - { priority: 34, category: business_fiscal, check: "Campaign spend: spend_cents + amount_cents <= spend_cap_cents (equality allowed); campaign must be ACTIVE", error_id: ERR_CAMPAIGN_CAP_EXCEEDED, http_status: 422, applies_to: "POST /api/promo-campaigns/{id}/spend" }
  - { priority: 35, category: business_fiscal, check: "Tour approve: approved_budget_cents <= requested_amount_cents", error_id: ERR_APPROVED_EXCEEDS_REQUESTED, http_status: 422, applies_to: "POST /api/tour-supports/{id}/approve" }
  - { priority: 36, category: business_fiscal, check: "Tour expense approve: per-category cap (floor division of bps x approved budget)", error_id: ERR_CATEGORY_CAP_EXCEEDED, http_status: 422, applies_to: "POST /api/tour-expenses/{id}/approve" }
  - { priority: 37, category: business_fiscal, check: "Tour expense approve: approved_expense_total + amount <= approved_budget_cents", error_id: ERR_TOUR_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /api/tour-expenses/{id}/approve" }
  - { priority: 38, category: business_fiscal, check: "Tour advance-funds: caller X-User-ID must differ from approved_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /api/tour-supports/{id}/advance-funds" }
  - { priority: 39, category: business_fiscal, check: "Statement pay: net_payable_cents >= 0", error_id: ERR_NEGATIVE_PAYABLE, http_status: 422, applies_to: "POST /api/royalty-statements/{id}/pay" }
  - { priority: 40, category: state, check: "Run mark-paid: every statement of the run already PAID", error_id: ERR_RUN_HAS_UNPAID_STATEMENTS, http_status: 409, applies_to: "POST /api/royalty-runs/{id}/mark-paid" }

# =============================================================================
# Section 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the server's logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z; before any set call the logical clock reads that default and never the wall clock.", roles: [LabelAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["Only the clock changes; no entity is mutated"] }

  # --- Label ---
  - { method: POST, path: "/api/labels", description: "Create a label with optional config overrides", roles: [LabelAdmin], code: 201, input: ["name", "advance_cap_cents?", "reserve_rate_bps?", "sign_threshold_score?", "option_window_days?", "release_lead_days?", "beat_pre_release_days?", "beat_post_release_days?", "campaign_gap_days?", "genre_multipliers?", "channel_deduction_bps?", "tier_thresholds?", "tour_category_caps_bps?"], output: Label, side_effects: [] }
