        claim_type: violation_to_error
        grounds: ["concurrency_rules[offer-accept-stale-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Accepting an offer with a stale expected_program_version (the value observed before a prior acceptance on a different debt bumped Program.version) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z. Client+Program ACTIVE; TWO debts 4000 and 5000 (total 9000, tier 0.25); balance funded (3000)."
            - "offer-A on debt-A (4000) at 0.40 and offer-B on debt-B (5000) at 0.40, both PENDING."
            - "offer-A accepted with v_stale (the post-activate version), which bumps Program.version. offer-B (on a DIFFERENT debt, still PENDING) is then accepted carrying the now-stale v_stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clients"
              payload: { full_name: "C", email: "c18@x.com", state_code: "CA" }
              as: ProgramAdmin
              captures: { client_id: $.data.id }
            - call: "POST /programs"
              payload: { client_id: "${client_id}", monthly_deposit_amount: 600, reserve_floor: 0 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred A", account_number: "OC-A", original_balance: 4000 }
              as: ProgramAdmin
              captures: { debt_a: $.data.id }
            - call: "POST /debts"
              payload: { program_id: "${prog_id}", creditor_name: "Cred B", account_number: "OC-B", original_balance: 5000 }
              as: ProgramAdmin
              captures: { debt_b: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { v_stale: $.data.version }
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-03-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-04-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-05-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-06-09T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /deposits"
              payload: { program_id: "${prog_id}", scheduled_for: "2026-02-10T00:00:00Z", amount: 600 }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_a}", offer_pct: 0.40, due_date: "2026-12-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { offer_a: $.data.id }
            - call: "POST /offers"
              payload: { program_id: "${prog_id}", debt_id: "${debt_b}", offer_pct: 0.40, due_date: "2026-12-01T00:00:00Z" }
              as: NegotiationAgent
              captures: { offer_b: $.data.id }
            - call: "POST /offers/${offer_a}/accept"
              payload: { expected_program_version: "${v_stale}" }
              as: NegotiationAgent
          trigger:
            - call: "POST /offers/${offer_b}/accept"
              payload: { expected_program_version: "${v_stale}" }
              as: NegotiationAgent
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_STALE_VERSION and HTTP 412 (offer-A acceptance already bumped Program.version, so v_stale is stale for offer-B which remains PENDING on a different debt)"

