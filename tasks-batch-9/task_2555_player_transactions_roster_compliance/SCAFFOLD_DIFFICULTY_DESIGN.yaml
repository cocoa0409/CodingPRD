  # ===========================================================================
  # R3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: player_roster_and_medical_dimensions_advance_independently
        grounds:
          - state_machines.Player.roster_designation
          - state_machines.Player.medical_status
          - state_machines.InjuryDesignation.PENDING_PAPERWORK_to_PAPERWORK_FILED
          - state_machines.InjuryDesignation.PAPERWORK_FILED_to_ACTIVE
          - calculations.injury_return_window
          - entities.Player.fields.medical_status
          - entities.Player.fields.roster_designation
        distinguishing_aspect: |
          Non-linearity here is PARALLEL DIMENSIONS on the Player entity: filing injury
          paperwork moves medical_status ACTIVE-player CLEARED to REHAB while roster_designation
          stays ACTIVE, and the subsequent IR_PLACEMENT approval moves roster_designation to
          INJURED_RESERVE while medical_status stays REHAB — neither trigger touches the other
          dimension, so the combined state (INJURED_RESERVE, REHAB) is only reachable through
          two independent writes.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T14:00:00Z."
            - "Club Harbor Kings (cap 500000000, default limits) with Ray Alder signed to an APPROVED 3-year deal: base 80000000, signing bonus 10000000; Player ACTIVE and CLEARED, Contract ACTIVE at 83333333."
            - "An InjuryDesignation of designation_type INJURED_RESERVE exists in PENDING_PAPERWORK for that player and club (minimum_stay_days 21)."
            - "An IR_PLACEMENT filing referencing that designation is FILED and awaiting a decision."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T14:00:00Z" }
              as: LeagueOfficer
            - call: "POST /teams"
              payload: { name: "Harbor Kings", market_code: "HKG", salary_cap_limit_cents: 500000000, waiver_priority_rank: 1 }
              as: LeagueOfficer
              captures: { team_a_id: $.data.id, team_a_v1: $.data.version }
            - call: "POST /players"
              payload: { full_name: "Ray Alder", position: "QB" }
              as: LeagueOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p1_id}", transaction_type: "SIGNING", expected_team_version: "${team_a_v1}", years: 3, base_salary_cents: 80000000, signing_bonus_cents: 10000000, start_season_year: 2026 }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn1_id: $.data.id, c1_id: $.data.contract_id }
            - call: "POST /physical-exams"
              payload: { player_id: "${p1_id}", team_id: "${team_a_id}", exam_type: "ENTRY_PHYSICAL", window_start_at: "2026-08-10T13:00:00Z", window_end_at: "2026-08-10T20:00:00Z", transaction_id: "${txn1_id}" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
              captures: { ex1_id: $.data.id }
            - call: "POST /physical-exams/${ex1_id}/record-result"
              payload: { result: "PASSED", performed_at: "2026-08-10T14:00:00Z" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn1_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn1_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
            - call: "POST /injury-designations"
              payload: { player_id: "${p1_id}", team_id: "${team_a_id}", designation_type: "INJURED_RESERVE" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
              captures: { inj1_id: $.data.id }
            - call: "GET /teams/${team_a_id}"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { team_a_v3: $.data.version }
            - call: "POST /transactions"
              payload: { team_id: "${team_a_id}", player_id: "${p1_id}", transaction_type: "IR_PLACEMENT", expected_team_version: "${team_a_v3}", injury_designation_id: "${inj1_id}" }
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
              captures: { txn_ir_id: $.data.id }
            - call: "POST /transactions/${txn_ir_id}/file"
              payload: {}
              as: TeamCapAnalyst
              as_user_id: "${team_a_id}"
          trigger:
            - call: "POST /injury-designations/${inj1_id}/file-paperwork"
              payload: { paperwork_reference: "IR-2026-0001" }
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
            - call: "GET /players/${p1_id}"
              payload: {}
              as: TeamMedicalOfficer
              as_user_id: "${team_a_id}"
            - call: "POST /transactions/${txn_ir_id}/decide"
              payload: { decision: "APPROVE" }
              as: LeagueOfficer
              as_user_id: "league-officer-1"
          assert:
            - "after the first trigger call: Player.${p1_id}.medical_status == REHAB while Player.${p1_id}.roster_designation is still ACTIVE"
            - "after the first trigger call: InjuryDesignation.${inj1_id}.status == PAPERWORK_FILED and paperwork_filed_at == 2026-08-10T14:00:00Z"
            - "after the third trigger call: Player.${p1_id}.roster_designation == INJURED_RESERVE"
            - "after the third trigger call: Player.${p1_id}.medical_status == REHAB (the designation move did not reset the medical dimension)"
            - "InjuryDesignation.${inj1_id}.status == ACTIVE, minimum_stay_days == 21, activated_at == 2026-08-10T14:00:00Z"
            - "InjuryDesignation.${inj1_id}.return_window_opens_at == 2026-08-31T14:00:00Z"
            - "InjuryDesignation.${inj1_id}.return_window_closes_at == 2026-09-21T14:00:00Z"
