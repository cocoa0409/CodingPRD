        claim_type: cross_reference_link
        grounds: [entities.OrderLine.fields.order_id, entities.OrderLine.fields.catalog_item_id]
        distinguishing_aspect: "Both FK directions are readable: the order's sub-resource lists its lines, and the catalog item's sub-resource lists lines referencing it."
        test_recipe:
          setup: ["order with primary pump line plus one garment line"]
          setup_api_calls:
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
