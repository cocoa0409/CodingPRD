      - name: pass_through_granted_versus_denied_moves_the_single_bucket
        claim_type: correct_result
        grounds:
          - calculations.pass_through_beneficiary_attribution
          - entities.DepositAccount.fields.recordkeeping_status
        distinguishing_aspect: "recordkeeping_status alone decides who owns the omnibus balance: on the COMPLETE account each PARTICIPANT is credited 15000000 into their own SINGLE bucket and the broker gets nothing, while on the DEFICIENT account the whole 30000000 lands in the broker's SINGLE bucket and the participants get nothing — so the broker ends up 25000000 insured / 5000000 uninsured from the deficient account only."
        test_recipe:
          setup:
            - "Institution 61030 is CLOSED_IN_RECEIVERSHIP with broker Vantage Deposits and participants Yuki and Zane."
            - "BR-COMPLETE (30000000, recordkeeping_status COMPLETE) carries PARTICIPANT interests Yuki 5000 bps and Zane 5000 bps: each is credited round_half_up(30000000 * 5000 / 10000) = 15000000."
            - "BR-DEFICIENT (30000000, recordkeeping_status DEFICIENT) credits its full 30000000 to the broker's SINGLE bucket."
            - "Broker: attributed 30000000, insured min(30000000, 25000000) = 25000000, uninsured 5000000. Yuki and Zane: attributed 15000000, insured 15000000, uninsured 0."
            - "booked total 60000000, reported 60000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
