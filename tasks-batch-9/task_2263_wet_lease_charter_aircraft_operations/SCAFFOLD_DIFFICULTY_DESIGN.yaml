  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: activation_requires_live_regulatory_determination_on_the_docket
        grounds:
          - state_machines.LeaseAgreement[APPROVED -> ACTIVE]
          - state_machines.RegulatoryApproval[UNDER_REVIEW -> CONDITIONAL]
          - state_machines.RegulatoryApproval[APPROVED -> REVOKED]
          - validations[priority 56 ERR_REGULATORY_APPROVAL_MISSING]
          - errors.ERR_REGULATORY_APPROVAL_MISSING
          - endpoints[POST /wetlease/leases/{leaseId}/activate]
        distinguishing_aspect: |
          Activation is gated on a DIFFERENT entity's state, and the gate accepts two of the five
          docket states: lease A activates with determination CONDITIONAL (open condition codes
          and all), while lease B - whose own status is still APPROVED - is refused with
          ERR_REGULATORY_APPROVAL_MISSING because its docket was revoked after the lease reached
          APPROVED. Reading only LeaseAgreement.status, or treating CONDITIONAL as not-yet-
          approved, gets exactly one of the two cases wrong.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Two airframes: AC1 G-ACMI and AC2 G-BCMI, both B738 / family B737 / MP-B738-REV12 / AVAILABLE."
            - "Lease A on AC1 reaches APPROVED via a CONDITIONAL determination carrying open_condition_codes [OPS_MANUAL_AMENDMENT] and no expires_on."
            - "Lease B on AC2 reaches APPROVED via an APPROVED determination which the authority then REVOKES; because lease B is APPROVED rather than ACTIVE it stays APPROVED with a REVOKED docket."
            - "Both leases carry a conforming ACTIVE certificate and a QUALIFIED captain."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LessorOpsController
            - call: "POST /wetlease/lessees"
              payload: { name: "Meridian Charter Group", icao_code: "MCG", home_base_icao: "EGSS", credit_limit_usd_cents: 500000000 }
              as: BillingAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /wetlease/aircraft"
              payload: { tail_number: "G-ACMI", type_designator: "B738", type_family: "B737", seat_count: 189, mtow_kg: 79000, maintenance_program_ref: "MP-B738-REV12", airframe_hours_total: 24000.00, hours_since_last_check: 120.00, cycles_since_last_check: 40 }
              as: MaintenanceController
              captures: { ac1_id: $.data.id }
            - call: "POST /wetlease/aircraft"
              payload: { tail_number: "G-BCMI", type_designator: "B738", type_family: "B737", seat_count: 189, mtow_kg: 79000, maintenance_program_ref: "MP-B738-REV12", airframe_hours_total: 18000.00, hours_since_last_check: 90.00, cycles_since_last_check: 30 }
              as: MaintenanceController
              captures: { ac2_id: $.data.id }
            - call: "POST /wetlease/crew-members"
              payload: { full_name: "A Hallam", employee_no: "EMP-1001", crew_role: "CAPTAIN", type_ratings: ["B738"] }
              as: LessorOpsController
              captures: { cap_id: $.data.id }
            - call: "POST /wetlease/leases"
              payload: { lessee_id: "${lessee_id}", primary_aircraft_id: "${ac1_id}", term_start_date: "2026-09-01", term_end_date: "2026-12-31", block_hour_rate_usd_cents: 480000, min_guaranteed_block_hours_per_month: 5, shortfall_credit_pct: 0.60, crew_provided_by: "LESSOR", maintenance_provided_by: "LESSOR", insurance_provided_by: "LESSOR", operational_control: "LESSOR", substitution_rights: "LESSOR_UNILATERAL", reliability_basis: "DEPARTURE", required_maintenance_program_ref: "MP-B738-REV12", return_hours_since_check_max: 300.00, return_cycles_since_check_max: 120, return_fuel_kg_required: 4000, return_liability_cap_cents: 900000, return_deposit_cents: 500000, redelivery_icao: "EGSS" }
              as: LessorOpsController
              captures: { lease_a_id: $.data.id }
            - call: "POST /wetlease/leases/${lease_a_id}/submit-for-approval"
              payload: { authority_docket_no: "CAA-2026-4471" }
              as: LessorOpsController
              captures: { appr_a_id: $.data.id }
            - call: "POST /wetlease/regulatory-approvals/${appr_a_id}/decision"
              payload: { determination: "CONDITIONAL", conditions: ["OPS_MANUAL_AMENDMENT"] }
              as: RegulatoryAuthority
            - call: "POST /wetlease/insurance-certificates"
              payload: { lease_id: "${lease_a_id}", certificate_no: "COI-88001", hull_limit_usd_cents: 6000000000, liability_limit_usd_cents: 75000000000, breach_of_warranty_endorsed: true, additional_insured_lessee: true, effective_from: "2026-08-15T00:00:00Z", expires_at: "2027-01-31T23:59:59Z" }
              as: InsuranceUnderwriter
            - call: "POST /wetlease/crew-qualifications"
              payload: { crew_member_id: "${cap_id}", lease_id: "${lease_a_id}" }
              as: LessorOpsController
              captures: { q_a_id: $.data.id }
            - call: "POST /wetlease/crew-qualifications/${q_a_id}/complete-checkride"
              payload: { differences_training_completed_on: "2026-08-20", checkride_valid_until: "2027-08-31" }
              as: LessorOpsController
            - call: "POST /wetlease/leases"
              payload: { lessee_id: "${lessee_id}", primary_aircraft_id: "${ac2_id}", term_start_date: "2026-09-01", term_end_date: "2026-12-31", block_hour_rate_usd_cents: 480000, min_guaranteed_block_hours_per_month: 5, shortfall_credit_pct: 0.60, crew_provided_by: "LESSOR", maintenance_provided_by: "LESSOR", insurance_provided_by: "LESSOR", operational_control: "LESSOR", substitution_rights: "LESSOR_UNILATERAL", reliability_basis: "DEPARTURE", required_maintenance_program_ref: "MP-B738-REV12", return_hours_since_check_max: 300.00, return_cycles_since_check_max: 120, return_fuel_kg_required: 4000, return_liability_cap_cents: 900000, return_deposit_cents: 500000, redelivery_icao: "EGSS" }
              as: LessorOpsController
              captures: { lease_b_id: $.data.id }
            - call: "POST /wetlease/leases/${lease_b_id}/submit-for-approval"
              payload: { authority_docket_no: "CAA-2026-4472" }
              as: LessorOpsController
              captures: { appr_b_id: $.data.id }
            - call: "POST /wetlease/regulatory-approvals/${appr_b_id}/decision"
              payload: { determination: "APPROVED" }
              as: RegulatoryAuthority
            - call: "POST /wetlease/insurance-certificates"
              payload: { lease_id: "${lease_b_id}", certificate_no: "COI-88002", hull_limit_usd_cents: 6000000000, liability_limit_usd_cents: 75000000000, breach_of_warranty_endorsed: true, additional_insured_lessee: true, effective_from: "2026-08-15T00:00:00Z", expires_at: "2027-01-31T23:59:59Z" }
              as: InsuranceUnderwriter
            - call: "POST /wetlease/crew-qualifications"
              payload: { crew_member_id: "${cap_id}", lease_id: "${lease_b_id}" }
              as: LessorOpsController
              captures: { q_b_id: $.data.id }
            - call: "POST /wetlease/crew-qualifications/${q_b_id}/complete-checkride"
              payload: { differences_training_completed_on: "2026-08-20", checkride_valid_until: "2027-08-31" }
              as: LessorOpsController
            - call: "POST /wetlease/regulatory-approvals/${appr_b_id}/revoke"
              payload: { revocation_reason: "OPERATIONAL_CONTROL_FINDING" }
              as: RegulatoryAuthority
          trigger:
            - call: "POST /wetlease/leases/${lease_a_id}/activate"
              payload: {}
              as: LessorOpsController
            - call: "POST /wetlease/leases/${lease_b_id}/activate"
              payload: {}
              as: LessorOpsController
          assert:
            - "trigger[0].status == 200"
            - "trigger[0].data.status == ACTIVE"
            - "RegulatoryApproval.${appr_a_id}.determination == CONDITIONAL and open_condition_codes == [OPS_MANUAL_AMENDMENT]"
            - "Aircraft.${ac1_id}.status == ASSIGNED and assigned_lease_id == ${lease_a_id}"
            - "trigger[1].status == 409"
            - "trigger[1].data.error_id == ERR_REGULATORY_APPROVAL_MISSING"
            - "LeaseAgreement.${lease_b_id}.status == APPROVED (unchanged by the refused activation)"
            - "RegulatoryApproval.${appr_b_id}.determination == REVOKED"
            - "Aircraft.${ac2_id}.status == AVAILABLE and assigned_lease_id == null"

      - name: dispatch_requires_airframe_returned_to_service
        grounds:
          - state_machines.Aircraft[ASSIGNED -> IN_MAINTENANCE]
          - state_machines.Aircraft[IN_MAINTENANCE -> ASSIGNED]
          - state_machines.FlightLeg[SCHEDULED -> DISPATCHED]
          - validations[priority 48 ERR_AIRCRAFT_UNAVAILABLE]
          - errors.ERR_AIRCRAFT_UNAVAILABLE
          - endpoints[POST /wetlease/aircraft/{aircraftId}/maintenance-events]
        distinguishing_aspect: |
          The very same dispatch request flips outcome purely on the AIRCRAFT's state: with the
          airframe IN_MAINTENANCE after a GROUND_SCHEDULED event the leg cannot be dispatched
          (409 ERR_AIRCRAFT_UNAVAILABLE) even though the leg itself is SCHEDULED, the lease
          ACTIVE, the crew qualified and the insurance live; after RETURN_TO_SERVICE the identical
          call succeeds. GROUND_SCHEDULED must also leave the leg SCHEDULED rather than cancelling
          it, unlike GROUND_AOG.
