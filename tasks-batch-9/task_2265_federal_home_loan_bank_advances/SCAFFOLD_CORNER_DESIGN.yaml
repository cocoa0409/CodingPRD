  # =========================================================================
  # SECTION 5 — ENDPOINTS
  # =========================================================================
  - section: endpoints
    instances:
      - name: advance_product_create_then_read_round_trip
        claim_type: standard_crud
        grounds: ["endpoints.POST /fhlb/advance-products", "endpoints.GET /fhlb/advance-products/{advance_product_id}"]
        distinguishing_aspect: "AdvanceProduct is the one catalogue entity with no state machine and no parent: create and read must round-trip every declared field, including the optional flags that default to false and 0."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            call: "POST /fhlb/advance-products"
            payload: { product_code: "SYM-500", structure: "CALLABLE", min_term_days: 90, max_term_days: 3650, rate_bps: 500, prepayment_fee_method: "SYMMETRIC_MARKET_VALUE", activity_stock_pct_bps: 400, min_principal_cents: 2500000, symmetric_credit_enabled: true }
            as: SystemAdmin
            captures: { product_id: "$.data.id" }
          assert:
            - "HTTP 201 with data.product_code == \"SYM-500\", data.structure == \"CALLABLE\", data.prepayment_fee_method == \"SYMMETRIC_MARKET_VALUE\", data.symmetric_credit_enabled == true"
            - "data.flat_prepayment_fee_bps == 0, data.requires_collateral_delivery == false, data.community_program_flag == false (defaults applied)"
            - "GET /fhlb/advance-products/{product_id} returns the identical field values with version 1"
            - "a second POST with product_code \"SYM-500\" is refused (product_code is unique) with ERR_INVALID_REQUEST"

      - name: borrowing_capacity_read_defaults_to_certified_variant
        claim_type: computed_read
        grounds: ["endpoints.GET /fhlb/member-banks/{member_bank_id}/borrowing-capacity", "calculations.lendable_collateral_value.variants"]
        distinguishing_aspect: "With the variant query parameter omitted the endpoint must answer CERTIFIED, so an UNDER_REVIEW asset contributes nothing: the same fixture returns 0 by default and a positive number only when PROVISIONAL is requested explicitly."
        test_recipe:
          setup: ["Harbor Savings tier 1 with a BLANKET_LIEN pledge and exactly one submitted SF_MORTGAGE (upb 20,000,000, market value 21,000,000, ltv 7500) that has NOT been reviewed, so it is still UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
