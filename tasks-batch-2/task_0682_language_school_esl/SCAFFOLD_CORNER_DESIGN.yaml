          - errors[ERR_DUPLICATE_EMAIL]
        distinguishing_aspect: "Registering a second student with an email already used (case-insensitive) returns ERR_DUPLICATE_EMAIL 409."
        test_recipe:
          setup: ["One student with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "First", email: "dup@x.com" }
              as: Registrar
          trigger:
            - call: "POST /students"
              payload: { full_name: "Second", email: "DUP@X.COM" }
              as: Registrar
              captures: { eid: $.data.error_id }
          assert:
            - "error.error_id == ERR_DUPLICATE_EMAIL"

