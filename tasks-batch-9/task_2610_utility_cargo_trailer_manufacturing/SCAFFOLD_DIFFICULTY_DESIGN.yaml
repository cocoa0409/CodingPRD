  - rule_id: cross_entity_state_dependency
    instances:
      - name: jig_reservation_blocked_until_model_reaches_certified
        grounds:
          - validations[priority=59]
          - errors.ERR_MODEL_NOT_CERTIFIED
          - state_machines.TrailerModel.IN_ENGINEERING_REVIEW_to_CERTIFIED
          - calculations.gvwr_rating.variants.certified_final
          - entities.TrailerUnit.fields.model_version_pinned
        distinguishing_aspect: |
          The TrailerUnit operation is gated on the state of a DIFFERENT entity (TrailerModel), and the
          same request flips from 409 to 201 with no change to its own payload once only the model advances;
          the success path also proves the certified GVWR is snapshotted onto the unit at that instant.
          Gate entity: TrailerModel. Gated endpoint: jig reservation.
