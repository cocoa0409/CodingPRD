  - rule_id: transitive_cascade
    instances:
      - name: decision_pay_cascade_account_review_hold
        grounds:
          - state_machines.ExceptionItem.OPEN_to_DECISIONED_PAY
          - state_machines.PresentedItem.EXCEPTION_HELD_to_PAID
          - state_machines.Account.ACTIVE_to_REVIEW_HOLD
          - calculations.account_review_threshold
        distinguishing_aspect: |
          Depth-4 cascade: decision PAY flips the exception (1), which pays the
          item and debits the account ledger (2), whose cumulative_paid crossing
          the >= threshold flips the account to REVIEW_HOLD (3), which itself
          forces the NEXT clean item into an ACCOUNT_HOLD_REVIEW exception (4).
          Each link is caused by the previous link, not by the decision directly.
        test_recipe:
          setup:
            - "ACTIVE PAYEE enrollment; account payment_review_threshold_cents = 30001"
            - "Issued checks 301 (30000), 302 (5000), 303 (6000); item for 301 presented at 30001 -> AMOUNT_MISMATCH exception (tolerance 0)"
          setup_api_calls:
            - { call: "POST /treasury/enrollments", payload: { business_name: "HoldCo", tier: "PAYEE_POSITIVE_PAY", default_decision: "RETURN" }, as: BankTreasuryManager, captures: { enr: $.data.id } }
            - { call: "POST /treasury/accounts", payload: { enrollment_id: "${enr}", account_number: "970001", payment_review_threshold_cents: 30001 }, as: BankTreasuryManager, captures: { acct: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Admin", user_role: "ADMIN" }, as: BankTreasuryManager, captures: { adm: $.data.id } }
            - { call: "POST /treasury/enrollment-users", payload: { enrollment_id: "${enr}", display_name: "Dec", user_role: "DECISION_MAKER" }, as: BankTreasuryManager, captures: { dm: $.data.id } }
            - { call: "POST /treasury/training-sessions", payload: { enrollment_id: "${enr}", trainer_id: "tr-1", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: BankOps, captures: { sess: $.data.id } }
            - { call: "POST /treasury/training-sessions/${sess}/complete", payload: { attendee_user_ids: ["${adm}"] }, as: BankOps }
            - { call: "POST /treasury/enrollments/${enr}/activate", payload: {}, as: BankTreasuryManager }
            - { call: "POST /treasury/issue-files", payload: { enrollment_id: "${enr}", account_id: "${acct}", file_reference: "F-HOLD", rows: [ { check_number: "301", amount_cents: 30000, payee_name: "GAMMA INC", issue_date: "2026-08-01" }, { check_number: "302", amount_cents: 5000, payee_name: "DELTA CO", issue_date: "2026-08-01" }, { check_number: "303", amount_cents: 6000, payee_name: "EPSILON LTD", issue_date: "2026-08-01" } ] }, as: CustomerAdmin, as_user_id: "${adm}" }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "301", amount_cents: 30001, payee_name_raw: "GAMMA INC", channel: "TELLER", presented_at: "2026-08-03T10:00:00Z" }, as: BankOps, captures: { it1: $.data.id, ex1: $.data.exception_id, r1: $.data.match_result } }
          trigger:
            - { call: "POST /treasury/exceptions/${ex1}/decision", payload: { decision: "PAY" }, as: CustomerDecisionMaker, as_user_id: "${dm}" }
            - { call: "GET /treasury/accounts/${acct}", payload: {}, as: BankOps, captures: { a_st: $.data.status, a_paid: $.data.cumulative_paid_cents } }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "302", amount_cents: 5000, payee_name_raw: "DELTA CO", channel: "TELLER", presented_at: "2026-08-03T11:00:00Z" }, as: BankOps, captures: { it2_st: $.data.status, it2_res: $.data.match_result } }
            - { call: "POST /treasury/accounts/${acct}/clear-review-hold", payload: {}, as: BankOps, captures: { a_st2: $.data.status } }
            - { call: "POST /treasury/presented-items", payload: { account_id: "${acct}", check_number: "303", amount_cents: 6000, payee_name_raw: "EPSILON LTD", channel: "TELLER", presented_at: "2026-08-03T11:30:00Z" }, as: BankOps, captures: { it3_st: $.data.status } }
            - { call: "GET /treasury/accounts/${acct}", payload: {}, as: BankOps, captures: { a_paid2: $.data.cumulative_paid_cents } }
          assert:
            - "Link 1-2: exception ${ex1} DECISIONED_PAY; item ${it1} pays at the PRESENTED amount 30001"
            - "Link 3: cumulative_paid_cents == 30001 >= threshold 30001 (>= boundary) => a_st == REVIEW_HOLD"
            - "Link 4: while REVIEW_HOLD, a perfectly clean item (302/5000) does NOT pay: it2_st == EXCEPTION_HELD, it2_res == ACCOUNT_HOLD_REVIEW"
            - "Restore: clear-review-hold => a_st2 == ACTIVE; next clean item (303) pays: it3_st == PAID and a_paid2 == 36001 (30001 + 6000)"

      - name: bank_liable_resolution_cascade_enrollment_suspension
        grounds:
          - state_machines.LiabilityCase.UNDER_REVIEW_to_RESOLVED_BANK_LIABLE
          - state_machines.TreasuryEnrollment.ACTIVE_to_SUSPENDED
          - entities.TreasuryEnrollment.fields.ytd_bank_loss_cents
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (case resolve, not exception
          decision): resolve BANK_LIABLE finalizes the provisional credit and
          accrues ytd_bank_loss (1->2); the loss crossing the enrollment's
