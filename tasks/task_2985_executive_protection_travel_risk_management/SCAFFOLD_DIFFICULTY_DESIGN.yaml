            - call: "POST /exec-protection/security-staff"
              payload: { full_name: "Lee Lead", staff_role: "ANALYST", certification_expires_at: "2027-01-01T00:00:00Z", hourly_rate_cents: 7777 }
              as: SystemOperator
              as_user_id: "ops-1"
