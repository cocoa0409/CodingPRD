              as: BoardClerk
              as_user_id: "clerk-1"
            - call: "POST /land-bank/acquisition-packets/${pk_id}/close"
              payload: { deed_reference: "BK-4590-PG-01" }
              as: IntakeOfficer
              as_user_id: "intake-2"
            - call: "POST /land-bank/properties/${p_id}/title-actions"
              payload: { action_type: "TAX_DEED_CONFIRMATION" }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { ta_id: $.data.id }
            - call: "POST /land-bank/title-actions/${ta_id}/adjudicate"
              payload: { outcome: "CLEARED" }
              as: IntakeOfficer
              as_user_id: "intake-1"
            - call: "POST /land-bank/contractors"
              payload: { name: "Wrecking Ball Co", license_expires_on: "2027-12-31T00:00:00Z", max_concurrent_crews: 2, specialties: ["DEMOLITION"] }
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { ctr_id: $.data.id }
            - call: "GET /land-bank/properties/${p_id}"
              payload: {}
              as: InventoryManager
              as_user_id: "inv-1"
              captures: { p_v: $.data.version }
            - call: "POST /land-bank/properties/${p_id}/maintenance-orders"
              payload: { work_type: "DEMOLITION", contractor_id: "${ctr_id}", funding_source_id: "${fs_id}", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-20T00:00:00Z", expected_property_version: "${p_v}" }
              as: InventoryManager
