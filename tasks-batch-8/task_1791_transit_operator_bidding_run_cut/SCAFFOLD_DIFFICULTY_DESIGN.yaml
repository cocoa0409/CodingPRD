              payload: { operator_id: "${opy_id}" }
              as: SchedulingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VACATION_SLOT_FULL (allocated_count == capacity == 1)"
            - "VacationSlot.${slot_id}.status == FULLY_ALLOCATED"
            - "Operator.${opy_id}.vacation_hours_balance == 200 (not decremented)"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances, different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bid_entry_requires_run_posted
        grounds:
          - state_machines.BidEntry.SUBMITTED_to_AWARDED
          - validations[priority=11]
          - errors[ERR_RUN_NOT_BIDDABLE]
        distinguishing_aspect: |
          Pair (BidEntry, Run): a BidEntry can only be created against a Run
          that belongs to the same sign-up and is biddable; run in CUT status
          (not yet POSTED) rejects with ERR_RUN_NOT_BIDDABLE.
        test_recipe:
          setup:
            - "SignUpPeriod OPEN; Run R in status CUT (created after post-runs, never validated)"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "XD", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "R0", service_date: "2026-09-06", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/cut-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/post-runs"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/open-picking"
              payload: {}
              as: SchedulingOfficer
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "RNEW", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 700, platform_minutes: 400 } ] }
              as: SchedulingOfficer
              captures: { run_new_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Op One", hire_date: "2000-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { op_id: $.data.id }
            - call: "GET /api/sign-up-periods/${sup_id}"
              payload: {}
              as: SchedulingOfficer
              captures: { sup_v: $.data.version }
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/bid-entries"
              payload: { operator_id: "${op_id}", run_id: "${run_new_id}", preference_rank: 1, expected_sign_up_period_version: "${sup_v}" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RUN_NOT_BIDDABLE (Run still CUT, not POSTED)"

      - name: absence_cover_requires_scheduled_assignment
        grounds:
          - state_machines.AbsenceCase.REPORTED_to_COVERED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair (AbsenceCase, DailyAssignment): cover requires the absent
          operator to hold a SCHEDULED DailyAssignment with non-null run_id
          on absence_date; absence with no such assignment rejects — a
          different entity pair from (BidEntry, Run).
        test_recipe:
          setup:
            - "Operator O has no DailyAssignment on 2026-09-07 (never awarded any run)"
            - "AbsenceCase AC REPORTED for O on 2026-09-07"
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Op One", hire_date: "2000-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { op_id: $.data.id }
            - call: "POST /api/absence-cases"
              payload: { operator_id: "${op_id}", absence_date: "2026-09-07", reason_code: "SICK" }
              as: SchedulingOfficer
              captures: { ac_id: $.data.id, ac_v: $.data.version }
          trigger:
            - call: "POST /api/absence-cases/${ac_id}/cover"
              payload: { allow_overtime: true, expected_absence_case_version: "${ac_v}" }
              as: SchedulingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (no SCHEDULED assignment to cover)"
            - "AbsenceCase.${ac_id}.status == REPORTED (unchanged)"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: run_pieces_overlap_rejection
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_RUN_PIECES]
          - calculations.run_paid_minutes
        distinguishing_aspect: |
          Half-open interval semantics on the Run resource: two pieces on the
          same run overlap when piece2.report < piece1.release (adjacency at
          exactly release==report is legal). Overlap rejected via
          POST /api/sign-up-periods/{id}/runs.
        test_recipe:
          setup:
            - "SignUpPeriod S in DRAFT"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "Ov", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /api/sign-up-periods/${sup_id}/runs"
              payload: { run_number: "RO", service_date: "2026-09-07", pieces: [ { report_minutes: 300, release_minutes: 500, platform_minutes: 200 }, { report_minutes: 450, release_minutes: 700, platform_minutes: 250 } ] }
              as: SchedulingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_RUN_PIECES (piece2.report 450 < piece1.release 500)"
            - "no Run persisted"

      - name: vacation_slot_capacity_exclusion_window
        grounds:
          - calculations.vacation_allocation_order
          - validations[priority=13]
        distinguishing_aspect: |
          Aggregate-capacity semantics on the VacationSlot resource (not
          geometric adjacency): the week window has capacity N; the N-th
          grant succeeds, the N+1-th fails with ERR_VACATION_SLOT_FULL even
          though each individual grant is valid — different interval semantic
          (capacity pool vs geometric overlap) on a different resource.
        test_recipe:
          setup:
            - "VacationSlot V capacity 2; operators A,B,C each balance 200"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "VC", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "EA", full_name: "Op A", hire_date: "2000-01-01", vacation_hours_balance: 200 }
              as: SchedulingOfficer
              captures: { opa_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "EB", full_name: "Op B", hire_date: "2001-01-01", vacation_hours_balance: 200 }
              as: SchedulingOfficer
              captures: { opb_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "EC", full_name: "Op C", hire_date: "2002-01-01", vacation_hours_balance: 200 }
              as: SchedulingOfficer
              captures: { opc_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/vacation-slots"
              payload: { week_start_date: "2026-10-05", capacity: 2 }
              as: SchedulingOfficer
              captures: { slot_id: $.data.id }
            - call: "POST /api/vacation-slots/${slot_id}/grant"
              payload: { operator_id: "${opa_id}" }
              as: SchedulingOfficer
            - call: "POST /api/vacation-slots/${slot_id}/grant"
              payload: { operator_id: "${opb_id}" }
              as: SchedulingOfficer
          trigger:
            - call: "POST /api/vacation-slots/${slot_id}/grant"
              payload: { operator_id: "${opc_id}" }
              as: SchedulingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "first two grants succeed (allocated_count reaches 2 == capacity)"
            - "third grant error_id == ERR_VACATION_SLOT_FULL"
            - "VacationSlot.${slot_id}.status == FULLY_ALLOCATED"

  # =========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: vacation_balance_conservation
        grounds:
          - calculations.vacation_allocation_order
          - state_machines.VacationSlot
        distinguishing_aspect: |
          Conserved quantity: operator vacation_hours_balance. A successful
          grant decrements balance by exactly 40 and increments
          allocated_count by 1; a rejected grant leaves both unchanged —
          sum(balance) + 40*sum(allocated_count) is invariant across grant
          attempts.
        test_recipe:
          setup:
            - "Operator O balance 200; VacationSlot V capacity 1"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "VI", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "E1", full_name: "Op One", hire_date: "2000-01-01", vacation_hours_balance: 200 }
              as: SchedulingOfficer
              captures: { op_id: $.data.id }
            - call: "POST /api/sign-up-periods/${sup_id}/vacation-slots"
              payload: { week_start_date: "2026-10-05", capacity: 1 }
              as: SchedulingOfficer
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /api/vacation-slots/${slot_id}/grant"
              payload: { operator_id: "${op_id}" }
              as: SchedulingOfficer
            - call: "POST /api/vacation-slots/${slot_id}/grant"
              payload: { operator_id: "${op_id}" }
              as: SchedulingOfficer
              captures: { err: $.data.error_id }
            - call: "GET /api/operators/${op_id}"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "after successful grant: Operator.${op_id}.vacation_hours_balance == 160"
            - "after successful grant: VacationSlot.${slot_id}.allocated_count == 1"
            - "second grant rejected ERR_VACATION_SLOT_FULL, balance still 160, allocated_count still 1"

      - name: ot_remedy_minutes_conservation
        grounds:
          - state_machines.GrievanceCase.FILED_to_UPHELD
          - calculations.ot_equalization_pick
        distinguishing_aspect: |
          Conserved quantity: total OT exposure across the roster. Upholding
          an OT_EQUALIZATION grievance credits remedy_minutes to the grieving
          operator's weekly_ot_minutes_accum; dismissing leaves all
          accumulators unchanged — the roster sum of weekly_ot_minutes_accum
          changes only via close-out FINAL minutes or an upheld remedy, and
          a dismiss must not drift it.
        test_recipe:
          setup:
            - "Operator G (griever) weekly_ot_minutes_accum == 0; GrievanceCase GC FILED category OT_EQUALIZATION"
          setup_api_calls:
            - call: "POST /api/sign-up-periods"
              payload: { name: "GR", effective_start_date: "2026-09-01", effective_end_date: "2026-11-30", spread_limit_minutes: 780, paid_break_minutes: 30, daily_ot_threshold_minutes: 480, weekly_ot_threshold_minutes: 2400, extra_board_ratio_pct: 20 }
              as: SchedulingOfficer
              captures: { sup_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "EG", full_name: "Op G", hire_date: "2000-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { opg_id: $.data.id }
            - call: "POST /api/operators"
              payload: { employee_number: "EH", full_name: "Op H", hire_date: "2001-01-01", vacation_hours_balance: 0 }
              as: SchedulingOfficer
              captures: { oph_id: $.data.id }
            - call: "POST /api/grievance-cases"
              payload: { filed_by_operator_id: "${opg_id}", sign_up_period_id: "${sup_id}", category: "OT_EQUALIZATION", detail: "junior got OT while I sat" }
              as: UnionRep
              captures: { gc_id: $.data.id }
          trigger:
            - call: "POST /api/grievance-cases/${gc_id}/dismiss"
              payload: {}
              as: UnionRep
            - call: "GET /api/operators/${opg_id}"
              payload: {}
              as: SchedulingOfficer
            - call: "GET /api/operators/${oph_id}"
              payload: {}
              as: SchedulingOfficer
          assert:
            - "GrievanceCase.${gc_id}.status == DISMISSED"
            - "Operator.${opg_id}.weekly_ot_minutes_accum == 0 (unchanged by dismiss)"
            - "Operator.${oph_id}.weekly_ot_minutes_accum == 0 (unchanged)"
