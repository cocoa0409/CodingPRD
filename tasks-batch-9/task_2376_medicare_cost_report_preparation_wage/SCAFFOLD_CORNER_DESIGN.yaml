              payload: { decision: "ACCEPT", review_note: "Initial desk review passed" }
              as: MacAuditor
            - call: "POST /cost-reports/${report_id}/ucc-data-sets"
              payload: { medicaid_non_medicare_days: 7495, total_inpatient_days: 100000, ssi_days: 7495, medicare_part_a_days: 100000, charity_care_charges_cents: 40000000, non_medicare_bad_debt_cents: 10000000 }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/file"
              payload: {}
              as: ReimbursementManager
            - call: "POST /cost-reports/${report_id}/settlements"
              payload: { stage: "TENTATIVE" }
              as: MacAuditor
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: MacAuditor
              captures: { report_version_2: $.data.version }
            - call: "POST /cost-reports/${report_id}/stepdown-runs"
              payload: { expected_cost_report_version: "${report_version_2}", method: "DOUBLE_APPORTIONMENT" }
              as: MacAuditor
            - call: "POST /cost-reports/${report_id}/settlements"
              payload: { stage: "FINAL" }
              as: MacAuditor
              captures: { settlement_final_id: $.data.id }
            - call: "GET /providers/${provider_id}"
              payload: {}
              as: ReimbursementManager
              captures: { provider_version_1: $.data.version }
          trigger:
            - call: "POST /interim-rate-requests"
              payload: { provider_id: "${provider_id}", expected_provider_version: "${provider_version_1}", basis_cost_report_id: "${report_id}", projected_discharges: 500, trend_factor: 0.3500, effective_from: "2026-10-01", effective_to: "2027-03-31" }
              as: ReimbursementManager
              captures: { request_id: $.data.id, variance: $.data.variance_ratio }
          assert:
            - "HTTP status is 201 and no error_id is present"
            - "${variance} == 0.1000"
            - "InterimRateRequest.${request_id}.projected_cost_per_discharge_cents == 810000"
            - "InterimRateRequest.${request_id}.approved_rate_cents == 810000"
            - "InterimRateRequest.${request_id}.adjustment_amount_cents == -45000000"
            - "InterimRateRequest.${request_id}.status == PENDING"
            - "Provider.${provider_id}.current_interim_rate_cents == 900000 (unchanged until the contractor decides)"
            - "Provider.${provider_id}.version == ${provider_version_1}"

      - name: uncompensated_care_figures_are_reconciled_when_the_cost_to_charge_ratio_appears
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.dsh_and_ucc_compilation
          - entities.UccDataSet.fields.uncompensated_care_cost_cents
          - state_machines.StepdownRun[QUEUED->COMPLETED] link 3
        distinguishing_aspect: "The UccDataSet is compiled BEFORE any allocation exists, so its snapshot cost_to_charge_ratio is 0.000000 and charity care contributes nothing - only the bad-debt term 6500000 survives. Completing the stepdown run then republishes the derived fields from the new ratio 0.750000 (30000000 + 6500000 = 36500000) without any second POST, proving the derived field is reconciled on source change and not frozen at create."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a DRAFT CostReport with total_charges_cents 400000000 and no allocation yet"
            - "one UccDataSet compiled while cost_to_charge_ratio is still 0.000000"
            - "DSH data at the eligibility boundary: medicaid_fraction 0.0750 + ssi_fraction 0.0750 = 0.1500"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries", amount_cents: 200000000, mapped_cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/ucc-data-sets"
              payload: { medicaid_non_medicare_days: 7495, total_inpatient_days: 100000, ssi_days: 7495, medicare_part_a_days: 100000, charity_care_charges_cents: 40000000, non_medicare_bad_debt_cents: 10000000 }
              as: ReimbursementAnalyst
              captures: { ucc_id: $.data.id, ucc_cost_at_create: $.data.uncompensated_care_cost_cents, ucc_payment_at_create: $.data.ucc_payment_cents, ratio_at_create: $.data.cost_to_charge_ratio }
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementAnalyst
              captures: { report_version_1: $.data.version }
          trigger:
            - call: "POST /cost-reports/${report_id}/stepdown-runs"
              payload: { expected_cost_report_version: "${report_version_1}", method: "SINGLE_APPORTIONMENT" }
              as: ReimbursementAnalyst
              captures: { run_id: $.data.id }
          assert:
            - "HTTP status is 201 and no error_id is present"
            - "${ratio_at_create} == 0.000000"
            - "${ucc_cost_at_create} == 6500000"
            - "${ucc_payment_at_create} == 1300000"
            - "UccDataSet.${ucc_id}.cost_to_charge_ratio == 0.750000"
            - "UccDataSet.${ucc_id}.uncompensated_care_cost_cents == 36500000"
            - "UccDataSet.${ucc_id}.ucc_payment_cents == 7300000"
            - "UccDataSet.${ucc_id}.dsh_patient_percentage == 0.1500"
            - "UccDataSet.${ucc_id}.dsh_eligible == true"
            - "UccDataSet.${ucc_id}.recompute_required == false"
            - "CostReport.${report_id}.cost_to_charge_ratio == 0.750000"

      - name: three_level_cascade_from_the_stepdown_run_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.StepdownRun[QUEUED->COMPLETED]
          - calculations.dsh_and_ucc_compilation
          - entities.Settlement.fields.recompute_required
        excluded_because:
          difficulty_instance: "transitive_cascade / stepdown_completion_cascades_through_ucc_to_settlement_flag"
          rationale: "That depth instance already walks all four links of the completion cascade in one request - cost centers, then CostReport.total_allowable_cost_cents and cost_to_charge_ratio, then the UccDataSet figures, then Settlement.recompute_required - and asserts each level's literal value, so a breadth copy would duplicate the whole chain."

      - name: cascade_ordering_sensitivity_after_an_audit_incorporation
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AuditAdjustment[PROTESTED->RESOLVED_INCORPORATED]
          - endpoints[POST /audit-adjustments/{id}/resolve]
          - entities.CostReport.fields.allocation_status
        excluded_because:
          difficulty_instance: "transitive_cascade / audit_adjustment_incorporation_cascades_to_stale_allocation"
          rationale: "That depth instance covers the ordering-sensitive half of this layer: INCORPORATE must synthesize the AUDIT workpaper entry BEFORE staling the run and the report, and it asserts the intermediate cost figures that reveal a wrong order."

      - name: both_apportionment_variants_produce_their_own_result
        claim_type: dual_variant_calculation
        grounds:
          - calculations.stepdown_allocation.variants
          - entities.StepdownRun.fields.method
        excluded_because:
          difficulty_instance: "dual_variant_calc / stepdown_single_vs_double_apportionment_divergence"
          rationale: "That depth instance runs both SINGLE_APPORTIONMENT and DOUBLE_APPORTIONMENT over one identical cost structure and asserts the per-center divergence plus the invariant total, which is exactly the 'both variants plus delta on switch' claim."

      - name: both_average_hourly_wage_variants_produce_their_own_result
        claim_type: dual_variant_calculation
        grounds:
          - calculations.average_hourly_wage.variants
          - entities.WageIndexSubmission.fields.occ_mix_adjusted_ahw_cents
        excluded_because:
          difficulty_instance: "dual_variant_calc / wage_index_unadjusted_vs_occ_mix_adjusted_hourly_wage"
          rationale: "That depth instance asserts the unadjusted and occupational-mix-adjusted hourly wages side by side on one submission and the delta between them, covering this layer's second declared variant pair."

      - name: dsh_eligibility_threshold_is_tested_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.dsh_and_ucc_compilation.constants.DSH_ELIGIBILITY_THRESHOLD
          - entities.UccDataSet.fields.dsh_eligible
        excluded_because:
          difficulty_instance: "boundary_precision_check / dsh_patient_percentage_exactly_at_eligibility_threshold"
          rationale: "That depth instance pins the cumulative-threshold boundary: rounding each fraction to 4 dp first gives exactly 0.1500 and qualifies, while summing the raw quotients gives 0.1499 and does not, so the boundary and the rounding order are already probed together."

  - section: consistency model
    # §1.0 declares consistency_model: immediate, so the only applicable row of
    # the guide's table is `immediate` ("all changes visible in same request's
    # response"). The `eventual` and `saga` rows are non-applicable: no field is
    # allowed to lag a write and no multi-request workflow is rolled back
    # asynchronously - every refusal in §1.4 is evaluated before any write.
    instances:

      - name: the_map_response_and_the_immediately_following_reads_agree
        claim_type: immediate
        grounds:
          - endpoints[POST /trial-balance-lines/{id}/map]
          - calculations.trial_balance_mapping_rollup
          - consistency_model=immediate
        distinguishing_aspect: "Mapping ledger line 6200 rolls cost into cost center 03000 and out of CostReport.unmapped_tb_total_cents; the very next reads - with no intervening write and no retry - already show direct_cost_cents 200000000, unmapped_tb_total_cents 0 and the line in the center's own collection, so no derived figure is allowed to lag its write."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a DRAFT CostReport with cost centers 00100 (GENERAL_SERVICE) and 03000 (ROUTINE)"
            - "one UNMAPPED TrialBalanceLine 6200 for 200000000 cents and one line 6000 for 100000000 cents already mapped to 00100"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries", amount_cents: 200000000 }
              as: ReimbursementAnalyst
              captures: { tb_nursing_id: $.data.id }
          trigger:
            - call: "POST /trial-balance-lines/${tb_nursing_id}/map"
              payload: { cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
              captures: { line_status: $.data.status, line_center: $.data.mapped_cost_center_id }
            - call: "GET /cost-centers/${cc_routine}"
              payload: {}
              as: ReimbursementAnalyst
              captures: { routine_direct: $.data.direct_cost_cents }
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementAnalyst
              captures: { unmapped_total: $.data.unmapped_tb_total_cents, direct_total: $.data.total_direct_cost_cents }
            - call: "GET /cost-centers/${cc_routine}/trial-balance-lines"
              payload: {}
              as: ReimbursementAnalyst
          assert:
            - "all four calls return 2xx and none carries an error_id"
            - "${line_status} == \"MAPPED\""
            - "${line_center} == \"${cc_routine}\""
            - "${routine_direct} == 200000000"
            - "${unmapped_total} == 0"
            - "${direct_total} == 300000000"
            - "GET /cost-centers/${cc_routine}/trial-balance-lines returns total_count == 1 and its only item's gl_account is \"6200\""
            - "CostReport.${report_id}.allocation_status == NOT_RUN"

      - name: the_filing_response_body_already_carries_what_the_reads_return
        claim_type: immediate
        grounds:
          - endpoints[POST /cost-reports/{id}/file]
          - endpoints[GET /cost-reports/{id}/gme-summary]
          - calculations.gme_fte_rolling_average
          - consistency_model=immediate
        distinguishing_aspect: "Filing stamps filed_at from the logical clock and recomputes the GME figures inside the same request: the file response, the immediately following report read and the computed gme-summary read all show status FILED, filed_at 2026-08-01T00:00:00Z and rolling_average_fte 0.08 - the computed read recomputes rather than serving a stale materialization, so all three agree on the first attempt."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a DRAFT CostReport that is filing-ready: allocation CURRENT, wage submission ACCEPTED, one UccDataSet, unmapped ledger cost 0"
            - "one WITHIN_IRP resident with a single 31-day ACTIVE rotation inside the fiscal year"
          setup_api_calls:
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /providers"
              payload: { ccn: "450123", name: "Mercy General Hospital", cbsa_code: "19100", teaching_status: "TEACHING", fte_cap: 2.00, current_interim_rate_cents: 900000 }
              as: SystemAdmin
              captures: { provider_id: $.data.id }
            - call: "POST /cost-reports"
              payload: { provider_id: "${provider_id}", fiscal_year_begin: "2025-07-01", fiscal_year_end: "2026-06-30", apportionment_method: "SINGLE_APPORTIONMENT", medicare_utilization_ratio: 0.4000, interim_payments_received_cents: 20000000, total_charges_cents: 400000000, medicare_discharges: 500 }
              as: SystemAdmin
              captures: { report_id: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "00100", name: "Administrative and General", center_type: "GENERAL_SERVICE", allocation_basis: "SQUARE_FEET", stepdown_order: 1, statistics: { SQUARE_FEET: 0 } }
              as: ReimbursementAnalyst
              captures: { cc_ag: $.data.id }
            - call: "POST /cost-reports/${report_id}/cost-centers"
              payload: { code: "03000", name: "Adults and Pediatrics", center_type: "ROUTINE", statistics: { SQUARE_FEET: 3000 } }
              as: ReimbursementAnalyst
              captures: { cc_routine: $.data.id }
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6000", description: "Administration salaries", amount_cents: 100000000, mapped_cost_center_id: "${cc_ag}" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/trial-balance-lines"
              payload: { gl_account: "6200", description: "Nursing salaries", amount_cents: 200000000, mapped_cost_center_id: "${cc_routine}" }
              as: ReimbursementAnalyst
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementAnalyst
              captures: { report_version_1: $.data.version }
            - call: "POST /cost-reports/${report_id}/stepdown-runs"
              payload: { expected_cost_report_version: "${report_version_1}", method: "SINGLE_APPORTIONMENT" }
              as: ReimbursementAnalyst
            - call: "POST /cost-reports/${report_id}/wage-index-submissions"
              payload: { total_salaries_cents: 5000000000, total_paid_hours: 2000000.00, wage_related_costs_cents: 1500000000, contract_labor_cents: 200000000, contract_labor_hours: 80000.00, excluded_area_salaries_cents: 100000000, excluded_area_hours: 50000.00 }
              as: ReimbursementAnalyst
              captures: { wis_id: $.data.id }
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "RN", reported_hours: 1200000.00, reported_salaries_cents: 4200000000 }
              as: ReimbursementAnalyst
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "LPN", reported_hours: 200000.00, reported_salaries_cents: 400000000 }
              as: ReimbursementAnalyst
            - call: "POST /wage-index-submissions/${wis_id}/occ-mix-responses"
              payload: { category: "NURSE_AIDE", reported_hours: 500000.00, reported_salaries_cents: 750000000 }
              as: ReimbursementAnalyst
            - call: "POST /wage-index-submissions/${wis_id}/submit"
              payload: {}
              as: ReimbursementManager
            - call: "POST /wage-index-submissions/${wis_id}/start-review"
              payload: {}
              as: MacAuditor
            - call: "POST /wage-index-submissions/${wis_id}/review-decision"
              payload: { decision: "ACCEPT", review_note: "Initial desk review passed" }
              as: MacAuditor
            - call: "POST /cost-reports/${report_id}/ucc-data-sets"
              payload: { medicaid_non_medicare_days: 7495, total_inpatient_days: 100000, ssi_days: 7495, medicare_part_a_days: 100000, charity_care_charges_cents: 40000000, non_medicare_bad_debt_cents: 10000000 }
              as: ReimbursementAnalyst
            - call: "POST /providers/${provider_id}/residents"
              payload: { full_name: "Dana Okafor MD", program: "Internal Medicine", irp_status: "WITHIN_IRP" }
              as: ReimbursementAnalyst
              captures: { resident_id: $.data.id }
            - call: "POST /residents/${resident_id}/rotation-assignments"
              payload: { cost_center_id: "${cc_routine}", start_date: "2025-07-01", end_date: "2025-08-01", fte_fraction: 1.00 }
              as: ReimbursementAnalyst
              captures: { rotation_id: $.data.id }
          trigger:
            - call: "POST /cost-reports/${report_id}/file"
              payload: {}
              as: ReimbursementManager
              captures: { filed_status: $.data.status, filed_at: $.data.filed_at, filed_rolling: $.data.rolling_average_fte }
            - call: "GET /cost-reports/${report_id}"
              payload: {}
              as: ReimbursementManager
              captures: { read_status: $.data.status, read_filed_at: $.data.filed_at, read_rolling: $.data.rolling_average_fte }
            - call: "GET /cost-reports/${report_id}/gme-summary"
              payload: {}
              as: ReimbursementManager
              captures: { summary_days: $.data.period_days, summary_fte_days: $.data.unweighted_fte_days_total, summary_rolling: $.data.rolling_average_fte }
          assert:
            - "all three calls return 2xx and none carries an error_id"
            - "${filed_status} == \"FILED\" and ${read_status} == \"FILED\""
            - "${filed_at} == \"2026-08-01T00:00:00Z\" and ${read_filed_at} == \"2026-08-01T00:00:00Z\""
            - "${filed_rolling} == 0.08 and ${read_rolling} == 0.08 and ${summary_rolling} == 0.08"
            - "${summary_days} == 365"
            - "${summary_fte_days} == 31.0000"
            - "RotationAssignment.${rotation_id}.overlap_days == 31"
            - "Resident.${resident_id}.assigned_fte_days == 31.0000"
            - "CostReport.${report_id}.amendment_count == 0"
