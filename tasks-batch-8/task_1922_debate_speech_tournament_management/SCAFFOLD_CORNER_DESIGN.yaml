            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_b}", name: "J-Beta" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { j_b: $.data.id } }
            - { call: "POST /judges/${j_b}/commit", payload: { commitment_rounds: 2 }, as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_e}", name: "J-Epsilon-1" }, as: SchoolCoach, as_user_id: "${s_e}", captures: { j_e1: $.data.id } }
            - { call: "POST /judges/${j_e1}/commit", payload: { commitment_rounds: 2 }, as: SchoolCoach, as_user_id: "${s_e}" }
            - { call: "POST /schools/${s_a}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /schools/${s_b}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /schools/${s_e}/confirm", as: SchoolCoach, as_user_id: "${s_e}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TournamentDirector }
            - { call: "GET /tournaments/${t}", as: TournamentDirector, captures: { t_v: $.data.version } }
            - { call: "POST /tournaments/${t}/lock-registration", payload: { expected_tournament_version: "${t_v}" }, as: TournamentDirector }
            - { call: "POST /rounds", payload: { division_id: "${d}", round_number: 1, kind: "PRELIM", starts_at: "2026-08-12T14:00:00Z", ends_at: "2026-08-12T15:30:00Z" }, as: TabStaff, captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /tournaments/${t}/start-prelims", as: TournamentDirector }
            - { call: "POST /rooms", payload: { tournament_id: "${t}", name: "Room 1" }, as: TournamentDirector, captures: { rm1: $.data.id } }
            - { call: "POST /rounds/${r1}/generate-pairings", payload: { expected_round_version: "${r1_v}" }, as: TabStaff }
            - { call: "GET /pairings?round_id=${r1}", as: TabStaff, captures: { p1: "$.data[0].id" } }
            - { call: "POST /pairings/${p1}/assign-room", payload: { room_id: "${rm1}" }, as: TabStaff }
            - { call: "POST /pairings/${p1}/assign-judge", payload: { judge_id: "${j_e1}" }, as: TabStaff }
            - { call: "POST /rounds/${r1}/open-ballots", as: TabStaff }
            - { call: "GET /pairing-entries?pairing_id=${p1}", as: TabStaff, captures: { p1w: "$.data[0].entry_id", p1l: "$.data[1].entry_id" } }
            - { call: "POST /ballots", payload: { pairing_id: "${p1}", winner_entry_id: "${p1w}", speaker_points: { "${p1w}": 27, "${p1l}": 25 } }, as: Judge, as_user_id: "${j_e1}", captures: { b1: $.data.id } }
            - { call: "POST /ballots/${b1}/submit", as: Judge, as_user_id: "${j_e1}" }
          trigger:
            - { call: "POST /ballots/${b1}/verify", as: Judge, as_user_id: "${j_e1}", captures: { err: $.data.error_id } }
            - { call: "GET /ballots/${b1}", as: TabStaff }
          assert:
            - "error_id == ERR_FORBIDDEN (403): Judge role is not in verify's role list"
            - "Ballot.${b1}.status == SUBMITTED (unchanged)"

      - name: coach_shared_read_allowed
        claim_type: rbac_allow
        grounds: ["roles[SchoolCoach]"]
        distinguishing_aspect: "SchoolCoach (entity_backed by School) may use all GET endpoints: listing tournaments as a coach identity returns 200."
        test_recipe:
          setup: ["tournament with school Alpha"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "CR", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
          trigger:
            - { call: "GET /tournaments", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}" }
          assert: ["both reads return 200 with response_type array and object respectively"]

  # ------------------------------------------------- cross-cutting layers ---
  - section: cross_cutting_layers
    instances:
      - name: occ_lock_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lock-registration-stale-tournament]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After reading Tournament.version, an entry confirm silently bumps it; a lock carrying the earlier expected_tournament_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["tournament open; version captured; then a school's entry confirm advances Tournament.version"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "OC", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "GET /tournaments/${t}", as: TournamentDirector, captures: { t_v: $.data.version } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
            - { call: "POST /entries/${e1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TournamentDirector }
          trigger:
            - { call: "POST /tournaments/${t}/lock-registration", payload: { expected_tournament_version: "${t_v}" }, as: TournamentDirector, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION (412): the entry confirm bumped Tournament.version after ${t_v} was observed"
            - "Tournament.${t}.status == REGISTRATION_OPEN (lock did not happen)"

      - name: occ_generate_pairings_stale_round_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[generate-pairings-stale-round]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second generate-pairings carrying the pre-first-generation round version is rejected with ERR_STALE_VERSION (412) — OCC is evaluated before the round-state check, so the stale view is reported rather than a generic state error."
        test_recipe:
          setup: ["2-school debate fixture locked with round 1 SCHEDULED and prelims active; one successful generate-pairings has already advanced Round.version"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "OG", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 2 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Beta" }, as: TournamentDirector, captures: { s_b: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e_a1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d}", competitor_name: "B-One" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { e_b1: $.data.id } }
            - { call: "POST /entries/${e_a1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e_b1}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_a}", name: "J-Alpha" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { j_a: $.data.id } }
            - { call: "POST /judges/${j_a}/commit", payload: { commitment_rounds: 2 }, as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_b}", name: "J-Beta" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { j_b: $.data.id } }
            - { call: "POST /judges/${j_b}/commit", payload: { commitment_rounds: 2 }, as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /schools/${s_a}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /schools/${s_b}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TournamentDirector }
            - { call: "GET /tournaments/${t}", as: TournamentDirector, captures: { t_v: $.data.version } }
            - { call: "POST /tournaments/${t}/lock-registration", payload: { expected_tournament_version: "${t_v}" }, as: TournamentDirector }
            - { call: "POST /rounds", payload: { division_id: "${d}", round_number: 1, kind: "PRELIM", starts_at: "2026-08-12T14:00:00Z", ends_at: "2026-08-12T15:30:00Z" }, as: TabStaff, captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /tournaments/${t}/start-prelims", as: TournamentDirector }
            - { call: "POST /rounds/${r1}/generate-pairings", payload: { expected_round_version: "${r1_v}" }, as: TabStaff }
          trigger:
            - { call: "POST /rounds/${r1}/generate-pairings", payload: { expected_round_version: "${r1_v}" }, as: TabStaff, captures: { err: $.data.error_id } }
            - { call: "GET /rounds/${r1}", as: TabStaff }
          assert:
            - "error_id == ERR_STALE_VERSION (412): Round.version advanced to 2 after the first generation"
            - "Round.${r1}.status == PAIRED and pairings_total == 1 (no duplicate generation)"

      - name: occ_contract_create_stale_school_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-create-stale-school]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After reading School.version, a judge commit silently bumps it; a hired-judge purchase carrying the earlier expected_school_version is rejected with ERR_STALE_VERSION (412) before the sizing check."
        test_recipe:
          setup: ["tournament open; school Alpha with 2 confirmed entries (shortfall 4); version captured; then a judge commit advances School.version"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "OS", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 4 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-Two" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e2: $.data.id } }
            - { call: "POST /entries/${e1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e2}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}", captures: { s_a_v: $.data.version } }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_a}", name: "J-Alpha" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { j_a: $.data.id } }
            - { call: "POST /judges/${j_a}/commit", payload: { commitment_rounds: 4 }, as: SchoolCoach, as_user_id: "${s_a}" }
          trigger:
            - { call: "POST /hired-judge-contracts", payload: { school_id: "${s_a}", rounds_requested: 4, expected_school_version: "${s_a_v}" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION (412): the judge commit bumped School.version after ${s_a_v} was observed"
            - "GET /hired-judge-contracts?school_id=${s_a} returns total_count == 0"

      - name: derived_field_recomputation
        claim_type: derived_field_reconciliation
        grounds: ["entities.School.fields.shortfall_rounds", "calculations.judge_coverage_shortfall"]
        excluded_because:
          difficulty_instance: judge_obligation_mixed_event_type_ceil
          rationale: "Asserted in the named difficulty instance: shortfall_rounds recomputes 16 -> 12 immediately after a judge commit."

  # ------------------------------------------------------ consistency model ---
  - section: consistency_model
    instances:
      - name: confirm_response_immediately_visible
        claim_type: immediate_consistency
        grounds: [complexity_profile]
        distinguishing_aspect: "Immediate consistency: the confirm response itself carries status CONFIRMED and fee_charged_cents 2500, and a subsequent GET agrees — no read-your-writes lag."
        test_recipe:
          setup: ["tournament open (fee 2500), division, school, one REGISTERED entry"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "IM", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", entry_fee_cents: 2500 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /entries/${e1}/confirm", as: SchoolCoach, as_user_id: "${s_a}", captures: { cf_status: $.data.status, cf_fee: $.data.fee_charged_cents } }
            - { call: "GET /entries/${e1}", as: SchoolCoach, as_user_id: "${s_a}" }
          assert:
            - "confirm response body: status == CONFIRMED and fee_charged_cents == 2500 in the same response"
            - "GET after confirm: Entry.${e1}.status == CONFIRMED, fee_charged_cents == 2500, School invoice_balance_cents == 2500"
