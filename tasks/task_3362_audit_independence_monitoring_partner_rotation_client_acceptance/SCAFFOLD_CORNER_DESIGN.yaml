        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors[ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: "Header presence is checked before anything else about the request body or the target resource, so a call with no X-User-Role and no X-User-ID is rejected at 401 even when its path id is unknown."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
