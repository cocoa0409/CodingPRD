# =============================================================================
# §1.9 Scaffold Corner Design (Breadth coverage of non-Difficulty claims)
# Boutique Fitness Class Pass — Expert tier.
# Walks references/claim-extraction-guide.md row-by-row against SCAFFOLD.yaml
# §1.1–§1.7. Every setup_api_calls/trigger call resolves to §1.5; formula-derived
# asserts are precomputed literals. excluded_because: stubs cite a §1.8 instance
# by name when that corner is already exercised there.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_studio_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Studio, endpoints]
        distinguishing_aspect: "POST /studios with name+state_code -> 201; status defaults OPEN, active_room_count 0, system id/created_at/version present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
          assert:
            - "response code 201; data.status == OPEN; data.active_room_count == 0; data.version == 1; data.id is a UUID; data.timezone == UTC (default)"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Member", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} with a random non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no members)."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"

      - name: create_session_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: ["entities.ClassSession", "errors[ERR_INVALID_REQUEST]", "validations[priority=4]"]
        distinguishing_aspect: "POST /sessions omitting seat_capacity (required, no default) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Studio, room, instructor, template exist."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Room A", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_a: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Flow", duration_min: 60, credit_cost: 5 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-20T10:00:00Z" }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (422); missing seat_capacity"

      - name: create_plan_invalid_enum_kind_returns_422
        claim_type: Type Constraints
        grounds: ["entities.PackagePlan.fields.kind", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /package-plans with kind 'GOLD' (not in {INTRO,CREDIT_PACK,MEMBERSHIP}) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /package-plans"
              payload: { name: "Bad", kind: "GOLD", price_cents: 1000, grant_credits: 5, validity_days: 30 }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST (422)"

      - name: session_ends_at_computed_from_duration
        claim_type: Computed Fields
        grounds: [entities.ClassSession.fields.ends_at, entities.ClassTemplate.fields.duration_min]
        distinguishing_aspect: "ends_at is computed as starts_at + template.duration_min; a 75-min template on a 10:00 start yields ends_at 11:15."
        test_recipe:
          setup: ["Template duration_min 75."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Room A", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_a: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Long", duration_min: 75, credit_cost: 5 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
          trigger:
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-20T10:00:00Z", seat_capacity: 5 }
              as: StudioManager
              captures: { s_id: $.data.id }
          assert:
            - "ClassSession.${s_id}.ends_at == 2026-06-20T11:15:00Z"

      - name: walletentry_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.WalletEntry]
        distinguishing_aspect: "WalletEntry has common_fields:false: append-only ledger row carries id+created_at only, no version, and no update endpoint exists."
        test_recipe:
          setup: ["Member with an ACTIVE membership (one GRANT WalletEntry from capture)."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /package-plans"
              payload: { name: "20 Pack", kind: "CREDIT_PACK", price_cents: 8000, grant_credits: 20, validity_days: 60 }
              as: NetworkAdmin
              captures: { pack_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
          trigger:
            - call: "GET /memberships/${sub1_id}/wallet-entries"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { we_kind: "$.data[0].kind" }
          assert:
            - "wallet-entries list contains exactly one GRANT entry with delta +20; entries carry id+created_at and no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_reservation_already_released_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Reservation.WAITLISTED_to_RELEASED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A reservation already RELEASED cannot be cancelled again -> ERR_INVALID_STATE; no second refund/fee."
        test_recipe:
          setup: ["Member m1 booked then cancelled (early) on an OPEN session s; reservation r1 booking_status RELEASED. Clock 2026-06-25T00:00:00Z."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Room A", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_a: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Flow", duration_min: 60, credit_cost: 5, late_cancel_window_hours: 12 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /package-plans"
              payload: { name: "20 Pack", kind: "CREDIT_PACK", price_cents: 8000, grant_credits: 20, validity_days: 60 }
              as: NetworkAdmin
              captures: { pack_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-07-01T10:00:00Z", seat_capacity: 5 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v: $.data.version }
            - call: "POST /sessions/${s_id}/reservations"
              payload: { membership_id: "${sub1_id}", expected_session_version: "${s_v}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /reservations/${r1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          trigger:
            - call: "POST /reservations/${r1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409); Membership.${sub1_id}.credit_balance == 20 (no double refund)"

      - name: publish_already_open_session_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.ClassSession.SCHEDULED_to_OPEN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Publishing a session already OPEN -> ERR_INVALID_STATE (publish only defined from SCHEDULED)."
        test_recipe:
          setup: ["Session s published once (OPEN)."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Room A", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_a: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Flow", duration_min: 60, credit_cost: 5 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-20T10:00:00Z", seat_capacity: 5 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: session_cancel_cascade_refunds_and_no_fees
        claim_type: Side Effect Execution
        grounds: [state_machines.ClassSession.OPEN_to_CANCELLED, entities.Reservation.fields.attendance_status]
        distinguishing_aspect: "Studio-initiated session cancel releases all reservations, refunds BOOKED seat credits, and assesses NO fee even inside the late window."
        test_recipe:
          setup: ["FULL single-seat session s with m1 BOOKED (debit 5) and m2 WAITLISTED. Clock 2026-06-20T01:00:00Z (inside the 12h late window of a 10:00 session)."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-19T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /studios/${studio_id}/rooms"
              payload: { name: "Room A", physical_capacity: 10 }
              as: NetworkAdmin
              captures: { room_a: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ina", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /class-templates"
              payload: { name: "Flow", duration_min: 60, credit_cost: 5, late_cancel_window_hours: 12 }
              as: NetworkAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /package-plans"
              payload: { name: "20 Pack", kind: "CREDIT_PACK", price_cents: 8000, grant_credits: 20, validity_days: 60 }
              as: NetworkAdmin
              captures: { pack_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m2@x.com", full_name: "M Two", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /members/${m2_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub2_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /sessions"
              payload: { studio_id: "${studio_id}", room_id: "${room_a}", instructor_id: "${inst_a}", template_id: "${tmpl_id}", starts_at: "2026-06-20T10:00:00Z", seat_capacity: 1, waitlist_capacity: 5 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v1: $.data.version }
            - call: "POST /sessions/${s_id}/reservations"
              payload: { membership_id: "${sub1_id}", expected_session_version: "${s_v1}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { r1_id: $.data.id }
            - call: "GET /sessions/${s_id}"
              payload: {}
              as: StudioManager
              captures: { s_v2: $.data.version }
            - call: "POST /sessions/${s_id}/reservations"
              payload: { membership_id: "${sub2_id}", expected_session_version: "${s_v2}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T01:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /sessions/${s_id}/cancel"
              payload: {}
              as: StudioManager
          assert:
            - "ClassSession.${s_id}.status == CANCELLED; booked_count == 0; waitlisted_count == 0"
            - "Reservation.${r1_id}.booking_status == RELEASED and attendance_status == CANCELLED and late_fee_cents == 0"
            - "Reservation.${r2_id}.booking_status == RELEASED and attendance_status == CANCELLED"
            - "Membership.${sub1_id}.credit_balance == 20 (seat credit refunded); no FeeCharge exists for r1"

      - name: terminal_membership_cancelled_cannot_freeze
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Membership.ACTIVE_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED membership is terminal: freeze is not defined from CANCELLED -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Member m1 with a MEMBERSHIP membership ACTIVE then CANCELLED. Clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /package-plans"
              payload: { name: "Monthly", kind: "MEMBERSHIP", price_cents: 8000, grant_credits: 20, validity_days: 30, rollover_cap: 8, freeze_max_days: 14 }
              as: NetworkAdmin
              captures: { mem_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${mem_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /memberships/${sub1_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { mv: $.data.version }
          trigger:
            - call: "POST /memberships/${sub1_id}/freeze"
              payload: { expected_membership_version: "${mv}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409)"

      - name: membership_freeze_unfreeze_extends_expiry
        claim_type: Cyclic
        grounds: [state_machines.Membership.ACTIVE_to_FROZEN, state_machines.Membership.FROZEN_to_ACTIVE, entities.Membership.fields.expires_at]
        distinguishing_aspect: "Freeze at day 5 then unfreeze at day 12 (7 frozen days) extends expires_at by 7 days: 2026-07-01 -> 2026-07-08; freeze_days_used becomes 7."
        test_recipe:
          setup: ["MEMBERSHIP plan validity 30d, freeze_max_days 14. Member m1 ACTIVE captured 2026-06-01 (expires 2026-07-01). Clock advanced to 2026-06-06 to freeze, then 2026-06-13 to unfreeze."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /package-plans"
              payload: { name: "Monthly", kind: "MEMBERSHIP", price_cents: 8000, grant_credits: 20, validity_days: 30, rollover_cap: 8, freeze_max_days: 14 }
              as: NetworkAdmin
              captures: { mem_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${mem_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
              captures: { mv0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships/${sub1_id}/freeze"
              payload: { expected_membership_version: "${mv0}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /memberships/${sub1_id}/unfreeze"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
          assert:
            - "Membership.${sub1_id}.status == ACTIVE; freeze_days_used == 7; expires_at == 2026-07-08T00:00:00Z"

      - name: expiry_ops_forfeits_intro_credits
        claim_type: Side Effect Execution
        grounds: [state_machines.Membership.ACTIVE_to_EXPIRED, entities.Membership.fields.credit_balance, entities.WalletEntry.fields.kind]
        distinguishing_aspect: "run_expiry past expires_at on an INTRO/CREDIT_PACK membership sets status EXPIRED, forfeits all credits (EXPIRY_FORFEIT) and zeroes credit_balance."
        test_recipe:
          setup: ["CREDIT_PACK grant 20, validity 30d. Member m1 ACTIVE captured 2026-06-01 (expires 2026-07-01). Clock advanced to 2026-07-02."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Downtown", state_code: "CA" }
              as: NetworkAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /package-plans"
              payload: { name: "20 Pack", kind: "CREDIT_PACK", price_cents: 8000, grant_credits: 20, validity_days: 30 }
              as: NetworkAdmin
              captures: { pack_plan_id: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", home_studio_id: "${studio_id}" }
              as: NetworkAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /members/${m1_id}/memberships"
              payload: { plan_id: "${pack_plan_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /_payments/capture"
              payload: { membership_id: "${sub1_id}", outcome: "CAPTURED" }
              as: NetworkAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /_ops/run_expiry"
              payload: {}
              as: NetworkAdmin
          assert:
            - "Membership.${sub1_id}.status == EXPIRED; credit_balance == 0; wallet-entries include an EXPIRY_FORFEIT with delta -20"

  # ===========================================================================
  - section: calculations
    instances:
      - name: waitlist_promotion_skips_insufficient_credit_head
        claim_type: Input Set Filtering
