      - name: decision_status_and_publication_dimensions_advance_independently
        grounds:
          - state_machines.Decision.DRAFT_to_ISSUED
          - state_machines.Decision.UNPUBLISHED_to_REDACTED
          - state_machines.Decision.ISSUED_to_STAYED
          - state_machines.Decision.STAYED_to_VOIDED
          - entities.Decision.fields.publication_status
          - entities.PrecedentEntry.fields.superseded
          - entities.PrecedentEntry.fields.citable
          - calculations.precedent_citation_metrics
        distinguishing_aspect: |
          One Decision row carries two state machines that neither gate nor follow each other: the
          publication dimension goes UNPUBLISHED -> REDACTED and then never moves again, while the
          status dimension independently walks ISSUED -> STAYED -> VOIDED, so the terminal
          combination is status VOIDED with publication_status still REDACTED - a decision that has
