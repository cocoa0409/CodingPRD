          - state_machines.ManufacturerDeal.ACTIVE_to_LOST
          - state_machines.ContractedItem.ACTIVE_to_DELISTED
          - state_machines.RateCard.APPROVED_to_EXPIRED
          - state_machines.PurchaseLine.MATCHED_to_EXCLUDED
          - endpoints["POST /compliance-reviews"]
        distinguishing_aspect: |
          Cascade origin = a computed compliance verdict (not a decision by an
          actor), and the chain forks: deal -> LOST fans out to items DELISTED,
          which fans to BOTH rate cards EXPIRED (hop 3) and matched purchase
          lines EXCLUDED (hop 3b), which then fans on to batch case recounts
          (hop 4). The review window 2026-04-01..2026-05-31 is 61 days, so it
