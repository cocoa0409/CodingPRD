            - "SampleShipment.${s1_id}.status == ALLOCATED"
            - "SampleShipment.${s1_id}.delivered_at == null and shipped_at == null"
            - "FulfillmentWave.${w1_id}.status == PLANNED"
            - "Campaign.${camp_id}.delivered_sample_count == 0"
            - "Campaign.${camp_id}.cost_per_sample_final_cents == 0"
            - "Enrollment.${e1_id}.obligation_status == NONE"

      - name: retailer_create_then_read_round_trips_the_policy_defaults
        claim_type: standard_crud
        grounds:
          - endpoints[POST /retailers]
          - endpoints[GET /retailers/{retailer_id}]
          - entities.Retailer.fields
        distinguishing_aspect: "Retailer has four optional policy inputs and no update endpoint, so the create response and the subsequent read must agree on the four declared defaults — ACCEPTING, badge required, min star 1 and one review per panelist per month — from a payload carrying only name."
        test_recipe:
