# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Labor Relations & Collective Bargaining Administration (task 1147)
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; 2 instances per §0.5 rule.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: scenario_costing_provisional_vs_final_divergence
        grounds:
          - calculations.scenario_total_cost
          - entities.CostingScenario.fields.scenario_mode
          - entities.Proposal.fields.estimated_year1_cost_cents
        distinguishing_aspect: |
          Identical agreement economics and identical proposal inputs produce different totals under the
          two variants of the same costing domain: PROVISIONAL (fte_projected=120 basis, one-time amortized)
          yields total_cost_cents 256604833 while FINAL (headcount_baseline=100 basis, one-time in year 1)
          yields 217008360, and the same proposal's estimated_year1_cost_cents is overwritten from
          78523840 to 66523200 when the later variant computes.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT (effective 2026-06-01, expiration 2029-05-31, headcount_baseline 100, fte_projected 120, avg_loaded_wage_cents 5000, envelope 1000000000000)"
            - "Proposal P (EMPLOYER, ECONOMIC): wage_increase_pct 0.04, affected_headcount 100, includes_benefits true, one_time_cost_cents 120000, recurring_annual_cost_cents 6000000; status ON_TABLE"
            - "PROVISIONAL scenario computed; logical clock untouched (default 2026-05-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union A", union_code: "UA-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA 2026", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 100, fte_projected: 120, avg_loaded_wage_cents: 5000, costing_envelope_cents: 1000000000000, deadline_mode: "BUSINESS" }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "GWI 4%", proposal_type: "ECONOMIC", wage_increase_pct: 0.04, affected_headcount: 100, includes_benefits: true, one_time_cost_cents: 120000, recurring_annual_cost_cents: 6000000 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "TENDERED" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ON_TABLE" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/costing-scenarios"
              payload: { agreement_id: "${a_id}", name: "prov", scenario_mode: "PROVISIONAL", term_years: 3, proposal_ids: ["${p_id}"] }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { sp_id: $.data.id }
            - call: "POST /labor-relations/costing-scenarios/${sp_id}/state"
              payload: { to_status: "COMPUTED" }
              as: Negotiator
              as_user_id: "neg-1"
            - call: "GET /labor-relations/proposals/${p_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { est_after_prov: $.data.estimated_year1_cost_cents }
          trigger:
            - call: "POST /labor-relations/costing-scenarios"
              payload: { agreement_id: "${a_id}", name: "final", scenario_mode: "FINAL", term_years: 3, proposal_ids: ["${p_id}"] }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { sf_id: $.data.id }
            - call: "POST /labor-relations/costing-scenarios/${sf_id}/state"
              payload: { to_status: "COMPUTED" }
              as: Negotiator
              as_user_id: "neg-1"
            - call: "GET /labor-relations/proposals/${p_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { est_after_final: $.data.estimated_year1_cost_cents }
          assert:
            - "CostingScenario.${sp_id}.total_cost_cents == 256604833"
            - "CostingScenario.${sp_id}.year_breakdown_cents == [78523840, 81423194, 84438521]"
            - "CostingScenario.${sp_id}.reserve_cents == 12219278"
            - "CostingScenario.${sf_id}.total_cost_cents == 217008360"
            - "CostingScenario.${sf_id}.year_breakdown_cents == [66523200, 68819328, 71332101]"
            - "CostingScenario.${sf_id}.reserve_cents == 10333731"
            - "est_after_prov == 78523840 and est_after_final == 66523200 (later variant overwrites the proposal's estimate)"

      - name: past_practice_strength_variant_divergence
        grounds:
          - calculations.past_practice_strength
          - entities.PastPractice.fields.strength_legalistic
          - entities.PastPractice.fields.strength_operational
        distinguishing_aspect: |
          Identical practice evidence yields two different scores in the evidence-strength domain (a different
          entity domain from costing): LEGALISTIC applies exponential recency decay 0.85^1 and recency weight
          0.6 producing 0.8300, while OPERATIONAL applies step decay (full within 5 years) and frequency
          weight 0.6 producing 0.8800 — and only the LEGALISTIC value gates verification.
        test_recipe:
          setup:
            - "Union U ACTIVE; logical clock untouched (default 2026-05-01T00:00:00Z)"
            - "PastPractice PP ASSERTED with occurrence_count 8, first_observed 2023-05-01, last_observed 2025-05-01"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union B", union_code: "UB-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/past-practices"
              payload: { union_id: "${u_id}", title: "Holiday premium practice", description: "Premium paid every December since 2023", first_observed_date: "2023-05-01T00:00:00Z", last_observed_date: "2025-05-01T00:00:00Z", occurrence_count: 8 }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { pp_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/past-practices/${pp_id}/state"
              payload: { to_status: "DOCUMENTED" }
              as: LRManager
              as_user_id: "mgr-1"
          assert:
            - "PastPractice.${pp_id}.status == DOCUMENTED"
            - "PastPractice.${pp_id}.strength_legalistic == 0.83"
            - "PastPractice.${pp_id}.strength_operational == 0.88"
            - "strength_legalistic != strength_operational for identical inputs"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: scenario_costing_tiered_conditional_mode_a
        grounds:
          - calculations.scenario_total_cost
        distinguishing_aspect: |
          Mode (a): the formula combines >= 3 inputs with non-linear interaction — coverage-ratio tier
          selection (r = 60/120 = 0.50 exactly, so TIER_MID_MULT 1.05 applies because the threshold is >=),
          benefits-load conditional branch, and a min() wage-drift cap — producing the pinned breakdown
          [40542000, 41721360, 42936101] and total 131459434.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT (headcount_baseline 100, fte_projected 120, avg_loaded_wage_cents 5000, envelope 1000000000000)"
            - "Proposal P (EMPLOYER, ECONOMIC) ON_TABLE: wage_increase_pct 0.03, affected_headcount 60, includes_benefits false, one_time_cost_cents 90000, recurring_annual_cost_cents 1200000"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union C", union_code: "UC-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA C", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 100, fte_projected: 120, avg_loaded_wage_cents: 5000, costing_envelope_cents: 1000000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "GWI 3% partial", proposal_type: "ECONOMIC", wage_increase_pct: 0.03, affected_headcount: 60, includes_benefits: false, one_time_cost_cents: 90000, recurring_annual_cost_cents: 1200000 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "TENDERED" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ON_TABLE" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/costing-scenarios"
              payload: { agreement_id: "${a_id}", name: "tier-prov", scenario_mode: "PROVISIONAL", term_years: 3, proposal_ids: ["${p_id}"] }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "COMPUTED" }
              as: Negotiator
              as_user_id: "neg-1"
          assert:
            - "CostingScenario.${s_id}.year_breakdown_cents == [40542000, 41721360, 42936101]"
            - "CostingScenario.${s_id}.subtotal_cents == 125199461"
            - "CostingScenario.${s_id}.reserve_cents == 6259973"
            - "CostingScenario.${s_id}.total_cost_cents == 131459434"
            - "coverage ratio 0.50 selects multiplier 1.05 (>= boundary), visible in year-1 line 40542000"

      - name: retro_payout_line_then_sum_mode_b
        grounds:
          - calculations.ratification_retro_payout
          - state_machines.RatificationVote.OPEN_to_RATIFIED
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — monthly line round_half_up(recurring/12) FIRST
          (round_half_up(100/12) = 8), then multiplied by retro periods (4), giving 32; the alternative
          sum-then-round order would give round_half_up(100*4/12) = 33. The 1-cent delta is observable
          on RatificationVote.retro_payout_cents.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT (effective 2026-03-01 in the past, expiration 2029-05-31, envelope 1000000000000)"
            - "Proposal P (EMPLOYER, ECONOMIC) ACCEPTED: recurring_annual_cost_cents 100, no wage fields"
            - "FINAL scenario covering P is LOCKED; vote V OPEN with eligible_voter_count 10, ballot_close_at 2026-07-01T00:00:00Z"
            - "logical clock at 2026-07-15T00:00:00Z (136 days after effective date -> 4 full 30-day periods)"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union D", union_code: "UD-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA D", effective_date: "2026-03-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 100, fte_projected: 120, avg_loaded_wage_cents: 5000, costing_envelope_cents: 1000000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "Shift allowance", proposal_type: "ECONOMIC", recurring_annual_cost_cents: 100 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "TENDERED" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ON_TABLE" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/costing-scenarios"
              payload: { agreement_id: "${a_id}", name: "final-small", scenario_mode: "FINAL", term_years: 3, proposal_ids: ["${p_id}"] }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s_id: $.data.id }
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "COMPUTED" }
              as: Negotiator
              as_user_id: "neg-1"
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "REVIEWED" }
              as: Negotiator
              as_user_id: "neg-2"
            - call: "GET /labor-relations/agreements/${a_id}"
              payload: {}
              as: Negotiator
              as_user_id: "neg-1"
              captures: { a_v: $.data.version }
            - call: "POST /labor-relations/costing-scenarios/${s_id}/lock"
              payload: { expected_agreement_version: "${a_v}" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/ratification-votes"
              payload: { agreement_id: "${a_id}", eligible_voter_count: 10, ballot_close_at: "2026-07-01T00:00:00Z" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { v_id: $.data.id }
            - call: "POST /labor-relations/ratification-votes/${v_id}/state"
              payload: { to_status: "OPEN" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: LRAdmin
          trigger:
            - call: "POST /labor-relations/ratification-votes/${v_id}/tally"
              payload: { votes_for: 4, votes_against: 1 }
              as: UnionRepresentative
              as_user_id: "${u_id}"
          assert:
            - "RatificationVote.${v_id}.status == RATIFIED"
            - "RatificationVote.${v_id}.retro_payout_cents == 32"
            - "retro_payout_cents != 33 (the sum-then-round alternative is rejected by the pinned order)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_counter_round_cycle
        grounds:
          - state_machines.Proposal.ON_TABLE_to_COUNTERED
          - entities.Proposal.fields.supersedes_proposal_id
          - entities.Proposal.fields.round_number
        distinguishing_aspect: |
          Proposal negotiation is cyclic at the bargaining-table level: each counter terminates the current
          proposal (ON_TABLE -> COUNTERED) and spawns a fresh ON_TABLE proposal of the opposite side at
          round_number + 1 linked by supersedes_proposal_id, so the exchange loops until acceptance,
          rejection, withdrawal, or the 12-round cap.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT; UNION proposal P1 ON_TABLE (round 1, NON_ECONOMIC)"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union E", union_code: "UE-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA E", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 50, fte_projected: 60, avg_loaded_wage_cents: 4000, costing_envelope_cents: 1000000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "UNION", title: "Scheduling art 1", proposal_type: "NON_ECONOMIC" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p1_id}/state"
              payload: { to_status: "TENDERED" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/proposals/${p1_id}/state"
              payload: { to_status: "ON_TABLE" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
          trigger:
            - call: "POST /labor-relations/proposals/${p1_id}/counter"
              payload: { title: "Employer counter 1" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
              captures: { p2_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p2_id}/counter"
              payload: { title: "Union counter 2" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
              captures: { p3_id: $.data.id }
          assert:
            - "Proposal.${p1_id}.status == COUNTERED"
            - "Proposal.${p2_id}.status == COUNTERED and Proposal.${p2_id}.round_number == 2 and Proposal.${p2_id}.side == EMPLOYER"
            - "Proposal.${p3_id}.status == ON_TABLE and Proposal.${p3_id}.round_number == 3 and Proposal.${p3_id}.side == UNION"
            - "Proposal.${p3_id}.supersedes_proposal_id == ${p2_id}"

      - name: costing_scenario_rework_cycle
        grounds:
          - state_machines.CostingScenario.DRAFT_to_COMPUTED
          - state_machines.CostingScenario.COMPUTED_to_REVIEWED
          - state_machines.CostingScenario.REVIEWED_to_DRAFT
        distinguishing_aspect: |
          CostingScenario carries a rework cycle (DRAFT -> COMPUTED -> REVIEWED -> DRAFT -> COMPUTED) on a
          different entity than the proposal negotiation loop; recomputation after rework is idempotent for
          unchanged inputs (total stays 315) and computed_by_user_id tracks the latest computer.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A DRAFT; proposal P (EMPLOYER, ECONOMIC, recurring 100) ON_TABLE"
            - "FINAL scenario S over [P] exists in DRAFT"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union F", union_code: "UF-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA F", effective_date: "2026-06-01T00:00:00Z", expiration_date: "2029-05-31T00:00:00Z", headcount_baseline: 100, fte_projected: 120, avg_loaded_wage_cents: 5000, costing_envelope_cents: 1000000000000 }
              as: LRAdmin
              captures: { a_id: $.data.id }
            - call: "POST /labor-relations/proposals"
              payload: { agreement_id: "${a_id}", side: "EMPLOYER", title: "Allowance", proposal_type: "ECONOMIC", recurring_annual_cost_cents: 100 }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { p_id: $.data.id }
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "TENDERED" }
              as: ChiefNegotiator
              as_user_id: "chief-1"
            - call: "POST /labor-relations/proposals/${p_id}/state"
              payload: { to_status: "ON_TABLE" }
              as: UnionRepresentative
              as_user_id: "${u_id}"
            - call: "POST /labor-relations/costing-scenarios"
              payload: { agreement_id: "${a_id}", name: "rework", scenario_mode: "FINAL", term_years: 3, proposal_ids: ["${p_id}"] }
              as: Negotiator
              as_user_id: "neg-1"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "COMPUTED" }
              as: Negotiator
              as_user_id: "neg-1"
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "REVIEWED" }
              as: Negotiator
              as_user_id: "neg-2"
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "DRAFT" }
              as: Negotiator
              as_user_id: "neg-2"
            - call: "POST /labor-relations/costing-scenarios/${s_id}/state"
              payload: { to_status: "COMPUTED" }
              as: Negotiator
              as_user_id: "neg-2"
          assert:
            - "CostingScenario.${s_id}.status == COMPUTED after the DRAFT->COMPUTED->REVIEWED->DRAFT->COMPUTED loop"
            - "CostingScenario.${s_id}.total_cost_cents == 315 (recompute idempotent for unchanged inputs)"
            - "CostingScenario.${s_id}.computed_by_user_id == neg-2 (latest computer tracked)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: ratification_depth5_cascade
        grounds:
          - state_machines.RatificationVote.OPEN_to_RATIFIED
          - state_machines.CollectiveAgreement.DRAFT_to_ACTIVE
          - state_machines.Proposal.ACCEPTED_to_IMPLEMENTED
          - state_machines.SideLetter.EXECUTED_to_SUPERSEDED
          - state_machines.Clause.INTERPRETED_to_UNDER_REVIEW
        distinguishing_aspect: |
          A single tally fires a depth-5 transitive chain in which every link is caused by the previous link:
          RATIFIED -> successor agreement activates -> incumbent agreement of the same union becomes REPLACED
          and the successor's ACCEPTED proposals become IMPLEMENTED -> each IMPLEMENTED proposal supersedes
          overlapping EXECUTED side letters on its clause -> each supersession drives the clause from
          INTERPRETED back to UNDER_REVIEW.
        test_recipe:
          setup:
            - "Union U ACTIVE; agreement A1 ACTIVE (effective 2026-01-01, expiration 2026-12-31)"
            - "Clause C on A1 (article 12.1) with interpretation_status INTERPRETED"
            - "SideLetter SL EXECUTED on C with effective window [2026-01-01, 2027-12-31] (drafter mgr-1, executor lc-1)"
            - "Successor agreement A2 DRAFT (same union, effective 2026-06-01, expiration 2029-05-31, envelope 1000000)"
            - "Proposal P on A2 (EMPLOYER, ECONOMIC, clause_id = C, recurring 100) ACCEPTED under LOCKED FINAL scenario"
            - "Vote V on A2 OPEN (eligible 10, ballot_close 2026-06-01T00:00:00Z); clock at 2026-06-02T00:00:00Z"
          setup_api_calls:
            - call: "POST /labor-relations/unions"
              payload: { name: "Union G", union_code: "UG-1" }
              as: LRAdmin
              captures: { u_id: $.data.id }
            - call: "POST /labor-relations/agreements"
              payload: { union_id: "${u_id}", title: "CBA G incumbent", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", headcount_baseline: 100, fte_projected: 120, avg_loaded_wage_cents: 5000, costing_envelope_cents: 1000000000000 }
              as: LRAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /labor-relations/agreements/${a1_id}/activate"
              payload: {}
              as: LRAdmin
            - call: "POST /labor-relations/clauses"
              payload: { agreement_id: "${a1_id}", article_ref: "12.1", title: "Overtime", body_text: "Overtime terms", is_economic: true }
              as: LRManager
              as_user_id: "mgr-1"
              captures: { c_id: $.data.id }
            - call: "POST /labor-relations/clauses/${c_id}/interpretation"
