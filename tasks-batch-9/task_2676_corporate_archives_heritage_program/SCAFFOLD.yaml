  - method: GET
    path: "/deaccession-proposals"
    description: "List deaccession proposals, optionally filtered by the item proposed for removal."
    roles: [ArchivesDirector, Archivist, LegalCounsel]
    code: 200
    input: ["archival_item_id?", "status?", "route?", "limit?", "offset?"]
    output: DeaccessionProposal[]
    side_effects: []

  - method: GET
    path: "/deaccession-proposals/{id}"
    description: "Fetch one deaccession proposal with both clearance stamps and cascade counters."
    roles: [ArchivesDirector, Archivist, LegalCounsel]
    code: 200
    input: []
    output: DeaccessionProposal
    side_effects: []

  - method: POST
    path: "/deaccession-proposals/{id}/legal-clearance"
    description: "Fork branch A: counsel clears the removal; refuses while the series is on hold, suspended or permanent."
    roles: [LegalCounsel]
    code: 200
    input: ["clearance_note?"]
    output: DeaccessionProposal
    side_effects:
      - "state_machines.DeaccessionProposal SUBMITTED -> LEGAL_CLEARED or HERITAGE_CLEARED -> DUALLY_CLEARED"
      - "stamps legal_cleared_by from X-User-ID"

  - method: POST
    path: "/deaccession-proposals/{id}/heritage-clearance"
    description: "Fork branch B: the director clears the removal on heritage grounds; refuses on a PERMANENT series."
    roles: [ArchivesDirector]
    code: 200
    input: ["clearance_note?"]
    output: DeaccessionProposal
    side_effects:
      - "state_machines.DeaccessionProposal SUBMITTED -> HERITAGE_CLEARED or LEGAL_CLEARED -> DUALLY_CLEARED"
      - "stamps heritage_cleared_by from X-User-ID"

  - method: POST
    path: "/deaccession-proposals/{id}/approve"
    description: "Join point: approve a dually cleared proposal. Drives the three-hop staleness cascade and enforces segregation of duties against the legal clearer."
    roles: [ArchivesDirector]
    code: 200
    input: []
    output: DeaccessionProposal
    side_effects:
      - "state_machines.DeaccessionProposal DUALLY_CLEARED -> APPROVED; stamps approved_by from X-User-ID"
      - "cascade hop 1: the item moves ACCESSIONED -> PENDING_DISPOSITION"
      - "cascade hop 2: every PUBLISHED FindingAid under the item's accession moves to NEEDS_REVISION; stale_finding_aid_count records how many"
      - "cascade hop 3: every AccessRequest citing one of those aids and sitting in APPROVED or PARTIALLY_APPROVED moves to REVALIDATION_REQUIRED; revalidated_request_count records how many"

  - method: POST
    path: "/deaccession-proposals/{id}/execute"
    description: "Execute the approved removal along the route branch; DESTRUCTION records a destruction certificate, DONATION records the receiving repository's receipt."
    roles: [Archivist]
    code: 200
    input: [transfer_reference]
    output: DeaccessionProposal
    side_effects:
      - "state_machines.DeaccessionProposal APPROVED -> EXECUTED"
      - "units move units_on_shelf -> units_deaccessioned on the item, conserving unit_count"
      - "the item lands in DEACCESSIONED when units_on_shelf reaches 0, else returns to ACCESSIONED"
      - "the parent Accession recomputes deaccessioned_unit_count"

  - method: POST
    path: "/deaccession-proposals/{id}/reject"
    description: "Reject a proposal at any point before approval; the item is left untouched."
    roles: [ArchivesDirector]
    code: 200
    input: ["clearance_note?"]
    output: DeaccessionProposal
    side_effects:
      - "state_machines.DeaccessionProposal SUBMITTED / LEGAL_CLEARED / HERITAGE_CLEARED / DUALLY_CLEARED -> REJECTED"

  # ------------------------------------------------------------- logical clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time. Every retention expiry, embargo release, loan window and migration window is evaluated against this clock."
    roles: [SystemOperator]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "no entity is mutated; subsequent requests read the new instant"

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================

errors:

  # ------------------------------------------------------------ auth and RBAC
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven roles in §1.7."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The presented role is not listed in the called endpoint's roles."
  - id: ERR_NOT_REQUEST_OWNER
    http: 403
    condition: "A Requester-role caller files or revises an AccessRequest whose requester_id differs from X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "X-User-ID collides with a prior actor the same workflow bars: the MigrationJob requester approving its own job, the screener deciding the request it screened, or the legal clearer approving the deaccession it cleared."

  # -------------------------------------------------------- payload validation
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, unknown enum member, out-of-range number, duplicate id in requested_item_ids or evidence_item_ids, or window_end <= window_start."

  # -------------------------------------------------------------- not found
  - id: ERR_RETENTION_SCHEDULE_NOT_FOUND
    http: 404
    condition: "The referenced RetentionSchedule id does not exist."
  - id: ERR_RECORD_SERIES_NOT_FOUND
    http: 404
    condition: "The referenced RecordSeries id does not exist."
  - id: ERR_LEGAL_HOLD_NOT_FOUND
    http: 404
    condition: "The referenced LegalHold id does not exist."
  - id: ERR_APPRAISAL_NOT_FOUND
    http: 404
    condition: "The referenced AppraisalRecord id does not exist."
  - id: ERR_ACCESSION_NOT_FOUND
    http: 404
    condition: "The referenced Accession id does not exist."
  - id: ERR_ARCHIVAL_ITEM_NOT_FOUND
    http: 404
    condition: "The referenced ArchivalItem id does not exist, including any element of requested_item_ids or evidence_item_ids."
  - id: ERR_STORAGE_ZONE_NOT_FOUND
    http: 404
    condition: "The referenced StorageZone id does not exist."
  - id: ERR_FINDING_AID_NOT_FOUND
    http: 404
    condition: "The referenced FindingAid id does not exist."
  - id: ERR_PRESERVATION_PLAN_NOT_FOUND
    http: 404
    condition: "The referenced PreservationPlan id does not exist."
  - id: ERR_MIGRATION_JOB_NOT_FOUND
    http: 404
    condition: "The referenced MigrationJob id does not exist."
  - id: ERR_REQUESTER_NOT_FOUND
    http: 404
    condition: "The referenced Requester id does not exist."
  - id: ERR_ACCESS_REQUEST_NOT_FOUND
    http: 404
    condition: "The referenced AccessRequest id does not exist."
  - id: ERR_SCREENING_NOT_FOUND
    http: 404
    condition: "The referenced ConfidentialityScreening id does not exist."
  - id: ERR_INTERVIEW_NOT_FOUND
    http: 404
    condition: "The referenced OralHistoryInterview id does not exist."
  - id: ERR_EVIDENCE_PACKAGE_NOT_FOUND
    http: 404
    condition: "The referenced TrademarkEvidencePackage id does not exist."
  - id: ERR_EXHIBIT_LOAN_NOT_FOUND
    http: 404
    condition: "The referenced ExhibitLoan id does not exist."
  - id: ERR_DEACCESSION_PROPOSAL_NOT_FOUND
    http: 404
    condition: "The referenced DeaccessionProposal id does not exist."

  # ------------------------------------------------------------ state conflicts
  - id: ERR_SERIES_STATE_INVALID
    http: 409
    condition: "The RecordSeries is not in a disposition_state from which the requested transition is declared."
  - id: ERR_HOLD_STATE_INVALID
    http: 409
    condition: "The LegalHold is not in a status from which activate or release is declared."
  - id: ERR_SERIES_ALREADY_ON_HOLD
    http: 409
    condition: "Activating a hold on a series that already has a different ACTIVE LegalHold."
  - id: ERR_APPRAISAL_STATE_INVALID
    http: 409
    condition: "The AppraisalRecord is not DRAFT for screen or SCREENED for finalize, or is SUPERSEDED."
  - id: ERR_ACCESSION_STATE_INVALID
    http: 409
    condition: "The Accession is not in a status from which the requested accession transition is declared, or a child operation whose precondition names the parent Accession's status is attempted while that accession is not PROCESSED (POST /finding-aids/{id}/submit-review)."
  - id: ERR_ITEM_STATE_INVALID
    http: 409
    condition: "The ArchivalItem is not in a status the requested custody movement allows."
  - id: ERR_FINDING_AID_STATE_INVALID
    http: 409
    condition: "The FindingAid is not DRAFT or NEEDS_REVISION for submit-review, not UNDER_REVIEW for publish, or has stale_item_count > 0 at publish."
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "The PreservationPlan is not DRAFT for activate, not ACTIVE for close, or still has an open job at close."
  - id: ERR_JOB_STATE_INVALID
    http: 409
    condition: "The MigrationJob is not in a status from which approve, start, complete or cancel is declared."
  - id: ERR_REQUESTER_STATE_INVALID
    http: 409
    condition: "The Requester is already SUSPENDED."
  - id: ERR_REQUEST_STATE_INVALID
    http: 409
    condition: "The AccessRequest is not in a status from which begin-screening, revise, approve, deny or close is declared."
  - id: ERR_SCREENING_STATE_INVALID
    http: 409
    condition: "The ConfidentialityScreening is not OPEN when completion is attempted."
  - id: ERR_INTERVIEW_STATE_INVALID
    http: 409
    condition: "The requested consent_action or transcription_action is not declared from the interview's current value on that axis."
  - id: ERR_PACKAGE_STATE_INVALID
    http: 409
    condition: "The TrademarkEvidencePackage is not DRAFT when certification is attempted."
  - id: ERR_LOAN_STATE_INVALID
    http: 409
    condition: "The ExhibitLoan is not in a status from which confirm, check-out, return or cancel is declared."
  - id: ERR_PROPOSAL_STATE_INVALID
    http: 409
    condition: "The DeaccessionProposal is not in a status from which the requested clearance, approve, execute or reject is declared."

  # --------------------------------------------------------- OCC version conflict
  - id: ERR_STALE_SERIES_VERSION
    http: 412
    condition: "expected_series_version on POST /appraisals does not equal the RecordSeries' current version, so the client's view of the series predates a write that already landed."
  - id: ERR_STALE_ACCESS_REQUEST_VERSION
    http: 412
    condition: "expected_access_request_version on POST /confidentiality-screenings does not equal the AccessRequest's current version."

  # ------------------------------------------------------------ business rules
  - id: ERR_DUPLICATE_RESOURCE_KEY
    http: 409
    condition: "RetentionSchedule.code, LegalHold.matter_number or StorageZone.zone_code duplicates an existing row."
  - id: ERR_SERIES_DISPOSITION_SUSPENDED
    http: 409
    condition: "The governing RecordSeries is SUSPENDED or carries legal_hold_active == true, so appraisal, provenance verification, access screening, access approval, legal clearance and disposal are all frozen."
  - id: ERR_SERIES_PERMANENT
    http: 409
    condition: "The governing RecordSeries is PERMANENT, so its holdings may not be cleared for removal or disposed."
  - id: ERR_PROVENANCE_NOT_DOCUMENTED
    http: 422
    condition: "Processing an Accession whose provenance_documented is still false."
  - id: ERR_UNIT_COUNT_MISMATCH
    http: 422
    condition: "Processing an Accession whose processed_unit_count does not equal declared_unit_count."
  - id: ERR_CONSENT_NOT_SIGNED
    http: 422
    condition: "Approving an oral history transcript whose consent_status is not SIGNED."
  - id: ERR_EMBARGO_ACTIVE
    http: 409
    condition: "Approving an oral history transcript before the logical clock reaches embargo_until."
  - id: ERR_RETENTION_PERIOD_NOT_ELAPSED
    http: 422
    condition: "Disposing a series before the logical clock reaches retention_expiry_utc."
  - id: ERR_LOAN_WINDOW_NOT_OPEN
    http: 422
    condition: "Checking out an exhibit loan before the logical clock reaches window_start."
  - id: ERR_NO_ITEMS_REQUESTED
    http: 422
    condition: "An access request or revision carries an empty requested_item_ids array."
  - id: ERR_ITEM_NOT_IN_SERIES
    http: 422
    condition: "A requested ArchivalItem's accession belongs to a different RecordSeries than the request's."
  - id: ERR_FINDING_AID_NOT_PUBLISHED
    http: 422
    condition: "Approving an access request that cites a FindingAid whose status is not PUBLISHED."
  - id: ERR_REQUESTER_SUSPENDED
    http: 409
    condition: "Screening or approving an access request whose Requester is SUSPENDED."
  - id: ERR_SCREENING_DECISION_MISSING
    http: 422
    condition: "Deciding an access request with no COMPLETED screening, or approving at FULL scope on a GRANT_REDACTED / DENY / CHANGES_REQUESTED decision."
  - id: ERR_RISK_THRESHOLD_REQUIRES_REDACTION
    http: 422
    condition: "Approving at FULL scope when post_screen_risk_score >= RISK_REDACTION_THRESHOLD (75)."
  - id: ERR_NO_QUALIFYING_EVIDENCE
    http: 422
    condition: "Certifying a trademark evidence package whose qualifying_evidence_count is 0 — the empty-input boundary of calculations.continuous_use_coverage."
  - id: ERR_ITEM_CONDITION_UNSUITABLE
    http: 422
    condition: "Confirming an exhibit loan on an item graded POOR or UNSTABLE."
  - id: ERR_ITEM_HAS_ACTIVE_LOAN
    http: 409
    condition: "Approving a deaccession on an item with an ExhibitLoan in REQUESTED, CONFIRMED or OUT."
  - id: ERR_INSUFFICIENT_SHELF_UNITS
    http: 422
    condition: "The requested units exceed ArchivalItem.units_on_shelf at loan confirmation, loan check-out or deaccession execution."
  - id: ERR_LOAN_WINDOW_CONFLICT
    http: 409
    condition: "The new exhibit loan's half-open window plus light-recovery buffer intersects a live loan on the same item."
  - id: ERR_ZONE_NOT_COMPLIANT
    http: 422
    condition: "Starting a migration job whose item is shelved in a zone whose environmental_status is not COMPLIANT."
  - id: ERR_ZONE_MIGRATION_CAPACITY_EXCEEDED
    http: 409
    condition: "Approving a migration job would push the zone's closed-interval overlap count above max_overlapping_migration_jobs at some instant."
  - id: ERR_LEGAL_CLEARANCE_MISSING
    http: 422
    condition: "Approving a deaccession proposal whose legal_cleared_by is null."
  - id: ERR_HERITAGE_CLEARANCE_MISSING
    http: 422
    condition: "Approving a deaccession proposal whose heritage_cleared_by is null."
  - id: ERR_RECIPIENT_REPOSITORY_REQUIRED
    http: 422
    condition: "A DONATION-route deaccession proposal has no recipient_repository."
  - id: ERR_PRESERVATION_BUDGET_EXCEEDED
    http: 422
    condition: "Approving a migration job whose committed_cost_cents would push budget_committed_cents above budget_cents."

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================

roles:

  - name: ArchivesDirector
    description: "Head of the corporate archives and heritage office. Owns retention-schedule configuration, appraisal finalisation, finding-aid publication, accession rejection, series disposal, heritage clearance and deaccession approval."
    identity: opaque
    exclusive_operations:
      - "POST /retention-schedules"
      - "POST /record-series/{id}/dispose"
      - "POST /appraisals/{id}/finalize"
      - "POST /accessions/{id}/reject"
      - "POST /finding-aids/{id}/publish"
      - "POST /deaccession-proposals/{id}/heritage-clearance"
      - "POST /deaccession-proposals/{id}/approve"
      - "POST /deaccession-proposals/{id}/reject"
    shared_operations:
      - "POST /exhibit-loans (shared with Archivist)"
      - "POST /exhibit-loans/{id}/cancel (shared with Archivist)"
      - "all read endpoints except GET /requesters (shared with the other operator roles)"

  - name: Archivist
    description: "Processing archivist. Creates series, accessions, items, finding aids, oral histories, deaccession proposals and appraisal drafts, and performs physical custody movements."
    identity: opaque
    exclusive_operations:
      - "POST /record-series"
      - "POST /accessions"
      - "POST /accessions/{id}/verify-provenance"
      - "POST /accessions/{id}/process"
      - "POST /archival-items"
      - "POST /finding-aids"
      - "POST /finding-aids/{id}/submit-review"
      - "POST /appraisals"
      - "POST /appraisals/{id}/screen"
      - "POST /oral-history-interviews"
      - "POST /oral-history-interviews/{id}/consent"
      - "POST /oral-history-interviews/{id}/transcription"
      - "POST /exhibit-loans/{id}/check-out"
      - "POST /exhibit-loans/{id}/return"
      - "POST /deaccession-proposals"
      - "POST /deaccession-proposals/{id}/execute"
    shared_operations:
      - "POST /exhibit-loans (shared with ArchivesDirector)"
      - "POST /exhibit-loans/{id}/cancel (shared with ArchivesDirector)"
      - "POST /trademark-evidence-packages (shared with LegalCounsel)"
      - "read endpoints across series, accessions, items, aids, zones, loans, proposals"

  - name: PreservationOfficer
    description: "Preservation and conservation officer. Owns storage zones, environmental readings, preservation plans, migration jobs and exhibit-loan conservation confirmation."
    identity: opaque
    exclusive_operations:
      - "POST /storage-zones"
      - "POST /storage-zones/{id}/environment-readings"
      - "POST /preservation-plans"
      - "POST /preservation-plans/{id}/activate"
      - "POST /preservation-plans/{id}/close"
      - "POST /migration-jobs"
      - "POST /migration-jobs/{id}/approve"
      - "POST /migration-jobs/{id}/start"
      - "POST /migration-jobs/{id}/complete"
      - "POST /migration-jobs/{id}/cancel"
      - "POST /exhibit-loans/{id}/confirm"
    shared_operations:
      - "read endpoints across zones, plans, jobs, items, accessions, loans"

  - name: AccessServicesOfficer
    description: "Reading-room and access services officer. Registers requesters, files requests on their behalf, runs confidentiality screening and decides access. Barred by segregation of duties from deciding a request it screened."
    identity: opaque
    exclusive_operations:
      - "POST /requesters"
      - "POST /requesters/{id}/suspend"
      - "POST /access-requests/{id}/begin-screening"
      - "POST /access-requests/{id}/approve"
      - "POST /access-requests/{id}/deny"
      - "POST /access-requests/{id}/close"
      - "POST /confidentiality-screenings"
      - "POST /confidentiality-screenings/{id}/complete"
    shared_operations:
      - "POST /access-requests (shared with Requester)"
      - "read endpoints across requests, screenings, requesters, series, items, aids, interviews"

  - name: LegalCounsel
    description: "Legal and trademark counsel. Owns legal holds, evidence-package certification and deaccession legal clearance."
    identity: opaque
    exclusive_operations:
      - "POST /legal-holds"
      - "POST /legal-holds/{id}/activate"
      - "POST /legal-holds/{id}/release"
      - "POST /trademark-evidence-packages/{id}/certify"
      - "POST /deaccession-proposals/{id}/legal-clearance"
    shared_operations:
      - "POST /trademark-evidence-packages (shared with Archivist)"
      - "read endpoints across holds, series, appraisals, requests, screenings, packages, proposals"

  - name: Requester
    description: "External researcher, media representative or internal business user. X-User-ID is the id of the Requester row created by access services; a Requester may only file and revise its own requests."
    identity: "entity_backed:Requester"
    exclusive_operations:
      - "POST /access-requests/{id}/revise"
    shared_operations:
      - "POST /access-requests (shared with AccessServicesOfficer, restricted to requester_id == X-User-ID)"
      - "GET /access-requests, GET /access-requests/{id}, GET /finding-aids, GET /finding-aids/{id}, GET /requesters/{id}"

  - name: SystemOperator
    description: "Operations identity for the logical clock. Holds no business capability."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
