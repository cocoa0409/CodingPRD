              as: NumberingAdministrator
              captures: { blk1_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "555", thousands_digit: 1, contaminated_count: 0, holder_carrier_id: "${carrier_a_id}" }
              as: NumberingAdministrator
              captures: { blk2_id: $.data.id }
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${carrier_a_id}", rate_center_id: "${rc_id}", reporting_period: "2026H1", numbers_assigned: 2800, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 3, forecast_quarters: [3000, 2000, 1000, 500] }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { filing_a_id: $.data.id }
            - call: "POST /numbering/utilization-filings/${filing_a_id}/submissions"
