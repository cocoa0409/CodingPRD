            - "counted_qty 100 (== max): submission succeeds; no order generated (100 >= min 10); on_hand_qty == 100"

      - name: min_qty_must_be_less_than_max_qty
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_QUANTITY_OUT_OF_BOUNDS]"
        distinguishing_aspect: "Creating an agreement with min_qty == max_qty returns ERR_QUANTITY_OUT_OF_BOUNDS — the reorder point must be strictly below capacity."
        test_recipe:
          setup: ["Site S, part P exist"]
          setup_api_calls:
