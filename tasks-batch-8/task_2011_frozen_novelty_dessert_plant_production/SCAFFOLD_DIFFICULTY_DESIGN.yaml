  - rule_id: transitive_cascade
    instances:
      - name: complaint_substantiation_cascade
        grounds:
          - state_machines.QualityComplaint.UNDER_REVIEW_to_DISPOSITIONED_SUBSTANTIATED
          - state_machines.InventoryLot.AVAILABLE_to_QUARANTINED
          - state_machines.ShipmentAllocation.ACTIVE_to_RELEASED
          - state_machines.Shipment.LOADED_to_PLANNED
        distinguishing_aspect: |
          Depth-3 cascade triggered by complaint disposition: disposition SUBSTANTIATED
          mutates the lot (AVAILABLE -> QUARANTINED); the lot quarantine itself mutates
          its allocations (ACTIVE -> RELEASED, COMPLAINT_CASCADE); each allocation
          release itself mutates the shipment (allocated_units recompute and, because
          the shipment was LOADED, regression LOADED -> PLANNED). Each link is caused
          by the previous mutation, not by the original trigger.
