              captures: { st2: $.data.status }
          assert:
            - "${err1} == ERR_ENGAGEMENT_ALREADY_ACTIVE — same role_type blocked"
            - "${st2} == PROPOSED — different role_type permitted"

      - name: plan_reserve_exceeds_cash_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_RESERVE_EXCEEDS_POOL]"]
        distinguishing_aspect: "Fiscal check last: with zero claims (vacuously all determined), no open plan, and no overdue report, a reserve of 60000 against cash 50000 is rejected with ERR_RESERVE_EXCEEDS_POOL."
        test_recipe:
