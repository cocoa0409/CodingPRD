          setup:
            - "Plant with EFFECTIVE plan, inspector ON_PREMISE, OPEN day"
            - "Lot fully FABRICATED; APPROVED label; one PRODUCED FinishedLot of 500.0 lbs sourced from the lot"
            - "One PENDING PathogenSample collected on the (already FABRICATED) lot"
