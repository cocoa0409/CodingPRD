            - "Cohort.${coh_id}.reserved_male == 0 and Cohort.${coh_id}.reserved_female == 0  (reservation fully compensated)"
            - "Cohort.${coh_id}.status == HOLD  (PARTIALLY_ALLOCATED reverted)"
            - "Allocation.${alloc_id}.status == RELEASED"
            - "CustomerOrder.${ord_id}.allocated_male == 0 and CustomerOrder.${ord_id}.status == SOURCING  (coverage lost -> order reverts)"

      - name: source_cancel_conserves_gross_exposure
        grounds:
          - calculations.customer_credit_positions
          - state_machines.CustomerOrder.SOURCING_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = customer GROSS credit exposure (a fiscal total,
          different conserved quantity than animal headcount): submit + source
          raises credit_exposure_cents to 10000, and the compensating cancel
          returns it to exactly the pre-order baseline 0 with no drift.
        test_recipe:
          setup:
            - "PRODUCTION colony with 10 pairs (PROJECTED 48); customer credit_limit 100000; baseline exposure 0"
          setup_api_calls:
