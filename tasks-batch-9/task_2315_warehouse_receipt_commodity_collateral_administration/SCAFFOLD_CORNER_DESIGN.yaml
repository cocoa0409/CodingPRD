        distinguishing_aspect: "The entitlement fixed at adjudication is readable on both the collection and the single-resource route: filtering by claim_state ALLOWED returns the one claim, and the detail read shows entitlement_cents 364606 with allowed_cents 364606 and fund_eligible true while the allocation fields are still zero because ALLOCATE has not run."
