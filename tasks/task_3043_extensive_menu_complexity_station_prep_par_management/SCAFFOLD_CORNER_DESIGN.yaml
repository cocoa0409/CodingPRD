  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_prep_list_regenerate_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[prep-list-regenerate-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The OCC loser is deterministic: after generate (version advances), a regenerate carrying the pre-generate version is rejected 412 ERR_STALE_VERSION, while a regenerate carrying the current version succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; published recipe; FINALIZED forecast; prep list created (version observed) then GENERATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
