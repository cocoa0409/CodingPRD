      - name: maintenance_close_with_reset_zeroes_pm_counter_but_not_lifetime_shots
        claim_type: Compensation
        grounds: ["state_machines.MaintenanceOrder.OPEN_to_CLOSED", "state_machines.Mold.IN_MAINTENANCE_to_SERVICEABLE", "entities.Mold.fields.shots_since_pm", "entities.Mold.fields.total_shot_count", "concurrency_rules[maintenance-close-stale-mold]"]
        distinguishing_aspect: "Closing with reset_shot_counter true sets shots_since_pm to 0 and returns service_state to SERVICEABLE, while total_shot_count is a lifetime counter that maintenance never touches; MaintenanceOrder.shots_reset flips to true."
        test_recipe:
          setup: ["Mold M-1 with both counters at 0; an OPEN PM order occupies 2026-09-20T08:00Z-12:00Z so the tool is IN_MAINTENANCE."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /customers", payload: { name: "Acme Controls", code: "ACME" }, as: PlantAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "M-1", customer_id: "${cust_id}", cavity_count: 4, shot_weight_grams: 180, required_min_tonnage: 120, required_max_tonnage: 200, pm_interval_shots: 5000, tooling_cost_cents: 2500000 }, as: PlantAdmin, captures: { mold_id: $.data.id } }
            - { call: "POST /maintenance-orders", payload: { mold_id: "${mold_id}", kind: "PM", window_start: "2026-09-20T08:00:00Z", window_end: "2026-09-20T12:00:00Z" }, as: ToolroomTech, captures: { mo_id: $.data.id } }
            - { call: "GET /molds/${mold_id}", payload: {}, as: ToolroomTech, captures: { mold_v: $.data.version } }
          trigger:
            - { call: "POST /maintenance-orders/${mo_id}/close", payload: { reset_shot_counter: true, expected_mold_version: "${mold_v}" }, as: ToolroomTech }
          assert:
            - "the response status is 200 and MaintenanceOrder.${mo_id}.status == CLOSED and shots_reset == true"
            - "Mold.${mold_id}.service_state == SERVICEABLE"
            - "Mold.${mold_id}.shots_since_pm == 0 and Mold.${mold_id}.total_shot_count == 0"
            - "Mold.${mold_id}.version == ${mold_v} + 1"

      - name: maintenance_close_without_reset_below_pm_interval_returns_invalid_state
        claim_type: Conditional cascade
        grounds: ["state_machines.Mold.IN_MAINTENANCE_to_PM_DUE", "errors[ERR_INVALID_STATE]", "entities.MaintenanceOrder.fields.shots_reset"]
        distinguishing_aspect: "IN_MAINTENANCE -> PM_DUE is declared only when shots_since_pm >= pm_interval_shots, so closing without a reset on a tool at 0 shots has no declared target state and returns 409 ERR_INVALID_STATE with the order still OPEN."
        test_recipe:
