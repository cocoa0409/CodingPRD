        claim_type: side_effect_execution
        grounds:
          - state_machines[ProcedureCase.schedule_status] IN_ROOM -> COMPLETED side_effects
          - state_machines[SurveillanceRecall.status] SCHEDULED_DUE -> SATISFIED
        excluded_because:
          difficulty_instance: tc_complete_case_recall_patient_depth3
          rationale: "CASCADE A's three hops — case COMPLETED, the single highest-ranked matching recall SATISFIED, the patient counter and version recomputed — are asserted end to end there, including the negative half that the non-matching STONE recall is left untouched."

      - name: sm_compensation_referral_visit_ledger_reversal
