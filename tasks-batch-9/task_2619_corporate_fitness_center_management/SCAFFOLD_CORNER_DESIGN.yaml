      - name: amendment_creates_successor_contract_and_supersedes_predecessor
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /client-contracts/{id}/amendments]
          - entities.ClientContract.fields.supersedes_contract_id
          - errors.ERR_AMENDMENT_NOT_ALLOWED
          - relationship_patterns.self_referential
        distinguishing_aspect: |
          The amendment mints a NEW contract rather than mutating the old one:
          the successor is DRAFT with supersedes_contract_id pointing at the
          predecessor, carries the same site_code without tripping
          ERR_SITE_CODE_CONFLICT, and may switch fee_structure to MANAGEMENT_FEE.
          The predecessor stays ACTIVE and untouched, and amending the DRAFT
          successor is 409 ERR_AMENDMENT_NOT_ALLOWED (only ACTIVE or SUSPENDED
          contracts may be amended).
        test_recipe:
          setup:
            - "ACTIVE-CONTRACT chain (COST_PLUS, site_code NWM-01, not_to_exceed_cents 5000000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
              payload: { client_name: "Northwind Manufacturing", site_code: "NWM-01", fee_structure: "COST_PLUS", staffing_model: "OPERATOR_EMPLOYED", budgeted_staff_fte: 3.5, participation_target_pct: 35, term_start_on: "2026-07-01", term_end_on: "2027-06-30", not_to_exceed_cents: 5000000 }
              as: OperatorAdmin
              captures: { c_id: $.data.id }
            - call: "POST /staff-members"
              payload: { contract_id: "${c_id}", full_name: "Dana Reed", role_type: "SITE_MANAGER", employment_type: "OPERATOR_EMPLOYED", hourly_cost_cents: 5200 }
              as: OperatorAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /staff-credentials"
              payload: { staff_member_id: "${mgr_id}", credential_type: "CPR_AED", issuer: "American Heart Association", credential_number: "AHA-771", expires_on: "2027-06-30" }
              as: OperatorAdmin
              captures: { mgr_cred_id: $.data.id }
            - call: "POST /staff-credentials/${mgr_cred_id}/verify"
              payload: { decision: "ACCEPT" }
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/submit"
              payload: {}
              as: OperatorAdmin
            - call: "POST /client-contracts/${c_id}/client-decision"
              payload: { decision: "APPROVE" }
              as: ClientSponsor
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /client-contracts/${c_id}/amendments"
              payload: { fee_structure: "MANAGEMENT_FEE", staffing_model: "HYBRID", budgeted_staff_fte: 4.0, participation_target_pct: 45, term_start_on: "2027-07-01", term_end_on: "2028-06-30", management_fee_cents: 40000 }
              as: OperatorAdmin
              captures: { c_next_id: $.data.id }
            - call: "POST /client-contracts/${c_next_id}/amendments"
              payload: { fee_structure: "MANAGEMENT_FEE", staffing_model: "HYBRID", budgeted_staff_fte: 4.0, participation_target_pct: 45, term_start_on: "2028-07-01", term_end_on: "2029-06-30", management_fee_cents: 41000 }
              as: OperatorAdmin
              captures: { err_amend: $.data.error_id }
          assert:
            - "First amendment -> HTTP 201 AND ClientContract.${c_next_id}.id != \"${c_id}\" AND status == \"DRAFT\" AND version == 1"
            - "ClientContract.${c_next_id}.supersedes_contract_id == \"${c_id}\" AND site_code == \"NWM-01\" AND fee_structure == \"MANAGEMENT_FEE\" AND management_fee_cents == 40000 AND not_to_exceed_cents == null"
            - "ClientContract.${c_next_id}.revision_round == 0 AND ytd_billed_cents == 0 AND approved_at == null"
            - "Predecessor untouched: ClientContract.${c_id}.status == \"ACTIVE\" AND fee_structure == \"COST_PLUS\" AND supersedes_contract_id == null"
            - "Second amendment (on the DRAFT successor) -> HTTP 409 AND data.error_id == \"ERR_AMENDMENT_NOT_ALLOWED\""
            - "GET /client-contracts with supersedes_contract_id ${c_id} -> total_count == 1"

