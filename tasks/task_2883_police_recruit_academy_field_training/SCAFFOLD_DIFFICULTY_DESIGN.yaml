      - name: fto_aggregate_concurrent_trainee_capacity_exceeded
        grounds:
          - validations[priority 80 category business_fiscal ERR_FTO_LOAD_EXCEEDED]
          - entities.Instructor.fields.active_trainee_count
          - endpoints[POST /field-training-rotations]
          - endpoints[GET /field-training-rotations]
          - errors.ERR_FTO_LOAD_EXCEEDED
        distinguishing_aspect: |
          This is an AGGREGATE temporal rule, not a pairwise one: each of the FTO's two existing
          rotations is individually legal, and the third candidate conflicts with neither trainee
          (they are three different recruits, so the per-trainee overlap rule at priority 60 and the
          rotating-trainer rule at priority 63 are both silent). Only the COUNT of the FTO's
          {PLANNED, ACTIVE, REMEDIAL} rotations whose CLOSED intervals intersect the candidate's
          window - 2, which is not <= FTO_MAX_CONCURRENT_TRAINEES - 1 - rejects it. Moving the same
          candidate to a non-overlapping window is accepted, proving the limit is on concurrency and
          not on lifetime caseload. The load is also evaluated at PLANNING time: all three rotations
          are PLANNED, so active_trainee_count (which counts only ACTIVE / REMEDIAL) is still 0.
