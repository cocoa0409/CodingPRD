  - rule_id: non_linear_state_machine
    instances:
      - name: claim_parallel_adjustment_and_payment_axes
        grounds:
          - state_machines.Claim.ADJUSTED_to_SETTLED
          - state_machines.Claim.SETTLED_to_CLOSED
          - state_machines.Claim.CLOSED_to_SETTLED
          - state_machines.Claim.UNPAID_to_PAID
          - state_machines.Claim.PAID_to_UNPAID
          - entities.Claim.fields.adjustment_status
          - entities.Claim.fields.payment_status
          - concurrency_rules[loss-payment-stale-claim]
        distinguishing_aspect: |
          Claim carries two independent state dimensions on one row: adjustment_status
          (REPORTED -> ADJUSTED -> SETTLED -> CLOSED) and payment_status (UNPAID -> PARTIALLY_PAID
          -> PAID). The payment axis is driven only by LossPayment rows, and its movement is what
          drags the adjustment axis into CLOSED and back out to SETTLED, so the combined state -
          not either axis alone - is the observable.
