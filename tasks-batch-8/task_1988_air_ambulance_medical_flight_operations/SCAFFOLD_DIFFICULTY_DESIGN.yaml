  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: mission_request_info_cycle
        grounds:
          - state_machines.MissionRequest.TRIAGED_to_PENDING_INFO
          - state_machines.MissionRequest.PENDING_INFO_to_TRIAGED
        distinguishing_aspect: |
          Cyclic machine on MissionRequest: TRIAGED -> PENDING_INFO -> TRIAGED
          loops (not a linear pipeline), and the loop back recomputes the
          acceptance score from updated subscales (6.40 + 2.00 bonus = 8.40).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; patient; mission request TRIAGED with verified 8/6/5/3 and onset 60 min before now"
          setup_api_calls:
