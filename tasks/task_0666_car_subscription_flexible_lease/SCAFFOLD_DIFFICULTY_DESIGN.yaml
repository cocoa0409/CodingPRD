  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: mileage_overage_zero_at_included_plus_buffer_exact
        grounds:
          - calculations.mileage_overage
          - endpoints["POST /billing-cycles/{id}/close"]
          - entities.BillingCycle.fields.overage_cents
        distinguishing_aspect: |
          Numeric threshold metric on the close endpoint: delta == included(1000)+buffer(50)=1050 exactly
          bills 0 overage; delta 1051 bills exactly 1 mile (25 cents). The boundary is inclusive of the
          buffer (free up to and including 1050).
        test_recipe:
          setup:
            - "ACTIVE subscription, vehicle odometer 5000 at activation, cycle #1 OPEN; close with odometer_end 6050 (delta exactly 1050)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 80000, included_miles_per_cycle: 1000, free_buffer_miles: 50, overage_tier1_rate_cents: 25, overage_tier2_rate_cents: 38, included_swaps_per_term: 1, min_term_months: 6, deposit_base_cents: 80000 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /fleets"
              payload: { name: "B1", region_code: "CA" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "B1-1", model_label: "XC40", odometer_miles: 5000 }
              as: FleetOperator
              captures: { veh_id: $.data.id, veh_v0: $.data.version }
            - call: "POST /applicants"
              payload: { full_name: "A", email: "b1@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/assign-vehicle"
              payload: { vehicle_id: "${veh_id}", expected_vehicle_version: "${veh_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "C", fleet_id: "${fleet_id}" }
              as: FleetOperator
              captures: { cr: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: FleetOperator
            - call: "GET /subscriptions/${sub_id}/billing-cycles"
              payload: { status: "OPEN" }
              as: BillingAdmin
              captures: { cycle_id: $.data.0.id }
          trigger:
            - call: "POST /billing-cycles/${cycle_id}/close"
              payload: { odometer_end_miles: 6050 }
              as: BillingAdmin
              captures: { ov: $.data.overage_cents }
          assert:
            - "BillingCycle.${cycle_id}.overage_cents == 0 (delta 1050 == included+buffer, inclusive free boundary)"
            - "the posted CYCLE Invoice.amount_cents == 80000 (monthly_fee only, no overage)"

      - name: empty_fleet_utilization_zero_not_divide_by_zero
        grounds:
          - calculations.fleet_utilization
          - endpoints["GET /fleets/{id}"]
          - entities.Fleet.fields.utilization_pct
        distinguishing_aspect: |
          Empty-set boundary on a different metric and a different endpoint: a Fleet with zero vehicles
          reads utilization_pct == 0 (not null, not an error), guarding the total_vehicles==0 divide.
        test_recipe:
          setup:
            - "A freshly created Fleet with no vehicles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fleets"
              payload: { name: "Empty", region_code: "NV" }
              as: PlatformAdmin
              captures: { fleet_id: $.data.id }
          trigger:
            - call: "GET /fleets/${fleet_id}"
              payload: {}
              as: FleetOperator
              captures: { util: $.data.utilization_pct, total: $.data.total_vehicles }
          assert:
            - "Fleet.${fleet_id}.total_vehicles == 0"
            - "Fleet.${fleet_id}.utilization_pct == 0 (empty-set boundary, no divide-by-zero error)"

