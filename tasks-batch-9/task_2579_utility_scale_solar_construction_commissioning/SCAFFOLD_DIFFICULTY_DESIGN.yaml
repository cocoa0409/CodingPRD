# ---------------------------------------------------------------------------
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2579 — Utility-Scale Solar Construction & Commissioning
# Nine §0.5 rule_ids x 2 instances = 18 instances.
# Every numeric literal in `assert:` was computed by executing the referenced
# §1.3 formula with its declared constants.
# The logical clock defaults to 2026-08-01T00:00:00Z; chains set it explicitly
# whenever a blackout, outage-window containment or delay-day count matters.
# ---------------------------------------------------------------------------
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: capacity_test_as_measured_fails_where_weather_corrected_passes
        grounds:
          - calculations.capacity_test_result
          - entities.CommissioningTest.fields.correction_variant
          - entities.CommissioningTest.fields.reported_kw_ac
          - entities.TestInterval.fields.corrected_kw_ac
          - state_machines.CommissioningTest.IN_PROGRESS_to_PASSED
          - state_machines.CommissioningTest.IN_PROGRESS_to_FAILED
        distinguishing_aspect: |
          This instance lives in the commissioning-measurement domain: the
          identical three metered intervals produce reported_kw_ac 78.75 under
          AS_MEASURED and 99.74 under WEATHER_CORRECTED, a 20.99 kW divergence
          that straddles the 98.00 pass threshold and therefore flips the test
          from FAILED to PASSED.
        test_recipe:
          setup:
            - "One project with guaranteed_capacity_kw_ac 100 (pass threshold 98.00 kW AC) and dc_capacity_kw 130"
            - "One substation energized inside an APPROVED BACKFEED outage window, logical clock at 2026-08-10T02:00:00Z"
            - "Test A is IN_PROGRESS with correction_variant AS_MEASURED and three appended intervals, two valid and one invalid"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: EpcProjectManager
            - call: "POST /solar/projects"
              payload: { name: "Solstice Ridge", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/substations"
              payload: { substation_code: "S1", interconnection_voltage_kv: 138.0, mv_collection_km: 12.5 }
              as: UtilityCoordinator
              captures: { sub: $.data.id }
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-10T04:00:00Z", purpose: "BACKFEED" }
              as: UtilityCoordinator
              captures: { ow: $.data.id }
            - call: "POST /solar/outage-windows/${ow}/utility-response"
              payload: { decision: "APPROVE", utility_reference: "SO-4471" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "STEEL_ERECTED", utility_witness_ref: "W-1" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "EQUIPMENT_SET", utility_witness_ref: "W-2" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "BACKFEED_REQUESTED", utility_witness_ref: "W-3" }
              as: UtilityCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-10T02:00:00Z" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "ENERGIZED", utility_witness_ref: "W-4" }
              as: UtilityCoordinator
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: CommissioningEngineer
              captures: { pv1: $.data.version }
            - call: "POST /solar/commissioning-tests"
              payload: { project_id: "${proj}", test_type: "CAPACITY", correction_variant: "AS_MEASURED", scheduled_at: "2026-08-10T03:00:00Z", expected_project_version: "${pv1}" }
              as: CommissioningEngineer
              captures: { test_a: $.data.id }
            - call: "POST /solar/commissioning-tests/${test_a}/intervals"
              payload: { sampled_at: "2026-08-10T03:00:00Z", irradiance_w_m2: 850, measured_kw_ac: 76.50, ambient_c: 30, wind_m_s: 3.0 }
              as: CommissioningEngineer
            - call: "POST /solar/commissioning-tests/${test_a}/intervals"
              payload: { sampled_at: "2026-08-10T03:15:00Z", irradiance_w_m2: 900, measured_kw_ac: 81.00, ambient_c: 32, wind_m_s: 4.0 }
              as: CommissioningEngineer
            - call: "POST /solar/commissioning-tests/${test_a}/intervals"
              payload: { sampled_at: "2026-08-10T03:30:00Z", irradiance_w_m2: 500, measured_kw_ac: 40.00, ambient_c: 20, wind_m_s: 2.0 }
              as: CommissioningEngineer
          trigger:
            - call: "POST /solar/commissioning-tests/${test_a}/finalization"
              payload: { note: "as-measured run" }
              as: CommissioningEngineer
              captures: { rep_a: $.data.reported_kw_ac, thr_a: $.data.pass_threshold_kw_ac }
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: CommissioningEngineer
              captures: { pv2: $.data.version }
            - call: "POST /solar/commissioning-tests"
              payload: { project_id: "${proj}", test_type: "CAPACITY", correction_variant: "WEATHER_CORRECTED", scheduled_at: "2026-08-10T03:45:00Z", expected_project_version: "${pv2}" }
              as: CommissioningEngineer
              captures: { test_b: $.data.id }
            - call: "POST /solar/commissioning-tests/${test_b}/intervals"
              payload: { sampled_at: "2026-08-10T03:00:00Z", irradiance_w_m2: 850, measured_kw_ac: 76.50, ambient_c: 30, wind_m_s: 3.0 }
              as: CommissioningEngineer
            - call: "POST /solar/commissioning-tests/${test_b}/intervals"
              payload: { sampled_at: "2026-08-10T03:15:00Z", irradiance_w_m2: 900, measured_kw_ac: 81.00, ambient_c: 32, wind_m_s: 4.0 }
              as: CommissioningEngineer
            - call: "POST /solar/commissioning-tests/${test_b}/intervals"
              payload: { sampled_at: "2026-08-10T03:30:00Z", irradiance_w_m2: 500, measured_kw_ac: 40.00, ambient_c: 20, wind_m_s: 2.0 }
              as: CommissioningEngineer
            - call: "POST /solar/commissioning-tests/${test_b}/finalization"
              payload: { note: "weather-corrected run" }
              as: CommissioningEngineer
              captures: { rep_b: $.data.reported_kw_ac }
          assert:
            - "${rep_a} == 78.75 and ${thr_a} == 98.00"
            - "CommissioningTest.${test_a}.status was FAILED at finalization, then VOID with void_reason == SUPERSEDED_BY_NEW_TEST and superseded == true after ${test_b} was created"
            - "CommissioningTest.${test_a}.valid_interval_count == 2 and interval_count == 3"
            - "${rep_b} == 99.74 and CommissioningTest.${test_b}.status == PASSED"
            - "${rep_b} - ${rep_a} == 20.99"
            - "TestInterval rows of ${test_b}: corrected_kw_ac == 99.11 for the 850 W/m2 sample, 100.36 for the 900 W/m2 sample, and null for the 500 W/m2 sample (is_valid == false)"
            - "CommissioningTest.${test_b}.pass_threshold_kw_ac == 98.00"

      - name: apprenticeship_project_aggregate_qualifies_where_weekly_worst_case_fails
        grounds:
          - calculations.apprenticeship_compliance
          - calculations.prevailing_wage_restitution
          - entities.Project.fields.apprenticeship_basis_applied
          - entities.Project.fields.apprentice_hours_pct
          - entities.Project.fields.tax_credit_status
          - entities.PayrollWeek.fields.apprentice_pct
        distinguishing_aspect: |
          This instance lives in the certified-payroll / tax-credit domain, a
          different entity domain from the commissioning instance: the same four
          labor entries yield apprentice_hours_pct 17.50 under PROJECT_AGGREGATE
          (QUALIFIED) and 5.00 under WEEKLY_WORST_CASE (DISQUALIFIED), because
          the weekly variant rounds per week before taking the minimum instead
          of pooling hours across weeks.
        test_recipe:
          setup:
            - "One project with apprenticeship_min_pct 15.00, prevailing_wage_election REMEDIABLE and apprenticeship_basis PROJECT_AGGREGATE"
            - "Payroll week 2026-07-27 with 30.00 apprentice hours and 70.00 journeyworker hours (apprentice_pct 30.00)"
            - "Payroll week 2026-08-03 with 5.00 apprentice hours and 95.00 journeyworker hours (apprentice_pct 5.00)"
            - "Every entry is paid at or above its prevailing rate, so restitution is 0 and only the apprenticeship gate can move tax_credit_status"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Mesa Flats", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69, prevailing_wage_election: "REMEDIABLE", apprenticeship_basis: "PROJECT_AGGREGATE", apprenticeship_min_pct: 15.00 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/payroll-weeks"
              payload: { week_start_date: "2026-07-27" }
              as: LaborComplianceOfficer
              captures: { wk_a: $.data.id }
            - call: "POST /solar/payroll-weeks/${wk_a}/labor-entries"
              payload: { worker_ref: "W-101", classification: "ELECTRICIAN", is_apprentice: true, hours: 30.00, paid_rate_cents: 4200, fringe_rate_cents: 800, prevailing_rate_cents: 5000, work_date: "2026-07-28" }
              as: LaborComplianceOfficer
            - call: "POST /solar/payroll-weeks/${wk_a}/labor-entries"
              payload: { worker_ref: "W-102", classification: "ELECTRICIAN", is_apprentice: false, hours: 70.00, paid_rate_cents: 4200, fringe_rate_cents: 800, prevailing_rate_cents: 5000, work_date: "2026-07-29" }
              as: LaborComplianceOfficer
            - call: "POST /solar/projects/${proj}/payroll-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { wk_b: $.data.id }
            - call: "POST /solar/payroll-weeks/${wk_b}/labor-entries"
              payload: { worker_ref: "W-103", classification: "LABORER", is_apprentice: true, hours: 5.00, paid_rate_cents: 3500, fringe_rate_cents: 700, prevailing_rate_cents: 4200, work_date: "2026-08-04" }
              as: LaborComplianceOfficer
            - call: "POST /solar/payroll-weeks/${wk_b}/labor-entries"
              payload: { worker_ref: "W-104", classification: "LABORER", is_apprentice: false, hours: 95.00, paid_rate_cents: 3500, fringe_rate_cents: 700, prevailing_rate_cents: 4200, work_date: "2026-08-05" }
              as: LaborComplianceOfficer
          trigger:
            - call: "POST /solar/projects/${proj}/labor-compliance-runs"
              payload: { basis_override: "PROJECT_AGGREGATE" }
              as: LaborComplianceOfficer
              captures: { pct_agg: $.data.apprentice_hours_pct, status_agg: $.data.tax_credit_status }
            - call: "POST /solar/projects/${proj}/labor-compliance-runs"
              payload: { basis_override: "WEEKLY_WORST_CASE" }
              as: LaborComplianceOfficer
              captures: { pct_wk: $.data.apprentice_hours_pct, status_wk: $.data.tax_credit_status }
          assert:
            - "${pct_agg} == 17.50 and ${status_agg} == QUALIFIED"
            - "${pct_wk} == 5.00 and ${status_wk} == DISQUALIFIED"
            - "Project.${proj}.apprenticeship_basis_applied == WEEKLY_WORST_CASE after the second run, while Project.${proj}.apprenticeship_basis is still PROJECT_AGGREGATE"
            - "PayrollWeek.${wk_a}.apprentice_pct == 30.00 and PayrollWeek.${wk_b}.apprentice_pct == 5.00"
            - "Project.${proj}.total_labor_hours == 200.00 and Project.${proj}.apprentice_labor_hours == 35.00"
            - "Project.${proj}.wage_restitution_owed_cents == 0 after both runs"

  - rule_id: combinatorial_formula
    instances:
      - name: prevailing_wage_restitution_rounds_per_entry_before_summing
        grounds:
          - calculations.prevailing_wage_restitution
          - entities.LaborEntry.fields.shortfall_cents_per_hour
          - entities.LaborEntry.fields.restitution_cents
          - entities.Project.fields.wage_restitution_owed_cents
          - entities.Project.fields.wage_liquidated_damages_cents
        distinguishing_aspect: |
          Mode (b) — pinned rounding order inside a multi-term aggregation: each
          entry's shortfall x hours product is rounded to whole cents BEFORE the
          sum, giving 758 + 657 + 332 = 1747 cents, whereas summing the raw
          products (1746.40) and rounding once gives 1746 cents; the 1-cent gap
          also moves the liquidated-damages line.
        test_recipe:
          setup:
            - "One project with prevailing_wage_election REMEDIABLE, so under-prevailing entries are accepted and accrue restitution"
            - "One OPEN payroll week 2026-08-03 holding exactly three POSTED journeyworker entries"
            - "Entry 1: shortfall 75 cents/hour x 10.10 h; Entry 2: 55 x 11.95; Entry 3: 45 x 7.37"
          setup_api_calls:
            - call: "POST /solar/projects"
              payload: { name: "Dry Wash", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69, prevailing_wage_election: "REMEDIABLE" }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/payroll-weeks"
              payload: { week_start_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { wk: $.data.id }
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-201", classification: "IRONWORKER", is_apprentice: false, hours: 10.10, paid_rate_cents: 4000, fringe_rate_cents: 925, prevailing_rate_cents: 5000, work_date: "2026-08-03" }
              as: LaborComplianceOfficer
              captures: { le1: $.data.id, sf1: $.data.shortfall_cents_per_hour, r1: $.data.restitution_cents }
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-202", classification: "IRONWORKER", is_apprentice: false, hours: 11.95, paid_rate_cents: 4000, fringe_rate_cents: 945, prevailing_rate_cents: 5000, work_date: "2026-08-04" }
              as: LaborComplianceOfficer
              captures: { le2: $.data.id, r2: $.data.restitution_cents }
            - call: "POST /solar/payroll-weeks/${wk}/labor-entries"
              payload: { worker_ref: "W-203", classification: "OPERATOR", is_apprentice: false, hours: 7.37, paid_rate_cents: 4200, fringe_rate_cents: 755, prevailing_rate_cents: 5000, work_date: "2026-08-05" }
              as: LaborComplianceOfficer
              captures: { le3: $.data.id, r3: $.data.restitution_cents }
          trigger:
            - call: "POST /solar/projects/${proj}/labor-compliance-runs"
              payload: {}
              as: LaborComplianceOfficer
              captures: { owed: $.data.wage_restitution_owed_cents, ld: $.data.wage_liquidated_damages_cents, credit: $.data.tax_credit_status }
          assert:
            - "${sf1} == 75 and ${r1} == 758"
            - "${r2} == 657 and ${r3} == 332"
            - "${owed} == 1747, NOT 1746 (the round-once-at-the-end answer)"
            - "${ld} == 349"
            - "${credit} == DISQUALIFIED"
            - "PayrollWeek.${wk}.total_hours == 29.42 and entry_count == 3"

      - name: substantial_completion_settlement_waterfall_order_pinned
        grounds:
          - calculations.substantial_completion_settlement
          - calculations.change_order_ledger
          - state_machines.Project.SC_CLAIMED_to_SC_CERTIFIED
          - entities.Project.fields.ld_assessed_cents
          - entities.Project.fields.punchlist_holdback_cents
          - entities.Project.fields.sc_payment_due_cents
        distinguishing_aspect: |
          Mode (c) — a pinned evaluation order over mutually referencing terms:
          the LD cap and the retainage both derive from the change-order-adjusted
          contract value, and the punch-list holdback is then clamped by that
          retainage, so the seven steps must run 1..7; evaluating the holdback
          before the retainage or capping LDs against the base contract yields a
          different sc_payment_due_cents.
        test_recipe:
          setup:
            - "Project: contract_value_cents 10000000, retainage_pct 0.05, ld_per_day_cents 50000, ld_cap_pct 0.05, sc_deadline_date 2026-08-01"
            - "One accepted change order of 1000000 cents, so the adjusted contract is 11000000"
            - "Project readiness READY (one accepted grading area, one mc_ready block) and milestone_state SC_CLAIMED"
            - "One PASSED CAPACITY test on an energized substation; one OPEN MAJOR punch item estimated at 200000 cents and no open CRITICAL item"
            - "Logical clock at 2026-08-13T00:00:00Z, i.e. 12 calendar days past the substantial-completion deadline"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: EpcProjectManager
            - call: "POST /solar/projects"
              payload: { name: "Coyote Bench", utility_name: "Basin Power", ac_capacity_kw: 100, dc_capacity_kw: 130, contract_value_cents: 10000000, retainage_pct: 0.05, ld_per_day_cents: 50000, ld_cap_pct: 0.05, sc_deadline_date: "2026-08-01", guaranteed_capacity_kw_ac: 100, guaranteed_performance_ratio: 0.69 }
              as: EpcProjectManager
              captures: { proj: $.data.id }
            - call: "POST /solar/projects/${proj}/grading-areas"
              payload: { area_code: "A1", permit_number: "CGP-2026-118", disturbed_acreage_limit: 40.00, bmp_inspection_interval_days: 14 }
              as: CivilSuperintendent
              captures: { ga: $.data.id }
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "CLEARING", work_start_at: "2026-08-01T12:00:00Z", work_end_at: "2026-08-01T20:00:00Z", acreage_disturbed_delta: 10.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/earthwork-logs"
              payload: { activity_type: "GRADING", work_start_at: "2026-08-02T12:00:00Z", work_end_at: "2026-08-02T20:00:00Z", acreage_disturbed_delta: 8.00 }
              as: CivilSuperintendent
            - call: "POST /solar/grading-areas/${ga}/acceptance"
              payload: { compaction_test_pct: 96.5, drainage_inspection_passed: true }
              as: OwnerEngineer
            - call: "POST /solar/projects/${proj}/yard-zones"
              payload: { zone_code: "Y1", pallet_capacity: 100 }
              as: ProcurementCoordinator
              captures: { yz: $.data.id, yz_v: $.data.version }
            - call: "POST /solar/deliveries"
              payload: { project_id: "${proj}", yard_zone_id: "${yz}", component_type: "MODULE", unit_qty: 60, pallets: 60, planned_arrival_at: "2026-08-03T09:00:00Z", laydown_window_start: "2026-08-03T00:00:00Z", laydown_window_end: "2026-08-07T00:00:00Z", expected_yard_zone_version: "${yz_v}" }
              as: ProcurementCoordinator
              captures: { del: $.data.id }
            - call: "POST /solar/deliveries/${del}/receipt"
              payload: { received_unit_qty: 60, damaged_unit_qty: 3 }
              as: ProcurementCoordinator
            - call: "POST /solar/projects/${proj}/blocks"
              payload: { grading_area_id: "${ga}", block_code: "B1", dc_capacity_kw: 130, planned_pile_count: 1, planned_string_count: 1 }
              as: EpcProjectManager
              captures: { blk: $.data.id }
            - call: "POST /solar/blocks/${blk}/piles"
              payload: { row_index: 1, position_index: 1, design_embedment_mm: 3000 }
              as: InstallationForeman
              captures: { pile: $.data.id }
            - call: "POST /solar/piles/${pile}/drive-results"
              payload: { actual_embedment_mm: 3000, plumb_deviation_mm: 5.0, blow_count: 42, refusal: false }
              as: InstallationForeman
            - call: "POST /solar/blocks/${blk}/mechanical-completion"
              payload: { modules_installed_qty: 50, max_torque_tube_deviation_mm: 18.0 }
              as: InstallationForeman
            - call: "POST /solar/blocks/${blk}/string-circuits"
              payload: { circuit_code: "C1", modules_in_series: 15 }
              as: InstallationForeman
              captures: { cir: $.data.id }
            - call: "POST /solar/string-circuits/${cir}/wiring"
              payload: { combiner_position: "CB1-01" }
              as: InstallationForeman
            - call: "POST /solar/string-circuits/${cir}/test-results"
              payload: { insulation_resistance_mohm: 55.0, measured_voc_v: 705.00, ambient_c: 40, polarity_ok: true }
              as: InstallationForeman
            - call: "POST /solar/projects/${proj}/substations"
              payload: { substation_code: "S1", interconnection_voltage_kv: 138.0, mv_collection_km: 12.5 }
              as: UtilityCoordinator
              captures: { sub: $.data.id }
            - call: "POST /solar/substations/${sub}/outage-windows"
              payload: { start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-10T04:00:00Z", purpose: "BACKFEED" }
              as: UtilityCoordinator
              captures: { ow: $.data.id }
            - call: "POST /solar/outage-windows/${ow}/utility-response"
              payload: { decision: "APPROVE", utility_reference: "SO-4471" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "STEEL_ERECTED", utility_witness_ref: "W-1" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "EQUIPMENT_SET", utility_witness_ref: "W-2" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "BACKFEED_REQUESTED", utility_witness_ref: "W-3" }
              as: UtilityCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-10T02:00:00Z" }
              as: UtilityCoordinator
            - call: "POST /solar/substations/${sub}/status-advances"
              payload: { to_status: "ENERGIZED", utility_witness_ref: "W-4" }
              as: UtilityCoordinator
            - call: "GET /solar/projects/${proj}"
              payload: {}
              as: CommissioningEngineer
              captures: { pv: $.data.version }
            - call: "POST /solar/commissioning-tests"
              payload: { project_id: "${proj}", test_type: "CAPACITY", correction_variant: "WEATHER_CORRECTED", scheduled_at: "2026-08-10T03:00:00Z", expected_project_version: "${pv}" }
              as: CommissioningEngineer
              captures: { test: $.data.id }
            - call: "POST /solar/commissioning-tests/${test}/intervals"
              payload: { sampled_at: "2026-08-10T03:00:00Z", irradiance_w_m2: 850, measured_kw_ac: 76.50, ambient_c: 30, wind_m_s: 3.0 }
              as: CommissioningEngineer
            - call: "POST /solar/commissioning-tests/${test}/intervals"
              payload: { sampled_at: "2026-08-10T03:15:00Z", irradiance_w_m2: 900, measured_kw_ac: 81.00, ambient_c: 32, wind_m_s: 4.0 }
              as: CommissioningEngineer
            - call: "POST /solar/commissioning-tests/${test}/finalization"
              payload: {}
              as: CommissioningEngineer
            - call: "POST /solar/projects/${proj}/punch-list-items"
