        distinguishing_aspect: |
          A lapse requires the clock to be strictly past due_at, so with due_at equal to the
          current logical clock (2026-08-01T00:00:00Z) the call is refused with 422
          ERR_CYCLE_NOT_PAST_DUE and the cycle stays OPEN — equality is not "past due".
        test_recipe:
          setup:
            - "Community; CrsCycle 2025 covering 2025-01-01..2025-12-31 with due_at exactly 2026-08-01T00:00:00Z; the clock is left at its startup default."
          setup_api_calls:
