            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Owner A", billing_email: "a@own.example", credit_limit_cents: 100000 }, as: NetworkOperator, captures: { a_id: $.data.id } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${a_id}", card_number: "FC-OA01", vehicle_plate: "1MMM013", daily_gge_limit: 100.0 }, as: FleetAccountManager, as_user_id: "${a_id}", captures: { card_a: $.data.id } }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Owner B", billing_email: "b@own.example", credit_limit_cents: 100000 }, as: NetworkOperator, captures: { b_id: $.data.id, b_v: $.data.version } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${b_id}", card_number: "FC-OB01", vehicle_plate: "1NNN014", daily_gge_limit: 100.0 }, as: FleetAccountManager, as_user_id: "${b_id}", captures: { card_b: $.data.id } }
          trigger:
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_b}", dispenser_id: "${dsp_c}", client_ref: "CR-OW1", estimated_gge: 5.0, expected_fleet_account_version: "${b_v}" }, as: FleetDriver, as_user_id: "${card_a}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CARD_OWNERSHIP_MISMATCH with HTTP 403 (driver identity must equal the card used)"

      - name: fam_cannot_manage_other_accounts_cards
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_ACCOUNT_OWNERSHIP_MISMATCH]"]
        distinguishing_aspect: "FleetAccountManager for account A creating a card on account B is rejected with ERR_ACCOUNT_OWNERSHIP_MISMATCH (403)."
        test_recipe:
