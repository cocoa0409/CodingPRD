              as: Coach
              as_user_id: "${c_b_id}"
              captures: { tm_b_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_c_id}", name: "Charlie" }
              as: Coach
              as_user_id: "${c_c_id}"
              captures: { tm_c_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm_a_id}", student_id: "${st_a_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_a_id}"
              captures: { rs_a_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm_b_id}", student_id: "${st_b_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_b_id}"
              captures: { rs_b_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm_c_id}", student_id: "${st_c_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_c_id}"
