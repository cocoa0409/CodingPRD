            - call: "POST /fab/spc-charts"
              payload: { step_id: "${s20}", param_name: "ETCH_DEPTH", target: 100.00, sigma: 2.00, usl: 110.00, lsl: 90.00, ucl: 106.00, lcl: 94.00 }
