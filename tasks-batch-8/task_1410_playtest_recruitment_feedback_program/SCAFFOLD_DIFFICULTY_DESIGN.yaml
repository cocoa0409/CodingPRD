              as: Participant
              as_user_id: "${pa_id}"
              captures: { bka_id: "$.data.id"}
            - call: "POST /playtests/session-bookings"
              payload: { session_id: "${sess_id}" }
              as: Participant
              as_user_id: "${pb_id}"
              captures: { bkb_id: "$.data.id"}
            - call: "GET /playtests/sessions/${sess_id}"
              as: Researcher
              captures: { taken_before: "$.data.seats_taken"}
          trigger:
            - call: "POST /playtests/session-bookings/${bka_id}/cancel"
              payload: {}
              as: Participant
              as_user_id: "${pa_id}"
              captures: { bka_status: "$.data.status"}
            - call: "GET /playtests/session-bookings/${bkb_id}"
              as: ResearchOpsAdmin
              captures: { bkb_status: "$.data.status"}
            - call: "GET /playtests/sessions/${sess_id}"
              as: Researcher
              captures: { taken_after: "$.data.seats_taken"}
          assert:
            - "taken_before == 1"
            - "bka_status == CANCELLED"
            - "bkb_status == PROMOTED"
            - "taken_after == 1   # cancel + promote pair conserves seats_taken"
            - "count of bookings in {BOOKED, PROMOTED, ATTENDED, NO_SHOW} for the session == 1 == seats_taken"
      - name: issue_revoke_conserves_key_pool
        grounds:
          - state_machines.AccessKey.ISSUED_to_REVOKED
          - entities.GameBuild.fields.keys_active_count
          - endpoints["POST /playtests/access-keys"]
        distinguishing_aspect: |
          Conserved quantity keys_active_count: the forward action (issue,
          count + 1) paired with its compensating action (revoke, count - 1)
          leaves build.keys_active_count == count(keys in {ISSUED, REDEEMED})
          == 0 unchanged, with both ExposureRecords persisted.
        test_recipe:
          setup:
            - "Participant P ENROLLED in study S (NDA SIGNED); build RELEASED with max_keys 2 and keys_active_count == 0"
          setup_api_calls:
            - call: "POST /playtests/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
            - call: "POST /playtests/participants"
              payload: { email: "ci2-p@x.com", full_name: "CI2 P", age_years: 25, region_code: "US-W", platform_tags: ["PC"] }
              as: ResearchOpsAdmin
              captures: { p_id: "$.data.id"}
            - call: "POST /playtests/participants/${p_id}/activate"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/studies"
              payload: { title: "CI2 Study", code: "CI2", min_age: 18, max_age: 35, allowed_regions: ["US-W"], required_platforms: ["PC"], cohort_capacity: 10, incentive_budget_cents: 1000000 }
              as: ResearchOpsAdmin
              captures: { s_id: "$.data.id"}
            - call: "POST /playtests/studies/${s_id}/open-recruitment"
              payload: {}
              as: ResearchOpsAdmin
            - call: "POST /playtests/nda-agreements"
              payload: { study_id: "${s_id}", version_label: "v1", body_text: "NDA text v1" }
              as: LegalCounsel
              captures: { nda_id: "$.data.id"}
            - call: "POST /playtests/nda-agreements/${nda_id}/publish"
              payload: {}
              as: LegalCounsel
            - call: "POST /playtests/applications"
              payload: { study_id: "${s_id}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { app_id: "$.data.id"}
            - call: "POST /playtests/applications/${app_id}/start-review"
              payload: {}
              as: Researcher
            - call: "POST /playtests/applications/${app_id}/approve"
              payload: {}
              as: Researcher
            - call: "GET /playtests/nda-signatures?participant_id=${p_id}&status=PENDING"
              as: ResearchOpsAdmin
              captures: { sig_id: "$.data[0].id"}
            - call: "POST /playtests/nda-signatures/${sig_id}/sign"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
            - call: "POST /playtests/builds"
              payload: { study_id: "${s_id}", build_label: "3.1.0", max_keys: 2, key_ttl_hours: 72 }
              as: ResearchOpsAdmin
              captures: { bld_id: "$.data.id"}
            - call: "POST /playtests/builds/${bld_id}/release"
              payload: {}
              as: ResearchOpsAdmin
          trigger:
            - call: "POST /playtests/access-keys"
              payload: { build_id: "${bld_id}", participant_id: "${p_id}" }
              as: ResearchOpsAdmin
              captures: { key_id: "$.data.id"}
            - call: "GET /playtests/builds/${bld_id}"
              as: ResearchOpsAdmin
              captures: { cnt_mid: "$.data.keys_active_count"}
            - call: "POST /playtests/access-keys/${key_id}/revoke"
              payload: {}
              as: ResearchOpsAdmin
              captures: { key_status: "$.data.status"}
            - call: "GET /playtests/builds/${bld_id}"
              as: ResearchOpsAdmin
              captures: { cnt_end: "$.data.keys_active_count"}
            - call: "GET /playtests/exposure-records?participant_id=${p_id}&build_id=${bld_id}"
              as: ResearchOpsAdmin
              captures: { exposures: "$.data"}
          assert:
            - "cnt_mid == 1        # forward action: ISSUED enters the active set"
            - "key_status == REVOKED"
            - "cnt_end == 0        # issue + revoke pair leaves the pool unchanged"
            - "count of keys in {ISSUED, REDEEMED} for the build == 0 == keys_active_count"
            - "exposures contains exactly one KEY_ISSUED and one KEY_REVOKED record"
