  - rule_id: boundary_precision_check
    instances:
      - name: vehicle_age_days_at_max_age_boundary
        grounds:
          - validations[priority=12]
          - entities.ProgramConfig.fields.max_age_days
          - entities.Inspection.fields.vehicle_age_days_at_inspection
          - errors.ERR_VEHICLE_AGE_EXCEEDED
        distinguishing_aspect: |
          Three vehicles differing by one calendar day each bracket max_age_days 2190 against the same
          started_at 2026-07-31: in_service 2020-08-02 gives 2189 days (accepted), 2020-08-01 gives
          exactly 2190 (accepted, because the bound is inclusive), and 2020-07-31 gives 2191
          (rejected). The stored vehicle_age_days_at_inspection is asserted for each, so an
          off-by-one in whole-day arithmetic cannot hide.
        test_recipe:
          setup:
            - "One dealer, one technician, the published MPI-172 template, clock at its 2026-08-01T00:00:00Z default."
            - "Three CLEAN 30000-mile vehicles with in_service_date 2020-08-02, 2020-08-01 and 2020-07-31."
            - "The two accepted inspections are spaced 4 hours apart so no buffered slot touches; the rejected one takes no slot."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Boundary Motors", franchise_code: "FR-9501", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
