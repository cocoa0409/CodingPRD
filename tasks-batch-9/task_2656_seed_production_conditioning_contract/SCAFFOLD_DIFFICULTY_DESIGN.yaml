  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: harvest_blocked_by_equipment_cleanout_variety
        grounds:
          - validations.priority_22_ERR_EQUIPMENT_CLEANOUT_REQUIRED
          - entities.HarvestEquipment.fields.last_cleanout_variety_id
          - entities.HarvestEquipment.fields.cleanout_certified
        distinguishing_aspect: |
          ENTITY PAIR: HarvestEvent depends on HarvestEquipment. The blocking condition is not the equipment's
          own lifecycle status - CMB-7 is AVAILABLE and cleanout_certified is true - but the IDENTITY carried in
          another entity's state field: last_cleanout_variety_id points at a different variety than the
          contract's. This is the varietal-mixing guard, so the dependency is on a cross-entity field value,
          and re-certifying the equipment for the right variety unblocks the identical request.
        test_recipe:
          setup:
            - "Two varieties HRW-Sable and SRW-Corvina; one contract on HRW-Sable advanced to INSPECTION_PASSED"
            - "Equipment CMB-7 is AVAILABLE and has been cleanout-certified, but for SRW-Corvina"
            - "Logical clock at 2026-09-14T00:00:00Z"
          setup_api_calls:
            - call: "POST /seed-ops/varieties"
              payload: { crop_kind: "WHEAT", variety_name: "HRW-Sable", max_seed_class: "CERTIFIED", isolation_min_m: 200.0, restricted_prior_crop_kinds: ["WHEAT", "TRITICALE"], restricted_prior_crop_years: 3, germination_min_pct: 85.0, purity_min_pct: 97.0, max_off_type_per_10000: 10.0, max_restricted_weed_per_10000: 5.0, max_disease_incidence_pct: 2.0, max_rogueing_rounds: 2, estimated_conditioning_shrink_pct: 8.0, germ_validity_days: 270, max_carryover_generations: 2, treatment_required: false }
              as: ProgramAdmin
