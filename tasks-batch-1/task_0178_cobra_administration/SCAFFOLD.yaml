# =============================================================================
# COBRA Administration — benchmark seed tables (Expert)
# =============================================================================
# Scenario 178: COBRA Administration — qualifying event/notice timeline,
# 60-day election window, premium billing/grace, coverage period
# (18/29/36 month), early termination, subsidy/conversion, late payment,
# HIPAA certificate.
# =============================================================================

scenario: |
  178. COBRA Administration: qualifying event/notice timeline, 60-day election
  window, premium billing/grace, coverage period (18/29/36 month), early
  termination, subsidy/conversion, late payment, HIPAA certificate

domain_name: cobra-administration
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - scheduled_actions          # clock-driven deadlines (election, grace, coverage-end)
    - cascading_side_effects     # event -> notice -> enrollment -> account -> invoices -> cert
    - dual_variant_calculation   # full-month vs prorated first premium; chronological vs forward subsidy ledger
    - derived_field_reconciliation # paid_through_date / amount_owed reconcile to payments+invoices

  entity_topology: flat
  # Peer entities linked by foreign keys (plan_id, beneficiary_id, event_id,
  # enrollment_id, account_id). Only the plan owns a nested collection; every
  # other entity is a flat top-level resource reachable by id and by FK filter.

  state_machine_shape: branching
  # QualifyingEvent and CobraEnrollment fork (elect-or-lapse, terminate-for-
  # cause vs run-to-term) with reverting / compensating side-effect sets;
  # PremiumAccount carries a parallel billing dimension that advances
  # independently of the enrollment lifecycle.

  relationship_patterns:
    - one_to_many        # plan -> beneficiaries; enrollment -> invoices
    - flat_with_references  # all cross-links are FK fields, no URL nesting beyond plan

  role_model: segregation_of_duties
  # PlanSponsor (employer) reports events but may NOT issue election notices or
  # post payments; PlanAdministrator runs notices/enrollment/early-termination;
  # BillingAgent posts payments and refunds but cannot adjudicate eligibility;
  # QualifiedBeneficiary elects/pays on its own record only.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: GroupHealthPlan
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Employer group health plan name" }
      - { name: applicable_premium_cents, type: integer, source: input, description: "Full monthly cost of the coverage (employee + employer share), the COBRA applicable premium base", constraints: "> 0" }
      - { name: standard_admin_fee_pct, type: number, source: input, default: 0.02, description: "Administrative load on the applicable premium for months 1-18/36 (0.02 = 2%)", constraints: "0 <= x <= 0.02" }
      - { name: disability_admin_fee_pct, type: number, source: input, default: 0.50, description: "Administrative load for disability-extension months 19-29 (0.50 = 50%, i.e. 150% premium)", constraints: "0 <= x <= 0.50" }
      - { name: employer_notice_days, type: integer, source: input, default: 30, description: "Days the sponsor has to report an employer-side qualifying event to the administrator" }
      - { name: election_notice_days, type: integer, source: input, default: 14, description: "Days the administrator has to send the election notice after the event is recorded" }
      - { name: election_window_days, type: integer, source: input, default: 60, description: "Length of the election window measured from the later of coverage-loss date and election-notice date" }
      - { name: initial_premium_grace_days, type: integer, source: input, default: 45, description: "Grace period for the first premium, measured from the election date" }
      - { name: recurring_premium_grace_days, type: integer, source: input, default: 30, description: "Grace period for each recurring monthly premium, measured from its first-of-month due date" }
      - { name: insignificant_shortfall_floor_cents, type: integer, source: input, default: 5000, description: "Floor of the insignificant-shortfall allowance ($50); allowance = max(floor, 10% of premium)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | TERMINATED", constraints: "ACTIVE | TERMINATED" }

  - name: QualifiedBeneficiary
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> GroupHealthPlan.id" }
      - { name: full_name, type: string, source: input, description: "Beneficiary legal name" }
      - { name: relationship, type: enum, source: input, description: "EMPLOYEE | SPOUSE | DEPENDENT", constraints: "EMPLOYEE | SPOUSE | DEPENDENT" }
      - { name: original_coverage_start, type: datetime, source: input, description: "Date the beneficiary's active (pre-COBRA) plan coverage began" }
      - { name: status, type: enum, source: system, default: ACTIVE_EMPLOYEE_COVERAGE, description: "ACTIVE_EMPLOYEE_COVERAGE | COBRA_ELIGIBLE | COBRA_ENROLLED | COVERAGE_ENDED", constraints: "ACTIVE_EMPLOYEE_COVERAGE | COBRA_ELIGIBLE | COBRA_ENROLLED | COVERAGE_ENDED" }

  - name: QualifyingEvent
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> GroupHealthPlan.id" }
      - { name: beneficiary_id, type: string, source: input, description: "FK -> QualifiedBeneficiary.id" }
      - { name: event_type, type: enum, source: input, description: "TERMINATION | REDUCTION_OF_HOURS | DIVORCE | DEATH_OF_EMPLOYEE | MEDICARE_ENTITLEMENT | DEPENDENT_AGE_OUT", constraints: "TERMINATION | REDUCTION_OF_HOURS | DIVORCE | DEATH_OF_EMPLOYEE | MEDICARE_ENTITLEMENT | DEPENDENT_AGE_OUT" }
      - { name: event_date, type: datetime, source: input, description: "Date the qualifying event occurred" }
      - { name: coverage_loss_date, type: datetime, source: input, description: "First date the beneficiary loses active coverage (anchor for the election window)" }
      - { name: max_coverage_months, type: integer, source: computed, description: "Base maximum COBRA duration: 18 for TERMINATION/REDUCTION_OF_HOURS, 36 for DIVORCE/DEATH_OF_EMPLOYEE/MEDICARE_ENTITLEMENT/DEPENDENT_AGE_OUT" }
      - { name: reported_at, type: datetime, source: system, description: "Clock time when the sponsor recorded the event" }
      - { name: employer_notice_deadline, type: datetime, source: computed, description: "event_date + plan.employer_notice_days (employer-side events only; null for divorce/age-out)" }
      - { name: late_reported, type: boolean, source: computed, default: false, description: "True when reported_at > employer_notice_deadline for an employer-side event" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | NOTICE_SENT | ELECTED | LAPSED | VOID", constraints: "RECORDED | NOTICE_SENT | ELECTED | LAPSED | VOID" }

  - name: ElectionNotice
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> QualifyingEvent.id" }
      - { name: beneficiary_id, type: string, source: system, description: "FK -> QualifiedBeneficiary.id" }
      - { name: notice_sent_date, type: datetime, source: system, description: "Clock time when the election notice was issued" }
      - { name: election_window_anchor, type: datetime, source: computed, description: "max(event.coverage_loss_date, notice_sent_date) — start of the 60-day window" }
      - { name: election_deadline, type: datetime, source: computed, description: "election_window_anchor + plan.election_window_days" }
      - { name: status, type: enum, source: system, default: OUTSTANDING, description: "OUTSTANDING | ELECTED | EXPIRED", constraints: "OUTSTANDING | ELECTED | EXPIRED" }

  - name: CobraEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: notice_id, type: string, source: input, description: "FK -> ElectionNotice.id" }
      - { name: beneficiary_id, type: string, source: system, description: "FK -> QualifiedBeneficiary.id" }
      - { name: event_id, type: string, source: system, description: "FK -> QualifyingEvent.id" }
      - { name: elected_at, type: datetime, source: system, description: "Clock time the election was made" }
      - { name: coverage_start_date, type: datetime, source: computed, description: "= event.coverage_loss_date (COBRA coverage is retroactive to the day active coverage was lost)" }
      - { name: base_max_months, type: integer, source: computed, description: "Copied from event.max_coverage_months at election (18 or 36)" }
      - { name: extension_months, type: integer, source: system, default: 0, description: "Added by disability extension (11) when granted; 0 otherwise" }
      - { name: scheduled_end_date, type: datetime, source: computed, description: "last day of coverage = coverage_start_date + (base_max_months + extension_months) months - 1 day" }
      - { name: disability_extension, type: boolean, source: system, default: false, description: "True once a valid disability extension has been applied" }
      - { name: actual_end_date, type: datetime, source: system, default: null, description: "Set when coverage actually ends (run-to-term or early termination)" }
      - { name: termination_reason, type: enum, source: system, default: null, description: "null | RUN_TO_TERM | NONPAYMENT | OTHER_GROUP_COVERAGE | MEDICARE_ENTITLEMENT | PLAN_TERMINATED", constraints: "RUN_TO_TERM | NONPAYMENT | OTHER_GROUP_COVERAGE | MEDICARE_ENTITLEMENT | PLAN_TERMINATED" }
      - { name: status, type: enum, source: system, default: PENDING_INITIAL_PREMIUM, description: "PENDING_INITIAL_PREMIUM | ACTIVE | TERMINATED", constraints: "PENDING_INITIAL_PREMIUM | ACTIVE | TERMINATED" }

  - name: PremiumAccount
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> CobraEnrollment.id (one account per enrollment)" }
      - { name: beneficiary_id, type: string, source: system, description: "FK -> QualifiedBeneficiary.id" }
      - { name: monthly_premium_cents, type: integer, source: computed, description: "round_half_up(plan.applicable_premium_cents * (1 + standard_admin_fee_pct)); the per-month gross premium for non-disability months" }
      - { name: amount_invoiced_cents, type: integer, source: computed, default: 0, description: "Sum of invoice.amount_due_cents across all non-VOID invoices on this account" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of payment.amount_cents across all POSTED payments on this account" }
      - { name: amount_subsidized_cents, type: integer, source: computed, default: 0, description: "Sum of invoice.subsidy_applied_cents across all non-VOID invoices" }
      - { name: amount_refunded_cents, type: integer, source: computed, default: 0, description: "Sum of credit refunded back out to the beneficiary" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "amount_paid_cents + amount_subsidized_cents - amount_invoiced_cents - amount_refunded_cents (must be >= 0)" }
      - { name: paid_through_date, type: datetime, source: computed, default: null, description: "Last day of the latest consecutive month fully satisfied (premium covered by payment+subsidy); null before any month is satisfied" }
      - { name: initial_premium_due_date, type: datetime, source: computed, description: "enrollment.elected_at + plan.initial_premium_grace_days" }

  - name: PremiumInvoice
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> PremiumAccount.id" }
      - { name: coverage_month, type: string, source: input, description: "Billing month in YYYY-MM, the coverage month this invoice charges for" }
      - { name: coverage_month_index, type: integer, source: computed, description: "1-based index of coverage_month relative to enrollment.coverage_start_date month (month 1 = start month)" }
      - { name: gross_premium_cents, type: integer, source: computed, description: "round_half_up(applicable_premium_cents * (1 + fee_pct)) where fee_pct is disability_admin_fee_pct for months 19-29 of a disability-extended enrollment, else standard_admin_fee_pct" }
      - { name: proration_mode, type: enum, source: input, default: FULL_MONTH, description: "FULL_MONTH | DAILY_PRORATED (only the first coverage month may be DAILY_PRORATED)", constraints: "FULL_MONTH | DAILY_PRORATED" }
      - { name: amount_due_cents, type: integer, source: computed, description: "gross_premium_cents for FULL_MONTH; round_half_up(gross_premium_cents * days_covered / days_in_month) for DAILY_PRORATED" }
      - { name: subsidy_applied_cents, type: integer, source: computed, default: 0, description: "round_half_up(amount_due_cents * subsidy.subsidy_pct) when an ACTIVE SubsidyGrant covers this coverage_month, else 0" }
      - { name: beneficiary_owed_cents, type: integer, source: computed, description: "amount_due_cents - subsidy_applied_cents" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | PAID | VOID", constraints: "OPEN | PAID | VOID" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> PremiumAccount.id" }
      - { name: amount_cents, type: integer, source: input, description: "Amount tendered by the beneficiary", constraints: "> 0" }
      - { name: received_date, type: datetime, source: system, description: "Clock time the payment was posted" }
      - { name: target_coverage_month, type: string, source: input, description: "YYYY-MM coverage month this payment is applied to (the earliest OPEN invoice month)" }
      - { name: deemed_full_payment, type: boolean, source: computed, default: false, description: "True when the shortfall on the targeted month is within the insignificant-shortfall allowance, so the month counts as fully paid" }
      - { name: status, type: enum, source: system, default: POSTED, description: "POSTED | REFUNDED", constraints: "POSTED | REFUNDED" }

  - name: SubsidyGrant
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> CobraEnrollment.id" }
      - { name: subsidy_pct, type: number, source: input, description: "Fraction of each covered month's premium paid by the subsidy (0.65 partial, 1.00 full)", constraints: "0 < x <= 1.0" }
      - { name: start_month, type: string, source: input, description: "First covered coverage month, YYYY-MM" }
      - { name: end_month, type: string, source: input, description: "Last covered coverage month, YYYY-MM (inclusive)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REVOKED", constraints: "ACTIVE | REVOKED" }

  - name: HipaaCertificate
    parent: null
    common_fields: false
    fields:
      - { name: beneficiary_id, type: string, source: system, description: "FK -> QualifiedBeneficiary.id" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> CobraEnrollment.id" }
      - { name: coverage_from, type: datetime, source: system, description: "First day of creditable coverage being certified (enrollment.coverage_start_date)" }
      - { name: coverage_through, type: datetime, source: system, description: "Last day of creditable coverage being certified (enrollment.actual_end_date)" }
      - { name: creditable_months, type: integer, source: system, description: "Count of whole COBRA coverage months credited: (through.year-from.year)*12 + (through.month-from.month) + 1" }
      - { name: issued_reason, type: enum, source: system, description: "RUN_TO_TERM | NONPAYMENT | OTHER_GROUP_COVERAGE | MEDICARE_ENTITLEMENT | PLAN_TERMINATED (copied from the enrollment.termination_reason that produced the certificate)", constraints: "RUN_TO_TERM | NONPAYMENT | OTHER_GROUP_COVERAGE | MEDICARE_ENTITLEMENT | PLAN_TERMINATED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: QualifyingEvent
    initial_state: RECORDED
    terminal_states: [ELECTED, LAPSED, VOID]
    transitions:
      - from: RECORDED
        to: NOTICE_SENT
        trigger: "POST /events/{id}/send-notice"
        actor: PlanAdministrator
        preconditions:
          - "event.status == RECORDED (ERR_INVALID_STATE)"
          - "beneficiary.status == ACTIVE_EMPLOYEE_COVERAGE (cross-entity; ERR_BENEFICIARY_NOT_ELIGIBLE)"
        side_effects:
          - "Create ElectionNotice with notice_sent_date = clock now, status=OUTSTANDING"
          - "election_window_anchor = max(event.coverage_loss_date, notice_sent_date)"
          - "election_deadline = election_window_anchor + plan.election_window_days"
          - "beneficiary.status -> COBRA_ELIGIBLE (cross-entity bubble)"
          - "increments QualifyingEvent.version by 1"
        note: "CASCADE depth-2 origin: event RECORDED->NOTICE_SENT mutates ElectionNotice (create) and mutates QualifiedBeneficiary.status."

      - from: NOTICE_SENT
        to: ELECTED
        trigger: "POST /notices/{id}/elect"
        actor: QualifiedBeneficiary
        preconditions:
          - "notice.status == OUTSTANDING (ERR_INVALID_STATE)"
          - "clock now <= notice.election_deadline (ERR_ELECTION_WINDOW_CLOSED)"
        side_effects:
          - "notice.status -> ELECTED"
          - "Create CobraEnrollment: coverage_start_date=event.coverage_loss_date, base_max_months=event.max_coverage_months, status=PENDING_INITIAL_PREMIUM"
          - "Create PremiumAccount for the enrollment with monthly_premium_cents computed, initial_premium_due_date = elected_at + plan.initial_premium_grace_days"
          - "beneficiary.status -> COBRA_ENROLLED"
          - "increments QualifyingEvent.version by 1"
        note: "CASCADE depth-3 origin: event NOTICE_SENT->ELECTED mutates ElectionNotice; that election creates CobraEnrollment; the enrollment creation itself creates PremiumAccount."

      - from: NOTICE_SENT
        to: LAPSED
        trigger: "POST /plans/{id}/tick (system sweep when clock now > notice.election_deadline and notice still OUTSTANDING)"
        actor: system
        preconditions:
          - "notice.status == OUTSTANDING"
          - "clock now > notice.election_deadline"
        side_effects:
          - "notice.status -> EXPIRED"
          - "beneficiary.status -> COVERAGE_ENDED"
        note: "Auto-transition fired by the clock tick sweep."

      - from: RECORDED
        to: VOID
        trigger: "POST /events/{id}/void"
        actor: PlanAdministrator
        preconditions:
          - "event.status == RECORDED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: ElectionNotice
    initial_state: OUTSTANDING
    terminal_states: [ELECTED, EXPIRED]
    transitions:
      - from: OUTSTANDING
        to: ELECTED
        trigger: "POST /notices/{id}/elect"
        actor: QualifiedBeneficiary
        preconditions:
          - "notice.status == OUTSTANDING (ERR_INVALID_STATE)"
          - "clock now <= notice.election_deadline (ERR_ELECTION_WINDOW_CLOSED)"
        side_effects:
          - "Mirrors QualifyingEvent NOTICE_SENT->ELECTED (creates enrollment + account)"
      - from: OUTSTANDING
        to: EXPIRED
        trigger: "POST /plans/{id}/tick (system sweep)"
        actor: system
        preconditions:
          - "clock now > notice.election_deadline"
        side_effects:
          - "event.status -> LAPSED; beneficiary.status -> COVERAGE_ENDED"

  - entity: CobraEnrollment
    initial_state: PENDING_INITIAL_PREMIUM
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_INITIAL_PREMIUM
        to: ACTIVE
        trigger: "system (on the payment that first satisfies coverage month 1 within the initial-premium grace)"
        actor: system
        preconditions:
          - "A Payment posts that makes coverage month 1 fully satisfied (payment+subsidy >= month-1 beneficiary_owed, or shortfall within allowance)"
          - "received_date <= account.initial_premium_due_date"
        side_effects:
          - "enrollment.status -> ACTIVE"
          - "Recompute account.paid_through_date (cross-entity ledger sync; bubbles to last day of month 1)"
        note: "CASCADE link from Payment POSTED: the payment recompute bubbles the account paid_through_date and flips the enrollment ACTIVE."

      - from: PENDING_INITIAL_PREMIUM
        to: TERMINATED
        trigger: "POST /plans/{id}/tick (system sweep when clock now > account.initial_premium_due_date and month 1 not satisfied)"
        actor: system
        preconditions:
          - "clock now > account.initial_premium_due_date"
          - "coverage month 1 not fully satisfied"
        side_effects:
          - "enrollment.status -> TERMINATED, termination_reason=NONPAYMENT, actual_end_date=coverage_start_date - 1 day (no coverage ever vested)"
          - "VOID all OPEN invoices on the account"
          - "beneficiary.status -> COVERAGE_ENDED"
        note: "No HIPAA certificate when no month was ever paid (creditable_months would be 0)."

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /plans/{id}/tick (system sweep when clock now > recurring grace end of the earliest unsatisfied month)"
        actor: system
        preconditions:
          - "An OPEN invoice month is past its recurring grace (first-of-month + plan.recurring_premium_grace_days) and not fully satisfied"
        side_effects:
          - "enrollment.status -> TERMINATED, termination_reason=NONPAYMENT"
          - "actual_end_date = account.paid_through_date (coverage retroactively ends at the last fully paid month)"
          - "VOID all OPEN invoices with coverage_month after paid_through_date"
          - "beneficiary.status -> COVERAGE_ENDED"
          - "Create HipaaCertificate (creditable_months counts months coverage_start_date..actual_end_date)"
        note: "CASCADE depth-3 origin: tick TERMINATES enrollment; termination VOIDs trailing invoices (mutating each PremiumInvoice); the same termination creates a HipaaCertificate."

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /enrollments/{id}/terminate-early"
        actor: PlanAdministrator
        preconditions:
          - "enrollment.status == ACTIVE (ERR_INVALID_STATE)"
          - "reason in {OTHER_GROUP_COVERAGE, MEDICARE_ENTITLEMENT, PLAN_TERMINATED} (ERR_INVALID_TERMINATION_REASON)"
        side_effects:
          - "enrollment.status -> TERMINATED, termination_reason=reason, actual_end_date = clock now (end of current paid period)"
          - "VOID all OPEN invoices with coverage_month after the actual_end_date month"
          - "beneficiary.status -> COVERAGE_ENDED"
          - "Create HipaaCertificate for coverage_start_date..actual_end_date"
          - "If reason==PLAN_TERMINATED: plan.status -> TERMINATED (cross-entity)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /plans/{id}/tick (system sweep when clock now > enrollment.scheduled_end_date)"
        actor: system
        preconditions:
          - "clock now > enrollment.scheduled_end_date"
          - "enrollment.status == ACTIVE"
        side_effects:
          - "enrollment.status -> TERMINATED, termination_reason=RUN_TO_TERM, actual_end_date = scheduled_end_date"
          - "beneficiary.status -> COVERAGE_ENDED"
          - "Create HipaaCertificate for coverage_start_date..scheduled_end_date"

  - entity: PremiumAccount
    initial_state: BILLING
    terminal_states: []
    transitions:
      - from: BILLING
        to: BILLING
        trigger: "POST /accounts/{id}/payments"
        actor: BillingAgent
        preconditions:
          - "enrollment.status in {PENDING_INITIAL_PREMIUM, ACTIVE} (cross-entity; ERR_INVALID_STATE)"
          - "target_coverage_month has an OPEN invoice on this account (ERR_NO_OPEN_INVOICE)"
        side_effects:
          - "Create Payment status=POSTED, received_date=clock now"
          - "deemed_full_payment = (month shortfall <= max(plan.insignificant_shortfall_floor_cents, round_half_up(0.10 * invoice.beneficiary_owed_cents)))"
          - "If targeted invoice now fully satisfied (or deemed full): invoice.status -> PAID"
          - "Recompute amount_paid_cents, credit_balance_cents, paid_through_date"
          - "If enrollment PENDING_INITIAL_PREMIUM and month 1 satisfied within grace: bubble enrollment -> ACTIVE"
        note: "Parallel billing dimension: account ledger advances on each payment independently of the enrollment lifecycle until a terminal sweep."

      - from: BILLING
        to: BILLING
        trigger: "POST /accounts/{id}/refund"
        actor: BillingAgent
        preconditions:
          - "account.credit_balance_cents > 0 (ERR_NO_CREDIT_BALANCE)"
          - "refund_amount_cents <= account.credit_balance_cents (ERR_REFUND_EXCEEDS_CREDIT)"
        side_effects:
          - "amount_refunded_cents += refund_amount_cents"
          - "Recompute credit_balance_cents (compensating: paid+subsidy-invoiced-refunded conserved)"

# -----------------------------------------------------------------------------
# Concurrency Rules (§1.2.1) — OCC on PremiumAccount.version
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: account-refund-stale-version
    parent_entity: PremiumAccount
    write_endpoint: "POST /accounts/{id}/refund"
    occ_field: "expected_account_version"
    description: |
      Refunding credit from a PremiumAccount whose version has advanced since
      the client last read it is rejected. A prior payment or a prior refund
      already moved the credit balance, so the refund amount the current client
      computed against its stale view no longer reflects the available credit.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: gross_monthly_premium
    trigger: "PremiumAccount creation (on election) and PremiumInvoice creation"
    algorithm: tiered_pricing
    formula: |
      fee_pct = standard_admin_fee_pct
      if enrollment.disability_extension AND coverage_month_index in [19..29]:
        fee_pct = disability_admin_fee_pct           # 150% premium tier
      gross = round_half_up(plan.applicable_premium_cents * (1 + fee_pct))
    input_set: "The plan's applicable_premium_cents and the enrollment's coverage_month_index; disability tier applies only to months 19-29 of a disability-extended enrollment."
    constants:
      STANDARD_FEE_PCT: 0.02
      DISABILITY_FEE_PCT: 0.50
    precision: "whole cents, round_half_up"
    variants:
      - name: standard_months
        when: "coverage_month_index in [1..18] (or [1..36] for 36-month events), no disability extension"
        difference: "Applies standard_admin_fee_pct (102% of applicable premium)."
      - name: disability_extension_months
        when: "coverage_month_index in [19..29] of a disability-extended enrollment"
        difference: "Applies disability_admin_fee_pct (150% of applicable premium)."

  - name: first_month_amount_due
    trigger: "PremiumInvoice creation for coverage_month_index == 1"
    algorithm: forward_looking
    formula: |
      gross = gross_monthly_premium(month 1)
      if proration_mode == FULL_MONTH:
        amount_due = gross
      else:  # DAILY_PRORATED
        days_in_month = calendar days in coverage_start month
        days_covered = days_in_month - coverage_start_date.day + 1
        amount_due = round_half_up(gross * days_covered / days_in_month)
    input_set: "First coverage month only; later months are always FULL_MONTH."
    precision: "whole cents, round_half_up"
    variants:
      - name: full_month_billing
        when: "proration_mode == FULL_MONTH"
        difference: "Charges the full gross premium even though COBRA coverage may have begun mid-month; the standard administrator convention."
      - name: daily_proration
        when: "proration_mode == DAILY_PRORATED"
        difference: "Charges gross * days_covered / days_in_month, billing only the days from coverage_start_date through month end."

  - name: subsidy_applied
    trigger: "PremiumInvoice creation, and SubsidyGrant create/revoke (recompute affected invoices)"
    algorithm: chronological
    formula: |
      Order ACTIVE SubsidyGrants on this enrollment by start_month ASC, then created_at ASC.
      For the invoice's coverage_month, select the FIRST grant in that order whose
      [start_month, end_month] inclusive range contains coverage_month.
      if a grant matches:
        subsidy_applied = round_half_up(invoice.amount_due_cents * grant.subsidy_pct)
      else:
        subsidy_applied = 0
      beneficiary_owed = amount_due_cents - subsidy_applied
    input_set: "Only ACTIVE grants on the same enrollment whose inclusive month range covers the invoice month; REVOKED grants are excluded."
    constants:
      DEFAULT_PARTIAL_PCT: 0.65
      FULL_PCT: 1.00
    precision: "whole cents, round_half_up"
    variants:
      - name: chronological_first_match
        when: "two ACTIVE grants overlap the same coverage_month"
        difference: "The earliest grant by start_month then created_at wins; later overlapping grants are ignored for that month (no stacking)."
      - name: forward_recompute_on_revoke
        when: "a grant is revoked"
        difference: "Future-month invoices (coverage_month > clock-now month) recompute subsidy to the next matching ACTIVE grant or 0; already-PAID invoices keep their applied subsidy (chronological lock)."

  - name: deemed_full_payment
    trigger: "Payment POSTED against an OPEN invoice"
    algorithm: threshold
    formula: |
      allowance = max(plan.insignificant_shortfall_floor_cents,
                      round_half_up(0.10 * invoice.beneficiary_owed_cents))
      already_paid = sum(payment.amount_cents for POSTED payments on this invoice's month)
      shortfall = invoice.beneficiary_owed_cents - already_paid
      deemed_full_payment = (shortfall <= allowance)   # boundary: shortfall == allowance is deemed full
    input_set: "All POSTED payments targeting the same coverage_month on this account."
    constants:
      SHORTFALL_FLOOR_CENTS: 5000
      SHORTFALL_PCT: 0.10
    precision: "whole cents, round_half_up"

  - name: paid_through_date
    trigger: "Payment POSTED, invoice VOID, SubsidyGrant change"
    algorithm: aggregation
    formula: |
      Walk coverage months in ascending coverage_month_index starting at month 1.
      A month is SATISFIED when (sum POSTED payments for that month + invoice.subsidy_applied_cents)
      >= invoice.beneficiary_owed_cents OR the latest payment for it is deemed_full_payment.
      Advance through the longest UNBROKEN run of SATISFIED months from month 1.
      paid_through_date = last calendar day of the last month in that unbroken run
        (null if month 1 not satisfied).
    input_set: "Consecutive OPEN/PAID invoices from month 1; a gap stops the run even if a later month is satisfied."
    precision: "date (last day of month)"

  - name: creditable_months
    trigger: "HipaaCertificate creation (any enrollment TERMINATED transition that issues a certificate)"
    algorithm: aggregation
    formula: |
      from = enrollment.coverage_start_date
      through = enrollment.actual_end_date
      if through < from:  # nonpayment before any coverage vested
        creditable_months = 0   # no certificate issued
      else:
        creditable_months = (through.year - from.year)*12 + (through.month - from.month) + 1
    input_set: "The single enrollment's vested coverage interval [coverage_start_date, actual_end_date]."
    precision: "whole months, inclusive of both endpoint months"

  - name: max_coverage_months
    trigger: "QualifyingEvent creation"
    algorithm: threshold
    formula: |
      if event_type in {TERMINATION, REDUCTION_OF_HOURS}: 18
      else (DIVORCE, DEATH_OF_EMPLOYEE, MEDICARE_ENTITLEMENT, DEPENDENT_AGE_OUT): 36
    input_set: "The event_type alone."
    precision: "integer months"

  - name: disability_extension_window
    trigger: "POST /enrollments/{id}/apply-disability-extension"
    algorithm: interval_merge
    formula: |
      Valid only if:
        determination_date is within the first 60 days of coverage
          (coverage_start_date <= determination_date <= coverage_start_date + 60 days), AND
        clock now <= scheduled_end_date (the original 18-month end), AND
        base_max_months == 18 (only 18-month events extend to 29).
      On success: extension_months = 11; disability_extension = true;
        scheduled_end_date recomputed = coverage_start_date + 29 months - 1 day.
    input_set: "Enrollment dates and the SSA determination_date."
    constants:
      DETERMINATION_WINDOW_DAYS: 60
      EXTENSION_MONTHS: 11
    precision: "date (last day of coverage)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path and FK resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_referential
    check: "QualifiedBeneficiary acting via /notices/{id}/elect or /accounts/{id}/payments must own the targeted record (X-User-ID == beneficiary_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /notices/{id}/elect, POST /accounts/{id}/payments (as QualifiedBeneficiary)"

  - priority: 5
    category: business_constraint
    check: "Request body shape: enum members valid, amounts > 0, coverage_month is YYYY-MM, required fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource in a state that allows the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_referential
    check: "Beneficiary must be eligible (ACTIVE_EMPLOYEE_COVERAGE) to send an election notice; an already-enrolled/ended beneficiary cannot receive a new notice on the same active coverage"
    error_id: ERR_BENEFICIARY_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /events/{id}/send-notice"

  - priority: 8
    category: business_temporal
    check: "Election attempted after notice.election_deadline (clock now > deadline) is rejected"
    error_id: ERR_ELECTION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /notices/{id}/elect"

  - priority: 9
    category: business_temporal
    check: "Disability extension determination_date outside the first 60 days of coverage, or applied after the 18-month scheduled end, is rejected"
    error_id: ERR_DISABILITY_WINDOW_INVALID
    http_status: 409
    applies_to: "POST /enrollments/{id}/apply-disability-extension"

  - priority: 10
    category: business_constraint
    check: "Disability extension only valid on an 18-month (base_max_months==18) enrollment; 36-month enrollments cannot extend"
    error_id: ERR_EXTENSION_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /enrollments/{id}/apply-disability-extension"

  - priority: 11
    category: business_constraint
    check: "Early-termination reason must be one of OTHER_GROUP_COVERAGE, MEDICARE_ENTITLEMENT, PLAN_TERMINATED"
    error_id: ERR_INVALID_TERMINATION_REASON
    http_status: 409
    applies_to: "POST /enrollments/{id}/terminate-early"

  - priority: 12
    category: business_constraint
    check: "An invoice's coverage_month must be within the enrollment's coverage interval [coverage_start month, scheduled_end month]; only the first coverage month may be DAILY_PRORATED"
    error_id: ERR_INVALID_COVERAGE_MONTH
    http_status: 409
    applies_to: "POST /accounts/{id}/invoices"

  - priority: 13
    category: business_constraint
    check: "Duplicate invoice for an already-invoiced coverage_month on the same account is rejected"
    error_id: ERR_DUPLICATE_INVOICE
    http_status: 409
    applies_to: "POST /accounts/{id}/invoices"

  - priority: 14
    category: business_constraint
    check: "Payment must target a coverage_month that has an OPEN invoice on the account"
    error_id: ERR_NO_OPEN_INVOICE
    http_status: 409
    applies_to: "POST /accounts/{id}/payments"

  - priority: 15
    category: business_temporal
    check: "SubsidyGrant [start_month, end_month] must satisfy start_month <= end_month and fall within the enrollment coverage interval"
    error_id: ERR_INVALID_SUBSIDY_RANGE
    http_status: 409
    applies_to: "POST /enrollments/{id}/subsidies"

  - priority: 16
    category: business_fiscal
    check: "Refund amount must not exceed account.credit_balance_cents"
    error_id: ERR_REFUND_EXCEEDS_CREDIT
    http_status: 409
    applies_to: "POST /accounts/{id}/refund"

  - priority: 17
    category: business_fiscal
    check: "Refund requires a positive credit balance"
    error_id: ERR_NO_CREDIT_BALANCE
    http_status: 409
    applies_to: "POST /accounts/{id}/refund"

  - priority: 18
    category: concurrency
    check: "OCC: expected_account_version must equal current PremiumAccount.version on refund"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /accounts/{id}/refund"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- GroupHealthPlan ---
  - method: POST
    path: "/plans"
    description: "Create a group health plan (config root)"
    roles: [PlanAdministrator]
    code: 201
    input: [name, applicable_premium_cents, "standard_admin_fee_pct?", "disability_admin_fee_pct?", "employer_notice_days?", "election_notice_days?", "election_window_days?", "initial_premium_grace_days?", "recurring_premium_grace_days?", "insignificant_shortfall_floor_cents?"]
    output: GroupHealthPlan
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/plans/{id}"
    description: "Get a plan"
    roles: [PlanAdministrator, PlanSponsor, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: []
    output: GroupHealthPlan
    side_effects: []

  - method: GET
    path: "/plans/{id}/beneficiaries"
    description: "List beneficiaries under a plan (FK reverse-reachability for QualifiedBeneficiary.plan_id and QualifyingEvent.plan_id)"
    roles: [PlanAdministrator, PlanSponsor, BillingAgent]
    code: 200
    input: []
    output: "QualifiedBeneficiary[]"
    side_effects: []

  - method: POST
    path: "/plans/{id}/tick"
    description: "Advance system clock-driven sweeps for this plan: expire outstanding notices past deadline, terminate enrollments past initial/recurring grace or past scheduled_end, issue HIPAA certificates"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: GroupHealthPlan
    side_effects:
      - "Election notices past deadline: ElectionNotice->EXPIRED, event->LAPSED, beneficiary->COVERAGE_ENDED"
      - "Enrollments PENDING_INITIAL_PREMIUM past initial_premium_due_date with month 1 unsatisfied: TERMINATED (NONPAYMENT), VOID OPEN invoices"
      - "Enrollments ACTIVE past recurring grace of earliest unsatisfied month: TERMINATED (NONPAYMENT), actual_end_date=paid_through_date, VOID trailing invoices, issue HIPAA cert"
      - "Enrollments ACTIVE past scheduled_end_date: TERMINATED (RUN_TO_TERM), issue HIPAA cert"

  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set"
    description: "Set the simulated current UTC time (test-driving; deterministic time control for windows/grace)"
    roles: [PlanAdministrator]
    code: 200
    input: [now_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["Sets the global simulated clock used by reported_at/elected_at/received_date/notice_sent_date and all tick sweeps"]

  # --- QualifiedBeneficiary ---
  - method: POST
    path: "/beneficiaries"
    description: "Register a qualified beneficiary on a plan"
    roles: [PlanAdministrator, PlanSponsor]
    code: 201
    input: [plan_id, full_name, relationship, original_coverage_start]
    output: QualifiedBeneficiary
    side_effects: ["status=ACTIVE_EMPLOYEE_COVERAGE"]

  - method: GET
    path: "/beneficiaries/{id}"
    description: "Get a beneficiary"
    roles: [PlanAdministrator, PlanSponsor, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: []
    output: QualifiedBeneficiary
    side_effects: []

  - method: GET
    path: "/beneficiaries/{id}/certificates"
    description: "List HIPAA certificates for a beneficiary (FK reverse-reachability for HipaaCertificate.beneficiary_id)"
    roles: [PlanAdministrator, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: []
    output: "HipaaCertificate[]"
    side_effects: []

  # --- QualifyingEvent ---
  - method: POST
    path: "/events"
    description: "Sponsor records a qualifying event for a beneficiary"
    roles: [PlanSponsor, PlanAdministrator]
    code: 201
    input: [plan_id, beneficiary_id, event_type, event_date, coverage_loss_date]
    output: QualifyingEvent
    side_effects:
      - "status=RECORDED, reported_at=clock now"
      - "max_coverage_months computed from event_type (18 or 36)"
      - "employer_notice_deadline and late_reported computed for employer-side events"

  - method: GET
    path: "/events/{id}"
    description: "Get a qualifying event"
    roles: [PlanAdministrator, PlanSponsor, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: []
    output: QualifyingEvent
    side_effects: []

  - method: GET
    path: "/events"
    description: "List qualifying events (filterable by plan_id or beneficiary_id; FK reverse-reachability for QualifyingEvent.plan_id and .beneficiary_id)"
    roles: [PlanAdministrator, PlanSponsor, BillingAgent]
    code: 200
    input: ["plan_id?", "beneficiary_id?"]
    output: "QualifyingEvent[]"
    side_effects: []

  - method: POST
    path: "/events/{id}/send-notice"
    description: "Administrator issues the election notice for an event"
    roles: [PlanAdministrator]
    code: 201
    input: []
    output: ElectionNotice
    side_effects:
      - "event.status -> NOTICE_SENT"
      - "Create ElectionNotice (anchor=max(coverage_loss_date, notice_sent_date), deadline=anchor+election_window_days)"
      - "beneficiary.status -> COBRA_ELIGIBLE"
      - "increments QualifyingEvent.version by 1"

  - method: POST
    path: "/events/{id}/void"
    description: "Administrator voids a recorded event before any notice is sent"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: QualifyingEvent
    side_effects: ["status -> VOID"]

  # --- ElectionNotice ---
  - method: GET
    path: "/notices/{id}"
    description: "Get an election notice"
    roles: [PlanAdministrator, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: []
    output: ElectionNotice
    side_effects: []

  - method: GET
    path: "/notices"
    description: "List election notices (filterable by event_id or beneficiary_id; FK reverse-reachability for ElectionNotice.event_id and .beneficiary_id)"
    roles: [PlanAdministrator, BillingAgent]
    code: 200
    input: ["event_id?", "beneficiary_id?"]
    output: "ElectionNotice[]"
    side_effects: []

  - method: POST
    path: "/notices/{id}/elect"
    description: "Beneficiary elects COBRA within the 60-day window"
    roles: [QualifiedBeneficiary]
    code: 201
    input: []
    output: CobraEnrollment
    side_effects:
      - "notice.status -> ELECTED; event.status -> ELECTED"
      - "Create CobraEnrollment (PENDING_INITIAL_PREMIUM) + PremiumAccount"
      - "beneficiary.status -> COBRA_ENROLLED"
      - "increments QualifyingEvent.version by 1"

  # --- CobraEnrollment ---
  - method: GET
    path: "/enrollments/{id}"
    description: "Get a COBRA enrollment"
    roles: [PlanAdministrator, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: []
    output: CobraEnrollment
    side_effects: []

  - method: GET
    path: "/enrollments"
    description: "List enrollments (filterable by beneficiary_id, notice_id, or event_id; FK reverse-reachability for CobraEnrollment.notice_id, .beneficiary_id, .event_id)"
    roles: [PlanAdministrator, BillingAgent]
    code: 200
    input: ["beneficiary_id?", "notice_id?", "event_id?"]
    output: "CobraEnrollment[]"
    side_effects: []

  - method: GET
    path: "/enrollments/{id}/certificates"
    description: "List HIPAA certificates issued for an enrollment (FK reverse-reachability for HipaaCertificate.enrollment_id)"
    roles: [PlanAdministrator, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: []
    output: "HipaaCertificate[]"
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/apply-disability-extension"
    description: "Administrator applies an SSA disability extension (18 -> 29 months)"
    roles: [PlanAdministrator]
    code: 200
    input: [determination_date]
    output: CobraEnrollment
    side_effects:
      - "extension_months=11, disability_extension=true, scheduled_end_date recomputed to coverage_start_date + 29 months - 1 day"

  - method: POST
    path: "/enrollments/{id}/terminate-early"
    description: "Administrator terminates coverage early for a permitted reason"
    roles: [PlanAdministrator]
    code: 200
    input: [reason]
    output: CobraEnrollment
    side_effects:
      - "status -> TERMINATED, termination_reason=reason, actual_end_date=clock now"
      - "VOID OPEN invoices with coverage_month after actual_end_date month"
      - "beneficiary.status -> COVERAGE_ENDED; create HipaaCertificate"
      - "If reason==PLAN_TERMINATED: plan.status -> TERMINATED"

  - method: POST
    path: "/enrollments/{id}/subsidies"
    description: "Administrator grants a premium subsidy over a month range"
    roles: [PlanAdministrator]
    code: 201
    input: [subsidy_pct, start_month, end_month]
    output: SubsidyGrant
    side_effects:
      - "Create SubsidyGrant status=ACTIVE"
      - "Recompute subsidy_applied/beneficiary_owed on OPEN invoices in range"

  - method: POST
    path: "/subsidies/{id}/revoke"
    description: "Administrator revokes a subsidy grant"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: SubsidyGrant
    side_effects:
      - "status -> REVOKED"
      - "Recompute subsidy on future OPEN invoices (coverage_month > clock-now month); PAID invoices keep applied subsidy"

  - method: GET
    path: "/subsidies/{id}"
    description: "Get a subsidy grant"
    roles: [PlanAdministrator, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: []
    output: SubsidyGrant
    side_effects: []

  - method: GET
    path: "/subsidies"
    description: "List subsidy grants (filterable by enrollment_id; FK reverse-reachability for SubsidyGrant.enrollment_id)"
    roles: [PlanAdministrator, BillingAgent]
    code: 200
    input: ["enrollment_id?"]
    output: "SubsidyGrant[]"
    side_effects: []

  # --- PremiumAccount ---
  - method: GET
    path: "/accounts/{id}"
    description: "Get a premium account (ledger summary, computed fields)"
    roles: [PlanAdministrator, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: []
    output: PremiumAccount
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List premium accounts (filterable by enrollment_id or beneficiary_id; FK reverse-reachability for PremiumAccount.enrollment_id and .beneficiary_id)"
    roles: [PlanAdministrator, BillingAgent]
    code: 200
    input: ["enrollment_id?", "beneficiary_id?"]
    output: "PremiumAccount[]"
    side_effects: []

  - method: POST
    path: "/accounts/{id}/invoices"
    description: "Generate a monthly premium invoice for a coverage month"
    roles: [BillingAgent, PlanAdministrator]
    code: 201
    input: [coverage_month, "proration_mode?"]
    output: PremiumInvoice
    side_effects:
      - "Compute coverage_month_index, gross_premium_cents, amount_due_cents, subsidy_applied_cents, beneficiary_owed_cents"
      - "status=OPEN; recompute account.amount_invoiced_cents, amount_subsidized_cents"

  - method: GET
    path: "/invoices/{id}"
    description: "Get a premium invoice"
    roles: [PlanAdministrator, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: []
    output: PremiumInvoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List premium invoices (filterable by account_id; FK reverse-reachability for PremiumInvoice.account_id)"
    roles: [PlanAdministrator, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: ["account_id?"]
    output: "PremiumInvoice[]"
    side_effects: []

  - method: POST
    path: "/accounts/{id}/payments"
    description: "Post a premium payment toward a coverage month"
    roles: [BillingAgent, QualifiedBeneficiary]
    code: 201
    input: [amount_cents, target_coverage_month]
    output: Payment
    side_effects:
      - "Create Payment POSTED; compute deemed_full_payment"
      - "If month satisfied: invoice.status -> PAID"
      - "Recompute account.amount_paid_cents, credit_balance_cents, paid_through_date"
      - "If enrollment PENDING_INITIAL_PREMIUM and month 1 satisfied within grace: enrollment -> ACTIVE"

  - method: GET
    path: "/payments/{id}"
    description: "Get a payment"
    roles: [PlanAdministrator, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/payments"
    description: "List payments (filterable by account_id; FK reverse-reachability for Payment.account_id)"
    roles: [PlanAdministrator, BillingAgent, QualifiedBeneficiary]
    code: 200
    input: ["account_id?"]
    output: "Payment[]"
    side_effects: []

  - method: POST
    path: "/accounts/{id}/refund"
    description: "Refund credit balance back to the beneficiary (OCC-guarded)"
    roles: [BillingAgent]
    code: 200
    input: [refund_amount_cents, expected_account_version]
    output: PremiumAccount
    side_effects:
      - "amount_refunded_cents += refund_amount_cents; recompute credit_balance_cents"
      - "increments PremiumAccount.version by 1"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role not permitted for this endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "QualifiedBeneficiary acting on a record (elect/pay) whose beneficiary_id != X-User-ID"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or FK-referenced resource does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: bad enum, non-positive amount, malformed coverage_month, missing required field"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that allows this transition"
  - id: ERR_BENEFICIARY_NOT_ELIGIBLE
    http: 409
    condition: "Beneficiary not ACTIVE_EMPLOYEE_COVERAGE when sending an election notice"
  - id: ERR_ELECTION_WINDOW_CLOSED
    http: 409
    condition: "Election attempted after the 60-day election deadline"
  - id: ERR_DISABILITY_WINDOW_INVALID
    http: 409
    condition: "Disability determination outside first 60 days of coverage, or applied after the 18-month scheduled end"
  - id: ERR_EXTENSION_NOT_APPLICABLE
    http: 409
    condition: "Disability extension requested on a non-18-month enrollment"
  - id: ERR_INVALID_TERMINATION_REASON
    http: 409
    condition: "Early-termination reason not in {OTHER_GROUP_COVERAGE, MEDICARE_ENTITLEMENT, PLAN_TERMINATED}"
  - id: ERR_INVALID_COVERAGE_MONTH
    http: 409
    condition: "Invoice coverage_month outside the enrollment coverage interval, or DAILY_PRORATED requested for a non-first month"
  - id: ERR_DUPLICATE_INVOICE
    http: 409
    condition: "An invoice already exists for this coverage_month on the account"
  - id: ERR_NO_OPEN_INVOICE
    http: 409
    condition: "Payment targets a coverage_month with no OPEN invoice on the account"
  - id: ERR_INVALID_SUBSIDY_RANGE
    http: 409
    condition: "Subsidy start_month > end_month, or range falls outside the enrollment coverage interval"
  - id: ERR_REFUND_EXCEEDS_CREDIT
    http: 409
    condition: "Refund amount exceeds the account credit balance"
  - id: ERR_NO_CREDIT_BALANCE
    http: 409
    condition: "Refund requested but credit_balance_cents is 0"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_account_version does not match the account's current version on refund"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdministrator
    description: "Third-party COBRA administrator: issues election notices, processes elections-adjacent admin (extension, early termination, subsidies, invoicing), runs clock sweeps. Cannot record qualifying events as the employer of record but may also record them, and cannot post beneficiary payments on a beneficiary's behalf as an owner."
    identity: opaque
    exclusive_operations:
      - "POST /plans — Create plan"
      - "POST /plans/{id}/tick — Run clock sweeps"
      - "POST /_clock/set — Set simulated clock"
      - "POST /events/{id}/send-notice — Issue election notice"
      - "POST /events/{id}/void — Void recorded event"
      - "POST /enrollments/{id}/apply-disability-extension — Apply disability extension"
      - "POST /enrollments/{id}/terminate-early — Terminate coverage early"
      - "POST /enrollments/{id}/subsidies — Grant subsidy"
      - "POST /subsidies/{id}/revoke — Revoke subsidy"
    shared_operations:
      - "POST /events — Record qualifying event (shared with PlanSponsor)"
      - "POST /beneficiaries — Register beneficiary (shared with PlanSponsor)"
      - "POST /accounts/{id}/invoices — Generate invoice (shared with BillingAgent)"

  - name: PlanSponsor
    description: "Employer of record: registers beneficiaries and reports qualifying events. Segregated from notice issuance, enrollment, billing, and payments."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /beneficiaries — Register beneficiary (shared with PlanAdministrator)"
      - "POST /events — Record qualifying event (shared with PlanAdministrator)"

  - name: BillingAgent
    description: "Premium billing operator: generates invoices, posts payments, issues refunds. Cannot adjudicate eligibility, send notices, or terminate coverage."
    identity: opaque
    exclusive_operations:
      - "POST /accounts/{id}/refund — Refund credit balance"
    shared_operations:
      - "POST /accounts/{id}/invoices — Generate invoice (shared with PlanAdministrator)"
      - "POST /accounts/{id}/payments — Post payment (shared with QualifiedBeneficiary)"

  - name: QualifiedBeneficiary
    description: "The covered individual: elects COBRA on its own notice and may self-pay on its own account. Identity-bound — may act only on records whose beneficiary_id equals X-User-ID."
    identity: "entity_backed:QualifiedBeneficiary"
    exclusive_operations:
      - "POST /notices/{id}/elect — Elect COBRA (own notice only)"
    shared_operations:
      - "POST /accounts/{id}/payments — Self-pay premium (own account only; shared with BillingAgent)"

  - name: System
    description: "Automation actor for clock-driven sweeps (notice expiry, nonpayment termination, run-to-term). Not directly callable; fired by POST /plans/{id}/tick."
    identity: opaque
    exclusive_operations: []
    shared_operations: []
