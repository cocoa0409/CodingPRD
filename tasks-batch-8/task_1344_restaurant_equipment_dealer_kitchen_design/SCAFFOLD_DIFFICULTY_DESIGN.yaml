          this is an aggregate-capacity ceiling, not a geometric buffer. An
          agency with open_assignment_count == capacity rejects new transfers;
          open_assignment_count == capacity - 1 accepts. Different resource and
          different semantic (aggregate-count saturation vs half-open window
          with buffer) satisfies Rule 8's differentiation.
