            - "Appraisal.${ap_f}.validity_end_date == 2029-06-30"

      - name: demolition_buffered_windows_touch_and_conflict_at_contractor_aggregate_capacity
        grounds:
          - calculations.demolition_buffered_window
          - validations.priority_41
          - entities.DemolitionContractor.fields.max_concurrent_work_orders
          - entities.DemolitionWorkOrder.fields.buffered_start
          - entities.DemolitionWorkOrder.fields.buffered_end
        distinguishing_aspect: |
          The buffered occupation interval is CLOSED, the deliberate opposite of
          appraisal_half_open_validity_windows_touching_at_the_boundary_are_permitted: contractor
          Epsilon's second window has buffered_start exactly equal to the first window's buffered_end
          and is therefore REFUSED, while shifting it by one second clears it. The shared resource is
          also aggregate rather than pairwise - contractor Delta accepts two mutually conflicting work
          orders and refuses a third only because max_concurrent_work_orders is 2, so no individual
          pair explains the rejection.
        test_recipe:
          setup:
            - "One MitigationProject in DRAFT with five parcels (work-order creation is not gated on project or parcel state)."
            - "DemolitionContractor Delta, max_concurrent_work_orders 2."
            - "DemolitionContractor Epsilon, max_concurrent_work_orders 1."
            - "Delta work order W1 on parcel 1: 2026-10-05T08:00:00Z .. 2026-10-06T17:00:00Z, buffered [2026-10-04T08:00:00Z, 2026-10-07T17:00:00Z]."
            - "Epsilon work order E1 on parcel 4: 2026-11-05T08:00:00Z .. 2026-11-06T17:00:00Z, buffered [2026-11-04T08:00:00Z, 2026-11-07T17:00:00Z]."
