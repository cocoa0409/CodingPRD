      - rescind by sa-other returns 403 ERR_NOT_OWNER and EntitlementOverride.${ovr_id} remains ACTIVE
      - rescind by sa-jane (created_by) succeeds; a fresh territory check returns verdict == BLACKED_OUT
  - name: missing_auth_headers_rejected_on_protected_endpoint
    claim_type: role_denial
