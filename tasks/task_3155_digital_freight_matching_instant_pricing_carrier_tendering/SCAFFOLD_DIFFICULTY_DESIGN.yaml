- rule_id: combinatorial_formula
  instances:
  - name: claim_price_cap_is_one_and_a_half_times_declared_value_while_claimed_is_twenty_million
    grounds:
    - calculations.claim_provisional_liability
    - entities.ClaimsCase.fields.price_cap_cents
    - entities.Load.fields.declared_cargo_value_cents
    - validations[priority=12]
    distinguishing_aspect: 'The claim price cap is 1.5 times the load''s declared_cargo_value_cents, not a multiple of the
      claimed amount: with a declared value of 5000000 cents the cap is 7500000, so a 20000000-cent claim on a 175000000-cent-coverage
      carrier writes a provisional_liability_cents of exactly 7500000 rather than 20000000.'
    test_recipe:
      setup:
      - Logical clock at 2026-09-20T00:00:00Z. One shipper with a 12,000,000-cent credit limit, lane TX>CA, one VERIFIED carrier
        carrying 175000000 cents of cargo coverage, a 5000000-cent declared cargo value on the load, and the load delivered
        so the claim is admissible.
      setup_api_calls:
      - call: POST /v1/shippers
        payload:
          name: Gulf Fabricators LLC
          billing_state_code: TX
          payment_terms_days: 30
          quick_pay_discount_pct: 0.03
          credit_limit_cents: 20000000
          load_credit_limit: 10
        as: PlatformAdmin
        captures:
