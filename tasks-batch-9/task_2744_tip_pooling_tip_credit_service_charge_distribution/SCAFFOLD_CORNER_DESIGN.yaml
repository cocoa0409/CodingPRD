            - "after the third trigger call Dee's PayLine has tip_credit_eligible_minutes == 0, non_tip_credit_minutes == 480, straight_cash_cents == 13200, service_charge_wages_cents == 0, regular_rate_cents_per_hour == 1650, minimum_wage_obligation_cents == 13200, retained_tips_cents == 5000, pool_tips_cents == 16429, tipped_employee_qualified == false, tip_credit_cents == 0, topup_cents == 0, total_gross_cents == 13200, reported_tips_cents == 21429"
            - "Eli's PayLine has straight_cash_cents == 13200, retained_tips_cents == 0, pool_tips_cents == 6571, tip_credit_cents == 0, total_gross_cents == 13200, reported_tips_cents == 6571"
            - "service_charge_wages_cents is 0 on both lines: a TIPS-treated charge never enters the regular rate, it goes to the pool"
            - "GET /pay-periods/${period_id} reports total_credited_minutes == 960, total_tip_credit_cents == 0, total_topup_cents == 0, gross_receipts_cents == 100000, reported_tips_cents == 28000, allocation_shortfall_cents == 0 because 28000 is not strictly less than the 8000 threshold"

      - name: no_written_notice_before_the_shift_forces_the_full_minimum_wage
        claim_type: waterfall_allocation
        grounds:
          - calculations.side_work_classification
          - calculations.pay_line_wage_computation
          - entities.EmployeeRoleAssignment.fields.tip_credit_notice_acknowledged_at
          - entities.PayLine.fields.tipped_employee_qualified
        distinguishing_aspect: >-
          Three employees work the identical 480-minute shift and declare the identical 5000 cents,
          and the only difference is the notice: null, acknowledged four hours AFTER the shift
          started, and acknowledged in July. The first two are gated at S0/S1 so their eligible
          minutes collapse to 0, their whole shift is priced at the 725 minimum wage (5800 straight
          cash) and the credit bucket of the waterfall is empty; the third pays 1704 in cash and
          fills 4096 from tips. A implementation that compares the acknowledgement to the shift
          DATE rather than to start_at would wrongly qualify the second employee.
        test_recipe:
          setup:
            - "Clock moved to 2026-08-10T12:00:00Z; one Texas unit with no ACTIVE pool policy."
            - "Ana has a SERVER assignment with tip_credit_notice_acknowledged_at omitted; Bea's was acknowledged 2026-08-04T20:00:00Z; Cam's was acknowledged 2026-07-01."
            - "All three worked CLOSED 480-minute shifts on 2026-08-04 starting 16:00Z and each declared 5000 cash tips."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { role_server_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_none_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Bea Olsen", external_payroll_ref: "E2", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_late_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Cam Vega", external_payroll_ref: "E3", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_ok_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_none_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_late_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-08-04T20:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_ok_id}", job_role_id: "${role_server_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_none_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_none_id: $.data.id }
            - call: "POST /shifts/${shift_none_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_none_id}/declare-tips"
              payload: { declared_cash_tips_cents: 5000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_none_id}"
            - call: "POST /shifts"
              payload: { employee_id: "${emp_late_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_late_id: $.data.id }
            - call: "POST /shifts/${shift_late_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_late_id}/declare-tips"
              payload: { declared_cash_tips_cents: 5000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_late_id}"
            - call: "POST /shifts"
              payload: { employee_id: "${emp_ok_id}", location_id: "${loc_id}", job_role_id: "${role_server_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: PayrollPreparer
              captures: { shift_ok_id: $.data.id }
            - call: "POST /shifts/${shift_ok_id}/close"
              payload: {}
              as: PayrollPreparer
            - call: "POST /shifts/${shift_ok_id}/declare-tips"
              payload: { declared_cash_tips_cents: 5000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_ok_id}"
          trigger:
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
          assert:
            - "GET /shifts/${shift_none_id} and GET /shifts/${shift_late_id} both report non_tip_credit_minutes == 480 and tip_credit_eligible_minutes == 0, set at close time by the notice gate and not by any side-work overage"
            - "GET /shifts/${shift_ok_id} reports non_tip_credit_minutes == 0 and tip_credit_eligible_minutes == 480"
            - "Ana's and Bea's PayLines each report tipped_employee_qualified == false, straight_cash_cents == 5800, regular_rate_cents_per_hour == 725, minimum_wage_obligation_cents == 5800, tips_available_cents == 5000, tip_credit_cents == 0, topup_cents == 0, total_gross_cents == 5800"
            - "Bea is disqualified even though her notice exists, because 2026-08-04T20:00:00Z is strictly after her 16:00:00Z start"
            - "Cam's PayLine reports tipped_employee_qualified == true, straight_cash_cents == 1704, minimum_wage_obligation_cents == 5800, tip_credit_cents == 4096, topup_cents == 0, total_gross_cents == 1704"
            - "the gated employees cost 5800 each in cash while the notified employee costs 1704: the tip credit is worth exactly the 4096 the waterfall could not fill from tips"
            - "GET /pay-periods/${period_id} reports total_credited_minutes == 1440, total_tip_credit_cents == 4096, total_topup_cents == 0, reported_tips_cents == 15000"

      - name: pool_card_fee_rounding_precision_per_shift_then_summed
        claim_type: precision
        grounds:
          - calculations.pool_cc_fee_deduction
          - calculations.pool_cc_fee_deduction.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / pool_card_fee_rounded_per_shift_then_summed
          rationale: "That §1.8 instance is built entirely around the rounding order, contrasting the 1052-cent per-shift-rounded answer with the 1051 a single rounding of the summed products would give."

      - name: tipped_employee_threshold_at_the_boundary
        claim_type: threshold
        grounds:
          - calculations.pay_line_wage_computation.constants.TIPPED_EMPLOYEE_MONTHLY_THRESHOLD_CENTS
        excluded_because:
          difficulty_instance: boundary_precision_check / tipped_employee_monthly_threshold_at_exactly_three_thousand_cents
          rationale: "That §1.8 instance tests the 3000-cent test at exactly the threshold and one cent below it, which is the threshold-algorithm boundary claim."

      - name: card_fee_tier_selection_actual_versus_capped
        claim_type: tiered_pricing
        grounds:
          - calculations.pool_cc_fee_deduction.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / pool_card_fee_actual_only_versus_capped_bps
          rationale: "That §1.8 instance runs the identical pool under ACTUAL_ONLY and CAPPED_BPS, asserting 1682 versus 1262 in fees and the resulting allocation deltas, which covers every tier of the fee variant table."

      - name: pool_weights_sum_without_drift
        claim_type: weighted_scoring
        grounds:
          - calculations.pool_distribution
        excluded_because:
          difficulty_instance: compensating_invariant / pool_distribute_then_reverse_conserves_declared_tips
          rationale: "That §1.8 instance asserts the weighted shares sum exactly to net_pool_cents and that a reversal returns every figure to its pre-distribution value with no rounding drift."

      - name: pool_running_total_after_add_and_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.shift_pool_contribution
        excluded_because:
          difficulty_instance: transitive_cascade / pool_reverse_cascade_depth_five
          rationale: "That §1.8 instance walks the aggregate up and back down through five cascade hops, checking the pool, the shifts, the location's pending_pool_cents and the period rollups at every hop."

      - name: pay_line_variant_divergence_and_selection
        claim_type: variant_divergence
        grounds:
          - calculations.pay_line_wage_computation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / pay_line_tip_credit_weekly_aggregate_versus_per_shift
          rationale: "That §1.8 instance computes then approves the same period, showing WEEKLY_AGGREGATE credit 5500 / top-up 2692 diverging from PER_SHIFT credit 4596 / top-up 3596, and that the variant is selected by the transition rather than by a payload flag."

  - section: validations
    instances:
