              payload: {}
              as: AccountManager
          assert:
            - "Account.${acct}.outstanding_cents == 50000"
            - "Account.${acct}.billing_status == CURRENT"

      - name: empty_soil_pickup_zero_count_no_strikes
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_PICKED_UP
          - entities.ServiceVisit.fields.expected_soil_count
          - entities.ServiceVisit.fields.actual_soil_count
          - entities.Garment.fields.soil_strikes
        distinguishing_aspect: |
          Empty-set / zero-count boundary on a different endpoint (pickup): a stop whose account has ZERO
          ASSIGNED garments yields expected_soil_count==0 and actual_soil_count==0, producing no soil
          strikes and no shortage — distinct metric from the outstanding_cents threshold.
        test_recipe:
          setup:
            - "An account with NO garments assigned, a stop and a scheduled visit."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Acme L", service_day: "TUE", shortage_grace_units: 0 }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R-L", service_day: "TUE", driver_user_id: "drv-l" }
              as: ProgramAdmin
              captures: { rt: $.data.id }
            - call: "POST /routes/${rt}/stops"
              payload: { account_id: "${acct}", stop_sequence: 1, window_start_min: 480, window_end_min: 540 }
              as: ProgramAdmin
              captures: { stop: $.data.id }
            - call: "POST /route-stops/${stop}/service-visits"
              payload: { week_index: 0 }
              as: ProgramAdmin
              captures: { v: $.data.id }
          trigger:
            - call: "POST /service-visits/${v}/pickup"
              payload: { actual_soil_count: 0 }
              as: RouteDriver
              captures: { esc: $.data.expected_soil_count }
          assert:
            - "ServiceVisit.${v}.expected_soil_count == 0"
            - "ServiceVisit.${v}.actual_soil_count == 0"
            - "ServiceVisit.${v}.status == PICKED_UP"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
