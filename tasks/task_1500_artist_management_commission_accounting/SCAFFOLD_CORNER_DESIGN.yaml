  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: request_missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Any call without X-User-ID/X-User-Role headers fails priority-1 auth before everything else."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /artists"
              payload: { stage_name: "NoHdr", legal_name: "NoHdr LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "With both headers omitted: error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400"

      - name: missing_required_field_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /artists without legal_name fails shape validation (priority 5) with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /artists"
              payload: { stage_name: "NoLegal", primary_genre: "pop" }
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400; no artist persisted"

      - name: body_foreign_key_unresolvable_returns_invalid_reference
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_REFERENCE]"]
        distinguishing_aspect: "POST /agreements with a random artist_id passes shape and role checks but fails body-FK existence with ERR_INVALID_REFERENCE (422) - distinct from path-level ERR_NOT_FOUND (404), and the reference check fires before the OCC version check."
        test_recipe:
          setup: ["one real artist exists (only to source a well-formed version placeholder)"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Ref Act", legal_name: "Ref Act LLC", primary_genre: "pop" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
          trigger:
            - call: "POST /agreements"
              payload: { artist_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REFERENCE (http 422): the body-supplied artist_id does not resolve"
            - "The real artist ${a_id} is untouched: no agreement created, version still == ${a_v}"

      - name: income_event_create_without_covering_agreement
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_COVERING_AGREEMENT]", "entities.IncomeEvent.fields.agreement_id"]
        distinguishing_aspect: "Recognition date 2025-06-01 predates every agreement's term_start_date (2026-01-01), so creation fails ERR_NO_COVERING_AGREEMENT at the resolution step."
        test_recipe:
          setup: ["Artist + ACTIVE agreement starting 2026-01-01; Agent"]
          setup_api_calls:
            - call: "POST /artists"
              payload: { stage_name: "Old Act", legal_name: "Old Act LLC", primary_genre: "jazz" }
              as: FirmAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
            - call: "POST /agreements"
              payload: { artist_id: "${a_id}", term_start_date: "2026-01-01", term_end_date: "2027-12-31", expected_artist_version: "${a_v}" }
              as: FirmAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /rate-schedules"
              payload: { agreement_id: "${agr_id}", income_type: "TOURING", in_term_rate_bps: 1500, sunset_rate_bps: 750, sunset_months: 12, effective_from_date: "2026-01-01" }
              as: FirmAdmin
            - call: "POST /agreements/${agr_id}/activate"
              payload: {}
              as: FirmAdmin
            - call: "POST /team-members"
              payload: { artist_id: "${a_id}", member_role: "AGENT", display_name: "Agent Ol", window_start_date: "2026-01-01" }
              as: FirmAdmin
              captures: { tm_agent: $.data.id }
          trigger:
            - call: "POST /income-events"
              payload: { artist_id: "${a_id}", income_type: "TOURING", gross_amount_cents: 100000, recognition_date: "2025-06-01", source_name: "Ancient promoter" }
              as: Agent
              as_user_id: "${tm_agent}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_COVERING_AGREEMENT (http 409); no IncomeEvent persisted"

      - name: verify_without_matching_rate_schedule
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_RATE_SCHEDULE]", "calculations.commission_rate_resolution"]
        distinguishing_aspect: "The agreement covers the date but has no ENDORSEMENT schedule: verify fails ERR_NO_RATE_SCHEDULE (422) and the event stays REPORTED."
        test_recipe:
