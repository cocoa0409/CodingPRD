  - section: cross_cutting_layers
    instances:
      - name: occ_campaign_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[campaign-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Campaign.version: a PATCH carrying the version observed before another successful PATCH is rejected 412 ERR_STALE_VERSION; the first PATCH advanced the version."
        test_recipe:
          setup: ["Requisition OPEN; campaign created (version 1)"]
          setup_api_calls:
            - call: "POST /erp/job-requisitions"
              payload: { req_number: "REQ-SR-1", title: "Sr Engineer", department: "ENGINEERING", level: "SENIOR" }
              as: TalentAdmin
              captures: { req_id: $.data.id }
            - call: "POST /erp/job-requisitions/${req_id}/open"
              as: TalentAdmin
            - call: "POST /erp/campaigns"
              payload: { name: "occ", job_requisition_id: "${req_id}", multiplier_bps: 15000, flat_addon_cents: 50000, window_start: "2026-07-01T00:00:00Z", window_end: "2026-09-30T00:00:00Z", budget_cents: 500000 }
              as: TalentAdmin
              captures: { camp_id: $.data.id, cv1: $.data.version }
          trigger:
            - call: "PATCH /erp/campaigns/${camp_id}"
              payload: { expected_campaign_version: "${cv1}", name: "occ v2" }
              as: TalentAdmin
              captures: { cv2: $.data.version }
            - call: "PATCH /erp/campaigns/${camp_id}"
              payload: { expected_campaign_version: "${cv1}", name: "stale write" }
              as: TalentAdmin
              captures: { err: $.data.error_id }
          assert:
            - "First PATCH succeeds and version becomes ${cv1} + 1"
            - "Second PATCH with the same observed version: 412 ERR_STALE_VERSION; campaign name remains 'occ v2'"

