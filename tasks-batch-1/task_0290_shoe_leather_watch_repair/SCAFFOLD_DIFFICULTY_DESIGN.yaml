              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "GET /repair-tickets/${tkt_id}"
              payload: {}
              as: FrontDeskClerk
              captures: { tkt_vr: $.data.version }
            - call: "POST /payments"
              payload: { ticket_id: "${tkt_id}", amount_cents: 1500, method: "CASH", expected_ticket_version: "${tkt_vr}" }
              as: FrontDeskClerk
