  - section: endpoints
    instances:
      - name: standard_crud_test_lab_create_read_and_missing_read
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_labeling_test_labs
          - endpoints.GET_labeling_test_labs_id
          - errors.ERR_TEST_LAB_NOT_FOUND
        distinguishing_aspect: "TestLab is the one accreditation entity with a create-and-read-only surface: the create response already carries the initialised bench-hour ledger (reserved 0 / available 200), the read returns the identical row, and an unknown id returns 404 ERR_TEST_LAB_NOT_FOUND rather than an empty body."
        test_recipe:
          setup:
            - "Only the logical clock is set; no other rows are needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /labeling/test-labs"
              payload: { lab_name: "Northline Labs", accreditation_status: "ACCREDITED", total_bench_hours: 200, concurrent_bench_capacity: 2 }
              as: ProgramAdministrator
              captures: { lab_id: "$.data.id" }
            - call: "GET /labeling/test-labs/${lab_id}"
              payload: {}
              as: TestLabOperator
              as_user_id: "${lab_id}"
            - call: "GET /labeling/test-labs/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "first response HTTP status is 201"
            - "TestLab.${lab_id}.lab_name == Northline Labs and accreditation_status == ACCREDITED"
            - "TestLab.${lab_id}.total_bench_hours == 200 and concurrent_bench_capacity == 2"
            - "TestLab.${lab_id}.reserved_bench_hours == 0 and available_bench_hours == 200"
            - "second response HTTP status is 200 and returns the same id, lab_name and ledger values"
            - "third response HTTP status is 404 with error_id ERR_TEST_LAB_NOT_FOUND"

