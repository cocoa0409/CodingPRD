            - "call 2 returns HTTP 412 with data.error_id == ERR_STALE_VERSION"
            - "call 3 returns HTTP 412 with data.error_id == ERR_STALE_VERSION"
            - "call 5 returns HTTP 201 and MilePurchaseOrder.${order2}.gross_amount_cents == 200000"
