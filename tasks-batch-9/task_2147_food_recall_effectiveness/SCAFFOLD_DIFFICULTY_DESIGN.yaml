            - "${after_del_response} == ACKNOWLEDGED"
            - "${after_del_counts} == true"
            - "ConsigneeNotification.${n1_id}.delivery_state == DELIVERED and ConsigneeNotification.${n1_id}.response_state == ACKNOWLEDGED"
            - "Recall.${r_id}.responded_count == 1 and Recall.${r_id}.contact_effectiveness_pct == 100.00"
            - "Recall.${r_id}.status == RETRIEVAL_ACCOUNTING"

      - name: hazard_evaluation_submit_return_resubmit_ratify_cycle
        grounds:
          - state_machines.HazardEvaluation.SUBMITTED_to_RETURNED
          - state_machines.HazardEvaluation.RETURNED_to_SUBMITTED
          - entities.HazardEvaluation.fields.return_count
        distinguishing_aspect: |
          Non-linear shape = a CYCLE on the HazardEvaluation entity (a different entity from the
          parallel-dimension ConsigneeNotification instance): SUBMITTED -> RETURNED -> SUBMITTED
          -> RATIFIED, with return_count incrementing on each loop and the PRELIMINARY score
          recomputed on every resubmission.
        test_recipe:
          setup:
            - "One Firm and one FDA Recall in DRAFT."
            - "One HazardEvaluation in status SUBMITTED (probability MEDIUM, severity_tier 3, exposure_population 30000, evidence_strength PROBABLE)."
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "MEDIUM", severity_tier: 3, exposure_population: 30000, vulnerable_population: false, evidence_strength: "PROBABLE", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
          trigger:
            - call: "POST /hazard-evaluations/${he_id}/decide"
              payload: { decision: "RETURN", panel_note: "Attach the serotype confirmation." }
              as: HealthHazardPanel
              as_user_id: "panel-1"
              captures: { st_returned: $.data.status, rc1: $.data.return_count }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { st_resubmitted: $.data.status, prelim2: $.data.hazard_score }
            - call: "POST /hazard-evaluations/${he_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
              captures: { final_score: $.data.hazard_score, final_class: $.data.recommended_class }
          assert:
            - "${st_returned} == RETURNED"
            - "${rc1} == 1"
            - "${st_resubmitted} == SUBMITTED"
            - "${prelim2} == 42.00"
            - "${final_score} == 33.60"
            - "${final_class} == CLASS_III"
            - "HazardEvaluation.${he_id}.status == RATIFIED and HazardEvaluation.${he_id}.return_count == 1"

  - rule_id: transitive_cascade
    instances:
      - name: reclassify_cascade_redates_report_flips_overdue_and_escalates_posture
        grounds:
          - state_machines.Recall.CLASSIFIED_to_CLASSIFIED
          - state_machines.StatusReport.PENDING_to_OVERDUE
          - calculations.report_cadence_schedule
          - calculations.compliance_posture
          - entities.Recall.fields.overdue_report_count
          - entities.Recall.fields.compliance_flag
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /recalls/{id}/classify: hop1 the recall's
          report_cadence_days drops 30 -> 7; BECAUSE that field changed, hop2 re-dates the open
          PENDING StatusReport's due_at to 2026-09-08; BECAUSE that new due_at is already past
          the clock, hop3 flips the report PENDING -> OVERDUE; BECAUSE a report flipped, hop4
          raises Recall.overdue_report_count to 1 and Recall.compliance_flag to ESCALATED, which
          re-pins report_cadence_days to 3. Each hop is caused by the previous hop, not by the
          original call.
        test_recipe:
          setup:
            - "Clock at 2026-09-11T00:00:00Z."
            - "FDA Recall classified CLASS_III at 2026-09-01T00:00:00Z, so report_cadence_days is 30 and StatusReport period_index 1 is PENDING with period_start 2026-09-01T00:00:00Z and due_at 2026-10-01T00:00:00Z."
            - "A second HazardEvaluation has just been RATIFIED with recommended_class CLASS_I; the first evaluation is SUPERSEDED."
            - "Recall.overdue_report_count is 0 and compliance_flag is COMPLIANT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "LOW", severity_tier: 1, exposure_population: 0, vulnerable_population: false, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he1_id: $.data.id }
            - call: "POST /hazard-evaluations/${he1_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /hazard-evaluations/${he1_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
            - call: "POST /recalls/${r_id}/classify"
              payload: { hazard_class: "CLASS_III" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "GET /recalls/${r_id}"
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { r_v2: $.data.version, cadence_before: $.data.report_cadence_days }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "MEDIUM", severity_tier: 4, exposure_population: 300000, vulnerable_population: false, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v2}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he2_id: $.data.id }
            - call: "POST /hazard-evaluations/${he2_id}/submit"
              payload: {}
