            - "trigger[3] response data == [${listing}] with total_count == 1 - the same junction row is reachable from the item side"
            - "MenuBoard.${board}.listing_count == 1 and stale_listing_count == 0"

      - name: compliance_summary_is_recomputed_from_current_rows_on_every_read
