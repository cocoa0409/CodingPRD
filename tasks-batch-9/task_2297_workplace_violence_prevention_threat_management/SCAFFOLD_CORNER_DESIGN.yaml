              as: ProgramAdmin
              captures: { mod_adm_id: $.data.id }
          trigger:
            - call: "POST /prevention-plans"
              payload: { worksite_id: "${ws_id}", effective_date: "2026-08-01T00:00:00Z" }
              as: SafetyOfficer
              as_user_id: "${so_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Wendy Cole", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { adm_id: $.data.id }
          assert:
            - "After the first trigger call, PreventionPlan.${plan_id}.training_compliance_pct == 100.00 with an empty pair set"
            - "After the first trigger call, PreventionPlan.${plan_id}.hazard_coverage_pct == 0.00 (one WorkArea, no assessment) and log_completeness_pct == 100.00"
            - "After the first trigger call, readiness_subtotal == 55.00, readiness_penalty_band == WEAK, readiness_penalty_points == 0.00 and readiness_score == 55.00"
            - "PreventionPlan.${plan_id}.inspection_ready == false because compliance_posture is FROZEN for a DRAFT plan, whatever the score"
            - "After the second trigger call, PreventionPlan.${plan_id}.training_compliance_pct == 0.00 (1 pair, 0 completed)"
            - "After the second trigger call, readiness_subtotal == 30.00 with readiness_penalty_band == WEAK and readiness_score == 30.00"
            - "Employee.${adm_id}.training_current == false"
