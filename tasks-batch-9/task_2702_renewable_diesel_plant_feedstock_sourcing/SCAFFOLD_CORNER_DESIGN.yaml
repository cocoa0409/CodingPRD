          - endpoints["POST /processing-runs/{id}/allocations"]
        distinguishing_aspect: "Consistency is immediate, not eventual: the allocation response body itself already shows the run's new reserved mass, blend CI and hydrogen requirement, and an immediately following GET returns byte-identical derived values with no settling delay."
