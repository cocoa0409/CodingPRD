        distinguishing_aspect: |
          The classic leak pair, tested on an endpoint whose roles list is a single role: a
          Contractor calling activate on a pre-buy contract id that does not exist must receive
          403 ERR_UNAUTHORIZED (priority 2), not 404 ERR_PREBUY_NOT_FOUND (priority 6). An
          implementation that loads the row before checking the role leaks the existence of
