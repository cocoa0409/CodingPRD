        claim_type: precondition_enforcement
        grounds:
          - state_machines.CutoverWindow.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_LOT_NOT_FAT_PASSED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cutover_start_requires_referenced_lot_in_fat_passed
          rationale: "That instance is exactly the guarded cross-entity transition with the lot held in STAGED."

  # =========================================================================
  # From Table 3 (Calculations)
  # =========================================================================
  - section: calculations
    instances:
      - name: deterministic_simulation_computes_effective_throughput_and_bottleneck
        claim_type: correct_result
        grounds:
          - calculations.line_throughput_simulation
          - entities.SimulationRun.fields.effective_throughput_cph
          - entities.ConveyorSegment.fields.derated_capacity_cph
        distinguishing_aspect: |
          On the two-segment line IB-01 (BELT 1500) -> TR-02 (ROLLER 1400) the DETERMINISTIC_STEADY_STATE run
          yields effective_throughput_cph 1400 with bottleneck_segment_code TR-02, shortfall_cph 0, and both
          segments carrying flow_share_bps 10000 with derated_capacity_cph equal to their nameplate ratings.
        test_recipe:
          setup:
            - "Fixture A design: source IB-01 BELT 1500 cph / 96% at source_share_bps 10000, feeding TR-02 ROLLER 1400 cph / 95% over a 10000 bps link."
          setup_api_calls:
            - call: "POST /projects"
