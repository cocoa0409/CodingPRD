    distinguishing_aspect: 'Mode (b) nested rounding with a pinned order: the 75-cent reverse-rail fee pool is split
      with integer floor division per bucket and the three leftover cents are then cycled one at a time in Transaction.created_at
      order, giving equal weights [1,1,1] the shares [25,25,25]; ceiling division distributes differently at any
