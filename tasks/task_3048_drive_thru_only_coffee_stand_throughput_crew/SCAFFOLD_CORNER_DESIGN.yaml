              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /loyalty-accounts/${acct_id}/points-adjustments"
              payload: { delta_points: 199, reason: "goodwill" }
              as: PlatformAdmin
              captures: { tier_199: $.data.tier }
            - call: "POST /loyalty-accounts/${acct_id}/points-adjustments"
              payload: { delta_points: 1, reason: "goodwill" }
              as: PlatformAdmin
              captures: { tier_200: $.data.tier }
            - call: "POST /loyalty-accounts/${acct_id}/points-adjustments"
              payload: { delta_points: 299, reason: "goodwill" }
              as: PlatformAdmin
              captures: { tier_499: $.data.tier }
          trigger:
            - call: "POST /loyalty-accounts/${acct_id}/points-adjustments"
              payload: { delta_points: 1, reason: "goodwill" }
              as: PlatformAdmin
              captures: { tier_500: $.data.tier, points_500: $.data.points }
          assert:
            - "199 points -> tier NONE; 200 points -> tier SILVER"
            - "499 points -> tier SILVER; 500 points -> tier GOLD (inclusive >=)"
            - "final points == 500"

