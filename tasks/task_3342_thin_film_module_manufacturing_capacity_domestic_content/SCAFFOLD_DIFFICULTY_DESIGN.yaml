              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver_1: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 40.0, price_usd_per_w: 0.25, deposit_usd: 500000.0, term_years: 1, expected_line_version: "${line_ver_1}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res1_id: $.data.id }
            - call: "POST /v1/capacity-reservations/${res1_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
            - call: "POST /v1/capacity-reservations/${res1_id}/activate"
              payload: {}
              as: ContractsOfficer
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver_2: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 50.0, price_usd_per_w: 0.25, deposit_usd: 625000.0, term_years: 1, expected_line_version: "${line_ver_2}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res2_id: $.data.id }
            - call: "POST /v1/capacity-reservations/${res2_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /v1/capacity-reservations/${res2_id}/activate"
              payload: {}
              as: ContractsOfficer
          assert:
            - "R2 activate: response.http_status == 422"
            - "R2 activate: response.error_id == ERR_CAPACITY_UNAVAILABLE"
            - "R2 unchanged: CapacityReservation.${res2_id}.status == DEPOSIT_HELD"
            - "ProductionLine.${line_id}.committed_capacity_mw == 40.0 (only R1)"
            - "ProductionLine.${line_id}.reserved_capacity_mw == 50.0 (R2 still holding)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (>=2 instances, different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: line_capacity_buckets_conserved
        grounds:
          - entities.ProductionLine.fields.committed_capacity_mw
          - entities.ProductionLine.fields.reserved_capacity_mw
          - entities.ProductionLine.fields.available_capacity_mw
          - state_machines.CapacityReservation.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = line capacity MW: committed_capacity_mw +
          reserved_capacity_mw + available_capacity_mw == annual_capacity_mw
          (100.0) at every step. Forward action (reservation create: reserved +=
          25.0, available -= 25.0) paired with its compensating action (cancel
          from PENDING: reserved -= 25.0, available += 25.0) restores the exact
          initial bucket split 0 / 0 / 100.
        test_recipe:
          setup:
            - "Line OH-L3 RAMPING, annual_capacity_mw 100.0; customer C (TIER_A)"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 25.0, price_usd_per_w: 0.25, deposit_usd: 312500.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { res_after_create: $.data.reserved_capacity_mw, avail_after_create: $.data.available_capacity_mw }
          trigger:
            - call: "POST /v1/capacity-reservations/${res_id}/cancel"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
          assert:
            - "after create (forward): reserved == 25.0 (${res_after_create}) and available == 75.0 (${avail_after_create})"
            - "after cancel (compensating): ProductionLine.${line_id}.reserved_capacity_mw == 0.0"
            - "after cancel: ProductionLine.${line_id}.committed_capacity_mw == 0.0"
            - "after cancel: ProductionLine.${line_id}.available_capacity_mw == 100.0 == annual_capacity_mw"
            - "CapacityReservation.${res_id}.status == CANCELLED"

      - name: deposit_split_conserved_on_cancel
        grounds:
          - calculations.deposit_forfeiture
          - entities.CapacityReservation.fields.deposit_forfeited_usd
          - entities.CapacityReservation.fields.deposit_usd
        distinguishing_aspect: |
          Conserved quantity = deposit USD (different quantity than capacity
          MW): deposit_usd == deposit_forfeited_usd + refundable balance. With
          delivered_mw 0.0 the forfeiture floor branch fails and the MIN cap
          binds: forfeit = MIN(200000.00, 0.15 * 2500000.00 = 375000.00) =
          200000.00, so the full deposit is forfeited and refundable == 0.00 —
          forfeit + refundable == deposit exactly, no drift.
        test_recipe:
          setup:
            - "Customer C (TIER_A) with ACTIVE reservation R: contracted_mw 10.0, price 0.25, deposit_usd 200000.0, delivered_mw 0.0 (no deliveries)"
          setup_api_calls:
            - call: "POST /v1/customers"
              payload: { legal_name: "Acme Solar Dev", credit_tier: "TIER_A", tax_credit_flag: false }
              as: ContractsOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /v1/module-series"
              payload: { series_code: "S6", technology: "CDTE_THIN_FILM", nominal_wattage: 480.0, bin_profile: [{ bin_code: "B1", wattage: 480.0, fraction: 0.5 }, { bin_code: "B2", wattage: 470.0, fraction: 0.5 }], temp_coefficient: -0.0028 }
              as: PlantManager
              captures: { series_id: $.data.id }
            - call: "POST /v1/production-lines"
              payload: { line_code: "OH-L3", site_country: "US", annual_capacity_mw: 100.0 }
              as: PlantManager
              captures: { line_id: $.data.id }
            - call: "POST /v1/production-runs"
              payload: { line_id: "${line_id}", series_id: "${series_id}", quarter: 0, input_modules: 100, good_modules: 70, bin_counts: [{ bin_code: "B1", count: 35 }, { bin_code: "B2", count: 35 }] }
              as: PlantManager
            - call: "POST /v1/production-lines/${line_id}/commission"
              payload: {}
              as: PlantManager
            - call: "GET /v1/production-lines/${line_id}"
              payload: {}
              as: PlantManager
              captures: { line_ver: $.data.version }
            - call: "POST /v1/capacity-reservations"
              payload: { customer_id: "${cust_id}", line_id: "${line_id}", series_id: "${series_id}", delivery_year: 2027, contracted_mw: 10.0, price_usd_per_w: 0.25, deposit_usd: 200000.0, term_years: 1, expected_line_version: "${line_ver}" }
              as: CustomerAdmin
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/capacity-reservations/${res_id}/post-deposit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
            - call: "POST /v1/capacity-reservations/${res_id}/activate"
              payload: {}
              as: ContractsOfficer
          trigger:
            - call: "POST /v1/capacity-reservations/${res_id}/cancel"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${cust_id}"
          assert:
            - "CapacityReservation.${res_id}.status == CANCELLED"
            - "CapacityReservation.${res_id}.deposit_forfeited_usd == 200000.00 (MIN cap: 0.15 * 2500000.00 = 375000.00 exceeds the deposit)"
            - "CapacityReservation.${res_id}.deposit_usd == 200000.00 (unchanged input)"
            - "conservation: deposit_usd - deposit_forfeited_usd == 0.00 refundable (forfeit + refundable == deposit)"
