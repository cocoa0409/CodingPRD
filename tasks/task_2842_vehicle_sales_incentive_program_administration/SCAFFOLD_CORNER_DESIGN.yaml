            - "${c_val} == SUBMITTED and ${c_pay} == UNPAID at creation"
            - "${err_unpaid_submitted} == ERR_CHARGEBACK_NOT_APPLICABLE (409): a claim nobody has approved yet has nothing to recover"
            - "${approved} == 50000 with ${val_after} == VALIDATED and ${pay_after} == UNPAID — approval does NOT pay"
            - "${err_readjudicate} == ERR_CLAIM_ALREADY_ADJUDICATED (409): the second adjudication is refused even though it asks for the opposite decision, and it is refused by a DIFFERENT auditor so this is not the segregation-of-duties rule firing"
            - "${err_unpaid_validated} == ERR_CHARGEBACK_NOT_APPLICABLE — still UNPAID, so still not chargeable; the applicability rule reads payment_status, not validation_status"
            - "${sched_count} == 1 and ${sched_total} == 50000 and ${disb_status} == DISBURSED"
            - "${cb_amount} == 50000 == ${approved} (full recovery for UNWOUND_DEAL), ${cb_status} == PENDING, ${cb_by} == u-auditor-1"
            - "${pay_charged} == CHARGED_BACK and ${batch_link} is null — the chargeback detached the claim from its disbursed batch"
            - "${err_already_charged} == ERR_CHARGEBACK_NOT_APPLICABLE — the third distinct payment_status that refuses, and the reason this rule cannot be written as `payment_status != PAID`"
            - "${rec_status} == RECOVERED with ${rec_at} == 2026-08-20T00:00:00.000Z (logical clock, not wall clock)"
            - "${err_recover_twice} == ERR_CHARGEBACK_INVALID_STATE and ${err_write_off_recovered} == ERR_CHARGEBACK_INVALID_STATE — RECOVERED is terminal against BOTH triggers"
            - "${cb_list_total} == 1 and ${cb_list_first_status} == RECOVERED — none of the four refusals created a second Chargeback row"

      - name: batch_state_guards_outrank_the_pay_date_check_which_admits_the_exact_instant
        claim_type: triggerable
        grounds:
          - errors[ERR_BATCH_INVALID_STATE]
          - errors[ERR_PAY_DATE_NOT_REACHED]
          - validations[priority=10]
          - validations[priority=30]
          - state_machines.PaymentBatch
        distinguishing_aspect: "ERR_BATCH_INVALID_STATE is triggered from all four batch action endpoints (schedule-claims, lock, disburse, cancel) and the FIRST disburse attempt violates the state rule AND the pay-date rule simultaneously — priority 10 must win over priority 30. Then the pay-date boundary is probed one millisecond early (422) and at the exact scheduled instant (accepted), so the comparison is >= and not >."
        test_recipe:
          setup:
            - "One ACTIVE CUSTOMER_CASH program (per_unit 40000, budget 500000), one ACTIVE dealer, one VALIDATED delivery, one VALIDATED/UNPAID claim, one OPEN batch with scheduled_pay_date 2026-08-25T00:00:00.000Z. The logical clock starts at 2026-08-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/dealers"
