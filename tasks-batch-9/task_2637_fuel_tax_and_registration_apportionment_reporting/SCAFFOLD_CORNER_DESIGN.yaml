            - call: "POST /apportionment/fuel-purchases"
              payload: { carrier_id: "${c1_id}", vehicle_id: "${v1_id}", jurisdiction_code: "IL", purchase_date: "2026-05-02", gallons: 100.000, tax_paid_flag: true, receipt_reference: "RCPT-IL-4471" }
              as: MileageAnalyst
