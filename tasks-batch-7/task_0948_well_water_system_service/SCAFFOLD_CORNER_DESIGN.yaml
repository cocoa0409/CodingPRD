            - call: "POST /water-service/technicians"
              payload: { full_name: "Accept Tech", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /water-service/water-tests"
