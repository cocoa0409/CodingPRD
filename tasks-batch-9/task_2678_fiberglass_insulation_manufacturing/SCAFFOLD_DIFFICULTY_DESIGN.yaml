            - "ProductLine.${pl_a}.recovery_penalty_per_sqft == 0.006000 (max(0, 95.0-90.00) * 0.0012)"
            - "ProductLine.${pl_a}.net_landed_cost_per_sqft == 0.031660"
            - "ProductLine.${pl_b}.recovered_thickness_pct == 93.00 after creation (100 - (5.0-4.0)*5.0 - 2.0 faced penalty)"
            - "ProductLine.${pl_b}.compressed_bale_volume_ft3 == 5.100 and bales_per_truck == 745 and freight_cost_per_sqft == 0.067114 and net_landed_cost_per_sqft == 0.069514 after creation"
            - "after the PATCH, ProductLine.${pl_b}.recovered_thickness_pct == 80.00 — the raw 78.00 is clamped up by the RECOVERY_FLOOR_PCT max()"
            - "after the PATCH, ProductLine.${pl_b}.compressed_bale_volume_ft3 == 3.188"
            - "after the PATCH, ProductLine.${pl_b}.bales_per_truck == 1191 (min(floor(3800/3.188)=1191, floor(19500/15.0)=1300) — still cube-bound)"
            - "after the PATCH, ProductLine.${pl_b}.freight_cost_per_sqft == 0.041982"
            - "after the PATCH, ProductLine.${pl_b}.recovery_penalty_per_sqft == 0.018000 (max(0, 95.0-80.00) * 0.0012)"
            - "after the PATCH, ProductLine.${pl_b}.net_landed_cost_per_sqft == 0.059982"
            - "ProductLine.${pl_b}.compression_ratio == 8.0 and bale_volume_ft3 == 25.5 (unsupplied packaging fields are untouched by the PATCH)"

      - name: cullet_charge_cap_circular_dependency_evaluation_order
        grounds:
          - calculations.cullet_charge_allocation
          - state_machines.ProductionRun.SCHEDULED_to_MELTING
          - state_machines.CulletBatch.STAGED_to_CHARGED
          - entities.ProductionRun.fields.allowed_cullet_kg
          - entities.ProductionRun.fields.virgin_batch_kg
          - entities.Plant.fields.cullet_fraction_ytd
        distinguishing_aspect: |
          §0.5 mode (c): the cap reads circular — cullet is capped at a fraction of
          the TOTAL charge and the total charge contains the cullet — so the formula
          only resolves under a pinned 5-step order (total from pull ÷ yield, cap
          against that total, whole-batch greedy consume in created_at ASC, skip
          without partial charging, virgin as the residual). The 500.00 kg batch is
          skipped even though 400.00 kg of headroom remains, which is the observable
          that falsifies any implementation that caps against virgin mass or splits a
          batch: cullet_charged_kg == 2600.00, not 3000.00.
        test_recipe:
          setup:
            - "Plant NWK exists with max_cullet_fraction 0.30 and cullet_restrict_fraction 0.28, melt_posture OPEN."
            - "Three cullet batches are STAGED at the plant in creation order: 1200.00 kg, 1400.00 kg, 500.00 kg — cullet_received_kg_ytd 3100.00, cullet_on_hand_kg 3100.00."
            - "Run RUN-A for PL-A on line 1 is SCHEDULED with target_pull_kg 9200."
          setup_api_calls:
            - call: "POST /certification-programs"
              payload: { code: "RCERT-PS", conformance_basis: "PER_SPECIMEN", r_value_tolerance: 0.30, min_specimen_count: 3, max_concurrent_lab_tests: 2, retest_limit: 2, derate_allowed: true }
              as: CorporateOps
              captures: { prog_ps: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Newark Forming Line", site_code: "NWK", oven_zone_count: 4, oven_length_ft: 120, production_line_count: 2, permit_number: "NJ-AIR-114", formaldehyde_allowance_kg: 0.200, voc_allowance_kg: 12.0, max_cullet_fraction: 0.30, cullet_restrict_fraction: 0.28, max_width_change_in: 8.0 }
              as: CorporateOps
              captures: { plant_id: "$.data.id", pv1: "$.data.version" }
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /product-lines"
              payload: { sku: "R13-15-UF", plant_id: "${plant_id}", binder_formulation_id: "${binder_free}", certification_program_id: "${prog_ps}", form: "BATT", density_pcf: 0.80, facing_type: "UNFACED", width_in: 15, thickness_in: 3.5, declared_r_value: 13.0, bag_sqft: 88.0, bale_volume_ft3: 21.0, bale_mass_kg: 12.5, mass_rate_kg_per_min: 34.5, compression_ratio: 6.0 }
              as: CorporateOps
              captures: { pl_a: "$.data.id" }
            - call: "POST /cullet-batches"
              payload: { plant_id: "${plant_id}", source_type: "EXTERNAL", mass_kg: 1200.00, expected_plant_version: "${pv1}" }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { batch_1: "$.data.id" }
            - call: "GET /plants/${plant_id}"
              payload: {}
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { pv2: "$.data.version" }
            - call: "POST /cullet-batches"
              payload: { plant_id: "${plant_id}", source_type: "EXTERNAL", mass_kg: 1400.00, expected_plant_version: "${pv2}" }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { batch_2: "$.data.id" }
            - call: "GET /plants/${plant_id}"
              payload: {}
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { pv3: "$.data.version" }
            - call: "POST /cullet-batches"
              payload: { plant_id: "${plant_id}", source_type: "EXTERNAL", mass_kg: 500.00, expected_plant_version: "${pv3}" }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { batch_3: "$.data.id" }
            - call: "POST /production-runs"
              payload: { plant_id: "${plant_id}", product_line_id: "${pl_a}", line_index: 1, scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-03T14:00:00Z", target_pull_kg: 9200, zone_setpoints_f: [470, 470, 470, 470] }
              as: PlantOperator
              as_user_id: "${plant_id}"
              captures: { run_a: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: CorporateOps
          trigger:
            - call: "POST /production-runs/${run_a}/start-melt"
              payload: { cullet_batch_ids: ["${batch_1}", "${batch_2}", "${batch_3}"] }
              as: PlantOperator
              as_user_id: "${plant_id}"
          assert:
            - "ProductionRun.${run_a}.total_charge_kg == 10000.00 (9200 / 0.92, derived from the pull target only)"
            - "ProductionRun.${run_a}.allowed_cullet_kg == 3000.00 (floor2(10000.00 * 0.30), taken against the TOTAL charge)"
            - "ProductionRun.${run_a}.cullet_charged_kg == 2600.00"
            - "ProductionRun.${run_a}.virgin_batch_kg == 7400.00"
            - "ProductionRun.${run_a}.cullet_fraction == 0.2600"
            - "ProductionRun.${run_a}.total_charge_kg == ProductionRun.${run_a}.virgin_batch_kg + ProductionRun.${run_a}.cullet_charged_kg"
            - "CulletBatch.${batch_1}.status == CHARGED and CulletBatch.${batch_1}.charged_run_id == ${run_a}"
            - "CulletBatch.${batch_2}.status == CHARGED and CulletBatch.${batch_2}.charged_run_id == ${run_a}"
            - "CulletBatch.${batch_3}.status == STAGED and CulletBatch.${batch_3}.charged_run_id == null — skipped whole, not split into the 400.00 kg of remaining headroom"
            - "Plant.${plant_id}.cullet_charged_kg_ytd == 2600.00 and Plant.${plant_id}.total_charge_kg_ytd == 10000.00"
            - "Plant.${plant_id}.cullet_fraction_ytd == 0.2600 and Plant.${plant_id}.cullet_on_hand_kg == 500.00"
            - "Plant.${plant_id}.melt_posture == OPEN (0.2600 < 0.28) and Plant.${plant_id}.posture_reason == null"
            - "ProductionRun.${run_a}.run_status == MELTING"

  - rule_id: non_linear_state_machine
    instances:
      - name: binder_revision_cycle_revisits_emissions_testing_twice
        grounds:
          - state_machines.BinderFormulation.EMISSIONS_TESTING_to_REVISION_REQUIRED
          - state_machines.BinderFormulation.REVISION_REQUIRED_to_DRAFT
          - state_machines.BinderFormulation.DRAFT_to_SUBMITTED
          - state_machines.BinderFormulation.SUBMITTED_to_EMISSIONS_TESTING
          - entities.BinderFormulation.fields.revision_count
          - validations[priority=84]
        distinguishing_aspect: |
          A true cycle on the BinderFormulation entity: the row re-enters
          EMISSIONS_TESTING a second time via
          EMISSIONS_TESTING -> REVISION_REQUIRED -> DRAFT -> SUBMITTED ->
          EMISSIONS_TESTING, so status alone cannot identify how far the formulation
          has progressed — only revision_count (0 on the first pass, 1 on the second)
          distinguishes the two visits, and the loop is bounded at
          MAX_BINDER_REVISIONS = 2.
        test_recipe:
          setup:
            - "Binder BF-FREE-1 has been drafted, submitted and moved into EMISSIONS_TESTING once, with revision_count 0."
            - "No product line references it yet, so no suspension cascade can interfere."
          setup_api_calls:
            - call: "POST /binder-formulations"
              payload: { code: "BF-FREE-1", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
              captures: { binder_free: "$.data.id" }
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 40, voc_g_per_kg: 4.8, lab_reference: "LAB-9001" }
              as: CertificationOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "REQUEST_REVISION", revision_notes: "VOC margin too thin at 4.8 g/kg" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/revise"
              payload: { decision: "REVISE", formaldehyde_free: true, formaldehyde_ppm: 0, voc_g_per_kg: 3.2, min_cure_temp_f: 420, min_dwell_s: 150, loi_target_pct: 4.5 }
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /binder-formulations/${binder_free}/emissions-test"
              payload: { formaldehyde_ppm: 0, voc_g_per_kg: 3.2, lab_reference: "LAB-9002" }
              as: CertificationOfficer
              as_user_id: "co-1"
            - call: "POST /binder-formulations/${binder_free}/certification-decision"
              payload: { decision: "CERTIFY", emissions_cert_id: "EC-4411" }
              as: CertificationOfficer
              as_user_id: "co-1"
          assert:
            - "immediately after the REQUEST_REVISION call, BinderFormulation.${binder_free}.status == REVISION_REQUIRED and revision_notes == \"VOC margin too thin at 4.8 g/kg\""
            - "immediately after the revise call, BinderFormulation.${binder_free}.status == DRAFT and revision_count == 1 and emissions_cert_id == null and lab_reference == null and certified_at == null and revision_notes == null"
            - "immediately after the second submit, BinderFormulation.${binder_free}.status == SUBMITTED"
            - "immediately after the second emissions-test, BinderFormulation.${binder_free}.status == EMISSIONS_TESTING for the SECOND time on the same row, with revision_count still 1 and lab_reference == \"LAB-9002\""
            - "final BinderFormulation.${binder_free}.status == CERTIFIED with formaldehyde_ppm == 0, voc_g_per_kg == 3.2, emissions_cert_id == \"EC-4411\" and revision_count == 1"
            - "revision_count == 1 is the only field that distinguishes the second EMISSIONS_TESTING visit from the first"

