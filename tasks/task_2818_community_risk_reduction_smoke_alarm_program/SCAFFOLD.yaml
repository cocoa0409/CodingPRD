scenario: |
  2818. Community Risk Reduction & Smoke Alarm Program (fire department community risk reduction
  division): community risk assessment using incident, demographic and building data to target
  neighborhoods, home safety visit scheduling with canvassing routes and appointment options, smoke
  and carbon monoxide alarm installation with placement standards and inventory control, occupant
  education, escape plan development and follow-up contact for effectiveness, high-risk population
  programs for older adults, families with young children and residents with disabilities, partner
  coordination with nonprofits and utility companies for funding and referrals, outcome tracking on
  fire incidence and injury in served areas, grant reporting on installations and outcomes

domain_name: community-risk-reduction-alarm-program
api_prefix: "/crr"

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # RiskZone is self-referential (parent_zone_id builds a district tree whose score is a
  # unit-weighted rollup of its children); AlarmInstallation is a junction that binds
  # HomeSafetyVisit x DeviceLot x Crew; Household binds RiskZone x Partner; GrantReport spans
  # PartnerGrant x AlarmInstallation x RiskZone across aggregate boundaries. Nesting in URL paths
  # is used only for append-only event children (assessments, fire-incidents, follow-ups).

  state_machine_shape: parallel
  # HomeSafetyVisit carries two independent axes on one row (install_status x education_status)
  # plus a derived compound visit_status; EscapePlan and GrantReport are cyclic; Household branches
  # and loops back through REVISIT_REQUIRED; CanvassRoute and PartnerGrant are linear.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The Crew that reserved/installed a device MUST NOT be the Crew that verifies it, and the
  # GrantOfficer user id that compiled a GrantReport MUST NOT be the user id that submits it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 50 endpoints / 30 error codes / 8 calculations (3 dual-variant) / 8 state
  # machines / 2 OCC races. Density target: every money movement is double-entry conserved, every
  # temporal rule uses different interval geometry, and the two deepest cascades are 4 hops long.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: RiskZone
    parent: null
    common_fields: true
    description: >
      A targetable neighborhood (LEAF) or an aggregation district (DISTRICT). Leaf zones carry the
      incident/demographic/building inputs and are assessed directly; district zones derive their
      score by unit-weighted rollup of their assessed children.
    fields:
      - name: zone_code
        type: string
        source: input
        description: Operator-facing zone identifier
        constraints: "non-empty; globally unique; violation -> ERR_ZONE_CODE_TAKEN"
      - name: name
        type: string
        source: input
        description: Neighborhood name
      - name: parent_zone_id
        type: string
        source: input
        description: "FK -> RiskZone.id; nullable; when set, this zone rolls up into the referenced district zone"
        default: null
        constraints: "must reference an existing RiskZone; self-reference and 2+ level nesting are rejected with ERR_ZONE_NESTING_DEPTH"
      - name: zone_kind
        type: enum
        source: computed
        description: "LEAF while no RiskZone has parent_zone_id == this.id; flips to DISTRICT on the first child creation"
        default: LEAF
        constraints: "one of {LEAF, DISTRICT}"
      - name: occupied_units
        type: integer
        source: input
        description: Occupied dwelling units used as the denominator of every per-1000 rate
        constraints: ">= 1"
      - name: structure_fire_count_5yr
        type: integer
        source: input
        description: Structure fires recorded in the zone over the trailing 5 years
        constraints: ">= 0"
      - name: fire_injury_count_5yr
        type: integer
        source: input
        description: Civilian fire injuries recorded in the zone over the trailing 5 years
        constraints: ">= 0"
      - name: pre_1980_unit_pct
        type: number
        source: input
        description: Percent of units built before 1980 (building-stock risk input)
        constraints: "0.0 <= x <= 100.0"
      - name: senior_household_pct
        type: number
        source: input
        description: Percent of households with an occupant aged 65+
        constraints: "0.0 <= x <= 100.0"
      - name: under5_household_pct
        type: number
        source: input
        description: Percent of households with a child under 5
        constraints: "0.0 <= x <= 100.0"
      - name: disability_household_pct
        type: number
        source: input
        description: Percent of households reporting a disability
        constraints: "0.0 <= x <= 100.0"
      - name: assumed_alarm_absence_pct
        type: number
        source: input
        description: Pre-survey estimate of units without a working smoke alarm; sole alarm input of the PROVISIONAL_DEMOGRAPHIC variant
        constraints: "0.0 <= x <= 100.0"
      - name: daily_visit_cap
        type: integer
        source: input
        description: Maximum canvass slots the division will publish in this zone on any single service_date
        constraints: ">= 1"
      - name: assessment_status
        type: enum
        source: system
        description: Zone lifecycle state
        default: UNASSESSED
        constraints: "one of {UNASSESSED, ASSESSED, TARGETED, SERVICE_ACTIVE, SERVICE_COMPLETE}"
      - name: assessment_basis
        type: enum
        source: system
        description: Basis of the currently effective assessment; selects which zone_risk_score variant is re-run by cascades
        default: null
        constraints: "null until first assessment; then one of {PROVISIONAL, VALIDATED}"
      - name: current_assessment_id
        type: string
        source: system
        description: "FK -> ZoneAssessment.id; nullable; points at the highest sequence_no ZoneAssessment, i.e. the one that supersedes all earlier rows"
        default: null
      - name: risk_score
        type: number
        source: computed
        description: Output of calculations.zone_risk_score (leaf) or calculations.district_risk_rollup (district)
        default: null
        constraints: "0.00 <= x <= 100.00, 2 decimals"
      - name: risk_tier
        type: enum
        source: computed
        description: Tier derived from risk_score by calculations.zone_risk_score tier table
        default: null
        constraints: "one of {TIER_1, TIER_2, TIER_3}"
      - name: surveyed_units
        type: integer
        source: computed
        description: Count of HomeSafetyVisit rows in this zone that reached install_status in {INSTALL_COMPLETE, INSTALL_DEFERRED}; denominator of the VALIDATED_FIELD alarm gap
        default: 0
      - name: surveyed_units_without_alarm
        type: integer
        source: computed
        description: Of surveyed_units, how many reported pre_existing_working_smoke_alarms == 0 at arrival
        default: 0
      - name: post_service_alarm_loss_units
        type: integer
        source: computed
        description: Households whose follow-up outcome was REACHED_ALARM_MISSING after service; added to the VALIDATED_FIELD numerator
        default: 0
      - name: served_household_count
        type: integer
        source: computed
        description: Count of Household rows in this zone with status IN {VISIT_COMPLETED, REVISIT_REQUIRED}
        default: 0
      - name: service_start_date
        type: string
        source: system
        description: UTC date (YYYY-MM-DD) of the first visit completion in this zone; anchors both outcome windows
        default: null

  - name: ZoneAssessment
    parent: RiskZone
    common_fields: false
    description: >
      Immutable record of one risk-assessment run. Has no update endpoint and no version field; a
      later run supersedes an earlier one by advancing RiskZone.current_assessment_id.
    fields:
      - name: zone_id
        type: string
        source: system
        description: "FK -> RiskZone.id; taken from the path, never from the body"
      - name: sequence_no
        type: integer
        source: computed
        description: Count of pre-existing ZoneAssessment rows for zone_id, plus 1
        constraints: ">= 1"
      - name: basis
        type: enum
        source: input
        description: Which zone_risk_score variant this run applied
        constraints: "one of {PROVISIONAL, VALIDATED}"
      - name: analyst_note
        type: string
        source: input
        description: Free-text justification
        default: null
      - name: incident_density_per_1000
        type: number
        source: computed
        description: structure_fire_count_5yr * 1000 / occupied_units, 4 decimals
      - name: injury_density_per_1000
        type: number
        source: computed
        description: fire_injury_count_5yr * 1000 / occupied_units, 4 decimals
      - name: incident_points
        type: number
        source: computed
        description: Capped incident component of risk_score, 2 decimals
      - name: injury_points
        type: number
        source: computed
        description: Capped injury component of risk_score, 2 decimals
      - name: building_points
        type: number
        source: computed
        description: Building-stock component of risk_score, 2 decimals
      - name: vulnerability_points
        type: number
        source: computed
        description: Capped high-risk-population component of risk_score, 2 decimals
      - name: alarm_points
        type: number
        source: computed
        description: Capped alarm-gap component of risk_score, 2 decimals
      - name: alarm_gap_pct
        type: number
        source: computed
        description: Variant-selected alarm absence percentage that produced alarm_points, 2 decimals
      - name: surveyed_units_at_assessment
        type: integer
        source: computed
        description: Snapshot of RiskZone.surveyed_units when this run executed
      - name: risk_score
        type: number
        source: computed
        description: Total score written back to RiskZone.risk_score, 2 decimals
      - name: risk_tier
        type: enum
        source: computed
        description: Tier written back to RiskZone.risk_tier
        constraints: "one of {TIER_1, TIER_2, TIER_3}"
      - name: assessed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the RiskAnalyst that ran the assessment (audit only, never a decision input)

  - name: Household
    parent: RiskZone
    common_fields: true
    description: >
      A residence in the canvass universe. Carries the high-risk-population inputs that drive both
      priority_band and the per-visit time demand, and the placement-standard device requirements.
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> RiskZone.id; must reference a LEAF zone"
      - name: referral_partner_id
        type: string
        source: input
        description: "FK -> Partner.id; nullable; set when the household entered the program through a partner referral"
        default: null
      - name: address_line
        type: string
        source: input
        description: Street address
        constraints: "non-empty; unique within zone_id; violation -> ERR_DUPLICATE_HOUSEHOLD_ADDRESS"
      - name: occupant_count
        type: integer
        source: input
        description: Total occupants
        constraints: ">= 1"
      - name: children_under5
        type: integer
        source: input
        description: Occupants under 5 years old
        default: 0
        constraints: ">= 0"
      - name: adults_65plus
        type: integer
        source: input
        description: Occupants aged 65 or older
        default: 0
        constraints: ">= 0"
      - name: mobility_impaired_occupants
        type: integer
        source: input
        description: Occupants with a mobility disability
        default: 0
        constraints: ">= 0"
      - name: hearing_impaired_occupants
        type: integer
        source: input
        description: Deaf or hard-of-hearing occupants; > 0 makes a STROBE_HOH device mandatory
        default: 0
        constraints: ">= 0"
      - name: sleeping_areas_count
        type: integer
        source: input
        description: Distinct sleeping areas; drives required_smoke_devices and visit time demand
        constraints: ">= 1"
      - name: storeys
        type: integer
        source: input
        description: Habitable storeys including basement
        constraints: ">= 1"
      - name: fuel_burning_appliance
        type: boolean
        source: input
        description: Any fuel-burning appliance present; makes a CO device mandatory
        default: false
      - name: attached_garage
        type: boolean
        source: input
        description: Attached garage present; makes a CO device mandatory
        default: false
      - name: preferred_language
        type: string
        source: input
        description: Occupant education language code
        default: "EN"
      - name: priority_band
        type: enum
        source: computed
        description: Output of calculations.household_priority_band, recomputed whenever the parent zone's risk_tier changes
        constraints: "one of {P1_HIGH_RISK, P2_ELEVATED, P3_STANDARD}"
      - name: status
        type: enum
        source: system
        description: Household canvass lifecycle state
        default: INTAKE_QUEUED
        constraints: "one of {INTAKE_QUEUED, APPOINTMENT_SCHEDULED, VISIT_COMPLETED, REVISIT_REQUIRED, REFUSED, NO_CONTACT}"
      - name: canvass_attempt_count
        type: integer
        source: computed
        description: Count of HomeSafetyVisit rows ever created for this household (cancelled ones included)
        default: 0
      - name: alarm_retention_flag
        type: boolean
        source: computed
        description: null until the first eligible follow-up; true on REACHED_ALARM_PRESENT, false on REACHED_ALARM_MISSING
        default: null
      - name: required_smoke_devices
        type: integer
        source: computed
        description: sleeping_areas_count + storeys, per calculations.alarm_placement_requirement
      - name: required_co_devices
        type: integer
        source: computed
        description: 1 when fuel_burning_appliance or attached_garage is true, else 0
      - name: required_strobe_devices
        type: integer
        source: computed
        description: 1 when hearing_impaired_occupants > 0, else 0
      - name: last_visit_completed_at
        type: datetime
        source: system
        description: Completion instant of the most recent completed visit; anchors the follow-up eligibility window
        default: null

  - name: Crew
    parent: null
    common_fields: true
    description: >
      A two-person install crew. Its calendar is the resource guarded by the buffered half-open
      interval rule, and its id is the X-User-ID of the CrrTechnician role.
    fields:
      - name: crew_code
        type: string
        source: input
        description: Crew call sign
        constraints: "non-empty; globally unique; violation -> ERR_CREW_CODE_TAKEN"
      - name: member_count
        type: integer
        source: input
        description: Number of technicians on the crew
        constraints: ">= 1"
      - name: certification_level
        type: enum
        source: input
        description: BASIC crews may not install STROBE_HOH devices; ADVANCED may install any type
        constraints: "one of {BASIC, ADVANCED}"
      - name: max_daily_minutes
        type: integer
        source: input
        description: Aggregate minutes of visit demand the crew may carry on one service_date
        constraints: ">= 60"
      - name: status
        type: enum
        source: input
        description: INACTIVE crews cannot be attached to a new route
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: CanvassRoute
    parent: RiskZone
    common_fields: true
    description: >
      One crew's canvassing run through one zone on one service date, with a wall-clock window and
      a finite slot count.
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> RiskZone.id; must reference a LEAF zone in assessment_status IN {ASSESSED, TARGETED, SERVICE_ACTIVE}"
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; must reference a Crew with status == ACTIVE"
      - name: service_date
        type: string
        source: input
        description: UTC calendar date (YYYY-MM-DD) the route runs
      - name: window_start_utc
        type: datetime
        source: input
        description: Inclusive start of the route's working window
        constraints: "must fall on service_date in UTC; must be < window_end_utc"
      - name: window_end_utc
        type: datetime
        source: input
        description: Exclusive end of the route's working window
        constraints: "must fall on service_date in UTC"
      - name: planned_slots
        type: integer
        source: input
        description: Appointment slots the route offers; counts against RiskZone.daily_visit_cap once PUBLISHED
        constraints: ">= 1"
      - name: booked_slot_count
        type: integer
        source: computed
        description: Count of HomeSafetyVisit rows on this route with visit_status != CANCELLED
        default: 0
      - name: status
        type: enum
        source: system
        description: Route lifecycle state
        default: PLANNED
        constraints: "one of {PLANNED, PUBLISHED, IN_PROGRESS, CLOSED}"

  - name: HomeSafetyVisit
    parent: CanvassRoute
    common_fields: true
    description: >
      One appointment at one household. Two independent axes advance on the same row:
      install_status (survey -> install outcome) and education_status (occupant education). The
      externally visible visit_status is derived from both axes plus cancellation.
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household must be in status IN {INTAKE_QUEUED, REVISIT_REQUIRED}"
      - name: route_id
        type: string
        source: input
        description: "FK -> CanvassRoute.id; the route must be in status IN {PUBLISHED, IN_PROGRESS} and cover the household's zone"
      - name: appointment_option
        type: enum
        source: input
        description: SCHEDULED_APPOINTMENT and CANVASS_WALKUP occupy the crew calendar; VIRTUAL_ASSESSMENT does not and cannot host installations
        constraints: "one of {SCHEDULED_APPOINTMENT, CANVASS_WALKUP, VIRTUAL_ASSESSMENT}"
      - name: contact_channel
        type: enum
        source: input
        description: How the appointment was arranged
        default: PHONE
        constraints: "one of {PHONE, DOOR_KNOCK, EMAIL, PARTNER_REFERRAL}"
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: Inclusive start of the appointment
      - name: demand_minutes
        type: integer
        source: computed
        description: Output of calculations.visit_demand_minutes at creation (and recomputed on reschedule)
      - name: scheduled_end_utc
        type: datetime
        source: computed
        description: scheduled_start_utc + demand_minutes (exclusive end of the appointment itself)
      - name: occupies_crew_calendar
        type: boolean
        source: computed
        description: false when appointment_option == VIRTUAL_ASSESSMENT, else true; false rows are skipped by the crew interval and crew daily-minutes rules
      - name: install_status
        type: enum
        source: system
        description: Installation axis of the visit
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, SURVEYED, INSTALL_COMPLETE, INSTALL_DEFERRED}"
      - name: education_status
        type: enum
        source: system
        description: Occupant-education axis of the visit; advances independently of install_status
        default: PENDING
        constraints: "one of {PENDING, DELIVERED, DECLINED}"
      - name: visit_status
        type: enum
        source: computed
        description: >
          Compound projection of both axes, evaluated in this exact order: (1) cancelled_at != null
          -> CANCELLED; (2) install_status IN {INSTALL_COMPLETE, INSTALL_DEFERRED} and
          education_status IN {DELIVERED, DECLINED} -> COMPLETED; (3) install_status IN
          {INSTALL_COMPLETE, INSTALL_DEFERRED} and education_status == PENDING -> AWAITING_EDUCATION;
          (4) install_status == SURVEYED and education_status IN {DELIVERED, DECLINED} ->
          AWAITING_INSTALL_OUTCOME; (5) install_status == SURVEYED -> IN_PROGRESS; (6) otherwise
          SCHEDULED.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, AWAITING_EDUCATION, AWAITING_INSTALL_OUTCOME, COMPLETED, CANCELLED}"
      - name: pre_existing_working_smoke_alarms
        type: integer
        source: system
        description: Working smoke alarms found at arrival; 0 makes this unit count into RiskZone.surveyed_units_without_alarm on completion
        default: null
      - name: pre_existing_working_co_alarms
        type: integer
        source: system
        description: Working CO alarms found at arrival
        default: null
      - name: occupant_present
        type: boolean
        source: system
        description: Recorded at arrival; arrival with false is rejected
        default: null
      - name: deferral_reason
        type: enum
        source: system
        description: Required when the install outcome is DEFERRED
        default: null
        constraints: "one of {OCCUPANT_DECLINED_INSTALL, STRUCTURAL_BARRIER, STOCK_UNAVAILABLE, LANDLORD_APPROVAL_REQUIRED}"
      - name: education_topics
        type: array
        source: system
        description: Topic codes covered during occupant education
        default: null
      - name: escape_plan_walkthrough
        type: boolean
        source: system
        description: Whether the escape plan was walked through during education
        default: null
      - name: cancel_reason
        type: enum
        source: system
        description: Reason recorded by the cancel endpoint or by the route-close cascade
        default: null
        constraints: "one of {OCCUPANT_REFUSED, OCCUPANT_UNREACHABLE, ROUTE_CLOSED, RESCHEDULE_REQUESTED}"
      - name: cancelled_at
        type: datetime
        source: system
        description: Logical-clock instant of cancellation
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant the install axis reached a terminal value
        default: null
      - name: occupant_signature_name
        type: string
        source: system
        description: Signature captured at install completion
        default: null

  - name: DeviceLot
    parent: PartnerGrant
    common_fields: true
    description: >
      A received batch of one device type funded by exactly one grant. Physical units are conserved:
      received_qty == on_hand_qty + consumed_qty at all times, and reserved_qty <= on_hand_qty.
    fields:
      - name: funding_grant_id
        type: string
        source: input
        description: "FK -> PartnerGrant.id; the grant must be ACTIVE and must list device_type in allowed_device_types"
      - name: sku
        type: string
        source: input
        description: Manufacturer SKU
      - name: device_type
        type: enum
        source: input
        description: Device family in this lot
        constraints: "one of {SMOKE_10YR, CO_ALARM, COMBO_SMOKE_CO, STROBE_HOH}"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Actual acquisition cost per unit; the ACTUAL_COST reimbursement variant's base
        constraints: ">= 1"
      - name: received_qty
        type: integer
        source: input
        description: Units received; immutable conservation constant of the lot
        constraints: ">= 1"
      - name: on_hand_qty
        type: integer
        source: computed
        description: Units physically still in the lot; initialised to received_qty and decremented only when an installation commits
      - name: reserved_qty
        type: integer
        source: computed
        description: Units held by AlarmInstallation rows in status RESERVED
        default: 0
      - name: consumed_qty
        type: integer
        source: computed
        description: Units permanently issued (installations in status INSTALLED or VERIFIED)
        default: 0
      - name: expiry_date
        type: string
        source: input
        description: Sealed-battery expiry date (YYYY-MM-DD); lots expiring within LOT_MIN_SHELF_DAYS are ineligible for selection
      - name: status
        type: enum
        source: computed
        description: DEPLETED when on_hand_qty == 0, else AVAILABLE
        default: AVAILABLE
        constraints: "one of {AVAILABLE, DEPLETED}"

  - name: AlarmInstallation
    parent: HomeSafetyVisit
    common_fields: true
    description: >
      Junction row binding a visit, a device lot and the installing crew. Reservation holds one
      physical unit and the matching grant money; commitment converts the hold; a void returns both.
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> HomeSafetyVisit.id; the visit must have install_status == SURVEYED and appointment_option != VIRTUAL_ASSESSMENT"
      - name: device_lot_id
        type: string
        source: input
        description: "FK -> DeviceLot.id; nullable in the request - when omitted the server applies the device_lot_selector policy; always populated on the stored row"
        default: null
      - name: device_type
        type: enum
        source: input
        description: Requested device family; MUST equal the resolved DeviceLot.device_type (see validations priority 29)
        constraints: "one of {SMOKE_10YR, CO_ALARM, COMBO_SMOKE_CO, STROBE_HOH}"
      - name: placement_location
        type: enum
        source: input
        description: >
          Where the device was mounted. Persisted rows only ever hold a location allowed for the
          device type; KITCHEN, BATHROOM and GARAGE are recognised request values that are always
          rejected by validation and therefore never persisted.
        constraints: "persisted values: one of {SLEEPING_AREA, HALLWAY_OUTSIDE_SLEEPING, LIVING_LEVEL, BASEMENT_STAIR_TOP}; request may also carry KITCHEN, BATHROOM, GARAGE"
      - name: storey
        type: integer
        source: input
        description: Storey the device was mounted on
        constraints: ">= 1 and <= Household.storeys"
      - name: serial_number
        type: string
        source: input
        description: Device serial recorded at install
        default: null
      - name: installed_by_crew_id
        type: string
        source: system
        description: "FK -> Crew.id; the acting CrrTechnician's X-User-ID at reservation time"
      - name: verified_by_crew_id
        type: string
        source: system
        description: "FK -> Crew.id; nullable; MUST differ from installed_by_crew_id (segregation of duties)"
        default: null
      - name: reserved_cost_cents
        type: integer
        source: computed
        description: Snapshot of DeviceLot.unit_cost_cents at reservation; the amount moved between the grant's money buckets
      - name: reimbursable_cents
        type: integer
        source: computed
        description: Output of calculations.installation_reimbursement, written when a grant report recomputes
        default: null
      - name: status
        type: enum
        source: system
        description: Installation lifecycle state
        default: RESERVED
        constraints: "one of {RESERVED, INSTALLED, VERIFIED, VOIDED}"
      - name: voided_reason
        type: enum
        source: system
        description: Required on void
        default: null
        constraints: "one of {DEVICE_DEFECT, WRONG_PLACEMENT, OCCUPANT_REMOVED, DATA_ENTRY_ERROR}"
      - name: installed_at
        type: datetime
        source: system
        description: Logical-clock instant the reservation committed
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant a second crew verified the placement
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant of the compensating void
        default: null

  - name: Partner
    parent: null
    common_fields: true
    description: Nonprofit, utility, government or faith-based organisation that funds devices and refers households.
    fields:
      - name: org_name
        type: string
        source: input
        description: Organisation name
        constraints: "non-empty"
      - name: org_type
        type: enum
        source: input
        description: Partner category
        constraints: "one of {NONPROFIT, UTILITY, GOVERNMENT, FAITH_BASED}"
      - name: contact_email
        type: string
        source: input
        description: Coordination mailbox
      - name: agreement_signed
        type: boolean
        source: input
        description: Whether a referral/funding agreement is on file; false blocks grant creation
        default: false
      - name: referral_count
        type: integer
        source: computed
        description: Count of Household rows whose referral_partner_id == this.id
        default: 0

  - name: PartnerGrant
    parent: Partner
    common_fields: true
    description: >
      A funding award with a closed date period, an allowed device set and a money ledger whose
      three buckets always sum to authorized_cents.
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the partner must have agreement_signed == true"
      - name: grant_code
        type: string
        source: input
        description: Award identifier
        constraints: "non-empty; globally unique; violation -> ERR_GRANT_CODE_TAKEN"
      - name: authorized_cents
        type: integer
        source: input
        description: Total award; conservation constant of the grant ledger
        constraints: ">= 1"
      - name: period_start_date
        type: string
        source: input
        description: First eligible service date (YYYY-MM-DD), inclusive
      - name: period_end_date
        type: string
        source: input
        description: Last eligible service date (YYYY-MM-DD), inclusive
        constraints: ">= period_start_date"
      - name: allowed_device_types
        type: array
        source: input
        description: Device types this award may fund
        constraints: "non-empty subset of {SMOKE_10YR, CO_ALARM, COMBO_SMOKE_CO, STROBE_HOH}"
      - name: unit_rate_cents_by_type
        type: object
        source: input
        description: Flat reimbursement rate per device type; the UNIT_RATE variant's base
        constraints: "must contain an integer >= 1 for every member of allowed_device_types"
      - name: reimbursement_basis
        type: enum
        source: input
        description: Selects which calculations.installation_reimbursement variant this grant reimburses on
        constraints: "one of {UNIT_RATE, ACTUAL_COST}"
      - name: reimbursement_pct
        type: number
        source: input
        description: Percent of the per-device base the award reimburses
        constraints: "0.0 < x <= 100.0"
      - name: indirect_rate_pct
        type: number
        source: input
        description: Indirect-cost rate applied to direct costs only
        constraints: "0.0 <= x <= 50.0"
      - name: match_pct
        type: number
        source: input
        description: Partner match expressed as a percent of total project cost (direct + indirect)
        constraints: "0.0 <= x <= 50.0"
      - name: reserved_cents
        type: integer
        source: computed
        description: Money held by AlarmInstallation rows in status RESERVED
        default: 0
      - name: committed_cents
        type: integer
        source: computed
        description: Money spent by AlarmInstallation rows in status INSTALLED or VERIFIED
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: authorized_cents - reserved_cents - committed_cents; the conserved residual
      - name: reported_grant_share_cents
        type: integer
        source: computed
        description: Sum of grant_share_cents over ACCEPTED GrantReport rows for this grant
        default: 0
      - name: status
        type: enum
        source: system
        description: Grant lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, CLOSED}"

  - name: GrantReport
    parent: PartnerGrant
    common_fields: true
    description: >
      Period report on installations and outcomes. Cyclic: a RETURN decision sends a SUBMITTED
      report back to DRAFT with revision_no incremented, and it can be submitted again.
    fields:
      - name: grant_id
        type: string
        source: input
        description: "FK -> PartnerGrant.id; the grant must be ACTIVE"
      - name: period_start_date
        type: string
        source: input
        description: First reported service date (YYYY-MM-DD), inclusive
      - name: period_end_date
        type: string
        source: input
        description: Last reported service date (YYYY-MM-DD), inclusive
        constraints: "must lie inside the grant period, inclusive on both ends"
      - name: is_final_report
        type: boolean
        source: input
        description: When true, acceptance closes the grant
        default: false
      - name: revision_no
        type: integer
        source: computed
        description: Incremented by every RETURN decision
        default: 0
      - name: installation_count
        type: integer
        source: computed
        description: Count of reportable installations (status IN {INSTALLED, VERIFIED}, installed_at inside the report period)
        default: 0
      - name: household_count
        type: integer
        source: computed
        description: Distinct households behind installation_count
        default: 0
      - name: reimbursable_total_cents
        type: integer
        source: computed
        description: Round-per-installation-then-sum direct cost, per calculations.installation_reimbursement
        default: 0
      - name: indirect_cents
        type: integer
        source: computed
        description: Indirect cost derived from reimbursable_total_cents only
        default: 0
      - name: total_project_cents
        type: integer
        source: computed
        description: reimbursable_total_cents + indirect_cents
        default: 0
      - name: partner_match_required_cents
        type: integer
        source: computed
        description: Match derived from total_project_cents
        default: 0
      - name: grant_share_cents
        type: integer
        source: computed
        description: total_project_cents - partner_match_required_cents
        default: 0
      - name: served_zone_count
        type: integer
        source: computed
        description: Distinct RiskZone rows behind installation_count
        default: 0
      - name: baseline_fire_rate_per_1000
        type: number
        source: computed
        description: Unit-weighted mean pre-service fire rate over the served zones, 2 decimals
        default: null
      - name: post_fire_rate_per_1000
        type: number
        source: computed
        description: Unit-weighted mean post-service fire rate over the served zones, 2 decimals
        default: null
      - name: injury_delta
        type: integer
        source: computed
        description: Post-window injuries minus baseline-window injuries across the served zones
        default: null
      - name: retention_rate_pct
        type: number
        source: computed
        description: Output of calculations.education_retention_rate over the served zones, null when the eligible set is empty
        default: null
      - name: compiled_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the GrantOfficer that created this report; segregation-of-duties comparand for submit
      - name: submitted_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the GrantOfficer that submitted the current revision
        default: null
      - name: attestation_name
        type: string
        source: system
        description: Name attested at submit
        default: null
      - name: reviewer_note
        type: string
        source: system
        description: Note recorded with the partner decision
        default: null
      - name: last_decision
        type: enum
        source: system
        description: Most recent partner decision
        default: null
        constraints: "one of {ACCEPT, RETURN}"
      - name: status
        type: enum
        source: system
        description: Report lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED}"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the current submission
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent partner decision
        default: null

  - name: EscapePlan
    parent: Household
    common_fields: true
    description: >
      Household escape plan. Cyclic: a follow-up that finds the plan unpracticed or the alarm gone
      lapses it, and the coordinator can re-issue the same plan row.
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; creating a plan supersedes the household's previous non-SUPERSEDED plan"
      - name: primary_exit_per_sleeping_area
        type: boolean
        source: input
        description: Whether every sleeping area has a primary exit documented
      - name: secondary_exit_count
        type: integer
        source: input
        description: Documented secondary exits; must be >= Household.sleeping_areas_count
        constraints: ">= 0"
      - name: meeting_point_description
        type: string
        source: input
        description: Outside meeting point
        constraints: "non-empty"
      - name: drill_scheduled_date
        type: string
        source: input
        description: Planned home drill date (YYYY-MM-DD)
        default: null
      - name: issued_channel
        type: enum
        source: system
        description: How the issued plan was delivered
        default: null
        constraints: "one of {IN_PERSON, MAIL, EMAIL}"
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent issue
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant a follow-up confirmed the plan was practiced
        default: null
      - name: lapsed_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent lapse
        default: null
      - name: lapse_reason
        type: enum
        source: system
        description: Why the plan lapsed
        default: null
        constraints: "one of {ALARM_MISSING_AT_FOLLOW_UP, DRILL_NOT_PRACTICED}"
      - name: reissue_count
        type: integer
        source: computed
        description: Number of LAPSED -> ISSUED transitions this row has made
        default: 0
      - name: status
        type: enum
        source: system
        description: Plan lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, VERIFIED, LAPSED, SUPERSEDED}"

  - name: FollowUpContact
    parent: Household
    common_fields: false
    description: >
      Append-only effectiveness contact. No update endpoint and no version field; a later attempt is
      a new row with the next attempt_no.
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household must be in status IN {VISIT_COMPLETED, REVISIT_REQUIRED}"
      - name: attempt_no
        type: integer
        source: computed
        description: Count of pre-existing FollowUpContact rows for household_id, plus 1
        constraints: ">= 1"
      - name: contact_method
        type: enum
        source: input
        description: How the occupant was contacted
        constraints: "one of {PHONE, DOOR_KNOCK, MAIL, PARTNER_VISIT}"
      - name: outcome
        type: enum
        source: input
        description: Contact result; only the two REACHED_* values enter the retention denominator
        constraints: "one of {REACHED_ALARM_PRESENT, REACHED_ALARM_MISSING, NO_ANSWER, REFUSED}"
      - name: alarms_present_count
        type: integer
        source: input
        description: Working alarms the occupant reported; required when outcome == REACHED_ALARM_PRESENT
        default: null
        constraints: ">= 0"
      - name: plan_practiced
        type: boolean
        source: input
        description: Whether the escape plan drill was practiced; required when outcome == REACHED_ALARM_PRESENT
        default: null
      - name: days_since_visit
        type: integer
        source: computed
        description: Whole days between Household.last_visit_completed_at and the logical clock at creation
      - name: contacted_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the CanvassCoordinator that logged the contact (audit only)

  - name: FireIncident
    parent: RiskZone
    common_fields: false
    description: Append-only structure-fire record used for served-area outcome tracking.
    fields:
      - name: zone_id
        type: string
        source: system
        description: "FK -> RiskZone.id; taken from the path, never from the body"
      - name: incident_number
        type: string
        source: input
        description: Records-management incident number
        constraints: "non-empty; globally unique; violation -> ERR_INCIDENT_NUMBER_TAKEN"
      - name: occurred_at
        type: datetime
        source: input
        description: Alarm time of the incident; window membership is decided on this instant
      - name: injuries
        type: integer
        source: input
        description: Civilian injuries
        default: 0
        constraints: ">= 0"
      - name: fatalities
        type: integer
        source: input
        description: Civilian fatalities
        default: 0
        constraints: ">= 0"
      - name: working_alarm_present
        type: boolean
        source: input
        description: Whether a working alarm operated during the incident

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: RiskZone
    initial_state: UNASSESSED
    terminal_states: []
    note: >
      Deliberately has no terminal state: a post-service follow-up that finds an alarm gone pulls a
      household out of VISIT_COMPLETED, which re-opens a zone that had reached SERVICE_COMPLETE.
    transitions:
      - from: UNASSESSED
        to: ASSESSED
        trigger: "POST /crr/zones/{id}/assessments"
        actor: RiskAnalyst
        preconditions:
          - "zone.zone_kind == LEAF (a DISTRICT zone is never assessed directly)"
          - "expected_zone_version == zone.version"
          - "basis == VALIDATED requires zone.surveyed_units >= 1"
        side_effects:
          - "runs calculations.zone_risk_score under the requested basis and writes zone.risk_score, zone.risk_tier, zone.assessment_basis"
          - "creates a ZoneAssessment row with sequence_no = prior count + 1 and sets zone.current_assessment_id to it"
          - "recomputes calculations.household_priority_band for every Household in the zone"
          - "increments zone.version by 1"
          - "when parent_zone_id != null: the parent district re-runs calculations.district_risk_rollup, which re-writes parent.risk_score / parent.risk_tier and increments parent.version by 1"
      - from: ASSESSED
        to: ASSESSED
        trigger: "POST /crr/zones/{id}/assessments (re-assessment that supersedes the prior run)"
        actor: RiskAnalyst
        preconditions:
          - "zone.zone_kind == LEAF"
          - "expected_zone_version == zone.version"
          - "basis == VALIDATED requires zone.surveyed_units >= 1"
        side_effects:
          - "same side effects as UNASSESSED_to_ASSESSED; the previous ZoneAssessment row is left immutable and merely stops being pointed at by zone.current_assessment_id"
        note: "Self-loop supersede - the reason POST assessments is guarded by OCC on zone.version (see concurrency_rules.zone-assessment-supersede-stale-zone)"
      - from: TARGETED
        to: TARGETED
        trigger: "POST /crr/zones/{id}/assessments"
        actor: RiskAnalyst
        preconditions:
          - "zone.zone_kind == LEAF"
          - "expected_zone_version == zone.version"
        side_effects:
          - "same side effects as ASSESSED_to_ASSESSED; assessment_status is left at TARGETED"
      - from: SERVICE_ACTIVE
        to: SERVICE_ACTIVE
        trigger: "POST /crr/zones/{id}/assessments (typically basis VALIDATED once field data exists)"
        actor: RiskAnalyst
        preconditions:
          - "zone.zone_kind == LEAF"
          - "expected_zone_version == zone.version"
          - "basis == VALIDATED requires zone.surveyed_units >= 1"
        side_effects:
          - "same side effects as ASSESSED_to_ASSESSED; assessment_status is left at SERVICE_ACTIVE"
      - from: ASSESSED
        to: TARGETED
        trigger: "POST /crr/routes (first route created for this zone)"
        actor: system
        preconditions:
          - "zone.risk_tier IN {TIER_1, TIER_2}"
          - "zone.zone_kind == LEAF"
        side_effects:
          - "increments zone.version by 1"
      - from: TARGETED
        to: SERVICE_ACTIVE
        trigger: "POST /crr/visits/{id}/complete (first completion in this zone)"
        actor: system
        preconditions:
          - "zone.service_start_date == null"
        side_effects:
          - "sets zone.service_start_date to the UTC date of the logical clock, anchoring both outcome windows"
          - "increments zone.version by 1"
      - from: SERVICE_ACTIVE
        to: SERVICE_COMPLETE
        trigger: "system, evaluated after every Household status change in the zone"
        actor: system
        preconditions:
          - "the zone has >= 1 Household and every Household in the zone has status IN {VISIT_COMPLETED, REFUSED, NO_CONTACT}"
        side_effects:
          - "increments zone.version by 1"
      - from: SERVICE_COMPLETE
        to: SERVICE_ACTIVE
        trigger: "system, when a Household in the zone leaves VISIT_COMPLETED for REVISIT_REQUIRED"
        actor: system
        preconditions:
          - "at least one Household in the zone has status == REVISIT_REQUIRED"
        side_effects:
          - "increments zone.version by 1"
        note: "Re-open; the compensating counterpart of SERVICE_ACTIVE_to_SERVICE_COMPLETE"

  - entity: Household
    initial_state: INTAKE_QUEUED
    terminal_states: [REFUSED, NO_CONTACT]
    transitions:
      - from: INTAKE_QUEUED
        to: APPOINTMENT_SCHEDULED
        trigger: "POST /crr/visits"
        actor: CanvassCoordinator
        preconditions:
          - "no HomeSafetyVisit for this household has visit_status IN {SCHEDULED, IN_PROGRESS, AWAITING_EDUCATION, AWAITING_INSTALL_OUTCOME}"
        side_effects:
          - "increments household.canvass_attempt_count by 1"
          - "increments route.booked_slot_count by 1"
          - "increments household.version by 1"
      - from: REVISIT_REQUIRED
        to: APPOINTMENT_SCHEDULED
        trigger: "POST /crr/visits (revisit after a failed effectiveness follow-up)"
        actor: CanvassCoordinator
        preconditions:
          - "no HomeSafetyVisit for this household has visit_status IN {SCHEDULED, IN_PROGRESS, AWAITING_EDUCATION, AWAITING_INSTALL_OUTCOME}"
        side_effects:
          - "increments household.canvass_attempt_count by 1"
          - "increments route.booked_slot_count by 1"
          - "increments household.version by 1"
        note: "Closes the revisit cycle VISIT_COMPLETED -> REVISIT_REQUIRED -> APPOINTMENT_SCHEDULED -> VISIT_COMPLETED"
      - from: APPOINTMENT_SCHEDULED
        to: INTAKE_QUEUED
        trigger: "POST /crr/visits/{id}/cancel with cancel_reason IN {RESCHEDULE_REQUESTED, ROUTE_CLOSED}, or the route-close cascade"
        actor: CanvassCoordinator | system
        preconditions:
          - "visit.visit_status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "decrements route.booked_slot_count by 1"
          - "releases every AlarmInstallation on the visit in status RESERVED via the void path"
          - "increments household.version by 1"
        note: "Compensating revert - canvass_attempt_count is NOT decremented, the attempt happened"
      - from: APPOINTMENT_SCHEDULED
        to: REFUSED
        trigger: "POST /crr/visits/{id}/cancel with cancel_reason == OCCUPANT_REFUSED"
        actor: CanvassCoordinator
        preconditions:
          - "visit.visit_status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "decrements route.booked_slot_count by 1"
          - "releases every AlarmInstallation on the visit in status RESERVED via the void path"
          - "increments household.version by 1"
          - "re-evaluates RiskZone SERVICE_ACTIVE_to_SERVICE_COMPLETE for the household's zone"
      - from: APPOINTMENT_SCHEDULED
        to: NO_CONTACT
        trigger: "POST /crr/visits/{id}/cancel with cancel_reason == OCCUPANT_UNREACHABLE"
        actor: CanvassCoordinator
        preconditions:
          - "visit.visit_status IN {SCHEDULED, IN_PROGRESS}"
          - "household.canvass_attempt_count >= 3"
        side_effects:
          - "decrements route.booked_slot_count by 1"
          - "increments household.version by 1"
          - "re-evaluates RiskZone SERVICE_ACTIVE_to_SERVICE_COMPLETE for the household's zone"
        note: "With canvass_attempt_count < 3 the same cancel lands in INTAKE_QUEUED instead"
      - from: APPOINTMENT_SCHEDULED
        to: VISIT_COMPLETED
        trigger: "POST /crr/visits/{id}/complete"
        actor: CrrTechnician
        preconditions:
          - "visit.install_status == SURVEYED"
        side_effects:
          - "sets household.last_visit_completed_at to the logical clock"
          - "increments zone.surveyed_units by 1, and zone.surveyed_units_without_alarm by 1 when visit.pre_existing_working_smoke_alarms == 0"
          - "increments zone.served_household_count by 1"
          - "increments household.version by 1"
      - from: VISIT_COMPLETED
        to: REVISIT_REQUIRED
        trigger: "POST /crr/follow-ups with outcome == REACHED_ALARM_MISSING"
        actor: CanvassCoordinator
        preconditions:
          - "days_since_visit >= FOLLOWUP_MIN_DAYS"
        side_effects:
          - "sets household.alarm_retention_flag = false"
          - "increments household.version by 1"
          - "cascade hop 2: the household's EscapePlan in status IN {ISSUED, VERIFIED} transitions to LAPSED with lapse_reason ALARM_MISSING_AT_FOLLOW_UP"
          - "cascade hop 2: increments zone.post_service_alarm_loss_units by 1 and, when zone.assessment_basis == VALIDATED, re-runs calculations.zone_risk_score and increments zone.version by 1"
          - "cascade hop 3: when the zone's risk_score changed and parent_zone_id != null, the parent district re-runs calculations.district_risk_rollup and increments parent.version by 1"
          - "re-evaluates RiskZone SERVICE_COMPLETE_to_SERVICE_ACTIVE"

  - entity: CanvassRoute
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: PUBLISHED
        trigger: "POST /crr/routes/{id}/publish"
        actor: CanvassCoordinator
        preconditions:
          - "sum of planned_slots over routes with the same zone_id and service_date in status IN {PUBLISHED, IN_PROGRESS, CLOSED}, plus this route's planned_slots, is <= zone.daily_visit_cap"
        side_effects:
          - "increments route.version by 1"
          - "sets zone.assessment_status to TARGETED when it is ASSESSED"
      - from: PUBLISHED
        to: IN_PROGRESS
        trigger: "POST /crr/visits/{id}/arrive (first arrival on this route)"
        actor: system
        preconditions:
          - "route.status == PUBLISHED"
        side_effects:
          - "increments route.version by 1"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /crr/routes/{id}/close"
        actor: CanvassCoordinator
        preconditions: []
        side_effects:
          - "conditional cascade: every HomeSafetyVisit on the route with visit_status IN {SCHEDULED, IN_PROGRESS} is cancelled with cancel_reason ROUTE_CLOSED; visits already COMPLETED or CANCELLED are untouched"
          - "each cascaded cancellation drives its household APPOINTMENT_SCHEDULED -> INTAKE_QUEUED and voids that visit's RESERVED installations"
          - "increments route.version by 1"
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /crr/routes/{id}/close"
        actor: CanvassCoordinator
        preconditions: []
        side_effects:
          - "same conditional cascade as PUBLISHED_to_CLOSED"
          - "increments route.version by 1"

  - entity: HomeSafetyVisit
    state_field: install_status
    initial_state: NOT_STARTED
    terminal_states: [INSTALL_COMPLETE, INSTALL_DEFERRED]
    note: "Axis 1 of 2 on the same row. Advances independently of education_status."
    transitions:
      - from: NOT_STARTED
        to: SURVEYED
        trigger: "POST /crr/visits/{id}/arrive"
        actor: CrrTechnician
        preconditions:
          - "X-User-ID == visit.route.crew_id"
          - "route.status IN {PUBLISHED, IN_PROGRESS}"
          - "visit.cancelled_at == null"
          - "occupant_present == true"
        side_effects:
          - "stores pre_existing_working_smoke_alarms and pre_existing_working_co_alarms on the visit"
          - "drives CanvassRoute PUBLISHED_to_IN_PROGRESS when the route is still PUBLISHED"
          - "increments visit.version by 1"
      - from: SURVEYED
        to: INSTALL_COMPLETE
        trigger: "POST /crr/visits/{id}/complete with install_outcome == COMPLETE"
        actor: CrrTechnician
        preconditions:
          - "X-User-ID == visit.route.crew_id"
          - "calculations.alarm_placement_requirement is satisfied for every device class (else ERR_PLACEMENT_STANDARD_NOT_MET)"
        side_effects:
          - "sets visit.completed_at to the logical clock"
          - "cascade hop 1: every AlarmInstallation on this visit with status RESERVED transitions RESERVED -> INSTALLED"
          - "cascade hop 2: caused by each installation reaching INSTALLED, its DeviceLot decrements reserved_qty by 1, decrements on_hand_qty by 1, increments consumed_qty by 1 and re-derives status"
          - "cascade hop 3: caused by each DeviceLot commit, that lot's PartnerGrant decrements reserved_cents by the installation's reimbursable_cents and increments committed_cents by the same amount, re-deriving available_cents"
          - "cascade hop 4: caused by each PartnerGrant money movement, every GrantReport of that grant in status DRAFT whose period covers the installation's installed_at date re-runs calculations.installation_reimbursement and calculations.grant_cost_share, and increments its version by 1"
          - "drives Household APPOINTMENT_SCHEDULED_to_VISIT_COMPLETED, which itself updates the zone survey counters and may drive RiskZone TARGETED_to_SERVICE_ACTIVE"
          - "increments visit.version by 1"
      - from: SURVEYED
        to: INSTALL_DEFERRED
        trigger: "POST /crr/visits/{id}/complete with install_outcome == DEFERRED"
        actor: CrrTechnician
        preconditions:
          - "X-User-ID == visit.route.crew_id"
          - "deferral_reason is present"
        side_effects:
          - "sets visit.deferral_reason and visit.completed_at"
          - "every AlarmInstallation on this visit still in status RESERVED is voided with voided_reason DATA_ENTRY_ERROR, returning its unit to the lot and its money to the grant"
          - "drives Household APPOINTMENT_SCHEDULED_to_VISIT_COMPLETED (a deferred visit still counts as surveyed)"
          - "increments visit.version by 1"
        note: "Placement standards are NOT enforced on the deferred branch - that is the divergent side-effect set of this fork"

  - entity: HomeSafetyVisit
    state_field: education_status
    initial_state: PENDING
    terminal_states: [DELIVERED, DECLINED]
    note: "Axis 2 of 2 on the same row. May reach a terminal value before or after the install axis."
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /crr/visits/{id}/education with education_outcome == DELIVERED"
        actor: CrrTechnician
        preconditions:
          - "X-User-ID == visit.route.crew_id"
          - "visit.install_status != NOT_STARTED (the crew must have arrived)"
          - "visit.cancelled_at == null"
          - "topics_covered is a non-empty array"
        side_effects:
          - "stores education_topics and escape_plan_walkthrough"
          - "increments visit.version by 1"
      - from: PENDING
        to: DECLINED
        trigger: "POST /crr/visits/{id}/education with education_outcome == DECLINED"
        actor: CrrTechnician
        preconditions:
          - "X-User-ID == visit.route.crew_id"
          - "visit.install_status != NOT_STARTED"
          - "visit.cancelled_at == null"
        side_effects:
          - "increments visit.version by 1"
        note: "topics_covered is ignored on this branch"

  - entity: HomeSafetyVisit
    state_field: visit_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: >
      Derived compound projection of the two axes above; only the cancellation transitions have
      their own trigger. See entities.HomeSafetyVisit.fields.visit_status for the exact evaluation
      order.
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /crr/visits/{id}/cancel"
        actor: CanvassCoordinator | system
        preconditions:
          - "visit.cancelled_at == null"
          - "visit.install_status IN {NOT_STARTED, SURVEYED}"
        side_effects:
          - "sets cancelled_at and cancel_reason"
          - "decrements route.booked_slot_count by 1"
          - "voids every AlarmInstallation on the visit in status RESERVED"
          - "drives the matching Household transition selected by cancel_reason"
          - "increments visit.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /crr/visits/{id}/cancel"
        actor: CanvassCoordinator | system
        preconditions:
          - "visit.cancelled_at == null"
          - "visit.install_status == SURVEYED"
        side_effects:
          - "same side effects as SCHEDULED_to_CANCELLED"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /crr/visits/{id}/reschedule"
        actor: CanvassCoordinator
        preconditions:
          - "visit.install_status == NOT_STARTED"
          - "visit.cancelled_at == null"
          - "the new route/start passes every rule POST /crr/visits enforces"
        side_effects:
          - "re-runs calculations.visit_demand_minutes against the new route's zone tier and rewrites demand_minutes and scheduled_end_utc"
          - "decrements the old route's booked_slot_count by 1 and increments the new route's by 1 when the route changed"
          - "increments visit.version by 1"
        note: "Self-loop; household status is unchanged"
      - from: AWAITING_EDUCATION
        to: COMPLETED
        trigger: "POST /crr/visits/{id}/education (install axis already terminal)"
        actor: CrrTechnician
        preconditions:
          - "install_status IN {INSTALL_COMPLETE, INSTALL_DEFERRED} and education_status == PENDING"
        side_effects:
          - "derived only; no additional writes beyond the education axis transition"
      - from: AWAITING_INSTALL_OUTCOME
        to: COMPLETED
        trigger: "POST /crr/visits/{id}/complete (education axis already terminal)"
        actor: CrrTechnician
        preconditions:
          - "install_status == SURVEYED and education_status IN {DELIVERED, DECLINED}"
        side_effects:
          - "derived only; no additional writes beyond the install axis transition"

  - entity: AlarmInstallation
    initial_state: RESERVED
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: RESERVED
        to: INSTALLED
        trigger: "POST /crr/visits/{id}/complete with install_outcome == COMPLETE (cascade hop 1)"
        actor: system
        preconditions:
          - "the parent visit's install axis is making the SURVEYED -> INSTALL_COMPLETE transition"
        side_effects:
          - "sets installed_at to the logical clock"
          - "triggers the DeviceLot unit commit, which in turn triggers the PartnerGrant money commit, which in turn triggers the DRAFT GrantReport recompute"
          - "increments installation.version by 1"
      - from: INSTALLED
        to: VERIFIED
        trigger: "POST /crr/installations/{id}/verify"
        actor: CrrTechnician
        preconditions:
          - "X-User-ID != installation.installed_by_crew_id (segregation of duties)"
          - "the acting Crew has status == ACTIVE"
        side_effects:
          - "sets verified_by_crew_id to X-User-ID and verified_at to the logical clock"
          - "increments installation.version by 1"
        note: "No money or unit movement - the device is already committed"
      - from: RESERVED
        to: VOIDED
        trigger: "POST /crr/installations/{id}/void, or the visit-cancel / deferral cascade"
        actor: CrrTechnician | GrantOfficer | system
        preconditions:
          - "voided_reason is present"
        side_effects:
          - "sets voided_at and voided_reason"
          - "decrements DeviceLot.reserved_qty by 1 and re-derives DeviceLot.status"
          - "decrements PartnerGrant.reserved_cents by reimbursable_cents and increments available_cents by the same amount"
          - "increments installation.version by 1"
      - from: INSTALLED
        to: VOIDED
        trigger: "POST /crr/installations/{id}/void"
        actor: CrrTechnician | GrantOfficer
        preconditions:
          - "voided_reason is present"
          - "no ACCEPTED GrantReport already reports this installation (else ERR_INSTALLATION_ALREADY_REPORTED)"
        side_effects:
          - "sets voided_at and voided_reason"
          - "increments DeviceLot.on_hand_qty by 1 and decrements DeviceLot.consumed_qty by 1, re-deriving status"
          - "decrements PartnerGrant.committed_cents by reimbursable_cents and increments available_cents by the same amount"
          - "every DRAFT GrantReport whose period covers installed_at re-runs calculations.installation_reimbursement and calculations.grant_cost_share and increments its version by 1"
          - "increments installation.version by 1"
        note: "Compensating action for the RESERVED_to_INSTALLED commit; leaves both conserved quantities exactly as they were before reservation"

  - entity: PartnerGrant
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /crr/grants/{id}/activate"
        actor: GrantOfficer
        preconditions:
          - "grant.authorized_cents >= 1"
          - "partner.agreement_signed == true"
          - "no other PartnerGrant of the same partner in status IN {ACTIVE, CLOSED} shares a device type with this grant over an overlapping closed date period"
        side_effects:
          - "increments grant.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /crr/grant-reports/{id}/decision with decision == ACCEPT on a report whose is_final_report == true"
        actor: system
        preconditions:
          - "grant.reserved_cents == 0 (no outstanding device holds)"
        side_effects:
          - "increments grant.version by 1"
        note: "There is no manual close endpoint; a grant closes only through acceptance of its final report"

  - entity: GrantReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    note: "Cyclic: SUBMITTED -> DRAFT (on RETURN) -> SUBMITTED, any number of times."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /crr/grant-reports/{id}/submit"
        actor: GrantOfficer
        preconditions:
          - "X-User-ID != report.compiled_by_user_id (segregation of duties)"
          - "grant.status == ACTIVE"
          - "installation_count >= 1 after the pre-submit recompute"
          - "grant_share_cents <= grant.authorized_cents - grant.reported_grant_share_cents"
        side_effects:
          - "re-runs calculations.installation_reimbursement, calculations.grant_cost_share, calculations.zone_outcome_delta and calculations.education_retention_rate and writes every derived metric field"
          - "sets submitted_by_user_id, attestation_name and submitted_at"
          - "increments report.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /crr/grant-reports/{id}/decision with decision == ACCEPT"
        actor: PartnerLiaison
        preconditions:
          - "X-User-ID == grant.partner_id"
        side_effects:
          - "sets last_decision = ACCEPT, reviewer_note and decided_at"
          - "increments grant.reported_grant_share_cents by report.grant_share_cents and increments grant.version by 1"
          - "when report.is_final_report == true, drives PartnerGrant ACTIVE_to_CLOSED"
          - "increments report.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /crr/grant-reports/{id}/decision with decision == RETURN"
        actor: PartnerLiaison
        preconditions:
          - "X-User-ID == grant.partner_id"
          - "reviewer_note is present"
        side_effects:
          - "sets last_decision = RETURN, reviewer_note and decided_at"
          - "increments revision_no by 1 and clears submitted_by_user_id, attestation_name and submitted_at"
          - "increments report.version by 1"
        note: "Closes the revision cycle; the same report row can be submitted again by any GrantOfficer whose id differs from compiled_by_user_id"

  - entity: EscapePlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Cyclic: ISSUED/VERIFIED -> LAPSED -> ISSUED, any number of times."
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /crr/escape-plans/{id}/issue"
        actor: CanvassCoordinator
        preconditions:
          - "household.status IN {VISIT_COMPLETED, REVISIT_REQUIRED, APPOINTMENT_SCHEDULED}"
        side_effects:
          - "sets issued_channel and issued_at"
          - "increments plan.version by 1"
      - from: LAPSED
        to: ISSUED
        trigger: "POST /crr/escape-plans/{id}/issue (re-issue after a lapse)"
        actor: CanvassCoordinator
        preconditions:
          - "household.status IN {VISIT_COMPLETED, REVISIT_REQUIRED, APPOINTMENT_SCHEDULED}"
        side_effects:
          - "sets issued_channel and issued_at, clears lapsed_at and lapse_reason"
          - "increments reissue_count by 1"
          - "increments plan.version by 1"
      - from: ISSUED
        to: VERIFIED
        trigger: "POST /crr/follow-ups with outcome == REACHED_ALARM_PRESENT and plan_practiced == true"
        actor: system
        preconditions:
          - "the contact's household owns this plan and the plan is the household's non-SUPERSEDED plan"
        side_effects:
          - "sets verified_at to the logical clock"
          - "increments plan.version by 1"
      - from: ISSUED
        to: LAPSED
        trigger: "POST /crr/follow-ups with outcome == REACHED_ALARM_PRESENT and plan_practiced == false"
        actor: system
        preconditions:
          - "the contact's household owns this plan and the plan is the household's non-SUPERSEDED plan"
        side_effects:
          - "sets lapsed_at and lapse_reason = DRILL_NOT_PRACTICED"
          - "increments plan.version by 1"
      - from: VERIFIED
        to: LAPSED
        trigger: "POST /crr/follow-ups with outcome == REACHED_ALARM_MISSING (cascade hop 2 of the follow-up chain)"
        actor: system
        preconditions:
          - "the contact's household owns this plan and the plan is the household's non-SUPERSEDED plan"
        side_effects:
          - "sets lapsed_at and lapse_reason = ALARM_MISSING_AT_FOLLOW_UP"
          - "increments plan.version by 1"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /crr/escape-plans (a newer plan is created for the same household)"
        actor: system
        preconditions:
          - "expected_household_version == household.version on the creating request"
        side_effects:
          - "increments plan.version by 1"
          - "increments household.version by 1"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "POST /crr/escape-plans (a newer plan is created for the same household)"
        actor: system
        preconditions:
          - "expected_household_version == household.version on the creating request"
        side_effects:
          - "increments plan.version by 1"
          - "increments household.version by 1"
      - from: LAPSED
        to: SUPERSEDED
        trigger: "POST /crr/escape-plans (a newer plan is created for the same household)"
        actor: system
        preconditions:
          - "expected_household_version == household.version on the creating request"
        side_effects:
          - "increments plan.version by 1"
          - "increments household.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /crr/escape-plans (a newer plan is created for the same household)"
        actor: system
        preconditions:
          - "expected_household_version == household.version on the creating request"
        side_effects:
          - "increments plan.version by 1"
          - "increments household.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: zone-assessment-supersede-stale-zone
    parent_entity: RiskZone
    write_endpoint: "POST /crr/zones/{id}/assessments"
    occ_field: "expected_zone_version"
    description: |
      Creating a ZoneAssessment against a RiskZone whose version has advanced since the client last
      read it is rejected. Assessment creation is a legitimate supersede - a second create with a
      current version would succeed and simply move current_assessment_id forward - so the stale
      version is the only signal that the analyst scored the zone against inputs, survey counters or
      a risk tier that no longer hold.
    error_id: ERR_STALE_ZONE_VERSION
    http_status: 412
  - rule_id: escape-plan-supersede-stale-household
    parent_entity: Household
    write_endpoint: "POST /crr/escape-plans"
    occ_field: "expected_household_version"
    description: |
      Creating an EscapePlan against a Household whose version has advanced since the client last
      read it is rejected. Plan creation legitimately supersedes the household's prior plan, so a
      second create with a current version would succeed; the stale version means the plan was
      drafted against sleeping-area, occupant or retention data the household no longer carries.
    error_id: ERR_STALE_HOUSEHOLD_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: zone_risk_score
    trigger: >
      POST /crr/zones/{id}/assessments (every UNASSESSED_to_ASSESSED, ASSESSED_to_ASSESSED,
      TARGETED_to_TARGETED and SERVICE_ACTIVE_to_SERVICE_ACTIVE transition); and re-run by the
      follow-up cascade hop 2 when zone.assessment_basis == VALIDATED.
    algorithm: weighted_scoring
    formula: |
      # every intermediate is rounded exactly where shown; no other rounding is permitted
      incident_density_per_1000 = round_half_up(structure_fire_count_5yr * 1000.0 / occupied_units, 4)
      injury_density_per_1000   = round_half_up(fire_injury_count_5yr    * 1000.0 / occupied_units, 4)

      incident_points      = min(40.0, round_half_up(incident_density_per_1000 * 4.0, 2))
      injury_points        = min(15.0, round_half_up(injury_density_per_1000  * 10.0, 2))
      building_points      = round_half_up(0.15 * pre_1980_unit_pct, 2)
      vulnerability_points = min(20.0, round_half_up(0.12 * senior_household_pct
                                                   + 0.10 * under5_household_pct
                                                   + 0.08 * disability_household_pct, 2))
      alarm_points         = min(10.0, round_half_up(0.10 * alarm_gap_pct, 2))

      risk_score = round_half_up(incident_points + injury_points + building_points
                                 + vulnerability_points + alarm_points, 2)

      # tier table - the lower bound is INCLUSIVE, the upper bound EXCLUSIVE
      risk_tier = TIER_1 if risk_score >= 70.00
                  TIER_2 if 45.00 <= risk_score < 70.00
                  TIER_3 if risk_score < 45.00
    input_set: >
      Exactly one RiskZone row with zone_kind == LEAF. alarm_gap_pct comes from the variant below.
      Districts never enter this calculation; they use district_risk_rollup.
    constants:
      INCIDENT_POINTS_PER_UNIT_DENSITY: 4.0
      INCIDENT_POINTS_CAP: 40.0
      INJURY_POINTS_PER_UNIT_DENSITY: 10.0
      INJURY_POINTS_CAP: 15.0
      BUILDING_POINTS_WEIGHT: 0.15
      SENIOR_WEIGHT: 0.12
      UNDER5_WEIGHT: 0.10
      DISABILITY_WEIGHT: 0.08
      VULNERABILITY_POINTS_CAP: 20.0
      ALARM_POINTS_WEIGHT: 0.10
      ALARM_POINTS_CAP: 10.0
      TIER_1_MIN_SCORE: 70.00
      TIER_2_MIN_SCORE: 45.00
    precision: "risk_score and every *_points field: 2 decimals, round_half_up; the two density fields: 4 decimals, round_half_up"
    variants:
      - name: PROVISIONAL_DEMOGRAPHIC
        when: "request basis == PROVISIONAL"
        difference: "alarm_gap_pct = zone.assumed_alarm_absence_pct (the census/pre-survey estimate); zone.surveyed_units is ignored entirely"
      - name: VALIDATED_FIELD
        when: "request basis == VALIDATED; requires zone.surveyed_units >= 1 else ERR_INSUFFICIENT_FIELD_DATA"
        difference: |
          alarm_gap_pct = min(100.00, round_half_up(100.0 *
                             (surveyed_units_without_alarm + post_service_alarm_loss_units)
                             / surveyed_units, 2))
          The two variants therefore produce different risk_score values - and can produce different
          risk_tier values - from the same RiskZone row on the same logical clock.

  - name: district_risk_rollup
    trigger: >
      Cascade from any child zone whose risk_score changed (assessment run, or the follow-up cascade
      hop 3), and from POST /crr/zones when a child is created under a zone that flips LEAF -> DISTRICT.
    algorithm: aggregation
    formula: |
      children = RiskZone rows where parent_zone_id == district.id and risk_score != null
      if children is empty:
          district.risk_score = null; district.risk_tier = null
      else:
          numerator   = sum over children, ordered by created_at ASC, of (child.risk_score * child.occupied_units)   # full precision, no intermediate rounding
          denominator = sum over children of child.occupied_units
          district.risk_score = round_half_up(numerator / denominator, 2)
          district.risk_tier  = the zone_risk_score tier table applied to district.risk_score
    input_set: "Direct children only (one level; deeper nesting is rejected by ERR_ZONE_NESTING_DEPTH). Children with risk_score == null are excluded from BOTH sums."
    constants:
      ROLLUP_MAX_DEPTH: 1
    precision: "2 decimals, round_half_up, applied once at the end - never to the per-child products"

  - name: household_priority_band
    trigger: "POST /crr/households, and re-run for every household in a zone whenever that zone's risk_tier changes"
    algorithm: threshold
    formula: |
      vulnerable = (adults_65plus > 0) or (children_under5 > 0)
                   or (mobility_impaired_occupants > 0) or (hearing_impaired_occupants > 0)
      priority_band = P1_HIGH_RISK if (vulnerable and zone.risk_tier == TIER_1)
                      P2_ELEVATED  if (vulnerable and zone.risk_tier == TIER_2)
                                    or ((not vulnerable) and zone.risk_tier == TIER_1)
                      P3_STANDARD  otherwise (this includes zone.risk_tier == null and TIER_3)
    input_set: "The household row plus its own zone's current risk_tier. Never the district's tier."
    constants: {}
    precision: "exact enum, no arithmetic"

  - name: visit_demand_minutes
    trigger: "POST /crr/visits and POST /crr/visits/{id}/reschedule"
    algorithm: weighted_scoring
    formula: |
      sleeping_adj      = 5 * max(0, household.sleeping_areas_count - 1)
      storey_adj        = 5 * max(0, household.storeys - 1)
      accessibility_adj = 15 if (household.mobility_impaired_occupants > 0
                                 or household.hearing_impaired_occupants > 0) else 0
      age_adj           = (10 if household.children_under5 > 0 else 0)
                          + (10 if household.adults_65plus > 0 else 0)
      vulnerability_adj = max(accessibility_adj, age_adj)        # NOT a sum - the larger wins
      tier_multiplier   = 1.25 if route_zone.risk_tier == TIER_1
                          1.10 if route_zone.risk_tier == TIER_2
                          1.00 otherwise
      raw_minutes       = (BASE_VISIT_MINUTES + sleeping_adj + storey_adj + vulnerability_adj)
                          * tier_multiplier
      demand_minutes    = min(VISIT_MAX_MINUTES,
                              max(VISIT_MIN_MINUTES, 5 * ceil(raw_minutes / 5.0)))
      scheduled_end_utc = scheduled_start_utc + demand_minutes minutes
    input_set: "The household row and the risk_tier of the route's zone at the moment of the call. A later re-tiering of the zone does NOT retroactively change an existing visit's demand_minutes."
    constants:
      BASE_VISIT_MINUTES: 30
      SLEEPING_AREA_MINUTES: 5
      STOREY_MINUTES: 5
      ACCESSIBILITY_MINUTES: 15
      CHILD_MINUTES: 10
      SENIOR_MINUTES: 10
      TIER_1_MULTIPLIER: 1.25
      TIER_2_MULTIPLIER: 1.10
      GRID_MINUTES: 5
      VISIT_MIN_MINUTES: 30
      VISIT_MAX_MINUTES: 120
    precision: "whole minutes; the 5-minute grid is reached with ceil (round UP), never round-half"

  - name: crew_calendar_occupation
    trigger: "POST /crr/visits and POST /crr/visits/{id}/reschedule, before any fiscal or slot check"
    algorithm: interval_merge
    formula: |
      # a visit's own interval is HALF-OPEN: [scheduled_start_utc, scheduled_end_utc)
      buffer_minutes(candidate, existing) = TRAVEL_BUFFER_SAME_ROUTE_MINUTES
                                              if candidate.route_id == existing.route_id
                                            else TRAVEL_BUFFER_CROSS_ROUTE_MINUTES
      conflict(candidate, existing) iff
            candidate.scheduled_start_utc < existing.scheduled_end_utc  + buffer_minutes
        and existing.scheduled_start_utc  < candidate.scheduled_end_utc + buffer_minutes
      # touching exactly at the buffer edge is NOT a conflict:
      #   candidate.start == existing.end + buffer  ->  allowed
      #   candidate.start == existing.end + buffer - 1 minute -> ERR_CREW_INTERVAL_CONFLICT
      daily_minutes(crew, service_date) =
            sum of demand_minutes over the candidate set below, plus the candidate's own demand_minutes
      daily_minutes must be <= crew.max_daily_minutes else ERR_CREW_DAILY_MINUTES_EXCEEDED
    input_set: >
      existing candidates = HomeSafetyVisit rows where occupies_crew_calendar == true,
      visit_status != CANCELLED, the visit's route.crew_id == the candidate route's crew_id, the
      visit's route.service_date == the candidate route's service_date, and the row is not the visit
      being rescheduled. Rows with appointment_option == VIRTUAL_ASSESSMENT are excluded from both
      the interval check and the daily-minutes sum.
    constants:
      TRAVEL_BUFFER_SAME_ROUTE_MINUTES: 5
      TRAVEL_BUFFER_CROSS_ROUTE_MINUTES: 15
    precision: "whole minutes; comparisons are on UTC instants with millisecond resolution"

  - name: alarm_placement_requirement
    trigger: "POST /crr/households (writes the three required_* fields); enforced on POST /crr/installations and on POST /crr/visits/{id}/complete with install_outcome == COMPLETE"
    algorithm: threshold
    formula: |
      required_smoke_devices  = sleeping_areas_count + storeys
      required_co_devices     = 1 if (fuel_burning_appliance or attached_garage) else 0
      required_strobe_devices = 1 if hearing_impaired_occupants > 0 else 0

      # coverage counted at completion time
      smoke_coverage  = visit.pre_existing_working_smoke_alarms
                        + count(installations on the visit with status IN {RESERVED, INSTALLED, VERIFIED}
                                and device_type IN {SMOKE_10YR, COMBO_SMOKE_CO})
      co_coverage     = visit.pre_existing_working_co_alarms
                        + count(... and device_type IN {CO_ALARM, COMBO_SMOKE_CO})
      strobe_coverage = count(... and device_type == STROBE_HOH)

      satisfied iff smoke_coverage  >= required_smoke_devices
                and co_coverage     >= required_co_devices
                and strobe_coverage >= required_strobe_devices

      # placement table, enforced per installation at reservation time
      ALWAYS_FORBIDDEN = {KITCHEN, BATHROOM, GARAGE}          -> ERR_PLACEMENT_LOCATION_FORBIDDEN
      SMOKE_10YR     allows {SLEEPING_AREA, HALLWAY_OUTSIDE_SLEEPING, LIVING_LEVEL, BASEMENT_STAIR_TOP}
      CO_ALARM       allows {HALLWAY_OUTSIDE_SLEEPING, LIVING_LEVEL, BASEMENT_STAIR_TOP}
      COMBO_SMOKE_CO allows {HALLWAY_OUTSIDE_SLEEPING, LIVING_LEVEL}
      STROBE_HOH     allows {SLEEPING_AREA}
      anything else  -> ERR_PLACEMENT_TYPE_LOCATION_MISMATCH
      # uniqueness: at most one non-VOIDED installation per (visit_id, device_type, placement_location, storey)
      #             -> ERR_DUPLICATE_PLACEMENT
    input_set: "The household row for the requirements; non-VOIDED installations of the visit under completion for the coverage counts. Installations on other visits of the same household do NOT count."
    constants:
      SMOKE_DEVICE_TYPES: [SMOKE_10YR, COMBO_SMOKE_CO]
      CO_DEVICE_TYPES: [CO_ALARM, COMBO_SMOKE_CO]
      STROBE_DEVICE_TYPES: [STROBE_HOH]
    precision: "integer counts; comparisons are >= (meeting the requirement exactly is satisfied)"

  - name: device_lot_selector
    trigger: "POST /crr/installations when the request omits device_lot_id"
    algorithm: waterfall_allocation
    formula: |
      # (a) eligibility filter - an explicit predicate, no fuzzy adjectives
      candidates = DeviceLot rows where
            lot.device_type == request.device_type
        and lot.status == AVAILABLE
        and (lot.on_hand_qty - lot.reserved_qty) >= 1
        and date(lot.expiry_date) >= date(clock_now) + LOT_MIN_SHELF_DAYS days
        and lot.funding_grant.status == ACTIVE
        and request.device_type IN lot.funding_grant.allowed_device_types
        and date(lot.funding_grant.period_start_date) <= date(clock_now) <= date(lot.funding_grant.period_end_date)
        and lot.funding_grant.available_cents >= lot.unit_cost_cents
      # (b) ranking expression - FIFO on shelf life, then cheapest
      order by lot.expiry_date ASC, lot.unit_cost_cents ASC
      # (c) tie-break when the ranking expression ties
      then by lot.created_at ASC          # NEVER lot.id
      # (d) empty candidate set
      if candidates is empty -> ERR_NO_ELIGIBLE_DEVICE_LOT (422)
      selected = first row after ordering
    input_set: "Every DeviceLot in the system of the requested device_type; the selector is not scoped to any zone or route."
    constants:
      LOT_MIN_SHELF_DAYS: 90
    precision: "exact selection; expiry_date compared as a calendar date, created_at as a millisecond UTC instant"

  - name: installation_reimbursement
    trigger: >
      POST /crr/grant-reports (compile), POST /crr/grant-reports/{id}/submit (full recompute), and the
      DRAFT-report recompute cascade fired by any AlarmInstallation reaching INSTALLED or leaving
      INSTALLED for VOIDED.
    algorithm: tiered_pricing
    formula: |
      # ---- per installation ----------------------------------------------------
      base_cents = grant.unit_rate_cents_by_type[installation.device_type]        # UNIT_RATE variant
                   OR installation.reserved_cost_cents + LABOR_ALLOCATION_CENTS_PER_DEVICE
                                                                                  # ACTUAL_COST variant
      installation.reimbursable_cents = round_half_up(base_cents * grant.reimbursement_pct / 100.0)
      # ---- report total: ROUNDING ORDER IS PINNED ------------------------------
      # round EACH installation to whole cents FIRST, then sum the rounded values.
      report.reimbursable_total_cents =
          sum over the reportable set, ordered by installed_at ASC then created_at ASC,
          of installation.reimbursable_cents
      # The alternative order - sum the unrounded products and round once - produces a DIFFERENT
      # total (e.g. 2 x SMOKE_10YR + 1 x CO_ALARM at 87.5% of 2195/2195/3495 gives 6900 with the
      # pinned order and 6899 with the alternative). Only the pinned order is correct.
      report.installation_count = size of the reportable set
      report.household_count    = distinct visit.household_id over the reportable set
      report.served_zone_count  = distinct household.zone_id over the reportable set
    input_set: >
      reportable set = AlarmInstallation rows where installation.device_lot.funding_grant_id ==
      report.grant_id, installation.status IN {INSTALLED, VERIFIED} (VOIDED and RESERVED are
      excluded), and date(installation.installed_at) BETWEEN report.period_start_date AND
      report.period_end_date, both bounds INCLUSIVE.
    constants:
      LABOR_ALLOCATION_CENTS_PER_DEVICE: 740
    precision: "whole cents, round_half_up, applied per installation before summing"
    variants:
      - name: UNIT_RATE
        when: "grant.reimbursement_basis == UNIT_RATE"
        difference: "base_cents is the grant's flat unit_rate_cents_by_type entry for the device type; the lot's real acquisition cost and the labour allocation are both ignored"
      - name: ACTUAL_COST
        when: "grant.reimbursement_basis == ACTUAL_COST"
        difference: >
          base_cents is the installation's own reserved_cost_cents (the lot unit cost snapshot) plus
          LABOR_ALLOCATION_CENTS_PER_DEVICE. The same three installations therefore reimburse 6900
          cents under UNIT_RATE and 7796 cents under ACTUAL_COST for the worked example above.

  - name: grant_cost_share
    trigger: "POST /crr/grant-reports (compile), POST /crr/grant-reports/{id}/submit, and every DRAFT-report recompute cascade, immediately after installation_reimbursement"
    algorithm: constraint_propagation
    formula: |
      # The prose "the partner match is match_pct of total project cost, and total project cost is
      # direct plus indirect plus match" is circular. The evaluation order below is PINNED and is the
      # only correct one:
      #   step 1 - direct comes from installation_reimbursement
      #   step 2 - indirect is a percentage of DIRECT ONLY (never of total_project_cents)
      #   step 3 - total_project is direct + indirect (the match is NOT part of it)
      #   step 4 - the match is a percentage of TOTAL_PROJECT (direct + indirect)
      #   step 5 - the grant share is the residual, never recomputed from a percentage
      direct_cents                 = report.reimbursable_total_cents
      indirect_cents               = round_half_up(direct_cents * grant.indirect_rate_pct / 100.0)
      total_project_cents          = direct_cents + indirect_cents
      partner_match_required_cents = round_half_up(total_project_cents * grant.match_pct / 100.0)
      grant_share_cents            = total_project_cents - partner_match_required_cents
      # fiscal gate applied at submit only:
      #   grant_share_cents <= grant.authorized_cents - grant.reported_grant_share_cents
      #   else ERR_GRANT_SHARE_EXCEEDS_AUTHORIZED
    input_set: "One GrantReport plus its grant's three rate fields. No other report of the same grant enters the arithmetic; already-accepted reports enter only through grant.reported_grant_share_cents."
    constants: {}
    precision: "whole cents, round_half_up at step 2 and step 4; step 5 is exact integer subtraction"

  - name: zone_outcome_delta
    trigger: "GET /crr/zones/{id}/outcome-summary, and POST /crr/grant-reports/{id}/submit for every zone in the report's served set"
    algorithm: chronological
    formula: |
      if zone.service_start_date == null:
          every field below is null
      anchor          = zone.service_start_date at 00:00:00.000Z
      baseline_window = [anchor - OUTCOME_WINDOW_DAYS days, anchor)                       # half-open
      post_window     = [anchor, min(clock_now, anchor + OUTCOME_WINDOW_DAYS days))        # half-open
      # an incident whose occurred_at equals anchor exactly belongs to POST, never to baseline
      baseline_fire_count = count(FireIncident with zone_id == zone.id and occurred_at in baseline_window)
      post_fire_count     = count(FireIncident with zone_id == zone.id and occurred_at in post_window)
      baseline_injuries   = sum(injuries over the baseline_window rows)
      post_injuries       = sum(injuries over the post_window rows)
      baseline_fire_rate_per_1000 = round_half_up(baseline_fire_count * 1000.0 / zone.occupied_units, 2)
      post_fire_rate_per_1000     = round_half_up(post_fire_count     * 1000.0 / zone.occupied_units, 2)
      injury_delta = post_injuries - baseline_injuries
      rate_delta_pct = null if baseline_fire_rate_per_1000 == 0.00
                       else round_half_up(100.0 * (post_fire_rate_per_1000 - baseline_fire_rate_per_1000)
                                          / baseline_fire_rate_per_1000, 2)
      # report-level rollup over the served zones, weighted by occupied_units:
      report.baseline_fire_rate_per_1000 = round_half_up(
          sum(zone.baseline_fire_rate_per_1000 * zone.occupied_units) / sum(zone.occupied_units), 2)
      report.post_fire_rate_per_1000     = same shape on the post rates
      report.injury_delta                = sum of the per-zone injury_delta values
    input_set: >
      FireIncident rows of the zone only, selected purely on occurred_at window membership -
      working_alarm_present is reported but never filters the set. Zones whose service_start_date is
      null are excluded from the report-level rollup on both sides.
    constants:
      OUTCOME_WINDOW_DAYS: 365
    precision: "rates 2 decimals round_half_up; counts and injury_delta exact integers (injury_delta may be negative)"

  - name: education_retention_rate
    trigger: "GET /crr/zones/{id}/outcome-summary, and POST /crr/grant-reports/{id}/submit over the report's served zones"
    algorithm: aggregation
    formula: |
      for each Household in scope with status IN {VISIT_COMPLETED, REVISIT_REQUIRED}:
          eligible_rows = FollowUpContact rows of that household whose outcome IN
                          {REACHED_ALARM_PRESENT, REACHED_ALARM_MISSING}
          if eligible_rows is empty: the household contributes NOTHING to either side
          else: the household contributes exactly the row with the greatest attempt_no
                (attempt_no is unique per household, so no tie-break is reachable)
      eligible_count = number of contributing households
      present_count  = contributing households whose selected row has outcome == REACHED_ALARM_PRESENT
      retention_rate_pct = null if eligible_count == 0
                           else round_half_up(100.0 * present_count / eligible_count, 2)
    input_set: >
      Households of the zone (outcome-summary) or of every served zone of the report (submit).
      Contacts with outcome IN {NO_ANSWER, REFUSED} are excluded from the selection entirely - a
      household whose only contacts are NO_ANSWER contributes nothing and does NOT count as a loss.
    constants: {}
    precision: "2 decimals, round_half_up; the empty-set result is null, never 0.00"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every id in the path exists, validated left to right"
    error_id: "ERR_ZONE_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_INSTALLATION_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 4
    category: business_constraint
    check: "request body carries every required field, every value has the declared type, every enum value is a declared member, every numeric constraint in section 1.1 holds, and pagination limit/offset are in range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 5
    category: existence
    check: "every id referenced from the request body exists"
    error_id: "ERR_ZONE_NOT_FOUND | ERR_HOUSEHOLD_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_CREW_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_GRANT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /crr/zones, POST /crr/households, POST /crr/routes, POST /crr/visits, POST /crr/installations, POST /crr/device-lots, POST /crr/grants, POST /crr/grant-reports, POST /crr/escape-plans, POST /crr/follow-ups"
  - priority: 6
    category: auth
    check: "entity-backed identity: a CrrTechnician's X-User-ID equals the crew_id of the visit's route; a PartnerLiaison's X-User-ID equals the grant's partner_id"
    error_id: "ERR_CREW_NOT_ASSIGNED | ERR_PARTNER_NOT_OWNER"
    http_status: 403
    applies_to: "POST /crr/visits/{id}/arrive, POST /crr/visits/{id}/education, POST /crr/visits/{id}/complete, POST /crr/installations, POST /crr/grant-reports/{id}/decision"
  - priority: 7
    category: business_constraint
    check: "segregation of duties: the verifying crew differs from installed_by_crew_id; the submitting GrantOfficer's X-User-ID differs from report.compiled_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /crr/installations/{id}/verify, POST /crr/grant-reports/{id}/submit"
  - priority: 8
    category: state
    check: "optimistic concurrency: expected_zone_version == zone.version, expected_household_version == household.version"
    error_id: "ERR_STALE_ZONE_VERSION | ERR_STALE_HOUSEHOLD_VERSION"
    http_status: 412
    applies_to: "POST /crr/zones/{id}/assessments, POST /crr/escape-plans"
  - priority: 9
    category: state
    check: "the target resource is in a state that permits the operation, per the section 1.2 transition table"
    error_id: "ERR_INVALID_VISIT_STATE | ERR_INVALID_HOUSEHOLD_STATE | ERR_ROUTE_NOT_OPEN | ERR_ZONE_NOT_ASSESSABLE | ERR_REPORT_NOT_EDITABLE | ERR_INSTALLATION_NOT_VOIDABLE | ERR_PLAN_NOT_REISSUABLE | ERR_GRANT_NOT_DRAFT"
    http_status: 409
    applies_to: "every state-transition endpoint"
  - priority: 10
    category: state
    check: "cross-entity state gate: the referenced parent of a different aggregate is in a permitting state (route PUBLISHED/IN_PROGRESS for visit work; grant ACTIVE for lots, installations and reports; zone risk_tier IN {TIER_1, TIER_2} for routing)"
    error_id: "ERR_ROUTE_NOT_OPEN | ERR_GRANT_NOT_ACTIVE | ERR_ZONE_NOT_TARGETABLE"
    http_status: 409
    applies_to: "POST /crr/routes, POST /crr/visits, POST /crr/visits/{id}/arrive, POST /crr/installations, POST /crr/device-lots, POST /crr/grant-reports, POST /crr/grant-reports/{id}/submit"
  - priority: 11
    category: business_safety
    check: "placement_location is not in {KITCHEN, BATHROOM, GARAGE}"
    error_id: ERR_PLACEMENT_LOCATION_FORBIDDEN
    http_status: 422
    applies_to: "POST /crr/installations"
  - priority: 12
    category: business_safety
    check: "placement_location is allowed for the resolved device_type per the alarm_placement_requirement table"
    error_id: ERR_PLACEMENT_TYPE_LOCATION_MISMATCH
    http_status: 422
    applies_to: "POST /crr/installations"
  - priority: 13
    category: business_safety
    check: "a STROBE_HOH device may only be reserved by a Crew whose certification_level == ADVANCED"
    error_id: ERR_CREW_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /crr/installations"
  - priority: 14
    category: business_safety
    check: "install_outcome == COMPLETE requires alarm_placement_requirement to be satisfied for smoke, CO and strobe coverage, and requires occupant_signature_name"
    error_id: ERR_PLACEMENT_STANDARD_NOT_MET
    http_status: 422
    applies_to: "POST /crr/visits/{id}/complete"
  - priority: 15
    category: business_safety
    check: "secondary_exit_count >= household.sleeping_areas_count and primary_exit_per_sleeping_area == true"
    error_id: ERR_ESCAPE_PLAN_INCOMPLETE
    http_status: 422
    applies_to: "POST /crr/escape-plans"
  - priority: 16
    category: business_temporal
    check: "the candidate visit does not collide with the crew's existing buffered half-open occupations, per calculations.crew_calendar_occupation"
    error_id: ERR_CREW_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /crr/visits, POST /crr/visits/{id}/reschedule"
  - priority: 17
    category: business_temporal
    check: "[scheduled_start_utc, scheduled_end_utc) lies inside [route.window_start_utc, route.window_end_utc)"
    error_id: ERR_VISIT_OUTSIDE_ROUTE_WINDOW
    http_status: 422
    applies_to: "POST /crr/visits, POST /crr/visits/{id}/reschedule"
  - priority: 18
    category: business_temporal
    check: "no other PartnerGrant of the same partner in status IN {ACTIVE, CLOSED} shares a device type with this grant over an overlapping closed date period [period_start_date, period_end_date]"
    error_id: ERR_GRANT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /crr/grants/{id}/activate"
  - priority: 19
    category: business_temporal
    check: "the logical clock date lies inside [grant.period_start_date, grant.period_end_date] (inclusive) for the lot's funding grant"
    error_id: ERR_OUTSIDE_GRANT_PERIOD
    http_status: 422
    applies_to: "POST /crr/installations"
  - priority: 20
    category: business_temporal
    check: "days_since_visit >= FOLLOWUP_MIN_DAYS (30), computed from household.last_visit_completed_at to the logical clock"
    error_id: ERR_FOLLOWUP_TOO_EARLY
    http_status: 422
    applies_to: "POST /crr/follow-ups"
  - priority: 21
    category: business_temporal
    check: "the report period lies inside the grant period, inclusive on both ends"
    error_id: ERR_REPORT_PERIOD_OUTSIDE_GRANT
    http_status: 422
    applies_to: "POST /crr/grant-reports"
  - priority: 22
    category: business_constraint
    check: "at most one non-VOIDED installation per (visit_id, device_type, placement_location, storey)"
    error_id: ERR_DUPLICATE_PLACEMENT
    http_status: 409
    applies_to: "POST /crr/installations"
  - priority: 23
    category: business_constraint
    check: "route.booked_slot_count < route.planned_slots"
    error_id: ERR_ROUTE_SLOTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /crr/visits, POST /crr/visits/{id}/reschedule"
  - priority: 24
    category: business_constraint
    check: "aggregate zone capacity: published slots for the zone on the service_date plus this route's planned_slots <= zone.daily_visit_cap"
    error_id: ERR_ZONE_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /crr/routes/{id}/publish"
  - priority: 25
    category: business_constraint
    check: "aggregate crew capacity: the crew's committed demand_minutes on the service_date plus the candidate's demand_minutes <= crew.max_daily_minutes"
    error_id: ERR_CREW_DAILY_MINUTES_EXCEEDED
    http_status: 422
    applies_to: "POST /crr/visits, POST /crr/visits/{id}/reschedule"
  - priority: 26
    category: business_constraint
    check: "the household has no HomeSafetyVisit with visit_status IN {SCHEDULED, IN_PROGRESS, AWAITING_EDUCATION, AWAITING_INSTALL_OUTCOME}"
    error_id: ERR_HOUSEHOLD_HAS_OPEN_VISIT
    http_status: 409
    applies_to: "POST /crr/visits"
  - priority: 27
    category: business_constraint
    check: "uniqueness of zone_code, crew_code, grant_code, incident_number, and address_line within zone_id"
    error_id: "ERR_ZONE_CODE_TAKEN | ERR_CREW_CODE_TAKEN | ERR_GRANT_CODE_TAKEN | ERR_INCIDENT_NUMBER_TAKEN | ERR_DUPLICATE_HOUSEHOLD_ADDRESS"
    http_status: 409
    applies_to: "POST /crr/zones, POST /crr/crews, POST /crr/grants, POST /crr/zones/{id}/fire-incidents, POST /crr/households"
  - priority: 28
    category: business_constraint
    check: "parent_zone_id, when present, references a zone whose own parent_zone_id is null and which is not this zone"
    error_id: ERR_ZONE_NESTING_DEPTH
    http_status: 422
    applies_to: "POST /crr/zones"
  - priority: 29
    category: business_referential
    check: "the resolved DeviceLot.device_type equals the request's device_type"
    error_id: ERR_LOT_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /crr/installations"
  - priority: 30
    category: business_referential
    check: "the lot's device_type is a member of the funding grant's allowed_device_types, and unit_rate_cents_by_type covers every allowed device type"
    error_id: ERR_DEVICE_TYPE_NOT_FUNDED
    http_status: 422
    applies_to: "POST /crr/device-lots, POST /crr/grants"
  - priority: 31
    category: business_referential
    check: "the visit's route.zone_id equals the household's zone_id"
    error_id: ERR_ROUTE_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /crr/visits, POST /crr/visits/{id}/reschedule"
  - priority: 32
    category: business_fiscal
    check: "(lot.on_hand_qty - lot.reserved_qty) >= 1 for the explicitly requested lot"
    error_id: ERR_INSUFFICIENT_DEVICE_STOCK
    http_status: 409
    applies_to: "POST /crr/installations"
  - priority: 33
    category: business_fiscal
    check: "grant.available_cents >= lot.unit_cost_cents"
    error_id: ERR_GRANT_FUNDS_EXHAUSTED
    http_status: 402
    applies_to: "POST /crr/installations"
  - priority: 34
    category: business_fiscal
    check: "grant_share_cents <= grant.authorized_cents - grant.reported_grant_share_cents"
    error_id: ERR_GRANT_SHARE_EXCEEDS_AUTHORIZED
    http_status: 422
    applies_to: "POST /crr/grant-reports/{id}/submit"
  - priority: 35
    category: business_constraint
    check: "data sufficiency: basis VALIDATED needs zone.surveyed_units >= 1; submit needs installation_count >= 1; an omitted device_lot_id needs a non-empty candidate set; voiding an INSTALLED row needs no ACCEPTED report covering it"
    error_id: "ERR_INSUFFICIENT_FIELD_DATA | ERR_NO_REPORTABLE_INSTALLATIONS | ERR_NO_ELIGIBLE_DEVICE_LOT | ERR_INSTALLATION_ALREADY_REPORTED"
    http_status: 422
    applies_to: "POST /crr/zones/{id}/assessments, POST /crr/grant-reports/{id}/submit, POST /crr/installations, POST /crr/installations/{id}/void"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: >
      Test-driving endpoint that sets the server's logical clock. The clock's startup default is
      exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that
      instant and MUST NOT fall back to real wall-clock time. Every deadline, window and expiry rule
      in this scaffold reads the logical clock only.
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; subsequent reads of the clock return to_iso8601"]

  - method: POST
    path: "/crr/zones"
    description: "Create a risk zone. Supplying parent_zone_id makes this zone a child and flips the parent to zone_kind DISTRICT."
    roles: [RiskAnalyst]
    code: 201
    input: [zone_code, name, occupied_units, structure_fire_count_5yr, fire_injury_count_5yr, pre_1980_unit_pct, senior_household_pct, under5_household_pct, disability_household_pct, assumed_alarm_absence_pct, daily_visit_cap, "parent_zone_id?"]
    output: RiskZone
    side_effects:
      - "sets assessment_status UNASSESSED, zone_kind LEAF, risk_score null"
      - "when parent_zone_id is present: sets the parent's zone_kind to DISTRICT, re-runs calculations.district_risk_rollup on the parent and increments the parent's version by 1"

  - method: GET
    path: "/crr/zones"
    description: "List zones with filters; also the reverse-reachability channel for RiskZone.parent_zone_id and RiskZone.current_assessment_id."
    roles: [RiskAnalyst, CanvassCoordinator, CrrTechnician, GrantOfficer, PartnerLiaison, ProgramAdmin]
    code: 200
    input: ["parent_zone_id?", "current_assessment_id?", "risk_tier?", "zone_kind?", "assessment_status?", "limit?", "offset?"]
    output: RiskZone[]
    side_effects: []

  - method: GET
    path: "/crr/zones/{id}"
    description: "Read one zone including its derived score, tier and survey counters."
    roles: [RiskAnalyst, CanvassCoordinator, CrrTechnician, GrantOfficer, PartnerLiaison, ProgramAdmin]
    code: 200
    input: []
    output: RiskZone
    side_effects: []

  - method: POST
    path: "/crr/zones/{id}/assessments"
    description: "Run a risk assessment under the requested basis; supersedes the zone's previous assessment. OCC-guarded on the zone's version."
    roles: [RiskAnalyst]
    code: 201
    input: [basis, expected_zone_version, "analyst_note?"]
    output: ZoneAssessment
    side_effects:
      - "runs calculations.zone_risk_score and writes zone.risk_score, zone.risk_tier, zone.assessment_basis, zone.current_assessment_id"
      - "recomputes calculations.household_priority_band for every household in the zone"
      - "increments RiskZone.version by 1"
      - "cascades calculations.district_risk_rollup onto the parent district when parent_zone_id is set"

  - method: GET
    path: "/crr/zones/{id}/assessments"
    description: "Immutable assessment history of the zone, ordered by sequence_no ASC."
    roles: [RiskAnalyst, GrantOfficer, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ZoneAssessment[]
    side_effects: []

  - method: POST
    path: "/crr/zones/{id}/fire-incidents"
    description: "Record a structure fire in the zone; the input for served-area outcome tracking."
    roles: [RiskAnalyst]
    code: 201
    input: [incident_number, occurred_at, working_alarm_present, "injuries?", "fatalities?"]
    output: FireIncident
    side_effects: ["none beyond row creation; outcome metrics are derived on read"]

  - method: GET
    path: "/crr/zones/{id}/fire-incidents"
    description: "Incident history of the zone, ordered by occurred_at ASC then created_at ASC."
    roles: [RiskAnalyst, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: FireIncident[]
    side_effects: []

  - method: GET
    path: "/crr/zones/{id}/outcome-summary"
    description: "Computed read: baseline vs post fire rates, injury delta and education retention for the zone, per calculations.zone_outcome_delta and calculations.education_retention_rate."
    roles: [RiskAnalyst, GrantOfficer, PartnerLiaison, ProgramAdmin]
    code: 200
    input: []
    output: "{ zone_id: string, service_start_date: string, baseline_fire_count: integer, post_fire_count: integer, baseline_fire_rate_per_1000: number, post_fire_rate_per_1000: number, rate_delta_pct: number, baseline_injuries: integer, post_injuries: integer, injury_delta: integer, served_household_count: integer, retention_eligible_count: integer, retention_rate_pct: number }"
    side_effects: []

  - method: POST
    path: "/crr/households"
    description: "Intake a household into the canvass universe; computes priority_band and the three placement requirements."
    roles: [CanvassCoordinator]
    code: 201
    input: [zone_id, address_line, occupant_count, sleeping_areas_count, storeys, "children_under5?", "adults_65plus?", "mobility_impaired_occupants?", "hearing_impaired_occupants?", "fuel_burning_appliance?", "attached_garage?", "preferred_language?", "referral_partner_id?"]
    output: Household
    side_effects:
      - "runs calculations.household_priority_band and calculations.alarm_placement_requirement"
      - "when referral_partner_id is present: increments Partner.referral_count by 1 and increments the partner's version by 1"

  - method: GET
    path: "/crr/households"
    description: "List households; the reverse-reachability channel for Household.zone_id and Household.referral_partner_id."
    roles: [CanvassCoordinator, RiskAnalyst, CrrTechnician, ProgramAdmin]
    code: 200
    input: ["zone_id?", "referral_partner_id?", "status?", "priority_band?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  - method: GET
    path: "/crr/households/{id}"
    description: "Read one household including status, version, retention flag and required device counts."
    roles: [CanvassCoordinator, RiskAnalyst, CrrTechnician, ProgramAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: GET
    path: "/crr/households/{id}/follow-ups"
    description: "Append-only follow-up history of the household, ordered by attempt_no ASC."
    roles: [CanvassCoordinator, RiskAnalyst, ProgramAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: FollowUpContact[]
    side_effects: []

  - method: POST
    path: "/crr/follow-ups"
    description: "Log an effectiveness follow-up contact. Trigger of the three-hop household -> zone -> district cascade and of the escape-plan verify/lapse transitions."
    roles: [CanvassCoordinator]
    code: 201
    input: [household_id, contact_method, outcome, "alarms_present_count?", "plan_practiced?"]
    output: FollowUpContact
    side_effects:
      - "computes attempt_no and days_since_visit"
      - "outcome REACHED_ALARM_MISSING: drives Household VISIT_COMPLETED_to_REVISIT_REQUIRED, then EscapePlan to LAPSED, then zone.post_service_alarm_loss_units and the VALIDATED zone_risk_score re-run, then the district rollup"
      - "outcome REACHED_ALARM_PRESENT with plan_practiced true: drives EscapePlan ISSUED_to_VERIFIED and sets household.alarm_retention_flag = true"
      - "outcome REACHED_ALARM_PRESENT with plan_practiced false: drives EscapePlan ISSUED_to_LAPSED with lapse_reason DRILL_NOT_PRACTICED and sets household.alarm_retention_flag = true"
      - "outcomes NO_ANSWER and REFUSED: no state change beyond the appended row"

  - method: POST
    path: "/crr/crews"
    description: "Register an install crew. The returned id is the X-User-ID a CrrTechnician acts under."
    roles: [ProgramAdmin]
    code: 201
    input: [crew_code, member_count, certification_level, max_daily_minutes, "status?"]
    output: Crew
    side_effects: []

  - method: POST
    path: "/crr/routes"
    description: "Plan a canvassing route for one crew in one zone on one service date."
    roles: [CanvassCoordinator]
    code: 201
    input: [zone_id, crew_id, service_date, window_start_utc, window_end_utc, planned_slots]
    output: CanvassRoute
    side_effects:
      - "sets status PLANNED and booked_slot_count 0"
      - "drives RiskZone ASSESSED_to_TARGETED when this is the zone's first route"

  - method: GET
    path: "/crr/routes"
    description: "List routes; the reverse-reachability channel for CanvassRoute.zone_id and CanvassRoute.crew_id."
    roles: [CanvassCoordinator, CrrTechnician, ProgramAdmin]
    code: 200
    input: ["zone_id?", "crew_id?", "service_date?", "status?", "limit?", "offset?"]
    output: CanvassRoute[]
    side_effects: []

  - method: GET
    path: "/crr/routes/{id}"
    description: "Read one route including booked_slot_count and version."
    roles: [CanvassCoordinator, CrrTechnician, ProgramAdmin]
    code: 200
    input: []
    output: CanvassRoute
    side_effects: []

  - method: POST
    path: "/crr/routes/{id}/publish"
    description: "Publish a planned route, enforcing the zone's aggregate daily slot cap."
    roles: [CanvassCoordinator]
    code: 200
    input: []
    output: CanvassRoute
    side_effects:
      - "sets status PUBLISHED and increments route.version by 1"

  - method: POST
    path: "/crr/routes/{id}/close"
    description: "Close a route and cancel its still-open visits (conditional cascade)."
    roles: [CanvassCoordinator]
    code: 200
    input: ["closure_note?"]
    output: CanvassRoute
    side_effects:
      - "cancels every visit with visit_status IN {SCHEDULED, IN_PROGRESS} with cancel_reason ROUTE_CLOSED"
      - "each cascaded cancel returns its household to INTAKE_QUEUED and voids that visit's RESERVED installations"
      - "increments route.version by 1"

  - method: POST
    path: "/crr/visits"
    description: "Book a home safety visit against a published route slot. Computes demand_minutes and the buffered crew calendar interval."
    roles: [CanvassCoordinator]
    code: 201
    input: [household_id, route_id, scheduled_start_utc, appointment_option, "contact_channel?"]
    output: HomeSafetyVisit
    side_effects:
      - "runs calculations.visit_demand_minutes then calculations.crew_calendar_occupation"
      - "sets visit_status SCHEDULED, install_status NOT_STARTED, education_status PENDING"
      - "increments route.booked_slot_count by 1 and increments route.version by 1"
      - "drives Household INTAKE_QUEUED_to_APPOINTMENT_SCHEDULED (or REVISIT_REQUIRED_to_APPOINTMENT_SCHEDULED) and increments household.version by 1"

  - method: GET
    path: "/crr/visits"
    description: "List visits; the reverse-reachability channel for HomeSafetyVisit.household_id and HomeSafetyVisit.route_id."
    roles: [CanvassCoordinator, CrrTechnician, ProgramAdmin]
    code: 200
    input: ["household_id?", "route_id?", "visit_status?", "install_status?", "limit?", "offset?"]
    output: HomeSafetyVisit[]
    side_effects: []

  - method: GET
    path: "/crr/visits/{id}"
    description: "Read one visit including all three parallel status dimensions and its computed interval."
    roles: [CanvassCoordinator, CrrTechnician, ProgramAdmin]
    code: 200
    input: []
    output: HomeSafetyVisit
    side_effects: []

  - method: POST
    path: "/crr/visits/{id}/reschedule"
    description: "Move a SCHEDULED visit to a different published route and/or start time; re-runs the interval and slot arithmetic."
    roles: [CanvassCoordinator]
    code: 200
    input: [route_id, scheduled_start_utc]
    output: HomeSafetyVisit
    side_effects:
      - "re-runs calculations.visit_demand_minutes and calculations.crew_calendar_occupation against the new route"
      - "decrements the old route's booked_slot_count by 1 and increments the new route's booked_slot_count by 1; increments the version of every route touched by 1"
      - "increments visit.version by 1; the household's status is unchanged"

  - method: POST
    path: "/crr/visits/{id}/cancel"
    description: "Cancel a visit that has not yet completed; releases its slot, its crew interval and any reserved devices."
    roles: [CanvassCoordinator]
    code: 200
    input: [cancel_reason]
    output: HomeSafetyVisit
    side_effects:
      - "sets visit_status CANCELLED, stamps cancelled_at from the logical clock and sets occupies_crew_calendar = false"
      - "decrements route.booked_slot_count by 1 and increments route.version by 1"
      - "voids every RESERVED AlarmInstallation of the visit, returning each lot's reserved_qty and each grant's reserved_cents (compensating invariant)"
      - "returns the household to INTAKE_QUEUED and increments household.version by 1"

  - method: POST
    path: "/crr/visits/{id}/arrive"
    description: "Crew arrival and pre-existing-alarm survey. Segregation-of-duties anchor: the acting crew becomes the visit's installing crew."
    roles: [CrrTechnician]
    code: 200
    input: [occupant_present, pre_existing_working_smoke_alarms, pre_existing_working_co_alarms]
    output: HomeSafetyVisit
    side_effects:
      - "sets visit_status IN_PROGRESS and install_status SURVEYED"
      - "increments zone.surveyed_units by 1 and, when pre_existing_working_smoke_alarms is 0, increments zone.surveyed_units_without_alarm by 1"
      - "increments visit.version by 1"

  - method: POST
    path: "/crr/visits/{id}/education"
    description: "Record occupant education delivery or refusal; advances the education_status dimension independently of install_status."
    roles: [CrrTechnician]
    code: 200
    input: [education_outcome, "topics_covered?", "escape_plan_walkthrough?"]
    output: HomeSafetyVisit
    side_effects:
      - "sets education_status DELIVERED or DECLINED and stores education_topics and escape_plan_walkthrough"
      - "re-derives visit_status per the pinned 6-step derivation order in §1.1"
      - "increments visit.version by 1"

  - method: POST
    path: "/crr/visits/{id}/complete"
    description: "Close out the visit with an install outcome. Enforces the placement-standards completion gate and drives the served-household counters."
    roles: [CrrTechnician]
    code: 200
    input: [install_outcome, "occupant_signature_name?", "deferral_reason?"]
    output: HomeSafetyVisit
    side_effects:
      - "sets install_status INSTALL_COMPLETE or INSTALL_DEFERRED and re-derives visit_status"
      - "on COMPLETED: stamps completed_at, sets household VISIT_COMPLETED and household.last_visit_completed_at, increments zone.served_household_count by 1, and increments household.version by 1"
      - "on the first COMPLETED visit of the zone: drives RiskZone TARGETED_to_SERVICE_ACTIVE, sets zone.service_start_date to the UTC date of the logical clock and increments zone.version by 1"
      - "on install_outcome COMPLETE: transitions every RESERVED installation of the visit to INSTALLED and stamps installed_at (cascade hop 1), which commits the unit on its DeviceLot (reserved_qty -1, consumed_qty +1) (hop 2), which commits the money on the PartnerGrant (reserved_cents -= reimbursable_cents, committed_cents += reimbursable_cents) (hop 3), which re-runs calculations.installation_reimbursement and calculations.grant_cost_share on every DRAFT GrantReport whose period covers installed_at (hop 4)"
      - "on install_outcome DEFERRED: voids every RESERVED installation of the visit with voided_reason DATA_ENTRY_ERROR, returning each unit to its lot and each reservation to its grant"
      - "increments visit.version by 1"

  - method: POST
    path: "/crr/partners"
    description: "Register a nonprofit or utility partner."
    roles: [ProgramAdmin]
    code: 201
    input: [org_name, org_type, contact_email, "agreement_signed?"]
    output: Partner
    side_effects: ["sets referral_count 0"]

  - method: POST
    path: "/crr/grants"
    description: "Create a funding grant for a partner in DRAFT, with its reimbursement basis, unit rates and cost-share percentages."
    roles: [GrantOfficer]
    code: 201
    input: [partner_id, grant_code, authorized_cents, period_start_date, period_end_date, allowed_device_types, unit_rate_cents_by_type, reimbursement_basis, reimbursement_pct, indirect_rate_pct, match_pct]
    output: PartnerGrant
    side_effects: ["sets status DRAFT, reserved_cents 0, committed_cents 0, reported_grant_share_cents 0 and available_cents = authorized_cents"]

  - method: GET
    path: "/crr/grants"
    description: "List grants; the reverse-reachability channel for PartnerGrant.partner_id."
    roles: [GrantOfficer, PartnerLiaison, ProgramAdmin]
    code: 200
    input: ["partner_id?", "status?", "reimbursement_basis?", "limit?", "offset?"]
    output: PartnerGrant[]
    side_effects: []

  - method: GET
    path: "/crr/grants/{id}"
    description: "Read one grant including the three money counters that the compensating invariant reconciles."
    roles: [GrantOfficer, PartnerLiaison, ProgramAdmin]
    code: 200
    input: []
    output: PartnerGrant
    side_effects: []

  - method: POST
    path: "/crr/grants/{id}/activate"
    description: "Activate a DRAFT grant so its device lots may be created and its funds reserved."
    roles: [GrantOfficer]
    code: 200
    input: []
    output: PartnerGrant
    side_effects: ["sets status ACTIVE and increments grant.version by 1"]

  - method: POST
    path: "/crr/device-lots"
    description: "Receive a device lot funded by an ACTIVE grant. Only device types the grant funds may be received."
    roles: [GrantOfficer]
    code: 201
    input: [funding_grant_id, sku, device_type, unit_cost_cents, received_qty, expiry_date]
    output: DeviceLot
    side_effects: ["sets on_hand_qty = received_qty, reserved_qty 0, consumed_qty 0 and status AVAILABLE"]

  - method: GET
    path: "/crr/device-lots"
    description: "List device lots; the reverse-reachability channel for DeviceLot.funding_grant_id and the observable surface of the selector policy."
    roles: [GrantOfficer, CrrTechnician, ProgramAdmin]
    code: 200
    input: ["funding_grant_id?", "device_type?", "status?", "limit?", "offset?"]
    output: DeviceLot[]
    side_effects: []

  - method: GET
    path: "/crr/device-lots/{id}"
    description: "Read one device lot including its three quantity counters."
    roles: [GrantOfficer, CrrTechnician, ProgramAdmin]
    code: 200
    input: []
    output: DeviceLot
    side_effects: []

  - method: POST
    path: "/crr/installations"
    description: >
      Install one device at one placement location during a visit. When device_lot_id is omitted the
      lot is chosen by calculations.device_lot_selector; when supplied it is used as-is and must match
      the requested device_type. Reserves stock and money.
    roles: [CrrTechnician]
    code: 201
    input: [visit_id, device_type, placement_location, storey, "device_lot_id?", "serial_number?"]
    output: AlarmInstallation
    side_effects:
      - "runs calculations.device_lot_selector when device_lot_id is omitted"
      - "runs calculations.installation_reimbursement and stores reserved_cost_cents and reimbursable_cents"
      - "increments lot.reserved_qty by 1, leaves lot.on_hand_qty unchanged (reserved units stay part of on_hand until commit) and increments lot.version by 1"
      - "increments grant.reserved_cents by the installation's reimbursable_cents, decrements grant.available_cents by the same amount and increments grant.version by 1"
      - "sets status RESERVED and installed_by_crew_id to the acting crew"

  - method: GET
    path: "/crr/installations"
    description: "List installations; the reverse-reachability channel for AlarmInstallation.visit_id, .device_lot_id, .installed_by_crew_id and .verified_by_crew_id."
    roles: [CrrTechnician, GrantOfficer, ProgramAdmin]
    code: 200
    input: ["visit_id?", "device_lot_id?", "installed_by_crew_id?", "verified_by_crew_id?", "device_type?", "status?", "limit?", "offset?"]
    output: AlarmInstallation[]
    side_effects: []

  - method: GET
    path: "/crr/installations/{id}"
    description: "Read one installation including its reserved and reimbursable money fields."
    roles: [CrrTechnician, GrantOfficer, ProgramAdmin]
    code: 200
    input: []
    output: AlarmInstallation
    side_effects: []

  - method: POST
    path: "/crr/installations/{id}/verify"
    description: "Independent placement verification of an INSTALLED device. Segregation of duties: the verifying crew MUST NOT be installed_by_crew_id."
    roles: [CrrTechnician]
    code: 200
    input: []
    output: AlarmInstallation
    side_effects:
      - "sets status VERIFIED, verified_by_crew_id to the acting crew and stamps verified_at"
      - "no unit and no money movement: the device and its money were already committed by the RESERVED_to_INSTALLED cascade on visit completion"
      - "increments installation.version by 1"

  - method: POST
    path: "/crr/installations/{id}/void"
    description: "Void a RESERVED or INSTALLED installation and reverse every stock and money effect it produced. VERIFIED is terminal and cannot be voided."
    roles: [CrrTechnician, GrantOfficer]
    code: 200
    input: [voided_reason]
    output: AlarmInstallation
    side_effects:
      - "sets status VOIDED, stores voided_reason and stamps voided_at"
      - "from RESERVED: decrements lot.reserved_qty by 1 leaving lot.on_hand_qty unchanged, decrements grant.reserved_cents by reimbursable_cents and increments grant.available_cents by the same amount"
      - "from INSTALLED: decrements lot.consumed_qty by 1, increments lot.on_hand_qty by 1, decrements grant.committed_cents by reimbursable_cents and increments grant.available_cents by the same amount"
      - "from INSTALLED: every DRAFT GrantReport whose period covers installed_at re-runs calculations.installation_reimbursement and calculations.grant_cost_share"
      - "increments lot.version, grant.version and installation.version by 1 each"

  - method: POST
    path: "/crr/escape-plans"
    description: "Draft an escape plan for a household. OCC-guarded on the household's version; supersedes any live plan for that household."
    roles: [CanvassCoordinator]
    code: 201
    input: [household_id, expected_household_version, primary_exit_per_sleeping_area, secondary_exit_count, meeting_point_description, "drill_scheduled_date?"]
    output: EscapePlan
    side_effects:
      - "sets status DRAFT and reissue_count 0"
      - "moves any existing DRAFT, ISSUED or VERIFIED plan for the household to SUPERSEDED"
      - "increments Household.version by 1"

  - method: GET
    path: "/crr/escape-plans"
    description: "List escape plans; the reverse-reachability channel for EscapePlan.household_id."
    roles: [CanvassCoordinator, CrrTechnician, ProgramAdmin]
    code: 200
    input: ["household_id?", "status?", "limit?", "offset?"]
    output: EscapePlan[]
    side_effects: []

  - method: GET
    path: "/crr/escape-plans/{id}"
    description: "Read one escape plan including its lifecycle stamps and lapse_reason."
    roles: [CanvassCoordinator, CrrTechnician, ProgramAdmin]
    code: 200
    input: []
    output: EscapePlan
    side_effects: []

  - method: POST
    path: "/crr/escape-plans/{id}/issue"
    description: "Issue a drafted plan to the occupant; only an issued plan can later be verified or lapse."
    roles: [CanvassCoordinator]
    code: 200
    input: [issued_channel]
    output: EscapePlan
    side_effects:
      - "sets status ISSUED, stores issued_channel and stamps issued_at from the logical clock"
      - "when re-issuing after a lapse: increments reissue_count by 1 and clears lapsed_at and lapse_reason"
      - "increments plan.version by 1"

  - method: POST
    path: "/crr/grant-reports"
    description: "Compile a grant report for a period. Runs the cost-share, outcome and retention calculations and freezes the resulting literals onto the report."
    roles: [GrantOfficer]
    code: 201
    input: [grant_id, period_start_date, period_end_date, "is_final_report?"]
    output: GrantReport
    side_effects:
      - "runs calculations.grant_cost_share over the grant's INSTALLED and VERIFIED installations in the period and stores reimbursable_total_cents, indirect_cents, total_project_cents, partner_match_required_cents and grant_share_cents"
      - "runs calculations.zone_outcome_delta and calculations.education_retention_rate over the served zones and stores the outcome fields"
      - "sets status DRAFT, revision_no 0 and stores compiled_by_user_id from X-User-ID"

  - method: GET
    path: "/crr/grant-reports"
    description: "List grant reports; the reverse-reachability channel for GrantReport.grant_id."
    roles: [GrantOfficer, PartnerLiaison, ProgramAdmin]
    code: 200
    input: ["grant_id?", "status?", "is_final_report?", "limit?", "offset?"]
    output: GrantReport[]
    side_effects: []

  - method: GET
    path: "/crr/grant-reports/{id}"
    description: "Read one grant report including its frozen money and outcome literals."
    roles: [GrantOfficer, PartnerLiaison, ProgramAdmin]
    code: 200
    input: []
    output: GrantReport
    side_effects: []

  - method: POST
    path: "/crr/grant-reports/{id}/submit"
    description: "Attest and submit a DRAFT report to the partner. Segregation of duties: the submitting user MUST NOT be compiled_by_user_id."
    roles: [GrantOfficer]
    code: 200
    input: [attestation_name]
    output: GrantReport
    side_effects:
      - "sets status SUBMITTED, stores submitted_by_user_id and attestation_name and stamps submitted_at"
      - "increments report.version by 1"

  - method: POST
    path: "/crr/grant-reports/{id}/decision"
    description: "Partner-side decision on a SUBMITTED report: ACCEPT freezes the grant share; RETURN sends it back to DRAFT for revision."
    roles: [PartnerLiaison]
    code: 200
    input: [decision, "reviewer_note?"]
    output: GrantReport
    side_effects:
      - "decision ACCEPT: sets status ACCEPTED, stamps decided_at, increments grant.reported_grant_share_cents by the report's grant_share_cents and increments grant.version by 1"
      - "decision ACCEPT on a final report: also sets grant.status CLOSED"
      - "decision RETURN: sets status DRAFT, increments revision_no by 1, clears submitted_by_user_id, attestation_name and submitted_at"
      - "increments report.version by 1"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header is absent, empty, or X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The authenticated role is not listed in the target endpoint's roles"
  - id: ERR_CREW_NOT_ASSIGNED
    http: 403
    condition: "A CrrTechnician acts on a visit whose route.crew_id is not the acting X-User-ID crew"
  - id: ERR_PARTNER_NOT_OWNER
    http: 403
    condition: "A PartnerLiaison decides a grant report whose grant.partner_id is not the acting X-User-ID partner"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting identity is the same as the identity that performed the incompatible prior step: verifying a crew's own installation, or submitting a report the same user compiled"

  # --- existence ----------------------------------------------------------
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "A path or body zone id matches no RiskZone"
  - id: ERR_HOUSEHOLD_NOT_FOUND
    http: 404
    condition: "A path or body household id matches no Household"
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "A body crew_id matches no Crew"
  - id: ERR_ROUTE_NOT_FOUND
    http: 404
    condition: "A path or body route id matches no CanvassRoute"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "A path or body visit id matches no HomeSafetyVisit"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "A path or body device_lot_id matches no DeviceLot"
  - id: ERR_INSTALLATION_NOT_FOUND
    http: 404
    condition: "A path installation id matches no AlarmInstallation"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "A body partner_id or referral_partner_id matches no Partner"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "A path or body grant id matches no PartnerGrant"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "A path escape plan id matches no EscapePlan"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "A path grant report id matches no GrantReport"

  # --- request schema -----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong JSON type, unknown enum member, negative count, pct outside 0.00-100.00, window_end_utc not after window_start_utc, period_end_date before period_start_date, or limit/offset outside the declared pagination bounds"

  # --- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_ZONE_VERSION
    http: 412
    condition: "expected_zone_version does not equal the target RiskZone's current version (concurrency_rules[zone-assessment-supersede-stale-zone])"
  - id: ERR_STALE_HOUSEHOLD_VERSION
    http: 412
    condition: "expected_household_version does not equal the target Household's current version (concurrency_rules[escape-plan-supersede-stale-household])"

  # --- target-state errors -----------------------------------------------
  - id: ERR_ZONE_NOT_ASSESSABLE
    http: 409
    condition: "An assessment is requested on a zone whose zone_kind is DISTRICT; district scores are rollups only"
  - id: ERR_ZONE_NOT_TARGETABLE
    http: 409
    condition: "A route is planned for a zone whose assessment_status is still UNASSESSED, or whose risk_tier is null"
  - id: ERR_INVALID_HOUSEHOLD_STATE
    http: 409
    condition: "The household is not in a state that admits the requested step: booking a visit from REFUSED or NO_CONTACT, or drafting an escape plan for a household that has never reached VISIT_COMPLETED or REVISIT_REQUIRED"
  - id: ERR_ROUTE_NOT_OPEN
    http: 409
    condition: "The route's status is not PUBLISHED (publish requires PLANNED; booking, rescheduling and arrival require PUBLISHED or IN_PROGRESS; close requires a non-CLOSED route)"
  - id: ERR_INVALID_VISIT_STATE
    http: 409
    condition: "The visit's visit_status, install_status or education_status does not admit the requested step: arriving on a visit whose install_status is not NOT_STARTED, educating before arrival (install_status still NOT_STARTED), educating on a CANCELLED visit or on one whose education_status is already terminal, or installing on / completing a visit whose install_status is not SURVEYED"
  - id: ERR_GRANT_NOT_DRAFT
    http: 409
    condition: "activate is called on a grant whose status is not DRAFT"
  - id: ERR_GRANT_NOT_ACTIVE
    http: 409
    condition: "A device lot, installation reservation or report compilation touches a grant whose status is not ACTIVE"
  - id: ERR_REPORT_NOT_EDITABLE
    http: 409
    condition: "submit is called on a report whose status is not DRAFT, or a decision is recorded on a report whose status is not SUBMITTED"
  - id: ERR_INSTALLATION_NOT_VOIDABLE
    http: 409
    condition: "void is called on an installation whose status is not RESERVED or INSTALLED (VERIFIED and VOIDED are terminal), or verify is called on an installation whose status is not INSTALLED"
  - id: ERR_PLAN_NOT_REISSUABLE
    http: 409
    condition: "issue is called on an escape plan whose status is not DRAFT or LAPSED, or on a SUPERSEDED plan"
  - id: ERR_INSTALLATION_ALREADY_REPORTED
    http: 422
    condition: "void is called on an INSTALLED installation whose reimbursable_cents is already frozen into an ACCEPTED GrantReport (the report's reportable set covers INSTALLED and VERIFIED rows alike)"

  # --- life-safety / placement standards ---------------------------------
  - id: ERR_PLACEMENT_LOCATION_FORBIDDEN
    http: 422
    condition: "placement_location is in calculations.alarm_placement_requirement.constants.ALWAYS_FORBIDDEN (KITCHEN, BATHROOM, GARAGE) for every device type"
  - id: ERR_PLACEMENT_TYPE_LOCATION_MISMATCH
    http: 422
    condition: "placement_location is not in the allow-table row for the requested device_type (e.g. a STROBE_HOH outside a sleeping area, or a CO_ALARM in an ATTIC)"
  - id: ERR_CREW_NOT_CERTIFIED
    http: 422
    condition: "A crew whose certification_level is BASIC reserves a STROBE_HOH device (validations priority 13)"
  - id: ERR_PLACEMENT_STANDARD_NOT_MET
    http: 422
    condition: "complete is called with install_outcome COMPLETE while the visit's non-voided installations plus pre-existing working alarms do not satisfy the household's required_smoke_devices, required_co_devices and required_strobe_devices"
  - id: ERR_ESCAPE_PLAN_INCOMPLETE
    http: 422
    condition: "An escape plan is drafted with primary_exit_per_sleeping_area false, or with secondary_exit_count below the household's sleeping_areas_count (validations priority 15)"

  # --- temporal ----------------------------------------------------------
  - id: ERR_CREW_INTERVAL_CONFLICT
    http: 409
    condition: "The buffered half-open interval from calculations.crew_calendar_occupation overlaps another occupying visit of the same crew"
  - id: ERR_VISIT_OUTSIDE_ROUTE_WINDOW
    http: 422
    condition: "scheduled_start_utc is before route.window_start_utc, or the visit's unbuffered scheduled_end_utc is after route.window_end_utc"
  - id: ERR_GRANT_PERIOD_OVERLAP
    http: 409
    condition: "A new grant's closed date interval overlaps an existing non-CLOSED grant of the same partner"
  - id: ERR_OUTSIDE_GRANT_PERIOD
    http: 422
    condition: "An installation's logical-clock instant falls outside the funding grant's period_start_date..period_end_date inclusive date range"
  - id: ERR_FOLLOWUP_TOO_EARLY
    http: 422
    condition: "A follow-up is logged fewer than FOLLOWUP_MIN_DAYS (30) days after household.last_visit_completed_at (validations priority 20)"
  - id: ERR_REPORT_PERIOD_OUTSIDE_GRANT
    http: 422
    condition: "A grant report's period is not fully contained in the grant's own period"

  # --- aggregate and uniqueness constraints ------------------------------
  - id: ERR_DUPLICATE_PLACEMENT
    http: 409
    condition: "A non-voided installation already exists for the same visit, storey and placement_location"
  - id: ERR_ROUTE_SLOTS_EXHAUSTED
    http: 409
    condition: "route.booked_slot_count has already reached route.planned_slots"
  - id: ERR_ZONE_DAILY_CAP_EXCEEDED
    http: 409
    condition: "Publishing a route would push the zone's total planned_slots across its PUBLISHED and IN_PROGRESS routes on that service_date above zone.daily_visit_cap"
  - id: ERR_CREW_DAILY_MINUTES_EXCEEDED
    http: 422
    condition: "The sum of demand_minutes over the crew's occupying visits on that service date would exceed crew.max_daily_minutes"
  - id: ERR_HOUSEHOLD_HAS_OPEN_VISIT
    http: 409
    condition: "The household already has a visit whose visit_status is SCHEDULED, IN_PROGRESS, AWAITING_EDUCATION or AWAITING_INSTALL_OUTCOME"
  - id: ERR_ZONE_CODE_TAKEN
    http: 409
    condition: "zone_code is already used by another RiskZone"
  - id: ERR_CREW_CODE_TAKEN
    http: 409
    condition: "crew_code is already used by another Crew"
  - id: ERR_GRANT_CODE_TAKEN
    http: 409
    condition: "grant_code is already used by another PartnerGrant"
  - id: ERR_INCIDENT_NUMBER_TAKEN
    http: 409
    condition: "incident_number is already used by another FireIncident"
  - id: ERR_DUPLICATE_HOUSEHOLD_ADDRESS
    http: 409
    condition: "address_line is already used by another Household in the same zone"
  - id: ERR_ZONE_NESTING_DEPTH
    http: 422
    condition: "parent_zone_id points at a zone that already has a parent; calculations.district_risk_rollup.constants.ROLLUP_MAX_DEPTH is 1"

  # --- referential consistency -------------------------------------------
  - id: ERR_LOT_TYPE_MISMATCH
    http: 422
    condition: "An explicitly supplied device_lot_id references a lot whose device_type differs from the requested device_type"
  - id: ERR_DEVICE_TYPE_NOT_FUNDED
    http: 422
    condition: "A device lot's device_type is not a member of its funding grant's allowed_device_types"
  - id: ERR_ROUTE_ZONE_MISMATCH
    http: 422
    condition: "The route's zone_id differs from the household's zone_id"

  # --- fiscal -------------------------------------------------------------
  - id: ERR_INSUFFICIENT_DEVICE_STOCK
    http: 409
    condition: "(lot.on_hand_qty - lot.reserved_qty) is 0 for the resolved lot at reservation time"
  - id: ERR_GRANT_FUNDS_EXHAUSTED
    http: 402
    condition: "The funding grant's available_cents is less than the resolved lot's unit_cost_cents (validations priority 33)"
  - id: ERR_GRANT_SHARE_EXCEEDS_AUTHORIZED
    http: 422
    condition: "A report's grant_share_cents plus grant.reported_grant_share_cents would exceed grant.authorized_cents"

  # --- data sufficiency ---------------------------------------------------
  - id: ERR_INSUFFICIENT_FIELD_DATA
    http: 422
    condition: "basis VALIDATED (which selects the VALIDATED_FIELD variant) is requested for a zone whose surveyed_units is 0, so the field-observed alarm gap is undefined"
  - id: ERR_NO_ELIGIBLE_DEVICE_LOT
    http: 422
    condition: "calculations.device_lot_selector finds no lot satisfying its eligibility predicate"
  - id: ERR_NO_REPORTABLE_INSTALLATIONS
    http: 422
    condition: "A grant report period contains no INSTALLED or VERIFIED installations funded by the grant"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: >
      Division administrator. Owns the operational reference data (crews, partners) and the logical
      clock, and holds read access across the whole program for oversight. Deliberately excluded from
      every money and life-safety write so that no single identity can both create a crew and use it.
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /crr/crews"
      - "POST /crr/partners"
    shared_operations:
      - "GET /crr/zones"
      - "GET /crr/zones/{id}"
      - "GET /crr/zones/{id}/assessments"
      - "GET /crr/zones/{id}/fire-incidents"
      - "GET /crr/zones/{id}/outcome-summary"
      - "GET /crr/households"
      - "GET /crr/households/{id}"
      - "GET /crr/households/{id}/follow-ups"
      - "GET /crr/routes"
      - "GET /crr/routes/{id}"
      - "GET /crr/visits"
      - "GET /crr/visits/{id}"
      - "GET /crr/grants"
      - "GET /crr/grants/{id}"
      - "GET /crr/device-lots"
      - "GET /crr/device-lots/{id}"
      - "GET /crr/installations"
      - "GET /crr/installations/{id}"
      - "GET /crr/escape-plans"
      - "GET /crr/escape-plans/{id}"
      - "GET /crr/grant-reports"
      - "GET /crr/grant-reports/{id}"

  - name: RiskAnalyst
    description: >
      Community risk analyst. Owns zone definition, incident capture and the risk assessment that
      assigns risk_score and risk_tier. Cannot schedule, install or report, so the identity that
      decides which neighborhoods are high risk never books the visits it justifies.
    identity: opaque
    exclusive_operations:
      - "POST /crr/zones"
      - "POST /crr/zones/{id}/assessments"
      - "POST /crr/zones/{id}/fire-incidents"
    shared_operations:
      - "GET /crr/zones"
      - "GET /crr/zones/{id}"
      - "GET /crr/zones/{id}/assessments"
      - "GET /crr/zones/{id}/fire-incidents"
      - "GET /crr/zones/{id}/outcome-summary"
      - "GET /crr/households"
      - "GET /crr/households/{id}"
      - "GET /crr/households/{id}/follow-ups"

  - name: CanvassCoordinator
    description: >
      Canvassing and scheduling desk. Owns household intake, route planning, visit booking and
      rescheduling, escape-plan drafting and issuance, and follow-up logging. Holds no installation
      or money authority.
    identity: opaque
    exclusive_operations:
      - "POST /crr/households"
      - "POST /crr/routes"
      - "POST /crr/routes/{id}/publish"
      - "POST /crr/routes/{id}/close"
      - "POST /crr/visits"
      - "POST /crr/visits/{id}/reschedule"
      - "POST /crr/visits/{id}/cancel"
      - "POST /crr/follow-ups"
      - "POST /crr/escape-plans"
      - "POST /crr/escape-plans/{id}/issue"
    shared_operations:
      - "GET /crr/zones"
      - "GET /crr/zones/{id}"
      - "GET /crr/households"
      - "GET /crr/households/{id}"
      - "GET /crr/households/{id}/follow-ups"
      - "GET /crr/routes"
      - "GET /crr/routes/{id}"
      - "GET /crr/visits"
      - "GET /crr/visits/{id}"
      - "GET /crr/escape-plans"
      - "GET /crr/escape-plans/{id}"

  - name: CrrTechnician
    description: >
      Field install crew acting as itself. X-User-ID is the id of the Crew row, which is how the
      server resolves crew assignment (a technician may only work its own route's visits) and how it
      enforces the install-versus-verify separation on AlarmInstallation.
    identity: "entity_backed:Crew"
    exclusive_operations:
      - "POST /crr/visits/{id}/arrive"
      - "POST /crr/visits/{id}/education"
      - "POST /crr/visits/{id}/complete"
      - "POST /crr/installations"
      - "POST /crr/installations/{id}/verify"
    shared_operations:
      - "POST /crr/installations/{id}/void"
      - "GET /crr/zones"
      - "GET /crr/zones/{id}"
      - "GET /crr/households"
      - "GET /crr/households/{id}"
      - "GET /crr/routes"
      - "GET /crr/routes/{id}"
      - "GET /crr/visits"
      - "GET /crr/visits/{id}"
      - "GET /crr/device-lots"
      - "GET /crr/device-lots/{id}"
      - "GET /crr/installations"
      - "GET /crr/installations/{id}"
      - "GET /crr/escape-plans"
      - "GET /crr/escape-plans/{id}"

  - name: GrantOfficer
    description: >
      Grant and inventory officer. Owns grant creation and activation, device-lot receipt, and report
      compilation and submission. Cannot install or verify a device, so the identity that controls the
      money never also generates the installation records the money reimburses.
    identity: opaque
    exclusive_operations:
      - "POST /crr/grants"
      - "POST /crr/grants/{id}/activate"
      - "POST /crr/device-lots"
      - "POST /crr/grant-reports"
      - "POST /crr/grant-reports/{id}/submit"
    shared_operations:
      - "POST /crr/installations/{id}/void"
      - "GET /crr/zones"
      - "GET /crr/zones/{id}"
      - "GET /crr/zones/{id}/assessments"
      - "GET /crr/zones/{id}/outcome-summary"
      - "GET /crr/grants"
      - "GET /crr/grants/{id}"
      - "GET /crr/device-lots"
      - "GET /crr/device-lots/{id}"
      - "GET /crr/installations"
      - "GET /crr/installations/{id}"
      - "GET /crr/grant-reports"
      - "GET /crr/grant-reports/{id}"

  - name: PartnerLiaison
    description: >
      Funding partner representative acting as itself. X-User-ID is the id of the Partner row, so a
      liaison may only decide reports belonging to its own grants. Read-only elsewhere; it is the only
      role that can accept or return a submitted report.
    identity: "entity_backed:Partner"
    exclusive_operations:
      - "POST /crr/grant-reports/{id}/decision"
    shared_operations:
      - "GET /crr/zones"
      - "GET /crr/zones/{id}"
      - "GET /crr/zones/{id}/outcome-summary"
      - "GET /crr/grants"
      - "GET /crr/grants/{id}"
      - "GET /crr/grant-reports"
      - "GET /crr/grant-reports/{id}"
