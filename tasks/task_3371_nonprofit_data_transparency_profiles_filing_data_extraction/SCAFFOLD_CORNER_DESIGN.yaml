            - "prospects[1].organization_id == ${pf_id} and prospects[2].organization_id == ${lc_id} — both score exactly 35 (subject only, since neither is in the funder's IL home state) and the tie is broken by organization.created_at ASC"
            - "Prairie Food Bank was created before Lakeshore Conservancy in this recipe, which is what puts it at index 1"
            - "mean_grant_amount_cents == 1000000 on the response envelope"

      - name: funder_prospects_returns_an_empty_array_when_no_candidate_is_eligible
        claim_type: Correct Result
        grounds:
          - calculations.prospect_match_score
          - endpoints.GET_/nonprofits/funder-research/prospects
        distinguishing_aspect: "The empty-pool fallback is an empty array with total_count 0 and has_more false — an empty result set, not an error and not a 404."
        test_recipe:
          setup:
