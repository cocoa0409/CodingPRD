          CrewQualification is the many-to-many join that makes a pilot usable on a particular lessee's
          procedures, so the same row must be reachable by crew_member_id AND by lease_id, and its
          lifecycle starts at TRAINING - not QUALIFIED - with both training dates still null. The
          status filter must partition rather than merely decorate: the identical lease_id query returns
          the row under status=TRAINING and nothing at all under status=QUALIFIED.
          
