            - "UsageLine.${l_k} has status MATCHED with matched_work_id == ${w0}"

      - name: excluded_stub_dsp_suspend_requires_open_report
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_DSP_NOT_SUSPENDABLE]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / report_submit_requires_dsp_active
          rationale: "The suspend path's precondition (requires a SUBMITTED report) is exercised as setup in the named §1.8 instance; the negative (suspend with no open reports -> ERR_DSP_NOT_SUSPENDABLE) is a trivially implied branch of the same validation and is covered by the instance's precondition replay."

      - name: excluded_stub_hold_expired_boundary
        claim_type: temporal_validation
        grounds: ["errors[ERR_HOLD_EXPIRED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / claim_validation_hold_expiry_boundary
          rationale: "The exact-expiry rejection IS the §1.8 boundary instance's trigger."
