              as_user_id: "juror-1"
            - call: "POST /maker-events/${ev_id}/applications/${app_id}/jury-scores"
              payload: { craftsmanship: 8, originality: 8, booth_presentation: 8 }
              as: Juror
              as_user_id: "juror-2"
            - call: "GET /maker-events/${ev_id}"
              payload: {}
              as: EventCoordinator
