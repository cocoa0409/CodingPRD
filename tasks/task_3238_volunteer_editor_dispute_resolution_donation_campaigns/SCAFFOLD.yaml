scenario: |
  Volunteer Editor Dispute Resolution & Donation Campaigns (Wikimedia Foundation): open editing
  model with volunteer-developed policies on sourcing, neutrality and notability, dispute
  resolution ladder from talk page discussion through noticeboards to an arbitration committee,
  page protection levels and editing restrictions applied to contested topics, conflict-of-interest
  and paid editing disclosure requirements with enforcement, vandalism detection through automated
  tools and volunteer patrolling with rollback rights, banner-driven fundraising campaigns with
  message testing, geographic targeting and frequency capping, grant programs distributing funds
  to affiliates and community projects, legal requests including takedowns and user information
  demands with transparency reporting

domain_name: wiki-governance
api_prefix: /wiki
complexity_profile:
  primary_archetype: "Multi-party negotiation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Temporal windowing"
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: VolunteerEditor
    parent: null
    common_fields: true
    fields:
      - { name: username, type: string, source: input, description: "Public display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: account_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | BLOCKED" }
      - { name: rollback_eligible, type: boolean, source: computed, description: "True when no vandalism warnings in last 90 days" }
      - { name: coi_disclosure_required, type: boolean, source: computed, description: "True when any paid contribution or employer overlap detected" }
      - { name: coi_disclosed, type: boolean, source: input, description: "Editor has filed a COI disclosure", default: false }
      - { name: edit_count, type: integer, source: computed, description: "Total accepted edits across all pages" }

  - name: WikiPage
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Page title" }
      - { name: topic_area, type: enum, source: input, description: "GENERAL | POLITICS | HEALTH | BIOGRAPHY | HISTORY" }
      - { name: protection_level, type: enum, source: system, description: "NONE | SEMI | FULL — gates who may edit" }
      - { name: current_revision_id, type: string, source: system, description: "FK -> Revision.id; latest accepted revision" }
      - { name: content_score, type: number, source: computed, description: "Derived from sourcing, neutrality, and stability metrics" }
      - { name: dispute_level, type: enum, source: computed, description: "NONE | TALK | NOTICE | ARB — derived from open disputes" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Revision
    parent: WikiPage
    common_fields: true
    fields:
      - { name: page_id, type: string, source: system, description: "FK -> WikiPage.id" }
      - { name: editor_id, type: string, source: system, description: "FK -> VolunteerEditor.id" }
      - { name: content_text, type: string, source: input, description: "Raw wikitext content" }
      - { name: summary, type: string, source: input, description: "Edit summary" }
      - { name: status, type: enum, source: system, description: "PENDING | ACCEPTED | REVERTED | FLAGGED" }
      - { name: vandalism_score, type: number, source: computed, description: "Automated vandalism detection score 0-100" }
      - { name: source_quality_score, type: number, source: computed, description: "Sourcing reliability score 0-100" }
      - { name: neutrality_score, type: number, source: computed, description: "Neutrality score 0-100" }

  - name: DisputeCase
    parent: WikiPage
    common_fields: true
    fields:
      - { name: page_id, type: string, source: system, description: "FK -> WikiPage.id" }
      - { name: initiator_id, type: string, source: system, description: "FK -> VolunteerEditor.id" }
      - { name: respondent_id, type: string, source: system, description: "FK -> VolunteerEditor.id" }
      - { name: subject_revision_id, type: string, source: system, description: "FK -> Revision.id under dispute" }
      - { name: dispute_type, type: enum, source: input, description: "CONTENT | CONDUCT | SOURCING | NOTABILITY" }
      - { name: level, type: enum, source: system, description: "TALK | NOTICE | ARBITRATION" }
      - { name: status, type: enum, source: system, description: "OPEN | ESCALATED | RESOLVED | CLOSED" }
      - { name: opened_at, type: datetime, source: system, description: "When dispute was opened" }
      - { name: escalated_at, type: datetime, source: system, description: "When escalated to next level" }
      - { name: resolution_notes, type: string, source: input, description: "Outcome summary" }

  - name: ProtectionRequest
    parent: WikiPage
    common_fields: true
    fields:
      - { name: page_id, type: string, source: system, description: "FK -> WikiPage.id" }
      - { name: requested_by_id, type: string, source: system, description: "FK -> VolunteerEditor.id" }
      - { name: requested_level, type: enum, source: input, description: "SEMI | FULL" }
      - { name: reason, type: string, source: input, description: "Justification for protection" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | EXPIRED" }
      - { name: expires_at, type: datetime, source: system, description: "When protection expires (null for indefinite)" }
      - { name: reviewed_by_id, type: string, source: system, description: "FK -> VolunteerEditor.id of admin who reviewed" }

  - name: VandalismReport
    parent: Revision
    common_fields: true
    fields:
      - { name: revision_id, type: string, source: system, description: "FK -> Revision.id" }
      - { name: reporter_id, type: string, source: system, description: "FK -> VolunteerEditor.id" }
      - { name: report_type, type: enum, source: input, description: "VANDALISM | SPAM | BLP_VIOLATION | COPYVIO" }
      - { name: status, type: enum, source: system, description: "PENDING | CONFIRMED | DISMISSED" }
      - { name: auto_flagged, type: boolean, source: system, description: "True when flagged by automated tool, not volunteer" }
      - { name: rollback_applied, type: boolean, source: system, description: "True when rollback was executed" }

  - name: DonationCampaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: start_at, type: datetime, source: input, description: "Campaign start timestamp" }
      - { name: end_at, type: datetime, source: input, description: "Campaign end timestamp" }
      - { name: target_amount_cents, type: integer, source: input, description: "Fundraising goal" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | PAUSED | COMPLETED | CANCELLED" }
      - { name: raised_cents, type: integer, source: computed, description: "Sum of completed donations" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: CampaignBanner
    parent: DonationCampaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> DonationCampaign.id" }
      - { name: message_variant, type: string, source: input, description: "Banner text variant (A/B testing)" }
      - { name: geo_target, type: string, source: input, description: "ISO country code or GLOBAL" }
      - { name: frequency_cap, type: integer, source: input, description: "Max impressions per user per day" }
      - { name: priority_weight, type: integer, source: input, description: "Selection weight when multiple banners eligible", default: 1 }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | RETIRED" }
      - { name: impression_count, type: integer, source: computed, description: "Total impressions served" }
      - { name: click_count, type: integer, source: computed, description: "Total clicks" }
      - { name: conversion_count, type: integer, source: computed, description: "Total donations attributed" }

  - name: Donation
    parent: DonationCampaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> DonationCampaign.id" }
      - { name: banner_id, type: string, source: system, description: "FK -> CampaignBanner.id that drove donation" }
      - { name: donor_email_hash, type: string, source: input, description: "Hashed donor identifier" }
      - { name: amount_cents, type: integer, source: input, description: "Donation amount" }
      - { name: currency, type: string, source: input, description: "ISO currency code" }
      - { name: status, type: enum, source: system, description: "PLEDGED | COMPLETED | FAILED | REFUNDED" }
      - { name: processed_at, type: datetime, source: system, description: "When payment completed" }

  - name: GrantProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: fiscal_year, type: integer, source: input, description: "Grant cycle year" }
      - { name: budget_cents, type: integer, source: input, description: "Total program budget" }
      - { name: allocated_cents, type: integer, source: computed, description: "Sum of awarded grants" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | ARCHIVED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: GrantApplication
    parent: GrantProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> GrantProgram.id" }
      - { name: applicant_id, type: string, source: system, description: "FK -> VolunteerEditor.id" }
      - { name: project_title, type: string, source: input, description: "Project title" }
      - { name: requested_cents, type: integer, source: input, description: "Amount requested" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | WITHDRAWN" }
      - { name: review_score, type: number, source: computed, description: "Weighted score from reviewers" }
      - { name: awarded_cents, type: integer, source: system, description: "Amount actually awarded (may differ from requested)" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: LegalRequest
    parent: null
    common_fields: true
    fields:
      - { name: request_type, type: enum, source: input, description: "TAKEDOWN | USER_INFO | SUBPOENA | COURT_ORDER" }
      - { name: target_page_id, type: string, source: input, description: "FK -> WikiPage.id when request targets a page" }
      - { name: target_user_id, type: string, source: input, description: "FK -> VolunteerEditor.id when request targets a user" }
      - { name: requesting_party, type: string, source: input, description: "Name of requesting entity" }
      - { name: received_at, type: datetime, source: system, description: "When request was received" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_REVIEW | COMPLIED | REJECTED | PARTIALLY_COMPLIED" }
      - { name: transparency_report_id, type: string, source: system, description: "FK -> TransparencyReport.id once included" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: TransparencyReport
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Reporting period start" }
      - { name: period_end, type: datetime, source: input, description: "Reporting period end" }
      - { name: total_requests, type: integer, source: computed, description: "Count of LegalRequests in period" }
      - { name: complied_count, type: integer, source: computed, description: "Requests with status COMPLIED or PARTIALLY_COMPLIED" }
      - { name: rejected_count, type: integer, source: computed, description: "Requests with status REJECTED" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: ImpressionEvent
    parent: CampaignBanner
    common_fields: true
    fields:
      - { name: banner_id, type: string, source: system, description: "FK -> CampaignBanner.id" }
      - { name: viewer_key, type: string, source: input, description: "Pseudonymous viewer identifier (hashed)" }
      - { name: country_code, type: string, source: input, description: "ISO country code of viewer" }
      - { name: served_at, type: datetime, source: system, description: "When impression was served" }
      - { name: day_bucket, type: string, source: computed, description: "UTC date YYYY-MM-DD derived from served_at, used for frequency-cap counting" }
      - { name: clicked, type: boolean, source: input, description: "Whether the impression resulted in a click", default: false }

state_machines:
  - entity: VolunteerEditor
    initial_state: ACTIVE
    terminal_states: [BLOCKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /editors/{editorId}/suspend"
        actor: Administrator
        preconditions:
          - "Editor has at least one CONFIRMED vandalism report in last 30 days OR undisclosed COI detected"
        side_effects:
          - "All PENDING revisions by editor → FLAGGED"
          - "Editor.rollback_eligible set to false"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /editors/{editorId}/reinstate"
        actor: Administrator
        preconditions:
          - "At least 7 days elapsed since suspension"
          - "No open Arbitration-level disputes against editor"
        side_effects:
          - "Editor.rollback_eligible recalculated from warning history"
      - from: ACTIVE
        to: BLOCKED
        trigger: "POST /editors/{editorId}/block"
        actor: Administrator
        preconditions:
          - "Three or more CONFIRMED vandalism reports in last 90 days, OR court order, OR repeated COI evasion"
        side_effects:
          - "All PENDING revisions by editor → FLAGGED"
          - "All OPEN disputes initiated by editor → CLOSED"
      - from: SUSPENDED
        to: BLOCKED
        trigger: "POST /editors/{editorId}/block"
        actor: Administrator
        preconditions:
          - "Same as ACTIVE → BLOCKED"
        side_effects:
          - "Same as ACTIVE → BLOCKED"

  - entity: Revision
    initial_state: PENDING
    terminal_states: [ACCEPTED, REVERTED, FLAGGED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /revisions/{revisionId}/accept"
        actor: "VolunteerEditor with rollback_eligible OR Administrator"
        preconditions:
          - "vandalism_score < 50"
          - "Page protection_level permits editor (NONE: any; SEMI: account_age >= 4 days; FULL: Administrator only)"
          - "No open Arbitration-level dispute on page"
        side_effects:
          - "WikiPage.current_revision_id updated"
          - "WikiPage.content_score recalculated"
          - "VolunteerEditor.edit_count incremented"
      - from: PENDING
        to: FLAGGED
        trigger: "POST /revisions/{revisionId}/flag"
        actor: "VolunteerEditor with rollback_eligible OR Administrator OR system"
        preconditions:
          - "vandalism_score >= 50 OR report_type in {VANDALISM, SPAM, BLP_VIOLATION, COPYVIO}"
        side_effects:
          - "VandalismReport created with auto_flagged per trigger source"
      - from: FLAGGED
        to: REVERTED
        trigger: "POST /revisions/{revisionId}/revert"
        actor: "VolunteerEditor with rollback_eligible OR Administrator"
        preconditions:
          - "VandalismReport.status == CONFIRMED"
        side_effects:
          - "WikiPage.current_revision_id rolled back to prior ACCEPTED revision"
          - "WikiPage.content_score recalculated"
          - "VandalismReport.rollback_applied set to true"
      - from: FLAGGED
        to: ACCEPTED
        trigger: "POST /revisions/{revisionId}/accept"
        actor: Administrator
        preconditions:
          - "VandalismReport.status == DISMISSED"
        side_effects:
          - "WikiPage.current_revision_id updated"
          - "WikiPage.content_score recalculated"
          - "VolunteerEditor.edit_count incremented"

  - entity: DisputeCase
    initial_state: OPEN
    terminal_states: [RESOLVED, CLOSED]
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /disputes/{disputeId}/escalate"
        actor: "Initiator, Respondent, or Administrator"
        preconditions:
          - "Current level is TALK or NOTICE"
          - "At least 72 hours elapsed since opened_at OR since last escalation"
          - "No resolution reached at current level"
        side_effects:
          - "level advances TALK → NOTICE → ARBITRATION"
          - "escalated_at updated"
          - "If level becomes ARBITRATION, WikiPage.dispute_level set to ARB and page auto-protected FULL"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /disputes/{disputeId}/resolve"
        actor: Administrator
        preconditions:
          - "resolution_notes provided"
        side_effects:
          - "If level was ARBITRATION, WikiPage.dispute_level recalculated from remaining open disputes"
      - from: OPEN
        to: CLOSED
        trigger: "POST /disputes/{disputeId}/close"
        actor: Administrator
        preconditions:
          - "Initiator account is BLOCKED or WITHDRAWN"
        side_effects:
          - "Same recalculation as RESOLVED"

  - entity: ProtectionRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /protection-requests/{requestId}/approve"
        actor: Administrator
        preconditions:
          - "Page has at least 3 FLAGGED revisions in last 7 days OR open Arbitration dispute"
          - "Requested level SEMI or FULL"
        side_effects:
          - "WikiPage.protection_level set to requested_level"
          - "If expires_at provided, system auto-transitions to EXPIRED at that time"
      - from: PENDING
        to: DENIED
        trigger: "POST /protection-requests/{requestId}/deny"
        actor: Administrator
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system at expires_at"
        actor: system
        preconditions:
          - "expires_at reached"
        side_effects:
          - "WikiPage.protection_level reverted to prior level (or NONE if none)"

  - entity: DonationCampaign
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /campaigns/{campaignId}/activate"
        actor: FundraisingManager
        preconditions:
          - "start_at <= current time <= end_at"
          - "At least one ACTIVE banner configured"
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /campaigns/{campaignId}/pause"
        actor: FundraisingManager
        preconditions: []
        side_effects:
          - "All CampaignBanner.status set to PAUSED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /campaigns/{campaignId}/activate"
        actor: FundraisingManager
        preconditions:
          - "current time <= end_at"
        side_effects:
          - "All CampaignBanner.status set back to ACTIVE"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /campaigns/{campaignId}/complete"
        actor: FundraisingManager
        preconditions:
          - "current time > end_at OR raised_cents >= target_amount_cents"
        side_effects:
          - "All CampaignBanner.status set to RETIRED"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /campaigns/{campaignId}/cancel"
        actor: FundraisingManager
        preconditions: []
        side_effects:
          - "All CampaignBanner.status set to RETIRED"
          - "All PLEDGED donations → FAILED"

  - entity: Donation
    initial_state: PLEDGED
    terminal_states: [COMPLETED, FAILED, REFUNDED]
    transitions:
      - from: PLEDGED
        to: COMPLETED
        trigger: "POST /donations/{donationId}/process"
        actor: PaymentProcessor
        preconditions:
          - "Campaign status == ACTIVE"
          - "Banner status == ACTIVE"
        side_effects:
          - "DonationCampaign.raised_cents incremented by amount_cents"
          - "CampaignBanner.conversion_count incremented"
          - "CampaignBanner.impression_count NOT incremented (impression tracked separately)"
      - from: PLEDGED
        to: FAILED
        trigger: "POST /donations/{donationId}/fail"
        actor: PaymentProcessor
        preconditions: []
        side_effects: []
      - from: COMPLETED
        to: REFUNDED
        trigger: "POST /donations/{donationId}/refund"
        actor: FundraisingManager
        preconditions:
          - "Within 90 days of processed_at"
        side_effects:
          - "DonationCampaign.raised_cents decremented by amount_cents"
          - "CampaignBanner.conversion_count decremented"

  - entity: GrantApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /grants/{applicationId}/start-review"
        actor: GrantReviewer
        preconditions:
          - "GrantProgram.status == OPEN"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /grants/{applicationId}/approve"
        actor: GrantReviewer
        preconditions:
          - "review_score >= 70"
          - "GrantProgram.allocated_cents + awarded_cents <= budget_cents"
          - "awarded_cents > 0"
        side_effects:
          - "GrantProgram.allocated_cents incremented by awarded_cents"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /grants/{applicationId}/reject"
        actor: GrantReviewer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /grants/{applicationId}/withdraw"
        actor: "Applicant (VolunteerEditor)"
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /grants/{applicationId}/withdraw"
        actor: "Applicant (VolunteerEditor)"
        preconditions: []
        side_effects: []

  - entity: LegalRequest
    initial_state: RECEIVED
    terminal_states: [COMPLIED, REJECTED, PARTIALLY_COMPLIED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /legal-requests/{requestId}/start-review"
        actor: LegalCounsel
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: COMPLIED
        trigger: "POST /legal-requests/{requestId}/comply"
        actor: LegalCounsel
        preconditions:
          - "request_type in {TAKEDOWN, USER_INFO, SUBPOENA, COURT_ORDER}"
          - "For TAKEDOWN: target page exists and has no open Arbitration dispute"
          - "For USER_INFO: court order or subpoena present"
        side_effects:
          - "If TAKEDOWN: WikiPage.protection_level set to FULL"
          - "If target_page_id set: page revisions locked"
      - from: UNDER_REVIEW
        to: PARTIALLY_COMPLIED
        trigger: "POST /legal-requests/{requestId}/partially-comply"
        actor: LegalCounsel
        preconditions:
          - "Same as COMPLIED but scope narrowed"
        side_effects:
          - "Same as COMPLIED but limited to specified scope"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /legal-requests/{requestId}/reject"
        actor: LegalCounsel
        preconditions: []
        side_effects: []

  - entity: TransparencyReport
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /transparency-reports/{reportId}/publish"
        actor: LegalCounsel
        preconditions:
          - "All LegalRequests in period have terminal status (COMPLIED, REJECTED, PARTIALLY_COMPLIED)"
          - "total_requests, complied_count, rejected_count recalculated"
        side_effects:
          - "LegalRequest.transparency_report_id set for all included requests"

calculations:
  - name: page_content_score
    trigger: "Revision accepted or reverted"
    algorithm: weighted_scoring
    formula: |
      content_score = round_half_up(
        0.4 * source_quality_score +
        0.4 * neutrality_score +
        0.2 * stability_bonus
      )
      where stability_bonus = 100 if no disputes in last 30 days else 50 if only TALK-level else 0
    input_set: "All ACCEPTED revisions for the page in the last 30 days"
    precision: "0 decimal places, integer 0-100"

  - name: editor_rollback_eligibility
    trigger: "VandalismReport confirmed or dismissed, or daily batch"
    algorithm: threshold
    formula: |
      confirmed_reports_90d = count(VandalismReport where editor_id = target AND status = CONFIRMED AND created_at >= now - 90 days)
      rollback_eligible = (confirmed_reports_90d == 0)
    input_set: "VandalismReports for the editor"
    precision: "boolean"

  - name: campaign_banner_selection
    trigger: "Page view with donation banner slot"
    algorithm: weighted_scoring
    formula: |
      eligible_banners = banners where campaign.status == ACTIVE AND banner.status == ACTIVE
        AND (banner.geo_target == "GLOBAL" OR banner.geo_target == viewer_country)
        AND count(ImpressionEvent where banner_id = banner.id AND viewer_key = viewer AND day_bucket = today) < banner.frequency_cap
      if eligible_banners is empty: no banner shown
      rank by priority_weight DESC; tie-break by banner.created_at ASC (earliest created wins); never by id
    input_set: "All CampaignBanners for ACTIVE campaigns"
    precision: "deterministic selector: priority_weight DESC, created_at ASC"

  - name: banner_conversion_rate_bp
    trigger: "GET /wiki/banners/{bannerId} — computed on read"
    algorithm: aggregation
    formula: |
      impressions = max(banner.impression_count, 1)  # denominator floor of 1 to avoid division by zero
      raw_bp = banner.conversion_count * 10000 / impressions
    input_set: "Single CampaignBanner"
    precision: "see variants"
    variants:
      - name: truncated
        when: "reported on banner detail reads (operational dashboards)"
        difference: "result truncated toward zero to integer basis points: conversion_rate_bp = floor(conversion_count * 10000 / max(impression_count, 1))"
      - name: rounded
        when: "reported in campaign completion summaries"
        difference: "result rounded half-up to integer basis points: conversion_rate_bp = round_half_up(conversion_count * 10000 / max(impression_count, 1))"

  - name: grant_review_score
    trigger: "GrantApplication review submitted"
    algorithm: weighted_scoring
    formula: |
      review_score = round_half_up(
        0.3 * impact_score +
        0.3 * feasibility_score +
        0.2 * budget_reasonableness_score +
        0.2 * community_support_score
      )
      where each sub-score is 0-100 from reviewer input
    input_set: "Single GrantApplication"
    precision: "0 decimal places, integer 0-100"

  - name: grant_budget_check
    trigger: "GrantApplication approval attempt"
    algorithm: threshold
    formula: |
      if program.allocated_cents + application.awarded_cents > program.budget_cents:
        reject with ERR_GRANT_BUDGET_EXCEEDED
    input_set: "GrantProgram and GrantApplication"
    precision: "integer cents"

  - name: vandalism_score
    trigger: "Revision created"
    algorithm: weighted_scoring
    formula: |
      vandalism_score = min(100, base_score + keyword_score + pattern_score + editor_history_score)
      where base_score = 10 for new pages, 5 for existing
      keyword_score = 30 if spam keywords detected else 0
      pattern_score = 40 if mass deletion or blanking detected else 0
      editor_history_score = 20 if editor has prior confirmed vandalism else 0
    input_set: "Revision content and editor history"
    precision: "integer 0-100"

  - name: transparency_report_aggregation
    trigger: "TransparencyReport publish"
    algorithm: aggregation
    formula: |
      total_requests = count(LegalRequest where received_at in [period_start, period_end))
      complied_count = count(LegalRequest where status in {COMPLIED, PARTIALLY_COMPLIED})
      rejected_count = count(LegalRequest where status = REJECTED)
    input_set: "All LegalRequests with received_at in period"
    precision: "integer counts"

  - name: revision_acceptance_threshold
    trigger: "POST /wiki/revisions/{revisionId}/accept — decides whether a non-admin editor may accept"
    algorithm: threshold
    formula: |
      composite = 0.5 * source_quality_score + 0.5 * neutrality_score
      auto_acceptable = (vandalism_score < 50) AND (composite >= threshold)
    input_set: "Single Revision"
    precision: "see variants"
    variants:
      - name: provisional
        when: "revision in PENDING with no open dispute on the page"
        difference: "threshold = 40 — lenient bar for uncontested pages"
      - name: final
        when: "revision on a page with an open NOTICE- or ARBITRATION-level dispute"
        difference: "threshold = 70 — strict bar for contested pages; identical scores produce a different accept/reject outcome"

  - name: campaign_net_revenue_allocation
    trigger: "DonationCampaign completion — allocates raised_cents across banners proportionally to conversions, with a 3% processing fee"
    algorithm: waterfall_allocation
    formula: |
      # Nested rounding: order matters and is pinned.
      # Step 1 (per banner, round first): fee_cents(b) = round_half_up(attributed_cents(b) * 0.03)
      # Step 2 (per banner): net_cents(b) = attributed_cents(b) - fee_cents(b)
      # Step 3 (sum the rounded per-banner nets): total_net_cents = sum(net_cents(b) for all banners)
      # attributed_cents(b) = sum(amount_cents of COMPLETED donations with banner_id = b.id)
      # The scaffold pins per-banner-round-then-sum; the alternative (sum-then-round)
      # yields a different total and is FORBIDDEN.
    input_set: "All CampaignBanners of the campaign and their COMPLETED donations (status REFUNDED excluded)"
    precision: "integer cents, round_half_up applied per banner before summation"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and valid"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role permitted for this operation"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Referenced resource IDs exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or body IDs"

  - priority: 4
    category: state
    check: "Resource in correct state for requested operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 5
    category: business_safety
    check: "COI disclosure required before editing pages in declared conflict areas"
    error_id: ERR_COI_UNDISCLOSED
    http_status: 403
    applies_to: "POST /revisions when editor.coi_disclosure_required and not coi_disclosed"

  - priority: 6
    category: business_safety
    check: "Page protection level permits editor"
    error_id: ERR_PROTECTION_BLOCKED
    http_status: 403
    applies_to: "POST /revisions, POST /revisions/{id}/accept"

  - priority: 7
    category: business_constraint
    check: "Dispute escalation timing: 72 hours minimum between levels"
    error_id: ERR_ESCALATION_TOO_SOON
    http_status: 409
    applies_to: "POST /disputes/{id}/escalate"

  - priority: 8
    category: business_constraint
    check: "Grant budget not exceeded"
    error_id: ERR_GRANT_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /grants/{id}/approve"

  - priority: 9
    category: business_fiscal
    check: "Campaign active and banner active for donation processing"
    error_id: ERR_CAMPAIGN_INACTIVE
    http_status: 409
    applies_to: "POST /donations/{id}/process"

  - priority: 10
    category: business_temporal
    check: "Donation refund within 90 days"
    error_id: ERR_REFUND_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /donations/{id}/refund"

  - priority: 11
    category: business_referential
    check: "Cannot block editor with open Arbitration disputes as initiator"
    error_id: ERR_EDITOR_HAS_OPEN_ARBITRATION
    http_status: 409
    applies_to: "POST /editors/{id}/block"

  - priority: 12
    category: business_referential
    check: "Cannot publish transparency report with non-terminal legal requests"
    error_id: ERR_LEGAL_REQUESTS_PENDING
    http_status: 409
    applies_to: "POST /transparency-reports/{id}/publish"

