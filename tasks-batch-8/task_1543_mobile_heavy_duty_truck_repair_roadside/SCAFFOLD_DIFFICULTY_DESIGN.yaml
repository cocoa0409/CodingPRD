            - { call: "POST /roadside/service-calls/${sc}/dispatches", payload: { technician_id: "${t2}", window_start_at: "2026-08-04T09:00:00Z", window_end_at: "2026-08-04T13:00:00Z", planned_travel_miles: 20, expected_service_call_version: "${sc_v}" }, as: Dispatcher, captures: { d1: $.data.id } }
            - { call: "POST /roadside/dispatches/${d1}/accept", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/dispatches/${d1}/depart", payload: {}, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:40:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/dispatches/${d1}/arrive", payload: { actual_travel_miles: 20 }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${sc}/diagnose", payload: { diagnosis_summary: "alternator", resolution_path: "ON_SITE_REPAIR" }, as: Technician, as_user_id: "${t2}" }
            - { call: "POST /roadside/service-calls/${sc}/start-repair", payload: {}, as: Technician, as_user_id: "${t2}" }
          trigger:
            - { call: "POST /roadside/service-calls/${sc}/part-usages", payload: { van_stock_item_id: "${vs}", qty: 4 }, as: Technician, as_user_id: "${t2}", captures: { pu: $.data.id } }
            - { call: "GET /roadside/van-stock/${vs}", as: Technician, as_user_id: "${t2}", captures: { onhand_used: $.data.qty_on_hand } }
            - { call: "POST /roadside/part-usages/${pu}/return", payload: {}, as: Technician, as_user_id: "${t2}", captures: { pu_status: $.data.status } }
            - { call: "GET /roadside/van-stock/${vs}", as: Technician, as_user_id: "${t2}", captures: { onhand_after: $.data.qty_on_hand } }
