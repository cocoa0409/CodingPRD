            - { call: "POST /payment-integrity/review-tasks/${txa_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "XRB", provider_id: "${pxr_id}", member_id: "M-XRB", claim_type: PROFESSIONAL, total_billed_cents: 30000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pxr_id}", captures: { cxb_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cxb_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 30000 }, as: Provider, as_user_id: "${pxr_id}" }
            - { call: "POST /payment-integrity/claims/${cxb_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cxb_id}" }, as: Any, captures: { txb_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${txb_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${txb_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "GET /payment-integrity/claims/${cxa_id}/edit-hits", payload: {}, as: Any, captures: { hxa_id: "$.data[0].id" } }
            - { call: "GET /payment-integrity/claims/${cxb_id}", payload: {}, as: Any, captures: { cxb_v: $.data.version } }
          trigger:
            - { call: "POST /payment-integrity/claims/${cxb_id}/disputes", payload: { edit_hit_id: "${hxa_id}", reason: "wrong claim", expected_claim_version: "${cxb_v}" }, as: Provider, as_user_id: "${pxr_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_HIT_NOT_ON_CLAIM (422): hit ${hxa_id} belongs to claim ${cxa_id}, not ${cxb_id}"

      - name: invalid_enum_claim_type_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "Enum closure: claim_type 'COSMIC' is not in {PROFESSIONAL, INSTITUTIONAL_INPATIENT, INSTITUTIONAL_OUTPATIENT} and fails schema validation with ERR_INVALID_ENUM."
        test_recipe:
          setup: ["provider exists"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-EN", name: "Enum Prov" }, as: PlanAdmin, captures: { pen_id: $.data.id } }
          trigger:
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "EN1", provider_id: "${pen_id}", member_id: "M-EN1", claim_type: COSMIC, total_billed_cents: 1000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pen_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ENUM (400); no claim created"

      - name: unknown_drg_code_at_screening_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_DRG_CODE_UNKNOWN]
        distinguishing_aspect: "DRG table closure: an inpatient claim carrying drg_code '999' (not a key of DRG_WEIGHTS) fails at run-edits with ERR_DRG_CODE_UNKNOWN."
        test_recipe:
          setup: ["provider; inpatient claim drg 999 with matching line"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-DG", name: "Drg Prov" }, as: PlanAdmin, captures: { pdg_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "DG1", provider_id: "${pdg_id}", member_id: "M-DG1", claim_type: INSTITUTIONAL_INPATIENT, total_billed_cents: 500000, service_from: "2026-07-01T00:00:00Z", service_to: "2026-07-05T00:00:00Z", admission_date: "2026-07-01T00:00:00Z", discharge_date: "2026-07-05T00:00:00Z", drg_code: "999", discharge_disposition: HOME }, as: Provider, as_user_id: "${pdg_id}", captures: { cdg_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cdg_id}/lines", payload: { line_number: 1, procedure_code: "REV-010", billed_cents: 500000 }, as: Provider, as_user_id: "${pdg_id}" }
          trigger:
            - { call: "POST /payment-integrity/claims/${cdg_id}/run-edits", payload: {}, as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "run-edits fails with error_id == ERR_DRG_CODE_UNKNOWN (422); claim stays RECEIVED"

      - name: partial_dispute_release_out_of_range
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors[ERR_INVALID_RELEASE_AMOUNT]
        distinguishing_aspect: "PARTIAL release must satisfy 0 < released_cents <= attributed (60000): released 60001 and released 0 both fail with ERR_INVALID_RELEASE_AMOUNT, leaving the dispute UNDER_REVIEW."
        test_recipe:
          setup: ["provider; edit ACTIVE; claim 60000 upheld -> DENIED; dispute UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-RA", name: "Range Prov" }, as: PlanAdmin, captures: { pra_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "RA-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rra_id: $.data.id, rra_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rra_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vra_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vra_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vra_id}/approve", payload: { expected_edit_rule_version: "${rra_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "RA1", provider_id: "${pra_id}", member_id: "M-RA1", claim_type: PROFESSIONAL, total_billed_cents: 60000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pra_id}", captures: { cra_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cra_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 60000 }, as: Provider, as_user_id: "${pra_id}" }
            - { call: "POST /payment-integrity/claims/${cra_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cra_id}" }, as: Any, captures: { tra_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${tra_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${tra_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "GET /payment-integrity/claims/${cra_id}", payload: {}, as: Any, captures: { cra_v: $.data.version } }
            - { call: "GET /payment-integrity/claims/${cra_id}/edit-hits", payload: {}, as: Any, captures: { hra_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/claims/${cra_id}/disputes", payload: { edit_hit_id: "${hra_id}", reason: "partial", expected_claim_version: "${cra_v}" }, as: Provider, as_user_id: "${pra_id}", captures: { dra_id: $.data.id } }
            - { call: "POST /payment-integrity/disputes/${dra_id}/start-review", payload: {}, as: DisputeAdjudicator, as_user_id: adj-1 }
          trigger:
            - { call: "POST /payment-integrity/disputes/${dra_id}/decide", payload: { outcome: PARTIAL, released_cents: 60001 }, as: DisputeAdjudicator, as_user_id: adj-1, captures: { err1: $.data.error_id } }
            - { call: "POST /payment-integrity/disputes/${dra_id}/decide", payload: { outcome: PARTIAL, released_cents: 0 }, as: DisputeAdjudicator, as_user_id: adj-1, captures: { err2: $.data.error_id } }
          assert:
            - "released_cents 60001 (> attributed 60000) -> ERR_INVALID_RELEASE_AMOUNT (422)"
            - "released_cents 0 -> ERR_INVALID_RELEASE_AMOUNT (422)"
            - "Dispute.${dra_id} remains UNDER_REVIEW after both failures"

      - name: duplicate_period_key_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_PERIOD_KEY]
        distinguishing_aspect: "SavingsPeriod period_key uniqueness: the second create with '2026-08' fails with ERR_DUPLICATE_PERIOD_KEY."
        test_recipe:
          setup: ["period 2026-08 exists"]
          setup_api_calls:
            - { call: "POST /payment-integrity/savings-periods", payload: { period_key: "2026-08" }, as: PlanAdmin, captures: { spx_id: $.data.id } }
          trigger:
            - { call: "POST /payment-integrity/savings-periods", payload: { period_key: "2026-08" }, as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "second create returns error_id == ERR_DUPLICATE_PERIOD_KEY (409); the original period is untouched"

      - name: claim_lines_locked_after_screening
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_CLAIM_LINES_LOCKED]
        distinguishing_aspect: "Lines are frozen once screening runs: adding a line to a READY_TO_PAY claim fails with ERR_CLAIM_LINES_LOCKED."
        test_recipe:
          setup: ["provider; claim 5000 with one line, screened clean to READY_TO_PAY"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-LK", name: "Lock Prov" }, as: PlanAdmin, captures: { plk_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "LK1", provider_id: "${plk_id}", member_id: "M-LK1", claim_type: PROFESSIONAL, total_billed_cents: 5000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${plk_id}", captures: { clk_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${clk_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 5000 }, as: Provider, as_user_id: "${plk_id}" }
            - { call: "POST /payment-integrity/claims/${clk_id}/run-edits", payload: {}, as: PlanAdmin }
          trigger:
            - { call: "POST /payment-integrity/claims/${clk_id}/lines", payload: { line_number: 2, procedure_code: "99214", billed_cents: 100 }, as: Provider, as_user_id: "${plk_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_LINES_LOCKED (409); the claim still has exactly one line"

      - name: ibr_complete_from_requested_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_IBR_NOT_COMPLETABLE]
        distinguishing_aspect: "State-gated action: complete is declared only from IN_AUDIT; calling it on a REQUESTED review (documents never received) fails with ERR_IBR_NOT_COMPLETABLE."
        test_recipe:
          setup: ["provider; high-dollar claim screened -> PENDED with auto IBR in REQUESTED"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-IC", name: "Ibr Prov" }, as: PlanAdmin, captures: { pic_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "IC1", provider_id: "${pic_id}", member_id: "M-IC1", claim_type: PROFESSIONAL, total_billed_cents: 10000000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pic_id}", captures: { cic_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cic_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 10000000 }, as: Provider, as_user_id: "${pic_id}" }
            - { call: "POST /payment-integrity/claims/${cic_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/itemized-bill-reviews", payload: { claim_id: "${cic_id}" }, as: Any, captures: { iic_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /payment-integrity/itemized-bill-reviews/${iic_id}/complete", payload: { findings_cents: 0 }, as: SeniorReviewer, as_user_id: senior-1, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_IBR_NOT_COMPLETABLE (409); IBR remains REQUESTED"

      - name: inpatient_decide_from_open_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_INPATIENT_REVIEW_NOT_DECIDABLE]
        distinguishing_aspect: "decide requires FINDINGS_RECORDED; on an OPEN review it fails with ERR_INPATIENT_REVIEW_NOT_DECIDABLE."
        test_recipe:
          setup: ["provider; inpatient claim (DRG 193) screened -> PENDED with DRG_VALIDATION review OPEN"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-ID", name: "Inp Prov" }, as: PlanAdmin, captures: { pid_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "ID1", provider_id: "${pid_id}", member_id: "M-ID1", claim_type: INSTITUTIONAL_INPATIENT, total_billed_cents: 500000, service_from: "2026-07-01T00:00:00Z", service_to: "2026-07-05T00:00:00Z", admission_date: "2026-07-01T00:00:00Z", discharge_date: "2026-07-05T00:00:00Z", drg_code: "193", discharge_disposition: HOME }, as: Provider, as_user_id: "${pid_id}", captures: { cid_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cid_id}/lines", payload: { line_number: 1, procedure_code: "REV-010", billed_cents: 500000 }, as: Provider, as_user_id: "${pid_id}" }
            - { call: "POST /payment-integrity/claims/${cid_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/inpatient-reviews", payload: { claim_id: "${cid_id}" }, as: Any, captures: { rid_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /payment-integrity/inpatient-reviews/${rid_id}/decide", payload: { outcome: NO_CHANGE }, as: SeniorReviewer, as_user_id: senior-1, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_INPATIENT_REVIEW_NOT_DECIDABLE (409); review remains OPEN"

      - name: period_finalize_from_open_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_PERIOD_NOT_FINALIZABLE]
        distinguishing_aspect: "finalize requires RECONCILING; calling it on an OPEN period fails with ERR_PERIOD_NOT_FINALIZABLE."
        test_recipe:
          setup: ["period 2026-08 created (OPEN)"]
          setup_api_calls:
            - { call: "POST /payment-integrity/savings-periods", payload: { period_key: "2026-08" }, as: PlanAdmin, captures: { spf_id: $.data.id } }
          trigger:
            - { call: "POST /payment-integrity/savings-periods/${spf_id}/finalize", payload: {}, as: PlanAdmin, captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_PERIOD_NOT_FINALIZABLE (409); period remains OPEN"
  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: vendor_edit_map_cross_reference
        claim_type: cross_reference_link
        grounds:
          - entities.VendorEdit.fields.mapped_edit_rule_id
          - entities.VendorEdit.fields.comparison_status
        distinguishing_aspect: "Mapping links a VendorEdit to an existing EditRule and records the duplication verdict; the mapped record is then discoverable through the comparison_status filter."
        test_recipe:
          setup: ["edit rule RV (VENDOR source) exists; VendorEdit ingested UNMAPPED"]
          setup_api_calls:
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "VE-01", category: CODING, source: VENDOR }, as: EditLibrarian, as_user_id: librarian-1, captures: { rve_id: $.data.id } }
            - { call: "POST /payment-integrity/vendor-edits", payload: { vendor_name: "EditCorp", vendor_edit_key: "EC-200" }, as: PlanAdmin, captures: { ve2_id: $.data.id, ve2_st: $.data.comparison_status } }
          trigger:
            - { call: "POST /payment-integrity/vendor-edits/${ve2_id}/map", payload: { edit_rule_id: "${rve_id}", comparison_status: COMPLEMENTARY }, as: PaymentIntegrityAnalyst, as_user_id: analyst-1, captures: { ve2_map: $.data.mapped_edit_rule_id, ve2_cst: $.data.comparison_status } }
            - { call: "GET /payment-integrity/vendor-edits", payload: { comparison_status: COMPLEMENTARY }, as: Any }
          assert:
            - "VendorEdit.${ve2_id} starts UNMAPPED with mapped_edit_rule_id null"
            - "after map: mapped_edit_rule_id == ${rve_id} and comparison_status == COMPLEMENTARY"
            - "GET /vendor-edits?comparison_status=COMPLEMENTARY contains ${ve2_id}"

      - name: review_tasks_filtered_by_claim_and_status
        claim_type: computed_read
        grounds:
          - entities.ReviewTask.fields.claim_id
          - entities.ReviewTask.fields.status
        distinguishing_aspect: "The multi-FK filtered list composes filters: claim_id + status=PENDING returns exactly the open task of that claim and nothing from a sibling claim."
        test_recipe:
          setup: ["provider; edit ACTIVE; claims F1 and F2 (10000 each) each with one PENDING task"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-FL", name: "Filter Prov" }, as: PlanAdmin, captures: { pfl_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "FL-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rfl_id: $.data.id, rfl_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rfl_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vfl_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vfl_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${vfl_id}/approve", payload: { expected_edit_rule_version: "${rfl_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "F1", provider_id: "${pfl_id}", member_id: "M-F1", claim_type: PROFESSIONAL, total_billed_cents: 10000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pfl_id}", captures: { cf1_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cf1_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 10000 }, as: Provider, as_user_id: "${pfl_id}" }
            - { call: "POST /payment-integrity/claims/${cf1_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "F2", provider_id: "${pfl_id}", member_id: "M-F2", claim_type: PROFESSIONAL, total_billed_cents: 10000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pfl_id}", captures: { cf2_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${cf2_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 10000 }, as: Provider, as_user_id: "${pfl_id}" }
            - { call: "POST /payment-integrity/claims/${cf2_id}/run-edits", payload: {}, as: PlanAdmin }
          trigger:
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${cf1_id}", status: PENDING }, as: Any, captures: { tf1_only: "$.data[0].claim_id" } }
          assert:
            - "GET /review-tasks?claim_id=${cf1_id}&status=PENDING returns total_count 1 and the row's claim_id == ${cf1_id}"
            - "the same filter with claim_id=${cf2_id} returns a different task id (no bleed across claims)"

  # =========================================================================
  # Section: errors
  # =========================================================================
  - section: errors
    instances:
      - name: request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A call without X-User-Role / X-User-ID headers fails authentication (401 ERR_UNAUTHENTICATED) before any role, schema, or existence check."
        test_recipe:
          setup: ["any resource exists (provider) so that later checks would otherwise pass"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-AU", name: "Auth Prov" }, as: PlanAdmin, captures: { pau_id: $.data.id } }
          trigger:
            - { call: "GET /payment-integrity/providers/${pau_id}", payload: {}, as: Any }
          assert:
            - "with the auth headers omitted the response is http 401, error_id == ERR_UNAUTHENTICATED (the test sends no X-User-Role / X-User-ID)"

      - name: error_response_envelope_shape
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CLAIM_NOT_FOUND]
        distinguishing_aspect: "Every error body follows the fixed envelope: response_type == 'error' with data.error_id and data.message keys populated."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /payment-integrity/claims/00000000-0000-0000-0000-000000000000", payload: {}, as: Any, captures: { env_id: $.data.error_id, env_msg: $.data.message } }
          assert:
            - "response_type == 'error', data.error_id == 'ERR_CLAIM_NOT_FOUND', and data.message is a non-empty string"

  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: provider_cannot_approve_edit_version
        claim_type: role_denied
        grounds:
          - errors[ERR_UNAUTHORIZED_ROLE]
          - roles.EditApprover
        distinguishing_aspect: "approve is exclusive to EditApprover; the Provider role is rejected with ERR_UNAUTHORIZED_ROLE before any business logic runs."
        test_recipe:
          setup: ["provider; edit rule with a PENDING_APPROVAL version"]
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-RB1", name: "Rbac Prov" }, as: PlanAdmin, captures: { prb1_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "RB-01", category: POLICY, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rrb1_id: $.data.id, rrb1_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rrb1_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { vrb1_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${vrb1_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
          trigger:
            - { call: "POST /payment-integrity/edit-versions/${vrb1_id}/approve", payload: { expected_edit_rule_version: "${rrb1_v}" }, as: Provider, as_user_id: "${prb1_id}", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (403); version stays PENDING_APPROVAL"

      - name: librarian_cannot_approve_version
        claim_type: role_denied
        grounds:
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "The author role cannot self-approve even with a different user id: EditLibrarian is not in the approve endpoint's role list at all (role-level denial, distinct from the SoD user-level denial)."
        test_recipe:
          setup: ["edit rule with a PENDING_APPROVAL version"]
          setup_api_calls:
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "RB-02", category: POLICY, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rrb2_id: $.data.id, rrb2_v: $.data.version } }
