            - "CertificateGrant.${cert}.consumed_volume_kg == 0.0 after recall (${cons2}) — charge and restore are exact inverses"
            - "batch terminal: ${b_st2} == RECALLED; invariant consumed == sum(charged kg over RELEASED batches) holds (empty set -> 0.0)"
