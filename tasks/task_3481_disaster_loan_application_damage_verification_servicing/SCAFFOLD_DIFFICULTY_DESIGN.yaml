# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3481_disaster_loan_application_damage_verification_servicing
# 9 rules x 2 instances = 18 instances. Every recipe replays against
# SCAFFOLD.yaml §1.1-§1.7 only. Money is integer cents.
# Canonical shared fixture: declaration DR-4821, declared 2026-10-01T00:00:00Z,
#   physical_filing_deadline 2026-12-30T00:00:00Z,
#   economic_injury_filing_deadline 2027-06-28T00:00:00Z,
#   county 06037 eligible for both purposes, county 06059 ECONOMIC_INJURY only.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: valuation_basis_rcv_vs_acv_divergence
        grounds:
          - calculations.verified_loss_calc
          - entities.DamageVerification.fields.valuation_basis
          - entities.DamageVerification.fields.verified_loss_cents
        distinguishing_aspect: "Two valuation variants on the DamageVerification entity domain: identical assessed_loss_cents (30000000) and zero insurance yield verified_loss_cents 30000000 under REPLACEMENT_COST but 24000000 under ACTUAL_CASH_VALUE at depreciation_pct 0.20."
        test_recipe:
          setup:
            - "Clock at 2026-10-02T00:00:00Z (after declared_date, before both deadlines)."
            - "Declaration DR-4821 covering county 06037 for PHYSICAL_DAMAGE."
            - "Two BUSINESS applicants; two SUBMITTED physical applications (requested 30000000) that both passed credit review into VERIFICATION."
            - "V1 opened as INSPECTION/REPLACEMENT_COST; V2 as INSPECTION/ACTUAL_CASH_VALUE with depreciation_pct 0.20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }, { county_fips: "06059", eligible_purposes: ["ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Biz One", email: "b1@x.com", applicant_type: "BUSINESS", annual_income_cents: 120000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { b1_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 30000000 }
              as: Applicant
              as_user_id: "${b1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app1_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${b1_id}"
            - call: "POST /disaster-relief/loan-applications/${app1_id}/credit-reviews"
              payload: { credit_score: 700, verified_monthly_debt_cents: 100000 }
              as: LoanOfficer
            - call: "POST /disaster-relief/loan-applications/${app1_id}/damage-verifications"
              payload: { method: "INSPECTION", valuation_basis: "REPLACEMENT_COST" }
              as: LossVerifier
              captures: { v1_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Biz Two", email: "b2@x.com", applicant_type: "BUSINESS", annual_income_cents: 120000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { b2_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 30000000 }
              as: Applicant
              as_user_id: "${b2_id}"
              captures: { app2_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app2_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${b2_id}"
            - call: "POST /disaster-relief/loan-applications/${app2_id}/credit-reviews"
              payload: { credit_score: 700, verified_monthly_debt_cents: 100000 }
              as: LoanOfficer
            - call: "POST /disaster-relief/loan-applications/${app2_id}/damage-verifications"
              payload: { method: "INSPECTION", valuation_basis: "ACTUAL_CASH_VALUE", depreciation_pct: 0.20 }
              as: LossVerifier
              captures: { v2_id: $.data.id }
          trigger:
            - call: "POST /disaster-relief/damage-verifications/${v1_id}/complete"
              payload: { assessed_loss_cents: 30000000, insurance_proceeds_cents: 0 }
              as: LossVerifier
            - call: "POST /disaster-relief/damage-verifications/${v2_id}/complete"
              payload: { assessed_loss_cents: 30000000, insurance_proceeds_cents: 0 }
              as: LossVerifier
          assert:
            - "DamageVerification.${v1_id}.verified_loss_cents == 30000000 (REPLACEMENT_COST passes the assessed loss through unmodified)"
            - "DamageVerification.${v2_id}.verified_loss_cents == 24000000 (ACTUAL_CASH_VALUE: round_half_up(30000000 * (1 - 0.20)))"
            - "the two verified losses differ by exactly 6000000 cents despite identical assessed_loss_cents and insurance_proceeds_cents"
            - "both verifications report net_verified_loss_cents equal to verified_loss_cents (zero insurance), and both applications advanced to DECISION_PENDING"

      - name: monthly_payment_standard_vs_deferred_capitalized
        grounds:
          - calculations.monthly_payment_calc
          - entities.CreditReview.fields.proposed_payment_cents
          - entities.Loan.fields.monthly_payment_cents
        distinguishing_aspect: "Two payment variants on the Loan/CreditReview entity domain: the same 20000000-cent principal at 0.03125/360 yields proposed_payment_cents 85675 under STANDARD (credit review) but monthly_payment_cents 88352 under DEFERRED_CAPITALIZED (origination), a delta of exactly 2677 cents."
        test_recipe:
          setup:
            - "Clock at 2026-10-02T00:00:00Z; declaration DR-4821 as per canonical fixture."
            - "HOMEOWNER applicant (annual income 12000000, monthly debt 100000) with a SUBMITTED physical application requesting 20000000 in county 06037."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }, { county_fips: "06059", eligible_purposes: ["ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Home Owner", email: "ho@x.com", applicant_type: "HOMEOWNER", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { ho_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 20000000 }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
          trigger:
            - call: "POST /disaster-relief/loan-applications/${app_id}/credit-reviews"
              payload: { credit_score: 700, verified_monthly_debt_cents: 100000 }
              as: LoanOfficer
              captures: { proposed: $.data.proposed_payment_cents }
            - call: "POST /disaster-relief/loan-applications/${app_id}/damage-verifications"
              payload: { method: "INSPECTION", valuation_basis: "REPLACEMENT_COST" }
              as: LossVerifier
              captures: { ver_id: $.data.id }
            - call: "POST /disaster-relief/damage-verifications/${ver_id}/complete"
              payload: { assessed_loss_cents: 25000000, insurance_proceeds_cents: 5000000 }
              as: LossVerifier
            - call: "POST /disaster-relief/loan-applications/${app_id}/decision"
              payload: { decision: "APPROVED", collateral_description: "primary residence", collateral_value_cents: 30000000 }
              as: LoanApprover
              captures: { loan_id: $.data.loan_id }
            - call: "GET /disaster-relief/loans/${loan_id}"
              payload: {}
              as: ServicingAgent
              captures: { monthly_pmt: $.data.monthly_payment_cents }
          assert:
            - "CreditReview.proposed_payment_cents == 85675 (STANDARD amortization of 20000000 at 0.03125/360)"
            - "Loan.${loan_id}.monthly_payment_cents == 88352 (DEFERRED_CAPITALIZED: principal first grossed to 20625000 = 20000000 * (1 + 0.03125/12 * 12), then amortized)"
            - "Loan.${loan_id}.monthly_payment_cents - CreditReview.proposed_payment_cents == 2677 (same principal, rate and term; only the variant differs)"
            - "Loan.${loan_id}.approved_amount_cents == 20000000 (min of requested 20000000, cap 50000000, net loss 20000000, affordability cap) and collateral_required == true (20000000 > 2500000)"

  - rule_id: combinatorial_formula
    instances:
      - name: approved_amount_net_loss_minus_grants_binds
        grounds:
          - calculations.approved_amount_calc
          - calculations.dob_check
        distinguishing_aspect: "Mode (a) combinatorial: approved_amount is a nested min over four terms (requested, renter cap, net-loss-minus-grants, affordability) with branch selection on applicant_type x loan_purpose; here the third term binds at 8000000 while requested (9000000) and cap (10000000) stay slack."
        test_recipe:
          setup:
            - "Clock at 2026-10-02T00:00:00Z; declaration DR-4821."
            - "RENTER applicant (annual income 20000000, monthly debt 0) with physical application requesting 9000000, credit PASS, verification COMPLETED with assessed 9000000, insurance 0 (net 9000000)."
            - "Grant of 1000000 (PHYSICAL_DAMAGE) reported on the application before the decision; DOB ceiling holds (1000000 <= 9000000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }, { county_fips: "06059", eligible_purposes: ["ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Ren Ter", email: "rt@x.com", applicant_type: "RENTER", annual_income_cents: 20000000, monthly_debt_cents: 0 }
              as: Anonymous
              captures: { rt_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 9000000 }
              as: Applicant
              as_user_id: "${rt_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${rt_id}"
            - call: "POST /disaster-relief/loan-applications/${app_id}/credit-reviews"
              payload: { credit_score: 700, verified_monthly_debt_cents: 0 }
              as: LoanOfficer
              captures: { proposed: $.data.proposed_payment_cents }
            - call: "POST /disaster-relief/loan-applications/${app_id}/damage-verifications"
              payload: { method: "INSPECTION", valuation_basis: "REPLACEMENT_COST" }
              as: LossVerifier
              captures: { ver_id: $.data.id }
            - call: "POST /disaster-relief/damage-verifications/${ver_id}/complete"
              payload: { assessed_loss_cents: 9000000, insurance_proceeds_cents: 0 }
              as: LossVerifier
            - call: "POST /disaster-relief/loan-applications/${app_id}/grant-awards"
              payload: { program_name: "FEMA-OTG", award_amount_cents: 1000000, purpose_category: "PHYSICAL_DAMAGE" }
              as: GrantCoordinator
          trigger:
            - call: "POST /disaster-relief/loan-applications/${app_id}/decision"
              payload: { decision: "APPROVED", collateral_description: "renter contents rider", collateral_value_cents: 10000000 }
              as: LoanApprover
              captures: { loan_id: $.data.loan_id }
            - call: "GET /disaster-relief/loans/${loan_id}"
              payload: {}
              as: ServicingAgent
          assert:
            - "Loan.${loan_id}.approved_amount_cents == 8000000 (the net-loss-minus-grants term 9000000 - 1000000 binds the min; requested 9000000 and RENTER cap 10000000 are slack)"
            - "CreditReview.proposed_payment_cents == 119427 (STANDARD payment on the full requested 9000000 at 0.03125/84; affordability never binds)"
            - "Loan.${loan_id}.interest_rate == 0.03125 and term_months == 84 (RENTER physical terms)"
            - "Loan.${loan_id}.collateral_required == true (8000000 > 2500000) and commitment_amount_cents == 8000000"

      - name: clawback_evaluation_order_pinned_steps
        grounds:
          - calculations.clawback_calc
          - state_machines.InsuranceSettlement.REPORTED_to_APPLIED
          - state_machines.DisbursementTranche.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "Mode (c) combinatorial: the clawback's circular-looking dependencies are pinned to a fixed evaluation order (total_insurance -> new_net_loss -> new_commitment -> descending-stage waterfall -> excess), and each intermediate lands on a distinct literal: commitment 8000000, T3 cancelled, T2 reduced to exactly 5500000, excess 0."
        test_recipe:
          setup:
            - "Clock 2026-10-02; DR-4821; homeowner fixture A: application approved for 20000000 (verified loss 25000000, insurance 5000000), loan accepted 2026-11-01."
            - "Only tranche T1 (2500000) RELEASED; T2 (8750000) and T3 (8750000) remain SCHEDULED; disbursed_total 2500000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }, { county_fips: "06059", eligible_purposes: ["ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Home Owner", email: "ho@x.com", applicant_type: "HOMEOWNER", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { ho_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 20000000 }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
            - call: "POST /disaster-relief/loan-applications/${app_id}/credit-reviews"
              payload: { credit_score: 700, verified_monthly_debt_cents: 100000 }
              as: LoanOfficer
            - call: "POST /disaster-relief/loan-applications/${app_id}/damage-verifications"
              payload: { method: "INSPECTION", valuation_basis: "REPLACEMENT_COST" }
              as: LossVerifier
              captures: { ver_id: $.data.id }
            - call: "POST /disaster-relief/damage-verifications/${ver_id}/complete"
              payload: { assessed_loss_cents: 25000000, insurance_proceeds_cents: 5000000 }
              as: LossVerifier
            - call: "POST /disaster-relief/loan-applications/${app_id}/decision"
              payload: { decision: "APPROVED", collateral_description: "primary residence", collateral_value_cents: 30000000 }
              as: LoanApprover
              captures: { loan_id: $.data.loan_id }
            - call: "POST /disaster-relief/loans/${loan_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /disaster-relief/loans/${loan_id}/disbursement-tranches"
              payload: {}
              as: ServicingAgent
              captures: { t1_id: "$.data[0].id" }
            - call: "POST /disaster-relief/disbursement-tranches/${t1_id}/release"
              payload: {}
              as: ServicingAgent
            - call: "POST /disaster-relief/loans/${loan_id}/insurance-settlements"
              payload: { settlement_amount_cents: 12000000, received_date: "2026-12-15T00:00:00Z" }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { setl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: SystemAdmin
            - call: "GET /disaster-relief/loans/${loan_id}"
              payload: {}
              as: ServicingAgent
              captures: { loan_v: $.data.version }
          trigger:
            - call: "POST /disaster-relief/insurance-settlements/${setl_id}/apply"
              payload: { expected_loan_version: "${loan_v}" }
              as: ServicingAgent
            - call: "GET /disaster-relief/loans/${loan_id}/disbursement-tranches"
              payload: {}
              as: ServicingAgent
              captures: { t2_amt: "$.data[1].amount_cents", t2_status: "$.data[1].status", t3_status: "$.data[2].status" }
            - call: "GET /disaster-relief/loans/${loan_id}/excess-funds-receivables"
              payload: {}
              as: ServicingAgent
          assert:
            - "InsuranceSettlement.${setl_id}.status == APPLIED with clawback_commitment_delta_cents == 12000000 and excess_due_cents == 0"
            - "Loan.${loan_id}.commitment_amount_cents == 8000000 (min(20000000, max(0, 25000000 - (5000000 + 12000000)))) — steps (1)-(3) evaluated in pinned order"
            - "tranche stage 3 is CANCELLED and stage 2 amount_cents == 5500000 with status SCHEDULED (descending-stage waterfall to target max(0, 8000000 - 2500000) = 5500000)"
            - "no ExcessFundsReceivable exists (disbursed 2500000 <= commitment 8000000): GET returns an empty array"
            - "Loan.${loan_id}.disbursed_total_cents == 2500000 and outstanding_balance_cents == 2500000 (unchanged by the clawback)"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_reconsideration_cycle_bounded
        grounds:
          - state_machines.LoanApplication.DECLINED_to_DECISION_PENDING
          - entities.LoanApplication.fields.reconsideration_count
        distinguishing_aspect: "Cyclic machine on LoanApplication: DECLINED -> DECISION_PENDING -> DECLINED loops exactly twice (reconsideration_count 1 then 2); the third request-reconsideration is rejected with ERR_RECONSIDERATION_LIMIT, proving the loop is bounded by a counter, not a flag."
        test_recipe:
          setup:
            - "Clock 2026-10-02; DR-4821; homeowner applicant; application (requested 2500000) SUBMITTED then credit-DECLINED with score 639."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Cy Cle", email: "cy@x.com", applicant_type: "HOMEOWNER", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { ho_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 2500000 }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
            - call: "POST /disaster-relief/loan-applications/${app_id}/credit-reviews"
              payload: { credit_score: 639, verified_monthly_debt_cents: 100000 }
              as: LoanOfficer
              captures: { verdict0: $.data.verdict }
          trigger:
            - call: "POST /disaster-relief/loan-applications/${app_id}/request-reconsideration"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { rc1: $.data.reconsideration_count }
            - call: "POST /disaster-relief/loan-applications/${app_id}/decision"
              payload: { decision: "DECLINED" }
              as: LoanApprover
            - call: "POST /disaster-relief/loan-applications/${app_id}/request-reconsideration"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { rc2: $.data.reconsideration_count }
            - call: "POST /disaster-relief/loan-applications/${app_id}/decision"
              payload: { decision: "DECLINED" }
              as: LoanApprover
            - call: "POST /disaster-relief/loan-applications/${app_id}/request-reconsideration"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { err3: $.data.error_id }
          assert:
            - "first review verdict == FAIL and application went DECLINED with decline_reason CREDIT_FAIL (score 639 < 640)"
            - "after reconsideration 1: status DECISION_PENDING and reconsideration_count == 1; after reconsideration 2: reconsideration_count == 2"
            - "the third request-reconsideration returns 409 with error_id ERR_RECONSIDERATION_LIMIT"
            - "a decision on the finally-DECLINED application returns ERR_APPLICATION_NOT_DECISION_PENDING (loop is closed)"

      - name: loan_lifecycle_x_servicing_parallel_dimensions
        grounds:
          - state_machines.Loan.PENDING_ACCEPTANCE_to_ACTIVE
          - state_machines.Loan.CURRENT_to_DEFERRED
          - state_machines.Loan.CURRENT_to_DELINQUENT
          - calculations.delinquency_aging_calc
        distinguishing_aspect: "Parallel state dimensions on the Loan entity: lifecycle_status stays ACTIVE while servicing_status independently cycles CURRENT -> DEFERRED -> CURRENT -> DELINQUENT; the deferment also mechanically shifts next_due_date by exactly its window length (31 days)."
        test_recipe:
          setup:
            - "Fixture A homeowner loan (approved 20000000) accepted on 2026-11-01; T1 released 2026-11-01 so next_due_date == 2027-12-01 and monthly_payment 88352."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
