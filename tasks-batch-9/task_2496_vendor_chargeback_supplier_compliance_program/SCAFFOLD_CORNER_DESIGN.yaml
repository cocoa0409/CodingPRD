          setup:
            - "Vendor V-2055 exists; DRAFT guide RG-2026-A (scope ALL, effective_from 2026-08-05) exists with zero requirements."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
