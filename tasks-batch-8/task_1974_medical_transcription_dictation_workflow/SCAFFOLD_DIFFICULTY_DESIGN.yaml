# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1974 Medical Transcription
# 9 rules x >=2 instances = 19 instances.
# Text-length literals: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx = 65 non-whitespace chars, xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx = 66,
# xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx = 131 (substituted with exact strings before use).
# Logical clock default: 2026-08-01T00:00:00Z ("T0").
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1 --
  - rule_id: dual_variant_calc
    instances:
      - name: tat_measurement_basis_divergence
        grounds:
          - calculations.tat_compliance_measurement
          - entities.SLAPolicy.fields.measurement_basis
          - entities.LineItem.fields.sla_breach
          - entities.LineItem.fields.credit_cents
        distinguishing_aspect: |
          Same timestamps, two valid TAT definitions on the SLA-compliance domain
          (DictationJob/LineItem): END_TO_END measures created_at->delivered_at
          (150 min > 120 -> breach), PRODUCTION_WINDOW measures
          first_claimed_at->submitted_at (exactly 120 min, not > -> no breach).
          Distinct from the billing-domain dual variant (provisional vs final
          line amounts) required by the second instance of this rule.
        test_recipe:
          setup:
            - "Two clinics C1 (measurement_basis END_TO_END) and C2 (PRODUCTION_WINDOW), identical STAT SLA: tat 120 min, rate 20c/line, credit 25%"
            - "Providers P1 (C1), P2 (C2); one ACTIVE editor E (provisional TIER_2, max 3) with a wide shift window covering T0..T0+3h"
            - "STAT jobs J1 (P1), J2 (P2), both 300s audio, created at T0 (due T0+120m = 2026-08-01T02:00:00Z)"
            - "Both claimed at T0+30m; both submitted (65 visible chars) and QA-passed at T0+150m"
            - "Each clinic has a CLOSED-then-FINALIZED billing period [2026-07-01, 2026-09-01]"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C1" }, as: VendorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c1}", priority: STAT, tat_minutes: 120, rate_per_line_cents: 20, breach_credit_pct: 25, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /clinic-accounts", payload: { name: "C2" }, as: VendorAdmin, captures: { c2: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c2}", priority: STAT, tat_minutes: 120, rate_per_line_cents: 20, breach_credit_pct: 25, measurement_basis: PRODUCTION_WINDOW }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c1}", full_name: "P One", specialty: GENERAL }, as: ClientAdmin, captures: { p1: $.data.id } }
            - { call: "POST /providers", payload: { clinic_account_id: "${c2}", full_name: "P Two", specialty: GENERAL }, as: ClientAdmin, captures: { p2: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p1}", work_type: CONSULT, priority: STAT, audio_duration_seconds: 300 }, as: Provider, as_user_id: "${p1}", captures: { j1: $.data.id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p2}", work_type: CONSULT, priority: STAT, audio_duration_seconds: 300 }, as: Provider, as_user_id: "${p2}", captures: { j2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:30:00Z" }, as: VendorAdmin }
            - { call: "POST /dictation-jobs/${j1}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j2}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:30:00Z" }, as: VendorAdmin }
            - { call: "POST /dictation-jobs/${j1}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j2}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j1}", critical_error_count: 0, major_error_count: 1, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j2}", critical_error_count: 0, major_error_count: 1, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c1}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }, as: VendorAdmin, captures: { bp1: $.data.id } }
            - { call: "POST /billing-periods/${bp1}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /billing-periods/${bp1}/finalize", payload: {}, as: VendorAdmin }
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c2}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }, as: VendorAdmin, captures: { bp2: $.data.id } }
            - { call: "POST /billing-periods/${bp2}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /billing-periods/${bp2}/finalize", payload: {}, as: VendorAdmin }
          trigger:
            - { call: "GET /billing-periods/${bp1}/line-items", payload: {}, as: VendorAdmin, captures: { li1_breach: "$.data[0].sla_breach", li1_credit: "$.data[0].credit_cents", li1_final: "$.data[0].final_amount_cents" } }
            - { call: "GET /billing-periods/${bp2}/line-items", payload: {}, as: VendorAdmin, captures: { li2_breach: "$.data[0].sla_breach", li2_credit: "$.data[0].credit_cents", li2_final: "$.data[0].final_amount_cents" } }
          assert:
            - "LineItem(J1).sla_breach == true   # END_TO_END: 150 min elapsed > 120"
            - "LineItem(J2).sla_breach == false  # PRODUCTION_WINDOW: 150-30 = 120 min, NOT > 120"
            - "LineItem(J1).final_amount_cents == 20 and LineItem(J2).final_amount_cents == 20  # identical work (1 line x 20c)"
            - "LineItem(J1).credit_cents == 5    # round_half_up(20 * 25 / 100)"
            - "LineItem(J2).credit_cents == 0    # same timestamps, different variant, different money"

      - name: provisional_vs_final_line_amount_divergence
        grounds:
          - calculations.provisional_vs_final_line_billing
          - entities.LineItem.fields.provisional_amount_cents
          - entities.LineItem.fields.final_amount_cents
          - entities.DictationJob.fields.asr_char_estimate
        distinguishing_aspect: |
          Billing-domain dual variant on LineItem: provisional billing at close
          uses the ASR estimate (ceil(80/65)=2 lines -> 20c), final billing at
          finalize uses the edited transcript (ceil(65/65)=1 line -> 10c) —
          same delivered work, two algorithms, a 2x amount divergence. Entity
          domain (LineItem cost accounting) differs from instance 1 (SLA
          compliance on DictationJob).
        test_recipe:
          setup:
            - "Clinic C with ROUTINE SLA (tat 1440, rate 10c, credit 5%, END_TO_END); provider P; editor E with wide window"
            - "Job J: 40s audio -> asr_char_estimate = 80; submitted final_text has exactly 65 visible chars -> line_count 1; delivered at T0 (no breach)"
            - "Billing period [2026-07-01, 2026-09-01] closed then finalized"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CLINIC_NOTE, priority: ROUTINE, audio_duration_seconds: 40 }, as: Provider, as_user_id: "${p}", captures: { j: $.data.id, est: $.data.asr_char_estimate } }
            - { call: "POST /dictation-jobs/${j}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j}", critical_error_count: 0, major_error_count: 0, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }, as: VendorAdmin, captures: { bp: $.data.id } }
            - { call: "POST /billing-periods/${bp}/close", payload: {}, as: VendorAdmin }
            - { call: "GET /billing-periods/${bp}/line-items", payload: {}, as: VendorAdmin, captures: { prov_lines: "$.data[0].provisional_line_count", prov_amt: "$.data[0].provisional_amount_cents" } }
            - { call: "POST /billing-periods/${bp}/finalize", payload: {}, as: VendorAdmin }
          trigger:
            - { call: "GET /billing-periods/${bp}/line-items", payload: {}, as: VendorAdmin, captures: { fin_lines: "$.data[0].final_line_count", fin_amt: "$.data[0].final_amount_cents", credit: "$.data[0].credit_cents" } }
            - { call: "GET /billing-periods/${bp}", payload: {}, as: VendorAdmin, captures: { net: $.data.net_amount_cents } }
          assert:
            - "DictationJob.asr_char_estimate == 80  # 40s * 2 chars/s"
            - "LineItem.provisional_line_count == 2   # ceil(80/65)"
            - "LineItem.provisional_amount_cents == 20"
            - "LineItem.final_line_count == 1         # ceil(65/65)"
            - "LineItem.final_amount_cents == 10    # provisional 20c vs final 10c for identical delivered work"
            - "LineItem.credit_cents == 0 and BillingPeriod.net_amount_cents == 10"

  # ---------------------------------------------------------------- Rule 2 --
  - rule_id: combinatorial_formula
    instances:
      - name: qa_score_weighted_deduction_with_clamp_and_critical_gate
        grounds:
          - calculations.qa_accuracy_score
          - entities.QAReview.fields.accuracy_score
          - entities.QAReview.fields.outcome
        distinguishing_aspect: |
          Mode (a): three weighted inputs with a max(0,.) floor and a conditional
          branch on critical_error_count independent of the numeric score:
          (c=0,m=4,i=0) -> 80.0 PASS, (c=0,m=4,i=1) -> 79 FAIL, and
          (c=1,m=0,i=0) -> 75 FAIL where the critical gate would fail the review
          even if the numeric threshold were met.
        test_recipe:
          setup:
            - "Clinic C (ROUTINE SLA), provider P, editor E with wide window"
            - "Three ROUTINE jobs J_A, J_B, J_C, each claimed and submitted by E at T0"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { ja: $.data.id } }
            - { call: "POST /dictation-jobs/${ja}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${ja}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { jb: $.data.id } }
            - { call: "POST /dictation-jobs/${jb}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${jb}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { jc: $.data.id } }
            - { call: "POST /dictation-jobs/${jc}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${jc}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
          trigger:
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${ja}", critical_error_count: 0, major_error_count: 4, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01", captures: { qa_a_score: $.data.accuracy_score, qa_a_outcome: $.data.outcome } }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${jb}", critical_error_count: 0, major_error_count: 4, minor_error_count: 1 }, as: QASupervisor, as_user_id: "qa-01", captures: { qa_b_score: $.data.accuracy_score, qa_b_outcome: $.data.outcome } }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${jc}", critical_error_count: 1, major_error_count: 0, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01", captures: { qa_c_score: $.data.accuracy_score, qa_c_outcome: $.data.outcome } }
          assert:
            - "QAReview(J_A).accuracy_score == 80.0 and outcome == PASS   # 100 - 20 = 80 >= 80, c==0"
            - "QAReview(J_B).accuracy_score == 79.0 and outcome == FAIL   # one extra minor flips the boundary"
            - "QAReview(J_C).accuracy_score == 75.0 and outcome == FAIL   # critical gate (c>0) plus below threshold"
            - "DictationJob(J_A).workflow_status == DELIVERED; J_B and J_C back to EDITING with rework_count == 1"

      - name: per_item_credit_rounding_then_sum
        grounds:
          - calculations.sla_credit_and_period_rollup
          - entities.BillingPeriod.fields.credit_amount_cents
          - entities.LineItem.fields.credit_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — credit rounded
          half-up PER LINE ITEM then summed: two breaching items of 105c at 10%
          give round(10.5)=11 each -> total 22, whereas sum-then-round would
          give round(210*0.10)=21. Scaffold pins per-item-first; assert 22.
        test_recipe:
          setup:
            - "Clinic C with STAT SLA: tat 120, rate 35c/line, breach_credit_pct 10, END_TO_END"
            - "Provider P; editor E with wide window"
            - "Two STAT jobs J1, J2 created at T0 (due 02:00), claimed at 00:10/00:11, submitted with 131 visible chars (3 lines -> 105c) at 02:10/02:11, QA-passed -> both breach (elapsed > 120)"
            - "Period [2026-07-01, 2026-09-01] closed and finalized"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: STAT, tat_minutes: 120, rate_per_line_cents: 35, breach_credit_pct: 10, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: RADIOLOGY }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: RADIOLOGY_REPORT, priority: STAT, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j1: $.data.id } }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: RADIOLOGY_REPORT, priority: STAT, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:10:00Z" }, as: VendorAdmin }
            - { call: "POST /dictation-jobs/${j1}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:11:00Z" }, as: VendorAdmin }
            - { call: "POST /dictation-jobs/${j2}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:10:00Z" }, as: VendorAdmin }
            - { call: "POST /dictation-jobs/${j1}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T02:11:00Z" }, as: VendorAdmin }
            - { call: "POST /dictation-jobs/${j2}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j1}", critical_error_count: 0, major_error_count: 0, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j2}", critical_error_count: 0, major_error_count: 0, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
            - { call: "POST /billing-periods", payload: { clinic_account_id: "${c}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }, as: VendorAdmin, captures: { bp: $.data.id } }
            - { call: "POST /billing-periods/${bp}/close", payload: {}, as: VendorAdmin }
            - { call: "POST /billing-periods/${bp}/finalize", payload: {}, as: VendorAdmin }
          trigger:
            - { call: "GET /billing-periods/${bp}", payload: {}, as: VendorAdmin, captures: { gross: $.data.gross_amount_cents, credit: $.data.credit_amount_cents, net: $.data.net_amount_cents } }
            - { call: "GET /billing-periods/${bp}/line-items", payload: {}, as: VendorAdmin, captures: { i1_credit: "$.data[0].credit_cents", i2_credit: "$.data[1].credit_cents", i1_final: "$.data[0].final_amount_cents" } }
          assert:
            - "each LineItem.final_amount_cents == 105          # ceil(131/65)=3 lines x 35c"
            - "each LineItem.credit_cents == 11                 # round_half_up(105 * 10 / 100) = round_half_up(10.5)"
            - "BillingPeriod.gross_amount_cents == 210"
            - "BillingPeriod.credit_amount_cents == 22          # 11 + 11; sum-then-round (21) is FORBIDDEN"
            - "BillingPeriod.net_amount_cents == 188"

      - name: capacity_reevaluation_pinned_order
        grounds:
          - calculations.editor_capacity_reevaluation
          - calculations.editor_rolling_quality_and_standing
          - state_machines.Editor.ACTIVE_to_PROBATION
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned to a fixed evaluation
          order — QA review -> rolling score -> standing (PROBATION) ->
          skill_tier (TIER_1) -> max_concurrent_claims (1) -> preemption of 2
          EDITING jobs (priority ASC, then claimed_at DESC). Any other order
          (e.g. preemption before tier re-derivation) yields a different
          survivor set; here J_R and J_U2 are preempted, J_U1 survives.
        test_recipe:
          setup:
            - "Clinic C with ROUTINE (1440/10c/5%) and URGENT (480/15c/10%) SLA, END_TO_END; provider P; editor E with wide window"
            - "Four ROUTINE jobs delivered with QA score 80 each (m=4): qa_review_count == 4, rolling 80, still ACTIVE TIER_2 max 3"
            - "E then holds three EDITING jobs: J_R (ROUTINE, claimed 00:01), J_U1 (URGENT, claimed 00:02), J_U2 (URGENT, claimed 00:03)"
            - "J_R submitted at 00:04; fifth review FAILs with 1 critical (score 75)"
          setup_api_calls:
            - { call: "POST /clinic-accounts", payload: { name: "C" }, as: VendorAdmin, captures: { c: $.data.id } }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: ROUTINE, tat_minutes: 1440, rate_per_line_cents: 10, breach_credit_pct: 5, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /sla-policies", payload: { clinic_account_id: "${c}", priority: URGENT, tat_minutes: 480, rate_per_line_cents: 15, breach_credit_pct: 10, measurement_basis: END_TO_END }, as: VendorAdmin }
            - { call: "POST /providers", payload: { clinic_account_id: "${c}", full_name: "P", specialty: GENERAL }, as: ClientAdmin, captures: { p: $.data.id } }
            - { call: "POST /editors", payload: { display_name: "E" }, as: VendorAdmin, captures: { e: $.data.id } }
            - { call: "POST /editor-shift-windows", payload: { editor_id: "${e}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs", payload: { provider_id: "${p}", work_type: CONSULT, priority: ROUTINE, audio_duration_seconds: 60 }, as: Provider, as_user_id: "${p}", captures: { j_a: $.data.id } }
            - { call: "POST /dictation-jobs/${j_a}/claim", payload: { editor_id: "${e}" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /dictation-jobs/${j_a}/submit", payload: { final_text: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }, as: Editor, as_user_id: "${e}" }
            - { call: "POST /qa-reviews", payload: { dictation_job_id: "${j_a}", critical_error_count: 0, major_error_count: 4, minor_error_count: 0 }, as: QASupervisor, as_user_id: "qa-01" }
