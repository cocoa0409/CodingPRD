        distinguishing_aspect: "Uniqueness on registration_number: second vessel with the same registration is rejected even though every other field differs."
        test_recipe:
          setup: ["Vessel REG-001 exists"]
          setup_api_calls:
            - { call: "POST /vessels", payload: { vessel_name: "FV Aurora", registration_number: "REG-001", home_port: "Gloucester" }, as: OperationsManager, captures: { v_id: $.data.id } }
