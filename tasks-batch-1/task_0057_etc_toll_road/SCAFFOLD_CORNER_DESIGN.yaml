              captures: { imtp: $.data.id }
            - call: "POST /etc/transponder-bindings"
              payload: { transponder_id: "${imtp}", vehicle_id: "${imv}", effective_from: "2026-01-01T00:00:00Z", expected_vehicle_version: "${imvv}" }
              as: AccountHolder
              as_user_id: "${im}"
            - call: "POST /etc/plazas"
              payload: { name: "Pim", state_code: "NY", base_rate_cents: 400 }
              as: TollOperator
              captures: { pim: $.data.id }
            - call: "POST /etc/toll-transactions"
              payload: { plaza_id: "${pim}", read_method: "TRANSPONDER", read_at: "2026-03-16T03:00:00Z", is_peak: false, declared_axles: 2, transponder_id: "${imtp}" }
              as: TollOperator
              captures: { imtxn: $.data.id }
          trigger:
            - call: "POST /etc/toll-transactions/${imtxn}/price"
              payload: {}
              as: TollOperator
            - call: "GET /etc/accounts/${im}"
              payload: {}
              as: TollOperator
          assert:
            - "the price response data.pricing_status == PRICED and data.toll_cents == 400"
            - "the subsequent GET shows Account.${im}.balance_cents == 4600"
