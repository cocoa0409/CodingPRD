              as: ClientManager
              as_user_id: "${client_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${asg_id}/evidence"
              payload: { kind: "PHOTO", object_uri: "s3://e/p.jpg" }
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { ph: $.data.id }
            - call: "POST /evidence/${ph}/review"
              payload: { decision: "APPROVE" }
              as: QaValidator
            - call: "POST /assignments/${asg_id}/scorecard"
              payload: { section_scores_json: { greeting: 88 } }
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${asg_id}/submit"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${asg_id}/validate"
              payload: {}
              as: QaValidator
          trigger:
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (409); Assignment stays VALIDATED"

      - name: initial_state_assignment_is_assigned
        claim_type: Initial State
        grounds: [state_machines.Assignment.initial_state]
        distinguishing_aspect: "A newly created Assignment starts in ASSIGNED with submission_count 0."
        test_recipe:
          setup: ["PUBLISHED RETAIL wave/script/location; CERTIFIED shopper."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { company_name: "InitCo", billing_email: "i@x.test", fee_per_completed_shop_cents: 15000 }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/locations"
              payload: { label: "IL", lat: 40.0, lng: -74.0, scenario_family: "RETAIL" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { loc_id: $.data.id }
            - call: "POST /clients/${client_id}/scripts"
              payload: { title: "I", scenario_family: "RETAIL", required_photo_count: 1, receipt_required: false, reimburse_cap_cents: 5000, base_fee_cents: 2000, weights_json: { greeting: 1.0 }, passing_score: 70 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { script_id: $.data.id }
            - call: "POST /scripts/${script_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /clients/${client_id}/waves"
              payload: { name: "IW", field_window_start: "2026-06-01T00:00:00Z", field_window_end: "2026-06-30T00:00:00Z", rotation_cooldown_days: 30 }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { wave_id: $.data.id }
            - call: "POST /waves/${wave_id}/publish"
              payload: {}
              as: ClientManager
              as_user_id: "${client_id}"
            - call: "POST /shoppers"
              payload: { full_name: "I Shop", email: "is@x.test", home_lat: 40.0, home_lng: -74.0 }
              as: Anonymous
              captures: { shopper_id: $.data.id }
            - call: "POST /shoppers/${shopper_id}/certification-attempts"
              payload: { raw_score: 90, scenario_family: "RETAIL" }
              as: QaValidator
          trigger:
            - call: "POST /assignments"
              payload: { wave_id: "${wave_id}", shopper_id: "${shopper_id}", location_id: "${loc_id}", script_id: "${script_id}", due_at: "2026-06-10T00:00:00Z" }
              as: ClientManager
              as_user_id: "${client_id}"
              captures: { st: $.data.status, sc: $.data.submission_count }
          assert:
            - "Assignment.status == ASSIGNED and submission_count == 0 at creation"

      - name: request_revision_resets_approved_evidence_to_pending
        claim_type: Side Effect Execution
        grounds: [state_machines.Assignment.SUBMITTED_to_REVISION_REQUESTED, entities.EvidenceItem.fields.review_status]
        distinguishing_aspect: "request-revision flips every APPROVED EvidenceItem back to PENDING so the shopper must re-submit fresh evidence."
