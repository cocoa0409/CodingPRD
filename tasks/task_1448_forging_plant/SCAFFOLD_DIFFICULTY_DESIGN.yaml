  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: trim_accept_bubbles_to_produced_and_cert_creation
        grounds:
          - state_machines.TrimTicket.DRAFT_to_ACCEPTED
          - state_machines.PartSerial.FORGED_to_TRIMMED
          - state_machines.WorkOrder.IN_PROGRESS_to_PRODUCED
          - calculations.per_part_net_allocation
        distinguishing_aspect: |
          Depth-3 cascade from ONE trigger (trim record): ticket ACCEPTED
          mutates PartSerials (-> TRIMMED, net weights); that mutation rederives
          WorkOrder.trimmed_qty which crosses ordered_qty and flips the order
          (IN_PROGRESS -> PRODUCED); the PRODUCED transition itself auto-creates
          a PENDING QualityCert per distinct heat. Each hop is caused by the
          previous mutation, not by the original request.
        test_recipe:
          setup:
            - "Base WO-1-style flow: 10 parts forged from heat H-3001, run FORGED, DRAFT trim ticket open"
            - "trimmed_qty is 9 before the trigger? NO — 0 before; crossing happens wholly inside this trigger"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
