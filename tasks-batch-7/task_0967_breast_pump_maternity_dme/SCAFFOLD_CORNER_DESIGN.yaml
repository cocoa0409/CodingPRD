              captures: { gar_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Rr Mem", email: "rr@x.com", date_of_birth: "1990-01-01", shipping_address: "17 V St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", garment_allowance_per_period: 4 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "17 V St" }
