            as: IssuerOfficer
            as_user_id: "${iss_id}"
            captures: { pool_id: $.data.id }
          - call: "POST /loans"
            payload: { pool_id: "${pool_id}", principal_balance_cents: 1200000, note_rate_bps: 850, government_insurance: "FHA", escrow_monthly_cents: 20000 }
            as: IssuerOfficer
            as_user_id: "${iss_id}"
          - call: "POST /pools/${pool_id}/assemble"
            payload: {}
            as: IssuerOfficer
            as_user_id: "${iss_id}"
          - call: "POST /pools/${pool_id}/certifications"
            payload: { decision: "CERTIFIED" }
            as: DocumentCustodian
            as_user_id: "${cust_id}"
          - call: "POST /pools/${pool_id}/activate"
            payload: {}
            as: IssuerOfficer
            as_user_id: "${iss_id}"
          - call: "GET /investor-reports"
            payload: { pool_id: "${pool_id}" }
            as: PlatformAdmin
            captures: { rep_id: "$.data[0].id" }
          - call: "POST /investor-reports/${rep_id}/submit"
            payload: {}
            as: IssuerOfficer
            as_user_id: "${iss_id}"
          - call: "POST /investor-reports/${rep_id}/accept"
            payload: {}
            as: AgencyReviewer
            as_user_id: "reviewer-1"
          - call: "GET /pass-through-payments"
            payload: { report_id: "${rep_id}" }
            as: PlatformAdmin
            captures: { pay_id: "$.data[0].id" }
        trigger:
          - call: "POST /pass-through-payments/${pay_id}/settle"
            payload: {}
            as: IssuerOfficer
            as_user_id: "${iss_id}"
