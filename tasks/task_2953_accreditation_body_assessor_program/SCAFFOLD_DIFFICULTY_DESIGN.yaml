          setup:
            - "Clock 2026-08-10; one PUBLISHED scheme; one organization."
            - "One INTERNAL assessor with annual_witness_capacity_days 20, a GRANTED LEAD_ASSESSOR qualification and impartiality_status SCREENED; committed_witness_days 0 and available_witness_days 20."
