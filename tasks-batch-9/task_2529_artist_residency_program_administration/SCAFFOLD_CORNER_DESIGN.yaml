          assert:
            - "the per-cycle scope allowed the second SCULPT: ${disc_b} was created with 201 in cycle ${cyc_b} even though ${disc_a} already used that code in ${cyc_a}"
            - "the repeat inside the SAME cycle is refused: 409 ERR_DUPLICATE_CODE, and GET /disciplines?cycle_id=${cyc_a} still returns total_count == 1"
            - "the collision is on code alone, not on the whole row: the rejected payload differed in name, item bounds, media types, slot bounds, capability tags and ventilation class"
            - "the global keys use the other scope: a second POST /cycles with code 'CY-2027' returns 409 ERR_DUPLICATE_CODE, as does a second POST /applicants with an already-used email, a second POST /panelists with an already-used email, a second POST /studios with an already-used code and a second POST /housing-units with an already-used code"
            - "the parent is resolved before uniqueness: POST /disciplines with an unknown cycle_id and the duplicate code 'SCULPT' returns 404 ERR_CYCLE_NOT_FOUND (P8), not the 409"
            - "nothing is written on the 409: Cycle ${cyc_a}.version is unchanged and no partial Discipline row appears in GET /disciplines"

      - name: one_application_per_artist_per_cycle_and_one_review_per_pair
        claim_type: error_triggerable
        grounds: ["errors[ERR_DUPLICATE_ASSOCIATION]", "validations[priority 56]", "endpoints[POST /applications]", "endpoints[POST /panel-assignments]"]
        distinguishing_aspect: "ERR_DUPLICATE_ASSOCIATION guards two different composite keys on two different endpoints, and in both cases the pair - not either member - is what must be unique: the same artist may apply to a DIFFERENT cycle, and the same panelist may review a DIFFERENT application. The rule must also survive a withdrawn first attempt, since the uniqueness is over the pair regardless of the existing row's status."
        test_recipe:
          setup: ["Two OPEN cycles each with a SCULPT discipline, and one applicant who already holds an application in the first cycle."]
          setup_api_calls:
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
