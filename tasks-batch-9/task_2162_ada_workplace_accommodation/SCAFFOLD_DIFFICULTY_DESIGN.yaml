          The metric is an empty-collection cardinality (zero
          AccommodationOption rows in status PROPOSED or CLEARED) reached
          through POST /accommodation-requests/{id}/advance, a different
          metric and a different endpoint from the continuous hardship-score
          threshold of the sibling instance.
        test_recipe:
          setup:
