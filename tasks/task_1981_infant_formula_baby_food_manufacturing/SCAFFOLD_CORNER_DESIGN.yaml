          trigger:
            - call: "POST /api/v1/suppliers/${sup_range_id}/audits"
              payload:
                audit_type: "INITIAL"
                audit_date: "2026-07-01T00:00:00Z"
                auditor_name: "Range Auditor"
                score: 101.00
                findings: []
              as: QUALITY_ANALYST
              captures: { err_range: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_RANGE"

      - name: segregation_of_duties_formula_approve
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Same user who submitted a formula for review cannot approve it."
        test_recipe:
          setup:
            - "An IN_REVIEW Formula exists, submitted by user X."
          setup_api_calls:
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs: [{nutrient_code: "P", unit: "g", min_per_100kcal: 1.80, max_per_100kcal: 3.50, target_per_100kcal: 2.50}]
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { np_sod_id: $.data.id }
