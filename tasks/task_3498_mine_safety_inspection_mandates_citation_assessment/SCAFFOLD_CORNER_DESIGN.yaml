              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.370", kind: "CITATION", negligence: "LOW", gravity_likelihood: "UNLIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: false }
              as: Inspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id, v_create: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-11T09:00:00Z" }
              as: MSHAAdmin
            - call: "POST /msha/citations/${cit1}/abate"
              payload: { abatement_note: "corrected" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { v_abate: $.data.version }
            - call: "POST /msha/citations/${cit1}/verify-abatement"
              payload: { verification_note: "verified" }
              as: Inspector
              as_user_id: "${i2}"
              captures: { v_verify: $.data.version }
          trigger:
            - call: "GET /msha/citations/${cit1}"
              payload: {}
              as: DistrictManager
          assert:
            - "version at creation == 1"
            - "version after abate == 2"
            - "version after verify == 3 and the GET confirms 3 with updated_at refreshed on each step"

      - name: pagination_defaults_applied_when_params_omitted
        claim_type: pagination_with_filtering
        grounds:
          - response_envelope.pagination_defaults
          - endpoints.GET_/msha/citations
        distinguishing_aspect: "Omitting limit and offset applies the declared defaults (limit 10, offset 0): three rows come back in one page with has_more false and total_count 3."
