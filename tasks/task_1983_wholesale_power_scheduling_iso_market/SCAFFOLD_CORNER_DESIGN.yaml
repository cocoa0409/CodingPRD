  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: outages_list_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "Pagination fields interact with filters: limit=2 returns the 2 oldest rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false."
        test_recipe:
          setup: ["generator with three non-overlapping SUBMITTED outages"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Pg Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "PARTIAL", derate_pct: 20, start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-05T06:00:00Z", reason: "r1" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { r1: $.data.id }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "PARTIAL", derate_pct: 20, start_at: "2026-08-06T00:00:00Z", end_at: "2026-08-06T06:00:00Z", reason: "r2" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { r2: $.data.id }
            - call: "POST /market/generators/${g_id}/outages"
              payload: { outage_type: "PARTIAL", derate_pct: 20, start_at: "2026-08-07T00:00:00Z", end_at: "2026-08-07T06:00:00Z", reason: "r3" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { r3: $.data.id }
          trigger:
            - call: "GET /market/outages?generator_asset_id=${g_id}&limit=2&offset=0"
              as: IsoOperator
              captures: { pg1_first: "$.data[0].id", pg1_second: "$.data[1].id" }
            - call: "GET /market/outages?generator_asset_id=${g_id}&limit=2&offset=2"
              as: IsoOperator
              captures: { pg2_first: "$.data[0].id" }
          assert:
            - "Page 1 returns exactly rows ${r1} and ${r2} (created_at ASC) with total_count == 3 and has_more == true"
            - "Page 2 (offset 2) returns exactly ${r3} with has_more == false"
            - "Default limit is 10 when the parameter is omitted (per response_envelope.pagination_defaults)"

      - name: response_envelope_success_and_error_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Fixed envelope on both paths: success carries meta.api_request_id + response_type 'object' + data; error carries response_type 'error' + data.error_id/message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Env Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /market/participants/${p_id}"
              as: IsoOperator
            - call: "GET /market/participants/00000000-0000-0000-0000-000000000000"
              as: IsoOperator
              captures: { e: $.data.error_id }
          assert:
            - "Success responses: meta.api_request_id non-empty, meta.api_request_timestamp ISO8601, response_type == 'object', data holds the entity"
            - "Error response: response_type == 'error', data.error_id == ERR_NOT_FOUND, data.message non-empty"

      - name: statement_line_set_completeness
        claim_type: computed_read
        grounds: [conventions, entities.SettlementLine.fields.charge_type]
        distinguishing_aspect: "Computed read consistency: the settled dev-0 day emits exactly three non-zero lines (DA_ENERGY_CREDIT −1200000, CONGESTION +48000, LOSSES +24000) in emission order; no zero-amount RT_IMBALANCE line."
        test_recipe:
          setup: ["settled day: cleared 10 MW @ 5000 at {5000, 200, 100}, telemetry uniform 10 MW → dev 0 everywhere"]
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Ln Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 10, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - { call: "POST /market/offers/${o_id}/submit", as: Trader, as_user_id: "${p_id}" }
            - call: "POST /market/operating-days/${d_id}/run-day-ahead-market"
              payload: { node_prices: [ { node_name: "WEST_HUB", da_energy_cents_per_mwh: 5000, da_congestion_cents_per_mwh: 200, da_loss_cents_per_mwh: 100 } ] }
              as: IsoOperator
            - call: "POST /market/generators/${g_id}/telemetry"
              payload:
                operating_day_id: "${d_id}"
                expected_generator_asset_version: "${g_v}"
                readings: [ { interval_index: 1, actual_mw: 10 }, { interval_index: 2, actual_mw: 10 }, { interval_index: 3, actual_mw: 10 }, { interval_index: 4, actual_mw: 10 }, { interval_index: 5, actual_mw: 10 }, { interval_index: 6, actual_mw: 10 }, { interval_index: 7, actual_mw: 10 }, { interval_index: 8, actual_mw: 10 }, { interval_index: 9, actual_mw: 10 }, { interval_index: 10, actual_mw: 10 }, { interval_index: 11, actual_mw: 10 }, { interval_index: 12, actual_mw: 10 }, { interval_index: 13, actual_mw: 10 }, { interval_index: 14, actual_mw: 10 }, { interval_index: 15, actual_mw: 10 }, { interval_index: 16, actual_mw: 10 }, { interval_index: 17, actual_mw: 10 }, { interval_index: 18, actual_mw: 10 }, { interval_index: 19, actual_mw: 10 }, { interval_index: 20, actual_mw: 10 }, { interval_index: 21, actual_mw: 10 }, { interval_index: 22, actual_mw: 10 }, { interval_index: 23, actual_mw: 10 }, { interval_index: 24, actual_mw: 10 } ]
              as: Trader
              as_user_id: "${p_id}"
            - call: "POST /market/operating-days/${d_id}/close-real-time"
              payload: { rt_node_prices_prelim: [ { node_name: "WEST_HUB", rt_prelim_energy_cents_per_mwh: 4000, rt_prelim_congestion_cents_per_mwh: 50, rt_prelim_loss_cents_per_mwh: 25 } ] }
              as: IsoOperator
            - { call: "POST /market/operating-days/${d_id}/run-preliminary-settlement", as: IsoOperator }
            - call: "GET /market/statements"
              payload: { operating_day_id: "${d_id}", market_participant_id: "${p_id}", run_type: "PRELIMINARY" }
              as: IsoOperator
              captures: { s_id: "$.data[0].id" }
          trigger:
            - call: "GET /market/statements/${s_id}/lines"
              as: IsoOperator
              captures: { l0t: "$.data[0].charge_type", l0a: "$.data[0].amount_cents", l1t: "$.data[1].charge_type", l1a: "$.data[1].amount_cents", l2t: "$.data[2].charge_type", l2a: "$.data[2].amount_cents" }
          assert:
            - "Exactly 3 lines: DA_ENERGY_CREDIT −1200000, CONGESTION +48000, LOSSES +24000 (emission order per conventions)"
            - "No RT_IMBALANCE / ANCILLARY / CAPACITY lines (zero amounts emit no line)"
            - "Σ line amounts == statement.net_amount_cents == −1128000"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role are rejected before role checks; the test harness omits both headers on the trigger call."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IsoOperator
          trigger:
            - call: "POST /market/participants"
              payload: { company_name: "NoHdr Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) — the harness sends this call with the auth headers stripped"

      - name: trader_cannot_run_market_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]", roles]
        distinguishing_aspect: "Segregation of duties direction 1: participant-side Trader cannot execute ISO market runs."
        test_recipe:
          setup: ["participant + operating day"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Sod Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /market/operating-days/${d_id}/run-day-ahead-market"
              payload: { node_prices: [] }
              as: Trader
              as_user_id: "${p_id}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403); day remains DA_OPEN"

      - name: iso_operator_cannot_submit_offer_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]", roles]
        distinguishing_aspect: "Segregation of duties direction 2: the market authority cannot submit participant offers — the role lists are disjoint both ways."
        test_recipe:
          setup: ["participant + generator + day + DRAFT offer"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Sod2 Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 5, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /market/offers/${o_id}/submit"
              as: IsoOperator
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403); offer remains DRAFT"

      - name: settlement_analyst_cannot_post_collateral_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_FOR_ROLE]", roles]
        distinguishing_aspect: "Segregation within the participant: the settlement function cannot move collateral (CreditOfficer-exclusive endpoint)."
        test_recipe:
          setup: ["participant"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Sod3 Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /market/participants/${p_id}/postings"
              payload: { amount_cents: 1000, instrument_type: "CASH" }
              as: SettlementAnalyst
              as_user_id: "${p_id}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (403)"

      - name: trader_ownership_violation_on_foreign_generator
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_OWNERSHIP_VIOLATION]", roles]
        distinguishing_aspect: "Ownership scoping: Trader of participant P1 offering P2's generator is rejected at priority 5 — before the OCC check even with a fresh day version."
        test_recipe:
          setup: ["participants P1 and P2; generator owned by P2; DA_OPEN day"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Own1 Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p1: $.data.id }
            - call: "POST /market/participants"
              payload: { company_name: "Own2 Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p2: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p2}", unit_name: "U2", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g2: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
          trigger:
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g2}", offered_mw: 5, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p1}"
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_OWNERSHIP_VIOLATION (403); no offer persisted"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_offer_create_stale_version_then_supersede
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[offer-create-stale-day]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on OperatingDay.version: a create carrying the pre-offer version is rejected with 412; the same create with the refreshed version succeeds and supersedes the first offer."
        test_recipe:
          setup: ["participant + generator + DA_OPEN day (version captured at creation)"]
          setup_api_calls:
            - { call: "POST /market/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IsoOperator }
            - call: "POST /market/participants"
              payload: { company_name: "Occ Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 5, offer_price_cents_per_mwh: 5000, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 7, offer_price_cents_per_mwh: 4800, expected_operating_day_version: "${d_v}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { e: $.data.error_id }
            - call: "GET /market/operating-days/${d_id}"
              as: IsoOperator
              captures: { d_v2: $.data.version }
            - call: "POST /market/operating-days/${d_id}/offers"
              payload: { generator_asset_id: "${g_id}", offered_mw: 7, offer_price_cents_per_mwh: 4800, expected_operating_day_version: "${d_v2}" }
              as: Trader
              as_user_id: "${p_id}"
              captures: { o2: $.data.id, o2_st: $.data.status }
            - call: "GET /market/offers/${o1}"
              as: Trader
              as_user_id: "${p_id}"
              captures: { o1_st: $.data.status }
          assert:
            - "Second create with the stale version ${d_v} is rejected: ERR_STALE_VERSION (412) — the first create bumped OperatingDay.version"
            - "Same create with the refreshed version succeeds (201, DRAFT) and DayAheadOffer.${o1}.status == SUPERSEDED (CREATE-with-supersede semantics)"

      - name: occ_telemetry_stale_asset_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[telemetry-submit-stale-asset]", "errors[ERR_STALE_ASSET_VERSION]"]
        distinguishing_aspect: "OCC on GeneratorAsset.version (different parent than the day rule): a correction batch carrying the pre-submission asset version is rejected with 412."
        test_recipe:
          setup: ["participant + generator; gated day; one telemetry batch already accepted (asset version advanced)"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Occ2 Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
            - call: "POST /market/generators"
              payload: { market_participant_id: "${p_id}", unit_name: "U1", pricing_node: "WEST_HUB", capacity_mw: 10 }
              as: IsoOperator
              captures: { g_id: $.data.id, g_v: $.data.version }
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
            - { call: "POST /market/operating-days/${d_id}/run-day-ahead-market", payload: { node_prices: [] }, as: IsoOperator }
            - call: "POST /market/generators/${g_id}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${g_v}", readings: [ { interval_index: 1, actual_mw: 5 } ] }
              as: Trader
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /market/generators/${g_id}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${g_v}", readings: [ { interval_index: 1, actual_mw: 7 } ] }
              as: Trader
              as_user_id: "${p_id}"
              captures: { e: $.data.error_id }
            - call: "GET /market/generators/${g_id}"
              as: IsoOperator
              captures: { g_v2: $.data.version }
            - call: "POST /market/generators/${g_id}/telemetry"
              payload: { operating_day_id: "${d_id}", expected_generator_asset_version: "${g_v2}", readings: [ { interval_index: 1, actual_mw: 7 } ] }
              as: Trader
              as_user_id: "${p_id}"
              captures: { t_ok: $.data.recorded_count }
          assert:
            - "Correction with the stale asset version → ERR_STALE_ASSET_VERSION (412)"
            - "Correction with the refreshed version succeeds (recorded_count == 1) and supersedes the interval-1 row"

      - name: ops_run_checkpoint_epoch_order_enforced
        claim_type: precondition_enforcement
        grounds: [state_machines.OperatingDay, complexity_profile]
        distinguishing_aspect: "Ops-run checkpoint ordering: close-real-time on a DA_OPEN day (skipping the DA run) is an epoch violation → ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["fresh operating day"]
          setup_api_calls:
            - call: "POST /market/operating-days"
              payload: { market_date: "2026-08-03", da_gate_close_at: "2026-08-02T10:30:00Z" }
              as: IsoOperator
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /market/operating-days/${d_id}/close-real-time"
              payload: { rt_node_prices_prelim: [] }
              as: IsoOperator
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); day remains DA_OPEN"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_posting_visibility
        claim_type: side_effect_execution
        grounds: [complexity_profile, entities.MarketParticipant.fields.posted_collateral_cents]
        distinguishing_aspect: "Immediate consistency: the posting create response and an immediate re-read of the participant show the updated posted_collateral_cents in the same logical instant (no lag, no async reconcile)."
        test_recipe:
          setup: ["participant with posted 0"]
          setup_api_calls:
            - call: "POST /market/participants"
              payload: { company_name: "Imm Co", credit_rating_tier: "INVESTMENT_GRADE" }
              as: IsoOperator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /market/participants/${p_id}/postings"
              payload: { amount_cents: 75000, instrument_type: "LETTER_OF_CREDIT" }
              as: CreditOfficer
              as_user_id: "${p_id}"
              captures: { cp_st: $.data.status }
            - call: "GET /market/participants/${p_id}"
              as: IsoOperator
              captures: { p_posted: $.data.posted_collateral_cents, p_v: $.data.version }
          assert:
            - "CollateralPosting status == POSTED and MarketParticipant.posted_collateral_cents == 75000 on the immediate re-read"
            - "Participant version advanced by the posting mutation (2)"

  # ---------------------------------------------------------------------------
  # Corners already exercised as the failure/assertion path of §1.8 instances
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_da_gate_closed_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_DA_GATE_CLOSED]"]
        excluded_because:
          difficulty_instance: da_gate_close_inclusive_boundary
          rationale: "The +1s-past-gate submit asserts ERR_DA_GATE_CLOSED."
      - name: error_market_not_open_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_MARKET_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: offer_create_requires_day_da_open
          rationale: "Offer create on a DA_GATED day asserts ERR_MARKET_NOT_OPEN."
      - name: error_generator_not_available_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_GENERATOR_NOT_AVAILABLE]"]
        excluded_because:
          difficulty_instance: generator_outage_state_beats_credit_headroom
          rationale: "Submit on an ON_OUTAGE generator asserts ERR_GENERATOR_NOT_AVAILABLE as the winning error."
      - name: error_statement_not_final_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_STATEMENT_NOT_FINAL]"]
        excluded_because:
          difficulty_instance: dispute_requires_final_run_type
          rationale: "Dispute on a PRELIMINARY statement asserts ERR_STATEMENT_NOT_FINAL."
      - name: error_open_margin_call_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_MARGIN_CALL]"]
        excluded_because:
          difficulty_instance: posting_release_blocked_by_open_margin_call
          rationale: "Release with an OPEN call asserts ERR_OPEN_MARGIN_CALL."
      - name: error_outage_overlap_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_OUTAGE_OVERLAP]"]
        excluded_because:
          difficulty_instance: outage_half_open_interval_adjacency
          rationale: "The overlapping [11:00,13:00) report asserts ERR_OUTAGE_OVERLAP."
      - name: error_event_buffer_violation_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_BUFFER_VIOLATION]"]
        excluded_because:
          difficulty_instance: performance_event_buffer_gap_semantics
          rationale: "The adjacent [5,6] event asserts ERR_EVENT_BUFFER_VIOLATION."
      - name: prelim_statement_superseded_transition
        claim_type: side_effect_execution
        grounds: [state_machines.SettlementStatement.ISSUED_to_SUPERSEDED]
        excluded_because:
          difficulty_instance: settlement_preliminary_vs_final_divergence
          rationale: "Asserts the PRELIMINARY statement is SUPERSEDED after run-final-settlement."
      - name: margin_call_cured_via_resettlement
        claim_type: side_effect_execution
        grounds: [state_machines.MarginCall.OPEN_to_CURED]
        excluded_because:
          difficulty_instance: dispute_upheld_cascades_to_margin_cure
          rationale: "Asserts the OPEN margin call flips to CURED as cascade link 2."



