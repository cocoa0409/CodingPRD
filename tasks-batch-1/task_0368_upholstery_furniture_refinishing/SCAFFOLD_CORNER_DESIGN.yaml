      - name: discontinued_fabric_existing_reference_still_resolves
        claim_type: soft_delete
        grounds: ["entities.FabricSku.fields.status", "endpoints.\"POST /fabric-skus/{id}/discontinue\"", "endpoints.\"GET /fabric-skus/{id}\""]
        distinguishing_aspect: "A FabricSku DISCONTINUED after a LineItem already references it remains GET-resolvable (status DISCONTINUED) and the prior LineItem keeps its referenced sku — soft-delete preserves existing references."
        test_recipe:
