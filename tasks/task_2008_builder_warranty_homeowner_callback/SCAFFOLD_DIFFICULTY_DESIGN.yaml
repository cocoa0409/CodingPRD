              as: WarrantyRep
              captures: { wo1_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr2_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T13:00:00Z", window_end: "2026-08-10T17:00:00Z", estimated_cost_cents: 60000, defect_responsibility: "BUILDER" }
              as: WarrantyRep
              captures: { wo2_status: $.data.status }
            - call: "POST /work-orders"
              payload: { service_request_id: "${sr3_id}", trade_partner_id: "${tp_id}", window_start: "2026-08-10T18:00:00Z", window_end: "2026-08-10T22:01:00Z", estimated_cost_cents: 60000, defect_responsibility: "BUILDER" }
              as: WarrantyRep
              captures: { err: $.data.error_id }
          assert:
            - "wo2_status == SCHEDULED (240 + 240 == 480, == capacity is allowed)"
            - "err == ERR_TRADE_CAPACITY_EXCEEDED, HTTP 409 (480 + 241 > 480)"
            - "capacity is an AGGREGATE over the UTC day: wo3 does not overlap wo1/wo2 yet is still rejected"
      - name: home_visit_window_half_open
        grounds:
          - validations[priority=22]
          - entities.WorkOrder.fields.window_start
          - entities.WorkOrder.fields.window_end
        distinguishing_aspect: |
          Half-open pointwise-overlap interval semantics on resource Home (different resource
          and different geometry from the aggregate-capacity instance): a window starting
          inside an existing visit is rejected, while a window starting exactly at the
          previous window's end (adjacency) is allowed.
        test_recipe:
          setup:
            - "Home; two trade partners tp1/tp2; approved requests srA/srB; woA SCHEDULED 2026-08-12 09:00-11:00 with tp1"
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Pat Hale", email: "pat@example.com" }
