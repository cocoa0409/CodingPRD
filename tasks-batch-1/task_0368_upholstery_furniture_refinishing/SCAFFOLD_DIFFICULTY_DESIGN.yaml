  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_conserves_fabric_yards
        grounds:
          - state_machines.WorkOrder.APPROVED_to_CANCELLED
          - state_machines.MaterialOrder.ORDERED_to_CANCELLED
          - entities.FabricSku.fields.in_stock_yards
        distinguishing_aspect: |
          Conserved quantity = FABRIC YARDS: invariant FabricSku.in_stock_yards is unchanged across
          (reserve 6 on material-order) + (return 6 on cancel) -- final in_stock_yards == initial 100,
          pinned as in_stock_yards_after == in_stock_yards_before.
        test_recipe:
          setup:
            - "FabricSku starts 100 yards; APPROVED order reserves 6 yards via a fabric MaterialOrder (stock 94)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Vic V", email: "vic@x.com", phone: "555-0118" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /fabric-skus"
              payload: { sku_code: "CHN-IVRY", name: "Chenille Ivory", price_cents_per_yard: 1800, roll_width_inches: 54, in_stock_yards: 100 }
              as: ShopManager
              captures: { fab_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REUPHOLSTERY", rush_requested: false }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://p/18.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "Settee", fabric_sku_id: "${fab_id}", yardage_required: 6, labor_hours: 4 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${wo_v_est}" }
              as: Estimator
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_v_appr: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v_appr}", deposit_amount_cents: 12090 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /material-orders"
              payload: { work_order_id: "${wo_id}", fabric_sku_id: "${fab_id}", yards_ordered: 6 }
              as: ShopManager
            - call: "GET /work-orders/${wo_id}"
              as: ShopManager
              captures: { wo_v_cancel: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { expected_work_order_version: "${wo_v_cancel}", refund_destination: "ORIGINAL" }
              as: ShopManager
          assert:
            - "FabricSku.${fab_id}.in_stock_yards == 100"

      - name: wallet_refund_conserves_money_to_store_credit
        grounds:
          - state_machines.WorkOrder.APPROVED_to_CANCELLED
          - entities.Customer.fields.store_credit_cents
          - entities.WorkOrder.fields.amount_paid_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (a DIFFERENT type from fabric yards): the 12090-cent deposit is
          conserved across (pay deposit -> amount_paid 12090) + (WALLET refund on cancel ->
          store_credit_cents += 12090, amount_paid -> 0); store_credit_after == deposit_paid (12090).
        test_recipe:
          setup:
            - "Customer store_credit starts 0; APPROVED order with a 12090 deposit paid; no materials ordered."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Wes W", email: "wes@x.com", phone: "555-0119" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /fabric-skus"
              payload: { sku_code: "POLY-SAGE", name: "Poly Sage", price_cents_per_yard: 1800, roll_width_inches: 54, in_stock_yards: 100 }
              as: ShopManager
              captures: { fab_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REUPHOLSTERY", rush_requested: false }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://p/19.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "Daybed", fabric_sku_id: "${fab_id}", yardage_required: 6, labor_hours: 4 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${wo_v_est}" }
              as: Estimator
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_v_appr: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v_appr}", deposit_amount_cents: 12090 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /work-orders/${wo_id}"
              as: ShopManager
              captures: { wo_v_cancel: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { expected_work_order_version: "${wo_v_cancel}", refund_destination: "WALLET" }
              as: ShopManager
          assert:
            - "Customer.${cust_id}.store_credit_cents == 12090"
            - "WorkOrder.${wo_id}.amount_paid_cents == 0"
            - "WorkOrder.${wo_id}.status == CANCELLED"
