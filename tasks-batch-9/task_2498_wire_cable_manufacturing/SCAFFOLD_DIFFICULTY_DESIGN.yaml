              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /compounds"
              payload: { compound_code: "NYL-JKT", layer_role: "JACKET", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 5.0 }
              as: ProcessEngineer
              captures: { jkt_id: $.data.id }
            - call: "POST /compounds/${jkt_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", jacket_compound_id: "${jkt_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0, min_wall_pct: 90, concentricity_min_pct: 85 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /customers"
              payload: { account_code: "ACME", name: "Acme Electric Supply", market_region: "MIDWEST", credit_limit_usd: 100000.00, pass_through_enabled: true, reel_program: "RETURNABLE" }
              as: BillingAnalyst
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", order_number: "SO-CON", ordered_kft: 10.000, price_basis: "ORDER_DATE_LOCK", conversion_price_usd_per_kft: 85.00, order_date: "2026-07-30" }
              as: BillingAnalyst
              captures: { ord_id: $.data.id }
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-CON-OK", planned_length_ft: 5000, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_ok: $.data.id }
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_v2: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-CON-NG", planned_length_ft: 5000, line_code: "EXT-2", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v2}" }
              as: ProcessEngineer
              captures: { lot_ng: $.data.id }
            - call: "POST /production-lots/${lot_ok}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_ok}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_ng}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_ng}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
          trigger:
            - call: "POST /production-lots/${lot_ok}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 25.5, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
              captures: { conc_ok: $.data.concentricity_pct }
            - call: "POST /production-lots/${lot_ng}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 25.49, measured_max_wall_mils: 30.0, measured_avg_od_mm: 4.10, surface_marking_text: "UL E12345 12AWG THHN 90C 600V" }
              as: ProcessEngineer
              captures: { conc_ng: $.data.concentricity_pct }
          assert:
            - "exactly at the limit: ProductionLot.${lot_ok}.concentricity_pct == 85.00 and quality_state == PENDING (>= is inclusive), process_state == EXTRUDED"
            - "one hundredth under: round_half_up(100 * 25.49 / 30.0, 2) == 84.97, so ProductionLot.${lot_ng}.concentricity_pct == 84.97 and quality_state == NONCONFORMING"
            - "process_state still advances on the failing lot: ProductionLot.${lot_ng}.process_state == EXTRUDED (the dimensional verdict lives on the quality dimension only)"
            - "minimum wall is not the discriminator here: 25.49 and 25.5 are both >= the required 25.20 mils, so priority 52 would not have fired for either lot"
            - "the failing lot is recoverable: POST /production-lots/${lot_ng}/disposition with disposition REWORK and rewind_to STRANDED returns it to PENDING for a second extrusion attempt"

  # ===========================================================================
  # Rule 7 - cross-entity state dependencies
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lot_release_depends_on_listing_certification_status
        entity_pair: [ProductionLot, ListingCertification]
        grounds:
          - state_machines.ProductionLot.PENDING_to_CONFORMING
          - state_machines.ListingCertification.ACTIVE_to_VARIATION_NOTICE
          - validations.priority_66_ERR_CERTIFICATION_NOT_ACTIVE
          - endpoints.POST_/production-lots/{id}/release
        depends_on: "ListingCertification(CatalogProduct.listing_certification_id).status == ACTIVE"
        distinguishing_aspect: |
          The gating entity is two hops away from the gated one (lot -> product ->
          certification) and the dependency is invisible on the lot itself:
          recording a VARIATION inspection moves the file ACTIVE ->
          VARIATION_NOTICE and, unlike a SUSPEND, fires no cascade at all, so the
          lot is byte-for-byte unchanged and still TESTED/PENDING - yet its
          release now fails. Reinstating the file makes the identical request
          succeed.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; copper 2026-07-30 at 4.10; QUALIFIED compounds."
            - "UL file E12345 ACTIVE via a PASS inspection on 2026-06-05; SKU THHN-12-CU RELEASED against it."
            - "Order SO-CERT for 5.000 kft; rod lot 20000 lbs; lot LOT-CERT drawn, stranded, extruded at 25.5/30.0 (concentricity 85.00) and passed SPARK and HIPOT by qe-001, so it sits at process_state TESTED / quality_state PENDING."
