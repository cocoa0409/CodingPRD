# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage for
# task_2319_hydroelectric_project_relicensing
# Taxonomy: references/claim-extraction-guide.md (nine sections, per-section claim types)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: project_creation_returns_declared_initial_state
        claim_type: creation
        grounds:
          - entities.RelicensingProject
          - endpoints["POST /relicensing/projects"]
        distinguishing_aspect: "A project created with only the required inputs must come back with stage PRE_FILING, wqc_status NONE, an all-zero burden ledger, timeline_posture ON_TRACK, regulatory_posture OPEN and version 1."
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9001", project_name: "Corner Creek", installed_capacity_mw: 15.5, base_annual_generation_mwh: 80000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id, stage: $.data.stage, wqc: $.data.wqc_status, ver: $.data.version, ratio: $.data.burden_ratio_pct, tl: $.data.timeline_posture, rp: $.data.regulatory_posture }
          assert:
            - "HTTP 201 with response_type object"
            - "${stage} == PRE_FILING and ${wqc} == NONE and ${ver} == 1"
            - "${tl} == ON_TRACK and ${rp} == OPEN"
            - "RelicensingProject.${proj}.total_pme_annual_cost_usd == 0.00, administrative_annual_charge_usd == 0.00, total_generation_loss_mwh == 0.0, total_annual_burden_usd == 0.00 and ${ratio} == 0.00"
            - "RelicensingProject.${proj}.economically_infeasible == false, infeasibility_waiver_granted == false, pad_filed_at == null, pad_year == null, last_sweep_at == null"
            - "RelicensingProject.${proj}.unresolved_mandatory_comment_count == 0, open_deficiency_count == 0, compliance_flag_count == 0"

      - name: dam_retrieval_returns_stored_fields
        claim_type: retrieval
        grounds:
          - entities.Dam
          - endpoints["GET /relicensing/dams/{dam_id}"]
        distinguishing_aspect: "GET by id returns exactly what was stored, including the two capacity-related integers that drive the scheduling rule."
        test_recipe:
          setup:
            - "One project with dam D7 (hazard_class SIGNIFICANT, inspection_interval_months 24, eap_exercise_required false, max_concurrent_field_activities 3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9002", project_name: "Retrieval Falls", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/dams"
              payload: { project_id: "${proj}", dam_code: "D7", hazard_class: "SIGNIFICANT", inspection_interval_months: 24, eap_exercise_required: false, max_concurrent_field_activities: 3 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { dam: $.data.id }
          trigger:
            - call: "GET /relicensing/dams/${dam}"
              payload: {}
              as: Regulator
              captures: { code: $.data.dam_code, hz: $.data.hazard_class, iv: $.data.inspection_interval_months, cap: $.data.max_concurrent_field_activities, pid: $.data.project_id }
          assert:
            - "${code} == D7, ${hz} == SIGNIFICANT, ${iv} == 24, ${cap} == 3"
            - "${pid} == ${proj} and Dam.${dam}.eap_exercise_required == false"
            - "Dam.${dam}.version == 1"

      - name: site_listing_returns_paginated_envelope
        claim_type: listing
        grounds:
          - endpoints["GET /relicensing/sites"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The filtered list honors limit/offset and reports total_count over the whole filtered set, so page 1 of 3 rows with limit 2 has has_more true and page 2 has has_more false."
        test_recipe:
          setup:
            - "One project with exactly three StudySite rows S1, S2 and S3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9003", project_name: "Paging Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S2", river_mile: 2.0 }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S3", river_mile: 3.0 }
              as: Licensee
              as_user_id: "u_lic_a"
          trigger:
            - call: "GET /relicensing/sites"
              payload: { project_id: "${proj}", limit: 2, offset: 0 }
              as: Regulator
              captures: { first: "$.data[0].id" }
            - call: "GET /relicensing/sites"
              payload: { project_id: "${proj}", limit: 2, offset: 2 }
              as: Regulator
              captures: { third: "$.data[0].id" }
          assert:
            - "the first response carries response_type array, exactly 2 rows, total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second response carries exactly 1 row, total_count == 3, offset == 2 and has_more == false"
            - "${first} != ${third} and every returned StudySite has project_id == ${proj}"

      - name: measure_get_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_MEASURE_NOT_FOUND]
          - endpoints["GET /relicensing/pme-measures/{measure_id}"]
        distinguishing_aspect: "A syntactically valid UUID that names no PmeMeasure returns the entity-specific 404 code, not a generic error."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "GET /relicensing/pme-measures/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MEASURE_NOT_FOUND with HTTP 404"
            - "the envelope carries response_type error and a message string"

      - name: project_creation_missing_required_license_expiration_rejected
        claim_type: required_fields
        grounds:
          - entities.RelicensingProject.fields.license_expiration_date
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "license_expiration_date has source input with no default and drives both milestone dates, so omitting it is a 400 rather than a project with a null timeline."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9004", project_name: "No Expiry", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000 }
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "no RelicensingProject row exists with license_number P-9004"

      - name: dam_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Dam.fields.eap_exercise_required
          - entities.Dam.fields.max_concurrent_field_activities
          - entities.StudySite.fields.min_rest_buffer_days
          - entities.StudySite.fields.cultural_sensitivity
        distinguishing_aspect: "Omitting the optional inputs yields the declared defaults eap_exercise_required true, max_concurrent_field_activities 1, min_rest_buffer_days 0 and cultural_sensitivity NONE, which in turn changes how many obligations the order generates."
        test_recipe:
          setup:
            - "One project at PRE_FILING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9005", project_name: "Default Dam", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /relicensing/dams"
              payload: { project_id: "${proj}", dam_code: "D1", hazard_class: "HIGH", inspection_interval_months: 12 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { dam: $.data.id, eap: $.data.eap_exercise_required, cap: $.data.max_concurrent_field_activities }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id, buf: $.data.min_rest_buffer_days, cs: $.data.cultural_sensitivity }
          assert:
            - "${eap} == true and ${cap} == 1"
            - "${buf} == 0 and ${cs} == NONE"
            - "Dam.${dam}.project_id == ${proj} and StudySite.${site}.project_id == ${proj}"

      - name: comment_mandatory_flag_is_computed_from_party_authority_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.ConsultationComment.fields.is_mandatory_condition
          - endpoints["POST /relicensing/comments"]
        distinguishing_aspect: "is_mandatory_condition has source computed: it is derived from the authoring party's has_conditioning_authority, so a client-supplied true from an NGO party is ignored and the plan's unresolved_mandatory_comment_count stays 0."
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a DRAFT study plan and one NGO party (has_conditioning_authority defaulting to false, contact user u_ngo)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9006", project_name: "Computed Flag Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "River Alliance", party_type: "NGO", vote_weight: 2, contact_user_id: "u_ngo" }
              as: Regulator
              captures: { party: $.data.id, auth: $.data.has_conditioning_authority }
          trigger:
            - call: "POST /relicensing/comments"
              payload: { study_plan_id: "${plan}", party_id: "${party}", resource_category: "RECREATION", comment_text: "Add a boat ramp", is_mandatory_condition: true }
              as: Stakeholder
              as_user_id: "u_ngo"
              captures: { cmt: $.data.id, mand: $.data.is_mandatory_condition, st: $.data.resolution_status }
            - call: "GET /relicensing/study-plans/${plan}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { open_cnt: $.data.open_comment_count, mand_cnt: $.data.unresolved_mandatory_comment_count }
          assert:
            - "${auth} == false (the default applies to a non-agency party)"
            - "${mand} == false even though the request body said true"
            - "${st} == OPEN and ConsultationComment.${cmt}.disposition == null and reopen_count == 0"
            - "${open_cnt} == 1 but ${mand_cnt} == 0"
            - "RelicensingProject.${proj}.regulatory_posture == OPEN (only mandatory comments restrict)"

      - name: project_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.RelicensingProject
          - endpoints["PATCH /relicensing/projects/{project_id}"]
        distinguishing_aspect: "id is a bare UUID with no type prefix, created_at is stamped once, and version starts at 1 and increments by exactly one per mutation while created_at stays fixed."
        test_recipe:
          setup:
            - "One project at PRE_FILING created at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9007", project_name: "System Field Dam", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id, v1: $.data.version }
          trigger:
            - call: "PATCH /relicensing/projects/${proj}"
              payload: { project_name: "System Field Dam (renamed)" }
              as: Regulator
              captures: { v2: $.data.version, nm: $.data.project_name }
          assert:
            - "${proj} is a bare 36-character UUID with no type prefix"
            - "${v1} == 1 and ${v2} == 2"
            - "${nm} == System Field Dam (renamed) and RelicensingProject.${proj}.created_at is unchanged while updated_at advanced"
            - "RelicensingProject.${proj}.burden_ratio_pct == 0.00 (a name-only PATCH does not disturb the ledger)"

      - name: dam_invalid_hazard_class_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Dam.fields.hazard_class
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "hazard_class is constrained to HIGH | SIGNIFICANT | LOW; a plausible-looking EXTREME is a 400 and no Dam row is created."
        test_recipe:
          setup:
            - "One project at PRE_FILING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9008", project_name: "Enum Dam", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /relicensing/dams"
              payload: { project_id: "${proj}", dam_code: "D1", hazard_class: "EXTREME", inspection_interval_months: 12 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /relicensing/dams?project_id=${proj} returns total_count 0"

      - name: study_misordered_fieldwork_window_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=32]
          - entities.ResourceStudy.fields.fieldwork_window_start
        distinguishing_aspect: "An interval payload whose end precedes its start is a schema-level 400 that fires before any site-occupancy or cultural-clearance reasoning."
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a DRAFT study plan and one site of cultural_sensitivity NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9009", project_name: "Interval Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
          trigger:
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "RECREATION", study_title: "Backwards window", fieldwork_window_start: "2026-10-01", fieldwork_window_end: "2026-09-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "StudyPlan.${plan}.attached_study_count == 0 and StudyPlan.${plan}.version is unchanged"

      - name: comment_is_immutable_and_has_no_version_field
        claim_type: immutability
        grounds:
          - entities.ConsultationComment
          - endpoints["GET /relicensing/comments/{comment_id}"]
        distinguishing_aspect: "ConsultationComment declares common_fields false, so it carries only id and created_at: §1.5 exposes no PATCH or DELETE for it and its representation has no version field even though resolve and reopen mutate its status."
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a DRAFT plan, one AGENCY party with conditioning authority and one comment from that party."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9010", project_name: "Immutable Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "State Fish Agency", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
              captures: { party: $.data.id }
            - call: "POST /relicensing/comments"
              payload: { study_plan_id: "${plan}", party_id: "${party}", resource_category: "FISH_PASSAGE", comment_text: "Study downstream passage" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { cmt: $.data.id }
          trigger:
            - call: "GET /relicensing/comments/${cmt}"
              payload: {}
              as: Regulator
              captures: { st: $.data.resolution_status, mand: $.data.is_mandatory_condition, reopens: $.data.reopen_count }
          assert:
            - "${st} == OPEN, ${mand} == true, ${reopens} == 0"
            - "the ConsultationComment representation exposes id and created_at but no version and no updated_at"
            - "§1.5 declares no PATCH or DELETE route under /relicensing/comments/{comment_id}"

      - name: study_with_site_from_another_project_returns_cross_project_error
        claim_type: parent_relationships
        grounds:
          - validations[priority=22]
          - errors[ERR_CROSS_PROJECT_REFERENCE]
        distinguishing_aspect: "Both referenced rows exist, so this is not a 404: the study plan belongs to project A and the site to project B, and the flat topology check rejects the mismatched pair with 422."
        test_recipe:
          setup:
            - "Project A at STUDY_PHASE with a DRAFT study plan."
            - "Project B with one StudySite."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9011", project_name: "Project A", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj_a: $.data.id }
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9012", project_name: "Project B", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj_b: $.data.id }
            - call: "POST /relicensing/projects/${proj_a}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj_a}", plan_title: "Study Plan A" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan_a: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj_b}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site_b: $.data.id }
          trigger:
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan_a}", site_id: "${site_b}", resource_category: "RECREATION", study_title: "Wrong-project site", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CROSS_PROJECT_REFERENCE with HTTP 422"
            - "the error is not ERR_SITE_NOT_FOUND: StudySite.${site_b} exists under project ${proj_b}"
            - "StudyPlan.${plan_a}.attached_study_count == 0"

      - name: comment_with_unknown_party_id_not_found
        claim_type: foreign_key_validated
        grounds:
          - validations[priority=21]
          - errors[ERR_PARTY_NOT_FOUND]
        distinguishing_aspect: "The referenced-entity existence check runs per FK in the body: a valid study_plan_id with an unknown party_id yields the party's own 404 code."
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a DRAFT study plan and one registered AGENCY party (so the acting AgencyReviewer passes the party-membership check) whose id is not the one referenced."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9013", project_name: "Unknown Party Reach", installed_capacity_mw: 9.0, base_annual_generation_mwh: 50000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/parties"
