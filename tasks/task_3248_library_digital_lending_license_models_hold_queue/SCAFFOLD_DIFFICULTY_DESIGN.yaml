            - "epoch.auto_orders_created == 1: after expiry C==0, holds_count 4 / max(0,1) == 4 >= 4 and pessimistic wait 252 > 28"
            - "the auto order has origin == AUTO_RATIO, model == OCOU, copies == 1 (needed = ceil(4/4) - 0 == 1), status == FULFILLED, invoiced_cost_cents == 5000"
            - "a new OCOU License exists for title ${titlem_id} with copies_total == 1 and status == ACTIVE (hop 3)"
            - "Hold.${hq1_id}.status == READY (hop 4: fulfillment promotion) and the epoch's holds_promoted >= 1"
