          - state_machines.Order.PENDING_to_AUTHORIZED
          - errors[ERR_CUSTOMER_SUSPENDED]
        distinguishing_aspect: |
          Order's PENDING->AUTHORIZED transition depends on a DIFFERENT entity's state:
          when Customer.account_status is SUSPENDED, checkout is rejected with
          ERR_CUSTOMER_SUSPENDED (entity pair Order<-Customer).
