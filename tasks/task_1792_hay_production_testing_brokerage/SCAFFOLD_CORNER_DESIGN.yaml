            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-05-30", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-05-31", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/weather-reports", payload: { region_code: "OR-WILLAMETTE", report_date: "2026-06-01", precipitation_mm: 0.0, drying_index: 70 }, as: PlatformAdmin }
            - { call: "POST /api/cuttings/${c_id}/mark-cut", payload: { actual_cut_date: "2026-06-01" }, as: Grower, as_user_id: "${g_id}" }
            - { call: "POST /api/storage-sites", payload: { name: "Climate Barn", region_code: "OR-WILLAMETTE", capacity_tons: 1000.0, moisture_controlled: true }, as: PlatformAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/bale-lots", payload: { cutting_id: "${c_id}", storage_site_id: "${s_id}", bale_type: "LARGE_SQUARE", bale_count: 200, harvested_tonnage: 100.0, harvested_date: "2026-06-01" }, as: BrokerOps, captures: { lot_id: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /api/bale-lots/${lot_id}", payload: {}, as: BrokerOps, captures: { lot_alloc: "$.data.allocatable_tonnage" } }
          assert:
            - "BaleLot.${lot_id}.allocatable_tonnage == 97.75 (100 * (1 - 3 * 0.0075))"
