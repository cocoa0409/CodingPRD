              as: Dispatcher
              as_user_id: "disp-1"
              captures: { f_id: $.data.id }
            - { call: "POST /flights/${f_id}/events", payload: { event_type: "PILOT_ACK" }, as: Pilot, as_user_id: "${pilot_id}" }
            - { call: "POST /flights/${f_id}/events", payload: { event_type: "OPEN_BOARDING" }, as: Dispatcher, as_user_id: "disp-1" }
