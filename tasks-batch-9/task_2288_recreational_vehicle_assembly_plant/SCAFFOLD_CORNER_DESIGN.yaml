              payload: { option_code: "OPT-N1", category: "INTERIOR", install_station: "FINISH", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { n1: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-N2", category: "INTERIOR", install_station: "FINISH", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { n2: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-N3", category: "INTERIOR", install_station: "FINISH", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { n3: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-N4", category: "INTERIOR", install_station: "FINISH", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { n4: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-N5", category: "INTERIOR", install_station: "FINISH", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 0, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { n5: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-TOW", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
