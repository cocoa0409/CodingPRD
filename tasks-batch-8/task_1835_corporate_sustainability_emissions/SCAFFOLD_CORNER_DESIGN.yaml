            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "REJECTED", reason: "Unreadable invoice" }, as: SustainabilityAnalyst, as_user_id: "analyst-1", captures: { st1: $.data.status, rr: $.data.reject_reason } }
            - { call: "POST /sustainability/activity-records/${rec}/transition", payload: { to_state: "SUBMITTED" }, as: SiteDataSteward, as_user_id: "steward-1", captures: { st2: $.data.status, rr2: $.data.reject_reason } }
          assert:
