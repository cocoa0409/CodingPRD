              as: PracticeAdmin
              captures: { fitter_id: $.data.id }
            - call: "POST /dme/clinics/${clinic_id}/patients"
              payload: { full_name: "Ida Moss", dob: "1961-03-04", payer_type: "COMMERCIAL", member_id: "CM-1", medicare_beneficiary: false }
              as: PracticeAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /dme/suppliers"
              payload: { name: "Shelfline Ortho", accreditation_body: "ABC", accreditation_expires_on: "2027-12-31", promised_turnaround_days: 10, dmepos_standards_attested: true, custom_fab_capable: false, quality_hold: false }
              as: PracticeAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L0650", description: "LSO brace, prefabricated", category: "OFF_SHELF_PREFAB", specialty: "SPINE", same_or_similar_group: "LSO_BRACE", reasonable_useful_lifetime_months: 60, allowed_amount_cents: 20600, cash_price_cents: 11765, unit_cost_cents: 6000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_shelf_id: $.data.id }
            - call: "POST /dme/products"
              payload: { supplier_id: "${supplier_id}", hcpcs_code: "L1960", description: "AFO, custom fabricated", category: "CUSTOM_FABRICATED", specialty: "SPINE", same_or_similar_group: "AFO_CUSTOM", reasonable_useful_lifetime_months: 36, allowed_amount_cents: 42000, cash_price_cents: 24000, unit_cost_cents: 15000, requires_prior_auth: false, ioas_supervision_required: "GENERAL" }
              as: InventoryManager
              captures: { prod_custom_id: $.data.id }
            - call: "POST /dme/par-levels"
              payload: { clinic_id: "${clinic_id}", product_id: "${prod_shelf_id}", par_min_qty: 1, par_max_qty: 20 }
              as: InventoryManager
              captures: { par_id: $.data.id }
            - call: "POST /dme/par-levels/${par_id}/stock-receipts"
              payload: { received_qty: 1 }
              as: InventoryManager
              captures: { par_v: $.data.version, par_available: $.data.available_qty }
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_id}", product_id: "${prod_shelf_id}", ordering_physician_id: "${phys_a_id}", quantity: 2 }
              as: PracticeAdmin
              captures: { enc_shelf_id: $.data.id }
            - call: "POST /dme/encounters/${enc_shelf_id}/medical-necessity-note"
              payload: { mn_diagnosis_code: "M54.50", mn_functional_deficit: "lumbar instability limiting ambulation", mn_expected_duration_months: 6 }
              as: OrthoPhysician
              as_user_id: "${phys_a_id}"
            - call: "POST /dme/encounters"
              payload: { clinic_id: "${clinic_id}", patient_id: "${patient_id}", product_id: "${prod_custom_id}", ordering_physician_id: "${phys_a_id}", quantity: 1 }
