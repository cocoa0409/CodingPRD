  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: affiliation_approval_gated_by_first_registration_active
        grounds:
          - state_machines.AffiliationRequest.PENDING_to_APPROVED
          - entities.AffiliationRequest.fields.first_registration_request_id
        distinguishing_aspect: |
          Pair (AffiliationRequest -> RegistrationRequest): approving the
          affiliation requires the first registration to be ACTIVE; while it is
          APPROVED-but-not-yet-ACTIVE (day-rollover pending) the approve is
          rejected, and after the clock advances one day it succeeds — the gate
          tracks the sibling entity's exact state.
        test_recipe:
          setup:
            - "Firms F1, F2; applicant with R1 at F1 fully gated and approved 2026-06-02 (still APPROVED at clock 2026-06-02T12:00:00Z)"
            - "Affiliation AF PENDING at F2 built on R1"
          setup_api_calls:
            - call: "POST /registration-desk/firms"
              payload: { crd_number: "1701", legal_name: "Cross Firm 1" }
              as: SystemOperator
              captures: { firm_x1_id: $.data.id }
