  - rule_id: boundary_precision_check
    instances:
      - name: class_capacity_exact_boundary
        grounds:
          - entities.ShowClass.fields.capacity
          - entities.ShowClass.fields.confirmed_count
          - errors[ERR_CLASS_FULL]
        distinguishing_aspect: |
          Metric: registration count vs class capacity via POST /registrations. With capacity 2,
          the 2nd create (count becomes exactly 2) must succeed; the 3rd (count 2 >= capacity 2)
          must fail — the boundary is inclusive-up-to-capacity, not strict.
        test_recipe:
          setup:
            - "Event REGISTRATION_OPEN; class TINY capacity 2; three non-member registrants with eligible vehicles"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Cap Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "TINY", name: "Tiny", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 2, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "C1", email: "c1@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /registrants", payload: { full_name: "C2", email: "c2@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p2: $.data.id } }
            - { call: "POST /registrants/${p2}/vehicles", payload: { year: 1971, make: "Chevrolet", model: "Chevelle" }, as: Organizer, captures: { v2: $.data.id } }
            - { call: "POST /registrants", payload: { full_name: "C3", email: "c3@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p3: $.data.id } }
            - { call: "POST /registrants/${p3}/vehicles", payload: { year: 1972, make: "Pontiac", model: "GTO" }, as: Organizer, captures: { v3: $.data.id } }
          trigger:
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p2}", vehicle_id: "${v2}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r2: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p3}", vehicle_id: "${v3}", class_id: "${cl}" }, as: RegistrationDesk, captures: { err: $.data.error_id } }
          assert:
            - "registrations 1 and 2 succeed (201); ShowClass.confirmed_count == 2 (exactly at capacity)"
            - "registration 3 fails with ERR_CLASS_FULL (HTTP 409)"
            - "ShowClass.confirmed_count remains 2 after the rejected create"

      - name: noise_limit_and_curfew_edges
        grounds:
          - calculations.noise_compliance_eval
          - entities.NoiseReading.fields.is_exceedance
          - entities.NoiseReading.fields.limit_db
        distinguishing_aspect: |
          Metric: continuous dB threshold and curfew window membership via POST
          /events/{id}/noise-readings (distinct metric and endpoint from class capacity).
          95.0 by day is NOT an exceedance (strict >), 95.1 is; at exactly 22:00 the curfew
          limit 85.0 applies (window start inclusive); at 21:59:59 the day limit still applies.
        test_recipe:
          setup:
            - "Published event with curfew 22:00-07:00; no readings yet"
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Noise Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1", tabulation_method: "STRAIGHT_AVERAGE" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
          trigger:
            - { call: "POST /events/${ev}/noise-readings", payload: { reading_db: 95.0, source: "STAGE", recorded_at: "2026-08-15T15:00:00Z" }, as: RegistrationDesk, captures: { n1_exc: $.data.is_exceedance, n1_lim: $.data.limit_db } }
            - { call: "POST /events/${ev}/noise-readings", payload: { reading_db: 95.1, source: "STAGE", recorded_at: "2026-08-15T15:05:00Z" }, as: RegistrationDesk, captures: { n2_exc: $.data.is_exceedance } }
            - { call: "POST /events/${ev}/noise-readings", payload: { reading_db: 90.0, source: "PA_SYSTEM", recorded_at: "2026-08-15T22:00:00Z" }, as: RegistrationDesk, captures: { n3_exc: $.data.is_exceedance, n3_cur: $.data.is_curfew, n3_lim: $.data.limit_db } }
            - { call: "POST /events/${ev}/noise-readings", payload: { reading_db: 90.0, source: "PA_SYSTEM", recorded_at: "2026-08-15T21:59:59Z" }, as: RegistrationDesk, captures: { n4_exc: $.data.is_exceedance, n4_cur: $.data.is_curfew } }
            - { call: "GET /events/${ev}/summary", payload: {}, as: Organizer }
          assert:
            - "reading 1 (95.0 at 15:00): is_exceedance == false, limit_db == 95.0 (exactly at limit is compliant)"
            - "reading 2 (95.1 at 15:05): is_exceedance == true"
            - "reading 3 (90.0 at exactly 22:00): is_curfew == true, limit_db == 85.0, is_exceedance == true"
            - "reading 4 (90.0 at 21:59:59): is_curfew == false, is_exceedance == false"
            - "summary.noise_exceedance_count == 2 and sound_permit_status == ACTIVE (threshold 3 not reached)"

      - name: withdrawal_refund_168h_boundary
        grounds:
          - calculations.withdrawal_refund_calc
          - state_machines.Registration.CONFIRMED_to_REFUND_REQUESTED
        distinguishing_aspect: |
          Metric: hours-before-gates refund tier via POST /registrations/{id}/withdraw +
          refund-decision (distinct endpoint from capacity and noise). Exactly 168.0h before
          gates_open_at is in the 100% tier (>= boundary); one second later is in the 50% tier.
        test_recipe:
          setup:
            - "Event gates_open_at 2026-08-15T09:00:00Z; two registrations R1/R2 each paid 3000; clock positioned first at exactly 2026-08-08T09:00:00Z (168.0h), then at 2026-08-08T09:00:01Z"
          setup_api_calls:
