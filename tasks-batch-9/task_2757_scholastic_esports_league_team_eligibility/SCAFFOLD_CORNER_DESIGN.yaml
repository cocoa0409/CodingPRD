            - call: "POST /fair-play-cases"
              payload: { team_id: "${tm1_id}", subject_type: "STUDENT", case_type: "ACCOUNT_SHARING", evidence_ref: "EV-1", subject_student_id: "${st1_id}" }
              as: IntegrityOfficer
              as_user_id: "integrity-a"
              captures: { fc1_id: $.data.id }
            - call: "POST /fair-play-cases"
              payload: { team_id: "${tm1_id}", subject_type: "STUDENT", case_type: "ACCOUNT_SHARING", evidence_ref: "EV-2", subject_student_id: "${st2_id}" }
              as: IntegrityOfficer
              as_user_id: "integrity-a"
              captures: { fc2_id: $.data.id }
            - call: "POST /fair-play-cases/${fc1_id}/investigate"
              payload: { investigation_note: "logs reviewed" }
              as: IntegrityOfficer
              as_user_id: "integrity-a"
            - call: "POST /fair-play-cases/${fc2_id}/investigate"
              payload: { investigation_note: "logs reviewed" }
              as: IntegrityOfficer
              as_user_id: "integrity-a"
          trigger:
            - call: "POST /fair-play-cases/${fc1_id}/decision"
              payload: { decision: "SUSTAIN", decision_note: "no severity supplied" }
              as: IntegrityOfficer
              as_user_id: "integrity-b"
              captures: { e_missing: $.data.error_id }
            - call: "POST /fair-play-cases/${fc1_id}/decision"
              payload: { decision: "DISMISS", severity: "MINOR", decision_note: "severity supplied anyway" }
              as: IntegrityOfficer
              as_user_id: "integrity-b"
              captures: { e_forbidden: $.data.error_id }
            - call: "POST /fair-play-cases/${fc1_id}/decision"
              payload: { decision: "DISMISS", decision_note: "shared IP was the school lab" }
              as: IntegrityOfficer
              as_user_id: "integrity-b"
            - call: "POST /fair-play-cases/${fc2_id}/decision"
              payload: { decision: "SUSTAIN", severity: "MINOR", decision_note: "credential sharing confirmed" }
              as: IntegrityOfficer
              as_user_id: "integrity-b"
          assert:
            - "trigger 1 returns 400 with data.error_id == ERR_INVALID_REQUEST — SUSTAIN without severity is rejected on shape, not on state, and FairPlayCase.${fc1_id}.status is still INVESTIGATING"
            - "trigger 2 returns 400 with data.error_id == ERR_INVALID_REQUEST — the same field the other branch requires is forbidden here; it is NOT silently ignored"
            - "after both refusals FairPlayCase.${fc1_id}.decider_user_id is null and decided_at is null"
            - "trigger 3 returns 200 with data.status == DISMISSED, data.decider_user_id == integrity-b, data.decided_at == 2026-08-01T00:00:00.000Z, data.severity == null, data.severity_weight == 0, data.repeat_index == null, data.applied_penalty == 0 and data.sanction_type == NONE"
            - "the DISMISS branch changed nothing else: Student.${st1_id}.fair_play_status == CLEAR, RosterSlot.${sl1_id}.participation_status == PROSPECTIVE, Team.${tm1_id}.integrity_score == 100.00 and Team.${tm1_id}.status == DRAFT"
            - "trigger 4 returns 200 with data.status == SUSTAINED, data.severity == MINOR, data.severity_weight == 10 (MINOR 5 + ACCOUNT_SHARING 5), data.repeat_index == 1, data.applied_penalty == 10.00 and data.sanction_type == STUDENT_SUSPENSION"
            - "repeat_index is 1 for ${fc2_id} even though ${fc1_id} was decided first on the same team — DISMISSED cases are outside the sustained set that the repeat ladder indexes"
            - "Team.${tm1_id}.integrity_score == 90.00 and Student.${st2_id}.fair_play_status == SANCTIONED after trigger 4"
            - "RosterSlot.${sl2_id}.participation_status is still PROSPECTIVE — cascade link 3 only demotes ACTIVE slots, and this slot was never verified"

