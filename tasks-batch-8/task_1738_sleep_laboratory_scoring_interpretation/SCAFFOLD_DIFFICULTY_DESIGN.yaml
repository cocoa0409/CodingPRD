            - { call: "POST /authorizations/${a1}/decision", payload: { outcome: "APPROVED" }, as: Scheduler }
            - { call: "POST /sleep-studies", payload: { patient_id: "${p1}", order_id: "${o1}", study_type: "HST", scheduled_date: "2026-08-01" }, as: Scheduler, captures: { st1: $.data.id } }
