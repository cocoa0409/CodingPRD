              as: ProgramAdmin
              captures: { ops_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Nora Bell", job_function: "ADMIN", team_discipline: "CLINICAL" }
              as: ProgramAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Omar Haddad", job_function: "ADMIN", team_discipline: "LEGAL" }
              as: ProgramAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /employees"
              payload: { worksite_id: "${ws_id}", work_area_id: "${wa_front_id}", full_name: "Priya Nair", job_function: "ADMIN" }
              as: ProgramAdmin
              captures: { hr_id: $.data.id }
            - call: "POST /employees"
