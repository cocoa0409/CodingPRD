              as: FraudAnalyst
              as_user_id: "analyst-98"
              captures: { alert_id: $.data.id, av0: $.data.version, as0: $.data.state }
            - call: "GET /draining-alerts/${alert_id}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-98"
              captures: { av0r: $.data.version }
            - call: "GET /draining-alerts/${alert_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-98"
              captures: { av0r2: $.data.version }
            - call: "POST /draining-alerts/${alert_id}/triage"
              payload: { triage_note: "probe triage", redemption_pattern_reviewed: false }
