              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "Loan.${loan_id}.version is unchanged and outstanding_principal_cents == 5000000"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: stale_model_version_on_patch_returns_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[model-draft-edit-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on ModelVersion: after one successful PATCH bumps version 1 -> 2, a second PATCH carrying the pre-edit version 1 (via ${m_v0}) is 412 ERR_STALE_VERSION — deterministic across two strictly sequential requests."
        test_recipe:
          setup:
            - "Logical clock at default. One DRAFT model, version 1 observed at creation."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-X-1", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "occ", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id, m_v0: $.data.version }
          trigger:
            - call: "PATCH /platform/model-versions/${m_id}"
              payload: { variables: [{ name: "bureau_score", weight: 2, min: 300, max: 850 }], score_floor: 0, score_ceiling: 1000, expected_model_version: "${m_v0}" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "PATCH /platform/model-versions/${m_id}"
              payload: { variables: [{ name: "bureau_score", weight: 3, min: 300, max: 850 }], score_floor: 0, score_ceiling: 1000, expected_model_version: "${m_v0}" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { err: $.data.error_id }
          assert:
            - "the first PATCH returns 200 and ModelVersion.${m_id}.version == 2 with variable weight 2"
            - "the second PATCH returns 412 and error_id == ERR_STALE_VERSION"
            - "ModelVersion.${m_id}.variables still has weight 2 (the stale write was rejected)"

      - name: stale_partner_version_on_box_activate_returns_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[credit-box-activation-stale-partner]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on Partner via the box-activation endpoint: the first activation supersedes nothing but bumps Partner.version; a second box activation carrying the pre-first-activation partner version is 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "Logical clock at default. Partner ACTIVE with two DRAFT boxes B1 and B2; partner version observed at creation."
          setup_api_calls:
            - call: "POST /platform/partners"
              payload: { legal_name: "OCC Bank", partner_type: "BANK", home_state: "TX" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { p_id: $.data.id, p_v0: $.data.version }
            - call: "POST /platform/partners/${p_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${p_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { b1_id: $.data.id }
            - call: "POST /platform/partners/${p_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX", "CA"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /platform/partners/${p_id}/credit-boxes/${b1_id}/activate"
              payload: { expected_partner_version: "${p_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${p_id}/credit-boxes/${b2_id}/activate"
              payload: { expected_partner_version: "${p_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { err: $.data.error_id }
          assert:
            - "the first activation returns 200 and Partner.${p_id}.version advanced (active_credit_box_id == ${b1_id})"
            - "the second activation with the same stale expected_partner_version returns 412 and error_id == ERR_STALE_VERSION"
            - "CreditBox.${b2_id}.status is still DRAFT and Partner.${p_id}.active_credit_box_id == ${b1_id}"

      - name: suspended_partner_box_excluded_from_allocation
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Partner.ACTIVE_to_SUSPENDED
          - calculations.allocation_selector
        distinguishing_aspect: "Suspending the only bank mid-flow does not change the box's own status (still ACTIVE) yet the very next allocation skips that partner with reason PARTNER_INACTIVE and lands the loan on a whole-loan buyer — the side effect is in eligibility, not in box state."
        test_recipe:
          setup:
            - "Logical clock at default. Model ACTIVE. Bank B ACTIVE with box TX cap 10; whole-loan buyer W ACTIVE with box [TX] cap 10. Bank B is then SUSPENDED. One clean TX applicant with an UNDERWRITTEN application."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-X-2", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "susp", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
            - call: "POST /platform/model-versions/${m_id}/validate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-validator"
            - call: "POST /platform/fairness-reviews"
              payload: { model_version_id: "${m_id}", review_type: "DISPARATE_IMPACT", details: "baseline" }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { fr_id: $.data.id }
            - call: "POST /platform/fairness-reviews/${fr_id}/decide"
              payload: { outcome: "PASSED" }
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
            - call: "POST /platform/partners"
              payload: { legal_name: "Susp Bank", partner_type: "BANK", home_state: "TX" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { bank_id: $.data.id, bank_v0: $.data.version }
            - call: "POST /platform/partners/${bank_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${bank_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { box_b: $.data.id }
            - call: "POST /platform/partners/${bank_id}/credit-boxes/${box_b}/activate"
              payload: { expected_partner_version: "${bank_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners"
              payload: { legal_name: "Susp Buyer", partner_type: "LOAN_BUYER", home_state: "DE" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { buyer_id: $.data.id, buyer_v0: $.data.version }
            - call: "POST /platform/partners/${buyer_id}/activate"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/partners/${buyer_id}/credit-boxes"
              payload: { min_score: 0, max_score: 1000, allowed_states: ["TX"], min_loan_cents: 100000, max_loan_cents: 10000000, monthly_volume_cap_count: 10, annual_percentage_rate: 12.0, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: PartnerAdmin
              as_user_id: "pa-one"
              captures: { box_w: $.data.id }
            - call: "POST /platform/partners/${buyer_id}/credit-boxes/${box_w}/activate"
              payload: { expected_partner_version: "${buyer_v0} + 1" }
              as: PartnerAdmin
              as_user_id: "pa-one"
            - call: "POST /platform/applicants"
              payload: { full_name: "Susp Sue", state_code: "TX", annual_income_cents: 12000000, monthly_debt_payments_cents: 200000, education_level: "BACHELOR", employment_status: "EMPLOYED", months_employed: 12, bank_account_avg_balance_cents: 500000, bank_account_nsf_count_90d: 0, monthly_net_cashflow_cents: 100000, bureau_score: 575 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { ap_id: $.data.id }
            - call: "POST /platform/applications"
              payload: { applicant_id: "${ap_id}", channel: "DIRECT", requested_amount_cents: 5000000 }
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { app_id: $.data.id }
            - call: "GET /platform/applications/${app_id}/verifications"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
              captures: { v_inc: "$.data[0].id", v_idn: "$.data[1].id" }
            - call: "POST /platform/applications/${app_id}/verifications/${v_inc}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/applications/${app_id}/verifications/${v_idn}/instant-check"
              payload: {}
              as: VerificationOfficer
              as_user_id: "vo-one"
            - call: "POST /platform/partners/${bank_id}/suspend"
              payload: {}
              as: PartnerAdmin
              as_user_id: "pa-one"
          trigger:
            - call: "POST /platform/applications/${app_id}/allocate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pad-one"
              captures: { alloc_id: $.data.id }
          assert:
            - "CreditBox.${box_b}.status is still ACTIVE (suspend does not touch box state)"
            - "AllocationDecision.${alloc_id}.channel == WHOLE_LOAN_SALE and chosen_partner_id == ${buyer_id}"
            - "AllocationDecision.${alloc_id}.reason_codes contains PARTNER_INACTIVE for the suspended bank"

