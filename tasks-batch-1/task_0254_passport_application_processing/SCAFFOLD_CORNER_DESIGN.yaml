  # ===========================================================================
  # SECTION: calculations  (claim-extraction-guide Table 3)
  # ===========================================================================
  - section: calculations
    instances:
      - name: fee_adult_book_and_card_bundle_discount_correct
        claim_type: Correct Result
        grounds:
          - calculations.fee_assessment
          - entities.FeeAssessment.fields.base_fee_cents
          - entities.FeeAssessment.fields.total_due_cents
        distinguishing_aspect: "Adult BOOK_AND_CARD ROUTINE base = 13000 + 3000 - 1000 = 15000 with execution 3500 (NEW requires execution), no expedite/urgent/delivery, so total_due_cents == 18500 — adult side of the bundle, complementing the §1.8 minor-bundle instance."
        test_recipe:
          setup:
            - "Adult NEW BOOK_AND_CARD ROUTINE application, PASS photo, both docs attached, submitted."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Bundle", date_of_birth: "1990-01-01", email: "bundle@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK_AND_CARD", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { base: "$.data[0].base_fee_cents", total: "$.data[0].total_due_cents" }
          assert:
            - "FeeAssessment.base_fee_cents == 15000"
            - "FeeAssessment.execution_fee_cents == 3500"
            - "FeeAssessment.total_due_cents == 18500"

