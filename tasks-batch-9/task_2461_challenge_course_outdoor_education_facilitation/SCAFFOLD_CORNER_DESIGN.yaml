          difficulty_instance: priority_pair_validation_conflict / element_phase_mismatch_outranks_element_schedule_conflict
          rationale: "That instance constructs a block that is simultaneously phase-mismatched and time-overlapping and asserts the 422 wins over the 409."

      - name: cascading_validation_runs_state_check_before_posture_check
