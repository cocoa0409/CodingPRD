scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: joyce_vs_finnigan_apportionment_divergence
        grounds:
          - calculations.apportionment_factor_computation
          - entities.StateFiling.fields.apportionment_percentage
          - entities.StateFiling.fields.tax_before_credits
          - entities.ApportionmentFactor.fields.numerator
          - entities.ActivityRecord.fields.protected_solicitation_only
        distinguishing_aspect: |
          This dual variant lives on the StateFiling / ApportionmentFactor income-apportionment
          domain: JOYCE excludes a P.L. 86-272 protected member from all three numerators while
          FINNIGAN includes it, so identical ActivityRecord rows yield apportionment_percentage
          0.200000 under JOYCE and 0.245000 under FINNIGAN on the same filing row.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TaxpayerGroup with everywhere_sales 10000000, everywhere_property 4000000, everywhere_payroll 2000000."
            - "Two unitary members: Meridian Manufacturing (unprotected in CA) and Meridian Services (protected solicitation only in CA)."
            - "CA registration: DOUBLE_WEIGHTED_SALES, tax_rate 0.0884, THROWBACK, MARKET_BASED; nexus PHYSICAL and registration_status REGISTERED."
            - "One DRAFT StateFiling for tax_year 2026, filing_basis COMBINED_UNITARY, federal_taxable_income 5000000, carrying three modification lines whose per-line rounded sum is 676.57."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TaxManager
            - call: "POST /salt/groups"
              payload: { name: "Meridian Industries", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000, fiscal_year_end_month: 12 }
              as: TaxManager
              captures: { grp_id: $.data.id }
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: { name: "Meridian Manufacturing", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true }
              as: TaxManager
              captures: { le_a_id: $.data.id }
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: { name: "Meridian Services", incorporation_state_code: "NV", entity_type: "CORP", is_unitary_member: true }
              as: TaxManager
              captures: { le_b_id: $.data.id }
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: { state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED", safe_harbor_basis: "PRIOR_YEAR_110", prior_year_tax: 40000, current_year_estimated_tax: 90000, due_month: 4, due_day: 15, extension_months: 6, estimated_installment_count: 4 }
              as: TaxManager
              captures: { reg_ca_id: $.data.id }
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: { legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 1200000, origin_sales: 300000, purchaser_taxable_in_state: false, service_receipts: 0, property_average_value: 800000, rented_property_annual_rent: 25000, payroll_compensation: 500000, employee_days_in_state: 40, protected_solicitation_only: false }
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: { legal_entity_id: "${le_b_id}", tax_year: 2026, destination_sales: 400000, origin_sales: 0, purchaser_taxable_in_state: true, service_receipts: 250000, cost_of_performance_state_code: "NV", property_average_value: 0, rented_property_annual_rent: 0, payroll_compensation: 100000, employee_days_in_state: 5, protected_solicitation_only: true }
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/evaluate-nexus"
              payload: { as_of_tax_year: 2026 }
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/complete-registration"
              payload: { state_account_number: "CA-99887766" }
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/filings"
              payload: { tax_year: 2026, filing_basis: "COMBINED_UNITARY", federal_taxable_income: 5000000 }
              as: StateAnalyst
              captures: { f_id: $.data.id }
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: { modification_code: "STATE_TAX_ADDBACK", direction: "ADDITION", raw_amount: 125042.00, allocation_ratio: 0.008 }
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: { modification_code: "MUNI_INTEREST_SUB", direction: "SUBTRACTION", raw_amount: 92379.00, allocation_ratio: 0.008 }
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: { modification_code: "DEPREC_ADJ", direction: "ADDITION", raw_amount: 51907.00, allocation_ratio: 0.008 }
              as: StateAnalyst
          trigger:
            - call: "POST /salt/filings/${f_id}/compute-factors"
              payload: { apportionment_variant: "JOYCE" }
              as: StateAnalyst
              captures: { ap_joyce: $.data.apportionment_percentage, tbc_joyce: $.data.tax_before_credits }
            - call: "POST /salt/filings/${f_id}/compute-factors"
              payload: { apportionment_variant: "FINNIGAN" }
              as: StateAnalyst
              captures: { ap_finn: $.data.apportionment_percentage, tbc_finn: $.data.tax_before_credits }
          assert:
            - "StateFiling.${f_id}.modification_total == 676.57"
            - "after the first trigger call StateFiling.${f_id}.apportionment_variant == JOYCE and apportionment_percentage == 0.200000"
            - "after the first trigger call StateFiling.${f_id}.state_taxable_income == 1000135.31"
            - "after the first trigger call StateFiling.${f_id}.tax_before_credits == 88411.96"
            - "after the second trigger call StateFiling.${f_id}.apportionment_variant == FINNIGAN and apportionment_percentage == 0.245000"
            - "after the second trigger call StateFiling.${f_id}.state_taxable_income == 1225165.76"
            - "after the second trigger call StateFiling.${f_id}.tax_before_credits == 108304.65"
            - "GET /salt/filings/${f_id}/factors after the JOYCE run: the SALES row has numerator == 1500000, denominator == 10000000, ratio == 0.150000; the PAYROLL row has numerator == 500000, ratio == 0.250000"
            - "GET /salt/filings/${f_id}/factors after the FINNIGAN run: the SALES row has numerator == 2150000, ratio == 0.215000; the PAYROLL row has numerator == 600000, ratio == 0.300000"
            - "the PROPERTY row ratio is 0.250000 under both variants because the protected member holds no property"

      - name: prior_year_vs_current_year_safe_harbor_divergence
        grounds:
          - calculations.estimated_installment_requirement
          - entities.EstimatedPayment.fields.safe_harbor_required_amount
          - entities.EstimatedPayment.fields.underpayment_amount
          - entities.EstimatedPayment.fields.underpayment_penalty
          - entities.StateRegistration.fields.safe_harbor_basis
        distinguishing_aspect: |
          This dual variant lives on a different entity domain - the EstimatedPayment / StateRegistration
          cash-scheduling domain, not income apportionment: two registrations holding identical
          prior_year_tax 40000, current_year_estimated_tax 90000, four installments and an identical
          8000 + 8000 remittance history produce safe_harbor_required_amount 22000.00 under
          PRIOR_YEAR_110 and 40500.00 under CURRENT_YEAR_90.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One TaxpayerGroup with two registrations, CA on safe_harbor_basis PRIOR_YEAR_110 and NY on CURRENT_YEAR_90, otherwise field-for-field identical (prior_year_tax 40000, current_year_estimated_tax 90000, estimated_installment_count 4)."
            - "Each registration has installment 1 and installment 2 of tax_year 2026 remitted at 8000.00 each."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TaxManager
            - call: "POST /salt/groups"
              payload: { name: "Harbor Systems", base_state_code: "DE", everywhere_sales: 8000000, everywhere_property: 2000000, everywhere_payroll: 1500000 }
              as: TaxManager
              captures: { grp_id: $.data.id }
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: { state_code: "CA", factor_formula: "SINGLE_SALES_FACTOR", tax_rate: 0.0884, throwback_rule: "NONE", service_sourcing_rule: "MARKET_BASED", safe_harbor_basis: "PRIOR_YEAR_110", prior_year_tax: 40000, current_year_estimated_tax: 90000, estimated_installment_count: 4 }
              as: TaxManager
              captures: { reg_ca_id: $.data.id, reg_ca_v1: $.data.version }
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: { state_code: "NY", factor_formula: "SINGLE_SALES_FACTOR", tax_rate: 0.0650, throwback_rule: "NONE", service_sourcing_rule: "MARKET_BASED", safe_harbor_basis: "CURRENT_YEAR_90", prior_year_tax: 40000, current_year_estimated_tax: 90000, estimated_installment_count: 4 }
              as: TaxManager
              captures: { reg_ny_id: $.data.id, reg_ny_v1: $.data.version }
            - call: "POST /salt/registrations/${reg_ca_id}/payments"
              payload: { tax_year: 2026, installment_number: 1, amount: 8000.00, paid_on_date: "2026-04-15T00:00:00Z", expected_registration_version: "${reg_ca_v1}" }
              as: Controller
            - call: "GET /salt/registrations/${reg_ca_id}"
              payload: {}
              as: Controller
              captures: { reg_ca_v2: $.data.version }
            - call: "POST /salt/registrations/${reg_ny_id}/payments"
              payload: { tax_year: 2026, installment_number: 1, amount: 8000.00, paid_on_date: "2026-04-15T00:00:00Z", expected_registration_version: "${reg_ny_v1}" }
              as: Controller
            - call: "GET /salt/registrations/${reg_ny_id}"
              payload: {}
              as: Controller
              captures: { reg_ny_v2: $.data.version }
          trigger:
            - call: "POST /salt/registrations/${reg_ca_id}/payments"
              payload: { tax_year: 2026, installment_number: 2, amount: 8000.00, paid_on_date: "2026-06-15T00:00:00Z", expected_registration_version: "${reg_ca_v2}" }
              as: Controller
              captures: { pay_ca2_id: $.data.id }
            - call: "POST /salt/registrations/${reg_ny_id}/payments"
              payload: { tax_year: 2026, installment_number: 2, amount: 8000.00, paid_on_date: "2026-06-15T00:00:00Z", expected_registration_version: "${reg_ny_v2}" }
              as: Controller
              captures: { pay_ny2_id: $.data.id }
          assert:
            - "EstimatedPayment.${pay_ca2_id}.safe_harbor_required_amount == 22000.00"
            - "EstimatedPayment.${pay_ca2_id}.underpayment_amount == 6000.00"
            - "EstimatedPayment.${pay_ca2_id}.underpayment_penalty == 300.00"
            - "EstimatedPayment.${pay_ny2_id}.safe_harbor_required_amount == 40500.00"
            - "EstimatedPayment.${pay_ny2_id}.underpayment_amount == 24500.00"
            - "EstimatedPayment.${pay_ny2_id}.underpayment_penalty == 1225.00"
            - "EstimatedPayment.${pay_ca2_id}.due_date == 2026-06-15T00:00:00Z and is_timely == true"
            - "StateRegistration.${reg_ca_id}.total_payments_received == 16000.00 and unapplied_payment_balance == 16000.00"

  # =====================================================================
  # Rule 2 - combinatorial formulas across different modes (a) / (b) / (c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: factor_weight_renormalization_on_zero_denominator
        grounds:
          - calculations.apportionment_factor_computation
          - entities.ApportionmentFactor.fields.included
          - entities.ApportionmentFactor.fields.weight
          - entities.StateRegistration.fields.factor_formula
          - validations[priority=29]
        distinguishing_aspect: |
          MODE (a): a five-input non-linear formula - three factor ratios, the state's
          factor_formula base-weight vector, and a per-factor inclusion predicate - where a
          single zero denominator drops PROPERTY, renormalizes DOUBLE_WEIGHTED_SALES from
          (2,1,1)/4 to (2,0,1)/3 and moves apportionment_percentage from 0.200000 to 0.183333.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "TaxpayerGroup with everywhere_sales 10000000, everywhere_property 0 and everywhere_payroll 2000000."
            - "CA registration on DOUBLE_WEIGHTED_SALES, tax_rate 0.0884, THROWBACK, MARKET_BASED, nexus PHYSICAL."
            - "One DRAFT StateFiling for 2026, COMBINED_UNITARY, federal_taxable_income 5000000, with the same three modification lines summing to 676.57."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TaxManager
            - call: "POST /salt/groups"
              payload: { name: "Zero Property Holdings", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 0, everywhere_payroll: 2000000 }
              as: TaxManager
              captures: { grp_id: $.data.id }
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: { name: "ZPH Manufacturing", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true }
              as: TaxManager
              captures: { le_a_id: $.data.id }
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: { name: "ZPH Services", incorporation_state_code: "NV", entity_type: "CORP", is_unitary_member: true }
              as: TaxManager
              captures: { le_b_id: $.data.id }
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: { state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED" }
              as: TaxManager
              captures: { reg_ca_id: $.data.id }
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: { legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 1200000, origin_sales: 300000, purchaser_taxable_in_state: false, property_average_value: 800000, rented_property_annual_rent: 25000, payroll_compensation: 500000, employee_days_in_state: 40, protected_solicitation_only: false }
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: { legal_entity_id: "${le_b_id}", tax_year: 2026, destination_sales: 400000, service_receipts: 250000, cost_of_performance_state_code: "NV", payroll_compensation: 100000, employee_days_in_state: 5, protected_solicitation_only: true }
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/evaluate-nexus"
              payload: { as_of_tax_year: 2026 }
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/filings"
              payload: { tax_year: 2026, filing_basis: "COMBINED_UNITARY", federal_taxable_income: 5000000 }
              as: StateAnalyst
              captures: { f_id: $.data.id }
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: { modification_code: "STATE_TAX_ADDBACK", direction: "ADDITION", raw_amount: 125042.00, allocation_ratio: 0.008 }
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: { modification_code: "MUNI_INTEREST_SUB", direction: "SUBTRACTION", raw_amount: 92379.00, allocation_ratio: 0.008 }
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: { modification_code: "DEPREC_ADJ", direction: "ADDITION", raw_amount: 51907.00, allocation_ratio: 0.008 }
              as: StateAnalyst
          trigger:
            - call: "POST /salt/filings/${f_id}/compute-factors"
              payload: { apportionment_variant: "JOYCE" }
              as: StateAnalyst
              captures: { ap_pct: $.data.apportionment_percentage }
          assert:
            - "StateFiling.${f_id}.apportionment_percentage == 0.183333"
            - "StateFiling.${f_id}.state_taxable_income == 916789.04"
            - "StateFiling.${f_id}.tax_before_credits == 81044.15"
            - "GET /salt/filings/${f_id}/factors: the PROPERTY row has denominator == 0, included == false, ratio == 0 and weight == 0"
            - "GET /salt/filings/${f_id}/factors: the SALES row has weight == 0.666667 and ratio == 0.150000"
            - "GET /salt/filings/${f_id}/factors: the PAYROLL row has weight == 0.333333 and ratio == 0.250000"
            - "no ERR_FACTOR_DENOMINATOR_ZERO is raised because SALES and PAYROLL survive exclusion"

      - name: modification_per_line_rounding_before_summation
        grounds:
          - calculations.state_modification_total
          - entities.Modification.fields.line_amount
          - entities.Modification.fields.sequence_number
          - entities.StateFiling.fields.modification_total
        distinguishing_aspect: |
          MODE (b): the rounding ORDER is the whole test - rounding each raw_amount * allocation_ratio
          to cents at the line and then summing gives modification_total 676.57, while summing the
          exact products 1000.336 - 739.032 + 415.256 = 676.560 and rounding once gives 676.56.
          Exactly one of the two orders is pinned by the scaffold.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A TaxpayerGroup and one CA registration (no nexus work needed; modifications do not depend on the factor chain)."
            - "One DRAFT StateFiling for 2026, COMBINED_UNITARY, federal_taxable_income 5000000, with no modification lines yet."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TaxManager
            - call: "POST /salt/groups"
              payload: { name: "Rounding Order Corp", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000 }
              as: TaxManager
              captures: { grp_id: $.data.id }
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: { state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED" }
              as: TaxManager
              captures: { reg_ca_id: $.data.id }
            - call: "POST /salt/registrations/${reg_ca_id}/filings"
              payload: { tax_year: 2026, filing_basis: "COMBINED_UNITARY", federal_taxable_income: 5000000 }
              as: StateAnalyst
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: { modification_code: "STATE_TAX_ADDBACK", direction: "ADDITION", raw_amount: 125042.00, allocation_ratio: 0.008 }
              as: StateAnalyst
              captures: { m1_id: $.data.id, m1_line: $.data.line_amount }
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: { modification_code: "MUNI_INTEREST_SUB", direction: "SUBTRACTION", raw_amount: 92379.00, allocation_ratio: 0.008 }
              as: StateAnalyst
              captures: { m2_id: $.data.id }
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: { modification_code: "DEPREC_ADJ", direction: "ADDITION", raw_amount: 51907.00, allocation_ratio: 0.008 }
              as: StateAnalyst
              captures: { m3_id: $.data.id }
          assert:
            - "Modification.${m1_id}.line_amount == 1000.34 and sequence_number == 1"
            - "Modification.${m2_id}.line_amount == 739.03 and sequence_number == 2"
            - "Modification.${m3_id}.line_amount == 415.26 and sequence_number == 3"
            - "StateFiling.${f_id}.modification_total == 676.57"
            - "StateFiling.${f_id}.modification_total != 676.56 (the sum-then-round order is wrong)"
            - "StateFiling.${f_id}.state_taxable_income == 0 because apportionment_percentage is still 0"

      - name: notice_penalty_cap_then_interest_evaluation_order
        grounds:
          - calculations.notice_assessment_total
          - entities.Notice.fields.penalty_amount
          - entities.Notice.fields.interest_amount
          - entities.Notice.fields.assessment_final_amount
          - state_machines.Notice.APPEAL_FILED_to_APPEAL_DENIED
        distinguishing_aspect: |
          MODE (c): the penalty cap is defined on a pre-interest base while the interest base
          already contains the penalty, so the dependency reads as circular and the scaffold pins
          the order - penalty first (min(5000.00, 2500.00) = 2500.00), then interest on
          50000.00 + 2500.00 for 61 days = 526.44. Interest computed on the tax alone would be
          501.37 and the total 53001.37 instead of 53026.44.
        test_recipe:
          setup:
            - "The CA 2026 return is FILED with tax_before_credits 88411.96, credits_applied_total 70000.00 and balance_due 18411.96; group compliance_posture COMPLIANT."
            - "A PROPOSED_ASSESSMENT notice for 50000.00 dated 2027-05-01T00:00:00Z with a 45-day response window sits in APPEAL_FILED."
            - "Logical clock advanced to 2027-07-01T00:00:00Z, which is 61 whole days after the notice date and still inside the 90-day appeal window."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TaxManager
            - call: "POST /salt/groups"
              payload: { name: "Meridian Industries", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000 }
              as: TaxManager
              captures: { grp_id: $.data.id }
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: { name: "Meridian Manufacturing", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true }
              as: TaxManager
              captures: { le_a_id: $.data.id }
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: { name: "Meridian Services", incorporation_state_code: "NV", entity_type: "CORP", is_unitary_member: true }
              as: TaxManager
              captures: { le_b_id: $.data.id }
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: { state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED", due_month: 4, due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { reg_ca_id: $.data.id }
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: { legal_entity_id: "${le_a_id}", tax_year: 2026, destination_sales: 1200000, origin_sales: 300000, purchaser_taxable_in_state: false, property_average_value: 800000, rented_property_annual_rent: 25000, payroll_compensation: 500000, employee_days_in_state: 40, protected_solicitation_only: false }
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/activity-records"
              payload: { legal_entity_id: "${le_b_id}", tax_year: 2026, destination_sales: 400000, service_receipts: 250000, cost_of_performance_state_code: "NV", payroll_compensation: 100000, employee_days_in_state: 5, protected_solicitation_only: true }
              as: StateAnalyst
            - call: "POST /salt/registrations/${reg_ca_id}/evaluate-nexus"
              payload: { as_of_tax_year: 2026 }
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/complete-registration"
              payload: { state_account_number: "CA-99887766" }
              as: TaxManager
            - call: "POST /salt/registrations/${reg_ca_id}/filings"
              payload: { tax_year: 2026, filing_basis: "COMBINED_UNITARY", federal_taxable_income: 5000000 }
              as: StateAnalyst
              captures: { f_id: $.data.id }
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: { modification_code: "STATE_TAX_ADDBACK", direction: "ADDITION", raw_amount: 125042.00, allocation_ratio: 0.008 }
              as: StateAnalyst
            - call: "POST /salt/filings/${f_id}/modifications"
              payload: { modification_code: "MUNI_INTEREST_SUB", direction: "SUBTRACTION", raw_amount: 92379.00, allocation_ratio: 0.008 }
              as: StateAnalyst
