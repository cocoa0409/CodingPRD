# =============================================================================
# §1.8 Scaffold Difficulty Design — task 1968 (Prior Authorization UM Vendor)
# 9 rules x 2 instances = 18 instances. All timestamps use the logical clock
# (startup default 2026-08-01T00:00:00Z).
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------- Rule 1 -------
  - rule_id: dual_variant_calc
    instances:
      - name: provider_approval_rate_rolling_vs_lifetime
        grounds:
          - calculations.provider_approval_stats
          - entities.Provider.fields.rolling_approval_rate
          - entities.Provider.fields.lifetime_approval_rate
        distinguishing_aspect: |
          Entity domain: Provider. For identical data (12 human-lane
          determinations), the rolling_window variant counts only the 2
          determinations inside the trailing 90-day window (rate 1.0000) while
          the lifetime variant counts all 12 (rate 0.5833) — two valid
          algorithms, two different numbers, on the same stored entity.
        test_recipe:
          setup:
            - "Active COMMERCIAL/IMAGING criteria set with published non-eligible guideline v1 window [2026-01-01, open)"
            - "Provider P with 5 APPROVED + 5 DENIED reviewer determinations issued at clock 2026-03-01, then 2 more APPROVED determinations at clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /um/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: UMAdmin }
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000001", name: "Imaging Partners" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r01: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r01}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-02", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r02: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r02}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-03", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r03: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r03}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-04", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r04: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r04}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-05", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r05: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r05}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-06", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r06: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r06}/reviewer-decision", payload: { decision: "DENY", reason_code: "EXPERIMENTAL_INVESTIGATIONAL" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-07", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r07: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r07}/reviewer-decision", payload: { decision: "DENY", reason_code: "EXPERIMENTAL_INVESTIGATIONAL" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-08", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r08: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r08}/reviewer-decision", payload: { decision: "DENY", reason_code: "EXPERIMENTAL_INVESTIGATIONAL" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-09", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r09: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r09}/reviewer-decision", payload: { decision: "DENY", reason_code: "EXPERIMENTAL_INVESTIGATIONAL" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-10", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r10: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r10}/reviewer-decision", payload: { decision: "DENY", reason_code: "EXPERIMENTAL_INVESTIGATIONAL" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: UMAdmin, captures: { sweep_flagged: $.data.requests_flagged } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-11", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r11: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r11}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-12", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r12: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r12}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
          trigger:
            - { call: "GET /um/providers/${p_id}", payload: {}, as: UMAdmin }
          assert:
            - "Provider.${p_id}.rolling_determination_count == 2 (March determinations fall outside [2026-05-03T00:00:00Z, 2026-08-01T00:00:00Z])"
            - "Provider.${p_id}.rolling_approval_count == 2"
            - "Provider.${p_id}.rolling_approval_rate == 1.0"
            - "Provider.${p_id}.lifetime_determination_count == 12"
            - "Provider.${p_id}.lifetime_approval_count == 7"
            - "Provider.${p_id}.lifetime_approval_rate == 0.5833"
            - "sweep_flagged == 0 (all March requests were already determined when the clock advanced)"

      - name: appeal_overturn_rate_decided_vs_filed
        grounds:
          - calculations.appeal_overturn_rates
          - entities.Appeal.fields.status
        distinguishing_aspect: |
          Entity domain: Appeal. With 1 OVERTURNED + 1 UPHELD + 1 WITHDRAWN
          appeal on file, the decided-denominator variant yields 0.5000 while
          the filed-denominator variant yields 0.3333 for the same rows —
          different denominators, different published metrics.
        test_recipe:
          setup:
            - "Active criteria set + provider with 3 reviewer-denied requests (determinations d1, d2, d3)"
            - "Appeal a1 on d1 decided OVERTURNED; appeal a2 on d2 decided UPHELD; appeal a3 on d3 WITHDRAWN while still RECEIVED"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv_id: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv_id}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000002", name: "Imaging Partners" }, as: UMAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r1: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r1}/reviewer-decision", payload: { decision: "DENY", reason_code: "EXPERIMENTAL_INVESTIGATIONAL" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-02", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r2: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r2}/reviewer-decision", payload: { decision: "DENY", reason_code: "MEDICAL_NECESSITY_NOT_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${p_id}", member_ref: "M-03", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { r3: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${r3}/reviewer-decision", payload: { decision: "DENY", reason_code: "INSUFFICIENT_INFO" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "GET /um/determinations", payload: { request_id: "${r1}" }, as: UMAdmin, captures: { d1: "$.data[0].id" } }
            - { call: "GET /um/determinations", payload: { request_id: "${r2}" }, as: UMAdmin, captures: { d2: "$.data[0].id" } }
            - { call: "GET /um/determinations", payload: { request_id: "${r3}" }, as: UMAdmin, captures: { d3: "$.data[0].id" } }
            - { call: "POST /um/determinations/${d1}/appeals", payload: { appeal_reason: "Additional records attached" }, as: AppealsClerk, captures: { a1: $.data.id } }
            - { call: "POST /um/appeals/${a1}/begin-review", payload: {}, as: AppealsReviewer, as_user_id: "u-ar-1" }
            - { call: "POST /um/appeals/${a1}/decide", payload: { outcome: "OVERTURNED", rationale: "Criteria met on resubmission" }, as: AppealsReviewer, as_user_id: "u-ar-1" }
            - { call: "POST /um/determinations/${d2}/appeals", payload: { appeal_reason: "Dispute medical necessity reading" }, as: AppealsClerk, captures: { a2: $.data.id } }
            - { call: "POST /um/appeals/${a2}/begin-review", payload: {}, as: AppealsReviewer, as_user_id: "u-ar-1" }
            - { call: "POST /um/appeals/${a2}/decide", payload: { outcome: "UPHELD" }, as: AppealsReviewer, as_user_id: "u-ar-1" }
            - { call: "POST /um/determinations/${d3}/appeals", payload: { appeal_reason: "Provider withdrew interest" }, as: AppealsClerk, captures: { a3: $.data.id } }
            - { call: "POST /um/appeals/${a3}/withdraw", payload: {}, as: AppealsClerk }
          trigger:
            - { call: "GET /um/metrics/overturn-analysis", payload: {}, as: ComplianceOfficer }
          assert:
            - "metrics.appeals_filed == 3"
            - "metrics.appeals_decided == 2"
            - "metrics.appeals_withdrawn == 1"
            - "metrics.overturned_count == 1"
            - "metrics.upheld_count == 1"
            - "metrics.overturn_rate_decided == 0.5 (1 / (1+1), decided-only denominator)"
            - "metrics.overturn_rate_filed == 0.3333 (1 / 3, filed denominator; 4dp round_half_up)"

  # ------------------------------------------------------------- Rule 2 -------
  - rule_id: combinatorial_formula
    instances:
      - name: auto_approval_gold_lane_vs_rules_lane
        grounds:
          - calculations.auto_approval_decision
          - entities.PriorAuthRequest.fields.status
          - entities.Determination.fields.reason_code
        distinguishing_aspect: |
          Mode (a): a 4-input branch formula (gold_card_status x category match
          x guideline auto_approve_eligible x channel x documentation). The gold
          lane fires even when the rules lane fails (FAX channel), and when both
          lanes are satisfiable the pinned evaluation order records
          GOLD_CARD_AUTO, never AUTO_RULE.
        test_recipe:
          setup:
            - "Active COMMERCIAL/IMAGING criteria set; guideline v1 (auto_approve_eligible=false) published then superseded by v2 (auto_approve_eligible=true), both covering the default clock"
            - "Provider A GOLD_CARDED for IMAGING via 10 reviewer approvals on v1; Provider B with no determinations"
          setup_api_calls:
            - { call: "POST /um/criteria-sets", payload: { name: "Spine Imaging Criteria", line_of_business: "COMMERCIAL", service_category: "IMAGING" }, as: ClinicalPolicyEditor, captures: { cs_id: $.data.id, cs_v: $.data.version } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "MRI lumbar spine criteria", auto_approve_eligible: false, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv1: $.data.id } }
            - { call: "POST /um/guideline-versions/${gv1}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v}" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/criteria-sets/${cs_id}/transition", payload: { to_status: "ACTIVE" }, as: ClinicalPolicyEditor }
            - { call: "POST /um/providers", payload: { npi: "1000000003", name: "Gold Provider A" }, as: UMAdmin, captures: { pa: $.data.id } }
            - { call: "POST /um/providers", payload: { npi: "1000000004", name: "Plain Provider B" }, as: UMAdmin, captures: { pb: $.data.id } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "G-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { g01: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${g01}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "G-02", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { g02: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${g02}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "G-03", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { g03: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${g03}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "G-04", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { g04: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${g04}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "G-05", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { g05: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${g05}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "G-06", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { g06: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${g06}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "G-07", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { g07: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${g07}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "G-08", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { g08: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${g08}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "G-09", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { g09: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${g09}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "G-10", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { g10: $.data.id } }
            - { call: "POST /um/prior-auth-requests/${g10}/reviewer-decision", payload: { decision: "APPROVE", reason_code: "MEDICAL_NECESSITY_MET" }, as: ClinicalReviewer, as_user_id: "u-rev-1" }
            - { call: "POST /um/providers/${pa}/gold-card-evaluations", payload: { service_category: "IMAGING" }, as: UMAdmin, captures: { eval_decision: $.data.decision } }
            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "2.0", content: "MRI lumbar spine criteria v2", auto_approve_eligible: true, effective_from: "2026-01-01T00:00:00Z", supersedes_version_id: "${gv1}" }, as: ClinicalPolicyEditor, captures: { gv2: $.data.id } }
            - { call: "GET /um/criteria-sets/${cs_id}", payload: {}, as: ClinicalPolicyEditor, captures: { cs_v2: $.data.version } }
            - { call: "POST /um/guideline-versions/${gv2}/transition", payload: { to_status: "PUBLISHED", expected_criteria_set_version: "${cs_v2}" }, as: ClinicalPolicyEditor }
          trigger:
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "T-01", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "FAX", documentation_complete: false }, as: IntakeSpecialist, captures: { t1: $.data.id, t1_status: $.data.status } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pa}", member_ref: "T-02", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "PORTAL", documentation_complete: true }, as: IntakeSpecialist, captures: { t2: $.data.id, t2_status: $.data.status } }
            - { call: "POST /um/prior-auth-requests", payload: { provider_id: "${pb}", member_ref: "T-03", criteria_set_id: "${cs_id}", service_code: "72148", urgency: "STANDARD", intake_channel: "PORTAL", documentation_complete: true }, as: IntakeSpecialist, captures: { t3: $.data.id, t3_status: $.data.status } }
            - { call: "GET /um/determinations", payload: { request_id: "${t1}" }, as: UMAdmin, captures: { t1_reason: "$.data[0].reason_code", t1_role: "$.data[0].decided_by_role" } }
            - { call: "GET /um/determinations", payload: { request_id: "${t2}" }, as: UMAdmin, captures: { t2_reason: "$.data[0].reason_code" } }
            - { call: "GET /um/determinations", payload: { request_id: "${t3}" }, as: UMAdmin, captures: { t3_reason: "$.data[0].reason_code" } }
          assert:
            - "eval_decision == GRANTED (10/10 = 1.0000 rolling rate, count 10 >= 10)"
            - "t1_status == AUTO_APPROVED and t1_reason == GOLD_CARD_AUTO (gold lane fires although FAX/incomplete fails the rules lane)"
            - "t2_status == AUTO_APPROVED and t2_reason == GOLD_CARD_AUTO (both lanes satisfiable; pinned order records gold)"
            - "t3_status == AUTO_APPROVED and t3_reason == AUTO_RULE (non-gold provider, rules lane)"
            - "t1_role == SYSTEM_RULE for all auto-approved determinations"
            - "GET /um/prior-auth-requests/${t1}/compliance-events?event_type=AUTO_APPROVAL_FIRED returns exactly 1 event"

