            - "GET /api/education-pairings?coach_id=coach-1&status=ACTIVE returns total_count == 3"

      - name: campaign_budget_cap_equality_allowed
        claim_type: correct_result
        grounds: [calculations.campaign_overlap_check, "errors[ERR_CAMPAIGN_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "Zip-cluster budget cap 500000 with <= comparison: 450000 + 50000 == cap is allowed; one more cent (500001 total) is rejected."
        test_recipe:
          setup: ["ACTIVE campaign budget 450000 on zip 90001 window [2026-06-01, 2026-07-01)"]
          setup_api_calls:
