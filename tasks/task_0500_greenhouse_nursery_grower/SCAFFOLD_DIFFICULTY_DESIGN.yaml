            - call: "POST /nursery/varieties/${var_id}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "GH6 B", climate_class: "MIXED", capacity_units: 3000 }
              as: GrowerManager
              captures: { zone_id: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "S", sourced_count: 1000 }
              as: ProductionTech
              captures: { batch_id: $.data.id }
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { zv: $.data.version }
            - call: "POST /nursery/batches/${batch_id}/transplant"
              payload: { started_count: 1000, expected_zone_version: "${zv}" }
              as: ProductionTech
            - call: "POST /nursery/batches/${batch_id}/input-logs"
              payload: { event_type: "SCOUTING", dead_observed: 300 }
              as: ProductionTech
          trigger:
