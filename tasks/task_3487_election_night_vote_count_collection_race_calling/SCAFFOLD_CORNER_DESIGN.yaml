        distinguishing_aspect: "The historical-pattern leg fires alone: deviation_ratio 0.05 is clean but the DEM share 3135/9500 = 0.33 swings 0.27 from the county's 0.60 baseline, exceeding QC_SWING_PCT 0.25 — FLAGGED."
