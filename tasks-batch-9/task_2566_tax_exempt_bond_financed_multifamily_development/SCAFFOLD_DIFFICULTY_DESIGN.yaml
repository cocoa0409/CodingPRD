  - rule_id: combinatorial_formula
    instances:
      - name: restricted_rent_ceiling_binds_on_ami_then_on_market_then_on_the_program_floor
        grounds:
          - calculations.restricted_rent_ceiling
          - entities.UnitRestriction.fields.restricted_rent_cents
          - entities.UnitRestriction.fields.imputed_household_size
          - entities.Project.fields.set_aside_election
        distinguishing_aspect: |
          Three units identical in household size (bedroom_count 2 -> imputed
          household size 3), AMI band (60) and utility allowance (12,000) differ
          only in market_rent_cents, and each is priced by a STRUCTURALLY
          DIFFERENT binding term: unit 101 (market 150,000) is bound by the
          AMI-derived ceiling net of utilities at 109,500; unit 102 (market
          95,000) is bound by market rent at 95,000; unit 103 (market 20,000) is
          bound by MIN_RENT_FLOOR_CENTS at 25,000, which exceeds BOTH caps and
          proves the floor is applied last rather than clamped inside the min().
        test_recipe:
          setup:
            - "One ACTIVE sponsor and one PLANNING project with total_units 10, total_floor_space_sqft 8500 and set_aside_election MIN_40_60, so the election ceiling on the AMI band is 60 percent."
            - "No units designated yet."
          setup_api_calls:
