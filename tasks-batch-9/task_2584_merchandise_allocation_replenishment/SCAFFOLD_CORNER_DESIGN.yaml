          assert:
            - "Receipt close while STAGED -> 409 ERR_INVALID_STATE_TRANSITION; the receipt stays STAGED"
            - "The run is then created successfully (status DRAFT) and the receipt moves STAGED -> ALLOCATING, so the earlier close refusal was purely about the from-state"
            - "commit while DRAFT -> 409 ERR_INVALID_STATE_TRANSITION (commit requires PROPOSED) and the run stays DRAFT with units_proposed 0"
            - "recall while DRAFT -> 409 ERR_INVALID_STATE_TRANSITION"
            - "After a successful propose, recall while PROPOSED -> 409 ERR_INVALID_STATE_TRANSITION: recall exists only from COMMITTED"
