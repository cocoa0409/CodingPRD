      - name: posture_frozen_outranks_distribution_already_closed
        grounds:
          - validations.priority_16
          - validations.priority_37
          - errors.ERR_POSTURE_FROZEN
          - errors.ERR_DISTRIBUTION_ALREADY_CLOSED
          - state_machines.DistributionRun.LOCKED_to_DISTRIBUTED
        distinguishing_aspect: |
          Priority 16 (business_safety) vs priority 37 (business_constraint) on one
          ACCEPT call. The NOVELTY agreement's posture is FROZEN (index 60 from four
          2026Q3 seizures) AND the 2026Q2 DistributionRun is already DISTRIBUTED, so
          accepting the FILED 2026Q2 NOVELTY report violates both. Expected:
          ERR_POSTURE_FROZEN (409), not ERR_DISTRIBUTION_ALREADY_CLOSED (409). The
