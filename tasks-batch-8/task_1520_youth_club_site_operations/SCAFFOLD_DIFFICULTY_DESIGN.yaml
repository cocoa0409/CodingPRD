              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { m1: $.data.id }
            - { call: "POST /members/${m1}/decide", payload: { decision: "APPROVE" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - { call: "POST /guardians", payload: { member_id: "${m1}", full_name: "Jane Doe", relation: "mother" }, as: SiteDirector, as_user_id: "${dir_id}" }
            - call: "POST /club-days"
              payload: { site_id: "${site_id}", date: "2026-08-03" }
              as: SiteDirector
              as_user_id: "${dir_id}"
              captures: { day: $.data.id }
            - call: "POST /attendance-records"
              payload: { club_day_id: "${day}", member_id: "${m1}" }
              as: SiteDirector
              as_user_id: "${dir_id}"
