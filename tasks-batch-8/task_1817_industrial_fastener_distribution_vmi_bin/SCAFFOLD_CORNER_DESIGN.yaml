              as: DistributorAdmin
          assert:
            - "BinAgreement.${agr_id}.part_id == ${ps2_id} (priority_rank 1 beats rank 2)"
            - "BinAgreement.${agr_id}.status == ACTIVE — the agreement survived the obsolescence cascade precisely because active substitutes existed, and substitute repoints it to the selected ACTIVE part"

      - name: counted_qty_above_max_rejected
        claim_type: violation_to_error
        grounds:
