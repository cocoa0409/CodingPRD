      - name: the_revision_operations_are_reachable_by_their_owning_and_shared_roles
        claim_type: Shared Operations
        grounds: ["roles.UtilityCoordinator", "roles.RightOfWayAdjudicator", "roles.UtilityOwnerRep", "state_machines.RelocationPlan", "state_machines.PriorRightsDetermination"]
        distinguishing_aspect: "The revision loops are split across roles in a way the happy path never exercises: only the UtilityCoordinator may request a plan revision, resubmit is shared between the UtilityOwnerRep and the UtilityCoordinator (so the reviewer may resubmit on the owner's behalf), and only the RightOfWayAdjudicator may return its own determination for revision and then revise it."
