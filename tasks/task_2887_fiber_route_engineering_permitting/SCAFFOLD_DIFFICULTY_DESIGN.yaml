            - "hop 2: RouteSegment.${seg_id}.permit_status == BLOCKED"
            - "hop 3: RouteSegment.${seg_id}.engineering_status == METHOD_SELECTED and RouteSegment.${seg_id}.bid_ready_cost_cents == null"
            - "hop 3 leaves RouteSegment.${seg_id}.preliminary_cost_cents == 1971469 untouched"
            - "hop 4: DesignPackage.${dp_id}.status == DRAFT and DesignPackage.${dp_id}.stamp_voided_at == 2026-08-12T00:00:00Z"
            - "hop 4 leaves SplicePoint.${sp_id}.status == PLACED"
            - "hop 5: Route.${route_id}.status == PERMITTING"
            - "Route.${route_id}.total_bid_ready_cost_cents == 0"
            - "Route.${route_id}.total_preliminary_cost_cents == 1971469"
            - "PermitApplication.${p1_id}.status == APPROVED, unchanged by the cascade"

      - name: rewalk_rejection_five_hop_cascade_resets_route_to_planning
        grounds:
          - state_machines.FieldWalkout.transitions.SUBMITTED_to_REJECTED
          - state_machines.RouteSegment.transitions.engineering_status_WALKED_METHOD_SELECTED_DESIGN_LOCKED_to_DRAFT
          - state_machines.Route.transitions.SCOPE_LOCKED_to_PLANNING
          - entities.FieldWalkout.fields.review_round
          - entities.Route.fields.scope_locked_at
          - entities.Route.fields.planned_complexity_index
        distinguishing_aspect: |
          Trigger is a WALKOUT REJECTION on a re-walk record and the chain runs FieldWalkout ->
          RouteSegment.engineering_status -> RouteSegment cost fields -> Route cost rollups -> Route.status, a different
          trigger and a different five-hop path than permit_denial_five_hop_cascade_voids_stamp_and_reopens_route, and it
          ends by nulling Route.scope_locked_at and Route.planned_complexity_index rather than voiding a stamp.
        test_recipe:
