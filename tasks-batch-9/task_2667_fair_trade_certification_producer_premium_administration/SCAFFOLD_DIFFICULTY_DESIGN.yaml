  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_vote_forks_to_revision_requested_then_loops_back_and_approves
        grounds:
          - state_machines.PremiumUseProposal.UNDER_VOTE_to_REVISION_REQUESTED
          - state_machines.PremiumUseProposal.REVISION_REQUESTED_to_DRAFT
          - state_machines.PremiumUseProposal.UNDER_VOTE_to_APPROVED
          - calculations.proposal_vote_tally
          - entities.PremiumUseProposal.fields.current_round
        distinguishing_aspect: |
          PremiumUseProposal is the non-linear entity here: close-vote is a three-way fork whose
          REVISION_REQUESTED branch returns to DRAFT and re-opens as round 2, and the round-2 tally
          counts only round-2 ballots (turnout 60.00, approval 66.67) while round-1 ballots are excluded.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "PRODUCER_ORG holder CERTIFIED with a PHYSICAL cooperative node, certified_input_kg 50000, and a PremiumCommittee of 5 members chaired by chair-1 with default quorum_pct 60.00"
            - "one 12000 kg organic coffee trade VERIFIED and SETTLED, so the fund holds balance_cents 1200000 and the committee is ACTIVE"
            - "one EDUCATION proposal for 500000 cents over [2026-09-01, 2026-10-01) in DRAFT"
