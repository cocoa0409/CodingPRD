    path: "/dealer-network/formulation-changes/{id}/rematch-tasks"
    description: "List rematch tasks of a formulation change (sub-resource reverse lookup)."
    roles: [PlatformAdmin, RegionManager, ChannelDirector, ColorLabAdmin, DealerPrincipal]
    code: 200
    input: ["limit?", "offset?"]
    output: RematchTask[]
    side_effects: []
  - method: GET
    path: "/dealer-network/dealers/{id}/rematch-tasks"
    description: "List rematch tasks assigned to a dealer (sub-resource reverse lookup)."
    roles: [PlatformAdmin, RegionManager, ChannelDirector, ColorLabAdmin, DealerPrincipal]
    code: 200
    input: ["limit?", "offset?"]
    output: RematchTask[]
    side_effects: []
  - method: GET
    path: "/dealer-network/formulas/{id}/rematch-tasks"
    description: "List rematch tasks for a formula (sub-resource reverse lookup)."
    roles: [PlatformAdmin, RegionManager, ChannelDirector, ColorLabAdmin, DealerPrincipal]
    code: 200
    input: ["limit?", "offset?"]
    output: RematchTask[]
    side_effects: []
  - method: POST
    path: "/dealer-network/rematch-tasks/{id}/complete"
    description: "Complete a rematch task (dealer performs the color rematch); completing the last pending task completes the change."
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: RematchTask
    side_effects: ["RematchTask PENDING -> DONE", "bubble-up: FormulationChange EFFECTIVE -> COMPLETED when last task done", "rematch_pending recompute on formula"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "role not permitted for the endpoint, or entity_backed ownership check failed (DealerPrincipal acting on another dealer's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path or body referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed payload: missing required field, bad type, bad enum member, out-of-range number" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "requested transition does not exist from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent entity's current version" }
  - { id: ERR_DEALER_NOT_ACTIVE, http: 409, condition: "dealer aggregate status does not permit the operation (orders/purchases/claims/contractors require ACTIVE; equipment install requires APPROVED+)" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "no ACTIVE license covering the purchased line's colorant system" }
  - { id: ERR_DUPLICATE, http: 409, condition: "uniqueness violation on region code, serial number, system code, line code, or formula code" }
  - { id: ERR_EQUIPMENT_NOT_CALIBRATED, http: 422, condition: "DEALER_EXCLUSIVE line purchase (or rematch completion) without a CALIBRATED equipment unit on the line's colorant system" }
  - { id: ERR_REMATCH_REQUIRED, http: 422, condition: "purchase refused: formula under EFFECTIVE formulation change still has a PENDING rematch task at this dealer" }
  - { id: ERR_CHANNEL_EXCLUSIVITY_VIOLATION, http: 422, condition: "BIGBOX channel event reported while dealer.channel_posture == BLOCKED" }
  - { id: ERR_CHANNEL_EVENT_OVERLAP, http: 422, condition: "channel event exactly duplicates the period of an existing CONFIRMED event for the same dealer+channel" }
  - { id: ERR_ATTESTATION_STALE, http: 422, condition: "exclusivity attestation older than 366 days" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 422, condition: "co-op claim activity_date in the future or more than 90 days old" }
  - { id: ERR_EFFECTIVE_DATE_INVALID, http: 422, condition: "formulation change effective_date not strictly in the future at announce, or still in the future at make-effective" }
  - { id: ERR_INVALID_PERIOD, http: 422, condition: "period_end <= period_start, or period_start in the future" }
  - { id: ERR_REFERENCE_INACTIVE, http: 422, condition: "referenced configuration is inactive: RETIRED colorant system, DISCONTINUED product line" }
  - { id: ERR_TERRITORY_CONFLICT, http: 422, condition: "application within protected radius approved by RegionManager, or neighbor not yet notified" }
  - { id: ERR_MIN_INVENTORY_UNMET, http: 422, condition: "INITIAL_STOCK order below the colorant system's minimum units" }
  - { id: ERR_COOP_FUNDS_INSUFFICIENT, http: 422, condition: "co-op claim exceeds available balance or dealer not branding compliant" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Manufacturer platform operator; owns regions, the logical clock, and ops sweeps."
    identity: "opaque"
    exclusive_operations:
      - "POST /dealer-network/regions"
      - "POST /dealer-network/_clock/set_current_utc"
      - "POST /dealer-network/ops/run"
    shared_operations:
      - "all GET endpoints"
  - name: RegionManager
    description: "Regional manager; onboards dealers, manages applications, grants licenses, processes orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /dealer-network/applications (and submit/notify-neighbor/reject/withdraw)"
      - "POST /dealer-network/dealers/{id}/attest"
      - "POST /dealer-network/dealers/{id}/begin-onboarding"
      - "POST /dealer-network/dealers/{id}/activate"
      - "POST /dealer-network/licenses and /renew"
      - "POST /dealer-network/orders/{id}/approve, /reject, /fulfill, /invoice"
    shared_operations:
      - "POST /dealer-network/applications/{id}/approve (shared with ChannelDirector; territory-conflict approvals are ChannelDirector-only)"
      - "POST /dealer-network/dealers"
      - "all GET endpoints"
  - name: ChannelDirector
    description: "Channel compliance director; exclusivity enforcement, co-op funds, suspension/termination."
    identity: "opaque"
    exclusive_operations:
      - "POST /dealer-network/dealers/{id}/suspend, /reinstate, /terminate"
      - "POST /dealer-network/dealers/{id}/channel-events"
      - "POST /dealer-network/coop-claims/{id}/approve, /reject, /pay"
      - "POST /dealer-network/licenses/{id}/revoke"
    shared_operations:
      - "POST /dealer-network/applications/{id}/approve (override for territory conflicts)"
      - "all GET endpoints"
  - name: DealerPrincipal
    description: "Owner of an independent dealer; acts strictly on own dealer's resources (X-User-ID == dealer_id)."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /dealer-network/orders, /orders/{id}/pay, /orders/{id}/cancel"
      - "POST /dealer-network/contractors, /contractors/{id}/close"
      - "POST /dealer-network/purchases, /purchases/{id}/void"
      - "POST /dealer-network/coop-claims"
      - "POST /dealer-network/rematch-tasks/{id}/complete"
    shared_operations:
      - "all GET endpoints"
  - name: ColorLabAdmin
    description: "Color systems lab administrator; owns colorant systems, product lines, formulas, and formulation changes."
    identity: "opaque"
    exclusive_operations:
      - "POST /dealer-network/colorant-systems (and retire)"
      - "POST /dealer-network/product-lines (and discontinue)"
      - "POST /dealer-network/formulas"
      - "POST /dealer-network/formulation-changes (and announce/make-effective/cancel)"
    shared_operations:
      - "all GET endpoints"
  - name: EquipmentTech
    description: "Field equipment technician; installs, calibrates, and decommissions tinting equipment."
    identity: "opaque"
    exclusive_operations:
      - "POST /dealer-network/equipment"
      - "POST /dealer-network/equipment/{id}/calibrations"
      - "POST /dealer-network/equipment/{id}/decommission"
    shared_operations:
      - "all GET endpoints"
