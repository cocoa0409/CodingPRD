            - "trigger call 1 returns HTTP 409 with error_id == ERR_INVALID_INVITATION_STATE, NOT 422 ERR_APPEARANCE_BUDGET_EXCEEDED, because priority 8 < priority 16"
            - "trigger call 2 returns appearance_committed_cents still == 2000000 and appearance_uncommitted_cents still == 500000 — the rejected request committed nothing"
            - "trigger call 3 returns status == ACCEPTED with guaranteed_commitment_cents == 2000000 unchanged"

      - name: priority_doping_compliance_beats_bib_pool_exhaustion
