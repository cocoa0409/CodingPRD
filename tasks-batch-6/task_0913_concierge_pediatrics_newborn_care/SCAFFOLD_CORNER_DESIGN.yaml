      - name: corner_immunization_grace_window_exactly_four_days_is_valid
        claim_type: Constants Applied
        grounds:
          - calculations.immunization_dose_validity
          - domain_constants.IMMUNIZATION_GRACE_DAYS
          - entities.ImmunizationDose.fields.effective_series_index
        distinguishing_aspect: "For HEPB position 3 (min_age_days 168) a dose at age 163 fails because 163 + 4 = 167 < 168 while a dose at age 164 passes because 164 + 4 = 168 >= 168; the invalid dose does not advance the series, so the later dose still evaluates at effective_series_index 3 against the same position."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-13T00:00:00Z"
            - "One family and one child born 2026-04-01 with two VALID HEPB doses on 2026-04-02 and 2026-04-29"
          setup_api_calls:
            - call: "POST /peds/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /peds/families"
              payload: { household_name: "Aarons", family_monthly_cap_cents: 100000 }
              as: PracticeAdmin
              captures: { fam_id: "$.data.id" }
            - call: "POST /peds/children"
              payload: { family_id: "${fam_id}", first_name: "Rex", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_id: "$.data.id" }
            - call: "POST /peds/immunization-doses"
              payload: { child_id: "${child_id}", vaccine_code: "HEPB", administered_date: "2026-04-02" }
              as: PracticeAdmin
              captures: { d1: "$.data.id" }
            - call: "POST /peds/immunization-doses"
              payload: { child_id: "${child_id}", vaccine_code: "HEPB", administered_date: "2026-04-29" }
              as: PracticeAdmin
              captures: { d2: "$.data.id" }
          trigger:
            - call: "POST /peds/immunization-doses"
              payload: { child_id: "${child_id}", vaccine_code: "HEPB", administered_date: "2026-09-11" }
              as: PracticeAdmin
              captures: { d3_early: "$.data.id", d3_validity: "$.data.validity" }
            - call: "POST /peds/immunization-doses"
              payload: { child_id: "${child_id}", vaccine_code: "HEPB", administered_date: "2026-09-12" }
              as: PracticeAdmin
              captures: { d4_ok: "$.data.id", d4_validity: "$.data.validity" }
          assert:
            - "ImmunizationDose.${d3_early}.age_days_at_administration == 163 and validity == INVALID and invalid_reason == MIN_AGE_NOT_MET"
            - "ImmunizationDose.${d4_ok}.age_days_at_administration == 164 and validity == VALID and invalid_reason == null"
            - "ImmunizationDose.${d4_ok}.effective_series_index == 3 - the invalid 2026-09-11 dose did not advance the series"
            - "ImmunizationDose.${d4_ok}.prior_valid_dose_id == ${d2}"
            - "ImmunizationDose.${d4_ok}.interval_days_since_prior == 136"
            - "GET /peds/immunization-doses filtered by child_id ${child_id} and validity VALID returns 3 rows"

      - name: corner_immunization_both_rungs_failing_reports_min_age_not_met
        claim_type: Correct Result
        grounds:
          - calculations.immunization_dose_validity
          - entities.ImmunizationDose.fields.invalid_reason
        distinguishing_aspect: "A DTAP second dose at age 46 with a 4-day interval fails BOTH rungs (46 + 4 < 70 and 4 + 4 < 28); the pinned rung order makes invalid_reason MIN_AGE_NOT_MET rather than MIN_INTERVAL_NOT_MET."
        test_recipe:
          setup:
            - "Logical clock at 2026-05-20T00:00:00Z"
            - "One family and one child born 2026-04-01 with a VALID DTAP dose on 2026-05-13 at age 42"
          setup_api_calls:
