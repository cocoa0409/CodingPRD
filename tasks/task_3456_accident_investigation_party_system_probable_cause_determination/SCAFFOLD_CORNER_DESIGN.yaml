# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3456 — NTSB accident-investigation party system & probable cause.
# Breadth probe over §1.1–§1.7 claims not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Anchored base-chain calls are defined once
# per file and aliased; every instance replays against a fresh database.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: case_create_returns_every_declared_field_with_computed_scores
        claim_type: Creation
        grounds:
          - entities.AccidentCase
          - endpoints.POST_/accident-cases
          - response_envelope
        distinguishing_aspect: "A case created with the 60-point fixture comes back 201 with status SCREENING (never client-supplied), version 1, statutory_score 60, risk_adjusted_score 50.0, suggested_mode FULL_GO_TEAM, system id/created_at/updated_at, and the success envelope carries meta.api_request_id."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - &c_case
              call: "POST /accident-cases"
              payload: { report_number: "NTSB-2026-0001", category: "HIGHWAY", occurred_at: "2026-08-31T14:22:00Z", location_state: "VA", fatalities_count: 1, injuries_count: 0, damage_estimate_cents: 0, is_public_transport: true }
              as: DutyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
          assert:
            - "the response status is 201, response_type is object, and meta.api_request_id plus meta.api_request_timestamp are present"
            - "AccidentCase.${case_id}.status == SCREENING and version == 1"
            - "statutory_score == 60 and risk_adjusted_score == 50.0 and suggested_mode == FULL_GO_TEAM — computed fields visible immediately in the create response, no re-read needed"
            - "launch_decisions == [] and id/created_at/updated_at are non-null"

      - name: designation_creation_starts_active_and_round_trips
        claim_type: Creation
        grounds:
          - entities.PartyDesignation
          - endpoints.POST_/party-designations
        distinguishing_aspect: "Designating a UNION organization to a launched investigation returns 201 with status ACTIVE and a server-stamped designated_at; the same row round-trips through GET by id with the foreign keys intact."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one launched investigation."
          setup_api_calls:
            - *c_clock
            - *c_case
            - &c_propose
              call: "POST /accident-cases/${case_id}/launch-decisions"
              payload: { mode: "FULL_GO_TEAM", expected_accident_case_version: "${case_v}" }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { decision_id: $.data.launch_decisions.0.decision_id, case_v2: $.data.version }
            - &c_adopt
              call: "POST /accident-cases/${case_id}/launch-decisions/${decision_id}/adopt"
              payload: { iic_user_id: "iic-1" }
              as: ManagingDirector
              as_user_id: "md-2"
            - &c_fetch_inv
              call: "GET /investigations"
              payload: { accident_case_id: "${case_id}" }
              as: DutyOfficer
              captures: { inv_id: "$.data[0].id" }
            - &c_org
              call: "POST /party-organizations"
              payload: { legal_name: "Blue Ridge Transit Authority", org_type: "OPERATOR" }
              as: PartyCoordinator
              captures: { org_id: $.data.id }
          trigger:
            - &c_designation
              call: "POST /party-designations"
              payload: { investigation_id: "${inv_id}", organization_id: "${org_id}" }
              as: PartyCoordinator
              captures: { dsg_id: $.data.id }
            - call: "GET /party-designations/${dsg_id}"
              payload: {}
              as: PartyCoordinator
          assert:
            - "the create returns 201 and PartyDesignation.${dsg_id}.status == ACTIVE"
            - "designated_at == 2026-09-01T00:00:00Z (the logical clock, not wall clock)"
            - "the GET returns investigation_id == ${inv_id} and organization_id == ${org_id} with version == 1"

      - name: designation_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/party-designations
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three designations on one investigation paginate with total_count 3: limit=2&offset=0 returns 2 rows with has_more true, offset=2 returns 1 row with has_more false, and the status=ACTIVE filter returns all 3."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one launched investigation with three designated parties (OPERATOR, MANUFACTURER, UNION)."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_org
            - *c_designation
            - call: "POST /party-organizations"
              payload: { legal_name: "Piedmont Airframe Works", org_type: "MANUFACTURER" }
              as: PartyCoordinator
              captures: { org_b_id: $.data.id }
            - call: "POST /party-designations"
              payload: { investigation_id: "${inv_id}", organization_id: "${org_b_id}" }
              as: PartyCoordinator
            - call: "POST /party-organizations"
              payload: { legal_name: "Allied Signalmens Union", org_type: "UNION" }
              as: PartyCoordinator
              captures: { org_c_id: $.data.id }
            - call: "POST /party-designations"
              payload: { investigation_id: "${inv_id}", organization_id: "${org_c_id}" }
              as: PartyCoordinator
          trigger:
            - call: "GET /party-designations"
              payload: { investigation_id: "${inv_id}", limit: 2, offset: 0 }
              as: DutyOfficer
          assert:
            - "the response status is 200, response_type is array, exactly 2 rows, total_count == 3, has_more == true"
            - "GET /party-designations?investigation_id=${inv_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /party-designations?investigation_id=${inv_id}&status=ACTIVE returns 3 rows"
            - "GET /party-designations?organization_id=${org_b_id} returns exactly 1 row (reverse FK lookup by organization)"

      - name: investigation_get_with_unknown_id_returns_investigation_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/investigations/{id}
          - errors.ERR_INVESTIGATION_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated investigation id produces the entity-specific 404 ERR_INVESTIGATION_NOT_FOUND with the error envelope shape, not a generic 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /investigations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DutyOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_INVESTIGATION_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: case_create_missing_required_fatalities_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.AccidentCase.fields.fatalities_count
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "fatalities_count is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST and no case row is persisted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /accident-cases"
              payload: { report_number: "NTSB-2026-0002", category: "RAIL", occurred_at: "2026-08-30T09:00:00Z", location_state: "PA", injuries_count: 2, damage_estimate_cents: 500000, is_public_transport: true }
              as: DutyOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /accident-cases returns 0 rows"

      - name: recorder_create_with_extra_system_fields_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.RecorderPackage.fields.status
          - endpoints.POST_/recorders
        distinguishing_aspect: "RecorderPackage.status and version are source system; a client sending status RELEASED and version 99 is ignored — the row is created SECURED with version 1 and an empty readout_sessions array."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one launched investigation."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
          trigger:
            - call: "POST /recorders"
              payload: { investigation_id: "${inv_id}", recorder_type: "CVR", condition: "DAMAGED", status: "RELEASED", version: 99 }
              as: RecorderCustodian
              captures: { rp_id: $.data.id }
          assert:
            - "the response status is 201"
            - "RecorderPackage.${rp_id}.status == SECURED and version == 1 and readout_sessions == []"

      - name: group_create_with_invalid_enum_specialty_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.InvestigativeGroup.fields.specialty
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "specialty is a closed enum of the four investigative disciplines (OPERATIONS, STRUCTURES, HUMAN_PERFORMANCE, RECORDERS); METALLURGY is rejected with 400 ERR_INVALID_REQUEST rather than creating a free-text group."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one launched investigation."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
          trigger:
            - call: "POST /groups"
              payload: { investigation_id: "${inv_id}", specialty: "METALLURGY", chairman_user_id: "gc-1" }
              as: IIC
              as_user_id: "iic-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /groups?investigation_id=${inv_id} returns 0 rows"

      - name: severity_override_on_propose_recomputes_scores_immediately
        claim_type: Computed Fields
        grounds:
          - entities.AccidentCase.fields.statutory_score
          - endpoints.POST_/accident-cases/{id}/launch-decisions
          - calculations.statutory_launch_score
        distinguishing_aspect: "A proposal carrying a severity override mutates the case severity and recomputes both scores in the same request: the MARINE 59-point case becomes 79 statutory / 73.8 risk-adjusted, the new decision snapshots 79, and adoption of FULL_GO_TEAM then succeeds — visible in the propose response without a re-read."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one MARINE case scoring 59."
          setup_api_calls:
            - *c_clock
            - call: "POST /accident-cases"
              payload: { report_number: "NTSB-2026-0003", category: "MARINE", occurred_at: "2026-08-29T03:10:00Z", location_state: "WA", fatalities_count: 1, injuries_count: 4, damage_estimate_cents: 1000000, is_public_transport: false }
              as: DutyOfficer
              captures: { ov_case_id: $.data.id, ov_case_v: $.data.version }
          trigger:
            - call: "POST /accident-cases/${ov_case_id}/launch-decisions"
              payload: { mode: "FULL_GO_TEAM", expected_accident_case_version: "${ov_case_v}", is_public_transport: true, rationale: "Vessel confirmed under public-ferry contract." }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { ov_decision_id: $.data.launch_decisions.0.decision_id, ov_case_v2: $.data.version }
            - call: "POST /accident-cases/${ov_case_id}/launch-decisions/${ov_decision_id}/adopt"
              payload: { iic_user_id: "iic-1" }
              as: ManagingDirector
              as_user_id: "md-2"
          assert:
            - "the propose response shows statutory_score == 79  (40 + 15 + 4 + 20) and risk_adjusted_score == 73.8  (40.0 + 18.8 + 5.0 + 10.0)"
            - "the propose response shows version == 2 (the override is a case mutation) and suggested_mode == FULL_GO_TEAM"
            - "the embedded decision's snapshot_statutory_score == 79"
            - "the adopt returns 200 and AccidentCase.${ov_case_id}.status == LAUNCHED"

      - name: statutory_score_computation_on_hazmat_case
        claim_type: Computed Fields
        grounds:
          - calculations.statutory_launch_score
        excluded_because:
          difficulty_instance: dual_variant_launch_scores_diverge_on_hazmat_case
          rationale: "The HAZMAT score composition (58 statutory / 73.8 risk-adjusted) is asserted field-by-field in the named §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: release_docket_flips_reports_and_releases_recorders
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Investigation.docket_status.SEALED_to_OPEN
          - state_machines.FactualReport.VERIFIED_to_DOCKETED
          - state_machines.RecorderPackage.READOUT_COMPLETE_to_RELEASED
        distinguishing_aspect: "release-docket executes every declared side effect in one request: the VERIFIED report becomes DOCKETED, the recorder whose readout finished becomes RELEASED, docket_status opens, and pct reaches 100 — while a second recorder with zero sessions stays SECURED."
        test_recipe:
          setup:
            - "Base chain through group completion; one CVR whose only session ended at 2026-09-02T12:00:00Z (clock advanced past it) and one FDR with no sessions."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - &c_group
              call: "POST /groups"
              payload: { investigation_id: "${inv_id}", specialty: "OPERATIONS", chairman_user_id: "gc-1" }
              as: IIC
              as_user_id: "iic-1"
              captures: { grp_id: $.data.id }
            - &c_adv_onscene
              call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "ON_SCENE" }
              as: IIC
              as_user_id: "iic-1"
            - *c_org
            - *c_designation
            - &c_seat
              call: "POST /party-designations/${dsg_id}/seats"
              payload: { group_id: "${grp_id}" }
              as: IIC
              as_user_id: "iic-1"
              captures: { seat_id: $.data.group_seats.0.seat_id }
            - &c_adv_factual
              call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "FACTUAL" }
              as: IIC
              as_user_id: "iic-1"
            - &c_report
              call: "POST /groups/${grp_id}/factual-reports"
              payload: { report_kind: "GROUP_FACTUAL", content: "Factual record: brake system teardown results." }
              as: GroupChairman
              as_user_id: "gc-1"
              captures: { rpt_id: $.data.factual_reports.0.report_id }
            - &c_verify
              call: "POST /groups/${grp_id}/factual-reports/${rpt_id}/verify"
              payload: {}
              as: IIC
              as_user_id: "iic-1"
            - &c_complete
              call: "POST /groups/${grp_id}/complete"
              payload: {}
              as: GroupChairman
              as_user_id: "gc-1"
            - call: "POST /recorders"
              payload: { investigation_id: "${inv_id}", recorder_type: "CVR", condition: "INTACT" }
              as: RecorderCustodian
              captures: { cvr_id: $.data.id }
            - call: "POST /recorders/${cvr_id}/readout-sessions"
              payload: { bench_id: "bench-1", window_start_utc: "2026-09-02T10:00:00Z", window_end_utc: "2026-09-02T12:00:00Z" }
              as: RecorderCustodian
            - call: "POST /recorders"
              payload: { investigation_id: "${inv_id}", recorder_type: "FDR", condition: "SEVERELY_DAMAGED" }
              as: RecorderCustodian
              captures: { fdr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: BoardAdmin
          trigger:
            - &c_release
              call: "POST /investigations/${inv_id}/release-docket"
              payload: {}
              as: DocketOfficer
          assert:
            - "the response shows docket_status == OPEN and docket_completeness_pct == 100"
            - "GET /groups/${grp_id} shows the embedded report ${rpt_id} with status == DOCKETED"
            - "GET /recorders/${cvr_id} shows status == RELEASED (its readout was complete)"
            - "GET /recorders/${fdr_id} shows status == SECURED (no sessions ever scheduled — nothing to release)"

      - name: board_adoption_marks_case_terminal_and_rejects_new_proposals
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AccidentCase
          - errors.ERR_CASE_NOT_SCREENING
        distinguishing_aspect: "After the adoption cascade closes the case (CLOSED_ADOPTED), a fresh launch-decision proposal carrying the case's current version still fails with ERR_CASE_NOT_SCREENING — the terminal state locks the launch pipeline even for an OCC-valid writer."
        test_recipe:
          setup:
            - "Full base chain through ANALYSIS, a 3-member board meeting in session, votes 2 ADOPT / 1 REJECT, meeting closed ADOPTED."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
            - &c_adv_analysis
              call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "ANALYSIS" }
              as: IIC
              as_user_id: "iic-1"
            - &c_mtg
              call: "POST /board-meetings"
              payload: { investigation_id: "${inv_id}", room_id: "room-1", window_start_utc: "2026-09-02T09:00:00Z", window_end_utc: "2026-09-02T10:00:00Z", sitting_member_ids: ["bm-1", "bm-2", "bm-3"] }
              as: BoardAdmin
              captures: { mtg_id: $.data.id, mtg_v: $.data.version }
            - &c_adv_board
              call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "BOARD_REVIEW" }
              as: IIC
              as_user_id: "iic-1"
            - &c_clock_session
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: BoardAdmin
            - &c_vote1
              call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${mtg_v}" }
              as: BoardMember
              as_user_id: "bm-1"
              captures: { mtg_v2: $.data.version }
            - &c_vote2
              call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${mtg_v2}" }
              as: BoardMember
              as_user_id: "bm-2"
              captures: { mtg_v3: $.data.version }
            - &c_vote3
              call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "REJECT", dissent_text: "The probable cause underweights maintenance culture.", expected_meeting_version: "${mtg_v3}" }
              as: BoardMember
              as_user_id: "bm-3"
            - &c_close
              call: "POST /board-meetings/${mtg_id}/close"
              payload: {}
              as: BoardAdmin
              captures: { mtg_v_final: $.data.version }
            - call: "GET /accident-cases/${case_id}"
              payload: {}
              as: DutyOfficer
              captures: { case_v_final: $.data.version }
          trigger:
            - call: "POST /accident-cases/${case_id}/launch-decisions"
              payload: { mode: "LIMITED", expected_accident_case_version: "${case_v_final}" }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the case read showed status == CLOSED_ADOPTED after the cascade"
            - "the proposal returns 409 and error_id == ERR_CASE_NOT_SCREENING (not a stale-version error — the version was refreshed)"

      - name: advance_phase_skipping_on_scene_returns_phase_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Investigation
          - errors.ERR_INVESTIGATION_PHASE_INVALID
        distinguishing_aspect: "A hop outside the declared order (GO_TEAM_ASSEMBLED directly to FACTUAL) is rejected with ERR_INVESTIGATION_PHASE_INVALID even before gate evaluation — the machine is not fully-connected."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one launched investigation in GO_TEAM_ASSEMBLED with no groups."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
          trigger:
            - call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "FACTUAL" }
              as: IIC
              as_user_id: "iic-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVESTIGATION_PHASE_INVALID"
            - "error_id != ERR_PHASE_GATE_UNSATISFIED (bad-hop detection precedes gate evaluation)"
            - "GET /investigations/${inv_id} still shows phase == GO_TEAM_ASSEMBLED"

      - name: reconsider_on_proposed_decision_returns_state_invalid
        claim_type: Idempotency
        grounds:
          - state_machines.LaunchDecision.ADOPTED_to_PROPOSED
          - errors.ERR_DECISION_STATE_INVALID
        distinguishing_aspect: "Reconsidering a decision that is only PROPOSED fails with ERR_DECISION_STATE_INVALID — the case is still SCREENING so only the decision-level state guard can fire, pinning the per-resource state error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one case with a PROPOSED FULL_GO_TEAM decision."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
          trigger:
            - call: "POST /accident-cases/${case_id}/launch-decisions/${decision_id}/reconsider"
              payload: { rationale: "Reopen prematurely." }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DECISION_STATE_INVALID"
            - "GET /accident-cases/${case_id} shows status == SCREENING and the decision still PROPOSED"

      - name: recommendation_reclassification_loop_and_streak_tracking
        claim_type: Valid Transition
        grounds:
          - state_machines.SafetyRecommendation.OPEN_ACCEPTABLE_to_OPEN_UNCLASSIFIED
          - state_machines.SafetyRecommendation.OPEN_UNCLASSIFIED_to_OPEN_UNACCEPTABLE
        distinguishing_aspect: "The cyclic reclassification path: OPEN_AWAITING_RESPONSE -> OPEN_UNCLASSIFIED -> OPEN_ACCEPTABLE -> (new response) OPEN_UNCLASSIFIED -> OPEN_UNACCEPTABLE, with unacceptable_streak landing at exactly 1 and the response_log preserving both classifications in order."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS with one recommendation issued to the operator organization."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
            - *c_adv_analysis
            - &c_rec
              call: "POST /safety-recommendations"
              payload: { investigation_id: "${inv_id}", addressee_org_id: "${org_id}", recommendation_text: "Require quarterly brake-line inspection intervals." }
              as: IIC
              as_user_id: "iic-1"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /safety-recommendations/${rec_id}/responses"
              payload: { response_text: "We will implement quarterly inspections starting Q4." }
              as: AddresseeContact
              as_user_id: "${org_id}"
            - call: "POST /safety-recommendations/${rec_id}/classify"
              payload: { classification: "ACCEPTABLE" }
              as: ManagingDirector
              as_user_id: "md-1"
            - call: "POST /safety-recommendations/${rec_id}/responses"
              payload: { response_text: "Correction: implementation slips to next year." }
              as: AddresseeContact
              as_user_id: "${org_id}"
            - call: "POST /safety-recommendations/${rec_id}/classify"
              payload: { classification: "UNACCEPTABLE" }
              as: ManagingDirector
              as_user_id: "md-1"
          assert:
            - "after the first response: status == OPEN_UNCLASSIFIED (from OPEN_AWAITING_RESPONSE)"
            - "after classify ACCEPTABLE: status == OPEN_ACCEPTABLE and unacceptable_streak == 0"
            - "after the second response: status == OPEN_UNCLASSIFIED — the reclassification loop out of OPEN_ACCEPTABLE"
            - "after classify UNACCEPTABLE: status == OPEN_UNACCEPTABLE and unacceptable_streak == 1"
            - "response_log has length 2 with classifications [ACCEPTABLE, UNACCEPTABLE] in append order"

      - name: lazy_readout_completion_never_bumps_version
        claim_type: Valid Transition
        grounds:
          - state_machines.ReadoutSession.SCHEDULED_to_COMPLETE
          - state_machines.RecorderPackage.IN_READOUT_to_READOUT_COMPLETE
        distinguishing_aspect: "System lazy transitions resolve from the logical clock on read: once the clock reaches window_end_utc the session reads COMPLETE and the recorder reads READOUT_COMPLETE, but RecorderPackage.version stays at the value left by the last real write — lazy evaluation is not a mutation."
        test_recipe:
          setup:
            - "Launched investigation; one FDR with a session 2026-09-02T10:00:00Z–12:00:00Z on bench-3."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - call: "POST /recorders"
              payload: { investigation_id: "${inv_id}", recorder_type: "FDR", condition: "INTACT" }
              as: RecorderCustodian
              captures: { rp_id: $.data.id }
            - call: "POST /recorders/${rp_id}/readout-sessions"
              payload: { bench_id: "bench-3", window_start_utc: "2026-09-02T10:00:00Z", window_end_utc: "2026-09-02T12:00:00Z" }
              as: RecorderCustodian
              captures: { rp_v_after_session: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: BoardAdmin
            - call: "GET /recorders/${rp_id}"
              payload: {}
              as: RecorderCustodian
          assert:
            - "before the clock move the recorder read IN_READOUT"
            - "after the clock move: readout_sessions.0.status == COMPLETE and the recorder status == READOUT_COMPLETE"
            - "RecorderPackage.${rp_id}.version == ${rp_v_after_session} (lazy evaluation did not increment the version)"

      - name: advance_on_scene_without_any_group_fails_gate
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Investigation.GO_TEAM_ASSEMBLED_to_ON_SCENE
          - errors.ERR_PHASE_GATE_UNSATISFIED
        distinguishing_aspect: "The first advance gate is an aggregate over child state: with zero investigative groups the hop to ON_SCENE fails with ERR_PHASE_GATE_UNSATISFIED; creating one ACTIVE group satisfies it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one launched investigation, no groups."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
          trigger:
            - call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "ON_SCENE" }
              as: IIC
              as_user_id: "iic-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /groups"
              payload: { investigation_id: "${inv_id}", specialty: "STRUCTURES", chairman_user_id: "gc-2" }
              as: IIC
              as_user_id: "iic-1"
            - call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "ON_SCENE" }
              as: IIC
              as_user_id: "iic-1"
          assert:
            - "the first advance returns 409 and error_id == ERR_PHASE_GATE_UNSATISFIED"
            - "after the group creation the identical advance returns 200 with phase == ON_SCENE"

      - name: adoption_tie_votes_resolve_not_adopted_and_revert_to_analysis
        claim_type: Valid Transition
        grounds:
          - calculations.adoption_outcome
          - state_machines.Investigation.BOARD_REVIEW_to_ANALYSIS
        distinguishing_aspect: "Strict-majority boundary: five sitting members split 2 ADOPT / 2 REJECT / 1 ABSTAIN — adopt_count > reject_count is false, so outcome is NOT_ADOPTED and the investigation reverts from BOARD_REVIEW to ANALYSIS (the board-review revert branch), ready for another meeting."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS; a 5-member meeting in session with a 2-2-1 vote split."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
            - *c_adv_analysis
            - call: "POST /board-meetings"
              payload: { investigation_id: "${inv_id}", room_id: "room-3", window_start_utc: "2026-09-21T13:00:00Z", window_end_utc: "2026-09-21T14:00:00Z", sitting_member_ids: ["bm-1", "bm-2", "bm-3", "bm-4", "bm-5"] }
              as: BoardAdmin
              captures: { tie_mtg_id: $.data.id, tie_v: $.data.version }
            - call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "BOARD_REVIEW" }
              as: IIC
              as_user_id: "iic-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T13:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /board-meetings/${tie_mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${tie_v}" }
              as: BoardMember
              as_user_id: "bm-1"
              captures: { tie_v2: $.data.version }
            - call: "POST /board-meetings/${tie_mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${tie_v2}" }
              as: BoardMember
              as_user_id: "bm-2"
              captures: { tie_v3: $.data.version }
            - call: "POST /board-meetings/${tie_mtg_id}/votes"
              payload: { position: "REJECT", expected_meeting_version: "${tie_v3}" }
              as: BoardMember
              as_user_id: "bm-3"
              captures: { tie_v4: $.data.version }
            - call: "POST /board-meetings/${tie_mtg_id}/votes"
              payload: { position: "REJECT", expected_meeting_version: "${tie_v4}" }
              as: BoardMember
              as_user_id: "bm-4"
              captures: { tie_v5: $.data.version }
            - call: "POST /board-meetings/${tie_mtg_id}/votes"
              payload: { position: "ABSTAIN", expected_meeting_version: "${tie_v5}" }
              as: BoardMember
              as_user_id: "bm-5"
            - call: "POST /board-meetings/${tie_mtg_id}/close"
              payload: {}
              as: BoardAdmin
          assert:
            - "BoardMeeting.${tie_mtg_id}.outcome == NOT_ADOPTED (2 > 2 is false; the ABSTAIN vote counts for neither side)"
            - "adopt_count == 2 and reject_count == 2 and abstain_count == 1"
            - "GET /investigations/${inv_id} shows phase == ANALYSIS (reverted from BOARD_REVIEW) and docket_status still OPEN"
            - "a subsequent GET /board-meetings?investigation_id=${inv_id} shows the meeting COMPLETED — the tie did not wedge the pipeline"

      - name: vote_after_close_returns_meeting_not_in_session
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BoardMeeting
          - errors.ERR_MEETING_NOT_IN_SESSION
        distinguishing_aspect: "A COMPLETED meeting rejects further votes with ERR_MEETING_NOT_IN_SESSION even when the caller carries the meeting's final version — terminal state beats OCC freshness."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS; meeting in room-1 closed ADOPTED (2-1)."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
            - *c_release
            - *c_adv_analysis
            - *c_mtg
            - *c_adv_board
            - *c_clock_session
            - *c_vote1
            - *c_vote2
            - *c_vote3
            - *c_close
          trigger:
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "ABSTAIN", expected_meeting_version: "${mtg_v_final}" }
              as: BoardMember
              as_user_id: "bm-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_MEETING_NOT_IN_SESSION"
            - "GET /board-meetings/${mtg_id} shows outcome == ADOPTED and tallies unchanged (2/1/0)"

      - name: launch_decision_reconsider_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.LaunchDecision.ADOPTED_to_PROPOSED
        excluded_because:
          difficulty_instance: non_linear_launch_decision_reconsider_cycle
          rationale: "The full PROPOSED -> ADOPTED -> PROPOSED -> ADOPTED loop with severity re-scoring is asserted in the named §1.8 instance."

      - name: reopen_factual_reverts_complete_groups
        claim_type: Valid Transition
        grounds:
          - state_machines.Investigation.ANALYSIS_to_FACTUAL
        excluded_because:
          difficulty_instance: non_linear_investigation_factual_analysis_revert
          rationale: "The ANALYSIS -> FACTUAL -> ANALYSIS loop including group reversion and docket persistence is asserted in the named §1.8 instance."

      - name: expulsion_cascade_side_effects_on_group_and_docket
        claim_type: Side Effect Execution
        grounds:
          - state_machines.PartyDesignation.ACTIVE_to_EXPELLED
        excluded_because:
          difficulty_instance: transitive_cascade_expulsion_empties_complete_group
          rationale: "Every hop of the expulsion cascade (seat removal, group revert, pct recompute) is asserted in the named §1.8 instance."

      - name: board_adoption_cascade_side_effects
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BoardMeeting.IN_SESSION_to_COMPLETED
        excluded_because:
          difficulty_instance: transitive_cascade_board_adoption_closes_case
          rationale: "The meeting -> investigation -> case cascade including docket FINAL and group DISBANDED is asserted in the named §1.8 instance."

      - name: designation_creation_blocked_in_analysis_phase
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PartyDesignation
          - errors.ERR_INVESTIGATION_PHASE_INVALID
        excluded_because:
          difficulty_instance: cross_entity_designation_gated_by_investigation_phase
          rationale: "The phase gate on designation creation (allowed in ON_SCENE, rejected in ANALYSIS) is asserted in the named §1.8 instance."

      - name: seat_creation_blocked_on_complete_group
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.GroupSeat
          - errors.ERR_GROUP_NOT_ACTIVE
        excluded_because:
          difficulty_instance: cross_entity_seat_gated_by_group_status
          rationale: "The group-state gate on seat creation is asserted in the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: docket_completeness_pct_thirds_rounding
        claim_type: Correct Result
        grounds:
          - calculations.docket_completeness_pct
          - entities.Investigation.fields.docket_completeness_pct
        distinguishing_aspect: "Aggregation precision: with three groups and exactly one satisfied, pct is round_half_up(100/3) == 33 (not 33.33 and not 34); the two-pass evaluation reads stored group status, so the still-ACTIVE groups with seats but no verified reports count as unsatisfied."
        test_recipe:
          setup:
            - "Investigation in FACTUAL with three groups, each holding one seat from the same designation; only group 1 has a VERIFIED report and is COMPLETE."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - call: "POST /groups"
              payload: { investigation_id: "${inv_id}", specialty: "STRUCTURES", chairman_user_id: "gc-2" }
              as: IIC
              as_user_id: "iic-1"
              captures: { grp2_id: $.data.id }
            - call: "POST /groups"
              payload: { investigation_id: "${inv_id}", specialty: "HUMAN_PERFORMANCE", chairman_user_id: "gc-3" }
              as: IIC
              as_user_id: "iic-1"
              captures: { grp3_id: $.data.id }
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - call: "POST /party-designations/${dsg_id}/seats"
              payload: { group_id: "${grp2_id}" }
              as: IIC
              as_user_id: "iic-1"
            - call: "POST /party-designations/${dsg_id}/seats"
              payload: { group_id: "${grp3_id}" }
              as: IIC
              as_user_id: "iic-1"
            - *c_adv_factual
            - *c_report
            - *c_verify
            - *c_complete
          trigger:
            - call: "GET /investigations/${inv_id}"
              payload: {}
              as: DutyOfficer
          assert:
            - "docket_completeness_pct == 33 (one of three groups satisfied, round_half_up to integer)"
            - "GET /groups/${grp2_id} shows status == ACTIVE and GET /groups/${grp3_id} shows status == ACTIVE — seated but never completed"
            - "docket_status == SEALED (release is impossible while groups 2 and 3 are incomplete)"

      - name: strike_threshold_suspends_seat_and_reconciles_seated_count
        claim_type: Constants Applied
        grounds:
          - calculations.strike_accumulation
          - calculations.seated_count
          - entities.GroupSeat.fields.strike_count
        distinguishing_aspect: "The SUSPENSION_STRIKE_THRESHOLD of 2 is inclusive: the first violation leaves the seat SEATED with strike_count 1 and the group seated_count 1; the second suspends it (strike_count 2) and immediately drops the derived seated_count to 0; a third violation is rejected because a SUSPENDED seat is not SEATED."
        test_recipe:
          setup:
            - "Investigation ON_SCENE with one ACTIVE group and one SEATED party seat."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
          trigger:
            - call: "POST /party-designations/${dsg_id}/seats/${seat_id}/conduct-violations"
              payload: { violation_kind: "UNAUTHORIZED_ANALYSIS_DISCLOSURE", detail: "Shared draft analysis with a non-party affiliate." }
              as: IIC
              as_user_id: "iic-1"
            - call: "POST /party-designations/${dsg_id}/seats/${seat_id}/conduct-violations"
              payload: { violation_kind: "EX_PARTE_CONTACT", detail: "Undisclosed contact with a board member." }
              as: IIC
              as_user_id: "iic-1"
            - call: "POST /party-designations/${dsg_id}/seats/${seat_id}/conduct-violations"
              payload: { violation_kind: "EX_PARTE_CONTACT", detail: "Second undisclosed contact." }
              as: IIC
              as_user_id: "iic-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "after violation 1: seat strike_count == 1 and status still SEATED, and GET /groups/${grp_id} shows seated_count == 1"
            - "after violation 2: seat strike_count == 2 and status == SUSPENDED (threshold is >= 2), and GET /groups/${grp_id} shows seated_count == 0"
            - "violation 3 returns 409 and error_id == ERR_SEAT_NOT_SEATED"

      - name: statutory_score_clamp_and_modal_bump
        claim_type: Correct Result
        grounds:
          - calculations.statutory_launch_score
        excluded_because:
          difficulty_instance: combinatorial_statutory_score_clamp_and_modal_bump
          rationale: "The tier+min+bump+clamp composition to exactly 100 is asserted in the named §1.8 instance."

      - name: risk_adjusted_rounding_order
        claim_type: Precision
        grounds:
          - calculations.risk_adjusted_launch_score
        excluded_because:
          difficulty_instance: combinatorial_risk_adjusted_per_component_rounding_order
          rationale: "The per-component-then-sum rounding order (62.6, not 62.5) is asserted in the named §1.8 instance."

      - name: recommendation_aging_bucket_boundaries
        claim_type: Variant Divergence
        grounds:
          - calculations.recommendation_aging
        excluded_because:
          difficulty_instance: dual_variant_recommendation_aging_calendar_vs_business
          rationale: "The GREEN/AMBER boundary at 59/60 business days and the calendar/business divergence are asserted in the named §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_on_case_get_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "Priority 1 beats everything: a read with no X-User-Role/X-User-ID at all returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER even though reads are otherwise open to every declared role."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /accident-cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "no role-specific or not-found error leaks — authentication precedes authorization and existence"

      - name: duty_officer_cannot_adopt_and_role_check_precedes_existence
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "Priority 2 beats priority 3: a DutyOfficer calling the adopt endpoint with two unknown path ids gets 403 ERR_INSUFFICIENT_PERMISSIONS — the role check fires before any id is resolved, so no 404 information leaks to unauthorized callers."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /accident-cases/00000000-0000-4000-8000-000000000001/launch-decisions/00000000-0000-4000-8000-000000000002/adopt"
              payload: { iic_user_id: "iic-1" }
              as: DutyOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "error_id != ERR_ACCIDENT_CASE_NOT_FOUND"

      - name: body_foreign_keys_checked_in_declared_input_order
        claim_type: Priority Ordering
        grounds:
          - validations[priority=3]
          - endpoints.POST_/party-designations
          - errors.ERR_INVESTIGATION_NOT_FOUND
          - errors.ERR_PARTY_ORGANIZATION_NOT_FOUND
        distinguishing_aspect: "Both body foreign keys unknown yields ERR_INVESTIGATION_NOT_FOUND (investigation_id is declared first in the endpoint input); with only the organization unknown it yields ERR_PARTY_ORGANIZATION_NOT_FOUND — the check order follows the input list, not id sort."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one launched investigation."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
          trigger:
            - call: "POST /party-designations"
              payload: { investigation_id: "00000000-0000-4000-8000-000000000001", organization_id: "00000000-0000-4000-8000-000000000002" }
              as: PartyCoordinator
              captures: { err_both: $.data.error_id }
            - call: "POST /party-designations"
              payload: { investigation_id: "${inv_id}", organization_id: "00000000-0000-4000-8000-000000000002" }
              as: PartyCoordinator
              captures: { err_org: $.data.error_id }
          assert:
            - "the first request returns 404 and err_both == ERR_INVESTIGATION_NOT_FOUND"
            - "err_both != ERR_PARTY_ORGANIZATION_NOT_FOUND"
            - "the second request returns 404 and err_org == ERR_PARTY_ORGANIZATION_NOT_FOUND"
            - "GET /party-designations?investigation_id=${inv_id} returns 0 rows"

      - name: expel_without_qualifying_violation_returns_constraint_error
        claim_type: Violation → Error
        grounds:
          - errors.ERR_EXPULSION_WITHOUT_QUALIFYING_VIOLATION
          - state_machines.PartyDesignation.ACTIVE_to_EXPELLED
        distinguishing_aspect: "A designation whose only conduct violation is EX_PARTE_CONTACT cannot be expelled — expulsion is reserved for premature public statements; the 422 ERR_EXPULSION_WITHOUT_QUALIFYING_VIOLATION leaves the designation ACTIVE."
        test_recipe:
          setup:
            - "Investigation ON_SCENE with one seated party carrying a single EX_PARTE_CONTACT violation."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
            - *c_group
            - *c_adv_onscene
            - *c_org
            - *c_designation
            - *c_seat
            - call: "POST /party-designations/${dsg_id}/seats/${seat_id}/conduct-violations"
              payload: { violation_kind: "EX_PARTE_CONTACT", detail: "Undisclosed contact with a board member." }
              as: IIC
              as_user_id: "iic-1"
          trigger:
            - call: "POST /party-designations/${dsg_id}/expel"
              payload: { reason: "General misconduct." }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_EXPULSION_WITHOUT_QUALIFYING_VIOLATION"
            - "GET /party-designations/${dsg_id} shows status == ACTIVE and the seat still SEATED (strike_count 1)"

      - name: proposer_cannot_adopt_own_launch_decision
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors.ERR_SOD_PROPOSER_CANNOT_ADOPT
        distinguishing_aspect: "Segregation of duties on the launch decision: the ManagingDirector md-1 who proposed cannot adopt; the same payload from a different ManagingDirector md-2 succeeds — the block is on actor identity, not on role or content."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one 60-point case with a PROPOSED FULL_GO_TEAM decision by md-1."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
          trigger:
            - call: "POST /accident-cases/${case_id}/launch-decisions/${decision_id}/adopt"
              payload: { iic_user_id: "iic-1" }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /accident-cases/${case_id}/launch-decisions/${decision_id}/adopt"
              payload: { iic_user_id: "iic-1" }
              as: ManagingDirector
              as_user_id: "md-2"
          assert:
            - "the first adopt returns 403 and error_id == ERR_SOD_PROPOSER_CANNOT_ADOPT"
            - "the second adopt (identical payload, different X-User-ID) returns 200 and the case is LAUNCHED"

      - name: iic_cannot_chair_own_investigation_group
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors.ERR_SOD_IIC_CANNOT_CHAIR
        distinguishing_aspect: "Group formation rejects chairman_user_id equal to the investigation's iic_user_id with 403 ERR_SOD_IIC_CANNOT_CHAIR — the author/verifier separation is enforced at group creation so the later report-verify path never needs to re-check it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one launched investigation with iic_user_id iic-1."
          setup_api_calls:
            - *c_clock
            - *c_case
            - *c_propose
            - *c_adopt
            - *c_fetch_inv
          trigger:
            - call: "POST /groups"
              payload: { investigation_id: "${inv_id}", specialty: "OPERATIONS", chairman_user_id: "iic-1" }
              as: IIC
              as_user_id: "iic-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_SOD_IIC_CANNOT_CHAIR"
            - "GET /groups?investigation_id=${inv_id} returns 0 rows"

      - name: iic_cannot_sit_on_board_for_own_investigation
        claim_type: Violation → Error
        grounds:
