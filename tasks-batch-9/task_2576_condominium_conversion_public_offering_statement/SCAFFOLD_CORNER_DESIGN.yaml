          - state_machines.DeclarationPackage.initial_state
          - state_machines.ClosingBatch.initial_state
          - entities.Unit.fields.declaration_status
          - entities.Unit.fields.sale_status
        distinguishing_aspect: "Each freshly created child must sit in its own declared initial state with
          its counters at zero: EngineeringReport DRAFT with revision_round 0 (submission, not creation,
          is what increments it), DeclarationPackage DRAFT with plat_revision 0, and Unit INCLUDED /
          UNSOLD with percentage_interest_bp already seeded from base_percentage_interest_bp, while the
          package's allocated_bp_total is still 0 because nothing reallocates until plat certification."
        test_recipe:
          setup:
            - "One ConversionProject in FEASIBILITY / RESTRICTED, nothing else."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
          trigger:
            - call: "POST /conversion-projects/${proj_id}/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
