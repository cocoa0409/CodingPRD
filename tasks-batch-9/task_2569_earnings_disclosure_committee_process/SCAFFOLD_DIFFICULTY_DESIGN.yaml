          A PENDING sub-certification is perfectly valid in itself; whether SUBMIT is allowed depends on
          the CommitteeMember row two hops away from the request body, and the dependency is reversible.
          The same SUBMIT call fails with ERR_MEMBER_SEAT_INVALID while the holder is RECUSED and
