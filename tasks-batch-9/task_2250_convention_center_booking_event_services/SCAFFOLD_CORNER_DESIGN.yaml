              as: VenueAdmin
              captures: { cl_nwa_id: $.data.id }
          trigger:
            - call: "POST /convention-center/bookings"
              payload: { client_id: "${cl_nwa_id}", space_id: "${sp_ha_id}", event_name: "National Widget Convention", event_class: "CITYWIDE_CONVENTION", move_in_start_date: "2028-05-10", show_start_date: "2028-05-14", show_end_date: "2028-05-17", move_out_end_date: "2028-05-19", projected_room_nights: 2500 }
