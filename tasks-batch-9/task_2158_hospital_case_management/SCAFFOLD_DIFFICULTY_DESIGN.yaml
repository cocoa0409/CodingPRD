              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { scr9_id: $.data.id }
            - call: "POST /screenings/${scr9_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { score9: $.data.composite_risk_score, band9: $.data.risk_band }
            - call: "POST /episodes"
              payload: { patient_id: "${pat10_id}", admission_type: "EMERGENT", drg_code: "DRG-291", drg_gmlos_days: 4.5, attending_unit: "5W", admitted_at: "2026-08-01T00:00:00Z" }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { ep10_id: $.data.id }
            - call: "POST /episodes/${ep10_id}/screenings"
              payload: { screening_type: "ADMISSION", functional_score: 8, cognitive_score: 8, social_support_score: 4, medication_count: 10 }
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { scr10_id: $.data.id }
          trigger:
            - call: "POST /screenings/${scr10_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-alpha"
              captures: { score10: $.data.composite_risk_score, band10: $.data.risk_band }
          assert:
            - "RiskScreening.${scr9_id}.composite_risk_score == 43 and RiskScreening.${scr9_id}.risk_band == MODERATE"
            - "RiskScreening.${scr10_id}.composite_risk_score == 50 and RiskScreening.${scr10_id}.risk_band == HIGH"
            - "the two scores differ by exactly POLYPHARMACY_POINTS == 7"
            - "GET /episodes/${ep9_id}/barriers returns 0 rows"
            - "GET /episodes/${ep10_id}/barriers returns exactly 1 row with barrier_code == PHYSICIAN_ORDER, severity == MEDIUM, delay_reason_code == AWAITING_PHYSICIAN, origin == SCREENING_AUTO"
            - "Episode.${ep9_id}.barrier_posture == CLEAR and Episode.${ep10_id}.barrier_posture == ACTIVE"
            - "Episode.${ep9_id}.readmission_bundle_complete == false (MODERATE still needs pcp_followup_booked)"

