scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_client_creation_returns_declared_defaults
        claim_type: Creation
        grounds:
          - entities.Client.fields.credit_balance_cents
          - entities.Client.fields.portfolio_delinquency_status
          - entities.Client.fields.portfolio_risk_flag
        distinguishing_aspect: "A freshly created Client returns 201 with credit_balance_cents 0, portfolio_entity_count 0, portfolio_open_obligation_count 0, portfolio_outstanding_cents 0, portfolio_delinquency_status CURRENT, sop_open_escalation_count 0, portfolio_risk_flag false and version 1."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "GET /clients/${client_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Client.${client_id}.credit_balance_cents == 0"
            - "Client.${client_id}.portfolio_entity_count == 0"
            - "Client.${client_id}.portfolio_open_obligation_count == 0"
            - "Client.${client_id}.portfolio_outstanding_cents == 0"
            - "Client.${client_id}.portfolio_delinquency_status == 'CURRENT'"
            - "Client.${client_id}.sop_open_escalation_count == 0"
            - "Client.${client_id}.portfolio_risk_flag == false"
            - "Client.${client_id}.version == 1"

      - name: corner_client_not_found_returns_client_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_CLIENT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET /clients/{id} with a well-formed but unknown UUID returns 404 ERR_CLIENT_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 404"
            - "The response error_id is 'ERR_CLIENT_NOT_FOUND'"

      - name: corner_legal_entity_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=13]
          - errors[ERR_INVALID_REQUEST]
          - entities.LegalEntity.fields.formation_date
        distinguishing_aspect: "POST /clients/{id}/legal-entities without formation_date returns 400 ERR_INVALID_REQUEST and creates no row."
        test_recipe:
          setup:
            - "One Client exists."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 400 with error_id 'ERR_INVALID_REQUEST'"
            - "GET /clients/${client_id}/legal-entities returns 0 rows"

      - name: corner_legal_entity_optional_fields_take_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.LegalEntity.fields.fiscal_year_end_month
          - entities.LegalEntity.fields.fiscal_year_end_day
          - entities.LegalEntity.fields.boi_exempt_class
          - entities.LegalEntity.fields.lifecycle_status
        distinguishing_aspect: "Omitting fiscal_year_end_month, fiscal_year_end_day, share counts and boi_exempt_class yields 12, 31, 0, 0, 0, 0 and NONE, with lifecycle_status DRAFT."
        test_recipe:
          setup:
            - "One Client exists."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
          assert:
            - "LegalEntity.${ent_id}.fiscal_year_end_month == 12"
            - "LegalEntity.${ent_id}.fiscal_year_end_day == 31"
            - "LegalEntity.${ent_id}.authorized_shares == 0"
            - "LegalEntity.${ent_id}.issued_shares == 0"
            - "LegalEntity.${ent_id}.total_gross_assets_cents == 0"
            - "LegalEntity.${ent_id}.annual_gross_receipts_cents == 0"
            - "LegalEntity.${ent_id}.boi_exempt_class == 'NONE'"
            - "LegalEntity.${ent_id}.lifecycle_status == 'DRAFT'"
            - "LegalEntity.${ent_id}.compliance_posture == 'CURRENT'"
            - "LegalEntity.${ent_id}.final_report_required == false"

      - name: corner_legal_entity_boi_fields_are_computed_at_creation
        claim_type: Computed Fields
        grounds:
          - calculations.boi_initial_deadline
          - entities.LegalEntity.fields.boi_initial_deadline
          - entities.LegalEntity.fields.company_applicant_required
          - entities.LegalEntity.fields.boi_status
        distinguishing_aspect: "An entity formed 2026-02-10 gets boi_initial_deadline 2026-03-12 (30-day band), company_applicant_required true and boi_status PENDING_INITIAL, all derived server-side with no client input."
        test_recipe:
          setup:
            - "One Client exists; clock at the 2026-05-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-02-10" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
          assert:
            - "LegalEntity.${ent_id}.boi_initial_deadline == '2026-03-12'"
            - "LegalEntity.${ent_id}.company_applicant_required == true"
            - "LegalEntity.${ent_id}.boi_status == 'PENDING_INITIAL'"
            - "LegalEntity.${ent_id}.boi_update_deadline == null"

      - name: corner_state_rule_system_fields_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.StateRule.fields.effective_to
          - entities.StateRule.fields.state_code
        distinguishing_aspect: "A newly published StateRule comes back with a server-minted UUID id carrying no type prefix, version 1 and effective_to null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000, grace_days: 30, grace_basis: "CALENDAR_DAYS", late_fee_style: "FLAT", late_fee_flat_cents: 20000 }
              as: PlatformAdmin
              captures: { rule_id: $.data.id }
          assert:
            - "StateRule.${rule_id}.effective_to == null"
            - "StateRule.${rule_id}.version == 1"
            - "StateRule.${rule_id}.state_code == 'DE'"
            - "The returned id is a bare UUID with no prefix segment"

      - name: corner_legal_entity_invalid_entity_type_returns_invalid_enum
        claim_type: Type Constraints
        grounds:
          - validations[priority=14]
          - errors[ERR_INVALID_ENUM]
          - entities.LegalEntity.fields.entity_type
        distinguishing_aspect: "entity_type 'S_CORP' is outside the declared member set and returns 422 ERR_INVALID_ENUM, not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One Client exists."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "S_CORP", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 422 with error_id 'ERR_INVALID_ENUM'"

      - name: corner_state_rules_listing_is_paginated
        claim_type: Listing
        grounds:
          - endpoints["GET /state-rules"]
        distinguishing_aspect: "GET /state-rules?limit=2&offset=0 returns 2 of the 3 published rules with total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Three StateRule rows exist for DE, TX and NY."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000 }
              as: PlatformAdmin
            - call: "POST /state-rules"
              payload: { state_code: "TX", effective_from: "2026-01-01", annual_report_basis: "FISCAL_YEAR_END_OFFSET", fiscal_offset_days: 135, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0 }
              as: PlatformAdmin
            - call: "POST /state-rules"
              payload: { state_code: "NY", effective_from: "2026-01-01", annual_report_basis: "ANNIVERSARY_MONTH_DAY", franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0 }
              as: PlatformAdmin
          trigger:
            - call: "GET /state-rules"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "The response returns exactly 2 StateRule rows"
            - "The response meta carries total_count == 3 and has_more == true"

      - name: corner_pagination_limit_out_of_range_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=13]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "limit=101 exceeds the declared maximum of 100 and returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One StateRule row exists."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0 }
              as: PlatformAdmin
          trigger:
            - call: "GET /state-rules"
              payload: { limit: 101 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 400 with error_id 'ERR_INVALID_REQUEST'"

      - name: corner_beneficial_owner_requires_existing_parent_entity
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - errors[ERR_LEGAL_ENTITY_NOT_FOUND]
        distinguishing_aspect: "POST /legal-entities/{id}/beneficial-owners against an unknown entity id returns 404 ERR_LEGAL_ENTITY_NOT_FOUND before any body validation runs."
        test_recipe:
          setup:
            - "Empty database except one Client."
          setup_api_calls:
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
          trigger:
            - call: "POST /legal-entities/00000000-0000-4000-8000-000000000001/beneficial-owners"
              payload: { full_name: "Ada Mercer", date_of_birth: "1980-04-02", residential_address: "12 Pier Rd", id_document_number: "P4471190", ownership_pct: 40 }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 404 with error_id 'ERR_LEGAL_ENTITY_NOT_FOUND'"

      - name: corner_foreign_qualification_with_unknown_name_clearance_returns_record_not_found
        claim_type: Creation
        grounds:
          - validations[priority=11]
          - errors[ERR_RECORD_NOT_FOUND]
          - entities.Registration.fields.name_clearance_id
        distinguishing_aspect: "A body-supplied name_clearance_id that resolves to nothing returns 404 ERR_RECORD_NOT_FOUND, exercising cross-reference integrity in the graph topology."
        test_recipe:
          setup:
            - "DE and TX StateRules; one client, one DE entity with an ACTIVE home registration and a fresh certificate."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000 }
              as: PlatformAdmin
            - call: "POST /state-rules"
              payload: { state_code: "TX", effective_from: "2026-01-01", annual_report_basis: "FISCAL_YEAR_END_OFFSET", fiscal_offset_days: 135, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, good_standing_freshness_days: 30 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /registrations/${reg_id}/agent-appointments"
              payload: { provider_name: "Bay State Agents", appointed_on: "2026-05-01", expected_registration_version: "${reg_v}" }
              as: ComplianceOfficer
              captures: { appt_id: $.data.id }
            - call: "POST /agent-appointments/${appt_id}/accept"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/good-standing-certificates"
              payload: { issued_on: "2026-04-20", certificate_number: "DE-GS-77120" }
              as: ComplianceOfficer
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /legal-entities/${ent_id}/foreign-qualifications"
              payload: { state_code: "TX", name_clearance_id: "00000000-0000-4000-8000-0000000000aa", good_standing_certificate_id: "${cert_id}" }
              as: ComplianceOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 404 with error_id 'ERR_RECORD_NOT_FOUND'"
            - "GET /registrations with legal_entity_id=${ent_id} returns exactly 1 row"

      - name: corner_payment_allocation_is_append_only_with_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.PaymentAllocation.fields.is_reversal
          - entities.PaymentAllocation.fields.sequence_index
        distinguishing_aspect: "PaymentAllocation is declared common_fields false and no §1.5 endpoint mutates it; the only way its contents change is by appending a new row, so a capture produces exactly one row with sequence_index 0 and is_reversal false."
        test_recipe:
          setup:
            - "A DE rule with dissolution_fee_cents 4900; one client, one DE entity, one PENDING DE registration, one DRAFT DISSOLUTION filing, one payment authorized for 9800."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000, dissolution_fee_cents: 4900 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/filings"
              payload: { filing_kind: "DISSOLUTION" }
              as: ComplianceOfficer
              captures: { filing_id: $.data.id }
            - call: "POST /clients/${client_id}/payments"
              payload: { authorized_amount_cents: 9800 }
              as: PlatformAdmin
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_id}/capture"
              payload: { capture_amount_cents: 9800 }
              as: PlatformAdmin
          assert:
            - "GET /payments/${pay_id}/allocations returns exactly 1 row"
            - "That row has amount_cents == 9800, state_portion_cents == 4900, service_portion_cents == 4900, sequence_index == 0, is_reversal == false"
            - "GET /filings/${filing_id}/payment-allocations returns the same single row"
            - "Filing.${filing_id}.paid_amount_cents == 9800"

  - section: state_machines
    instances:
      - name: corner_registration_starts_in_pending_with_no_agent_of_record
        claim_type: Initial State
        grounds:
          - state_machines.Registration.PENDING_to_ACTIVE
          - entities.Registration.fields.status
          - entities.Registration.fields.agent_of_record_id
        distinguishing_aspect: "A freshly created HOME registration is PENDING with qualified_on null, closed_on null, agent_of_record_id null, delinquency_rank 0 and registration_kind HOME."
        test_recipe:
          setup:
            - "A DE StateRule effective 2026-01-01; one client; one DE entity."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000, grace_days: 30, grace_basis: "CALENDAR_DAYS", late_fee_style: "FLAT", late_fee_flat_cents: 20000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
          trigger:
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id }
          assert:
            - "Registration.${reg_id}.status == 'PENDING'"
            - "Registration.${reg_id}.registration_kind == 'HOME'"
            - "Registration.${reg_id}.state_code == 'DE'"
            - "Registration.${reg_id}.qualified_on == null"
            - "Registration.${reg_id}.closed_on == null"
            - "Registration.${reg_id}.agent_of_record_id == null"
            - "Registration.${reg_id}.delinquency_rank == 0"
            - "Registration.${reg_id}.sop_priority_hold == false"

      - name: corner_activate_registration_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Registration.PENDING_to_ACTIVE
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second POST /registrations/{id}/activate on an already-ACTIVE registration returns 409 ERR_INVALID_STATE and leaves qualified_on at its original value."
        test_recipe:
          setup:
            - "A DE StateRule; one client, one DE entity, one ACTIVE DE registration activated at clock 2026-05-01."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /registrations/${reg_id}/agent-appointments"
              payload: { provider_name: "Bay State Agents", appointed_on: "2026-05-01", expected_registration_version: "${reg_v}" }
              as: ComplianceOfficer
              captures: { appt_id: $.data.id }
            - call: "POST /agent-appointments/${appt_id}/accept"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: FilingAgent
          trigger:
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: FilingAgent
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 409 with error_id 'ERR_INVALID_STATE'"
            - "Registration.${reg_id}.status == 'ACTIVE'"
            - "Registration.${reg_id}.qualified_on == '2026-05-01'"

      - name: corner_withdraw_home_registration_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Registration.ACTIVE_to_WITHDRAWN
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Withdrawal is declared only for registration_kind FOREIGN; calling it on the HOME registration returns 409 ERR_INVALID_STATE and leaves the registration ACTIVE."
        test_recipe:
          setup:
            - "A DE StateRule; one client, one DE entity, one ACTIVE DE HOME registration."
          setup_api_calls:
            - call: "POST /state-rules"
              payload: { state_code: "DE", effective_from: "2026-01-01", annual_report_basis: "FIXED_CALENDAR_DATE", fixed_due_month: 3, fixed_due_day: 1, franchise_tax_basis: "FLAT", flat_franchise_tax_cents: 0, annual_report_fee_cents: 5000 }
              as: PlatformAdmin
            - call: "POST /clients"
              payload: { legal_name: "Harbor Holdings", billing_email: "ap@harbor.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/legal-entities"
              payload: { legal_name: "Northwind Widgets LLC", entity_type: "LLC", home_state_code: "DE", formation_date: "2026-01-31" }
              as: ComplianceOfficer
              captures: { ent_id: $.data.id }
            - call: "POST /legal-entities/${ent_id}/registrations"
              payload: {}
              as: ComplianceOfficer
              captures: { reg_id: $.data.id, reg_v: $.data.version }
            - call: "POST /registrations/${reg_id}/agent-appointments"
              payload: { provider_name: "Bay State Agents", appointed_on: "2026-05-01", expected_registration_version: "${reg_v}" }
              as: ComplianceOfficer
              captures: { appt_id: $.data.id }
            - call: "POST /agent-appointments/${appt_id}/accept"
              payload: {}
              as: FilingAgent
            - call: "POST /registrations/${reg_id}/activate"
              payload: {}
              as: FilingAgent
          trigger:
            - call: "POST /registrations/${reg_id}/withdraw"
              payload: {}
              as: FilingAgent
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 409 with error_id 'ERR_INVALID_STATE'"
