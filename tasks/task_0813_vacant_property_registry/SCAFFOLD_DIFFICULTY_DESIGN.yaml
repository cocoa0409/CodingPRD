        distinguishing_aspect: |
          Category pair state (priority 9, fine must be ASSESSED) vs business_fiscal (priority 18,
          finalized >= 25000): a DISPUTED fine of base 10000 violates both, and the state error
          ERR_INVALID_STATE wins over ERR_LIEN_AMOUNT_TOO_LOW.
        test_recipe:
          setup:
            - "Standard PRI-01 base 10000, cure 5. OWNER/VACANT property. Violation escalated 2026-03-06, fined (fine ASSESSED base 10000), then DISPUTED."
          setup_api_calls:
