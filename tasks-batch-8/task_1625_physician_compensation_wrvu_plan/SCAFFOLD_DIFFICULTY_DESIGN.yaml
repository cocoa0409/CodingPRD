scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: capture_credit_attribution_mode_divergence
        grounds:
          - calculations.wrvu_credit
          - entities.CompPlan.fields.credit_attribution_mode
          - entities.ProductionCapture.fields.credited_period
        distinguishing_aspect: |
          Same capture inputs (service_date 2026-02-10, posting_date 2026-03-02, same CPT, same rate)
          produce credited_period 2026-02 under a SERVICE_DATE plan but 2026-03 under a POSTING_DATE
          plan — a dual-variant split on the ProductionCapture domain (the other instance of this rule
          splits on the QualityScorecard domain).
        test_recipe:
          setup:
            - "Physician PH with two EFFECTIVE agreements: AGR_A on PLAN_SD (credit_attribution_mode=SERVICE_DATE) and AGR_PD on PLAN_PD (POSTING_DATE); both plans ACTIVE with rate 99213=0.97 covering 2026"
            - "Logical clock at 2026-01-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000001", full_name: "Dr Dual", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2020-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "SD Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 }, { tier_code: T2, threshold_wrvu: 5000, conversion_factor_cents: 5500, tier_bonus_cents: 250000 }, { tier_code: T3, threshold_wrvu: 8000, conversion_factor_cents: 6500, tier_bonus_cents: 500000 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan_sd: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan_sd}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan_sd}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan_sd}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan_sd}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/comp-plans", payload: { name: "PD Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: POSTING_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 }, { tier_code: T2, threshold_wrvu: 5000, conversion_factor_cents: 5500, tier_bonus_cents: 250000 }, { tier_code: T3, threshold_wrvu: 8000, conversion_factor_cents: 6500, tier_bonus_cents: 500000 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan_pd: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan_pd}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan_pd}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan_pd}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan_pd}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan_sd}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr_sd: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr_sd}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr_sd}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr_sd}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan_pd}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr_pd: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr_pd}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr_pd}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr_pd}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr_sd}/production-captures", payload: { cpt_code: "99213", units: 10, service_date: "2026-02-10", posting_date: "2026-03-02" }, as: CompAnalyst, as_user_id: an_1, captures: { cap_sd: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr_pd}/production-captures", payload: { cpt_code: "99213", units: 10, service_date: "2026-02-10", posting_date: "2026-03-02" }, as: CompAnalyst, as_user_id: an_1, captures: { cap_pd: $.data.id } }
          trigger:
            - { call: "POST /comp/production-captures/${cap_sd}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1, captures: { sd_period: $.data.credited_period, sd_wrvu: $.data.credited_wrvu } }
            - { call: "POST /comp/production-captures/${cap_pd}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1, captures: { pd_period: $.data.credited_period, pd_wrvu: $.data.credited_wrvu } }
          assert:
            - "ProductionCapture.${cap_sd}.credited_wrvu == 9.70 and ProductionCapture.${cap_pd}.credited_wrvu == 9.70 (identical rate math)"
            - "ProductionCapture.${cap_sd}.credited_period == \"2026-02\" (service_date month)"
            - "ProductionCapture.${cap_pd}.credited_period == \"2026-03\" (posting_date month) — same inputs, different period buckets"

      - name: quality_bonus_model_divergence
        grounds:
          - calculations.quality_bonus
          - entities.CompPlan.fields.quality_model
          - entities.QualityScorecard.fields.quality_bonus_cents
        distinguishing_aspect: |
          Identical scorecard measures pay 50000 cents under ALL_OR_NOTHING but 75000 cents under
          SLIDING_SCALE — a dual-variant split on the QualityScorecard domain (the other instance of
          this rule splits on the ProductionCapture domain).
        test_recipe:
          setup:
            - "Physician PH2 with EFFECTIVE agreements on PLAN_AON (quality_model=ALL_OR_NOTHING) and PLAN_SS (SLIDING_SCALE); both plans ACTIVE with quality_pool_cents=100000 and a 99213 rate"
            - "Scorecard on each agreement with measures M1(weight 50, threshold 80, score 80) and M2(weight 50, threshold 90, score 45)"
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000002", full_name: "Dr Quality", specialty: "FM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2019-06-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "AON Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan_aon: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan_aon}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan_aon}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan_aon}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan_aon}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/comp-plans", payload: { name: "SS Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: SLIDING_SCALE, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan_ss: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan_ss}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan_ss}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan_ss}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan_ss}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan_aon}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr_aon: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr_aon}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr_aon}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr_aon}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan_ss}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr_ss: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr_ss}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr_ss}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr_ss}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr_aon}/quality-scorecards", payload: { period: "2026-02", measures: [ { measure_code: "M1", weight: 50, threshold_score: 80, score: 80 }, { measure_code: "M2", weight: 50, threshold_score: 90, score: 45 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { sc_aon: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr_ss}/quality-scorecards", payload: { period: "2026-02", measures: [ { measure_code: "M1", weight: 50, threshold_score: 80, score: 80 }, { measure_code: "M2", weight: 50, threshold_score: 90, score: 45 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { sc_ss: $.data.id } }
          trigger:
            - { call: "POST /comp/quality-scorecards/${sc_aon}/finalize", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/quality-scorecards/${sc_ss}/finalize", payload: {}, as: CompAnalyst, as_user_id: an_1 }
          assert:
            - "QualityScorecard.${sc_aon}.quality_bonus_cents == 50000 (earned weight 50 of 100: M1 met at exactly 80>=80, M2 not met)"
            - "QualityScorecard.${sc_ss}.quality_bonus_cents == 75000 (earned weight 50 + 50*min(1,45/90)=75 of 100)"
            - "QualityScorecard.${sc_ss}.quality_bonus_cents - QualityScorecard.${sc_aon}.quality_bonus_cents == 25000 (identical inputs, divergent variants)"

  - rule_id: combinatorial_formula
    instances:
      - name: productivity_payout_tier_straddle_fte_proration
        grounds:
          - calculations.productivity_payout
          - entities.CompPlan.fields.tiers
          - entities.Physician.fields.fte
          - entities.CompStatement.fields.productivity_earned_ytd_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input formula (ytd wRVU x fte x tier table) with non-linear interaction —
          fte-prorated tier floors (nested min/max per tier) and marginal tier-rate selection.
          5000.00 wRVU at fte 0.8 straddles the prorated T1 cap (4000): 4000*4500 + 1000*5500.
        test_recipe:
          setup:
            - "ACTIVE plan with tiers T1(0,4500c,bonus 0) T2(5000,5500c,bonus 250000) T3(8000,6500c,bonus 500000); rate CPT 99285 = 5.00 wRVU"
            - "Physician fte 0.8 with EFFECTIVE agreement (base 24000000, draw 1000000, effective 2026-01-01)"
            - "One validated capture: 99285 x 1000 units served 2026-02-05 => credited 5000.00 wRVU in period 2026-02"
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000003", full_name: "Dr Parttime", specialty: "IM", provider_type: PHYSICIAN, fte: 0.8, hire_date: "2018-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Tier Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 }, { tier_code: T2, threshold_wrvu: 5000, conversion_factor_cents: 5500, tier_bonus_cents: 250000 }, { tier_code: T3, threshold_wrvu: 8000, conversion_factor_cents: 6500, tier_bonus_cents: 500000 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99285", wrvu_value: 5.0, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${phys}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements/${agr}/production-captures", payload: { cpt_code: "99285", units: 1000, service_date: "2026-02-05", posting_date: "2026-02-05" }, as: CompAnalyst, as_user_id: an_1, captures: { cap: $.data.id } }
            - { call: "POST /comp/production-captures/${cap}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1 }
          trigger:
            - { call: "POST /comp/physician-agreements/${agr}/comp-statements", payload: { period_year: 2026, period_month: 2 }, as: CompAnalyst, as_user_id: an_1, captures: { stmt: $.data.id } }
          assert:
            - "CompStatement.${stmt}.ytd_wrvu_at_close == 5000.00"
            - "CompStatement.${stmt}.productivity_earned_ytd_cents == 23500000 (4000*4500 + 1000*5500 at prorated floors 0/4000/6400)"
            - "CompStatement.${stmt}.tier_attained == \"T2\" (5000.00 >= 5000*0.8 = 4000, < 6400)"
            - "CompStatement.${stmt}.tier_bonus_cents == 250000 (first attainment of T2)"
            - "CompStatement.${stmt}.period_productivity_cents == 23500000 (no prior statements)"
            - "CompStatement.${stmt}.net_payment_cents == 22750000 (23500000 + 250000 + 0 + 0 - 1000000)"

      - name: supervision_credit_per_assignment_rounding
        grounds:
          - calculations.supervision_credit_allocation
          - entities.ProductionCapture.fields.capture_kind
          - entities.SupervisionAssignment.fields.credit_pct
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins round-per-assignment-then-sum.
          APP capture of 0.97 wRVU with two 0.3333-pct assignments credits each supervisor 0.32
          (round(0.97*0.3333,2)=0.32), total allocated 0.64; the rejected sum-then-round order
          would yield round(0.97*0.6666,2)=0.65.
        test_recipe:
          setup:
            - "ACTIVE plan with rate 99213=0.97; supervisors SUP1 and SUP2 (PHYSICIAN) and APP1 (provider_type APP) each with EFFECTIVE agreements on the plan"
            - "Two ACTIVE SupervisionAssignments for APP1: SUP1 credit_pct 0.3333 and SUP2 credit_pct 0.3333, both windows 2026-01-01..2026-12-31"
          setup_api_calls:
            - { call: "POST /comp/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /comp/physicians", payload: { npi: "1000000010", full_name: "Dr Sup One", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2015-01-01" }, as: SystemAdmin, captures: { sup1: $.data.id } }
            - { call: "POST /comp/physicians", payload: { npi: "1000000011", full_name: "Dr Sup Two", specialty: "FM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2016-01-01" }, as: SystemAdmin, captures: { sup2: $.data.id } }
            - { call: "POST /comp/physicians", payload: { npi: "1000000012", full_name: "NP App One", specialty: "APP-NP", provider_type: APP, fte: 1.0, hire_date: "2021-01-01" }, as: SystemAdmin, captures: { app1: $.data.id } }
            - { call: "POST /comp/comp-plans", payload: { name: "Sup Plan", fiscal_year_start: "2026-01-01", fiscal_year_end: "2026-12-31", credit_attribution_mode: SERVICE_DATE, quality_model: ALL_OR_NOTHING, quality_pool_cents: 100000, fmv_cap_cents: 90000000, tiers: [ { tier_code: T1, threshold_wrvu: 0, conversion_factor_cents: 4500, tier_bonus_cents: 0 } ] }, as: CompAnalyst, as_user_id: an_1, captures: { plan: $.data.id } }
            - { call: "POST /comp/comp-plans/${plan}/cpt-rates", payload: { cpt_code: "99213", wrvu_value: 0.97, effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/submit-review", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/comp-plans/${plan}/review-decision", payload: { decision: APPROVED }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/comp-plans/${plan}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${sup1}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr_sup1: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr_sup1}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr_sup1}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr_sup1}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${sup2}", plan_id: "${plan}", base_salary_cents: 24000000, period_draw_cents: 1000000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr_sup2: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr_sup2}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr_sup2}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 55 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr_sup2}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/physician-agreements", payload: { physician_id: "${app1}", plan_id: "${plan}", base_salary_cents: 12000000, period_draw_cents: 500000, effective_date: "2026-01-01" }, as: CompAnalyst, as_user_id: an_1, captures: { agr_app: $.data.id } }
            - { call: "POST /comp/physician-agreements/${agr_app}/submit-fmv", payload: {}, as: CompAnalyst, as_user_id: an_1 }
            - { call: "POST /comp/physician-agreements/${agr_app}/fmv-review", payload: { decision: APPROVED, benchmark_percentile: 40 }, as: ComplianceOfficer, as_user_id: co_1 }
            - { call: "POST /comp/physician-agreements/${agr_app}/activate", payload: {}, as: CompCommittee, as_user_id: cc_1 }
            - { call: "POST /comp/supervision-assignments", payload: { supervisor_physician_id: "${sup1}", app_physician_id: "${app1}", start_date: "2026-01-01", end_date: "2026-12-31", credit_pct: 0.3333, supervised_fte: 0.5 }, as: CompAnalyst, as_user_id: an_1, captures: { asg1: $.data.id } }
            - { call: "POST /comp/supervision-assignments", payload: { supervisor_physician_id: "${sup2}", app_physician_id: "${app1}", start_date: "2026-01-01", end_date: "2026-12-31", credit_pct: 0.3333, supervised_fte: 0.5 }, as: CompAnalyst, as_user_id: an_1, captures: { asg2: $.data.id } }
