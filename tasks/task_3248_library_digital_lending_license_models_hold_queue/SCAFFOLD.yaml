# =============================================================================
# SCAFFOLD.yaml — Library Digital Lending License Models & Hold Queue Management
# Difficulty target: beyond Expert (dense coupling across 13 entities, four
# license metering models, dual-variant fiscal + demand calculations, epoch
# checkpoint with auto-purchase cascades, consortium cost allocation).
# =============================================================================

scenario: |
  Library Digital Lending License Models & Hold Queue Management (OverDrive): publisher license models across one-copy-one-user, metered by time, metered by circulation and cost-per-circulation with different pricing, library collection budgeting and purchase decisions balancing license type against expected demand, hold queue management with ratio-based automatic purchasing rules and wait time targets, simultaneous use and skip-the-line collections for high-demand titles, patron authentication against library card systems with residency and card status validation, lending period, renewal and early return mechanics with automatic expiration, consortium sharing arrangements with cost allocation among member libraries, usage reporting and collection analysis

domain_name: library-digital-lending
api_prefix: /lending

complexity_profile:
  primary_archetype: quota_allocation        # finite license copies competed for by holds/loans
  secondary_archetype: pricing_engine        # four publisher license models with divergent pricing
  complexity_layers:
    - ops_run_checkpoint                     # run_epoch: expiry, promotion, auto-purchase sweep
    - dual_variant_calculation               # wait estimate (optimistic/pessimistic); fund availability (committed/actual)
    - cascading_side_effects                 # return/expire -> copy free -> hold promotion -> events
    - optimistic_concurrency                 # OCC on BudgetFund.version and Library.version
  entity_topology: hybrid                    # consortium tree + flat cross-references (loans/holds/events)
  state_machine_shape: cyclic                # Hold suspend/resume, Order revise, Invoice dispute loops
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # Loan references License+Patron+Hold across aggregates
  role_model: hierarchical_override          # ConsortiumAdmin superset over LibraryAdmin; Patron self-service
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Consortium
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Consortium display name" }
      - { name: cpc_discount_pct, type: number, source: input, default: 0.0, description: "Consortium-negotiated discount fraction applied to each cost-per-circ checkout charge; 0 <= x < 1" }
      - { name: host_share_floor_pct, type: number, source: input, default: 0.25, description: "Minimum fraction of a shared-title invoiced license cost borne by the purchasing (host) library; 0 <= x <= 1" }
      - { name: invoice_period, type: enum, source: input, default: "MONTHLY", description: "MONTHLY | QUARTERLY — cadence label for consortium invoices" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: Library
    parent: Consortium
    common_fields: true
    fields:
      - { name: consortium_id, type: string, source: system, description: "FK -> Consortium.id; owning consortium" }
      - { name: name, type: string, source: input, description: "Library display name" }
      - { name: residency_region_codes, type: array, source: input, description: "Array of postal codes eligible for card registration (residency rule)" }
      - { name: card_validity_days, type: integer, source: input, default: 730, description: "Days a patron card stays valid from registration" }
      - { name: max_concurrent_loans, type: integer, source: input, default: 10, description: "Per-patron cap on ACTIVE loans" }
      - { name: max_concurrent_holds, type: integer, source: input, default: 15, description: "Per-patron cap on holds in PLACED/READY/SUSPENDED" }
      - { name: loan_period_days, type: integer, source: input, default: 21, description: "Standard lending period in days" }
      - { name: renewal_period_days, type: integer, source: input, default: 21, description: "Days added to due_at per renewal" }
      - { name: max_renewals, type: integer, source: input, default: 2, description: "Max renewals per loan" }
      - { name: pickup_window_hours, type: integer, source: input, default: 72, description: "Hours a READY hold stays claimable" }
      - { name: skip_the_line_loan_days, type: integer, source: input, default: 7, description: "Loan days for skip-the-line checkouts (non-renewable)" }
      - { name: auto_purchase_enabled, type: boolean, source: input, default: false, description: "Whether run_epoch may auto-create purchase orders from hold pressure" }
      - { name: holds_per_copy_ratio, type: integer, source: input, default: 4, description: "Auto-purchase triggers when active_holds / available_copies >= this ratio" }
      - { name: wait_target_days, type: integer, source: input, default: 28, description: "Auto-purchase also requires pessimistic wait estimate strictly greater than this target" }
      - { name: auto_purchase_max_cents, type: integer, source: input, default: 10000, description: "Per-order spend ceiling for automatic purchases" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: BudgetFund
    parent: Library
    common_fields: true
    fields:
      - { name: library_id, type: string, source: system, description: "FK -> Library.id; owning library" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year label (e.g. 2026)" }
      - { name: period_start, type: datetime, source: input, description: "Fiscal period start, inclusive" }
      - { name: period_end, type: datetime, source: input, description: "Fiscal period end, exclusive; half-open interval [period_start, period_end)" }
      - { name: budget_cents, type: integer, source: input, description: "Total appropriation for the period" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Sum of estimated_cost_cents over this fund's orders in APPROVED status" }
      - { name: spent_cents, type: integer, source: computed, default: 0, description: "Sum of invoiced_cost_cents over this fund's orders in FULFILLED status" }
      - { name: cpc_accrued_cents, type: integer, source: computed, default: 0, description: "Sum of circ_price_charged_cents over COST_PER_CIRC CHECKOUT events by this library's patrons with checkout_at inside [period_start, period_end)" }
      - { name: available_committed_cents, type: integer, source: computed, description: "= budget_cents - committed_cents - spent_cents - cpc_accrued_cents (forward-looking variant)" }
      - { name: available_actual_cents, type: integer, source: computed, description: "= budget_cents - spent_cents - cpc_accrued_cents (actuals-only variant)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }

  - name: Patron
    parent: Library
    common_fields: true
    fields:
      - { name: library_id, type: string, source: system, description: "FK -> Library.id; home library that issued the card" }
      - { name: external_card_number, type: string, source: input, description: "Card number from the library's ILS; unique within the home library" }
      - { name: full_name, type: string, source: input, description: "Patron display name" }
      - { name: postal_code, type: string, source: input, description: "Residential postal code; must be an element of library.residency_region_codes at registration" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXPIRED" }
      - { name: card_expires_at, type: datetime, source: computed, description: "= registration created_at date + library.card_validity_days" }
      - { name: active_loan_count, type: integer, source: computed, default: 0, description: "Count of this patron's loans in ACTIVE status" }
      - { name: active_hold_count, type: integer, source: computed, default: 0, description: "Count of this patron's holds in PLACED, READY, or SUSPENDED status" }

  - name: Title
    parent: Consortium
    common_fields: true
    fields:
      - { name: consortium_id, type: string, source: system, description: "FK -> Consortium.id; catalog scope" }
      - { name: isbn, type: string, source: input, description: "ISBN-13; unique within the consortium" }
      - { name: name, type: string, source: input, description: "Title name" }
      - { name: author, type: string, source: input, description: "Author name" }
      - { name: sharing_scope, type: enum, source: input, default: "LOCAL_ONLY", description: "LOCAL_ONLY | CONSORTIUM — whether member libraries' patrons may borrow licenses of this title" }
      - { name: skip_the_line_enabled, type: boolean, source: input, default: false, description: "Whether skip-the-line (lucky-day) checkouts are allowed for this title" }
      - { name: simultaneous_use_allowed, type: boolean, source: input, default: false, description: "Whether SIMULTANEOUS_USE licenses may be purchased for this title" }
      - { name: price_ocou_cents, type: integer, source: input, description: "Perpetual one-copy-one-user price per copy" }
      - { name: metered_time_price_cents, type: integer, source: input, description: "Metered-by-time license price (per copy, unlimited circs until expiry)" }
      - { name: metered_time_days, type: integer, source: input, description: "Validity days of a metered-by-time license from activation" }
      - { name: metered_circ_price_cents, type: integer, source: input, description: "Metered-by-circulation license price (fixed circ count)" }
      - { name: metered_circ_count, type: integer, source: input, description: "Circulations granted by a metered-by-circulation license" }
      - { name: cpc_price_per_circ_cents, type: integer, source: input, description: "List price charged per checkout under the cost-per-circulation model" }
      - { name: simultaneous_use_price_cents, type: integer, source: input, description: "Simultaneous-use license price (unlimited concurrent loans until expiry)" }
      - { name: simultaneous_use_days, type: integer, source: input, description: "Validity days of a simultaneous-use license from activation" }

  - name: License
    parent: Title
    common_fields: true
    fields:
      - { name: title_id, type: string, source: system, description: "FK -> Title.id; licensed title" }
      - { name: library_id, type: string, source: system, description: "FK -> Library.id; purchasing (host) library" }
      - { name: acquisition_order_id, type: string, source: system, description: "FK -> AcquisitionOrder.id; order whose fulfillment created this license" }
      - { name: model, type: enum, source: system, description: "OCOU | METERED_TIME | METERED_CIRC | COST_PER_CIRC | SIMULTANEOUS_USE — copied from the order" }
      - { name: copies_total, type: integer, source: system, description: "OCOU: number of lendable copies; other models: 1 (logical)" }
      - { name: copies_on_loan, type: integer, source: computed, default: 0, description: "OCOU: count of ACTIVE loans against this license; 0 for other models" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock time at order fulfillment" }
      - { name: expires_at, type: datetime, source: system, description: "METERED_TIME: activated_at + title.metered_time_days; SIMULTANEOUS_USE: activated_at + title.simultaneous_use_days; OCOU/METERED_CIRC/COST_PER_CIRC: null" }
      - { name: circs_total, type: integer, source: system, description: "METERED_CIRC: title.metered_circ_count at purchase; other models: null" }
      - { name: circs_consumed, type: integer, source: computed, default: 0, description: "METERED_CIRC: checkouts consumed (net of grace-period returns); other models: null" }
      - { name: balance_cents, type: integer, source: system, description: "COST_PER_CIRC: prepaid balance, decremented per checkout by the discounted charge; other models: null" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | EXHAUSTED | RETIRED" }

  - name: Hold
    parent: Title
    common_fields: true
    fields:
      - { name: title_id, type: string, source: system, description: "FK -> Title.id; title being awaited" }
      - { name: patron_id, type: string, source: system, description: "FK -> Patron.id; waiting patron" }
      - { name: library_id, type: string, source: system, description: "FK -> Library.id; patron's home library at placement" }
      - { name: status, type: enum, source: system, description: "PLACED | READY | SUSPENDED | FULFILLED | EXPIRED | CANCELLED" }
      - { name: placed_at, type: datetime, source: system, description: "Logical time of placement; queue rank key (suspend/resume keeps original placed_at)" }
      - { name: ready_since, type: datetime, source: system, description: "Logical time the hold was promoted to READY; null until promotion" }
      - { name: ready_until, type: datetime, source: computed, description: "= ready_since + library.pickup_window_hours; null until promotion" }
      - { name: suspension_count, type: integer, source: system, default: 0, description: "Number of PLACED->SUSPENDED transitions" }
      - { name: optimistic_wait_days, type: integer, source: computed, description: "Wait estimate, optimistic variant (see calculations.wait_estimate)" }
      - { name: pessimistic_wait_days, type: integer, source: computed, description: "Wait estimate, pessimistic variant (see calculations.wait_estimate)" }

  - name: Loan
    parent: License
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id; license (copy) occupied by this loan" }
      - { name: patron_id, type: string, source: system, description: "FK -> Patron.id; borrowing patron" }
      - { name: hold_id, type: string, source: system, description: "FK -> Hold.id; originating hold when claimed, null for direct or skip-the-line checkout" }
      - { name: is_skip_the_line, type: boolean, source: system, default: false, description: "True when checked out via the skip-the-line path" }
      - { name: checkout_at, type: datetime, source: system, description: "Logical time of checkout" }
      - { name: due_at, type: datetime, source: computed, description: "= checkout_at + loan days (skip_the_line_loan_days when is_skip_the_line, else loan_period_days), clamped to license.expires_at for METERED_TIME and SIMULTANEOUS_USE models" }
      - { name: returned_at, type: datetime, source: system, description: "Logical time of early return; null until returned" }
      - { name: renewals_used, type: integer, source: system, default: 0, description: "Renewals consumed so far" }
      - { name: circ_price_charged_cents, type: integer, source: system, default: 0, description: "COST_PER_CIRC: discounted charge deducted at checkout; 0 for other models" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETURNED | EXPIRED" }

  - name: AcquisitionOrder
    parent: Library
    common_fields: true
    fields:
      - { name: library_id, type: string, source: system, description: "FK -> Library.id; purchasing library" }
      - { name: budget_fund_id, type: string, source: system, description: "FK -> BudgetFund.id; fund this order charges" }
      - { name: title_id, type: string, source: system, description: "FK -> Title.id; title being purchased" }
      - { name: model, type: enum, source: input, description: "OCOU | METERED_TIME | METERED_CIRC | COST_PER_CIRC | SIMULTANEOUS_USE" }
      - { name: copies, type: integer, source: input, default: 1, description: "OCOU: copy count >= 1; other models must be 1" }
      - { name: prepaid_balance_cents, type: integer, source: input, description: "COST_PER_CIRC only: prepaid balance loaded onto the license; null for other models" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "OCOU: copies * title.price_ocou_cents; METERED_TIME: title.metered_time_price_cents; METERED_CIRC: title.metered_circ_price_cents; COST_PER_CIRC: prepaid_balance_cents; SIMULTANEOUS_USE: title.simultaneous_use_price_cents" }
      - { name: invoiced_cost_cents, type: integer, source: input, description: "Actual invoiced amount recorded at fulfillment" }
      - { name: origin, type: enum, source: system, default: "MANUAL", description: "MANUAL | AUTO_RATIO — AUTO_RATIO orders are created APPROVED by run_epoch and fulfilled immediately" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | APPROVED | REJECTED | FULFILLED | CANCELLED" }

  - name: ConsortiumInvoice
    parent: Consortium
    common_fields: true
    fields:
      - { name: consortium_id, type: string, source: system, description: "FK -> Consortium.id; billed consortium" }
      - { name: period_start, type: datetime, source: input, description: "Billing period start, inclusive" }
      - { name: period_end, type: datetime, source: input, description: "Billing period end, exclusive; half-open [period_start, period_end)" }
      - { name: lines, type: array, source: computed, description: "Array of { library_id, share_cents } — per-member allocation (see calculations.consortium_allocation); one line per library with nonzero share" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of lines[].share_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | DISPUTED | SETTLED" }

  - name: CirculationEvent
    parent: null
    common_fields: false
    fields:
      - { name: library_id, type: string, source: system, description: "FK -> Library.id; library the event is attributed to (patron's home library for circulation; purchasing library for PURCHASE)" }
      - { name: title_id, type: string, source: system, description: "FK -> Title.id; title involved" }
      - { name: patron_id, type: string, source: system, description: "FK -> Patron.id; patron involved; null for PURCHASE events" }
      - { name: loan_id, type: string, source: system, description: "FK -> Loan.id; loan involved; null when not applicable" }
      - { name: hold_id, type: string, source: system, description: "FK -> Hold.id; hold involved; null when not applicable" }
      - { name: license_id, type: string, source: system, description: "FK -> License.id; license involved; null when not applicable" }
      - { name: event_type, type: enum, source: system, description: "CHECKOUT | RENEW | RETURN | LOAN_EXPIRED | HOLD_PLACED | HOLD_READY | HOLD_FULFILLED | HOLD_EXPIRED | HOLD_CANCELLED | PURCHASE" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock time the event fired" }
      - { name: charge_cents, type: integer, source: system, default: 0, description: "CPC discounted charge for CHECKOUT on COST_PER_CIRC; invoiced cost for PURCHASE; 0 otherwise" }

  - name: UsageSnapshot
    parent: Library
    common_fields: true
    fields:
      - { name: library_id, type: string, source: system, description: "FK -> Library.id; reporting library" }
      - { name: period_start, type: datetime, source: input, description: "Report window start, inclusive" }
      - { name: period_end, type: datetime, source: input, description: "Report window end, exclusive" }
      - { name: generated_at, type: datetime, source: system, description: "Logical time the snapshot was generated" }
      - { name: checkouts_by_model, type: object, source: computed, description: "Map model -> count of CHECKOUT events in window for this library (keys: OCOU, METERED_TIME, METERED_CIRC, COST_PER_CIRC, SIMULTANEOUS_USE)" }
      - { name: cpc_spend_cents, type: integer, source: computed, description: "Sum of charge_cents over COST_PER_CIRC CHECKOUT events in window" }
      - { name: holds_filled, type: integer, source: computed, description: "Count of HOLD_FULFILLED events in window" }
      - { name: avg_fulfillment_wait_days, type: number, source: computed, description: "round_half_up(mean over HOLD_FULFILLED events of (fulfilled occurred_at - hold.placed_at) in days, 2 decimals); 0 when holds_filled == 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Patron
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /lending/patrons/{id}/suspend"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals patron.library_id"
        side_effects:
          - "increments Patron.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /lending/patrons/{id}/reinstate"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals patron.library_id"
          - "card_expires_at > current logical time (else ERR_CARD_EXPIRED)"
        side_effects:
          - "increments Patron.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run_epoch: card_expires_at <= current logical time)"
        actor: system
        preconditions: []
        side_effects:
          - "all of this patron's PLACED/SUSPENDED holds -> CANCELLED (no copy release, no promotion)"
          - "all of this patron's READY holds -> EXPIRED, each releasing its reserved copy and triggering hold promotion for the affected title (see hold promotion cascade)"
          - "increments Patron.version by 1"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (run_epoch: card_expires_at <= current logical time)"
        actor: system
        preconditions: []
        side_effects:
          - "same hold-side effects as ACTIVE -> EXPIRED"
          - "increments Patron.version by 1"

  - entity: Hold
    initial_state: PLACED
    terminal_states: [FULFILLED, EXPIRED, CANCELLED]
    transitions:
      - from: PLACED
        to: READY
        trigger: "system (hold promotion: a copy of the title becomes available for this hold's eligibility set)"
        actor: system
        preconditions:
          - "this hold is the highest-ranked eligible candidate per the promotion selector (eligible: status PLACED, patron home library == freed license's library OR title.sharing_scope == CONSORTIUM; rank: placed_at ASC, tie-break created_at ASC)"
        side_effects:
          - "ready_since = current logical time; ready_until = ready_since + library.pickup_window_hours"
          - "the freed copy is reserved for this hold (OCOU: copies_on_loan unchanged but the copy is earmarked; no other promotion or direct checkout may take it)"
          - "writes CirculationEvent HOLD_READY"
          - "recomputes optimistic_wait_days / pessimistic_wait_days for remaining PLACED holds on the title"
          - "increments Hold.version by 1"
      - from: PLACED
        to: SUSPENDED
        trigger: "POST /lending/holds/{id}/suspend"
        actor: Patron
        preconditions:
          - "acting Patron's X-User-ID equals hold.patron_id"
        side_effects:
          - "suspension_count += 1"
          - "increments Hold.version by 1"
      - from: SUSPENDED
        to: PLACED
        trigger: "POST /lending/holds/{id}/resume"
        actor: Patron
        preconditions:
          - "acting Patron's X-User-ID equals hold.patron_id"
        side_effects:
          - "placed_at is preserved (queue rank unchanged)"
          - "increments Hold.version by 1"
      - from: READY
        to: FULFILLED
        trigger: "POST /lending/holds/{id}/claim"
        actor: Patron
        preconditions:
          - "acting Patron's X-User-ID equals hold.patron_id"
          - "patron.status == ACTIVE and card_expires_at > now (ERR_PATRON_NOT_ACTIVE / ERR_CARD_EXPIRED)"
          - "patron.active_loan_count < library.max_concurrent_loans (ERR_LOAN_LIMIT_EXCEEDED)"
          - "current logical time < ready_until (else the hold is epoch-expirable; claim rejected with ERR_HOLD_NOT_ACTIONABLE)"
        side_effects:
          - "creates Loan on the reserved license (hold_id set, is_skip_the_line false); for COST_PER_CIRC deducts the discounted charge and sets loan.circ_price_charged_cents"
          - "writes CirculationEvent HOLD_FULFILLED and CHECKOUT"
          - "patron.active_hold_count -= 1; patron.active_loan_count += 1"
          - "increments Hold.version by 1"
      - from: READY
        to: EXPIRED
        trigger: "system (run_epoch: ready_until <= current logical time)"
        actor: system
        preconditions: []
        side_effects:
          - "reserved copy released -> immediately re-runs hold promotion for the title (next eligible PLACED hold -> READY; depth-2 cascade within the epoch)"
          - "writes CirculationEvent HOLD_EXPIRED"
          - "patron.active_hold_count -= 1"
          - "increments Hold.version by 1"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /lending/holds/{id}/cancel"
        actor: Patron
        preconditions:
          - "acting Patron's X-User-ID equals hold.patron_id"
        side_effects:
          - "writes CirculationEvent HOLD_CANCELLED"
          - "patron.active_hold_count -= 1"
          - "increments Hold.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /lending/holds/{id}/cancel"
        actor: Patron
        preconditions:
          - "acting Patron's X-User-ID equals hold.patron_id"
        side_effects:
          - "writes CirculationEvent HOLD_CANCELLED"
          - "patron.active_hold_count -= 1"
          - "increments Hold.version by 1"
      - from: READY
        to: CANCELLED
        trigger: "POST /lending/holds/{id}/cancel"
        actor: Patron
        preconditions:
          - "acting Patron's X-User-ID equals hold.patron_id"
        side_effects:
          - "reserved copy released -> re-runs hold promotion for the title"
          - "writes CirculationEvent HOLD_CANCELLED"
          - "patron.active_hold_count -= 1"
          - "increments Hold.version by 1"

  - entity: Loan
    initial_state: ACTIVE
    terminal_states: [RETURNED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /lending/loans/{id}/renew"
        actor: Patron
        preconditions:
          - "acting Patron's X-User-ID equals loan.patron_id"
          - "patron.status == ACTIVE (ERR_PATRON_NOT_ACTIVE)"
          - "loan.is_skip_the_line == false (ERR_RENEWAL_LIMIT_REACHED)"
          - "loan.renewals_used < library.max_renewals (ERR_RENEWAL_LIMIT_REACHED)"
          - "no holds on the title in PLACED/READY/SUSPENDED by any patron (ERR_RENEWAL_BLOCKED_BY_HOLDS)"
          - "current logical time < loan.due_at (ERR_LOAN_NOT_ACTIVE when already epoch-expired; renewal after due is impossible)"
          - "METERED_TIME / SIMULTANEOUS_USE licenses: loan.due_at + library.renewal_period_days <= license.expires_at (ERR_RENEWAL_BEYOND_LICENSE_TERM)"
        side_effects:
          - "due_at = due_at + library.renewal_period_days (additive from the current due date, never from now)"
          - "renewals_used += 1"
          - "renewal consumes no METERED_CIRC circ and charges no CPC fee"
          - "writes CirculationEvent RENEW"
          - "increments Loan.version by 1"
        note: "self-loop: renewal keeps the loan ACTIVE while mutating due_at and renewals_used"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /lending/loans/{id}/return"
        actor: Patron
        preconditions:
          - "acting Patron's X-User-ID equals loan.patron_id"
        side_effects:
          - "returned_at = current logical time"
          - "OCOU: license.copies_on_loan -= 1"
          - "METERED_CIRC grace: if returned within 2 hours of checkout_at, license.circs_consumed -= 1 (accidental-checkout protection)"
          - "patron.active_loan_count -= 1"
          - "cascade: the freed copy triggers hold promotion for the title (oldest eligible PLACED hold -> READY), which itself stamps ready_since/ready_until and recomputes the remaining queue's wait estimates"
          - "writes CirculationEvent RETURN"
          - "increments Loan.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run_epoch: due_at <= current logical time)"
        actor: system
        preconditions: []
        side_effects:
          - "OCOU: license.copies_on_loan -= 1"
          - "patron.active_loan_count -= 1"
          - "cascade: freed copy triggers hold promotion for the title (same chain as early return)"
          - "writes CirculationEvent LOAN_EXPIRED"
          - "increments Loan.version by 1"

  - entity: License
    initial_state: ACTIVE
    terminal_states: [EXPIRED, EXHAUSTED, RETIRED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run_epoch: METERED_TIME or SIMULTANEOUS_USE license with expires_at <= current logical time)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade: title availability drops -> wait estimates recomputed; if a library's auto-purchase rule now fires (ratio and wait target), run_epoch creates an AUTO_RATIO AcquisitionOrder in APPROVED status and fulfills it, creating a replacement License, which in turn triggers hold promotion"
          - "increments License.version by 1"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (run_epoch: METERED_CIRC license with circs_consumed >= circs_total, or COST_PER_CIRC license with balance_cents < the discounted per-circ charge)"
        actor: system
        preconditions: []
        side_effects:
          - "increments License.version by 1"
        note: "depletion is observed at the epoch, not mid-checkout: an ACTIVE CPC license whose balance can no longer cover a charge stays selectable and fails at the charge step with ERR_LICENSE_BALANCE_DEPLETED until the next epoch retires it"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /lending/licenses/{id}/retire"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals license.library_id"
          - "no ACTIVE loans against this license (ERR_LICENSE_IN_USE)"
        side_effects:
          - "increments License.version by 1"

  - entity: AcquisitionOrder
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /lending/acquisition-orders/{id}/propose"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals order.library_id"
        side_effects:
          - "increments AcquisitionOrder.version by 1"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /lending/acquisition-orders/{id}/approve"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals order.library_id"
          - "budget_fund.status == OPEN (ERR_FUND_CLOSED)"
          - "current logical time inside [fund.period_start, fund.period_end) (ERR_ORDER_OUTSIDE_FISCAL_PERIOD)"
          - "order.estimated_cost_cents <= fund.available_committed_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "fund.committed_cents += estimated_cost_cents; increments BudgetFund.version by 1"
          - "increments AcquisitionOrder.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /lending/acquisition-orders/{id}/reject"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals order.library_id"
        side_effects:
          - "increments AcquisitionOrder.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /lending/acquisition-orders/{id}/revise"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals order.library_id"
        side_effects:
          - "model/copies/prepaid_balance_cents may be updated by the revise payload; estimated_cost_cents recomputed"
          - "increments AcquisitionOrder.version by 1"
        note: "revision cycle: REJECTED orders loop back to DRAFT for resubmission"
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /lending/acquisition-orders/{id}/fulfill"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals order.library_id"
          - "budget_fund.status == OPEN (ERR_FUND_CLOSED)"
        side_effects:
          - "creates License (status ACTIVE, activated_at = now, model/copies/balance from order; expires_at per model)"
          - "fund.committed_cents -= estimated_cost_cents; fund.spent_cents += invoiced_cost_cents; increments BudgetFund.version by 1"
          - "writes CirculationEvent PURCHASE with charge_cents = invoiced_cost_cents"
          - "cascade: new license availability triggers hold promotion for the title"
          - "increments AcquisitionOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /lending/acquisition-orders/{id}/cancel"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals order.library_id"
        side_effects:
          - "increments AcquisitionOrder.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /lending/acquisition-orders/{id}/cancel"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals order.library_id"
        side_effects:
          - "increments AcquisitionOrder.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /lending/acquisition-orders/{id}/cancel"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals order.library_id"
        side_effects:
          - "compensation: fund.committed_cents -= estimated_cost_cents; increments BudgetFund.version by 1"
          - "increments AcquisitionOrder.version by 1"

  - entity: BudgetFund
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /lending/budget-funds/{id}/close"
        actor: LibraryAdmin
        preconditions:
          - "acting LibraryAdmin's X-User-ID equals fund.library_id"
          - "no orders on this fund in APPROVED status (ERR_FUND_HAS_OPEN_COMMITMENTS)"
        side_effects:
          - "increments BudgetFund.version by 1"

  - entity: ConsortiumInvoice
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /lending/consortium-invoices/{id}/issue"
        actor: ConsortiumAdmin
        preconditions:
          - "invoice.status == DRAFT or DISPUTED (else ERR_INVOICE_INVALID_STATE)"
        side_effects:
          - "increments ConsortiumInvoice.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /lending/consortium-invoices/{id}/dispute"
        actor: LibraryAdmin
        preconditions:
          - "invoice.status == ISSUED (else ERR_INVOICE_INVALID_STATE)"
          - "acting LibraryAdmin's X-User-ID equals the id of any member library of the invoice's consortium"
        side_effects:
          - "increments ConsortiumInvoice.version by 1"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /lending/consortium-invoices/{id}/issue"
        actor: ConsortiumAdmin
        preconditions:
          - "invoice.status == DISPUTED (else ERR_INVOICE_INVALID_STATE)"
        side_effects:
          - "lines recomputed from current event data before re-issue"
          - "increments ConsortiumInvoice.version by 1"
        note: "dispute cycle: ISSUED -> DISPUTED -> ISSUED until settled"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /lending/consortium-invoices/{id}/settle"
        actor: ConsortiumAdmin
        preconditions:
          - "invoice.status == ISSUED (else ERR_INVOICE_INVALID_STATE)"
        side_effects:
          - "increments ConsortiumInvoice.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: order-create-stale-fund
    parent_entity: BudgetFund
    write_endpoint: "POST /lending/acquisition-orders"
    occ_field: "expected_budget_fund_version"
    description: |
      Creating an AcquisitionOrder against a BudgetFund whose version has
      advanced since the client last observed it is rejected. Order creation
      itself increments BudgetFund.version, and approvals/fulfillments/auto-
      purchase sweeps also advance it; a client carrying an older version has
      a stale view of the fund's committed/spent ledger.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412
  - rule_id: library-policy-update-stale
    parent_entity: Library
    write_endpoint: "PATCH /lending/libraries/{id}"
    occ_field: "expected_library_version"
    description: |
      Updating a Library's policy configuration (caps, periods, auto-purchase
      thresholds) with an expected_library_version older than the library's
      current version is rejected; any prior policy mutation or system touch
      of the row has already advanced the version the client observed.
    error_id: ERR_STALE_LIBRARY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: license_copy_availability
    trigger: "checkout, claim, return, loan expiry, license creation/retirement"
    algorithm: aggregation
    formula: |
      For an OCOU license:
        copies_on_loan = count of ACTIVE loans with loan.license_id == license.id
        copies_available = copies_total - copies_on_loan - copies_reserved_for_ready_holds
        where copies_reserved_for_ready_holds = count of READY holds whose reserved
        copy belongs to this license.
      A copy is lendable iff copies_available >= 1.
    input_set: "loans in ACTIVE status on this license; holds in READY status reserved against this license"
    precision: "integer"

  - name: checkout_charge_cpc
    trigger: "any checkout (direct, claim, or skip-the-line) that selects a COST_PER_CIRC license"
    algorithm: aggregation
    formula: |
      discounted_charge = round_half_up(license.title.cpc_price_per_circ_cents
                                        * (1 - consortium.cpc_discount_pct))
      # PINNED ROUNDING ORDER: round per checkout event, then accumulate.
      # License balance and fund accrual sum already-rounded per-event charges;
      # the fractional product is NEVER carried across events.
      license.balance_cents -= discounted_charge
      loan.circ_price_charged_cents = discounted_charge
      fund(patron.library_id, period containing checkout_at).cpc_accrued_cents += discounted_charge
      # depletion is NOT flipped here; run_epoch retires depleted licenses (see §1.2 License)
    input_set: "the single selected COST_PER_CIRC license; its title; the title's consortium"
    constants:
      ROUNDING: "per-event, round_half_up to integer cents, then sum"
    precision: "integer cents, round_half_up applied per checkout event"
    variants:
      - name: per_event_rounding
        when: "always — this is the pinned production rule"
        difference: "round each checkout charge to cents before deducting; per-event totals can differ by cents from a sum-then-round alternative"

  - name: wait_estimate
    trigger: "hold placement, promotion, cancellation, expiry; copy availability change; read of GET /lending/titles/{id}/availability"
    algorithm: forward_looking
    formula: |
      For a title at a patron's home library, with H = number of holds ahead of the
      subject hold (status PLACED or SUSPENDED, placed_at strictly earlier; ties by
      created_at ASC) and C = effective lendable copies =
        sum(copies_total of ACTIVE OCOU licenses visible to this library)
        + count of ACTIVE METERED_CIRC licenses with circs_consumed < circs_total
        + count of ACTIVE METERED_TIME licenses with expires_at > now,
      with C floored at 1:
        optimistic_wait_days  = ceil(H / C) * library.loan_period_days
        pessimistic_wait_days = ceil(H / C) * (library.loan_period_days
                                               + library.max_renewals * library.renewal_period_days)
      SIMULTANEOUS_USE licenses never queue (unlimited copies) and are excluded from C.
    input_set: "holds on the title in PLACED/SUSPENDED status; ACTIVE licenses of the title visible to the hold's library (own library, or any member when title.sharing_scope == CONSORTIUM)"
    precision: "integer days, ceil"
    variants:
      - name: optimistic
        when: "assumes every current loan is returned or expires at its first due date with no renewals"
        difference: "multiplies queue cycles by loan_period_days only"
      - name: pessimistic
        when: "assumes every loan is renewed the maximum number of times"
        difference: "multiplies queue cycles by loan_period_days + max_renewals * renewal_period_days; always >= optimistic and strictly greater whenever max_renewals > 0 and H > 0"

  - name: fund_availability
    trigger: "order approve (committed variant), order cancel/fulfill, CPC checkout accrual, fund read"
    algorithm: aggregation
    formula: |
      committed_cents = sum(estimated_cost_cents) over this fund's orders in APPROVED status
      spent_cents      = sum(invoiced_cost_cents) over this fund's orders in FULFILLED status
      cpc_accrued_cents = sum(charge_cents) over COST_PER_CIRC CHECKOUT CirculationEvents
                          attributed to this library with occurred_at in [period_start, period_end)
      available_committed_cents = budget_cents - committed_cents - spent_cents - cpc_accrued_cents
      available_actual_cents    = budget_cents - spent_cents - cpc_accrued_cents
    input_set: "orders in APPROVED (committed) or FULFILLED (spent) status on this fund; CPC CHECKOUT events in the fund's period"
    precision: "integer cents"
    variants:
      - name: committed
        when: "budget gate at order approval — the fiscally conservative view"
        difference: "subtracts committed (approved-but-unfulfilled) estimates"
      - name: actual
        when: "post-period reporting — actuals-only view"
        difference: "ignores commitments; identical inputs yield available_actual_cents >= available_committed_cents, strictly greater whenever any APPROVED order exists"

  - name: auto_purchase_decision
    trigger: "run_epoch sweep, for each library with auto_purchase_enabled and each title with PLACED/SUSPENDED holds at that library"
    algorithm: threshold
    formula: |
      Let holds_count = count of the library's holds on the title in PLACED or SUSPENDED,
      C = effective lendable copies as in wait_estimate,
      pessimistic = wait_estimate.pessimistic_wait_days for the newest such hold.
      Fire only when ALL of:
        (1) holds_count / max(C,1) >= library.holds_per_copy_ratio   (integer division NOT applied; real-valued comparison)
        (2) pessimistic > library.wait_target_days                   (strictly greater)
        (3) library.status == ACTIVE and consortium.status == ACTIVE
      Then:
        needed  = ceil(holds_count / library.holds_per_copy_ratio) - C
        if needed <= 0: skip
        candidate_copies = needed, priced at title.price_ocou_cents per copy
        if candidate_copies * title.price_ocou_cents > library.auto_purchase_max_cents:
            candidate_copies = floor(library.auto_purchase_max_cents / title.price_ocou_cents)
        if candidate_copies <= 0: skip
        estimated = candidate_copies * title.price_ocou_cents
        fund = the library's OPEN BudgetFund whose [period_start, period_end) contains now
        if fund is missing or estimated > fund.available_committed_cents: skip
        else: create AcquisitionOrder(origin=AUTO_RATIO, model=OCOU, copies=candidate_copies,
              status=APPROVED) and fulfill it in the same epoch at
              invoiced_cost_cents = estimated, creating the License and triggering promotion.
    input_set: "libraries with auto_purchase_enabled == true; their titles with PLACED/SUSPENDED holds; OPEN budget funds"
    constants:
      BOUNDARY: "ratio comparison is >= (holds exactly at the ratio DO trigger); wait comparison is > (pessimistic exactly equal to the target does NOT trigger)"
    precision: "integer copies; real-valued ratio comparison"

  - name: consortium_allocation
    trigger: "consortium invoice generation (and re-issue after dispute)"
    algorithm: waterfall_allocation
    formula: |
      For each FULFILLED AcquisitionOrder whose title.sharing_scope == CONSORTIUM
      and whose fulfillment occurred within [period_start, period_end):
        T = order.invoiced_cost_cents
        host = order.library_id
        counts[l] = number of CHECKOUT CirculationEvents on licenses created from this
                    order's title, attributed to library l, occurred_at in the window.
        host_floor = round_half_up(T * consortium.host_share_floor_pct)
        share[host] = max(round_half_up(T * counts[host] / max(total_counts,1)), host_floor)
        remainder = T - share[host]
        non_host = [libraries l != host with counts[l] > 0], sorted by counts DESC,
                   tie-break member library created_at ASC
        raw[l] = remainder * counts[l] / sum(counts over non_host)
        share[l] = round_half_up(raw[l]) for each non_host library
        residual = remainder - sum(share over non_host)
        if residual != 0: share[first library in non_host order] += residual
        # If no non-host library has checkouts: host absorbs the full T.
      Additionally, every CPC CHECKOUT in the window adds its charge_cents to the
      borrowing patron's home library line (not the license host's).
      Invoice lines = per-library sums of all shares + CPC charges; omit zero lines.
    input_set: "FULFILLED orders on CONSORTIUM-scope titles fulfilled within the window; CHECKOUT events within the window"
    precision: "integer cents, round_half_up; residual cents to the largest non-host sharer"
    variants:
      - name: floor_binding
        when: "host usage share falls below consortium.host_share_floor_pct"
        difference: "host pays the floor and the remainder pool shrinks, so non-host shares are computed on T - floor rather than on T"

  - name: renewal_due_date
    trigger: "POST /lending/loans/{id}/renew after all renewal preconditions pass"
    algorithm: chronological
    formula: |
      new_due_at = loan.due_at + library.renewal_period_days
      # Additive from the current due date, never from now: renewing early does not
      # extend the loan beyond due_at + renewal_period_days.
      # METERED_TIME / SIMULTANEOUS_USE: require new_due_at <= license.expires_at
      # (checked as a precondition before this calculation runs).
    input_set: "the single ACTIVE loan; its patron's home library policy"
    precision: "datetime, second precision"

  - name: usage_snapshot_rollup
    trigger: "POST /lending/libraries/{id}/usage-snapshots"
    algorithm: chronological
    formula: |
      Events replayed in occurred_at ASC order, tie-break created_at ASC, restricted to
      CirculationEvents with library_id == snapshot.library_id and occurred_at in
      [period_start, period_end):
        checkouts_by_model[m] = count of CHECKOUT events whose loan's license.model == m
        cpc_spend_cents = sum(charge_cents) over CHECKOUT events on COST_PER_CIRC licenses
        holds_filled = count of HOLD_FULFILLED events
        avg_fulfillment_wait_days = round_half_up(
            mean over HOLD_FULFILLED events of (event.occurred_at - hold.placed_at) in days, 2)
        avg_fulfillment_wait_days = 0 when holds_filled == 0
    input_set: "CirculationEvents for the library in the half-open window"
    precision: "counts integer; avg 2 decimals, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: auth
    check: "request body well-formed: required fields present, value types correct, enum members recognized, no nulls in required positions"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint per §1.5 roles; entity_backed roles must also satisfy ownership (LibraryAdmin X-User-ID == the library id being acted on; Patron X-User-ID == the patron id owning the resource)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "path-template ids resolve, validated left-to-right (consortium before library before child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids; entity-specific variants ERR_LIBRARY_NOT_FOUND, ERR_PATRON_NOT_FOUND, ERR_TITLE_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ERR_HOLD_NOT_FOUND, ERR_LOAN_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_FUND_NOT_FOUND, ERR_INVOICE_NOT_FOUND"
  - priority: 4
    category: existence
    check: "body-supplied foreign keys (library_id, budget_fund_id, title_id, patron_id) resolve to existing entities"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST /lending/acquisition-orders, POST /lending/holds, POST /lending/loans, POST /lending/libraries/{id}/patrons"
  - priority: 5
    category: state
    check: "target entity in the state required for the operation (patron ACTIVE; fund OPEN; order in the transition's from-state; hold in PLACED/READY/SUSPENDED as appropriate; loan ACTIVE; license ACTIVE)"
    error_id: ERR_PATRON_NOT_ACTIVE
    http_status: 409
    applies_to: "all state-changing endpoints; the concrete error is the specialization matching the violated precondition: ERR_PATRON_NOT_ACTIVE, ERR_FUND_CLOSED, ERR_ORDER_INVALID_STATE, ERR_HOLD_NOT_ACTIONABLE, ERR_LOAN_NOT_ACTIVE"
  - priority: 6
    category: business_safety
    check: "patron registration residency: postal_code must be an element of library.residency_region_codes"
    error_id: ERR_RESIDENCY_VIOLATION
    http_status: 422
    applies_to: "POST /lending/libraries/{id}/patrons"
  - priority: 7
    category: business_constraint
    check: "caps and uniqueness: max_concurrent_loans, max_concurrent_holds, duplicate active hold on (patron,title), duplicate active loan on (patron,title), direct checkout while any hold queue exists on the title, renewal blocked by existing holds, renewals_used < max_renewals, OCOU copies >= 1, fund period overlap with sibling funds, SIMULTANEOUS_USE order only when title.simultaneous_use_allowed"
    error_id: ERR_LOAN_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "checkout, hold placement, renew, order create, fund create; the concrete error is the specialization matching the violated rule: ERR_LOAN_LIMIT_EXCEEDED, ERR_HOLD_LIMIT_EXCEEDED, ERR_DUPLICATE_HOLD, ERR_DUPLICATE_LOAN, ERR_CHECKOUT_BLOCKED_BY_HOLDS, ERR_RENEWAL_BLOCKED_BY_HOLDS, ERR_RENEWAL_LIMIT_REACHED, ERR_FUND_PERIOD_OVERLAP, ERR_SIMULTANEOUS_USE_NOT_ALLOWED, ERR_SKIP_THE_LINE_DISABLED"
  - priority: 8
    category: business_temporal
    check: "temporal windows: order approval clock within fund [period_start, period_end); card_expires_at > now at checkout/claim/reinstate; renewal term within license expiry; hold claim before ready_until"
    error_id: ERR_ORDER_OUTSIDE_FISCAL_PERIOD
    http_status: 422
    applies_to: "approve, checkout, claim, renew, reinstate; the concrete error is the specialization matching the violated window: ERR_ORDER_OUTSIDE_FISCAL_PERIOD, ERR_CARD_EXPIRED, ERR_RENEWAL_BEYOND_LICENSE_TERM"
  - priority: 9
    category: business_fiscal
    check: "money last: estimated_cost_cents <= fund.available_committed_cents at approval; CPC license balance_cents >= discounted charge at checkout"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "order approve, CPC checkout; specialized variant ERR_LICENSE_BALANCE_DEPLETED"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- consortium & library administration ----
  - method: POST
    path: "/lending/consortiums"
    description: "Create a consortium"
    roles: [ConsortiumAdmin]
    code: 201
    input: [name, "cpc_discount_pct?", "host_share_floor_pct?", "invoice_period?"]
    output: Consortium
    side_effects: ["status=ACTIVE, version=1"]
  - method: GET
    path: "/lending/consortiums/{id}"
    description: "Read a consortium"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: []
    output: Consortium
    side_effects: []
  - method: POST
    path: "/lending/consortiums/{id}/libraries"
    description: "Register a member library"
    roles: [ConsortiumAdmin]
    code: 201
    input: [name, residency_region_codes, "card_validity_days?", "max_concurrent_loans?", "max_concurrent_holds?", "loan_period_days?", "renewal_period_days?", "max_renewals?", "pickup_window_hours?", "skip_the_line_loan_days?", "auto_purchase_enabled?", "holds_per_copy_ratio?", "wait_target_days?", "auto_purchase_max_cents?"]
    output: Library
    side_effects: ["status=ACTIVE, version=1"]
  - method: GET
    path: "/lending/consortiums/{id}/libraries"
    description: "List member libraries of a consortium"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: Library[]
    side_effects: []
  - method: GET
    path: "/lending/libraries/{id}"
    description: "Read a library"
    roles: [ConsortiumAdmin, LibraryAdmin, SystemAnalyst]
    code: 200
    input: []
    output: Library
    side_effects: []
  - method: PATCH
    path: "/lending/libraries/{id}"
    description: "Update library policy configuration (OCC on Library.version)"
    roles: [LibraryAdmin]
    code: 200
    input: [expected_library_version, "name?", "residency_region_codes?", "card_validity_days?", "max_concurrent_loans?", "max_concurrent_holds?", "loan_period_days?", "renewal_period_days?", "max_renewals?", "pickup_window_hours?", "skip_the_line_loan_days?", "auto_purchase_enabled?", "holds_per_copy_ratio?", "wait_target_days?", "auto_purchase_max_cents?"]
    output: Library
    side_effects: ["increments Library.version by 1"]
  - method: GET
    path: "/lending/libraries/{id}/patrons"
    description: "List patrons of a library"
    roles: [LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Patron[]
    side_effects: []
  # ---- patrons ----
  - method: POST
    path: "/lending/libraries/{id}/patrons"
    description: "Register a patron card at a library (residency validated)"
    roles: [LibraryAdmin]
    code: 201
    input: [external_card_number, full_name, postal_code]
    output: Patron
    side_effects: ["status=ACTIVE; card_expires_at = now + library.card_validity_days; acting LibraryAdmin X-User-ID must equal the path library id"]
  - method: GET
    path: "/lending/patrons/{id}"
    description: "Read a patron"
    roles: [LibraryAdmin, Patron, SystemAnalyst]
    code: 200
    input: []
    output: Patron
    side_effects: []
  - method: POST
    path: "/lending/patrons/{id}/suspend"
    description: "Suspend a patron card"
    roles: [LibraryAdmin]
    code: 200
    input: []
    output: Patron
    side_effects: ["ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/lending/patrons/{id}/reinstate"
    description: "Reinstate a suspended patron card"
    roles: [LibraryAdmin]
    code: 200
    input: []
    output: Patron
    side_effects: ["SUSPENDED -> ACTIVE"]
  - method: GET
    path: "/lending/patrons/{id}/loans"
    description: "List a patron's loans"
    roles: [LibraryAdmin, Patron, SystemAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []
  - method: GET
    path: "/lending/patrons/{id}/holds"
    description: "List a patron's holds"
    roles: [LibraryAdmin, Patron, SystemAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Hold[]
    side_effects: []
  # ---- budget funds ----
  - method: POST
    path: "/lending/libraries/{id}/budget-funds"
    description: "Open a fiscal budget fund for a library"
    roles: [LibraryAdmin]
    code: 201
    input: [fiscal_year, period_start, period_end, budget_cents]
    output: BudgetFund
    side_effects: ["status=OPEN; rejects overlap with any sibling fund of the same library whose [period_start, period_end) intersects (ERR_FUND_PERIOD_OVERLAP); adjacent periods (end == start) are allowed"]
  - method: GET
    path: "/lending/libraries/{id}/budget-funds"
    description: "List a library's budget funds"
    roles: [LibraryAdmin, SystemAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BudgetFund[]
    side_effects: []
  - method: GET
    path: "/lending/budget-funds/{id}"
    description: "Read a budget fund (committed/actual availability variants)"
    roles: [LibraryAdmin, SystemAnalyst]
    code: 200
    input: []
    output: BudgetFund
    side_effects: []
  - method: POST
    path: "/lending/budget-funds/{id}/close"
    description: "Close a fund (blocked while APPROVED orders remain)"
    roles: [LibraryAdmin]
    code: 200
    input: []
    output: BudgetFund
    side_effects: ["OPEN -> CLOSED"]
