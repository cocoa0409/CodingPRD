              as: ReimbursementAnalyst
            - call: "POST /wage-index-submissions/${wis_id}/submit"
              payload: {}
              as: ReimbursementManager
            - call: "POST /wage-index-submissions/${wis_id}/start-review"
              payload: {}
              as: MacAuditor
            - call: "POST /wage-index-submissions/${wis_id}/review-decision"
