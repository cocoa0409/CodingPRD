            - "15:30 start succeeds: Match.${m2}.status == SCHEDULED (half-open adjacency: 15:30 == M1 end)"
            - "Match.${m2}.scheduled_end == 2026-10-10T17:00:00Z"

      - name: hotel_per_night_aggregate_capacity
        grounds:
          - validations[priority=11]
          - errors[ERR_BLOCK_INVENTORY_EXCEEDED]
          - entities.RoomBooking.fields.room_nights
        distinguishing_aspect: |
          HotelBlock resource with AGGREGATE PER-NIGHT CAPACITY semantics
          (sum of rooms_count per occupied night <= contracted_rooms_per_night,
          date-granular nights [check_in, check_out)) — not pairwise interval
          exclusion: 18+2 == 20 is admitted (inclusive boundary) while +1 more
          on a single shared night is rejected.
        test_recipe:
          setup:
            - "Event E; block H CONTRACTED (20 rooms/night, nights 10-08..10-11, cutoff 2026-10-01); B1 rooms 18 nights 10-08..10-12; B2 rooms 2 nights 10-09..10-11 admitted (per-night totals 18/20/20/18)"
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb_id: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/contract", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block A", rooms_count: 18, check_in_date: "2026-10-08", check_out_date: "2026-10-12" }, as: CommissionAdmin, captures: { bk1: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block B", rooms_count: 2, check_in_date: "2026-10-09", check_out_date: "2026-10-11" }, as: CommissionAdmin, captures: { bk2: $.data.id, bk2_n: $.data.room_nights } }
          trigger:
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block C", rooms_count: 1, check_in_date: "2026-10-10", check_out_date: "2026-10-11" }, as: CommissionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "B2 created with room_nights == 4 (2 rooms x 2 nights; nights 09 and 10 reach exactly 20/20 — inclusive boundary)"
            - "B3: error_id == ERR_BLOCK_INVENTORY_EXCEEDED (night 10-10 would reach 21 > 20)"
            - "HotelBlock.${hb_id}.picked_up_room_nights == 76 (72 + 4; B3 not counted)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: room_night_pickup_cancel_rebook_invariant
        grounds:
          - entities.HotelBlock.fields.picked_up_room_nights
          - state_machines.RoomBooking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = picked_up room-nights: CONFIRM (8) -> CANCEL (0)
          -> identical re-book + CONFIRM (8); the block-level aggregate returns
          to exactly its pre-cancel value. The division instance conserves a
          different quantity (entered_team_count).
        test_recipe:
          setup:
            - "Event E; block H CONTRACTED (20/night, cutoff 2026-10-01); B1 rooms 2 nights 10-08..10-12 CONFIRMED; picked_up_room_nights == 8; clock at default 2026-08-01 (<= cutoff, so no cancellation fee)"
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb_id: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/contract", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block A", rooms_count: 2, check_in_date: "2026-10-08", check_out_date: "2026-10-12" }, as: CommissionAdmin, captures: { bk1: $.data.id } }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CONFIRM }, as: CommissionAdmin }
            - { call: "GET /api/v1/hotel-blocks/${hb_id}", as: Any, captures: { pu_before: $.data.picked_up_room_nights } }
          trigger:
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CANCEL }, as: CommissionAdmin, captures: { fee1: $.data.cancellation_fee_cents } }
            - { call: "GET /api/v1/hotel-blocks/${hb_id}", as: Any, captures: { pu_mid: $.data.picked_up_room_nights } }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block A2", rooms_count: 2, check_in_date: "2026-10-08", check_out_date: "2026-10-12" }, as: CommissionAdmin, captures: { bk2: $.data.id } }
            - { call: "POST /api/v1/room-bookings/${bk2}/transition", payload: { action: CONFIRM }, as: CommissionAdmin }
            - { call: "GET /api/v1/hotel-blocks/${hb_id}", as: Any, captures: { pu_after: $.data.picked_up_room_nights } }
          assert:
            - "picked_up_room_nights before cancel == 8"
            - "picked_up_room_nights after cancel == 0 (compensating action of the forward booking)"
            - "picked_up_room_nights after re-book + CONFIRM == 8 — invariant: cancel+rebook conserves picked-up room-nights"
            - "RoomBooking.${bk1}.cancellation_fee_cents == 0 (clock before cutoff)"

      - name: division_entered_count_withdraw_promote_invariant
        grounds:
          - entities.Division.fields.entered_team_count
          - state_machines.Team.ENTERED_to_WITHDRAWN
          - state_machines.Team.WAITLISTED_to_ENTERED
        distinguishing_aspect: |
          Conserved quantity = division entered_team_count: a withdraw (-1)
          atomically triggers the waitlist promotion (+1) of the oldest
          WAITLISTED team by created_at ASC, returning the count to 2. Different
          conserved quantity than the room-night instance.
        test_recipe:
          setup:
            - "Event REGISTRATION_OPEN; division cap 2; T1, T2 ENTERED; T3 WAITLISTED (created_at ordered via clock: T1 < T2 < T3)"
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { bid_id: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: INSURANCE_CERT, is_mandatory: true, weight_points: 100 }, as: CommissionAdmin, captures: { rq1: $.data.id } }
            - { call: "POST /api/v1/requirements/${rq1}/evidence", payload: { evidence_uri: "s3://ev/ins.pdf" }, as: CommissionAdmin, as_user_id: "ops-admin-1" }
            - { call: "POST /api/v1/requirements/${rq1}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/submit", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/bids/${bid_id}/review", payload: {}, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/decide", payload: { decision: AWARDED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/events/${ev_id}/venues", payload: { name: "River Park", address: "1 Park Way", rental_fee_cents: 200000, revenue_share_pct: 0.10 }, as: CommissionAdmin, captures: { v1: $.data.id } }
            - { call: "POST /api/v1/venues/${v1}/contract", payload: { contract_uri: "s3://contracts/v1.pdf" }, as: CommissionAdmin }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb1: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb1}/contract", payload: {}, as: CommissionAdmin }
            - { call: "GET /api/v1/events/${ev_id}", as: Any, captures: { ev_v3: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: PLANNING, expected_event_version: "${ev_v3}" }, as: CommissionAdmin, captures: { ev_v4: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/divisions", payload: { name: "U16", team_cap: 2, min_teams: 2, registration_fee_cents: 10000 }, as: CommissionAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: REGISTRATION_OPEN, expected_event_version: "${ev_v4}" }, as: CommissionAdmin }
            - { call: "POST /api/v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:01Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/divisions/${d1}/teams", payload: { name: "Tigers", contact_email: "t@x.com", strength_rating: 90 }, as: CommissionAdmin, captures: { t1: $.data.id } }
            - { call: "POST /api/v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:02Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/divisions/${d1}/teams", payload: { name: "Sharks", contact_email: "s@x.com", strength_rating: 70 }, as: CommissionAdmin, captures: { t2: $.data.id } }
            - { call: "POST /api/v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:03Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/divisions/${d1}/teams", payload: { name: "Wolves", contact_email: "w@x.com", strength_rating: 85 }, as: CommissionAdmin, captures: { t3: $.data.id, t3s: $.data.status } }
          trigger:
            - { call: "POST /api/v1/teams/${t1}/withdraw", payload: {}, as: TeamRep, as_user_id: "${t1}" }
            - { call: "GET /api/v1/divisions/${d1}", as: Any, captures: { cnt: $.data.entered_team_count } }
            - { call: "GET /api/v1/teams/${t3}", as: Any, captures: { t3_after: $.data.status } }
          assert:
            - "Team.${t3}.status was WAITLISTED before the withdraw"
            - "Team.${t1}.status == WITHDRAWN"
            - "Team.${t3}.status == ENTERED (oldest WAITLISTED by created_at ASC promoted)"
            - "Division.${d1}.entered_team_count == 2 — invariant: withdraw + promotion conserve the count (2 before, 2 after)"
