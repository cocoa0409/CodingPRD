            - call: "POST /signal-ops/pedestrian-checks/${pc1_id}/waive"
              payload: { waiver_justification: "Crosswalk is being shortened under a separate capital project; interim timing accepted." }
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { pc1_result2: $.data.result, pc1_waived_by: $.data.waived_by_user_id }
            - call: "POST /signal-ops/timing-plans/${tp1_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { tp1_status: $.data.status, tp1_ped_state: $.data.ped_compliance_state }
            - call: "POST /signal-ops/timing-plans/${tp1_id}/certify"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "eng-1"
              captures: { e_sod_certify: $.data.error_id }
            - call: "POST /signal-ops/timing-plans/${tp1_id}/certify"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
              captures: { tp1_status2: $.data.status, tp1_certifier: $.data.certified_by_user_id }
            - call: "GET /signal-ops/intersections/${i1_id}"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { i1_v: $.data.version }
            - call: "POST /signal-ops/priority-configs"
              payload: { intersection_id: "${i1_id}", priority_type: "TSP", requested_max_extension_sec: 8, conflict_resolution_rank: 1, expected_intersection_version: "${i1_v}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { cfg_id: $.data.id, cfg_proposer: $.data.proposed_by_user_id }
            - call: "POST /signal-ops/priority-configs/${cfg_id}/approve"
