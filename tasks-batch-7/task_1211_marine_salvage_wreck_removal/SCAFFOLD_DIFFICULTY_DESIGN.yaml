  - rule_id: non_linear_state_machine
    instances:
      - name: contract_negotiation_offer_counter_cycle
        grounds:
          - state_machines.SalvageContract.OFFERED_to_COUNTERED
          - state_machines.SalvageContract.COUNTERED_to_OFFERED
          - "concurrency_rules[contract-counter-stale-version]"
        distinguishing_aspect: |
          Cyclic machine on SalvageContract: OFFERED -> COUNTERED -> OFFERED via
          repeated counter calls (each OCC-guarded, round increments 1->2->3),
          then sign from OFFERED. Distinct entity from the RecoveredProperty
          parallel-dimension instance.
        test_recipe:
          setup:
            - "Casualty assessed + plan approved; NCNP contract created in DRAFT (negotiation_round 0, version 1)"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_v2: $.data.version, st_offer: $.data.status, rd1: $.data.negotiation_round } }
          trigger:
            - { call: "POST /contracts/${ct_id}/counter", payload: { expected_contract_version: "${ct_v2}" }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_v3: $.data.version, st_c1: $.data.status, rd2: $.data.negotiation_round } }
            - { call: "POST /contracts/${ct_id}/counter", payload: { expected_contract_version: "${ct_v3}" }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_v4: $.data.version, st_o2: $.data.status, rd3: $.data.negotiation_round } }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01", captures: { st_final: $.data.status } }
          assert:
            - "After offer: status == OFFERED and negotiation_round == 1 and version == 2"
            - "After counter 1: status == COUNTERED and negotiation_round == 2 and version == 3 (cycle leg OFFERED -> COUNTERED)"
            - "After counter 2: status == OFFERED and negotiation_round == 3 and version == 4 (cycle leg COUNTERED -> OFFERED)"
            - "After sign: status == SIGNED and provisional_award_cents == 24000000 (12% of 200,000,000)"

      - name: property_custody_documentation_parallel_dimensions
        grounds:
          - state_machines.RecoveredProperty.SALVED_to_SECURED_ASHORE
          - state_machines.RecoveredProperty.PENDING_SURVEY_to_SURVEYED
          - entities.RecoveredProperty.fields.custody_status
          - entities.RecoveredProperty.fields.documentation_status
        distinguishing_aspect: |
          Parallel state dimensions on RecoveredProperty: documentation advances
          PENDING_SURVEY -> SURVEYED -> VALUE_VERIFIED while custody moves
          SALVED -> SECURED_ASHORE independently; each step leaves the other
          dimension untouched. Distinct entity from SalvageContract's cycle.
        test_recipe:
          setup:
            - "Casualty with NCNP contract ACTIVE; one CARGO lot created (SALVED x PENDING_SURVEY); storage site exists"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 30000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /storage-sites", payload: { name: "Yard C", capacity_tonnes: 500 }, as: OperationsDirector, as_user_id: "opsdir-01", captures: { site_id: $.data.id } }
            - { call: "POST /properties", payload: { casualty_id: "${cas_id}", property_type: CARGO, quantity_tonnes: 40, declared_value_cents: 8000000 }, as: SalvageMaster, as_user_id: "sm-01", captures: { lot1: $.data.id, cu0: $.data.custody_status, dc0: $.data.documentation_status } }
          trigger:
            - { call: "POST /properties/${lot1}/survey", payload: { verified_value_cents: 7500000 }, as: MarineSurveyor, as_user_id: "surveyor-02", captures: { cu1: $.data.custody_status, dc1: $.data.documentation_status } }
            - { call: "POST /properties/${lot1}/secure-ashore", payload: { storage_site_id: "${site_id}" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cu2: $.data.custody_status, dc2: $.data.documentation_status } }
            - { call: "POST /properties/${lot1}/verify-value", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01", captures: { cu3: $.data.custody_status, dc3: $.data.documentation_status } }
          assert:
            - "At creation: custody_status == SALVED and documentation_status == PENDING_SURVEY"
            - "After survey: custody_status == SALVED (unchanged) and documentation_status == SURVEYED"
            - "After secure-ashore: custody_status == SECURED_ASHORE and documentation_status == SURVEYED (unchanged)"
            - "After verify-value: custody_status == SECURED_ASHORE (unchanged) and documentation_status == VALUE_VERIFIED"

