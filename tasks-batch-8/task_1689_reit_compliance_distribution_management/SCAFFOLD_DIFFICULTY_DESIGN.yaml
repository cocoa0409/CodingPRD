          assert:
            - "DECLARED branch: D1.ordinary_cents == 100000 and Reit.current_ep_balance_cents == 400000"
            - "VOID branch: D2.status == VOID with zero fiscal side effects — E&P unchanged by D2"
            - "DistributionRequirement.${req_id}.distributed_amount_cents == 100000 (only the DECLARED dividend counts)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: asset_test_breach_suspends_reit_and_voids_dividends
        grounds:
          - state_machines.AssetTestReport.DRAFT_to_BREACHED
          - entities.Reit.fields.status
          - entities.DividendDeclaration.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from POST /asset-test-reports/{id}/lock: (1) report becomes
          BREACHED; (2) the breach sets Reit.status := SUSPENDED; (3) the suspension
          auto-VOIDs every non-terminal DividendDeclaration. Each link is caused by
          the previous link's mutation, not fanned out from the original request.
        test_recipe:
          setup:
            - "Reit R1 ACTIVE; quarter 2026-Q1 OPEN"
            - "Assets: REAL_ESTATE 74000000 cents + NON_QUALIFYING 26000000 cents (qualifying ratio 74.0000 -> breach)"
            - "One APPROVED dividend D1 of 50000 (taxable_year 2026; requirement POSTED so approval was legal)"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "CASC REIT", ticker: "CASC", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Office Park", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2024-06-01", value_cents: 74000000 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Art Collection", asset_class: "NON_QUALIFYING", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2024-06-01", value_cents: 26000000 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/distribution-requirements"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, taxable_income_cents: 500000, net_capital_gain_cents: 0 }
              as: ComplianceOfficer
              captures: { req_id: $.data.id }
            - call: "POST /reit-compliance/distribution-requirements/${req_id}/post"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv1: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 50000, declaration_date: "2026-02-01", record_date: "2026-02-10", payable_date: "2026-02-20", expected_reit_version: "${rv1}" }
              as: ComplianceOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-1"
            - call: "POST /reit-compliance/asset-test-reports"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}" }
              as: ComplianceOfficer
              captures: { atr_id: $.data.id }
          trigger:
            - call: "POST /reit-compliance/asset-test-reports/${atr_id}/lock"
              payload: {}
              as: ComplianceOfficer
              captures: { atr_status: $.data.status, atr_pct: $.data.qualifying_75_pct }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { reit_status: $.data.status }
            - call: "GET /reit-compliance/dividend-declarations/${d1_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { d1_status: $.data.status }
            - call: "GET /reit-compliance/quarters/${q1_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { q_status: $.data.status }
          assert:
            - "link 1: AssetTestReport.${atr_id}.status == BREACHED with qualifying_75_pct == 74.0"
            - "link 2: Reit.${reit_id}.status == SUSPENDED (caused by the breach)"
            - "link 3: DividendDeclaration.${d1_id}.status == VOID (caused by the suspension, not by the lock request directly)"
            - "Quarter.${q1_id}.status == LOCKED (sibling cascade down)"

      - name: snapshot_finalize_freezes_violators_and_blocks_reit
        grounds:
          - state_machines.ShareholderSnapshot.DRAFT_to_FINALIZED
          - state_machines.Shareholder.ACTIVE_to_FROZEN
          - entities.Reit.fields.five_fifty_blocked
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /shareholder-snapshots/{id}/finalize):
          (1) snapshot FINALIZED with failing 5/50 result; (2a) the computed violator
          list freezes each violator Shareholder, and (2b) the failed result sets
          Reit.five_fifty_blocked := true, which gates later dividend declarations.
        test_recipe:
          setup:
            - "Reit R1 ACTIVE, charter_ownership_limit_pct 9.8"
            - "Six INDIVIDUAL shareholders; snapshot 2026-06-30 with total_shares_outstanding 1000 and positions 130, 120, 110, 100, 90, 50 (top-5 = 550 -> 55.0000% fails; the 130-share holder at 13.0000% and the 120/110/100-share holders at 12/11/10% all exceed the 9.8 charter limit)"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "FF REIT", ticker: "FFRE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Alice", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { sh_a: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Bob", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { sh_b: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Cara", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { sh_c: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Dan", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { sh_d: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Eve", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { sh_e: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Frank", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { sh_f: $.data.id }
            - call: "POST /reit-compliance/shareholder-snapshots"
              payload: { reit_id: "${reit_id}", snapshot_date: "2026-06-30", total_shares_outstanding: 1000 }
              as: ComplianceOfficer
              captures: { snap_id: $.data.id }
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_a}", shares_held: 130 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_b}", shares_held: 120 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_c}", shares_held: 110 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_d}", shares_held: 100 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_e}", shares_held: 90 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_f}", shares_held: 50 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/shareholder-snapshots/${snap_id}/finalize"
              payload: {}
              as: ComplianceOfficer
              captures: { snap_passed: $.data.five_fifty_passed, snap_top5: $.data.top5_individual_pct }
            - call: "GET /reit-compliance/shareholders/${sh_a}"
              payload: {}
              as: ComplianceOfficer
              captures: { sh_a_status: $.data.status }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { reit_blocked: $.data.five_fifty_blocked }
          assert:
            - "link 1: ShareholderSnapshot.${snap_id}.status == FINALIZED, top5_individual_pct == 55.0, five_fifty_passed == false"
            - "link 2a: Shareholder.${sh_a}.status == FROZEN (13.0000% > 9.8 charter limit) — likewise sh_b, sh_c, sh_d FROZEN; sh_e (9.0000%) and sh_f (5.0000%) stay ACTIVE"
            - "link 2b: Reit.${reit_id}.five_fifty_blocked == true"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: create_adjustment_bad_enum_and_stale_version
        grounds:
          - validations[priority=5]
          - validations[priority=16]
          - concurrency_rules[ep-adjustment-create-stale-reit]
        distinguishing_aspect: |
          Category pair business_constraint (priority 5) vs business_fiscal
          (priority 16): a POST /ep-adjustments carrying both an invalid kind enum
          and a stale expected_reit_version MUST return ERR_VALIDATION (422), not
          ERR_STALE_VERSION — constraint checks precede fiscal checks.
        test_recipe:
          setup:
            - "Reit R1 ACTIVE at version >= 2 (an adjustment was created and posted, advancing the version)"
            - "quarter 2026-Q1 OPEN"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "PR1 REIT", ticker: "PR1R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "TAXABLE_INCOME", amount_cents: 1000, effective_date: "2026-01-10", expected_reit_version: "${reit_v}" }
              as: TaxDirector
              captures: { adj_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments/${adj_id}/post"
              payload: {}
              as: TaxDirector
          trigger:
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "NOT_A_KIND", amount_cents: 500, effective_date: "2026-01-20", expected_reit_version: "${reit_v}" }
              as: TaxDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION (http 422) — business_constraint at priority 5 beats the stale expected_reit_version (business_fiscal at priority 16), even though ${reit_v} is now stale"

      - name: declare_invalid_state_and_five_fifty_blocked
        grounds:
          - validations[priority=7]
          - validations[priority=13]
        distinguishing_aspect: |
          Category pair state (priority 7) vs business_safety (priority 13): declaring
          a dividend that is still PENDING_APPROVAL while the reit is
          five_fifty_blocked MUST return ERR_INVALID_STATE (409), not
          ERR_FIVE_FIFTY_BLOCKED — state preconditions precede safety gates.
        test_recipe:
          setup:
            - "Reit R1 ACTIVE with five_fifty_blocked == true (a finalized failing snapshot)"
            - "Dividend D1 in PENDING_APPROVAL (created before the block was set)"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "PR2 REIT", ticker: "PR2R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/distribution-requirements"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, taxable_income_cents: 500000, net_capital_gain_cents: 0 }
              as: ComplianceOfficer
              captures: { req_id: $.data.id }
            - call: "POST /reit-compliance/distribution-requirements/${req_id}/post"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv1: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 10000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${rv1}" }
              as: ComplianceOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Dom", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { sh_dom: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Pub", holder_type: "ENTITY" }
              as: ComplianceOfficer
              captures: { sh_pub: $.data.id }
            - call: "POST /reit-compliance/shareholder-snapshots"
              payload: { reit_id: "${reit_id}", snapshot_date: "2026-06-30", total_shares_outstanding: 1000 }
              as: ComplianceOfficer
              captures: { snap_id: $.data.id }
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_dom}", shares_held: 600 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${sh_pub}", shares_held: 400 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-snapshots/${snap_id}/finalize"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/declare"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409) — D1 is PENDING_APPROVAL; the state check at priority 7 fires before the five-fifty safety gate at priority 13"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: asset_test_exactly_75_percent_passes
        grounds:
          - calculations.calc_asset_test_75
          - validations[priority=7]
          - entities.AssetTestReport.fields.test_75_passed
        distinguishing_aspect: |
          Metric: qualifying asset percentage. At exactly 75.0000% the lock passes
          (inclusive >=) and the report lands LOCKED; at 74.9999% it would land
          BREACHED. Endpoint: POST /asset-test-reports/{id}/lock.
        test_recipe:
          setup:
            - "Reit R1 ACTIVE; quarter 2026-Q1 OPEN; assets: REAL_ESTATE 75000000, NON_QUALIFYING 25000000 (total 100000000 -> exactly 75.0000%)"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "BND REIT", ticker: "BNDR", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Tower", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2024-01-01", value_cents: 75000000 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Paintings", asset_class: "NON_QUALIFYING", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2024-01-01", value_cents: 25000000 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/asset-test-reports"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}" }
              as: ComplianceOfficer
              captures: { atr_id: $.data.id }
          trigger:
            - call: "POST /reit-compliance/asset-test-reports/${atr_id}/lock"
              payload: {}
              as: ComplianceOfficer
              captures: { status: $.data.status, pct: $.data.qualifying_75_pct, passed: $.data.test_75_passed }
          assert:
            - "qualifying_75_pct == 75.0 (exactly at the inclusive boundary)"
            - "test_75_passed == true and report status == LOCKED (not BREACHED)"
            - "Reit.${reit_id}.status remains ACTIVE"

      - name: five_fifty_exactly_50_percent_passes
        grounds:
          - calculations.calc_five_fifty
          - entities.ShareholderSnapshot.fields.five_fifty_passed
        distinguishing_aspect: |
          Metric: top-5 individual concentration percentage (distinct from the asset
          ratio). At exactly 50.0000% the test passes (inclusive <=). Endpoint:
          POST /shareholder-snapshots/{id}/finalize — a different endpoint from the
          asset-test boundary.
        test_recipe:
          setup:
            - "Reit R1 ACTIVE; five INDIVIDUAL shareholders with exactly 100 shares each out of 1000 outstanding (top-5 = 50.0000%)"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "B55 REIT", ticker: "B55R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "I1", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { i1: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "I2", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { i2: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "I3", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { i3: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "I4", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { i4: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "I5", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { i5: $.data.id }
            - call: "POST /reit-compliance/shareholder-snapshots"
              payload: { reit_id: "${reit_id}", snapshot_date: "2026-06-30", total_shares_outstanding: 1000 }
              as: ComplianceOfficer
              captures: { snap_id: $.data.id }
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${i1}", shares_held: 100 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${i2}", shares_held: 100 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${i3}", shares_held: 100 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${i4}", shares_held: 100 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_id}", shareholder_id: "${i5}", shares_held: 100 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/shareholder-snapshots/${snap_id}/finalize"
              payload: {}
              as: ComplianceOfficer
              captures: { passed: $.data.five_fifty_passed, top5: $.data.top5_individual_pct }
          assert:
            - "top5_individual_pct == 50.0 (exactly at the inclusive boundary)"
            - "five_fifty_passed == true"
            - "Reit.${reit_id}.five_fifty_blocked == false"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: income_item_requires_quarter_open
        grounds:
          - validations[priority=8]
          - state_machines.AssetTestReport.DRAFT_to_LOCKED
          - entities.IncomeItem.fields.quarter_id
        distinguishing_aspect: |
          Entity pair IncomeItem -> Quarter: creating an IncomeItem is legal only
          while its Quarter is OPEN; once an AssetTestReport lock flips the quarter
          to LOCKED, the same create is rejected with ERR_QUARTER_LOCKED.
        test_recipe:
          setup:
            - "Reit R1 ACTIVE; quarter 2026-Q1 with passing assets (all REAL_ESTATE); AssetTestReport locked -> quarter LOCKED"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "X1 REIT", ticker: "X1RE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/asset-holdings"
              payload: { reit_id: "${reit_id}", asset_name: "Mall", asset_class: "REAL_ESTATE", held_by_trs: false, is_dealer_inventory: false, acquisition_date: "2024-01-01", value_cents: 100000000 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/asset-test-reports"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}" }
              as: ComplianceOfficer
              captures: { atr_id: $.data.id }
            - call: "POST /reit-compliance/asset-test-reports/${atr_id}/lock"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/income-items"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", income_class: "RENTS", amount_cents: 5000, source_is_trs: false, accrued_at: "2026-02-01" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_QUARTER_LOCKED (http 409): the IncomeItem mutation is gated by the Quarter's state"

      - name: dividend_declare_requires_posted_requirement
        grounds:
          - validations[priority=15]
          - state_machines.DistributionRequirement.DRAFT_to_POSTED
          - state_machines.DividendDeclaration.APPROVED_to_DECLARED
        distinguishing_aspect: |
          Entity pair DividendDeclaration -> DistributionRequirement (distinct from
          IncomeItem -> Quarter): declare is rejected with ERR_REQUIREMENT_NOT_POSTED
          while the year's requirement is still DRAFT, and succeeds after the
          requirement transitions to POSTED.
        test_recipe:
          setup:
            - "Reit R1 ACTIVE; requirement (2026) exists in DRAFT; dividend D1 APPROVED"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "X2 REIT", ticker: "X2RE", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/distribution-requirements"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, taxable_income_cents: 500000, net_capital_gain_cents: 0 }
              as: ComplianceOfficer
              captures: { req_id: $.data.id }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { rv1: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 40000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${rv1}" }
              as: ComplianceOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-1"
          trigger:
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/declare"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
            - call: "POST /reit-compliance/distribution-requirements/${req_id}/post"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/declare"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { d1_status: $.data.status }
          assert:
            - "first declare: error_id == ERR_REQUIREMENT_NOT_POSTED (http 409) while requirement is DRAFT"
            - "after POST /distribution-requirements/${req_id}/post: declare succeeds and D1.status == DECLARED"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: quarter_closed_interval_overlap_rejected_adjacency_allowed
        grounds:
          - validations[priority=11]
          - entities.Quarter.fields.period_start
          - entities.Quarter.fields.period_end
        distinguishing_aspect: |
          Interval semantics: closed intervals on the Quarter timeline — adjacency
          (Q1 ends 2026-03-31, Q2 starts 2026-04-01) is legal, while sharing even one
          calendar day (Q2 starting 2026-03-31) collides with ERR_QUARTER_OVERLAP.
          Resource entity: Quarter.
        test_recipe:
          setup:
            - "Reit R1 ACTIVE with quarter 2026-Q1 spanning [2026-01-01, 2026-03-31]"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "OV1 REIT", ticker: "OV1R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
          trigger:
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q2-adjacent", period_start: "2026-04-01", period_end: "2026-06-30" }
              as: ComplianceOfficer
              captures: { q2_id: $.data.id }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1B", period_start: "2026-03-31", period_end: "2026-05-31" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "adjacent quarter (start == existing end + 1 day) succeeds with 201"
            - "overlapping quarter sharing the single day 2026-03-31 is rejected: error_id == ERR_QUARTER_OVERLAP (http 409)"

      - name: snapshot_point_date_collision_on_half_year_grid
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - entities.ShareholderSnapshot.fields.snapshot_date
        distinguishing_aspect: |
          Different interval semantics: snapshots occupy zero-length points on a
          half-year calendar grid (Jun 30 / Dec 31 only). Two DRAFT snapshots for the
          same reit on the same date collide with ERR_DUPLICATE even though neither
          occupies an interval; a non-grid date (2026-06-29) fails earlier with
          ERR_INVALID_DATE_RANGE. Resource entity: ShareholderSnapshot (distinct
          from Quarter).
        test_recipe:
          setup:
            - "Reit R1 ACTIVE with one DRAFT snapshot dated 2026-06-30"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "OV2 REIT", ticker: "OV2R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/shareholder-snapshots"
              payload: { reit_id: "${reit_id}", snapshot_date: "2026-06-30", total_shares_outstanding: 1000 }
              as: ComplianceOfficer
              captures: { snap1_id: $.data.id }
          trigger:
            - call: "POST /reit-compliance/shareholder-snapshots"
              payload: { reit_id: "${reit_id}", snapshot_date: "2026-06-30", total_shares_outstanding: 2000 }
              as: ComplianceOfficer
              captures: { err_dup: $.data.error_id }
            - call: "POST /reit-compliance/shareholder-snapshots"
              payload: { reit_id: "${reit_id}", snapshot_date: "2026-06-29", total_shares_outstanding: 1000 }
              as: ComplianceOfficer
              captures: { err_date: $.data.error_id }
          assert:
            - "same half-year-end point rejected: err_dup == ERR_DUPLICATE (http 409)"
            - "off-grid date rejected: err_date == ERR_INVALID_DATE_RANGE (http 422)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ep_balance_post_and_dividend_debit_conserve
        grounds:
          - calculations.calc_ep_balance
          - calculations.calc_dividend_characterization
          - entities.Reit.fields.current_ep_balance_cents
        distinguishing_aspect: |
          Conserved quantity: Reit.current_ep_balance_cents as pinned by the formula
          sum(signed POSTED adjustments) - sum(ordinary_cents of DECLARED/PAID
          dividends). Forward action: post TAXABLE_INCOME +500000. Compensating
          action: declare a 500000 dividend whose ordinary bucket consumes exactly
          500000. The pair leaves the balance at its pre-pair value (0).
        test_recipe:
          setup:
            - "Reit R1 ACTIVE, current_ep_balance_cents == 0; requirement (2026) POSTED with net_capital_gain 0"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "INV1 REIT", ticker: "IV1R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id, reit_v: $.data.version }
            - call: "POST /reit-compliance/quarters"
              payload: { reit_id: "${reit_id}", label: "2026-Q1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: ComplianceOfficer
              captures: { q1_id: $.data.id }
            - call: "POST /reit-compliance/distribution-requirements"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, taxable_income_cents: 900000, net_capital_gain_cents: 0 }
              as: ComplianceOfficer
              captures: { req_id: $.data.id }
            - call: "POST /reit-compliance/distribution-requirements/${req_id}/post"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: TaxDirector
              captures: { rv_pre: $.data.version, ep_pre: $.data.current_ep_balance_cents }
            - call: "POST /reit-compliance/ep-adjustments"
              payload: { reit_id: "${reit_id}", quarter_id: "${q1_id}", kind: "TAXABLE_INCOME", amount_cents: 500000, effective_date: "2026-01-20", expected_reit_version: "${rv_pre}" }
              as: TaxDirector
              captures: { adj_id: $.data.id }
            - call: "POST /reit-compliance/ep-adjustments/${adj_id}/post"
              payload: {}
              as: TaxDirector
          trigger:
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ep_mid: $.data.current_ep_balance_cents, rv_mid: $.data.version }
            - call: "POST /reit-compliance/dividend-declarations"
              payload: { reit_id: "${reit_id}", taxable_year: 2026, amount_cents: 500000, declaration_date: "2026-03-01", record_date: "2026-03-10", payable_date: "2026-03-20", expected_reit_version: "${rv_mid}" }
              as: ComplianceOfficer
              captures: { d1_id: $.data.id }
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/approve"
              payload: {}
              as: BoardDirector
              as_user_id: "director-1"
            - call: "POST /reit-compliance/dividend-declarations/${d1_id}/declare"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { d_ord: $.data.ordinary_cents }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ep_post: $.data.current_ep_balance_cents }
          assert:
            - "ep_pre == 0; after posting +500000: ep_mid == 500000"
            - "declared dividend ordinary_cents == 500000 (full E&P absorption)"
            - "ep_post == ep_pre == 0 — forward post and compensating declare leave the pinned formula quantity unchanged"

      - name: five_fifty_block_set_and_cleared_by_later_passing_snapshot
        grounds:
          - calculations.calc_five_fifty
          - state_machines.ShareholderSnapshot.DRAFT_to_FINALIZED
          - entities.Reit.fields.five_fifty_blocked
        distinguishing_aspect: |
          Conserved quantity: Reit.five_fifty_blocked as a pure function of the latest
          FINALIZED snapshot's five_fifty_passed. Forward action: finalize a failing
          first-half snapshot (blocked := true). Compensating action: finalize a
          passing second-half snapshot (blocked := false). The pair returns the flag
          to its original value. Distinct quantity from the E&P cents invariant.
        test_recipe:
          setup:
            - "Reit R1 ACTIVE; shareholders: one INDIVIDUAL Dom (600 shares) and one ENTITY Pub (400 shares) for H1; for H2 the same two holders rebalance to Dom 400 / Pub 600"
          setup_api_calls:
            - call: "POST /reit-compliance/reits"
              payload: { legal_name: "INV2 REIT", ticker: "IV2R", charter_ownership_limit_pct: 9.8, taxable_year_start: "2026-01-01" }
              as: TaxDirector
              captures: { reit_id: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Dom", holder_type: "INDIVIDUAL" }
              as: ComplianceOfficer
              captures: { sh_dom: $.data.id }
            - call: "POST /reit-compliance/shareholders"
              payload: { reit_id: "${reit_id}", display_name: "Pub", holder_type: "ENTITY" }
              as: ComplianceOfficer
              captures: { sh_pub: $.data.id }
            - call: "POST /reit-compliance/shareholder-snapshots"
              payload: { reit_id: "${reit_id}", snapshot_date: "2026-06-30", total_shares_outstanding: 1000 }
              as: ComplianceOfficer
              captures: { snap_h1: $.data.id }
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_h1}", shareholder_id: "${sh_dom}", shares_held: 600 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_h1}", shareholder_id: "${sh_pub}", shares_held: 400 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-snapshots/${snap_h1}/finalize"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { blocked_mid: $.data.five_fifty_blocked }
            - call: "POST /reit-compliance/shareholder-snapshots"
              payload: { reit_id: "${reit_id}", snapshot_date: "2026-12-31", total_shares_outstanding: 1000 }
              as: ComplianceOfficer
              captures: { snap_h2: $.data.id }
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_h2}", shareholder_id: "${sh_dom}", shares_held: 400 }
              as: ComplianceOfficer
            - call: "POST /reit-compliance/shareholder-positions"
              payload: { snapshot_id: "${snap_h2}", shareholder_id: "${sh_pub}", shares_held: 600 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /reit-compliance/shareholder-snapshots/${snap_h2}/finalize"
              payload: {}
              as: ComplianceOfficer
              captures: { h2_passed: $.data.five_fifty_passed, h2_top5: $.data.top5_individual_pct }
            - call: "GET /reit-compliance/reits/${reit_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { blocked_post: $.data.five_fifty_blocked }
          assert:
            - "after failing H1 finalize (top-5 = 60.0000%): blocked_mid == true"
            - "H2 snapshot (Dom now 400 of 1000 = 40.0000%): h2_passed == true, h2_top5 == 40.0"
            - "blocked_post == false — the compensating finalize restores the flag to its pre-pair value"
