      - name: standard_crud_water_body_patch_updates_only_the_supplied_field
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/water-bodies/{id}
          - entities.WaterBody
        distinguishing_aspect: "The only update endpoint in the API is a partial update: a PATCH carrying just risk_tier moves risk_tier, leaves downstream_of_water_body_id at its stored value, refuses to touch infestation_status (which the detection-report acknowledgement solely owns) and bumps version by exactly one."
        test_recipe:
          setup:
            - "Two water bodies, the second created downstream of the first, so the PATCH target already has a non-null drainage parent worth preserving."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /water-bodies"
              payload: { name: "Upper Whitefish", state_code: "MT", water_body_class: "LAKE", risk_tier: "MODERATE" }
              as: ProgramAdmin
              captures: { wb_up: $.data.id }
            - call: "POST /water-bodies"
              payload: { name: "Whitefish Outlet", state_code: "MT", water_body_class: "RIVER", risk_tier: "LOW", infestation_status: "SUSPECT", downstream_of_water_body_id: "${wb_up}" }
              as: ProgramAdmin
              captures: { wb_down: $.data.id, wb_down_version: $.data.version }
          trigger:
            - call: "PATCH /water-bodies/${wb_down}"
              payload: { risk_tier: "HIGH" }
              as: ProgramAdmin
          assert:
            - "the trigger returns 200 with data.risk_tier == HIGH"
            - "data.downstream_of_water_body_id == ${wb_up}, unchanged by an omitted field"
            - "data.infestation_status == SUSPECT and data.detection_count == 0 and data.live_detection_count == 0, because the PATCH input list contains neither the status nor the counters"
            - "data.version == ${wb_down_version} + 1, exactly one increment for the one call"
            - "GET /water-bodies/${wb_down} re-reads the same values, so the response was not a projection over unsaved state"
            - "control: PATCH /water-bodies/${wb_down} with an empty body returns 200 and leaves every field including risk_tier == HIGH untouched while still incrementing version"

      - name: action_endpoint_report_submission_moves_draft_to_submitted_and_counts
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/detection-reports/{id}/submission
          - state_machines.DetectionReport.status
          - errors.ERR_REPORT_INVALID_STATE
        distinguishing_aspect: "The submission action does three things in one call - flips DRAFT -> SUBMITTED, increments submission_count from 0 to 1 and clears rejection_reason - and its precondition is on the report's own status, so a second submission against a SUBMITTED report is refused 409 without touching submission_count."
        test_recipe:
          setup:
            - "The standard station with insp_a ACTIVE; one vessel whose last water body is a separate CONFIRMED_INFESTED lake; a screened record; one DRAFT detection report on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
