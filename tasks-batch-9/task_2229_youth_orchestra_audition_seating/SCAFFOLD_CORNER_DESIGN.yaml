      - name: tuition_multiplier_selected_by_the_accounts_tier_snapshot
        claim_type: tiered_pricing
        grounds:
          - calculations.tuition_assessment
          - entities.TuitionAccount.fields.ensemble_tier
          - endpoints[POST /placements/{placementId}/accept]
        distinguishing_aspect: |
          gross_cents is tuition_base_cents times TIER_MULTIPLIER[account.ensemble_tier],
          rounded half-up to whole cents - and the tier comes from the accepted ensemble,
          not from the audition's recommendation. Both members were recommended SYMPHONY,
          but the one who accepted the CONCERT_ORCHESTRA offer pays 123223 * 0.80 = 98578.40
          -> 98578, while the SYMPHONY seat pays 123223 * 1.25 = 154028.75 -> 154029. The
          two fixtures also pin the rounding direction in both directions (.75 up, .40
          down).
        test_recipe:
          setup:
            - "Season in PLACEMENT with tuition_base_cents 123223 and two ensembles, each with"
            - "its own VIOLIN quota (min 1 / target 1 / max 2): Symphony (tier SYMPHONY) and"
            - "Concert Orchestra (tier CONCERT_ORCHESTRA)."
            - "Edge Eve and Edge Eli were both adjudicated at 85.00 -> tier_recommendation"
            - "SYMPHONY, so either ensemble is an admissible offer for either of them."
            - "Eve holds an OFFERED placement in Symphony, Eli one in Concert Orchestra."
            - "Neither member has sibling_enrolled, and both accept without an instrument loan."
