            - { call: "POST /geo/subcontractors", payload: { name: "DrillCo", license_no: "LIC-1", day_rate_cents: 90000, max_concurrent_rigs: 2 }, as: FirmAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer, captures: { b_id: "$.data.id" } }
            - { call: "POST /geo/subcontractors/${s_id}/transition", payload: { to: "SUSPENDED" }, as: FirmAdmin }
          trigger:
            - { call: "POST /geo/borings/${b_id}/rig-assignments", payload: { subcontractor_id: "${s_id}", window_start: "2026-08-04T16:00:00Z", window_end: "2026-08-04T08:00:00Z" }, as: ProjectManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_STANDING_SUSPENDED (priority-7 constraint reported over priority-8 temporal ERR_INVALID_WINDOW)"

