scenario: |
  Single-Advisor Branch Office Model & Branch Administrator Staffing (Edward Jones): one-advisor storefront branches with a branch office administrator supporting the practice, branch site selection in small communities with door-knocking territory assignment, new advisor training program with production goals and validation milestones, branch profitability accounting where the advisor shares in the branch's net profit, goodwill transfer and succession programs when an advisor retires, home office service model with segmented support tiers by branch size, branch equipment, lease and administrator payroll charged to the branch, limited product shelf and solicitation approval processes

domain_name: single-advisor-branch-office
api_prefix: /branch-office

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Advisor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Advisor legal name.
      - name: email
        type: string
        source: input
        description: Advisor email; unique across all advisors.
      - name: status
        type: enum
        source: system
        description: Lifecycle state.
        constraints: "One of: CANDIDATE, TRAINEE, VALIDATED, PRACTICING, RETIRING, RETIRED, TERMINATED"
        default: CANDIDATE
      - name: hire_date
        type: datetime
        source: input
        description: Date the advisor entered the training pipeline (ISO 8601 UTC).
      - name: branch_id
        type: string
        source: system
        description: "FK -> Branch.id; nullable until assignment. At most one branch per advisor at a time; a branch has at most one assigned advisor with status not in {RETIRED, TERMINATED}."
        default: null
      - name: predecessor_advisor_id
        type: string
        source: system
        description: "FK -> Advisor.id; self-referential link to the advisor whose practice this advisor succeeded (set when a GoodwillTransfer completes). Null for non-succession advisors."
        default: null
      - name: cumulative_commissions_cents
        type: integer
        source: computed
        description: Sum of commissions_cents across this advisor's POSTED production records since hire_date. Recomputed on every production post/reversal.
        default: 0

  - name: Territory
    parent: null
    common_fields: true
    fields:
      - name: community_name
        type: string
        source: input
        description: Community the territory covers.
      - name: household_capacity
        type: integer
        source: input
        description: Maximum number of DoorKnockContact records that may be REGISTERED (non-archived) in this territory.
        constraints: ">= 1"
      - name: assigned_advisor_id
        type: string
        source: system
        description: "FK -> Advisor.id; the advisor currently holding door-knocking rights. Null when unassigned."
        default: null
      - name: assignment_start
        type: datetime
        source: system
        description: Start (inclusive) of the current assignment interval. Null when unassigned.
      - name: assignment_end
        type: datetime
        source: system
        description: End (exclusive) of the current assignment interval; half-open [start, end). Null while open-ended.
      - name: status
        type: enum
        source: system
        description: Territory lifecycle.
        constraints: "One of: OPEN, ASSIGNED, RETIRED"
        default: OPEN

  - name: DoorKnockContact
    parent: null
    common_fields: false
    fields:
      - name: territory_id
        type: string
        source: input
        description: "FK -> Territory.id; territory this contact was logged against."
      - name: household_address
        type: string
        source: input
        description: Street address knocked; unique per territory among non-archived contacts.
      - name: contact_outcome
        type: enum
        source: input
        description: Outcome of the knock.
        constraints: "One of: NO_ANSWER, PITCHED, APPOINTMENT_SET, CLIENT_CONVERTED"
      - name: contacted_at
        type: datetime
        source: input
        description: Timestamp of the knock; must fall inside the territory's current assignment interval [assignment_start, assignment_end).
      - name: archived
        type: boolean
        source: system
        description: Soft-delete flag; archived contacts do not count against household_capacity.
        default: false

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - name: community_name
        type: string
        source: input
        description: Community of the storefront branch.
      - name: operating_status
        type: enum
        source: system
        description: Operating dimension of the branch's parallel state.
        constraints: "One of: PROPOSED, SITE_APPROVED, OPEN, SUSPENDED, CLOSED"
        default: PROPOSED
      - name: staffing_status
        type: enum
        source: system
        description: Staffing dimension, independent of operating_status.
        constraints: "One of: UNSTAFFED, ADVISOR_ASSIGNED, FULLY_STAFFED, SUCCESSION_PENDING"
        default: UNSTAFFED
      - name: site_address
        type: string
        source: input
        description: Proposed storefront address.
      - name: household_count
        type: integer
        source: input
        description: Number of client households on the branch's book.
        default: 0
        constraints: ">= 0"
      - name: assets_under_care_dollars
        type: integer
        source: input
        description: Client assets under care, in whole dollars.
        default: 0
        constraints: ">= 0"
      - name: service_tier
        type: enum
        source: computed
        description: Home-office support tier derived from tier_score. Recomputed on every household_count or assets_under_care_dollars change and on BranchFinancialPeriod close.
        constraints: "One of: TIER_1, TIER_2, TIER_3"
      - name: tier_score
        type: integer
        source: computed
        description: "tier_score = household_count * 10 + assets_under_care_dollars // 100000 (integer floor division)."
        default: 0
      - name: territory_id
        type: string
        source: input
        description: "FK -> Territory.id; the territory this branch serves. Required before SITE_APPROVED."

  - name: BranchOfficeAdministrator
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Administrator legal name.
      - name: email
        type: string
        source: input
        description: Administrator email; unique.
      - name: monthly_salary_cents
        type: integer
        source: input
        description: Gross monthly salary, charged to the employing branch.
        constraints: "> 0"
      - name: branch_id
        type: string
        source: system
        description: "FK -> Branch.id; employing branch. A branch has at most one ACTIVE administrator; an administrator serves at most one branch."
        default: null
      - name: status
        type: enum
        source: system
        description: Employment lifecycle.
        constraints: "One of: HIRED, ACTIVE, ON_LEAVE, RELEASED"
        default: HIRED

  - name: TrainingProgram
    parent: null
    common_fields: true
    fields:
      - name: advisor_id
        type: string
        source: input
        description: "FK -> Advisor.id; the trainee. Exactly one non-terminal TrainingProgram per advisor."
      - name: goal_cents
        type: integer
        source: input
        description: Cumulative production (commission) goal the trainee must reach by each milestone.
        constraints: "> 0"
      - name: start_date
        type: datetime
        source: input
        description: Program start (day 0).
      - name: status
        type: enum
        source: system
        description: Program lifecycle; cyclic via remediation loop.
        constraints: "One of: ACTIVE, MILESTONE_PENDING, REMEDIATION, COMPLETED, FAILED"
        default: ACTIVE

  - name: MilestoneEvaluation
    parent: null
    common_fields: false
    fields:
      - name: training_program_id
        type: string
        source: input
        description: "FK -> TrainingProgram.id; program under evaluation."
      - name: window_end
        type: datetime
        source: input
        description: End of the evaluation window; production counted is POSTED commissions with posted_at in [program.start_date, window_end].
      - name: production_cents
        type: integer
        source: computed
        description: Sum of POSTED production commissions for the program's advisor in the window, per-line rounded then summed (see training_production_window calculation).
      - name: outcome
        type: enum
        source: computed
        description: "PASS if production_cents >= goal_cents else FAIL (boundary is inclusive: exactly at goal passes)."
        constraints: "One of: PASS, FAIL"

  - name: LeaseAgreement
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; the branch occupying the site."
      - name: monthly_rent_cents
        type: integer
        source: input
        description: Monthly rent charged to the branch.
        constraints: "> 0"
      - name: term_start
        type: datetime
        source: input
        description: Occupancy start (inclusive). Closed interval semantics.
      - name: term_end
        type: datetime
        source: input
        description: Occupancy end (inclusive). Closed interval semantics; term_end >= term_start.
      - name: status
        type: enum
        source: system
        description: Lease lifecycle.
        constraints: "One of: DRAFT, SIGNED, EXPIRED, TERMINATED"
        default: DRAFT

  - name: BranchFinancialPeriod
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; branch whose P&L this period covers."
      - name: period_start
        type: datetime
        source: input
        description: Period start (inclusive). Periods for one branch must not overlap (half-open [start, end)).
      - name: period_end
        type: datetime
        source: input
        description: Period end (exclusive).
      - name: status
        type: enum
        source: system
        description: Period lifecycle.
        constraints: "One of: OPEN, CLOSED, FINALIZED"
        default: OPEN
      - name: gross_revenue_cents
        type: integer
        source: computed
        description: Sum of POSTED revenue lines for the branch in [period_start, period_end).
        default: 0
      - name: total_charges_cents
        type: integer
        source: computed
        description: Sum of POSTED (non-reversed) BranchCharge amounts for the period.
        default: 0
      - name: net_profit_cents
        type: integer
        source: computed
        description: gross_revenue_cents - total_charges_cents (may be negative).
        default: 0
      - name: advisor_share_cents
        type: integer
        source: computed
        description: Tiered advisor profit share per advisor_profit_share calculation. Provisional while OPEN/CLOSED, final once FINALIZED.
        default: 0
      - name: deficit_carryforward_cents
        type: integer
        source: computed
        description: "If net_profit_cents < 0, its absolute value is carried into the next OPEN period of the same branch as an additional charge. 0 otherwise."
        default: 0

  - name: BranchCharge
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; branch bearing the charge."
      - name: period_id
        type: string
        source: input
        description: "FK -> BranchFinancialPeriod.id; period the charge posts to."
      - name: charge_type
        type: enum
        source: input
        description: Category of charge.
        constraints: "One of: LEASE_RENT, BOA_PAYROLL, EQUIPMENT, DEFICIT_CARRYOVER"
      - name: amount_cents
        type: integer
        source: input
        description: Charge amount.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Charge posting lifecycle.
        constraints: "One of: POSTED, REVERSED"
        default: POSTED

  - name: ProductionRecord
    parent: null
    common_fields: false
    fields:
      - name: advisor_id
        type: string
        source: input
        description: "FK -> Advisor.id; producing advisor."
      - name: gross_commission_cents
        type: integer
        source: input
        description: Gross commission amount before payout-rate rounding.
        constraints: "> 0"
      - name: payout_rate
        type: number
        source: input
        description: "Advisor payout fraction (0 < payout_rate <= 1); applied with per-record round-half-up."
      - name: commissions_cents
        type: integer
        source: computed
        description: "round_half_up(gross_commission_cents * payout_rate) — per-record rounding pinned here."
      - name: posted_at
        type: datetime
        source: input
        description: Effective posting timestamp; drives period and milestone window inclusion.
      - name: status
        type: enum
        source: system
        description: Posting lifecycle.
        constraints: "One of: POSTED, REVERSED"
        default: POSTED

  - name: GoodwillTransfer
    parent: null
    common_fields: true
    fields:
      - name: branch_id
        type: string
        source: input
        description: "FK -> Branch.id; practice being transferred."
      - name: retiring_advisor_id
        type: string
        source: input
        description: "FK -> Advisor.id; advisor retiring out of the branch."
      - name: successor_advisor_id
        type: string
        source: input
        description: "FK -> Advisor.id; advisor acquiring the practice."
      - name: valuation_mode
        type: enum
        source: input
        description: Which valuation variant applies.
        constraints: "One of: INTERNAL_SUCCESSION, OPEN_MARKET"
      - name: trailing_revenue_cents
        type: integer
        source: computed
        description: Sum of POSTED revenue lines for the branch across the trailing 12 complete months before offer creation, per goodwill_valuation.
      - name: offer_price_cents
        type: integer
        source: computed
        description: Current offered price; initialized from valuation, mutable per negotiation round while NEGOTIATING.
      - name: escrow_deposit_cents
        type: integer
        source: input
        description: Successor's earnest deposit held in escrow; refunded on decline/expiry, applied on completion.
        constraints: ">= 0"
      - name: negotiation_round
        type: integer
        source: system
        description: Counter of offer/counter rounds; starts at 0, increments per counter-offer.
        default: 0
      - name: status
        type: enum
        source: system
        description: Transfer lifecycle; cyclic during negotiation.
        constraints: "One of: OFFERED, NEGOTIATING, ACCEPTED, COMPLETED, DECLINED, EXPIRED, CANCELLED"
        default: OFFERED

  - name: ProductShelfEntry
    parent: null
    common_fields: false
    fields:
      - name: product_code
        type: string
        source: input
        description: Product identifier; unique among APPROVED entries.
      - name: asset_class
        type: enum
        source: input
        description: Product asset class.
        constraints: "One of: MUTUAL_FUND, ETF, ANNUITY, BOND, ALTERNATIVE"
      - name: complexity_level
        type: enum
        source: input
        description: "Products above PLAIN require principal sign-off on solicitations."
        constraints: "One of: PLAIN, COMPLEX, RESTRICTED"
      - name: status
        type: enum
        source: system
        description: Shelf lifecycle; RESTRICTED-complexity entries always require sign-off.
        constraints: "One of: PROPOSED, APPROVED, RETIRED"
        default: PROPOSED

  - name: SolicitationRequest
    parent: null
    common_fields: true
    fields:
      - name: advisor_id
        type: string
        source: input
        description: "FK -> Advisor.id; advisor requesting approval to solicit."
      - name: product_code
        type: string
        source: input
        description: "Product to solicit; must exist as an APPROVED ProductShelfEntry (existence validated by product_code lookup)."
      - name: client_household_id
        type: string
        source: input
        description: Opaque client household identifier being solicited.
      - name: status
        type: enum
        source: system
        description: Approval lifecycle.
        constraints: "One of: SUBMITTED, APPROVED, DENIED, WITHDRAWN"
        default: SUBMITTED
      - name: decided_by_role
        type: string
        source: system
        description: Role that decided the request (for segregation-of-duties audit).
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Advisor
    initial_state: CANDIDATE
    terminal_states: [RETIRED, TERMINATED]
    transitions:
      - from: CANDIDATE
        to: TRAINEE
        trigger: "POST /branch-office/advisors/{id}/enroll-training"
        actor: HomeOfficeAdmin
        preconditions:
          - "advisor.status == CANDIDATE"
          - "a TrainingProgram payload with goal_cents > 0 is supplied"
        side_effects:
          - "creates TrainingProgram with status ACTIVE"
      - from: TRAINEE
        to: VALIDATED
        trigger: "POST /branch-office/training-programs/{id}/evaluate when MilestoneEvaluation.outcome == PASS"
        actor: HomeOfficeAdmin
        preconditions:
          - "training_program.status in {ACTIVE, REMEDIATION}"
          - "evaluation outcome == PASS"
        side_effects:
          - "training_program.status -> COMPLETED"
          - "advisor.cumulative_commissions_cents unchanged (no recompute)"
      - from: TRAINEE
        to: TRAINEE
        trigger: "POST /branch-office/training-programs/{id}/evaluate when MilestoneEvaluation.outcome == FAIL"
        actor: HomeOfficeAdmin
        preconditions:
          - "training_program.status in {ACTIVE, REMEDIATION}"
          - "evaluation outcome == FAIL"
        side_effects:
          - "training_program.status -> REMEDIATION (cycle: TRAINEE remains; remediation loop allowed)"
      - from: VALIDATED
        to: PRACTICING
        trigger: "POST /branch-office/advisors/{id}/assign-branch"
        actor: HomeOfficeAdmin
        preconditions:
          - "advisor.status == VALIDATED"
          - "target branch.operating_status in {SITE_APPROVED, OPEN}"
          - "target branch has no other advisor with status not in {RETIRED, TERMINATED}"
          - "branch.territory_id territory is OPEN or assigned to this advisor"
        side_effects:
          - "advisor.branch_id set"
          - "branch.staffing_status -> ADVISOR_ASSIGNED (or FULLY_STAFFED if an ACTIVE BOA exists)"
          - "territory.assigned_advisor_id set, assignment_start = now, territory.status -> ASSIGNED"
      - from: PRACTICING
        to: RETIRING
        trigger: "POST /branch-office/advisors/{id}/declare-retirement"
        actor: Advisor
        preconditions:
          - "advisor.status == PRACTICING"
          - "acting advisor owns the advisor record (X-User-ID == advisor.id)"
        side_effects:
          - "branch.staffing_status -> SUCCESSION_PENDING"
      - from: RETIRING
        to: RETIRED
        trigger: "GoodwillTransfer reaches COMPLETED for this advisor's branch"
        actor: system
        preconditions:
          - "a GoodwillTransfer on the advisor's branch transitions to COMPLETED"
        side_effects:
          - "advisor.branch_id cleared"
          - "successor advisor.predecessor_advisor_id = this advisor id"
      - from: RETIRING
        to: PRACTICING
        trigger: "POST /branch-office/advisors/{id}/rescind-retirement while no GoodwillTransfer is ACCEPTED/COMPLETED"
        actor: Advisor
        preconditions:
          - "advisor.status == RETIRING"
          - "no GoodwillTransfer on advisor's branch in {ACCEPTED, COMPLETED}"
        side_effects:
          - "branch.staffing_status -> ADVISOR_ASSIGNED or FULLY_STAFFED per BOA presence"
      - from: RETIRING
        to: TERMINATED
        trigger: "POST /branch-office/advisors/{id}/terminate"
        actor: HomeOfficeAdmin
        preconditions:
          - "advisor.status == RETIRING"
          - "no GoodwillTransfer on the advisor's branch in {ACCEPTED} (OFFERED/NEGOTIATING transfers are auto-CANCELLED with escrow refunded)"
        side_effects:
          - "same release cascade as PRACTICING -> TERMINATED"
      - from: PRACTICING
        to: TERMINATED
        trigger: "POST /branch-office/advisors/{id}/terminate"
        actor: HomeOfficeAdmin
        preconditions:
          - "advisor.status in {PRACTICING, RETIRING}"
        side_effects:
          - "advisor.branch_id cleared"
          - "branch.staffing_status -> UNSTAFFED (BOA stays but branch loses FULLY_STAFFED if advisor gone)"
          - "branch.operating_status -> SUSPENDED (no advisor to run the practice)"
          - "territory assignment released: assigned_advisor_id = null, assignment_end = now, territory.status -> OPEN"
          - "any SUBMITTED SolicitationRequest by this advisor -> WITHDRAWN"

  - entity: Branch
    initial_state: PROPOSED
    terminal_states: [CLOSED]
    transitions:
      - from: PROPOSED
        to: SITE_APPROVED
        trigger: "POST /branch-office/branches/{id}/approve-site"
        actor: HomeOfficeAdmin
        preconditions:
          - "branch.operating_status == PROPOSED"
          - "branch.territory_id is set and the territory status != RETIRED"
          - "no SIGNED LeaseAgreement on another branch whose [term_start, term_end] closed interval intersects the supplied lease window (closed-interval adjacency conflicts)"
        side_effects:
          - "creates a SIGNED LeaseAgreement for the branch"
      - from: SITE_APPROVED
        to: OPEN
        trigger: "POST /branch-office/branches/{id}/open"
        actor: HomeOfficeAdmin
        preconditions:
          - "branch.operating_status == SITE_APPROVED"
          - "branch.staffing_status == FULLY_STAFFED (advisor assigned AND an ACTIVE BOA)"
        side_effects:
          - "creates the first OPEN BranchFinancialPeriod covering the current calendar month"
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /branch-office/branches/{id}/suspend"
        actor: HomeOfficeAdmin
        preconditions:
          - "branch.operating_status == OPEN"
        side_effects:
          - "SUBMITTED SolicitationRequests by the branch's advisor remain SUBMITTED but cannot be approved while SUSPENDED"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /branch-office/branches/{id}/reinstate"
        actor: HomeOfficeAdmin
        preconditions:
          - "branch.operating_status == SUSPENDED"
          - "branch.staffing_status == FULLY_STAFFED"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /branch-office/branches/{id}/close"
        actor: HomeOfficeAdmin
        preconditions:
          - "branch.operating_status == SUSPENDED"
          - "no BranchFinancialPeriod in status OPEN or CLOSED (all periods FINALIZED)"
          - "no GoodwillTransfer on this branch in {OFFERED, NEGOTIATING, ACCEPTED}"
        side_effects:
          - "BOA status -> RELEASED, branch_id cleared"
          - "SIGNED LeaseAgreement -> TERMINATED"
          - "territory released to OPEN"

  - entity: TrainingProgram
    initial_state: ACTIVE
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: ACTIVE
        to: MILESTONE_PENDING
        trigger: "POST /branch-office/training-programs/{id}/submit-milestone"
        actor: Advisor
        preconditions:
          - "program.status in {ACTIVE, REMEDIATION}"
          - "acting advisor is the program's advisor"
        side_effects: []
      - from: MILESTONE_PENDING
        to: COMPLETED
        trigger: "POST /branch-office/training-programs/{id}/evaluate with outcome PASS"
        actor: HomeOfficeAdmin
        preconditions:
          - "program.status == MILESTONE_PENDING"
        side_effects:
          - "advisor.status -> VALIDATED"
      - from: MILESTONE_PENDING
        to: REMEDIATION
        trigger: "POST /branch-office/training-programs/{id}/evaluate with outcome FAIL"
        actor: HomeOfficeAdmin
        preconditions:
          - "program.status == MILESTONE_PENDING"
        side_effects:
          - "advisor remains TRAINEE (remediation loop: REMEDIATION -> MILESTONE_PENDING allowed again)"
      - from: MILESTONE_PENDING
        to: FAILED
        trigger: "POST /branch-office/training-programs/{id}/evaluate with outcome FAIL when program already failed one prior milestone (second consecutive cycle FAIL)"
        actor: HomeOfficeAdmin
        preconditions:
          - "program.status == MILESTONE_PENDING"
          - "an earlier MilestoneEvaluation with outcome FAIL exists for this program"
        side_effects:
          - "advisor.status -> TERMINATED"

  - entity: GoodwillTransfer
    initial_state: OFFERED
    terminal_states: [COMPLETED, DECLINED, EXPIRED, CANCELLED]
    transitions:
      - from: OFFERED
        to: NEGOTIATING
        trigger: "POST /branch-office/goodwill-transfers/{id}/counter-offer"
        actor: Advisor
        preconditions:
          - "transfer.status in {OFFERED, NEGOTIATING}"
          - "acting advisor is retiring_advisor_id or successor_advisor_id"
          - "new offer_price_cents > 0"
        side_effects:
          - "negotiation_round += 1 (cycle: OFFERED -> NEGOTIATING -> NEGOTIATING per round)"
      - from: NEGOTIATING
        to: NEGOTIATING
        trigger: "POST /branch-office/goodwill-transfers/{id}/counter-offer"
        actor: Advisor
        preconditions:
          - "transfer.status == NEGOTIATING"
          - "acting advisor is retiring_advisor_id or successor_advisor_id"
          - "the acting advisor did NOT make the immediately preceding offer (strict alternation)"
        side_effects:
          - "negotiation_round += 1"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /branch-office/goodwill-transfers/{id}/accept"
        actor: Advisor
        preconditions:
          - "transfer.status in {OFFERED, NEGOTIATING}"
          - "acting advisor is the party who did NOT make the most recent offer"
          - "escrow_deposit_cents >= 10% of offer_price_cents"
        side_effects:
          - "escrow deposit locked (no refund path except decline/cancel)"
      - from: NEGOTIATING
        to: ACCEPTED
        trigger: "POST /branch-office/goodwill-transfers/{id}/accept"
        actor: Advisor
        preconditions:
          - "transfer.status == NEGOTIATING"
          - "acting advisor is the party who did NOT make the most recent offer"
          - "escrow_deposit_cents >= 10% of offer_price_cents"
        side_effects: []
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /branch-office/goodwill-transfers/{id}/complete"
        actor: HomeOfficeAdmin
        preconditions:
          - "transfer.status == ACCEPTED"
          - "retiring advisor.status == RETIRING"
          - "successor advisor.status in {VALIDATED, PRACTICING}"
        side_effects:
          - "retiring advisor -> RETIRED, branch_id cleared"
          - "successor advisor.branch_id = transfer.branch_id, predecessor_advisor_id = retiring advisor"
          - "branch.staffing_status -> ADVISOR_ASSIGNED or FULLY_STAFFED per BOA presence"
          - "escrow_deposit_cents applied to the sale (leaves escrow; invariant: escrow balance of this transfer returns to 0)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /branch-office/goodwill-transfers/{id}/decline"
        actor: Advisor
        preconditions:
          - "transfer.status in {OFFERED, NEGOTIATING}"
          - "acting advisor is the party who did NOT make the most recent offer"
        side_effects:
          - "escrow_deposit_cents refunded to successor (escrow balance returns to 0)"
      - from: NEGOTIATING
        to: DECLINED
        trigger: "POST /branch-office/goodwill-transfers/{id}/decline"
        actor: Advisor
        preconditions:
          - "transfer.status == NEGOTIATING"
          - "acting advisor is the party who did NOT make the most recent offer"
        side_effects:
          - "escrow_deposit_cents refunded to successor"
      - from: OFFERED
        to: EXPIRED
        trigger: "system: clock advances past offer creation + 30 days without acceptance"
        actor: system
        preconditions:
          - "transfer.status in {OFFERED, NEGOTIATING}"
          - "current clock >= transfer.created_at + 30 days"
        side_effects:
          - "escrow_deposit_cents refunded"
      - from: NEGOTIATING
        to: EXPIRED
        trigger: "system: clock advances past offer creation + 30 days without acceptance"
        actor: system
        preconditions:
          - "transfer.status == NEGOTIATING"
          - "current clock >= transfer.created_at + 30 days"
        side_effects:
          - "escrow_deposit_cents refunded"
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /branch-office/goodwill-transfers/{id}/cancel"
        actor: HomeOfficeAdmin
        preconditions:
          - "transfer.status in {OFFERED, NEGOTIATING}"
        side_effects:
          - "escrow_deposit_cents refunded"

  - entity: Territory
    initial_state: OPEN
    terminal_states: [RETIRED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /branch-office/territories/{id}/assign"
        actor: HomeOfficeAdmin
        preconditions:
          - "territory.status == OPEN (or interval rules of priority 9 when re-assigning)"
        side_effects:
          - "assigned_advisor_id, assignment_start, assignment_end set"
      - from: ASSIGNED
        to: OPEN
        trigger: "system: assignment released (advisor termination, branch close, or advisor reassignment)"
        actor: system
        preconditions:
          - "the assigned advisor's branch link ends"
        side_effects:
          - "assigned_advisor_id cleared, assignment_end set to release instant"
      - from: OPEN
        to: RETIRED
        trigger: "POST /branch-office/territories/{id}/retire"
        actor: HomeOfficeAdmin
        preconditions:
          - "territory.status == OPEN (unassigned)"
        side_effects: []

  - entity: ProductShelfEntry
    initial_state: PROPOSED
    terminal_states: [RETIRED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /branch-office/product-shelf/{id}/approve"
        actor: CompliancePrincipal
        preconditions:
          - "entry.status == PROPOSED"
        side_effects: []
      - from: APPROVED
        to: RETIRED
        trigger: "POST /branch-office/product-shelf/{id}/retire"
        actor: CompliancePrincipal
        preconditions:
          - "entry.status == APPROVED"
        side_effects:
          - "new solicitation requests for the product_code become invalid (ERR_PRODUCT_NOT_ON_SHELF)"

  - entity: BranchOfficeAdministrator
    initial_state: HIRED
    terminal_states: [RELEASED]
    transitions:
      - from: HIRED
        to: ACTIVE
        trigger: "POST /branch-office/branches/{id}/assign-administrator"
        actor: HomeOfficeAdmin
        preconditions:
          - "administrator.status == HIRED"
          - "branch has no ACTIVE administrator"
        side_effects:
          - "administrator.branch_id set"
          - "branch.staffing_status -> FULLY_STAFFED if an advisor is assigned"
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "POST /branch-office/administrators/{id}/place-on-leave"
        actor: HomeOfficeAdmin
        preconditions:
          - "administrator.status == ACTIVE"
        side_effects:
          - "branch.staffing_status -> ADVISOR_ASSIGNED if advisor present"
      - from: ON_LEAVE
        to: ACTIVE
        trigger: "POST /branch-office/administrators/{id}/return-from-leave"
        actor: HomeOfficeAdmin
        preconditions:
          - "administrator.status == ON_LEAVE"
        side_effects:
          - "branch.staffing_status -> FULLY_STAFFED if advisor present"
      - from: ACTIVE
        to: RELEASED
        trigger: "branch close cascade or POST /branch-office/administrators/{id}/release"
        actor: HomeOfficeAdmin
        preconditions:
          - "administrator.status in {ACTIVE, ON_LEAVE}"
        side_effects:
          - "administrator.branch_id cleared"

  - entity: BranchFinancialPeriod
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /branch-office/financial-periods/{id}/close"
        actor: HomeOfficeAdmin
        preconditions:
          - "period.status == OPEN"
          - "current clock >= period.period_end"
        side_effects:
          - "recompute gross_revenue_cents, total_charges_cents, net_profit_cents, advisor_share_cents (provisional variant)"
          - "if net_profit_cents < 0: deficit_carryforward_cents = |net_profit_cents|"
      - from: CLOSED
        to: OPEN
        trigger: "POST /branch-office/financial-periods/{id}/reopen"
        actor: HomeOfficeAdmin
        preconditions:
          - "period.status == CLOSED"
          - "no later period for the same branch exists in any status"
        side_effects:
          - "deficit_carryforward_cents reset to 0 (will recompute on next close)"
      - from: CLOSED
        to: FINALIZED
        trigger: "POST /branch-office/financial-periods/{id}/finalize"
        actor: HomeOfficeAdmin
        preconditions:
          - "period.status == CLOSED"
        side_effects:
          - "recompute advisor_share_cents with FINAL variant (includes REVERSED-then-reposted charge corrections)"
          - "if net_profit_cents < 0: create DEFICIT_CARRYOVER BranchCharge on the next OPEN period of the same branch (or hold if none)"
          - "branch.service_tier recomputed (threshold trigger)"

  - entity: SolicitationRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /branch-office/solicitation-requests/{id}/approve"
        actor: CompliancePrincipal
        preconditions:
          - "request.status == SUBMITTED"
          - "advisor.status in {VALIDATED, PRACTICING}"
          - "advisor's branch.operating_status == OPEN"
          - "referenced ProductShelfEntry.status == APPROVED"
          - "if product complexity_level in {COMPLEX, RESTRICTED}: approver is a CompliancePrincipal distinct from the requesting advisor (segregation of duties)"
        side_effects: []
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /branch-office/solicitation-requests/{id}/deny"
        actor: CompliancePrincipal
        preconditions:
          - "request.status == SUBMITTED"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /branch-office/solicitation-requests/{id}/withdraw"
        actor: Advisor
        preconditions:
          - "request.status == SUBMITTED"
          - "acting advisor owns the request"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: branch-attribute-update-stale-version
    parent_entity: Branch
    write_endpoint: "PATCH /branch-office/branches/{id}"
    occ_field: "expected_branch_version"
    description: |
      Updating a Branch's household_count / assets_under_care_dollars with an
      expected_branch_version that does not match the branch's current version
      is rejected. This captures the case where another writer has just updated
      the branch (advancing version and possibly recomputing tier_score and
      service_tier) and the current writer's view of the branch is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: goodwill-counter-offer-stale-version
    parent_entity: GoodwillTransfer
    write_endpoint: "POST /branch-office/goodwill-transfers/{id}/counter-offer"
    occ_field: "expected_transfer_version"
    description: |
      Submitting a counter-offer against a GoodwillTransfer whose version has
      advanced since the client last observed it is rejected. This captures the
      case where the other party has just countered (advancing
      negotiation_round and version) and the current writer's view of the
      negotiation is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: advisor_profit_share
    trigger: "On BranchFinancialPeriod close (provisional variant) and finalize (final variant); recomputed whenever a BranchCharge posts or reverses while the period is OPEN or CLOSED."
    algorithm: tiered_pricing
    formula: |
      net = period.net_profit_cents   # gross_revenue_cents - total_charges_cents
      if net <= 0: share = 0
      else:
        tier1_base = min(net, 500000)
        tier2_base = min(max(net - 500000, 0), 500000)
        tier3_base = max(net - 1000000, 0)
        # ROUNDING ORDER PINNED: round each tier to whole cents half-up FIRST, then sum.
        share = round_half_up(tier1_base * 0.38)
              + round_half_up(tier2_base * 0.42)
              + round_half_up(tier3_base * 0.46)
      period.advisor_share_cents = share
    input_set: "BranchCharge rows with status == POSTED for the period; ProductionRecord revenue lines with status == POSTED and posted_at in [period_start, period_end)."
    constants:
      TIER1_CAP_CENTS: 500000
      TIER1_RATE: 0.38
      TIER2_CAP_CENTS: 500000
      TIER2_RATE: 0.42
      TIER3_RATE: 0.46
    precision: "whole cents; round per-tier half-up BEFORE summing (order pinned)"
    variants:
      - name: provisional
        when: "period.status in {OPEN, CLOSED}"
        difference: "Excludes charge corrections whose reversal was itself reversed (re-posted) after close; snapshot semantics on close."
      - name: final
        when: "period.status transitions CLOSED -> FINALIZED"
        difference: "Includes all POSTED charges as of finalize instant, including late re-posted corrections; may differ from provisional share, and the delta is the payable adjustment."

  - name: goodwill_valuation
    trigger: "On GoodwillTransfer creation; offer_price_cents initialized from this valuation."
    algorithm: aggregation
    formula: |
      # trailing 12 complete calendar months before the offer's creation month
      window = [first day of (created_month - 12 months), first day of created_month)
      trailing_revenue = sum(ProductionRecord.gross_commission_cents
                             where advisor.branch_id == transfer.branch_id
                               and status == POSTED
                               and posted_at in window)
      INTERNAL_SUCCESSION: offer_price = round_half_up(trailing_revenue * 0.75)
      OPEN_MARKET:         offer_price = round_half_up(trailing_revenue * 1.10)
    input_set: "POSTED ProductionRecord rows of the branch's advisor(s) in the trailing-12-month window; reversed rows excluded."
    constants:
      INTERNAL_MULTIPLE: 0.75
      OPEN_MARKET_MULTIPLE: 1.10
    precision: "whole cents, round_half_up"
    variants:
      - name: internal_succession
        when: "valuation_mode == INTERNAL_SUCCESSION"
        difference: "0.75 multiple — discounted price for an internal successor continuing the practice."
      - name: open_market
        when: "valuation_mode == OPEN_MARKET"
        difference: "1.10 multiple — premium price when the practice is listed to an external buyer; identical trailing revenue yields a materially higher offer."

  - name: service_tier_assignment
    trigger: "On every PATCH of Branch household_count or assets_under_care_dollars, and on BranchFinancialPeriod finalize."
    algorithm: threshold
    formula: |
      # EVALUATION ORDER PINNED (circular-looking dependency made explicit):
      # tier_score depends ONLY on raw inputs, never on the previous service_tier.
      score = branch.household_count * 10 + (branch.assets_under_care_dollars // 100000)
      if score < 300:  tier = TIER_1
      elif score <= 900: tier = TIER_2     # boundary inclusive: score == 900 -> TIER_2
      else: tier = TIER_3                  # score >= 901 -> TIER_3
      branch.tier_score = score
      branch.service_tier = tier
    input_set: "The branch's current household_count and assets_under_care_dollars only; financial periods and charges do NOT feed the score."
    constants:
      HOUSEHOLD_WEIGHT: 10
      AUM_DIVISOR_DOLLARS: 100000
      TIER1_MAX_EXCLUSIVE: 300
      TIER2_MAX_INCLUSIVE: 900
    precision: "integer score; floor division on AUM component"

  - name: training_production_window
    trigger: "On MilestoneEvaluation creation (training-program evaluate endpoint)."
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER PINNED: each ProductionRecord already carries
      # commissions_cents = round_half_up(gross * payout_rate) computed PER RECORD.
      # The milestone sum adds those per-record rounded values — it does NOT
      # re-round the unrounded gross sum.
      production_cents = sum(record.commissions_cents
                             where record.advisor_id == program.advisor_id
                               and record.status == POSTED
                               and program.start_date <= record.posted_at <= window_end)
      outcome = PASS if production_cents >= program.goal_cents else FAIL
    input_set: "ProductionRecord rows with status == POSTED for the program's advisor; window closed at both ends [start_date, window_end]."
    constants: {}
    precision: "whole cents; per-record round_half_up then integer sum (never sum-then-round)"

  - name: branch_net_profit
    trigger: "On every BranchCharge post/reverse and on period close/finalize."
    algorithm: waterfall_allocation
    formula: |
      gross = sum(revenue lines POSTED in [period_start, period_end))
      # WATERFALL ORDER PINNED: charges apply in charge_type order
      #   1) DEFICIT_CARRYOVER (from prior period)
      #   2) LEASE_RENT
      #   3) BOA_PAYROLL
      #   4) EQUIPMENT
      # Within one charge_type, apply by posted created_at ASC (never id).
      total_charges = sum(POSTED BranchCharge.amount_cents for the period)
      net_profit_cents = gross - total_charges
      deficit_carryforward_cents = abs(net_profit_cents) if net_profit_cents < 0 else 0
    input_set: "BranchCharge rows with status == POSTED for the period (REVERSED rows excluded, even if originally posted inside the window)."
    constants: {}
    precision: "whole cents; integer arithmetic"
    variants:
      - name: provisional
        when: "period OPEN or CLOSED"
        difference: "Snapshot of currently POSTED charges; a later reversal changes the snapshot only on recompute."
      - name: final
        when: "period FINALIZED"
        difference: "Frozen at finalize; subsequent charge posts to this period are rejected (ERR_PERIOD_FINALIZED), so the final net never drifts."

  - name: solicitation_batch_gate
    trigger: "On SolicitationRequest approval."
    algorithm: constraint_propagation
    formula: |
      # Cross-entity gate: approval is valid only if ALL of:
      #   advisor.status in {VALIDATED, PRACTICING}
      #   advisor.branch.operating_status == OPEN
      #   product entry exists and status == APPROVED
      #   if product.complexity_level in {COMPLEX, RESTRICTED}: approver role == CompliancePrincipal
      # The product lookup by product_code is itself order-sensitive: among
      # entries sharing a code, only the APPROVED one (unique by constraint) matches.
      pass if all gates hold else reject with first-failing validation's error_id
    input_set: "The request, its advisor, the advisor's branch, and the APPROVED ProductShelfEntry matching product_code."
    constants: {}
    precision: "boolean gate; first-failure error ordering per §1.4 priorities"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All path ids and body FK references resolve to existing records (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target entity is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "Segregation of duties: COMPLEX/RESTRICTED product solicitations may not be approved by the requesting advisor's own principal session; approver must be CompliancePrincipal distinct from requester"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /branch-office/solicitation-requests/{id}/approve"
  - priority: 6
    category: business_safety
    check: "Goodwill negotiation strict alternation: the acting advisor must not be the maker of the immediately preceding offer"
    error_id: ERR_NEGOTIATION_TURN
    http_status: 409
    applies_to: "POST /branch-office/goodwill-transfers/{id}/counter-offer, POST /branch-office/goodwill-transfers/{id}/accept, POST /branch-office/goodwill-transfers/{id}/decline"
  - priority: 7
    category: business_constraint
    check: "Single-advisor invariant: target branch has no other advisor with status not in {RETIRED, TERMINATED}"
    error_id: ERR_BRANCH_OCCUPIED
    http_status: 409
    applies_to: "POST /branch-office/advisors/{id}/assign-branch"
  - priority: 8
    category: business_constraint
    check: "Single-administrator invariant: target branch has no ACTIVE BranchOfficeAdministrator"
    error_id: ERR_BOA_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /branch-office/branches/{id}/assign-administrator"
  - priority: 9
    category: business_temporal
    check: "Territory assignment overlap: new assignment [start, end) must not intersect the territory's current half-open assignment interval; adjacency (new start == existing end) is ALLOWED"
    error_id: ERR_TERRITORY_OVERLAP
    http_status: 409
    applies_to: "POST /branch-office/territories/{id}/assign"
  - priority: 10
    category: business_temporal
    check: "Lease occupancy overlap: new lease [term_start, term_end] (CLOSED interval) must not intersect another SIGNED lease on the same site address; adjacency (new start == existing end + 1 day boundary touching) CONFLICTS because both endpoints are inclusive"
    error_id: ERR_LEASE_OVERLAP
    http_status: 409
    applies_to: "POST /branch-office/branches/{id}/approve-site"
  - priority: 11
    category: business_constraint
    check: "Door-knock capacity: non-archived DoorKnockContact count for the territory must be < household_capacity before registering a new contact"
    error_id: ERR_TERRITORY_CAPACITY
    http_status: 409
    applies_to: "POST /branch-office/territories/{id}/contacts"
  - priority: 12
    category: business_constraint
    check: "Contact timestamp inside assignment window: contacted_at must fall in [assignment_start, assignment_end)"
    error_id: ERR_CONTACT_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /branch-office/territories/{id}/contacts"
  - priority: 13
    category: business_referential
    check: "Solicitation product exists as an APPROVED ProductShelfEntry (lookup by product_code)"
    error_id: ERR_PRODUCT_NOT_ON_SHELF
    http_status: 422
    applies_to: "POST /branch-office/solicitation-requests, POST /branch-office/solicitation-requests/{id}/approve"
  - priority: 14
    category: business_fiscal
    check: "Escrow sufficiency: escrow_deposit_cents >= round_half_up(offer_price_cents * 0.10)"
    error_id: ERR_ESCROW_INSUFFICIENT
    http_status: 422
    applies_to: "POST /branch-office/goodwill-transfers/{id}/accept"
  - priority: 15
    category: business_fiscal
    check: "Period mutability: no BranchCharge may post to a FINALIZED period"
    error_id: ERR_PERIOD_FINALIZED
    http_status: 409
    applies_to: "POST /branch-office/financial-periods/{id}/charges"
  - priority: 16
    category: business_fiscal
    check: "Training goal: milestone production_cents >= goal_cents required for PASS outcome"
    error_id: ERR_GOAL_NOT_MET
    http_status: 422
    applies_to: "POST /branch-office/training-programs/{id}/evaluate (only when caller forces outcome=PASS)"
  - priority: 17
    category: business_constraint
    check: "Uniqueness: advisor email unique; BOA email unique; product_code unique among APPROVED entries; household_address unique per territory among non-archived contacts"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "creation endpoints"
  - priority: 18
    category: business_constraint
    check: "Input shape: required fields present, enums valid, integer ranges respected (salary > 0, household_capacity >= 1, amounts > 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 19
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /branch-office/branches/{id}, POST /branch-office/goodwill-transfers/{id}/counter-offer"
  - priority: 20
    category: business_temporal
    check: "Period close timing: current clock must be >= period_end before close"
    error_id: ERR_PERIOD_NOT_CLOSABLE
    http_status: 422
    applies_to: "POST /branch-office/financial-periods/{id}/close"
  - priority: 21
    category: business_constraint
    check: "Reopen recency: only the branch's latest period may be reopened"
    error_id: ERR_PERIOD_NOT_LATEST
    http_status: 409
    applies_to: "POST /branch-office/financial-periods/{id}/reopen"
  - priority: 22
    category: state
    check: "Branch open/reinstate requires staffing_status == FULLY_STAFFED"
    error_id: ERR_BRANCH_NOT_FULLY_STAFFED
    http_status: 409
    applies_to: "POST /branch-office/branches/{id}/open, POST /branch-office/branches/{id}/reinstate"
  - priority: 23
    category: state
    check: "Branch assignment requires advisor.status == VALIDATED"
    error_id: ERR_ADVISOR_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /branch-office/advisors/{id}/assign-branch"
  - priority: 24
    category: business_constraint
    check: "Branch close and retirement rescind blocked while a GoodwillTransfer on the branch is OFFERED/NEGOTIATING/ACCEPTED"
    error_id: ERR_TRANSFER_ACTIVE
    http_status: 409
    applies_to: "POST /branch-office/branches/{id}/close, POST /branch-office/advisors/{id}/rescind-retirement"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Advisors ----
  - method: POST
    path: /branch-office/advisors
    description: Register an advisor candidate.
    roles: [HomeOfficeAdmin]
    code: 201
    input: [full_name, email, hire_date]
    output: Advisor
    side_effects: []
  - method: GET
    path: /branch-office/advisors/{id}
    description: Fetch one advisor.
    roles: [HomeOfficeAdmin, Advisor, CompliancePrincipal]
    code: 200
    input: []
    output: Advisor
    side_effects: []
  - method: GET
    path: /branch-office/advisors
    description: List advisors with optional filters (status, branch_id, predecessor_advisor_id).
    roles: [HomeOfficeAdmin, CompliancePrincipal]
    code: 200
    input: ["status?", "branch_id?", "predecessor_advisor_id?"]
    output: Advisor[]
    side_effects: []
  - method: GET
    path: /branch-office/advisors/{id}/goodwill-transfers
    description: List goodwill transfers where the advisor is the retiring party.
    roles: [HomeOfficeAdmin, Advisor]
    code: 200
    input: []
    output: GoodwillTransfer[]
    side_effects: []
  - method: GET
    path: /branch-office/advisors/{id}/solicitation-requests
    description: List solicitation requests submitted by the advisor.
    roles: [HomeOfficeAdmin, Advisor, CompliancePrincipal]
    code: 200
    input: []
    output: SolicitationRequest[]
    side_effects: []
  - method: GET
    path: /branch-office/advisors/{id}/production-records
    description: List production records of the advisor.
    roles: [HomeOfficeAdmin, Advisor]
    code: 200
    input: []
    output: ProductionRecord[]
    side_effects: []
  - method: POST
    path: /branch-office/advisors/{id}/enroll-training
    description: Enroll a candidate into a training program (CANDIDATE -> TRAINEE).
    roles: [HomeOfficeAdmin]
    code: 201
    input: [goal_cents, start_date]
    output: TrainingProgram
    side_effects: ["advisor.status -> TRAINEE", "creates TrainingProgram ACTIVE"]
  - method: POST
    path: /branch-office/advisors/{id}/assign-branch
    description: Assign a VALIDATED advisor to a branch (VALIDATED -> PRACTICING).
    roles: [HomeOfficeAdmin]
    code: 200
    input: [branch_id]
