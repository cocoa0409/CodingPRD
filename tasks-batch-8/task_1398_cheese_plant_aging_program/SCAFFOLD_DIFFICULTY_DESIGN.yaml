  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: vat_booking_half_open_interval_adjacency
        grounds:
          - state_machines.Vat.IDLE_to_BOOKED
          - errors[ERR_VAT_OVERLAP]
        distinguishing_aspect: |
          Half-open [start,end) semantics on the Vat resource: a booking whose
          start equals the existing booking's end is ADJACENT and allowed, while
          one minute of true overlap rejects — geometric adjacency treatment.
        test_recipe:
          setup:
            - "Vat VAT-1 with one SCHEDULED booking occupying half-open interval [2026-08-01T02:00:00Z, 2026-08-01T06:00:00Z); vat.version re-read after that booking"
            - "Accepted intake with 20000 L total; both additive lots RELEASED with ample stock"
          setup_api_calls:
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /plant/plants", payload: { name: "Plant O", license_number: "WI-114" }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plant/plants/${plant_id}/vats", payload: { code: "VAT-1", capacity_liters: 20000 }, as: PlantAdmin, captures: { vat_id: $.data.id, vat_v1: $.data.version } }
