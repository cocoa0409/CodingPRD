# =============================================================================
# SCAFFOLD — task_2995_reentry_employment_services
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
#
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Reentry Employment Services (reentry services organization): pre-release engagement with
  assessment, documentation gathering and release planning inside the facility, immediate
  post-release needs response covering identification, housing, transportation and health
  coverage enrollment, employment readiness training with disclosure coaching about criminal
  history and interview practice, employer partnership development with fidelity bonding, tax
  credit information and job matching to record-relevant restrictions, occupational licensing
  barrier navigation with petitions for review and record relief referrals, supportive services
  including subsidized work experience and tool or uniform stipends, supervision requirement
  coordination with probation and parole officers on work schedules, retention follow-up and
  recidivism outcome tracking for funders

domain_name: reentry-employment-services
api_prefix: "/"

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # graph: Placement is a junction of Participant × JobOpening × FunderGrant,
  # SupportRequest a junction of Participant × FunderGrant, SessionEnrollment a
  # junction of Participant × ReadinessSession. Every entity is a top-level
  # collection; linkage is by foreign key, never by URL nesting depth.

  state_machine_shape: parallel
  # Participant carries three independent dimensions on one row
  # (stage × suspension_status × license_relief_status, the last one cyclic);
  # Placement carries two (employment_status × bonding_status); SupportRequest
  # is cyclic (SUBMITTED ⇄ INFO_REQUESTED); WorkShift is cyclic
  # (SCHEDULED ⇄ CONFLICTED); FunderGrant.funding_posture is a derived
  # aggregate that gates SupportRequest creation and approval.

  relationship_patterns:
    - one_to_many        # Participant → SupervisionCase / SupportRequest / Placement
    - many_to_many       # Participant ↔ JobOpening via Placement; Participant ↔ ReadinessSession via SessionEnrollment
    - cross_aggregate    # Placement and SupportRequest both debit FunderGrant

  role_model: segregation_of_duties
  # ProgramDirector who reviewed a SupportRequest may not settle it; the
  # CaseManager who submitted it may not review it; SupervisionOfficer may only
  # act on the SupervisionCase whose officer_user_id equals their X-User-ID.

  consistency_model: immediate

  difficulty_level: expert_plus
  target_counts:
    entities: 10
    endpoints: 61
    error_codes: 59
    calculations: 12
    state_machines: 14
    state_transitions: 69
    validation_rules: 55
    roles: 6
    concurrency_rules: 3

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Participant legal name", constraints: "1..120 chars" }
      - { name: facility_name, type: string, source: input, description: "Correctional facility of pre-release engagement" }
      - { name: facility_state, type: string, source: input, description: "Two-letter USPS state code of the facility", constraints: "exactly 2 uppercase letters" }
      - { name: expected_release_date, type: string, source: input, description: "Scheduled release date (ISO 8601 calendar date, no time part)" }
      - { name: actual_release_date, type: string, source: system, default: null, description: "Set by POST /participants/{id}/release" }
      - { name: record_categories, type: array, source: input, description: "Conviction categories used by record-relevant job matching", constraints: "non-empty array of DRUG_OFFENSE | PROPERTY_OFFENSE | VIOLENT_OFFENSE | FINANCIAL_OFFENSE | DUI | OTHER; no duplicates" }
      - { name: required_document_types, type: array, source: input, description: "Vital documents this participant must gather before release", constraints: "non-empty array of STATE_ID | SSN_CARD | BIRTH_CERTIFICATE | WORK_HISTORY | MEDICAID_APPLICATION | DD214; no duplicates" }
      - { name: verified_document_types, type: array, source: computed, default: [], description: "Subset of required_document_types confirmed by POST /participants/{id}/document-verifications" }
      - { name: doc_completeness_pct, type: number, source: computed, default: 0.0, description: "See calculations.doc_completeness_pct — one decimal place" }
      - { name: assessment_domain_scores, type: object, source: input, default: null, description: "Five 0..4 barrier-domain scores captured by POST /participants/{id}/assessment: housing_score, transportation_score, health_score, work_history_score, documentation_score" }
      - { name: barrier_score, type: number, source: computed, default: null, description: "See calculations.participant_barrier_score — one decimal place, null until assessment recorded" }
      - { name: barrier_tier, type: enum, source: computed, default: null, description: "LOW | MODERATE | HIGH — threshold bands over barrier_score; null until assessment recorded" }
      - { name: housing_plan_type, type: enum, source: input, default: null, description: "FAMILY_REUNIFICATION | TRANSITIONAL_HOUSING | SHELTER | INDEPENDENT_LEASE — set by PUT /participants/{id}/release-plan" }
      - { name: transportation_plan_type, type: enum, source: input, default: null, description: "TRANSIT_PASS | OWN_VEHICLE | EMPLOYER_SHUTTLE | RIDE_SHARE_STIPEND | NONE — feeds job-match access_component" }
      - { name: health_coverage_target, type: enum, source: input, default: null, description: "MEDICAID | MARKETPLACE | EMPLOYER_PLAN | VA | NONE — coverage enrollment goal in the release plan" }
      - { name: planned_release_date, type: string, source: input, default: null, description: "Release date asserted by the current release plan revision" }
      - { name: release_plan_status, type: enum, source: system, default: "NONE", description: "NONE | DRAFT | APPROVED | SUPERSEDED — DRAFT on every release-plan write, APPROVED by the director, SUPERSEDED when a newer revision replaces an APPROVED plan" }
      - { name: release_plan_revision, type: integer, source: system, default: 0, description: "Incremented by one on every accepted PUT /participants/{id}/release-plan" }
      - { name: stage, type: enum, source: system, default: "PRE_RELEASE", description: "PRE_RELEASE | RELEASE_READY | POST_RELEASE | PLACED | RETENTION | EXITED — see state_machines.Participant_stage" }
      - { name: suspension_status, type: enum, source: system, default: "NONE", description: "NONE | SUSPENDED — independent dimension, see state_machines.Participant_suspension" }
      - { name: suspension_reason, type: string, source: system, default: null, description: "Free-text reason recorded with the most recent suspension" }
      - { name: license_relief_status, type: enum, source: system, default: "NONE", description: "NONE | PETITION_SUBMITTED | INFO_REQUESTED | RELIEF_GRANTED | PETITION_DENIED | PETITION_WITHDRAWN — occupational licensing barrier navigation dimension, see state_machines.Participant_license_relief" }
      - { name: license_relief_occupation_code, type: string, source: system, default: null, description: "SOC code the petition for review covers; compared to JobOpening.license_occupation_code" }
      - { name: petition_rounds_used, type: integer, source: system, default: 0, description: "Count of INFO_REQUESTED → PETITION_SUBMITTED loops consumed; capped by PETITION_MAX_ROUNDS" }
      - { name: engagement_posture, type: enum, source: computed, default: "OPEN", description: "OPEN | RESTRICTED | FROZEN — see calculations.participant_engagement_posture; gates placements, support requests and enrollments" }
      - { name: exit_reason, type: enum, source: system, default: null, description: "EMPLOYED_STABLE | PROGRAM_COMPLETE | DISENGAGED | RETURNED_TO_CUSTODY | OTHER" }
      - { name: exit_date, type: string, source: system, default: null, description: "Calendar date recorded by POST /participants/{id}/exit; window filter key of the EXIT_BASED outcome variant" }
      - { name: assigned_case_manager_user_id, type: string, source: input, default: null, description: "Opaque CaseManager operator id; never compared to any entity id" }

  - name: SupervisionCase
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the supervised participant, supplied in the create body" }
      - { name: supervision_type, type: enum, source: input, description: "PROBATION | PAROLE | POST_RELEASE_CONTROL" }
      - { name: officer_user_id, type: string, source: input, description: "Opaque SupervisionOfficer operator id; ownership checks compare X-User-ID to this field, never to any entity id" }
      - { name: officer_name, type: string, source: input, description: "Supervising officer display name" }
      - { name: expected_discharge_date, type: string, source: input, default: null, description: "Planned discharge date from supervision" }
      - { name: status, type: enum, source: system, default: "PENDING_CONTACT", description: "PENDING_CONTACT | ACTIVE | DISCHARGED | REVOKED — see state_machines.SupervisionCase_status" }
      - { name: work_authorization_status, type: enum, source: system, default: "NOT_REQUESTED", description: "NOT_REQUESTED | APPROVED | SUSPENDED | DENIED — independent dimension, see state_machines.SupervisionCase_work_authorization" }
      - { name: approved_window_start_minute, type: integer, source: system, default: null, description: "Inclusive start of the daily UTC work window, minutes from midnight", constraints: "0..1440" }
      - { name: approved_window_end_minute, type: integer, source: system, default: null, description: "Inclusive end of the daily UTC work window, minutes from midnight", constraints: "0..1440; strictly greater than approved_window_start_minute" }
      - { name: authorization_change_count, type: integer, source: system, default: 0, description: "Number of accepted POST /supervision-cases/{id}/work-authorization decisions" }

  - name: EmployerPartnership
    parent: null
    common_fields: true
    fields:
      - { name: employer_name, type: string, source: input, description: "Partner employer legal name" }
      - { name: industry, type: enum, source: input, description: "MANUFACTURING | CONSTRUCTION | HOSPITALITY | LOGISTICS | HEALTHCARE | RETAIL | SKILLED_TRADES" }
      - { name: excluded_record_categories, type: array, source: input, default: [], description: "Record categories this employer refuses across all of its openings" }
      - { name: wotc_certified, type: boolean, source: input, default: false, description: "Employer is enrolled for Work Opportunity Tax Credit paperwork; contributes to job_match_score" }
      - { name: fidelity_bond_enabled, type: boolean, source: system, default: false, description: "Set true by POST /employer-partnerships/{id}/bonding-agreement" }
      - { name: bond_coverage_cents, type: integer, source: system, default: null, description: "Fidelity bond coverage amount in cents" }
      - { name: bond_effective_date, type: string, source: system, default: null, description: "First date the fidelity bond covers placements" }
      - { name: max_concurrent_placements, type: integer, source: input, description: "Cap on placements with employment_status == ACTIVE across all of this employer's openings", constraints: ">= 1" }
      - { name: active_placement_count, type: integer, source: computed, default: 0, description: "Count of Placement rows on this employer's openings with employment_status == ACTIVE" }
      - { name: status, type: enum, source: system, default: "PROSPECT", description: "PROSPECT | ENGAGED | ACTIVE | SUSPENDED | TERMINATED — see state_machines.EmployerPartnership_status" }

  - name: JobOpening
    parent: null
    common_fields: true
    fields:
      - { name: partnership_id, type: string, source: system, description: "FK -> EmployerPartnership.id; taken from the creation path" }
      - { name: title, type: string, source: input, description: "Job title" }
      - { name: occupation_code, type: string, source: input, description: "SOC occupation code, e.g. 51-4031" }
      - { name: hourly_wage_cents, type: integer, source: input, description: "Offered wage in cents per hour", constraints: ">= 725" }
      - { name: weekly_hours, type: number, source: input, description: "Scheduled hours per week", constraints: "> 0 and <= 60" }
      - { name: openings_count, type: integer, source: input, description: "Total seats this opening can fill", constraints: ">= 1" }
      - { name: barred_record_categories, type: array, source: input, default: [], description: "Record categories barred for this specific opening, in addition to the employer-level exclusions" }
      - { name: requires_license, type: boolean, source: input, default: false, description: "Opening is gated by an occupational license" }
      - { name: license_occupation_code, type: string, source: input, default: null, description: "SOC code of the license the opening requires; compared to Participant.license_relief_occupation_code" }
      - { name: requires_fidelity_bond, type: boolean, source: input, default: false, description: "Placement on this opening may only request bonding when the partnership has fidelity_bond_enabled == true" }
      - { name: transit_accessible, type: boolean, source: input, default: false, description: "Worksite is reachable by public transit; contributes to job_match_score access_component" }
      - { name: offered_count, type: integer, source: computed, default: 0, description: "Count of Placement rows on this opening with employment_status == OFFERED" }
      - { name: filled_count, type: integer, source: computed, default: 0, description: "Count of Placement rows on this opening with employment_status == ACTIVE" }
      - { name: remaining_openings, type: integer, source: computed, description: "= openings_count - offered_count - filled_count; never negative" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FILLED | CLOSED — see state_machines.JobOpening_status" }

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the placed participant" }
      - { name: job_opening_id, type: string, source: input, description: "FK -> JobOpening.id; the opening being filled" }
      - { name: grant_id, type: string, source: input, default: null, description: "FK -> FunderGrant.id; funds the wage subsidy; required when subsidy_track == SUBSIDIZED_WORK_EXPERIENCE, must be null otherwise" }
      - { name: subsidy_track, type: enum, source: input, description: "NONE | SUBSIDIZED_WORK_EXPERIENCE" }
      - { name: start_date, type: string, source: input, description: "First scheduled work date (ISO calendar date)" }
      - { name: employment_status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACTIVE | DECLINED | SEPARATED — see state_machines.Placement_employment" }
      - { name: bonding_status, type: enum, source: system, default: "NONE", description: "NONE | REQUESTED | BONDED | CLAIMED | EXPIRED — independent dimension, see state_machines.Placement_bonding" }
      - { name: schedule_compliance, type: enum, source: computed, default: "COMPLIANT", description: "COMPLIANT | OUT_OF_COMPLIANCE — OUT_OF_COMPLIANCE while this placement owns at least one WorkShift with status == CONFLICTED" }
      - { name: match_score, type: integer, source: computed, description: "See calculations.job_match_score — pinned at creation from the then-current participant, opening and partnership fields" }
      - { name: match_breakdown, type: object, source: computed, description: "The six job_match_score components as stored at creation: wage_component, hours_component, barrier_fit_component, access_component, readiness_component, wotc_bonus" }
      - { name: projected_subsidy_cents, type: integer, source: computed, default: 0, description: "See calculations.wage_subsidy_total variant PROJECTED; recomputed on every WorkShift write on this placement" }
      - { name: actual_subsidy_cents, type: integer, source: computed, default: 0, description: "See calculations.wage_subsidy_total variant ACTUAL; recomputed on every WorkShift write on this placement" }
      - { name: disbursed_subsidy_cents, type: integer, source: system, default: 0, description: "Amount actually moved to FunderGrant.disbursed_cents when this placement separated; 0 while employment_status != SEPARATED" }
      - { name: separation_reason, type: enum, source: input, default: null, description: "VOLUNTARY_QUIT | TERMINATED_FOR_CAUSE | LAYOFF | SCHEDULE_CONFLICT | RETURNED_TO_CUSTODY | CONTRACT_END" }
      - { name: separation_date, type: string, source: input, default: null, description: "Calendar date of separation" }
      - { name: retention_30_outcome, type: enum, source: system, default: null, description: "RETAINED | SEPARATED | UNREACHABLE — recorded by the 30-day retention check" }
      - { name: retention_60_outcome, type: enum, source: system, default: null, description: "RETAINED | SEPARATED | UNREACHABLE — recorded by the 60-day retention check" }
      - { name: retention_90_outcome, type: enum, source: system, default: null, description: "RETAINED | SEPARATED | UNREACHABLE — recorded by the 90-day retention check; the numerator source of calculations.grant_outcome_report" }
      - { name: recidivism_event, type: enum, source: system, default: "NONE", description: "NONE | NEW_ARREST | TECHNICAL_VIOLATION | REVOCATION | RETURN_TO_CUSTODY — latest value recorded by any retention check" }
      - { name: last_retention_check_at, type: string, source: system, default: null, description: "Logical-clock instant of the most recent retention check (ISO 8601 UTC, three fractional digits)" }

  - name: WorkShift
    parent: null
    common_fields: true
    fields:
      - { name: placement_id, type: string, source: system, description: "FK -> Placement.id; taken from the creation path" }
      - { name: starts_at, type: string, source: input, description: "Shift start (ISO 8601 UTC instant, three fractional digits)" }
      - { name: ends_at, type: string, source: input, description: "Shift end (ISO 8601 UTC instant); must be strictly after starts_at and on the same UTC calendar date" }
      - { name: scheduled_hours, type: number, source: computed, description: "= (ends_at - starts_at) in minutes / 60, ROUND_HALF_UP to 2 decimals" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | WORKED | CANCELLED | CONFLICTED — see state_machines.WorkShift_status" }
      - { name: conflict_reason, type: enum, source: system, default: null, description: "WORK_AUTHORIZATION_SUSPENDED | SUPERVISION_REVOKED — set when the shift is driven to CONFLICTED by a supervision cascade" }

  - name: FunderGrant
    parent: null
    common_fields: true
    fields:
      - { name: funder_name, type: string, source: input, description: "Funder display name" }
      - { name: program_year, type: integer, source: input, description: "Program year the award belongs to", constraints: "2000..2100" }
      - { name: authorized_cents, type: integer, source: input, description: "Total award authorized by the funder", constraints: "> 0" }
      - { name: allowed_categories, type: array, source: input, description: "Support categories this grant may fund", constraints: "non-empty array of TOOLS | UNIFORM | TRANSIT_PASS | ID_FEE | LICENSE_FEE | WAGE_SUBSIDY" }
      - { name: per_participant_cap_cents, type: integer, source: input, description: "Ceiling on one participant's cumulative support charges against this grant", constraints: "> 0" }
      - { name: retention_benchmark_pct, type: number, source: input, description: "Funder's 90-day retention benchmark, one decimal place", constraints: "0.0..100.0" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "See calculations.grant_ledger — obligations not yet paid out" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "See calculations.grant_ledger — obligations already paid out" }
      - { name: available_cents, type: integer, source: computed, description: "= authorized_cents - committed_cents - disbursed_cents" }
      - { name: funding_posture, type: enum, source: computed, default: "OPEN", description: "OPEN | RESTRICTED | EXHAUSTED — see calculations.grant_ledger; gates support-request creation and approval" }
      - { name: open_request_count, type: integer, source: computed, default: 0, description: "Count of SupportRequest rows on this grant with status IN {SUBMITTED, INFO_REQUESTED, DEFERRED}" }

  - name: SupportRequest
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; beneficiary of the supportive service" }
      - { name: grant_id, type: string, source: input, description: "FK -> FunderGrant.id; funding source" }
      - { name: category, type: enum, source: input, description: "TOOLS | UNIFORM | TRANSIT_PASS | ID_FEE | LICENSE_FEE — must be a member of the grant's allowed_categories" }
      - { name: line_items, type: array, source: input, description: "Non-empty array of objects { description: string, unit_cost_cents: integer > 0, quantity: integer > 0 }; array order is the pinned evaluation order of calculations.support_request_award" }
      - { name: justification, type: string, source: input, default: null, description: "Narrative justification for the funder file" }
      - { name: requested_cents, type: integer, source: computed, description: "See calculations.support_request_award — per-line rounding, then sum" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "See calculations.support_request_settlement — tier selected from requested_cents, never from the total" }
      - { name: total_charge_cents, type: integer, source: computed, description: "= requested_cents + admin_fee_cents; the amount charged to the grant" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | INFO_REQUESTED | APPROVED | DEFERRED | DISBURSED | DENIED | VOIDED — see state_machines.SupportRequest_status" }
      - { name: info_rounds_used, type: integer, source: system, default: 0, description: "Count of INFO_REQUESTED → SUBMITTED loops consumed; capped by INFO_MAX_ROUNDS" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the CaseManager who created the request; the segregation-of-duties left-hand side" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ProgramDirector who approved or denied the request" }
      - { name: settled_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ProgramDirector who disbursed or voided the request; must differ from reviewed_by_user_id" }
      - { name: review_note, type: string, source: system, default: null, description: "Note captured on the most recent review decision" }
      - { name: settlement_note, type: string, source: system, default: null, description: "Note captured on settlement" }
      - { name: deferred_at, type: string, source: system, default: null, description: "Logical-clock instant the request entered DEFERRED (ISO 8601 UTC, three fractional digits)" }
      - { name: promoted_at, type: string, source: system, default: null, description: "Logical-clock instant the waterfall promoted this request out of DEFERRED" }

  - name: ReadinessSession
    parent: null
    common_fields: true
    fields:
      - { name: session_type, type: enum, source: input, description: "DISCLOSURE_COACHING | INTERVIEW_PRACTICE | RESUME_LAB | DIGITAL_LITERACY" }
      - { name: coach_user_id, type: string, source: input, description: "Opaque CaseManager operator id of the facilitating coach; the occupied resource of the coach double-booking rule" }
      - { name: starts_at, type: string, source: input, description: "Session start (ISO 8601 UTC instant, three fractional digits)" }
      - { name: ends_at, type: string, source: input, description: "Session end (ISO 8601 UTC instant); strictly after starts_at" }
      - { name: seat_capacity, type: integer, source: input, description: "Maximum concurrent ENROLLED enrollments", constraints: ">= 1 and <= 30" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Count of SessionEnrollment rows on this session with status IN {ENROLLED, ATTENDED, NO_SHOW}" }
      - { name: remaining_seats, type: integer, source: computed, description: "= seat_capacity - enrolled_count; never negative" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | HELD | CANCELLED — see state_machines.ReadinessSession_status" }

  - name: SessionEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> ReadinessSession.id; taken from the creation path" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; the enrolled participant" }
      - { name: disclosure_script_reviewed, type: boolean, source: input, default: false, description: "Coach confirmed the participant's criminal-history disclosure script was rehearsed" }
      - { name: status, type: enum, source: system, default: "ENROLLED", description: "ENROLLED | ATTENDED | NO_SHOW | WITHDRAWN — see state_machines.SessionEnrollment_status" }

# =============================================================================
# §1.2 State Machine Table
# Each machine carries a `machine_id:` — §1.8/§1.9 `grounds:` reference
# transitions as `state_machines.<machine_id>.<FROM>_to_<TO>`.
# =============================================================================
state_machines:

  - machine_id: Participant_stage
    entity: Participant
    dimension_field: stage
    initial_state: PRE_RELEASE
    terminal_states: [EXITED]
    transitions:
      - from: PRE_RELEASE
        to: RELEASE_READY
        trigger: "system — release-readiness re-evaluation runs at the end of POST /participants/{id}/assessment, POST /participants/{id}/document-verifications and POST /participants/{id}/release-plan/approve"
        actor: system
        preconditions:
          - "doc_completeness_pct >= 80.0"
          - "barrier_score IS NOT NULL"
          - "release_plan_status == APPROVED"
          - "suspension_status == NONE"
        side_effects:
          - "engagement_posture recomputed by calculations.participant_engagement_posture"
        note: "Boundary is inclusive: exactly 80.0 advances the participant."

      - from: RELEASE_READY
        to: PRE_RELEASE
        trigger: "system — a new PUT /participants/{id}/release-plan revision drops release_plan_status from APPROVED to DRAFT, so the readiness predicate no longer holds"
        actor: system
        preconditions:
          - "release_plan_status != APPROVED after the revision is applied"
        side_effects:
          - "previous plan snapshot marked SUPERSEDED via release_plan_status transition to DRAFT and release_plan_revision incremented"

      - from: RELEASE_READY
        to: POST_RELEASE
        trigger: "POST /participants/{id}/release"
        actor: CaseManager
        preconditions:
          - "stage == RELEASE_READY"
          - "suspension_status == NONE"
          - "actual_release_date is a calendar date on or before the logical clock's UTC date"
        side_effects:
          - "actual_release_date set from the request body"
          - "engagement_posture recomputed"

      - from: POST_RELEASE
        to: PLACED
        trigger: "system — a Placement of this participant enters employment_status ACTIVE"
        actor: system
        preconditions:
          - "stage == POST_RELEASE"
        side_effects: []

      - from: PLACED
        to: POST_RELEASE
        trigger: "system — the participant's last Placement with employment_status == ACTIVE leaves ACTIVE (separation)"
        actor: system
        preconditions:
          - "count of Placement rows for this participant with employment_status == ACTIVE becomes 0"
        side_effects:
          - "engagement_posture recomputed"
        note: "Revert edge: stage walks backwards when employment is lost."

      - from: PLACED
        to: RETENTION
        trigger: "system — POST /placements/{id}/retention-check records milestone_days == 30 with outcome == RETAINED"
        actor: system
        preconditions:
          - "the checked Placement has employment_status == ACTIVE"
        side_effects: []

      - from: RETENTION
        to: POST_RELEASE
        trigger: "system — the participant's last Placement with employment_status == ACTIVE separates"
        actor: system
        preconditions:
          - "count of Placement rows for this participant with employment_status == ACTIVE becomes 0"
        side_effects:
          - "engagement_posture recomputed"

      - from: PRE_RELEASE
        to: EXITED
        trigger: "POST /participants/{id}/exit"
        actor: ProgramDirector
        preconditions:
          - "no Placement of this participant has employment_status == ACTIVE"
        side_effects:
          - "exit_reason and exit_date recorded; engagement_posture becomes FROZEN"
          - "every SessionEnrollment of this participant with status == ENROLLED whose ReadinessSession.status == SCHEDULED transitions to WITHDRAWN, which decrements ReadinessSession.enrolled_count and increments ReadinessSession.remaining_seats"
          - "every SupportRequest of this participant with status IN {SUBMITTED, INFO_REQUESTED} transitions to VOIDED with no ledger movement"
          - "every SupportRequest of this participant with status IN {APPROVED, DEFERRED} transitions to VOIDED; each APPROVED void releases total_charge_cents from FunderGrant.committed_cents, which re-runs calculations.grant_ledger, which may flip funding_posture and promote a DEFERRED request per calculations.deferred_request_promotion"

      - from: RELEASE_READY
        to: EXITED
        trigger: "POST /participants/{id}/exit"
        actor: ProgramDirector
        preconditions:
          - "no Placement of this participant has employment_status == ACTIVE"
        side_effects:
          - "identical to the PRE_RELEASE_to_EXITED side-effect set"

      - from: POST_RELEASE
        to: EXITED
        trigger: "POST /participants/{id}/exit"
        actor: ProgramDirector
        preconditions:
          - "no Placement of this participant has employment_status == ACTIVE"
        side_effects:
          - "identical to the PRE_RELEASE_to_EXITED side-effect set"

      - from: RETENTION
        to: EXITED
        trigger: "POST /participants/{id}/exit"
        actor: ProgramDirector
        preconditions:
          - "no Placement of this participant has employment_status == ACTIVE"
        side_effects:
          - "identical to the PRE_RELEASE_to_EXITED side-effect set"

  - machine_id: Participant_suspension
    entity: Participant
    dimension_field: suspension_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: SUSPENDED
        trigger: "POST /participants/{id}/suspension with to_status == SUSPENDED"
        actor: ProgramDirector
        preconditions:
          - "stage != EXITED"
          - "suspension_status == NONE"
        side_effects:
          - "suspension_reason recorded"
          - "engagement_posture becomes FROZEN (calculations.participant_engagement_posture)"
          - "every SessionEnrollment of this participant with status == ENROLLED whose ReadinessSession.status == SCHEDULED transitions to WITHDRAWN, which decrements ReadinessSession.enrolled_count and increments ReadinessSession.remaining_seats"
        note: "Independent of stage — a SUSPENDED participant keeps whatever stage it had."

      - from: SUSPENDED
        to: NONE
        trigger: "POST /participants/{id}/suspension with to_status == LIFTED"
        actor: ProgramDirector
        preconditions:
          - "suspension_status == SUSPENDED"
        side_effects:
          - "suspension_reason cleared to null"
          - "engagement_posture recomputed to OPEN or RESTRICTED per calculations.participant_engagement_posture"
          - "withdrawn enrollments are NOT restored"

  - machine_id: Participant_license_relief
    entity: Participant
    dimension_field: license_relief_status
    initial_state: NONE
    terminal_states: [RELIEF_GRANTED, PETITION_DENIED, PETITION_WITHDRAWN]
    transitions:
      - from: NONE
        to: PETITION_SUBMITTED
        trigger: "POST /participants/{id}/license-relief with to_status == PETITION_SUBMITTED"
        actor: CaseManager
        preconditions:
          - "stage != EXITED"
          - "occupation_code present in the request body"
        side_effects:
          - "license_relief_occupation_code set from occupation_code"

      - from: PETITION_SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /participants/{id}/license-relief with to_status == INFO_REQUESTED (recording the licensing board's request for more information)"
        actor: CaseManager
        preconditions:
          - "license_relief_status == PETITION_SUBMITTED"
        side_effects: []

      - from: INFO_REQUESTED
        to: PETITION_SUBMITTED
        trigger: "POST /participants/{id}/license-relief with to_status == PETITION_SUBMITTED"
        actor: CaseManager
        preconditions:
          - "petition_rounds_used < PETITION_MAX_ROUNDS (2)"
        side_effects:
          - "petition_rounds_used incremented by 1"
        note: "The cycle edge. Third re-submission is rejected with ERR_PETITION_ROUNDS_EXHAUSTED."

      - from: PETITION_SUBMITTED
        to: RELIEF_GRANTED
        trigger: "POST /participants/{id}/license-relief with to_status == RELIEF_GRANTED"
        actor: ProgramDirector
        preconditions:
          - "license_relief_status == PETITION_SUBMITTED"
        side_effects:
          - "placements on license-gated openings whose license_occupation_code equals license_relief_occupation_code become creatable for this participant"

      - from: PETITION_SUBMITTED
        to: PETITION_DENIED
        trigger: "POST /participants/{id}/license-relief with to_status == PETITION_DENIED"
        actor: ProgramDirector
        preconditions:
          - "license_relief_status == PETITION_SUBMITTED"
        side_effects: []

      - from: INFO_REQUESTED
        to: PETITION_WITHDRAWN
        trigger: "POST /participants/{id}/license-relief with to_status == PETITION_WITHDRAWN"
        actor: CaseManager
        preconditions:
          - "license_relief_status == INFO_REQUESTED"
        side_effects: []

  - machine_id: SupervisionCase_status
    entity: SupervisionCase
    dimension_field: status
    initial_state: PENDING_CONTACT
    terminal_states: [DISCHARGED, REVOKED]
    transitions:
      - from: PENDING_CONTACT
        to: ACTIVE
        trigger: "POST /supervision-cases/{id}/status with to_status == ACTIVE"
        actor: SupervisionOfficer
        preconditions:
          - "X-User-ID equals SupervisionCase.officer_user_id"
          - "status == PENDING_CONTACT"
        side_effects: []

      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /supervision-cases/{id}/status with to_status == DISCHARGED"
        actor: SupervisionOfficer
        preconditions:
          - "X-User-ID equals SupervisionCase.officer_user_id"
          - "status == ACTIVE"
        side_effects:
          - "work_authorization_status is left untouched — a discharged case no longer constrains new WorkShift creation because the work-window check only applies while status == ACTIVE"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /supervision-cases/{id}/status with to_status == REVOKED"
        actor: SupervisionOfficer
        preconditions:
          - "X-User-ID equals SupervisionCase.officer_user_id"
          - "status == ACTIVE"
        side_effects:
          - "work_authorization_status transitions APPROVED → SUSPENDED"
          - "because authorization was withdrawn, every WorkShift with status == SCHEDULED and starts_at > logical clock belonging to a Placement of this participant with employment_status == ACTIVE transitions to CONFLICTED with conflict_reason == SUPERVISION_REVOKED"
          - "because those shifts became CONFLICTED, each owning Placement recomputes schedule_compliance to OUT_OF_COMPLIANCE and recomputes projected_subsidy_cents (CONFLICTED shifts are excluded from the PROJECTED input set)"
          - "because a Placement is OUT_OF_COMPLIANCE, Participant.engagement_posture recomputes to RESTRICTED"
          - "because projected_subsidy_cents fell, calculations.grant_ledger re-runs on the funding grant"

  - machine_id: SupervisionCase_work_authorization
    entity: SupervisionCase
    dimension_field: work_authorization_status
    initial_state: NOT_REQUESTED
    terminal_states: [DENIED]
    transitions:
      - from: NOT_REQUESTED
        to: APPROVED
        trigger: "POST /supervision-cases/{id}/work-authorization with decision == APPROVED"
        actor: SupervisionOfficer
        preconditions:
          - "X-User-ID equals SupervisionCase.officer_user_id"
          - "status == ACTIVE"
          - "approved_window_start_minute and approved_window_end_minute both present, in 0..1440, with end strictly greater than start"
        side_effects:
          - "approved_window_start_minute / approved_window_end_minute stored; authorization_change_count incremented by 1"

      - from: NOT_REQUESTED
        to: DENIED
        trigger: "POST /supervision-cases/{id}/work-authorization with decision == DENIED"
        actor: SupervisionOfficer
        preconditions:
          - "X-User-ID equals SupervisionCase.officer_user_id"
          - "status == ACTIVE"
        side_effects:
          - "authorization_change_count incremented by 1"

      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /supervision-cases/{id}/work-authorization with decision == SUSPENDED"
        actor: SupervisionOfficer
        preconditions:
          - "X-User-ID equals SupervisionCase.officer_user_id"
          - "status == ACTIVE"
          - "work_authorization_status == APPROVED"
        side_effects:
          - "authorization_change_count incremented by 1"
          - "because authorization was withdrawn, every WorkShift with status == SCHEDULED and starts_at > logical clock on a Placement of this participant with employment_status == ACTIVE transitions to CONFLICTED with conflict_reason == WORK_AUTHORIZATION_SUSPENDED"
          - "because those shifts became CONFLICTED, each owning Placement recomputes schedule_compliance to OUT_OF_COMPLIANCE and recomputes projected_subsidy_cents without them"
          - "because a Placement of this participant is OUT_OF_COMPLIANCE, Participant.engagement_posture recomputes to RESTRICTED"
          - "because projected_subsidy_cents fell, calculations.grant_ledger re-runs, lowering FunderGrant.committed_cents and raising available_cents, which may flip funding_posture and promote a DEFERRED SupportRequest per calculations.deferred_request_promotion"

      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /supervision-cases/{id}/work-authorization with decision == APPROVED"
        actor: SupervisionOfficer
        preconditions:
          - "X-User-ID equals SupervisionCase.officer_user_id"
          - "status == ACTIVE"
          - "approved_window_start_minute and approved_window_end_minute both present and valid"
        side_effects:
          - "authorization_change_count incremented by 1"
          - "compensating cascade: every WorkShift with status == CONFLICTED, conflict_reason == WORK_AUTHORIZATION_SUSPENDED and starts_at > logical clock on this participant's ACTIVE placements returns to SCHEDULED with conflict_reason cleared to null, provided the shift still lies inside the newly stored window"
          - "because those shifts returned to SCHEDULED, each owning Placement recomputes schedule_compliance to COMPLIANT and recomputes projected_subsidy_cents back up"
          - "because no Placement is OUT_OF_COMPLIANCE any more, Participant.engagement_posture recomputes to OPEN"
          - "calculations.grant_ledger re-runs"

  - machine_id: EmployerPartnership_status
    entity: EmployerPartnership
    dimension_field: status
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - from: PROSPECT
        to: ENGAGED
        trigger: "POST /employer-partnerships/{id}/status with to_status == ENGAGED"
        actor: EmployerLiaison
        preconditions: ["status == PROSPECT"]
        side_effects: []

      - from: ENGAGED
        to: ACTIVE
        trigger: "POST /employer-partnerships/{id}/status with to_status == ACTIVE"
        actor: EmployerLiaison
        preconditions: ["status == ENGAGED"]
        side_effects: ["placements may now be created against this employer's openings"]

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /employer-partnerships/{id}/status with to_status == SUSPENDED"
        actor: EmployerLiaison
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "existing ACTIVE placements are untouched; new placement creation is refused with ERR_PARTNERSHIP_NOT_ACTIVE"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /employer-partnerships/{id}/status with to_status == ACTIVE"
        actor: EmployerLiaison
        preconditions: ["status == SUSPENDED"]
        side_effects: []
        note: "Cycle edge — partnerships recover from suspension."

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /employer-partnerships/{id}/status with to_status == TERMINATED"
        actor: EmployerLiaison
        preconditions:
          - "status == ACTIVE"
          - "active_placement_count == 0"
        side_effects:
          - "every JobOpening of this partnership with status IN {OPEN, FILLED} transitions to CLOSED"
          - "because those openings closed, every Placement on them with employment_status == OFFERED transitions to DECLINED, which decrements JobOpening.offered_count and raises remaining_openings"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /employer-partnerships/{id}/status with to_status == TERMINATED"
        actor: EmployerLiaison
        preconditions:
          - "status == SUSPENDED"
          - "active_placement_count == 0"
        side_effects:
          - "identical to the ACTIVE_to_TERMINATED side-effect set"

  - machine_id: JobOpening_status
    entity: JobOpening
    dimension_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FILLED
        trigger: "system — recomputed after any Placement write that changes offered_count or filled_count, when remaining_openings reaches 0"
        actor: system
        preconditions: ["remaining_openings == 0"]
        side_effects: ["further POST /placements against this opening are refused with ERR_JOB_OPENING_NOT_OPEN"]

      - from: FILLED
        to: OPEN
        trigger: "system — recomputed after a Placement leaves OFFERED or ACTIVE (decline, separation, cascade), when remaining_openings becomes > 0"
        actor: system
        preconditions: ["remaining_openings > 0"]
        side_effects: []
        note: "Revert edge."

      - from: OPEN
        to: CLOSED
        trigger: "system — cascade from EmployerPartnership_status.ACTIVE_to_TERMINATED or SUSPENDED_to_TERMINATED"
        actor: system
        preconditions: []
        side_effects: ["OFFERED placements on this opening are cascaded to DECLINED"]

      - from: FILLED
        to: CLOSED
        trigger: "system — cascade from EmployerPartnership termination"
        actor: system
        preconditions: []
        side_effects: ["OFFERED placements on this opening are cascaded to DECLINED"]

  - machine_id: Placement_employment
    entity: Placement
    dimension_field: employment_status
    initial_state: OFFERED
    terminal_states: [DECLINED, SEPARATED]
    transitions:
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /placements/{id}/offer-response with response == ACCEPTED"
        actor: Participant
        preconditions:
          - "X-User-ID equals Placement.participant_id"
          - "employment_status == OFFERED"
          - "Participant.suspension_status == NONE"
          - "EmployerPartnership.status == ACTIVE"
          - "EmployerPartnership.active_placement_count < EmployerPartnership.max_concurrent_placements"
        side_effects:
          - "JobOpening.offered_count decremented by 1 and filled_count incremented by 1 (remaining_openings unchanged)"
          - "EmployerPartnership.active_placement_count incremented by 1"
          - "Participant.stage POST_RELEASE → PLACED"
          - "projected_subsidy_cents and actual_subsidy_cents recomputed (both 0 until shifts exist)"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /placements/{id}/offer-response with response == DECLINED, or system cascade from JobOpening closure"
        actor: Participant
        preconditions:
          - "employment_status == OFFERED"
        side_effects:
          - "JobOpening.offered_count decremented by 1, raising remaining_openings, which may flip JobOpening.status FILLED → OPEN"

      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /placements/{id}/separate"
        actor: EmployerLiaison
        preconditions:
          - "employment_status == ACTIVE"
          - "separation_date is a calendar date on or after start_date and on or before the logical clock's UTC date"
        side_effects:
          - "separation_reason and separation_date recorded"
          - "because the placement left ACTIVE, every WorkShift on it with status IN {SCHEDULED, CONFLICTED} and starts_at > logical clock transitions to CANCELLED"
          - "because the shift set changed, projected_subsidy_cents recomputes to 0 and actual_subsidy_cents is frozen; disbursed_subsidy_cents is set to actual_subsidy_cents"
          - "because projected_subsidy_cents fell and disbursed_subsidy_cents rose, calculations.grant_ledger re-runs on the funding grant: committed_cents drops by the old projected amount and disbursed_cents rises by disbursed_subsidy_cents"
          - "because available_cents rose, funding_posture is recomputed and may flip RESTRICTED → OPEN"
          - "because funding_posture flipped to OPEN, calculations.deferred_request_promotion promotes the single earliest DEFERRED SupportRequest on that grant to APPROVED, committing its total_charge_cents"
          - "JobOpening.filled_count decremented by 1, raising remaining_openings, which may flip JobOpening.status FILLED → OPEN"
          - "EmployerPartnership.active_placement_count decremented by 1"
          - "if this was the participant's last ACTIVE placement, Participant.stage transitions PLACED → POST_RELEASE or RETENTION → POST_RELEASE and engagement_posture is recomputed"

  - machine_id: Placement_bonding
    entity: Placement
    dimension_field: bonding_status
    initial_state: NONE
    terminal_states: [CLAIMED, EXPIRED]
    transitions:
      - from: NONE
        to: REQUESTED
        trigger: "POST /placements/{id}/bonding with to_status == REQUESTED"
        actor: EmployerLiaison
        preconditions:
          - "employment_status IN {OFFERED, ACTIVE}"
          - "EmployerPartnership.fidelity_bond_enabled == true"
        side_effects: []
        note: "Independent of employment_status — bonding may be requested while the offer is still OFFERED."

      - from: REQUESTED
        to: BONDED
        trigger: "POST /placements/{id}/bonding with to_status == BONDED"
        actor: EmployerLiaison
        preconditions:
          - "employment_status IN {OFFERED, ACTIVE}"
          - "bonding_status == REQUESTED"
        side_effects: []

      - from: BONDED
        to: CLAIMED
        trigger: "POST /placements/{id}/bonding with to_status == CLAIMED"
        actor: EmployerLiaison
        preconditions:
          - "bonding_status == BONDED"
          - "employment_status == SEPARATED"
          - "separation_reason == TERMINATED_FOR_CAUSE"
        side_effects: []

      - from: BONDED
        to: EXPIRED
        trigger: "POST /placements/{id}/bonding with to_status == EXPIRED"
        actor: EmployerLiaison
        preconditions:
          - "bonding_status == BONDED"
          - "employment_status == SEPARATED"
        side_effects: []

  - machine_id: WorkShift_status
    entity: WorkShift
    dimension_field: status
    initial_state: SCHEDULED
    terminal_states: [WORKED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: WORKED
        trigger: "POST /work-shifts/{id}/status with to_status == WORKED"
        actor: CaseManager
        preconditions:
          - "status == SCHEDULED"
          - "ends_at <= logical clock"
          - "Placement.employment_status == ACTIVE"
        side_effects:
          - "Placement.actual_subsidy_cents recomputed (calculations.wage_subsidy_total variant ACTUAL)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-shifts/{id}/status with to_status == CANCELLED, or system cascade from Placement separation"
        actor: CaseManager
        preconditions:
          - "status == SCHEDULED"
          - "starts_at > logical clock"
        side_effects:
          - "Placement.projected_subsidy_cents recomputed downward"
          - "because projected_subsidy_cents fell, calculations.grant_ledger re-runs and funding_posture may flip"

      - from: SCHEDULED
        to: CONFLICTED
        trigger: "system — cascade from SupervisionCase_work_authorization.APPROVED_to_SUSPENDED or SupervisionCase_status.ACTIVE_to_REVOKED"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "starts_at > logical clock"
        side_effects:
          - "conflict_reason set; owning Placement.schedule_compliance recomputed to OUT_OF_COMPLIANCE"

      - from: CONFLICTED
        to: SCHEDULED
        trigger: "system — compensating cascade from SupervisionCase_work_authorization.SUSPENDED_to_APPROVED"
        actor: system
        preconditions:
          - "conflict_reason == WORK_AUTHORIZATION_SUSPENDED"
          - "starts_at > logical clock"
          - "the shift lies inside the newly stored approved window"
        side_effects:
          - "conflict_reason cleared to null; owning Placement.schedule_compliance recomputed"

      - from: CONFLICTED
        to: CANCELLED
        trigger: "POST /work-shifts/{id}/status with to_status == CANCELLED"
        actor: CaseManager
        preconditions:
          - "status == CONFLICTED"
        side_effects:
          - "owning Placement.schedule_compliance recomputed (COMPLIANT once no CONFLICTED shift remains)"

  - machine_id: SupportRequest_status
    entity: SupportRequest
    dimension_field: status
    initial_state: SUBMITTED
    terminal_states: [DISBURSED, DENIED, VOIDED]
    transitions:
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /support-requests/{id}/review with decision == INFO_REQUESTED"
        actor: ProgramDirector
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id"
          - "info_rounds_used < INFO_MAX_ROUNDS (2)"
        side_effects:
          - "review_note and reviewed_by_user_id recorded"

      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /support-requests/{id}/resubmit"
        actor: CaseManager
        preconditions:
          - "status == INFO_REQUESTED"
          - "info_rounds_used < INFO_MAX_ROUNDS (2)"
        side_effects:
          - "info_rounds_used incremented by 1"
          - "if line_items is supplied, requested_cents / admin_fee_cents / total_charge_cents are recomputed from the new array"
        note: "Cycle edge. A third resubmission is refused with ERR_INFO_ROUNDS_EXHAUSTED."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /support-requests/{id}/review with decision == APPROVED"
        actor: ProgramDirector
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id"
          - "FunderGrant.funding_posture != EXHAUSTED"
          - "FunderGrant.available_cents >= total_charge_cents"
        side_effects:
          - "reviewed_by_user_id recorded"
          - "FunderGrant.committed_cents increased by total_charge_cents; calculations.grant_ledger re-runs, lowering available_cents and possibly flipping funding_posture OPEN → RESTRICTED or → EXHAUSTED"

      - from: SUBMITTED
        to: DEFERRED
        trigger: "POST /support-requests/{id}/review with decision == APPROVED while the grant cannot cover the charge"
        actor: ProgramDirector
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id"
          - "FunderGrant.funding_posture == RESTRICTED"
          - "FunderGrant.available_cents < total_charge_cents"
        side_effects:
          - "reviewed_by_user_id recorded; deferred_at stamped from the logical clock"
          - "no ledger movement — a DEFERRED request commits nothing"
        note: "The director's decision is APPROVED; the server downgrades the landing state to DEFERRED because funds are short."

      - from: DEFERRED
        to: APPROVED
        trigger: "system — calculations.deferred_request_promotion, run whenever FunderGrant.available_cents rises"
        actor: system
        preconditions:
          - "status == DEFERRED"
          - "FunderGrant.available_cents >= total_charge_cents after the release"
          - "this request is the single winner of calculations.deferred_request_promotion"
        side_effects:
          - "promoted_at stamped from the logical clock"
          - "FunderGrant.committed_cents increased by total_charge_cents; grant ledger and funding_posture recomputed"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /support-requests/{id}/review with decision == DENIED"
        actor: ProgramDirector
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id"
        side_effects:
          - "reviewed_by_user_id and review_note recorded; no ledger movement"

      - from: INFO_REQUESTED
        to: DENIED
        trigger: "POST /support-requests/{id}/review with decision == DENIED"
        actor: ProgramDirector
        preconditions:
          - "status == INFO_REQUESTED"
          - "X-User-ID != submitted_by_user_id"
        side_effects:
          - "reviewed_by_user_id and review_note recorded; no ledger movement"

      - from: APPROVED
        to: DISBURSED
        trigger: "POST /support-requests/{id}/settle with to_status == DISBURSED"
        actor: ProgramDirector
        preconditions:
          - "status == APPROVED"
          - "X-User-ID != reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "settled_by_user_id and settlement_note recorded"
          - "FunderGrant.committed_cents decreased by total_charge_cents and disbursed_cents increased by the same amount; available_cents and funding_posture unchanged in value by this move"

      - from: APPROVED
        to: VOIDED
        trigger: "POST /support-requests/{id}/settle with to_status == VOIDED"
        actor: ProgramDirector
        preconditions:
          - "status == APPROVED"
          - "X-User-ID != reviewed_by_user_id (segregation of duties)"
        side_effects:
          - "settled_by_user_id recorded"
          - "FunderGrant.committed_cents decreased by total_charge_cents; calculations.grant_ledger re-runs, raising available_cents and possibly flipping funding_posture back"
          - "because available_cents rose, calculations.deferred_request_promotion may promote one DEFERRED request"

      - from: DEFERRED
        to: VOIDED
        trigger: "POST /support-requests/{id}/settle with to_status == VOIDED"
        actor: ProgramDirector
        preconditions:
          - "status == DEFERRED"
          - "X-User-ID != reviewed_by_user_id"
        side_effects:
          - "settled_by_user_id recorded; no ledger movement (a DEFERRED request holds no commitment)"

  - machine_id: ReadinessSession_status
    entity: ReadinessSession
    dimension_field: status
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /readiness-sessions/{id}/status with to_status == HELD"
        actor: CaseManager
        preconditions:
          - "status == SCHEDULED"
          - "ends_at <= logical clock"
        side_effects:
          - "every SessionEnrollment on this session still in status == ENROLLED transitions to NO_SHOW; enrolled_count and remaining_seats are unchanged because NO_SHOW still occupies its seat"
          - "enrollments already moved to ATTENDED or NO_SHOW during the session window are left untouched"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /readiness-sessions/{id}/status with to_status == CANCELLED"
        actor: CaseManager
        preconditions:
          - "status == SCHEDULED"
          - "starts_at > logical clock"
        side_effects:
          - "every SessionEnrollment on this session with status == ENROLLED transitions to WITHDRAWN, which drops enrolled_count to 0 and restores remaining_seats to seat_capacity"

  - machine_id: SessionEnrollment_status
    entity: SessionEnrollment
    dimension_field: status
    initial_state: ENROLLED
    terminal_states: [ATTENDED, NO_SHOW, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: ATTENDED
        trigger: "POST /enrollments/{id}/status with to_status == ATTENDED"
        actor: CaseManager
        preconditions:
          - "status == ENROLLED"
          - "ReadinessSession.status IN {SCHEDULED, HELD}"
          - "ReadinessSession.starts_at <= logical clock"
        side_effects:
          - "enrolled_count and remaining_seats unchanged (an ATTENDED enrollment keeps its seat)"

      - from: ENROLLED
        to: NO_SHOW
        trigger: "POST /enrollments/{id}/status with to_status == NO_SHOW, or system cascade from ReadinessSession_status.SCHEDULED_to_HELD"
        actor: CaseManager
        preconditions:
          - "status == ENROLLED"
          - "ReadinessSession.status IN {SCHEDULED, HELD}"
          - "ReadinessSession.starts_at <= logical clock"
        side_effects: []

      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/status with to_status == WITHDRAWN, or system cascade from Participant suspension / exit / session cancellation"
        actor: CaseManager
        preconditions:
          - "status == ENROLLED"
          - "ReadinessSession.status == SCHEDULED"
        side_effects:
          - "ReadinessSession.enrolled_count decremented by 1 and remaining_seats incremented by 1 — the compensating half of the seat-conservation invariant"

  - machine_id: FunderGrant_posture
    entity: FunderGrant
    dimension_field: funding_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system — calculations.grant_ledger after any commitment, disbursement or release"
        actor: system
        preconditions:
          - "available_cents > 0 AND available_cents < ROUND_HALF_UP(authorized_cents * 0.15)"
        side_effects:
          - "review decisions of APPROVED that exceed available_cents now land in DEFERRED instead of APPROVED"

      - from: RESTRICTED
        to: OPEN
        trigger: "system — calculations.grant_ledger after a release raises available_cents"
        actor: system
        preconditions:
          - "available_cents >= ROUND_HALF_UP(authorized_cents * 0.15)"
        side_effects:
          - "calculations.deferred_request_promotion runs"

      - from: RESTRICTED
        to: EXHAUSTED
        trigger: "system — calculations.grant_ledger"
        actor: system
        preconditions:
          - "available_cents <= 0"
        side_effects:
          - "POST /support-requests against this grant is refused with ERR_GRANT_EXHAUSTED"

      - from: EXHAUSTED
        to: RESTRICTED
        trigger: "system — calculations.grant_ledger after a release"
        actor: system
        preconditions:
          - "available_cents > 0 AND available_cents < ROUND_HALF_UP(authorized_cents * 0.15)"
        side_effects:
          - "calculations.deferred_request_promotion runs"

      - from: OPEN
        to: EXHAUSTED
        trigger: "system — calculations.grant_ledger when a single commitment consumes everything at once"
        actor: system
        preconditions:
          - "available_cents <= 0"
        side_effects: []

      - from: EXHAUSTED
        to: OPEN
        trigger: "system — calculations.grant_ledger after a large release"
        actor: system
        preconditions:
          - "available_cents >= ROUND_HALF_UP(authorized_cents * 0.15)"
        side_effects:
          - "calculations.deferred_request_promotion runs"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on a parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: release-plan-write-stale-participant
    parent_entity: Participant
    write_endpoint: "PUT /participants/{id}/release-plan"
    occ_field: "expected_participant_version"
    description: |
      Writing a release-plan revision against a Participant whose version has
      advanced since the client last read it is rejected. This captures the case
      where another case manager has already stored a newer revision that
      legitimately supersedes the prior plan (release_plan_revision advanced and
      release_plan_status fell back to DRAFT), so the current writer's view of
      the participant is stale.
    error_id: ERR_STALE_PARTICIPANT_VERSION
    http_status: 412

  - rule_id: support-request-create-stale-grant
    parent_entity: FunderGrant
    write_endpoint: "POST /support-requests"
    occ_field: "expected_grant_version"
    description: |
      Creating a SupportRequest against a FunderGrant whose version has advanced
      since the client last read it is rejected. Every accepted create raises the
      grant's open_request_count, and reviews move committed_cents, so a stale
      version means the client decided which grant to charge from an outdated
      view of available_cents and funding_posture.
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412

  - rule_id: placement-create-stale-job-opening
    parent_entity: JobOpening
    write_endpoint: "POST /placements"
    occ_field: "expected_job_opening_version"
    description: |
      Creating a Placement against a JobOpening whose version has advanced since
      the client last read it is rejected. Each accepted create raises
      offered_count and lowers remaining_openings, so a stale version means the
      client chose the opening believing more seats were free than there are.
    error_id: ERR_STALE_JOB_OPENING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# All money is integer cents. All rounding is ROUND_HALF_UP unless stated.
# =============================================================================
calculations:

  - name: doc_completeness_pct
    algorithm_type: threshold
    entity: Participant
    output_field: doc_completeness_pct
    input_set: "Participant.required_document_types (denominator) and Participant.verified_document_types (numerator); document types verified but not required are ignored entirely"
    formula: |
      matched = COUNT(verified_document_types ∩ required_document_types)
      doc_completeness_pct = ROUND_HALF_UP(100 * matched / COUNT(required_document_types), 1)
    constants:
      READINESS_DOC_THRESHOLD_PCT: 80.0
    precision: "one decimal place, ROUND_HALF_UP"
    notes: |
      Recomputed at the end of every POST /participants/{id}/document-verifications.
      The readiness predicate in state_machines.Participant_stage uses `>=`, so a
      participant with 4 of 5 required documents verified sits at exactly 80.0 and
      DOES advance to RELEASE_READY. 3 of 5 gives 60.0 and does not.
    worked_example: "required = 5 types, verified = 4 of them → 80.0; 3 of 5 → 60.0; 2 of 3 → 66.7"

  - name: participant_barrier_score
    algorithm_type: weighted_scoring
    entity: Participant
    output_field: barrier_score
    also_writes: [barrier_tier]
    input_set: "The five 0..4 integers in Participant.assessment_domain_scores as recorded by POST /participants/{id}/assessment"
    formula: |
      raw = 0.30*housing_score + 0.20*transportation_score + 0.15*health_score
          + 0.25*work_history_score + 0.10*documentation_score
      barrier_score = ROUND_HALF_UP(raw / 4 * 100, 1)          # 0.0 .. 100.0
      barrier_tier  = HIGH      if barrier_score >= 65.0
                      MODERATE  if barrier_score >= 35.0
                      LOW       otherwise
    constants:
      WEIGHT_HOUSING: 0.30
      WEIGHT_TRANSPORTATION: 0.20
      WEIGHT_HEALTH: 0.15
      WEIGHT_WORK_HISTORY: 0.25
      WEIGHT_DOCUMENTATION: 0.10
      TIER_HIGH_MIN: 65.0
      TIER_MODERATE_MIN: 35.0
    precision: "one decimal place, ROUND_HALF_UP — the weights sum to 1.00 so no drift is permitted"
    notes: |
      Weights do not sum to a whole score; the divide-by-4-times-100 normalisation
      must happen AFTER the weighted sum, not per domain, or the rounding differs.
    worked_example: |
      housing 3, transportation 2, health 1, work_history 4, documentation 2
        raw = 0.90 + 0.40 + 0.15 + 1.00 + 0.20 = 2.65
        barrier_score = ROUND_HALF_UP(66.25, 1) = 66.3 → HIGH
      all-2s → raw 2.00 → 50.0 → MODERATE; all-1s → 25.0 → LOW

  - name: job_match_score
    algorithm_type: weighted_scoring
    entity: Placement
    output_field: match_score
    also_writes: [match_breakdown]
    input_set: |
      The JobOpening being placed into, its EmployerPartnership, the Participant
      (barrier_score, transportation_plan_type) and the Participant's
      SessionEnrollment rows with status == ATTENDED.
    formula: |
      wage_component     = MIN(30, ROUND_HALF_UP(30 * hourly_wage_cents / WAGE_TARGET_CENTS, 0))
      hours_component    = 20 if weekly_hours >= 30
                           14 if weekly_hours >= 20
                            8 if weekly_hours >= 10
                            0 otherwise
      barrier_fit_component = ROUND_HALF_UP(20 * (100 - Participant.barrier_score) / 100, 0)
      access_component   = 15 if transportation_plan_type == OWN_VEHICLE
                           15 if transportation_plan_type == EMPLOYER_SHUTTLE
                           15 if transportation_plan_type == TRANSIT_PASS AND JobOpening.transit_accessible == true
                            5 if transportation_plan_type == TRANSIT_PASS AND JobOpening.transit_accessible == false
                           10 if transportation_plan_type == RIDE_SHARE_STIPEND
                            0 if transportation_plan_type IN {NONE, null}
      readiness_component = MIN(15, 5 * attended_session_count
                                     + (5 if ANY attended SessionEnrollment has disclosure_script_reviewed == true else 0))
      wotc_bonus         = 5 if EmployerPartnership.wotc_certified == true else 0
      match_score = MIN(100, wage_component + hours_component + barrier_fit_component
                             + access_component + readiness_component + wotc_bonus)
    constants:
      WAGE_TARGET_CENTS: 2000
      MATCH_SCORE_MAX: 100
    precision: "integer 0..100; every component is rounded to a whole number BEFORE summation"
    notes: |
      Two independent caps: the inner MIN(30, …) caps a single component and the
      outer MIN(100, …) caps the total. Components sum to at most 105, so the outer
      cap is reachable and an implementation that omits it will overshoot.
      match_breakdown stores the six component values under the keys
      wage_component, hours_component, barrier_fit_component, access_component,
      readiness_component, wotc_bonus.
    worked_example: |
      wage 1850, 35 h/wk, barrier_score 66.3, TRANSIT_PASS on a transit_accessible
      opening, 2 attended sessions one of which reviewed the disclosure script,
      wotc_certified employer:
        28 + 20 + 7 + 15 + 15 + 5 = 90
      same case but transit_accessible == false → access 5 → 80
      wage 2400, 40 h/wk, barrier_score 0.0, OWN_VEHICLE, 3 attended with
      disclosure, wotc_certified: 30 + 20 + 20 + 15 + 15 + 5 = 105 → capped to 100

  - name: wage_subsidy_total
    algorithm_type: tiered_pricing
    entity: Placement
    output_field: projected_subsidy_cents
    variants:
      - name: PROJECTED
        output_field: projected_subsidy_cents
        input_set: "WorkShift rows of the placement with status IN {SCHEDULED, WORKED}"
        used_when: "Written on every placement/shift mutation; this is the figure FunderGrant.committed_cents holds for an ACTIVE placement"
      - name: ACTUAL
        output_field: actual_subsidy_cents
        input_set: "WorkShift rows of the placement with status == WORKED only"
        used_when: "Written on every placement/shift mutation; frozen at separation and copied into disbursed_subsidy_cents, which is what FunderGrant.disbursed_cents holds"
    input_set: "See per-variant input_set. CONFLICTED and CANCELLED shifts are excluded from BOTH variants."
    formula: |
      shifts are processed in chronological order: starts_at ASC, then created_at ASC
      running cumulative_hours starts at 0 for the placement
      for each shift, its scheduled_hours are consumed against the tier ladder,
      splitting the shift across tier boundaries when it straddles one:
        cumulative_hours in [0, 80)    → rate 0.50
        cumulative_hours in [80, 160)  → rate 0.25
        cumulative_hours >= 160        → rate 0.00
      shift_amount = ROUND_HALF_UP(Σ over segments (segment_hours * hourly_wage_cents * rate), 0)
      subsidy = MIN(SUBSIDY_PLACEMENT_CAP_CENTS, Σ shift_amount)
    constants:
      SUBSIDY_TIER1_HOURS: 80
      SUBSIDY_TIER1_RATE: 0.50
      SUBSIDY_TIER2_HOURS: 160
      SUBSIDY_TIER2_RATE: 0.25
      SUBSIDY_TIER3_RATE: 0.00
      SUBSIDY_PLACEMENT_CAP_CENTS: 120000
    precision: "rounded to whole cents ROUND_HALF_UP once per shift, after the shift's segments are summed — never per segment"
    notes: |
      A placement whose subsidy_track == NONE carries 0 for BOTH variants no matter
      how many shifts it holds; the ladder is only walked for
      subsidy_track == SUBSIDIZED_WORK_EXPERIENCE.
      The two variants read the same shift rows through different status filters, so
      a placement with SCHEDULED shifts always has projected >= actual. Marking a
      shift WORKED raises actual and leaves projected unchanged; cancelling a
      SCHEDULED shift lowers projected and leaves actual unchanged. The cumulative
      ladder is per placement and is walked chronologically, so shifts created out
      of order must still be charged in starts_at order.
    worked_example: |
      hourly_wage_cents 1850, three 40-hour shifts:
        shift 1: 40 h all in tier 1 → 40 * 1850 * 0.50 = 37000
        shift 2: 40 h all in tier 1 (cumulative reaches exactly 80) → 37000
        shift 3: 40 h all in tier 2 → 40 * 1850 * 0.25 = 18500
        total 92500
      one 90-hour shift at 1850 straddles the boundary:
        80 h * 1850 * 0.50 + 10 h * 1850 * 0.25 = 74000 + 4625 = 78625
      four 50-hour shifts at 1900: 47500 + 38000 + 23750 + 4750 = 114000
      one 6.25-hour shift at 1855: 5796.875 → 5797

  - name: support_request_award
    algorithm_type: aggregation
    entity: SupportRequest
    output_field: requested_cents
    input_set: "Every element of SupportRequest.line_items, in array order"
    formula: |
      rate = COVERAGE_RATE[SupportRequest.category]   (one rate for the whole request)
      per line: line_award_cents = ROUND_HALF_UP(unit_cost_cents * quantity * rate, 0)
      requested_cents = Σ line_award_cents
    constants:
      COVERAGE_RATE_TOOLS: 0.85
      COVERAGE_RATE_UNIFORM: 0.90
      COVERAGE_RATE_TRANSIT_PASS: 1.00
      COVERAGE_RATE_ID_FEE: 1.00
      COVERAGE_RATE_LICENSE_FEE: 0.60
    precision: "each line is rounded to whole cents BEFORE the sum; the sum is never re-rounded"
    notes: |
      The coverage rate is a property of the request-level category, not of the
      line. Rounding per line and rounding the aggregate diverge whenever an odd
      number of lines carries a half-cent remainder. Each line's award is echoed
      back in the response as line_items[i].line_award_cents.
    worked_example: |
      category TOOLS (rate 0.85), four lines of quantity 1:
        4550 → 3867.50 → 3868
        5550 → 4717.50 → 4718
        3750 → 3187.50 → 3188
        2570 → 2184.50 → 2185
      per-line sum = 13959; rounding the aggregate (16420 × 0.85 = 13957.00)
      would give 13957 — a 2-cent divergence that pins the per-line rule

  - name: support_request_settlement
    algorithm_type: tiered_pricing
    entity: SupportRequest
    output_field: admin_fee_cents
    also_writes: [total_charge_cents]
    input_set: "SupportRequest.requested_cents as produced by calculations.support_request_award"
    formula: |
      tier is selected from requested_cents ONLY:
        requested_cents <= 5000            → ADMIN_FEE_RATE_T1 (0.00)
        5000 < requested_cents <= 20000    → ADMIN_FEE_RATE_T2 (0.03)
        requested_cents > 20000            → ADMIN_FEE_RATE_T3 (0.05)
      admin_fee_cents   = ROUND_HALF_UP(requested_cents * rate, 0)
      total_charge_cents = requested_cents + admin_fee_cents
    constants:
      ADMIN_FEE_T1_MAX_CENTS: 5000
      ADMIN_FEE_T2_MAX_CENTS: 20000
      ADMIN_FEE_RATE_T1: 0.00
      ADMIN_FEE_RATE_T2: 0.03
      ADMIN_FEE_RATE_T3: 0.05
    precision: "whole cents, ROUND_HALF_UP"
    notes: |
      The tier is chosen from requested_cents and never from total_charge_cents.
      The distinction is observable because adding the fee can push the total past
      a tier boundary the request itself did not cross.
    worked_example: |
      requested 20000 → tier T2 (0.03) → fee 600 → total 20600
        (selecting the tier from the 20600 total would wrongly give 0.05 → fee 1030)
      requested 5000  → tier T1 → fee 0    → total 5000
      requested 5001  → tier T2 → fee 150  → total 5151
      requested 13959 → tier T2 → fee 419  → total 14378
      requested 57143 → tier T3 → fee 2857 → total 60000

  - name: grant_ledger
    algorithm_type: aggregation
    entity: FunderGrant
    output_field: available_cents
    also_writes: [committed_cents, disbursed_cents, open_request_count, funding_posture]
    input_set: |
      All SupportRequest rows with grant_id == this grant, plus all Placement rows
      with grant_id == this grant.
    formula: |
      committed_cents = Σ SupportRequest.total_charge_cents WHERE status == APPROVED
                      + Σ Placement.projected_subsidy_cents WHERE employment_status == ACTIVE
      disbursed_cents = Σ SupportRequest.total_charge_cents WHERE status == DISBURSED
                      + Σ Placement.disbursed_subsidy_cents WHERE employment_status == SEPARATED
      available_cents = authorized_cents - committed_cents - disbursed_cents
      open_request_count = COUNT(SupportRequest WHERE status IN {SUBMITTED, INFO_REQUESTED, DEFERRED})
      deferred_request_count = COUNT(SupportRequest WHERE status == DEFERRED)   # reported by GET /grants/{id}/ledger, not persisted
      restricted_floor = ROUND_HALF_UP(authorized_cents * GRANT_RESTRICTED_FRACTION, 0)
      funding_posture = EXHAUSTED  if available_cents <= 0
                        RESTRICTED if available_cents < restricted_floor
                        OPEN       otherwise
    constants:
      GRANT_RESTRICTED_FRACTION: 0.15
    precision: "integer cents; no rounding beyond the restricted_floor computation"
    notes: |
      Invariant that must hold after every write:
        authorized_cents == available_cents + committed_cents + disbursed_cents
      SUBMITTED, INFO_REQUESTED, DEFERRED, DENIED and VOIDED requests contribute
      nothing to the money columns — only APPROVED (committed) and DISBURSED
      (disbursed) do. DEFERRED requests are counted in open_request_count but hold
      no money, which is what makes the promotion waterfall safe.
    worked_example: |
      authorized 5000000 → restricted_floor 750000
      one APPROVED request of 20600 and one ACTIVE placement projecting 92500:
        committed 113100, disbursed 0, available 4886900 → OPEN
      settle the request DISBURSED: committed 92500, disbursed 20600,
        available 4886900 (unchanged) → OPEN

  - name: deferred_request_promotion
    algorithm_type: waterfall_allocation
    entity: SupportRequest
    output_field: status
    input_set: |
      SupportRequest rows on the grant with status == DEFERRED, ordered by
      deferred_at ASC, then created_at ASC. `id` is never used as an ordering key.
    formula: |
      runs after any write that raises FunderGrant.available_cents (a VOIDED
      settlement, a work-shift cancellation, a placement separation, a participant
      exit):
        head = first row of the ordered DEFERRED queue
        if head EXISTS and head.total_charge_cents <= available_cents:
            promote head to APPROVED, stamp promoted_at, add total_charge_cents to committed_cents
        else:
            promote nothing
      at most one request is promoted per triggering write
    constants:
      MAX_PROMOTIONS_PER_EVENT: 1
    precision: "n/a — integer cents comparison"
    notes: |
      Strict queue discipline: the waterfall never skips the head. If the head does
      not fit, a later smaller DEFERRED request that WOULD fit is left DEFERRED.
      Exactly one promotion per event even if the released amount would cover two.
    worked_example: |
      queue: R1 deferred_at 09:00 total 80000, R2 deferred_at 10:00 total 5000
      a void releases 60000 into an available_cents of 0:
        R1 does not fit (80000 > 60000) → nothing is promoted, R2 stays DEFERRED
      a void releases 150000 instead:
        R1 is promoted; R2 stays DEFERRED even though 70000 remains available

  - name: grant_outcome_report
    algorithm_type: aggregation
    entity: FunderGrant
    output_field: "report body of GET /grants/{id}/outcome-report (not persisted)"
    variants:
      - name: COHORT
        input_set: "Every Placement with grant_id == this grant and employment_status IN {ACTIVE, SEPARATED} — every placement that actually started, regardless of whether the participant has exited the programme"
        used_when: "variant query parameter is omitted or equals COHORT"
      - name: EXIT_BASED
        input_set: "Only those Placements with grant_id == this grant and employment_status IN {ACTIVE, SEPARATED} whose Participant.stage == EXITED — the closed-case denominator funders use for final reporting"
        used_when: "variant query parameter equals EXIT_BASED"
    input_set: "See per-variant input_set. OFFERED and DECLINED placements are excluded from both variants."
    formula: |
      denominator_placements = COUNT(placements in the variant's input set)
      retained_placements    = COUNT(those with retention_90_outcome == RETAINED)
      retention_rate_pct     = null if denominator_placements == 0
                               else ROUND_HALF_UP(100 * retained_placements / denominator_placements, 1)
      denominator_participants = COUNT(DISTINCT participant_id in the variant's input set)
      recidivism_participants  = COUNT(DISTINCT participant_id in the input set whose
                                       Placement.recidivism_event != NONE)
      recidivism_rate_pct    = null if denominator_participants == 0
                               else ROUND_HALF_UP(100 * recidivism_participants / denominator_participants, 1)
      benchmark_met          = false if retention_rate_pct IS NULL
                               else retention_rate_pct >= FunderGrant.retention_benchmark_pct
      subsidy_disbursed_cents = Σ Placement.disbursed_subsidy_cents over the input set
      support_disbursed_cents = Σ SupportRequest.total_charge_cents on this grant WHERE status == DISBURSED
      participants_served     = denominator_participants
    constants: {}
    precision: "rates to one decimal place, ROUND_HALF_UP; null (not 0.0, not omitted) on an empty denominator"
    notes: |
      The two variants share every numerator definition and differ only in which
      placements enter the denominator, so a grant whose participants have not all
      exited yields two different retention_rate_pct values from the same data.
      support_disbursed_cents is deliberately NOT variant-filtered — it is a grant
      column, not a placement roll-up, so it is identical under both variants.
    worked_example: |
      3 started placements, 1 retained at 90 days, and only 2 of the 3
      participants have stage == EXITED, 1 of whom is the retained one:
        COHORT     → 100 * 1 / 3 = 33.3
        EXIT_BASED → 100 * 1 / 2 = 50.0
      a grant with no started placements → both rates null, benchmark_met false

  - name: participant_engagement_posture
    algorithm_type: constraint_propagation
    entity: Participant
    output_field: engagement_posture
    input_set: "Participant.suspension_status, Participant.stage, Participant.license_relief_status, and the schedule_compliance of every Placement of this participant"
    formula: |
      engagement_posture = FROZEN     if suspension_status == SUSPENDED OR stage == EXITED
                           RESTRICTED if ANY Placement of this participant has
                                          schedule_compliance == OUT_OF_COMPLIANCE
                                       OR license_relief_status == PETITION_DENIED
                           OPEN       otherwise
    constants: {}
    precision: "n/a — enum"
    notes: |
      Evaluated in that order, so FROZEN wins over RESTRICTED. Recomputed at the
      end of every write that touches any input, including writes that reach the
      participant only through a cascade (a work-authorization suspension changes a
      shift, which changes a placement's schedule_compliance, which changes this).
    worked_example: |
      suspended participant with a compliant placement → FROZEN
      active participant with one CONFLICTED shift on a placement → RESTRICTED
      restoring the work authorization returns the placement to COMPLIANT → OPEN

  - name: placement_schedule_compliance
    algorithm_type: constraint_propagation
    entity: Placement
    output_field: schedule_compliance
    input_set: "Every WorkShift of the placement"
    formula: |
      schedule_compliance = OUT_OF_COMPLIANCE if ANY WorkShift has status == CONFLICTED
                            COMPLIANT         otherwise
    constants: {}
    precision: "n/a — enum"
    notes: |
      CANCELLED and WORKED shifts never make a placement non-compliant; only a
      live CONFLICTED shift does. A placement with zero shift rows, and a
      placement whose every shift was cancelled, are both COMPLIANT — the enum
      carries no third "not yet evaluated" member.
    worked_example: |
      no shifts → COMPLIANT; two SCHEDULED shifts → COMPLIANT;
      one of them cascaded to CONFLICTED → OUT_OF_COMPLIANCE;
      that shift then CANCELLED → COMPLIANT

  - name: capacity_counters
    algorithm_type: aggregation
    entity: JobOpening
    output_field: remaining_openings
    also_writes: ["JobOpening.offered_count", "JobOpening.filled_count", "ReadinessSession.enrolled_count", "ReadinessSession.remaining_seats", "EmployerPartnership.active_placement_count"]
    input_set: "Placement rows per JobOpening; SessionEnrollment rows per ReadinessSession; Placement rows per EmployerPartnership"
    formula: |
      JobOpening.offered_count   = COUNT(Placement WHERE job_opening_id == opening AND employment_status == OFFERED)
      JobOpening.filled_count    = COUNT(Placement WHERE job_opening_id == opening AND employment_status == ACTIVE)
      JobOpening.remaining_openings = openings_count - offered_count - filled_count
      ReadinessSession.enrolled_count = COUNT(SessionEnrollment WHERE session_id == session
                                              AND status IN {ENROLLED, ATTENDED, NO_SHOW})
      ReadinessSession.remaining_seats = seat_capacity - enrolled_count
      EmployerPartnership.active_placement_count = COUNT(Placement WHERE the placement's
                                              JobOpening.partnership_id == partnership
                                              AND employment_status == ACTIVE)
    constants: {}
    precision: "non-negative integers; the derived remainders are never allowed to go negative because the creating endpoints refuse the write first"
    notes: |
      Two conservation invariants follow and must hold after every write:
        openings_count == offered_count + filled_count + remaining_openings
        seat_capacity  == enrolled_count + remaining_seats
      A WITHDRAWN enrollment leaves the enrolled set and returns its seat; ATTENDED
      and NO_SHOW keep their seats. SEPARATED and DECLINED placements leave both
      counts and return their opening slot.
    worked_example: |
      openings_count 2 with one OFFERED and one ACTIVE placement → remaining 0, status FILLED
      the OFFERED placement is declined → offered 0, filled 1, remaining 1, status OPEN
      seat_capacity 3 with 2 ENROLLED → remaining_seats 1; one withdraws → remaining_seats 2

# =============================================================================
# §1.4 Validation Rules — evaluated in strict ascending `priority` order.
# The FIRST rule whose condition holds decides the response; no later rule may
# pre-empt an earlier one. Two rules violated by the same request always yield
# the lower-priority-number error_id.
# =============================================================================
validations:

  # ---- 1 authentication -----------------------------------------------------
  - rule_id: auth-header-present
    category: auth
    priority: 1
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    condition: "X-User-ID request header is absent, or present but an empty string"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    note: "Checked before anything else, including request-body shape and path existence."

  - rule_id: auth-user-known
    category: auth
    priority: 1
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    condition: "X-User-ID does not identify a registered user"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401

  # ---- 2 role authorisation -------------------------------------------------
  - rule_id: role-permits-operation
    category: permission
    priority: 2
    applies_to: "every endpoint with a non-empty `roles:` list"
    condition: "the caller's role is not in the endpoint's `roles:` list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    note: "Evaluated before request-shape validation, so a wrong-role caller with a malformed body still gets 403."

  # ---- 3 request shape ------------------------------------------------------
  - rule_id: request-body-shape
    category: request_shape
    priority: 3
    applies_to: "every endpoint with a request body"
    condition: "a required field is missing, a field has the wrong JSON type, an enum value is outside its declared set, a string violates its length or charset constraint, or a number is outside its declared range"
    error_id: ERR_VALIDATION
    http_status: 422

  - rule_id: pagination-params-range
    category: request_shape
    priority: 3
    applies_to: "every list endpoint"
    condition: "limit < 1, limit > 100, offset < 0, or either is not an integer"
    error_id: ERR_VALIDATION
    http_status: 422

  - rule_id: state-code-format
    category: request_shape
    priority: 3
    applies_to: "POST /participants, PUT /participants/{id}"
    condition: "facility_state is not exactly two uppercase A–Z characters"
    error_id: ERR_VALIDATION
    http_status: 422

  - rule_id: enum-array-no-duplicates
    category: request_shape
    priority: 3
    applies_to: "POST /participants, PUT /participants/{id}, POST /employer-partnerships, POST /job-openings"
    condition: "record_categories, required_document_types, excluded_record_categories or barred_record_categories contains a duplicate value, or an array declared non-empty is empty"
    error_id: ERR_VALIDATION
    http_status: 422

  - rule_id: assessment-domain-scores-shape
    category: request_shape
    priority: 3
    applies_to: "POST /participants/{id}/assessment"
    condition: "assessment_domain_scores omits any of the five domain keys, carries an unknown key, or holds a value that is not an integer in 0..4"
    error_id: ERR_VALIDATION
    http_status: 422

  - rule_id: window-minutes-range
    category: request_shape
    priority: 3
    applies_to: "POST /supervision-cases/{id}/work-authorization"
    condition: "decision == APPROVED and (approved_window_start_minute or approved_window_end_minute is absent, outside 0..1440, or end is not strictly greater than start)"
    error_id: ERR_VALIDATION
    http_status: 422

  - rule_id: shift-interval-ordered
    category: request_shape
    priority: 3
    applies_to: "POST /placements/{id}/work-shifts, POST /readiness-sessions"
    condition: "ends_at is not strictly after starts_at"
    error_id: ERR_VALIDATION
    http_status: 422

  - rule_id: line-items-shape
    category: request_shape
    priority: 3
    applies_to: "POST /support-requests, POST /support-requests/{id}/resubmit"
    condition: "line_items is empty, has more than SUPPORT_MAX_LINE_ITEMS (6) elements, or an element omits description, carries unit_cost_cents < 1, or carries quantity outside 1..20"
    error_id: ERR_VALIDATION
    http_status: 422

  # ---- 4 path existence -----------------------------------------------------
  - rule_id: path-entity-exists
    category: path_existence
    priority: 4
    applies_to: "every endpoint carrying a path parameter"
    condition: "the {id} in the path matches no row of the addressed collection"
    error_id: "the addressed entity's own NOT_FOUND code (ERR_PARTICIPANT_NOT_FOUND, ERR_SUPERVISION_CASE_NOT_FOUND, ERR_PARTNERSHIP_NOT_FOUND, ERR_JOB_OPENING_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_WORK_SHIFT_NOT_FOUND, ERR_GRANT_NOT_FOUND, ERR_SUPPORT_REQUEST_NOT_FOUND, ERR_SESSION_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND)"
    http_status: 404

  # ---- 5 ownership ----------------------------------------------------------
  - rule_id: supervision-officer-owns-case
    category: ownership
    priority: 5
    applies_to: "POST /supervision-cases/{id}/status, POST /supervision-cases/{id}/work-authorization"
    condition: "the caller's role is SupervisionOfficer and X-User-ID != SupervisionCase.officer_user_id"
    error_id: ERR_NOT_CASE_OFFICER
    http_status: 403

  - rule_id: participant-owns-placement
    category: ownership
    priority: 5
    applies_to: "POST /placements/{id}/offer-response"
    condition: "the caller's role is Participant and X-User-ID != Placement.participant_id"
    error_id: ERR_NOT_PLACEMENT_PARTICIPANT
    http_status: 403

  # ---- 6 body foreign keys --------------------------------------------------
  - rule_id: body-fk-exists
    category: referential_integrity
    priority: 6
    applies_to: "POST /supervision-cases, POST /job-openings, POST /placements, POST /support-requests, POST /readiness-sessions/{id}/enrollments"
    condition: "a foreign key supplied in the request body (participant_id, partnership_id, job_opening_id, grant_id) matches no row"
    error_id: "the referenced entity's NOT_FOUND code"
    http_status: 404
    note: "Body FKs are resolved AFTER the path entity, so a bad path id and a bad body FK together yield the path error."

  # ---- 7 optimistic concurrency --------------------------------------------
  - rule_id: occ-participant-version
    category: concurrency
    priority: 7
    applies_to: "PUT /participants/{id}/release-plan"
    condition: "expected_participant_version != Participant.version"
    error_id: ERR_STALE_PARTICIPANT_VERSION
    http_status: 412

  - rule_id: occ-grant-version
    category: concurrency
    priority: 7
    applies_to: "POST /support-requests"
    condition: "expected_grant_version != FunderGrant.version"
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412

  - rule_id: occ-job-opening-version
    category: concurrency
    priority: 7
    applies_to: "POST /placements"
    condition: "expected_job_opening_version != JobOpening.version"
    error_id: ERR_STALE_JOB_OPENING_VERSION
    http_status: 412
    note: "Checked before any business gate on the opening, so a stale version on a FILLED opening returns 412, not ERR_JOB_OPENING_NOT_OPEN."

  # ---- 8 own-state gates ----------------------------------------------------
  - rule_id: transition-declared
    category: own_state
    priority: 8
    applies_to: "every action endpoint that names a target state"
    condition: "the requested (from, to) pair is not a declared transition of the addressed entity's machine, including any attempt to leave a terminal state or to re-apply a transition already taken"
    error_id: "the entity's own invalid-state code (ERR_PARTICIPANT_INVALID_STATE, ERR_SUPERVISION_CASE_INVALID_STATE, ERR_PARTNERSHIP_INVALID_STATE, ERR_PLACEMENT_INVALID_STATE, ERR_WORK_SHIFT_INVALID_STATE, ERR_SUPPORT_REQUEST_INVALID_STATE, ERR_SESSION_INVALID_STATE, ERR_ENROLLMENT_INVALID_STATE, ERR_BONDING_INVALID_STATE)"
    http_status: 409

  - rule_id: partnership-open-for-bonding
    category: own_state
    priority: 8
    applies_to: "POST /employer-partnerships/{id}/bonding-agreement"
    condition: "EmployerPartnership.status IN {SUSPENDED, TERMINATED}"
    error_id: ERR_PARTNERSHIP_INVALID_STATE
    http_status: 409

  - rule_id: participant-not-exited
    category: own_state
    priority: 8
    applies_to: "PUT /participants/{id}, PUT /participants/{id}/release-plan, POST /participants/{id}/assessment, POST /participants/{id}/document-verifications, POST /participants/{id}/license-relief, POST /participants/{id}/suspension"
    condition: "Participant.stage == EXITED"
    error_id: ERR_PARTICIPANT_INVALID_STATE
    http_status: 409

  # ---- 9 related-entity state gates ----------------------------------------
  - rule_id: participant-not-suspended-for-support
    category: business_referential
    priority: 9
    applies_to: "POST /support-requests, POST /readiness-sessions/{id}/enrollments, POST /placements"
    condition: "the target Participant has suspension_status == SUSPENDED"
    error_id: ERR_PARTICIPANT_SUSPENDED
    http_status: 409
    note: "Deliberately ranked above every fiscal and capacity gate — see §1.8 priority_pair_validation_conflict."

  - rule_id: partnership-active-for-placement
    category: business_referential
    priority: 9
    applies_to: "POST /placements"
    condition: "the JobOpening's EmployerPartnership.status != ACTIVE"
    error_id: ERR_PARTNERSHIP_NOT_ACTIVE
    http_status: 409

  - rule_id: work-authorization-approved-for-shift
    category: business_referential
    priority: 9
    applies_to: "POST /placements/{id}/work-shifts"
    condition: "the participant has no SupervisionCase with status == ACTIVE and work_authorization_status == APPROVED"
    error_id: ERR_WORK_NOT_AUTHORIZED
    http_status: 409
    note: "Ranked above the window-containment temporal check, so an unauthorised participant with an out-of-window shift gets this error."

  - rule_id: placement-active-for-shift
    category: business_referential
    priority: 9
    applies_to: "POST /placements/{id}/work-shifts"
    condition: "Placement.employment_status != ACTIVE"
    error_id: ERR_PLACEMENT_INVALID_STATE
    http_status: 409

  - rule_id: grant-not-exhausted
    category: business_referential
    priority: 9
    applies_to: "POST /support-requests"
    condition: "FunderGrant.funding_posture == EXHAUSTED"
    error_id: ERR_GRANT_EXHAUSTED
    http_status: 409

  # ---- 10 safety / eligibility / segregation of duties ---------------------
  - rule_id: record-category-barred
    category: business_safety
    priority: 10
    applies_to: "POST /placements"
    condition: "any element of Participant.record_categories appears in JobOpening.barred_record_categories or in the EmployerPartnership.excluded_record_categories"
    error_id: ERR_RECORD_CATEGORY_BARRED
    http_status: 409
    note: "Ranked above the opening-capacity gate — see §1.8 priority_pair_validation_conflict."

  - rule_id: license-relief-required
    category: business_safety
    priority: 10
    applies_to: "POST /placements"
    condition: "JobOpening.requires_license == true and the Participant's license_relief_status != RELIEF_GRANTED or license_relief_occupation_code != JobOpening.license_occupation_code"
    error_id: ERR_LICENSE_RELIEF_REQUIRED
    http_status: 409

  - rule_id: fidelity-bond-required
    category: business_safety
    priority: 10
    applies_to: "POST /placements"
    condition: "JobOpening.requires_fidelity_bond == true and the JobOpening's EmployerPartnership.fidelity_bond_enabled == false"
    error_id: ERR_FIDELITY_BOND_UNAVAILABLE
    http_status: 409

  - rule_id: bonding-not-offered-by-employer
    category: business_safety
    priority: 10
    applies_to: "POST /placements/{id}/bonding"
    condition: "to_status == REQUESTED and the placement's EmployerPartnership.fidelity_bond_enabled == false"
    error_id: ERR_FIDELITY_BOND_UNAVAILABLE
    http_status: 409

  - rule_id: reviewer-is-not-submitter
    category: business_safety
    priority: 10
    applies_to: "POST /support-requests/{id}/review"
    condition: "X-User-ID == SupportRequest.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409

  - rule_id: settler-is-not-reviewer
    category: business_safety
    priority: 10
    applies_to: "POST /support-requests/{id}/settle"
    condition: "X-User-ID == SupportRequest.reviewed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409

  # ---- 11 temporal windows and overlaps ------------------------------------
  - rule_id: shift-inside-approved-window
    category: business_temporal
    priority: 11
    applies_to: "POST /placements/{id}/work-shifts"
    condition: "the shift's minute-of-day span is not fully contained in [approved_window_start_minute, approved_window_end_minute] of the participant's ACTIVE SupervisionCase, or the shift spans more than one UTC calendar day"
    error_id: ERR_SHIFT_OUTSIDE_WINDOW
    http_status: 409

  - rule_id: shift-not-in-past
    category: business_temporal
    priority: 11
    applies_to: "POST /placements/{id}/work-shifts"
    condition: "starts_at <= the logical clock's current UTC instant"
    error_id: ERR_SHIFT_IN_PAST
    http_status: 409

  - rule_id: shift-overlaps-shift
    category: business_temporal
    priority: 11
    applies_to: "POST /placements/{id}/work-shifts"
    condition: "the half-open interval [starts_at, ends_at) intersects that of another WorkShift with status IN {SCHEDULED, CONFLICTED, WORKED} belonging to any placement of the same participant; touching endpoints do not intersect"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409

  - rule_id: shift-conflicts-session
    category: business_temporal
    priority: 11
    applies_to: "POST /placements/{id}/work-shifts"
    condition: "the shift's interval inflated by COMMUTE_BUFFER_MINUTES (45) on BOTH sides, treated as a CLOSED interval, intersects the interval of a ReadinessSession with status == SCHEDULED in which the same participant holds a SessionEnrollment with status == ENROLLED"
    error_id: ERR_SHIFT_CONFLICTS_SESSION
    http_status: 409
    note: "Closed interval plus a 45-minute buffer on each side — adjacency IS a conflict here, unlike shift-overlaps-shift."

  - rule_id: coach-double-booked
    category: business_temporal
    priority: 11
    applies_to: "POST /readiness-sessions"
    condition: "the half-open interval [starts_at, ends_at) intersects that of another ReadinessSession with status == SCHEDULED and the same coach_user_id; no buffer is applied and back-to-back sessions are allowed"
    error_id: ERR_COACH_DOUBLE_BOOKED
    http_status: 409

  - rule_id: enrollment-session-in-future
    category: business_temporal
    priority: 11
    applies_to: "POST /readiness-sessions/{id}/enrollments"
    condition: "the ReadinessSession's starts_at <= the logical clock's current UTC instant"
    error_id: ERR_SESSION_ALREADY_STARTED
    http_status: 409

  - rule_id: retention-milestone-elapsed
    category: business_temporal
    priority: 11
    applies_to: "POST /placements/{id}/retention-check"
    condition: "the logical clock is earlier than Placement.start_date plus milestone_days days"
    error_id: ERR_MILESTONE_NOT_REACHED
    http_status: 409

  # ---- 12 capacity, rounds and uniqueness ----------------------------------
  - rule_id: opening-has-remaining-seats
    category: business_constraint
    priority: 12
    applies_to: "POST /placements"
    condition: "JobOpening.status != OPEN or JobOpening.remaining_openings <= 0"
    error_id: ERR_JOB_OPENING_NOT_OPEN
    http_status: 409

  - rule_id: partnership-concurrency-cap
    category: business_constraint
    priority: 12
    applies_to: "POST /placements/{id}/offer-response"
    condition: "response == ACCEPTED and EmployerPartnership.active_placement_count >= EmployerPartnership.max_concurrent_placements"
    error_id: ERR_PARTNERSHIP_CAPACITY_REACHED
    http_status: 409

  - rule_id: session-has-remaining-seats
    category: business_constraint
    priority: 12
    applies_to: "POST /readiness-sessions/{id}/enrollments"
    condition: "ReadinessSession.remaining_seats <= 0"
    error_id: ERR_SESSION_FULL
    http_status: 409

  - rule_id: enrollment-unique-per-session
    category: business_constraint
    priority: 12
    applies_to: "POST /readiness-sessions/{id}/enrollments"
    condition: "the participant already holds a SessionEnrollment on this session with status IN {ENROLLED, ATTENDED, NO_SHOW}"
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409

  - rule_id: placement-unique-per-opening
    category: business_constraint
    priority: 12
    applies_to: "POST /placements"
    condition: "the participant already holds a Placement on this JobOpening with employment_status IN {OFFERED, ACTIVE}"
    error_id: ERR_DUPLICATE_PLACEMENT
    http_status: 409

  - rule_id: info-rounds-remain
    category: business_constraint
    priority: 12
    applies_to: "POST /support-requests/{id}/resubmit, POST /support-requests/{id}/review"
    condition: "the request is being driven around the information-request loop — a resubmit, or a review carrying decision == INFO_REQUESTED — and SupportRequest.info_rounds_used >= INFO_MAX_ROUNDS (2)"
    error_id: ERR_INFO_ROUNDS_EXHAUSTED
    http_status: 409

  - rule_id: petition-rounds-remain
    category: business_constraint
    priority: 12
    applies_to: "POST /participants/{id}/license-relief"
    condition: "the transition is INFO_REQUESTED → PETITION_SUBMITTED and Participant.petition_rounds_used >= PETITION_MAX_ROUNDS (2)"
    error_id: ERR_PETITION_ROUNDS_EXHAUSTED
    http_status: 409

  - rule_id: verification-document-required
    category: business_constraint
    priority: 12
    applies_to: "POST /participants/{id}/document-verifications"
    condition: "document_type is not an element of Participant.required_document_types, or is already present in verified_document_types"
    error_id: ERR_DOCUMENT_NOT_REQUIRED
    http_status: 409

  - rule_id: bonding-agreement-once
    category: business_constraint
    priority: 12
    applies_to: "POST /employer-partnerships/{id}/bonding-agreement"
    condition: "EmployerPartnership.fidelity_bond_enabled is already true"
    error_id: ERR_BOND_ALREADY_RECORDED
    http_status: 409

  - rule_id: partnership-must-be-drained
    category: business_constraint
    priority: 12
    applies_to: "POST /employer-partnerships/{id}/status"
    condition: "to_status == TERMINATED and EmployerPartnership.active_placement_count > 0"
    error_id: ERR_PARTNERSHIP_HAS_ACTIVE_PLACEMENTS
    http_status: 409

  - rule_id: participant-must-be-drained
    category: business_constraint
    priority: 12
    applies_to: "POST /participants/{id}/exit"
    condition: "any Placement of this participant has employment_status == ACTIVE"
    error_id: ERR_PARTICIPANT_HAS_ACTIVE_PLACEMENT
    http_status: 409

  - rule_id: retention-milestone-once
    category: business_constraint
    priority: 12
    applies_to: "POST /placements/{id}/retention-check"
    condition: "the placement already carries an outcome for the supplied milestone_days"
    error_id: ERR_MILESTONE_ALREADY_RECORDED
    http_status: 409

  - rule_id: grant-category-allowed
    category: business_constraint
    priority: 12
    applies_to: "POST /support-requests"
    condition: "SupportRequest.category is absent from FunderGrant.allowed_categories"
    error_id: ERR_CATEGORY_NOT_FUNDABLE
    http_status: 409

  # ---- 13 fiscal caps ------------------------------------------------------
  - rule_id: per-participant-cap
    category: business_fiscal
    priority: 13
    applies_to: "POST /support-requests, POST /support-requests/{id}/resubmit"
    condition: "the sum of total_charge_cents already held by this participant's SupportRequest rows on this grant with status IN {APPROVED, DISBURSED, DEFERRED, SUBMITTED, INFO_REQUESTED} plus this request's total_charge_cents is STRICTLY GREATER THAN FunderGrant.per_participant_cap_cents"
    error_id: ERR_PARTICIPANT_CAP_EXCEEDED
    http_status: 409
    note: "Landing exactly on the cap is allowed; one cent past it is refused. On resubmit the request's own prior total is excluded from the running sum."

  - rule_id: subsidy-placement-cap
    category: business_fiscal
    priority: 13
    applies_to: "POST /placements/{id}/work-shifts"
    condition: "the placement's projected_subsidy_cents recomputed with the new shift would exceed SUBSIDY_PLACEMENT_CAP_CENTS (120000)"
    error_id: ERR_SUBSIDY_CAP_EXCEEDED
    http_status: 409

  - rule_id: grant-funds-available-for-shift
    category: business_fiscal
    priority: 13
    applies_to: "POST /placements/{id}/work-shifts"
    condition: "the increase in projected_subsidy_cents caused by the new shift exceeds the funding FunderGrant.available_cents"
    error_id: ERR_GRANT_FUNDS_INSUFFICIENT
    http_status: 409

# =============================================================================
# §1.5 Endpoint Table
# Flat top-level collections; every relationship is expressed by foreign key and
# reachable through a filtered list or a sub-resource list. `input:` lists body
# fields for writes and query parameters for reads; a trailing `?` marks the
# field optional.
# =============================================================================
endpoints:

  # ---- test-driving clock --------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: |
      Sets the server's logical current UTC instant. Every temporal rule in this
      API (window containment, milestone elapse, past-shift refusal, deferral
      stamps) reads this clock and never the wall clock. Default at boot is
      2026-08-01T00:00:00Z.
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "no entity is mutated; nothing is recomputed retroactively"
    errors: [ERR_VALIDATION]
    note: "Priority-1 authentication is NOT applied to this endpoint (§1.4 auth-header-present)."

  # ---- Participant ---------------------------------------------------------
  - method: POST
    path: /participants
    description: "Enrols a participant in pre-release engagement."
    roles: [CaseManager]
    input: [full_name, facility_name, facility_state, expected_release_date, record_categories, required_document_types, "assigned_case_manager_user_id?"]
    output: Participant
    side_effects:
      - "stage initialised to PRE_RELEASE, suspension_status to NONE, license_relief_status to NONE"
      - "doc_completeness_pct computed as 0.0 from an empty verified_document_types"
      - "engagement_posture computed as OPEN"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION]

  - method: GET
    path: /participants/{id}
    description: "Reads one participant with every derived field."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: []
    output: Participant
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PARTICIPANT_NOT_FOUND]

  - method: GET
    path: /participants
    description: "Lists participants with pagination and filters."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: ["limit?", "offset?", "stage?", "barrier_tier?", "engagement_posture?", "facility_state?"]
    output: Participant[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_VALIDATION]
    note: "Default ordering is created_at ASC."

  - method: PUT
    path: /participants/{id}
    description: "Updates intake attributes. Does not touch any state dimension."
    roles: [CaseManager]
    input: ["full_name?", "facility_name?", "facility_state?", "expected_release_date?", "record_categories?", "required_document_types?"]
    output: Participant
    side_effects:
      - "if required_document_types changes, doc_completeness_pct is recomputed against the new denominator and verified types no longer required are dropped from verified_document_types"
      - "engagement_posture recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTICIPANT_NOT_FOUND, ERR_PARTICIPANT_INVALID_STATE]

  - method: POST
    path: /participants/{id}/assessment
    description: "Records the five barrier-domain scores from the pre-release assessment."
    roles: [CaseManager]
    input: [assessment_domain_scores]
    output: Participant
    side_effects:
      - "barrier_score and barrier_tier computed by calculations.participant_barrier_score"
      - "release-readiness re-evaluated; stage may advance PRE_RELEASE → RELEASE_READY"
      - "engagement_posture recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTICIPANT_NOT_FOUND, ERR_PARTICIPANT_INVALID_STATE]
    note: "Re-recording overwrites the previous scores and rescores the participant."

  - method: POST
    path: /participants/{id}/document-verifications
    description: "Confirms one vital document has been obtained."
    roles: [CaseManager]
    input: [document_type]
    output: Participant
    side_effects:
      - "document_type appended to verified_document_types"
      - "doc_completeness_pct recomputed by calculations.doc_completeness_pct"
      - "release-readiness re-evaluated; stage may advance PRE_RELEASE → RELEASE_READY when the percentage reaches exactly 80.0"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTICIPANT_NOT_FOUND, ERR_PARTICIPANT_INVALID_STATE, ERR_DOCUMENT_NOT_REQUIRED]

  - method: PUT
    path: /participants/{id}/release-plan
    description: "Stores a release-plan revision. OCC-guarded on the participant."
    roles: [CaseManager]
    input: [expected_participant_version, housing_plan_type, transportation_plan_type, health_coverage_target, planned_release_date]
    output: Participant
    side_effects:
      - "release_plan_revision incremented by 1 and release_plan_status set to DRAFT"
      - "if the participant was RELEASE_READY on the strength of an APPROVED plan, stage reverts to PRE_RELEASE"
      - "transportation_plan_type feeds calculations.job_match_score.access_component for future placements"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTICIPANT_NOT_FOUND, ERR_STALE_PARTICIPANT_VERSION, ERR_PARTICIPANT_INVALID_STATE]

  - method: POST
    path: /participants/{id}/release-plan/approve
    description: "Director approval of the current release-plan revision."
    roles: [ProgramDirector]
    input: []
    output: Participant
    side_effects:
      - "release_plan_status set to APPROVED"
      - "release-readiness re-evaluated; stage may advance PRE_RELEASE → RELEASE_READY"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PARTICIPANT_NOT_FOUND, ERR_PARTICIPANT_INVALID_STATE]
    note: "Refused with ERR_PARTICIPANT_INVALID_STATE when release_plan_status is NONE or already APPROVED."

  - method: POST
    path: /participants/{id}/release
    description: "Records the actual release and moves the participant into the community."
    roles: [CaseManager]
    input: [actual_release_date]
    output: Participant
    side_effects:
      - "actual_release_date stored; stage RELEASE_READY → POST_RELEASE"
      - "engagement_posture recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTICIPANT_NOT_FOUND, ERR_PARTICIPANT_INVALID_STATE]

  - method: POST
    path: /participants/{id}/suspension
    description: "Suspends or reinstates programme participation."
    roles: [ProgramDirector]
    input: [to_status, "suspension_reason?"]
    output: Participant
    side_effects:
      - "suspension_status set; engagement_posture recomputed (FROZEN on suspension)"
      - "on suspension, ENROLLED enrollments on SCHEDULED sessions are WITHDRAWN and their seats returned"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTICIPANT_NOT_FOUND, ERR_PARTICIPANT_INVALID_STATE]

  - method: POST
    path: /participants/{id}/license-relief
    description: "Drives the occupational-licensing relief petition dimension."
    roles: [CaseManager, ProgramDirector]
    input: [to_status, "occupation_code?", "note?"]
    output: Participant
    side_effects:
      - "license_relief_status set; license_relief_occupation_code stored on first submission"
      - "petition_rounds_used incremented on the INFO_REQUESTED → PETITION_SUBMITTED cycle edge"
      - "engagement_posture recomputed (RESTRICTED on PETITION_DENIED)"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTICIPANT_NOT_FOUND, ERR_PARTICIPANT_INVALID_STATE, ERR_PETITION_ROUNDS_EXHAUSTED]

  - method: POST
    path: /participants/{id}/exit
    description: "Closes the case. Terminal for every participant dimension."
    roles: [ProgramDirector]
    input: [exit_reason, exit_date]
    output: Participant
    side_effects:
      - "stage → EXITED, engagement_posture → FROZEN"
      - "ENROLLED enrollments WITHDRAWN with seat return"
      - "SUBMITTED / INFO_REQUESTED / APPROVED / DEFERRED support requests VOIDED; each APPROVED void releases committed funds, re-runs calculations.grant_ledger and may promote one DEFERRED request"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_VALIDATION, ERR_PARTICIPANT_NOT_FOUND, ERR_PARTICIPANT_INVALID_STATE, ERR_PARTICIPANT_HAS_ACTIVE_PLACEMENT]

  - method: GET
    path: /participants/{id}/readiness-summary
    description: "Computed read of the release-readiness predicate and its inputs."
    roles: [CaseManager, EmployerLiaison, ProgramDirector, SupervisionOfficer, Participant, FunderAnalyst]
    input: []
    output: "{ participant_id: string, stage: string, doc_completeness_pct: number, required_document_count: integer, verified_document_count: integer, barrier_score: number, barrier_tier: string, release_plan_status: string, readiness_met: boolean }"
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_PARTICIPANT_NOT_FOUND]

