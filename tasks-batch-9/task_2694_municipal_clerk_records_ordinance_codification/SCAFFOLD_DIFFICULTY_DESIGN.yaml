              as: CityClerk
              as_user_id: "cc-01"
              captures: { m_below: $.data.id, m_below_v: $.data.version }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue_at}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
