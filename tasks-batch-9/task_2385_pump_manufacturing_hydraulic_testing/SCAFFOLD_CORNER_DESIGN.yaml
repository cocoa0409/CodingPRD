            - "the set call returns 200 with current_utc == 2028-09-15T00:00:00Z"
            - "the second read returns 200 with current_utc == 2028-09-15T00:00:00Z"

  # =====================================================================
  # errors
  # =====================================================================
  - section: errors
    instances:
      - name: create_foundry_missing_x_user_id_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope.error
        distinguishing_aspect: |
          Authentication is priority 1, ahead of authorisation and of every body check: a request with no
          X-User-ID and no X-User-Role must return 401 ERR_UNAUTHENTICATED even though the body is also
          malformed, so an anonymous caller learns nothing about the payload rules.
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH" }
              as: none
          assert:
            - "HTTP status is 401 with error_id ERR_UNAUTHENTICATED"
            - "the response does NOT carry ERR_INVALID_REQUEST or ERR_UNAUTHORIZED"
            - "GET /foundries returns total_count == 0"
      - name: error_envelope_is_identical_across_status_classes_for_rejected_requests
        claim_type: violation_to_error
        grounds:
          - response_envelope.error
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_DUPLICATE_CODE]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Every failure, whatever its status class, must use the same three-key error envelope:
          response_type error, data.error_id and data.message, plus the standard meta - so a client can
          parse a 400, a 403, a 404 and a 409 with one code path and never sees a bare string or a partial
          entity.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH exists so that the duplicate-code path is reachable."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "GET /foundries/55555555-5555-5555-5555-555555555555"
              payload: {}
              as: ProductionPlanner
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-EAST" }
              as: PlatformAdmin
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "Clone Works", approved_alloys: ["CI_GG25"], concurrent_pour_capacity: 1 }
              as: PlatformAdmin
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
          assert:
            - "the four calls return 404, 400, 409 and 403 in that order"
            - "their error_ids are ERR_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DUPLICATE_CODE and ERR_UNAUTHORIZED"
            - "every one of the four responses has response_type == error and carries exactly error_id and message under data"
            - "every one of the four responses carries meta.api_request_id and meta.api_request_timestamp"
            - "GET /foundries returns total_count == 1 and GET /pump-models returns total_count == 0"

  # =====================================================================
  # rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: foundry_partner_cannot_create_a_pump_model_returns_unauthorized
        claim_type: exclusive_operation
        grounds:
          - roles.PlatformAdmin
          - roles.FoundryPartner
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The catalogue is PlatformAdmin's exclusive territory: an authenticated FoundryPartner posting a
          pump model must get 403 ERR_UNAUTHORIZED, not 401 and not a silent success, and the identical
          body must succeed for PlatformAdmin.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH exists so the FoundryPartner caller is a valid entity-backed principal."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
          assert:
            - "the first call returns 403 with error_id ERR_UNAUTHORIZED"
            - "the second call returns 201 and PumpModel.${m1_id}.model_code == HSC-14"
            - "GET /pump-models returns total_count == 1"
      - name: application_engineer_cannot_approve_their_own_selection_returns_unauthorized
        claim_type: exclusive_operation
        grounds:
          - roles.HydraulicApprover
          - roles.ApplicationEngineer
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          approve is HydraulicApprover's only exclusive operation, and the engineer who owns the selection
          does not inherit it: the 403 must fire on the role check at priority 2, before the segregation
          check at priority 7 that would also have blocked the same user.
        test_recipe:
          setup:
            - "Selection on APP-1001 is PROPOSED by ApplicationEngineer eng-101."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
