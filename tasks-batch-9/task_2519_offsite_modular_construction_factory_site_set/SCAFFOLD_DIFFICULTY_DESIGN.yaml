  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: design_freeze_state_revision_loop_reenters_in_review_under_segregation_of_duties
        grounds:
          - state_machines[DesignPackage.freeze_state]
          - validations[priority=8]
          - validations[priority=41]
          - endpoints[POST /modular/design-packages/{packageId}/submit]
          - endpoints[POST /modular/design-packages/{packageId}/review-decision]
        distinguishing_aspect: |
          This is the backward-then-forward cycle DRAFT -> IN_REVIEW -> REVISION_REQUIRED ->
          IN_REVIEW -> FROZEN: the same package re-enters a state it has already left, the
          revision_round counter distinguishes the two visits, and the segregation-of-duties gate
          re-applies on the second review so the submitter still cannot self-approve. A linear
          reading of the machine would either reject the re-submit or let eng-001 close the loop.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; Factory and Project created"
            - "DRAFT design package R1 authored by eng-001 with 2 open connection conflicts and 9 open field-scope items, i.e. factory_compatibility_score 34 (100 - 8*2 - 5*9 - 5), well below the freeze floor of 70"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "FIELD_COORDINATED", open_connection_conflicts: 2, field_scope_items_open: 9 }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
          trigger:
            - call: "POST /modular/design-packages/${pkg}/submit"
              payload: { review_note: "R1 first pass" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { s1: "$.data.freeze_state", r1: "$.data.revision_round" }
            - call: "POST /modular/design-packages/${pkg}/review-decision"
              payload: { decision: "RETURN_FOR_REVISION", review_note: "resolve chase conflicts before freeze" }
              as: DesignEngineer
              as_user_id: "eng-002"
              captures: { s2: "$.data.freeze_state", r2: "$.data.revision_round" }
            - call: "POST /modular/design-packages/${pkg}/review-decision"
              payload: { decision: "FREEZE" }
              as: DesignEngineer
              as_user_id: "eng-002"
              captures: { blocked: "$.data.error_id" }
            - call: "POST /modular/design-packages/${pkg}/submit"
              payload: { open_connection_conflicts: 0, field_scope_items_open: 2, connection_detail_state: "COMPLETE", review_note: "R1 rework: conflicts closed, field scope reduced" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { s3: "$.data.freeze_state", r3: "$.data.revision_round" }
            - call: "POST /modular/design-packages/${pkg}/review-decision"
              payload: { decision: "FREEZE", review_note: "compatible" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { sod: "$.data.error_id" }
            - call: "POST /modular/design-packages/${pkg}/review-decision"
              payload: { decision: "FREEZE", review_note: "compatible" }
              as: DesignEngineer
              as_user_id: "eng-002"
              captures: { s4: "$.data.freeze_state" }
          assert:
            - "${s1} == 'IN_REVIEW' and ${r1} == 1"
            - "${s2} == 'REVISION_REQUIRED' and ${r2} == 1 — the round counter advances on re-submit, not on return"
            - "${blocked} == 'ERR_DESIGN_NOT_IN_REVIEW' (409) — REVISION_REQUIRED is not a reviewable state, so the machine cannot skip the re-submit"
            - "${s3} == 'IN_REVIEW' and ${r3} == 2 — the second visit to IN_REVIEW is distinguishable from the first"
            - "${sod} == 'ERR_SAME_ACTOR_REVIEW' (409) — segregation of duties re-applies on the second review, priority 8"
            - "${s4} == 'FROZEN' and factory_compatibility_score == 90 — the re-submit payload lowered the penalties from 66 to 10, so the freeze gate (>= 70) now clears"
            - "GET /modular/projects/${proj} reports phase == 'DESIGN_FROZEN'"

      - name: production_status_release_backward_edge_and_in_line_self_loop
        grounds:
          - state_machines[ModuleUnit.production_status]
          - calculations.line_slot_schedule
          - entities.Factory.fields.committed_line_minutes
          - endpoints[POST /modular/modules/{moduleId}/release-line-slot]
          - endpoints[POST /modular/modules/{moduleId}/advance-station]
