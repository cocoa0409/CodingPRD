scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: watch_group_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.WatchGroup.fields.certification_status, entities.WatchGroup.fields.posture, entities.WatchGroup.fields.sign_inventory_count]
        distinguishing_aspect: "A freshly created WatchGroup applies its declared defaults: certification_status UNCERTIFIED, posture DORMANT, both inventories 0, participation_score 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Default Watch", precinct_code: "D01" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
          trigger:
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { cert: $.data.certification_status, post: $.data.posture, inv: $.data.sign_inventory_count, mat: $.data.materials_inventory_count, sc: $.data.participation_score, v: $.data.version }
          assert:
            - "cert == UNCERTIFIED and post == DORMANT"
            - "inv == 0 and mat == 0 and sc == 0 and v == 1"

      - name: member_creation_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Member.fields.full_name, "validations[priority=13]"]
        distinguishing_aspect: "POST /watch/members omitting required full_name is rejected ERR_INVALID_REQUEST (400); no member row is created."
        test_recipe:
          setup: ["group + REGISTERED block exist"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Req Watch", precinct_code: "D02" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "1-1 Test Ln", household_count: 3 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (missing required full_name)"

      - name: member_roster_visibility_default_group_only
        claim_type: defaults
        grounds: [entities.Member.fields.roster_visibility]
        distinguishing_aspect: "Omitting roster_visibility on member create stores the default GROUP_ONLY."
        test_recipe:
          setup: ["group + REGISTERED block exist"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Vis Watch", precinct_code: "D03" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "2-2 Test Ln", household_count: 3 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Vis M", contact_channel: "EMAIL" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
          trigger:
            - call: "GET /watch/members/${m1}"
              payload: {}
              as: ProgramCoordinator
              captures: { vis: $.data.roster_visibility }
          assert:
            - "vis == GROUP_ONLY"

      - name: entity_get_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but absent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /watch/watch-groups/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: member_computed_fields_input_ignored_on_create
        claim_type: computed_fields
        grounds: [entities.Member.fields.strike_count, entities.Member.fields.membership_status]
        distinguishing_aspect: "Client-supplied strike_count / membership_status on create are ignored: the stored member has strike_count 0 and membership_status ACTIVE. The pinned contract is 'undeclared body fields are ignored; defaults win'."
        test_recipe:
          setup: ["group + REGISTERED block exist"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Comp Watch", precinct_code: "D04" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "3-3 Test Ln", household_count: 3 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Comp M", contact_channel: "SMS", strike_count: 5, membership_status: "SUSPENDED" }
              as: ProgramCoordinator
              captures: { sc: $.data.strike_count, st: $.data.membership_status }
          assert:
            - "sc == 0 and st == ACTIVE (computed/system-managed fields override client input)"

      - name: incident_report_invalid_enum_category_rejected
        claim_type: type_constraints
        grounds: [entities.IncidentReport.fields.category, "validations[priority=13]"]
        distinguishing_aspect: "category outside the declared enum is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["group + REGISTERED block + ACTIVE member"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Enum Watch", precinct_code: "D05" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "4-4 Test Ln", household_count: 3 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Enum M", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /watch/incident-reports"
              payload: { block_id: "${b1}", reporter_member_id: "${m1}", category: "WITCHCRAFT", occurred_at: "2026-08-01T10:00:00Z", severity: 2 }
              as: Member
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (category not in enum)"

      - name: block_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and returns the pinned envelope fields total_count and has_more."
        test_recipe:
          setup: ["one group with 3 blocks created"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Page Watch", precinct_code: "D06" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "1-1 Page St", household_count: 2 }
              as: ProgramCoordinator
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "2-2 Page St", household_count: 2 }
              as: ProgramCoordinator
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "3-3 Page St", household_count: 2 }
              as: ProgramCoordinator
          trigger:
            - call: "GET /watch/watch-groups/${wg}/blocks"
              payload: { limit: 2, offset: 0 }
              as: ProgramCoordinator
          assert:
            - "response data array length == 2 and pagination block reports total_count == 3 and has_more == true"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: incident_report_initial_state_submitted
        claim_type: initial_state
        grounds: [state_machines.IncidentReport]
        distinguishing_aspect: "A newly filed IncidentReport starts in SUBMITTED with corroboration_weight 0 and shared_with_liaison false."
        test_recipe:
          setup: ["group + REGISTERED block + ACTIVE member"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Init Watch", precinct_code: "S01" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "1-1 State St", household_count: 4 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Init M", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /watch/incident-reports"
              payload: { block_id: "${b1}", reporter_member_id: "${m1}", category: "NOISE", occurred_at: "2026-08-01T09:00:00Z", severity: 1 }
              as: Member
              as_user_id: "${m1}"
              captures: { st: $.data.review_status, w: $.data.corroboration_weight, sh: $.data.shared_with_liaison }
          assert:
            - "st == SUBMITTED and w == 0 and sh == false"

      - name: terminal_state_lockdown_dismissed_report_rejects_all_actions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.IncidentReport]
        distinguishing_aspect: "From DISMISSED every further action (begin-review, request-info, corroborate, clear, dismiss) is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["report moved SUBMITTED -> UNDER_REVIEW -> DISMISSED"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Term Watch", precinct_code: "S02" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "2-2 State St", household_count: 4 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Term M", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/incident-reports"
              payload: { block_id: "${b1}", reporter_member_id: "${m1}", category: "OTHER", occurred_at: "2026-08-01T09:00:00Z", severity: 1 }
              as: Member
              as_user_id: "${m1}"
              captures: { ir: $.data.id }
            - call: "POST /watch/incident-reports/${ir}/begin-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/incident-reports/${ir}/dismiss"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /watch/incident-reports/${ir}/corroborate"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (DISMISSED is terminal; the dismissal also leaves corroboration_weight == 0)"

      - name: invalid_transition_alert_send_from_draft
        claim_type: invalid_transition
        grounds: [state_machines.Alert]
        distinguishing_aspect: "Excluded here — asserted as the winning branch of the §1.8 priority instance."
        excluded_because:
          difficulty_instance: state_vs_business_temporal_on_alert_send
          rationale: "DRAFT -> SENT rejection with ERR_INVALID_STATE is exactly the priority-conflict trigger; covered there."

      - name: member_double_suspend_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Member.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Suspending an already-SUSPENDED member fails ERR_INVALID_STATE; the second call fires no cascade (captain assignment state unchanged, posture unchanged)."
        test_recipe:
          setup: ["OPERATIONAL group, m1 captain, m1 already SUSPENDED once (which revoked the captaincy and dropped posture to DEGRADED)"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Idem Watch", precinct_code: "S03" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "3-3 State St", household_count: 4 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { b1_v: $.data.version }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Idem M", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "BS03", full_name: "Officer I", precinct_code: "S03" }
              as: ProgramCoordinator
              captures: { off: $.data.id }
            - call: "POST /watch/training-sessions"
              payload: { watch_group_id: "${wg}", trainer_officer_id: "${off}", curriculum: "BIAS_AVOIDANCE", scheduled_at: "2026-08-02T10:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { ts: $.data.id }
            - call: "POST /watch/training-sessions/${ts}/complete"
              payload: { attending_member_ids: ["${m1}"] }
              as: LiaisonOfficer
              as_user_id: "${off}"
            - call: "POST /watch/blocks/${b1}/captain-assignments"
              payload: { member_id: "${m1}", expected_block_version: "${b1_v}" }
              as: ProgramCoordinator
            - call: "POST /watch/members/${m1}/suspend"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /watch/members/${m1}/suspend"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (no ACTIVE -> SUSPENDED path from SUSPENDED)"

      - name: block_register_valid_transition_and_posture_bubble_up
        claim_type: side_effect_execution
        grounds: [state_machines.Block.PENDING_to_REGISTERED, state_machines.WatchGroup.DORMANT_to_FORMATION]
        distinguishing_aspect: "Registering the first block bubbles up: WatchGroup posture auto-transitions DORMANT -> FORMATION and the group version increments."
        test_recipe:
          setup: ["group with one PENDING block; group version captured before register"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Bubble Watch", precinct_code: "S04" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "4-4 State St", household_count: 4 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { v_pre: $.data.version, p_pre: $.data.posture }
          trigger:
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { bst: $.data.registration_status }
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { v_post: $.data.version, p_post: $.data.posture }
          assert:
            - "bst == REGISTERED"
            - "p_pre == DORMANT and p_post == FORMATION (bubble-up auto-transition)"
            - "v_post == v_pre + 1 (cascade bumps the parent version exactly once)"

      - name: deregister_blocked_by_open_incident_reports
        claim_type: precondition_enforcement
        grounds: [state_machines.Block.REGISTERED_to_DEREGISTERED]
        distinguishing_aspect: "Deregistration is refused while any report of the block is in {SUBMITTED, UNDER_REVIEW, NEEDS_INFO}; the error is ERR_INVALID_STATE and the block stays REGISTERED."
        test_recipe:
          setup: ["REGISTERED block with a SUBMITTED incident report"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "OpenRep Watch", precinct_code: "S05" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "5-5 State St", household_count: 4 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "OR M", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/incident-reports"
              payload: { block_id: "${b1}", reporter_member_id: "${m1}", category: "NOISE", occurred_at: "2026-08-01T09:00:00Z", severity: 1 }
              as: Member
              as_user_id: "${m1}"
          trigger:
            - call: "POST /watch/blocks/${b1}/deregister"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (open incident reports block deregistration)"

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: meeting_quorum_snapshot_and_inclusive_threshold
        claim_type: correct_result
        grounds: [calculations.meeting_quorum]
        distinguishing_aspect: "With 8 ACTIVE members the threshold is max(2, ceil(8*0.25)) = 2; attendee_count 2 meets it (inclusive >=) and attendee_count 1 fails — and the member snapshot is taken at mark-held time (mode-c evaluation order)."
        test_recipe:
          setup: ["group with 8 ACTIVE members; two meetings scheduled 18:00-19:00 and 19:00-20:00; clock at 18:30 then 19:30"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Quorum Watch", precinct_code: "C01" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "1-1 Calc St", household_count: 12 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Q1", contact_channel: "SMS" }
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Q2", contact_channel: "SMS" }
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Q3", contact_channel: "EMAIL" }
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Q4", contact_channel: "EMAIL" }
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Q5", contact_channel: "SMS" }
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Q6", contact_channel: "SMS" }
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Q7", contact_channel: "EMAIL" }
              as: ProgramCoordinator
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Q8", contact_channel: "EMAIL" }
              as: ProgramCoordinator
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "BC01", full_name: "Officer Q", precinct_code: "C01" }
              as: ProgramCoordinator
              captures: { off: $.data.id }
            - call: "POST /watch/liaison-meetings"
              payload: { watch_group_id: "${wg}", liaison_officer_id: "${off}", room_slot_start: "2026-08-05T18:00:00Z", room_slot_end: "2026-08-05T19:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { mt1: $.data.id }
            - call: "POST /watch/liaison-meetings"
              payload: { watch_group_id: "${wg}", liaison_officer_id: "${off}", room_slot_start: "2026-08-05T19:00:00Z", room_slot_end: "2026-08-05T20:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { mt2: $.data.id }
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T18:30:00Z" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /watch/liaison-meetings/${mt1}/mark-held"
              payload: { attendee_count: 2 }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { q1: $.data.quorum_met }
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T19:30:00Z" }
              as: ProgramCoordinator
            - call: "POST /watch/liaison-meetings/${mt2}/mark-held"
              payload: { attendee_count: 1 }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { q2: $.data.quorum_met }
          assert:
            - "q1 == true (2 >= max(2, ceil(8*0.25)) == 2; the >= boundary is inclusive)"
            - "q2 == false (1 < 2)"

      - name: alert_fanout_input_set_excludes_suspended_members
        claim_type: input_set_filtering
        grounds: [calculations.alert_fanout]
        distinguishing_aspect: "SUSPENDED members are excluded from the fanout input set: a block with 2 SMS ACTIVE + 1 SMS SUSPENDED member yields per-block raw 2 (not 3), so a BLOCK-scope alert to that block reports recipient_count == 2 and printed_flyers == 1."
        test_recipe:
          setup:
            - "OPERATIONAL group; block B1 with ACTIVE members m1(SMS,captain), m2(SMS), m3(SMS); m3 then SUSPENDED."
            - "BLOCK-scope SAFETY_TIP alert on B1 QUEUED; clock at scheduled_send_at."
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Filter Watch", precinct_code: "C02" }
              as: ProgramCoordinator
              captures: { wg: $.data.id, wg_v: $.data.version }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "2-2 Calc St", household_count: 6 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { b1_v: $.data.version }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "F1", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "F2", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m2: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "F3", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m3: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "BC02", full_name: "Officer F", precinct_code: "C02" }
              as: ProgramCoordinator
              captures: { off: $.data.id }
            - call: "POST /watch/training-sessions"
