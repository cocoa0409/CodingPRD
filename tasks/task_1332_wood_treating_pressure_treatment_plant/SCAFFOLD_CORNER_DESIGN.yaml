              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/suspend"
              as: ComplianceOfficer
          trigger:
            - call: "POST /treatment-plants/${plant_id}/revoke"
              as: ComplianceOfficer
            - call: "GET /treatment-plants/${plant_id}/cylinders/${cyl1_id}"
              as: ComplianceOfficer
              captures: { cyl1_status: "$.data.status" }
            - call: "GET /treatment-plants/${plant_id}/cylinders/${cyl2_id}"
