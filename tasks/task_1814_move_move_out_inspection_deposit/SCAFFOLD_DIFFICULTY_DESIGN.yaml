              as_user_id: "${ten_a}"
              captures: { disp_a: $.data.id }
            - call: "POST /pm/disputes"
              payload: { statement_id: "${stmt_b}", disputed_amount_cents: 20000, reason: "paint wear" }
              as: Tenant
              as_user_id: "${ten_b}"
              captures: { disp_b: $.data.id }
            - { call: "POST /pm/disputes/${disp_a}/counter", payload: { counter_amount_cents: 12000 }, as: PropertyManager }
          trigger:
            - { call: "POST /pm/disputes/${disp_a}/close_agreed", payload: {}, as: Tenant, as_user_id: "${ten_a}" }
            - { call: "POST /pm/disputes/${disp_b}/escalate", payload: {}, as: Tenant, as_user_id: "${ten_b}" }
