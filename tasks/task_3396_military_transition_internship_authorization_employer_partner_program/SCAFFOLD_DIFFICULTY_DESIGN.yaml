            - { call: "POST /skillbridge/internship-matches/${mt2}/installation-decision", payload: { decision: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ProgramOffice }
            - { call: "POST /skillbridge/compliance-audits", payload: { employer_id: "${emp}" }, as: ProgramOffice, captures: { a: $.data.id } }
          trigger:
