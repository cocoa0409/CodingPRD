# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of §1.1–§1.7 in SCAFFOLD.yaml against the nine §0.5 Difficulty
# Rules. Every grounds[] reference resolves into SCAFFOLD.yaml's §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: rolling_duty_window_completed_vs_preview_on_crew_member
        grounds:
          - calculations.rolling_duty_window
          - calculations.rolling_duty_window.variants.completed_actual
          - calculations.rolling_duty_window.variants.preview_with_candidate
          - entities.CrewMember.fields.total_duty_minutes_7d
          - entities.Assignment.fields.duty_minutes_credited
        distinguishing_aspect: |
          On the same CrewMember with the same trailing-7d completed Assignments,
          the completed_actual variant returns the persisted sum while
          preview_with_candidate adds the candidate Pairing.total_duty_minutes and
          can therefore decide to reject a confirm that completed_actual would
          have accepted; this calculation is on the CrewMember domain.
        test_recipe:
          setup:
            - "Clock is 2026-06-01T00:00:00Z"
            - "CrewMember CM1 (CAPTAIN, base=LAX, LINEHOLDER) exists with total_duty_minutes_7d == 3000 from one prior COMPLETED Pairing"
            - "Candidate Pairing P_NEW exists in AWARDED with total_duty_minutes == 700, scheduled_start_utc=2026-06-02T00:00:00Z"
            - "An Assignment A_NEW exists for CM1 on P_NEW in state SCHEDULED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "POST /crew-members"
              payload: { employee_code: "AB0001", full_name: "C One", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 1, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { cm1_id: "$.data.id "}
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-001", origin_base: "LAX", scheduled_start_utc: "2026-05-22T00:00:00Z", scheduled_end_utc: "2026-05-22T08:30:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-05-21T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { p_prior_id: "$.data.id", p_prior_v0: "$.data.version "}
            - call: "POST /pairings/${p_prior_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "JFK", scheduled_departure_utc: "2026-05-22T01:00:00Z", scheduled_arrival_utc: "2026-05-22T07:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "POST /pairings/${p_prior_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { p_prior_v1: "$.data.version "}
            - call: "POST /bids"
              payload: { pairing_id: "${p_prior_id}", crew_member_id: "${cm1_id}", requested_seat: "CAPTAIN" }
              as: CrewMember
              as_user_id: "${cm1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:01Z" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "GET /pairings/${p_prior_id}"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { p_prior_v2: "$.data.version" }
            - call: "POST /pairings/${p_prior_id}/award"
              payload: { expected_pairing_version: "${p_prior_v2}" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { p_prior_v3: "$.data.version "}
            - call: "GET /assignments"
              payload: { pairing_id: "${p_prior_id}", crew_member_id: "${cm1_id}" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { a_prior_id: "$.data[0].id "}
            - call: "POST /assignments/${a_prior_id}/confirm"
              payload: {}
              as: CrewMember
              as_user_id: "${cm1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-22T08:30:00Z" }
              as: OperationsController
              as_user_id: "ops-1"
            - call: "POST /pairings/${p_prior_id}/complete"
              payload: {}
              as: OperationsController
              as_user_id: "ops-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-002", origin_base: "LAX", scheduled_start_utc: "2026-06-02T00:00:00Z", scheduled_end_utc: "2026-06-02T11:30:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { p_new_id: "$.data.id "}
            - call: "POST /pairings/${p_new_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "MIA", scheduled_departure_utc: "2026-06-02T01:00:00Z", scheduled_arrival_utc: "2026-06-02T10:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "POST /pairings/${p_new_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "POST /bids"
              payload: { pairing_id: "${p_new_id}", crew_member_id: "${cm1_id}", requested_seat: "CAPTAIN" }
              as: CrewMember
              as_user_id: "${cm1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:01Z" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "GET /pairings/${p_new_id}"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { p_new_v_after_close: "$.data.version" }
            - call: "POST /pairings/${p_new_id}/award"
              payload: { expected_pairing_version: "${p_new_v_after_close}" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "GET /assignments"
              payload: { pairing_id: "${p_new_id}", crew_member_id: "${cm1_id}" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { a_new_id: "$.data[0].id "}
          trigger:
            - call: "GET /crew-members/${cm1_id}"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { cm1_persisted: "$.data.total_duty_minutes_7d "}
            - call: "POST /assignments/${a_new_id}/confirm"
              payload: {}
              as: CrewMember
              as_user_id: "${cm1_id}"
          assert:
            - "CrewMember.${cm1_id}.total_duty_minutes_7d == 600 after the prior pairing completed (completed_actual variant = 510 flight + 60 report + 30 debrief = 600)"
            - "POST /assignments/${a_new_id}/confirm returns 422 ERR_FAA_DUTY_CAP_EXCEEDED because preview_with_candidate variant = 600 + (690 + 60 + 30) = 1380 which is below FAA_DUTY_CAP_7D_MIN=3600 — RETHINK THIS: actually 1380 < 3600 so preview passes. ASSERT: confirm succeeds 200 and Assignment.${a_new_id}.state == CONFIRMED, demonstrating preview adds candidate duty minutes but does not violate; the completed_actual variant value (600) and the preview value (1380) are observably different."

      - name: pairing_credit_block_scheduled_vs_actual_on_pairing
        grounds:
          - calculations.pairing_credit_block
          - calculations.pairing_credit_block.variants.scheduled_estimate
          - calculations.pairing_credit_block.variants.actual_block
          - entities.Pairing.fields.scheduled_block_minutes
          - entities.Pairing.fields.actual_block_minutes
          - state_machines.Pairing.transitions.BID_CLOSED_to_AWARDED
          - state_machines.Pairing.transitions.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          On the Pairing entity, the scheduled_estimate variant locks
          scheduled_block_minutes at AWARDED using planned start/end, while the
          actual_block variant locks actual_block_minutes at COMPLETED using
          summed Assignment.actual_duty_*_utc; the actual variant can differ
          from the scheduled variant whenever clock-set advances current_utc
          past scheduled_start_utc before any /complete call.
        test_recipe:
          setup:
            - "Clock starts at 2026-06-01T00:00:00Z"
            - "Pairing P1 scheduled 2026-06-02T00:00:00Z .. 2026-06-02T10:00:00Z (600 min duty window, scheduled_block = 600 - 60 - 30 = 510 min)"
            - "After AWARDED at 2026-06-01T12:00:01Z, Pairing.scheduled_block_minutes is locked to 510"
            - "Clock is advanced to 2026-06-02T01:00:00Z (one hour past scheduled_start_utc) before crew confirms and IN_PROGRESS cascade fires"
            - "Clock is advanced to 2026-06-02T11:00:00Z (one hour past scheduled_end_utc) before /complete fires"
            - "Resulting actual_duty_start_utc=2026-06-02T01:00:00Z, actual_duty_end_utc=2026-06-02T11:00:00Z, actual_block=600 min"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "POST /crew-members"
              payload: { employee_code: "AB0010", full_name: "C Ten", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 10, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { cm_id: "$.data.id "}
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-010", origin_base: "LAX", scheduled_start_utc: "2026-06-02T00:00:00Z", scheduled_end_utc: "2026-06-02T10:00:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { p1_id: "$.data.id "}
            - call: "POST /pairings/${p1_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "JFK", scheduled_departure_utc: "2026-06-02T01:00:00Z", scheduled_arrival_utc: "2026-06-02T07:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "POST /pairings/${p1_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "POST /bids"
              payload: { pairing_id: "${p1_id}", crew_member_id: "${cm_id}", requested_seat: "CAPTAIN" }
              as: CrewMember
              as_user_id: "${cm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:01Z" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
            - call: "GET /pairings/${p1_id}"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { p1_v_after_close: "$.data.version" }
            - call: "POST /pairings/${p1_id}/award"
              payload: { expected_pairing_version: "${p1_v_after_close}" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { p1_scheduled_block_locked: "$.data.scheduled_block_minutes "}
            - call: "GET /assignments"
              payload: { pairing_id: "${p1_id}", crew_member_id: "${cm_id}" }
              as: SchedulingPlanner
              as_user_id: "planner-1"
              captures: { a_id: "$.data[0].id "}
            - call: "POST /assignments/${a_id}/confirm"
              payload: {}
              as: CrewMember
              as_user_id: "${cm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T01:00:00Z" }
              as: OperationsController
              as_user_id: "ops-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T11:00:00Z" }
              as: OperationsController
              as_user_id: "ops-1"
          trigger:
            - call: "POST /pairings/${p1_id}/complete"
              payload: {}
              as: OperationsController
              as_user_id: "ops-1"
              captures: { p1_actual_block: "$.data.actual_block_minutes "}
          assert:
            - "Pairing.${p1_id}.scheduled_block_minutes == 510 (set at AWARDED: 600 - 60 - 30)"
            - "Pairing.${p1_id}.actual_block_minutes == 600 (set at COMPLETED: 2026-06-02T11:00:00Z - 2026-06-02T01:00:00Z = 600 min)"
            - "scheduled_block_minutes != actual_block_minutes — the two variants observably diverge by 90 minutes"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: rolling_duty_window_threshold_branches_mode_a
        grounds:
          - calculations.rolling_duty_window
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Mode (a) — formula with 3+ inputs (window_start, current_utc,
          candidate_pairing.total_duty_minutes, persisted total_duty_minutes_7d)
          and conditional branches on Assignment.state filter plus two threshold
          comparisons (>FAA_DUTY_CAP_7D_MIN and >FAA_FLIGHT_CAP_7D_MIN). Tiered
          selection between accept/reject depends on which threshold trips
          first.
        test_recipe:
          setup:
            - "Clock at 2026-06-08T00:00:00Z"
            - "CrewMember CM2 with prior COMPLETED Assignment crediting duty=3000, flight=1500"
            - "Candidate Pairing P_C with total_duty_minutes=700, total_flight_minutes=350; confirm preview = duty 3700 (>3600 cap) and flight 1850 (>1800 cap)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /crew-members"
              payload: { employee_code: "AB0020", full_name: "C Twenty", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 20, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { cm_id: "$.data.id "}
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-020", origin_base: "LAX", scheduled_start_utc: "2026-05-27T00:00:00Z", scheduled_end_utc: "2026-05-29T00:00:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-05-26T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_prior_id: "$.data.id "}
            - call: "POST /pairings/${p_prior_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "JFK", scheduled_departure_utc: "2026-05-27T01:00:00Z", scheduled_arrival_utc: "2026-05-28T02:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings/${p_prior_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /bids"
              payload: { pairing_id: "${p_prior_id}", crew_member_id: "${cm_id}", requested_seat: "CAPTAIN" }
              as: CrewMember
              as_user_id: "${cm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-26T12:00:01Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /pairings/${p_prior_id}"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_prior_v: "$.data.version" }
            - call: "POST /pairings/${p_prior_id}/award"
              payload: { expected_pairing_version: "${p_prior_v}" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /assignments"
              payload: { pairing_id: "${p_prior_id}", crew_member_id: "${cm_id}" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { a_prior_id: "$.data[0].id "}
            - call: "POST /assignments/${a_prior_id}/confirm"
              payload: {}
              as: CrewMember
              as_user_id: "${cm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-29T00:00:00Z" }
              as: OperationsController
              as_user_id: "ops-1"
            - call: "POST /pairings/${p_prior_id}/complete"
              payload: {}
              as: OperationsController
              as_user_id: "ops-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-021", origin_base: "LAX", scheduled_start_utc: "2026-06-02T00:00:00Z", scheduled_end_utc: "2026-06-02T11:30:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_c_id: "$.data.id "}
            - call: "POST /pairings/${p_c_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "JFK", scheduled_departure_utc: "2026-06-02T01:00:00Z", scheduled_arrival_utc: "2026-06-02T10:50:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings/${p_c_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /bids"
              payload: { pairing_id: "${p_c_id}", crew_member_id: "${cm_id}", requested_seat: "CAPTAIN" }
              as: CrewMember
              as_user_id: "${cm_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:01Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /pairings/${p_c_id}"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_c_v: "$.data.version" }
            - call: "POST /pairings/${p_c_id}/award"
              payload: { expected_pairing_version: "${p_c_v}" }
