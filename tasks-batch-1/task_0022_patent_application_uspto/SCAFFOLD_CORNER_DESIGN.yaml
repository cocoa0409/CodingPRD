scaffold_corner_design:

  # ============================================================
  # Section: entities — required-field/default/computed/system claims
  # ============================================================
  - section: entities
    instances:

      - name: create_application_missing_title_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Application.fields.title
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /applications without `title` is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "LARGE applicant exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "NoTitle Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { nt_owner_id: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${nt_owner_id}", application_type: "UTILITY", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${nt_owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: create_applicant_default_entity_size_is_large
        claim_type: defaults
        grounds:
          - entities.Applicant.fields.entity_size
        distinguishing_aspect: "POST /applicants without `entity_size` defaults to LARGE."
        test_recipe:
          setup:
            - "Clock at 2026-01-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
          trigger:
            - call: "POST /applicants"
              payload: { legal_name: "Default Co", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { d_id: "$.data.id", d_size: "$.data.entity_size" }
          assert:
            - "Applicant.${d_id}.entity_size == 'LARGE' (default applied)"

      - name: create_application_system_filing_date_overrides_client_input
        claim_type: system_fields
        grounds:
          - entities.Application.fields.filing_date
        distinguishing_aspect: "filing_date is server-stamped and cannot be set by client (filing_date is not in `input:` for POST /applications)."
        test_recipe:
          setup:
            - "LARGE applicant exists; clock at 2026-05-27."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-27T08:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Sys Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { sys_owner_id: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${sys_owner_id}", application_type: "UTILITY", title: "Sys widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${sys_owner_id}"
              captures: { sys_app_id: "$.data.id", sys_filing: "$.data.filing_date" }
          assert:
            - "Application.${sys_app_id}.filing_date == '2026-05-27T08:00:00.000Z' (server clock, not client)"
            - "Application.${sys_app_id}.status == 'FILED' (initial state)"

      - name: create_application_independent_greater_than_total_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=16]
          - errors[ERR_CLAIM_COUNTS_INVALID]
        distinguishing_aspect: "independent_claim_count > claim_count is rejected with ERR_CLAIM_COUNTS_INVALID."
        test_recipe:
          setup:
            - "LARGE applicant exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "CC Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { cc_owner_id: "$.data.id" }
          trigger:
            - call: "POST /applications"
              payload: { applicant_id: "${cc_owner_id}", application_type: "UTILITY", title: "CC widget", claim_count: 5, independent_claim_count: 10 }
              as: Applicant
              as_user_id: "${cc_owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == 'ERR_CLAIM_COUNTS_INVALID'"

      - name: get_application_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_APPLICATION_NOT_FOUND]
        distinguishing_aspect: "GET /applications/{id} with a random UUID returns 404 ERR_APPLICATION_NOT_FOUND."
        test_recipe:
          setup:
            - "Server is initialized; no applications exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
          trigger:
            - call: "GET /applications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: USPTOAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == 'ERR_APPLICATION_NOT_FOUND'"

  # ============================================================
  # Section: state_machines — invalid transitions, terminal lockdown
  # ============================================================
  - section: state_machines
    instances:

      - name: docket_application_already_awaiting_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Application.FILED_to_AWAITING_EXAMINATION
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling docket on an already-AWAITING_EXAMINATION application is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "LARGE UTILITY application docketed (status=AWAITING_EXAMINATION)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "IT1 Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { it1_owner_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${it1_owner_id}", application_type: "UTILITY", title: "IT1 widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${it1_owner_id}"
              captures: { it1_app_id: "$.data.id" }
            - call: "POST /fee-payments"
              payload: { application_id: "${it1_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${it1_owner_id}"
            - call: "POST /applications/${it1_app_id}/docket"
              payload: {}
              as: USPTOExaminer
          trigger:
            - call: "POST /applications/${it1_app_id}/docket"
              payload: {}
              as: USPTOExaminer
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: docket_filed_without_filing_fee_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Application.FILED_to_AWAITING_EXAMINATION
        distinguishing_aspect: "Calling docket before FILING fee is POSTED is rejected (precondition `total_fees_paid_cents >= FILING fee` fails)."
        test_recipe:
          setup:
            - "LARGE UTILITY application in FILED, no filing fee paid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "NoFee Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { nf_owner_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${nf_owner_id}", application_type: "UTILITY", title: "NoFee widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${nf_owner_id}"
              captures: { nf_app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${nf_app_id}/docket"
              payload: {}
              as: USPTOExaminer
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: response_after_maximum_due_date_rejected_late
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Application.OFFICE_ACTION_OUTSTANDING_to_RESPONSE_FILED
        distinguishing_aspect: "Filing a response when current_utc > OfficeAction.maximum_due_date is rejected (precondition `response_filed_at <= maximum_due_date` fails)."
        test_recipe:
          setup:
            - "LARGE UTILITY application with OUTSTANDING NON_FINAL OA issued 2026-01-01; clock now at 2026-08-01 (7 months later, past 6-month max)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Late Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { late_owner_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${late_owner_id}", application_type: "UTILITY", title: "Late widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${late_owner_id}"
              captures: { late_app_id: "$.data.id" }
            - call: "POST /fee-payments"
              payload: { application_id: "${late_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${late_owner_id}"
            - call: "POST /applications/${late_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${late_app_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { late_oa_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: USPTOAdmin
          trigger:
            - call: "POST /office-action-responses"
              payload: { office_action_id: "${late_oa_id}", extension_months_requested: 3, claim_amendment_count: 10 }
              as: Applicant
              as_user_id: "${late_owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: pay_issue_fee_on_abandoned_application_terminal_state
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Application.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Pay-issue-fee on an ABANDONED Application returns ERR_INVALID_STATE (no transition out of ABANDONED)."
        test_recipe:
          setup:
            - "LARGE UTILITY application, OA OUTSTANDING, sweep run after max due date, application=ABANDONED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Term Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { term_owner_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${term_owner_id}", application_type: "UTILITY", title: "Term widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${term_owner_id}"
              captures: { term_app_id: "$.data.id" }
            - call: "POST /fee-payments"
              payload: { application_id: "${term_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${term_owner_id}"
            - call: "POST /applications/${term_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${term_app_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /_jobs/sweep-deadlines"
              payload: {}
              as: USPTOAdmin
            - call: "GET /applications/${term_app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${term_owner_id}"
              captures: { term_v_after_sweep: "$.data.version" }
          trigger:
            - call: "POST /applications/${term_app_id}/pay-issue-fee"
              payload: { amount_cents: 120000, expected_application_version: "${term_v_after_sweep}" }
              as: Applicant
              as_user_id: "${term_owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "Application.${term_app_id}.status == 'ABANDONED' (unchanged)"

      - name: convert_provisional_after_12_months_returns_late
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=12]
          - errors[ERR_PROVISIONAL_CONVERSION_LATE]
        distinguishing_aspect: "Conversion of a PROVISIONAL > 12 months after filing returns ERR_PROVISIONAL_CONVERSION_LATE."
        test_recipe:
          setup:
            - "LARGE PROVISIONAL filed on 2024-01-01; clock at 2026-01-01 (more than 12 months later)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "ProvLate Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { pl_owner_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${pl_owner_id}", application_type: "PROVISIONAL", title: "Prov widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${pl_owner_id}"
              captures: { pl_app_id: "$.data.id", pl_v0: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
          trigger:
            - call: "POST /applications/${pl_app_id}/convert-provisional-to-utility"
              payload: { title: "Converted widget", claim_count: 15, independent_claim_count: 3, expected_application_version: "${pl_v0}" }
              as: Applicant
              as_user_id: "${pl_owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == 'ERR_PROVISIONAL_CONVERSION_LATE'"

      - name: pay_maintenance_w2_before_w1_paid_out_of_order
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=17]
          - errors[ERR_MAINTENANCE_OUT_OF_ORDER]
        distinguishing_aspect: "Paying W2 while W1 is still PENDING is rejected with ERR_MAINTENANCE_OUT_OF_ORDER."
        test_recipe:
          setup:
            - "LARGE UTILITY application issued 2020-01-01; W1, W2, W3 generated."
            - "Clock at 2028-01-01 (within W2 window: 2027-07 to 2028-07 due, grace through 2028-07+6mo)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2020-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "OOO Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { ooo_owner_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${ooo_owner_id}", application_type: "UTILITY", title: "OOO widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${ooo_owner_id}"
              captures: { ooo_app_id: "$.data.id" }
            - call: "POST /fee-payments"
              payload: { application_id: "${ooo_app_id}", payment_category: "FILING", amount_cents: 32000 }
              as: Applicant
              as_user_id: "${ooo_owner_id}"
            - call: "POST /applications/${ooo_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${ooo_app_id}", action_type: "NOTICE_OF_ALLOWANCE" }
              as: USPTOExaminer
            - call: "GET /applications/${ooo_app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${ooo_owner_id}"
              captures: { ooo_v_pre_issue: "$.data.version" }
            - call: "POST /applications/${ooo_app_id}/pay-issue-fee"
              payload: { amount_cents: 120000, expected_application_version: "${ooo_v_pre_issue}" }
              as: Applicant
              as_user_id: "${ooo_owner_id}"
            - call: "GET /maintenance-fees"
              payload: { application_id: "${ooo_app_id}" }
              as: Applicant
              as_user_id: "${ooo_owner_id}"
              captures: { ooo_w2_id: "$.data[1].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-01T00:00:00.000Z" }
              as: USPTOAdmin
          trigger:
            - call: "POST /fee-payments"
              payload: { application_id: "${ooo_app_id}", payment_category: "MAINTENANCE_W2", amount_cents: 376000, maintenance_fee_id: "${ooo_w2_id}" }
              as: Applicant
              as_user_id: "${ooo_owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == 'ERR_MAINTENANCE_OUT_OF_ORDER'"

      - name: error_provisional_already_converted_double_convert
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_PROVISIONAL_ALREADY_CONVERTED]
        distinguishing_aspect: "Converting an already-CONVERTED PROVISIONAL a second time returns ERR_PROVISIONAL_ALREADY_CONVERTED."
        test_recipe:
          setup:
            - "LARGE PROVISIONAL filed 2026-01-01; converted to UTILITY once; clock unchanged."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "DConv Co", entity_size: "LARGE", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { dc_owner_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${dc_owner_id}", application_type: "PROVISIONAL", title: "Prov widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${dc_owner_id}"
              captures: { dc_app_id: "$.data.id", dc_v0: "$.data.version" }
            - call: "POST /applications/${dc_app_id}/convert-provisional-to-utility"
              payload: { title: "First conv", claim_count: 15, independent_claim_count: 3, expected_application_version: "${dc_v0}" }
              as: Applicant
              as_user_id: "${dc_owner_id}"
              captures: { dc_v1: "$.data.version" }
          trigger:
            - call: "POST /applications/${dc_app_id}/convert-provisional-to-utility"
              payload: { title: "Second conv", claim_count: 15, independent_claim_count: 3, expected_application_version: "${dc_v1}" }
              as: Applicant
              as_user_id: "${dc_owner_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id IN {'ERR_INVALID_STATE', 'ERR_PROVISIONAL_ALREADY_CONVERTED'} (terminal state check)"

  # ============================================================
  # Section: calculations — already covered fee amounts; cover remaining
  # ============================================================
  - section: calculations
    instances:

      - name: filing_fee_micro_design_amount_exact
        claim_type: correct_result
        grounds:
          - calculations.FILING_FEE
        distinguishing_aspect: "MICRO DESIGN filing fee = round_half_up(22000 * 0.20) = 4400 cents; payment of exactly 4400 is POSTED; payment of 4401 is rejected."
        test_recipe:
          setup:
            - "MICRO applicant created; DESIGN application created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Micro Designer", entity_size: "MICRO", micro_qualifying_year: 2025, gross_income_prior_year_cents: 5000000, prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { mid_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${mid_id}", application_type: "DESIGN", title: "Stylish widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${mid_id}"
              captures: { mid_app_id: "$.data.id" }
          trigger:
            - call: "POST /fee-payments"
              payload: { application_id: "${mid_app_id}", payment_category: "FILING", amount_cents: 4400 }
              as: Applicant
              as_user_id: "${mid_id}"
              captures: { pay_status: "$.data.payment_status" }
          assert:
            - "FeePayment.payment_status == 'POSTED'"
            - "Application.${mid_app_id}.total_fees_paid_cents == 4400"

      - name: extension_fee_two_months_small_amount_exact
        claim_type: correct_result
        grounds:
          - calculations.EXTENSION_FEE
        distinguishing_aspect: "SMALL applicant 2-month extension fee = round_half_up(64000 * 0.5) = 32000 cents."
        test_recipe:
          setup:
            - "SMALL UTILITY app with OUTSTANDING NON_FINAL OA; clock advanced 4 months past OA (within shortened+2mo extension)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: USPTOAdmin
            - call: "POST /applicants"
              payload: { legal_name: "Ext Co", entity_size: "SMALL", prior_applications_filed: 0 }
              as: USPTOAdmin
              captures: { ext_owner_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${ext_owner_id}", application_type: "UTILITY", title: "Ext widget", claim_count: 10, independent_claim_count: 2 }
              as: Applicant
              as_user_id: "${ext_owner_id}"
              captures: { ext_app_id: "$.data.id" }
            - call: "POST /fee-payments"
              payload: { application_id: "${ext_app_id}", payment_category: "FILING", amount_cents: 16000 }
              as: Applicant
              as_user_id: "${ext_owner_id}"
            - call: "POST /applications/${ext_app_id}/docket"
              payload: {}
              as: USPTOExaminer
            - call: "POST /office-actions"
              payload: { application_id: "${ext_app_id}", action_type: "NON_FINAL" }
              as: USPTOExaminer
              captures: { ext_oa_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-30T00:00:00.000Z" }
              as: USPTOAdmin
