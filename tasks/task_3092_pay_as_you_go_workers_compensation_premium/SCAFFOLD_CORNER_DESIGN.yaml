              as: EmployerAdmin
              as_user_id: "${cd_emp_id}"
              captures: { cd_fut_err: $.data.error_id }
          assert:
            - "response status 422 with error_id ERR_RETRO_WINDOW_INVALID"

      - name: payment_amount_mismatch_rejected
        claim_type: Violation → Error
        grounds: ['validations.priority-15', 'errors.ERR_PAYMENT_AMOUNT_MISMATCH']
        distinguishing_aspect: "Payments must equal total_cents exactly: a payment one cent short fails ERR_PAYMENT_AMOUNT_MISMATCH and the invoice remains ISSUED — no partial payment semantics."
        test_recipe:
          setup: ["Bound policy with one ISSUED invoice of total 155250."]
          setup_api_calls:
            - *cd_ca
            - *cd_emp
            - call: "POST /wc/policies"
              payload: { employer_id: "${cd_emp_id}", policy_number: "WC-PAY-001", effective_date: "2026-09-01T00:00:00Z", expiry_date: "2027-09-01T00:00:00Z", experience_mod: 1.0, class_codes: [{state_code: "CA", class_code: "8810", estimated_annual_payroll_cents: 1000000}] }
              as: Underwriter
              captures: { cd_pay_pol: $.data.id }
            - call: "POST /wc/policies/${cd_pay_pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${cd_pay_pol}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", idempotency_key: "pay-run-1", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
              as: PayrollProvider
            - call: "GET /wc/policies/${cd_pay_pol}/invoices"
              as: Underwriter
              captures: { cd_pay_inv: "$.data[0].id", cd_pay_total: "$.data[0].total_cents" }
          trigger:
            - call: "POST /wc/invoices/${cd_pay_inv}/payments"
              payload: { amount_cents: "${cd_pay_total} - 1" }
              as: EmployerAdmin
              as_user_id: "${cd_emp_id}"
              captures: { cd_pay_err: $.data.error_id }
          assert:
            - "response status 422 with error_id ERR_PAYMENT_AMOUNT_MISMATCH"
            - "invoice ${cd_pay_inv} remains ISSUED"

      - name: audit_file_without_quarter_coverage_rejected
        claim_type: Violation → Error
        grounds: ['validations.priority-16', 'errors.ERR_TAX_FILING_MISSING']
        distinguishing_aspect: "Filing an audit whose window intersects a quarter lacking any TaxFilingRecord fails ERR_TAX_FILING_MISSING (422) — aggregate referential validation over the quarter set."
        test_recipe:
          setup: ["Bound policy; audit window [09-01, 12-01) intersecting Q3 and Q4; only a Q3 filing exists."]
          setup_api_calls:
