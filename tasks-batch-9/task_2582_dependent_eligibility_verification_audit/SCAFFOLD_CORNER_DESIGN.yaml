  - section: endpoints
    instances:
      - name: corner_paid_claim_lines_are_append_only_and_maintain_the_dependent_running_total
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /dependents/{id}/paid-claims]
          - endpoints[GET /dependents/{id}/paid-claims]
          - entities.PaidClaimLine
          - entities.Dependent.fields.paid_claims_total_cents
        distinguishing_aspect: "Each POST appends one immutable line and raises Dependent.paid_claims_total_cents by paid_cents only (never by the premium offset), so three lines of 60000, 40000 and 30000 give 130000; the list endpoint paginates them with total_count 3 and has_more true at limit 2."
        test_recipe:
          setup:
            - "Employee E1 holds SPOUSE dependent D1; no audit program exists, so no state rule gates claim-line capture."
