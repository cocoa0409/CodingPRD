            - "ticket C (8000 + 1 > 8000) -> ERR_CAPACITY_EXCEEDED"
            - "QueueTicket.${tickC}.status remains PENDING"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_confirm_requires_lot_tested
        grounds:
          - state_machines.QueueTicket.PENDING_to_CONFIRMED
          - state_machines.GrainLot.RECEIVED_to_TESTED
        distinguishing_aspect: |
          Entity pair QueueTicket -> GrainLot: confirm is gated on the LOT's
          state (must be TESTED). Fails while RECEIVED; succeeds after the
          lot's certification transition — the ticket's own state never
          changed.
        test_recipe:
          setup:
            - "Customer, unit, clock; lot RECEIVED with a PENDING ticket created before any moisture test"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
            - { call: "POST /grain-drying/grain-lots", payload: { customer_id: "${cust}", commodity: "CORN", gross_weight_lbs: 44000, tare_weight_lbs: 34000, target_moisture_pct: 15.0, foreign_material_pct: 2.0 }, as: IntakeTechnician, captures: { lot: $.data.id, lot_v: $.data.version } }
            - { call: "POST /grain-drying/queue-tickets", payload: { lot_id: "${lot}", unit_id: "${unit}", window_date: "2026-09-12", requested_bushels: 200 }, as: Grower, as_user_id: "${cust}", captures: { tick: $.data.id } }
          trigger:
            - { call: "POST /grain-drying/queue-tickets/${tick}/confirm", payload: {}, as: ElevatorManager, captures: { err: $.data.error_id } }
            - { call: "POST /grain-drying/moisture-tests", payload: { lot_id: "${lot}", sample_moisture_pct: 20.0, expected_grain_lot_version: "${lot_v}" }, as: IntakeTechnician, as_user_id: "tech-1", captures: { test: $.data.id } }
            - { call: "POST /grain-drying/moisture-tests/${test}/certify", payload: {}, as: IntakeTechnician, as_user_id: "tech-1" }
            - { call: "POST /grain-drying/queue-tickets/${tick}/confirm", payload: {}, as: ElevatorManager, captures: { st: $.data.status } }
          assert:
            - "first confirm -> ERR_INVALID_STATE (lot RECEIVED, not TESTED)"
            - "after certification, second confirm succeeds: QueueTicket.${tick}.status == CONFIRMED"
            - "GrainLot.${lot}.status == QUEUED after confirm"

      - name: blend_execute_requires_sources_dried
        grounds:
          - state_machines.BlendOrder.APPROVED_to_EXECUTED
          - state_machines.GrainLot.DRIED_to_DAMAGE_HOLD
        distinguishing_aspect: |
          Different entity pair, BlendOrder -> GrainLot (vs QueueTicket ->
          GrainLot): an APPROVED blend order cannot execute once a source lot
          has moved to DAMAGE_HOLD between approval and execution — the
          execute-time revalidation of sibling state is what fails.
        test_recipe:
          setup:
            - "Two DRIED lots: high 7000 lbs @17.0, low 5000 lbs @13.0; blend order (target 15.5) created and APPROVED; then a damage claim moves the high lot to DAMAGE_HOLD"
          setup_api_calls:
            - { call: "POST /grain-drying/customers", payload: { name: "C1", credit_limit_cents: 500000, prepaid_balance_cents: 0 }, as: ElevatorManager, captures: { cust: $.data.id } }
            - { call: "POST /grain-drying/charge-schedules", payload: { commodity: "CORN", effective_from: "2026-08-01", effective_to: "2026-12-31", t1_max_moisture_pct: 20.0, t2_max_moisture_pct: 25.0, rate_t1_cents_per_pt_bu: 4, rate_t2_cents_per_pt_bu: 5, rate_t3_cents_per_pt_bu: 7, fm_threshold_pct: 3.0, fm_surcharge_pct: 0.10, min_charge_cents: 1500, energy_t1_limit_therms: 60, energy_t1_rate_cents_per_therm: 85, energy_t2_rate_cents_per_therm: 95, est_therms_per_hour: 12.5, est_point_factor: 0.05 }, as: ElevatorManager }
            - { call: "POST /grain-drying/dryer-units", payload: { unit_code: "DRYER-1", daily_capacity_bushels: 10000, standard_class_cap_bushels: 8000, throughput_bu_per_hour: 600, cooldown_minutes: 30 }, as: ElevatorManager, captures: { unit: $.data.id } }
            - { call: "POST /grain-drying/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T08:00:00Z" }, as: ElevatorManager }
