# =============================================================================
# Task 1155 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 19 instances across the nine Difficulty Rules of SKILL.md §0.5.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: eac_provisional_diverges_from_committed_on_turnaround_cost
        grounds:
          - calculations.eac_cost_forecast
          - entities.Turnaround.fields.cost_posture
          - endpoints: "GET /turnarounds/{id}/cost-summary"
        distinguishing_aspect: |
          Turnaround cost domain: for identical ledger data, forecast_committed_cents
          (200000) excludes the pending REPORTED discovery quote while
          forecast_provisional_cents (500000) includes it, and cost_posture keys on
          the PROVISIONAL variant -> AT_RISK where COMMITTED alone would say
          WITHIN_BUDGET.
        test_recipe:
          setup:
            - "Turnaround (authorized_budget_cents=400000, contingency_budget_cents=1000000) in EXECUTION with one FROZEN work item estimated at 200000 and one contractor MOBILIZED"
            - "One discovery REPORTED with quoted_cost_cents=300000 (pending, undecided)"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-2026-CRU2", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 400000, contingency_budget_cents: 1000000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Reboiler bundle pull", system_area: "CRU-2-E1", work_type: "CORRECTIVE", risk_class: "B", estimated_hours: 100, estimated_cost_cents: 200000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/discoveries", payload: { origin_work_item_id: "${w1_id}", description: "Corroded tray rings found on open", quoted_cost_cents: 300000, quoted_hours: 40 }, as: TurnaroundManager, as_user_id: "tm-100", captures: { d1_id: "$.data.id" } }
          trigger:
            - { call: "GET /turnarounds/${t_id}/cost-summary", payload: {}, as: TurnaroundManager, captures: { committed: "$.data.committed_cost_cents", fc_committed: "$.data.forecast_committed_cents", fc_provisional: "$.data.forecast_provisional_cents", posture: "$.data.cost_posture" } }
          assert:
            - "cost-summary.committed_cost_cents == 200000"
            - "cost-summary.forecast_committed_cents == 200000"
            - "cost-summary.forecast_provisional_cents == 500000  (200000 committed + 300000 pending quote + 0 overrun)"
            - "cost-summary.cost_posture == AT_RISK  (provisional 500000 > budget 400000 while committed 200000 <= 400000)"

      - name: fatigue_penalty_rejects_worker_hours_ledger_admits
        grounds:
          - calculations.fatigue_eligibility
          - entities.Worker.fields.fatigue_penalty_score
          - entities.Worker.fields.ledger_hours
          - errors[ERR_FATIGUE_LIMIT]
        distinguishing_aspect: |
          Worker safety domain (vs Turnaround cost in the sibling instance): the
          enforced PENALTY_WEIGHTED variant projects score 20 (>= limit 20) and
          rejects, while the HOURS_LEDGER variant projects 22 hours (<= 60) and
          would admit the same assignment for the same worker data.
        test_recipe:
          setup:
            - "Turnaround in EXECUTION; contractor MOBILIZED; worker BADGED"
            - "Worker already ASSIGNED to NIGHT shift S1 (2026-06-13T22:00Z to 2026-06-14T06:00Z, 8h) and DAY shift S2 (2026-06-14T18:00Z to 2026-06-15T00:00Z, 6h; 12h gap from S1 -> REST_PENALTY 10): stored penalty score 15, ledger 14"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-FAT", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 400000, contingency_budget_cents: 1000000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Valve overhaul", system_area: "CRU-2-V", work_type: "PREVENTIVE", risk_class: "C", estimated_hours: 40, estimated_cost_cents: 80000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-13", shift_type: "NIGHT", starts_at: "2026-06-13T22:00:00Z", ends_at: "2026-06-14T06:00:00Z", planned_headcount: 3 }, as: Planner, captures: { s1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-14", shift_type: "DAY", starts_at: "2026-06-14T18:00:00Z", ends_at: "2026-06-15T00:00:00Z", planned_headcount: 3 }, as: Planner, captures: { s2_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-15", shift_type: "NIGHT", starts_at: "2026-06-15T22:00:00Z", ends_at: "2026-06-16T06:00:00Z", planned_headcount: 3 }, as: Planner, captures: { s3_id: "$.data.id" } }
            - { call: "POST /shifts/${s1_id}/assignments", payload: { worker_id: "${wk_id}", planned_hours: 8 }, as: Planner }
            - { call: "POST /shifts/${s2_id}/assignments", payload: { worker_id: "${wk_id}", planned_hours: 6 }, as: Planner }
          trigger:
            - { call: "POST /shifts/${s3_id}/assignments", payload: { worker_id: "${wk_id}", planned_hours: 8 }, as: Planner, captures: { err: "$.data.error_id" } }
            - { call: "GET /workers/${wk_id}", payload: {}, as: Planner, captures: { score: "$.data.fatigue_penalty_score", ledger: "$.data.ledger_hours" } }
          assert:
            - "trigger assignment rejected with ERR_FATIGUE_LIMIT (409): projected penalty score 15 + NIGHT_PENALTY 5 = 20 >= FATIGUE_SCORE_LIMIT 20 (no rest penalty: 22h gap >= RECOVERY_REST_HOURS 14)"
            - "Worker.fatigue_penalty_score == 15 (rejection leaves stored fields unchanged)"
            - "Worker.ledger_hours == 14 (8 + 6); the HOURS_LEDGER variant would project 14 + 8 = 22 <= 60 and admit this exact candidate"

  - rule_id: combinatorial_formula
    instances:
      - name: shift_labor_cost_tiered_night_hazard_premium
        grounds:
          - calculations.shift_labor_cost
          - entities.DailyReport.fields.line_costs_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — nested min/max tier
          selection over hours (8h regular / next 4h at 1.5x / beyond 12h at 2x)
          combined with multiplicative NIGHT (x1.20) and hazard (x1.15) uplifts:
          10h NIGHT hazard = (68000 + 25500) * 1.2 * 1.15 = 129030 cents.
        test_recipe:
          setup:
            - "Turnaround in EXECUTION; contractor MOBILIZED with one BADGED worker; one NIGHT shift 2026-06-15T22:00Z to 2026-06-16T08:00Z"
            - "Logical clock at 2026-06-16T12:00:00Z"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-LAB", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 900000000, contingency_budget_cents: 1000000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Exchanger clean", system_area: "CRU-2-E2", work_type: "CORRECTIVE", risk_class: "B", estimated_hours: 60, estimated_cost_cents: 120000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-15", shift_type: "NIGHT", starts_at: "2026-06-15T22:00:00Z", ends_at: "2026-06-16T08:00:00Z", planned_headcount: 5 }, as: Planner, captures: { sn_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-16T12:00:00Z" }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/daily-reports", payload: { report_date: "2026-06-16", lines: [ { worker_id: "${wk_id}", shift_id: "${sn_id}", hours: 10, hazard_flag: true } ] }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { r_id: "$.data.id" } }
          trigger:
            - { call: "POST /daily-reports/${r_id}/submit", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { line_costs: "$.data.line_costs_cents", labor: "$.data.labor_cost_cents", ovh: "$.data.overhead_cents", tot: "$.data.total_cost_cents" } }
          assert:
            - "DailyReport.line_costs_cents == [129030]  ((8*8500 + 2*8500*1.5) * 1.20 * 1.15 = 93500 * 1.38)"
            - "DailyReport.labor_cost_cents == 129030"
            - "DailyReport.overhead_cents == 12903  (tier base 0 < 200000 -> LOW 10%)"
            - "DailyReport.total_cost_cents == 141933"

      - name: daily_report_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.daily_report_total
          - calculations.shift_labor_cost
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins round-per-line-then-sum.
          Two 0.1h hazard DAY lines yield raw 977.5 cents each: per-line rounding
          gives 978 + 978 = 1956; the forbidden sum-then-round order gives 1955.
          Asserted labor_cost_cents is exactly 1956.
        test_recipe:
          setup:
            - "Turnaround in EXECUTION; contractor MOBILIZED with one BADGED worker; one DAY shift 2026-06-15T08:00Z to 2026-06-15T20:00Z; clock at 2026-06-15T21:00:00Z"
            - "One DRAFT daily report (report_date 2026-06-15) with two identical lines: hours=0.1, hazard_flag=true"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-RND", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 900000000, contingency_budget_cents: 1000000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Gauge calibration", system_area: "CRU-2-G", work_type: "INSPECTION", risk_class: "C", estimated_hours: 20, estimated_cost_cents: 40000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-15", shift_type: "DAY", starts_at: "2026-06-15T08:00:00Z", ends_at: "2026-06-15T20:00:00Z", planned_headcount: 5 }, as: Planner, captures: { sd_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T21:00:00Z" }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/daily-reports", payload: { report_date: "2026-06-15", lines: [ { worker_id: "${wk_id}", shift_id: "${sd_id}", hours: 0.1, hazard_flag: true }, { worker_id: "${wk_id}", shift_id: "${sd_id}", hours: 0.1, hazard_flag: true } ] }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { r_id: "$.data.id" } }
          trigger:
            - { call: "POST /daily-reports/${r_id}/submit", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { line_costs: "$.data.line_costs_cents", labor: "$.data.labor_cost_cents", ovh: "$.data.overhead_cents", tot: "$.data.total_cost_cents" } }
          assert:
            - "DailyReport.line_costs_cents == [978, 978]  (round_half_up(977.5) per line)"
            - "DailyReport.labor_cost_cents == 1956  (per-line-then-sum; sum-then-round would be 1955)"
            - "DailyReport.overhead_cents == 196  (round_half_up(1956 * 0.10))"
            - "DailyReport.total_cost_cents == 2152"

      - name: overhead_tier_keyed_on_reported_excluding_candidate
        grounds:
          - calculations.overhead_allocation
          - entities.DailyReport.fields.overhead_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the overhead tier depends on
          reported cost which would include this very report. The scaffold pins the
          tier lookup to reported cost EXCLUDING the candidate (130900 < 200000 ->
          LOW 10% -> overhead 11900); the wrong order (261800 >= 200000 -> HIGH
          15%) would produce overhead 17850 and total 136850.
        test_recipe:
          setup:
            - "Turnaround in EXECUTION; contractor MOBILIZED with one BADGED worker; one DAY shift 2026-06-15T08:00Z to 2026-06-15T20:00Z; clock 2026-06-16T12:00:00Z"
            - "Report R1 (date 2026-06-15) submitted and APPROVED: one 12h DAY line -> labor 119000, overhead 11900, total 130900; turnaround.reported_cost_cents == 130900"
            - "Report R2 (date 2026-06-16) DRAFT with one 12h DAY line (labor will be 119000)"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-OVH", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 900000000, contingency_budget_cents: 1000000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Tower tray swap", system_area: "CRU-2-T", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 200, estimated_cost_cents: 300000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/shifts", payload: { shift_date: "2026-06-15", shift_type: "DAY", starts_at: "2026-06-15T08:00:00Z", ends_at: "2026-06-15T20:00:00Z", planned_headcount: 5 }, as: Planner, captures: { sd_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-16T12:00:00Z" }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/daily-reports", payload: { report_date: "2026-06-15", lines: [ { worker_id: "${wk_id}", shift_id: "${sd_id}", hours: 12, hazard_flag: false } ] }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /daily-reports/${r1_id}/submit", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /daily-reports/${r1_id}/approve", payload: {}, as: CostController, as_user_id: "cc-1" }
            - { call: "POST /turnarounds/${t_id}/daily-reports", payload: { report_date: "2026-06-16", lines: [ { worker_id: "${wk_id}", shift_id: "${sd_id}", hours: 12, hazard_flag: false } ] }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { r2_id: "$.data.id" } }
          trigger:
            - { call: "POST /daily-reports/${r2_id}/submit", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { ovh: "$.data.overhead_cents", tot: "$.data.total_cost_cents" } }
          assert:
            - "DailyReport.${r2_id}.labor_cost_cents == 119000  (68000 + 4*8500*1.5; ot2 = max(12-12,0) = 0)"
            - "DailyReport.${r2_id}.overhead_cents == 11900  (tier base = 130900 excluding candidate < 200000 -> LOW 10%)"
            - "DailyReport.${r2_id}.total_cost_cents == 130900  (not 136850, which the include-candidate order would yield)"

  - rule_id: non_linear_state_machine
    instances:
      - name: work_item_rework_loop_cycle
        grounds:
          - state_machines.WorkItem.COMPLETE_to_REOPENED
          - state_machines.WorkItem.REOPENED_to_IN_PROGRESS
          - state_machines.WorkItem.IN_PROGRESS_to_COMPLETE
        distinguishing_aspect: |
          Cyclic machine on WorkItem: COMPLETE -> REOPENED -> IN_PROGRESS ->
          COMPLETE -> VERIFIED traverses the rework loop; remaining_hours tracks
          the second actual_hours recording (100 estimated - 60 actual = 40).
        test_recipe:
          setup:
            - "Turnaround in EXECUTION; contractor MOBILIZED; work item W1 (estimated_hours 100, requires_permit false) FROZEN, then SCHEDULED, IN_PROGRESS, and COMPLETE with actual_hours 40"
          setup_api_calls:
            - { call: "POST /turnarounds", payload: { name: "TA-CYC", plant_unit: "CRU-2", planned_start: "2026-06-10T00:00:00Z", planned_end: "2026-07-10T00:00:00Z", authorized_budget_cents: 900000000, contingency_budget_cents: 1000000 }, as: TurnaroundManager, captures: { t_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/work-items", payload: { title: "Pump rebuild", system_area: "CRU-2-P", work_type: "CORRECTIVE", risk_class: "A", estimated_hours: 100, estimated_cost_cents: 150000, requires_permit: false }, as: Planner, captures: { w1_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/freeze-scope", payload: { scope_cutoff_count: 1 }, as: TurnaroundManager }
            - { call: "POST /turnarounds/${t_id}/contractors", payload: { name: "Delta Mechanical", craft: "PIPEFITTING", headcount_cap: 5 }, as: TurnaroundManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /contractors/${c_id}/workers", payload: { full_name: "Rae Wolder", trade: "WELDER" }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { wk_id: "$.data.id" } }
            - { call: "POST /workers/${wk_id}/vet", payload: {}, as: PermitCoordinator }
            - { call: "POST /workers/${wk_id}/badge", payload: {}, as: PermitCoordinator }
            - { call: "POST /contractors/${c_id}/mobilize", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /turnarounds/${t_id}/advance", payload: {}, as: TurnaroundManager }
            - { call: "POST /work-items/${w1_id}/schedule", payload: {}, as: Planner }
            - { call: "POST /work-items/${w1_id}/start", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}" }
            - { call: "POST /work-items/${w1_id}/complete", payload: { actual_hours: 40 }, as: ContractorSupervisor, as_user_id: "${c_id}" }
          trigger:
            - { call: "POST /work-items/${w1_id}/verify", payload: { outcome: "REOPENED" }, as: OperationsRep, captures: { st1: "$.data.status" } }
            - { call: "POST /work-items/${w1_id}/start", payload: {}, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { st2: "$.data.status" } }
            - { call: "POST /work-items/${w1_id}/complete", payload: { actual_hours: 60 }, as: ContractorSupervisor, as_user_id: "${c_id}", captures: { st3: "$.data.status" } }
            - { call: "POST /work-items/${w1_id}/verify", payload: { outcome: "VERIFIED" }, as: OperationsRep, captures: { st4: "$.data.status", rem: "$.data.remaining_hours" } }
          assert:
            - "first verify -> status REOPENED (rework loop, not an error)"
            - "start from REOPENED -> status IN_PROGRESS"
            - "second complete -> status COMPLETE with actual_hours 60"
            - "second verify -> status VERIFIED and remaining_hours == 40 (100 - 60; the second actual_hours REPLACES the first)"

      - name: discovery_reject_appeal_cycle
        grounds:
          - state_machines.DiscoveryWork.REJECTED_to_TRIAGED
          - state_machines.DiscoveryWork.TRIAGED_to_REJECTED
          - state_machines.DiscoveryWork.TRIAGED_to_AUTHORIZED
        distinguishing_aspect: |
          Cyclic negotiation machine on DiscoveryWork (different entity than the
          WorkItem loop): REPORTED -> TRIAGED -> REJECTED -> appeal -> TRIAGED ->
          AUTHORIZED, with appeal_count == 1 and the authorization cascade
          materializing an addendum WorkItem only on the final pass.
        test_recipe:
          setup:
            - "Turnaround in EXECUTION (contingency 1000000); discovery D1 REPORTED by tm-100 (quoted_cost_cents 90000, quoted_hours 20) and TRIAGED"
          setup_api_calls:
