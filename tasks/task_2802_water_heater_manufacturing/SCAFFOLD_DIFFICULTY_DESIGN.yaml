  - rule_id: resource_temporal_overlap
    instances:
      - name: furnace_window_exclusive_half_open_adjacency_allowed
        grounds:
          - validations[priority 24].ERR_FURNACE_WINDOW_CONFLICT
          - entities.Furnace.fields.occupied_window_count
          - entities.GlassLiningBatch.fields.firing_start
          - entities.GlassLiningBatch.fields.firing_end
          - endpoints[POST /mfg/glass-lining-batches]
        distinguishing_aspect: >
          Resource Furnace with EXCLUSIVE (capacity-1) half-open [start, end) semantics: a window that merely
          touches an existing firing_end is accepted, while a window overlapping by one hour is refused. The
          four calls separate the three failure modes an implementation can have - closed-interval comparison
          (would wrongly reject the 10:00 adjacency), containment-only comparison (would wrongly accept the
          09:00-12:00 straddle) and resource-blind comparison (would wrongly reject the identical window on
          FURN-B).
        test_recipe:
          setup:
            - "Furnaces FURN-A and FURN-B both exist with max_firing_temp_c 900."
            - "Batch GLB-A1 occupies FURN-A from 2026-08-02T06:00:00Z to 2026-08-02T10:00:00Z and is MIXED (non-terminal)."
            - "FURN-B has no batches at all."
            - "The logical clock is at its default 2026-08-01T00:00:00Z, so no batch has been fired yet."
          setup_api_calls:
            - call: "POST /mfg/furnaces"
              payload: { furnace_code: "FURN-A", max_firing_temp_c: 900 }
              as: PlantAdmin
              captures: { furn_a_id: $.data.id }
            - call: "POST /mfg/furnaces"
              payload: { furnace_code: "FURN-B", max_firing_temp_c: 900 }
              as: PlantAdmin
              captures: { furn_b_id: $.data.id }
            - call: "POST /mfg/glass-lining-batches"
              payload: { furnace_id: "${furn_a_id}", batch_code: "GLB-A1", slurry_mix_code: "SLR-7", firing_temp_c: 840, firing_start: "2026-08-02T06:00:00Z", firing_end: "2026-08-02T10:00:00Z" }
              as: PlantOperator
              captures: { glb_a1_id: $.data.id }
          trigger:
            - call: "POST /mfg/glass-lining-batches"
              payload: { furnace_id: "${furn_a_id}", batch_code: "GLB-A2", slurry_mix_code: "SLR-7", firing_temp_c: 840, firing_start: "2026-08-02T09:00:00Z", firing_end: "2026-08-02T12:00:00Z" }
              as: PlantOperator
            - call: "POST /mfg/glass-lining-batches"
              payload: { furnace_id: "${furn_a_id}", batch_code: "GLB-A3", slurry_mix_code: "SLR-7", firing_temp_c: 840, firing_start: "2026-08-02T10:00:00Z", firing_end: "2026-08-02T14:00:00Z" }
              as: PlantOperator
            - call: "POST /mfg/glass-lining-batches"
              payload: { furnace_id: "${furn_a_id}", batch_code: "GLB-A4", slurry_mix_code: "SLR-7", firing_temp_c: 840, firing_start: "2026-08-02T05:00:00Z", firing_end: "2026-08-02T06:00:00Z" }
              as: PlantOperator
            - call: "POST /mfg/glass-lining-batches"
              payload: { furnace_id: "${furn_b_id}", batch_code: "GLB-B1", slurry_mix_code: "SLR-7", firing_temp_c: 840, firing_start: "2026-08-02T06:00:00Z", firing_end: "2026-08-02T10:00:00Z" }
              as: PlantOperator
          assert:
            - "the GLB-A2 call returns 409 with error_id == 'ERR_FURNACE_WINDOW_CONFLICT' (09:00-12:00 straddles the existing end)"
            - "the GLB-A3 call returns 201 (a window starting exactly at another's firing_end is not an overlap)"
            - "the GLB-A4 call returns 201 (a window ending exactly at another's firing_start is not an overlap)"
            - "the GLB-B1 call returns 201 with an identical window, proving the constraint is scoped to one furnace"
            - "Furnace.${furn_a_id}.occupied_window_count == 3 and Furnace.${furn_b_id}.occupied_window_count == 1"
            - "GlassLiningBatch.${glb_a1_id}.status is still MIXED and its window is unchanged"
      - name: test_cell_parallel_slots_plus_cooldown_buffer
        grounds:
          - validations[priority 25].ERR_TEST_CELL_CAPACITY_CONFLICT
          - validations[priority 25].ERR_TEST_CELL_COOLDOWN_VIOLATION
          - entities.TestCell.fields.parallel_slots
          - entities.TestCell.fields.cooldown_hours
          - endpoints[POST /mfg/efficiency-tests]
        distinguishing_aspect: >
          Different resource and materially different interval semantics from the furnace instance: a TestCell
          admits parallel_slots concurrent windows (capacity 2, not 1) AND extends every window by a per-MODEL
          cooldown tail, so overlap alone neither implies nor is required for a conflict. The 08:00-09:00 window
          is fully CONTAINED in both existing windows yet only fails on capacity, while the 12:00-16:00 window
          overlaps NOTHING and still fails on cooldown - and the same 12:00 window is accepted for a different
          model on the same cell, which no purely interval-based implementation can reproduce.
        test_recipe:
          setup:
            - "Cell CELL-1 has parallel_slots 2 and cooldown_hours 12; CELL-2 has parallel_slots 1 and cooldown_hours 6."
            - "CELL-1 already holds a UEF test for GX50-T from 06:00 to 10:00 and one for HP65-B from 07:00 to 11:00 on 2026-08-02."
            - "Both existing tests are SCHEDULED, hence non-terminal, and the clock is still 2026-08-01T00:00:00Z."
