          assert:
            - "all thirteen calls return HTTP 404"
            - "response.data.error_id is 'ERR_SUPPLIER_NOT_FOUND', 'ERR_CUSTOMER_NOT_FOUND', 'ERR_PURCHASE_ORDER_NOT_FOUND', 'ERR_RECEIPT_NOT_FOUND', 'ERR_INVENTORY_LOT_NOT_FOUND', 'ERR_GRADE_CHANGE_NOT_FOUND', 'ERR_ROLL_SET_NOT_FOUND', 'ERR_ORDER_NOT_FOUND', 'ERR_PERMIT_NOT_FOUND', 'ERR_ENV_RECORD_NOT_FOUND', 'ERR_ENV_RECORD_NOT_FOUND', 'ERR_ENV_RECORD_NOT_FOUND' and 'ERR_STEAM_ALLOCATION_NOT_FOUND' respectively"
            - "every response carries meta.api_request_id and response_type == 'error' with no data payload beyond error_id and message"

      - name: a_purchase_order_naming_an_unknown_supplier_is_a_party_not_found
        claim_type: violation_to_error
        grounds:
          - validations.priority_21
          - validations.priority_20
          - errors[ERR_PARTY_NOT_FOUND]
        distinguishing_aspect: "The body's supplier_id is a well-formed UUID no Supplier row carries while fiber_grade_code OCC_11 does resolve, so the body-referential check at priority 21 must answer 404 ERR_PARTY_NOT_FOUND — distinct from the path-existence codes and from priority 20's ERR_GRADE_CODE_NOT_FOUND, which the mirror-image call (real supplier, unknown grade code) must return instead."
        test_recipe:
          setup: ["OCC_11 with an August quote of 180.00 and one real supplier; no other party rows."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, rank_order: 1 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /market-index-quotes"
              payload: { index_symbol: "PPI_OCC", effective_month: "2026-08", published_price_per_ton: 180.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /suppliers"
              payload: { name: "Delta Fiber Recovery", freight_per_ton: 12.50 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { supplier_id: "$.data.id" }
          trigger:
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "00000000-0000-0000-0000-0000000000ff", fiber_grade_code: "OCC_11", contracted_tons: 400.00, index_basis: "CURRENT_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 5.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "${supplier_id}", fiber_grade_code: "SOP_37", contracted_tons: 400.00, index_basis: "CURRENT_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 5.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
          assert:
            - "the first call returns HTTP 404 with response.data.error_id == 'ERR_PARTY_NOT_FOUND'"
            - "the second call returns HTTP 404 with response.data.error_id == 'ERR_GRADE_CODE_NOT_FOUND' — priority 20 runs before priority 21, and the grade is the failing reference here"
            - "GET /fiber-purchase-orders as FiberBuyer reports total_count == 0: neither refused call created a row"

      - name: pricing_an_already_priced_purchase_order_is_refused_on_state
        claim_type: violation_to_error
        grounds:
          - validations.priority_28
          - errors[ERR_PURCHASE_ORDER_INVALID_STATE]
          - state_machines.FiberPurchaseOrder.DRAFT_to_PRICED
        distinguishing_aspect: "The second /price call carries a freshly re-read expected_purchase_order_version, so the OCC gate at priority 39 cannot be the cause; the order is simply no longer DRAFT. The answer must be 409 ERR_PURCHASE_ORDER_INVALID_STATE and the stored price must remain the first computation (185.00) with pricing_revision_count still 0 — pricing is not idempotent, it is state-gated."
        test_recipe:
          setup: ["A PRICED 400.00-ton OCC_11 purchase order at 180.00 index + 5.00 delta."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
              payload: { grade_code: "OCC_11", index_symbol: "PPI_OCC", max_contamination_pct: 3.00, max_moisture_pct: 12.00, nominal_yield_pct: 88.00, deink_required: false, rank_order: 1 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /market-index-quotes"
              payload: { index_symbol: "PPI_OCC", effective_month: "2026-08", published_price_per_ton: 180.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "POST /suppliers"
              payload: { name: "Delta Fiber Recovery", freight_per_ton: 12.50 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { supplier_id: "$.data.id" }
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "${supplier_id}", fiber_grade_code: "OCC_11", contracted_tons: 400.00, index_basis: "CURRENT_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 5.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { po_id: "$.data.id", po_v0: "$.data.version" }
            - call: "POST /fiber-purchase-orders/${po_id}/price"
              payload: { expected_purchase_order_version: "${po_v0}" }
              as: FiberBuyer
              as_user_id: "buyer-1"
            - call: "GET /fiber-purchase-orders/${po_id}"
              payload: {}
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { po_v1: "$.data.version" }
          trigger:
            - call: "POST /fiber-purchase-orders/${po_id}/price"
              payload: { expected_purchase_order_version: "${po_v1}" }
              as: FiberBuyer
              as_user_id: "buyer-1"
          assert:
            - "HTTP status is 409"
            - "response.data.error_id == 'ERR_PURCHASE_ORDER_INVALID_STATE' — NOT 412 ERR_STALE_PURCHASE_ORDER_VERSION"
            - "GET /fiber-purchase-orders/${po_id} as FiberBuyer reports status == 'PRICED', quoted_unit_price_per_ton == 185.00, pricing_revision_count == 0 and version == ${po_v1}"

