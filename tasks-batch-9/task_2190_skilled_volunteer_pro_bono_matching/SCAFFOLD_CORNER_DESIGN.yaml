      - name: endpoint_get_program_cycle_unknown_id_returns_not_found
        claim_type: standard_crud
        grounds: ["endpoints[GET /program-cycles/{id}]", "errors[ERR_PROGRAM_CYCLE_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "The typed 404 is per-entity: probing a cycle id that happens to be a valid PartnerOrg id still returns ERR_PROGRAM_CYCLE_NOT_FOUND, never ERR_PARTNER_ORG_NOT_FOUND, because the path determines which lookup runs."
        test_recipe:
          setup: ["One partner org and one real cycle."]
          setup_api_calls:
