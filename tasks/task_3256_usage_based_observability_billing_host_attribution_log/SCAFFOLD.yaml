    output: LogEvent[]
    side_effects: []

  - method: POST
    path: "/api/billing-accounts/{id}/log-events/{id}/reindex"
    description: "Move an EXCLUDED event to INDEXED"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: LogEvent
    side_effects: ["LOG_INDEX MeterAccumulator += 1", "debits ACTIVE Commitment LOG_INDEX by 1"]

