              as_user_id: "tech-a"
              captures: { xm: $.data.id }
          assert:
            - "at now == expires_at (2026-08-13T08:00:00Z): 409 ERR_TS_NOT_ACTIVE — the validity window is half-open"
            - "at now == expires_at - 1s: create succeeds, Crossmatch.${xm}.status == PENDING"
      - name: wastage_rate_empty_denominator
        grounds:
          - calculations.rolling_wastage_rate
        distinguishing_aspect: |
          Metric = a ratio with an EMPTY denominator on GET /wastage-summary: a
          bucket with 1 wasted unit in the rolling window but 0 receipts in the
          window yields rate == 0.0000 (pinned divide-by-zero behavior) and
          excessive == false — not an error, not Infinity.
        test_recipe:
          setup:
            - "clock 2026-08-10T09:00:00Z; one PLT_POOL O NEG unit received (created_at inside that day) then left in QUARANTINED"
            - "clock advanced to 2026-09-15T00:00:00Z (> 30 days later); sweep expires the unit into the CURRENT window"
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
