      - name: passing_score_change_applies_only_to_future_submissions
        claim_type: variant_selection
        grounds:
          - "entities.Curriculum.fields.passing_score_pct"
          - "entities.CompletionRecord.fields.passed"
        distinguishing_aspect: "A PATCH raising passing_score_pct from 80 to 90 does not mutate an existing record's passed flag, and the new threshold governs the next submission (85 fails)."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; regulator REG-PSC; curriculum CUR-PSC ACTIVE (passing 80, NONE, max_attempts 3)"
            - "Role R-PSC with SOFT INITIAL_ONLY requirement; employee E-PSC holds assignment A"
            - "A has record C1 (score 80, passed=true) REJECTED by review (attempts_used 1, progress IN_PROGRESS)"
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-PSC", name: "PSC Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-PSC", title: "PSC Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE", max_attempts: 3 }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://psc-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-PSC", name: "PSC Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-PSC-1", full_name: "PSC Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 80, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { c1: "$.data.id", c1_passed: "$.data.passed" } }
            - { call: "POST /compliance/completions/${c1}/reject", payload: { review_note: "please redo" }, as: ComplianceAdmin }
            - { call: "GET /compliance/curricula/${cur_id}", as: ComplianceAdmin, captures: { cur_v2: "$.data.version" } }
          trigger:
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { passing_score_pct: 90, expected_curriculum_version: "${cur_v2}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 85, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { err: "$.data.error_id" } }
            - { call: "GET /compliance/assignments/${a}/completions", as: ComplianceAdmin, captures: { c1_passed_after: "$.data[0].passed" } }
          assert:
            - "c1_passed == true (80 >= 80 at submission time)"
            - "err == \"ERR_SCORE_BELOW_PASSING\" (85 < 90 under the NEW threshold — change is prospective only)"
            - "c1_passed_after == true (historical record's passed flag is immutable)"

