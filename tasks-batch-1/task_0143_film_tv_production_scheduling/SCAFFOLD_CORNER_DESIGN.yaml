# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Film/TV Production Scheduling — task_0143
# Breadth probe over §1.1–§1.7 per references/claim-extraction-guide.md.
# Every setup_api_calls/trigger chain is executable from empty-DB using only
# §1.5 endpoints; literal-lock and OCC ${var} discipline observed throughout.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_production_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Production.fields.status, entities.Production.fields.committed_cost_cents]
        distinguishing_aspect: "POST /productions with title+type+budget returns 201, status=DRAFT, committed_cost_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /productions"
              payload: { title: "Greenfield", production_type: "FEATURE", total_budget_cents: 5000000 }
              as: LineProducer
              captures: { prod_id: $.data.id, st: $.data.status, ver: $.data.version }
          assert:
            - "response status == 201"
            - "Production.${prod_id}.status == DRAFT"
            - "Production.${prod_id}.committed_cost_cents == 0"
            - "Production.${prod_id}.version == 1"

      - name: get_production_not_found
        claim_type: Not Found
        grounds: ["endpoints", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /productions/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /productions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LineProducer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: create_budget_line_missing_required_field
        claim_type: Required Fields
        grounds: ["entities.BudgetLine.fields.category", "validations[priority=4]"]
        distinguishing_aspect: "POST /budget-lines omitting category returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A production exists."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", estimated_cents: 100000 }
              as: LineProducer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: create_crew_invalid_enum_union_code
        claim_type: Type Constraints
        grounds: ["entities.CrewMember.fields.union_code", "validations[priority=4]"]
        distinguishing_aspect: "POST /crew-members with union_code='TEAMSTERS' (not in enum) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A production exists."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "X", role_title: "Y", daily_rate_cents: 100000, union_code: "TEAMSTERS" }
              as: LineProducer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: create_budget_line_negative_amount_validation_failed
        claim_type: Type Constraints
        grounds: ["entities.BudgetLine.fields.estimated_cents", "errors[ERR_VALIDATION_FAILED]"]
        distinguishing_aspect: "POST /budget-lines with estimated_cents=-1 returns ERR_VALIDATION_FAILED (422) — range check distinct from missing-field 400."
        test_recipe:
          setup: ["A production exists."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "POST", estimated_cents: -1 }
              as: LineProducer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_VALIDATION_FAILED"

      - name: create_assignment_parent_crew_not_found
        claim_type: Parent Relationships
        grounds: ["entities.Assignment.fields.crew_member_id", "validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /assignments with a non-existent crew_member_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["ACTIVE production with one PLANNED shooting day; no such crew member."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-09-01", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id, day_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
          trigger:
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day_id}", crew_member_id: "00000000-0000-4000-8000-000000000abc", call_time: "2026-09-01T06:00:00.000Z", expected_shooting_day_version: "${day_v}" }
              as: FirstAD
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: system_fields_input_ignored_on_create
        claim_type: System Fields
        grounds: [entities.Production.fields.status, entities.Production.fields.committed_cost_cents]
        distinguishing_aspect: "Server-generated status/committed_cost_cents are not client-settable; a created production is DRAFT with committed_cost_cents=0 regardless of any extra body intent (only declared inputs are accepted)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /productions"
              payload: { title: "Ignore", production_type: "EPISODIC", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id, st: $.data.status }
          assert:
            - "Production.${prod_id}.status == DRAFT"
            - "Production.${prod_id}.committed_cost_cents == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_pay_from_unpaid_without_wrapped_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Assignment.UNPAID_to_APPROVED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / invalid_state_beats_budget_on_approve_pay
          rationale: "The §1.8 instance already asserts approve-pay on a non-WRAPPED assignment returns ERR_INVALID_STATE."

      - name: start_review_dailies_from_pending_invalid_when_day_planned
        claim_type: Precondition Enforcement
        grounds: [state_machines.Dailies.PENDING_to_IN_REVIEW, entities.ShootingDay.fields.status]
        distinguishing_aspect: "POST /dailies/{id}/start-review when the parent ShootingDay is still PLANNED (not WRAPPED/IN_PROGRESS) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["ACTIVE production, one PLANNED shooting day with a PENDING dailies record."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "POST", estimated_cents: 100000 }
              as: LineProducer
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-09-03", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /dailies"
              payload: { shooting_day_id: "${day_id}", reel_label: "A001" }
              as: PostSupervisor
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /dailies/${d_id}/start-review"
              payload: {}
              as: PostSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: cancel_already_wrapped_shooting_day_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ShootingDay.IN_PROGRESS_to_WRAPPED, entities.ShootingDay.fields.status]
        distinguishing_aspect: "POST /shooting-days/{id}/cancel on a WRAPPED (terminal) day returns ERR_INVALID_STATE — cancel is only defined from PLANNED/CALLED."
        test_recipe:
          setup: ["ACTIVE production with a WRAPPED shooting day (no assignments, started then wrapped)."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Lead", role_title: "Lead", daily_rate_cents: 100000, is_sag_aftra: false, union_code: "NONE" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-09-05", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id, day_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day_id}", crew_member_id: "${crew_id}", call_time: "2026-09-05T06:00:00.000Z", expected_shooting_day_version: "${day_v}" }
              as: FirstAD
              captures: { asg_id: $.data.id }
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day_id}", general_call_time: "2026-09-05T06:00:00.000Z" }
              as: FirstAD
              captures: { cs_id: $.data.id }
            - call: "POST /call-sheets/${cs_id}/publish"
              payload: {}
              as: FirstAD
            - call: "POST /shooting-days/${day_id}/start"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg_id}/check-in"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg_id}/check-out"
              payload: { wrap_time: "2026-09-05T18:00:00.000Z", meal_breaks_taken: 2 }
              as: FirstAD
            - call: "POST /shooting-days/${day_id}/wrap"
              payload: {}
              as: FirstAD
          trigger:
            - call: "POST /shooting-days/${day_id}/cancel"
              payload: {}
              as: FirstAD
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: dailies_cyclic_flag_then_resume_review
        claim_type: cyclic
        grounds: [state_machines.Dailies.IN_REVIEW_to_FLAGGED, state_machines.Dailies.FLAGGED_to_IN_REVIEW, entities.Dailies.fields.status]
        distinguishing_aspect: "Dailies loops IN_REVIEW->FLAGGED->IN_REVIEW: after flag the status is FLAGGED, after start-review again it is IN_REVIEW."
        test_recipe:
          setup: ["ACTIVE production with a WRAPPED day and a Dailies record in IN_REVIEW."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "POST", estimated_cents: 100000 }
              as: LineProducer
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-09-07", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /dailies"
              payload: { shooting_day_id: "${day_id}", reel_label: "A002" }
              as: PostSupervisor
              captures: { d_id: $.data.id }
            - call: "POST /dailies/${d_id}/start-review"
              payload: {}
              as: PostSupervisor
          trigger:
            - call: "POST /dailies/${d_id}/flag"
              payload: { flagged_reason: "soft focus" }
              as: PostSupervisor
              captures: { st1: $.data.status }
            - call: "POST /dailies/${d_id}/start-review"
              payload: {}
              as: PostSupervisor
              captures: { st2: $.data.status }
          assert:
            - "after flag: Dailies.${d_id}.status == FLAGGED"
            - "after resume: Dailies.${d_id}.status == IN_REVIEW"

      - name: permit_branch_to_denied_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.LocationPermit.REQUESTED_to_DENIED, state_machines.LocationPermit.REQUESTED_to_APPROVED]
        distinguishing_aspect: "A DENIED permit is terminal: POST /location-permits/{id}/approve on it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A production with a location and a DENIED permit."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /locations"
              payload: { production_id: "${prod_id}", name: "Loc", address: "1 St" }
              as: LineProducer
              captures: { loc_id: $.data.id }
            - call: "POST /location-permits"
              payload: { location_id: "${loc_id}", permit_number: "P-9", window_start: "2026-09-10T08:00:00.000Z", window_end: "2026-09-10T12:00:00.000Z" }
              as: LineProducer
              captures: { perm_id: $.data.id }
            - call: "POST /location-permits/${perm_id}/deny"
              payload: {}
              as: LineProducer
          trigger:
            - call: "POST /location-permits/${perm_id}/approve"
              payload: {}
              as: LineProducer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: shooting_day_wrap_blocked_by_open_assignment
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ShootingDay.IN_PROGRESS_to_WRAPPED", "errors[ERR_OPEN_ASSIGNMENTS_BLOCK_WRAP]"]
        distinguishing_aspect: "Wrapping an IN_PROGRESS day with a still-CHECKED_IN assignment returns ERR_OPEN_ASSIGNMENTS_BLOCK_WRAP (409)."
        test_recipe:
          setup: ["ACTIVE production, IN_PROGRESS day with one CHECKED_IN (not yet wrapped) assignment."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Lead", role_title: "Lead", daily_rate_cents: 100000, is_sag_aftra: false, union_code: "NONE" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-09-12", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id, day_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day_id}", crew_member_id: "${crew_id}", call_time: "2026-09-12T06:00:00.000Z", expected_shooting_day_version: "${day_v}" }
              as: FirstAD
              captures: { asg_id: $.data.id }
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day_id}", general_call_time: "2026-09-12T06:00:00.000Z" }
              as: FirstAD
              captures: { cs_id: $.data.id }
            - call: "POST /call-sheets/${cs_id}/publish"
              payload: {}
              as: FirstAD
            - call: "POST /shooting-days/${day_id}/start"
              payload: {}
              as: FirstAD
            - call: "POST /assignments/${asg_id}/check-in"
              payload: {}
              as: FirstAD
          trigger:
            - call: "POST /shooting-days/${day_id}/wrap"
              payload: {}
              as: FirstAD
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_OPEN_ASSIGNMENTS_BLOCK_WRAP"

      - name: callsheet_publish_calls_the_day
        claim_type: Side Effect Execution
        grounds: [state_machines.CallSheet.DRAFT_to_PUBLISHED, state_machines.ShootingDay.PLANNED_to_CALLED]
        distinguishing_aspect: "First publish of a DRAFT call sheet transitions the parent ShootingDay PLANNED->CALLED and stamps published_at."
        test_recipe:
          setup: ["ACTIVE production with a PLANNED day that has one assignment and a DRAFT call sheet."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Lead", role_title: "Lead", daily_rate_cents: 100000, is_sag_aftra: false, union_code: "NONE" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-09-14", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id, day_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day_id}", crew_member_id: "${crew_id}", call_time: "2026-09-14T06:00:00.000Z", expected_shooting_day_version: "${day_v}" }
              as: FirstAD
            - call: "POST /call-sheets"
              payload: { shooting_day_id: "${day_id}", general_call_time: "2026-09-14T06:00:00.000Z" }
              as: FirstAD
              captures: { cs_id: $.data.id }
          trigger:
            - call: "POST /call-sheets/${cs_id}/publish"
              payload: {}
              as: FirstAD
              captures: { cs_st: $.data.status }
            - call: "GET /shooting-days/${day_id}"
              payload: {}
              as: FirstAD
              captures: { day_st: $.data.status }
          assert:
            - "CallSheet.${cs_id}.status == PUBLISHED"
            - "ShootingDay.${day_id}.status == CALLED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: residual_chronological_out_of_order_event_date
        claim_type: Input Set Filtering
        grounds: [calculations.residual_accrual, entities.ResidualEvent.fields.event_date]
        distinguishing_aspect: "Residual cumulative ordering is by event_date ASC: an event posted later in wall time but with an EARLIER event_date is positioned first in the tier accrual, so the lower-receipt event still earns the tier-1 marginal portion."
        test_recipe:
          setup: ["A production; first POST an event dated 2026-03-31 gross 40,000,000, then POST an event dated 2026-01-31 gross 80,000,000 (earlier date, posted second)."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /residual-events"
              payload: { production_id: "${prod_id}", market: "SVOD", gross_receipts_cents: 40000000, event_date: "2026-03-31" }
              as: PayrollCoordinator
              captures: { late_id: $.data.id }
          trigger:
            - call: "POST /residual-events"
              payload: { production_id: "${prod_id}", market: "THEATRICAL", gross_receipts_cents: 80000000, event_date: "2026-01-31" }
              as: PayrollCoordinator
              captures: { early_id: $.data.id, early_res: $.data.residual_amount_cents }
          assert:
            - "ResidualEvent.${early_id}.residual_amount_cents == 960000"
            - "Production.${prod_id}.residual_reserve_cents == 1560000"

      - name: non_sag_crew_meal_penalty_zero
        claim_type: Variant Selection
        grounds: [calculations.meal_penalty, entities.CrewMember.fields.is_sag_aftra]
        distinguishing_aspect: "A non-SAG crew member checked out at 13.0 hours with 0 meals accrues meal_penalty_cents == 0 (the SAG variant does not apply)."
        test_recipe:
          setup: ["ACTIVE production, non-SAG crew (is_sag_aftra=false), checked in then out at 13.0h with 0 meals."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "P", production_type: "FEATURE", total_budget_cents: 1000000 }
              as: LineProducer
              captures: { prod_id: $.data.id }
            - call: "POST /budget-lines"
              payload: { production_id: "${prod_id}", category: "BELOW_THE_LINE_LABOR", estimated_cents: 500000 }
              as: LineProducer
            - call: "POST /crew-members"
              payload: { production_id: "${prod_id}", full_name: "Grip", role_title: "Grip", daily_rate_cents: 100000, is_sag_aftra: false, union_code: "NONE" }
              as: LineProducer
              captures: { crew_id: $.data.id }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /shooting-days"
              payload: { production_id: "${prod_id}", shoot_date: "2026-09-16", day_number: 1 }
              as: FirstAD
              captures: { day_id: $.data.id, day_v: $.data.version }
            - call: "POST /productions/${prod_id}/advance"
              payload: {}
              as: LineProducer
            - call: "POST /assignments"
              payload: { shooting_day_id: "${day_id}", crew_member_id: "${crew_id}", call_time: "2026-09-16T06:00:00.000Z", expected_shooting_day_version: "${day_v}" }
              as: FirstAD
              captures: { asg_id: $.data.id }
            - call: "POST /call-sheets"
