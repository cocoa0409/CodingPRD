  - section: rbac
    instances:
      - name: front_desk_cannot_receive_a_pellet_lot
        claim_type: "Role denial"
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_ROLE]", roles.InventoryManager]
        distinguishing_aspect: "Receiving inventory is an InventoryManager exclusive operation, so FrontDesk is refused with ERR_FORBIDDEN_ROLE at rung 3 before any field is even parsed."
        test_recipe:
          setup: ["Empty inventory."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/pellet-lots"
              payload: { lot_code: "T200-FD", hormone_type: "TESTOSTERONE", strength_mg: 200, expiry_date: "2026-12-01T00:00:00Z", qty_received: 10 }
              as: FrontDesk
              captures: { role_err: $.data.error_id }
          assert:
            - "${role_err} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "no PelletLot row exists with lot_code T200-FD"

      - name: nurse_injector_cannot_author_a_standing_order
        claim_type: "Role denial"
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_ROLE]", roles.Physician]
        distinguishing_aspect: "Authoring a delegation is a Physician exclusive; the nurse who benefits from the order can never write it, which is the whole point of the delegated-authority model."
        test_recipe:
          setup: ["One nurse injector."]
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Nina Okafor RN", provider_type: "NURSE_INJECTOR", npi: "1000000003" }
              as: ClinicAdmin
              captures: { nr1: $.data.id }
          trigger:
            - call: "POST /clinic/standing-orders"
              payload: { physician_id: "${nr1}", scope_hormone_types: ["TESTOSTERONE"], scope_injection_types: ["B12"], max_dose_mg: 1500, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: NurseInjector
              as_user_id: "${nr1}"
              captures: { so_role_err: $.data.error_id }
          assert:
            - "${so_role_err} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "no StandingOrder row exists with physician_id ${nr1}"

      - name: compliance_officer_cannot_schedule_a_procedure
        claim_type: "Role denial"
        grounds: ["validations[priority=3]", roles.ComplianceOfficer, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "ComplianceOfficer holds recall and read powers but is absent from the roles list of POST /clinic/procedures, so oversight can never become care delivery."
        test_recipe:
          setup: ["One physician, one patient, one consult and one standing order."]
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
              as: ClinicAdmin
              captures: { dr1: $.data.id }
            - call: "POST /clinic/patients"
              payload: { full_name: "Corner ThirtyNine", date_of_birth: "1980-01-01", email: "c39@example.com", sex_at_birth: "MALE" }
              as: ClinicAdmin
              captures: { c39: $.data.id }
            - call: "POST /clinic/consults"
              payload: { patient_id: "${c39}", physician_id: "${dr1}", hormone_type: "TESTOSTERONE", prescribed_dose_mg: 1000, symptom_score: 55, indication: "Hypogonadism" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { cs39: $.data.id }
            - call: "POST /clinic/standing-orders"
              payload: { physician_id: "${dr1}", scope_hormone_types: ["TESTOSTERONE"], scope_injection_types: ["B12"], max_dose_mg: 1500, valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: Physician
              as_user_id: "${dr1}"
              captures: { so39: $.data.id }
          trigger:
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${c39}", provider_id: "${dr1}", consult_id: "${cs39}", standing_order_id: "${so39}", procedure_type: "INITIAL", room_code: "RM61", scheduled_start: "2026-06-21T09:00:00Z" }
              as: ComplianceOfficer
              captures: { co_err: $.data.error_id }
          assert:
            - "${co_err} == ERR_FORBIDDEN_ROLE with HTTP 403"
            - "no Procedure row exists with consult_id ${cs39}"

      - name: patient_cannot_read_another_patients_procedure
        claim_type: "Ownership denial"
        grounds: ["validations[priority=8]", "errors[ERR_FORBIDDEN_OWNERSHIP]", roles.Patient]
        distinguishing_aspect: "The Patient role is entity_backed on Patient, so rung 8 compares X-User-ID with the row's patient_id and returns ERR_FORBIDDEN_OWNERSHIP rather than a 404 that would leak existence."
        test_recipe:
          setup: ["Two patients; the first holds a SCHEDULED procedure."]
          setup_api_calls:
            - call: "POST /clinic/providers"
              payload: { full_name: "Dr Ada Reyes", provider_type: "PHYSICIAN", npi: "1000000001" }
