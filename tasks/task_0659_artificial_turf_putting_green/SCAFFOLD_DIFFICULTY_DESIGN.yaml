            - call: "POST /site-measures"
              payload: { project_id: "${p2}", gross_area_sqft: 600, longest_run_ft: 20, slope_pct: 1.0 }
              as: SalesRep
              captures: { m2: $.data.id }
            - call: "POST /design-layouts"
              payload: { project_id: "${p2}", site_measure_id: "${m2}", turf_product_id: "${turf_id}", infill_product_id: "${infill_id}", variant: "STANDARD" }
              as: SalesRep
              captures: { d2: $.data.id }
            - call: "POST /design-layouts/${d2}/accept"
              payload: {}
              as: SalesRep
            - call: "POST /base-prep-scopes"
              payload: { project_id: "${p2}", design_layout_id: "${d2}", base_depth_in: 3 }
              as: SalesRep
              captures: { s2: $.data.id }
            - call: "POST /base-prep-scopes/${s2}/finalize"
              payload: {}
              as: SalesRep
            - call: "POST /quotes"
              payload: { project_id: "${p2}", design_layout_id: "${d2}", base_prep_scope_id: "${s2}", deposit_pct: 0.30 }
              as: SalesRep
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/send"
