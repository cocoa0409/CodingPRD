          difficulty_instance: "boundary_precision_check / total_months_in_rank_cap_accepts_exactly_sixty_and_rejects_sixty_one"
          rationale: "The boundary-precision instance already creates the exactly-60 appointment that must succeed and the 61-month sibling that must fail with ERR_RANK_YEARS_EXCEEDED, using the same prior_external_months_in_rank plus term_months arithmetic a threshold corner test would use."

      - name: the_fringe_band_is_keyed_on_the_prorated_base_not_on_the_total
        claim_type: waterfall_allocation
        grounds:
          - calculations.funding_encumbrance
          - constants.FRINGE_BAND_1_CEILING_USD
          - constants.FRINGE_BAND_2_CEILING_USD
        excluded_because:
          difficulty_instance: "combinatorial_formula / encumbrance_pinned_rounding_order_and_base_keyed_fringe_tier"
          rationale: "The combinatorial-formula instance already pins both the band-selection input and the rounding order across three salary points that straddle FRINGE_BAND_1_CEILING_USD and FRINGE_BAND_2_CEILING_USD, so a separate bucket-filling corner test would assert the same cent-level totals."

      - name: the_same_filing_instant_projects_two_different_decision_dates
        claim_type: variant_divergence
        grounds:
          - calculations.visa_processing_timeline
          - calculations.visa_processing_timeline.variants
          - constants.RFE_EXTENSION_FACTOR
        excluded_because:
          difficulty_instance: "dual_variant_calc / visa_timeline_initial_filing_versus_post_rfe_refiling"
          rationale: "The dual-variant instance already files, receives an RFE and refiles from a single logical instant to show the +21-day and +32-day projections diverging, including the discarded pre-RFE elapsed time, which is exactly what a divergence corner test would measure."

      - name: the_screening_tier_selects_which_risk_variant_applies
        claim_type: variant_selection
        grounds:
          - calculations.export_control_risk_score
          - calculations.export_control_risk_score.variants
          - constants.COUNTRY_RISK
        excluded_because:
          difficulty_instance: "dual_variant_calc / export_risk_tier1_standard_versus_tier2_enhanced"
          rationale: "The dual-variant instance already drives identical reviewer inputs through a cycle-1 and a cycle-2 review to show the 12.5-versus-15.0 country weight and the appearance of the duration component, so the selection rule is covered with stronger data than a corner test would use."

  - section: validations
    instances:

      - name: an_appointment_under_a_mentor_whose_training_lapses_before_the_term_starts_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_14_ERR_MENTOR_TRAINING_LAPSED
          - entities.FacultyMentor.mentor_training_valid_through
          - errors[ERR_MENTOR_TRAINING_LAPSED]
        distinguishing_aspect: "The mentor's training expires 2026-09-30, one day before the 2026-10-01 term start, so POST /appointments must return ERR_MENTOR_TRAINING_LAPSED (422) and create nothing - the appointment collection stays empty. Every other rule on this request is satisfied, so any other error_id means the ladder was mis-ordered rather than that the data was bad."
        test_recipe:
          setup:
            - "One mentor whose mentor_training_valid_through is 2026-09-30."
            - "One US-citizen scholar needing no sponsorship and one VERIFIED NIH_SCALE FEDERAL_GRANT (300000.00, 2026-09-01 to 2027-12-31)."
            - "No appointment exists yet."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "M. Kowalski", department: "Microbiology", mentor_training_valid_through: "2026-09-30" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_49"
              captures: { m49_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "NIH R01-4900", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 300000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_49"
              captures: { f49_id: "$.data.id" }
            - call: "POST /funding-sources/${f49_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_12"
            - call: "POST /postdocs"
              payload: { full_name: "Noa Erlich", email: "noa.e@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-05-10" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_49"
              captures: { p49_id: "$.data.id" }
          trigger:
            - call: "POST /appointments"
              payload: { postdoc_id: "${p49_id}", mentor_id: "${m49_id}", funding_source_id: "${f49_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 62000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_49"
              captures: { lapsed_err: "$.data.error_id" }
          assert:
            - "response http_status == 422"
            - "${lapsed_err} == ERR_MENTOR_TRAINING_LAPSED"
            - "GET /appointments returns total_count 0"
            - "FacultyMentor.${m49_id}.active_postdoc_count == 0"
            - "FundingSource.${f49_id}.encumbered_usd == 0.00"

      - name: training_valid_exactly_on_the_start_date_and_salary_exactly_on_the_floor_both_pass
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_14_ERR_MENTOR_TRAINING_LAPSED
          - validations.priority_30_ERR_SALARY_BELOW_FLOOR
          - calculations.salary_floor_computation
        distinguishing_aspect: "Two inclusive boundaries fire in the same chain and must both be satisfied, not violated: mentor training valid through exactly 2026-10-01 equals the term start date, and annual_salary_usd of exactly 61008.00 equals the band-0 NIH floor. The offer must issue with http_status 200 and encumber 79920.48 - an implementation using strict inequalities on either rule returns ERR_MENTOR_TRAINING_LAPSED or ERR_SALARY_BELOW_FLOOR instead."
        test_recipe:
          setup:
            - "One mentor whose mentor_training_valid_through is exactly 2026-10-01."
            - "One US-citizen scholar needing no sponsorship with no prior rank months, so the band is 0 and the NIH floor is 61008.00."
            - "One VERIFIED NIH_SCALE FEDERAL_GRANT (300000.00, 2026-09-01 to 2027-12-31) with no document requirements."
            - "One DRAFT EMPLOYEE / POSTDOC_ASSOCIATE appointment 2026-10-01 to 2027-09-30 at exactly 61008.00."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "N. Okada", department: "Biophysics", mentor_training_valid_through: "2026-10-01" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_50"
              captures: { m50_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "NIH R01-5000", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 300000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_50"
              captures: { f50_id: "$.data.id" }
            - call: "POST /funding-sources/${f50_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_12"
            - call: "POST /postdocs"
              payload: { full_name: "Oskar Brenner", email: "oskar.b@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-05-11" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_50"
              captures: { p50_id: "$.data.id" }
          trigger:
            - call: "POST /appointments"
              payload: { postdoc_id: "${p50_id}", mentor_id: "${m50_id}", funding_source_id: "${f50_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 61008.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_50"
              captures: { a50_id: "$.data.id", a50_floor: "$.data.salary_floor_usd" }
            - call: "POST /appointments/${a50_id}/issue-offer"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_50"
              captures: { a50_status: "$.data.appointment_status", a50_enc: "$.data.encumbrance_usd", a50_rate: "$.data.fringe_rate" }
          assert:
            - "the create call http_status == 201"
            - "${a50_floor} == 61008.00"
            - "the issue-offer call http_status == 200"
            - "${a50_status} == OFFER_ISSUED"
            - "${a50_rate} == 0.31"
            - "${a50_enc} == 79920.48"
            - "FundingSource.${f50_id}.encumbered_usd == 79920.48"
            - "FundingSource.${f50_id}.available_balance_usd == 220079.52"

      - name: the_acknowledgement_gate_applies_to_an_idp_but_not_to_a_mentoring_plan
        claim_type: conditional_validation
        grounds:
          - validations.priority_21_ERR_IDP_NOT_ACKNOWLEDGED
          - entities.DevelopmentDocument.postdoc_acknowledged
          - entities.FundingSource.requires_idp
        distinguishing_aspect: "The rule is conditional on doc_type, so the identical review decision APPROVE behaves differently on two documents: an IDP with postdoc_acknowledged false is refused with ERR_IDP_NOT_ACKNOWLEDGED (422) and only approves after the scholar acknowledges it, while a MENTORING_PLAN with postdoc_acknowledged still false approves immediately. An implementation that applies the gate to every document type fails the second half."
        test_recipe:
          setup:
            - "One mentor with valid training and max_concurrent_postdocs 3, two US-citizen scholars needing no sponsorship."
            - "Award IDP-only: VERIFIED NIH_SCALE FEDERAL_GRANT with requires_idp true and requires_mentoring_plan false."
            - "Award PLAN-only: VERIFIED NIH_SCALE FEDERAL_GRANT with requires_mentoring_plan true and requires_idp false."
            - "Both appointments are 2026-10-01 to 2027-09-30 at 62000.00, issued, and each has exactly one SUBMITTED document of the funder-required type."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "O. Ferreira", department: "Developmental Biology", mentor_training_valid_through: "2029-12-31", max_concurrent_postdocs: 3 }
