            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-103", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl3: $.data.id } }
