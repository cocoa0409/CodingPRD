  # ===================================================================
  - rule_id: transitive_cascade
    instances:

      - name: participant_withdraw_chain_seat_cohort_allocation_grant
        grounds:
          - state_machines.Participant.ACTIVE_to_WITHDRAWN
          - state_machines.Enrollment.ATTENDING_to_WITHDRAWN
          - state_machines.Cohort.RUNNING_to_SUSPENDED
          - state_machines.FundingAllocation.COMMITTED_to_RELEASED
          - entities.GrantAward.fields.committed_cents
          - entities.GrantAward.fields.available_cents
        distinguishing_aspect: |
          Depth-5 chain from ONE trigger (participant withdrawal): Participant ->
          Enrollment -> Cohort seat counters and RUNNING -> SUSPENDED -> that
          suspension releases the COMMITTED FundingAllocation -> the release restores
          GrantAward.committed_cents to 0 and available_cents to 5000000. Each link is
          caused by the previous link, not by the original request.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "MeetingSpace 'Chapel Room' with capacity 20 and turnover_buffer_minutes 30."
            - "GrantAward with awarded_cents 5000000, allowed_categories [GROUP_PROGRAM], period 2026-01-01..2026-12-31."
            - "Cohort with seats_total 4, min_viable_enrollment 1, direct_cost_cents 240000 -> program_cost_total_cents 268800; opened for enrolment."
            - "One accepted Participant with a NEEDS Assessment, enrolled and CONFIRMED, so seats_filled is 1 and seats_open is 3."
            - "A GROUP_PROGRAM FundingAllocation created while seats_filled is 1 and seats_held is 0 -> provisional_cents 67200, GrantAward.committed_cents 67200, available_cents 4932800."
            - "Cohort launched to RUNNING and the enrollment is ATTENDING."
