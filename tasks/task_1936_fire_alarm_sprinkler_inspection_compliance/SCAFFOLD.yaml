# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Verify actor equals attest actor on the same Deficiency" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body FK references non-existent entity" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required body field missing, wrong scalar type, or unpermitted_work_detected not true on cite endpoint" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field value outside declared set" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "end <= start, expires_on <= issued_on, or scheduled_end <= scheduled_start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from current state (incl. terminal-state lockdown and repeated actions)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match parent current version" }
  - { id: ERR_CONTRACTOR_POSTURE_BLOCKED, http: 409, condition: "Contractor posture (PROBATION/SUSPENDED per transition) or DEACTIVATED status blocks the child write" }
  - { id: ERR_SYSTEM_OUT_OF_SERVICE, http: 409, condition: "Event start while system impairment_status == OUT_OF_SERVICE" }
  - { id: ERR_SYSTEM_IMPAIRED, http: 422, condition: "Permit issue while system impairment_status != NORMAL" }
  - { id: ERR_LICENSE_NOT_VALID, http: 422, condition: "Technician lacks ACTIVE license of required class, or license expires_on <= relevant date" }
  - { id: ERR_TECHNICIAN_NOT_ASSIGNED, http: 403, condition: "Acting technician is not the event's lead_technician_id" }
  - { id: ERR_TECHNICIAN_CAPACITY, http: 409, condition: "Lead technician would exceed 3 overlapping SCHEDULED/IN_PROGRESS events" }
  - { id: ERR_IMPAIRMENT_OVERLAP, http: 409, condition: "New PLANNED impairment overlaps another or starts inside the 4h re-certification buffer" }
  - { id: ERR_DUPLICATE_CONSTRAINT, http: 409, condition: "state_license_no / serial_no-within-system / plan_year-within-property uniqueness violated (specialized aliases ERR_DUPLICATE_LICENSE_NO, ERR_DUPLICATE_DEVICE_SERIAL, ERR_DUPLICATE_PLAN_YEAR map to this class)" }
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 422, condition: "Cross-aggregate FK consistency violated (device not in event system; event not in plan property; pump coordination event on wrong system; test system category mismatch incl. ERR_SYSTEM_CATEGORY_MISMATCH / ERR_DEVICE_REPLACEMENT_MISMATCH aliases)" }
  - { id: ERR_OPEN_ITEMS_BLOCK, http: 409, condition: "Archive/deactivate/decommission/replace/remove blocked by open children (aliases ERR_OPEN_EVENTS_BLOCK_DEACTIVATION, ERR_TECHNICIAN_HAS_OPEN_EVENTS, ERR_SYSTEMS_STILL_IN_SERVICE, ERR_UNRESOLVED_FALSE_ALARMS, ERR_OPEN_IMPAIRMENT_EXISTS, ERR_OPEN_PERMIT_EXISTS, ERR_DEVICE_HAS_OPEN_DEFICIENCY)" }
  - { id: ERR_CRITICAL_NOT_WAIVABLE, http: 422, condition: "Waive attempted on CRITICAL deficiency" }
  - { id: ERR_EMPTY_PLAN, http: 422, condition: "Publish attempted with total_events_required == 0" }
  - { id: ERR_EVENT_NOT_COMPLETED, http: 409, condition: "Deficiency attest or report submit while parent event not COMPLETED" }
  - { id: ERR_EVENT_NOT_YET_DUE, http: 422, condition: "mark-no-access before scheduled_start" }
  - { id: ERR_UNRESOLVED_OVERDUE_DEFICIENCIES, http: 409, condition: "Report accept with deficiencies past deadline and not VERIFIED/WAIVED" }
  - { id: ERR_REPORT_REVISION_INVALID, http: 422, condition: "revision_of_id missing, not REJECTED, or on a different event" }
  - { id: ERR_PUMP_COORDINATION_REQUIRED, http: 422, condition: "ANNUAL_FLOW pump test lacks a COMPLETED coordinated event on the same system" }
  - { id: ERR_PERMIT_EXPIRED, http: 409, condition: "commence-work after issue date + PERMIT_VALIDITY_DAYS (90)" }
  - { id: ERR_POST_MOD_INSPECTION_REQUIRED, http: 409, condition: "Permit close without a post-commencement COMPLETED inspection" }
  - { id: ERR_DEFICIENCY_NOT_EXTENSIBLE, http: 422, condition: "extend-deadline on CRITICAL deficiency, on non-OPEN deficiency, or when extension_used already true" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FireMarshal
    description: "Authority-having-jurisdiction reviewer; registers contractors, verifies deficiencies, adjudicates reports/permits, records false alarms, sets clock"
    identity: opaque
    exclusive_operations:
      - "POST /fire-compliance/contractors"
      - "POST /fire-compliance/contractors/{id}/deactivate"
      - "POST /fire-compliance/contractors/{id}/audit-score"
      - "POST /fire-compliance/license-records/{id}/revoke"
      - "POST /fire-compliance/deficiencies/{id}/verify"
      - "POST /fire-compliance/deficiencies/{id}/reject-correction"
      - "POST /fire-compliance/deficiencies/{id}/waive"
      - "POST /fire-compliance/deficiencies/{id}/extend-deadline"
      - "POST /fire-compliance/impairments/{id}/close"
      - "POST /fire-compliance/marshal-reports/{id}/accept"
      - "POST /fire-compliance/marshal-reports/{id}/reject"
      - "POST /fire-compliance/properties/{id}/false-alarm-cases"
      - "POST /fire-compliance/false-alarm-cases/{id}/assess"
      - "POST /fire-compliance/false-alarm-cases/{id}/waive"
      - "POST /fire-compliance/modification-permits/{id}/issue"
      - "POST /fire-compliance/modification-permits/{id}/close"
      - "POST /fire-compliance/modification-permits/{id}/cite-unpermitted-work"
      - "POST /fire-compliance/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: ContractorAdmin
    description: "Office administrator of the service contractor; manages technicians, properties, plans, impairments, tests, permits"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /fire-compliance/contractors/{id}/technicians"
      - "POST /fire-compliance/technicians/{id}/deactivate"
      - "POST /fire-compliance/technicians/{id}/license-records"
      - "POST /fire-compliance/properties"
      - "POST /fire-compliance/properties/{id}/archive"
      - "POST /fire-compliance/properties/{id}/systems"
      - "POST /fire-compliance/systems/{id}/decommission"
      - "POST /fire-compliance/systems/{id}/devices"
      - "POST /fire-compliance/devices/{id}/replace"
      - "POST /fire-compliance/devices/{id}/remove"
      - "POST /fire-compliance/properties/{id}/inspection-plans"
      - "POST /fire-compliance/inspection-plans/{id}/publish"
      - "POST /fire-compliance/inspection-plans/{id}/events"
      - "POST /fire-compliance/inspection-events/{id}/cancel"
      - "POST /fire-compliance/deficiencies/{id}/attest-correction"
      - "POST /fire-compliance/systems/{id}/impairments"
      - "POST /fire-compliance/impairments/{id}/notify-authority"
      - "POST /fire-compliance/impairments/{id}/restore"
      - "POST /fire-compliance/inspection-events/{id}/marshal-reports"
      - "POST /fire-compliance/marshal-reports/{id}/submit"
      - "POST /fire-compliance/systems/{id}/backflow-tests"
      - "POST /fire-compliance/backflow-tests/{id}/invoice"
      - "POST /fire-compliance/backflow-tests/{id}/record-payment"
      - "POST /fire-compliance/systems/{id}/fire-pump-tests"
      - "POST /fire-compliance/fire-pump-tests/{id}/attest"
      - "POST /fire-compliance/false-alarm-cases/{id}/record-payment"
      - "POST /fire-compliance/systems/{id}/modification-permits"
      - "POST /fire-compliance/modification-permits/{id}/commence-work"
    shared_operations:
      - "All GET endpoints"
  - name: Technician
    description: "Field technician; starts/completes events assigned to them, records deficiencies, marks no-access"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /fire-compliance/inspection-events/{id}/start"
      - "POST /fire-compliance/inspection-events/{id}/complete"
      - "POST /fire-compliance/inspection-events/{id}/mark-no-access"
      - "POST /fire-compliance/inspection-events/{id}/deficiencies"
    shared_operations:
      - "GET endpoints for contractors, technicians, license-records, properties, systems, devices, events, deficiencies, impairments"
