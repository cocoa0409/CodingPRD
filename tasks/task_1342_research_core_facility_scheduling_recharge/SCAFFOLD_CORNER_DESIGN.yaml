        claim_type: immediate_visibility
        grounds:
          - "complexity_profile.consistency_model"
          - "calculations.grant_budget_available"
        distinguishing_aspect: "Immediate consistency: the approve RESPONSE already carries the pinned estimate, and an immediately-following GET on the grant reflects the encumbrance — no reconciliation lag anywhere."
        test_recipe:
          setup: ["canonical stack; b1 REQUESTED"]
