          - entities.PremiumInvoice.fields.amount_due_cents
        distinguishing_aspect: "POST /accounts/{id}/invoices returns the fully-computed invoice (amount_due_cents 61200) in the same response — no read-after-write lag (immediate consistency)."
        test_recipe:
          setup: ["Plan A enrollment elected; account A1 exists."]
