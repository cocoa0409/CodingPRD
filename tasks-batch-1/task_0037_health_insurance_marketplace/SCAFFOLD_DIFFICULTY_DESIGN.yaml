      - name: sep_window_closed_beats_sep_not_approved
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_SEP_WINDOW_CLOSED]
          - errors[ERR_SEP_NOT_APPROVED]
        distinguishing_aspect: |
          A different error-category pair: business_temporal (priority 10, SEP window) vs business_referential
          (priority 11, SEP-not-approved). When approving a SEP whose window_close_date has passed, the temporal
          check fires ERR_SEP_WINDOW_CLOSED (409) on the approve endpoint — the approval cannot succeed, so the
          downstream SEP-not-approved condition on submit is never the surfaced error for this approve attempt.
        test_recipe:
          setup:
            - "Household hh10 (RA01,2026), PRIMARY income 3000000. SEP application with PENDING LOSS_OF_COVERAGE SepRequest, event_date 2026-03-01 (window_close_date 2026-04-30 = event + 60 days)."
