      - name: coverage_attach_outside_half_open_window
        grounds:
          - "validations[priority=10]"
          - "entities.ServiceContract.fields.end_date"
        distinguishing_aspect: "Half-open interval semantics on ServiceContract: coverage attach is legal at start_date (inclusive) but illegal at exactly end_date (exclusive) — the endpoint boundary asymmetry is the interval rule."
