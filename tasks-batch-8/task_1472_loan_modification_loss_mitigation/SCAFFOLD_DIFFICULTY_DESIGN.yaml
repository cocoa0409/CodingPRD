  # =====================================================================
  # Rule 8 — resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: escrow_year_half_open_window_overlap
        grounds:
          - validations[priority=10]
          - errors[ERR_ESCROW_YEAR_OVERLAP]
        distinguishing_aspect: |
          Half-open interval-intersection semantics on EscrowAnalysis: a window
          [2026-08, +12) rejects an intersecting window starting 2027-01 but admits
          the adjacent window starting 2027-08 (touching boundaries do not collide).
        test_recipe:
          setup:
            - "Loan with an APPLIED-or-DRAFT standard analysis covering [2026-08, 2027-08)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Tara T", email: "tara.t@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-TO1", property_state_code: "WA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, escrow_balance_cents: 30000, escrow_monthly_cents: 30000, delinquency_days: 0 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /loans/${loan_id}/escrow-analyses", payload: { analysis_type: "STANDARD_ANNUAL", comp_year_start_month: "2026-08", comp_year_months: 12, projected_annual_disbursements_cents: 420000 }, as: ServicingOps, captures: { an1: $.data.id } }
          trigger:
            - { call: "POST /loans/${loan_id}/escrow-analyses", payload: { analysis_type: "STANDARD_ANNUAL", comp_year_start_month: "2027-01", comp_year_months: 12, projected_annual_disbursements_cents: 420000 }, as: ServicingOps, captures: { err: $.data.error_id } }
            - { call: "POST /loans/${loan_id}/escrow-analyses", payload: { analysis_type: "STANDARD_ANNUAL", comp_year_start_month: "2027-08", comp_year_months: 12, projected_annual_disbursements_cents: 430000 }, as: ServicingOps, captures: { an2: $.data.id } }
          assert:
            - "Intersecting window [2027-01, +12): error_id == ERR_ESCROW_YEAR_OVERLAP, http 422"
            - "Adjacent window [2027-08, +12): 201, EscrowAnalysis.${an2}.status == DRAFT (half-open: touching is not overlapping)"

      - name: sale_date_closed_appeal_window_collision
        grounds:
          - calculations.sale_eligibility_window
          - errors[ERR_SALE_WITHIN_APPEAL_WINDOW]
        distinguishing_aspect: |
          Point-in-CLOSED-interval semantics on ForeclosureCase (distinct geometry
          from the sibling half-open window and distinct resource entity): sale on the
          appeal_deadline day itself (2026-08-24) collides; the day after (2026-08-25)
          is free.
        test_recipe:
          setup:
            - "Loan delinquency 150; case REFERRED 2026-08-01; fixture C application denied 2026-08-10 (window [08-10, 08-24] closed)"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Uma U", email: "uma.u@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-TO2", property_state_code: "GA", unpaid_principal_balance_cents: 30000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 6000000, escrow_balance_cents: 0, escrow_monthly_cents: 0, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/foreclosure-cases", payload: { county: "Fulton", docket_number: "FC-900" }, as: ForeclosureCounsel, captures: { fc_id: $.data.id } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "UNEMPLOYMENT", stated_monthly_income_cents: 100000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 100000, pay_frequency: "MONTHLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ServicingAdmin }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1" }
          trigger:
            - { call: "POST /foreclosure-cases/${fc_id}/schedule-sale", payload: { sale_date: "2026-08-24" }, as: ForeclosureCounsel, captures: { err: $.data.error_id } }
            - { call: "POST /foreclosure-cases/${fc_id}/schedule-sale", payload: { sale_date: "2026-08-25" }, as: ForeclosureCounsel }
          assert:
            - "sale_date == appeal_deadline date (2026-08-24): ERR_SALE_WITHIN_APPEAL_WINDOW (closed interval includes the endpoint)"
            - "sale_date 2026-08-25: succeeds, ForeclosureCase.${fc_id}.status == SALE_SCHEDULED"

  # =====================================================================
  # Rule 9 — compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: modification_record_rescind_obligation_conservation
        grounds:
          - state_machines.PermanentModification.SIGNED_to_RECORDED
          - state_machines.PermanentModification.RECORDED_to_RESCINDED
        distinguishing_aspect: |
          Conserved quantity total_secured_obligation = unpaid_principal_balance_cents
          + deferred_principal_cents + arrears_cents: recording moves 5700000 of
          arrears into principal/forbearance (30000000 + 5700000 == 33022303 +
          2677697 + 0), and rescinding restores the exact pre-record triple — no drift
          across the forward+compensating pair.
        test_recipe:
          setup:
            - "Fixture B through SIGNED: post-trial arrears 5700000, final base 35700000, forbearance 2677697; recorded at 2026-11-15"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Vic V", email: "vic.v@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CI1", property_state_code: "TX", unpaid_principal_balance_cents: 30000000, interest_rate_bp: 600, remaining_term_months: 240, arrears_cents: 6000000, escrow_balance_cents: 0, escrow_monthly_cents: 0, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /program-options", payload: { code: "STD_MOD", waterfall_rank: 1, target_dti_bp: 3100, rate_floor_bp: 200, rate_step_bp: 25, max_term_months: 480, max_forbearance_pct_bp: 3000, min_delinquency_days: 61, max_delinquency_days: 720 }, as: ServicingAdmin }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "UNEMPLOYMENT", stated_monthly_income_cents: 322581 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 322581, pay_frequency: "MONTHLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "GET /applications/${app_id}", as: Underwriter, captures: { app_v: $.data.version } }
            - { call: "POST /applications/${app_id}/evaluations", payload: { expected_application_version: "${app_v}" }, as: Underwriter, as_user_id: "uw_1" }
            - { call: "GET /trial-plans?application_id=${app_id}", as: ServicingOps, captures: { plan_id: "$.data[0].id" } }
            - { call: "POST /trial-plans/${plan_id}/accept", as: Borrower, as_user_id: "${b_id}" }
            - { call: "GET /trial-plans/${plan_id}/payments", as: ServicingOps, captures: { p1: "$.data[0].id", p2: "$.data[1].id", p3: "$.data[2].id" } }
            - { call: "POST /trial-payments/${p1}/pay", payload: { amount_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /trial-payments/${p2}/pay", payload: { amount_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /trial-payments/${p3}/pay", payload: { amount_cents: 100000 }, as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /loans/${loan_id}/modifications", payload: { trial_plan_id: "${plan_id}" }, as: ServicingOps, captures: { mod_id: $.data.id } }
            - { call: "POST /modifications/${mod_id}/send-docs", as: ServicingOps }
            - { call: "POST /modifications/${mod_id}/sign", as: Borrower, as_user_id: "${b_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-15T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /modifications/${mod_id}/record", as: ServicingOps }
            - { call: "GET /loans/${loan_id}", as: ServicingOps, captures: { rec_upb: $.data.unpaid_principal_balance_cents, rec_def: $.data.deferred_principal_cents, rec_arr: $.data.arrears_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-18T00:00:00Z" }, as: ServicingAdmin }
          trigger:
            - { call: "POST /modifications/${mod_id}/rescind", as: ServicingOps }
          assert:
            - "After record: rec_upb == 33022303, rec_def == 2677697, rec_arr == 0 and rec_upb + rec_def + rec_arr == 35700000 == 30000000 + 5700000 (conserved)"
            - "After rescind: Loan.${loan_id} unpaid_principal_balance_cents == 30000000, arrears_cents == 5700000, deferred_principal_cents == 0 (snapshot restored)"
            - "PermanentModification.${mod_id}.status == RESCINDED; LossMitApplication.${app_id}.status == TRIAL_PASSED; Loan.workout_status == MOD_PENDING"

      - name: escrow_apply_void_cash_conservation
        grounds:
          - state_machines.EscrowAnalysis.DRAFT_to_APPLIED
          - state_machines.EscrowAnalysis.APPLIED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity escrow cash = escrow_balance_cents + refund_cents
          outstanding: applying a surplus analysis refunds 130000 (200000 == 70000 +
          130000), and voiding claws the refund back (70000 + 130000 == 200000) — a
          different conserved quantity (escrow cash) than the sibling's secured
          obligation.
        test_recipe:
          setup:
            - "Loan escrow_balance 200000, escrow_monthly 30000; standard analysis (disbursements 420000) computed with surplus 130000"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Wen W", email: "wen.w@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CI2", property_state_code: "WA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, escrow_balance_cents: 200000, escrow_monthly_cents: 30000, delinquency_days: 0 }, as: ServicingAdmin, captures: { loan_id: $.data.id } }
            - { call: "POST /loans/${loan_id}/escrow-analyses", payload: { analysis_type: "STANDARD_ANNUAL", comp_year_start_month: "2026-08", comp_year_months: 12, projected_annual_disbursements_cents: 420000 }, as: ServicingOps, captures: { an_id: $.data.id } }
          trigger:
            - { call: "POST /escrow-analyses/${an_id}/apply", as: ServicingOps }
            - { call: "GET /loans/${loan_id}", as: ServicingOps, captures: { bal_after: $.data.escrow_balance_cents, mo_after: $.data.escrow_monthly_cents } }
            - { call: "POST /escrow-analyses/${an_id}/void", as: ServicingOps }
          assert:
            - "EscrowAnalysis.${an_id}.refund_cents == 130000 (surplus 130000 >= 5000)"
            - "After apply: bal_after == 70000 and bal_after + 130000 == 200000 == balance_at_analysis_cents (conserved); mo_after == 35000"
            - "After void: Loan.${loan_id}.escrow_balance_cents == 200000 and escrow_monthly_cents == 30000 (fully restored, no drift)"
            - "EscrowAnalysis.${an_id}.status == VOIDED"
