# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3437_electric_van_production_ramp_fleet_service_network
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: fleet_customer_create_returns_common_fields
        claim_type: Creation
        grounds:
          - entities.FleetCustomer
          - endpoints.POST_/evfleet/fleet-customers
        distinguishing_aspect: "A customer created with the three required inputs returns 201 with version 1 and system-minted id / created_at / updated_at; status-like fields are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_cust
              call: "POST /evfleet/fleet-customers"
              payload: { company_name: "Acme Logistics", contact_email: "ops@acme.test", account_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cust_v: $.data.version }
          assert:
            - "status 201 and response_type object; meta.api_request_id and meta.api_request_timestamp present"
            - "FleetCustomer.${cust_id}.company_name == \"Acme Logistics\" and account_tier == STANDARD"
            - "cust_v == 1 and data carries non-null id, created_at, updated_at"

      - name: depot_create_initializes_committed_capacity_zero
        claim_type: Computed Fields
        grounds:
          - entities.Depot.fields.committed_capacity_kw
          - endpoints.POST_/evfleet/depots
        distinguishing_aspect: "committed_capacity_kw is computed, starts at exactly 0 on creation, and a client-supplied committed_capacity_kw would be ignored."
        test_recipe:
          setup:
            - "Logical clock set; customer exists."
          setup_api_calls:
            - *c_clock
            - *c_cust
          trigger:
            - &c_depot
              call: "POST /evfleet/depots"
              payload: { fleet_customer_id: "${cust_id}", name: "Acme Depot CA", state_code: "CA", address: "1 Depot Way", total_capacity_kw: 500 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { depot_id: $.data.id, committed0: $.data.committed_capacity_kw, depot_v: $.data.version }
          assert:
            - "status 201; committed0 == 0"
            - "Depot.${depot_id}.fleet_customer_id == ${cust_id} and depot_v == 1"

      - name: vehicle_readback_shows_system_defaults
        claim_type: Retrieval
        grounds:
          - entities.Vehicle.fields.current_soh_pct
          - entities.Vehicle.fields.software_version
          - endpoints.GET_/evfleet/vehicles/{id}
        distinguishing_aspect: "A freshly registered vehicle reads back with delivery ASSEMBLED, telematics OFFLINE, software_version 1.0.0, current_soh_pct 100.0, battery_eol_status NONE, software_hold false — all system defaults, none client-supplied."
        test_recipe:
          setup:
            - "Base chain: customer, CA depot, supplier, PASSED module, order quantity 2 CONFIRMED, one VIN registered."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - &c_sup
              call: "POST /evfleet/suppliers"
              payload: { name: "VoltCore", contact_email: "s@voltcore.test" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { sup_id: $.data.id }
            - &c_mod1
              call: "POST /evfleet/battery-modules"
              payload: { supplier_id: "${sup_id}", module_serial: "M-001", pack_kwh: 77 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { mod1_id: $.data.id }
            - &c_mod1_qa
              call: "POST /evfleet/battery-modules/${mod1_id}/transition"
              payload: { to_state: "IN_QA" }
              as: QualityInspector
              as_user_id: "qi-1"
            - &c_mod1_pass
              call: "POST /evfleet/battery-modules/${mod1_id}/transition"
              payload: { to_state: "PASSED" }
              as: QualityInspector
              as_user_id: "qi-1"
            - &c_mod2
              call: "POST /evfleet/battery-modules"
              payload: { supplier_id: "${sup_id}", module_serial: "M-002", pack_kwh: 77 }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { mod2_id: $.data.id }
            - &c_mod2_qa
              call: "POST /evfleet/battery-modules/${mod2_id}/transition"
              payload: { to_state: "IN_QA" }
              as: QualityInspector
              as_user_id: "qi-1"
            - &c_mod2_pass
              call: "POST /evfleet/battery-modules/${mod2_id}/transition"
              payload: { to_state: "PASSED" }
              as: QualityInspector
              as_user_id: "qi-1"
            - &c_order
              call: "POST /evfleet/vehicle-orders"
              payload: { fleet_customer_id: "${cust_id}", depot_id: "${depot_id}", battery_supplier_id: "${sup_id}", quantity: 2, battery_pack_kwh: 77, telematics_tier: "STANDARD", delivery_method: "DIRECT_DELIVERY", requires_depot_charging: false }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - &c_submit
              call: "POST /evfleet/vehicle-orders/${ord_id}/transition"
              payload: { to_state: "SUBMITTED" }
              as: FleetManager
              as_user_id: "${cust_id}"
            - &c_confirm
              call: "POST /evfleet/vehicle-orders/${ord_id}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ord_v: $.data.version }
            - &c_veh1
              call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord_id}", battery_module_id: "${mod1_id}", vin: "VIN-ACME-001", expected_vehicle_order_version: "${ord_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { veh1_id: $.data.id }
            - &c_read1
              call: "GET /evfleet/vehicle-orders/${ord_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { ord_v3: $.data.version }
            - &c_veh2
              call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord_id}", battery_module_id: "${mod2_id}", vin: "VIN-ACME-002", expected_vehicle_order_version: "${ord_v3}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { veh2_id: $.data.id }
          trigger:
            - call: "GET /evfleet/vehicles/${veh1_id}"
              payload: {}
              as: ServiceDispatcher
              as_user_id: "sd-1"
              captures: { d_stat: $.data.delivery_status, t_stat: $.data.telematics_status, sw: $.data.software_version, soh: $.data.current_soh_pct, eol: $.data.battery_eol_status, hold: $.data.software_hold }
          assert:
            - "d_stat == ASSEMBLED and t_stat == OFFLINE (parallel dimensions start independently)"
            - "sw == \"1.0.0\" and soh == 100.0 and eol == NONE and hold == false"
            - "Vehicle.${veh1_id}.vehicle_order_id == ${ord_id} and battery_module_id == ${mod1_id}"

      - name: vehicle_orders_list_filters_by_fk_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/evfleet/vehicle-orders
          - response_envelope.pagination_fields
        distinguishing_aspect: "Flat-topology FK filtering: fleet_customer_id and depot_id filters each select exactly the matching orders, and limit=1 pages with total_count 2 / has_more true then false."
        test_recipe:
          setup:
            - "Customer with one CA depot; two DRAFT orders placed on that depot."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
            - *c_order
            - call: "POST /evfleet/vehicle-orders"
              payload: { fleet_customer_id: "${cust_id}", depot_id: "${depot_id}", battery_supplier_id: "${sup_id}", quantity: 1, battery_pack_kwh: 52, telematics_tier: "ADVANCED", delivery_method: "CUSTOMER_PICKUP", requires_depot_charging: false }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { ord_b_id: $.data.id }
          trigger:
            - call: "GET /evfleet/vehicle-orders"
              payload: { fleet_customer_id: "${cust_id}", limit: 1, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "first page returns exactly 1 row with total_count == 2 and has_more == true"
            - "GET /evfleet/vehicle-orders?fleet_customer_id=${cust_id}&limit=1&offset=1 returns 1 row with has_more == false"
            - "GET /evfleet/vehicle-orders?depot_id=${depot_id} returns 2 rows"
            - "GET /evfleet/vehicle-orders?battery_supplier_id=${sup_id} returns 2 rows"
            - "GET /evfleet/vehicle-orders with no filters returns 2 rows with limit defaulting to 10 and offset 0"

      - name: depot_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/evfleet/depots/{id}
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "A syntactically valid but unallocated UUID in the depot path yields 404 ERR_NOT_FOUND, not 400 and not an empty object."
        test_recipe:
          setup:
            - "Logical clock set; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /evfleet/depots/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "status 404 and err == ERR_NOT_FOUND"
            - "response_type == error and data.message is non-empty"

      - name: depot_create_missing_required_state_code_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Depot.fields.state_code
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting the required state_code on depot creation is a 400 ERR_VALIDATION; no depot row is persisted."
        test_recipe:
          setup:
            - "Logical clock set; customer exists."
          setup_api_calls:
            - *c_clock
            - *c_cust
          trigger:
            - call: "POST /evfleet/depots"
              payload: { fleet_customer_id: "${cust_id}", name: "Broken Depot", address: "2 Nowhere", total_capacity_kw: 100 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 400 and err == ERR_VALIDATION"
            - "GET /evfleet/fleet-customers/${cust_id}/depots returns 0 rows"

      - name: vehicle_order_invalid_pack_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.VehicleOrder.fields.battery_pack_kwh
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "battery_pack_kwh outside the declared enum {52, 77} is rejected with 400 ERR_VALIDATION at creation."
        test_recipe:
          setup:
            - "Logical clock set; customer, depot, supplier exist."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
          trigger:
            - call: "POST /evfleet/vehicle-orders"
              payload: { fleet_customer_id: "${cust_id}", depot_id: "${depot_id}", battery_supplier_id: "${sup_id}", quantity: 2, battery_pack_kwh: 99, telematics_tier: "STANDARD", delivery_method: "DIRECT_DELIVERY", requires_depot_charging: false }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "status 400 and err == ERR_VALIDATION"
            - "GET /evfleet/vehicle-orders?fleet_customer_id=${cust_id} returns 0 rows"

      - name: depot_create_extra_field_ignored
        claim_type: System Fields
        grounds:
          - entities.Depot
          - response_envelope
        distinguishing_aspect: "Client-supplied system fields (version, committed_capacity_kw) in a create body are ignored: the created depot still has version 1 and committed 0."
        test_recipe:
          setup:
            - "Logical clock set; customer exists."
          setup_api_calls:
            - *c_clock
            - *c_cust
          trigger:
            - call: "POST /evfleet/depots"
              payload: { fleet_customer_id: "${cust_id}", name: "Sneaky Depot", state_code: "NV", address: "9 Side St", total_capacity_kw: 300, version: 99, committed_capacity_kw: 250 }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { d_v: $.data.version, d_c: $.data.committed_capacity_kw }
          assert:
            - "status 201 with d_v == 1 and d_c == 0 (client input for system/computed fields ignored)"

      - name: battery_module_create_defaults_registered_with_zero_failures
        claim_type: Defaults
        grounds:
          - entities.BatteryModule.fields.quality_status
          - entities.BatteryModule.fields.failure_count
        distinguishing_aspect: "A registered module starts REGISTERED with failure_count 0, null last_inspector_user_id, and registered_by_user_id copied from X-User-ID."
        test_recipe:
          setup:
            - "Logical clock set; supplier exists."
          setup_api_calls:
            - *c_clock
            - *c_sup
          trigger:
            - *c_mod1
          assert:
            - "BatteryModule.${mod1_id}.quality_status == REGISTERED and failure_count == 0"
            - "BatteryModule.${mod1_id}.last_inspector_user_id is null"
            - "BatteryModule.${mod1_id}.registered_by_user_id == \"pp-1\" (captured from X-User-ID)"

      - name: depot_create_with_unknown_customer_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Depot.fields.fleet_customer_id
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Flat-topology FK integrity: a depot body referencing a nonexistent fleet_customer_id is a 404 ERR_NOT_FOUND, and nothing is persisted."
        test_recipe:
          setup:
            - "Logical clock set; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /evfleet/depots"
              payload: { fleet_customer_id: "99999999-8888-7777-6666-555555555555", name: "Ghost Depot", state_code: "CA", address: "0 Null Ave", total_capacity_kw: 100 }
              as: FleetManager
              as_user_id: "99999999-8888-7777-6666-555555555555"
              captures: { err: $.data.error_id }
          assert:
            - "status 404 and err == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: charging_project_starts_in_survey
        claim_type: Initial State
        grounds:
          - state_machines.ChargingProject
          - endpoints.POST_/evfleet/charging-projects
        distinguishing_aspect: "A created charging project is in SURVEY with null utility_denial_reason and null commissioned_capacity_kw, and its creation already committed its requested kW to the depot."
        test_recipe:
          setup:
            - "Logical clock set; customer and depot (500 kW) exist."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
          trigger:
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_id}", requested_capacity_kw: 40, install_window_start: "2026-10-01T00:00:00Z", install_window_end: "2026-10-10T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { cp_id: $.data.id, cp_status: $.data.status }
          assert:
            - "cp_status == SURVEY"
            - "ChargingProject.${cp_id}.utility_denial_reason is null and commissioned_capacity_kw is null"
            - "GET /evfleet/depots/${depot_id} shows committed_capacity_kw == 40 (SURVEY commits)"

      - name: charging_project_redesign_cycle_records_and_clears_reason
        claim_type: Valid Transition
        grounds:
          - state_machines.ChargingProject.UTILITY_REVIEW_to_REDESIGN
          - state_machines.ChargingProject.REDESIGN_to_UTILITY_REVIEW
        distinguishing_aspect: "The utility-denial loop is legal and reversible: UTILITY_REVIEW -> REDESIGN records the denial reason, and REDESIGN -> UTILITY_REVIEW clears it (cyclic shape on ChargingProject)."
        test_recipe:
          setup:
            - "Logical clock set; customer, depot, project P (40 kW) advanced SURVEY -> UTILITY_REVIEW."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_id}", requested_capacity_kw: 40, install_window_start: "2026-10-01T00:00:00Z", install_window_end: "2026-10-10T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { cp_id: $.data.id }
            - call: "POST /evfleet/charging-projects/${cp_id}/transition"
              payload: { to_state: "UTILITY_REVIEW" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
          trigger:
            - call: "POST /evfleet/charging-projects/${cp_id}/transition"
              payload: { to_state: "REDESIGN", utility_denial_reason: "Feeder capacity exhausted until Q2" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
              captures: { st1: $.data.status, reason1: $.data.utility_denial_reason }
            - call: "POST /evfleet/charging-projects/${cp_id}/transition"
              payload: { to_state: "UTILITY_REVIEW" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
              captures: { st2: $.data.status, reason2: $.data.utility_denial_reason }
          assert:
            - "st1 == REDESIGN and reason1 == \"Feeder capacity exhausted until Q2\""
            - "st2 == UTILITY_REVIEW and reason2 is null (redesign loop cleared the denial)"

      - name: charging_project_cancel_from_commissioned_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ChargingProject
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: "COMMISSIONED is terminal: a cancel attempt on a commissioned project returns 409 ERR_ALREADY_TERMINAL and the depot's committed capacity is untouched."
        test_recipe:
          setup:
            - "Logical clock set; customer, depot (500 kW); project P (40 kW) driven SURVEY -> UTILITY_REVIEW -> PERMITTING -> INSTALLATION -> COMMISSIONED."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - call: "POST /evfleet/charging-projects"
              payload: { depot_id: "${depot_id}", requested_capacity_kw: 40, install_window_start: "2026-10-01T00:00:00Z", install_window_end: "2026-10-10T00:00:00Z", crew_count: 1, expected_depot_version: "${depot_v}" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { cp_id: $.data.id }
            - call: "POST /evfleet/charging-projects/${cp_id}/transition"
              payload: { to_state: "UTILITY_REVIEW" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/charging-projects/${cp_id}/transition"
              payload: { to_state: "PERMITTING" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/charging-projects/${cp_id}/transition"
              payload: { to_state: "INSTALLATION" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
            - call: "POST /evfleet/charging-projects/${cp_id}/transition"
              payload: { to_state: "COMMISSIONED" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
          trigger:
            - call: "POST /evfleet/charging-projects/${cp_id}/transition"
              payload: { to_state: "CANCELLED" }
              as: ChargingCoordinator
              as_user_id: "cc-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ALREADY_TERMINAL with status 409"
            - "ChargingProject.${cp_id}.status == COMMISSIONED and commissioned_capacity_kw == 40"
            - "GET /evfleet/depots/${depot_id} still shows committed_capacity_kw == 40"

      - name: order_confirm_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.VehicleOrder
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: state_beats_franchise_safety_on_order_review
          rationale: "DRAFT -> CONFIRMED rejection with ERR_INVALID_STATE is the first trigger of that §1.8 priority-conflict instance."

      - name: order_auto_fulfills_when_quantity_registered
        claim_type: Side Effect Execution
        grounds:
          - state_machines.VehicleOrder.IN_PRODUCTION_to_FULFILLED
          - entities.VehicleOrder.fields.registered_count
        distinguishing_aspect: "Bubble-up auto-transitions: registering the single VIN of a quantity-1 order walks it CONFIRMED -> IN_PRODUCTION -> FULFILLED inside the same POST /vehicles response."
        test_recipe:
          setup:
            - "Logical clock set; customer, CA depot, supplier, PASSED module; order quantity 1 CONFIRMED."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
            - *c_mod1
            - *c_mod1_qa
            - *c_mod1_pass
            - call: "POST /evfleet/vehicle-orders"
              payload: { fleet_customer_id: "${cust_id}", depot_id: "${depot_id}", battery_supplier_id: "${sup_id}", quantity: 1, battery_pack_kwh: 77, telematics_tier: "STANDARD", delivery_method: "DIRECT_DELIVERY", requires_depot_charging: false }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { ord1_id: $.data.id }
            - call: "POST /evfleet/vehicle-orders/${ord1_id}/transition"
              payload: { to_state: "SUBMITTED" }
              as: FleetManager
              as_user_id: "${cust_id}"
            - call: "POST /evfleet/vehicle-orders/${ord1_id}/transition"
              payload: { to_state: "CONFIRMED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ord1_v: $.data.version }
          trigger:
            - call: "POST /evfleet/vehicles"
              payload: { vehicle_order_id: "${ord1_id}", battery_module_id: "${mod1_id}", vin: "VIN-ACME-301", expected_vehicle_order_version: "${ord1_v}" }
              as: ProductionPlanner
              as_user_id: "pp-1"
            - call: "GET /evfleet/vehicle-orders/${ord1_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-1"
              captures: { o_status: $.data.status, o_count: $.data.registered_count }
          assert:
            - "o_status == FULFILLED (first VIN flipped CONFIRMED -> IN_PRODUCTION, and registered_count == quantity flipped IN_PRODUCTION -> FULFILLED)"
            - "o_count == 1"

      - name: order_cancel_from_confirmed_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.VehicleOrder
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Cancellation closes once the order is CONFIRMED: a FleetManager cancel on a CONFIRMED order returns ERR_INVALID_STATE and the order stays CONFIRMED."
        test_recipe:
          setup:
            - "Logical clock set; base order (quantity 2) CONFIRMED."
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_depot
            - *c_sup
            - *c_order
            - *c_submit
            - *c_confirm
          trigger:
            - call: "POST /evfleet/vehicle-orders/${ord_id}/transition"
              payload: { to_state: "CANCELLED" }
              as: FleetManager
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (CANCELLED is only offered from DRAFT / SUBMITTED / FRANCHISE_HOLD)"
