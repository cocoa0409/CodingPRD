      - name: kiln_firing_window_temporal_conflict_is_covered_by_the_difficulty_design
        claim_type: temporal_validation
        grounds:
          - validations[priority=38]
        excluded_because:
          difficulty_instance: kiln_firing_window_closed_interval_with_cooldown_buffer_collides_on_touch
          rationale: "A booking that is legal against the raw window but illegal once the cooldown buffer inflates it - detected only when a later request arrives - is exactly the temporal pattern, and that instance also proves an ABORTED window stops blocking."

      - name: kiln_car_occupancy_temporal_conflict_is_covered_by_the_difficulty_design
        claim_type: temporal_validation
        grounds:
          - validations[priority=39]
        excluded_because:
          difficulty_instance: kiln_car_occupancy_half_open_interval_allows_exact_adjacency
          rationale: "The second temporal rule uses the opposite interval convention on the same pair of timestamps, and that instance asserts exact adjacency is allowed for cars while it collides for kilns."

      - name: formulation_qualification_cross_entity_gate_is_covered_by_the_difficulty_design
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=28]
        excluded_because:
          difficulty_instance: production_run_and_kiln_run_creation_require_qualified_formulation
          rationale: "Validity depending on another entity's state - and the same formulation flipping the answer for two different endpoints as it moves DRAFT -> QUALIFIED -> DRAFT - is asserted there in both directions."

      - name: panel_expiry_cross_entity_gate_is_covered_by_the_difficulty_design
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=23]
        excluded_because:
          difficulty_instance: blend_certify_blocked_by_expired_panel_approval_despite_approved_status
          rationale: "That instance drives the logical clock across expires_at so the SamplePanel is still APPROVED yet no longer usable, which is the cross-entity-plus-temporal case for certify."

