      - name: restock_blocked_until_damage_claim_leaves_open_states
        grounds:
          - "1.4 validation priority 22 ERR_OPEN_CLAIM_BLOCKS_RESTOCK"
          - "1.2 ReverseLogisticsJob PHOTOGRAPHED to RESTOCKED precondition on DamageClaim state"
          - "1.2 DamageClaim OPEN to ASSESSED to CHARGED"
          - "1.5 POST /reverse-logistics-jobs/{job_id}/restock, POST /damage-claims/{claim_id}/assessment, POST /damage-claims/{claim_id}/charge"
          - "1.1 RentalUnit.availability_state and Reservation state CLOSED"
        distinguishing_aspect: >-
          The entity pair is ReverseLogisticsJob and DamageClaim: the job is fully reconditioned and sitting in
          PHOTOGRAPHED, so every one of its own preconditions is satisfied, and the only thing stopping the restock is
          the state of a different entity. The same restock call is refused twice - once while the claim is OPEN and
          once while it is ASSESSED, which proves the blocking set is a set of states and not merely the initial one -
          and succeeds unchanged the moment the claim reaches CHARGED. An implementation that only checks for OPEN
          passes the first refusal and fails the second.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "plan SIG4, two certified technicians, style AUR-GOWN-01 and one grade-A size-M unit"
            - "member on SIG4 with waiver_active false"
            - "one turn is completed to inbound receipt (received 2026-08-18) and inspected NONE soil / MODERATE damage / condition_grade_after B, which opens a DamageClaim and requires only the repair leg"
            - "the repair is signed off ACCEPTED by the second technician, so the unit returns to condition_state FLOOR_READY, and the photography sign-off moves the job to PHOTOGRAPHED"
            - "the claim id is read from the claim list filtered by the reservation before the triggers run"
