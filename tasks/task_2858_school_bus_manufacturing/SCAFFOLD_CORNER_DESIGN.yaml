              captures: { posture_after_advance: $.data.delivery_posture, ld_after_advance: $.data.liquidated_damages_cents, at_risk_after_advance: $.data.at_risk_unit_count }
            - call: "POST /build-slots/${slot_id}/release"
              payload: {}
              as: PlantScheduler
              as_user_id: "plant-01"
            - call: "GET /contract-orders/${order_id}"
              payload: {}
              as: PlantScheduler
              as_user_id: "plant-01"
