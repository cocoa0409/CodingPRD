# ===========================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2623 - Brand Safety & Ad Verification Operations
#
# Breadth walk of references/claim-extraction-guide.md against this
# scaffold's SCAFFOLD.yaml sections 1.1-1.7. Every `section:` value below is
# one of the guide's nine sections and every `claim_type:` is one of that
# section's table rows. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as `excluded_because:` stubs
# naming the covering instance.
#
# Conventions shared with 1.8:
#   * the logical clock is always positioned explicitly with
#     POST /_clock/set_current_utc before anything time-sensitive;
#   * MethodologyVersions are authored by "auditor-1" and concluded by
#     "auditor-2" so validation priority 11 (audit segregation of duties) can
#     never fire accidentally;
#   * classifications are created by "analyst-1" and reviewed by "analyst-2",
#     appeals decided by "officer-1", so validation priority 10 (appeal
#     segregation of duties) can never fire accidentally;
#   * every numeric assertion was produced by executing the referenced
#     calculations[].formula with its declared constants (Decimal,
#     ROUND_HALF_UP) and is written as a literal;
#   * calls that are expected to fail capture `$.data.error_id` so the
#     intended polarity of the call is unambiguous.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  # From Table 1 (Entities)
  # =========================================================================
  - section: entities
    instances:

      - name: create_publisher_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Publisher.fields.sourced_traffic_pct
          - entities.Publisher.fields.publisher_status
          - entities.Publisher.fields.status_reason
          - entities.Publisher.fields.credit_issued_cents_total
          - endpoints.POST_/publishers
        distinguishing_aspect: |
          POST /publishers carries exactly one optional input
          (sourced_traffic_pct); omitting it must yield the declared default
          0.0 rather than null, and all eight system/computed fields must be
          seeded (publisher_status ACTIVE, status_reason null, five counters
          at 0, credit_issued_cents_total 0) with version 1.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /publishers"
              payload: { name: "Lumen Sports Network", primary_domain: "lumen.example.com" }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object with meta.api_request_id and meta.api_request_timestamp present"
            - "Publisher.${pub_id}.sourced_traffic_pct == 0.0 (declared default, not null)"
            - "Publisher.${pub_id}.publisher_status == ACTIVE and status_reason == null"
            - "Publisher.${pub_id}.mfa_page_count == 0 and quarantined_batch_count == 0 and certified_batch_count == 0"
            - "Publisher.${pub_id}.decided_appeal_count == 0 and overturned_appeal_count == 0"
            - "Publisher.${pub_id}.credit_issued_cents_total == 0"
            - "Publisher.${pub_id}.version == 1 and created_at == updated_at == 2026-08-10T00:00:00.000Z"

      - name: create_campaign_returns_every_declared_field_with_unknown_coverage
        claim_type: creation
        grounds:
          - entities.Campaign
          - endpoints.POST_/campaigns
          - calculations.campaign_coverage_status
        distinguishing_aspect: |
          A brand-new Campaign has no certified batch, so
          campaign_coverage_status must return its empty-evidence branch
          UNKNOWN - not the BELOW_TARGET a naive 0/0 comparison would
          produce - and target_coverage_rate must default to 0.75.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one Advertiser."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q4 Video", cpm_cents: 1200, min_suitability_tier: "LOW_RISK", format: "VIDEO" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
          assert:
            - "HTTP 201; Campaign.${camp_id}.advertiser_id == ${adv_id}, cpm_cents == 1200, min_suitability_tier == LOW_RISK, format == VIDEO"
            - "Campaign.${camp_id}.target_coverage_rate == 0.75 (declared default)"
            - "Campaign.${camp_id}.status == ACTIVE"
            - "Campaign.${camp_id}.coverage_status == UNKNOWN (certified_measured_impressions == 0 branch, NOT BELOW_TARGET)"
            - "Campaign.${camp_id}.certified_measured_impressions == 0 and certified_measurable_impressions == 0 and open_claim_count == 0"
            - "Campaign.${camp_id}.version == 1"

      - name: get_page_classification_returns_the_stored_computed_record
        claim_type: retrieval
        grounds:
          - endpoints.GET_/page-classifications/{id}
          - entities.PageClassification
          - calculations.mfa_score
          - calculations.page_suitability_tier
        distinguishing_aspect: |
          The read-back of a PageClassification must expose the four computed
          scoring fields exactly as the create call computed them
          (mfa_score 13.50, mfa_flag false, base_risk_points 0.00,
          adjusted_risk_points 0.00, assigned_tier SAFE) plus the system
          identity fields (classifier_user_id stamped, reviewed_by_user_id
          still null while review_state is PENDING_REVIEW).
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; publisher with sourced_traffic_pct 0.40; a SUITABILITY methodology version; one page classified MODEL over category GENERAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/sports" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id, page_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_id: $.data.id }
          trigger:
            - call: "GET /page-classifications/${cls_id}"
              payload: {}
              as: ClassificationAnalyst
              as_user_id: "analyst-3"
          assert:
            - "HTTP 200; response page_id == ${page_id} and methodology_version_id == ${mv_suit_id}"
            - "response classifier_kind == MODEL, category_codes == [GENERAL], model_confidence == 0.95"
            - "response mfa_score == 13.50 (4.00 density + 0.00 refresh + 8.00 sourced + 1.50 originality) and mfa_flag == false"
            - "response base_risk_points == 0.00, adjusted_risk_points == 0.00, assigned_tier == SAFE"
            - "response review_state == PENDING_REVIEW, classifier_user_id == analyst-1, reviewed_by_user_id == null, review_note == null"
            - "response version == 1 and created_at == 2026-08-10T00:00:00.000Z"

      - name: get_measurement_batch_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/measurement-batches/{id}
          - validations.priority_4
          - errors[ERR_MEASUREMENT_BATCH_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid UUID that names no stored MeasurementBatch
          must resolve to the entity-specific 404 (ERR_MEASUREMENT_BATCH_NOT_FOUND),
          not a generic 404 and not ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; no MeasurementBatch exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /measurement-batches/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { err_nf: $.data.error_id }
          assert:
            - "HTTP 404 and response_type == error"
            - "${err_nf} == ERR_MEASUREMENT_BATCH_NOT_FOUND"
            - "data.message is a non-empty string and no `data.id` field is present"

      - name: list_measurement_batches_paginates_and_filters_by_scoring_status
        claim_type: listing
        grounds:
          - endpoints.GET_/measurement-batches
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three batches exist on one page; exactly one is scored. The
          scoring_status filter must partition them 2/1, total_count must
          report the filtered population (not the table count), and has_more
          must be driven by limit+offset against that filtered total.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; advertiser, publisher, both methodology families, one DISPLAY campaign, one classified page."
            - "Three INGESTED batches on the same (campaign, page, DISPLAY) key with windows one hour apart, well clear of BATCH_WINDOW_BUFFER_SECONDS (60)."
            - "The first batch is scored, leaving two INGESTED and one SCORED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/sports" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id, page_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_id: $.data.id }
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 9000, in_view_impressions: 9000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_1_id: $.data.id }
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T02:00:00Z", window_end: "2026-08-01T03:00:00Z", measured_impressions: 20000, measurable_impressions: 18000, in_view_impressions: 18000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_2_id: $.data.id }
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T04:00:00Z", window_end: "2026-08-01T05:00:00Z", measured_impressions: 30000, measurable_impressions: 27000, in_view_impressions: 27000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_3_id: $.data.id }
            - call: "POST /measurement-batches/${batch_1_id}/score"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
          trigger:
            - call: "GET /measurement-batches"
              payload: { campaign_id: "${camp_id}", scoring_status: "INGESTED", limit: 1, offset: 0 }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "GET /measurement-batches"
              payload: { campaign_id: "${camp_id}", scoring_status: "INGESTED", limit: 1, offset: 1 }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "GET /measurement-batches"
              payload: { campaign_id: "${camp_id}", scoring_status: "SCORED" }
              as: Advertiser
              as_user_id: "${adv_id}"
          assert:
            - "First trigger: HTTP 200, response_type == array, exactly 1 element, total_count == 2, limit == 1, offset == 0, has_more == true"
            - "Second trigger: exactly 1 element, total_count == 2, offset == 1, has_more == false"
            - "The two INGESTED elements across the two pages are ${batch_2_id} and ${batch_3_id} with no duplicate between pages"
            - "Third trigger: exactly 1 element == ${batch_1_id}, total_count == 1, limit == 10 (pagination default), offset == 0, has_more == false"
            - "No element of any response carries scoring_status other than the requested filter value"

      - name: create_campaign_without_cpm_cents_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_/campaigns
          - entities.Campaign.fields.cpm_cents
          - validations.priority_6
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          cpm_cents is `source: input` with no default, so omitting it is a
          request-shape violation (422 ERR_INVALID_REQUEST) rather than a
          silent 0 that would make every downstream credit computation zero.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one Advertiser."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_req: $.data.error_id }
          assert:
            - "HTTP 422 and ${err_req} == ERR_INVALID_REQUEST"
            - "GET /campaigns filtered by advertiser_id == ${adv_id} returns total_count == 0 (no partial Campaign was created)"

      - name: list_entry_action_and_specificity_rank_are_computed_from_parent_and_type
        claim_type: computed_fields
        grounds:
          - entities.ListEntry.fields.action
          - entities.ListEntry.fields.specificity_rank
          - endpoints.POST_/inventory-lists/{id}/entries
          - calculations.pre_bid_placement_decision.constants.SPECIFICITY_RANK
        distinguishing_aspect: |
          `action` is never an input: it is derived from the PARENT list's
          list_type (INCLUSION -> ALLOW, EXCLUSION -> BLOCK), while
          `specificity_rank` is derived from the entry's OWN entry_type
          (PAGE_URL 4, DOMAIN 3, PUBLISHER 2, CATEGORY 1). Two entries with
          identical entry_type therefore get opposite actions when they sit in
          lists of opposite type, and entry_count on each parent tracks its
          own children only.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one Advertiser, one Publisher, one DRAFT EXCLUSION list and one DRAFT INCLUSION list of the same advertiser."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "EXCLUSION", name: "Q3 blocks" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { excl_list_id: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "INCLUSION", name: "Q3 allows" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { incl_list_id: $.data.id }
          trigger:
            - call: "POST /inventory-lists/${excl_list_id}/entries"
              payload: { entry_type: "PAGE_URL", entry_value: "https://beacon.example.com/casino-odds" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { e_url_id: $.data.id }
            - call: "POST /inventory-lists/${excl_list_id}/entries"
              payload: { entry_type: "DOMAIN", entry_value: "beacon.example.com" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { e_dom_id: $.data.id }
            - call: "POST /inventory-lists/${excl_list_id}/entries"
              payload: { entry_type: "PUBLISHER", entry_value: "${pub_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { e_pub_id: $.data.id }
            - call: "POST /inventory-lists/${incl_list_id}/entries"
              payload: { entry_type: "CATEGORY", entry_value: "GAMBLING" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { e_cat_id: $.data.id }
          assert:
            - "ListEntry.${e_url_id}.action == BLOCK and specificity_rank == 4"
            - "ListEntry.${e_dom_id}.action == BLOCK and specificity_rank == 3"
            - "ListEntry.${e_pub_id}.action == BLOCK and specificity_rank == 2"
            - "ListEntry.${e_cat_id}.action == ALLOW and specificity_rank == 1 (same request shape, opposite action, because the parent list_type is INCLUSION)"
            - "InventoryList.${excl_list_id}.entry_count == 3 and InventoryList.${incl_list_id}.entry_count == 1"
            - "Both lists are still status == DRAFT (adding entries never publishes)"

      - name: measurement_batch_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.MeasurementBatch.fields.scoring_status
          - entities.MeasurementBatch.fields.settlement_status
          - entities.MeasurementBatch.fields.coverage_rate
          - endpoints.POST_/measurement-batches
        distinguishing_aspect: |
          Every system/computed field supplied by the client on intake
          (id, version, scoring_status, settlement_status, coverage_rate,
          created_at) must be discarded: the batch is minted with a fresh
          server UUID, version 1, the two declared initial states, and null
          coverage_rate until scoring runs. A client cannot pre-certify a
          batch by asserting its status on the wire.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; advertiser, publisher, both methodology families, DISPLAY campaign, classified page."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/sports" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id }
          trigger:
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 9000, in_view_impressions: 9000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6, id: "11111111-1111-4111-8111-111111111111", version: 99, scoring_status: "CERTIFIED", settlement_status: "CREDITED", coverage_rate: 0.99, created_at: "2020-01-01T00:00:00Z" }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_id: $.data.id }
          assert:
            - "HTTP 201; ${batch_id} != 11111111-1111-4111-8111-111111111111 (server-minted UUID, no type prefix)"
            - "MeasurementBatch.${batch_id}.version == 1 and created_at == 2026-08-10T00:00:00.000Z (the 2020 value is ignored)"
            - "MeasurementBatch.${batch_id}.scoring_status == INGESTED and settlement_status == UNBILLED"
            - "MeasurementBatch.${batch_id}.coverage_rate == null and viewability_rate == null and qualified_in_view_impressions == 0"
            - "Publisher.${pub_id}.certified_batch_count == 0 and Campaign.${camp_id}.certified_measured_impressions == 0 (no certification side effect fired)"

      - name: list_entry_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.ListEntry.common_fields_false
          - endpoints.GET_/inventory-lists/{id}/entries
        distinguishing_aspect: |
          ListEntry is the scaffold's only `common_fields: false` entity: its
          read projection carries id and created_at but neither updated_at nor
          version, and §1.5 declares no PUT/PATCH/DELETE on entries. Removing
          a target from a list is modelled as a new list, never as mutation of
          a published entry.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one Advertiser with one EXCLUSION list holding two entries."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "EXCLUSION", name: "Q3 blocks" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { excl_list_id: $.data.id }
            - call: "POST /inventory-lists/${excl_list_id}/entries"
              payload: { entry_type: "DOMAIN", entry_value: "spam.example.com" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { e1_id: $.data.id, e1_created: $.data.created_at }
            - call: "POST /inventory-lists/${excl_list_id}/entries"
              payload: { entry_type: "CATEGORY", entry_value: "ADULT" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { e2_id: $.data.id }
          trigger:
            - call: "GET /inventory-lists/${excl_list_id}/entries"
              payload: { limit: 10, offset: 0 }
              as: Advertiser
              as_user_id: "${adv_id}"
          assert:
            - "HTTP 200, total_count == 2, has_more == false"
            - "Each element carries exactly the keys id, created_at, list_id, entry_type, entry_value, action, specificity_rank"
            - "No element carries a `version` key and no element carries an `updated_at` key"
            - "Element ${e1_id}.created_at == ${e1_created} == 2026-08-10T00:00:00.000Z and element ${e2_id} is the CATEGORY entry"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint whose path resolves a ListEntry"

      - name: create_entry_under_unknown_inventory_list_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ListEntry.parent
          - endpoints.POST_/inventory-lists/{id}/entries
          - validations.priority_4
          - errors[ERR_INVENTORY_LIST_NOT_FOUND]
        distinguishing_aspect: |
          ListEntry is the only entity with a declared `parent`, and it is
          addressed through the parent's sub-collection. A path id that names
          no InventoryList must fail with the parent's own 404 before any
          entry-shape validation runs, and must not mint an orphan entry.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one Advertiser owning one real list (so the collection is non-empty)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "EXCLUSION", name: "Q3 blocks" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { excl_list_id: $.data.id }
          trigger:
            - call: "POST /inventory-lists/00000000-0000-4000-8000-000000000000/entries"
              payload: { entry_type: "DOMAIN", entry_value: "spam.example.com" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_parent: $.data.error_id }
          assert:
            - "HTTP 404 and ${err_parent} == ERR_INVENTORY_LIST_NOT_FOUND"
            - "InventoryList.${excl_list_id}.entry_count == 0 (the real list was untouched)"
            - "GET /inventory-lists/${excl_list_id}/entries returns total_count == 0"

      - name: create_campaign_with_unknown_format_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Campaign.fields.format
          - entities.Publisher.fields.sourced_traffic_pct
          - entities.MethodologyVersion.fields.effective_to
          - validations.priority_6
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Three distinct shapes of type violation all land on the same 422:
          an out-of-set enum (format AUDIO), a numeric range breach
          (sourced_traffic_pct 1.5 against 0.0..1.0), and an ordering breach
          on a datetime pair (effective_to <= effective_from). None of them
          may be coerced to a nearest legal value.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; one Advertiser."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
          trigger:
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Audio", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "AUDIO" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /publishers"
              payload: { name: "Overclaim Media", primary_domain: "overclaim.example.com", sourced_traffic_pct: 1.5 }
              as: PlatformAdmin
              captures: { err_range: $.data.error_id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "IVT", version_code: "IVT-2026.1", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { err_window: $.data.error_id }
          assert:
            - "First trigger: HTTP 422 and ${err_enum} == ERR_INVALID_REQUEST (format is not one of DISPLAY, LARGE_DISPLAY, VIDEO)"
            - "Second trigger: HTTP 422 and ${err_range} == ERR_INVALID_REQUEST (sourced_traffic_pct outside 0.0..1.0, not clamped to 1.0)"
            - "Third trigger: HTTP 422 and ${err_window} == ERR_INVALID_REQUEST (effective_to must be strictly greater than effective_from)"
            - "GET /campaigns filtered by advertiser_id == ${adv_id} returns total_count == 0 and GET /methodology-versions filtered by standard_family IVT returns total_count == 0"

      - name: flat_topology_foreign_keys_are_validated_across_aggregates
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations.priority_5
          - validations.priority_22
          - errors[ERR_PUBLISHER_NOT_FOUND]
          - errors[ERR_PAGE_PUBLISHER_MISMATCH]
        distinguishing_aspect: |
          In a flat topology every link is a body FK, so integrity has two
          separate failure modes that must not be conflated: an id that
          resolves to nothing (404, priority 5) and a pair of ids that each
          resolve but do not belong together (409 ERR_PAGE_PUBLISHER_MISMATCH,
          priority 22). Passing an Advertiser id where a Publisher id is
          expected takes the first path even though the value is a real UUID
          of another aggregate.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; two publishers, each with one page; one advertiser with a DISPLAY campaign; a VIEWABILITY methodology version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_a_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Harbor Press", primary_domain: "harbor.example.com", sourced_traffic_pct: 0.10 }
              as: PlatformAdmin
              captures: { pub_b_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_b_id}", url: "https://harbor.example.com/news" }
              as: PlatformAdmin
              captures: { page_b_id: $.data.id }
          trigger:
            - call: "POST /pages"
              payload: { publisher_id: "${adv_id}", url: "https://beacon.example.com/sports" }
              as: PlatformAdmin
              captures: { err_fk: $.data.error_id }
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_a_id}", page_id: "${page_b_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 9000, in_view_impressions: 9000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { err_pair: $.data.error_id }
          assert:
            - "First trigger: HTTP 404 and ${err_fk} == ERR_PUBLISHER_NOT_FOUND (an Advertiser UUID is not a Publisher, even though the value exists)"
            - "No Page with url https://beacon.example.com/sports exists afterwards: GET /pages filtered by publisher_id == ${pub_a_id} returns total_count == 0"
            - "Second trigger: HTTP 409 and ${err_pair} == ERR_PAGE_PUBLISHER_MISMATCH (both ids resolve; page ${page_b_id} belongs to ${pub_b_id})"
            - "GET /measurement-batches filtered by campaign_id == ${camp_id} returns total_count == 0"

  # =========================================================================
  # From Table 2 (State Machines)
  # =========================================================================
  - section: state_machines
    instances:

      - name: certify_before_scoring_returns_invalid_batch_state
        claim_type: invalid_transition
        grounds:
          - state_machines.MeasurementBatch.scoring_status.SCORED_to_CERTIFIED
          - validations.priority_7
          - errors[ERR_INVALID_BATCH_STATE]
        distinguishing_aspect: |
          certify is declared only from SCORED. From INGESTED there is no
          certify edge at all, so the call must be refused with 409 before any
          coverage/ivt gate is evaluated - an implementation that scores
          implicitly inside certify would pass a certified batch that never
          had a scored_at stamp.
        test_recipe:
          setup:
            - "Clock 2026-08-10T00:00:00Z; advertiser, publisher, both methodology families, DISPLAY campaign, classified page, one INGESTED batch whose numbers would comfortably certify."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /publishers"
              payload: { name: "Beacon Digital", primary_domain: "beacon.example.com", sourced_traffic_pct: 0.40 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "SUITABILITY", version_code: "SUIT-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_suit_id: $.data.id }
            - call: "POST /methodology-versions"
              payload: { standard_family: "VIEWABILITY", version_code: "VIEW-2026.1", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", display_in_view_seconds: 1.0, display_pixel_pct: 0.5, coverage_rate_floor: 0.7, ivt_rate_ceiling: 0.02 }
              as: AccreditationAuditor
              as_user_id: "auditor-1"
              captures: { mv_view_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /pages"
              payload: { publisher_id: "${pub_id}", url: "https://beacon.example.com/sports" }
              as: Publisher
              as_user_id: "${pub_id}"
              captures: { page_id: $.data.id, page_ver: $.data.version }
            - call: "POST /page-classifications"
              payload: { page_id: "${page_id}", methodology_version_id: "${mv_suit_id}", expected_page_version: "${page_ver}", classifier_kind: "MODEL", category_codes: ["GENERAL"], model_confidence: 0.95, ad_density_ratio: 0.10, refresh_seconds: 0, originality_score: 90 }
              as: ClassificationAnalyst
              as_user_id: "analyst-1"
              captures: { cls_id: $.data.id }
            - call: "POST /measurement-batches"
              payload: { campaign_id: "${camp_id}", publisher_id: "${pub_id}", page_id: "${page_id}", methodology_version_id: "${mv_view_id}", format: "DISPLAY", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T01:00:00Z", measured_impressions: 10000, measurable_impressions: 9000, in_view_impressions: 9000, avg_in_view_seconds: 1.2, avg_in_view_pixel_pct: 0.6 }
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /measurement-batches/${batch_id}/certify"
              payload: {}
              as: MeasurementOperator
              as_user_id: "op-1"
              captures: { err_state: $.data.error_id }
          assert:
            - "HTTP 409 and ${err_state} == ERR_INVALID_BATCH_STATE"
            - "MeasurementBatch.${batch_id}.scoring_status is still INGESTED and version is still 1 and scored_at == null"
            - "MeasurementBatch.${batch_id}.coverage_rate == null (no scoring was performed as a side effect of the refused certify)"
            - "Publisher.${pub_id}.certified_batch_count == 0 and quarantined_batch_count == 0"
            - "Campaign.${camp_id}.certified_measured_impressions == 0 and coverage_status == UNKNOWN"

      - name: scoring_the_same_batch_twice_is_refused_on_the_second_call
        claim_type: idempotency
        grounds:
          - state_machines.MeasurementBatch.scoring_status.INGESTED_to_SCORED
          - validations.priority_7
          - errors[ERR_INVALID_BATCH_STATE]
        distinguishing_aspect: |
          score is not idempotent-by-replay: the second call must be refused
          rather than silently recomputing. A recompute would be observable,
          because a CONFIRMED IvtFinding added between the two calls would
          change ivt_rate on a batch that is already SCORED and whose numbers
          downstream claims may already have quoted.
        test_recipe:
          setup:
            - "Same fixture as certify_before_scoring_returns_invalid_batch_state: one INGESTED batch (measured 10000, measurable 9000, in_view 9000, avg_in_view_seconds 1.2, avg_in_view_pixel_pct 0.6)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
