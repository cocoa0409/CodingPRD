  # ===========================================================================
  # Rule 4 — transitive_cascade (>= 2 instances, one depth >= 3, one depth >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: production_delay_three_hop_cascade_across_two_orders
        grounds:
          - state_machines.ProductionBatch.IN_PRODUCTION_to_DELAYED
          - state_machines.DeliveryEstimate.PROVISIONAL_to_SUPERSEDED
          - state_machines.DeliveryAppointment.CONFIRMED_to_AT_RISK
          - calculations.batch_delay_propagation
          - entities.VehicleOrder.fields.estimate_shift_days_cumulative
        distinguishing_aspect: "One batch delay reaches two orders through a strict three-hop chain — batch delay supersedes each order's estimate, the superseded estimate advances that order's accumulator, and the moved window is what pushes each CONFIRMED appointment to AT_RISK — with hop 3 caused by hop 2 rather than by the delay itself."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime with transport_lead_days 7; two delivery centers so the two orders occupy distinct sites"
            - "Two orders on the same batch: order E1 allocated to unit vin ...108 and order E2 to unit vin ...109, both arrived and both holding a CONFIRMED appointment whose slot was reserved while the estimates still read 2026-09-17 to 2026-09-24"
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_enact_tx
            - *k_center_tx
            - &k_center_tx2
              call: "POST /v1/delivery-centers"
              payload: { center_name: "Dallas Delivery", center_kind: "DELIVERY_CENTER", state_code: "TX", bay_count: 4, home_delivery_radius_miles: 50, van_count: 2 }
              as: PlatformAdmin
              captures: { center_tx2_id: $.data.id }
            - *k_cfg_y
            - *k_buyer_dv
            - *k_verify_dv
            - &k_buyer_e2
              call: "POST /v1/buyers"
              payload: { full_name: "Eli Cascade", email: "eli.cascade@example.com", residency_state_code: "TX" }
              as: Anonymous
              captures: { buyer_e2_id: $.data.id }
            - call: "POST /v1/buyers/${buyer_e2_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
            - *k_order_dv
            - call: "POST /v1/orders"
              payload: { buyer_id: "${buyer_e2_id}", configuration_id: "${cfg_y_id}", jurisdiction_id: "${jur_tx_id}", delivery_center_id: "${center_tx2_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { order_e2_id: $.data.id, order_e2_v: $.data.version }
            - *k_place_dv
            - call: "POST /v1/orders/${order_e2_id}/place"
              payload: { expected_order_version: "${order_e2_v}" }
              as: Buyer
              as_user_id: "${buyer_e2_id}"
              captures: { order_e2_v: $.data.version }
            - *k_pay_dv
            - call: "POST /v1/_payments/simulate"
              payload: { order_id: "${order_e2_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - *k_lock_dv
            - call: "POST /v1/orders/${order_e2_id}/lock-configuration"
              payload: { expected_order_version: "${order_e2_v}" }
              as: PlatformAdmin
              captures: { order_e2_v: $.data.version }
            - &k_batch_slip
              call: "POST /v1/production-batches"
              payload: { factory_code: "AUSTIN", model_code: "MODEL_Y_LR_AWD", unit_capacity: 3, planned_completion_at: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { batch_slip_id: $.data.id }
            - call: "POST /v1/production-batches/${batch_slip_id}/start"
              payload: {}
              as: PlatformAdmin
            - &k_unit_108
              call: "POST /v1/production-batches/${batch_slip_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000108" }
              as: PlatformAdmin
            - &k_unit_109
              call: "POST /v1/production-batches/${batch_slip_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000109" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/allocation"
              payload: { batch_id: "${batch_slip_id}", expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - call: "POST /v1/orders/${order_e2_id}/allocation"
              payload: { batch_id: "${batch_slip_id}", expected_order_version: "${order_e2_v}" }
              as: PlatformAdmin
              captures: { order_e2_v: $.data.version }
            - call: "POST /v1/orders/${order_dv_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_e2_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_e2_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/delivery-appointments"
              payload: { order_id: "${order_dv_id}", delivery_center_id: "${center_tx_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-18T15:00:00Z", scheduled_end: "2026-09-18T16:00:00Z", expected_order_version: "${order_dv_v}" }
              as: DeliveryAdvisor
              captures: { appt_e1_id: $.data.id, order_dv_v: $.data.version }
            - call: "POST /v1/delivery-appointments"
              payload: { order_id: "${order_e2_id}", delivery_center_id: "${center_tx2_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-18T15:00:00Z", scheduled_end: "2026-09-18T16:00:00Z", expected_order_version: "${order_e2_v}" }
              as: DeliveryAdvisor
              captures: { appt_e2_id: $.data.id, order_e2_v: $.data.version }
            - call: "POST /v1/delivery-appointments/${appt_e1_id}/confirm"
              payload: {}
              as: DeliveryAdvisor
            - call: "POST /v1/delivery-appointments/${appt_e2_id}/confirm"
              payload: {}
              as: DeliveryAdvisor
          trigger:
            - call: "POST /v1/production-batches/${batch_slip_id}/delay"
              payload: { delay_days: 9 }
              as: PlatformAdmin
              captures: { batch_state: $.data.status }
            - call: "POST /v1/delivery-estimates/${appt_e1_id}/restore"
              payload: {}
              as: PlatformAdmin
          assert:
            - "\"${batch_state}\" == DELAYED"
            - "ProductionBatch.${batch_slip_id}.planned_completion_at == 2026-09-19T00:00:00Z (2026-09-10 plus 9 days)"
            - "GET /v1/delivery-estimates?order_id=${order_dv_id} returns 2 rows and exactly 1 of them has estimate_state PROVISIONAL with window_start 2026-09-26T00:00:00Z and window_end 2026-10-03T00:00:00Z"
            - "GET /v1/delivery-estimates?order_id=${order_e2_id} returns 2 rows and exactly 1 of them has estimate_state PROVISIONAL"
            - "VehicleOrder.${order_dv_id}.estimate_shift_days_cumulative == 2 and VehicleOrder.${order_e2_id}.estimate_shift_days_cumulative == 2 (new window_start 2026-09-26T00:00:00Z is two whole days after the prior window_end 2026-09-24T00:00:00Z)"
            - "VehicleOrder.${order_dv_id}.status == AT_DELIVERY_CENTER and VehicleOrder.${order_e2_id}.status == AT_DELIVERY_CENTER — hop 3 fired for both orders"
            - "GET /v1/delivery-appointments/${appt_e1_id} reports status AT_RISK"
            - "GET /v1/delivery-appointments/${appt_e2_id} reports status AT_RISK"

      - name: trade_in_offer_expiry_compensating_two_hop_chain
        grounds:
          - state_machines.TradeInAppraisal.OFFERED_to_EXPIRED
          - entities.Buyer.fields.order_credit_balance_cents
          - entities.OrderFeeLedgerEntry.fields.amount_cents
          - validations[priority=16]
        distinguishing_aspect: "Letting the logical clock pass the offer validity instant fires OFFERED to EXPIRED, which forces the compensating TRADE_IN_CREDIT_REVERSAL entry and drives the buyer's conserved order_credit_balance_cents back to its pre-offer value, so a chain of depth 3 ends with an observable global quantity unchanged."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED; delivery center"
            - "Order F1 placed with the 25000-cent order fee settled, so Buyer F1 has order_credit_balance_cents 25000"
            - "Trade-in appraisal opened with gross offer 1200000, reconditioning 60000 and validity 2026-09-10T00:00:00Z, appraised and offered, writing a +940000 credit (90000 miles, so the 200000-cent mileage cap binds)"
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_enact_tx
            - *k_center_tx
            - *k_cfg_y
            - &k_buyer_f1
              call: "POST /v1/buyers"
              payload: { full_name: "Faye Chain", email: "faye.chain@example.com", residency_state_code: "TX" }
              as: Anonymous
              captures: { buyer_f1_id: $.data.id }
            - call: "POST /v1/buyers/${buyer_f1_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders"
              payload: { buyer_id: "${buyer_f1_id}", configuration_id: "${cfg_y_id}", jurisdiction_id: "${jur_tx_id}", delivery_center_id: "${center_tx_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { order_f1_id: $.data.id, order_f1_v: $.data.version }
            - &k_place_f1
              call: "POST /v1/orders/${order_f1_id}/place"
              payload: { expected_order_version: "${order_f1_v}" }
              as: Buyer
              as_user_id: "${buyer_f1_id}"
              captures: { order_f1_v: $.data.version }
            - call: "POST /v1/_payments/simulate"
              payload: { order_id: "${order_f1_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_f1_id}/trade-in-appraisals"
              payload: { trade_vin: "5YJ3E1EA7PF000901", mileage: 90000, gross_offer_cents: 1200000, reconditioning_estimate_cents: 60000, offer_valid_until: "2026-09-10T00:00:00Z" }
              as: TradeInSpecialist
              captures: { ap_f1_id: $.data.id }
            - call: "POST /v1/orders/${order_f1_id}/trade-in-appraisals/${ap_f1_id}/appraise"
              payload: {}
              as: TradeInSpecialist
            - call: "POST /v1/orders/${order_f1_id}/trade-in-appraisals/${ap_f1_id}/offer"
              payload: {}
              as: TradeInSpecialist
              captures: { bal_before_expiry: $.data.net_credit_cents }
          trigger:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "\"${bal_before_expiry}\" == 940000"
            - "TradeInAppraisal.${ap_f1_id}.status == EXPIRED"
            - "GET /v1/fee-ledger-entries?order_id=${order_f1_id} now contains exactly one entry of type TRADE_IN_CREDIT with amount_cents 940000 and exactly one entry of type TRADE_IN_CREDIT_REVERSAL with amount_cents -940000"
            - "Buyer.${buyer_f1_id}.order_credit_balance_cents == 25000 — the same value it held before the offer was published"
            - "the sum of amount_cents over every ledger entry of order ${order_f1_id} equals 25000"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (>= 2 instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: priority_11_slot_conflict_beats_priority_19_stale_version
        grounds:
          - validations[priority=11]
          - validations[priority=19]
          - errors[ERR_DELIVERY_SLOT_CONFLICT]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "With a stale expected_order_version AND an occupied bay, the booking fails with the priority-11 business_constraint ERR_DELIVERY_SLOT_CONFLICT rather than the priority-19 OCC ERR_STALE_VERSION, proving the constraint layer is evaluated ahead of the concurrency guard on this path."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED; delivery center"
            - "Order G1 fully walked to AT_DELIVERY_CENTER; a first appointment booked for 2026-09-22T15:00 to 16:00 and confirmed, which occupies the bay and advances VehicleOrder.version"
            - "the client still holds the version it read before that booking, so its next write carries a stale expected_order_version"
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_enact_tx
            - *k_center_tx
            - *k_cfg_y
            - *k_buyer_dv
            - *k_verify_dv
            - *k_order_dv
            - *k_place_dv
            - *k_pay_dv
            - *k_lock_dv
            - *k_batch_dv
            - call: "POST /v1/production-batches/${batch_dv_id}/start"
              payload: {}
              as: PlatformAdmin
            - &k_unit_110
              call: "POST /v1/production-batches/${batch_dv_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000110" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/allocation"
              payload: { batch_id: "${batch_dv_id}", expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - call: "POST /v1/orders/${order_dv_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/delivery-appointments"
              payload: { order_id: "${order_dv_id}", delivery_center_id: "${center_tx_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-22T15:00:00Z", scheduled_end: "2026-09-22T16:00:00Z", expected_order_version: "${order_dv_v}" }
              as: DeliveryAdvisor
              captures: { appt_g1_id: $.data.id, order_dv_v: $.data.version }
            - call: "POST /v1/delivery-appointments/${appt_g1_id}/confirm"
              payload: {}
              as: DeliveryAdvisor
          trigger:
            - call: "POST /v1/delivery-appointments"
              payload: { order_id: "${order_dv_id}", delivery_center_id: "${center_tx_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-22T15:30:00Z", scheduled_end: "2026-09-22T16:30:00Z", expected_order_version: "${order_dv_v} - 2" }
              as: DeliveryAdvisor
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DELIVERY_SLOT_CONFLICT"
            - "error_id != ERR_STALE_VERSION — the lower-priority OCC guard never fires"
            - "error_id != ERR_TRADE_IN_NOT_RESOLVED — the referential layer sits behind the constraint layer"
            - "GET /v1/orders/${order_dv_id}/delivery-appointments still reports exactly 1 row"
            - "DeliveryCenter.${center_tx_id}.booked_slot_count is unchanged by the rejected request"

      - name: priority_16_unresolved_trade_in_beats_priority_17_frozen_posture
        grounds:
          - validations[priority=16]
          - validations[priority=17]
          - errors[ERR_TRADE_IN_NOT_RESOLVED]
          - errors[ERR_ORDER_DELIVERY_NOT_READY]
        distinguishing_aspect: "Borrowing a slot from order H1 to book a handover for order H2 that is both FROZEN on readiness and carrying an unresolved trade-in offer fails with the priority-16 business_referential ERR_TRADE_IN_NOT_RESOLVED, not the priority-17 ERR_ORDER_DELIVERY_NOT_READY — the unresolved-reference check outranks the readiness gate."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED; a single delivery center"
            - "Order H1 walked to AT_DELIVERY_CENTER and holding a CONFIRMED appointment for 2026-09-25T15:00 to 16:00"
            - "Order H2 still IN_TRANSIT, so its delivery_readiness_posture is FROZEN, and it carries an OFFERED but unaccepted trade-in appraisal"
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_enact_tx
            - *k_center_tx
            - *k_cfg_y
            - *k_buyer_dv
            - *k_verify_dv
            - &k_buyer_h2
              call: "POST /v1/buyers"
              payload: { full_name: "Hana Readiness", email: "hana.readiness@example.com", residency_state_code: "TX" }
