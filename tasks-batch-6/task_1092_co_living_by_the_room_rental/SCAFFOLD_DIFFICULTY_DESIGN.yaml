            - call: "POST /co-living/applications/${app1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /co-living/memberships"
              payload: { application_id: "${app1_id}", move_in_date: "2026-06-01" }
              as: CommunityManager
              as_user_id: "cm-1"
              captures: { mem1_id: $.data.id }
            - call: "POST /co-living/memberships/${mem1_id}/move-in"
              payload: {}
              as: CommunityManager
