        distinguishing_aspect: |
          Publish is not idempotent here: the second call sees status PUBLISHED,
          which has no publish transition, so it must return 409 rather than a
          second 200.
        test_recipe:
          setup:
            - "One COMPONENT part already moved DRAFT -> PUBLISHED."
          setup_api_calls:
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-S202-FAN", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 900, core_return_required: false }
