      - name: severity_weight_change_holds_the_pin_until_the_next_scoring_run
        claim_type: constants_applied
        grounds:
          - calculations.violation_severity_pin
          - entities.Violation.fields.code_weight_snapshot
          - entities.Violation.fields.has_stale_code_pin
          - endpoints[PATCH /violation-codes/{id}]
          - endpoints[POST /scoring-runs]
        distinguishing_aspect: |
          Republishing the code at weight 8 does NOT retro-actively rescore: the violation keeps
          code_weight_snapshot 5 and time_weighted_severity 15.0 (measure 0.500) and only raises
          has_stale_code_pin, and the next scoring run re-pins to 8 -> 24.0 -> measure 0.800 ->
          percentile 59.0 -> iss 20.7.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; carrier c1 (MEDIUM, exposure 30.0); code 392.2S weight 5; threshold UNSAFE_DRIVING/MEDIUM 0.5 / 1.0 / 2.0."
