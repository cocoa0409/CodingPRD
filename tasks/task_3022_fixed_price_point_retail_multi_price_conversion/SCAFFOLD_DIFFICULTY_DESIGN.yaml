            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 0 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/arrive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/customs-release"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/receive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${i9001_id}", sequence: 1, requested_units: 40 }
              as: DistributionCenterOperator
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /merchandise/allocation-lines/${line_id}/release"
              payload: { release_units: 40 }
              as: DistributionCenterOperator
              captures: { line_status_ok: $.data.status, item_after_ok: $.data.id }
            - call: "GET /merchandise/items/${i9001_id}"
              payload: {}
              as: MerchandiseBuyer
              captures: { on_hand_ok: $.data.on_hand_units }
          assert:
            - "line_status_ok == RELEASED and on_hand_ok == 40"
            - "the container had to sit in RECEIVED for this release to be legal — the line's own ALLOCATED state was never the binding constraint"
            - "AllocationLine.${line_id}.remaining_units == 0"
            - "a second release of 1 unit returns 409 and ERR_ALLOCATION_LINE_NOT_ALLOCATED, because the line left ALLOCATED"
            - "the release did not change Item.${i9001_id}.price_point_id or the store's conversion_price_point_id"

      - name: conversion_completion_gated_on_season_window_and_line_states
        grounds:
          - state_machines.AisleReset.PLANNED_to_EXECUTING
          - state_machines.SeasonWindow.SCHEDULED_to_OPEN
          - state_machines.Store.CONVERTING_to_MULTI_PRICE
          - state_machines.AllocationLine.ALLOCATED_to_SHORTED
          - validations[priority=13]
        distinguishing_aspect: "Store → SeasonWindow → AisleReset, a pair distinct from AllocationLine → Container: the store's completion edge is refused while its season window is unopened (ERR_SEASON_WINDOW_NOT_OPEN, 409) and the reset's begin edge is refused outside the declared calendar (ERR_RESET_OUTSIDE_CALENDAR, 409) — both failures read a different parent's state, and neither is fixed by touching the store."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents, one store CONVERTING with the complete conversion-price-point binding, one DRAFT season window running 2026-10-01T00:00:00Z to 2026-10-31T00:00:00Z, and one PLANNED aisle reset on aisle A11 from 2026-10-05T00:00:00Z to 2026-10-10T00:00:00Z, contained in the calendar but sitting in a window that has not opened yet."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp125_id}" }
              as: StoreOperationsManager
              captures: { conv_id: $.data.id, store_v1: $.data.version }
            - call: "POST /merchandise/season-windows"
              payload: { season_code: "HARVEST_2026", opens_on: "2026-10-01T00:00:00Z", closes_on: "2026-10-31T00:00:00Z" }
              as: ResetCalendarPlanner
              captures: { window_id: $.data.id }
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A11", starts_at: "2026-10-05T00:00:00Z", ends_at: "2026-10-10T00:00:00Z", allocated_shelf_sqft: 50.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { reset_id: $.data.id }
          trigger:
            - call: "POST /merchandise/aisle-resets/${reset_id}/begin"
              payload: {}
              as: ResetCalendarPlanner
              captures: { err_window: $.data.error_id }
            - call: "POST /merchandise/stores/${store_id}/conversions/${conv_id}/complete"
              payload: {}
              as: StoreOperationsManager
              captures: { err_complete: $.data.error_id }
          assert:
            - "the begin returns 409 and err_window == ERR_SEASON_WINDOW_NOT_OPEN — the window is still DRAFT at the 2026-09-01T00:00:00Z clock, and that is the parent whose state the reset requires"
            - "AisleReset.${reset_id}.status == PLANNED — the refused begin left it untouched"
            - "the completion returns 409 and err_complete == ERR_CONVERSION_PREREQUISITES_UNMET — sign_order_filed, shelf_tag_filed and register_file_locked are all still false"
            - "Store.${store_id}.status == CONVERTING and Store.${store_id}.conversion_price_point_id == ${pp125_id} — neither refusal moved the store"
            - "after POST /merchandise/season-windows/${window_id}/schedule and POST /merchandise/_clock/set_current_utc to 2026-10-02T00:00:00Z the window reads OPEN, yet AisleReset.${reset_id}.begin still returns 409 with ERR_RESET_OUTSIDE_CALENDAR, because the clock of 2026-10-02T00:00:00Z falls before the reset own starts_at of 2026-10-05T00:00:00Z"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:

      - name: half_open_same_aisle_overlap_leaves_adjacent_resets_legal
        grounds:
          - validations[priority=12]
          - state_machines.AisleReset.PLANNED_to_EXECUTING
          - entities.AisleReset.fields.starts_at
          - entities.AisleReset.fields.ends_at
          - errors.ERR_AISLE_RESET_OVERLAP
        distinguishing_aspect: "Half-open interval arithmetic on the aisle_code resource: an existing reset ending 2026-09-20T00:00:00Z and a candidate starting exactly at 2026-09-20T00:00:00Z are NOT a conflict, so the candidate is accepted at 201 — the scaffold's toucher-passes semantics, which the closed-interval instance below must not share."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents, one store, one OPEN season window 2026-09-01T00:00:00Z to 2026-11-30T00:00:00Z, one PLANNED reset on aisle A14 from 2026-09-05T00:00:00Z to 2026-09-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/season-windows"
              payload: { season_code: "HARVEST_2026", opens_on: "2026-09-01T00:00:00Z", closes_on: "2026-11-30T00:00:00Z" }
              as: ResetCalendarPlanner
              captures: { window_id: $.data.id }
            - call: "POST /merchandise/season-windows/${window_id}/schedule"
              payload: {}
              as: ResetCalendarPlanner
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A14", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-20T00:00:00Z", allocated_shelf_sqft: 50.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { reset_a_id: $.data.id }
          trigger:
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A14", starts_at: "2026-09-20T00:00:00Z", ends_at: "2026-09-25T00:00:00Z", allocated_shelf_sqft: 50.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { reset_touch_id: $.data.id }
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A14", starts_at: "2026-09-19T00:00:00Z", ends_at: "2026-09-24T00:00:00Z", allocated_shelf_sqft: 50.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { err_overlap: $.data.error_id }
          assert:
            - "the touching candidate is accepted with 201 and Reset.${reset_touch_id}.status == PLANNED"
            - "the overlapping candidate returns 409 and err_overlap == ERR_AISLE_RESET_OVERLAP — a shared day both occupies"
            - "there is no second error id: no ERR_STORE_DAY_CAPACITY_EXCEEDED fired, because 100.0 sqft of 400.0 is comfortably under the store-day aggregate"
            - "GET /merchandise/stores/${store_id}/aisle-resets returns exactly 2 rows — the touching reset persisted, the overlapping one did not"
            - "Reset.${reset_a_id}.ends_at == 2026-09-20T00:00:00Z and Reset.${reset_touch_id}.starts_at == 2026-09-20T00:00:00Z — the two intervals are adjacent, not disjoint"

      - name: closed_store_day_capacity_aggregate_counts_touching_resets
        grounds:
          - validations[priority=14]
          - entities.AisleReset.fields.allocated_shelf_sqft
          - entities.Store.fields.shelf_facing_capacity_sqft
          - errors.ERR_STORE_DAY_CAPACITY_EXCEEDED
          - state_machines.AisleReset.EXECUTING_to_ABANDONED
        distinguishing_aspect: "Closed-aggregate arithmetic on a different resource — the STORE rather than the AISLE — so the same touching interval that passed above now counts: three resets sharing 2026-09-02T00:00:00Z with 150.0 sqft each sum to 450.0 against a 400.0 store ceiling, and abandoning one drops the sum to 300.0 so the identical retry succeeds."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents, one store with shelf_facing_capacity_sqft 400.0, one OPEN season window, three PLANNED resets on three DIFFERENT aisles all starting and ending on the same two instants, each committing allocated_shelf_sqft 130.0 so the running day sum is 130.0, 260.0, 390.0 — each creation legal against the 400.0 ceiling."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/season-windows"
              payload: { season_code: "HARVEST_2026", opens_on: "2026-09-01T00:00:00Z", closes_on: "2026-11-30T00:00:00Z" }
              as: ResetCalendarPlanner
              captures: { window_id: $.data.id }
            - call: "POST /merchandise/season-windows/${window_id}/schedule"
              payload: {}
              as: ResetCalendarPlanner
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A11", starts_at: "2026-09-02T00:00:00Z", ends_at: "2026-09-08T00:00:00Z", allocated_shelf_sqft: 130.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { reset_1_id: $.data.id }
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A12", starts_at: "2026-09-02T00:00:00Z", ends_at: "2026-09-08T00:00:00Z", allocated_shelf_sqft: 130.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { reset_2_id: $.data.id }
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A13", starts_at: "2026-09-02T00:00:00Z", ends_at: "2026-09-08T00:00:00Z", allocated_shelf_sqft: 130.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { reset_3_id: $.data.id }
          trigger:
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A14", starts_at: "2026-09-02T00:00:00Z", ends_at: "2026-09-08T00:00:00Z", allocated_shelf_sqft: 130.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { err_day: $.data.error_id }
            - call: "POST /merchandise/aisle-resets/${reset_3_id}/abandon"
              payload: {}
              as: StoreOperationsManager
              captures: { abandoned_status: $.data.status }
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A14", starts_at: "2026-09-02T00:00:00Z", ends_at: "2026-09-08T00:00:00Z", allocated_shelf_sqft: 130.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { retry_id: $.data.id }
          assert:
            - "the fourth reset returns 422 and err_day == ERR_STORE_DAY_CAPACITY_EXCEEDED — 130.0 + 130.0 + 130.0 + 130.0 == 520.0 exceeds the 400.0 store ceiling"
            - "err_day != ERR_AISLE_RESET_OVERLAP — A14 shares no aisle with A11, A12 or A13, so the same-aisle rule passed and only the aggregate failed"
            - "abandoned_status == ABANDONED and the abandoned reset no longer counts toward the day sum"
            - "the identical retry is then accepted with 201 and Reset.${retry_id}.status == PLANNED, because the day sum is back to 260.0 and 260.0 + 130.0 == 390.0 is under the ceiling"
            - "GET /merchandise/stores/${store_id}/aisle-resets returns exactly 4 rows and exactly 3 of them carry status PLANNED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:

      - name: store_price_binding_count_invariant_across_begin_and_rollback
        grounds:
          - state_machines.Store.CONVERTING_to_SINGLE_PRICE
          - state_machines.Store.SINGLE_PRICE_to_CONVERTING
          - state_machines.ConversionProject.IN_PROGRESS_to_ROLLBACK
          - entities.Store.fields.conversion_price_point_id
          - entities.ConversionProject.fields.status
        distinguishing_aspect: "Conserved quantity: the count of Store rows whose conversion_price_point_id is non-null. The forward POST /merchandise/stores begin raises it by one and the compensating rollback restores it exactly, so the count reads 0, 0, 1, 0 across the four observations — not 0, 0, 1, 1 — leaving no drift on the binding."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents with target_landed_cost_ratio 0.90, one store with shelf_facing_capacity_sqft 400.0 and no conversion in flight."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/price-points"
              payload: { label: "THREE_DOLLAR_25", shelf_price_cents: 300, target_landed_cost_ratio: 0.40 }
              as: MerchandiseBuyer
              captures: { pp300_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp300_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "GET /merchandise/stores"
              payload: { conversion_price_point_id: "${pp125_id}" }
              as: MerchandiseAnalyst
          trigger:
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp125_id}" }
              as: StoreOperationsManager
              captures: { store_v1: $.data.version }
            - call: "GET /merchandise/stores"
              payload: { conversion_price_point_id: "${pp125_id}" }
              as: MerchandiseAnalyst
            - call: "POST /merchandise/conversion-projects"
              payload: { store_id: "${store_id}", from_price_point_id: "${pp125_id}", to_price_point_id: "${pp300_id}", expected_store_version: "${store_v1}" }
              as: StoreOperationsManager
              captures: { conv_id: $.data.id }
            - call: "POST /merchandise/conversion-projects/${conv_id}/start"
              payload: {}
              as: StoreOperationsManager
            - call: "GET /merchandise/stores/${store_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { store_v2: $.data.version }
            - call: "POST /merchandise/conversion-projects"
              payload: { store_id: "${store_id}", from_price_point_id: "${pp125_id}", to_price_point_id: "${pp125_id}", expected_store_version: "${store_v2}" }
              as: StoreOperationsManager
              captures: { err_same: $.data.error_id }
            - call: "POST /merchandise/conversion-projects/00000000-0000-4000-8000-000000000000/start"
              payload: {}
              as: StoreOperationsManager
              captures: { err_unknown: $.data.error_id }
            - call: "GET /merchandise/stores/${store_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { bound_field_mid: $.data.conversion_price_point_id }
            - call: "POST /merchandise/stores/${store_id}/conversions/${conv_id}/rollback"
              payload: {}
              as: StoreOperationsManager
            - call: "GET /merchandise/stores/${store_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { bound_field_after: $.data.conversion_price_point_id }
            - call: "GET /merchandise/stores"
              payload: { conversion_price_point_id: "${pp125_id}" }
              as: MerchandiseAnalyst
          assert:
            - "the pre-begin bound-store read returns exactly 0 rows and bound_field_mid == ${pp125_id} after the begin — the forward begin is the only thing that raised the conserved quantity"
            - "the second project-open call, carrying the fresh store version, returns 400 and err_same == ERR_INVALID_REQUEST because its to_price_point_id equals its from_price_point_id"
            - "the start call returns 404 and err_unknown == ERR_CONVERSION_PROJECT_NOT_FOUND"
            - "after the rollback bound_field_after is null and the bound-store read returns exactly 0 rows — the compensating action restored the invariant"
            - "Store.${store_id}.status == SINGLE_PRICE"
            - "the net effect of the forward and compensating pair on the bound-store count is exactly zero, not one"

      - name: on_hand_units_conserved_by_allocation_line_reversal
        grounds:
          - state_machines.AllocationLine.ALLOCATED_to_RELEASED
          - state_machines.AllocationLine.ALLOCATED_to_REVERSED
          - state_machines.AllocationLine.SHORTED_to_REVERSED
          - entities.Item.fields.on_hand_units
          - entities.AllocationLine.fields.released_units
        distinguishing_aspect: "Conserved quantity: Item.on_hand_units. Releasing 40 units raises it to 40; the compensating reversal driven by DELETE_REVIEW → DELETED returns it to exactly 0 while the line is also rewound to released_units 0 — so the item's on-hand is conserved, not left holding goods it can no longer sell."
