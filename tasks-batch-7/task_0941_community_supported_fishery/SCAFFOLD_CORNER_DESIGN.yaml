  - section: endpoints
    instances:
      - name: settlement_pay_disburses_the_final_net_payable
        claim_type: Action endpoint
        grounds: ["endpoints.POST./csf/settlement-statements/{id}/pay", "state_machines.SettlementStatement.FINAL_to_PAID", "entities.SettlementStatement.fields.net_paid_cents"]
        distinguishing_aspect: "Paying a FINAL statement copies net_payable_cents 6962 into net_paid_cents and moves the statement to PAID; the invariant gross == deductions + net_payable + forfeited + offset still reads 9136 == 2174 + 6962 + 0 + 0."
        test_recipe:
          setup: ["a verified 10.04 lb COD landing whose settlement statement has been created and finalized with the lot CLEAR"]
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["COD"], landing_commit_lead_hours: 72 }
              as: CsfAdmin
              captures: { season_id: $.data.id }
            - call: "POST /csf/share-plans"
              payload: { season_id: "${season_id}", plan_code: "LRG-WHITE-W", share_size: "LARGE", delivery_frequency: "WEEKLY", species_tier: "WHITEFISH" }
              as: CsfAdmin
            - call: "POST /csf/seasons/${season_id}/open"
              payload: {}
              as: CsfAdmin
            - call: "POST /csf/vessels"
              payload: { vessel_name: "Northeaster", permit_number: "P-100", home_port: "Portland", gear_types: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { vessel_id: $.data.id }
            - call: "POST /csf/quota-ledgers"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", species: "COD", management_area: "GOM-2", entitlement_pounds: 500.00, species_open_date: "2026-05-01T00:00:00Z", species_close_date: "2026-09-30T00:00:00Z", permitted_gears: ["HOOK_AND_LINE"] }
              as: CsfAdmin
              captures: { ledger_id: $.data.id }
            - call: "POST /csf/trips"
              payload: { vessel_id: "${vessel_id}", season_id: "${season_id}", quota_ledger_id: "${ledger_id}", gear_type: "HOOK_AND_LINE", management_area: "GOM-2" }
              as: CsfAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/land"
              payload: { species: "COD", landed_pounds_gross: 10.04, ex_vessel_price_cents_per_lb: 850, offload_minutes: 12 }
              as: Vendor
              as_user_id: "${vessel_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /csf/trips/${trip_id}/verify"
              payload: { accepted: true }
              as: CsfAdmin
              captures: { trip_v: $.data.version }
            - call: "POST /csf/trips/${trip_id}/settlements"
              payload: { expected_trip_version: "${trip_v}" }
              as: CsfAdmin
              captures: { stmt_id: $.data.id }
            - call: "POST /csf/settlement-statements/${stmt_id}/finalize"
              payload: {}
              as: CsfAdmin
          trigger:
            - call: "POST /csf/settlement-statements/${stmt_id}/pay"
              payload: {}
              as: CsfAdmin
          assert:
            - "SettlementStatement.${stmt_id}.status == PAID"
            - "SettlementStatement.${stmt_id}.net_paid_cents == 6962"
            - "SettlementStatement.${stmt_id}.net_payable_cents == 6962"
            - "SettlementStatement.${stmt_id}.gross_cents == 9136"
            - "SettlementStatement.${stmt_id}.deductions_cents == 2174"
            - "SettlementStatement.${stmt_id}.holdback_forfeited_cents == 0"
            - "SettlementStatement.${stmt_id}.offset_cents == 0"

      - name: sub_lot_filtered_list_finds_the_children_of_a_lot
        claim_type: Cross-reference link
        grounds: ["endpoints.GET./csf/sub-lots", "entities.SubLot.fields.landing_lot_id", "calculations.sublot_split_conservation"]
        distinguishing_aspect: "SubLot rows are only ever created as a cascade of the split call, so the filtered list on landing_lot_id is their sole discovery channel: a lot split into a HUB destination and a ROUTE destination lists exactly two sub-lots of 3.00 and 2.00 pounds."
        test_recipe:
          setup:
            - "an OPEN season with a MEDIUM x PREMIUM_FINFISH x WEEKLY plan, one hub-pickup member and one home-delivery member, both ACTIVE and joining at week 1"
            - "a 5.00 lb SALMON lot allocated 2.50 lb to each week-1 box"
          setup_api_calls:
            - call: "POST /csf/seasons"
              payload: { season_code: "CSF-2026", start_date: "2026-05-04T00:00:00Z", end_date: "2026-09-21T00:00:00Z", total_weeks: 20, ambient_band: "HOT", offered_species: ["SALMON"], landing_commit_lead_hours: 72 }
