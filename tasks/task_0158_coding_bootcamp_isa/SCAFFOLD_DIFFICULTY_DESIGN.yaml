  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: income_report_periods_half_open_overlap_rejected
        grounds:
          - validations[priority=15]
          - entities.IncomeReport.fields.period_start
          - entities.IncomeReport.fields.period_end
        distinguishing_aspect: |
          On IncomeReport with HALF-OPEN [start,end) monthly intervals: a second report [2026-06-15,2026-07-15)
          overlaps an existing [2026-06-01,2026-07-01) and is rejected; an adjacent report starting exactly at a prior
          period_end does NOT overlap (touching boundary allowed).
        test_recipe:
          setup:
            - "ACTIVE ISAContract with one income report covering [2026-06-01,2026-07-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
