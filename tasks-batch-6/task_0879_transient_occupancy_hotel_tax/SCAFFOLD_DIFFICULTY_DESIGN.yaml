              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "20 R St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /exemptions"
              payload: { tax_return_id: "${ret}", exemption_type: "GOVERNMENT", guest_ref: "G-3", amount_cents: 300000 }
              as: TaxAdmin
              captures: { ex: $.data.id }
            - call: "POST /exemptions/${ex}/verify"
              payload: {}
              as: TaxAdmin
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
          trigger:
            - call: "POST /exemptions/${ex}/reject"
              payload: {}
              as: TaxAdmin
          assert:
            - "TaxReturn.${ret}.gross_receipts_cents == 1000000"
            - "TaxReturn.${ret}.taxable_receipts_cents == 1000000"
            - "TaxReturn.${ret}.exempt_receipts_cents == 0"
            - "TaxReturn.${ret}.tax_due_cents == 120000"
            - "ExemptionClaim.${ex}.status == REJECTED"
