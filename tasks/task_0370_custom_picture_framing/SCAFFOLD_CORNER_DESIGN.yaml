  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_order_version_on_second_line_add
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[frame-line-add-stale-order]
          - entities.FramingOrder.fields.version
          - errors[ERR_STALE_ORDER_VERSION]
        distinguishing_aspect: "First line add bumps order version 1->2; a second add still carrying expected_order_version equal to the pre-first-add value (1) is rejected with ERR_STALE_ORDER_VERSION (412)."
        test_recipe:
          setup: ["Order INTAKE at version 1; client reads version 1 and adds one line (version -> 2)"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Occ", email: "occ@x.com", phone: "555-0234" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "First", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "Stale", nominal_width_in: 9, nominal_height_in: 12, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_ORDER_VERSION"

      - name: occ_correct_order_version_succeeds_and_bumps_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[frame-line-add-stale-order]
          - entities.FramingOrder.fields.version
        distinguishing_aspect: "Adding a line with expected_order_version equal to the current version (2 after the first add) succeeds (201) and increments FramingOrder.version to 3."
        test_recipe:
          setup: ["Order INTAKE with one line already added (version 2); client re-reads to obtain version 2"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Occ2", email: "occ2@x.com", phone: "555-0235" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}" }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "First", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { l1: $.data.id }
            - call: "GET /framing-orders/${order_id}"
              payload: {}
              as: FrameDesigner
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v1}", artwork_label: "Second", nominal_width_in: 9, nominal_height_in: 12, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { l2: $.data.id }
            - call: "GET /framing-orders/${order_id}"
              payload: {}
              as: FrameDesigner
              captures: { v2: $.data.version }
          assert:
            - "FramingOrder.${order_id}.version == 3"

      - name: derived_balance_due_reconciled_after_deposit
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.order_ledger
          - entities.FramingOrder.fields.amount_paid
          - entities.FramingOrder.fields.balance_due
        distinguishing_aspect: "After QUOTE (estimate 64.47) and a 25.00 deposit, amount_paid is 25.00 and balance_due reconciles to 39.47 (64.47 - 25.00)."
