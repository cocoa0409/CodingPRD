          trigger:
            - call: "POST /fuel/tankering-directives/${d1_id}/request-revision"
              payload: { revision_note: "First pass: payload too high." }
              as: FuelOpsController
            - call: "POST /fuel/tankering-directives/${d1_id}/revise"
              payload: { requested_uplift_gallons: 2000 }
              as: FuelAnalyst
            - call: "POST /fuel/tankering-directives/${d1_id}/request-revision"
              payload: { revision_note: "Second pass: still trim it." }
              as: FuelOpsController
            - call: "POST /fuel/tankering-directives/${d1_id}/revise"
              payload: { requested_uplift_gallons: 1000 }
              as: FuelAnalyst
            - call: "GET /fuel/flight-legs/${leg_id}"
              payload: {}
              as: FuelAnalyst
              captures: { leg_v2: $.data.version }
            - call: "POST /fuel/flight-legs/${leg_id}/tankering-directives"
              payload: { requested_uplift_gallons: 800, expected_flight_leg_version: "${leg_v2}" }
              as: FuelAnalyst
              captures: { d2_id: $.data.id }
          assert:
            - "TankeringDirective.${d1_id}.revision_count == 2"
            - "TankeringDirective.${d1_id}.requested_uplift_gallons == 1000"
            - "TankeringDirective.${d1_id}.status == SUPERSEDED"
            - "TankeringDirective.${d2_id}.status == PROPOSED and TankeringDirective.${d2_id}.revision_count == 0"
            - "TankeringDirective.${d2_id}.requested_uplift_gallons == 800"
            - "no endpoint exists that transitions a directive to SUPERSEDED directly; POST /fuel/tankering-directives/${d1_id}/approve after supersession returns 409 with error_id ERR_DIRECTIVE_INVALID_STATE"

      - name: program_return_cycle_with_resize_self_loop
        grounds:
          - state_machines.HedgeProgram.SIZING_to_SIZING
          - state_machines.HedgeProgram.PENDING_APPROVAL_to_SIZING
          - entities.HedgeProgram.fields.return_count
          - entities.HedgeProgram.fields.consumption_basis_gallons
        distinguishing_aspect: |
          SIZING is both a self-loop target and the destination of the PENDING_APPROVAL
          return edge, so the program visits SIZING three times and PENDING_APPROVAL
          three times before reaching ACTIVE; the re-sizing self-loop changes
          consumption_basis_gallons from 11000000 to 12100000 mid-cycle, so
          planned_coverage_pct_delta moves from 18.18 to 16.53 without any instrument
          changing, and the return edge clears submitted_by_user_id so a different
          approver is required each round.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy with min_coverage_pct 15.00 and eligible_fleet_types [NARROWBODY, WIDEBODY, REGIONAL]."
            - "Two PUBLISHED SUMMER forecasts totalling 10000000 raw gallons and a third REGIONAL forecast still in DRAFT."
