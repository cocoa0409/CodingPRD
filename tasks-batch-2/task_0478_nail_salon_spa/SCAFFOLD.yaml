    path: "/appointments"
    description: "Book an appointment (WALK_IN or APPOINTMENT). Runs §1.3 deposit_assessment; deposit_due_cents set per client strike posture. booking_status starts REQUESTED, payment_status UNPAID."
    roles: [FrontDesk, SalonManager]
    code: 201
    input: ["client_id", "technician_id", "station_id", "service_item_id", "origin", "start_at?"]
    output: Appointment
    side_effects: ["deposit_due_cents computed; client.deposit_required recomputed; end_at computed from service duration"]
  - method: GET
    path: "/appointments"
    description: "List appointments; filter by client_id, technician_id, station_id, service_item_id, gift_card_id, booking_status, payment_status."
    roles: [FrontDesk, SalonManager]
    code: 200
    input: ["client_id?", "technician_id?", "station_id?", "service_item_id?", "gift_card_id?", "booking_status?", "payment_status?", "limit?", "offset?"]
    output: Appointment[]
    side_effects: []
  - method: GET
    path: "/appointments/{id}"
    description: "Fetch one appointment."
    roles: [FrontDesk, SalonManager, Client, Technician]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{id}/add-ons"
    description: "Attach an add-on to a REQUESTED appointment; snapshots price and minutes."
    roles: [FrontDesk, SalonManager]
    code: 201
    input: [add_on_id, expected_appointment_version]
    output: AppointmentAddOn
    side_effects: ["snapshot AddOn price/minutes; recompute end_at; increments Appointment.version by 1"]
  - method: GET
    path: "/appointments/{id}/add-ons"
    description: "Reverse-reachability: add-ons attached to this appointment."
    roles: [FrontDesk, SalonManager, Client, Technician]
    code: 200
    input: ["limit?", "offset?"]
    output: AppointmentAddOn[]
    side_effects: []
  - method: GET
    path: "/appointment-add-ons"
    description: "List appointment add-on junction rows; reverse-reachability by appointment_id or add_on_id."
    roles: [FrontDesk, SalonManager, Technician]
    code: 200
    input: ["appointment_id?", "add_on_id?", "limit?", "offset?"]
    output: AppointmentAddOn[]
    side_effects: []
  - method: GET
    path: "/appointment-add-ons/{id}"
    description: "Fetch one appointment add-on junction row."
    roles: [FrontDesk, SalonManager, Technician]
    code: 200
    input: []
    output: AppointmentAddOn
    side_effects: []
  - method: POST
    path: "/appointments/{id}/pay-deposit"
    description: "Collect the owed deposit; payment_status UNPAID -> DEPOSIT_HELD."
    roles: [FrontDesk, SalonManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["deposit_paid_cents = deposit_due_cents; payment_status -> DEPOSIT_HELD; increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/confirm"
    description: "Confirm a REQUESTED appointment after overlap, sterilization-deferred, and deposit checks; snapshots subtotal."
    roles: [FrontDesk, SalonManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["snapshot subtotal_cents; booking_status -> CONFIRMED; increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/check-in"
    description: "Check in a CONFIRMED appointment (sterilization + license gates)."
    roles: [FrontDesk, SalonManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["booking_status -> CHECKED_IN; increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/start-service"
    description: "Begin service; occupies the station."
    roles: [Technician, SalonManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Station.in_service_appointment_id set; booking_status -> IN_SERVICE; increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/checkout"
    description: "Settle and complete: runs §1.3 checkout_settlement + technician_earning, accrues commission, awards loyalty, draws gift card, frees station. OCC on expected_appointment_version."
    roles: [FrontDesk, SalonManager]
    code: 200
    input: ["expected_appointment_version", "loyalty_points_redeemed?", "gift_card_id?"]
    output: Appointment
    side_effects: ["total_charged_cents computed; payment_status -> SETTLED; booking_status -> COMPLETED; Technician.accrued_earnings_cents += technician_earning_cents; Client.loyalty_points_balance adjusted; GiftCard balance drawn (-> DEPLETED if zero); Station freed; increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel a REQUESTED/CONFIRMED appointment; deposit refunded if within free window else forfeited."
    roles: [FrontDesk, SalonManager, Client]
    code: 200
    input: []
    output: Appointment
    side_effects: ["booking_status -> CANCELLED; payment_status -> REFUNDED or FORFEITED if deposit held; increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/mark-no-show"
    description: "Mark a CONFIRMED appointment NO_SHOW after grace; increments client strikes, may flip deposit_required, forfeits deposit."
    roles: [FrontDesk, SalonManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["booking_status -> NO_SHOW; Client.active_no_show_strikes += 1; Client.deposit_required maybe flipped; deposit forfeited; increments Appointment.version by 1"]
  - method: POST
    path: "/appointments/{id}/refund-settled"
    description: "Manager-initiated full refund of a COMPLETED/SETTLED appointment (service redo, complaint). Compensates the checkout: restores gift-card draw, returns redeemed loyalty points, removes the awarded loyalty points, debits the technician's accrued earnings, and frees nothing (station already free). payment_status -> REFUNDED."
    roles: [SalonManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["payment_status -> REFUNDED; GiftCard.balance_cents restored by the prior draw (-> ACTIVE if it was DEPLETED); Client.loyalty_points_balance restored (redeemed points returned, awarded points removed); Technician.accrued_earnings_cents -= technician_earning_cents; increments Appointment.version by 1"]

  # ---- Gift cards ---------------------------------------------------------
  - method: POST
    path: "/gift-cards"
    description: "Issue a gift card; balance_cents initialized to initial_balance_cents."
    roles: [FrontDesk, SalonManager]
    code: 201
    input: ["code", "initial_balance_cents", "purchaser_client_id?"]
    output: GiftCard
    side_effects: ["balance_cents = initial_balance_cents; status ACTIVE"]
  - method: GET
    path: "/gift-cards"
    description: "List gift cards; optional code or status filter."
    roles: [FrontDesk, SalonManager]
    code: 200
    input: ["code?", "status?", "purchaser_client_id?", "limit?", "offset?"]
    output: GiftCard[]
    side_effects: []
  - method: GET
    path: "/gift-cards/{id}"
    description: "Fetch one gift card."
    roles: [FrontDesk, SalonManager, Client]
    code: 200
    input: []
    output: GiftCard
    side_effects: []
  - method: POST
    path: "/gift-cards/{id}/redeem"
    description: "Manually draw an amount from a gift card (e.g., retail). OCC on expected_gift_card_version; no overdraw."
    roles: [FrontDesk, SalonManager]
    code: 200
    input: [amount_cents, expected_gift_card_version]
    output: GiftCard
    side_effects: ["balance_cents -= amount_cents; -> DEPLETED if zero; increments GiftCard.version by 1"]
  - method: POST
    path: "/gift-cards/{id}/void"
    description: "Void an active gift card; zeroes balance."
    roles: [SalonManager]
    code: 200
    input: []
    output: GiftCard
    side_effects: ["balance_cents = 0; status -> VOID; increments GiftCard.version by 1"]

  # ---- Commission statements ----------------------------------------------
  - method: POST
    path: "/commission-statements"
    description: "Create a DRAFT commission statement scoping a settlement window for a technician."
    roles: [SalonManager]
    code: 201
    input: [technician_id, period_start, period_end]
    output: CommissionStatement
    side_effects: ["status DRAFT; computed totals all 0 until settle"]
  - method: GET
    path: "/commission-statements"
    description: "List commission statements; optional technician_id or status filter."
    roles: [SalonManager]
    code: 200
    input: ["technician_id?", "status?", "limit?", "offset?"]
    output: CommissionStatement[]
    side_effects: []
  - method: GET
    path: "/commission-statements/{id}"
    description: "Fetch one commission statement."
    roles: [SalonManager, Technician]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: []
  - method: POST
    path: "/commission-statements/{id}/settle"
    description: "Settle a DRAFT statement: sweeps COMPLETED appointments in window, runs §1.3 statement_payout, resets technician accrual."
    roles: [SalonManager]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["gross/payout/retained/count computed; Technician.accrued_earnings_cents reset to 0; status -> SETTLED"]
  - method: POST
    path: "/commission-statements/{id}/void"
    description: "Void a DRAFT statement without settling."
    roles: [SalonManager]
    code: 200
    input: []
    output: CommissionStatement
    side_effects: ["status -> VOID"]

  # ---- Test-driving (logical clock + state injection) ---------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Server startup default is fixed at 2026-01-01T00:00:00Z; before any set_current_utc the clock reads exactly this default and never falls back to wall-clock time. All deadline/expiry/decay/grace rules read this clock."
    roles: [SalonManager, FrontDesk]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to to_iso8601"]
  - method: POST
    path: "/_inject/client_state"
    description: "Test-driving: directly set a client's strike/loyalty ledger to a known baseline (no real booking history exists to manufacture deep strike counts or large loyalty balances cheaply). Sets the stored raw strike count, last_no_show_at, and/or loyalty_points_balance; deposit_required is recomputed from the resulting strike count under §1.3 deposit_assessment."
    roles: [SalonManager]
    code: 200
    input: ["client_id", "active_no_show_strikes?", "last_no_show_at?", "loyalty_points_balance?"]
    output: Client
    side_effects: ["Client.active_no_show_strikes/last_no_show_at/loyalty_points_balance set; Client.deposit_required recomputed"]
  - method: POST
    path: "/_inject/appointment_deposit"
    description: "Test-driving: force a specific deposit_due_cents on a REQUESTED appointment regardless of the booking client's current strike posture, so deposit-held payment flows can be exercised independently of strike history."
    roles: [SalonManager]
    code: 200
    input: [appointment_id, deposit_due_cents]
    output: Appointment
    side_effects: ["Appointment.deposit_due_cents set"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers, or unknown role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for the operation, or entity_backed actor not the owner of the targeted resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path id or body FK references a nonexistent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body: missing required field, illegal enum, out-of-range integer, unparseable datetime"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset < 0"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "unique field collision (license_number, station name, client email, gift-card code, menu-item name)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "requested transition not defined from the resource's current state"
  - id: ERR_ITEM_RETIRED
    http: 409
    condition: "booking/attaching a ServiceMenuItem or AddOn whose is_active == false"
  - id: ERR_STATION_NOT_STERILE
    http: 409
    condition: "check-in attempted while station sanitation_status != CLEAN and sterilization is required"
  - id: ERR_LICENSE_EXPIRED
    http: 409
    condition: "check-in/reinstate with an expired technician license or non-ACTIVE technician"
  - id: ERR_STERILIZATION_INVALID
    http: 422
    condition: "SanitationLog claims PASS but cycle_temp_c < 121.0 or hold_minutes < 30"
  - id: ERR_TECHNICIAN_DOUBLE_BOOKED
    http: 409
    condition: "confirm would overlap another active appointment window on the same technician"
  - id: ERR_STATION_TURNOVER_CONFLICT
    http: 409
    condition: "confirm would overlap (within turnover buffer) another active appointment window on the same station"
  - id: ERR_NO_SHOW_TOO_EARLY
    http: 409
    condition: "mark-no-show before start_at + NO_SHOW_GRACE_MINUTES"
  - id: ERR_DEPOSIT_REQUIRED
    http: 402
    condition: "confirm a deposit-required client's appointment before a deposit is held"
  - id: ERR_INSUFFICIENT_LOYALTY
    http: 409
    condition: "loyalty_points_redeemed at checkout exceeds client.loyalty_points_balance"
  - id: ERR_GIFT_CARD_OVERDRAW
    http: 409
    condition: "gift-card draw exceeds remaining balance or card not ACTIVE"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the stored parent version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalonManager
    description: "Owns configuration (stations, menu, add-ons, technicians), license/sanitation oversight, gift-card voiding, and commission settlement. Superset operator for read."
    identity: "opaque"
    exclusive_operations:
      - "POST /technicians and lifecycle (suspend/reinstate/terminate)"
      - "POST /stations, POST /menu-items, POST /menu-items/{id}/retire, POST /add-ons"
      - "POST /gift-cards/{id}/void"
      - "POST /commission-statements and settle/void"
    shared_operations:
      - "all booking/checkout operations (with FrontDesk)"
      - "POST /sanitation-logs (with Technician)"
      - "reads across all collections"

  - name: FrontDesk
    description: "Owns booking, deposits, confirmation, check-in, checkout, cancellation, no-show marking, gift-card issuance/redemption, client creation."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /clients, POST /appointments and the booking/checkout lifecycle (with SalonManager)"
      - "POST /gift-cards, POST /gift-cards/{id}/redeem (with SalonManager)"
      - "reads of clients, appointments, gift cards, stations, technicians"

  - name: Technician
    description: "Acts on own service lifecycle (start-service) and records sanitation cycles; reads own appointments and statements."
    identity: "entity_backed:Technician"
    exclusive_operations: []
    shared_operations:
      - "POST /sanitation-logs (with SalonManager)"
      - "POST /appointments/{id}/start-service (with SalonManager)"
      - "reads of own technician record, own appointments, own commission statements, stations, menu, add-ons"

  - name: Client
    description: "Acts on own appointments (cancel) and reads own data, appointments, and gift cards."
    identity: "entity_backed:Client"
    exclusive_operations: []
    shared_operations:
      - "POST /appointments/{id}/cancel on own appointment (with FrontDesk/SalonManager)"
      - "reads of own client record, own appointments, own gift cards, single appointment"
