        distinguishing_aspect: "RX_CHANGE_GRACE_DAYS 30 uses <=: a claim filed exactly 30 days after delivery charges 0, whereas the CUSTOMER_DAMAGE branch on the same lab order would charge floor(6000*0.5)+1500 == 4500."
        test_recipe:
