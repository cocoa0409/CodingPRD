  # ===========================================================================
  - section: consistency_model
    instances:
      - name: erosion_visible_immediately_in_same_request
        claim_type: immediate
        grounds:
          - calculations.aggregate_erosion
          - entities.Policy.fields.general_aggregate_remaining_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / aggregate_erosion_per_occurrence_then_aggregate_cap
