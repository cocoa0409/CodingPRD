              as_user_id: "${ath}"
              captures: { reg: $.data.id }
            - call: "POST /registrations/${reg}/pay"
              as: Athlete
              as_user_id: "${ath}"
            - call: "POST /registrations/${reg}/confirm"
              as: RaceDirector
            - call: "POST /events/${ev}/safety-assessments"
              payload: { water_temp_celsius: 20.0, lightning_within_10km: false }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-14T10:00:00Z" }
              as: RaceDirector
            - call: "POST /registrations/${reg}/check-in-bike"
              payload: { bib_code: "BIB-1" }
              as: Athlete
              as_user_id: "${ath}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T08:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/start"
              as: RaceDirector
            - call: "POST /registrations/${reg}/penalties"
              payload: { kind: "EQUIPMENT" }
              as: Referee
              as_user_id: "ref-1"
              captures: { pen: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T08:30:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/run-ops"
              as: RaceDirector
            - call: "GET /penalties/${pen}"
              as: RaceDirector
              captures: { st1: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T09:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/run-ops"
              as: RaceDirector
            - call: "GET /penalties/${pen}"
              as: RaceDirector
              captures: { st2: $.data.status }
            - call: "GET /registrations/${reg}/results"
              as: RaceDirector
              captures: { ptot: $.data.0.penalty_seconds_total }
          assert:
            - "run-ops at 08:30 (inside window): penalty still ASSESSED"
            - "run-ops at 09:00 (window expires at 09:00, expires_at <= clock): penalty CONFIRMED"
            - "Result.penalty_seconds_total == 60 after confirmation (was 0 while ASSESSED)"

  # ===========================================================================
  # Section: consistency model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_side_effects
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "All side effects are visible in the same request's response: confirm returns the registration with wave_id and age_at_event already stamped; check-in-bike returns the BikeCheck while a follow-up GET shows the registration RACKED and Result created — no lag."
        test_recipe:
          setup: ["PUBLISHED event; athlete PAID"]
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri A", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/road-segments"
              payload: { name: "Main", length_km: 5.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg: $.data.id }
            - call: "POST /road-segments/${seg}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per: $.data.id }
            - call: "POST /permits/${per}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${per}/approve"
              as: PermitCoordinator
            - call: "POST /events/${ev}/advance"
              as: RaceDirector
            - call: "POST /events/${ev}/waves"
              payload: { label: "W1", division: "AGE_GROUP", scheduled_start_time: "2026-10-15T08:00:00Z", capacity: 2, draft_legal: false, age_band_min: 18, age_band_max: 39 }
              as: RaceDirector
              captures: { w: $.data.id }
            - call: "POST /events/${ev}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 1, required_water_units: 50 }
              as: RaceDirector
              captures: { asx: $.data.id }
            - call: "POST /aid-stations/${asx}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va: $.data.id }
            - call: "POST /volunteer-assignments/${va}/confirm"
              as: VolunteerCoordinator
            - call: "POST /events/${ev}/allocate-water"
              as: RaceDirector
            - call: "POST /events/${ev}/advance"
              as: RaceDirector
            - call: "POST /events/${ev}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { ath: $.data.id }
            - call: "POST /events/${ev}/registrations"
              payload: { athlete_id: "${ath}", division: "AGE_GROUP", entry_fee_cents: 10000 }
              as: Athlete
              as_user_id: "${ath}"
              captures: { reg: $.data.id }
            - call: "POST /registrations/${reg}/pay"
              as: Athlete
              as_user_id: "${ath}"
          trigger:
            - call: "POST /registrations/${reg}/confirm"
              as: RaceDirector
              captures: { cst: $.data.status, cwv: $.data.wave_id, cage: $.data.age_at_event }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-14T10:00:00Z" }
              as: RaceDirector
            - call: "POST /registrations/${reg}/check-in-bike"
              payload: { bib_code: "BIB-1" }
              as: Athlete
              as_user_id: "${ath}"
              captures: { bcst: $.data.status }
            - call: "GET /registrations/${reg}"
              as: RaceDirector
              captures: { rst: $.data.status }
            - call: "GET /registrations/${reg}/results"
              as: RaceDirector
              captures: { rstat: $.data.0.status }
          assert:
            - "confirm response already carries status CONFIRMED, wave_id == ${w}, age_at_event == 36"
            - "check-in response carries BikeCheck status CHECKED_IN; immediate GET shows registration RACKED"
            - "Result exists immediately with status PROVISIONAL (created by check-in side effect)"
