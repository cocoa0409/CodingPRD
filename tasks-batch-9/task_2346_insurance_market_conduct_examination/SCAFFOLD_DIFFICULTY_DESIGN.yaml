          assert:
            - "Setup: Criticism restitution_method == SAMPLE_ACTUAL with restitution_exposure_cents == 50333 (a MINOR criticism does not extrapolate even on a breached area)"
            - "Setup: MultistateCollaboration.${collab_id}.lead_state_code == AZ (equal policy counts, state_code ASC tie-break, UT excluded for lack of examiner resources) and participant_count == 3"
            - "Setup: ConsentOrder penalty_gross_cents == 75000, cooperation_credit_pct == 0.05, penalty_net_cents == 71250, order_total_cents == 121583, status EXECUTED"
            - "The first allocate-restitution returns 200 with status SETTLED and allocation_completed_at set"
            - "Allocations after the sweep are AZ 16778, NV 16778 and UT 16777 (floor 16777 each, 2-cent remainder to AZ then NV)"
            - "NV does NOT receive 16779 and UT does not receive 16778 - the sweep hands out exactly one cent per participant in order"
            - "allocated_total_cents == 50333 == Examination.${exam_id}.aggregate_restitution_cents (exact conservation, no drift)"
            - "The second allocate-restitution returns 409 ERR_ENFORCEMENT_RECORD_STATE_INVALID and the stored allocations are byte-identical afterwards (no double application)"
            - "Insurer.${aurora_id}.lifetime_restitution_ordered_cents == 50333"

      - name: criticism_withdrawal_releases_the_pending_pool_without_touching_the_aggregate
        grounds:
          - state_machines.Criticism
          - entities.Examination.fields.pending_restitution_cents
          - entities.Examination.fields.aggregate_restitution_cents
          - entities.Examination.fields.penalty_units_total
          - calculations.penalty_determination
        distinguishing_aspect: |
          The compensating branch of finalization: WITHDRAWN and SUSTAINED both drain
          pending_restitution_cents by exactly the criticism's frozen exposure, but only SUSTAINED credits
          the aggregate. Withdrawing the 50333-cent criticism must therefore leave the aggregate at
          20132000 - not the 20182333 that was once pending - so a withdrawal is a clean release rather
          than a transfer, and the consent order priced afterwards is unaffected by the withdrawn item.
        test_recipe:
          setup:
            - "SETUP-CHAIN-A: AURORA carrier, ON_SITE examination 2026-09-01 .. 2026-11-30, CLAIMS area population 4000 / sample 10 fully reviewed with 3 MATERIAL errors 25000 / 18000 / 7333 -> tolerance_breached true, area TESTED, examination CRITICISM."
            - "Two criticisms on that area, both answered by the carrier and therefore RESPONDED: C1 MATERIAL affected_file_count 3 (POPULATION_EXTRAPOLATED, exposure 20132000) and C2 MINOR affected_file_count 1 (SAMPLE_ACTUAL, exposure 50333)."
            - "Examination pending_restitution_cents 20182333, aggregate_restitution_cents 0, sustained_criticism_count 0, penalty_units_total 0, open_criticism_count 2."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { exam_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/scope-areas"
              payload: { area: "CLAIMS", population_size: 4000, sample_size: 10 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_area_id: "$.data.id" }
            - call: "POST /market-conduct/examinations/${exam_id}/lock-scope"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
            - call: "POST /market-conduct/scope-areas/${clm_area_id}/data-calls"
              payload: { records_requested: 4000, response_due_date: "2026-09-15" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { clm_dc_id: "$.data.id" }
            - call: "POST /market-conduct/data-calls/${clm_dc_id}/respond"
              payload: { records_received: 4000, submitted_by_contact: "D. Reyes, Compliance Director" }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
            - call: "POST /market-conduct/data-calls/${clm_dc_id}/disposition"
              payload: { disposition: "ACCEPTED", disposition_reason: "Production complete and on time." }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
            - call: "POST /market-conduct/examinations/${exam_id}/fieldwork-activities"
              payload: { activity_type: "SYSTEM_WALKTHROUGH", area: "CLAIMS", participant_name: "R. Vance", participant_title: "VP Claims Operations", summary: "Walked the claims adjudication platform end to end with the carrier.", evidence_ref: "WP-CLM-01" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
            - call: "POST /market-conduct/examinations/${exam_id}/fieldwork-activities"
              payload: { activity_type: "INTERVIEW", area: "CLAIMS", participant_name: "L. Ortiz", participant_title: "Claims Manager", summary: "Interviewed the claims manager on prompt-pay handling and denials.", evidence_ref: "WP-CLM-02" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
            - call: "POST /market-conduct/data-calls/${clm_dc_id}/bulk-review"
              payload:
                reviews:
                  - { file_reference: "CLM-000001", error_severity: "MATERIAL", underpaid_amount_cents: 25000, days_to_pay: 61 }
                  - { file_reference: "CLM-000401", error_severity: "MATERIAL", underpaid_amount_cents: 18000, days_to_pay: 47 }
                  - { file_reference: "CLM-000801", error_severity: "MATERIAL", underpaid_amount_cents: 7333, days_to_pay: 39 }
                  - { file_reference: "CLM-001201", error_severity: "NONE" }
                  - { file_reference: "CLM-001601", error_severity: "NONE" }
                  - { file_reference: "CLM-002001", error_severity: "NONE" }
                  - { file_reference: "CLM-002401", error_severity: "NONE" }
                  - { file_reference: "CLM-002801", error_severity: "NONE" }
                  - { file_reference: "CLM-003201", error_severity: "NONE" }
                  - { file_reference: "CLM-003601", error_severity: "NONE" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { bulk_area_status: "$.data.scope_area_status", bulk_error_rate: "$.data.error_rate_pct", bulk_breached: "$.data.tolerance_breached" }
            - call: "POST /market-conduct/criticisms"
              payload: { exam_id: "${exam_id}", scope_area_id: "${clm_area_id}", statute_citation: "NRS 686A.310(1)(e)", severity: "MATERIAL", affected_file_count: 3 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { c1_id: "$.data.id", c1_exposure: "$.data.restitution_exposure_cents" }
            - call: "POST /market-conduct/criticisms/${c1_id}/responses"
              payload: { position: "DISPUTE", narrative: "The carrier disputes the three cited claim files." }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
            - call: "POST /market-conduct/criticisms"
              payload: { exam_id: "${exam_id}", scope_area_id: "${clm_area_id}", statute_citation: "NRS 686A.310(1)(n)", severity: "MINOR", affected_file_count: 1 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { c2_id: "$.data.id", c2_exposure: "$.data.restitution_exposure_cents" }
            - call: "POST /market-conduct/criticisms/${c2_id}/responses"
              payload: { position: "CONCUR", narrative: "The carrier concurs with the documentation finding." }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
          trigger:
            - call: "POST /market-conduct/criticisms/${c1_id}/finalize"
              payload: { disposition: "SUSTAINED", penalty_units: 12, disposition_note: "Sustained: the extrapolation stands." }
              as: SupervisingExaminer
              as_user_id: "22222222-2222-2222-2222-222222222222"
              captures: { c1_status: "$.data.status" }
            - call: "POST /market-conduct/criticisms/${c2_id}/finalize"
              payload: { disposition: "WITHDRAWN", penalty_units: 4, disposition_note: "Withdrawn: the documentation defect was a department indexing error." }
              as: SupervisingExaminer
              as_user_id: "22222222-2222-2222-2222-222222222222"
              captures: { c2_status: "$.data.status", c2_units: "$.data.penalty_units" }
            - call: "GET /market-conduct/examinations/${exam_id}/exposure-summary"
              as: SupervisingExaminer
