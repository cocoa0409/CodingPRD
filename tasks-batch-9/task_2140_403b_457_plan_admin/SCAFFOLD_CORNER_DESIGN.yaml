  # =========================================================================
  - section: endpoints
    instances:

      - name: logical_clock_defaults_to_2026_08_01_before_any_set_call
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /plan-admin/_clock/set_current_utc]
          - entities.InformationSharingAgreement.fields.data_stale
        distinguishing_aspect: "Before any clock call the server reads exactly 2026-08-01T00:00:00Z, so the first set_current_utc response reports previous_utc == 2026-08-01T00:00:00Z and a data feed dated 2026-08-02 posted beforehand would already be in the future."
        test_recipe:
          setup:
            - "Server freshly started; no clock call has been made."
          setup_api_calls:
            - call: "POST /plan-admin/employers"
              payload: { legal_name: "Riverbend Unified School District", ein: "11-1111111", entity_type: "PUBLIC_SCHOOL", organization_subtype: "SCHOOL", total_employee_count: 400 }
              as: SystemOperator
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: SystemOperator
            - call: "POST /plan-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          assert:
            - "the first set_current_utc response reports previous_utc == 2026-08-01T00:00:00Z, proving the startup default rather than real wall-clock time"
            - "the first set_current_utc response reports current_utc == 2026-09-30T00:00:00Z"
            - "the second response reports previous_utc == 2026-09-30T00:00:00Z and current_utc == 2026-08-01T00:00:00Z"

