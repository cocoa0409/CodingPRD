          The three-point curve is tested at its exact lower knot and one tick under it: 4.00 achieved against a
          4.00 threshold pays exactly threshold_payout_pct 50.00, while 3.99 pays 0.00 rather than interpolating
          downward, and 6.00 at the maximum pays 200.00 with no extrapolation. Weighted at 40/30/30 that is
