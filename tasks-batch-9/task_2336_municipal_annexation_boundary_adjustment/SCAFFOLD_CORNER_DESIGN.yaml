  # =====================================================================================
  # SECTION 2 — State Machines
  # =====================================================================================
  - section: state_machines
    instances:
      - name: new_case_and_parcel_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.AnnexationCase.initial_state
          - entities.AnnexationCase.fields.tax_roll_status
          - entities.Parcel.fields.parcel_status
        distinguishing_aspect: |
          A freshly created case starts DRAFT on the procedural axis AND NOT_TRANSFERRED on the
          independent tax-roll axis, with protest_outcome NOT_EVALUATED, referendum_result
          NOT_HELD, commission_review_status NOT_REQUIRED and every aggregate at 0; its first
          parcel starts PROPOSED. Neither dimension is pre-advanced by creation.
        test_recipe:
          setup:
            - "One Municipality under a statute authorizing INVOLUNTARY_ORDINANCE, and one PropertyOwner."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_is: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_is}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_is: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_is: $.data.id }
          trigger:
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_is}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 4, developed_lot_count: 4, dwelling_units: 8 }
              as: MunicipalPlanner
              as_user_id: "${muni_is}"
              captures: { case_is: $.data.id, is_status: $.data.status, is_tax: $.data.tax_roll_status, is_ver: $.data.version }
            - call: "POST /annexation-cases/${case_is}/parcels"
              payload: { primary_owner_id: "${ow_is}", parcel_apn: "IS-1", assessed_value_cents: 40000000, acreage: 5.00, is_developed: true, dwelling_units: 2 }
              as: MunicipalPlanner
              as_user_id: "${muni_is}"
              captures: { parcel_is: $.data.id, is_pstatus: $.data.parcel_status }
          assert:
            - "${is_status} == DRAFT"
            - "${is_tax} == NOT_TRANSFERRED"
            - "${is_ver} == 1"
            - "${is_pstatus} == PROPOSED"
            - "AnnexationCase.${case_is}.case_type == ANNEXATION"
            - "AnnexationCase.${case_is}.protest_outcome == NOT_EVALUATED"
            - "AnnexationCase.${case_is}.referendum_result == NOT_HELD"
            - "AnnexationCase.${case_is}.commission_review_status == NOT_REQUIRED"
            - "AnnexationCase.${case_is}.contiguity_ratio == 0"
            - "AnnexationCase.${case_is}.qualification_index == 0"
            - "AnnexationCase.${case_is}.urban_development_qualified == false"
            - "AnnexationCase.${case_is}.tax_roll_transferred_tax_cents == 0"
            - "Parcel.${parcel_is}.annual_tax_cents == 0"
            - "Parcel.${parcel_is}.prorated_tax_cents == 0"
            - "AnnexationCase.${case_is}.version == 2"

