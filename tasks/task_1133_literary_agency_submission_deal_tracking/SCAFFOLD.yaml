# =============================================================================
# Task 1133: Literary Agency Submission & Deal Tracking — scaffold seed tables
# Flat resource topology: every collection lives at top level; agency scoping is
# carried by agency_id fields and tenant-scoped existence checks.
# =============================================================================

scenario: |
  generate task hard than expert level! 1133. Literary Agency Submission & Deal
  Tracking (literary agency): query intake & slush pile triage, manuscript request
  & reader evaluation, client signing & representation agreement, submission list
  to editors & response tracking, offer/auction management & deal terms, contract
  negotiation & subsidiary rights (film/foreign/audio), royalty statement review &
  audit, advance payment schedule & commission

domain_name: literary-agency
api_prefix: ""

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation    # offer/auction/contract negotiation across Agent, Editor, ContractsManager
  secondary_archetype: ledger_reconciliation    # royalty statements, advance earn-out, commission accrual
  complexity_layers:
    - optimistic_concurrency                    # OCC on Deal.version and SubmissionRound.version
    - cascading_side_effects                    # auction award supersedes losers; period close lapse cascade; deal termination waiver
    - dual_variant_calculation                  # provisional vs final commission; frontlist vs backlist auction valuation; NET vs RETAIL royalty basis
    - rate_threshold_triggers                   # tiered royalty escalators, slush capacity gate, eval-score threshold
  entity_topology: flat                         # peer collections with FK references; no URL nesting
  state_machine_shape: branching                # cyclic revision loop on Manuscript; cyclic audit loop on RoyaltyStatement; cyclic negotiation loop on Offer
  relationship_patterns:
    - one_to_many
    - many_to_many                              # Submission joins SubmissionRound x Editor
    - cross_aggregate                           # Deal references Offer + Submission + ClientAgreement; RoyaltyStatement references Deal
  role_model: approval_chain                    # Agent -> ContractsManager -> RoyaltiesAccountant, with segregation of duties on offer accept / deal execute
  consistency_model: immediate

# =============================================================================
# §1.0: Response Envelope (FIXED — do not edit)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Agency legal name" }
      - { name: commission_pct, type: number, source: input, description: "Default agency commission fraction (e.g. 0.15); used when ClientAgreement.commission_pct_override is null" }
      - { name: slush_capacity, type: integer, source: input, description: "Maximum number of QueryLetters allowed in states RECEIVED or IN_REVIEW at any instant; intake beyond this is rejected" }
      - { name: period_index, type: integer, source: system, default: 0, description: "Current royalty period counter, increments via close-period" }
      - { name: books_closed_through_period_index, type: integer, source: system, default: null, description: "Most recently closed royalty period (null = nothing closed)" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | INTAKE_PAUSED — derived from open slush count vs slush_capacity" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owning agency" }
      - { name: display_name, type: string, source: input, description: "Agent full name" }
      - { name: email, type: string, source: input, description: "Unique per agency" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }
      - { name: open_query_count, type: integer, source: computed, description: "QueryLetters assigned to this agent in RECEIVED or IN_REVIEW" }

  - name: Author
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; owning agency" }
      - { name: display_name, type: string, source: input, description: "Author pen/legal name" }
      - { name: email, type: string, source: input, description: "Unique per agency" }
      - { name: status, type: enum, source: system, description: "PROSPECT | CLIENT | FORMER" }

  - name: Editor
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; rolodex of editors the agency submits to" }
      - { name: display_name, type: string, source: input, description: "Editor full name" }
      - { name: imprint, type: string, source: input, description: "Publishing imprint/house label" }
      - { name: email, type: string, source: input, description: "Unique per agency" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }

  - name: QueryLetter
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; denormalized from Author.agency_id at intake" }
      - { name: author_id, type: string, source: input, description: "FK -> Author.id; submitting author" }
      - { name: assigned_agent_id, type: string, source: system, description: "FK -> Agent.id; agent triaging the query; null while unassigned" }
      - { name: genre, type: enum, source: input, description: "FICTION | NONFICTION | YA | MEMOIR" }
      - { name: word_count, type: integer, source: input, description: "Manuscript word count claimed in query" }
      - { name: triage_score, type: integer, source: computed, description: "0-100 score computed by slush_triage_score at intake" }
      - { name: requested_period_index, type: integer, source: system, description: "Agency period when status became REQUESTED; null until then" }
      - { name: status, type: enum, source: system, description: "RECEIVED | IN_REVIEW | REQUESTED | REJECTED | WITHDRAWN | LAPSED" }

  - name: Manuscript
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; copied from QueryLetter" }
      - { name: query_letter_id, type: string, source: system, description: "FK -> QueryLetter.id; source query" }
      - { name: author_id, type: string, source: system, description: "FK -> Author.id; copied from QueryLetter.author_id" }
      - { name: reader_agent_id, type: string, source: system, description: "FK -> Agent.id; agent performing reader evaluation; set at creation to the requesting agent, reassignable" }
      - { name: title, type: string, source: input, description: "Manuscript title (supplied on request-manuscript)" }
      - { name: revision_round, type: integer, source: system, default: 0, description: "Number of REVISION_REQUESTED loops consumed; hard cap 2" }
      - { name: eval_score, type: integer, source: computed, description: "0-100 reader evaluation score; null until evaluated" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | READER_ASSIGNED | EVALUATED | REVISION_REQUESTED | ACCEPTED | DECLINED" }

  - name: ClientAgreement
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; copied from Manuscript" }
      - { name: author_id, type: string, source: input, description: "FK -> Author.id; prospective client" }
      - { name: manuscript_id, type: string, source: input, description: "FK -> Manuscript.id; manuscript this agreement covers" }
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; signing agent" }
      - { name: commission_pct_override, type: number, source: input, description: "Optional per-agreement commission fraction; null = use Agency.commission_pct at event time" }
      - { name: exclusive, type: boolean, source: input, default: true, description: "Whether the agency has exclusive worldwide representation for this manuscript" }
      - { name: status, type: enum, source: system, description: "DRAFT | OFFERED | SIGNED | DECLINED_BY_AUTHOR | TERMINATED" }
      - { name: signed_period_index, type: integer, source: system, description: "Agency period when SIGNED; null until signed" }

  - name: SubmissionRound
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; copied from Manuscript" }
      - { name: manuscript_id, type: string, source: input, description: "FK -> Manuscript.id; manuscript on submission" }
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; agent running the round" }
      - { name: round_index, type: integer, source: system, description: "1-based round number for this manuscript" }
      - { name: max_editors, type: integer, source: input, description: "Cap on live submissions (QUEUED, SENT, UNDER_CONSIDERATION, OFFER_EXTENDED) in this round; >= 1" }
      - { name: auction_mode, type: boolean, source: input, default: false, description: "If true, offers are ranked by auction_ranking and only auction_rank == 1 is acceptable" }
      - { name: valuation_mode, type: enum, source: input, default: "FRONTLIST", description: "FRONTLIST | BACKLIST — selects the auction_ranking variant" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED" }

  - name: Submission
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; copied from SubmissionRound" }
      - { name: submission_round_id, type: string, source: input, description: "FK -> SubmissionRound.id; owning round" }
      - { name: editor_id, type: string, source: input, description: "FK -> Editor.id; editor receiving the manuscript" }
      - { name: sent_period_index, type: integer, source: system, description: "Agency period when marked SENT; null until sent" }
      - { name: response_period_index, type: integer, source: system, description: "Agency period when a terminal response recorded; null until responded" }
      - { name: status, type: enum, source: system, description: "QUEUED | SENT | UNDER_CONSIDERATION | PASSED | OFFER_EXTENDED | WITHDRAWN" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; copied from Submission" }
      - { name: submission_id, type: string, source: input, description: "FK -> Submission.id; the submission this offer answers" }
      - { name: advance_cents, type: integer, source: input, description: "Offered advance against royalties" }
      - { name: royalty_pct_hardcover, type: number, source: input, description: "Royalty fraction on hardcover receipts" }
      - { name: royalty_pct_trade, type: number, source: input, description: "Royalty fraction on trade paperback receipts" }
      - { name: royalty_pct_ebook, type: number, source: input, description: "Royalty fraction on ebook receipts" }
      - { name: royalty_basis, type: enum, source: input, default: "NET", description: "NET | RETAIL — selects the royalty_reconciliation variant for the resulting Deal" }
      - { name: includes_film_rights, type: boolean, source: input, default: false, description: "Publisher demands film/TV subsidiary rights" }
      - { name: includes_foreign_rights, type: boolean, source: input, default: false, description: "Publisher demands foreign-language subsidiary rights" }
      - { name: includes_audio_rights, type: boolean, source: input, default: false, description: "Publisher demands audio subsidiary rights" }
      - { name: auction_rank, type: integer, source: computed, description: "1-based rank per auction_ranking; non-null only while parent round is auction_mode and offer is live" }
      - { name: status, type: enum, source: system, description: "RECEIVED | UNDER_NEGOTIATION | ACCEPTED | DECLINED | WITHDRAWN_BY_EDITOR | SUPERSEDED" }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; copied from Offer" }
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id; winning offer this deal is negotiated from" }
      - { name: submission_id, type: string, source: system, description: "FK -> Submission.id; denormalized from Offer.submission_id at deal creation" }
      - { name: client_agreement_id, type: string, source: system, description: "FK -> ClientAgreement.id; SIGNED agreement covering the manuscript, resolved via Submission -> SubmissionRound -> Manuscript" }
      - { name: advance_cents, type: integer, source: input, description: "Negotiated advance; copied from Offer at creation, amendable via PATCH while NEGOTIATING" }
      - { name: royalty_basis, type: enum, source: system, description: "NET | RETAIL; copied from Offer.royalty_basis at deal creation, immutable" }
      - { name: retains_film_rights, type: boolean, source: system, description: "True = agency retains film/TV rights for the author; initialized to NOT Offer.includes_film_rights" }
      - { name: retains_foreign_rights, type: boolean, source: system, description: "True = agency retains foreign rights; initialized to NOT Offer.includes_foreign_rights" }
      - { name: retains_audio_rights, type: boolean, source: system, description: "True = agency retains audio rights; initialized to NOT Offer.includes_audio_rights" }
      - { name: advance_earned_out_cents, type: integer, source: computed, default: 0, description: "Cumulative author net royalties applied against the advance per advance_earnout; capped at advance_cents" }
      - { name: executed_period_index, type: integer, source: system, description: "Agency period when EXECUTED; null until executed" }
      - { name: status, type: enum, source: system, description: "NEGOTIATING | EXECUTED | ACTIVE | TERMINATED" }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; copied from Deal" }
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; deal this statement covers" }
      - { name: period_index, type: integer, source: input, description: "Agency period being reported; must satisfy books_closed_through_period_index < period_index <= agency.period_index at intake" }
      - { name: units_hardcover, type: integer, source: input, description: "Units sold hardcover (>= 0)" }
      - { name: units_trade, type: integer, source: input, description: "Units sold trade paperback (>= 0)" }
      - { name: units_ebook, type: integer, source: input, description: "Units sold ebook (>= 0)" }
      - { name: net_receipts_hardcover_cents, type: integer, source: input, description: "Publisher receipts hardcover (retail gross when Deal.royalty_basis == RETAIL)" }
      - { name: net_receipts_trade_cents, type: integer, source: input, description: "Publisher receipts trade paperback" }
      - { name: net_receipts_ebook_cents, type: integer, source: input, description: "Publisher receipts ebook" }
      - { name: publisher_reported_royalty_cents, type: integer, source: input, description: "Royalty figure printed on the publisher statement" }
      - { name: gross_royalty_cents, type: integer, source: computed, description: "Author royalty before agency commission, per royalty_reconciliation; null until reconciled" }
      - { name: agency_commission_cents, type: integer, source: computed, description: "Agency commission withheld on this statement, per commission_split; null until reconciled" }
      - { name: author_net_cents, type: integer, source: computed, description: "gross_royalty_cents - agency_commission_cents; null until reconciled" }
      - { name: variance_cents, type: integer, source: computed, description: "publisher_reported_royalty_cents - gross_royalty_cents; null until reconciled" }
      - { name: status, type: enum, source: system, description: "RECEIVED | RECONCILED | AUDIT_OPEN | AUDIT_RESOLVED | CLEARED" }

  - name: AdvanceInstallment
    parent: null
    common_fields: true
    fields:
      - { name: agency_id, type: string, source: system, description: "FK -> Agency.id; copied from Deal" }
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; deal paying the advance" }
      - { name: milestone, type: enum, source: system, description: "ON_SIGNING | ON_DELIVERY | ON_PUBLICATION" }
      - { name: amount_cents, type: integer, source: computed, description: "Installment amount per advance_waterfall" }
      - { name: due_period_index, type: integer, source: computed, description: "Agency period this installment falls due (executed+0 / +1 / +2 by milestone)" }
      - { name: paid_period_index, type: integer, source: system, description: "Agency period when marked PAID; null until paid" }
      - { name: agency_commission_cents, type: integer, source: computed, description: "Commission withheld on this installment per commission_split; null until paid" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DUE | PAID | LATE | WAIVED" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Agency
    initial_state: NORMAL
    terminal_states: []
    note: "Machine over computed field `posture`; transitions are system-driven"
    transitions:
      - from: NORMAL
        to: INTAKE_PAUSED
        trigger: "system (open slush count = count(QueryLetter.status IN {RECEIVED, IN_REVIEW}) reaches Agency.slush_capacity after any intake)"
        actor: system
        preconditions: []
        side_effects:
          - "POST /query-letters returns ERR_INTAKE_PAUSED while paused"

      - from: INTAKE_PAUSED
        to: NORMAL
        trigger: "system (open slush count drops strictly below Agency.slush_capacity after a reject, withdraw, lapse, or request-manuscript)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Agent
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /agents/{id}/deactivate"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "increments Agent.version by 1"

      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /agents/{id}/activate"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "increments Agent.version by 1"

  - entity: Editor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /editors/{id}/deactivate"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "increments Editor.version by 1"

      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /editors/{id}/activate"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "increments Editor.version by 1"

  - entity: Author
    initial_state: PROSPECT
    terminal_states: []
    note: "Status is driven by side effects of manuscript/agreement transitions; no direct endpoints"
    transitions:
      - from: PROSPECT
        to: CLIENT
        trigger: "system (Manuscript -> ACCEPTED, or ClientAgreement -> SIGNED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CLIENT
        to: FORMER
        trigger: "system (ClientAgreement -> TERMINATED and no other SIGNED agreements remain for this author)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: QueryLetter
    initial_state: RECEIVED
    terminal_states: [REJECTED, WITHDRAWN, LAPSED]
    transitions:
      - from: RECEIVED
        to: IN_REVIEW
        trigger: "POST /query-letters/{id}/assign"
        actor: Agent
        preconditions:
          - "payload agent_id references an ACTIVE Agent of the same agency (ERR_AGENT_INACTIVE)"
        side_effects:
          - "assigned_agent_id = payload.agent_id"
          - "Agent.open_query_count recomputed for prior and new agent"
          - "Agency posture re-evaluated"

      - from: IN_REVIEW
        to: REQUESTED
        trigger: "POST /query-letters/{id}/request-manuscript"
        actor: Agent
        preconditions:
          - "Acting agent (X-User-ID) must equal assigned_agent_id (ERR_NOT_ASSIGNED_AGENT)"
        side_effects:
          - "requested_period_index = agency.period_index"
          - "A Manuscript row is created (status=SUBMITTED, title from payload, reader_agent_id=assigned_agent_id, author_id and agency_id copied)"
          - "Agent.open_query_count recomputed (query leaves the open set)"
          - "Agency posture re-evaluated (open slush count drops by 1)"

      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /query-letters/{id}/reject"
        actor: Agent
        preconditions:
          - "Acting agent must equal assigned_agent_id (ERR_NOT_ASSIGNED_AGENT)"
        side_effects:
          - "Agent.open_query_count recomputed"
          - "Agency posture re-evaluated"

      - from: RECEIVED
        to: REJECTED
        trigger: "POST /query-letters/{id}/reject"
        actor: Agent
        preconditions: []
        side_effects:
          - "Agency posture re-evaluated"

      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /query-letters/{id}/withdraw"
        actor: Agent
        preconditions: []
        side_effects:
          - "Agency posture re-evaluated"

      - from: IN_REVIEW
        to: WITHDRAWN
        trigger: "POST /query-letters/{id}/withdraw"
        actor: Agent
        preconditions: []
        side_effects:
          - "Agent.open_query_count recomputed"
          - "Agency posture re-evaluated"

      - from: REQUESTED
        to: LAPSED
        trigger: "system (close-period sweep: closing period N lapses queries with requested_period_index <= N-1)"
        actor: system
        preconditions:
          - "Linked Manuscript.status IN {SUBMITTED, READER_ASSIGNED}"
        side_effects:
          - "Link 3 of the lapse cascade: the linked Manuscript -> DECLINED (caused by this lapse, not by close-period directly)"

  - entity: Manuscript
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DECLINED]
    note: "Cyclic revision loop EVALUATED -> REVISION_REQUESTED -> SUBMITTED -> READER_ASSIGNED -> EVALUATED, bounded by revision_round < 2"
    transitions:
      - from: SUBMITTED
        to: READER_ASSIGNED
        trigger: "POST /manuscripts/{id}/assign-reader"
        actor: Agent
        preconditions:
          - "payload agent_id references an ACTIVE Agent of the same agency (ERR_AGENT_INACTIVE)"
        side_effects:
          - "reader_agent_id = payload.agent_id"

      - from: READER_ASSIGNED
        to: EVALUATED
        trigger: "POST /manuscripts/{id}/evaluate"
        actor: Agent
        preconditions:
          - "Acting agent must equal reader_agent_id (ERR_NOT_ASSIGNED_AGENT)"
          - "payload eval_score in [0, 100] (ERR_INVALID_REQUEST)"
        side_effects:
          - "eval_score = payload.eval_score"

      - from: EVALUATED
        to: REVISION_REQUESTED
        trigger: "POST /manuscripts/{id}/request-revision"
        actor: Agent
        preconditions:
          - "revision_round < 2 (ERR_REVISION_LIMIT_REACHED)"
        side_effects:
          - "revision_round += 1"

      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /manuscripts/{id}/resubmit"
        actor: Agent
        preconditions: []
        side_effects: []

      - from: EVALUATED
        to: ACCEPTED
        trigger: "POST /manuscripts/{id}/accept"
        actor: Agent
        preconditions:
          - "eval_score >= 70 (ERR_SCORE_BELOW_THRESHOLD)"
        side_effects:
          - "Author.status -> CLIENT"

      - from: EVALUATED
        to: DECLINED
        trigger: "POST /manuscripts/{id}/decline"
        actor: Agent
        preconditions: []
        side_effects: []

  - entity: ClientAgreement
    initial_state: DRAFT
    terminal_states: [DECLINED_BY_AUTHOR, TERMINATED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /client-agreements/{id}/offer"
        actor: Agent
        preconditions:
          - "Manuscript.status == ACCEPTED (ERR_MANUSCRIPT_NOT_ACCEPTED)"
          - "Acting agent equals ClientAgreement.agent_id (ERR_NOT_ASSIGNED_AGENT)"
        side_effects: []

      - from: OFFERED
        to: SIGNED
        trigger: "POST /client-agreements/{id}/sign"
        actor: Agent
        preconditions:
          - "No other ClientAgreement with the same manuscript_id is SIGNED (ERR_AGREEMENT_ALREADY_SIGNED)"
        side_effects:
          - "signed_period_index = agency.period_index"
          - "Author.status -> CLIENT"

      - from: OFFERED
        to: DECLINED_BY_AUTHOR
        trigger: "POST /client-agreements/{id}/decline"
        actor: Agent
        preconditions: []
        side_effects: []

      - from: SIGNED
        to: TERMINATED
        trigger: "POST /client-agreements/{id}/terminate"
        actor: ContractsManager
        preconditions:
          - "No Deal with client_agreement_id == this agreement is in NEGOTIATING, EXECUTED, or ACTIVE (ERR_DEAL_STILL_OPEN)"
        side_effects:
          - "Author.status -> FORMER if no other SIGNED agreements remain for the author"

  - entity: SubmissionRound
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /submission-rounds/{id}/open"
        actor: Agent
        preconditions:
          - "expected_submission_round_version == SubmissionRound.version (ERR_STALE_VERSION, 412)"
          - "A SIGNED ClientAgreement exists for manuscript_id (ERR_AGREEMENT_NOT_SIGNED)"
          - "No other SubmissionRound for the same manuscript_id is OPEN (ERR_ROUND_ALREADY_OPEN)"
          - "Round has at least one Submission in QUEUED (ERR_EMPTY_ROUND)"
        side_effects:
          - "increments SubmissionRound.version by 1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /submission-rounds/{id}/close"
        actor: Agent
        preconditions:
          - "No Submission in this round is UNDER_CONSIDERATION or OFFER_EXTENDED (ERR_ROUND_HAS_LIVE_SUBMISSIONS)"
          - "No Offer on submissions in this round is RECEIVED or UNDER_NEGOTIATION (ERR_ROUND_HAS_LIVE_OFFERS)"
        side_effects:
          - "QUEUED and SENT submissions in this round -> WITHDRAWN (releases any editor exclusivity window)"

  - entity: Submission
    initial_state: QUEUED
    terminal_states: [PASSED, WITHDRAWN]
    note: "OFFER_EXTENDED is non-terminal; the offer lifecycle can flip it back to PASSED by cascade"
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /submissions/{id}/send"
        actor: Agent
        preconditions:
          - "Parent SubmissionRound.status == OPEN (ERR_ROUND_NOT_OPEN)"
          - "Editor.status == ACTIVE (ERR_EDITOR_INACTIVE)"
          - "Editor exclusivity window: no other Submission to the same editor_id (any round, any manuscript) with status IN {SENT, UNDER_CONSIDERATION, OFFER_EXTENDED} and sent_period_index p such that agency.period_index < p + 2 (ERR_EDITOR_EXCLUSIVE_WINDOW)"
        side_effects:
          - "sent_period_index = agency.period_index"

      - from: SENT
        to: UNDER_CONSIDERATION
        trigger: "POST /submissions/{id}/mark-under-consideration"
        actor: Agent
        preconditions: []
        side_effects: []

      - from: SENT
        to: PASSED
        trigger: "POST /submissions/{id}/pass"
        actor: Agent
        preconditions: []
        side_effects:
          - "response_period_index = agency.period_index"

      - from: UNDER_CONSIDERATION
        to: PASSED
        trigger: "POST /submissions/{id}/pass"
        actor: Agent
        preconditions: []
        side_effects:
          - "response_period_index = agency.period_index"

      - from: SENT
        to: OFFER_EXTENDED
        trigger: "system (an Offer is created against this submission via POST /offers)"
        actor: system
        preconditions: []
        side_effects:
          - "response_period_index remains null (offer is not a terminal response)"

      - from: UNDER_CONSIDERATION
        to: OFFER_EXTENDED
        trigger: "system (an Offer is created against this submission via POST /offers)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OFFER_EXTENDED
        to: PASSED
        trigger: "system (cascade: the Offer on this submission becomes DECLINED, WITHDRAWN_BY_EDITOR, or SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "response_period_index = agency.period_index"

      - from: QUEUED
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw OR system (SubmissionRound closed)"
        actor: "Agent or system"
        preconditions: []
        side_effects: []

      - from: SENT
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw OR system (SubmissionRound closed)"
        actor: "Agent or system"
        preconditions: []
        side_effects: []

      - from: UNDER_CONSIDERATION
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw"
        actor: Agent
        preconditions: []
        side_effects: []

      - from: OFFER_EXTENDED
        to: WITHDRAWN
        trigger: "POST /submissions/{id}/withdraw"
        actor: Agent
        preconditions:
          - "Manual withdraw only: the Offer must first be DECLINED, WITHDRAWN_BY_EDITOR, or SUPERSEDED (ERR_OFFER_STILL_LIVE)"
        side_effects: []

  - entity: Offer
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, DECLINED, WITHDRAWN_BY_EDITOR, SUPERSEDED]
    note: "Cyclic negotiation loop RECEIVED -> UNDER_NEGOTIATION -> RECEIVED via revise"
    transitions:
      - from: RECEIVED
        to: UNDER_NEGOTIATION
        trigger: "POST /offers/{id}/negotiate"
        actor: Agent
        preconditions: []
        side_effects: []

      - from: UNDER_NEGOTIATION
        to: RECEIVED
        trigger: "POST /offers/{id}/revise (editor returns revised terms; negotiation round completes)"
        actor: Agent
        preconditions: []
        side_effects:
          - "advance_cents, royalty pcts, royalty_basis, rights flags overwritten from payload"
          - "auction_rank recomputed for all live offers in the round if auction_mode"

      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /offers/{id}/accept"
        actor: ContractsManager
        preconditions:
          - "Segregation of duties: X-User-ID must differ from the parent SubmissionRound.agent_id (ERR_SEGREGATION_OF_DUTIES)"
          - "If parent round auction_mode: this offer must have auction_rank == 1 among live offers (ERR_NOT_TOP_RANKED_OFFER)"
        side_effects:
          - "Link 1 of the award cascade: a Deal is created (status=NEGOTIATING, offer_id=this, advance_cents copied, royalty_basis copied, retains_* = NOT includes_*); every other Offer in this round in {RECEIVED, UNDER_NEGOTIATION} -> SUPERSEDED"
          - "Link 2 of the award cascade: each SUPERSEDED Offer's parent Submission (in OFFER_EXTENDED) -> PASSED (caused by the supersession, per the Submission machine)"
          - "Fan-out (not part of the counted chain): every other Submission in this round in {QUEUED, SENT, UNDER_CONSIDERATION} -> WITHDRAWN"

      - from: UNDER_NEGOTIATION
        to: ACCEPTED
        trigger: "POST /offers/{id}/accept"
        actor: ContractsManager
        preconditions:
          - "Segregation of duties: X-User-ID must differ from the parent SubmissionRound.agent_id (ERR_SEGREGATION_OF_DUTIES)"
          - "If parent round auction_mode: this offer must have auction_rank == 1 among live offers (ERR_NOT_TOP_RANKED_OFFER)"
        side_effects:
          - "Same award cascade as the RECEIVED -> ACCEPTED transition"

      - from: RECEIVED
        to: DECLINED
        trigger: "POST /offers/{id}/decline"
        actor: Agent
        preconditions: []
        side_effects:
          - "Parent Submission -> PASSED"

      - from: UNDER_NEGOTIATION
        to: DECLINED
        trigger: "POST /offers/{id}/decline"
        actor: Agent
        preconditions: []
        side_effects:
          - "Parent Submission -> PASSED"

      - from: RECEIVED
        to: WITHDRAWN_BY_EDITOR
        trigger: "POST /offers/{id}/editor-withdraw"
        actor: Agent
        preconditions: []
        side_effects:
          - "Parent Submission -> PASSED"

      - from: UNDER_NEGOTIATION
        to: WITHDRAWN_BY_EDITOR
        trigger: "POST /offers/{id}/editor-withdraw"
        actor: Agent
        preconditions: []
        side_effects:
          - "Parent Submission -> PASSED"

      - from: RECEIVED
        to: SUPERSEDED
        trigger: "system (cascade: another Offer in the same round is accepted)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent Submission (OFFER_EXTENDED) -> PASSED"

      - from: UNDER_NEGOTIATION
        to: SUPERSEDED
        trigger: "system (cascade: another Offer in the same round is accepted)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent Submission (OFFER_EXTENDED) -> PASSED"

  - entity: Deal
    initial_state: NEGOTIATING
    terminal_states: [TERMINATED]
    transitions:
      - from: NEGOTIATING
        to: EXECUTED
        trigger: "POST /deals/{id}/execute"
        actor: ContractsManager
        preconditions:
          - "expected_deal_version == Deal.version (ERR_STALE_VERSION, 412)"
          - "Segregation of duties: X-User-ID must differ from the parent SubmissionRound.agent_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "executed_period_index = agency.period_index"
          - "AdvanceInstallment rows created per advance_waterfall (ON_SIGNING due executed+0, ON_DELIVERY due executed+1, ON_PUBLICATION due executed+2)"
          - "The winning Submission (still OFFER_EXTENDED) -> WITHDRAWN"
          - "increments Deal.version by 1"

      - from: EXECUTED
        to: ACTIVE
        trigger: "system (first AdvanceInstallment for this Deal becomes PAID via mark-paid; close-period re-checks as a backstop)"
        actor: system
        preconditions:
          - "At least one AdvanceInstallment with status == PAID"
        side_effects: []

      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /deals/{id}/terminate"
        actor: ContractsManager
        preconditions:
          - "No RoyaltyStatement for this deal is in RECEIVED or AUDIT_OPEN (ERR_STATEMENTS_UNRESOLVED)"
        side_effects:
          - "Link 1 of the termination cascade: Deal -> TERMINATED"
          - "Link 2 of the termination cascade: every AdvanceInstallment of this Deal in {SCHEDULED, DUE} -> WAIVED (caused by the termination)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /deals/{id}/terminate"
        actor: ContractsManager
        preconditions:
          - "No RoyaltyStatement for this deal is in RECEIVED or AUDIT_OPEN (ERR_STATEMENTS_UNRESOLVED)"
        side_effects:
          - "Same termination cascade as EXECUTED -> TERMINATED (LATE installments are NOT waived; PAID stay PAID)"

  - entity: RoyaltyStatement
    initial_state: RECEIVED
    terminal_states: [CLEARED]
    note: "Cyclic audit loop RECONCILED -> AUDIT_OPEN -> AUDIT_RESOLVED -> AUDIT_OPEN (re-open) or -> CLEARED"
    transitions:
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /royalty-statements/{id}/reconcile"
        actor: RoyaltiesAccountant
        preconditions:
          - "Deal.status IN {EXECUTED, ACTIVE} (ERR_DEAL_NOT_LIVE)"
        side_effects:
          - "gross_royalty_cents per royalty_reconciliation (variant selected by Deal.royalty_basis)"
          - "agency_commission_cents and author_net_cents per commission_split (variant selected by ClientAgreement.commission_pct_override)"
          - "variance_cents = publisher_reported_royalty_cents - gross_royalty_cents"
          - "Deal.advance_earned_out_cents updated per advance_earnout (cap at advance_cents)"

      - from: RECONCILED
        to: AUDIT_OPEN
        trigger: "POST /royalty-statements/{id}/open-audit"
        actor: RoyaltiesAccountant
        preconditions:
          - "abs(variance_cents) > 500 (AUDIT_TOLERANCE_CENTS) (ERR_VARIANCE_WITHIN_TOLERANCE)"
          - "period_index > agency.books_closed_through_period_index (ERR_BOOKS_CLOSED)"
        side_effects: []

      - from: AUDIT_OPEN
        to: AUDIT_RESOLVED
        trigger: "POST /royalty-statements/{id}/resolve-audit"
        actor: RoyaltiesAccountant
        preconditions:
          - "payload carries all three adjusted net_receipts_*_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "net_receipts_*_cents overwritten from payload"
          - "gross_royalty_cents / agency_commission_cents / author_net_cents / variance_cents recomputed"
          - "Deal.advance_earned_out_cents adjusted by (new author_net_cents - old author_net_cents), clamped to [0, advance_cents]"

      - from: AUDIT_RESOLVED
        to: AUDIT_OPEN
        trigger: "POST /royalty-statements/{id}/open-audit (re-open when variance remains out of tolerance)"
        actor: RoyaltiesAccountant
        preconditions:
          - "abs(variance_cents) > 500 (ERR_VARIANCE_WITHIN_TOLERANCE)"
          - "period_index > agency.books_closed_through_period_index (ERR_BOOKS_CLOSED)"
        side_effects: []

      - from: AUDIT_RESOLVED
        to: CLEARED
        trigger: "POST /royalty-statements/{id}/clear"
        actor: RoyaltiesAccountant
        preconditions:
          - "abs(variance_cents) <= 500 (ERR_VARIANCE_UNRESOLVED)"
        side_effects: []

      - from: RECONCILED
        to: CLEARED
        trigger: "POST /royalty-statements/{id}/clear"
        actor: RoyaltiesAccountant
        preconditions:
          - "abs(variance_cents) <= 500 (ERR_VARIANCE_UNRESOLVED)"
        side_effects: []

  - entity: AdvanceInstallment
    initial_state: SCHEDULED
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system (close-period sweep: agency.period_index reaches due_period_index)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: PAID
        trigger: "POST /advance-installments/{id}/mark-paid"
        actor: RoyaltiesAccountant
        preconditions:
          - "Deal.status IN {EXECUTED, ACTIVE} (ERR_DEAL_NOT_LIVE)"
        side_effects:
          - "paid_period_index = agency.period_index"
          - "agency_commission_cents = floor(amount_cents * commission_pct) per commission_split"
          - "If this is the first PAID installment on the Deal: Deal EXECUTED -> ACTIVE"

      - from: DUE
        to: PAID
        trigger: "POST /advance-installments/{id}/mark-paid"
        actor: RoyaltiesAccountant
        preconditions:
          - "Deal.status IN {EXECUTED, ACTIVE} (ERR_DEAL_NOT_LIVE)"
        side_effects:
          - "Same as SCHEDULED -> PAID"

      - from: LATE
        to: PAID
        trigger: "POST /advance-installments/{id}/mark-paid"
        actor: RoyaltiesAccountant
        preconditions:
          - "Deal.status IN {EXECUTED, ACTIVE} (ERR_DEAL_NOT_LIVE)"
        side_effects:
          - "Same as SCHEDULED -> PAID"

      - from: DUE
        to: LATE
        trigger: "system (close-period sweep: agency.period_index advances past due_period_index with installment unpaid)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: WAIVED
        trigger: "system (cascade: Deal terminated)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DUE
        to: WAIVED
        trigger: "system (cascade: Deal terminated)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: deal-execute-stale-version
    parent_entity: Deal
    write_endpoint: "POST /deals/{dealId}/execute"
    occ_field: "expected_deal_version"
    description: |
      Executing a Deal whose version has advanced since the client last observed
      it is rejected. This captures the case where a contracts manager's view of
      the negotiated terms (advance_cents, rights flags) is stale because another
      writer amended the Deal via PATCH /deals/{id} between the read and the
      execute call.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: submission-round-open-stale-version
    parent_entity: SubmissionRound
    write_endpoint: "POST /submission-rounds/{roundId}/open"
    occ_field: "expected_submission_round_version"
    description: |
      Opening a SubmissionRound whose version has advanced since the client last
      observed it is rejected. Because open itself mutates the round (version
      increments on success), a second open carrying the pre-open version is
      rejected with 412 before any state check runs — the caller's view of the
      round composition is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: slush_triage_score
    trigger: "QueryLetter creation (triage_score computed once at intake)"
    algorithm: weighted_scoring
    formula: |
      factor_genre   = FICTION -> 40 | NONFICTION -> 30 | YA -> 25 | MEMOIR -> 10
      factor_length  = word_count IN [70000, 120000] -> 40
                       word_count IN [50000, 69999] OR [120001, 150000] -> 20
                       otherwise -> 5
      factor_author  = Author.status == CLIENT -> 20 | PROSPECT -> 10 | FORMER -> 0
      triage_score   = factor_genre + factor_length + factor_author
      (max = 40+40+20 = 100; min = 10+5+0 = 15)
    input_set: "the QueryLetter being created and its Author (status at intake time)"
    constants:
      W_GENRE_FICTION: 40
      W_GENRE_NONFICTION: 30
      W_GENRE_YA: 25
      W_GENRE_MEMOIR: 10
      W_LENGTH_SWEET: 40
      W_LENGTH_OK: 20
      W_LENGTH_OFF: 5
      W_AUTHOR_CLIENT: 20
      W_AUTHOR_PROSPECT: 10
      W_AUTHOR_FORMER: 0
    precision: "integer, no rounding"

  - name: auction_ranking
    trigger: "Offer create, Offer revise, or any live-offer set change (accept/supersede/decline/withdraw) while parent SubmissionRound.auction_mode == true"
    algorithm: weighted_scoring
    formula: |
      value_cents = advance_cents
                  + ROYALTY_WEIGHT_CENTS * (royalty_pct_hardcover + royalty_pct_trade + royalty_pct_ebook)
                  - RIGHTS_PENALTY_CENTS * (count of includes_film_rights + includes_foreign_rights + includes_audio_rights)
      Ranks: sort live offers by value_cents DESC; tie-break by Offer.created_at ASC
      (earliest created wins the tie). auction_rank is 1-based over the live set
      {RECEIVED, UNDER_NEGOTIATION}; ranks are gapless and recomputed whenever the
      live set changes. Non-auction rounds: auction_rank stays null.
    input_set: "all Offers in the same SubmissionRound with status IN {RECEIVED, UNDER_NEGOTIATION}"
    constants:
      FRONTLIST_ROYALTY_WEIGHT_CENTS: 100000
      FRONTLIST_RIGHTS_PENALTY_CENTS: 2500000
      BACKLIST_ROYALTY_WEIGHT_CENTS: 60000
      BACKLIST_RIGHTS_PENALTY_CENTS: 1000000
    precision: "integer cents"
    variants:
      - name: frontlist
        when: "SubmissionRound.valuation_mode == FRONTLIST (default)"
        difference: "ROYALTY_WEIGHT_CENTS = 100000, RIGHTS_PENALTY_CENTS = 2500000 — demanded subsidiary rights are heavily punished"
      - name: backlist
        when: "SubmissionRound.valuation_mode == BACKLIST"
        difference: "ROYALTY_WEIGHT_CENTS = 60000, RIGHTS_PENALTY_CENTS = 1000000 — identical offers can rank differently: with offers A(advance 2600000, pct-sum 0.20, 1 right) and B(advance 200000, pct-sum 0.10, 0 rights), frontlist ranks B first (210000 > 120000) while backlist ranks A first (1612000 > 206000)"

  - name: royalty_reconciliation
    trigger: "RoyaltyStatement reconcile and resolve-audit"
    algorithm: tiered_pricing
    formula: |
      For each format F in {hardcover, trade, ebook} with units_F > 0:
        avg_unit_F_cents = floor(net_receipts_F_cents / units_F)
      Hardcover (tier threshold 5000):
        base_units  = min(units_hardcover, 5000)
        esc_units   = max(0, units_hardcover - 5000)
        hc_royalty  = base_units * floor(avg_unit_hardcover_cents * pct_hardcover)
                    + esc_units  * floor(avg_unit_hardcover_cents * (pct_hardcover + ESCALATOR))
      Trade (tier threshold 7500): same shape with pct_trade and threshold 7500.
      Ebook (no tier):
        eb_royalty  = floor(net_receipts_ebook_cents * pct_ebook)     # whole-format multiply
      gross_royalty_cents = hc_royalty + trade_royalty + eb_royalty
      Rounding order is pinned: floor the per-unit average first, floor each
      per-line multiply second, sum last. (Summing receipts first and flooring
      once at the end yields different cents and is non-conformant.)
      pct_* inputs come from the Deal's winning Offer.
    input_set: "a single RoyaltyStatement; royalty pcts from the Deal's Offer; tier variant selected by Deal.royalty_basis"
    constants:
      TIER_THRESHOLD_HARDCOVER: 5000
      TIER_THRESHOLD_TRADE: 7500
      ESCALATOR_NET: 0.025
      ESCALATOR_RETAIL: 0.0125
      AUDIT_TOLERANCE_CENTS: 500
    precision: "integer cents; floor per line, then sum (order pinned above)"
    variants:
      - name: gross_basis
        when: "Deal.royalty_basis == NET (default) — receipts interpreted as publisher net receipts"
        difference: "ESCALATOR = 0.025 on both tiered formats"
      - name: retail_basis
        when: "Deal.royalty_basis == RETAIL — receipt fields interpreted as retail gross"
        difference: "ESCALATOR = 0.0125; for units 6000/8000/10000, receipts 6000000/3200000/1000000 and pcts 0.10/0.08/0.25, gross is 1120500 under retail_basis vs 1136000 under gross_basis"

  - name: commission_split
    trigger: "RoyaltyStatement reconcile and resolve-audit; AdvanceInstallment mark-paid"
    algorithm: aggregation
    formula: |
      commission_pct = ClientAgreement.commission_pct_override if not null
                       else Agency.commission_pct (read at the time of the triggering event)
      The ClientAgreement is resolved from the Deal: Deal -> Offer -> Submission ->
      SubmissionRound -> Manuscript -> ClientAgreement with status SIGNED for that manuscript.
      On royalty statement:   agency_commission_cents = floor(gross_royalty_cents * commission_pct)
                              author_net_cents        = gross_royalty_cents - agency_commission_cents
      On advance installment: agency_commission_cents = floor(amount_cents * commission_pct)
    input_set: "one RoyaltyStatement or one AdvanceInstallment; commission_pct resolved through the Deal's agreement chain"
    precision: "integer cents, floor"
    variants:
      - name: provisional
        when: "ClientAgreement.commission_pct_override is null"
        difference: "Commission floats with Agency.commission_pct current at event time; already-reconciled statements are NOT retro-adjusted if the agency rate later changes"
      - name: final
        when: "ClientAgreement.commission_pct_override is non-null"
        difference: "The override is locked at SIGNED time and immutable; for identical gross_royalty_cents the final variant uses the locked override even if Agency.commission_pct has since changed — e.g. installment amount 250000 with agency pct 0.15 and override 0.10 yields 25000 under final vs 37500 under provisional"

  - name: advance_waterfall
    trigger: "Deal execute (AdvanceInstallment creation)"
    algorithm: waterfall_allocation
    formula: |
      ON_SIGNING_cents     = floor(Deal.advance_cents * 0.50)
      ON_DELIVERY_cents    = floor(Deal.advance_cents * 0.25)
      ON_PUBLICATION_cents = Deal.advance_cents - ON_SIGNING_cents - ON_DELIVERY_cents
      The publication bucket is the remainder bucket and absorbs rounding: the
      three installments always sum exactly to advance_cents. Rounding order is
      pinned: floor signing first, floor delivery second, remainder last.
      Example: advance 100001 -> 50000 / 25000 / 25001.
      due_period_index: ON_SIGNING = executed_period_index, ON_DELIVERY = executed+1,
      ON_PUBLICATION = executed+2.
    input_set: "the Deal being executed"
    constants:
      FRAC_SIGNING: 0.50
      FRAC_DELIVERY: 0.25
    precision: "integer cents; pinned floor-then-remainder order"

  - name: advance_earnout
    trigger: "RoyaltyStatement reconcile and resolve-audit"
    algorithm: aggregation
    formula: |
      On reconcile:
        Deal.advance_earned_out_cents = min(Deal.advance_cents,
                                            Deal.advance_earned_out_cents + author_net_cents)
      On resolve-audit:
        Deal.advance_earned_out_cents = min(Deal.advance_cents,
                                            max(0, Deal.advance_earned_out_cents
                                                   + (new_author_net_cents - old_author_net_cents)))
      The min() clamps at advance_cents: earnings beyond the advance accrue to the
      author but do not move the earn-out field past the cap. A resolve-audit that
      re-submits identical receipts produces a zero delta and leaves the field
      unchanged (compensating-action invariant).
    input_set: "one Deal and the RoyaltyStatement being reconciled or resolved"
    precision: "integer cents"

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Request body shape: required fields present, enums valid, ranges valid (eval_score in [0,100], word_count > 0, amounts >= 0), no undeclared fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"

  - priority: 4
    category: existence
    check: "Resource IDs in path and body exist; for Agent-role callers the target resource's agency must equal the acting Agent's agency; cross-referenced body IDs (author_id, editor_id, submission_round_id, etc.) must belong to the same agency as the target"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 5
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /submission-rounds/{id}/open, POST /deals/{id}/execute"

  - priority: 6
    category: state
    check: "Target resource is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: offer accept and deal execute cannot be performed with X-User-ID equal to the parent SubmissionRound.agent_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /offers/{id}/accept, POST /deals/{id}/execute"

  - priority: 8
    category: business_referential
    check: "Acting agent must equal the assigned/reader/signing agent on the target resource"
    error_id: ERR_NOT_ASSIGNED_AGENT
    http_status: 403
    applies_to: "query-letters request-manuscript/reject (from IN_REVIEW), manuscripts evaluate, client-agreements offer"

  - priority: 9
    category: business_referential
    check: "Referenced agent/editor must be ACTIVE"
    error_id: "ERR_AGENT_INACTIVE | ERR_EDITOR_INACTIVE"
    http_status: 409
    applies_to: "query-letters assign, manuscripts assign-reader, submissions send"

  - priority: 10
    category: business_constraint
    check: "Agency intake gate: new QueryLetter rejected while posture == INTAKE_PAUSED (open slush count >= slush_capacity)"
    error_id: ERR_INTAKE_PAUSED
    http_status: 409
    applies_to: "POST /query-letters"

  - priority: 11
    category: business_constraint
    check: "Manuscript lifecycle gates: ACCEPTED requires eval_score >= 70; request-revision requires revision_round < 2"
    error_id: "ERR_SCORE_BELOW_THRESHOLD | ERR_REVISION_LIMIT_REACHED"
    http_status: 409
    applies_to: "manuscripts accept, request-revision"

  - priority: 12
    category: business_referential
    check: "ClientAgreement gates: offer requires manuscript ACCEPTED; sign requires no other SIGNED agreement for the same manuscript"
    error_id: "ERR_MANUSCRIPT_NOT_ACCEPTED | ERR_AGREEMENT_ALREADY_SIGNED"
    http_status: 409
    applies_to: "client-agreements offer, sign"

  - priority: 13
    category: business_constraint
    check: "SubmissionRound gates: open requires SIGNED agreement, no other OPEN round for the manuscript, and at least one QUEUED submission; submission create requires round in DRAFT or OPEN and live-submission count < max_editors"
    error_id: "ERR_AGREEMENT_NOT_SIGNED | ERR_ROUND_ALREADY_OPEN | ERR_EMPTY_ROUND | ERR_ROUND_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "submission-rounds open, submissions create"

  - priority: 14
    category: business_temporal
    check: "Submission conflicts: same round already has a submission to this editor (create); editor exclusivity window [sent_period_index, sent_period_index + 2) half-open — a send at agency.period_index == p + 2 is allowed, at p + 1 rejected (send)"
    error_id: "ERR_DUPLICATE_SUBMISSION | ERR_EDITOR_EXCLUSIVE_WINDOW"
    http_status: 409
    applies_to: "submissions create, submissions send"

  - priority: 15
    category: business_constraint
    check: "Offer accept gate: auction_mode rounds accept only the offer with auction_rank == 1"
    error_id: ERR_NOT_TOP_RANKED_OFFER
    http_status: 409
    applies_to: "offers accept"

  - priority: 16
    category: business_referential
    check: "Deal/statement gates: reconcile and mark-paid require Deal EXECUTED or ACTIVE; statement intake period_index must not exceed agency.period_index"
    error_id: "ERR_DEAL_NOT_LIVE | ERR_FUTURE_STATEMENT"
    http_status: 409
    applies_to: "royalty-statements reconcile, royalty-statements create, advance-installments mark-paid"

  - priority: 17
    category: business_fiscal
    check: "Books/variance gates: statement intake and audit open require period_index > books_closed_through_period_index; audit open requires |variance| > 500; clear requires |variance| <= 500"
    error_id: "ERR_BOOKS_CLOSED | ERR_VARIANCE_WITHIN_TOLERANCE | ERR_VARIANCE_UNRESOLVED"
    http_status: 409
    applies_to: "royalty-statements create, open-audit, clear"

  - priority: 18
    category: business_fiscal
    check: "Termination gates: deal terminate blocked by statements in RECEIVED or AUDIT_OPEN; agreement terminate blocked by deals in NEGOTIATING, EXECUTED, or ACTIVE"
    error_id: "ERR_STATEMENTS_UNRESOLVED | ERR_DEAL_STILL_OPEN"
    http_status: 409
    applies_to: "deals terminate, client-agreements terminate"

  - priority: 19
    category: business_constraint
    check: "Round close gates and offer-live gate: close blocked by UNDER_CONSIDERATION/OFFER_EXTENDED submissions and by RECEIVED/UNDER_NEGOTIATION offers; manual withdraw of an OFFER_EXTENDED submission blocked while its offer is live"
    error_id: "ERR_ROUND_HAS_LIVE_SUBMISSIONS | ERR_ROUND_HAS_LIVE_OFFERS | ERR_OFFER_STILL_LIVE"
    http_status: 409
    applies_to: "submission-rounds close, submissions withdraw"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Agency ---
  - method: POST
    path: "/agencies"
    description: "Create an agency"
    roles: [AgencyAdmin]
    code: 201
    input: [name, commission_pct, slush_capacity]
    output: Agency
    side_effects: ["posture=NORMAL, period_index=0, books_closed_through_period_index=null"]

  - method: GET
    path: "/agencies/{agencyId}"
    description: "Get an agency"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: Agency
    side_effects: []

  - method: POST
    path: "/agencies/{agencyId}/close-period"
    description: "Advance the royalty period; drives lapse, due/late installment sweeps and deal activation backstop"
    roles: [AgencyAdmin, RoyaltiesAccountant]
    code: 200
    input: []
    output: Agency
    side_effects:
      - "Link 1 of the lapse cascade: period_index += 1 (Agency mutation)"
      - "Link 2 of the lapse cascade: closing period N lapses QueryLetters (REQUESTED with requested_period_index <= N-1 and manuscript in SUBMITTED or READER_ASSIGNED) -> LAPSED (caused by the period advance)"
      - "Link 3 of the lapse cascade: each lapsed QueryLetter's linked Manuscript -> DECLINED (caused by the lapse, per the QueryLetter machine)"
      - "AdvanceInstallment SCHEDULED -> DUE when period_index reaches due_period_index; DUE -> LATE when period_index > due_period_index and unpaid"
      - "Deal EXECUTED -> ACTIVE backstop re-check (first PAID installment exists)"
      - "increments Agency.version by 1"

  - method: POST
    path: "/agencies/{agencyId}/close-books"
    description: "Close the books for the most recently completed period"
    roles: [AgencyAdmin, RoyaltiesAccountant]
    code: 200
    input: []
    output: Agency
    side_effects:
      - "books_closed_through_period_index = period_index - 1 (ERR_INVALID_STATE if period_index == 0)"
      - "increments Agency.version by 1"

  # --- Agents ---
  - method: POST
    path: "/agents"
    description: "Create an agent"
    roles: [AgencyAdmin]
    code: 201
    input: [agency_id, display_name, email]
    output: Agent
    side_effects: ["status=ACTIVE, open_query_count=0"]

  - method: GET
    path: "/agents/{agentId}"
    description: "Get an agent"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: GET
    path: "/agents"
    description: "List agents"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: "Agent[]"
    side_effects: []

  - method: POST
    path: "/agents/{agentId}/deactivate"
    description: "Deactivate an agent (ACTIVE -> INACTIVE)"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: ["status -> INACTIVE; increments Agent.version by 1"]

  - method: POST
    path: "/agents/{agentId}/activate"
    description: "Reactivate an agent (INACTIVE -> ACTIVE)"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Agent
    side_effects: ["status -> ACTIVE; increments Agent.version by 1"]

  # --- Authors ---
  - method: POST
    path: "/authors"
    description: "Create an author (starts PROSPECT)"
    roles: [AgencyAdmin, Agent]
    code: 201
    input: [agency_id, display_name, email]
    output: Author
    side_effects: ["status=PROSPECT"]

  - method: GET
    path: "/authors/{authorId}"
    description: "Get an author"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: Author
    side_effects: []

  - method: GET
    path: "/authors"
    description: "List authors"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: "Author[]"
    side_effects: []

  # --- Editors ---
  - method: POST
    path: "/editors"
    description: "Create an editor rolodex entry"
    roles: [AgencyAdmin, Agent]
    code: 201
    input: [agency_id, display_name, imprint, email]
    output: Editor
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/editors/{editorId}"
    description: "Get an editor"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: Editor
    side_effects: []

  - method: GET
    path: "/editors"
    description: "List editors"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "limit?", "offset?"]
    output: "Editor[]"
    side_effects: []

  - method: POST
    path: "/editors/{editorId}/deactivate"
    description: "Deactivate an editor (ACTIVE -> INACTIVE)"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Editor
    side_effects: ["status -> INACTIVE; increments Editor.version by 1"]

  - method: POST
    path: "/editors/{editorId}/activate"
    description: "Reactivate an editor (INACTIVE -> ACTIVE)"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Editor
    side_effects: ["status -> ACTIVE; increments Editor.version by 1"]

  # --- QueryLetters ---
  - method: POST
    path: "/query-letters"
    description: "Intake a query letter into the slush pile"
    roles: [Agent]
    code: 201
    input: [author_id, genre, word_count]
    output: QueryLetter
    side_effects:
      - "status=RECEIVED; agency_id copied from Author; triage_score computed per slush_triage_score"
      - "Agency posture re-evaluated; ERR_INTAKE_PAUSED when already at capacity"

  - method: GET
    path: "/query-letters/{queryLetterId}"
    description: "Get a query letter"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: QueryLetter
    side_effects: []

  - method: GET
    path: "/query-letters"
    description: "List query letters (slush pile view)"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "author_id?", "assigned_agent_id?", "limit?", "offset?"]
    output: "QueryLetter[]"
    side_effects: []

  - method: POST
    path: "/query-letters/{queryLetterId}/assign"
    description: "Assign a query to an agent (RECEIVED -> IN_REVIEW)"
    roles: [Agent]
    code: 200
    input: [agent_id]
    output: QueryLetter
    side_effects: ["status -> IN_REVIEW; assigned_agent_id set; Agent.open_query_count recomputed"]

  - method: POST
    path: "/query-letters/{queryLetterId}/request-manuscript"
    description: "Request the full manuscript (IN_REVIEW -> REQUESTED); spawns the Manuscript"
    roles: [Agent]
    code: 200
    input: [title]
    output: Manuscript
    side_effects:
      - "QueryLetter.status -> REQUESTED; requested_period_index set"
      - "Manuscript created (status=SUBMITTED, reader_agent_id=assigned agent, author_id and agency_id copied)"

  - method: POST
    path: "/query-letters/{queryLetterId}/reject"
    description: "Reject a query (RECEIVED or IN_REVIEW -> REJECTED)"
    roles: [Agent]
    code: 200
    input: []
    output: QueryLetter
    side_effects: ["status -> REJECTED; Agent.open_query_count recomputed; posture re-evaluated"]

  - method: POST
    path: "/query-letters/{queryLetterId}/withdraw"
    description: "Withdraw a query (RECEIVED or IN_REVIEW -> WITHDRAWN)"
    roles: [Agent]
    code: 200
    input: []
    output: QueryLetter
    side_effects: ["status -> WITHDRAWN; posture re-evaluated"]

  # --- Manuscripts ---
  - method: GET
    path: "/manuscripts/{manuscriptId}"
    description: "Get a manuscript"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: Manuscript
    side_effects: []

  - method: GET
    path: "/manuscripts"
    description: "List manuscripts"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "author_id?", "query_letter_id?", "reader_agent_id?", "limit?", "offset?"]
    output: "Manuscript[]"
    side_effects: []

  - method: POST
    path: "/manuscripts/{manuscriptId}/assign-reader"
    description: "Assign/reassign the reader agent (SUBMITTED -> READER_ASSIGNED)"
    roles: [Agent]
    code: 200
    input: [agent_id]
    output: Manuscript
    side_effects: ["status -> READER_ASSIGNED; reader_agent_id set"]

  - method: POST
    path: "/manuscripts/{manuscriptId}/evaluate"
    description: "Record reader evaluation score (READER_ASSIGNED -> EVALUATED)"
    roles: [Agent]
    code: 200
    input: [eval_score]
    output: Manuscript
    side_effects: ["status -> EVALUATED; eval_score set"]

  - method: POST
    path: "/manuscripts/{manuscriptId}/request-revision"
    description: "Send manuscript back for revision (EVALUATED -> REVISION_REQUESTED; revision_round += 1)"
    roles: [Agent]
    code: 200
    input: []
    output: Manuscript
    side_effects: ["status -> REVISION_REQUESTED; revision_round += 1"]

  - method: POST
    path: "/manuscripts/{manuscriptId}/resubmit"
    description: "Author resubmits after revision (REVISION_REQUESTED -> SUBMITTED)"
    roles: [Agent]
    code: 200
    input: []
    output: Manuscript
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/manuscripts/{manuscriptId}/accept"
    description: "Accept manuscript for representation (EVALUATED -> ACCEPTED, requires eval_score >= 70)"
    roles: [Agent]
    code: 200
    input: []
    output: Manuscript
    side_effects: ["status -> ACCEPTED; Author.status -> CLIENT"]

  - method: POST
    path: "/manuscripts/{manuscriptId}/decline"
    description: "Decline manuscript (EVALUATED -> DECLINED)"
    roles: [Agent]
    code: 200
    input: []
    output: Manuscript
    side_effects: ["status -> DECLINED"]

  # --- ClientAgreements ---
  - method: POST
    path: "/client-agreements"
    description: "Draft a representation agreement"
    roles: [Agent]
    code: 201
    input: [author_id, manuscript_id, agent_id, "commission_pct_override?", "exclusive?"]
    output: ClientAgreement
    side_effects: ["status=DRAFT; agency_id copied from Manuscript"]

  - method: GET
    path: "/client-agreements/{agreementId}"
    description: "Get a client agreement"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: ClientAgreement
    side_effects: []

  - method: GET
    path: "/client-agreements"
    description: "List client agreements"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "author_id?", "manuscript_id?", "agent_id?", "limit?", "offset?"]
    output: "ClientAgreement[]"
    side_effects: []

  - method: POST
    path: "/client-agreements/{agreementId}/offer"
    description: "Offer the agreement to the author (DRAFT -> OFFERED)"
    roles: [Agent]
    code: 200
    input: []
    output: ClientAgreement
    side_effects: ["status -> OFFERED"]

  - method: POST
    path: "/client-agreements/{agreementId}/sign"
    description: "Record author signature (OFFERED -> SIGNED)"
    roles: [Agent]
    code: 200
    input: []
    output: ClientAgreement
    side_effects: ["status -> SIGNED; signed_period_index set; Author.status -> CLIENT"]

  - method: POST
    path: "/client-agreements/{agreementId}/decline"
    description: "Author declines the agreement (OFFERED -> DECLINED_BY_AUTHOR)"
    roles: [Agent]
    code: 200
    input: []
    output: ClientAgreement
    side_effects: ["status -> DECLINED_BY_AUTHOR"]

  - method: POST
    path: "/client-agreements/{agreementId}/terminate"
    description: "Terminate a signed agreement (SIGNED -> TERMINATED)"
    roles: [ContractsManager]
    code: 200
    input: []
    output: ClientAgreement
    side_effects: ["status -> TERMINATED; Author.status -> FORMER if no other SIGNED agreements remain"]

  # --- SubmissionRounds ---
  - method: POST
    path: "/submission-rounds"
    description: "Create a submission round for a manuscript"
    roles: [Agent]
    code: 201
    input: [manuscript_id, agent_id, max_editors, "auction_mode?", "valuation_mode?"]
    output: SubmissionRound
    side_effects: ["status=DRAFT; agency_id copied from Manuscript; round_index = 1 + count(prior rounds for the manuscript)"]

  - method: GET
    path: "/submission-rounds/{roundId}"
    description: "Get a submission round"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: SubmissionRound
    side_effects: []

  - method: GET
    path: "/submission-rounds"
    description: "List submission rounds"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "manuscript_id?", "agent_id?", "limit?", "offset?"]
    output: "SubmissionRound[]"
    side_effects: []

  - method: POST
    path: "/submission-rounds/{roundId}/open"
    description: "Open the round (DRAFT -> OPEN); OCC on SubmissionRound.version"
    roles: [Agent]
    code: 200
    input: [expected_submission_round_version]
    output: SubmissionRound
    side_effects: ["status -> OPEN; increments SubmissionRound.version by 1"]

  - method: POST
    path: "/submission-rounds/{roundId}/close"
    description: "Close the round (OPEN -> CLOSED); QUEUED/SENT submissions withdraw"
    roles: [Agent]
    code: 200
    input: []
    output: SubmissionRound
    side_effects: ["status -> CLOSED; QUEUED and SENT submissions -> WITHDRAWN"]

  # --- Submissions ---
  - method: POST
    path: "/submissions"
    description: "Queue a submission to an editor within a round"
    roles: [Agent]
    code: 201
    input: [submission_round_id, editor_id]
    output: Submission
    side_effects:
      - "status=QUEUED; agency_id copied from SubmissionRound"
      - "ERR_DUPLICATE_SUBMISSION if the round already has a submission to this editor"
      - "ERR_ROUND_CAPACITY_EXCEEDED if live submissions (QUEUED, SENT, UNDER_CONSIDERATION, OFFER_EXTENDED) already equal round.max_editors"
      - "ERR_INVALID_STATE if round is CLOSED"

  - method: GET
    path: "/submissions/{submissionId}"
    description: "Get a submission"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: Submission
    side_effects: []

  - method: GET
    path: "/submissions"
    description: "List submissions"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "submission_round_id?", "editor_id?", "limit?", "offset?"]
    output: "Submission[]"
    side_effects: []

  - method: POST
    path: "/submissions/{submissionId}/send"
    description: "Mark submission sent (QUEUED -> SENT); editor exclusivity window [p, p+2) enforced"
    roles: [Agent]
    code: 200
    input: []
    output: Submission
    side_effects: ["status -> SENT; sent_period_index = agency.period_index"]

  - method: POST
    path: "/submissions/{submissionId}/mark-under-consideration"
    description: "Editor is actively reading (SENT -> UNDER_CONSIDERATION)"
    roles: [Agent]
    code: 200
    input: []
    output: Submission
    side_effects: ["status -> UNDER_CONSIDERATION"]

  - method: POST
    path: "/submissions/{submissionId}/pass"
    description: "Editor passes (SENT or UNDER_CONSIDERATION -> PASSED)"
    roles: [Agent]
    code: 200
    input: []
    output: Submission
    side_effects: ["status -> PASSED; response_period_index set"]

  - method: POST
    path: "/submissions/{submissionId}/withdraw"
    description: "Withdraw a submission (QUEUED/SENT/UNDER_CONSIDERATION/OFFER_EXTENDED -> WITHDRAWN)"
    roles: [Agent]
    code: 200
    input: []
    output: Submission
    side_effects: ["status -> WITHDRAWN (ERR_OFFER_STILL_LIVE when OFFER_EXTENDED with a live offer)"]

  # --- Offers ---
  - method: POST
    path: "/offers"
    description: "Record an editor's offer against a submission"
    roles: [Agent]
    code: 201
    input: [submission_id, advance_cents, royalty_pct_hardcover, royalty_pct_trade, royalty_pct_ebook, "royalty_basis?", "includes_film_rights?", "includes_foreign_rights?", "includes_audio_rights?"]
    output: Offer
    side_effects:
      - "status=RECEIVED; agency_id copied from Submission"
      - "Parent Submission -> OFFER_EXTENDED (requires submission SENT or UNDER_CONSIDERATION, else ERR_INVALID_STATE)"
      - "auction_rank computed for all live offers in the round when auction_mode"

  - method: GET
    path: "/offers/{offerId}"
    description: "Get an offer"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/offers"
    description: "List offers"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "submission_id?", "limit?", "offset?"]
    output: "Offer[]"
    side_effects: []

  - method: POST
    path: "/offers/{offerId}/negotiate"
    description: "Open negotiation (RECEIVED -> UNDER_NEGOTIATION)"
    roles: [Agent]
    code: 200
    input: []
    output: Offer
    side_effects: ["status -> UNDER_NEGOTIATION"]

  - method: POST
    path: "/offers/{offerId}/revise"
    description: "Editor returns revised terms (UNDER_NEGOTIATION -> RECEIVED)"
    roles: [Agent]
    code: 200
    input: [advance_cents, royalty_pct_hardcover, royalty_pct_trade, royalty_pct_ebook, "royalty_basis?", "includes_film_rights?", "includes_foreign_rights?", "includes_audio_rights?"]
    output: Offer
    side_effects: ["terms overwritten; status -> RECEIVED; auction_rank recomputed when auction_mode"]

  - method: POST
    path: "/offers/{offerId}/accept"
    description: "Accept the winning offer; creates the Deal; supersedes losing offers; segregation of duties enforced"
    roles: [ContractsManager]
    code: 200
    input: []
    output: Offer
    side_effects:
      - "status -> ACCEPTED; Deal created (NEGOTIATING, advance/royalty_basis/rights copied)"
      - "Sibling Offers in {RECEIVED, UNDER_NEGOTIATION} -> SUPERSEDED; each superseded offer's Submission -> PASSED"
      - "Sibling Submissions in {QUEUED, SENT, UNDER_CONSIDERATION} -> WITHDRAWN"

  - method: POST
    path: "/offers/{offerId}/decline"
    description: "Agency declines the offer"
    roles: [Agent]
    code: 200
    input: []
    output: Offer
    side_effects: ["status -> DECLINED; parent Submission -> PASSED"]

  - method: POST
    path: "/offers/{offerId}/editor-withdraw"
    description: "Editor withdraws the offer"
    roles: [Agent]
    code: 200
    input: []
    output: Offer
    side_effects: ["status -> WITHDRAWN_BY_EDITOR; parent Submission -> PASSED"]

  # --- Deals ---
  - method: GET
    path: "/deals/{dealId}"
    description: "Get a deal"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: Deal
    side_effects: []

  - method: GET
    path: "/deals"
    description: "List deals"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "offer_id?", "submission_id?", "client_agreement_id?", "limit?", "offset?"]
    output: "Deal[]"
    side_effects: []

  - method: PATCH
    path: "/deals/{dealId}"
    description: "Amend deal terms while NEGOTIATING (advance and/or rights flags)"
    roles: [ContractsManager]
    code: 200
    input: ["advance_cents?", "retains_film_rights?", "retains_foreign_rights?", "retains_audio_rights?"]
    output: Deal
    side_effects: ["terms updated; increments Deal.version by 1; ERR_INVALID_STATE unless NEGOTIATING"]

  - method: POST
    path: "/deals/{dealId}/execute"
    description: "Execute the contract (NEGOTIATING -> EXECUTED); OCC on Deal.version; spawns AdvanceInstallments per advance_waterfall"
    roles: [ContractsManager]
    code: 200
    input: [expected_deal_version]
    output: Deal
    side_effects:
      - "status -> EXECUTED; executed_period_index set"
      - "AdvanceInstallments created (ON_SIGNING/ON_DELIVERY/ON_PUBLICATION)"
      - "Winning Submission -> WITHDRAWN"
      - "increments Deal.version by 1"

  - method: POST
    path: "/deals/{dealId}/terminate"
    description: "Terminate a deal (EXECUTED or ACTIVE -> TERMINATED)"
    roles: [ContractsManager]
    code: 200
    input: []
    output: Deal
    side_effects: ["status -> TERMINATED; SCHEDULED/DUE installments -> WAIVED (LATE and PAID untouched)"]

  # --- RoyaltyStatements ---
  - method: POST
    path: "/royalty-statements"
    description: "Intake a publisher royalty statement"
    roles: [RoyaltiesAccountant]
    code: 201
    input: [deal_id, period_index, units_hardcover, units_trade, units_ebook, net_receipts_hardcover_cents, net_receipts_trade_cents, net_receipts_ebook_cents, publisher_reported_royalty_cents]
    output: RoyaltyStatement
    side_effects:
      - "status=RECEIVED; agency_id copied from Deal"
      - "ERR_FUTURE_STATEMENT if period_index > agency.period_index; ERR_BOOKS_CLOSED if period_index <= books_closed_through_period_index"

  - method: GET
    path: "/royalty-statements/{statementId}"
    description: "Get a royalty statement"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []

  - method: GET
    path: "/royalty-statements"
    description: "List royalty statements"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "deal_id?", "period_index?", "limit?", "offset?"]
    output: "RoyaltyStatement[]"
    side_effects: []

  - method: POST
    path: "/royalty-statements/{statementId}/reconcile"
    description: "Recompute royalties and variance (RECEIVED -> RECONCILED)"
    roles: [RoyaltiesAccountant]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["gross_royalty_cents, agency_commission_cents, author_net_cents, variance_cents computed; Deal.advance_earned_out_cents updated per advance_earnout"]

  - method: POST
    path: "/royalty-statements/{statementId}/open-audit"
    description: "Open a royalty audit (RECONCILED or AUDIT_RESOLVED -> AUDIT_OPEN)"
    roles: [RoyaltiesAccountant]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["status -> AUDIT_OPEN"]

  - method: POST
    path: "/royalty-statements/{statementId}/resolve-audit"
    description: "Record audit-adjusted receipts (AUDIT_OPEN -> AUDIT_RESOLVED)"
    roles: [RoyaltiesAccountant]
    code: 200
    input: [net_receipts_hardcover_cents, net_receipts_trade_cents, net_receipts_ebook_cents]
    output: RoyaltyStatement
    side_effects: ["receipts overwritten; computed fields recomputed; Deal.advance_earned_out_cents adjusted by the author_net delta, clamped to [0, advance_cents]"]

  - method: POST
    path: "/royalty-statements/{statementId}/clear"
    description: "Clear a statement once variance is within tolerance (RECONCILED or AUDIT_RESOLVED -> CLEARED)"
    roles: [RoyaltiesAccountant]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: ["status -> CLEARED"]

  # --- AdvanceInstallments ---
  - method: GET
    path: "/advance-installments/{installmentId}"
    description: "Get an advance installment"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: []
    output: AdvanceInstallment
    side_effects: []

  - method: GET
    path: "/advance-installments"
    description: "List advance installments"
    roles: [AgencyAdmin, Agent, ContractsManager, RoyaltiesAccountant]
    code: 200
    input: ["agency_id?", "status?", "deal_id?", "milestone?", "limit?", "offset?"]
    output: "AdvanceInstallment[]"
    side_effects: []

  - method: POST
    path: "/advance-installments/{installmentId}/mark-paid"
    description: "Record publisher advance payment (SCHEDULED/DUE/LATE -> PAID)"
    roles: [RoyaltiesAccountant]
    code: 200
    input: []
    output: AdvanceInstallment
    side_effects: ["status -> PAID; paid_period_index set; agency_commission_cents computed per commission_split; first PAID installment flips Deal EXECUTED -> ACTIVE"]

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Caller role not permitted for this endpoint"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, invalid enum, out-of-range value, or undeclared field"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource ID does not exist, or lies outside the acting agent's agency scope"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent entity's current version (OCC)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits the requested transition"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Offer accept / deal execute attempted with X-User-ID equal to the round's agent_id"

  - id: ERR_NOT_ASSIGNED_AGENT
    http: 403
    condition: "Acting agent is not the assigned/reader/signing agent on the target resource"

  - id: ERR_AGENT_INACTIVE
    http: 409
    condition: "Referenced agent is not ACTIVE"

  - id: ERR_EDITOR_INACTIVE
    http: 409
    condition: "Referenced editor is not ACTIVE"

  - id: ERR_INTAKE_PAUSED
    http: 409
    condition: "Agency posture is INTAKE_PAUSED (open slush count >= slush_capacity); new query intake rejected"

  - id: ERR_SCORE_BELOW_THRESHOLD
    http: 409
    condition: "Manuscript accept requires eval_score >= 70"

  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "Manuscript has already consumed 2 revision rounds"

  - id: ERR_MANUSCRIPT_NOT_ACCEPTED
    http: 409
    condition: "ClientAgreement offer requires the manuscript to be ACCEPTED"

  - id: ERR_AGREEMENT_ALREADY_SIGNED
    http: 409
    condition: "Another SIGNED ClientAgreement already covers this manuscript"

  - id: ERR_AGREEMENT_NOT_SIGNED
    http: 409
    condition: "SubmissionRound open requires a SIGNED ClientAgreement for the manuscript"

  - id: ERR_DEAL_STILL_OPEN
    http: 409
    condition: "ClientAgreement terminate blocked while a linked Deal is NEGOTIATING, EXECUTED, or ACTIVE"

  - id: ERR_ROUND_ALREADY_OPEN
    http: 409
    condition: "Another SubmissionRound for the same manuscript is currently OPEN"

  - id: ERR_EMPTY_ROUND
    http: 409
    condition: "SubmissionRound open requires at least one QUEUED submission"

  - id: ERR_ROUND_CAPACITY_EXCEEDED
    http: 409
    condition: "Live submission count (QUEUED, SENT, UNDER_CONSIDERATION, OFFER_EXTENDED) already equals round.max_editors"

  - id: ERR_ROUND_NOT_OPEN
    http: 409
    condition: "Submission send requires parent round OPEN"

  - id: ERR_DUPLICATE_SUBMISSION
    http: 409
    condition: "Same round already has a submission to this editor"

  - id: ERR_EDITOR_EXCLUSIVE_WINDOW
    http: 409
    condition: "Editor holds a live submission sent at period p; new sends to that editor blocked while agency.period_index < p + 2 (half-open window; send at exactly p + 2 allowed)"

  - id: ERR_ROUND_HAS_LIVE_SUBMISSIONS
    http: 409
    condition: "Round close blocked by submissions in UNDER_CONSIDERATION or OFFER_EXTENDED"

  - id: ERR_ROUND_HAS_LIVE_OFFERS
    http: 409
    condition: "Round close blocked by offers in RECEIVED or UNDER_NEGOTIATION"

  - id: ERR_OFFER_STILL_LIVE
    http: 409
    condition: "Manual submission withdraw blocked while its offer is RECEIVED or UNDER_NEGOTIATION"

  - id: ERR_NOT_TOP_RANKED_OFFER
    http: 409
    condition: "Auction-mode round: only the offer with auction_rank == 1 may be accepted"

  - id: ERR_DEAL_NOT_LIVE
    http: 409
    condition: "Operation requires Deal in EXECUTED or ACTIVE"

  - id: ERR_STATEMENTS_UNRESOLVED
    http: 409
    condition: "Deal terminate blocked by statements in RECEIVED or AUDIT_OPEN"

  - id: ERR_FUTURE_STATEMENT
    http: 409
    condition: "Statement period_index exceeds agency.period_index"

  - id: ERR_BOOKS_CLOSED
    http: 409
    condition: "Statement period already covered by closed books (period_index <= books_closed_through_period_index)"

  - id: ERR_VARIANCE_WITHIN_TOLERANCE
    http: 409
    condition: "Audit open rejected: abs(variance_cents) <= 500 (AUDIT_TOLERANCE_CENTS)"

  - id: ERR_VARIANCE_UNRESOLVED
    http: 409
    condition: "Clear rejected: abs(variance_cents) > 500"

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Agency operator: bootstraps the agency, manages agents/authors/editors, closes periods and books"
    identity: "opaque"
    exclusive_operations:
      - "POST /agencies — Create agency"
      - "POST /agents — Create agent"
      - "POST /agents/{id}/deactivate — Deactivate agent"
      - "POST /agents/{id}/activate — Reactivate agent"
      - "POST /editors/{id}/deactivate — Deactivate editor"
      - "POST /editors/{id}/activate — Reactivate editor"
    shared_operations:
      - "POST /authors — Create author"
      - "POST /editors — Create editor"
      - "POST /agencies/{id}/close-period — Advance period"
      - "POST /agencies/{id}/close-books — Close books"
      - "GET (any) — Read any resource"

  - name: Agent
    description: "Literary agent: triages slush, evaluates manuscripts, signs clients, runs submission rounds, records offers; may only touch resources inside their own agency"
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /query-letters — Intake query"
      - "POST /query-letters/{id}/assign — Assign query"
      - "POST /query-letters/{id}/request-manuscript — Request manuscript"
      - "POST /query-letters/{id}/reject — Reject query"
      - "POST /query-letters/{id}/withdraw — Withdraw query"
      - "POST /manuscripts/{id}/assign-reader — Assign reader"
      - "POST /manuscripts/{id}/evaluate — Evaluate manuscript"
      - "POST /manuscripts/{id}/request-revision — Request revision"
      - "POST /manuscripts/{id}/resubmit — Resubmit manuscript"
      - "POST /manuscripts/{id}/accept — Accept manuscript"
      - "POST /manuscripts/{id}/decline — Decline manuscript"
      - "POST /client-agreements — Draft agreement"
      - "POST /client-agreements/{id}/offer — Offer agreement"
      - "POST /client-agreements/{id}/sign — Sign agreement"
      - "POST /client-agreements/{id}/decline — Decline agreement"
      - "POST /submission-rounds — Create round"
      - "POST /submission-rounds/{id}/open — Open round"
      - "POST /submission-rounds/{id}/close — Close round"
      - "POST /submissions — Queue submission"
      - "POST /submissions/{id}/send — Send submission"
      - "POST /submissions/{id}/mark-under-consideration — Mark under consideration"
      - "POST /submissions/{id}/pass — Pass submission"
      - "POST /submissions/{id}/withdraw — Withdraw submission"
      - "POST /offers — Record offer"
      - "POST /offers/{id}/negotiate — Negotiate offer"
      - "POST /offers/{id}/revise — Revise offer"
      - "POST /offers/{id}/decline — Decline offer"
      - "POST /offers/{id}/editor-withdraw — Editor withdraws offer"
    shared_operations:
      - "POST /authors — Create author"
      - "POST /editors — Create editor"
      - "GET (any) — Read any resource"

  - name: ContractsManager
    description: "Contracts/legal: accepts offers, amends and executes deals, terminates deals and agreements; segregation of duties vs the round's agent"
    identity: "opaque"
    exclusive_operations:
      - "POST /offers/{id}/accept — Accept offer"
      - "PATCH /deals/{id} — Amend deal"
      - "POST /deals/{id}/execute — Execute deal"
      - "POST /deals/{id}/terminate — Terminate deal"
      - "POST /client-agreements/{id}/terminate — Terminate agreement"
    shared_operations:
      - "GET (any) — Read any resource"

  - name: RoyaltiesAccountant
    description: "Royalties desk: intakes statements, reconciles, opens/resolves audits, clears statements, marks advance installments paid"
    identity: "opaque"
    exclusive_operations:
      - "POST /royalty-statements — Intake statement"
      - "POST /royalty-statements/{id}/reconcile — Reconcile"
      - "POST /royalty-statements/{id}/open-audit — Open audit"
      - "POST /royalty-statements/{id}/resolve-audit — Resolve audit"
      - "POST /royalty-statements/{id}/clear — Clear statement"
      - "POST /advance-installments/{id}/mark-paid — Mark installment paid"
    shared_operations:
      - "POST /agencies/{id}/close-period — Advance period"
      - "POST /agencies/{id}/close-books — Close books"
      - "GET (any) — Read any resource"
