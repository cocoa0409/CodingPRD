            - "GET /custody/assets/${ra35}/valuations lists 2 rows (the ACCEPTED original and the new SUBMITTED one)"

      - name: isr_create_stale_version_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[isr-create-stale-asset]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "The second OCC rule guards a different write endpoint (POST /custody/interlocutory-sale-requests): an expense posting advances the asset's version between the client's read and its ISR submission, so the stale expected_asset_version is 412 while a fresh read succeeds."
        test_recipe:
          setup:
            - "One case; VEHICLE asset appraised 400000 EXCELLENT (accepted); client reads the asset (captures version), then a COST entry of 60000 lands (version advances)."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1036", judicial_district: "E.D. Mich.", forfeiture_type: "CIVIL", lead_agency_code: "DEA" }
              as: CaseAgent
              captures: { kc36: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc36}", asset_type: "VEHICLE", description: "van", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "EXCELLENT" }
              as: AssetCustodian
              captures: { ra36: $.data.id, ra36_v1: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${ra36}", method: "BLUE_BOOK", raw_value_cents: 400000, assessed_condition_grade: "EXCELLENT", expected_asset_version: "${ra36_v1}" }
              as: Appraiser
              captures: { rv36: $.data.id }
            - call: "POST /custody/valuations/${rv36}/adjudicate"
              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "GET /custody/assets/${ra36}"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
              captures: { ra36_stale: $.data.version }
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${ra36}", entry_kind: "COST", expense_type: "STORAGE", amount_cents: 60000, incurred_on: "2026-09-02T00:00:00Z" }
              as: AssetCustodian
          trigger:
            - call: "POST /custody/interlocutory-sale-requests"
              payload: { asset_id: "${ra36}", justification: "stale view", expected_asset_version: "${ra36_stale}" }
              as: AssetManager
              as_user_id: "am-priya"
              captures: { stale2_err: $.data.error_id }
            - call: "GET /custody/assets/${ra36}"
              payload: {}
              as: AssetManager
              as_user_id: "am-priya"
              captures: { ra36_fresh: $.data.version }
            - call: "POST /custody/interlocutory-sale-requests"
              payload: { asset_id: "${ra36}", justification: "fresh view", expected_asset_version: "${ra36_fresh}" }
              as: AssetManager
              as_user_id: "am-priya"
              captures: { isr36: $.data.id }
          assert:
            - "stale2_err == ERR_STALE_VERSION (HTTP 412) — the intervening expense entry advanced the version"
            - "with the freshly-read version the ISR is created 201 PENDING and projected_burden_cents == 135000"

      - name: asset_version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Asset
          - concurrency_rules[valuation-create-stale-asset]
        distinguishing_aspect: "The OCC counter is honest: version is exactly 1 at creation and advances by exactly 1 on each mutation — expense posting (2), valuation creation (3), valuation acceptance (4) — with no silent or double increments."
        test_recipe:
          setup:
            - "One case; one asset."
          setup_api_calls:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1037", judicial_district: "D. Nev.", forfeiture_type: "CIVIL", lead_agency_code: "FBI" }
              as: CaseAgent
              captures: { kc37: $.data.id }
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc37}", asset_type: "VEHICLE", description: "coupe", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { ra37: $.data.id, ver1: $.data.version }
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${ra37}", entry_kind: "COST", expense_type: "STORAGE", amount_cents: 10000, incurred_on: "2026-09-02T00:00:00Z" }
              as: AssetCustodian
            - call: "GET /custody/assets/${ra37}"
              payload: {}
              as: AssetCustodian
              as_user_id: "ac-dana"
              captures: { ver2: $.data.version }
            - call: "POST /custody/valuations"
              payload: { asset_id: "${ra37}", method: "BLUE_BOOK", raw_value_cents: 300000, assessed_condition_grade: "GOOD", expected_asset_version: "${ver2}" }
              as: Appraiser
              captures: { rv37: $.data.id }
            - call: "GET /custody/assets/${ra37}"
              payload: {}
              as: Appraiser
              captures: { ver3: $.data.version }
          trigger:
            - call: "POST /custody/valuations/${rv37}/adjudicate"
              payload: { outcome: "ACCEPT" }
              as: CourtOfficial
              as_user_id: "co-reyes"
            - call: "GET /custody/assets/${ra37}"
              payload: {}
              as: CourtOfficial
              as_user_id: "co-reyes"
              captures: { ver4: $.data.version }
          assert:
            - "ver1 == 1 at creation"
            - "ver2 == 2 after the expense posting"
            - "ver3 == 3 after valuation creation (the creation itself mutates the asset's legal_state)"
            - "ver4 == 4 after adjudication ACCEPT — exactly one increment per mutation"

      - name: cascade_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / isr_approval_cascade
          rationale: "The N-level chain claim (and the innocent_owner_grant_cascade sibling) is exercised end-to-end by the two §1.8 transitive_cascade instances."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / sharing_pool_gross_vs_net_basis
          rationale: "Both declared dual-variant pairs are asserted by the two §1.8 dual_variant_calc instances."

      - name: rate_threshold_layer
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: boundary_precision_check / ratio_exactly_at_threshold_eligible
          rationale: "Threshold boundary behavior (inclusive >= on the ratio; bid == reserve sells) is asserted by the two §1.8 boundary_precision_check instances."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: read_after_write_immediate_visibility
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
        distinguishing_aspect: "Immediate consistency: a case read in the very next request after creation returns the posted fields, and an asset read right after an expense posting already includes the 7000-cent accumulator bump — no lag, no staleness window."
        test_recipe:
          setup:
            - "Empty database; clock untouched at the default."
          setup_api_calls: []
          trigger:
            - call: "POST /custody/cases"
              payload: { case_number: "26-MJ-1038", judicial_district: "S.D.N.Y.", forfeiture_type: "CIVIL", lead_agency_code: "DEA" }
              as: CaseAgent
              captures: { kc38: $.data.id }
            - call: "GET /custody/cases/${kc38}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-mora"
            - call: "POST /custody/assets"
              payload: { seizure_case_id: "${kc38}", asset_type: "VEHICLE", description: "sedan", seized_on: "2026-09-01T00:00:00Z", seizure_condition_grade: "GOOD" }
              as: AssetCustodian
              captures: { ra38: $.data.id }
            - call: "POST /custody/expense-entries"
              payload: { asset_id: "${ra38}", entry_kind: "COST", expense_type: "STORAGE", amount_cents: 7000, incurred_on: "2026-09-01T00:00:00Z" }
              as: AssetCustodian
            - call: "GET /custody/assets/${ra38}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-mora"
          assert:
            - "GET /custody/cases/${kc38} in the immediately following request returns case_number 26-MJ-1038, status OPEN, version 1"
            - "GET /custody/assets/${ra38} right after the posting shows accumulated_net_holding_cost_cents == 7000"
