            - call: "POST /refurb-work-orders/${wo_id}/start-test"
              payload: { bay_id: "${bay_id}", test_window_start_at: "2026-08-02T13:00:00Z", test_window_end_at: "2026-08-02T14:00:00Z" }
              as: RefurbTechnician
