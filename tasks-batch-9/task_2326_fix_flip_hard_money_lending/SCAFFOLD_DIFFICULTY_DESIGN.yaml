# =============================================================================
# task_2326 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids × (2–3 instances) = 26 instances.
# Every numeric literal below was produced by executing the §1.3 formulas.
# The logical clock starts at 2026-08-01T00:00:00Z; every instance sets it
# explicitly when a date-dependent rule is in play.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: borrower_score_intake_rolling_vs_recert_lifetime_decay
        grounds:
          - calculations.borrower_experience_score
          - calculations.borrower_experience_score.variants.intake_rolling
          - calculations.borrower_experience_score.variants.recert_lifetime_decay
          - entities.Borrower.fields.intake_experience_score
          - entities.Borrower.fields.recertified_experience_score
          - entities.Borrower.fields.effective_experience_score
          - state_machines.Borrower.APPROVED_SPONSOR_to_APPROVED_SPONSOR
        distinguishing_aspect: |
          The two variants read the SAME stored sponsor row and produce 65.00 versus
          77.00 because intake_rolling credits only flips_last_24mo while
          recert_lifetime_decay credits older flips at a 0.5 decay weight; the
          borrower's effective_experience_score therefore changes by exactly +12.00
          with no input field mutated.
        test_recipe:
          setup:
            - "logical clock 2026-08-10T09:00:00Z"
            - "one sponsor: LLC, flips_last_24mo 3, flips_lifetime 6, credit 696, liquidity 3,000,000, declared target 30,000,000, no prior defaults"
            - "guarantee executed and the sponsor approved, so RECERTIFY is legal"
            - "the sponsor has no loans at all, so the recert variant falls back to declared_target_loan_cents as its liquidity basis — the only term that changes is the experience term"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lending/borrowers"
              payload: { legal_entity_name: "Cactus Wren Holdings LLC", entity_type: "LLC", guarantor_name: "R. Vance", flips_last_24mo: 3, flips_lifetime: 6, credit_score: 696, liquidity_cents: 3000000, prior_default_count: 0, declared_target_loan_cents: 30000000 }
              as: LoanOfficer
              captures: { b2: $.data.id, b2_intake: $.data.intake_experience_score }
            - call: "POST /lending/borrowers/${b2}/guarantee"
              payload: { guarantor_name: "R. Vance", signature_ref: "esign-b2", effective_date: "2026-08-10" }
              as: LoanOfficer
            - call: "POST /lending/borrowers/${b2}/status"
              payload: { action: "APPROVE_SPONSOR" }
              as: CreditCommittee
              as_user_id: "cc-01"
          trigger:
            - call: "POST /lending/borrowers/${b2}/status"
              payload: { action: "RECERTIFY", note: "annual sponsor recertification" }
              as: CreditCommittee
              as_user_id: "cc-01"
          assert:
            - "Borrower.${b2}.intake_experience_score == 65.00"
            - "Borrower.${b2}.recertified_experience_score == 77.00"
            - "Borrower.${b2}.effective_experience_score == 77.00"
            - "Borrower.${b2}.experience_tier == TIER_B"
            - "Borrower.${b2}.status == APPROVED_SPONSOR"
            - "Borrower.${b2}.recertified_at == 2026-08-10T09:00:00Z"
            - "Borrower.${b2}.flips_last_24mo == 3 and Borrower.${b2}.flips_lifetime == 6 (no input field mutated by the re-score)"

      - name: draw_release_photo_cap_vs_inspection_retainage_on_same_scope_line
        grounds:
          - calculations.draw_release_amount
          - calculations.draw_release_amount.variants.photo_release
          - calculations.draw_release_amount.variants.inspection_release
          - entities.DrawLineItem.fields.effective_percent_complete
          - entities.RehabLineItem.fields.released_cents
          - state_machines.DrawRequest.SUBMITTED_to_INSPECTED
          - state_machines.DrawRequest.INSPECTION_ORDERED_to_INSPECTED
        distinguishing_aspect: |
          The identical 0.70 claim on the identical 2,500,000 scope line releases
          1,000,000 through the PHOTO leg (effective completion capped at 0.50 and 20%
          retainage) but takes the line to a cumulative 1,575,000 through the
          INSPECTION leg (uncapped completion, 10% retainage) — a 575,000 divergence
          decided purely by verification_method.
        test_recipe:
          setup:
            - "logical clock 2026-09-01T12:00:00Z"
            - "TIER_A sponsor, property purchase 20,000,000 / ARV 32,000,000"
            - "two approved scope lines of 2,500,000 each (ELECTRICAL on contractor c2, ROOF on contractor c1) so neither breaches the 50% single-line cap"
            - "loan closed 2026-09-01 with rehab holdback 5,000,000"
            - "c2 holds a 2,000,000 PARTIAL_UNCONDITIONAL waiver, giving enough headroom for both releases"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lending/borrowers"
