              captures: { stx_id: $.data.id }
            - call: "POST /reemployment/statements-of-support/${stx_id}/state"
              payload: { to_status: "SIGNED" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: ProgramCoordinator
            - call: "GET /reemployment/employers/${emp_id}/statements-of-support"
              payload: {}
              as: ProgramCoordinator
              captures: { st_at: "$.data[0].status" }
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-02T00:00:00Z" }
              as: ProgramCoordinator
            - call: "GET /reemployment/employers/${emp_id}/statements-of-support"
              payload: {}
              as: ProgramCoordinator
              captures: { st_past: "$.data[0].status" }
          trigger:
            - call: "POST /reemployment/statements-of-support/${stx_id}/state"
              payload: { to_status: "SIGNED" }
              as: Employer
              as_user_id: "${emp_id}"
          assert:
            - "st_at == SIGNED at the exact expires_on instant"
            - "st_past == LAPSED one day past expiry"
            - "the renewal succeeds: status SIGNED, signed_on == 2028-09-02T00:00:00Z, expires_on == 2030-09-02T00:00:00Z"

      - name: event_conclude_before_ends_at_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.OutreachEvent.OPEN_to_CONCLUDED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CONCLUDED is gated on the logical clock reaching ends_at; an OPEN event concluded early fails 409 ERR_INVALID_STATE, while the same request at exactly ends_at succeeds (inclusive boundary)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One event 2026-10-10T10:00-12:00Z, OPEN."
          setup_api_calls:
            - *c_clock
            - call: "POST /reemployment/outreach-events"
              payload: { title: "Rights Briefing", venue: "Hall-C", starts_at: "2026-10-10T10:00:00Z", ends_at: "2026-10-10T12:00:00Z", topic: "RIGHTS_OVERVIEW" }
              as: ProgramCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /reemployment/outreach-events/${ev_id}/state"
              payload: { to_status: "OPEN" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /reemployment/outreach-events/${ev_id}/state"
              payload: { to_status: "CONCLUDED" }
              as: ProgramCoordinator
              captures: { err_early: $.data.error_id }
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T12:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /reemployment/outreach-events/${ev_id}/state"
              payload: { to_status: "CONCLUDED" }
              as: ProgramCoordinator
          assert:
            - "err_early == ERR_INVALID_STATE (409): cannot conclude before ends_at"
            - "at clock exactly == ends_at the conclude succeeds and OutreachEvent.${ev_id}.status == CONCLUDED"

