          trigger:
            - call: "POST /brokerage/listings"
              payload: { seller_id: "${seller_id}", business_name: "Diner One Re-list", industry_code: "722511", annual_sde_cents: 40000000, annual_revenue_cents: 150000000, ffe_value_cents: 20000000, inventory_value_cents: 10000000, industry_multiple: 3.0, asking_price_cents: 120000000, exclusive_start_date: "2026-05-01", exclusive_end_date: "2026-12-01" }
