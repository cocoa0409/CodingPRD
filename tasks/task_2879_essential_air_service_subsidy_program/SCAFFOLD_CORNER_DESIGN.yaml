        distinguishing_aspect: "Each machine's initial_state is assigned by the create endpoint and not derivable from any input: Community REGISTERED, Carrier ACTIVE, Solicitation OPEN, and a Proposal starts DRAFT in the submission dimension and NOT_EVALUATED in the evaluation dimension at the same time."
