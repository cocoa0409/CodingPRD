- section: calculations
  instances:
  - name: burn_rate_window_excludes_receives_adjusts_and_out_of_window_issues
    claim_type: input_set_filtering
    grounds:
    - calculations.ppe_burn_rate
    distinguishing_aspect: 'Only ISSUE/RETURN rows with occurred_at inside [now−168h,
      now) count: RECEIVE rows and an out-of-window ISSUE of 100 units change quantity_on_hand
      but not the observed burn rate (7/7 = 1.0).'
    test_recipe:
      setup:
      - Item with reorder_min_days 100; RECEIVE 200 in-window; ISSUE 100 dated 2026-07-20
        (outside window); ISSUE 7 dated 2026-07-30 (inside window); no incident active
      setup_api_calls:
      - call: POST /emergency/supply-items
        payload:
          item_name: Saline bags
          category: MEDICATION
          unit: each
          reorder_min_days: 100
        as: LogisticsChief
        captures:
          item_id: $.data.id
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: RECEIVE
          quantity: 200
          occurred_at: '2026-07-26T09:00:00Z'
        as: LogisticsChief
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: ISSUE
          quantity: 100
          occurred_at: '2026-07-20T10:00:00Z'
        as: LogisticsChief
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: ISSUE
          quantity: 7
          occurred_at: '2026-07-30T10:00:00Z'
        as: LogisticsChief
      trigger:
      - call: GET /emergency/supply-items/${item_id}
        as: LogisticsChief
        captures:
          qoh: $.data.quantity_on_hand
          obs: $.data.observed_daily_burn_rate
          proj: $.data.projected_daily_burn_rate
          days: $.data.days_of_supply
          below: $.data.below_reorder_level
      assert:
      - '${qoh} == 93 (200 − 100 − 7: all ledger types move stock)'
      - ${obs} == 1.0 (only the in-window ISSUE of 7 counts; 7/7)
      - ${proj} == 1.0 (no ACTIVATED incident ⇒ multiplier 1.0)
      - ${days} == 93 and ${below} == true (93 < 100)
  - name: days_of_supply_null_when_burn_zero
    claim_type: edge_case_result
    grounds:
    - calculations.ppe_burn_rate
    - entities.SupplyItem.fields.days_of_supply
    distinguishing_aspect: Zero projected burn yields days_of_supply == null (never
      a divide-by-zero, never infinity) and below_reorder_level == false even with
      reorder_min_days 1.
    test_recipe:
      setup:
      - Item with reorder_min_days 1 and only a RECEIVE of 5
      setup_api_calls:
      - call: POST /emergency/supply-items
        payload:
          item_name: Burn gowns
          category: PPE
          unit: each
          reorder_min_days: 1
        as: LogisticsChief
        captures:
          item_id: $.data.id
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: RECEIVE
          quantity: 5
          occurred_at: '2026-07-30T09:00:00Z'
        as: LogisticsChief
      trigger:
      - call: GET /emergency/supply-items/${item_id}
        as: LogisticsChief
        captures:
          obs: $.data.observed_daily_burn_rate
          days: $.data.days_of_supply
          below: $.data.below_reorder_level
      assert:
      - ${obs} == 0.0
      - ${days} == null
      - ${below} == false
  - name: external_report_due_offsets_and_hours_late
    claim_type: constants_applied
    grounds:
    - calculations.report_lateness
    - entities.ExternalReport.fields.due_at
    - entities.ExternalReport.fields.hours_late
    distinguishing_aspect: due_at uses the per-type offset (SITREP +24h, AAR_SUMMARY
      +720h); a submission 3h36m past due yields submitted_late true and hours_late
      3.6.
    test_recipe:
      setup:
      - Staff u_lo (creator) and u_ha (submitter); SITREP report period_end 2026-08-10T00:00:00Z;
        AAR_SUMMARY report same period_end
