              as: Cashier
              as_user_id: "csh-1"
              captures: { member_id: $.data.id }
            - call: "POST /members/${member_id}/clip"
              payload: { coupon_id: "${coupon_id}" }
              as: Cashier
              as_user_id: "csh-1"
              captures: { clip_id: $.data.id }
          trigger:
            - call: "POST /members/${member_id}/close"
              payload: {}
              as: StoreManager
              as_user_id: "mgr-1"
          assert:
            - "LoyaltyMember.${member_id}.status == CLOSED"
            - "ClippedCoupon.${clip_id}.status == EXPIRED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      # ---- state (priority 6) vs business_constraint INSUFFICIENT_STOCK (priority 11) ----
      - name: sale_not_open_beats_insufficient_stock
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_SALE_NOT_OPEN]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: |
          A second finalize on an already-FINALIZED sale whose lines also now exceed stock fails with
          ERR_SALE_NOT_OPEN (priority 6 state) NOT ERR_INSUFFICIENT_STOCK (priority 11 business_constraint),
          because state precedes business checks.
        test_recipe:
          setup:
            - "Clock 2026-06-05T00:00:00Z. Product on-hand 5, sale finalized once with quantity 5 (now on-hand 0, sale FINALIZED)."
          setup_api_calls:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: StoreManager
              as_user_id: "mgr-1"
            - call: "POST /departments"
              payload: { code: "GROCERY", name: "Grocery" }
              as: StoreManager
