      - name: earned_value_denominator_and_posture_comparison_edges
        grounds:
          - calculations.phase_earned_value
          - calculations.project_rollup_metrics
          - calculations.project_billing_posture
          - entities.Phase.fields.effort_based_percent_complete
        distinguishing_aspect: |
          Three phases receive an identical 7.35 h charge and differ only in their denominator:
          budget 0.00 exercises the divide-by-zero guard (0.0000, not an error and not 1.0000),
          budget exactly equal to actual cost lands on the 1.0000 edge from below, and budget
          half the actual cost lands above it and must clamp to 1.0000 rather than 2.0000.
          The same fixture pins the strict posture comparison: unbilled_wip exactly equal to
          wip_alert_threshold stays OPEN.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T00:00:00Z"
            - "private client; EFFORT_BASED project with multiplier 3.0500 and wip_alert_threshold set to exactly 4203.33"
            - "PROJECT_ARCHITECT raw_cost_rate 62.50 effective 2026-01-01, so 7.35 h freezes raw 459.38 and billable 1401.11"
            - "three LUMP_SUM root phases: 01-SD fee 100000.00 budget 0.00; 02-DD fee 120000.00 budget 459.38; 03-CD fee 80000.00 budget 229.69"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /clients"
