        captures:
          v3: $.data.version
      assert:
      - version at creation == 1; after open-registration == 2; after agreement create == 3 (agreement creation bumps the parent's version per the OCC rule's side effect)
  - name: event_cancel_cascade
    claim_type: cascade_chain
    grounds:
    - state_machines.Event
    excluded_because:
      difficulty_instance: event_cancel_refund_then_void_cascade
      rationale: "The full cancellation cascade (orders refunded, passes voided, lot units decremented) is asserted end-to-end in the named \xA71.8 instance."
  - name: unit_suspend_cascade
    claim_type: cascade_chain
    grounds:
    - state_machines.Unit.APPROVED_to_SUSPENDED
    excluded_because:
      difficulty_instance: unit_suspend_depth3_cascade
      rationale: "The depth-3 suspension cascade (participant -> equipment -> inspection) is asserted end-to-end in the named \xA71.8 instance."
- section: consistency_model
  instances:
  - name: immediate_read_after_write_consistency
    claim_type: immediate_visibility
    grounds:
    - complexity_profile.consistency_model
    - entities.Participant
    distinguishing_aspect: 'Immediate consistency: a participant created by POST is fully visible with computed fields (is_minor, status DRAFT) on the very next GET, no delay or reconciliation window.'
    test_recipe:
      setup:
      - Canonical event in REGISTRATION_OPEN; unit APPROVED
      setup_api_calls:
      - call: POST /events
        payload:
          name: Cedar Creek 2026
          site_name: Cedar Creek Field
          event_starts_at: '2026-07-10T08:00:00Z'
          event_ends_at: '2026-07-12T18:00:00Z'
          adult_day_price_cents: 2599
          child_day_price_cents: 1200
          adult_weekend_price_cents: 6000
          child_weekend_price_cents: 2800
          early_bird_pct: 0.2
          early_bird_cutoff_at: '2026-06-15T00:00:00Z'
          service_fee_cents: 350
          refund_retain_pct: 0.15
          required_liability_cents: 1000000
          max_minor_per_adult: 4
          vendor_frontage_rate_cents: 900
          vendor_multi_day_discount_pct: 0.1
          vendor_min_fee_cents: 5000
          vendor_late_insurance_surcharge_cents: 2500
          vendor_insurance_deadline_at: '2026-07-01T00:00:00Z'
        as: EventOrganizer
        captures:
          ev_id: $.data.id
      - call: POST /events/${ev_id}/open-registration
        as: EventOrganizer
      - call: POST /units
        payload:
          event_id: ${ev_id}
          name: 6th Ohio
          unit_type: MILITARY
          portrayal_name: 6th OVI
        as: UnitCommander
        captures:
          un_id: $.data.id
      - call: POST /units/${un_id}/vet
        payload:
          decision: APPROVE
        as: EventOrganizer
      trigger:
      - call: POST /participants
        payload:
          event_id: ${ev_id}
          unit_id: ${un_id}
          full_name: Ada Adams
          age_at_event: 15
          impression_class: CIVILIAN
        as: UnitCommander
        as_user_id: ${un_id}
        captures:
          pa_id: $.data.id
      - call: GET /participants/${pa_id}
        as: EventOrganizer
        captures:
          st: $.data.status
          minor: $.data.is_minor
          un: $.data.unit_id
      assert:
      - GET immediately after POST returns status == DRAFT (initial state), is_minor == true (computed), unit_id == ${un_id}
