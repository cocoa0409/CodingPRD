  - section: cross_cutting_complexity_layers
    instances:
      - name: seat_adjustment_stale_contract_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[seat-adjustment-stale-contract]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "After a first seat adjustment bumps Contract.version, a second adjustment still carrying the pre-bump expected_contract_version -> ERR_STALE_CONTRACT_VERSION (412), two strictly sequential requests."
        test_recipe:
          setup: ["SILVER contract active; version captured from activate as cv."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Chi", primary_contact_email: "c@chi.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { ctr: $.data.id }
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: ServiceManager
              captures: { cv: $.data.version }
            - call: "POST /contracts/${ctr}/seat-adjustments"
              payload: { delta: 1, effective_at: "2026-05-02T00:00:00Z", expected_contract_version: "${cv}" }
              as: ServiceManager
          trigger:
            - call: "POST /contracts/${ctr}/seat-adjustments"
              payload: { delta: 1, effective_at: "2026-05-03T00:00:00Z", expected_contract_version: "${cv}" }
              as: ServiceManager
              captures: { err_id: $.data.error_id }
          assert: ["error_id == ERR_STALE_CONTRACT_VERSION; HTTP 412 (cv is now stale after the first adjustment)"]

      - name: seat_adjustment_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[seat-adjustment-stale-contract]", entities.SeatAdjustment.fields.seat_count_after]
        distinguishing_aspect: "A seat adjustment carrying the current expected_contract_version succeeds (201) and records seat_count_after 7 (5+2), bumping Contract.version."
        test_recipe:
          setup: ["SILVER contract seat_count 5 active; version captured as cv."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { company_name: "Psi", primary_contact_email: "p@psi.test" }
              as: ServiceManager
              captures: { cid: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cid}", service_tier: "SILVER", seat_count: 5, per_seat_rate_cents: 5000 }
              as: ServiceManager
              captures: { ctr: $.data.id }
            - call: "POST /contracts/${ctr}/activate"
              payload: {}
              as: ServiceManager
              captures: { cv: $.data.version }
          trigger:
            - call: "POST /contracts/${ctr}/seat-adjustments"
              payload: { delta: 2, effective_at: "2026-05-02T00:00:00Z", expected_contract_version: "${cv}" }
              as: ServiceManager
              captures: { sca: $.data.seat_count_after }
          assert: ["HTTP 201; SeatAdjustment.seat_count_after == 7"]

