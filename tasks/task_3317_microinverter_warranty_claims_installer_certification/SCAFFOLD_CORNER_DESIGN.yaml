  - section: rbac
    instances:
      - name: installer_cannot_approve_claim_returns_unauthorized
        claim_type: role_denial
        grounds:
          - roles.Installer.exclusive_operations
          - roles.PlatformAdmin.exclusive_operations
          - endpoints.[POST /warranty/claims/{id}/approve]
        distinguishing_aspect: |
          The segregation-of-duties boundary is enforced before existence checks: an Installer
          calling approve is refused with ERR_UNAUTHORIZED even when no such claim exists.
        test_recipe:
          setup:
            - "no claim needs to exist: authorization fires at priority 2, before the priority-4 existence check"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /warranty/claims/00000000-0000-0000-0000-000000000003/approve"
              payload: {}
              as: Installer
              captures: { rbac1_err: "$.data.error_id" }
          assert:
            - "the response error_id is ERR_UNAUTHORIZED"
            - "the error is not ERR_RESOURCE_NOT_FOUND, proving role gating precedes existence"

      - name: monitoring_service_cannot_set_installer_level
        claim_type: role_denial
        grounds:
          - roles.MonitoringService.exclusive_operations
          - endpoints.[POST /warranty/installer-levels]
        distinguishing_aspect: |
          MonitoringService is limited to telemetry ingestion and diagnosis, so a level change
          is refused with ERR_UNAUTHORIZED.
        test_recipe:
          setup:
            - "one installer exists at CERTIFIED level"
          setup_api_calls:
            - call: "POST /warranty/installers"
              payload: { installer_code: "INST-RB2", company_name: "Papa Two Solar" }
              as: PlatformAdmin
              captures: { inst_rb2: "$.data.id" }
          trigger:
            - call: "POST /warranty/installer-levels"
              payload: { installer_id: "${inst_rb2}", level: "GOLD" }
              as: MonitoringService
              captures: { rbac2_err: "$.data.error_id" }
          assert:
            - "the response error_id is ERR_UNAUTHORIZED"
            - "GET /warranty/installers/${inst_rb2} still reports certification_level CERTIFIED"

      - name: missing_role_header_returns_unauthenticated
        claim_type: auth_header
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          A request carrying an unknown role name is rejected at priority 1 with
          ERR_UNAUTHENTICATED rather than falling through to authorization.
        test_recipe:
          setup:
            - "empty database, clock fixed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /warranty/installers/00000000-0000-0000-0000-000000000004"
              payload: {}
              as: NotARole
              captures: { rbac3_err: "$.data.error_id" }
          assert:
            - "the response error_id is ERR_UNAUTHENTICATED"
            - "the status is 401 and not 403, distinguishing the auth layer from the authorization layer"

