      - name: quarantined_gear_returns_to_serviceable_through_repair_pass
        claim_type: cyclic
        grounds: ["state_machines.RiggingGear.SERVICEABLE_to_QUARANTINED", "state_machines.RiggingGear.QUARANTINED_to_SERVICEABLE", "calculations.gear_effective_wll"]
        distinguishing_aspect: "SERVICEABLE -> QUARANTINED -> SERVICEABLE is a real cycle, and the REPAIR_PASS that closes it increments repair_count to 1, which drops effective_wll_lb from 30000 to 28500 (5 percent derate) while rated_wll_lb stays 30000."
        test_recipe:
          setup: ["A SERVICEABLE sling rated 30000 lb with repair_count 0."]
          setup_api_calls:
            - call: "POST /rigging-gear"
              payload: { gear_tag: "SL-5001", gear_type: "SLING", rated_wll_lb: 30000, weight_lb: 500, inspection_interval_days: 90 }
              as: SafetyManager
              captures: { gear_id: $.data.id }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "PASS", inspector_note: "acceptance" }
              as: SafetyManager
          trigger:
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "FAIL", inspector_note: "kinked lay" }
              as: SafetyManager
              captures: { r1: $.data.resulting_status, rc1: $.data.repair_count_after }
            - call: "POST /gear-inspections"
              payload: { gear_id: "${gear_id}", result: "REPAIR_PASS", inspector_note: "eye re-spliced and proof tested" }
              as: SafetyManager
              captures: { r2: $.data.resulting_status, rc2: $.data.repair_count_after }
            - call: "GET /rigging-gear/${gear_id}"
              payload: {}
              as: SafetyManager
              captures: { st: $.data.status, rated: $.data.rated_wll_lb, ewll: $.data.effective_wll_lb, rc: $.data.repair_count }
          assert:
            - "${r1} == QUARANTINED and ${rc1} == 0"
            - "${r2} == SERVICEABLE and ${rc2} == 1"
            - "${st} == SERVICEABLE"
            - "${rated} == 30000 and ${ewll} == 28500"
            - "${rc} == 1"

