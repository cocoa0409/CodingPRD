  instances:
  - name: scenario_engagement_revision_loop_returns_to_under_review
    grounds:
    - state_machines.BoundaryScenario.UNDER_REVIEW_to_REVISION
    - state_machines.BoundaryScenario.REVISION_to_UNDER_REVIEW
    - state_machines.PublicComment.TRIAGED_to_ADDRESSED
    - entities.BoundaryScenario.fields.revision_round
    - entities.BoundaryScenario.fields.revision_reason
    - validations[priority=70]
    distinguishing_aspect: 'CYCLE shape: the scenario re-enters a state it already occupied (UNDER_REVIEW -> REVISION -> UNDER_REVIEW) on the SAME entity row, and the loop is metered by revision_round, which increments only on the REVISION -> UNDER_REVIEW leg (0 -> 1) and not on the outbound leg - so the loop is bounded by MAX_REVISION_ROUNDS 3 rather than free-running.'
