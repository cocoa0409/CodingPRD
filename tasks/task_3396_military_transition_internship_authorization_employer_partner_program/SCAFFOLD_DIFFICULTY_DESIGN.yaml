            - { call: "POST /skillbridge/service-members", payload: { full_name: "Alice Vega", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { mA: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Ben Cole", service_branch: "NAVY", pay_grade: "E6", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { mB: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Cara Diaz", service_branch: "USMC", pay_grade: "E4", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { mC: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${mA}" }, as: ServiceMember, as_user_id: "${mA}", captures: { appA: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${mB}" }, as: ServiceMember, as_user_id: "${mB}", captures: { appB: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${mC}" }, as: ServiceMember, as_user_id: "${mC}", captures: { appC: $.data.id } }
            - { call: "POST /skillbridge/internship-applications/${appA}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/internship-applications/${appB}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/internship-applications/${appC}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/employer-openings", payload: { employer_id: "${emp}", title: "Warehouse Operations Intern", required_skills: ["LOGISTICS"], location_type: "REMOTE", capacity: 1 }, as: EmployerRep, as_user_id: "${emp}", captures: { op: $.data.id, op_v: $.data.version } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appA}", employer_opening_id: "${op}", start_date: "2026-11-01", end_date: "2026-12-01", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mtA: $.data.id } }
            - { call: "GET /skillbridge/employer-openings/${op}", as: ProgramOffice, captures: { op_v2: $.data.version } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appB}", employer_opening_id: "${op}", start_date: "2026-12-01", end_date: "2027-01-01", expected_employer_opening_version: "${op_v2}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mtB: $.data.id } }
            - { call: "GET /skillbridge/employer-openings/${op}", as: ProgramOffice, captures: { op_v3: $.data.version } }
          trigger:
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${appC}", employer_opening_id: "${op}", start_date: "2026-11-20", end_date: "2026-12-20", expected_employer_opening_version: "${op_v3}" }, as: EmployerRep, as_user_id: "${emp}" }
          assert:
            - "matchB succeeded despite capacity 1 because its [2026-12-01, 2027-01-01) shares zero instants with matchA's [2026-11-01, 2026-12-01) — concurrency threshold, not pairwise exclusion"
            - "matchC [2026-11-20, 2026-12-20) rejected ERR_OPENING_AT_CAPACITY (409): it overlaps matchA for 11 days and matchB for 19 days, driving concurrent occupancy to 2 > capacity 1"

  - rule_id: compensating_invariant
    instances:
      - name: opening_slot_ledger_roundtrip
        grounds:
          - entities.EmployerOpening.fields.filled_count
          - state_machines.InternshipMatch.PROPOSED_to_TERMINATED_EARLY
          - validations[priority=20]
        distinguishing_aspect: |
          Conserved quantity: the opening slot ledger — filled_count ==
          COUNT(matches on the opening in {PROPOSED, INSTALLATION_APPROVED,
          ACTIVE}). A create fills the slot (1), a compensating terminate
          releases it (0), and a capacity-1 opening then accepts a new tenant,
          proving the pair left the ledger unchanged.
        test_recipe:
          setup:
            - "Employer emp AUTHORIZED; opening op capacity 1; members m1, m2 (separation 2027-01-15) with APPROVED applications"
            - "match1 (m1, [2026-11-01, 2026-12-01)) PROPOSED — ledger at 1, opening version 2"
          setup_api_calls:
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Liberty", command_code: "ACC", region_code: "R1", max_internship_duration_days: 120, appeal_window_days: 14, requires_tap_complete: false }, as: ProgramOffice, captures: { inst: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Alice Vega", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m1: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Ben Cole", service_branch: "NAVY", pay_grade: "E6", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m2: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m1}" }, as: ServiceMember, as_user_id: "${m1}", captures: { app1: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m2}" }, as: ServiceMember, as_user_id: "${m2}", captures: { app2: $.data.id } }
            - { call: "POST /skillbridge/internship-applications/${app1}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/internship-applications/${app2}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/employer-openings", payload: { employer_id: "${emp}", title: "Warehouse Operations Intern", required_skills: ["LOGISTICS"], location_type: "REMOTE", capacity: 1 }, as: EmployerRep, as_user_id: "${emp}", captures: { op: $.data.id, op_v: $.data.version } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app1}", employer_opening_id: "${op}", start_date: "2026-11-01", end_date: "2026-12-01", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mt1: $.data.id } }
            - { call: "GET /skillbridge/employer-openings/${op}", as: ProgramOffice, captures: { op_v2: $.data.version, filled1: $.data.filled_count } }
          trigger:
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app2}", employer_opening_id: "${op}", start_date: "2026-11-10", end_date: "2026-12-10", expected_employer_opening_version: "${op_v2}" }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/internship-matches/${mt1}/terminate", payload: { reason: "VOLUNTARY" }, as: EmployerRep, as_user_id: "${emp}", captures: { mt1_status: $.data.match_status } }
            - { call: "GET /skillbridge/employer-openings/${op}", as: ProgramOffice, captures: { op_v3: $.data.version, filled2: $.data.filled_count } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app2}", employer_opening_id: "${op}", start_date: "2026-11-10", end_date: "2026-12-10", expected_employer_opening_version: "${op_v3}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mt2: $.data.id } }
            - { call: "GET /skillbridge/employer-openings/${op}", as: ProgramOffice, captures: { filled3: $.data.filled_count } }
          assert:
            - "after create: filled_count == 1 (ledger == COUNT of non-terminal matches on ${op})"
            - "m2 proposal while match1 holds the overlapping slot: ERR_OPENING_AT_CAPACITY (409)"
            - "compensating terminate: match1 -> TERMINATED_EARLY and filled_count == 0 (ledger restored)"
            - "retry of the identical m2 proposal with the fresh version succeeds (slot genuinely released) and filled_count == 1 again"
            - "EmployerOpening.version stepped 2 -> 3 across the terminate (every mutation bumps it)"

      - name: violation_ledger_cleared_by_audit
        grounds:
          - entities.Employer.fields.pending_violations
          - entities.Employer.fields.last_cleared_audit_at
          - state_machines.ComplianceAudit.OPEN_to_CLOSED_CLEARED
        distinguishing_aspect: |
          Conserved quantity: the employer violation ledger — pending_violations
          == COUNT(violating WageRecords on the employer's matches created after
          last_cleared_audit_at). A violating record raises it (1); the
          compensating CLEARED audit close resets it (0); a later violation
          counts from the new baseline (1 again, not 2) — a different conserved
          quantity from the opening slot ledger.
        test_recipe:
          setup:
            - "Employer emp AUTHORIZED; match mt ACTIVE on opening op for [2026-10-01, 2026-10-31) (plan approved, clock at 2026-10-01)"
          setup_api_calls:
            - { call: "POST /skillbridge/installations", payload: { name: "Fort Liberty", command_code: "ACC", region_code: "R1", max_internship_duration_days: 120, appeal_window_days: 14, requires_tap_complete: false }, as: ProgramOffice, captures: { inst: $.data.id } }
            - { call: "POST /skillbridge/service-members", payload: { full_name: "Alice Vega", service_branch: "ARMY", pay_grade: "E5", separation_date: "2027-01-15", skills: ["LOGISTICS"], home_installation_id: "${inst}" }, as: TransitionCounselor, captures: { m: $.data.id } }
            - { call: "POST /skillbridge/internship-applications", payload: { service_member_id: "${m}" }, as: ServiceMember, as_user_id: "${m}", captures: { app: $.data.id } }
            - { call: "POST /skillbridge/internship-applications/${app}/commander-decision", payload: { decision: "APPROVE" }, as: UnitCommander, as_user_id: "cmd-1" }
            - { call: "POST /skillbridge/employers", payload: { legal_name: "Acme Logistics LLC", industry_code: "LOG" }, as: ProgramOffice, captures: { emp: $.data.id } }
            - { call: "POST /skillbridge/employers/${emp}/authorize", payload: {}, as: ProgramOffice }
            - { call: "POST /skillbridge/employer-openings", payload: { employer_id: "${emp}", title: "Warehouse Operations Intern", required_skills: ["LOGISTICS"], location_type: "REMOTE", capacity: 1 }, as: EmployerRep, as_user_id: "${emp}", captures: { op: $.data.id, op_v: $.data.version } }
            - { call: "POST /skillbridge/internship-matches", payload: { internship_application_id: "${app}", employer_opening_id: "${op}", start_date: "2026-10-01", end_date: "2026-10-31", expected_employer_opening_version: "${op_v}" }, as: EmployerRep, as_user_id: "${emp}", captures: { mt: $.data.id } }
            - { call: "POST /skillbridge/internship-matches/${mt}/submit-plan", payload: { learning_objectives: [{ objective_code: "O1", description: "Safety basics", weight_hours: 10 }], supervisor_name: "S. Supervisor", weekly_hours: 40 }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "POST /skillbridge/internship-matches/${mt}/review-plan", payload: { outcome: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/internship-matches/${mt}/installation-decision", payload: { decision: "APPROVE" }, as: InstallationAuthority, as_user_id: "auth-1" }
            - { call: "POST /skillbridge/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ProgramOffice }
          trigger:
            - { call: "POST /skillbridge/wage-records", payload: { internship_match_id: "${mt}", period_start_date: "2026-10-05", period_end_date: "2026-10-11", amount_cents: 2500 }, as: EmployerRep, as_user_id: "${emp}", captures: { wr1: $.data.is_violation } }
            - { call: "GET /skillbridge/employers/${emp}", as: ProgramOffice, captures: { pend1: $.data.pending_violations, cleared1: $.data.last_cleared_audit_at } }
            - { call: "POST /skillbridge/compliance-audits", payload: { employer_id: "${emp}" }, as: ProgramOffice, captures: { a: $.data.id } }
            - { call: "POST /skillbridge/compliance-audits/${a}/close", payload: {}, as: ProgramOffice, captures: { a_status: $.data.status, a_score: $.data.compliance_score } }
            - { call: "GET /skillbridge/employers/${emp}", as: ProgramOffice, captures: { pend2: $.data.pending_violations, cleared2: $.data.last_cleared_audit_at, emp_status2: $.data.authorization_status } }
            - { call: "POST /skillbridge/wage-records", payload: { internship_match_id: "${mt}", period_start_date: "2026-10-12", period_end_date: "2026-10-13", amount_cents: 100 }, as: EmployerRep, as_user_id: "${emp}" }
            - { call: "GET /skillbridge/employers/${emp}", as: ProgramOffice, captures: { pend3: $.data.pending_violations } }
          assert:
            - "first violating record: is_violation == true; pending_violations == 1 with last_cleared_audit_at == null (ledger counts all violations since beginning)"
            - "empty-findings close: status CLOSED_CLEARED, compliance_score == 100.00 (>= 70 clears)"
            - "compensating action: pending_violations == 0, last_cleared_audit_at == 2026-10-01T00:00:00Z (the logical clock), employer still AUTHORIZED (no threshold breach survived)"
            - "second violating record after the clear: pending_violations == 1 — the ledger counts from the new baseline, not cumulatively"
