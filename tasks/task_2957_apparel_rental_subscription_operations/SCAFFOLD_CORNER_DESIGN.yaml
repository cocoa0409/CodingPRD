            - "GET /shipments/{id}: HTTP 404 with error_id == ERR_SHIPMENT_NOT_FOUND"
            - "GET /reverse-logistics-jobs/{id}: HTTP 404 with error_id == ERR_JOB_NOT_FOUND"
            - "GET /inspections/{id}: HTTP 404 with error_id == ERR_INSPECTION_NOT_FOUND"
            - "GET /damage-claims/{id}: HTTP 404 with error_id == ERR_CLAIM_NOT_FOUND"
            - "GET /resale-listings/{id}: HTTP 404 with error_id == ERR_LISTING_NOT_FOUND"
            - "GET /fee-ledger-entries/{id}: HTTP 404 with error_id == ERR_FEE_ENTRY_NOT_FOUND"
            - "every response body is { meta, response_type: error, data: { error_id, message } } with a non-empty message"
      - name: errors_unresolvable_body_foreign_keys_report_the_referenced_family
        claim_type: not_found_catalogue
        grounds:
          - "validations.priority 7"
          - "errors[ERR_PLAN_NOT_FOUND]"
          - "errors[ERR_STYLE_NOT_FOUND]"
          - "errors[ERR_RENTAL_UNIT_NOT_FOUND]"
          - "errors[ERR_RESERVATION_NOT_FOUND]"
          - "errors[ERR_LISTING_NOT_FOUND]"
          - "endpoints.POST /resale-listings"
        distinguishing_aspect: >-
          Priority 7 must name the family of the FK that failed, not the entity being created, so a bad
          membership_plan_id on POST /members is ERR_PLAN_NOT_FOUND and a bad preferred_unit_id on POST
          /reservations is ERR_RENTAL_UNIT_NOT_FOUND rather than ERR_MEMBER_NOT_FOUND or ERR_INVALID_REQUEST. The
          last two calls also fix the ordering against the OCC check: an unresolvable rental_unit_id is a 404 even
