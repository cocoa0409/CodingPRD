scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: adaptation_provisional_vs_final_fidelity_diverge
        grounds:
          - calculations.adaptation_fidelity_score
          - entities.ScriptAdaptation.fields.provisional_fidelity_score
          - entities.ScriptAdaptation.fields.final_fidelity_score
          - state_machines.ScriptAdaptation.TRANSLATED_to_ADAPTED
          - state_machines.ScriptAdaptation.ADAPTED_to_IN_REVIEW
        distinguishing_aspect: |
          The dual variant lives on the ScriptAdaptation entity domain (lip-sync quality): provisional_declared reads only declared_loop_count against Cut.loop_count while final_measured reads only measured deviation against PlatformSpec.max_lipsync_deviation_ms, so the SAME row ends up carrying both 0.9409 and 0.6596 at once.
        test_recipe:
          setup:
          - "A LOCKED cut with loop_count 400 and an EXPEDITED order on a spec whose max_lipsync_deviation_ms is 120"
          - "A ScriptAdaptation in ADAPTED with declared_loop_count 380 and provisional_fidelity_score already stamped"
          setup_api_calls:
          - call: "POST /_clock/set_current_utc"
            payload: { to_iso8601: "2026-09-01T00:00:00Z" }
            as: PlatformAdmin
          - call: "POST /titles"
            payload: { title_code: "TTL-2146", source_language: "en-US", runtime_seconds: 7200, content_rating: "TEEN" }
            as: ProductionCoordinator
            captures: { t_id: "$.data.id" }
          - call: "POST /cuts"
            payload: { title_id: "${t_id}", cut_code: "THEATRICAL", loop_count: 400, runtime_seconds: 7200 }
            as: ProductionCoordinator
            captures: { c_id: "$.data.id" }
          - call: "POST /cuts/${c_id}/lock"
            payload: {}
            as: ProductionCoordinator
          - call: "POST /characters"
            payload: { title_id: "${t_id}", character_code: "HERO", loop_count: 220, screen_time_seconds: 3000, is_principal: true }
            as: ProductionCoordinator
            captures: { ch1_id: "$.data.id" }
          - call: "POST /characters"
            payload: { title_id: "${t_id}", character_code: "SIDEKICK", loop_count: 180, screen_time_seconds: 1500, is_principal: false }
            as: ProductionCoordinator
            captures: { ch2_id: "$.data.id" }
          - call: "POST /platform-specs"
            payload: { platform_code: "STREAM_A", loudness_target_lufs: -24.0, stem_layout: "FIVE_ONE_ME", max_lipsync_deviation_ms: 120, min_fidelity_score: 0.65, qc_pass_threshold: 0.9, metadata_fields_required: ["title_local", "synopsis_local"] }
            as: ProductionCoordinator
            captures: { ps_id: "$.data.id" }
          - call: "POST /studios"
            payload: { name: "Booth 1", territory: "DE", hourly_rate_cents: 24000, turnaround_buffer_minutes: 30, daily_capacity_minutes: 600 }
            as: ProductionCoordinator
            captures: { st_id: "$.data.id" }
          - call: "POST /voice-talents"
            payload: { full_name: "Anna Vogel", language_code: "de-DE", base_rate_cents_per_hour: 30000, licensed_territories: ["US", "DE", "JP"], union_status: "NON_UNION", max_daily_recorded_minutes: 300 }
            as: CastingDirector
            captures: { tal1_id: "$.data.id" }
          - call: "POST /voice-talents"
            payload: { full_name: "Bruno Keller", language_code: "de-DE", base_rate_cents_per_hour: 30000, licensed_territories: ["US", "DE", "JP"], union_status: "NON_UNION", max_daily_recorded_minutes: 300 }
            as: CastingDirector
            captures: { tal2_id: "$.data.id" }
          - call: "POST /localization-orders"
            payload: { cut_id: "${c_id}", platform_spec_id: "${ps_id}", target_language: "de-DE", territory: "DE", budget_cap_cents: 500000, priority_tier: "EXPEDITED" }
            as: ProductionCoordinator
            captures: { o_id: "$.data.id" }
          - call: "POST /script-adaptations"
            payload: { order_id: "${o_id}" }
            as: Adaptor
            as_user_id: "adaptor-1"
            captures: { sa_id: "$.data.id" }
          - call: "POST /script-adaptations/${sa_id}/translate"
            payload: {}
            as: Adaptor
            as_user_id: "adaptor-1"
          - call: "POST /script-adaptations/${sa_id}/adapt"
            payload: { declared_loop_count: 380 }
            as: Adaptor
            as_user_id: "adaptor-1"
          trigger:
          - call: "POST /script-adaptations/${sa_id}/submit-review"
            payload: { measured_sync_deviation_ms_total: 22800, lines_over_deviation: 38 }
            as: Adaptor
            as_user_id: "adaptor-1"
          assert:
          - "ScriptAdaptation.${sa_id}.provisional_fidelity_score == 0.9409"
          - "ScriptAdaptation.${sa_id}.final_fidelity_score == 0.6596"
          - "ScriptAdaptation.${sa_id}.provisional_fidelity_score != ScriptAdaptation.${sa_id}.final_fidelity_score"
          - "ScriptAdaptation.${sa_id}.status == IN_REVIEW"
          - "LocalizationOrder.${o_id}.status == CASTING"
      - name: talent_payment_buyout_vs_residual_diverge
        grounds:
          - calculations.talent_usage_fee_cents
          - entities.TalentPayment.fields.usage_fee_cents
