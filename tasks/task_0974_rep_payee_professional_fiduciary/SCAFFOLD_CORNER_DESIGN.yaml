            - { call: "POST /disbursements", payload: { client_id: "${c_id}", account_id: "${a_id}", budget_plan_id: "${p_id}", payee_name: "Susp Payee", category: "HOUSING", amount_cents: 7000, scheduled_release_date: "2026-06-10" }, as: CaseManager, as_user_id: "cm-1", captures: { w_id: $.data.id } }
