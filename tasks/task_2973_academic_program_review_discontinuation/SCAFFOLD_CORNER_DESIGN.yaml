            - "AgencyNotification.${n2_id}.agency_type == STATE_AGENCY with agency_code STATE-CHE and due_at == 2026-10-30T10:00:00Z (ratified_at + 45 days)"
            - "the first sweep, run at exactly the accreditor due_at, returns 200 with marked_overdue_count == 0 and marked_overdue_notification_ids == [] — the comparison is strictly greater, so equality does not expire the notice"
            - "after the first sweep both notices are still PENDING with overdue_marked_at == null"
            - "the second sweep, one second later, returns marked_overdue_count == 1 with marked_overdue_notification_ids == [${n1_id}]"
            - "AgencyNotification.${n1_id}.status == OVERDUE with overdue_marked_at == 2026-10-15T10:00:01Z; AgencyNotification.${n2_id}.status == PENDING with overdue_marked_at == null"
            - "DecisionRecord.${dec_id}.unacknowledged_notification_count is still 2 and ReviewCycle.${cycle_id}.compliance_posture is still NOTICES_PENDING — OVERDUE is just a flavour of unacknowledged"

      - name: manual_notice_on_an_unratified_decision_anchors_due_at_on_the_clock
        claim_type: correct_result
        grounds:
          - calculations.agency_notice_deadline
          - endpoints["POST /provost/decision-records/{id}/agency-notifications"]
          - entities.AgencyNotification.fields.origin
        distinguishing_aspect: |
          The anchor branch is observable only on a decision whose ratified_at
          is still null: the FEDERAL notice's 60-day offset must run from the
          logical clock at creation time, not from a null ratified_at and not
          from the decision's created_at. The row is MANUAL, and it makes an
          unratified decision start carrying an unacknowledged notice, which is
          how compliance_posture becomes NOTICES_PENDING before ratification.
        test_recipe:
          setup:
            - "Program HIST-BA carried to a PROPOSED DISCONTINUATION decision proposed at 2026-09-15T10:00:00Z."
