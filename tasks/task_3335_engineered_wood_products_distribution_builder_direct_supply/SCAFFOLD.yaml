    code: 201
    input: [product_id, qty_received_mbf, unit_cost_cents_per_mbf]
    output: InventoryLot
    side_effects: ["lot_status ON_HAND; qty_available_mbf = qty_received_mbf"]

  - method: GET
    path: "/inventory-lots/{lot_id}"
    description: "Get a single inventory lot"
    roles: [OpsAdmin, MillPlanner, BranchManager, CreditManager, AccountManager, FleetCoordinator, BuilderContact]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  - method: GET
    path: "/inventory-lots"
