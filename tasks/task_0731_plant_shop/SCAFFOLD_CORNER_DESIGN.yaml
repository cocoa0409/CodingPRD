          setup: ["Subscription created at 2026-04-01, initial next_fulfillment_at = 2026-05-01. Matching stock exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: Manager
            - call: "POST /customers/register"
              payload: { email: "c20@x.com", full_name: "C20", delivery_zone: "ZONE_A", address_line: "1 T" }
              as: Anonymous
              captures: { cust_id: "$.data.id" }
            - call: "POST /plants"
              payload: { name: "Match", light_tag: "MEDIUM", care_tag: "EASY", weight_class: "LIGHT", unit_price_cents: 2500, warranty_days: 30 }
              as: Manager
              captures: { plant_id: "$.data.id" }
            - call: "POST /plants/${plant_id}/stock-units"
              payload: { acquisition_date: "2026-03-25T00:00:00Z" }
              as: ShopStaff
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_tier: "STARTER", care_tag_preference: "EASY", light_tag_preference: "MEDIUM" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T00:00:00Z" }
