          - entities.Booking.fields.premium_cents
        distinguishing_aspect: >-
          On the canonical booking the three named steps each produce a
          different number and only their composition gives 24951: the daily
          floor is 4900*4 = 19600, the percentage term is
          round_half_up(110896*1800/10000) = 19961 and wins the max, the BASIC
          towing surcharge adds round_half_up(19961*2500/10000) = 4990, and the
          ceiling cap round_half_up(3000000*1500/10000) = 450000 does not bind.
        test_recipe:
          setup: "Full canonical marketplace with the listing LISTED and the wallet funded."
          setup_api_calls:
