      - name: zone_daily_cap_exceeded_on_publish
        claim_type: error_triggerability
        excluded_because:
          difficulty_instance: zone_daily_slot_cap_is_pure_aggregate_capacity_without_intervals
          rationale: "That §1.8 instance triggers ERR_ZONE_DAILY_CAP_EXCEEDED on POST /crr/routes/{id}/publish once the zone's aggregate planned slots for the service_date cross daily_visit_cap."

      - name: overlapping_grant_period_on_activate
        claim_type: error_triggerability
        excluded_because:
          difficulty_instance: grant_periods_are_closed_intervals_so_a_shared_end_date_overlaps
          rationale: "That §1.8 instance triggers ERR_GRANT_PERIOD_OVERLAP at activation for two grants of the same partner sharing a single boundary date, and admits the pair that is one day apart."

  # =========================================================================
  # 7. From Table 7 (RBAC) - role_model: segregation_of_duties
  # =========================================================================
  - section: rbac
    instances:
      - name: zone_create_by_a_canvass_coordinator_returns_forbidden
        claim_type: unauthorized_denial
        grounds:
          - roles.RiskAnalyst.exclusive_operations
          - roles.CanvassCoordinator
          - validations[priority 2 - auth - ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "POST /crr/zones is exclusive to RiskAnalyst, and the coordinator that consumes zones for routing cannot create one: 403 ERR_ROLE_NOT_PERMITTED even with a perfectly valid body, while the same coordinator's GET /crr/zones succeeds in the same test."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: CanvassCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /crr/zones"
              as: CanvassCoordinator
          assert:
            - "first response.status == 403 and response.error_id == ERR_ROLE_NOT_PERMITTED"
            - "second response.status == 200 with total_count 0 - the same role reads zones fine, so the denial is operation-scoped, not resource-scoped"
            - "no RiskZone row exists"

      - name: call_without_role_headers_returns_unauthenticated
        claim_type: unauthorized_denial
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority 1 - auth]
          - roles
        distinguishing_aspect: "Authentication is checked before authorization and before body parsing: a missing header pair and a syntactically valid but undeclared role (FireMarshal) both yield 401 ERR_UNAUTHENTICATED, never 403 and never 400, even though the body of the second call is also missing required fields."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: "(no X-User-Role and no X-User-ID header sent)"
              captures: { e_missing: $.data.error_id }
            - call: "GET /crr/zones"
              as: "FireMarshal (undeclared role value in X-User-Role)"
              captures: { e_unknown: $.data.error_id }
          assert:
            - "both responses have status 401"
            - "${e_missing} == ERR_UNAUTHENTICATED"
            - "${e_unknown} == ERR_UNAUTHENTICATED (an undeclared role is unauthenticated, not 403)"
            - "no RiskZone row exists"

      - name: technician_working_another_crews_visit_returns_forbidden
        claim_type: unauthorized_denial
        grounds:
          - errors.ERR_CREW_NOT_ASSIGNED
          - validations[priority 6 - auth - entity-backed identity]
          - roles.CrrTechnician.identity
        distinguishing_aspect: "CrrTechnician is entity-backed: the role is permitted on arrive, but the acting X-User-ID must equal the visit's route.crew_id. CREW-B2 is a fully valid ADVANCED crew and still gets 403, and the same request from CREW-B1 then succeeds - proving the check is per-resource, not per-role."
        test_recipe:
          setup:
            - "One published route owned by CREW-B1 with a booked visit; CREW-B2 exists but owns no route."
          setup_api_calls:
