scenario: "Collector Vehicle Agreed-Value Coverage & Usage Limits (Hagerty): vehicle eligibility screening on age, condition, storage and use with photo documentation, agreed value determination using valuation tools, appraisals and auction data with periodic revaluation, usage limitations restricting commuting and daily driving with mileage allowances and event exceptions, driver eligibility requirements including a separate daily driver and clean record, claim handling with specialty repair shops, parts sourcing and total loss payment at agreed value, valuation data publication used by the market and the underwriting process, membership and club programs with events, roadside for classics and community features, coverage for vehicles in restoration with increasing value endorsements"

domain_name: collector-vehicle-agreed-value
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member full legal name" }
      - { name: email, type: string, source: input, description: "Member email; unique across members" }
      - { name: has_daily_driver, type: boolean, source: input, description: "Whether the member owns or leases a separate daily-driver vehicle (required for policy issuance)" }
      - { name: daily_driver_vehicle_desc, type: string, source: input, required: false, description: "Free-text description of the separate daily driver" }
      - { name: driving_record_status, type: enum, source: input, description: "CLEAN | MINOR_VIOLATIONS | MAJOR_VIOLATIONS" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: Vehicle
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning member" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number; unique" }
      - { name: year, type: integer, source: input, description: "Model year" }
      - { name: make, type: string, source: input, description: "Manufacturer" }
      - { name: model, type: string, source: input, description: "Model name" }
      - { name: vehicle_class, type: enum, source: input, description: "ANTIQUE | CLASSIC | MODERN_COLLECTIBLE | EXOTIC" }
      - { name: condition_grade, type: enum, source: input, description: "EXCELLENT | GOOD | FAIR | PROJECT" }
      - { name: storage_type, type: enum, source: input, description: "ENCLOSED_GARAGE | CARPORT | OUTDOOR" }
      - { name: primary_use, type: enum, source: input, description: "SHOW | PLEASURE | RESTORATION" }
      - { name: eligibility_status, type: enum, source: computed, default: PENDING, description: "PENDING | ELIGIBLE | INELIGIBLE — derived from age, condition, storage, use" }
      - { name: eligibility_reasons, type: array, source: computed, description: "List of failed eligibility rule codes when INELIGIBLE" }
      - { name: documentation_status, type: enum, source: computed, default: INCOMPLETE, description: "INCOMPLETE | COMPLETE — COMPLETE when all 8 required photo types are ACCEPTED" }
      - { name: accepted_photo_count, type: integer, source: computed, default: 0, description: "Count of VehiclePhoto rows in ACCEPTED status" }
      - { name: current_valuation_id, type: string, source: computed, description: "Valuation.id of the current APPROVED non-stale valuation, if any" }
      - { name: current_agreed_value_cents, type: integer, source: computed, description: "final_agreed_value_cents of the current valuation; null when none" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | INSURED | UNDER_RESTORATION | RETIRED" }

  - name: VehiclePhoto
    parent: Vehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: photo_type, type: enum, source: input, description: "FRONT | REAR | DRIVER_SIDE | PASSENGER_SIDE | INTERIOR | ENGINE | ODOMETER | VIN_PLATE" }
      - { name: image_ref, type: string, source: input, description: "Opaque reference to the stored image" }
      - { name: captured_at, type: datetime, source: input, description: "When the photo was taken (ISO 8601)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | ACCEPTED | REJECTED" }
      - { name: review_note, type: string, source: input, required: false, description: "Reviewer note recorded at review time" }

  - name: ValuationGuide
    parent: null
    common_fields: true
    fields:
      - { name: edition, type: string, source: input, description: "Guide edition label; unique (e.g. 2026-Q3)" }
      - { name: effective_date, type: datetime, source: input, description: "Date the edition takes effect" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | SUPERSEDED" }

  - name: ValuationGuideEntry
    parent: ValuationGuide
    common_fields: true
    fields:
      - { name: guide_id, type: string, source: input, description: "FK -> ValuationGuide.id" }
      - { name: vehicle_class, type: enum, source: input, description: "ANTIQUE | CLASSIC | MODERN_COLLECTIBLE | EXOTIC" }
      - { name: make, type: string, source: input, description: "Manufacturer this entry covers" }
      - { name: year_min, type: integer, source: input, description: "Inclusive minimum model year" }
      - { name: year_max, type: integer, source: input, description: "Inclusive maximum model year" }
      - { name: base_value_cents, type: integer, source: input, description: "Guide base value in cents for condition GOOD before multiplier" }

  - name: Appraisal
    parent: Vehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: appraiser_user_id, type: string, source: system, description: "X-User-ID of the Appraiser who submitted; used for segregation of duties" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Appraiser's opinion of value in cents" }
      - { name: appraised_at, type: datetime, source: input, description: "Date of appraisal inspection" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | CERTIFIED | REJECTED" }

  - name: AuctionResult
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_class, type: enum, source: input, description: "ANTIQUE | CLASSIC | MODERN_COLLECTIBLE | EXOTIC" }
      - { name: make, type: string, source: input, description: "Manufacturer" }
      - { name: model, type: string, source: input, description: "Model name" }
      - { name: year, type: integer, source: input, description: "Model year" }
      - { name: sale_price_cents, type: integer, source: input, description: "Hammer price in cents" }
      - { name: sale_date, type: datetime, source: input, description: "Auction sale date" }
      - { name: source_name, type: string, source: input, description: "Auction house or marketplace name" }

  - name: Valuation
    parent: Vehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: method, type: enum, source: input, description: "GUIDE_TOOL | CERTIFIED_APPRAISAL | AUCTION_COMPOSITE" }
      - { name: appraisal_id, type: string, source: input, required: false, description: "FK -> Appraisal.id; required iff method == CERTIFIED_APPRAISAL" }
      - { name: guide_id, type: string, source: system, required: false, description: "FK -> ValuationGuide.id; the PUBLISHED guide pinned at creation when method == GUIDE_TOOL" }
      - { name: computed_value_cents, type: integer, source: computed, description: "Method-specific computed value in cents (see calculations)" }
      - { name: proposed_agreed_value_cents, type: integer, source: input, description: "Agreed value proposed for underwriting" }
      - { name: final_agreed_value_cents, type: integer, source: computed, description: "Set at APPROVED: equals proposed_agreed_value_cents" }
      - { name: band_override, type: boolean, source: input, default: false, description: "Underwriter override permitting proposed value outside the +/-20% guide sanity band" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PROPOSED | APPROVED | REJECTED | SUPERSEDED | STALE" }
      - { name: approved_by_user_id, type: string, source: system, required: false, description: "X-User-ID of the approving Underwriter" }
      - { name: approved_at, type: datetime, source: system, required: false, description: "Logical-clock timestamp of approval" }
      - { name: is_stale, type: boolean, source: computed, default: false, description: "True when pinned guide is SUPERSEDED or approved_at is more than 365 days before the logical clock" }

  - name: Policy
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; policyholder" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; covered vehicle" }
      - { name: valuation_id, type: string, source: input, description: "FK -> Valuation.id; valuation pinned at issuance (version-pinned on approval)" }
      - { name: usage_tier, type: enum, source: input, description: "LIMITED | REGULAR | EXTENDED" }
      - { name: annual_mileage_allowance, type: integer, source: input, default: 3000, description: "Billable miles allowed per policy period" }
      - { name: period_start, type: datetime, source: input, description: "Coverage period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Coverage period end (exclusive) — half-open interval [period_start, period_end)" }
      - { name: agreed_value_cents, type: integer, source: computed, description: "Copied from pinned valuation final_agreed_value_cents at issuance" }
      - { name: endorsement_limit_cents, type: integer, source: computed, default: 0, description: "Increasing-value endorsement from the vehicle's ACTIVE RestorationProject; 0 otherwise" }
      - { name: coverage_limit_cents, type: integer, source: computed, description: "agreed_value_cents + endorsement_limit_cents" }
      - { name: premium_cents, type: integer, source: computed, description: "Premium per calculations.premium_quote" }
      - { name: billable_miles_used, type: integer, source: computed, default: 0, description: "Sum of billable_miles over RECORDED usage events, chronological" }
      - { name: overage_charge_cents, type: integer, source: computed, default: 0, description: "Sum of per-event overage charges (per-event rounding, then summed)" }
      - { name: remaining_allowance_miles, type: integer, source: computed, description: "annual_mileage_allowance - billable_miles_used; may go negative" }
      - { name: status, type: enum, source: system, description: "QUOTED | PENDING_DOCUMENTS | ACTIVE | UNDER_REVIEW | SUSPENDED | LAPSED | CANCELLED" }

  - name: Driver
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: full_name, type: string, source: input, description: "Driver full name" }
      - { name: license_number, type: string, source: input, description: "Driver license number" }
      - { name: years_licensed, type: integer, source: input, description: "Years holding a license; must be >= 5" }
      - { name: violations_last_3y, type: integer, source: input, description: "Moving violations in last 3 years; must be 0 (clean record)" }
      - { name: is_primary, type: boolean, source: input, description: "Whether this is the primary listed driver" }
      - { name: status, type: enum, source: system, default: LISTED, description: "LISTED | REMOVED" }

  - name: UsageEvent
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: reported_miles, type: integer, source: input, description: "Miles driven in this event; must be > 0" }
      - { name: event_date, type: datetime, source: input, description: "Date driven; must fall within [period_start, period_end)" }
      - { name: event_kind, type: enum, source: input, description: "ORDINARY | CLUB_EVENT | PARADE | EXHIBITION — non-ORDINARY kinds are mileage-exempt" }
      - { name: billable_miles, type: integer, source: computed, description: "reported_miles when ORDINARY, else 0" }
      - { name: overage_charge_cents, type: integer, source: computed, description: "Per-event overage charge per calculations.mileage_ledger" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | REVERSED" }

  - name: RepairShop
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shop name" }
      - { name: specialty, type: string, source: input, description: "Marque/era specialty" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Certified labor rate in cents" }
      - { name: status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | CERTIFIED | SUSPENDED" }

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id" }
      - { name: incident_date, type: datetime, source: input, description: "Loss date; must fall within [period_start, period_end)" }
      - { name: loss_type, type: enum, source: input, description: "COLLISION | THEFT | FIRE | VANDALISM | WEATHER" }
      - { name: description, type: string, source: input, description: "Loss description" }
      - { name: repair_shop_id, type: string, source: input, required: false, description: "FK -> RepairShop.id; specialty shop assigned for repair" }
      - { name: estimate_cents, type: integer, source: input, required: false, description: "Repair estimate in cents" }
      - { name: salvage_retained, type: boolean, source: input, default: false, description: "Owner keeps salvage on total loss" }
      - { name: salvage_value_cents, type: integer, source: input, default: 0, description: "Salvage value deducted from total-loss payout when retained" }
      - { name: settlement_variant, type: enum, source: computed, default: NONE, description: "NONE | REPAIR | TOTAL_LOSS" }
      - { name: payout_cents, type: integer, source: computed, description: "Computed at settle per calculations.claim_payout" }
      - { name: declared_by_user_id, type: string, source: system, required: false, description: "ClaimsAdjuster X-User-ID who declared total loss" }
      - { name: settled_by_user_id, type: string, source: system, required: false, description: "ClaimsAdjuster X-User-ID who settled" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | UNDER_INVESTIGATION | REPAIR_AUTHORIZED | TOTAL_LOSS_DECLARED | PAID | CLOSED" }

  - name: RestorationProject
    parent: Vehicle
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; policy carrying the increasing-value endorsement" }
      - { name: stage, type: enum, source: system, default: DISASSEMBLY, description: "DISASSEMBLY | BODYWORK | MECHANICAL | FINISH | COMPLETE" }
      - { name: receipts_total_cents, type: integer, source: computed, default: 0, description: "Sum of submitted restoration receipt amounts" }
      - { name: endorsement_limit_cents, type: integer, source: computed, default: 0, description: "min(receipts_total_cents, stage cap) per calculations.restoration_endorsement" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | COMPLETED" }

  - name: ClubMembership
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: tier, type: enum, source: input, description: "BASIC | ENTHUSIAST | CONCOURS" }
      - { name: roadside_calls_limit, type: integer, source: computed, description: "Per-tier annual roadside limit: BASIC 2, ENTHUSIAST 4, CONCOURS 6" }
      - { name: roadside_calls_used, type: integer, source: computed, default: 0, description: "Count of RoadsideEvent rows in DISPATCHED or COMPLETED status" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | LAPSED" }

  - name: ClubEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: venue, type: string, source: input, description: "Venue identifier; venue-level conflict checks apply" }
      - { name: start_date, type: datetime, source: input, description: "Event start (inclusive) — closed interval" }
      - { name: end_date, type: datetime, source: input, description: "Event end (inclusive) — closed interval" }
      - { name: capacity, type: integer, source: input, description: "Maximum REGISTERED registrations" }
      - { name: registered_count, type: integer, source: computed, default: 0, description: "Count of EventRegistration rows in REGISTERED status" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | CANCELLED" }

  - name: EventRegistration
    parent: ClubEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ClubEvent.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; must match acting Member" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | CANCELLED" }

  - name: RoadsideEvent
    parent: ClubMembership
    common_fields: true
    fields:
      - { name: membership_id, type: string, source: input, description: "FK -> ClubMembership.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; must be a covered classic (status INSURED)" }
      - { name: service_type, type: enum, source: input, description: "FLATBED_TOW | BATTERY | FUEL | LOCKOUT — classics require FLATBED_TOW" }
      - { name: event_date, type: datetime, source: input, description: "Service date" }
      - { name: status, type: enum, source: system, default: DISPATCHED, description: "DISPATCHED | COMPLETED | CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /members/{id} (status=SUSPENDED)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Policies of this member in QUOTED or PENDING_DOCUMENTS stay; ACTIVE/UNDER_REVIEW policies unaffected (existing cover continues)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /members/{id} (status=ACTIVE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "PATCH /members/{id} (status=TERMINATED)"
        actor: PlatformAdmin
        preconditions:
          - "No policy of this member is ACTIVE, UNDER_REVIEW, or SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "ClubMembership of this member -> LAPSED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "PATCH /members/{id} (status=TERMINATED)"
        actor: PlatformAdmin
        preconditions:
          - "No policy of this member is ACTIVE, UNDER_REVIEW, or SUSPENDED"
        side_effects:
          - "ClubMembership of this member -> LAPSED"

  - entity: Vehicle
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    note: "eligibility_status (PENDING|ELIGIBLE|INELIGIBLE) and documentation_status (INCOMPLETE|COMPLETE) are parallel computed dimensions on the same entity, re-derived independently of the lifecycle status dimension below."
    transitions:
      - from: REGISTERED
        to: INSURED
        trigger: "system (side effect of Policy activate)"
        actor: system
        preconditions:
          - "Vehicle.eligibility_status == ELIGIBLE"
          - "Vehicle.documentation_status == COMPLETE"
        side_effects:
          - "Vehicle.version increments"
      - from: INSURED
        to: UNDER_RESTORATION
        trigger: "system (side effect of RestorationProject creation)"
        actor: system
        preconditions: []
        side_effects:
          - "Vehicle.version increments"
      - from: UNDER_RESTORATION
        to: INSURED
        trigger: "system (side effect of RestorationProject completion)"
        actor: system
        preconditions: []
        side_effects:
          - "Vehicle.version increments"
      - from: INSURED
        to: RETIRED
        trigger: "system (side effect of total-loss claim settlement)"
        actor: system
        preconditions: []
        side_effects:
          - "Vehicle.version increments"

  - entity: VehiclePhoto
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /vehicles/{vehicle_id}/photos/{photo_id}/review (decision=ACCEPT)"
        actor: Underwriter
        preconditions:
          - "Vehicle.documentation recompute runs"
        side_effects:
          - "Vehicle.accepted_photo_count recomputed; Vehicle.documentation_status -> COMPLETE when all 8 photo types are ACCEPTED"
          - "Cascade: any Policy of this vehicle in PENDING_DOCUMENTS -> QUOTED (documentation now complete)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vehicles/{vehicle_id}/photos/{photo_id}/review (decision=REJECT)"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "Vehicle.documentation_status recomputed (stays INCOMPLETE)"

  - entity: ValuationGuide
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /valuation-guides/{id}/publish"
        actor: PlatformAdmin
        preconditions:
          - "Guide has at least one ValuationGuideEntry (ERR_INVALID_STATE)"
        side_effects:
          - "Link 1: prior ValuationGuide in PUBLISHED -> SUPERSEDED"
          - "Link 2: every Valuation with method GUIDE_TOOL pinned to the superseded guide in status APPROVED -> STALE"
          - "Link 3: every Policy in ACTIVE whose pinned valuation became STALE -> UNDER_REVIEW"

  - entity: Appraisal
    initial_state: SUBMITTED
    terminal_states: [CERTIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /appraisals/{id}/certify (decision=CERTIFY)"
        actor: Underwriter
        preconditions:
          - "Acting underwriter's X-User-ID != appraisal.appraiser_user_id (segregation of duties, ERR_SOD_VIOLATION)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /appraisals/{id}/certify (decision=REJECT)"
        actor: Underwriter
        preconditions:
          - "Acting underwriter's X-User-ID != appraisal.appraiser_user_id (segregation of duties, ERR_SOD_VIOLATION)"
        side_effects: []

  - entity: Valuation
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED, STALE]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /valuations/{id}/propose"
        actor: Underwriter
        preconditions:
          - "computed_value_cents successfully derived (auction method needs >= 3 comps, ERR_AUCTION_COMPS_INSUFFICIENT)"
        side_effects: []
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /valuations/{id}/revise"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "Revision loop: proposed_agreed_value_cents may be re-set by a subsequent propose"
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /valuations/{id}/approve"
        actor: Underwriter
        preconditions:
          - "If method == CERTIFIED_APPRAISAL: linked appraisal status == CERTIFIED (ERR_APPRAISAL_NOT_CERTIFIED) and acting underwriter X-User-ID != appraisal.appraiser_user_id (ERR_SOD_VIOLATION)"
          - "Sanity band: |proposed - computed_value_cents| <= 20% of computed_value_cents unless band_override == true (ERR_APPRAISAL_OUT_OF_BAND)"
        side_effects:
          - "final_agreed_value_cents = proposed_agreed_value_cents; approved_at = logical clock; approved_by_user_id recorded"
          - "Prior APPROVED valuation of the same vehicle -> SUPERSEDED"
          - "Vehicle.current_valuation_id / current_agreed_value_cents updated"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /valuations/{id}/reject"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: STALE
        trigger: "system (pinned guide superseded, or logical clock passes approved_at + 365 days)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: Policies in ACTIVE pinned to this valuation -> UNDER_REVIEW"

  - entity: Policy
    initial_state: QUOTED
    terminal_states: [CANCELLED]
    transitions:
      - from: QUOTED
        to: PENDING_DOCUMENTS
        trigger: "system (at creation when vehicle documentation_status != COMPLETE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_DOCUMENTS
        to: QUOTED
        trigger: "system (vehicle documentation_status becomes COMPLETE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_DOCUMENTS
        to: ACTIVE
        trigger: "POST /policies/{id}/activate"
        actor: Underwriter
        preconditions:
          - "Same preconditions as QUOTED -> ACTIVE; the documentation gate fires first here (ERR_DOCUMENTATION_INCOMPLETE)"
        side_effects:
          - "Vehicle.status REGISTERED -> INSURED"
          - "premium_cents recomputed via calculations.premium_quote"
      - from: QUOTED
        to: ACTIVE
        trigger: "POST /policies/{id}/activate"
        actor: Underwriter
        preconditions:
          - "Vehicle.eligibility_status == ELIGIBLE (ERR_VEHICLE_INELIGIBLE)"
          - "Vehicle.documentation_status == COMPLETE (ERR_DOCUMENTATION_INCOMPLETE)"
          - "Pinned valuation status == APPROVED and is_stale == false (ERR_VALUATION_NOT_APPROVED / ERR_VALUATION_STALE)"
          - "Member.has_daily_driver == true (ERR_NO_DAILY_DRIVER)"
          - "Member.driving_record_status == CLEAN (ERR_RECORD_NOT_CLEAN)"
          - "Member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
          - "At least one Driver with status LISTED on the policy (ERR_DRIVER_INELIGIBLE)"
        side_effects:
          - "Vehicle.status REGISTERED -> INSURED (or stays UNDER_RESTORATION-path if already INSURED)"
          - "premium_cents recomputed via calculations.premium_quote"
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /policies/{id}/begin-review or system (pinned valuation became STALE)"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "Usage event creation and claim settlement are blocked while UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /policies/{id}/resolve-review"
        actor: Underwriter
        preconditions:
          - "Pinned valuation status == APPROVED and is_stale == false (ERR_VALUATION_STALE) — revaluation must have produced a fresh APPROVED valuation re-pinned via PATCH /policies/{id}"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /policies/{id}/suspend"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /policies/{id}/resume"
        actor: Underwriter
        preconditions:
          - "Pinned valuation not stale (ERR_VALUATION_STALE)"
        side_effects: []
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /policies/{id}/lapse or system (logical clock reaches period_end)"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /policies/{id}/resume"
        actor: Underwriter
        preconditions:
          - "Logical clock < period_end + 30 days grace (ERR_INVALID_STATE beyond grace)"
        side_effects:
          - "Mileage ledger continues (no reset on reinstatement within the same period)"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: PENDING_DOCUMENTS
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel or system (total-loss settlement)"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "RestorationProject of this policy in ACTIVE -> SUSPENDED; endorsement_limit_cents -> 0; coverage_limit_cents recomputed"
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: CANCELLED
        trigger: "POST /policies/{id}/cancel"
        actor: Underwriter
        preconditions: []
        side_effects: []

  - entity: Driver
    initial_state: LISTED
    terminal_states: [REMOVED]
    transitions:
      - from: LISTED
        to: REMOVED
        trigger: "POST /policies/{policy_id}/drivers/{driver_id}/remove"
        actor: Member
        preconditions:
          - "Policy status in {QUOTED, PENDING_DOCUMENTS, ACTIVE} (ERR_INVALID_STATE otherwise)"
        side_effects: []

  - entity: UsageEvent
    initial_state: RECORDED
    terminal_states: [REVERSED]
    transitions:
      - from: RECORDED
        to: REVERSED
        trigger: "POST /usage-events/{id}/reverse"
        actor: Member
        preconditions:
          - "Policy status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
        side_effects:
          - "Mileage ledger compensating entry: policy.billable_miles_used -= billable_miles; policy.overage_charge_cents recomputed chronologically over remaining RECORDED events; policy.remaining_allowance_miles recomputed"

  - entity: RepairShop
    initial_state: PROVISIONAL
    terminal_states: []
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: "POST /repair-shops/{id}/certify"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /repair-shops/{id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Claims assigned to this shop in UNDER_INVESTIGATION stay; authorize-repair blocked (ERR_SHOP_NOT_CERTIFIED)"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /repair-shops/{id}/certify"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: Claim
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /claims/{id}/assign-shop"
        actor: ClaimsAdjuster
        preconditions:
          - "Referenced RepairShop exists (ERR_REFERENCED_NOT_FOUND)"
        side_effects:
          - "Claim.repair_shop_id set"
      - from: UNDER_INVESTIGATION
        to: REPAIR_AUTHORIZED
        trigger: "POST /claims/{id}/authorize-repair"
        actor: ClaimsAdjuster
        preconditions:
          - "estimate_cents present (ERR_CLAIM_NOT_SETTLABLE)"
          - "Assigned shop status == CERTIFIED (ERR_SHOP_NOT_CERTIFIED) — specialty repair shop requirement"
          - "estimate_cents <= round(coverage_limit_cents * 0.75); an estimate above 75% of the coverage limit must go the total-loss path instead (ERR_INVALID_STATE)"
        side_effects:
          - "settlement_variant -> REPAIR"
      - from: UNDER_INVESTIGATION
        to: TOTAL_LOSS_DECLARED
        trigger: "POST /claims/{id}/declare-total-loss"
        actor: ClaimsAdjuster
        preconditions:
          - "Pinned policy valuation status == APPROVED and is_stale == false (ERR_VALUATION_STALE)"
        side_effects:
          - "settlement_variant -> TOTAL_LOSS; declared_by_user_id recorded"
      - from: REPAIR_AUTHORIZED
        to: PAID
        trigger: "POST /claims/{id}/settle"
        actor: ClaimsAdjuster
        preconditions:
          - "Policy status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
        side_effects:
          - "payout_cents = min(estimate_cents, coverage_limit_cents) per calculations.claim_payout REPAIR variant"
      - from: TOTAL_LOSS_DECLARED
        to: PAID
        trigger: "POST /claims/{id}/settle"
        actor: ClaimsAdjuster
        preconditions:
          - "Policy status == ACTIVE (ERR_POLICY_NOT_ACTIVE)"
          - "Segregation of duties: settling adjuster X-User-ID != declared_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "payout_cents per calculations.claim_payout TOTAL_LOSS variant (agreed value less retained salvage)"
          - "Link 1: Policy -> CANCELLED"
          - "Link 2: Vehicle -> RETIRED"
      - from: PAID
        to: UNDER_INVESTIGATION
        trigger: "POST /claims/{id}/reopen (supplemental damage loop)"
        actor: Member
        preconditions:
          - "Claim settlement_variant == REPAIR (total-loss settlements are final, ERR_INVALID_STATE)"
          - "Policy status == ACTIVE"
        side_effects:
          - "settlement_variant -> NONE; payout_cents cleared to null; estimate may be re-submitted"
      - from: PAID
        to: CLOSED
        trigger: "POST /claims/{id}/close"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /claims/{id}/close"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []

  - entity: RestorationProject
    initial_state: ACTIVE
    terminal_states: [COMPLETED]
    note: "stage is an ordered dimension (DISASSEMBLY -> BODYWORK -> MECHANICAL -> FINISH -> COMPLETE) advanced only via advance-stage; status (ACTIVE|SUSPENDED|COMPLETED) is a parallel dimension."
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /restoration-projects/{id}/advance-stage"
        actor: Underwriter
        preconditions:
          - "stage != FINISH (FINISH advances via complete; ERR_RESTORE_STAGE_INVALID)"
          - "receipts_total_cents > 0 (ERR_INVALID_STATE — cannot advance with zero documented spend)"
        side_effects:
          - "stage advances one step in DISASSEMBLY -> BODYWORK -> MECHANICAL -> FINISH"
          - "Link 1: endorsement_limit_cents recomputed per calculations.restoration_endorsement"
          - "Link 2: policy.endorsement_limit_cents and policy.coverage_limit_cents updated"
          - "Link 3: policy.premium_cents recomputed via calculations.premium_quote"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /restoration-projects/{id}/complete"
        actor: Underwriter
        preconditions:
          - "stage == FINISH (ERR_RESTORE_STAGE_INVALID)"
        side_effects:
          - "stage -> COMPLETE"
          - "endorsement_limit_cents -> 0; policy coverage_limit_cents and premium_cents recomputed"
          - "Vehicle.status UNDER_RESTORATION -> INSURED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (policy cancelled) or POST /restoration-projects/{id}/suspend"
        actor: Underwriter
        preconditions: []
        side_effects:
          - "policy.endorsement_limit_cents -> 0; coverage/premium recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /restoration-projects/{id}/resume"
        actor: Underwriter
        preconditions:
          - "Policy status == ACTIVE"
        side_effects:
          - "endorsement_limit_cents recomputed and re-applied to policy"

  - entity: ClubMembership
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /club-memberships/{id}/lapse or system (member terminated)"
        actor: ClubCoordinator
        preconditions: []
        side_effects: []
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /club-memberships/{id}/reactivate"
        actor: ClubCoordinator
        preconditions:
          - "Member.status == ACTIVE (ERR_MEMBER_NOT_ACTIVE)"
        side_effects: []

  - entity: ClubEvent
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /club-events/{id}/cancel"
        actor: ClubCoordinator
        preconditions: []
        side_effects:
          - "All EventRegistration rows in REGISTERED -> CANCELLED; registered_count -> 0"

  - entity: EventRegistration
    initial_state: REGISTERED
    terminal_states: [CANCELLED]
    transitions:
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /club-events/{event_id}/registrations/{registration_id}/cancel"
        actor: Member
        preconditions:
          - "Acting member owns the registration (member_id match)"
        side_effects:
          - "ClubEvent.registered_count decremented"

  - entity: RoadsideEvent
    initial_state: DISPATCHED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /roadside-events/{id}/complete"
        actor: ClubCoordinator
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /roadside-events/{id}/cancel"
        actor: Member
        preconditions:
          - "Acting member owns the membership"
        side_effects:
          - "Compensating invariant: membership.roadside_calls_used decrements (used + remaining returns to pre-dispatch value)"

# =============================================================================
# Concurrency Rules (OCC only — see SKILL.md §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: valuation-create-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /vehicles/{id}/valuations"
    occ_field: "expected_vehicle_version"
    description: |
      Creating a Valuation against a Vehicle whose version has advanced since the
      client last observed it is rejected. Approving a valuation supersedes the
      prior current valuation and bumps Vehicle.version, so a create carrying the
      pre-approval version is acting on a stale view of the vehicle.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: usage-event-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policies/{id}/usage-events"
    occ_field: "expected_policy_version"
    description: |
      Recording a UsageEvent against a Policy whose version has advanced since the
      client last observed it is rejected. Mileage-ledger decisions (remaining
      allowance, overage projection) are computed from a policy snapshot; a stale
      snapshot would mis-state the ledger, so the write is rejected instead of
      serialized blindly.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: vehicle_eligibility
    trigger: "vehicle creation, POST /vehicles/{id}/evaluate-eligibility"
    algorithm: threshold
    formula: |
      age = year_of(logical_clock) - Vehicle.year
      age_ok = (vehicle_class == ANTIQUE and age >= 45) or
               (vehicle_class == CLASSIC and age >= 25) or
               (vehicle_class == MODERN_COLLECTIBLE and age >= 15) or
               (vehicle_class == EXOTIC and age >= 10)
      storage_ok = storage_type != OUTDOOR
      condition_ok = condition_grade != PROJECT or primary_use == RESTORATION
      eligibility_status = ELIGIBLE iff age_ok and storage_ok and condition_ok else INELIGIBLE
      eligibility_reasons lists failed rule codes among {AGE, STORAGE, CONDITION}
    input_set: "the Vehicle being evaluated"
    constants:
      AGE_ANTIQUE_MIN: 45
      AGE_CLASSIC_MIN: 25
      AGE_MODERN_COLLECTIBLE_MIN: 15
      AGE_EXOTIC_MIN: 10

  - name: documentation_status
    trigger: "photo creation, photo review"
    algorithm: aggregation
    formula: |
      REQUIRED_PHOTO_TYPES = {FRONT, REAR, DRIVER_SIDE, PASSENGER_SIDE, INTERIOR, ENGINE, ODOMETER, VIN_PLATE}
      accepted_types = set of photo_type over VehiclePhoto rows of this vehicle with status ACCEPTED
      accepted_photo_count = |accepted_types|
      documentation_status = COMPLETE iff accepted_types == REQUIRED_PHOTO_TYPES else INCOMPLETE
    input_set: "VehiclePhoto rows of the vehicle with status ACCEPTED"

  - name: guide_tool_value
    trigger: "Valuation creation with method GUIDE_TOOL"
    algorithm: tiered_pricing
    formula: |
      entry = the ValuationGuideEntry of the pinned PUBLISHED guide matching
              (vehicle_class, make, year_min <= Vehicle.year <= year_max);
              if multiple entries match, pick the one with the narrowest (year_max - year_min),
              tie-break by entry created_at ASC; if none match -> ERR_NOT_FOUND on valuation creation
      computed_value_cents = round_half_up(entry.base_value_cents * CONDITION_MULTIPLIER[condition_grade])
    input_set: "entries of the pinned PUBLISHED guide only"
    constants:
      CONDITION_MULTIPLIER_EXCELLENT: 1.25
      CONDITION_MULTIPLIER_GOOD: 1.00
      CONDITION_MULTIPLIER_FAIR: 0.75
      CONDITION_MULTIPLIER_PROJECT: 0.50
    precision: "integer cents, round_half_up"
    variants:
      - name: guide_tool_variant
        when: "method == GUIDE_TOOL"
        difference: "value derives from published guide base value times condition multiplier"

  - name: appraisal_value
    trigger: "Valuation creation with method CERTIFIED_APPRAISAL"
    algorithm: threshold
    formula: |
      computed_value_cents = appraisal.appraised_value_cents of the linked CERTIFIED appraisal
      sanity band: |proposed_agreed_value_cents - computed_value_cents| must be <=
        round_half_up(0.20 * computed_value_cents) unless band_override == true,
        else ERR_APPRAISAL_OUT_OF_BAND at approve time
    input_set: "the linked Appraisal (status CERTIFIED)"
    precision: "integer cents"
    variants:
      - name: certified_appraisal_variant
        when: "method == CERTIFIED_APPRAISAL"
        difference: "value derives from the certified appraisal, NOT the guide; for the same vehicle it generally differs from guide_tool_variant (dual-variant pair on the Valuation domain)"

  - name: auction_composite_value
    trigger: "Valuation creation with method AUCTION_COMPOSITE"
    algorithm: chronological
    formula: |
      window = [logical_clock - 730 days, logical_clock]
      comps = AuctionResult rows with vehicle_class == Vehicle.vehicle_class AND make == Vehicle.make
              AND sale_date in window
      selector: take up to 5 most recent comps ordered by (sale_date DESC, created_at DESC)
      if |comps| < 3 -> ERR_AUCTION_COMPS_INSUFFICIENT
      if |comps| >= 4: drop one occurrence of the maximum sale_price_cents and one occurrence of the minimum
      computed_value_cents = round_half_up(mean of remaining sale_price_cents)
    input_set: "AuctionResult rows matching class+make within the 730-day window"
    constants:
      COMPS_WINDOW_DAYS: 730
      COMPS_MIN: 3
      COMPS_MAX: 5
    precision: "integer cents, round_half_up"

  - name: premium_quote
    trigger: "policy creation, policy activate, endorsement recompute (restoration stage advance / suspend / resume / complete)"
    algorithm: tiered_pricing
    formula: |
      base = coverage_limit_cents
      t1 = round_half_up(min(base, 5000000) * 0.009)
      t2 = round_half_up(max(0, min(base, 15000000) - 5000000) * 0.007)
      t3 = round_half_up(max(0, base - 15000000) * 0.0055)
      tiered_base = t1 + t2 + t3                      # per-tier rounding THEN sum (pinned order)
      core = round_half_up(tiered_base * USAGE_MULT[usage_tier] * STORAGE_MULT[vehicle.storage_type] * CLUB_MULT[member club tier or none])
      endorsement_fee = round_half_up(endorsement_limit_cents * 0.01)
      premium_cents = core + endorsement_fee
    input_set: "the Policy plus its Vehicle and the member's ClubMembership tier (ACTIVE membership only; no membership -> 1.00)"
    constants:
      TIER1_CAP_CENTS: 5000000
      TIER1_RATE: 0.009
      TIER2_CAP_CENTS: 15000000
      TIER2_RATE: 0.007
      TIER3_RATE: 0.0055
      USAGE_MULT_LIMITED: 0.85
      USAGE_MULT_REGULAR: 1.00
      USAGE_MULT_EXTENDED: 1.20
      STORAGE_MULT_ENCLOSED_GARAGE: 0.95
      STORAGE_MULT_CARPORT: 1.00
      CLUB_MULT_CONCOURS: 0.90
      CLUB_MULT_ENTHUSIAST: 0.95
      CLUB_MULT_BASIC: 1.00
      ENDORSEMENT_FEE_RATE: 0.01
    precision: "integer cents, round_half_up; tiers rounded individually before summing"

  - name: mileage_ledger
    trigger: "usage event creation, usage event reversal"
    algorithm: chronological
    formula: |
      Process the policy's UsageEvent rows with status RECORDED in order (event_date ASC, created_at ASC).
      billable_miles(event) = reported_miles if event_kind == ORDINARY else 0
      Running cumulative billable C:
        C_before = C; C = C + billable_miles(event)
        overage_miles(event) = max(0, C - allowance) - max(0, C_before - allowance)
        overage_charge_cents(event) = round_half_up(overage_miles(event) * 12.5)   # per-event rounding (fractional rate makes rounding order observable)
      policy.billable_miles_used = final C
      policy.overage_charge_cents = sum of per-event overage_charge_cents (sum AFTER per-event rounding — pinned order)
      policy.remaining_allowance_miles = annual_mileage_allowance - billable_miles_used (may be negative)
      Hard cap: a new event is rejected with ERR_MILEAGE_ALLOWANCE_EXCEEDED when
        C_after_event > round(allowance * 1.5)
      Reversal: the reversed event is excluded and the ledger is fully recomputed chronologically.
      Invariant (compensating): billable_miles_used + remaining_allowance_miles == annual_mileage_allowance
        before and after any record/reverse pair.
    input_set: "UsageEvent rows of the policy with status RECORDED"
    constants:
      OVERAGE_RATE_CENTS_PER_MILE: 12.5
      HARD_CAP_FACTOR: 1.5
    precision: "integer cents; per-event rounding pinned before summation"

  - name: restoration_endorsement
    trigger: "receipt submission, stage advance, suspend, resume, complete"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is pinned (circular-looking dependency made explicit):
        1) receipts_total_cents = sum of receipt amount_cents submitted to the project
        2) stage_cap_cents = floor(policy.agreed_value_cents * STAGE_CAP[stage])
        3) endorsement_limit_cents = (status == ACTIVE) ? min(receipts_total_cents, stage_cap_cents) : 0
        4) policy.endorsement_limit_cents = endorsement_limit_cents
        5) policy.coverage_limit_cents = policy.agreed_value_cents + endorsement_limit_cents
        6) policy.premium_cents recomputed via premium_quote using the new coverage_limit_cents
    input_set: "the RestorationProject and its policy"
    constants:
      STAGE_CAP_DISASSEMBLY: 0.10
      STAGE_CAP_BODYWORK: 0.25
      STAGE_CAP_MECHANICAL: 0.40
      STAGE_CAP_FINISH: 0.55
    precision: "integer cents, floor for the stage cap"

  - name: claim_payout
    trigger: "POST /claims/{id}/settle"
    algorithm: aggregation
    formula: |
      REPAIR variant:    payout_cents = min(estimate_cents, policy.coverage_limit_cents)
      TOTAL_LOSS variant: payout_cents = policy.agreed_value_cents - (salvage_retained ? salvage_value_cents : 0)
      The variant is selected by Claim.settlement_variant at settle time; the two variants
      produce different payouts for identical claim input data (dual-variant pair on the Claim domain).
      Invariant (compensating): TOTAL_LOSS with salvage_retained == true satisfies
        payout_cents + salvage_value_cents == agreed_value_cents.
    input_set: "the Claim and its policy's pinned agreed value / coverage limit"
    precision: "integer cents"
    variants:
      - name: repair_variant
        when: "settlement_variant == REPAIR"
        difference: "pays actual repair estimate capped at coverage limit"
      - name: total_loss_variant
        when: "settlement_variant == TOTAL_LOSS"
        difference: "pays full agreed value (no deductible, no depreciation), less retained salvage"

  - name: roadside_allowance
    trigger: "roadside event creation, cancellation"
    algorithm: threshold
    formula: |
      roadside_calls_limit = {BASIC: 2, ENTHUSIAST: 4, CONCOURS: 6}[tier]
      roadside_calls_used = count of RoadsideEvent rows of the membership with status in {DISPATCHED, COMPLETED}
      Creation requires roadside_calls_used < roadside_calls_limit (boundary: at limit -> ERR_ROADSIDE_LIMIT_REACHED)
      Invariant (compensating): roadside_calls_used + roadside_calls_remaining == roadside_calls_limit;
        a DISPATCHED -> CANCELLED reversal restores the pre-dispatch used count exactly.
    input_set: "RoadsideEvent rows of the membership in non-CANCELLED statuses"
    constants:
      LIMIT_BASIC: 2
      LIMIT_ENTHUSIAST: 4
      LIMIT_CONCOURS: 6

  - name: event_capacity
    trigger: "event registration creation"
    algorithm: threshold
    formula: |
      registered_count = count of EventRegistration rows of the event with status REGISTERED
      creation requires registered_count < capacity (boundary: registered_count == capacity -> ERR_EVENT_FULL)
    input_set: "EventRegistration rows of the event with status REGISTERED"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint; entity_backed roles act only on their own resources (Member X-User-ID must match the owning member_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-templated ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version in body matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /vehicles/{id}/valuations, POST /policies/{id}/usage-events"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: appraiser cannot certify/approve own appraisal; total-loss declarer cannot settle the same claim"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /appraisals/{id}/certify, POST /valuations/{id}/approve, POST /claims/{id}/settle"

  - priority: 7
    category: business_safety
    check: "Driver eligibility: years_licensed >= 5 and violations_last_3y == 0"
    error_id: ERR_DRIVER_INELIGIBLE
    http_status: 422
    applies_to: "POST /policies/{id}/drivers"

  - priority: 8
    category: business_referential
    check: "Body-referenced ids exist (appraisal_id, repair_shop_id, policy_id, member_id, vehicle_id, event_id)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 422
    applies_to: "endpoints taking body foreign keys"

  - priority: 9
    category: business_referential
    check: "Referenced appraisal is CERTIFIED when method == CERTIFIED_APPRAISAL; pinned valuation APPROVED where required"
    error_id: ERR_APPRAISAL_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /valuations/{id}/approve, POST /policies"

  - priority: 10
    category: business_constraint
    check: "Uniqueness: VIN unique across Vehicles; guide edition unique; one SUBMITTED-or-ACCEPTED photo per photo_type per vehicle"
    error_id: ERR_DUPLICATE_VIN
    http_status: 409
    applies_to: "POST /vehicles (ERR_DUPLICATE_VIN), POST /valuation-guides (ERR_DUPLICATE_EDITION), POST /vehicles/{id}/photos (ERR_PHOTO_TYPE_DUPLICATE)"

  - priority: 11
    category: business_constraint
    check: "Eligibility aggregates: vehicle ELIGIBLE and documentation COMPLETE for activation; member has_daily_driver and CLEAN record for activation"
    error_id: ERR_VEHICLE_INELIGIBLE
    http_status: 409
    applies_to: "POST /policies/{id}/activate (ERR_VEHICLE_INELIGIBLE | ERR_DOCUMENTATION_INCOMPLETE | ERR_NO_DAILY_DRIVER | ERR_RECORD_NOT_CLEAN | ERR_MEMBER_NOT_ACTIVE)"

  - priority: 12
    category: business_constraint
    check: "Policy period overlap: a vehicle may not be covered by two non-CANCELLED policies whose half-open [period_start, period_end) intervals intersect; adjacency (end == start) is allowed"
    error_id: ERR_POLICY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /policies"

  - priority: 13
    category: business_constraint
    check: "Venue conflict: same venue, closed date intervals [start_date, end_date] expanded by a 1-day buffer on each side must not intersect another SCHEDULED event"
    error_id: ERR_EVENT_VENUE_CONFLICT
    http_status: 409
    applies_to: "POST /club-events"

  - priority: 14
    category: business_constraint
    check: "Capacity: event registered_count must be < capacity to register"
    error_id: ERR_EVENT_FULL
    http_status: 409
    applies_to: "POST /club-events/{id}/register"

  - priority: 15
    category: business_temporal
    check: "Usage event_date and claim incident_date must fall within the policy's [period_start, period_end)"
    error_id: ERR_USAGE_OUT_OF_PERIOD
    http_status: 422
    applies_to: "POST /policies/{id}/usage-events (ERR_USAGE_OUT_OF_PERIOD), POST /policies/{id}/claims (ERR_INCIDENT_OUT_OF_PERIOD)"

  - priority: 16
    category: business_temporal
    check: "Valuation staleness: pinned valuation must be APPROVED and not stale for activate, resolve-review, resume, declare-total-loss"
    error_id: ERR_VALUATION_STALE
    http_status: 409
    applies_to: "policy transitions and claim declare-total-loss"

  - priority: 17
    category: business_fiscal
    check: "Sanity band: |proposed - computed| <= 20% of computed unless band_override"
    error_id: ERR_APPRAISAL_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /valuations/{id}/approve"

  - priority: 18
    category: business_fiscal
    check: "Mileage hard cap: event rejected when cumulative billable after the event would exceed round(allowance * 1.5)"
    error_id: ERR_MILEAGE_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /policies/{id}/usage-events"

  - priority: 19
    category: business_fiscal
    check: "Auction composite requires >= 3 comps within the 730-day window"
    error_id: ERR_AUCTION_COMPS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /vehicles/{id}/valuations"

  - priority: 20
    category: business_constraint
    check: "Repair authorization requires assigned shop status == CERTIFIED; roadside for classics requires service_type == FLATBED_TOW and membership under its tier limit"
    error_id: ERR_SHOP_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /claims/{id}/authorize-repair (ERR_SHOP_NOT_CERTIFIED), POST /club-memberships/{id}/roadside-events (ERR_ROADSIDE_FLATBED_REQUIRED | ERR_ROADSIDE_LIMIT_REACHED)"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["valuations may become STALE; ACTIVE policies pinned to newly-stale valuations -> UNDER_REVIEW; policies reaching period_end -> LAPSED"]

  # --- Member ---
  - method: POST
    path: "/members"
    description: "Create a member"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, has_daily_driver, "daily_driver_vehicle_desc?", driving_record_status]
    output: Member
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/members"
    description: "List members with pagination and optional status filter"
    roles: [PlatformAdmin, Underwriter, ClaimsAdjuster, ClubCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: GET
    path: "/members/{id}"
    description: "Get one member"
    roles: [PlatformAdmin, Underwriter, ClaimsAdjuster, ClubCoordinator, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: PATCH
    path: "/members/{id}"
    description: "Update member driving record / daily-driver status / lifecycle status"
    roles: [PlatformAdmin]
    code: 200
    input: ["driving_record_status?", "has_daily_driver?", "daily_driver_vehicle_desc?", "status?"]
    output: Member
    side_effects: ["termination cascades ClubMembership -> LAPSED"]

  - method: GET
    path: "/members/{id}/event-registrations"
    description: "List a member's event registrations"
    roles: [PlatformAdmin, ClubCoordinator, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: EventRegistration[]
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/vehicles"
    description: "Register a collector vehicle for the acting member"
    roles: [Member]
    code: 201
    input: [vin, year, make, model, vehicle_class, condition_grade, storage_type, primary_use]
    output: Vehicle
    side_effects: ["status=REGISTERED; eligibility_status computed; documentation_status=INCOMPLETE"]

  - method: GET
    path: "/vehicles"
    description: "List vehicles; optional member_id filter"
    roles: [PlatformAdmin, Underwriter, Appraiser, ClaimsAdjuster, Member]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  - method: GET
    path: "/vehicles/{id}"
    description: "Get one vehicle"
    roles: [PlatformAdmin, Underwriter, Appraiser, ClaimsAdjuster, Member]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/vehicles/{id}/evaluate-eligibility"
    description: "Recompute eligibility_status and eligibility_reasons against the logical clock"
    roles: [Underwriter, PlatformAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["eligibility_status recomputed; increments Vehicle.version"]

  - method: POST
    path: "/vehicles/{id}/photos"
    description: "Submit a documentation photo (one SUBMITTED/ACCEPTED per photo_type)"
    roles: [Member]
    code: 201
    input: [photo_type, image_ref, captured_at]
    output: VehiclePhoto
    side_effects: ["increments Vehicle.version"]

  - method: GET
    path: "/vehicles/{id}/photos"
    description: "List photos of a vehicle"
    roles: [PlatformAdmin, Underwriter, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: VehiclePhoto[]
    side_effects: []

  - method: POST
    path: "/vehicles/{id}/photos/{photo_id}/review"
    description: "Accept or reject a submitted photo"
    roles: [Underwriter]
    code: 200
    input: [decision, "review_note?"]
    output: VehiclePhoto
    side_effects: ["documentation_status recomputed; cascade PENDING_DOCUMENTS policy -> QUOTED when documentation completes"]

  # --- Valuation guides ---
  - method: POST
    path: "/valuation-guides"
    description: "Create a valuation guide edition (DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [edition, effective_date]
    output: ValuationGuide
    side_effects: []

  - method: GET
    path: "/valuation-guides/{id}"
    description: "Get one guide"
    roles: [PlatformAdmin, Underwriter]
    code: 200
    input: []
    output: ValuationGuide
    side_effects: []

  - method: POST
    path: "/valuation-guides/{id}/entries"
    description: "Add a guide entry (DRAFT guides only)"
    roles: [PlatformAdmin]
    code: 201
    input: [vehicle_class, make, year_min, year_max, base_value_cents]
    output: ValuationGuideEntry
    side_effects: []

  - method: GET
    path: "/valuation-guides/{id}/entries"
    description: "List entries of a guide"
    roles: [PlatformAdmin, Underwriter]
    code: 200
    input: ["limit?", "offset?"]
    output: ValuationGuideEntry[]
    side_effects: []

  - method: POST
    path: "/valuation-guides/{id}/publish"
    description: "Publish a guide; supersedes the prior PUBLISHED guide and stales dependent valuations (3-level cascade)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ValuationGuide
    side_effects: ["prior guide -> SUPERSEDED; dependent GUIDE_TOOL valuations -> STALE; affected ACTIVE policies -> UNDER_REVIEW"]

  # --- Appraisals ---
  - method: POST
    path: "/vehicles/{id}/appraisals"
    description: "Submit an appraisal for a vehicle"
    roles: [Appraiser]
    code: 201
    input: [appraised_value_cents, appraised_at]
    output: Appraisal
    side_effects: ["appraiser_user_id recorded from X-User-ID"]

  - method: GET
    path: "/vehicles/{id}/appraisals"
    description: "List appraisals of a vehicle"
    roles: [PlatformAdmin, Underwriter, Appraiser, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Appraisal[]
    side_effects: []

  - method: POST
    path: "/appraisals/{id}/certify"
    description: "Certify or reject a submitted appraisal (SoD: not the submitting appraiser)"
    roles: [Underwriter]
    code: 200
    input: [decision]
    output: Appraisal
    side_effects: []

  # --- Auction results ---
  - method: POST
    path: "/auction-results"
    description: "Record an auction sale (market data feed)"
    roles: [PlatformAdmin]
    code: 201
    input: [vehicle_class, make, model, year, sale_price_cents, sale_date, source_name]
    output: AuctionResult
    side_effects: []

  - method: GET
    path: "/auction-results"
    description: "List auction results with optional filters"
    roles: [PlatformAdmin, Underwriter]
    code: 200
    input: ["vehicle_class?", "make?", "limit?", "offset?"]
    output: AuctionResult[]
    side_effects: []

  # --- Valuations ---
  - method: POST
    path: "/vehicles/{id}/valuations"
    description: "Create a valuation (DRAFT); OCC-guarded on the vehicle version; computes computed_value_cents by method"
    roles: [Underwriter]
    code: 201
    input: [method, proposed_agreed_value_cents, "appraisal_id?", "band_override?", expected_vehicle_version]
    output: Valuation
    side_effects: ["computed_value_cents computed per method; increments Vehicle.version"]

  - method: GET
    path: "/vehicles/{id}/valuations"
    description: "List valuations of a vehicle"
    roles: [PlatformAdmin, Underwriter, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Valuation[]
    side_effects: []

  - method: GET
    path: "/valuations/{id}"
    description: "Get one valuation"
    roles: [PlatformAdmin, Underwriter, Member]
    code: 200
    input: []
    output: Valuation
    side_effects: []

  - method: GET
    path: "/valuations"
    description: "List valuations with optional filters"
    roles: [PlatformAdmin, Underwriter]
    code: 200
    input: ["vehicle_id?", "appraisal_id?", "guide_id?", "limit?", "offset?"]
    output: Valuation[]
    side_effects: []

  - method: POST
    path: "/valuations/{id}/propose"
    description: "DRAFT -> PROPOSED"
    roles: [Underwriter]
    code: 200
    input: []
    output: Valuation
    side_effects: []

  - method: POST
    path: "/valuations/{id}/revise"
    description: "PROPOSED -> DRAFT (revision loop)"
    roles: [Underwriter]
    code: 200
    input: ["proposed_agreed_value_cents?"]
    output: Valuation
    side_effects: []

  - method: POST
    path: "/valuations/{id}/approve"
    description: "PROPOSED -> APPROVED; supersedes prior APPROVED valuation of the vehicle"
    roles: [Underwriter]
    code: 200
    input: ["band_override?"]
    output: Valuation
    side_effects: ["final_agreed_value_cents set; prior APPROVED valuation -> SUPERSEDED; vehicle current valuation fields updated"]

  - method: POST
    path: "/valuations/{id}/reject"
    description: "PROPOSED -> REJECTED"
    roles: [Underwriter]
    code: 200
    input: []
    output: Valuation
    side_effects: []

  # --- Policies ---
  - method: POST
    path: "/policies"
    description: "Quote a policy pinning an APPROVED valuation; status QUOTED or PENDING_DOCUMENTS"
    roles: [Underwriter]
    code: 201
    input: [member_id, vehicle_id, valuation_id, usage_tier, "annual_mileage_allowance?", period_start, period_end]
    output: Policy
    side_effects: ["agreed_value_cents pinned from valuation; premium_cents computed; status QUOTED or PENDING_DOCUMENTS"]

  - method: GET
    path: "/policies"
    description: "List policies with optional filters"
    roles: [PlatformAdmin, Underwriter, ClaimsAdjuster, Member]
    code: 200
    input: ["member_id?", "vehicle_id?", "valuation_id?", "status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []

  - method: GET
    path: "/policies/{id}"
    description: "Get one policy"
    roles: [PlatformAdmin, Underwriter, ClaimsAdjuster, Member]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: PATCH
    path: "/policies/{id}"
    description: "Re-pin a fresh APPROVED valuation during UNDER_REVIEW (revaluation)"
    roles: [Underwriter]
    code: 200
    input: [valuation_id]
    output: Policy
    side_effects: ["agreed_value_cents, coverage_limit_cents, premium_cents recomputed"]

  - method: POST
    path: "/policies/{id}/activate"
    description: "QUOTED -> ACTIVE (all eligibility gates)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["vehicle REGISTERED -> INSURED; premium recomputed; increments Policy.version"]

  - method: POST
    path: "/policies/{id}/begin-review"
    description: "ACTIVE -> UNDER_REVIEW"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/policies/{id}/resolve-review"
    description: "UNDER_REVIEW -> ACTIVE (requires fresh APPROVED valuation)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/policies/{id}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/policies/{id}/resume"
    description: "SUSPENDED or LAPSED -> ACTIVE"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/policies/{id}/lapse"
    description: "ACTIVE -> LAPSED"
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/policies/{id}/cancel"
    description: "Any non-terminal status -> CANCELLED"
    roles: [Underwriter, Member]
    code: 200
    input: []
    output: Policy
    side_effects: ["restoration endorsement zeroed"]

  # --- Drivers ---
  - method: POST
    path: "/policies/{id}/drivers"
    description: "List a driver on the policy (eligibility: >= 5 years licensed, clean record); allowed only while policy is QUOTED, PENDING_DOCUMENTS, or ACTIVE (ERR_INVALID_STATE otherwise)"
    roles: [Member]
    code: 201
    input: [full_name, license_number, years_licensed, violations_last_3y, is_primary]
    output: Driver
    side_effects: []

  - method: GET
    path: "/policies/{id}/drivers"
    description: "List drivers of a policy"
    roles: [PlatformAdmin, Underwriter, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Driver[]
    side_effects: []

  - method: POST
    path: "/policies/{id}/drivers/{driver_id}/remove"
    description: "LISTED -> REMOVED"
    roles: [Member]
    code: 200
    input: []
    output: Driver
    side_effects: []

  # --- Usage events ---
  - method: POST
    path: "/policies/{id}/usage-events"
    description: "Record a usage event; OCC-guarded on policy version; mileage ledger updated chronologically"
    roles: [Member]
    code: 201
    input: [reported_miles, event_date, event_kind, expected_policy_version]
    output: UsageEvent
    side_effects: ["billable_miles and overage computed; policy ledger fields recomputed; increments Policy.version"]

  - method: GET
    path: "/policies/{id}/usage-events"
    description: "List usage events of a policy"
    roles: [PlatformAdmin, Underwriter, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: UsageEvent[]
    side_effects: []

  - method: POST
    path: "/usage-events/{id}/reverse"
    description: "RECORDED -> REVERSED (compensating mileage ledger entry)"
    roles: [Member]
    code: 200
    input: []
    output: UsageEvent
    side_effects: ["ledger fully recomputed chronologically over remaining RECORDED events"]

  # --- Repair shops ---
  - method: POST
    path: "/repair-shops"
    description: "Create a specialty repair shop (PROVISIONAL)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, specialty, hourly_rate_cents]
    output: RepairShop
    side_effects: []

  - method: GET
    path: "/repair-shops"
    description: "List repair shops"
    roles: [PlatformAdmin, Underwriter, ClaimsAdjuster, Member]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RepairShop[]
    side_effects: []

  - method: POST
    path: "/repair-shops/{id}/certify"
    description: "PROVISIONAL or SUSPENDED -> CERTIFIED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RepairShop
    side_effects: []

  - method: POST
    path: "/repair-shops/{id}/suspend"
    description: "CERTIFIED -> SUSPENDED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RepairShop
    side_effects: []

  # --- Claims ---
  - method: POST
    path: "/policies/{id}/claims"
    description: "Open a claim on an ACTIVE policy"
    roles: [Member]
    code: 201
    input: [incident_date, loss_type, description]
    output: Claim
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/policies/{id}/claims"
    description: "List claims of a policy"
    roles: [PlatformAdmin, Underwriter, ClaimsAdjuster, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims with optional filters"
    roles: [PlatformAdmin, Underwriter, ClaimsAdjuster]
    code: 200
    input: ["policy_id?", "repair_shop_id?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/claims/{id}"
    description: "Get one claim"
    roles: [PlatformAdmin, Underwriter, ClaimsAdjuster, Member]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/claims/{id}/assign-shop"
    description: "OPEN -> UNDER_INVESTIGATION, assigning a specialty repair shop"
    roles: [ClaimsAdjuster]
    code: 200
    input: [repair_shop_id]
    output: Claim
    side_effects: []

  - method: POST
    path: "/claims/{id}/submit-estimate"
    description: "Record the shop's repair estimate while UNDER_INVESTIGATION"
    roles: [ClaimsAdjuster]
    code: 200
    input: [estimate_cents]
    output: Claim
    side_effects: []

  - method: POST
    path: "/claims/{id}/authorize-repair"
    description: "UNDER_INVESTIGATION -> REPAIR_AUTHORIZED (shop must be CERTIFIED)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["settlement_variant=REPAIR"]

  - method: POST
    path: "/claims/{id}/declare-total-loss"
    description: "UNDER_INVESTIGATION -> TOTAL_LOSS_DECLARED (requires non-stale pinned valuation)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [salvage_retained, "salvage_value_cents?"]
    output: Claim
    side_effects: ["settlement_variant=TOTAL_LOSS; declared_by_user_id recorded"]

  - method: POST
    path: "/claims/{id}/settle"
    description: "REPAIR_AUTHORIZED or TOTAL_LOSS_DECLARED -> PAID; total loss cascades policy -> CANCELLED, vehicle -> RETIRED"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["payout_cents computed per variant; total-loss: policy -> CANCELLED, vehicle -> RETIRED"]

  - method: POST
    path: "/claims/{id}/reopen"
    description: "PAID -> UNDER_INVESTIGATION (supplement loop; repair settlements only)"
    roles: [Member]
    code: 200
    input: []
    output: Claim
    side_effects: ["settlement_variant reset to NONE; payout cleared"]

  - method: POST
    path: "/claims/{id}/close"
    description: "OPEN or PAID -> CLOSED"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: []

  # --- Restoration ---
  - method: POST
    path: "/vehicles/{id}/restoration-projects"
    description: "Open a restoration project for an INSURED vehicle on an ACTIVE policy"
    roles: [Member]
    code: 201
    input: [policy_id]
    output: RestorationProject
    side_effects: ["vehicle INSURED -> UNDER_RESTORATION"]

  - method: GET
    path: "/vehicles/{id}/restoration-projects"
    description: "List restoration projects of a vehicle"
    roles: [PlatformAdmin, Underwriter, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: RestorationProject[]
    side_effects: []

  - method: GET
    path: "/restoration-projects"
    description: "List restoration projects with optional filters"
    roles: [PlatformAdmin, Underwriter]
    code: 200
    input: ["policy_id?", "vehicle_id?", "limit?", "offset?"]
    output: RestorationProject[]
    side_effects: []

  - method: GET
    path: "/restoration-projects/{id}"
    description: "Get one restoration project"
    roles: [PlatformAdmin, Underwriter, Member]
    code: 200
    input: []
    output: RestorationProject
    side_effects: []

  - method: POST
    path: "/restoration-projects/{id}/receipts"
    description: "Submit a restoration receipt (increases receipts_total_cents; endorsement re-derived)"
    roles: [Member]
    code: 200
    input: [amount_cents, receipt_ref]
    output: RestorationProject
    side_effects: ["endorsement_limit_cents recomputed (cap applied); policy coverage/premium recomputed"]

  - method: POST
    path: "/restoration-projects/{id}/advance-stage"
    description: "Advance the restoration stage one step (3-level recompute cascade)"
    roles: [Underwriter]
    code: 200
    input: []
    output: RestorationProject
    side_effects: ["stage advances; endorsement_limit, policy coverage_limit, policy premium recomputed"]

  - method: POST
    path: "/restoration-projects/{id}/suspend"
    description: "ACTIVE -> SUSPENDED; endorsement zeroed"
    roles: [Underwriter]
    code: 200
    input: []
    output: RestorationProject
    side_effects: ["policy endorsement zeroed; coverage/premium recomputed"]

  - method: POST
    path: "/restoration-projects/{id}/resume"
    description: "SUSPENDED -> ACTIVE; endorsement re-applied"
    roles: [Underwriter]
    code: 200
    input: []
    output: RestorationProject
    side_effects: ["endorsement recomputed and re-applied to policy"]

  - method: POST
    path: "/restoration-projects/{id}/complete"
    description: "ACTIVE at stage FINISH -> COMPLETED; endorsement zeroed; vehicle back to INSURED"
    roles: [Underwriter]
    code: 200
    input: []
    output: RestorationProject
    side_effects: ["stage=COMPLETE; endorsement zeroed; vehicle UNDER_RESTORATION -> INSURED"]

  # --- Club ---
  - method: POST
    path: "/club-memberships"
    description: "Create a club membership for a member"
    roles: [PlatformAdmin]
    code: 201
    input: [member_id, tier]
    output: ClubMembership
    side_effects: ["roadside_calls_limit derived from tier"]

  - method: GET
    path: "/club-memberships"
    description: "List club memberships"
    roles: [PlatformAdmin, ClubCoordinator]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: ClubMembership[]
    side_effects: []

  - method: GET
    path: "/club-memberships/{id}"
    description: "Get one club membership"
    roles: [PlatformAdmin, ClubCoordinator, Member]
    code: 200
    input: []
    output: ClubMembership
    side_effects: []

  - method: POST
    path: "/club-memberships/{id}/lapse"
    description: "ACTIVE -> LAPSED"
    roles: [ClubCoordinator]
    code: 200
    input: []
    output: ClubMembership
    side_effects: []

  - method: POST
    path: "/club-memberships/{id}/reactivate"
    description: "LAPSED -> ACTIVE"
    roles: [ClubCoordinator]
    code: 200
    input: []
    output: ClubMembership
    side_effects: []

  - method: POST
    path: "/club-memberships/{id}/roadside-events"
    description: "Dispatch classic roadside assistance (flatbed only; tier limits)"
    roles: [Member]
    code: 201
    input: [vehicle_id, service_type, event_date]
    output: RoadsideEvent
    side_effects: ["roadside_calls_used increments"]

  - method: GET
    path: "/club-memberships/{id}/roadside-events"
    description: "List roadside events of a membership"
    roles: [PlatformAdmin, ClubCoordinator, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: RoadsideEvent[]
    side_effects: []

  - method: GET
    path: "/roadside-events/{id}"
    description: "Get one roadside event"
    roles: [PlatformAdmin, ClubCoordinator, Member]
    code: 200
    input: []
    output: RoadsideEvent
    side_effects: []

  - method: GET
    path: "/roadside-events"
    description: "List roadside events with optional vehicle filter"
    roles: [PlatformAdmin, ClubCoordinator]
    code: 200
    input: ["vehicle_id?", "limit?", "offset?"]
    output: RoadsideEvent[]
    side_effects: []

  - method: POST
    path: "/roadside-events/{id}/complete"
    description: "DISPATCHED -> COMPLETED"
    roles: [ClubCoordinator]
    code: 200
    input: []
    output: RoadsideEvent
    side_effects: []

  - method: POST
    path: "/roadside-events/{id}/cancel"
    description: "DISPATCHED -> CANCELLED (compensating: used count restored)"
    roles: [Member]
    code: 200
    input: []
    output: RoadsideEvent
    side_effects: ["roadside_calls_used decrements"]

  # --- Club events & registrations ---
  - method: POST
    path: "/club-events"
    description: "Create a club event (venue conflict rule applies)"
    roles: [ClubCoordinator]
    code: 201
    input: [name, venue, start_date, end_date, capacity]
    output: ClubEvent
    side_effects: []

  - method: GET
    path: "/club-events/{id}"
    description: "Get one club event"
    roles: [PlatformAdmin, ClubCoordinator, Member]
    code: 200
    input: []
    output: ClubEvent
    side_effects: []

  - method: POST
    path: "/club-events/{id}/cancel"
    description: "SCHEDULED -> CANCELLED; registrations cancelled"
    roles: [ClubCoordinator]
    code: 200
    input: []
    output: ClubEvent
    side_effects: ["registrations -> CANCELLED; registered_count -> 0"]

  - method: POST
    path: "/club-events/{id}/register"
    description: "Register the acting member for an event (capacity-gated)"
    roles: [Member]
    code: 201
    input: [member_id]
    output: EventRegistration
    side_effects: ["registered_count increments"]

  - method: GET
    path: "/club-events/{id}/registrations"
    description: "List registrations of an event"
    roles: [PlatformAdmin, ClubCoordinator, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: EventRegistration[]
    side_effects: []

  - method: POST
    path: "/club-events/{id}/registrations/{registration_id}/cancel"
    description: "REGISTERED -> CANCELLED (frees capacity)"
    roles: [Member]
    code: 200
    input: []
    output: EventRegistration
    side_effects: ["registered_count decrements"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity_backed role acting on another member's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, or invalid enum value in the request body" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is not in a state from which the requested transition exists" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_DUPLICATE_VIN, http: 409, condition: "A vehicle with this VIN already exists" }
  - { id: ERR_DUPLICATE_EDITION, http: 409, condition: "A valuation guide with this edition label already exists" }
  - { id: ERR_PHOTO_TYPE_DUPLICATE, http: 409, condition: "A SUBMITTED or ACCEPTED photo of this photo_type already exists for the vehicle" }
  - { id: ERR_VEHICLE_INELIGIBLE, http: 409, condition: "Vehicle eligibility_status != ELIGIBLE at policy activation" }
  - { id: ERR_DOCUMENTATION_INCOMPLETE, http: 409, condition: "Vehicle documentation_status != COMPLETE at policy activation" }
  - { id: ERR_NO_DAILY_DRIVER, http: 422, condition: "Member has_daily_driver == false at policy activation (separate daily driver required)" }
  - { id: ERR_RECORD_NOT_CLEAN, http: 422, condition: "Member driving_record_status != CLEAN at policy activation" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Member.status != ACTIVE where required (activation, club reactivation)" }
  - { id: ERR_DRIVER_INELIGIBLE, http: 422, condition: "Driver years_licensed < 5 or violations_last_3y > 0" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 422, condition: "Body-referenced id (appraisal_id, repair_shop_id, policy_id, member_id, vehicle_id, event_id) does not exist" }
  - { id: ERR_APPRAISAL_NOT_CERTIFIED, http: 409, condition: "Valuation method CERTIFIED_APPRAISAL references an appraisal not in CERTIFIED status" }
  - { id: ERR_APPRAISAL_OUT_OF_BAND, http: 422, condition: "Proposed agreed value outside the +/-20% sanity band without band_override" }
  - { id: ERR_VALUATION_NOT_APPROVED, http: 409, condition: "Pinned valuation is not APPROVED where required" }
  - { id: ERR_VALUATION_STALE, http: 409, condition: "Pinned valuation is STALE (guide superseded or older than 365 days)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties violated (self-certification, self-approval, declarer settling own total loss)" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Policy status != ACTIVE where required (usage events, claims, settle, restoration)" }
  - { id: ERR_POLICY_PERIOD_OVERLAP, http: 409, condition: "Vehicle already covered by a non-CANCELLED policy with an overlapping half-open period" }
  - { id: ERR_USAGE_OUT_OF_PERIOD, http: 422, condition: "Usage event_date outside [period_start, period_end)" }
  - { id: ERR_INCIDENT_OUT_OF_PERIOD, http: 422, condition: "Claim incident_date outside [period_start, period_end)" }
  - { id: ERR_MILEAGE_ALLOWANCE_EXCEEDED, http: 422, condition: "Usage event would push cumulative billable miles beyond 150% of the allowance" }
  - { id: ERR_AUCTION_COMPS_INSUFFICIENT, http: 422, condition: "Fewer than 3 auction comps within the 730-day window for AUCTION_COMPOSITE" }
  - { id: ERR_SHOP_NOT_CERTIFIED, http: 409, condition: "Repair authorization requires a CERTIFIED specialty shop" }
  - { id: ERR_RESTORE_STAGE_INVALID, http: 409, condition: "Stage advance/complete requested from an invalid stage" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "Event registered_count == capacity" }
  - { id: ERR_EVENT_VENUE_CONFLICT, http: 409, condition: "Same venue has a SCHEDULED event whose closed interval plus 1-day buffer intersects" }
  - { id: ERR_ROADSIDE_LIMIT_REACHED, http: 409, condition: "Membership roadside_calls_used == roadside_calls_limit" }
  - { id: ERR_ROADSIDE_FLATBED_REQUIRED, http: 422, condition: "Classic roadside service requires service_type == FLATBED_TOW" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "Collector-vehicle owner; acts only on own resources (X-User-ID == Member.id)"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /vehicles — register own vehicle"
      - "POST /vehicles/{id}/photos — submit documentation photos"
      - "POST /policies/{id}/drivers — list drivers on own policy"
      - "POST /policies/{id}/usage-events — report mileage (OCC)"
      - "POST /usage-events/{id}/reverse — reverse own usage event"
      - "POST /policies/{id}/claims — open a claim"
      - "POST /claims/{id}/reopen — supplement a settled repair claim"
      - "POST /vehicles/{id}/restoration-projects — open restoration coverage"
      - "POST /restoration-projects/{id}/receipts — submit restoration receipts"
      - "POST /club-memberships/{id}/roadside-events — request classic roadside"
      - "POST /roadside-events/{id}/cancel — cancel own dispatch"
      - "POST /club-events/{id}/register — register for events"
    shared_operations:
      - "GET on own resources; POST /policies/{id}/cancel (with Underwriter)"

  - name: Underwriter
    description: "Screens eligibility, values vehicles, issues and manages policies"
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicles/{id}/photos/{photo_id}/review — accept/reject documentation"
      - "POST /vehicles/{id}/evaluate-eligibility"
      - "POST /appraisals/{id}/certify — certify appraisals (SoD vs appraiser)"
      - "POST /vehicles/{id}/valuations — create valuations (OCC on vehicle)"
      - "POST /valuations/{id}/propose|revise|approve|reject"
      - "POST /policies and all policy lifecycle transitions"
    shared_operations:
      - "GET on members, vehicles, policies, claims, valuations"

  - name: Appraiser
    description: "Produces certified appraisals feeding CERTIFIED_APPRAISAL valuations"
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicles/{id}/appraisals — submit appraisal"
    shared_operations:
      - "GET /vehicles/{id}, GET /vehicles"

  - name: ClaimsAdjuster
    description: "Investigates and settles claims; SoD prevents the total-loss declarer from settling"
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/assign-shop|submit-estimate|authorize-repair|declare-total-loss|settle|close"
    shared_operations:
      - "GET on policies, claims, members, repair shops"

  - name: ClubCoordinator
    description: "Runs club programs, events, and classic roadside dispatch"
    identity: "opaque"
    exclusive_operations:
      - "POST /club-events and POST /club-events/{id}/cancel"
      - "POST /club-memberships/{id}/lapse|reactivate"
      - "POST /roadside-events/{id}/complete"
    shared_operations:
      - "GET on memberships, events, registrations, roadside events"

  - name: PlatformAdmin
    description: "Back-office operator: members, guides, auction data, shops, club memberships, logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /members, PATCH /members/{id}"
      - "POST /valuation-guides*, publish"
      - "POST /auction-results"
      - "POST /repair-shops*, certify/suspend"
      - "POST /club-memberships"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"
