    side_effects:
      - "outcome = RECEIVED drives PENDING_DELIVERY -> RECEIVED, sets received_at, sets CollateralAsset.custody_location = FHLB_SAFEKEEPING, re-derives effective_listing_mode and (for ELIGIBLE assets) discount_factor_bps and lendable_value_cents"
      - "outcome = EXCEPTION drives PENDING_DELIVERY -> EXCEPTION, records exception_note, sets CollateralAsset.documentation_status = EXCEPTION and CollateralAsset.status -> UNDER_REVIEW with lendable_value_cents = 0"
      - "either branch recomputes MemberBank.lendable_collateral_value_cents and borrowing_capacity_cents, then runs calculations.collateral_posture_recompute"
      - "increments MemberBank.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_SAFEKEEPING_RECEIPT_NOT_FOUND, ERR_INVALID_STATE]
    note: "outcome must be RECEIVED or EXCEPTION"

