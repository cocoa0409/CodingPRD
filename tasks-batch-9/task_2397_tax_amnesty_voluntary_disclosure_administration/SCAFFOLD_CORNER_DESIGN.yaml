      - name: installment_floor_guard_blocks_a_schedule_below_the_minimum
        claim_type: Aggregate validation
        grounds:
          - validations[priority=34]
          - calculations.installment_schedule_generation.constants.MIN_INSTALLMENT_CENTS
          - errors[ERR_INSTALLMENT_BELOW_MINIMUM]
        distinguishing_aspect: |
          The floor is evaluated on the GENERATED schedule at approval time, not on the
          proposal: 18900 schedulable cents over 14 installments gives 1350 cents each,
          below the 2500-cent floor, so approval fails and no Installment row is written;
          the same schedulable amount over 7 installments gives 2700 cents and is
          approved. A count-level pre-check cannot express this.
