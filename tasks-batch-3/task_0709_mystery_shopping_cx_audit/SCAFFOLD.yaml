# =============================================================================
# Mystery Shopping & CX-Audit Platform — seed tables (Expert)
# =============================================================================

scenario: |
  709. Mystery Shopping & CX-Audit Platform: shopper registration & certification,
  shop assignment & location/route, scenario script & evidence (photo/receipt)
  upload, validation & reimbursement + fee, shop scheduling & rotation, client
  report & scoring, dispute/rejection, payout/1099

domain_name: mystery-shopping-cx-audit
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation       # provisional vs final reimbursement; estimated vs audited score
    - cascading_side_effects         # rejection / dispute cascades across Assignment→Reimbursement→Wave→Report
    - optimistic_concurrency         # OCC on Assignment.version for evidence-bundle supersede
    - scheduled_actions              # logical clock drives submission deadlines, rotation cooldowns, 1099 year close

  entity_topology: flat
  # Peer entities linked by foreign keys (Assignment references Shopper, Location,
  # ScenarioScript, ShopWave by id in its body); URLs are flat collections, not
  # deeply nested ownership trees.

  state_machine_shape: cyclic
  # Dispute and Assignment carry revision loops (REVISION_REQUESTED → IN_FIELD → SUBMITTED
  # again); ScoreCard carries parallel audit dimensions; Assignment also has guarded
  # cross-entity transitions. The scaffold mixes cyclic, parallel and branching shapes.

  relationship_patterns:
    - one_to_many        # ClientAccount→Location, Assignment→EvidenceItem
    - cross_aggregate    # Assignment references Shopper, ScenarioScript, ShopWave across aggregates
    - many_to_many       # ShopWave rotates a pool of Shoppers across Locations via Assignments

  role_model: segregation_of_duties
  # A QaValidator who validates an Assignment's evidence MUST NOT be the FinanceOfficer
  # who approves its payout for the same Shopper; a Shopper cannot validate own work.

  consistency_model: immediate
  # All cascades (reject → reimbursement reversal → wave counter → report invalidation)
  # complete atomically within the triggering request.

# =============================================================================
# Table 1.0: Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Client company name" }
      - { name: billing_email, type: string, source: input, description: "Where client invoices are sent" }
      - { name: fee_per_completed_shop_cents, type: integer, source: input, description: "Platform fee billed to client for each VALIDATED shop", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED — SUSPENDED blocks new wave publication and assignment", constraints: "one of {ACTIVE, SUSPENDED}" }

  - name: Shopper
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Shopper legal name (1099 payee)" }
      - { name: email, type: string, source: input, description: "Unique contact email" }
      - { name: home_lat, type: number, source: input, description: "Home latitude in decimal degrees" }
      - { name: home_lng, type: number, source: input, description: "Home longitude in decimal degrees" }
      - { name: tax_id_on_file, type: boolean, source: input, default: false, description: "Whether a W-9 / TIN is on file (gates payout release)" }
      - { name: status, type: enum, source: system, default: "REGISTERED", description: "REGISTERED → CERTIFIED → SUSPENDED; REGISTERED cannot be assigned", constraints: "one of {REGISTERED, CERTIFIED, SUSPENDED}" }
      - { name: certification_score, type: integer, source: computed, default: 0, description: "Score (0-100) of the most recent PASSED CertificationAttempt; 0 until first pass" }
      - { name: reliability_score, type: number, source: computed, default: 100.0, description: "Rotation-ranking score in [0,100]; starts 100, decremented by no-shows and rejections, floored at 0", constraints: "0 <= reliability_score <= 100" }
      - { name: ytd_paid_cents, type: integer, source: computed, default: 0, description: "Sum of cents in PAID PayoutBatch rows for this Shopper within the current tax year of the logical clock" }
      - { name: open_assignment_count, type: integer, source: computed, default: 0, description: "Count of this Shopper's Assignments in a non-terminal, non-CANCELLED state" }

  - name: CertificationAttempt
    parent: Shopper
    common_fields: false
    fields:
      - { name: shopper_id, type: string, source: system, description: "FK -> Shopper.id; the candidate taking the attempt" }
      - { name: raw_score, type: integer, source: input, description: "Examiner-entered raw score 0-100", constraints: "0 <= raw_score <= 100" }
      - { name: scenario_family, type: enum, source: input, description: "RETAIL | DINING | BANKING — which audit family this certifies", constraints: "one of {RETAIL, DINING, BANKING}" }
      - { name: outcome, type: enum, source: computed, description: "PASSED | FAILED — PASSED iff raw_score >= CERT_PASS_THRESHOLD", constraints: "one of {PASSED, FAILED}" }
      - { name: attempt_index, type: integer, source: system, description: "1-based ordinal among this Shopper's attempts in scenario_family, in created_at order" }

  - name: Location
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id; owning client" }
      - { name: label, type: string, source: input, description: "Store/branch label" }
      - { name: lat, type: number, source: input, description: "Site latitude in decimal degrees" }
      - { name: lng, type: number, source: input, description: "Site longitude in decimal degrees" }
      - { name: scenario_family, type: enum, source: input, description: "RETAIL | DINING | BANKING — the family a Shopper must be certified in to audit here", constraints: "one of {RETAIL, DINING, BANKING}" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED — RETIRED locations accept no new assignments", constraints: "one of {ACTIVE, RETIRED}" }

  - name: ScenarioScript
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id; owning client" }
      - { name: title, type: string, source: input, description: "Script title" }
      - { name: scenario_family, type: enum, source: input, description: "RETAIL | DINING | BANKING", constraints: "one of {RETAIL, DINING, BANKING}" }
      - { name: required_photo_count, type: integer, source: input, description: "Minimum APPROVED photo evidence items required to submit", constraints: ">= 0" }
      - { name: receipt_required, type: boolean, source: input, default: true, description: "Whether at least one APPROVED receipt evidence item is required to submit" }
      - { name: reimburse_cap_cents, type: integer, source: input, description: "Maximum out-of-pocket reimbursed per assignment", constraints: ">= 0" }
      - { name: base_fee_cents, type: integer, source: input, description: "Flat shopper fee paid on validation, before reliability bonus", constraints: ">= 0" }
      - { name: weights_json, type: object, source: input, description: "Section weights for scoring, e.g. {greeting:0.3, cleanliness:0.3, service:0.4}; values are non-negative and sum to 1.00 (round_half_up to 2dp)" }
      - { name: passing_score, type: integer, source: input, description: "Audited score at or above which the shop is reported PASS (0-100)", constraints: "0 <= passing_score <= 100" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → PUBLISHED → ARCHIVED; only PUBLISHED scripts may back an assignment", constraints: "one of {DRAFT, PUBLISHED, ARCHIVED}" }

  - name: ShopWave
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id; owning client" }
      - { name: name, type: string, source: input, description: "Wave name, e.g. 'Q2 Northeast'" }
      - { name: field_window_start, type: datetime, source: input, description: "ISO8601 UTC; earliest assignment due_at allowed in this wave" }
      - { name: field_window_end, type: datetime, source: input, description: "ISO8601 UTC; latest assignment due_at allowed; must be > field_window_start" }
      - { name: rotation_cooldown_days, type: integer, source: input, default: 30, description: "A Shopper assigned to a Location in this client cannot be re-assigned to the SAME Location until this many days after their last due_at", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT → PUBLISHED → CLOSED; assignments may be created only while PUBLISHED", constraints: "one of {DRAFT, PUBLISHED, CLOSED}" }
      - { name: validated_shop_count, type: integer, source: computed, default: 0, description: "Count of this wave's Assignments in VALIDATED state" }
      - { name: client_billable_cents, type: integer, source: computed, default: 0, description: "validated_shop_count * ClientAccount.fee_per_completed_shop_cents at the moment of each validation (see calc client_billable)" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: wave_id, type: string, source: input, description: "FK -> ShopWave.id; the scheduling wave" }
      - { name: shopper_id, type: string, source: input, description: "FK -> Shopper.id; the assigned shopper" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; the site to audit" }
      - { name: script_id, type: string, source: input, description: "FK -> ScenarioScript.id; the scenario backing this shop" }
      - { name: due_at, type: datetime, source: input, description: "ISO8601 UTC deadline by which evidence must be submitted; must fall within the wave field window" }
      - { name: travel_distance_km, type: number, source: computed, description: "Haversine distance Shopper.home → Location, rounded to 2 dp; pins route/mileage reimbursement" }
      - { name: claimed_out_of_pocket_cents, type: integer, source: system, default: 0, description: "Receipt-substantiated spend claimed by shopper at submission", constraints: ">= 0" }
      - { name: reimbursable_cents, type: integer, source: computed, default: 0, description: "Reimbursement owed; provisional at submission, final at validation (see calc reimbursement_amount)" }
      - { name: shopper_fee_cents, type: integer, source: computed, default: 0, description: "Fee owed to shopper, finalized at validation (see calc shopper_fee)" }
      - { name: status, type: enum, source: system, default: "ASSIGNED", description: "ASSIGNED → IN_FIELD → SUBMITTED → (VALIDATED | REVISION_REQUESTED | REJECTED); REVISION_REQUESTED → IN_FIELD (cycle); also CANCELLED / EXPIRED", constraints: "one of {ASSIGNED, IN_FIELD, SUBMITTED, VALIDATED, REVISION_REQUESTED, REJECTED, CANCELLED, EXPIRED}" }
      - { name: submission_count, type: integer, source: computed, default: 0, description: "Number of times this Assignment has entered SUBMITTED (counts revision resubmits)" }
      - { name: validated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the QaValidator who moved it to VALIDATED/REJECTED (segregation-of-duties guard for payout)" }

  - name: EvidenceItem
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; owning assignment" }
      - { name: kind, type: enum, source: input, description: "PHOTO | RECEIPT", constraints: "one of {PHOTO, RECEIPT}" }
      - { name: object_uri, type: string, source: input, description: "Storage URI of the uploaded artifact" }
      - { name: section_key, type: string, source: input, default: null, description: "Optional scoring section this evidence substantiates; must be a key of the script weights_json when present. AUDITED scoring zeroes any section whose tagged evidence is FLAGGED." }
      - { name: receipt_amount_cents, type: integer, source: input, default: 0, description: "For RECEIPT items, the out-of-pocket amount on the receipt; 0 for PHOTO", constraints: ">= 0" }
      - { name: review_status, type: enum, source: system, default: "PENDING", description: "PENDING → (APPROVED | FLAGGED); FLAGGED evidence does not count toward script requirements", constraints: "one of {PENDING, APPROVED, FLAGGED}" }

  - name: ScoreCard
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; the scored assignment" }
      - { name: section_scores_json, type: object, source: input, description: "Map of section -> raw 0-100 score entered by shopper at submission; keys must match the script weights_json keys" }
      - { name: estimated_score, type: integer, source: computed, default: 0, description: "Self-reported weighted score from shopper's section_scores at submission (variant: self-report)" }
      - { name: audited_score, type: integer, source: computed, default: null, description: "QA-adjusted weighted score after validation, dropping FLAGGED sections (variant: audited)" }
      - { name: audit_status, type: enum, source: system, default: "DRAFT", description: "DRAFT → AUDITED — parallel to fraud_status; DRAFT until QA scores it", constraints: "one of {DRAFT, AUDITED}" }
      - { name: fraud_status, type: enum, source: system, default: "UNCHECKED", description: "UNCHECKED → (CLEARED | FRAUD_HOLD) — parallel dimension evolving independently of audit_status", constraints: "one of {UNCHECKED, CLEARED, FRAUD_HOLD}" }

  - name: Reimbursement
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; the reimbursed assignment" }
      - { name: shopper_id, type: string, source: system, description: "FK -> Shopper.id; the payee" }
      - { name: amount_cents, type: integer, source: computed, description: "Final reimbursable_cents + shopper_fee_cents booked at validation", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "ACCRUED", description: "ACCRUED → (BATCHED → PAID) | REVERSED; REVERSED on downstream rejection", constraints: "one of {ACCRUED, BATCHED, PAID, REVERSED}" }
      - { name: payout_batch_id, type: string, source: system, default: null, description: "FK -> PayoutBatch.id; set when BATCHED" }

  - name: Dispute
    parent: Assignment
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; the disputed shop" }
      - { name: opened_by_role, type: enum, source: system, description: "SHOPPER | CLIENT — who opened it", constraints: "one of {SHOPPER, CLIENT}" }
      - { name: reason, type: enum, source: input, description: "REJECTION_APPEAL | SCORE_CHALLENGE | REIMBURSE_SHORTFALL", constraints: "one of {REJECTION_APPEAL, SCORE_CHALLENGE, REIMBURSE_SHORTFALL}" }
      - { name: round_index, type: integer, source: computed, default: 1, description: "Negotiation round counter; increments each time it cycles UNDER_REVIEW → COUNTERED → UNDER_REVIEW" }
      - { name: status, type: enum, source: system, default: "UNDER_REVIEW", description: "UNDER_REVIEW → COUNTERED → UNDER_REVIEW (cycle, capped) → (UPHELD | OVERTURNED); terminal UPHELD/OVERTURNED/WITHDRAWN", constraints: "one of {UNDER_REVIEW, COUNTERED, UPHELD, OVERTURNED, WITHDRAWN}" }

  - name: PayoutBatch
    parent: Shopper
    common_fields: true
    fields:
      - { name: shopper_id, type: string, source: system, description: "FK -> Shopper.id; the payee for this batch" }
      - { name: tax_year, type: integer, source: system, description: "Tax year (UTC year of the logical clock at batch creation)" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "Sum of amount_cents over the Reimbursements collected into this batch", constraints: ">= 0" }
      - { name: requires_1099, type: boolean, source: computed, default: false, description: "True iff (Shopper.ytd_paid_cents at PAID time) + gross_amount_cents crosses the IRS_1099_THRESHOLD_CENTS for tax_year" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN → (PAID | VOIDED); PAID requires tax_id_on_file when requires_1099", constraints: "one of {OPEN, PAID, VOIDED}" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:

  - entity: Shopper
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: CERTIFIED
        trigger: "POST /shoppers/{id}/certification-attempts (system, when the resulting attempt outcome is PASSED)"
        actor: QaValidator
        preconditions:
          - "Shopper.status == REGISTERED"
          - "resulting CertificationAttempt.raw_score >= CERT_PASS_THRESHOLD (=70)"
        side_effects:
          - "set Shopper.certification_score = attempt.raw_score"
          - "set Shopper.status = CERTIFIED"
        note: "A FAILED attempt leaves status REGISTERED; certification_score unchanged."
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /shoppers/{id}/suspend"
        actor: PlatformAdmin
        preconditions:
          - "Shopper.status == CERTIFIED"
          - "Shopper.open_assignment_count == 0"
        side_effects:
          - "set Shopper.status = SUSPENDED"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /shoppers/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Shopper.status == SUSPENDED"
        side_effects:
          - "set Shopper.status = CERTIFIED"
      - from: CERTIFIED
        to: CERTIFIED
        trigger: "POST /shoppers/{id}/certification-attempts (re-certify into a new scenario_family)"
        actor: QaValidator
        preconditions:
          - "Shopper.status == CERTIFIED"
          - "resulting CertificationAttempt.raw_score >= CERT_PASS_THRESHOLD"
        side_effects:
          - "set Shopper.certification_score = max(Shopper.certification_score, attempt.raw_score)"
        note: "Self-loop: re-certifying refreshes certification_score but does not change status."

  - entity: ScenarioScript
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /scripts/{id}/publish"
        actor: ClientManager
        preconditions:
          - "ScenarioScript.status == DRAFT"
          - "sum of weights_json values == 1.00 (round_half_up, 2dp)"
          - "ClientAccount.status == ACTIVE"
        side_effects:
          - "set ScenarioScript.status = PUBLISHED"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /scripts/{id}/archive"
        actor: ClientManager
        preconditions:
          - "ScenarioScript.status == PUBLISHED"
          - "no Assignment referencing this script is in a non-terminal state (status NOT IN {VALIDATED, REJECTED, CANCELLED, EXPIRED})"
        side_effects:
          - "set ScenarioScript.status = ARCHIVED"

  - entity: ShopWave
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /waves/{id}/publish"
        actor: ClientManager
        preconditions:
          - "ShopWave.status == DRAFT"
          - "ClientAccount.status == ACTIVE"
          - "field_window_end > field_window_start"
        side_effects:
          - "set ShopWave.status = PUBLISHED"
      - from: PUBLISHED
        to: CLOSED
        trigger: "POST /waves/{id}/close"
        actor: ClientManager
        preconditions:
          - "ShopWave.status == PUBLISHED"
          - "no Assignment in this wave is in {ASSIGNED, IN_FIELD, SUBMITTED, REVISION_REQUESTED} (all assignments terminal)"
        side_effects:
          - "set ShopWave.status = CLOSED"

  - entity: Assignment
    initial_state: ASSIGNED
    terminal_states: [VALIDATED, CANCELLED, EXPIRED]
    # REJECTED is user-terminal (no user trigger leaves it) but NOT a hard terminal:
    # the dispute-OVERTURN cascade A (REJECTION_APPEAL) system-transitions it to VALIDATED.
    transitions:
      - from: ASSIGNED
        to: IN_FIELD
        trigger: "POST /assignments/{id}/accept"
        actor: Shopper
        preconditions:
          - "Assignment.status == ASSIGNED"
          - "acting Shopper.id == Assignment.shopper_id"
          - "logical clock now <= Assignment.due_at"
        side_effects:
          - "set Assignment.status = IN_FIELD"
          - "increment Shopper.open_assignment_count by 1"
      - from: IN_FIELD
        to: SUBMITTED
        trigger: "POST /assignments/{id}/submit"
        actor: Shopper
        preconditions:
          - "Assignment.status == IN_FIELD"
          - "acting Shopper.id == Assignment.shopper_id"
          - "logical clock now <= Assignment.due_at"
          - "count of APPROVED PHOTO EvidenceItems >= ScenarioScript.required_photo_count"
          - "if ScenarioScript.receipt_required then >= 1 APPROVED RECEIPT EvidenceItem exists"
          - "a ScoreCard exists for this Assignment"
        side_effects:
          - "set Assignment.status = SUBMITTED"
          - "increment Assignment.submission_count by 1"
          - "set Assignment.claimed_out_of_pocket_cents = sum of receipt_amount_cents over APPROVED RECEIPT EvidenceItems"
          - "compute Assignment.reimbursable_cents via reimbursement_amount.PROVISIONAL"
          - "compute ScoreCard.estimated_score via shop_score.SELF_REPORT"
      - from: SUBMITTED
        to: VALIDATED
        trigger: "POST /assignments/{id}/validate"
        actor: QaValidator
        preconditions:
          - "Assignment.status == SUBMITTED"
          - "ScoreCard.fraud_status != FRAUD_HOLD"
          - "Shopper.status != SUSPENDED"
        side_effects:
          - "compute ScoreCard.audited_score via shop_score.AUDITED; set ScoreCard.audit_status = AUDITED"
          - "compute Assignment.reimbursable_cents via reimbursement_amount.FINAL and Assignment.shopper_fee_cents via shopper_fee"
          - "set Assignment.status = VALIDATED; set Assignment.validated_by_user_id = X-User-ID"
          - "create Reimbursement{status:ACCRUED, amount_cents = Assignment.reimbursable_cents + Assignment.shopper_fee_cents}"
          - "increment ShopWave.validated_shop_count by 1 and recompute ShopWave.client_billable_cents via client_billable"
          - "decrement Shopper.open_assignment_count by 1"
        note: "Cross-entity guarded transition: blocked while ScoreCard.fraud_status == FRAUD_HOLD."
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /assignments/{id}/request-revision"
        actor: QaValidator
        preconditions:
          - "Assignment.status == SUBMITTED"
          - "Assignment.submission_count <= MAX_REVISION_ROUNDS (=2)"
        side_effects:
          - "set Assignment.status = REVISION_REQUESTED"
          - "set every APPROVED EvidenceItem on this Assignment back to PENDING"
        note: "Cyclic: REVISION_REQUESTED returns to IN_FIELD for resubmission."
      - from: REVISION_REQUESTED
        to: IN_FIELD
        trigger: "POST /assignments/{id}/resume"
        actor: Shopper
        preconditions:
          - "Assignment.status == REVISION_REQUESTED"
          - "acting Shopper.id == Assignment.shopper_id"
          - "logical clock now <= Assignment.due_at"
        side_effects:
          - "set Assignment.status = IN_FIELD"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /assignments/{id}/reject"
        actor: QaValidator
        preconditions:
          - "Assignment.status == SUBMITTED"
        side_effects:
          - "set Assignment.status = REJECTED; set Assignment.validated_by_user_id = X-User-ID"
          - "decrement Shopper.reliability_score by REJECT_RELIABILITY_PENALTY (=10), floored at 0"
          - "decrement Shopper.open_assignment_count by 1"
          - "set Assignment.reimbursable_cents = 0 and Assignment.shopper_fee_cents = 0"
        note: "REJECTED before validation creates no Reimbursement. Rejection AFTER validation is the dispute-OVERTURNED cascade below."
      - from: REJECTED
        to: VALIDATED
        trigger: "system: side effect of Dispute UNDER_REVIEW→OVERTURNED cascade A (reason == REJECTION_APPEAL)"
        actor: system
        preconditions:
          - "Assignment.status == REJECTED"
          - "the resolving Dispute.reason == REJECTION_APPEAL and Dispute transitioning to OVERTURNED"
        side_effects:
          - "compute Assignment.reimbursable_cents via reimbursement_amount.FINAL and Assignment.shopper_fee_cents via shopper_fee"
          - "set Assignment.status = VALIDATED"
          - "create Reimbursement{status:ACCRUED, amount_cents = reimbursable_cents + shopper_fee_cents}"
          - "increment ShopWave.validated_shop_count by 1 and recompute ShopWave.client_billable_cents via client_billable"
          - "restore Shopper.reliability_score by REJECT_RELIABILITY_PENALTY (=10), capped at 100"
        note: "Only reachable as the cascade of dispute resolution; no user-facing trigger leaves REJECTED."
      - from: ASSIGNED
        to: EXPIRED
        trigger: "POST /assignments/{id}/sweep-deadline (system; logical clock now > Assignment.due_at)"
        actor: system
        preconditions:
          - "Assignment.status IN {ASSIGNED, IN_FIELD, REVISION_REQUESTED}"
          - "logical clock now > Assignment.due_at"
        side_effects:
          - "set Assignment.status = EXPIRED"
          - "decrement Shopper.reliability_score by NO_SHOW_RELIABILITY_PENALTY (=20), floored at 0"
          - "if Assignment was IN_FIELD or REVISION_REQUESTED, decrement Shopper.open_assignment_count by 1"
        note: "Same trigger from IN_FIELD and REVISION_REQUESTED (see duplicated rows below for state coverage)."
      - from: IN_FIELD
        to: EXPIRED
        trigger: "POST /assignments/{id}/sweep-deadline (system; logical clock now > Assignment.due_at)"
        actor: system
        preconditions:
          - "Assignment.status == IN_FIELD"
          - "logical clock now > Assignment.due_at"
        side_effects:
          - "set Assignment.status = EXPIRED"
          - "decrement Shopper.reliability_score by NO_SHOW_RELIABILITY_PENALTY (=20), floored at 0"
          - "decrement Shopper.open_assignment_count by 1"
      - from: REVISION_REQUESTED
        to: EXPIRED
        trigger: "POST /assignments/{id}/sweep-deadline (system; logical clock now > Assignment.due_at)"
        actor: system
        preconditions:
          - "Assignment.status == REVISION_REQUESTED"
          - "logical clock now > Assignment.due_at"
        side_effects:
          - "set Assignment.status = EXPIRED"
          - "decrement Shopper.reliability_score by NO_SHOW_RELIABILITY_PENALTY (=20), floored at 0"
          - "decrement Shopper.open_assignment_count by 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel"
        actor: ClientManager
        preconditions:
          - "Assignment.status IN {ASSIGNED, IN_FIELD, REVISION_REQUESTED}"
          - "expected_assignment_version matches Assignment.version (OCC)"
        side_effects:
          - "set Assignment.status = CANCELLED"
          - "increments Assignment.version by 1"
          - "if Assignment was IN_FIELD or REVISION_REQUESTED, decrement Shopper.open_assignment_count by 1"

  - entity: ScoreCard
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: AUDITED
        trigger: "side effect of Assignment SUBMITTED→VALIDATED (audit dimension)"
        actor: QaValidator
        preconditions:
          - "parent Assignment transitioning SUBMITTED→VALIDATED"
        side_effects:
          - "compute ScoreCard.audited_score via shop_score.AUDITED"
        note: "audit_status dimension; evolves independently of fraud_status."
      - from: UNCHECKED
        to: CLEARED
        trigger: "POST /assignments/{id}/scorecard/fraud-check (decision=CLEAR)"
        actor: QaValidator
        preconditions:
          - "ScoreCard.fraud_status == UNCHECKED"
        side_effects:
          - "set ScoreCard.fraud_status = CLEARED"
        note: "fraud_status dimension; parallel to audit_status. UNCHECKED/CLEARED/FRAUD_HOLD live on the same row as DRAFT/AUDITED but transition independently."
      - from: UNCHECKED
        to: FRAUD_HOLD
        trigger: "POST /assignments/{id}/scorecard/fraud-check (decision=HOLD)"
        actor: QaValidator
        preconditions:
          - "ScoreCard.fraud_status == UNCHECKED"
        side_effects:
          - "set ScoreCard.fraud_status = FRAUD_HOLD"
          - "blocks parent Assignment SUBMITTED→VALIDATED until cleared"
      - from: FRAUD_HOLD
        to: CLEARED
        trigger: "POST /assignments/{id}/scorecard/fraud-check (decision=CLEAR)"
        actor: QaValidator
        preconditions:
          - "ScoreCard.fraud_status == FRAUD_HOLD"
        side_effects:
          - "set ScoreCard.fraud_status = CLEARED"

  - entity: Dispute
    initial_state: UNDER_REVIEW
    terminal_states: [UPHELD, OVERTURNED, WITHDRAWN]
    transitions:
      - from: UNDER_REVIEW
        to: COUNTERED
        trigger: "POST /disputes/{id}/counter"
        actor: QaValidator
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
          - "Dispute.round_index < MAX_DISPUTE_ROUNDS (=3)"
        side_effects:
          - "set Dispute.status = COUNTERED"
        note: "Cyclic negotiation."
      - from: COUNTERED
        to: UNDER_REVIEW
        trigger: "POST /disputes/{id}/respond"
        actor: Shopper
        preconditions:
          - "Dispute.status == COUNTERED"
          - "acting Shopper.id == parent Assignment.shopper_id"
        side_effects:
          - "increment Dispute.round_index by 1"
          - "set Dispute.status = UNDER_REVIEW"
        note: "Closes the UNDER_REVIEW→COUNTERED→UNDER_REVIEW loop; round_index caps the cycle."
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /disputes/{id}/resolve (decision=UPHOLD)"
        actor: FinanceOfficer
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
        side_effects:
          - "set Dispute.status = UPHELD"
        note: "UPHELD = original decision stands; no cascade."
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /disputes/{id}/resolve (decision=OVERTURN)"
        actor: FinanceOfficer
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
          - "parent Assignment.status == VALIDATED (for SCORE_CHALLENGE/REIMBURSE_SHORTFALL) OR REJECTED (for REJECTION_APPEAL)"
        side_effects:
          - "set Dispute.status = OVERTURNED"
          - "if reason == REJECTION_APPEAL: cascade A — set Assignment.status = VALIDATED, create Reimbursement{ACCRUED}, increment ShopWave.validated_shop_count and recompute client_billable, restore Shopper.reliability_score by REJECT_RELIABILITY_PENALTY (capped 100)"
          - "if reason == SCORE_CHALLENGE/REIMBURSE_SHORTFALL on a VALIDATED Assignment: cascade B — recompute Assignment.reimbursable_cents via reimbursement_amount.FINAL with override flag, then update the linked ACCRUED Reimbursement.amount_cents, which itself recomputes PayoutBatch.gross_amount_cents if already BATCHED"
        note: "Two distinct OVERTURN cascades keyed on reason."
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Shopper
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
          - "Dispute.opened_by_role == SHOPPER"
          - "acting Shopper.id == parent Assignment.shopper_id"
        side_effects:
          - "set Dispute.status = WITHDRAWN"

  - entity: Reimbursement
    initial_state: ACCRUED
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: ACCRUED
        to: BATCHED
        trigger: "POST /payout-batches (collects ACCRUED reimbursements for a shopper)"
        actor: FinanceOfficer
        preconditions:
          - "Reimbursement.status == ACCRUED"
          - "FinanceOfficer X-User-ID != parent Assignment.validated_by_user_id (segregation of duties)"
        side_effects:
          - "set Reimbursement.status = BATCHED; set Reimbursement.payout_batch_id = batch.id"
      - from: BATCHED
        to: PAID
        trigger: "POST /payout-batches/{id}/pay"
        actor: FinanceOfficer
        preconditions:
          - "Reimbursement.status == BATCHED"
          - "PayoutBatch.status == OPEN transitioning to PAID"
        side_effects:
          - "set Reimbursement.status = PAID"
      - from: ACCRUED
        to: REVERSED
        trigger: "side effect of Dispute OVERTURNED cascade A reversal OR Assignment post-validation rejection"
        actor: system
        preconditions:
          - "Reimbursement.status == ACCRUED"
        side_effects:
          - "set Reimbursement.status = REVERSED"
          - "decrement ShopWave.validated_shop_count and recompute client_billable"

  - entity: PayoutBatch
    initial_state: OPEN
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /payout-batches/{id}/pay"
        actor: FinanceOfficer
        preconditions:
          - "PayoutBatch.status == OPEN"
          - "if requires_1099 then Shopper.tax_id_on_file == true"
          - "every Reimbursement in this batch is still BATCHED (none REVERSED since batching)"
        side_effects:
          - "set PayoutBatch.status = PAID"
          - "set each member Reimbursement.status = PAID"
          - "increment Shopper.ytd_paid_cents by gross_amount_cents"
          - "recompute PayoutBatch.requires_1099 via thousand_99_check at pay time"
      - from: OPEN
        to: VOIDED
        trigger: "POST /payout-batches/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "PayoutBatch.status == OPEN"
        side_effects:
          - "set PayoutBatch.status = VOIDED"
          - "set each member Reimbursement.status back to ACCRUED and clear payout_batch_id"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assignment-cancel-stale
    parent_entity: Assignment
    write_endpoint: "POST /assignments/{id}/cancel"
    occ_field: "expected_assignment_version"
    description: |
      Cancelling an Assignment whose version has advanced since the client last
      observed it is rejected on a stale-version basis. The canonical case: a
      ClientManager reads the Assignment, but the Shopper has since accepted it
      (ASSIGNED→IN_FIELD bumped version); the manager's cancel still carries the
      pre-accept version and is rejected so the manager re-reads current state
      before cancelling.
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:

  - name: reimbursement_amount
    trigger: "Assignment SUBMITTED (provisional) and SUBMITTED→VALIDATED (final)"
    algorithm: forward_looking
    formula: |
      mileage_cents = round_half_up(Assignment.travel_distance_km * MILEAGE_RATE_CENTS_PER_KM)
      # PROVISIONAL (at submission): trust the shopper's claimed out-of-pocket as-is.
      oop_provisional = Assignment.claimed_out_of_pocket_cents
      # FINAL (at validation): only RECEIPT items that survived review as APPROVED count.
      oop_final = sum(receipt_amount_cents for EvidenceItem
                      where kind == RECEIPT and review_status == APPROVED)
      capped_oop = min(oop_variant, ScenarioScript.reimburse_cap_cents)
      reimbursable_cents = capped_oop + mileage_cents
    input_set: "EvidenceItems of the Assignment; PROVISIONAL counts claimed_out_of_pocket; FINAL counts only APPROVED RECEIPT items"
    constants:
      MILEAGE_RATE_CENTS_PER_KM: 35
    precision: "cents; round_half_up at the single mileage multiply; no other rounding"
    variants:
      - name: PROVISIONAL
        when: "computed at SUBMITTED to show the shopper an estimate"
        difference: "uses claimed_out_of_pocket_cents (shopper self-claim) before QA flags any receipts"
      - name: FINAL
        when: "computed at VALIDATED, and re-run on dispute OVERTURN cascade B with override"
        difference: "uses only APPROVED RECEIPT receipt_amount_cents; FLAGGED receipts are excluded, so FINAL <= PROVISIONAL whenever any receipt is flagged"

  - name: shop_score
    trigger: "Assignment SUBMITTED (estimated) and SUBMITTED→VALIDATED (audited)"
    algorithm: weighted_scoring
    formula: |
      # weights w_s come from ScenarioScript.weights_json (sum to 1.00).
      # SELF_REPORT (estimated): every section the shopper scored counts.
      estimated_score = round_half_up( sum( w_s * section_scores_json[s] for each section s in weights_json ) )
      # AUDITED: a section whose backing evidence is FLAGGED contributes 0; weights are NOT renormalized.
      audited_score   = round_half_up( sum( (0 if section s has a FLAGGED EvidenceItem else w_s * section_scores_json[s]) for each section s in weights_json ) )
    input_set: "ScenarioScript.weights_json keys; section_scores_json on the ScoreCard; EvidenceItem.review_status for AUDITED"
    constants: {}
    precision: "integer 0-100; round_half_up after the weighted sum (sum then round — NOT round-per-section then sum)"
    variants:
      - name: SELF_REPORT
        when: "ScoreCard.estimated_score at submission"
        difference: "all sections count at face value; no flag adjustment"
      - name: AUDITED
        when: "ScoreCard.audited_score at validation"
        difference: "FLAGGED-evidence sections contribute 0 without renormalizing weights, so audited_score <= estimated_score"

  - name: shopper_fee
    trigger: "Assignment SUBMITTED→VALIDATED"
    algorithm: tiered_pricing
    formula: |
      base = ScenarioScript.base_fee_cents
      # Reliability bonus tier selected by Shopper.reliability_score AT validation time.
      if   Shopper.reliability_score >= 90: bonus_pct = 0.20
      elif Shopper.reliability_score >= 75: bonus_pct = 0.10
      else:                                 bonus_pct = 0.00
      shopper_fee_cents = base + round_half_up(base * bonus_pct)
    input_set: "ScenarioScript.base_fee_cents; Shopper.reliability_score at validation"
    constants:
      TIER_HIGH_THRESHOLD: 90
      TIER_MID_THRESHOLD: 75
    precision: "cents; round_half_up on the bonus term; tier selection uses >= (90 qualifies HIGH, 89.99 does not)"
    variants:
      - name: STANDARD
        when: "always at validation"
        difference: "single algorithm; tier boundaries are the difficulty — 90.0 → 20%, 75.0 → 10%"

  - name: client_billable
    trigger: "ShopWave.validated_shop_count change (validation increment, reversal decrement)"
    algorithm: aggregation
    formula: |
      # Recompute from scratch each time to avoid drift.
      validated = count of Assignment where wave_id == ShopWave.id and status == VALIDATED
      ShopWave.validated_shop_count = validated
      ShopWave.client_billable_cents = validated * ClientAccount.fee_per_completed_shop_cents
    input_set: "Assignments of the wave with status == VALIDATED; ClientAccount.fee_per_completed_shop_cents"
    constants: {}
    precision: "integer cents; exact multiply, no rounding"
    variants:
      - name: STANDARD
        when: "on every validation / reversal"
        difference: "full recompute (count VALIDATED) rather than incremental ± to guarantee invariant client_billable_cents == validated_shop_count * fee"

  - name: thousand_99_check
    trigger: "PayoutBatch OPEN→PAID"
    algorithm: threshold
    formula: |
      prior_ytd = Shopper.ytd_paid_cents     # cents PAID this tax_year BEFORE this batch
      new_ytd   = prior_ytd + PayoutBatch.gross_amount_cents
      requires_1099 = (new_ytd >= IRS_1099_THRESHOLD_CENTS) and (prior_ytd < IRS_1099_THRESHOLD_CENTS)
    input_set: "Shopper.ytd_paid_cents within tax_year; PayoutBatch.gross_amount_cents"
    constants:
      IRS_1099_THRESHOLD_CENTS: 60000
    precision: "integer cents; boundary uses >= (exactly 60000 crosses; 59999 does not)"
    variants:
      - name: STANDARD
        when: "at pay time"
        difference: "requires_1099 fires only on the batch that CROSSES the threshold (prior below, new at/above) — a later batch in the same year that is already above does not re-fire"

  - name: travel_distance
    trigger: "Assignment creation (POST /assignments)"
    algorithm: aggregation
    formula: |
      # Haversine great-circle distance, Shopper home → Location.
      R = 6371.0088   # km
      dlat = radians(Location.lat - Shopper.home_lat)
      dlng = radians(Location.lng - Shopper.home_lng)
      a = sin(dlat/2)^2 + cos(radians(Shopper.home_lat)) * cos(radians(Location.lat)) * sin(dlng/2)^2
      travel_distance_km = round_half_up( 2 * R * asin(sqrt(a)) )   # 2 decimal places
    input_set: "Shopper.home_lat/home_lng; Location.lat/lng"
    constants:
      EARTH_RADIUS_KM: 6371.0088
    precision: "2 decimal places, round_half_up"
    variants:
      - name: STANDARD
        when: "once, at assignment creation; frozen thereafter"
        difference: "single variant; pins route/mileage so reimbursement is deterministic"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /shoppers, POST /clients (public self-registration)"

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body id resolves to an existing resource, validated left-to-right in the path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"

  - priority: 4
    category: auth
    check: "Ownership: a Shopper acting on an Assignment must equal Assignment.shopper_id; a ClientManager acting on a wave/script/location must own the parent ClientAccount"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "shopper assignment actions, client_manager resource actions"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_constraint
    check: "OCC: expected_assignment_version equals Assignment.version on cancel"
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412
    applies_to: "POST /assignments/{id}/cancel"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: the FinanceOfficer batching/paying a Reimbursement must not be the QaValidator who validated its Assignment (X-User-ID != Assignment.validated_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /payout-batches, POST /payout-batches/{id}/pay"

  - priority: 8
    category: business_safety
    check: "1099 gate: paying a batch that requires_1099 demands Shopper.tax_id_on_file == true"
    error_id: ERR_TAX_ID_REQUIRED
    http_status: 422
    applies_to: "POST /payout-batches/{id}/pay"

  - priority: 9
    category: business_referential
    check: "Shopper must be CERTIFIED and certified in the Location.scenario_family before assignment; family must match Location.scenario_family == ScenarioScript.scenario_family"
    error_id: ERR_SHOPPER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /assignments"

  - priority: 10
    category: business_referential
    check: "Script family, Location family must be identical; script must be PUBLISHED; wave PUBLISHED; location ACTIVE; client ACTIVE"
    error_id: ERR_FAMILY_MISMATCH
    http_status: 422
    applies_to: "POST /assignments"

  - priority: 11
    category: business_temporal
    check: "Assignment.due_at must fall within [field_window_start, field_window_end] of the wave (inclusive both ends)"
    error_id: ERR_DUE_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /assignments"

  - priority: 12
    category: business_temporal
    check: "Rotation cooldown: the Shopper must not have another Assignment to the SAME Location whose due_at is within rotation_cooldown_days before the new due_at"
    error_id: ERR_ROTATION_COOLDOWN
    http_status: 409
    applies_to: "POST /assignments"

  - priority: 13
    category: business_constraint
    check: "Submission evidence completeness: APPROVED PHOTO count >= required_photo_count AND (receipt_required ⇒ >=1 APPROVED RECEIPT) AND a ScoreCard exists"
    error_id: ERR_EVIDENCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /assignments/{id}/submit"

  - priority: 14
    category: business_constraint
    check: "ScoreCard.section_scores_json keys must be exactly the keys of the script's weights_json (no missing, no extra)"
    error_id: ERR_SECTION_KEYS_MISMATCH
    http_status: 422
    applies_to: "POST /assignments/{id}/scorecard"

  - priority: 15
    category: business_constraint
    check: "Script weights_json values are non-negative and sum to 1.00 (round_half_up, 2dp) at publish"
    error_id: ERR_WEIGHTS_NOT_NORMALIZED
    http_status: 422
    applies_to: "POST /scripts/{id}/publish"

  - priority: 16
    category: business_temporal
    check: "ShopWave field_window_end must be strictly after field_window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /waves, POST /waves/{id}/publish"

  - priority: 17
    category: business_constraint
    check: "Certification raw_score within 0..100; scenario_family valid enum"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /shoppers/{id}/certification-attempts"

  - priority: 18
    category: business_constraint
    check: "Dispute round cap: counter is rejected when round_index >= MAX_DISPUTE_ROUNDS"
    error_id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /disputes/{id}/counter"

  - priority: 19
    category: business_constraint
    check: "Revision cap: request-revision rejected when submission_count > MAX_REVISION_ROUNDS"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /assignments/{id}/request-revision"

  - priority: 20
    category: business_referential
    check: "At most one OPEN/UNDER_REVIEW Dispute per Assignment; opening a second is rejected"
    error_id: ERR_DISPUTE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /assignments/{id}/disputes"

  - priority: 21
    category: business_constraint
    check: "Generic malformed body: missing required field, wrong type, negative where >=0 required, out-of-range enum"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:

  # --- ClientAccount ---
  - method: POST
    path: "/clients"
    description: "Register a client account (public)."
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: [company_name, billing_email, fee_per_completed_shop_cents]
    output: ClientAccount
    side_effects: ["status defaults ACTIVE"]
  - method: GET
    path: "/clients/{id}"
    description: "Fetch a client account."
    roles: [PlatformAdmin, ClientManager]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []
  - method: POST
    path: "/clients/{id}/suspend"
    description: "Suspend a client (blocks new wave/script publish & assignment)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ClientAccount
    side_effects: ["set status = SUSPENDED"]

  # --- Locations (child of client) ---
  - method: POST
    path: "/clients/{id}/locations"
    description: "Create a location under a client."
    roles: [ClientManager, PlatformAdmin]
    code: 201
    input: [label, lat, lng, scenario_family]
    output: Location
    side_effects: ["status defaults ACTIVE"]
  - method: GET
    path: "/clients/{id}/locations"
    description: "List locations of a client (reverse-reachability for Location.client_id)."
    roles: [ClientManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Location[]
    side_effects: []
  - method: POST
    path: "/locations/{id}/retire"
    description: "Retire a location."
    roles: [ClientManager, PlatformAdmin]
    code: 200
    input: []
    output: Location
    side_effects: ["status = RETIRED"]

  # --- Scenario scripts (child of client) ---
  - method: POST
    path: "/clients/{id}/scripts"
    description: "Create a DRAFT scenario script under a client."
    roles: [ClientManager, PlatformAdmin]
    code: 201
    input: [title, scenario_family, required_photo_count, receipt_required, reimburse_cap_cents, base_fee_cents, weights_json, passing_score]
    output: ScenarioScript
    side_effects: ["status defaults DRAFT"]
  - method: GET
    path: "/clients/{id}/scripts"
    description: "List scripts of a client (reverse-reachability for ScenarioScript.client_id)."
    roles: [ClientManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ScenarioScript[]
    side_effects: []
  - method: POST
    path: "/scripts/{id}/publish"
    description: "Publish a DRAFT script (weights must sum to 1.00)."
    roles: [ClientManager]
    code: 200
    input: []
    output: ScenarioScript
    side_effects: ["status = PUBLISHED"]
  - method: POST
    path: "/scripts/{id}/archive"
    description: "Archive a PUBLISHED script."
    roles: [ClientManager]
    code: 200
    input: []
    output: ScenarioScript
    side_effects: ["status = ARCHIVED"]

  # --- Shop waves (child of client) ---
  - method: POST
    path: "/clients/{id}/waves"
    description: "Create a DRAFT shop wave under a client."
    roles: [ClientManager, PlatformAdmin]
    code: 201
    input: ["name", "field_window_start", "field_window_end", "rotation_cooldown_days?"]
    output: ShopWave
    side_effects: ["status defaults DRAFT"]
  - method: GET
    path: "/clients/{id}/waves"
    description: "List waves of a client (reverse-reachability for ShopWave.client_id)."
    roles: [ClientManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ShopWave[]
    side_effects: []
  - method: GET
    path: "/waves/{id}"
    description: "Fetch a wave with computed counters."
    roles: [ClientManager, PlatformAdmin]
    code: 200
    input: []
    output: ShopWave
    side_effects: []
  - method: POST
    path: "/waves/{id}/publish"
    description: "Publish a wave (window must be valid, client ACTIVE)."
    roles: [ClientManager]
    code: 200
    input: []
    output: ShopWave
    side_effects: ["status = PUBLISHED"]
  - method: POST
    path: "/waves/{id}/close"
    description: "Close a wave once all its assignments are terminal."
    roles: [ClientManager]
    code: 200
    input: []
    output: ShopWave
    side_effects: ["status = CLOSED"]
  # --- Shoppers ---
  - method: POST
    path: "/shoppers"
    description: "Register a shopper (public)."
    roles: [Anonymous, PlatformAdmin]
    code: 201
    input: ["full_name", "email", "home_lat", "home_lng", "tax_id_on_file?"]
    output: Shopper
    side_effects: ["status defaults REGISTERED; reliability_score=100"]
  - method: GET
    path: "/shoppers/{id}"
    description: "Fetch a shopper with computed scores and ytd_paid_cents."
    roles: [PlatformAdmin, QaValidator, FinanceOfficer, Shopper]
    code: 200
    input: []
    output: Shopper
    side_effects: []
  - method: PATCH
    path: "/shoppers/{id}/tax-profile"
    description: "Set tax_id_on_file (W-9 received)."
    roles: [PlatformAdmin, FinanceOfficer, Shopper]
    code: 200
    input: [tax_id_on_file]
    output: Shopper
    side_effects: ["set tax_id_on_file"]
  - method: POST
    path: "/shoppers/{id}/certification-attempts"
    description: "Record a certification attempt; PASS certifies the shopper."
    roles: [QaValidator]
    code: 201
    input: [raw_score, scenario_family]
    output: CertificationAttempt
    side_effects: ["compute outcome; if PASSED, certify shopper / refresh certification_score"]
  - method: GET
    path: "/shoppers/{id}/certification-attempts"
    description: "List a shopper's certification attempts (reverse-reachability for CertificationAttempt.shopper_id)."
    roles: [QaValidator, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CertificationAttempt[]
    side_effects: []
  - method: POST
    path: "/shoppers/{id}/suspend"
    description: "Suspend a certified shopper with no open assignments."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Shopper
    side_effects: ["status = SUSPENDED"]
  - method: POST
    path: "/shoppers/{id}/reinstate"
    description: "Reinstate a suspended shopper."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Shopper
    side_effects: ["status = CERTIFIED"]

  # --- Assignments ---
  - method: POST
    path: "/assignments"
    description: "Create an assignment (binds shopper+location+script+wave; computes travel_distance)."
    roles: [ClientManager, PlatformAdmin]
    code: 201
    input: [wave_id, shopper_id, location_id, script_id, due_at]
    output: Assignment
    side_effects: ["compute travel_distance_km via travel_distance; status ASSIGNED"]
  - method: GET
    path: "/assignments/{id}"
    description: "Fetch an assignment with computed reimbursable/fee."
    roles: [ClientManager, PlatformAdmin, QaValidator, FinanceOfficer, Shopper]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: GET
    path: "/assignments"
    description: "List/filter assignments by wave_id, shopper_id, location_id, script_id (reverse-reachability for all four FKs)."
    roles: [ClientManager, PlatformAdmin, QaValidator, FinanceOfficer, Shopper]
    code: 200
    input: ["wave_id?", "shopper_id?", "location_id?", "script_id?", "status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []
  - method: POST
    path: "/assignments/{id}/accept"
    description: "Shopper accepts the assignment (ASSIGNED→IN_FIELD)."
    roles: [Shopper]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status = IN_FIELD; Shopper.open_assignment_count += 1"]
  - method: POST
    path: "/assignments/{id}/evidence"
    description: "Upload a photo/receipt evidence item, optionally tagged to a scoring section."
    roles: [Shopper]
    code: 201
    input: ["kind", "object_uri", "section_key?", "receipt_amount_cents?"]
    output: EvidenceItem
    side_effects: ["review_status defaults PENDING"]
  - method: GET
    path: "/assignments/{id}/evidence"
    description: "List evidence of an assignment (reverse-reachability for EvidenceItem.assignment_id)."
    roles: [Shopper, QaValidator, ClientManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []
  - method: POST
    path: "/evidence/{id}/review"
    description: "QA approves or flags an evidence item (PENDING→APPROVED|FLAGGED)."
    roles: [QaValidator]
    code: 200
    input: [decision]
    output: EvidenceItem
    side_effects: ["set review_status per decision (APPROVE→APPROVED, FLAG→FLAGGED)"]
  - method: POST
    path: "/assignments/{id}/scorecard"
    description: "Shopper creates the scorecard with self-reported section scores."
    roles: [Shopper]
    code: 201
    input: [section_scores_json]
    output: ScoreCard
    side_effects: ["audit_status DRAFT; fraud_status UNCHECKED"]
  - method: GET
    path: "/assignments/{id}/scorecard"
    description: "Fetch the scorecard (reverse-reachability for ScoreCard.assignment_id)."
    roles: [Shopper, QaValidator, ClientManager, PlatformAdmin]
    code: 200
    input: []
    output: ScoreCard[]
    side_effects: []
  - method: POST
    path: "/assignments/{id}/scorecard/fraud-check"
    description: "QA sets the scorecard fraud_status (CLEAR or HOLD)."
    roles: [QaValidator]
    code: 200
    input: [decision]
    output: ScoreCard
    side_effects: ["set fraud_status (CLEAR→CLEARED, HOLD→FRAUD_HOLD)"]
  - method: POST
    path: "/assignments/{id}/submit"
    description: "Shopper submits the field work (IN_FIELD→SUBMITTED); computes provisional reimbursement and estimated score."
    roles: [Shopper]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status SUBMITTED; submission_count += 1; claimed_out_of_pocket set; reimbursement_amount.PROVISIONAL; shop_score.SELF_REPORT"]
  - method: POST
    path: "/assignments/{id}/validate"
    description: "QA validates (SUBMITTED→VALIDATED); books final reimbursement+fee, scores audited, accrues payout, updates wave."
    roles: [QaValidator]
    code: 200
    input: []
    output: Assignment
    side_effects: ["audited_score; reimbursement_amount.FINAL; shopper_fee; create Reimbursement{ACCRUED}; wave.validated_shop_count += 1 & client_billable; open_assignment_count -= 1; set validated_by_user_id"]
  - method: POST
    path: "/assignments/{id}/request-revision"
    description: "QA returns the shop for revision (SUBMITTED→REVISION_REQUESTED); approved evidence reset to PENDING."
    roles: [QaValidator]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status REVISION_REQUESTED; all APPROVED evidence → PENDING"]
  - method: POST
    path: "/assignments/{id}/resume"
    description: "Shopper resumes after revision (REVISION_REQUESTED→IN_FIELD)."
    roles: [Shopper]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status IN_FIELD"]
  - method: POST
    path: "/assignments/{id}/reject"
    description: "QA rejects a SUBMITTED shop (SUBMITTED→REJECTED); reliability penalty, no reimbursement."
    roles: [QaValidator]
    code: 200
    input: []
    output: Assignment
    side_effects: ["status REJECTED; reliability_score -= 10 (floor 0); open_assignment_count -= 1; reimbursable=fee=0; set validated_by_user_id"]
  - method: POST
    path: "/assignments/{id}/cancel"
    description: "ClientManager cancels a non-terminal assignment (OCC-guarded)."
    roles: [ClientManager, PlatformAdmin]
    code: 200
    input: [expected_assignment_version]
    output: Assignment
    side_effects: ["status CANCELLED; increments Assignment.version by 1; open_assignment_count adjust"]
  - method: POST
    path: "/assignments/{id}/sweep-deadline"
    description: "System sweep: expire non-terminal assignments past due_at (clock-driven)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Assignment
    side_effects: ["if now > due_at: status EXPIRED; reliability_score -= 20 (floor 0); open_assignment_count adjust"]

  # --- Disputes ---
  - method: POST
    path: "/assignments/{id}/disputes"
    description: "Open a dispute against a VALIDATED or REJECTED assignment."
    roles: [Shopper, ClientManager]
    code: 201
    input: [reason]
    output: Dispute
    side_effects: ["status UNDER_REVIEW; round_index 1; opened_by_role from acting role"]
  - method: GET
    path: "/assignments/{id}/disputes"
    description: "List disputes of an assignment (reverse-reachability for Dispute.assignment_id)."
    roles: [Shopper, ClientManager, QaValidator, FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: "/disputes/{id}/counter"
    description: "QA counters the dispute (UNDER_REVIEW→COUNTERED), capped by round_index."
    roles: [QaValidator]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status COUNTERED"]
  - method: POST
    path: "/disputes/{id}/respond"
    description: "Shopper responds to a counter (COUNTERED→UNDER_REVIEW); round_index += 1."
    roles: [Shopper]
    code: 200
    input: []
    output: Dispute
    side_effects: ["round_index += 1; status UNDER_REVIEW"]
  - method: POST
    path: "/disputes/{id}/resolve"
    description: "FinanceOfficer resolves (UPHOLD or OVERTURN); OVERTURN triggers reason-keyed cascade."
    roles: [FinanceOfficer]
    code: 200
    input: [decision]
    output: Dispute
    side_effects: ["UPHOLD→UPHELD; OVERTURN→OVERTURNED + cascade A (re-validate) or B (re-price reimbursement)"]
  - method: POST
    path: "/disputes/{id}/withdraw"
    description: "Shopper withdraws their own dispute (UNDER_REVIEW→WITHDRAWN)."
    roles: [Shopper]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status WITHDRAWN"]

  # --- Payouts ---
  - method: POST
    path: "/payout-batches"
    description: "FinanceOfficer collects a shopper's ACCRUED reimbursements into a batch (segregation of duties enforced)."
    roles: [FinanceOfficer]
    code: 201
    input: [shopper_id, reimbursement_ids]
    output: PayoutBatch
    side_effects: ["batch ACCRUED→BATCHED reimbursements; gross_amount_cents summed; tax_year set"]
  - method: GET
    path: "/payout-batches/{id}"
    description: "Fetch a payout batch."
    roles: [FinanceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: []
  - method: GET
    path: "/payout-batches"
    description: "List payout batches, filterable by shopper_id (reverse-reachability for PayoutBatch.shopper_id)."
    roles: [FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["shopper_id?", "limit?", "offset?"]
    output: PayoutBatch[]
    side_effects: []
  - method: GET
    path: "/payout-batches/{id}/reimbursements"
    description: "List reimbursements in a batch (reverse-reachability for Reimbursement.payout_batch_id)."
    roles: [FinanceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Reimbursement[]
    side_effects: []
  - method: GET
    path: "/shoppers/{id}/reimbursements"
    description: "List a shopper's reimbursements (reverse-reachability for Reimbursement.shopper_id)."
    roles: [FinanceOfficer, PlatformAdmin, Shopper]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Reimbursement[]
    side_effects: []
  - method: GET
    path: "/assignments/{id}/reimbursement"
    description: "List the reimbursement of an assignment (reverse-reachability for Reimbursement.assignment_id; 0 or 1)."
    roles: [FinanceOfficer, PlatformAdmin, QaValidator, Shopper]
    code: 200
    input: []
    output: Reimbursement[]
    side_effects: []
  - method: POST
    path: "/payout-batches/{id}/pay"
    description: "Pay a batch (1099 gate + segregation of duties); marks members PAID, accrues ytd, evaluates 1099."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["status PAID; members PAID; ytd_paid_cents += gross; thousand_99_check"]
  - method: POST
    path: "/payout-batches/{id}/void"
    description: "Void an OPEN batch; members revert to ACCRUED."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: ["status VOIDED; members → ACCRUED, payout_batch_id cleared"]

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time. tax_year derives from this clock's UTC year."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances/sets logical clock used by due_at deadline, sweep, rotation cooldown, tax_year"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-Role or X-User-ID on a protected endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Shopper acting on another shopper's assignment, or manager acting on a resource of a client they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path or body id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_STALE_ASSIGNMENT_VERSION, http: 412, condition: "expected_assignment_version != Assignment.version on cancel" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "FinanceOfficer batching/paying equals the QaValidator who validated the assignment" }
  - { id: ERR_TAX_ID_REQUIRED, http: 422, condition: "Paying a 1099-required batch when Shopper.tax_id_on_file is false" }
  - { id: ERR_SHOPPER_NOT_CERTIFIED, http: 422, condition: "Assigning a non-CERTIFIED shopper or a shopper not certified in the location's scenario_family" }
  - { id: ERR_FAMILY_MISMATCH, http: 422, condition: "Location/script scenario_family mismatch, or script not PUBLISHED, wave not PUBLISHED, location RETIRED, or client SUSPENDED at assignment" }
  - { id: ERR_DUE_OUTSIDE_WINDOW, http: 422, condition: "Assignment due_at outside the wave field window" }
  - { id: ERR_ROTATION_COOLDOWN, http: 409, condition: "Shopper re-assigned to the same location within rotation_cooldown_days of a prior due_at" }
  - { id: ERR_EVIDENCE_INCOMPLETE, http: 422, condition: "Submit with too few APPROVED photos, missing required APPROVED receipt, or no scorecard" }
  - { id: ERR_SECTION_KEYS_MISMATCH, http: 422, condition: "Scorecard section keys differ from the script weights keys" }
  - { id: ERR_WEIGHTS_NOT_NORMALIZED, http: 422, condition: "Script weights do not sum to 1.00 at publish, or contain a negative weight" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "Wave field_window_end not strictly after field_window_start" }
  - { id: ERR_DISPUTE_ROUNDS_EXHAUSTED, http: 409, condition: "Counter when round_index has reached MAX_DISPUTE_ROUNDS" }
  - { id: ERR_REVISION_LIMIT_REACHED, http: 409, condition: "request-revision when submission_count exceeds MAX_REVISION_ROUNDS" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "Opening a dispute while one is already non-terminal on the assignment" }
  - { id: ERR_SHOPPER_HAS_OPEN_ASSIGNMENTS, http: 409, condition: "Suspending a shopper whose open_assignment_count > 0" }
  - { id: ERR_SCRIPT_IN_USE, http: 409, condition: "Archiving a script still referenced by a non-terminal assignment" }
  - { id: ERR_WAVE_NOT_DRAINED, http: 409, condition: "Closing a wave with non-terminal assignments" }
  - { id: ERR_REIMBURSEMENT_NOT_ACCRUED, http: 409, condition: "Batching a reimbursement that is not ACCRUED" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, negative value, out-of-range enum, or invalid raw_score" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a client or shopper."
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["POST /clients", "POST /shoppers"]

  - name: PlatformAdmin
    description: "Operator with cross-cutting administrative powers, including the clock and sweeps."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients/{id}/suspend"
      - "POST /shoppers/{id}/suspend"
      - "POST /shoppers/{id}/reinstate"
      - "POST /assignments/{id}/sweep-deadline"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /clients/{id}/locations"
      - "POST /clients/{id}/scripts"
      - "POST /clients/{id}/waves"
      - "POST /assignments"
      - "POST /assignments/{id}/cancel"
      - "read endpoints"

  - name: ClientManager
    description: "Manages a single ClientAccount's locations, scripts, waves, assignments; opens client-side disputes."
    identity: "entity_backed:ClientAccount"
    exclusive_operations:
      - "POST /scripts/{id}/publish"
      - "POST /scripts/{id}/archive"
      - "POST /waves/{id}/publish"
      - "POST /waves/{id}/close"
      - "POST /locations/{id}/retire"
    shared_operations:
      - "POST /clients/{id}/locations"
      - "POST /clients/{id}/scripts"
      - "POST /clients/{id}/waves"
      - "POST /assignments"
      - "POST /assignments/{id}/cancel"
      - "POST /assignments/{id}/disputes"
      - "read endpoints"

  - name: Shopper
    description: "A registered/certified shopper; accepts assignments, uploads evidence, submits, disputes, gets paid."
    identity: "entity_backed:Shopper"
    exclusive_operations:
      - "POST /assignments/{id}/accept"
      - "POST /assignments/{id}/evidence"
      - "POST /assignments/{id}/scorecard"
      - "POST /assignments/{id}/submit"
      - "POST /assignments/{id}/resume"
      - "POST /disputes/{id}/respond"
      - "POST /disputes/{id}/withdraw"
    shared_operations:
      - "POST /assignments/{id}/disputes"
      - "PATCH /shoppers/{id}/tax-profile"
      - "read own shopper/assignment/reimbursement"

  - name: QaValidator
    description: "Quality auditor; certifies shoppers, reviews evidence, scores, validates/rejects/requests-revision, counters disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /shoppers/{id}/certification-attempts"
      - "POST /evidence/{id}/review"
      - "POST /assignments/{id}/scorecard/fraud-check"
      - "POST /assignments/{id}/validate"
      - "POST /assignments/{id}/request-revision"
      - "POST /assignments/{id}/reject"
      - "POST /disputes/{id}/counter"
    shared_operations:
      - "read assignment/evidence/scorecard/dispute"

  - name: FinanceOfficer
    description: "Finance role; batches and pays reimbursements (segregation of duties from the validating QA), resolves disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /payout-batches"
      - "POST /payout-batches/{id}/pay"
      - "POST /payout-batches/{id}/void"
      - "POST /disputes/{id}/resolve"
    shared_operations:
      - "PATCH /shoppers/{id}/tax-profile"
      - "read payout/reimbursement/shopper/dispute"
