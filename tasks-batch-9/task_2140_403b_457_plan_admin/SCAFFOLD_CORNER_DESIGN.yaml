          - validations[priority=16]
        distinguishing_aspect: "A universal-availability plan with no notice at all for its plan year refuses election approval with ERR_UA_NOTICE_MISSING at 422, and recording a valid notice then lets the identical approval through."
        test_recipe:
          setup:
            - "A PUBLIC_SCHOOL employer with an ACTIVE PLAN_403B plan for plan year 2026 and NO universal availability notice."
            - "One participant with one contract, an ELIGIBLE determination by co-1 whose notice_status is MISSING, and a SUBMITTED election for 100000 cents."
