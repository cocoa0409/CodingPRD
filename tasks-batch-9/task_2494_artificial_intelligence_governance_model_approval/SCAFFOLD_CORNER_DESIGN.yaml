            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${uc_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {uc_v2: "$.data.version"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {g_priv: "$.data[0].id", g_biz: "$.data[1].id"}}
          trigger:
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: PrivacyReviewer, as_user_id: "usr_priv_1", captures: {err: "$.data.error_id"}}
          assert:
            - "the trigger addresses the BUSINESS gate captured as g_biz"
            - "HTTP 403 with data.error_id == ERR_GATE_ROLE_MISMATCH"
            - "the response is NOT ERR_UNAUTHORIZED - PrivacyReviewer is a declared role on this endpoint"
            - "the BUSINESS gate is still PENDING at version 1 with assigned_reviewer_user_id null, and the PRIVACY gate is untouched"

      - name: requester_cannot_clear_own_gate_sod
        claim_type: segregation_of_duties
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "validations[p26]", entities.UseCase.fields.requester_user_id]
        distinguishing_aspect: "Identity, not role, is what fails here: the header pair (BusinessReviewer, usr_req_1) satisfies both p2 and p27 but is refused 403 ERR_SEGREGATION_OF_DUTIES because usr_req_1 is the use case's requester_user_id."
        test_recipe:
          setup: ["MINIMAL use case filed by usr_req_1 and classified, with the BUSINESS gate taken up under the header pair (BusinessReviewer, usr_req_1) - roles are self-asserted because every role's identity is opaque."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {g_biz: "$.data[0].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_req_1"}
          trigger:
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "clearing my own intake"}, as: BusinessReviewer, as_user_id: "usr_req_1", captures: {err: "$.data.error_id"}}
          assert:
            - "start-review succeeded: taking up a gate is not restricted by segregation of duties, only clearing it is"
            - "HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "the gate is still IN_REVIEW at version 2 with assigned_reviewer_user_id usr_req_1 and cleared_by_user_id null"
            - "the identical call with as_user_id usr_biz_1 succeeds, which is what isolates the identity from the role"

      - name: clearing_reviewer_cannot_sign_the_approval_sod
        claim_type: segregation_of_duties
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", "validations[p26]", entities.ReviewGate.fields.cleared_by_user_id]
        distinguishing_aspect: "The second limb of p26: a GovernanceOfficer header whose X-User-ID is the same person who cleared a gate on this use case is refused 403 on approve, even though the role is exactly the one the endpoint demands."
        test_recipe:
          setup: ["MIN chain to READY_FOR_APPROVAL where the BUSINESS gate was cleared under the identity usr_gov_2, who then attempts the approval wearing the GovernanceOfficer role."]
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T00:00:00Z"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /model-assets", payload: {provider: "Internal ML Platform", model_name: "helios-mini", model_version: "1.0.0", hosting: "INTERNAL", modality: "TEXT", is_third_party: false}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {asset: "$.data.id"}}
            - {call: "POST /model-assets/{id}/approve-for-use", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "POST /use-cases", payload: {title: "Internal wiki search reranker", business_unit: "IT", description: "reranks internal wiki hits for staff searches", affects_individuals: false, decision_autonomy: "ADVISORY", data_sensitivity: "PUBLIC", individual_impact: "LOW", jurisdictions: [], deployed_headcount_reach: 500}, as: Requester, as_user_id: "usr_req_1", captures: {uc_m: "$.data.id", ucm_v1: "$.data.version"}}
            - {call: "POST /use-cases/{id}/classify", payload: {expected_use_case_version: "${ucm_v1}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v2: "$.data.version"}}
            - {call: "POST /use-cases/{id}/model-bindings", payload: {model_asset_id: "${asset}", expected_use_case_version: "${ucm_v2}"}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {bind: "$.data.id"}}
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_v3: "$.data.version"}}
            - {call: "POST /use-cases/{id}/oversight-designs", payload: {review_mode: "PRE_DECISION_REVIEW", sample_pct: 0, escalation_sla_hours: 24, reviewer_role: "BusinessReviewer", override_capability: true, expected_use_case_version: "${ucm_v3}"}, as: Requester, as_user_id: "usr_req_1", captures: {od: "$.data.id"}}
            - {call: "POST /oversight-designs/{id}/decide", payload: {decision: "APPROVE"}, as: GovernanceOfficer, as_user_id: "usr_gov_1"}
            - {call: "GET /use-cases/{id}/review-gates", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {g_biz: "$.data[0].id"}}
            - {call: "POST /review-gates/{id}/start-review", payload: {}, as: BusinessReviewer, as_user_id: "usr_gov_2"}
            - {call: "POST /review-gates/{id}/clear", payload: {decision_note: "value case accepted"}, as: BusinessReviewer, as_user_id: "usr_gov_2"}
            - {call: "GET /use-cases/{id}", payload: {}, as: GovernanceOfficer, as_user_id: "usr_gov_1", captures: {ucm_ready: "$.data.version"}}
