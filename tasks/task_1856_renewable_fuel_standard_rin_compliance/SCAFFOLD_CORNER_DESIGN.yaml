  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: trader_cannot_run_diligence
        claim_type: role_denial
        grounds: [roles.Trader, roles.ComplianceManager, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Exclusive operation: POST /rfs/vendors/{id}/diligence is ComplianceManager-only; Trader is denied 403."
