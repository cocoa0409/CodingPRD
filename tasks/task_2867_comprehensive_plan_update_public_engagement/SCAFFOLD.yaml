scenario: |
  2867. Comprehensive Plan Update & Public Engagement (city planning department): existing conditions
  analysis with demographic, housing, employment and land use inventories, growth projection scenarios
  and land capacity analysis against projected demand, element drafting across land use, housing,
  transportation, parks and infrastructure with internal consistency requirements, public engagement
  plan with workshops, surveys and equity-focused outreach to underrepresented groups, state mandate
  compliance for required elements and housing allocations, environmental review of the plan and its
  alternatives, planning commission and council adoption hearings with amendment tracking,
  implementation program with zoning code updates and monitoring indicators

domain_name: comprehensive-plan-update
api_prefix: "/planning"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: graph
  # PlanElement forms a directed dependency graph through the ConsistencyLink junction entity
  # (self-referential many-to-many, cycle-forbidden). Everything else hangs off PlanUpdate by FK
  # with cross-aggregate references (GrowthScenario -> InventoryDataset, Amendment -> PlanElement).

  state_machine_shape: cyclic
  # PlanElement: DRAFT -> IN_REVIEW -> REVISION_REQUESTED -> DRAFT (revision loop with round counter).
  # PlanUpdate: DRAFTING -> STATE_SUBMITTED -> STATE_DEFICIENT -> STATE_SUBMITTED (resubmission loop)
  # and COMMISSION_RECOMMENDED -> DRAFTING on council denial.
  # Hearing adds a branching fork (OPEN -> {CONTINUED, RECOMMENDED, ADOPTED_OUT, DENIED}) with a
  # divergent side-effect set per branch. PlanUpdate.compliance_posture is a derived gate over children.

  relationship_patterns:
    - one_to_many          # PlanUpdate -> InventoryDataset / PlanElement / Hearing / ...
    - many_to_many         # ConsistencyLink joins PlanElement to PlanElement
    - self_referential     # ConsistencyLink.source_element_id and .target_element_id both -> PlanElement
    - cross_aggregate      # GrowthScenario -> InventoryDataset, Amendment -> PlanElement across Hearing

  role_model: segregation_of_duties
  # The user who authors an inventory may not certify it; the user who authors an element may not
  # decide its review; the clerk who proposes an amendment may not adopt it.

  consistency_model: immediate

difficulty_level: expert_plus
# 14 entities, 59 endpoints, 85 error codes, 12 calculations (3 with divergent variants),
# 11 state machines, 28 validation rules, 2 OCC rules.
# Density target: every write touches a derived field on PlanUpdate.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================

entities:
  - name: PlanUpdate
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Public title of the comprehensive plan update (e.g. "Horizon 2045").
        constraints: 1-160 chars, non-blank
      - name: jurisdiction_code
        type: string
        source: input
        description: State-assigned jurisdiction identifier used on mandate filings.
        constraints: 2-12 chars, uppercase alphanumeric
      - name: base_year
        type: integer
        source: input
        description: Base year of the existing-conditions analysis; all projections start here.
        constraints: 2000-2100
      - name: horizon_year
        type: integer
        source: input
        description: Statutory planning horizon year; must be > base_year by at least 10.
        constraints: 2000-2100, horizon_year - base_year >= 10
      - name: status
        type: enum
        source: system
        description: Adoption pipeline state of the plan update.
        default: DRAFTING
        constraints: "one of {DRAFTING, STATE_SUBMITTED, STATE_CERTIFIED, STATE_DEFICIENT, COMMISSION_RECOMMENDED, ADOPTED}"
      - name: state_review_status
        type: enum
        source: computed
        description: Mirror of the most recent state mandate determination outcome.
        default: NOT_SUBMITTED
        constraints: "one of {NOT_SUBMITTED, SUBMITTED, CERTIFIED, DEFICIENT}"
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived gate recomputed by calculation compliance_posture after every child mutation; gates hearing operations.
        default: CAPACITY_HOLD
        constraints: "one of {CLEAR, EQUITY_HOLD, CAPACITY_HOLD, CONSISTENCY_HOLD, FROZEN}"
      - name: adopted_scenario_id
        type: string
        source: computed
        description: FK -> GrowthScenario.id; the scenario adopted as the plan's official projection. Null until a scenario is adopted; discoverable via GET /planning/plan-updates?adopted_scenario_id=.
        default: null
      - name: open_consistency_link_count
        type: integer
        source: computed
        description: Count of ConsistencyLink rows in status OPEN or STALE whose source_element_id belongs to this plan.
        default: 0
      - name: required_elements_complete_count
        type: integer
        source: computed
        description: Count of distinct PlanElement.element_type values on this plan whose status is in {APPROVED, ADOPTED}.
        default: 0
      - name: housing_shortfall_total
        type: integer
        source: computed
        description: Sum of HousingAllocation.shortfall_units over all four income tiers of this plan.
        default: 0
      - name: equity_share_pct
        type: number
        source: computed
        description: Plan-wide weighted underrepresented participation share, 1 decimal; see calculation plan_equity_share_pct.
        default: 0.0
      - name: participation_weight_total
        type: number
        source: computed
        description: Conserved quantity - sum of EngagementActivity.total_weighted_count over activities in status COMPLETED.
        default: 0.0
      - name: underrepresented_weight_total
        type: number
        source: computed
        description: Conserved quantity - sum of EngagementActivity.underrepresented_weighted_count over activities in status COMPLETED.
        default: 0.0
      - name: resubmission_count
        type: integer
        source: computed
        description: Number of state submissions after the first one; capped by MAX_RESUBMISSIONS.
        default: 0
      - name: monitoring_on_track_count
        type: integer
        source: computed
        description: Count of ImplementationAction rows on this plan whose on_track is true.
        default: 0
      - name: state_findings
        type: string
        source: computed
        description: Free-text findings recorded by the most recent state determination; null before the first determination.
        default: null
      - name: adopted_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the council adopted the plan; null until adoption.
        default: null

  - name: InventoryDataset
    parent: PlanUpdate
    common_fields: true
    fields:
      - name: plan_update_id
        type: string
        source: input
        description: FK -> PlanUpdate.id; the plan whose existing-conditions analysis this inventory belongs to.
      - name: inventory_type
        type: enum
        source: input
        description: Which existing-conditions inventory this dataset holds.
        constraints: "one of {DEMOGRAPHIC, HOUSING, EMPLOYMENT, LAND_USE}"
      - name: vintage_year
        type: integer
        source: input
        description: Year the underlying data was collected; must be <= PlanUpdate.base_year.
        constraints: 2000-2100
      - name: status
        type: enum
        source: system
        description: Certification lifecycle of the dataset.
        default: DRAFT
        constraints: "one of {DRAFT, CERTIFIED, SUPERSEDED}"
      - name: record_count
        type: integer
        source: input
        description: Number of observations in the dataset; required for DEMOGRAPHIC, HOUSING and EMPLOYMENT inventories.
        default: 0
        constraints: ">= 0"
      - name: vacant_acres
        type: number
        source: input
        description: Vacant developable acres; required when inventory_type == LAND_USE, must be omitted otherwise.
        default: null
        constraints: ">= 0"
      - name: underutilized_acres
        type: number
        source: input
        description: Underutilized (redevelopable) acres; required when inventory_type == LAND_USE.
        default: null
        constraints: ">= 0"
      - name: infrastructure_constrained_acres
        type: number
        source: input
        description: Subset of vacant acres lacking sewer/water capacity; required when inventory_type == LAND_USE and must be <= vacant_acres.
        default: null
        constraints: ">= 0"
      - name: allowed_density_units_per_acre
        type: number
        source: input
        description: Weighted allowed residential density across the inventoried acres; required when inventory_type == LAND_USE.
        default: null
        constraints: "> 0"
      - name: referencing_scenario_count
        type: integer
        source: computed
        description: Number of GrowthScenario rows pinned to this dataset; incremented on scenario creation.
        default: 0
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlanningStaff caller that created the dataset; used by the segregation-of-duties check.
      - name: certified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the PlanningDirector that certified the dataset; null while DRAFT.
        default: null

  - name: GrowthScenario
    parent: PlanUpdate
    common_fields: true
    fields:
      - name: plan_update_id
        type: string
        source: input
        description: FK -> PlanUpdate.id; the plan this projection scenario belongs to.
      - name: land_use_inventory_id
        type: string
        source: input
        description: FK -> InventoryDataset.id; the LAND_USE inventory whose acreage feeds land_capacity_units. Pinned at creation via expected_inventory_version.
      - name: label
        type: string
        source: input
        description: Scenario label shown in the capacity analysis table.
        constraints: 1-80 chars
      - name: method
        type: enum
        source: input
        description: Projection method; selects both the demand driver and the capacity variant.
        constraints: "one of {TREND, POLICY}"
      - name: horizon_year
        type: integer
        source: input
        description: Projection horizon; must equal the parent PlanUpdate.horizon_year.
        constraints: 2000-2100
      - name: base_households
        type: integer
        source: input
        description: Household count in PlanUpdate.base_year taken from the DEMOGRAPHIC inventory.
        constraints: "> 0"
      - name: annual_household_growth_rate
        type: number
        source: input
        description: Compound annual household growth rate as a decimal fraction (0.011 == 1.1%/yr).
        constraints: "0 <= rate <= 0.2"
      - name: job_growth_total
        type: integer
        source: input
        description: Total net new jobs over the horizon taken from the EMPLOYMENT inventory.
        constraints: ">= 0"
      - name: demolition_replacement_units
        type: integer
        source: input
        description: Units that must be rebuilt to replace expected demolitions over the horizon.
        constraints: ">= 0"
      - name: capacity_variant
        type: enum
        source: computed
        description: Which land-capacity variant was applied; GROSS_CAPACITY when method == TREND, NET_CAPACITY when method == POLICY.
        constraints: "one of {GROSS_CAPACITY, NET_CAPACITY}"
      - name: land_capacity_units
        type: integer
        source: computed
        description: Housing-unit capacity of the inventoried land under the selected variant; see calculation land_capacity_units.
      - name: projected_demand_units
        type: integer
        source: computed
        description: Housing-unit demand at the horizon; see calculation projected_demand_units.
      - name: capacity_gap_units
        type: integer
        source: computed
        description: max(projected_demand_units - land_capacity_units, 0); informational, does not gate submission.
      - name: status
        type: enum
        source: system
        description: Adoption state of the scenario within its plan.
        default: DRAFT
        constraints: "one of {DRAFT, ADOPTED, SUPERSEDED}"

  - name: HousingAllocation
    parent: PlanUpdate
    common_fields: true
    fields:
      - name: plan_update_id
        type: string
        source: input
        description: FK -> PlanUpdate.id; the plan receiving this state housing allocation row.
      - name: income_tier
        type: enum
        source: input
        description: Income tier of the state-assigned allocation; unique per plan.
        constraints: "one of {VERY_LOW, LOW, MODERATE, ABOVE_MODERATE}"
      - name: assigned_units
        type: integer
        source: input
        description: Units the state assigned to this tier for the cycle.
        constraints: ">= 0"
      - name: cycle_deadline
        type: datetime
        source: input
        description: ISO 8601 UTC instant by which the plan must accommodate the allocation.
      - name: tier_capacity_units
        type: integer
        source: computed
        description: This tier's rounded share of the adopted scenario's land_capacity_units; see calculation housing_allocation_waterfall.
        default: 0
      - name: carryover_in_units
        type: integer
        source: computed
        description: Unused capacity handed down from earlier tiers in the waterfall order.
        default: 0
      - name: accommodated_units
        type: integer
        source: computed
        description: Units of this tier the plan can accommodate; min(assigned_units, tier_capacity_units + carryover_in_units).
        default: 0
      - name: shortfall_units
        type: integer
        source: computed
        description: assigned_units - accommodated_units; summed into PlanUpdate.housing_shortfall_total.
        default: 0

  - name: PlanElement
    parent: PlanUpdate
    common_fields: true
    fields:
      - name: plan_update_id
        type: string
        source: input
        description: FK -> PlanUpdate.id; the plan this element belongs to.
      - name: element_type
        type: enum
        source: input
        description: Which statutory element this row drafts; unique per plan.
        constraints: "one of {LAND_USE, HOUSING, TRANSPORTATION, PARKS, INFRASTRUCTURE}"
      - name: title
        type: string
        source: input
        description: Element chapter title as it appears in the published plan.
        constraints: 1-160 chars
      - name: draft_body
        type: string
        source: input
        description: Narrative text of the current draft; replaced by PATCH while in DRAFT.
        constraints: 1-20000 chars
      - name: policy_count
        type: integer
        source: input
        description: Number of numbered policies in the element; mutated by adopted amendments via policy_delta.
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Drafting/review lifecycle of the element.
        default: DRAFT
        constraints: "one of {DRAFT, IN_REVIEW, REVISION_REQUESTED, APPROVED, ADOPTED, ESCALATED}"
      - name: consistency_status
        type: enum
        source: computed
        description: Internal-consistency standing of the element derived from its ConsistencyLink rows.
        default: PENDING
        constraints: "one of {PENDING, CLEARED, STALE}"
      - name: revision_round
        type: integer
        source: computed
        description: Number of REQUEST_REVISION decisions this element has received; drives escalation at MAX_REVISION_ROUNDS.
        default: 0
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the PlanningStaff caller that created the element; used by the segregation-of-duties check on review.
      - name: reviewed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the PlanningDirector that recorded the most recent review decision; null before first review.
        default: null

  - name: ConsistencyLink
    parent: PlanElement
    common_fields: true
    fields:
      - name: source_element_id
        type: string
        source: input
        description: FK -> PlanElement.id; the dependent element whose policies rely on the target.
      - name: target_element_id
        type: string
        source: input
        description: FK -> PlanElement.id; the element depended upon. Must differ from source_element_id and belong to the same plan.
      - name: dependency_type
        type: enum
        source: input
        description: Nature of the internal-consistency dependency asserted by this link.
        constraints: "one of {POLICY_ALIGNMENT, CAPACITY_ASSUMPTION, FUNDING_ASSUMPTION, LEVEL_OF_SERVICE}"
      - name: status
        type: enum
        source: system
        description: Reconciliation state of the link; OPEN and STALE both count against PlanUpdate.open_consistency_link_count.
        default: OPEN
        constraints: "one of {OPEN, CLEARED, STALE}"
      - name: reconciliation_note
        type: string
        source: input
        description: Note recorded by the reconcile action explaining how the two elements were aligned; null while OPEN.
        default: null
      - name: reconciled_by_user_id
        type: string
        source: computed
        description: X-User-ID of the PlanningDirector that reconciled the link; null while OPEN or STALE.
        default: null
      - name: staled_by_amendment_id
        type: string
        source: computed
        description: Id of the Amendment whose adoption flipped this link CLEARED -> STALE; cleared back to null when that amendment is rescinded. Resolves to Amendment.id.
        default: null

  - name: Venue
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: Public name of the meeting facility.
        constraints: 1-120 chars
      - name: seated_capacity
        type: integer
        source: input
        description: Maximum seated attendance the room supports.
        constraints: "> 0"
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: Minutes of setup/teardown required on both sides of every booking; participates in the venue overlap test.
        default: 0
        constraints: "0 <= value <= 240"
      - name: ada_accessible
        type: boolean
        source: input
        description: Whether the facility is step-free and ADA compliant.
        default: true
      - name: transit_served
        type: boolean
        source: input
        description: Whether the facility is within 400 m of a transit stop; required for TARGETED_OUTREACH activities.
        default: false

  - name: EngagementActivity
    parent: PlanUpdate
    common_fields: true
    fields:
      - name: plan_update_id
        type: string
        source: input
        description: FK -> PlanUpdate.id; the plan whose engagement plan contains this activity.
      - name: venue_id
        type: string
        source: input
        description: FK -> Venue.id; the booked facility. Required for WORKSHOP and TARGETED_OUTREACH, must be omitted for SURVEY.
        default: null
      - name: activity_type
        type: enum
        source: input
        description: Kind of engagement activity; selects the participation weighting variant.
        constraints: "one of {WORKSHOP, SURVEY, TARGETED_OUTREACH}"
      - name: title
        type: string
        source: input
        description: Public title of the workshop, survey or outreach session.
        constraints: 1-160 chars
      - name: start_at
        type: datetime
        source: input
        description: ISO 8601 UTC start instant of the activity window.
      - name: end_at
        type: datetime
        source: input
        description: ISO 8601 UTC end instant; must be strictly after start_at.
      - name: interpretation_offered
        type: boolean
        source: input
        description: Whether live interpretation was offered at the activity.
        default: false
      - name: status
        type: enum
        source: system
        description: Lifecycle of the activity; only COMPLETED activities feed plan-level equity aggregates.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"
      - name: record_count
        type: integer
        source: computed
        description: Number of ParticipationRecord rows attached to this activity.
        default: 0
      - name: underrepresented_record_count
        type: integer
        source: computed
        description: Number of attached ParticipationRecord rows whose is_underrepresented is true.
        default: 0
      - name: weighting_variant
        type: enum
        source: computed
        description: Which equity weighting variant applies; STANDARD for WORKSHOP and SURVEY, OUTREACH_WEIGHTED for TARGETED_OUTREACH.
        constraints: "one of {STANDARD, OUTREACH_WEIGHTED}"
      - name: total_weighted_count
        type: number
        source: computed
        description: Sum of ParticipationRecord.weight over all attached records; 0.0 until the first record.
        default: 0.0
      - name: underrepresented_weighted_count
        type: number
        source: computed
        description: Sum of ParticipationRecord.weight over attached records whose is_underrepresented is true.
        default: 0.0
      - name: equity_share_pct
        type: number
        source: computed
        description: Activity-level underrepresented share in percent, 1 decimal; see calculation activity_equity_share_pct.
        default: 0.0

  - name: ParticipationRecord
    parent: EngagementActivity
    common_fields: false
    fields:
      - name: activity_id
        type: string
        source: input
        description: FK -> EngagementActivity.id; the activity at which this participation was captured.
      - name: respondent_ref
        type: string
        source: input
        description: Pseudonymous stable respondent handle; unique per activity_id.
        constraints: 1-64 chars
      - name: demographic_group
        type: enum
        source: input
        description: Self-reported demographic group of the respondent.
        constraints: "one of {GENERAL, LOW_INCOME, LIMITED_ENGLISH, YOUTH, SENIOR, DISABILITY, RENTER}"
      - name: interpreter_used
        type: boolean
        source: input
        description: Whether the respondent used an interpreter; doubles the record weight under OUTREACH_WEIGHTED.
        default: false
      - name: census_tract
        type: string
        source: input
        description: Census tract of the respondent's residence, used for geographic equity reporting.
        constraints: 4-12 chars
      - name: comment_text
        type: string
        source: input
        description: Optional verbatim comment submitted by the respondent.
        default: null
      - name: is_underrepresented
        type: boolean
        source: computed
        description: True when demographic_group is in UNDERREPRESENTED_GROUPS; input value ignored.
      - name: weight
        type: number
        source: computed
        description: Equity weight of this record under the parent activity's weighting_variant; see calculation participation_record_weight.

  - name: EnvironmentalReview
    parent: PlanUpdate
    common_fields: true
    fields:
      - name: plan_update_id
        type: string
        source: input
        description: FK -> PlanUpdate.id; the plan under environmental review.
      - name: document_type
        type: enum
        source: input
        description: Environmental document class; selects the statutory comment-period length.
        constraints: "one of {EIR, NEGATIVE_DECLARATION}"
      - name: title
        type: string
        source: input
        description: Title of the environmental document.
        constraints: 1-160 chars
      - name: status
        type: enum
        source: system
        description: Review lifecycle; only CERTIFIED unblocks a commission recommendation.
        default: DRAFT
        constraints: "one of {DRAFT, CIRCULATED, CERTIFIED, SUPERSEDED}"
      - name: comment_period_days
        type: integer
        source: computed
        description: EIR_COMMENT_PERIOD_DAYS for EIR, ND_COMMENT_PERIOD_DAYS for NEGATIVE_DECLARATION; stamped at circulation.
        default: null
      - name: circulated_at
        type: datetime
        source: computed
        description: Logical-clock instant at which the document entered public circulation.
        default: null
      - name: comment_period_ends_at
        type: datetime
        source: computed
        description: circulated_at + comment_period_days; certification is blocked until the clock reaches this instant.
        default: null
      - name: preferred_alternative_id
        type: string
        source: computed
        description: FK -> PlanAlternative.id; the alternative selected by the preferred-alternative selector. Null until selection; discoverable via GET /planning/environmental-reviews?preferred_alternative_id=.
        default: null
      - name: alternative_count
        type: integer
        source: computed
        description: Number of PlanAlternative rows attached to this review.
        default: 0
      - name: certified_at
        type: datetime
        source: computed
        description: Logical-clock instant of certification; null until CERTIFIED.
        default: null

  - name: PlanAlternative
    parent: EnvironmentalReview
    common_fields: true
    fields:
      - name: environmental_review_id
        type: string
        source: input
        description: FK -> EnvironmentalReview.id; the review this alternative is evaluated under.
      - name: label
        type: string
        source: input
        description: Alternative label (e.g. "Transit-Focused Growth").
        constraints: 1-80 chars
      - name: traffic_vmt_index
        type: number
        source: input
        description: Vehicle-miles-travelled impact index, 0-100 where higher is worse.
        constraints: "0 <= value <= 100"
      - name: ghg_index
        type: number
        source: input
        description: Greenhouse-gas impact index, 0-100 where higher is worse.
        constraints: "0 <= value <= 100"
      - name: habitat_index
        type: number
        source: input
        description: Habitat/biological impact index, 0-100 where higher is worse.
        constraints: "0 <= value <= 100"
      - name: water_index
        type: number
        source: input
        description: Water supply and quality impact index, 0-100 where higher is worse.
        constraints: "0 <= value <= 100"
      - name: raw_impact_score
        type: number
        source: computed
        description: Weighted impact score before mitigation credit, 2 decimals; see calculation alternative_net_impact_score.
      - name: mitigation_credit
        type: number
        source: computed
        description: Credit granted by the mitigation tier keyed on raw_impact_score, 2 decimals.
      - name: net_impact_score
        type: number
        source: computed
        description: raw_impact_score - mitigation_credit, 2 decimals; the ranking key of the preferred-alternative selector.
      - name: status
        type: enum
        source: system
        description: Selection standing of the alternative within its review.
        default: EVALUATED
        constraints: "one of {EVALUATED, PREFERRED, SUPERSEDED}"

  - name: Hearing
    parent: PlanUpdate
    common_fields: true
    fields:
      - name: plan_update_id
        type: string
        source: input
        description: FK -> PlanUpdate.id; the plan on the hearing agenda.
      - name: body_type
        type: enum
        source: input
        description: Which deliberative body holds the hearing.
        constraints: "one of {COMMISSION, COUNCIL}"
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO 8601 UTC scheduled gavel-in instant.
      - name: scheduled_end
        type: datetime
        source: input
        description: ISO 8601 UTC scheduled adjournment instant; must be strictly after scheduled_start.
      - name: notice_published_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the public notice was published; must precede scheduled_start by at least HEARING_NOTICE_DAYS.
      - name: status
        type: enum
        source: system
        description: Hearing lifecycle; BLOCKED is applied by cascade when the plan posture leaves CLEAR.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, BLOCKED, OPEN, CONTINUED, RECOMMENDED, ADOPTED_OUT, DENIED}"
      - name: outcome
        type: enum
        source: computed
        description: Recorded outcome of the hearing; null until an outcome is recorded.
        default: null
        constraints: "one of {CONTINUE, RECOMMEND, ADOPT, DENY}"
      - name: amendment_count
        type: integer
        source: computed
        description: Number of Amendment rows proposed at this hearing.
        default: 0
      - name: adopted_amendment_count
        type: integer
        source: computed
        description: Number of Amendment rows proposed at this hearing whose status is ADOPTED.
        default: 0
      - name: opened_at
        type: datetime
        source: computed
        description: Logical-clock instant the hearing was gavelled in; null while SCHEDULED or BLOCKED.
        default: null
      - name: closed_at
        type: datetime
        source: computed
        description: Logical-clock instant the outcome was recorded; null until an outcome exists.
        default: null

  - name: Amendment
    parent: Hearing
    common_fields: true
    fields:
      - name: hearing_id
        type: string
        source: input
        description: FK -> Hearing.id; the hearing at which the amendment was moved.
      - name: target_element_id
        type: string
        source: input
        description: FK -> PlanElement.id; the element the amendment modifies. Must belong to the hearing's plan.
      - name: summary
        type: string
        source: input
        description: One-paragraph summary of the amendment as moved.
        constraints: 1-2000 chars
      - name: policy_delta
        type: integer
        source: input
        description: Signed change to PlanElement.policy_count applied on adoption; may be negative but must not drive policy_count below 0.
        constraints: "-50 <= value <= 50"
      - name: status
        type: enum
        source: system
        description: Amendment tracking state.
        default: PROPOSED
        constraints: "one of {PROPOSED, ADOPTED, WITHDRAWN, RESCINDED}"
      - name: element_version_at_proposal
        type: integer
        source: computed
        description: PlanElement.version observed when the amendment was recorded, taken from the OCC input expected_element_version.
      - name: applied_policy_count
        type: integer
        source: computed
        description: PlanElement.policy_count immediately after adoption; null until ADOPTED.
        default: null
      - name: prior_element_status
        type: enum
        source: computed
        description: PlanElement.status captured immediately before adoption so a rescind can restore it exactly.
        default: null
        constraints: "one of {DRAFT, IN_REVIEW, REVISION_REQUESTED, APPROVED, ADOPTED, ESCALATED}"
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CommissionClerk that moved the amendment; used by the adoption segregation-of-duties check.

  - name: ImplementationAction
    parent: PlanUpdate
    common_fields: true
    fields:
      - name: plan_update_id
        type: string
        source: input
        description: FK -> PlanUpdate.id; the plan whose implementation program contains this action.
      - name: source_element_id
        type: string
        source: input
        description: FK -> PlanElement.id; the element whose policy this action implements. Must belong to the same plan.
      - name: action_type
        type: enum
        source: input
        description: Kind of implementation action.
        constraints: "one of {ZONING_CODE_UPDATE, CAPITAL_PROJECT, PROGRAM, MONITORING}"
      - name: title
        type: string
        source: input
        description: Action title as printed in the implementation program table.
        constraints: 1-160 chars
      - name: indicator_name
        type: string
        source: input
        description: Name of the monitoring indicator tracked for this action.
        constraints: 1-80 chars
      - name: indicator_direction
        type: enum
        source: input
        description: Whether the indicator should rise or fall to count as on track.
        constraints: "one of {INCREASE, DECREASE}"
      - name: baseline_value
        type: number
        source: input
        description: Indicator value in PlanUpdate.base_year.
      - name: target_value
        type: number
        source: input
        description: Indicator value the action targets by the horizon year.
      - name: latest_reading_value
        type: number
        source: computed
        description: Most recent recorded indicator reading; null until the first reading.
        default: null
      - name: latest_reading_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent reading; null until the first reading.
        default: null
      - name: reading_count
        type: integer
        source: computed
        description: Number of readings recorded against this action.
        default: 0
      - name: on_track
        type: boolean
        source: computed
        description: Whether latest_reading_value has met the target under indicator_direction; see calculation indicator_on_track.
        default: false
      - name: status
        type: enum
        source: system
        description: Programme state; SCHEDULED is applied by cascade at plan adoption, COMPLETED by the complete action.
        default: PENDING
        constraints: "one of {PENDING, SCHEDULED, COMPLETED}"
      - name: due_at
        type: datetime
        source: computed
        description: PlanUpdate.adopted_at + IMPLEMENTATION_DUE_DAYS, stamped when the plan is adopted; null while PENDING.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================

state_machines:
  - entity: PlanUpdate
    initial_state: DRAFTING
    terminal_states: [ADOPTED]
    transitions:
      - from: null
        to: DRAFTING
        trigger: "POST /planning/plan-updates"
        actor: PlanningDirector
        preconditions:
          - "horizon_year - base_year >= 10"
        side_effects:
          - "compliance_posture computed by calculation compliance_posture; with adopted_scenario_id NULL the result is CAPACITY_HOLD"
          - "state_review_status set to NOT_SUBMITTED; all derived counters set to 0 and equity_share_pct to 0.0"
        note: "Only PlanningDirector may open a plan cycle."

      - from: DRAFTING
        to: STATE_SUBMITTED
        trigger: "POST /planning/plan-updates/{id}/state-submission"
        actor: PlanningDirector
        preconditions:
          - "status == DRAFTING"
          - "required_elements_complete_count == 5 (one PlanElement per REQUIRED_ELEMENT_TYPES with status IN {APPROVED, ADOPTED}) else ERR_REQUIRED_ELEMENT_MISSING"
          - "open_consistency_link_count == 0 else ERR_CONSISTENCY_UNRESOLVED"
          - "a HousingAllocation row exists for each of the four TIER_ORDER tiers else ERR_ALLOCATION_INCOMPLETE"
          - "housing_shortfall_total == 0 else ERR_HOUSING_SHORTFALL"
          - "equity_share_pct >= EQUITY_MIN_SHARE_PCT else ERR_EQUITY_TARGET_NOT_MET"
          - "at least one EnvironmentalReview of this plan has status IN {CIRCULATED, CERTIFIED} else ERR_ENVIRONMENTAL_REVIEW_MISSING"
        side_effects:
          - "state_review_status := SUBMITTED"
          - "state_findings := null"
          - "compliance_posture recomputed by calculation compliance_posture"
          - "version incremented by 1"

      - from: STATE_SUBMITTED
        to: STATE_CERTIFIED
        trigger: "POST /planning/plan-updates/{id}/state-determination with determination == CERTIFIED"
        actor: StateReviewer
        preconditions:
          - "status == STATE_SUBMITTED else ERR_PLAN_NOT_SUBMITTED"
        side_effects:
          - "state_review_status := CERTIFIED; state_findings := request findings"
          - "compliance_posture recomputed (FROZEN can no longer apply since state_review_status != DEFICIENT)"
          - "every Hearing of this plan with status == BLOCKED returns to SCHEDULED when the recomputed posture is CLEAR"
          - "version incremented by 1"

      - from: STATE_SUBMITTED
        to: STATE_DEFICIENT
        trigger: "POST /planning/plan-updates/{id}/state-determination with determination == DEFICIENT"
        actor: StateReviewer
        preconditions:
          - "status == STATE_SUBMITTED else ERR_PLAN_NOT_SUBMITTED"
          - "deficient_element_types is a non-empty subset of REQUIRED_ELEMENT_TYPES else ERR_INVALID_REQUEST"
        side_effects:
          - "CASCADE LINK 1: state_review_status := DEFICIENT and state_findings := request findings"
          - "CASCADE LINK 2 (caused by link 1): every PlanElement of this plan whose element_type is in deficient_element_types and whose status == APPROVED moves APPROVED -> REVISION_REQUESTED, revision_round += 1, consistency_status := STALE"
          - "CASCADE LINK 3 (caused by link 2): every ConsistencyLink whose target_element_id is one of those demoted elements and whose status == CLEARED moves CLEARED -> OPEN, and each such link's source element consistency_status := STALE"
          - "CASCADE LINK 4 (caused by link 3): open_consistency_link_count and required_elements_complete_count recomputed, then compliance_posture recomputed -> FROZEN (rule 1 of calculation compliance_posture dominates)"
          - "CASCADE LINK 5 (caused by link 4): every Hearing of this plan with status == SCHEDULED moves SCHEDULED -> BLOCKED"
          - "version incremented by 1"
        note: "Rule-4 cascade of depth 5 originating from the state determination trigger."

      - from: STATE_DEFICIENT
        to: STATE_SUBMITTED
        trigger: "POST /planning/plan-updates/{id}/state-submission"
        actor: PlanningDirector
        preconditions:
          - "status == STATE_DEFICIENT"
          - "resubmission_count < MAX_RESUBMISSIONS else ERR_RESUBMISSION_LIMIT_EXCEEDED"
          - "all DRAFTING -> STATE_SUBMITTED preconditions hold again"
        side_effects:
          - "resubmission_count += 1"
          - "state_review_status := SUBMITTED"
          - "compliance_posture recomputed (FROZEN lifts because state_review_status is no longer DEFICIENT)"
          - "every Hearing with status == BLOCKED returns to SCHEDULED when the recomputed posture is CLEAR"
          - "version incremented by 1"
        note: "Resubmission loop - the cycle that makes this machine non-linear."

      - from: STATE_CERTIFIED
        to: COMMISSION_RECOMMENDED
        trigger: "POST /planning/hearings/{id}/outcome with outcome == RECOMMEND on a COMMISSION hearing (system side effect)"
        actor: system
        preconditions:
          - "status == STATE_CERTIFIED"
          - "compliance_posture == CLEAR"
        side_effects:
          - "status := COMMISSION_RECOMMENDED"
          - "version incremented by 1"

      - from: COMMISSION_RECOMMENDED
        to: ADOPTED
        trigger: "POST /planning/hearings/{id}/outcome with outcome == ADOPT on a COUNCIL hearing (system side effect)"
        actor: system
        preconditions:
          - "status == COMMISSION_RECOMMENDED"
          - "compliance_posture == CLEAR"
        side_effects:
          - "adopted_at := logical clock instant"
          - "every PlanElement of this plan with status == APPROVED moves APPROVED -> ADOPTED"
          - "every ImplementationAction of this plan with status == PENDING moves PENDING -> SCHEDULED and due_at := adopted_at + IMPLEMENTATION_DUE_DAYS days"
          - "version incremented by 1"

      - from: COMMISSION_RECOMMENDED
        to: DRAFTING
        trigger: "POST /planning/hearings/{id}/outcome with outcome == DENY on a COUNCIL hearing (system side effect)"
        actor: system
        preconditions:
          - "status == COMMISSION_RECOMMENDED"
        side_effects:
          - "state_review_status := NOT_SUBMITTED"
          - "every PlanElement with status == APPROVED moves APPROVED -> REVISION_REQUESTED with revision_round += 1"
          - "every ConsistencyLink whose source or target element was demoted and whose status == CLEARED moves CLEARED -> OPEN"
          - "open_consistency_link_count and required_elements_complete_count recomputed; compliance_posture recomputed -> CONSISTENCY_HOLD"
          - "every remaining Hearing with status == SCHEDULED moves SCHEDULED -> BLOCKED"
          - "version incremented by 1"
        note: "Second cycle back to DRAFTING; the plan must be re-submitted to the state."

  - entity: InventoryDataset
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /planning/inventory-datasets"
        actor: PlanningStaff
        preconditions:
          - "parent PlanUpdate exists and status != ADOPTED else ERR_PLAN_ALREADY_ADOPTED"
          - "vintage_year <= PlanUpdate.base_year else ERR_INVENTORY_VINTAGE_TOO_LATE"
          - "when inventory_type == LAND_USE: vacant_acres, underutilized_acres, infrastructure_constrained_acres and allowed_density_units_per_acre are all present and infrastructure_constrained_acres <= vacant_acres else ERR_INVALID_REQUEST"
          - "when inventory_type != LAND_USE: record_count >= 1 and none of the four acreage fields are present else ERR_INVALID_REQUEST"
        side_effects:
          - "authored_by_user_id := X-User-ID of the caller"
          - "status := DRAFT; referencing_scenario_count := 0"

      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /planning/inventory-datasets/{id}/certify"
        actor: PlanningDirector
        preconditions:
          - "status == DRAFT else ERR_INVENTORY_NOT_DRAFT"
          - "X-User-ID != authored_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "no GrowthScenario with status == ADOPTED is pinned to the currently CERTIFIED dataset of the same plan and inventory_type else ERR_ADOPTED_SCENARIO_PINNED"
        side_effects:
          - "certified_by_user_id := X-User-ID; status := CERTIFIED"
          - "any sibling InventoryDataset of the same plan_update_id and inventory_type with status == CERTIFIED moves CERTIFIED -> SUPERSEDED"
          - "version incremented by 1"

      - from: CERTIFIED
        to: SUPERSEDED
        trigger: "certification of a sibling InventoryDataset of the same plan_update_id and inventory_type (system)"
        actor: system
        preconditions:
          - "status == CERTIFIED"
        side_effects:
          - "every GrowthScenario with status == DRAFT whose land_use_inventory_id references this dataset moves DRAFT -> SUPERSEDED (caused by this dataset being superseded)"
          - "version incremented by 1"

  - entity: GrowthScenario
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /planning/growth-scenarios"
        actor: PlanningStaff
        preconditions:
          - "parent PlanUpdate exists and status != ADOPTED else ERR_PLAN_ALREADY_ADOPTED"
          - "land_use_inventory_id resolves to an InventoryDataset of the same plan with inventory_type == LAND_USE else ERR_INVENTORY_TYPE_MISMATCH"
          - "that InventoryDataset.status == CERTIFIED else ERR_INVENTORY_NOT_CERTIFIED"
          - "expected_inventory_version == InventoryDataset.version else ERR_STALE_INVENTORY_VERSION (412)"
          - "horizon_year == PlanUpdate.horizon_year else ERR_HORIZON_YEAR_MISMATCH"
        side_effects:
          - "capacity_variant := GROSS_CAPACITY when method == TREND, NET_CAPACITY when method == POLICY"
          - "land_capacity_units computed by calculation land_capacity_units"
          - "projected_demand_units computed by calculation projected_demand_units"
          - "capacity_gap_units := max(projected_demand_units - land_capacity_units, 0)"
          - "InventoryDataset.referencing_scenario_count += 1 and InventoryDataset.version incremented by 1"

      - from: DRAFT
        to: ADOPTED
        trigger: "POST /planning/growth-scenarios/{id}/adopt"
        actor: PlanningDirector
        preconditions:
          - "status == DRAFT else ERR_SCENARIO_NOT_DRAFT"
          - "the parent plan has a CERTIFIED InventoryDataset for each of DEMOGRAPHIC, HOUSING, EMPLOYMENT and LAND_USE else ERR_INVENTORY_SET_INCOMPLETE"
          - "PlanUpdate.status != ADOPTED else ERR_PLAN_ALREADY_ADOPTED"
        side_effects:
          - "any other GrowthScenario of this plan with status == ADOPTED moves ADOPTED -> SUPERSEDED"
          - "PlanUpdate.adopted_scenario_id := this scenario id"
          - "all four HousingAllocation rows of the plan are recomputed by calculation housing_allocation_waterfall (tier_capacity_units, carryover_in_units, accommodated_units, shortfall_units)"
          - "PlanUpdate.housing_shortfall_total := sum of HousingAllocation.shortfall_units"
          - "PlanUpdate.compliance_posture recomputed by calculation compliance_posture"
          - "PlanUpdate.version incremented by 1; this scenario's version incremented by 1"

      - from: DRAFT
        to: SUPERSEDED
        trigger: "supersession of the pinned LAND_USE InventoryDataset (system)"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "version incremented by 1"

      - from: ADOPTED
        to: SUPERSEDED
        trigger: "adoption of another GrowthScenario on the same plan (system)"
        actor: system
        preconditions:
          - "status == ADOPTED"
        side_effects:
          - "version incremented by 1"

  - entity: PlanElement
    initial_state: DRAFT
    terminal_states: [ADOPTED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /planning/plan-elements"
        actor: PlanningStaff
        preconditions:
          - "parent PlanUpdate exists and status IN {DRAFTING, STATE_DEFICIENT} else ERR_PLAN_NOT_DRAFTING"
          - "no other PlanElement of this plan has the same element_type else ERR_DUPLICATE_ELEMENT_TYPE"
        side_effects:
          - "authored_by_user_id := X-User-ID; status := DRAFT; consistency_status := PENDING; revision_round := 0"

      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "PATCH /planning/plan-elements/{id}"
        actor: PlanningStaff
        preconditions:
          - "status IN {DRAFT, REVISION_REQUESTED, ESCALATED}; from ESCALATED the acting role must be PlanningDirector else ERR_ESCALATION_OVERRIDE_REQUIRED"
        side_effects:
          - "draft_body and/or policy_count replaced with the request values"
          - "version incremented by 1"
        note: "Revision loop edge. A PATCH while already DRAFT is a self-loop that only updates content."

      - from: ESCALATED
        to: DRAFT
        trigger: "PATCH /planning/plan-elements/{id} as PlanningDirector"
        actor: PlanningDirector
        preconditions:
          - "status == ESCALATED"
          - "acting role == PlanningDirector else ERR_ESCALATION_OVERRIDE_REQUIRED"
        side_effects:
          - "revision_round := 0 (director override resets the escalation counter)"
          - "version incremented by 1"

      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /planning/plan-elements/{id}/submit-review"
        actor: PlanningStaff
        preconditions:
          - "status == DRAFT else ERR_ELEMENT_NOT_DRAFT"
          - "policy_count >= 1 else ERR_ELEMENT_HAS_NO_POLICIES"
        side_effects:
          - "version incremented by 1"

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /planning/plan-elements/{id}/review-decision with decision == APPROVE"
        actor: PlanningDirector
        preconditions:
          - "status == IN_REVIEW else ERR_ELEMENT_NOT_IN_REVIEW"
          - "X-User-ID != authored_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "every ConsistencyLink whose source_element_id == this element has status == CLEARED else ERR_CONSISTENCY_UNRESOLVED"
          - "when element_type == HOUSING: PlanUpdate.adopted_scenario_id IS NOT NULL and that GrowthScenario.status == ADOPTED else ERR_SCENARIO_NOT_ADOPTED"
        side_effects:
          - "reviewed_by_user_id := X-User-ID; consistency_status := CLEARED"
          - "PlanUpdate.required_elements_complete_count recomputed; PlanUpdate.compliance_posture recomputed; PlanUpdate.version incremented by 1"
          - "version incremented by 1"

      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /planning/plan-elements/{id}/review-decision with decision == REQUEST_REVISION and revision_round + 1 < MAX_REVISION_ROUNDS"
        actor: PlanningDirector
        preconditions:
          - "status == IN_REVIEW else ERR_ELEMENT_NOT_IN_REVIEW"
          - "X-User-ID != authored_by_user_id else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "revision_round += 1; reviewed_by_user_id := X-User-ID"
          - "version incremented by 1"

      - from: IN_REVIEW
        to: ESCALATED
        trigger: "POST /planning/plan-elements/{id}/review-decision with decision == REQUEST_REVISION and revision_round + 1 == MAX_REVISION_ROUNDS"
        actor: PlanningDirector
        preconditions:
          - "status == IN_REVIEW"
          - "X-User-ID != authored_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "revision_round == MAX_REVISION_ROUNDS - 1 (exact boundary; the third REQUEST_REVISION escalates instead of looping)"
        side_effects:
          - "revision_round := MAX_REVISION_ROUNDS; reviewed_by_user_id := X-User-ID"
          - "version incremented by 1"

      - from: APPROVED
        to: REVISION_REQUESTED
        trigger: "state DEFICIENT determination naming this element_type, or COUNCIL hearing outcome DENY (system)"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "revision_round += 1; consistency_status := STALE"
          - "version incremented by 1"

      - from: APPROVED
        to: ADOPTED
        trigger: "COUNCIL hearing outcome ADOPT on the parent plan (system)"
        actor: system
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "version incremented by 1"

  - entity: ConsistencyLink
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /planning/consistency-links"
        actor: PlanningStaff
        preconditions:
          - "both elements exist else ERR_ELEMENT_NOT_FOUND"
          - "source_element_id != target_element_id else ERR_SELF_CONSISTENCY_LINK"
          - "both elements share the same plan_update_id else ERR_CROSS_PLAN_LINK"
          - "that plan's status != ADOPTED else ERR_PLAN_ALREADY_ADOPTED"
          - "no existing ConsistencyLink has the same (source_element_id, target_element_id) pair else ERR_DUPLICATE_CONSISTENCY_LINK"
          - "adding the edge source -> target must not create a directed cycle over links whose status IN {OPEN, CLEARED, STALE} else ERR_CONSISTENCY_CYCLE"
        side_effects:
          - "status := OPEN"
          - "source PlanElement.consistency_status := PENDING when it was CLEARED"
          - "PlanUpdate.open_consistency_link_count += 1; PlanUpdate.compliance_posture recomputed -> CONSISTENCY_HOLD; PlanUpdate.version incremented by 1"

      - from: OPEN
        to: CLEARED
        trigger: "POST /planning/consistency-links/{id}/reconcile"
        actor: PlanningDirector
        preconditions:
          - "status IN {OPEN, STALE} else ERR_LINK_ALREADY_CLEARED"
          - "target PlanElement.status IN {IN_REVIEW, APPROVED, ADOPTED} else ERR_TARGET_ELEMENT_NOT_REVIEWABLE"
        side_effects:
          - "reconciliation_note := request note; reconciled_by_user_id := X-User-ID; staled_by_amendment_id := null"
          - "source PlanElement.consistency_status := CLEARED when every link with that source is now CLEARED, otherwise unchanged"
          - "PlanUpdate.open_consistency_link_count recomputed; PlanUpdate.compliance_posture recomputed; every Hearing with status == BLOCKED returns to SCHEDULED when the recomputed posture is CLEAR"
          - "PlanUpdate.version incremented by 1"

      - from: STALE
        to: CLEARED
        trigger: "POST /planning/consistency-links/{id}/reconcile"
        actor: PlanningDirector
        preconditions:
          - "status == STALE"
          - "target PlanElement.status IN {IN_REVIEW, APPROVED, ADOPTED} else ERR_TARGET_ELEMENT_NOT_REVIEWABLE"
        side_effects:
          - "same side effects as the OPEN -> CLEARED edge"
        note: "CLEARED -> STALE -> CLEARED is the cycle that makes this machine non-linear."

      - from: CLEARED
        to: STALE
        trigger: "adoption of an Amendment whose target_element_id equals this link's target_element_id (system)"
        actor: system
        preconditions:
          - "status == CLEARED"
        side_effects:
          - "staled_by_amendment_id := the adopting Amendment id"
          - "source PlanElement.consistency_status := STALE"
          - "version incremented by 1"

      - from: CLEARED
        to: OPEN
        trigger: "state DEFICIENT determination or COUNCIL outcome DENY demoting this link's target element (system)"
        actor: system
        preconditions:
          - "status == CLEARED"
        side_effects:
          - "reconciled_by_user_id := null; reconciliation_note := null"
          - "version incremented by 1"

      - from: STALE
        to: CLEARED
        trigger: "POST /planning/amendments/{id}/rescind where staled_by_amendment_id == that amendment (system)"
        actor: system
        preconditions:
          - "status == STALE and staled_by_amendment_id == the rescinded amendment id"
        side_effects:
          - "staled_by_amendment_id := null"
          - "source PlanElement.consistency_status recomputed"
          - "version incremented by 1"

  - entity: EngagementActivity
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /planning/engagement-activities"
        actor: PlanningStaff
        preconditions:
          - "parent PlanUpdate exists and status != ADOPTED else ERR_PLAN_ALREADY_ADOPTED"
          - "end_at > start_at else ERR_INVALID_REQUEST"
          - "activity_type IN {WORKSHOP, TARGETED_OUTREACH} requires venue_id present; activity_type == SURVEY requires venue_id absent else ERR_INVALID_REQUEST"
          - "when activity_type == TARGETED_OUTREACH: Venue.transit_served == true and Venue.ada_accessible == true else ERR_VENUE_NOT_EQUITY_ELIGIBLE"
          - "no venue occupancy conflict per validation priority 62 else ERR_VENUE_TIME_CONFLICT"
        side_effects:
          - "weighting_variant := OUTREACH_WEIGHTED when activity_type == TARGETED_OUTREACH else STANDARD"
          - "status := SCHEDULED; record_count := 0; total_weighted_count := 0.0; equity_share_pct := 0.0"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /planning/engagement-activities/{id}/complete"
        actor: PlanningStaff
        preconditions:
          - "status == SCHEDULED else ERR_ACTIVITY_NOT_SCHEDULED"
          - "logical clock >= end_at else ERR_ACTIVITY_NOT_ENDED"
          - "record_count >= 1 else ERR_NO_PARTICIPATION_RECORDS"
        side_effects:
          - "CASCADE LINK 1: equity_share_pct computed by calculation activity_equity_share_pct"
          - "CASCADE LINK 2 (caused by link 1): PlanUpdate.participation_weight_total += total_weighted_count and PlanUpdate.underrepresented_weight_total += underrepresented_weighted_count"
          - "CASCADE LINK 3 (caused by link 2): PlanUpdate.equity_share_pct recomputed by calculation plan_equity_share_pct"
          - "CASCADE LINK 4 (caused by link 3): PlanUpdate.compliance_posture recomputed; EQUITY_HOLD lifts to CLEAR when the new share >= EQUITY_MIN_SHARE_PCT and no higher-precedence hold applies"
          - "CASCADE LINK 5 (caused by link 4): every Hearing of the plan with status == BLOCKED returns to SCHEDULED when the recomputed posture is CLEAR"
          - "PlanUpdate.version incremented by 1; version incremented by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /planning/engagement-activities/{id}/cancel"
        actor: PlanningStaff
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "the venue interval is released: this activity no longer participates in the venue occupancy test"
          - "no plan-level counter changes (a SCHEDULED activity never contributed any weight)"
          - "version incremented by 1"

      - from: COMPLETED
        to: CANCELLED
        trigger: "POST /planning/engagement-activities/{id}/cancel"
        actor: PlanningStaff
        preconditions:
          - "status == COMPLETED"
          - "PlanUpdate.status != ADOPTED else ERR_PLAN_ALREADY_ADOPTED"
        side_effects:
          - "COMPENSATION: PlanUpdate.participation_weight_total -= total_weighted_count and PlanUpdate.underrepresented_weight_total -= underrepresented_weighted_count"
          - "PlanUpdate.equity_share_pct recomputed by calculation plan_equity_share_pct"
          - "PlanUpdate.compliance_posture recomputed; the venue interval is released"
          - "invariant participation_weight_conservation must hold after this transition"
          - "PlanUpdate.version incremented by 1; version incremented by 1"

  - entity: EnvironmentalReview
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /planning/environmental-reviews"
        actor: EnvironmentalConsultant
        preconditions:
          - "parent PlanUpdate exists and status != ADOPTED else ERR_PLAN_ALREADY_ADOPTED"
        side_effects:
          - "status := DRAFT; alternative_count := 0; comment_period_days := null"

      - from: DRAFT
        to: CIRCULATED
        trigger: "POST /planning/environmental-reviews/{id}/circulate"
        actor: EnvironmentalConsultant
        preconditions:
          - "status == DRAFT else ERR_REVIEW_NOT_DRAFT"
          - "alternative_count >= MIN_ALTERNATIVES else ERR_INSUFFICIENT_ALTERNATIVES"
          - "the new circulation window must not overlap any other review window of the same plan per validation priority 66 else ERR_REVIEW_WINDOW_OVERLAP"
        side_effects:
          - "circulated_at := logical clock instant"
          - "comment_period_days := EIR_COMMENT_PERIOD_DAYS when document_type == EIR else ND_COMMENT_PERIOD_DAYS"
          - "comment_period_ends_at := circulated_at + comment_period_days days"
          - "version incremented by 1"

      - from: CIRCULATED
        to: CERTIFIED
        trigger: "POST /planning/environmental-reviews/{id}/certify"
        actor: PlanningDirector
        preconditions:
          - "status == CIRCULATED else ERR_REVIEW_NOT_CIRCULATED"
          - "logical clock >= comment_period_ends_at else ERR_COMMENT_PERIOD_OPEN"
          - "preferred_alternative_id IS NOT NULL else ERR_PREFERRED_ALTERNATIVE_NOT_SELECTED"
        side_effects:
          - "certified_at := logical clock instant"
          - "any other EnvironmentalReview of the same plan with status IN {DRAFT, CIRCULATED, CERTIFIED} moves to SUPERSEDED"
          - "PlanUpdate.version incremented by 1; version incremented by 1"

      - from: CIRCULATED
        to: SUPERSEDED
        trigger: "certification of another EnvironmentalReview on the same plan (system)"
        actor: system
        preconditions:
          - "status IN {DRAFT, CIRCULATED, CERTIFIED}"
        side_effects:
          - "version incremented by 1"

  - entity: PlanAlternative
    initial_state: EVALUATED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: null
        to: EVALUATED
        trigger: "POST /planning/plan-alternatives"
        actor: EnvironmentalConsultant
        preconditions:
          - "parent EnvironmentalReview exists and status == DRAFT else ERR_REVIEW_NOT_DRAFT"
        side_effects:
          - "raw_impact_score, mitigation_credit and net_impact_score computed by calculation alternative_net_impact_score"
          - "EnvironmentalReview.alternative_count += 1 and EnvironmentalReview.version incremented by 1"

      - from: EVALUATED
        to: PREFERRED
        trigger: "POST /planning/environmental-reviews/{id}/select-preferred-alternative (server-selected, no id supplied)"
        actor: EnvironmentalConsultant
        preconditions:
          - "parent EnvironmentalReview.status == CIRCULATED else ERR_REVIEW_NOT_CIRCULATED"
          - "this alternative is the winner of the preferred_alternative_selector over candidates with status == EVALUATED"
        side_effects:
          - "EnvironmentalReview.preferred_alternative_id := this id; EnvironmentalReview.version incremented by 1"
          - "any other PlanAlternative of the same review with status == PREFERRED moves PREFERRED -> SUPERSEDED"
          - "version incremented by 1"

      - from: PREFERRED
        to: SUPERSEDED
        trigger: "a later select-preferred-alternative call on the same review picks a different alternative (system)"
        actor: system
        preconditions:
          - "status == PREFERRED"
        side_effects:
          - "version incremented by 1"

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [CONTINUED, RECOMMENDED, ADOPTED_OUT, DENIED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /planning/hearings"
        actor: CommissionClerk
        preconditions:
          - "parent PlanUpdate exists and status IN {STATE_CERTIFIED, COMMISSION_RECOMMENDED} else ERR_PLAN_NOT_CERTIFIED"
          - "when body_type == COUNCIL: PlanUpdate.status == COMMISSION_RECOMMENDED else ERR_COMMISSION_RECOMMENDATION_REQUIRED"
          - "scheduled_end > scheduled_start else ERR_INVALID_REQUEST"
          - "notice_published_at <= scheduled_start - HEARING_NOTICE_DAYS days else ERR_NOTICE_PERIOD_TOO_SHORT"
          - "no closed-interval overlap with another hearing of the same plan and body_type per validation priority 63 else ERR_HEARING_SLOT_CONFLICT"
          - "fewer than MAX_HEARINGS_PER_BODY_PER_DAY hearings of the same plan and body_type already start on the same UTC calendar date else ERR_HEARING_DAILY_CAP_EXCEEDED"
        side_effects:
          - "status := SCHEDULED; amendment_count := 0; adopted_amendment_count := 0"

      - from: SCHEDULED
        to: BLOCKED
        trigger: "PlanUpdate.compliance_posture leaving CLEAR through any cascade (system)"
        actor: system
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "version incremented by 1"

      - from: BLOCKED
        to: SCHEDULED
        trigger: "PlanUpdate.compliance_posture returning to CLEAR through any cascade (system)"
        actor: system
        preconditions:
          - "status == BLOCKED"
        side_effects:
          - "version incremented by 1"

      - from: SCHEDULED
        to: OPEN
        trigger: "POST /planning/hearings/{id}/open"
        actor: CommissionClerk
        preconditions:
          - "status == SCHEDULED else ERR_HEARING_NOT_SCHEDULED"
          - "logical clock >= scheduled_start else ERR_HEARING_NOT_YET_STARTED"
          - "PlanUpdate.compliance_posture == CLEAR else ERR_PLAN_POSTURE_BLOCKED"
          - "when body_type == COUNCIL: an EnvironmentalReview of the plan has status == CERTIFIED else ERR_ENVIRONMENTAL_REVIEW_NOT_CERTIFIED"
        side_effects:
          - "opened_at := logical clock instant"
          - "version incremented by 1"

      - from: OPEN
        to: CONTINUED
        trigger: "POST /planning/hearings/{id}/outcome with outcome == CONTINUE"
        actor: CommissionClerk
        preconditions:
          - "status == OPEN else ERR_HEARING_NOT_OPEN"
        side_effects:
          - "outcome := CONTINUE; closed_at := logical clock instant"
          - "Amendment rows of this hearing with status == PROPOSED are left PROPOSED and become unresolvable (the hearing is terminal), so they can no longer be adopted"
          - "the parent PlanUpdate.status is unchanged"
          - "version incremented by 1"
        note: "Branch 1 of the fork - no plan-level effect."

      - from: OPEN
        to: RECOMMENDED
        trigger: "POST /planning/hearings/{id}/outcome with outcome == RECOMMEND"
        actor: CommissionClerk
        preconditions:
          - "status == OPEN else ERR_HEARING_NOT_OPEN"
          - "body_type == COMMISSION else ERR_OUTCOME_NOT_VALID_FOR_BODY"
          - "PlanUpdate.status == STATE_CERTIFIED else ERR_PLAN_NOT_CERTIFIED"
          - "PlanUpdate.compliance_posture == CLEAR else ERR_PLAN_POSTURE_BLOCKED"
          - "an EnvironmentalReview of the plan has status == CERTIFIED else ERR_ENVIRONMENTAL_REVIEW_NOT_CERTIFIED"
          - "no Amendment of this hearing is still in status PROPOSED else ERR_UNRESOLVED_AMENDMENTS"
        side_effects:
          - "outcome := RECOMMEND; closed_at := logical clock instant"
          - "PlanUpdate moves STATE_CERTIFIED -> COMMISSION_RECOMMENDED"
          - "version incremented by 1"
        note: "Branch 2 of the fork - advances the plan one step."

      - from: OPEN
        to: ADOPTED_OUT
        trigger: "POST /planning/hearings/{id}/outcome with outcome == ADOPT"
        actor: CommissionClerk
        preconditions:
          - "status == OPEN else ERR_HEARING_NOT_OPEN"
          - "body_type == COUNCIL else ERR_OUTCOME_NOT_VALID_FOR_BODY"
          - "PlanUpdate.status == COMMISSION_RECOMMENDED else ERR_PLAN_NOT_RECOMMENDED"
          - "PlanUpdate.compliance_posture == CLEAR else ERR_PLAN_POSTURE_BLOCKED"
          - "no Amendment of this hearing is still in status PROPOSED else ERR_UNRESOLVED_AMENDMENTS"
        side_effects:
          - "outcome := ADOPT; closed_at := logical clock instant"
          - "PlanUpdate moves COMMISSION_RECOMMENDED -> ADOPTED with its full adoption cascade (elements ADOPTED, implementation actions SCHEDULED with due_at)"
          - "version incremented by 1"
        note: "Branch 3 of the fork - the heaviest side-effect set."

      - from: OPEN
        to: DENIED
        trigger: "POST /planning/hearings/{id}/outcome with outcome == DENY"
        actor: CommissionClerk
        preconditions:
          - "status == OPEN else ERR_HEARING_NOT_OPEN"
          - "PlanUpdate.status IN {STATE_CERTIFIED, COMMISSION_RECOMMENDED}"
        side_effects:
          - "outcome := DENY; closed_at := logical clock instant"
          - "when body_type == COUNCIL and PlanUpdate.status == COMMISSION_RECOMMENDED: PlanUpdate moves COMMISSION_RECOMMENDED -> DRAFTING with its demotion cascade"
          - "when body_type == COMMISSION: PlanUpdate.status is unchanged and every other Hearing of the plan with status == SCHEDULED moves SCHEDULED -> BLOCKED"
          - "version incremented by 1"
        note: "Branch 4 of the fork - side-effect set diverges by body_type."

  - entity: Amendment
    initial_state: PROPOSED
    terminal_states: [WITHDRAWN, RESCINDED]
    transitions:
      - from: null
        to: PROPOSED
        trigger: "POST /planning/amendments"
        actor: CommissionClerk
        preconditions:
          - "parent Hearing exists and status == OPEN else ERR_HEARING_NOT_OPEN"
          - "target_element_id resolves to a PlanElement of the hearing's plan else ERR_CROSS_PLAN_AMENDMENT"
          - "that PlanElement.status == APPROVED else ERR_ELEMENT_NOT_AMENDABLE"
          - "expected_element_version == PlanElement.version else ERR_STALE_ELEMENT_VERSION (412)"
        side_effects:
          - "element_version_at_proposal := expected_element_version; proposed_by_user_id := X-User-ID"
          - "Hearing.amendment_count += 1 and Hearing.version incremented by 1"
          - "the target PlanElement is docketed: its updated_at is refreshed and its version is incremented by 1"

      - from: PROPOSED
        to: ADOPTED
        trigger: "POST /planning/amendments/{id}/adopt"
        actor: CommissionClerk
        preconditions:
          - "status == PROPOSED else ERR_AMENDMENT_NOT_PROPOSED"
          - "parent Hearing.status == OPEN else ERR_HEARING_NOT_OPEN"
          - "X-User-ID != proposed_by_user_id else ERR_SEGREGATION_OF_DUTIES"
          - "target PlanElement.policy_count + policy_delta >= 0 else ERR_POLICY_COUNT_NEGATIVE"
        side_effects:
          - "CASCADE LINK 1: prior_element_status := target PlanElement.status; target PlanElement.policy_count += policy_delta; applied_policy_count := the resulting policy_count; target PlanElement.consistency_status := STALE; target PlanElement.version incremented by 1"
          - "CASCADE LINK 2 (caused by link 1): every ConsistencyLink whose target_element_id == that element and whose status == CLEARED moves CLEARED -> STALE with staled_by_amendment_id := this amendment id"
          - "CASCADE LINK 3 (caused by link 2): each such link's source PlanElement.consistency_status := STALE"
          - "CASCADE LINK 4 (caused by link 3): PlanUpdate.open_consistency_link_count recomputed and PlanUpdate.compliance_posture recomputed -> CONSISTENCY_HOLD"
          - "CASCADE LINK 5 (caused by link 4): every Hearing of the plan with status == SCHEDULED moves SCHEDULED -> BLOCKED"
          - "Hearing.adopted_amendment_count += 1; PlanUpdate.version incremented by 1; version incremented by 1"
        note: "Rule-4 cascade of depth 5 originating from amendment adoption - a different trigger from the state determination cascade."

      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /planning/amendments/{id}/withdraw"
        actor: CommissionClerk
        preconditions:
          - "status == PROPOSED else ERR_AMENDMENT_NOT_PROPOSED"
          - "parent Hearing.status == OPEN else ERR_HEARING_NOT_OPEN"
        side_effects:
          - "no element or plan field changes; the element's policy_count is untouched"
          - "version incremented by 1"

      - from: ADOPTED
        to: RESCINDED
        trigger: "POST /planning/amendments/{id}/rescind"
        actor: CommissionClerk
        preconditions:
          - "status == ADOPTED else ERR_AMENDMENT_NOT_ADOPTED"
          - "parent Hearing.status == OPEN else ERR_HEARING_NOT_OPEN"
        side_effects:
          - "COMPENSATION LINK 1: target PlanElement.policy_count -= policy_delta, PlanElement.status := prior_element_status, and PlanElement.consistency_status recomputed to CLEARED when every ConsistencyLink whose source_element_id is that element is CLEARED (vacuously true when it sources none) else PENDING"
          - "COMPENSATION LINK 2 (caused by link 1): every ConsistencyLink with staled_by_amendment_id == this amendment id moves STALE -> CLEARED and staled_by_amendment_id := null"
          - "COMPENSATION LINK 3 (caused by link 2): each such link's source PlanElement.consistency_status recomputed to CLEARED when all of its links are CLEARED"
          - "COMPENSATION LINK 4 (caused by link 3): PlanUpdate.open_consistency_link_count recomputed; PlanUpdate.compliance_posture recomputed; BLOCKED hearings return to SCHEDULED when posture is CLEAR"
          - "Hearing.adopted_amendment_count -= 1"
          - "invariant policy_count_conservation must hold after this transition"
          - "PlanUpdate.version incremented by 1; version incremented by 1"

  - entity: ImplementationAction
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /planning/implementation-actions"
        actor: PlanningStaff
        preconditions:
          - "parent PlanUpdate exists and status != ADOPTED else ERR_PLAN_ALREADY_ADOPTED"
          - "source_element_id resolves to a PlanElement of the same plan else ERR_CROSS_PLAN_ACTION"
        side_effects:
          - "status := PENDING; reading_count := 0; on_track := false; due_at := null"

      - from: PENDING
        to: SCHEDULED
        trigger: "COUNCIL hearing outcome ADOPT on the parent plan (system)"
        actor: system
        preconditions:
          - "status == PENDING"
        side_effects:
          - "due_at := PlanUpdate.adopted_at + IMPLEMENTATION_DUE_DAYS days"
          - "version incremented by 1"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /planning/implementation-actions/{id}/complete"
        actor: PlanningStaff
        preconditions:
          - "status == SCHEDULED else ERR_ACTION_NOT_SCHEDULED"
          - "reading_count >= 1 else ERR_NO_INDICATOR_READING"
          - "on_track == true else ERR_INDICATOR_OFF_TRACK"
        side_effects:
          - "PlanUpdate.version incremented by 1"
          - "version incremented by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================

concurrency_rules:
  - rule_id: amendment-create-stale-element
    parent_entity: PlanElement
    write_endpoint: "POST /planning/amendments"
    occ_field: "expected_element_version"
    description: |
      Recording an Amendment against a PlanElement whose version has advanced since
      the clerk last read it is rejected with 412. Multiple amendments against the
      same element are legitimate - each one supersedes the prior text - so the
      write cannot be resolved by a state precondition; the clerk must re-read the
      element (whose version is bumped by every prior amendment docketing, by a
      PATCH, and by every cascade that touches the element) before moving again.
    error_id: ERR_STALE_ELEMENT_VERSION
    http_status: 412

  - rule_id: scenario-create-stale-inventory
    parent_entity: InventoryDataset
    write_endpoint: "POST /planning/growth-scenarios"
    occ_field: "expected_inventory_version"
    description: |
      Creating a GrowthScenario pinned to a LAND_USE InventoryDataset whose version
      has advanced since the analyst read it is rejected with 412. Any number of
      scenarios may legitimately be pinned to the same certified dataset, so a state
      precondition cannot express the rule; the stale-version check is what stops a
      scenario from being computed against acreage the analyst never saw.
    error_id: ERR_STALE_INVENTORY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================

calculations:
  - name: land_capacity_units
    trigger: "on POST /planning/growth-scenarios (side effect of the null -> DRAFT transition of GrowthScenario); writes GrowthScenario.land_capacity_units and GrowthScenario.capacity_variant"
    algorithm: aggregation
    formula: |
      # inputs come from the pinned LAND_USE InventoryDataset (status == CERTIFIED)
      inv = InventoryDataset[land_use_inventory_id]
      if scenario.method == "TREND":            # variant GROSS_CAPACITY
          land_capacity_units = round_half_up(
              (inv.vacant_acres + inv.underutilized_acres) * inv.allowed_density_units_per_acre, 0)
      else:                                      # scenario.method == "POLICY" -> variant NET_CAPACITY
          land_capacity_units = round_half_up(
              ((inv.vacant_acres - inv.infrastructure_constrained_acres)
               + inv.underutilized_acres * UNDERUTILIZED_REALIZATION_FACTOR)
              * inv.allowed_density_units_per_acre * MARKET_FACTOR, 0)
      capacity_variant = "GROSS_CAPACITY" if scenario.method == "TREND" else "NET_CAPACITY"
    input_set: "Exactly one InventoryDataset - the row named by land_use_inventory_id, which must have inventory_type == LAND_USE and status == CERTIFIED. DRAFT and SUPERSEDED datasets are rejected at validation priority 50, never silently skipped."
    constants:
      UNDERUTILIZED_REALIZATION_FACTOR: 0.50
      MARKET_FACTOR: 0.85
    precision: "integer units, round_half_up applied once to the final product (never to intermediate acreage)"
    variants:
      - name: GROSS_CAPACITY
        when: "scenario.method == TREND"
        difference: "Counts every vacant and underutilized acre at full allowed density; ignores infrastructure constraints, redevelopment realization and market softness."
      - name: NET_CAPACITY
        when: "scenario.method == POLICY"
        difference: "Subtracts infrastructure_constrained_acres from vacant land, realizes only UNDERUTILIZED_REALIZATION_FACTOR of underutilized acres, then discounts the whole product by MARKET_FACTOR. On the reference fixture (400 / 250 / 60 acres at 18 u/ac) GROSS_CAPACITY == 11700 while NET_CAPACITY == 7115 - the same inventory row yields two different capacities."

  - name: projected_demand_units
    trigger: "on POST /planning/growth-scenarios (side effect of the null -> DRAFT transition of GrowthScenario); writes GrowthScenario.projected_demand_units and GrowthScenario.capacity_gap_units"
    algorithm: forward_looking
    formula: |
      horizon_years   = scenario.horizon_year - PlanUpdate.base_year
      household_growth = scenario.base_households
                         * ((1 + scenario.annual_household_growth_rate) ** horizon_years)
                         - scenario.base_households
      job_driven_households = scenario.job_growth_total / JOBS_PER_HOUSEHOLD
      if scenario.method == "TREND":
          driver = household_growth
      else:                                  # POLICY takes whichever pressure is larger
          driver = max(household_growth, job_driven_households)
      projected_demand_units = round_half_up(
          (driver + scenario.demolition_replacement_units) * (1 + VACANCY_ALLOWANCE), 0)
      capacity_gap_units = max(projected_demand_units - land_capacity_units, 0)
    input_set: "Only the scenario's own input fields plus PlanUpdate.base_year. No aggregation over other rows, so the result is independent of inventory certification order."
    constants:
      JOBS_PER_HOUSEHOLD: 1.45
      VACANCY_ALLOWANCE: 0.05
    precision: "integer units; round_half_up applied exactly once at the end. Intermediate values (household_growth, job_driven_households, driver) are kept at full precision - rounding them first changes the result."
    note: "Combinatorial mode (a): five inputs, a compound-growth term, a max() against an employment-derived term, and a branch on scenario.method, all interacting non-linearly."

  - name: housing_allocation_waterfall
    trigger: "on POST /planning/housing-allocations (when the plan already has an adopted scenario) and on POST /planning/growth-scenarios/{id}/adopt (recomputes every tier of the plan); writes HousingAllocation.tier_capacity_units, carryover_in_units, accommodated_units, shortfall_units and PlanUpdate.housing_shortfall_total"
    algorithm: waterfall_allocation
    formula: |
      pool = PlanUpdate.adopted_scenario_id is None ? 0 : GrowthScenario[adopted_scenario_id].land_capacity_units
      carryover = 0
      for tier in TIER_ORDER:                       # fixed statutory order, never sorted by data
          row = HousingAllocation where plan_update_id == plan.id and income_tier == tier
          if row is None:            # a tier with no allocation row contributes nothing and
              continue               # passes its capacity share downstream untouched
          row.tier_capacity_units  = round_half_up(pool * TIER_SUITABILITY_SHARE[tier], 0)   # ROUND PER TIER
          row.carryover_in_units   = carryover
          available                = row.tier_capacity_units + row.carryover_in_units
          row.accommodated_units   = min(row.assigned_units, available)
          row.shortfall_units      = row.assigned_units - row.accommodated_units
          carryover                = available - row.accommodated_units
      PlanUpdate.housing_shortfall_total = sum(row.shortfall_units for the four tiers, 0 when a row is absent)
    input_set: "All HousingAllocation rows of the plan, visited strictly in TIER_ORDER (VERY_LOW, LOW, MODERATE, ABOVE_MODERATE) - never in created_at order and never sorted by assigned_units. Capacity comes only from the scenario named by PlanUpdate.adopted_scenario_id (status == ADOPTED); DRAFT and SUPERSEDED scenarios contribute nothing."
    constants:
      TIER_ORDER: ["VERY_LOW", "LOW", "MODERATE", "ABOVE_MODERATE"]
      TIER_SUITABILITY_SHARE: { VERY_LOW: 0.30, LOW: 0.20, MODERATE: 0.20, ABOVE_MODERATE: 0.30 }
    precision: |
      Rounding order is PINNED: round each tier's share to whole units FIRST, then let the waterfall
      consume it. The alternative reading - sum the exact shares and round the total - gives a
      different answer whenever a share lands on .5: with pool == 7115 the per-tier rounding yields
      2135 + 1423 + 1423 + 2135 == 7116 allocated units (one more than the pool), and the
      ABOVE_MODERATE tier accommodates 2781 units instead of 2780.
    note: "Combinatorial mode (b): nested rounding where per-tier-then-sum and sum-then-round diverge; the scaffold pins per-tier."

  - name: participation_record_weight
    trigger: "on POST /planning/participation-records; writes ParticipationRecord.weight and ParticipationRecord.is_underrepresented, then EngagementActivity.record_count, underrepresented_record_count, total_weighted_count and underrepresented_weighted_count"
    algorithm: weighted_scoring
    formula: |
      is_underrepresented = record.demographic_group in UNDERREPRESENTED_GROUPS
      if activity.weighting_variant == "OUTREACH_WEIGHTED" and record.interpreter_used == true:
          weight = OUTREACH_INTERPRETER_WEIGHT
      else:
          weight = BASE_WEIGHT
      activity.record_count                    += 1
      activity.underrepresented_record_count   += 1 if is_underrepresented else 0
      activity.total_weighted_count            += weight
      activity.underrepresented_weighted_count += weight if is_underrepresented else 0
    input_set: "The single record being created plus its parent activity's weighting_variant. Records may only be attached while the activity status == SCHEDULED."
    constants:
      UNDERREPRESENTED_GROUPS: ["LOW_INCOME", "LIMITED_ENGLISH", "YOUTH", "DISABILITY", "RENTER"]
      BASE_WEIGHT: 1.0
      OUTREACH_INTERPRETER_WEIGHT: 2.0
    precision: "1 decimal place on all weight sums, round_half_up"
    note: "GENERAL and SENIOR are deliberately NOT underrepresented groups; interpreter_used only changes the weight under OUTREACH_WEIGHTED."

  - name: activity_equity_share_pct
    trigger: "on POST /planning/engagement-activities/{id}/complete (side effect of SCHEDULED -> COMPLETED); writes EngagementActivity.equity_share_pct"
    algorithm: weighted_scoring
    formula: |
      if activity.total_weighted_count == 0:      # guarded by ERR_NO_PARTICIPATION_RECORDS
          equity_share_pct = 0.0
      else:
          equity_share_pct = round_half_up(
              100 * activity.underrepresented_weighted_count / activity.total_weighted_count, 1)
    input_set: "Every ParticipationRecord attached to this activity (there is no record-level exclusion; records cannot be deleted)."
    constants:
      EQUITY_MIN_SHARE_PCT: 40.0
    precision: "percent with 1 decimal place, round_half_up"
    variants:
      - name: STANDARD
        when: "activity.activity_type IN {WORKSHOP, SURVEY} (weighting_variant == STANDARD)"
        difference: "Every record carries BASE_WEIGHT, so the share reduces to a head count: 4 underrepresented of 10 records == 40.0."
      - name: OUTREACH_WEIGHTED
        when: "activity.activity_type == TARGETED_OUTREACH (weighting_variant == OUTREACH_WEIGHTED)"
        difference: "Records with interpreter_used == true count double, so the same five records that give 60.0 under STANDARD (3 of 5 underrepresented) give 71.4 here when the two interpreter-using respondents are both underrepresented (5.0 of 7.0 weight)."

  - name: plan_equity_share_pct
    trigger: "on EngagementActivity SCHEDULED -> COMPLETED and on COMPLETED -> CANCELLED; writes PlanUpdate.participation_weight_total, PlanUpdate.underrepresented_weight_total and PlanUpdate.equity_share_pct"
    algorithm: aggregation
    formula: |
      participation_weight_total      = sum(a.total_weighted_count
                                            for a in EngagementActivity
                                            where a.plan_update_id == plan.id and a.status == "COMPLETED")
      underrepresented_weight_total   = sum(a.underrepresented_weighted_count for the same set)
      equity_share_pct = 0.0 if participation_weight_total == 0 else round_half_up(
          100 * underrepresented_weight_total / participation_weight_total, 1)
    input_set: "EngagementActivity rows of this plan with status == COMPLETED only. SCHEDULED activities (not yet held) and CANCELLED activities (withdrawn from the engagement record) are excluded. The window is unbounded in time - every COMPLETED activity of the plan counts, regardless of start_at. No ordering is involved, so no tie-break is required."
    constants:
      EQUITY_MIN_SHARE_PCT: 40.0
    precision: "percent with 1 decimal place, round_half_up; the two weight totals keep 1 decimal place"
    note: "Two COMPLETED workshops of 10 records each, one with 4 and one with 3 underrepresented respondents, give 100 * 7.0 / 20.0 == 35.0 - below EQUITY_MIN_SHARE_PCT even though the first workshop alone was exactly at the threshold."

  - name: alternative_net_impact_score
    trigger: "on POST /planning/plan-alternatives; writes PlanAlternative.raw_impact_score, mitigation_credit and net_impact_score"
    algorithm: weighted_scoring
    formula: |
      # STEP 1 - raw score (weights sum to exactly 1.00)
      raw_impact_score = round_half_up(
            IMPACT_WEIGHTS.traffic * alt.traffic_vmt_index
          + IMPACT_WEIGHTS.ghg     * alt.ghg_index
          + IMPACT_WEIGHTS.habitat * alt.habitat_index
          + IMPACT_WEIGHTS.water   * alt.water_index, 2)
      # STEP 2 - the mitigation tier is keyed on raw_impact_score, NEVER on net_impact_score.
      if   raw_impact_score >= HIGH_IMPACT_THRESHOLD: mitigation_credit = round_half_up(raw_impact_score * HIGH_CREDIT_RATE, 2)
      elif raw_impact_score >= MID_IMPACT_THRESHOLD:  mitigation_credit = round_half_up(raw_impact_score * MID_CREDIT_RATE, 2)
      else:                                           mitigation_credit = 0.00
      # STEP 3 - net score
      net_impact_score = round_half_up(raw_impact_score - mitigation_credit, 2)
    input_set: "The four impact indices supplied on the alternative. No cross-row inputs, so alternatives can be scored in any creation order."
    constants:
      IMPACT_WEIGHTS: { traffic: 0.35, ghg: 0.25, habitat: 0.20, water: 0.20 }
      HIGH_IMPACT_THRESHOLD: 70
      MID_IMPACT_THRESHOLD: 50
      HIGH_CREDIT_RATE: 0.15
      MID_CREDIT_RATE: 0.10
    precision: "2 decimal places, round_half_up, applied to raw_impact_score, mitigation_credit and net_impact_score independently in the order shown"
    note: |
      Combinatorial mode (c): the credit rate depends on a score, and the score that is
      compared against later (net_impact_score) is itself the score minus the credit. The
      evaluation order above breaks the apparent circularity by pinning the tier lookup to the
      RAW score. An alternative with all four indices at 70 has raw 70.00 -> HIGH tier ->
      credit 10.50 -> net 59.50; keying the tier on the net score instead would have produced
      the MID tier (credit 7.00, net 63.00).

  - name: preferred_alternative_selector
    trigger: "on POST /planning/environmental-reviews/{id}/select-preferred-alternative; writes EnvironmentalReview.preferred_alternative_id and PlanAlternative.status"
    algorithm: constraint_propagation
    formula: |
      # (a) eligibility filter
      candidates = [a for a in PlanAlternative
                    where a.environmental_review_id == review.id and a.status == "EVALUATED"]
      # (d) empty-pool fallback
      if len(candidates) == 0:
          reject with ERR_NO_ELIGIBLE_ALTERNATIVE (409); nothing is mutated
      # (b) ranking expression - lowest environmental impact wins
      candidates.sort_by(net_impact_score ASC,
                         raw_impact_score ASC,      # (c) first tie-break
                         created_at ASC)            # (c) final tie-break - created_at, never id
      winner = candidates[0]
    input_set: "PlanAlternative rows of this review with status == EVALUATED. PREFERRED (the incumbent) and SUPERSEDED rows are excluded, so re-running the selector after a selection picks the best of the remaining evaluated alternatives and demotes the incumbent."
    constants: {}
    precision: "comparison on the stored 2-decimal net_impact_score and raw_impact_score values; no re-rounding"
    note: "Selector determinism: eligibility, ranking, two tie-breaks and the empty-pool fallback are all pinned. created_at ASC is the final fallback - the random id never participates."

  - name: compliance_posture
    trigger: "recomputed as a side effect of every mutation that can change one of its inputs: element review decisions, consistency link create/reconcile/cascade, scenario adoption, housing allocation create, activity completion and cancellation, state determinations, amendment adoption and rescission; writes PlanUpdate.compliance_posture"
    algorithm: threshold
    formula: |
      # first matching rule wins - the precedence order is part of the contract
      if plan.state_review_status == "DEFICIENT":                        posture = "FROZEN"
      elif plan.open_consistency_link_count > 0:                          posture = "CONSISTENCY_HOLD"
      elif plan.adopted_scenario_id is None or plan.housing_shortfall_total > 0:
                                                                          posture = "CAPACITY_HOLD"
      elif plan.equity_share_pct < EQUITY_MIN_SHARE_PCT:                   posture = "EQUITY_HOLD"
      else:                                                               posture = "CLEAR"
      # derived counters this rule reads, each with its own explicit filter:
      open_consistency_link_count      = count(ConsistencyLink l where the plan of l.source_element_id == plan.id
                                               and l.status IN {OPEN, STALE})
      required_elements_complete_count = count(distinct e.element_type for PlanElement e
                                               where e.plan_update_id == plan.id
                                               and e.status IN {APPROVED, ADOPTED})
      housing_shortfall_total          = sum(HousingAllocation.shortfall_units for rows of this plan)
    input_set: "Only the five derived fields listed above, each computed over the filters shown. required_elements_complete_count is recomputed alongside the posture but does NOT gate it - it gates state submission at validation priority 75."
    constants:
      EQUITY_MIN_SHARE_PCT: 40.0
    precision: "exact integer/decimal comparisons; the equity comparison is >= at exactly 40.0, so a plan at 40.0 is CLEAR and a plan at 39.9 is EQUITY_HOLD"
    note: "Posture-driven gating: hearing open and hearing outcome both require CLEAR (validation priority 61)."

  - name: indicator_on_track
    trigger: "on POST /planning/implementation-actions/{id}/record-reading; writes ImplementationAction.latest_reading_value, latest_reading_at, reading_count, on_track and PlanUpdate.monitoring_on_track_count"
    algorithm: threshold
    formula: |
      action.latest_reading_value = request.reading_value      # the newest reading always wins
      action.latest_reading_at    = logical clock instant
      action.reading_count       += 1
      if action.indicator_direction == "INCREASE":
          action.on_track = action.latest_reading_value >= action.target_value
      else:                                       # DECREASE
          action.on_track = action.latest_reading_value <= action.target_value
      PlanUpdate.monitoring_on_track_count = count(ImplementationAction a
                                                   where a.plan_update_id == plan.id and a.on_track == true)
    input_set: "Only the single newest reading; earlier readings are not averaged and not retained as rows. Readings are accepted while status IN {PENDING, SCHEDULED} and rejected once COMPLETED."
    constants: {}
    precision: "readings compared at full supplied precision; the comparison is inclusive (>= for INCREASE, <= for DECREASE), so a reading exactly equal to target_value is on track"

  - name: participation_weight_conservation
    trigger: "invariant asserted after EngagementActivity COMPLETED -> CANCELLED (and after every SCHEDULED -> COMPLETED)"
    algorithm: invariant
    formula: |
      PlanUpdate.participation_weight_total
        == sum(a.total_weighted_count for a in EngagementActivity
               where a.plan_update_id == plan.id and a.status == "COMPLETED")
      AND PlanUpdate.underrepresented_weight_total
        == sum(a.underrepresented_weighted_count for the same set)
      AND PlanUpdate.equity_share_pct == round_half_up(
               100 * PlanUpdate.underrepresented_weight_total
                   / PlanUpdate.participation_weight_total, 1)   # 0.0 when the denominator is 0
    input_set: "All EngagementActivity rows of the plan; the invariant is what forbids the cancel compensation from leaving the plan's weighted participation drifted."
    constants: {}
    precision: "exact equality on 1-decimal weights"
    note: "Conserved quantity #1: weighted participation. Completing an activity and then cancelling it must return participation_weight_total, underrepresented_weight_total and equity_share_pct to their exact pre-completion values."

  - name: policy_count_conservation
    trigger: "invariant asserted after Amendment ADOPTED -> RESCINDED"
    algorithm: invariant
    formula: |
      PlanElement.policy_count       == policy_count observed immediately before the amendment was adopted
      AND PlanElement.status         == Amendment.prior_element_status
      AND PlanUpdate.open_consistency_link_count
             == count(ConsistencyLink l where the plan of l.source_element_id == plan.id
                      and l.status IN {OPEN, STALE})
      AND no ConsistencyLink retains staled_by_amendment_id == the rescinded amendment id
    input_set: "The amendment's target element plus every ConsistencyLink staled by that amendment."
    constants: {}
    precision: "exact integer equality on policy_count and open_consistency_link_count"
    note: "Conserved quantity #2: element policy inventory (an integer count of policies), structurally different from conserved quantity #1 (a decimal weighted participation sum)."

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority order)
# =============================================================================

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list in section 1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 30
    category: existence
    check: "every id in the URL path resolves to an existing row, validated left to right (plan_update_id before nested child ids)"
    error_id: "ERR_PLAN_UPDATE_NOT_FOUND | ERR_INVENTORY_NOT_FOUND | ERR_SCENARIO_NOT_FOUND | ERR_ELEMENT_NOT_FOUND | ERR_LINK_NOT_FOUND | ERR_ACTIVITY_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_HEARING_NOT_FOUND | ERR_AMENDMENT_NOT_FOUND | ERR_ACTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 35
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: required fields present, enum members valid, numbers within their declared constraints, datetimes ISO 8601 UTC with three fractional digits, end_at > start_at, scheduled_end > scheduled_start, LAND_USE acreage fields present only for LAND_USE inventories, venue_id present only for WORKSHOP and TARGETED_OUTREACH; limit within 1..100 and offset >= 0 on list endpoints"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST, PATCH and GET list endpoints"

  - priority: 40
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_PLAN_UPDATE_NOT_FOUND | ERR_INVENTORY_NOT_FOUND | ERR_ELEMENT_NOT_FOUND | ERR_VENUE_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_HEARING_NOT_FOUND | ERR_ACTIVITY_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying a foreign key"

  - priority: 50
    category: state
    check: "the target row is in a state the requested transition permits, and every cross-entity state precondition declared on that transition in section 1.2 holds (plan not ADOPTED, inventory CERTIFIED, scenario DRAFT, element DRAFT/IN_REVIEW/APPROVED as applicable, hearing SCHEDULED/OPEN, review DRAFT/CIRCULATED, amendment PROPOSED/ADOPTED, action SCHEDULED)"
    error_id: "ERR_PLAN_ALREADY_ADOPTED | ERR_PLAN_NOT_DRAFTING | ERR_PLAN_NOT_SUBMITTED | ERR_PLAN_NOT_CERTIFIED | ERR_PLAN_NOT_RECOMMENDED | ERR_INVENTORY_NOT_DRAFT | ERR_INVENTORY_NOT_CERTIFIED | ERR_INVENTORY_TYPE_MISMATCH | ERR_ADOPTED_SCENARIO_PINNED | ERR_SCENARIO_NOT_DRAFT | ERR_SCENARIO_NOT_ADOPTED | ERR_INVENTORY_SET_INCOMPLETE | ERR_ELEMENT_NOT_DRAFT | ERR_ELEMENT_NOT_IN_REVIEW | ERR_ELEMENT_NOT_AMENDABLE | ERR_LINK_ALREADY_CLEARED | ERR_TARGET_ELEMENT_NOT_REVIEWABLE | ERR_ACTIVITY_NOT_SCHEDULED | ERR_ACTIVITY_CLOSED | ERR_REVIEW_NOT_DRAFT | ERR_REVIEW_NOT_CIRCULATED | ERR_HEARING_NOT_SCHEDULED | ERR_HEARING_NOT_OPEN | ERR_AMENDMENT_NOT_PROPOSED | ERR_AMENDMENT_NOT_ADOPTED | ERR_ACTION_NOT_SCHEDULED | ERR_ACTION_ALREADY_COMPLETED"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 55
    category: state
    check: "the OCC field required by the endpoint equals the parent's current version (expected_element_version vs PlanElement.version on POST /planning/amendments; expected_inventory_version vs InventoryDataset.version on POST /planning/growth-scenarios)"
    error_id: "ERR_STALE_ELEMENT_VERSION | ERR_STALE_INVENTORY_VERSION"
    http_status: 412
    applies_to: "POST /planning/amendments, POST /planning/growth-scenarios"

  - priority: 60
    category: business_safety
    check: "segregation of duties: X-User-ID must differ from the recorded actor of the preceding step - inventory certify vs InventoryDataset.authored_by_user_id, element review-decision vs PlanElement.authored_by_user_id, amendment adopt vs Amendment.proposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /planning/inventory-datasets/{id}/certify, POST /planning/plan-elements/{id}/review-decision, POST /planning/amendments/{id}/adopt"

  - priority: 61
    category: business_safety
    check: "PlanUpdate.compliance_posture == CLEAR before a hearing may be opened or given an outcome of RECOMMEND or ADOPT"
    error_id: ERR_PLAN_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /planning/hearings/{id}/open, POST /planning/hearings/{id}/outcome"

  - priority: 62
    category: business_temporal
    check: |
      Venue occupancy, HALF-OPEN intervals with a symmetric turnover buffer. A new activity on
      venue V conflicts with an existing activity E on the same venue whose status IN
      {SCHEDULED, COMPLETED} when
        new.start_at - V.turnover_buffer_minutes < E.end_at
        AND new.end_at + V.turnover_buffer_minutes > E.start_at.
      With turnover_buffer_minutes == 0 exact adjacency (new.start_at == E.end_at) is allowed;
      with a positive buffer the same adjacency conflicts. CANCELLED activities release the
      interval and never conflict.
    error_id: ERR_VENUE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /planning/engagement-activities"

  - priority: 63
    category: business_temporal
    check: |
      Hearing calendar occupancy on the plan, CLOSED intervals with no buffer. A new hearing
      conflicts with an existing hearing of the same plan_update_id and the same body_type whose
      status IN {SCHEDULED, BLOCKED, OPEN} when
        new.scheduled_start <= E.scheduled_end AND new.scheduled_end >= E.scheduled_start.
      Touching endpoints (new.scheduled_start == E.scheduled_end) ARE a conflict here - the
      opposite of the venue rule at priority 62. Hearings of the other body_type never conflict.
    error_id: ERR_HEARING_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /planning/hearings"

  - priority: 64
    category: business_constraint
    check: "aggregate calendar capacity: at most MAX_HEARINGS_PER_BODY_PER_DAY (2) hearings of the same plan_update_id and body_type may have scheduled_start on the same UTC calendar date, counting rows with status IN {SCHEDULED, BLOCKED, OPEN, CONTINUED, RECOMMENDED, ADOPTED_OUT, DENIED}"
    error_id: ERR_HEARING_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /planning/hearings"

  - priority: 65
    category: business_temporal
    check: "public notice lead time: notice_published_at <= scheduled_start - HEARING_NOTICE_DAYS (10) days"
    error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /planning/hearings"

  - priority: 66
    category: business_temporal
    check: |
      Environmental review circulation windows on the plan, CLOSED intervals. The new window
      [clock, clock + comment_period_days] must not overlap the window
      [E.circulated_at, E.comment_period_ends_at] of any other EnvironmentalReview of the same
      plan whose status IN {CIRCULATED, CERTIFIED}, using
        new_start <= E.comment_period_ends_at AND new_end >= E.circulated_at.
    error_id: ERR_REVIEW_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /planning/environmental-reviews/{id}/circulate"

  - priority: 67
    category: business_temporal
    check: "logical-clock gates: hearing open requires clock >= scheduled_start; environmental certify requires clock >= comment_period_ends_at; activity complete requires clock >= end_at; inventory create requires vintage_year <= PlanUpdate.base_year"
    error_id: "ERR_HEARING_NOT_YET_STARTED | ERR_COMMENT_PERIOD_OPEN | ERR_ACTIVITY_NOT_ENDED | ERR_INVENTORY_VINTAGE_TOO_LATE"
    http_status: 409
    applies_to: "POST /planning/hearings/{id}/open, POST /planning/environmental-reviews/{id}/certify, POST /planning/engagement-activities/{id}/complete, POST /planning/inventory-datasets"

  - priority: 70
    category: business_referential
    check: "cross-aggregate ownership: both elements of a ConsistencyLink share one plan; an Amendment's target element belongs to its hearing's plan; an ImplementationAction's source element belongs to its plan; a GrowthScenario's inventory belongs to its plan"
    error_id: "ERR_CROSS_PLAN_LINK | ERR_CROSS_PLAN_AMENDMENT | ERR_CROSS_PLAN_ACTION"
    http_status: 409
    applies_to: "POST /planning/consistency-links, POST /planning/amendments, POST /planning/implementation-actions, POST /planning/growth-scenarios"

  - priority: 71
    category: business_constraint
    check: "graph integrity of the consistency network: source_element_id != target_element_id, the (source, target) pair is not already declared, and the new edge does not close a directed cycle over links with status IN {OPEN, CLEARED, STALE}"
    error_id: "ERR_SELF_CONSISTENCY_LINK | ERR_DUPLICATE_CONSISTENCY_LINK | ERR_CONSISTENCY_CYCLE"
    http_status: "422 for ERR_SELF_CONSISTENCY_LINK, 409 for the other two"
    applies_to: "POST /planning/consistency-links"

  - priority: 72
    category: business_constraint
    check: "scope uniqueness: one PlanElement per (plan_update_id, element_type); one HousingAllocation per (plan_update_id, income_tier); one ParticipationRecord per (activity_id, respondent_ref)"
    error_id: "ERR_DUPLICATE_ELEMENT_TYPE | ERR_DUPLICATE_ALLOCATION_TIER | ERR_DUPLICATE_PARTICIPATION"
    http_status: 409
    applies_to: "POST /planning/plan-elements, POST /planning/housing-allocations, POST /planning/participation-records"

  - priority: 73
    category: business_constraint
    check: "content readiness: an element must carry at least one policy before review; a review must carry at least MIN_ALTERNATIVES (2) alternatives before circulation; TARGETED_OUTREACH activities require an ADA-accessible transit-served venue; adopting an amendment must not drive policy_count below 0"
    error_id: "ERR_ELEMENT_HAS_NO_POLICIES | ERR_INSUFFICIENT_ALTERNATIVES | ERR_VENUE_NOT_EQUITY_ELIGIBLE | ERR_POLICY_COUNT_NEGATIVE"
    http_status: 409
    applies_to: "POST /planning/plan-elements/{id}/submit-review, POST /planning/environmental-reviews/{id}/circulate, POST /planning/engagement-activities, POST /planning/amendments/{id}/adopt"

  - priority: 74
    category: business_constraint
    check: "hearing outcome legality: RECOMMEND is only valid for body_type == COMMISSION and ADOPT only for body_type == COUNCIL; no Amendment of the hearing may remain in status PROPOSED when an outcome of RECOMMEND or ADOPT is recorded"
    error_id: "ERR_OUTCOME_NOT_VALID_FOR_BODY | ERR_UNRESOLVED_AMENDMENTS"
    http_status: 409
    applies_to: "POST /planning/hearings/{id}/outcome"

  - priority: 75
    category: business_constraint
    check: "state mandate completeness: the plan carries a PlanElement with status IN {APPROVED, ADOPTED} for each of the five REQUIRED_ELEMENT_TYPES, and a HousingAllocation row exists for each of the four TIER_ORDER tiers"
    error_id: "ERR_REQUIRED_ELEMENT_MISSING | ERR_ALLOCATION_INCOMPLETE"
    http_status: 409
    applies_to: "POST /planning/plan-updates/{id}/state-submission"

  - priority: 76
    category: business_constraint
    check: "internal consistency: PlanUpdate.open_consistency_link_count == 0 at state submission, and every ConsistencyLink whose source_element_id is the element under review is CLEARED before that element may be APPROVED"
    error_id: ERR_CONSISTENCY_UNRESOLVED
    http_status: 409
    applies_to: "POST /planning/plan-updates/{id}/state-submission, POST /planning/plan-elements/{id}/review-decision"

  - priority: 77
    category: business_constraint
    check: "an EnvironmentalReview of the plan exists with status IN {CIRCULATED, CERTIFIED} at state submission, and with status == CERTIFIED before a COUNCIL hearing may be opened or a RECOMMEND outcome recorded; a preferred alternative must be selected before certification"
    error_id: "ERR_ENVIRONMENTAL_REVIEW_MISSING | ERR_ENVIRONMENTAL_REVIEW_NOT_CERTIFIED | ERR_PREFERRED_ALTERNATIVE_NOT_SELECTED"
    http_status: 409
    applies_to: "POST /planning/plan-updates/{id}/state-submission, POST /planning/hearings/{id}/open, POST /planning/hearings/{id}/outcome, POST /planning/environmental-reviews/{id}/certify"

  - priority: 78
    category: business_constraint
    check: "COUNCIL hearings may only be scheduled once PlanUpdate.status == COMMISSION_RECOMMENDED"
    error_id: ERR_COMMISSION_RECOMMENDATION_REQUIRED
    http_status: 409
    applies_to: "POST /planning/hearings"

  - priority: 80
    category: business_fiscal
    check: "land capacity adequacy: PlanUpdate.housing_shortfall_total == 0 (every income tier's assigned_units is fully accommodated by the adopted scenario's capacity waterfall)"
    error_id: ERR_HOUSING_SHORTFALL
    http_status: 409
    applies_to: "POST /planning/plan-updates/{id}/state-submission"

  - priority: 81
    category: business_fiscal
    check: "equity budget: PlanUpdate.equity_share_pct >= EQUITY_MIN_SHARE_PCT (40.0), compared inclusively so exactly 40.0 passes"
    error_id: ERR_EQUITY_TARGET_NOT_MET
    http_status: 409
    applies_to: "POST /planning/plan-updates/{id}/state-submission"

  - priority: 85
    category: business_constraint
    check: "iteration ceilings: PlanUpdate.resubmission_count < MAX_RESUBMISSIONS (2) on a resubmission; a PATCH of an ESCALATED element requires the PlanningDirector override role"
    error_id: "ERR_RESUBMISSION_LIMIT_EXCEEDED | ERR_ESCALATION_OVERRIDE_REQUIRED"
    http_status: "409 for ERR_RESUBMISSION_LIMIT_EXCEEDED, 403 for ERR_ESCALATION_OVERRIDE_REQUIRED"
    applies_to: "POST /planning/plan-updates/{id}/state-submission, PATCH /planning/plan-elements/{id}"

  - priority: 90
    category: business_constraint
    check: "empty-set guards: the preferred-alternative selector needs at least one candidate with status == EVALUATED; completing an activity needs record_count >= 1; completing an implementation action needs reading_count >= 1 and on_track == true"
    error_id: "ERR_NO_ELIGIBLE_ALTERNATIVE | ERR_NO_PARTICIPATION_RECORDS | ERR_NO_INDICATOR_READING | ERR_INDICATOR_OFF_TRACK"
    http_status: 409
    applies_to: "POST /planning/environmental-reviews/{id}/select-preferred-alternative, POST /planning/engagement-activities/{id}/complete, POST /planning/implementation-actions/{id}/complete"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================

endpoints:
  # --- PlanUpdate ------------------------------------------------------------
  - method: POST
    path: "/planning/plan-updates"
    description: "Open a new comprehensive plan update cycle."
    roles: [PlanningDirector]
    code: 201
    input: [title, jurisdiction_code, base_year, horizon_year]
    output: PlanUpdate
    side_effects:
      - "status := DRAFTING, state_review_status := NOT_SUBMITTED"
      - "compliance_posture computed by calculation compliance_posture -> CAPACITY_HOLD (no adopted scenario yet)"

  - method: GET
    path: "/planning/plan-updates/{id}"
    description: "Read one plan update with all derived compliance counters."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: []
    output: PlanUpdate
    side_effects: []

  - method: GET
    path: "/planning/plan-updates"
    description: "List plan updates with pagination; supports filtering by status, jurisdiction and adopted scenario (reverse lookup for PlanUpdate.adopted_scenario_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["status?", "jurisdiction_code?", "adopted_scenario_id?", "limit?", "offset?"]
    output: PlanUpdate[]
    side_effects: []

  - method: POST
    path: "/planning/plan-updates/{id}/state-submission"
    description: "Submit the plan to the state for mandate review; runs the full mandate checklist. Also serves resubmission from STATE_DEFICIENT."
    roles: [PlanningDirector]
    code: 200
    input: ["submission_note?"]
    output: PlanUpdate
    side_effects:
      - "DRAFTING -> STATE_SUBMITTED or STATE_DEFICIENT -> STATE_SUBMITTED"
      - "state_review_status := SUBMITTED; resubmission_count += 1 on the resubmission edge"
      - "compliance_posture recomputed; BLOCKED hearings return to SCHEDULED when posture becomes CLEAR"
      - "increments PlanUpdate.version by 1"

  - method: POST
    path: "/planning/plan-updates/{id}/state-determination"
    description: "Record the state's mandate determination. CERTIFIED unlocks hearings; DEFICIENT freezes the plan and demotes the named elements."
    roles: [StateReviewer]
    code: 200
    input: [determination, findings, "deficient_element_types?"]
    output: PlanUpdate
    side_effects:
      - "STATE_SUBMITTED -> STATE_CERTIFIED (determination == CERTIFIED) or STATE_SUBMITTED -> STATE_DEFICIENT (determination == DEFICIENT)"
      - "on DEFICIENT: the five-link cascade declared on that transition (elements demoted, links reopened, posture FROZEN, SCHEDULED hearings BLOCKED)"
      - "increments PlanUpdate.version by 1"

  - method: GET
    path: "/planning/plan-updates/{id}/compliance-summary"
    description: "Computed read: the state-mandate checklist and capacity/equity dashboard for the plan."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: []
    output: { plan_update_id: string, compliance_posture: string, state_review_status: string, required_elements_complete_count: integer, missing_element_types: array, open_consistency_link_count: integer, housing_shortfall_total: integer, equity_share_pct: number, land_capacity_units: integer, projected_demand_units: integer, capacity_gap_units: integer, monitoring_on_track_count: integer }
    side_effects: []

  # --- InventoryDataset ------------------------------------------------------
  - method: POST
    path: "/planning/inventory-datasets"
    description: "Create an existing-conditions inventory dataset. LAND_USE datasets carry the four acreage fields; the other three types carry record_count."
    roles: [PlanningStaff]
    code: 201
    input: [plan_update_id, inventory_type, vintage_year, "record_count?", "vacant_acres?", "underutilized_acres?", "infrastructure_constrained_acres?", "allowed_density_units_per_acre?"]
    output: InventoryDataset
    side_effects:
      - "status := DRAFT; authored_by_user_id := X-User-ID; referencing_scenario_count := 0"

  - method: GET
    path: "/planning/inventory-datasets/{id}"
    description: "Read one inventory dataset, including its current version for OCC pinning."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: []
    output: InventoryDataset
    side_effects: []

  - method: GET
    path: "/planning/plan-updates/{id}/inventory-datasets"
    description: "List the inventory datasets of a plan (reverse lookup for InventoryDataset.plan_update_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["inventory_type?", "status?", "limit?", "offset?"]
    output: InventoryDataset[]
    side_effects: []

  - method: POST
    path: "/planning/inventory-datasets/{id}/certify"
    description: "Certify a draft inventory dataset. The certifier must not be the author."
    roles: [PlanningDirector]
    code: 200
    input: []
    output: InventoryDataset
    side_effects:
      - "DRAFT -> CERTIFIED; certified_by_user_id := X-User-ID"
      - "sibling CERTIFIED dataset of the same plan and inventory_type -> SUPERSEDED, and its DRAFT scenarios -> SUPERSEDED"
      - "increments InventoryDataset.version by 1"

  # --- GrowthScenario --------------------------------------------------------
  - method: POST
    path: "/planning/growth-scenarios"
    description: "Create a growth projection scenario pinned to a certified LAND_USE inventory. Computes capacity and demand at creation."
    roles: [PlanningStaff]
    code: 201
    input: [plan_update_id, land_use_inventory_id, expected_inventory_version, label, method, horizon_year, base_households, annual_household_growth_rate, job_growth_total, demolition_replacement_units]
    output: GrowthScenario
    side_effects:
      - "capacity_variant, land_capacity_units, projected_demand_units and capacity_gap_units computed"
      - "InventoryDataset.referencing_scenario_count += 1 and increments InventoryDataset.version by 1"

  - method: GET
    path: "/planning/growth-scenarios/{id}"
    description: "Read one growth scenario with its capacity and demand results."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: []
    output: GrowthScenario
    side_effects: []

  - method: GET
    path: "/planning/growth-scenarios"
    description: "List growth scenarios (reverse lookup for both GrowthScenario.plan_update_id and GrowthScenario.land_use_inventory_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["plan_update_id?", "land_use_inventory_id?", "status?", "method?", "limit?", "offset?"]
    output: GrowthScenario[]
    side_effects: []

  - method: POST
    path: "/planning/growth-scenarios/{id}/adopt"
    description: "Adopt a scenario as the plan's official projection; re-runs the housing allocation waterfall for all four tiers."
    roles: [PlanningDirector]
    code: 200
    input: []
    output: GrowthScenario
    side_effects:
      - "DRAFT -> ADOPTED; any previously ADOPTED scenario of the plan -> SUPERSEDED"
      - "PlanUpdate.adopted_scenario_id := this id; all HousingAllocation rows recomputed by calculation housing_allocation_waterfall"
      - "PlanUpdate.housing_shortfall_total and compliance_posture recomputed; increments PlanUpdate.version by 1"

  # --- HousingAllocation -----------------------------------------------------
  - method: POST
    path: "/planning/housing-allocations"
    description: "Record the state-assigned housing allocation for one income tier of a plan."
    roles: [StateReviewer]
    code: 201
    input: [plan_update_id, income_tier, assigned_units, cycle_deadline]
    output: HousingAllocation
    side_effects:
      - "calculation housing_allocation_waterfall runs over all existing tiers of the plan in TIER_ORDER"
      - "PlanUpdate.housing_shortfall_total and compliance_posture recomputed; increments PlanUpdate.version by 1"

  - method: GET
    path: "/planning/plan-updates/{id}/housing-allocations"
    description: "List the four income-tier allocations of a plan with their waterfall results (reverse lookup for HousingAllocation.plan_update_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["income_tier?", "limit?", "offset?"]
    output: HousingAllocation[]
    side_effects: []

  # --- PlanElement -----------------------------------------------------------
  - method: POST
    path: "/planning/plan-elements"
    description: "Start drafting one statutory element of the plan."
    roles: [PlanningStaff]
    code: 201
    input: [plan_update_id, element_type, title, draft_body, "policy_count?"]
    output: PlanElement
    side_effects:
      - "status := DRAFT; consistency_status := PENDING; revision_round := 0; authored_by_user_id := X-User-ID"

  - method: GET
    path: "/planning/plan-elements/{id}"
    description: "Read one plan element, including its current version for OCC pinning by amendments."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: []
    output: PlanElement
    side_effects: []

  - method: GET
    path: "/planning/plan-updates/{id}/plan-elements"
    description: "List the elements of a plan (reverse lookup for PlanElement.plan_update_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["element_type?", "status?", "limit?", "offset?"]
    output: PlanElement[]
    side_effects: []

  - method: PATCH
    path: "/planning/plan-elements/{id}"
    description: "Revise element content. From REVISION_REQUESTED this returns the element to DRAFT; from ESCALATED it requires the PlanningDirector override and resets revision_round."
    roles: [PlanningStaff, PlanningDirector]
    code: 200
    input: ["title?", "draft_body?", "policy_count?"]
    output: PlanElement
    side_effects:
      - "REVISION_REQUESTED -> DRAFT, ESCALATED -> DRAFT (director only, revision_round := 0), or a DRAFT self-loop"
      - "increments PlanElement.version by 1"

  - method: POST
    path: "/planning/plan-elements/{id}/submit-review"
    description: "Submit a drafted element for director review."
    roles: [PlanningStaff]
    code: 200
    input: []
    output: PlanElement
    side_effects:
      - "DRAFT -> IN_REVIEW; increments PlanElement.version by 1"

  - method: POST
    path: "/planning/plan-elements/{id}/review-decision"
    description: "Record the director's review decision: APPROVE, or REQUEST_REVISION which loops the element back (or escalates it on the third round)."
    roles: [PlanningDirector]
    code: 200
    input: [decision, "review_note?"]
    output: PlanElement
    side_effects:
      - "IN_REVIEW -> APPROVED, IN_REVIEW -> REVISION_REQUESTED, or IN_REVIEW -> ESCALATED at the MAX_REVISION_ROUNDS boundary"
      - "on APPROVE: consistency_status := CLEARED, PlanUpdate.required_elements_complete_count and compliance_posture recomputed, increments PlanUpdate.version by 1"
      - "increments PlanElement.version by 1"

  # --- ConsistencyLink -------------------------------------------------------
  - method: POST
    path: "/planning/consistency-links"
    description: "Declare an internal-consistency dependency from one element to another; rejects self links, duplicates and cycles."
    roles: [PlanningStaff]
    code: 201
    input: [source_element_id, target_element_id, dependency_type]
    output: ConsistencyLink
    side_effects:
      - "status := OPEN; source element consistency_status := PENDING"
      - "PlanUpdate.open_consistency_link_count += 1 and compliance_posture -> CONSISTENCY_HOLD; increments PlanUpdate.version by 1"

  - method: GET
    path: "/planning/consistency-links/{id}"
    description: "Read one consistency link."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: []
    output: ConsistencyLink
    side_effects: []

  - method: GET
    path: "/planning/consistency-links"
    description: "List consistency links (reverse lookup for both ConsistencyLink.source_element_id and ConsistencyLink.target_element_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["source_element_id?", "target_element_id?", "status?", "dependency_type?", "limit?", "offset?"]
    output: ConsistencyLink[]
    side_effects: []

  - method: POST
    path: "/planning/consistency-links/{id}/reconcile"
    description: "Record that the two elements have been reconciled; clears the link from OPEN or STALE."
    roles: [PlanningDirector]
    code: 200
    input: [reconciliation_note]
    output: ConsistencyLink
    side_effects:
      - "OPEN -> CLEARED or STALE -> CLEARED; staled_by_amendment_id := null"
      - "source element consistency_status recomputed; PlanUpdate.open_consistency_link_count and compliance_posture recomputed; BLOCKED hearings return to SCHEDULED when posture becomes CLEAR"
      - "increments PlanUpdate.version by 1"

  # --- Venue -----------------------------------------------------------------
  - method: POST
    path: "/planning/venues"
    description: "Register a meeting facility usable by engagement activities. Venues are immutable configuration rows (no version, no update endpoint)."
    roles: [PlanningStaff]
    code: 201
    input: [name, seated_capacity, "turnover_buffer_minutes?", "ada_accessible?", "transit_served?"]
    output: Venue
    side_effects: []

  # --- EngagementActivity ----------------------------------------------------
  - method: POST
    path: "/planning/engagement-activities"
    description: "Schedule a workshop, survey or targeted-outreach activity; runs the venue occupancy test with the venue's turnover buffer."
    roles: [PlanningStaff]
    code: 201
    input: [plan_update_id, activity_type, title, start_at, end_at, "venue_id?", "interpretation_offered?"]
    output: EngagementActivity
    side_effects:
      - "status := SCHEDULED; weighting_variant := OUTREACH_WEIGHTED for TARGETED_OUTREACH else STANDARD"

  - method: GET
    path: "/planning/engagement-activities/{id}"
    description: "Read one engagement activity with its participation counters."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: []
    output: EngagementActivity
    side_effects: []

  - method: GET
    path: "/planning/engagement-activities"
    description: "List engagement activities (reverse lookup for both EngagementActivity.plan_update_id and EngagementActivity.venue_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["plan_update_id?", "venue_id?", "activity_type?", "status?", "limit?", "offset?"]
    output: EngagementActivity[]
    side_effects: []

  - method: POST
    path: "/planning/engagement-activities/{id}/complete"
    description: "Close an activity that has ended and fold its weighted participation into the plan's equity share."
    roles: [PlanningStaff]
    code: 200
    input: []
    output: EngagementActivity
    side_effects:
      - "SCHEDULED -> COMPLETED; equity_share_pct computed by calculation activity_equity_share_pct"
      - "PlanUpdate.participation_weight_total, underrepresented_weight_total, equity_share_pct and compliance_posture recomputed; BLOCKED hearings return to SCHEDULED when posture becomes CLEAR"
      - "increments PlanUpdate.version by 1"

  - method: POST
    path: "/planning/engagement-activities/{id}/cancel"
    description: "Cancel a scheduled or completed activity; cancelling a completed activity compensates the plan's participation totals exactly."
    roles: [PlanningStaff]
    code: 200
    input: ["cancellation_reason?"]
    output: EngagementActivity
    side_effects:
      - "SCHEDULED -> CANCELLED or COMPLETED -> CANCELLED; the venue interval is released"
      - "on COMPLETED -> CANCELLED: PlanUpdate.participation_weight_total and underrepresented_weight_total debited, equity_share_pct and compliance_posture recomputed, invariant participation_weight_conservation restored"
      - "increments PlanUpdate.version by 1"

  # --- ParticipationRecord ---------------------------------------------------
  - method: POST
    path: "/planning/participation-records"
    description: "Attach one pseudonymous participation record (survey response, workshop sign-in or outreach contact) to a scheduled activity."
    roles: [PlanningStaff]
    code: 201
    input: [activity_id, respondent_ref, demographic_group, census_tract, "interpreter_used?", "comment_text?"]
    output: ParticipationRecord
    side_effects:
      - "is_underrepresented and weight computed by calculation participation_record_weight"
      - "EngagementActivity.record_count, underrepresented_record_count, total_weighted_count and underrepresented_weighted_count updated; increments EngagementActivity.version by 1"

  - method: GET
    path: "/planning/engagement-activities/{id}/participation-records"
    description: "List the participation records of an activity (reverse lookup for ParticipationRecord.activity_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["demographic_group?", "limit?", "offset?"]
    output: ParticipationRecord[]
    side_effects: []

  # --- EnvironmentalReview ---------------------------------------------------
  - method: POST
    path: "/planning/environmental-reviews"
    description: "Open an environmental review (EIR or negative declaration) on the plan and its alternatives."
    roles: [EnvironmentalConsultant]
    code: 201
    input: [plan_update_id, document_type, title]
    output: EnvironmentalReview
    side_effects:
      - "status := DRAFT; alternative_count := 0"

  - method: GET
    path: "/planning/environmental-reviews/{id}"
    description: "Read one environmental review with its comment-period window and preferred alternative."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: []
    output: EnvironmentalReview
    side_effects: []

  - method: GET
    path: "/planning/environmental-reviews"
    description: "List environmental reviews (reverse lookup for both EnvironmentalReview.plan_update_id and EnvironmentalReview.preferred_alternative_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["plan_update_id?", "status?", "document_type?", "preferred_alternative_id?", "limit?", "offset?"]
    output: EnvironmentalReview[]
    side_effects: []

  - method: POST
    path: "/planning/environmental-reviews/{id}/circulate"
    description: "Release the document for public comment; stamps the statutory comment window from the logical clock."
    roles: [EnvironmentalConsultant]
    code: 200
    input: []
    output: EnvironmentalReview
    side_effects:
      - "DRAFT -> CIRCULATED; circulated_at := clock; comment_period_days := 45 for EIR or 30 for NEGATIVE_DECLARATION; comment_period_ends_at computed"
      - "increments EnvironmentalReview.version by 1"

  - method: POST
    path: "/planning/environmental-reviews/{id}/select-preferred-alternative"
    description: "Server-side selector: picks the eligible alternative with the lowest net_impact_score (tie-breaks: raw_impact_score ASC, then created_at ASC) and returns the winner. No alternative id is supplied by the client."
    roles: [EnvironmentalConsultant]
    code: 200
    input: []
    output: PlanAlternative
    side_effects:
      - "winner EVALUATED -> PREFERRED; any incumbent PREFERRED -> SUPERSEDED"
      - "EnvironmentalReview.preferred_alternative_id := winner id; increments EnvironmentalReview.version by 1"
      - "empty candidate pool -> ERR_NO_ELIGIBLE_ALTERNATIVE and nothing is mutated"

  - method: POST
    path: "/planning/environmental-reviews/{id}/certify"
    description: "Certify the environmental document once the comment period has elapsed and a preferred alternative exists."
    roles: [PlanningDirector]
    code: 200
    input: []
    output: EnvironmentalReview
    side_effects:
      - "CIRCULATED -> CERTIFIED; certified_at := clock; other reviews of the plan -> SUPERSEDED"
      - "increments EnvironmentalReview.version by 1"

  # --- PlanAlternative -------------------------------------------------------
  - method: POST
    path: "/planning/plan-alternatives"
    description: "Add an alternative to a draft environmental review and score its impacts."
    roles: [EnvironmentalConsultant]
    code: 201
    input: [environmental_review_id, label, traffic_vmt_index, ghg_index, habitat_index, water_index]
    output: PlanAlternative
    side_effects:
      - "raw_impact_score, mitigation_credit and net_impact_score computed by calculation alternative_net_impact_score"
      - "EnvironmentalReview.alternative_count += 1; increments EnvironmentalReview.version by 1"

  - method: GET
    path: "/planning/environmental-reviews/{id}/plan-alternatives"
    description: "List the alternatives of a review with their impact scores (reverse lookup for PlanAlternative.environmental_review_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PlanAlternative[]
    side_effects: []

  # --- Hearing ---------------------------------------------------------------
  - method: POST
    path: "/planning/hearings"
    description: "Schedule a planning commission or council adoption hearing; enforces notice lead time, closed-interval calendar conflicts and the daily cap per body."
    roles: [CommissionClerk]
    code: 201
    input: [plan_update_id, body_type, scheduled_start, scheduled_end, notice_published_at]
    output: Hearing
    side_effects:
      - "status := SCHEDULED; amendment_count := 0; adopted_amendment_count := 0"

  - method: GET
    path: "/planning/hearings/{id}"
    description: "Read one hearing with its outcome and amendment counters."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: []
    output: Hearing
    side_effects: []

  - method: GET
    path: "/planning/plan-updates/{id}/hearings"
    description: "List the hearings of a plan (reverse lookup for Hearing.plan_update_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["body_type?", "status?", "limit?", "offset?"]
    output: Hearing[]
    side_effects: []

  - method: POST
    path: "/planning/hearings/{id}/open"
    description: "Gavel in a scheduled hearing; requires the clock to have reached scheduled_start and the plan posture to be CLEAR."
    roles: [CommissionClerk]
    code: 200
    input: []
    output: Hearing
    side_effects:
      - "SCHEDULED -> OPEN; opened_at := clock"
      - "increments Hearing.version by 1"

  - method: POST
    path: "/planning/hearings/{id}/outcome"
    description: "Record the hearing outcome: CONTINUE, RECOMMEND, ADOPT or DENY. Each branch fires a different side-effect set on the plan."
    roles: [CommissionClerk]
    code: 200
    input: [outcome, "minutes_note?"]
    output: Hearing
    side_effects:
      - "OPEN -> CONTINUED / RECOMMENDED / ADOPTED_OUT / DENIED per the outcome"
      - "RECOMMEND: PlanUpdate STATE_CERTIFIED -> COMMISSION_RECOMMENDED"
      - "ADOPT: PlanUpdate COMMISSION_RECOMMENDED -> ADOPTED with elements ADOPTED and implementation actions SCHEDULED with due_at"
      - "DENY on a COUNCIL hearing: PlanUpdate COMMISSION_RECOMMENDED -> DRAFTING with the demotion cascade"
      - "increments Hearing.version by 1"

  # --- Amendment -------------------------------------------------------------
  - method: POST
    path: "/planning/amendments"
    description: "Move an amendment against an approved element during an open hearing. Requires the element version the clerk last observed (OCC)."
    roles: [CommissionClerk]
    code: 201
    input: [hearing_id, target_element_id, summary, policy_delta, expected_element_version]
    output: Amendment
    side_effects:
      - "status := PROPOSED; element_version_at_proposal := expected_element_version; proposed_by_user_id := X-User-ID"
      - "Hearing.amendment_count += 1; increments Hearing.version by 1"
      - "increments PlanElement.version by 1 (the element is docketed and its updated_at refreshed)"

  - method: GET
    path: "/planning/amendments/{id}"
    description: "Read one amendment with its applied policy count and captured prior element status."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: []
    output: Amendment
    side_effects: []

  - method: GET
    path: "/planning/amendments"
    description: "List amendments (reverse lookup for both Amendment.hearing_id and Amendment.target_element_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["hearing_id?", "target_element_id?", "status?", "limit?", "offset?"]
    output: Amendment[]
    side_effects: []

  - method: POST
    path: "/planning/amendments/{id}/adopt"
    description: "Adopt a proposed amendment; applies policy_delta to the element and fires the five-link consistency cascade. The adopter must not be the proposer."
    roles: [CommissionClerk]
    code: 200
    input: []
    output: Amendment
    side_effects:
      - "PROPOSED -> ADOPTED; prior_element_status captured; PlanElement.policy_count += policy_delta; applied_policy_count recorded"
      - "element consistency_status := STALE; CLEARED links to that element -> STALE; their source elements STALE; posture -> CONSISTENCY_HOLD; SCHEDULED hearings -> BLOCKED"
      - "Hearing.adopted_amendment_count += 1; increments PlanUpdate.version by 1"

  - method: POST
    path: "/planning/amendments/{id}/withdraw"
    description: "Withdraw a proposed amendment before it is voted on; leaves the element untouched."
    roles: [CommissionClerk]
    code: 200
    input: ["withdrawal_reason?"]
    output: Amendment
    side_effects:
      - "PROPOSED -> WITHDRAWN; increments Amendment.version by 1"

  - method: POST
    path: "/planning/amendments/{id}/rescind"
    description: "Rescind an adopted amendment during the same open hearing; reverses every effect of the adoption."
    roles: [CommissionClerk]
    code: 200
    input: [rescission_reason]
    output: Amendment
    side_effects:
      - "ADOPTED -> RESCINDED; PlanElement.policy_count and status restored; links staled by this amendment -> CLEARED"
      - "PlanUpdate.open_consistency_link_count and compliance_posture recomputed; invariant policy_count_conservation restored"
      - "increments PlanUpdate.version by 1"

  # --- ImplementationAction --------------------------------------------------
  - method: POST
    path: "/planning/implementation-actions"
    description: "Add a zoning-code update, capital project, program or monitoring action to the implementation program with its monitoring indicator."
    roles: [PlanningStaff]
    code: 201
    input: [plan_update_id, source_element_id, action_type, title, indicator_name, indicator_direction, baseline_value, target_value]
    output: ImplementationAction
    side_effects:
      - "status := PENDING; reading_count := 0; on_track := false"

  - method: GET
    path: "/planning/implementation-actions/{id}"
    description: "Read one implementation action with its latest indicator reading."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: []
    output: ImplementationAction
    side_effects: []

  - method: GET
    path: "/planning/implementation-actions"
    description: "List implementation actions (reverse lookup for both ImplementationAction.plan_update_id and ImplementationAction.source_element_id)."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: ["plan_update_id?", "source_element_id?", "status?", "action_type?", "limit?", "offset?"]
    output: ImplementationAction[]
    side_effects: []

  - method: POST
    path: "/planning/implementation-actions/{id}/record-reading"
    description: "Record a monitoring indicator reading; recomputes on_track inclusively against target_value."
    roles: [PlanningStaff]
    code: 200
    input: [reading_value]
    output: ImplementationAction
    side_effects:
      - "latest_reading_value, latest_reading_at, reading_count and on_track updated by calculation indicator_on_track"
      - "PlanUpdate.monitoring_on_track_count recomputed; increments ImplementationAction.version by 1"

  - method: POST
    path: "/planning/implementation-actions/{id}/complete"
    description: "Mark an implementation action complete; only allowed once its indicator is on track."
    roles: [PlanningStaff]
    code: 200
    input: []
    output: ImplementationAction
    side_effects:
      - "SCHEDULED -> COMPLETED; increments ImplementationAction.version by 1"

  # --- Test-driving endpoint (outside the public business surface) ------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every deadline, notice-period, comment-period and activity-end comparison is evaluated against that fixed default, never against real wall-clock time. Time may be moved forward or backward."
    roles: [PlanningStaff, PlanningDirector, EnvironmentalConsultant, CommissionClerk, StateReviewer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "no entity is mutated; subsequent requests evaluate every temporal rule against the new instant"
# 1.6 Error Code Catalog
# =============================================================================

errors:
  # --- auth / authorization --------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "X-User-ID equals the actor recorded on the preceding step: certifying an inventory one authored, deciding review on an element one authored, or adopting an amendment one proposed"
  - id: ERR_ESCALATION_OVERRIDE_REQUIRED
    http: 403
    condition: "PATCH of a PlanElement in status ESCALATED attempted by PlanningStaff; only PlanningDirector may override the escalation"

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "request body or query violates the endpoint input schema: missing required field, unknown enum member, out-of-range number, malformed ISO 8601 UTC datetime, end_at <= start_at, scheduled_end <= scheduled_start, LAND_USE acreage fields supplied for a non-LAND_USE inventory or omitted for a LAND_USE one, venue_id supplied for a SURVEY or omitted for a WORKSHOP/TARGETED_OUTREACH, deficient_element_types not a non-empty subset of REQUIRED_ELEMENT_TYPES, limit outside 1..100 or offset < 0"

  # --- existence ------------------------------------------------------------
  - id: ERR_PLAN_UPDATE_NOT_FOUND
    http: 404
    condition: "plan_update_id in the path or body does not resolve"
  - id: ERR_INVENTORY_NOT_FOUND
    http: 404
    condition: "inventory_dataset_id or land_use_inventory_id does not resolve"
  - id: ERR_SCENARIO_NOT_FOUND
    http: 404
    condition: "growth_scenario_id does not resolve"
  - id: ERR_ELEMENT_NOT_FOUND
    http: 404
    condition: "plan_element_id, source_element_id, target_element_id or a referenced element id does not resolve"
  - id: ERR_LINK_NOT_FOUND
    http: 404
    condition: "consistency_link_id does not resolve"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "venue_id supplied on activity creation does not resolve"
  - id: ERR_ACTIVITY_NOT_FOUND
    http: 404
    condition: "engagement_activity_id in the path, or activity_id in a participation record, does not resolve"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "environmental_review_id does not resolve"
  - id: ERR_HEARING_NOT_FOUND
    http: 404
    condition: "hearing_id does not resolve"
  - id: ERR_AMENDMENT_NOT_FOUND
    http: 404
    condition: "amendment_id does not resolve"
  - id: ERR_ACTION_NOT_FOUND
    http: 404
    condition: "implementation_action_id does not resolve"

  # --- state preconditions ---------------------------------------------------
  - id: ERR_PLAN_ALREADY_ADOPTED
    http: 409
    condition: "any write against a PlanUpdate whose status is ADOPTED (the terminal state locks the whole aggregate)"
  - id: ERR_PLAN_NOT_DRAFTING
    http: 409
    condition: "state submission attempted from a status other than DRAFTING or STATE_DEFICIENT"
  - id: ERR_PLAN_NOT_SUBMITTED
    http: 409
    condition: "state determination recorded while state_review_status is not SUBMITTED"
  - id: ERR_PLAN_NOT_CERTIFIED
    http: 409
    condition: "a COMMISSION hearing is opened, or a RECOMMEND outcome recorded, while PlanUpdate.status is not STATE_CERTIFIED"
  - id: ERR_PLAN_NOT_RECOMMENDED
    http: 409
    condition: "an ADOPT or DENY outcome recorded while PlanUpdate.status is not COMMISSION_RECOMMENDED"
  - id: ERR_INVENTORY_NOT_DRAFT
    http: 409
    condition: "certify attempted on an InventoryDataset already CERTIFIED or SUPERSEDED"
  - id: ERR_INVENTORY_NOT_CERTIFIED
    http: 409
    condition: "a GrowthScenario pins an InventoryDataset whose status is not CERTIFIED"
  - id: ERR_INVENTORY_TYPE_MISMATCH
    http: 409
    condition: "the dataset pinned as land_use_inventory_id has inventory_type != LAND_USE"
  - id: ERR_INVENTORY_SET_INCOMPLETE
    http: 409
    condition: "scenario adoption attempted while the plan lacks a CERTIFIED dataset for each of the four inventory types"
  - id: ERR_ADOPTED_SCENARIO_PINNED
    http: 409
    condition: "an InventoryDataset referenced by an ADOPTED GrowthScenario is superseded by certifying a newer dataset of the same type"
  - id: ERR_SCENARIO_NOT_DRAFT
    http: 409
    condition: "adopt attempted on a GrowthScenario already ADOPTED or SUPERSEDED"
  - id: ERR_SCENARIO_NOT_ADOPTED
    http: 409
    condition: "the plan has no ADOPTED GrowthScenario when one is required (state submission, allocation waterfall)"
  - id: ERR_ELEMENT_NOT_DRAFT
    http: 409
    condition: "submit-review attempted on an element whose status is not DRAFT"
  - id: ERR_ELEMENT_NOT_IN_REVIEW
    http: 409
    condition: "review-decision attempted on an element whose status is not IN_REVIEW"
  - id: ERR_ELEMENT_NOT_AMENDABLE
    http: 409
    condition: "PATCH attempted on an element in IN_REVIEW, APPROVED or ADOPTED"
  - id: ERR_TARGET_ELEMENT_NOT_REVIEWABLE
    http: 409
    condition: "an Amendment targets an element whose status is not APPROVED or ADOPTED"
  - id: ERR_LINK_ALREADY_CLEARED
    http: 409
    condition: "reconcile attempted on a ConsistencyLink already CLEARED"
  - id: ERR_ACTIVITY_NOT_SCHEDULED
    http: 409
    condition: "a participation record is attached to, or complete is called on, an activity whose status is not SCHEDULED"
  - id: ERR_ACTIVITY_CLOSED
    http: 409
    condition: "cancel attempted on an activity already CANCELLED"
  - id: ERR_REVIEW_NOT_DRAFT
    http: 409
    condition: "an alternative is added to, or circulate is called on, a review whose status is not DRAFT"
  - id: ERR_REVIEW_NOT_CIRCULATED
    http: 409
    condition: "select-preferred-alternative or certify called on a review whose status is not CIRCULATED"
  - id: ERR_HEARING_NOT_SCHEDULED
    http: 409
    condition: "open attempted on a hearing whose status is not SCHEDULED (including a hearing BLOCKED by the plan's posture)"
  - id: ERR_HEARING_NOT_OPEN
    http: 409
    condition: "outcome, amendment creation, adoption, withdrawal or rescission attempted while the hearing is not OPEN"
  - id: ERR_AMENDMENT_NOT_PROPOSED
    http: 409
    condition: "adopt or withdraw attempted on an amendment whose status is not PROPOSED"
  - id: ERR_AMENDMENT_NOT_ADOPTED
    http: 409
    condition: "rescind attempted on an amendment whose status is not ADOPTED"
  - id: ERR_ACTION_NOT_SCHEDULED
    http: 409
    condition: "complete called on an implementation action still PENDING (the plan is not adopted yet, so the action was never scheduled); monitoring readings are accepted while PENDING and are not covered by this error"
  - id: ERR_ACTION_ALREADY_COMPLETED
    http: 409
    condition: "complete called on an implementation action already COMPLETED"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_ELEMENT_VERSION
    http: 412
    condition: "expected_element_version on POST /planning/amendments does not equal PlanElement.version at the moment of the write"
  - id: ERR_STALE_INVENTORY_VERSION
    http: 412
    condition: "expected_inventory_version on POST /planning/growth-scenarios does not equal InventoryDataset.version at the moment of the write"

  # --- referential / cross-aggregate ownership -------------------------------
  - id: ERR_CROSS_PLAN_LINK
    http: 409
    condition: "the source and target elements of a ConsistencyLink belong to different plan updates, or a GrowthScenario pins an inventory of a different plan"
  - id: ERR_CROSS_PLAN_AMENDMENT
    http: 409
    condition: "an Amendment's target element belongs to a plan other than its hearing's plan"
  - id: ERR_CROSS_PLAN_ACTION
    http: 409
    condition: "an ImplementationAction's source element belongs to a plan other than plan_update_id"
  - id: ERR_HORIZON_YEAR_MISMATCH
    http: 422
    condition: "a GrowthScenario's horizon_year differs from PlanUpdate.horizon_year"

  # --- graph integrity of the consistency network ----------------------------
  - id: ERR_SELF_CONSISTENCY_LINK
    http: 422
    condition: "source_element_id == target_element_id"
  - id: ERR_DUPLICATE_CONSISTENCY_LINK
    http: 409
    condition: "a ConsistencyLink with the same (source_element_id, target_element_id) pair already exists"
  - id: ERR_CONSISTENCY_CYCLE
    http: 409
    condition: "the proposed edge closes a directed cycle over links with status IN {OPEN, CLEARED, STALE}"

  # --- scope uniqueness ------------------------------------------------------
  - id: ERR_DUPLICATE_ELEMENT_TYPE
    http: 409
    condition: "a PlanElement of that element_type already exists on the plan"
  - id: ERR_DUPLICATE_ALLOCATION_TIER
    http: 409
    condition: "a HousingAllocation for that income_tier already exists on the plan"
  - id: ERR_DUPLICATE_PARTICIPATION
    http: 409
    condition: "a ParticipationRecord with that respondent_ref already exists on the activity"

  # --- content readiness -----------------------------------------------------
  - id: ERR_ELEMENT_HAS_NO_POLICIES
    http: 409
    condition: "submit-review on an element whose policy_count is 0"
  - id: ERR_INSUFFICIENT_ALTERNATIVES
    http: 409
    condition: "circulate on a review carrying fewer than MIN_ALTERNATIVES (2) alternatives"
  - id: ERR_VENUE_NOT_EQUITY_ELIGIBLE
    http: 409
    condition: "a TARGETED_OUTREACH activity is booked at a venue that is not both ada_accessible and transit_served"
  - id: ERR_POLICY_COUNT_NEGATIVE
    http: 409
    condition: "adopting an amendment whose policy_delta would drive PlanElement.policy_count below 0"

  # --- hearing calendar and outcome legality ---------------------------------
  - id: ERR_VENUE_TIME_CONFLICT
    http: 409
    condition: "the requested activity interval, expanded by the venue's turnover buffer on both sides, overlaps a SCHEDULED or COMPLETED activity at the same venue (half-open comparison)"
  - id: ERR_HEARING_SLOT_CONFLICT
    http: 409
    condition: "the requested hearing interval overlaps an existing SCHEDULED, BLOCKED or OPEN hearing of the same plan and body_type (closed comparison: touching endpoints conflict)"
  - id: ERR_HEARING_DAILY_CAP_EXCEEDED
    http: 409
    condition: "the plan already has MAX_HEARINGS_PER_BODY_PER_DAY (2) hearings of that body_type starting on the same UTC calendar date"
  - id: ERR_NOTICE_PERIOD_TOO_SHORT
    http: 422
    condition: "notice_published_at is later than scheduled_start minus HEARING_NOTICE_DAYS (10) days"
  - id: ERR_REVIEW_WINDOW_OVERLAP
    http: 409
    condition: "the new comment window overlaps the window of another CIRCULATED or CERTIFIED review of the same plan (closed comparison)"
  - id: ERR_COMMISSION_RECOMMENDATION_REQUIRED
    http: 409
    condition: "a COUNCIL hearing is scheduled before PlanUpdate.status reaches COMMISSION_RECOMMENDED"
  - id: ERR_OUTCOME_NOT_VALID_FOR_BODY
    http: 409
    condition: "RECOMMEND recorded on a COUNCIL hearing, or ADOPT recorded on a COMMISSION hearing"
  - id: ERR_UNRESOLVED_AMENDMENTS
    http: 409
    condition: "a RECOMMEND or ADOPT outcome is recorded while an Amendment of that hearing is still PROPOSED"

  # --- logical-clock gates ---------------------------------------------------
  - id: ERR_HEARING_NOT_YET_STARTED
    http: 409
    condition: "open called before the logical clock reaches scheduled_start"
  - id: ERR_COMMENT_PERIOD_OPEN
    http: 409
    condition: "certify called before the logical clock reaches comment_period_ends_at"
  - id: ERR_ACTIVITY_NOT_ENDED
    http: 409
    condition: "complete called before the logical clock reaches end_at"
  - id: ERR_INVENTORY_VINTAGE_TOO_LATE
    http: 409
    condition: "vintage_year is later than PlanUpdate.base_year"

  # --- state mandate compliance ---------------------------------------------
  - id: ERR_REQUIRED_ELEMENT_MISSING
    http: 409
    condition: "state submission attempted while any of the five REQUIRED_ELEMENT_TYPES lacks a PlanElement in APPROVED or ADOPTED"
  - id: ERR_ALLOCATION_INCOMPLETE
    http: 409
    condition: "state submission attempted while any of the four TIER_ORDER income tiers has no HousingAllocation row"
  - id: ERR_CONSISTENCY_UNRESOLVED
    http: 409
    condition: "state submission attempted with open_consistency_link_count > 0, or an element approved while a link sourced from it is still OPEN or STALE"
  - id: ERR_ENVIRONMENTAL_REVIEW_MISSING
    http: 409
    condition: "state submission attempted while the plan has no EnvironmentalReview in CIRCULATED or CERTIFIED"
  - id: ERR_ENVIRONMENTAL_REVIEW_NOT_CERTIFIED
    http: 409
    condition: "a COUNCIL hearing is opened, or a RECOMMEND outcome recorded, while the plan has no CERTIFIED EnvironmentalReview"
  - id: ERR_PREFERRED_ALTERNATIVE_NOT_SELECTED
    http: 409
    condition: "certify called on a review whose preferred_alternative_id is still null"
  - id: ERR_PLAN_POSTURE_BLOCKED
    http: 409
    condition: "a hearing is opened or given a RECOMMEND/ADOPT outcome while PlanUpdate.compliance_posture is not CLEAR"
  - id: ERR_RESUBMISSION_LIMIT_EXCEEDED
    http: 409
    condition: "resubmission attempted when PlanUpdate.resubmission_count has already reached MAX_RESUBMISSIONS (2)"

  # --- fiscal / capacity / equity -------------------------------------------
  - id: ERR_HOUSING_SHORTFALL
    http: 409
    condition: "state submission attempted while PlanUpdate.housing_shortfall_total > 0"
  - id: ERR_EQUITY_TARGET_NOT_MET
    http: 409
    condition: "state submission attempted while PlanUpdate.equity_share_pct < EQUITY_MIN_SHARE_PCT (40.0)"

  # --- empty-set guards ------------------------------------------------------
  - id: ERR_NO_ELIGIBLE_ALTERNATIVE
    http: 409
    condition: "select-preferred-alternative finds no PlanAlternative in status EVALUATED on the review"
  - id: ERR_NO_PARTICIPATION_RECORDS
    http: 409
    condition: "complete called on an activity whose record_count is 0"
  - id: ERR_NO_INDICATOR_READING
    http: 409
    condition: "complete called on an implementation action whose reading_count is 0"
  - id: ERR_INDICATOR_OFF_TRACK
    http: 409
    condition: "complete called on an implementation action whose on_track is false"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================

roles:
  - name: PlanningStaff
    description: "Long-range planners who assemble the existing-conditions inventories, build growth scenarios, draft the elements, wire the internal-consistency network, run the public engagement program and maintain the implementation program. They author but never approve."
    identity: opaque
    exclusive_operations:
      - "POST /planning/inventory-datasets"
      - "POST /planning/growth-scenarios"
      - "POST /planning/plan-elements"
      - "POST /planning/plan-elements/{id}/submit-review"
      - "POST /planning/consistency-links"
      - "POST /planning/venues"
      - "POST /planning/engagement-activities"
      - "POST /planning/engagement-activities/{id}/complete"
      - "POST /planning/engagement-activities/{id}/cancel"
      - "POST /planning/participation-records"
      - "POST /planning/implementation-actions"
      - "POST /planning/implementation-actions/{id}/record-reading"
      - "POST /planning/implementation-actions/{id}/complete"
    shared_operations:
      - "PATCH /planning/plan-elements/{id} (shared with PlanningDirector; staff may not revise an ESCALATED element)"
      - "all GET endpoints under /planning"
      - "POST /_clock/set_current_utc"

  - name: PlanningDirector
    description: "Department head who owns approvals: certifies inventories, adopts the official growth scenario, decides element reviews, reconciles consistency links, certifies the environmental document and submits the plan to the state. Segregation of duties forbids approving work recorded under the same X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /planning/plan-updates"
      - "POST /planning/plan-updates/{id}/state-submission"
      - "POST /planning/inventory-datasets/{id}/certify"
      - "POST /planning/growth-scenarios/{id}/adopt"
      - "POST /planning/plan-elements/{id}/review-decision"
      - "POST /planning/consistency-links/{id}/reconcile"
      - "POST /planning/environmental-reviews/{id}/certify"
    shared_operations:
      - "PATCH /planning/plan-elements/{id} (shared with PlanningStaff; only the director may revise an ESCALATED element, which resets revision_round to 0)"
      - "all GET endpoints under /planning"
      - "POST /_clock/set_current_utc"

  - name: EnvironmentalConsultant
    description: "Outside CEQA consultant who prepares the environmental document and its alternatives, circulates it for public comment and runs the preferred-alternative selector. Cannot certify its own document and cannot touch plan elements."
    identity: opaque
    exclusive_operations:
      - "POST /planning/environmental-reviews"
      - "POST /planning/plan-alternatives"
      - "POST /planning/environmental-reviews/{id}/circulate"
      - "POST /planning/environmental-reviews/{id}/select-preferred-alternative"
    shared_operations:
      - "all GET endpoints under /planning"
      - "POST /_clock/set_current_utc"

  - name: CommissionClerk
    description: "Clerk of the planning commission and city council who schedules and runs the adoption hearings and keeps the amendment record. Proposes and adopts amendments, but never the same one under one X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /planning/hearings"
      - "POST /planning/hearings/{id}/open"
      - "POST /planning/hearings/{id}/outcome"
      - "POST /planning/amendments"
      - "POST /planning/amendments/{id}/adopt"
      - "POST /planning/amendments/{id}/withdraw"
      - "POST /planning/amendments/{id}/rescind"
    shared_operations:
      - "all GET endpoints under /planning"
      - "POST /_clock/set_current_utc"

  - name: StateReviewer
    description: "State housing and community development reviewer who assigns the housing allocation by income tier and returns the mandate determination on a submitted plan. Has no authoring or hearing powers."
    identity: opaque
    exclusive_operations:
      - "POST /planning/housing-allocations"
      - "POST /planning/plan-updates/{id}/state-determination"
    shared_operations:
      - "all GET endpoints under /planning"
      - "POST /_clock/set_current_utc"
      - "POST /_clock/set_current_utc"
