          assert:
            - "${err_not_active} == ERR_BRANCH_NOT_ACTIVE with HTTP 409 (not ERR_BRANCH_HAS_OPEN_CASE: a DRAFT case is not in {SUBMITTED, APPROVED, NOTICE_FILED, CLOSURE_EXECUTED, POST_CLOSE_MONITORING})"
            - "${b101_v2} != ${b101_v} (the first creation incremented the branch version) and Branch.${b101_id}.status == UNDER_REVIEW"
            - "ConsolidationCase.${case1_id}.status == DRAFT and no second case row exists"

      - name: submitted_case_on_the_same_branch_outranks_the_not_active_diagnosis
        claim_type: priority_ordering
        grounds:
          - validations.priority_12_ERR_BRANCH_HAS_OPEN_CASE
