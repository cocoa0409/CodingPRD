      - name: device_lot_status_low_stock_boundary_at_threshold
        claim_type: side_effect_execution
        grounds: ["calculations.device_lot_status", "state_machines.DeviceLot"]
        distinguishing_aspect: "available_units == reorder_threshold is ACTIVE (>= boundary); one reservation dropping available below threshold flips the lot to LOW_STOCK."
        test_recipe:
          setup: ["Lot L qty 3 threshold 3 (ACTIVE at creation: 3 >= 3); URGENT case SCHEDULED"]
          setup_api_calls:
            - call: "POST /cath-lab/staff"
              payload: { full_name: "Dr Perform", staff_role: INTERVENTIONAL_CARDIOLOGIST }
              as: CathLabScheduler
              captures: { phys1_id: $.data.id }
            - call: "POST /cath-lab/rooms"
              payload: { room_name: "Lab 1", equipment_profile: [] }
              as: CathLabScheduler
              captures: { room1_id: $.data.id }
            - call: "POST /cath-lab/recovery-beds"
              payload: { bed_label: "Bed 1" }
              as: RecoveryNurseManager
              captures: { bed1_id: $.data.id }
            - call: "POST /cath-lab/device-lots"
              payload: { device_type: CLOSURE_DEVICE, manufacturer: "Acme", model_number: "CD-2", lot_number: "LOT-C", ownership: OWNED, quantity_on_hand: 3, reorder_threshold: 3, expiration_date: "2027-01-01T00:00:00Z" }
              as: CathLabTechnologist
              captures: { lot_id: $.data.id, st0: $.data.status }
            - call: "POST /cath-lab/cases"
              payload: { patient_mrn: "MRN-1", procedure_type: PCI, priority: URGENT, performing_physician_id: "${phys1_id}", weight_kg: 70, serum_creatinine: 1.0 }
              as: CathLabScheduler
              captures: { case_id: $.data.id }
            - call: "POST /cath-lab/cases/${case_id}/schedule"
              payload: { lab_id: "${room1_id}", scheduled_start: "2026-08-10T09:00:00Z", bed_id: "${bed1_id}" }
              as: CathLabScheduler
          trigger:
            - call: "POST /cath-lab/cases/${case_id}/device-usages"
              payload: { lot_id: "${lot_id}", quantity: 1 }
              as: CathLabTechnologist
            - call: "GET /cath-lab/device-lots/${lot_id}"
              as: CathLabTechnologist
              captures: { st1: $.data.status, avail1: $.data.available_units }
          assert:
            - "At creation: status == ACTIVE (available 3 >= threshold 3 — boundary inclusive)"
            - "After reserving 1: available_units == 2 and status == LOW_STOCK (2 < 3)"

