            - "${co_var_up} == 31280 — the disclosure is FINAL(500.00 units) 202300 minus the frozen quote 171020"
            - "${var_status} == 'ACCEPTED' AND ${up_after_var} == 0 — accepting a MEASUREMENT_VARIANCE moves no money"
            - "${co_a_up} == 4505 — 10.00 * 425 * 1.00 * 1.06"
            - "${a_status} == 'ACCEPTED' AND ${up_after_a} == 4505"
            - "${co_b_up} == 3765 — 12.00 * 296 * 1.00 * 1.06 = 3765.12 rounded"
            - "${b_status} == 'DECLINED' AND ${up_after_b} == 4505 — a declined change order is filtered out"
            - "${co_c_up} == 15582 AND ${co_c_status} == 'DRAFT' — 2.00 * 7350 * 1.06"
            - "Project.${proj_id}.change_order_upcharge_cents == 4505 — the DRAFT change order is not in the input set either"
            - "Project.${proj_id}.total_due_cents == 0 AND balance_due_cents == 0 — final_labor_cents is still null, so the total is 0 regardless of the accepted upcharge"

      - name: permit_unit_threshold_is_an_inclusive_lower_bound
