          assert:
            - "waste_pct_standard == 0.0"
            - "waste_pct_net == 0.0"
            - "target_breached == false"

      - name: locker_selection_lowest_slot_number
        claim_type: correct_result
        grounds:
          - calculations.locker_slot_selection
        distinguishing_aspect: "With slots 1 and 2 IDLE, mark-ready assigns slot 1 (lowest slot_number), not by creation order or id; after slot 1 is occupied, the next ready order takes slot 2."
        test_recipe:
          setup:
