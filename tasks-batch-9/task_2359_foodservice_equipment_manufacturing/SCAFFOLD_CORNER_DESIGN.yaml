              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, chain_v: $.data.version }
          trigger:
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: ["SPLIT_TANK"], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${chain_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { price: $.data.indicative_unit_price_cents }
          assert:
            - "${price} == 1978060"
            - "${price} != 1978061"

      - name: posture_counts_only_listed_children_and_ignores_one_still_under_review
        claim_type: Input Set Filtering
        grounds:
          - calculations.certification_posture.input_set
          - calculations.certification_posture.formula
        distinguishing_aspect: "For a DUAL-energy model the required scopes are ['SANITATION','GAS','ELECTRICAL'] in that fixed order; a granted AGENCY_ALPHA listing covering SANITATION leaves the model PARTIAL, and a second AGENCY_BETA listing covering [GAS, ELECTRICAL] contributes nothing while it sits in UNDER_REVIEW -- covered_scopes stays ['SANITATION'] and the posture stays PARTIAL."
