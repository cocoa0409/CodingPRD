scaffold_corner_design:
  # ================================================================= Entities
  - section: entities
    instances:
      - name: program_create_missing_required_field
        claim_type: required_fields
        grounds: [entities.Program.fields.min_gpa, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /programs without required min_gpa is rejected ERR_INVALID_REQUEST; no program persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { program_code: "BS-MIS", name: "M", degree_type: "BACHELOR", min_total_credits: 3, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { err_mis: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (min_gpa is required input)"
      - name: student_defaults_and_zero_computed
        claim_type: defaults
        grounds: [entities.Student.fields.financial_hold, entities.Student.fields.institutional_gpa, calculations.gpa_calculation]
        distinguishing_aspect: "Omitted financial_hold defaults to false; computed credit/GPA fields start at 0 / 0.000 (zero-denominator GPA rule)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /students", payload: { student_number: "S-DEF", legal_name: "Dee Fault" }, as: RegistrarStaff, captures: { s_def: $.data.id, def_hold: $.data.financial_hold, def_status: $.data.status, def_earned: $.data.total_earned_credits, def_gpa: $.data.institutional_gpa, def_cgpa: $.data.cumulative_gpa } }
          assert:
            - "financial_hold == false (default applied)"
            - "status == ACTIVE (initial state)"
            - "total_earned_credits == 0, institutional_gpa == 0.000, cumulative_gpa == 0.000 (GPA denominator 0 -> 0.000)"
      - name: get_missing_resources_return_not_found
        claim_type: not_found
        grounds: ["errors[ERR_PROGRAM_NOT_FOUND]", "errors[ERR_STUDENT_NOT_FOUND]", "errors[ERR_STUDENT_PROGRAM_NOT_FOUND]", "errors[ERR_APPLICATION_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns the resource-specific 404 error for each top-level resource."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /programs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: RegistrarStaff, captures: { e1: $.data.error_id } }
            - { call: "GET /students/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: RegistrarStaff, captures: { e2: $.data.error_id } }
            - { call: "GET /student-programs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: RegistrarStaff, captures: { e3: $.data.error_id } }
            - { call: "GET /applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: RegistrarStaff, captures: { e4: $.data.error_id } }
          assert:
            - "error_ids in order: ERR_PROGRAM_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_STUDENT_PROGRAM_NOT_FOUND, ERR_APPLICATION_NOT_FOUND (all 404)"
      - name: student_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.Student.fields.total_earned_credits]
        distinguishing_aspect: "Client-supplied total_earned_credits on create is ignored; the server-computed value 0 is returned."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /students", payload: { student_number: "S-IGN", legal_name: "Ig Nored", total_earned_credits: 999 }, as: RegistrarStaff, captures: { ign_earned: $.data.total_earned_credits } }
          assert:
            - "create succeeds and total_earned_credits == 0 (computed field, input ignored)"
      - name: catalog_year_bounds_checked_on_declare
        claim_type: type_constraints
        grounds: [entities.StudentProgram.fields.catalog_year, "errors[ERR_CATALOG_YEAR_OUT_OF_RANGE]"]
        distinguishing_aspect: "catalog_year == catalog_year_start is accepted (inclusive lower bound); catalog_year == catalog_year_end is rejected (exclusive upper bound)."
        test_recipe:
          setup:
            - "Program BS-BND [2024,2028); two students"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-BND", name: "BS BND", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_bnd: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-B1", legal_name: "B One" }, as: RegistrarStaff, captures: { s_b1: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-B2", legal_name: "B Two" }, as: RegistrarStaff, captures: { s_b2: $.data.id } }
          trigger:
            - { call: "POST /students/${s_b1}/programs", payload: { program_id: "${p_bnd}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_b1: $.data.id } }
            - { call: "POST /students/${s_b2}/programs", payload: { program_id: "${p_bnd}", catalog_year: 2028 }, as: RegistrarStaff, captures: { err_b2: $.data.error_id } }
          assert:
            - "catalog_year 2024 (== catalog_year_start) accepted: StudentProgram created"
            - "catalog_year 2028 (== catalog_year_end) rejected: error_id == ERR_CATALOG_YEAR_OUT_OF_RANGE (half-open upper bound)"

  # ============================================================ State machines
  - section: state_machines
    instances:
      - name: post_grade_on_completed_enrollment_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Enrollment.IN_PROGRESS_to_COMPLETED, "errors[ERR_ENROLLMENT_INVALID_STATE]"]
        distinguishing_aspect: "post-grade is only valid from IN_PROGRESS; a second post-grade on a COMPLETED enrollment fails and changes nothing."
        test_recipe:
          setup: ["course 3cr; student; enrollment created with grade B (COMPLETED, earned 3)"]
          setup_api_calls:
            - { call: "POST /courses", payload: { course_code: "PG3", title: "PG", credits: 3 }, as: RegistrarStaff, captures: { c_pg: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-PG", legal_name: "Peg Grade" }, as: RegistrarStaff, captures: { s_pg: $.data.id } }
            - { call: "POST /students/${s_pg}/enrollments", payload: { course_id: "${c_pg}", term: "2024-FA", grade: "B" }, as: RegistrarStaff, captures: { en_pg: $.data.id } }
          trigger:
            - { call: "POST /enrollments/${en_pg}/post-grade", payload: { grade: "A" }, as: RegistrarStaff, captures: { err_pg: $.data.error_id } }
            - { call: "GET /enrollments/${en_pg}", as: RegistrarStaff, captures: { pg_grade: $.data.grade, pg_earned: $.data.credits_earned } }
          assert:
            - "error_id == ERR_ENROLLMENT_INVALID_STATE"
            - "enrollment unchanged: grade == B, credits_earned == 3"
      - name: withdrawal_reversal_restores_credit
        claim_type: valid_transition
        grounds: [state_machines.Enrollment.WITHDRAWN_to_COMPLETED, state_machines.Enrollment.IN_PROGRESS_to_WITHDRAWN]
        distinguishing_aspect: "post-grade W withdraws (earned 0, excluded from GPA); grade-changes back to a letter grade restores COMPLETED and the earned credits."
        test_recipe:
          setup: ["course 3cr; student; IN_PROGRESS enrollment"]
          setup_api_calls:
            - { call: "POST /courses", payload: { course_code: "WR3", title: "WR", credits: 3 }, as: RegistrarStaff, captures: { c_wr: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-WR", legal_name: "Wren Rev" }, as: RegistrarStaff, captures: { s_wr: $.data.id } }
            - { call: "POST /students/${s_wr}/enrollments", payload: { course_id: "${c_wr}", term: "2024-FA" }, as: RegistrarStaff, captures: { en_wr: $.data.id } }
          trigger:
            - { call: "POST /enrollments/${en_wr}/post-grade", payload: { grade: "W" }, as: RegistrarStaff, captures: { wr_st1: $.data.status, wr_e1: $.data.credits_earned } }
            - { call: "POST /enrollments/${en_wr}/grade-changes", payload: { new_grade: "B", reason: "withdrawal entered in error" }, as: RegistrarStaff, captures: { wr_st2: $.data.status, wr_e2: $.data.credits_earned, wr_gp: $.data.grade_points } }
          assert:
            - "after W: status == WITHDRAWN, credits_earned == 0"
            - "after reversal: status == COMPLETED, credits_earned == 3, grade_points == 9.00"
      - name: waiver_amount_floor_zero_and_revoke_compensation
        claim_type: side_effect_execution
        grounds: [calculations.requirement_group_satisfaction, state_machines.SubstitutionWaiver.APPROVED_to_REVOKED]
        distinguishing_aspect: "WAIVER amount larger than required_credits floors effective_required at 0 (max(0, 3-5)); revoke restores the pre-approval audit values exactly."
        test_recipe:
          setup:
            - "Program BS-WV [2024,2028) min_total_credits 3 min_gpa 1.0; group G required 3 min_grade C eligible [H201]; student completed PSY101 3cr A (ineligible code); declared; CURRENT FINAL audit unsatisfied (G 0/3)"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-WV", name: "BS WV", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 1.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_wv: $.data.id } }
            - { call: "POST /programs/${p_wv}/requirement-groups", payload: { group_code: "G", required_credits: 3, min_grade: "C", eligible_course_codes: ["H201"] }, as: RegistrarStaff, captures: { g_wv: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "PSY101", title: "Psych", credits: 3 }, as: RegistrarStaff, captures: { c_wv: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-WV", legal_name: "Wyn Vee" }, as: RegistrarStaff, captures: { s_wv: $.data.id } }
            - { call: "POST /students/${s_wv}/enrollments", payload: { course_id: "${c_wv}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_wv}/programs", payload: { program_id: "${p_wv}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_wv: $.data.id, sp_wv_v: $.data.version } }
            - { call: "POST /student-programs/${sp_wv}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_wv_v}" }, as: RegistrarStaff, captures: { wv_pre: $.data.overall_satisfied } }
            - { call: "POST /student-programs/${sp_wv}/waivers", payload: { requirement_group_id: "${g_wv}", kind: "WAIVER", credit_waiver_amount: 5, reason: "prior experience" }, as: Advisor, as_user_id: "adv-1", captures: { w_wv: $.data.id } }
            - { call: "POST /substitution-waivers/${w_wv}/advisor-decision", payload: { decision: "APPROVE" }, as: Advisor, as_user_id: "adv-2" }
          trigger:
            - { call: "POST /substitution-waivers/${w_wv}/registrar-decision", payload: { decision: "APPROVE" }, as: RegistrarStaff }
            - { call: "GET /student-programs/${sp_wv}/audits", as: RegistrarStaff, captures: { wv_sat1: "$.data[0].overall_satisfied", wv_eff: "$.data[0].groups_result" } }
            - { call: "POST /substitution-waivers/${w_wv}/revoke", payload: { reason: "approved in error" }, as: RegistrarStaff }
            - { call: "GET /student-programs/${sp_wv}/audits", as: RegistrarStaff, captures: { wv_sat2: "$.data[0].overall_satisfied" } }
          assert:
            - "pre-approval FINAL audit overall_satisfied == false (group G 0/3)"
            - "after approval: effective_required_credits == 0 (max(0, 3-5) floor) and overall_satisfied == true"
            - "after revoke: overall_satisfied == false again (approval side effects fully compensated, no drift)"
      - name: diploma_state_guards
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Diploma.PENDING_to_ISSUED, state_machines.Diploma.ISSUED_to_REVOKED, "errors[ERR_DIPLOMA_INVALID_STATE]"]
        distinguishing_aspect: "reissue requires the latest diploma REVOKED (rejected while PENDING); a REVOKED diploma is terminal (issue after revoke rejected)."
        test_recipe:
          setup:
            - "Student fully conferred under BS-DG (min_total 3, policy residency 3 [2024,2027]); diploma D1 exists PENDING"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-DG", name: "BS DG", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_dg: $.data.id } }
            - { call: "POST /programs/${p_dg}/honors-policies", payload: { honors_gpa_basis: "INSTITUTIONAL", cum_threshold: 3.5, magna_threshold: 3.75, summa_threshold: 3.9, effective_first_year: 2024, effective_last_year: 2027, residency_min_credits: 3 }, as: RegistrarStaff }
            - { call: "POST /courses", payload: { course_code: "DG3", title: "DG", credits: 3 }, as: RegistrarStaff, captures: { c_dg: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-DG", legal_name: "Dee Gee" }, as: RegistrarStaff, captures: { s_dg: $.data.id } }
            - { call: "POST /students/${s_dg}/enrollments", payload: { course_id: "${c_dg}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_dg}/programs", payload: { program_id: "${p_dg}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_dg: $.data.id, sp_dg_v: $.data.version } }
            - { call: "POST /student-programs/${sp_dg}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_dg_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_dg}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_dg}", captures: { app_dg: $.data.id } }
            - { call: "POST /applications/${app_dg}/submit", payload: {}, as: Student, as_user_id: "${s_dg}" }
            - { call: "POST /applications/${app_dg}/begin-review", payload: {}, as: RegistrarStaff }
            - { call: "POST /applications/${app_dg}/decide", payload: { decision: "CLEARED" }, as: RegistrarStaff }
            - { call: "POST /applications/${app_dg}/confer", payload: {}, as: RegistrarStaff }
            - { call: "GET /diplomas", as: RegistrarStaff, captures: { d_dg: "$.data[0].id" } }
          trigger:
            - { call: "POST /applications/${app_dg}/diplomas/reissue", payload: { printed_name: "Premature Reissue", reason: "attempt before revoke" }, as: RegistrarStaff, captures: { err_dg1: $.data.error_id } }
            - { call: "POST /diplomas/${d_dg}/revoke", payload: { reason: "damage" }, as: RegistrarStaff, captures: { dg_st: $.data.status } }
            - { call: "POST /diplomas/${d_dg}/issue", payload: {}, as: RegistrarStaff, captures: { err_dg2: $.data.error_id } }
          assert:
            - "reissue while latest diploma PENDING -> error_id == ERR_DIPLOMA_INVALID_STATE"
            - "revoke succeeds -> status == REVOKED"
            - "issue after revoke -> error_id == ERR_DIPLOMA_INVALID_STATE (REVOKED terminal)"
      - name: denied_application_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.GraduationApplication.UNDER_REVIEW_to_DENIED, "errors[ERR_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "The DENIED branch of the decide fork is terminal: a further decide on a DENIED application is rejected."
        test_recipe:
          setup:
            - "Program BS-DN min_total 3; student declared (0 credits); CURRENT FINAL audit (unsatisfied); application SUBMITTED -> UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-DN", name: "BS DN", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_dn: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-DN", legal_name: "Dan Nial" }, as: RegistrarStaff, captures: { s_dn: $.data.id } }
            - { call: "POST /students/${s_dn}/programs", payload: { program_id: "${p_dn}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_dn: $.data.id, sp_dn_v: $.data.version } }
            - { call: "POST /student-programs/${sp_dn}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_dn_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_dn}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_dn}", captures: { app_dn: $.data.id } }
            - { call: "POST /applications/${app_dn}/submit", payload: {}, as: Student, as_user_id: "${s_dn}" }
            - { call: "POST /applications/${app_dn}/begin-review", payload: {}, as: RegistrarStaff }
          trigger:
            - { call: "POST /applications/${app_dn}/decide", payload: { decision: "DENIED", decision_reason: "requirements unmet" }, as: RegistrarStaff, captures: { dn_st: $.data.status, dn_reason: $.data.decision_reason } }
            - { call: "POST /applications/${app_dn}/decide", payload: { decision: "CLEARED" }, as: RegistrarStaff, captures: { err_dn: $.data.error_id } }
          assert:
            - "first decide: status == DENIED, decision_reason == requirements unmet"
            - "second decide on terminal DENIED -> error_id == ERR_APPLICATION_INVALID_STATE"
      - name: audit_supersede_on_same_kind_recreate
        claim_type: side_effect_execution
        grounds: [state_machines.DegreeAudit.CURRENT_to_SUPERSEDED]
        distinguishing_aspect: "Creating a second STANDARD audit supersedes the first; exactly one CURRENT STANDARD audit remains."
        test_recipe:
          setup: ["Program BS-SU min_total 3; student declared"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-SU", name: "BS SU", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_su: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-SU", legal_name: "Sue Per" }, as: RegistrarStaff, captures: { s_su: $.data.id } }
            - { call: "POST /students/${s_su}/programs", payload: { program_id: "${p_su}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_su: $.data.id, sp_su_v: $.data.version } }
            - { call: "POST /student-programs/${sp_su}/audits", payload: { audit_kind: "STANDARD", expected_student_program_version: "${sp_su_v}" }, as: RegistrarStaff, captures: { au_su1: $.data.id } }
            - { call: "GET /student-programs/${sp_su}", as: RegistrarStaff, captures: { sp_su_v2: $.data.version } }
          trigger:
            - { call: "POST /student-programs/${sp_su}/audits", payload: { audit_kind: "STANDARD", expected_student_program_version: "${sp_su_v2}" }, as: RegistrarStaff, captures: { au_su2: $.data.id } }
            - { call: "GET /student-programs/${sp_su}/audits?audit_kind=STANDARD&status=CURRENT", as: RegistrarStaff, captures: { su_cur: "$.data[0].id" } }
          assert:
            - "second audit create succeeded (OCC version refreshed via GET)"
            - "filtered list audit_kind=STANDARD,status=CURRENT contains exactly the second audit ${au_su2}"
            - "first audit ${au_su1} is SUPERSEDED (visible under status=SUPERSEDED filter)"
      - name: retired_program_guards
        claim_type: precondition_enforcement
        grounds: [state_machines.Program.ACTIVE_to_RETIRED, "errors[ERR_PROGRAM_INVALID_STATE]", "errors[ERR_PROGRAM_RETIRED]"]
        distinguishing_aspect: "retire works once (ACTIVE -> RETIRED); a second retire is a state error; declaring into a RETIRED program is a referential error."
        test_recipe:
          setup: ["Program BS-RT ACTIVE; student"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-RT", name: "BS RT", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_rt: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-RT", legal_name: "Ree Tyre" }, as: RegistrarStaff, captures: { s_rt: $.data.id } }
          trigger:
            - { call: "POST /programs/${p_rt}/retire", payload: {}, as: RegistrarStaff, captures: { rt_st: $.data.status } }
            - { call: "POST /programs/${p_rt}/retire", payload: {}, as: RegistrarStaff, captures: { err_rt1: $.data.error_id } }
            - { call: "POST /students/${s_rt}/programs", payload: { program_id: "${p_rt}", catalog_year: 2024 }, as: RegistrarStaff, captures: { err_rt2: $.data.error_id } }
          assert:
            - "first retire -> status == RETIRED"
            - "second retire -> ERR_PROGRAM_INVALID_STATE"
            - "declare into RETIRED program -> ERR_PROGRAM_RETIRED"
      - name: withdrawn_student_program_blocks_audit
        claim_type: precondition_enforcement
        grounds: [state_machines.StudentProgram.ACTIVE_to_WITHDRAWN, "errors[ERR_STUDENT_PROGRAM_NOT_ACTIVE]"]
        distinguishing_aspect: "Audits are only run against ACTIVE declarations; after withdraw the audit endpoint rejects with ERR_STUDENT_PROGRAM_NOT_ACTIVE."
        test_recipe:
          setup: ["Program BS-WD; student declared, then declaration withdrawn"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-WD", name: "BS WD", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_wd: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-WD", legal_name: "Wade Drew" }, as: RegistrarStaff, captures: { s_wd: $.data.id } }
            - { call: "POST /students/${s_wd}/programs", payload: { program_id: "${p_wd}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_wd: $.data.id } }
            - { call: "POST /student-programs/${sp_wd}/withdraw", payload: {}, as: RegistrarStaff, captures: { sp_wd_v: $.data.version } }
          trigger:
            - { call: "POST /student-programs/${sp_wd}/audits", payload: { audit_kind: "STANDARD", expected_student_program_version: "${sp_wd_v}" }, as: RegistrarStaff, captures: { err_wd: $.data.error_id } }
          assert:
            - "error_id == ERR_STUDENT_PROGRAM_NOT_ACTIVE"

  # ============================================================== Calculations
  - section: calculations
    instances:
      - name: transfer_credit_partition
        claim_type: input_set_filtering
        grounds: [calculations.gpa_calculation, entities.Student.fields.institutional_earned_credits]
        distinguishing_aspect: "Transfer credits count toward total_earned_credits and cumulative_gpa but are excluded from institutional_earned_credits and institutional_gpa."
        test_recipe:
          setup: ["student with 3cr institutional A and 5cr transfer B"]
          setup_api_calls:
            - { call: "POST /courses", payload: { course_code: "TP3", title: "T3", credits: 3 }, as: RegistrarStaff, captures: { c_tp3: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "TP5", title: "T5", credits: 5 }, as: RegistrarStaff, captures: { c_tp5: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-TP", legal_name: "Tee Part" }, as: RegistrarStaff, captures: { s_tp: $.data.id } }
            - { call: "POST /students/${s_tp}/enrollments", payload: { course_id: "${c_tp3}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_tp}/enrollments", payload: { course_id: "${c_tp5}", term: "2024-FA", is_transfer: true, grade: "B" }, as: RegistrarStaff }
          trigger:
            - { call: "GET /students/${s_tp}", as: RegistrarStaff, captures: { tp_tot: $.data.total_earned_credits, tp_inst: $.data.institutional_earned_credits, tp_igpa: $.data.institutional_gpa, tp_cgpa: $.data.cumulative_gpa } }
          assert:
            - "total_earned_credits == 8 (3 institutional + 5 transfer)"
            - "institutional_earned_credits == 3"
            - "institutional_gpa == 4.000 (transfer excluded)"
            - "cumulative_gpa == 3.375 ((12.00 + 15.00) / 8)"
      - name: min_grade_filter_excludes_below_grade_credit
        claim_type: constants_applied
        grounds: [calculations.requirement_group_satisfaction, entities.RequirementGroup.fields.min_grade]
        distinguishing_aspect: "A D grade earns total credit (credits_earned = 3) but fails the group's min_grade C filter, so the group gets 0 credits while totals count the course."
        test_recipe:
          setup: ["Program BS-MG [2024,2028) min_total_credits 3 min_gpa 1.0; group G required 3 min_grade C eligible [MG1]; student completed MG1 3cr D"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-MG", name: "BS MG", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 1.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_mg: $.data.id } }
            - { call: "POST /programs/${p_mg}/requirement-groups", payload: { group_code: "G", required_credits: 3, min_grade: "C", eligible_course_codes: ["MG1"] }, as: RegistrarStaff }
            - { call: "POST /courses", payload: { course_code: "MG1", title: "MG", credits: 3 }, as: RegistrarStaff, captures: { c_mg: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-MG", legal_name: "Min Grade" }, as: RegistrarStaff, captures: { s_mg: $.data.id } }
            - { call: "POST /students/${s_mg}/enrollments", payload: { course_id: "${c_mg}", term: "2024-FA", grade: "D" }, as: RegistrarStaff, captures: { en_mg_e: $.data.credits_earned } }
            - { call: "POST /students/${s_mg}/programs", payload: { program_id: "${p_mg}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_mg: $.data.id, sp_mg_v: $.data.version } }
          trigger:
            - { call: "POST /student-programs/${sp_mg}/audits", payload: { audit_kind: "STANDARD", expected_student_program_version: "${sp_mg_v}" }, as: RegistrarStaff, captures: { mg_sat: $.data.overall_satisfied, mg_applied: $.data.total_credits_applied, mg_groups: $.data.groups_result } }
          assert:
            - "enrollment credits_earned == 3 (D earns credit)"
            - "audit total_credits_applied == 3 (course counts toward total)"
            - "groups_result[0]: credits_applied == 0, satisfied == false (D=1.00 below min_grade C=2.00)"
            - "overall_satisfied == false (group conjunct fails even though totals and GPA pass)"
      - name: what_if_major_change_evaluation
        claim_type: correct_result
        grounds: [calculations.degree_audit_progress, entities.DegreeAudit.fields.target_program_id, "errors[ERR_CATALOG_YEAR_OUT_OF_RANGE]"]
        distinguishing_aspect: "WHAT_IF evaluates the student's record against the TARGET program's groups/totals and never touches latest_audit_satisfied; a target whose catalog range excludes the declaration's catalog_year is rejected."
        test_recipe:
          setup:
            - "PA: BS-WI-A [2024,2028) min_total 3, no groups; PB: BS-WI-B [2024,2028) min_total 3 with group GB required 3 eligible [WX1]; PC: BS-WI-C [2026,2030) min_total 3"
            - "student completed WX1 3cr B; declared into PA catalog_year 2024"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-WI-A", name: "PA", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_wia: $.data.id } }
            - { call: "POST /programs", payload: { program_code: "BS-WI-B", name: "PB", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_wib: $.data.id } }
            - { call: "POST /programs/${p_wib}/requirement-groups", payload: { group_code: "GB", required_credits: 3, min_grade: "C", eligible_course_codes: ["WX1"] }, as: RegistrarStaff }
            - { call: "POST /programs", payload: { program_code: "BS-WI-C", name: "PC", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2026, catalog_year_end: 2030 }, as: RegistrarStaff, captures: { p_wic: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "WX1", title: "WX", credits: 3 }, as: RegistrarStaff, captures: { c_wx: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-WI", legal_name: "Whit If" }, as: RegistrarStaff, captures: { s_wi: $.data.id } }
            - { call: "POST /students/${s_wi}/enrollments", payload: { course_id: "${c_wx}", term: "2024-FA", grade: "B" }, as: RegistrarStaff }
            - { call: "POST /students/${s_wi}/programs", payload: { program_id: "${p_wia}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_wi: $.data.id, sp_wi_v: $.data.version } }
          trigger:
            - { call: "POST /student-programs/${sp_wi}/audits", payload: { audit_kind: "WHAT_IF", target_program_id: "${p_wib}", expected_student_program_version: "${sp_wi_v}" }, as: RegistrarStaff, captures: { wi_sat: $.data.overall_satisfied, wi_cat: $.data.catalog_year_used } }
            - { call: "GET /student-programs/${sp_wi}", as: RegistrarStaff, captures: { sp_wi_v2: $.data.version, wi_flag: $.data.latest_audit_satisfied } }
            - { call: "POST /student-programs/${sp_wi}/audits", payload: { audit_kind: "WHAT_IF", target_program_id: "${p_wic}", expected_student_program_version: "${sp_wi_v2}" }, as: RegistrarStaff, captures: { err_wi: $.data.error_id } }
          assert:
            - "WHAT_IF against PB: overall_satisfied == true (WX1 satisfies GB under target program rules), catalog_year_used == 2024"
            - "StudentProgram.latest_audit_satisfied == false (WHAT_IF never touches the FINAL-audit flag)"
            - "WHAT_IF against PC [2026,2030) with catalog_year 2024 -> error_id == ERR_CATALOG_YEAR_OUT_OF_RANGE"

  # =============================================================== Validations
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role fails priority 1 before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /programs", payload: { program_code: "BS-AU", name: "AU", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { err_au: $.data.error_id } }
          assert:
            - "with the X-User-ID header omitted, error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"
      - name: filing_deadline_inclusive_boundary
        claim_type: temporal_validation
        grounds: ["validations[priority=9]", "errors[ERR_FILING_DEADLINE_PASSED]"]
        distinguishing_aspect: "Submit at exactly expected_conferral_date - 30 days passes (<= inclusive); one second later fails with ERR_FILING_DEADLINE_PASSED."
        test_recipe:
          setup:
            - "Program BS-FD; two students each declared and each holding a DRAFT application with expected_conferral_date 2026-09-15 (deadline 2026-08-16T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-FD", name: "BS FD", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_fd: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-F1", legal_name: "Fay One" }, as: RegistrarStaff, captures: { s_f1: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-F2", legal_name: "Fay Two" }, as: RegistrarStaff, captures: { s_f2: $.data.id } }
            - { call: "POST /students/${s_f1}/programs", payload: { program_id: "${p_fd}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_f1: $.data.id } }
            - { call: "POST /students/${s_f2}/programs", payload: { program_id: "${p_fd}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_f2: $.data.id } }
            - { call: "POST /student-programs/${sp_f1}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_f1}", captures: { app_f1: $.data.id } }
            - { call: "POST /student-programs/${sp_f2}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_f2}", captures: { app_f2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /applications/${app_f1}/submit", payload: {}, as: Student, as_user_id: "${s_f1}", captures: { f1_st: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:01Z" }, as: SystemAdmin }
            - { call: "POST /applications/${app_f2}/submit", payload: {}, as: Student, as_user_id: "${s_f2}", captures: { err_f2: $.data.error_id } }
          assert:
            - "at exactly the deadline the first submit succeeds: status == SUBMITTED"
            - "one second past the deadline the second submit fails: error_id == ERR_FILING_DEADLINE_PASSED"
      - name: duplicate_enrollment_then_reenroll_after_withdrawal
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_ENROLLMENT]"]
        distinguishing_aspect: "A second enrollment for (student, course, term) is rejected while an IN_PROGRESS one exists; after that one is withdrawn (W), re-enrollment in the same term succeeds."
        test_recipe:
          setup: ["course 3cr; student; one IN_PROGRESS enrollment in 2026-SP"]
          setup_api_calls:
            - { call: "POST /courses", payload: { course_code: "DU3", title: "DU", credits: 3 }, as: RegistrarStaff, captures: { c_du: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-DU", legal_name: "Drew Plex" }, as: RegistrarStaff, captures: { s_du: $.data.id } }
            - { call: "POST /students/${s_du}/enrollments", payload: { course_id: "${c_du}", term: "2026-SP" }, as: RegistrarStaff, captures: { en_du: $.data.id } }
          trigger:
            - { call: "POST /students/${s_du}/enrollments", payload: { course_id: "${c_du}", term: "2026-SP" }, as: RegistrarStaff, captures: { err_du: $.data.error_id } }
            - { call: "POST /enrollments/${en_du}/post-grade", payload: { grade: "W" }, as: RegistrarStaff }
            - { call: "POST /students/${s_du}/enrollments", payload: { course_id: "${c_du}", term: "2026-SP" }, as: RegistrarStaff, captures: { en_du2: $.data.id, en_du2_st: $.data.status } }
          assert:
            - "duplicate while IN_PROGRESS -> error_id == ERR_DUPLICATE_ENROLLMENT"
            - "after the first enrollment is WITHDRAWN, same-term re-enrollment succeeds (status IN_PROGRESS, new id != ${en_du})"
      - name: financial_hold_blocks_submit_clean
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_FINANCIAL_HOLD]"]
        distinguishing_aspect: "With no higher-priority failure in play, submit on a held student fails with ERR_FINANCIAL_HOLD (402) — the direct trigger, complementing the §1.8 priority-conflict instance."
        test_recipe:
          setup: ["Program BS-FH; student with financial_hold=true; declared; DRAFT application"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-FH", name: "BS FH", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_fh: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-FH", legal_name: "Fin Hold", financial_hold: true }, as: RegistrarStaff, captures: { s_fh: $.data.id } }
            - { call: "POST /students/${s_fh}/programs", payload: { program_id: "${p_fh}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_fh: $.data.id } }
            - { call: "POST /student-programs/${sp_fh}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_fh}", captures: { app_fh: $.data.id } }
          trigger:
            - { call: "POST /applications/${app_fh}/submit", payload: {}, as: Student, as_user_id: "${s_fh}", captures: { err_fh: $.data.error_id } }
          assert:
            - "error_id == ERR_FINANCIAL_HOLD (402); application remains DRAFT"
      - name: decide_cleared_requires_satisfied_final_audit
        claim_type: violation_to_error
        grounds: [state_machines.GraduationApplication.UNDER_REVIEW_to_CLEARED, "errors[ERR_AUDIT_NOT_SATISFIED]"]
        distinguishing_aspect: "decide CLEARED with an unsatisfied CURRENT FINAL audit fails ERR_AUDIT_NOT_SATISFIED."
        test_recipe:
          setup: ["Program BS-AS min_total 3; student declared with 0 credits; CURRENT FINAL audit (unsatisfied); application UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-AS", name: "BS AS", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_as: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-AS", legal_name: "Aud Sat" }, as: RegistrarStaff, captures: { s_as: $.data.id } }
            - { call: "POST /students/${s_as}/programs", payload: { program_id: "${p_as}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_as: $.data.id, sp_as_v: $.data.version } }
            - { call: "POST /student-programs/${sp_as}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_as_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_as}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_as}", captures: { app_as: $.data.id } }
            - { call: "POST /applications/${app_as}/submit", payload: {}, as: Student, as_user_id: "${s_as}" }
            - { call: "POST /applications/${app_as}/begin-review", payload: {}, as: RegistrarStaff }
          trigger:
            - { call: "POST /applications/${app_as}/decide", payload: { decision: "CLEARED" }, as: RegistrarStaff, captures: { err_as: $.data.error_id } }
          assert:
            - "error_id == ERR_AUDIT_NOT_SATISFIED; application remains UNDER_REVIEW"
      - name: conditional_clearance_requires_in_progress_enrollment
        claim_type: violation_to_error
        grounds: [state_machines.GraduationApplication.UNDER_REVIEW_to_CONDITIONALLY_CLEARED, "errors[ERR_NO_IN_PROGRESS_ENROLLMENTS]"]
        distinguishing_aspect: "decide CONDITIONALLY_CLEARED with zero IN_PROGRESS enrollments (empty-set boundary) fails ERR_NO_IN_PROGRESS_ENROLLMENTS."
        test_recipe:
          setup: ["Program BS-NI min_total 3; student declared with 0 credits and NO enrollments; CURRENT FINAL audit; application UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-NI", name: "BS NI", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_ni: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-NI", legal_name: "No Inp" }, as: RegistrarStaff, captures: { s_ni: $.data.id } }
            - { call: "POST /students/${s_ni}/programs", payload: { program_id: "${p_ni}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_ni: $.data.id, sp_ni_v: $.data.version } }
            - { call: "POST /student-programs/${sp_ni}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_ni_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_ni}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_ni}", captures: { app_ni: $.data.id } }
            - { call: "POST /applications/${app_ni}/submit", payload: {}, as: Student, as_user_id: "${s_ni}" }
            - { call: "POST /applications/${app_ni}/begin-review", payload: {}, as: RegistrarStaff }
          trigger:
            - { call: "POST /applications/${app_ni}/decide", payload: { decision: "CONDITIONALLY_CLEARED" }, as: RegistrarStaff, captures: { err_ni: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_IN_PROGRESS_ENROLLMENTS (count of IN_PROGRESS enrollments == 0 fails the >= 1 precondition); application remains UNDER_REVIEW"
      - name: active_application_uniqueness
        claim_type: aggregate_validation
        grounds: ["validations[priority=8]", "errors[ERR_ACTIVE_APPLICATION_EXISTS]"]
        distinguishing_aspect: "A second application for the same student-program is rejected while the first is non-terminal (DRAFT); once the first reaches terminal DENIED, a fresh application is accepted."
        test_recipe:
          setup: ["Program BS-AA min_total 3; student declared (0 credits); CURRENT FINAL audit; application A1 DRAFT"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-AA", name: "BS AA", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_aa: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-AA", legal_name: "Ann App" }, as: RegistrarStaff, captures: { s_aa: $.data.id } }
            - { call: "POST /students/${s_aa}/programs", payload: { program_id: "${p_aa}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_aa: $.data.id, sp_aa_v: $.data.version } }
            - { call: "POST /student-programs/${sp_aa}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_aa_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_aa}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_aa}", captures: { app_aa1: $.data.id } }
          trigger:
            - { call: "POST /student-programs/${sp_aa}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_aa}", captures: { err_aa: $.data.error_id } }
            - { call: "POST /applications/${app_aa1}/submit", payload: {}, as: Student, as_user_id: "${s_aa}" }
            - { call: "POST /applications/${app_aa1}/begin-review", payload: {}, as: RegistrarStaff }
            - { call: "POST /applications/${app_aa1}/decide", payload: { decision: "DENIED", decision_reason: "unmet" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_aa}/applications", payload: { expected_term: "2026-FA", expected_conferral_date: "2027-01-15" }, as: Student, as_user_id: "${s_aa}", captures: { app_aa2: $.data.id } }
          assert:
            - "second create while A1 is DRAFT -> error_id == ERR_ACTIVE_APPLICATION_EXISTS"
            - "after A1 reaches terminal DENIED, a new application is created (id ${app_aa2} != ${app_aa1})"

  # ================================================================= Endpoints
  - section: endpoints
    instances:
      - name: audit_list_filtering_and_pagination_fields
        claim_type: computed_read
        grounds: ["endpoints.GET_/student-programs/{id}/audits"]
        distinguishing_aspect: "Filtered list returns only matching audits; pagination envelope fields (limit, offset, total_count, has_more) are present with defaults."
        test_recipe:
          setup: ["Program BS-LF min_total 3; student declared; one STANDARD and one FINAL audit created"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-LF", name: "BS LF", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_lf: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-LF", legal_name: "Lee Filter" }, as: RegistrarStaff, captures: { s_lf: $.data.id } }
            - { call: "POST /students/${s_lf}/programs", payload: { program_id: "${p_lf}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_lf: $.data.id, sp_lf_v: $.data.version } }
            - { call: "POST /student-programs/${sp_lf}/audits", payload: { audit_kind: "STANDARD", expected_student_program_version: "${sp_lf_v}" }, as: RegistrarStaff }
            - { call: "GET /student-programs/${sp_lf}", as: RegistrarStaff, captures: { sp_lf_v2: $.data.version } }
            - { call: "POST /student-programs/${sp_lf}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_lf_v2}" }, as: RegistrarStaff, captures: { au_lf_fin: $.data.id } }
          trigger:
            - { call: "GET /student-programs/${sp_lf}/audits?audit_kind=FINAL&status=CURRENT", as: RegistrarStaff, captures: { lf_id0: "$.data[0].id", lf_kind0: "$.data[0].audit_kind" } }
          assert:
            - "filtered list contains exactly the FINAL audit ${au_lf_fin} (total_count == 1)"
            - "pagination fields present: limit == 10 (default), offset == 0, has_more == false"
      - name: response_envelope_shape_on_list
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "The fixed response envelope wraps every response: meta.api_request_id/api_request_timestamp, response_type, and pagination fields on arrays."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /substitution-waivers", as: RegistrarStaff }
          assert:
            - "envelope contains meta.api_request_id, meta.api_request_timestamp, response_type == array"
            - "data == [], total_count == 0, has_more == false, limit == 10, offset == 0 (pagination defaults)"

  # ==================================================================== Errors
  - section: errors
    instances:
      - name: invalid_pagination_limit_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_PAGINATION_PARAMETERS]"]
        distinguishing_aspect: "limit=0 is below the pagination minimum of 1 and is rejected."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /substitution-waivers?limit=0", as: RegistrarStaff, captures: { err_pg0: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_PAGINATION_PARAMETERS (400)"
      - name: what_if_audit_requires_target_program
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.DegreeAudit.fields.target_program_id]
        distinguishing_aspect: "WHAT_IF without target_program_id is a request-shape error (400), distinct from the range-mismatch referential error."
        test_recipe:
          setup: ["Program BS-WT; student declared"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-WT", name: "BS WT", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_wt: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-WT", legal_name: "Watt If" }, as: RegistrarStaff, captures: { s_wt: $.data.id } }
            - { call: "POST /students/${s_wt}/programs", payload: { program_id: "${p_wt}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_wt: $.data.id, sp_wt_v: $.data.version } }
          trigger:
            - { call: "POST /student-programs/${sp_wt}/audits", payload: { audit_kind: "WHAT_IF", expected_student_program_version: "${sp_wt_v}" }, as: RegistrarStaff, captures: { err_wt: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (WHAT_IF requires target_program_id)"
      - name: honors_policy_missing_at_confer
        claim_type: violation_to_error
        grounds: ["errors[ERR_HONORS_POLICY_MISSING]", state_machines.GraduationApplication.CLEARED_to_DEGREE_CONFERRED]
        distinguishing_aspect: "Confer without any honors policy covering the declaration's catalog year fails ERR_HONORS_POLICY_MISSING; application stays CLEARED."
        test_recipe:
          setup: ["Program BS-HM (NO honors policy); student 3cr A, declared, FINAL audit satisfied, application CLEARED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-HM", name: "BS HM", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_hm: $.data.id } }
            - { call: "POST /courses", payload: { course_code: "HM3", title: "HM", credits: 3 }, as: RegistrarStaff, captures: { c_hm: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-HM", legal_name: "Hon Miss" }, as: RegistrarStaff, captures: { s_hm: $.data.id } }
            - { call: "POST /students/${s_hm}/enrollments", payload: { course_id: "${c_hm}", term: "2024-FA", grade: "A" }, as: RegistrarStaff }
            - { call: "POST /students/${s_hm}/programs", payload: { program_id: "${p_hm}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_hm: $.data.id, sp_hm_v: $.data.version } }
            - { call: "POST /student-programs/${sp_hm}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_hm_v}" }, as: RegistrarStaff }
            - { call: "POST /student-programs/${sp_hm}/applications", payload: { expected_term: "2026-SP", expected_conferral_date: "2026-09-15" }, as: Student, as_user_id: "${s_hm}", captures: { app_hm: $.data.id } }
            - { call: "POST /applications/${app_hm}/submit", payload: {}, as: Student, as_user_id: "${s_hm}" }
            - { call: "POST /applications/${app_hm}/begin-review", payload: {}, as: RegistrarStaff }
            - { call: "POST /applications/${app_hm}/decide", payload: { decision: "CLEARED" }, as: RegistrarStaff }
          trigger:
            - { call: "POST /applications/${app_hm}/confer", payload: {}, as: RegistrarStaff, captures: { err_hm: $.data.error_id } }
          assert:
            - "error_id == ERR_HONORS_POLICY_MISSING (422); application remains CLEARED; no diploma created"
      - name: body_fk_not_found_errors
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENROLLMENT_NOT_FOUND]", "errors[ERR_WAIVER_NOT_FOUND]", "errors[ERR_DIPLOMA_NOT_FOUND]", "errors[ERR_REQUIREMENT_GROUP_NOT_FOUND]", "errors[ERR_COURSE_NOT_FOUND]"]
        distinguishing_aspect: "Well-formed but absent ids in path or body return the resource-specific 404 across five different endpoints."
        test_recipe:
          setup: ["Program BS-NF; student declared"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-NF", name: "BS NF", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_nf: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-NF", legal_name: "No Found" }, as: RegistrarStaff, captures: { s_nf: $.data.id } }
            - { call: "POST /students/${s_nf}/programs", payload: { program_id: "${p_nf}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_nf: $.data.id } }
          trigger:
            - { call: "POST /enrollments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/post-grade", payload: { grade: "A" }, as: RegistrarStaff, captures: { e_nf1: $.data.error_id } }
            - { call: "POST /substitution-waivers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/advisor-decision", payload: { decision: "APPROVE" }, as: Advisor, as_user_id: "adv-3", captures: { e_nf2: $.data.error_id } }
            - { call: "POST /diplomas/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/issue", payload: {}, as: RegistrarStaff, captures: { e_nf3: $.data.error_id } }
            - { call: "POST /student-programs/${sp_nf}/waivers", payload: { requirement_group_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", kind: "WAIVER", credit_waiver_amount: 1 }, as: Advisor, as_user_id: "adv-3", captures: { e_nf4: $.data.error_id } }
            - { call: "POST /students/${s_nf}/enrollments", payload: { course_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", term: "2024-FA" }, as: RegistrarStaff, captures: { e_nf5: $.data.error_id } }
          assert:
            - "error_ids in order: ERR_ENROLLMENT_NOT_FOUND, ERR_WAIVER_NOT_FOUND, ERR_DIPLOMA_NOT_FOUND, ERR_REQUIREMENT_GROUP_NOT_FOUND, ERR_COURSE_NOT_FOUND"
      - name: unique_constraint_violations
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNIQUE_CONSTRAINT_VIOLATION]", entities.Student.fields.student_number, entities.Course.fields.course_code]
        distinguishing_aspect: "Duplicate student_number and duplicate course_code are both rejected with ERR_UNIQUE_CONSTRAINT_VIOLATION."
        test_recipe:
          setup: ["one student S-UQ and one course UQ1 exist"]
          setup_api_calls:
            - { call: "POST /students", payload: { student_number: "S-UQ", legal_name: "Uno Que" }, as: RegistrarStaff }
            - { call: "POST /courses", payload: { course_code: "UQ1", title: "UQ", credits: 3 }, as: RegistrarStaff }
          trigger:
            - { call: "POST /students", payload: { student_number: "S-UQ", legal_name: "Second" }, as: RegistrarStaff, captures: { err_uq1: $.data.error_id } }
            - { call: "POST /courses", payload: { course_code: "UQ1", title: "UQ Again", credits: 4 }, as: RegistrarStaff, captures: { err_uq2: $.data.error_id } }
          assert:
            - "both error_ids == ERR_UNIQUE_CONSTRAINT_VIOLATION (409)"
      - name: error_waiver_invalid_state
        claim_type: violation_to_error
        grounds: ["errors[ERR_WAIVER_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: waiver_deny_resubmit_cycle
          rationale: "Asserted as the terminal-state probe of the named §1.8 instance (advisor-decision after revoke)."
      - name: error_self_approval_forbidden
        claim_type: violation_to_error
        grounds: ["errors[ERR_SELF_APPROVAL_FORBIDDEN]"]
        excluded_because:
          difficulty_instance: advisor_self_approval_before_referential
          rationale: "Asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: error_enrollment_not_completed
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENROLLMENT_NOT_COMPLETED]"]
        excluded_because:
          difficulty_instance: substitution_decision_requires_completed_enrollment
          rationale: "Asserted as the failure path of the named §1.8 cross-entity instance."
      - name: error_final_audit_required
        claim_type: violation_to_error
        grounds: ["errors[ERR_FINAL_AUDIT_REQUIRED]"]
        excluded_because:
          difficulty_instance: begin_review_requires_current_final_audit
          rationale: "Asserted as the failure path of the named §1.8 cross-entity instance."
      - name: error_catalog_range_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_CATALOG_RANGE_OVERLAP]"]
        excluded_because:
          difficulty_instance: program_catalog_halfopen_overlap
          rationale: "Asserted as the failure path of the named §1.8 overlap instance."
      - name: error_policy_range_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_POLICY_RANGE_OVERLAP]"]
        excluded_because:
          difficulty_instance: honors_policy_closed_range_overlap
          rationale: "Asserted as the failure path of the named §1.8 overlap instance."

  # ====================================================================== RBAC
  - section: rbac
    instances:
      - name: rbac_denied_operations_return_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", roles]
        distinguishing_aspect: "Four denials: Advisor calling the registrar-decision endpoint; Student requesting a FINAL audit; Student reading another student's record; SystemAdmin calling a business endpoint."
        test_recipe:
          setup: ["Program BS-RB; two students; first student declared"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-RB", name: "BS RB", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_rb: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-R1", legal_name: "Rob One" }, as: RegistrarStaff, captures: { s_r1: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-R2", legal_name: "Rob Two" }, as: RegistrarStaff, captures: { s_r2: $.data.id } }
            - { call: "POST /students/${s_r1}/programs", payload: { program_id: "${p_rb}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_rb: $.data.id, sp_rb_v: $.data.version } }
          trigger:
            - { call: "POST /substitution-waivers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/registrar-decision", payload: { decision: "APPROVE" }, as: Advisor, as_user_id: "adv-4", captures: { err_rb1: $.data.error_id } }
            - { call: "POST /student-programs/${sp_rb}/audits", payload: { audit_kind: "FINAL", expected_student_program_version: "${sp_rb_v}" }, as: Student, as_user_id: "${s_r1}", captures: { err_rb2: $.data.error_id } }
            - { call: "GET /students/${s_r2}", as: Student, as_user_id: "${s_r1}", captures: { err_rb3: $.data.error_id } }
            - { call: "POST /programs", payload: { program_code: "BS-RX", name: "RX", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: SystemAdmin, captures: { err_rb4: $.data.error_id } }
          assert:
            - "all four error_ids == ERR_FORBIDDEN (403): role/ownership checks fire at priority 2, before existence (the waiver id does not even exist)"

  # ================================================== Cross-cutting complexity
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_audit_create
        claim_type: stale_version_rejection
        grounds: ["concurrency_rules[audit-create-stale-student-program]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second audit create carrying the pre-first-create StudentProgram version is rejected 412; the first create bumped version 1 -> 2."
        test_recipe:
          setup: ["Program BS-OCC min_total 3; student declared (version 1)"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_code: "BS-OCC", name: "BS OCC", degree_type: "BACHELOR", min_total_credits: 3, min_gpa: 2.0, catalog_year_start: 2024, catalog_year_end: 2028 }, as: RegistrarStaff, captures: { p_occ: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-OCC", legal_name: "Olive CC" }, as: RegistrarStaff, captures: { s_occ: $.data.id } }
            - { call: "POST /students/${s_occ}/programs", payload: { program_id: "${p_occ}", catalog_year: 2024 }, as: RegistrarStaff, captures: { sp_occ: $.data.id, sp_occ_v: $.data.version } }
          trigger:
            - { call: "POST /student-programs/${sp_occ}/audits", payload: { audit_kind: "STANDARD", expected_student_program_version: "${sp_occ_v}" }, as: RegistrarStaff, captures: { au_occ: $.data.id } }
            - { call: "POST /student-programs/${sp_occ}/audits", payload: { audit_kind: "STANDARD", expected_student_program_version: "${sp_occ_v}" }, as: RegistrarStaff, captures: { err_occ: $.data.error_id } }
          assert:
            - "first create succeeds with expected version ${sp_occ_v} (== 1) and bumps StudentProgram.version to 2"
            - "second create with the stale captured version -> error_id == ERR_STALE_VERSION, http 412"
      - name: cascading_side_effects
        claim_type: cascading_side_effects
        grounds: [state_machines.Enrollment.IN_PROGRESS_to_COMPLETED]
        excluded_because:
          difficulty_instance: post_grade_four_hop_clearance_cascade
          rationale: "End-to-end N-level cascade asserted in the named §1.8 instance."
      - name: dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: [calculations.gpa_calculation, calculations.degree_audit_progress]
        excluded_because:
          difficulty_instance: honors_gpa_basis_divergence
          rationale: "Both variants asserted in the named §1.8 instance pair (also audit_final_vs_conditional_projection)."
      - name: derived_field_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [entities.Student.fields.total_earned_credits, entities.StudentProgram.fields.latest_audit_satisfied]
        excluded_because:
          difficulty_instance: grade_change_credit_ledger_invariant
          rationale: "Derived-field before/after reconciliation across mutations asserted in the named §1.8 instance."

  # ========================================================== Consistency model
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_create_with_grade
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, entities.Enrollment.fields.credits_earned]
        distinguishing_aspect: "All mutations are atomic within the request: the create response already carries computed fields, and an immediate re-read returns identical values."
        test_recipe:
          setup: ["course 3cr; student"]
          setup_api_calls:
            - { call: "POST /courses", payload: { course_code: "IC3", title: "IC", credits: 3 }, as: RegistrarStaff, captures: { c_ic: $.data.id } }
            - { call: "POST /students", payload: { student_number: "S-IC", legal_name: "Ivy Con" }, as: RegistrarStaff, captures: { s_ic: $.data.id } }
          trigger:
            - { call: "POST /students/${s_ic}/enrollments", payload: { course_id: "${c_ic}", term: "2024-FA", grade: "B" }, as: RegistrarStaff, captures: { en_ic: $.data.id, ic_st: $.data.status, ic_e: $.data.credits_earned, ic_gp: $.data.grade_points } }
            - { call: "GET /enrollments/${en_ic}", as: RegistrarStaff, captures: { ic_st2: $.data.status, ic_e2: $.data.credits_earned } }
          assert:
            - "create response already computed: status == COMPLETED, credits_earned == 3, grade_points == 9.00"
            - "immediate GET returns identical values (no eventual-consistency lag)"
