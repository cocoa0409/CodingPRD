            - call: "POST /registry/typing-requests/${ct_d1}/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
