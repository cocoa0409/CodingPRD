# =============================================================================
# Task 2509 — Hail Catastrophe Repair & Paintless Dent Operations
# Seed tables (§1.0–§1.7). Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml
#                          Corner design    → SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2509. Hail Catastrophe Repair & Paintless Dent Operations (paintless dent repair
  catastrophe team): storm event targeting with hail swath data and vehicle population
  estimates, temporary facility setup, licensing and local permitting in the affected
  area, technician sourcing across traveling crews with pay splits and housing logistics,
  vehicle intake with damage matrix estimation by panel and dent count, repairability
  triage between paintless repair, conventional repair and total loss recommendation,
  insurer direct-billing arrangements, supplement approval and rate agreements,
  throughput management with vehicle staging and customer rental coordination, quality
  inspection, warranty and post-event demobilization

domain_name: hail-catastrophe-pdr-ops
api_prefix: /hail-ops

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - conditional_feature_flags

  entity_topology: flat
  # Peer entities joined by explicit FK fields; every collection lives directly under
  # /hail-ops/<collection> and no business resource is nested in another's URL path.
  # (The only nested paths are read-only reverse-lookup sub-resources.)

  state_machine_shape: cyclic
  # Facility COMMISSIONED→SUSPENDED→COMMISSIONED (permit-coverage loss/recovery),
  # Vehicle QC_PENDING→QC_FAILED→IN_REPAIR→QC_PENDING (rework loop with reset),
  # Supplement UNDER_REVIEW→COUNTERED→UNDER_REVIEW (negotiation rounds),
  # plus two independent dimensions on Vehicle (repair_status × billing_status).

  relationship_patterns:
    - one_to_many          # StormEvent→Facility, Vehicle→DamageLine, Vehicle→WorkTicket
    - many_to_many         # Technician×Facility via CrewDeployment (+ HousingUnit leg)
    - self_referential     # Supplement.supersedes_supplement_id -> Supplement.id
    - cross_aggregate      # Vehicle→RateAgreement (pinned), QualityInspection→Technician

  role_model: segregation_of_duties
  # The technician who logged repair labor on a vehicle can never be that vehicle's
  # quality inspector; the party that files a supplement can never review it; the
  # party that applies for a permit can never decide it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Deliberately above the §0.4 Expert band on entity/endpoint/error volume because the
  # scenario carries three tightly coupled economies (repair pricing, crew payroll,
  # rental exposure) that share one gating surface (facility posture).

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: StormEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Operational name of the hail event" }
      - { name: region_state_code, type: string, source: input, description: "Two-letter state code of the affected area", constraints: "exactly 2 uppercase letters" }
      - { name: max_hail_size_mm, type: integer, source: input, description: "Largest reported hail stone diameter in millimetres", constraints: ">= 1" }
      - { name: swath_area_km2, type: integer, source: input, description: "Area of the hail swath polygon in square kilometres", constraints: ">= 1" }
      - { name: swath_confidence, type: enum, source: input, description: "Provenance of the swath data", constraints: "MODELED | GROUND_TRUTHED" }
      - { name: vehicle_population_estimate, type: integer, source: input, description: "Estimated number of vehicles inside the swath", constraints: ">= 0" }
      - { name: competitor_shop_count, type: integer, source: input, description: "Known competing catastrophe teams already working the area", constraints: ">= 0" }
      - { name: first_hail_at, type: datetime, source: input, description: "ISO 8601 UTC timestamp of first hail fall" }
      - { name: targeting_score, type: integer, source: computed, description: "0..100 targeting score from calculations.storm_targeting_score; recomputed on create only" }
      - { name: status, type: enum, source: computed, description: "EVALUATING | TARGETED | DECLINED | ACTIVE | DEMOBILIZING | CLOSED", default: EVALUATING }
      - { name: demobilized_at, type: datetime, source: system, description: "Logical-clock instant the demobilize transition ran; null before that" }

  - name: Facility
    parent: null
    common_fields: true
    fields:
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id; the event this temporary facility serves" }
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code the facility physically sits in", constraints: "exactly 2 uppercase letters" }
      - { name: address, type: string, source: input, description: "Street address of the temporary site" }
      - { name: staging_slot_count, type: integer, source: input, description: "Total number of vehicle staging slots on the lot", constraints: ">= 1" }
      - { name: pay_model, type: enum, source: input, description: "Crew pay policy selector for calculations.crew_pay_split", constraints: "FLAT | POOLED" }
      - { name: status, type: enum, source: computed, description: "SETUP | COMMISSIONED | SUSPENDED | DEMOBILIZED", default: SETUP }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN from calculations.facility_posture; recomputed at the start of every request that reads or mutates this Facility or any of its Permits, HousingUnits, CrewDeployments or Vehicles" }
      - { name: staging_slots_occupied, type: integer, source: computed, description: "Count of Vehicles with facility_id == this.id and repair_status IN {INTAKE, ESTIMATED, TRIAGED, IN_REPAIR, QC_PENDING, QC_FAILED, READY, TOTAL_LOSS_PENDING}" }
      - { name: staging_slots_free, type: integer, source: computed, description: "= staging_slot_count - staging_slots_occupied" }
      - { name: staging_occupancy_ratio, type: number, source: computed, description: "= staging_slots_occupied / staging_slot_count, round_half_up to 4 decimal places" }
      - { name: billable_accrued_cents, type: integer, source: computed, description: "= sum of Vehicle.net_billable_cents over Vehicles with facility_id == this.id and billing_status IN {AUTHORIZED, BILLED, PAID}" }
      - { name: absorbed_rental_cents, type: integer, source: computed, description: "= sum of Vehicle.shop_absorbed_rental_cents over Vehicles with facility_id == this.id and repair_status IN {RELEASED, TOWED_OUT}" }
      - { name: warranty_counter, type: integer, source: system, default: 0, description: "Monotone per-facility counter; incremented then used to mint Vehicle.warranty_number on release" }
      - { name: commissioned_at, type: datetime, source: system, description: "Logical-clock instant of the first SETUP->COMMISSIONED transition; null before that" }

  - name: Permit
    parent: null
    common_fields: false
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the site this permit authorises" }
      - { name: permit_type, type: enum, source: input, description: "TEMP_BUSINESS_LICENSE | ZONING_USE | FIRE_OCCUPANCY | SIGNAGE", constraints: "TEMP_BUSINESS_LICENSE and ZONING_USE are the two REQUIRED_PERMIT_TYPES" }
      - { name: issuing_jurisdiction, type: string, source: input, description: "Municipality or county issuing the permit" }
      - { name: status, type: enum, source: computed, description: "PENDING | APPROVED | DENIED | EXPIRED", default: PENDING }
      - { name: valid_from, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) the permit becomes effective; set by the decision call, null while PENDING" }
      - { name: valid_to, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) the permit lapses, inclusive; set by the decision call, null while PENDING" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the PENDING->APPROVED/DENIED transition" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: home_state_code, type: string, source: input, description: "Home-base state code of the traveling technician" }
      - { name: license_state_code, type: string, source: input, description: "State whose repair licence the technician holds", constraints: "exactly 2 uppercase letters" }
      - { name: license_expires_at, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) the repair licence lapses, inclusive" }
      - { name: skill_tier, type: enum, source: input, description: "APPRENTICE | JOURNEYMAN | MASTER; selects the pooled-split tier weight" }
      - { name: flat_split_pct, type: number, source: input, description: "Technician's share of ticket work value under the FLAT pay model", constraints: "0 < value <= 1" }
      - { name: deployment_state, type: enum, source: computed, description: "DEPLOYED when at least one CrewDeployment with technician_id == this.id has status IN {CONFIRMED, ON_SITE}, otherwise AVAILABLE", default: AVAILABLE }
      - { name: accrued_pay_cents, type: integer, source: computed, description: "= sum of WorkTicket.payable_cents over WorkTickets with technician_id == this.id and status == APPROVED", default: 0 }
      - { name: approved_ticket_count, type: integer, source: computed, description: "Count of WorkTickets with technician_id == this.id and status == APPROVED", default: 0 }

  - name: HousingUnit
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the site whose crew this unit houses" }
      - { name: label, type: string, source: input, description: "Human label of the unit (e.g. 'Ramada 214')" }
      - { name: bed_count, type: integer, source: input, description: "Beds available for concurrent occupancy", constraints: ">= 1" }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Nightly cost of the whole unit in cents", constraints: ">= 0" }
      - { name: occupied_beds, type: integer, source: computed, description: "Count of CrewDeployments with housing_unit_id == this.id, status IN {CONFIRMED, ON_SITE} and start_date <= current clock date < effective_end_date" }
      - { name: bed_nights_committed, type: integer, source: computed, description: "= sum over CrewDeployments with housing_unit_id == this.id and status IN {CONFIRMED, ON_SITE, ENDED} of (effective_end_date - start_date) in whole days" }

  - name: CrewDeployment
    parent: null
    common_fields: true
    fields:
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; the traveling technician being deployed" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; the site the technician is deployed to" }
      - { name: housing_unit_id, type: string, source: input, description: "FK -> HousingUnit.id; optional crew housing assignment, null when the technician self-houses" }
      - { name: start_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) the deployment starts, inclusive" }
      - { name: end_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) the deployment is planned to end, inclusive", constraints: ">= start_date" }
      - { name: pay_split_pct_snapshot, type: number, source: computed, description: "Copy of Technician.flat_split_pct taken at deployment creation; frozen thereafter" }
      - { name: status, type: enum, source: computed, description: "CONFIRMED | ON_SITE | ENDED | CANCELLED", default: CONFIRMED }
      - { name: actual_end_date, type: string, source: system, description: "ISO 8601 date written when status becomes ENDED (manual end or demobilization cascade); null otherwise" }
      - { name: effective_end_date, type: string, source: computed, description: "= actual_end_date when status == ENDED, otherwise end_date; used by every interval and bed-night computation" }

  - name: Insurer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Carrier name" }
      - { name: naic_code, type: string, source: input, description: "Carrier NAIC identifier" }
      - { name: direct_bill_enabled, type: boolean, source: input, description: "Feature flag: when false the carrier refuses direct billing and no Vehicle of this carrier may be authorized" }
      - { name: outstanding_direct_bill_cents, type: integer, source: computed, description: "= sum of Vehicle.net_billable_cents over Vehicles with insurer_id == this.id and billing_status IN {AUTHORIZED, BILLED}", default: 0 }
      - { name: settled_cents, type: integer, source: computed, description: "= sum of Vehicle.net_billable_cents over Vehicles with insurer_id == this.id and billing_status == PAID", default: 0 }
      - { name: active_rate_agreement_count, type: integer, source: computed, description: "Count of RateAgreements with insurer_id == this.id and status == ACTIVE", default: 0 }

  - name: RateAgreement
    parent: null
    common_fields: true
    fields:
      - { name: insurer_id, type: string, source: input, description: "FK -> Insurer.id; carrier this rate sheet binds" }
      - { name: storm_event_id, type: string, source: input, description: "FK -> StormEvent.id; event this rate sheet is scoped to" }
      - { name: effective_from, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) the rates may first be pinned" }
      - { name: matrix_rate_dime_cents, type: integer, source: input, description: "Per-dent matrix rate for DIME dents", constraints: ">= 1" }
      - { name: matrix_rate_nickel_cents, type: integer, source: input, description: "Per-dent matrix rate for NICKEL dents", constraints: ">= 1" }
      - { name: matrix_rate_quarter_cents, type: integer, source: input, description: "Per-dent matrix rate for QUARTER dents", constraints: ">= 1" }
      - { name: matrix_rate_half_dollar_cents, type: integer, source: input, description: "Per-dent matrix rate for HALF_DOLLAR dents", constraints: ">= 1" }
      - { name: labor_rate_cents_per_hour, type: integer, source: input, description: "Body/R&I labor rate in cents per hour", constraints: ">= 1" }
      - { name: panel_cap_cents, type: integer, source: input, description: "Per-panel ceiling on the paintless matrix charge; a panel that hits the cap is routed to conventional repair", constraints: ">= 1" }
      - { name: admin_fee_pct, type: number, source: input, description: "Administrative fee rate applied to the repair subtotal", constraints: "0 <= value <= 1" }
      - { name: admin_fee_cap_cents, type: integer, source: input, description: "Ceiling on the administrative fee", constraints: ">= 0" }
      - { name: supplement_auto_approve_pct, type: number, source: input, description: "Fraction of approved_repair_cents under which a supplement auto-approves", constraints: "0 <= value <= 1" }
      - { name: rental_cap_days, type: integer, source: input, description: "Rental days the carrier covers per vehicle", constraints: ">= 0" }
      - { name: rental_daily_rate_cents, type: integer, source: input, description: "Rental cost per day in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "DRAFT | ACTIVE | SUPERSEDED", default: DRAFT }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant of the DRAFT->ACTIVE transition" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; site the vehicle was taken in at" }
      - { name: insurer_id, type: string, source: input, description: "FK -> Insurer.id; carrier of record for this claim" }
      - { name: pinned_rate_agreement_id, type: string, source: computed, description: "FK -> RateAgreement.id; agreement selected and frozen by the estimate call, null before that" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number", constraints: "17 characters; unique per facility among vehicles whose repair_status NOT IN {RELEASED, TOWED_OUT}" }
      - { name: model_year, type: integer, source: input, description: "Model year" }
      - { name: make, type: string, source: input, description: "Manufacturer" }
      - { name: model, type: string, source: input, description: "Model designation" }
      - { name: acv_cents, type: integer, source: input, description: "Actual cash value of the vehicle in cents", constraints: ">= 1" }
      - { name: owner_name, type: string, source: input, description: "Registered owner" }
      - { name: rental_required, type: boolean, source: input, description: "Whether the customer takes a rental while the vehicle is in the queue" }
      - { name: matrix_variant_total_cents, type: integer, source: computed, description: "Paintless matrix variant total from calculations.vehicle_repair_estimate; null before the first estimate" }
      - { name: conventional_variant_total_cents, type: integer, source: computed, description: "Conventional body-labor variant total from calculations.vehicle_repair_estimate; null before the first estimate" }
      - { name: pdr_feasible, type: boolean, source: computed, description: "false when any DamageLine of this vehicle has capped == true or oversize_dent_count > 0, or when the vehicle has been re-triaged after exhausting the rework limit; true otherwise" }
      - { name: triage_disposition, type: enum, source: computed, description: "PDR_REPAIR | CONVENTIONAL | TOTAL_LOSS; null before triage" }
      - { name: approved_repair_cents, type: integer, source: computed, description: "Variant total selected by calculations.repairability_triage; 0 before triage" , default: 0 }
      - { name: approved_supplement_cents, type: integer, source: computed, description: "= sum of Supplement.approved_amount_cents over Supplements with vehicle_id == this.id and status IN {AUTO_APPROVED, APPROVED}", default: 0 }
      - { name: admin_fee_cents, type: integer, source: computed, description: "Administrative fee from calculations.vehicle_net_billable", default: 0 }
      - { name: gross_billable_cents, type: integer, source: computed, description: "Repair subtotal plus admin fee from calculations.vehicle_net_billable", default: 0 }
      - { name: discount_cents, type: integer, source: computed, description: "Volume discount from calculations.vehicle_net_billable", default: 0 }
      - { name: net_billable_cents, type: integer, source: computed, description: "Final carrier-facing amount from calculations.vehicle_net_billable", default: 0 }
      - { name: repair_status, type: enum, source: computed, description: "INTAKE | ESTIMATED | TRIAGED | IN_REPAIR | QC_PENDING | QC_FAILED | READY | RELEASED | TOTAL_LOSS_PENDING | TOWED_OUT", default: INTAKE }
      - { name: billing_status, type: enum, source: computed, description: "UNBILLED | AUTHORIZED | BILLED | PAID", default: UNBILLED }
      - { name: rework_count, type: integer, source: computed, description: "Number of FAIL QualityInspections recorded since the last triage; reset to 0 by re-triage", default: 0 }
      - { name: rental_opened_at, type: datetime, source: system, description: "Logical-clock instant intake opened the rental; null when rental_required == false" }
      - { name: rental_closed_at, type: datetime, source: system, description: "Logical-clock instant release closed the rental; null before release" }
      - { name: rental_days_billed, type: integer, source: computed, description: "Whole rental days from calculations.rental_exposure; 0 while the rental is open or absent", default: 0 }
      - { name: shop_absorbed_rental_cents, type: integer, source: computed, description: "Rental cost beyond the carrier cap, absorbed by the shop; from calculations.rental_exposure", default: 0 }
      - { name: warranty_number, type: string, source: system, description: "Minted at RELEASED as 'PDR-' + Facility.warranty_counter zero-padded to 4 digits; null otherwise" }
      - { name: warranty_expires_at, type: datetime, source: computed, description: "= released_at + WARRANTY_DAYS days, where WARRANTY_DAYS is fixed at 90; null unless repair_status == RELEASED" }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock instant of the RELEASED or TOWED_OUT transition" }

  - name: DamageLine
    parent: null
    common_fields: false
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle this panel belongs to" }
      - { name: panel_code, type: enum, source: input, description: "HOOD | ROOF | DECK_LID | LEFT_FENDER | RIGHT_FENDER | LEFT_FRONT_DOOR | RIGHT_FRONT_DOOR | LEFT_REAR_DOOR | RIGHT_REAR_DOOR | LEFT_QUARTER | RIGHT_QUARTER" }
      - { name: dent_count, type: integer, source: input, description: "Number of dents counted on the panel", constraints: ">= 1" }
      - { name: dent_size_class, type: enum, source: input, description: "DIME | NICKEL | QUARTER | HALF_DOLLAR" }
      - { name: aluminum, type: boolean, source: input, description: "Aluminum panel flag; applies ALUMINUM_MULTIPLIER to the matrix charge" }
      - { name: r_and_i_hours, type: number, source: input, default: 0, description: "Remove-and-install labor hours needed to access the panel", constraints: ">= 0" }
      - { name: oversize_dent_count, type: integer, source: input, default: 0, description: "Dents too large for paintless repair; any non-zero value forces the panel to conventional", constraints: ">= 0" }
      - { name: conventional_labor_hours, type: number, source: input, description: "Body labor hours the conventional variant would need for this panel", constraints: ">= 0" }
      - { name: conventional_paint_materials_cents, type: integer, source: input, description: "Paint and materials cost the conventional variant would need for this panel", constraints: ">= 0" }
      - { name: pdr_line_cents, type: integer, source: computed, description: "Per-panel paintless charge from calculations.vehicle_repair_estimate; null before the first estimate" }
      - { name: conventional_line_cents, type: integer, source: computed, description: "Per-panel conventional charge from calculations.vehicle_repair_estimate; null before the first estimate" }
      - { name: capped, type: boolean, source: computed, description: "true when the pre-cap paintless charge exceeded RateAgreement.panel_cap_cents", default: false }
      - { name: routed_to, type: enum, source: computed, description: "PDR | CONVENTIONAL — panel-level routing decided by the estimate; null before the first estimate" }

  - name: WorkTicket
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle worked on" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; technician who did the work" }
      - { name: labor_units, type: number, source: input, description: "Labor units (hour-equivalents) claimed on this ticket", constraints: ">= 0" }
      - { name: dents_repaired, type: integer, source: input, description: "Dents pushed on this ticket", constraints: ">= 0" }
      - { name: panels_worked, type: integer, source: input, description: "Panels touched on this ticket", constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "OPEN | SUBMITTED | APPROVED | VOIDED", default: OPEN }
      - { name: payable_flat_cents, type: integer, source: computed, description: "FLAT variant payout from calculations.crew_pay_split; written by the QC-pass cascade", default: 0 }
      - { name: payable_pooled_cents, type: integer, source: computed, description: "POOLED variant payout from calculations.crew_pay_split; written by the QC-pass cascade", default: 0 }
      - { name: payable_cents, type: integer, source: computed, description: "= payable_flat_cents when the vehicle's Facility.pay_model == FLAT, else payable_pooled_cents", default: 0 }
      - { name: pay_model_applied, type: enum, source: computed, description: "FLAT | POOLED — copy of the vehicle's Facility.pay_model at approval; null before approval" }

  - name: Supplement
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle the extra money is claimed for" }
      - { name: rate_agreement_id, type: string, source: computed, description: "FK -> RateAgreement.id; copied from Vehicle.pinned_rate_agreement_id at creation" }
      - { name: supersedes_supplement_id, type: string, source: input, description: "FK -> Supplement.id; optional pointer to the DENIED/WITHDRAWN supplement this filing replaces" }
      - { name: reason_code, type: enum, source: input, description: "HIDDEN_DAMAGE | ADDITIONAL_PANEL | R_AND_I_ADDITION | PARTS_PRICE_CHANGE" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount claimed in cents; overwritten by a REVISE action", constraints: ">= 1" }
      - { name: counter_amount_cents, type: integer, source: input, description: "Adjuster's counter offer in cents; set by a COUNTER review, null otherwise" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Amount that entered the vehicle's ledger: requested_amount_cents on AUTO_APPROVED/APPROVED, 0 otherwise", default: 0 }
      - { name: round_index, type: integer, source: computed, description: "Negotiation round; 1 at creation, incremented by every REVISE action", default: 1 }
      - { name: status, type: enum, source: computed, description: "UNDER_REVIEW | AUTO_APPROVED | APPROVED | COUNTERED | DENIED | WITHDRAWN", default: UNDER_REVIEW }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the last review decision" }

  - name: QualityInspection
    parent: null
    common_fields: false
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle inspected" }
      - { name: inspector_technician_id, type: string, source: input, description: "FK -> Technician.id; inspecting technician, who may never have a WorkTicket on this vehicle" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: defect_panel_codes, type: array, source: input, default: [], description: "Panel codes rejected by the inspector; must be empty when result == PASS" }
      - { name: rework_index, type: integer, source: computed, description: "= Vehicle.rework_count after this inspection was applied" }
      - { name: inspected_at, type: datetime, source: system, description: "Logical-clock instant the inspection was recorded" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: StormEvent
    initial_state: EVALUATING
    terminal_states: [DECLINED, CLOSED]
    shape: branching
    transitions:
      - from: EVALUATING
        to: TARGETED
        trigger: "POST /hail-ops/storm-events/{id}/decision with decision == TARGET"
        actor: CatastropheDirector
        preconditions:
          - "status == EVALUATING"
          - "targeting_score >= TARGETING_SCORE_FLOOR (60)"
        side_effects:
          - "status := TARGETED; version += 1"
        note: "Branch point: the same endpoint reaches DECLINED with a different decision value and no score gate."
      - from: EVALUATING
        to: DECLINED
        trigger: "POST /hail-ops/storm-events/{id}/decision with decision == DECLINE"
        actor: CatastropheDirector
        preconditions:
          - "status == EVALUATING"
        side_effects:
          - "status := DECLINED (terminal); version += 1"
      - from: TARGETED
        to: ACTIVE
        trigger: "POST /hail-ops/storm-events/{id}/activate"
        actor: CatastropheDirector
        preconditions:
          - "status == TARGETED"
          - "at least one Facility with storm_event_id == this.id has status == COMMISSIONED"
        side_effects:
          - "status := ACTIVE; version += 1"
      - from: ACTIVE
        to: DEMOBILIZING
        trigger: "POST /hail-ops/storm-events/{id}/demobilize"
        actor: CatastropheDirector
        preconditions:
          - "status == ACTIVE"
          - "no Vehicle at any Facility of this event has repair_status NOT IN {RELEASED, TOWED_OUT}"
        side_effects:
          - "status := DEMOBILIZING; demobilized_at := current clock; version += 1"
          - "CASCADE hop 1: every Facility of this event with status IN {SETUP, COMMISSIONED, SUSPENDED} -> DEMOBILIZED (posture becomes FROZEN)"
          - "CASCADE hop 2 (caused by hop 1): for each Facility that just became DEMOBILIZED, every CrewDeployment with that facility_id and status IN {CONFIRMED, ON_SITE} -> ENDED with actual_end_date := current clock date"
          - "CASCADE hop 3 (caused by hop 2): for each CrewDeployment that just became ENDED, its HousingUnit (when housing_unit_id is not null) recomputes occupied_beds and bed_nights_committed from effective_end_date, and its Technician recomputes deployment_state"
      - from: DEMOBILIZING
        to: CLOSED
        trigger: "POST /hail-ops/storm-events/{id}/close"
        actor: CatastropheDirector
        preconditions:
          - "status == DEMOBILIZING"
          - "every Facility of this event has status == DEMOBILIZED"
          - "no Vehicle at any Facility of this event has billing_status IN {AUTHORIZED, BILLED}"
        side_effects:
          - "status := CLOSED (terminal); version += 1"
          - "every RateAgreement with storm_event_id == this.id and status == ACTIVE -> SUPERSEDED; each affected Insurer recomputes active_rate_agreement_count"

  - entity: Facility
    initial_state: SETUP
    terminal_states: [DEMOBILIZED]
    shape: cyclic
    transitions:
      - from: SETUP
        to: COMMISSIONED
        trigger: "POST /hail-ops/facilities/{id}/commission"
        actor: CatastropheDirector
        preconditions:
          - "status == SETUP"
          - "StormEvent.status IN {TARGETED, ACTIVE}"
          - "for every type in REQUIRED_PERMIT_TYPES {TEMP_BUSINESS_LICENSE, ZONING_USE} there is a Permit on this facility with status == APPROVED and valid_from <= current clock date <= valid_to"
          - "at least one CrewDeployment on this facility has status IN {CONFIRMED, ON_SITE} whose Technician has license_state_code == Facility.state_code and license_expires_at >= current clock date"
        side_effects:
          - "status := COMMISSIONED; commissioned_at := current clock; posture recomputed; version += 1"
      - from: COMMISSIONED
        to: SUSPENDED
        trigger: "system: posture recomputation detects broken permit coverage (any REQUIRED_PERMIT_TYPES permit missing, DENIED, or with valid_to < current clock date)"
        actor: system
        preconditions:
          - "status == COMMISSIONED"
          - "calculations.facility_posture evaluates permit_coverage_ok == false"
        side_effects:
          - "every Permit on this facility with status == APPROVED and valid_to < current clock date -> EXPIRED"
          - "status := SUSPENDED; posture := FROZEN; version += 1"
        note: "Lazy transition: fires inside whichever request triggered the posture recomputation."
      - from: SUSPENDED
        to: COMMISSIONED
        trigger: "system: posture recomputation finds permit coverage restored (a freshly APPROVED replacement permit covers every REQUIRED_PERMIT_TYPES type)"
        actor: system
        preconditions:
          - "status == SUSPENDED"
          - "calculations.facility_posture evaluates permit_coverage_ok == true"
        side_effects:
          - "status := COMMISSIONED; posture recomputed (OPEN or RESTRICTED); version += 1"
        note: "Closes the COMMISSIONED->SUSPENDED->COMMISSIONED cycle; commissioned_at is NOT rewritten."
      - from: COMMISSIONED
        to: DEMOBILIZED
        trigger: "system: StormEvent ACTIVE->DEMOBILIZING cascade hop 1"
        actor: system
        preconditions:
          - "status IN {SETUP, COMMISSIONED, SUSPENDED}"
        side_effects:
          - "status := DEMOBILIZED (terminal); posture := FROZEN; version += 1"
          - "triggers CrewDeployment ENDED cascade (hop 2)"
      - from: SUSPENDED
        to: DEMOBILIZED
        trigger: "system: StormEvent ACTIVE->DEMOBILIZING cascade hop 1"
        actor: system
        preconditions:
          - "status IN {SETUP, COMMISSIONED, SUSPENDED}"
        side_effects:
          - "status := DEMOBILIZED (terminal); posture := FROZEN; version += 1"

  - entity: Permit
    initial_state: PENDING
    terminal_states: [DENIED, EXPIRED]
    shape: branching
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /hail-ops/permits/{id}/decision with decision == APPROVE (enum: APPROVE | DENY)"
        actor: PermitOfficer
        preconditions:
          - "status == PENDING"
          - "valid_from and valid_to are supplied and valid_from <= valid_to"
        side_effects:
          - "status := APPROVED; valid_from/valid_to persisted; decided_at := current clock"
          - "Facility posture recomputed; a SUSPENDED facility whose coverage is now complete transitions back to COMMISSIONED"
      - from: PENDING
        to: DENIED
        trigger: "POST /hail-ops/permits/{id}/decision with decision == DENY (enum: APPROVE | DENY)"
        actor: PermitOfficer
        preconditions:
          - "status == PENDING"
        side_effects:
          - "status := DENIED (terminal); decided_at := current clock"
          - "Facility posture recomputed"
      - from: APPROVED
        to: EXPIRED
        trigger: "system: posture recomputation observes valid_to < current clock date"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "valid_to < current clock date"
        side_effects:
          - "status := EXPIRED (terminal)"
          - "when the type is in REQUIRED_PERMIT_TYPES, drives Facility COMMISSIONED->SUSPENDED in the same recomputation"

  - entity: CrewDeployment
    initial_state: CONFIRMED
    terminal_states: [ENDED, CANCELLED]
    shape: linear
    transitions:
      - from: CONFIRMED
        to: ON_SITE
        trigger: "POST /hail-ops/crew-deployments/{id}/status with to_status == ON_SITE"
        actor: CrewCoordinator
        preconditions:
          - "status == CONFIRMED"
          - "Facility.status IN {SETUP, COMMISSIONED}"
          - "Technician.license_expires_at >= current clock date"
        side_effects:
          - "status := ON_SITE; version += 1"
          - "Facility posture recomputed (an on-site licensed technician can lift RESTRICTED)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /hail-ops/crew-deployments/{id}/status with to_status == CANCELLED"
        actor: CrewCoordinator
        preconditions:
          - "status == CONFIRMED"
        side_effects:
          - "status := CANCELLED (terminal); version += 1"
          - "HousingUnit.occupied_beds and bed_nights_committed recomputed (the cancelled interval leaves both sums)"
          - "Technician.deployment_state recomputed"
      - from: ON_SITE
        to: ENDED
        trigger: "POST /hail-ops/crew-deployments/{id}/status with to_status == ENDED, or system demobilization cascade hop 2"
        actor: CrewCoordinator | system
        preconditions:
          - "status == ON_SITE"
        side_effects:
          - "status := ENDED (terminal); actual_end_date := current clock date; effective_end_date := actual_end_date; version += 1"
          - "HousingUnit.occupied_beds and bed_nights_committed recomputed from the shortened interval"
          - "Technician.deployment_state recomputed"
      - from: CONFIRMED
        to: ENDED
        trigger: "system: demobilization cascade hop 2"
        actor: system
        preconditions:
          - "status IN {CONFIRMED, ON_SITE}"
        side_effects:
          - "status := ENDED (terminal); actual_end_date := current clock date; version += 1"

  - entity: RateAgreement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: linear
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /hail-ops/rate-agreements/{id}/activate"
        actor: CatastropheDirector
        preconditions:
          - "status == DRAFT"
          - "expected_insurer_version == Insurer.version"
          - "StormEvent.status IN {TARGETED, ACTIVE}"
        side_effects:
          - "status := ACTIVE; activated_at := current clock; version += 1"
          - "every other RateAgreement with the same (insurer_id, storm_event_id) and status == ACTIVE -> SUPERSEDED"
          - "Insurer.version += 1; Insurer.active_rate_agreement_count recomputed"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer agreement for the same (insurer_id, storm_event_id) activates, or the StormEvent closes"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "status := SUPERSEDED (terminal); version += 1"
          - "Vehicles that pinned this agreement keep pinned_rate_agreement_id unchanged — their frozen rates survive supersession"

  - entity: Vehicle
    initial_state: INTAKE
    terminal_states: [RELEASED, TOWED_OUT]
    shape: parallel
    note: |
      Two independent dimensions live on one row. Dimension R (repair_status) is driven by
      the shop; dimension B (billing_status) is driven by the carrier. Neither dimension's
      transitions are reachable from the other's endpoint, but three transitions are guarded
      by the opposite dimension: R start-repair requires B == AUTHORIZED, R release requires
      B == AUTHORIZED, and B VOID_AUTHORIZATION requires R non-terminal.
    transitions:
      - from: "R:INTAKE"
        to: "R:ESTIMATED"
        trigger: "POST /hail-ops/vehicles/{id}/estimate"
        actor: ShopEstimator
        preconditions:
          - "repair_status IN {INTAKE, ESTIMATED}"
          - "at least one DamageLine has vehicle_id == this.id"
          - "an ACTIVE RateAgreement exists for (insurer_id, Facility.storm_event_id) per calculations.rate_agreement_selector"
        side_effects:
          - "pinned_rate_agreement_id := selected agreement (frozen; re-estimate re-runs the selector)"
          - "per-line pdr_line_cents / conventional_line_cents / capped / routed_to written; matrix_variant_total_cents and conventional_variant_total_cents written per calculations.vehicle_repair_estimate"
          - "pdr_feasible recomputed; repair_status := ESTIMATED; version += 1"
      - from: "R:ESTIMATED"
        to: "R:TRIAGED"
        trigger: "POST /hail-ops/vehicles/{id}/triage — disposition resolves to PDR_REPAIR or CONVENTIONAL"
        actor: ShopEstimator
        preconditions:
          - "repair_status == ESTIMATED"
          - "calculations.repairability_triage yields disposition != TOTAL_LOSS"
        side_effects:
          - "triage_disposition and approved_repair_cents written; rework_count := 0"
          - "admin_fee_cents / gross_billable_cents / discount_cents / net_billable_cents recomputed per calculations.vehicle_net_billable"
          - "repair_status := TRIAGED; version += 1"
      - from: "R:ESTIMATED"
        to: "R:TOTAL_LOSS_PENDING"
        trigger: "POST /hail-ops/vehicles/{id}/triage — disposition resolves to TOTAL_LOSS"
        actor: ShopEstimator
        preconditions:
          - "repair_status == ESTIMATED"
          - "calculations.repairability_triage yields disposition == TOTAL_LOSS"
        side_effects:
          - "triage_disposition := TOTAL_LOSS; approved_repair_cents := 0; net billable fields recomputed (admin fee on a 0 subtotal is 0)"
          - "repair_status := TOTAL_LOSS_PENDING; version += 1"
      - from: "R:QC_FAILED"
        to: "R:TRIAGED"
        trigger: "POST /hail-ops/vehicles/{id}/triage — re-triage after the rework limit is exhausted"
        actor: ShopEstimator
        preconditions:
          - "repair_status == QC_FAILED"
          - "rework_count > MAX_REWORK_COUNT (2)"
        side_effects:
          - "pdr_feasible := false (matrix path exhausted); calculations.repairability_triage re-run with the conventional variant forced"
          - "triage_disposition and approved_repair_cents rewritten; rework_count := 0 (reset mechanism)"
          - "every WorkTicket of this vehicle with status IN {OPEN, SUBMITTED} -> VOIDED"
          - "net billable fields recomputed; when billing_status IN {AUTHORIZED, BILLED, PAID}, Facility.billable_accrued_cents and Insurer.outstanding_direct_bill_cents absorb the delta"
          - "repair_status := TRIAGED (or TOTAL_LOSS_PENDING when the re-run yields TOTAL_LOSS); version += 1"
      - from: "R:TRIAGED"
        to: "R:IN_REPAIR"
        trigger: "POST /hail-ops/vehicles/{id}/start-repair"
        actor: ShopEstimator
        preconditions:
          - "repair_status IN {TRIAGED, QC_FAILED}"
          - "triage_disposition IN {PDR_REPAIR, CONVENTIONAL}"
          - "billing_status == AUTHORIZED"
          - "Facility.posture != FROZEN"
          - "rework_count <= MAX_REWORK_COUNT (2)"
        side_effects:
          - "repair_status := IN_REPAIR; version += 1"
      - from: "R:QC_FAILED"
        to: "R:IN_REPAIR"
        trigger: "POST /hail-ops/vehicles/{id}/start-repair — rework loop"
        actor: ShopEstimator
        preconditions:
          - "repair_status == QC_FAILED"
          - "rework_count <= MAX_REWORK_COUNT (2)"
          - "billing_status == AUTHORIZED"
          - "Facility.posture != FROZEN"
        side_effects:
          - "repair_status := IN_REPAIR; version += 1"
          - "every WorkTicket of this vehicle with status == SUBMITTED stays SUBMITTED (labor already claimed is not discarded by a rework)"
        note: "Closes the QC_PENDING -> QC_FAILED -> IN_REPAIR -> QC_PENDING cycle."
      - from: "R:IN_REPAIR"
        to: "R:QC_PENDING"
        trigger: "system: POST /hail-ops/work-tickets/{id}/submit leaves zero OPEN tickets on the vehicle"
        actor: system
        preconditions:
          - "repair_status == IN_REPAIR"
          - "count(WorkTicket with vehicle_id == this.id and status == OPEN) == 0"
          - "count(WorkTicket with vehicle_id == this.id and status == SUBMITTED) >= 1"
        side_effects:
          - "repair_status := QC_PENDING; version += 1"
      - from: "R:QC_PENDING"
        to: "R:READY"
        trigger: "POST /hail-ops/quality-inspections with result == PASS"
        actor: QualityInspector
        preconditions:
          - "repair_status == QC_PENDING"
          - "inspector holds no WorkTicket on this vehicle (segregation of duties)"
        side_effects:
          - "repair_status := READY; version += 1"
          - "CASCADE hop 1: every WorkTicket of this vehicle with status == SUBMITTED -> APPROVED, with payable_flat_cents, payable_pooled_cents, payable_cents and pay_model_applied written per calculations.crew_pay_split"
          - "CASCADE hop 2 (caused by hop 1): every Technician holding one of those APPROVED tickets recomputes accrued_pay_cents and approved_ticket_count"
      - from: "R:QC_PENDING"
        to: "R:QC_FAILED"
        trigger: "POST /hail-ops/quality-inspections with result == FAIL"
        actor: QualityInspector
        preconditions:
          - "repair_status == QC_PENDING"
          - "inspector holds no WorkTicket on this vehicle (segregation of duties)"
          - "defect_panel_codes is non-empty"
        side_effects:
          - "rework_count += 1; QualityInspection.rework_index := the new rework_count"
          - "repair_status := QC_FAILED; version += 1"
      - from: "R:READY"
        to: "R:RELEASED"
        trigger: "POST /hail-ops/vehicles/{id}/release"
        actor: IntakeAdvisor
        preconditions:
          - "repair_status == READY"
          - "billing_status == AUTHORIZED"
        side_effects:
          - "released_at := current clock; rental_closed_at := current clock when rental_required == true"
          - "rental_days_billed and shop_absorbed_rental_cents written per calculations.rental_exposure"
          - "Facility.warranty_counter += 1; warranty_number := 'PDR-' + counter zero-padded to 4; warranty_expires_at := released_at + WARRANTY_DAYS (90 days)"
          - "repair_status := RELEASED (terminal); version += 1"
          - "Facility.staging_slots_occupied / staging_slots_free / staging_occupancy_ratio / absorbed_rental_cents recomputed; posture recomputed"
      - from: "R:TOTAL_LOSS_PENDING"
        to: "R:TOWED_OUT"
        trigger: "POST /hail-ops/vehicles/{id}/release — total-loss tow-out"
        actor: IntakeAdvisor
        preconditions:
          - "repair_status == TOTAL_LOSS_PENDING"
          - "billing_status == AUTHORIZED"
        side_effects:
          - "released_at := current clock; rental_closed_at := current clock when rental_required == true; rental fields written per calculations.rental_exposure"
          - "no warranty is minted (warranty_number stays null; Facility.warranty_counter is NOT incremented)"
          - "repair_status := TOWED_OUT (terminal); version += 1"
          - "Facility staging fields and posture recomputed"
      - from: "B:UNBILLED"
        to: "B:AUTHORIZED"
        trigger: "POST /hail-ops/vehicles/{id}/billing with action == AUTHORIZE"
        actor: InsurerAdjuster
        preconditions:
          - "billing_status == UNBILLED"
          - "repair_status IN {TRIAGED, IN_REPAIR, QC_PENDING, QC_FAILED, READY, TOTAL_LOSS_PENDING}"
          - "Insurer.direct_bill_enabled == true"
        side_effects:
          - "billing_status := AUTHORIZED; version += 1"
          - "Facility.billable_accrued_cents += net_billable_cents; Insurer.outstanding_direct_bill_cents += net_billable_cents"
      - from: "B:AUTHORIZED"
        to: "B:UNBILLED"
        trigger: "POST /hail-ops/vehicles/{id}/billing with action == VOID_AUTHORIZATION"
        actor: InsurerAdjuster
        preconditions:
          - "billing_status == AUTHORIZED"
          - "repair_status NOT IN {RELEASED, TOWED_OUT}"
        side_effects:
          - "billing_status := UNBILLED; version += 1"
          - "Facility.billable_accrued_cents -= net_billable_cents; Insurer.outstanding_direct_bill_cents -= net_billable_cents (compensating action for AUTHORIZE)"
      - from: "B:AUTHORIZED"
        to: "B:BILLED"
        trigger: "POST /hail-ops/vehicles/{id}/billing with action == SUBMIT_BILL"
        actor: BillingCoordinator
        preconditions:
          - "billing_status == AUTHORIZED"
          - "repair_status IN {RELEASED, TOWED_OUT}"
        side_effects:
          - "billing_status := BILLED; version += 1"
      - from: "B:BILLED"
        to: "B:PAID"
        trigger: "POST /hail-ops/vehicles/{id}/billing with action == SETTLE"
        actor: InsurerAdjuster
        preconditions:
          - "billing_status == BILLED"
        side_effects:
          - "billing_status := PAID; version += 1"
          - "Insurer.outstanding_direct_bill_cents -= net_billable_cents; Insurer.settled_cents += net_billable_cents (Facility.billable_accrued_cents is unchanged — PAID is still inside its status set)"

  - entity: WorkTicket
    initial_state: OPEN
    terminal_states: [APPROVED, VOIDED]
    shape: branching
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /hail-ops/work-tickets/{id}/submit"
        actor: PdrTechnician
        preconditions:
          - "status == OPEN"
          - "labor_units > 0"
          - "Vehicle.repair_status == IN_REPAIR"
        side_effects:
          - "status := SUBMITTED; version += 1"
          - "when no OPEN ticket remains on the vehicle, drives Vehicle IN_REPAIR -> QC_PENDING"
      - from: SUBMITTED
        to: APPROVED
        trigger: "system: QC PASS cascade hop 1"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "Vehicle.repair_status transitioned QC_PENDING -> READY in this request"
        side_effects:
          - "payable_flat_cents, payable_pooled_cents, payable_cents, pay_model_applied written per calculations.crew_pay_split"
          - "status := APPROVED (terminal); version += 1"
          - "drives Technician.accrued_pay_cents / approved_ticket_count recomputation (cascade hop 2)"
      - from: SUBMITTED
        to: VOIDED
        trigger: "system: Vehicle re-triage after the rework limit is exhausted"
        actor: system
        preconditions:
          - "status IN {OPEN, SUBMITTED}"
        side_effects:
          - "status := VOIDED (terminal); payable_cents stays 0; version += 1"
      - from: OPEN
        to: VOIDED
        trigger: "system: Vehicle re-triage after the rework limit is exhausted"
        actor: system
        preconditions:
          - "status IN {OPEN, SUBMITTED}"
        side_effects:
          - "status := VOIDED (terminal); version += 1"

  - entity: Supplement
    initial_state: UNDER_REVIEW
    terminal_states: [AUTO_APPROVED, APPROVED, DENIED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: UNDER_REVIEW
        to: AUTO_APPROVED
        trigger: "system: auto-approval evaluation inside POST /hail-ops/supplements"
        actor: system
        preconditions:
          - "round_index == 1 (evaluated only at creation)"
          - "requested_amount_cents <= calculations.supplement_gate.auto_approve_threshold_cents"
        side_effects:
          - "status := AUTO_APPROVED (terminal); approved_amount_cents := requested_amount_cents; decided_at := current clock"
          - "CASCADE hop 1: Vehicle.approved_supplement_cents += approved_amount_cents and the net-billable chain is recomputed"
          - "CASCADE hop 2 (caused by hop 1): when Vehicle.billing_status IN {AUTHORIZED, BILLED, PAID}, Facility.billable_accrued_cents absorbs the net_billable delta"
          - "CASCADE hop 3 (caused by hop 2): the Vehicle's Insurer recomputes outstanding_direct_bill_cents / settled_cents from the same delta"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /hail-ops/supplements/{id}/review with decision == APPROVE"
        actor: InsurerAdjuster
        preconditions:
          - "status == UNDER_REVIEW"
          - "the acting adjuster's X-User-ID equals Vehicle.insurer_id"
        side_effects:
          - "status := APPROVED (terminal); approved_amount_cents := requested_amount_cents; decided_at := current clock; version += 1"
          - "CASCADE hop 1: Vehicle.approved_supplement_cents += approved_amount_cents; admin_fee/gross/discount/net recomputed"
          - "CASCADE hop 2 (caused by hop 1): Facility.billable_accrued_cents absorbs the net_billable delta when billing_status IN {AUTHORIZED, BILLED, PAID}"
          - "CASCADE hop 3 (caused by hop 2): Insurer.outstanding_direct_bill_cents absorbs the same delta"
      - from: UNDER_REVIEW
        to: COUNTERED
        trigger: "POST /hail-ops/supplements/{id}/review with decision == COUNTER"
        actor: InsurerAdjuster
        preconditions:
          - "status == UNDER_REVIEW"
          - "counter_amount_cents supplied and 0 < counter_amount_cents < requested_amount_cents"
          - "round_index < SUPPLEMENT_MAX_ROUNDS (3)"
        side_effects:
          - "status := COUNTERED; counter_amount_cents persisted; decided_at := current clock; version += 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /hail-ops/supplements/{id}/review with decision == DENY"
        actor: InsurerAdjuster
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "status := DENIED (terminal); approved_amount_cents := 0; decided_at := current clock; version += 1"
      - from: COUNTERED
        to: UNDER_REVIEW
        trigger: "POST /hail-ops/supplements/{id}/revise with action == REVISE"
        actor: ShopEstimator
        preconditions:
          - "status == COUNTERED"
          - "round_index < SUPPLEMENT_MAX_ROUNDS (3)"
          - "revised_amount_cents supplied, >= counter_amount_cents and <= requested_amount_cents"
          - "the cumulative cap in calculations.supplement_gate still holds for revised_amount_cents"
        side_effects:
          - "requested_amount_cents := revised_amount_cents; round_index += 1; status := UNDER_REVIEW; version += 1"
        note: "Closes the UNDER_REVIEW -> COUNTERED -> UNDER_REVIEW negotiation cycle; auto-approval is NOT re-evaluated on later rounds."
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /hail-ops/supplements/{id}/revise with action == WITHDRAW"
        actor: ShopEstimator
        preconditions:
          - "status IN {UNDER_REVIEW, COUNTERED}"
        side_effects:
          - "status := WITHDRAWN (terminal); approved_amount_cents := 0; version += 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /hail-ops/supplements/{id}/revise with action == WITHDRAW"
        actor: ShopEstimator
        preconditions:
          - "status IN {UNDER_REVIEW, COUNTERED}"
        side_effects:
          - "status := WITHDRAWN (terminal); version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on a parent's `version` — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: rate-agreement-activate-stale-insurer
    parent_entity: Insurer
    write_endpoint: "POST /hail-ops/rate-agreements/{id}/activate"
    occ_field: "expected_insurer_version"
    description: |
      Activating a DRAFT rate agreement against an Insurer whose version has advanced since
      the client last read it is rejected. Activation legitimately supersedes the carrier's
      previous ACTIVE agreement for the same storm event, so a writer holding a stale
      Insurer version is promoting a rate sheet it negotiated against a rate landscape that
      no longer exists.
    error_id: ERR_STALE_INSURER_VERSION
    http_status: 412

  - rule_id: supplement-create-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /hail-ops/supplements"
    occ_field: "expected_vehicle_version"
    description: |
      Filing a supplement against a Vehicle whose version has advanced since the client last
      read it is rejected. A supplement legitimately supersedes the vehicle's prior money
      picture — the auto-approval threshold and the cumulative cap are both computed from
      approved_repair_cents and approved_supplement_cents — so a stale view would be gated
      against numbers that have already moved.
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: storm_targeting_score
    trigger: "POST /hail-ops/storm-events (write of StormEvent.targeting_score at creation; never recomputed afterwards)"
    algorithm: weighted_scoring
    formula: |
      severity_weight   = SEVERITY_WEIGHT_GROUND_TRUTHED if swath_confidence == GROUND_TRUTHED
                          else SEVERITY_WEIGHT_MODELED
      capped_hail_mm    = min(max_hail_size_mm, HAIL_MM_CAP)
      severity_term     = severity_weight * capped_hail_mm / SEVERITY_DIVISOR
      density_term      = min(vehicle_population_estimate, POPULATION_CAP) / POPULATION_DIVISOR
      swath_bonus       = SWATH_BONUS_POINTS if swath_area_km2 >= SWATH_BONUS_KM2_THRESHOLD else 0
      competition_term  = COMPETITOR_PENALTY_PER_SHOP * min(competitor_shop_count, COMPETITOR_CAP)
      raw               = severity_term + density_term + swath_bonus - competition_term
      targeting_score   = max(0, min(100, round_half_up(raw)))     # integer
    input_set: "The four swath/market inputs of this StormEvent only; no other entity participates."
    constants:
      SEVERITY_WEIGHT_GROUND_TRUTHED: 2.2
      SEVERITY_WEIGHT_MODELED: 1.6
      SEVERITY_DIVISOR: 2
      HAIL_MM_CAP: 60
      POPULATION_CAP: 250000
      POPULATION_DIVISOR: 5000
      SWATH_BONUS_KM2_THRESHOLD: 400
      SWATH_BONUS_POINTS: 8
      COMPETITOR_PENALTY_PER_SHOP: 1.5
      COMPETITOR_CAP: 12
      TARGETING_SCORE_FLOOR: 60
    precision: "integer score, round_half_up on the raw sum; all intermediate terms carry exact decimal arithmetic"

  - name: vehicle_repair_estimate
    trigger: "POST /hail-ops/vehicles/{id}/estimate (writes DamageLine.pdr_line_cents / conventional_line_cents / capped / routed_to and Vehicle.matrix_variant_total_cents / conventional_variant_total_cents / pdr_feasible)"
    algorithm: tiered_pricing
    formula: |
      # --- per DamageLine, using RA = the agreement chosen by rate_agreement_selector ---
      size_rate       = RA.matrix_rate_<lowercase dent_size_class>_cents
      tier_multiplier = TIER_MULT_LIGHT  if dent_count <= DENT_TIER_LIGHT_MAX
                        TIER_MULT_MEDIUM if DENT_TIER_LIGHT_MAX < dent_count <= DENT_TIER_MEDIUM_MAX
                        TIER_MULT_HEAVY  if dent_count > DENT_TIER_MEDIUM_MAX
      alum_multiplier = ALUMINUM_MULTIPLIER if aluminum else 1.00
      raw_line        = size_rate * dent_count * tier_multiplier * alum_multiplier
                        + r_and_i_hours * RA.labor_rate_cents_per_hour
      pdr_line_cents  = round_half_up(raw_line)                 # ROUNDING ORDER IS PINNED:
                                                                # round EVERY panel to whole
                                                                # cents FIRST, then sum panels.
                                                                # Summing raw_line values and
                                                                # rounding once is WRONG.
      capped          = pdr_line_cents > RA.panel_cap_cents
      if capped: pdr_line_cents = RA.panel_cap_cents
      routed_to       = CONVENTIONAL if (capped or oversize_dent_count > 0) else PDR
      conventional_line_cents = round_half_up(conventional_labor_hours * RA.labor_rate_cents_per_hour
                                              + conventional_paint_materials_cents)
      # --- variant totals over ALL DamageLines of the vehicle (both variants price every panel) ---
      matrix_variant_total_cents       = sum(pdr_line_cents)            # VARIANT A
      conventional_variant_total_cents = sum(conventional_line_cents)   # VARIANT B
      pdr_feasible = (count(lines where capped) == 0) and (sum(oversize_dent_count) == 0)
    input_set: "Every DamageLine with vehicle_id == this vehicle, ordered by created_at ASC for the summation (order does not change the sum; the order is pinned so per-line rounding is reproducible). No status filter — DamageLines are immutable."
    constants:
      DENT_TIER_LIGHT_MAX: 15
      DENT_TIER_MEDIUM_MAX: 50
      TIER_MULT_LIGHT: 1.00
      TIER_MULT_MEDIUM: 0.85
      TIER_MULT_HEAVY: 0.70
      ALUMINUM_MULTIPLIER: 1.30
    precision: "whole cents, round_half_up, applied per panel before summation"
    variants:
      - name: matrix_pdr
        when: "always computed; selected by repairability_triage when pdr_feasible and it is the cheaper of the two"
        difference: "Prices dents through the carrier matrix: per-dent rate x dent count x dent-count tier multiplier x aluminum multiplier, plus R&I labor. Ignores paint materials entirely."
      - name: conventional_body
        when: "always computed; selected by repairability_triage when pdr_feasible is false or when it is the cheaper of the two"
        difference: "Prices the same panels as body labor hours x labor rate plus paint materials. Ignores dent counts, tier multipliers and the aluminum multiplier entirely, so identical DamageLine rows yield a different total."

  - name: rate_agreement_selector
    trigger: "POST /hail-ops/vehicles/{id}/estimate (server picks which RateAgreement to pin)"
    algorithm: constraint_propagation
    formula: |
      candidates = RateAgreement rows where
                     insurer_id      == Vehicle.insurer_id
                 and storm_event_id  == Facility(Vehicle.facility_id).storm_event_id
                 and status          == ACTIVE
                 and effective_from  <= current clock date
      ranking    = effective_from DESC
      tie_break  = created_at DESC        # never id
      selection  = first row after ranking + tie_break
      fallback   = candidates is empty -> reject with ERR_NO_ACTIVE_RATE_AGREEMENT (409)
    input_set: "RateAgreement rows matching the eligibility predicate above; DRAFT and SUPERSEDED rows are excluded."
    constants: {}
    precision: "n/a — selection only"

  - name: repairability_triage
    trigger: "POST /hail-ops/vehicles/{id}/triage (writes Vehicle.triage_disposition and approved_repair_cents)"
    algorithm: threshold
    formula: |
      projected_rental_exposure_cents = RA.rental_cap_days * RA.rental_daily_rate_cents
                                        if Vehicle.rental_required else 0
      if not pdr_feasible:
          candidate = CONVENTIONAL
          candidate_cost = conventional_variant_total_cents
      elif matrix_variant_total_cents <= conventional_variant_total_cents:
          candidate = PDR_REPAIR
          candidate_cost = matrix_variant_total_cents
      else:
          candidate = CONVENTIONAL
          candidate_cost = conventional_variant_total_cents
      total_loss_floor_cents = round_half_up(TOTAL_LOSS_THRESHOLD_PCT * acv_cents)
      if candidate_cost + projected_rental_exposure_cents >= total_loss_floor_cents:
          triage_disposition   = TOTAL_LOSS
          approved_repair_cents = 0
      else:
          triage_disposition   = candidate
          approved_repair_cents = candidate_cost
    input_set: "The two variant totals already stored on the Vehicle, its acv_cents / rental_required, and the pinned RateAgreement's rental fields. Re-triage from QC_FAILED forces pdr_feasible = false before running this formula."
    constants:
      TOTAL_LOSS_THRESHOLD_PCT: 0.75
    precision: "whole cents; the >= comparison against total_loss_floor_cents is inclusive (equal cost totals the vehicle)"

  - name: vehicle_net_billable
    trigger: "POST /hail-ops/vehicles/{id}/triage, POST /hail-ops/supplements (auto-approval), POST /hail-ops/supplements/{id}/review (APPROVE) — each writes Vehicle.admin_fee_cents / gross_billable_cents / discount_cents / net_billable_cents"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED — the fee is keyed on the subtotal while the discount is
      # keyed on the gross that already contains the fee. Do NOT iterate to a fixed point and
      # do NOT key the fee on the discounted total.
      step 1: repair_subtotal_cents = approved_repair_cents + approved_supplement_cents
      step 2: admin_fee_cents       = min(round_half_up(RA.admin_fee_pct * repair_subtotal_cents),
                                          RA.admin_fee_cap_cents)
      step 3: gross_billable_cents  = repair_subtotal_cents + admin_fee_cents
      step 4: volume_discount_pct   = DISCOUNT_PCT_TIER_2 if gross_billable_cents >= DISCOUNT_TIER_2_FLOOR_CENTS
                                      DISCOUNT_PCT_TIER_1 if gross_billable_cents >= DISCOUNT_TIER_1_FLOOR_CENTS
                                      else DISCOUNT_PCT_TIER_0
      step 5: discount_cents        = round_half_up(volume_discount_pct * gross_billable_cents)
      step 6: net_billable_cents    = gross_billable_cents - discount_cents
    input_set: "Vehicle.approved_repair_cents plus the sum of approved_amount_cents over Supplements of this vehicle with status IN {AUTO_APPROVED, APPROVED}; DENIED, WITHDRAWN, COUNTERED and UNDER_REVIEW supplements contribute 0. Rates come from the pinned RateAgreement, never from the currently ACTIVE one."
    constants:
      DISCOUNT_TIER_1_FLOOR_CENTS: 250000
      DISCOUNT_TIER_2_FLOOR_CENTS: 500000
      DISCOUNT_PCT_TIER_0: 0.00
      DISCOUNT_PCT_TIER_1: 0.02
      DISCOUNT_PCT_TIER_2: 0.04
    precision: "whole cents, round_half_up at step 2 and step 5 only; both tier comparisons are >= (inclusive at the floor)"

  - name: supplement_gate
    trigger: "POST /hail-ops/supplements (auto-approval and cumulative-cap evaluation) and POST /hail-ops/supplements/{id}/revise with action == REVISE (cumulative-cap re-evaluation)"
    algorithm: threshold
    formula: |
      auto_approve_threshold_cents = max(SUPPLEMENT_AUTO_APPROVE_FLOOR_CENTS,
                                         round_half_up(RA.supplement_auto_approve_pct
                                                       * Vehicle.approved_repair_cents))
      cumulative_cap_cents         = round_half_up(SUPPLEMENT_CUMULATIVE_CAP_PCT
                                                   * Vehicle.approved_repair_cents)
      already_approved_cents       = Vehicle.approved_supplement_cents
      # cap check first (fiscal), then auto-approval:
      if already_approved_cents + amount_under_test > cumulative_cap_cents:
          reject ERR_SUPPLEMENT_CUMULATIVE_CAP_EXCEEDED           # > is strict: equality passes
      auto_approved = amount_under_test <= auto_approve_threshold_cents  # <= is inclusive
    input_set: "Supplements of the vehicle with status IN {AUTO_APPROVED, APPROVED} feed already_approved_cents; the vehicle's pinned RateAgreement supplies supplement_auto_approve_pct. amount_under_test is requested_amount_cents at creation and revised_amount_cents on a REVISE."
    constants:
      SUPPLEMENT_AUTO_APPROVE_FLOOR_CENTS: 15000
      SUPPLEMENT_CUMULATIVE_CAP_PCT: 0.40
      SUPPLEMENT_MAX_ROUNDS: 3
    precision: "whole cents, round_half_up"

  - name: crew_pay_split
    trigger: "system: the QC PASS cascade on POST /hail-ops/quality-inspections (writes WorkTicket.payable_flat_cents / payable_pooled_cents / payable_cents / pay_model_applied and, transitively, Technician.accrued_pay_cents)"
    algorithm: waterfall_allocation
    formula: |
      T = the set of WorkTickets with vehicle_id == this vehicle whose status is SUBMITTED at the
          instant the PASS inspection is recorded (all of them become APPROVED in this cascade),
          ordered by created_at ASC.
      vehicle_labor_pool_cents = round_half_up(LABOR_POOL_PCT * Vehicle.approved_repair_cents)
      total_labor_units        = sum(t.labor_units for t in T)
      # --- VARIANT A: FLAT (each technician is paid their own contract percentage) ---
      for t in T:
          work_value_cents      = round_half_up(vehicle_labor_pool_cents * t.labor_units
                                                / total_labor_units)
          t.payable_flat_cents  = round_half_up(work_value_cents * Technician(t).flat_split_pct)
      # --- VARIANT B: POOLED (a fixed pool is split by tier-weighted labor units) ---
      pool_amount_cents = round_half_up(POOL_SPLIT_PCT * vehicle_labor_pool_cents)
      weight(t)         = t.labor_units * TIER_WEIGHT[Technician(t).skill_tier]
      total_weight      = sum(weight(t) for t in T)
      exact(t)          = pool_amount_cents * weight(t) / total_weight
      t.payable_pooled_cents = round_half_up(exact(t))
      residual = pool_amount_cents - sum(t.payable_pooled_cents for t in T)
      if residual != 0:
          # the whole pool is conserved: the residual (+1 or -1 cent per unit of drift) is
          # applied to the ticket with the LARGEST fractional part of exact(t);
          # ties are broken by WorkTicket.created_at ASC (never by id)
          winner = argmax over T of frac(exact(t)), tie-break created_at ASC
          winner.payable_pooled_cents += residual
      # --- selection ---
      t.pay_model_applied = Facility(Vehicle.facility_id).pay_model
      t.payable_cents     = t.payable_flat_cents if pay_model_applied == FLAT
                            else t.payable_pooled_cents
    input_set: "Only SUBMITTED WorkTickets of this vehicle at cascade time; OPEN tickets cannot exist (the vehicle could not have reached QC_PENDING) and VOIDED tickets are excluded. Supplements do NOT enter the labor pool — the pool is a fraction of approved_repair_cents only."
    constants:
      LABOR_POOL_PCT: 0.55
      POOL_SPLIT_PCT: 0.50
      TIER_WEIGHT_APPRENTICE: 0.80
      TIER_WEIGHT_JOURNEYMAN: 1.00
      TIER_WEIGHT_MASTER: 1.25
    precision: "whole cents, round_half_up per ticket; the POOLED variant conserves pool_amount_cents exactly via the residual rule"
    variants:
      - name: flat_percentage
        when: "Facility.pay_model == FLAT"
        difference: "Each ticket earns its proportional share of the labor pool multiplied by that technician's own flat_split_pct. Skill tier is irrelevant and the sum of payouts is NOT conserved against any pool."
      - name: pooled_weighted
        when: "Facility.pay_model == POOLED"
        difference: "A single pool of POOL_SPLIT_PCT of the labor pool is divided by tier-weighted labor units, so a MASTER earns 1.25x a JOURNEYMAN for the same hours and each technician's own flat_split_pct is ignored. The payouts sum exactly to the pool."

  - name: facility_posture
    trigger: "system: recomputed at the start of every request that reads or mutates a Facility or any of its Permits, HousingUnits, CrewDeployments or Vehicles (writes Facility.posture and can drive the COMMISSIONED<->SUSPENDED transitions)"
    algorithm: aggregation
    formula: |
      # step 0 — lazy permit expiry
      for every Permit p on this facility with p.status == APPROVED and p.valid_to < clock_date:
          p.status = EXPIRED
      permit_coverage_ok = for every type in REQUIRED_PERMIT_TYPES there exists a Permit p on
                           this facility with p.permit_type == type, p.status == APPROVED and
                           p.valid_from <= clock_date <= p.valid_to
      on_site_licensed_technician_count =
          count of distinct CrewDeployment.technician_id where deployment.facility_id == this.id
          and deployment.status == ON_SITE and Technician.license_state_code == Facility.state_code
          and Technician.license_expires_at >= clock_date
      staging_slots_occupied = count of Vehicle with facility_id == this.id and repair_status IN
          {INTAKE, ESTIMATED, TRIAGED, IN_REPAIR, QC_PENDING, QC_FAILED, READY, TOTAL_LOSS_PENDING}
      staging_slots_free     = staging_slot_count - staging_slots_occupied
      # step 1 — posture
      if status == DEMOBILIZED:                        posture = FROZEN
      elif not permit_coverage_ok:                     posture = FROZEN   # + COMMISSIONED->SUSPENDED
      elif status == SETUP:                            posture = RESTRICTED
      elif staging_slots_free == 0:                    posture = RESTRICTED
      elif on_site_licensed_technician_count == 0:     posture = RESTRICTED
      else:                                            posture = OPEN
      staging_occupancy_ratio = round_half_up(staging_slots_occupied / staging_slot_count, 4)
    input_set: "Permits of this facility (all statuses; expiry evaluated against the logical clock date), CrewDeployments with status == ON_SITE only, and Vehicles in the eight non-terminal repair statuses listed above."
    constants:
      REQUIRED_PERMIT_TYPES: [TEMP_BUSINESS_LICENSE, ZONING_USE]
    precision: "integer counts; staging_occupancy_ratio round_half_up to 4 decimal places"

  - name: rental_exposure
    trigger: "POST /hail-ops/vehicles/{id}/release (writes Vehicle.rental_days_billed and shop_absorbed_rental_cents, then Facility.absorbed_rental_cents)"
    algorithm: threshold
    formula: |
      if not rental_required: rental_days_billed = 0; shop_absorbed_rental_cents = 0
      else:
        rental_days_billed = max(1, whole_days(date(rental_closed_at) - date(rental_opened_at)))
        covered_days       = min(rental_days_billed, RA.rental_cap_days)
        excess_days        = max(0, rental_days_billed - RA.rental_cap_days)
        shop_absorbed_rental_cents = excess_days * RA.rental_daily_rate_cents
    input_set: "The single Vehicle's rental_opened_at / rental_closed_at instants (calendar-date difference, clock-driven) and the pinned RateAgreement's rental_cap_days / rental_daily_rate_cents."
    constants:
      RENTAL_MINIMUM_DAYS: 1
    precision: "whole days (calendar-date difference, not hours) and whole cents; exactly rental_cap_days absorbs nothing"

  - name: facility_throughput_projection
    trigger: "GET /hail-ops/facilities/{id}/throughput-summary"
    algorithm: aggregation
    formula: |
      open_vehicle_count = count of Vehicle with facility_id == this.id and repair_status IN
          {INTAKE, ESTIMATED, TRIAGED, IN_REPAIR, QC_PENDING, QC_FAILED, READY, TOTAL_LOSS_PENDING}
      on_site_technician_count = count of distinct CrewDeployment.technician_id where
          facility_id == this.id and status == ON_SITE
      daily_capacity = max(1, on_site_technician_count) * VEHICLES_PER_TECH_PER_DAY
      projected_days_to_clear = ceil(open_vehicle_count / daily_capacity)   # 0 when the queue is empty
      vehicles_in_repair = count with repair_status == IN_REPAIR
      vehicles_ready     = count with repair_status == READY
      released_count     = count with repair_status IN {RELEASED, TOWED_OUT}
    input_set: "Vehicles of this facility partitioned by repair_status as written above; CrewDeployments with status == ON_SITE only."
    constants:
      VEHICLES_PER_TECH_PER_DAY: 1.5
    precision: "integer counts; projected_days_to_clear is a ceiling to whole days"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's §1.5 roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "request body shape: required fields present, enums inside their declared value sets, numeric ranges honored (dent_count >= 1, acv_cents >= 1, staging_slot_count >= 1, bed_count >= 1, 0 < flat_split_pct <= 1, labor_units >= 0, requested_amount_cents >= 1, start_date <= end_date, valid_from <= valid_to, defect_panel_codes empty when result == PASS, vin length 17)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "path resources resolve, left to right"
    error_id: "ERR_STORM_EVENT_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_RESOURCE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: existence
    check: "foreign keys in the request body resolve (storm_event_id, facility_id, insurer_id, technician_id, housing_unit_id, vehicle_id, supersedes_supplement_id)"
    error_id: "ERR_STORM_EVENT_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_INSURER_NOT_FOUND | ERR_RESOURCE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /hail-ops/facilities, /permits, /housing-units, /crew-deployments, /rate-agreements, /vehicles, /damage-lines, /work-tickets, /supplements, /quality-inspections"

  - priority: 6
    category: auth
    check: "entity_backed identity: PdrTechnician's X-User-ID == WorkTicket.technician_id, QualityInspector's X-User-ID == inspector_technician_id, InsurerAdjuster's X-User-ID == the target Vehicle.insurer_id"
    error_id: ERR_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /hail-ops/work-tickets, /work-tickets/{id}/submit, /quality-inspections, /vehicles/{id}/billing, /supplements/{id}/review"

  - priority: 7
    category: auth
    check: "billing action / role map: AUTHORIZE, VOID_AUTHORIZATION and SETTLE require InsurerAdjuster; SUBMIT_BILL requires BillingCoordinator"
    error_id: ERR_BILLING_ACTION_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /hail-ops/vehicles/{id}/billing"

  - priority: 8
    category: state
    check: "expected_insurer_version equals Insurer.version"
    error_id: ERR_STALE_INSURER_VERSION
    http_status: 412
    applies_to: "POST /hail-ops/rate-agreements/{id}/activate"

  - priority: 9
    category: state
    check: "expected_vehicle_version equals Vehicle.version"
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412
    applies_to: "POST /hail-ops/supplements"

  - priority: 10
    category: state
    check: "StormEvent.status permits the requested lifecycle transition"
    error_id: ERR_INVALID_STORM_EVENT_STATE
    http_status: 409
    applies_to: "POST /hail-ops/storm-events/{id}/decision, /activate, /demobilize, /close; POST /hail-ops/facilities; POST /hail-ops/rate-agreements/{id}/activate"

  - priority: 11
    category: state
    check: "Facility.status permits the requested transition (commission requires SETUP)"
    error_id: ERR_INVALID_FACILITY_STATE
    http_status: 409
    applies_to: "POST /hail-ops/facilities/{id}/commission"

  - priority: 12
    category: state
    check: "Facility.status == COMMISSIONED for child operations that need a live site (vehicle intake, start-repair, work-ticket creation, quality inspection)"
    error_id: ERR_FACILITY_NOT_COMMISSIONED
    http_status: 409
    applies_to: "POST /hail-ops/vehicles, /vehicles/{id}/start-repair, /work-tickets, /quality-inspections"

  - priority: 13
    category: state
    check: "Permit.status == PENDING when a decision is recorded"
    error_id: ERR_PERMIT_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /hail-ops/permits/{id}/decision"

  - priority: 14
    category: state
    check: "CrewDeployment.status and WorkTicket.status permit the requested transition"
    error_id: ERR_INVALID_LIFECYCLE_STATE
    http_status: 409
    applies_to: "POST /hail-ops/crew-deployments/{id}/status, /work-tickets/{id}/submit"

  - priority: 15
    category: state
    check: "Vehicle.repair_status permits the requested operation, per the §1.2 dimension-R from-states: estimate requires INTAKE or ESTIMATED; triage requires ESTIMATED or QC_FAILED; start-repair requires TRIAGED or QC_FAILED; release requires READY or TOTAL_LOSS_PENDING; damage-line creation requires INTAKE or ESTIMATED; work-ticket creation requires IN_REPAIR; quality inspection requires QC_PENDING; supplement filing requires repair_status IN {TRIAGED, IN_REPAIR, QC_PENDING, QC_FAILED, READY}"
    error_id: ERR_INVALID_VEHICLE_REPAIR_STATE
    http_status: 409
    applies_to: "POST /hail-ops/vehicles/{id}/estimate, /triage, /start-repair, /release, /billing; POST /hail-ops/damage-lines, /work-tickets, /quality-inspections, /supplements"

  - priority: 16
    category: state
    check: "Vehicle.billing_status permits the requested operation (start-repair and release need AUTHORIZED; each billing action needs its own from-state)"
    error_id: ERR_INVALID_VEHICLE_BILLING_STATE
    http_status: 409
    applies_to: "POST /hail-ops/vehicles/{id}/billing, /start-repair, /release"

  - priority: 17
    category: state
    check: "Supplement.status permits the requested review/revise action, and a supersedes_supplement_id target is in {DENIED, WITHDRAWN}"
    error_id: ERR_INVALID_SUPPLEMENT_STATE
    http_status: 409
    applies_to: "POST /hail-ops/supplements, /supplements/{id}/review, /supplements/{id}/revise"

  - priority: 18
    category: business_safety
    check: "segregation of duties: the inspecting technician holds no WorkTicket (any status) on the vehicle under inspection"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hail-ops/quality-inspections"

  - priority: 19
    category: business_safety
    check: "technician licensing: license_expires_at >= current clock date, and license_state_code == Facility.state_code for work performed at that facility"
    error_id: ERR_TECHNICIAN_LICENSE_INVALID
    http_status: 422
    applies_to: "POST /hail-ops/crew-deployments, /crew-deployments/{id}/status, /work-tickets, /quality-inspections"

  - priority: 20
    category: business_safety
    check: "facility posture gate: intake requires posture == OPEN; start-repair and work-ticket creation require posture != FROZEN"
    error_id: ERR_FACILITY_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /hail-ops/vehicles, /vehicles/{id}/start-repair, /work-tickets"

  - priority: 21
    category: business_temporal
    check: "technician deployment exclusivity: no other CrewDeployment for this technician with status IN {CONFIRMED, ON_SITE} may collide with the requested closed date interval once REST_BUFFER_DAYS (fixed at 1 day) is added to both ends — collision iff new.start_date <= existing.effective_end_date + 1 day AND new.end_date + 1 day >= existing.start_date; consequently at least one clear calendar day must separate two deployments of the same technician"
    error_id: ERR_TECHNICIAN_DEPLOYMENT_OVERLAP
    http_status: 409
    applies_to: "POST /hail-ops/crew-deployments"

  - priority: 22
    category: business_constraint
    check: "housing aggregate capacity: for every date D in the half-open interval [new.start_date, new.end_date), the count of CrewDeployments on that housing unit with status IN {CONFIRMED, ON_SITE} whose own half-open interval [start_date, effective_end_date) contains D, plus one, must not exceed HousingUnit.bed_count"
    error_id: ERR_HOUSING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /hail-ops/crew-deployments"

  - priority: 23
    category: business_referential
    check: "commissioning requires an APPROVED, in-window Permit for every REQUIRED_PERMIT_TYPES type"
    error_id: ERR_REQUIRED_PERMIT_MISSING
    http_status: 409
    applies_to: "POST /hail-ops/facilities/{id}/commission"

  - priority: 24
    category: business_referential
    check: "commissioning requires at least one CrewDeployment with status IN {CONFIRMED, ON_SITE} whose technician is licensed in the facility's state and unexpired"
    error_id: ERR_NO_LICENSED_TECHNICIAN
    http_status: 409
    applies_to: "POST /hail-ops/facilities/{id}/commission"

  - priority: 25
    category: business_referential
    check: "activation requires at least one COMMISSIONED Facility on the event"
    error_id: ERR_NO_COMMISSIONED_FACILITY
    http_status: 409
    applies_to: "POST /hail-ops/storm-events/{id}/activate"

  - priority: 26
    category: business_referential
    check: "the inspecting technician has a CrewDeployment with status == ON_SITE at the vehicle's facility"
    error_id: ERR_INSPECTOR_NOT_DEPLOYED
    http_status: 409
    applies_to: "POST /hail-ops/quality-inspections"

  - priority: 27
    category: business_referential
    check: "the ticketing technician has a CrewDeployment with status == ON_SITE at the vehicle's facility"
    error_id: ERR_INSPECTOR_NOT_DEPLOYED
    http_status: 409
    applies_to: "POST /hail-ops/work-tickets"

  - priority: 28
    category: business_referential
    check: "estimate requires a rate agreement from calculations.rate_agreement_selector; a vehicle whose pinned agreement is required for a supplement must still resolve one"
    error_id: ERR_NO_ACTIVE_RATE_AGREEMENT
    http_status: 409
    applies_to: "POST /hail-ops/vehicles/{id}/estimate, POST /hail-ops/supplements"

  - priority: 29
    category: business_referential
    check: "direct billing must be enabled on the carrier before an authorization is recorded"
    error_id: ERR_DIRECT_BILL_NOT_ENABLED
    http_status: 409
    applies_to: "POST /hail-ops/vehicles/{id}/billing"

  - priority: 30
    category: business_referential
    check: "demobilization requires every Vehicle of the event to be in {RELEASED, TOWED_OUT}; closing additionally requires no Vehicle with billing_status IN {AUTHORIZED, BILLED} and every Facility DEMOBILIZED"
    error_id: ERR_EVENT_CLOSEOUT_BLOCKED
    http_status: 409
    applies_to: "POST /hail-ops/storm-events/{id}/demobilize, /close"

  - priority: 31
    category: business_constraint
    check: "VIN uniqueness: no other Vehicle at the same facility with the same vin and repair_status NOT IN {RELEASED, TOWED_OUT}"
    error_id: ERR_DUPLICATE_VIN_AT_FACILITY
    http_status: 409
    applies_to: "POST /hail-ops/vehicles"

  - priority: 32
    category: business_constraint
    check: "estimate requires at least one DamageLine on the vehicle"
    error_id: ERR_NO_DAMAGE_LINES
    http_status: 422
    applies_to: "POST /hail-ops/vehicles/{id}/estimate"

  - priority: 33
    category: business_constraint
    check: "work-ticket submission requires labor_units > 0"
    error_id: ERR_ZERO_LABOR_UNITS
    http_status: 422
    applies_to: "POST /hail-ops/work-tickets/{id}/submit"

  - priority: 34
    category: business_constraint
    check: "rework limit: start-repair from QC_FAILED requires rework_count <= MAX_REWORK_COUNT (2); re-triage from QC_FAILED requires rework_count > MAX_REWORK_COUNT"
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /hail-ops/vehicles/{id}/start-repair, /vehicles/{id}/triage"

  - priority: 35
    category: business_constraint
    check: "negotiation round limit: a COUNTER or a REVISE requires round_index < SUPPLEMENT_MAX_ROUNDS (3)"
    error_id: ERR_SUPPLEMENT_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /hail-ops/supplements/{id}/review, /supplements/{id}/revise"

  - priority: 36
    category: business_fiscal
    check: "targeting floor: a TARGET decision requires targeting_score >= TARGETING_SCORE_FLOOR (60)"
    error_id: ERR_TARGETING_SCORE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /hail-ops/storm-events/{id}/decision"

  - priority: 37
    category: business_fiscal
    check: "supplement cumulative cap: approved_supplement_cents + amount_under_test must not exceed calculations.supplement_gate.cumulative_cap_cents"
    error_id: ERR_SUPPLEMENT_CUMULATIVE_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /hail-ops/supplements, /supplements/{id}/revise"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- StormEvent -----------------------------------------------------------
  - method: POST
    path: "/hail-ops/storm-events"
    description: "Register a candidate hail event and score it for targeting"
    roles: [CatastropheDirector]
    code: 201
    input: [name, region_state_code, max_hail_size_mm, swath_area_km2, swath_confidence, vehicle_population_estimate, competitor_shop_count, first_hail_at]
    output: StormEvent
    side_effects: ["computes targeting_score via calculations.storm_targeting_score", "status := EVALUATING"]

  - method: GET
    path: "/hail-ops/storm-events/{id}"
    description: "Read one storm event"
    roles: [CatastropheDirector, CrewCoordinator, ShopEstimator, IntakeAdvisor]
    code: 200
    input: []
    output: StormEvent
    side_effects: []

  - method: POST
    path: "/hail-ops/storm-events/{id}/decision"
    description: "Target or decline the event (score-gated on TARGET)"
    roles: [CatastropheDirector]
    code: 200
    input: [decision]
    output: StormEvent
    side_effects: ["EVALUATING -> TARGETED or DECLINED", "increments StormEvent.version by 1"]

  - method: POST
    path: "/hail-ops/storm-events/{id}/activate"
    description: "Open the event for production once a facility is commissioned"
    roles: [CatastropheDirector]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["TARGETED -> ACTIVE", "increments StormEvent.version by 1"]

  - method: POST
    path: "/hail-ops/storm-events/{id}/demobilize"
    description: "Demobilize the event: freeze every facility, end every deployment, release housing"
    roles: [CatastropheDirector]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["ACTIVE -> DEMOBILIZING", "cascade hop 1: facilities -> DEMOBILIZED", "cascade hop 2: their crew deployments -> ENDED", "cascade hop 3: housing bed-nights and technician deployment_state recomputed", "increments StormEvent.version by 1"]

  - method: POST
    path: "/hail-ops/storm-events/{id}/close"
    description: "Close out the event after demobilization and billing settlement"
    roles: [CatastropheDirector]
    code: 200
    input: []
    output: StormEvent
    side_effects: ["DEMOBILIZING -> CLOSED", "ACTIVE rate agreements of the event -> SUPERSEDED", "increments StormEvent.version by 1"]

  # --- Facility -------------------------------------------------------------
  - method: POST
    path: "/hail-ops/facilities"
    description: "Stand up a temporary repair facility for a targeted event"
    roles: [CatastropheDirector]
    code: 201
    input: [storm_event_id, name, state_code, address, staging_slot_count, pay_model]
    output: Facility
    side_effects: ["status := SETUP", "posture computed (RESTRICTED while SETUP)"]

  - method: GET
    path: "/hail-ops/facilities/{id}"
    description: "Read one facility with recomputed posture and staging counters"
    roles: [CatastropheDirector, CrewCoordinator, ShopEstimator, IntakeAdvisor]
    code: 200
    input: []
    output: Facility
    side_effects: ["recomputes posture; may fire lazy permit expiry and the COMMISSIONED<->SUSPENDED transitions"]

  - method: GET
    path: "/hail-ops/facilities"
    description: "List facilities, filterable by event and status"
    roles: [CatastropheDirector, CrewCoordinator, ShopEstimator, IntakeAdvisor]
    code: 200
    input: ["storm_event_id?", "status?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []

  - method: POST
    path: "/hail-ops/facilities/{id}/commission"
    description: "Commission the site once permits and licensed crew are in place"
    roles: [CatastropheDirector]
    code: 200
    input: []
    output: Facility
    side_effects: ["SETUP -> COMMISSIONED", "posture recomputed", "increments Facility.version by 1"]

  - method: GET
    path: "/hail-ops/facilities/{id}/throughput-summary"
    description: "Computed staging/throughput read for the facility"
    roles: [CatastropheDirector, ShopEstimator, IntakeAdvisor]
    code: 200
    input: []
    output: { staging_slot_count: integer, staging_slots_occupied: integer, staging_slots_free: integer, staging_occupancy_ratio: number, posture: string, open_vehicle_count: integer, vehicles_in_repair: integer, vehicles_ready: integer, released_count: integer, on_site_technician_count: integer, projected_days_to_clear: integer, billable_accrued_cents: integer, absorbed_rental_cents: integer }
    side_effects: ["recomputes posture and calculations.facility_throughput_projection"]

  # --- Permit ---------------------------------------------------------------
  - method: POST
    path: "/hail-ops/permits"
    description: "File a permit application for a facility"
    roles: [CatastropheDirector]
    code: 201
    input: [facility_id, permit_type, issuing_jurisdiction]
    output: Permit
    side_effects: ["status := PENDING"]

  - method: POST
    path: "/hail-ops/permits/{id}/decision"
    description: "Municipal decision on a pending permit"
    roles: [PermitOfficer]
    code: 200
    input: [decision, "valid_from?", "valid_to?"]
    output: Permit
    side_effects: ["PENDING -> APPROVED or DENIED", "facility posture recomputed; a SUSPENDED facility may return to COMMISSIONED"]

  - method: GET
    path: "/hail-ops/facilities/{id}/permits"
    description: "Reverse lookup: permits filed for this facility"
    roles: [CatastropheDirector, CrewCoordinator, ShopEstimator, IntakeAdvisor, PermitOfficer]
    code: 200
    input: ["permit_type?", "status?"]
    output: Permit[]
    side_effects: ["recomputes posture; may fire lazy permit expiry"]

  # --- HousingUnit ----------------------------------------------------------
  - method: POST
    path: "/hail-ops/housing-units"
    description: "Register crew housing for a facility"
    roles: [CrewCoordinator]
    code: 201
    input: [facility_id, label, bed_count, nightly_rate_cents]
    output: HousingUnit
    side_effects: []

  - method: GET
    path: "/hail-ops/facilities/{id}/housing-units"
    description: "Reverse lookup: housing units of this facility with live occupancy"
    roles: [CatastropheDirector, CrewCoordinator, ShopEstimator, IntakeAdvisor]
    code: 200
    input: []
    output: HousingUnit[]
    side_effects: []

  # --- Technician -----------------------------------------------------------
  - method: POST
    path: "/hail-ops/technicians"
    description: "Add a traveling technician to the roster"
    roles: [CrewCoordinator]
    code: 201
    input: [full_name, home_state_code, license_state_code, license_expires_at, skill_tier, flat_split_pct]
    output: Technician
    side_effects: ["deployment_state := AVAILABLE"]

  - method: GET
    path: "/hail-ops/technicians/{id}"
    description: "Read one technician with accrued pay"
    roles: [CatastropheDirector, CrewCoordinator, ShopEstimator, IntakeAdvisor, PdrTechnician, QualityInspector]
    code: 200
    input: []
    output: Technician
    side_effects: []

  # --- CrewDeployment -------------------------------------------------------
  - method: POST
    path: "/hail-ops/crew-deployments"
    description: "Deploy a technician to a facility for a date interval, optionally into crew housing"
    roles: [CrewCoordinator]
    code: 201
    input: [technician_id, facility_id, start_date, end_date, "housing_unit_id?"]
    output: CrewDeployment
    side_effects: ["status := CONFIRMED", "pay_split_pct_snapshot := Technician.flat_split_pct", "Technician.deployment_state and HousingUnit occupancy recomputed"]

  - method: GET
    path: "/hail-ops/crew-deployments/{id}"
    description: "Read one crew deployment"
    roles: [CatastropheDirector, CrewCoordinator, ShopEstimator, IntakeAdvisor]
    code: 200
    input: []
    output: CrewDeployment
    side_effects: []

  - method: GET
    path: "/hail-ops/crew-deployments"
    description: "List crew deployments, filterable by technician, facility or housing unit"
    roles: [CatastropheDirector, CrewCoordinator, ShopEstimator, IntakeAdvisor]
    code: 200
    input: ["technician_id?", "facility_id?", "housing_unit_id?", "status?", "limit?", "offset?"]
    output: CrewDeployment[]
    side_effects: []

  - method: POST
    path: "/hail-ops/crew-deployments/{id}/status"
    description: "Advance a deployment to ON_SITE, ENDED or CANCELLED"
    roles: [CrewCoordinator]
    code: 200
    input: [to_status]
    output: CrewDeployment
    side_effects: ["status transition per §1.2", "housing occupancy, bed-nights and technician deployment_state recomputed", "facility posture recomputed", "increments CrewDeployment.version by 1"]

  # --- Insurer / RateAgreement ---------------------------------------------
  - method: POST
    path: "/hail-ops/insurers"
    description: "Register a carrier and its direct-billing flag"
    roles: [CatastropheDirector]
    code: 201
    input: [name, naic_code, direct_bill_enabled]
    output: Insurer
    side_effects: []

  - method: GET
    path: "/hail-ops/insurers/{id}"
    description: "Read one carrier with outstanding and settled balances (and its OCC version)"
    roles: [CatastropheDirector, ShopEstimator, InsurerAdjuster, BillingCoordinator]
    code: 200
    input: []
    output: Insurer
    side_effects: []

  - method: POST
    path: "/hail-ops/rate-agreements"
    description: "Draft a storm-specific rate agreement for a carrier"
    roles: [CatastropheDirector]
    code: 201
    input: [insurer_id, storm_event_id, effective_from, matrix_rate_dime_cents, matrix_rate_nickel_cents, matrix_rate_quarter_cents, matrix_rate_half_dollar_cents, labor_rate_cents_per_hour, panel_cap_cents, admin_fee_pct, admin_fee_cap_cents, supplement_auto_approve_pct, rental_cap_days, rental_daily_rate_cents]
    output: RateAgreement
    side_effects: ["status := DRAFT (no Insurer mutation, so Insurer.version is untouched)"]

  - method: GET
    path: "/hail-ops/rate-agreements/{id}"
    description: "Read one rate agreement"
    roles: [CatastropheDirector, ShopEstimator, InsurerAdjuster, BillingCoordinator]
    code: 200
    input: []
    output: RateAgreement
    side_effects: []

  - method: GET
    path: "/hail-ops/rate-agreements"
    description: "List rate agreements, filterable by carrier and event"
    roles: [CatastropheDirector, ShopEstimator, InsurerAdjuster, BillingCoordinator]
    code: 200
    input: ["insurer_id?", "storm_event_id?", "status?", "limit?", "offset?"]
    output: RateAgreement[]
    side_effects: []

  - method: POST
    path: "/hail-ops/rate-agreements/{id}/activate"
    description: "Activate a drafted agreement, superseding the carrier's previous one for the event (OCC on Insurer.version)"
    roles: [CatastropheDirector]
    code: 200
    input: [expected_insurer_version]
    output: RateAgreement
    side_effects: ["DRAFT -> ACTIVE", "prior ACTIVE agreement for the same (insurer_id, storm_event_id) -> SUPERSEDED", "increments Insurer.version by 1", "recomputes Insurer.active_rate_agreement_count", "increments RateAgreement.version by 1"]

  # --- Vehicle --------------------------------------------------------------
  - method: POST
    path: "/hail-ops/vehicles"
    description: "Take a hail-damaged vehicle into a staging slot (opens the rental when required)"
    roles: [IntakeAdvisor]
    code: 201
    input: [facility_id, insurer_id, vin, model_year, make, model, acv_cents, owner_name, rental_required]
    output: Vehicle
    side_effects: ["repair_status := INTAKE; billing_status := UNBILLED", "rental_opened_at := current clock when rental_required == true", "Facility staging counters, occupancy ratio and posture recomputed"]

  - method: GET
    path: "/hail-ops/vehicles/{id}"
    description: "Read one vehicle: both estimate variants, triage, money chain, both status dimensions and its OCC version"
    roles: [CatastropheDirector, ShopEstimator, IntakeAdvisor, PdrTechnician, QualityInspector, InsurerAdjuster, BillingCoordinator]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/hail-ops/vehicles"
    description: "List vehicles, filterable by facility, carrier, pinned agreement and either status dimension"
    roles: [CatastropheDirector, ShopEstimator, IntakeAdvisor, PdrTechnician, QualityInspector, InsurerAdjuster, BillingCoordinator]
    code: 200
    input: ["facility_id?", "insurer_id?", "pinned_rate_agreement_id?", "repair_status?", "billing_status?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  - method: POST
    path: "/hail-ops/vehicles/{id}/estimate"
    description: "Pin a rate agreement and price the damage matrix under both variants"
    roles: [ShopEstimator]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["pins pinned_rate_agreement_id via calculations.rate_agreement_selector", "writes both variant totals and every DamageLine's routing per calculations.vehicle_repair_estimate", "INTAKE|ESTIMATED -> ESTIMATED", "increments Vehicle.version by 1"]

  - method: POST
    path: "/hail-ops/vehicles/{id}/triage"
    description: "Recommend paintless repair, conventional repair or total loss"
    roles: [ShopEstimator]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["writes triage_disposition and approved_repair_cents per calculations.repairability_triage", "recomputes the money chain per calculations.vehicle_net_billable", "ESTIMATED -> TRIAGED or TOTAL_LOSS_PENDING; QC_FAILED -> TRIAGED on re-triage (voids OPEN/SUBMITTED work tickets, resets rework_count)", "increments Vehicle.version by 1"]

  - method: POST
    path: "/hail-ops/vehicles/{id}/billing"
    description: "Carrier billing dimension: AUTHORIZE, VOID_AUTHORIZATION, SUBMIT_BILL or SETTLE"
    roles: [InsurerAdjuster, BillingCoordinator]
    code: 200
    input: [action]
    output: Vehicle
    side_effects: ["billing_status transition per §1.2 dimension B", "Facility.billable_accrued_cents and Insurer.outstanding_direct_bill_cents / settled_cents adjusted by net_billable_cents", "increments Vehicle.version by 1"]

  - method: POST
    path: "/hail-ops/vehicles/{id}/start-repair"
    description: "Move a triaged (or reworked) vehicle onto the repair floor"
    roles: [ShopEstimator]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["TRIAGED|QC_FAILED -> IN_REPAIR", "increments Vehicle.version by 1"]

  - method: POST
    path: "/hail-ops/vehicles/{id}/release"
    description: "Release a READY vehicle with warranty, or tow out a total loss; closes the rental"
    roles: [IntakeAdvisor]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["READY -> RELEASED (mints warranty_number, sets warranty_expires_at, increments Facility.warranty_counter) or TOTAL_LOSS_PENDING -> TOWED_OUT (no warranty)", "writes rental_days_billed and shop_absorbed_rental_cents per calculations.rental_exposure", "frees the staging slot; Facility counters, absorbed_rental_cents and posture recomputed", "increments Vehicle.version by 1"]

  # --- DamageLine -----------------------------------------------------------
  - method: POST
    path: "/hail-ops/damage-lines"
    description: "Record one panel of the damage matrix (panel, dent count, dent size, aluminum, R&I, conventional inputs)"
    roles: [IntakeAdvisor]
    code: 201
    input: [vehicle_id, panel_code, dent_count, dent_size_class, aluminum, conventional_labor_hours, conventional_paint_materials_cents, "r_and_i_hours?", "oversize_dent_count?"]
    output: DamageLine
    side_effects: ["computed line fields stay null until the next estimate call"]

  - method: GET
    path: "/hail-ops/vehicles/{id}/damage-lines"
    description: "Reverse lookup: the vehicle's damage matrix with per-panel pricing and routing"
    roles: [CatastropheDirector, ShopEstimator, IntakeAdvisor, PdrTechnician, QualityInspector, InsurerAdjuster]
    code: 200
    input: ["routed_to?"]
    output: DamageLine[]
    side_effects: []

  # --- WorkTicket -----------------------------------------------------------
  - method: POST
    path: "/hail-ops/work-tickets"
    description: "Technician opens a labor ticket against a vehicle in repair"
    roles: [PdrTechnician]
    code: 201
    input: [vehicle_id, technician_id, labor_units, dents_repaired, panels_worked]
    output: WorkTicket
    side_effects: ["status := OPEN"]

  - method: GET
    path: "/hail-ops/work-tickets/{id}"
    description: "Read one work ticket with both pay variants"
    roles: [CatastropheDirector, ShopEstimator, IntakeAdvisor, PdrTechnician, QualityInspector, CrewCoordinator]
    code: 200
    input: []
    output: WorkTicket
    side_effects: []

  - method: GET
    path: "/hail-ops/work-tickets"
    description: "List work tickets, filterable by vehicle and technician"
    roles: [CatastropheDirector, ShopEstimator, IntakeAdvisor, PdrTechnician, QualityInspector, CrewCoordinator]
    code: 200
    input: ["vehicle_id?", "technician_id?", "status?", "limit?", "offset?"]
    output: WorkTicket[]
    side_effects: []

  - method: POST
    path: "/hail-ops/work-tickets/{id}/submit"
    description: "Submit a labor ticket; the last open ticket pushes the vehicle to QC"
    roles: [PdrTechnician]
    code: 200
    input: []
    output: WorkTicket
    side_effects: ["OPEN -> SUBMITTED", "when no OPEN ticket remains on the vehicle: Vehicle IN_REPAIR -> QC_PENDING", "increments WorkTicket.version by 1"]

  # --- Supplement -----------------------------------------------------------
  - method: POST
    path: "/hail-ops/supplements"
    description: "File a supplement against a vehicle's pinned rate agreement (OCC on Vehicle.version)"
    roles: [ShopEstimator]
    code: 201
    input: [vehicle_id, reason_code, requested_amount_cents, expected_vehicle_version, "supersedes_supplement_id?"]
    output: Supplement
    side_effects: ["rate_agreement_id := Vehicle.pinned_rate_agreement_id; round_index := 1", "status := UNDER_REVIEW, or AUTO_APPROVED when calculations.supplement_gate clears it (then the vehicle money chain, Facility.billable_accrued_cents and Insurer.outstanding_direct_bill_cents cascade)", "increments Vehicle.version by 1"]

  - method: GET
    path: "/hail-ops/supplements/{id}"
    description: "Read one supplement with its negotiation round"
    roles: [CatastropheDirector, ShopEstimator, InsurerAdjuster, BillingCoordinator]
    code: 200
    input: []
    output: Supplement
    side_effects: []

  - method: GET
    path: "/hail-ops/supplements"
    description: "List supplements, filterable by vehicle, pinned agreement or superseded predecessor"
    roles: [CatastropheDirector, ShopEstimator, InsurerAdjuster, BillingCoordinator]
    code: 200
    input: ["vehicle_id?", "rate_agreement_id?", "supersedes_supplement_id?", "status?", "limit?", "offset?"]
    output: Supplement[]
    side_effects: []

  - method: POST
    path: "/hail-ops/supplements/{id}/review"
    description: "Adjuster approves, counters or denies a supplement"
    roles: [InsurerAdjuster]
    code: 200
    input: [decision, "counter_amount_cents?"]
    output: Supplement
    side_effects: ["UNDER_REVIEW -> APPROVED | COUNTERED | DENIED", "on APPROVE: vehicle money chain, Facility.billable_accrued_cents and Insurer.outstanding_direct_bill_cents cascade", "increments Supplement.version by 1"]

  - method: POST
    path: "/hail-ops/supplements/{id}/revise"
    description: "Shop revises a countered supplement (next round) or withdraws it"
    roles: [ShopEstimator]
    code: 200
    input: [action, "revised_amount_cents?"]
    output: Supplement
    side_effects: ["COUNTERED -> UNDER_REVIEW with round_index += 1, or {UNDER_REVIEW, COUNTERED} -> WITHDRAWN", "increments Supplement.version by 1"]

  # --- QualityInspection ----------------------------------------------------
  - method: POST
    path: "/hail-ops/quality-inspections"
    description: "Record a quality inspection; PASS approves the crew's tickets, FAIL sends the vehicle back for rework"
    roles: [QualityInspector]
    code: 201
    input: [vehicle_id, inspector_technician_id, result, "defect_panel_codes?"]
    output: QualityInspection
    side_effects: ["QC_PENDING -> READY on PASS (cascade: SUBMITTED tickets -> APPROVED with both pay variants, then technician pay recomputed)", "QC_PENDING -> QC_FAILED on FAIL with rework_count += 1"]

  - method: GET
    path: "/hail-ops/quality-inspections/{id}"
    description: "Read one quality inspection"
    roles: [CatastropheDirector, ShopEstimator, IntakeAdvisor, QualityInspector, CrewCoordinator]
    code: 200
    input: []
    output: QualityInspection
    side_effects: []

  - method: GET
    path: "/hail-ops/quality-inspections"
    description: "List quality inspections, filterable by vehicle, inspector and result"
    roles: [CatastropheDirector, ShopEstimator, IntakeAdvisor, QualityInspector, CrewCoordinator]
    code: 200
    input: ["vehicle_id?", "inspector_technician_id?", "result?", "limit?", "offset?"]
    output: QualityInspection[]
    side_effects: []

  # --- test-driving endpoint (outside the public business surface) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-08-01T00:00:00Z; until this endpoint is called the logical clock reads that default and never falls back to real wall-clock time. Every date/expiry/window rule in this scaffold reads the logical clock."
    roles: [CatastropheDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["moves the logical clock; subsequent posture recomputations may expire permits and suspend facilities"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role is not a declared §1.7 role" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "acting role is not listed on the endpoint" }
  - { id: ERR_IDENTITY_MISMATCH, http: 403, condition: "entity_backed role's X-User-ID does not equal the resource's owning FK (technician_id, inspector_technician_id, or the vehicle's insurer_id)" }
  - { id: ERR_BILLING_ACTION_ROLE_MISMATCH, http: 403, condition: "billing action requested by the wrong side: AUTHORIZE/VOID_AUTHORIZATION/SETTLE by a BillingCoordinator, or SUBMIT_BILL by an InsurerAdjuster" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the inspecting technician holds a WorkTicket on the vehicle under inspection" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, unknown enum member, out-of-range number, inverted date interval, or defect_panel_codes non-empty on a PASS" }
  - { id: ERR_STORM_EVENT_NOT_FOUND, http: 404, condition: "storm event id in the path or body does not resolve" }
  - { id: ERR_FACILITY_NOT_FOUND, http: 404, condition: "facility id in the path or body does not resolve" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "vehicle id in the path or body does not resolve" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "technician id in the path or body does not resolve" }
  - { id: ERR_INSURER_NOT_FOUND, http: 404, condition: "insurer id in the path or body does not resolve" }
  - { id: ERR_RATE_AGREEMENT_NOT_FOUND, http: 404, condition: "rate agreement id in the path does not resolve" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "permit, housing unit, crew deployment, damage line, work ticket, supplement or quality inspection id does not resolve" }
  - { id: ERR_STALE_INSURER_VERSION, http: 412, condition: "expected_insurer_version does not match Insurer.version on rate-agreement activation" }
  - { id: ERR_STALE_VEHICLE_VERSION, http: 412, condition: "expected_vehicle_version does not match Vehicle.version on supplement creation" }
  - { id: ERR_INVALID_STORM_EVENT_STATE, http: 409, condition: "storm event lifecycle transition attempted from a state that does not allow it, or a child is created against an event in the wrong state" }
  - { id: ERR_INVALID_FACILITY_STATE, http: 409, condition: "commission attempted on a facility whose status is not SETUP" }
  - { id: ERR_FACILITY_NOT_COMMISSIONED, http: 409, condition: "child operation requires Facility.status == COMMISSIONED (facility is SETUP, SUSPENDED or DEMOBILIZED)" }
  - { id: ERR_PERMIT_ALREADY_DECIDED, http: 409, condition: "decision recorded on a permit whose status is not PENDING" }
  - { id: ERR_INVALID_LIFECYCLE_STATE, http: 409, condition: "crew-deployment or work-ticket transition attempted from a state that does not allow it" }
  - { id: ERR_INVALID_VEHICLE_REPAIR_STATE, http: 409, condition: "vehicle repair-dimension operation attempted from a repair_status that does not allow it" }
  - { id: ERR_INVALID_VEHICLE_BILLING_STATE, http: 409, condition: "vehicle billing-dimension operation attempted from a billing_status that does not allow it, or start-repair/release attempted while billing_status != AUTHORIZED" }
  - { id: ERR_INVALID_SUPPLEMENT_STATE, http: 409, condition: "review/revise attempted from a supplement status that does not allow it, or supersedes_supplement_id points at a supplement not in {DENIED, WITHDRAWN}" }
  - { id: ERR_FACILITY_POSTURE_BLOCKED, http: 409, condition: "facility posture forbids the operation: intake needs OPEN, start-repair and work-ticket creation need posture != FROZEN" }
  - { id: ERR_REQUIRED_PERMIT_MISSING, http: 409, condition: "commissioning attempted without an APPROVED, in-window permit for every REQUIRED_PERMIT_TYPES type" }
  - { id: ERR_NO_LICENSED_TECHNICIAN, http: 409, condition: "commissioning attempted with no CONFIRMED/ON_SITE deployment whose technician is licensed in the facility's state" }
  - { id: ERR_NO_COMMISSIONED_FACILITY, http: 409, condition: "activation attempted while no facility of the event is COMMISSIONED" }
  - { id: ERR_INSPECTOR_NOT_DEPLOYED, http: 409, condition: "the inspecting or ticketing technician has no ON_SITE deployment at the vehicle's facility" }
  - { id: ERR_NO_ACTIVE_RATE_AGREEMENT, http: 409, condition: "no ACTIVE rate agreement matches (insurer, storm event, effective_from <= clock date) for the estimate, or a supplement is filed against a vehicle with no pinned agreement" }
  - { id: ERR_DIRECT_BILL_NOT_ENABLED, http: 409, condition: "authorization attempted for a carrier whose direct_bill_enabled is false" }
  - { id: ERR_EVENT_CLOSEOUT_BLOCKED, http: 409, condition: "demobilization attempted with non-terminal vehicles, or closing attempted with a facility still live or a vehicle still AUTHORIZED/BILLED" }
  - { id: ERR_TECHNICIAN_DEPLOYMENT_OVERLAP, http: 409, condition: "requested deployment interval collides with another CONFIRMED/ON_SITE deployment of the same technician once REST_BUFFER_DAYS (1 day) is added to both ends" }
  - { id: ERR_HOUSING_CAPACITY_EXCEEDED, http: 409, condition: "on some date inside the requested half-open interval the housing unit's concurrent occupancy would exceed bed_count" }
  - { id: ERR_DUPLICATE_VIN_AT_FACILITY, http: 409, condition: "another non-terminal vehicle with the same VIN is already staged at the facility" }
  - { id: ERR_REWORK_LIMIT_EXCEEDED, http: 409, condition: "start-repair attempted with rework_count > MAX_REWORK_COUNT, or re-triage attempted with rework_count <= MAX_REWORK_COUNT" }
  - { id: ERR_SUPPLEMENT_ROUND_LIMIT, http: 409, condition: "COUNTER or REVISE attempted when round_index has reached SUPPLEMENT_MAX_ROUNDS" }
  - { id: ERR_TECHNICIAN_LICENSE_INVALID, http: 422, condition: "technician licence expired against the logical clock date, or licensed in a different state than the facility" }
  - { id: ERR_NO_DAMAGE_LINES, http: 422, condition: "estimate requested for a vehicle with zero damage lines" }
  - { id: ERR_ZERO_LABOR_UNITS, http: 422, condition: "work-ticket submission with labor_units == 0" }
  - { id: ERR_TARGETING_SCORE_BELOW_FLOOR, http: 422, condition: "TARGET decision on an event whose targeting_score is below TARGETING_SCORE_FLOOR" }
  - { id: ERR_SUPPLEMENT_CUMULATIVE_CAP_EXCEEDED, http: 422, condition: "approved supplements plus the amount under test would exceed SUPPLEMENT_CUMULATIVE_CAP_PCT of approved_repair_cents" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: CatastropheDirector
    description: "Owns event targeting, facility standing-up, carrier onboarding and rate agreements; runs demobilization and closeout"
    identity: opaque
    exclusive_operations:
      - "POST /hail-ops/storm-events"
      - "POST /hail-ops/storm-events/{id}/decision"
      - "POST /hail-ops/storm-events/{id}/activate"
      - "POST /hail-ops/storm-events/{id}/demobilize"
      - "POST /hail-ops/storm-events/{id}/close"
      - "POST /hail-ops/facilities"
      - "POST /hail-ops/facilities/{id}/commission"
      - "POST /hail-ops/permits"
      - "POST /hail-ops/insurers"
      - "POST /hail-ops/rate-agreements"
      - "POST /hail-ops/rate-agreements/{id}/activate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on storm-events, facilities, permits, housing-units, technicians, crew-deployments, insurers, rate-agreements, vehicles, damage-lines, work-tickets, supplements, quality-inspections and throughput-summary"

  - name: PermitOfficer
    description: "Municipal authority that decides permit applications; never files them and never touches production"
    identity: opaque
    exclusive_operations:
      - "POST /hail-ops/permits/{id}/decision"
    shared_operations:
      - "GET /hail-ops/facilities/{id}/permits"

  - name: CrewCoordinator
    description: "Sources traveling technicians, books housing and drives deployment status"
    identity: opaque
    exclusive_operations:
      - "POST /hail-ops/technicians"
      - "POST /hail-ops/housing-units"
      - "POST /hail-ops/crew-deployments"
      - "POST /hail-ops/crew-deployments/{id}/status"
    shared_operations:
      - "GET on storm-events, facilities, permits, housing-units, technicians, crew-deployments, work-tickets, quality-inspections"

  - name: IntakeAdvisor
    description: "Runs the intake lane: takes vehicles in, records the damage matrix, releases finished vehicles"
    identity: opaque
    exclusive_operations:
      - "POST /hail-ops/vehicles"
      - "POST /hail-ops/damage-lines"
      - "POST /hail-ops/vehicles/{id}/release"
    shared_operations:
      - "GET on storm-events, facilities, permits, housing-units, technicians, crew-deployments, vehicles, damage-lines, work-tickets, quality-inspections and throughput-summary"

  - name: ShopEstimator
    description: "Prices the damage matrix, triages repairability and negotiates supplements on the shop's side"
    identity: opaque
    exclusive_operations:
      - "POST /hail-ops/vehicles/{id}/estimate"
      - "POST /hail-ops/vehicles/{id}/triage"
      - "POST /hail-ops/vehicles/{id}/start-repair"
      - "POST /hail-ops/supplements"
      - "POST /hail-ops/supplements/{id}/revise"
    shared_operations:
      - "GET on storm-events, facilities, permits, housing-units, technicians, crew-deployments, insurers, rate-agreements, vehicles, damage-lines, work-tickets, supplements, quality-inspections and throughput-summary"

  - name: PdrTechnician
    description: "Paintless technician logging labor on vehicles; can only file tickets for themself"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /hail-ops/work-tickets"
      - "POST /hail-ops/work-tickets/{id}/submit"
    shared_operations:
      - "GET on technicians, vehicles, damage-lines, work-tickets"

  - name: QualityInspector
    description: "Inspecting technician; separated by duty from every technician who logged labor on the vehicle"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /hail-ops/quality-inspections"
    shared_operations:
      - "GET on technicians, vehicles, damage-lines, work-tickets, quality-inspections"

  - name: InsurerAdjuster
    description: "Carrier adjuster: authorizes direct billing, settles paid claims and reviews supplements for their own carrier"
    identity: "entity_backed:Insurer"
    exclusive_operations:
      - "POST /hail-ops/supplements/{id}/review"
      - "POST /hail-ops/vehicles/{id}/billing with action IN {AUTHORIZE, VOID_AUTHORIZATION, SETTLE}"
    shared_operations:
      - "GET on insurers, rate-agreements, vehicles, damage-lines, supplements"

  - name: BillingCoordinator
    description: "Shop-side biller who submits released vehicles to the carrier; cannot authorize or settle"
    identity: opaque
    exclusive_operations:
      - "POST /hail-ops/vehicles/{id}/billing with action == SUBMIT_BILL"
    shared_operations:
      - "GET on insurers, rate-agreements, vehicles, supplements"
