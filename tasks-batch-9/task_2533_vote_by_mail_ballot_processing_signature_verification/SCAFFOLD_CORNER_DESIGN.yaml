  - section: validations
    instances:

      - name: inactive_voter_cannot_open_a_ballot_request
        claim_type: Violation → Error
        grounds:
          - validations[ERR_VOTER_REGISTRATION_INACTIVE]
          - entities.Voter.fields.registration_status
        distinguishing_aspect: "A voter created with registration_status INACTIVE fails the priority-9 referential rule with 422 ERR_VOTER_REGISTRATION_INACTIVE, and no BallotRequest or AddressVerification row is written."
        test_recipe:
          setup:
            - "Election e1 in PRE_MAIL; voter vI created with registration_status INACTIVE."
