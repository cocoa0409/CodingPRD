      - name: corner_error_funding_guards_on_base_and_grant
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CAPITAL_GRANT_EXCEEDS_BASE]
          - errors[ERR_ALLOCABLE_BASE_NOT_POSITIVE]
          - validations[priority=41]
          - validations[priority=42]
          - calculations.franchise_fee_allocation
        distinguishing_aspect: "Both fiscal guards read the basis-selected base rather than the gross fee, and they fire at different moments: the grant ceiling is enforced at creation and revision, while the positive-base rule only bites at report submission, so a zero-base period can be drafted but never submitted."
        test_recipe:
          setup:
            - "No funding period exists yet."
          setup_api_calls: []
          trigger:
            - call: "POST /funding-periods"
              payload: {fiscal_year: 2026, quarter: 1, basis: "ACCRUAL", gross_franchise_fee_cents: 9000000, service_period_earned_cents: 5000000, remittance_received_cents: 8000000, capital_grant_cents: 5000001}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {grant_err: $.data.error_id}
            - call: "POST /funding-periods"
              payload: {fiscal_year: 2026, quarter: 1, basis: "CASH", gross_franchise_fee_cents: 9000000, service_period_earned_cents: 5000000, remittance_received_cents: 8000000, capital_grant_cents: 5000001}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {cash_id: $.data.id, cash_grant: $.data.capital_grant_cents, cash_status: $.data.report_status}
            - call: "POST /funding-periods"
              payload: {fiscal_year: 2026, quarter: 2, basis: "ACCRUAL", gross_franchise_fee_cents: 4000000, service_period_earned_cents: 0, remittance_received_cents: 4000000, capital_grant_cents: 0}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {zero_id: $.data.id, zero_base: $.data.allocable_base_cents, zero_v: $.data.version}
            - call: "POST /funding-periods/${zero_id}/report-submit"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {base_err: $.data.error_id}
            - call: "POST /funding-periods/${zero_id}/revise"
              payload: {expected_funding_period_version: "${zero_v}", capital_grant_cents: 9999999}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {revise_err: $.data.error_id}
          assert:
            - "${grant_err} == ERR_CAPITAL_GRANT_EXCEEDS_BASE (402) — the ACCRUAL base is service_period_earned 5000000, one cent below the grant"
            - "${cash_status} == DRAFT with ${cash_grant} == 5000001 — under CASH the base is remittance_received 8000000, so the identical grant is legal"
            - "${zero_base} == 0 — allocation fields stay zero until submission, and creation is not blocked"
            - "${base_err} == ERR_ALLOCABLE_BASE_NOT_POSITIVE (402) even though gross_franchise_fee_cents is 4000000"
            - "${revise_err} == ERR_CAPITAL_GRANT_EXCEEDS_BASE (402) — the same ceiling applies on revision, and the version guard passes because ${zero_v} is current"
            - "FundingPeriod.${zero_id}.report_status is still DRAFT and capital_grant_cents is still 0"

      - name: corner_error_course_temporal_guards_bracket_the_session
        claim_type: error_triggerable
        grounds:
          - errors[ERR_COURSE_SESSION_NOT_ENDED]
          - errors[ERR_WITHDRAWAL_WINDOW_CLOSED]
          - validations[priority=23]
          - validations[priority=24]
        distinguishing_aspect: "The two temporal guards bracket the same session from opposite ends and both are boundary-inclusive against the session edges: at the instant the session starts, withdrawal is already closed while attendance is still premature, so there is a window in which neither call is available."
        test_recipe:
          setup:
            - "Producer P is ACTIVE and enrolled in TV-101, whose session runs 2026-08-05T17:00:00Z to 2026-08-05T21:00:00Z."
            - "The clock starts at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /producers"
              payload: {legal_name: "Ada Lovelace", email: "ada@patv.example"}
              as: CenterAdmin
              as_user_id: "adm-1"
              captures: {p_id: $.data.id}
            - call: "POST /producers/${p_id}/residency-verification"
              payload: {document_reference: "UTIL-2026-0001"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /training-courses"
              payload: {course_code: "TV-101", title: "Studio Basics", tier: "BASIC", grants_competency_codes: ["STUDIO_FLOOR"], seat_capacity: 12, session_start_at: "2026-08-05T17:00:00Z", session_end_at: "2026-08-05T21:00:00Z"}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {c_id: $.data.id}
            - call: "POST /course-enrollments"
              payload: {producer_id: "${p_id}", course_id: "${c_id}"}
              as: Producer
              as_user_id: "${p_id}"
              captures: {e_id: $.data.id, e_status: $.data.status}
          trigger:
            - call: "POST /course-enrollments/${e_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {early_att_err: $.data.error_id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-05T16:59:59Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-05T17:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${e_id}/withdraw"
              payload: {}
              as: Producer
              as_user_id: "${p_id}"
              captures: {withdraw_err: $.data.error_id}
            - call: "POST /course-enrollments/${e_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {mid_att_err: $.data.error_id}
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-05T21:00:00Z"}
              as: CenterAdmin
              as_user_id: "adm-1"
            - call: "POST /course-enrollments/${e_id}/attendance"
              payload: {attended: true}
              as: TrainingCoordinator
              as_user_id: "trn-1"
              captures: {att_status: $.data.status, att_at: $.data.attended_at}
          assert:
            - "${e_status} == ENROLLED at creation"
            - "${early_att_err} == ERR_COURSE_SESSION_NOT_ENDED (409) at the default clock"
            - "${withdraw_err} == ERR_WITHDRAWAL_WINDOW_CLOSED (409) at exactly session_start_at — the window closes inclusively"
            - "${mid_att_err} == ERR_COURSE_SESSION_NOT_ENDED (409) mid-session"
            - "${att_status} == ATTENDED with ${att_at} == 2026-08-05T21:00:00Z — the attendance guard opens inclusively at session_end_at"
            - "TrainingCourse.${c_id}.enrolled_count is still 1 and passed_count is still 0"

