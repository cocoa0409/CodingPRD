            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Unexpected monthly maintenance fee, complaint two of three.", is_reg_e_dispute: false }
              as: ComplianceOfficer
              as_user_id: "co-brett"
            - call: "POST /oversight/complaints"
              payload: { partner_id: "${pa_id}", channel: "EMAIL", category: "FEES", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Unexpected monthly maintenance fee, complaint three of three.", is_reg_e_dispute: false }
              as: ComplianceOfficer
