  - rule_id: cross_entity_state_dependency
    instances:
      - name: recommend_blocked_by_conveyed_property_custody
        grounds:
          - state_machines.DispositionApplication.status.SCREENED_to_RECOMMENDED
          - validations[priority=64]
          - entities.Property.fields.custody_status
          - errors.ERR_PROPERTY_NOT_LISTED
        distinguishing_aspect: |
          The application under test is itself in a perfectly legal from-state (SCREENED with a
          passing governing screening and a different officer acting), so nothing about the
          DispositionApplication row explains the rejection. The blocking condition lives entirely
          on the related Property, whose custody_status was moved to CONVEYED by a competing
          applicant's agreement, and the guard is on the parent's state rather than on any field
          the caller supplies.
        test_recipe:
          setup:
            - "One 8500 sqft parcel, assessed 1000000 cents, grade C, acquired, quiet-titled CLEAR and LISTED."
            - "Applicant B's DEVELOPER_RFP application is submitted and screened PASS by officer disp-1, so it rests in SCREENED."
            - "Applicant A's application is screened, recommended, board-approved and converted into an executed agreement, which conveys the parcel."
            - "The parcel's title_status stays CLEAR throughout, so the priority-63 title gate cannot fire and only the custody gate at priority 64 can."
