            - call: "POST /regions"
              payload: { code: "BND_REG2", name: "Bnd2", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
          trigger:
            - call: "GET /vouchers?issuing_region_id=${rid}"
              payload: {}
              as: Caseworker
          assert:
            - "response.status == 200"
            - "response.data == []"
            - "response.meta_total_count == 0"

