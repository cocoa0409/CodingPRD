# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_1448_forging_plant
# §1.8 Test Targeting Index: 2+ instances per each of the nine §0.5 rules.
# Every test_recipe is replay-verified against SCAFFOLD.yaml §1.2/§1.4/§1.5.
# Canonical fixture literals (unless an instance overrides them):
#   alloy AISI-4140: window [2100,2300]F, reheat_limit 2, flash_allow 12.0%,
#     strokes/part 3, flow_stress 8.0 ksi, C<=0.43, Mn<=1.10, grain_min 5, etch required
#   heat: received 20000.00 lbs, bar 2.50 lbs/in  (20.0in cut -> 50.00 lb billet)
#   work order WO: qty 10, net 40.00, billet 50.00, area 25.0 -> 100t required,
#     tiers: 1.0t@2000000 / 5.0t@1800000 / over@1500000, scrap rate 150 c/lb
#   surcharge (4140, 2026-08): 250000 c/t, energy 0.10 ; furnace cap 5000 lb
#   logical clock default 2026-08-01T00:00:00Z (month 2026-08 matches surcharge)
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_pricing
        grounds:
          - calculations.invoice_price
          - entities.Invoice.fields.billable_weight_lbs
          - state_machines.Invoice.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          Same invoice_price formula, two sanctioned billing bases on the SAME
          invoice: PROVISIONAL uses estimated weight (ordered_qty * part_net)
          while FINAL uses actual shipped scale weight — identical formula and
          pinned surcharge index, different cents. Entity domain: Invoice
          (pricing), distinct from the WorkOrder material variant below.
        test_recipe:
          setup:
            - "Alloy AISI-4140; surcharge index (4140, 2026-08) = 250000 c/t + 10% energy"
            - "Heat H-1001 CERT_VERIFIED; WO-1 released (qty 10, net 40.00, billet 50.00)"
            - "Provisional invoice created BEFORE production (estimated 400.00 lbs = 0.200 t)"
            - "Full production: 10 parts forged/trimmed (net 430.00 total), certified, shipped"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /surcharge-indices", payload: { alloy_spec_id: "${alloy_id}", effective_month: "2026-08", surcharge_cents_per_ton: 250000, energy_pct: 0.10 }, as: PlantManager, captures: { sur_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-1001", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /work-orders", payload: { order_number: "WO-1", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 10, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_id: "$.data.id", wo_v: "$.data.version" } }
            - { call: "POST /work-orders/${wo_id}/invoices", payload: { expected_work_order_version: "${wo_v}" }, as: SalesPlanner, captures: { inv_id: "$.data.id", prov_total: "$.data.total_cents", prov_tons: "$.data.billable_tons", prov_sur_idx: "$.data.surcharge_index_id" } }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 10 } ] }, as: SawOperator, captures: { b1: "$.data[0].id", b2: "$.data[1].id", b3: "$.data[2].id", b4: "$.data[3].id", b5: "$.data[4].id", b6: "$.data[5].id", b7: "$.data[6].id", b8: "$.data[7].id", b9: "$.data[8].id", b10: "$.data[9].id" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}", "${b2}", "${b3}", "${b4}", "${b5}", "${b6}", "${b7}", "${b8}", "${b9}", "${b10}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T12:00:00Z" }, as: FurnaceOperator, captures: { chg_id: "$.data.id" } }
            - { call: "POST /furnace-charges/${chg_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${chg_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-10", part_family: "FLG-4", wear_limit_hits: 300, max_resinks: 2 }, as: DieShopTechnician, captures: { die_id: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-1", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc_id: "$.data.id" } }
            - { call: "POST /die-sets/${die_id}/install", payload: { work_center_id: "${wc_id}" }, as: DieShopTechnician }
            - { call: "GET /work-orders/${wo_id}", payload: {}, as: SalesPlanner, captures: { wo_v2: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 10, expected_work_order_version: "${wo_v2}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_id: "$.data.id" } }
            - { call: "POST /forge-runs/${run_id}/start", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/heats", payload: { furnace_charge_id: "${chg_id}", billet_ids: ["${b1}", "${b2}", "${b3}", "${b4}", "${b5}", "${b6}", "${b7}", "${b8}", "${b9}", "${b10}"], parts_good: 10, parts_scrapped: 0 }, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/finish-forging", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/trim-tickets", payload: {}, as: ForgeOperator, captures: { tt_id: "$.data.id" } }
            - { call: "POST /trim-tickets/${tt_id}/record", payload: { gross_as_forged_lbs: 480.00, net_trimmed_lbs: 430.00, pierce_loss_lbs: 8.00 }, as: ForgeOperator, captures: { tt_status: "$.data.status" } }
            - { call: "GET /work-orders/${wo_id}/quality-certs", payload: {}, as: QualityEngineer, captures: { cert_id: "$.data[0].id" } }
            - { call: "POST /quality-certs/${cert_id}/submit", payload: { grain_flow_rating: 6, macro_etch_result: "PASS" }, as: QualityEngineer, as_user_id: "qe-1" }
            - { call: "POST /quality-certs/${cert_id}/certify", payload: {}, as: QualityEngineer, as_user_id: "qe-2" }
            - { call: "GET /work-orders/${wo_id}/part-serials", payload: {}, as: SalesPlanner, captures: { p1: "$.data[0].id", p2: "$.data[1].id", p3: "$.data[2].id", p4: "$.data[3].id", p5: "$.data[4].id", p6: "$.data[5].id", p7: "$.data[6].id", p8: "$.data[7].id", p9: "$.data[8].id", p10: "$.data[9].id" } }
            - { call: "POST /part-serials/${p1}/inspect", payload: {}, as: QualityEngineer }
            - { call: "POST /part-serials/${p2}/inspect", payload: {}, as: QualityEngineer }
            - { call: "POST /part-serials/${p3}/inspect", payload: {}, as: QualityEngineer }
            - { call: "POST /part-serials/${p4}/inspect", payload: {}, as: QualityEngineer }
            - { call: "POST /part-serials/${p5}/inspect", payload: {}, as: QualityEngineer }
            - { call: "POST /part-serials/${p6}/inspect", payload: {}, as: QualityEngineer }
            - { call: "POST /part-serials/${p7}/inspect", payload: {}, as: QualityEngineer }
            - { call: "POST /part-serials/${p8}/inspect", payload: {}, as: QualityEngineer }
            - { call: "POST /part-serials/${p9}/inspect", payload: {}, as: QualityEngineer }
            - { call: "POST /part-serials/${p10}/inspect", payload: {}, as: QualityEngineer }
            - { call: "POST /work-orders/${wo_id}/ship", payload: { part_serial_ids: ["${p1}", "${p2}", "${p3}", "${p4}", "${p5}", "${p6}", "${p7}", "${p8}", "${p9}", "${p10}"] }, as: SalesPlanner }
          trigger:
            - { call: "POST /invoices/${inv_id}/finalize", payload: {}, as: SalesPlanner, captures: { fin_total: "$.data.total_cents", fin_tons: "$.data.billable_tons", fin_base: "$.data.base_amount_cents", fin_alloy: "$.data.alloy_surcharge_cents", fin_energy: "$.data.energy_surcharge_cents", fin_scrap: "$.data.scrap_credit_cents", fin_sur_idx: "$.data.surcharge_index_id" } }
          assert:
            - "provisional capture: total_cents == 495000 and billable_tons == 0.200 (estimated 10 * 40.00 = 400.00 lbs)"
            - "final: billable_tons == 0.215 (actual shipped 430.00 lbs)"
            - "final: base_amount_cents == 430000, alloy_surcharge_cents == 53750, energy_surcharge_cents == 48375"
            - "final: scrap_credit_cents == 6300 (42.00 flash lbs * 150; under the 21500 cap)"
            - "final: total_cents == 525825, and 525825 != 495000 (provisional)"
            - "surcharge_index_id identical in both variants (pinned at provisional): ${sur_id}"

      - name: workorder_planned_vs_consumed_material
        grounds:
          - calculations.material_requirement
          - entities.WorkOrder.fields.planned_billet_weight_lbs
          - entities.WorkOrder.fields.consumed_billet_weight_lbs
        distinguishing_aspect: |
          Two sanctioned answers to "how much billet does this order need" on
          the SAME WorkOrder at the SAME instant: forward-looking planned
          (ordered_qty * billet_weight_lbs = 500.00) vs chronological consumed
          (sum of CONSUMED billets = 200.00 after one 4-part heat). Entity
          domain: WorkOrder (material accounting), distinct from Invoice above.
        test_recipe:
          setup:
            - "Alloy AISI-4140; heat H-1101 CERT_VERIFIED; 4 billets cut (20.0 in -> 50.00 lbs each)"
            - "WO-2 released (qty 10, billet 50.00) -> planned_billet_weight_lbs = 500.00"
            - "One READY charge with the 4 billets; die DIE-11 installed on WC-1; run started"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-1101", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 20.0, quantity: 4 } ] }, as: SawOperator, captures: { b1: "$.data[0].id", b2: "$.data[1].id", b3: "$.data[2].id", b4: "$.data[3].id" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}", "${b2}", "${b3}", "${b4}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T12:00:00Z" }, as: FurnaceOperator, captures: { chg_id: "$.data.id" } }
            - { call: "POST /furnace-charges/${chg_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${chg_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-11", part_family: "FLG-4", wear_limit_hits: 300, max_resinks: 2 }, as: DieShopTechnician, captures: { die_id: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-1", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc_id: "$.data.id" } }
            - { call: "POST /die-sets/${die_id}/install", payload: { work_center_id: "${wc_id}" }, as: DieShopTechnician }
            - { call: "POST /work-orders", payload: { order_number: "WO-2", customer_name: "Acme Aero", alloy_spec_id: "${alloy_id}", part_number: "PN-100", ordered_qty: 10, part_net_weight_lbs: 40.00, billet_weight_lbs: 50.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_id: "$.data.id", wo_v: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T10:30:00Z", planned_qty: 4, expected_work_order_version: "${wo_v}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_id: "$.data.id" } }
            - { call: "POST /forge-runs/${run_id}/start", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /forge-runs/${run_id}/heats", payload: { furnace_charge_id: "${chg_id}", billet_ids: ["${b1}", "${b2}", "${b3}", "${b4}"], parts_good: 4, parts_scrapped: 0 }, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "GET /work-orders/${wo_id}", payload: {}, as: SalesPlanner, captures: { planned_w: "$.data.planned_billet_weight_lbs", consumed_w: "$.data.consumed_billet_weight_lbs" } }
          assert:
            - "WorkOrder.${wo_id}.planned_billet_weight_lbs == 500.00 (10 * 50.00, forward-looking)"
            - "WorkOrder.${wo_id}.consumed_billet_weight_lbs == 200.00 (4 * 50.00, chronological actual)"
            - "planned != consumed for identical order state: 500.00 != 200.00"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_tiered_total_with_binding_scrap_cap
        grounds:
          - calculations.invoice_price
          - entities.Invoice.fields.scrap_credit_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs with non-linear interaction —
          average-rate TIER selection (3.000 t lands in tier 2, changing the
          rate applied to the WHOLE tonnage) PLUS a nested min() where the
          5%-of-base scrap cap BINDS over the raw flash credit
          (raw 2000 lb * 150 = 300000 > cap 270000).
        test_recipe:
          setup:
            - "Alloy AISI-4140; surcharge (2026-08) 250000 c/t + 10% energy"
            - "WO-3: qty 10, part_net 600.00, billet 850.00 (>= 672.00 underweight floor), tiers 1.0/5.0"
            - "10 billets of 340.0 in (850.00 lbs each) consumed via two charges (5+5, 4250 lbs <= 5000 capacity)"
            - "Trim: gross 8100.00, pierce 300.00, net 6000.00 -> flash 1801.00 -> yield 22.23% -> FLAGGED -> deviation-approved"
            - "Certified and fully shipped: actual net 6000.00 lbs = 3.000 t"
          setup_api_calls:
            - { call: "POST /alloy-specs", payload: { grade_code: "AISI-4140", name: "CrMo Steel", forge_temp_min_f: 2100, forge_temp_max_f: 2300, reheat_limit: 2, flash_allowance_pct: 12.0, strokes_per_part: 3, flow_stress_ksi: 8.0, carbon_max_pct: 0.43, manganese_max_pct: 1.10, grain_flow_min_rating: 5, macro_etch_required: true }, as: PlantManager, captures: { alloy_id: "$.data.id" } }
            - { call: "POST /surcharge-indices", payload: { alloy_spec_id: "${alloy_id}", effective_month: "2026-08", surcharge_cents_per_ton: 250000, energy_pct: 0.10 }, as: PlantManager, captures: { sur_id: "$.data.id" } }
            - { call: "POST /mill-heats", payload: { heat_number: "H-1201", alloy_spec_id: "${alloy_id}", mill_name: "Ellwood Bar Mill", received_weight_lbs: 20000.00, bar_lbs_per_in: 2.50 }, as: PlantManager, captures: { heat_id: "$.data.id" } }
            - { call: "POST /mill-heats/${heat_id}/verify-cert", payload: { carbon_pct: 0.40, manganese_pct: 0.90 }, as: QualityEngineer }
            - { call: "POST /mill-heats/${heat_id}/billets", payload: { cuts: [ { cut_length_in: 340.0, quantity: 10 } ] }, as: SawOperator, captures: { b1: "$.data[0].id", b2: "$.data[1].id", b3: "$.data[2].id", b4: "$.data[3].id", b5: "$.data[4].id", b6: "$.data[5].id", b7: "$.data[6].id", b8: "$.data[7].id", b9: "$.data[8].id", b10: "$.data[9].id" } }
            - { call: "POST /furnaces", payload: { furnace_code: "FUR-1", capacity_lbs: 5000 }, as: PlantManager, captures: { fur_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b1}", "${b2}", "${b3}", "${b4}", "${b5}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T08:00:00Z", planned_unload: "2026-08-02T11:00:00Z" }, as: FurnaceOperator, captures: { chg1_id: "$.data.id" } }
            - { call: "POST /furnace-charges", payload: { furnace_id: "${fur_id}", billet_ids: ["${b6}", "${b7}", "${b8}", "${b9}", "${b10}"], target_temp_f: 2200, soak_minutes: 60, planned_load_start: "2026-08-02T12:00:00Z", planned_unload: "2026-08-02T15:00:00Z" }, as: FurnaceOperator, captures: { chg2_id: "$.data.id" } }
            - { call: "POST /furnace-charges/${chg1_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /furnace-charges/${chg2_id}/close-loading", payload: {}, as: FurnaceOperator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: PlantManager }
            - { call: "POST /furnace-charges/${chg1_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /furnace-charges/${chg2_id}/mark-ready", payload: {}, as: FurnaceOperator }
            - { call: "POST /die-sets", payload: { die_set_code: "DIE-12", part_family: "BLK-9", wear_limit_hits: 300, max_resinks: 2 }, as: DieShopTechnician, captures: { die_id: "$.data.id" } }
            - { call: "POST /work-centers", payload: { code: "WC-1", type: "PRESS", rated_tonnage: 500 }, as: PlantManager, captures: { wc_id: "$.data.id" } }
            - { call: "POST /die-sets/${die_id}/install", payload: { work_center_id: "${wc_id}" }, as: DieShopTechnician }
            - { call: "POST /work-orders", payload: { order_number: "WO-3", customer_name: "HeavyInd", alloy_spec_id: "${alloy_id}", part_number: "PN-600", ordered_qty: 10, part_net_weight_lbs: 600.00, billet_weight_lbs: 850.00, projected_area_in2: 25.0, required_process: "PRESS", price_tier1_limit_tons: 1.0, price_tier1_cents_per_ton: 2000000, price_tier2_limit_tons: 5.0, price_tier2_cents_per_ton: 1800000, price_tier3_cents_per_ton: 1500000, scrap_recovery_rate_cents_per_lb: 150 }, as: SalesPlanner, captures: { wo_id: "$.data.id", wo_v: "$.data.version" } }
            - { call: "POST /forge-runs", payload: { work_order_id: "${wo_id}", die_set_id: "${die_id}", planned_start: "2026-08-03T09:00:00Z", planned_end: "2026-08-03T12:00:00Z", planned_qty: 10, expected_work_order_version: "${wo_v}", work_center_id: "${wc_id}" }, as: ForgeOperator, captures: { run_id: "$.data.id" } }
            - { call: "POST /forge-runs/${run_id}/start", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/heats", payload: { furnace_charge_id: "${chg1_id}", billet_ids: ["${b1}", "${b2}", "${b3}", "${b4}", "${b5}"], parts_good: 5, parts_scrapped: 0 }, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/heats", payload: { furnace_charge_id: "${chg2_id}", billet_ids: ["${b6}", "${b7}", "${b8}", "${b9}", "${b10}"], parts_good: 5, parts_scrapped: 0 }, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/finish-forging", payload: {}, as: ForgeOperator, as_user_id: "op-1" }
            - { call: "POST /forge-runs/${run_id}/trim-tickets", payload: {}, as: ForgeOperator, captures: { tt_id: "$.data.id" } }
            - { call: "POST /trim-tickets/${tt_id}/record", payload: { gross_as_forged_lbs: 8100.00, net_trimmed_lbs: 6000.00, pierce_loss_lbs: 300.00 }, as: ForgeOperator, captures: { tt_status: "$.data.status" } }
            - { call: "POST /trim-tickets/${tt_id}/approve-deviation", payload: { deviation_reason: "customer-approved overflash" }, as: QualityEngineer }
            - { call: "GET /work-orders/${wo_id}/quality-certs", payload: {}, as: QualityEngineer, captures: { cert_id: "$.data[0].id" } }
