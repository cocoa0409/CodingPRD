  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: session_fee_cap_before_proration_mode_a_nonlinear
        grounds:
          - calculations.session_fee
          - entities.Session.fields.fee_cents
          - entities.TeachingArtist.fields.roster_tier_effective
          - state_machines.Session.CONFIRMED_to_DELIVERED
        distinguishing_aspect: |
          Mode (a): five interacting inputs (discipline base, grade-band
          multiplier, tier multiplier, lead premium, bilingual premium) feed a
          nested min/max cap that is applied BEFORE proration, so a half-length
          delivery of an uncapped 21234-cent session yields exactly 9500 cents;
          the prorate-then-cap reading yields 10617 cents, and the test pins 9500.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "School Riverbend Arts Academy, concurrent_session_capacity 2."
            - "Artist Diego Marek: MEDIA_ARTS primary, grade_bands [G9_12], languages [en, es], roster_tier_assigned MASTER, vetted to CLEARED so roster_status is ACTIVE and roster_tier_effective is MASTER."
            - "Residency 'Documentary Studio': MEDIA_ARTS / G9_12 / instruction_language es, 4 contracted sessions of 60 minutes, budget 100000 cents, required_strands [CREATING], ACTIVE with one ALIGNED plan."
            - "One session on 2026-09-15 confirmed, which encumbers the capped full-length projection of 19000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /school-partners"
              payload: { name: "Riverbend Arts Academy", district_name: "Riverbend USD", grade_span: "K-12", concurrent_session_capacity: 2, total_enrollment: 600, frl_pct: 0.62, ell_pct: 0.28, iep_pct: 0.14 }
              as: ProgramDirector
              captures: { s1_id: $.data.id }
