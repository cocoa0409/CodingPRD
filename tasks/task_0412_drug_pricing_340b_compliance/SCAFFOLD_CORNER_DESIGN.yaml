scaffold_corner_design:

  # ==========================================================================
  # SECTION: entities
  # ==========================================================================
  - section: entities
    instances:
      - name: create_covered_entity_minimal_required_fields_201
        claim_type: Creation
        grounds:
          - entities.CoveredEntity.fields.hrsa_id
          - endpoints
        distinguishing_aspect: "POST /covered-entities with hrsa_id, legal_name, entity_type returns 201; registration_status defaults to PENDING and compliance_posture to GOOD."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020001", legal_name: "Create CE", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id, status: $.data.registration_status, posture: $.data.compliance_posture }
          assert:
            - "HTTP status == 201"
            - "CoveredEntity.${ce_id}.registration_status == PENDING"
            - "CoveredEntity.${ce_id}.compliance_posture == GOOD"

      - name: covered_entity_missing_required_entity_type_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.CoveredEntity.fields.entity_type
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /covered-entities without entity_type returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020002", legal_name: "No Type CE" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 422"

      - name: covered_entity_gpo_prohibited_computed_from_entity_type
        claim_type: Computed Fields
        grounds:
          - entities.CoveredEntity.fields.gpo_prohibited
          - entities.CoveredEntity.fields.entity_type
        distinguishing_aspect: "gpo_prohibited is computed true for entity_type DSH and false for FQHC, regardless of any input value."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020003", legal_name: "DSH CE", entity_type: "DSH" }
              as: ComplianceOfficer
              captures: { dsh_id: $.data.id, dsh_gpo: $.data.gpo_prohibited }
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020004", legal_name: "FQHC CE", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { fqhc_id: $.data.id, fqhc_gpo: $.data.gpo_prohibited }
          assert:
            - "CoveredEntity.${dsh_id}.gpo_prohibited == true"
            - "CoveredEntity.${fqhc_id}.gpo_prohibited == false"

      - name: covered_entity_medicaid_mode_default_carve_out
        claim_type: Defaults
        grounds:
          - entities.CoveredEntity.fields.medicaid_billing_mode
        distinguishing_aspect: "Omitting medicaid_billing_mode applies default CARVE_OUT."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020005", legal_name: "Default Mode CE", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id, mode: $.data.medicaid_billing_mode }
          assert:
            - "CoveredEntity.${ce_id}.medicaid_billing_mode == CARVE_OUT"

      - name: covered_entity_system_id_created_at_generated
        claim_type: System Fields
        grounds:
          - entities.CoveredEntity.fields.registration_status
        distinguishing_aspect: "Server mints id, created_at, updated_at, version; registration_status is system-set to PENDING and ignores any input attempt (only declared input fields accepted)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020006", legal_name: "Sys Fields CE", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id, ver: $.data.version, st: $.data.registration_status }
          assert:
            - "CoveredEntity.${ce_id}.version == 1"
            - "CoveredEntity.${ce_id}.registration_status == PENDING (system-set, not input)"

      - name: covered_entity_invalid_enum_entity_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CoveredEntity.fields.entity_type
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "entity_type not in the declared enum set returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020007", legal_name: "Bad Enum CE", entity_type: "NOT_A_TYPE" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and HTTP status == 422"

      - name: get_covered_entity_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /covered-entities/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /340b/covered-entities/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: list_covered_entities_pagination_envelope
        claim_type: Listing
        grounds:
          - response_envelope
        distinguishing_aspect: "GET /covered-entities returns a paginated array envelope with total_count and has_more fields."
        test_recipe:
          setup:
            - "Two covered entities exist."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020008", legal_name: "List CE 1", entity_type: "FQHC" }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020009", legal_name: "List CE 2", entity_type: "FQHC" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /340b/covered-entities"
              payload: {}
              as: HrsaAuditor
          assert:
            - "response_type == array; meta.total_count >= 2; has_more present (boolean)"

      - name: duplicate_hrsa_id_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CoveredEntity.fields.hrsa_id
          - errors[ERR_DUPLICATE_HRSA_ID]
        distinguishing_aspect: "A second CoveredEntity with an hrsa_id already in use returns ERR_DUPLICATE_HRSA_ID (409)."
        test_recipe:
          setup:
            - "A CoveredEntity with hrsa_id DSH020010 exists."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020010", legal_name: "Dup CE A", entity_type: "FQHC" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020010", legal_name: "Dup CE B", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_HRSA_ID and HTTP status == 409"

      - name: duplicate_ndc_rejected
        claim_type: Type Constraints
        grounds:
          - entities.DrugProduct.fields.ndc
          - errors[ERR_DUPLICATE_NDC]
        distinguishing_aspect: "A second DrugProduct with an ndc already in use returns ERR_DUPLICATE_NDC (409)."
        test_recipe:
          setup:
            - "A DrugProduct with ndc 00021-0021-21 exists."
          setup_api_calls:
            - call: "POST /340b/drug-products"
              payload: { ndc: "00021-0021-21", drug_name: "Dup NDC A", package_size_units: 30, wac_price_per_unit_cents: 5000 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /340b/drug-products"
              payload: { ndc: "00021-0021-21", drug_name: "Dup NDC B", package_size_units: 30, wac_price_per_unit_cents: 5000 }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_NDC and HTTP status == 409"

      - name: duplicate_accumulator_for_ce_ndc_pair_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Accumulator.fields.drug_product_id
          - errors[ERR_DUPLICATE_ACCUMULATOR]
        distinguishing_aspect: "A second Accumulator for an existing (covered_entity_id, drug_product_id) pair returns ERR_DUPLICATE_ACCUMULATOR (409)."
        test_recipe:
          setup:
            - "ACTIVE CE and a drug product already have one accumulator."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020011", legal_name: "DupAcc CE", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00022-0022-22", drug_name: "DupAcc Drug", package_size_units: 30, wac_price_per_unit_cents: 5000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/accumulators"
              payload: { drug_product_id: "${dp_id}" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /340b/covered-entities/${ce_id}/accumulators"
              payload: { drug_product_id: "${dp_id}" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_ACCUMULATOR and HTTP status == 409"

      - name: child_site_wrong_parent_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ChildSite.fields.covered_entity_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Creating a child site under a non-existent CE id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /340b/covered-entities/00000000-0000-0000-0000-000000000000/child-sites"
              payload: { site_name: "Orphan Site", service_address: "1 Main St" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status == 404"

      - name: prescriber_immutable_entity_no_version_field
        claim_type: Immutability
        grounds:
          - entities.Prescriber.fields.npi
        distinguishing_aspect: "Prescriber is common_fields:false (only id + created_at); its create response carries id and created_at but no version field and there is no update endpoint."
        test_recipe:
          setup:
            - "An ACTIVE CE exists."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020012", legal_name: "Presc CE", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
          trigger:
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "2020202020", full_name: "Dr Immutable", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
          assert:
            - "Prescriber.${presc_id} has id and created_at; no version field present (common_fields:false)"

  # ==========================================================================
  # SECTION: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: approve_already_active_ce_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.CoveredEntity.PENDING_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving a CE that is already ACTIVE returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup:
            - "An ACTIVE CE."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020013", legal_name: "Approve2 CE", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
          trigger:
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP status == 409"

      - name: reverse_already_reversed_dispense_invalid_state
        claim_type: idempotency_violation
        grounds:
          - state_machines.PrescriptionDispense.DISPENSED_to_REVERSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reversing a dispense already in REVERSED returns ERR_INVALID_STATE (409); the second reverse does not double-debit the accumulator."
        test_recipe:
          setup:
            - "A CLASSIFIED_340B dispense already reversed (accumulator accrued_units back to 0)."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020014", legal_name: "Rev2 CE", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00023-0023-23", drug_name: "Rev2 Drug", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "2121212121", full_name: "Dr Rev2", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-REV2-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 5, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
            - call: "POST /340b/dispenses/${disp_id}/reverse"
              payload: {}
              as: PharmacyOperator
          trigger:
            - call: "POST /340b/dispenses/${disp_id}/reverse"
              payload: {}
              as: PharmacyOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP status == 409"

      - name: dispute_from_open_finding_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.AuditFinding.UNDER_REVIEW_to_DISPUTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Disputing an OPEN finding (not UNDER_REVIEW) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "An OPEN HRSA_AUDIT finding (no start-review yet)."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020015", legal_name: "Disp CE", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00024-0024-24", drug_name: "Disp Drug", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "2222220000", full_name: "Dr Disp", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-DISP-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 4, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
            - call: "POST /340b/audit-findings"
              payload: { covered_entity_id: "${ce_id}", prescription_dispense_id: "${disp_id}", finding_type: "DIVERSION", assessed_units: 4 }
              as: HrsaAuditor
              captures: { af_id: $.data.id }
          trigger:
            - call: "POST /340b/audit-findings/${af_id}/dispute"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP status == 409"

      - name: resolve_finding_without_repayment_rejected
        claim_type: precondition_violation
        grounds:
          - state_machines.AuditFinding.UNDER_REVIEW_to_RESOLVED
          - errors[ERR_REPAYMENT_REQUIRED]
        distinguishing_aspect: "Resolving an UNDER_REVIEW finding with no RepaymentObligation set up returns ERR_REPAYMENT_REQUIRED (409)."
        test_recipe:
          setup:
            - "An UNDER_REVIEW HRSA_AUDIT finding with no repayment obligation."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020016", legal_name: "Resolve CE", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00025-0025-25", drug_name: "Resolve Drug", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "2323232323", full_name: "Dr Resolve", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-RES-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 4, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
            - call: "POST /340b/audit-findings"
              payload: { covered_entity_id: "${ce_id}", prescription_dispense_id: "${disp_id}", finding_type: "DIVERSION", assessed_units: 4 }
              as: HrsaAuditor
              captures: { af_id: $.data.id }
            - call: "POST /340b/audit-findings/${af_id}/start-review"
              payload: {}
              as: HrsaAuditor
          trigger:
            - call: "POST /340b/audit-findings/${af_id}/resolve"
              payload: {}
              as: HrsaAuditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REPAYMENT_REQUIRED and HTTP status == 409"

      - name: terminal_disclosed_dispense_cannot_reverse
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PrescriptionDispense.DISPENSED_to_DISCLOSED
          - state_machines.PrescriptionDispense.DISPENSED_to_REVERSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A self-disclosed dispense (terminal DISCLOSED) cannot be reversed; reverse returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A dispense marked DISCLOSED via a self-disclosure."
          setup_api_calls:
            - call: "POST /340b/covered-entities"
              payload: { hrsa_id: "DSH020017", legal_name: "Disc CE", entity_type: "FQHC" }
              as: ComplianceOfficer
              captures: { ce_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/approve"
              payload: {}
              as: HrsaAuditor
            - call: "POST /340b/drug-products"
              payload: { ndc: "00026-0026-26", drug_name: "Disc Drug", package_size_units: 30, wac_price_per_unit_cents: 6000 }
              as: ComplianceOfficer
              captures: { dp_id: $.data.id }
            - call: "POST /340b/drug-products/${dp_id}/ceiling-prices"
              payload: { quarter: "2026Q2", amp_per_unit_cents: 4000, ura_per_unit_cents: 1500, is_published: true }
              as: ComplianceOfficer
            - call: "POST /340b/covered-entities/${ce_id}/prescribers"
              payload: { npi: "2424242424", full_name: "Dr Disc", relationship_type: "EMPLOYED" }
              as: ComplianceOfficer
              captures: { presc_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/patients"
              payload: { mrn: "MRN-DISC-1", has_ce_care_record: true, ce_retains_responsibility: true, medicaid_ffs_enrolled: false }
              as: ComplianceOfficer
              captures: { pat_id: $.data.id }
            - call: "POST /340b/dispenses"
              payload: { covered_entity_id: "${ce_id}", patient_id: "${pat_id}", prescriber_id: "${presc_id}", drug_product_id: "${dp_id}", quantity_units: 4, quarter: "2026Q2" }
              as: PharmacyOperator
              captures: { disp_id: $.data.id }
            - call: "POST /340b/covered-entities/${ce_id}/self-disclosures"
              payload: { prescription_dispense_id: "${disp_id}", finding_type: "INELIGIBLE_PATIENT", assessed_units: 4 }
              as: ComplianceOfficer
          trigger:
            - call: "POST /340b/dispenses/${disp_id}/reverse"
              payload: {}
              as: PharmacyOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and HTTP status == 409"

      - name: terminate_ce_cascades_contract_pharmacy_termination
        claim_type: side_effect_execution
        grounds:
          - state_machines.CoveredEntity.ACTIVE_to_TERMINATED
          - state_machines.ContractPharmacyArrangement.ACTIVE_to_TERMINATED
        distinguishing_aspect: "Terminating an ACTIVE CE cascades: its ACTIVE ContractPharmacyArrangement transitions to TERMINATED."
        test_recipe:
          setup:
