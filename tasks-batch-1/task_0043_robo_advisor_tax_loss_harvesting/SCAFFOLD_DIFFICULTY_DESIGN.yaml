  - rule_id: boundary_precision_check
    instances:
      - name: drift_at_exactly_threshold_triggers_rebalance_due
        grounds:
          - calculations.drift_computation
          - entities.Account.fields.max_drift_pct
          - state_machines.Account.ACTIVE_to_REBALANCE_DUE
        distinguishing_aspect: |
          Numeric >= boundary on the drift metric: model US_EQUITY 60 threshold 5, holdings driving
          US_EQUITY to exactly 65% give max_drift_pct == 5 which is >= 5 and flips status to
          REBALANCE_DUE; 64% (drift 4) stays ACTIVE. Reached through POST /tax-lots.
        test_recipe:
          setup:
            - "Account ACTIVE on US_EQUITY 60 / BOND 40, threshold 5."
            - "Open US_EQUITY mkt 65000 and BOND mkt 35000 so invested 100000, US 65% -> drift exactly 5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00.000Z" }
              as: Advisor
            - call: "POST /model-portfolios"
              payload: { name: "6040b", min_risk_score: 70, max_risk_score: 100, targets: [{asset_class: "US_EQUITY", target_pct: 60}, {asset_class: "BOND", target_pct: 40}], drift_threshold_pct: 5 }
              as: Advisor
              captures: { model_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "EQB", asset_class: "US_EQUITY", price_cents: 10000 }
              as: Advisor
              captures: { sec_eq_id: $.data.id }
            - call: "POST /securities"
              payload: { ticker: "BDB", asset_class: "BOND", price_cents: 10000 }
              as: Advisor
              captures: { sec_bd_id: $.data.id }
            - call: "POST /accounts"
              payload: { client_email: "drift5@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
            - call: "POST /questionnaires"
              payload: { account_id: "${acct_id}", horizon_years: 30, loss_tolerance: 9, liquidity_need: 1, income_band: 8 }
              as: Advisor
              captures: { q_id: $.data.id }
            - call: "POST /questionnaires/${q_id}/accept"
              payload: {}
              as: Advisor
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_bd_id}", quantity: 3.5, cost_basis_cents: 35000 }
              as: Advisor
          trigger:
            - call: "POST /tax-lots"
              payload: { account_id: "${acct_id}", security_id: "${sec_eq_id}", quantity: 6.5, cost_basis_cents: 65000 }
              as: Advisor
          assert:
            - "Account.${acct_id}.max_drift_pct == 5 and status == REBALANCE_DUE (>= boundary triggers)"

      - name: empty_portfolio_1099b_zero_lines
        grounds:
          - calculations.form_1099b_totals
          - entities.TaxForm1099B.fields.line_count
          - entities.TaxForm1099B.fields.net_realized_gain_cents
        distinguishing_aspect: |
          Empty-set boundary on a different metric (line_count) reached through POST /tax-forms:
          an account with no CLOSED lots in the tax year produces line_count == 0,
          net_realized_gain_cents == 0, total_proceeds_cents == 0 — the zero-collection edge
          distinct from the numeric drift threshold.
        test_recipe:
          setup:
            - "An account exists with no disposed lots in 2025; clock is in 2026."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: Advisor
            - call: "POST /accounts"
              payload: { client_email: "empty1099@x.com" }
              as: Advisor
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /tax-forms"
              payload: { account_id: "${acct_id}", tax_year: 2025 }
              as: Advisor
              captures: { form_id: $.data.id }
          assert:
            - "TaxForm1099B.${form_id}.line_count == 0"
            - "TaxForm1099B.${form_id}.net_realized_gain_cents == 0 and total_proceeds_cents == 0"

