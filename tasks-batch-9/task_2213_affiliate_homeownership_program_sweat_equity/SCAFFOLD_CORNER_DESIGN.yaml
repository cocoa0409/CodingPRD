        claim_type: side_effect_execution
        grounds: ["state_machines.BuildSite.readiness_status.READY_TO_BUILD_to_SAFETY_HOLD", "state_machines.BuildSite.readiness_status.SAFETY_HOLD_to_READY_TO_BUILD", entities.BuildSite.fields.pre_hold_readiness_status, entities.VolunteerProfile.fields.assigned_hours_committed]
