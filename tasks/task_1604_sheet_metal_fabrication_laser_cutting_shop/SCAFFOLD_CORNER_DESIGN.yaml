        distinguishing_aspect: "RUSH tier both multiplies price by 1.50 and compresses SLA_DAYS to 1 day at LASER with vendor lead halved — the tier flag flips two independent behaviors."
        test_recipe:
          setup: ["identical quotes one STANDARD one RUSH with PLATING finish, vendor lead 7"]
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "CRS-X2", alloy_family: "CARBON_STEEL", density_g_per_cm3: 7.85, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.045, scrap_rate_cents_per_cm2: 0.015, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
