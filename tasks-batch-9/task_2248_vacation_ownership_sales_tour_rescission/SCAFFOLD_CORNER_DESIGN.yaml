      - name: representative_list_pagination_interacts_with_filters
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /sales-representatives]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit and offset page a filtered set rather than the whole table: with three representatives in the Orlando gallery and one in Las Vegas, gallery_id + limit 2 + offset 0 returns 2 rows with total_count 3 and has_more true, offset 2 returns the final row with has_more false, and total_count always reports the filtered cardinality, never 4."
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "Two galleries: Orlando holds three representatives created in rotation-position order, Las Vegas holds one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sales-galleries"
              payload: { name: "Orlando Sales Gallery", site_code: "ORLGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g1: $.data.id }
            - call: "POST /sales-galleries"
              payload: { name: "Las Vegas Sales Gallery", site_code: "LVSGAL", concurrent_tour_capacity: 4, presentation_minutes: 120, buffer_minutes: 30 }
              as: GalleryManager
              captures: { g2: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Dana Reyes", license_number: "FL-SL-410077", rotation_position: 1 }
              as: GalleryManager
              captures: { r1: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Marco Iyer", license_number: "FL-SL-410078", rotation_position: 2 }
              as: GalleryManager
              captures: { r2: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g1}", full_name: "Priya Raman", license_number: "FL-SL-410079", rotation_position: 3 }
              as: GalleryManager
              captures: { r3: $.data.id }
            - call: "POST /sales-representatives"
              payload: { gallery_id: "${g2}", full_name: "Ana Solis", license_number: "NV-SL-810080", rotation_position: 1 }
              as: GalleryManager
              captures: { r4: $.data.id }
          trigger:
            - call: "GET /sales-representatives"
              payload: { gallery_id: "${g1}", limit: 2, offset: 0 }
              as: GalleryManager
              captures: { first_row: "$.data[0].id" }
            - call: "GET /sales-representatives"
              payload: { gallery_id: "${g1}", limit: 2, offset: 2 }
              as: GalleryManager
              captures: { last_row: "$.data[0].id" }
            - call: "GET /sales-representatives"
              payload: { gallery_id: "${g2}" }
              as: GalleryManager
            - call: "GET /sales-representatives"
              payload: { gallery_id: "${g1}", status: "SUSPENDED" }
              as: GalleryManager
            - call: "GET /sales-representatives"
              payload: { limit: 0 }
              as: GalleryManager
          assert:
            - "trigger 1 returns 2 rows with total_count == 3 and has_more == true; ${first_row} == ${r1} (created_at ASC ordering)"
            - "trigger 2 returns 1 row with total_count == 3 and has_more == false; ${last_row} == ${r3}"
            - "trigger 3 returns 1 row with total_count == 1 -- ${r4} only, and the default limit 10 with offset 0 is applied"
            - "trigger 4 returns 0 rows with total_count == 0 and has_more == false (all three Orlando representatives are ACTIVE)"
            - "trigger 5 returns 400 with error_id ERR_INVALID_REQUEST because limit 0 is below the declared minimum of 1"

      - name: rescission_sweep_is_ordered_idempotent_and_scope_limited
