    applies_to: "POST /dividend-distributions/{id}/settle"
  - priority: 82
    category: business_fiscal
    check: "POST /institutions/{id}/receivership-proceeds requires disposition_expense_cents <= gross_proceeds_cents"
    error_id: ERR_DISPOSITION_EXPENSE_EXCEEDS_PROCEEDS
    http_status: 422
    applies_to: "POST /institutions/{id}/receivership-proceeds"

# =====================================================================================
# §1.5 API Endpoint Table
#   Topology is FLAT: every entity collection is a root-level segment (api_prefix: "").
#   Read surface is complete: every FK declared in §1.1 is reverse-reachable either via a
#   sub-resource GET on the parent or via a filtered collection GET carrying the FK field.
# =====================================================================================
endpoints:
  # ---------------- Institution ----------------
  - method: POST
    path: /institutions
    description: "Register a troubled institution for pre-failure readiness monitoring."
    roles: [ClosingManager]
    code: 201
    input:
      - cert_number
      - legal_name
      - charter_state
      - book_asset_value_cents
      - estimated_liquidation_recovery_cents
    output: Institution
    side_effects:
      - "status set to PRE_FAILURE_MONITORING"
      - "readiness_standardized=false, franchise_marketing_status=NOT_STARTED, least_cost_status=NOT_STARTED"
      - "all aggregate counters (total_deposit_balance_cents, depositor_record_count, aggregate_insured_cents, aggregate_certificate_face_cents, uninsured_claim_count, receivership_cash_cents, gross_disposition_proceeds_cents, disposition_expense_total_cents, dividend_round_count, conforming_bid_count) initialised to 0"
  - method: GET
    path: /institutions
    description: "List institutions with optional status and charter filters."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "status?"
      - "charter_state?"
      - "least_cost_status?"
      - "limit?"
      - "offset?"
    output: Institution[]
    side_effects: []
  - method: GET
    path: /institutions/{id}
    description: "Retrieve one institution including all derived receivership aggregates."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input: []
    output: Institution
    side_effects: []
  - method: GET
    path: /institutions/{id}/insurance-summary
    description: |
      Computed read (calculations.institution_aggregate_reconciliation). Recomputes the deposit-attribution
      and receivership-cash conservation identities from scratch and exposes both signed deltas, which MUST
      be 0 at all times.
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input: []
    output:
      institution_id: uuid
      total_deposit_balance_cents: integer
      attributed_total_cents: integer
      unattributed_balance_cents: integer
      conservation_delta_cents: integer
      aggregate_insured_cents: integer
      aggregate_certificate_face_cents: integer
      uninsured_claim_count: integer
      held_amount_total_cents: integer
      receivership_cash_cents: integer
      gross_disposition_proceeds_cents: integer
      disposition_expense_total_cents: integer
      dividends_paid_cents: integer
      cash_conservation_delta_cents: integer
    side_effects: []
  - method: POST
    path: /institutions/{id}/close
    description: "Declare failure and place the institution into receivership."
    roles: [ClosingManager]
    code: 200
    input: []
    output: Institution
    side_effects:
      - "status RESOLUTION_READY -> CLOSED_IN_RECEIVERSHIP"
      - "failure_datetime set to the logical clock"
      - "cascade L2 (caused by the status flip): every DepositAccount of the institution with insurance_status == PENDING flips to FROZEN_FOR_DETERMINATION"
      - "total_deposit_balance_cents and depositor_record_count recomputed"
      - "version incremented"
  - method: POST
    path: /institutions/{id}/franchise-marketing
    description: "Open or close the franchise marketing window and pin the bid deadline."
    roles: [ResolutionAnalyst]
    code: 200
    input:
      - marketing_action
      - "bid_deadline_at?"
    output: Institution
    side_effects:
      - "franchise_marketing_status set to OPEN (action=OPEN) or CLOSED (action=CLOSE)"
      - "bid_deadline_at stored when action=OPEN (required in that case)"
      - "version incremented"
  - method: POST
    path: /institutions/{id}/receivership-proceeds
    description: "Book proceeds and expenses from a receivership asset-pool disposition."
    roles: [ReceivershipTrustee]
    code: 200
    input:
      - asset_pool_code
      - gross_proceeds_cents
      - disposition_expense_cents
    output: Institution
    side_effects:
      - "gross_disposition_proceeds_cents += gross_proceeds_cents"
      - "disposition_expense_total_cents += disposition_expense_cents"
      - "receivership_cash_cents += (gross_proceeds_cents - disposition_expense_cents)"
      - "version incremented"
  - method: POST
    path: /institutions/{id}/terminate-receivership
    description: "Terminate the receivership once every claim, hold and dividend round is final."
    roles: [ReceivershipTrustee]
    code: 200
    input: []
    output: Institution
    side_effects:
      - "status RESOLUTION_COMPLETE -> RECEIVERSHIP_TERMINATED"
      - "version incremented"
  # ---------------- ReadinessSubmission ----------------
  - method: POST
    path: /institutions/{id}/readiness-submissions
    description: "Submit a pre-failure deposit file for standardization scoring."
    roles: [ClosingManager]
    code: 201
    input:
      - file_format
      - record_count
      - malformed_record_count
      - reported_deposit_total_cents
    output: ReadinessSubmission
    side_effects:
      - "status set to RECEIVED"
      - "institution.status PRE_FAILURE_MONITORING -> READINESS_COLLECTION on the first submission"
      - "institution.status RESOLUTION_READY -> READINESS_COLLECTION with readiness_standardized reset to false when a further package arrives after readiness was already achieved (revert edge)"
      - "institution.version incremented when the institution status changes"
  - method: GET
    path: /institutions/{id}/readiness-submissions
    description: "List every readiness submission filed for the institution (FK reverse read for ReadinessSubmission.institution_id)."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "status?"
      - "limit?"
      - "offset?"
    output: ReadinessSubmission[]
    side_effects: []
  - method: POST
    path: /readiness-submissions/{id}/standardize
    description: "Score and adjudicate a readiness submission (calculations.readiness_standardization_score)."
    roles: [ClosingManager]
    code: 200
    input: []
    output: ReadinessSubmission
    side_effects:
      - "standardization_score_bps and deposit_total_variance_bps computed"
      - "status -> STANDARDIZED when both gates pass, else REJECTED with rejection_reason"
      - "on STANDARDIZED: institution.readiness_standardized=true, institution.status READINESS_COLLECTION -> RESOLUTION_READY, total_deposit_balance_cents and depositor_record_count recomputed, institution.version incremented"
      - "on REJECTED: rejection_reason set to SCORE_BELOW_FLOOR (score gate) or TOTAL_VARIANCE_EXCEEDED (variance gate); the institution row is left untouched and its version is NOT incremented"
      - "submission.version incremented"
  # ---------------- DepositorRecord ----------------
  - method: POST
    path: /institutions/{id}/depositor-records
    description: "Create a standardized depositor record from the readiness file."
    roles: [ClaimsAgent]
    code: 201
    input:
      - tin_hash
      - legal_name
      - depositor_type
      - contact_email
    output: DepositorRecord
    side_effects:
      - "notice_status set to PENDING; attributed_total_cents, certified_insured_cents, certified_uninsured_cents set to 0"
      - "institution.depositor_record_count += 1"
      - "institution.version incremented"
  - method: GET
    path: /depositor-records
    description: "Filtered depositor list (FK reverse read for DepositorRecord.institution_id)."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "institution_id?"
      - "notice_status?"
      - "depositor_type?"
      - "limit?"
      - "offset?"
    output: DepositorRecord[]
    side_effects: []
  - method: GET
    path: /depositor-records/{id}
    description: "Retrieve one depositor record with its certified insurance totals."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input: []
    output: DepositorRecord
    side_effects: []
  - method: GET
    path: /depositor-records/{id}/ownership-interests
    description: "List the ownership interests naming this depositor (FK reverse read for OwnershipInterest.depositor_record_id)."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "interest_role?"
      - "limit?"
      - "offset?"
    output: OwnershipInterest[]
    side_effects: []
  - method: POST
    path: /depositor-records/{id}/acknowledge-notice
    description: "Depositor acknowledges the receivership determination notice."
    roles: [Depositor]
    code: 200
    input: []
    output: DepositorRecord
    side_effects:
      - "notice_status SENT -> ACKNOWLEDGED"
      - "acknowledged_at set to the logical clock"
      - "version incremented"
  # ---------------- DepositAccount ----------------
  - method: POST
    path: /deposit-accounts
    description: "Load a standardized deposit account, including brokered pass-through placements."
    roles: [ClaimsAgent]
    code: 201
    input:
      - institution_id
      - primary_depositor_id
      - account_number
      - ownership_category
      - balance_cents
      - opened_at
      - "accrued_interest_cents?"
      - "broker_name?"
      - "recordkeeping_status?"
    output: DepositAccount
    side_effects:
      - "insurance_status=PENDING, hold_status=NONE, transition_status=PENDING, held_amount_cents=0, attributed_amount_cents=0"
      - "accrued_interest_cents defaults to 0 when omitted"
      - "institution.total_deposit_balance_cents += (balance_cents + accrued_interest_cents)"
      - "institution.version incremented"
  - method: GET
    path: /deposit-accounts
    description: "Filtered account list (FK reverse read for DepositAccount.institution_id and DepositAccount.primary_depositor_id)."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "institution_id?"
      - "primary_depositor_id?"
      - "ownership_category?"
      - "insurance_status?"
      - "hold_status?"
      - "transition_status?"
      - "recordkeeping_status?"
      - "limit?"
      - "offset?"
    output: DepositAccount[]
    side_effects: []
  - method: GET
    path: /deposit-accounts/{id}
    description: "Retrieve one deposit account with all three independent status dimensions."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input: []
    output: DepositAccount
    side_effects: []
  - method: POST
    path: /deposit-accounts/{id}/ownership-interests
    description: "Attach a co-owner, beneficiary or pass-through participant interest to an account."
    roles: [ClaimsAgent]
    code: 201
    input:
      - depositor_record_id
      - interest_role
      - designated_share_bps
    output: OwnershipInterest
    side_effects:
      - "immutable row created (common_fields: false — no version, no update endpoint)"
      - "deposit_account.version incremented"
  - method: GET
    path: /deposit-accounts/{id}/ownership-interests
    description: "List the interests attached to an account (FK reverse read for OwnershipInterest.deposit_account_id)."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "interest_role?"
      - "limit?"
      - "offset?"
    output: OwnershipInterest[]
    side_effects: []
  - method: POST
    path: /deposit-accounts/{id}/release-hold
    description: "Release the uninsured hold once the depositor has acknowledged the notice."
    roles: [ClaimsCertifier]
    code: 200
    input: []
    output: DepositAccount
    side_effects:
      - "hold_status HELD -> RELEASED"
      - "held_amount_cents set to 0"
      - "the ReceivershipCertificate is untouched — releasing the operational hold does not extinguish the uninsured claim"
      - "version incremented"
  # ---------------- InsuranceDetermination ----------------
  - method: POST
    path: /insurance-determinations
    description: |
      Open an insurance determination for a depositor. Optimistic concurrency on the parent DepositorRecord
      (§1.2.1 determination-create-stale-depositor): expected_depositor_record_version must match
      DepositorRecord.version or the write is rejected with ERR_STALE_DEPOSITOR_VERSION (412).
      When the depositor already has a CERTIFIED determination this opens a revision round: the prior
      determination is superseded and its side effects are compensated.
    roles: [ClaimsAgent]
    code: 201
    input:
      - depositor_record_id
      - expected_depositor_record_version
      - "revision_reason?"
    output: InsuranceDetermination
    side_effects:
      - "status set to DRAFT; revision_round set to 0 for a first determination, or prior_certified.revision_round + 1 when superseding a CERTIFIED determination"
      - "depositor_record.version incremented (OCC parent bump)"
      - "when superseding a CERTIFIED determination: compensation cascade C1-C4 (prior -> SUPERSEDED, its ReceivershipCertificate -> CANCELLED, depositor certified totals zeroed, institution aggregates decremented)"
  - method: GET
    path: /insurance-determinations
    description: "Filtered determination list (FK reverse read for InsuranceDetermination.depositor_record_id)."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "depositor_record_id?"
      - "status?"
      - "method_variant?"
      - "limit?"
      - "offset?"
    output: InsuranceDetermination[]
    side_effects: []
  - method: GET
    path: /insurance-determinations/{id}
    description: "Retrieve one determination including the per-ownership-category breakdown."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input: []
    output: InsuranceDetermination
    side_effects: []
  - method: POST
    path: /insurance-determinations/{id}/prepare
    description: |
      Run calculations.depositor_insurance_determination under the requested method_variant
      (AGGREGATE_BY_CATEGORY = final statutory method, PER_ACCOUNT_PROVISIONAL = provisional per-account method).
    roles: [ClaimsAgent]
    code: 200
    input:
      - method_variant
    output: InsuranceDetermination
    side_effects:
      - "attributed_total_cents, insured_amount_cents, uninsured_amount_cents and category_breakdown computed"
      - "method_variant and prepared_by_user_id stored from the request; prepared_at set to the logical clock"
      - "status DRAFT|REVISION_REQUESTED -> PREPARED"
      - "each contributing DepositAccount gets attributed_amount_cents written; insurance_status is NOT touched here (it flips FROZEN_FOR_DETERMINATION -> DETERMINED only on certify)"
      - "depositor_record.attributed_total_cents written"
      - "version incremented"
  - method: POST
    path: /insurance-determinations/{id}/submit-review
    description: "Hand the prepared determination to a certifier for independent review."
    roles: [ClaimsAgent]
    code: 200
    input: []
    output: InsuranceDetermination
    side_effects:
      - "status PREPARED -> UNDER_REVIEW"
      - "version incremented"
  - method: POST
    path: /insurance-determinations/{id}/certify
    description: |
      Certify the determination. Segregation of duties: the acting X-User-ID must differ from
      prepared_by_user_id. Fires the five-level cascade L1-L5 (determination -> depositor totals ->
      account holds -> receivership certificate -> institution aggregates).
    roles: [ClaimsCertifier]
    code: 200
    input: []
    output: InsuranceDetermination
    side_effects:
      - "L1: status UNDER_REVIEW -> CERTIFIED, certified_by_user_id and certified_at set; depositor_record.certified_insured_cents / certified_uninsured_cents written; institution.aggregate_insured_cents recomputed"
      - "L2 (caused by L1): every DepositAccount with attributed_amount_cents > 0 for this depositor flips insurance_status FROZEN_FOR_DETERMINATION -> DETERMINED"
      - "L3 (caused by L2, only when uninsured_amount_cents > 0): calculations.uninsured_hold_allocation writes held_amount_cents and flips hold_status NONE -> HELD on every account whose allocated hold is > 0"
      - "L4 (caused by L3): a ReceivershipCertificate is issued with face_amount_cents = uninsured_amount_cents; institution.aggregate_certificate_face_cents and uninsured_claim_count recomputed"
      - "L5 (caused by L4): depositor_record.notice_status PENDING -> SENT with notice_template_code = PARTIALLY_UNINSURED and notice_sent_at = the logical clock"
      - "conditional cascade: when uninsured_amount_cents == 0, L3 and L4 are skipped entirely (no hold, no certificate) and L5 still runs with notice_template_code = FULLY_INSURED"
      - "institution.version incremented; determination version incremented"
  - method: POST
    path: /insurance-determinations/{id}/request-revision
    description: "Send a determination under review back to the preparer (cyclic edge)."
    roles: [ClaimsCertifier]
    code: 200
    input:
      - revision_reason
    output: InsuranceDetermination
    side_effects:
      - "status UNDER_REVIEW -> REVISION_REQUESTED"
      - "revision_reason stored and revision_round incremented"
      - "version incremented"
  # ---------------- ReceivershipCertificate ----------------
  - method: GET
    path: /receivership-certificates
    description: "Filtered certificate list (FK reverse read for insurance_determination_id, depositor_record_id and institution_id)."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "insurance_determination_id?"
      - "depositor_record_id?"
      - "institution_id?"
      - "status?"
      - "limit?"
      - "offset?"
    output: ReceivershipCertificate[]
    side_effects: []
  - method: GET
    path: /receivership-certificates/{id}
    description: "Retrieve one receivership certificate with its cumulative dividend history."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input: []
    output: ReceivershipCertificate
    side_effects: []
  # ---------------- Bidder ----------------
  - method: POST
    path: /bidders
    description: "Register an acquiring institution as a potential bidder."
    roles: [ResolutionAnalyst]
    code: 201
    input:
      - legal_name
      - cert_number
      - tier1_capital_ratio_bps
      - camels_composite
    output: Bidder
    side_effects:
      - "qualification_status set to PENDING"
  - method: GET
    path: /bidders
    description: "List registered bidders."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "qualification_status?"
      - "limit?"
      - "offset?"
    output: Bidder[]
    side_effects: []
  - method: GET
    path: /bidders/{id}
    description: "Retrieve one bidder with its qualification decision."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input: []
    output: Bidder
    side_effects: []
  - method: POST
    path: /bidders/{id}/qualification
    description: "Qualify or disqualify a bidder against the capital and CAMELS eligibility floors."
    roles: [ResolutionAnalyst]
    code: 200
    input:
      - decision
      - "disqualification_reason?"
    output: Bidder
    side_effects:
      - "qualification_status PENDING -> QUALIFIED (decision=QUALIFY) with qualified_at set to the logical clock"
      - "qualification_status PENDING -> DISQUALIFIED (decision=DISQUALIFY) with disqualification_reason stored, defaulting to MANUAL when omitted"
      - "version incremented"
  # ---------------- Bid ----------------
  - method: POST
    path: /bids
    description: |
      Submit a purchase-and-assumption bid. Reserves a closed data-room interval that must be separated
      from every other live reservation on the institution by DATA_ROOM_BUFFER_MINUTES = 60.
    roles: [Bidder]
    code: 201
    input:
      - institution_id
      - bidder_id
      - structure
      - deposit_premium_bps
      - asset_discount_bps
      - data_room_window_start
      - data_room_window_end
      - "loss_share_pct_bps?"
      - "asset_retention_pool_cents?"
    output: Bid
    side_effects:
      - "status set to SUBMITTED; loss_share_pct_bps and asset_retention_pool_cents default to 0 when omitted"
      - "assumed_deposit_base_cents snapshotted from institution.total_deposit_balance_cents"
      - "cost fields (pre_fee_cost_cents, loss_share_fee_cents, expected_loss_share_reimbursement_cents, evaluated_cost_cents) left null until the least-cost test runs"
  - method: GET
    path: /bids
    description: "Filtered bid list (FK reverse read for Bid.institution_id and Bid.bidder_id; also the only way to read the winner)."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "institution_id?"
      - "bidder_id?"
      - "status?"
      - "structure?"
      - "limit?"
      - "offset?"
    output: Bid[]
    side_effects: []
  - method: GET
    path: /bids/{id}
    description: "Retrieve one bid with all evaluated cost components."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: POST
    path: /bids/{id}/withdraw
    description: "Bidder withdraws its own submitted bid, freeing the data-room reservation."
    roles: [Bidder]
    code: 200
    input: []
    output: Bid
    side_effects:
      - "status SUBMITTED -> WITHDRAWN"
      - "the data-room interval stops blocking later reservations"
      - "version incremented"
  # ---------------- Least-cost test ----------------
  - method: POST
    path: /institutions/{id}/least-cost-test/evaluate
    description: |
      Score every live bid under the requested test_variant (EXPECTED_LOSS_SHARE or RETENTION_ADJUSTED),
      compute the liquidation baseline, and mark each bid CONFORMING or NON_CONFORMING.
    roles: [ResolutionAnalyst]
    code: 200
    input:
      - test_variant
    output: Institution
    side_effects:
      - "liquidation_baseline_cents computed by calculations.liquidation_baseline_cost"
      - "every SUBMITTED bid scored by calculations.bid_evaluated_cost under the chosen variant and moved to CONFORMING or NON_CONFORMING (non_conformance_reason stored)"
      - "conforming_bid_count and least_cost_test_variant stored; least_cost_status NOT_STARTED -> EVALUATED"
      - "version incremented"
  - method: POST
    path: /institutions/{id}/least-cost-test/award
    description: "Award the resolution to the least-cost conforming bid, or fail all bids and liquidate."
    roles: [ResolutionAnalyst]
    code: 200
    input: []
    output: Institution
    side_effects:
      - "L1: the selected Bid (evaluated_cost_cents ASC, then deposit_premium_bps DESC, then created_at ASC) flips CONFORMING -> WINNER; institution.least_cost_status = AWARDED; institution.resolution_method = winner.structure; institution.status CLOSED_IN_RECEIVERSHIP -> RESOLUTION_COMPLETE"
      - "L2 (caused by L1): every other Bid in status CONFORMING or NON_CONFORMING flips to REJECTED"
      - "L3 (caused by L2 pinning resolution_method): every DepositAccount with insurance_status == DETERMINED and hold_status IN {NONE, RELEASED} flips transition_status PENDING -> TRANSFERRED"
      - "L4 (caused by L3): every BranchReopening of the institution in status PLANNED flips to READY"
      - "empty-candidate-set branch (no CONFORMING bid with evaluated_cost_cents < liquidation_baseline_cents, including conforming_bid_count == 0): least_cost_status = FAILED_ALL_BIDS, resolution_method = DEPOSIT_PAYOFF, no bid becomes WINNER, accounts flip transition_status PENDING -> PAID_OUT instead of TRANSFERRED, and L4 still fires"
      - "version incremented"
  # ---------------- BranchReopening ----------------
  - method: POST
    path: /institutions/{id}/branch-reopenings
    description: "Plan a branch reopening window (half-open, no buffer, per branch_code)."
    roles: [ClosingManager]
    code: 201
    input:
      - branch_code
      - reopen_window_start
      - reopen_window_end
      - staffing_headcount
    output: BranchReopening
    side_effects:
      - "status set to PLANNED (READY is reachable only via the award cascade link L4)"
      - "reschedule_count set to 0"
  - method: GET
    path: /institutions/{id}/branch-reopenings
    description: "List the institution's branch reopenings (FK reverse read for BranchReopening.institution_id)."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "status?"
      - "branch_code?"
      - "limit?"
      - "offset?"
    output: BranchReopening[]
    side_effects: []
  - method: GET
    path: /branch-reopenings/{id}
    description: "Retrieve one branch reopening plan."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input: []
    output: BranchReopening
    side_effects: []
  - method: POST
    path: /branch-reopenings/{id}/reschedule
    description: "Move a planned or ready branch window (cyclic edge back to PLANNED)."
    roles: [ClosingManager]
    code: 200
    input:
      - reopen_window_start
      - reopen_window_end
    output: BranchReopening
    side_effects:
      - "status READY|PLANNED -> PLANNED"
      - "new window stored and reschedule_count incremented"
      - "version incremented"
  - method: POST
    path: /branch-reopenings/{id}/reopen
    description: "Reopen the branch for customer transition inside its half-open window."
    roles: [ClosingManager]
    code: 200
    input: []
    output: BranchReopening
    side_effects:
      - "status READY -> REOPENED"
      - "reopened_at set to the logical clock"
      - "version incremented"
  # ---------------- DividendDistribution ----------------
  - method: POST
    path: /institutions/{id}/dividend-distributions
    description: |
      Declare a receivership dividend round for one priority class. Optimistic concurrency on the parent
      Institution (§1.2.1 dividend-declare-stale-institution): expected_institution_version must match
      Institution.version or the write is rejected with ERR_STALE_INSTITUTION_VERSION (412).
    roles: [ReceivershipTrustee]
    code: 201
    input:
      - priority_class
      - declared_rate_bps
      - expected_institution_version
    output: DividendDistribution
    side_effects:
      - "status set to DECLARED; distribution_round set to institution.dividend_round_count + 1"
      - "institution.dividend_round_count incremented and institution.version incremented (OCC parent bump)"
  - method: GET
    path: /dividend-distributions
    description: "Filtered dividend list (FK reverse read for DividendDistribution.institution_id)."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - "institution_id?"
      - "status?"
      - "priority_class?"
      - "limit?"
      - "offset?"
    output: DividendDistribution[]
    side_effects: []
  - method: GET
    path: /dividend-distributions/{id}
    description: "Retrieve one dividend round with its settled totals."
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input: []
    output: DividendDistribution
    side_effects: []
  - method: POST
    path: /dividend-distributions/{id}/settle
    description: "Settle the declared round using calculations.dividend_waterfall_allocation."
    roles: [ReceivershipTrustee]
    code: 200
    input: []
    output: DividendDistribution
    side_effects:
      - "per-certificate payouts computed and rounded individually, then summed into total_distributed_cents; certificate_count stored"
      - "each participating ReceivershipCertificate: cumulative_dividends_cents += payout, last_dividend_amount_cents and last_dividend_round set, status ISSUED -> PARTIALLY_PAID or -> PAID when cumulative_dividends_cents == face_amount_cents"
      - "institution.receivership_cash_cents -= total_distributed_cents"
      - "status DECLARED -> SETTLED, settled_at set to the logical clock"
      - "institution.version incremented; version incremented"
  - method: POST
    path: /dividend-distributions/{id}/void
    description: "Void the latest settled round, reversing every payout exactly (compensating invariant)."
    roles: [ReceivershipTrustee]
    code: 200
    input: []
    output: DividendDistribution
    side_effects:
      - "each participating certificate: cumulative_dividends_cents -= last_dividend_amount_cents, last_dividend_amount_cents reset to 0, last_dividend_round reset to 0, status reverted to PARTIALLY_PAID or ISSUED"
      - "institution.receivership_cash_cents += total_distributed_cents"
      - "status SETTLED -> VOIDED, voided_at set to the logical clock, total_distributed_cents retained for audit"
      - "institution.version incremented; version incremented"
  # ---------------- Test-driving endpoint ----------------
  - method: POST
    path: /_clock/set_current_utc
    description: |
      Test-driving endpoint for the logical clock. The logical clock defaults to 2026-08-01T00:00:00Z at
      process start; every timestamp side effect (failure_datetime, prepared_at, certified_at, notice_sent_at,
      acknowledged_at, qualified_at, issued_at, reopened_at, settled_at, voided_at) and every temporal
      validation reads this clock. The clock may only move forward.
    roles: [ClosingManager, ClaimsAgent, ClaimsCertifier, ResolutionAnalyst, ReceivershipTrustee, Bidder, Depositor]
    code: 200
    input:
      - to_iso8601
    output:
      current_utc: datetime
    side_effects:
      - "logical clock set to to_iso8601 (must be >= the current value)"

# =====================================================================================
# §1.6 Error Code Catalog
# =====================================================================================
errors:
  - code: ERR_UNAUTHENTICATED
    http_status: 401
    message: "Authentication headers missing or role unknown"
    triggered_by: "any endpoint called without X-User-Role / X-User-ID or with an undeclared role"
  - code: ERR_UNAUTHORIZED
    http_status: 403
    message: "Role not permitted for this operation"
    triggered_by: "acting role absent from the endpoint's roles list"
  - code: ERR_INSTITUTION_NOT_FOUND
    http_status: 404
    message: "Institution not found"
    triggered_by: "unknown institution id in path or body"
  - code: ERR_SUBMISSION_NOT_FOUND
    http_status: 404
    message: "Readiness submission not found"
    triggered_by: "unknown submission id"
  - code: ERR_DEPOSITOR_NOT_FOUND
    http_status: 404
    message: "Depositor record not found"
    triggered_by: "unknown depositor id in path, primary_depositor_id or depositor_record_id"
  - code: ERR_ACCOUNT_NOT_FOUND
    http_status: 404
    message: "Deposit account not found"
    triggered_by: "unknown deposit account id"
  - code: ERR_DETERMINATION_NOT_FOUND
    http_status: 404
    message: "Insurance determination not found"
    triggered_by: "unknown determination id"
  - code: ERR_CERTIFICATE_NOT_FOUND
    http_status: 404
    message: "Receivership certificate not found"
    triggered_by: "unknown certificate id"
  - code: ERR_BIDDER_NOT_FOUND
    http_status: 404
    message: "Bidder not found"
    triggered_by: "unknown bidder id in path or body"
  - code: ERR_BID_NOT_FOUND
    http_status: 404
    message: "Bid not found"
    triggered_by: "unknown bid id"
  - code: ERR_BRANCH_REOPENING_NOT_FOUND
    http_status: 404
    message: "Branch reopening not found"
    triggered_by: "unknown branch reopening id"
  - code: ERR_DISTRIBUTION_NOT_FOUND
    http_status: 404
    message: "Dividend distribution not found"
    triggered_by: "unknown dividend distribution id"
  - code: ERR_INVALID_REQUEST
    http_status: 400
    message: "Request body failed shape, type, enum or range validation"
    triggered_by: "missing required field, wrong type, invalid enum member, out-of-range integer, end <= start window, or brokered fields inconsistent with ownership_category"
  - code: ERR_CLOCK_MONOTONICITY
    http_status: 422
    message: "Logical clock cannot move backwards"
    triggered_by: "POST /_clock/set_current_utc with to_iso8601 earlier than the current logical clock"
  - code: ERR_DEPOSITOR_MISMATCH
    http_status: 403
    message: "Depositor may only act on their own record"
    triggered_by: "Depositor role whose X-User-ID differs from the target DepositorRecord id"
  - code: ERR_BIDDER_MISMATCH
    http_status: 403
    message: "Bidder may only act on their own bids"
    triggered_by: "Bidder role whose X-User-ID differs from the body bidder_id or the target bid's bidder_id"
  - code: ERR_STALE_DEPOSITOR_VERSION
    http_status: 412
    message: "expected_depositor_record_version does not match the current depositor record version"
    triggered_by: "POST /insurance-determinations with a stale expected_depositor_record_version"
  - code: ERR_STALE_INSTITUTION_VERSION
    http_status: 412
    message: "expected_institution_version does not match the current institution version"
    triggered_by: "POST /institutions/{id}/dividend-distributions with a stale expected_institution_version"
  - code: ERR_DEPOSITOR_INSTITUTION_MISMATCH
    http_status: 422
    message: "Depositor belongs to a different institution than the deposit account"
    triggered_by: "account create or ownership-interest create referencing a depositor from another institution"
  - code: ERR_BID_INSTITUTION_INELIGIBLE
    http_status: 422
    message: "Institution is not in a biddable state"
    triggered_by: "POST /bids for an institution whose status is not RESOLUTION_READY or CLOSED_IN_RECEIVERSHIP"
  - code: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    message: "Identifier already in use"
    triggered_by: "duplicate institution or bidder cert_number, duplicate account_number within an institution, duplicate tin_hash within an institution"
  - code: ERR_INSTITUTION_NOT_READY
    http_status: 409
    message: "Institution is not resolution-ready"
    triggered_by: "POST /institutions/{id}/close before a readiness submission has been standardized"
  - code: ERR_INSTITUTION_ALREADY_CLOSED
    http_status: 409
    message: "Institution is already in receivership"
    triggered_by: "second POST /institutions/{id}/close (idempotency guard)"
  - code: ERR_SUBMISSION_NOT_PENDING
    http_status: 409
    message: "Readiness submission is no longer pending"
    triggered_by: "standardize on a submission already STANDARDIZED or REJECTED"
  - code: ERR_DETERMINATION_NOT_PREPARABLE
    http_status: 409
    message: "Determination is not in a preparable state"
    triggered_by: "prepare on a determination that is not DRAFT or REVISION_REQUESTED"
  - code: ERR_DETERMINATION_NOT_PREPARED
    http_status: 409
    message: "Determination has not been prepared"
    triggered_by: "submit-review on a determination that is not PREPARED"
  - code: ERR_DETERMINATION_NOT_UNDER_REVIEW
    http_status: 409
    message: "Determination is not under review"
    triggered_by: "certify or request-revision on a determination that is not UNDER_REVIEW"
  - code: ERR_INSTITUTION_NOT_CLOSED
    http_status: 409
    message: "Institution has not been closed into receivership"
    triggered_by: "prepare or certify while the depositor's institution is not CLOSED_IN_RECEIVERSHIP"
  - code: ERR_ACTIVE_DETERMINATION_EXISTS
    http_status: 409
    message: "An active determination already exists for this depositor"
    triggered_by: "POST /insurance-determinations while a DRAFT, PREPARED, UNDER_REVIEW or REVISION_REQUESTED determination exists"
  - code: ERR_CERTIFICATE_ALREADY_PAID
    http_status: 409
    message: "Certificate has already received dividends and cannot be superseded"
    triggered_by: "POST /insurance-determinations revision after the prior certificate received a dividend"
  - code: ERR_HOLD_NOT_PLACED
    http_status: 409
    message: "No active hold on this account"
    triggered_by: "release-hold on an account whose hold_status is NONE or RELEASED"
  - code: ERR_NOTICE_NOT_ACKNOWLEDGED
    http_status: 409
    message: "Depositor has not acknowledged the determination notice"
    triggered_by: "release-hold before the primary depositor acknowledges"
  - code: ERR_NOTICE_NOT_SENT
    http_status: 409
    message: "No notice pending acknowledgement"
    triggered_by: "acknowledge-notice while notice_status is PENDING or ACKNOWLEDGED"
  - code: ERR_MARKETING_ACTION_INVALID
    http_status: 409
    message: "Franchise marketing action not allowed in the current state"
    triggered_by: "OPEN on an already-open franchise or CLOSE on a franchise that was never opened"
  - code: ERR_MARKETING_NOT_OPEN
    http_status: 409
    message: "Franchise marketing window is not open"
    triggered_by: "POST /bids while franchise_marketing_status is not OPEN"
  - code: ERR_BID_NOT_WITHDRAWABLE
    http_status: 409
    message: "Bid can no longer be withdrawn"
    triggered_by: "withdraw on a bid that is not SUBMITTED"
  - code: ERR_LEAST_COST_TEST_NOT_OPEN
    http_status: 409
    message: "Least-cost test cannot be evaluated in the current state"
    triggered_by: "evaluate while least_cost_status is not NOT_STARTED or the institution is not in receivership"
  - code: ERR_LEAST_COST_TEST_NOT_EVALUATED
    http_status: 409
    message: "Least-cost test has not been evaluated"
    triggered_by: "award while least_cost_status is not EVALUATED"
  - code: ERR_BRANCH_NOT_READY
    http_status: 409
    message: "Branch is not staffed and ready"
    triggered_by: "reopen on a branch reopening whose status is not READY"
  - code: ERR_OUTSIDE_REOPEN_WINDOW
    http_status: 422
    message: "Logical clock is outside the half-open reopening window"
    triggered_by: "reopen before reopen_window_start or at/after reopen_window_end"
  - code: ERR_BRANCH_NOT_RESCHEDULABLE
    http_status: 409
    message: "Branch reopening can no longer be rescheduled"
    triggered_by: "reschedule on a REOPENED branch reopening"
  - code: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    message: "Preparer may not certify their own determination"
    triggered_by: "certify with X-User-ID equal to prepared_by_user_id"
  - code: ERR_PROVISIONAL_VARIANT_NOT_CERTIFIABLE
    http_status: 422
    message: "Provisional per-account variant cannot be certified"
    triggered_by: "certify a determination prepared with method_variant PER_ACCOUNT_PROVISIONAL"
  - code: ERR_OWNERSHIP_SHARES_UNBALANCED
    http_status: 422
    message: "Joint account co-owner shares do not sum to 10000 bps"
    triggered_by: "prepare while a contributing JOINT account's CO_OWNER shares sum to anything other than 10000"
  - code: ERR_BRANCH_WINDOW_OVERLAP
    http_status: 409
    message: "Branch reopening window overlaps an existing window for this branch"
    triggered_by: "create or reschedule producing a half-open overlap on the same (institution_id, branch_code)"
  - code: ERR_BID_WINDOW_CLOSED
    http_status: 422
    message: "Bid deadline has passed"
    triggered_by: "POST /bids after institution.bid_deadline_at"
  - code: ERR_DATA_ROOM_WINDOW_CONFLICT
    http_status: 409
    message: "Data-room reservation violates the 60-minute separation buffer"
    triggered_by: "POST /bids whose closed data-room interval is within 60 minutes of a live reservation on the institution"
  - code: ERR_BIDDER_NOT_QUALIFIED
    http_status: 422
    message: "Bidder is not qualified"
    triggered_by: "POST /bids for a PENDING or DISQUALIFIED bidder"
  - code: ERR_BIDDER_INELIGIBLE
    http_status: 422
    message: "Bidder fails the capital or CAMELS eligibility floors"
    triggered_by: "qualification decision QUALIFY with tier1_capital_ratio_bps < 1000 or camels_composite > 2"
  - code: ERR_DISTRIBUTION_NOT_DECLARED
    http_status: 409
    message: "Dividend round is not in DECLARED state"
    triggered_by: "settle on a round already SETTLED or VOIDED"
  - code: ERR_DISTRIBUTION_NOT_SETTLED
    http_status: 409
    message: "Dividend round is not settled"
    triggered_by: "void on a DECLARED or already VOIDED round"
  - code: ERR_PRIORITY_CLASS_OUT_OF_ORDER
    http_status: 409
    message: "Priority classes must be paid in order"
    triggered_by: "declaring INSURED_SUBROGATION after a GENERAL_UNSECURED round has settled"
  - code: ERR_NOT_LATEST_DIVIDEND_ROUND
    http_status: 409
    message: "Only the latest settled dividend round may be voided"
    triggered_by: "void on an earlier settled round"
  - code: ERR_RECEIVERSHIP_NOT_TERMINABLE
    http_status: 409
    message: "Receivership still has open holds or dividend rounds"
    triggered_by: "terminate-receivership with a DECLARED round, a HELD account, or a status other than RESOLUTION_COMPLETE"
  - code: ERR_INSUFFICIENT_RECEIVERSHIP_CASH
    http_status: 402
    message: "Receivership cash is insufficient for the declared dividend"
    triggered_by: "settle a round whose computed payout exceeds receivership_cash_cents"
  - code: ERR_DISPOSITION_EXPENSE_EXCEEDS_PROCEEDS
    http_status: 422
    message: "Disposition expense exceeds gross proceeds"
    triggered_by: "POST /institutions/{id}/receivership-proceeds with disposition_expense_cents > gross_proceeds_cents"

# =====================================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# =====================================================================================
roles:
  - name: ClosingManager
    identity: opaque
    description: "Runs pre-failure readiness collection, the closing itself, and branch reopening logistics."
    exclusive_operations:
      - "POST /institutions"
      - "POST /institutions/{id}/readiness-submissions"
      - "POST /readiness-submissions/{id}/standardize"
      - "POST /institutions/{id}/close"
      - "POST /institutions/{id}/branch-reopenings"
      - "POST /branch-reopenings/{id}/reschedule"
      - "POST /branch-reopenings/{id}/reopen"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: ClaimsAgent
    identity: opaque
    description: "Loads depositor and account data and prepares insurance determinations. May never certify."
    exclusive_operations:
      - "POST /institutions/{id}/depositor-records"
      - "POST /deposit-accounts"
      - "POST /deposit-accounts/{id}/ownership-interests"
      - "POST /insurance-determinations"
      - "POST /insurance-determinations/{id}/prepare"
      - "POST /insurance-determinations/{id}/submit-review"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: ClaimsCertifier
    identity: opaque
    description: "Independently certifies determinations and releases uninsured holds. Distinct X-User-ID from the preparer is enforced."
    exclusive_operations:
      - "POST /insurance-determinations/{id}/certify"
      - "POST /insurance-determinations/{id}/request-revision"
      - "POST /deposit-accounts/{id}/release-hold"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: ResolutionAnalyst
    identity: opaque
    description: "Markets the franchise, qualifies bidders and runs the least-cost test and award."
    exclusive_operations:
      - "POST /institutions/{id}/franchise-marketing"
      - "POST /bidders"
      - "POST /bidders/{id}/qualification"
      - "POST /institutions/{id}/least-cost-test/evaluate"
      - "POST /institutions/{id}/least-cost-test/award"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: ReceivershipTrustee
    identity: opaque
    description: "Books asset disposition proceeds and administers the dividend waterfall."
    exclusive_operations:
      - "POST /institutions/{id}/receivership-proceeds"
      - "POST /institutions/{id}/dividend-distributions"
      - "POST /dividend-distributions/{id}/settle"
      - "POST /dividend-distributions/{id}/void"
      - "POST /institutions/{id}/terminate-receivership"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: Bidder
    identity: "entity_backed:Bidder"
    description: "An acquiring institution; X-User-ID is the Bidder.id and may only submit or withdraw its own bids."
    exclusive_operations:
      - "POST /bids"
      - "POST /bids/{id}/withdraw"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: Depositor
    identity: "entity_backed:DepositorRecord"
    description: "A depositor of the failed institution; X-User-ID is the DepositorRecord.id and may only acknowledge its own notice."
    exclusive_operations:
      - "POST /depositor-records/{id}/acknowledge-notice"
    shared_operations:
      - "all GET endpoints"
      - "POST /_clock/set_current_utc"
