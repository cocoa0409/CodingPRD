# =============================================================================
# Task 1266: Consent Management & Ad Tech Compliance — seed tables
# =============================================================================

scenario: |
  Consent management & ad-tech compliance platform for a digital marketing
  privacy team. Covers consent banner configuration by jurisdiction & category,
  preference storage & propagation to tags/vendors, Global Privacy Control
  (GPC) opt-out signal honoring, sale/share designation & do-not-sell request
  processing with downstream vendor propagation, vendor tag audits with
  unauthorized tracker detection, consent record retention for regulatory
  proof, children's data age gating, and regulatory sweep response with
  property-wide posture freezing.

domain_name: consent-ad-tech-compliance
api_prefix: /v1

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Event sourcing"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - pagination_with_filtering
  entity_topology: flat          # peer collections under /v1, FK references in bodies
  state_machine_shape: posture_driven   # Property.posture (NORMAL|FROZEN) gates admin + consent mutations; ConsentRecord is cyclic, DoNotSellRequest has parallel dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate            # TagRule -> Vendor / ConsentBannerConfig; VendorPropagation -> Vendor
  role_model: segregation_of_duties     # scan creator cannot confirm violations on own scan
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Property (site/app) name" }
      - { name: sale_share_designation, type: enum, source: input, description: "SELLS_AND_SHARES | SHARES_ONLY | NO_SALE_NO_SHARE — sale/share designation of the property" }
      - { name: posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | FROZEN — FROZEN while any RegulatorySweep of this property is ESCALATED; gates admin and consent-grant mutations" }
      - { name: granted_purpose_count, type: integer, source: computed, default: 0, description: "Count of ConsentRecords with status GRANTED across all visitors of this property (NECESSARY auto-grants excluded — no record is stored for them)" }

  - name: JurisdictionPolicy
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction code, e.g. EU-GDPR, US-CA, US-COPPA, BR-LGPD" }
      - { name: banner_regime, type: enum, source: input, description: "OPT_IN_REQUIRED | OPT_OUT_ALLOWED | NOTICE_ONLY" }
      - { name: min_consent_age, type: integer, source: input, description: "Minimum age in completed years for independent consent (e.g. 13, 16)" }
      - { name: retention_days, type: integer, source: input, description: "Consent record retention horizon in days (>= 1); editable while ACTIVE (drives rolling variant)" }
      - { name: gpc_honored, type: boolean, source: input, description: "Whether Global Privacy Control signals are binding in this jurisdiction" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage window end (exclusive); null = open-ended", default: null }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ACTIVE -> RETIRED; activation enforces half-open window non-overlap per (property, jurisdiction_code)" }

  - name: ConsentBannerConfig
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction this banner configuration serves" }
      - { name: categories_shown, type: array, source: input, description: "Purpose categories displayed on the banner: subset of ANALYTICS | ADVERTISING | SALE_SHARE" }
      - { name: config_label, type: string, source: input, description: "Human label for the configuration version" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> PUBLISHED -> SUPERSEDED | SUPPRESSED | ARCHIVED; DRAFT -> ARCHIVED; SUPPRESSED -> PUBLISHED via re-publish" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Timestamp of last transition into PUBLISHED" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: legal_name, type: string, source: input, description: "Vendor legal name" }
      - { name: declared_purposes, type: array, source: input, description: "Purpose categories the vendor is declared for: subset of ANALYTICS | ADVERTISING | SALE_SHARE" }
      - { name: tracker_signatures, type: array, source: input, description: "Tracker signatures (domains/pixels) the vendor declares" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW -> APPROVED -> SUSPENDED (terminal)" }
      - { name: risk_score_strict, type: integer, source: computed, default: 0, description: "100 if any TrackerFinding for this vendor is CONFIRMED_VIOLATION, else 0" }
      - { name: risk_score_weighted, type: integer, source: computed, default: 0, description: "min(100, sum of severity weights over findings in OPEN or CONFIRMED_VIOLATION: HIGH=50, MEDIUM=25)" }

  - name: TagRule
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: computed, description: "FK -> Property.id; derived from banner_config's property at creation" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: banner_config_id, type: string, source: input, description: "FK -> ConsentBannerConfig.id" }
      - { name: purpose_category, type: enum, source: input, description: "ANALYTICS | ADVERTISING | SALE_SHARE" }
      - { name: status, type: enum, source: system, default: ENABLED, description: "ENABLED <-> DISABLED (cyclic), -> RETIRED (terminal); unique per (banner_config_id, purpose_category)" }

  - name: VisitorProfile
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: external_ref, type: string, source: input, description: "External visitor reference (pseudonymous id or email hash)" }
      - { name: jurisdiction_code, type: string, source: input, description: "Visitor's detected jurisdiction code" }
      - { name: attested_birthdate, type: datetime, source: input, default: null, description: "Birthdate attested by the visitor (date at 00:00:00Z)" }
      - { name: age_status, type: enum, source: system, default: UNVERIFIED, description: "UNVERIFIED | ADULT | CHILD — computed at attestation against the ACTIVE policy's min_consent_age" }
      - { name: gpc_effective, type: enum, source: system, default: UNSET, description: "UNSET | ON | OFF — effective Global Privacy Control signal" }
      - { name: gpc_updated_at, type: datetime, source: system, default: null, description: "Timestamp of the latest GPC signal event" }
      - { name: sale_share_opted_out, type: boolean, source: computed, default: false, description: "True when GPC ON is honored (policy.gpc_honored) — drives SALE_SHARE withdrawal cascade" }

  - name: GpcSignalEvent
    parent: null
    common_fields: false   # immutable event: id + created_at only
    fields:
      - { name: visitor_id, type: string, source: system, description: "FK -> VisitorProfile.id" }
      - { name: signal, type: enum, source: input, description: "ON | OFF" }

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - { name: visitor_id, type: string, source: system, description: "FK -> VisitorProfile.id" }
      - { name: property_id, type: string, source: computed, description: "FK -> Property.id; copied from visitor at creation" }
      - { name: purpose_category, type: enum, source: input, description: "NECESSARY | ANALYTICS | ADVERTISING | SALE_SHARE; unique per (visitor_id, purpose_category) while status in GRANTED|WITHDRAWN" }
      - { name: status, type: enum, source: system, default: GRANTED, description: "GRANTED <-> WITHDRAWN (cyclic via withdraw/regrant); GRANTED|WITHDRAWN -> EXPIRED when now >= expires_at_pinned; EXPIRED terminal" }
      - { name: banner_config_id, type: string, source: system, default: null, description: "PUBLISHED ConsentBannerConfig for the visitor's jurisdiction at last transition into GRANTED; null if none published" }
      - { name: policy_snapshot_retention_days, type: integer, source: system, description: "retention_days snapshotted from the ACTIVE policy at last transition into GRANTED" }
      - { name: last_changed_at, type: datetime, source: system, description: "Timestamp of last status transition" }
      - { name: expires_at_pinned, type: datetime, source: computed, description: "last_changed_at + policy_snapshot_retention_days — AUTHORITATIVE expiry used by the EXPIRED transition" }
      - { name: expires_at_rolling, type: datetime, source: computed, description: "last_changed_at + live policy.retention_days — recomputed on read for audit comparison" }
      - { name: source_of_decision, type: enum, source: system, description: "EXPLICIT_GRANT | EXPLICIT_WITHDRAW | AUTO_GPC_WITHDRAW | EXPIRY" }

  - name: DoNotSellRequest
    parent: null
    common_fields: true
    fields:
      - { name: visitor_id, type: string, source: system, description: "FK -> VisitorProfile.id" }
      - { name: property_id, type: string, source: computed, description: "FK -> Property.id; copied from visitor" }
      - { name: scope_categories, type: array, source: input, default: ["SALE_SHARE"], description: "Purpose categories in scope of the do-not-sell/share request" }
      - { name: verification_status, type: enum, source: system, default: UNVERIFIED, description: "Parallel dimension 1: UNVERIFIED -> VERIFIED | REJECTED" }
      - { name: propagation_status, type: enum, source: system, default: NOT_STARTED, description: "Parallel dimension 2: NOT_STARTED -> PROPAGATING -> ALL_CONFIRMED | PARTIAL_FAILURE; PARTIAL_FAILURE -> PROPAGATING on retry (cycle)" }
      - { name: total_propagations, type: integer, source: computed, default: 0, description: "Count of VendorPropagation children" }
      - { name: pending_count, type: integer, source: computed, default: 0, description: "Children with status PENDING" }
      - { name: confirmed_count, type: integer, source: computed, default: 0, description: "Children with status CONFIRMED" }
      - { name: failed_count, type: integer, source: computed, default: 0, description: "Children with status FAILED" }

  - name: VendorPropagation
    parent: null
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> DoNotSellRequest.id" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> CONFIRMED | FAILED; FAILED -> PENDING on retry (cycle)" }
      - { name: attempts, type: integer, source: system, default: 1, description: "Dispatch attempts; starts at 1 on creation, +1 on each retry into PENDING" }
      - { name: last_attempt_at, type: datetime, source: system, description: "Timestamp of latest status change" }

  - name: TagAuditScan
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scan window start" }
      - { name: duration_minutes, type: integer, source: input, description: "Scan window length (> 0)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> COMPLETED (via run)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating ComplianceAuditor (SoD anchor)" }
      - { name: findings_created_count, type: integer, source: computed, default: 0, description: "TrackerFindings created by run" }
      - { name: unauthorized_findings_count, type: integer, source: computed, default: 0, description: "Findings with violation_type UNAUTHORIZED_TRACKER" }

  - name: TrackerFinding
    parent: null
    common_fields: true
    fields:
      - { name: scan_id, type: string, source: system, description: "FK -> TagAuditScan.id" }
      - { name: tracker_signature, type: string, source: system, description: "Observed tracker signature" }
      - { name: violation_type, type: enum, source: system, description: "UNAUTHORIZED_TRACKER (no APPROVED vendor declares the signature) | PURPOSE_MISMATCH (APPROVED vendor declares it but observed purpose not in declared_purposes)" }
      - { name: severity, type: enum, source: system, description: "HIGH for UNAUTHORIZED_TRACKER | MEDIUM for PURPOSE_MISMATCH" }
      - { name: vendor_id, type: string, source: system, default: null, description: "FK -> Vendor.id; null when UNAUTHORIZED_TRACKER" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> REMEDIATED -> CLOSED; OPEN -> CONFIRMED_VIOLATION -> CLOSED" }
      - { name: remediated_by_user_id, type: string, source: system, default: null, description: "VendorManager X-User-ID who remediated" }
      - { name: confirmed_by_user_id, type: string, source: system, default: null, description: "ComplianceAuditor X-User-ID who confirmed the violation (must differ from scan.created_by_user_id)" }

  - name: RegulatorySweep
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: regulator_ref, type: string, source: input, description: "Regulator case reference" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction the sweep covers" }
      - { name: deadline_days, type: integer, source: input, description: "Days from creation until response is due (> 0)" }
      - { name: response_due_at, type: datetime, source: computed, description: "created_at + deadline_days" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> EVIDENCE_COLLECTION -> RESPONDED -> CLOSED; OPEN|EVIDENCE_COLLECTION -> ESCALATED (manual or automatic when clock passes response_due_at); ESCALATED -> CLOSED" }
      - { name: escalated_at, type: datetime, source: system, default: null, description: "Timestamp of escalation (manual or deadline)" }
      - { name: penalty_exposure_cents, type: integer, source: computed, default: null, description: "Sweep penalty exposure computed at escalation; null until ESCALATED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: JurisdictionPolicy
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "PUT /v1/jurisdiction-policies/{id} {status: ACTIVE}"
        actor: PrivacyAdmin
        preconditions:
          - "Property posture NORMAL (ERR_PROPERTY_FROZEN)"
          - "No other ACTIVE policy for same (property_id, jurisdiction_code) whose [effective_from, effective_to) half-open window intersects (ERR_POLICY_WINDOW_OVERLAP); adjacency (gap = 0) is allowed"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "PUT /v1/jurisdiction-policies/{id} {status: RETIRED}"
        actor: PrivacyAdmin
        preconditions:
          - "Property posture NORMAL (ERR_PROPERTY_FROZEN)"
        side_effects:
          - "ConsentRecord expires_at_rolling recomputed on next read (records lose their live policy reference)"

  - entity: ConsentBannerConfig
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /v1/banner-configs/{id}/publish"
        actor: PrivacyAdmin
        preconditions:
          - "Config in DRAFT or SUPPRESSED (ERR_BANNER_CONFIG_NOT_PUBLISHABLE)"
          - "Property posture NORMAL (ERR_PROPERTY_FROZEN)"
          - "expected_property_version == Property.version (ERR_STALE_PROPERTY_VERSION)"
          - "An ACTIVE JurisdictionPolicy exists for config.jurisdiction_code (ERR_NO_ACTIVE_POLICY)"
          - "Current clock within that policy's [effective_from, effective_to) window (ERR_POLICY_OUTSIDE_COVERAGE_WINDOW)"
        side_effects:
          - "Any other PUBLISHED config for same (property_id, jurisdiction_code) -> SUPERSEDED; its ENABLED TagRules -> DISABLED (each disable decrements nothing but flips status)"
          - "published_at = now; Property.version += 1"
      - from: SUPPRESSED
        to: PUBLISHED
        trigger: "POST /v1/banner-configs/{id}/publish"
        actor: PrivacyAdmin
        preconditions:
          - "Same as DRAFT -> PUBLISHED"
        side_effects:
          - "Same supersede side effects; published_at = now; Property.version += 1"
      - from: PUBLISHED
        to: SUPPRESSED
        trigger: "system (cascade: property posture becomes FROZEN)"
        actor: system
        preconditions: []
        side_effects:
          - "The config's ENABLED TagRules -> DISABLED (cascade link 3)"
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /v1/banner-configs/{id}/archive"
        actor: PrivacyAdmin
        preconditions:
          - "Config in DRAFT (ERR_BANNER_CONFIG_NOT_PUBLISHABLE); property posture NORMAL (ERR_PROPERTY_FROZEN)"
        side_effects: []

  - entity: Vendor
    initial_state: PENDING_REVIEW
    terminal_states: [SUSPENDED]
    transitions:
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /v1/vendors/{id}/approve"
        actor: PrivacyAdmin
        preconditions:
          - "Vendor in PENDING_REVIEW (ERR_VENDOR_INVALID_TRANSITION); property posture NORMAL (ERR_PROPERTY_FROZEN)"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /v1/vendors/{id}/suspend"
        actor: PrivacyAdmin
        preconditions:
          - "Vendor in APPROVED (ERR_VENDOR_INVALID_TRANSITION); property posture NORMAL (ERR_PROPERTY_FROZEN)"
        side_effects:
          - "Cascade: every TagRule with vendor_id = this vendor and status ENABLED -> DISABLED (depth-2 cascade from suspend)"

  - entity: TagRule
    initial_state: ENABLED
    terminal_states: [RETIRED]
    transitions:
      - from: ENABLED
        to: DISABLED
        trigger: "PUT /v1/tag-rules/{id} {status: DISABLED} or cascade (vendor suspend / config supersede / config suppress)"
        actor: VendorManager | system
        preconditions:
          - "Rule in ENABLED (ERR_TAG_RULE_INVALID_TRANSITION); property posture NORMAL for manual disable (ERR_PROPERTY_FROZEN)"
        side_effects: []
      - from: DISABLED
        to: ENABLED
        trigger: "PUT /v1/tag-rules/{id} {status: ENABLED}"
        actor: VendorManager
        preconditions:
          - "Rule in DISABLED (ERR_TAG_RULE_INVALID_TRANSITION); property posture NORMAL (ERR_PROPERTY_FROZEN)"
          - "Vendor must be APPROVED (ERR_VENDOR_NOT_APPROVED) — cross-entity state dependency"
        side_effects: []
      - from: ENABLED
        to: RETIRED
        trigger: "PUT /v1/tag-rules/{id} {status: RETIRED}"
        actor: VendorManager
        preconditions:
          - "Rule in ENABLED or DISABLED (ERR_TAG_RULE_INVALID_TRANSITION); property posture NORMAL (ERR_PROPERTY_FROZEN)"
        side_effects: []
      - from: DISABLED
        to: RETIRED
        trigger: "PUT /v1/tag-rules/{id} {status: RETIRED}"
        actor: VendorManager
        preconditions:
          - "Rule in ENABLED or DISABLED (ERR_TAG_RULE_INVALID_TRANSITION); property posture NORMAL (ERR_PROPERTY_FROZEN)"
        side_effects: []

  - entity: ConsentRecord
    initial_state: GRANTED
    terminal_states: [EXPIRED]
    transitions:
      - from: GRANTED
        to: WITHDRAWN
        trigger: "POST /v1/consent-records/{id}/withdraw, or system AUTO_GPC_WITHDRAW cascade"
        actor: Visitor | system
        preconditions:
          - "Record in GRANTED (ERR_CONSENT_INVALID_TRANSITION); withdraw is allowed even when property is FROZEN (rights honoring)"
        side_effects:
          - "last_changed_at = now; source_of_decision = EXPLICIT_WITHDRAW or AUTO_GPC_WITHDRAW; expires_at_pinned/rolling recomputed from new last_changed_at"
          - "Property.granted_purpose_count -= 1; Property.version += 1 (ledger sync, cascade link 3 of GPC cascade)"
      - from: WITHDRAWN
        to: GRANTED
        trigger: "POST /v1/consent-records/{id}/regrant"
        actor: Visitor
        preconditions:
          - "Record in WITHDRAWN (ERR_CONSENT_INVALID_TRANSITION); property posture NORMAL (ERR_PROPERTY_FROZEN)"
          - "Same safety/referential/temporal gates as create: ERR_AGE_UNVERIFIED, ERR_CHILD_CONSENT_FORBIDDEN, ERR_NO_ACTIVE_POLICY, ERR_POLICY_OUTSIDE_COVERAGE_WINDOW"
        side_effects:
          - "policy_snapshot_retention_days refreshed from ACTIVE policy; banner_config_id refreshed to currently PUBLISHED config (or null); last_changed_at = now; expiries recomputed; source_of_decision = EXPLICIT_GRANT"
          - "Property.granted_purpose_count += 1; Property.version += 1"
      - from: GRANTED
        to: EXPIRED
        trigger: "system (lazy: on read or clock-set, when now >= expires_at_pinned)"
        actor: system
        preconditions: []
        side_effects:
          - "source_of_decision = EXPIRY; Property.granted_purpose_count -= 1 if previous status was GRANTED; Property.version += 1"
      - from: WITHDRAWN
        to: EXPIRED
        trigger: "system (lazy: on read or clock-set, when now >= expires_at_pinned)"
        actor: system
        preconditions: []
        side_effects:
          - "source_of_decision = EXPIRY (count unchanged: WITHDRAWN records are not in granted_purpose_count)"

  - entity: DoNotSellRequest
    initial_state: UNVERIFIED / NOT_STARTED (two parallel dimensions)
    terminal_states: [REJECTED (verification); ALL_CONFIRMED (propagation)]
    transitions:
      - from: "verification UNVERIFIED"
        to: VERIFIED
        trigger: "PUT /v1/do-not-sell-requests/{id} {verification_status: VERIFIED}"
        actor: PrivacyAdmin
        preconditions: ["verification_status == UNVERIFIED (ERR_DNS_INVALID_STATE)"]
        side_effects: []
      - from: "verification UNVERIFIED"
        to: REJECTED
        trigger: "PUT /v1/do-not-sell-requests/{id} {verification_status: REJECTED}"
        actor: PrivacyAdmin
        preconditions: ["verification_status == UNVERIFIED (ERR_DNS_INVALID_STATE)"]
        side_effects: []
      - from: "propagation NOT_STARTED"
        to: PROPAGATING
        trigger: "POST /v1/do-not-sell-requests/{id}/propagate"
        actor: PrivacyAdmin
        preconditions:
          - "verification_status == VERIFIED (ERR_DNS_INVALID_STATE)"
          - "propagation_status in {NOT_STARTED, PARTIAL_FAILURE} (ERR_DNS_INVALID_STATE)"
        side_effects:
          - "Creates one VendorPropagation (status PENDING, attempts 1) per in-scope vendor: Vendor.status == APPROVED and declared_purposes intersects scope_categories; creation order by Vendor.created_at ASC"
          - "If zero in-scope vendors: propagation_status = ALL_CONFIRMED immediately with total_propagations = 0 (empty-pool fallback)"
      - from: "propagation PARTIAL_FAILURE"
        to: PROPAGATING
        trigger: "POST /v1/do-not-sell-requests/{id}/propagate"
        actor: PrivacyAdmin
        preconditions: ["as above"]
        side_effects: ["Creates PENDING propagations for in-scope vendors lacking any PENDING/CONFIRMED propagation on this request"]
      - from: "propagation PROPAGATING"
        to: ALL_CONFIRMED
        trigger: "system (when pending_count reaches 0 and failed_count == 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "propagation PROPAGATING"
        to: PARTIAL_FAILURE
        trigger: "system (when pending_count reaches 0 and failed_count > 0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: VendorPropagation
    initial_state: PENDING
    terminal_states: [CONFIRMED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "PUT /v1/vendor-propagations/{id} {status: CONFIRMED}"
        actor: VendorManager
        preconditions: ["status == PENDING (ERR_PROPAGATION_INVALID_STATE)"]
        side_effects: ["Request counters recomputed; request propagation_status re-evaluated"]
      - from: PENDING
        to: FAILED
        trigger: "PUT /v1/vendor-propagations/{id} {status: FAILED}"
        actor: VendorManager
        preconditions: ["status == PENDING (ERR_PROPAGATION_INVALID_STATE)"]
        side_effects: ["Request counters recomputed; request propagation_status re-evaluated"]
      - from: FAILED
        to: PENDING
        trigger: "PUT /v1/vendor-propagations/{id} {status: PENDING} (retry)"
        actor: VendorManager
        preconditions: ["status == FAILED (ERR_PROPAGATION_INVALID_STATE)"]
        side_effects: ["attempts += 1; last_attempt_at = now; request counters recomputed (pending +1, failed -1); request propagation_status -> PROPAGATING"]

  - entity: TagAuditScan
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /v1/tag-audit-scans/{id}/run"
        actor: ComplianceAuditor
        preconditions:
          - "Scan in SCHEDULED (ERR_SCAN_NOT_RUNNABLE)"
        side_effects:
          - "Detection per observed tracker (deduplicated by tracker_signature, first observation wins): no APPROVED vendor declaring signature -> TrackerFinding(UNAUTHORIZED_TRACKER, HIGH, vendor_id null); matched APPROVED vendor but observed purpose not in declared_purposes -> TrackerFinding(PURPOSE_MISMATCH, MEDIUM, vendor_id = match); else no finding. Match selector: APPROVED vendors containing the signature, earliest created_at ASC"
          - "findings_created_count / unauthorized_findings_count set; vendor risk scores recomputed"

  - entity: TrackerFinding
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REMEDIATED
        trigger: "PUT /v1/tracker-findings/{id} {status: REMEDIATED}"
        actor: VendorManager
        preconditions: ["status == OPEN (ERR_FINDING_INVALID_STATE)"]
        side_effects: ["remediated_by_user_id set; vendor risk scores recomputed"]
      - from: OPEN
        to: CONFIRMED_VIOLATION
        trigger: "PUT /v1/tracker-findings/{id} {status: CONFIRMED_VIOLATION}"
        actor: ComplianceAuditor
        preconditions:
          - "status == OPEN (ERR_FINDING_INVALID_STATE)"
          - "X-User-ID != scan.created_by_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects: ["confirmed_by_user_id set; vendor risk scores recomputed"]
      - from: REMEDIATED
        to: CLOSED
        trigger: "PUT /v1/tracker-findings/{id} {status: CLOSED}"
        actor: ComplianceAuditor
        preconditions: ["status in {REMEDIATED, CONFIRMED_VIOLATION} (ERR_FINDING_INVALID_STATE)"]
        side_effects: ["vendor risk scores recomputed"]
      - from: CONFIRMED_VIOLATION
        to: CLOSED
        trigger: "PUT /v1/tracker-findings/{id} {status: CLOSED}"
        actor: ComplianceAuditor
        preconditions: ["status in {REMEDIATED, CONFIRMED_VIOLATION} (ERR_FINDING_INVALID_STATE)"]
        side_effects: ["vendor risk scores recomputed"]

  - entity: RegulatorySweep
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: EVIDENCE_COLLECTION
        trigger: "POST /v1/regulatory-sweeps/{id}/begin-evidence-collection"
        actor: ComplianceAuditor
        preconditions: ["status == OPEN (ERR_SWEEP_INVALID_STATE)"]
        side_effects: []
      - from: OPEN
        to: RESPONDED
        trigger: "POST /v1/regulatory-sweeps/{id}/respond"
        actor: PrivacyAdmin
        preconditions:
          - "status in {OPEN, EVIDENCE_COLLECTION} (ERR_SWEEP_INVALID_STATE)"
          - "now <= response_due_at; if now > response_due_at the sweep first auto-transitions to ESCALATED (full escalation side effects) and the respond call fails with ERR_SWEEP_DEADLINE_PASSED"
        side_effects: []
      - from: EVIDENCE_COLLECTION
        to: RESPONDED
        trigger: "POST /v1/regulatory-sweeps/{id}/respond"
        actor: PrivacyAdmin
        preconditions: ["as above"]
        side_effects: []
      - from: OPEN
        to: ESCALATED
        trigger: "POST /v1/regulatory-sweeps/{id}/escalate, or system (lazy on read/clock-set when now > response_due_at)"
        actor: ComplianceAuditor | system
        preconditions: ["status in {OPEN, EVIDENCE_COLLECTION} (ERR_SWEEP_INVALID_STATE)"]
        side_effects:
          - "escalated_at = now; penalty_exposure_cents computed (sweep_penalty_exposure_cents rule)"
          - "Cascade link 1: Property.posture -> FROZEN; Property.version += 1"
          - "Cascade link 2: posture FROZEN triggers every PUBLISHED ConsentBannerConfig of the property -> SUPPRESSED"
          - "Cascade link 3: each config SUPPRESSED triggers its ENABLED TagRules -> DISABLED"
      - from: EVIDENCE_COLLECTION
        to: ESCALATED
        trigger: "as above"
        actor: ComplianceAuditor | system
        preconditions: ["status in {OPEN, EVIDENCE_COLLECTION} (ERR_SWEEP_INVALID_STATE)"]
        side_effects: ["as above"]
      - from: RESPONDED
        to: CLOSED
        trigger: "POST /v1/regulatory-sweeps/{id}/close"
        actor: PrivacyAdmin
        preconditions: ["status in {RESPONDED, ESCALATED} (ERR_SWEEP_INVALID_STATE)"]
        side_effects:
          - "If no other sweep of the property remains ESCALATED: Property.posture -> NORMAL; Property.version += 1 (configs stay SUPPRESSED until re-published)"
      - from: ESCALATED
        to: CLOSED
        trigger: "POST /v1/regulatory-sweeps/{id}/close"
        actor: PrivacyAdmin
        preconditions: ["status in {RESPONDED, ESCALATED} (ERR_SWEEP_INVALID_STATE)"]
        side_effects: ["as above"]

# =============================================================================
# Table 2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: banner-publish-stale-property
    parent_entity: Property
    write_endpoint: "POST /v1/banner-configs/{id}/publish"
    occ_field: expected_property_version
    description: |
      Publishing a ConsentBannerConfig supersedes whichever config is
      currently PUBLISHED for the same (property, jurisdiction). A publish
      that carries an expected_property_version older than the property's
      current version is rejected: the client's view of the property is
      stale (e.g. another publish, consent cascade, or posture flip has
      advanced the version since).
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_consent_resolution
    trigger: "consent record create/regrant; tag-directive evaluation"
    algorithm: decision_waterfall
    formula: |
      Inputs: ACTIVE policy P for visitor.jurisdiction_code, visitor.age_status,
              visitor.gpc_effective, visitor.gpc_updated_at, purpose_category,
              existing ConsentRecord R for (visitor, purpose) if any.
      1. if age_status == CHILD and purpose_category != NECESSARY: BLOCKED_CHILD
      2. if purpose_category == NECESSARY: ALWAYS_GRANTED (no record stored)
      3. if purpose_category == SALE_SHARE and P.gpc_honored and gpc_effective == ON:
           if R exists and R.status == GRANTED and R.last_changed_at > gpc_updated_at:
             EXPLICIT_GRANT            # explicit consent given after the signal wins
           else: FORCED_OPT_OUT
      4. if R exists and R.status == GRANTED: EXPLICIT_GRANT
         if R exists and R.status == WITHDRAWN: EXPLICIT_WITHDRAWN
         (EXPIRED records fall through to regime default)
      5. regime default: OPT_IN_REQUIRED -> DENIED_BY_DEFAULT;
         OPT_OUT_ALLOWED -> GRANTED_BY_DEFAULT; NOTICE_ONLY -> GRANTED_BY_DEFAULT
    input_set: "single (visitor, purpose) pair; ACTIVE policy of the visitor's jurisdiction"
    variants:
      - name: explicit_after_gpc_wins
        when: "grant timestamp later than gpc_updated_at"
        difference: "step 3 takes the EXPLICIT_GRANT branch instead of FORCED_OPT_OUT"

  - name: retention_expiry_dual
    trigger: "transition into GRANTED (snapshot); policy retention_days amendment (rolling); every read (comparison)"
    algorithm: temporal_addition
    formula: |
      expires_at_pinned  = last_changed_at + policy_snapshot_retention_days (days)
      expires_at_rolling = last_changed_at + live policy.retention_days (days)
      EXPIRED transition fires when now >= expires_at_pinned (pinned is authoritative).
    input_set: "the ConsentRecord and the ACTIVE JurisdictionPolicy of its visitor's jurisdiction"
    precision: "second precision on datetimes; whole days added"
    variants:
      - name: pinned_at_grant
        when: "authoritative — drives EXPIRED"
        difference: "uses the retention snapshot frozen at the last transition into GRANTED; unaffected by later retention_days amendments"
      - name: rolling_policy
        when: "audit/read comparison only"
        difference: "uses the live policy retention_days; diverges from pinned after an amendment (e.g. 30d pinned vs 10d rolling)"

  - name: vendor_risk_scores
    trigger: "scan run completion; finding status change (remediate / confirm / close)"
    algorithm: weighted_scoring
    formula: |
      risk_score_strict   = 100 if exists TrackerFinding(vendor) with status == CONFIRMED_VIOLATION else 0
      risk_score_weighted = min(100, sum over TrackerFinding(vendor) with status in {OPEN, CONFIRMED_VIOLATION}
                                of severity_weight) ; HIGH = 50, MEDIUM = 25
      Findings in REMEDIATED or CLOSED contribute 0 to both scores.
    input_set: "all TrackerFindings whose vendor_id = vendor.id"
    constants:
      WEIGHT_HIGH: 50
      WEIGHT_MEDIUM: 25
      SCORE_CAP: 100
    variants:
      - name: any_violation_strict
        when: "binary compliance posture"
        difference: "single CONFIRMED_VIOLATION saturates the score at 100 regardless of other findings"
      - name: severity_weighted
        when: "graduated risk ranking"
        difference: "accumulates severity weights with cap 100; OPEN findings count here but not in strict"

  - name: sweep_penalty_exposure_cents
    trigger: "RegulatorySweep transitions to ESCALATED (manual or deadline)"
    algorithm: tiered_penalty
    formula: |
      findings = all TrackerFindings of the property with status == CONFIRMED_VIOLATION
                 at the moment of escalation (any scan; escalated_at is the clock time)
      per finding:
        days_open  = floor((escalated_at - finding.created_at) / 86400)
        raw_cents  = BASE[severity] * (1 + DAILY_RATE * min(days_open, DAY_CAP))
        per_finding_cents = round_half_up(raw_cents)          # ROUND FIRST ...
      penalty_exposure_cents = sum of per_finding_cents        # ... THEN SUM (pinned order;
                                                               #  sum-then-round is a different result)
    input_set: "TrackerFindings of the property in CONFIRMED_VIOLATION status at escalation"
    constants:
      HIGH_BASE_CENTS: 250000
      MEDIUM_BASE_CENTS: 77777
      DAILY_RATE: 0.05
      DAY_CAP: 30
    precision: "integer cents; round_half_up applied per finding before summation"

  - name: age_years_at_attestation
    trigger: "POST /v1/visitors/{id}/age-attestation"
    algorithm: threshold
    formula: |
      Requires ACTIVE policy P for visitor.jurisdiction_code (else ERR_NO_ACTIVE_POLICY).
      age_status = ADULT  iff attested_birthdate + P.min_consent_age years <= current clock date
                   CHILD  otherwise
      Boundary: a visitor whose min-age birthday is exactly today is ADULT (<=, not <).
    input_set: "visitor.attested_birthdate, ACTIVE policy.min_consent_age, current clock date"
    constants:
      ADULT_COMPARATOR: "<="   # exact birthday qualifies

  - name: propagation_counters
    trigger: "propagation creation; every VendorPropagation status change"
    algorithm: aggregation
    formula: |
      total_propagations = count(children)
      pending_count      = count(children with status PENDING)
      confirmed_count    = count(children with status CONFIRMED)
      failed_count       = count(children with status FAILED)
      INVARIANT: pending_count + confirmed_count + failed_count == total_propagations
      propagation_status: PROPAGATING while pending_count > 0;
        ALL_CONFIRMED when pending == 0 and failed == 0; PARTIAL_FAILURE when pending == 0 and failed > 0
    input_set: "VendorPropagation children of the request"

  - name: granted_purpose_count_sync
    trigger: "ConsentRecord transitions into/out of GRANTED (grant, withdraw, regrant, expiry, GPC cascade)"
    algorithm: aggregation
    formula: |
      Property.granted_purpose_count = count of ConsentRecords with status == GRANTED
        over all VisitorProfiles of the property.
      INVARIANT: the stored counter always equals that count; a grant+withdraw pair nets to 0.
    input_set: "all ConsentRecords joined through VisitorProfile.property_id"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized (POST /v1/visitors accepts role Anonymous)"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints
  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints
  - priority: 2.5
    category: auth
    check: "When role is Visitor, X-User-ID must equal the target visitor id (consent/gpc/attestation/do-not-sell endpoints)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "visitor-scoped mutation endpoints"
  - priority: 3
    category: existence
    check: "Path/body referenced resources exist, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: concurrency
    check: "expected_property_version equals current Property.version (publish only); checked before state and business rules"
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412
    applies_to: "POST /v1/banner-configs/{id}/publish"
  - priority: 5
    category: state
    check: "Property posture must be NORMAL — FROZEN blocks admin mutations and consent grant/regrant (never blocks withdraw, reads, DNS creation, sweep ops, scan ops)"
    error_id: ERR_PROPERTY_FROZEN
    http_status: 409
    applies_to: "policy PUT, banner-config create/publish/archive, vendor create/approve/suspend, tag-rule create/PUT, consent create/regrant"
  - priority: 6
    category: state
    check: "Entity-specific transition preconditions (from-state membership per state machine)"
    error_id: "ERR_POLICY_INVALID_TRANSITION / ERR_BANNER_CONFIG_NOT_PUBLISHABLE / ERR_VENDOR_INVALID_TRANSITION / ERR_TAG_RULE_INVALID_TRANSITION / ERR_CONSENT_INVALID_TRANSITION / ERR_DNS_INVALID_STATE / ERR_PROPAGATION_INVALID_STATE / ERR_SCAN_NOT_RUNNABLE / ERR_FINDING_INVALID_STATE / ERR_SWEEP_INVALID_STATE / ERR_SWEEP_DEADLINE_PASSED"
    http_status: 409
    applies_to: "all action/PUT transition endpoints"
  - priority: 7
    category: business_safety
    check: "Consent grant/regrant for a property whose jurisdiction policy has min_consent_age > 0 requires visitor.age_status != UNVERIFIED"
    error_id: ERR_AGE_UNVERIFIED
    http_status: 409
    applies_to: "consent create/regrant"
  - priority: 8
    category: business_safety
    check: "age_status == CHILD may only be granted NECESSARY purpose"
    error_id: ERR_CHILD_CONSENT_FORBIDDEN
    http_status: 403
    applies_to: "consent create/regrant"
  - priority: 9
    category: business_referential
    check: "ACTIVE JurisdictionPolicy must exist for the visitor's/config's jurisdiction_code"
    error_id: ERR_NO_ACTIVE_POLICY
    http_status: 409
    applies_to: "consent create/regrant, banner publish, age attestation"
  - priority: 10
    category: business_referential
    check: "TagRule vendor_id and banner_config_id must belong to the same property (derived property); cross-property FK references rejected"
    error_id: ERR_CROSS_PROPERTY_REFERENCE
    http_status: 409
    applies_to: "POST /v1/tag-rules"
  - priority: 10.5
    category: business_referential
    check: "TagRule vendor must be in APPROVED status (create and re-enable)"
    error_id: ERR_VENDOR_NOT_APPROVED
    http_status: 409
    applies_to: "POST /v1/tag-rules, PUT /v1/tag-rules/{id} {status: ENABLED}"
  - priority: 11
    category: business_temporal
    check: "Current clock must fall within the ACTIVE policy's [effective_from, effective_to) window"
    error_id: ERR_POLICY_OUTSIDE_COVERAGE_WINDOW
    http_status: 409
    applies_to: "consent create/regrant, banner publish"
  - priority: 12
    category: business_temporal
    check: "Scan window expanded by SCAN_COOLDOWN_MINUTES (120) on both sides must not intersect any other scan's raw [scheduled_start, +duration) window of the same property; exact adjacency at the buffer edge is allowed"
    error_id: ERR_SCAN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /v1/tag-audit-scans"
  - priority: 13
    category: business_constraint
    check: "Activating a policy whose half-open window intersects another ACTIVE policy of the same (property, jurisdiction_code) is rejected; adjacency allowed"
    error_id: ERR_POLICY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "PUT /v1/jurisdiction-policies/{id} {status: ACTIVE}"
  - priority: 14
    category: business_constraint
    check: "TagRule unique per (banner_config_id, purpose_category)"
    error_id: ERR_DUPLICATE_TAG_RULE
    http_status: 409
    applies_to: "POST /v1/tag-rules"
  - priority: 15
    category: business_constraint
    check: "ConsentRecord unique per (visitor_id, purpose_category) while existing record is GRANTED or WITHDRAWN; EXPIRED records allow fresh creation"
    error_id: ERR_DUPLICATE_CONSENT_PURPOSE
    http_status: 409
    applies_to: "POST /v1/visitors/{id}/consent-records"
  - priority: 16
    category: business_constraint
    check: "Do-not-sell requests only applicable when property.sale_share_designation != NO_SALE_NO_SHARE"
    error_id: ERR_DNS_NOT_APPLICABLE
    http_status: 409
    applies_to: "POST /v1/visitors/{id}/do-not-sell-requests"
  - priority: 17
    category: business_safety
    check: "TrackerFinding CONFIRMED_VIOLATION requires X-User-ID different from the scan's created_by_user_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "PUT /v1/tracker-findings/{id} {status: CONFIRMED_VIOLATION}"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Properties & clock ---
  - { method: POST, path: "/v1/properties", description: "Create a property", roles: [PrivacyAdmin], code: 201, input: [name, sale_share_designation], output: Property, side_effects: ["posture NORMAL, granted_purpose_count 0"] }
  - { method: GET, path: "/v1/properties", description: "List properties (paginated)", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "Property[]", side_effects: [] }
  - { method: GET, path: "/v1/properties/{id}", description: "Get a property (evaluates lazy posture/expiry effects)", roles: [Any], code: 200, input: [], output: Property, side_effects: ["lazy sweep deadline escalation may flip posture"] }
  - { method: POST, path: "/v1/_clock/set_current_utc", description: "Set logical clock; startup default is 2026-05-01T00:00:00Z and the clock never falls back to wall-clock", roles: [PrivacyAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["lazy expiry/escalation evaluation at the new time"] }

  # --- Jurisdiction policies ---
  - { method: POST, path: "/v1/jurisdiction-policies", description: "Create a jurisdiction policy (DRAFT)", roles: [PrivacyAdmin], code: 201, input: [property_id, jurisdiction_code, banner_regime, min_consent_age, retention_days, gpc_honored, effective_from, "effective_to?"], output: JurisdictionPolicy, side_effects: [] }
  - { method: GET, path: "/v1/jurisdiction-policies", description: "List policies, filterable", roles: [Any], code: 200, input: ["property_id?", "status?", "limit?", "offset?"], output: "JurisdictionPolicy[]", side_effects: [] }
  - { method: GET, path: "/v1/jurisdiction-policies/{id}", description: "Get a policy", roles: [Any], code: 200, input: [], output: JurisdictionPolicy, side_effects: [] }
  - { method: PUT, path: "/v1/jurisdiction-policies/{id}", description: "Transition status (ACTIVE/RETIRED) or amend retention_days", roles: [PrivacyAdmin], code: 200, input: ["status?", "retention_days?"], output: JurisdictionPolicy, side_effects: ["overlap check on activation; rolling expiries change on retention amendment"] }

  # --- Banner configs ---
  - { method: POST, path: "/v1/banner-configs", description: "Create banner config (DRAFT)", roles: [PrivacyAdmin], code: 201, input: [property_id, jurisdiction_code, categories_shown, config_label], output: ConsentBannerConfig, side_effects: [] }
  - { method: GET, path: "/v1/banner-configs", description: "List banner configs", roles: [Any], code: 200, input: ["property_id?", "jurisdiction_code?", "status?", "limit?", "offset?"], output: "ConsentBannerConfig[]", side_effects: [] }
  - { method: GET, path: "/v1/banner-configs/{id}", description: "Get a banner config", roles: [Any], code: 200, input: [], output: ConsentBannerConfig, side_effects: [] }
  - { method: POST, path: "/v1/banner-configs/{id}/publish", description: "Publish config (OCC on Property.version); supersedes current PUBLISHED config of same (property, jurisdiction)", roles: [PrivacyAdmin], code: 200, input: [expected_property_version], output: ConsentBannerConfig, side_effects: ["old PUBLISHED -> SUPERSEDED + its ENABLED TagRules -> DISABLED", "increments Property.version by 1", "published_at = now"] }
  - { method: POST, path: "/v1/banner-configs/{id}/archive", description: "Archive a DRAFT config", roles: [PrivacyAdmin], code: 200, input: [], output: ConsentBannerConfig, side_effects: [] }

  # --- Vendors ---
  - { method: POST, path: "/v1/vendors", description: "Register a vendor (PENDING_REVIEW)", roles: [VendorManager], code: 201, input: [property_id, legal_name, declared_purposes, tracker_signatures], output: Vendor, side_effects: [] }
  - { method: GET, path: "/v1/vendors", description: "List vendors", roles: [Any], code: 200, input: ["property_id?", "status?", "limit?", "offset?"], output: "Vendor[]", side_effects: [] }
  - { method: GET, path: "/v1/vendors/{id}", description: "Get a vendor (with both risk scores)", roles: [Any], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: POST, path: "/v1/vendors/{id}/approve", description: "Approve a vendor", roles: [PrivacyAdmin], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: POST, path: "/v1/vendors/{id}/suspend", description: "Suspend a vendor; cascades ENABLED tag rules to DISABLED", roles: [PrivacyAdmin], code: 200, input: [], output: Vendor, side_effects: ["vendor's ENABLED TagRules -> DISABLED"] }

  # --- Tag rules ---
  - { method: POST, path: "/v1/tag-rules", description: "Create a tag rule binding vendor+purpose to a banner config (starts ENABLED)", roles: [VendorManager], code: 201, input: [vendor_id, banner_config_id, purpose_category], output: TagRule, side_effects: ["property_id derived from banner config"] }
  - { method: GET, path: "/v1/tag-rules", description: "List tag rules", roles: [Any], code: 200, input: ["property_id?", "vendor_id?", "banner_config_id?", "status?", "limit?", "offset?"], output: "TagRule[]", side_effects: [] }
  - { method: GET, path: "/v1/tag-rules/{id}", description: "Get a tag rule", roles: [Any], code: 200, input: [], output: TagRule, side_effects: [] }
  - { method: PUT, path: "/v1/tag-rules/{id}", description: "Transition tag rule status ENABLED/DISABLED/RETIRED", roles: [VendorManager], code: 200, input: [status], output: TagRule, side_effects: ["enable requires vendor APPROVED"] }

  # --- Visitors ---
  - { method: POST, path: "/v1/visitors", description: "Register a visitor profile", roles: [Anonymous], code: 201, input: [property_id, external_ref, jurisdiction_code, "attested_birthdate?"], output: VisitorProfile, side_effects: ["age_status UNVERIFIED, gpc_effective UNSET"] }
  - { method: GET, path: "/v1/visitors", description: "List visitors", roles: [Any], code: 200, input: ["property_id?", "limit?", "offset?"], output: "VisitorProfile[]", side_effects: [] }
  - { method: GET, path: "/v1/visitors/{id}", description: "Get a visitor", roles: [Any], code: 200, input: [], output: VisitorProfile, side_effects: [] }
  - { method: POST, path: "/v1/visitors/{id}/age-attestation", description: "Attest birthdate; computes age_status against ACTIVE policy min_consent_age (boundary: exact birthday is ADULT)", roles: [Visitor], code: 200, input: [attested_birthdate], output: VisitorProfile, side_effects: ["age_status recomputed"] }
  - { method: POST, path: "/v1/visitors/{id}/gpc-signals", description: "Record a GPC signal event; ON with gpc_honored policy cascades SALE_SHARE withdrawals", roles: [Visitor], code: 201, input: [signal], output: GpcSignalEvent, side_effects: ["visitor.gpc_effective/gpc_updated_at set", "if ON and ACTIVE policy.gpc_honored: sale_share_opted_out=true, GRANTED SALE_SHARE records -> WITHDRAWN (AUTO_GPC_WITHDRAW), granted_purpose_count sync; OFF clears sale_share_opted_out (no re-grant)"] }
  - { method: GET, path: "/v1/visitors/{id}/gpc-signals", description: "List GPC signal events of a visitor", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "GpcSignalEvent[]", side_effects: [] }

  # --- Consent records ---
  - { method: GET, path: "/v1/visitors/{id}/consent-preview", description: "Computed read: effective_consent_resolution decision for (visitor, purpose_category) without persisting anything", roles: [Any], code: 200, input: [purpose_category], output: "{ decision: string }", side_effects: [] }
  - { method: POST, path: "/v1/visitors/{id}/consent-records", description: "Grant consent for a purpose (creates GRANTED record with policy snapshot)", roles: [Visitor], code: 201, input: [purpose_category], output: ConsentRecord, side_effects: ["snapshots retention + published banner config", "granted_purpose_count += 1", "increments Property.version by 1"] }
  - { method: GET, path: "/v1/consent-records", description: "List consent records across a property (retention proof / audit export)", roles: [Any], code: 200, input: ["property_id?", "status?", "purpose_category?", "limit?", "offset?"], output: "ConsentRecord[]", side_effects: ["lazy EXPIRED evaluation"] }
  - { method: GET, path: "/v1/visitors/{id}/consent-records", description: "List consent records of a visitor", roles: [Any], code: 200, input: ["status?", "purpose_category?", "limit?", "offset?"], output: "ConsentRecord[]", side_effects: [] }
  - { method: GET, path: "/v1/consent-records/{id}", description: "Get a consent record (lazy EXPIRED evaluation)", roles: [Any], code: 200, input: [], output: ConsentRecord, side_effects: ["may transition to EXPIRED"] }
  - { method: POST, path: "/v1/consent-records/{id}/withdraw", description: "Withdraw consent (allowed even when FROZEN)", roles: [Visitor], code: 200, input: [], output: ConsentRecord, side_effects: ["granted_purpose_count -= 1", "increments Property.version by 1"] }
  - { method: POST, path: "/v1/consent-records/{id}/regrant", description: "Re-grant a WITHDRAWN record (refreshes policy snapshot)", roles: [Visitor], code: 200, input: [], output: ConsentRecord, side_effects: ["granted_purpose_count += 1", "increments Property.version by 1"] }

  # --- Do-not-sell ---
  - { method: POST, path: "/v1/visitors/{id}/do-not-sell-requests", description: "Submit a do-not-sell/share request", roles: [Visitor], code: 201, input: ["scope_categories?"], output: DoNotSellRequest, side_effects: ["verification UNVERIFIED, propagation NOT_STARTED"] }
  - { method: GET, path: "/v1/visitors/{id}/do-not-sell-requests", description: "List a visitor's do-not-sell requests", roles: [Any], code: 200, input: ["limit?", "offset?"], output: "DoNotSellRequest[]", side_effects: [] }
  - { method: GET, path: "/v1/do-not-sell-requests", description: "List do-not-sell requests across a property (compliance queue)", roles: [Any], code: 200, input: ["property_id?", "verification_status?", "propagation_status?", "limit?", "offset?"], output: "DoNotSellRequest[]", side_effects: [] }
  - { method: GET, path: "/v1/do-not-sell-requests/{id}", description: "Get a request with counters", roles: [Any], code: 200, input: [], output: DoNotSellRequest, side_effects: [] }
  - { method: PUT, path: "/v1/do-not-sell-requests/{id}", description: "Verify or reject a request", roles: [PrivacyAdmin], code: 200, input: [verification_status], output: DoNotSellRequest, side_effects: [] }
  - { method: POST, path: "/v1/do-not-sell-requests/{id}/propagate", description: "Dispatch opt-out propagations to in-scope APPROVED vendors", roles: [PrivacyAdmin], code: 200, input: [], output: DoNotSellRequest, side_effects: ["creates VendorPropagation children (PENDING)", "propagation_status -> PROPAGATING (or ALL_CONFIRMED when empty pool)"] }
  - { method: GET, path: "/v1/do-not-sell-requests/{id}/propagations", description: "List propagations of a request", roles: [Any], code: 200, input: ["status?", "limit?", "offset?"], output: "VendorPropagation[]", side_effects: [] }
  - { method: GET, path: "/v1/vendor-propagations", description: "List propagations across requests (vendor filter)", roles: [Any], code: 200, input: ["vendor_id?", "status?", "limit?", "offset?"], output: "VendorPropagation[]", side_effects: [] }
  - { method: GET, path: "/v1/vendor-propagations/{id}", description: "Get a propagation", roles: [Any], code: 200, input: [], output: VendorPropagation, side_effects: [] }
  - { method: PUT, path: "/v1/vendor-propagations/{id}", description: "Confirm / fail / retry (PENDING->CONFIRMED|FAILED, FAILED->PENDING)", roles: [VendorManager], code: 200, input: [status], output: VendorPropagation, side_effects: ["request counters + propagation_status recomputed", "retry increments attempts"] }

  # --- Tag audit scans & findings ---
  - { method: POST, path: "/v1/tag-audit-scans", description: "Schedule a tag audit scan (cooldown-buffered overlap check)", roles: [ComplianceAuditor], code: 201, input: [property_id, scheduled_start, duration_minutes], output: TagAuditScan, side_effects: [] }
  - { method: GET, path: "/v1/tag-audit-scans", description: "List scans", roles: [Any], code: 200, input: ["property_id?", "status?", "limit?", "offset?"], output: "TagAuditScan[]", side_effects: [] }
  - { method: GET, path: "/v1/tag-audit-scans/{id}", description: "Get a scan", roles: [Any], code: 200, input: [], output: TagAuditScan, side_effects: [] }
  - { method: POST, path: "/v1/tag-audit-scans/{id}/run", description: "Run a scan with observed trackers; creates TrackerFindings", roles: [ComplianceAuditor], code: 200, input: [observed_trackers], output: TagAuditScan, side_effects: ["detection per observed tracker (dedup by signature)", "vendor risk scores recomputed"] }
  - { method: GET, path: "/v1/tag-audit-scans/{id}/findings", description: "List findings of a scan", roles: [Any], code: 200, input: ["status?", "limit?", "offset?"], output: "TrackerFinding[]", side_effects: [] }
  - { method: GET, path: "/v1/vendors/{id}/tracker-findings", description: "List findings attributed to a vendor", roles: [Any], code: 200, input: ["status?", "limit?", "offset?"], output: "TrackerFinding[]", side_effects: [] }
  - { method: PUT, path: "/v1/tracker-findings/{id}", description: "Remediate (VendorManager) or confirm-violation / close (ComplianceAuditor; confirm enforces SoD)", roles: [VendorManager, ComplianceAuditor], code: 200, input: [status], output: TrackerFinding, side_effects: ["vendor risk scores recomputed"] }

  # --- Regulatory sweeps ---
  - { method: POST, path: "/v1/regulatory-sweeps", description: "Open a regulatory sweep", roles: [ComplianceAuditor], code: 201, input: [property_id, regulator_ref, jurisdiction_code, deadline_days], output: RegulatorySweep, side_effects: ["response_due_at = created_at + deadline_days"] }
  - { method: GET, path: "/v1/regulatory-sweeps", description: "List sweeps", roles: [Any], code: 200, input: ["property_id?", "status?", "limit?", "offset?"], output: "RegulatorySweep[]", side_effects: [] }
  - { method: GET, path: "/v1/regulatory-sweeps/{id}", description: "Get a sweep (lazy deadline escalation)", roles: [Any], code: 200, input: [], output: RegulatorySweep, side_effects: ["may auto-escalate past deadline"] }
  - { method: POST, path: "/v1/regulatory-sweeps/{id}/begin-evidence-collection", description: "OPEN -> EVIDENCE_COLLECTION", roles: [ComplianceAuditor], code: 200, input: [], output: RegulatorySweep, side_effects: [] }
  - { method: POST, path: "/v1/regulatory-sweeps/{id}/respond", description: "Respond before the deadline; a late respond auto-escalates the sweep and fails", roles: [PrivacyAdmin], code: 200, input: [], output: RegulatorySweep, side_effects: ["status -> RESPONDED when on time"] }
  - { method: POST, path: "/v1/regulatory-sweeps/{id}/escalate", description: "Manually escalate; freezes property and cascades config suppression + tag-rule disable", roles: [ComplianceAuditor], code: 200, input: [], output: RegulatorySweep, side_effects: ["posture FROZEN", "PUBLISHED configs -> SUPPRESSED", "their ENABLED TagRules -> DISABLED", "penalty_exposure_cents computed"] }
  - { method: POST, path: "/v1/regulatory-sweeps/{id}/close", description: "Close a RESPONDED or ESCALATED sweep; unfreezes property when it is the last ESCALATED sweep", roles: [PrivacyAdmin], code: 200, input: [], output: RegulatorySweep, side_effects: ["posture recompute"] }

