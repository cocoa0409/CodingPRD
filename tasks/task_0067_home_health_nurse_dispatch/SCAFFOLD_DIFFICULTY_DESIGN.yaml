          - state_machines.Episode.ACTIVE_to_DISCHARGED
          - calculations.final_pdgm_settlement
          - entities.PaymentLedger.fields.net_settlement
          - entities.Patient.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from finalize: finalize computes final_pdgm_settlement (hop 1) which creates a
          PaymentLedger row (hop 2) whose creation drives the Patient to DISCHARGED when no other open episode
          exists (hop 3) — each hop caused by the prior, not by finalize directly.
        test_recipe:
          setup:
            - "Clock 2026-02-01; MMTA_OTHER config active (lupa_threshold 1)."
            - "Episode ACTIVE for a patient with no other episode; 1 RN visit COMPLETED."
