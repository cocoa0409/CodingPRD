        distinguishing_aspect: "Two DRAFT reports on the same affiliate may not cover overlapping half-open periods — a second DRAFT overlapping the first by one second is 409 ERR_REPORT_PERIOD_OVERLAP; a back-to-back period (start == prior end) is allowed."
