            - "estimate_finishing_cents == 28472 (210900 * 0.135 == 28471.5, round_half_up)"
            - "${tot} == 447810, NOT 447809 - a sum-then-round implementation is off by exactly one cent"
            - "${tot} == estimate_labor_cents + estimate_material_cents + estimate_finishing_cents"

      - name: three_enum_cross_product_selects_three_independent_constant_maps
        grounds:
          - calculations.fabrication_cost_estimate
          - entities.ShopDrawing.fields.complexity_tier
          - entities.ShopDrawing.fields.finish_grade
          - entities.MaterialSpec.fields.used_in
        distinguishing_aspect: |
          Unlike the rounding-order instance, this one holds hours and area fixed
          and varies exactly one enum at a time across four drawings, proving the
          formula indexes SHOP_RATE_CENTS_PER_HOUR by ShopDrawing.complexity_tier,
          MATERIAL_RATE_CENTS_PER_M2 by the referenced MaterialSpec.used_in (a
          constant selected from a DIFFERENT entity), and FINISH_PCT by
