              as: RegistrarOfficer
              captures: { cyc: $.data.id, cyc_v: $.data.version }
            - call: "POST /ir/reporting-cycles/${cyc}/frozen-files"
              payload: { domain: "ENROLLMENT", record_count: 1000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-10-15", checksum: "c1d2e3f4a5b60113", expected_cycle_version: "${cyc_v}" }
              as: RegistrarOfficer
              captures: { ff_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: RegistrarOfficer
            - call: "POST /ir/reporting-cycles/${cyc}/census-lock"
              payload: {}
              as: RegistrarOfficer
          trigger:
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "00000000-0000-4000-8000-000000000000", frozen_file_id: "${ff_a}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { err1: $.data.error_id }
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff_b}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { err2: $.data.error_id }
            - call: "POST /ir/survey-components"
              payload: { cycle_id: "${cyc}", frozen_file_id: "${ff_a}", component_code: "ENROLLMENT" }
              as: IRAnalyst
              captures: { comp: $.data.id }
          assert:
            - "Unknown cycle_id: HTTP status == 404 and response.error_id == \"ERR_CYCLE_NOT_FOUND\""
            - "Cross-cycle frozen_file_id: HTTP status == 404 and response.error_id == \"ERR_FROZEN_FILE_NOT_FOUND\""
            - "Third call: HTTP status == 201 and SurveyComponent.${comp}.frozen_file_id == ${ff_a}"
            - "SurveyComponent.${comp}.cycle_id == ${cyc} and prep_status == DRAFT and edit_status == NOT_RUN"
            - "GET /ir/survey-components?cycle_id=${cyc} -> total_count == 1"

      - name: corner_element_mapping_is_the_graph_junction_of_cycle_and_definition
        claim_type: Parent Relationships
        grounds:
          - entities.DataElementMapping.fields.cycle_id
          - entities.DataElementMapping.fields.definition_id
          - entities.DataElementMapping.fields.local_system_code
          - errors[ERR_DUPLICATE_MAPPING]
          - validations[priority=27]
        distinguishing_aspect: |
          DataElementMapping is a parentless junction whose uniqueness key is the triple
          (cycle_id, definition_id, local_system_code): two mappings of the same definition in
          the same cycle coexist when they come from SIS and HR, while repeating SIS on that
          pair is ERR_DUPLICATE_MAPPING, and the same definition remains mappable in another cycle.
        test_recipe:
          setup:
            - "Definition ENR_LEVEL (effective_cycle_code IPEDS-2027, required false, value_domain UNDERGRAD/GRADUATE) exists; cycles IPEDS-2027 and IPEDS-2026 are both OPEN."
          setup_api_calls:
            - call: "POST /ir/federal-definitions"
              payload: { definition_code: "ENR_LEVEL", survey_component: "ENROLLMENT", value_domain: ["UNDERGRAD", "GRADUATE"], required: false, unit_of_measure: "code", effective_cycle_code: "IPEDS-2027" }
              as: DataSteward
              captures: { def1: $.data.id }
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2027", collection_year: 2027, census_date: "2026-10-15", collection_deadline: "2027-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc: $.data.id }
            - call: "POST /ir/reporting-cycles"
              payload: { cycle_code: "IPEDS-2026", collection_year: 2026, census_date: "2025-10-15", collection_deadline: "2026-02-15T23:59:59Z" }
              as: RegistrarOfficer
              captures: { cyc_b: $.data.id }
          trigger:
            - call: "POST /ir/element-mappings"
              payload: { cycle_id: "${cyc}", definition_id: "${def1}", local_system_code: "SIS", local_field_path: "sis.student.level", transform_expression: "upper(level_code)", value_map: { "UG": "UNDERGRAD", "GR": "GRADUATE" } }
              as: IRAnalyst
              captures: { map1: $.data.id }
            - call: "POST /ir/element-mappings"
              payload: { cycle_id: "${cyc}", definition_id: "${def1}", local_system_code: "HR", local_field_path: "hr.appointment.level", transform_expression: "upper(appt_level)", value_map: { "U": "UNDERGRAD" } }
              as: IRAnalyst
              captures: { map2: $.data.id }
            - call: "POST /ir/element-mappings"
              payload: { cycle_id: "${cyc}", definition_id: "${def1}", local_system_code: "SIS", local_field_path: "sis.student.level_v2", transform_expression: "upper(level_code)", value_map: { "UG": "UNDERGRAD" } }
              as: IRAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /ir/element-mappings"
              payload: { cycle_id: "${cyc_b}", definition_id: "${def1}", local_system_code: "SIS", local_field_path: "sis.student.level", transform_expression: "upper(level_code)", value_map: { "UG": "UNDERGRAD" } }
              as: IRAnalyst
              captures: { map3: $.data.id }
          assert:
            - "DataElementMapping.${map1}.status == PROPOSED and revision_round == 0 and version == 1"
            - "DataElementMapping.${map2}.status == PROPOSED (different local_system_code on the same pair is accepted)"
            - "Third call: HTTP status == 409 and response.error_id == \"ERR_DUPLICATE_MAPPING\""
            - "DataElementMapping.${map3}.cycle_id == ${cyc_b} (the same definition is mappable in another cycle)"
            - "GET /ir/element-mappings?definition_id=${def1} -> total_count == 3"
            - "GET /ir/element-mappings?cycle_id=${cyc} -> total_count == 2"

      - name: corner_self_referential_supersedes_chain_on_frozen_files
        claim_type: Parent Relationships
        excluded_because:
          difficulty_instance: prepare_refused_when_referenced_census_extract_is_superseded
          rationale: |
            The self-referential FrozenFile.supersedes_frozen_file_id edge — a re-registered
            identical (domain, coverage window) superseding its incumbent and pointing back at
            it — is exercised end to end by that §1.8 instance, which asserts ff1 SUPERSEDED,
            ff2 ACTIVE with supersedes_frozen_file_id == ff1, and the resulting prepare refusal.
            A second corner test on the same edge would only repeat those asserts.

  - section: state_machines
    instances:
      - name: corner_sm_newly_created_rows_start_in_their_declared_initial_state
        claim_type: Initial State
        grounds:
