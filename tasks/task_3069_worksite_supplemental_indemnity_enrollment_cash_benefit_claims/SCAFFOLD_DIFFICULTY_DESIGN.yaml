  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: policy_port_gated_on_employee_terminated
        grounds:
          - state_machines.Policy.ISSUED_to_PORTED
          - state_machines.Employee.ACTIVE_to_TERMINATED
          - errors[ERR_PORT_NOT_ELIGIBLE]
          - entities.Policy.fields.premium_mode
        distinguishing_aspect: |
          Entity pair Policy -> Employee: POST /policies/{id}/port is legal only
          when the linked Employee is TERMINATED; while the employee is ACTIVE the
          port is rejected with ERR_PORT_NOT_ELIGIBLE, and after termination the
          same call succeeds and forces premium_mode to POST_TAX.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group G13 ACTIVE (0/0.0, DAILY); counselor C13; campaign CAM13 OPEN 2026-09-01..2026-10-01 guaranteed_issue; series S13 ACTIVE with PUBLISHED schedule (event Q amount 1000, max 2, lifetime 100000; premium 2200; wellness 500/0; preexisting 0)."
            - "Employee E13 ACTIVE; Policy P13 ISSUED with premium_mode=PRE_TAX under CAM13."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "G13", group_code: "G13", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "DAILY" }, as: CarrierAdmin, captures: { g13: $.data.id } }
