      - name: piercer_id
        type: string
        source: input
        description: "FK -> Piercer.id; piercer who performed the service."
      - name: cartridge_lot_id
        type: string
        source: input
        description: "FK -> CartridgeLot.id; lot the single-use cartridge was drawn from, or null when the lot is chosen by selector policy `store_available_lot` at service start."
      - name: site_pierced
