  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_precondition_vs_grant_fiscal_capacity
        grounds:
          - validations[priority=4]
          - validations[priority=19]
          - errors.ERR_INVALID_STATE
          - errors.ERR_GRANT_EXHAUSTED
        distinguishing_aspect: |
          Pair (state, business_fiscal): settling an ALREADY-SETTLED budget
          line whose grant cannot afford anything trips both the priority-4
          state check and the priority-19 fiscal check; the scaffold pins the
          state error as the winner because 4 < 19.
        test_recipe:
          setup:
            - "Grant G3 amount_cents 1000; BudgetLine BL5 reservation 1000 (grant EXHAUSTED); BL5 already SETTLED at 1000."
          setup_api_calls:
            - call: "POST /archive/funding-grants"
              payload: { donor_name: "Rockefeller", amount_cents: 1000 }
              as: FinanceAdmin
              captures: { grant3: $.data.id }
            - call: "POST /archive/budget-lines"
              payload: { grant_id: "${grant3}", category: "BANDWIDTH", budget_reservation_cents: 1000 }
              as: FinanceAdmin
              captures: { bl5: $.data.id }
            - call: "GET /archive/funding-grants/${grant3}"
              payload: {}
              as: FinanceAdmin
              captures: { gv3: $.data.version }
            - call: "POST /archive/budget-lines/${bl5}/settle"
              payload: { actual_spend_cents: 1000, expected_grant_version: "${gv3}" }
              as: FinanceAdmin
            - call: "GET /archive/funding-grants/${grant3}"
              payload: {}
              as: FinanceAdmin
              captures: { gv4: $.data.version }
          trigger:
            - call: "POST /archive/budget-lines/${bl5}/settle"
              payload: { actual_spend_cents: 500, expected_grant_version: "${gv4}" }
              as: FinanceAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 409 and err_id == ERR_INVALID_STATE (state beats fiscal: the line is no longer OPEN)"
            - "err_id != ERR_GRANT_EXHAUSTED even though the grant remains at utilization == amount_cents"
            - "err_id != ERR_STALE_VERSION because the supplied expected_grant_version matches the current grant version"
