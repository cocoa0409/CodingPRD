            - "HTTP 404"
            - "data.error_id == \"ERR_MATCH_OFFER_NOT_FOUND\""
            - "GET /match-offers?status=OFFERED returns HTTP 200 with total_count == 0 in the same state, isolating path-lookup from filter semantics"
      - name: endpoint_engagements_list_negative_offset_rejected
        claim_type: standard_crud
        grounds: ["endpoints[GET /engagements]", "errors[ERR_INVALID_PAGINATION]", "validations[priority=18]"]
        distinguishing_aspect: "offset -1 is rejected with 400 ERR_INVALID_PAGINATION even when the underlying collection is empty, so pagination validation precedes result assembly and an empty result never masks a bad page request."
        test_recipe:
          setup: ["One partner and one cycle; no engagements exist."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
