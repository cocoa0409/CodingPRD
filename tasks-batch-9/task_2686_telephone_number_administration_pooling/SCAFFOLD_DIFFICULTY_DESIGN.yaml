  - rule_id: priority_pair_validation_conflict
    instances:
      - name: carrier_eligibility_beats_utilization_threshold_on_approval
        grounds:
          - validations[priority=13]
          - validations[priority=30]
          - errors.ERR_CARRIER_NOT_ELIGIBLE
          - errors.ERR_UTILIZATION_THRESHOLD_NOT_MET
        distinguishing_aspect: |
          The APPROVE call violates the business_safety eligibility rule at
          priority 13 and the business_fiscal utilization rule at priority 30
          at the same instant, and the response must be
          ERR_CARRIER_NOT_ELIGIBLE (422); reinstating the licence with the
          filing untouched then surfaces ERR_UTILIZATION_THRESHOLD_NOT_MET,
          proving the second violation was present all along and merely masked.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier A (OCN 1234) reached ELIGIBLE, then filed a 2026H1 utilization filing computing to 40.00, well under UTILIZATION_MIN_PCT_GROWTH."
            - "NPA 614 / rate center COLUMBUS with one POOL_AVAILABLE block 614-556-0."
            - "Carrier A has a PENDING_REVIEW GROWTH request for 1 block."
            - "Carrier A's licence is then SUSPENDED, so eligibility_status is SUSPENDED at review time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { carrier_a_id: $.data.id }
            - call: "POST /numbering/carriers/${carrier_a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: $.data.id }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 0, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${carrier_a_id}", rate_center_id: "${rc_id}", reporting_period: "2026H1", numbers_assigned: 2000, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 5, forecast_quarters: [1800, 1200, 900, 600] }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { filing_a_id: $.data.id }
            - call: "POST /numbering/utilization-filings/${filing_a_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { rc_v: $.data.version }
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${carrier_a_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 1, justification: "one growth block", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { req_id: $.data.id }
            - call: "POST /numbering/carriers/${carrier_a_id}/license-actions"
              payload: { action: "SUSPEND", reason: "state commission enforcement docket" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/allocation-requests/${req_id}/reviews"
              payload: { action: "APPROVE" }
              as: RegulatoryApprover
              as_user_id: "approver-1"
            - call: "POST /numbering/carriers/${carrier_a_id}/license-actions"
              payload: { action: "REINSTATE" }
