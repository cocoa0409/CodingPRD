      - name: role_check_beats_existence_check_returns_unauthorized
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Authorisation is decided before the resource is looked up: a load
          controller calling the admin-only grounding endpoint with an
          identifier that does not exist gets 403 ERR_UNAUTHORIZED, never a
          404, so the role boundary does not leak the existence of rows.
        test_recipe:
          setup:
            - "One airframe exists, but the request targets an unknown identifier."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
          trigger:
            - call: "POST /aircraft/00000000-0000-0000-0000-0000000000f1/ground"
              payload: {}
              as: LoadController
            - call: "POST /aircraft/00000000-0000-0000-0000-0000000000f1/ground"
              payload: {}
              as: LoadControlAdmin
          assert:
            - "first trigger: HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "second trigger: HTTP 404 with data.error_id == \"ERR_AIRCRAFT_NOT_FOUND\""
            - "Aircraft.${ac1}.status == \"IN_SERVICE\""

