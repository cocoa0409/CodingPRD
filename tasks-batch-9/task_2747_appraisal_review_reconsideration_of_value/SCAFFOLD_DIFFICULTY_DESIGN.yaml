      - name: value_of_record_restored_on_dispute_overturn
        grounds:
          - state_machines.DisputeCase.APPRAISER_RESPONDED_to_RESOLVED_OVERTURNED
          - state_machines.Appraisal.VALUE_REVISED_to_VALUE_REVISED
          - entities.ValueRevision.fields.is_compensating
          - calculations.ltv_and_decision_impact
          - calculations.appraiser_performance_score
          - endpoints.POST_dispute_cases_id_resolve
        distinguishing_aspect: |
          A different conserved quantity, pinned as an explicit formula:
            Appraisal.current_value_cents
              == Appraisal.reported_value_cents + sum(vr.delta_cents for vr in ValueRevision on it)
          The dispute overturn writes a COMPENSATING ValueRevision of exactly the negation of the
          field-review revision, so the sum of deltas returns to 0 and the value of record returns
          to the reported value -- while both revision rows survive and the LTV band walks back
          from NO_IMPACT to PRICING_ADJUSTMENT. Deliberately asymmetric: the compensating row is
          excluded from the performance numerator, so the appraiser's revision_rate_bps and
          panel_status do NOT compensate.
        test_recipe:
          setup:
            - "Clock at its default 2026-08-01T00:00:00Z."
            - "Same starting position as the LTV boundary instance: PURCHASE loan, contract 50000000, loan amount 40000000, HIGH tier, appraisal by A reporting 48000000 with 8 sections, 1 exhibit and three CLOSED comparables reconciling to exactly 48000000."
            - "The FIELD_REVIEW order is assigned to B for 45000 and completed at 50000000, writing revision 1: source_type FIELD_REVIEW, delta +2000000, is_compensating false. The loan is then at exactly 8000 bps / NO_IMPACT."
            - "That single non-compensating revision against A's single appraisal drives A's ROLLING_12M revision_rate_bps to 10000 and the score to 10000 - round_half_up(0.60 * 10000) = 4000, below SUSPENSION_THRESHOLD_BPS, so A is already SUSPENDED before the trigger."
            - "A dispute is opened against the appraisal on basis VALUE_OPINION over 2026-08-06T10:00:00Z - 11:00:00Z (0 overlapping slots, capacity 2), and the AMC responds with appraiser_position VALUE_AMENDED, moving it to APPRAISER_RESPONDED."
