          - validations[priority=4]
          - entities.WholesaleAccount.fields.status
        distinguishing_aspect: "DeliveryOrder PENDING->PACKED is blocked (ERR_ACCOUNT_SUSPENDED) because a different entity — its WholesaleAccount — is SUSPENDED; pair DeliveryOrder->WholesaleAccount."
        test_recipe:
          setup:
            - "Committed line par 10; one PENDING order qty 2; its account then SUSPENDED."
