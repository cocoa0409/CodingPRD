            - call: "POST /investigations/${i1_id}/close"
              payload: { closing_note: "Both allegations disposed." }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /complaints/${c_id}/purge"
              payload: { purge_reason: "Attempted purge while two appeals are still pending." }
              as: RecordsCustodian
              captures: { e_appeal_pending: "$.data.error_id" }
            - call: "POST /appeals/${ap_v_id}/hear"
              payload: { hearing_notes: "Arbitration heard." }
              as: AppealsOfficer
            - call: "POST /appeals/${ap_v_id}/decide"
              payload: { outcome: "MODIFIED", modified_days: 10 }
              as: AppealsOfficer
              captures: { e_modified: "$.data.error_id" }
            - call: "POST /appeals/${ap_v_id}/decide"
              payload: { outcome: "OVERTURNED" }
              as: AppealsOfficer
            - call: "GET /appeals/${ap_v_id}/reinstatements"
              payload: {}
              as: AppealsOfficer
              captures: { r_v_id: "$.data[0].id" }
            - call: "POST /reinstatements/${r_v_id}/finalize"
              payload: { interim_earnings_cents: -1 }
              as: AppealsOfficer
              captures: { e_earnings: "$.data.error_id" }
            - call: "POST /reinstatements/${r_v_id}/finalize"
              payload: { interim_earnings_cents: 0 }
              as: AppealsOfficer
            - call: "POST /reinstatements/${r_v_id}/finalize"
              payload: { interim_earnings_cents: 0 }
              as: AppealsOfficer
              captures: { e_refinalize: "$.data.error_id" }
            - call: "POST /appeals/${ap_z_id}/hear"
              payload: { hearing_notes: "Civil service hearing held." }
              as: AppealsOfficer
            - call: "POST /appeals/${ap_z_id}/decide"
              payload: { outcome: "OVERTURNED" }
              as: AppealsOfficer
            - call: "GET /appeals/${ap_z_id}/reinstatements"
              payload: {}
              as: AppealsOfficer
              captures: { r_z_id: "$.data[0].id" }
            - call: "POST /reinstatements/${r_z_id}/finalize"
              payload: { interim_earnings_cents: 0 }
              as: AppealsOfficer
              captures: { e_salary: "$.data.error_id" }
          assert:
            - "calls 1 and 2: HTTP 201 with both appeals in FILED, days_to_file == 0, and both disciplines moved to APPEALED"
            - "call 3: HTTP 409 with ${e_appeal_state} == ERR_APPEAL_STATE_INVALID because the appeal has not been heard yet"
            - "call 4: HTTP 200 with Investigation.${i1_id}.status == CLOSED and Complaint.${c_id}.status == CLOSED, which is what makes the purge attempt survive the priority-8 gate"
            - "call 5: HTTP 409 with ${e_appeal_pending} == ERR_APPEAL_PENDING, not ERR_CREDIBILITY_HOLD (no disclosure exists because neither allegation is UNTRUTHFULNESS) and not ERR_RETENTION_NOT_EXPIRED (priority 11 is below it); Complaint.${c_id}.purged_at is still null"
            - "call 7: HTTP 422 with ${e_modified} == ERR_MODIFIED_DAYS_INVALID because modified_days 10 is not strictly less than final_days 10; the appeal is still HEARD with outcome null"
            - "call 8: HTTP 200 with Appeal.${ap_v_id}.outcome == OVERTURNED, Discipline.${d_v_id}.status == OVERTURNED and effective_days == 0, Officer Vance imposed_suspension_days_total back to 0 and employment_status back to ACTIVE, and a Reinstatement in PENDING with reversed_days == 10"
            - "call 10: HTTP 422 with ${e_earnings} == ERR_INVALID_INTERIM_EARNINGS; the reinstatement is still PENDING with finalized_at null"
            - "call 11: HTTP 200 with Reinstatement.${r_v_id}.status == FINALIZED, net_back_pay_cents greater than 0 and total_award_cents == net_back_pay_cents plus interest_cents"
            - "call 12: HTTP 409 with ${e_refinalize} == ERR_REINSTATEMENT_ALREADY_FINALIZED and total_award_cents unchanged from call 11"
            - "call 16: HTTP 422 with ${e_salary} == ERR_SALARY_UNKNOWN because Officer Zane carries annual_salary_cents 0; the earnings check at the same priority passes first on the value 0, and Reinstatement.${r_z_id} stays PENDING"

      - name: alert_plan_and_checkin_guards_each_report_their_own_code
        claim_type: Error triggerable
        grounds:
          - errors.ERR_PLAN_EXISTS
          - errors.ERR_PLAN_STATE_INVALID
          - errors.ERR_CHECKIN_NOT_PENDING
          - errors.ERR_ALERT_ALREADY_OPEN
        distinguishing_aspect: |
          The intervention side has four guards that each need a different point of the
          PLAN_REQUIRED -> PLAN_ACTIVE -> ESCALATED cycle. ERR_PLAN_EXISTS needs an alert that is
          still dismissible by state but already carries a draft plan, so the priority-8 state rule
          passes and the priority-10 rule refuses. ERR_ALERT_ALREADY_OPEN only exists after a failed
          plan escalates the alert, and it is specific to a targeted rescore: the officer must be
          named in the request body for the rule to apply at all.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "Internal Affairs holds Commander Reyes; Patrol North holds Sergeant Doyle and Officer Vance (PATROL)."
            - "Vance carries the five-event fixture from the eis_composite_score examples: USE_OF_FORCE LEVEL_2 on 2026-06-01, LEVEL_1 on 2026-06-15, LEVEL_3 on 2026-07-01, PURSUIT NA on 2026-07-10 and PURSUIT NA on 2026-07-20, giving weighted_total 17.5 and a ROLLING_12M score of 63.75."
            - "The ingest that crossed the WATCH band opened the alert at 43.75, and ingest never refreshes an open alert, so the sweep is what promotes it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 16500000, demographic_code: "DG_A", hire_date: "2004-01-05T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-06-01T00:00:00Z" }
              as: SystemAdmin
              captures: { vance_id: $.data.id }
            - call: "POST /officers/${vance_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_2", occurred_at: "2026-06-01T00:00:00Z", source_reference: "UOF-1" }
              as: SystemAdmin
            - call: "POST /officers/${vance_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_1", occurred_at: "2026-06-15T00:00:00Z", source_reference: "UOF-2" }
              as: SystemAdmin
            - call: "POST /officers/${vance_id}/activity-events"
              payload: { event_type: "USE_OF_FORCE", severity_code: "LEVEL_3", occurred_at: "2026-07-01T00:00:00Z", source_reference: "UOF-3" }
              as: SystemAdmin
            - call: "POST /officers/${vance_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-10T00:00:00Z", source_reference: "PUR-1" }
              as: SystemAdmin
            - call: "POST /officers/${vance_id}/activity-events"
              payload: { event_type: "PURSUIT", severity_code: "NA", occurred_at: "2026-07-20T00:00:00Z", source_reference: "PUR-2" }
              as: SystemAdmin
          trigger:
            - call: "POST /eis-runs"
              payload: {}
              as: SystemAdmin
            - call: "GET /eis-alerts"
              payload: { officer_id: "${vance_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { al_id: "$.data[0].id", al_v: "$.data[0].version" }
            - call: "POST /eis-alerts/${al_id}/intervention-plans"
              payload: { expected_alert_version: "${al_v}", supervisor_officer_id: "${sup_id}", required_checkin_count: 2, duration_days: 30, interventions: ["PEER_MENTORING", "USE_OF_FORCE_REFRESHER"] }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /eis-alerts/${al_id}/dismiss"
              payload: { dismissal_reason: "Attempted dismissal although a draft plan is already attached." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { e_plan_exists: "$.data.error_id" }
            - call: "POST /intervention-plans/${p1_id}/close"
              payload: { closing_note: "Attempted close of a plan that has never been activated." }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { e_plan_state: "$.data.error_id" }
            - call: "POST /intervention-plans/${p1_id}/activate"
              payload: { activation_note: "Monitoring begins." }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "GET /intervention-plans/${p1_id}/check-ins"
              payload: {}
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { ck1_id: "$.data[0].id", ck2_id: "$.data[1].id" }
            - call: "POST /check-ins/${ck1_id}/complete"
              payload: { outcome: "CONCERN", notes: "Defensive about the pursuit review." }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /check-ins/${ck1_id}/complete"
              payload: { outcome: "SATISFACTORY", notes: "Second attempt on a completed check-in." }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { e_checkin_state: "$.data.error_id" }
            - call: "POST /check-ins/${ck2_id}/complete"
              payload: { outcome: "CONCERN", notes: "Still resistant to the refresher training." }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /intervention-plans/${p1_id}/close"
              payload: { closing_note: "Both check-ins done, both flagged as concerns." }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "POST /eis-runs"
              payload: { officer_id: "${vance_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { e_alert_open: "$.data.error_id" }
          assert:
            - "call 1: HTTP 200; the sweep refreshes the open alert to composite_score 63.75, alert_level ALERT, run_sequence 1 and promotes it from OPEN to PLAN_REQUIRED with review_due_at 2026-08-31T00:00:00Z"
            - "call 3: HTTP 201 with InterventionPlan.${p1_id}.status == DRAFT and the alert plan_count == 1 and version incremented"
            - "call 4: HTTP 409 with ${e_plan_exists} == ERR_PLAN_EXISTS; PLAN_REQUIRED is a legal from-state for dismiss, so only the priority-10 rule can refuse it, and the alert is still PLAN_REQUIRED with dismissal_reason null"
            - "call 5: HTTP 409 with ${e_plan_state} == ERR_PLAN_STATE_INVALID, not ERR_NOT_PLAN_SUPERVISOR, because Doyle is the plan's monitoring supervisor"
            - "call 6: HTTP 200 with plan status ACTIVE, activated_at 2026-08-01T00:00:00Z, end_date 2026-08-31T00:00:00Z, two PENDING check-ins due 2026-08-11T00:00:00Z and 2026-08-21T00:00:00Z, and the alert moved to PLAN_ACTIVE"
            - "call 8: HTTP 200 with check-in 1 COMPLETED, on_time true, plan completed_checkin_count 1, on_time_checkin_count 1 and concern_count 1"
            - "call 9: HTTP 409 with ${e_checkin_state} == ERR_CHECKIN_NOT_PENDING; completed_checkin_count stays 1 and concern_count stays 1, so the refused call double counted nothing"
            - "call 11: HTTP 200 with compliance_score 70.00 (100 * 2 / 2 minus 15 * 2), plan status ESCALATED, alert status ESCALATED, Officer Vance intervention_escalation_count 1 and eis_alert_level raised one band to CRITICAL"
            - "call 12: HTTP 409 with ${e_alert_open} == ERR_ALERT_ALREADY_OPEN because the named officer's alert is ESCALATED and awaits a replacement plan; the alert composite_score is unchanged at 63.75"

      - name: an_expunged_disclosure_can_no_longer_be_released
        claim_type: Error triggerable
        grounds:
          - errors.ERR_DISCLOSURE_NOT_ACTIVE
          - state_machines.CredibilityDisclosure
          - endpoints["POST /credibility-disclosures/{id}/release"]
        distinguishing_aspect: |
          ERR_DISCLOSURE_NOT_ACTIVE has no direct trigger: nothing in the API sets a disclosure to
          EXPUNGED, so the only route to the code is the overturn cascade, where the source
