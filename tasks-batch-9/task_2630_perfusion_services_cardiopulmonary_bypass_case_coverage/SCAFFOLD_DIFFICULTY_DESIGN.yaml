          Metric under test: pump minutes against prolonged_pump_threshold_minutes == 180, observed
          through final_fee_cents on POST /bypass-cases/{id}/close. 179 minutes buys zero surcharge
          units (400000 cents), 180 minutes — the threshold itself, reached by a non-strict
          comparison — buys the first unit (460000 cents), and 210 minutes buys two (520000 cents).
