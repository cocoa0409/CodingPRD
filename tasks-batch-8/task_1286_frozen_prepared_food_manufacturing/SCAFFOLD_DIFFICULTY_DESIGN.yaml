          - state_machines.ProductionBatch.FROZEN_to_ON_HOLD
          - state_machines.LineRun.SCHEDULED_to_CANCELLED
          - calculations.film_reservation
        distinguishing_aspect: |
          Depth-3 chain triggered by CCP check creation: CCPCheck(FAIL) mutates
          ProductionBatch (-> ON_HOLD); that hold itself cancels the batch's SCHEDULED
          LineRun; the run cancellation itself releases meters on FilmSupplyLot
          (meters_reserved 2671 -> 0, meters_available -> 10000).
