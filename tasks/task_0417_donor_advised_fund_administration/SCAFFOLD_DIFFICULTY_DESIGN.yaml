              as: DonorAdvisor
              as_user_id: "adv-11"
              captures: { buy_id: $.data.id }
            - call: "POST /daf/rebalance-orders/${buy_id}/execute"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-11"
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
