          trigger:
            - call: "POST /api/mediation-sessions"
              payload: { case_id: "${case_id}", mediator_user_id: "u-med", scheduled_start: "2026-07-01T11:00:00Z", scheduled_end: "2026-07-01T12:00:00Z" }
