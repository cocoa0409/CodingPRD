scenario: |
  Certified Contractor Program, Enhanced Warranty & Claim Adjudication (GAF): contractor certification tiers with training completion, licensing verification, insurance requirements and workmanship history, enhanced warranty registration requiring certified installation and a qualifying system of components, system component matching rules where mixing manufacturers voids extended coverage, warranty claim intake with photo evidence, core sample requests and independent inspection, defect versus installation error determination with contractor accountability and remedy allocation, prorated material coverage schedules with labor coverage periods differing by tier, distributor and contractor lead sharing with territory rules, certification suspension after complaint patterns

domain_name: certified-contractor-warranty
api_prefix: /program

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Contractor legal business name" }
      - { name: license_number, type: string, source: input, description: "State license number" }
      - { name: license_expiry, type: string, source: input, description: "License expiry date YYYY-MM-DD" }
      - { name: insurance_expiry, type: string, source: input, description: "Liability insurance expiry date YYYY-MM-DD" }
      - { name: territory_codes, type: array, source: input, description: "List of territory codes the contractor serves" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | REVOKED", constraints: "initially ACTIVE; SUSPENDED when complaint_score_24mo >= 5; REVOKED when lifetime_substantiated_count >= 8" }
      - { name: workmanship_score, type: integer, source: computed, default: 100, description: "Starts 100; -5 per substantiated complaint, -10 per INSTALLATION_ERROR adjudication, -4 per MIXED adjudication; floor 0; restored on claim reopen" }
      - { name: complaint_score_24mo, type: integer, source: computed, default: 0, description: "Weighted trailing-24-month substantiated-complaint score (see complaint_pattern_score)" }
      - { name: lifetime_substantiated_count, type: integer, source: computed, default: 0, description: "Count of all Complaint rows with status SUBSTANTIATED for this contractor, no time window" }
      - { name: outstanding_liability_cents, type: integer, source: computed, default: 0, description: "Sum of contractor_liability_cents over RemedyAllocation rows with status ACTIVE for claims on this contractor's registrations" }

  - name: TrainingCourse
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: credits, type: integer, source: input, description: "Training credits granted on completion" }
      - { name: validity_months, type: integer, source: input, description: "Months a completion stays creditable; credit counts when completed_at + validity_months >= evaluation date (inclusive boundary)" }

  - name: TrainingEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: course_id, type: string, source: input, description: "FK -> TrainingCourse.id" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "ENROLLED | COMPLETED" }
      - { name: completed_at, type: string, source: input, description: "Completion date YYYY-MM-DD, supplied on the complete call; required to transition ENROLLED -> COMPLETED" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: tier, type: enum, source: input, description: "BRONZE | SILVER | GOLD", constraints: "TIER_RANK: BRONZE=1, SILVER=2, GOLD=3" }
      - { name: status, type: enum, source: system, default: PENDING_VERIFICATION, description: "PENDING_VERIFICATION | ACTIVE | SUSPENDED | EXPIRED | DENIED | REVOKED" }
      - { name: valid_from, type: string, source: system, description: "Set on verify (clock date)" }
      - { name: valid_until, type: string, source: system, description: "valid_from + 24 months; renewed adds 24 months to prior valid_until" }

  - name: ComponentCatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Manufacturer SKU, unique across catalog", constraints: "unique" }
      - { name: component_type, type: enum, source: input, description: "SHINGLE | UNDERLAYMENT | STARTER | RIDGE_CAP | VENTILATION | OTHER" }
      - { name: manufacturer, type: enum, source: input, description: "GAF | OTHER" }

  - name: WarrantyRegistration
    parent: null
    common_fields: true
    fields:
      - { name: certification_id, type: string, source: input, description: "FK -> Certification.id" }
      - { name: homeowner_name, type: string, source: input, description: "Homeowner name" }
      - { name: property_postal_code, type: string, source: input, description: "Property postal code" }
      - { name: install_date, type: string, source: input, description: "Installation date YYYY-MM-DD; must be <= current clock date and <= certification valid_until" }
      - { name: activated_at, type: string, source: system, description: "Clock timestamp at activation; base date for proration" }
      - { name: coverage_tier, type: enum, source: system, description: "Snapshot of certification tier at activation (BRONZE | SILVER | GOLD)" }
      - { name: coverage_class, type: enum, source: computed, description: "QUALIFYING_SYSTEM when every required component type (SHINGLE, UNDERLAYMENT, STARTER, RIDGE_CAP) is present and every such component has manufacturer GAF; otherwise MIXED_MANUFACTURER; DRAFT until activation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | VOID" }

  - name: RegistrationComponent
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> WarrantyRegistration.id" }
      - { name: catalog_sku, type: string, source: input, description: "Must match an existing ComponentCatalogItem.sku", constraints: "existence-validated against ComponentCatalogItem.sku" }
      - { name: component_type, type: enum, source: computed, description: "Copied from the referenced ComponentCatalogItem at creation" }
      - { name: manufacturer, type: enum, source: computed, description: "Copied from the referenced ComponentCatalogItem at creation" }
      - { name: material_cost_cents, type: integer, source: input, description: "Installed material cost for this component line, in cents; >= 0" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> WarrantyRegistration.id" }
      - { name: description, type: string, source: input, description: "Free-text claim description" }
      - { name: claim_labor_cost_cents, type: integer, source: input, description: "Claimed labor cost in cents; >= 0" }
      - { name: evidence, type: array, source: input, description: "Append-only list of { evidence_type, note, submitted_at }; evidence_type in PHOTO | CORE_SAMPLE | DOCUMENT" }
      - { name: photo_count, type: integer, source: computed, default: 0, description: "Count of evidence items with evidence_type PHOTO" }
      - { name: determination, type: enum, source: input, description: "MANUFACTURER_DEFECT | INSTALLATION_ERROR | MIXED | NO_DEFECT; set by adjudicate" }
      - { name: filed_at, type: string, source: system, description: "Clock timestamp at intake" }
      - { name: filing_workmanship_score, type: integer, source: system, description: "Snapshot of contractor workmanship_score at intake; used for the liability factor so adjudication arithmetic does not depend on a score the adjudication itself mutates" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | EVIDENCE_REVIEW | INSPECTION_REQUESTED | INSPECTION_COMPLETED | RESOLVED | DENIED" }

  - name: InspectionOrder
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> WarrantyClaim.id" }
      - { name: inspector_id, type: string, source: input, description: "Opaque inspector identifier assigned at schedule time" }
      - { name: service_date, type: string, source: input, description: "Scheduled service date YYYY-MM-DD" }
      - { name: findings, type: string, source: input, description: "Inspector narrative, supplied on complete" }
      - { name: confirms_defect, type: boolean, source: input, description: "Inspector defect conclusion, supplied on complete" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | SCHEDULED | COMPLETED" }

  - name: RemedyAllocation
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> WarrantyClaim.id" }
      - { name: determination, type: enum, source: system, description: "Copied from claim determination at adjudication" }
      - { name: completed_years, type: integer, source: computed, description: "floor(days between registration activated_at and claim filed_at / 365)" }
      - { name: schedule_used, type: enum, source: computed, description: "STANDARD | ENHANCED | ENHANCED_PLUS; tier schedule unless registration coverage_class == MIXED_MANUFACTURER, in which case forced STANDARD" }
      - { name: material_pct, type: integer, source: computed, description: "Schedule percentage applied" }
      - { name: prorated_material_pool_cents, type: integer, source: computed, description: "Sum of per-line rounded prorated amounts (see prorated_material_coverage)" }
      - { name: material_covered_cents, type: integer, source: computed, description: "Manufacturer-paid material amount" }
      - { name: homeowner_material_share_cents, type: integer, source: computed, description: "Homeowner-paid material amount" }
      - { name: labor_covered_cents, type: integer, source: computed, description: "Manufacturer-paid labor amount" }
      - { name: contractor_liability_cents, type: integer, source: computed, description: "Contractor-owed amount" }
      - { name: workmanship_delta_applied, type: integer, source: system, description: "Score delta applied to contractor at adjudication (negative); refunded on reopen" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REVERSED" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: category, type: enum, source: input, description: "WORKMANSHIP | COMMUNICATION | PROPERTY_DAMAGE | CONTRACT_DISPUTE" }
      - { name: filed_at, type: string, source: system, description: "Clock timestamp at filing" }
      - { name: substantiated_at, type: string, source: system, description: "Clock timestamp at substantiation (null until substantiated)" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | SUBSTANTIATED | DISMISSED" }

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Distributor name" }
      - { name: territory_codes, type: array, source: input, description: "Territory codes this distributor covers" }
      - { name: lead_pool_total, type: integer, source: input, description: "Total lead slots granted to the distributor; >= 0" }
      - { name: lead_pool_available, type: integer, source: computed, description: "lead_pool_total minus count of LeadAssignment rows with status ASSIGNED for this distributor" }

  - name: LeadAssignment
    parent: null
    common_fields: true
    fields:
      - { name: distributor_id, type: string, source: input, description: "FK -> Distributor.id" }
      - { name: contractor_id, type: string, source: input, description: "FK -> Contractor.id" }
      - { name: territory_code, type: string, source: input, description: "Territory the lead covers; must be in both distributor and contractor territory_codes" }
      - { name: required_tier, type: enum, source: input, description: "BRONZE | SILVER | GOLD minimum certification tier for the lead" }
      - { name: start_date, type: string, source: input, description: "Window start YYYY-MM-DD (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Window end YYYY-MM-DD (exclusive); must be > start_date" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED | RETURNED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Contractor
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (recompute of complaint_pattern_score after a Complaint FILED->SUBSTANTIATED transition yields weighted score >= 5)"
        actor: system
        preconditions:
          - "complaint_pattern_score weighted_24mo variant >= 5"
        side_effects:
          - "every Certification of this contractor with status ACTIVE transitions to SUSPENDED (certification version incremented)"
          - "every LeadAssignment of this contractor with status ASSIGNED transitions to RETURNED and the owning Distributor.lead_pool_available is recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (POST /program/_clock/set_current_utc re-evaluates every SUSPENDED contractor whose lifetime_substantiated_count < 8; reinstates when weighted score recomputed at the new clock is < 5)"
        actor: system
        preconditions:
          - "recomputed complaint_pattern_score weighted_24mo variant < 5"
        side_effects:
          - "contractor status becomes ACTIVE; certifications previously suspended by complaint cascade remain SUSPENDED until individually reinstated"
      - from: ACTIVE
        to: REVOKED
        trigger: "system (a Complaint FILED->SUBSTANTIATED transition raises lifetime_substantiated_count to >= 8)"
        actor: system
        preconditions:
          - "lifetime_substantiated_count >= 8"
        side_effects:
          - "every Certification of this contractor with status ACTIVE or SUSPENDED transitions to REVOKED"
          - "every WarrantyRegistration reached through those certifications with status ACTIVE transitions to VOID"
          - "every LeadAssignment of this contractor with status ASSIGNED transitions to RETURNED and Distributor.lead_pool_available is recomputed"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (same lifetime_substantiated_count >= 8 rule)"
        actor: system
        preconditions:
          - "lifetime_substantiated_count >= 8"
        side_effects:
          - "same cascade as ACTIVE -> REVOKED"

  - entity: Certification
    initial_state: PENDING_VERIFICATION
    terminal_states: [DENIED, REVOKED, EXPIRED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /program/certifications/{id}/verify with decision APPROVE"
        actor: ProgramAdmin
        preconditions:
          - "contractor.status == ACTIVE (else ERR_CONTRACTOR_SUSPENDED)"
          - "contractor.insurance_expiry > current clock date (else ERR_INSURANCE_EXPIRED)"
          - "contractor.license_expiry > current clock date (else ERR_LICENSE_EXPIRED)"
          - "training_credit_total for the contractor at the current clock date >= tier minimum (BRONZE 4, SILVER 8, GOLD 12; else ERR_INSUFFICIENT_TRAINING_CREDITS)"
        side_effects:
          - "valid_from = current clock date; valid_until = valid_from + 24 months; certification.version incremented"
      - from: PENDING_VERIFICATION
        to: DENIED
        trigger: "POST /program/certifications/{id}/verify with decision DENY"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "certification.version incremented"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (contractor complaint cascade, or workmanship_score <= 60 after an adjudication)"
        actor: system
        preconditions: []
        side_effects:
          - "certification.version incremented"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /program/certifications/{id}/reinstate"
        actor: ProgramAdmin
        preconditions:
          - "contractor.status == ACTIVE (else ERR_CONTRACTOR_SUSPENDED)"
          - "contractor.insurance_expiry > current clock date (else ERR_INSURANCE_EXPIRED)"
        side_effects:
          - "certification.version incremented"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /program/certifications/{id}/renew"
        actor: Contractor
        preconditions:
          - "current clock date <= valid_until (renewal after expiry is impossible: the certification is EXPIRED)"
          - "contractor.status == ACTIVE (else ERR_CONTRACTOR_SUSPENDED)"
          - "contractor.insurance_expiry > current clock date (else ERR_INSURANCE_EXPIRED)"
          - "contractor.license_expiry > current clock date (else ERR_LICENSE_EXPIRED)"
          - "training_credit_total at the current clock date >= tier minimum (else ERR_INSUFFICIENT_TRAINING_CREDITS)"
          - "OCC: expected_certification_version == certification.version (else ERR_STALE_CERTIFICATION_VERSION 412)"
        side_effects:
          - "valid_until = prior valid_until + 24 months; certification.version incremented"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (lazy evaluation on any read of the certification and on POST /program/_clock/set_current_utc: current clock date > valid_until and no renewal occurred)"
        actor: system
        preconditions: []
        side_effects:
          - "certification.version incremented"
      - from: ACTIVE
        to: REVOKED
        trigger: "system (contractor revocation cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "certification.version incremented"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (contractor revocation cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "certification.version incremented"

  - entity: WarrantyRegistration
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /program/warranty-registrations/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "certification.status == ACTIVE (else ERR_CERTIFICATION_NOT_ACTIVE)"
          - "install_date <= current clock date (else ERR_INVALID_REQUEST)"
          - "install_date <= certification.valid_until (else ERR_CERTIFICATION_NOT_ACTIVE)"
          - "every required component type SHINGLE, UNDERLAYMENT, STARTER, RIDGE_CAP present exactly once (else ERR_MISSING_REQUIRED_COMPONENT)"
        side_effects:
          - "activated_at = current clock timestamp"
          - "coverage_tier = certification.tier snapshot"
          - "coverage_class computed: QUALIFYING_SYSTEM iff all required-type components have manufacturer GAF, else MIXED_MANUFACTURER"
      - from: ACTIVE
        to: VOID
        trigger: "system (contractor revocation cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED]
    transitions:
      - from: SUBMITTED
        to: EVIDENCE_REVIEW
        trigger: "system (POST /program/warranty-claims/{id}/evidence raises photo_count to >= 2)"
        actor: system
        preconditions:
          - "photo_count >= 2"
        side_effects:
          - "claim.version incremented"
      - from: EVIDENCE_REVIEW
        to: INSPECTION_REQUESTED
        trigger: "POST /program/warranty-claims/{id}/request-inspection (first call; repeat calls while in INSPECTION_REQUESTED create additional orders without changing claim state)"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "an InspectionOrder is created with status REQUESTED linked to this claim; claim.version incremented"
      - from: INSPECTION_REQUESTED
        to: INSPECTION_COMPLETED
        trigger: "system (every InspectionOrder of this claim has status COMPLETED)"
        actor: system
        preconditions:
          - "no linked InspectionOrder in status REQUESTED or SCHEDULED"
        side_effects:
          - "claim.version incremented"
      - from: EVIDENCE_REVIEW
        to: RESOLVED
        trigger: "POST /program/warranty-claims/{id}/adjudicate with determination != NO_DEFECT"
        actor: ProgramAdmin
        preconditions:
          - "photo_count >= 2 (else ERR_PHOTO_EVIDENCE_INSUFFICIENT)"
          - "no linked InspectionOrder in status REQUESTED or SCHEDULED (else ERR_INSPECTION_INCOMPLETE)"
          - "OCC: expected_claim_version == claim.version (else ERR_STALE_CLAIM_VERSION 412)"
        side_effects:
          - "RemedyAllocation created with status ACTIVE (see remedy_split)"
          - "contractor.outstanding_liability_cents += remedy.contractor_liability_cents"
          - "contractor.workmanship_score += delta (-10 INSTALLATION_ERROR, -4 MIXED, 0 MANUFACTURER_DEFECT); floor 0"
          - "if determination in {INSTALLATION_ERROR, MIXED} and resulting workmanship_score <= 60: every ACTIVE Certification of the contractor transitions to SUSPENDED"
          - "claim.version incremented"
      - from: INSPECTION_COMPLETED
        to: RESOLVED
        trigger: "POST /program/warranty-claims/{id}/adjudicate with determination != NO_DEFECT"
        actor: ProgramAdmin
        preconditions:
          - "same as EVIDENCE_REVIEW -> RESOLVED"
        side_effects:
          - "same as EVIDENCE_REVIEW -> RESOLVED"
      - from: EVIDENCE_REVIEW
        to: DENIED
        trigger: "POST /program/warranty-claims/{id}/adjudicate with determination NO_DEFECT"
        actor: ProgramAdmin
        preconditions:
          - "same adjudicate preconditions"
        side_effects:
          - "no RemedyAllocation is created; claim.version incremented"
      - from: INSPECTION_COMPLETED
        to: DENIED
        trigger: "POST /program/warranty-claims/{id}/adjudicate with determination NO_DEFECT"
        actor: ProgramAdmin
        preconditions:
          - "same adjudicate preconditions"
        side_effects:
          - "no RemedyAllocation is created; claim.version incremented"
      - from: RESOLVED
        to: EVIDENCE_REVIEW
        trigger: "POST /program/warranty-claims/{id}/reopen"
        actor: ProgramAdmin
        preconditions:
          - "claim has a RemedyAllocation with status ACTIVE"
        side_effects:
          - "RemedyAllocation status ACTIVE -> REVERSED"
          - "contractor.outstanding_liability_cents -= remedy.contractor_liability_cents"
          - "contractor.workmanship_score -= remedy.workmanship_delta_applied (refund), capped at 100"
          - "claim.version incremented"

  - entity: InspectionOrder
    initial_state: REQUESTED
    terminal_states: [COMPLETED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /program/inspection-orders/{id}/schedule"
        actor: ProgramAdmin
        preconditions:
          - "fewer than 3 InspectionOrders with the same inspector_id, same service_date, status SCHEDULED (else ERR_INSPECTOR_CAPACITY_EXCEEDED)"
        side_effects: []
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /program/inspection-orders/{id}/complete"
        actor: Inspector
        preconditions:
          - "X-User-ID == inspection_order.inspector_id (else ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "if all sibling InspectionOrders of the claim are COMPLETED, the claim transitions INSPECTION_REQUESTED -> INSPECTION_COMPLETED"

  - entity: Complaint
    initial_state: FILED
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: FILED
        to: SUBSTANTIATED
        trigger: "POST /program/complaints/{id}/substantiate"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "substantiated_at = current clock timestamp"
          - "contractor.workmanship_score -= 5 (floor 0)"
          - "contractor.lifetime_substantiated_count += 1"
          - "contractor.complaint_score_24mo recomputed via complaint_pattern_score weighted_24mo variant at current clock"
          - "if lifetime_substantiated_count >= 8: contractor -> REVOKED cascade"
          - "else if recomputed weighted score >= 5 and contractor.status == ACTIVE: contractor -> SUSPENDED cascade"
      - from: FILED
        to: DISMISSED
        trigger: "POST /program/complaints/{id}/dismiss"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  - entity: LeadAssignment
    initial_state: ASSIGNED
    terminal_states: [RETURNED]
    transitions:
      - from: ASSIGNED
        to: RETURNED
        trigger: "POST /program/lead-assignments/{id}/return OR system (contractor suspension/revocation cascade)"
        actor: Distributor
        preconditions: []
        side_effects:
          - "Distributor.lead_pool_available recomputed (increases by 1)"

# =============================================================================
# Concurrency Rules (OCC only; see §1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: claim-adjudicate-stale-version
    parent_entity: WarrantyClaim
    write_endpoint: "POST /program/warranty-claims/{id}/adjudicate"
    occ_field: "expected_claim_version"
    description: |
      Adjudicating a claim whose version has advanced since the client last
      observed it (for example because an evidence post or the auto-transition
      to EVIDENCE_REVIEW incremented it) is rejected with a stale-version
      error, so remedy allocation is never computed from an outdated claim.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
  - rule_id: certification-renew-stale-version
    parent_entity: Certification
    write_endpoint: "POST /program/certifications/{id}/renew"
    occ_field: "expected_certification_version"
    description: |
      Renewing a certification whose version has advanced since the client
      last observed it (for example because a complaint cascade suspended and
      a reinstate re-activated it) is rejected with a stale-version error.
    error_id: ERR_STALE_CERTIFICATION_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: prorated_material_coverage
    description: "Manufacturer material pool for a claim: per-line proration of installed material cost by schedule percentage, with per-line rounding BEFORE summation (pinned order; sum-then-round is a different, incorrect algorithm)."
    trigger: "claim adjudication with determination != NO_DEFECT (feeds remedy_split)"
    inputs: [registration.components, registration.activated_at, claim.filed_at, registration.coverage_tier, registration.coverage_class]
    algorithm: threshold
    formula: |
      completed_years = floor( (filed_at - activated_at).days / 365 )
      schedule = MIXED_MANUFACTURER ? STANDARD : TIER_SCHEDULE[coverage_tier]
      pct = schedule_pct(schedule, completed_years)   # integer percent
      prorated_material_pool_cents = SUM over components:
          round_half_up( line.material_cost_cents * pct / 100 )   # round per line, THEN sum
      material_pct = pct
    constants:
      SCHEDULE_STANDARD: "pct(y) = max(20, 100 - 10 * max(0, y - 1))"
      SCHEDULE_ENHANCED: "pct(y) = max(50, 100 - 5 * max(0, y - 5))"
      SCHEDULE_ENHANCED_PLUS: "pct(y) = max(80, 100 - 2 * max(0, y - 10))"
      TIER_SCHEDULE: "{ BRONZE: STANDARD, SILVER: ENHANCED, GOLD: ENHANCED_PLUS }"
    precision: "integer cents; per-line round_half_up to whole cents before summation"
    variants:
      - name: STANDARD
        when: "tier BRONZE, or coverage_class == MIXED_MANUFACTURER regardless of tier"
        difference: "steeper decay (10 points/year after year 1) and lower floor (20)"
      - name: ENHANCED
        when: "tier SILVER with QUALIFYING_SYSTEM"
        difference: "100% through year 5, then 5 points/year, floor 50"
      - name: ENHANCED_PLUS
        when: "tier GOLD with QUALIFYING_SYSTEM"
        difference: "100% through year 10, then 2 points/year, floor 80"

  - name: labor_coverage_amount
    description: "Manufacturer labor contribution; nested min/cap with a strict year gate and determination share."
    trigger: "claim adjudication with determination != NO_DEFECT (feeds remedy_split)"
    inputs: [claim.claim_labor_cost_cents, completed_years, coverage_tier, coverage_class, determination]
    algorithm: tiered_pricing
    formula: |
      share = DETERMINATION_SHARE[determination]          # DEFECT 1.0, MIXED 0.5, INSTALLATION_ERROR 0.0
      if coverage_class == MIXED_MANUFACTURER: labor_covered_cents = 0
      elif completed_years >= TIER_RULES[coverage_tier].labor_years: labor_covered_cents = 0   # gate is strict: AT the boundary year coverage is already gone
      else: labor_covered_cents = round_half_up( share * min(claim_labor_cost_cents, TIER_RULES[coverage_tier].labor_cap_cents) )
    constants:
      DETERMINATION_SHARE: "{ MANUFACTURER_DEFECT: 1.0, MIXED: 0.5, INSTALLATION_ERROR: 0.0 }"
      TIER_RULES: "{ BRONZE: { labor_years: 2, labor_cap_cents: 200000 }, SILVER: { labor_years: 5, labor_cap_cents: 500000 }, GOLD: { labor_years: 10, labor_cap_cents: 1000000 } }"
    precision: "integer cents, round_half_up"
    variants: []

  - name: remedy_split
    description: "Full remedy allocation with a pinned evaluation order so the circular-looking dependency (adjudication mutates workmanship_score, workmanship factor feeds liability) is well-defined: the factor uses filing_workmanship_score snapshotted at intake."
    trigger: "claim adjudication with determination != NO_DEFECT"
    inputs: [prorated_material_coverage, labor_coverage_amount, claim.filing_workmanship_score, components material_cost_cents sum, determination]
    algorithm: constraint_propagation
    formula: |
      # evaluation order is pinned:
      # (1) completed_years, schedule, pct, prorated pool (per-line rounding)
      # (2) share from determination
      # (3) manufacturer_material_covered = round_half_up( share * prorated_material_pool_cents )
      # (4) homeowner_material_share   = round_half_up( share * (material_total_cents - prorated_material_pool_cents) )
      # (5) labor_covered per labor_coverage_amount
      # (6) factor = LIABILITY_FACTOR[filing_workmanship_score band]   # snapshot, NOT live score
      # (7) contractor_liability = round_half_up( (1 - share) * (material_total_cents + claim_labor_cost_cents) * factor )
      # (8) only after (1)-(7) are persisted, apply workmanship delta to the contractor
    constants:
      LIABILITY_FACTOR: "{ score >= 80: 1.00, 61 <= score <= 79: 1.10, score <= 60: 1.25 }"
      WORKMANSHIP_DELTA: "{ MANUFACTURER_DEFECT: 0, MIXED: -4, INSTALLATION_ERROR: -10 }"
      DECERT_THRESHOLD: 60
    precision: "integer cents, round_half_up at each pinned step"
    variants: []

  - name: complaint_pattern_score
    description: "Two contractor-risk metrics computed from the same substantiated-complaint set; they answer different questions and diverge on old complaint histories."
    trigger: "Complaint FILED->SUBSTANTIATED; weighted variant also recomputed for SUSPENDED contractors on POST /program/_clock/set_current_utc"
    inputs: [contractor complaints with status SUBSTANTIATED, current clock]
    algorithm: weighted_scoring
    formula: |
      months(filed_at, now) = floor( (now - filed_at).days / 30 )
      weight(m) = 3 if m <= 6; 2 if 7 <= m <= 12; 1 if 13 <= m <= 24; 0 if m > 24
      weighted_24mo = SUM weight(months(filed_at, now)) over SUBSTANTIATED complaints   # uses filed_at for aging
      lifetime_count = COUNT of SUBSTANTIATED complaints (no window)
      suspension rule: weighted_24mo >= 5 -> contractor SUSPENDED
      revocation rule: lifetime_count >= 8 -> contractor REVOKED
    constants:
      SUSPEND_THRESHOLD: 5
      REVOKE_LIFETIME: 8
      WEIGHT_BANDS: "{ m <= 6: 3, 7-12: 2, 13-24: 1, > 24: 0 }"
    precision: "integer score"
    variants:
      - name: weighted_24mo
        when: "suspension evaluation"
        difference: "time-decayed; complaints older than 24 months contribute 0"
      - name: lifetime_count
        when: "revocation evaluation"
        difference: "no decay; a contractor with only ancient complaints has weighted 0 but still accrues toward revocation"

  - name: training_credit_total
    description: "Creditable training at an evaluation date; completions older than the course validity window drop out (inclusive boundary)."
    trigger: "certification verify and renew"
    inputs: [contractor enrollments with status COMPLETED, evaluation date = current clock date]
    algorithm: aggregation
    formula: |
      credit counts iff enrollment.status == COMPLETED AND
        date_add_months(enrollment.completed_at, course.validity_months) >= evaluation_date
      training_credit_total = SUM course.credits over counting enrollments
    constants:
      TIER_MIN_CREDITS: "{ BRONZE: 4, SILVER: 8, GOLD: 12 }"
    precision: "integer credits"
    variants: []

  - name: workmanship_score_update
    description: "Bounded running score with restoration on reopen."
    trigger: "complaint substantiation, claim adjudication, claim reopen"
    inputs: [current workmanship_score, event delta]
    algorithm: aggregation
    formula: |
      on substantiation:        score = max(0, score - 5)
      on adjudication:          score = max(0, score + WORKMANSHIP_DELTA[determination])
      on reopen:                score = min(100, score - remedy.workmanship_delta_applied)
      decertification:          score <= 60 after an adjudication -> ACTIVE certifications SUSPENDED
    constants:
      SCORE_FLOOR: 0
      SCORE_CEILING: 100
      DECERT_THRESHOLD: 60
    precision: "integer"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a known role; X-User-ID present for entity_backed roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "role is permitted for the endpoint per RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 2, category: auth, check: "ownership: Contractor role may only act on own resources (certification/registration contractor_id == X-User-ID); Distributor may only act on own distributor_id; Inspector may only complete own inspection orders", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "POST /program/certifications, POST /program/certifications/{id}/renew, POST /program/warranty-registrations, POST /program/registration-components, POST /program/lead-assignments, POST /program/lead-assignments/{id}/return, POST /program/inspection-orders/{id}/complete" }
  - { priority: 3, category: existence, check: "request body schema: required fields present, enum members valid, dates well-formed, end_date > start_date, amounts >= 0", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "referenced resource in path or body exists (validated left-to-right)", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all" , description: "message names the missing resource type"}
  - { priority: 5, category: state, check: "target resource is in a state from which the requested transition exists", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "contractor.status == ACTIVE when creating certifications or lead assignments, or verifying/reinstating/renewing", error_id: ERR_CONTRACTOR_SUSPENDED, http_status: 409, applies_to: "POST /program/certifications, POST /program/certifications/{id}/verify, POST /program/certifications/{id}/reinstate, POST /program/certifications/{id}/renew, POST /program/lead-assignments" }
  - { priority: 5, category: state, check: "certification.status == ACTIVE when creating or activating a warranty registration and install_date <= valid_until", error_id: ERR_CERTIFICATION_NOT_ACTIVE, http_status: 409, applies_to: "POST /program/warranty-registrations, POST /program/warranty-registrations/{id}/activate" }
  - { priority: 5, category: state, check: "registration.status == ACTIVE when filing a claim", error_id: ERR_REGISTRATION_NOT_ACTIVE, http_status: 409, applies_to: "POST /program/warranty-claims" }
  - { priority: 6, category: state, check: "OCC: expected_claim_version == claim.version on adjudicate", error_id: ERR_STALE_CLAIM_VERSION, http_status: 412, applies_to: "POST /program/warranty-claims/{id}/adjudicate" }
  - { priority: 6, category: state, check: "OCC: expected_certification_version == certification.version on renew", error_id: ERR_STALE_CERTIFICATION_VERSION, http_status: 412, applies_to: "POST /program/certifications/{id}/renew" }
  - { priority: 7, category: business_temporal, check: "contractor.insurance_expiry > current clock date", error_id: ERR_INSURANCE_EXPIRED, http_status: 422, applies_to: "POST /program/certifications/{id}/verify, POST /program/certifications/{id}/reinstate, POST /program/certifications/{id}/renew" }
  - { priority: 7, category: business_temporal, check: "contractor.license_expiry > current clock date", error_id: ERR_LICENSE_EXPIRED, http_status: 422, applies_to: "POST /program/certifications/{id}/verify, POST /program/certifications/{id}/renew" }
  - { priority: 8, category: business_constraint, check: "training_credit_total >= tier minimum at current clock date", error_id: ERR_INSUFFICIENT_TRAINING_CREDITS, http_status: 422, applies_to: "POST /program/certifications/{id}/verify, POST /program/certifications/{id}/renew" }
  - { priority: 8, category: business_constraint, check: "claim.photo_count >= 2 at adjudication", error_id: ERR_PHOTO_EVIDENCE_INSUFFICIENT, http_status: 422, applies_to: "POST /program/warranty-claims/{id}/adjudicate" }
  - { priority: 8, category: business_constraint, check: "no linked InspectionOrder in REQUESTED or SCHEDULED at adjudication", error_id: ERR_INSPECTION_INCOMPLETE, http_status: 422, applies_to: "POST /program/warranty-claims/{id}/adjudicate" }
  - { priority: 8, category: business_constraint, check: "all required component types (SHINGLE, UNDERLAYMENT, STARTER, RIDGE_CAP) present exactly once at activation", error_id: ERR_MISSING_REQUIRED_COMPONENT, http_status: 422, applies_to: "POST /program/warranty-registrations/{id}/activate" }
  - { priority: 8, category: business_constraint, check: "component_type unique per registration", error_id: ERR_DUPLICATE_COMPONENT_TYPE, http_status: 409, applies_to: "POST /program/registration-components" }
  - { priority: 8, category: business_constraint, check: "catalog_sku exists in ComponentCatalogItem", error_id: ERR_CATALOG_ITEM_NOT_FOUND, http_status: 404, applies_to: "POST /program/registration-components" }
  - { priority: 8, category: business_constraint, check: "lead territory_code in both distributor and contractor territory_codes; contractor holds an ACTIVE certification with tier >= required_tier", error_id: ERR_TIER_REQUIREMENT_NOT_MET, http_status: 422, applies_to: "POST /program/lead-assignments" }
  - { priority: 8, category: business_constraint, check: "half-open territory window [start_date, end_date) does not overlap any existing ASSIGNED assignment of the same distributor + territory_code; touching endpoints (end == other.start) allowed", error_id: ERR_TERRITORY_OVERLAP, http_status: 409, applies_to: "POST /program/lead-assignments" }
  - { priority: 8, category: business_constraint, check: "fewer than 3 SCHEDULED inspection orders for (inspector_id, service_date)", error_id: ERR_INSPECTOR_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /program/inspection-orders/{id}/schedule" }
  - { priority: 9, category: business_fiscal, check: "distributor lead_pool_available > 0 when creating a lead assignment", error_id: ERR_LEAD_POOL_EMPTY, http_status: 422, applies_to: "POST /program/lead-assignments" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/program/_clock/set_current_utc", description: "Sets the logical clock. Server startup default (before any call) is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Side effects: lazy-expire certifications past valid_until; reinstate SUSPENDED contractors whose recomputed weighted complaint score is < 5.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["certification lazy expiry", "contractor auto-reinstatement recompute"] }

  - { method: POST, path: "/program/contractors", description: "Register a contractor", roles: [ProgramAdmin], code: 201, input: [legal_name, license_number, license_expiry, insurance_expiry, territory_codes], output: Contractor, side_effects: [] }
  - { method: GET, path: "/program/contractors/{id}", description: "Fetch contractor including computed scores and liability", roles: [ProgramAdmin, Contractor, Distributor], code: 200, input: [], output: Contractor, side_effects: [] }
  - { method: PATCH, path: "/program/contractors/{id}/compliance", description: "Update license/insurance compliance fields", roles: [ProgramAdmin], code: 200, input: ["license_number?", "license_expiry?", "insurance_expiry?"], output: Contractor, side_effects: ["increments contractor.version"] }
  - { method: GET, path: "/program/contractors/{id}/certifications", description: "List certifications of a contractor", roles: [ProgramAdmin, Contractor], code: 200, input: [], output: "Certification[]", side_effects: [] }
  - { method: GET, path: "/program/contractors/{id}/complaints", description: "List complaints filed against a contractor", roles: [ProgramAdmin], code: 200, input: [], output: "Complaint[]", side_effects: [] }

  - { method: POST, path: "/program/training-courses", description: "Create a training course", roles: [ProgramAdmin], code: 201, input: [title, credits, validity_months], output: TrainingCourse, side_effects: [] }
  - { method: POST, path: "/program/training-enrollments", description: "Enroll a contractor in a course", roles: [ProgramAdmin], code: 201, input: [contractor_id, course_id], output: TrainingEnrollment, side_effects: [] }
  - { method: GET, path: "/program/training-enrollments/{id}", description: "Fetch one enrollment", roles: [ProgramAdmin, Contractor], code: 200, input: [], output: TrainingEnrollment, side_effects: [] }
  - { method: GET, path: "/program/training-enrollments", description: "List enrollments with pagination and filters", roles: [ProgramAdmin, Contractor], code: 200, input: ["contractor_id?", "course_id?", "status?", "limit?", "offset?"], output: "TrainingEnrollment[]", side_effects: [] }
  - { method: POST, path: "/program/training-enrollments/{id}/complete", description: "Mark enrollment completed with a completion date", roles: [ProgramAdmin], code: 200, input: [completed_at], output: TrainingEnrollment, side_effects: ["increments enrollment.version"] }

  - { method: POST, path: "/program/certifications", description: "Apply for a certification tier (Contractor applies for self)", roles: [Contractor, ProgramAdmin], code: 201, input: [contractor_id, tier], output: Certification, side_effects: [] }
  - { method: GET, path: "/program/certifications/{id}", description: "Fetch certification", roles: [ProgramAdmin, Contractor], code: 200, input: [], output: Certification, side_effects: [] }
  - { method: POST, path: "/program/certifications/{id}/verify", description: "ProgramAdmin verifies (APPROVE) or denies (DENY) a pending certification; re-validates insurance, license, and training credits at the current clock", roles: [ProgramAdmin], code: 200, input: [decision], output: Certification, side_effects: ["state transition", "increments certification.version"] }
  - { method: POST, path: "/program/certifications/{id}/reinstate", description: "Reinstate a SUSPENDED certification", roles: [ProgramAdmin], code: 200, input: [], output: Certification, side_effects: ["state transition", "increments certification.version"] }
  - { method: POST, path: "/program/certifications/{id}/renew", description: "Renew an ACTIVE certification for +24 months; OCC-guarded", roles: [Contractor], code: 200, input: [expected_certification_version], output: Certification, side_effects: ["valid_until extended 24 months", "increments certification.version"] }
  - { method: GET, path: "/program/certifications/{id}/warranty-registrations", description: "List registrations under a certification", roles: [ProgramAdmin, Contractor], code: 200, input: [], output: "WarrantyRegistration[]", side_effects: [] }

  - { method: POST, path: "/program/component-catalog-items", description: "Add a component catalog item", roles: [ProgramAdmin], code: 201, input: [sku, component_type, manufacturer], output: ComponentCatalogItem, side_effects: [] }

  - { method: POST, path: "/program/warranty-registrations", description: "Register an installed system under an ACTIVE certification owned by the caller", roles: [Contractor], code: 201, input: [certification_id, homeowner_name, property_postal_code, install_date], output: WarrantyRegistration, side_effects: [] }
  - { method: GET, path: "/program/warranty-registrations/{id}", description: "Fetch registration", roles: [ProgramAdmin, Contractor, Claimant], code: 200, input: [], output: WarrantyRegistration, side_effects: [] }
  - { method: POST, path: "/program/warranty-registrations/{id}/activate", description: "Activate a DRAFT registration; computes coverage_class and snapshots coverage_tier", roles: [ProgramAdmin], code: 200, input: [], output: WarrantyRegistration, side_effects: ["coverage_class computed", "coverage_tier snapshot", "increments registration.version"] }
  - { method: GET, path: "/program/warranty-registrations/{id}/components", description: "List component lines of a registration", roles: [ProgramAdmin, Contractor], code: 200, input: [], output: "RegistrationComponent[]", side_effects: [] }
  - { method: GET, path: "/program/warranty-registrations/{id}/claims", description: "List claims on a registration", roles: [ProgramAdmin, Contractor, Claimant], code: 200, input: [], output: "WarrantyClaim[]", side_effects: [] }

  - { method: POST, path: "/program/registration-components", description: "Add a component line to a DRAFT registration; component_type and manufacturer are copied from the catalog SKU", roles: [Contractor], code: 201, input: [registration_id, catalog_sku, material_cost_cents], output: RegistrationComponent, side_effects: [] }

  - { method: POST, path: "/program/warranty-claims", description: "File a warranty claim against an ACTIVE registration", roles: [Claimant], code: 201, input: [registration_id, description, claim_labor_cost_cents], output: WarrantyClaim, side_effects: ["filed_at stamped from clock", "filing_workmanship_score snapshot"] }
  - { method: GET, path: "/program/warranty-claims/{id}", description: "Fetch claim", roles: [ProgramAdmin, Contractor, Claimant], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: POST, path: "/program/warranty-claims/{id}/evidence", description: "Append one evidence item; auto-transitions SUBMITTED -> EVIDENCE_REVIEW when photo_count reaches 2", roles: [Claimant, ProgramAdmin], code: 201, input: [evidence_type, note], output: WarrantyClaim, side_effects: ["photo_count recompute", "auto-transition", "increments claim.version"] }
  - { method: POST, path: "/program/warranty-claims/{id}/request-inspection", description: "Request a core-sample / independent inspection; creates an InspectionOrder", roles: [ProgramAdmin], code: 201, input: [], output: InspectionOrder, side_effects: ["claim EVIDENCE_REVIEW -> INSPECTION_REQUESTED (first call)", "increments claim.version"] }
  - { method: GET, path: "/program/warranty-claims/{id}/inspection-orders", description: "List inspection orders of a claim", roles: [ProgramAdmin, Contractor], code: 200, input: [], output: "InspectionOrder[]", side_effects: [] }
  - { method: POST, path: "/program/warranty-claims/{id}/adjudicate", description: "Adjudicate a claim; OCC-guarded; creates RemedyAllocation unless NO_DEFECT", roles: [ProgramAdmin], code: 200, input: [determination, expected_claim_version], output: WarrantyClaim, side_effects: ["remedy_split calculation", "RemedyAllocation created (unless NO_DEFECT)", "contractor liability and workmanship updates", "possible certification decertification", "increments claim.version"] }
  - { method: POST, path: "/program/warranty-claims/{id}/reopen", description: "Reopen a RESOLVED claim; reverses the remedy and refunds the workmanship delta", roles: [ProgramAdmin], code: 200, input: [reason], output: WarrantyClaim, side_effects: ["remedy REVERSED", "liability refunded", "workmanship refunded", "increments claim.version"] }
  - { method: GET, path: "/program/warranty-claims/{id}/remedy-allocation", description: "List remedy allocations of a claim (0 or 1 element)", roles: [ProgramAdmin, Contractor, Claimant], code: 200, input: [], output: "RemedyAllocation[]", side_effects: [] }

  - { method: POST, path: "/program/inspection-orders/{id}/schedule", description: "Schedule an inspection order to an inspector on a date (capacity 3 per inspector-day)", roles: [ProgramAdmin], code: 200, input: [inspector_id, service_date], output: InspectionOrder, side_effects: ["increments order.version"] }
  - { method: POST, path: "/program/inspection-orders/{id}/complete", description: "Assigned inspector records findings and completes the order", roles: [Inspector], code: 200, input: [findings, confirms_defect], output: InspectionOrder, side_effects: ["claim auto-advances when all orders COMPLETED", "increments order.version"] }

  - { method: POST, path: "/program/complaints", description: "File a complaint against a contractor", roles: [Claimant, ProgramAdmin], code: 201, input: [contractor_id, category], output: Complaint, side_effects: ["filed_at stamped from clock"] }
  - { method: POST, path: "/program/complaints/{id}/substantiate", description: "Substantiate a complaint; triggers score recompute and possible suspension/revocation cascades", roles: [ProgramAdmin], code: 200, input: [], output: Complaint, side_effects: ["complaint_pattern_score recompute", "workmanship -5", "possible contractor SUSPENDED/REVOKED cascade"] }
  - { method: POST, path: "/program/complaints/{id}/dismiss", description: "Dismiss a complaint; no score impact", roles: [ProgramAdmin], code: 200, input: [], output: Complaint, side_effects: [] }

  - { method: POST, path: "/program/distributors", description: "Create a distributor with a lead pool", roles: [ProgramAdmin], code: 201, input: [name, territory_codes, lead_pool_total], output: Distributor, side_effects: [] }
  - { method: GET, path: "/program/distributors/{id}", description: "Fetch distributor including computed lead_pool_available", roles: [ProgramAdmin, Distributor], code: 200, input: [], output: Distributor, side_effects: [] }
  - { method: POST, path: "/program/lead-assignments", description: "Assign a territory lead to a certified contractor from the distributor's pool", roles: [Distributor], code: 201, input: [distributor_id, contractor_id, territory_code, required_tier, start_date, end_date], output: LeadAssignment, side_effects: ["lead_pool_available recomputed"] }
  - { method: POST, path: "/program/lead-assignments/{id}/return", description: "Return a lead to the pool", roles: [Distributor], code: 200, input: [], output: LeadAssignment, side_effects: ["lead_pool_available recomputed"] }
  - { method: GET, path: "/program/lead-assignments", description: "List lead assignments with pagination and filters", roles: [ProgramAdmin, Distributor], code: 200, input: ["distributor_id?", "contractor_id?", "status?", "limit?", "offset?"], output: "LeadAssignment[]", side_effects: [] }
  - { method: GET, path: "/program/lead-assignments/{id}", description: "Fetch one lead assignment", roles: [ProgramAdmin, Distributor], code: 200, input: [], output: LeadAssignment, side_effects: [] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed caller acts on a resource owned by another contractor/distributor, or an inspector completes an order assigned to a different inspector_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, malformed date, end_date <= start_date, or negative amount" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path or body reference to a nonexistent contractor, course, enrollment, certification, registration, claim, inspection order, complaint, distributor, or lead assignment" }
  - { id: ERR_CATALOG_ITEM_NOT_FOUND, http: 404, condition: "registration-components call references a catalog_sku not present in the catalog" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition does not exist from the entity's current state (including any action on a terminal-state entity)" }
  - { id: ERR_CONTRACTOR_SUSPENDED, http: 409, condition: "Operation requires contractor.status == ACTIVE but contractor is SUSPENDED or REVOKED" }
  - { id: ERR_CERTIFICATION_NOT_ACTIVE, http: 409, condition: "Registration create/activate requires certification ACTIVE and install_date within validity" }
  - { id: ERR_REGISTRATION_NOT_ACTIVE, http: 409, condition: "Claim intake requires registration.status == ACTIVE" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version does not match the claim's current version" }
  - { id: ERR_STALE_CERTIFICATION_VERSION, http: 412, condition: "expected_certification_version does not match the certification's current version" }
  - { id: ERR_INSURANCE_EXPIRED, http: 422, condition: "contractor.insurance_expiry <= current clock date at verify/reinstate/renew" }
  - { id: ERR_LICENSE_EXPIRED, http: 422, condition: "contractor.license_expiry <= current clock date at verify/renew" }
  - { id: ERR_INSUFFICIENT_TRAINING_CREDITS, http: 422, condition: "Creditable training total below the tier minimum at evaluation date" }
  - { id: ERR_PHOTO_EVIDENCE_INSUFFICIENT, http: 422, condition: "Adjudication attempted with photo_count < 2" }
  - { id: ERR_INSPECTION_INCOMPLETE, http: 422, condition: "Adjudication attempted while a linked InspectionOrder is REQUESTED or SCHEDULED" }
  - { id: ERR_MISSING_REQUIRED_COMPONENT, http: 422, condition: "Activation without exactly one of each required component type" }
  - { id: ERR_DUPLICATE_COMPONENT_TYPE, http: 409, condition: "Second component line with the same component_type on one registration" }
  - { id: ERR_TIER_REQUIREMENT_NOT_MET, http: 422, condition: "Lead assignment whose required_tier exceeds the contractor's ACTIVE certification tier, or territory not shared by distributor and contractor" }
  - { id: ERR_TERRITORY_OVERLAP, http: 409, condition: "Half-open territory window overlaps an existing ASSIGNED assignment of the same distributor and territory_code" }
  - { id: ERR_INSPECTOR_CAPACITY_EXCEEDED, http: 422, condition: "Scheduling a 4th SCHEDULED order for the same inspector_id and service_date" }
  - { id: ERR_LEAD_POOL_EMPTY, http: 422, condition: "Distributor has no available leads in its pool" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Manufacturer program operations staff; verifies certifications, activates registrations, adjudicates claims, manages complaints, catalog, and clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /program/_clock/set_current_utc"
      - "POST /program/contractors"
      - "PATCH /program/contractors/{id}/compliance"
      - "POST /program/training-courses"
      - "POST /program/training-enrollments"
      - "POST /program/training-enrollments/{id}/complete"
      - "POST /program/certifications/{id}/verify"
      - "POST /program/certifications/{id}/reinstate"
      - "POST /program/component-catalog-items"
      - "POST /program/warranty-registrations/{id}/activate"
      - "POST /program/warranty-claims/{id}/request-inspection"
      - "POST /program/warranty-claims/{id}/adjudicate"
      - "POST /program/warranty-claims/{id}/reopen"
      - "POST /program/inspection-orders/{id}/schedule"
      - "POST /program/complaints/{id}/substantiate"
      - "POST /program/complaints/{id}/dismiss"
      - "POST /program/distributors"
    shared_operations:
      - "GET reads across resources"
      - "POST /program/certifications (on behalf of a contractor)"
      - "POST /program/warranty-claims/{id}/evidence"
      - "POST /program/complaints"
  - name: Contractor
    description: "Certified (or aspiring) installation contractor; applies for certification, renews, registers warranties, adds components"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /program/warranty-registrations"
      - "POST /program/registration-components"
      - "POST /program/certifications/{id}/renew"
    shared_operations:
      - "POST /program/certifications (self only: contractor_id == X-User-ID)"
      - "GET reads of own contractor record, certifications, registrations, claims"
  - name: Distributor
    description: "Distribution partner sharing leads with certified contractors under territory rules"
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /program/lead-assignments (self only: distributor_id == X-User-ID)"
      - "POST /program/lead-assignments/{id}/return"
    shared_operations:
      - "GET /program/lead-assignments, GET /program/lead-assignments/{id}, GET /program/contractors/{id}"
  - name: Claimant
    description: "Homeowner filing warranty claims and evidence; not a persisted entity"
    identity: "opaque"
    exclusive_operations:
      - "POST /program/warranty-claims"
    shared_operations:
      - "POST /program/warranty-claims/{id}/evidence"
      - "POST /program/complaints"
      - "GET claim/registration/remedy reads"
  - name: Inspector
    description: "Independent inspector; may only complete inspection orders assigned to their inspector_id"
    identity: "opaque"
    exclusive_operations:
      - "POST /program/inspection-orders/{id}/complete"
    shared_operations: []
