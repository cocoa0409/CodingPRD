  # =====================================================================
  # RULE 8 — resource_temporal_overlap
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rehearsal_window_treats_endpoints_as_closed_and_demands_a_full_changeover_gap
        grounds:
          - entities.RehearsalRun.fields.window_start_utc
          - entities.RehearsalRun.fields.window_end_utc
          - validations[priority 21].ERR_REHEARSAL_WINDOW_CONFLICT
          - endpoints[POST /rehearsal-runs]
        distinguishing_aspect: |
          Resource entity = RehearsalRun, contending for the whole attraction as a single exclusive resource.
          Interval semantics = CLOSED [start, end] on a UTC wall-clock axis, widened by a mandatory 120-minute
          changeover gap on both sides. A window starting exactly when the incumbent ends collides (closed endpoints
          touch), a window starting 60 minutes later still collides (gap under 120 minutes), and a window starting
          exactly 120 minutes later is accepted — so the accept/reject line sits at the gap, not at raw overlap.
        test_recipe:
          setup:
            - "Project driven to design_phase TECHNICAL_REHEARSAL with a COMMISSIONED RideSystem and an accessible queue that carries 17.81 percent of a 539-guest queue."
            - "One SCHEDULED RehearsalRun occupying 2026-08-01T09:00:00Z .. 2026-08-01T13:00:00Z."
            - "Logical clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-RT1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc1: $.data.id }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Chase", sequence_index: 2, duration_seconds: 120, follows_scene_id: "${sc1}" }
              as: CreativeDirector
              as_user_id: "u-cd-1"
