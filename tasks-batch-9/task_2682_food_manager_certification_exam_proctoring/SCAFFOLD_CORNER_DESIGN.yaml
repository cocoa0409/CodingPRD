      - name: recert_authorization_is_refused_before_the_window_and_accepted_at_its_first_instant
        claim_type: conditional_action
        grounds:
          - endpoints[POST /certificates/{id}/recert-authorization]
          - validations[priority=46]
          - errors.ERR_RECERT_WINDOW_NOT_OPEN
          - calculations.certificate_validity_window
        distinguishing_aspect: |
          The gate is logical_clock >= recert_window_opens_at with an INCLUSIVE bound: at
          2031-03-15T10:30:00Z (one day early) the call returns ERR_RECERT_WINDOW_NOT_OPEN and leaves
          recert_authorized_at null, while at exactly 2031-03-16T10:30:00Z it returns 200 and stamps
          recert_authorized_at — and the certificate stays ISSUED with the same expires_at, because
          authorization is not renewal.
        test_recipe:
          setup:
            - "A jurisdiction with recert_cycle_months 60 and requires_local_registration false / provider prepaid 500000 / EN form / 2-seat site / candidate / REGISTERED proctor / 1-unit EXAM_ONLY batch with its code assigned."
            - "A certificate issued on 2026-09-12T10:30:00Z, so expires_at is 2031-09-12T10:30:00Z and recert_window_opens_at is 2031-03-16T10:30:00Z."
            - "The clock is moved to 2031-03-15T10:30:00Z — exactly one day before the window opens."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN"], requires_local_registration: false, recert_cycle_months: 60, exam_fee_surcharge_pct: 0.045 }
