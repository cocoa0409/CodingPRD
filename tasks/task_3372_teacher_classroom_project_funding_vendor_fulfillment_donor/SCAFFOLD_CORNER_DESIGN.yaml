              payload: { title: "Second Project", description: "Should be blocked by the pipeline gate.", subject: "MATH", grade_band: "K_2", funding_window_days: 45 }
              as: Teacher
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACTIVE_PROJECT_EXISTS (409)"
            - "GET /giving/projects?teacher_id=${t1} returns exactly 1 row"

      - name: reallocate_to_out_of_window_fund_returns_invalid_target
        claim_type: Violation → Error
        grounds:
          - validations[priority=21]
          - errors.ERR_INVALID_REALLOCATION_TARGET
        distinguishing_aspect: "A REALLOCATE choice naming a fund whose window already ended (and which the sweep has CLOSED) is rejected with ERR_INVALID_REALLOCATION_TARGET; the donation stays CHOICE_PENDING and the donor may still choose again."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01T00:00:00Z after expiry sweep: project EXPIRED, donation CHOICE_PENDING with choice_deadline 2026-10-15T00:00:00Z. The TX fund created with a past window [2026-01-01, 2026-06-01] was CLOSED by the same sweep."
          setup_api_calls:
            - *k_clock
            - *k_school
            - *k_teacher
            - *k_verify
            - *k_vendor
            - *k_item
            - *k_project
            - *k_add
            - *k_getp1
            - *k_submit
            - *k_screen
            - *k_vet
            - *k_donor
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 5000 }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1: $.data.id }
            - call: "POST /giving/equity-funds"
              payload: { name: "TX Spring Fund (past)", state_code: "TX", min_poverty_pct: 75.0, budget_cents: 50000, window_start: "2026-01-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_sweeps/expiration_run"
              payload: {}
              as: PlatformAdmin
            - call: "GET /giving/donations/${dn1}"
              payload: {}
              as: Donor
              as_user_id: "${d1}"
              captures: { dn_v: $.data.version }
          trigger:
            - call: "POST /giving/donations/${dn1}/reallocation-choice"
              payload: { choice: "REALLOCATE", equity_fund_id: "${f1}", expected_donation_version: "${dn_v}" }
              as: Donor
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
