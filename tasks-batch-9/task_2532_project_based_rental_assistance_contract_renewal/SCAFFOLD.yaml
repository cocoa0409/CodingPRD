    roles: [ContractAdministrator]
    side_effects:
      - "Snapshots market_rent_per_unit_cents, current_rent_per_unit_cents and fmr_per_unit_cents from the case, contract and property."
      - "Sets determination_state and eligibility_reason_code to the branch chosen by calculations.restructuring_eligibility."
  - method: POST
    path: /pbra/restructuring-determinations/{id}/approve
    purpose: "HUD field office approves an eligible determination, joining either branch at APPROVED with branch-specific rent arithmetic."
