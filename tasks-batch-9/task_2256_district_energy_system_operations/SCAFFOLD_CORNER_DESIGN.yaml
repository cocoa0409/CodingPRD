      - name: each_role_is_refused_another_roles_exclusive_operation
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - validations[priority 2 ERR_UNAUTHORIZED]
          - errors[ERR_UNAUTHORIZED]
          - roles[all six]
        distinguishing_aspect: "The role gate sits at priority 2, above existence and payload checks, so a wrong role is refused even when the target row does not exist and even when the body is well formed: seven cross-column attempts and one unrecognised role name all return the same 403 identifier, and none of them leaves a row behind."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-Z, PipeSegment SEG-Z1, RateSchedule RS-C and a PENDING_CAPACITY agreement CZ1 exist."
            - "No invoice exists; the invoice identifier used below is a well-formed UUID that was never issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
