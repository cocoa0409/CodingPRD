# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 1827 — Senior Discount & Municipal Benefit Card Program
# Breadth probe over §1.1–§1.7; §1.8-covered corners appear as
# excluded_because stubs. Names are unique across BOTH design files.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: application_creation_sets_initial_state
        claim_type: creation
        grounds: [entities.BenefitApplication.fields.status, state_machines.BenefitApplication]
        distinguishing_aspect: "A valid INITIAL application is created 201 with status SUBMITTED, version 1, reviewed_by_user_id null, and a server-minted UUID id."
        test_recipe:
          setup: ["logical clock pinned at the default date"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Init State", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "20 Start St" }, as: Applicant, captures: { app_id: $.data.id, st: $.data.status, ver: $.data.version, rev: $.data.reviewed_by_user_id } }
          assert:
            - "status == SUBMITTED (initial_state)"
            - "version == 1 and id is a server-minted UUID"
            - "reviewed_by_user_id == null, info_request_reason == null, denial_reason == null, decided_by_user_id == null"

      - name: application_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.BenefitApplication.fields.date_of_birth, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field date_of_birth yields ERR_INVALID_REQUEST (400); no application is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "No Dob", annual_income_cents: 500000, residency_address: "21 Gap St" }, as: Applicant, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: application_invalid_enum_kind_rejected
        claim_type: type_constraint
        grounds: [entities.BenefitApplication.fields.kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "kind must be INITIAL or RECERTIFICATION; the value RENEWAL is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "POST /senior-benefits/applications", payload: { kind: RENEWAL, applicant_full_name: "Bad Enum", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "22 Enum Ave" }, as: Applicant, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: document_invalid_enum_type_rejected
        claim_type: type_constraint
        grounds: [entities.VerificationDocument.fields.document_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "document_type outside {PROOF_OF_AGE, PROOF_OF_INCOME, PROOF_OF_RESIDENCY} is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["a SUBMITTED INITIAL application exists"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Doc Enum", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "23 Doc Ln" }, as: Applicant, captures: { app_id: $.data.id } }
          trigger:
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PASSPORT, document_reference: "P-123" }, as: Applicant, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: cardholder_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_CARDHOLDER_NOT_FOUND]", entities.Cardholder]
        distinguishing_aspect: "GET with a well-formed but nonexistent cardholder UUID returns ERR_CARDHOLDER_NOT_FOUND (404), not an empty object."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "GET /senior-benefits/cardholders/00000000-0000-4000-8000-000000000000", as: ProgramAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CARDHOLDER_NOT_FOUND, http 404"

      - name: merchant_created_active_with_zero_reimbursed
        claim_type: defaults
        grounds: [entities.Merchant.fields.status, entities.Merchant.fields.current_month_reimbursed_cents, state_machines.Merchant]
        distinguishing_aspect: "Enrollment creates the merchant directly in ACTIVE status with current_month_reimbursed_cents == 0 and version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "POST /senior-benefits/merchants", payload: { name: "Default Deli", reimbursement_rate_pct: 25, monthly_reimbursement_cap_cents: 50000 }, as: ProgramAdministrator, captures: { m_id: $.data.id, st: $.data.status, cmr: $.data.current_month_reimbursed_cents, ver: $.data.version } }
          assert:
            - "status == ACTIVE (initial_state)"
            - "current_month_reimbursed_cents == 0 and version == 1"

      - name: computed_age_years_reflects_logical_clock
        claim_type: computed_fields
        grounds: [entities.Cardholder.fields.age_years, calculations.age_years_at_clock]
        distinguishing_aspect: "Cardholder.age_years is computed from date_of_birth against the logical clock: dob 1960-06-15 at clock 2026-08-01 reads 66, and any client-supplied age is ignored."
        test_recipe:
          setup: ["cardholder onboarded with dob 1960-06-15 (approved at default clock 2026-08-01)"]
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Age Computed", date_of_birth: "1960-06-15", annual_income_cents: 500000, residency_address: "24 Years Way" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "AC-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "AC-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "AC-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
          trigger:
            - { call: "GET /senior-benefits/cardholders/${ch_id}", as: ProgramAdministrator, captures: { age: $.data.age_years } }
          assert:
            - "age_years == 66 (birthday 2026-06-15 already passed at clock 2026-08-01)"

      - name: system_fields_client_input_ignored
        claim_type: system_fields
        grounds: [entities.BenefitApplication]
        distinguishing_aspect: "Client-injected id/version values in the create payload are ignored: the response carries a server-minted UUID and version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
          trigger:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Inject Fields", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "25 Forge St", id: "client-injected-id", version: 99 }, as: Applicant, captures: { new_id: $.data.id, ver: $.data.version } }
          assert:
            - "response id != 'client-injected-id' (server-minted UUID)"
            - "version == 1 (client-supplied 99 ignored)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_submitted_application_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BenefitApplication.UNDER_REVIEW_to_APPROVED, "errors[ERR_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "Approve requires UNDER_REVIEW; calling it on a fresh SUBMITTED application fails with ERR_APPLICATION_INVALID_STATE and decides nothing."
        test_recipe:
          setup: ["SUBMITTED INITIAL application (eligible)"]
          setup_api_calls:
            - { call: "POST /senior-benefits/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Early Approve", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "26 Rush St" }, as: Applicant, captures: { app_id: $.data.id } }
          trigger:
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_INVALID_STATE, http 409"
            - "application remains SUBMITTED with decided_by_user_id null"

      - name: deny_approved_application_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BenefitApplication, "errors[ERR_APPLICATION_INVALID_STATE]"]
        distinguishing_aspect: "APPROVED is terminal: a subsequent deny is rejected ERR_APPLICATION_INVALID_STATE."
        test_recipe:
          setup: ["fully reviewed application APPROVED (cardholder created)"]
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Terminal Deny", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "27 Lock St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "TD-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "TD-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "TD-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /senior-benefits/applications/${app_id}/deny", payload: { reason: "late denial" }, as: ProgramAdministrator, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_APPLICATION_INVALID_STATE, http 409"

      - name: document_double_review_rejected
        claim_type: invalid_transition
        grounds: [state_machines.VerificationDocument.SUBMITTED_to_VERIFIED, "errors[ERR_DOCUMENT_ALREADY_REVIEWED]"]
        distinguishing_aspect: "A VERIFIED document cannot be reviewed again (idempotency guard): second review returns ERR_DOCUMENT_ALREADY_REVIEWED."
        test_recipe:
          setup: ["application UNDER_REVIEW with one VERIFIED document"]
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Double Review", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "28 Twice Ln" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "DR-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: REJECTED, rejection_reason: "changed my mind" }, as: EligibilitySpecialist, as_user_id: "spec-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DOCUMENT_ALREADY_REVIEWED, http 409"
            - "document remains VERIFIED with its original reviewed_by_user_id"

      - name: void_flagged_transaction_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.UsageTransaction.POSTED_to_VOIDED, "errors[ERR_TRANSACTION_NOT_VOIDABLE]"]
        distinguishing_aspect: "Only POSTED transactions are voidable; voiding a FLAGGED one fails ERR_TRANSACTION_NOT_VOIDABLE (a FraudAnalyst must clear the flag first)."
        test_recipe:
          setup: ["cardholder onboarded with card; merchant with GROCERY offer 10% max 100; one transaction created then FLAGGED by fraud-1"]
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Void Flagged", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "29 Hold St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "VF-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "VF-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "VF-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: ProgramAdministrator, captures: { card_id: "$.data[0].id" } }
            - { call: "POST /senior-benefits/merchants", payload: { name: "Void Foods", reimbursement_rate_pct: 10, monthly_reimbursement_cap_cents: 100000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 10, max_discount_cents: 100, valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { t1: $.data.id } }
            - { call: "POST /senior-benefits/usage-transactions/${t1}/flag", payload: { reason: "review hold" }, as: FraudAnalyst, as_user_id: "fraud-1" }
          trigger:
            - { call: "POST /senior-benefits/usage-transactions/${t1}/void", payload: {}, as: MerchantOperator, as_user_id: "${m_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSACTION_NOT_VOIDABLE, http 409"
            - "transaction remains FLAGGED; cardholder ytd totals unchanged"

      - name: clear_flag_on_posted_transaction_rejected
        claim_type: invalid_transition
        grounds: [state_machines.UsageTransaction.FLAGGED_to_POSTED, "errors[ERR_TRANSACTION_NOT_FLAGGABLE]"]
        distinguishing_aspect: "clear-flag requires FLAGGED; calling it on a POSTED transaction fails ERR_TRANSACTION_NOT_FLAGGABLE."
        test_recipe:
          setup: ["cardholder onboarded; merchant + GROCERY offer; one POSTED transaction"]
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Clear Posted", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "30 Plain St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "CP-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "CP-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "CP-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
            - { call: "GET /senior-benefits/cardholders/${ch_id}/cards", as: ProgramAdministrator, captures: { card_id: "$.data[0].id" } }
            - { call: "POST /senior-benefits/merchants", payload: { name: "Clear Corner", reimbursement_rate_pct: 10, monthly_reimbursement_cap_cents: 100000 }, as: ProgramAdministrator, captures: { m_id: $.data.id } }
            - { call: "POST /senior-benefits/merchants/${m_id}/offers", payload: { category: GROCERY, discount_pct: 10, max_discount_cents: 100, valid_from: "2026-01-01", valid_until: "2027-01-01" }, as: MerchantOperator, as_user_id: "${m_id}" }
            - { call: "POST /senior-benefits/usage-transactions", payload: { card_id: "${card_id}", merchant_id: "${m_id}", category: GROCERY, purchase_amount_cents: 100 }, as: MerchantOperator, as_user_id: "${m_id}", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /senior-benefits/usage-transactions/${t1}/clear-flag", payload: {}, as: FraudAnalyst, as_user_id: "fraud-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TRANSACTION_NOT_FLAGGABLE, http 409"

      - name: revoke_already_revoked_cardholder_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Cardholder, "errors[ERR_CARDHOLDER_ALREADY_TERMINAL]"]
        distinguishing_aspect: "REVOKED is terminal for the cardholder; a second revoke fails ERR_CARDHOLDER_ALREADY_TERMINAL."
        test_recipe:
          setup: ["cardholder onboarded then REVOKED by fraud-1"]
          setup_api_calls:
            - { call: "POST /senior-benefits/applications", payload: { kind: INITIAL, applicant_full_name: "Double Revoke", date_of_birth: "1955-01-01", annual_income_cents: 500000, residency_address: "31 End St" }, as: Applicant, captures: { app_id: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/start-review", payload: {}, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "DR2-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "DR2-INC" }, as: Applicant, captures: { doc2: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc2}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_RESIDENCY, document_reference: "DR2-RES" }, as: Applicant, captures: { doc3: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc3}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/approve", payload: {}, as: ProgramAdministrator, as_user_id: "admin-1", captures: { ch_id: $.data.cardholder_id } }
