scenario: |
  2221. Hotel Pre-Opening Program Management (hotel pre-opening team): critical path schedule from construction completion through certificate of occupancy, licensing and first guest, licensing and permit sequencing including liquor, food service, elevator and occupancy approvals, systems implementation across property management, point of sale, key and revenue systems with testing, hiring plan with staggered start dates by department and pre-opening training calendar, operating supplies and equipment procurement with delivery timing and storage, pre-opening budget management across payroll, marketing and setup costs, sales and reservation ramp with booking acceptance before opening and cancellation contingency, soft opening, punch list closure and transition to stabilized operations

domain_name: "hotel-pre-opening"
api_prefix: "/pre-opening"

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Milestone forms a DAG via the self-referential MilestoneDependency junction
  # (predecessor/successor both -> Milestone.id); SystemImplementation is
  # self-referential through prerequisite_system_id; PermitApplication and
  # PunchListItem cross the schedule aggregate via gating_milestone_id /
  # milestone_id. Cycle detection is a first-class validation.

  state_machine_shape: cyclic
  # PreOpeningProgram carries TWO independent state dimensions on one row
  # (schedule_state x commercial_state). PermitApplication cycles
  # SUBMITTED->DEFICIENT->SUBMITTED, Milestone cycles
  # COMPLETE->REOPENED->IN_PROGRESS->COMPLETE, PunchListItem cycles
  # READY_FOR_VERIFICATION->REJECTED->READY_FOR_VERIFICATION,
  # SystemImplementation cycles CERTIFIED->TESTING->CERTIFIED,
  # ReservationBlock cycles ACCEPTED->AT_RISK->ACCEPTED.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # Eight peer operator roles own disjoint resource types, and three
  # same-user prohibitions apply: the punch-list verifier may not be the
  # submitter, the system certifier may not be the executor of the latest
  # test run, and the soft-opening authorizer may not be the director who
  # baselined the schedule.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 59 endpoints / 61 error codes / 7 calculations (2 with
  # divergent variants) / 10 state machines / 47 transitions. Every mutation
  # feeds the readiness posture, the posture gates the commercial dimension,
  # and the commercial dimension carries the money invariants.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PreOpeningProgram
    parent: null
    common_fields: true
    fields:
      - name: property_name
        type: string
        source: input
        description: Hotel property being opened.
        constraints: 1..120 chars, required
      - name: brand_code
        type: string
        source: input
        description: Brand/flag code the property opens under.
        constraints: 2..12 chars, required
      - name: room_count
        type: integer
        source: input
        description: Sellable guest rooms at opening.
        constraints: ">= 1"
      - name: construction_start_date
        type: string
        source: input
        description: Chain-root date used as the earliest_start of every milestone with no predecessor.
        constraints: ISO 8601 date (YYYY-MM-DD)
      - name: target_opening_date
        type: string
        source: input
        description: Contractual first-guest date; slip is measured against this.
        constraints: ISO 8601 date, must be > construction_start_date
      - name: licensing_buffer_days
        type: integer
        source: input
        description: Days added to the schedule project_finish to obtain projected_opening_date.
        default: 14
        constraints: 0..120
      - name: rework_buffer_days
        type: integer
        source: input
        description: Extra days the COMMITTED schedule variant inserts after any predecessor whose rework_count > 0.
        default: 3
        constraints: 0..60
      - name: slip_tolerance_days
        type: integer
        source: input
        description: schedule_slip_days above this value forces readiness_posture RESTRICTED.
        default: 10
        constraints: 0..120
      - name: storage_capacity_pallets
        type: integer
        source: input
        description: Aggregate pallet positions available in the pre-opening storage/receiving area.
        constraints: ">= 1"
      - name: relocation_rate_cents
        type: integer
        source: input
        description: Per-room-night relocation cost used by the cancellation-contingency calculation.
        constraints: ">= 0"
      - name: guarantee_penalty_cents
        type: integer
        source: input
        description: Flat penalty added to a GUARANTEED block's contingency, after the admin-fee tier is selected.
        constraints: ">= 0"
      - name: room_night_ceiling
        type: integer
        source: input
        description: Maximum room-nights that may be held by non-terminal ReservationBlocks before opening.
        constraints: ">= 0"
      - name: contingency_liability_cap_cents
        type: integer
        source: input
        description: Ceiling on contingency_liability_cents; a new block that would breach it is rejected.
        constraints: ">= 0"
      - name: stabilization_window_days
        type: integer
        source: input
        description: Days that must elapse after soft_opening_date before stabilization is allowed.
        default: 30
        constraints: 0..365
      - name: schedule_state
        type: enum
        source: system
        description: Delivery dimension of the program.
        default: PLANNING
        constraints: "PLANNING | BASELINED | CONSTRUCTION_COMPLETE | LICENSING | SOFT_OPENING | STABILIZED"
      - name: commercial_state
        type: enum
        source: system
        description: Sales/reservation dimension of the program; evolves independently of schedule_state.
        default: BOOKING_CLOSED
        constraints: "BOOKING_CLOSED | BOOKING_OPEN | BOOKING_SUSPENDED | SELLING_STABILIZED"
      - name: readiness_posture
        type: enum
        source: computed
        description: Derived gate over children; recomputed after every mutation that touches a child of this program.
        default: MOBILIZING
        constraints: "MOBILIZING | ON_TRACK | RESTRICTED | FROZEN"
      - name: readiness_score
        type: number
        source: computed
        description: Weighted readiness score, 4 decimal places.
        default: 0.0
        constraints: 0.0000..1.0000
      - name: projected_opening_date_optimistic
        type: string
        source: computed
        description: OPTIMISTIC variant of projected opening (plan durations, blocked days ignored).
        constraints: ISO 8601 date, null until first schedule computation
      - name: projected_opening_date_committed
        type: string
        source: computed
        description: COMMITTED variant of projected opening (blocked days and rework buffers absorbed).
        constraints: ISO 8601 date, null until first schedule computation
      - name: projected_opening_date
        type: string
        source: computed
        description: Authoritative projected opening; always equals projected_opening_date_committed.
        constraints: ISO 8601 date
      - name: schedule_slip_days
        type: integer
        source: computed
        description: max(0, projected_opening_date_committed - target_opening_date) in whole days.
        default: 0
        constraints: ">= 0"
      - name: critical_path_milestone_count
        type: integer
        source: computed
        description: Count of this program's milestones with total_float_days == 0.
        default: 0
      - name: open_critical_punch_count
        type: integer
        source: computed
        description: Count of this program's PunchListItems with severity CRITICAL and state != VERIFIED.
        default: 0
      - name: required_system_count
        type: integer
        source: computed
        description: Count of this program's SystemImplementations with is_required true.
        default: 0
      - name: certified_system_count
        type: integer
        source: computed
        description: Count of this program's SystemImplementations with is_required true and state CERTIFIED.
        default: 0
      - name: issued_mandatory_permit_count
        type: integer
        source: computed
        description: Distinct mandatory permit_types of this program in state ISSUED (0..4).
        default: 0
      - name: hiring_plan_count
        type: integer
        source: computed
        description: Count of this program's DepartmentHiringPlans.
        default: 0
      - name: departments_ready_count
        type: integer
        source: computed
        description: Count of this program's DepartmentHiringPlans with readiness_flag READY.
        default: 0
      - name: committed_room_nights
        type: integer
        source: computed
        description: Conserved quantity - sum of room_nights over this program's ReservationBlocks in state ACCEPTED, GUARANTEED or AT_RISK.
        default: 0
      - name: contingency_liability_cents
        type: integer
        source: computed
        description: Sum of contingency_cents over this program's pre-opening ReservationBlocks in ACCEPTED, GUARANTEED or AT_RISK.
        default: 0
      - name: payroll_accrual_cents
        type: integer
        source: computed
        description: Projected pre-opening payroll to projected_opening_date_committed, rounded per hire then summed.
        default: 0
      - name: cost_at_completion_commitment_cents
        type: integer
        source: computed
        description: COMMITMENT_BASIS variant of pre-opening cost at completion.
        default: 0
      - name: cost_at_completion_accrual_cents
        type: integer
        source: computed
        description: ACCRUAL_BASIS variant of pre-opening cost at completion.
        default: 0
      - name: soft_opening_date
        type: string
        source: system
        description: Date the soft opening was authorized for; null before authorization.
        constraints: ISO 8601 date or null
      - name: baselined_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramDirector who baselined the schedule; null before baselining.
      - name: soft_opening_authorized_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramDirector who authorized the soft opening; null before authorization.

  - name: Milestone
    parent: PreOpeningProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> PreOpeningProgram.id; owning program.
      - name: code
        type: string
        source: input
        description: Stable milestone code; CONSTRUCTION_COMPLETE and CO_ISSUANCE carry program-level meaning.
        constraints: UPPER_SNAKE_CASE, unique per program_id
      - name: name
        type: string
        source: input
        description: Human label.
        constraints: 1..120 chars
      - name: duration_days
        type: integer
        source: input
        description: Planned duration in whole days.
        constraints: ">= 1"
      - name: planned_start_date
        type: string
        source: input
        description: Baseline start; used only as the topological tie-break sort key.
        constraints: ISO 8601 date
      - name: state
        type: enum
        source: system
        description: Milestone lifecycle state.
        default: NOT_STARTED
        constraints: "NOT_STARTED | IN_PROGRESS | BLOCKED | COMPLETE | REOPENED"
      - name: actual_start_date
        type: string
        source: system
        description: Logical-clock date at the moment /start was accepted; null before start.
        constraints: ISO 8601 date or null
      - name: actual_finish_date
        type: string
        source: system
        description: Logical-clock date at the moment /complete was accepted; null until complete.
        constraints: ISO 8601 date or null
      - name: actual_duration_days
        type: integer
        source: computed
        description: actual_finish_date - actual_start_date in whole days; null until the first completion, retained while BLOCKED, cleared by reopen.
      - name: blocked_days_accrued
        type: integer
        source: system
        description: Cumulative permit-review days charged to this milestone by deficiency cascades.
        default: 0
        constraints: ">= 0"
      - name: rework_count
        type: integer
        source: system
        description: Number of times this milestone has been reopened after completion.
        default: 0
      - name: earliest_start_date
        type: string
        source: computed
        description: Forward-pass earliest start under the COMMITTED variant.
        constraints: ISO 8601 date or null
      - name: earliest_finish_date
        type: string
        source: computed
        description: Forward-pass earliest finish under the COMMITTED variant.
        constraints: ISO 8601 date or null
      - name: latest_finish_date
        type: string
        source: computed
        description: Backward-pass latest finish under the COMMITTED variant.
        constraints: ISO 8601 date or null
      - name: total_float_days
        type: integer
        source: computed
        description: latest_finish_date - earliest_finish_date in whole days.
      - name: is_critical
        type: boolean
        source: computed
        description: true when total_float_days == 0.
        default: false

  - name: MilestoneDependency
    parent: Milestone
    common_fields: false
    fields:
      - name: predecessor_milestone_id
        type: string
        source: input
        description: FK -> Milestone.id; the driving milestone.
      - name: successor_milestone_id
        type: string
        source: input
        description: FK -> Milestone.id; the driven milestone.
      - name: dependency_type
        type: enum
        source: input
        description: Relationship geometry used by the forward pass.
        default: FINISH_START
        constraints: "FINISH_START | START_START"
      - name: lag_days
        type: integer
        source: input
        description: Whole days inserted between the driving date and the successor start.
        default: 0
        constraints: 0..120

  - name: PermitApplication
    parent: PreOpeningProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> PreOpeningProgram.id; owning program.
      - name: gating_milestone_id
        type: string
        source: input
        description: FK -> Milestone.id; construction milestone that must be COMPLETE before submission, and that absorbs deficiency review days.
      - name: permit_type
        type: enum
        source: input
        description: Approval being pursued.
        constraints: "CERTIFICATE_OF_OCCUPANCY | LIQUOR_LICENSE | FOOD_SERVICE | ELEVATOR | FIRE_ALARM | SIGNAGE; unique per (program_id, permit_type)"
      - name: is_mandatory
        type: boolean
        source: computed
        description: true when permit_type is one of the four opening-mandatory types (CERTIFICATE_OF_OCCUPANCY, LIQUOR_LICENSE, FOOD_SERVICE, ELEVATOR).
      - name: review_days
        type: integer
        source: input
        description: Statutory review duration; charged to the gating milestone on a deficiency finding.
        constraints: 1..180
      - name: state
        type: enum
        source: system
        description: Application lifecycle state.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | DEFICIENT | ISSUED"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submission; null in DRAFT.
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance; null unless ISSUED.
      - name: resubmission_count
        type: integer
        source: system
        description: Number of submissions after the first (each DEFICIENT -> SUBMITTED hop increments it).
        default: 0
      - name: deficiency_reason
        type: string
        source: system
        description: Reason recorded by the most recent deficiency finding; null unless DEFICIENT.

  - name: SystemImplementation
    parent: PreOpeningProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> PreOpeningProgram.id; owning program.
      - name: system_type
        type: enum
        source: input
        description: Property system being implemented.
        constraints: "PMS | POS | KEY | REVENUE; unique per (program_id, system_type)"
      - name: prerequisite_system_id
        type: string
        source: input
        description: FK -> SystemImplementation.id; interface prerequisite that must be CERTIFIED first. Null when the system stands alone.
      - name: is_required
        type: boolean
        source: input
        description: Whether certification of this system gates soft opening.
        default: true
      - name: state
        type: enum
        source: system
        description: Implementation/testing state.
        default: PLANNED
        constraints: "PLANNED | TESTING | FAILED | CERTIFIED"
      - name: latest_pass_rate
        type: number
        source: computed
        description: Pass rate of the most recent SystemTestRun, 4 decimal places; null with zero runs.
      - name: cumulative_pass_rate
        type: number
        source: computed
        description: Pooled pass rate across every SystemTestRun of this system, 4 decimal places; null with zero runs.
      - name: open_blocker_count
        type: integer
        source: computed
        description: blocker_count of the most recent SystemTestRun; 0 with zero runs.
        default: 0
      - name: test_run_count
        type: integer
        source: computed
        description: Number of SystemTestRuns recorded against this system.
        default: 0
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID that certified the system; cleared when the system returns to TESTING.
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant of certification; cleared on decertification.

  - name: SystemTestRun
    parent: SystemImplementation
    common_fields: false
    fields:
      - name: system_implementation_id
        type: string
        source: input
        description: FK -> SystemImplementation.id; system under test.
      - name: executed_at
        type: datetime
        source: input
        description: Instant the run finished; primary sort key for "most recent run".
      - name: cases_total
        type: integer
        source: input
        description: Test cases executed in this run.
        constraints: ">= 0 (0 is rejected by ERR_TEST_RUN_EMPTY)"
      - name: cases_passed
        type: integer
        source: input
        description: Test cases that passed.
        constraints: 0..cases_total
      - name: blocker_count
        type: integer
        source: input
        description: Open blocking defects at the end of the run.
        constraints: ">= 0"
      - name: pass_rate
        type: number
        source: computed
        description: cases_passed / cases_total, 4 decimal places.
      - name: result
        type: enum
        source: computed
        description: PASSED when pass_rate >= 0.95 and blocker_count == 0, else FAILED.
        constraints: "PASSED | FAILED"
      - name: executed_by_user_id
        type: string
        source: system
        description: X-User-ID that recorded the run; used by the certification segregation-of-duties check.

  - name: DepartmentHiringPlan
    parent: PreOpeningProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> PreOpeningProgram.id; owning program.
      - name: department
        type: enum
        source: input
        description: Department the plan staffs.
        constraints: "ROOMS | FOOD_BEVERAGE | ENGINEERING | SALES_MARKETING | ADMIN; unique per (program_id, department)"
      - name: headcount_target
        type: integer
        source: input
        description: Approved headcount for this department.
        constraints: ">= 1"
      - name: wave_start_date
        type: string
        source: input
        description: Staggered department start date; no hire may start earlier.
        constraints: ISO 8601 date
      - name: offered_count
        type: integer
        source: computed
        description: Hires of this plan in state OFFERED, ACCEPTED or ONBOARDED.
        default: 0
      - name: accepted_count
        type: integer
        source: computed
        description: Hires of this plan in state ACCEPTED or ONBOARDED.
        default: 0
      - name: onboarded_count
        type: integer
        source: computed
        description: Hires of this plan in state ONBOARDED.
        default: 0
      - name: staffing_ratio
        type: number
        source: computed
        description: onboarded_count / headcount_target, 4 decimal places.
        default: 0.0
      - name: readiness_flag
        type: enum
        source: computed
        description: READY when onboarded_count * 100 >= headcount_target * 80, else NOT_READY.
        default: NOT_READY
        constraints: "NOT_READY | READY"

  - name: Hire
    parent: DepartmentHiringPlan
    common_fields: true
    fields:
      - name: hiring_plan_id
        type: string
        source: input
        description: FK -> DepartmentHiringPlan.id; plan this hire counts against.
      - name: orientation_session_id
        type: string
        source: input
        description: FK -> TrainingSession.id; mandatory orientation the hire is enrolled in. Null until assigned.
      - name: full_name
        type: string
        source: input
        description: Employee name.
        constraints: 1..120 chars
      - name: hourly_rate_cents
        type: number
        source: input
        description: Hourly rate in cents; may carry fractional cents.
        constraints: "> 0"
      - name: scheduled_hours_per_day
        type: number
        source: input
        description: Scheduled hours per pre-opening day.
        constraints: 0.5..12
      - name: start_date
        type: string
        source: input
        description: First payroll day; must be >= the plan's wave_start_date.
        constraints: ISO 8601 date
      - name: state
        type: enum
        source: system
        description: Hire lifecycle state.
        default: OFFERED
        constraints: "OFFERED | ACCEPTED | DECLINED | ONBOARDED | WITHDRAWN"
      - name: accrual_cents
        type: integer
        source: computed
        description: round_half_up(hourly_rate_cents * scheduled_hours_per_day * pre_opening_days); 0 unless state is ACCEPTED or ONBOARDED.
        default: 0
      - name: onboarded_at
        type: datetime
        source: system
        description: Logical-clock instant of onboarding; null before.

  - name: TrainingSession
    parent: PreOpeningProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> PreOpeningProgram.id; owning program.
      - name: title
        type: string
        source: input
        description: Session title.
        constraints: 1..120 chars
      - name: department
        type: enum
        source: input
        description: Department the session serves; ALL means every department may enroll.
        default: ALL
        constraints: "ALL | ROOMS | FOOD_BEVERAGE | ENGINEERING | SALES_MARKETING | ADMIN"
      - name: training_room_code
        type: string
        source: input
        description: Physical training room; the occupancy resource guarded by the turnover-buffer overlap rule.
        constraints: 1..16 chars
      - name: starts_at
        type: datetime
        source: input
        description: Session start (inclusive).
      - name: ends_at
        type: datetime
        source: input
        description: Session end (exclusive); must be > starts_at.
      - name: capacity
        type: integer
        source: input
        description: Maximum enrolled hires.
        constraints: ">= 1"
      - name: enrolled_count
        type: integer
        source: computed
        description: Hires whose orientation_session_id is this session and whose state is not DECLINED or WITHDRAWN.
        default: 0
      - name: state
        type: enum
        source: system
        description: Session state.
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | CANCELLED"

  - name: BudgetLine
    parent: PreOpeningProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> PreOpeningProgram.id; owning program.
      - name: category
        type: enum
        source: input
        description: Pre-opening spend category.
        constraints: "PAYROLL | MARKETING | SETUP; unique per (program_id, category)"
      - name: authorized_cents
        type: integer
        source: input
        description: Conserved quantity - authorized budget; never mutated by order activity.
        constraints: ">= 0"
      - name: committed_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this line's OseOrders in state COMMITTED.
        default: 0
      - name: spent_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this line's OseOrders in state STORED.
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: authorized_cents - committed_cents - spent_cents.
        default: 0

  - name: OseOrder
    parent: BudgetLine
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> PreOpeningProgram.id; owning program (must match the budget line's program).
      - name: budget_line_id
        type: string
        source: input
        description: FK -> BudgetLine.id; line the commitment is charged to.
      - name: description
        type: string
        source: input
        description: Operating supplies and equipment being purchased.
        constraints: 1..200 chars
      - name: amount_cents
        type: integer
        source: input
        description: Committed value of the order.
        constraints: ">= 1"
      - name: pallet_count
        type: integer
        source: input
        description: Pallet positions the shipment occupies for the whole delivery window.
        constraints: ">= 1"
      - name: delivery_window_start
        type: string
        source: input
        description: First date the shipment may arrive (inclusive).
        constraints: ISO 8601 date
      - name: delivery_window_end
        type: string
        source: input
        description: Exclusive end of the delivery window; must be > delivery_window_start.
        constraints: ISO 8601 date
      - name: state
        type: enum
        source: system
        description: Order lifecycle state.
        default: COMMITTED
        constraints: "COMMITTED | STORED | CANCELLED"
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant of receipt; null unless STORED.
      - name: stored_bay_code
        type: string
        source: input
        description: Storage bay label recorded at receipt; null unless STORED.
        constraints: 1..16 chars

  - name: ReservationBlock
    parent: PreOpeningProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> PreOpeningProgram.id; owning program.
      - name: account_name
        type: string
        source: input
        description: Booking account.
        constraints: 1..120 chars
      - name: arrival_date
        type: string
        source: input
        description: Arrival date; must not be before the logical clock date.
        constraints: ISO 8601 date
      - name: night_count
        type: integer
        source: input
        description: Nights held.
        constraints: 1..30
      - name: room_count
        type: integer
        source: input
        description: Rooms held per night.
        constraints: ">= 1"
      - name: rate_cents
        type: integer
        source: input
        description: Nightly rate per room.
        constraints: ">= 0"
      - name: room_nights
        type: integer
        source: computed
        description: room_count * night_count.
      - name: revenue_cents
        type: integer
        source: computed
        description: room_nights * rate_cents.
      - name: is_pre_opening
        type: boolean
        source: computed
        description: true when arrival_date < program.projected_opening_date_committed.
        default: false
      - name: contingency_cents
        type: integer
        source: computed
        description: Cancellation contingency for this block; 0 when is_pre_opening is false or the state is terminal.
        default: 0
      - name: state
        type: enum
        source: system
        description: Block lifecycle state.
        default: ACCEPTED
        constraints: "ACCEPTED | GUARANTEED | AT_RISK | RELOCATED | CANCELLED | HONORED"
      - name: at_risk_reason
        type: string
        source: system
        description: "Reason recorded when the block was moved to AT_RISK; exactly PERMIT_DEFICIENCY when the freeze was caused by a mandatory PermitApplication in state DEFICIENT, otherwise CRITICAL_PUNCH_OPEN when it was caused by open_critical_punch_count > 0; null in every other state."
        constraints: "PERMIT_DEFICIENCY | CRITICAL_PUNCH_OPEN | null" 

  - name: PunchListItem
    parent: PreOpeningProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> PreOpeningProgram.id; owning program.
      - name: milestone_id
        type: string
        source: input
        description: FK -> Milestone.id; milestone whose completion this defect blocks. Null when unattributed.
      - name: description
        type: string
        source: input
        description: Defect description.
        constraints: 1..200 chars
      - name: severity
        type: enum
        source: input
        description: Defect severity; CRITICAL items freeze the program while unverified.
        constraints: "CRITICAL | MAJOR | MINOR"
      - name: state
        type: enum
        source: system
        description: Closure state.
        default: OPEN
        constraints: "OPEN | READY_FOR_VERIFICATION | REJECTED | VERIFIED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID that last submitted the item for verification; null until submitted.
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID that verified the item; null unless VERIFIED.
      - name: rejection_count
        type: integer
        source: system
        description: Number of times verification was rejected.
        default: 0
      - name: blocks_certificate_of_occupancy
        type: boolean
        source: computed
        description: true when severity is CRITICAL and state != VERIFIED.
        default: false

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PreOpeningProgram
    state_field: schedule_state
    initial_state: PLANNING
    terminal_states: [STABILIZED]
    transitions:
      - from: PLANNING
        to: BASELINED
        trigger: "POST /pre-opening/programs/{id}/baseline-schedule"
        actor: ProgramDirector
        preconditions:
          - "schedule_state == PLANNING"
          - "program has >= 1 Milestone (else ERR_SCHEDULE_EMPTY)"
          - "the milestone dependency graph is acyclic"
        side_effects:
          - "run calculations.critical_path_schedule; write earliest_start_date, earliest_finish_date, latest_finish_date, total_float_days, is_critical on every Milestone"
          - "write projected_opening_date_optimistic, projected_opening_date_committed, projected_opening_date, schedule_slip_days, critical_path_milestone_count"
          - "set baselined_by_user_id = X-User-ID"
          - "run calculations.readiness_posture; write readiness_score and readiness_posture"
          - "increments PreOpeningProgram.version by 1"
      - from: BASELINED
        to: CONSTRUCTION_COMPLETE
        trigger: "system: a Milestone with code == 'CONSTRUCTION_COMPLETE' reaches state COMPLETE"
        actor: system
        preconditions:
          - "schedule_state == BASELINED"
        side_effects:
          - "no further Milestone may be created for this program"
          - "run calculations.readiness_posture"
      - from: CONSTRUCTION_COMPLETE
        to: LICENSING
        trigger: "system: the first PermitApplication of this program with is_mandatory true reaches state SUBMITTED"
        actor: system
        preconditions:
          - "schedule_state == CONSTRUCTION_COMPLETE"
        side_effects:
          - "run calculations.readiness_posture"
      - from: LICENSING
        to: SOFT_OPENING
        trigger: "POST /pre-opening/programs/{id}/authorize-soft-opening"
        actor: ProgramDirector
        preconditions:
          - "schedule_state == LICENSING"
          - "issued_mandatory_permit_count == 4 (else ERR_MANDATORY_PERMIT_NOT_ISSUED)"
          - "open_critical_punch_count == 0 (else ERR_CRITICAL_PUNCH_OPEN)"
          - "certified_system_count == required_system_count (else ERR_SYSTEM_NOT_CERTIFIED)"
          - "hiring_plan_count >= 1 and departments_ready_count == hiring_plan_count (else ERR_DEPARTMENT_NOT_READY)"
          - "readiness_posture != FROZEN (else ERR_PROGRAM_FROZEN)"
          - "clock_date <= soft_opening_date <= projected_opening_date_committed (else ERR_SOFT_OPENING_DATE_INVALID)"
          - "X-User-ID != baselined_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "set soft_opening_date and soft_opening_authorized_by_user_id"
          - "run calculations.readiness_posture"
          - "increments PreOpeningProgram.version by 1"
      - from: SOFT_OPENING
        to: LICENSING
        trigger: "system: readiness_posture becomes FROZEN while schedule_state == SOFT_OPENING"
        actor: system
        preconditions:
          - "schedule_state == SOFT_OPENING"
          - "readiness_posture transitioned to FROZEN"
        side_effects:
          - "clear soft_opening_date and soft_opening_authorized_by_user_id (compensation of the authorize transition)"
      - from: SOFT_OPENING
        to: STABILIZED
        trigger: "POST /pre-opening/programs/{id}/transition-to-stabilized"
        actor: ProgramDirector
        preconditions:
          - "schedule_state == SOFT_OPENING"
          - "every PunchListItem of this program is in state VERIFIED (else ERR_PUNCH_LIST_OPEN)"
          - "no OseOrder of this program is in state COMMITTED (else ERR_OSE_ORDER_PENDING)"
          - "clock_date >= soft_opening_date + stabilization_window_days (else ERR_STABILIZATION_WINDOW_NOT_ELAPSED)"
        side_effects:
          - "commercial_state BOOKING_OPEN -> SELLING_STABILIZED"
          - "every ReservationBlock of this program in state GUARANTEED -> HONORED"
          - "run calculations.contingency_liability; contingency_liability_cents drops to 0 because no non-terminal pre-opening block remains"
          - "increments PreOpeningProgram.version by 1"

  - entity: PreOpeningProgram
    state_field: commercial_state
    initial_state: BOOKING_CLOSED
    terminal_states: [SELLING_STABILIZED]
    transitions:
      - from: BOOKING_CLOSED
        to: BOOKING_OPEN
        trigger: "POST /pre-opening/programs/{id}/open-booking"
        actor: CommercialDirector
        preconditions:
          - "commercial_state == BOOKING_CLOSED"
          - "schedule_state IN {CONSTRUCTION_COMPLETE, LICENSING, SOFT_OPENING} (else ERR_INVALID_PROGRAM_STATE)"
          - "readiness_posture != FROZEN (else ERR_PROGRAM_FROZEN)"
        side_effects:
          - "increments PreOpeningProgram.version by 1"
      - from: BOOKING_OPEN
        to: BOOKING_SUSPENDED
        trigger: "POST /pre-opening/programs/{id}/suspend-booking"
        actor: CommercialDirector
        preconditions:
          - "commercial_state == BOOKING_OPEN"
        side_effects:
          - "increments PreOpeningProgram.version by 1"
      - from: BOOKING_OPEN
        to: BOOKING_SUSPENDED
        trigger: "system: readiness_posture becomes FROZEN"
        actor: system
        preconditions:
          - "commercial_state == BOOKING_OPEN"
        side_effects:
          - "every ReservationBlock in ACCEPTED or GUARANTEED whose arrival_date < projected_opening_date_committed -> AT_RISK"
          - "at_risk_reason = PERMIT_DEFICIENCY when a mandatory PermitApplication of the program is in state DEFICIENT, else CRITICAL_PUNCH_OPEN"
          - "run calculations.contingency_liability"
      - from: BOOKING_SUSPENDED
        to: BOOKING_OPEN
        trigger: "POST /pre-opening/programs/{id}/open-booking (cycle back after suspension)"
        actor: CommercialDirector
        preconditions:
          - "commercial_state == BOOKING_SUSPENDED"
          - "readiness_posture != FROZEN (else ERR_PROGRAM_FROZEN)"
        side_effects:
          - "every ReservationBlock of this program in state AT_RISK whose arrival_date >= projected_opening_date_committed -> ACCEPTED, at_risk_reason cleared"
          - "run calculations.contingency_liability"
          - "increments PreOpeningProgram.version by 1"
      - from: BOOKING_OPEN
        to: SELLING_STABILIZED
        trigger: "system: schedule_state reaches STABILIZED"
        actor: system
        preconditions:
          - "commercial_state == BOOKING_OPEN"
        side_effects:
          - "no new ReservationBlock may be created for this program"

  - entity: Milestone
    state_field: state
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /pre-opening/milestones/{id}/start"
        actor: ConstructionManager
        preconditions:
          - "state == NOT_STARTED"
          - "program.schedule_state IN {BASELINED, CONSTRUCTION_COMPLETE, LICENSING} (else ERR_INVALID_PROGRAM_STATE)"
          - "every predecessor joined by a FINISH_START MilestoneDependency is in state COMPLETE (else ERR_PREDECESSOR_NOT_COMPLETE)"
        side_effects:
          - "actual_start_date = logical clock date"
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /pre-opening/milestones/{id}/start"
        actor: ConstructionManager
        preconditions:
          - "state == REOPENED"
          - "every predecessor joined by a FINISH_START MilestoneDependency is in state COMPLETE"
        side_effects:
          - "actual_start_date = logical clock date; actual_finish_date cleared"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /pre-opening/milestones/{id}/complete"
        actor: ConstructionManager
        preconditions:
          - "state == IN_PROGRESS"
          - "no PunchListItem with milestone_id == this milestone has severity CRITICAL and state != VERIFIED (else ERR_CRITICAL_PUNCH_OPEN)"
        side_effects:
          - "actual_finish_date = logical clock date; actual_duration_days = actual_finish_date - actual_start_date"
          - "run calculations.critical_path_schedule for the program"
          - "if code == 'CONSTRUCTION_COMPLETE' then program.schedule_state BASELINED -> CONSTRUCTION_COMPLETE"
          - "run calculations.readiness_posture"
          - "run calculations.cost_at_completion (projected_opening_date moved, so payroll accrual changes)"
      - from: IN_PROGRESS
        to: BLOCKED
        trigger: "system: a PermitApplication whose gating_milestone_id is this milestone is found DEFICIENT"
        actor: system
        preconditions:
          - "state == IN_PROGRESS"
        side_effects:
          - "blocked_days_accrued += permit.review_days"
          - "run calculations.critical_path_schedule for the program"
      - from: COMPLETE
        to: BLOCKED
        trigger: "system: a PermitApplication whose gating_milestone_id is this milestone is found DEFICIENT"
        actor: system
        preconditions:
          - "state == COMPLETE"
        side_effects:
          - "blocked_days_accrued += permit.review_days"
          - "actual_finish_date retained; the schedule keeps using it as the driving finish for successors"
          - "run calculations.critical_path_schedule for the program"
      - from: BLOCKED
        to: IN_PROGRESS
        trigger: "system: the PermitApplication that blocked this milestone returns to state SUBMITTED"
        actor: system
        preconditions:
          - "state == BLOCKED"
        side_effects:
          - "blocked_days_accrued retained (review days already consumed)"
          - "run calculations.critical_path_schedule for the program"
      - from: COMPLETE
        to: REOPENED
        trigger: "POST /pre-opening/milestones/{id}/reopen"
        actor: ConstructionManager
        preconditions:
          - "state == COMPLETE"
          - "program.schedule_state != STABILIZED (else ERR_INVALID_PROGRAM_STATE)"
        side_effects:
          - "rework_count += 1; actual_finish_date cleared; actual_duration_days cleared"
          - "run calculations.critical_path_schedule (COMMITTED variant now inserts rework_buffer_days after this milestone)"
          - "run calculations.readiness_posture"

  - entity: PermitApplication
    state_field: state
    initial_state: DRAFT
    terminal_states: [ISSUED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pre-opening/permit-applications/{id}/submit"
        actor: LicensingCoordinator
        preconditions:
          - "state == DRAFT"
          - "gating Milestone.state == COMPLETE (else ERR_GATING_MILESTONE_NOT_COMPLETE)"
          - "every prerequisite permit_type for this permit_type exists for the program in state ISSUED (else ERR_PERMIT_PREREQUISITE_NOT_MET)"
        side_effects:
          - "submitted_at = logical clock instant"
          - "if is_mandatory and program.schedule_state == CONSTRUCTION_COMPLETE then program.schedule_state -> LICENSING"
          - "run calculations.readiness_posture"
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /pre-opening/permit-applications/{id}/submit (resubmission cycle)"
        actor: LicensingCoordinator
        preconditions:
          - "state == DEFICIENT"
          - "gating Milestone.state IN {COMPLETE, BLOCKED, IN_PROGRESS}"
          - "every prerequisite permit_type for this permit_type is ISSUED"
        side_effects:
          - "resubmission_count += 1; submitted_at refreshed; deficiency_reason cleared"
          - "gating Milestone BLOCKED -> IN_PROGRESS"
          - "run calculations.readiness_posture (the DEFICIENT freeze condition clears)"
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /pre-opening/permit-applications/{id}/record-review with decision ISSUE"
        actor: LicensingCoordinator
        preconditions:
          - "state == SUBMITTED"
        side_effects:
          - "issued_at = logical clock instant"
          - "program.issued_mandatory_permit_count recomputed"
          - "run calculations.readiness_posture"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /pre-opening/permit-applications/{id}/record-review with decision DEFICIENCY"
        actor: LicensingCoordinator
        preconditions:
          - "state == SUBMITTED"
        side_effects:
          - "CASCADE LINK 1: deficiency_reason recorded; state -> DEFICIENT"
          - "CASCADE LINK 2 (caused by link 1): the gating Milestone absorbs the review cost - blocked_days_accrued += review_days and IN_PROGRESS|COMPLETE -> BLOCKED"
          - "CASCADE LINK 3 (caused by link 2): calculations.critical_path_schedule reruns because a milestone duration input changed - projected_opening_date_committed and schedule_slip_days move"
          - "CASCADE LINK 4 (caused by link 3): calculations.readiness_posture reruns on the new slip figure and, because a mandatory permit is DEFICIENT, readiness_posture -> FROZEN"
          - "CASCADE LINK 5 (caused by link 4): commercial_state BOOKING_OPEN -> BOOKING_SUSPENDED and every ReservationBlock in ACCEPTED or GUARANTEED whose arrival_date < the NEW projected_opening_date_committed -> AT_RISK with at_risk_reason 'PERMIT_DEFICIENCY'; calculations.contingency_liability reruns"

  - entity: SystemImplementation
    state_field: state
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: TESTING
        trigger: "POST /pre-opening/system-implementations/{id}/test-runs"
        actor: SystemsIntegrator
        preconditions:
          - "state == PLANNED"
          - "cases_total >= 1 (else ERR_TEST_RUN_EMPTY)"
        side_effects:
          - "create SystemTestRun; run calculations.system_test_aggregation"
          - "if latest_pass_rate < 0.50 then state -> FAILED instead of TESTING"
      - from: TESTING
        to: TESTING
        trigger: "POST /pre-opening/system-implementations/{id}/test-runs (retest)"
        actor: SystemsIntegrator
        preconditions:
          - "state == TESTING"
          - "cases_total >= 1"
        side_effects:
          - "create SystemTestRun; run calculations.system_test_aggregation"
          - "if latest_pass_rate < 0.50 then state -> FAILED"
      - from: FAILED
        to: TESTING
        trigger: "POST /pre-opening/system-implementations/{id}/test-runs (recovery cycle)"
        actor: SystemsIntegrator
        preconditions:
          - "state == FAILED"
          - "cases_total >= 1"
          - "latest_pass_rate of the new run >= 0.50"
        side_effects:
          - "create SystemTestRun; run calculations.system_test_aggregation"
      - from: TESTING
        to: CERTIFIED
        trigger: "POST /pre-opening/system-implementations/{id}/certify"
        actor: SystemsIntegrator
        preconditions:
          - "state == TESTING"
          - "latest_pass_rate >= 0.95 (else ERR_SYSTEM_PASS_RATE_BELOW_THRESHOLD)"
          - "open_blocker_count == 0 (else ERR_OPEN_BLOCKERS_PRESENT)"
          - "prerequisite_system_id is null or that SystemImplementation.state == CERTIFIED (else ERR_PREREQUISITE_SYSTEM_NOT_CERTIFIED)"
          - "X-User-ID != executed_by_user_id of the most recent SystemTestRun (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "certified_by_user_id = X-User-ID; certified_at = logical clock instant"
          - "program.certified_system_count recomputed; run calculations.readiness_posture"
      - from: CERTIFIED
        to: TESTING
        trigger: "POST /pre-opening/system-implementations/{id}/test-runs (decertification cycle)"
        actor: SystemsIntegrator
        preconditions:
          - "state == CERTIFIED"
          - "cases_total >= 1"
        side_effects:
          - "certified_by_user_id and certified_at cleared (compensation of the certify transition)"
          - "program.certified_system_count recomputed; run calculations.readiness_posture"

  - entity: Hire
    state_field: state
    initial_state: OFFERED
    terminal_states: [DECLINED, WITHDRAWN]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /pre-opening/hires/{id}/respond with decision ACCEPT"
        actor: TalentManager
        preconditions:
          - "state == OFFERED"
        side_effects:
          - "plan.accepted_count += 1"
          - "run calculations.cost_at_completion (the hire now enters the payroll accrual set)"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /pre-opening/hires/{id}/respond with decision DECLINE"
        actor: TalentManager
        preconditions:
          - "state == OFFERED"
        side_effects:
          - "plan.offered_count -= 1; plan.staffing_ratio and plan.readiness_flag recomputed"
          - "if orientation_session_id is set, that TrainingSession.enrolled_count -= 1"
          - "run calculations.readiness_posture"
      - from: ACCEPTED
        to: ONBOARDED
        trigger: "POST /pre-opening/hires/{id}/onboard"
        actor: TalentManager
        preconditions:
          - "state == ACCEPTED"
          - "orientation_session_id is not null and that TrainingSession.state == COMPLETED (else ERR_ORIENTATION_NOT_COMPLETED)"
          - "logical clock date >= start_date (else ERR_INVALID_HIRE_STATE)"
        side_effects:
          - "CASCADE LINK 1: onboarded_at set; state -> ONBOARDED"
          - "CASCADE LINK 2 (caused by link 1): plan.onboarded_count += 1, plan.staffing_ratio recomputed and plan.readiness_flag flips NOT_READY -> READY once onboarded_count * 100 >= headcount_target * 80"
          - "CASCADE LINK 3 (caused by link 2): program.departments_ready_count += 1, so calculations.readiness_posture reruns and readiness_score rises by the staffing term"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /pre-opening/hires/{id}/respond with decision WITHDRAW"
        actor: TalentManager
        preconditions:
          - "state == ACCEPTED"
        side_effects:
          - "plan.offered_count -= 1; plan.accepted_count -= 1; plan.readiness_flag recomputed"
          - "if orientation_session_id is set, that TrainingSession.enrolled_count -= 1"
          - "run calculations.cost_at_completion (the hire leaves the payroll accrual set)"

  - entity: OseOrder
    state_field: state
    initial_state: COMMITTED
    terminal_states: [STORED, CANCELLED]
    transitions:
      - from: COMMITTED
        to: STORED
        trigger: "POST /pre-opening/ose-orders/{id}/receive"
        actor: ProcurementManager
        preconditions:
          - "state == COMMITTED"
          - "delivery_window_start <= received_at date < delivery_window_end (else ERR_DELIVERY_OUTSIDE_WINDOW)"
          - "program.readiness_posture != FROZEN (else ERR_PROGRAM_FROZEN)"
        side_effects:
          - "received_at and stored_bay_code set"
          - "budget_line.committed_cents -= amount_cents; budget_line.spent_cents += amount_cents; available_cents unchanged"
          - "increments BudgetLine.version by 1"
          - "run calculations.cost_at_completion"
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /pre-opening/ose-orders/{id}/cancel"
        actor: ProcurementManager
        preconditions:
          - "state == COMMITTED"
        side_effects:
          - "budget_line.committed_cents -= amount_cents; budget_line.available_cents += amount_cents; authorized_cents unchanged (compensating invariant)"
          - "the order's pallet_count leaves the storage overlap set"
          - "increments BudgetLine.version by 1"
          - "run calculations.cost_at_completion"

  - entity: ReservationBlock
    state_field: state
    initial_state: ACCEPTED
    terminal_states: [RELOCATED, CANCELLED, HONORED]
    transitions:
      - from: ACCEPTED
        to: GUARANTEED
        trigger: "POST /pre-opening/reservation-blocks/{id}/guarantee"
        actor: CommercialDirector
        preconditions:
          - "state == ACCEPTED"
          - "program.commercial_state == BOOKING_OPEN (else ERR_BOOKING_NOT_OPEN)"
          - "program.readiness_posture != FROZEN (else ERR_PROGRAM_FROZEN)"
        side_effects:
          - "run calculations.contingency_liability - this block's contingency_cents gains program.guarantee_penalty_cents"
          - "program.contingency_liability_cents recomputed"
      - from: ACCEPTED
        to: AT_RISK
        trigger: "system: readiness_posture becomes FROZEN and arrival_date < projected_opening_date_committed"
        actor: system
        preconditions:
          - "state == ACCEPTED"
        side_effects:
          - "at_risk_reason recorded"
          - "run calculations.contingency_liability"
      - from: GUARANTEED
        to: AT_RISK
        trigger: "system: readiness_posture becomes FROZEN and arrival_date < projected_opening_date_committed"
        actor: system
        preconditions:
          - "state == GUARANTEED"
        side_effects:
          - "at_risk_reason recorded; the guarantee penalty stays in contingency_cents"
          - "run calculations.contingency_liability"
      - from: AT_RISK
        to: ACCEPTED
        trigger: "POST /pre-opening/programs/{id}/open-booking (recovery cycle, arrival_date >= projected_opening_date_committed)"
        actor: CommercialDirector
        preconditions:
          - "state == AT_RISK"
          - "arrival_date >= program.projected_opening_date_committed"
        side_effects:
          - "at_risk_reason cleared; run calculations.contingency_liability"
      - from: AT_RISK
        to: RELOCATED
        trigger: "POST /pre-opening/reservation-blocks/{id}/resolve-contingency with resolution RELOCATE"
        actor: CommercialDirector
        preconditions:
          - "state == AT_RISK"
        side_effects:
          - "room_nights leave program.committed_room_nights; contingency_cents frozen at the value paid out"
          - "run calculations.contingency_liability"
      - from: AT_RISK
        to: CANCELLED
        trigger: "POST /pre-opening/reservation-blocks/{id}/resolve-contingency with resolution CANCEL"
        actor: CommercialDirector
        preconditions:
          - "state == AT_RISK"
        side_effects:
          - "contingency_cents reset to 0; room_nights leave program.committed_room_nights, restoring it to the pre-create value (compensating invariant)"
          - "run calculations.contingency_liability"
      - from: GUARANTEED
        to: HONORED
        trigger: "system: schedule_state reaches STABILIZED"
        actor: system
        preconditions:
          - "state == GUARANTEED"
        side_effects:
          - "contingency_cents reset to 0; room_nights leave program.committed_room_nights"

  - entity: PunchListItem
    state_field: state
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: READY_FOR_VERIFICATION
        trigger: "POST /pre-opening/punch-list-items/{id}/submit-verification"
        actor: ConstructionManager
        preconditions:
          - "state == OPEN"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
      - from: REJECTED
        to: READY_FOR_VERIFICATION
        trigger: "POST /pre-opening/punch-list-items/{id}/submit-verification (rework cycle)"
        actor: ConstructionManager
        preconditions:
          - "state == REJECTED"
        side_effects:
          - "submitted_by_user_id = X-User-ID (overwrites the previous submitter)"
      - from: READY_FOR_VERIFICATION
        to: VERIFIED
        trigger: "POST /pre-opening/punch-list-items/{id}/verify with decision VERIFY"
        actor: QualityInspector
        preconditions:
          - "state == READY_FOR_VERIFICATION"
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_user_id = X-User-ID; blocks_certificate_of_occupancy -> false"
          - "if severity == CRITICAL then program.open_critical_punch_count -= 1 and calculations.readiness_posture reruns (a FROZEN posture can clear here)"
      - from: READY_FOR_VERIFICATION
        to: REJECTED
        trigger: "POST /pre-opening/punch-list-items/{id}/verify with decision REJECT"
        actor: QualityInspector
        preconditions:
          - "state == READY_FOR_VERIFICATION"
          - "X-User-ID != submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "rejection_count += 1"
      - from: VERIFIED
        to: OPEN
        trigger: "POST /pre-opening/punch-list-items/{id}/reopen"
        actor: QualityInspector
        preconditions:
          - "state == VERIFIED"
          - "program.schedule_state != STABILIZED (else ERR_INVALID_PROGRAM_STATE)"
        side_effects:
          - "verified_by_user_id and submitted_by_user_id cleared; blocks_certificate_of_occupancy -> true when severity == CRITICAL"
          - "if severity == CRITICAL then program.open_critical_punch_count += 1, calculations.readiness_posture reruns and readiness_posture -> FROZEN"

  - entity: TrainingSession
    state_field: state
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /pre-opening/training-sessions/{id}/complete"
        actor: TalentManager
        preconditions:
          - "state == SCHEDULED"
          - "logical clock instant >= ends_at (else ERR_TRAINING_SESSION_NOT_ENDED)"
        side_effects:
          - "hires enrolled in this session become eligible for onboarding"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pre-opening/training-sessions/{id}/cancel"
        actor: TalentManager
        preconditions:
          - "state == SCHEDULED"
          - "enrolled_count == 0 (else ERR_TRAINING_SESSION_HAS_ENROLLMENTS)"
        side_effects:
          - "the session's room interval leaves the turnover-buffer overlap set"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-block-create-stale-program
    parent_entity: PreOpeningProgram
    write_endpoint: "POST /pre-opening/reservation-blocks"
    occ_field: "expected_program_version"
    description: |
      Creating a ReservationBlock consumes part of the program's finite
      room_night_ceiling and raises contingency_liability_cents, both of which
      the client must have read before deciding the block fits. A create whose
      expected_program_version no longer matches PreOpeningProgram.version is
      rejected: the client's view of committed_room_nights and
      contingency_liability_cents is stale, so its fit decision cannot be
      trusted even though the ceiling arithmetic would still pass.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: ose-order-create-stale-budget-line
    parameter_note: "OCC guards the budget pool, not the program."
    parent_entity: BudgetLine
    write_endpoint: "POST /pre-opening/ose-orders"
    occ_field: "expected_budget_line_version"
    description: |
      Committing an OseOrder draws down BudgetLine.available_cents. A create
      whose expected_budget_line_version no longer matches BudgetLine.version
      is rejected because the client's available_cents figure predates another
      commitment or receipt against the same line.
    error_id: ERR_STALE_BUDGET_LINE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: critical_path_schedule
    trigger: "POST /programs/{id}/baseline-schedule, POST /programs/{id}/recompute-schedule, Milestone COMPLETE / REOPENED / BLOCKED transitions, MilestoneDependency creation, and the PermitApplication SUBMITTED -> DEFICIENT cascade"
    algorithm: topological
    formula: |
      # Candidate set: every Milestone with program_id == program.id.
      # If that set is empty -> ERR_SCHEDULE_EMPTY (no dates are written).
      # Topological order: Kahn's algorithm over MilestoneDependency edges of
      # this program. When the ready frontier holds more than one milestone, pop
      # them in planned_start_date ASC, then created_at ASC. A remaining non-empty
      # frontier with no zero-in-degree node means a cycle -> ERR_DEPENDENCY_CYCLE.
      #
      # effective_duration(m, variant):
      #   variant == OPTIMISTIC -> m.duration_days
      #                            (blocked_days_accrued is IGNORED)
      #   variant == COMMITTED  -> m.duration_days + m.blocked_days_accrued
      #
      # FORWARD PASS (per variant)
      # for m in topological_order:
      #     if m has no incoming dependency:
      #         ES(m) = program.construction_start_date
      #     else:
      #         drivers = []
      #         for each dep d with successor == m:
      #             p = predecessor(d)
      #             base = (d.dependency_type == FINISH_START) ? EF(p) : ES(p)
      #             candidate = base + d.lag_days
      #             if variant == COMMITTED and p.rework_count > 0:
      #                 candidate = candidate + program.rework_buffer_days
      #             drivers.append(candidate)
      #         ES(m) = max(drivers)
      #     # Actuals, once stamped, override the plan. The test is on the DATE
      #     # FIELDS, not on `state`: a milestone driven COMPLETE -> BLOCKED by a
      #     # permit deficiency keeps its actual_finish_date and therefore keeps
      #     # driving its successors, while `reopen` clears actual_finish_date and
      #     # hands the milestone back to the planned-duration branch.
      #     if m.actual_start_date is not null:
      #         ES(m) = m.actual_start_date
      #     if m.actual_finish_date is not null:
      #         EF(m) = m.actual_finish_date
      #                 + (variant == COMMITTED ? m.blocked_days_accrued : 0)
      #     else:
      #         EF(m) = ES(m) + effective_duration(m, variant)
      #
      # project_finish(variant) = max over milestones of EF(m)
      # projected_opening_date_<variant> = project_finish(variant) + program.licensing_buffer_days
      # projected_opening_date            = projected_opening_date_committed
      # schedule_slip_days = max(0, projected_opening_date_committed - program.target_opening_date)
      #
      # BACKWARD PASS (COMMITTED variant only; these are the persisted floats)
      # rb(m) = (m.rework_count > 0) ? program.rework_buffer_days : 0
      # for m in reverse topological_order:
      #     successors = deps with predecessor == m
      #     if successors is empty:
      #         LF(m) = project_finish(COMMITTED)
      #     else:
      #         LF(m) = min over d in successors of (
      #                   d.dependency_type == FINISH_START
      #                     ? ES(successor(d)) - d.lag_days - rb(m)
      #                     : ES(successor(d)) - d.lag_days - rb(m)
      #                       + effective_duration(m, COMMITTED) )
      #       -- rb(m) mirrors the forward pass exactly, so a milestone that only
      #          drives reworked-predecessor edges keeps zero float.
      #     total_float_days(m) = LF(m) - EF(m)
      #     is_critical(m)      = (total_float_days(m) == 0)
      # critical_path_milestone_count = count of milestones with is_critical true
    input_set: "All Milestones with program_id == program.id, regardless of state; all MilestoneDependency rows whose predecessor and successor both belong to that set."
    constants:
      DATE_UNIT: "whole days; all dates are ISO 8601 calendar dates"
    precision: "Integer days; no fractional dates. Date arithmetic is calendar-day addition."
    variants:
      - name: OPTIMISTIC
        when: "Written to projected_opening_date_optimistic on every run; the read model a scheduler uses to argue the plan still holds."
        difference: "Non-COMPLETE milestones contribute duration_days only; blocked_days_accrued is ignored and no rework_buffer_days is inserted after reworked predecessors."
      - name: COMMITTED
        when: "Written to projected_opening_date_committed AND to the authoritative projected_opening_date; the only variant that feeds schedule_slip_days, the persisted floats, and every downstream gate."
        difference: "Non-COMPLETE milestones contribute duration_days + blocked_days_accrued, and each FINISH_START/START_START edge out of a predecessor with rework_count > 0 adds program.rework_buffer_days. For identical stored data the two variants therefore return different dates."

  - name: cost_at_completion
    trigger: "OseOrder creation / receive / cancel, Hire ACCEPT / DECLINE / WITHDRAW / onboard, and every run of critical_path_schedule (the accrual horizon moves with projected_opening_date_committed)"
    algorithm: aggregation
    formula: |
      # --- per-hire payroll accrual (rounding order is PINNED) ---
      # pre_opening_days(h) = max(0, program.projected_opening_date_committed - h.start_date)
      #                       in whole days, half-open [start_date, projected_opening_date_committed)
      # h.accrual_cents = round_half_up( h.hourly_rate_cents
      #                                  * h.scheduled_hours_per_day
      #                                  * pre_opening_days(h) )
      #   -- ROUND PER HIRE FIRST, THEN SUM. Summing the exact products and
      #      rounding once at the end is NOT the pinned order and yields a
      #      different total whenever the discarded fractions carry.
      # program.payroll_accrual_cents = SUM over h in accrual_set of h.accrual_cents
      #   accrual_set = Hires whose hiring_plan_id belongs to this program and
      #                 whose state IN {ACCEPTED, ONBOARDED}
      #                 (OFFERED, DECLINED and WITHDRAWN are excluded)
      #
      # --- variant COMMITMENT_BASIS ---
      # cost_at_completion_commitment_cents =
      #     SUM over BudgetLine bl of program of (bl.committed_cents + bl.spent_cents)
      #
      # --- variant ACCRUAL_BASIS ---
      # cost_at_completion_accrual_cents =
      #     SUM over BudgetLine bl of program where bl.category != PAYROLL
      #         of (bl.committed_cents + bl.spent_cents)
      #   + (PAYROLL line's spent_cents, or 0 when no PAYROLL line exists)
      #   + program.payroll_accrual_cents
    input_set: "BudgetLines of the program (all three categories); Hires reached through the program's DepartmentHiringPlans with state IN {ACCEPTED, ONBOARDED}."
    constants:
      ROUNDING: round_half_up
    precision: "Whole cents; round_half_up applied once per hire, then summed."
    variants:
      - name: COMMITMENT_BASIS
        when: "Written to cost_at_completion_commitment_cents; the purchase-order view of the pre-opening budget."
        difference: "Counts only money actually committed or spent through BudgetLines. Accepted hires who have not yet started contribute nothing."
      - name: ACCRUAL_BASIS
        when: "Written to cost_at_completion_accrual_cents; the forecast view used for budget escalation."
        difference: "Replaces the PAYROLL line's committed_cents with a forward projection of every ACCEPTED/ONBOARDED hire's wages to projected_opening_date_committed, so the same stored rows yield a different total and the figure moves whenever the schedule moves."

  - name: contingency_liability
    trigger: "ReservationBlock creation, guarantee, AT_RISK cascade, resolve-contingency, HONORED sweep, and every run of critical_path_schedule"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED. The admin fee looks circular ("a percentage
      # of the block's contingency, banded by the contingency's size"), so the
      # order below is normative: base -> tier -> fee -> subtotal -> penalty.
      #
      # for each ReservationBlock rb of the program with
      #     rb.state IN {ACCEPTED, GUARANTEED, AT_RISK}
      #     AND rb.arrival_date < program.projected_opening_date_committed:
      #
      #   1. displaced_room_nights = rb.room_count * rb.night_count
      #   2. base_relocation_cents = displaced_room_nights * program.relocation_rate_cents
      #   3. tier_pct = TIER selected on base_relocation_cents (NOT on the subtotal,
      #                 NOT on the final contingency):
      #          base_relocation_cents <  500000                       -> 0.05
      #          500000 <= base_relocation_cents < 2000000             -> 0.08
      #          base_relocation_cents >= 2000000                      -> 0.12
      #   4. admin_fee_cents = round_half_up(base_relocation_cents * tier_pct)
      #   5. subtotal_cents  = base_relocation_cents + admin_fee_cents
      #   6. rb.contingency_cents = subtotal_cents
      #                             + (rb.state == GUARANTEED ? program.guarantee_penalty_cents : 0)
      #      -- the guarantee penalty is added AFTER tier selection, so it can
      #         never push the block into a higher fee tier.
      #
      # every other block (terminal state, or arrival_date >= projected opening):
      #   rb.contingency_cents = 0
      #
      # program.contingency_liability_cents = SUM of rb.contingency_cents over the
      #   blocks in the filtered set above.
      # On POST /reservation-blocks the projected value (existing liability plus
      # the new block's contingency_cents) is compared against
      # program.contingency_liability_cap_cents; a projection strictly greater
      # than the cap is rejected with ERR_CONTINGENCY_LIABILITY_EXCEEDED.
    input_set: "ReservationBlocks of the program in state ACCEPTED, GUARANTEED or AT_RISK whose arrival_date is strictly before projected_opening_date_committed. RELOCATED, CANCELLED and HONORED blocks are excluded and hold contingency_cents 0."
    constants:
      TIER_1_LIMIT_CENTS: 500000
      TIER_2_LIMIT_CENTS: 2000000
      TIER_1_PCT: 0.05
      TIER_2_PCT: 0.08
      TIER_3_PCT: 0.12
    precision: "Whole cents; round_half_up on the admin fee only."

  - name: readiness_posture
    trigger: "Every mutation that changes a child of the program (milestone, permit, system, hiring plan, hire, punch list item) and every run of critical_path_schedule"
    algorithm: weighted_scoring
    formula: |
      # --- component ratios (each clamped to 0..1) ---
      # systems_ratio = required_system_count == 0
      #                   ? 0.0
      #                   : certified_system_count / required_system_count
      # staffing_ratio = hiring_plan_count == 0
      #                   ? 0.0
      #                   : departments_ready_count / hiring_plan_count
      # permit_ratio  = issued_mandatory_permit_count / 4
      # schedule_term = max(0.0, 1.0 - (schedule_slip_days / 30.0))
      #
      # readiness_score = round_half_up( 0.30 * systems_ratio
      #                                + 0.25 * staffing_ratio
      #                                + 0.25 * permit_ratio
      #                                + 0.20 * schedule_term , 4 )
      #
      # --- posture selection: FIRST matching branch wins ---
      # if open_critical_punch_count > 0
      #    OR any PermitApplication of the program with is_mandatory true is in state DEFICIENT:
      #        readiness_posture = FROZEN
      # elif schedule_slip_days > program.slip_tolerance_days:
      #        readiness_posture = RESTRICTED
      # elif readiness_score >= 0.85 AND issued_mandatory_permit_count == 4:
      #        readiness_posture = ON_TRACK
      # else:
      #        readiness_posture = MOBILIZING
      #
      # A transition into FROZEN additionally drives the commercial dimension
      # (see state_machines: commercial_state BOOKING_OPEN -> BOOKING_SUSPENDED
      # and the ReservationBlock AT_RISK sweep).
    input_set: "The five derived counters on PreOpeningProgram (open_critical_punch_count, certified/required system counts, issued_mandatory_permit_count, hiring_plan_count/departments_ready_count, schedule_slip_days), plus the DEFICIENT check over the program's mandatory PermitApplications."
    constants:
      W_SYSTEMS: 0.30
      W_STAFFING: 0.25
      W_PERMITS: 0.25
      W_SCHEDULE: 0.20
      SLIP_NORMALIZER_DAYS: 30
      MANDATORY_PERMIT_TYPES: 4
      ON_TRACK_SCORE_FLOOR: 0.85
    precision: "readiness_score rounded half-up to 4 decimal places; the >= 0.85 comparison uses the rounded value."

  - name: system_test_aggregation
    trigger: "POST /system-implementations/{id}/test-runs, and read on GET of the system"
    algorithm: aggregation
    formula: |
      # runs = SystemTestRuns with system_implementation_id == system.id (all of them)
      # test_run_count = count(runs)
      #
      # latest_run = runs ordered by executed_at DESC, then created_at DESC -> first
      #   (executed_at is the primary key of "most recent"; created_at breaks
      #    ties when two runs report the same executed_at; id is never consulted)
      #
      # run.pass_rate = round_half_up(run.cases_passed / run.cases_total, 4)
      # run.result    = (run.pass_rate >= 0.95 AND run.blocker_count == 0) ? PASSED : FAILED
      #
      # system.latest_pass_rate     = latest_run == null ? null : latest_run.pass_rate
      # system.open_blocker_count   = latest_run == null ? 0    : latest_run.blocker_count
      # system.cumulative_pass_rate = latest_run == null ? null :
      #     round_half_up( SUM(run.cases_passed over runs) / SUM(run.cases_total over runs), 4 )
      #
      # CERTIFICATION READS latest_pass_rate, NEVER cumulative_pass_rate.
      # cumulative_pass_rate is persisted for reporting only; a system whose
      # cumulative rate is >= 0.95 but whose latest run is below 0.95 must be
      # rejected with ERR_SYSTEM_PASS_RATE_BELOW_THRESHOLD.
    input_set: "Every SystemTestRun of the system; no run is ever excluded (runs are immutable and append-only)."
    constants:
      CERTIFY_PASS_RATE_FLOOR: 0.95
      FAILED_PASS_RATE_CEILING: 0.50
    precision: "pass rates rounded half-up to 4 decimal places; the >= 0.95 and < 0.50 comparisons use the rounded value."

  - name: storage_overlap_load
    trigger: "POST /pre-opening/ose-orders (evaluated before the order is created)"
    algorithm: interval_merge
    formula: |
      # Delivery windows are HALF-OPEN day intervals
      #   [delivery_window_start, delivery_window_end)
      # Two windows overlap iff
      #   a.delivery_window_start < b.delivery_window_end
      #   AND b.delivery_window_start < a.delivery_window_end
      # Touching windows (a.delivery_window_end == b.delivery_window_start) do
      # NOT overlap: the pallets of the earlier shipment are gone before the
      # later shipment lands, so the bays are shared, not contended.
      #
      # occupied_pallets(candidate) = SUM of o.pallet_count over OseOrders o where
      #     o.program_id == candidate.program_id
      #     AND o.state IN {COMMITTED, STORED}         (CANCELLED released)
      #     AND o.id != candidate.id
      #     AND the windows overlap by the rule above
      #
      # if occupied_pallets(candidate) + candidate.pallet_count
      #        > program.storage_capacity_pallets:
      #     -> ERR_STORAGE_CAPACITY_EXCEEDED
      # A sum exactly equal to storage_capacity_pallets is ACCEPTED (strict >).
    input_set: "OseOrders of the same program in state COMMITTED or STORED whose half-open delivery window overlaps the candidate's."
    constants:
      OVERLAP_SEMANTICS: "half_open_aggregate_capacity; adjacency (end == start) permitted"
    precision: "Integer pallet positions."

  - name: training_room_occupancy
    trigger: "POST /pre-opening/training-sessions (evaluated before the session is created)"
    algorithm: interval_merge
    formula: |
      # A training room admits ONE session at a time, and every session needs a
      # 30-minute turnover on each side (reset, materials, cleaning). The buffer
      # is applied SYMMETRICALLY to the candidate only, which is arithmetically
      # identical to applying 30 minutes to each side of both intervals halved -
      # the pinned form is:
      #
      #   buffered_start(candidate) = candidate.starts_at - 30 minutes
      #   buffered_end(candidate)   = candidate.ends_at   + 30 minutes
      #
      # conflict_set(candidate) = TrainingSessions s where
      #     s.program_id == candidate.program_id
      #     AND s.training_room_code == candidate.training_room_code
      #     AND s.state IN {SCHEDULED, COMPLETED}      (CANCELLED released)
      #     AND s.id != candidate.id
      #     AND buffered_start(candidate) < s.ends_at
      #     AND s.starts_at < buffered_end(candidate)
      #
      # if conflict_set(candidate) is non-empty -> ERR_TRAINING_ROOM_CONFLICT
      #
      # Both comparisons are STRICT (<). A candidate starting exactly 30 minutes
      # after an existing session's ends_at is therefore ACCEPTED (buffered_start
      # == s.ends_at is not < s.ends_at), while a candidate starting exactly at
      # an existing session's ends_at is REJECTED.
      # Unlike storage_overlap_load this resource has NO aggregate capacity: a
      # single overlapping session is a conflict regardless of either session's
      # `capacity` or `enrolled_count`.
    input_set: "TrainingSessions of the same program in the same training_room_code whose state is SCHEDULED or COMPLETED."
    constants:
      TURNOVER_BUFFER_MINUTES: 30
      OVERLAP_SEMANTICS: "buffered_exclusive_single_occupancy; strict comparison on both edges"
    precision: "Minute resolution on the buffered instants; no rounding."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the eight declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "Request body/query schema: required fields present, enums in range, integers within declared bounds, cases_passed <= cases_total, ends_at > starts_at, delivery_window_end > delivery_window_start, target_opening_date > construction_start_date, limit in 1..100, offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Every referenced resource exists, validated left-to-right: path ids before body ids, then body ids in declaration order (program_id, then budget_line_id / hiring_plan_id / milestone_id / orientation_session_id / prerequisite_system_id)"
    error_id: ERR_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a program id or a program-scoped child id"
  - priority: 5
    category: business_referential
    check: "Cross-aggregate ids must belong to the same program: MilestoneDependency predecessor and successor share program_id; PermitApplication.gating_milestone_id and PunchListItem.milestone_id belong to program_id; OseOrder.budget_line_id belongs to program_id; SystemImplementation.prerequisite_system_id belongs to program_id; Hire.orientation_session_id belongs to the plan's program"
    error_id: ERR_CROSS_PROGRAM_REFERENCE
    http_status: 422
    applies_to: "POST /milestone-dependencies, POST /permit-applications, POST /punch-list-items, POST /ose-orders, POST /system-implementations, POST /hires, POST /hires/{id}/assign-orientation"
  - priority: 6
    category: auth
    check: "Segregation of duties: the punch-list verifier is not submitted_by_user_id; the system certifier is not the executed_by_user_id of the latest test run; the soft-opening authorizer is not baselined_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /punch-list-items/{id}/verify, POST /system-implementations/{id}/certify, POST /programs/{id}/authorize-soft-opening"
  - priority: 7
    category: state
    check: "The target resource's current state permits the requested transition (see §1.2); this covers program schedule_state and commercial_state, milestone state, permit state, system state, hire state, order state, block state and punch item state"
    error_id: ERR_INVALID_PROGRAM_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: business_constraint
    check: "Optimistic concurrency: expected_program_version equals PreOpeningProgram.version; expected_budget_line_version equals BudgetLine.version"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /reservation-blocks, POST /ose-orders"
  - priority: 9
    category: business_safety
    check: "readiness_posture != FROZEN for every operation that adds forward commercial or procurement exposure"
    error_id: ERR_PROGRAM_FROZEN
    http_status: 422
    applies_to: "POST /reservation-blocks, POST /reservation-blocks/{id}/guarantee, POST /programs/{id}/open-booking, POST /ose-orders/{id}/receive, POST /programs/{id}/authorize-soft-opening"
  - priority: 10
    category: business_safety
    check: "Licensing and closure gates: mandatory permit sequencing prerequisites are ISSUED; the gating milestone is COMPLETE before submission; all four mandatory permits ISSUED, zero open CRITICAL punch items and all required systems CERTIFIED before soft opening"
    error_id: ERR_PERMIT_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /permit-applications/{id}/submit, POST /programs/{id}/authorize-soft-opening, POST /milestones/{id}/complete"
  - priority: 11
    category: business_referential
    check: "Milestone graph integrity: the new MilestoneDependency must not close a cycle (a self edge counts as a cycle) and must not duplicate an existing predecessor/successor pair; a FINISH_START predecessor must be COMPLETE before its successor may start"
    error_id: ERR_DEPENDENCY_CYCLE
    http_status: 422
    applies_to: "POST /milestone-dependencies, POST /milestones/{id}/start"
  - priority: 12
    category: business_temporal
    check: "Temporal geometry: training room occupancy respects the 30-minute turnover buffer; hire start_date >= plan wave_start_date; arrival_date >= logical clock date; receipt date inside the half-open delivery window; soft_opening_date within [clock date, projected_opening_date_committed]; stabilization window elapsed"
    error_id: ERR_TRAINING_ROOM_CONFLICT
    http_status: 422
    applies_to: "POST /training-sessions, POST /hires, POST /hires/{id}/assign-orientation, POST /reservation-blocks, POST /ose-orders/{id}/receive, POST /programs/{id}/authorize-soft-opening, POST /programs/{id}/transition-to-stabilized"
  - priority: 13
    category: business_constraint
    check: "Capacity and cardinality: aggregate pallet load over overlapping delivery windows within storage_capacity_pallets; training session enrolled_count within capacity; plan offered_count within headcount_target; a schedule computation needs at least one milestone; a test run needs at least one case; uniqueness of (program_id, code), (program_id, permit_type), (program_id, system_type), (program_id, department), (program_id, category)"
    error_id: ERR_STORAGE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /ose-orders, POST /training-sessions, POST /hires, POST /hires/{id}/assign-orientation, POST /milestones, POST /permit-applications, POST /system-implementations, POST /hiring-plans, POST /budget-lines, POST /programs/{id}/baseline-schedule, POST /programs/{id}/recompute-schedule, POST /system-implementations/{id}/test-runs"
  - priority: 14
    category: business_fiscal
    check: "Money and inventory ceilings: BudgetLine.available_cents covers the new commitment; committed_room_nights + new room_nights within room_night_ceiling; projected contingency_liability_cents within contingency_liability_cap_cents"
    error_id: ERR_BUDGET_WOULD_EXCEED
    http_status: 422
    applies_to: "POST /ose-orders, POST /reservation-blocks"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Program ---------------------------------------------------------------
  - method: POST
    path: "/pre-opening/programs"
    description: "Create a pre-opening program in PLANNING / BOOKING_CLOSED with readiness_posture MOBILIZING."
    roles: [ProgramDirector]
    code: 201
    input: [property_name, brand_code, room_count, construction_start_date, target_opening_date, storage_capacity_pallets, relocation_rate_cents, guarantee_penalty_cents, room_night_ceiling, contingency_liability_cap_cents, "licensing_buffer_days?", "rework_buffer_days?", "slip_tolerance_days?", "stabilization_window_days?"]
    output: PreOpeningProgram
    side_effects: ["initialise every derived counter to 0 and readiness_score to 0.0"]
  - method: GET
    path: "/pre-opening/programs"
    description: "List programs with pagination and posture filter."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["readiness_posture?", "schedule_state?", "limit?", "offset?"]
    output: PreOpeningProgram[]
    side_effects: []
  - method: GET
    path: "/pre-opening/programs/{id}"
    description: "Read one program including every derived counter and both projected opening dates."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: []
    output: PreOpeningProgram
    side_effects: []
  - method: GET
    path: "/pre-opening/programs/{id}/readiness"
    description: "Computed read: posture breakdown with both cost-at-completion variants and both projected opening dates side by side."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: []
    output: { readiness_posture: string, readiness_score: number, systems_ratio: number, staffing_ratio: number, permit_ratio: number, schedule_term: number, schedule_slip_days: integer, projected_opening_date_optimistic: string, projected_opening_date_committed: string, variant_gap_days: integer, cost_at_completion_commitment_cents: integer, cost_at_completion_accrual_cents: integer, payroll_accrual_cents: integer, contingency_liability_cents: integer, committed_room_nights: integer }
    side_effects: []
  - method: POST
    path: "/pre-opening/programs/{id}/baseline-schedule"
    description: "Baseline the milestone network: PLANNING -> BASELINED, run the critical path in both variants and record the baselining director."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: PreOpeningProgram
    side_effects: ["run calculations.critical_path_schedule", "run calculations.readiness_posture", "set baselined_by_user_id", "increments PreOpeningProgram.version by 1"]
  - method: POST
    path: "/pre-opening/programs/{id}/recompute-schedule"
    description: "Re-run the critical path in both variants without changing schedule_state; refreshes floats, slip, posture and both cost-at-completion variants."
    roles: [ProgramDirector, ConstructionManager]
    code: 200
    input: []
    output: PreOpeningProgram
    side_effects: ["run calculations.critical_path_schedule", "run calculations.cost_at_completion", "run calculations.contingency_liability", "run calculations.readiness_posture", "increments PreOpeningProgram.version by 1"]
  - method: POST
    path: "/pre-opening/programs/{id}/open-booking"
    description: "Open or re-open pre-opening booking acceptance; also recovers AT_RISK blocks whose arrival is no longer before projected opening."
    roles: [CommercialDirector]
    code: 200
    input: []
    output: PreOpeningProgram
    side_effects: ["commercial_state -> BOOKING_OPEN", "AT_RISK blocks with arrival_date >= projected_opening_date_committed -> ACCEPTED", "run calculations.contingency_liability", "increments PreOpeningProgram.version by 1"]
  - method: POST
    path: "/pre-opening/programs/{id}/suspend-booking"
    description: "Suspend booking acceptance manually."
    roles: [CommercialDirector]
    code: 200
    input: ["reason?"]
    output: PreOpeningProgram
    side_effects: ["commercial_state -> BOOKING_SUSPENDED", "increments PreOpeningProgram.version by 1"]
  - method: POST
    path: "/pre-opening/programs/{id}/authorize-soft-opening"
    description: "Authorize the soft opening; enforces the full licensing/punch/systems/staffing gate plus the baseline-vs-authorization segregation of duties."
    roles: [ProgramDirector]
    code: 200
    input: [soft_opening_date]
    output: PreOpeningProgram
    side_effects: ["schedule_state LICENSING -> SOFT_OPENING", "set soft_opening_date and soft_opening_authorized_by_user_id", "run calculations.readiness_posture", "increments PreOpeningProgram.version by 1"]
  - method: POST
    path: "/pre-opening/programs/{id}/transition-to-stabilized"
    description: "Close out pre-opening: SOFT_OPENING -> STABILIZED, SELLING_STABILIZED, and honour every guaranteed block."
    roles: [ProgramDirector]
    code: 200
    input: []
    output: PreOpeningProgram
    side_effects: ["commercial_state -> SELLING_STABILIZED", "GUARANTEED blocks -> HONORED", "contingency_liability_cents -> 0", "increments PreOpeningProgram.version by 1"]

  # --- Milestones and the dependency graph -----------------------------------
  - method: POST
    path: "/pre-opening/milestones"
    description: "Add a milestone to a program's network (only while schedule_state is PLANNING or BASELINED)."
    roles: [ConstructionManager, ProgramDirector]
    code: 201
    input: [program_id, code, name, duration_days, planned_start_date]
    output: Milestone
    side_effects: ["state NOT_STARTED", "schedule fields stay null until the next schedule computation"]
  - method: GET
    path: "/pre-opening/milestones"
    description: "List milestones filtered by program, state or criticality."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["program_id?", "state?", "is_critical?", "limit?", "offset?"]
    output: Milestone[]
    side_effects: []
  - method: GET
    path: "/pre-opening/milestones/{id}"
    description: "Read one milestone including forward/backward-pass dates and float."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: []
    output: Milestone
    side_effects: []
  - method: POST
    path: "/pre-opening/milestones/{id}/start"
    description: "Start (or restart a reopened) milestone; stamps actual_start_date from the logical clock."
    roles: [ConstructionManager]
    code: 200
    input: []
    output: Milestone
    side_effects: ["actual_start_date = clock date"]
  - method: POST
    path: "/pre-opening/milestones/{id}/complete"
    description: "Complete a milestone; stamps actual_finish_date, recomputes the critical path and may advance schedule_state."
    roles: [ConstructionManager]
    code: 200
    input: []
    output: Milestone
    side_effects: ["actual_finish_date = clock date", "run calculations.critical_path_schedule", "may drive program.schedule_state BASELINED -> CONSTRUCTION_COMPLETE", "run calculations.readiness_posture", "run calculations.cost_at_completion"]
  - method: POST
    path: "/pre-opening/milestones/{id}/reopen"
    description: "Reopen a completed milestone for rework; increments rework_count so the COMMITTED variant inserts rework_buffer_days."
    roles: [ConstructionManager]
    code: 200
    input: ["reason?"]
    output: Milestone
    side_effects: ["rework_count += 1", "run calculations.critical_path_schedule", "run calculations.readiness_posture"]
  - method: POST
    path: "/pre-opening/milestone-dependencies"
    description: "Add a directed edge to the milestone network; rejects self edges, duplicates, cross-program edges and any edge that closes a cycle."
    roles: [ConstructionManager, ProgramDirector]
    code: 201
    input: [predecessor_milestone_id, successor_milestone_id, "dependency_type?", "lag_days?"]
    output: MilestoneDependency
    side_effects: ["the successor's earliest_start_date is re-derived on the next schedule computation"]
  - method: GET
    path: "/pre-opening/milestones/{id}/dependencies"
    description: "Every dependency edge incident to this milestone, as predecessor or as successor."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["role?", "limit?", "offset?"]
    output: MilestoneDependency[]
    side_effects: []

  # --- Permits ---------------------------------------------------------------
  - method: POST
    path: "/pre-opening/permit-applications"
    description: "Draft a permit application against a gating construction milestone."
    roles: [LicensingCoordinator, ProgramDirector]
    code: 201
    input: [program_id, gating_milestone_id, permit_type, review_days]
    output: PermitApplication
    side_effects: ["state DRAFT", "is_mandatory computed from permit_type"]
  - method: GET
    path: "/pre-opening/permit-applications"
    description: "List permit applications filtered by program, gating milestone, type or state."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["program_id?", "gating_milestone_id?", "permit_type?", "state?", "limit?", "offset?"]
    output: PermitApplication[]
    side_effects: []
  - method: GET
    path: "/pre-opening/permit-applications/{id}"
    description: "Read one permit application."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []
  - method: POST
    path: "/pre-opening/permit-applications/{id}/submit"
    description: "Submit or resubmit; enforces permit-type sequencing and the gating milestone gate, and may advance schedule_state to LICENSING."
    roles: [LicensingCoordinator]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["state -> SUBMITTED", "resubmission_count += 1 when coming from DEFICIENT", "gating Milestone BLOCKED -> IN_PROGRESS", "run calculations.readiness_posture"]
  - method: POST
    path: "/pre-opening/permit-applications/{id}/record-review"
    description: "Record the authority's decision: ISSUE or DEFICIENCY. A deficiency starts the five-link freeze cascade."
    roles: [LicensingCoordinator]
    code: 200
    input: [decision, "deficiency_reason?"]
    output: PermitApplication
    side_effects: ["ISSUE: state -> ISSUED, issued_at set, issued_mandatory_permit_count recomputed", "DEFICIENCY: state -> DEFICIENT, gating milestone blocked_days_accrued += review_days and -> BLOCKED, critical path recomputed, posture -> FROZEN, booking suspended, pre-opening blocks -> AT_RISK", "run calculations.readiness_posture", "run calculations.contingency_liability"]

  # --- Systems ---------------------------------------------------------------
  - method: POST
    path: "/pre-opening/system-implementations"
    description: "Register a property system implementation, optionally behind an interface prerequisite."
    roles: [SystemsIntegrator, ProgramDirector]
    code: 201
    input: [program_id, system_type, "prerequisite_system_id?", "is_required?"]
    output: SystemImplementation
    side_effects: ["state PLANNED", "program.required_system_count recomputed", "run calculations.readiness_posture"]
  - method: GET
    path: "/pre-opening/system-implementations"
    description: "List system implementations filtered by program, prerequisite or state."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["program_id?", "prerequisite_system_id?", "state?", "limit?", "offset?"]
    output: SystemImplementation[]
    side_effects: []
  - method: GET
    path: "/pre-opening/system-implementations/{id}"
    description: "Read one system implementation including both pass-rate aggregates."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: []
    output: SystemImplementation
    side_effects: []
  - method: POST
    path: "/pre-opening/system-implementations/{id}/test-runs"
    description: "Append an immutable test run; recomputes latest/cumulative pass rates and may move the system into TESTING, FAILED or out of CERTIFIED."
    roles: [SystemsIntegrator]
    code: 201
    input: [executed_at, cases_total, cases_passed, blocker_count]
    output: SystemTestRun
    side_effects: ["run calculations.system_test_aggregation", "state PLANNED|FAILED|CERTIFIED -> TESTING (or -> FAILED when latest_pass_rate < 0.50)", "decertification clears certified_by_user_id", "run calculations.readiness_posture"]
  - method: GET
    path: "/pre-opening/system-implementations/{id}/test-runs"
    description: "Append-only test-run log for a system, newest first by executed_at."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: SystemTestRun[]
    side_effects: []
  - method: POST
    path: "/pre-opening/system-implementations/{id}/certify"
    description: "Certify a system; requires latest_pass_rate >= 0.95, zero open blockers, a certified prerequisite, and a certifier who did not execute the latest run."
    roles: [SystemsIntegrator, ProgramDirector]
    code: 200
    input: []
    output: SystemImplementation
    side_effects: ["state -> CERTIFIED", "certified_by_user_id and certified_at set", "program.certified_system_count recomputed", "run calculations.readiness_posture"]

  # --- Hiring and training ---------------------------------------------------
  - method: POST
    path: "/pre-opening/hiring-plans"
    description: "Create a department hiring plan with its staggered wave start date."
    roles: [TalentManager, ProgramDirector]
    code: 201
    input: [program_id, department, headcount_target, wave_start_date]
    output: DepartmentHiringPlan
    side_effects: ["readiness_flag NOT_READY", "program.hiring_plan_count recomputed", "run calculations.readiness_posture"]
  - method: GET
    path: "/pre-opening/programs/{id}/hiring-plans"
    description: "Every hiring plan of a program with its staffing ratio and readiness flag."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["department?", "readiness_flag?", "limit?", "offset?"]
    output: DepartmentHiringPlan[]
    side_effects: []
  - method: POST
    path: "/pre-opening/hires"
    description: "Extend an offer against a plan, optionally enrolling the hire in an orientation session in the same call."
    roles: [TalentManager]
    code: 201
    input: [hiring_plan_id, full_name, hourly_rate_cents, scheduled_hours_per_day, start_date, "orientation_session_id?"]
    output: Hire
    side_effects: ["state OFFERED", "plan.offered_count += 1", "when orientation_session_id is supplied, that session's enrolled_count += 1"]
  - method: GET
    path: "/pre-opening/hires"
    description: "List hires filtered by plan, orientation session or state."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["hiring_plan_id?", "orientation_session_id?", "state?", "limit?", "offset?"]
    output: Hire[]
    side_effects: []
  - method: GET
    path: "/pre-opening/hires/{id}"
    description: "Read one hire including its projected accrual."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: []
    output: Hire
    side_effects: []
  - method: POST
    path: "/pre-opening/hires/{id}/respond"
    description: "Record the candidate's response: ACCEPT, DECLINE or WITHDRAW."
    roles: [TalentManager]
    code: 200
    input: [decision]
    output: Hire
    side_effects: ["plan counters recomputed", "run calculations.cost_at_completion", "run calculations.readiness_posture"]
  - method: POST
    path: "/pre-opening/hires/{id}/assign-orientation"
    description: "Enrol (or re-enrol) an accepted hire in an orientation session; enforces session capacity and department eligibility."
    roles: [TalentManager]
    code: 200
    input: [orientation_session_id]
    output: Hire
    side_effects: ["previous session's enrolled_count -= 1", "new session's enrolled_count += 1"]
  - method: POST
    path: "/pre-opening/hires/{id}/onboard"
    description: "Onboard an accepted hire whose orientation session is COMPLETED and whose start_date has arrived; drives the plan-readiness bubble-up cascade."
    roles: [TalentManager]
    code: 200
    input: []
    output: Hire
    side_effects: ["plan.onboarded_count += 1 and readiness_flag may flip to READY", "program.departments_ready_count recomputed", "run calculations.readiness_posture"]
  - method: POST
    path: "/pre-opening/training-sessions"
    description: "Schedule a pre-opening training session in a training room; enforces the 30-minute turnover buffer against other sessions in the same room."
    roles: [TalentManager, ProgramDirector]
    code: 201
    input: [program_id, title, training_room_code, starts_at, ends_at, capacity, "department?"]
    output: TrainingSession
    side_effects: ["run calculations.training_room_occupancy", "state SCHEDULED", "enrolled_count 0"]
  - method: GET
    path: "/pre-opening/programs/{id}/training-sessions"
    description: "Pre-opening training calendar for a program."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["department?", "state?", "training_room_code?", "limit?", "offset?"]
    output: TrainingSession[]
    side_effects: []
  - method: POST
    path: "/pre-opening/training-sessions/{id}/complete"
    description: "Mark a session delivered once the logical clock has passed ends_at; unlocks onboarding for its enrolled hires."
    roles: [TalentManager]
    code: 200
    input: []
    output: TrainingSession
    side_effects: ["state -> COMPLETED"]
  - method: POST
    path: "/pre-opening/training-sessions/{id}/cancel"
    description: "Cancel an empty session and release its room interval."
    roles: [TalentManager]
    code: 200
    input: ["reason?"]
    output: TrainingSession
    side_effects: ["state -> CANCELLED", "the room interval leaves the turnover-buffer overlap set"]

  # --- Budget and OS&E -------------------------------------------------------
  - method: POST
    path: "/pre-opening/budget-lines"
    description: "Authorize a pre-opening budget line for one spend category."
    roles: [ProgramDirector]
    code: 201
    input: [program_id, category, authorized_cents]
    output: BudgetLine
    side_effects: ["committed_cents 0, spent_cents 0, available_cents = authorized_cents"]
  - method: GET
    path: "/pre-opening/programs/{id}/budget-lines"
    description: "Budget lines of a program with committed / spent / available split."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["category?", "limit?", "offset?"]
    output: BudgetLine[]
    side_effects: []
  - method: POST
    path: "/pre-opening/ose-orders"
    description: "Commit an operating-supplies order against a budget line and a delivery window; guarded by optimistic concurrency on the budget line."
    roles: [ProcurementManager]
    code: 201
    input: [program_id, budget_line_id, description, amount_cents, pallet_count, delivery_window_start, delivery_window_end, expected_budget_line_version]
    output: OseOrder
    side_effects: ["state COMMITTED", "budget_line.committed_cents += amount_cents and available_cents -= amount_cents", "increments BudgetLine.version by 1", "run calculations.storage_overlap_load", "run calculations.cost_at_completion"]
  - method: GET
    path: "/pre-opening/ose-orders"
    description: "List OS&E orders filtered by program, budget line or state."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["program_id?", "budget_line_id?", "state?", "limit?", "offset?"]
    output: OseOrder[]
    side_effects: []
  - method: GET
    path: "/pre-opening/ose-orders/{id}"
    description: "Read one OS&E order."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: []
    output: OseOrder
    side_effects: []
  - method: POST
    path: "/pre-opening/ose-orders/{id}/receive"
    description: "Receive and store a shipment inside its delivery window, moving the commitment to spent."
    roles: [ProcurementManager]
    code: 200
    input: [stored_bay_code]
    output: OseOrder
    side_effects: ["state -> STORED", "budget_line.committed_cents -= amount_cents and spent_cents += amount_cents", "increments BudgetLine.version by 1", "run calculations.cost_at_completion"]
  - method: POST
    path: "/pre-opening/ose-orders/{id}/cancel"
    description: "Cancel a committed order; releases the budget commitment and the pallet load with no drift in authorized_cents."
    roles: [ProcurementManager]
    code: 200
    input: ["reason?"]
    output: OseOrder
    side_effects: ["state -> CANCELLED", "budget_line.committed_cents -= amount_cents and available_cents += amount_cents", "increments BudgetLine.version by 1", "run calculations.cost_at_completion"]

  # --- Reservations ----------------------------------------------------------
  - method: POST
    path: "/pre-opening/reservation-blocks"
    description: "Accept a pre-opening reservation block; guarded by optimistic concurrency on the program, the room-night ceiling and the contingency cap."
    roles: [CommercialDirector]
    code: 201
    input: [program_id, account_name, arrival_date, night_count, room_count, rate_cents, expected_program_version]
    output: ReservationBlock
    side_effects: ["state ACCEPTED", "program.committed_room_nights += room_nights", "run calculations.contingency_liability", "increments PreOpeningProgram.version by 1"]
  - method: GET
    path: "/pre-opening/programs/{id}/reservation-blocks"
    description: "Reservation blocks of a program with their contingency exposure."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["state?", "is_pre_opening?", "limit?", "offset?"]
    output: ReservationBlock[]
    side_effects: []
  - method: POST
    path: "/pre-opening/reservation-blocks/{id}/guarantee"
    description: "Guarantee an accepted block; adds the guarantee penalty to its contingency after tier selection."
    roles: [CommercialDirector]
    code: 200
    input: []
    output: ReservationBlock
    side_effects: ["state -> GUARANTEED", "run calculations.contingency_liability"]
  - method: POST
    path: "/pre-opening/reservation-blocks/{id}/resolve-contingency"
    description: "Resolve an at-risk block by RELOCATE or CANCEL; both release the held room-nights."
    roles: [CommercialDirector]
    code: 200
    input: [resolution]
    output: ReservationBlock
    side_effects: ["state -> RELOCATED or CANCELLED", "program.committed_room_nights -= room_nights", "run calculations.contingency_liability"]

  # --- Punch list ------------------------------------------------------------
  - method: POST
    path: "/pre-opening/punch-list-items"
    description: "Raise a punch list defect, optionally attributed to a milestone; a CRITICAL item freezes the program immediately."
    roles: [ConstructionManager, QualityInspector]
    code: 201
    input: [program_id, description, severity, "milestone_id?"]
    output: PunchListItem
    side_effects: ["state OPEN", "program.open_critical_punch_count recomputed", "run calculations.readiness_posture"]
  - method: GET
    path: "/pre-opening/punch-list-items"
    description: "List punch list items filtered by program, milestone, severity or state."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: ["program_id?", "milestone_id?", "severity?", "state?", "limit?", "offset?"]
    output: PunchListItem[]
    side_effects: []
  - method: GET
    path: "/pre-opening/punch-list-items/{id}"
    description: "Read one punch list item."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: []
    output: PunchListItem
    side_effects: []
  - method: POST
    path: "/pre-opening/punch-list-items/{id}/submit-verification"
    description: "Submit a defect for independent verification; records the submitter for the segregation-of-duties check."
    roles: [ConstructionManager]
    code: 200
    input: []
    output: PunchListItem
    side_effects: ["state -> READY_FOR_VERIFICATION", "submitted_by_user_id = X-User-ID"]
  - method: POST
    path: "/pre-opening/punch-list-items/{id}/verify"
    description: "Verify or reject a submitted defect; the acting user must differ from the submitter."
    roles: [QualityInspector]
    code: 200
    input: [decision]
    output: PunchListItem
    side_effects: ["state -> VERIFIED or REJECTED", "CRITICAL verification decrements program.open_critical_punch_count", "run calculations.readiness_posture"]
  - method: POST
    path: "/pre-opening/punch-list-items/{id}/reopen"
    description: "Reopen a verified defect; a CRITICAL reopen re-freezes the program."
    roles: [QualityInspector]
    code: 200
    input: ["reason?"]
    output: PunchListItem
    side_effects: ["state -> OPEN", "verified_by_user_id and submitted_by_user_id cleared", "program.open_critical_punch_count recomputed", "run calculations.readiness_posture"]

  # --- Test-driving endpoint -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which supplies every actual_start_date, actual_finish_date, submitted_at, issued_at, received_at and onboarded_at, and every 'now' comparison. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [ProgramDirector, ConstructionManager, LicensingCoordinator, SystemsIntegrator, TalentManager, ProcurementManager, CommercialDirector, QualityInspector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["no entity is mutated; subsequent requests observe the new logical time"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the eight declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID is the same person who performed the prerequisite step: punch-list submitter verifying their own item, test executor certifying their own run, or the baselining director authorizing the soft opening."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, out-of-range integer, cases_passed > cases_total, ends_at <= starts_at, delivery_window_end <= delivery_window_start, target_opening_date <= construction_start_date, or pagination outside limit 1..100 / offset >= 0."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No PreOpeningProgram with the given id."
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "No Milestone with the given id."
  - id: ERR_PERMIT_APPLICATION_NOT_FOUND
    http: 404
    condition: "No PermitApplication with the given id."
  - id: ERR_SYSTEM_IMPLEMENTATION_NOT_FOUND
    http: 404
    condition: "No SystemImplementation with the given id."
  - id: ERR_HIRING_PLAN_NOT_FOUND
    http: 404
    condition: "No DepartmentHiringPlan with the given id."
  - id: ERR_HIRE_NOT_FOUND
    http: 404
    condition: "No Hire with the given id."
  - id: ERR_TRAINING_SESSION_NOT_FOUND
    http: 404
    condition: "No TrainingSession with the given id."
  - id: ERR_BUDGET_LINE_NOT_FOUND
    http: 404
    condition: "No BudgetLine with the given id."
  - id: ERR_OSE_ORDER_NOT_FOUND
    http: 404
    condition: "No OseOrder with the given id."
  - id: ERR_RESERVATION_BLOCK_NOT_FOUND
    http: 404
    condition: "No ReservationBlock with the given id."
  - id: ERR_PUNCH_LIST_ITEM_NOT_FOUND
    http: 404
    condition: "No PunchListItem with the given id."
  - id: ERR_INVALID_PROGRAM_STATE
    http: 409
    condition: "The program's schedule_state does not permit the operation (baselining a non-PLANNING program, authorizing soft opening outside LICENSING, stabilizing outside SOFT_OPENING, adding milestones after CONSTRUCTION_COMPLETE, mutating anything under STABILIZED)."
  - id: ERR_INVALID_MILESTONE_STATE
    http: 409
    condition: "The milestone's state does not permit the operation (starting a COMPLETE milestone, completing a NOT_STARTED milestone, reopening a milestone that is not COMPLETE)."
  - id: ERR_INVALID_PERMIT_STATE
    http: 409
    condition: "The permit's state does not permit the operation (submitting an ISSUED or SUBMITTED application, recording a review on a DRAFT or DEFICIENT application)."
  - id: ERR_INVALID_SYSTEM_STATE
    http: 409
    condition: "The system's state does not permit the operation (certifying a PLANNED, FAILED or already CERTIFIED system)."
  - id: ERR_INVALID_HIRE_STATE
    http: 409
    condition: "The hire's state does not permit the operation, or onboarding is attempted before the logical clock reaches start_date."
  - id: ERR_INVALID_OSE_ORDER_STATE
    http: 409
    condition: "The order is not COMMITTED, so it can be neither received nor cancelled."
  - id: ERR_INVALID_RESERVATION_STATE
    http: 409
    condition: "The block's state does not permit the operation (guaranteeing a non-ACCEPTED block, resolving a block that is not AT_RISK)."
  - id: ERR_INVALID_PUNCH_ITEM_STATE
    http: 409
    condition: "The punch item's state does not permit the operation (verifying an OPEN item, submitting a VERIFIED item, reopening an item that is not VERIFIED)."
  - id: ERR_BOOKING_NOT_OPEN
    http: 409
    condition: "The program's commercial_state is not BOOKING_OPEN, so blocks may not be created or guaranteed."
  - id: ERR_TRAINING_SESSION_NOT_ENDED
    http: 409
    condition: "The session cannot be completed because the logical clock has not reached ends_at."
  - id: ERR_TRAINING_SESSION_HAS_ENROLLMENTS
    http: 409
    condition: "The session cannot be cancelled because enrolled_count > 0."
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal the program's current version."
  - id: ERR_STALE_BUDGET_LINE_VERSION
    http: 412
    condition: "expected_budget_line_version does not equal the budget line's current version."
  - id: ERR_PROGRAM_FROZEN
    http: 422
    condition: "readiness_posture is FROZEN and the operation would add commercial or procurement exposure."
  - id: ERR_PERMIT_PREREQUISITE_NOT_MET
    http: 422
    condition: "A prerequisite permit_type for the submitted permit_type is absent or not ISSUED (CERTIFICATE_OF_OCCUPANCY needs ELEVATOR; LIQUOR_LICENSE needs CERTIFICATE_OF_OCCUPANCY and FOOD_SERVICE)."
  - id: ERR_GATING_MILESTONE_NOT_COMPLETE
    http: 422
    condition: "The permit's gating milestone is not COMPLETE at first submission."
  - id: ERR_MANDATORY_PERMIT_NOT_ISSUED
    http: 422
    condition: "Soft opening was requested while issued_mandatory_permit_count < 4."
  - id: ERR_CRITICAL_PUNCH_OPEN
    http: 422
    condition: "An open CRITICAL punch item blocks the operation (completing its milestone, or authorizing the soft opening)."
  - id: ERR_SYSTEM_NOT_CERTIFIED
    http: 422
    condition: "Soft opening was requested while certified_system_count < required_system_count."
  - id: ERR_PREREQUISITE_SYSTEM_NOT_CERTIFIED
    http: 422
    condition: "The system's prerequisite_system_id points at a system that is not CERTIFIED."
  - id: ERR_SYSTEM_PASS_RATE_BELOW_THRESHOLD
    http: 422
    condition: "Certification was requested while latest_pass_rate < 0.95, even when cumulative_pass_rate is at or above the floor."
  - id: ERR_OPEN_BLOCKERS_PRESENT
    http: 422
    condition: "Certification was requested while open_blocker_count > 0."
  - id: ERR_TEST_RUN_EMPTY
    http: 422
    condition: "A test run was recorded with cases_total == 0, so no pass rate is defined."
  - id: ERR_DEPARTMENT_NOT_READY
    http: 422
    condition: "Soft opening was requested with no hiring plans, or with departments_ready_count < hiring_plan_count."
  - id: ERR_HEADCOUNT_EXCEEDED
    http: 422
    condition: "A new offer would push the plan's offered_count above headcount_target."
  - id: ERR_START_BEFORE_WAVE
    http: 422
    condition: "A hire's start_date is earlier than the plan's wave_start_date."
  - id: ERR_TRAINING_ROOM_CONFLICT
    http: 422
    condition: "A session's interval, extended by the 30-minute turnover buffer on both sides, collides with another non-CANCELLED session in the same training_room_code."
  - id: ERR_TRAINING_SESSION_FULL
    http: 422
    condition: "Enrolling the hire would push the session's enrolled_count above capacity."
  - id: ERR_TRAINING_DEPARTMENT_MISMATCH
    http: 422
    condition: "The session's department is neither ALL nor the department of the hire's plan."
  - id: ERR_ORIENTATION_NOT_COMPLETED
    http: 422
    condition: "Onboarding was requested with no orientation_session_id, or with a session that is not COMPLETED."
  - id: ERR_STORAGE_CAPACITY_EXCEEDED
    http: 422
    condition: "Aggregate pallet_count over orders whose half-open delivery windows overlap the candidate's, plus the candidate's own pallets, is strictly greater than storage_capacity_pallets."
  - id: ERR_DELIVERY_OUTSIDE_WINDOW
    http: 422
    condition: "The receipt date is before delivery_window_start or on/after delivery_window_end."
  - id: ERR_BUDGET_WOULD_EXCEED
    http: 422
    condition: "amount_cents is strictly greater than the budget line's available_cents."
  - id: ERR_ROOM_NIGHT_CEILING_EXCEEDED
    http: 422
    condition: "committed_room_nights plus the new block's room_nights is strictly greater than room_night_ceiling."
  - id: ERR_CONTINGENCY_LIABILITY_EXCEEDED
    http: 422
    condition: "The projected contingency_liability_cents after accepting the block is strictly greater than contingency_liability_cap_cents."
  - id: ERR_ARRIVAL_DATE_IN_PAST
    http: 422
    condition: "arrival_date is before the logical clock date."
  - id: ERR_SOFT_OPENING_DATE_INVALID
    http: 422
    condition: "soft_opening_date is before the logical clock date or after projected_opening_date_committed."
  - id: ERR_STABILIZATION_WINDOW_NOT_ELAPSED
    http: 422
    condition: "The logical clock date is earlier than soft_opening_date plus stabilization_window_days."
  - id: ERR_PUNCH_LIST_OPEN
    http: 422
    condition: "Stabilization was requested while at least one punch item of the program is not VERIFIED."
  - id: ERR_OSE_ORDER_PENDING
    http: 422
    condition: "Stabilization was requested while at least one OS&E order of the program is still COMMITTED."
  - id: ERR_SCHEDULE_EMPTY
    http: 422
    condition: "A schedule computation was requested for a program with zero milestones."
  - id: ERR_DEPENDENCY_CYCLE
    http: 422
    condition: "The new dependency edge would close a cycle in the milestone graph; a self edge (predecessor == successor) counts as a cycle."
  - id: ERR_DUPLICATE_DEPENDENCY
    http: 422
    condition: "A MilestoneDependency with the same predecessor_milestone_id and successor_milestone_id already exists."
  - id: ERR_PREDECESSOR_NOT_COMPLETE
    http: 422
    condition: "A milestone was started while a FINISH_START predecessor is not COMPLETE."
  - id: ERR_CROSS_PROGRAM_REFERENCE
    http: 422
    condition: "A referenced resource belongs to a different program than the one the request targets."
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Uniqueness violation on (program_id, code) for milestones, (program_id, permit_type), (program_id, system_type), (program_id, department) or (program_id, category)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Owns the pre-opening program: creation, baselining, recomputation, budget authorization, soft-opening authorization and stabilization."
    identity: opaque
    exclusive_operations:
      - "POST /pre-opening/programs"
      - "POST /pre-opening/programs/{id}/baseline-schedule"
      - "POST /pre-opening/programs/{id}/authorize-soft-opening"
      - "POST /pre-opening/programs/{id}/transition-to-stabilized"
      - "POST /pre-opening/budget-lines"
    shared_operations:
      - "POST /pre-opening/programs/{id}/recompute-schedule (with ConstructionManager)"
      - "POST /pre-opening/milestones, POST /pre-opening/milestone-dependencies (with ConstructionManager)"
      - "POST /pre-opening/permit-applications (with LicensingCoordinator)"
      - "POST /pre-opening/system-implementations, POST /pre-opening/system-implementations/{id}/certify (with SystemsIntegrator)"
      - "POST /pre-opening/hiring-plans, POST /pre-opening/training-sessions (with TalentManager)"
      - "all GET endpoints and POST /_clock/set_current_utc"
  - name: ConstructionManager
    description: "Drives the construction network: milestones, dependency edges, and raising/submitting punch list defects."
    identity: opaque
    exclusive_operations:
      - "POST /pre-opening/milestones/{id}/start"
      - "POST /pre-opening/milestones/{id}/complete"
      - "POST /pre-opening/milestones/{id}/reopen"
      - "POST /pre-opening/punch-list-items/{id}/submit-verification"
    shared_operations:
      - "POST /pre-opening/milestones, POST /pre-opening/milestone-dependencies (with ProgramDirector)"
      - "POST /pre-opening/programs/{id}/recompute-schedule (with ProgramDirector)"
      - "POST /pre-opening/punch-list-items (with QualityInspector)"
      - "all GET endpoints and POST /_clock/set_current_utc"
  - name: LicensingCoordinator
    description: "Sequences permits and records the authority's review decisions."
    identity: opaque
    exclusive_operations:
      - "POST /pre-opening/permit-applications/{id}/submit"
      - "POST /pre-opening/permit-applications/{id}/record-review"
    shared_operations:
      - "POST /pre-opening/permit-applications (with ProgramDirector)"
      - "all GET endpoints and POST /_clock/set_current_utc"
  - name: SystemsIntegrator
    description: "Implements and tests the property systems; records test runs and certifies systems."
    identity: opaque
    exclusive_operations:
      - "POST /pre-opening/system-implementations/{id}/test-runs"
    shared_operations:
      - "POST /pre-opening/system-implementations, POST /pre-opening/system-implementations/{id}/certify (with ProgramDirector)"
      - "all GET endpoints and POST /_clock/set_current_utc"
  - name: TalentManager
    description: "Owns the staggered hiring plan and the pre-opening training calendar."
    identity: opaque
    exclusive_operations:
      - "POST /pre-opening/hires"
      - "POST /pre-opening/hires/{id}/respond"
      - "POST /pre-opening/hires/{id}/assign-orientation"
      - "POST /pre-opening/hires/{id}/onboard"
      - "POST /pre-opening/training-sessions/{id}/complete"
      - "POST /pre-opening/training-sessions/{id}/cancel"
    shared_operations:
      - "POST /pre-opening/hiring-plans, POST /pre-opening/training-sessions (with ProgramDirector)"
      - "all GET endpoints and POST /_clock/set_current_utc"
  - name: ProcurementManager
    description: "Commits, receives and cancels operating supplies and equipment orders."
    identity: opaque
    exclusive_operations:
      - "POST /pre-opening/ose-orders"
      - "POST /pre-opening/ose-orders/{id}/receive"
      - "POST /pre-opening/ose-orders/{id}/cancel"
    shared_operations:
      - "all GET endpoints and POST /_clock/set_current_utc"
  - name: CommercialDirector
    description: "Runs the reservation ramp: booking acceptance windows, block acceptance, guarantees and cancellation contingency."
    identity: opaque
    exclusive_operations:
      - "POST /pre-opening/programs/{id}/open-booking"
      - "POST /pre-opening/programs/{id}/suspend-booking"
      - "POST /pre-opening/reservation-blocks"
      - "POST /pre-opening/reservation-blocks/{id}/guarantee"
      - "POST /pre-opening/reservation-blocks/{id}/resolve-contingency"
    shared_operations:
      - "all GET endpoints and POST /_clock/set_current_utc"
  - name: QualityInspector
    description: "Independent closure authority for punch list defects; may never verify an item they submitted."
    identity: opaque
    exclusive_operations:
      - "POST /pre-opening/punch-list-items/{id}/verify"
      - "POST /pre-opening/punch-list-items/{id}/reopen"
    shared_operations:
      - "POST /pre-opening/punch-list-items (with ConstructionManager)"
      - "all GET endpoints and POST /_clock/set_current_utc"
