              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "first patch succeeds: version becomes ${cx_v} + 1 (== 2), aadt 6000, exposure_index 6.00"
            - "second patch with the stale ${cx_v}: error_id == ERR_STALE_VERSION (http 412), aadt stays 6000"

