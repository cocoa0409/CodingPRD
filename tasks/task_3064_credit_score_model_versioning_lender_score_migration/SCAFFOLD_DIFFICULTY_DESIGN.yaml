# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3064_credit_score_model_versioning_lender_score_migration
#
# Every instance grounds only in elements already declared in SCAFFOLD.yaml
# §1.1–§1.7. Deleting this file leaves the scaffold's declared behaviour
# identical.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (>= 2, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_cutoff_recalibration_paths
        grounds:
          - calculations.cutoff_recalibration
          - endpoints.POST_/migration-events
          - entities.ScoreVariant.fields.ref_score
          - entities.ScoreVariant.fields.double_odds_points
        distinguishing_aspect: |
          Two valid reruns of the same calibration run over identical odds-to-score
          inputs disagree by 10 whole points: the score-preserving path holds rank
          and returns 660, while the odds-preserving path holds the breakeven odds
          and returns 670. The two variants are RECALIBRATED-shape on the migration
          domain and use each variant's own ref_score and double_odds_points, not a
          single shared curve, so they cannot be reduced to one another.
        test_recipe:
          setup:
            - "Empty database; logical clock at the fixed default 2026-09-01T00:00:00Z."
            - "CREDIT-DUAL-V1 (release M1) carries a released AUTO variant: ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets [0, 10, -6], rounding_penalty_pct 0.02, aggregate_weight_pct 0.42, elongation_points 700, cutoff_baseline 700."
            - "PRIME-SHIFT-V2 (release M2) carries a released AUTO variant whose odds-to-score relationship is wider: ref_score 680, base_odds 20.0, double_odds_points 40, segment_width 60, segment_offsets [0, 6, -4], rounding_penalty_pct 0.02, aggregate_weight_pct 0.42, elongation_points 680, cutoff_baseline 660."
            - "No scores posted yet, so neither variant has any stored ledger."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "PRIME-SHIFT-V2", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m2: $.data.id}}
            - {call: "POST /score-models/${m2}/variants", payload: {industry: "AUTO", ref_score: 680, base_odds: 20.0, double_odds_points: 40, segment_width: 60, segment_offsets: [0, 6, -4], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 680, cutoff_baseline: 660}, as: ModelDeveloper, captures: {v2_auto: $.data.id}}
            - {call: "POST /score-variants/${v2_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m2}", doc_type: "MODEL_RISK_REPORT", required_version_label: "PRIME-SHIFT-V2"}, as: ComplianceOfficer, captures: {md2: $.data.id, md2_v: $.data.version}}
            - {call: "POST /model-documentation/${md2}/file", payload: {expected_documentation_version: "${md2_v}"}, as: ComplianceOfficer}
          trigger:
            - {call: "POST /migration-events", payload: {lender_code: "LEND-NORTH", from_score_variant_id: "${v1_auto}", to_score_variant_id: "${v2_auto}", event_type: "RECALIBRATED", evidence_ref: "WS-2026-014", old_cutoff_score: 640}, as: ComplianceOfficer, captures: {me1: $.data.migration_event_id, sp: $.data.new_cutoff_score_preserving, op: $.data.new_cutoff_odds_preserving, dis: $.data.cutoff_disagreement_points}}
          assert:
            - "the response status is 201 and data.new_cutoff_score_preserving == 660"
            - "data.new_cutoff_odds_preserving == 670"
            - "data.cutoff_disagreement_points == -10"
            - "data.credited_delta_bps == -20 && data.new_cutoff_score_preserving != data.new_cutoff_odds_preserving"

      - name: dual_variant_weighted_and_unweighted_composites
        grounds:
          - calculations.composite_score
          - calculations.bureau_discrepancy_scan
          - endpoints.GET_/score-results/{scoreResultId}/bureau-discrepancies
          - entities.ScoreResult.fields.effective_score
        distinguishing_aspect: |
          On the same three-bureau capture the weighted composite is 699.91 while the
          unweighted variant is 699.66, a 0.25-point gap produced by the per-posting
          rounding step; the unweighted path also truncates toward zero to a
          hundredth before rounding, so both the membership weights and the rounding
          order are load-bearing. This instance lives on the supported-consumer
          scoring domain, not on the migration-calibration domain.
        test_recipe:
          setup:
            - "Three bureaus TUC / EXP / EQF registered; release M1 (CREDIT-DUAL-V1) carries three released variants — AUTO (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets [0, 10, -6], rounding_penalty_pct 0.02), BANKCARD (weight 0.33, same curve), MORTGAGE (weight 0.25, same curve)."
            - "One consumer 'cons-901' with a COMPILED reference set on M1."
            - "Three licenses under one lender code LEND-NORTH, one per variant, each ACTIVE and each with entitled_count 500."
            - "Three posted scores on consumer 'cons-901': AUTO raw 715 -> effective 700; BANKCARD raw 717 -> effective 702; MORTGAGE raw 712 -> effective 697. Each posting settles a MARGINAL_PRICING ledger entry."
            - "One CROSS_BUREAU validation study on M1 has already run and stored weighted_composite 699.91, unweighted_composite 699.66 and reconciliation_variance 0.25."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /bureaus", payload: {bureau_code: "EXP", display_name: "Experian"}, as: BureauAdministrator, captures: {b_exp: $.data.id}}
            - {call: "POST /bureaus", payload: {bureau_code: "EQF", display_name: "Equifax"}, as: BureauAdministrator, captures: {b_eqf: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "BANKCARD", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.33, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_bank: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "MORTGAGE", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.25, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_mtg: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /score-variants/${v1_bank}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /score-variants/${v1_mtg}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-901", age_years: 44, is_protected_class: false}, as: FairLendingOfficer, captures: {c901: $.data.id}}
            - {call: "POST /reference-sets", payload: {consumer_id: "${c901}", score_model_id: "${m1}"}, as: FairLendingOfficer, captures: {rs1: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic_auto: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_bank}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic_bank: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_mtg}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic_mtg: $.data.id}}
            - {call: "GET /licenses/${lic_auto}", payload: {}, as: ComplianceOfficer, captures: {lic_auto_v: $.data.version}}
            - {call: "POST /licenses/${lic_auto}/activate", payload: {expected_license_version: "${lic_auto_v}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic_bank}", payload: {}, as: ComplianceOfficer, captures: {lic_bank_v: $.data.version}}
            - {call: "POST /licenses/${lic_bank}/activate", payload: {expected_license_version: "${lic_bank_v}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic_mtg}", payload: {}, as: ComplianceOfficer, captures: {lic_mtg_v: $.data.version}}
            - {call: "POST /licenses/${lic_mtg}/activate", payload: {expected_license_version: "${lic_mtg_v}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic_auto}", payload: {}, as: ScoreConsumer, as_user_id: "${lic_auto}", captures: {lic_auto_v2: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c901}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic_auto}", raw_posted_score: 715, expected_license_version: "${lic_auto_v2}"}, as: ScoreConsumer, as_user_id: "${lic_auto}", captures: {sr_auto: $.data.id}}
            - {call: "GET /licenses/${lic_bank}", payload: {}, as: ScoreConsumer, as_user_id: "${lic_bank}", captures: {lic_bank_v2: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c901}", score_variant_id: "${v1_bank}", bureau_id: "${b_exp}", license_id: "${lic_bank}", raw_posted_score: 717, expected_license_version: "${lic_bank_v2}"}, as: ScoreConsumer, as_user_id: "${lic_bank}", captures: {sr_bank: $.data.id}}
            - {call: "GET /licenses/${lic_mtg}", payload: {}, as: ScoreConsumer, as_user_id: "${lic_mtg}", captures: {lic_mtg_v2: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c901}", score_variant_id: "${v1_mtg}", bureau_id: "${b_eqf}", license_id: "${lic_mtg}", raw_posted_score: 712, expected_license_version: "${lic_mtg_v2}"}, as: ScoreConsumer, as_user_id: "${lic_mtg}", captures: {sr_mtg: $.data.id}}
            - {call: "POST /archive-samples", payload: {score_model_id: "${m1}", sample_ref: "XFER-01", record_count: 5000, segment_name: "PRIME", sample_kind: "VALIDATION", observation_window_months: 24, window_start_month: "2024-01", window_end_month: "2026-01"}, as: ValidationAnalyst, captures: {s_xfer: $.data.id}}
          trigger:
            - {call: "POST /validation-studies", payload: {score_model_id: "${m1}", sample_id: "${s_xfer}", study_path: "CROSS_BUREAU", performed_by: "va-001"}, as: ValidationAnalyst, captures: {study: $.data.id}}
            - {call: "GET /validation-studies/${study}", payload: {}, as: ValidationAnalyst, captures: {study_v: $.data.version}}
            - {call: "POST /validation-studies/${study}/run", payload: {expected_study_version: "${study_v}"}, as: ValidationAnalyst, captures: {wc: $.data.weighted_composite, uc: $.data.unweighted_composite, rv: $.data.reconciliation_variance}}
          assert:
            - "data.weighted_composite == 699.91"
            - "data.unweighted_composite == 699.66"
            - "data.reconciliation_variance == 0.25"
            - "data.weighted_composite != data.unweighted_composite"
            - "ScoreResult.${sr_auto}.effective_score == 700 && ScoreResult.${sr_bank}.effective_score == 702 && ScoreResult.${sr_mtg}.effective_score == 697"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (>= 2, different modes from {(a),(b),(c)})
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_formula_tiered_marginal_and_overage_fee
        grounds:
          - calculations.license_marginal_fee
          - validations[priority=15]
          - endpoints.POST_/licenses/{licenseId}/fee-quotes
          - endpoints.POST_/score-results
        distinguishing_aspect: |
          Mode (a): the fee is a nested conditional over three rate bands plus an
          overage term whose trigger is a comparison against entitled_count — the
          third posting under a VOLUME_TIER_3 label quotes 42 blended cents but
          settles 54 marginal cents, and crossing the tier boundary at exactly
          10000 falls to the 14-cent rate on unit 10001 while the overage surcharge
          applies at and beyond entitled_count. Mode (c) is also present, since the
          tier index is selected by the cumulative count the fee itself advances.
        test_recipe:
          setup:
            - "One bureau TUC; release M1 with a released AUTO variant (weight 0.42, ref_score 700, base_odds 18.0, double_odds_points 35, segment_width 60, segment_offsets [0, 10, -6], rounding_penalty_pct 0.02, cutoff_baseline 700, elongation_points 700)."
            - "One license LEND-SMALL on the AUTO variant, volume_tier VOLUME_TIER_3, entitled_count 2, ACTIVE, with cumulative_score_count 2 and cumulative_fee_cents 36 after two settled postings."
            - "One consumer 'cons-770'; no reference set is required, so reference_set_id is null on the postings."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-770", age_years: 51, is_protected_class: false}, as: ModelDeveloper, captures: {c770: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "Small Lender", lender_code: "LEND-SMALL", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_3", entitled_count: 2, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {lic_v0: $.data.version}}
            - {call: "POST /licenses/${lic}/activate", payload: {expected_license_version: "${lic_v0}"}, as: ComplianceOfficer}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {lic_v1: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c770}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${lic_v1}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {sr_a: $.data.id}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ScoreConsumer, as_user_id: "${lic}", captures: {lic_v2: $.data.version}}
            - {call: "POST /score-results", payload: {consumer_id: "${c770}", score_variant_id: "${v1_auto}", bureau_id: "${b_tuc}", license_id: "${lic}", raw_posted_score: 715, expected_license_version: "${lic_v2}"}, as: ScoreConsumer, as_user_id: "${lic}", captures: {sr_b: $.data.id}}
          trigger:
            - {call: "POST /licenses/${lic}/fee-quotes", payload: {prospective_count: 3}, as: ComplianceOfficer, captures: {q_marginal: $.data.marginal_fee_cents, q_blended: $.data.blended_fee_cents}}
            - {call: "GET /licenses/${lic}", payload: {}, as: ComplianceOfficer, captures: {lic_v3: $.data.version}}
            - {call: "POST /licenses/${lic}/fee-quotes", payload: {prospective_count: 10001}, as: ComplianceOfficer, captures: {q_marginal_10001: $.data.marginal_fee_cents, q_blended_10001: $.data.blended_fee_cents, q_tier_10001: $.data.tier_index}}
          assert:
            - "data.q_marginal == 54 && data.q_blended == 42"
            - "data.q_marginal == 18 + 18 + 18, i.e. three first-band charges, because prospective_count 3 sits wholly inside [0, 10000)"
            - "data.q_blended == 42 because the blended variant charges the highest tier reached against every unit"
            - "data.q_marginal_10001 == 14 && data.q_marginal_10001 != 54"
            - "data.q_tier_10001 == 1"
            - "the two settled postings left License.${lic}.cumulative_score_count == 2 and License.${lic}.cumulative_fee_cents == 36"

      - name: combinatorial_formula_per_posting_rounding_order
        grounds:
          - calculations.composite_score
          - entities.ScoreVariant.fields.aggregate_weight_pct
          - endpoints.POST_/validation-studies/{studyId}/run
        distinguishing_aspect: |
          Mode (b): the weighted variant rounds each per-posting product to two
          decimals before summing while the unweighted variant truncates the mean
          toward zero before rounding — reversing either order changes the reported
          composite, and the scaffold pins both orders explicitly. The two variants
          run over one three-member capture whose weights 0.42 / 0.33 / 0.25 also
          fail to sum to unity, so the composition of weights and rounding order is
          observable.
        test_recipe:
          setup:
            - "Same three-bureau M1 fixture as the weighted/unweighted composite instance: AUTO 0.42, BANKCARD 0.33, MORTGAGE 0.25, all with the CREDIT-DUAL-V1 curve."
            - "Consumer 'cons-902' with postings AUTO raw 715 -> effective 700 (TUC), BANKCARD raw 717 -> effective 702 (EXP), MORTGAGE raw 712 -> effective 697 (EQF), settled under three ACTIVE licenses named LEND-NORTH."
            - "A CROSS_BUREAU validation study on M1 carrying touched_model_ids ['<m1 id>']."
          setup_api_calls:
            - {call: "POST /bureaus", payload: {bureau_code: "TUC", display_name: "TransUnion"}, as: BureauAdministrator, captures: {b_tuc: $.data.id}}
            - {call: "POST /bureaus", payload: {bureau_code: "EXP", display_name: "Experian"}, as: BureauAdministrator, captures: {b_exp: $.data.id}}
            - {call: "POST /bureaus", payload: {bureau_code: "EQF", display_name: "Equifax"}, as: BureauAdministrator, captures: {b_eqf: $.data.id}}
            - {call: "POST /score-models", payload: {family_code: "FICO_CORE", version_label: "CREDIT-DUAL-V1", min_input_count: 100, score_floor: 300, score_ceiling: 850}, as: ModelDeveloper, captures: {m1: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "AUTO", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.42, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_auto: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "BANKCARD", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.33, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_bank: $.data.id}}
            - {call: "POST /score-models/${m1}/variants", payload: {industry: "MORTGAGE", ref_score: 700, base_odds: 18.0, double_odds_points: 35, segment_width: 60, segment_offsets: [0, 10, -6], rounding_penalty_pct: 0.02, aggregate_weight_pct: 0.25, elongation_points: 700, cutoff_baseline: 700}, as: ModelDeveloper, captures: {v1_mtg: $.data.id}}
            - {call: "POST /score-variants/${v1_auto}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /score-variants/${v1_bank}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /score-variants/${v1_mtg}/release", payload: {}, as: ModelDeveloper}
            - {call: "POST /model-documentation", payload: {score_model_id: "${m1}", doc_type: "MODEL_RISK_REPORT", required_version_label: "CREDIT-DUAL-V1"}, as: ComplianceOfficer, captures: {md1: $.data.id, md1_v: $.data.version}}
            - {call: "POST /model-documentation/${md1}/file", payload: {expected_documentation_version: "${md1_v}"}, as: ComplianceOfficer}
            - {call: "GET /score-models/${m1}", payload: {}, as: ModelDeveloper, captures: {m1_v: $.data.version}}
            - {call: "POST /score-models/${m1}/release", payload: {expected_model_version: "${m1_v}"}, as: ModelDeveloper}
            - {call: "POST /consumers", payload: {consumer_ref: "cons-902", age_years: 38, is_protected_class: false}, as: ModelDeveloper, captures: {c902: $.data.id}}
            - {call: "POST /licenses", payload: {lender_name: "North Bank", lender_code: "LEND-NORTH", score_variant_id: "${v1_auto}", volume_tier: "VOLUME_TIER_1", entitled_count: 500, window_start_month: "2026-01", window_end_month: "2027-01"}, as: ComplianceOfficer, captures: {lic_auto: $.data.id}}
