# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of every other testable claim
# the §1.1–§1.7 surface declares, beyond the nine Difficulty Rules (§1.8).
# Walks references/claim-extraction-guide.md section by section.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_office_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Office, endpoints]
        distinguishing_aspect: "POST /offices with name/efin/state_code → 201; efin_status defaults ACTIVE, open_return_count defaults 0, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /offices"
              payload: { name: "Fresh Office", efin: "100001", state_code: "CA" }
              as: OfficeManager
              captures: { office_id: $.data.id }
          assert:
            - "Response 201; Office.${office_id}.efin_status == ACTIVE"
            - "Office.${office_id}.open_return_count == 0 and version == 1 and bank_product_enabled == false"

      - name: get_return_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.TaxReturn, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /returns/{id} with a UUID that was never created → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /returns/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OfficeManager
              captures: { err: $.data.error_id }
          assert:
            - "Response 404; error_id == ERR_NOT_FOUND"

      - name: create_return_missing_required_office_id_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.TaxReturn, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /returns omitting required office_id → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One office and client exist."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Req Office", efin: "100002", state_code: "TX" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Req Cli", ssn_last4: "3030" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /returns"
              payload: { client_id: "${client_id}", tax_year: 2025 }
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "Response 422; error_id == ERR_INVALID_REQUEST (office_id missing)"

      - name: create_return_default_kind_and_band_applied
        claim_type: Defaults
        grounds: [entities.TaxReturn.fields.return_kind, entities.TaxReturn.fields.complexity_band, entities.TaxReturn.fields.status]
        distinguishing_aspect: "POST /returns omitting return_kind/complexity_band → return_kind ORIGINAL, complexity_band SIMPLE, status INTAKE applied."
        test_recipe:
          setup: ["Office + client."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Def Office", efin: "100003", state_code: "FL" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Def Cli", ssn_last4: "3131" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025 }
              as: FrontDeskAgent
              captures: { ret_id: $.data.id }
          assert:
            - "TaxReturn.${ret_id}.return_kind == ORIGINAL, complexity_band == SIMPLE, status == INTAKE"

      - name: create_client_invalid_risk_band_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Client.fields.risk_band, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /offices/{id}/clients with risk_band not in {LOW,MEDIUM,HIGH} → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One office."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Enum Office", efin: "100004", state_code: "NY" }
              as: OfficeManager
              captures: { office_id: $.data.id }
          trigger:
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Enum Cli", ssn_last4: "3232", risk_band: "EXTREME" }
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "Response 422; error_id == ERR_INVALID_REQUEST"

      - name: appointment_end_not_after_start_rejected
        claim_type: Type Constraints
        grounds: [entities.Appointment.fields.end_utc, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST appointment with end_utc <= start_utc → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Office + preparer + client."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Bad Window", efin: "100005", state_code: "OH" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /credentials"
              payload: { office_id: "${office_id}", ptin: "P50505050", holder_name: "Bw Bo", expires_on: "2027-01-01T00:00:00Z" }
              as: OfficeManager
              captures: { cred_id: $.data.id }
            - call: "POST /offices/${office_id}/preparers"
              payload: { credential_id: "${cred_id}", full_name: "Bw Bo" }
              as: OfficeManager
              captures: { prep_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Bw Cli", ssn_last4: "3434" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /offices/${office_id}/appointments"
              payload: { client_id: "${client_id}", preparer_id: "${prep_id}", start_utc: "2026-06-10T10:00:00Z", end_utc: "2026-06-10T10:00:00Z" }
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "Response 422; error_id == ERR_INVALID_REQUEST (end_utc not strictly after start_utc)"

      - name: system_fields_ignored_on_return_create
        claim_type: System Fields
        grounds: [entities.TaxReturn.fields.status, entities.TaxReturn.fields.prep_fee_cents]
        distinguishing_aspect: "status and prep_fee_cents are source:system/computed; a client cannot set them on create — status is INTAKE and prep_fee_cents is unset/0 regardless of body."
        test_recipe:
          setup: ["Office + client."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Sys Office", efin: "100006", state_code: "PA" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Sys Cli", ssn_last4: "3535" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025, complexity_band: "SIMPLE" }
              as: FrontDeskAgent
              captures: { ret_id: $.data.id }
          assert:
            - "TaxReturn.${ret_id}.status == INTAKE (system-set, not from input)"

      - name: list_offices_clients_pagination_envelope
        claim_type: Listing
        grounds: [entities.Client, endpoints]
        distinguishing_aspect: "GET /offices/{id}/clients returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Office with two clients."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "List Office", efin: "100007", state_code: "GA" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "L One", ssn_last4: "3636" }
              as: FrontDeskAgent
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "L Two", ssn_last4: "3737" }
              as: FrontDeskAgent
          trigger:
            - call: "GET /offices/${office_id}/clients"
              payload: { limit: 10, offset: 0 }
              as: FrontDeskAgent
          assert:
            - "response_type == array; meta.total_count == 2; has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_appointment_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Appointment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An Appointment already COMPLETED (terminal) cannot transition to CANCELLED → ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["Office; preparer; client; appointment checked-in then completed (clock past start)."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Term Office", efin: "100008", state_code: "MI" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /credentials"
              payload: { office_id: "${office_id}", ptin: "P60606060", holder_name: "Te Ted", expires_on: "2027-01-01T00:00:00Z" }
              as: OfficeManager
              captures: { cred_id: $.data.id }
            - call: "POST /offices/${office_id}/preparers"
              payload: { credential_id: "${cred_id}", full_name: "Te Ted" }
              as: OfficeManager
              captures: { prep_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Te Cli", ssn_last4: "3838" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /offices/${office_id}/appointments"
              payload: { client_id: "${client_id}", preparer_id: "${prep_id}", start_utc: "2026-05-02T09:00:00Z", end_utc: "2026-05-02T10:00:00Z" }
              as: FrontDeskAgent
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:30:00Z" }
              as: OfficeManager
            - call: "POST /appointments/${appt_id}/transition"
              payload: { to: "CHECKED_IN" }
              as: FrontDeskAgent
            - call: "POST /appointments/${appt_id}/transition"
              payload: { to: "COMPLETED" }
              as: FrontDeskAgent
          trigger:
            - call: "POST /appointments/${appt_id}/transition"
              payload: { to: "CANCELLED" }
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "Response 409; error_id == ERR_INVALID_STATE; Appointment.${appt_id}.status == COMPLETED"

      - name: docs_pending_without_documents_returns_no_documents
        claim_type: Precondition Enforcement
        grounds: [state_machines.TaxReturn.INTAKE_to_DOCS_PENDING, "errors[ERR_NO_DOCUMENTS]"]
        distinguishing_aspect: "INTAKE → DOCS_PENDING with zero DocumentIntake rows → ERR_NO_DOCUMENTS (409)."
        test_recipe:
          setup: ["Office + client + a fresh INTAKE return with no documents."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "NoDoc Office", efin: "100009", state_code: "NC" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Nd Cli", ssn_last4: "3939" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025 }
              as: FrontDeskAgent
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "DOCS_PENDING" }
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
          assert:
            - "Response 409; error_id == ERR_NO_DOCUMENTS; TaxReturn.${ret_id}.status == INTAKE"

      - name: in_prep_with_required_doc_pending_returns_required_docs_missing
        claim_type: Precondition Enforcement
        grounds: [state_machines.TaxReturn.DOCS_PENDING_to_IN_PREP, "errors[ERR_REQUIRED_DOCS_MISSING]"]
        distinguishing_aspect: "DOCS_PENDING → IN_PREP with a required document still PENDING → ERR_REQUIRED_DOCS_MISSING (409)."
        test_recipe:
          setup: ["Return in DOCS_PENDING with an assigned ACTIVE-credential preparer and a required doc still PENDING."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "ReqDoc Office", efin: "100010", state_code: "VA" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /credentials"
              payload: { office_id: "${office_id}", ptin: "P70707070", holder_name: "Rd Ron", expires_on: "2027-01-01T00:00:00Z" }
              as: OfficeManager
              captures: { cred_id: $.data.id }
            - call: "POST /offices/${office_id}/preparers"
              payload: { credential_id: "${cred_id}", full_name: "Rd Ron" }
              as: OfficeManager
              captures: { prep_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Rd Cli", ssn_last4: "4040" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025 }
              as: FrontDeskAgent
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/documents"
              payload: { doc_type: "W2", is_required: true }
              as: FrontDeskAgent
            - call: "POST /returns/${ret_id}/assign"
              payload: { preparer_id: "${prep_id}" }
              as: OfficeManager
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "DOCS_PENDING" }
              as: FrontDeskAgent
          trigger:
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "IN_PREP" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 409; error_id == ERR_REQUIRED_DOCS_MISSING; TaxReturn.${ret_id}.status == DOCS_PENDING"

      - name: in_prep_without_preparer_returns_preparer_not_assigned
        claim_type: Precondition Enforcement
        grounds: [state_machines.TaxReturn.DOCS_PENDING_to_IN_PREP, "errors[ERR_PREPARER_NOT_ASSIGNED]"]
        distinguishing_aspect: "DOCS_PENDING → IN_PREP with preparer_id null → ERR_PREPARER_NOT_ASSIGNED (409)."
        test_recipe:
          setup: ["Return in DOCS_PENDING, required doc WAIVED, but no preparer assigned."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "NoPrep Office", efin: "100011", state_code: "SC" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Np Cli", ssn_last4: "4141" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025 }
              as: FrontDeskAgent
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/documents"
              payload: { doc_type: "W2", is_required: true }
              as: FrontDeskAgent
              captures: { doc_id: $.data.id }
            - call: "POST /documents/${doc_id}/status"
              payload: { status: "WAIVED" }
              as: FrontDeskAgent
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "DOCS_PENDING" }
              as: FrontDeskAgent
          trigger:
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "IN_PREP" }
              as: TaxPreparer
              as_user_id: "00000000-0000-4000-8000-000000000abc"
              captures: { err: $.data.error_id }
          assert:
            - "Response 409; error_id == ERR_PREPARER_NOT_ASSIGNED; TaxReturn.${ret_id}.status == DOCS_PENDING"

      - name: efile_ack_from_prepared_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TaxReturn.EFILED_PENDING_to_EFILED_ACCEPTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "efile-ack ACCEPTED on a return in PREPARED (never transmitted) is an undefined transition — the from-state isn't EFILED_PENDING, so ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Return PREPARED, never e-filed."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "NoTx Office", efin: "100012", state_code: "TN" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /credentials"
              payload: { office_id: "${office_id}", ptin: "P80808080", holder_name: "Nt Nat", expires_on: "2027-01-01T00:00:00Z" }
              as: OfficeManager
              captures: { cred_id: $.data.id }
            - call: "POST /offices/${office_id}/preparers"
              payload: { credential_id: "${cred_id}", full_name: "Nt Nat" }
              as: OfficeManager
              captures: { prep_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Nt Cli", ssn_last4: "4242" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025, complexity_band: "SIMPLE" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/documents"
              payload: { doc_type: "W2", is_required: true }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /documents/${doc_id}/status"
              payload: { status: "RECEIVED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/assign"
              payload: { preparer_id: "${prep_id}" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "DOCS_PENDING" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "IN_PREP" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "PREPARED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
          trigger:
            - call: "POST /returns/${ret_id}/efile-ack"
              payload: { ack_status: "ACCEPTED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 409; error_id == ERR_INVALID_STATE (return is PREPARED, not EFILED_PENDING); TaxReturn.${ret_id}.status == PREPARED"

      - name: efile_ack_rejected_without_code_returns_reject_code_required
        claim_type: Precondition Enforcement
        grounds: [state_machines.TaxReturn.EFILED_PENDING_to_EFILED_REJECTED, "errors[ERR_REJECT_CODE_REQUIRED]"]
        distinguishing_aspect: "efile-ack REJECTED with no reject_code on an EFILED_PENDING return → ERR_REJECT_CODE_REQUIRED (422)."
        test_recipe:
          setup: ["Return e-filed (EFILED_PENDING)."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Rej Office", efin: "100013", state_code: "AL" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /credentials"
              payload: { office_id: "${office_id}", ptin: "P90909090", holder_name: "Rj Roy", expires_on: "2027-01-01T00:00:00Z" }
              as: OfficeManager
              captures: { cred_id: $.data.id }
            - call: "POST /offices/${office_id}/preparers"
              payload: { credential_id: "${cred_id}", full_name: "Rj Roy" }
              as: OfficeManager
              captures: { prep_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Rj Cli", ssn_last4: "4343" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025, complexity_band: "SIMPLE" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/documents"
              payload: { doc_type: "W2", is_required: true }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /documents/${doc_id}/status"
              payload: { status: "RECEIVED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/assign"
              payload: { preparer_id: "${prep_id}" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "DOCS_PENDING" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "IN_PREP" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/transition"
              payload: { to: "PREPARED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
            - call: "POST /returns/${ret_id}/efile"
              payload: {}
              as: TaxPreparer
              as_user_id: "${prep_id}"
          trigger:
            - call: "POST /returns/${ret_id}/efile-ack"
              payload: { ack_status: "REJECTED" }
              as: TaxPreparer
              as_user_id: "${prep_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 422; error_id == ERR_REJECT_CODE_REQUIRED; TaxReturn.${ret_id}.status == EFILED_PENDING"

      - name: initial_state_of_new_return_is_intake
        claim_type: Initial State
        grounds: [state_machines.TaxReturn, entities.TaxReturn.fields.status]
        distinguishing_aspect: "A newly created TaxReturn starts in INTAKE (the declared initial_state)."
        test_recipe:
          setup: ["Office + client."]
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Init Office", efin: "100014", state_code: "KY" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "It Cli", ssn_last4: "4444" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025 }
              as: FrontDeskAgent
              captures: { ret_id: $.data.id }
          assert:
            - "TaxReturn.${ret_id}.status == INTAKE"

      - name: cancel_audit_protection_after_return_accepted_rejected
        claim_type: guarded transitions
        grounds: [state_machines.AuditProtection.ACTIVE_to_CANCELLED, "errors[ERR_RETURN_ALREADY_ACCEPTED]"]
        distinguishing_aspect: "Cross-entity guard: cancelling an ACTIVE AuditProtection when the linked TaxReturn is EFILED_ACCEPTED → ERR_RETURN_ALREADY_ACCEPTED (409)."
        test_recipe:
          setup: ["Bank-product office; SIMPLE return accepted; AuditProtection ACTIVE on it."]
