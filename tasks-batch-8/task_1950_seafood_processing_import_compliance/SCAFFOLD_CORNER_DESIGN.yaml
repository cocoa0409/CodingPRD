            - { call: "POST /seafood/finished-product-lots/${fin_id}/apply-label", payload: { product_label_id: "${lbl_id}" }, as: ProcessingSupervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_LABEL_NOT_APPROVED with http 409; lot remains UNLABELED"

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: supplier_create_by_inspector_unauthorized
        claim_type: role_denial
        grounds: ["roles[ComplianceManager].exclusive_operations", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "ReceivingInspector (a peer role) cannot create suppliers: POST /seafood/suppliers is ComplianceManager-exclusive -> ERR_UNAUTHORIZED_ROLE (403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "X", country_code: "US", facility_registration_number: "FRN-R01" }, as: ReceivingInspector, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE with http 403"

      - name: peer_roles_cannot_cross_unauthorized
        claim_type: role_denial
        grounds: ["roles[ImportCoordinator].exclusive_operations", "roles[ComplianceManager].exclusive_operations", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Segregation of duties across peer roles: ProcessingSupervisor cannot file prior notice (ImportCoordinator-exclusive) and ImportCoordinator cannot approve labels (ComplianceManager-exclusive); both fail ERR_UNAUTHORIZED_ROLE."
        test_recipe:
          setup: ["approved supplier; one DRAFT entry; one DRAFT label"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Pacific Harvest Ltd", country_code: "JP", facility_registration_number: "FRN-R02" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-R02", species_declared: "TUNA", transport_mode: "VESSEL", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USLAX", goods_value_cents: 1000, freight_cost_cents: 0, duty_rate_pct: 0.0, total_weight_kg: 10 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/product-labels", payload: { market_name: "Pacific Cod", scientific_name: "Gadus macrocephalus", species: "COD", production_method: "WILD", country_of_origin: "US" }, as: ComplianceManager, captures: { lbl_id: "$.data.id" } }
          trigger:
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ProcessingSupervisor, captures: { err1: "$.data.error_id" } }
            - { call: "POST /seafood/product-labels/${lbl_id}/approve", payload: {}, as: ImportCoordinator, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == ERR_UNAUTHORIZED_ROLE and err2 == ERR_UNAUTHORIZED_ROLE (both http 403)"
            - "entry remains DRAFT; label remains DRAFT"

  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_on_complete
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[batch-complete-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ProcessingBatch.version: completing with the version observed before an input addition (or before a prior complete) is rejected ERR_STALE_VERSION (412); the same call with the fresh version succeeds."
        test_recipe:
          setup: ["ACCEPTED COD lot 100 kg; COD FILLET batch with one 100 kg input; batch version observed after the input"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Harbor Fresh", country_code: "US", facility_registration_number: "FRN-X01" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "POST /seafood/import-entries", payload: { supplier_id: "${sup_id}", entry_number: "E-X01", species_declared: "COD", transport_mode: "ROAD", scheduled_arrival: "2026-08-10T00:00:00Z", port_code: "USBLA", goods_value_cents: 100000, freight_cost_cents: 5000, duty_rate_pct: 0.0, total_weight_kg: 100 }, as: ImportCoordinator, captures: { ent_id: "$.data.id" } }
            - { call: "POST /seafood/import-entries/${ent_id}/file-prior-notice", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/file-entry", payload: {}, as: ImportCoordinator }
            - { call: "POST /seafood/import-entries/${ent_id}/fda-disposition", payload: { outcome: "RELEASED" }, as: ImportCoordinator }
            - { call: "POST /seafood/receipt-lots", payload: { import_entry_id: "${ent_id}", vessel_name: "FV Harbor", harvest_date: "2026-07-20T00:00:00Z", catch_area_code: "FAO67", harvest_country_code: "US", production_method: "WILD", species_declared: "COD", grade: "A", quantity_received_kg: 100, ice_deduction_pct: 0, receiving_temp_c: 1.0, freeze_protocol: "NONE" }, as: ReceivingInspector, captures: { lot_id: "$.data.id" } }
            - { call: "POST /seafood/species-verifications", payload: { receipt_lot_id: "${lot_id}", test_method: "SENSORY", sample_size: 2, verified_species: "COD" }, as: ReceivingInspector }
            - { call: "POST /seafood/receipt-lots/${lot_id}/accept", payload: {}, as: ReceivingInspector }
            - { call: "POST /seafood/processing-batches", payload: { target_species: "COD", product_form: "FILLET" }, as: ProcessingSupervisor, captures: { bat_id: "$.data.id" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/inputs", payload: { receipt_lot_id: "${lot_id}", quantity_kg: 100 }, as: ProcessingSupervisor }
            - { call: "GET /seafood/processing-batches/${bat_id}", payload: {}, as: ProcessingSupervisor, captures: { bat_v: "$.data.version" } }
          trigger:
            - { call: "POST /seafood/processing-batches/${bat_id}/complete", payload: { expected_batch_version: "${bat_v}", actual_output_kg: 42.0, trim_waste_kg: 50.0, other_waste_kg: 8.0 }, as: ProcessingSupervisor, captures: { st1: "$.data.status" } }
            - { call: "POST /seafood/processing-batches/${bat_id}/reopen", payload: {}, as: ProcessingSupervisor }
            - { call: "POST /seafood/processing-batches/${bat_id}/complete", payload: { expected_batch_version: "${bat_v}", actual_output_kg: 42.0, trim_waste_kg: 50.0, other_waste_kg: 8.0 }, as: ProcessingSupervisor, captures: { err: "$.data.error_id" } }
          assert:
            - "first complete with fresh version succeeds: status == COMPLETED"
            - "second complete replaying the stale version ${bat_v}: error_id == ERR_STALE_VERSION with http 412"
            - "batch version incremented on every mutation (create 1 -> input 2 -> complete 3 -> reopen 4)"

      - name: occ_stale_version_on_evaluation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[supplier-evaluation-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on ForeignSupplier.version: an evaluation created against the pre-suspend version is rejected ERR_STALE_VERSION (412); replaying with the post-suspend version succeeds and reinstates the supplier to APPROVED."
        test_recipe:
          setup: ["supplier APPROVED (version observed), then suspended (version advanced)"]
          setup_api_calls:
            - { call: "POST /seafood/suppliers", payload: { legal_name: "Southern Seas", country_code: "AR", facility_registration_number: "FRN-X02" }, as: ComplianceManager, captures: { sup_id: "$.data.id", sup_v1: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v1}", period_start: "2024-01-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", hazard_analysis_score: 90, record_review_score: 90, performance_score: 90 }, as: ComplianceManager }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { sup_v2: "$.data.version" } }
            - { call: "POST /seafood/suppliers/${sup_id}/suspend", payload: {}, as: ComplianceManager }
          trigger:
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v2}", period_start: "2025-01-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", hazard_analysis_score: 80, record_review_score: 80, performance_score: 80 }, as: ComplianceManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { sup_v3: "$.data.version" } }
            - { call: "POST /seafood/supplier-evaluations", payload: { supplier_id: "${sup_id}", expected_supplier_version: "${sup_v3}", period_start: "2025-01-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", hazard_analysis_score: 80, record_review_score: 80, performance_score: 80 }, as: ComplianceManager, captures: { outcome: "$.data.outcome" } }
            - { call: "GET /seafood/suppliers/${sup_id}", payload: {}, as: ComplianceManager, captures: { st: "$.data.fsvp_status" } }
          assert:
            - "evaluation carrying the pre-suspend version: error_id == ERR_STALE_VERSION with http 412"
            - "retry with the fresh version succeeds: outcome == APPROVED (overall 80.00)"
            - "supplier reinstated: fsvp_status == APPROVED (SUSPENDED -> APPROVED via passing evaluation)"


