# =============================================================================
# Gym & Fitness Membership — benchmark seed tables (SCAFFOLD.yaml)
# §1.0–§1.7. Difficulty tier: Expert.
# =============================================================================

scenario: |
  Gym & Fitness Membership: membership tier/freeze, class schedule/capacity/waitlist,
  check-in/access control, personal-training session deduction, recurring dues billing,
  contract term/cooling-off cancellation, guest pass, dues delinquency

domain_name: gym-fitness-membership
api_prefix: ""   # flat topology: peer collections live at the root (/members, /class-sessions, /bookings, …)

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # class capacity + waitlist promotion + PT session pool
  secondary_archetype: compliance_audit         # cooling-off cancellation, delinquency gating, contract term
  complexity_layers:
    - optimistic_concurrency                    # OCC on ClassSession.version and PTPackage.version
    - cascading_side_effects                    # delinquency freeze cascades; cancel-booking promotes waitlist
    - dual_variant_calculation                  # cooling-off-vs-mid-term cancellation settlement; provisional-vs-final dues proration
    - rate_threshold_triggers                   # delinquency day thresholds; freeze-day caps
    - derived_field_reconciliation              # session booked/waitlist counts; PT sessions_remaining; member access posture

  entity_topology: flat
  # Peer entities linked by foreign keys (member_id, plan_id, session_id, package_id …);
  # collections live at the api root, NOT nested under /members/{id}/…

  state_machine_shape: parallel
  # Member carries two independent axes: membership_status (lifecycle) × dues_status
  # (delinquency). Booking has a branching/revert shape (waitlist promotion loop).

  relationship_patterns:
    - one_to_many                               # Plan→Member, Member→Booking, Member→DuesInvoice, Member→PTPackage
    - cross_aggregate                           # Booking references both Member and ClassSession

  role_model: peer_roles
  # Member acts on own bookings/check-ins/cancellation; StaffManager runs the desk,
  # billing, freezes, and ops; the two own different operation sets.

  consistency_model: immediate

# =============================================================================
# System-wide constants (pinned global values referenced by §1.2/§1.3/§1.4)
# =============================================================================
system_constants:
  COOLING_OFF_DAYS: 7              # cooling-off window length (cancellation penalty-free on/before signed_at + 7d)
  DELINQUENT_AFTER_DAYS: 15        # PAST_DUE -> DELINQUENT at >= 15 whole days since past_due_since (inclusive)
  SUSPENDED_AFTER_DAYS: 30         # DELINQUENT -> SUSPENDED at >= 30 whole days since past_due_since (inclusive)
  FIXED_MONTH_DAYS: 30             # denominator for the FINAL (fixed-30) dues-proration variant
  GUEST_PASS_VALID_DAYS: 14        # expires_at = issued_at + 14 days
  PT_CANCEL_CUTOFF_HOURS: 24       # a PT session may not be cancelled within 24h of starts_at
  PT_SESSION_MINUTES: 60           # PT busy-block length used for member PT time-overlap detection

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ----- Configuration -----
  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: tier, type: enum, source: input, description: "BASIC | PLUS | ELITE", constraints: "unique among non-archived plans" }
      - { name: monthly_dues_cents, type: integer, source: input, description: "Recurring monthly dues", constraints: ">= 0" }
      - { name: included_class_credits, type: integer, source: input, description: "Class credits granted per billing cycle", constraints: ">= 0" }
      - { name: pt_discount_pct, type: number, source: input, description: "Discount applied to PT package list price for members on this plan", default: 0, constraints: "0.0 <= x <= 0.5" }
      - { name: contract_term_months, type: integer, source: input, description: "Committed contract length in months", constraints: ">= 1" }
      - { name: early_termination_fee_cents, type: integer, source: input, description: "Flat fee assessed on mid-term cancellation outside cooling-off", constraints: ">= 0" }
      - { name: max_freeze_days_per_term, type: integer, source: input, description: "Cap on cumulative freeze days across the contract term", constraints: ">= 0" }
      - { name: guest_passes_per_cycle, type: integer, source: input, description: "Guest passes granted to the member each billing cycle", constraints: ">= 0" }
      - { name: archived, type: boolean, source: system, description: "Soft-delete flag; archived plans reject new registrations", default: false }

  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: name, type: string, source: input, description: "Facility name" }
      - { name: occupancy_cap, type: integer, source: input, description: "Maximum headcount permitted physically inside at once (max OPEN check-ins)", constraints: ">= 1" }
      - { name: current_occupancy, type: integer, source: computed, description: "Count of CheckIns at this location with status OPEN; never negative" }

  # ----- Member + Contract (parallel-axis core resource) -----
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only, never a business-decision input" }
      - { name: plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; the plan the member is enrolled on" }
      - { name: home_location_id, type: string, source: input, description: "FK -> Location.id; member's primary facility" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: email, type: string, source: input, description: "Login email", constraints: "unique across non-archived members" }
      - { name: membership_status, type: enum, source: system, description: "Lifecycle axis: PENDING | ACTIVE | FROZEN | CANCELLED. Independent of dues_status.", default: PENDING }
      - { name: dues_status, type: enum, source: system, description: "Delinquency axis: CURRENT | PAST_DUE | DELINQUENT | SUSPENDED. Evolves independently of membership_status.", default: CURRENT }
      - { name: class_credits_remaining, type: integer, source: computed, description: "Credits left this billing cycle; reset to plan.included_class_credits on each dues posting; debited on class booking, restored on eligible cancel" }
      - { name: guest_passes_remaining, type: integer, source: computed, description: "Guest passes left this cycle; reset to plan.guest_passes_per_cycle on dues posting; debited on guest-pass issue" }
      - { name: wallet_credit_cents, type: integer, source: computed, description: "Account credit balance from refunds/proration; never negative; applied to future dues" }
      - { name: cumulative_freeze_days, type: integer, source: computed, description: "Sum of freeze-day spans consumed in the current contract term; capped by plan.max_freeze_days_per_term", default: 0 }
      - { name: past_due_since, type: datetime, source: system, description: "UTC timestamp the member first became PAST_DUE in the current delinquency episode; null when CURRENT" }
      # --- contract term fields (the membership contract is folded onto the Member) ---
      - { name: contract_status, type: enum, source: system, description: "Contract-term axis (independent of membership_status & dues_status): IN_COOLING_OFF | IN_TERM | FULFILLED | TERMINATED", default: IN_COOLING_OFF }
      - { name: contract_term_months, type: integer, source: system, description: "Snapshot of plan.contract_term_months at registration; immutable" }
      - { name: signed_at, type: datetime, source: system, description: "UTC instant the contract was signed (== member registration)" }
      - { name: cooling_off_ends_at, type: datetime, source: system, description: "signed_at + COOLING_OFF_DAYS; cancellation on/before this is penalty-free (cooling-off variant)" }
      - { name: term_ends_at, type: datetime, source: system, description: "signed_at + contract_term_months calendar months; cancellation after this is penalty-free" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 on every mutation including cascaded side effects" }

  # ----- Class scheduling / capacity / waitlist (quota allocation, OCC parent) -----
  - name: ClassSession
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; where the class runs" }
      - { name: title, type: string, source: input, description: "Class title" }
      - { name: starts_at, type: datetime, source: input, description: "UTC class start instant" }
      - { name: ends_at, type: datetime, source: input, description: "UTC class end instant", constraints: "must be > starts_at" }
      - { name: capacity, type: integer, source: input, description: "Max members with BOOKED status (seated)", constraints: ">= 1" }
      - { name: waitlist_cap, type: integer, source: input, description: "Max members with WAITLISTED status", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED | COMPLETED", default: SCHEDULED }
      - { name: booked_count, type: integer, source: computed, description: "Count of Bookings on this session in status BOOKED; <= capacity" }
      - { name: waitlisted_count, type: integer, source: computed, description: "Count of Bookings on this session in status WAITLISTED; <= waitlist_cap" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 on every mutation incl. cascaded booking-count changes" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: session_id, type: string, source: input, description: "FK -> ClassSession.id; the booked class" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the booking member" }
      - { name: status, type: enum, source: system, description: "BOOKED | WAITLISTED | ATTENDED | CANCELLED | NO_SHOW", default: BOOKED }
      - { name: waitlist_position, type: integer, source: computed, description: "1-based rank among WAITLISTED bookings on the session, ordered by created_at ASC; null unless WAITLISTED" }
      - { name: credit_charged, type: boolean, source: system, description: "True if a class credit was debited from the member for this booking (BOOKED only; WAITLISTED holds no credit)", default: false }
      - { name: booked_at, type: datetime, source: system, description: "UTC instant the booking entered BOOKED (set on create-as-BOOKED or on waitlist promotion); null while WAITLISTED" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 on every mutation" }

  # ----- Personal training (session pool, OCC parent) -----
  - name: PTPackage
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owner of the package" }
      - { name: sessions_purchased, type: integer, source: input, description: "Sessions bought in this package", constraints: ">= 1" }
      - { name: list_price_cents, type: integer, source: input, description: "Pre-discount total price of the package", constraints: ">= 0" }
      - { name: price_paid_cents, type: integer, source: computed, description: "Charged price after member-plan PT discount applied (see calc pt_package_price)" }
      - { name: sessions_remaining, type: integer, source: computed, description: "sessions_purchased minus SCHEDULED+COMPLETED PTSessions, plus reinstated on cancel; never negative" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | VOID", default: ACTIVE }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 on every mutation incl. cascaded deductions" }

  - name: PTSession
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: package_id, type: string, source: input, description: "FK -> PTPackage.id; the package this session draws from" }
      - { name: trainer_name, type: string, source: input, description: "Assigned trainer" }
      - { name: starts_at, type: datetime, source: input, description: "UTC session start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW", default: SCHEDULED }
      - { name: deducted, type: boolean, source: system, description: "True while this session holds a deduction against the package (SCHEDULED/COMPLETED/NO_SHOW); false after a reinstating cancel", default: true }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 on every mutation" }

  # ----- Billing / delinquency -----
  - name: DuesInvoice
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; billed member" }
      - { name: period_start, type: datetime, source: input, description: "UTC start of the billing period this invoice covers" }
      - { name: period_end, type: datetime, source: input, description: "UTC end of the billing period", constraints: "must be > period_start" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "plan.monthly_dues_cents, pro-rated for partial first period (see calc dues_proration)" }
      - { name: wallet_applied_cents, type: integer, source: computed, description: "Wallet credit consumed against this invoice at posting time" }
      - { name: amount_due_cents, type: integer, source: computed, description: "gross_amount_cents - wallet_applied_cents; never negative" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | VOID", default: OPEN }
      - { name: due_date, type: datetime, source: input, description: "UTC date payment is due; drives delinquency day-count" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 on every mutation" }

  - name: GuestPass
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; sponsoring member" }
      - { name: guest_name, type: string, source: input, description: "Guest's name" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; facility the pass admits to" }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | EXPIRED | REVOKED", default: ISSUED }
      - { name: issued_at, type: datetime, source: system, description: "UTC issue instant" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + GUEST_PASS_VALID_DAYS (14 days); redemption after this is rejected" }
      - { name: version, type: integer, source: system, description: "OCC version; starts at 1, +1 on every mutation" }

  # ----- Access control event log -----
  - name: CheckIn
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; turnstile facility" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the entering member; null for guest entries" }
      - { name: guest_pass_id, type: string, source: input, description: "FK -> GuestPass.id; the redeemed pass for guest entries; null for member entries" }
      - { name: actor_kind, type: enum, source: system, description: "MEMBER | GUEST; derived from which FK was supplied" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; OPEN while inside, CLOSED on checkout", default: OPEN }
      - { name: created_at, type: datetime, source: system, description: "UTC entry instant" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Member: membership_status (lifecycle axis) ----
  - entity: Member
    field: membership_status
    initial_state: PENDING
    terminal_states: [CANCELLED]
    note: "Parallel axis A. Evolves independently of dues_status (axis B)."
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /members/{id}/activate"
        actor: StaffManager
        preconditions:
          - "Member's first DuesInvoice exists with status PAID (the joining invoice is settled)"
        side_effects:
          - "Set membership_status = ACTIVE"
          - "contract_status stays IN_COOLING_OFF until cooling_off_ends_at passes (see Member contract_status machine)"
          - "increments Member.version by 1"

      - from: ACTIVE
        to: FROZEN
        trigger: "POST /members/{id}/freeze"
        actor: StaffManager
        preconditions:
          - "membership_status == ACTIVE"
          - "dues_status IN {CURRENT, PAST_DUE}  (a SUSPENDED member cannot freeze — see ERR_FREEZE_BLOCKED_BY_DUES)"
          - "requested freeze span days, when added to cumulative_freeze_days, does not exceed plan.max_freeze_days_per_term (ERR_FREEZE_CAP_EXCEEDED)"
        side_effects:
          - "Set membership_status = FROZEN"
          - "Add the requested freeze span to Member.cumulative_freeze_days"
          - "All future-dated BOOKED Bookings for this member on SCHEDULED sessions starting after the freeze instant -> CANCELLED; each cancellation runs the waitlist-promotion cascade on its session and restores a class credit if credit_charged"
          - "increments Member.version by 1"

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /members/{id}/unfreeze"
        actor: StaffManager
        preconditions:
          - "membership_status == FROZEN"
        side_effects:
          - "Set membership_status = ACTIVE"
          - "increments Member.version by 1"

      - from: [PENDING, ACTIVE, FROZEN]
        to: CANCELLED
        trigger: "POST /members/{id}/cancel"
        actor: "Member or StaffManager"
        preconditions:
          - "membership_status != CANCELLED"
        side_effects:
          - "Set membership_status = CANCELLED"
          - "Compute cancellation settlement via calc cancellation_settlement (cooling-off variant vs mid-term variant); credit any refund to Member.wallet_credit_cents and assess early_termination_fee when the mid-term variant applies"
          - "contract_status -> TERMINATED (if not already FULFILLED)"
          - "All future-dated BOOKED/WAITLISTED Bookings on SCHEDULED sessions -> CANCELLED; each BOOKED cancellation runs the waitlist-promotion cascade on its session"
          - "All ACTIVE PTPackages -> VOID; their SCHEDULED PTSessions -> CANCELLED (deduction reinstated but package is VOID so sessions_remaining is frozen at the voided value)"
          - "increments Member.version by 1"

  # ---- Member: dues_status (delinquency axis) ----
  - entity: Member
    field: dues_status
    initial_state: CURRENT
    terminal_states: []
    note: "Parallel axis B. Threshold-driven by days since the oldest unpaid OPEN DuesInvoice's due_date."
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "POST /_clock/advance_dues  (delinquency sweep) — system"
        actor: system
        preconditions:
          - "Member has >= 1 OPEN DuesInvoice whose due_date is strictly before the current clock"
        side_effects:
          - "Set dues_status = PAST_DUE; set past_due_since = oldest OPEN invoice due_date"
          - "increments Member.version by 1"

      - from: PAST_DUE
        to: DELINQUENT
        trigger: "POST /_clock/advance_dues — system"
        actor: system
        preconditions:
          - "(current_clock - past_due_since) in whole days >= DELINQUENT_AFTER_DAYS (15)"
        side_effects:
          - "Set dues_status = DELINQUENT"
          - "increments Member.version by 1"

      - from: DELINQUENT
        to: SUSPENDED
        trigger: "POST /_clock/advance_dues — system"
        actor: system
        preconditions:
          - "(current_clock - past_due_since) in whole days >= SUSPENDED_AFTER_DAYS (30)"
        side_effects:
          - "Set dues_status = SUSPENDED"
          - "Cross-axis cascade: member access is blocked (check-in rejected) and class booking is blocked while SUSPENDED; this does NOT change membership_status"
          - "increments Member.version by 1"

      - from: [PAST_DUE, DELINQUENT, SUSPENDED]
        to: CURRENT
        trigger: "POST /dues-invoices/{id}/pay  (settling the oldest OPEN invoice clears the episode)"
        actor: "Member or StaffManager"
        preconditions:
          - "After this payment the member has zero OPEN DuesInvoices with due_date before the current clock"
        side_effects:
          - "Set dues_status = CURRENT; set past_due_since = null"
          - "increments Member.version by 1"

  # ---- Member: contract_status (term lifecycle axis — parallel axis C) ----
  - entity: Member
    field: contract_status
    initial_state: IN_COOLING_OFF
    terminal_states: [FULFILLED, TERMINATED]
    note: "Parallel axis C on Member. Cooling-off window then committed term; the cooling-off-vs-mid-term split governs cancellation settlement. Independent of membership_status (axis A) and dues_status (axis B)."
    transitions:
      - from: IN_COOLING_OFF
        to: IN_TERM
        trigger: "POST /_clock/advance_dues — system (clock passes cooling_off_ends_at)"
        actor: system
        preconditions:
          - "current_clock > cooling_off_ends_at"
          - "contract_status == IN_COOLING_OFF"
        side_effects:
          - "Set contract_status = IN_TERM"
          - "increments Member.version by 1"

      - from: IN_TERM
        to: FULFILLED
        trigger: "POST /_clock/advance_dues — system (clock passes term_ends_at)"
        actor: system
        preconditions:
          - "current_clock > term_ends_at"
          - "contract_status == IN_TERM"
        side_effects:
          - "Set contract_status = FULFILLED"
          - "increments Member.version by 1"

      - from: [IN_COOLING_OFF, IN_TERM]
        to: TERMINATED
        trigger: "system (driven by POST /members/{id}/cancel)"
        actor: system
        preconditions:
          - "membership_status transitions to CANCELLED"
        side_effects:
          - "Set contract_status = TERMINATED"
          - "increments Member.version by 1"

  # ---- ClassSession lifecycle ----
  - entity: ClassSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /class-sessions/{id}/cancel"
        actor: StaffManager
        preconditions:
          - "status == SCHEDULED"
          - "expected_session_version matches ClassSession.version (OCC)"
        side_effects:
          - "Set status = CANCELLED"
          - "All BOOKED and WAITLISTED Bookings on this session -> CANCELLED; each BOOKED booking that had credit_charged restores one class credit to its member"
          - "increments ClassSession.version by 1"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /class-sessions/{id}/complete"
        actor: StaffManager
        preconditions:
          - "status == SCHEDULED"
          - "current_clock >= ends_at"
          - "expected_session_version matches ClassSession.version (OCC)"
        side_effects:
          - "Set status = COMPLETED"
          - "Every Booking still in BOOKED -> NO_SHOW (member never checked in / attendance not marked)"
          - "Every WAITLISTED Booking -> CANCELLED (credit was never charged)"
          - "increments ClassSession.version by 1"

  # ---- Booking lifecycle (branching + waitlist promotion loop) ----
  - entity: Booking
    field: status
    initial_state: "BOOKED | WAITLISTED"
    terminal_states: [ATTENDED, CANCELLED, NO_SHOW]
    note: "Initial state chosen at create time by capacity: BOOKED if booked_count < capacity, else WAITLISTED."
    transitions:
      - from: WAITLISTED
        to: BOOKED
        trigger: "system (waitlist promotion when a BOOKED seat frees)"
        actor: system
        preconditions:
          - "A BOOKED booking on the same session was just CANCELLED/NO_SHOW, freeing a seat"
          - "This booking is the WAITLISTED booking with the lowest waitlist_position (earliest created_at) whose member is eligible (membership_status==ACTIVE, dues_status != SUSPENDED, class_credits_remaining >= 1)"
        side_effects:
          - "Set status = BOOKED; set booked_at = current_clock; set credit_charged = true and debit one class credit from the member"
          - "increments Booking.version and the session's ClassSession.version by 1"

      - from: BOOKED
        to: ATTENDED
        trigger: "POST /bookings/{id}/attend"
        actor: StaffManager
        preconditions:
          - "status == BOOKED"
          - "session status == SCHEDULED"
          - "Member has an OPEN CheckIn at the session's location"
        side_effects:
          - "Set status = ATTENDED"
          - "increments Booking.version by 1"

      - from: [BOOKED, WAITLISTED]
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel  (or cascaded from member freeze/cancel, session cancel)"
        actor: "Member or StaffManager or system"
        preconditions:
          - "status IN {BOOKED, WAITLISTED}"
        side_effects:
          - "Set status = CANCELLED"
          - "If credit_charged: restore one class credit to the member and set credit_charged = false"
          - "If the cancelled booking was BOOKED: run waitlist promotion on the session (promote the lowest-waitlist_position eligible WAITLISTED booking into the freed seat)"
          - "increments Booking.version and the session's ClassSession.version by 1"

      - from: BOOKED
        to: NO_SHOW
        trigger: "system (session completed with member still BOOKED)"
        actor: system
        preconditions:
          - "Owning ClassSession transitions SCHEDULED -> COMPLETED and this booking is still BOOKED"
        side_effects:
          - "Set status = NO_SHOW"
          - "Class credit is NOT restored (a no-show forfeits the credit)"
          - "increments Booking.version by 1"

  # ---- PTPackage lifecycle ----
  - entity: PTPackage
    field: status
    initial_state: ACTIVE
    terminal_states: [VOID]
    note: "EXHAUSTED is a non-terminal resting state; a reinstating PTSession cancel can move it back to ACTIVE."
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (sessions_remaining hits 0 after a PTSession is scheduled)"
        actor: system
        preconditions:
          - "sessions_remaining == 0 after deduction"
        side_effects:
          - "Set status = EXHAUSTED"
          - "increments PTPackage.version by 1"

      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (a PTSession cancel reinstates a deduction, sessions_remaining > 0)"
        actor: system
        preconditions:
          - "sessions_remaining > 0 after reinstatement"
        side_effects:
          - "Set status = ACTIVE"
          - "increments PTPackage.version by 1"

      - from: [ACTIVE, EXHAUSTED]
        to: VOID
        trigger: "system (owning Member cancelled)"
        actor: system
        preconditions:
          - "Owning Member.membership_status -> CANCELLED"
        side_effects:
          - "Set status = VOID; SCHEDULED PTSessions -> CANCELLED"
          - "increments PTPackage.version by 1"

  # ---- PTSession lifecycle ----
  - entity: PTSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /pt-sessions/{id}/complete"
        actor: StaffManager
        preconditions:
          - "status == SCHEDULED"
          - "current_clock >= starts_at"
        side_effects:
          - "Set status = COMPLETED (deduction stands; deducted stays true)"
          - "increments PTSession.version by 1"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /pt-sessions/{id}/no-show"
        actor: StaffManager
        preconditions:
          - "status == SCHEDULED"
          - "current_clock >= starts_at"
        side_effects:
          - "Set status = NO_SHOW (deduction stands; a no-show forfeits the session, deducted stays true)"
          - "increments PTSession.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pt-sessions/{id}/cancel"
        actor: "Member or StaffManager"
        preconditions:
          - "status == SCHEDULED"
          - "current_clock < starts_at - PT_CANCEL_CUTOFF_HOURS (24h)  (late cancel inside the cutoff is rejected, ERR_PT_LATE_CANCEL)"
          - "expected_package_version matches PTPackage.version (OCC)"
        side_effects:
          - "Set status = CANCELLED; set deducted = false; reinstate one session to the package (sessions_remaining += 1)"
          - "If package was EXHAUSTED, it returns to ACTIVE"
          - "increments PTSession.version and the package's PTPackage.version by 1"

  # ---- GuestPass lifecycle ----
  - entity: GuestPass
    field: status
    initial_state: ISSUED
    terminal_states: [REDEEMED, EXPIRED, REVOKED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /check-ins  with guest_pass_id (guest enters)"
        actor: StaffManager
        preconditions:
          - "status == ISSUED"
          - "current_clock <= expires_at  (else the sweep has already moved it to EXPIRED, ERR_GUEST_PASS_EXPIRED)"
          - "sponsoring member membership_status == ACTIVE and dues_status != SUSPENDED"
          - "Location.current_occupancy < Location.occupancy_cap"
        side_effects:
          - "Set status = REDEEMED"
          - "Create a CheckIn with actor_kind=GUEST, status=OPEN; Location.current_occupancy += 1"

      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/advance_dues — system (clock passes expires_at)"
        actor: system
        preconditions:
          - "current_clock > expires_at"
        side_effects:
          - "Set status = EXPIRED"

      - from: ISSUED
        to: REVOKED
        trigger: "POST /guest-passes/{id}/revoke"
        actor: StaffManager
        preconditions:
          - "status == ISSUED"
        side_effects:
          - "Set status = REVOKED; restore one guest pass to the sponsoring member (guest_passes_remaining += 1)"

  # ---- DuesInvoice lifecycle ----
  - entity: DuesInvoice
    field: status
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "POST /dues-invoices/{id}/pay"
        actor: "Member or StaffManager"
        preconditions:
          - "status == OPEN"
        side_effects:
          - "Set status = PAID"
          - "Reset member class_credits_remaining = plan.included_class_credits and guest_passes_remaining = plan.guest_passes_per_cycle for the new cycle"
          - "If this clears the oldest overdue invoice, run the dues_status -> CURRENT transition (see Member dues axis)"
          - "increments DuesInvoice.version by 1"

      - from: OPEN
        to: VOID
        trigger: "POST /dues-invoices/{id}/void"
        actor: StaffManager
        preconditions:
          - "status == OPEN"
        side_effects:
          - "Set status = VOID (write-off; does not reset cycle credits)"
          - "increments DuesInvoice.version by 1"

  # ---- CheckIn lifecycle (access control event) ----
  - entity: CheckIn
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /check-ins/{id}/checkout"
        actor: StaffManager
        preconditions:
          - "status == OPEN"
        side_effects:
          - "Set status = CLOSED; Location.current_occupancy -= 1 (never below 0)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC, parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-session
    parent_entity: ClassSession
    write_endpoint: "POST /bookings"
    occ_field: "expected_session_version"
    description: |
      Creating a Booking against a ClassSession whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      last seat was just taken by another booking (which advances the session's
      version) and the current writer's view of the session — including its
      booked_count — is therefore stale, so the writer cannot know whether the
      seat is still free.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

  - rule_id: pt-session-create-stale-package
    parent_entity: PTPackage
    write_endpoint: "POST /pt-sessions"
    occ_field: "expected_package_version"
    description: |
      Scheduling a PTSession against a PTPackage whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      last remaining session was just consumed by another scheduling call (which
      advances the package's version and may flip it to EXHAUSTED), so the current
      writer's view of sessions_remaining is stale.
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cancellation_settlement
    trigger: "POST /members/{id}/cancel (Member ACTIVE/FROZEN/PENDING -> CANCELLED)"
    algorithm: dual_variant
    formula: |
      Let now = current clock; the contract-term fields live on the Member.
      VARIANT A (cooling-off): applies when now <= member.cooling_off_ends_at.
        refund_cents = sum(gross_amount_cents of the member's PAID DuesInvoices) -- full refund of dues paid so far
        early_termination_fee_cents = 0
      VARIANT B (mid-term): applies when member.cooling_off_ends_at < now <= member.term_ends_at.
        refund_cents = 0
        early_termination_fee_cents = plan.early_termination_fee_cents
      VARIANT C (post-term, fulfilled): applies when now > member.term_ends_at.
        refund_cents = 0
        early_termination_fee_cents = 0
      net_to_member_cents = refund_cents - early_termination_fee_cents
      If net_to_member_cents > 0: wallet_credit_cents += net_to_member_cents
      If net_to_member_cents < 0: an OPEN DuesInvoice for abs(net_to_member_cents) is created
                                  (the early-termination fee is billed; never reduces wallet below 0)
    input_set: "Member's PAID DuesInvoices (status==PAID) only; OPEN/VOID excluded. Contract-term boundaries (cooling_off_ends_at, term_ends_at) read off the Member."
    constants:
      COOLING_OFF_DAYS: 7
    precision: "integer cents, no rounding (all inputs are integer cents)"
    variants:
      - { name: cooling_off, when: "now <= cooling_off_ends_at", difference: "full dues refund, zero ETF" }
      - { name: mid_term, when: "cooling_off_ends_at < now <= term_ends_at", difference: "zero refund, flat ETF billed" }
      - { name: post_term, when: "now > term_ends_at", difference: "zero refund, zero ETF" }

  - name: dues_proration
    trigger: "POST /dues-invoices (create the joining/first invoice) and recurring monthly posting"
    algorithm: dual_variant
    formula: |
      base = plan.monthly_dues_cents
      FULL period: gross_amount_cents = base
      PROVISIONAL (first/partial period, daily method):
        covered_days   = whole days in [period_start, period_end)
        billing_days   = whole days in the full calendar month containing period_start
        gross_amount_cents = round_half_up( base * covered_days / billing_days )
      FINAL (first/partial period, anniversary method, applied at next full posting reconciliation):
        gross_amount_cents = base * (covered_days_30 / 30) using a fixed 30-day month
        round_half_up to integer cents
      The two variants (daily-calendar vs fixed-30) produce DIFFERENT cents for the same partial span.
      The system pins PROVISIONAL (daily-calendar) at first invoice creation and FINAL (fixed-30)
      only when the cycle reconciles; wallet_applied_cents and amount_due_cents follow gross.
    input_set: "Single MembershipPlan (plan_id). Period boundaries from the invoice."
    constants:
      FIXED_MONTH_DAYS: 30
    precision: "round_half_up to integer cents"
    variants:
      - { name: provisional_daily, when: "first invoice created", difference: "denominator = actual calendar-month day count" }
      - { name: final_fixed30, when: "cycle reconciliation", difference: "denominator = 30 (fixed-month)" }

  - name: pt_package_price
    trigger: "POST /pt-packages (purchase)"
    algorithm: weighted_scoring
    formula: |
      discount_pct = plan.pt_discount_pct           # 0.0 .. 0.5, from the member's plan
      price_paid_cents = round_half_up( list_price_cents * (1 - discount_pct) )
      Evaluation order is pinned: apply the plan discount to the WHOLE list price, then round once
      (NOT per-session-then-sum). per_session = round_half_up(price_paid_cents / sessions_purchased) is
      a display-only derived value and never re-summed back into price_paid_cents.
    input_set: "Member's MembershipPlan (via member_id -> plan_id)."
    constants: {}
    precision: "round_half_up to integer cents; round once on the whole-package price"

  - name: waitlist_position
    trigger: "Booking create (as WAITLISTED), Booking cancel, waitlist promotion, session complete"
    algorithm: aggregation
    formula: |
      For each WAITLISTED Booking on a session:
        position = 1-based index when WAITLISTED bookings are ordered by created_at ASC
                   (tie-break: created_at ASC is total because created_at carries ms precision;
                    id is NEVER used as a tie-break)
      Promotion always selects position 1 among ELIGIBLE waitlisted bookings
      (member membership_status==ACTIVE AND dues_status != SUSPENDED AND class_credits_remaining >= 1);
      ineligible waitlisted bookings are skipped (their position is recomputed but they are not promoted).
    input_set: "WAITLISTED Bookings for one session_id."
    constants: {}
    precision: "integer position, no rounding"

  - name: delinquency_day_count
    trigger: "POST /_clock/advance_dues (delinquency sweep)"
    algorithm: threshold
    formula: |
      For each Member with past_due_since != null:
        elapsed_days = floor( (current_clock - past_due_since) / 1 day )   # whole days, floor
        dues_status :=
          SUSPENDED  if elapsed_days >= SUSPENDED_AFTER_DAYS   (30)
          DELINQUENT if elapsed_days >= DELINQUENT_AFTER_DAYS   (15)  and < 30
          PAST_DUE   otherwise (>= 0)
      Boundary is INCLUSIVE (>=): exactly 15 whole days elapsed -> DELINQUENT;
      exactly 30 whole days elapsed -> SUSPENDED. 14 days -> still PAST_DUE; 29 days -> still DELINQUENT.
    input_set: "Members whose past_due_since is non-null."
    constants:
      DELINQUENT_AFTER_DAYS: 15
      SUSPENDED_AFTER_DAYS: 30
    precision: "floor to whole days"

  - name: location_occupancy
    trigger: "check-in create, checkout, guest-pass redeem"
    algorithm: aggregation
    formula: |
      current_occupancy = count(CheckIns at this location with status == OPEN)
      A new member or guest entry is rejected when current_occupancy >= occupancy_cap
      (boundary: occupancy_cap is the max permitted OPEN count; entry at exactly == cap is rejected,
       entry at cap-1 succeeds and brings it to cap).
    input_set: "OPEN CheckIns for one location_id."
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per §1.7; entity_backed Member acting on a resource must own it (resource.member_id == X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every referenced resource (path id and body FK) exists and is not archived; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body required fields present and well-typed; enum members valid; period_end > period_start; ends_at > starts_at"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"

  - priority: 5
    category: business_constraint
    check: "Member registration email is unique across non-archived members"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /members"

  - priority: 6
    category: business_referential
    check: "Member registration references a non-archived MembershipPlan"
    error_id: ERR_PLAN_ARCHIVED
    http_status: 409
    applies_to: "POST /members"

  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION_GENERIC
    http_status: 412
    applies_to: "POST /bookings, POST /pt-sessions, POST /class-sessions/{id}/cancel, POST /class-sessions/{id}/complete, POST /pt-sessions/{id}/cancel"
    note: "Concrete error_id is the rule-specific one (ERR_STALE_SESSION_VERSION / ERR_STALE_PACKAGE_VERSION); this row anchors the priority slot."

  - priority: 8
    category: state
    check: "Target resource is in a valid state for the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: state
    check: "Member activation requires the joining DuesInvoice to be PAID"
    error_id: ERR_ACTIVATION_NOT_PAID
    http_status: 409
    applies_to: "POST /members/{id}/activate"

  - priority: 10
    category: business_safety
    check: "Access control: a member/guest may not check in while the member is dues SUSPENDED or membership not ACTIVE"
    error_id: ERR_ACCESS_DENIED_SUSPENDED
    http_status: 403
    applies_to: "POST /check-ins"

  - priority: 11
    category: business_constraint
    check: "Check-in / guest redemption rejected when Location.current_occupancy >= occupancy_cap (boundary: == cap rejects)"
    error_id: ERR_OCCUPANCY_FULL
    http_status: 409
    applies_to: "POST /check-ins"

  - priority: 12
    category: business_safety
    check: "A SUSPENDED member cannot be frozen (freeze requires dues_status IN {CURRENT, PAST_DUE})"
    error_id: ERR_FREEZE_BLOCKED_BY_DUES
    http_status: 409
    applies_to: "POST /members/{id}/freeze"

  - priority: 13
    category: business_referential
    check: "A class booking is only permitted while the member is ACTIVE and dues_status != SUSPENDED (cross-entity: Member axes gate Booking create)"
    error_id: ERR_MEMBER_NOT_BOOKABLE
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 14
    category: business_temporal
    check: "Class capacity/waitlist geometry: when booked_count >= capacity AND waitlisted_count >= waitlist_cap, the booking is rejected (both pools full)"
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 15
    category: business_temporal
    check: "A member cannot hold two non-terminal Bookings (BOOKED/WAITLISTED) on ClassSessions whose [starts_at, ends_at) intervals overlap (double-booking the same time window)"
    error_id: ERR_BOOKING_TIME_OVERLAP
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 16
    category: business_temporal
    check: "A PTSession's start may not fall within any existing non-terminal (SCHEDULED) PTSession's [starts_at, starts_at + PT_SESSION_MINUTES (60 min)) half-open busy block for the same member (member PT time clash with a fixed 60-minute block)"
    error_id: ERR_PT_TIME_OVERLAP
    http_status: 409
    applies_to: "POST /pt-sessions"

  - priority: 17
    category: business_fiscal
    check: "Booking requires class_credits_remaining >= 1 to take a BOOKED seat (waitlisting takes no credit)"
    error_id: ERR_NO_CLASS_CREDITS
    http_status: 402
    applies_to: "POST /bookings"

  - priority: 18
    category: business_fiscal
    check: "Scheduling a PTSession requires the package ACTIVE with sessions_remaining >= 1"
    error_id: ERR_NO_PT_SESSIONS
    http_status: 402
    applies_to: "POST /pt-sessions"

  - priority: 19
    category: business_fiscal
    check: "Issuing a guest pass requires guest_passes_remaining >= 1"
    error_id: ERR_NO_GUEST_PASSES
    http_status: 402
    applies_to: "POST /guest-passes"

  - priority: 20
    category: business_constraint
    check: "Freeze span added to cumulative_freeze_days may not exceed plan.max_freeze_days_per_term"
    error_id: ERR_FREEZE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /members/{id}/freeze"

  - priority: 21
    category: business_temporal
    check: "A PTSession may not be cancelled within PT_CANCEL_CUTOFF_HOURS (24h) of its starts_at"
    error_id: ERR_PT_LATE_CANCEL
    http_status: 409
    applies_to: "POST /pt-sessions/{id}/cancel"

  - priority: 22
    category: business_temporal
    check: "A guest pass past its expires_at cannot be redeemed"
    error_id: ERR_GUEST_PASS_EXPIRED
    http_status: 409
    applies_to: "POST /check-ins"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- MembershipPlan (config) ----
  - method: POST
    path: "/membership-plans"
    description: "Create a membership plan"
    roles: [StaffManager]
    code: 201
    input: [tier, monthly_dues_cents, included_class_credits, pt_discount_pct, contract_term_months, early_termination_fee_cents, max_freeze_days_per_term, guest_passes_per_cycle]
    output: MembershipPlan
    side_effects: ["archived=false"]

  - method: GET
    path: "/membership-plans/{id}"
    description: "Get a plan"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: MembershipPlan
    side_effects: []

  # ---- Location (config) ----
  - method: POST
    path: "/locations"
    description: "Create a location"
    roles: [StaffManager]
    code: 201
    input: [name, occupancy_cap]
    output: Location
    side_effects: ["current_occupancy=0"]

  - method: GET
    path: "/locations/{id}"
    description: "Get a location (incl. current_occupancy)"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: Location
    side_effects: []

  # ---- Member ----
  - method: POST
    path: "/members"
    description: "Register a member: creates Member (membership PENDING, dues CURRENT, contract IN_COOLING_OFF) and the first OPEN DuesInvoice (pro-rated)"
    roles: [StaffManager]
    code: 201
    input: [plan_id, home_location_id, full_name, email, period_start, period_end, due_date]
    output: Member
    side_effects:
      - "Snapshot contract fields onto Member: signed_at=now, cooling_off_ends_at=now+7d, term_ends_at=now+contract_term_months, contract_status=IN_COOLING_OFF"
      - "Create first DuesInvoice (OPEN, gross via dues_proration provisional_daily)"
      - "class_credits_remaining=0, guest_passes_remaining=0, wallet_credit_cents=0, cumulative_freeze_days=0 until the joining invoice is paid"

  - method: GET
    path: "/members/{id}"
    description: "Get member (both status axes, credits, wallet)"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List members (filter by plan_id, home_location_id)"
    roles: [StaffManager]
    code: 200
    input: ["plan_id?", "home_location_id?", "membership_status?", "dues_status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/members/{id}/activate"
    description: "Activate a PENDING member once the joining invoice is PAID"
    roles: [StaffManager]
    code: 200
    input: []
    output: Member
    side_effects: ["membership_status PENDING->ACTIVE", "increments Member.version by 1"]

  - method: POST
    path: "/members/{id}/freeze"
    description: "Freeze an ACTIVE membership for a span of days"
    roles: [StaffManager]
    code: 200
    input: [freeze_days]
    output: Member
    side_effects:
      - "membership_status ACTIVE->FROZEN"
      - "cumulative_freeze_days += freeze_days"
      - "future BOOKED bookings -> CANCELLED with waitlist promotion + credit restore"
      - "increments Member.version by 1"

  - method: POST
    path: "/members/{id}/unfreeze"
    description: "Resume a FROZEN membership"
    roles: [StaffManager]
    code: 200
    input: []
    output: Member
    side_effects: ["membership_status FROZEN->ACTIVE", "increments Member.version by 1"]

  - method: POST
    path: "/members/{id}/cancel"
    description: "Cancel membership; computes cooling-off vs mid-term settlement"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: Member
    side_effects:
      - "membership_status -> CANCELLED; contract_status -> TERMINATED"
      - "cancellation_settlement: wallet credit on refund, OPEN ETF invoice on mid-term"
      - "future bookings CANCELLED (waitlist promotion); ACTIVE PTPackages VOID; SCHEDULED PTSessions CANCELLED"
      - "increments Member.version by 1"

  # ---- ClassSession ----
  - method: POST
    path: "/class-sessions"
    description: "Schedule a class session"
    roles: [StaffManager]
    code: 201
    input: [location_id, title, starts_at, ends_at, capacity, waitlist_cap]
    output: ClassSession
    side_effects: ["status=SCHEDULED, booked_count=0, waitlisted_count=0"]

  - method: GET
    path: "/class-sessions/{id}"
    description: "Get a class session (incl. live counts)"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: ClassSession
    side_effects: []

  - method: GET
    path: "/class-sessions"
    description: "List sessions (filter by location_id, status)"
    roles: [StaffManager, Member]
    code: 200
    input: ["location_id?", "status?", "limit?", "offset?"]
    output: ClassSession[]
    side_effects: []

  - method: POST
    path: "/class-sessions/{id}/cancel"
    description: "Cancel a scheduled session (cascades to bookings)"
    roles: [StaffManager]
    code: 200
    input: [expected_session_version]
    output: ClassSession
    side_effects:
      - "status SCHEDULED->CANCELLED"
      - "all BOOKED/WAITLISTED bookings -> CANCELLED; credits restored on credit_charged bookings"
      - "increments ClassSession.version by 1"

  - method: POST
    path: "/class-sessions/{id}/complete"
    description: "Complete a session after it ends; BOOKED->NO_SHOW, WAITLISTED->CANCELLED"
    roles: [StaffManager]
    code: 200
    input: [expected_session_version]
    output: ClassSession
    side_effects:
      - "status SCHEDULED->COMPLETED"
      - "remaining BOOKED bookings -> NO_SHOW (credit forfeited); WAITLISTED -> CANCELLED"
      - "increments ClassSession.version by 1"

  # ---- Booking ----
  - method: POST
    path: "/bookings"
    description: "Book a class: BOOKED if a seat is free (debits a credit), else WAITLISTED"
    roles: [StaffManager, Member]
    code: 201
    input: [session_id, member_id, expected_session_version]
    output: Booking
    side_effects:
      - "OCC against ClassSession.version"
      - "status=BOOKED (debit 1 class credit, credit_charged=true, booked_at=now) when booked_count < capacity; else WAITLISTED (no credit)"
      - "increments ClassSession.version by 1"

  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking (incl. waitlist_position)"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings (filter by session_id, member_id) — FK reverse-reachability"
    roles: [StaffManager, Member]
    code: 200
    input: ["session_id?", "member_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a booking; restores credit and promotes waitlist if it was a BOOKED seat"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status -> CANCELLED; restore credit if credit_charged"
      - "if was BOOKED: promote lowest eligible WAITLISTED booking on session"
      - "increments Booking.version and ClassSession.version by 1"

  - method: POST
    path: "/bookings/{id}/attend"
    description: "Mark a BOOKED booking ATTENDED (requires an OPEN check-in at the session location)"
    roles: [StaffManager]
    code: 200
    input: []
    output: Booking
    side_effects: ["status BOOKED->ATTENDED", "increments Booking.version by 1"]

  # ---- PTPackage / PTSession ----
  - method: POST
    path: "/pt-packages"
    description: "Purchase a PT package; price discounted by member-plan pt_discount_pct"
    roles: [StaffManager, Member]
    code: 201
    input: [member_id, sessions_purchased, list_price_cents]
    output: PTPackage
    side_effects: ["price_paid_cents via pt_package_price", "sessions_remaining=sessions_purchased", "status=ACTIVE"]

  - method: GET
    path: "/pt-packages/{id}"
    description: "Get a PT package"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: PTPackage
    side_effects: []

  - method: GET
    path: "/pt-packages"
    description: "List PT packages (filter by member_id) — FK reverse-reachability"
    roles: [StaffManager, Member]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: PTPackage[]
    side_effects: []

  - method: POST
    path: "/pt-sessions"
    description: "Schedule a PT session; deducts one from the package"
    roles: [StaffManager, Member]
    code: 201
    input: [package_id, trainer_name, starts_at, expected_package_version]
    output: PTSession
    side_effects:
      - "OCC against PTPackage.version"
      - "deduct 1 from package (sessions_remaining-=1, deducted=true); package -> EXHAUSTED at 0"
      - "increments PTPackage.version by 1"

  - method: GET
    path: "/pt-sessions/{id}"
    description: "Get a PT session"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: PTSession
    side_effects: []

  - method: GET
    path: "/pt-sessions"
    description: "List PT sessions (filter by package_id) — FK reverse-reachability"
    roles: [StaffManager, Member]
    code: 200
    input: ["package_id?", "status?", "limit?", "offset?"]
    output: PTSession[]
    side_effects: []

  - method: POST
    path: "/pt-sessions/{id}/complete"
    description: "Complete a PT session (deduction stands)"
    roles: [StaffManager]
    code: 200
    input: []
    output: PTSession
    side_effects: ["status SCHEDULED->COMPLETED", "increments PTSession.version by 1"]

  - method: POST
    path: "/pt-sessions/{id}/no-show"
    description: "Mark a PT session NO_SHOW (deduction stands)"
    roles: [StaffManager]
    code: 200
    input: []
    output: PTSession
    side_effects: ["status SCHEDULED->NO_SHOW", "increments PTSession.version by 1"]

  - method: POST
    path: "/pt-sessions/{id}/cancel"
    description: "Cancel a PT session outside the cutoff; reinstates the deduction"
    roles: [StaffManager, Member]
    code: 200
    input: [expected_package_version]
    output: PTSession
    side_effects:
      - "OCC against PTPackage.version"
      - "status SCHEDULED->CANCELLED; deducted=false; sessions_remaining+=1; package EXHAUSTED->ACTIVE if applicable"
      - "increments PTSession.version and PTPackage.version by 1"

  # ---- DuesInvoice ----
  - method: POST
    path: "/dues-invoices"
    description: "Post a recurring dues invoice for a member (resets cycle credits on pay)"
    roles: [StaffManager]
    code: 201
    input: [member_id, period_start, period_end, due_date]
    output: DuesInvoice
    side_effects: ["gross via dues_proration", "status=OPEN", "amount_due after wallet credit applied"]

  - method: GET
    path: "/dues-invoices/{id}"
    description: "Get a dues invoice"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: DuesInvoice
    side_effects: []

  - method: GET
    path: "/dues-invoices"
    description: "List dues invoices (filter by member_id, status) — FK reverse-reachability"
    roles: [StaffManager, Member]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: DuesInvoice[]
    side_effects: []

  - method: POST
    path: "/dues-invoices/{id}/pay"
    description: "Pay an OPEN invoice; resets cycle credits, may clear delinquency"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: DuesInvoice
    side_effects:
      - "status OPEN->PAID"
      - "reset class_credits_remaining and guest_passes_remaining for the new cycle"
      - "if it clears the oldest overdue invoice: dues_status -> CURRENT, past_due_since=null"
      - "increments DuesInvoice.version by 1"

  - method: POST
    path: "/dues-invoices/{id}/void"
    description: "Void (write off) an OPEN invoice"
    roles: [StaffManager]
    code: 200
    input: []
    output: DuesInvoice
    side_effects: ["status OPEN->VOID", "increments DuesInvoice.version by 1"]

  # ---- GuestPass ----
  - method: POST
    path: "/guest-passes"
    description: "Issue a guest pass (debits a member guest pass)"
    roles: [StaffManager, Member]
    code: 201
    input: [member_id, guest_name, location_id]
    output: GuestPass
    side_effects: ["status=ISSUED, issued_at=now, expires_at=now+GUEST_PASS_VALID_DAYS (14d)", "member guest_passes_remaining-=1"]

  - method: GET
    path: "/guest-passes/{id}"
    description: "Get a guest pass"
    roles: [StaffManager, Member]
    code: 200
    input: []
    output: GuestPass
    side_effects: []

  - method: GET
    path: "/guest-passes"
    description: "List guest passes (filter by member_id, location_id) — FK reverse-reachability"
    roles: [StaffManager, Member]
    code: 200
    input: ["member_id?", "location_id?", "status?", "limit?", "offset?"]
    output: GuestPass[]
    side_effects: []

  - method: POST
    path: "/guest-passes/{id}/revoke"
    description: "Revoke an ISSUED guest pass; restores the member's guest pass"
    roles: [StaffManager]
    code: 200
    input: []
    output: GuestPass
    side_effects: ["status ISSUED->REVOKED", "member guest_passes_remaining+=1"]

  # ---- CheckIn (access control) ----
  - method: POST
    path: "/check-ins"
    description: "Turnstile entry: member entry (member_id) or guest entry (guest_pass_id). Enforces occupancy + suspension."
    roles: [StaffManager]
    code: 201
    input: ["member_id?", "guest_pass_id?", "location_id"]
    output: CheckIn
    side_effects:
      - "Create CheckIn OPEN; Location.current_occupancy += 1"
      - "Guest entry redeems the pass (ISSUED->REDEEMED)"

  - method: GET
    path: "/check-ins/{id}"
    description: "Get a check-in"
    roles: [StaffManager]
    code: 200
    input: []
    output: CheckIn
    side_effects: []

  - method: GET
    path: "/check-ins"
    description: "List check-ins (filter by location_id, member_id, guest_pass_id) — FK reverse-reachability"
    roles: [StaffManager]
    code: 200
    input: ["location_id?", "member_id?", "guest_pass_id?", "status?", "limit?", "offset?"]
    output: CheckIn[]
    side_effects: []

  - method: POST
    path: "/check-ins/{id}/checkout"
    description: "Close an OPEN check-in; decrements occupancy"
    roles: [StaffManager]
    code: 200
    input: []
    output: CheckIn
    side_effects: ["status OPEN->CLOSED; Location.current_occupancy -= 1"]

  # ---- Test-driving clock / delinquency sweep ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC clock to an explicit instant"
    roles: [StaffManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock = to_iso8601 (no entity sweeps run)"]

  - method: POST
    path: "/_clock/advance_dues"
    description: "Test-driving: run the time-driven sweep at the current clock — advances delinquency axis, contract term transitions, and guest-pass expiry"
    roles: [StaffManager]
    code: 200
    input: []
    output: null
    side_effects:
      - "Member dues_status threshold transitions (CURRENT->PAST_DUE->DELINQUENT->SUSPENDED) per delinquency_day_count"
      - "Contract IN_COOLING_OFF->IN_TERM->FULFILLED per clock vs cooling_off_ends_at / term_ends_at"
      - "GuestPass ISSUED->EXPIRED when clock > expires_at"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Member acting on a resource it does not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or body FK) does not exist or is archived" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, invalid enum, ends_at <= starts_at, period_end <= period_start" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_SESSION_VERSION, http: 412, condition: "expected_session_version does not match ClassSession.version on booking create / session cancel / complete" }
  - { id: ERR_STALE_PACKAGE_VERSION, http: 412, condition: "expected_package_version does not match PTPackage.version on PT session create / cancel" }
  - { id: ERR_ACCESS_DENIED_SUSPENDED, http: 403, condition: "Check-in blocked: member dues SUSPENDED or membership not ACTIVE" }
  - { id: ERR_FREEZE_BLOCKED_BY_DUES, http: 409, condition: "Freeze rejected because member dues_status is SUSPENDED (must be CURRENT or PAST_DUE)" }
  - { id: ERR_FREEZE_CAP_EXCEEDED, http: 409, condition: "Requested freeze span would push cumulative_freeze_days over plan.max_freeze_days_per_term" }
  - { id: ERR_MEMBER_NOT_BOOKABLE, http: 409, condition: "Booking blocked because member is not ACTIVE or is dues SUSPENDED" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "Both BOOKED capacity and waitlist_cap are full" }
  - { id: ERR_BOOKING_TIME_OVERLAP, http: 409, condition: "Member already holds a non-terminal booking on a time-overlapping session" }
  - { id: ERR_PT_TIME_OVERLAP, http: 409, condition: "PT session start falls in an existing SCHEDULED PT session's busy block for the member" }
  - { id: ERR_NO_CLASS_CREDITS, http: 402, condition: "Member has zero class_credits_remaining for a BOOKED seat" }
  - { id: ERR_NO_PT_SESSIONS, http: 402, condition: "PT package not ACTIVE or sessions_remaining < 1" }
  - { id: ERR_NO_GUEST_PASSES, http: 402, condition: "Member has zero guest_passes_remaining" }
  - { id: ERR_PT_LATE_CANCEL, http: 409, condition: "PT session cancel attempted within PT_CANCEL_CUTOFF_HOURS of starts_at" }
  - { id: ERR_GUEST_PASS_EXPIRED, http: 409, condition: "Guest pass redemption after expires_at" }
  - { id: ERR_OCCUPANCY_FULL, http: 409, condition: "Location current_occupancy >= occupancy_cap on check-in / guest redemption" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Member email already used by a non-archived member" }
  - { id: ERR_PLAN_ARCHIVED, http: 409, condition: "Registration references an archived membership plan" }
  - { id: ERR_ACTIVATION_NOT_PAID, http: 409, condition: "Activate attempted before the joining DuesInvoice is PAID" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StaffManager
    description: "Front-desk / operations staff: configures plans & locations & sessions, runs billing, freezes, access control, completes/cancels sessions, runs the time sweep."
    identity: opaque
    exclusive_operations:
      - "POST /membership-plans — create plan"
      - "POST /locations — create location"
      - "POST /members — register member"
      - "GET /members — list members"
      - "POST /members/{id}/activate — activate member"
      - "POST /members/{id}/freeze — freeze member"
      - "POST /members/{id}/unfreeze — unfreeze member"
      - "POST /class-sessions — schedule session"
      - "POST /class-sessions/{id}/cancel — cancel session"
      - "POST /class-sessions/{id}/complete — complete session"
      - "POST /bookings/{id}/attend — mark attended"
      - "POST /pt-sessions/{id}/complete — complete PT session"
      - "POST /pt-sessions/{id}/no-show — PT no-show"
      - "POST /dues-invoices — post invoice"
      - "POST /dues-invoices/{id}/void — void invoice"
      - "POST /guest-passes/{id}/revoke — revoke guest pass"
      - "POST /check-ins — turnstile entry"
      - "GET /check-ins, GET /check-ins/{id} — read check-ins"
      - "POST /check-ins/{id}/checkout — checkout"
      - "POST /_clock/set_current_utc — set clock"
      - "POST /_clock/advance_dues — run sweep"
    shared_operations:
      - "GET /membership-plans/{id} — read plan"
      - "GET /locations/{id} — read location"
      - "GET /members/{id} — read member"
      - "GET /class-sessions, GET /class-sessions/{id} — read sessions"
      - "POST /members/{id}/cancel — cancel membership"
      - "POST /bookings — create booking"
      - "GET /bookings, GET /bookings/{id} — read bookings"
      - "POST /bookings/{id}/cancel — cancel booking"
      - "POST /pt-packages — purchase package"
      - "GET /pt-packages, GET /pt-packages/{id} — read packages"
      - "POST /pt-sessions — schedule PT session"
      - "GET /pt-sessions, GET /pt-sessions/{id} — read PT sessions"
      - "POST /pt-sessions/{id}/cancel — cancel PT session"
      - "GET /dues-invoices, GET /dues-invoices/{id} — read invoices"
      - "POST /dues-invoices/{id}/pay — pay invoice"
      - "POST /guest-passes — issue guest pass"
      - "GET /guest-passes, GET /guest-passes/{id} — read guest passes"

  - name: Member
    description: "An enrolled member acting on their own resources: books/cancels classes, buys/schedules/cancels PT, pays own dues, issues guest passes, cancels own membership."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET /membership-plans/{id} — browse plan"
      - "GET /locations/{id} — read location"
      - "GET /members/{id} — read own member record (X-User-ID == member id)"
      - "GET /class-sessions, GET /class-sessions/{id} — browse sessions"
      - "POST /members/{id}/cancel — cancel own membership"
      - "POST /bookings — book a class for self (member_id == X-User-ID)"
      - "GET /bookings, GET /bookings/{id} — read own bookings"
      - "POST /bookings/{id}/cancel — cancel own booking"
      - "POST /pt-packages — buy own package (member_id == X-User-ID)"
      - "GET /pt-packages, GET /pt-packages/{id} — read own packages"
      - "POST /pt-sessions — schedule against own package"
      - "GET /pt-sessions, GET /pt-sessions/{id} — read own PT sessions"
      - "POST /pt-sessions/{id}/cancel — cancel own PT session"
      - "GET /dues-invoices, GET /dues-invoices/{id} — read own invoices"
      - "POST /dues-invoices/{id}/pay — pay own dues"
      - "POST /guest-passes — issue own guest pass (member_id == X-User-ID)"
      - "GET /guest-passes, GET /guest-passes/{id} — read own guest passes"
