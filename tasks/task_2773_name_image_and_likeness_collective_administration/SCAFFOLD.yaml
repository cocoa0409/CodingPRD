# ============================================================================
# PRD-BENCH SCAFFOLD — Task 2773
# Name, Image and Likeness Collective Administration
# ============================================================================

scenario: |
  2773. Name, Image and Likeness Collective Administration (collegiate athletics
  support collective): donor fundraising with membership tiers, recurring
  subscriptions and major gift solicitation, entity structure decisions with tax
  treatment and charitable deductibility limitations, athlete contract offering
  with deliverables such as appearances, social posts and charity work,
  deliverable verification and payment release with documentation of services
  performed, roster-wide versus individual deal allocation with coach and program
  communication boundaries, compliance reporting to the institution and
  disclosure requirements under state law and association rules, transfer and
  eligibility change handling with contract termination and clawback, tax
  reporting to athletes and withholding considerations

domain_name: "nil-collective-administration"
api_prefix: "/nil"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  difficulty_level: expert
  difficulty_notes: |
    Calibrated at the top of the §0.4 Expert band and deliberately past it on
    coupling density (not on volume): 10 entities carry 11 state machines, three
    of which are parallel dimensions on a single row (DealContract), and every
    money-moving endpoint is gated by a derived posture on a different entity.
    The endpoint surface (50) exceeds the Expert ceiling because §1.5's
    testability-completeness and FK reverse-reachability duties require a detail
    GET plus a filtered-list GET for eight of the ten entities; 30 of the 50 are
    mutating and 20 are reads that exist to make state observable.

  entity_topology: graph
  # graph: no strict ownership tree. Collective is a hub, but DealContract sits
  # at the join of two independent aggregates (Collective + Athlete),
  # PaymentRelease joins DealContract + Deliverable, Commitment is
  # self-referential through a supersession chain, and CommunicationLog links
  # Collective to an optional Athlete. Only two URL paths nest
  # (collectives/{id}/membership-tiers, deal-contracts/{id}/deliverables);
  # everything else is peer-addressed with FK bodies.

  state_machine_shape: parallel
  # DealContract carries three independent state dimensions on the same row:
  # lifecycle_status x payment_status x disclosure_status. Layered on top:
  # cyclic machines on Deliverable (SUBMITTED<->REJECTED), Commitment
  # (ACTIVE<->PAST_DUE, ACTIVE<->PAUSED), DonorMember (ACTIVE<->LAPSED) and
  # Athlete (ENROLLED<->PORTAL_ENTERED, ENROLLED<->INELIGIBLE), plus a
  # posture_driven derived field on Collective (funding_posture) that gates all
  # money-moving child operations.

  relationship_patterns:
    - one_to_many
    - self_referential      # Commitment.superseded_by_commitment_id -> Commitment.id
    - cross_aggregate       # DealContract -> Collective + Athlete; PaymentRelease -> DealContract + Deliverable

  role_model: segregation_of_duties
  # The TreasuryOfficer who creates a DELIVERABLE_PAYOUT release may not be the
  # ComplianceOfficer user who verified the deliverable. Layered on peer-role
  # ownership: CollectiveDirector owns fundraising + contracting,
  # ComplianceOfficer owns verification + eligibility, InstitutionReviewer owns
  # disclosure adjudication, Athlete owns submissions.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ----------------------------------------------------------------------------
# Global determinism conventions (referenced by §1.2 / §1.3 / §1.4)
# ----------------------------------------------------------------------------
determinism_conventions:
  logical_clock: |
    The server holds a logical UTC clock. Its startup default is exactly
    2026-08-01T00:00:00Z; before any POST /nil/_clock/set_current_utc call the
    clock reads that default and MUST NOT fall back to real wall-clock time. The
    clock is static between set_current_utc calls (it does not tick on requests)
    and set_current_utc may move it backward as well as forward. Every
    `created_at`, `updated_at`, `received_at`, `released_at`, `verified_at`,
    `executed_at`, `structure_effective_at` and `disclosure_submitted_at` value
    is stamped from this clock.
  ordering_key: |
    Because the logical clock is static between set_current_utc calls, several
    rows can share a `created_at`. Every order-sensitive rule in this scaffold
    therefore orders by the entity's own `sequence_no` (a monotonic per-entity-type
    insertion counter starting at 1, assigned on create, never reused, and
    independent of the logical clock) either as the primary sort key or as the
    final tie-break. `id` is a server-minted UUID used for identity only and is
    strictly forbidden as a selector, ranking, tie-break, allocation-order,
    batch-order, cascade-order or replay-order input anywhere in this scaffold.
  rounding: |
    All money is integer cents. `round_half_up(n, d)` means the exact rational
    n/d rounded to the nearest integer with ties away from zero. `floor(n, d)`
    means the exact rational n/d truncated toward negative infinity. Where a
    calculation applies more than one rounding step the order is pinned
    explicitly in that calculation's `formula:`.
  calendar_year: |
    `calendar_year(t)` is the four-digit UTC year of instant `t`. "Tax year" and
    "year to date" always mean `calendar_year(current logical clock)`.

# ============================================================================
# §1.1 TABLE 1 — ENTITIES
# ============================================================================
entities:

  - name: Collective
    common_fields: true
    description: >
      A collegiate-athletics support collective: the fundraising and contracting
      hub. Holds the entity-structure/tax-treatment decision, the derived funding
      posture that gates every money-moving child operation, and the
      coach/program communication policy.
    fields:
      - { name: name,                     type: string,    source: input,    required: true,  description: "Legal or trade name of the collective." }
      - { name: institution_name,         type: string,    source: input,    required: true,  description: "Name of the supported institution. The institution is modelled as attributes of the Collective, not a separate entity." }
      - { name: institution_ipeds_code,   type: string,    source: input,    required: true,  description: "Six-character institution identifier. Unique across Collective rows." }
      - { name: home_state_code,          type: string,    source: input,    required: true,  description: "Two-letter uppercase US state code governing state-law disclosure. Enum: AL|CA|FL|OH|TX." }
      - { name: association_ruleset,       type: enum,      source: input,    required: true,  values: [NCAA_2024, NCAA_2026, NAIA], description: "Athletics-association rulebook edition in force. Selects the clawback cap percentage in calc_clawback_amount." }
      - { name: entity_structure,          type: enum,      source: input,    required: false, default: FOR_PROFIT_LLC, values: [NONPROFIT_501C3, FOR_PROFIT_LLC, DONOR_ADVISED_CONDUIT], description: "Tax entity structure of the collective." }
      - { name: communication_policy,      type: enum,      source: input,    required: false, default: STRICT_SEPARATION, values: [STRICT_SEPARATION, MONITORED_CONTACT], description: "Coach/program communication boundary policy. Input to calc_communication_boundary_verdict." }
      - { name: charitable_deduction_enabled, type: boolean, source: computed,                 description: "true if and only if entity_structure == NONPROFIT_501C3. Any input value is ignored." }
      - { name: structure_effective_at,    type: timestamp, source: system,                   description: "Logical-clock instant at which the current entity_structure took effect. Set on create and on every accepted entity-structure change." }
      - { name: structure_change_count,    type: integer,   source: system,   default: 0,      description: "Number of accepted entity-structure changes. Capped at 2 by ERR_STRUCTURE_CHANGE_LIMIT." }
      - { name: funding_posture,           type: enum,      source: computed, values: [OPEN, RESTRICTED, FROZEN], description: "Derived spending posture. See calc_collective_funding_posture. Recomputed and persisted after every mutation that changes settled_net_funds_cents or committed_unreleased_cents." }
      - { name: settled_net_funds_cents,   type: integer,   source: computed,                 description: "Sum of net_amount_cents over this collective's Contribution rows with status == SETTLED, minus the net_amount_cents of rows with status == REFUNDED." }
      - { name: committed_unreleased_cents, type: integer,  source: computed,                 description: "Sum of (total_value_cents - released_total_cents) over this collective's DealContract rows whose lifecycle_status is in {DRAFT, ACTIVE}. Never negative." }
      - { name: released_total_cents,      type: integer,   source: computed,                 description: "Sum of requested_amount_cents over this collective's PaymentRelease rows with status == RELEASED." }
      - { name: reversed_total_cents,      type: integer,   source: computed,                 description: "Sum of requested_amount_cents over this collective's PaymentRelease rows with status == REVERSED." }

  - name: MembershipTier
    common_fields: true
    parent: Collective
    description: >
      A donor membership tier offered by one collective. Tiers gate the annual
      dues amount a DonorMember subscribes at and are closed as a cascade of an
      entity-structure restructure.
    fields:
      - { name: collective_id,      type: uuid,    source: input,    required: true,  description: "FK -> Collective.id; immutable after create; supplied as a path segment on POST /nil/collectives/{id}/membership-tiers." }
      - { name: tier_code,          type: string,  source: input,    required: true,  description: "Short tier identifier. Unique within one collective (case-sensitive)." }
      - { name: tier_name,          type: string,  source: input,    required: true,  description: "Human-readable tier label." }
      - { name: annual_dues_cents,  type: integer, source: input,    required: true,  description: "Annual dues for this tier in cents. Must be > 0." }
      - { name: benefit_rank,       type: integer, source: input,    required: true,  description: "Benefit ranking 1..5, where 5 is the richest benefit bundle. Higher rank must carry strictly higher annual_dues_cents than every OPEN tier of lower rank in the same collective." }
      - { name: tier_status,        type: enum,    source: system,   values: [DRAFT, OPEN, CLOSED], description: "Tier lifecycle. See sm_membership_tier_status." }
      - { name: active_commitment_count, type: integer, source: computed,        description: "Number of Commitment rows whose DonorMember.membership_tier_id is this tier and whose status is in {ACTIVE, PAST_DUE}." }
      - { name: sequence_no,        type: integer, source: system,                  description: "Monotonic per-entity-type insertion counter starting at 1. Deterministic ordering key; see determinism_conventions.ordering_key." }

  - name: DonorMember
    common_fields: true
    parent: Collective
    description: >
      A donor enrolled in a membership tier. Carries the AGI figure that caps
      charitable deductibility and the lifetime settled/deductible ledger.
    fields:
      - { name: collective_id,       type: uuid,    source: input,  required: true,  description: "FK -> Collective.id; immutable after create." }
      - { name: membership_tier_id,  type: uuid,    source: input,  required: true,  description: "FK -> MembershipTier.id; must belong to collective_id and be in tier_status == OPEN at create time." }
      - { name: display_name,        type: string,  source: input,  required: true,  description: "Donor display name." }
      - { name: email,               type: string,  source: input,  required: true,  description: "Contact email. Unique within one collective." }
      - { name: donor_kind,          type: enum,    source: input,  required: false, default: INDIVIDUAL, values: [INDIVIDUAL, ENTITY], description: "Individual donor or corporate/entity donor." }
      - { name: annual_agi_cents,    type: integer, source: input,  required: false, default: 0, description: "Donor's stated adjusted gross income for the current tax year in cents. Must be >= 0. Caps charitable deductibility; see calc_contribution_deductible_amount." }
      - { name: status,              type: enum,    source: system, values: [PROSPECT, ACTIVE, LAPSED], description: "Donor lifecycle. See sm_donor_member_status." }
      - { name: lifetime_settled_cents,    type: integer, source: computed,        description: "Sum of net_amount_cents over this donor's Contribution rows with status == SETTLED." }
      - { name: lifetime_deductible_cents, type: integer, source: computed,        description: "Sum of deductible_amount_cents over this donor's Contribution rows with status == SETTLED." }
      - { name: sequence_no,         type: integer, source: system,                 description: "Monotonic per-entity-type insertion counter starting at 1. Deterministic ordering key." }

  - name: Commitment
    common_fields: true
    parent: DonorMember
    description: >
      A recurring dues subscription or a major-gift pledge. Self-referential
      through supersession when a pledge is restructured.
    fields:
      - { name: donor_member_id,     type: uuid,    source: input,  required: true,  description: "FK -> DonorMember.id; immutable after create." }
      - { name: kind,                type: enum,    source: input,  required: true,  values: [RECURRING_SUBSCRIPTION, MAJOR_GIFT_PLEDGE], description: "Commitment kind. RECURRING_SUBSCRIPTION is charged by billing runs; MAJOR_GIFT_PLEDGE is charged by explicit installments." }
      - { name: amount_cents,        type: integer, source: input,  required: true,  description: "Per-installment amount in cents. Must be > 0." }
      - { name: billing_interval,    type: enum,    source: input,  required: true,  values: [MONTHLY, ANNUAL, NONE], description: "Charge cadence. Must be NONE when kind == MAJOR_GIFT_PLEDGE and must not be NONE when kind == RECURRING_SUBSCRIPTION." }
      - { name: installments_total,  type: integer, source: input,  required: false, default: 1, description: "Total installments planned. Must be >= 1. For RECURRING_SUBSCRIPTION this is the number of cycles before FULFILLED." }
      - { name: installments_charged, type: integer, source: system, default: 0,     description: "Count of SETTLED Contribution rows attributed to this commitment." }
      - { name: status,              type: enum,    source: system, values: [ACTIVE, PAST_DUE, PAUSED, FULFILLED, CANCELLED], description: "Commitment lifecycle. See sm_commitment_status." }
      - { name: pause_reason,        type: enum,    source: system, default: NONE, values: [NONE, DONOR_REQUEST, STRUCTURE_RESTRUCTURE], description: "Why the commitment is PAUSED. NONE whenever status != PAUSED." }
      - { name: superseded_by_commitment_id, type: uuid, source: system, required: false, description: "FK -> Commitment.id; nullable self-reference set on the older row when a pledge is restructured into a replacement. A commitment may not supersede itself and the supersession chain may not contain a cycle." }
      - { name: sequence_no,         type: integer, source: system,                 description: "Monotonic per-entity-type insertion counter starting at 1. Deterministic ordering key." }

  - name: Contribution
    common_fields: true
    parent: DonorMember
    description: >
      One money-in event. Carries the processing-fee band, the dual-variant
      charitable-deduction attribution, and the settlement outcome.
    fields:
      - { name: donor_member_id,     type: uuid,    source: input,  required: true,  description: "FK -> DonorMember.id; immutable after create." }
      - { name: commitment_id,       type: uuid,    source: input,  required: false, description: "FK -> Commitment.id; nullable. When present the commitment must belong to donor_member_id and be in status ACTIVE or PAST_DUE." }
      - { name: gross_amount_cents,  type: integer, source: input,  required: true,  description: "Gross amount charged in cents. Must be > 0." }
      - { name: source_kind,         type: enum,    source: input,  required: true,  values: [SUBSCRIPTION_CHARGE, MAJOR_GIFT_INSTALLMENT, ONE_TIME_GIFT], description: "Origin of the money. SUBSCRIPTION_CHARGE and MAJOR_GIFT_INSTALLMENT require commitment_id; ONE_TIME_GIFT requires commitment_id to be absent." }
      - { name: designation,         type: enum,    source: input,  required: false, default: UNRESTRICTED, values: [UNRESTRICTED, ROSTER_POOL, CHARITY_PROGRAM], description: "Donor-restricted use of the funds. Must match a DealContract.funding_designation for that contract to draw on it." }
      - { name: processor_outcome,   type: enum,    source: input,  required: false, default: APPROVE, values: [APPROVE, DECLINE, DEFER], description: "Deterministic stand-in for the payment processor's answer, evaluated inside the create request. APPROVE settles the contribution; DECLINE fails it; DEFER leaves it PENDING to be resolved later by POST /nil/contributions/{id}/settlements." }
      - { name: status,              type: enum,    source: system, values: [PENDING, SETTLED, FAILED, REFUNDED], description: "Contribution lifecycle. See sm_contribution_status." }
      - { name: processing_fee_cents, type: integer, source: computed,               description: "See calc_contribution_processing_fee." }
      - { name: net_amount_cents,    type: integer, source: computed,                description: "gross_amount_cents - processing_fee_cents." }
      - { name: deductible_amount_cents, type: integer, source: computed,            description: "See calc_contribution_deductible_amount." }
      - { name: deduction_variant,   type: enum,    source: system, values: [AT_RECEIPT, YEAR_END_RECOMPUTE], description: "Which variant of calc_contribution_deductible_amount produced the stored deductible_amount_cents." }
      - { name: received_at,         type: timestamp, source: system,                description: "Logical-clock instant at which the contribution was recorded." }
      - { name: sequence_no,         type: integer, source: system,                 description: "Monotonic per-entity-type insertion counter starting at 1. Primary ordering key for AT_RECEIPT deduction attribution." }

  - name: Athlete
    common_fields: true
    parent: Collective
    description: >
      A student-athlete eligible to receive NIL compensation. Carries eligibility
      state, taxpayer documentation, and the tax-year payment ledger driving
      information reporting.
    fields:
      - { name: collective_id,        type: uuid,    source: input,  required: true,  description: "FK -> Collective.id; immutable after create." }
      - { name: full_name,            type: string,  source: input,  required: true,  description: "Athlete full name." }
      - { name: portal_user_id,       type: string,  source: input,  required: true,  description: "Opaque login handle used by the Athlete role. Unique within one collective. A caller presenting X-User-Role: Athlete must present an X-User-ID equal to this value to act on this athlete's deliverables." }
      - { name: sport,                type: enum,    source: input,  required: true,  values: [FOOTBALL, MENS_BASKETBALL, WOMENS_BASKETBALL, BASEBALL, SOFTBALL], description: "Sport programme. Roster allocation batches target one sport." }
      - { name: class_year,           type: integer, source: input,  required: true,  description: "Academic class year, 2026..2031 inclusive." }
      - { name: roster_weight,        type: integer, source: input,  required: false, default: 1, description: "Relative weight used by weighted roster allocation. Must be >= 1 and <= 10." }
      - { name: tax_person_kind,      type: enum,    source: input,  required: false, default: US_PERSON, values: [US_PERSON, NONRESIDENT_ALIEN], description: "Tax residency classification. Selects the withholding regime." }
      - { name: taxpayer_doc_on_file, type: enum,    source: system, default: NONE, values: [NONE, W9, W8BEN], description: "Which taxpayer certification has been recorded. Set by PATCH /nil/athletes/{id}/tax-profile." }
      - { name: treaty_exempt_claimed, type: boolean, source: system, default: false, description: "true when a W8BEN claiming treaty benefits is on file. Only meaningful for NONRESIDENT_ALIEN." }
      - { name: eligibility_status,   type: enum,    source: system, values: [ENROLLED, PORTAL_ENTERED, TRANSFERRED_OUT, INELIGIBLE], description: "Eligibility lifecycle. See sm_athlete_eligibility_status." }
      - { name: annual_committed_value_cents, type: integer, source: computed,        description: "See calc_athlete_annual_committed_value." }
      - { name: tax_year_gross_paid_cents,    type: integer, source: computed,        description: "Sum of requested_amount_cents over this athlete's PaymentRelease rows with status == RELEASED and calendar_year(released_at) == the current tax year." }
      - { name: tax_year_withheld_cents,      type: integer, source: computed,        description: "Sum of withholding_amount_cents over this athlete's PaymentRelease rows with status == RELEASED and calendar_year(released_at) == the current tax year." }
      - { name: tax_form_required,    type: enum,    source: computed, values: [NONE, FORM_1099_NEC, FORM_1042_S], description: "See calc_athlete_tax_reporting." }
      - { name: sequence_no,          type: integer, source: system,                 description: "Monotonic per-entity-type insertion counter starting at 1. Final tie-break for roster allocation ordering." }

  - name: DealContract
    common_fields: true
    parent: Collective
    description: >
      A NIL agreement between the collective and one athlete, either negotiated
      individually or minted as one share of a roster-wide allocation batch.
      Carries THREE independent state dimensions on the same row: lifecycle_status,
      payment_status and disclosure_status.
    fields:
      - { name: collective_id,        type: uuid,    source: input,  required: true,  description: "FK -> Collective.id; immutable after create." }
      - { name: athlete_id,           type: uuid,    source: input,  required: true,  description: "FK -> Athlete.id; must belong to collective_id; immutable after create." }
      - { name: deal_kind,            type: enum,    source: system, values: [INDIVIDUAL, ROSTER_SHARE], description: "INDIVIDUAL for contracts created by POST /nil/deal-contracts; ROSTER_SHARE for contracts minted by POST /nil/deal-contracts/roster-allocations." }
      - { name: allocation_batch_code, type: string, source: system, required: false, description: "Batch identifier shared by every ROSTER_SHARE contract minted in one allocation call. NULL when deal_kind == INDIVIDUAL." }
      - { name: total_value_cents,    type: integer, source: input,  required: true,  description: "Contract face value in cents. Must be > 0. For ROSTER_SHARE rows this field is assigned by calc_roster_share_allocation and any input value is ignored." }
      - { name: funding_designation,  type: enum,    source: input,  required: false, default: UNRESTRICTED, values: [UNRESTRICTED, ROSTER_POOL, CHARITY_PROGRAM], description: "Which designated pool of settled contributions this contract draws on." }
      - { name: exclusivity_category, type: enum,    source: input,  required: false, default: NONE, values: [NONE, APPAREL, BEVERAGE, AUTOMOTIVE], description: "Product exclusivity claimed. Two non-NONE contracts for the same athlete in the same category may not have overlapping effective windows." }
      - { name: effective_start_at,   type: timestamp, source: input, required: true, description: "Inclusive start of the effective window." }
      - { name: effective_end_at,     type: timestamp, source: input, required: true, description: "Exclusive end of the effective window. Must be strictly after effective_start_at." }
      - { name: lifecycle_status,     type: enum,    source: system, values: [DRAFT, ACTIVE, COMPLETED, TERMINATED, VOIDED], description: "Contract lifecycle dimension. See sm_deal_contract_lifecycle." }
      - { name: payment_status,       type: enum,    source: system, values: [UNPAID, PARTIALLY_PAID, FULLY_PAID, CLAWBACK_DUE], description: "Payment dimension, independent of lifecycle_status. See sm_deal_contract_payment." }
      - { name: disclosure_status,    type: enum,    source: system, values: [DISCLOSURE_NOT_REQUIRED, DISCLOSURE_PENDING, DISCLOSURE_ACCEPTED, DISCLOSURE_RETURNED, DISCLOSURE_LATE], description: "Institutional/state-law disclosure dimension, independent of the other two. See sm_deal_contract_disclosure." }
      - { name: disclosure_due_at,    type: timestamp, source: system, required: false, description: "Instant by which the disclosure must be submitted: created_at plus DISCLOSURE_WINDOW_HOURS. NULL when disclosure_status == DISCLOSURE_NOT_REQUIRED." }
      - { name: disclosure_submitted_at, type: timestamp, source: system, required: false, description: "Logical-clock instant of the most recent disclosure submission; NULL until first submission." }
      - { name: disclosure_return_count, type: integer, source: system, default: 0,   description: "Number of RETURN decisions recorded by the institution reviewer. The second RETURN voids the contract." }
      - { name: deliverable_value_total_cents, type: integer, source: computed,       description: "Sum of unit_value_cents over this contract's Deliverable rows whose status is not FORFEITED." }
      - { name: released_total_cents,  type: integer, source: computed,               description: "Sum of requested_amount_cents over this contract's PaymentRelease rows with status == RELEASED." }
      - { name: clawback_amount_cents, type: integer, source: computed,               description: "See calc_clawback_amount. 0 while lifecycle_status != TERMINATED." }
      - { name: termination_reason,    type: enum,    source: system, default: NONE, values: [NONE, TRANSFER_OUT, INELIGIBILITY, BREACH, MUTUAL_RELEASE], description: "Why the contract was terminated. NONE while lifecycle_status != TERMINATED." }
      - { name: sequence_no,           type: integer, source: system,                description: "Monotonic per-entity-type insertion counter starting at 1. Deterministic cascade order for contract-level fan-out." }

  - name: Deliverable
    common_fields: true
    parent: DealContract
    description: >
      One promised service under a contract - an appearance, a social post,
      charity work or an autograph session - together with the documentation of
      services performed that gates payment release.
    fields:
      - { name: deal_contract_id,     type: uuid,    source: input,  required: true,  description: "FK -> DealContract.id; immutable after create; supplied as a path segment on POST /nil/deal-contracts/{id}/deliverables." }
      - { name: deliverable_kind,     type: enum,    source: input,  required: true,  values: [APPEARANCE, SOCIAL_POST, CHARITY_WORK, AUTOGRAPH_SESSION], description: "Kind of service promised. CHARITY_WORK requires required_charity_hours_tenths > 0." }
      - { name: unit_value_cents,     type: integer, source: input,  required: true,  description: "Stated stand-alone value of this deliverable in cents. Must be > 0." }
      - { name: due_at,               type: timestamp, source: input, required: true, description: "Instant by which the service must have been performed. Must fall inside the parent contract's effective window: effective_start_at <= due_at < effective_end_at." }
      - { name: required_charity_hours_tenths, type: integer, source: input, required: false, default: 0, description: "Charity hours required, expressed in integer tenths of an hour (so 25 means 2.5 hours). Must be >= 0. Must be 0 unless deliverable_kind == CHARITY_WORK." }
      - { name: charity_hours_tenths, type: integer, source: system, default: 0,      description: "Charity hours actually documented, in integer tenths of an hour, taken from the most recent submission." }
      - { name: status,               type: enum,    source: system, values: [PENDING, SUBMITTED, REJECTED, VERIFIED, WAIVED, FORFEITED], description: "Deliverable lifecycle. See sm_deliverable_status." }
      - { name: evidence_records,     type: array,   source: system,                  description: "Append-only list of documentation-of-services records. Each element is an object { evidence_kind, reference_label, recorded_at, sequence_no }." }
      - { name: evidence_count,       type: integer, source: computed,                description: "Length of evidence_records." }
      - { name: submission_count,     type: integer, source: system, default: 0,      description: "Number of submissions made. Capped by RESUBMISSION_LIMIT." }
      - { name: performed_at,         type: timestamp, source: system, required: false, description: "Instant the athlete asserts the service was performed, taken from the most recent submission; NULL until first submission." }
      - { name: submitted_at,         type: timestamp, source: system, required: false, description: "Logical-clock instant of the most recent submission; NULL until first submission." }
      - { name: late_flag,            type: boolean, source: system, default: false,   description: "true when the most recent submission had performed_at strictly after due_at. Drives the late-penalty term in calc_deliverable_payout_eligible." }
      - { name: verified_by_user_id,  type: string,  source: system, required: false,  description: "X-User-ID of the compliance officer who recorded the VERIFY or WAIVE decision; NULL until verified. Compared against the release initiator for segregation of duties." }
      - { name: verified_at,          type: timestamp, source: system, required: false, description: "Logical-clock instant of the VERIFY or WAIVE decision." }
      - { name: payout_basis,         type: enum,    source: computed, values: [STRICT_UNIT_BASIS, CONTRACT_SHARE_BASIS], description: "Which variant of calc_deliverable_payout_eligible applies, selected from the parent contract's deal_kind." }
      - { name: payout_eligible_cents, type: integer, source: computed,               description: "See calc_deliverable_payout_eligible. 0 unless status is VERIFIED or WAIVED." }
      - { name: sequence_no,          type: integer, source: system,                  description: "Monotonic per-entity-type insertion counter starting at 1. Deterministic cascade order for deliverable fan-out." }

  - name: PaymentRelease
    common_fields: true
    parent: DealContract
    description: >
      A money-out event against a contract, either a verified-deliverable payout
      or a contract advance, with statutory or backup withholding applied.
    fields:
      - { name: deal_contract_id,     type: uuid,    source: input,  required: true,  description: "FK -> DealContract.id; immutable after create." }
      - { name: deliverable_id,       type: uuid,    source: input,  required: false, description: "FK -> Deliverable.id; nullable. Required when release_kind == DELIVERABLE_PAYOUT and must be absent when release_kind == CONTRACT_ADVANCE. Must belong to deal_contract_id." }
      - { name: release_kind,         type: enum,    source: input,  required: true,  values: [DELIVERABLE_PAYOUT, CONTRACT_ADVANCE], description: "Payout against documented services, or an advance against the contract face value." }
      - { name: requested_amount_cents, type: integer, source: input, required: true, description: "Gross amount to release in cents. Must be > 0." }
      - { name: withholding_basis,    type: enum,    source: computed, values: [NONE, NRA_STATUTORY, BACKUP], description: "Which withholding regime applied. See calc_release_withholding." }
      - { name: withholding_amount_cents, type: integer, source: computed,            description: "See calc_release_withholding." }
      - { name: net_payable_cents,    type: integer, source: computed,                description: "requested_amount_cents - withholding_amount_cents." }
      - { name: status,               type: enum,    source: system, values: [QUEUED, RELEASED, REVERSED, VOIDED], description: "Release lifecycle. See sm_payment_release_status." }
      - { name: initiated_by_user_id, type: string,  source: system,                  description: "X-User-ID of the treasury officer who created the release. Compared against Deliverable.verified_by_user_id for segregation of duties." }
      - { name: released_at,          type: timestamp, source: system, required: false, description: "Logical-clock instant the release moved to RELEASED; NULL while QUEUED, VOIDED or if never released." }
      - { name: reversal_reason,      type: enum,    source: system, default: NONE, values: [NONE, ERRONEOUS_PAYMENT, CLAWBACK], description: "Why the release was reversed. NONE while status != REVERSED." }
      - { name: sequence_no,          type: integer, source: system,                  description: "Monotonic per-entity-type insertion counter starting at 1. Deterministic ordering key." }

  - name: CommunicationLog
    common_fields: false
    parent: Collective
    description: >
      An immutable record of one coach/program communication touchpoint, with the
      boundary verdict computed at write time. Append-only: no update endpoint and
      no version field, so it is never an optimistic-concurrency parent.
    fields:
      - { name: id,                type: uuid,      source: system,                  description: "Server-minted identifier. Identity only; never a selector or ordering input." }
      - { name: collective_id,     type: uuid,      source: input,  required: true,  description: "FK -> Collective.id; immutable." }
      - { name: athlete_id,        type: uuid,      source: input,  required: false, description: "FK -> Athlete.id; nullable. When present the athlete must belong to collective_id." }
      - { name: actor_role,        type: enum,      source: input,  required: true,  values: [HEAD_COACH, PROGRAM_STAFF, COLLECTIVE_DIRECTOR, COMPLIANCE_OFFICER], description: "Who spoke. Independent of the caller's RBAC role: this is the recorded subject of the touchpoint." }
      - { name: channel,           type: enum,      source: input,  required: true,  values: [DIRECT_MESSAGE, TEAM_MEETING, PUBLIC_POST, INSTITUTION_PORTAL], description: "Medium of the touchpoint." }
      - { name: topic,             type: enum,      source: input,  required: true,  values: [DEAL_TERMS, DEAL_SOLICITATION, GENERAL_PROGRAM, COMPLIANCE_NOTICE], description: "Subject matter of the touchpoint." }
      - { name: verdict,           type: enum,      source: computed, values: [PERMITTED, PERMITTED_WITH_DISCLOSURE, PROHIBITED], description: "See calc_communication_boundary_verdict. A PROHIBITED verdict is still recorded with HTTP 201: the log is an audit trail, not a gate." }
      - { name: rationale_code,    type: enum,      source: computed, values: [POLICY_ALLOWS, MONITORED_CHANNEL_REQUIRED, COACH_DEAL_TERMS_BARRED, ATHLETE_NOT_ENROLLED], description: "Which clause of calc_communication_boundary_verdict decided the verdict." }
      - { name: logged_at,         type: timestamp, source: system,                  description: "Logical-clock instant the touchpoint was recorded." }
      - { name: sequence_no,       type: integer,   source: system,                  description: "Monotonic per-entity-type insertion counter starting at 1. Deterministic ordering key for listing." }

# ============================================================================
# §1.2 TABLE 2 — STATE MACHINES
# ============================================================================
state_machines:

  - name: sm_collective_funding_posture
    entity: Collective
    field: funding_posture
    shape: posture_driven
    initial_state: OPEN
    terminal_states: []
    description: >
      Not driven by an explicit trigger endpoint. funding_posture is re-derived by
      calc_collective_funding_posture and persisted at the END of every request
      that changes settled_net_funds_cents or committed_unreleased_cents. Gating
      rules that consult the posture always read the value as it stood BEFORE the
      current request's mutation.
    transitions:
      - from: "*"
        to: OPEN
        trigger: "Any request that changes settled_net_funds_cents or committed_unreleased_cents, when the post-mutation figures satisfy the OPEN branch of calc_collective_funding_posture."
        preconditions: []
        side_effects:
          - "Collective.funding_posture := OPEN"
          - "Collective.updated_at := current logical clock"
      - from: "*"
        to: RESTRICTED
        trigger: "Any request that changes settled_net_funds_cents or committed_unreleased_cents, when the post-mutation figures satisfy the RESTRICTED branch of calc_collective_funding_posture."
        preconditions: []
        side_effects:
          - "Collective.funding_posture := RESTRICTED"
          - "Collective.updated_at := current logical clock"
      - from: "*"
        to: FROZEN
        trigger: "Any request that changes settled_net_funds_cents or committed_unreleased_cents, when the post-mutation figures satisfy the FROZEN branch of calc_collective_funding_posture."
        preconditions: []
        side_effects:
          - "Collective.funding_posture := FROZEN"
          - "Collective.updated_at := current logical clock"

  - name: sm_membership_tier_status
    entity: MembershipTier
    field: tier_status
    shape: branching
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /nil/membership-tiers/{id}/transitions with action == OPEN"
        preconditions:
          - "MembershipTier.tier_status == DRAFT, else ERR_TIER_NOT_DRAFT"
          - "annual_dues_cents is strictly greater than the annual_dues_cents of every OPEN tier in the same collective whose benefit_rank is lower, and strictly less than that of every OPEN tier whose benefit_rank is higher, else ERR_TIER_RANK_DUES_INVERSION"
        side_effects:
          - "MembershipTier.tier_status := OPEN"
      - from: OPEN
        to: CLOSED
        trigger: "POST /nil/membership-tiers/{id}/transitions with action == CLOSE"
        preconditions:
          - "MembershipTier.tier_status == OPEN, else ERR_TIER_NOT_OPEN"
        side_effects:
          - "MembershipTier.tier_status := CLOSED"
      - from: DRAFT
        to: CLOSED
        trigger: "PATCH /nil/collectives/{id}/entity-structure (restructure cascade), applied to every DRAFT or OPEN tier of the collective in sequence_no ASC order"
        preconditions: []
        side_effects:
          - "MembershipTier.tier_status := CLOSED"
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /nil/collectives/{id}/entity-structure (restructure cascade), applied to every DRAFT or OPEN tier of the collective in sequence_no ASC order"
        preconditions: []
        side_effects:
          - "MembershipTier.tier_status := CLOSED"
          - "Every Commitment of every DonorMember whose membership_tier_id is this tier and whose status is in {ACTIVE, PAST_DUE} transitions to PAUSED with pause_reason := STRUCTURE_RESTRUCTURE (cascade level 2)"

  - name: sm_donor_member_status
    entity: DonorMember
    field: status
    shape: cyclic
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "A Contribution for this donor reaches status SETTLED (bubble up)"
        preconditions: []
        side_effects:
          - "DonorMember.status := ACTIVE"
          - "DonorMember.lifetime_settled_cents and lifetime_deductible_cents are re-derived"
      - from: LAPSED
        to: ACTIVE
        trigger: "A Contribution for this donor reaches status SETTLED (bubble up)"
        preconditions: []
        side_effects:
          - "DonorMember.status := ACTIVE"
          - "DonorMember.lifetime_settled_cents and lifetime_deductible_cents are re-derived"
      - from: ACTIVE
        to: LAPSED
        trigger: "Any request that leaves the donor with at least one Commitment and with every Commitment of that donor in status PAUSED, CANCELLED or FULFILLED (bubble up)"
        preconditions: []
        side_effects:
          - "DonorMember.status := LAPSED"

  - name: sm_commitment_status
    entity: Commitment
    field: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "A Contribution with source_kind SUBSCRIPTION_CHARGE or MAJOR_GIFT_INSTALLMENT attributed to this commitment reaches status FAILED"
        preconditions: []
        side_effects:
          - "Commitment.status := PAST_DUE"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "A Contribution attributed to this commitment reaches status SETTLED"
        preconditions: []
        side_effects:
          - "Commitment.status := ACTIVE"
          - "Commitment.installments_charged := installments_charged + 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /nil/commitments/{id}/transitions with action == PAUSE, or the entity-structure restructure cascade"
        preconditions:
          - "Commitment.status is in {ACTIVE, PAST_DUE}, else ERR_COMMITMENT_STATE_INVALID"
        side_effects:
          - "Commitment.status := PAUSED"
          - "Commitment.pause_reason := DONOR_REQUEST for the explicit action, or STRUCTURE_RESTRUCTURE for the cascade"
          - "The owning DonorMember is re-evaluated for the ACTIVE -> LAPSED bubble-up (cascade level 3)"
      - from: PAST_DUE
        to: PAUSED
        trigger: "POST /nil/commitments/{id}/transitions with action == PAUSE, or the entity-structure restructure cascade"
        preconditions:
          - "Commitment.status is in {ACTIVE, PAST_DUE}, else ERR_COMMITMENT_STATE_INVALID"
        side_effects:
          - "Commitment.status := PAUSED"
          - "Commitment.pause_reason := DONOR_REQUEST for the explicit action, or STRUCTURE_RESTRUCTURE for the cascade"
          - "The owning DonorMember is re-evaluated for the ACTIVE -> LAPSED bubble-up (cascade level 3)"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /nil/commitments/{id}/transitions with action == RESUME"
        preconditions:
          - "Commitment.status == PAUSED, else ERR_COMMITMENT_STATE_INVALID"
          - "The DonorMember's membership_tier_id references a tier whose tier_status == OPEN, else ERR_TIER_NOT_OPEN"
        side_effects:
          - "Commitment.status := ACTIVE"
          - "Commitment.pause_reason := NONE"
      - from: ACTIVE
        to: FULFILLED
        trigger: "installments_charged reaches installments_total after a Contribution attributed to this commitment settles"
        preconditions: []
        side_effects:
          - "Commitment.status := FULFILLED"
          - "The owning DonorMember is re-evaluated for the ACTIVE -> LAPSED bubble-up"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /nil/commitments/{id}/transitions with action == CANCEL"
        preconditions:
          - "Commitment.status is in {ACTIVE, PAST_DUE, PAUSED}, else ERR_COMMITMENT_STATE_INVALID"
        side_effects:
          - "Commitment.status := CANCELLED"
          - "The owning DonorMember is re-evaluated for the ACTIVE -> LAPSED bubble-up"
      - from: PAST_DUE
        to: CANCELLED
        trigger: "POST /nil/commitments/{id}/transitions with action == CANCEL"
        preconditions:
          - "Commitment.status is in {ACTIVE, PAST_DUE, PAUSED}, else ERR_COMMITMENT_STATE_INVALID"
        side_effects:
          - "Commitment.status := CANCELLED"
          - "The owning DonorMember is re-evaluated for the ACTIVE -> LAPSED bubble-up"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /nil/commitments/{id}/transitions with action == CANCEL"
        preconditions:
          - "Commitment.status is in {ACTIVE, PAST_DUE, PAUSED}, else ERR_COMMITMENT_STATE_INVALID"
        side_effects:
          - "Commitment.status := CANCELLED"
          - "The owning DonorMember is re-evaluated for the ACTIVE -> LAPSED bubble-up"

  - name: sm_contribution_status
    entity: Contribution
    field: status
    shape: branching
    initial_state: PENDING
    terminal_states: [FAILED, REFUNDED]
    transitions:
      - from: PENDING
        to: SETTLED
        trigger: "POST /nil/contributions with processor_outcome == APPROVE (resolved inside the create request), or POST /nil/contributions/{id}/settlements with outcome == APPROVE"
        preconditions:
          - "Contribution.status == PENDING, else ERR_CONTRIBUTION_STATE_INVALID"
        side_effects:
          - "Contribution.status := SETTLED"
          - "processing_fee_cents, net_amount_cents and deductible_amount_cents are computed; deduction_variant := AT_RECEIPT"
          - "Collective.settled_net_funds_cents is re-derived and funding_posture is re-derived (ledger sync)"
          - "DonorMember bubble-up to ACTIVE"
          - "When commitment_id is present, the Commitment advances per sm_commitment_status"
      - from: PENDING
        to: FAILED
        trigger: "POST /nil/contributions with processor_outcome == DECLINE, or POST /nil/contributions/{id}/settlements with outcome == DECLINE"
        preconditions:
          - "Contribution.status == PENDING, else ERR_CONTRIBUTION_STATE_INVALID"
        side_effects:
          - "Contribution.status := FAILED"
          - "processing_fee_cents := 0, net_amount_cents := 0, deductible_amount_cents := 0"
          - "When commitment_id is present, the Commitment transitions ACTIVE -> PAST_DUE"
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /nil/contributions/{id}/refund"
        preconditions:
          - "Contribution.status == SETTLED, else ERR_CONTRIBUTION_STATE_INVALID"
        side_effects:
          - "Contribution.status := REFUNDED"
          - "Collective.settled_net_funds_cents is reduced by net_amount_cents and funding_posture is re-derived (compensation)"
          - "DonorMember.lifetime_settled_cents and lifetime_deductible_cents are re-derived"

  - name: sm_athlete_eligibility_status
    entity: Athlete
    field: eligibility_status
    shape: cyclic
    initial_state: ENROLLED
    terminal_states: [TRANSFERRED_OUT]
    transitions:
      - from: ENROLLED
        to: PORTAL_ENTERED
        trigger: "POST /nil/athletes/{id}/eligibility-changes with change == ENTER_PORTAL"
        preconditions:
          - "Athlete.eligibility_status == ENROLLED, else ERR_ATHLETE_STATE_INVALID"
        side_effects:
          - "Athlete.eligibility_status := PORTAL_ENTERED"
          - "Existing DealContract rows are NOT terminated: entering the portal only holds money. Any PaymentRelease created while the athlete is PORTAL_ENTERED stays QUEUED instead of releasing."
      - from: PORTAL_ENTERED
        to: ENROLLED
        trigger: "POST /nil/athletes/{id}/eligibility-changes with change == WITHDRAW_FROM_PORTAL"
        preconditions:
          - "Athlete.eligibility_status == PORTAL_ENTERED, else ERR_ATHLETE_STATE_INVALID"
        side_effects:
          - "Athlete.eligibility_status := ENROLLED"
          - "Every PaymentRelease with status QUEUED on an ACTIVE DealContract of this athlete advances to RELEASED, processed in PaymentRelease.sequence_no ASC order (conditional cascade)"
      - from: PORTAL_ENTERED
        to: TRANSFERRED_OUT
        trigger: "POST /nil/athletes/{id}/eligibility-changes with change == COMPLETE_TRANSFER"
        preconditions:
          - "Athlete.eligibility_status == PORTAL_ENTERED, else ERR_ATHLETE_STATE_INVALID"
        side_effects:
          - "Athlete.eligibility_status := TRANSFERRED_OUT"
          - "Every DealContract of this athlete whose lifecycle_status is in {DRAFT, ACTIVE} transitions to TERMINATED with termination_reason := TRANSFER_OUT, processed in DealContract.sequence_no ASC order (cascade level 1)"
      - from: ENROLLED
        to: INELIGIBLE
        trigger: "POST /nil/athletes/{id}/eligibility-changes with change == DECLARE_INELIGIBLE"
        preconditions:
          - "Athlete.eligibility_status == ENROLLED, else ERR_ATHLETE_STATE_INVALID"
        side_effects:
          - "Athlete.eligibility_status := INELIGIBLE"
          - "Every DealContract of this athlete whose lifecycle_status is in {DRAFT, ACTIVE} transitions to TERMINATED with termination_reason := INELIGIBILITY, processed in DealContract.sequence_no ASC order"
      - from: INELIGIBLE
        to: ENROLLED
        trigger: "POST /nil/athletes/{id}/eligibility-changes with change == REINSTATE"
        preconditions:
          - "Athlete.eligibility_status == INELIGIBLE, else ERR_ATHLETE_STATE_INVALID"
        side_effects:
          - "Athlete.eligibility_status := ENROLLED"
          - "Already TERMINATED contracts are NOT revived (termination is terminal)"

  - name: sm_deal_contract_lifecycle
    entity: DealContract
    field: lifecycle_status
    shape: branching
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED, VOIDED]
    description: >
      Dimension 1 of 3 on DealContract. Advances independently of payment_status
      and disclosure_status except where a precondition explicitly reads another
      dimension.
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /nil/deal-contracts/{id}/activation"
        preconditions:
          - "DealContract.lifecycle_status == DRAFT, else ERR_CONTRACT_NOT_DRAFT"
          - "DealContract.disclosure_status is in {DISCLOSURE_NOT_REQUIRED, DISCLOSURE_ACCEPTED}, else ERR_DISCLOSURE_NOT_CLEARED"
          - "Athlete.eligibility_status == ENROLLED, else ERR_ATHLETE_NOT_ENROLLED"
        side_effects:
          - "DealContract.lifecycle_status := ACTIVE"
          - "DealContract.version := version + 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "Any request that leaves the contract with at least one Deliverable, every Deliverable in a terminal status {VERIFIED, WAIVED, FORFEITED}, and payment_status == FULLY_PAID (bubble up)"
        preconditions: []
        side_effects:
          - "DealContract.lifecycle_status := COMPLETED"
          - "Collective.committed_unreleased_cents is re-derived and funding_posture is re-derived (ledger sync: a COMPLETED contract no longer counts as committed)"
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /nil/deal-contracts/{id}/termination, or the athlete eligibility cascade (COMPLETE_TRANSFER / DECLARE_INELIGIBLE)"
        preconditions:
          - "DealContract.lifecycle_status is in {DRAFT, ACTIVE}, else ERR_CONTRACT_TERMINAL"
        side_effects:
          - "DealContract.lifecycle_status := TERMINATED"
          - "DealContract.termination_reason := the supplied or cascade-derived reason"
          - "clawback_amount_cents is computed per calc_clawback_amount; when it is > 0 the payment dimension moves to CLAWBACK_DUE"
          - "Every Deliverable of this contract whose status is in {PENDING, SUBMITTED, REJECTED} transitions to FORFEITED in Deliverable.sequence_no ASC order (cascade level 2)"
          - "Every PaymentRelease of this contract with status QUEUED transitions to VOIDED in PaymentRelease.sequence_no ASC order (cascade level 3)"
          - "Collective.committed_unreleased_cents is re-derived and funding_posture is re-derived"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /nil/deal-contracts/{id}/termination, or the athlete eligibility cascade (COMPLETE_TRANSFER / DECLARE_INELIGIBLE)"
        preconditions:
          - "DealContract.lifecycle_status is in {DRAFT, ACTIVE}, else ERR_CONTRACT_TERMINAL"
        side_effects:
          - "DealContract.lifecycle_status := TERMINATED"
          - "DealContract.termination_reason := the supplied or cascade-derived reason"
          - "clawback_amount_cents is computed per calc_clawback_amount; when it is > 0 the payment dimension moves to CLAWBACK_DUE"
          - "Every Deliverable of this contract whose status is in {PENDING, SUBMITTED, REJECTED} transitions to FORFEITED in Deliverable.sequence_no ASC order (cascade level 2)"
          - "Every PaymentRelease of this contract with status QUEUED transitions to VOIDED in PaymentRelease.sequence_no ASC order (cascade level 3)"
          - "Collective.committed_unreleased_cents is re-derived and funding_posture is re-derived"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /nil/deal-contracts/{id}/compliance-decisions with decision == RETURN when disclosure_return_count is already 1 (so this is the second return)"
        preconditions:
          - "DealContract.lifecycle_status == DRAFT, else ERR_CONTRACT_NOT_DRAFT"
        side_effects:
          - "DealContract.lifecycle_status := VOIDED"
          - "DealContract.disclosure_return_count := 2 and disclosure_status := DISCLOSURE_RETURNED"
          - "Every Deliverable of this contract whose status is in {PENDING, SUBMITTED, REJECTED} transitions to FORFEITED in Deliverable.sequence_no ASC order"
          - "Collective.committed_unreleased_cents is re-derived and funding_posture is re-derived"

  - name: sm_deal_contract_payment
    entity: DealContract
    field: payment_status
    shape: cyclic
    initial_state: UNPAID
    terminal_states: [CLAWBACK_DUE]
    description: >
      Dimension 2 of 3 on DealContract. Driven purely by the RELEASED/REVERSED
      totals of the contract's PaymentRelease rows, plus termination clawback.
    transitions:
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "A PaymentRelease on this contract reaches status RELEASED and released_total_cents is now strictly between 0 and total_value_cents"
        preconditions: []
        side_effects:
          - "DealContract.payment_status := PARTIALLY_PAID"
          - "Collective.released_total_cents and committed_unreleased_cents are re-derived (ledger sync)"
      - from: UNPAID
        to: FULLY_PAID
        trigger: "A PaymentRelease on this contract reaches status RELEASED and released_total_cents now equals total_value_cents"
        preconditions: []
        side_effects:
          - "DealContract.payment_status := FULLY_PAID"
          - "The lifecycle dimension is re-evaluated for the ACTIVE -> COMPLETED bubble-up"
      - from: PARTIALLY_PAID
        to: FULLY_PAID
        trigger: "A PaymentRelease on this contract reaches status RELEASED and released_total_cents now equals total_value_cents"
        preconditions: []
        side_effects:
          - "DealContract.payment_status := FULLY_PAID"
          - "The lifecycle dimension is re-evaluated for the ACTIVE -> COMPLETED bubble-up"
      - from: FULLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /nil/payment-releases/{id}/reversals leaves released_total_cents strictly between 0 and total_value_cents"
        preconditions: []
        side_effects:
          - "DealContract.payment_status := PARTIALLY_PAID"
          - "Collective.released_total_cents, reversed_total_cents and committed_unreleased_cents are re-derived (compensation)"
      - from: PARTIALLY_PAID
        to: UNPAID
        trigger: "POST /nil/payment-releases/{id}/reversals leaves released_total_cents == 0"
        preconditions: []
        side_effects:
          - "DealContract.payment_status := UNPAID"
          - "Collective.released_total_cents, reversed_total_cents and committed_unreleased_cents are re-derived (compensation)"
      - from: UNPAID
        to: CLAWBACK_DUE
        trigger: "The contract is TERMINATED and calc_clawback_amount yields a value > 0"
        preconditions: []
        side_effects:
          - "DealContract.payment_status := CLAWBACK_DUE"
      - from: PARTIALLY_PAID
        to: CLAWBACK_DUE
        trigger: "The contract is TERMINATED and calc_clawback_amount yields a value > 0"
        preconditions: []
        side_effects:
          - "DealContract.payment_status := CLAWBACK_DUE"
      - from: FULLY_PAID
        to: CLAWBACK_DUE
        trigger: "The contract is TERMINATED and calc_clawback_amount yields a value > 0"
        preconditions: []
        side_effects:
          - "DealContract.payment_status := CLAWBACK_DUE"

  - name: sm_deal_contract_disclosure
    entity: DealContract
    field: disclosure_status
    shape: cyclic
    initial_state: DISCLOSURE_PENDING
    terminal_states: [DISCLOSURE_ACCEPTED, DISCLOSURE_NOT_REQUIRED]
    description: >
      Dimension 3 of 3 on DealContract. On create the initial value is
      DISCLOSURE_NOT_REQUIRED when total_value_cents < DISCLOSURE_THRESHOLD_CENTS,
      otherwise DISCLOSURE_PENDING with disclosure_due_at set to created_at plus
      DISCLOSURE_WINDOW_HOURS.
    transitions:
      - from: DISCLOSURE_PENDING
        to: DISCLOSURE_LATE
        trigger: "POST /nil/deal-contracts/{id}/compliance-submissions when the current logical clock is strictly after disclosure_due_at"
        preconditions:
          - "DealContract.disclosure_status is in {DISCLOSURE_PENDING, DISCLOSURE_RETURNED}, else ERR_DISCLOSURE_STATE_INVALID"
        side_effects:
          - "DealContract.disclosure_status := DISCLOSURE_LATE"
          - "DealContract.disclosure_submitted_at := current logical clock"
      - from: DISCLOSURE_RETURNED
        to: DISCLOSURE_LATE
        trigger: "POST /nil/deal-contracts/{id}/compliance-submissions when the current logical clock is strictly after disclosure_due_at"
        preconditions:
          - "DealContract.disclosure_status is in {DISCLOSURE_PENDING, DISCLOSURE_RETURNED}, else ERR_DISCLOSURE_STATE_INVALID"
        side_effects:
          - "DealContract.disclosure_status := DISCLOSURE_LATE"
          - "DealContract.disclosure_submitted_at := current logical clock"
      - from: DISCLOSURE_RETURNED
        to: DISCLOSURE_PENDING
        trigger: "POST /nil/deal-contracts/{id}/compliance-submissions when the current logical clock is at or before disclosure_due_at"
        preconditions:
          - "DealContract.disclosure_status is in {DISCLOSURE_PENDING, DISCLOSURE_RETURNED}, else ERR_DISCLOSURE_STATE_INVALID"
        side_effects:
          - "DealContract.disclosure_status := DISCLOSURE_PENDING"
          - "DealContract.disclosure_submitted_at := current logical clock"
      - from: DISCLOSURE_PENDING
        to: DISCLOSURE_ACCEPTED
        trigger: "POST /nil/deal-contracts/{id}/compliance-decisions with decision == ACCEPT"
        preconditions:
          - "DealContract.disclosure_submitted_at is not NULL, else ERR_DISCLOSURE_NOT_SUBMITTED"
          - "DealContract.disclosure_status is in {DISCLOSURE_PENDING, DISCLOSURE_LATE}, else ERR_DISCLOSURE_STATE_INVALID"
        side_effects:
          - "DealContract.disclosure_status := DISCLOSURE_ACCEPTED"
      - from: DISCLOSURE_LATE
        to: DISCLOSURE_ACCEPTED
        trigger: "POST /nil/deal-contracts/{id}/compliance-decisions with decision == ACCEPT"
        preconditions:
          - "DealContract.disclosure_submitted_at is not NULL, else ERR_DISCLOSURE_NOT_SUBMITTED"
          - "DealContract.disclosure_status is in {DISCLOSURE_PENDING, DISCLOSURE_LATE}, else ERR_DISCLOSURE_STATE_INVALID"
        side_effects:
          - "DealContract.disclosure_status := DISCLOSURE_ACCEPTED"
          - "A DISCLOSURE_LATE acceptance is still an acceptance: activation is unblocked, but the late fact is preserved in disclosure_submitted_at > disclosure_due_at"
      - from: DISCLOSURE_PENDING
        to: DISCLOSURE_RETURNED
        trigger: "POST /nil/deal-contracts/{id}/compliance-decisions with decision == RETURN"
        preconditions:
          - "DealContract.disclosure_submitted_at is not NULL, else ERR_DISCLOSURE_NOT_SUBMITTED"
          - "DealContract.disclosure_status is in {DISCLOSURE_PENDING, DISCLOSURE_LATE}, else ERR_DISCLOSURE_STATE_INVALID"
        side_effects:
          - "DealContract.disclosure_status := DISCLOSURE_RETURNED"
          - "DealContract.disclosure_return_count := disclosure_return_count + 1"
          - "When disclosure_return_count reaches 2 the lifecycle dimension moves DRAFT -> VOIDED (cross-dimension effect)"
      - from: DISCLOSURE_LATE
        to: DISCLOSURE_RETURNED
        trigger: "POST /nil/deal-contracts/{id}/compliance-decisions with decision == RETURN"
        preconditions:
          - "DealContract.disclosure_submitted_at is not NULL, else ERR_DISCLOSURE_NOT_SUBMITTED"
          - "DealContract.disclosure_status is in {DISCLOSURE_PENDING, DISCLOSURE_LATE}, else ERR_DISCLOSURE_STATE_INVALID"
        side_effects:
          - "DealContract.disclosure_status := DISCLOSURE_RETURNED"
          - "DealContract.disclosure_return_count := disclosure_return_count + 1"
          - "When disclosure_return_count reaches 2 the lifecycle dimension moves DRAFT -> VOIDED (cross-dimension effect)"

  - name: sm_deliverable_status
    entity: Deliverable
    field: status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [VERIFIED, WAIVED, FORFEITED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /nil/deliverables/{id}/submissions"
        preconditions:
          - "Deliverable.status is in {PENDING, REJECTED}, else ERR_DELIVERABLE_STATE_INVALID"
          - "The parent DealContract.lifecycle_status == ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
          - "Deliverable.evidence_count >= MIN_EVIDENCE_RECORDS, else ERR_EVIDENCE_INSUFFICIENT"
          - "When deliverable_kind == CHARITY_WORK, the submitted charity_hours_tenths >= required_charity_hours_tenths, else ERR_CHARITY_HOURS_SHORTFALL"
          - "Deliverable.submission_count < RESUBMISSION_LIMIT, else ERR_RESUBMISSION_LIMIT_REACHED"
        side_effects:
          - "Deliverable.status := SUBMITTED"
          - "Deliverable.submission_count := submission_count + 1"
          - "Deliverable.performed_at := supplied performed_at; submitted_at := current logical clock"
          - "Deliverable.late_flag := (performed_at > due_at)"
          - "Deliverable.charity_hours_tenths := supplied charity_hours_tenths"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /nil/deliverables/{id}/submissions"
        preconditions:
          - "Deliverable.status is in {PENDING, REJECTED}, else ERR_DELIVERABLE_STATE_INVALID"
          - "The parent DealContract.lifecycle_status == ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
          - "Deliverable.evidence_count >= MIN_EVIDENCE_RECORDS, else ERR_EVIDENCE_INSUFFICIENT"
          - "Deliverable.submission_count < RESUBMISSION_LIMIT, else ERR_RESUBMISSION_LIMIT_REACHED"
        side_effects:
          - "Deliverable.status := SUBMITTED"
          - "Deliverable.submission_count := submission_count + 1"
          - "Deliverable.performed_at, submitted_at, late_flag and charity_hours_tenths are overwritten from this submission"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /nil/deliverables/{id}/reviews with decision == VERIFY"
        preconditions:
          - "Deliverable.status == SUBMITTED, else ERR_DELIVERABLE_STATE_INVALID"
        side_effects:
          - "Deliverable.status := VERIFIED"
          - "Deliverable.verified_by_user_id := the X-User-ID of the caller; verified_at := current logical clock"
          - "payout_basis and payout_eligible_cents are computed per calc_deliverable_payout_eligible"
          - "The parent DealContract lifecycle dimension is re-evaluated for the ACTIVE -> COMPLETED bubble-up"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /nil/deliverables/{id}/reviews with decision == REJECT"
        preconditions:
          - "Deliverable.status == SUBMITTED, else ERR_DELIVERABLE_STATE_INVALID"
        side_effects:
          - "Deliverable.status := REJECTED"
          - "payout_eligible_cents := 0"
      - from: PENDING
        to: WAIVED
        trigger: "POST /nil/deliverables/{id}/reviews with decision == WAIVE"
        preconditions:
          - "Deliverable.status is in {PENDING, SUBMITTED, REJECTED}, else ERR_DELIVERABLE_STATE_INVALID"
        side_effects:
          - "Deliverable.status := WAIVED"
          - "Deliverable.verified_by_user_id := the X-User-ID of the caller; verified_at := current logical clock"
          - "payout_basis and payout_eligible_cents are computed per calc_deliverable_payout_eligible"
          - "The parent DealContract lifecycle dimension is re-evaluated for the ACTIVE -> COMPLETED bubble-up"
      - from: SUBMITTED
        to: WAIVED
        trigger: "POST /nil/deliverables/{id}/reviews with decision == WAIVE"
        preconditions:
          - "Deliverable.status is in {PENDING, SUBMITTED, REJECTED}, else ERR_DELIVERABLE_STATE_INVALID"
        side_effects:
          - "Deliverable.status := WAIVED"
          - "Deliverable.verified_by_user_id := the X-User-ID of the caller; verified_at := current logical clock"
          - "payout_basis and payout_eligible_cents are computed per calc_deliverable_payout_eligible"
      - from: REJECTED
        to: WAIVED
        trigger: "POST /nil/deliverables/{id}/reviews with decision == WAIVE"
        preconditions:
          - "Deliverable.status is in {PENDING, SUBMITTED, REJECTED}, else ERR_DELIVERABLE_STATE_INVALID"
        side_effects:
          - "Deliverable.status := WAIVED"
          - "Deliverable.verified_by_user_id := the X-User-ID of the caller; verified_at := current logical clock"
          - "payout_basis and payout_eligible_cents are computed per calc_deliverable_payout_eligible"
      - from: PENDING
        to: FORFEITED
        trigger: "The parent DealContract enters TERMINATED or VOIDED (cascade)"
        preconditions: []
        side_effects:
          - "Deliverable.status := FORFEITED"
          - "payout_eligible_cents := 0"
          - "DealContract.deliverable_value_total_cents is re-derived (FORFEITED rows are excluded)"
      - from: SUBMITTED
        to: FORFEITED
        trigger: "The parent DealContract enters TERMINATED or VOIDED (cascade)"
        preconditions: []
        side_effects:
          - "Deliverable.status := FORFEITED"
          - "payout_eligible_cents := 0"
          - "DealContract.deliverable_value_total_cents is re-derived"
      - from: REJECTED
        to: FORFEITED
        trigger: "The parent DealContract enters TERMINATED or VOIDED (cascade)"
        preconditions: []
        side_effects:
          - "Deliverable.status := FORFEITED"
          - "payout_eligible_cents := 0"
          - "DealContract.deliverable_value_total_cents is re-derived"

  - name: sm_payment_release_status
    entity: PaymentRelease
    field: status
    shape: branching
    initial_state: QUEUED
    terminal_states: [REVERSED, VOIDED]
    transitions:
      - from: QUEUED
        to: RELEASED
        trigger: "POST /nil/payment-releases (same request) when Athlete.eligibility_status == ENROLLED, or the athlete's PORTAL_ENTERED -> ENROLLED withdraw cascade"
        preconditions:
          - "PaymentRelease.status == QUEUED (this transition is only ever reached from a QUEUED row; there is no endpoint that drives it directly, so it has no error of its own)"
          - "The parent DealContract.lifecycle_status == ACTIVE, else ERR_CONTRACT_NOT_ACTIVE"
          - "Athlete.eligibility_status == ENROLLED"
        side_effects:
          - "PaymentRelease.status := RELEASED"
          - "PaymentRelease.released_at := current logical clock"
          - "The parent DealContract payment dimension advances per sm_deal_contract_payment"
          - "Collective.released_total_cents, committed_unreleased_cents and funding_posture are re-derived (ledger sync)"
          - "Athlete.tax_year_gross_paid_cents, tax_year_withheld_cents and tax_form_required are re-derived"
      - from: QUEUED
        to: VOIDED
        trigger: "The parent DealContract enters TERMINATED or VOIDED (cascade)"
        preconditions: []
        side_effects:
          - "PaymentRelease.status := VOIDED"
          - "No money moves: the collective ledger and the athlete tax ledger are unchanged by a VOIDED release"
      - from: RELEASED
        to: REVERSED
        trigger: "POST /nil/payment-releases/{id}/reversals"
        preconditions:
          - "PaymentRelease.status == RELEASED, else ERR_RELEASE_NOT_RELEASED"
          - "calendar_year(PaymentRelease.released_at) == the current tax year, else ERR_REVERSAL_ACROSS_TAX_YEARS"
        side_effects:
          - "PaymentRelease.status := REVERSED"
          - "PaymentRelease.reversal_reason := the supplied reason"
          - "The parent DealContract payment dimension steps back per sm_deal_contract_payment (compensation)"
          - "Collective.released_total_cents, reversed_total_cents, committed_unreleased_cents and funding_posture are re-derived"
          - "Athlete.tax_year_gross_paid_cents, tax_year_withheld_cents and tax_form_required are re-derived: a REVERSED release contributes nothing to either figure"

# ----------------------------------------------------------------------------
# §1.2.1 CONCURRENCY RULES (optimistic concurrency control)
# ----------------------------------------------------------------------------
# Optimistic concurrency control on the parent entity's `version` field is the
# ONLY sanctioned concurrency mechanism in this scaffold. Every rule below is a
# single-request, deterministic staleness check: the caller submits the parent
# version it believes it read, and the server compares that integer with the
# parent's current `version`. There is no notion of overlapping requests, no
# timing, and no ordering between callers anywhere in this specification.
concurrency_rules:

  - name: commitment-create-stale-donor
    parent_entity: DonorMember
    occ_field: version
    write_endpoint: "POST /nil/commitments"
    request_field: expected_donor_member_version
    error_id: ERR_STALE_DONOR_VERSION
    http_status: 412
    description: >
      Creating a Commitment requires the caller to echo the DonorMember version
      it read. If the stored DonorMember.version differs from
      expected_donor_member_version the request is rejected with
      ERR_STALE_DONOR_VERSION and nothing is written. On success
      DonorMember.version is incremented by exactly 1.

  - name: roster-batch-create-stale-collective
    parent_entity: Collective
    occ_field: version
    write_endpoint: "POST /nil/deal-contracts/roster-allocations"
    request_field: expected_collective_version
    error_id: ERR_STALE_COLLECTIVE_VERSION
    http_status: 412
    description: >
      A roster-wide allocation batch mints many contracts against one
      collective's funds, so the caller must echo the Collective version it read.
      A mismatch yields ERR_STALE_COLLECTIVE_VERSION and no contract is minted.
      On success Collective.version is incremented by exactly 1 regardless of how
      many contracts the batch created.

  - name: entity-structure-change-stale-collective
    parent_entity: Collective
    occ_field: version
    write_endpoint: "PATCH /nil/collectives/{id}/entity-structure"
    request_field: expected_collective_version
    error_id: ERR_STALE_COLLECTIVE_VERSION
    http_status: 412
    description: >
      Changing the entity structure rewrites tax treatment and cascades across
      tiers, commitments and donors, so the caller must echo the Collective
      version it read. A mismatch yields ERR_STALE_COLLECTIVE_VERSION and no
      cascade runs. On success Collective.version is incremented by exactly 1.

  - name: payment-release-stale-contract
    parent_entity: DealContract
    occ_field: version
    write_endpoint: "POST /nil/payment-releases"
    request_field: expected_deal_contract_version
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412
    description: >
      Money-out against a contract requires the caller to echo the DealContract
      version it read, so that a release cannot be written against a contract
      whose lifecycle, payment or disclosure dimension has moved since the caller
      read it. A mismatch yields ERR_STALE_CONTRACT_VERSION and no release row is
      created. On success DealContract.version is incremented by exactly 1.

# ============================================================================
# §1.3 TABLE 3 — CALCULATIONS
# ============================================================================
calculations:

  - name: calc_contribution_processing_fee
    output_field: Contribution.processing_fee_cents
    algorithm_type: tiered_pricing
    trigger: "Computed when a Contribution reaches status SETTLED."
    constants:
      FEE_BAND_1_MAX_CENTS: 99999
      FEE_BAND_1_BPS: 290
      FEE_BAND_1_FIXED_CENTS: 30
      FEE_BAND_2_MAX_CENTS: 999999
      FEE_BAND_2_BPS: 250
      FEE_BAND_2_FIXED_CENTS: 30
      FEE_BAND_3_BPS: 210
      FEE_BAND_3_FIXED_CENTS: 0
    input_set: "The single Contribution row being settled. Not an aggregate."
    formula: |
      Band selection is by AVERAGE rate on the whole gross amount, not marginal:
      exactly one band applies to the entire gross_amount_cents.
        if gross_amount_cents <= FEE_BAND_1_MAX_CENTS:
            bps := FEE_BAND_1_BPS ; fixed := FEE_BAND_1_FIXED_CENTS
        elif gross_amount_cents <= FEE_BAND_2_MAX_CENTS:
            bps := FEE_BAND_2_BPS ; fixed := FEE_BAND_2_FIXED_CENTS
        else:
            bps := FEE_BAND_3_BPS ; fixed := FEE_BAND_3_FIXED_CENTS
        processing_fee_cents := round_half_up(gross_amount_cents * bps, 10000) + fixed
        net_amount_cents     := gross_amount_cents - processing_fee_cents
      Both band comparisons are inclusive (<=), so 99999 is band 1 and 100000 is
      band 2; 999999 is band 2 and 1000000 is band 3. A FAILED contribution has
      processing_fee_cents == 0 and net_amount_cents == 0.
    worked_example: |
      gross 99999  -> band 1: round_half_up(99999*290, 10000) = round_half_up(2899.971) = 2900; +30 = 2930; net 97069
      gross 100000 -> band 2: 2500 + 30 = 2530; net 97470
      gross 999999 -> band 2: round_half_up(24999.975) = 25000; +30 = 25030; net 974969
      gross 1000000-> band 3: 21000 + 0 = 21000; net 979000

  - name: calc_contribution_deductible_amount
    output_field: Contribution.deductible_amount_cents
    algorithm_type: chronological
    trigger: >
      The AT_RECEIPT variant runs whenever a Contribution reaches SETTLED. The
      YEAR_END_RECOMPUTE variant runs for every SETTLED contribution of every
      donor of the collective when POST /nil/collectives/{id}/billing-runs is
      called with run_kind == YEAR_END_TAX_RECOMPUTE.
    constants:
      DEDUCTIBLE_AGI_PCT_INDIVIDUAL: 60
      DEDUCTIBLE_AGI_PCT_ENTITY: 100
    input_set: >
      All Contribution rows of one DonorMember with status == SETTLED and
      calendar_year(received_at) == the current tax year. Rows with status
      PENDING, FAILED or REFUNDED are excluded entirely, and excluding a REFUNDED
      row frees its share of the ceiling for the remaining rows.
    variants:
      - name: at_receipt
        applies_when: "A contribution settles (Contribution.deduction_variant := AT_RECEIPT)."
        ordering: "Contribution.sequence_no ASC - i.e. the order the rows were recorded by this server."
      - name: year_end_recompute
        applies_when: "A YEAR_END_TAX_RECOMPUTE billing run executes (Contribution.deduction_variant := YEAR_END_RECOMPUTE)."
        ordering: "Contribution.received_at ASC, then Contribution.sequence_no ASC as the tie-break - i.e. the order the money was actually received according to the logical clock."
    formula: |
      If the owning Collective.charitable_deduction_enabled is false then
      deductible_amount_cents := 0 for every contribution of every donor of that
      collective, and the rest of this rule is skipped.

      Otherwise, per DonorMember:
        pct     := DEDUCTIBLE_AGI_PCT_INDIVIDUAL if donor_kind == INDIVIDUAL
                   else DEDUCTIBLE_AGI_PCT_ENTITY
        ceiling := floor(DonorMember.annual_agi_cents * pct, 100)
        remaining := ceiling
        for each contribution c in the input_set, walked in the ACTIVE VARIANT'S
        ordering:
            c.deductible_amount_cents := min(c.net_amount_cents, remaining)
            remaining := remaining - c.deductible_amount_cents
      The two variants therefore always agree on the SUM of
      deductible_amount_cents across the donor (it is min(ceiling, sum of nets))
      but disagree on the ATTRIBUTION whenever the sequence_no order differs from
      the received_at order and the ceiling binds.
    worked_example: |
      Donor: donor_kind INDIVIDUAL, annual_agi_cents 1000000 -> ceiling 600000.
      Contribution A recorded first (sequence_no lower) with received_at
      2026-08-20T00:00:00Z and net_amount_cents 500000.
      Contribution B recorded second (sequence_no higher) with received_at
      2026-08-10T00:00:00Z and net_amount_cents 400000.
        at_receipt        (A then B): A -> 500000, B -> 100000
        year_end_recompute(B then A): B -> 400000, A -> 200000
      Sum is 600000 under both variants; A's attribution moves by -300000 and
      B's by +300000.

  - name: calc_release_withholding
    output_field: PaymentRelease.withholding_amount_cents
    algorithm_type: threshold
    trigger: "Computed when a PaymentRelease row is created, before it is queued or released."
    constants:
      NRA_STATUTORY_PCT: 30
      BACKUP_WITHHOLDING_PCT: 24
      TREATY_EXEMPT_CEILING_CENTS: 300000
    input_set: "The single PaymentRelease row plus the tax profile of the Athlete on the parent DealContract."
    formula: |
      Let a := the Athlete on the parent DealContract and
          R := PaymentRelease.requested_amount_cents.
        if a.tax_person_kind == NONRESIDENT_ALIEN:
            if a.treaty_exempt_claimed AND R <= TREATY_EXEMPT_CEILING_CENTS:
                withholding_basis := NONE
                withholding_amount_cents := 0
            else:
                withholding_basis := NRA_STATUTORY
                withholding_amount_cents := round_half_up(R * NRA_STATUTORY_PCT, 100)
        else:                                      # US_PERSON
            if a.taxpayer_doc_on_file != W9:
                withholding_basis := BACKUP
                withholding_amount_cents := round_half_up(R * BACKUP_WITHHOLDING_PCT, 100)
            else:
                withholding_basis := NONE
                withholding_amount_cents := 0
      net_payable_cents := R - withholding_amount_cents.
      The treaty ceiling comparison is inclusive (<=): a release of exactly
      TREATY_EXEMPT_CEILING_CENTS is fully exempt, and one cent more is withheld
      on the WHOLE amount, not on the excess.
    worked_example: |
      NRA with treaty, R = 300000 -> basis NONE, withheld 0,     net 300000
      NRA with treaty, R = 300001 -> basis NRA_STATUTORY, withheld round_half_up(90000.3) = 90000, net 210001
      NRA no treaty,   R = 100000 -> basis NRA_STATUTORY, withheld 30000,  net 70000
      US_PERSON, no W9, R = 250000 -> basis BACKUP, withheld 60000, net 190000
      US_PERSON with W9, R = 250000 -> basis NONE, withheld 0, net 250000

  - name: calc_deliverable_payout_eligible
    output_field: Deliverable.payout_eligible_cents
    algorithm_type: weighted_scoring
    trigger: "Computed when a Deliverable enters VERIFIED or WAIVED, and re-derived whenever the parent contract's deliverable_value_total_cents changes."
    constants:
      LATE_PENALTY_PCT: 15
    input_set: >
      The single Deliverable row, plus its parent DealContract's deal_kind,
      total_value_cents and deliverable_value_total_cents. Deliverable rows with
      status FORFEITED are excluded from deliverable_value_total_cents, so
      forfeiting a sibling re-scores every surviving deliverable on a ROSTER_SHARE
      contract.
    variants:
      - name: strict_unit_basis
        applies_when: "The parent DealContract.deal_kind == INDIVIDUAL. Deliverable.payout_basis := STRICT_UNIT_BASIS."
        ordering: "Not order-sensitive: each deliverable is scored from its own unit_value_cents."
      - name: contract_share_basis
        applies_when: "The parent DealContract.deal_kind == ROSTER_SHARE. Deliverable.payout_basis := CONTRACT_SHARE_BASIS."
        ordering: "Not order-sensitive, but every sibling's unit_value_cents participates through deliverable_value_total_cents."
    formula: |
      If Deliverable.status is not in {VERIFIED, WAIVED} then
      payout_eligible_cents := 0 and the rest is skipped.

      Otherwise:
        variant strict_unit_basis:
            base := Deliverable.unit_value_cents
        variant contract_share_basis:
            if DealContract.deliverable_value_total_cents == 0:
                base := 0
            else:
                base := floor(DealContract.total_value_cents * Deliverable.unit_value_cents,
                              DealContract.deliverable_value_total_cents)
        then, in this pinned order:
            if Deliverable.late_flag:
                payout_eligible_cents := base - round_half_up(base * LATE_PENALTY_PCT, 100)
            else:
                payout_eligible_cents := base
      The penalty is applied AFTER the share floor, never before.
    worked_example: |
      ROSTER_SHARE contract, total_value_cents 333333, deliverables
      SOCIAL_POST 200000 and APPEARANCE 100000 (deliverable_value_total_cents 300000):
        SOCIAL_POST -> floor(333333*200000 / 300000) = 222222
        APPEARANCE  -> floor(333333*100000 / 300000) = 111111
      INDIVIDUAL contract, total_value_cents 200000, single SOCIAL_POST 200000:
        SOCIAL_POST -> 200000
      Same 200000-cent social post therefore pays 222222 on the roster contract
      and 200000 on the individual contract.
      Late variant: base 222222 with late_flag true ->
        222222 - round_half_up(222222*15, 100) = 222222 - round_half_up(33333.3) = 222222 - 33333 = 188889

  - name: calc_roster_share_allocation
    output_field: DealContract.total_value_cents (for deal_kind == ROSTER_SHARE)
    algorithm_type: waterfall_allocation
    trigger: "POST /nil/deal-contracts/roster-allocations"
    constants:
      MIN_ROSTER_SHARE_CENTS: 1
    input_set: >
      Every Athlete of the collective whose sport equals the batch's target sport
      and whose eligibility_status == ENROLLED. Athletes in PORTAL_ENTERED,
      TRANSFERRED_OUT or INELIGIBLE are excluded from the batch entirely and get
      no contract.
    formula: |
      Let A := the input_set, and for each athlete i:
        w_i := 1                      if allocation_mode == EQUAL_SHARE
        w_i := Athlete.roster_weight  if allocation_mode == WEIGHTED_BY_ROSTER_WEIGHT
      Let W := sum of w_i over A and P := pool_amount_cents.
      Step 1 (floor pass):     base_i := floor(P * w_i, W)
      Step 2 (remainder):      R := P - sum(base_i)     # 0 <= R < |A|
      Step 3 (distribution):   order A by w_i DESC, then Athlete.sequence_no ASC;
                               add exactly one cent to each of the first R
                               athletes in that order. Athlete.id is never an
                               ordering input.
      Step 4: mint one DealContract per athlete with deal_kind ROSTER_SHARE,
              total_value_cents := the athlete's allocated amount, and the shared
              allocation_batch_code.
      Every allocated amount must be >= MIN_ROSTER_SHARE_CENTS; if any is not the
      whole batch is rejected with ERR_ROSTER_SHARE_BELOW_MINIMUM and no contract
      is minted. The batch is all-or-nothing: there is no partial success.
    worked_example: |
      WEIGHTED_BY_ROSTER_WEIGHT, pool 1000000, three athletes with roster_weight
      3, 3, 1 and sequence_no 1, 2, 3 (W = 7):
        floor pass -> 428571, 428571, 142857  (sum 999999)
        R = 1; order by weight DESC then sequence_no ASC -> athlete 1, athlete 2, athlete 3
        athlete 1 gets the cent -> 428572, 428571, 142857
      EQUAL_SHARE, pool 1000000, three athletes with sequence_no 1, 2, 3 (W = 3):
        floor pass -> 333333, 333333, 333333 (sum 999999); R = 1
        all weights tie at 1, so sequence_no ASC decides -> 333334, 333333, 333333

  - name: calc_collective_funding_posture
    output_field: Collective.funding_posture
    algorithm_type: threshold
    trigger: "Re-derived and persisted at the end of every request that changes settled_net_funds_cents or committed_unreleased_cents."
    constants:
      RESTRICTED_COVERAGE_PCT: 75
    input_set: >
      settled_net_funds_cents (SETTLED contributions net of fees, less REFUNDED
      ones), released_total_cents (RELEASED releases only - REVERSED and VOIDED
      releases contribute nothing), and committed_unreleased_cents (over
      DealContract rows with lifecycle_status in {DRAFT, ACTIVE} only).
    formula: |
      available := settled_net_funds_cents - released_total_cents
      committed := committed_unreleased_cents
        if committed == 0:                                   funding_posture := OPEN
        elif available >= committed:                         funding_posture := OPEN
        elif available * 100 >= committed * RESTRICTED_COVERAGE_PCT:
                                                             funding_posture := RESTRICTED
        else:                                                funding_posture := FROZEN
      The comparison is done in integer cross-multiplied form - never by dividing
      into a percentage - so the RESTRICTED boundary is exact. Gating rules read
      the posture as it stood BEFORE the current request's mutation; the value
      stored on the row is the post-mutation posture.
    worked_example: |
      available 300000, committed 400000 -> 300000*100 = 30000000 and
        400000*75 = 30000000, so available*100 >= committed*75 holds exactly ->
        RESTRICTED (this is the boundary case).
      available 299999, committed 400000 -> 29999900 < 30000000 -> FROZEN.
      available 400000, committed 400000 -> OPEN.
      committed 0 with available 0 -> OPEN.

  - name: calc_clawback_amount
    output_field: DealContract.clawback_amount_cents
    algorithm_type: aggregation
    trigger: "Computed when a DealContract enters TERMINATED."
    constants:
      CLAWBACK_CAP_PCT_NCAA_2024: 100
      CLAWBACK_CAP_PCT_NCAA_2026: 50
      CLAWBACK_CAP_PCT_NAIA: 75
    input_set: >
      released_total_cents of the contract (RELEASED releases only), and
      payout_eligible_cents summed over the contract's Deliverable rows whose
      status is VERIFIED or WAIVED. Because the termination cascade forfeits
      PENDING / SUBMITTED / REJECTED deliverables BEFORE this figure is taken,
      forfeited work never counts as earned.
    formula: |
      if DealContract.termination_reason == MUTUAL_RELEASE:
          clawback_amount_cents := 0
      else:
          earned   := sum of payout_eligible_cents over Deliverable rows of this
                      contract with status in {VERIFIED, WAIVED}
          unearned := released_total_cents - earned
          cap_pct  := CLAWBACK_CAP_PCT_NCAA_2024  if Collective.association_ruleset == NCAA_2024
                      CLAWBACK_CAP_PCT_NCAA_2026  if NCAA_2026
                      CLAWBACK_CAP_PCT_NAIA       if NAIA
          cap      := floor(released_total_cents * cap_pct, 100)
          clawback_amount_cents := max(0, min(unearned, cap))
      When clawback_amount_cents > 0 the contract's payment dimension moves to
      CLAWBACK_DUE.
    worked_example: |
      released_total_cents 200000, earned 0, ruleset NCAA_2026:
        unearned 200000; cap floor(200000*50,100) = 100000; clawback 100000
      Same figures under NCAA_2024: cap 200000; clawback 200000
      Same figures under NAIA:      cap 150000; clawback 150000
      released_total_cents 200000, earned 200000 -> unearned 0 -> clawback 0
      termination_reason MUTUAL_RELEASE -> clawback 0 regardless of the ruleset

  - name: calc_communication_boundary_verdict
    output_field: CommunicationLog.verdict
    algorithm_type: constraint_propagation
    trigger: "POST /nil/communication-logs"
    constants: {}
    input_set: "The submitted actor_role, channel and topic, plus Collective.communication_policy and (when athlete_id is supplied) Athlete.eligibility_status."
    formula: |
      The four clauses are evaluated in this order and the FIRST one that matches
      decides both verdict and rationale_code:
        1. athlete_id is supplied AND Athlete.eligibility_status != ENROLLED
             -> verdict PROHIBITED, rationale_code ATHLETE_NOT_ENROLLED
        2. actor_role in {HEAD_COACH, PROGRAM_STAFF}
           AND topic in {DEAL_TERMS, DEAL_SOLICITATION}
             a. Collective.communication_policy == STRICT_SEPARATION
                  -> verdict PROHIBITED, rationale_code COACH_DEAL_TERMS_BARRED
             b. Collective.communication_policy == MONITORED_CONTACT
                AND channel == INSTITUTION_PORTAL
                  -> verdict PERMITTED_WITH_DISCLOSURE, rationale_code MONITORED_CHANNEL_REQUIRED
             c. Collective.communication_policy == MONITORED_CONTACT
                AND channel != INSTITUTION_PORTAL
                  -> verdict PROHIBITED, rationale_code MONITORED_CHANNEL_REQUIRED
        3. actor_role == COLLECTIVE_DIRECTOR AND topic == DEAL_TERMS
           AND channel == PUBLIC_POST
             -> verdict PERMITTED_WITH_DISCLOSURE, rationale_code MONITORED_CHANNEL_REQUIRED
        4. otherwise
             -> verdict PERMITTED, rationale_code POLICY_ALLOWS
      Clause 1 outranks clause 2, so a head coach discussing deal terms with a
      PORTAL_ENTERED athlete under MONITORED_CONTACT via INSTITUTION_PORTAL is
      PROHIBITED with rationale ATHLETE_NOT_ENROLLED, not
      PERMITTED_WITH_DISCLOSURE. A PROHIBITED verdict is still recorded with HTTP
      201: the log is an audit trail, not an authorization gate.
    worked_example: |
      STRICT_SEPARATION, HEAD_COACH, INSTITUTION_PORTAL, DEAL_TERMS, ENROLLED athlete
        -> PROHIBITED / COACH_DEAL_TERMS_BARRED         (clause 2a)
      MONITORED_CONTACT, HEAD_COACH, INSTITUTION_PORTAL, DEAL_TERMS, ENROLLED
        -> PERMITTED_WITH_DISCLOSURE / MONITORED_CHANNEL_REQUIRED (clause 2b)
      MONITORED_CONTACT, HEAD_COACH, DIRECT_MESSAGE, DEAL_TERMS, ENROLLED
        -> PROHIBITED / MONITORED_CHANNEL_REQUIRED      (clause 2c)
      MONITORED_CONTACT, HEAD_COACH, INSTITUTION_PORTAL, DEAL_TERMS, PORTAL_ENTERED
        -> PROHIBITED / ATHLETE_NOT_ENROLLED            (clause 1 wins)
      STRICT_SEPARATION, COMPLIANCE_OFFICER, INSTITUTION_PORTAL, COMPLIANCE_NOTICE, ENROLLED
        -> PERMITTED / POLICY_ALLOWS                    (clause 4)

  - name: calc_athlete_tax_reporting
    output_field: Athlete.tax_form_required
    algorithm_type: threshold
    trigger: "Re-derived whenever a PaymentRelease for this athlete reaches RELEASED or REVERSED, and whenever the athlete's tax profile changes."
    constants:
      FORM_1099_THRESHOLD_CENTS: 60000
    input_set: >
      PaymentRelease rows on this athlete's contracts with status == RELEASED and
      calendar_year(released_at) == the current tax year. QUEUED, VOIDED and
      REVERSED releases contribute nothing.
    formula: |
      gross := Athlete.tax_year_gross_paid_cents
        if gross == 0:                                   tax_form_required := NONE
        elif tax_person_kind == NONRESIDENT_ALIEN:       tax_form_required := FORM_1042_S
        elif gross >= FORM_1099_THRESHOLD_CENTS:         tax_form_required := FORM_1099_NEC
        else:                                            tax_form_required := NONE
      The 1099 comparison is inclusive (>=): exactly FORM_1099_THRESHOLD_CENTS
      requires the form. A nonresident alien requires FORM_1042_S at any nonzero
      amount, with no threshold.
    worked_example: |
      US_PERSON, gross 59999 -> NONE
      US_PERSON, gross 60000 -> FORM_1099_NEC
      NONRESIDENT_ALIEN, gross 1 -> FORM_1042_S
      US_PERSON, gross 60000 then the release is REVERSED -> gross 0 -> NONE

  - name: calc_athlete_annual_committed_value
    output_field: Athlete.annual_committed_value_cents
    algorithm_type: aggregation
    trigger: "Re-derived whenever a DealContract for this athlete is created or changes lifecycle_status."
    constants:
      ATHLETE_ANNUAL_CAP_CENTS: 5000000
    input_set: "DealContract rows of this athlete whose lifecycle_status is in {DRAFT, ACTIVE}. COMPLETED, TERMINATED and VOIDED contracts are excluded, so terminating a contract frees cap headroom."
    formula: |
      annual_committed_value_cents := sum of total_value_cents over the input_set.
      A contract-creating request (POST /nil/deal-contracts or a roster allocation
      batch) is rejected with ERR_ATHLETE_ANNUAL_CAP_EXCEEDED when the
      post-creation value would be STRICTLY GREATER than
      ATHLETE_ANNUAL_CAP_CENTS. A post-creation value of exactly
      ATHLETE_ANNUAL_CAP_CENTS is allowed.
    worked_example: |
      Existing DRAFT contract 4000000; new contract 1000000 -> 5000000 -> allowed
      Existing DRAFT contract 4000000; new contract 1000001 -> 5000001 -> ERR_ATHLETE_ANNUAL_CAP_EXCEEDED
      Existing contract 4000000 TERMINATED; new contract 5000000 -> 5000000 -> allowed

# ============================================================================
# §1.4 TABLE 4 — VALIDATIONS (evaluated in strict ascending priority order;
# the FIRST violated rule decides the response and nothing is written)
# ============================================================================
validations:

  - priority: 1
    name: auth_headers_present
    category: auth
    rule: "Every request must carry both an X-User-Role header and a non-empty X-User-ID header."
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    name: auth_role_recognised
    category: auth
    rule: "X-User-Role must be one of PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer."
    error_id: ERR_INVALID_ROLE
    http_status: 400
    applies_to: "all endpoints"

  - priority: 3
    name: rbac_endpoint_role_allowed
    category: authorization
    rule: "The presented role must appear in the endpoint's allowed_roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 4
    name: rbac_entity_backed_ownership
    category: authorization
    rule: "A caller with X-User-Role: Athlete may only act on a Deliverable whose parent DealContract belongs to the Athlete row whose portal_user_id equals the caller's X-User-ID."
    error_id: ERR_FORBIDDEN_RESOURCE
    http_status: 403
    applies_to: "POST /nil/deliverables/{id}/evidence, POST /nil/deliverables/{id}/submissions"

  - priority: 5
    name: schema_body_shape
    category: schema
    rule: >
      Every field declared required for the endpoint must be present and of the
      declared type; every enum field must carry a declared value; every integer
      money or count field must satisfy its declared range (annual_dues_cents > 0,
      amount_cents > 0, gross_amount_cents > 0, total_value_cents > 0,
      unit_value_cents > 0, requested_amount_cents > 0, annual_agi_cents >= 0,
      required_charity_hours_tenths >= 0, roster_weight in 1..10, benefit_rank in
      1..5, class_year in 2026..2031, installments_total >= 1, home_state_code in
      {AL, CA, FL, OH, TX}); effective_end_at must be strictly after
      effective_start_at; required_charity_hours_tenths must be > 0 when
      deliverable_kind == CHARITY_WORK and 0 otherwise; pagination limit must be
      in 1..100 and offset >= 0; every timestamp must be an ISO-8601 UTC instant.
      Unknown body fields are ignored.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and all list endpoints"

  - priority: 6
    name: existence_path_entity
    category: existence
    rule: "Every entity addressed by a path placeholder must exist."
    error_id: "ERR_COLLECTIVE_NOT_FOUND | ERR_MEMBERSHIP_TIER_NOT_FOUND | ERR_DONOR_MEMBER_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_CONTRIBUTION_NOT_FOUND | ERR_ATHLETE_NOT_FOUND | ERR_DEAL_CONTRACT_NOT_FOUND | ERR_DELIVERABLE_NOT_FOUND | ERR_PAYMENT_RELEASE_NOT_FOUND | ERR_COMMUNICATION_LOG_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path placeholder"

  - priority: 7
    name: existence_body_foreign_key
    category: existence
    rule: "Every foreign key supplied in the request body must reference an existing row."
    error_id: "ERR_COLLECTIVE_NOT_FOUND | ERR_MEMBERSHIP_TIER_NOT_FOUND | ERR_DONOR_MEMBER_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_ATHLETE_NOT_FOUND | ERR_DEAL_CONTRACT_NOT_FOUND | ERR_DELIVERABLE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /nil/donor-members, POST /nil/commitments, POST /nil/contributions, POST /nil/athletes, POST /nil/deal-contracts, POST /nil/payment-releases, POST /nil/communication-logs"

  - priority: 8
    name: referential_same_collective
    category: referential
    rule: >
      All entities named in one request must belong to the same Collective: a
      DonorMember's membership_tier_id must be a tier of its collective_id, a
      DealContract's athlete_id must be an athlete of its collective_id, and a
      CommunicationLog's athlete_id must be an athlete of its collective_id.
    error_id: ERR_CROSS_COLLECTIVE_REFERENCE
    http_status: 409
    applies_to: "POST /nil/donor-members, POST /nil/deal-contracts, POST /nil/communication-logs"

  - priority: 9
    name: referential_child_belongs_to_named_parent
    category: referential
    rule: >
      A PaymentRelease's deliverable_id must name a Deliverable whose
      deal_contract_id equals the release's deal_contract_id, and a
      Contribution's commitment_id must name a Commitment whose donor_member_id
      equals the contribution's donor_member_id.
    error_id: "ERR_DELIVERABLE_CONTRACT_MISMATCH | ERR_COMMITMENT_DONOR_MISMATCH"
    http_status: 409
    applies_to: "POST /nil/payment-releases, POST /nil/contributions"

  - priority: 10
    name: uniqueness_institution_code
    category: uniqueness
    rule: "institution_ipeds_code must be unique across all Collective rows."
    error_id: ERR_DUPLICATE_IPEDS_CODE
    http_status: 409
    applies_to: "POST /nil/collectives"

  - priority: 11
    name: uniqueness_tier_code
    category: uniqueness
    rule: "tier_code must be unique among the MembershipTier rows of one collective, including CLOSED ones."
    error_id: ERR_DUPLICATE_TIER_CODE
    http_status: 409
    applies_to: "POST /nil/collectives/{id}/membership-tiers"

  - priority: 12
    name: uniqueness_donor_and_athlete_handles
    category: uniqueness
    rule: "DonorMember.email must be unique within one collective and Athlete.portal_user_id must be unique within one collective."
    error_id: "ERR_DUPLICATE_MEMBER_HANDLE"
    http_status: 409
    applies_to: "POST /nil/donor-members, POST /nil/athletes"

  - priority: 13
    name: state_membership_tier
    category: state
    rule: >
      OPEN requires tier_status == DRAFT; CLOSE requires tier_status == OPEN;
      creating a DonorMember and RESUMEing a Commitment both require the
      referenced tier to be OPEN.
    error_id: "ERR_TIER_NOT_DRAFT | ERR_TIER_NOT_OPEN"
    http_status: 409
    applies_to: "POST /nil/membership-tiers/{id}/transitions, POST /nil/donor-members, POST /nil/commitments/{id}/transitions"

  - priority: 14
    name: state_commitment
    category: state
    rule: >
      PAUSE requires status in {ACTIVE, PAST_DUE}; RESUME requires status ==
      PAUSED; CANCEL and restructure require status in {ACTIVE, PAST_DUE,
      PAUSED}; attributing a Contribution to a commitment requires the commitment
      to be in {ACTIVE, PAST_DUE}.
    error_id: "ERR_COMMITMENT_STATE_INVALID | ERR_COMMITMENT_NOT_CHARGEABLE"
    http_status: 409
    applies_to: "POST /nil/commitments/{id}/transitions, POST /nil/commitments/{id}/restructure, POST /nil/contributions"

  - priority: 15
    name: state_contribution
    category: state
    rule: "Settling requires status == PENDING; refunding requires status == SETTLED."
    error_id: ERR_CONTRIBUTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /nil/contributions/{id}/settlements, POST /nil/contributions/{id}/refund"

  - priority: 16
    name: state_athlete_eligibility
    category: state
    rule: "The requested eligibility change must be a declared transition out of the athlete's current eligibility_status per sm_athlete_eligibility_status."
    error_id: ERR_ATHLETE_STATE_INVALID
    http_status: 409
    applies_to: "POST /nil/athletes/{id}/eligibility-changes"

  - priority: 17
    name: state_contract_lifecycle
    category: state
    rule: >
      Activation, compliance submission and compliance decision require
      lifecycle_status == DRAFT; adding deliverables requires DRAFT or ACTIVE;
      deliverable submission and payment release require ACTIVE; termination
      requires DRAFT or ACTIVE. A contract in COMPLETED, TERMINATED or VOIDED
      yields ERR_CONTRACT_TERMINAL.
    error_id: "ERR_CONTRACT_NOT_DRAFT | ERR_CONTRACT_NOT_ACTIVE | ERR_CONTRACT_TERMINAL"
    http_status: 409
    applies_to: "POST /nil/deal-contracts/{id}/activation, POST /nil/deal-contracts/{id}/compliance-submissions, POST /nil/deal-contracts/{id}/compliance-decisions, POST /nil/deal-contracts/{id}/termination, POST /nil/deal-contracts/{id}/deliverables, POST /nil/deliverables/{id}/submissions, POST /nil/payment-releases"

  - priority: 18
    name: state_contract_disclosure
    category: state
    rule: >
      Submission requires disclosure_status in {DISCLOSURE_PENDING,
      DISCLOSURE_RETURNED}; a decision requires disclosure_submitted_at to be set
      and disclosure_status in {DISCLOSURE_PENDING, DISCLOSURE_LATE}; activation
      requires disclosure_status in {DISCLOSURE_NOT_REQUIRED,
      DISCLOSURE_ACCEPTED}.
    error_id: "ERR_DISCLOSURE_STATE_INVALID | ERR_DISCLOSURE_NOT_SUBMITTED | ERR_DISCLOSURE_NOT_CLEARED"
    http_status: 409
    applies_to: "POST /nil/deal-contracts/{id}/compliance-submissions, POST /nil/deal-contracts/{id}/compliance-decisions, POST /nil/deal-contracts/{id}/activation"

  - priority: 19
    name: state_deliverable
    category: state
    rule: >
      Submission requires status in {PENDING, REJECTED}; a VERIFY or REJECT
      review requires status == SUBMITTED; a WAIVE review requires status in
      {PENDING, SUBMITTED, REJECTED}; adding evidence requires a non-terminal
      status.
    error_id: ERR_DELIVERABLE_STATE_INVALID
    http_status: 409
    applies_to: "POST /nil/deliverables/{id}/submissions, POST /nil/deliverables/{id}/reviews, POST /nil/deliverables/{id}/evidence"

  - priority: 20
    name: state_payment_release
    category: state
    rule: "Reversal requires status == RELEASED. A QUEUED, VOIDED or already REVERSED release cannot be reversed."
    error_id: ERR_RELEASE_NOT_RELEASED
    http_status: 409
    applies_to: "POST /nil/payment-releases/{id}/reversals"

  - priority: 21
    name: occ_expected_parent_version
    category: concurrency
    rule: >
      The submitted expected_<parent>_version must equal the parent's stored
      version. See §1.2.1: DonorMember for POST /nil/commitments, Collective for
      POST /nil/deal-contracts/roster-allocations and PATCH
      /nil/collectives/{id}/entity-structure, DealContract for POST
      /nil/payment-releases.
    error_id: "ERR_STALE_DONOR_VERSION | ERR_STALE_COLLECTIVE_VERSION | ERR_STALE_CONTRACT_VERSION"
    http_status: 412
    applies_to: "POST /nil/commitments, POST /nil/deal-contracts/roster-allocations, PATCH /nil/collectives/{id}/entity-structure, POST /nil/payment-releases"

  - priority: 22
    name: sod_release_initiator_is_not_verifier
    category: authorization
    rule: >
      For a DELIVERABLE_PAYOUT release, the caller's X-User-ID must differ from
      the Deliverable's verified_by_user_id. This rule sits after existence,
      referential and state checks because it can only be evaluated once the
      named deliverable has been resolved and confirmed to belong to the contract.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /nil/payment-releases"

  - priority: 23
    name: posture_gate_contract_creation
    category: business_safety
    rule: "An individual DealContract may not be created while the Collective's pre-request funding_posture == FROZEN."
    error_id: ERR_COLLECTIVE_FUNDING_FROZEN
    http_status: 409
    applies_to: "POST /nil/deal-contracts"

  - priority: 24
    name: posture_gate_roster_allocation
    category: business_safety
    rule: "A roster-wide allocation batch requires the Collective's pre-request funding_posture == OPEN; RESTRICTED and FROZEN both block it."
    error_id: "ERR_COLLECTIVE_FUNDING_RESTRICTED | ERR_COLLECTIVE_FUNDING_FROZEN"
    http_status: 409
    applies_to: "POST /nil/deal-contracts/roster-allocations"

  - priority: 25
    name: posture_gate_payment_release
    category: business_safety
    rule: "A PaymentRelease may not be created while the Collective's pre-request funding_posture == FROZEN."
    error_id: ERR_COLLECTIVE_FUNDING_FROZEN
    http_status: 409
    applies_to: "POST /nil/payment-releases"

  - priority: 26
    name: athlete_enrolled_for_contracting
    category: business_safety
    rule: "A DealContract may only be created for, and activated for, an Athlete whose eligibility_status == ENROLLED."
    error_id: ERR_ATHLETE_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /nil/deal-contracts, POST /nil/deal-contracts/{id}/activation"

  - priority: 27
    name: roster_allocation_nonempty_input_set
    category: business_safety
    rule: "A roster allocation batch must resolve to at least one eligible athlete (same collective, matching sport, eligibility_status == ENROLLED)."
    error_id: ERR_NO_ELIGIBLE_ATHLETES
    http_status: 422
    applies_to: "POST /nil/deal-contracts/roster-allocations"

  - priority: 28
    name: exclusivity_window_no_overlap
    category: business_temporal
    rule: >
      Two DealContract rows for the same athlete with the same non-NONE
      exclusivity_category may not have overlapping effective windows, where each
      window is the half-open interval [effective_start_at, effective_end_at).
      Only contracts whose lifecycle_status is in {DRAFT, ACTIVE} are considered.
      Adjacency (one window's effective_end_at exactly equal to the other's
      effective_start_at) is NOT an overlap and is permitted.
    error_id: ERR_EXCLUSIVITY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /nil/deal-contracts, POST /nil/deal-contracts/roster-allocations"

  - priority: 29
    name: deliverable_due_inside_contract_window
    category: business_temporal
    rule: "A Deliverable's due_at must satisfy effective_start_at <= due_at < effective_end_at on the parent contract (inclusive lower bound, exclusive upper bound)."
    error_id: ERR_DUE_OUTSIDE_CONTRACT_WINDOW
    http_status: 422
    applies_to: "POST /nil/deal-contracts/{id}/deliverables"

  - priority: 30
    name: reversal_within_same_tax_year
    category: business_temporal
    rule: "A PaymentRelease may only be reversed while calendar_year(released_at) equals the current tax year, so that the athlete tax ledger for a closed year is never rewritten."
    error_id: ERR_REVERSAL_ACROSS_TAX_YEARS
    http_status: 422
    applies_to: "POST /nil/payment-releases/{id}/reversals"

  - priority: 31
    name: evidence_minimum_documentation
    category: business_constraint
    rule: "A Deliverable must carry at least MIN_EVIDENCE_RECORDS (1) evidence records before it can be submitted."
    error_id: ERR_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /nil/deliverables/{id}/submissions"

  - priority: 32
    name: charity_hours_documented
    category: business_constraint
    rule: "For a CHARITY_WORK deliverable the submitted charity_hours_tenths must be >= required_charity_hours_tenths."
    error_id: ERR_CHARITY_HOURS_SHORTFALL
    http_status: 422
    applies_to: "POST /nil/deliverables/{id}/submissions"

  - priority: 33
    name: resubmission_limit
    category: business_constraint
    rule: "A Deliverable may be submitted at most RESUBMISSION_LIMIT (3) times; the fourth attempt is rejected and the deliverable stays REJECTED."
    error_id: ERR_RESUBMISSION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /nil/deliverables/{id}/submissions"

  - priority: 34
    name: tier_rank_dues_monotonic
    category: business_constraint
    rule: >
      Opening a MembershipTier requires its annual_dues_cents to be strictly
      greater than that of every OPEN tier in the same collective with a lower
      benefit_rank, and strictly less than that of every OPEN tier with a higher
      benefit_rank.
    error_id: ERR_TIER_RANK_DUES_INVERSION
    http_status: 422
    applies_to: "POST /nil/membership-tiers/{id}/transitions"

  - priority: 35
    name: structure_change_limit
    category: business_constraint
    rule: "A Collective's entity_structure may be changed at most STRUCTURE_CHANGE_LIMIT (2) times, and the submitted entity_structure must differ from the stored one."
    error_id: "ERR_STRUCTURE_CHANGE_LIMIT | ERR_STRUCTURE_UNCHANGED"
    http_status: 422
    applies_to: "PATCH /nil/collectives/{id}/entity-structure"

  - priority: 36
    name: payout_requires_verified_deliverable
    category: business_constraint
    rule: "A DELIVERABLE_PAYOUT release requires the named Deliverable's status to be VERIFIED or WAIVED."
    error_id: ERR_DELIVERABLE_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /nil/payment-releases"

  - priority: 37
    name: release_within_contract_value
    category: business_constraint
    rule: "requested_amount_cents plus the contract's released_total_cents must not exceed DealContract.total_value_cents."
    error_id: ERR_RELEASE_EXCEEDS_CONTRACT_VALUE
    http_status: 422
    applies_to: "POST /nil/payment-releases"

  - priority: 38
    name: roster_share_minimum
    category: business_constraint
    rule: "Every share produced by calc_roster_share_allocation must be >= MIN_ROSTER_SHARE_CENTS (1); otherwise the whole batch is rejected and no contract is minted."
    error_id: ERR_ROSTER_SHARE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /nil/deal-contracts/roster-allocations"

  - priority: 39
    name: athlete_annual_cap
    category: business_constraint
    rule: "After the request, an Athlete's annual_committed_value_cents must not be strictly greater than ATHLETE_ANNUAL_CAP_CENTS (5000000). For a roster batch the check is applied to every athlete in the batch and a single failure rejects the whole batch."
    error_id: ERR_ATHLETE_ANNUAL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /nil/deal-contracts, POST /nil/deal-contracts/roster-allocations"

  - priority: 40
    name: commitment_interval_consistency
    category: business_constraint
    rule: "billing_interval must be NONE when kind == MAJOR_GIFT_PLEDGE and must be MONTHLY or ANNUAL when kind == RECURRING_SUBSCRIPTION."
    error_id: ERR_BILLING_INTERVAL_MISMATCH
    http_status: 422
    applies_to: "POST /nil/commitments"

  - priority: 41
    name: contribution_source_pairing
    category: business_constraint
    rule: "commitment_id must be present when source_kind is SUBSCRIPTION_CHARGE or MAJOR_GIFT_INSTALLMENT, and must be absent when source_kind == ONE_TIME_GIFT."
    error_id: ERR_SOURCE_KIND_COMMITMENT_MISMATCH
    http_status: 422
    applies_to: "POST /nil/contributions"

  - priority: 42
    name: funding_designation_match
    category: business_fiscal
    rule: "A PaymentRelease may only draw on contributions carrying the same designation as the contract's funding_designation; a contract whose funding_designation has no matching settled contributions cannot be paid."
    error_id: ERR_FUNDING_DESIGNATION_MISMATCH
    http_status: 422
    applies_to: "POST /nil/payment-releases"

  - priority: 43
    name: designated_funds_sufficient
    category: business_fiscal
    rule: >
      requested_amount_cents must not exceed the collective's unreleased settled
      net funds carrying the contract's funding_designation: sum of
      net_amount_cents over SETTLED contributions with that designation, minus
      the sum of requested_amount_cents over RELEASED releases on contracts with
      that same designation.
    error_id: ERR_INSUFFICIENT_DESIGNATED_FUNDS
    http_status: 422
    applies_to: "POST /nil/payment-releases"

  - priority: 44
    name: taxpayer_documentation_for_nonresident
    category: business_fiscal
    rule: "A release to an Athlete with tax_person_kind == NONRESIDENT_ALIEN requires taxpayer_doc_on_file == W8BEN."
    error_id: ERR_TAXPAYER_DOC_REQUIRED
    http_status: 422
    applies_to: "POST /nil/payment-releases"

  - priority: 45
    name: release_within_payout_eligible
    category: business_fiscal
    rule: "For a DELIVERABLE_PAYOUT release, requested_amount_cents must not exceed the named Deliverable's payout_eligible_cents."
    error_id: ERR_RELEASE_EXCEEDS_PAYOUT_ELIGIBLE
    http_status: 422
    applies_to: "POST /nil/payment-releases"

  - priority: 46
    name: roster_batch_overlap_capacity
    category: business_temporal
    rule: >
      Aggregate-capacity overlap on the Collective-plus-sport resource, with
      CLOSED-interval semantics that deliberately differ from priority 28's
      half-open exclusivity semantics: two batch windows [s1, e1] and [s2, e2]
      collide when s1 <= e2 AND s2 <= e1, so windows that merely touch at an
      endpoint DO collide here. A new roster allocation batch is rejected when the
      number of DISTINCT existing allocation_batch_code values on the same
      collective and sport whose windows collide with the new batch's window is
      already >= BATCH_OVERLAP_CAPACITY. Only contracts with lifecycle_status in
      {DRAFT, ACTIVE} are counted. This rule is deliberately evaluated last so
      that a batch which also violates any cheaper rule reports that rule instead.
    error_id: ERR_BATCH_OVERLAP_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /nil/deal-contracts/roster-allocations"

# ============================================================================
# §1.5 TABLE 5 — ENDPOINTS
# Every path placeholder is written as the literal {id}. Every listing endpoint
# accepts limit? and offset? per §1.0 pagination defaults and returns
# total_count / has_more in meta.
# ============================================================================
endpoints:

  # --- test-driving endpoint (logical clock) ---------------------------------
  - method: POST
    path: /nil/_clock/set_current_utc
    roles: [PlatformAdmin]
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    description: >
      Sets the server's logical UTC clock. Required because every disclosure
      window, deliverable due date, tax-year boundary and reversal window in this
      specification is expressed against that clock and there is no other way to
      reach those boundaries from the API. The clock's startup default is
      2026-08-01T00:00:00Z; it is static between calls and may be moved backward
      as well as forward. This is a §1.5 tier-3 test-driving endpoint: no
      business endpoint can compose the same effect.
    side_effects:
      - "The logical clock is set to current_utc. No entity row is modified."

  # --- Collective -----------------------------------------------------------
  - method: POST
    path: /nil/collectives
    roles: [PlatformAdmin]
    input: [name, institution_name, institution_ipeds_code, home_state_code, association_ruleset, "entity_structure?", "communication_policy?"]
    output: Collective
    side_effects:
      - "A Collective row is created with version 1, structure_effective_at := current logical clock, structure_change_count 0, charitable_deduction_enabled derived from entity_structure, and funding_posture OPEN (committed 0)."

  - method: GET
    path: /nil/collectives/{id}
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer]
    input: []
    output: Collective
    side_effects: []

  - method: GET
    path: /nil/collectives
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer]
    input: ["funding_posture?", "entity_structure?", "limit?", "offset?"]
    output: Collective[]
    side_effects: []

  - method: PATCH
    path: /nil/collectives/{id}/entity-structure
    roles: [PlatformAdmin]
    input: [entity_structure, expected_collective_version]
    output: Collective
    description: >
      Changes the tax entity structure. This is the restructure cascade: it
      closes every DRAFT/OPEN tier, pauses every ACTIVE/PAST_DUE commitment on
      those tiers, and re-evaluates every affected donor for the LAPSED bubble-up.
    side_effects:
      - "Collective.entity_structure := the submitted value; charitable_deduction_enabled is re-derived; structure_effective_at := current logical clock; structure_change_count := structure_change_count + 1; Collective.version := version + 1."
      - "Cascade level 1: every MembershipTier of the collective with tier_status in {DRAFT, OPEN} becomes CLOSED, in MembershipTier.sequence_no ASC order."
      - "Cascade level 2: every Commitment whose DonorMember.membership_tier_id is one of those tiers and whose status is in {ACTIVE, PAST_DUE} becomes PAUSED with pause_reason := STRUCTURE_RESTRUCTURE, in Commitment.sequence_no ASC order."
      - "Cascade level 3: every DonorMember left with at least one Commitment and with all of its commitments in {PAUSED, CANCELLED, FULFILLED} becomes LAPSED, in DonorMember.sequence_no ASC order."
      - "Existing Contribution.deductible_amount_cents values are NOT retroactively rewritten by this call; only a YEAR_END_TAX_RECOMPUTE billing run does that."

  # --- MembershipTier -------------------------------------------------------
  - method: POST
    path: /nil/collectives/{id}/membership-tiers
    roles: [CollectiveDirector]
    input: [tier_code, tier_name, annual_dues_cents, benefit_rank]
    output: MembershipTier
    side_effects:
      - "A MembershipTier row is created with collective_id from the path, tier_status DRAFT, and the next MembershipTier.sequence_no."

  - method: GET
    path: /nil/collectives/{id}/membership-tiers
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer]
    input: ["tier_status?", "limit?", "offset?"]
    output: MembershipTier[]
    description: "Reverse-reachability GET for MembershipTier.collective_id, ordered by sequence_no ASC."
    side_effects: []

  - method: GET
    path: /nil/membership-tiers/{id}
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer]
    input: []
    output: MembershipTier
    side_effects: []

  - method: POST
    path: /nil/membership-tiers/{id}/transitions
    roles: [CollectiveDirector]
    input: [action]
    output: MembershipTier
    description: "action is one of OPEN, CLOSE. Drives sm_membership_tier_status."
    side_effects:
      - "MembershipTier.tier_status advances per sm_membership_tier_status."
      - "A CLOSE does NOT pause commitments: only the entity-structure restructure cascade does that."

  # --- DonorMember ----------------------------------------------------------
  - method: POST
    path: /nil/donor-members
    roles: [CollectiveDirector]
    input: [collective_id, membership_tier_id, display_name, email, "donor_kind?", "annual_agi_cents?"]
    output: DonorMember
    side_effects:
      - "A DonorMember row is created with version 1, status PROSPECT, and the next DonorMember.sequence_no."

  - method: GET
    path: /nil/donor-members/{id}
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, TreasuryOfficer]
    input: []
    output: DonorMember
    side_effects: []

  - method: GET
    path: /nil/donor-members
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, TreasuryOfficer]
    input: ["collective_id?", "membership_tier_id?", "status?", "limit?", "offset?"]
    output: DonorMember[]
    description: "Reverse-reachability GET for DonorMember.collective_id and DonorMember.membership_tier_id, ordered by sequence_no ASC."
    side_effects: []

  - method: PATCH
    path: /nil/donor-members/{id}/tax-profile
    roles: [CollectiveDirector]
    input: ["donor_kind?", "annual_agi_cents?"]
    output: DonorMember
    description: >
      Updates the donor's deductibility inputs. Changing annual_agi_cents or
      donor_kind does NOT retroactively rewrite stored
      Contribution.deductible_amount_cents values; a YEAR_END_TAX_RECOMPUTE
      billing run is required for that.
    side_effects:
      - "DonorMember.donor_kind and/or annual_agi_cents are updated; DonorMember.version := version + 1."

  # --- Commitment -----------------------------------------------------------
  - method: POST
    path: /nil/commitments
    roles: [CollectiveDirector]
    input: [donor_member_id, kind, amount_cents, billing_interval, "installments_total?", expected_donor_member_version]
    output: Commitment
    side_effects:
      - "A Commitment row is created with status ACTIVE, installments_charged 0, pause_reason NONE, superseded_by_commitment_id NULL, and the next Commitment.sequence_no."
      - "DonorMember.version := version + 1 (OCC parent bump per §1.2.1 commitment-create-stale-donor)."

  - method: GET
    path: /nil/commitments/{id}
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, TreasuryOfficer]
    input: []
    output: Commitment
    side_effects: []

  - method: GET
    path: /nil/commitments
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, TreasuryOfficer]
    input: ["donor_member_id?", "superseded_by_commitment_id?", "status?", "kind?", "limit?", "offset?"]
    output: Commitment[]
    description: "Reverse-reachability GET for Commitment.donor_member_id and for the self-referential Commitment.superseded_by_commitment_id, ordered by sequence_no ASC."
    side_effects: []

  - method: POST
    path: /nil/commitments/{id}/transitions
    roles: [CollectiveDirector]
    input: [action]
    output: Commitment
    description: "action is one of PAUSE, RESUME, CANCEL. Drives sm_commitment_status."
    side_effects:
      - "Commitment.status advances per sm_commitment_status; pause_reason is set to DONOR_REQUEST on PAUSE and NONE on RESUME."
      - "The owning DonorMember is re-evaluated for the ACTIVE -> LAPSED bubble-up."

  - method: POST
    path: /nil/commitments/{id}/restructure
    roles: [CollectiveDirector]
    input: [amount_cents, "installments_total?"]
    output: Commitment
    description: >
      Replaces a pledge or subscription with a fresh one on the same donor. The
      response is the NEW Commitment row. This is the only producer of the
      self-referential link.
    side_effects:
      - "A new Commitment row is created on the same donor_member_id with the same kind and billing_interval, status ACTIVE, installments_charged 0, and the next sequence_no."
      - "The original Commitment.superseded_by_commitment_id := the new commitment's id, and its status becomes CANCELLED."
      - "A commitment may never supersede itself and the supersession chain may never contain a cycle: the new row's superseded_by_commitment_id is always NULL at creation."
      - "The owning DonorMember is re-evaluated for the ACTIVE -> LAPSED bubble-up (the new ACTIVE commitment normally prevents it)."

  # --- Contribution ---------------------------------------------------------
  - method: POST
    path: /nil/contributions
    roles: [CollectiveDirector, TreasuryOfficer]
    input: [donor_member_id, gross_amount_cents, source_kind, "commitment_id?", "designation?", "processor_outcome?"]
    output: Contribution
    side_effects:
      - "A Contribution row is created with received_at := current logical clock, status PENDING, and the next Contribution.sequence_no."
      - "processor_outcome APPROVE settles it in the same request (fee, net and AT_RECEIPT deductible computed; Collective ledger and funding_posture re-derived; DonorMember bubble-up; Commitment advance); DECLINE fails it; DEFER leaves it PENDING."

  - method: GET
    path: /nil/contributions/{id}
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, TreasuryOfficer]
    input: []
    output: Contribution
    side_effects: []

  - method: GET
    path: /nil/contributions
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, TreasuryOfficer]
    input: ["donor_member_id?", "commitment_id?", "status?", "designation?", "deduction_variant?", "limit?", "offset?"]
    output: Contribution[]
    description: "Reverse-reachability GET for Contribution.donor_member_id and Contribution.commitment_id, ordered by sequence_no ASC."
    side_effects: []

  - method: POST
    path: /nil/contributions/{id}/settlements
    roles: [CollectiveDirector, TreasuryOfficer]
    input: [outcome]
    output: Contribution
    description: "outcome is one of APPROVE, DECLINE. Resolves a PENDING contribution created with processor_outcome DEFER."
    side_effects:
      - "Contribution.status advances per sm_contribution_status with the same side effects as an inline settlement."

  - method: POST
    path: /nil/contributions/{id}/refund
    roles: [TreasuryOfficer]
    input: []
    output: Contribution
    side_effects:
      - "Contribution.status := REFUNDED."
      - "Collective.settled_net_funds_cents is reduced by this row's net_amount_cents and funding_posture is re-derived (compensation)."
      - "DonorMember.lifetime_settled_cents and lifetime_deductible_cents are re-derived; the refunded row's share of the AGI ceiling is freed for the next recompute."

  # --- Billing runs (computed read / bulk action) ----------------------------
  - method: POST
    path: /nil/collectives/{id}/billing-runs
    roles: [TreasuryOfficer]
    input: [run_kind]
    output: "{ run_kind: string, executed_at: string, charged_commitment_count: integer, settled_contribution_count: integer, failed_contribution_count: integer, recomputed_contribution_count: integer, deduction_delta_cents: integer }"
    description: >
      run_kind is one of SUBSCRIPTION_CHARGE_CYCLE or YEAR_END_TAX_RECOMPUTE.
      SUBSCRIPTION_CHARGE_CYCLE walks every ACTIVE or PAST_DUE
      RECURRING_SUBSCRIPTION commitment of the collective in Commitment.sequence_no
      ASC order and records one SUBSCRIPTION_CHARGE Contribution per commitment
      with processor_outcome APPROVE. YEAR_END_TAX_RECOMPUTE re-runs
      calc_contribution_deductible_amount under the year_end_recompute variant for
      every donor of the collective. This is the only producer of the
      YEAR_END_RECOMPUTE deduction variant.
    side_effects:
      - "SUBSCRIPTION_CHARGE_CYCLE: one Contribution per eligible commitment, each settled inline; the Collective ledger and funding_posture are re-derived once at the end."
      - "YEAR_END_TAX_RECOMPUTE: every SETTLED Contribution of every donor of this collective in the current tax year has deductible_amount_cents recomputed under the year_end_recompute ordering and deduction_variant := YEAR_END_RECOMPUTE; deduction_delta_cents reports the signed sum of the changes (always 0 in total, but nonzero per row)."
      - "Neither run kind touches Collective.version, so no OCC field is accepted here."

  # --- Athlete --------------------------------------------------------------
  - method: POST
    path: /nil/athletes
    roles: [CollectiveDirector, ComplianceOfficer]
    input: [collective_id, full_name, portal_user_id, sport, class_year, "roster_weight?", "tax_person_kind?"]
    output: Athlete
    side_effects:
      - "An Athlete row is created with eligibility_status ENROLLED, taxpayer_doc_on_file NONE, treaty_exempt_claimed false, and the next Athlete.sequence_no."

  - method: GET
    path: /nil/athletes/{id}
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer]
    input: []
    output: Athlete
    side_effects: []

  - method: GET
    path: /nil/athletes
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, TreasuryOfficer]
    input: ["collective_id?", "sport?", "eligibility_status?", "tax_form_required?", "limit?", "offset?"]
    output: Athlete[]
    description: "Reverse-reachability GET for Athlete.collective_id, ordered by sequence_no ASC."
    side_effects: []

  - method: POST
    path: /nil/athletes/{id}/eligibility-changes
    roles: [ComplianceOfficer]
    input: [change]
    output: Athlete
    description: "change is one of ENTER_PORTAL, WITHDRAW_FROM_PORTAL, COMPLETE_TRANSFER, DECLARE_INELIGIBLE, REINSTATE. Drives sm_athlete_eligibility_status."
    side_effects:
      - "Athlete.eligibility_status advances per sm_athlete_eligibility_status."
      - "COMPLETE_TRANSFER and DECLARE_INELIGIBLE terminate every DRAFT/ACTIVE contract of the athlete, which in turn forfeits non-terminal deliverables and voids QUEUED releases (three cascade levels)."
      - "WITHDRAW_FROM_PORTAL releases every QUEUED PaymentRelease on the athlete's ACTIVE contracts, in PaymentRelease.sequence_no ASC order."

  - method: PATCH
    path: /nil/athletes/{id}/tax-profile
    roles: [ComplianceOfficer, TreasuryOfficer]
    input: [taxpayer_doc_on_file, "treaty_exempt_claimed?"]
    output: Athlete
    description: >
      Records the taxpayer certification. taxpayer_doc_on_file is one of NONE,
      W9, W8BEN. treaty_exempt_claimed may only be true when
      taxpayer_doc_on_file == W8BEN, else ERR_INVALID_REQUEST.
    side_effects:
      - "Athlete.taxpayer_doc_on_file and treaty_exempt_claimed are updated; tax_form_required is re-derived; Athlete.version := version + 1."

  # --- DealContract ---------------------------------------------------------
  - method: POST
    path: /nil/deal-contracts
    roles: [CollectiveDirector]
    input: [collective_id, athlete_id, total_value_cents, effective_start_at, effective_end_at, "funding_designation?", "exclusivity_category?"]
    output: DealContract
    description: "Creates an INDIVIDUAL contract. deal_kind and allocation_batch_code are system-assigned (INDIVIDUAL / NULL) and any submitted value is ignored."
    side_effects:
      - "A DealContract row is created with version 1, deal_kind INDIVIDUAL, allocation_batch_code NULL, lifecycle_status DRAFT, payment_status UNPAID, termination_reason NONE, and the next DealContract.sequence_no."
      - "disclosure_status := DISCLOSURE_NOT_REQUIRED when total_value_cents < DISCLOSURE_THRESHOLD_CENTS, else DISCLOSURE_PENDING with disclosure_due_at := created_at + DISCLOSURE_WINDOW_HOURS."
      - "Athlete.annual_committed_value_cents is re-derived."
      - "Collective.committed_unreleased_cents and funding_posture are re-derived (a DRAFT contract already counts as committed)."

  - method: GET
    path: /nil/deal-contracts/{id}
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer]
    input: []
    output: DealContract
    side_effects: []

  - method: GET
    path: /nil/deal-contracts
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer]
    input: ["collective_id?", "athlete_id?", "allocation_batch_code?", "deal_kind?", "lifecycle_status?", "payment_status?", "disclosure_status?", "limit?", "offset?"]
    output: DealContract[]
    description: "Reverse-reachability GET for DealContract.collective_id and DealContract.athlete_id, ordered by sequence_no ASC. allocation_batch_code + athlete_id together address one share of a roster batch without using any id as a business selector."
    side_effects: []

  - method: POST
    path: /nil/deal-contracts/roster-allocations
    roles: [CollectiveDirector]
    input: [collective_id, allocation_batch_code, sport, pool_amount_cents, allocation_mode, effective_start_at, effective_end_at, "funding_designation?", "exclusivity_category?", expected_collective_version]
    output: "{ allocation_batch_code: string, created_contract_count: integer, allocated_total_cents: integer, remainder_cents: integer, min_share_cents: integer, max_share_cents: integer }"
    description: >
      Mints one ROSTER_SHARE DealContract per eligible athlete per
      calc_roster_share_allocation. allocation_mode is one of EQUAL_SHARE or
      WEIGHTED_BY_ROSTER_WEIGHT. The batch is all-or-nothing: if any validation
      fails for any athlete, no contract is created at all. allocated_total_cents
      always equals pool_amount_cents and remainder_cents reports how many
      one-cent remainder units were distributed in step 3.
    side_effects:
      - "One DealContract row per eligible athlete with deal_kind ROSTER_SHARE, the shared allocation_batch_code, total_value_cents from calc_roster_share_allocation, lifecycle_status DRAFT, payment_status UNPAID, and consecutive DealContract.sequence_no values assigned in the step-3 distribution order."
      - "Each new contract's disclosure_status is derived from its own total_value_cents against DISCLOSURE_THRESHOLD_CENTS, so one batch can produce a mix of DISCLOSURE_NOT_REQUIRED and DISCLOSURE_PENDING rows."
      - "Collective.version := version + 1 exactly once for the whole batch (OCC parent bump per §1.2.1 roster-batch-create-stale-collective)."
      - "Collective.committed_unreleased_cents and funding_posture are re-derived; each athlete's annual_committed_value_cents is re-derived."

  - method: POST
    path: /nil/deal-contracts/{id}/compliance-submissions
    roles: [CollectiveDirector, ComplianceOfficer]
    input: ["state_law_citation?", "association_rule_citation?"]
    output: DealContract
    description: "Files the institutional / state-law disclosure. Drives the disclosure dimension only; lifecycle_status and payment_status are untouched."
    side_effects:
      - "DealContract.disclosure_submitted_at := current logical clock."
      - "disclosure_status becomes DISCLOSURE_PENDING when the clock is at or before disclosure_due_at, or DISCLOSURE_LATE when it is strictly after."
      - "DealContract.version := version + 1."

  - method: POST
    path: /nil/deal-contracts/{id}/compliance-decisions
    roles: [InstitutionReviewer]
    input: [decision, "reviewer_note?"]
    output: DealContract
    description: "decision is one of ACCEPT, RETURN. The institution reviewer is the only role permitted to adjudicate a disclosure."
    side_effects:
      - "disclosure_status advances per sm_deal_contract_disclosure."
      - "A RETURN increments disclosure_return_count; the second RETURN also moves lifecycle_status DRAFT -> VOIDED and forfeits every non-terminal Deliverable of the contract."
      - "DealContract.version := version + 1."

  - method: POST
    path: /nil/deal-contracts/{id}/activation
    roles: [CollectiveDirector]
    input: []
    output: DealContract
    side_effects:
      - "lifecycle_status DRAFT -> ACTIVE per sm_deal_contract_lifecycle; DealContract.version := version + 1."
      - "The funding posture is NOT consulted on activation: posture gates creation, roster batches and releases only, so a contract already counted as committed can always be activated."

  - method: POST
    path: /nil/deal-contracts/{id}/termination
    roles: [CollectiveDirector, ComplianceOfficer]
    input: [termination_reason]
    output: DealContract
    description: "termination_reason is one of TRANSFER_OUT, INELIGIBILITY, BREACH, MUTUAL_RELEASE."
    side_effects:
      - "lifecycle_status -> TERMINATED, termination_reason recorded, clawback_amount_cents computed per calc_clawback_amount, payment_status -> CLAWBACK_DUE when the clawback is > 0."
      - "Cascade level 2: non-terminal Deliverables -> FORFEITED in sequence_no ASC order (before the clawback figure is taken)."
      - "Cascade level 3: QUEUED PaymentReleases -> VOIDED in sequence_no ASC order."
      - "Collective.committed_unreleased_cents and funding_posture are re-derived; the athlete's annual_committed_value_cents is re-derived; DealContract.version := version + 1."

  # --- Deliverable ----------------------------------------------------------
  - method: POST
    path: /nil/deal-contracts/{id}/deliverables
    roles: [CollectiveDirector]
    input: [deliverable_kind, unit_value_cents, due_at, "required_charity_hours_tenths?"]
    output: Deliverable
    side_effects:
      - "A Deliverable row is created with deal_contract_id from the path, status PENDING, evidence_records [], submission_count 0, late_flag false, and the next Deliverable.sequence_no."
      - "DealContract.deliverable_value_total_cents is re-derived, which re-scores every CONTRACT_SHARE_BASIS sibling that is already VERIFIED or WAIVED."

  - method: GET
    path: /nil/deal-contracts/{id}/deliverables
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer]
    input: ["status?", "deliverable_kind?", "limit?", "offset?"]
    output: Deliverable[]
    description: "Reverse-reachability GET for Deliverable.deal_contract_id, ordered by sequence_no ASC."
    side_effects: []

  - method: GET
    path: /nil/deliverables/{id}
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer]
    input: []
    output: Deliverable
    side_effects: []

  - method: POST
    path: /nil/deliverables/{id}/evidence
    roles: [Athlete, CollectiveDirector]
    input: [evidence_kind, reference_label]
    output: Deliverable
    description: >
      Records one documentation-of-services item. evidence_kind is one of
      ANALYTICS_SCREENSHOT, SIGNED_ATTENDANCE_SHEET, PHOTO_SET,
      ORGANISATION_LETTER. Append-only: evidence is never removed.
    side_effects:
      - "One record is appended to Deliverable.evidence_records with recorded_at := current logical clock and its own within-deliverable sequence_no; evidence_count is re-derived."

  - method: POST
    path: /nil/deliverables/{id}/submissions
    roles: [Athlete, CollectiveDirector]
    input: [performed_at, "charity_hours_tenths?", "submission_note?"]
    output: Deliverable
    side_effects:
      - "status PENDING|REJECTED -> SUBMITTED per sm_deliverable_status; submission_count incremented; performed_at, submitted_at, late_flag and charity_hours_tenths overwritten from this submission."

  - method: POST
    path: /nil/deliverables/{id}/reviews
    roles: [ComplianceOfficer]
    input: [decision, "review_note?"]
    output: Deliverable
    description: "decision is one of VERIFY, REJECT, WAIVE."
    side_effects:
      - "status advances per sm_deliverable_status; on VERIFY or WAIVE, verified_by_user_id := the caller's X-User-ID, verified_at := current logical clock, and payout_basis / payout_eligible_cents are computed."
      - "The parent contract's lifecycle dimension is re-evaluated for the ACTIVE -> COMPLETED bubble-up."

  # --- PaymentRelease -------------------------------------------------------
  - method: POST
    path: /nil/payment-releases
    roles: [TreasuryOfficer]
    input: [deal_contract_id, release_kind, requested_amount_cents, "deliverable_id?", expected_deal_contract_version]
    output: PaymentRelease
    side_effects:
      - "A PaymentRelease row is created with status QUEUED, initiated_by_user_id := the caller's X-User-ID, withholding computed per calc_release_withholding, and the next PaymentRelease.sequence_no."
      - "When the Athlete.eligibility_status == ENROLLED the row advances to RELEASED in the same request with released_at := current logical clock; when the athlete is PORTAL_ENTERED it stays QUEUED."
      - "On release: the contract payment dimension advances, Collective.released_total_cents / committed_unreleased_cents / funding_posture are re-derived, and the athlete's tax-year ledger and tax_form_required are re-derived."
      - "DealContract.version := version + 1 (OCC parent bump per §1.2.1 payment-release-stale-contract)."

  - method: GET
    path: /nil/payment-releases/{id}
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer]
    input: []
    output: PaymentRelease
    side_effects: []

  - method: GET
    path: /nil/payment-releases
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, Athlete, TreasuryOfficer]
    input: ["deal_contract_id?", "deliverable_id?", "status?", "release_kind?", "withholding_basis?", "limit?", "offset?"]
    output: PaymentRelease[]
    description: "Reverse-reachability GET for PaymentRelease.deal_contract_id and PaymentRelease.deliverable_id, ordered by sequence_no ASC."
    side_effects: []

  - method: POST
    path: /nil/payment-releases/{id}/reversals
    roles: [TreasuryOfficer]
    input: [reversal_reason]
    output: PaymentRelease
    description: "reversal_reason is one of ERRONEOUS_PAYMENT, CLAWBACK. Full reversal only: partial reversals do not exist."
    side_effects:
      - "status RELEASED -> REVERSED; reversal_reason recorded."
      - "The contract payment dimension steps back; Collective.released_total_cents, reversed_total_cents, committed_unreleased_cents and funding_posture are re-derived; the athlete's tax-year ledger and tax_form_required are re-derived."
      - "DealContract.version := version + 1."

  # --- CommunicationLog -----------------------------------------------------
  - method: POST
    path: /nil/communication-logs
    roles: [CollectiveDirector, ComplianceOfficer]
    input: [collective_id, actor_role, channel, topic, "athlete_id?", "note?"]
    output: CommunicationLog
    description: >
      Records one coach/program touchpoint and computes the boundary verdict. A
      PROHIBITED verdict is recorded with HTTP 201: the log is an audit trail, not
      an authorization gate.
    side_effects:
      - "A CommunicationLog row is created with logged_at := current logical clock, verdict and rationale_code from calc_communication_boundary_verdict, and the next CommunicationLog.sequence_no. The row is immutable thereafter."

  - method: GET
    path: /nil/communication-logs/{id}
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, TreasuryOfficer]
    input: []
    output: CommunicationLog
    side_effects: []

  - method: GET
    path: /nil/communication-logs
    roles: [PlatformAdmin, CollectiveDirector, ComplianceOfficer, InstitutionReviewer, TreasuryOfficer]
    input: ["collective_id?", "athlete_id?", "actor_role?", "verdict?", "limit?", "offset?"]
    output: CommunicationLog[]
    description: "Reverse-reachability GET for CommunicationLog.collective_id and CommunicationLog.athlete_id, ordered by sequence_no ASC."
    side_effects: []

# ============================================================================
# GLOBAL CONSTANTS referenced by §1.2 / §1.4 (calculation-local constants live
# in their own §1.3 entry)
# ============================================================================
global_constants:
  DISCLOSURE_THRESHOLD_CENTS: 60000     # contract face value at or above which state-law / association disclosure is required (>=)
  DISCLOSURE_WINDOW_HOURS: 168          # hours from DealContract.created_at to disclosure_due_at
  MIN_EVIDENCE_RECORDS: 1               # documentation-of-services records required before a deliverable may be submitted
  RESUBMISSION_LIMIT: 3                 # maximum submissions per deliverable, counting the first
  STRUCTURE_CHANGE_LIMIT: 2             # maximum accepted entity-structure changes per collective
  BATCH_OVERLAP_CAPACITY: 2             # maximum distinct roster allocation batches whose closed windows may collide on one collective+sport

# ============================================================================
# §1.6 TABLE 6 — ERROR CATALOG (63 codes; every one is reachable from the API)
# ============================================================================
errors:

  # --- authentication / authorization ---
