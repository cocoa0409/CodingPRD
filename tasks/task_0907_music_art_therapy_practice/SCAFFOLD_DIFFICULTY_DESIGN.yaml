  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: group_capacity_at_limit_rejects
        grounds:
          - validations[priority=12]
          - errors[ERR_SESSION_FULL]
          - entities.Session.fields.capacity
        distinguishing_aspect: |
          Count-metric boundary on POST /sessions/{id}/enrollments: enrolling the 2nd client
          succeeds at count 1 (capacity-1), the 3rd is rejected once non-CANCELLED count
          equals capacity 2 (>= boundary) with ERR_SESSION_FULL.
        test_recipe:
          setup:
            - "GROUP session capacity=2 on an ACTIVE plan; three existing clients c1,c2,c3; c1 already enrolled."
          setup_api_calls:
            - call: "POST /therapists"
