# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header is missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not authorized for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "General request shape/type error" }

  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Customer id not found" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "Project id not found" }
  - { id: ERR_LAYOUT_NOT_FOUND, http: 404, condition: "KitchenLayout id not found" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "EquipmentItem id not found" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "Quote id not found" }
  - { id: ERR_FILING_NOT_FOUND, http: 404, condition: "PermitFiling id not found" }
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "DeliveryJob id not found" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "StartupSession id not found" }
  - { id: ERR_AGENCY_NOT_FOUND, http: 404, condition: "ServiceAgency id not found" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "ServiceAssignment id not found" }

  - { id: ERR_PROJECT_NOT_IN_DESIGN, http: 409, condition: "Quote present requires Project in DESIGN" }
  - { id: ERR_PROJECT_NOT_QUOTED, http: 409, condition: "Quote accept requires Project in QUOTED" }
  - { id: ERR_PROJECT_NOT_COMMISSIONED, http: 409, condition: "Punch-list close requires Project in COMMISSIONED" }
  - { id: ERR_PROJECT_NOT_PUNCH_CLOSED, http: 409, condition: "Project complete requires PUNCH_CLOSED" }
  - { id: ERR_PROJECT_ALREADY_TERMINAL, http: 409, condition: "Operation on COMPLETED or CANCELLED Project" }
  - { id: ERR_PROJECT_NOT_READY_FOR_FABRICATION, http: 409, condition: "Fabrication start-production requires Project in CONTRACTED or FABRICATION" }

  - { id: ERR_LAYOUT_NOT_DRAFT, http: 409, condition: "Submit requires Layout in DRAFT" }
  - { id: ERR_LAYOUT_NOT_SUBMITTED, http: 409, condition: "Approve/return requires Layout in SUBMITTED" }
  - { id: ERR_LAYOUT_NOT_APPROVED, http: 409, condition: "Quote create/present and filing submit require APPROVED Layout" }
  - { id: ERR_LAYOUT_EMPTY, http: 422, condition: "Layout must reference at least one EquipmentItem before submit" }
  - { id: ERR_HOOD_SPEC_INCONSISTENT, http: 422, condition: "Layout.hood_required == true but no EquipmentItem has requires_hood == true" }

  - { id: ERR_QUOTE_NOT_DRAFT, http: 409, condition: "Present requires Quote in DRAFT" }
  - { id: ERR_QUOTE_NOT_PRESENTED, http: 409, condition: "Accept requires Quote in PRESENTED" }
  - { id: ERR_QUOTE_NOT_OPEN, http: 409, condition: "Reject requires Quote in DRAFT or PRESENTED" }

  - { id: ERR_FILING_NOT_DRAFT, http: 409, condition: "Submit requires Filing in DRAFT" }
  - { id: ERR_FILING_NOT_SUBMITTED, http: 409, condition: "Record-decision requires Filing in SUBMITTED" }
  - { id: ERR_FILING_NOT_REJECTED, http: 409, condition: "Resubmit requires Filing in REJECTED" }
  - { id: ERR_REVIEW_CYCLE_LIMIT_REACHED, http: 422, condition: "review_cycle_no has reached MAX_REVIEW_CYCLES (3)" }

  - { id: ERR_JOB_NOT_PLANNED, http: 409, condition: "Dispatch requires DeliveryJob in PLANNED" }
  - { id: ERR_JOB_NOT_DISPATCHED, http: 409, condition: "Mark-site-complete requires DISPATCHED" }
  - { id: ERR_JOB_NOT_CANCELLABLE, http: 409, condition: "Cancel requires PLANNED or DISPATCHED" }
  - { id: ERR_INVALID_JOB_WINDOW, http: 422, condition: "scheduled_end must be > scheduled_start" }
  - { id: ERR_DELIVERY_WINDOW_CONFLICT, http: 422, condition: "Overlapping windows with same rigging_required and < 2h buffer on same Project" }

  - { id: ERR_SESSION_NOT_SCHEDULED, http: 409, condition: "Complete/void requires StartupSession in SCHEDULED" }
  - { id: ERR_ITEM_NOT_INSTALLED, http: 409, condition: "Startup complete requires EquipmentItem in INSTALLED" }
  - { id: ERR_DEMO_TOO_SHORT, http: 422, condition: "demo_minutes < 15" }

  - { id: ERR_FAB_NOT_PENDING_DRAWING, http: 409, condition: "Approve-shop-drawing requires PENDING_SHOP_DRAWING" }
  - { id: ERR_FAB_NOT_APPROVED, http: 409, condition: "Start-production requires SHOP_DRAWING_APPROVED" }
  - { id: ERR_FAB_NOT_IN_PRODUCTION, http: 409, condition: "Complete requires IN_PRODUCTION" }
  - { id: ERR_FABRICATION_INCOMPLETE, http: 422, condition: "CUSTOM_FABRICATION items exist without FAB_COMPLETE FabricationOrder when dispatch is attempted" }
  - { id: ERR_SHOP_DRAWING_MISSING, http: 422, condition: "shop_drawing_ref is empty at approve-shop-drawing" }

  - { id: ERR_ASSIGNMENT_NOT_OPEN, http: 409, condition: "Close/transfer requires ServiceAssignment in OPEN" }
  - { id: ERR_AGENCY_AT_CAPACITY, http: 402, condition: "Target agency open_assignment_count >= capacity" }

  - { id: ERR_OPEN_BLOCKING_PUNCH_ITEMS, http: 409, condition: "OPEN FUNCTIONAL or LIFE_SAFETY PunchListItems block punch close" }
  - { id: ERR_OPEN_SERVICE_ASSIGNMENT, http: 409, condition: "OPEN ServiceAssignment blocks Project completion" }
  - { id: ERR_HEALTH_PERMIT_NOT_APPROVED, http: 422, condition: "HEALTH_DEPT PermitFiling not APPROVED at punch close" }

  - { id: ERR_CUSTOMER_SUSPENDED, http: 402, condition: "Quote accept requires Customer.status == ACTIVE" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "outstanding_exposure_cents + grand_total_cents would exceed credit_limit_cents" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not match Project.version" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Back-office operator; owns Customer lifecycle, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /customers"
      - "POST /customers/{customerId}/suspend"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on all resources"

  - name: ProjectManager
    description: "Dealer-side PM; owns layout approval, punch close, project lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /design-build-projects"
      - "POST /design-build-projects/{id}/cancel"
      - "POST /design-build-projects/{id}/close-punch-list"
      - "POST /design-build-projects/{id}/complete"
