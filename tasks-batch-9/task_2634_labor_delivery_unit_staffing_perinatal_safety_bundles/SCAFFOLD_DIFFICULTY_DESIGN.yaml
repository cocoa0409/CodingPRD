              captures: { e_v1: $.data.version }
            - call: POST /care-assignments
              payload: { encounter_id: "${e_id}", shift_assignment_id: "${sh_bed}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${e_v1}" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { ca1_id: $.data.id, ca1_debit: $.data.acuity_units_consumed }
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-10T07:05:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /labor-encounters/${e_id}/advance-phase
              payload: { target_phase: "LATENT" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: POST /care-assignments/${ca1_id}/release
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: GET /labor-encounters/${e_id}
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { e_v2: $.data.version, breach_state_1: $.data.staffing_state }
            - call: POST /care-assignments
              payload: { encounter_id: "${e_id}", shift_assignment_id: "${sh_bed}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${e_v2}" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { ca2_id: $.data.id, ca2_debit: $.data.acuity_units_consumed }
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-10T07:10:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /fetal-monitoring-assessments
              payload: { encounter_id: "${e_id}", interpreted_by_staff_id: "${s_charge}", category: "CATEGORY_I", baseline_rate_bpm: 141, variability: "MODERATE", recurrent_decelerations: false, assessed_at: "2026-08-10T07:10:00Z" }
              as: BedsideNurse
              as_user_id: "${s_charge}"
              captures: { fm_id: $.data.id }
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-10T07:15:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /labor-encounters/${e_id}/advance-phase
              payload: { target_phase: "ACTIVE_FIRST_STAGE" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: POST /care-assignments/${ca2_id}/release
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: GET /labor-encounters/${e_id}
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { e_v3: $.data.version, breach_state_2: $.data.staffing_state, required_after_afs: $.data.required_coverage_units }
          trigger:
            - call: POST /care-assignments
              payload: { encounter_id: "${e_id}", shift_assignment_id: "${sh_bed}", coverage_mode: "RATIO_SHARED", expected_encounter_version: "${e_v3}" }
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { ca3_id: $.data.id, ca3_debit: $.data.acuity_units_consumed }
          assert:
            - "LaborEncounter.${e_id}.labor_phase == ACTIVE_FIRST_STAGE"
            - "LaborEncounter.${e_id}.staffing_state == RATIO_COVERED"
            - "LaborEncounter.${e_id}.acuity_tier == TIER_II"
            - "LaborEncounter.${e_id}.required_coverage_units == 2.3"
            - "LaborEncounter.${e_id}.assigned_coverage_units == 2.3"
            - "CareAssignment.${ca1_id}.status == RELEASED"
            - "CareAssignment.${ca1_id}.acuity_units_consumed == 1.0"
            - "CareAssignment.${ca2_id}.status == RELEASED"
            - "CareAssignment.${ca2_id}.acuity_units_consumed == 2.3"
            - "CareAssignment.${ca3_id}.status == ACTIVE"
            - "CareAssignment.${ca3_id}.acuity_units_consumed == 2.3"
            - "ShiftAssignment.${sh_bed}.capacity_units_effective == 4.0"
            - "ShiftAssignment.${sh_bed}.assigned_acuity_load_units == 2.3"
            - "ObstetricUnit.${unit_id}.coverage_deficit_units == 0.0"
            - "ObstetricUnit.${unit_id}.staffing_posture == OPEN"
            - "ObstetricUnit.${unit_id}.turnover_buffer_minutes == 45"
            - "Bed.${bed_ldr_1}.status == OCCUPIED"

      - name: induction_booking_two_laps_of_hold_confirm_bump_requeue_cycle_promotes_to_medically_indicated
        grounds:
          - state_machines.InductionBooking.status
          - state_machines.InductionBooking.REQUESTED_to_CAPACITY_HELD
          - state_machines.InductionBooking.CAPACITY_HELD_to_CONFIRMED
          - state_machines.InductionBooking.CONFIRMED_to_BUMPED
          - state_machines.InductionBooking.CAPACITY_HELD_to_BUMPED
          - state_machines.InductionBooking.BUMPED_to_REQUESTED
          - calculations.induction_priority_class
          - calculations.induction_capacity_projection
          - calculations.induction_bed_minute_conservation
          - calculations.cesarean_readiness_derivation
        distinguishing_aspect: |
          InductionBooking.status is declared shape `cyclic`: REQUESTED ->
          CAPACITY_HELD -> CONFIRMED -> BUMPED -> REQUESTED closes a loop that a
          single booking may traverse TWICE and no more, because the loop
          counter is itself a precondition of one of its own edges. This
          instance drives two complete laps. Lap 1 goes all the way to CONFIRMED
          before bumping, so the credit-back is taken out of
          committed_bed_minutes_by_day; lap 2 bumps straight from CAPACITY_HELD,
          so the credit-back comes out of held_bed_minutes_by_day — the same
          edge label, two different maps. The second requeue then flips
          priority_class from ELECTIVE_39_WEEK to MEDICALLY_INDICATED purely
          because bump_count reached 2, even though indication_code
          (GDM_CONTROLLED) and gestational_age_weeks (39) never changed — and
          that promotion permanently seals the cycle, since /bump refuses
          MEDICALLY_INDICATED. An implementation that treats the state machine
          as a DAG cannot return to REQUESTED at all; one that treats
          priority_class as a pure function of the two request inputs leaves it
          at ELECTIVE_39_WEEK; one that debits the wrong map ends lap 2 with a
          non-zero held or committed total; and one that re-derives
          priority_class on the /bump instead of the /requeue promotes it a lap
          early and then cannot take the second bump at all.
        test_recipe:
          setup: |
            A quiet unit (no encounters, so coverage_deficit_units stays 0.0 and
            the posture stays OPEN with turnover_buffer_minutes 45 for the whole
            fixture, which is what makes both hold freezes land on the SAME
            645 = 600 + 45) with two LDR beds, so releasing and re-holding LDR-01
            never drives available_ldr_beds to 0 and never trips DIVERT.
            One validated DECISION_TO_INCISION drill (measured 22 minutes, inside
            the 30-minute pass boundary) is required only because /confirm
            refuses cesarean_readiness_state == NOT_READY; with an empty
            emergency-cesarean rolling window and no OR_STANDBY shift the
            readiness settles at DEGRADED, which /confirm accepts. The booking
            asks for 2026-08-05T08:00:00Z with expected_labor_minutes 600 and is
            GDM_CONTROLLED at exactly 39 weeks, i.e. ELECTIVE_39_WEEK on the
            inclusive boundary.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-04T09:00:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /obstetric-units
              payload: { unit_name: "Marlowe Perinatal Center", licensed_ldr_beds: 4, licensed_or_rooms: 1, max_daily_induction_bed_minutes: 2880 }
              as: PerinatalSafetyOfficer
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              captures: { bed_ldr_2: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Ingrid Sorensen MD", staff_role: "OB_ATTENDING", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-05-31T00:00:00Z", or_circulating_qualified: true }
              as: PerinatalSafetyOfficer
              captures: { s_ob: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Desmond Okafor MD", staff_role: "ANESTHESIOLOGIST", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-05-31T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_anes: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Priya Raghunathan RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "ADVANCED", credential_expires_at: "2027-05-31T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_charge: $.data.id }
            - call: POST /obstetric-units/${unit_id}/staff-members
              payload: { full_name: "Aurelio Bettencourt RN", staff_role: "RN_LABOR_DELIVERY", fetal_monitoring_cert_level: "BASIC", credential_expires_at: "2027-05-31T00:00:00Z", or_circulating_qualified: false }
              as: PerinatalSafetyOfficer
              captures: { s_pso: $.data.id }
            - call: POST /obstetric-units/${unit_id}/cesarean-readiness-drills
              payload: { drill_type: "DECISION_TO_INCISION", scheduled_for_utc: "2026-08-04T09:00:00Z", participant_staff_ids: ["${s_ob}", "${s_anes}"] }
              as: AnesthesiaLead
              as_user_id: "${s_anes}"
              captures: { drill_id: $.data.id }
            - call: POST /cesarean-readiness-drills/${drill_id}/start
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-04T09:30:00Z" }
              as: PerinatalSafetyOfficer
            - call: POST /cesarean-readiness-drills/${drill_id}/document
              payload: { decision_at: "2026-08-04T09:00:00Z", incision_at: "2026-08-04T09:22:00Z", documented_by_staff_id: "${s_anes}" }
              as: AnesthesiaLead
              as_user_id: "${s_anes}"
              captures: { drill_d2i: $.data.measured_d2i_minutes }
            - call: POST /cesarean-readiness-drills/${drill_id}/validate
              payload: {}
              as: PerinatalSafetyOfficer
              as_user_id: "${s_pso}"
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-CYCLE-7742", gestational_age_weeks: 39, indication_code: "GDM_CONTROLLED", requested_start_utc: "2026-08-05T08:00:00Z", expected_labor_minutes: 600 }
              as: PatientAccessCoordinator
              captures: { bk_id: $.data.id, class_at_create: $.data.priority_class }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PatientAccessCoordinator
              captures: { u_v1: $.data.version, buffer_lap1: $.data.turnover_buffer_minutes }
            - call: POST /induction-bookings/${bk_id}/hold-capacity
              payload: { bed_id: "${bed_ldr_1}", expected_unit_version: "${u_v1}" }
              as: PatientAccessCoordinator
              captures: { projected_lap1: $.data.projected_occupancy_minutes }
            - call: POST /induction-bookings/${bk_id}/confirm
              payload: {}
              as: ObstetricianAttending
              as_user_id: "${s_ob}"
            - call: POST /induction-bookings/${bk_id}/bump
              payload: {}
              as: ChargeNurse
              as_user_id: "${s_charge}"
              captures: { bump_count_lap1: $.data.bump_count }
            - call: POST /induction-bookings/${bk_id}/requeue
              payload: {}
              as: PatientAccessCoordinator
              captures: { class_after_lap1: $.data.priority_class }
            - call: GET /obstetric-units/${unit_id}
              payload: {}
              as: PatientAccessCoordinator
              captures: { u_v2: $.data.version, buffer_lap2: $.data.turnover_buffer_minutes }
            - call: POST /induction-bookings/${bk_id}/hold-capacity
              payload: { bed_id: "${bed_ldr_1}", expected_unit_version: "${u_v2}" }
              as: PatientAccessCoordinator
              captures: { projected_lap2: $.data.projected_occupancy_minutes }
            - call: POST /induction-bookings/${bk_id}/bump
              payload: {}
              as: PatientAccessCoordinator
              captures: { bump_count_lap2: $.data.bump_count }
          trigger:
            - call: POST /induction-bookings/${bk_id}/requeue
              payload: {}
              as: PatientAccessCoordinator
              captures: { class_after_lap2: $.data.priority_class, status_after_lap2: $.data.status }
          assert:
            - "InductionBooking.${bk_id}.status == REQUESTED"
            - "InductionBooking.${bk_id}.bump_count == 2"
            - "InductionBooking.${bk_id}.priority_class == MEDICALLY_INDICATED"
            - "InductionBooking.${bk_id}.bed_id == null"
            - "InductionBooking.${bk_id}.hold_expires_at == null"
            - "InductionBooking.${bk_id}.projected_occupancy_minutes == 645"
            - "InductionBooking.${bk_id}.encounter_id == null"
            - "ObstetricUnit.${unit_id}.held_bed_minutes_by_day[2026-08-05] == 0"
            - "ObstetricUnit.${unit_id}.committed_bed_minutes_by_day[2026-08-05] == 0"
            - "ObstetricUnit.${unit_id}.staffing_posture == OPEN"
            - "ObstetricUnit.${unit_id}.turnover_buffer_minutes == 45"
            - "ObstetricUnit.${unit_id}.cesarean_readiness_state == DEGRADED"
            - "Bed.${bed_ldr_1}.status == AVAILABLE"
            - "Bed.${bed_ldr_1}.held_booking_id == null"
            - "Bed.${bed_ldr_2}.status == AVAILABLE"
            - "CesareanReadinessDrill.${drill_id}.measured_d2i_minutes == 22"
            - "CesareanReadinessDrill.${drill_id}.status == VALIDATED"

  # ===========================================================================
  # RULE 4 — transitive_cascade
  # instance 1 = depth 4 (5 with the posture hop), triggered by
  #              CesareanReadinessDrill VALIDATED -> INVALIDATED
  # instance 2 = depth 3 (4 with the OR-bed hop), triggered by
  #              EmergencyCesareanEvent INCISION_RECORDED -> DELIVERED
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: drill_invalidation_cascades_currency_to_readiness_to_elective_bump_to_bed_release
        grounds:
          - state_machines.CesareanReadinessDrill.VALIDATED_to_INVALIDATED
          - state_machines.StaffMember.drill_currency_state
          - state_machines.InductionBooking.CAPACITY_HELD_to_BUMPED
          - state_machines.Bed.HELD_to_AVAILABLE
          - calculations.cesarean_readiness_derivation
          - calculations.induction_bed_minute_conservation
          - calculations.unit_posture_derivation
          - endpoints[POST /cesarean-readiness-drills/{drillId}/invalidate]
        distinguishing_aspect: |
          One PSO call to /invalidate propagates through four entity families in
          strict causal order, and NONE of the later hops is reachable from the
          trigger's own inputs — each is caused only by the state the previous
          hop wrote:
            hop 1  both drill participants lose currency (CURRENT -> LAPSED)
                   because re-deriving last_validated_drill_at over their
                   REMAINING VALIDATED drills finds none;
            hop 2  the unit loses its only current drill, so
                   cesarean_readiness_derivation returns NOT_READY with
                   readiness_reason NO_CURRENT_DRILL — a consequence of hop 1's
                   emptied drill set, not of the invalidation_reason string;
            hop 3  NOT_READY bumps ONLY the ELECTIVE_39_WEEK hold and pointedly
                   NOT the MEDICALLY_INDICATED confirmed booking sitting on the
                   next bed — the filter is priority_class, which was itself
                   derived from indication_code at booking time;
            hop 4  the bumped booking's bed goes HELD -> AVAILABLE and EXACTLY
                   its own frozen 525 minutes (480 + the 45-minute buffer in
                   force when the hold was taken) leave
                   held_bed_minutes_by_day, while the untouched booking's 645
                   committed minutes stay put.
          A further consequence lands in the same request: NOT_READY forces
          staffing_posture INDUCTION_FROZEN and turnover_buffer_minutes 75, yet
          the credit-back is 525 and not 570 — the buffer that was frozen INTO
          projected_occupancy_minutes is the old one, and the new 75 never
