        distinguishing_aspect: "Receiving a submitted PO adds qty 50 to Product.on_hand (1 -> 51) and recomputes reorder_needed false (51 > reorder_point 5)."
        test_recipe:
          setup: ["vendor + product reorder_point 5 on_hand 1 (reorder_needed true); PO qty 50 unit_cost 500 SUBMITTED"]
