          - validations[priority=2]
        distinguishing_aspect: "Authentication is screened at priority 1, ahead of the role check at 2 and the path-id check at 4: a read with neither X-User-ID nor X-User-Role returns ERR_UNAUTHENTICATED 401, not ERR_UNAUTHORIZED 403 and not a 404."
        test_recipe:
          setup:
