              payload: { legal_name: "Dunmore Vapor LLC", email: "ops@dunmore-vapor.example", tax_id_hash: "TAX-DU-0001", payout_bank_token: "BANK-DU-0001", address_fingerprint: "ADDR-DU-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 500000, external_reference: "PAYOUT-CYCLE-2026-07-H" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_rp}", reporter_type: "REGULATOR", evidence_reference: "EV-DU-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED", decision_note: "Nicotine concentration above the permitted limit for this marketplace." }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}", action_type_override: "ACCOUNT_SUSPENSION" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id }
            - call: "POST /appeals"
              payload: { enforcement_action_id: "${a1}", grounds: "The tested unit came from a batch we withdrew before the report and never listed for sale." }
              as: Seller
              as_user_id: "${s_id}"
              captures: { ap1: $.data.id }
            - call: "POST /appeals/${ap1}/start-review"
              payload: {}
              as: AppealReviewer
              as_user_id: "ar-1"
            - call: "POST /appeals/${ap1}/decide"
              payload: { outcome: "DENIED", denial_reason: "RESTRICTED_PRODUCT_RISK", rationale: "The withdrawn batch was still purchasable on the report date." }
              as: AppealReviewer
              as_user_id: "ar-1"
            - call: "POST /appeals/${ap1}/escalate"
              payload: { escalation_grounds: "Purchase logs show no orders were accepted for that batch after the withdrawal." }
              as: Seller
              as_user_id: "${s_id}"
            - call: "POST /appeals/${ap1}/escalation-decision"
              payload: { outcome: "FINAL_DENIED", denial_reason: "RESTRICTED_PRODUCT_RISK", rationale: "Two orders were fulfilled from the withdrawn batch after the stated withdrawal date." }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /disbursement-holds"
              payload: { seller_id: "${s_id}", state: "ACTIVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fh_id: "$.data[0].id", fh_amount: "$.data[0].held_amount_cents", fh_type: "$.data[0].hold_type" }
          trigger:
            - call: "POST /disbursement-holds/${fh_id}/forfeit"
              payload: { forfeited_amount_cents: 300000 }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /disbursement-holds/${fh_id}/forfeit"
              payload: { forfeited_amount_cents: 100000 }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err_repeat: $.data.error_id }
          assert:
            - "${fh_type} == FULL_HOLD and ${fh_amount} == 500000 and Seller.${s_id}.enforcement_state == BANNED"
            - "Seller.${s_id}.ban_reason == ESCALATION_EXHAUSTED and Appeal.${ap1}.state == FINAL_DENIED"
            - "DisbursementHold.${fh_id}.state == FORFEITED and forfeited_amount_cents == 300000"
            - "Seller.${s_id}.held_balance_cents == 0   # the WHOLE hold leaves held, not just the forfeited part"
            - "Seller.${s_id}.lifetime_debited_cents == 300000   # only the forfeited part is debited"
            - "Seller.${s_id}.available_balance_cents == 200000   # the residue 500000 - 300000 returns to available"
            - "Seller.${s_id}.lifetime_credited_cents == 500000"
            - "200000 + 0 == 500000 - 300000   # conserved identity holds across the only debiting operation in the domain"
            - "second forfeit attempt: 409 and ${err_repeat} == ERR_INVALID_STATE   # FORFEITED is terminal, so the identity cannot be broken by a replay"
            - "Seller.${s_id}.lifetime_debited_cents == 300000 after the replay attempt   # no double debit"
            - "Seller.${s_id}.disbursement_state == FULL_HOLD and enforcement_state == BANNED   # forfeiting money never relaxes the posture (the coupling is one-way)"
