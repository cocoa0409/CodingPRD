          assert:
            - "${exc_severity} == CRITICAL with exposure_minutes == 240 and peak_temperature_c == 5.0"
            - "trigger call 1 returns HTTP 409 with ${e_release} == ERR_EXCURSION_STATE_INVALID"
            - "after trigger call 1: ColdChainExcursion.${exc_id}.status == OPEN and SupplierLot.${lot_id}.intake_status == HELD"
            - "trigger call 2 returns HTTP 200 with ColdChainExcursion.${exc_id}.status == RESOLVED_DISPOSED and resolution == DISPOSE"
            - "after trigger call 2: SupplierLot.${lot_id}.intake_status == DISPOSED with case_slot == null and vacated_at == 2026-08-01T14:00:00Z"

      - name: excursion_dispose_writes_shrink_violation_and_reopens_posture
        claim_type: side_effect_execution
        grounds:
          - state_machines.SupplierLot.intake_status.HELD_to_DISPOSED
          - state_machines.ColdChainExcursion.OPEN_to_RESOLVED_DISPOSED
          - calculations.shrink_valuation
          - calculations.counter_posture_derivation
        distinguishing_aspect: |
          One resolve call must produce four side effects in the same response cycle: the lot
          DISPOSED with its slot vacated, a COLD_CHAIN_DISPOSAL ShrinkEvent valued at the 2.0x
          disposal factor (18650 cents, not the 15850 an implementation using factor 1.0 would
          write), a COLD_CHAIN ComplianceViolation worth 3 points, and a posture that falls
          back from RESTRICTED to OPEN because 3 points is below RESTRICT_VIOLATION_POINTS.
        test_recipe:
          setup:
            - "logical clock advanced to 2026-08-01T14:00:00Z"
            - "Atlantic Cod SupplierLot of 10.000 kg at 1700 cents/kg landed cost, cased into slot 1"
            - "one breaching reading of 6.0 C on slot 1, so the lot is HELD, one excursion is OPEN with severity MINOR, and the Counter posture is RESTRICTED"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
