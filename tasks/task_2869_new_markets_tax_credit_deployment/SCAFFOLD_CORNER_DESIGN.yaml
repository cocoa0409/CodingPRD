        distinguishing_aspect: "The 85.00 threshold is re-crossed in the UPWARD direction by a cure and the award's derived counters must reconcile back down, not merely ratchet: at_risk_qei_count returns to 0, cure_deadline_at is cleared, and a second cure on the now-COMPLIANT QEI is refused. The cure amount is sized so the recomputed ratio is exactly 85.00, the inclusive threshold."
