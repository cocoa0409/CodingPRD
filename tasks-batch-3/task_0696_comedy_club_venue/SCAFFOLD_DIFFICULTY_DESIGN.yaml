              as: Booker
              captures: { tier_id: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/publish"
              payload: {}
              as: Booker
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-f1", party_size: 1 }
              as: BoxOffice
              captures: { r1: $.data.id }
            - call: "POST /venues/${venue_id}/shows/${show_id}/cancel"
              payload: {}
              as: Booker
          trigger:
            - call: "POST /reservations"
              payload: { show_id: "${show_id}", section_id: "${section_id}", tier_id: "${tier_id}", patron_id: "patron-f2", party_size: 5 }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (state priority 6 wins over business_fiscal priority 14)"
