  - rule_id: compensating_invariant
    instances:
      - name: returning_an_award_restores_the_cap_pool_conservation_identity_with_a_live_reservation_present
        grounds:
          - calculations.cap_pool_availability
          - state_machines.VolumeCapAllocation.AWARDED_to_RETURNED
          - endpoints[POST /volume-cap-allocations/{id}/return]
          - entities.CapPool.available_cents
          - entities.CapPool.awardable_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY: volume cap cents, under the identity
          total_cap_cents == available_cents + reserved_cents + committed_cents.
          The award moves 200,000,000 from available into committed and the
          return moves it back, while a second project's PENDING request keeps
          reserved_cents pinned at a nonzero 150,000,000 the whole time - so an
          implementation that rebuilt the pool by subtracting deltas instead of
          re-deriving from the allocation set would leak the reservation into the
          available balance. awardable_cents and pool_status must also come back
          to their pre-award values.
        test_recipe:
          setup:
            - "One developer, one cap pool with base 500,000,000 and carryforward 100,000,000 so total_cap_cents is 600,000,000, and two projects PA and PB."
            - "PA files a PENDING request for 200,000,000 and PB files a PENDING request for 150,000,000, so reserved_cents is 350,000,000, committed_cents 0 and available_cents 250,000,000."
            - "PA's request is then AWARDED for 200,000,000, moving that amount from reserved into committed and leaving PB's 150,000,000 reserved."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              captures: { dev_id: $.data.id }
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000, carryforward_cents: 100000000 }
              as: HfaAllocationOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Commons", total_units: 10, total_floor_space_sqft: 8500, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 30000000, depreciable_basis_cents: 270000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /volume-cap-allocations"
              payload: { project_id: "${pa_id}", cap_pool_id: "${pool_id}", requested_amount_cents: 200000000, requested_closing_date: "2026-09-01T00:00:00Z" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { alloc_a_id: $.data.id }
            - call: "POST /volume-cap-allocations"
              payload: { project_id: "${pb_id}", cap_pool_id: "${pool_id}", requested_amount_cents: 150000000, requested_closing_date: "2026-10-01T00:00:00Z" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { alloc_b_id: $.data.id }
            - call: "GET /cap-pools/${pool_id}"
              payload: {}
              as: HfaAllocationOfficer
              captures: { pool_v1: $.data.version }
            - call: "POST /volume-cap-allocations/${alloc_a_id}/decision"
              payload: { decision: "AWARD", awarded_amount_cents: 200000000, expiry_date: "2027-06-30T00:00:00Z", expected_cap_pool_version: "${pool_v1}" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
          trigger:
            - call: "POST /volume-cap-allocations/${alloc_a_id}/return"
              payload: { return_reason: "sponsor deferred the closing to the 2027 program year" }
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "the response is HTTP 200 with VolumeCapAllocation.${alloc_a_id}.status == RETURNED, awarded_amount_cents == null, expiry_date == null and return_reason \"sponsor deferred the closing to the 2027 program year\""
            - "CapPool.${pool_id}.committed_cents == 0, reserved_cents == 150000000, available_cents == 450000000 and awardable_cents == 600000000"
            - "the identity total_cap_cents == available_cents + reserved_cents + committed_cents holds at 600000000 == 450000000 + 150000000 + 0"
            - "the same identity held before the return at 600000000 == 250000000 + 150000000 + 200000000 and before the award at 600000000 == 250000000 + 350000000 + 0"
            - "CapPool.${pool_id}.pool_status == OPEN, the value it had before the award"
            - "VolumeCapAllocation.${alloc_b_id}.status is still PENDING with requested_amount_cents 150000000 and decision_round 1"
            - "VolumeCapAllocation.${alloc_a_id}.decision_round stays 1 and decided_by_user_id stays \"hfa-alloc-1\""

      - name: redesignating_a_unit_and_reverting_it_restores_the_applicable_fraction_to_the_exact_basis_point
        grounds:
          - calculations.applicable_fraction
          - calculations.set_aside_compliance_ratio
          - endpoints[PATCH /unit-restrictions/{id}]
          - entities.Project.applicable_fraction_bps
          - entities.UnitRestriction.restricted_rent_cents
        distinguishing_aspect: |
          A DIFFERENT CONSERVED QUANTITY from the cap-pool instance: the
          project's designation counters and the two fractions behind
          applicable_fraction_bps. The reverted value 3941 is the FLOOR of
          3350*10000/8500 = 3941.17..., so the round trip only lands back on it
          if the fractions are re-derived from the full unit set rather than
          adjusted incrementally - subtracting 950 sqft and adding it back
          through two separate floor operations would drift. The unit's own
          restricted_rent_cents must also be nulled on the way out and
          recomputed to 109500 on the way back.
        test_recipe:
          setup:
            - "One developer and one project with total_units 10 and total_floor_space_sqft 8500 under MIN_40_60."
            - "Four RESTRICTED units at ami 60 with floor_space_sqft 700, 800, 900 and 950 (3350 sqft of 8500) and six MARKET units, so unit_fraction_bps is 4000, floor_space_fraction_bps is floor(3350*10000/8500) = 3941 and applicable_fraction_bps is 3941."
            - "Unit 104, the 950 sqft RESTRICTED one, is then redesignated to MARKET, which drops the fractions to 3000 and floor(2400*10000/8500) = 2823."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Commons", total_units: 10, total_floor_space_sqft: 8500, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 700, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "102", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "103", bedroom_count: 2, floor_space_sqft: 900, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "104", bedroom_count: 2, floor_space_sqft: 950, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { u104_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 860, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "202", bedroom_count: 1, floor_space_sqft: 860, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "203", bedroom_count: 1, floor_space_sqft: 860, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "204", bedroom_count: 1, floor_space_sqft: 860, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "205", bedroom_count: 1, floor_space_sqft: 860, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "206", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
