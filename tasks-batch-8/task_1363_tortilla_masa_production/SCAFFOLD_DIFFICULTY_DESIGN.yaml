  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stop_create_state_beats_business_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_ROUTE_INVALID_STATE]
          - errors[ERR_CUSTOMER_CREDIT_HOLD]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the route is already
          DISPATCHED (state) AND the customer is on credit HOLD (fiscal);
          priority 5 state wins, so the response is ERR_ROUTE_INVALID_STATE,
          not ERR_CUSTOMER_CREDIT_HOLD.
        test_recipe:
          setup:
            - "sealed pack (20 cases); customer H created GOOD then moved to HOLD"
            - "route R dispatched while a first stop was added when the customer was GOOD"
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-P1", corn_variety: "WHITE_CORN", received_kg: 5000, moisture_pct: 12.5 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
