          trigger:
            - call: "GET /films/${f2_id}"
              payload: {}
              as: FestivalProgrammer
              captures: { f2_v2: $.data.version }
            - call: "POST /festivals/${fest_id}/premiere-slots/${s2}/book"
              payload: { expected_film_version: "${f2_v2}" }
              as: FestivalProgrammer
              captures: { s2_booked: $.data.status }
            - call: "GET /films/${f2_id}"
              payload: {}
              as: FestivalProgrammer
              captures: { f2_v3: $.data.version }
            - call: "POST /festivals/${fest_id}/premiere-slots/${s3}/book"
              payload: { expected_film_version: "${f2_v3}" }
              as: FestivalProgrammer
              captures: { err: $.data.error_id }
          assert:
            - "S2 booking succeeds: PremiereSlot.${s2}.status == BOOKED (touching intervals do NOT overlap)"
            - "S3 booking rejected with error_id == ERR_VENUE_OVERLAP"
            - "PremiereSlot.${s3}.status remains HELD"

      - name: talent_travel_buffer_aggregate_capacity_semantics
        grounds:
          - calculations.talent_travel_conflict
          - errors.ERR_TRAVEL_BUFFER_VIOLATION
          - errors.ERR_WINDOW_CONFLICT
        distinguishing_aspect: |
          Different interval semantics than instance 1: not pure half-open
          overlap but an aggregate capacity rule — adjacent (gap == 0) bookings
          in the SAME city are permitted, but a positive gap < TRAVEL_BUFFER_HOURS
          in the same city is rejected. Different resource (TalentObligation
          window for the same talent_name) and different semantics (buffer
          aggregate, not pure overlap).
        test_recipe:
          setup:
            - "Film F registered; principal_cast=[Jae Park]."
            - "TalentObligation OB1 in NY 2026-12-01T10:00:00Z–2026-12-01T12:00:00Z, CONFIRMED."
          setup_api_calls:
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/talent-obligations"
              payload: { talent_name: "Jae Park", obligation_kind: "PRESS_JUNKET", window_starts_at: "2026-12-01T10:00:00Z", window_ends_at: "2026-12-01T12:00:00Z", city_code: "NY" }
              as: TalentCoordinator
              captures: { ob1: $.data.id }
            - call: "POST /films/${film_id}/talent-obligations/${ob1}/confirm"
              payload: {}
              as: TalentCoordinator
            # OB2: adjacent (gap=0), same city — should be permitted
            - call: "POST /films/${film_id}/talent-obligations"
              payload: { talent_name: "Jae Park", obligation_kind: "PHOTO_SHOOT", window_starts_at: "2026-12-01T12:00:00Z", window_ends_at: "2026-12-01T13:00:00Z", city_code: "NY" }
              as: TalentCoordinator
              captures: { ob2: $.data.id }
            # OB3: gap = 3 hours, same city — should violate travel buffer
            - call: "POST /films/${film_id}/talent-obligations"
              payload: { talent_name: "Jae Park", obligation_kind: "AWARDS_SHOW", window_starts_at: "2026-12-01T16:00:00Z", window_ends_at: "2026-12-01T18:00:00Z", city_code: "NY" }
              as: TalentCoordinator
              captures: { ob3: $.data.id }
            # OB4: gap = 3 hours, DIFFERENT city — travel buffer does not apply; but check direct overlap (none here) — should be permitted
            - call: "POST /films/${film_id}/talent-obligations"
              payload: { talent_name: "Jae Park", obligation_kind: "TRAVEL", window_starts_at: "2026-12-01T16:00:00Z", window_ends_at: "2026-12-01T18:00:00Z", city_code: "LA" }
              as: TalentCoordinator
              captures: { ob4: $.data.id }
          trigger:
            - call: "POST /films/${film_id}/talent-obligations/${ob2}/confirm"
              payload: {}
              as: TalentCoordinator
              captures: { ob2_status: $.data.status }
            - call: "POST /films/${film_id}/talent-obligations/${ob3}/confirm"
              payload: {}
              as: TalentCoordinator
              captures: { ob3_err: $.data.error_id }
            - call: "POST /films/${film_id}/talent-obligations/${ob4}/confirm"
              payload: {}
              as: TalentCoordinator
              captures: { ob4_status: $.data.status }
          assert:
            - "TalentObligation.${ob2}.status == CONFIRMED (adjacent same-city permitted)"
            - "OB3 confirm rejected with error_id == ERR_TRAVEL_BUFFER_VIOLATION (gap=3h < 6h, same city)"
            - "TalentObligation.${ob3}.status remains REQUESTED"
            - "TalentObligation.${ob3}.conflicts_with_obligation_id != null"
            - "TalentObligation.${ob4}.status == CONFIRMED (different-city, buffer rule does not apply)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: campaign_spend_then_waive_leaves_budget_conserved
        grounds:
          - calculations.deal_pa_reconciliation
          - entities.AwardsCampaign.fields.budget_remaining_cents
          - state_machines.TalentObligation.CONFIRMED_to_WAIVED
        distinguishing_aspect: |
          Conserved quantity: AwardsCampaign.budget_remaining_cents. A spend
          (forward action) decreases budget_remaining; the matching waive
          (compensating action) leaves budget unchanged from the post-spend value
          (waive is on TalentObligation, NOT a refund). Invariant: budget_remaining
          at any moment == budget_total_cents - sum(amount_cents of all spends),
          regardless of obligation lifecycle activity.
        test_recipe:
          setup:
            - "Acquired film with premiere booked; OSCARS campaign ACTIVE with budget 1000000; one TalentObligation CONFIRMED."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 5000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v2: $.data.version }
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v2}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
            - call: "POST /festivals"
              payload: { code: "SUNDANCE", name: "Sundance", start_date: "2027-01-21T00:00:00Z", end_date: "2027-01-31T00:00:00Z", prestige_tier: "A_LIST", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots"
              payload: { section: "COMPETITION", screening_starts_at: "2027-01-22T20:00:00Z", screening_ends_at: "2027-01-22T22:00:00Z", review_embargo_lifts_at: "2027-01-23T08:00:00Z" }
              as: FestivalProgrammer
              captures: { slot_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/hold"
              payload: { film_id: "${film_id}" }
              as: FestivalProgrammer
            - call: "GET /films/${film_id}"
              payload: {}
              as: FestivalProgrammer
              captures: { film_v3: $.data.version }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/book"
              payload: { expected_film_version: "${film_v3}" }
              as: FestivalProgrammer
            - call: "POST /films/${film_id}/awards-campaigns"
              payload: { deal_id: "${deal_id}", awards_body: "OSCARS", target_categories: ["BEST_PICTURE"], budget_total_cents: 1000000 }
              as: AwardsStrategist
              captures: { campaign_id: $.data.id }
            - call: "POST /films/${film_id}/awards-campaigns/${campaign_id}/activate"
              payload: {}
              as: AwardsStrategist
            - call: "POST /films/${film_id}/talent-obligations"
              payload: { talent_name: "Jae Park", obligation_kind: "PRESS_JUNKET", window_starts_at: "2026-12-01T10:00:00Z", window_ends_at: "2026-12-01T12:00:00Z", city_code: "NY", campaign_id: "${campaign_id}" }
              as: TalentCoordinator
              captures: { ob1: $.data.id }
            - call: "POST /films/${film_id}/talent-obligations/${ob1}/confirm"
              payload: {}
              as: TalentCoordinator
          trigger:
            - call: "POST /awards-campaigns/${campaign_id}/spends"
              payload: { category: "PUBLICITY", amount_cents: 300000, incurred_at: "2026-10-01T00:00:00Z", target_category: "BEST_PICTURE" }
              as: AwardsStrategist
            - call: "GET /awards-campaigns/${campaign_id}"
              payload: {}
              as: AwardsStrategist
              captures: { remaining_after_spend: $.data.budget_remaining_cents }
            - call: "POST /films/${film_id}/talent-obligations/${ob1}/waive"
              payload: {}
              as: AwardsStrategist
            - call: "GET /awards-campaigns/${campaign_id}"
              payload: {}
              as: AwardsStrategist
              captures: { remaining_after_waive: $.data.budget_remaining_cents }
          assert:
            - "AwardsCampaign.${campaign_id}.budget_remaining_cents after spend == 700000"
            - "AwardsCampaign.${campaign_id}.budget_remaining_cents after waive == 700000 (waive does not refund)"
            - "budget_remaining_cents + sum(spend amounts) == budget_total_cents (1000000) at all times"
            - "TalentObligation.${ob1}.status == WAIVED"

      - name: offer_counter_then_withdraw_leaves_open_offer_count_conserved
        grounds:
          - state_machines.AcquisitionOffer.OPEN_to_COUNTERED
          - state_machines.AcquisitionOffer.OPEN_to_WITHDRAWN
          - state_machines.Film.acquisition_status_UNDER_NEGOTIATION_to_SHOPPING
        distinguishing_aspect: |
          Different conserved quantity: count of OPEN offers on a film and the
          film's negotiation status. Counter-then-withdraw is compensating on the
          OPEN-offer pool: counter preserves the count (one COUNTERED out, one
          OPEN in), withdraw decrements it. When the count reaches zero with no
          accepted deal, Film.acquisition_status deterministically reverts to
          SHOPPING — the system state is identical to never having negotiated.
        test_recipe:
          setup:
            - "Film F registered SHOPPING. Territory US."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 5000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /films/${film_id}/offers/${o1}/counter"
              payload: { buyer_code: "A24", upfront_price_cents: 6000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 8000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { o2: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { status_mid: $.data.acquisition_status }
            - call: "POST /films/${film_id}/offers/${o2}/withdraw"
              payload: {}
              as: AcquisitionExec
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { status_end: $.data.acquisition_status }
            - call: "GET /films/${film_id}/offers"
              payload: { status: "OPEN" }
              as: AcquisitionExec
          assert:
            - "After counter, count of OPEN offers == 1 (o2), count of COUNTERED == 1 (o1)"
            - "Film.${film_id}.acquisition_status after counter == UNDER_NEGOTIATION"
            - "After withdraw, count of OPEN offers == 0"
            - "Film.${film_id}.acquisition_status after withdraw == SHOPPING (conserved: same as initial state)"
            - "No AcquisitionDeal exists for film (GET /films/${film_id}/deals returns 0 rows)"
