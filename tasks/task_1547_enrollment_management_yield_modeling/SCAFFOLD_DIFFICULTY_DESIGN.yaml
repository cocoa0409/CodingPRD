# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 Difficulty Rules x 2 instances each = 18 instances.
# Every test_recipe replays from empty-DB using only SCAFFOLD.yaml §1.5 calls.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: yield_forecast_aid_adjusted_lifts_projection
        grounds:
          - calculations.yield_forecast
          - calculations.aid_leveraging_award
          - entities.AdmissionCycle.fields.admit_rate
        distinguishing_aspect: |
          Same three ADMITTED applications at the same clock: historical_band sums
          band probabilities 0.65+0.45+0.25 -> projected_enrollment 1, while
          aid_adjusted scales the score-92 applicant by (1 + 0.5 aid coverage) to
          0.975 -> sum 1.675 -> projected_enrollment 2. Cycle-level forecast
          (AdmissionCycle domain), distinct from the application-level melt risk.
        test_recipe:
          setup:
            - "Cycle OPEN with one program (capacity 10, target 5, tuition 5000000, budget 10000000)"
            - "Three admitted applications with academic_score 92, 85, 60; the score-92 applicant holds an ACCEPTED MERIT offer of 2500000 (coverage 0.5)"
            - "No deposits, no enrollments"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "CS", capacity_seats: 10, target_enrollment: 5, tuition_cents: 5000000, scholarship_budget_cents: 10000000, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "A One", email: "a1@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap1_id: $.data.id }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "A Two", email: "a2@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap2_id: $.data.id }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "A Three", email: "a3@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap3_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap1_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 92, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app1_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap2_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 85, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app2_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap3_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 60, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app3_id: $.data.id }
            # --- admit app1 (score 92) ---
            - { call: "POST /enrollment/applications/${app1_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app1_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r1a_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r1a_id}/submit", payload: { score_academic: 90, score_fit: 90, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app1_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r1b_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r1b_id}/submit", payload: { score_academic: 90, score_fit: 90, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app1_id}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/applications/${app1_id}/transition"
              payload: { to_status: "ADMITTED" }
              as: AdmissionsOfficer
              captures: { app1_v: $.data.version }
            # --- aid: MERIT offer 2500000, accepted ---
            - call: "POST /enrollment/aid-offers"
              payload: { application_id: "${app1_id}", fund_type: "MERIT", expected_application_version: "${app1_v}" }
              as: FinancialAidOfficer
              captures: { offer1_id: $.data.id }
            - { call: "POST /enrollment/aid-offers/${offer1_id}/transition", payload: { to_status: "ACCEPTED" }, as: Applicant, as_user_id: "${ap1_id}" }
            # --- admit app2 (score 85) ---
            - { call: "POST /enrollment/applications/${app2_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app2_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r2a_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r2a_id}/submit", payload: { score_academic: 85, score_fit: 85, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app2_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r2b_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r2b_id}/submit", payload: { score_academic: 85, score_fit: 85, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app2_id}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications/${app2_id}/transition", payload: { to_status: "ADMITTED" }, as: AdmissionsOfficer }
            # --- admit app3 (score 60) ---
            - { call: "POST /enrollment/applications/${app3_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app3_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r3a_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r3a_id}/submit", payload: { score_academic: 60, score_fit: 60, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app3_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r3b_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r3b_id}/submit", payload: { score_academic: 60, score_fit: 60, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app3_id}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications/${app3_id}/transition", payload: { to_status: "ADMITTED" }, as: AdmissionsOfficer }
          trigger:
            - call: "GET /enrollment/cycles/${c_id}/forecast?variant=historical_band"
              payload: {}
              as: EnrollmentManager
              captures: { proj_hist: $.data.projected_enrollment }
            - call: "GET /enrollment/cycles/${c_id}/forecast?variant=aid_adjusted"
              payload: {}
              as: EnrollmentManager
              captures: { proj_aid: $.data.projected_enrollment }
          assert:
            - "GET forecast?variant=historical_band returns projected_enrollment == 1 (round_half_up of 0.65+0.45+0.25 = 1.35)"
            - "GET forecast?variant=aid_adjusted returns projected_enrollment == 2 (round_half_up of 0.975+0.45+0.25 = 1.675)"
            - "${proj_hist} != ${proj_aid} — identical pipeline, aid leveraging changes the projection"

      - name: melt_risk_summer_window_variant_diverges
        grounds:
          - calculations.melt_risk_score
          - entities.Application.fields.melt_risk_score
        distinguishing_aspect: |
          Same DEPOSITED application, same underlying fields: at clock
          2027-04-01 (before deposit_deadline) the standard variant yields
          0.6000; at clock 2027-05-16 (after deposit_deadline) the
          summer_window variant drops the distance factor and rebalances
          weights, yielding 1.0000 where standard weights would give 0.7500.
          Application-level risk scoring, distinct from cycle-level yield.
        test_recipe:
          setup:
            - "Cycle with program (capacity 3, target 2, tuition 5000000, budget 0, deposit 50000), advanced to DECISIONS_RELEASED"
            - "One admitted application (score 85, LOCAL distance_band, no aid), deposit paid at clock 2027-04-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "BIO", capacity_seats: 3, target_enrollment: 2, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "M One", email: "m1@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "COLLEGE_FAIR", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 85, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r1_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r1_id}/submit", payload: { score_academic: 85, score_fit: 85, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r2_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r2_id}/submit", payload: { score_academic: 85, score_fit: 85, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "ADMITTED" }, as: AdmissionsOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "REVIEW_CLOSED" }, as: EnrollmentManager }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "DECISIONS_RELEASED" }, as: EnrollmentManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/deposits"
              payload: { application_id: "${app_id}", amount_cents: 50000 }
              as: Applicant
              as_user_id: "${ap_id}"
              captures: { dep_id: $.data.id }
            - call: "GET /enrollment/applications/${app_id}"
              payload: {}
              as: EnrollmentManager
              captures: { risk_standard: $.data.melt_risk_score }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-05-16T00:00:00Z" }, as: SystemAdmin }
            - call: "GET /enrollment/applications/${app_id}"
              payload: {}
              as: EnrollmentManager
              captures: { risk_summer: $.data.melt_risk_score }
            - call: "GET /enrollment/interventions?application_id=${app_id}"
              payload: {}
              as: EnrollmentManager
          assert:
            - "At 2027-04-01 (standard variant): melt_risk_score == 0.6000 (0.40*1 + 0.25*0 + 0.20*1 + 0.15*0)"
            - "No MeltIntervention exists at 2027-04-01 (0.6000 < 0.70)"
            - "At 2027-05-16 (summer_window variant): melt_risk_score == 1.0000 (0.50*1 + 0.30*1 + 0.20*1); standard weights at the same clock would give 0.7500"
            - "${risk_standard} != ${risk_summer}"
            - "Exactly one MeltIntervention with trigger_source == AUTO_THRESHOLD and status == SCHEDULED exists after the 2027-05-16 clock set (1.0000 >= 0.70)"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: aid_award_need_based_budget_capped_branch
        grounds:
          - calculations.aid_leveraging_award
          - entities.AidOffer.fields.amount_cents
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with nested min/max and fund-type-conditional
          tier selection: need_base = max(0, 5000000-1200000) = 3800000, capped
          by min(need_base, 0.60*tuition = 3000000) and NEED_MAX_CENTS 3000000,
          then capped again by remaining budget 2000000 -> award 2000000.
        test_recipe:
          setup:
            - "Cycle OPEN; program tuition 5000000, scholarship_budget_cents 2000000, capacity 5, target 3"
            - "One ADMITTED application with academic_score 75 and efc_cents 1200000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "ECO", capacity_seats: 5, target_enrollment: 3, tuition_cents: 5000000, scholarship_budget_cents: 2000000, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "N One", email: "n1@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "REGIONAL" }
              as: AdmissionsOfficer
              captures: { ap_id: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 75, efc_cents: 1200000 }
              as: AdmissionsOfficer
              captures: { app_id: $.data.id }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r1_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r1_id}/submit", payload: { score_academic: 75, score_fit: 75, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_id}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-01-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { r2_id: $.data.id }
            - { call: "POST /enrollment/reviews/${r2_id}/submit", payload: { score_academic: 75, score_fit: 75, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_id}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/applications/${app_id}/transition"
              payload: { to_status: "ADMITTED" }
              as: AdmissionsOfficer
              captures: { app_v: $.data.version }
          trigger:
            - call: "POST /enrollment/aid-offers"
              payload: { application_id: "${app_id}", fund_type: "NEED_BASED", expected_application_version: "${app_v}" }
              as: FinancialAidOfficer
              captures: { offer_id: $.data.id, offer_amt: $.data.amount_cents }
          assert:
            - "AidOffer.amount_cents == 2000000 (base min(3800000, 3000000, 3000000) = 3000000, then budget-capped to available 2000000)"
            - "Program.scholarship_committed_cents == 2000000 and scholarship_available_cents == 0 after the create"

      - name: funnel_overall_rate_rounded_once_not_averaged
        grounds:
          - calculations.funnel_conversion_report
          - entities.Applicant.fields.funnel_stage
        distinguishing_aspect: |
          Mode (b) — nested rounding order: per-source rates round individually
          (1/6 -> 0.1667, 1/3 -> 0.3333), but the overall rate is computed from
          unrounded totals and rounded ONCE: 2/9 -> 0.2222, NOT the average of
          rounded per-source rates (0.2500). Different mode from instance
          aid_award_need_based_budget_capped_branch (mode a).
        test_recipe:
          setup:
            - "Cycle OPEN; 6 PURCHASED_LIST inquiries (1 applies) and 3 WEB_FORM inquiries (1 applies)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "HIS", capacity_seats: 10, target_enrollment: 5, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            # --- 6 PURCHASED_LIST inquiries; first one applies ---
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "P 1", email: "p1@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "PURCHASED_LIST", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { pl1_id: $.data.id }
            - { call: "POST /enrollment/applicants", payload: { cycle_id: "${c_id}", full_name: "P 2", email: "p2@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "PURCHASED_LIST", distance_band: "LOCAL" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applicants", payload: { cycle_id: "${c_id}", full_name: "P 3", email: "p3@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "PURCHASED_LIST", distance_band: "LOCAL" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applicants", payload: { cycle_id: "${c_id}", full_name: "P 4", email: "p4@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "PURCHASED_LIST", distance_band: "LOCAL" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applicants", payload: { cycle_id: "${c_id}", full_name: "P 5", email: "p5@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "PURCHASED_LIST", distance_band: "LOCAL" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applicants", payload: { cycle_id: "${c_id}", full_name: "P 6", email: "p6@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "PURCHASED_LIST", distance_band: "LOCAL" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications", payload: { applicant_id: "${pl1_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 80, efc_cents: 5000000 }, as: AdmissionsOfficer }
            # --- 3 WEB_FORM inquiries; first one applies ---
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "W 1", email: "w1@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { wf1_id: $.data.id }
            - { call: "POST /enrollment/applicants", payload: { cycle_id: "${c_id}", full_name: "W 2", email: "w2@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applicants", payload: { cycle_id: "${c_id}", full_name: "W 3", email: "w3@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications", payload: { applicant_id: "${wf1_id}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 80, efc_cents: 5000000 }, as: AdmissionsOfficer }
          trigger:
            - call: "GET /enrollment/cycles/${c_id}/funnel-report"
              payload: {}
