  - rule_id: non_linear_state_machine
    instances:

      - name: readiness_reverts_to_auth_cleared_while_schedule_advances_to_checked_in
        grounds:
          - state_machines.Appointment.readiness_status.transitions.FULLY_CLEARED_to_AUTH_CLEARED
          - state_machines.Appointment.schedule_status.transitions.CONFIRMED_to_CHECKED_IN
          - calculations.lab_gate_evaluation
          - validations.priority_72
        distinguishing_aspect: |
          Non-monotonic parallel dimension: readiness_status goes BACKWARDS
          (FULLY_CLEARED -> AUTH_CLEARED) with no request at all — a pure clock advance
          ages the lab draw past lab_validity_hours — while schedule_status keeps moving
          FORWARDS (CONFIRMED -> CHECKED_IN) in the same instant. A linear-progress
          implementation that latches readiness at its high-water mark lets start-infusion
          through instead of returning ERR_LAB_RESULT_STALE.
        test_recipe:
          setup:
            - "Logical clock 2026-08-09T07:00:00Z; center lab_validity_hours 72."
            - "Drug One requires a lab gate with lab_min_anc 1.5 and lab_min_platelets 100."
            - "A ROUTINE visit for Patient One on 2026-08-10 at start_minute 540."
            - "A RESULTED draw collected 2026-08-07T07:00:00Z with anc 2.0 and platelets 150 — 48 hours old at setup time, so the gate passes and readiness_status becomes LAB_CLEARED."
            - "The authorization is then filed, submitted and APPROVED, which with lab_ok already holding drives readiness_status to FULLY_CLEARED, and the visit is confirmed."
            - "The clock is then moved to 2026-08-10T08:00:00Z, at which point the same draw is 73 hours old — one hour past the 72-hour validity edge."
