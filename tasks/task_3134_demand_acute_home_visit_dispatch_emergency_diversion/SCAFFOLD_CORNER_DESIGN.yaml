              captures: { vr_id: $.data.id, vr_v0: $.data.version }
            - call: "POST /dh/visit-requests/${vr_id}/triage-assessments"
              payload: { heart_rate: 130, systolic_bp: 95, spo2_pct: 92, is_chest_pain: false, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_id: $.data.id }
            - call: "POST /dh/triage-assessments/${trg_id}/submit"
              payload: { outcome: "APPROPRIATE" }
              as: TriageNurse
            - call: "POST /dh/visit-requests/${vr_id}/dispatch-offers"
              payload: { expected_visit_request_version: "${vr_v0}" }
              as: Dispatcher
              captures: { da_id: $.data.id }
            - call: "POST /dh/dispatch-assignments/${da_id}/accept"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-I2"
            - call: "POST /dh/dispatch-assignments/${da_id}/arrive"
              payload: {}
              as: CareTeamMember
              as_user_id: "app-I2"
              captures: { enc_id: $.data.id }
            - call: "POST /dh/encounters/${enc_id}/diagnostic-orders"
              payload: { order_kind: "IV_INFUSION", code: "IVF-NS-1L", units: 1 }
              as: AdvancedPracticeProvider
              captures: { ord_id: $.data.id }
            - call: "POST /dh/diagnostic-orders/${ord_id}/collect"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-I2"
            - call: "POST /dh/diagnostic-orders/${ord_id}/result"
              payload: { result_value: "done" }
              as: FieldTechnician
              as_user_id: "tech-I2"
          trigger:
            # SupervisingPhysician role with X-User-ID == tech-I2 (the result actor) — SoD violation
            - call: "POST /dh/diagnostic-orders/${ord_id}/verify"
              payload: {}
              as: SupervisingPhysician
              as_user_id: "tech-I2"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 403 and error_id == ERR_SOD_VIOLATION"
            - "DiagnosticOrder.${ord_id}.status == RESULTED (unchanged)"
            - "A subsequent verify with as_user_id='md-I2' succeeds and transitions to VERIFIED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: optimistic_concurrency_stale_version_on_dispatch
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispatch-offer-stale-visit-version]
        distinguishing_aspect: "OCC via expected_visit_request_version: a stale value on dispatch-offer returns 412 ERR_STALE_VERSION."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_safety_on_dispatch_offer
          rationale: "OCC check is exercised by §1.9 validations/occ_stale_version_on_dispatch_offer (the cross_entity_validation instance); §1.8 priority-pair instance exercises the state-vs-safety ordering."

      - name: cascading_side_effects_full_chain_on_disposition
        claim_type: cascading_side_effects
        grounds:
          - state_machines.VisitRequest.ON_SCENE_to_DISPOSITIONED
        distinguishing_aspect: "Encounter disposition cascades: Claim auto-create, MonitoringCheckIn schedule init, CareTeam counter decrement, DispatchAssignment completion."
        excluded_because:
          difficulty_instance: transitive_cascade / monitoring_checkin_emergent_spawns_new_visit_cascade
          rationale: "§1.9 state_machines/encounter_cascade_creates_claim_and_monitoring_checkins asserts the full chain."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_on_response
        claim_type: consistency_immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "All changes are visible in the same response: dispatch-offer response carries the new VisitRequest.status == DISPATCH_PENDING and bumped version."
        test_recipe:
          setup: ["Visit in TRIAGED with full team+shift."]
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/patients"
              payload: { full_name: "Jon J", date_of_birth: "1980-01-01", payer_code: "AETNA", member_id: "M20000", pcp_name: "Dr. X", pcp_npi: "9999999999", comorbidity_count: 1, home_address_geo: "{\"type\":\"Point\",\"coordinates\":[-97.0,33.0]}" }
              as: TriageNurse
              captures: { patient_id: $.data.id }
            - call: "POST /dh/care-teams"
              payload: { market_id: "${mkt_id}", app_user_id: "app-J2", tech_user_id: "tech-J2", supervising_physician_user_id: "md-J2", skill_tags: ["POCT"] }
              as: Dispatcher
              captures: { team_id: $.data.id }
            - call: "POST /dh/care-teams/${team_id}/go-available"
              payload: {}
              as: Dispatcher
            - call: "POST /dh/vehicle-shifts"
              payload: { care_team_id: "${team_id}", market_id: "${mkt_id}", vehicle_plate: "TX-J2", window_start: "2026-09-15T08:00:00Z", window_end: "2026-09-15T20:00:00Z" }
              as: Dispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /dh/vehicle-shifts/${shift_id}/start"
              payload: {}
              as: Dispatcher
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "fever" }
              as: TriageNurse
              captures: { vr_id: $.data.id, vr_v0: $.data.version }
            - call: "POST /dh/visit-requests/${vr_id}/triage-assessments"
              payload: { heart_rate: 130, systolic_bp: 95, spo2_pct: 92, is_chest_pain: false, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
              as: TriageNurse
              captures: { trg_id: $.data.id }
            - call: "POST /dh/triage-assessments/${trg_id}/submit"
              payload: { outcome: "APPROPRIATE" }
              as: TriageNurse
          trigger:
            - call: "POST /dh/visit-requests/${vr_id}/dispatch-offers"
              payload: { expected_visit_request_version: "${vr_v0}" }
              as: Dispatcher
              captures: { da_id: $.data.id, da_status: $.data.status, da_version: $.data.version }
            - call: "GET /dh/visit-requests/${vr_id}"
              payload: {}
              as: Dispatcher
              captures: { vr_status_after: $.data.status, vr_version_after: $.data.version }
          assert:
            - "da_status == OFFERED and da_version == 1 (visible in same response)"
            - "vr_status_after == DISPATCH_PENDING (immediate consistency on read)"
            - "vr_version_after == ${vr_v0} + 1"
