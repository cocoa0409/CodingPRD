          assert:
            - "trigger[0] does not violate priority 64: its window opens at 2026-08-05T20:00:00Z, four hours after S1's buffered edge of 2026-08-05T16:00:00Z"
            - "trigger[0] HTTP status == 422"
            - "trigger[0] response error_id == ERR_VEHICLE_CAPACITY_EXCEEDED"
