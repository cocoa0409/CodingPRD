scenario: |
  Generate task harder than expert level!

  2660. Firm Quality Control & Peer Review (public accounting firm quality management): system of quality
  management design with risk assessment and responses across engagement performance, acceptance and human
  resources, engagement quality review assignment criteria and objectivity requirements, internal inspection
  program with engagement selection and finding classification, root cause analysis of deficiencies and
  remediation plan development, peer review scheduling with reviewer selection, independence and scope
  determination, engagement selection by the peer reviewer with must-select categories, report rating outcomes
  with pass, pass with deficiency or fail and corrective action requirements, remediation acceptance and
  follow-up review triggers

domain_name: firm-quality-control-peer-review

# Flat multi-root API: Firm, Engagement, QualityReview, Inspection, Finding, RemediationPlan,
# PeerReviewer and PeerReview are peer top-level collections linked by foreign keys, so the API
# has no single shared path prefix. `/` is the effective prefix for every declared path.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - selector_policy

  entity_topology: graph
  # Junction entities (InspectionSelection, PeerReviewSelection) make Engagement<->Inspection and
  # Engagement<->PeerReview many-to-many; PeerReview.prior_peer_review_id is self-referential;
  # QualityRisk/Finding/RemediationPlan form a cross-aggregate cycle back onto Firm.risk_posture.

  state_machine_shape: cyclic
  # Engagement carries two independent state dimensions (workflow_state x file_state) and a
  # EQR_PENDING -> FIELDWORK revert cycle; EngagementQualityReview, InspectionFinding,
  # QualityRisk and RemediationPlan all cycle; PeerReview forks on rating outcome and re-joins.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # An engagement partner may never quality-review their own engagement, may never author an
  # inspection finding on their own engagement, and the owner of a remediation plan may never be
  # the partner who accepts it. External peer review adds a second, independent party.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities, 8 state machines, 12 calculations, 60 endpoints, 45 error codes, 7 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Firm
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered name of the public accounting firm.
        constraints: "1..200 chars; unique across Firm"
      - name: state_code
        type: string
        source: input
        description: Two-letter licensing state of the firm's main office.
        constraints: "exactly 2 uppercase letters"
      - name: aa_hours_last_year
        type: integer
        source: input
        description: Accounting-and-auditing hours the firm billed in the prior calendar year; drives the peer review base-hours tier.
        constraints: ">= 0"
      - name: enrolled_program
        type: enum
        source: input
        description: Peer review program the firm is enrolled in.
        default: AICPA_PRC
        constraints: "AICPA_PRC | STATE_BOARD"
      - name: peer_review_year_end
        type: string
        source: input
        description: Year-end date (YYYY-MM-DD) the firm's peer reviews are scheduled against.
      - name: risk_posture
        type: enum
        source: computed
        description: Derived firm-level posture that gates client acceptance and forces engagement quality reviews. Recomputed by calculations.firm_risk_posture.
        default: STABLE
        constraints: "STABLE | ELEVATED | CRITICAL"
      - name: open_deficiency_count
        type: integer
        source: computed
        description: Conserved count of the firm's InspectionFinding rows with classification IN {DEFICIENCY, SIGNIFICANT_DEFICIENCY, MATERIAL_FAILURE} and state NOT IN {VERIFIED, WITHDRAWN}.
        default: 0
      - name: open_material_failure_count
        type: integer
        source: computed
        description: Count of the firm's InspectionFinding rows with classification == MATERIAL_FAILURE and state NOT IN {VERIFIED, WITHDRAWN}.
        default: 0
      - name: critical_risk_count
        type: integer
        source: computed
        description: Count of the firm's QualityRisk rows with state == EVALUATED and severity_band == CRITICAL.
        default: 0
      - name: last_peer_review_rating
        type: enum
        source: computed
        description: Rating of the firm's most recent PeerReview whose state IN {ACCEPTED, FOLLOW_UP_REQUIRED}, ordered by report_issued_at DESC then created_at DESC.
        default: NONE
        constraints: "NONE | PASS | PASS_WITH_DEFICIENCY | FAIL"
      - name: prior_reviewer_ids
        type: array
        source: computed
        description: "Ids of the PeerReviewer who performed the firm's last three PeerReview rows in state ACCEPTED or FOLLOW_UP_REQUIRED, newest first. Membership test only (rotation exclusion); never used for ordering, ranking or tie-break."
        default: []
      - name: unassigned_review_flag
        type: boolean
        source: computed
        description: Set true when a reviewer-assignment attempt found an empty eligible pool; cleared when a reviewer is assigned.
        default: false

  - name: Partner
    parent: Firm
    common_fields: true
    kind: resource
    fields:
      - name: firm_id
        type: string
        source: input
        description: FK -> Firm.id; the firm this partner belongs to.
      - name: full_name
        type: string
        source: input
        description: Partner's full name.
        constraints: "1..120 chars"
      - name: cpa_license_state
        type: string
        source: input
        description: Two-letter state that issued the partner's CPA license.
        constraints: "exactly 2 uppercase letters"
      - name: designations
        type: array
        source: input
        description: "Duty designations held by the partner; each element in {MANAGING_PARTNER, ENGAGEMENT_PARTNER, QC_DIRECTOR, EQ_REVIEWER}."
        default: []
      - name: industry_specializations
        type: array
        source: input
        description: "Industry specializations; each element in {EBP, GOVERNMENT, BROKER_DEALER, NONPROFIT, MANUFACTURING}."
        default: []
      - name: cpe_hours_last_3y
        type: integer
        source: input
        description: Continuing-education hours completed in the trailing three years; the EQ-reviewer eligibility gate is >= 120.
        default: 0
        constraints: ">= 0"
      - name: prior_engagement_team_clients
        type: array
        source: input
        description: "Cooling-off history; each element is an object { client_name: string, exit_date: 'YYYY-MM-DD' } recording when the partner left that client's engagement team."
        default: []
      - name: independence_conflict_client_names
        type: array
        source: input
        description: Client names against which the partner has a declared independence conflict; blocks EQ-reviewer assignment.
        default: []
      - name: status
        type: enum
        source: input
        description: Employment status of the partner.
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE"
      - name: open_eqr_count
        type: integer
        source: computed
        description: Count of EngagementQualityReview rows with reviewer_partner_id == this partner and state IN {ASSIGNED, IN_PROGRESS, CONCERNS_RAISED}.
        default: 0
      - name: open_engagement_count
        type: integer
        source: computed
        description: Count of Engagement rows with engagement_partner_id == this partner and workflow_state IN {PLANNING, FIELDWORK, EQR_PENDING, EQR_CLEARED}.
        default: 0
      - name: last_inspected_year
        type: integer
        source: computed
        description: Highest InternalInspection.inspection_year in which an Engagement of this partner was selected; null when never selected.
        default: null
      - name: eqr_eligible
        type: boolean
        source: computed
        description: True when status == ACTIVE AND cpe_hours_last_3y >= 120 AND designations contains EQ_REVIEWER.
        default: false

  - name: Engagement
    parent: Firm
    common_fields: true
    kind: resource
    fields:
      - name: firm_id
        type: string
        source: input
        description: FK -> Firm.id; owning firm.
      - name: client_name
        type: string
        source: input
        description: Name of the audit/attest client.
        constraints: "1..200 chars; unique per (firm_id, client_name, period_end)"
      - name: engagement_type
        type: enum
        source: input
        description: Service type performed.
        constraints: "AUDIT | REVIEW | ATTESTATION | ERISA_AUDIT | SINGLE_AUDIT | BROKER_DEALER"
      - name: period_end
        type: string
        source: input
        description: Client fiscal period end (YYYY-MM-DD); anchors inspection windows and cooling-off arithmetic.
      - name: is_public_interest
        type: boolean
        source: input
        description: True when the client is a public-interest entity.
        default: false
      - name: is_first_year_client
        type: boolean
        source: input
        description: True when this is the firm's first engagement for the client.
        default: false
      - name: prior_finding_count_3y
        type: integer
        source: input
        description: Number of inspection or peer review findings recorded against this client engagement in the trailing three years.
        default: 0
        constraints: ">= 0"
      - name: engagement_partner_id
        type: string
        source: input
        description: FK -> Partner.id; partner with final responsibility for the engagement.
      - name: risk_score
        type: integer
        source: computed
        description: Engagement risk score 0..100 produced by calculations.engagement_risk_score at creation.
        default: 0
      - name: eqr_required
        type: boolean
        source: computed
        description: True when calculations.eqr_required_determination holds; an engagement with eqr_required true cannot reach EQR_CLEARED without a CONCURRED EngagementQualityReview.
        default: false
      - name: workflow_state
        type: enum
        source: system
        description: "Engagement performance dimension; evolves independently of file_state."
        default: PLANNING
        constraints: "PLANNING | FIELDWORK | EQR_PENDING | EQR_CLEARED | REPORT_RELEASED"
      - name: file_state
        type: enum
        source: system
        description: "Documentation-assembly dimension; evolves independently of workflow_state."
        default: OPEN
        constraints: "OPEN | ASSEMBLED | LOCKED"
      - name: eqr_concurred_at
        type: datetime
        source: system
        description: Logical-clock instant at which the engagement's EngagementQualityReview reached CONCURRED; null until then.
        default: null
      - name: report_release_date
        type: string
        source: system
        description: Logical-clock date (YYYY-MM-DD) on which the report was released; null until REPORT_RELEASED.
        default: null
      - name: reopened_count
        type: integer
        source: computed
        description: Number of times file_state was driven LOCKED -> OPEN by a MATERIAL_FAILURE finding cascade.
        default: 0

  - name: QualityRisk
    parent: Firm
    common_fields: true
    kind: resource
    fields:
      - name: firm_id
        type: string
        source: input
        description: FK -> Firm.id; firm whose system of quality management this risk belongs to.
      - name: component
        type: enum
        source: input
        description: SQM component the quality objective sits in.
        constraints: "GOVERNANCE_LEADERSHIP | ETHICAL_REQUIREMENTS | ACCEPTANCE_CONTINUANCE | ENGAGEMENT_PERFORMANCE | RESOURCES | INFORMATION_COMMUNICATION | MONITORING_REMEDIATION"
      - name: quality_objective_code
        type: string
        source: input
        description: Firm-assigned quality objective identifier.
        constraints: "1..40 chars; unique per (firm_id, component, quality_objective_code)"
      - name: risk_statement
        type: string
        source: input
        description: Narrative of the quality risk.
        constraints: "1..500 chars"
      - name: likelihood
        type: integer
        source: input
        description: Assessed likelihood.
        constraints: "1..5"
      - name: impact
        type: integer
        source: input
        description: Assessed impact.
        constraints: "1..5"
      - name: inherent_risk_score
        type: integer
        source: computed
        description: likelihood * impact, range 1..25; recomputed on ASSESSED.
        default: 0
      - name: evaluation_basis
        type: enum
        source: system
        description: Which residual-risk variant produced residual_risk_score.
        default: NONE
        constraints: "NONE | DESIGN_BASIS | OPERATING_BASIS"
      - name: residual_risk_score
        type: number
        source: computed
        description: Residual risk from calculations.residual_risk_score under evaluation_basis; two decimals.
        default: null
      - name: severity_band
        type: enum
        source: computed
        description: Band of residual_risk_score per calculations.residual_risk_score.
        default: NONE
        constraints: "NONE | LOW | MODERATE | HIGH | CRITICAL"
      - name: state
        type: enum
        source: system
        description: SQM risk-assessment lifecycle state.
        default: DRAFT
        constraints: "DRAFT | ASSESSED | RESPONDED | EVALUATED"
      - name: response_count
        type: integer
        source: computed
        description: Count of RiskResponse rows with quality_risk_id == this risk and status IN {DESIGNED, TESTED}.
        default: 0
      - name: reopen_count
        type: integer
        source: computed
        description: Number of times the risk was driven EVALUATED -> RESPONDED by a finding cascade on the same component.
        default: 0

  - name: RiskResponse
    parent: QualityRisk
    common_fields: true
    kind: resource
    fields:
      - name: quality_risk_id
        type: string
        source: input
        description: FK -> QualityRisk.id; risk this response addresses.
      - name: response_type
        type: enum
        source: input
        description: Whether the response prevents or detects the quality risk.
        constraints: "PREVENTIVE | DETECTIVE"
      - name: description
        type: string
        source: input
        description: Narrative of the designed response.
        constraints: "1..500 chars"
      - name: design_effectiveness
        type: enum
        source: system
        description: Design conclusion recorded by an effectiveness test.
        default: NOT_ASSESSED
        constraints: "NOT_ASSESSED | EFFECTIVE | PARTIALLY_EFFECTIVE | INEFFECTIVE"
      - name: operating_effectiveness
        type: enum
        source: system
        description: Operating conclusion recorded by an effectiveness test.
        default: NOT_TESTED
        constraints: "NOT_TESTED | EFFECTIVE | PARTIALLY_EFFECTIVE | INEFFECTIVE"
      - name: tested_on
        type: datetime
        source: system
        description: Logical-clock instant the effectiveness test was recorded; the ascending sort key of the OPERATING_BASIS chronological fold.
        default: null
      - name: status
        type: enum
        source: system
        description: Response status; SUPERSEDED responses are excluded from every residual-risk computation.
        default: DESIGNED
        constraints: "DESIGNED | TESTED | SUPERSEDED"

  - name: EngagementQualityReview
    parent: Engagement
    common_fields: true
    kind: resource
    fields:
      - name: engagement_id
        type: string
        source: input
        description: FK -> Engagement.id; engagement under quality review.
      - name: reviewer_partner_id
        type: string
        source: input
        description: FK -> Partner.id; the assigned engagement quality reviewer.
      - name: assigned_at
        type: datetime
        source: system
        description: Logical-clock instant of assignment; interval start for the reviewer's aggregate concurrency window.
      - name: concluded_at
        type: datetime
        source: system
        description: Logical-clock instant the review reached CONCURRED or WITHDRAWN; interval end (null means the interval is still open).
        default: null
      - name: objectivity_attested
        type: boolean
        source: input
        description: Reviewer's affirmative objectivity attestation; assignment is rejected when false.
      - name: cooling_off_days_at_assignment
        type: integer
        source: computed
        description: "Days between the reviewer's exit_date from this client's engagement team and Engagement.period_end, computed at assignment; null when the reviewer never served on the client's team."
        default: null
      - name: concern_round_count
        type: integer
        source: computed
        description: Number of times the review entered CONCERNS_RAISED.
        default: 0
      - name: last_concern_summary
        type: string
        source: system
        description: Text of the most recent unresolved-concerns note; null before the first CONCERNS_RAISED.
        default: null
      - name: state
        type: enum
        source: system
        description: Quality-review lifecycle state; cycles IN_PROGRESS -> CONCERNS_RAISED -> IN_PROGRESS.
        default: ASSIGNED
        constraints: "ASSIGNED | IN_PROGRESS | CONCERNS_RAISED | CONCURRED | WITHDRAWN"

  - name: InternalInspection
    parent: Firm
    common_fields: true
    kind: resource
    fields:
      - name: firm_id
        type: string
        source: input
        description: FK -> Firm.id; firm running the monitoring inspection.
      - name: inspection_year
        type: integer
        source: input
        description: Calendar year of the inspection cycle; the selection window is [inspection_year-01-01, inspection_year-12-31].
        constraints: "2000..2100; unique per (firm_id, inspection_year)"
      - name: target_engagement_count
        type: integer
        source: input
        description: Total number of engagements the cycle intends to inspect; must-select engagements are selected first and may exceed this target.
        constraints: ">= 1"
      - name: engagements_selected_count
        type: integer
        source: computed
        description: Count of InspectionSelection rows for this inspection.
        default: 0
      - name: must_select_eligible_count
        type: integer
        source: computed
        description: Count of window-eligible engagements whose engagement_type IN {ERISA_AUDIT, SINGLE_AUDIT, BROKER_DEALER}.
        default: 0
      - name: must_select_selected_count
        type: integer
        source: computed
        description: Count of InspectionSelection rows for this inspection with is_must_select == true.
        default: 0
      - name: must_select_coverage_pct
        type: number
        source: computed
        description: Coverage percentage from calculations.must_select_coverage_pct; exactly 100.00 when must_select_eligible_count == 0.
        default: 100.00
      - name: severity_index_basis
        type: enum
        source: system
        description: Which deficiency-severity variant produced deficiency_severity_index.
        default: NONE
        constraints: "NONE | ENGAGEMENT_WEIGHTED | FIRM_PERVASIVE"
      - name: deficiency_severity_index
        type: number
        source: computed
        description: Severity index from calculations.deficiency_severity_index under severity_index_basis; two decimals.
        default: null
      - name: concluded_at
        type: datetime
        source: system
        description: Logical-clock instant the inspection reached CONCLUDED.
        default: null
      - name: state
        type: enum
        source: system
        description: Inspection-cycle state.
        default: PLANNING
        constraints: "PLANNING | SELECTION_COMPLETE | IN_PROGRESS | FINDINGS_CLASSIFIED | CONCLUDED"

  - name: InspectionSelection
    parent: InternalInspection
    common_fields: true
    kind: resource
    fields:
      - name: inspection_id
        type: string
        source: input
        description: FK -> InternalInspection.id; the cycle that selected the engagement.
      - name: engagement_id
        type: string
        source: input
        description: FK -> Engagement.id; the selected engagement.
        constraints: "unique per (inspection_id, engagement_id)"
      - name: selection_reason
        type: enum
        source: system
        description: Why the server's selector picked this engagement.
        constraints: "MUST_SELECT_ERISA_AUDIT | MUST_SELECT_SINGLE_AUDIT | MUST_SELECT_BROKER_DEALER | MUST_SELECT_PARTNER_COVERAGE | RISK_BASED"
      - name: is_must_select
        type: boolean
        source: system
        description: True when selection_reason starts with MUST_SELECT_; must-select selections carry a 1.5 weight multiplier.
      - name: selected_rank
        type: integer
        source: system
        description: 1-based deterministic rank assigned by calculations.inspection_engagement_selection.
      - name: finding_count
        type: integer
        source: computed
        description: Count of InspectionFinding rows for this selection with state != WITHDRAWN.
        default: 0
      - name: weighted_points
        type: number
        source: computed
        description: Per-selection weighted points (rounded to two decimals BEFORE the cycle-level sum) per calculations.deficiency_severity_index.
        default: 0.00

  - name: InspectionFinding
    parent: InspectionSelection
    common_fields: true
    kind: resource
    fields:
      - name: selection_id
        type: string
        source: input
        description: FK -> InspectionSelection.id; the inspected engagement the finding was raised on.
      - name: title
        type: string
        source: input
        description: Short description of the matter observed.
        constraints: "1..200 chars"
      - name: sqm_component
        type: enum
        source: input
        description: SQM component the finding maps to; drives the QualityRisk reopen cascade.
        constraints: "GOVERNANCE_LEADERSHIP | ETHICAL_REQUIREMENTS | ACCEPTANCE_CONTINUANCE | ENGAGEMENT_PERFORMANCE | RESOURCES | INFORMATION_COMMUNICATION | MONITORING_REMEDIATION"
      - name: prior_cycle_recurrence
        type: boolean
        source: input
        description: True when the same matter was raised in a prior inspection cycle.
        default: false
      - name: classification
        type: enum
        source: system
        description: Finding classification set by the classification endpoint.
        default: UNCLASSIFIED
        constraints: "UNCLASSIFIED | OBSERVATION | DEFICIENCY | SIGNIFICANT_DEFICIENCY | MATERIAL_FAILURE"
      - name: pervasiveness
        type: enum
        source: system
        description: Whether the matter is isolated or systemic; SYSTEMIC findings add 5 points each in the FIRM_PERVASIVE variant.
        default: UNDETERMINED
        constraints: "UNDETERMINED | ISOLATED | SYSTEMIC"
      - name: affects_report_conclusion
        type: boolean
        source: system
        description: True when the matter undermines the released report; MATERIAL_FAILURE requires it true.
        default: false
      - name: class_points
        type: integer
        source: computed
        description: "Points for the classification: OBSERVATION 0, DEFICIENCY 3, SIGNIFICANT_DEFICIENCY 8, MATERIAL_FAILURE 20, UNCLASSIFIED 0."
        default: 0
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant the finding reached VERIFIED; cleared to null on REOPENED.
        default: null
      - name: reopen_count
        type: integer
        source: computed
        description: Number of times the finding was driven VERIFIED -> REOPENED.
        default: 0
      - name: state
        type: enum
        source: system
        description: Finding lifecycle state; cycles VERIFIED -> REOPENED -> REMEDIATION_ASSIGNED.
        default: IDENTIFIED
        constraints: "IDENTIFIED | RCA_PENDING | RCA_COMPLETE | REMEDIATION_ASSIGNED | REMEDIATED | VERIFIED | REOPENED | WITHDRAWN"

  - name: RootCauseAnalysis
    parent: InspectionFinding
    common_fields: true
    kind: resource
    fields:
      - name: finding_id
        type: string
        source: input
        description: FK -> InspectionFinding.id; finding whose root cause is analysed.
      - name: method
        type: enum
        source: input
        description: "Analysis method; method bonus FIVE_WHYS 2, FISHBONE 3, PARETO 1."
        constraints: "FIVE_WHYS | FISHBONE | PARETO"
      - name: root_cause_category
        type: enum
        source: input
        description: Categorised root cause; recurrence is measured on this category.
        constraints: "SUPERVISION_REVIEW | TECHNICAL_COMPETENCE | RESOURCE_ALLOCATION | TONE_AT_THE_TOP | METHODOLOGY_TOOLING | CLIENT_ACCEPTANCE"
      - name: contributing_factor_count
        type: integer
        source: input
        description: Number of contributing factors documented.
        constraints: "1..10"
      - name: narrative
        type: string
        source: input
        description: Root-cause narrative.
        constraints: "1..1000 chars"
      - name: recurrence_flag
        type: boolean
        source: computed
        description: True when a VALIDATED RootCauseAnalysis with the same root_cause_category exists for the same firm in either of the two inspection_years preceding the finding's cycle.
        default: false
      - name: depth_score
        type: number
        source: computed
        description: Depth score 0..10 from calculations.root_cause_depth_score; feeds the remediation completeness formula.
        default: 0.00
      - name: validated_at
        type: datetime
        source: system
        description: Logical-clock instant of validation; null until VALIDATED.
        default: null
      - name: state
        type: enum
        source: system
        description: Analysis lifecycle state.
        default: DRAFTED
        constraints: "DRAFTED | VALIDATED | REJECTED"

  - name: RemediationPlan
    parent: InspectionFinding
    common_fields: true
    kind: resource
    fields:
      - name: finding_id
        type: string
        source: input
        description: FK -> InspectionFinding.id; finding being remediated.
      - name: root_cause_analysis_id
        type: string
        source: input
        description: FK -> RootCauseAnalysis.id; the VALIDATED analysis the plan responds to.
      - name: owner_partner_id
        type: string
        source: input
        description: FK -> Partner.id; partner accountable for executing the plan; may never be the partner who accepts the plan.
      - name: target_completion_date
        type: string
        source: input
        description: Target completion date (YYYY-MM-DD); lateness is measured against the logical clock at acceptance time.
      - name: action_count
        type: integer
        source: input
        description: Number of remediation actions in the plan.
        constraints: "1..20"
      - name: action_specificity_score
        type: number
        source: input
        description: Assessor's specificity rating of the planned actions.
        constraints: "0.00..10.00, two decimals"
      - name: completed_action_count
        type: integer
        source: system
        description: Number of actions reported complete; never exceeds action_count.
        default: 0
      - name: raw_completeness
        type: number
        source: computed
        description: Unpenalised completeness 0..10 per calculations.remediation_acceptance_score step 1; two decimals.
        default: null
      - name: completeness_tier
        type: enum
        source: computed
        description: Tier derived from raw_completeness ONLY (never from acceptance_score); pins the daily penalty rate.
        default: NONE
        constraints: "NONE | CRITICAL | STANDARD | STRONG"
      - name: acceptance_score
        type: number
        source: computed
        description: Penalised score per calculations.remediation_acceptance_score step 4; acceptance requires >= 7.00.
        default: null
      - name: return_count
        type: integer
        source: computed
        description: Number of times the plan was returned for rework.
        default: 0
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant of acceptance; null until ACCEPTED.
        default: null
      - name: state
        type: enum
        source: system
        description: Plan lifecycle state; cycles SUBMITTED -> RETURNED -> SUBMITTED.
        default: DRAFTED
        constraints: "DRAFTED | SUBMITTED | RETURNED | ACCEPTED | COMPLETED | CLOSED"

  - name: PeerReviewer
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: reviewer_firm_name
        type: string
        source: input
        description: Name of the external firm the peer reviewer practises with.
        constraints: "1..200 chars; unique across PeerReviewer"
      - name: license_state
        type: string
        source: input
        description: Two-letter state of the reviewer's CPA license.
        constraints: "exactly 2 uppercase letters"
      - name: accepts_out_of_state
        type: boolean
        source: input
        description: True when the reviewer accepts reviews of firms licensed in other states.
        default: false
      - name: qualified_categories
        type: array
        source: input
        description: "Must-select categories the reviewer is qualified for; each element in {ERISA_AUDIT, SINGLE_AUDIT, BROKER_DEALER, GOVERNMENTAL, PUBLIC_INTEREST}."
        default: []
      - name: independence_conflict_firm_names
        type: array
        source: input
        description: Firm legal names the reviewer is not independent of.
        default: []
      - name: max_concurrent_reviews
        type: integer
        source: input
        description: Maximum number of peer reviews the reviewer may hold in a pre-report state.
        default: 2
        constraints: "1..10"
      - name: experience_hours
        type: integer
        source: input
        description: Lifetime peer review hours; third ranking key in reviewer selection.
        default: 0
        constraints: ">= 0"
      - name: active_review_count
        type: integer
        source: computed
        description: Count of PeerReview rows with assigned_reviewer_id == this reviewer and state IN {PLANNING, SCOPE_SET, FIELDWORK, RATING_DRAFTED}.
        default: 0
      - name: committed_hours_balance
        type: integer
        source: computed
        description: Conserved sum of PeerReviewSelection.hours_committed with status == COMMITTED across all PeerReview rows assigned to this reviewer.
        default: 0
      - name: status
        type: enum
        source: input
        description: Reviewer availability status.
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: PeerReview
    parent: Firm
    common_fields: true
    kind: resource
    fields:
      - name: firm_id
        type: string
        source: input
        description: FK -> Firm.id; firm under peer review.
      - name: prior_peer_review_id
        type: string
        source: input
        description: FK -> PeerReview.id; the review this one follows up on; null for an ordinary cycle review.
        default: null
      - name: assigned_reviewer_id
        type: string
        source: system
        description: FK -> PeerReviewer.id; reviewer chosen by calculations.peer_reviewer_selection; null until assignment succeeds.
        default: null
      - name: review_type
        type: enum
        source: input
        description: Peer review type.
        constraints: "SYSTEM_REVIEW | ENGAGEMENT_REVIEW"
      - name: year_end
        type: string
        source: input
        description: Year-end (YYYY-MM-DD) the review covers; engagements are scope-eligible when period_end <= year_end.
      - name: scheduled_window_start
        type: string
        source: input
        description: Inclusive first day (YYYY-MM-DD) of the reviewer's on-site window.
      - name: scheduled_window_end
        type: string
        source: input
        description: Exclusive last day (YYYY-MM-DD) of the reviewer's on-site window; the window is half-open [start, end).
      - name: must_select_categories
        type: array
        source: computed
        description: Must-select categories present at the firm, computed by calculations.peer_review_hours_scope at scope determination.
        default: []
      - name: total_scope_hours
        type: integer
        source: computed
        description: Total scope hours from calculations.peer_review_hours_scope; null until SCOPE_SET.
        default: null
      - name: unallocated_hours
        type: integer
        source: computed
        description: total_scope_hours minus the sum of hours_committed over COMMITTED selections; the conserved half of the hours invariant.
        default: null
      - name: rating
        type: enum
        source: computed
        description: Report rating from calculations.peer_review_rating; set at RATING_DRAFTED.
        default: NONE
        constraints: "NONE | PASS | PASS_WITH_DEFICIENCY | FAIL"
      - name: is_follow_up
        type: boolean
        source: computed
        description: True when prior_peer_review_id is not null.
        default: false
      - name: scope_limitation_count
        type: integer
        source: computed
        description: Count of PeerReviewSelection rows for this review with is_scope_limitation == true and status == COMMITTED.
        default: 0
      - name: report_issued_at
        type: datetime
        source: system
        description: Logical-clock instant the report was issued; null until REPORT_ISSUED.
        default: null
      - name: state
        type: enum
        source: system
        description: Peer review lifecycle; forks at REPORT_ISSUED on rating and re-joins at ACCEPTED.
        default: SCHEDULED
        constraints: "SCHEDULED | PLANNING | SCOPE_SET | FIELDWORK | RATING_DRAFTED | REPORT_ISSUED | CORRECTIVE_ACTION_REQUIRED | REMEDIATION_SUBMITTED | ACCEPTED | FOLLOW_UP_REQUIRED"

  - name: PeerReviewSelection
    parent: PeerReview
    common_fields: true
    kind: resource
    fields:
      - name: peer_review_id
        type: string
        source: input
        description: FK -> PeerReview.id; review the selection belongs to.
      - name: engagement_id
        type: string
        source: input
        description: FK -> Engagement.id; engagement the peer reviewer selected for review.
        constraints: "unique per (peer_review_id, engagement_id) among status == COMMITTED rows"
      - name: must_select_category
        type: enum
        source: system
        description: Must-select category the selection satisfies, derived from the engagement; null for a non-must-select selection.
        default: null
        constraints: "ERISA_AUDIT | SINGLE_AUDIT | BROKER_DEALER | GOVERNMENTAL | PUBLIC_INTEREST"
      - name: hours_committed
        type: integer
        source: input
        description: Hours the reviewer commits to this engagement; debited from PeerReview.unallocated_hours.
        constraints: "1..200"
      - name: is_scope_limitation
        type: boolean
        source: input
        description: True when the reviewer could not complete the intended procedures on this engagement.
        default: false
      - name: disposition
        type: enum
        source: system
        description: Reviewer's conclusion on the engagement; drives calculations.peer_review_rating.
        default: NONE
        constraints: "NONE | NO_MATTER | FFC | DEFICIENCY | SIGNIFICANT_DEFICIENCY"
      - name: non_conforming
        type: boolean
        source: system
        description: True when the engagement was judged not performed in conformity with professional standards in all material respects.
        default: false
      - name: status
        type: enum
        source: system
        description: Selection status; WITHDRAWN selections release their committed hours.
        default: COMMITTED
        constraints: "COMMITTED | WITHDRAWN"

  - name: CorrectiveActionPlan
    parent: PeerReview
    common_fields: true
    kind: resource
    fields:
      - name: peer_review_id
        type: string
        source: input
        description: FK -> PeerReview.id; review that required the corrective action.
      - name: action_code
        type: enum
        source: system
        description: Corrective action required by the report rating; synthesized by the REPORT_ISSUED cascade.
        constraints: "FFC_LETTER | MONITORING_VISIT | CPE_COURSEWORK | PREISSUANCE_REVIEW | ACCELERATED_REVIEW"
      - name: due_date
        type: string
        source: system
        description: Due date (YYYY-MM-DD) = report issue date + 90 days for PASS_WITH_DEFICIENCY, + 45 days for FAIL.
      - name: evidence_summary
        type: string
        source: input
        description: Narrative of the remediation evidence submitted by the firm; null until evidence is submitted.
        default: null
      - name: evidence_submitted_at
        type: datetime
        source: system
        description: Logical-clock instant the firm submitted evidence; null until then.
        default: null
      - name: rejection_count
        type: integer
        source: computed
        description: Number of times submitted evidence was rejected by the committee.
        default: 0
      - name: status
        type: enum
        source: system
        description: Corrective-action status.
        default: REQUIRED
        constraints: "REQUIRED | EVIDENCE_SUBMITTED | ACCEPTED | REJECTED"

state_machines:
  - entity: Engagement
    dimension: workflow_state
    note: "Dimension 1 of 2 on Engagement. Evolves independently of file_state; the two dimensions share only the LOCKED-file write guard and the MATERIAL_FAILURE reopen cascade."
    initial_state: PLANNING
    terminal_states: [REPORT_RELEASED]
    transitions:
      - from: PLANNING
        to: FIELDWORK
        trigger: "POST /engagements/{engagement_id}/workflow-transitions {to_state: FIELDWORK}"
        actor: EngagementPartner
        preconditions:
          - "engagement.workflow_state == PLANNING"
          - "X-User-ID == engagement.engagement_partner_id"
          - "engagement.file_state != LOCKED"
        side_effects:
          - "engagement.version incremented by 1; engagement.updated_at refreshed"
      - from: FIELDWORK
        to: EQR_PENDING
        trigger: "POST /engagements/{engagement_id}/workflow-transitions {to_state: EQR_PENDING}"
        actor: EngagementPartner
        preconditions:
          - "engagement.workflow_state == FIELDWORK"
          - "X-User-ID == engagement.engagement_partner_id"
          - "engagement.file_state != LOCKED"
        side_effects:
          - "engagement.version incremented by 1"
      - from: EQR_PENDING
        to: EQR_CLEARED
        trigger: "POST /engagements/{engagement_id}/workflow-transitions {to_state: EQR_CLEARED}"
        actor: EngagementPartner
        preconditions:
          - "engagement.workflow_state == EQR_PENDING"
          - "X-User-ID == engagement.engagement_partner_id"
          - "CROSS-ENTITY: if engagement.eqr_required == true then EXISTS EngagementQualityReview e WHERE e.engagement_id == engagement.id AND e.state == CONCURRED, else no EngagementQualityReview is required (ERR_EQR_NOT_CONCURRED otherwise)"
        side_effects:
          - "engagement.eqr_concurred_at = concluded_at of the CONCURRED EngagementQualityReview (null when eqr_required == false)"
          - "engagement.version incremented by 1"
      - from: EQR_PENDING
        to: FIELDWORK
        trigger: "system cascade from POST /quality-reviews/{eqr_id}/transitions {to_state: CONCERNS_RAISED}"
        actor: system
        preconditions:
          - "engagement.workflow_state == EQR_PENDING"
          - "the raising EngagementQualityReview has engagement_id == engagement.id"
        side_effects:
          - "engagement.eqr_concurred_at set to null"
          - "engagement.version incremented by 1"
        note: "Revision cycle: the engagement returns to FIELDWORK and may be resubmitted for the same review."
      - from: EQR_CLEARED
        to: REPORT_RELEASED
        trigger: "POST /engagements/{engagement_id}/workflow-transitions {to_state: REPORT_RELEASED}"
        actor: EngagementPartner
        preconditions:
          - "engagement.workflow_state == EQR_CLEARED"
          - "X-User-ID == engagement.engagement_partner_id"
        side_effects:
          - "engagement.report_release_date = date part of the logical clock"
          - "Partner.open_engagement_count recomputed for engagement.engagement_partner_id (decreases by 1)"
          - "engagement.version incremented by 1"

  - entity: Engagement
    dimension: file_state
    note: "Dimension 2 of 2 on Engagement. Documentation assembly; independent of workflow_state except for the two cross-dimension guards named in the preconditions below."
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: ASSEMBLED
        trigger: "POST /engagements/{engagement_id}/file-transitions {to_state: ASSEMBLED}"
        actor: EngagementPartner
        preconditions:
          - "engagement.file_state == OPEN"
          - "engagement.workflow_state IN {EQR_CLEARED, REPORT_RELEASED}"
          - "X-User-ID == engagement.engagement_partner_id"
        side_effects:
          - "engagement.version incremented by 1"
      - from: ASSEMBLED
        to: LOCKED
        trigger: "POST /engagements/{engagement_id}/file-transitions {to_state: LOCKED}"
        actor: EngagementPartner
        preconditions:
          - "engagement.file_state == ASSEMBLED"
          - "engagement.workflow_state == REPORT_RELEASED"
          - "days(logical_clock_date - engagement.report_release_date) <= 60 (ERR_DOCUMENTATION_WINDOW_CLOSED otherwise)"
        side_effects:
          - "engagement.version incremented by 1"
          - "further workflow-transitions and file-transitions on this engagement are rejected with ERR_ENGAGEMENT_FILE_LOCKED"
      - from: LOCKED
        to: OPEN
        trigger: "system cascade link 2 of POST /inspection-findings/{finding_id}/classification {classification: MATERIAL_FAILURE}"
        actor: system
        preconditions:
          - "engagement.file_state == LOCKED"
          - "the classified finding's InspectionSelection.engagement_id == engagement.id"
          - "finding.classification == MATERIAL_FAILURE AND finding.affects_report_conclusion == true"
        side_effects:
          - "engagement.reopened_count incremented by 1"
          - "engagement.version incremented by 1"
          - "CASCADE LINK 3 fires because this file reopened: the firm's QualityRisk with component == finding.sqm_component and state == EVALUATED is driven EVALUATED -> RESPONDED"

  - entity: EngagementQualityReview
    initial_state: ASSIGNED
    terminal_states: [CONCURRED, WITHDRAWN]
    transitions:
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /quality-reviews/{eqr_id}/transitions {to_state: IN_PROGRESS}"
        actor: EngagementQualityReviewer
        preconditions:
          - "eqr.state == ASSIGNED"
          - "X-User-ID == eqr.reviewer_partner_id"
        side_effects:
          - "eqr.version incremented by 1"
      - from: IN_PROGRESS
        to: CONCERNS_RAISED
        trigger: "POST /quality-reviews/{eqr_id}/transitions {to_state: CONCERNS_RAISED, concern_summary: <text>}"
        actor: EngagementQualityReviewer
        preconditions:
          - "eqr.state == IN_PROGRESS"
          - "X-User-ID == eqr.reviewer_partner_id"
          - "concern_summary present and 1..500 chars"
        side_effects:
          - "eqr.concern_round_count incremented by 1; eqr.last_concern_summary = concern_summary"
          - "CASCADE: the linked Engagement transitions EQR_PENDING -> FIELDWORK and its eqr_concurred_at is set to null"
      - from: CONCERNS_RAISED
        to: IN_PROGRESS
        trigger: "POST /quality-reviews/{eqr_id}/transitions {to_state: IN_PROGRESS}"
        actor: EngagementQualityReviewer
        preconditions:
          - "eqr.state == CONCERNS_RAISED"
          - "X-User-ID == eqr.reviewer_partner_id"
          - "the linked Engagement.workflow_state == EQR_PENDING (the engagement partner has resubmitted it)"
        side_effects:
          - "eqr.version incremented by 1"
        note: "Negotiation cycle: rounds repeat until the reviewer concurs or withdraws; concern_round_count records the number of rounds."
      - from: IN_PROGRESS
        to: CONCURRED
        trigger: "POST /quality-reviews/{eqr_id}/transitions {to_state: CONCURRED}"
        actor: EngagementQualityReviewer
        preconditions:
          - "eqr.state == IN_PROGRESS"
          - "X-User-ID == eqr.reviewer_partner_id"
          - "eqr.state != CONCERNS_RAISED (unresolved concerns block concurrence; ERR_UNRESOLVED_CONCERNS)"
        side_effects:
          - "eqr.concluded_at = logical clock instant (closes the reviewer's concurrency interval)"
          - "Partner.open_eqr_count recomputed for eqr.reviewer_partner_id (decreases by 1)"
      - from: ASSIGNED
        to: WITHDRAWN
        trigger: "POST /quality-reviews/{eqr_id}/transitions {to_state: WITHDRAWN}"
        actor: QualityControlDirector
        preconditions:
          - "eqr.state == ASSIGNED"
        side_effects:
          - "eqr.concluded_at = logical clock instant"
          - "Partner.open_eqr_count recomputed for eqr.reviewer_partner_id (decreases by 1)"
          - "the linked Engagement.version is incremented by 1, which invalidates any expected_engagement_version the client observed before the withdrawal"
        note: "Withdrawal frees the engagement for a fresh reviewer assignment; a client that read the engagement before the withdrawal now holds a stale version and is rejected by concurrency_rules[eqr-assign-stale-engagement]."
      - from: CONCERNS_RAISED
        to: WITHDRAWN
        trigger: "POST /quality-reviews/{eqr_id}/transitions {to_state: WITHDRAWN}"
        actor: QualityControlDirector
        preconditions:
          - "eqr.state == CONCERNS_RAISED"
        side_effects:
          - "eqr.concluded_at = logical clock instant"
          - "Partner.open_eqr_count recomputed for eqr.reviewer_partner_id (decreases by 1)"
          - "the linked Engagement.version is incremented by 1"

  - entity: QualityRisk
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ASSESSED
        trigger: "POST /firms/{firm_id}/quality-risks (automatic within the create request)"
        actor: FirmManagingPartner
        preconditions:
          - "likelihood in 1..5 AND impact in 1..5"
          - "no other QualityRisk of this firm shares (component, quality_objective_code)"
        side_effects:
          - "quality_risk.inherent_risk_score = likelihood * impact"
          - "quality_risk.state = ASSESSED before the response is written (a freshly created risk is never observable in DRAFT)"
      - from: ASSESSED
        to: RESPONDED
        trigger: "POST /quality-risks/{risk_id}/responses (first response created)"
        actor: FirmManagingPartner
        preconditions:
          - "quality_risk.state == ASSESSED"
        side_effects:
          - "quality_risk.response_count recomputed (counts RiskResponse rows with status IN {DESIGNED, TESTED})"
          - "quality_risk.version incremented by 1"
      - from: RESPONDED
        to: EVALUATED
        trigger: "POST /quality-risks/{risk_id}/evaluations {basis}"
        actor: FirmManagingPartner
        preconditions:
          - "quality_risk.state == RESPONDED"
          - "quality_risk.response_count >= 1"
          - "if basis == OPERATING_BASIS then at least one RiskResponse of this risk has status == TESTED (ERR_NO_TESTED_RESPONSE otherwise)"
        side_effects:
          - "quality_risk.evaluation_basis = basis; residual_risk_score and severity_band set by calculations.residual_risk_score"
          - "Firm.critical_risk_count recomputed"
          - "Firm.risk_posture recomputed by calculations.firm_risk_posture"
      - from: EVALUATED
        to: RESPONDED
        trigger: "system cascade link 3 of POST /inspection-findings/{finding_id}/classification {classification: MATERIAL_FAILURE} (fires because cascade link 2 reopened the engagement file)"
        actor: system
        preconditions:
          - "quality_risk.state == EVALUATED"
          - "quality_risk.firm_id == the reopened Engagement.firm_id AND quality_risk.component == finding.sqm_component"
        side_effects:
          - "quality_risk.residual_risk_score = null; severity_band = NONE; evaluation_basis = NONE"
          - "quality_risk.reopen_count incremented by 1"
          - "CASCADE LINK 4 fires because this risk left EVALUATED: Firm.critical_risk_count is recomputed and Firm.risk_posture is recomputed"
        note: "Monitoring loop: a material failure on a released engagement invalidates the firm's monitoring conclusion for that SQM component."

  - entity: InternalInspection
    initial_state: PLANNING
    terminal_states: [CONCLUDED]
    transitions:
      - from: PLANNING
        to: SELECTION_COMPLETE
        trigger: "POST /internal-inspections/{inspection_id}/selections"
        actor: QualityControlDirector
        preconditions:
          - "inspection.state == PLANNING"
          - "no other InternalInspection of this firm with the same inspection_year is in a state other than CONCLUDED"
        side_effects:
          - "creates one InspectionSelection per engagement chosen by calculations.inspection_engagement_selection, each with selection_reason, is_must_select and selected_rank"
          - "inspection.engagements_selected_count, must_select_eligible_count, must_select_selected_count set"
          - "inspection.must_select_coverage_pct set by calculations.must_select_coverage_pct"
          - "Partner.last_inspected_year set to inspection.inspection_year for every engagement_partner_id of a selected engagement"
      - from: SELECTION_COMPLETE
        to: IN_PROGRESS
        trigger: "POST /internal-inspections/{inspection_id}/transitions {to_state: IN_PROGRESS}"
        actor: QualityControlDirector
        preconditions:
          - "inspection.state == SELECTION_COMPLETE"
          - "inspection.engagements_selected_count >= 1 (ERR_NO_ELIGIBLE_ENGAGEMENTS otherwise)"
        side_effects:
          - "findings may now be raised on this cycle's selections"
      - from: SELECTION_COMPLETE
        to: CONCLUDED
        trigger: "POST /internal-inspections/{inspection_id}/transitions {to_state: CONCLUDED}"
        actor: QualityControlDirector
        preconditions:
          - "inspection.state == SELECTION_COMPLETE"
          - "inspection.engagements_selected_count == 0"
          - "inspection.must_select_coverage_pct == 100.00 (which holds by definition when must_select_eligible_count == 0)"
        side_effects:
          - "inspection.deficiency_severity_index = 0.00 and severity_index_basis = ENGAGEMENT_WEIGHTED"
          - "inspection.concluded_at = logical clock instant"
        note: "Empty-cycle boundary: a firm with no window-eligible engagements concludes its cycle without inspecting anything."
      - from: IN_PROGRESS
        to: FINDINGS_CLASSIFIED
        trigger: "POST /internal-inspections/{inspection_id}/transitions {to_state: FINDINGS_CLASSIFIED, severity_index_basis: <ENGAGEMENT_WEIGHTED|FIRM_PERVASIVE>}"
        actor: QualityControlDirector
        preconditions:
          - "inspection.state == IN_PROGRESS"
          - "every InspectionFinding on this cycle's selections has classification != UNCLASSIFIED (ERR_UNCLASSIFIED_FINDINGS_PRESENT otherwise)"
        side_effects:
          - "inspection.severity_index_basis = severity_index_basis; deficiency_severity_index set by calculations.deficiency_severity_index"
      - from: FINDINGS_CLASSIFIED
        to: CONCLUDED
        trigger: "POST /internal-inspections/{inspection_id}/transitions {to_state: CONCLUDED}"
        actor: QualityControlDirector
        preconditions:
          - "inspection.state == FINDINGS_CLASSIFIED"
          - "inspection.must_select_coverage_pct == 100.00 (ERR_MUST_SELECT_COVERAGE_INCOMPLETE otherwise)"
          - "every InspectionFinding of this cycle with classification IN {SIGNIFICANT_DEFICIENCY, MATERIAL_FAILURE} has state IN {REMEDIATION_ASSIGNED, REMEDIATED, VERIFIED} (ERR_OPEN_SIGNIFICANT_FINDINGS otherwise)"
        side_effects:
          - "inspection.concluded_at = logical clock instant"
          - "unblocks PeerReview SCOPE_SET -> FIELDWORK for this firm (cross-entity dependency)"

  - entity: InspectionFinding
    initial_state: IDENTIFIED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: IDENTIFIED
        to: RCA_PENDING
        trigger: "POST /inspection-findings/{finding_id}/classification {classification: DEFICIENCY|SIGNIFICANT_DEFICIENCY|MATERIAL_FAILURE, pervasiveness, affects_report_conclusion}"
        actor: QualityControlDirector
        preconditions:
          - "finding.state == IDENTIFIED"
          - "the finding's InternalInspection.state == IN_PROGRESS (ERR_INSPECTION_NOT_IN_PROGRESS otherwise)"
          - "if classification == MATERIAL_FAILURE then affects_report_conclusion == true (ERR_MATERIAL_FAILURE_REQUIRES_REPORT_IMPACT otherwise)"
          - "pervasiveness IN {ISOLATED, SYSTEMIC}"
        side_effects:
          - "CASCADE LINK 1: finding.classification, pervasiveness, affects_report_conclusion set; class_points set (DEFICIENCY 3, SIGNIFICANT_DEFICIENCY 8, MATERIAL_FAILURE 20); InspectionSelection.weighted_points and finding_count recomputed; Firm.open_deficiency_count incremented by 1 and, for MATERIAL_FAILURE, Firm.open_material_failure_count incremented by 1"
          - "CASCADE LINK 2 (caused by link 1's MATERIAL_FAILURE value only): the selection's Engagement transitions file_state LOCKED -> OPEN and reopened_count is incremented by 1"
          - "CASCADE LINK 3 (caused by link 2's file reopen): the firm's QualityRisk with component == finding.sqm_component and state == EVALUATED transitions EVALUATED -> RESPONDED, clearing residual_risk_score and severity_band"
          - "CASCADE LINK 4 (caused by link 3's departure from EVALUATED): Firm.critical_risk_count and Firm.risk_posture are recomputed; with open_material_failure_count >= 1 the posture becomes CRITICAL"
          - "CASCADE LINK 5 (caused by link 4's CRITICAL posture): every Engagement of the firm with workflow_state IN {PLANNING, FIELDWORK} and eqr_required == false is set eqr_required = true, and each such engagement's version is incremented by 1"
      - from: IDENTIFIED
        to: WITHDRAWN
        trigger: "POST /inspection-findings/{finding_id}/classification {classification: OBSERVATION, pervasiveness, affects_report_conclusion: false}"
        actor: QualityControlDirector
        preconditions:
          - "finding.state == IDENTIFIED"
          - "the finding's InternalInspection.state == IN_PROGRESS"
        side_effects:
          - "finding.classification = OBSERVATION; class_points = 0; state = WITHDRAWN (an observation closes without root cause analysis)"
          - "InspectionSelection.finding_count recomputed (WITHDRAWN findings are excluded)"
          - "Firm.open_deficiency_count unchanged"
      - from: RCA_PENDING
        to: RCA_COMPLETE
        trigger: "POST /root-cause-analyses/{rca_id}/validation {outcome: VALIDATED}"
        actor: QualityControlDirector
        preconditions:
          - "finding.state == RCA_PENDING"
          - "rca.finding_id == finding.id (ERR_RCA_FINDING_MISMATCH otherwise)"
          - "rca.state == DRAFTED"
        side_effects:
          - "rca.state = VALIDATED; rca.validated_at = logical clock instant; rca.depth_score set by calculations.root_cause_depth_score"
          - "finding.version incremented by 1"
      - from: RCA_COMPLETE
        to: REMEDIATION_ASSIGNED
        trigger: "POST /inspection-findings/{finding_id}/remediation-plans"
        actor: FirmManagingPartner
        preconditions:
          - "finding.state == RCA_COMPLETE"
          - "the referenced RootCauseAnalysis.state == VALIDATED (ERR_RCA_NOT_VALIDATED otherwise)"
        side_effects:
          - "a RemediationPlan is created in state DRAFTED"
          - "finding.version incremented by 1"
      - from: REMEDIATION_ASSIGNED
        to: REMEDIATED
        trigger: "system cascade from POST /remediation-plans/{plan_id}/transitions {to_state: ACCEPTED}"
        actor: system
        preconditions:
          - "finding.state == REMEDIATION_ASSIGNED"
          - "the accepted plan's finding_id == finding.id"
        side_effects:
          - "finding.version incremented by 1"
          - "Firm.open_deficiency_count unchanged (REMEDIATED findings are still open)"
      - from: REMEDIATED
        to: VERIFIED
        trigger: "POST /inspection-findings/{finding_id}/transitions {to_state: VERIFIED}"
        actor: QualityControlDirector
        preconditions:
          - "finding.state == REMEDIATED"
          - "the finding's RemediationPlan with state IN {ACCEPTED, COMPLETED} has state == COMPLETED (ERR_REMEDIATION_ACTIONS_INCOMPLETE otherwise)"
          - "X-User-ID != that RemediationPlan.owner_partner_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
        side_effects:
          - "finding.verified_at = logical clock instant"
          - "Firm.open_deficiency_count decremented by 1; for MATERIAL_FAILURE, Firm.open_material_failure_count decremented by 1"
          - "Firm.risk_posture recomputed"
      - from: VERIFIED
        to: REOPENED
        trigger: "POST /inspection-findings/{finding_id}/transitions {to_state: REOPENED}"
        actor: QualityControlDirector
        preconditions:
          - "finding.state == VERIFIED"
        side_effects:
          - "finding.verified_at = null; finding.reopen_count incremented by 1"
          - "COMPENSATION: Firm.open_deficiency_count incremented by 1 and, for MATERIAL_FAILURE, Firm.open_material_failure_count incremented by 1, restoring both to their exact pre-VERIFIED values"
          - "Firm.risk_posture recomputed"
      - from: REOPENED
        to: REMEDIATION_ASSIGNED
        trigger: "POST /inspection-findings/{finding_id}/remediation-plans"
        actor: FirmManagingPartner
        preconditions:
          - "finding.state == REOPENED"
          - "the referenced RootCauseAnalysis.state == VALIDATED"
        side_effects:
          - "every existing RemediationPlan of this finding with state IN {ACCEPTED, COMPLETED} transitions to CLOSED"
          - "a new RemediationPlan is created in state DRAFTED"

  - entity: RemediationPlan
    initial_state: DRAFTED
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFTED
        to: SUBMITTED
        trigger: "POST /remediation-plans/{plan_id}/transitions {to_state: SUBMITTED, completed_action_count}"
        actor: FirmManagingPartner
        preconditions:
          - "plan.state == DRAFTED"
          - "X-User-ID == plan.owner_partner_id (ERR_NOT_RESOURCE_OWNER otherwise)"
          - "0 <= completed_action_count <= plan.action_count"
        side_effects:
          - "plan.completed_action_count set; raw_completeness and completeness_tier set by calculations.remediation_acceptance_score steps 1-2"
          - "plan.acceptance_score set by calculations.remediation_acceptance_score steps 3-4 using the logical clock at submission"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /remediation-plans/{plan_id}/transitions {to_state: RETURNED}"
        actor: QualityControlDirector
        preconditions:
          - "plan.state == SUBMITTED"
          - "X-User-ID != plan.owner_partner_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
        side_effects:
          - "plan.return_count incremented by 1"
          - "plan.acceptance_score and completeness_tier retained (they are recomputed on the next SUBMITTED)"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /remediation-plans/{plan_id}/transitions {to_state: SUBMITTED, completed_action_count}"
        actor: FirmManagingPartner
        preconditions:
          - "plan.state == RETURNED"
          - "X-User-ID == plan.owner_partner_id"
          - "0 <= completed_action_count <= plan.action_count"
        side_effects:
          - "plan.completed_action_count updated; raw_completeness, completeness_tier and acceptance_score recomputed against the current logical clock"
        note: "Rework cycle: each round re-derives the tier from raw_completeness only, so a plan that gains completed actions can change tier between rounds."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /remediation-plans/{plan_id}/transitions {to_state: ACCEPTED}"
        actor: FirmManagingPartner
        preconditions:
          - "plan.state == SUBMITTED"
          - "X-User-ID != plan.owner_partner_id (ERR_SEGREGATION_OF_DUTIES otherwise)"
          - "plan.acceptance_score >= 7.00 (ERR_ACCEPTANCE_SCORE_BELOW_THRESHOLD otherwise)"
        side_effects:
          - "plan.accepted_at = logical clock instant"
          - "CASCADE: the plan's InspectionFinding transitions REMEDIATION_ASSIGNED -> REMEDIATED"
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /remediation-plans/{plan_id}/transitions {to_state: COMPLETED, completed_action_count}"
        actor: FirmManagingPartner
        preconditions:
          - "plan.state == ACCEPTED"
          - "X-User-ID == plan.owner_partner_id"
          - "completed_action_count == plan.action_count (ERR_REMEDIATION_ACTIONS_INCOMPLETE otherwise)"
        side_effects:
          - "plan.completed_action_count = plan.action_count"
          - "the finding may now be VERIFIED by a partner other than plan.owner_partner_id"
      - from: ACCEPTED
        to: CLOSED
        trigger: "system cascade from POST /inspection-findings/{finding_id}/remediation-plans on a REOPENED finding"
        actor: system
        preconditions:
          - "plan.state == ACCEPTED"
          - "the finding named in the new plan is the same finding as plan.finding_id"
        side_effects:
          - "plan.version incremented by 1; the superseded plan no longer satisfies the VERIFIED precondition"
      - from: COMPLETED
        to: CLOSED
        trigger: "system cascade from POST /inspection-findings/{finding_id}/remediation-plans on a REOPENED finding"
        actor: system
        preconditions:
          - "plan.state == COMPLETED"
          - "the finding named in the new plan is the same finding as plan.finding_id"
        side_effects:
          - "plan.version incremented by 1"

  - entity: PeerReview
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, FOLLOW_UP_REQUIRED]
    transitions:
      - from: SCHEDULED
        to: PLANNING
        trigger: "POST /peer-reviews/{peer_review_id}/reviewer-assignment"
        actor: PeerReviewCommittee
        preconditions:
          - "peer_review.state == SCHEDULED"
          - "calculations.peer_reviewer_selection returns a non-empty candidate pool (ERR_NO_ELIGIBLE_REVIEWER otherwise, and Firm.unassigned_review_flag is set true)"
        side_effects:
          - "peer_review.assigned_reviewer_id = the selected PeerReviewer.id"
          - "PeerReviewer.active_review_count incremented by 1"
          - "Firm.unassigned_review_flag set false"
      - from: PLANNING
        to: SCOPE_SET
        trigger: "POST /peer-reviews/{peer_review_id}/scope"
        actor: PeerReviewer
        preconditions:
          - "peer_review.state == PLANNING"
          - "X-User-ID == peer_review.assigned_reviewer_id (ERR_NOT_RESOURCE_OWNER otherwise)"
        side_effects:
          - "peer_review.must_select_categories and total_scope_hours set by calculations.peer_review_hours_scope"
          - "peer_review.unallocated_hours = peer_review.total_scope_hours (opens the hours-conservation invariant)"
      - from: SCOPE_SET
        to: FIELDWORK
        trigger: "POST /peer-reviews/{peer_review_id}/transitions {to_state: FIELDWORK}"
        actor: PeerReviewer
        preconditions:
          - "peer_review.state == SCOPE_SET"
          - "X-User-ID == peer_review.assigned_reviewer_id"
          - "CROSS-ENTITY: the firm's InternalInspection with the highest inspection_year exists and has state == CONCLUDED (ERR_INSPECTION_NOT_CONCLUDED otherwise)"
          - "every category in peer_review.must_select_categories is the must_select_category of at least one PeerReviewSelection of this review with status == COMMITTED (ERR_MUST_SELECT_CATEGORY_NOT_COVERED otherwise)"
        side_effects:
          - "peer_review.version incremented by 1"
      - from: FIELDWORK
        to: RATING_DRAFTED
        trigger: "POST /peer-reviews/{peer_review_id}/transitions {to_state: RATING_DRAFTED}"
        actor: PeerReviewer
        preconditions:
          - "peer_review.state == FIELDWORK"
          - "X-User-ID == peer_review.assigned_reviewer_id"
          - "every PeerReviewSelection of this review with status == COMMITTED has disposition != NONE (ERR_SELECTION_DISPOSITION_MISSING otherwise)"
        side_effects:
          - "peer_review.rating set by calculations.peer_review_rating; scope_limitation_count recomputed"
      - from: RATING_DRAFTED
        to: REPORT_ISSUED
        trigger: "POST /peer-reviews/{peer_review_id}/transitions {to_state: REPORT_ISSUED}"
        actor: PeerReviewer
        preconditions:
          - "peer_review.state == RATING_DRAFTED"
          - "X-User-ID == peer_review.assigned_reviewer_id"
          - "peer_review.rating != NONE"
        side_effects:
          - "peer_review.report_issued_at = logical clock instant"
        note: "Fork point: the next transition is decided by rating, with divergent side-effect sets on each branch."
      - from: REPORT_ISSUED
        to: CORRECTIVE_ACTION_REQUIRED
        trigger: "automatic within POST /peer-reviews/{peer_review_id}/transitions {to_state: REPORT_ISSUED} when rating != PASS"
        actor: system
        preconditions:
          - "peer_review.rating IN {PASS_WITH_DEFICIENCY, FAIL}"
        side_effects:
          - "creates one CorrectiveActionPlan in status REQUIRED with action_code = MONITORING_VISIT and due_date = report issue date + 90 days when rating == PASS_WITH_DEFICIENCY"
          - "creates one CorrectiveActionPlan in status REQUIRED with action_code = PREISSUANCE_REVIEW and due_date = report issue date + 45 days when rating == FAIL"
        note: "Deficiency branch of the fork; the PASS branch creates no CorrectiveActionPlan at all."
      - from: REPORT_ISSUED
        to: ACCEPTED
        trigger: "POST /peer-reviews/{peer_review_id}/transitions {to_state: ACCEPTED}"
        actor: PeerReviewCommittee
        preconditions:
          - "peer_review.state == REPORT_ISSUED"
          - "peer_review.rating == PASS (ERR_CORRECTIVE_ACTION_OUTSTANDING otherwise)"
        side_effects:
          - "Firm.last_peer_review_rating = PASS; Firm.prior_reviewer_ids prepended with peer_review.assigned_reviewer_id and truncated to three entries"
          - "PeerReviewer.active_review_count decremented by 1"
          - "Firm.risk_posture recomputed"
        note: "PASS branch of the fork; re-joins the deficiency branch at ACCEPTED."
      - from: CORRECTIVE_ACTION_REQUIRED
        to: REMEDIATION_SUBMITTED
        trigger: "system cascade from POST /corrective-action-plans/{cap_id}/evidence"
        actor: system
        preconditions:
          - "peer_review.state == CORRECTIVE_ACTION_REQUIRED"
          - "the CorrectiveActionPlan.peer_review_id == peer_review.id"
        side_effects:
          - "peer_review.version incremented by 1"
      - from: REMEDIATION_SUBMITTED
        to: ACCEPTED
        trigger: "system cascade from POST /corrective-action-plans/{cap_id}/disposition {outcome: ACCEPTED}"
        actor: system
        preconditions:
          - "peer_review.state == REMEDIATION_SUBMITTED"
        side_effects:
          - "Firm.last_peer_review_rating = peer_review.rating; Firm.prior_reviewer_ids prepended with peer_review.assigned_reviewer_id and truncated to three entries"
          - "PeerReviewer.active_review_count decremented by 1"
          - "Firm.risk_posture recomputed (ELEVATED for PASS_WITH_DEFICIENCY, CRITICAL for FAIL)"
        note: "Deficiency branch re-joins the PASS branch here; the side-effect set differs from the PASS branch by the posture outcome."
      - from: REMEDIATION_SUBMITTED
        to: FOLLOW_UP_REQUIRED
        trigger: "system cascade from POST /corrective-action-plans/{cap_id}/disposition {outcome: REJECTED}"
        actor: system
        preconditions:
          - "peer_review.state == REMEDIATION_SUBMITTED"
        side_effects:
          - "CASCADE LINK 2 (caused by link 1, the CorrectiveActionPlan reaching REJECTED): peer_review.state = FOLLOW_UP_REQUIRED"
          - "CASCADE LINK 3 (caused by link 2): a new PeerReview is created for the same firm with prior_peer_review_id = peer_review.id, is_follow_up = true, review_type = SYSTEM_REVIEW, state = SCHEDULED, year_end = peer_review.year_end, scheduled_window_start = peer_review.scheduled_window_end + 180 days and scheduled_window_end = that start + 14 days; PeerReviewer.active_review_count for peer_review.assigned_reviewer_id is decremented by 1"
          - "CASCADE LINK 4 (caused by link 3 closing out the original review): Firm.last_peer_review_rating = peer_review.rating and Firm.prior_reviewer_ids prepended with peer_review.assigned_reviewer_id; Firm.risk_posture recomputed"
          - "CASCADE LINK 5 (caused by link 4 when the posture becomes CRITICAL): client acceptance is frozen, so POST /engagements with engagement_type IN {ERISA_AUDIT, SINGLE_AUDIT, BROKER_DEALER} for this firm is rejected with ERR_ACCEPTANCE_FROZEN"

  - entity: PeerReviewSelection
    initial_state: COMMITTED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: COMMITTED
        to: WITHDRAWN
        trigger: "DELETE /peer-reviews/{peer_review_id}/selections/{selection_id}"
        actor: PeerReviewer
        preconditions:
          - "selection.status == COMMITTED"
          - "the parent PeerReview.state IN {SCOPE_SET, FIELDWORK} (ERR_INVALID_TRANSITION otherwise)"
          - "X-User-ID == the parent PeerReview.assigned_reviewer_id"
        side_effects:
          - "COMPENSATION: PeerReview.unallocated_hours incremented by selection.hours_committed and PeerReviewer.committed_hours_balance decremented by selection.hours_committed, restoring both to their exact pre-selection values"
          - "PeerReview.scope_limitation_count recomputed"

  - entity: CorrectiveActionPlan
    initial_state: REQUIRED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: REQUIRED
        to: EVIDENCE_SUBMITTED
        trigger: "POST /corrective-action-plans/{cap_id}/evidence {evidence_summary}"
        actor: FirmManagingPartner
        preconditions:
          - "cap.status == REQUIRED"
          - "logical clock date <= cap.due_date (ERR_CORRECTIVE_ACTION_PAST_DUE otherwise)"
        side_effects:
          - "cap.evidence_summary and evidence_submitted_at set"
          - "CASCADE: the parent PeerReview transitions CORRECTIVE_ACTION_REQUIRED -> REMEDIATION_SUBMITTED"
      - from: EVIDENCE_SUBMITTED
        to: ACCEPTED
        trigger: "POST /corrective-action-plans/{cap_id}/disposition {outcome: ACCEPTED}"
        actor: PeerReviewCommittee
        preconditions:
          - "cap.status == EVIDENCE_SUBMITTED"
        side_effects:
          - "CASCADE: the parent PeerReview transitions REMEDIATION_SUBMITTED -> ACCEPTED with the full side-effect set of that transition"
      - from: EVIDENCE_SUBMITTED
        to: REJECTED
        trigger: "POST /corrective-action-plans/{cap_id}/disposition {outcome: REJECTED}"
        actor: PeerReviewCommittee
        preconditions:
          - "cap.status == EVIDENCE_SUBMITTED"
        side_effects:
          - "CASCADE LINK 1: cap.status = REJECTED and cap.rejection_count incremented by 1"
          - "links 2-5 follow on the parent PeerReview per state_machines.PeerReview.REMEDIATION_SUBMITTED_to_FOLLOW_UP_REQUIRED"

concurrency_rules:
  - rule_id: eqr-assign-stale-engagement
    parent_entity: Engagement
    write_endpoint: "POST /engagements/{engagement_id}/quality-reviews"
    occ_field: "expected_engagement_version"
    description: |
      Assigning an engagement quality reviewer to an Engagement whose version has advanced since
      the client last observed it is rejected with a stale-version conflict. This captures the case
      where an earlier assignment was withdrawn (which legitimately frees the engagement for a fresh
      reviewer and bumps the engagement's version) or where the MATERIAL_FAILURE posture cascade set
      eqr_required on the engagement, so the writer's view of the engagement is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: remediation-plan-create-stale-finding
    parent_entity: InspectionFinding
    write_endpoint: "POST /inspection-findings/{finding_id}/remediation-plans"
    occ_field: "expected_finding_version"
    description: |
      Creating a RemediationPlan against an InspectionFinding whose version has advanced since the
      client last observed it is rejected with a stale-version conflict. A new plan legitimately
      supersedes the finding's prior ACCEPTED or COMPLETED plan after a reopen, so the create itself
      is a valid product operation; the OCC check is what prevents a writer holding a pre-reopen view
      of the finding from attaching a plan to it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: peer-review-selection-stale-review
    parent_entity: PeerReview
    write_endpoint: "POST /peer-reviews/{peer_review_id}/selections"
    occ_field: "expected_peer_review_version"
    description: |
      Committing engagement hours against a PeerReview whose version has advanced since the client
      last observed it is rejected with a stale-version conflict. Every selection create and every
      selection withdrawal re-derives unallocated_hours and bumps the review's version, so a writer
      holding an older view of the review would be committing hours against an hours budget that no
      longer exists.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: engagement_risk_score
    trigger: "POST /engagements (at create, before eqr_required_determination runs); writes Engagement.risk_score"
    algorithm: weighted_scoring
    formula: |
      TYPE_WEIGHT       = {AUDIT: 20, REVIEW: 8, ATTESTATION: 6, ERISA_AUDIT: 30, SINGLE_AUDIT: 32, BROKER_DEALER: 28}
      SPEC_FOR_TYPE     = {ERISA_AUDIT: "EBP", SINGLE_AUDIT: "GOVERNMENT", BROKER_DEALER: "BROKER_DEALER",
                           AUDIT: null, REVIEW: null, ATTESTATION: null}
      base = TYPE_WEIGHT[engagement_type]
           + (15 if is_first_year_client else 0)
           + (12 if is_public_interest else 0)
           + min(20, 4 * prior_finding_count_3y)                       # nested cap on prior findings
      load_penalty = max(0, partner.open_engagement_count - 8) * 3     # partner.open_engagement_count as it stands BEFORE this engagement is inserted
      spec_credit  = 10 if (SPEC_FOR_TYPE[engagement_type] != null
                            AND SPEC_FOR_TYPE[engagement_type] IN partner.industry_specializations) else 0
      risk_score   = min(100, max(0, base + load_penalty - spec_credit))   # clamp applied LAST, after the signed sum
    input_set: "The Engagement being created plus its engagement_partner (Partner). partner.open_engagement_count counts that partner's Engagement rows with workflow_state IN {PLANNING, FIELDWORK, EQR_PENDING, EQR_CLEARED}, measured before this row exists."
    constants:
      TYPE_WEIGHT_AUDIT: 20
      TYPE_WEIGHT_REVIEW: 8
      TYPE_WEIGHT_ATTESTATION: 6
      TYPE_WEIGHT_ERISA_AUDIT: 30
      TYPE_WEIGHT_SINGLE_AUDIT: 32
      TYPE_WEIGHT_BROKER_DEALER: 28
      FIRST_YEAR_POINTS: 15
      PUBLIC_INTEREST_POINTS: 12
      PRIOR_FINDING_POINTS_EACH: 4
      PRIOR_FINDING_CAP: 20
      LOAD_FREE_ENGAGEMENTS: 8
      LOAD_POINTS_PER_EXCESS: 3
      SPECIALIZATION_CREDIT: 10
    precision: "integer, 0..100; no rounding needed (all terms are integers)"

  - name: eqr_required_determination
    trigger: "POST /engagements (immediately after engagement_risk_score) and, again for every affected engagement, during cascade link 5 of POST /inspection-findings/{finding_id}/classification; writes Engagement.eqr_required"
    algorithm: threshold
    formula: |
      eqr_required = (engagement.risk_score >= 70)                                  # inclusive boundary
                  OR (engagement.engagement_type IN {ERISA_AUDIT, SINGLE_AUDIT, BROKER_DEALER})
                  OR (engagement.is_public_interest == true)
                  OR (firm.risk_posture IN {ELEVATED, CRITICAL})
    input_set: "The Engagement row and its Firm row. Once true, eqr_required is never set back to false: cascade link 5 only promotes false -> true."
    constants:
      RISK_SCORE_EQR_THRESHOLD: 70
    precision: "boolean"
    note: "Boundary: risk_score 70 requires an EQR, risk_score 69 does not (when no other clause holds)."

  - name: eqr_reviewer_eligibility
    trigger: "POST /engagements/{engagement_id}/quality-reviews; gates the assignment and writes EngagementQualityReview.cooling_off_days_at_assignment"
    algorithm: constraint_propagation
    formula: |
      # Checks are evaluated in this exact order; the first failure decides the error_id.
      1. partner.status == ACTIVE                                          else ERR_PARTNER_INACTIVE
      2. partner.firm_id == engagement.firm_id                             else ERR_PARTNER_FIRM_MISMATCH
      3. partner.id != engagement.engagement_partner_id                    else ERR_EQR_SELF_REVIEW
      4. "EQ_REVIEWER" IN partner.designations
         AND partner.cpe_hours_last_3y >= 120                              else ERR_CPE_REQUIREMENT_NOT_MET
      5. engagement.client_name NOT IN partner.independence_conflict_client_names
                                                                           else ERR_REVIEWER_INDEPENDENCE_CONFLICT
      6. request.objectivity_attested == true                              else ERR_OBJECTIVITY_NOT_ATTESTED
      7. cooling-off:
           h = the element of partner.prior_engagement_team_clients whose client_name == engagement.client_name;
               when several elements share the client_name, take the one with the latest exit_date, tie-break by
               ascending array position.
           if h exists:
               cooling_off_days_at_assignment = days(engagement.period_end - h.exit_date)
               require cooling_off_days_at_assignment >= 730              else ERR_COOLING_OFF_NOT_MET
           else:
               cooling_off_days_at_assignment = null
    input_set: "The candidate Partner, the target Engagement and the request body. Partner rows with status == INACTIVE are never eligible regardless of the other checks."
    constants:
      MIN_CPE_HOURS_3Y: 120
      COOLING_OFF_DAYS: 730
    precision: "integer days; exact calendar-day difference, no rounding"
    note: "Boundary: exactly 730 days of separation passes, 729 fails."

  - name: eqr_reviewer_concurrency_window
    trigger: "POST /engagements/{engagement_id}/quality-reviews, after eqr_reviewer_eligibility passes"
    algorithm: interval_merge
    formula: |
      MAX_CONCURRENT_EQR = 3
      N = [logical_clock_now, +infinity)                 # the interval this assignment would occupy
      E = { [e.assigned_at, e.concluded_at) : e IN EngagementQualityReview
            WHERE e.reviewer_partner_id == request.reviewer_partner_id
              AND e.state IN {ASSIGNED, IN_PROGRESS, CONCERNS_RAISED} }
          # a null concluded_at is treated as +infinity
      overlap(N, X) := (N.start < X.end) AND (X.start < N.end)     # half-open on both sides, NO buffer
      # touching endpoints do NOT overlap: an interval ending exactly at N.start is not counted
      if count({X IN E : overlap(N, X)}) >= MAX_CONCURRENT_EQR  ->  ERR_EQR_CAPACITY_EXCEEDED
    input_set: "All EngagementQualityReview rows of the candidate reviewer in a non-terminal state; CONCURRED and WITHDRAWN rows have a non-null concluded_at and therefore close their interval."
    constants:
      MAX_CONCURRENT_EQR: 3
      BUFFER_DAYS: 0
    precision: "integer count of overlapping intervals"
    note: "Interval semantics: aggregate capacity over half-open intervals with zero buffer and adjacency permitted. Contrast peer_reviewer_selection, which uses pairwise rejection with a 5-day buffer."

  - name: residual_risk_score
    trigger: "POST /quality-risks/{risk_id}/evaluations; writes QualityRisk.residual_risk_score, severity_band and evaluation_basis"
    algorithm: aggregation
    formula: |
      inherent = quality_risk.likelihood * quality_risk.impact          # 1..25
      # --- variant selection is the request's `basis` field ---
      residual = <see variants>
      severity_band = CRITICAL  if residual >= 15.00
                    else HIGH     if residual >= 8.00
                    else MODERATE if residual >= 4.00
                    else LOW
    input_set: "RiskResponse rows of the risk with status != SUPERSEDED. DESIGN_BASIS includes rows with status IN {DESIGNED, TESTED}; OPERATING_BASIS includes only rows with status == TESTED."
    constants:
      DESIGN_WEIGHT_EFFECTIVE: 0.35
      DESIGN_WEIGHT_PARTIALLY_EFFECTIVE: 0.20
      DESIGN_WEIGHT_INEFFECTIVE: 0.00
      DESIGN_MITIGATION_CAP: 0.80
      OPERATING_WEIGHT_EFFECTIVE: 0.30
      OPERATING_WEIGHT_PARTIALLY_EFFECTIVE: 0.10
      OPERATING_WEIGHT_INEFFECTIVE: 0.00
      BAND_CRITICAL_AT: 15.00
      BAND_HIGH_AT: 8.00
      BAND_MODERATE_AT: 4.00
    precision: "2 decimal places, round_half_up, applied once at the end of the variant"
    variants:
      - name: DESIGN_BASIS
        when: "request.basis == DESIGN_BASIS; the firm concludes on design alone (responses need not be tested)"
        difference: |
          mitigation = sum(DESIGN_WEIGHT[r.design_effectiveness]
                           for r IN responses WHERE r.status IN {DESIGNED, TESTED})
          mitigation_factor = min(0.80, mitigation)                  # additive, capped
          residual = round(inherent * (1 - mitigation_factor), 2)
      - name: OPERATING_BASIS
        when: "request.basis == OPERATING_BASIS; the firm concludes on tested operating effectiveness"
        difference: |
          ordered = responses WHERE r.status == TESTED, sorted by r.tested_on ASC, tie-break r.created_at ASC
          running = inherent
          for r IN ordered:  running = running * (1 - OPERATING_WEIGHT[r.operating_effectiveness])
          residual = round(running, 2)                               # multiplicative fold, uncapped
    note: "Dual-variant divergence: with inherent = 20 and two EFFECTIVE responses, DESIGN_BASIS gives round(20 * (1 - 0.70), 2) = 6.00 (HIGH) while OPERATING_BASIS gives round(20 * 0.70 * 0.70, 2) = 9.80 (HIGH but a different number); with inherent = 25 and three EFFECTIVE responses DESIGN_BASIS gives 5.00 (MODERATE) against OPERATING_BASIS 8.58 (HIGH), so the bands diverge too."

  - name: firm_risk_posture
    trigger: "recomputed on: POST /quality-risks/{risk_id}/evaluations; cascade link 4 of POST /inspection-findings/{finding_id}/classification; POST /inspection-findings/{finding_id}/transitions (VERIFIED and REOPENED); PeerReview REPORT_ISSUED -> ACCEPTED, REMEDIATION_SUBMITTED -> ACCEPTED and REMEDIATION_SUBMITTED -> FOLLOW_UP_REQUIRED. Writes Firm.risk_posture."
    algorithm: threshold
    formula: |
      # First matching clause wins; evaluated strictly top to bottom.
      posture = CRITICAL if (firm.last_peer_review_rating == FAIL
                             OR firm.open_material_failure_count >= 1
                             OR firm.critical_risk_count >= 3)
              else ELEVATED if (firm.last_peer_review_rating == PASS_WITH_DEFICIENCY
                             OR firm.critical_risk_count >= 1
                             OR firm.open_deficiency_count >= 5)
              else STABLE
    input_set: "The Firm's own denormalized counters, each of which is itself recomputed from InspectionFinding and QualityRisk rows immediately before this calculation runs in the same request."
    constants:
      MATERIAL_FAILURE_CRITICAL_AT: 1
      CRITICAL_RISK_CRITICAL_AT: 3
      CRITICAL_RISK_ELEVATED_AT: 1
      OPEN_DEFICIENCY_ELEVATED_AT: 5
    precision: "enum"
    note: "Gating consequences: CRITICAL rejects POST /engagements with engagement_type IN {ERISA_AUDIT, SINGLE_AUDIT, BROKER_DEALER} (ERR_ACCEPTANCE_FROZEN); ELEVATED or CRITICAL forces eqr_required = true on every new engagement."

  - name: inspection_engagement_selection
    trigger: "POST /internal-inspections/{inspection_id}/selections; creates the cycle's InspectionSelection rows"
    algorithm: waterfall_allocation
    formula: |
      window_start = date(inspection.inspection_year, 1, 1)
      window_end   = date(inspection.inspection_year, 12, 31)
      eligible = { e IN Engagement : e.firm_id == inspection.firm_id
                                 AND e.workflow_state == REPORT_RELEASED
                                 AND window_start <= e.period_end <= window_end }      # both ends inclusive
      # ---- Block A: must-select by engagement type (takes precedence over the target count) ----
      A = { e IN eligible : e.engagement_type IN {ERISA_AUDIT, SINGLE_AUDIT, BROKER_DEALER} }
          ordered by e.period_end ASC, tie-break e.created_at ASC
          selection_reason = "MUST_SELECT_" + e.engagement_type ; is_must_select = true
      # ---- Block B: partner coverage ----
      uncovered_partners = { p : p == e.engagement_partner_id for some e IN eligible, e NOT IN A }
                           WHERE p.last_inspected_year IS NULL
                              OR p.last_inspected_year <= inspection.inspection_year - 3
      for each p IN uncovered_partners: pick_p = the engagement in (eligible \ A) with engagement_partner_id == p
                           having the highest risk_score; tie-break e.period_end ASC then e.created_at ASC
      B = { pick_p } ordered by pick_p.risk_score DESC, tie-break pick_p.created_at ASC
          selection_reason = MUST_SELECT_PARTNER_COVERAGE ; is_must_select = true
      # ---- Block C: risk-based fill ----
      remaining = eligible \ (A UNION B) ordered by e.risk_score DESC, tie-break e.created_at ASC
      C = the first max(0, inspection.target_engagement_count - |A| - |B|) rows of remaining
          selection_reason = RISK_BASED ; is_must_select = false
      selected_rank = 1..N over the concatenation A ++ B ++ C, in that exact order
      # ---- Empty-pool fallback ----
      if eligible is empty: no InspectionSelection rows are created; engagements_selected_count = 0;
                            must_select_eligible_count = 0; must_select_coverage_pct = 100.00
    input_set: "Engagement rows of the firm with workflow_state == REPORT_RELEASED whose period_end falls inside the inspection year, inclusive of both endpoints. Engagements in any other workflow_state are excluded even when their period_end is in the window."
    constants:
      PARTNER_COVERAGE_CYCLE_YEARS: 3
    precision: "integer ranks starting at 1; no ties possible because every ordering ends in created_at ASC"
    note: "Selector determinism: eligibility filter, ranking expression, tie-break and empty-pool fallback are all pinned above; `id` is never consulted."

  - name: must_select_coverage_pct
    trigger: "POST /internal-inspections/{inspection_id}/selections (and re-evaluated as a precondition of FINDINGS_CLASSIFIED -> CONCLUDED); writes InternalInspection.must_select_coverage_pct"
    algorithm: aggregation
    formula: |
      must_select_eligible_count = |{ e IN eligible (same window filter as inspection_engagement_selection)
                                      : e.engagement_type IN {ERISA_AUDIT, SINGLE_AUDIT, BROKER_DEALER} }|
      must_select_selected_count = |{ s IN InspectionSelection : s.inspection_id == inspection.id
                                      AND s.is_must_select == true
                                      AND s.selection_reason != MUST_SELECT_PARTNER_COVERAGE }|
      if must_select_eligible_count == 0:  must_select_coverage_pct = 100.00      # empty-set boundary
      else: must_select_coverage_pct = round(100 * must_select_selected_count / must_select_eligible_count, 2)
    input_set: "Window-eligible engagements of the firm (workflow_state == REPORT_RELEASED, period_end inside the inspection year) and the cycle's own InspectionSelection rows. Partner-coverage selections are deliberately excluded from the numerator."
    constants: {}
    precision: "2 decimal places, round_half_up"
    note: "Empty-set boundary: a firm with zero must-select-eligible engagements has coverage exactly 100.00 and may conclude the cycle; with 3 eligible and 2 selected the value is 66.67 and CONCLUDED is rejected."

  - name: deficiency_severity_index
    trigger: "POST /internal-inspections/{inspection_id}/transitions {to_state: FINDINGS_CLASSIFIED, severity_index_basis}; writes InternalInspection.deficiency_severity_index and InspectionSelection.weighted_points"
    algorithm: weighted_scoring
    formula: |
      CLASS_POINTS = {UNCLASSIFIED: 0, OBSERVATION: 0, DEFICIENCY: 3, SIGNIFICANT_DEFICIENCY: 8, MATERIAL_FAILURE: 20}
      F = { f IN InspectionFinding : f.selection_id IN (selections of this inspection) AND f.state != WITHDRAWN }
      index = <see variants>
    input_set: "All InspectionFinding rows of the cycle's selections with state != WITHDRAWN (so OBSERVATION findings, which are auto-WITHDRAWN, never contribute). Findings on other cycles of the same firm are excluded."
    constants:
      CLASS_POINTS_DEFICIENCY: 3
      CLASS_POINTS_SIGNIFICANT_DEFICIENCY: 8
      CLASS_POINTS_MATERIAL_FAILURE: 20
      MUST_SELECT_MULTIPLIER: 1.5
      SYSTEMIC_BONUS_EACH: 5
    precision: "2 decimal places, round_half_up; see the pinned rounding order inside each variant"
    variants:
      - name: ENGAGEMENT_WEIGHTED
        when: "severity_index_basis == ENGAGEMENT_WEIGHTED — the firm measures how bad the average inspected engagement was"
        difference: |
          for each selection s of the cycle:
              raw_s = sum(CLASS_POINTS[f.classification] for f IN F WHERE f.selection_id == s.id)
              s.weighted_points = round(raw_s * (1.5 if s.is_must_select else 1.0), 2)   # ROUND PER SELECTION FIRST
          index = round(sum(s.weighted_points over all selections of the cycle)
                        / inspection.engagements_selected_count, 2)                      # THEN sum, then divide, then round once
          # FORBIDDEN alternative that yields different cents: sum the raw points across selections,
          # multiply once by the multiplier, and round only at the end.
      - name: FIRM_PERVASIVE
        when: "severity_index_basis == FIRM_PERVASIVE — the firm measures how concentrated the failures are in one SQM component"
        difference: |
          comp_points[c] = sum(CLASS_POINTS[f.classification] for f IN F WHERE f.sqm_component == c)
          systemic_bonus = 5 * |{ f IN F : f.pervasiveness == SYSTEMIC }|
          distinct_components = |{ f.sqm_component : f IN F }|
          index = round((max(comp_points values, 0 when F is empty) + systemic_bonus)
                        / max(1, distinct_components), 2)
          # Ignores which engagement a finding came from and ignores is_must_select entirely.
    note: "Dual-variant divergence on a different entity domain from residual_risk_score: this scores an InternalInspection cycle, not a QualityRisk. Two selections (one must-select with one MATERIAL_FAILURE, one ordinary with one DEFICIENCY, the material one SYSTEMIC) give ENGAGEMENT_WEIGHTED round((30.00 + 3.00) / 2, 2) = 16.50 and FIRM_PERVASIVE round((20 + 5) / 2, 2) = 12.50 when the two findings sit in different components."

  - name: root_cause_depth_score
    trigger: "POST /root-cause-analyses/{rca_id}/validation {outcome: VALIDATED}; writes RootCauseAnalysis.recurrence_flag and depth_score"
    algorithm: weighted_scoring
    formula: |
      METHOD_BONUS = {FIVE_WHYS: 2, FISHBONE: 3, PARETO: 1}
      recurrence_flag = EXISTS r2 IN RootCauseAnalysis WHERE r2.id != rca.id
                          AND r2.state == VALIDATED
                          AND r2.root_cause_category == rca.root_cause_category
                          AND firm_of(r2) == firm_of(rca)
                          AND inspection_year_of(r2) IN {inspection_year_of(rca) - 1, inspection_year_of(rca) - 2}
                        # firm_of / inspection_year_of resolve through
                        # RootCauseAnalysis.finding_id -> InspectionFinding.selection_id
                        # -> InspectionSelection.inspection_id -> InternalInspection.{firm_id, inspection_year}
      depth_score = min(10, 2 * rca.contributing_factor_count
                            + METHOD_BONUS[rca.method]
                            + (2 if recurrence_flag else 0))
    input_set: "VALIDATED RootCauseAnalysis rows of the same firm from the two inspection years preceding this finding's cycle; DRAFTED and REJECTED analyses never establish recurrence."
    constants:
      METHOD_BONUS_FIVE_WHYS: 2
      METHOD_BONUS_FISHBONE: 3
      METHOD_BONUS_PARETO: 1
      RECURRENCE_BONUS: 2
      DEPTH_CAP: 10
      RECURRENCE_LOOKBACK_YEARS: 2
    precision: "2 decimal places, round_half_up (integers are stored as e.g. 8.00)"

  - name: remediation_acceptance_score
    trigger: "POST /remediation-plans/{plan_id}/transitions {to_state: SUBMITTED} (both from DRAFTED and from RETURNED); writes RemediationPlan.raw_completeness, completeness_tier and acceptance_score"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 - unpenalised completeness (never sees the penalty)
      raw_completeness = round(0.40 * rca.depth_score
                             + 0.35 * plan.action_specificity_score
                             + 0.25 * (10 * plan.completed_action_count / plan.action_count), 2)
      # STEP 2 - tier is a function of raw_completeness ONLY
      completeness_tier = CRITICAL if raw_completeness < 5.00
                        else STANDARD if raw_completeness < 8.00
                        else STRONG
      # STEP 3 - penalty rate selected by the tier from step 2
      late_days    = max(0, days(logical_clock_date - plan.target_completion_date))
      penalty_rate = 0.15 if completeness_tier == CRITICAL
                   else 0.10 if completeness_tier == STANDARD
                   else 0.05
      # STEP 4 - single penalty pass
      acceptance_score = round(max(0.00, raw_completeness - penalty_rate * late_days), 2)
      # EVALUATION ORDER IS PINNED: the tier is NEVER re-derived from acceptance_score. The circular
      # reading (penalty lowers the score -> lower score means a harsher tier -> harsher tier means a
      # bigger penalty) is explicitly rejected; exactly one penalty pass runs per submission.
    input_set: "The plan's own fields plus depth_score of the RootCauseAnalysis named by plan.root_cause_analysis_id (which must be VALIDATED). The logical clock is read at submission time, not at acceptance time."
    constants:
      WEIGHT_DEPTH: 0.40
      WEIGHT_SPECIFICITY: 0.35
      WEIGHT_ACTION_PROGRESS: 0.25
      TIER_CRITICAL_BELOW: 5.00
      TIER_STANDARD_BELOW: 8.00
      PENALTY_RATE_CRITICAL: 0.15
      PENALTY_RATE_STANDARD: 0.10
      PENALTY_RATE_STRONG: 0.05
      ACCEPTANCE_THRESHOLD: 7.00
    precision: "2 decimal places, round_half_up, applied once in step 1 and once in step 4"
    note: "Acceptance gate boundary: acceptance_score exactly 7.00 is accepted, 6.99 is rejected with ERR_ACCEPTANCE_SCORE_BELOW_THRESHOLD."

  - name: peer_reviewer_selection
    trigger: "POST /peer-reviews/{peer_review_id}/reviewer-assignment; writes PeerReview.assigned_reviewer_id or raises ERR_NO_ELIGIBLE_REVIEWER"
    algorithm: topological
    formula: |
      TRAVEL_BUFFER_DAYS = 5
      target_categories = firm_must_select_categories(firm, peer_review.year_end)     # see peer_review_hours_scope
      # ---- eligibility filter (every clause must hold) ----
      pool = { p IN PeerReviewer :
                 p.status == ACTIVE
                 AND (p.license_state == firm.state_code OR p.accepts_out_of_state == true)
                 AND set(target_categories) SUBSET_OF set(p.qualified_categories)      # empty set is a subset
                 AND firm.legal_name NOT IN p.independence_conflict_firm_names
                 AND p.id NOT IN firm.prior_reviewer_ids                               # rotation, membership test only
                 AND p.active_review_count < p.max_concurrent_reviews
                 AND NOT EXISTS r IN PeerReview WHERE r.assigned_reviewer_id == p.id
                       AND r.state IN {SCHEDULED, PLANNING, SCOPE_SET, FIELDWORK, RATING_DRAFTED}
                       AND peer_review.scheduled_window_start < date_add(r.scheduled_window_end, 5)
                       AND r.scheduled_window_start < peer_review.scheduled_window_end }
      # ---- ranking (applied in order, all keys are entity fields) ----
      rank_key(p) = ( -|set(p.qualified_categories) INTERSECT set(target_categories)|,   # category match DESC
                       p.active_review_count,                                            # load ASC
                      -p.experience_hours )                                              # experience DESC
      # ---- tie-break ----
      final tie-break: p.created_at ASC       # never p.id
      # ---- empty-pool fallback ----
      if pool is empty: ERR_NO_ELIGIBLE_REVIEWER (409); peer_review.state stays SCHEDULED;
                        Firm.unassigned_review_flag = true
    input_set: "All PeerReviewer rows, plus the reviewer's own PeerReview rows in a pre-report state for the window test. Reviews in state IN {REPORT_ISSUED, CORRECTIVE_ACTION_REQUIRED, REMEDIATION_SUBMITTED, ACCEPTED, FOLLOW_UP_REQUIRED} do not block a window."
    constants:
      TRAVEL_BUFFER_DAYS: 5
    precision: "exact date arithmetic in whole days"
    note: "Interval semantics: pairwise rejection of half-open windows [start, end) with a 5-day travel buffer added to the EXISTING window's end. A new window starting exactly on an existing window's end date conflicts; a new window starting exactly 5 days after it does not. This differs from eqr_reviewer_concurrency_window, which is a zero-buffer aggregate-capacity count on Partner."

  - name: peer_review_hours_scope
    trigger: "POST /peer-reviews/{peer_review_id}/scope; writes PeerReview.must_select_categories, total_scope_hours and unallocated_hours"
    algorithm: tiered_pricing
    formula: |
      # ---- shared sub-formula, also used by peer_reviewer_selection ----
      firm_must_select_categories(firm, year_end):
          scope_pool = { e IN Engagement : e.firm_id == firm.id
                                       AND e.workflow_state == REPORT_RELEASED
                                       AND e.period_end <= year_end }
          emit, in this fixed declaration order (never in engagement order), each category that has at
          least one matching engagement in scope_pool, de-duplicated:
            ERISA_AUDIT     if any e.engagement_type == ERISA_AUDIT
            SINGLE_AUDIT    if any e.engagement_type == SINGLE_AUDIT
            BROKER_DEALER   if any e.engagement_type == BROKER_DEALER
            GOVERNMENTAL    if any (e.engagement_type == AUDIT AND "GOVERNMENT" IN
                                    partner_of(e).industry_specializations)
            PUBLIC_INTEREST if any e.is_public_interest == true
      # ---- base tier on firm size ----
      BASE_TIER = 16 if firm.aa_hours_last_year <= 500
                else 24 if firm.aa_hours_last_year <= 2000
                else 40 if firm.aa_hours_last_year <= 10000
                else 64
      CATEGORY_HOURS = {ERISA_AUDIT: 8, SINGLE_AUDIT: 10, BROKER_DEALER: 8, GOVERNMENTAL: 6, PUBLIC_INTEREST: 12}
      uplift = 0.25 if firm.risk_posture == CRITICAL
             else 0.10 if firm.risk_posture == ELEVATED
             else 0.00
      # ---- ROUNDING ORDER IS PINNED: round EACH component to 2 decimals, THEN sum, THEN ceil ----
      component_base      = round(BASE_TIER * (1 + uplift), 2)
      component_must_sel  = round(sum(CATEGORY_HOURS[c] for c IN must_select_categories) * (1 + uplift), 2)
      total_scope_hours   = ceil(component_base + component_must_sel)
      unallocated_hours   = total_scope_hours
      # FORBIDDEN alternative: (BASE_TIER + sum(CATEGORY_HOURS)) * (1 + uplift) rounded once at the end.
    input_set: "The firm's REPORT_RELEASED engagements with period_end <= peer_review.year_end, their engagement partners' industry_specializations, and the firm's aa_hours_last_year and risk_posture as they stand when scope is set."
    constants:
      BASE_TIER_1_HOURS: 16
      BASE_TIER_1_MAX_AA_HOURS: 500
      BASE_TIER_2_HOURS: 24
      BASE_TIER_2_MAX_AA_HOURS: 2000
      BASE_TIER_3_HOURS: 40
      BASE_TIER_3_MAX_AA_HOURS: 10000
      BASE_TIER_4_HOURS: 64
      CATEGORY_HOURS_ERISA_AUDIT: 8
      CATEGORY_HOURS_SINGLE_AUDIT: 10
      CATEGORY_HOURS_BROKER_DEALER: 8
      CATEGORY_HOURS_GOVERNMENTAL: 6
      CATEGORY_HOURS_PUBLIC_INTEREST: 12
      UPLIFT_CRITICAL: 0.25
      UPLIFT_ELEVATED: 0.10
    precision: "components rounded to 2 decimals round_half_up; the final total is ceil()'d to a whole hour"
    note: "Tier boundary is inclusive on the upper bound: aa_hours_last_year 2000 gives BASE_TIER 24, 2001 gives 40. Worked example: aa_hours 9000 (BASE_TIER 40), categories {ERISA_AUDIT, PUBLIC_INTEREST} (8 + 12 = 20), posture ELEVATED (uplift 0.10) -> component_base 44.00, component_must_sel 22.00, total_scope_hours 66."

  - name: peer_review_rating
    trigger: "POST /peer-reviews/{peer_review_id}/transitions {to_state: RATING_DRAFTED}; writes PeerReview.rating and scope_limitation_count"
    algorithm: threshold
    formula: |
      S = { s IN PeerReviewSelection : s.peer_review_id == peer_review.id AND s.status == COMMITTED }
      scope_limitation_count       = |{ s IN S : s.is_scope_limitation == true }|
      significant_deficiency_count = |{ s IN S : s.disposition == SIGNIFICANT_DEFICIENCY }|
      deficiency_count             = |{ s IN S : s.disposition == DEFICIENCY }|
      ffc_count                    = |{ s IN S : s.disposition == FFC }|
      must_select_non_conforming   = |{ s IN S : s.non_conforming == true AND s.must_select_category != null }|
      non_conforming_count         = |{ s IN S : s.non_conforming == true }|
      # First matching clause wins; evaluated strictly top to bottom.
      rating = FAIL if (significant_deficiency_count >= 1
                        OR must_select_non_conforming >= 1
                        OR scope_limitation_count >= 2)
             else PASS_WITH_DEFICIENCY if (deficiency_count >= 1
                        OR non_conforming_count >= 1
                        OR scope_limitation_count == 1)
             else PASS
    input_set: "COMMITTED PeerReviewSelection rows only; WITHDRAWN selections are excluded from every count, so withdrawing the sole non-conforming selection moves a would-be PASS_WITH_DEFICIENCY back to PASS."
    constants:
      FAIL_SCOPE_LIMITATION_AT: 2
      PWD_SCOPE_LIMITATION_AT: 1
    precision: "enum"
    note: "FFC (find-for-further-consideration) dispositions alone never change the rating: a review whose only matters are FFC rates PASS, and ffc_count is computed purely for the report narrative. Boundary: scope_limitation_count 1 gives PASS_WITH_DEFICIENCY, 2 gives FAIL."

validations:
  # ---- 1-3: authentication and authorization ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "for an entity_backed role, X-User-ID resolves to an existing row of the backing entity (Partner for the four firm roles, PeerReviewer for PeerReviewer)"
    error_id: ERR_ROLE_IDENTITY_UNKNOWN
    http_status: 403
    applies_to: "all endpoints whose roles include an entity_backed role"
  # ---- 4-9: existence, path segments validated left to right, then body foreign keys ----
  - priority: 4
    category: existence
    check: "{firm_id} path segment resolves"
    error_id: ERR_FIRM_NOT_FOUND
    http_status: 404
    applies_to: "all /firms/{firm_id}/... endpoints"
  - priority: 5
    category: existence
    check: "{engagement_id} path segment resolves"
    error_id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /engagements/{engagement_id}/... endpoints"
  - priority: 6
    category: existence
    check: "the remaining path resource resolves, each to its own error: {eqr_id} -> ERR_QUALITY_REVIEW_NOT_FOUND, {risk_id} -> ERR_QUALITY_RISK_NOT_FOUND, {response_id} -> ERR_RISK_RESPONSE_NOT_FOUND, {inspection_id} -> ERR_INSPECTION_NOT_FOUND, {selection_id} under /inspection-selections -> ERR_INSPECTION_SELECTION_NOT_FOUND, {finding_id} -> ERR_FINDING_NOT_FOUND, {rca_id} -> ERR_RCA_NOT_FOUND, {plan_id} -> ERR_REMEDIATION_PLAN_NOT_FOUND, {reviewer_id} -> ERR_PEER_REVIEWER_NOT_FOUND, {peer_review_id} -> ERR_PEER_REVIEW_NOT_FOUND, {selection_id} under /peer-reviews/... -> ERR_PEER_REVIEW_SELECTION_NOT_FOUND, {cap_id} -> ERR_CORRECTIVE_ACTION_PLAN_NOT_FOUND, {partner_id} -> ERR_PARTNER_NOT_FOUND"
    error_id: ERR_FINDING_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id other than firm_id or engagement_id"
  - priority: 7
    category: existence
    check: "body Partner references resolve: engagement_partner_id, reviewer_partner_id, owner_partner_id"
    error_id: ERR_PARTNER_NOT_FOUND
    http_status: 404
    applies_to: "POST /engagements, POST /engagements/{engagement_id}/quality-reviews, POST /inspection-findings/{finding_id}/remediation-plans"
  - priority: 8
    category: existence
    check: "body root_cause_analysis_id resolves"
    error_id: ERR_RCA_NOT_FOUND
    http_status: 404
    applies_to: "POST /inspection-findings/{finding_id}/remediation-plans"
  - priority: 9
    category: existence
    check: "body engagement_id and reviewer_id resolve"
    error_id: ERR_ENGAGEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /peer-reviews/{peer_review_id}/selections, POST /peer-reviews/{peer_review_id}/reviewer-assignment"
  # ---- 10-12: request-shape checks ----
  - priority: 10
    category: business_constraint
    check: "every required input field of the endpoint is present and typed correctly, and numeric fields honour their declared ranges (likelihood 1..5, impact 1..5, action_count 1..20, action_specificity_score 0.00..10.00, hours_committed 1..200, target_engagement_count >= 1, cpe_hours_last_3y >= 0)"
    error_id: ERR_VALIDATION_FAILED
    http_status: 422
    applies_to: "all POST, PUT, PATCH endpoints"
  - priority: 11
    category: business_constraint
    check: "every enum-typed input value is a member of the declared set for that field (including to_state, basis, severity_index_basis, outcome, disposition, classification, pervasiveness)"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all POST, PUT, PATCH endpoints with enum inputs"
  - priority: 12
    category: business_constraint
    check: "limit in 1..100 and offset >= 0"
    error_id: ERR_PAGINATION_OUT_OF_RANGE
    http_status: 422
    applies_to: "all list endpoints"
  # ---- 13-14: ownership and firm isolation ----
  - priority: 13
    category: auth
    check: "an entity_backed actor operating on a resource it must own matches the resource's owner field: EngagementPartner vs Engagement.engagement_partner_id, EngagementQualityReviewer vs EngagementQualityReview.reviewer_partner_id, PeerReviewer vs PeerReview.assigned_reviewer_id, plan submitter/completer vs RemediationPlan.owner_partner_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /engagements/{engagement_id}/workflow-transitions, POST /engagements/{engagement_id}/file-transitions, POST /quality-reviews/{eqr_id}/transitions, POST /peer-reviews/{peer_review_id}/scope, POST /peer-reviews/{peer_review_id}/transitions, POST /peer-reviews/{peer_review_id}/selections, DELETE /peer-reviews/{peer_review_id}/selections/{selection_id}, POST /peer-review-selections/{selection_id}/disposition, POST /remediation-plans/{plan_id}/transitions"
  - priority: 14
    category: auth
    check: "a Partner-backed actor's firm_id equals the firm_id of the resource being acted on (resolved through the resource's own FK chain)"
    error_id: ERR_CROSS_FIRM_ACCESS_DENIED
    http_status: 403
    applies_to: "all endpoints acted on by FirmManagingPartner, EngagementPartner, QualityControlDirector or EngagementQualityReviewer"
  # ---- 15: optimistic concurrency ----
  - priority: 15
    category: state
    check: "the expected_<parent>_version in the body equals the parent's current version: expected_engagement_version on quality-review create, expected_finding_version on remediation-plan create, expected_peer_review_version on selection create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /engagements/{engagement_id}/quality-reviews, POST /inspection-findings/{finding_id}/remediation-plans, POST /peer-reviews/{peer_review_id}/selections"
  # ---- 16-22: state preconditions on the target resource ----
  - priority: 16
    category: state
    check: "the requested to_state is reachable from the resource's current state per the entity's state machine"
    error_id: ERR_INVALID_TRANSITION
    http_status: 409
    applies_to: "all /transitions endpoints, POST /root-cause-analyses/{rca_id}/validation, POST /corrective-action-plans/{cap_id}/evidence, POST /corrective-action-plans/{cap_id}/disposition, DELETE /peer-reviews/{peer_review_id}/selections/{selection_id}"
  - priority: 17
    category: state
    check: "engagement.file_state != LOCKED"
    error_id: ERR_ENGAGEMENT_FILE_LOCKED
    http_status: 409
    applies_to: "POST /engagements/{engagement_id}/workflow-transitions, POST /engagements/{engagement_id}/file-transitions, POST /engagements/{engagement_id}/quality-reviews"
  - priority: 18
    category: state
    check: "engagement.workflow_state IN {FIELDWORK, EQR_PENDING} when assigning an engagement quality reviewer"
    error_id: ERR_ENGAGEMENT_NOT_IN_EQR_WINDOW
    http_status: 409
    applies_to: "POST /engagements/{engagement_id}/quality-reviews"
  - priority: 19
    category: state
    check: "the finding's InternalInspection.state == IN_PROGRESS when raising or classifying a finding"
    error_id: ERR_INSPECTION_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /inspection-selections/{selection_id}/findings, POST /inspection-findings/{finding_id}/classification"
  - priority: 20
    category: state
    check: "the engagement quality review is not sitting in CONCERNS_RAISED when concurrence is requested"
    error_id: ERR_UNRESOLVED_CONCERNS
    http_status: 409
    applies_to: "POST /quality-reviews/{eqr_id}/transitions"
  - priority: 21
    category: state
    check: "peer_review.state IN {SCOPE_SET, FIELDWORK} when committing or withdrawing selections or recording a disposition"
    error_id: ERR_PEER_REVIEW_ALREADY_RATED
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/selections, DELETE /peer-reviews/{peer_review_id}/selections/{selection_id}, POST /peer-review-selections/{selection_id}/disposition"
  - priority: 22
    category: state
    check: "finding.state == REMEDIATED when verifying; a finding already in VERIFIED is rejected"
    error_id: ERR_FINDING_ALREADY_VERIFIED
    http_status: 409
    applies_to: "POST /inspection-findings/{finding_id}/transitions"
  # ---- 23-29: cross-entity state dependencies ----
  - priority: 23
    category: state
    check: "when engagement.eqr_required == true, an EngagementQualityReview of the engagement is in state CONCURRED before EQR_PENDING -> EQR_CLEARED"
    error_id: ERR_EQR_NOT_CONCURRED
    http_status: 409
    applies_to: "POST /engagements/{engagement_id}/workflow-transitions"
  - priority: 24
    category: state
    check: "the engagement behind the inspection selection has workflow_state == REPORT_RELEASED before a finding may be raised on it"
    error_id: ERR_ENGAGEMENT_NOT_RELEASED
    http_status: 409
    applies_to: "POST /inspection-selections/{selection_id}/findings"
  - priority: 25
    category: state
    check: "the referenced RootCauseAnalysis.state == VALIDATED before a RemediationPlan may be created"
    error_id: ERR_RCA_NOT_VALIDATED
    http_status: 409
    applies_to: "POST /inspection-findings/{finding_id}/remediation-plans"
  - priority: 26
    category: state
    check: "the firm's InternalInspection with the highest inspection_year exists and has state == CONCLUDED before SCOPE_SET -> FIELDWORK"
    error_id: ERR_INSPECTION_NOT_CONCLUDED
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/transitions"
  - priority: 27
    category: state
    check: "every InspectionFinding of the cycle has classification != UNCLASSIFIED before IN_PROGRESS -> FINDINGS_CLASSIFIED"
    error_id: ERR_UNCLASSIFIED_FINDINGS_PRESENT
    http_status: 409
    applies_to: "POST /internal-inspections/{inspection_id}/transitions"
  - priority: 28
    category: state
    check: "every COMMITTED PeerReviewSelection has disposition != NONE before FIELDWORK -> RATING_DRAFTED"
    error_id: ERR_SELECTION_DISPOSITION_MISSING
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/transitions"
  - priority: 29
    category: state
    check: "peer_review.rating == PASS when the committee accepts directly from REPORT_ISSUED"
    error_id: ERR_CORRECTIVE_ACTION_OUTSTANDING
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/transitions"
  # ---- 30-32: referential integrity across aggregates ----
  - priority: 30
    category: business_referential
    check: "the candidate reviewer_partner_id belongs to the same firm as the engagement, and a RemediationPlan.owner_partner_id belongs to the same firm as the finding's inspection"
    error_id: ERR_PARTNER_FIRM_MISMATCH
    http_status: 409
    applies_to: "POST /engagements/{engagement_id}/quality-reviews, POST /inspection-findings/{finding_id}/remediation-plans, POST /engagements"
  - priority: 31
    category: business_referential
    check: "the selected engagement's firm_id equals peer_review.firm_id"
    error_id: ERR_ENGAGEMENT_FIRM_MISMATCH
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/selections"
  - priority: 32
    category: business_referential
    check: "the RootCauseAnalysis named by root_cause_analysis_id has finding_id equal to the path finding, and a validation call's rca belongs to the finding it advances"
    error_id: ERR_RCA_FINDING_MISMATCH
    http_status: 409
    applies_to: "POST /inspection-findings/{finding_id}/remediation-plans, POST /root-cause-analyses/{rca_id}/validation"
  # ---- 33-42: safety, objectivity, independence and segregation of duties ----
  - priority: 33
    category: business_safety
    check: "the candidate engagement quality reviewer is not the engagement partner of the engagement"
    error_id: ERR_EQR_SELF_REVIEW
    http_status: 403
    applies_to: "POST /engagements/{engagement_id}/quality-reviews"
  - priority: 34
    category: business_safety
    check: "the candidate engagement quality reviewer has status == ACTIVE"
    error_id: ERR_PARTNER_INACTIVE
    http_status: 409
    applies_to: "POST /engagements/{engagement_id}/quality-reviews"
  - priority: 35
    category: business_safety
    check: "the candidate engagement quality reviewer carries the EQ_REVIEWER designation and cpe_hours_last_3y >= 120"
    error_id: ERR_CPE_REQUIREMENT_NOT_MET
    http_status: 409
    applies_to: "POST /engagements/{engagement_id}/quality-reviews"
  - priority: 36
    category: business_safety
    check: "engagement.client_name is not in the candidate reviewer's independence_conflict_client_names, and firm.legal_name is not in an explicitly named PeerReviewer's independence_conflict_firm_names"
    error_id: ERR_REVIEWER_INDEPENDENCE_CONFLICT
    http_status: 409
    applies_to: "POST /engagements/{engagement_id}/quality-reviews, POST /peer-reviews/{peer_review_id}/reviewer-assignment"
  - priority: 37
    category: business_safety
    check: "objectivity_attested == true in the quality-review create body"
    error_id: ERR_OBJECTIVITY_NOT_ATTESTED
    http_status: 422
    applies_to: "POST /engagements/{engagement_id}/quality-reviews"
  - priority: 38
    category: business_safety
    check: "days(engagement.period_end - the reviewer's exit_date for that client) >= 730 when the reviewer previously served on the client's engagement team"
    error_id: ERR_COOLING_OFF_NOT_MET
    http_status: 409
    applies_to: "POST /engagements/{engagement_id}/quality-reviews"
  - priority: 39
    category: business_safety
    check: "an explicitly named PeerReviewer is not one of firm.prior_reviewer_ids (reviewer rotation)"
    error_id: ERR_REVIEWER_ROTATION_REQUIRED
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/reviewer-assignment"
  - priority: 40
    category: business_safety
    check: "the acting QualityControlDirector is not the engagement partner of the engagement the finding is raised on"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /inspection-selections/{selection_id}/findings"
  - priority: 41
    category: business_safety
    check: "the actor returning or accepting a RemediationPlan is not the plan's owner_partner_id, and the actor verifying a finding is not the owner of the finding's COMPLETED plan"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /remediation-plans/{plan_id}/transitions, POST /inspection-findings/{finding_id}/transitions"
  - priority: 42
    category: business_safety
    check: "firm.risk_posture != CRITICAL when accepting a new engagement whose engagement_type IN {ERISA_AUDIT, SINGLE_AUDIT, BROKER_DEALER}"
    error_id: ERR_ACCEPTANCE_FROZEN
    http_status: 409
    applies_to: "POST /engagements"
  # ---- 43-45: temporal windows ----
  - priority: 43
    category: business_temporal
    check: "an explicitly named PeerReviewer has no pre-report PeerReview whose window, extended by the 5-day travel buffer, collides with this review's window"
    error_id: ERR_REVIEWER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/reviewer-assignment"
  - priority: 44
    category: business_temporal
    check: "days(logical_clock_date - engagement.report_release_date) <= 60 when locking the documentation file"
    error_id: ERR_DOCUMENTATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /engagements/{engagement_id}/file-transitions"
  - priority: 45
    category: business_temporal
    check: "logical clock date <= corrective_action_plan.due_date when submitting evidence"
    error_id: ERR_CORRECTIVE_ACTION_PAST_DUE
    http_status: 409
    applies_to: "POST /corrective-action-plans/{cap_id}/evidence"
  - priority: 46
    category: business_temporal
    check: "the selected engagement's period_end <= peer_review.year_end"
    error_id: ERR_ENGAGEMENT_OUTSIDE_REVIEW_SCOPE
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/selections"
  # ---- 47-57: capacity, uniqueness and coverage constraints ----
  - priority: 47
    category: business_constraint
    check: "the candidate engagement quality reviewer has fewer than 3 overlapping open reviews (aggregate interval capacity)"
    error_id: ERR_EQR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /engagements/{engagement_id}/quality-reviews"
  - priority: 48
    category: business_constraint
    check: "no EngagementQualityReview of the engagement is already in state IN {ASSIGNED, IN_PROGRESS, CONCERNS_RAISED}"
    error_id: ERR_EQR_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /engagements/{engagement_id}/quality-reviews"
  - priority: 49
    category: business_safety
    check: "an explicitly named PeerReviewer has status == ACTIVE"
    error_id: ERR_REVIEWER_SUSPENDED
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/reviewer-assignment"
  - priority: 50
    category: business_safety
    check: "an explicitly named PeerReviewer has license_state == firm.state_code OR accepts_out_of_state == true"
    error_id: ERR_REVIEWER_STATE_NOT_LICENSED
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/reviewer-assignment"
  - priority: 51
    category: business_constraint
    check: "an explicitly named PeerReviewer has active_review_count < max_concurrent_reviews"
    error_id: ERR_REVIEWER_AT_CAPACITY
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/reviewer-assignment"
  - priority: 52
    category: business_constraint
    check: "the auto-selection candidate pool is non-empty when reviewer_id is omitted"
    error_id: ERR_NO_ELIGIBLE_REVIEWER
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/reviewer-assignment"
  - priority: 53
    category: business_constraint
    check: "no other PeerReviewSelection of the review with status == COMMITTED already names the same engagement"
    error_id: ERR_DUPLICATE_SELECTION
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/selections"
  - priority: 54
    category: business_constraint
    check: "unique keys hold: (firm_id, inspection_year) on InternalInspection -> ERR_DUPLICATE_INSPECTION_YEAR; (firm_id, component, quality_objective_code) on QualityRisk -> ERR_DUPLICATE_QUALITY_OBJECTIVE; (firm_id, client_name, period_end) on Engagement -> ERR_DUPLICATE_ENGAGEMENT"
    error_id: ERR_DUPLICATE_INSPECTION_YEAR
    http_status: 409
    applies_to: "POST /firms/{firm_id}/internal-inspections, POST /firms/{firm_id}/quality-risks, POST /engagements"
  - priority: 55
    category: business_constraint
    check: "classification == MATERIAL_FAILURE is accompanied by affects_report_conclusion == true"
    error_id: ERR_MATERIAL_FAILURE_REQUIRES_REPORT_IMPACT
    http_status: 422
    applies_to: "POST /inspection-findings/{finding_id}/classification"
  - priority: 56
    category: business_constraint
    check: "basis == OPERATING_BASIS requires at least one RiskResponse of the risk with status == TESTED"
    error_id: ERR_NO_TESTED_RESPONSE
    http_status: 409
    applies_to: "POST /quality-risks/{risk_id}/evaluations"
  - priority: 57
    category: business_constraint
    check: "the reviewer named at assignment (or selected) is qualified for every category in firm_must_select_categories, re-checked at scope determination"
    error_id: ERR_MUST_SELECT_CATEGORY_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/reviewer-assignment, POST /peer-reviews/{peer_review_id}/scope"
  - priority: 58
    category: business_constraint
    check: "every category in peer_review.must_select_categories is covered by a COMMITTED selection before SCOPE_SET -> FIELDWORK"
    error_id: ERR_MUST_SELECT_CATEGORY_NOT_COVERED
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/transitions"
  - priority: 59
    category: business_constraint
    check: "inspection.engagements_selected_count >= 1 before SELECTION_COMPLETE -> IN_PROGRESS, and must_select_coverage_pct == 100.00 before CONCLUDED, and no SIGNIFICANT_DEFICIENCY or MATERIAL_FAILURE finding is left outside {REMEDIATION_ASSIGNED, REMEDIATED, VERIFIED}"
    error_id: ERR_MUST_SELECT_COVERAGE_INCOMPLETE
    http_status: 409
    applies_to: "POST /internal-inspections/{inspection_id}/transitions"
  - priority: 60
    category: business_constraint
    check: "completed_action_count == action_count before ACCEPTED -> COMPLETED, and the finding's plan is COMPLETED before REMEDIATED -> VERIFIED"
    error_id: ERR_REMEDIATION_ACTIONS_INCOMPLETE
    http_status: 409
    applies_to: "POST /remediation-plans/{plan_id}/transitions, POST /inspection-findings/{finding_id}/transitions"
  # ---- 59-60: fiscal checks run last ----
  - priority: 61
    category: business_fiscal
    check: "hours_committed <= peer_review.unallocated_hours"
    error_id: ERR_SCOPE_HOURS_EXCEEDED
    http_status: 409
    applies_to: "POST /peer-reviews/{peer_review_id}/selections"
  - priority: 62
    category: business_fiscal
    check: "plan.acceptance_score >= 7.00 before SUBMITTED -> ACCEPTED"
    error_id: ERR_ACCEPTANCE_SCORE_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /remediation-plans/{plan_id}/transitions"

validation_priority_notes:
  - pair: "state (priority 18) vs business_safety (priority 38)"
    endpoint: "POST /engagements/{engagement_id}/quality-reviews"
    scenario: "The engagement is already REPORT_RELEASED AND the candidate reviewer left the client's engagement team only 400 days before period_end."
    winner: ERR_ENGAGEMENT_NOT_IN_EQR_WINDOW
  - pair: "business_referential (priority 31) vs business_fiscal (priority 61)"
    endpoint: "POST /peer-reviews/{peer_review_id}/selections"
    scenario: "The named engagement belongs to a different firm AND hours_committed exceeds unallocated_hours."
    winner: ERR_ENGAGEMENT_FIRM_MISMATCH
  - pair: "business_temporal (priority 43) vs business_constraint (priority 51)"
    endpoint: "POST /peer-reviews/{peer_review_id}/reviewer-assignment"
    scenario: "The explicitly named reviewer's existing window collides within the 5-day buffer AND the reviewer is already at max_concurrent_reviews."
    winner: ERR_REVIEWER_WINDOW_CONFLICT

endpoints:
  # =========================================================================
  # READS. Every FK declared in §1.1 is reverse-reachable through the flat
  # filtered-list form `GET /<child-collection>` carrying the FK field as an
  # optional filter; each child collection also exposes a single-resource GET
  # so its collection segment is unambiguous. All list reads accept `limit?`
  # (default 50, max 200) and `offset?` (default 0) and reject a negative or
  # over-max value with ERR_PAGINATION_OUT_OF_RANGE.
  # =========================================================================
  - method: GET
    path: "/firms"
    description: "List firms enrolled in a peer review program."
    roles: [SystemAdmin, PeerReviewCommittee, FirmManagingPartner, QualityControlDirector]
    code: 200
    input: ["enrolled_program?", "risk_posture?", "limit?", "offset?"]
    output: Firm[]
    side_effects: []
  - method: GET
    path: "/firms/{firm_id}"
    description: "Read one firm, including the denormalised quality counters and risk_posture."
    roles: [SystemAdmin, PeerReviewCommittee, FirmManagingPartner, QualityControlDirector, PeerReviewer]
    code: 200
    input: []
    output: Firm
    side_effects: []
  - method: GET
    path: "/firms/{firm_id}/quality-management-summary"
    description: "Computed read: current SQM posture of the firm - risk_posture, critical_risk_count, open_deficiency_count, open_material_failure_count, last_peer_review_rating, unassigned_review_flag, must_select_categories the firm would attract this cycle, and the latest InternalInspection state."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, PeerReviewCommittee]
    code: 200
    input: []
    output: Firm
    side_effects: []
  - method: GET
    path: "/partners"
    description: "List partners; filter by firm_id for reverse lookup of Partner.firm_id."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, PeerReviewer, PeerReviewCommittee]
    code: 200
    input: ["firm_id?", "status?", "eqr_eligible?", "limit?", "offset?"]
    output: Partner[]
    side_effects: []
  - method: GET
    path: "/partners/{partner_id}"
    description: "Read one partner, including designations, cpe_hours_last_3y, independence data and the open_eqr_count counter."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, EngagementQualityReviewer, PeerReviewer]
    code: 200
    input: []
    output: Partner
    side_effects: []
  - method: GET
    path: "/engagements"
    description: "List engagements; filter by firm_id (reverse lookup of Engagement.firm_id) or engagement_partner_id (reverse lookup of Engagement.engagement_partner_id)."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, EngagementPartner, EngagementQualityReviewer, PeerReviewer]
    code: 200
    input: ["firm_id?", "engagement_partner_id?", "workflow_state?", "file_state?", "engagement_type?", "eqr_required?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []
  - method: GET
    path: "/engagements/{engagement_id}"
    description: "Read one engagement, including risk_score, eqr_required, workflow_state, file_state and reopened_count."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, EngagementPartner, EngagementQualityReviewer, PeerReviewer]
    code: 200
    input: []
    output: Engagement
    side_effects: []
  - method: GET
    path: "/quality-risks"
    description: "List SQM quality risks; filter by firm_id for reverse lookup of QualityRisk.firm_id."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, PeerReviewer]
    code: 200
    input: ["firm_id?", "component?", "state?", "severity_band?", "limit?", "offset?"]
    output: QualityRisk[]
    side_effects: []
  - method: GET
    path: "/quality-risks/{risk_id}"
    description: "Read one quality risk, including inherent_risk_score, residual_risk_score, evaluation_basis and severity_band."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, PeerReviewer]
    code: 200
    input: []
    output: QualityRisk
    side_effects: []
  - method: GET
    path: "/risk-responses"
    description: "List risk responses; filter by quality_risk_id for reverse lookup of RiskResponse.quality_risk_id."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, PeerReviewer]
    code: 200
    input: ["quality_risk_id?", "status?", "response_type?", "limit?", "offset?"]
    output: RiskResponse[]
    side_effects: []
  - method: GET
    path: "/risk-responses/{response_id}"
    description: "Read one risk response, including design_effectiveness, operating_effectiveness and status."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, PeerReviewer]
    code: 200
    input: []
    output: RiskResponse
    side_effects: []
  - method: GET
    path: "/quality-reviews"
    description: "List engagement quality reviews; filter by engagement_id (reverse lookup of EngagementQualityReview.engagement_id) or reviewer_partner_id (reverse lookup of EngagementQualityReview.reviewer_partner_id)."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, EngagementPartner, EngagementQualityReviewer, PeerReviewer]
    code: 200
    input: ["engagement_id?", "reviewer_partner_id?", "state?", "limit?", "offset?"]
    output: EngagementQualityReview[]
    side_effects: []
  - method: GET
    path: "/quality-reviews/{eqr_id}"
    description: "Read one engagement quality review, including cooling_off_days_at_assignment, concern_round_count and last_concern_summary."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, EngagementPartner, EngagementQualityReviewer]
    code: 200
    input: []
    output: EngagementQualityReview
    side_effects: []
  - method: GET
    path: "/internal-inspections"
    description: "List internal inspection cycles; filter by firm_id for reverse lookup of InternalInspection.firm_id."
    roles: [SystemAdmin, FirmManagingPartner, QualityControlDirector, PeerReviewer, PeerReviewCommittee]
    code: 200
    input: ["firm_id?", "inspection_year?", "state?", "limit?", "offset?"]
    output: InternalInspection[]
    side_effects: []
  - method: GET
