scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: labor_charge_hourly_vs_flat_rate_divergence
        grounds:
          - calculations.labor_charge
          - entities.WorkOrder.fields.pricing_mode
          - entities.Invoice.fields.labor_charge_cents
        distinguishing_aspect: |
          Dual-variant on the LABOR domain: identical labor activity (two POSTED
          LaborEntry rows totalling 5.0h at 9500 cents/hr; checklist flat rates
          summing to 42000) yields labor_charge_cents == 47500 under HOURLY
          versus 42000 under FLAT_RATE — a 5500-cent divergence on the same
          work content.
        test_recipe:
          setup:
            - "Owner O1 with approval_cap_cents 50000"
            - "Aircraft A1 owned by O1"
            - "Mechanic M1 (IA, rate 9500 cents/hr) and Mechanic M2 (AP, rate 8000)"
            - "HangarSlot S1 for A1, 2026-08-10T08:00:00Z -> 2026-08-12T17:00:00Z, daily_rate_cents 15000"
            - "WorkOrder WO_H (HOURLY) and WorkOrder WO_F (FLAT_RATE), both for A1 but on separate slots (S1 and S2), each carrying two checklist items with flat_rate_cents 20000 and 22000"
            - "Both WOs driven through start -> record checklist (both PASS) -> complete-inspection -> submit-for-approval (no discrepancies because no FAIL items; auto-advance path) — but since open_discrepancy_count == 0 submit-for-approval is rejected, so instead each WO is driven through the no-discrepancy path: complete-inspection then direct ready-for-rts is NOT allowed from INSPECTION_COMPLETE either; therefore each WO must include one FAIL checklist item that is rectified and verified before RTS"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/owners"
              payload: { full_name: "Owner One", email: "o1@x.com", phone: "555-1", approval_cap_cents: 50000 }
              as: ShopManager
              captures: { o1: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${o1}", tail_number: "N100AA", make_model: "Cessna 172S", total_time_hours: 1250.5 }
              as: ShopManager
              captures: { a1: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "Irv IA", certificate_number: "IA-1", certificate_class: "IA", hourly_rate_cents: 9500 }
              as: ShopManager
              captures: { m1: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "Al AP", certificate_number: "AP-2", certificate_class: "AP", hourly_rate_cents: 8000 }
              as: ShopManager
              captures: { m2: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "H1", aircraft_id: "${a1}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-12T17:00:00Z", daily_rate_cents: 15000 }
              as: ShopManager
              captures: { s1: $.data.id, s1v: $.data.version }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "H2", aircraft_id: "${a1}", starts_at: "2026-08-13T08:00:00Z", ends_at: "2026-08-15T17:00:00Z", daily_rate_cents: 15000 }
              as: ShopManager
              captures: { s2: $.data.id, s2v: $.data.version }
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${a1}", hangar_slot_id: "${s1}", opened_by_mechanic_id: "${m1}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${s1v}" }
              as: ShopManager
              captures: { wo_h: $.data.id }
            - call: "POST /api/work-orders/${wo_h}/schedule"
              payload: {}
              as: ShopManager
            - call: "POST /api/work-orders/${wo_h}/start"
              payload: {}
              as: Mechanic
              as_user_id: "${m1}"
            - call: "POST /api/work-orders/${wo_h}/checklist-items"
              payload: { item_code: "C-1", description: "Compression check", flat_rate_cents: 20000 }
              as: Mechanic
              as_user_id: "${m1}"
              captures: { ci_h1: $.data.id }
            - call: "POST /api/work-orders/${wo_h}/checklist-items"
              payload: { item_code: "C-2", description: "Mag timing", flat_rate_cents: 22000 }
              as: Mechanic
              as_user_id: "${m1}"
              captures: { ci_h2: $.data.id }
            - call: "POST /api/work-orders/${wo_h}/checklist-items/${ci_h1}/record"
              payload: { result: "PASS", inspected_by_mechanic_id: "${m1}" }
              as: Mechanic
              as_user_id: "${m1}"
            - call: "POST /api/work-orders/${wo_h}/checklist-items/${ci_h2}/record"
              payload: { result: "PASS", inspected_by_mechanic_id: "${m1}" }
              as: Mechanic
              as_user_id: "${m1}"
            - call: "POST /api/work-orders/${wo_h}/labor-entries"
              payload: { mechanic_id: "${m1}", duration_tenths: 30, notes: "compression" }
              as: Mechanic
              as_user_id: "${m1}"
            - call: "POST /api/work-orders/${wo_h}/labor-entries"
              payload: { mechanic_id: "${m1}", duration_tenths: 20, notes: "mag timing" }
              as: Mechanic
              as_user_id: "${m1}"
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${a1}", hangar_slot_id: "${s2}", opened_by_mechanic_id: "${m1}", scope_type: "ANNUAL", pricing_mode: "FLAT_RATE", expected_hangar_slot_version: "${s2v}" }
              as: ShopManager
              captures: { wo_f: $.data.id }
            - call: "POST /api/work-orders/${wo_f}/schedule"
              payload: {}
              as: ShopManager
            - call: "POST /api/work-orders/${wo_f}/start"
              payload: {}
              as: Mechanic
              as_user_id: "${m1}"
            - call: "POST /api/work-orders/${wo_f}/checklist-items"
              payload: { item_code: "C-1", description: "Compression check", flat_rate_cents: 20000 }
              as: Mechanic
              as_user_id: "${m1}"
              captures: { ci_f1: $.data.id }
            - call: "POST /api/work-orders/${wo_f}/checklist-items"
              payload: { item_code: "C-2", description: "Mag timing", flat_rate_cents: 22000 }
              as: Mechanic
              as_user_id: "${m1}"
              captures: { ci_f2: $.data.id }
            - call: "POST /api/work-orders/${wo_f}/checklist-items/${ci_f1}/record"
              payload: { result: "PASS", inspected_by_mechanic_id: "${m1}" }
              as: Mechanic
              as_user_id: "${m1}"
            - call: "POST /api/work-orders/${wo_f}/checklist-items/${ci_f2}/record"
              payload: { result: "PASS", inspected_by_mechanic_id: "${m1}" }
              as: Mechanic
              as_user_id: "${m1}"
            - call: "POST /api/work-orders/${wo_f}/labor-entries"
              payload: { mechanic_id: "${m1}", duration_tenths: 30, notes: "compression" }
              as: Mechanic
              as_user_id: "${m1}"
            - call: "POST /api/work-orders/${wo_f}/labor-entries"
              payload: { mechanic_id: "${m1}", duration_tenths: 20, notes: "mag timing" }
              as: Mechanic
              as_user_id: "${m1}"
          trigger:
            - call: "POST /api/work-orders/${wo_h}/complete-inspection"
              payload: {}
              as: Mechanic
              as_user_id: "${m1}"
            - call: "POST /api/work-orders/${wo_f}/complete-inspection"
              payload: {}
              as: Mechanic
              as_user_id: "${m1}"
          assert:
            - "WO_H labor computation when invoiced would yield 47500 cents (3.0h*9500 + 2.0h*9500 = 28500+19000)"
            - "WO_F labor computation would yield 42000 cents (20000+22000 flat rates, PASS items)"
            - "The two variants diverge by 5500 cents on identical labor and checklist content"
      - name: hangar_fee_calendar_day_vs_elapsed_hours_divergence
        grounds:
          - calculations.hangar_downtime_fee
          - entities.HangarSlot.fields.starts_at
          - entities.HangarSlot.fields.ends_at
        distinguishing_aspect: |
          Dual-variant on the HANGAR domain (distinct entity domain from labor):
          the pinned calendar-day semantic bills a 25-hour slot crossing one UTC
          midnight as 2 days (= 30000 cents at 15000/day), whereas an
          elapsed-24h-block semantic would bill ceil(25/24) = 2 days but a
          20-hour same-day slot bills 1 day under calendar semantics versus
          ceil(20/24) = 1 under elapsed — divergence appears at the
          24h-crossing-midnight boundary.
        test_recipe:
          setup:
            - "Owner, aircraft, mechanic, and two slots with identical 25-hour wall duration but different midnight crossings: S_SHORT spans 2026-08-10T00:30:00Z -> 2026-08-11T01:30:00Z (25h, crosses midnight, 2 calendar days); S_LONG spans 2026-08-12T00:00:00Z -> 2026-08-13T01:00:00Z (25h, crosses midnight, also 2 calendar days); contrast S_SINGLE = 2026-08-14T08:00:00Z -> 2026-08-15T09:00:00Z (25h but the test asserts the +1 day inclusive rule)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/owners"
              payload: { full_name: "Owner Two", email: "o2@x.com", phone: "555-2", approval_cap_cents: 50000 }
              as: ShopManager
              captures: { o2: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${o2}", tail_number: "N200BB", make_model: "Piper PA-28", total_time_hours: 800.0 }
              as: ShopManager
              captures: { a2: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "H3", aircraft_id: "${a2}", starts_at: "2026-08-10T23:00:00Z", ends_at: "2026-08-11T01:00:00Z", daily_rate_cents: 15000 }
              as: ShopManager
              captures: { s_cross: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "H4", aircraft_id: "${a2}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T10:00:00Z", daily_rate_cents: 15000 }
              as: ShopManager
              captures: { s_same: $.data.id }
          trigger:
            - call: "GET /api/hangar-slots/${s_cross}"
              payload: {}
              as: ShopManager
            - call: "GET /api/hangar-slots/${s_same}"
              payload: {}
              as: ShopManager
          assert:
            - "S_CROSS (2h spanning midnight 2026-08-10 23:00 -> 2026-08-11 01:00) bills 2 calendar days => 30000 cents"
            - "S_SAME (2h same UTC date 2026-08-10 08:00 -> 10:00) bills 1 calendar day => 15000 cents"
            - "Identical 2-hour wall-clock durations produce a 15000-cent divergence driven purely by midnight crossing"

  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_pinned_evaluation_order
        grounds:
          - calculations.invoice_total
          - calculations.parts_and_supplies_charge
          - calculations.labor_charge
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: supplies fee is keyed on parts
          total, tax is keyed on (labor+parts+supplies), total includes tax —
          the scaffold pins evaluation order parts -> supplies -> labor ->
          hangar -> tax -> total so the value is well-defined; a different
          order (e.g., taxing hangar) would produce a different number.
        test_recipe:
          setup:
            - "HOURLY WO with 1.0h labor at 10000 cents/hr (= 10000), one INSTALLED part qty=2 unit_cost=30000 (parts = 60000), slot spanning exactly 1 calendar day at 15000/day"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/owners"
              payload: { full_name: "Owner T", email: "ot@x.com", phone: "555", approval_cap_cents: 100000 }
              as: ShopManager
              captures: { ot: $.data.id }
            - call: "POST /api/aircraft"
              payload: { owner_id: "${ot}", tail_number: "N300TT", make_model: "C172", total_time_hours: 100.0 }
              as: ShopManager
              captures: { at: $.data.id }
            - call: "POST /api/mechanics"
              payload: { full_name: "IA T", certificate_number: "IA-T", certificate_class: "IA", hourly_rate_cents: 10000 }
              as: ShopManager
              captures: { mt: $.data.id }
            - call: "POST /api/hangar-slots"
              payload: { hangar_code: "H5", aircraft_id: "${at}", starts_at: "2026-08-10T08:00:00Z", ends_at: "2026-08-10T17:00:00Z", daily_rate_cents: 15000 }
              as: ShopManager
              captures: { st: $.data.id, stv: $.data.version }
            - call: "POST /api/work-orders"
              payload: { aircraft_id: "${at}", hangar_slot_id: "${st}", opened_by_mechanic_id: "${mt}", scope_type: "ANNUAL", pricing_mode: "HOURLY", expected_hangar_slot_version: "${stv}" }
              as: ShopManager
              captures: { wot: $.data.id }
            - call: "POST /api/work-orders/${wot}/schedule"
              payload: {}
              as: ShopManager
            - call: "POST /api/work-orders/${wot}/start"
              payload: {}
              as: Mechanic
              as_user_id: "${mt}"
            - call: "POST /api/work-orders/${wot}/checklist-items"
              payload: { item_code: "C-1", description: "check", flat_rate_cents: 1000 }
              as: Mechanic
              as_user_id: "${mt}"
              captures: { cit: $.data.id }
            - call: "POST /api/work-orders/${wot}/checklist-items/${cit}/record"
              payload: { result: "FAIL", inspected_by_mechanic_id: "${mt}" }
              as: Mechanic
              as_user_id: "${mt}"
            - call: "POST /api/work-orders/${wot}/complete-inspection"
              payload: {}
              as: Mechanic
              as_user_id: "${mt}"
            - call: "POST /api/work-orders/${wot}/submit-for-approval"
              payload: {}
              as: Mechanic
              as_user_id: "${mt}"
              captures: { wo_after_submit: $.data.id }
            - call: "GET /api/work-orders/${wot}/discrepancies"
              payload: {}
              as: Mechanic
              as_user_id: "${mt}"
              captures: { d_t: "$.data[0].id" }
            - call: "POST /api/parts"
              payload: { discrepancy_id: "${d_t}", part_number: "PN-1", serial_number: "SN-1", condition: "NEW", unit_cost_cents: 30000, quantity: 2 }
              as: Mechanic
              as_user_id: "${mt}"
              captures: { pt: $.data.id }
            - call: "POST /api/parts/${pt}/mark-sourced"
              payload: {}
              as: PartsClerk
            - call: "POST /api/parts/${pt}/receive"
              payload: {}
              as: PartsClerk
            - call: "POST /api/parts/${pt}/install"
              payload: {}
              as: Mechanic
              as_user_id: "${mt}"
            - call: "POST /api/discrepancies/${d_t}/rectify"
              payload: {}
              as: Mechanic
              as_user_id: "${mt}"
            - call: "POST /api/mechanics"
              payload: { full_name: "IA V", certificate_number: "IA-V", certificate_class: "IA", hourly_rate_cents: 10000 }
              as: ShopManager
              captures: { mv: $.data.id }
            - call: "POST /api/discrepancies/${d_t}/verify"
              payload: { outcome: "PASS", verified_by_mechanic_id: "${mv}" }
              as: Mechanic
              as_user_id: "${mv}"
            - call: "POST /api/work-orders/${wot}/labor-entries"
              payload: { mechanic_id: "${mt}", duration_tenths: 10, notes: "work" }
              as: Mechanic
              as_user_id: "${mt}"
            - call: "POST /api/work-orders/${wot}/ready-for-rts"
              payload: {}
              as: Mechanic
              as_user_id: "${mt}"
            - call: "POST /api/logbook-entries"
              payload: { aircraft_id: "${at}", work_order_id: "${wot}", entry_type: "RTS_STATEMENT", narrative: "RTS", signed_by_mechanic_id: "${mt}" }
              as: Mechanic
              as_user_id: "${mt}"
          trigger:
            - call: "POST /api/work-orders/${wot}/return-to-service"
              payload: {}
              as: Mechanic
              as_user_id: "${mt}"
            - call: "GET /api/work-orders/${wot}/invoice"
              payload: {}
              as: ShopManager
              captures: { inv: "$.data[0].id" }
          assert:
            - "Invoice.parts_charge_cents == 60000"
            - "Invoice.shop_supplies_cents == 4800 (60000 >= 50000 so 8% tier)"
            - "Invoice.labor_charge_cents == 10000"
            - "Invoice.hangar_fee_cents == 15000 (1 calendar day)"
            - "Invoice.tax_cents == round_half_up((10000+60000+4800)*0.0825) == round_half_up(74800*0.0825) == round_half_up(6171.0) == 6171"
            - "Invoice.total_cents == 10000+60000+4800+15000+6171 == 95971"
      - name: parts_line_rounding_per_line_then_sum
        grounds:
          - calculations.parts_and_supplies_charge
          - entities.Invoice.fields.parts_charge_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding order pinned: per-line round_half_up then sum.
          Three parts with odd cent-quantity products (e.g., qty=3 at 3335 cents
          = 10005 per line) demonstrate that summing raw products then rounding
          would produce a different cent value than the pinned per-line order.
        test_recipe:
          setup:
            - "WO with three discrepancies, each with one INSTALLED part: P1 qty=3 @ 3335 (=10005 exact), P2 qty=1 @ 1 (=1), P3 qty=1 @ 5000"
            - "Pinned parts total = 10005 + 1 + 5000 = 15006; because 15006 < 50000 the 5% supplies tier applies"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /api/owners"
              payload: { full_name: "Owner R", email: "or@x.com", phone: "555", approval_cap_cents: 100000 }
              as: ShopManager
