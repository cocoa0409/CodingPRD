              payload: { label: "PY2026", coverage_start: "2026-01-01", coverage_end: "2026-12-31", run_out_end: "2027-03-31", hsa_individual_cap_cents: 437500, hsa_family_cap_cents: 865000, hsa_catchup_cents: 100000, health_fsa_cap_cents: 335000, dcfsa_cap_joint_cents: 500000, dcfsa_cap_separate_cents: 250000 }
              as: PlanAdmin
              captures: { py_id: $.data.id }
            - call: "POST /participants"
              payload: { email: "b6b@x.com", full_name: "B6b", birth_date: "1990-01-01", marital_status: "SINGLE" }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /accounts"
              payload: { participant_id: "${p_id}", plan_year_id: "${py_id}", account_type: "DCFSA", elected_amount_cents: 500000, auto_adjudication_threshold_cents: 1000000 }
              as: PlanAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /claims"
              payload: { account_id: "${acc_id}", service_date: "2026-04-01", expense_category: "DEPENDENT_CARE", claimed_amount_cents: 30000, substantiated: true }
              as: Participant
              as_user_id: "${p_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Adjudicator
              as_user_id: "adj-1"
          assert:
            - "POST /claims/${claim_id}/adjudicate APPROVE returns 422 ERR_INSUFFICIENT_FUNDS (projected_basis = contributed 0 - reimbursed 0 = 0; reimbursable would be 0)"
            - "Claim.${claim_id}.status == SUBMITTED (unchanged)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
