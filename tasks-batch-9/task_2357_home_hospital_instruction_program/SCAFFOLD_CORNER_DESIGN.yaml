          assert:
            - "${err_cert_mismatch} == \"ERR_CERT_CASE_MISMATCH\" with HTTP 422 (certification ${cert_b_id} belongs to case B and is ACCEPTED, so only the mismatch rule can fire)."
            - "${err_cert_not_accepted} == \"ERR_CERT_NOT_ACCEPTED\" with HTTP 422 (same case, status REJECTED)."
            - "Enrollment change: HTTP 200, data.enrollment_status == \"WITHDRAWN\"."
            - "${err_new_case_withdrawn} == \"ERR_STUDENT_NOT_ENROLLED\" with HTTP 422; GET /hhi/cases?student_id=${stu_c_id} returns total_count == 0."
