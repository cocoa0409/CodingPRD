          trigger:
            - { call: "POST /comp/production-captures/${cap}/validate", payload: {}, as: CompAnalyst, as_user_id: an_1 }
          assert:
            - "ProductionCapture.${cap}.credited_wrvu == 0.97 (APP keeps full clinical credit)"
            - "GET /comp/physician-agreements/${agr_sup1} -> ytd_wrvu_credited == 0.32 (round_half_up(0.97*0.3333, 2) per assignment)"
            - "GET /comp/physician-agreements/${agr_sup2} -> ytd_wrvu_credited == 0.32"
            - "Sum of supervision allocations == 0.64, strictly less than round_half_up(0.97*0.6666, 2) == 0.65 — the sum-then-round order is observably rejected"
            - "GET /comp/production-captures/${cap}/supervision-credits returns exactly 2 SUPERVISION_CREDIT captures with credited_wrvu 0.32 each and source_capture_id == ${cap}"
            - "GET /comp/physician-agreements/${agr_app} -> ytd_wrvu_credited == 0.97"

      - name: statement_net_settlement_evaluation_order
        grounds:
          - calculations.statement_net_settlement
          - calculations.trueup_variance
          - entities.PhysicianAgreement.fields.pending_trueup_adjustment_cents
          - entities.CompStatement.fields.net_payment_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — net_payment includes trueup_adjustment while the
          true-up variance is defined over statement-recognized productivity. The scaffold pins the
          order: the true-up run reconciles FINALIZED (locked) periods only, posts its variance into
          agreement.pending_trueup_adjustment_cents, and the next statement SNAPSHOTS that field
          (never recomputing it from its own live fields), so S2 nets -6500000 cents; an
          implementation that recomputes from live captures would double-count the reversal.
        test_recipe:
          setup:
            - "ACTIVE plan (tiers T1 0@4500c bonus 0, T2 5000@5500c bonus 250000, T3 8000@6500c bonus 500000); physician fte 1.0 EFFECTIVE; rate 99285=5.00"
            - "S1 (2026-02) FINALIZED: captures 99285 x1000 (5000.00) and x200 (1000.00) validated -> earned 28000000, period_productivity 28000000, tier bonus 250000, net 27250000; lifetime_paid 27250000"
            - "The 200-unit capture then reversed via an accepted dispute (locked S1 unchanged; live ytd drops to 5000.00)"
            - "TrueUpRun as_of 2026-02 POSTED: recomputed closed-period earnings 22500000 - recognized 28000000 = variance -5500000 -> pending_trueup_adjustment_cents == -5500000"
