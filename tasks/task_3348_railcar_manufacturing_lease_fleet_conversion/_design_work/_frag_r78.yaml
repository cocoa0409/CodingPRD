scaffold_difficulty_design:
  - rule_id: cross_entity_state_dependency
    instances:
      - name: settle_returns_gated_on_car_return_settlement
        grounds:
          - state_machines.LeaseFleetCar.UNDER_REPAIR_to_HELD
          - state_machines.CarAssignment.ACTIVE_to_COMPLETED
          - validations[priority=23]
          - entities.CarReturn.fields.settlement_status
          - entities.LeaseFleetCar.fields.status
          - calculations.mileage_true_up_settlement
          - entities.CarReturn.fields.mileage_overage_cents
        distinguishing_aspect: |
          LeaseFleetCar's UNDER_REPAIR -> HELD transition (POST /api/v1/lease-fleet-cars/{id}/settle-returns)
          is gated on a DIFFERENT entity's row state: every CarReturn of that car must already carry
          settlement_status == SETTLED. While the car itself sits in the legal from-state UNDER_REPAIR but
          its CarReturn is still PENDING, the call is rejected 409 ERR_UNSETTLED_RETURNS; the same call
          returns 200 only after POST /api/v1/car-returns/{id}/settle flips that CarReturn to SETTLED.
          This is the LeaseFleetCar -> CarReturn entity pair, distinct from the CarAssignment -> LeaseContract
          pair used by the sibling instance.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z (the scaffold's startup default); database empty."
            - "Car type R7A-100 (BOXCAR, build_hours 10, regulatory_life_years 40, line_count_family R7A_LINE) with one WHEELSET bill-of-material row: component R7A-WS at qty_per_car 4, unit_cost_cents 100000, lead_time_days 20, on_hand_qty 100. Worst gated lead = ceil(20 / 4) = 5 days, so the 19-day horizon 2026-09-01..2026-09-20 passes the §1.3 production_feasibility_gate."
            - "A RETAINED production order for 1 car (planned_shop_days 10 = build_hours 10 * quantity 1) is reserved, released against the ACTIVE contract, changed over on line R7A_LINE for [2026-09-05, 2026-09-15), and completed on 2026-09-15: one LeaseFleetCar in status HELD, built_date 2026-09-15, regulatory_life_end_date 2066-09-15, acquisition_cost_cents = unit_price_cents = 875000."
            - "Lessee (credit_tier B, utilization_threshold_pct 80, credit_ceiling_cents 10000000) plus a FULL_SERVICE contract (per_diem_rate_cents 5000, liability_bearer LESSOR, term 2026-09-01..2027-09-01, fleet_car_cap 10) in status ACTIVE."
            - "The car is placed 2026-09-16..2026-10-16 with mileage_allowance 1000 (CarAssignment ACTIVE, LeaseFleetCar ASSIGNED), then returned on 2026-10-16 with mileage_since_last 500 and condition_grade A: days_in_placement = 30, blocks = ceil(30/30) = 1, included_miles = 1 * 1000 = 1000, overage = max(0, 500 - 1000) = 0, mileage_overage_cents = 0 * 12 = 0. The placement is COMPLETED and the car is UNDER_REPAIR with the CarReturn still PENDING."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "R7A-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 40, line_count_family: "R7A_LINE" }
              as: ProductionPlanner
              captures: { ct_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "R7A-WS", component_class: "WHEELSET", unit_cost_cents: 100000, lead_time_days: 20, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { comp_id: "$.data.id" }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_id}", qty_per_car: 4 }
              as: ProductionPlanner
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "R7A Rail Leasing Co", credit_tier: "B", utilization_threshold_pct: 80, credit_ceiling_cents: 10000000 }
              as: LeaseAdministrator
              captures: { lessee_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 5000, liability_bearer: "LESSOR", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
              captures: { lc_v: "$.data.version" }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 10, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: "$.data.id" }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: { lease_contract_id: "${lc_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/R7A_LINE/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-09-15" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-15" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              as: ProductionPlanner
              captures: { car_id: "$.data[0].id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_id}", lease_contract_id: "${lc_id}", lessee_id: "${lessee_id}", start_date: "2026-09-16", end_date: "2026-10-16", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { asg_id: "$.data.id" }
            - call: "POST /api/v1/car-returns"
              payload: { lease_fleet_car_id: "${car_id}", car_assignment_id: "${asg_id}", return_date: "2026-10-16", mileage_since_last: 500, condition_grade: "A" }
              as: LeaseAdministrator
              captures: { ret_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/lease-fleet-cars/${car_id}/settle-returns"
              payload: {}
              as: ProductionPlanner
              captures: { err_blocked: "$.data.error_id" }
            - call: "POST /api/v1/car-returns/${ret_id}/settle"
              payload: {}
              as: PortfolioManager
            - call: "POST /api/v1/lease-fleet-cars/${car_id}/settle-returns"
              payload: {}
              as: ProductionPlanner
          assert:
            - "First POST /api/v1/lease-fleet-cars/${car_id}/settle-returns returns HTTP 409 with data.error_id == \"ERR_UNSETTLED_RETURNS\" (captured as ${err_blocked}) while CarReturn.${ret_id}.settlement_status == PENDING and LeaseFleetCar.${car_id}.status == UNDER_REPAIR — the car's own status is the legal from-state, so only the cross-entity CarReturn gate can reject it."
            - "LeaseFleetCar.${car_id}.status == UNDER_REPAIR after the rejected call, i.e. the rejection performs no partial mutation of the car."
            - "CarReturn.${ret_id}.mileage_overage_cents == 0 (days_in_placement = 2026-10-16 - 2026-09-16 = 30; blocks = ceil(30 / 30) = 1; included_miles = 1 * 1000 = 1000; overage_miles = max(0, 500 - 1000) = 0; amount_cents = 0 * 12 = 0)."
            - "After POST /api/v1/car-returns/${ret_id}/settle, CarReturn.${ret_id}.settlement_status == SETTLED."
            - "Second POST /api/v1/lease-fleet-cars/${car_id}/settle-returns returns HTTP 200 with LeaseFleetCar.${car_id}.status == HELD and lease_contract_id == null."
      - name: suspend_assignment_gated_on_contract_status
        grounds:
          - state_machines.CarAssignment.ACTIVE_to_SUSPENDED
          - state_machines.LeaseContract.ACTIVE_to_AMENDMENT_DRAFTED
          - state_machines.LeaseContract.AMENDMENT_DRAFTED_to_ACTIVE
          - validations[priority=5]
          - entities.LeaseContract.fields.status
          - entities.CarAssignment.fields.status
          - entities.LeaseFleetCar.fields.status
        distinguishing_aspect: |
          CarAssignment's ACTIVE -> SUSPENDED transition (POST /api/v1/car-assignments/{id}/suspend) is
          gated on a DIFFERENT entity's state: the governing LeaseContract must be ACTIVE. With the
          placement itself still ACTIVE and its car still ASSIGNED, the call is rejected 409
          ERR_INVALID_STATE the moment the contract is moved to AMENDMENT_DRAFTED, and the identical call
          returns 200 once POST /api/v1/lease-contracts/{id}/amendments/ratify returns the contract to
          ACTIVE. This is the CarAssignment -> LeaseContract entity pair, distinct from the sibling
          instance's LeaseFleetCar -> CarReturn pair.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z (the scaffold's startup default); database empty."
            - "Car type R7B-100 (BOXCAR, build_hours 10, regulatory_life_years 40, line_count_family R7B_LINE) with one WHEELSET bill-of-material row: component R7B-WS at qty_per_car 4, unit_cost_cents 100000, lead_time_days 20, on_hand_qty 100. Worst gated lead = ceil(20 / 4) = 5 days, so the 19-day horizon 2026-09-01..2026-09-20 passes the §1.3 production_feasibility_gate."
            - "A RETAINED production order for 1 car (planned_shop_days 10 = build_hours 10 * quantity 1) is reserved, released against the ACTIVE contract, changed over on line R7B_LINE for [2026-09-05, 2026-09-15), and completed on 2026-09-15: one LeaseFleetCar in status HELD with built_date 2026-09-15 and regulatory_life_end_date 2066-09-15."
            - "Lessee (credit_tier B, utilization_threshold_pct 80, credit_ceiling_cents 10000000) plus a NET contract (per_diem_rate_cents 5000, liability_bearer LESSEE, term 2026-09-01..2027-09-01, fleet_car_cap 10) in status ACTIVE; its version is captured as ${lc_v}."
            - "The car is placed 2026-09-16..2026-10-16 with mileage_allowance 1000, so CarAssignment.${asg_id} is ACTIVE and LeaseFleetCar.${car_id} is ASSIGNED — both from-states of the suspend transition are legal before the trigger."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "R7B-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 40, line_count_family: "R7B_LINE" }
              as: ProductionPlanner
              captures: { ct_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "R7B-WS", component_class: "WHEELSET", unit_cost_cents: 100000, lead_time_days: 20, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { comp_id: "$.data.id" }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_id}", qty_per_car: 4 }
              as: ProductionPlanner
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "R7B Rail Leasing Co", credit_tier: "B", utilization_threshold_pct: 80, credit_ceiling_cents: 10000000 }
              as: LeaseAdministrator
              captures: { lessee_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "NET", per_diem_rate_cents: 5000, liability_bearer: "LESSEE", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
              captures: { lc_v: "$.data.version" }
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 10, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: "$.data.id" }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: { lease_contract_id: "${lc_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/R7B_LINE/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-09-15" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-15" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              as: ProductionPlanner
              captures: { car_id: "$.data[0].id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_id}", lease_contract_id: "${lc_id}", lessee_id: "${lessee_id}", start_date: "2026-09-16", end_date: "2026-10-16", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { asg_id: "$.data.id" }
          trigger:
            - call: "POST /api/v1/lease-contracts/${lc_id}/amendments"
              payload: { per_diem_rate_cents: 5500, liability_bearer: "LESSEE", expected_lease_version: "${lc_v}" }
              as: LeaseAdministrator
              captures: { lc_v_drafted: "$.data.version" }
            - call: "POST /api/v1/car-assignments/${asg_id}/suspend"
              payload: {}
              as: LeaseAdministrator
              captures: { err_blocked: "$.data.error_id" }
            - call: "POST /api/v1/lease-contracts/${lc_id}/amendments/ratify"
              payload: { expected_lease_version: "${lc_v_drafted}" }
              as: LeaseAdministrator
            - call: "POST /api/v1/car-assignments/${asg_id}/suspend"
              payload: {}
              as: LeaseAdministrator
          assert:
            - "After the amendment draft, LeaseContract.${lc_id}.status == AMENDMENT_DRAFTED while CarAssignment.${asg_id}.status == ACTIVE and LeaseFleetCar.${car_id}.status == ASSIGNED."
            - "POST /api/v1/car-assignments/${asg_id}/suspend while the governing contract is AMENDMENT_DRAFTED returns HTTP 409 with data.error_id == \"ERR_INVALID_STATE\" (captured as ${err_blocked}); the assignment's own from-state and its car's state are both legal, so only the cross-entity contract gate rejects it."
            - "CarAssignment.${asg_id}.status == ACTIVE and LeaseFleetCar.${car_id}.status == ASSIGNED after the rejected suspend (no partial mutation)."
            - "After POST /api/v1/lease-contracts/${lc_id}/amendments/ratify, LeaseContract.${lc_id}.status == ACTIVE and LeaseContract.${lc_id}.amendment_seq == 1."
            - "Second POST /api/v1/car-assignments/${asg_id}/suspend returns HTTP 200 with CarAssignment.${asg_id}.status == SUSPENDED and LeaseFleetCar.${car_id}.status == HELD."
  - rule_id: resource_temporal_overlap
    instances:
      - name: shop_line_half_open_touching_windows_allowed
        grounds:
          - validations[priority=10]
          - state_machines.LeaseFleetCar.HELD_to_UNDER_REPAIR
          - state_machines.RetrofitWorkOrder.SCHEDULED_to_IN_PROGRESS
          - entities.RetrofitWorkOrder.fields.shop_line
          - entities.RetrofitWorkOrder.fields.scheduled_start_date
          - entities.RetrofitWorkOrder.fields.scheduled_end_date
          - entities.RetrofitWorkOrder.fields.shop_days
          - calculations.retrofit_program_cost_allocation
          - calculations.lease_fleet_capital_allocation
          - entities.LeaseContract.fields.capital_allocation_cents
        distinguishing_aspect: |
          The occupied resource is RetrofitWorkOrder.shop_line and its windows are PURE half-open
          intervals [scheduled_start_date, scheduled_end_date) with no buffer: the incumbent
          [2026-10-01, 2026-10-11) on shop_line SHOP-R8A and the request [2026-10-11, 2026-10-21) have an
          empty intersection, so the request is ACCEPTED (201), while [2026-10-10, 2026-10-20) is REJECTED
          409 ERR_SHOP_SLOT_OVERLAP because it intersects the incumbent over exactly the one day 2026-10-10.
          Adjacency is legal here, the opposite geometric treatment from the sibling placement instance,
          whose LeaseFleetCar resource additionally demands a one-day gap.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z (the scaffold's startup default); database empty."
            - "Car type R8A-100 (BOXCAR, build_hours 10, regulatory_life_years 40, line_count_family R8A_LINE) with one WHEELSET bill-of-material row: component R8A-WS at qty_per_car 4, unit_cost_cents 100000, lead_time_days 20, on_hand_qty 100. Worst gated lead = ceil(20 / 4) = 5 days, so the 19-day horizon 2026-09-01..2026-09-20 passes the §1.3 production_feasibility_gate."
            - "A RETAINED production order for 2 cars (planned_shop_days 20 = build_hours 10 * quantity 2) is reserved, released against the ACTIVE contract, changed over on line R8A_LINE for [2026-09-05, 2026-09-25) (width 20 = planned_shop_days), and completed on 2026-09-25 with completed_qty 2: two LeaseFleetCars in status HELD, both with built_date 2026-09-25, regulatory_life_end_date 2066-09-25 and acquisition_cost_cents 875000. The two rows are interchangeable, so the captured order of data[0]/data[1] is immaterial."
            - "Lessee plus a FULL_SERVICE contract (per_diem_rate_cents 5000, liability_bearer LESSOR, term 2026-09-01..2027-09-01, fleet_car_cap 10) in status ACTIVE; after completion LeaseContract.capital_allocation_cents == 122500 (retained_cars = 2 live cars of this order; capital_cents = 2 * 875000 = 1750000; lessor_equity_cents = floor(1750000 * min(700, 900) / 10000) = 122500)."
            - "A retrofit program R8A-MANDATE stays in status PLANNED (never started), so neither car is enrolled in an IN_PROGRESS program and both remain eligible for the HELD -> UNDER_REPAIR transition; it covers car type R8A-100 through a RetrofitProgramCarType row, has required_shop_days_per_car 10 and compliance_deadline_date 2026-12-31 (every window ends on or before it)."
            - "Work order A already occupies shop_line SHOP-R8A for [2026-10-01, 2026-10-11) (shop_days 10) against car A, which is now UNDER_REPAIR; car B is still HELD and its shop line is free apart from that incumbent."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "R8A-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 40, line_count_family: "R8A_LINE" }
              as: ProductionPlanner
              captures: { ct_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "R8A-WS", component_class: "WHEELSET", unit_cost_cents: 100000, lead_time_days: 20, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { comp_id: "$.data.id" }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_id}", qty_per_car: 4 }
              as: ProductionPlanner
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "R8A Rail Leasing Co", credit_tier: "B", utilization_threshold_pct: 80, credit_ceiling_cents: 10000000 }
              as: LeaseAdministrator
              captures: { lessee_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 5000, liability_bearer: "LESSOR", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 2, planned_shop_days: 20, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: "$.data.id" }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: { lease_contract_id: "${lc_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/R8A_LINE/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-09-25" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 2, completion_date: "2026-09-25" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              as: ProductionPlanner
              captures: { car_a: "$.data[0].id", car_b: "$.data[1].id" }
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "R8A-MANDATE", description: "Tank car valve retrofit mandate", compliance_deadline_date: "2026-12-31", required_shop_days_per_car: 10, required_component_id: "${comp_id}" }
              as: RegulatoryRetrofitist
              captures: { prog_id: "$.data.id" }
            - call: "POST /api/v1/retrofit-program-car-types"
              payload: { retrofit_program_id: "${prog_id}", car_type_id: "${ct_id}" }
              as: RegulatoryRetrofitist
            - call: "POST /api/v1/retrofit-work-orders"
              payload: { retrofit_program_id: "${prog_id}", lease_fleet_car_id: "${car_a}", shop_line: "SHOP-R8A", scheduled_start_date: "2026-10-01", scheduled_end_date: "2026-10-11", component_qty_consumed: 1 }
              as: ProductionPlanner
              captures: { wo_a: "$.data.id" }
          trigger:
            - call: "POST /api/v1/retrofit-work-orders"
              payload: { retrofit_program_id: "${prog_id}", lease_fleet_car_id: "${car_b}", shop_line: "SHOP-R8A", scheduled_start_date: "2026-10-10", scheduled_end_date: "2026-10-20", component_qty_consumed: 1 }
              as: ProductionPlanner
              captures: { err_overlap: "$.data.error_id" }
            - call: "POST /api/v1/retrofit-work-orders"
              payload: { retrofit_program_id: "${prog_id}", lease_fleet_car_id: "${car_b}", shop_line: "SHOP-R8A", scheduled_start_date: "2026-10-11", scheduled_end_date: "2026-10-21", component_qty_consumed: 1 }
              as: ProductionPlanner
              captures: { wo_b: "$.data.id" }
          assert:
            - "POST /api/v1/retrofit-work-orders for [2026-10-10, 2026-10-20) returns HTTP 409 with data.error_id == \"ERR_SHOP_SLOT_OVERLAP\" (captured as ${err_overlap}): that window intersects the incumbent [2026-10-01, 2026-10-11) on shop_line SHOP-R8A over the single day 2026-10-10, since max(2026-10-01, 2026-10-10) = 2026-10-10 < min(2026-10-11, 2026-10-20) = 2026-10-11."
            - "LeaseFleetCar.${car_b}.status == HELD after the rejected work order, i.e. the rejection performs no partial mutation of the car."
            - "POST /api/v1/retrofit-work-orders for [2026-10-11, 2026-10-21) returns HTTP 201 because the two half-open windows touch at 2026-10-11 and their intersection is empty (max(2026-10-01, 2026-10-11) = 2026-10-11 is not < min(2026-10-11, 2026-10-21) = 2026-10-11)."
            - "RetrofitWorkOrder.${wo_b}.status == SCHEDULED, RetrofitWorkOrder.${wo_b}.shop_line == \"SHOP-R8A\" and RetrofitWorkOrder.${wo_b}.shop_days == 10."
            - "LeaseFleetCar.${car_b}.status == UNDER_REPAIR after the accepted work order."
            - "RetrofitProgram.${prog_id}.program_cost_cents == 0: the aggregation sums only RetrofitWorkOrder rows with status COMPLETED, and every work order of the program is still SCHEDULED, so the sum is empty."
            - "LeaseContract.${lc_id}.capital_allocation_cents == 122500 (retained_cars = 2 live cars of the order; capital_cents = 2 * 875000 = 1750000; lessor_equity_cents = floor(1750000 * min(700, 900) / 10000) = 122500)."
      - name: placement_interval_one_day_buffer_boundary
        grounds:
          - validations[priority=11]
          - state_machines.LeaseFleetCar.HELD_to_ASSIGNED
          - state_machines.CarAssignment.ACTIVE_to_COMPLETED
          - entities.CarAssignment.fields.start_date
          - entities.CarAssignment.fields.end_date
          - entities.LeaseFleetCar.fields.status
          - calculations.mileage_true_up_settlement
          - entities.CarReturn.fields.mileage_overage_cents
        distinguishing_aspect: |
          The occupied resource is the LeaseFleetCar itself and its placement intervals are half-open PLUS a
          mandatory one-day buffer, so [2026-10-17, 2026-11-16) is REJECTED 409 ERR_ASSIGNMENT_OVERLAP
          against the completed incumbent [2026-09-16, 2026-10-16) even though the two intervals do not
          intersect at all, while [2026-10-18, 2026-11-17) — exactly two days after the incumbent's
          end_date — is ACCEPTED (201). Adjacency is illegal here, the opposite geometric treatment from
          the sibling shop-line instance, where touching windows are accepted.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z (the scaffold's startup default); database empty."
            - "Car type R8B-100 (BOXCAR, build_hours 10, regulatory_life_years 40, line_count_family R8B_LINE) with one WHEELSET bill-of-material row: component R8B-WS at qty_per_car 4, unit_cost_cents 100000, lead_time_days 20, on_hand_qty 100. Worst gated lead = ceil(20 / 4) = 5 days, so the 19-day horizon 2026-09-01..2026-09-20 passes the §1.3 production_feasibility_gate."
            - "A RETAINED production order for 1 car (planned_shop_days 10 = build_hours 10 * quantity 1) is reserved, released against the ACTIVE contract, changed over on line R8B_LINE for [2026-09-05, 2026-09-15), and completed on 2026-09-15: one LeaseFleetCar in status HELD with built_date 2026-09-15 and regulatory_life_end_date 2066-09-15."
            - "Lessee (credit_tier B, utilization_threshold_pct 80, credit_ceiling_cents 10000000) plus a NET contract (per_diem_rate_cents 5000, liability_bearer LESSEE, term 2026-09-01..2027-09-01, fleet_car_cap 10) in status ACTIVE."
            - "The incumbent placement runs [2026-09-16, 2026-10-16) with mileage_allowance 1000, then is closed by a return on 2026-10-16 with mileage_since_last 500 and condition_grade A (days_in_placement = 30, blocks = ceil(30/30) = 1, included_miles = 1000, overage = max(0, 500 - 1000) = 0, mileage_overage_cents = 0). The placement ends COMPLETED, its CarReturn is settled, and POST /api/v1/lease-fleet-cars/{id}/settle-returns returns the car to HELD with lease_contract_id null — so the car is free to be placed again while the completed incumbent still supplies the buffered end_date 2026-10-16."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "R8B-100", car_class: "BOXCAR", build_hours: 10, regulatory_life_years: 40, line_count_family: "R8B_LINE" }
              as: ProductionPlanner
              captures: { ct_id: "$.data.id" }
            - call: "POST /api/v1/components"
              payload: { part_number: "R8B-WS", component_class: "WHEELSET", unit_cost_cents: 100000, lead_time_days: 20, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { comp_id: "$.data.id" }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${comp_id}", qty_per_car: 4 }
              as: ProductionPlanner
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "R8B Rail Leasing Co", credit_tier: "B", utilization_threshold_pct: 80, credit_ceiling_cents: 10000000 }
              as: LeaseAdministrator
              captures: { lessee_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "NET", per_diem_rate_cents: 5000, liability_bearer: "LESSEE", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: "$.data.id" }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 10, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: "$.data.id" }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: { lease_contract_id: "${lc_id}" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/R8B_LINE/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-05", scheduled_end_date: "2026-09-15" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-15" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              as: ProductionPlanner
              captures: { car_id: "$.data[0].id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_id}", lease_contract_id: "${lc_id}", lessee_id: "${lessee_id}", start_date: "2026-09-16", end_date: "2026-10-16", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { asg_id: "$.data.id" }
            - call: "POST /api/v1/car-returns"
              payload: { lease_fleet_car_id: "${car_id}", car_assignment_id: "${asg_id}", return_date: "2026-10-16", mileage_since_last: 500, condition_grade: "A" }
              as: LeaseAdministrator
              captures: { ret_id: "$.data.id" }
            - call: "POST /api/v1/car-returns/${ret_id}/settle"
              payload: {}
              as: PortfolioManager
            - call: "POST /api/v1/lease-fleet-cars/${car_id}/settle-returns"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_id}", lease_contract_id: "${lc_id}", lessee_id: "${lessee_id}", start_date: "2026-10-17", end_date: "2026-11-16", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { err_buffer: "$.data.error_id" }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_id}", lease_contract_id: "${lc_id}", lessee_id: "${lessee_id}", start_date: "2026-10-18", end_date: "2026-11-17", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { asg2_id: "$.data.id" }
          assert:
            - "POST /api/v1/car-assignments with start_date 2026-10-17 — the incumbent end_date 2026-10-16 plus exactly one day — returns HTTP 409 with data.error_id == \"ERR_ASSIGNMENT_OVERLAP\" (captured as ${err_buffer}), even though [2026-10-17, 2026-11-16) and [2026-09-16, 2026-10-16) do not intersect: the one-day buffer is violated."
            - "LeaseFleetCar.${car_id}.status == HELD after the rejected placement, i.e. the rejection performs no partial mutation of the car."
            - "POST /api/v1/car-assignments with start_date 2026-10-18 — the incumbent end_date plus exactly two days — returns HTTP 201, so the buffer boundary sits strictly between +1 day (rejected) and +2 days (accepted)."
            - "CarAssignment.${asg2_id}.status == ACTIVE, CarAssignment.${asg2_id}.start_date == \"2026-10-18\", CarAssignment.${asg2_id}.end_date == \"2026-11-17\" and LeaseFleetCar.${car_id}.status == ASSIGNED after the accepted placement."
            - "CarAssignment.${asg_id}.status == COMPLETED — the incumbent placement whose end_date 2026-10-16 defines the buffer is retained as a closed row, not deleted."
            - "CarReturn.${ret_id}.mileage_overage_cents == 0 (days_in_placement = 2026-10-16 - 2026-09-16 = 30; blocks = ceil(30 / 30) = 1; included_miles = 1 * 1000 = 1000; overage_miles = max(0, 500 - 1000) = 0; amount_cents = 0 * 12 = 0)."
