  - section: validations
    instances:
      - name: specification_shape_enum_date_and_duplicate_rules_fire_in_priority_order
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=9]
          - validations[priority=51]
          - endpoints[POST /specifications]
        distinguishing_aspect: >
          Four rules are violated in combination on the same endpoint. Shape (6) beats enum (7), enum
          beats the date-range rule (9), and the collection-wide uniqueness rule (51) is last of all -
          so a request that is simultaneously a duplicate version_label AND carries an unknown baseline
          enum reports ERR_INVALID_ENUM_VALUE, never ERR_DUPLICATE_NAME. Each error also carries its
          own declared HTTP status: 400, 422, 422, 409.
        test_recipe:
          setup:
            - "Empty database; clock parked at 2026-09-01T00:00:00Z; one stored DRAFT specification with version_label SHIC-1.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB1", effective_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { spec_id: $.data.id }
          trigger:
            - call: "POST /specifications"
              payload: { version_label: "SHIC-2.0", effective_date: "2026-10-01T00:00:00Z", sunset_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_shape: $.data.error_id }
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB4", effective_date: "2026-10-01T00:00:00Z", sunset_date: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /specifications"
              payload: { version_label: "SHIC-2.0", security_baseline_level: "SB2", effective_date: "2026-10-01T00:00:00Z", min_plugfest_credits: 5 }
              as: ProgramAdmin
              captures: { err_range: $.data.error_id }
            - call: "POST /specifications"
              payload: { version_label: "SHIC-2.0", security_baseline_level: "SB2", effective_date: "2026-10-01T00:00:00Z", sunset_date: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_dates: $.data.error_id }
            - call: "POST /specifications"
              payload: { version_label: "SHIC-1.0", security_baseline_level: "SB2", effective_date: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_dup: $.data.error_id }
            - call: "POST /specifications"
              payload: { version_label: "SHIC-2.0", security_baseline_level: "SB2", effective_date: "2026-10-01T00:00:00Z", sunset_date: "2026-10-02T00:00:00Z", min_plugfest_credits: 4 }
