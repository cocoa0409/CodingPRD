          trigger:
            - { call: "POST /depot/rmas/${rma}/loaner-reservations", as: IntakeAgent, payload: { start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LOANER_UNAVAILABLE"
            - "LoanerUnit.${lu_c}.status == AVAILABLE (unchanged)"

      - name: restock_resumes_awaiting_parts_rma
        claim_type: correct_result
        grounds: [calculations.restock_resume, state_machines.ServiceRMA.AWAITING_PARTS_to_IN_REPAIR]
        distinguishing_aspect: "Restocking a part present in an AWAITING_PARTS RMA's planned_parts auto-resumes it to IN_REPAIR; stock increases by the restock quantity."
        test_recipe:
          setup: ["In-warranty RMA diagnosed with planned part P1, moved IN_REPAIR -> AWAITING_PARTS"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
