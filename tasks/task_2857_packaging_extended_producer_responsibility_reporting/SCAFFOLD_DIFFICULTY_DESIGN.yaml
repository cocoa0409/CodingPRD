        distinguishing_aspect: |
          The entity pair is PackagingReport depending on Registration: creating a report is legal or
          illegal purely on the parent Registration's status, and the identical call flips from 409
          ERR_REGISTRATION_NOT_ACTIVE to 201 once the registration is reinstated.
        test_recipe:
          setup:
            - "CA program with one open period CA-2026-H2; producer PF (revenue 8000000, brand owner) with one ACTIVE GLASS SKU of 50 g and 110 units estimate."
            - "PF's CA registration was accepted and then suspended with suspension_reason AUDIT_OPEN, so its status is SUSPENDED and exemption_status is OBLIGATED."
