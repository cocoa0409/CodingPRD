  - rule_id: non_linear_state_machine
    instances:
      - name: meter_read_exception_resolution_cycle_revisits_pending_validation_twice
        grounds:
          - state_machines.MeterRead.EXCEPTION_to_PENDING_VALIDATION
          - state_machines.MeterRead.PENDING_VALIDATION_to_EXCEPTION
          - state_machines.MeterRead.PENDING_VALIDATION_to_ACCEPTED
          - calculations.meter_read_validation
          - validations[priority=11]
        distinguishing_aspect: |
          MeterRead is the cyclic machine: one row travels PENDING_VALIDATION -> EXCEPTION(ROLLBACK) ->
          PENDING_VALIDATION -> EXCEPTION(IMPLAUSIBLE_SPIKE) -> PENDING_VALIDATION -> ACCEPTED, so the same
          row re-enters PENDING_VALIDATION twice and each loop re-runs meter_read_validation with a
          different exception_reason.
