errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming an unknown role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the authenticated role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource whose owning foreign key is not its own X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "the request body omits a required input field or a supplied value does not match its declared type"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "the resource addressed by the path id does not exist"
  - id: ERR_PARENT_NOT_FOUND
    http: 404
    condition: "a parent resource named in the path does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "a body foreign key does not resolve to an existing row"
  - id: ERR_REFERENCE_SCOPE_MISMATCH
    http: 409
    condition: "a body foreign key exists but belongs to a different campaign or unit scope than the target resource"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the target resource is not in a state that permits the requested transition"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "the target resource is already in one of its declared terminal states"
  - id: ERR_CAMPAIGN_NOT_ACTIVE
    http: 409
    condition: "a write to a campaign-scoped resource is attempted while Campaign.status is PLANNING or CLOSED"
  - id: ERR_HOST_SITE_NOT_PERMITTED
    http: 409
    condition: "the host site's permission_status is not APPROVED"
  - id: ERR_LOCATION_NOT_ACTIVE
    http: 409
    condition: "the kettle location's status is not ACTIVE"
  - id: ERR_SCREENING_NOT_CLEARED
    http: 409
    condition: "the bell ringer's screening_status is not CLEARED, or the CLEARED screening expires before the shift start"
  - id: ERR_RINGER_INACTIVE
    http: 409
    condition: "the bell ringer's engagement_status is not ACTIVE"
  - id: ERR_INTAKE_WINDOW_CLOSED
    http: 409
    condition: "the assistance program's status is not OPEN"
  - id: ERR_OUTSIDE_INTAKE_WINDOW
    http: 409
    condition: "the logical clock instant falls outside the program's intake window"
  - id: ERR_SHIFT_TOO_LONG
    http: 422
    condition: "the shift duration exceeds 480 minutes"
  - id: ERR_RINGER_REST_BUFFER_VIOLATION
    http: 409
    condition: "less than 30 minutes separates this shift from the same ringer's adjacent shift"
  - id: ERR_MINOR_CURFEW_VIOLATION
    http: 422
    condition: "a ringer under 18 would be scheduled past the 20:00 local curfew"
  - id: ERR_CANTEEN_UNAVAILABLE
    http: 409
    condition: "the requested canteen count exceeds the unit's uncommitted canteen pool"
  - id: ERR_SHIFT_OVERLAP
    http: 409
    condition: "the requested shift interval overlaps another non-terminal shift for the same ringer"
  - id: ERR_PLACEMENT_WINDOW_OUTSIDE_PERMISSION
    http: 422
    condition: "the kettle placement window is not fully contained in the host site permission window"
  - id: ERR_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "an exclusive host site already carries a kettle placement with an overlapping or touching window"
  - id: ERR_KETTLE_CAP_EXCEEDED
    http: 409
    condition: "activating the location would exceed HostSite.max_kettles"
  - id: ERR_DUPLICATE_LOCATION_CODE
    http: 409
    condition: "location_code is already used by another kettle location of the same campaign"
  - id: ERR_DUPLICATE_EXTERNAL_REF
    http: 409
    condition: "external_ref is already used by another digital giving of the same campaign"
  - id: ERR_PROGRAM_INTAKE_FULL
    http: 409
    condition: "the program has reached household_cap and the application cannot be accepted"
  - id: ERR_HOUSEHOLD_SIZE_INVALID
    http: 422
    condition: "household_size is below 1 or above 12"
  - id: ERR_PROGRAM_AT_CAPACITY
    http: 409
    condition: "a corps program is full and waitlist_enabled is false"
  - id: ERR_GIVING_OUTSIDE_CAMPAIGN_WINDOW
    http: 422
    condition: "the digital gift's occurred_at falls outside the campaign window"
  - id: ERR_COLLECTION_OUTSIDE_PLACEMENT_WINDOW
    http: 422
    condition: "collected_on falls outside the kettle location's placement window"
  - id: ERR_DISTRIBUTION_SLOT_CONFLICT
    http: 409
    condition: "the requested distribution appointment overlaps another SCHEDULED appointment at the same unit"
  - id: ERR_REALLOCATION_WINDOW_INVALID
    http: 422
    condition: "effective_on falls outside the campaign window or precedes the current logical clock instant"
  - id: ERR_VARIANCE_EXCEEDS_TOLERANCE
    http: 409
    condition: "the absolute collection variance exceeds 500 cents"
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 422
    condition: "the declared deposit does not equal counted_total_cents minus handling_fee_cents"
  - id: ERR_LABOR_BUDGET_EXCEEDED
    http: 409
    condition: "completing the shift would push labor_committed_cents above labor_budget_cents"
  - id: ERR_INVALID_GIFT_AMOUNT
    http: 422
    condition: "amount_cents is not greater than 0, or exceeds 500000 cents"
  - id: ERR_REALLOCATION_HOURS_EXCEED_SOURCE
    http: 409
    condition: "moved_hours exceeds the source location's remaining scheduled hours"
  - id: ERR_HOUSEHOLD_LIMIT_EXCEEDED
    http: 422
    condition: "the household's assistance value exceeds the program's per_household_limit_cents"
  - id: ERR_NO_ELIGIBLE_LOCATION
    http: 422
    condition: "the digital giving attribution selector finds no ACTIVE kettle location with an approved host site"
  - id: ERR_NO_ELIGIBLE_RINGER
    http: 422
    condition: "the shift auto-assign selector finds no ringer whose screening, engagement, rest-buffer and overlap checks all pass"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "an expected_*_version input does not match the parent entity's current version"

roles:
  - name: PlatformAdmin
    description: "territorial system administrator with full surface access and logical-clock control"
    identity: opaque
    exclusive_operations: ["POST /api/_clock/set_current_utc"]
    shared_operations: ["all other endpoints"]
  - name: TerritorialCommander
    description: "territorial oversight officer accountable for campaign, deployment and reallocation approvals"
    identity: opaque
    exclusive_operations: ["POST /api/host-sites/{id}/approve with decision=REVOKE", "POST /api/disaster-deployments/{id}/approve", "POST /api/campaigns/{id}/activate"]
    shared_operations: ["GET /api/campaigns/{id}/summary", "GET /api/reallocation-decisions", "POST /api/reallocation-decisions/{id}/approve", "POST /api/kettle-locations/{id}/close"]
  - name: DivisionalOfficer
    description: "divisional supervisor who reviews location performance and reallocation proposals"
    identity: opaque
    exclusive_operations: ["POST /api/reallocation-decisions/{id}/revise"]
    shared_operations: ["GET /api/kettle-locations/{id}/performance", "POST /api/reallocation-decisions", "POST /api/reallocation-decisions/{id}/approve", "POST /api/reallocation-decisions/{id}/reject", "POST /api/reallocation-decisions/{id}/apply"]
  - name: CorpsOfficer
    description: "officer of a corps unit; the acting unit is the entity referenced by X-User-ID"
    identity: "entity_backed:Unit"
    exclusive_operations: ["POST /api/bell-ringers/{id}/screenings", "POST /api/bell-ringers/{id}/screenings/complete"]
    shared_operations: ["POST /api/kettle-locations", "POST /api/shifts", "POST /api/kettle-collections", "POST /api/corps-programs/{id}/enroll", "POST /api/assistance-programs"]
  - name: KettleCoordinator
    description: "seasonal campaign coordinator who negotiates host sites and runs the kettle network"
    identity: opaque
    exclusive_operations: ["POST /api/host-sites", "POST /api/host-sites/{id}/renew"]
    shared_operations: ["POST /api/kettle-locations", "POST /api/kettle-locations/{id}/activate", "POST /api/shifts", "POST /api/shifts/auto-assign", "POST /api/reallocation-decisions"]
  - name: VolunteerCoordinator
    description: "staffing coordinator who registers ringers, runs screening and builds the shift schedule"
    identity: opaque
    exclusive_operations: ["POST /api/bell-ringers", "POST /api/bell-ringers/{id}/separate"]
    shared_operations: ["POST /api/bell-ringers/{id}/screenings", "POST /api/bell-ringers/{id}/screenings/complete", "POST /api/shifts", "POST /api/shifts/{id}/confirm", "POST /api/shifts/{id}/cancel", "POST /api/shifts/{id}/no-show", "POST /api/shifts/auto-assign"]
  - name: BellRinger
    description: "a scheduled volunteer or paid seasonal worker acting on their own shifts"
    identity: "entity_backed:BellRinger"
    exclusive_operations: ["POST /api/shifts/{id}/check-in"]
    shared_operations: ["GET /api/shifts", "GET /api/shifts/{id}", "GET /api/bell-ringers/{id}"]
  - name: CountingRoomTeller
    description: "counting room teller who counts kettles and verifies the slip"
    identity: opaque
    exclusive_operations: ["POST /api/kettle-collections", "POST /api/kettle-collections/{id}/verify", "POST /api/kettle-collections/{id}/recount"]
    shared_operations: ["GET /api/kettle-collections", "GET /api/kettle-collections/{id}"]
  - name: FinanceOfficer
    description: "finance officer who deposits, reconciles and holds variances"
    identity: opaque
    exclusive_operations: ["POST /api/kettle-collections/{id}/deposit", "POST /api/kettle-collections/{id}/reconcile"]
    shared_operations: ["GET /api/campaigns/{id}/summary", "GET /api/kettle-collections", "POST /api/digital-givings/{id}/reverse"]
  - name: AssistanceCaseworker
    description: "caseworker who intakes, screens and distributes seasonal assistance"
    identity: opaque
    exclusive_operations: ["POST /api/assistance-applications/{id}/screen", "POST /api/assistance-applications/{id}/approve"]
    shared_operations: ["POST /api/assistance-programs", "POST /api/assistance-programs/{id}/open", "POST /api/assistance-applications", "POST /api/assistance-applications/{id}/schedule-distribution", "POST /api/assistance-applications/{id}/distribution/complete", "POST /api/assistance-applications/{id}/distribution/no-show"]
  - name: ProgramDirector
    description: "corps community center program director running year-round youth, senior and worship programs"
    identity: opaque
    exclusive_operations: ["POST /api/corps-programs", "POST /api/corps-programs/{id}/complete"]
    shared_operations: ["POST /api/corps-programs/{id}/suspend", "POST /api/corps-programs/{id}/enroll", "POST /api/corps-programs/{id}/withdraw", "GET /api/corps-programs"]
  - name: DisasterServicesCoordinator
    description: "emergency disaster services coordinator operating under incident command"
    identity: opaque
    exclusive_operations: ["POST /api/disaster-deployments/{id}/stage", "POST /api/disaster-deployments/{id}/deploy", "POST /api/disaster-deployments/{id}/demobilize"]
    shared_operations: ["POST /api/disaster-deployments", "GET /api/disaster-deployments", "GET /api/units"]
  - name: DigitalGivingProcessor
    description: "digital giving processor who ingests, attributes and reverses electronic gifts"
    identity: opaque
    exclusive_operations: ["POST /api/digital-givings", "POST /api/digital-givings/{id}/attribute", "POST /api/digital-givings/{id}/reverse"]
    shared_operations: ["GET /api/digital-givings", "GET /api/digital-givings/{id}"]
  - name: HostSiteManager
    description: "retail host site manager; the acting site is the entity referenced by X-User-ID"
    identity: "entity_backed:HostSite"
    exclusive_operations: []
    shared_operations: ["GET /api/host-sites/{id}", "GET /api/kettle-locations", "GET /api/kettle-locations/{id}", "GET /api/kettle-locations/{id}/performance"]
