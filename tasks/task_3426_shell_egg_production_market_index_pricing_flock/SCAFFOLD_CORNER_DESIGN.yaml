      - name: customer_cannot_create_complex_returns_403
        claim_type: exclusive_operation_denied
        grounds:
          - roles.PlatformAdmin
          - validations[priority=2]
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "POST /api/complexes is PlatformAdmin-exclusive; the Customer role is rejected 403 ERR_FORBIDDEN before any payload validation."
        test_recipe:
          setup: ["Empty database; logical clock at default."]
