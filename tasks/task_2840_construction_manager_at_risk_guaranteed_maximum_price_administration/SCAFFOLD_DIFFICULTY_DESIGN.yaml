          setup:
            - "one CmarProject 'Northgate Transit Center' with gmp_status EXECUTED and construction_contingency_remaining 240000.00"
            - "one WorkPackage 05-STEEL, budget_amount 900000.00, AWARDED from a 500000.00 third-party bid"
