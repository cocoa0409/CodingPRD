              payload: { animal_tag: "CAP-3", cage_id: "${cage_id}", protocol_id: "${proto_id}", species: "MOUSE", date_of_birth: "2026-05-01T00:00:00Z", sex: "M" }
              as: AnimalCareStaff
              captures: { err: $.data.error_id }
          assert:
            - "Second animal (count 1->2) succeeds: 201"
            - "Third animal (count 2, == max) rejected with ERR_ANIMAL_CAP_EXCEEDED (422)"
            - "Protocol.animals_used_count remains == 2 after the rejection"


      - name: wean_age_exact_21_day_boundary
        grounds:
          - state_machines.Litter.NURSING_to_WEANED
          - validations[priority=18]
          - errors[ERR_LITTER_TOO_YOUNG]
        distinguishing_aspect: |
          Temporal boundary on a different metric and endpoint: a litter born
          2026-08-01 may be weaned at exactly born_on + 21 days (2026-08-22
