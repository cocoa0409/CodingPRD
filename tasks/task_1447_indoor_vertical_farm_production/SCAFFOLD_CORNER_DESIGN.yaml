          - batch_id: ${b1}
            reserved_lb: 5.0
        as: ContractsManager
        captures:
          err: $.data.error_id
      - call: GET /farm/contracts/${ct1}
        as: ContractsManager
        captures:
          ct_v2: $.data.version
      - call: POST /farm/shipments
        payload:
          contract_id: ${ct1}
          ship_date: '2026-08-24'
          window_start_at: '2026-08-24T13:00:00Z'
          window_end_at: '2026-08-24T20:00:00Z'
          expected_contract_version: ${ct_v2}
          lines:
          - batch_id: ${b1}
            reserved_lb: 5.0
        as: ContractsManager
        captures:
          s2: $.data.id
      assert:
      - first create succeeds and bumps RetailContract.version (1 -> 2)
      - second create with the stale version -> error_id == ERR_STALE_VERSION (412)
      - same payload with the fresh version -> 201 (version 3)
  - name: occ_assignment_create_stale_shift_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[assignment-create-stale-shift]
    distinguishing_aspect: Assigning a worker against a shift version captured before a prior assignment is 412; fresh version succeeds.
    test_recipe:
      setup:
      - Workers W1, W2; shift PUBLISHED (version captured right after publish), headcount_required 2
      setup_api_calls:
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: FarmManager
      - call: POST /farm/workers
        payload:
          full_name: W One
          certifications:
          - PACK_CREW
          hourly_rate_cents: 2200
        as: LaborPlanner
        captures:
          w1: $.data.id
      - call: POST /farm/workers
        payload:
          full_name: W Two
          certifications:
          - PACK_CREW
          hourly_rate_cents: 2200
        as: LaborPlanner
        captures:
          w2: $.data.id
      - call: POST /farm/labor-shifts
        payload:
          shift_date: '2026-08-05'
          role_type: PACK_CREW
          start_at: '2026-08-05T07:00:00Z'
          end_at: '2026-08-05T15:00:00Z'
          headcount_required: 2
          planned_hourly_rate_cents: 2200
        as: LaborPlanner
        captures:
          sh: $.data.id
      - call: POST /farm/labor-shifts/${sh}/publish
        as: LaborPlanner
        captures:
          sh_v: $.data.version
      trigger:
      - call: POST /farm/labor-shifts/${sh}/assignments
        payload:
          worker_id: ${w1}
          expected_labor_shift_version: ${sh_v}
        as: LaborPlanner
        captures:
          a1: $.data.id
      - call: POST /farm/labor-shifts/${sh}/assignments
        payload:
          worker_id: ${w2}
          expected_labor_shift_version: ${sh_v}
        as: LaborPlanner
        captures:
          err: $.data.error_id
      - call: GET /farm/labor-shifts/${sh}
        as: LaborPlanner
        captures:
          sh_v2: $.data.version
      - call: POST /farm/labor-shifts/${sh}/assignments
        payload:
          worker_id: ${w2}
          expected_labor_shift_version: ${sh_v2}
        as: LaborPlanner
        captures:
          a2: $.data.id
      assert:
      - W1 assignment succeeds (shift version advances past ${sh_v})
      - W2 assignment with the stale version -> error_id == ERR_STALE_VERSION (412)
      - W2 with the fresh version -> 201; headcount_assigned == 2
  - name: layer_cascading_side_effects_covered
    claim_type: cascading_side_effects
    grounds:
    - complexity_profile.complexity_layers
    excluded_because:
      difficulty_instance: transitive_cascade / sanitation_failure_four_link_cascade
      rationale: The depth-4 sanitation cascade and depth-3 harvest/terminate cascades are exercised end-to-end by the three §1.8 transitive_cascade instances.
  - name: layer_dual_variant_calculation_covered
    claim_type: dual_variant_calculation
    grounds:
    - complexity_profile.complexity_layers
    excluded_because:
      difficulty_instance: dual_variant_calc / energy_cost_provisional_vs_actual_per_pound
      rationale: Both dual-variant surfaces (energy cost, fill rate) are asserted with literal divergent values in §1.8.
- section: consistency_model
  instances:
  - name: immediate_consistency_mutation_visible_in_same_response_and_read
    claim_type: immediate
    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: 'Immediate consistency: the harvest POST response already carries HARVESTED + computed totals, and an immediate GET (same request order, no delay) returns identical values; the freed tower reads
      IDLE at once.'
    test_recipe:
      setup:
      - Batch HARVEST_READY on one tower, clock 2026-08-24T06:30:00Z
      setup_api_calls:
      - call: POST /farm/crops
        payload:
          crop_code: KALE-01
          display_name: Kale
          category: LEAFY_GREEN
          margin_cents_per_lb: 300
          floor_price_cents_per_lb: 100
        as: FarmManager
        captures:
          c_kale: $.data.id
          c_kale_v: $.data.version
      - call: POST /farm/recipes
        payload:
          crop_id: ${c_kale}
          light_hours_per_day: 16
          light_ppfd_umol: 600
          ec_target_ms: 1.8
          ph_target: 5.8
          temp_day_c: 22
          temp_night_c: 18
          humidity_pct: 65
          co2_ppm: 900
          days_to_harvest: 21
          expected_yield_lb_per_tower: 12.5
        as: Grower
        captures:
          r_kale: $.data.id
      - call: POST /farm/recipes/${r_kale}/activate
        payload:
          expected_crop_version: ${c_kale_v}
        as: Grower
      - call: POST /farm/water-loops
        payload:
          loop_code: WL-A
        as: FarmManager
        captures:
          wl_a: $.data.id
      - call: POST /farm/racks
        payload:
          rack_code: R-01
          water_loop_id: ${wl_a}
          zone: Z1
          tower_count: 1
        as: FarmManager
        captures:
          rk_1: $.data.id
      - call: GET /farm/racks/${rk_1}/towers
        as: FarmManager
        captures:
          t1: $.data[0].id
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T06:00:00Z'
        as: FarmManager
      - call: POST /farm/batches
        payload:
          crop_id: ${c_kale}
          tower_ids:
          - ${t1}
        as: Grower
        captures:
          b1: $.data.id
      - call: POST /farm/batches/${b1}/seed
        as: Grower
      - call: POST /farm/batches/${b1}/germination-check
        payload:
          germination_rate_pct: 96.0
        as: Grower
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-22T06:00:00Z'
        as: FarmManager
      - call: POST /farm/batches/${b1}/mark-harvest-ready
        as: Grower
      trigger:
      - call: POST /farm/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-24T06:30:00Z'
        as: FarmManager
      - call: POST /farm/batches/${b1}/harvest
        payload:
          grade_a_lb: 40.0
          grade_b_lb: 6.0
          cull_lb: 3.0
        as: Grower
        as_user_id: grower-7
        captures:
          st: $.data.production_status
          tot: $.data.harvested_total_lb
          at: $.data.harvested_at
      - call: GET /farm/batches/${b1}
        as: Grower
        captures:
          st2: $.data.production_status
          tot2: $.data.harvested_total_lb
      - call: GET /farm/towers/${t1}
        as: FarmManager
        captures:
          t_status: $.data.tower_status
      assert:
      - the POST response itself carries production_status == HARVESTED, harvested_total_lb == 46.00, harvested_at == 2026-08-24T06:30:00Z
      - the immediate GET returns the identical values (no reconciliation lag)
      - Tower.${t1} reads IDLE immediately (cascade visible in the same instant)
