          tax_id: 41-0000001
          county: BLACKHAWK
        as: LoanOfficer
        captures:
          bor: $.data.id
      - call: POST /loan-accounts
        payload:
          borrower_id: ${bor}
          requested_commitment_cents: 50000000
          rate_bps: 700
          season_year: 2026
          maturity_date: '2027-02-28T00:00:00Z'
        as: LoanOfficer
        captures:
