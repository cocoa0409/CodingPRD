        distinguishing_aspect: |
          FryerOil is cyclic: frying accrual pushes tpm to exactly 27.0 (inclusive
          hold), a FILTRATION movement multiplies by 0.6 (27.0 -> 16.2) restoring
          ACTIVE — and the cascade-held run does NOT auto-release with the oil;
          it remains HELD until a QualityTechnician releases it.
        test_recipe:
          setup:
            - "run started; checks of 5000, 5000, 3250 lbs (all at target temp) push tpm 0.5 -> 10.5 -> 20.5 -> exactly 27.0"
            - "oil auto QUALITY_HOLD; run auto HELD with hold_placed_by_user_id == null (system hold)"
            - "FILTRATION movement (gallons 0) recomputes tpm to 16.2 -> oil ACTIVE"
          setup_api_calls:
