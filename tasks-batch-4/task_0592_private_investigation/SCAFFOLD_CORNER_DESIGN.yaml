      - name: missing_role_header_returns_unauthenticated
        claim_type: Authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers at all returns 401 ERR_UNAUTHENTICATED — the auth check runs before existence, so even a non-existent case id yields 401, not 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
