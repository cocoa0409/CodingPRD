              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
            - call: "POST /pickups/${pk_id}/miss"
              payload: { miss_reason: "MISSED_BY_CREW" }
              as: Driver
          trigger:
            - call: "GET /missed-pickup-credits"
              payload: { source_pickup_id: "${pk_id}" }
              as: Billing
          assert:
            - "response_type == array"
            - "data length == 1 and data[0].amount_cents == 1500"
      - name: list_weight_tickets_by_pickup_subresource
        claim_type: Computed read
        grounds:
          - entities.WeightTicket.fields.pickup_id
          - endpoints
        excluded_because:
          difficulty_instance: dual_variant_calc / payt_weight_charge_marginal_vs_free_allowance
          rationale: "WeightTicket.pickup_id reverse-reachability via GET /pickups/{id}/weight-ticket is exercised by the entities-section corner instance weight_ticket_immutable_no_version_field."

  # =========================================================================
  # From Consistency Model — immediate
  # =========================================================================
  - section: consistency_model
    instances:
      - name: invoice_issue_immediate_visibility
        claim_type: immediate
        grounds:
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: "Immediate consistency: the issue response itself carries the computed total_cents (no read-after-delay needed) for a base-only invoice (total 2000)."
        test_recipe:
          setup: ["ACTIVE account with one ACTIVE TRASH plan base 2000; a DRAFT invoice."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "141 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /service-plans"
              payload: { account_id: "${acct_id}", stream: "TRASH", frequency: "WEEKLY", base_monthly_fee_cents: 2000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { acct_v: $.data.version }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: Billing
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: Billing
              captures: { tot: $.data.total_cents }
          assert:
            - "data.total_cents == 2000"
            - "data.status == ISSUED"
