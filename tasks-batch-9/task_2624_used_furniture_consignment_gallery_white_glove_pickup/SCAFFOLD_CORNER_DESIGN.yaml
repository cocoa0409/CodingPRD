        distinguishing_aspect: "POST .../screen with decision ACCEPT and a non-REJECTED derived grade moves lifecycle_state INTAKE_SUBMITTED -> SCREEN_ACCEPTED while inventory_state stays PENDING_CUSTODY, and stamps screened_by_user_id with the acting appraiser-1."
