      - name: prestart_recall_start_and_result_payload_rejections
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RECALL_PAYLOAD_INVALID]
          - errors[ERR_START_TIME_INVALID]
          - errors[ERR_RESULT_PAYLOAD_INVALID]
          - errors[ERR_ENTRY_NOT_ACCEPTED]
          - validations[priority 46 ERR_RECALL_PAYLOAD_INVALID]
          - validations[priority 50 ERR_START_TIME_INVALID]
        distinguishing_aspect: |
          Every prestart boundary is exercised from the wrong side and then from the exact edge: a
          GENERAL recall carrying entry_id, an INDIVIDUAL recall without one and a signal at 13:50
          are all 422, the start at 13:50 is 422 while the start at exactly 13:55 (scheduled minus 5
          minutes) succeeds, and on the result side a FINISHED row without elapsed_seconds, a DNF row
          with them and an OCS finish_status are each 422 while an unaccepted entry answers 409.
        test_recipe:
          setup:
            - "A light RACING world as above, but with SI revision 1 effective 2026-07-15 only, PRO, TIMEKEEPER and SIGNALS duties CONFIRMED over 2026-08-05T12:00:00Z to 20:00:00Z, and race 1 DISTANCE_COASTAL 6.0 nm scheduled 2026-08-05T14:00:00Z already in SEQUENCE_STARTED."
            - "Entries A and B are ACCEPTED; a third entry C is assigned to division A but left SUBMITTED, so the division holds assigned 3 and accepted 2 and stays CONFIRMED."
            - "Entry A's certificate is TOD_PHRF with rating_value 171.3, so a 4800.0 s elapsed time corrects to 4800.0 - 171.3 * 6.0 = 3772.2."
