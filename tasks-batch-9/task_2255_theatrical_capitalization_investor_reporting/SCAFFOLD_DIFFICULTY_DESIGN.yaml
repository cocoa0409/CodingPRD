  - name: uncertified_wrap_blocks_closing_settlement_until_certified
    grounds:
    - §1.6 ERR_UNCERTIFIED_WRAPS_EXIST (409)
    - '§1.2 ClosingNotice ISSUED -> SETTLED precondition: no WeeklyWrap for the production in status SUBMITTED or DISPUTED'
    - §1.3 closing_reserve_settlement
    distinguishing_aspect: |
      Settlement is gated on the aggregate state of a sibling collection, not on the
      notice's own state. With one wrap left SUBMITTED the settle must fail with
      ERR_UNCERTIFIED_WRAPS_EXIST (409); certifying that wrap and retrying the identical
      call must then succeed with a reserve release of 1,700,000 - which proves the gate
      was the wrap and nothing else. An implementation that only checks the notice state
      settles the books while a week is still open.
