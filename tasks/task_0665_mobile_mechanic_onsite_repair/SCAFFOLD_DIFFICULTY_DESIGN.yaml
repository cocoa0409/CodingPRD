scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_vs_final_total_diverge_on_service_request
        grounds:
          - calculations.quote_estimate_total
          - calculations.final_job_total
          - entities.ServiceRequest.fields.estimate_total_cents
          - entities.ServiceRequest.fields.final_total_cents
        distinguishing_aspect: "Cost-accounting on ServiceRequest: estimate (forward-looking from quote inputs) yields 26000 while final (actuals at finish) yields 34100 for the same request — different numbers, distinct from the FleetAccount risk variant."
        test_recipe:
          setup:
            - "Customer M1 in zone Z1, retail (no fleet)."
            - "Mechanic K1 in Z1, TIER2, labor_rate 9000 cents/hr."
            - "CatalogPart CP1 wholesale 4000."
            - "ServiceRequest SR1 (INTAKE) quoted at est_hours=2.0, est_parts=8000, tow=0 -> quoted_total 26000; approved -> estimate_total_cents=26000; dispatched ON_SITE; one part-line CP1 qty 2; finished with logged 2.5h."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-parts"
              payload: { sku: "CP1", name: "Brake Pad", wholesale_cost_cents: 4000 }
              as: PlatformAdmin
              captures: { cp1: $.data.id }
            - call: "POST /customers"
              payload: { email: "m1@x.com", full_name: "M One", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K One", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 9000 }
              as: PlatformAdmin
              captures: { k1: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${m1}", vehicle_vin: "1HGCM82633A004352", symptom_text: "grinding brakes", severity: "ROUTINE" }
              as: Customer
              as_user_id: "${m1}"
              captures: { sr1: $.data.id }
            - call: "POST /service-requests/${sr1}/quotes"
              payload: { diagnosis_text: "front pads", estimated_labor_hours: 2.0, estimated_parts_cents: 8000, labor_rate_cents_per_hour: 9000, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k1}"
              captures: { q1: $.data.id }
            - call: "GET /service-requests/${sr1}"
              payload: {}
              as: Dispatcher
              captures: { srv1: $.data.version }
            - call: "POST /quotes/${q1}/approve"
              payload: { expected_service_request_version: "${srv1}" }
              as: Customer
              as_user_id: "${m1}"
            - call: "GET /service-requests/${sr1}"
              payload: {}
              as: Dispatcher
              captures: { srv2: $.data.version }
            - call: "POST /service-requests/${sr1}/dispatch"
              payload: { mechanic_id: "${k1}", routing_mode: "ON_SITE", scheduled_start_utc: "2026-04-02T09:00:00Z", scheduled_end_utc: "2026-04-02T11:00:00Z", expected_service_request_version: "${srv2}" }
              as: Dispatcher
              captures: { jv1: $.data.id }
            - call: "POST /service-requests/${sr1}/part-lines"
              payload: { catalog_part_id: "${cp1}", quantity: 2 }
              as: Mechanic
              as_user_id: "${k1}"
            - call: "POST /job-visits/${jv1}/depart"
              payload: {}
              as: Mechanic
              as_user_id: "${k1}"
            - call: "POST /job-visits/${jv1}/start-work"
              payload: {}
              as: Mechanic
              as_user_id: "${k1}"
          trigger:
            - call: "POST /job-visits/${jv1}/finish"
              payload: { logged_labor_hours: 2.5, payment_method: "CARD" }
              as: Mechanic
              as_user_id: "${k1}"
          assert:
            - "ServiceRequest.${sr1}.estimate_total_cents == 26000"
            - "ServiceRequest.${sr1}.final_total_cents == 34100"
            - "ServiceRequest.${sr1}.final_total_cents != ServiceRequest.${sr1}.estimate_total_cents"

      - name: fleet_headroom_estimate_variant_vs_invoice_variant
        grounds:
          - calculations.fleet_credit_headroom
          - entities.FleetAccount.fields.credit_limit_cents
          - entities.FleetAccount.fields.outstanding_balance_cents
          - validations[priority=12]
        distinguishing_aspect: "Risk/credit scoring on FleetAccount: the at_approval variant projects estimate_total_cents (30000, passes) while the at_invoice variant projects final_total_cents (30290, fails) against the same 30000 credit limit — a different subject and a different divergence than the ServiceRequest cost pair."
        test_recipe:
          setup:
            - "FleetAccount F1 ACTIVE, credit_limit 30000, labor_discount 0, outstanding 0."
            - "Customer M2 in Z1 belonging to F1; Mechanic K2 Z1 TIER2 rate 12000."
            - "SR2 quoted est_hours=2.5, est_parts=0, tow=0 -> estimate 30000 (== limit, passes at approval); dispatched ON_SITE; finishing adds an add-on part wc=200 (line 290) so final = 30290 > 30000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-parts"
              payload: { sku: "CP2", name: "Sensor", wholesale_cost_cents: 200 }
              as: PlatformAdmin
              captures: { cp2: $.data.id }
            - call: "POST /fleet-accounts"
              payload: { company_name: "Acme Fleet", credit_limit_cents: 30000, labor_discount_pct: 0 }
              as: PlatformAdmin
              captures: { f1: $.data.id }
            - call: "POST /customers"
              payload: { email: "m2@x.com", full_name: "M Two", home_zone_code: "Z1", fleet_account_id: "${f1}" }
              as: PlatformAdmin
              captures: { m2: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K Two", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 12000 }
              as: PlatformAdmin
              captures: { k2: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${m2}", vehicle_vin: "1HGCM82633A004353", symptom_text: "noise", severity: "ROUTINE" }
              as: Customer
              as_user_id: "${m2}"
              captures: { sr2: $.data.id }
            - call: "POST /service-requests/${sr2}/quotes"
              payload: { diagnosis_text: "diag", estimated_labor_hours: 2.5, estimated_parts_cents: 0, labor_rate_cents_per_hour: 12000, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k2}"
              captures: { q2: $.data.id }
            - call: "GET /service-requests/${sr2}"
              payload: {}
              as: Dispatcher
              captures: { srv_a: $.data.version }
            - call: "POST /quotes/${q2}/approve"
              payload: { expected_service_request_version: "${srv_a}" }
              as: Customer
              as_user_id: "${m2}"
            - call: "GET /service-requests/${sr2}"
              payload: {}
              as: Dispatcher
              captures: { srv_b: $.data.version }
            - call: "POST /service-requests/${sr2}/dispatch"
              payload: { mechanic_id: "${k2}", routing_mode: "ON_SITE", scheduled_start_utc: "2026-04-02T09:00:00Z", scheduled_end_utc: "2026-04-02T11:00:00Z", expected_service_request_version: "${srv_b}" }
              as: Dispatcher
              captures: { jv2: $.data.id }
            - call: "POST /job-visits/${jv2}/depart"
              payload: {}
              as: Mechanic
              as_user_id: "${k2}"
            - call: "POST /job-visits/${jv2}/start-work"
              payload: {}
              as: Mechanic
              as_user_id: "${k2}"
            - call: "POST /service-requests/${sr2}/inspection-findings"
              payload: { job_visit_id: "${jv2}", description: "extra sensor", recommended_part_id: "${cp2}", recommended_quantity: 1, add_on_labor_hours: 0 }
              as: Mechanic
              as_user_id: "${k2}"
              captures: { find1: $.data.id }
            - call: "POST /service-requests/${sr2}/resolve-addons"
              payload: { decisions: [ { finding_id: "${find1}", decision: "APPROVED" } ] }
              as: Customer
              as_user_id: "${m2}"
          trigger:
            - call: "POST /job-visits/${jv2}/finish"
              payload: { logged_labor_hours: 2.5, payment_method: "FLEET_CREDIT" }
              as: Mechanic
              as_user_id: "${k2}"
              captures: { err: $.data.error_id }
          assert:
            - "ServiceRequest.${sr2}.estimate_total_cents == 30000"
            - "trigger response error_id == ERR_FLEET_CREDIT_EXCEEDED, http 402"
            - "ServiceRequest.${sr2}.status == IN_PROGRESS (finish rejected; not COMPLETED)"
            - "FleetAccount.${f1}.outstanding_balance_cents == 0 (no debit on rejected finish)"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: part_markup_round_per_unit_then_multiply_mode_b
        grounds:
          - calculations.part_line_markup
          - entities.PartLine.fields.unit_price_cents
          - entities.PartLine.fields.line_total_cents
        distinguishing_aspect: "Mode (b) nested-rounding order: markup is rounded PER UNIT then multiplied by quantity. wc=10 -> round(10*0.45=4.5)=5 -> unit_price 15 -> line_total 75; sum-then-round (50*0.45=22.5->23 -> 73) is the wrong order — the scaffold pins per-unit-first."
        test_recipe:
          setup:
            - "CatalogPart CP3 wholesale 10; Customer M3 Z1; Mechanic K3 Z1 TIER2 rate 9000; SR3 quoted+approved+dispatched ON_SITE and at IN_PROGRESS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-parts"
              payload: { sku: "CP3", name: "Clip", wholesale_cost_cents: 10 }
              as: PlatformAdmin
              captures: { cp3: $.data.id }
            - call: "POST /customers"
              payload: { email: "m3@x.com", full_name: "M Three", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { m3: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K Three", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 9000 }
              as: PlatformAdmin
              captures: { k3: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${m3}", vehicle_vin: "1HGCM82633A004354", symptom_text: "rattle", severity: "ROUTINE" }
              as: Customer
              as_user_id: "${m3}"
              captures: { sr3: $.data.id }
            - call: "POST /service-requests/${sr3}/quotes"
              payload: { diagnosis_text: "diag", estimated_labor_hours: 1.0, estimated_parts_cents: 100, labor_rate_cents_per_hour: 9000, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k3}"
              captures: { q3: $.data.id }
            - call: "GET /service-requests/${sr3}"
              payload: {}
              as: Dispatcher
              captures: { sv3a: $.data.version }
            - call: "POST /quotes/${q3}/approve"
              payload: { expected_service_request_version: "${sv3a}" }
              as: Customer
              as_user_id: "${m3}"
            - call: "GET /service-requests/${sr3}"
              payload: {}
              as: Dispatcher
              captures: { sv3b: $.data.version }
            - call: "POST /service-requests/${sr3}/dispatch"
              payload: { mechanic_id: "${k3}", routing_mode: "ON_SITE", scheduled_start_utc: "2026-04-02T09:00:00Z", scheduled_end_utc: "2026-04-02T10:00:00Z", expected_service_request_version: "${sv3b}" }
              as: Dispatcher
              captures: { jv3: $.data.id }
            - call: "POST /job-visits/${jv3}/depart"
              payload: {}
              as: Mechanic
              as_user_id: "${k3}"
            - call: "POST /job-visits/${jv3}/start-work"
              payload: {}
              as: Mechanic
              as_user_id: "${k3}"
          trigger:
            - call: "POST /service-requests/${sr3}/part-lines"
              payload: { catalog_part_id: "${cp3}", quantity: 5 }
              as: Mechanic
              as_user_id: "${k3}"
              captures: { pl3: $.data.id }
          assert:
            - "PartLine.${pl3}.unit_price_cents == 15"
            - "PartLine.${pl3}.line_total_cents == 75"

      - name: final_total_sum_hours_then_round_mode_a
        grounds:
          - calculations.final_job_total
          - entities.JobVisit.fields.logged_labor_hours
          - entities.InspectionFinding.fields.add_on_labor_hours
          - entities.ServiceRequest.fields.final_total_cents
        distinguishing_aspect: "Mode (a) non-linear multi-input: total labor = (base_logged + sum of approved add_on_labor_hours) summed THEN rounded once against the rate, with a conditional fleet-discount branch. base 0.3335 + addon 0.3335 at rate 100 sum-then-round = 67 (round-each = 66) — a different combinatorial axis from the mode-(b) per-unit markup rounding."
        test_recipe:
          setup:
            - "Customer M4 Z1 retail; Mechanic K4 Z1 TIER2 rate 100; SR4 quoted+approved+dispatched ON_SITE; in progress; one APPROVED add-on finding with add_on_labor_hours=0.3335 (no part)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "m4@x.com", full_name: "M Four", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { m4: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K Four", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 100 }
              as: PlatformAdmin
              captures: { k4: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${m4}", vehicle_vin: "1HGCM82633A004355", symptom_text: "tune", severity: "ROUTINE" }
              as: Customer
              as_user_id: "${m4}"
              captures: { sr4: $.data.id }
            - call: "POST /service-requests/${sr4}/quotes"
              payload: { diagnosis_text: "diag", estimated_labor_hours: 1.0, estimated_parts_cents: 0, labor_rate_cents_per_hour: 100, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k4}"
              captures: { q4: $.data.id }
            - call: "GET /service-requests/${sr4}"
              payload: {}
              as: Dispatcher
              captures: { sv4a: $.data.version }
            - call: "POST /quotes/${q4}/approve"
              payload: { expected_service_request_version: "${sv4a}" }
              as: Customer
              as_user_id: "${m4}"
            - call: "GET /service-requests/${sr4}"
              payload: {}
              as: Dispatcher
              captures: { sv4b: $.data.version }
            - call: "POST /service-requests/${sr4}/dispatch"
              payload: { mechanic_id: "${k4}", routing_mode: "ON_SITE", scheduled_start_utc: "2026-04-02T09:00:00Z", scheduled_end_utc: "2026-04-02T10:00:00Z", expected_service_request_version: "${sv4b}" }
              as: Dispatcher
              captures: { jv4: $.data.id }
            - call: "POST /job-visits/${jv4}/depart"
              payload: {}
              as: Mechanic
              as_user_id: "${k4}"
            - call: "POST /job-visits/${jv4}/start-work"
              payload: {}
              as: Mechanic
              as_user_id: "${k4}"
            - call: "POST /service-requests/${sr4}/inspection-findings"
              payload: { job_visit_id: "${jv4}", description: "extra labor", add_on_labor_hours: 0.3335 }
              as: Mechanic
              as_user_id: "${k4}"
              captures: { f4: $.data.id }
            - call: "POST /service-requests/${sr4}/resolve-addons"
              payload: { decisions: [ { finding_id: "${f4}", decision: "APPROVED" } ] }
              as: Customer
              as_user_id: "${m4}"
          trigger:
            - call: "POST /job-visits/${jv4}/finish"
              payload: { logged_labor_hours: 0.3335, payment_method: "CARD" }
              as: Mechanic
              as_user_id: "${k4}"
          assert:
            - "ServiceRequest.${sr4}.final_total_cents == 67"
            - "ServiceRequest.${sr4}.status == COMPLETED"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle_sent_revision_sent
        grounds:
          - state_machines.Quote.SENT_to_REVISION_REQUESTED
          - state_machines.Quote.REVISION_REQUESTED_to_SUPERSEDED
          - state_machines.ServiceRequest.QUOTED_to_QUOTED
        distinguishing_aspect: "Cyclic shape on Quote: SENT -> REVISION_REQUESTED -> (replacement) SUPERSEDED while a new Quote enters SENT, keeping ServiceRequest in QUOTED across rounds — a loop, distinct from the WarrantyClaim cycle on a different entity."
        test_recipe:
          setup:
            - "Customer M5 Z1; Mechanic K5 Z1 TIER2 rate 9000; SR5 in QUOTED with quote Q5a SENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "m5@x.com", full_name: "M Five", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { m5: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K Five", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 9000 }
              as: PlatformAdmin
              captures: { k5: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${m5}", vehicle_vin: "1HGCM82633A004356", symptom_text: "leak", severity: "ROUTINE" }
              as: Customer
              as_user_id: "${m5}"
              captures: { sr5: $.data.id }
            - call: "POST /service-requests/${sr5}/quotes"
              payload: { diagnosis_text: "v1", estimated_labor_hours: 2.0, estimated_parts_cents: 5000, labor_rate_cents_per_hour: 9000, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k5}"
              captures: { q5a: $.data.id }
            - call: "POST /quotes/${q5a}/request-revision"
              payload: {}
              as: Customer
              as_user_id: "${m5}"
          trigger:
            - call: "POST /service-requests/${sr5}/quotes"
              payload: { diagnosis_text: "v2 cheaper", estimated_labor_hours: 1.5, estimated_parts_cents: 3000, labor_rate_cents_per_hour: 9000, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k5}"
              captures: { q5b: $.data.id }
          assert:
            - "Quote.${q5a}.status == SUPERSEDED"
            - "Quote.${q5b}.status == SENT"
            - "Quote.${q5b}.quoted_total_cents == 16500"
            - "ServiceRequest.${sr5}.status == QUOTED"

      - name: warranty_claim_info_request_revision_cycle
        grounds:
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.WarrantyClaim.INFO_REQUESTED_to_UNDER_REVIEW
        distinguishing_aspect: "Cyclic shape on WarrantyClaim (a different entity than Quote): UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW returns to the prior state, a true revision loop rather than a linear pipeline."
        test_recipe:
          setup:
            - "A COMPLETED ServiceRequest SR6 (retail) exists with a filed WarrantyClaim WC6 in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { email: "m6@x.com", full_name: "M Six", home_zone_code: "Z1" }
              as: PlatformAdmin
              captures: { m6: $.data.id }
            - call: "POST /mechanics"
              payload: { full_name: "K Six", zone_code: "Z1", skill_tier: "TIER2", labor_rate_cents_per_hour: 9000 }
              as: PlatformAdmin
              captures: { k6: $.data.id }
            - call: "POST /service-requests"
              payload: { customer_id: "${m6}", vehicle_vin: "1HGCM82633A004357", symptom_text: "noise", severity: "ROUTINE" }
              as: Customer
              as_user_id: "${m6}"
              captures: { sr6: $.data.id }
            - call: "POST /service-requests/${sr6}/quotes"
              payload: { diagnosis_text: "diag", estimated_labor_hours: 1.0, estimated_parts_cents: 0, labor_rate_cents_per_hour: 9000, tow_fee_cents: 0 }
              as: Mechanic
              as_user_id: "${k6}"
              captures: { q6: $.data.id }
            - call: "GET /service-requests/${sr6}"
              payload: {}
              as: Dispatcher
              captures: { sv6a: $.data.version }
            - call: "POST /quotes/${q6}/approve"
              payload: { expected_service_request_version: "${sv6a}" }
              as: Customer
              as_user_id: "${m6}"
            - call: "GET /service-requests/${sr6}"
              payload: {}
              as: Dispatcher
              captures: { sv6b: $.data.version }
            - call: "POST /service-requests/${sr6}/dispatch"
              payload: { mechanic_id: "${k6}", routing_mode: "ON_SITE", scheduled_start_utc: "2026-04-02T09:00:00Z", scheduled_end_utc: "2026-04-02T10:00:00Z", expected_service_request_version: "${sv6b}" }
              as: Dispatcher
              captures: { jv6: $.data.id }
            - call: "POST /job-visits/${jv6}/depart"
              payload: {}
              as: Mechanic
              as_user_id: "${k6}"
            - call: "POST /job-visits/${jv6}/start-work"
              payload: {}
              as: Mechanic
              as_user_id: "${k6}"
            - call: "POST /job-visits/${jv6}/finish"
              payload: { logged_labor_hours: 1.0, payment_method: "CARD" }
              as: Mechanic
              as_user_id: "${k6}"
            - call: "POST /service-requests/${sr6}/warranty-claims"
              payload: { reason_text: "fault returned" }
              as: Customer
              as_user_id: "${m6}"
              captures: { wc6: $.data.id }
            - call: "POST /warranty-claims/${wc6}/request-info"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /warranty-claims/${wc6}/supply-info"
              payload: {}
              as: Customer
              as_user_id: "${m6}"
          assert:
            - "WarrantyClaim.${wc6}.status == UNDER_REVIEW"
            - "WarrantyClaim.${wc6}.version == 3"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finish_cascade_visit_to_request_to_payment_to_fleet_ledger
        grounds:
          - state_machines.JobVisit.ON_SITE_WORKING_to_FINISHED
          - state_machines.ServiceRequest.IN_PROGRESS_to_COMPLETED
          - entities.Payment.fields.status
          - entities.FleetAccount.fields.outstanding_balance_cents
        distinguishing_aspect: "Depth-3 cascade from the /finish trigger: JobVisit->FINISHED causes ServiceRequest->COMPLETED, which causes a Payment(INVOICED) to be created, which causes FleetAccount.outstanding_balance_cents to be debited by 26000 — each hop caused by the prior, not a fan-out."
        test_recipe:
          setup:
            - "FleetAccount F2 ACTIVE, credit_limit 1000000, labor_discount 0.20, outstanding 0."
            - "Customer M7 Z1 member of F2; Mechanic K7 Z1 TIER2 rate 9000; CatalogPart CP4 wholesale 4000."
            - "SR7 quoted est_hours 2.0/parts 8000 (fleet quoted 22400), approved, dispatched ON_SITE, part-line CP4 qty2; in progress; logged 2.0h => final 26000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
