            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Peer Two", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w2_id: "$.data.id" } }
          trigger:
            - { call: "GET /household-payroll/workers/${w2_id}", as: Worker, as_user_id: "${w1_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "403 with error_id == ERR_FORBIDDEN"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: registration_create_stale_occ
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[registration-create-stale-employer]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on HouseholdEmployer.version: a registration create carrying the pre-first-create version 1 after the first create bumped it to 2 is rejected 412; a retry with the fresh version succeeds."
        test_recipe:
          setup: ["Rule pack AA; employer created (version 1)"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Occ", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "SUTA", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg1: "$.data.id" } }
          trigger:
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "SIT_WITHHOLDING", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v2: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "SIT_WITHHOLDING", expected_employer_version: "${e_v2}" }, as: PayrollAdmin, captures: { reg2: "$.data.id" } }
          assert:
            - "stale create -> 412 ERR_STALE_VERSION (expected ${e_v}, employer version already 2)"
            - "retry with the fresh version succeeds 201 and employer.version increments by 1"
      - name: agreement_create_stale_occ
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agreement-create-stale-worker]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on DomesticWorker.version for create-with-supersede: after A1 bumps the worker version, a second create carrying the pre-A1 version is rejected 412 and no supersede happens."
        test_recipe:
          setup: ["Employer AA; worker CLASSIFIED with version captured before A1; agreement A1 created (version advanced)"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Occ2", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Occ W", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { a1_id: "$.data.id" } }
          trigger:
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3600, pay_method: "HOURLY", effective_from: "2026-03-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { err: "$.data.error_id" } }
            - { call: "GET /household-payroll/agreements/${a1_id}", as: PayrollAdmin, captures: { a1_st: "$.data.status" } }
          assert:
            - "stale create -> 412 ERR_STALE_VERSION"
            - "A1.status remains ACTIVE (no supersede side effect fired)"
      - name: derived_field_payrun_totals_at_calculate
        claim_type: derived_field_reconciliation
        grounds: [entities.PayRun.fields.total_net_cents, complexity_profile.complexity_layers]
        distinguishing_aspect: "Derived totals reconcile with member paychecks immediately at calculate: one 120000-gross guarantee paycheck under sit 0.05 -> totals gross 120000, net 114000, employer tax 3120 (FUTA 720 + SUTA 2400)."
        test_recipe:
          setup: ["Employer AA ACTIVE; worker ACTIVE (guarantee 2400 @3000); pay run created"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Der", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_id}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_id}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Der D", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/employers/${e_id}/pay-runs", payload: { period_start: "2026-01-05", period_end: "2026-01-12", pay_date: "2026-01-12" }, as: PayrollAdmin, captures: { pr_id: "$.data.id" } }
          trigger:
            - { call: "POST /household-payroll/pay-runs/${pr_id}/calculate", as: PayrollAdmin, captures: { pr_gross: "$.data.total_gross_cents", pr_net: "$.data.total_net_cents", pr_tax: "$.data.total_employer_tax_cents", pr_status: "$.data.status" } }
          assert:
            - "calculate response: status == CALCULATED, total_gross_cents == 120000, total_net_cents == 114000, total_employer_tax_cents == 3120"
            - "recalc_status == CURRENT"
      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: timesheet_approval_cascade_stales_payrun
          rationale: "N-level cascade covered by both §1.8 transitive_cascade instances."
      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: paycheck_gross_provisional_vs_final
          rationale: "Both variants asserted with literal deltas in §1.8."
      - name: layer_rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: fica_coverage_boundary_exact
          rationale: "Cumulative threshold boundary (>= exact, plus retroactive trigger) asserted in §1.8; FUTA quarterly boundary in futa_quarter_trigger_boundary; leave floor in leave_accrual_floor_boundary."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: finalize_response_reflects_state_immediately
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.PayRun.CALCULATED_to_FINALIZED]
        distinguishing_aspect: "Immediate consistency: the finalize 200 response itself carries status FINALIZED with final totals, and the member paycheck read in the next request already shows ISSUED/SENT/DELIVERED — no lag."
        test_recipe:
          setup: ["Employer AA fully registered; worker ACTIVE (guarantee 2400 @3000); pay run CALCULATED"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Imm", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_nh: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v2: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "SIT_WITHHOLDING", expected_employer_version: "${e_v2}" }, as: PayrollAdmin, captures: { reg_sit: "$.data.id" } }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_v3: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "SUTA", expected_employer_version: "${e_v3}" }, as: PayrollAdmin, captures: { reg_suta: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_nh}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_nh}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_sit}/activate", payload: { agency_account_number: "SIT-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_suta}/activate", payload: { agency_account_number: "SUTA-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Imm I", ssn: "123456789", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", guaranteed_minutes_per_week: 2400, effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/employers/${e_id}/pay-runs", payload: { period_start: "2026-01-05", period_end: "2026-01-12", pay_date: "2026-01-12" }, as: PayrollAdmin, captures: { pr_id: "$.data.id" } }
            - { call: "POST /household-payroll/pay-runs/${pr_id}/calculate", as: PayrollAdmin }
          trigger:
            - { call: "POST /household-payroll/pay-runs/${pr_id}/finalize", as: PayrollAdmin, captures: { pr_status: "$.data.status", pr_net: "$.data.total_net_cents" } }
            - { call: "GET /household-payroll/pay-runs/${pr_id}/paychecks", as: PayrollAdmin, captures: { pc_status: "$.data[0].status", pc_dep: "$.data[0].deposit_status", pc_stub: "$.data[0].stub_status" } }
          assert:
            - "finalize response itself: status == FINALIZED and total_net_cents == 114000"
            - "immediately afterwards: paycheck status == ISSUED, deposit_status == SENT, stub_status == DELIVERED (pack AA pay_stub_required true)"
