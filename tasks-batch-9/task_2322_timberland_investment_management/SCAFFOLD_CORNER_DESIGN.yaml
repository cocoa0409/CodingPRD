      - name: commit_on_a_completed_block_cannot_repeat
        claim_type: invalid_transitions
        grounds:
          - "state_machines.HarvestBlock.RESERVED_to_COMMITTED"
          - "state_machines.HarvestBlock.COMMITTED_to_COMPLETED"
          - "validations[priority=55]"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: |
          COMPLETED is terminal and commit is only declared from RESERVED. A second commit on a
          block that already completed must be refused with ERR_INVALID_STATE_TRANSITION and
          must not re-credit the fund: the 15858.07 final revenue was already banked once, so a
          second 415858.07 -> 431716.14 cash balance is the failure this pins.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; fund with 400000.00 opening cash and target 0 bps."
