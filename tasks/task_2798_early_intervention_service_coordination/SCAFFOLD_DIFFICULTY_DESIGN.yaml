  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: referral_ifsp_pending_reverts_to_evaluation_pending_on_supplemental
        grounds:
          - state_machines.Referral[IFSP_PENDING -> EVALUATION_PENDING]
          - state_machines.IFSP[PENDING_CONSENT -> WITHDRAWN]
          - state_machines.IFSPService[PLANNED -> DISCONTINUED]
          - calculations.initial_timeline_elapsed_days
          - endpoints[POST /ei/assessments]
        distinguishing_aspect: |
          This instance exercises a BACKWARD edge on the Referral machine: a case that has already
          reached IFSP_PENDING returns to EVALUATION_PENDING when a supplemental evaluation is
          scheduled, withdrawing the un-consented plan and its lines and putting the statutory clock
          back into IN_PROGRESS because the withdrawn plan's meeting_date stops qualifying as the stop
          instant. A forward-only implementation either rejects the supplemental assessment or leaves
          the plan standing. The other non_linear_state_machine instance concerns two PARALLEL state
          dimensions on one row, not a revert edge.
        test_recipe:
          setup:
            - "A case at IFSP_PENDING: coordinator assigned, both required assessments COMPLETED with 0 family-unavailable days, eligibility ELIGIBLE, entry outcomes recorded."
            - "An INITIAL IFSP with meeting_date 2026-03-20 carrying exactly one HOME service line, so the plan sits at PENDING_CONSENT and has never been consented."
            - "Logical clock parked at 2026-03-20T09:00:00Z; child born 2024-06-15 so the third birthday 2027-06-15 is far outside the 180-day transition window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Dana Reyes", county_code: "CNT_A", language_codes: ["EN"], max_weighted_caseload_points: 12.00 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_id: $.data.id }
            - call: "POST /ei/referrals/${ref_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-03-10", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-03-19", setting_code: "HOME" }
              as: Evaluator
              captures: { fam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-20T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/assessments/${eval_id}/complete"
              payload: { completion_date: "2026-03-18", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/assessments/${fam_id}/complete"
              payload: { completion_date: "2026-03-19", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/referrals/${ref_id}/eligibility-determination"
              payload: { is_eligible: true, determination_date: "2026-03-20" }
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref_id}/entry-outcomes"
              payload: { measurement_date: "2026-03-20", rating_social: 3, rating_knowledge: 4, rating_needs: 3 }
              as: Evaluator
            - call: "GET /ei/referrals/${ref_id}"
              as: ProgramAdmin
              captures: { ref_v: $.data.version }
            - call: "POST /ei/ifsps"
              payload: { referral_id: "${ref_id}", ifsp_type: "INITIAL", meeting_date: "2026-03-20", authoring_coordinator_id: "${coord_id}", expected_referral_version: "${ref_v}" }
              as: ProgramAdmin
              captures: { ifsp_id: $.data.id }
            - call: "POST /ei/ifsp-services"
              payload: { ifsp_id: "${ifsp_id}", service_type: "SPEECH_THERAPY", setting_code: "HOME", frequency_per_month: 4, units_per_session: 2, unit_rate_cents: 6500, planned_units_total: 96 }
              as: ProgramAdmin
              captures: { svc_id: $.data.id }
          trigger:
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref_id}", assessment_type: "SUPPLEMENTAL_EVALUATION", scheduled_date: "2026-03-25", setting_code: "HOME" }
              as: Evaluator
              captures: { supp_id: $.data.id }
            - call: "GET /ei/referrals/${ref_id}/timeline-compliance"
              as: ProgramAdmin
          assert:
            - "Referral.${ref_id}.status == \"EVALUATION_PENDING\" (the backward edge fired)"
            - "Referral.${ref_id}.eligibility_status == \"ELIGIBLE\" and entry_outcomes_date == \"2026-03-20\" (the revert does not erase recorded findings)"
            - "IFSP.${ifsp_id}.status == \"WITHDRAWN\""
            - "IFSP.${ifsp_id}.service_line_count == 0"
            - "IFSPService.${svc_id}.status == \"DISCONTINUED\""
            - "Assessment.${supp_id}.status == \"SCHEDULED\""
            - "Referral.${ref_id}.case_weight_points == 1.50 (pre-plan base with no interpreter, no transition window and 0 remaining lines)"
            - "ServiceCoordinator.${coord_id}.weighted_caseload_points == 1.50 and active_case_count == 1"
            - "response.data.initial_timeline_status == \"IN_PROGRESS\" (the withdrawn plan's meeting_date no longer stops the clock)"
            - "response.data.stop_date == \"2026-03-20\", gross_elapsed_days == 18, excluded_delay_days == 0 and net_elapsed_days == 18"

      - name: service_visit_parallel_status_dimensions_independent
        grounds:
          - state_machines.ServiceVisit[visit_status]
          - state_machines.ServiceVisit[billing_status]
          - calculations.visit_family_share_cents
          - calculations.makeup_obligation
          - endpoints[POST /ei/service-visits/{visitId}/document]
          - endpoints[POST /ei/service-visits/{visitId}/void]
        distinguishing_aspect: |
          This instance exercises the PARALLEL shape: one ServiceVisit row carries two state fields
          that advance on different edges, and the pairing is what must be right. Visit 1 walks
          visit_status SCHEDULED -> DELIVERED -> VOIDED while billing_status walks PENDING -> ACCRUED
          -> REVERSED and unwinds the family ledger; visit 2 walks visit_status SCHEDULED ->
          FAMILY_CANCELLED with billing_status jumping straight to CANCELLED_NO_CHARGE and creating
          NO makeup obligation. A single-status implementation collapses the two dimensions and either
          charges the cancelled visit or fails to reverse the delivered one. The other
          non_linear_state_machine instance is about a backward edge on a single dimension.
