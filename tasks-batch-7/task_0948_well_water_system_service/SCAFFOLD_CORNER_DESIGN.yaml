scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_account_creation_returns_all_declared_fields
        claim_type: Creation
        grounds: ["entities.Account", "endpoints"]
        distinguishing_aspect: "POST /water-service/accounts with every required field returns 201 and an Account whose balance_cents is 0, lifetime_invoiced_cents 0, lifetime_paid_cents 0, credit_hold false and version 1."
        test_recipe:
          setup: ["Empty database; logical clock left at its 2026-05-01T00:00:00Z default."]
          setup_api_calls:
            - call: "GET /water-service/_clock"
              payload: {}
              as: PlatformAdmin
              captures: { clock0: $.data.current_utc }
          trigger:
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Corner Account One", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "one@corner.example", membership_tier: "SELECT" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "${clock0} == 2026-05-01T00:00:00.000Z"
            - "HTTP status is 201"
            - "Account.${acct_id}.legal_name == Corner Account One"
            - "Account.${acct_id}.membership_tier == SELECT"
            - "Account.${acct_id}.balance_cents == 0"
            - "Account.${acct_id}.lifetime_invoiced_cents == 0"
            - "Account.${acct_id}.lifetime_paid_cents == 0"
            - "Account.${acct_id}.credit_hold == false"
            - "Account.${acct_id}.version == 1"

      - name: corner_account_membership_tier_defaults_to_none
        claim_type: Defaults
        grounds: ["entities.Account.fields.membership_tier"]
        distinguishing_aspect: "Omitting membership_tier on account creation stores NONE, which is what emergency_preauth_cap_cents reads to produce a 75000-cent cap."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Default Tier Co", billing_jurisdiction_code: "JUR_BRAVO", contact_email: "def@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "Account.${acct_id}.membership_tier == NONE"
            - "Account.${acct_id}.credit_hold == false"

      - name: corner_account_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_ACCOUNT_NOT_FOUND]", "gate_precedence.order"]
        distinguishing_aspect: "GET /water-service/accounts/{id} with a well-formed UUID that names no stored account returns 404 ERR_ACCOUNT_NOT_FOUND at G3_PATH_EXISTENCE."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /water-service/accounts/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ACCOUNT_NOT_FOUND"
            - "HTTP status is 404"

      - name: corner_property_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["validations[priority=30]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /water-service/properties without household_size fails at G8_PAYLOAD with ERR_VALIDATION and creates nothing."
        test_recipe:
          setup: ["One account exists."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Missing Field Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "mf@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "1 Missing", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION"
            - "HTTP status is 400"
            - "GET /water-service/properties with account_id == ${acct_id} returns 0 rows"

      - name: corner_property_service_zone_is_computed_at_every_boundary
        claim_type: Computed Fields
        grounds: ["entities.Property.fields.service_zone", "calculations.trip_fee_cents"]
        distinguishing_aspect: "distance_miles 15.0 stores ZONE_1, 15.01 stores ZONE_2, 60.0 stores ZONE_3 and 60.01 stores OUT_OF_AREA - all four upper bounds inclusive."
        test_recipe:
          setup: ["One account exists."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Zone Boundary Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "zb@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "15 Zone", jurisdiction_code: "JUR_ALPHA", distance_miles: 15.0, household_size: 2 }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "15.01 Zone", jurisdiction_code: "JUR_ALPHA", distance_miles: 15.01, household_size: 2 }
              as: PlatformAdmin
              captures: { p2: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "60 Zone", jurisdiction_code: "JUR_ALPHA", distance_miles: 60.0, household_size: 2 }
              as: PlatformAdmin
              captures: { p3: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "60.01 Zone", jurisdiction_code: "JUR_ALPHA", distance_miles: 60.01, household_size: 2 }
              as: PlatformAdmin
              captures: { p4: $.data.id }
          assert:
            - "Property.${p1}.service_zone == ZONE_1"
            - "Property.${p2}.service_zone == ZONE_2"
            - "Property.${p3}.service_zone == ZONE_3"
            - "Property.${p4}.service_zone == OUT_OF_AREA"

      - name: corner_well_profile_invalid_enum_value_rejected
        claim_type: Type Constraints
        grounds: ["validations[priority=31]", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "well_type PUNCHED is not a declared member of {DRILLED, DRIVEN, DUG} and fails at G8_PAYLOAD with ERR_INVALID_ENUM, not ERR_VALIDATION."
        test_recipe:
          setup: ["One account and one property exist."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Enum Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "en@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "1 Enum", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 2 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "PUNCHED", depth_feet: 100.0 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_ENUM"
            - "HTTP status is 400"

      - name: corner_well_profile_body_fk_unknown_property_not_found_at_g9
        claim_type: Parent Relationships
        grounds: ["validations[priority=37]", "errors[ERR_PROPERTY_NOT_FOUND]", "gate_precedence.order"]
        distinguishing_aspect: "A body-referenced property_id that names nothing fails at G9A with ERR_PROPERTY_NOT_FOUND - not at G3, which only inspects PATH segments."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "11111111-2222-4333-8444-555555555555", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 100.0 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PROPERTY_NOT_FOUND"
            - "HTTP status is 404"

      - name: corner_technician_listing_paginates_with_envelope_fields
        claim_type: Listing
        grounds: ["calculations.pagination_window", "response_envelope"]
        distinguishing_aspect: "GET /water-service/technicians?limit=2&offset=1 over three technicians returns 2 rows with total_count 3 and has_more false, sorted created_at ASC."
        test_recipe:
          setup: ["Three technicians created in a known order."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/technicians"
              payload: { full_name: "Tech A", tier: "APPRENTICE", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { t_a: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Tech B", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { t_b: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Tech C", tier: "MASTER", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { t_c: $.data.id }
          trigger:
            - call: "GET /water-service/technicians"
              payload: { limit: 2, offset: 1 }
              as: PlatformAdmin
          assert:
            - "response meta pagination total_count == 3"
            - "response has_more == false"
            - "the returned array has exactly 2 elements, ${t_b} then ${t_c}"

      - name: corner_maintenance_visit_is_immutable_and_carries_no_version
        claim_type: Immutability
        grounds: ["entities.MaintenanceVisit"]
        distinguishing_aspect: "MaintenanceVisit is declared common_fields false, so a visit row exposes id and created_at but no version and no update endpoint exists anywhere in section 1.5."
        excluded_because:
          difficulty_instance: transitive_cascade / work_order_completion_eight_hop_cascade_through_warranty_callback_and_billing
          rationale: "That instance already creates MaintenanceVisit rows only as a cascade side effect and reads them back through the plan sub-resource; there is no mutating endpoint to probe."

      - name: corner_shared_well_agreement_links_two_aggregates
        claim_type: Parent Relationships
        grounds: ["entities.SharedWellAgreement", "calculations.shared_well_billing_split_cents"]
        distinguishing_aspect: "The graph topology is real: one SharedWellAgreement row carries an FK to WellProfile and an independent FK to Account, and both filtered lists find it."
        test_recipe:
          setup: ["Two accounts, one property under the first, one well, and one 60.00 percent agreement for the second account."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Share A", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "a@share.example" }
              as: PlatformAdmin
              captures: { acct_a: $.data.id }
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Share B", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "b@share.example" }
              as: PlatformAdmin
              captures: { acct_b: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_a}", address_line: "1 Share", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 2 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
          trigger:
            - call: "POST /water-service/shared-well-agreements"
              payload: { well_profile_id: "${well_id}", account_id: "${acct_b}", split_pct: 60.00 }
              as: BillingClerk
              captures: { agr_id: $.data.id }
            - call: "GET /water-service/shared-well-agreements"
              payload: { well_profile_id: "${well_id}" }
              as: BillingClerk
            - call: "GET /water-service/shared-well-agreements"
              payload: { account_id: "${acct_b}" }
              as: BillingClerk
          assert:
            - "SharedWellAgreement.${agr_id}.status == ACTIVE"
            - "SharedWellAgreement.${agr_id}.split_pct == 60.00"
            - "the well-filtered list returns exactly 1 row, ${agr_id}"
            - "the account-filtered list returns exactly 1 row, ${agr_id}"

      - name: corner_well_profile_defaults_drawdown_and_derives_duty_cycle
        claim_type: Defaults
        grounds: ["entities.WellProfile.fields.pressure_tank_drawdown_gallons", "calculations.duty_cycle_ratio", "calculations.duty_cycle_class"]
        distinguishing_aspect: "Omitting pressure_tank_drawdown_gallons stores the declared default 6.0, which immediately derives duty_cycle_ratio 5.00 and duty_cycle_class MODERATE."
        test_recipe:
          setup: ["One account and one property exist."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Default Drawdown Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "dd@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "6 Default", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 2 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRIVEN", depth_feet: 60.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
          assert:
            - "WellProfile.${well_id}.pressure_tank_drawdown_gallons == 6.0"
            - "WellProfile.${well_id}.duty_cycle_ratio == 5.00"
            - "WellProfile.${well_id}.duty_cycle_class == MODERATE"
            - "WellProfile.${well_id}.potability_status == UNKNOWN"
            - "WellProfile.${well_id}.measured_yield_gpm is null"

  - section: state_machines
    instances:
      - name: corner_inspection_starts_in_scheduled_and_cannot_be_completed_first
        claim_type: Initial State
        grounds: ["state_machines.Inspection.SCHEDULED_to_IN_PROGRESS", "errors[ERR_INSPECTION_INVALID_STATE]"]
        distinguishing_aspect: "A freshly created inspection is SCHEDULED; calling /complete before /start fails at G5 with ERR_INSPECTION_INVALID_STATE and writes no measurements."
        test_recipe:
          setup: ["One account, property, well and AVAILABLE technician; one SCHEDULED inspection."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Insp Init Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "ii@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "1 Insp", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 2 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Insp Tech", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /water-service/inspections"
              payload: { well_profile_id: "${well_id}", technician_id: "${tech_id}", scheduled_for: "2026-06-01T10:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /water-service/inspections/${insp_id}/complete"
              payload: { measured_yield_gpm: 10.0, static_level_feet: 30.0, observed_drawdown_gallons: 6.0 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INSPECTION_INVALID_STATE"
            - "HTTP status is 409"
            - "Inspection.${insp_id}.status == SCHEDULED"
            - "Inspection.${insp_id}.completed_at is null"
            - "WellProfile.${well_id}.measured_yield_gpm is null"

      - name: corner_inspection_cancel_from_completed_is_rejected
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Inspection.IN_PROGRESS_to_COMPLETED", "errors[ERR_INSPECTION_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is a terminal state for Inspection: /cancel from COMPLETED fails with ERR_INSPECTION_INVALID_STATE and the well keeps its measured yield."
        test_recipe:
          setup: ["One account, property, well, technician and a COMPLETED inspection reporting 14.0 gpm."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Terminal Co", billing_jurisdiction_code: "JUR_ALPHA", contact_email: "tc@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "2 Terminal", jurisdiction_code: "JUR_ALPHA", distance_miles: 10.0, household_size: 2 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/technicians"
              payload: { full_name: "Term Tech", tier: "JOURNEYMAN", home_jurisdiction_code: "JUR_ALPHA", status: "AVAILABLE" }
              as: PlatformAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /water-service/inspections"
              payload: { well_profile_id: "${well_id}", technician_id: "${tech_id}", scheduled_for: "2026-06-01T10:00:00Z" }
              as: Dispatcher
              captures: { insp_id: $.data.id }
            - call: "POST /water-service/inspections/${insp_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /water-service/inspections/${insp_id}/complete"
              payload: { measured_yield_gpm: 14.0, static_level_feet: 30.0, observed_drawdown_gallons: 6.0 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /water-service/inspections/${insp_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INSPECTION_INVALID_STATE"
            - "Inspection.${insp_id}.status == COMPLETED"
            - "WellProfile.${well_id}.measured_yield_gpm == 14.0"

      - name: corner_permit_reject_then_refile_draft_completes_the_cycle
        claim_type: Valid Transition
        grounds: ["state_machines.Permit.FILED_to_REJECTED", "state_machines.Permit.REJECTED_to_DRAFT", "calculations.permit_fee_cents"]
        distinguishing_aspect: "DRAFT -> FILED -> REJECTED -> DRAFT is a real cycle: refile-draft clears filed_at and resets fee_cents to 0, and the permit can then be filed again and re-priced."
        test_recipe:
          setup: ["One account, property and well in JUR_ALPHA (TIER_A); one DRAFT permit of scope PUMP_REPLACEMENT."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
              payload: { legal_name: "Refile Co", billing_jurisdiction_code: "JUR_BRAVO", contact_email: "rf@corner.example" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /water-service/properties"
              payload: { account_id: "${acct_id}", address_line: "3 Refile", jurisdiction_code: "JUR_BRAVO", distance_miles: 10.0, household_size: 2 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /water-service/well-profiles"
              payload: { property_id: "${prop_id}", jurisdiction_code: "JUR_ALPHA", well_type: "DRILLED", depth_feet: 200.0 }
              as: PlatformAdmin
              captures: { well_id: $.data.id }
            - call: "POST /water-service/permits"
              payload: { well_profile_id: "${well_id}", jurisdiction_code: "JUR_ALPHA", scope: "PUMP_REPLACEMENT", expedited: false, post_hoc: false }
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { permit_id: $.data.id }
            - call: "POST /water-service/permits/${permit_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /water-service/permits/${permit_id}/reject"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
          trigger:
            - call: "POST /water-service/permits/${permit_id}/refile-draft"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /water-service/permits/${permit_id}/file"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-alpha"
          assert:
            - "Permit.${permit_id}.status == FILED"
            - "Permit.${permit_id}.jurisdiction_tier == TIER_A"
            - "Permit.${permit_id}.fee_cents == 35000"
            - "Permit.${permit_id}.filed_at == 2026-06-01T09:00:00.000Z"

      - name: corner_permit_withdraw_from_filed_is_terminal
        claim_type: Valid Transition
        grounds: ["state_machines.Permit.FILED_to_WITHDRAWN", "errors[ERR_PERMIT_INVALID_STATE]"]
        distinguishing_aspect: "WITHDRAWN is terminal: after withdrawing a FILED permit, a further /approve fails with ERR_PERMIT_INVALID_STATE."
        test_recipe:
          setup: ["One account, property, well and a FILED PRESSURE_TANK permit in JUR_CHARLIE."]
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
