# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — Task 1271: Industrial Painting & E-Coat Line
# §1.9 Coverage Index — every testable claim of §1.1–§1.7 not already covered
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml (breadth probe).
# =============================================================================

scaffold_corner_design:

  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: customer_create_returns_system_fields
        claim_type: creation
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /ecoat/customers returns 201 with server-minted id, created_at and version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id, cv: $.data.version }
          assert:
            - "response 201; Customer.${c1}.version == 1 and created_at is set (system fields minted server-side)"

      - name: coating_spec_create_supersedes_prior_active
        claim_type: computed_fields
        grounds: [entities.CoatingSpec.fields.status, state_machines.CoatingSpec.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Creating a second spec for the same (customer_id, color_code) flips the first to SUPERSEDED and bumps its version; the new one is ACTIVE."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec_a: $.data.id }
          trigger:
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 20.0, film_build_max_um: 26.0, cure_metal_temp_c: 185.0, cure_minutes_at_temp: 22, adhesion_class_min: 3, impact_joules_min: 45.0, voc_g_per_l: 300.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec_b: $.data.id }
          assert:
            - "CoatingSpec.${spec_a}.status == SUPERSEDED and its version incremented to 2"
            - "CoatingSpec.${spec_b}.status == ACTIVE with version == 1"

      - name: accept_with_superseded_spec_returns_not_active
        claim_type: violation_to_error
        grounds: ["errors[ERR_SPEC_NOT_ACTIVE]", state_machines.Lot.RECEIVED_to_QUEUED]
        distinguishing_aspect: "A lot referencing a SUPERSEDED spec cannot be accepted: ERR_SPEC_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["spec A created then superseded by spec B for the same customer+color; lot L references spec A"]
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec_a: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 20.0, film_build_max_um: 26.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec_a}", part_quantity: 10 }
              as: LineScheduler
              captures: { lot1: $.data.id }
          trigger:
            - call: "POST /ecoat/lots/${lot1}/accept"
              payload: {}
              as: LineScheduler
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SPEC_NOT_ACTIVE; Lot.${lot1}.status remains RECEIVED"

      - name: lot_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent lot id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ecoat/lots/00000000-0000-4000-8000-000000000000"
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and err == ERR_NOT_FOUND"

      - name: lot_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Lot.fields.part_quantity]
        distinguishing_aspect: "Omitting required part_quantity on lot creation yields ERR_INVALID_REQUEST (400) before any existence check runs."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec1: $.data.id }
          trigger:
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}" }
              as: LineScheduler
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and err == ERR_INVALID_REQUEST"

      - name: paint_line_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.PaintLine.fields.allocation_policy, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "allocation_policy outside {FULL_TO_NEXT_LOT, PRO_RATA_BY_PARTS} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "SPLIT_EVENLY" }
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and err == ERR_INVALID_REQUEST"

      - name: titration_reading_computed_field_input_rejected
        claim_type: computed_fields
        grounds: [entities.TitrationReading.fields.in_range, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "in_range is computed server-side; a client-supplied in_range field in the create body is not accepted (ERR_INVALID_REQUEST)."
        test_recipe:
          setup: ["line + stage exist"]
          setup_api_calls:
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /ecoat/titration-readings"
              payload: { stage_id: "${st1}", measured_conc_gpl: 25.0, in_range: false }
              as: ProcessChemist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and err == ERR_INVALID_REQUEST (computed field is not client-settable)"

      - name: negative_concentration_returns_measurement_invalid
        claim_type: type_constraints
        grounds: ["errors[ERR_MEASUREMENT_INVALID]", entities.TitrationReading.fields.measured_conc_gpl]
        distinguishing_aspect: "measured_conc_gpl < 0 is a domain-range violation: ERR_MEASUREMENT_INVALID (422)."
        test_recipe:
          setup: ["line + stage exist"]
          setup_api_calls:
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /ecoat/titration-readings"
              payload: { stage_id: "${st1}", measured_conc_gpl: -1.0 }
              as: ProcessChemist
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and err == ERR_MEASUREMENT_INVALID"

  # -------------------------------------------------------- state machines ---
  - section: state_machines
    instances:
      - name: lot_release_from_received_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Lot, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Release from RECEIVED (nothing else done) is an invalid transition: ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["customer, spec, lot in RECEIVED"]
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec1: $.data.id }
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}", part_quantity: 10 }
              as: LineScheduler
              captures: { lot1: $.data.id }
          trigger:
            - call: "POST /ecoat/lots/${lot1}/release"
              payload: {}
              as: QualityManager
              as_user_id: qm-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (409); Lot.${lot1}.status remains RECEIVED"

      - name: lot_cancel_then_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Lot.RECEIVED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel from RECEIVED succeeds (CANCELLED terminal); a second cancel on the terminal lot is rejected."
        test_recipe:
          setup: ["customer, spec, lot in RECEIVED"]
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec1: $.data.id }
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}", part_quantity: 10 }
              as: LineScheduler
              captures: { lot1: $.data.id }
          trigger:
            - call: "POST /ecoat/lots/${lot1}/cancel"
              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/lots/${lot1}/cancel"
              payload: {}
              as: LineScheduler
              captures: { err: $.data.error_id }
          assert:
            - "First cancel: Lot.${lot1}.status == CANCELLED"
            - "Second cancel: err == ERR_INVALID_STATE (terminal lockdown)"

      - name: run_slot_cancel_completed_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RunSlot, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED slot is terminal for cancel: ERR_INVALID_STATE; lot stays CURING and the metered emission entry is NOT reversed."
        test_recipe:
          setup: ["full pipeline: lot qty 100 COMPLETED its run slot (metered 0.95 L → 0.304 kg)"]
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec1: $.data.id }
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
              captures: { perm1: $.data.id }
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}", part_quantity: 100 }
              as: LineScheduler
              captures: { lot1: $.data.id }
            - call: "POST /ecoat/lots/${lot1}/accept"
              payload: {}
              as: LineScheduler
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv: $.data.version }
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot1}", start_utc: "2026-05-05T08:00:00Z", end_utc: "2026-05-05T10:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv}" }
              as: LineScheduler
              captures: { slot1: $.data.id }
            - call: "POST /ecoat/run-slots/${slot1}/start"
              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/run-slots/${slot1}/complete"
              payload: { paint_used_liters: 0.95 }
              as: LineScheduler
          trigger:
            - call: "POST /ecoat/run-slots/${slot1}/cancel"
              payload: {}
              as: LineScheduler
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (COMPLETED is terminal)"
            - "VocPermit.${perm1}.used_kg remains 0.304 (no compensation happened)"

      - name: stage_in_range_reading_while_out_of_range_stays_out
        claim_type: guarded_transition
        grounds: [state_machines.PretreatmentStage]
        distinguishing_aspect: "An in-range reading posted while the stage is OUT_OF_RANGE does NOT restore IN_RANGE — only the adjustment edge ADJUSTING→IN_RANGE may; the stage remains OUT_OF_RANGE."
        test_recipe:
          setup: ["line + stage; stage driven OUT_OF_RANGE by a 19.9 reading"]
          setup_api_calls:
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
              captures: { st1: $.data.id }
            - call: "POST /ecoat/titration-readings"
              payload: { stage_id: "${st1}", measured_conc_gpl: 19.9 }
              as: ProcessChemist
          trigger:
            - call: "POST /ecoat/titration-readings"
              payload: { stage_id: "${st1}", measured_conc_gpl: 25.0 }
              as: ProcessChemist
              captures: { rd_ok: $.data.in_range }
          assert:
            - "Second reading's in_range == true, yet PretreatmentStage.${st1}.status remains OUT_OF_RANGE"
            - "PaintLine.${line1}.posture remains CHEM_HOLD"

      - name: permit_close_before_period_end_returns_not_expired
        claim_type: precondition_enforcement
        grounds: [state_machines.VocPermit.ACTIVE_to_CLOSED, "errors[ERR_PERMIT_NOT_EXPIRED]"]
        distinguishing_aspect: "Close while the logical clock (2026-05-01 default) is before period_end (2026-06-01): ERR_PERMIT_NOT_EXPIRED."
        test_recipe:
          setup: ["permit 2026-05-01 → 2026-06-01 exists; clock untouched at default"]
          setup_api_calls:
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
              captures: { perm1: $.data.id }
          trigger:
            - call: "POST /ecoat/voc-permits/${perm1}/close"
              payload: {}
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERMIT_NOT_EXPIRED (409); VocPermit.${perm1}.status remains ACTIVE"

      - name: permit_close_twice_returns_period_closed
        claim_type: invalid_transition
        grounds: [state_machines.VocPermit.ACTIVE_to_CLOSED, "errors[ERR_PERMIT_PERIOD_CLOSED]"]
        distinguishing_aspect: "Closing an already-CLOSED permit is a terminal-state violation: ERR_PERMIT_PERIOD_CLOSED; the second close posts no further adjustment entry."
        test_recipe:
          setup: ["permit exists; clock advanced past period_end; first close succeeds (no entries → adjustment 0.000, used 0 <= cap → CLOSED)"]
          setup_api_calls:
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
              captures: { perm1: $.data.id }
            - call: "POST /ecoat/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:01Z" }
              as: PlantAdmin
            - call: "POST /ecoat/voc-permits/${perm1}/close"
              payload: {}
              as: PlantAdmin
          trigger:
            - call: "POST /ecoat/voc-permits/${perm1}/close"
              payload: {}
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "First close: VocPermit.${perm1}.status == CLOSED with used_kg == 0.0"
            - "Second close: err == ERR_PERMIT_PERIOD_CLOSED (409)"

      - name: oven_recheck_of_already_rechecked_cycle_rejected
        claim_type: precondition_enforcement
        grounds: ["errors[ERR_RECHECK_NOT_ALLOWED]", entities.OvenCycle.fields.recheck_of_id]
        distinguishing_aspect: "A failed cycle that already has one recheck child cannot be rechecked again — second recheck attempt on the same parent yields ERR_RECHECK_NOT_ALLOWED while the lot is CURE_FAILED."
        test_recipe:
          setup: ["full pipeline to CURING; first cycle FAIL (170.0 °C); recheck cycle also FAIL (175.0 °C) — lot stays CURE_FAILED"]
          setup_api_calls:
            - call: "POST /ecoat/customers"
              payload: { name: "Acme Housings" }
              as: PlantAdmin
              captures: { c1: $.data.id }
            - call: "POST /ecoat/coating-specs"
              payload: { customer_id: "${c1}", color_code: "RAL9005", film_build_min_um: 18.0, film_build_max_um: 30.0, cure_metal_temp_c: 180.0, cure_minutes_at_temp: 20, adhesion_class_min: 2, impact_joules_min: 40.0, voc_g_per_l: 320.0, area_dm2_per_part: 12.0 }
              as: PlantAdmin
              captures: { spec1: $.data.id }
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
            - call: "POST /ecoat/cure-ovens"
              payload: { name: "OV-1", max_loads: 2 }
              as: PlantAdmin
              captures: { oven1: $.data.id }
            - call: "POST /ecoat/voc-permits"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", cap_kg: 500.0 }
              as: PlantAdmin
            - call: "POST /ecoat/lots"
              payload: { customer_id: "${c1}", spec_id: "${spec1}", part_quantity: 100 }
              as: LineScheduler
              captures: { lot1: $.data.id }
            - call: "POST /ecoat/lots/${lot1}/accept"
              payload: {}
              as: LineScheduler
            - call: "GET /ecoat/paint-lines/${line1}"
              as: LineScheduler
              captures: { lv: $.data.version }
            - call: "POST /ecoat/run-slots"
              payload: { paint_line_id: "${line1}", lot_id: "${lot1}", start_utc: "2026-05-05T08:00:00Z", end_utc: "2026-05-05T10:00:00Z", parts_per_hanger: 20, expected_paint_line_version: "${lv}" }
              as: LineScheduler
              captures: { slot1: $.data.id }
            - call: "POST /ecoat/run-slots/${slot1}/start"
              payload: {}
              as: LineScheduler
            - call: "POST /ecoat/run-slots/${slot1}/complete"
              payload: { paint_used_liters: 0.95 }
              as: LineScheduler
            - call: "POST /ecoat/oven-cycles"
              payload: { lot_id: "${lot1}", oven_id: "${oven1}", entered_at: "2026-05-05T10:05:00Z", exited_at: "2026-05-05T10:45:00Z", min_metal_temp_c: 170.0, minutes_at_or_above_temp: 22 }
              as: QcInspector
              as_user_id: qc-1
              captures: { oc1: $.data.id }
            - call: "POST /ecoat/oven-cycles"
              payload: { lot_id: "${lot1}", oven_id: "${oven1}", entered_at: "2026-05-05T11:05:00Z", exited_at: "2026-05-05T11:45:00Z", min_metal_temp_c: 175.0, minutes_at_or_above_temp: 22, recheck_of_id: "${oc1}" }
              as: QcInspector
              as_user_id: qc-1
              captures: { oc2: $.data.id }
          trigger:
            - call: "POST /ecoat/oven-cycles"
