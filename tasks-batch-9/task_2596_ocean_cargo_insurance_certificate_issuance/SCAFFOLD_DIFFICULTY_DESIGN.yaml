        depth: 4
        grounds:
          - endpoints.POST_/ga-events/{id}/finalize-adjustment
          - state_machines.GeneralAverageEvent.status.SECURITY_COMPLETE_to_ADJUSTED
          - state_machines.GaSecurityPosting.status.POSTED_to_RELEASED
          - state_machines.Vessel.status.GA_HOLD_to_APPROVED
        distinguishing_aspect: |
          A different triggering transition (POST
          /ga-events/{id}/finalize-adjustment) and a different propagation
          pattern — money held as security flowing back out, rather than cover
          falling away:
            link 1  the GeneralAverageEvent goes SECURITY_COMPLETE -> ADJUSTED;
            link 2  BECAUSE the event closed, every GaSecurityPosting on it goes
                    POSTED -> RELEASED;
            link 3  BECAUSE each posting released, the OpenPolicy's
                    security_deposit_held_amount is reduced by that posting's
                    cash_deposit_amount, returning from 31500.00 to 0.00;
            link 4  BECAUSE the event closed, the Vessel's open_ga_event_count
                    falls to 0 and the vessel leaves GA_HOLD for APPROVED,
                    which makes it issuable again.
          The deposit ledger is the falsifier: an implementation that zeroes
          security_deposit_held_amount from the event instead of per released
          posting drifts as soon as one posting lodged more cash than required.
