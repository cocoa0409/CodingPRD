  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role / X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any role or existence check (the harness sends this trigger with both headers stripped)."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
          trigger:
            - { call: "GET /respite/programs/${prog}", as: FunderAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: posture_pause_gates_enrollment
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_POSTURE_GATE]"]
        distinguishing_aspect: "With posture ENROLLMENT_PAUSED, caregiver creation is rejected with ERR_POSTURE_GATE (409); after resuming to ENROLLMENT_OPEN the identical create succeeds (201)."
        test_recipe:
          setup: ["Program paused via posture transition"]
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/programs/${prog}/posture", payload: { target_posture: "ENROLLMENT_PAUSED" }, as: FunderAdmin }
          trigger:
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { err: $.data.error_id } }
            - { call: "POST /respite/programs/${prog}/posture", payload: { target_posture: "ENROLLMENT_OPEN" }, as: FunderAdmin }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
          assert:
            - "first create error_id == ERR_POSTURE_GATE"
            - "second create returns 201 with Caregiver status ENROLLED"

      - name: appeal_window_closed_after_30_days
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_APPEAL_WINDOW_CLOSED]"]
        distinguishing_aspect: "Appeal at decided_at + 31 days (clock 2026-06-04T22:00Z for a 2026-05-04T22:00Z denial with appeal_window_days 30) is rejected with ERR_APPEAL_WINDOW_CLOSED."
        test_recipe:
          setup: ["Monday-evening claim DENIED at 2026-05-04T22:00:00Z; clock advanced to 2026-06-04T22:00:00Z"]
