# =============================================================================
# Task 1709 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and drives empty-DB -> precondition via declared endpoints only.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: incentive_earned_vs_provisional_projection
        grounds:
          - calculations.session_incentive
          - entities.Registration.fields.incentive_earned_cents
        distinguishing_aspect: |
          Same registrations, two variants on the Registration/incentive domain:
          earned_cents counts ATTENDED only (983), while provisional_cents is the
          forward-looking projection that also counts the REGISTERED session and the
          projected completion bonus (4466) — identical data, different results.
        test_recipe:
          setup:
            - "Module M (655 cents/hr, completion_threshold 2, bonus 2500); certified coach K; participant P"
            - "W1 2026-08-02T10:00Z 90min: P ATTENDED (per-session = round_half_up(655*1.5) = round_half_up(982.5) = 983)"
            - "W2 2026-08-03T10:00Z 90min: P REGISTERED (projection adds another 983; attended+registered = 2 >= threshold 2, so projected bonus 2500 included)"
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "BF-101", title: "Budgeting Basics", session_count: 4, incentive_cents_per_hour: 655, completion_bonus_cents: 2500, completion_threshold: 2 }, as: ProgramAdmin, captures: { mod_id: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "K One", email: "k1@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P One", email: "p1@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm A", start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T11:30:00Z", capacity: 10 }, as: ProgramAdmin, captures: { w1_id: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm A", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:30:00Z", capacity: 10 }, as: ProgramAdmin, captures: { w2_id: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w1_id}", participant_id: "${part_id}" }, as: ProgramAdmin, captures: { reg1_id: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w2_id}", participant_id: "${part_id}" }, as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /registrations/${reg1_id}/mark-attendance", payload: { outcome: "ATTENDED" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /participants/${part_id}/incentive-summary", payload: {}, as: ProgramAdmin }
          assert:
            - "incentive-summary.earned_cents == 983"
            - "incentive-summary.provisional_cents == 4466"
            - "incentive-summary.earned_cents != incentive-summary.provisional_cents"

      - name: funder_report_cohort_vs_rolling
        grounds:
          - calculations.funder_outcome_aggregation
          - entities.FunderReport.fields.variant
        distinguishing_aspect: |
          Same snapshot data, two variants on the FunderReport/participant-outcome
          domain: COHORT counts only new entrants whose first case intake_date falls
          inside the period (avg credit delta 30.0), while ROLLING counts everyone
          served with any case before period end (avg 25.0) — different inclusion
          sets produce different averages.
        test_recipe:
          setup:
            - "Certified coach K; participant PA (first case intake 2026-01-10, in period); participant PB (first case intake 2025-11-15, before period)"
            - "PA snapshots: 2026-01-05 score 580 savings 100000; 2026-01-25 score 610 savings 150000 (credit delta +30, savings +50000)"
            - "PB snapshots: 2026-01-03 score 640 savings 200000; 2026-01-30 score 660 savings 210000 (credit delta +20, savings +10000)"
            - "Period [2026-01-01, 2026-02-01); logical clock untouched (2026-08-01) so no case completions fall inside the period"
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "K Two", email: "k2@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "PA", email: "pa@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { pa_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "PB", email: "pb@x.org", annual_income_cents: 5000000 }, as: ProgramAdmin, captures: { pb_id: "$.data.id" } }
            - { call: "POST /coaching-cases", payload: { participant_id: "${pa_id}", coach_id: "${coach_id}", intake_date: "2026-01-10" }, as: ProgramAdmin }
            - { call: "POST /coaching-cases", payload: { participant_id: "${pb_id}", coach_id: "${coach_id}", intake_date: "2025-11-15" }, as: ProgramAdmin }
            - { call: "POST /outcome-snapshots", payload: { participant_id: "${pa_id}", recorded_at: "2026-01-05T00:00:00Z", credit_score: 580, savings_balance_cents: 100000 }, as: ProgramAdmin }
            - { call: "POST /outcome-snapshots", payload: { participant_id: "${pa_id}", recorded_at: "2026-01-25T00:00:00Z", credit_score: 610, savings_balance_cents: 150000 }, as: ProgramAdmin }
            - { call: "POST /outcome-snapshots", payload: { participant_id: "${pb_id}", recorded_at: "2026-01-03T00:00:00Z", credit_score: 640, savings_balance_cents: 200000 }, as: ProgramAdmin }
            - { call: "POST /outcome-snapshots", payload: { participant_id: "${pb_id}", recorded_at: "2026-01-30T00:00:00Z", credit_score: 660, savings_balance_cents: 210000 }, as: ProgramAdmin }
          trigger:
            - { call: "POST /funder-reports", payload: { period_start: "2026-01-01", period_end: "2026-02-01", variant: "COHORT" }, as: ProgramAdmin, captures: { rep_c: "$.data.id" } }
            - { call: "POST /funder-reports", payload: { period_start: "2026-01-01", period_end: "2026-02-01", variant: "ROLLING" }, as: ProgramAdmin, captures: { rep_r: "$.data.id" } }
          assert:
            - "FunderReport.${rep_c}.participants_measured == 1"
            - "FunderReport.${rep_c}.avg_credit_delta_points == 30.0"
            - "FunderReport.${rep_c}.avg_savings_delta_cents == 50000"
            - "FunderReport.${rep_c}.completions_count == 0"
            - "FunderReport.${rep_r}.participants_measured == 2"
            - "FunderReport.${rep_r}.avg_credit_delta_points == 25.0"
            - "FunderReport.${rep_r}.avg_savings_delta_cents == 30000"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) tiered/nested, (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: match_accrual_tiered_guards
        grounds:
          - calculations.match_accrual
          - validations[priority=25]
          - validations[priority=26]
        distinguishing_aspect: |
          Mode (a): the accrual combines >= 3 inputs with non-linear interaction —
          income-tier conditional branch (ratio 0.5 vs 0.25), nested cap-remaining
          and pool-uncommitted guards — and a deposit exactly equal to the remaining
          cap succeeds while a larger one is rejected whole.
        test_recipe:
          setup:
            - "Pool: total 1000000, income_threshold 3000000, ratio_below 0.5, ratio_above 0.25, per-participant cap 100000"
            - "Participant income 2000000 (< threshold -> ratio 0.5); case at PLAN_ACTIVE with ACTIVE plan; enrollment savings_goal 1000000"
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "K Three", email: "k3@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P Three", email: "p3@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /coaching-cases", payload: { participant_id: "${part_id}", coach_id: "${coach_id}", intake_date: "2026-08-01" }, as: ProgramAdmin, captures: { case_id: "$.data.id" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_DRAFT" }, as: ProgramAdmin, captures: { case_v: "$.data.version" } }
            - { call: "POST /goal-plans", payload: { case_id: "${case_id}", monthly_savings_goal_cents: 50000, credit_score_target: 700, expected_case_version: "${case_v}" }, as: ProgramAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_ACTIVE" }, as: ProgramAdmin }
            - { call: "POST /match-pools", payload: { name: "Pool A", total_funded_cents: 1000000, income_threshold_cents: 3000000, match_ratio_below: 0.5, match_ratio_above: 0.25, per_participant_cap_cents: 100000 }, as: ProgramAdmin, captures: { pool_id: "$.data.id" } }
            - { call: "POST /match-enrollments", payload: { participant_id: "${part_id}", pool_id: "${pool_id}", goal_plan_id: "${plan_id}", savings_goal_cents: 1000000 }, as: ProgramAdmin, captures: { enr_id: "$.data.id" } }
            - { call: "POST /match-enrollments/${enr_id}/deposits", payload: { amount_cents: 40000 }, as: ProgramAdmin }
            - { call: "POST /match-enrollments/${enr_id}/deposits", payload: { amount_cents: 40000 }, as: ProgramAdmin }
          trigger:
            - { call: "POST /match-enrollments/${enr_id}/deposits", payload: { amount_cents: 150000 }, as: ProgramAdmin, captures: { err_cap: "$.data.error_id" } }
            - { call: "POST /match-enrollments/${enr_id}/deposits", payload: { amount_cents: 120000 }, as: ProgramAdmin }
            - { call: "GET /match-enrollments/${enr_id}", payload: {}, as: ProgramAdmin }
            - { call: "GET /match-pools/${pool_id}", payload: {}, as: ProgramAdmin }
          assert:
            - "err_cap == ERR_MATCH_CAP_EXCEEDED   # candidate 75000 > cap remaining 60000"
            - "MatchEnrollment.${enr_id}.accrued_unpaid_cents == 100000   # 20000 + 20000 + 60000 (exact cap boundary accepted)"
            - "MatchEnrollment.${enr_id}.total_deposited_cents == 200000"
            - "MatchPool.${pool_id}.uncommitted_cents == 900000"

      - name: session_incentive_per_line_rounding_order
        grounds:
          - calculations.session_incentive
          - entities.Registration.fields.incentive_earned_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-session-line-then-sum, so two 90-minute sessions at 655 cents/hr
          yield 983 + 983 = 1966, whereas sum-then-round would yield 1965.
        test_recipe:
          setup:
            - "Module M2 (655 cents/hr, threshold 3 so no bonus interferes, bonus 2500); certified coach; participant"
            - "Two 90-minute workshops on different days; participant ATTENDED both"
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "SV-201", title: "Savings", session_count: 4, incentive_cents_per_hour: 655, completion_bonus_cents: 2500, completion_threshold: 3 }, as: ProgramAdmin, captures: { mod_id: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "K Four", email: "k4@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P Four", email: "p4@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm B", start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T11:30:00Z", capacity: 10 }, as: ProgramAdmin, captures: { wa_id: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm B", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:30:00Z", capacity: 10 }, as: ProgramAdmin, captures: { wb_id: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${wa_id}", participant_id: "${part_id}" }, as: ProgramAdmin, captures: { ra_id: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${wb_id}", participant_id: "${part_id}" }, as: ProgramAdmin, captures: { rb_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /registrations/${ra_id}/mark-attendance", payload: { outcome: "ATTENDED" }, as: ProgramAdmin }
            - { call: "POST /registrations/${rb_id}/mark-attendance", payload: { outcome: "ATTENDED" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /registrations/${ra_id}", payload: {}, as: ProgramAdmin }
            - { call: "GET /participants/${part_id}/incentive-summary", payload: {}, as: ProgramAdmin }
          assert:
            - "Registration.${ra_id}.incentive_earned_cents == 983"
            - "incentive-summary.earned_cents == 1966   # pinned round-per-line order; sum-then-round would give 1965"
            - "incentive-summary.completion_bonuses_earned_cents == 0"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: coach_certification_cycle_loops
        grounds:
          - state_machines.Coach.CERTIFIED_to_SUSPENDED
          - state_machines.Coach.SUSPENDED_to_CERTIFIED
          - state_machines.Coach.CERTIFIED_to_LAPSED
          - state_machines.Coach.LAPSED_to_CERTIFIED
        distinguishing_aspect: |
          Coach is cyclic: CERTIFIED -> SUSPENDED -> CERTIFIED and
          CERTIFIED -> LAPSED -> CERTIFIED (recertification loop) — not a pipeline;
          this instance exercises the cycle on the Coach entity.
        test_recipe:
          setup: ["Coach created (CANDIDATE); logical clock starts at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "K Five", email: "k5@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
          trigger:
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin, captures: { v1: "$.data.status" } }
            - { call: "POST /coaches/${coach_id}/suspend", payload: {}, as: ProgramAdmin, captures: { v2: "$.data.status" } }
            - { call: "POST /coaches/${coach_id}/reinstate", payload: {}, as: ProgramAdmin, captures: { v3: "$.data.status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /coaches/${coach_id}", payload: {}, as: ProgramAdmin, captures: { v4: "$.data.status" } }
            - { call: "POST /coaches/${coach_id}/reinstate", payload: {}, as: ProgramAdmin, captures: { v5: "$.data.status" } }
          assert:
            - "v1 == CERTIFIED   # CANDIDATE -> CERTIFIED"
            - "v2 == SUSPENDED"
            - "v3 == CERTIFIED   # SUSPENDED -> CERTIFIED closes loop 1"
            - "v4 == LAPSED      # lazy sweep: now 2027-08-02 >= expiry 2027-08-01"
            - "v5 == CERTIFIED   # LAPSED -> CERTIFIED closes loop 2"

      - name: coaching_case_branching_revert_and_hold_cycles
        grounds:
          - state_machines.CoachingCase.PLAN_DRAFT_to_INTAKE
          - state_machines.CoachingCase.PLAN_ACTIVE_to_ON_HOLD
          - state_machines.CoachingCase.ON_HOLD_to_PLAN_ACTIVE
          - state_machines.CoachingCase.PLAN_ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          CoachingCase is branching with revert and hold cycles (PLAN_DRAFT -> INTAKE
          revision loop; PLAN_ACTIVE -> ON_HOLD -> PLAN_ACTIVE cycle; fork to
          COMPLETED) — a different entity than the Coach cycle.
        test_recipe:
          setup: ["Certified coach; participant; case opened (INTAKE); one outcome snapshot exists for the participant (completion precondition)"]
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "K Six", email: "k6@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P Six", email: "p6@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /coaching-cases", payload: { participant_id: "${part_id}", coach_id: "${coach_id}", intake_date: "2026-08-01" }, as: ProgramAdmin, captures: { case_id: "$.data.id" } }
            - { call: "POST /outcome-snapshots", payload: { participant_id: "${part_id}", recorded_at: "2026-08-01T00:00:00Z", credit_score: 600 }, as: ProgramAdmin }
          trigger:
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_DRAFT" }, as: ProgramAdmin, captures: { s1: "$.data.status", case_v: "$.data.version" } }
            - { call: "POST /goal-plans", payload: { case_id: "${case_id}", monthly_savings_goal_cents: 30000, credit_score_target: 680, expected_case_version: "${case_v}" }, as: ProgramAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "INTAKE" }, as: ProgramAdmin, captures: { s2: "$.data.status" } }
            - { call: "GET /goal-plans/${plan_id}", payload: {}, as: ProgramAdmin, captures: { p1: "$.data.status" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_DRAFT" }, as: ProgramAdmin }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_ACTIVE" }, as: ProgramAdmin, captures: { s3: "$.data.status" } }
            - { call: "GET /goal-plans/${plan_id}", payload: {}, as: ProgramAdmin, captures: { p2: "$.data.status" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "ON_HOLD" }, as: ProgramAdmin }
            - { call: "GET /goal-plans/${plan_id}", payload: {}, as: ProgramAdmin, captures: { p3: "$.data.status" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_ACTIVE" }, as: ProgramAdmin }
            - { call: "GET /goal-plans/${plan_id}", payload: {}, as: ProgramAdmin, captures: { p4: "$.data.status" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "COMPLETED" }, as: ProgramAdmin, captures: { s4: "$.data.status" } }
            - { call: "GET /goal-plans/${plan_id}", payload: {}, as: ProgramAdmin, captures: { p5: "$.data.status" } }
          assert:
            - "s1 == PLAN_DRAFT"
            - "s2 == INTAKE   # revert loop closes"
            - "p1 == DRAFT    # plan survives the revert"
            - "s3 == PLAN_ACTIVE"
            - "p2 == ACTIVE   # plan activated by the case transition"
            - "p3 == FROZEN   # ON_HOLD freezes the plan"
            - "p4 == ACTIVE   # resume unfreezes the plan"
            - "s4 == COMPLETED"
            - "p5 == ACHIEVED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth >= 3 and depth >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: coach_suspend_stalls_case_plan_enrollment
        grounds:
          - state_machines.Coach.CERTIFIED_to_SUSPENDED
          - state_machines.CoachingCase.PLAN_ACTIVE_to_PLAN_STALLED
          - state_machines.GoalPlan.ACTIVE_to_FROZEN
          - state_machines.MatchEnrollment.ACTIVE_to_MATCH_PAUSED
        distinguishing_aspect: |
          Depth-3 chain from POST /coaches/{id}/suspend: coach suspension mutates
          the case (-> PLAN_STALLED); the case stall itself freezes the plan
          (-> FROZEN); the plan freeze itself pauses the enrollment
          (-> MATCH_PAUSED) — each hop caused by the previous hop, not by the
          original action.
        test_recipe:
          setup:
            - "Certified coach K; participant P; case at PLAN_ACTIVE with ACTIVE plan; enrollment ACTIVE against that plan (savings_goal 500000)"
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "K Seven", email: "k7@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P Seven", email: "p7@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /coaching-cases", payload: { participant_id: "${part_id}", coach_id: "${coach_id}", intake_date: "2026-08-01" }, as: ProgramAdmin, captures: { case_id: "$.data.id" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_DRAFT" }, as: ProgramAdmin, captures: { case_v: "$.data.version" } }
            - { call: "POST /goal-plans", payload: { case_id: "${case_id}", monthly_savings_goal_cents: 40000, credit_score_target: 700, expected_case_version: "${case_v}" }, as: ProgramAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_ACTIVE" }, as: ProgramAdmin }
            - { call: "POST /match-pools", payload: { name: "Pool B", total_funded_cents: 1000000, income_threshold_cents: 3000000, match_ratio_below: 0.5, match_ratio_above: 0.25, per_participant_cap_cents: 100000 }, as: ProgramAdmin, captures: { pool_id: "$.data.id" } }
            - { call: "POST /match-enrollments", payload: { participant_id: "${part_id}", pool_id: "${pool_id}", goal_plan_id: "${plan_id}", savings_goal_cents: 500000 }, as: ProgramAdmin, captures: { enr_id: "$.data.id" } }
          trigger:
            - { call: "POST /coaches/${coach_id}/suspend", payload: {}, as: ProgramAdmin }
            - { call: "GET /coaching-cases/${case_id}", payload: {}, as: ProgramAdmin, captures: { case_st: "$.data.status" } }
            - { call: "GET /goal-plans/${plan_id}", payload: {}, as: ProgramAdmin, captures: { plan_st: "$.data.status" } }
            - { call: "GET /match-enrollments/${enr_id}", payload: {}, as: ProgramAdmin, captures: { enr_st: "$.data.status" } }
            - { call: "GET /coaches/${coach_id}", payload: {}, as: ProgramAdmin, captures: { cl: "$.data.active_caseload" } }
            - { call: "POST /match-enrollments/${enr_id}/deposits", payload: { amount_cents: 10000 }, as: ProgramAdmin, captures: { dep_err: "$.data.error_id" } }
          assert:
            - "case_st == PLAN_STALLED   # LINK 1"
            - "plan_st == FROZEN         # LINK 2, caused by LINK 1"
            - "enr_st == MATCH_PAUSED    # LINK 3, caused by LINK 2"
            - "cl == 0   # PLAN_STALLED excluded from active_caseload"
            - "dep_err == ERR_ENROLLMENT_NOT_ACTIVE"

      - name: cancel_registration_promotes_waitlist
        grounds:
          - state_machines.Registration.REGISTERED_to_CANCELLED
          - state_machines.Registration.WAITLISTED_to_REGISTERED
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          Depth-2 chain from POST /registrations/{id}/cancel: the cancellation
          mutation frees a seat; the freed seat itself mutates the lowest-position
          eligible WAITLISTED registration to REGISTERED — a different triggering
          transition than the coach-suspend cascade.
        test_recipe:
          setup:
            - "Module; certified coach; workshop capacity 1 on 2026-08-10; participants P1 (REGISTERED, seat 1) and P2 (WAITLISTED, position 1)"
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "CR-301", title: "Credit", session_count: 2, incentive_cents_per_hour: 500, completion_bonus_cents: 1000, completion_threshold: 2 }, as: ProgramAdmin, captures: { mod_id: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "K Eight", email: "k8@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P A", email: "pa8@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "P B", email: "pb8@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { p2_id: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm C", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 1 }, as: ProgramAdmin, captures: { w_id: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w_id}", participant_id: "${p1_id}" }, as: ProgramAdmin, captures: { r1_id: "$.data.id", r1_st: "$.data.status" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w_id}", participant_id: "${p2_id}" }, as: ProgramAdmin, captures: { r2_id: "$.data.id", r2_st: "$.data.status", r2_pos: "$.data.waitlist_position" } }
          trigger:
            - { call: "POST /registrations/${r1_id}/cancel", payload: {}, as: ProgramAdmin }
            - { call: "GET /registrations/${r2_id}", payload: {}, as: ProgramAdmin, captures: { r2_after: "$.data.status", r2_pos_after: "$.data.waitlist_position" } }
            - { call: "GET /workshops/${w_id}", payload: {}, as: ProgramAdmin, captures: { w_conf: "$.data.confirmed_count" } }
          assert:
            - "r1_st == REGISTERED and r2_st == WAITLISTED and r2_pos == 1"
            - "r2_after == REGISTERED   # LINK 2 promotion caused by LINK 1's freed seat"
            - "r2_pos_after == null"
            - "w_conf == 1   # cancel -1 then promote +1"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: not_found_beats_invalid_state
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: |
          Pair (existence vs state): cancelling a registration id that does not
          exist must return 404 ERR_NOT_FOUND even though the same operation on an
          existing CANCELLED registration would fail state with ERR_INVALID_STATE —
          existence (priority 4) precedes state (priority 6).
        test_recipe:
          setup: ["One registration exists and is already CANCELLED (so a state error would be plausible if the id resolved)"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "DB-401", title: "Debt", session_count: 2, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 2 }, as: ProgramAdmin, captures: { mod_id: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "K Nine", email: "k9@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P Nine", email: "p9@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm D", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 5 }, as: ProgramAdmin, captures: { w_id: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w_id}", participant_id: "${part_id}" }, as: ProgramAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /registrations/${reg_id}/cancel", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /registrations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/cancel", payload: {}, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND   # 404 beats the 409 a CANCELLED registration would produce"

      - name: enrollment_state_beats_pool_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=25]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): a deposit on a MATCH_PAUSED enrollment
          whose accrual candidate (40000) also exceeds pool uncommitted (30000)
          must return ERR_ENROLLMENT_NOT_ACTIVE (priority 8, state), not
          ERR_POOL_INSUFFICIENT (priority 25, fiscal).
        test_recipe:
          setup:
            - "Pool total 50000, threshold 3000000, ratio 0.5/0.25, cap 50000 (== pool total so the enrollment gate passes); participant income 2000000; case PLAN_ACTIVE, plan ACTIVE, enrollment ACTIVE (goal 500000)"
            - "One deposit 40000 accepted: accrual 20000, pool uncommitted 30000"
            - "Coach suspended -> enrollment MATCH_PAUSED"
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "K Ten", email: "k10@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P Ten", email: "p10@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /coaching-cases", payload: { participant_id: "${part_id}", coach_id: "${coach_id}", intake_date: "2026-08-01" }, as: ProgramAdmin, captures: { case_id: "$.data.id" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_DRAFT" }, as: ProgramAdmin, captures: { case_v: "$.data.version" } }
            - { call: "POST /goal-plans", payload: { case_id: "${case_id}", monthly_savings_goal_cents: 40000, credit_score_target: 700, expected_case_version: "${case_v}" }, as: ProgramAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_ACTIVE" }, as: ProgramAdmin }
            - { call: "POST /match-pools", payload: { name: "Pool C", total_funded_cents: 50000, income_threshold_cents: 3000000, match_ratio_below: 0.5, match_ratio_above: 0.25, per_participant_cap_cents: 50000 }, as: ProgramAdmin, captures: { pool_id: "$.data.id" } }
            - { call: "POST /match-enrollments", payload: { participant_id: "${part_id}", pool_id: "${pool_id}", goal_plan_id: "${plan_id}", savings_goal_cents: 500000 }, as: ProgramAdmin, captures: { enr_id: "$.data.id" } }
            - { call: "POST /match-enrollments/${enr_id}/deposits", payload: { amount_cents: 40000 }, as: ProgramAdmin }
            - { call: "POST /coaches/${coach_id}/suspend", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /match-enrollments/${enr_id}/deposits", payload: { amount_cents: 80000 }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_ENROLLMENT_NOT_ACTIVE   # state (pri 8) beats business_fiscal (pri 25) even though candidate 40000 > uncommitted 30000"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: workshop_seat_boundary_at_exact_capacity
        grounds:
          - calculations.workshop_seat_conservation
          - entities.Workshop.fields.confirmed_count
        distinguishing_aspect: |
          Seat-count metric on POST /registrations: admission iff confirmed_count <
          capacity — the registration AT exact equality (confirmed == capacity == 1)
          must WAITLIST, not register (strict < boundary).
        test_recipe:
          setup: ["Module; certified coach; workshop capacity 1 on 2026-08-10; participants P1, P2"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "TX-501", title: "Taxes", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod_id: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "K Eleven", email: "k11@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P E1", email: "pe1@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { p1_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "P E2", email: "pe2@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { p2_id: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm E", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 1 }, as: ProgramAdmin, captures: { w_id: "$.data.id" } }
          trigger:
            - { call: "POST /registrations", payload: { workshop_id: "${w_id}", participant_id: "${p1_id}" }, as: ProgramAdmin, captures: { s1: "$.data.status" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w_id}", participant_id: "${p2_id}" }, as: ProgramAdmin, captures: { s2: "$.data.status" } }
            - { call: "GET /workshops/${w_id}", payload: {}, as: ProgramAdmin, captures: { conf: "$.data.confirmed_count" } }
          assert:
            - "s1 == REGISTERED   # confirmed 0 < capacity 1"
            - "s2 == WAITLISTED   # confirmed == capacity exactly -> boundary waitlists"
            - "conf == 1"

      - name: no_show_restriction_at_exactly_three
        grounds:
          - calculations.no_show_restriction
          - state_machines.Participant.ACTIVE_to_RESTRICTED
        distinguishing_aspect: |
          Strike-count metric on POST /registrations/{id}/mark-attendance: 2
          no-shows leave the participant ACTIVE; the 3rd (>= NO_SHOW_LIMIT, not >)
          flips status to RESTRICTED — a different metric and endpoint than the
          seat boundary.
        test_recipe:
          setup:
            - "Module; certified coach; three workshops on 2026-08-02/03/04 10:00-11:00; participant registered for all three; clock advanced to 2026-08-05"
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "BX-601", title: "Banking", session_count: 3, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod_id: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "K Twelve", email: "k12@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P NS", email: "pns@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm F", start_at: "2026-08-02T10:00:00Z", end_at: "2026-08-02T11:00:00Z", capacity: 10 }, as: ProgramAdmin, captures: { w1: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm F", start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z", capacity: 10 }, as: ProgramAdmin, captures: { w2: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm F", start_at: "2026-08-04T10:00:00Z", end_at: "2026-08-04T11:00:00Z", capacity: 10 }, as: ProgramAdmin, captures: { w3: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm F", start_at: "2026-08-06T10:00:00Z", end_at: "2026-08-06T11:00:00Z", capacity: 10 }, as: ProgramAdmin, captures: { w4: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w1}", participant_id: "${part_id}" }, as: ProgramAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w2}", participant_id: "${part_id}" }, as: ProgramAdmin, captures: { r2: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w3}", participant_id: "${part_id}" }, as: ProgramAdmin, captures: { r3: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /registrations/${r1}/mark-attendance", payload: { outcome: "NO_SHOW" }, as: ProgramAdmin }
            - { call: "POST /registrations/${r2}/mark-attendance", payload: { outcome: "NO_SHOW" }, as: ProgramAdmin }
            - { call: "GET /participants/${part_id}", payload: {}, as: ProgramAdmin, captures: { mid_st: "$.data.status", mid_n: "$.data.no_show_count" } }
            - { call: "POST /registrations/${r3}/mark-attendance", payload: { outcome: "NO_SHOW" }, as: ProgramAdmin }
            - { call: "GET /participants/${part_id}", payload: {}, as: ProgramAdmin, captures: { end_st: "$.data.status", end_n: "$.data.no_show_count" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w4}", participant_id: "${part_id}" }, as: ProgramAdmin, captures: { reg_err: "$.data.error_id" } }
          assert:
            - "mid_n == 2 and mid_st == ACTIVE   # 2 < 3: no flip"
            - "end_n == 3 and end_st == RESTRICTED   # exactly 3 (>=) flips"
            - "reg_err == ERR_PARTICIPANT_RESTRICTED"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_open_requires_certified_coach
        grounds:
          - validations[priority=10]
          - state_machines.CoachingCase.transitions
        distinguishing_aspect: |
          Pair (CoachingCase, Coach): case creation is gated on the referenced
          Coach's status == CERTIFIED — a CANDIDATE coach rejects with
          ERR_COACH_NOT_CERTIFIED, and the same request succeeds after certify.
        test_recipe:
          setup: ["Coach in CANDIDATE; participant exists"]
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "K Thirteen", email: "k13@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "P Thirteen", email: "p13@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
          trigger:
            - { call: "POST /coaching-cases", payload: { participant_id: "${part_id}", coach_id: "${coach_id}", intake_date: "2026-08-01" }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /coaching-cases", payload: { participant_id: "${part_id}", coach_id: "${coach_id}", intake_date: "2026-08-01" }, as: ProgramAdmin, captures: { case_st: "$.data.status" } }
          assert:
            - "err == ERR_COACH_NOT_CERTIFIED"
            - "case_st == INTAKE"

      - name: enrollment_requires_active_goal_plan
        grounds:
          - validations[priority=22]
          - state_machines.MatchEnrollment.transitions
        distinguishing_aspect: |
          Pair (MatchEnrollment, GoalPlan): enrollment creation is gated on the
          referenced plan's status == ACTIVE — a DRAFT plan rejects with
          ERR_PLAN_NOT_ACTIVE; after the case activates the plan, creation
          succeeds. Different entity pair than (CoachingCase, Coach).
        test_recipe:
          setup: ["Certified coach; participant; case at PLAN_DRAFT with a DRAFT plan; pool funded (total 500000, cap 100000)"]
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "K Fourteen", email: "k14@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P Fourteen", email: "p14@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /coaching-cases", payload: { participant_id: "${part_id}", coach_id: "${coach_id}", intake_date: "2026-08-01" }, as: ProgramAdmin, captures: { case_id: "$.data.id" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_DRAFT" }, as: ProgramAdmin, captures: { case_v: "$.data.version" } }
            - { call: "POST /goal-plans", payload: { case_id: "${case_id}", monthly_savings_goal_cents: 20000, credit_score_target: 650, expected_case_version: "${case_v}" }, as: ProgramAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /match-pools", payload: { name: "Pool D", total_funded_cents: 500000, income_threshold_cents: 3000000, match_ratio_below: 0.5, match_ratio_above: 0.25, per_participant_cap_cents: 100000 }, as: ProgramAdmin, captures: { pool_id: "$.data.id" } }
          trigger:
            - { call: "POST /match-enrollments", payload: { participant_id: "${part_id}", pool_id: "${pool_id}", goal_plan_id: "${plan_id}", savings_goal_cents: 300000 }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_ACTIVE" }, as: ProgramAdmin }
            - { call: "POST /match-enrollments", payload: { participant_id: "${part_id}", pool_id: "${pool_id}", goal_plan_id: "${plan_id}", savings_goal_cents: 300000 }, as: ProgramAdmin, captures: { enr_st: "$.data.status" } }
          assert:
            - "err == ERR_PLAN_NOT_ACTIVE   # plan was DRAFT"
            - "enr_st == ACTIVE   # after the case activated the plan"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: coach_half_open_adjacency_allowed
        grounds:
          - calculations.coach_schedule_overlap
          - validations[priority=13]
        distinguishing_aspect: |
          Resource Coach with HALF-OPEN [start, end) semantics and zero buffer:
          a workshop starting exactly when another ends (11:30 == 11:30) is
          allowed, while a true overlap (11:00-12:00 vs 10:00-11:30) is rejected
          with ERR_COACH_SCHEDULE_CONFLICT.
        test_recipe:
          setup: ["Module; certified coach; no workshops yet; all on 2026-08-10"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "HS-701", title: "Housing", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod_id: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "K Fifteen", email: "k15@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm G", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:30:00Z", capacity: 10 }, as: ProgramAdmin, captures: { w1: "$.data.id" } }
          trigger:
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm G", start_at: "2026-08-10T11:30:00Z", end_at: "2026-08-10T13:00:00Z", capacity: 10 }, as: ProgramAdmin, captures: { w2: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm H", start_at: "2026-08-10T11:00:00Z", end_at: "2026-08-10T12:00:00Z", capacity: 10 }, as: ProgramAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "w2 exists (201, adjacent back-to-back allowed under half-open semantics)"
            - "err == ERR_COACH_SCHEDULE_CONFLICT"

      - name: participant_buffered_travel_gap
        grounds:
          - calculations.participant_schedule_overlap
          - validations[priority=14]
        distinguishing_aspect: |
          Resource Participant with BUFFERED semantics (30-minute travel buffer,
          strict <): a 20-minute gap conflicts (ERR_PARTICIPANT_SCHEDULE_CONFLICT)
          while a gap of exactly 30 minutes is allowed — different interval
          arithmetic and different resource than the coach rule.
        test_recipe:
          setup: ["Module; certified coaches K1 (Wa, Wc) and K2 (Wb — separate coach so only the participant buffer rule is exercised); workshops Wa 10:00-11:00, Wb 11:20-12:30, Wc 11:30-12:30 on 2026-08-10; participant registered on Wa"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "RT-801", title: "Retirement", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod_id: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "K Sixteen", email: "k16@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "K Sixteen B", email: "k16b@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach2_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /coaches/${coach2_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P Buf", email: "pbuf@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm I", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 10 }, as: ProgramAdmin, captures: { wa: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach2_id}", location: "Rm I2", start_at: "2026-08-10T11:20:00Z", end_at: "2026-08-10T12:30:00Z", capacity: 10 }, as: ProgramAdmin, captures: { wb: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm I", start_at: "2026-08-10T11:30:00Z", end_at: "2026-08-10T12:30:00Z", capacity: 10 }, as: ProgramAdmin, captures: { wc: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${wa}", participant_id: "${part_id}" }, as: ProgramAdmin, captures: { ra: "$.data.status" } }
          trigger:
            - { call: "POST /registrations", payload: { workshop_id: "${wb}", participant_id: "${part_id}" }, as: ProgramAdmin, captures: { err_b: "$.data.error_id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${wc}", participant_id: "${part_id}" }, as: ProgramAdmin, captures: { st_c: "$.data.status" } }
          assert:
            - "ra == REGISTERED"
            - "err_b == ERR_PARTICIPANT_SCHEDULE_CONFLICT   # 20-min gap < 30-min buffer"
            - "st_c == REGISTERED   # exactly 30-min gap allowed (strict <)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: pool_funds_conserved_across_accrual_and_forfeit
        grounds:
          - calculations.pool_fund_conservation
          - state_machines.MatchEnrollment.ACTIVE_to_FORFEITED
        distinguishing_aspect: |
          Conserved quantity is pool DOLLARS: total_funded_cents ==
          uncommitted_cents + accrued outstanding + paid_out_cents holds both after
          the forward action (deposit accrual) and after its compensating action
          (forfeit) — a deposit of 40000 accrues 20000 (uncommitted 980000), and
          forfeit returns it (uncommitted back to 1000000) with zero drift.
        test_recipe:
          setup: ["Pool total 1000000 (ratio 0.5 tier for income 2000000); case PLAN_ACTIVE; plan ACTIVE; enrollment ACTIVE (goal 1000000)"]
          setup_api_calls:
            - { call: "POST /coaches", payload: { full_name: "K Seventeen", email: "k17@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P Seventeen", email: "p17@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { part_id: "$.data.id" } }
            - { call: "POST /coaching-cases", payload: { participant_id: "${part_id}", coach_id: "${coach_id}", intake_date: "2026-08-01" }, as: ProgramAdmin, captures: { case_id: "$.data.id" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_DRAFT" }, as: ProgramAdmin, captures: { case_v: "$.data.version" } }
            - { call: "POST /goal-plans", payload: { case_id: "${case_id}", monthly_savings_goal_cents: 40000, credit_score_target: 700, expected_case_version: "${case_v}" }, as: ProgramAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /coaching-cases/${case_id}/transition", payload: { target_state: "PLAN_ACTIVE" }, as: ProgramAdmin }
            - { call: "POST /match-pools", payload: { name: "Pool E", total_funded_cents: 1000000, income_threshold_cents: 3000000, match_ratio_below: 0.5, match_ratio_above: 0.25, per_participant_cap_cents: 100000 }, as: ProgramAdmin, captures: { pool_id: "$.data.id" } }
            - { call: "POST /match-enrollments", payload: { participant_id: "${part_id}", pool_id: "${pool_id}", goal_plan_id: "${plan_id}", savings_goal_cents: 1000000 }, as: ProgramAdmin, captures: { enr_id: "$.data.id" } }
          trigger:
            - { call: "POST /match-enrollments/${enr_id}/deposits", payload: { amount_cents: 40000 }, as: ProgramAdmin }
            - { call: "GET /match-pools/${pool_id}", payload: {}, as: ProgramAdmin, captures: { u1: "$.data.uncommitted_cents", p1: "$.data.paid_out_cents" } }
            - { call: "GET /match-enrollments/${enr_id}", payload: {}, as: ProgramAdmin, captures: { a1: "$.data.accrued_unpaid_cents" } }
            - { call: "POST /match-enrollments/${enr_id}/forfeit", payload: {}, as: ProgramAdmin }
            - { call: "GET /match-pools/${pool_id}", payload: {}, as: ProgramAdmin, captures: { u2: "$.data.uncommitted_cents", p2: "$.data.paid_out_cents" } }
            - { call: "GET /match-enrollments/${enr_id}", payload: {}, as: ProgramAdmin, captures: { a2: "$.data.accrued_unpaid_cents", st2: "$.data.status" } }
          assert:
            - "u1 == 980000 and a1 == 20000 and p1 == 0   # forward action: 980000 + 20000 + 0 == 1000000"
            - "st2 == FORFEITED"
            - "u2 == 1000000 and a2 == 0 and p2 == 0   # compensating action: conservation restored exactly"

      - name: workshop_seat_ledger_conserved_across_register_cancel
        grounds:
          - calculations.workshop_seat_conservation
          - state_machines.Registration.REGISTERED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity is the SEAT-OCCUPANCY ledger (not dollars):
          workshop.confirmed_count == count(status REGISTERED) and <= capacity at
          every step — register/register/waitlist, then cancel-with-promotion nets
          to zero drift (2), then a second cancel drops to 1.
        test_recipe:
          setup: ["Module; certified coach; workshop capacity 2 on 2026-08-10; participants P1, P2, P3"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "IN-901", title: "Investing", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod_id: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "K Eighteen", email: "k18@x.org", max_caseload: 10 }, as: ProgramAdmin, captures: { coach_id: "$.data.id" } }
            - { call: "POST /coaches/${coach_id}/certify", payload: {}, as: ProgramAdmin }
            - { call: "POST /participants", payload: { full_name: "P S1", email: "ps1@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "P S2", email: "ps2@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /participants", payload: { full_name: "P S3", email: "ps3@x.org", annual_income_cents: 2000000 }, as: ProgramAdmin, captures: { p3: "$.data.id" } }
            - { call: "POST /workshops", payload: { module_id: "${mod_id}", coach_id: "${coach_id}", location: "Rm J", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z", capacity: 2 }, as: ProgramAdmin, captures: { w_id: "$.data.id" } }
          trigger:
            - { call: "POST /registrations", payload: { workshop_id: "${w_id}", participant_id: "${p1}" }, as: ProgramAdmin, captures: { r1: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w_id}", participant_id: "${p2}" }, as: ProgramAdmin, captures: { r2: "$.data.id" } }
            - { call: "POST /registrations", payload: { workshop_id: "${w_id}", participant_id: "${p3}" }, as: ProgramAdmin, captures: { r3_st: "$.data.status" } }
            - { call: "POST /registrations/${r1}/cancel", payload: {}, as: ProgramAdmin }
            - { call: "GET /workshops/${w_id}", payload: {}, as: ProgramAdmin, captures: { c1: "$.data.confirmed_count" } }
            - { call: "GET /registrations", payload: { workshop_id: "${w_id}", status: "REGISTERED", limit: 100 }, as: ProgramAdmin, captures: { n1: "$.meta" } }
            - { call: "POST /registrations/${r2}/cancel", payload: {}, as: ProgramAdmin }
            - { call: "GET /workshops/${w_id}", payload: {}, as: ProgramAdmin, captures: { c2: "$.data.confirmed_count" } }
          assert:
            - "r3_st == WAITLISTED"
            - "c1 == 2   # cancel P1 (-1) then promotion of P3 (+1) nets zero"
            - "list of REGISTERED registrations after first cancel has total_count == 2 == confirmed_count"
            - "c2 == 1   # cancel P2 with empty waitlist drops the ledger by exactly 1"
