            - { call: "POST /plans/${pl_ow}/participants", payload: { full_name: "Own Ann", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_owa: "$.data.id" } }
            - { call: "POST /plans/${pl_ow}/participants", payload: { full_name: "Own Bob", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_owb: "$.data.id" } }
          trigger:
            - { call: "POST /participants/${p_owb}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_owa}", captures: { ow_err: "$.data.error_id" } }
          assert:
            - "captured ow_err == ERR_UNAUTHORIZED_ROLE (A may not act as B)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_loan_version_on_schedule_rebuild
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[loan-schedule-rebuild-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Loan.version: a rebuild carrying the pre-remittance version ${lv1} is stale after the remittance bumped the loan, and is rejected 412 ERR_STALE_VERSION; a rebuild carrying the fresh version succeeds, supersedes PENDING installments (status REBUILT), and increments the version again."
        test_recipe:
          setup:
            - "Default plan; participant vested 10,000,000c; loan 1,000,000c / 12mo disbursed at version v_disb; one 85,607c remittance posted (installment 1 PAID, outstanding 918,560c, version advanced past v_disb)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan OCC1" }, as: RecordkeeperAdmin, captures: { pl_oc: "$.data.id" } }
            - { call: "POST /plans/${pl_oc}/participants", payload: { full_name: "Occ Otto", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_oc: "$.data.id" } }
            - { call: "POST /participants/${p_oc}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_oc}", captures: { loan_oc: "$.data.id" } }
            - { call: "GET /loans/${loan_oc}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { oc_t1: "$.data[0].id", oc_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${oc_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${oc_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_oc}/disburse", payload: {}, as: RecordkeeperAdmin, captures: { oc_v_disb: "$.data.version" } }
            - { call: "POST /participants/${p_oc}/remittances", payload: { amount_cents: 85607, pay_date: "2026-05-15T00:00:00Z" }, as: PayrollProvider }
            - { call: "GET /loans/${loan_oc}", payload: {}, as: RecordkeeperAdmin, captures: { oc_v_fresh: "$.data.version" } }
          trigger:
            - { call: "POST /loans/${loan_oc}/schedule/rebuild", payload: { expected_loan_version: "${oc_v_disb}", term_months: 6 }, as: RecordkeeperAdmin, captures: { oc_err: "$.data.error_id" } }
            - { call: "POST /loans/${loan_oc}/schedule/rebuild", payload: { expected_loan_version: "${oc_v_fresh}", term_months: 6 }, as: RecordkeeperAdmin, captures: { oc_v_after: "$.data.version", oc_pmt: "$.data.scheduled_payment_cents" } }
            - { call: "GET /loans/${loan_oc}/installments", payload: { limit: 100 }, as: RecordkeeperAdmin, captures: { oc_i2_status: "$.data[1].status", oc_last_status: "$.data[12].status" } }
          assert:
            - "captured oc_err == ERR_STALE_VERSION with HTTP 412 for the stale expected_loan_version"
            - "the fresh rebuild succeeds: captured oc_pmt == 155334 (918,560c re-amortized over 6 months at 500bps 30/360)"
            - "original installment 1 stays PAID; original installments 2..12 (rows index 1..11) become REBUILT; 6 new PENDING rows follow (captured oc_last_status == PENDING is the first rebuilt row, installment_number 13)"
            - "captured oc_v_after > oc_v_fresh (version increments on the mutation)"

      - name: occ_stale_plan_version_on_policy_update
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-policy-update-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Plan.version: after a first policy update advances the plan to version 2, a second update still carrying expected_plan_version 1 is rejected 412 ERR_STALE_VERSION; the same update carrying ${pv2} succeeds and increments to 3."
        test_recipe:
          setup: ["plan created (version 1 captured); first policy update applied (version 2 captured)"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan OCC2" }, as: RecordkeeperAdmin, captures: { pl_op: "$.data.id", op_v1: "$.data.version" } }
            - { call: "PUT /plans/${pl_op}/policy", payload: { expected_plan_version: "${op_v1}", max_loans_outstanding: 2 }, as: RecordkeeperAdmin, captures: { op_v2: "$.data.version" } }
          trigger:
            - { call: "PUT /plans/${pl_op}/policy", payload: { expected_plan_version: "${op_v1}", interest_rate_bps: 700 }, as: RecordkeeperAdmin, captures: { op_err: "$.data.error_id" } }
            - { call: "PUT /plans/${pl_op}/policy", payload: { expected_plan_version: "${op_v2}", interest_rate_bps: 700 }, as: RecordkeeperAdmin, captures: { op_v3: "$.data.version", op_rate: "$.data.interest_rate_bps" } }
          assert:
            - "captured op_err == ERR_STALE_VERSION with HTTP 412"
            - "captured op_rate == 700 and op_v3 == op_v2 + 1"

      - name: no_deemed_distribution_before_cure_deadline
        claim_type: scheduled_actions
        grounds:
          - calculations.cure_window_deadline
          - state_machines.Loan.DELINQUENT_to_DEEMED
        distinguishing_aspect: "Scheduled-action precision: advancing the clock to exactly the cure deadline (2026-09-30) does NOT deem the loan (deem fires only when the date is strictly greater); the loan is still DELINQUENT and a cure remains possible at the deadline."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c; loan 1,000,000c / 12mo disbursed 2026-05-01, no remittances; clock at 2026-06-02 (DELINQUENT, deadline 2026-09-30)"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan NoDeem" }, as: RecordkeeperAdmin, captures: { pl_ndm: "$.data.id" } }
            - { call: "POST /plans/${pl_ndm}/participants", payload: { full_name: "NoDeem Nell", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_ndm: "$.data.id" } }
            - { call: "POST /participants/${p_ndm}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_ndm}", captures: { loan_ndm: "$.data.id" } }
            - { call: "GET /loans/${loan_ndm}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { ndm_t1: "$.data[0].id", ndm_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${ndm_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${ndm_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_ndm}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: RecordkeeperAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: RecordkeeperAdmin }
            - { call: "GET /loans/${loan_ndm}", payload: {}, as: RecordkeeperAdmin, captures: { ndm_dq: "$.data.delinquency_status" } }
            - { call: "GET /participants/${p_ndm}/tax-events", payload: {}, as: RecordkeeperAdmin }
          assert:
            - "captured ndm_dq == DELINQUENT at exactly the deadline (no premature deem)"
            - "participant tax-events list is empty (total_count == 0)"

      - name: derived_fields_reconcile_after_hardship_payment
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Participant.fields.vested_balance_cents
          - entities.Participant.fields.ytd_taxable_distributions_cents
          - entities.Participant.fields.contribution_status
        distinguishing_aspect: "One payment reconciles three derived fields atomically: vested drops by the 1,006,250c gross (20,000,000 -> 18,993,750), ytd_taxable_distributions becomes 1,006,250, and contribution_status flips to SUSPENDED via the election cascade; the suspension record ends exactly 6 months after payment."
        test_recipe:
          setup: ["1-step hardship chain plan; participant vested 20,000,000c with ACTIVE election; hardship 800,000c NET MEDICAL documented, approved"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Recon2", hardship_approval_chain: ["RECORDKEEPER_ADMIN"] }, as: RecordkeeperAdmin, captures: { pl_dr: "$.data.id" } }
            - { call: "POST /plans/${pl_dr}/participants", payload: { full_name: "Derive Dora", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_dr: "$.data.id" } }
            - { call: "PUT /participants/${p_dr}/contribution-election", payload: { deferral_pct: 0.1 }, as: Participant, as_user_id: "${p_dr}" }
            - { call: "POST /participants/${p_dr}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 800000, amount_semantics: "NET" }, as: Participant, as_user_id: "${p_dr}", captures: { h_dr: "$.data.id" } }
            - { call: "POST /hardship-requests/${h_dr}/documents", payload: { document_type: "MEDICAL_BILL", amount_cents: 800000 }, as: Participant, as_user_id: "${p_dr}" }
            - { call: "GET /hardship-requests/${h_dr}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { dr_t1: "$.data[0].id" } }
            - { call: "POST /approval-tasks/${dr_t1}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
          trigger:
            - { call: "POST /hardship-requests/${h_dr}/pay", payload: {}, as: RecordkeeperAdmin, captures: { dr_status: "$.data.status", dr_paid: "$.data.paid_on" } }
            - { call: "GET /participants/${p_dr}", payload: {}, as: RecordkeeperAdmin, captures: { dr_vested: "$.data.vested_balance_cents", dr_ytd: "$.data.ytd_taxable_distributions_cents", dr_cs: "$.data.contribution_status" } }
            - { call: "GET /hardship-requests/${h_dr}/suspension-record", payload: {}, as: RecordkeeperAdmin, captures: { dr_susp_start: "$.data[0].starts_on", dr_susp_end: "$.data[0].ends_on", dr_susp_status: "$.data[0].status" } }
          assert:
            - "captured dr_status == PAID and dr_paid == 2026-05-01T00:00:00Z"
            - "captured dr_vested == 18993750 (20,000,000 - 1,006,250 gross)"
            - "captured dr_ytd == 1006250 and dr_cs == SUSPENDED"
            - "captured dr_susp_start == 2026-05-01T00:00:00Z and dr_susp_end == 2026-11-01T00:00:00Z and dr_susp_status == ACTIVE"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_visible_in_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints["POST /loans/{id}/disburse"]
        distinguishing_aspect: "Immediate consistency: the disburse response itself carries lifecycle_status DISBURSED, delinquency_status CURRENT, disbursed_on, scheduled_payment_cents and an incremented version — no re-read or asynchronous settling is required to observe the new state."
        test_recipe:
          setup: ["default plan; participant vested 10,000,000c; loan fully approved"]
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Imm" }, as: RecordkeeperAdmin, captures: { pl_im: "$.data.id" } }
            - { call: "POST /plans/${pl_im}/participants", payload: { full_name: "Imm Ian", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_im: "$.data.id" } }
            - { call: "POST /participants/${p_im}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_im}", captures: { loan_im: "$.data.id", im_v_req: "$.data.version" } }
            - { call: "GET /loans/${loan_im}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { im_t1: "$.data[0].id", im_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${im_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${im_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
          trigger:
            - { call: "POST /loans/${loan_im}/disburse", payload: {}, as: RecordkeeperAdmin, captures: { im_lc: "$.data.lifecycle_status", im_dq: "$.data.delinquency_status", im_disb: "$.data.disbursed_on", im_pmt: "$.data.scheduled_payment_cents", im_v: "$.data.version" } }
          assert:
            - "captured im_lc == DISBURSED and im_dq == CURRENT in the disburse response itself"
            - "captured im_disb == 2026-05-01T00:00:00Z and im_pmt == 85607"
            - "captured im_v > im_v_req"
