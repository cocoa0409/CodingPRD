                  - { file_reference: "CLM-002801", error_severity: "NONE" }
                  - { file_reference: "CLM-003201", error_severity: "NONE" }
                  - { file_reference: "CLM-003601", error_severity: "NONE" }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
            - call: "POST /market-conduct/criticisms"
              payload: { exam_id: "${exam_id}", scope_area_id: "${clm_area_id}", statute_citation: "NRS 686A.310(1)(e)", severity: "MATERIAL", affected_file_count: 3 }
              as: ExaminerInCharge
              as_user_id: "33333333-3333-3333-3333-333333333333"
              captures: { crit_id: "$.data.id" }
            - call: "POST /market-conduct/criticisms/${crit_id}/responses"
              payload: { position: "DISPUTE", narrative: "The carrier disputes the extrapolation methodology applied to the claims sample." }
              as: InsurerRespondent
              as_user_id: "${aurora_id}"
            - call: "POST /market-conduct/criticisms/${crit_id}/finalize"
              payload: { disposition: "SUSTAINED", penalty_units: 20, disposition_note: "Criticism sustained after review of the carrier rebuttal." }
              as: SupervisingExaminer
              as_user_id: "22222222-2222-2222-2222-222222222222"
          trigger:
            - call: "GET /market-conduct/examinations/${exam_id}/exposure-summary"
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { pv_total: "$.data.per_violation_order_total_cents", tier_total: "$.data.tiered_order_total_cents" }
          assert:
            - "Criticism.${crit_id}.restitution_method == POPULATION_EXTRAPOLATED and restitution_exposure_cents == 24000000"
            - "Examination.${exam_id}.aggregate_restitution_cents == 24000000"
            - "Examination.${exam_id}.penalty_units_total == 20"
            - "Examination.${exam_id}.status == NEGOTIATION"
            - "exposure-summary.per_violation_penalty_gross_cents == 500000"
            - "exposure-summary.per_violation_cooperation_credit_pct == 0.05"
            - "exposure-summary.per_violation_penalty_net_cents == 475000"
            - "exposure-summary.per_violation_order_total_cents == 24475000"
            - "exposure-summary.tiered_penalty_gross_cents == 1740000"
            - "exposure-summary.tiered_cooperation_credit_pct == 0.15"
            - "exposure-summary.tiered_penalty_net_cents == 1479000"
            - "exposure-summary.tiered_order_total_cents == 25479000"
            - "exposure-summary.tiered_cooperation_credit_pct != exposure-summary.per_violation_cooperation_credit_pct"
            - "exposure-summary.tiered_order_total_cents - exposure-summary.per_violation_order_total_cents == 1004000"

