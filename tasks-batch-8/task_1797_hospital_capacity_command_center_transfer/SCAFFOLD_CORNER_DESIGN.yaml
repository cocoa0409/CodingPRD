            - "HTTP 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: bed_manager_cannot_declare_diversion
        claim_type: role_denial
        grounds: ["roles[BedManager]", "roles[HouseSupervisor]"]
        distinguishing_aspect: "BedManager is denied on POST /cc/facilities/{id}/diversions (HouseSupervisor-exclusive)."
        test_recipe:
