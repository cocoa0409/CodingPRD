  - name: precision_the_leftover_cent_lands_on_the_earlier_created_participant
    claim_type: precision
    grounds: [calculations.royalty_pool_split, calculations.royalty_accrual, 'endpoints[POST /comics/royalty-statements]']
    distinguishing_aspect: The PRINT_DM remainder 33507 does not divide by the 5000/3000 bps split, so
      the pinned rule (floor, then 1-cent leftovers by created_at ASC over non-COVER participants) gives
      the later-created PENCILS creator the floored 12565 while the single leftover cent goes to the earlier-created
      SCRIPT row — 12565 + 20942 == 33507 exactly.
    test_recipe:
      setup: ['logical clock 2026-08-01T00:00:00Z', title with royalty_pool_bps 1200 and cover_participation_bps
          1500, 'three ACCEPTED assignments created in this order: SCRIPT 5000 bps (advance 25000), PENCILS
          3000 bps (no advance), COVER 1500 bps', 'Issue #1 carrying the 2026-12 revenue rows: PRINT_DM
          ACTUAL net 328500, PRINT_DM ESTIMATED net 66000, DIGITAL ACTUAL net 56000, COLLECTED ESTIMATED
          net 90000, SUBSIDIARY ACTUAL net 200000']
