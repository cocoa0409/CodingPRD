              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /provost/teach-out-plans/${plan_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Provost
              as_user_id: "provost-ratifier"
              captures: { e_plan_submit: $.data.error_id }
            - call: "POST /provost/teach-out-plans/${plan_id}/transitions"
              payload: { action: "SUBMIT" }
              as: ProgramChair
              as_user_id: "${prog_id}"
            - call: "POST /provost/teach-out-plans/${plan_id}/transitions"
              payload: { action: "APPROVE" }
              as: ProgramChair
              as_user_id: "${prog_id}"
              captures: { e_approve: $.data.error_id }
            - call: "POST /provost/teach-out-plans/${plan_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: Provost
              as_user_id: "provost-ratifier"
              captures: { e_activate: $.data.error_id }
            - call: "GET /provost/teach-out-plans/${plan_id}"
              payload: {}
              as: ReviewCoordinator
            - call: "GET /provost/decision-records/${dec_id}"
              payload: {}
              as: ReviewCoordinator
          assert:
            - "${e_submit} == ERR_ROLE_NOT_PERMITTED (403) — SUBMIT on a self-study belongs to ProgramChair even though ReviewCoordinator is listed on the endpoint and the study really is in DRAFT"
            - "${e_accept} == ERR_ROLE_NOT_PERMITTED (403) and NOT ERR_NOT_PROGRAM_OWNER — the chair owns this program, so priority 4 is satisfied; it is priority 3's action scope that refuses ACCEPT"
            - "${e_ratify} == ERR_ROLE_NOT_PERMITTED (403) — RATIFY is the Provost's action; the coordinator is refused before the priority-6 duties check even looks at user ids"
            - "${e_effectuate} == ERR_ROLE_NOT_PERMITTED (403) and NOT ERR_DECISION_STATE_INVALID — EFFECTUATE belongs to ReviewCoordinator, and priority 3 answers before priority 12 would have complained that the decision is still PROPOSED"
            - "${e_plan_submit} == ERR_ROLE_NOT_PERMITTED (403); ${e_approve} == ERR_ROLE_NOT_PERMITTED (403); ${e_activate} == ERR_ROLE_NOT_PERMITTED (403)"
            - "the plan read shows state SUBMITTED with approved_at null and activated_at null — the three refused plan transitions left the plan exactly where its owner's SUBMIT put it"
            - "the decision read shows state RATIFIED with effectuated_at null, proposed_by_user_id provost-proposer and ratified_by_user_id provost-ratifier"

      - name: the_same_provost_cannot_propose_and_ratify
        claim_type: segregation_of_duties
