        grounds:
          - errors.ERR_VISIT_DATE_IN_PAST
          - errors.ERR_SCHEDULE_LEAD_EXCEEDED
          - validations[30].ERR_VISIT_DATE_IN_PAST
          - validations[31].ERR_SCHEDULE_LEAD_EXCEEDED
        distinguishing_aspect: |
          Both scheduling windows are date-inclusive and are checked against the
          logical clock 2026-08-01: 2026-07-31 is ERR_VISIT_DATE_IN_PAST (422),
          2026-09-16 is ERR_SCHEDULE_LEAD_EXCEEDED (422) because MAX_LEAD_DAYS is
