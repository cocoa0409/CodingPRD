        distinguishing_aspect: "Every block in the rate center is already ASSIGNED to the applicant itself, so the pool is genuinely empty rather than contamination-blocked: priority 28 stands down and priority 33 returns 409, while months_to_exhaust reads 0.00 and therefore never trips the horizon gate."
