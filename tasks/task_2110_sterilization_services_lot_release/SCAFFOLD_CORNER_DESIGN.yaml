scaffold_corner_design:

  - section: entities
    instances:

      - name: corner_create_customer_returns_201_with_server_defaults
        claim_type: creation
        grounds:
          - entities.Customer
          - endpoints[POST /sterilization/customers]
          - entities.Customer.fields.open_lot_count
        distinguishing_aspect: "A minimal customer create returns 201 with status defaulting to ACTIVE, open_lot_count 0, version 1 and a bare UUID id carrying no type prefix."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
          trigger:
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { c_id: $.data.id, c_ver: $.data.version }
          assert:
            - "HTTP 201 with response_type == object"
            - "Customer.${c_id}.status == ACTIVE"
            - "Customer.${c_id}.open_lot_count == 0"
            - "${c_ver} == 1"
            - "${c_id} matches the bare 8-4-4-4-12 UUID form with no type prefix"
            - "meta.api_request_id and meta.api_request_timestamp are present in the envelope"

      - name: corner_get_customer_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /sterilization/customers/{id}]
          - entities.Customer.fields.account_code
        distinguishing_aspect: "A GET by id returns exactly the fields written at create, with contracted_modalities preserved as an array in the submitted order."
        test_recipe:
          setup:
            - "One customer ACME-01 contracted for ETO and GAMMA exists."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "GET /sterilization/customers/${cust_id}"
              payload: {}
              as: RegulatoryAdmin
              captures: { got_code: $.data.account_code }
          assert:
            - "HTTP 200 with response_type == object"
            - "${got_code} == ACME-01"
            - "Customer.${cust_id}.contracted_modalities == [ETO, GAMMA]"
            - "Customer.${cust_id}.version == 1"

      - name: corner_list_customers_returns_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /sterilization/customers]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list endpoint returns response_type array with limit, offset, total_count and has_more; a limit of 1 over two rows yields has_more true."
        test_recipe:
          setup:
            - "Two customers ACME-01 and BETA-02 exist."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "BETA-02", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust2_id: $.data.id }
          trigger:
            - call: "GET /sterilization/customers?limit=1&offset=0"
              payload: {}
              as: RegulatoryAdmin
          assert:
            - "HTTP 200 with response_type == array"
            - "total_count == 2 and has_more == true and limit == 1 and offset == 0"
            - "the data array contains exactly 1 element"

      - name: corner_get_customer_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - validations[priority=30]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /customers/{id} returns ERR_CUSTOMER_NOT_FOUND with HTTP 404, not a 400 and not an empty 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
          trigger:
            - call: "GET /sterilization/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegulatoryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CUSTOMER_NOT_FOUND with HTTP 404"
            - "response_type == error"

      - name: corner_create_product_missing_required_pallet_mass_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=25]
          - errors[ERR_VALIDATION]
          - entities.Product.fields.pallet_mass_kg
        distinguishing_aspect: "Omitting pallet_mass_kg, a source input field with no default, returns ERR_VALIDATION 400 and persists nothing."
        test_recipe:
          setup:
            - "One customer exists."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0 }
              as: RegulatoryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION with HTTP 400"
            - "GET /sterilization/customers/${cust_id}/products returns total_count == 0"

      - name: corner_create_product_omitting_requires_aeration_applies_default_true
        claim_type: defaults
        grounds:
          - entities.Product.fields.requires_aeration
          - endpoints[POST /sterilization/products]
        distinguishing_aspect: "requires_aeration is declared with default true, so omitting it from the create body yields true rather than null or false."
        test_recipe:
          setup:
            - "One customer exists."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0 }
              as: RegulatoryAdmin
              captures: { prod_id: $.data.id, aer: $.data.requires_aeration, pstatus: $.data.status }
          assert:
            - "${aer} == true"
            - "${pstatus} == ACTIVE"
            - "Product.${prod_id}.customer_id == ${cust_id}"

      - name: corner_create_lot_client_supplied_status_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Lot.fields.status
          - entities.Lot.fields.staged_pallet_count
          - entities.Lot.fields.available_pallet_count
        distinguishing_aspect: "status, staged_pallet_count, available_pallet_count and cumulative_dose_kgy are source computed, so a client value for status is not accepted and the server initialises RECEIVED / 0 / total_pallet_count / 0."
        test_recipe:
          setup:
            - "One customer and one product exist."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /sterilization/lots"
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", lot_code: "L-001", total_pallet_count: 4, status: "RELEASED" }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the request is rejected with ${err} == ERR_VALIDATION and HTTP 400 because status is not a declared input field of POST /sterilization/lots"
            - "GET /sterilization/lots?customer_id=${cust_id} returns total_count == 0"

      - name: corner_create_chamber_client_supplied_id_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Chamber
          - endpoints[POST /sterilization/chambers]
        distinguishing_aspect: "id, created_at, updated_at and version are system fields; supplying id in the body is not a declared input and is rejected rather than honoured."
        test_recipe:
          setup:
            - "One emission permit exists."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 1000.0, max_concurrent_eto_cycles: 2 }
              as: RegulatoryAdmin
              captures: { permit_id: $.data.id }
          trigger:
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-1", modality: "ETO", pallet_capacity: 8, turnaround_minutes: 60, abatement_efficiency_pct: 96.0, id: "11111111-1111-4111-8111-111111111111" }
              as: RegulatoryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION with HTTP 400"
            - "GET /sterilization/emission-permits/${permit_id}/chambers returns total_count == 0"

      - name: corner_create_chamber_invalid_modality_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=25]
          - entities.Chamber.fields.modality
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "modality accepts only ETO, GAMMA or EBEAM; the value XRAY is rejected with ERR_VALIDATION 400."
        test_recipe:
          setup:
            - "One emission permit exists."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 1000.0, max_concurrent_eto_cycles: 2 }
              as: RegulatoryAdmin
              captures: { permit_id: $.data.id }
          trigger:
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-1", modality: "XRAY", pallet_capacity: 8, turnaround_minutes: 60, abatement_efficiency_pct: 96.0 }
              as: RegulatoryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION with HTTP 400"

      - name: corner_create_cycle_end_not_after_start_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=25]
          - entities.Cycle.fields.scheduled_end_at
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "scheduled_end_at must be strictly greater than scheduled_start_at; equal instants are rejected with ERR_VALIDATION 400 before any overlap rule runs."
        test_recipe:
          setup:
            - "A GAMMA chamber and an APPROVED GAMMA recipe exist."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 1000.0, max_concurrent_eto_cycles: 2 }
              as: RegulatoryAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-G1", modality: "GAMMA", pallet_capacity: 8, turnaround_minutes: 30, abatement_efficiency_pct: 0.0 }
              as: RegulatoryAdmin
              captures: { chg1_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes"
              payload: { recipe_code: "RG", modality: "GAMMA", density_min_g_per_cm3: 0.1000, density_max_g_per_cm3: 0.1060, target_dose_kgy: 30.0, min_dose_kgy: 27.0, max_dose_kgy: 45.0, dose_basis: "ROUTINE_MEAN", aeration_base_hours: 0, required_min_zone_dosimeters: 1, required_routine_dosimeters: 1, required_biological_indicators: 0 }
              as: RegulatoryAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes/${rg_id}/approve"
              payload: {}
              as: RegulatoryAdmin
          trigger:
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${chg1_id}", recipe_id: "${rg_id}", cycle_code: "C-001", scheduled_start_at: "2026-08-11T06:00:00Z", scheduled_end_at: "2026-08-11T06:00:00Z" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_VALIDATION with HTTP 400"
            - "GET /sterilization/cycles?chamber_id=${chg1_id} returns total_count == 0"

      - name: corner_dose_audit_is_append_only_without_version_field
        claim_type: immutability
        grounds:
          - entities.DoseAudit
          - endpoints[POST /sterilization/qualifications/{id}/dose-audits]
        distinguishing_aspect: "DoseAudit is declared common_fields false, so its rows expose id and created_at but carry no version and no update or delete endpoint anywhere in the endpoint table."
        test_recipe:
          setup:
            - "One PENDING qualification exists against an approved GAMMA recipe."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes"
              payload: { recipe_code: "RG", modality: "GAMMA", density_min_g_per_cm3: 0.1000, density_max_g_per_cm3: 0.1060, target_dose_kgy: 30.0, min_dose_kgy: 27.0, max_dose_kgy: 45.0, dose_basis: "ROUTINE_MEAN", aeration_base_hours: 0, required_min_zone_dosimeters: 1, required_routine_dosimeters: 1, required_biological_indicators: 0 }
              as: RegulatoryAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes/${rg_id}/approve"
              payload: {}
              as: RegulatoryAdmin
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p1_id}", recipe_id: "${rg_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { q1_id: $.data.id }
          trigger:
            - call: "POST /sterilization/qualifications/${q1_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
              captures: { audit_id: $.data.id, outcome: $.data.outcome }
          assert:
            - "HTTP 201 and ${outcome} == PASS"
            - "the DoseAudit body contains id and created_at and does NOT contain version or updated_at"
            - "GET /sterilization/qualifications/${q1_id}/dose-audits returns total_count == 1 containing ${audit_id}"
            - "no PUT, PATCH or DELETE endpoint for dose audits is declared in the endpoint table"

      - name: corner_create_product_with_unknown_customer_returns_customer_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=35]
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - entities.Product.fields.customer_id
        distinguishing_aspect: "A body foreign key that does not resolve raises the parent's own 404 error id (ERR_CUSTOMER_NOT_FOUND), distinct from the generic ERR_VALIDATION."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
          trigger:
            - call: "POST /sterilization/products"
              payload: { customer_id: "00000000-0000-4000-8000-000000000000", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0 }
              as: RegulatoryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CUSTOMER_NOT_FOUND with HTTP 404"

      - name: corner_load_position_junction_links_one_cycle_to_two_lots
        claim_type: parent_relationships
        grounds:
          - entities.LoadPosition.fields.cycle_id
          - entities.LoadPosition.fields.lot_id
          - endpoints[GET /sterilization/load-positions]
        distinguishing_aspect: "LoadPosition is the many-to-many junction of the graph topology: one cycle reaches two lots and the filtered list resolves both directions from the same collection."
        test_recipe:
          setup:
            - "A GAMMA cycle carries two positions, one holding a lot of P1 and one holding a lot of P2, both products qualified against the same recipe."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 1000.0, max_concurrent_eto_cycles: 2 }
              as: RegulatoryAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-G1", modality: "GAMMA", pallet_capacity: 8, turnaround_minutes: 30, abatement_efficiency_pct: 0.0 }
              as: RegulatoryAdmin
              captures: { chg1_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes"
              payload: { recipe_code: "RG", modality: "GAMMA", density_min_g_per_cm3: 0.1000, density_max_g_per_cm3: 0.1060, target_dose_kgy: 30.0, min_dose_kgy: 27.0, max_dose_kgy: 45.0, dose_basis: "ROUTINE_MEAN", aeration_base_hours: 0, required_min_zone_dosimeters: 1, required_routine_dosimeters: 1, required_biological_indicators: 0 }
              as: RegulatoryAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes/${rg_id}/approve"
              payload: {}
              as: RegulatoryAdmin
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p1_id}", recipe_id: "${rg_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /sterilization/qualifications/${q1_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P2", pallet_mass_kg: 90.0, pallet_volume_m3: 0.8, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p2_id}", recipe_id: "${rg_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { q2_id: $.data.id }
            - call: "POST /sterilization/qualifications/${q2_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
            - call: "POST /sterilization/lots"
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", lot_code: "L-P1", total_pallet_count: 2 }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { lot_p1_id: $.data.id }
            - call: "POST /sterilization/lots"
              payload: { customer_id: "${cust_id}", product_id: "${p2_id}", lot_code: "L-P2", total_pallet_count: 2 }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { lot_p2_id: $.data.id }
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${chg1_id}", recipe_id: "${rg_id}", cycle_code: "C-001", scheduled_start_at: "2026-08-11T00:00:00Z", scheduled_end_at: "2026-08-11T06:00:00Z" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { cyc_id: $.data.id, cyc_v0: $.data.version }
            - call: "POST /sterilization/cycles/${cyc_id}/load-positions"
