# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 2 instances per Difficulty Rule (§0.5); every setup chain replays against §1.5.
#
# Shared fixture conventions (literals pinned here, reused per-instance):
#   Series S1: series_code "0343", min_grade 5, max_grade 12, quals_base_months 6,
#     quals_months_per_grade_step 6, allows_education_substitution true,
#     education_substitution_cap_months 12, positive_education_required false.
#   Position GS-9: factor levels (K=2,S=2,C=3,I=2) -> total_points 2250 -> official_grade 9,
#     provisional_grade (narrative min-cap) 7. Qualification: required_months = 6 + (9-5)*6 = 30.
#   Announcement A1: open [2026-09-05T00:00:00Z, 2026-09-20T00:00:00Z), bq_cut 95, wq_cut 85,
#     certificate_validity_days 60. Issued 2026-09-15 -> expires 2026-11-14T00:00:00Z.
#   SME score (pinned: per-component round_half_up(w*r*6) then sum, +70):
#     (2,5,5)->95  (4,4,4)->94  (5,5,5)->100  (5,1,1)->83  (3,5,5)->96
#     (5,3,5)->98  (1,1,5)->88  (3,1,1)->79  (1,3,1)->79  (2,2,5)->91

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: position_grade_narrative_vs_point_factor
        grounds:
          - calculations.position_grade_determination
          - entities.Position.fields.provisional_grade
          - entities.Position.fields.official_grade
        distinguishing_aspect: |
          Position domain: identical factor inputs (3,3,3,3) legitimately produce TWO different grades —
          narrative min-cap provisional_grade 9 vs point-factor official_grade 11. Paired with
          application_provisional_vs_sme_certified_score, which lives on the Application domain.
        test_recipe:
          setup:
            - "Series S1 exists (grades 5..12)."
            - "Position created with factor levels K=3, S=3, C=3, I=3, sensitivity NONE, still DRAFT."
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 3, factor_supervision_level: 3, factor_complexity_level: 3, factor_impact_level: 3, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id, p1_prov: $.data.provisional_grade, p1_tot: $.data.total_points }
          trigger:
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
              captures: { p1_off: $.data.official_grade, p1_status: $.data.status }
          assert:
            - "provisional (narrative) grade captured at creation == 9"
            - "official (point-factor) grade after classify == 11"
            - "total_points == 3000"
            - "status == CLASSIFIED"
            - "9 != 11: identical factor inputs diverge across the two sanctioned variants"

      - name: application_provisional_vs_sme_certified_score
        grounds:
          - calculations.sme_technical_score
          - entities.Application.fields.provisional_score
          - entities.Application.fields.technical_score
        distinguishing_aspect: |
          Application domain: the same score formula over self-reported ratings (5,5,5) yields
          provisional_score 100 / BEST_QUALIFIED, while the SME-certified variant over (4,4,4) yields
          94 / WELL_QUALIFIED for the SAME application — different entity domain than the Position instance.
        test_recipe:
          setup:
            - "Series S1; GS-9 position CLASSIFIED; announcement A1 OPEN; clock 2026-09-10T00:00:00Z."
            - "Applicant (claim NONE) applied with self ratings (5,5,5) and 30/0 months; screened QUALIFIED."
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id }
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/positions/${p1}/announcements"
              payload: { announcement_number: "OPM-26-001", area_of_consideration: "ALL_US_CITIZENS", hiring_authority: "COMPETITIVE", assessment_method: "CATEGORY_RATING", open_at: "2026-09-05T00:00:00Z", close_at: "2026-09-20T00:00:00Z", vacancies_count: 1, bq_cut: 95, wq_cut: 85, certificate_validity_days: 60 }
              as: HiringManager
              captures: { an1: $.data.id }
            - call: "POST /hiring/announcements/${an1}/open"
              payload: {}
              as: HiringManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hiring/applicants"
              payload: { full_name: "Alice", email: "alice@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { a1: $.data.id }
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${a1}", claimed_experience_months: 30, claimed_education_months: 0, self_rating_knowledge: 5, self_rating_skill: 5, self_rating_ability: 5 }
              as: Applicant
              as_user_id: "${a1}"
              captures: { ap1: $.data.id, ap1_prov: $.data.provisional_score, ap1_provcat: $.data.provisional_category }
            - call: "POST /hiring/applications/${ap1}/screen"
              payload: {}
              as: HRSpecialist
          trigger:
            - call: "POST /hiring/applications/${ap1}/assessments"
              payload: { rating_knowledge: 4, rating_skill: 4, rating_ability: 4 }
              as: SME
              as_user_id: "sme-1"
              captures: { as1: $.data.id }
            - call: "POST /hiring/assessments/${as1}/submit"
              payload: {}
              as: SME
              as_user_id: "sme-1"
            - call: "POST /hiring/assessments/${as1}/accept"
              payload: {}
              as: HRSpecialist
            - call: "GET /hiring/applications/${ap1}"
              payload: {}
              as: HRSpecialist
              captures: { ap1_score: $.data.technical_score, ap1_cat: $.data.quality_category, ap1_status: $.data.status }
          assert:
            - "provisional_score == 100 and provisional_category == BEST_QUALIFIED at submission"
            - "after SME accept: technical_score == 94, quality_category == WELL_QUALIFIED, status == RATED"
            - "provisional variant (100) != certified variant (94) for the same application; category flips BQ -> WQ"

  - rule_id: combinatorial_formula
    instances:
      - name: qualification_nested_min_grade_dependent_threshold
        grounds:
          - calculations.qualification_determination
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — nested min(education_claimed, cap),
          conditional on allows_education_substitution, against a grade-dependent required threshold
          (30 = 6 + (9-5)*6). The rounding-order instance is mode (b); different mode axis.
        test_recipe:
          setup:
            - "Series S1 (edu cap 12, substitution allowed); GS-9 position CLASSIFIED; A1 OPEN; clock 2026-09-10."
            - "appA: claimed 18 experience + 20 education -> creditable 18 + min(20,12) = 30 == required 30."
            - "appB: claimed 17 + 20 -> creditable 29 < 30."
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id }
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/positions/${p1}/announcements"
              payload: { announcement_number: "OPM-26-001", area_of_consideration: "ALL_US_CITIZENS", hiring_authority: "COMPETITIVE", assessment_method: "CATEGORY_RATING", open_at: "2026-09-05T00:00:00Z", close_at: "2026-09-20T00:00:00Z", vacancies_count: 1, bq_cut: 95, wq_cut: 85 }
              as: HiringManager
              captures: { an1: $.data.id }
            - call: "POST /hiring/announcements/${an1}/open"
              payload: {}
              as: HiringManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hiring/applicants"
              payload: { full_name: "QA", email: "qa@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { aa: $.data.id }
            - call: "POST /hiring/applicants"
              payload: { full_name: "QB", email: "qb@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { ab: $.data.id }
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${aa}", claimed_experience_months: 18, claimed_education_months: 20, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${aa}"
              captures: { apa: $.data.id }
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${ab}", claimed_experience_months: 17, claimed_education_months: 20, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${ab}"
              captures: { apb: $.data.id }
          trigger:
            - call: "POST /hiring/applications/${apa}/screen"
              payload: {}
              as: HRSpecialist
              captures: { apa_status: $.data.status, apa_req: $.data.required_experience_months, apa_cred: $.data.creditable_experience_months }
            - call: "POST /hiring/applications/${apb}/screen"
              payload: {}
              as: HRSpecialist
              captures: { apb_status: $.data.status, apb_cred: $.data.creditable_experience_months }
          assert:
            - "appA: required_experience_months == 30, creditable_experience_months == 30 (education capped at 12, not 20), status == QUALIFIED"
            - "appB: creditable_experience_months == 29, status == INELIGIBLE"
            - "removing the min() cap would give appA 38; removing the grade-dependent step would change 30 — all three inputs interact non-linearly"

      - name: sme_score_pinned_component_rounding_order
        grounds:
          - calculations.sme_technical_score
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-component round_half_up THEN sum yields 79
          for ratings (3,1,1), while sum-then-round yields 80; scaffold pins the per-component order.
          Different mode than the nested-min qualification instance (mode a).
        test_recipe:
          setup:
            - "Series S1; GS-9 position CLASSIFIED; A1 OPEN; clock 2026-09-10."
            - "Applicant applied (30/0 months) and screened QUALIFIED."
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id }
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/positions/${p1}/announcements"
              payload: { announcement_number: "OPM-26-001", area_of_consideration: "ALL_US_CITIZENS", hiring_authority: "COMPETITIVE", assessment_method: "CATEGORY_RATING", open_at: "2026-09-05T00:00:00Z", close_at: "2026-09-20T00:00:00Z", vacancies_count: 1, bq_cut: 95, wq_cut: 85 }
              as: HiringManager
              captures: { an1: $.data.id }
            - call: "POST /hiring/announcements/${an1}/open"
              payload: {}
              as: HiringManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hiring/applicants"
              payload: { full_name: "RA", email: "ra@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { ar: $.data.id }
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${ar}", claimed_experience_months: 30, claimed_education_months: 0, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${ar}"
              captures: { apr: $.data.id }
            - call: "POST /hiring/applications/${apr}/screen"
              payload: {}
              as: HRSpecialist
          trigger:
            - call: "POST /hiring/applications/${apr}/assessments"
              payload: { rating_knowledge: 3, rating_skill: 1, rating_ability: 1 }
              as: SME
              as_user_id: "sme-1"
              captures: { asr: $.data.id }
            - call: "POST /hiring/assessments/${asr}/submit"
              payload: {}
              as: SME
              as_user_id: "sme-1"
              captures: { asr_score: $.data.technical_score, asr_cat: $.data.quality_category }
          assert:
            - "technical_score == 79 — components round_half_up(5.4)=5, round_half_up(1.2)=1, round_half_up(3.0)=3, sum 9, +70"
            - "sum-then-round of the same inputs (9.6 -> 10 -> 80) is the WRONG order and must not be produced"
            - "quality_category == QUALIFIED (79 < wq_cut 85)"

  - rule_id: non_linear_state_machine
    instances:
      - name: assessment_return_resubmit_revision_cycle
        grounds:
          - state_machines.Assessment.SUBMITTED_to_RETURNED
          - state_machines.Assessment.RETURNED_to_SUBMITTED
        distinguishing_aspect: |
          Assessment machine is CYCLIC (SUBMITTED -> RETURNED -> SUBMITTED revision loop) and each
          resubmission recomputes the score (94 first, then 95). Paired with the Application
          branch-and-loop instance on a different entity.
        test_recipe:
          setup:
            - "Series S1; GS-9 position CLASSIFIED; A1 OPEN; clock 2026-09-10."
            - "Applicant applied (30/0), screened QUALIFIED; SME assessment (4,4,4) submitted (score 94); HR returned it."
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id }
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/positions/${p1}/announcements"
              payload: { announcement_number: "OPM-26-001", area_of_consideration: "ALL_US_CITIZENS", hiring_authority: "COMPETITIVE", assessment_method: "CATEGORY_RATING", open_at: "2026-09-05T00:00:00Z", close_at: "2026-09-20T00:00:00Z", vacancies_count: 1, bq_cut: 95, wq_cut: 85 }
              as: HiringManager
              captures: { an1: $.data.id }
            - call: "POST /hiring/announcements/${an1}/open"
              payload: {}
              as: HiringManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hiring/applicants"
              payload: { full_name: "CA", email: "ca@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { ac: $.data.id }
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${ac}", claimed_experience_months: 30, claimed_education_months: 0, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${ac}"
              captures: { apc: $.data.id }
            - call: "POST /hiring/applications/${apc}/screen"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/applications/${apc}/assessments"
              payload: { rating_knowledge: 4, rating_skill: 4, rating_ability: 4 }
              as: SME
              as_user_id: "sme-1"
              captures: { asc: $.data.id }
            - call: "POST /hiring/assessments/${asc}/submit"
              payload: {}
              as: SME
              as_user_id: "sme-1"
              captures: { asc_score1: $.data.technical_score }
            - call: "POST /hiring/assessments/${asc}/return"
              payload: { return_reason: "insufficient justification" }
              as: HRSpecialist
              captures: { asc_status2: $.data.status }
          trigger:
            - call: "POST /hiring/assessments/${asc}/submit"
              payload: { rating_knowledge: 2, rating_skill: 5, rating_ability: 5 }
              as: SME
              as_user_id: "sme-1"
              captures: { asc_score2: $.data.technical_score, asc_cat2: $.data.quality_category }
            - call: "POST /hiring/assessments/${asc}/accept"
              payload: {}
              as: HRSpecialist
              captures: { asc_status3: $.data.status }
            - call: "GET /hiring/applications/${apc}"
              payload: {}
              as: HRSpecialist
              captures: { apc_score: $.data.technical_score, apc_status: $.data.status }
          assert:
            - "first submit: status SUBMITTED with technical_score == 94"
            - "return: status RETURNED (cycle back)"
            - "resubmit with (2,5,5): technical_score == 95, quality_category == BEST_QUALIFIED"
            - "accept: assessment ACCEPTED; application RATED with technical_score == 95"
            - "the machine traversed DRAFT -> SUBMITTED -> RETURNED -> SUBMITTED -> ACCEPTED (a true cycle, not a pipeline)"

      - name: application_ineligible_qualification_appeal_loop
        grounds:
          - state_machines.Application.RECEIVED_to_INELIGIBLE
          - state_machines.Application.INELIGIBLE_to_QUALIFIED
        distinguishing_aspect: |
          Application machine BRANCHES at screening (QUALIFIED vs INELIGIBLE) and then LOOPS
          INELIGIBLE -> QUALIFIED via a sustained qualification appeal with corrected months —
          a different entity and a different non-linear shape than the Assessment revision cycle.
        test_recipe:
          setup:
            - "Series S1; GS-9 position CLASSIFIED (required 30); A1 OPEN; clock 2026-09-10."
            - "Applicant claimed 17 experience + 20 education -> creditable 29 -> INELIGIBLE at screen (clock 2026-09-14, appeal deadline 2026-09-28)."
            - "QUALIFICATION appeal filed at 2026-09-15 with corrected_experience_months 30."
          setup_api_calls:
            - call: "POST /hiring/series"
              payload: { series_code: "0343", title: "Program Analyst", min_grade: 5, max_grade: 12, quals_base_months: 6, quals_months_per_grade_step: 6, allows_education_substitution: true, education_substitution_cap_months: 12, positive_education_required: false }
              as: HRSpecialist
              captures: { s1: $.data.id }
            - call: "POST /hiring/positions"
              payload: { series_id: "${s1}", title: "Analyst", org_code: "OPM1", factor_knowledge_level: 2, factor_supervision_level: 2, factor_complexity_level: 3, factor_impact_level: 2, sensitivity_level: "NONE" }
              as: HiringManager
              captures: { p1: $.data.id }
            - call: "POST /hiring/positions/${p1}/classify"
              payload: {}
              as: HRSpecialist
            - call: "POST /hiring/positions/${p1}/announcements"
              payload: { announcement_number: "OPM-26-001", area_of_consideration: "ALL_US_CITIZENS", hiring_authority: "COMPETITIVE", assessment_method: "CATEGORY_RATING", open_at: "2026-09-05T00:00:00Z", close_at: "2026-09-20T00:00:00Z", vacancies_count: 1, bq_cut: 95, wq_cut: 85 }
              as: HiringManager
              captures: { an1: $.data.id }
            - call: "POST /hiring/announcements/${an1}/open"
              payload: {}
              as: HiringManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hiring/applicants"
              payload: { full_name: "IA", email: "ia@x.com", is_us_citizen: true, is_current_federal_employee: false, veteran_preference_claim: "NONE" }
              as: Applicant
              captures: { ai: $.data.id }
            - call: "POST /hiring/announcements/${an1}/applications"
              payload: { applicant_id: "${ai}", claimed_experience_months: 17, claimed_education_months: 20, self_rating_knowledge: 3, self_rating_skill: 3, self_rating_ability: 3 }
              as: Applicant
              as_user_id: "${ai}"
              captures: { api: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hiring/applications/${api}/screen"
              payload: {}
              as: HRSpecialist
              captures: { api_status: $.data.status, api_cred: $.data.creditable_experience_months }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /hiring/applications/${api}/appeals"
              payload: { grounds: "QUALIFICATION", corrected_experience_months: 30 }
              as: Applicant
              as_user_id: "${ai}"
              captures: { apl1: $.data.id, apl1_status: $.data.status }
          trigger:
            - call: "POST /hiring/appeals/${apl1}/adjudicate"
              payload: { outcome: "SUSTAINED", adjudication_note: "verified additional service" }
              as: HRSpecialist
              captures: { apl1_final: $.data.status }
            - call: "GET /hiring/applications/${api}"
              payload: {}
              as: HRSpecialist
              captures: { api_status2: $.data.status, api_claimed2: $.data.claimed_experience_months, api_cred2: $.data.creditable_experience_months }
          assert:
