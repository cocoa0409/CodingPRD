# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3376_analyst_inquiry_entitlements_research_process_vendor_briefings
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
#
# Sections follow references/claim-extraction-guide.md verbatim.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: client_account_create_returns_declared_fields_and_starts_active
        claim_type: Creation
        grounds:
          - entities.ClientAccount
          - endpoints.POST_/research/clients
        distinguishing_aspect: "An account created with only the contract terms comes back 201 with contract_status ACTIVE, version 1, all four seat counters at 0 and both ledger remainders equal to inquiry_allowance_total — none of those fields is client-supplied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /research/clients"
              payload: { legal_name: "Acme Industrial Group", industry: "Manufacturing", region: "NA", contract_start_utc: "2026-07-01T00:00:00Z", contract_end_utc: "2027-06-30T00:00:00Z", seat_count_contracted: 10, inquiry_allowance_total: 10, reprint_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "ClientAccount.${acct_id}.contract_status == ACTIVE and version == 1"
            - "ClientAccount.${acct_id}.active_seat_count == 0 and provisioned_seat_count == 0 and revoked_seat_count == 0"
            - "ClientAccount.${acct_id}.consumed_inquiry_units == 0 and reserved_inquiry_units == 0"
            - "ClientAccount.${acct_id}.remaining_consumed_units == 10 and remaining_reserved_units == 10"
            - "the response data carries non-null id, created_at and updated_at"

      - name: seat_get_returns_entitlement_matrix_derived_from_research_role
        claim_type: Computed Fields
        grounds:
          - entities.Seat.fields.entitlement_document_types
          - entities.Seat.fields.research_role
          - endpoints.GET_/research/seats/{id}
        distinguishing_aspect: "entitlement_document_types is derived, not stored: an ARCHITECT seat with a HYPE_PROFILE override reads [MARKET_GUIDE, COMPARATIVE_MATRIX, HYPE_PROFILE, CRITICAL_CAPABILITIES] in that order, and a client-supplied entitlement_document_types value is ignored."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account."
          setup_api_calls:
            - *c_clock
            - &c_acct10
              call: "POST /research/clients"
              payload: { legal_name: "Acme Industrial Group", industry: "Manufacturing", region: "NA", contract_start_utc: "2026-07-01T00:00:00Z", contract_end_utc: "2027-06-30T00:00:00Z", seat_count_contracted: 10, inquiry_allowance_total: 10, reprint_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "arch@acme.example", research_role: "ARCHITECT", seat_kind: "NAMED", entitlement_override_types: ["HYPE_PROFILE", "MARKET_GUIDE"] }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { seat_id: $.data.id }
            - call: "POST /research/seats/${seat_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /research/seats/${seat_id}"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
          assert:
            - "Seat.${seat_id}.entitlement_document_types == [\"MARKET_GUIDE\", \"COMPARATIVE_MATRIX\", \"HYPE_PROFILE\", \"CRITICAL_CAPABILITIES\"]"
            - "Seat.${seat_id}.status == ACTIVE and activated_at is not null"
            - "Seat.${seat_id}.client_account_id == ${acct_id}"

      - name: seat_create_omitting_seat_kind_defaults_to_named
        claim_type: Defaults
        grounds:
          - entities.Seat.fields.seat_kind
          - endpoints.POST_/research/seats
        distinguishing_aspect: "seat_kind declares the default NAMED, so a create that omits it stores NAMED rather than null, and the seat is counted as a named seat in the account counters."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account."
          setup_api_calls:
            - *c_clock
            - *c_acct10
          trigger:
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "defaulted@acme.example", research_role: "PRACTITIONER" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { seat_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Seat.${seat_id}.seat_kind == NAMED"
            - "Seat.${seat_id}.status == PROVISIONED"
            - "Seat.${seat_id}.entitlement_override_types == []"
            - "ClientAccount.${acct_id}.provisioned_seat_count == 1"

      - name: inquiry_create_missing_duration_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.InquiryRequest.fields.duration_minutes
          - validations[priority=3]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "duration_minutes is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the body well-formedness check and no InquiryRequest row is created."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account with one ACTIVE seat and one analyst."
          setup_api_calls:
            - *c_clock
            - *c_acct10
            - &c_an1
              call: "POST /research/analysts"
              payload: { full_name: "Dana Whitfield", practice_area: "CIO_TECH", topic_routes: ["CLOUD_COST", "MARKET_OUTLOOK"], seniority: "DISTINGUISHED", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { an1_id: $.data.id, an1_v: $.data.version }
            - &c_seat
              call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "nina@acme.example", research_role: "PRACTITIONER", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { seat_id: $.data.id }
            - &c_seat_act
              call: "POST /research/seats/${seat_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Missing duration", requested_start_utc: "2026-09-20T10:00:00Z", preparation_notes: "Brief attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { err_missing: $.data.error_id }
          assert:
            - "the response status is 400 and err_missing == ERR_INVALID_REQUEST"
            - "GET /research/inquiry-requests?seat_id=${seat_id} returns 0 rows"

      - name: client_create_with_unknown_region_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.ClientAccount.fields.region
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "region is a closed enum of exactly {NA, EMEA, APAC}; a value such as LATAM is rejected at the body well-formedness check with 400 ERR_INVALID_REQUEST rather than being stored."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /research/clients"
              payload: { legal_name: "Andes Holdings", industry: "Mining", region: "LATAM", contract_start_utc: "2026-07-01T00:00:00Z", contract_end_utc: "2027-06-30T00:00:00Z", seat_count_contracted: 5, inquiry_allowance_total: 5, reprint_tier: "NONE" }
              as: PlatformAdmin
              captures: { err_region: $.data.error_id }
          assert:
            - "the response status is 400 and err_region == ERR_INVALID_REQUEST"
            - "GET /research/clients returns 0 rows"

      - name: document_get_with_unknown_id_returns_document_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/research/documents/{id}
          - errors.ERR_DOCUMENT_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated id on the document path produces the entity-specific 404 ERR_DOCUMENT_NOT_FOUND rather than a generic error or a 400."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. No document has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /research/documents/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ResearchDirector
              captures: { err_nf: $.data.error_id }
          assert:
            - "the response status is 404 and err_nf == ERR_DOCUMENT_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: inquiry_list_filters_by_seat_and_status
        claim_type: Listing
        grounds:
          - endpoints.GET_/research/inquiry-requests
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two inquiries on one seat and one SCHEDULED, the seat filter and the status filter compose: seat+status returns exactly 1 row while the unfiltered list returns 2, and every page reports total_count over the filtered set."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account, one ACTIVE seat, one analyst; two inquiries of which one is SCHEDULED."
          setup_api_calls:
            - *c_clock
            - *c_acct10
            - *c_an1
            - *c_seat
            - *c_seat_act
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Listing one", requested_start_utc: "2026-09-20T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief one." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq1_id: $.data.id }
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Listing two", requested_start_utc: "2026-09-21T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief two." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq2_id: $.data.id }
            - call: "POST /research/inquiry-requests/${inq2_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-21T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
          trigger:
            - call: "GET /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", status: "SCHEDULED" }
              as: SeatHolder
              as_user_id: "${seat_id}"
            - call: "GET /research/inquiry-requests"
              payload: { seat_id: "${seat_id}" }
              as: SeatHolder
              as_user_id: "${seat_id}"
          assert:
            - "the filtered list returns exactly 1 row, the SCHEDULED inquiry ${inq2_id}"
            - "the unfiltered list returns exactly 2 rows"
            - "both responses carry limit, offset, total_count and has_more"
            - "the filtered response has total_count == 1 and has_more == false"
            - "the unfiltered response has total_count == 2 and has_more == false with limit defaulting to 10 and offset to 0"

      - name: briefing_create_with_unknown_vendor_returns_vendor_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.VendorBriefing.fields.vendor_id
          - errors.ERR_VENDOR_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "vendor_id is a body foreign key validated at priority 4, so an unknown vendor id on a briefing request is a 404 ERR_VENDOR_NOT_FOUND and no briefing row is written."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst on MARKET_OUTLOOK; no vendors."
          setup_api_calls:
            - *c_clock
            - *c_an1
          trigger:
            - call: "POST /research/vendor-briefings"
              payload: { vendor_id: "00000000-0000-4000-8000-000000000009", briefing_topic: "MARKET_OUTLOOK", requested_start_utc: "2026-09-25T15:00:00Z", duration_minutes: 45 }
              as: VendorRep
              as_user_id: "00000000-0000-4000-8000-000000000009"
              captures: { err_vendor: $.data.error_id }
          assert:
            - "the response status is 404 and err_vendor == ERR_VENDOR_NOT_FOUND"
            - "GET /research/vendor-briefings returns 0 rows"

      - name: inquiry_create_extra_field_status_and_units_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.InquiryRequest.fields.status
          - entities.InquiryRequest.fields.units_consumed
          - endpoints.POST_/research/inquiry-requests
        distinguishing_aspect: "status is source: system with routing applied on create, so a client that posts status COMPLETED and units_consumed 1 is ignored: the row is created ROUTED with units_consumed 0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account, one ACTIVE seat, one analyst."
          setup_api_calls:
            - *c_clock
            - *c_acct10
            - *c_an1
            - *c_seat
            - *c_seat_act
          trigger:
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Ignore my status", requested_start_utc: "2026-09-20T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief.", status: "COMPLETED", units_consumed: 1 }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq_id: $.data.id }
          assert:
            - "the response status is 201"
            - "InquiryRequest.${inq_id}.status == ROUTED"
            - "InquiryRequest.${inq_id}.units_consumed == 0"
            - "InquiryRequest.${inq_id}.analyst_id == ${an1_id} and routing_attempt_count == 1"
            - "ClientAccount.${acct_id}.consumed_inquiry_units == 0 and reserved_inquiry_units == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: inquiry_terminal_state_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.InquiryRequest.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "COMPLETED is terminal for InquiryRequest, so a schedule or cancel attempt afterwards is rejected with 409 ERR_INVALID_STATE and neither the ledger nor the analyst load moves."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account, one ACTIVE seat, one analyst and one inquiry that has been scheduled, prepared and completed."
          setup_api_calls:
            - *c_clock
            - *c_acct10
            - *c_an1
            - *c_seat
            - *c_seat_act
            - call: "POST /research/inquiry-requests"
              payload: { seat_id: "${seat_id}", topic_route: "CLOUD_COST", question_summary: "Terminal lockdown", requested_start_utc: "2026-09-02T10:00:00Z", duration_minutes: 45, preparation_notes: "Brief attached." }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { inq_id: $.data.id }
            - call: "POST /research/inquiry-requests/${inq_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-02T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /research/inquiry-requests/${inq_id}/complete"
              payload: { outcome: "COMPLETED", note_delivered: true, note_reference: "NOTE-1" }
              as: Analyst
              as_user_id: "${an1_id}"
          trigger:
            - call: "POST /research/inquiry-requests/${inq_id}/schedule"
              payload: { scheduled_start_utc: "2026-09-09T10:00:00Z" }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { err_schedule: $.data.error_id }
            - call: "POST /research/inquiry-requests/${inq_id}/cancel"
              payload: { cancel_reason: "Too late" }
              as: SeatHolder
              as_user_id: "${seat_id}"
              captures: { err_cancel: $.data.error_id }
          assert:
            - "the schedule attempt returns 409 and err_schedule == ERR_INVALID_STATE"
            - "the cancel attempt returns 409 and err_cancel == ERR_INVALID_STATE"
            - "InquiryRequest.${inq_id}.status == COMPLETED and units_consumed == 1"
            - "ClientAccount.${acct_id}.consumed_inquiry_units == 1 and reserved_inquiry_units == 0"

      - name: document_create_starts_in_draft_with_embargo_dimension_embargoed
        claim_type: Initial State
        grounds:
          - state_machines.ResearchDocument.initial_state
          - entities.ResearchDocument.fields.embargo_status
          - endpoints.POST_/research/documents
        distinguishing_aspect: "A new document starts with editorial_status DRAFT and, independently, embargo_status EMBARGOED with a null embargo_until, so the two dimensions are initialized separately."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst."
          setup_api_calls:
            - *c_clock
            - *c_an1
          trigger:
            - call: "POST /research/documents"
              payload: { title: "Hype Profile: Edge AI", doc_type: "HYPE_PROFILE", practice_area: "CIO_TECH", lead_analyst_id: "${an1_id}" }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { doc_id: $.data.id }
          assert:
            - "the response status is 201"
            - "ResearchDocument.${doc_id}.editorial_status == DRAFT"
            - "ResearchDocument.${doc_id}.embargo_status == EMBARGOED"
            - "ResearchDocument.${doc_id}.embargo_until is null and published_at is null"
            - "ResearchDocument.${doc_id}.peer_verdict == NOT_ASSIGNED and peer_review_round == 0"
            - "ResearchDocument.${doc_id}.included_vendor_count == 0 and fact_check_open_count == 0"

      - name: sponsorship_activate_from_cancelled_is_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Sponsorship.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CANCELLED is terminal for Sponsorship, so re-activating a cancelled package is a 409 ERR_INVALID_STATE and the event's sponsorship revenue stays where the cancel left it."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One DRAFT event, one vendor and one sponsorship that has been activated and then cancelled."
          setup_api_calls:
            - *c_clock
            - &c_ven1
              call: "POST /research/vendors"
              payload: { vendor_name: "Northwind Analytics", hq_region: "NA", employee_count_band: "ENTERPRISE" }
              as: PlatformAdmin
              captures: { ven1_id: $.data.id }
            - call: "POST /research/conference-events"
              payload: { event_name: "Symposium 2026", venue_region: "NA", start_utc: "2026-10-20T09:00:00Z", end_utc: "2026-10-22T17:00:00Z" }
              as: EventProgrammer
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /research/sponsorships"
              payload: { conference_event_id: "${ev_id}", vendor_id: "${ven1_id}", tier: "GOLD", amount_cents: 2500000, exclusivity_start_utc: "2026-10-20T09:00:00Z", exclusivity_end_utc: "2026-10-22T17:00:00Z", expected_conference_event_version: "${ev_v}" }
              as: SalesRep
              captures: { sp_id: $.data.id }
            - call: "POST /research/sponsorships/${sp_id}/activate"
              payload: {}
              as: EventProgrammer
            - call: "POST /research/sponsorships/${sp_id}/cancel"
              payload: { cancel_reason: "Vendor withdrew" }
              as: EventProgrammer
          trigger:
            - call: "POST /research/sponsorships/${sp_id}/activate"
              payload: {}
              as: EventProgrammer
              captures: { err_terminal: $.data.error_id }
          assert:
            - "the re-activation returns 409 and err_terminal == ERR_INVALID_STATE"
            - "Sponsorship.${sp_id}.status == CANCELLED"
            - "ConferenceEvent.${ev_id}.sponsorship_revenue_cents == 0"

      - name: seat_revoke_side_effects_rederive_account_counters_and_posture
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Seat.ACTIVE_to_REVOKED
          - entities.ClientAccount.fields.utilization_score
          - entities.ClientAccount.fields.renewal_posture
        distinguishing_aspect: "Revoking one of two active seats on a four-seat contract fires the declared cascade: the account counters, the SEAT_WEIGHTED utilization score (32.24) and the RENEWAL_REVIEW entry when the active count falls below half the contracted footprint all move in the same request."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Account with seat_count_contracted 4, inquiry_allowance_total 4 and two ACTIVE seats."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/clients"
              payload: { legal_name: "Meridian Health Network", industry: "Healthcare", region: "NA", contract_start_utc: "2026-07-01T00:00:00Z", contract_end_utc: "2027-06-30T00:00:00Z", seat_count_contracted: 4, inquiry_allowance_total: 4, reprint_tier: "PREMIUM" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "seat1@meridian.example", research_role: "ARCHITECT", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /research/seats"
              payload: { client_account_id: "${acct_id}", seat_email: "seat2@meridian.example", research_role: "PRACTITIONER", seat_kind: "NAMED" }
              as: ClientAdmin
              as_user_id: "${acct_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /research/seats/${s1_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
            - call: "POST /research/seats/${s2_id}/activate"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /research/seats/${s1_id}/revoke"
              payload: {}
              as: ClientAdmin
              as_user_id: "${acct_id}"
          assert:
            - "Seat.${s1_id}.status == REVOKED and Seat.${s1_id}.revoked_at is not null"
            - "Seat.${s1_id}.entitlement_document_types == []"
            - "ClientAccount.${acct_id}.active_seat_count == 1 and revoked_seat_count == 1"
            - "ClientAccount.${acct_id}.utilization_score == 32.24"
            - "ClientAccount.${acct_id}.renewal_posture == AT_RISK"
            - "ClientAccount.${acct_id}.contract_status == RENEWAL_REVIEW"

      - name: document_revise_reopens_fact_check_rounds
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ResearchDocument.PUBLISHED_to_REVISED
          - entities.VendorInclusion.fields.fact_check_round
          - entities.VendorInclusion.fields.fact_check_status
        distinguishing_aspect: "Revising a published document reopens a fact-check round on every INCLUDED inclusion and lifts the placement lock, so fact_check_round goes from 1 to 2 and placement_locked returns to false while the document lands in FACT_CHECK."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Published document with one INCLUDED inclusion whose first fact-check round was adjudicated."
          setup_api_calls:
            - *c_clock
            - *c_an1
            - &c_an2
              call: "POST /research/analysts"
              payload: { full_name: "Ravi Menon", practice_area: "CIO_TECH", topic_routes: ["CLOUD_COST"], seniority: "SENIOR", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { an2_id: $.data.id }
            - *c_ven1
            - &c_doc
              call: "POST /research/documents"
