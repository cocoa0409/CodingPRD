              as_user_id: "u-ta-01"
              captures: { v3: $.data.version }
          assert:
            - "after the first trigger call Distributor.${dist}.distributor_state == PENDING_TRAINING with trained_technician_count == 1 and installation_training_state == IN_PROGRESS"
            - "after the second trigger call Distributor.${dist}.distributor_state == PENDING_TRAINING and trained_technician_count == 1 (both modules are present but only one technician is trained)"
            - "after the second trigger call completed_training_keys holds 2 entries"
