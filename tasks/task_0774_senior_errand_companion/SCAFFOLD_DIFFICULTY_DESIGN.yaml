          - validations[priority=11]
          - state_machines.Visit.SCHEDULED_to_SCHEDULED
          - errors[ERR_CLIENT_VISIT_OVERLAP]
        distinguishing_aspect: "Client visit overlap uses CLOSED intervals with no buffer: visit1 [10:00-12:00] and a new visit2 [12:00-13:00] share the endpoint 12:00 and are rejected — adjacency counts as overlap, unlike the caregiver's half-open semantics."
        test_recipe:
          setup:
            - "A client with an existing visit1 [2026-03-06 10:00-12:00]."
          setup_api_calls:
            - call: "POST /care/clients"
              payload: { name: "Client P", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-06T10:00:00Z", scheduled_end: "2026-03-06T12:00:00Z" }
              as: CareCoordinator
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-06T12:00:00Z", scheduled_end: "2026-03-06T13:00:00Z" }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CLIENT_VISIT_OVERLAP"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_restores_client_outstanding_balance
        grounds:
          - state_machines.Invoice.FINALIZED_to_VOID
          - calculations.outstanding_balance
          - entities.Client.fields.outstanding_balance_cents
        distinguishing_aspect: "Finalizing an invoice adds total_cents (9000) to outstanding_balance_cents and voiding subtracts exactly the same 9000, conserving the money quantity outstanding_balance_cents = sum(FINALIZED total) - sum(APPROVED reimbursed) at its pre-finalize value 0."
        test_recipe:
          setup:
            - "A single invoice (total 9000) finalized then voided; no claims."
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG Q", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client Q", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
            - call: "POST /care/visits/${v}/clock-in"
              payload: { actual_start: "2026-03-05T09:00:00Z" }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /care/visits/${v}/clock-out"
              payload: { actual_end: "2026-03-05T12:00:00Z", mileage_miles: 0 }
              as: Caregiver
              as_user_id: "${cg}"
            - call: "GET /care/invoices?visit_id=${v}"
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
            - call: "POST /care/invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /care/invoices/${inv}/void"
              payload: {}
              as: BillingClerk
          assert:
            - "Invoice.${inv}.status == VOID"
            - "Client.${cl}.outstanding_balance_cents == 0"

      - name: cancel_assignment_restores_committed_minutes
        grounds:
          - state_machines.Assignment.CONFIRMED_to_CANCELLED
          - calculations.caregiver_committed_minutes
          - entities.Caregiver.fields.committed_minutes
        distinguishing_aspect: "Assigning adds the visit's 180 scheduled minutes to committed_minutes and cancelling subtracts exactly 180, conserving the time quantity committed_minutes at its pre-assignment value 0 (a different conserved quantity than money)."
        test_recipe:
          setup:
            - "Cleared bonded caregiver assigned to a 180-minute visit, then the assignment cancelled."
          setup_api_calls:
            - call: "POST /care/caregivers"
              payload: { name: "CG R", home_zip: "90001" }
              as: CareCoordinator
              captures: { cg: $.data.id }
            - call: "POST /care/caregivers/${cg}/background-checks"
              payload: {}
              as: CareCoordinator
              captures: { bgc: $.data.id }
            - call: "POST /care/background-checks/${bgc}/decision"
              payload: { outcome: "CLEARED", expires_at: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/caregivers/${cg}/bonds"
              payload: { coverage_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: CareCoordinator
            - call: "POST /care/clients"
              payload: { name: "Client R", home_zip: "90001", hourly_rate_cents: 3000, mileage_rate_cents_per_mile: 75 }
              as: CareCoordinator
              captures: { cl: $.data.id }
            - call: "POST /care/visits"
              payload: { client_id: "${cl}", task_type: "COMPANION", scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T12:00:00Z" }
              as: CareCoordinator
              captures: { v: $.data.id, vv: $.data.version }
            - call: "POST /care/visits/${v}/assignments"
              payload: { caregiver_id: "${cg}", expected_visit_version: "${vv}" }
              as: CareCoordinator
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /care/assignments/${asg}/cancel"
              payload: {}
              as: CareCoordinator
          assert:
            - "Assignment.${asg}.status == CANCELLED"
            - "Caregiver.${cg}.committed_minutes == 0"
