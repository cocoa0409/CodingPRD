          base_curve: 8.6
          diameter: 14.2
          sphere_min: -8.0
          sphere_max: 4.0
          sphere_step: 0.25
          material_family: silicone_hydrogel
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          p1_id: $.data.id
      - call: POST /products
        payload:
          brand: ClearSpan
          name: Daily 30 Wide
          wear_schedule: DAILY_DISPOSABLE
          lenses_per_box: 30
          unit_price_cents: 3200
          base_curve: 8.75
          diameter: 14.3
          sphere_min: -8.0
          sphere_max: 4.0
          sphere_step: 0.25
          material_family: silicone_hydrogel
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          p5_id: $.data.id
      - call: POST /products/${p1_id}/lens-equivalences
        payload:
          to_product_id: ${p5_id}
          equivalence_class: CLINICAL
          requires_patient_consent: false
        as: PlatformAdmin
        as_user_id: admin-root
      - call: POST /customers
        payload:
          full_name: Ada Lin
          email: ada.lin@example.com
          state_code: UT
        as: PlatformAdmin
        as_user_id: admin-root
        captures:
          cust_id: $.data.id
      - call: POST /prescriptions
        payload:
          customer_id: ${cust_id}
          product_id: ${p1_id}
          capture_mode: UPLOAD
          document_reference: scan-1
          issue_date: '2026-07-01'
          expiry_date: '2027-07-01'
          od_sphere: -2.25
          os_sphere: -4.0
          base_curve: 8.6
          diameter: 14.2
          boxes_authorized_total: 24
        as: Customer
        as_user_id: ${cust_id}
        captures:
          rx_id: $.data.id
      - call: POST /prescriptions/${rx_id}/submit
        payload: {}
        as: Customer
        as_user_id: ${cust_id}
      - call: POST /orders
        payload:
          customer_id: ${cust_id}
          prescription_id: ${rx_id}
          ordered_product_id: ${p1_id}
          boxes_od: 1
          boxes_os: 1
        as: Customer
        as_user_id: ${cust_id}
        captures:
          order_id: $.data.id
          order_version: $.data.version
      trigger:
      - call: POST /orders/${order_id}/substitution
        payload:
          substitute_product_id: ${p5_id}
          expected_order_version: ${order_version}
          patient_consent: true
        as: FulfillmentOperator
        as_user_id: fo-one
      assert:
      - Trigger returns 200 with parameter_deviation_index 0.80, substitution_type BRAND_EQUIVALENT and fulfilled_product_id equal to ${p5_id}.
      - 0.80 is (4 * 15 + 2 * 10 + 1 * 0 + 1 * 0) / 100 over integer hundredths.
      - total_cents remains 6400 because substitution is price-neutral, and version has advanced past ${order_version}.
- rule_id: non_linear_state_machine
  rule_name: Non-linear state machine
  instances:
  - name: prescription_correction_loop_returns_to_pending_verification
    grounds: §1.2 prescription_lifecycle declares PENDING_VERIFICATION -> CORRECTION_PENDING on a CORRECTED response and CORRECTION_PENDING -> PENDING_VERIFICATION on a new verification round, a cycle bounded by MAX_VERIFICATION_ROUNDS of 3.
    distinguishing_aspect: A linear implementation treats CORRECTION_PENDING as terminal or promotes straight to VERIFIED_ACTIVE. The correct implementation loops back to PENDING_VERIFICATION with verification_rounds 2, keeps the corrected spheres, and issues a round-2 request whose own passive deadline is recomputed from the new send instant.
