          - state_machines.CredentialRequest.CHANGES_REQUESTED_to_SUBMITTED
          - entities.CredentialRequest.fields.revision_count
          - calculations.credential_window_overlap_capacity
          - validations[priority=40]
          - validations[priority=9]
        distinguishing_aspect: |
          CYCLIC shape: the request re-enters SUBMITTED twice through CHANGES_REQUESTED,
          incrementing revision_count to exactly 2 (the first DRAFT → SUBMITTED does NOT
          count), and the third resubmission is refused with ERR_MAX_REVISIONS_EXCEEDED
          while the request stays in CHANGES_REQUESTED — the loop terminates by count,
          not by state.
