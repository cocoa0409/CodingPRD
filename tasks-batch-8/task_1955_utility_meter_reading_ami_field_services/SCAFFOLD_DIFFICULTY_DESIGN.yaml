# =============================================================================
# Task 1955 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_variants_diverge_on_identical_history
        grounds:
          - calculations.estimate_read_value
          - entities.ServiceAccount.fields.estimation_method
          - entities.MeterRead.fields.read_value
        distinguishing_aspect: |
          Dual-variant divergence on the MeterRead/usage domain: two accounts with byte-identical
          validated read history produce different estimates solely because estimation_method
          selects TRAILING_AVERAGE (10270) vs SAME_PERIOD_LAST_YEAR (10310).
        test_recipe:
          setup:
            - "Two AMI accounts A (TRAILING_AVERAGE) and B (SAME_PERIOD_LAST_YEAR), each with VALIDATED reads 9000@2025-07-05, 9310@2025-07-30, 9700@2026-06-01, 10000@2026-07-01; both meters DEGRADED; period window [2026-07-22..2026-07-28] WINDOW_OPEN; one route IN_PROGRESS with both stops NO_READ_PENDING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-07-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "Tech One" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-1001", service_address: "1 Oak St", billing_cycle_code: "C07", estimation_method: "TRAILING_AVERAGE" }, as: MeterOpsAdmin, captures: { acct_a: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "B-1002", service_address: "2 Oak St", billing_cycle_code: "C07", estimation_method: "SAME_PERIOD_LAST_YEAR" }, as: MeterOpsAdmin, captures: { acct_b: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-A-1", meter_type: "AMI" }, as: MeterOpsAdmin, captures: { meter_a: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-B-1", meter_type: "AMI" }, as: MeterOpsAdmin, captures: { meter_b: $.data.id } }
            - { call: "POST /meters/${meter_a}/install", payload: { service_account_id: "${acct_a}" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_b}/install", payload: { service_account_id: "${acct_b}" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_a}/ami-reads", payload: { read_value: 9000, read_at: "2025-07-05T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_a}/ami-reads", payload: { read_value: 9310, read_at: "2025-07-30T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_a}/ami-reads", payload: { read_value: 9700, read_at: "2026-06-01T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_a}/ami-reads", payload: { read_value: 10000, read_at: "2026-07-01T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_b}/ami-reads", payload: { read_value: 9000, read_at: "2025-07-05T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_b}/ami-reads", payload: { read_value: 9310, read_at: "2025-07-30T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_b}/ami-reads", payload: { read_value: 9700, read_at: "2026-06-01T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_b}/ami-reads", payload: { read_value: 10000, read_at: "2026-07-01T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-20T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-21T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C07", period_start_date: "2026-07-01", period_end_date: "2026-07-31", read_window_open_date: "2026-07-22", read_window_close_date: "2026-07-28", bill_run_date: "2026-07-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-22T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_id}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-07-22", route_shift: "FULL" }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "GET /routes/${route_id}/stops", payload: {}, as: Dispatcher, captures: { stop_a: "$.data[0].id", stop_b: "$.data[1].id" } }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_id}/start", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_a}/mark-no-read", payload: { no_read_reason: "GATE_LOCKED" }, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_b}/mark-no-read", payload: { no_read_reason: "GATE_LOCKED" }, as: FieldTechnician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /route-stops/${stop_a}/generate-estimate", payload: {}, as: BillingLiaison, captures: { est_a: $.data.id } }
            - { call: "POST /route-stops/${stop_b}/generate-estimate", payload: {}, as: BillingLiaison, captures: { est_b: $.data.id } }
          assert:
            - "MeterRead.${est_a}.read_value == 10270  # TRAILING: 10000 + round((300/30)*27)"
            - "MeterRead.${est_a}.estimation_method == TRAILING_AVERAGE"
            - "MeterRead.${est_b}.read_value == 10310  # SAME_PERIOD: 10000 + (9310-9000)"
            - "MeterRead.${est_b}.estimation_method == SAME_PERIOD_LAST_YEAR"
            - "MeterRead.${est_a}.read_value != MeterRead.${est_b}.read_value"

      - name: gross_vs_net_read_rate_at_reconcile
        grounds:
          - calculations.route_read_rate
          - entities.Route.fields.read_rate_percent
          - entities.Route.fields.net_read_rate_percent
        distinguishing_aspect: |
          Dual-variant divergence on the Route/OpsSnapshot SLA domain (different domain from the
          estimate rule): identical stop data yields read_rate_percent 50.00 (GROSS denominator
          includes the SKIPPED_HAZARD stop) but net_read_rate_percent 66.67 (NET excludes it).
        test_recipe:
          setup:
            - "Four handheld accounts a1..a4 (created in order) each with an installed HANDHELD meter; period window [2026-08-03..2026-08-07] WINDOW_OPEN; route scheduled 2026-08-03 AM, ASSIGNED to tech, IN_PROGRESS; stop1/stop2 VALIDATED, stop3 SKIPPED_HAZARD (active DOG flag), stop4 NO_READ_PENDING; route COMPLETED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "Tech Two" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-2001", service_address: "1 Elm St", billing_cycle_code: "C08" }, as: MeterOpsAdmin, captures: { acct_1: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-2002", service_address: "2 Elm St", billing_cycle_code: "C08" }, as: MeterOpsAdmin, captures: { acct_2: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-2003", service_address: "3 Elm St", billing_cycle_code: "C08" }, as: MeterOpsAdmin, captures: { acct_3: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-2004", service_address: "4 Elm St", billing_cycle_code: "C08" }, as: MeterOpsAdmin, captures: { acct_4: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-H-1", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_1: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-H-2", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_2: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-H-3", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_3: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-H-4", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_4: $.data.id } }
            - { call: "POST /meters/${meter_1}/install", payload: { service_account_id: "${acct_1}" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_2}/install", payload: { service_account_id: "${acct_2}" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_3}/install", payload: { service_account_id: "${acct_3}" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_4}/install", payload: { service_account_id: "${acct_4}" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C08", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-03", read_window_close_date: "2026-08-07", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_id: $.data.id } }
            - { call: "POST /billing-cycle-periods/${period_id}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_id}", scheduled_date: "2026-08-03", route_shift: "AM" }, as: Dispatcher, captures: { route_id: $.data.id } }
            - { call: "GET /routes/${route_id}/stops", payload: {}, as: Dispatcher, captures: { stop_1: "$.data[0].id", stop_2: "$.data[1].id", stop_3: "$.data[2].id", stop_4: "$.data[3].id", sv_1: "$.data[0].version", sv_2: "$.data[1].version" } }
            - { call: "POST /routes/${route_id}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_id}/start", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_1}/reads", payload: { meter_id: "${meter_1}", read_value: 1000, read_at: "2026-08-03T09:00:00Z", expected_route_stop_version: "${sv_1}" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { read_1: $.data.id } }
            - { call: "POST /reads/${read_1}/validate", payload: {}, as: BillingLiaison }
            - { call: "POST /route-stops/${stop_2}/reads", payload: { meter_id: "${meter_2}", read_value: 2000, read_at: "2026-08-03T09:30:00Z", expected_route_stop_version: "${sv_2}" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { read_2: $.data.id } }
            - { call: "POST /reads/${read_2}/validate", payload: {}, as: BillingLiaison }
            - { call: "POST /hazard-flags", payload: { service_account_id: "${acct_3}", hazard_type: "DOG", severity: "HIGH" }, as: FieldTechnician, as_user_id: "${tech_id}", captures: { flag_3: $.data.id } }
            - { call: "POST /route-stops/${stop_3}/skip-hazard", payload: { hazard_flag_id: "${flag_3}" }, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_4}/mark-no-read", payload: { no_read_reason: "METER_OBSTRUCTED" }, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /routes/${route_id}/complete", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /routes/${route_id}/reconcile", payload: {}, as: Dispatcher }
          assert:
            - "Route.${route_id}.read_rate_percent == 50.00      # GROSS: 2 covered / 4 stops"
            - "Route.${route_id}.net_read_rate_percent == 66.67  # NET: 2 covered / 3 (excl SKIPPED_HAZARD)"
            - "Route.${route_id}.read_rate_percent != Route.${route_id}.net_read_rate_percent"
            - "Route.${route_id}.route_status == RECONCILED"

  - rule_id: combinatorial_formula
    instances:
      - name: escalation_score_multi_input_threshold_contrast
        grounds:
          - calculations.no_read_escalation_score
          - entities.WorkOrder.fields.work_order_type
          - entities.ServiceAccount.fields.estimated_read_streak
        distinguishing_aspect: |
          Mode (a) combinatorial: the score mixes >=3 inputs (streak weight, nested min/max on the
          window-urgency term, conditional hazard bonus) and the dispatch threshold is inclusive;
          two NO_READ_PENDING stops in the same sweep differ only in estimated_read_streak (1 vs 0),
          producing 60 (>= 40, order auto-created) vs 35 (< 40, no order).
        test_recipe:
          setup:
            - "AMI account A1 with history and one prior ESTIMATED read (estimated_read_streak == 1); AMI account A2 with history and streak 0; both meters DEGRADED; period P2 window [2026-08-03..2026-08-07] WINDOW_OPEN; route R2 IN_PROGRESS with both stops marked NO_READ_PENDING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /field-technicians", payload: { display_name: "Tech Three" }, as: MeterOpsAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-3001", service_address: "1 Pine St", billing_cycle_code: "C09" }, as: MeterOpsAdmin, captures: { acct_1: $.data.id } }
            - { call: "POST /service-accounts", payload: { account_number: "A-3002", service_address: "2 Pine St", billing_cycle_code: "C09" }, as: MeterOpsAdmin, captures: { acct_2: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-E-1", meter_type: "AMI" }, as: MeterOpsAdmin, captures: { meter_1: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-E-2", meter_type: "AMI" }, as: MeterOpsAdmin, captures: { meter_2: $.data.id } }
            - { call: "POST /meters/${meter_1}/install", payload: { service_account_id: "${acct_1}" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_2}/install", payload: { service_account_id: "${acct_2}" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_1}/ami-reads", payload: { read_value: 9700, read_at: "2026-06-01T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_1}/ami-reads", payload: { read_value: 10000, read_at: "2026-07-01T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_2}/ami-reads", payload: { read_value: 5000, read_at: "2026-06-01T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /meters/${meter_2}/ami-reads", payload: { read_value: 5400, read_at: "2026-07-01T10:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-20T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-07-21T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C09", period_start_date: "2026-07-01", period_end_date: "2026-07-31", read_window_open_date: "2026-07-22", read_window_close_date: "2026-07-28", bill_run_date: "2026-07-31" }, as: MeterOpsAdmin, captures: { period_1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-22T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_1}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_1}", scheduled_date: "2026-07-22", route_shift: "FULL" }, as: Dispatcher, captures: { route_1: $.data.id } }
            - { call: "GET /routes/${route_1}/stops", payload: {}, as: Dispatcher, captures: { stop_p1_a1: "$.data[0].id" } }
            - { call: "POST /routes/${route_1}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_1}/start", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_p1_a1}/mark-no-read", payload: { no_read_reason: "NO_ACCESS" }, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_p1_a1}/generate-estimate", payload: {}, as: BillingLiaison }
            - { call: "POST /billing-cycle-periods", payload: { cycle_code: "C09", period_start_date: "2026-08-01", period_end_date: "2026-08-31", read_window_open_date: "2026-08-03", read_window_close_date: "2026-08-07", bill_run_date: "2026-08-31" }, as: MeterOpsAdmin, captures: { period_2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T08:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /billing-cycle-periods/${period_2}/open-read-window", payload: {}, as: BillingLiaison }
            - { call: "POST /routes", payload: { billing_cycle_period_id: "${period_2}", scheduled_date: "2026-08-03", route_shift: "FULL" }, as: Dispatcher, captures: { route_2: $.data.id } }
            - { call: "GET /routes/${route_2}/stops", payload: {}, as: Dispatcher, captures: { stop_a1: "$.data[0].id", stop_a2: "$.data[1].id" } }
            - { call: "POST /routes/${route_2}/assign", payload: { technician_id: "${tech_id}" }, as: Dispatcher }
            - { call: "POST /routes/${route_2}/start", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_a1}/mark-no-read", payload: { no_read_reason: "NO_ACCESS" }, as: FieldTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /route-stops/${stop_a2}/mark-no-read", payload: { no_read_reason: "NO_ACCESS" }, as: FieldTechnician, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-08-05T00:00:00Z" }, as: MeterOpsAdmin, captures: { snap_id: $.data.id } }
            - { call: "GET /work-orders", payload: { route_stop_id: "${stop_a1}" }, as: Dispatcher, captures: { wo_a1: "$.data[0].id" } }
            - { call: "GET /work-orders", payload: { route_stop_id: "${stop_a2}" }, as: Dispatcher, captures: { } }
          assert:
            - "ServiceAccount.${acct_1}.estimated_read_streak == 1"
            - "WorkOrder.${wo_a1}.work_order_type == RE_READ   # score 10+25*1+5*(7-2) = 60 >= 40"
            - "WorkOrder.${wo_a1}.work_order_status == OPEN"
            - "WorkOrder.${wo_a1}.scheduled_date == \"2026-08-05\""
            - "GET /work-orders?route_stop_id=${stop_a2} -> total_count == 0, zero items   # score 10+0+25 = 35 < 40"

      - name: backbill_per_month_rounding_order_pinned
        grounds:
          - calculations.theft_backbill_amount
          - entities.Investigation.fields.backbill_cents
          - validations[priority=3]
        distinguishing_aspect: |
          Mode (b) nested rounding: backbill rounds each month to cents BEFORE summing; the pinned
          fixture [333,333,333] kWh at 11.25 cents/kWh yields 3x3746 = 11238 subtotal, penalty 2810,
          total 14048 — one cent less than the sum-then-round order (14049), so rounding order is
          observable and must match the pinned order.
        test_recipe:
          setup:
            - "Account with installed HANDHELD meter; Investigation for the meter in PENDING_DISPOSITION"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /service-accounts", payload: { account_number: "A-4001", service_address: "9 Birch Rd", billing_cycle_code: "C10" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-T-1", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_id: $.data.id } }
            - { call: "POST /meters/${meter_id}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
            - { call: "POST /investigations", payload: { service_account_id: "${acct_id}", meter_id: "${meter_id}", indication_type: "THEFT_REPORT" }, as: Investigator, as_user_id: "inv-001", captures: { inv_id: $.data.id } }
            - { call: "POST /investigations/${inv_id}/begin-evidence", payload: {}, as: Investigator, as_user_id: "inv-001" }
            - { call: "POST /investigations/${inv_id}/submit-disposition", payload: {}, as: Investigator, as_user_id: "inv-001" }
          trigger:
            - { call: "POST /investigations/${inv_id}/confirm-theft", payload: { theft_window_months: 3, monthly_estimated_kwh: [333, 333, 333] }, as: Investigator, as_user_id: "inv-001", captures: { backbill: $.data.backbill_cents, xwo: $.data.exchange_work_order_id } }
          assert:
            - "Investigation.${inv_id}.backbill_cents == 14048   # 3 x round(333*11.25)=3x3746=11238; penalty round(11238*0.25)=2810"
            - "Investigation.${inv_id}.backbill_cents != 14049   # naive sum-then-round result"
            - "Investigation.${inv_id}.investigation_status == CONFIRMED_THEFT"
            - "WorkOrder.${xwo}.work_order_type == EXCHANGE and work_order_status == OPEN"
            - "Meter.${meter_id}.tamper_status == CONFIRMED"
            - "ServiceAccount.${acct_id}.account_status == SUSPENDED"

  - rule_id: non_linear_state_machine
    instances:
      - name: meter_three_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.Meter.endpoint_comms_status
          - state_machines.Meter.tamper_status
          - state_machines.Meter.meter_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity (Meter): endpoint_comms_status cycles
          COMMUNICATING -> DEGRADED -> NON_COMMUNICATING -> COMMUNICATING via snapshots and an
          AMI read, while tamper_status independently moves NONE -> SUSPECTED and meter_status
          stays IN_SERVICE throughout; a transition on one dimension leaves the others untouched.
        test_recipe:
          setup:
            - "AMI meter installed on an account; no reads yet; logical clock at 2026-08-01"
          setup_api_calls:
            - { call: "POST /service-accounts", payload: { account_number: "A-5001", service_address: "5 Cedar Ave", billing_cycle_code: "C11" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-P-1", meter_type: "AMI" }, as: MeterOpsAdmin, captures: { meter_id: $.data.id } }
            - { call: "POST /meters/${meter_id}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-08-02T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-08-03T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "POST /ops-snapshots", payload: { snapshot_at: "2026-08-04T00:00:00Z" }, as: MeterOpsAdmin }
            - { call: "GET /meters/${meter_id}", payload: {}, as: MeterOpsAdmin, captures: { comms_mid: $.data.endpoint_comms_status } }
            - { call: "POST /investigations", payload: { service_account_id: "${acct_id}", meter_id: "${meter_id}", indication_type: "TAMPER_FLAG" }, as: Investigator, as_user_id: "inv-002" }
          trigger:
            - { call: "POST /meters/${meter_id}/ami-reads", payload: { read_value: 5000, read_at: "2026-08-05T10:00:00Z" }, as: MeterOpsAdmin, captures: { read_id: $.data.id } }
          assert:
            - "intermediate observation: after 3 missed snapshots ${comms_mid} == NON_COMMUNICATING (DEGRADED at misses 1-2 is asserted separately in ami_miss_threshold_two_degraded_three_non_communicating)"
            - "Meter.${meter_id}.endpoint_comms_status == COMMUNICATING   # recovered by the AMI read"
            - "Meter.${meter_id}.tamper_status == SUSPECTED               # investigation dimension unaffected"
            - "Meter.${meter_id}.meter_status == IN_SERVICE               # lifecycle dimension unaffected"
            - "Meter.${meter_id}.consecutive_missed_days == 0 and non_communicating_since == null"
            - "MeterRead.${read_id}.read_status == VALIDATED              # AMI ingest auto-validates"

      - name: investigation_evidence_disposition_revision_loop
        grounds:
          - state_machines.Investigation.PENDING_DISPOSITION_to_EVIDENCE_GATHERING
          - state_machines.Investigation.EVIDENCE_GATHERING_to_PENDING_DISPOSITION
        distinguishing_aspect: |
          Cyclic machine on Investigation (different entity from Meter): the disposition loop
          EVIDENCE_GATHERING -> PENDING_DISPOSITION -> EVIDENCE_GATHERING -> PENDING_DISPOSITION
          revisits a prior state exactly once per cycle and every pass bumps version.
        test_recipe:
          setup:
            - "Account with installed meter; investigation opened by inv-101"
          setup_api_calls:
            - { call: "POST /service-accounts", payload: { account_number: "A-5002", service_address: "7 Cedar Ave", billing_cycle_code: "C11" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-P-2", meter_type: "HANDHELD" }, as: MeterOpsAdmin, captures: { meter_id: $.data.id } }
            - { call: "POST /meters/${meter_id}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
            - { call: "POST /investigations", payload: { service_account_id: "${acct_id}", meter_id: "${meter_id}", indication_type: "USAGE_ANOMALY" }, as: Investigator, as_user_id: "inv-101", captures: { inv_id: $.data.id } }
          trigger:
            - { call: "POST /investigations/${inv_id}/begin-evidence", payload: {}, as: Investigator, as_user_id: "inv-101" }
            - { call: "POST /investigations/${inv_id}/submit-disposition", payload: {}, as: Investigator, as_user_id: "inv-101" }
            - { call: "POST /investigations/${inv_id}/request-more-evidence", payload: {}, as: Investigator, as_user_id: "inv-101", captures: { looped: $.data.investigation_status } }
            - { call: "POST /investigations/${inv_id}/submit-disposition", payload: {}, as: Investigator, as_user_id: "inv-101" }
            - { call: "POST /investigations/${inv_id}/clear", payload: {}, as: Investigator, as_user_id: "inv-101", captures: { final_v: $.data.version } }
          assert:
            - "Investigation.${inv_id} re-entered EVIDENCE_GATHERING after PENDING_DISPOSITION (${looped} == EVIDENCE_GATHERING)"
            - "Investigation.${inv_id}.investigation_status == CLEARED"
            - "Investigation.${inv_id}.version == 6   # create 1 + begin 2 + submit 3 + more-evidence 4 + submit 5 + clear 6"
            - "Meter.${meter_id}.tamper_status == NONE   # clear cascade"

  - rule_id: transitive_cascade
    instances:
      - name: exchange_completion_cascades_through_enrollment_to_campaign_completion
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.Meter.IN_SERVICE_to_REMOVED
          - state_machines.CampaignEnrollment.WORK_ORDER_CREATED_to_WITHDRAWN
          - state_machines.ReplacementCampaign.OPEN_to_COMPLETED
        distinguishing_aspect: |
          Depth-3 chain from EXCHANGE completion (trigger 1 of 2): meter removal itself withdraws
          the meter's campaign enrollment; the withdrawal cancels the enrollment's auto-created
          ENDPOINT_SWAP order and recomputes campaign counts; the recompute auto-completes the
          OPEN campaign because its only enrollment is now terminal.
        test_recipe:
          setup:
            - "AMI meter M1 installed, endpoint FAILED after 5 snapshots (3 misses then 14 days); campaign quota 2 OPEN with M1 enrolled (enrollment WORK_ORDER_CREATED, auto order OPEN); IN_STOCK replacement meter M2; exchange order dispatched and IN_PROGRESS"
