          setup:
            - "ProgramTier ELITE (markup_cap_bps 700), Distributor METRO-01 (contracted_markup_bps 900), Member Harbor Grill ACTIVE with an ACTIVE PURCHASE_DATA_AND_PRICING letter for that distributor."
