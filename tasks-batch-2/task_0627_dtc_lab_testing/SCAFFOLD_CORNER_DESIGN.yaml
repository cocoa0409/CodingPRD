              captures: { prd: '$.data.id' }
            - call: "POST /catalog/carts"
              payload: { patient_id: "${prd}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${prd}"
              captures: { cart_rpd0: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart_rpd0}", test_offering_id: "${off_rpd}" }
              as: Patient
              as_user_id: "${prd}"
            - call: "GET /catalog/carts/${cart_rpd0}"
              as: Patient
              as_user_id: "${prd}"
              captures: { cart_rpd0_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${cart_rpd0}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${cart_rpd0_v}" }
              as: Patient
              as_user_id: "${prd}"
              captures: { order_rpd0: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${order_rpd0}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${prd}"
            - call: "GET /catalog/order-lines?order_id=${order_rpd0}"
              as: CatalogAdmin
              captures: { ol_rpd0: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${ol_rpd0}/collect"
              as: PhlebotomyTech
              captures: { spec_rpd0: '$.data.id' }
            - call: "POST /catalog/specimens/${spec_rpd0}/process"
              payload: { analyzer_value: 5 }
              as: LabTech
              captures: { res_rpd0: '$.data.id' }
            - call: "POST /catalog/lab-results/${res_rpd0}/release"
              as: LabTech
            - call: "POST /catalog/carts"
              payload: { patient_id: "${prd}", fund_source: "CARD" }
              as: Patient
              as_user_id: "${prd}"
              captures: { cart_rpd1: '$.data.id' }
            - call: "POST /catalog/cart-lines"
              payload: { cart_id: "${cart_rpd1}", test_offering_id: "${off_rpd}" }
              as: Patient
              as_user_id: "${prd}"
              captures: { line_rpd1: '$.data.id', line_rpd1_rep: '$.data.repeat_discount_applied' }
          trigger:
            - call: "GET /catalog/carts/${cart_rpd1}"
              as: Patient
              as_user_id: "${prd}"
              captures: { cart_rpd1_tot: '$.data.estimated_total_cents' }
          assert:
            - "CartLine.${line_rpd1}.repeat_discount_applied == true"
            - "Cart.${cart_rpd1}.estimated_total_cents == 3400"

      - name: derived_cart_total_reconciles_after_line_removal
        claim_type: derived_field_reconciliation
        grounds: [calculations.cart_estimated_total, entities.Cart.fields.line_count, endpoints]
        distinguishing_aspect: "Removing a line recomputes Cart line_count and estimated_total_cents: cart with two 1000 lines (subtotal 2000) drops to 1000 after one DELETE."
        test_recipe:
          setup: ["Offering DR @1000. Patient PDR. Cart with two DR lines."]
          setup_api_calls:
            - call: "POST /catalog/test-offerings"
              payload: { test_code: "DR", display_name: "Derived Recon", list_price_cents: 1000, specimen_type: "BLOOD" }
