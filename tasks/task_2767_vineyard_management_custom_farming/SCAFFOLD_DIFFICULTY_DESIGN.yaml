            - "second order (would-be estimated_labor_cost 64.25): error_id == ERR_PLAN_BUDGET_EXCEEDED with HTTP 409"
            - "FarmingPlan.${p2_id}.committed_cost == 1028.00 after the refusal"
            - "LaborCrew.${cr3_id}.scheduled_work_order_count == 1"

