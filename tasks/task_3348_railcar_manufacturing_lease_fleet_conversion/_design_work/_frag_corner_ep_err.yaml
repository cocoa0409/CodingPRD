            - call: "POST /api/v1/substitution-endorsements"
              payload: { production_order_id: "${po_id}", original_component_id: "${ws_id}", substitute_component_id: "${ws2_id}", substitute_qty_per_car: 2, decides_material: false, expected_production_order_version: "${po_v1}" }
              as: ProductionPlanner
              as_user_id: "user-op-9"
