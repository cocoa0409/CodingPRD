scaffold_corner_design:

  # ===========================================================================
  # Section: Entities
  # ===========================================================================
  - section: Entities
    instances:
      - claim_type: Creation
        name: contract_creation_returns_all_declared_fields
        grounds:
          - entities.Contract
          - endpoints["POST /nac/contracts"]
          - response_envelope
        distinguishing_aspect: |
          A create with every required input returns 201 and a data object carrying all
          seventeen declared Contract fields plus the four common fields, with status
          DRAFT and every money counter at 0.
        test_recipe:
          setup:
            - "One operator and one manufacturer exist; no contracts exist."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
          trigger:
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id, ct_status: $.data.status }
          assert:
            - "the response status code is 201 and the body has keys success, data and error"
            - "${ct_status} == DRAFT"
            - "Contract.${ct_id}.operator_id == ${op_id}"
            - "Contract.${ct_id}.contract_code == HLG-2026"
            - "Contract.${ct_id}.amends_contract_id == null"
            - "Contract.${ct_id}.compliance_posture == OPEN"
            - "Contract.${ct_id}.deviation_breach_count == 0"
            - "Contract.${ct_id}.rebate_payable_cents == 0"
            - "Contract.${ct_id}.rebate_settled_total_cents == 0"
            - "Contract.${ct_id}.signed_at == null and Contract.${ct_id}.signed_by_user_id == null"


      - claim_type: Defaults
        name: omitted_optional_inputs_take_declared_defaults
        grounds:
          - entities.Contract.fields.notice_period_days
          - entities.Contract.fields.contracted_purchase_pct_target
          - entities.Contract.fields.compliance_basis
          - entities.Contract.fields.allow_out_of_market
          - entities.Product.fields.stock_status
          - entities.Product.fields.is_market_indexed
          - entities.Manufacturer.fields.bill_back_terms_days
          - entities.ContractTier.fields.counts_as_contracted
        distinguishing_aspect: |
          Every field declared with a default takes exactly that default when its input
          key is omitted: notice_period_days 30, contracted_purchase_pct_target 85.00,
          compliance_basis DOLLAR_WEIGHTED, allow_out_of_market false, Product
          stock_status IN_STOCK, is_market_indexed false, Manufacturer
          bill_back_terms_days 45 and ContractTier counts_as_contracted true.
        test_recipe:
          setup:
            - "Empty database; every create below omits all optional keys."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
          trigger:
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300 }
              as: SystemAdmin
              captures: { prod_id: $.data.id, stock: $.data.stock_status }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0 }
              as: NationalAccountManager
              captures: { tier_id: $.data.id, counts: $.data.counts_as_contracted }
          assert:
            - "Contract.${ct_id}.notice_period_days == 30"
            - "Contract.${ct_id}.contracted_purchase_pct_target == 85.00"
            - "Contract.${ct_id}.compliance_basis == DOLLAR_WEIGHTED"
            - "Contract.${ct_id}.allow_out_of_market == false"
            - "${stock} == IN_STOCK"
            - "Product.${prod_id}.is_market_indexed == false"
            - "Product.${prod_id}.substitution_group_code == null"
            - "Product.${prod_id}.cost_effective_at == null"
            - "Manufacturer.${mfg_id}.bill_back_terms_days == 45"
            - "Manufacturer.${mfg_id}.status == ACTIVE"
            - "${counts} == true"
            - "ContractTier.${tier_id}.max_case_volume == null"


      - claim_type: System Fields
        name: system_fields_are_server_minted_and_version_starts_at_one
        grounds:
          - entities.Contract
          - entities.OrderLine
          - complexity_profile.complexity_layers.optimistic_concurrency
        distinguishing_aspect: |
          id, created_at, updated_at and version are minted by the server on every
          common_fields entity: version is exactly 1 immediately after create and
          exactly 2 after the first mutating action, and no create endpoint declares any
          of the four as an input.
        test_recipe:
          setup:
            - "One operator, one manufacturer and one contract draft."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300 }
              as: SystemAdmin
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id, ver_after_create: $.data.version, created: $.data.created_at }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
          trigger:
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
              captures: { ver_after_action: $.data.version, updated: $.data.updated_at }
          assert:
            - "${ver_after_create} == 1"
            - "${ver_after_action} == 2"
            - "${created} == 2026-08-01T00:00:00Z (the default logical clock)"
            - "${updated} == 2026-08-01T00:00:00Z and updated_at is refreshed by the action"
            - "no create endpoint in the endpoint table declares id, created_at, updated_at or version as an input"


      - claim_type: Computed Fields
        name: order_line_pricing_fields_are_computed_not_accepted
        grounds:
          - entities.OrderLine.fields.list_unit_price_cents
          - entities.OrderLine.fields.extended_price_cents
          - entities.OrderLine.fields.is_contracted_item
          - endpoints["POST /nac/order-lines"]
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          POST /nac/order-lines declares only four inputs, so a client that tries to
          dictate list_unit_price_cents is rejected with ERR_INVALID_REQUEST rather than
          silently overriding the tier calculation.
        test_recipe:
          setup:
            - "Signed ACTIVE contract HLG-2026 with an unbounded PROTEIN LAST_COST PERCENT_OF_COST 12.50 tier, an IN_MARKET coverage and an OPEN rebate period; product P-CHKN at last_cost 4200; clock at 2026-08-05."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/distribution-centers"
              payload: { dc_code: "DC-SEA", name: "Seattle DC", in_market_state_codes: ["WA", "OR"], out_of_market_fee_per_case_cents: 275 }
              as: SystemAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /nac/products"
              payload: { sku: "P-CHKN", description: "Chicken Breast 4/10#", product_class_code: "PROTEIN", manufacturer_id: "${mfg_id}", pack_size: 4, last_cost_cents: 4200, avg_cost_cents: 4100, replacement_cost_cents: 4300 }
              as: SystemAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0 }
              as: NationalAccountManager
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "${dc_id}", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/submit-for-signature"
              payload: {}
              as: NationalAccountManager
            - call: "POST /nac/contracts/${ct_id}/sign"
              payload: {}
              as: OperatorBuyer
              as_user_id: "${op_id}"
            - call: "POST /nac/rebate-periods"
              payload: { contract_id: "${ct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: RebateAccountant
            - call: "POST /nac/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 10, list_unit_price_cents: 1 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /nac/order-lines"
              payload: { contract_id: "${ct_id}", product_id: "${prod_id}", distribution_center_id: "${dc_id}", quantity_cases: 10 }
              as: OperatorBuyer
              as_user_id: "${op_id}"
              captures: { ln_id: $.data.id }
          assert:
            - "the first trigger call returns HTTP 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "OrderLine.${ln_id}.list_unit_price_cents == 4725 (computed, never 1)"
            - "OrderLine.${ln_id}.cost_basis_snapshot_cents == 4200"
            - "OrderLine.${ln_id}.extended_price_cents == 47250"
            - "OrderLine.${ln_id}.is_contracted_item == true"
            - "OrderLine.${ln_id}.order_date == 2026-08-05T00:00:00Z"
            - "OrderLine.${ln_id}.pricing_status == DRAFT_PRICED"


      - claim_type: Required Fields
        name: missing_required_inputs_are_rejected_before_any_write
        grounds:
          - endpoints["POST /nac/contracts"]
          - endpoints["POST /nac/contract-tiers"]
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Each create endpoint's non-optional inputs are genuinely required: omitting
          Contract.contract_code and omitting ContractTier.min_case_volume both return
          ERR_INVALID_REQUEST with HTTP 400 and persist nothing.
        test_recipe:
          setup:
            - "One operator, one manufacturer and one contract draft exist so the tier attempt has a valid parent."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
          trigger:
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { err_contract: $.data.error_id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50 }
              as: NationalAccountManager
              captures: { err_tier: $.data.error_id }
          assert:
            - "the first trigger call returns HTTP 400 and ${err_contract} == ERR_INVALID_REQUEST"
            - "the second trigger call returns HTTP 400 and ${err_tier} == ERR_INVALID_REQUEST"
            - "GET /nac/contracts?operator_id=${op_id} still returns exactly 1 row"
            - "GET /nac/contract-tiers?contract_id=${ct_id} returns 0 rows"


      - claim_type: Type Constraints
        name: enum_and_range_constraints_rejected_on_input
        grounds:
          - entities.Product.fields.product_class_code
          - entities.ContractTier.fields.max_case_volume
          - entities.Contract.fields.effective_to
          - entities.Manufacturer.fields.manufacturer_code
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Declared constraints are enforced, not merely documented: an out-of-enum
          product_class_code, a tier whose max_case_volume is not strictly greater than
          min_case_volume, and a contract whose effective_to precedes effective_from all
          return ERR_INVALID_REQUEST with HTTP 400.
        test_recipe:
          setup:
            - "One operator, one manufacturer and one contract draft exist."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
          trigger:
            - call: "POST /nac/products"
              payload: { sku: "P-BAD", description: "Bad class", product_class_code: "CUTLERY", manufacturer_id: "${mfg_id}", pack_size: 1, last_cost_cents: 100, avg_cost_cents: 100, replacement_cost_cents: 100 }
              as: SystemAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "${ct_id}", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 500, max_case_volume: 500 }
              as: NationalAccountManager
              captures: { err_band: $.data.error_id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-BACKWARDS", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2027-08-01T00:00:00Z", effective_to: "2026-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { err_term: $.data.error_id }
          assert:
            - "${err_enum} == ERR_INVALID_REQUEST with HTTP 400"
            - "${err_band} == ERR_INVALID_REQUEST with HTTP 400 because max_case_volume must be strictly greater than min_case_volume"
            - "${err_term} == ERR_INVALID_REQUEST with HTTP 400 because effective_to must be after effective_from"
            - "GET /nac/products returns 0 rows and GET /nac/contract-tiers?contract_id=${ct_id} returns 0 rows"


      - claim_type: Not Found
        name: unknown_ids_return_entity_specific_not_found_codes
        grounds:
          - validations[priority=3]
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_ORDER_LINE_NOT_FOUND
          - errors.ERR_DEVIATION_NOT_FOUND
          - errors.ERR_PRODUCT_NOT_FOUND
          - errors.ERR_REBATE_PERIOD_NOT_FOUND
        distinguishing_aspect: |
          Each single-resource read maps a non-existent id to its own 404 code rather
          than a generic one, and path parameters are resolved before body foreign keys
          so a request with two bad ids reports the path one.
        test_recipe:
          setup:
            - "Empty database except for one operator and one manufacturer, so no target row can accidentally exist."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
          trigger:
            - call: "GET /nac/contracts/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: NationalAccountManager
              captures: { err_contract: $.data.error_id }
            - call: "GET /nac/order-lines/22222222-2222-2222-2222-222222222222"
              payload: {}
              as: NationalAccountManager
              captures: { err_line: $.data.error_id }
            - call: "GET /nac/deviation-agreements/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: PricingAnalyst
              captures: { err_dev: $.data.error_id }
            - call: "GET /nac/products/44444444-4444-4444-4444-444444444444"
              payload: {}
              as: SystemAdmin
              captures: { err_prod: $.data.error_id }
            - call: "GET /nac/rebate-periods/55555555-5555-5555-5555-555555555555"
              payload: {}
              as: RebateAccountant
              captures: { err_period: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 404 with success false and a null data payload apart from the error envelope"
            - "${err_contract} == ERR_CONTRACT_NOT_FOUND"
            - "${err_line} == ERR_ORDER_LINE_NOT_FOUND"
            - "${err_dev} == ERR_DEVIATION_NOT_FOUND"
            - "${err_prod} == ERR_PRODUCT_NOT_FOUND"
            - "${err_period} == ERR_REBATE_PERIOD_NOT_FOUND"


      - claim_type: Parent Relationships
        name: child_creates_require_a_resolvable_parent_contract
        grounds:
          - validations[priority=3]
          - entities.ContractTier.fields.contract_id
          - entities.DcCoverage.fields.contract_id
          - errors.ERR_CONTRACT_NOT_FOUND
          - errors.ERR_DISTRIBUTION_CENTER_NOT_FOUND
        distinguishing_aspect: |
          Body foreign keys are resolved in declaration order, so a tier naming an
          unknown contract fails with ERR_CONTRACT_NOT_FOUND while a coverage naming a
          real contract but an unknown DC fails with ERR_DISTRIBUTION_CENTER_NOT_FOUND.
        test_recipe:
          setup:
            - "One operator, one manufacturer and one DRAFT contract exist; no distribution centers exist."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/contracts"
              payload: { operator_id: "${op_id}", contract_code: "HLG-2026", rebate_funding_manufacturer_id: "${mfg_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { ct_id: $.data.id }
          trigger:
            - call: "POST /nac/contract-tiers"
              payload: { contract_id: "66666666-6666-6666-6666-666666666666", product_class_code: "PROTEIN", cost_basis: "LAST_COST", markup_type: "PERCENT_OF_COST", markup_value: 12.50, min_case_volume: 0 }
              as: NationalAccountManager
              captures: { err_parent: $.data.error_id }
            - call: "POST /nac/dc-coverages"
              payload: { contract_id: "${ct_id}", distribution_center_id: "77777777-7777-7777-7777-777777777777", coverage_type: "IN_MARKET", coverage_from: "2026-08-01T00:00:00Z", coverage_to: "2027-07-31T23:59:59Z" }
              as: NationalAccountManager
              captures: { err_dc: $.data.error_id }
          assert:
            - "${err_parent} == ERR_CONTRACT_NOT_FOUND with HTTP 404"
            - "${err_dc} == ERR_DISTRIBUTION_CENTER_NOT_FOUND with HTTP 404"
            - "GET /nac/contract-tiers?contract_id=${ct_id} returns 0 rows"
            - "GET /nac/dc-coverages?contract_id=${ct_id} returns 0 rows"


      - claim_type: Retrieval
        name: single_reads_return_exactly_what_was_stored
        grounds:
          - endpoints["GET /nac/products/{product_id}"]
          - endpoints["GET /nac/contract-tiers/{contract_tier_id}"]
          - entities.Product
          - entities.ContractTier
        distinguishing_aspect: |
          A single-resource GET echoes the stored row field for field, including the
          three cost bases and the index baseline, without recomputing anything.
        test_recipe:
          setup:
            - "One manufacturer, one market-indexed product and one contract with a tier."
          setup_api_calls:
            - call: "POST /nac/operators"
              payload: { legal_name: "Harborline Grill Group", operator_code: "HLG" }
              as: SystemAdmin
              captures: { op_id: $.data.id }
            - call: "POST /nac/manufacturers"
              payload: { name: "Cascadia Poultry Co", manufacturer_code: "CPC" }
              as: SystemAdmin
              captures: { mfg_id: $.data.id }
            - call: "POST /nac/products"
