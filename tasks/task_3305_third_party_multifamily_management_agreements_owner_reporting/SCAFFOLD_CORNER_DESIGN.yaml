# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index for Non-Difficulty Tests
# task_3305_third_party_multifamily_management_agreements_owner_reporting
# Breadth walk of the claim-extraction guide against §1.1–§1.7.
# Sections: entities / state_machines / calculations / validations /
#           endpoints / errors / rbac / cross_cutting / consistency
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: owner_creation_applies_defaults_and_system_fields
        claim_type: creation_with_defaults
        grounds:
          - entities.Owner.fields.distribution_day_of_month
          - entities.Owner.fields.status
        distinguishing_aspect: "Omitting distribution_day_of_month applies the default 10; server-minted id/created_at/version are system-generated and client-supplied values for them are ignored."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Default Owner LP" }
              as: PortfolioManager
              captures: { oc_id: $.data.id, oc_day: $.data.distribution_day_of_month, oc_status: $.data.status, oc_v: $.data.version }
          trigger:
            - call: "GET /mgmt/owners/${oc_id}"
              payload: {}
              as: PropertyAccountant
              captures: { oc_get_day: $.data.distribution_day_of_month }
          assert:
            - "Owner.${oc_id}.distribution_day_of_month == 10 (default applied)"
            - "Owner.${oc_id}.status == ACTIVE (system initial)"
            - "Owner.${oc_id}.version == 1"

      - name: owner_creation_rejects_missing_required_legal_name
        claim_type: required_field_validation
        grounds:
          - entities.Owner.fields.legal_name
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /mgmt/owners without legal_name is rejected with ERR_INVALID_REQUEST (400) before any persistence."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /mgmt/owners"
              payload: { distribution_day_of_month: 12 }
              as: PortfolioManager
              captures: { err_oc: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: list_endpoints_paginate_with_default_limit_and_total_count
        claim_type: pagination_defaults
        grounds:
          - response_envelope.pagination_defaults
          - endpoints["GET /mgmt/properties"]
        distinguishing_aspect: "With 12 properties and no explicit limit, GET /mgmt/properties returns exactly 10 rows (default limit), total_count == 12, has_more == true; offset=10 returns the remaining 2 with has_more == false."
        test_recipe:
          setup:
            - "Owner OP; twelve properties P1..P12 created under OP"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Page Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { op_id: $.data.id }
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P01", unit_count: 10 }
              as: PortfolioManager
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P02", unit_count: 10 }
              as: PortfolioManager
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P03", unit_count: 10 }
              as: PortfolioManager
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P04", unit_count: 10 }
              as: PortfolioManager
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P05", unit_count: 10 }
              as: PortfolioManager
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P06", unit_count: 10 }
              as: PortfolioManager
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P07", unit_count: 10 }
              as: PortfolioManager
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P08", unit_count: 10 }
              as: PortfolioManager
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P09", unit_count: 10 }
              as: PortfolioManager
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P10", unit_count: 10 }
              as: PortfolioManager
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P11", unit_count: 10 }
              as: PortfolioManager
            - call: "POST /mgmt/owners/${op_id}/properties"
              payload: { name: "P12", unit_count: 10 }
              as: PortfolioManager
          trigger:
            - call: "GET /mgmt/properties"
              payload: {}
              as: PortfolioManager
          assert:
            - "First page: response_type == array, data length == 10, pagination total_count == 12, has_more == true"
            - "GET /mgmt/properties?offset=10 returns data length == 2 and has_more == false"

      - name: get_nonexistent_property_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /mgmt/properties/{random-uuid} yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /mgmt/properties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PortfolioManager
              captures: { err_nf: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

      - name: claim_settlement_has_no_update_endpoint_immutable
        claim_type: immutability
        grounds:
          - entities.ClaimSettlement
        distinguishing_aspect: "ClaimSettlement (common_fields: false) carries id and created_at only, exposes no version field, and the API offers no PUT/PATCH/DELETE over it — it is append-only via claim settle."
        test_recipe:
          setup:
            - "Owner OI; Agreement AGI ACTIVE; Property PI MANAGED (zero-balance onboarding, one resident); Claim CI (OWNER-indemnified, reserve 0, in-term incident) UNDER_REVIEW then SETTLED for 1000000"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Imm Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { oi_id: $.data.id }
            - call: "POST /mgmt/owners/${oi_id}/properties"
              payload: { name: "Imm Property", unit_count: 20 }
              as: PortfolioManager
              captures: { pi_id: $.data.id }
            - call: "POST /mgmt/owners/${oi_id}/agreements"
              payload: { property_id: "${pi_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-08-01T00:00:00Z", term_end_date: "2027-07-31T00:00:00Z" }
              as: PortfolioManager
              captures: { agi_id: $.data.id, agi_v: $.data.version }
            - call: "POST /mgmt/agreements/${agi_id}/activate"
              payload: { expected_agreement_version: "${agi_v}" }
              as: PortfolioManager
            - call: "POST /mgmt/properties/${pi_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-08-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { obi_id: $.data.id }
            - call: "POST /mgmt/properties/${pi_id}/residents"
              payload: { unit_label: "I1", full_name: "Res I", lease_end_date: "2027-07-31T00:00:00Z" }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obi_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obi_id}/import_ledger"
              payload: { deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obi_id}/begin_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obi_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obi_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /mgmt/properties/${pi_id}/claims"
              payload: { claim_type: RESIDENT_INCIDENT, reserved_amount_cents: 0, indemnified_by: OWNER, incident_date: "2026-09-03T00:00:00Z" }
              as: RiskOfficer
              captures: { ci_id: $.data.id }
            - call: "POST /mgmt/claims/${ci_id}/begin_review"
              payload: {}
              as: RiskOfficer
              captures: { ci_v: $.data.version }
          trigger:
            - call: "POST /mgmt/claims/${ci_id}/settle"
              payload: { amount_cents: 1000000, expected_claim_version: "${ci_v}" }
              as: RiskOfficer
            - call: "GET /mgmt/claims/${ci_id}/settlements"
              payload: {}
              as: RiskOfficer
          assert:
            - "GET settlements returns an array of length 1 with amount_cents == 1000000, manager_share_cents == 0, owner_share_cents == 1000000"
            - "Settlement row exposes id and created_at and no version field (common_fields: false)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminate_from_draft_is_invalid_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.ManagementAgreement
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "terminate is only defined from ACTIVE; calling it on a DRAFT agreement returns ERR_INVALID_STATE_TRANSITION and leaves status DRAFT with termination_fee_tail_cents == 0."
        test_recipe:
          setup:
            - "Owner OT ACTIVE; Property PT; Agreement AGT created and left DRAFT"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Term Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { ot_id: $.data.id }
            - call: "POST /mgmt/owners/${ot_id}/properties"
              payload: { name: "Term Property", unit_count: 25 }
              as: PortfolioManager
              captures: { pt_id: $.data.id }
            - call: "POST /mgmt/owners/${ot_id}/agreements"
              payload: { property_id: "${pt_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-08-01T00:00:00Z", term_end_date: "2027-07-31T00:00:00Z" }
              as: PortfolioManager
              captures: { agt_id: $.data.id }
          trigger:
            - call: "POST /mgmt/agreements/${agt_id}/terminate"
              payload: { terminated_reason: CONVENIENCE }
              as: OwnerRep
              as_user_id: "${ot_id}"
              captures: { err_t: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "GET /mgmt/agreements/${agt_id} still shows status == DRAFT and termination_fee_tail_cents == 0"

      - name: terminated_agreement_is_terminal_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ManagementAgreement
        distinguishing_aspect: "After complete_termination lands (TERMINATED), suspend, resume, terminate, and activate are all rejected with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup:
            - "Owner OX; Agreement AGX ACTIVE; Property PX MANAGED via ACTIVATED onboarding (zero balances, one resident); one CLOSED statement S0 for 2026-09 (min-fee month) so fee_tail computes; tail invoiced via EXPENSE ledger entry equal to the computed tail; no open claims"
            - "AGX terminated (CAUSE — tail == 0, so no tail invoice precondition), then complete_termination -> TERMINATED"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Lock Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { ox_id: $.data.id }
            - call: "POST /mgmt/owners/${ox_id}/properties"
              payload: { name: "Lock Property", unit_count: 25 }
              as: PortfolioManager
              captures: { px_id: $.data.id }
            - call: "POST /mgmt/owners/${ox_id}/agreements"
              payload: { property_id: "${px_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-08-01T00:00:00Z", term_end_date: "2027-07-31T00:00:00Z" }
              as: PortfolioManager
              captures: { agx_id: $.data.id, agx_v: $.data.version }
            - call: "POST /mgmt/agreements/${agx_id}/activate"
              payload: { expected_agreement_version: "${agx_v}" }
              as: PortfolioManager
            - call: "POST /mgmt/properties/${px_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-08-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { obx_id: $.data.id }
            - call: "POST /mgmt/properties/${px_id}/residents"
              payload: { unit_label: "X1", full_name: "Res X", lease_end_date: "2027-07-31T00:00:00Z" }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obx_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obx_id}/import_ledger"
              payload: { deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obx_id}/begin_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obx_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obx_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /mgmt/agreements/${agx_id}/terminate"
              payload: { terminated_reason: CAUSE }
              as: OwnerRep
              as_user_id: "${ox_id}"
            - call: "POST /mgmt/agreements/${agx_id}/complete_termination"
              payload: {}
              as: PortfolioManager
          trigger:
            - call: "POST /mgmt/agreements/${agx_id}/suspend"
              payload: {}
              as: PortfolioManager
              captures: { err_x1: $.data.error_id }
            - call: "POST /mgmt/agreements/${agx_id}/resume"
              payload: {}
              as: PortfolioManager
              captures: { err_x2: $.data.error_id }
            - call: "POST /mgmt/agreements/${agx_id}/terminate"
              payload: { terminated_reason: CAUSE }
              as: OwnerRep
              as_user_id: "${ox_id}"
              captures: { err_x3: $.data.error_id }
          assert:
            - "All three calls return error_id == ERR_INVALID_STATE_TRANSITION"
            - "GET /mgmt/agreements/${agx_id} shows status == TERMINATED"

      - name: double_submit_of_budget_is_not_idempotent
        claim_type: idempotency
        grounds:
          - state_machines.Budget.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Submitting an already-SUBMITTED budget is a second triggering of a consumed transition and returns ERR_INVALID_STATE_TRANSITION; the system does not silently treat it as idempotent success."
        test_recipe:
          setup:
            - "Owner OD; Agreement AGD ACTIVE; Property PD MANAGED (zero-balance onboarding, one resident); DRAFT budget BD submitted once"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Idem Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { od_id: $.data.id }
            - call: "POST /mgmt/owners/${od_id}/properties"
              payload: { name: "Idem Property", unit_count: 25 }
              as: PortfolioManager
              captures: { pd_id: $.data.id }
            - call: "POST /mgmt/owners/${od_id}/agreements"
              payload: { property_id: "${pd_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-08-01T00:00:00Z", term_end_date: "2027-07-31T00:00:00Z" }
              as: PortfolioManager
              captures: { agd_id: $.data.id, agd_v: $.data.version }
            - call: "POST /mgmt/agreements/${agd_id}/activate"
              payload: { expected_agreement_version: "${agd_v}" }
              as: PortfolioManager
            - call: "POST /mgmt/properties/${pd_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-08-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { obd_id: $.data.id }
            - call: "POST /mgmt/properties/${pd_id}/residents"
              payload: { unit_label: "D1", full_name: "Res D", lease_end_date: "2027-07-31T00:00:00Z" }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obd_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obd_id}/import_ledger"
              payload: { deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obd_id}/begin_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obd_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obd_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /mgmt/budgets"
              payload: { property_id: "${pd_id}", fiscal_year: 2027, kind: ANNUAL, operating_revenue_cents: 4000000, operating_expense_cents: 2500000, capex_total_cents: 100000 }
              as: PropertyAccountant
              captures: { bd_id: $.data.id }
            - call: "POST /mgmt/budgets/${bd_id}/submit"
              payload: {}
              as: PropertyAccountant
          trigger:
            - call: "POST /mgmt/budgets/${bd_id}/submit"
              payload: {}
              as: PropertyAccountant
              captures: { err_d: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "GET /mgmt/budgets/${bd_id} shows status == SUBMITTED (unchanged)"

      - name: onboarding_guarded_transition_requires_resident_data
        claim_type: precondition_enforcement
        grounds:
          - state_machines.OnboardingTransition.INTAKE_to_DATA_VERIFIED
          - errors[ERR_NO_RESIDENT_DATA]
        distinguishing_aspect: "verify_resident_data on an onboarding whose property has zero Resident rows is rejected with ERR_NO_RESIDENT_DATA; adding one resident makes the identical call succeed."
        test_recipe:
          setup:
            - "Owner OG; Property PG with onboarding OBG at INTAKE; no residents"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Guard Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { og_id: $.data.id }
            - call: "POST /mgmt/owners/${og_id}/properties"
              payload: { name: "Guard Property", unit_count: 15 }
              as: PortfolioManager
              captures: { pg_id: $.data.id }
            - call: "POST /mgmt/properties/${pg_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-09-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { obg_id: $.data.id }
          trigger:
            - call: "POST /mgmt/onboardings/${obg_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
              captures: { err_g: $.data.error_id }
            - call: "POST /mgmt/properties/${pg_id}/residents"
              payload: { unit_label: "G1", full_name: "Res G", lease_end_date: "2027-08-31T00:00:00Z" }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obg_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
              captures: { obg_status: $.data.status }
          assert:
            - "First verify returns error_id == ERR_NO_RESIDENT_DATA"
            - "After creating one resident, verify succeeds and OnboardingTransition.${obg_id}.status == DATA_VERIFIED"

      - name: expired_agreement_auto_transition_at_advance_month
        claim_type: automatic_system_transition
        grounds:
          - state_machines.ManagementAgreement.ACTIVE_to_EXPIRED
          - calculations.fee_tail
        distinguishing_aspect: "An ACTIVE agreement whose term_end_date has passed flips to EXPIRED at the next advance_month with termination_fee_tail_cents == 0 (EXPIRY accrues no tail), and the property posture returns to UNMANAGED."
        test_recipe:
          setup:
            - "Owner OE; Agreement AGE ACTIVE with term_end_date 2026-09-30; Property PE MANAGED (zero-balance onboarding, one resident); logical clock advanced to 2026-10-01"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Expiry Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { oe_id: $.data.id }
            - call: "POST /mgmt/owners/${oe_id}/properties"
              payload: { name: "Expiry Property", unit_count: 15 }
              as: PortfolioManager
              captures: { pe_id: $.data.id }
            - call: "POST /mgmt/owners/${oe_id}/agreements"
              payload: { property_id: "${pe_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-01-01T00:00:00Z", term_end_date: "2026-09-30T00:00:00Z" }
              as: PortfolioManager
              captures: { age_id: $.data.id, age_v: $.data.version }
            - call: "POST /mgmt/agreements/${age_id}/activate"
              payload: { expected_agreement_version: "${age_v}" }
              as: PortfolioManager
            - call: "POST /mgmt/properties/${pe_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-01-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { obe_id: $.data.id }
            - call: "POST /mgmt/properties/${pe_id}/residents"
              payload: { unit_label: "E1", full_name: "Res E", lease_end_date: "2026-12-31T00:00:00Z" }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obe_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obe_id}/import_ledger"
              payload: { deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obe_id}/begin_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obe_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${obe_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /mgmt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PortfolioManager
          trigger:
            - call: "POST /mgmt/advance_month"
              payload: {}
              as: PortfolioManager
            - call: "GET /mgmt/agreements/${age_id}"
              payload: {}
              as: PortfolioManager
              captures: { age_status: $.data.status, age_tail: $.data.termination_fee_tail_cents }
            - call: "GET /mgmt/properties/${pe_id}"
              payload: {}
              as: PortfolioManager
              captures: { pe_posture: $.data.management_posture }
          assert:
            - "ManagementAgreement.${age_id}.status == EXPIRED"
            - "ManagementAgreement.${age_id}.termination_fee_tail_cents == 0 (EXPIRY accrues no tail)"
            - "Property.${pe_id}.management_posture == UNMANAGED"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: minimum_fee_floor_binds_below_threshold
        claim_type: correct_result
        grounds:
          - calculations.management_fee_invoice
