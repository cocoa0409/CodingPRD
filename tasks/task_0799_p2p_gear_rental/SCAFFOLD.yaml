scenario: "Peer-to-Peer Equipment & Gear Rental (Fat Llama style): owner listing & availability/value, rental request & ID/deposit verification, dynamic/daily pricing, pickup/return & condition photos, damage/loss claim & coverage, owner payout & fee, late/extension, rating/trust"
domain_name: "p2p-gear-rental"
api_prefix: ""

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (User, Listing, Booking, Deposit, Claim,
  # Payout, HandoffAppointment, ConditionReport, Rating, VerificationRecord). No
  # deep URL nesting: children carry FK fields and are reached via filtered lists
  # or single-segment sub-resource GETs, never `/a/{id}/b/{id}/c/{id}` chains.

  state_machine_shape: cyclic
  # Booking cycles ACTIVE -> EXTENSION_REQUESTED -> ACTIVE (extension rounds);
  # Claim branches OPEN -> UNDER_REVIEW -> {APPROVED, PARTIALLY_APPROVED, DENIED}
  # with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # User 1:N Listing; Listing 1:N Booking; Booking 1:N Claim
    - cross_aggregate      # Payout release gated on Claim state; Booking approve gated on Listing state

  role_model: peer_roles
  # Owner owns Listings and drives approve/pickup/return/claim; Renter owns Bookings
  # and drives request/cancel/extend; Platform is an opaque operator (verification
  # decisions, claim review/resolve, payout release, clock/ops).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: User
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - name: email
        type: string
        source: input
        description: "Login/contact email; unique across users."
        constraints: "unique; non-empty"
      - name: full_name
        type: string
        source: input
        description: "Legal name of the person."
      - name: phone
        type: string
        source: input
        description: "Contact phone."
      - name: verification_status
        type: enum
        source: computed
        default: UNVERIFIED
        description: "Derived from the latest VerificationRecord for this user."
        constraints: "one of {UNVERIFIED, PENDING, VERIFIED, REJECTED}"
      - name: trust_score
        type: integer
        source: computed
        default: 300
        description: "Trust/reputation score in [0,500]; see calculations.trust_score. Recomputed on rating create, late-return detection, and upheld claim."
        constraints: "0..500"
      - name: avg_rating
        type: number
        source: computed
        default: null
        description: "Mean of Rating.score where ratee_id == this user; null when rating_count == 0."
      - name: rating_count
        type: integer
        source: computed
        default: 0
        description: "Count of Rating rows where ratee_id == this user."
      - name: late_return_count
        type: integer
        source: computed
        default: 0
        description: "Number of Bookings where this user was renter and the booking entered LATE."
      - name: upheld_claim_count
        type: integer
        source: computed
        default: 0
        description: "Number of Claims resolved APPROVED or PARTIALLY_APPROVED against a booking where this user was renter."
      - name: total_earnings_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Payout.net_payout_cents for RELEASED payouts where owner_id == this user."

  - name: VerificationRecord
    parent: null
    common_fields: true
    fields:
      - name: user_id
        type: string
        source: input
        description: "FK -> User.id; the user whose identity/deposit-capability is being verified."
      - name: document_type
        type: enum
        source: input
        description: "Government ID type submitted."
        constraints: "one of {PASSPORT, DRIVERS_LICENSE, NATIONAL_ID}"
      - name: document_ref
        type: string
        source: input
        description: "Opaque reference to the uploaded document."
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: "Verification lifecycle; see state_machines.VerificationRecord."
        constraints: "one of {PENDING, APPROVED, REJECTED}"
      - name: valid_from
        type: datetime
        source: computed
        default: null
        description: "Set to the logical clock at APPROVED; ISO 8601 UTC."
      - name: valid_until
        type: datetime
        source: computed
        default: null
        description: "valid_from + VERIFICATION_VALIDITY_DAYS at APPROVED; ISO 8601 UTC."
      - name: reject_reason
        type: string
        source: input
        default: null
        description: "Reason supplied by Platform when rejecting; required on reject decision only."
      - name: decided_by
        type: string
        source: system
        default: null
        description: "Opaque Platform operator id (X-User-ID) that approved/rejected."

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> User.id; the owner who lists and controls this item."
      - name: title
        type: string
        source: input
        description: "Human-readable item name."
      - name: category
        type: string
        source: input
        description: "Free-text category (e.g. camera, drone, power-tool)."
      - name: declared_value_cents
        type: integer
        source: input
        description: "Owner-declared replacement value; caps total coverage on a LOSS claim."
        constraints: ">0"
      - name: base_daily_rate_cents
        type: integer
        source: input
        description: "Base price per rental day before demand multiplier, weekend surcharge, and duration discount."
        constraints: ">0"
      - name: deposit_cents
        type: integer
        source: input
        description: "Fixed security deposit held per booking against this listing."
        constraints: ">=0"
      - name: quantity
        type: integer
        source: input
        default: 1
        description: "Number of identical units available; caps concurrent overlapping bookings."
        constraints: ">=1"
      - name: demand_multiplier_bps
        type: integer
        source: input
        default: 10000
        description: "Dynamic demand multiplier in basis points applied to every rental day (10000 = 1.0x baseline)."
        constraints: ">=5000 and <=30000"
      - name: status
        type: enum
        source: computed
        default: DRAFT
        description: "Listing lifecycle; see state_machines.Listing."
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED}"
      - name: active_booking_count
        type: integer
        source: computed
        default: 0
        description: "Count of Bookings on this listing whose status is in {REQUESTED, APPROVED, ACTIVE, EXTENSION_REQUESTED, LATE}."

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: listing_id
        type: string
        source: input
        description: "FK -> Listing.id; the gear item being rented."
      - name: renter_id
        type: string
        source: input
        description: "FK -> User.id; the acting renter (equals X-User-ID of the Renter who created it)."
      - name: start_date
        type: datetime
        source: input
        description: "Rental window start (inclusive), ISO 8601 UTC. Window is half-open [start_date, end_date)."
      - name: end_date
        type: datetime
        source: input
        description: "Rental window end (exclusive), ISO 8601 UTC. billable_days = whole days between start_date and end_date."
        constraints: "must be strictly after start_date"
      - name: expected_listing_version
        type: integer
        source: input
        description: "OCC token: the Listing.version the renter quoted against; rejected if the listing has advanced."
      - name: status
        type: enum
        source: computed
        default: REQUESTED
        description: "Booking lifecycle; see state_machines.Booking."
        constraints: "one of {REQUESTED, APPROVED, DECLINED, CANCELLED, ACTIVE, EXTENSION_REQUESTED, RETURNED, LATE, COMPLETED}"
      - name: billable_days
        type: integer
        source: computed
        description: "Whole days in the current [start_date, end_date) window; recomputed on approved extension."
      - name: rental_subtotal_cents
        type: integer
        source: computed
        description: "Sum of per-day charges (see calculations.dynamic_daily_pricing); recomputed on approved extension and at return."
      - name: renter_service_fee_cents
        type: integer
        source: computed
        description: "round_half_up(rental_subtotal_cents * RENTER_SERVICE_FEE_BPS / 10000)."
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "rental_subtotal_cents + renter_service_fee_cents computed at request time (calculations.booking_settlement_charge, PROVISIONAL variant)."
      - name: final_total_cents
        type: integer
        source: computed
        default: null
        description: "Finalized charge at return (calculations.booking_settlement_charge, FINAL variant): rental_subtotal_cents + renter_service_fee_cents + late_fee_cents."
      - name: late_days
        type: integer
        source: computed
        default: 0
        description: "Whole days the return is past end_date at LATE detection."
      - name: late_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Accrued late penalty (calculations.late_fee_accrual)."
      - name: extension_requested_end_date
        type: datetime
        source: computed
        default: null
        description: "Proposed new end_date while status == EXTENSION_REQUESTED; cleared on decision."
      - name: actual_return_at
        type: datetime
        source: computed
        default: null
        description: "Logical clock at the RETURN transition."

  - name: HandoffAppointment
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this pickup/return handoff belongs to."
      - name: owner_id
        type: string
        source: input
        description: "FK -> User.id; the owner whose calendar this appointment occupies."
      - name: type
        type: enum
        source: input
        description: "Whether this is the pickup or the return handoff."
        constraints: "one of {PICKUP, RETURN}"
      - name: slot_start
        type: datetime
        source: input
        description: "Appointment start (inclusive), ISO 8601 UTC. Occupies [slot_start, slot_end] with a mandatory buffer on the owner's calendar."
      - name: slot_end
        type: datetime
        source: input
        description: "Appointment end (inclusive), ISO 8601 UTC."
        constraints: "must be strictly after slot_start"
      - name: status
        type: enum
        source: computed
        default: SCHEDULED
        description: "Handoff lifecycle; see state_machines.HandoffAppointment."
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}"

  - name: ConditionReport
    parent: null
    common_fields: false          # append-only evidence: id + created_at only, no version
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this condition evidence documents."
      - name: phase
        type: enum
        source: input
        description: "Whether photos document the item at pickup or at return."
        constraints: "one of {PICKUP, RETURN}"
      - name: photo_urls
        type: array
        source: input
        description: "Non-empty list of photo URL strings evidencing item condition."
        constraints: "length >= 1"
      - name: recorded_by
        type: enum
        source: input
        description: "Which party recorded the evidence."
        constraints: "one of {OWNER, RENTER}"
      - name: notes
        type: string
        source: input
        default: null
        description: "Optional free-text condition notes."

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: system
        description: "FK -> Booking.id; the booking this security deposit secures. Created by cascade on booking APPROVE."
      - name: original_amount_cents
        type: integer
        source: computed
        description: "Snapshot of Listing.deposit_cents at APPROVE; the conserved total: held + captured + released == original_amount_cents at all times."
      - name: held_cents
        type: integer
        source: computed
        description: "Currently-held (uncaptured, unreleased) portion of the deposit."
      - name: captured_cents
        type: integer
        source: computed
        default: 0
        description: "Portion captured to compensate owner for adjudicated claims."
      - name: released_cents
        type: integer
        source: computed
        default: 0
        description: "Portion returned to the renter."
      - name: status
        type: enum
        source: computed
        default: HELD
        description: "Deposit lifecycle; see state_machines.Deposit."
        constraints: "one of {HELD, PARTIALLY_CAPTURED, CAPTURED, RELEASED}"

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the completed/returned booking this damage-or-loss claim concerns."
      - name: claim_type
        type: enum
        source: input
        description: "Damage (repairable) vs loss (item not returned)."
        constraints: "one of {DAMAGE, LOSS}"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Amount the owner claims for damage/loss."
        constraints: ">0"
      - name: description
        type: string
        source: input
        description: "Free-text description of the damage/loss."
      - name: status
        type: enum
        source: computed
        default: OPEN
        description: "Claim lifecycle; see state_machines.Claim."
        constraints: "one of {OPEN, UNDER_REVIEW, APPROVED, PARTIALLY_APPROVED, DENIED}"
      - name: provisional_capture_cents
        type: integer
        source: computed
        description: "Estimate at OPEN (calculations.deposit_settlement, PROVISIONAL): min(claimed_amount_cents, deposit.held_cents)."
      - name: approved_amount_cents
        type: integer
        source: computed
        default: null
        description: "Adjudicated award set at resolve: claimed_amount_cents for APPROVED, resolve payload amount for PARTIALLY_APPROVED, 0 for DENIED."
      - name: deposit_capture_cents
        type: integer
        source: computed
        default: 0
        description: "Final amount captured from the deposit (calculations.deposit_settlement, FINAL): min(approved_amount_cents, deposit.held_cents)."
      - name: coverage_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Platform coverage beyond the deposit: min(approved_amount_cents - deposit_capture_cents, declared_value_cents - deposit.original_amount_cents) floored at 0."
      - name: reviewed_by
        type: string
        source: system
        default: null
        description: "Opaque Platform operator id that moved the claim to UNDER_REVIEW."
      - name: resolved_by
        type: string
        source: system
        default: null
        description: "Opaque Platform operator id that resolved the claim."

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: system
        description: "FK -> Booking.id; the booking this owner payout settles. Created by cascade on booking RETURN."
      - name: owner_id
        type: string
        source: system
        description: "FK -> User.id; the owner receiving the payout."
      - name: gross_earnings_cents
        type: integer
        source: computed
        description: "Snapshot of Booking.rental_subtotal_cents at RETURN (renter service fee is retained by the platform, not paid to owner)."
      - name: owner_commission_cents
        type: integer
        source: computed
        description: "round_half_up(gross_earnings_cents * OWNER_COMMISSION_BPS / 10000)."
      - name: damage_reimbursement_cents
        type: integer
        source: computed
        default: 0
        description: "Sum over resolved claims on this booking of (deposit_capture_cents + coverage_paid_cents)."
      - name: net_payout_cents
        type: integer
        source: computed
        description: "gross_earnings_cents - owner_commission_cents + damage_reimbursement_cents (calculations.owner_payout)."
      - name: status
        type: enum
        source: computed
        default: PENDING
        description: "Payout lifecycle; see state_machines.Payout."
        constraints: "one of {PENDING, HELD, RELEASED}"

  - name: Rating
    parent: null
    common_fields: false          # append-only reputation event: id + created_at only
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the completed booking being rated."
      - name: rater_id
        type: string
        source: input
        description: "FK -> User.id; the user leaving the rating (equals X-User-ID)."
      - name: ratee_id
        type: string
        source: input
        description: "FK -> User.id; the user being rated."
      - name: direction
        type: enum
        source: input
        description: "Which side of the rental is rating the other."
        constraints: "one of {RENTER_TO_OWNER, OWNER_TO_RENTER}"
      - name: score
        type: integer
        source: input
        description: "Star rating."
        constraints: "1..5"
      - name: comment
        type: string
        source: input
        default: null
        description: "Optional free-text review."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Listing
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /listings/{id}/activate"
        actor: Owner
        preconditions:
          - "acting Owner owns the listing (X-User-ID == listing.owner_id)"
        side_effects:
          - "listing becomes bookable"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /listings/{id}/suspend"
        actor: Owner
        preconditions:
          - "acting Owner owns the listing"
        side_effects:
          - "new bookings blocked while SUSPENDED (existing bookings unaffected)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /listings/{id}/activate"
        actor: Owner
        preconditions:
          - "acting Owner owns the listing"
        side_effects:
          - "listing bookable again"
      - from: [DRAFT, ACTIVE, SUSPENDED]
        to: SAME
        trigger: "PATCH /listings/{id}"
        actor: Owner
        preconditions:
          - "acting Owner owns the listing"
          - "expected_listing_version == listing.version (OCC)"
        side_effects:
          - "mutable fields (base_daily_rate_cents, demand_multiplier_bps, declared_value_cents, deposit_cents, quantity) updated"
          - "increments Listing.version by 1"
        note: "Re-pricing/quantity edits are the write that makes a previously-fetched Listing.version stale for POST /bookings (see concurrency_rules.booking-create-stale-listing)."

  - entity: VerificationRecord
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /users/{id}/verifications"
        actor: Renter | Owner
        preconditions:
          - "acting user submits for self (X-User-ID == user_id)"
        side_effects:
          - "User.verification_status set to PENDING"
      - from: PENDING
        to: APPROVED
        trigger: "POST /verifications/{id}/decide (decision=APPROVE)"
        actor: Platform
        preconditions:
          - "record is PENDING"
        side_effects:
          - "valid_from set to logical clock; valid_until set to valid_from + VERIFICATION_VALIDITY_DAYS"
          - "User.verification_status set to VERIFIED"
          - "decided_by set to X-User-ID"
      - from: PENDING
        to: REJECTED
        trigger: "POST /verifications/{id}/decide (decision=REJECT)"
        actor: Platform
        preconditions:
          - "record is PENDING"
          - "reject_reason present"
        side_effects:
          - "User.verification_status set to REJECTED"
          - "decided_by set to X-User-ID"

  - entity: Booking
    initial_state: REQUESTED
    terminal_states: [DECLINED, CANCELLED, COMPLETED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /bookings"
        actor: Renter
        preconditions:
          - "listing exists and listing.status == ACTIVE (cross-entity: Booking depends on Listing state)"
          - "expected_listing_version == listing.version (OCC)"
          - "acting renter's User.verification_status == VERIFIED"
          - "end_date strictly after start_date"
          - "if listing.declared_value_cents > HIGH_VALUE_THRESHOLD_CENTS then renter.trust_score >= MIN_TRUST_FOR_HIGH_VALUE"
          - "count of overlapping bookings on listing in {REQUESTED,APPROVED,ACTIVE,EXTENSION_REQUESTED,LATE} over [start_date,end_date) < listing.quantity"
        side_effects:
          - "compute billable_days, rental_subtotal_cents, renter_service_fee_cents, provisional_total_cents (calculations.dynamic_daily_pricing + booking_settlement_charge PROVISIONAL)"
          - "increments Listing.active_booking_count by 1"
          - "increments Listing.version by 1"
        note: "Window is half-open [start_date,end_date); a booking ending exactly when another starts does NOT overlap (adjacency allowed)."
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /bookings/{id}/approve"
        actor: Owner
        preconditions:
          - "acting Owner owns the listing"
          - "booking is REQUESTED"
          - "listing.status == ACTIVE (cross-entity dependency on Listing)"
        side_effects:
          - "create Deposit{ original_amount_cents = listing.deposit_cents, held_cents = original_amount_cents, captured_cents = 0, released_cents = 0, status = HELD }"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /bookings/{id}/decline"
        actor: Owner
        preconditions:
          - "acting Owner owns the listing"
          - "booking is REQUESTED"
        side_effects:
          - "decrement Listing.active_booking_count by 1 (releases the held availability unit — compensating action for the create hold)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Renter
        preconditions:
          - "acting renter owns the booking (X-User-ID == booking.renter_id)"
          - "booking is REQUESTED"
        side_effects:
          - "decrement Listing.active_booking_count by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Renter
        preconditions:
          - "acting renter owns the booking"
          - "booking is APPROVED (not yet picked up)"
        side_effects:
          - "decrement Listing.active_booking_count by 1"
          - "Deposit: released_cents += held_cents; held_cents = 0; status = RELEASED (compensating action — leaves held+captured+released == original_amount_cents)"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /bookings/{id}/pickup"
        actor: Owner
        preconditions:
          - "acting Owner owns the listing"
          - "booking is APPROVED"
          - "acting renter's User.verification_status == VERIFIED (cross-entity dependency on VerificationRecord-derived state)"
          - "a PICKUP HandoffAppointment for this booking exists with status COMPLETED"
          - "a PICKUP ConditionReport for this booking exists with >=1 photo"
        side_effects:
          - "booking is now in-progress"
      - from: ACTIVE
        to: EXTENSION_REQUESTED
        trigger: "POST /bookings/{id}/extensions"
        actor: Renter
        preconditions:
          - "acting renter owns the booking"
          - "booking is ACTIVE"
          - "requested new_end_date strictly after current end_date"
          - "count of overlapping OTHER bookings in {REQUESTED,APPROVED,ACTIVE,EXTENSION_REQUESTED,LATE} over [end_date,new_end_date) < listing.quantity"
        side_effects:
          - "extension_requested_end_date set to new_end_date"
      - from: EXTENSION_REQUESTED
        to: ACTIVE
        trigger: "POST /bookings/{id}/extension-decision (decision=APPROVE)"
        actor: Owner
        preconditions:
          - "acting Owner owns the listing"
          - "booking is EXTENSION_REQUESTED"
        side_effects:
          - "end_date = extension_requested_end_date; extension_requested_end_date = null"
          - "recompute billable_days, rental_subtotal_cents, renter_service_fee_cents, provisional_total_cents over the new window (calculations.dynamic_daily_pricing)"
          - "increments Listing.version by 1"
        note: "Cyclic: returns Booking to ACTIVE, from which another extension may be requested."
      - from: EXTENSION_REQUESTED
        to: ACTIVE
        trigger: "POST /bookings/{id}/extension-decision (decision=DECLINE)"
        actor: Owner
        preconditions:
          - "acting Owner owns the listing"
          - "booking is EXTENSION_REQUESTED"
        side_effects:
          - "extension_requested_end_date = null (window unchanged)"
        note: "Cyclic decline branch: end_date and pricing unchanged."
      - from: ACTIVE
        to: LATE
        trigger: "POST /_ops/detect-late-returns (system sweep)"
        actor: system
        preconditions:
          - "booking is ACTIVE"
          - "logical clock > booking.end_date"
        side_effects:
          - "late_days = whole days between end_date and logical clock"
          - "late_fee_cents accrued (calculations.late_fee_accrual)"
          - "increment renter.late_return_count by 1"
          - "recompute renter.trust_score (calculations.trust_score)"
        note: "Cascade origin: LATE -> late_fee accrual + renter counter -> renter.trust_score recompute."
      - from: [ACTIVE, LATE]
        to: RETURNED
        trigger: "POST /bookings/{id}/return"
        actor: Owner
        preconditions:
          - "acting Owner owns the listing"
          - "booking is ACTIVE or LATE"
          - "a RETURN HandoffAppointment for this booking exists with status COMPLETED"
          - "a RETURN ConditionReport for this booking exists with >=1 photo"
        side_effects:
          - "actual_return_at = logical clock"
          - "compute final_total_cents (calculations.booking_settlement_charge FINAL) = rental_subtotal_cents + renter_service_fee_cents + late_fee_cents"
          - "decrement Listing.active_booking_count by 1"
          - "create Payout{ owner_id = listing.owner_id, gross_earnings_cents = rental_subtotal_cents, owner_commission_cents, damage_reimbursement_cents = 0, net_payout_cents, status = PENDING } (calculations.owner_payout)"
      - from: RETURNED
        to: COMPLETED
        trigger: "POST /payouts/{id}/release"
        actor: Platform | Owner
        preconditions:
          - "the booking's Payout is PENDING or HELD"
          - "no Claim on this booking is in {OPEN, UNDER_REVIEW} (cross-entity dependency: Payout release depends on Claim state)"
        side_effects:
          - "Payout.status = RELEASED"
          - "Deposit: released_cents += held_cents; held_cents = 0; status = RELEASED if captured_cents == 0 else CAPTURED/PARTIALLY_CAPTURED preserved (remainder released)"
          - "increment owner.total_earnings_cents by Payout.net_payout_cents"
        note: "Terminal booking state reached only after every claim is adjudicated."

  - entity: HandoffAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /bookings/{id}/handoffs"
        actor: Owner
        preconditions:
          - "acting Owner owns the booking's listing (X-User-ID == owner_id == listing.owner_id)"
          - "booking is APPROVED (for PICKUP) or ACTIVE/LATE (for RETURN)"
          - "slot_end strictly after slot_start"
          - "no other SCHEDULED HandoffAppointment for this owner occupies [slot_start - HANDOFF_BUFFER_MINUTES, slot_end + HANDOFF_BUFFER_MINUTES] (closed interval plus buffer)"
        side_effects:
          - "appointment occupies the owner's calendar with buffer"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /handoffs/{id}/complete"
        actor: Owner
        preconditions:
          - "acting Owner owns the appointment"
          - "appointment is SCHEDULED"
        side_effects:
          - "handoff completed; unblocks the corresponding pickup/return transition"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade on booking DECLINE or CANCEL"
        actor: system
        preconditions:
          - "the owning booking transitions to DECLINED or CANCELLED"
        side_effects:
          - "appointment CANCELLED; owner calendar slot freed"

  - entity: Deposit
    initial_state: HELD
    terminal_states: [CAPTURED, RELEASED]
    transitions:
      - from: HELD
        to: PARTIALLY_CAPTURED
        trigger: "system cascade on Claim resolve (APPROVED/PARTIALLY_APPROVED) when capture < held"
        actor: system
        preconditions:
          - "0 < deposit_capture_cents < held_cents"
        side_effects:
          - "held_cents -= deposit_capture_cents; captured_cents += deposit_capture_cents"
          - "increments Deposit.version by 1"
      - from: HELD
        to: CAPTURED
        trigger: "system cascade on Claim resolve when capture == held"
        actor: system
        preconditions:
          - "deposit_capture_cents == held_cents and held_cents > 0"
        side_effects:
          - "captured_cents += held_cents; held_cents = 0"
          - "increments Deposit.version by 1"
      - from: PARTIALLY_CAPTURED
        to: CAPTURED
        trigger: "system cascade on a subsequent Claim resolve capturing the remaining held"
        actor: system
        preconditions:
          - "deposit_capture_cents == held_cents and held_cents > 0"
        side_effects:
          - "captured_cents += held_cents; held_cents = 0"
          - "increments Deposit.version by 1"
      - from: [HELD, PARTIALLY_CAPTURED]
        to: RELEASED
        trigger: "system cascade on booking CANCEL (APPROVED) or COMPLETED (payout release)"
        actor: system
        preconditions:
          - "no Claim on the booking is in {OPEN, UNDER_REVIEW}"
        side_effects:
          - "released_cents += held_cents; held_cents = 0"
        note: "From PARTIALLY_CAPTURED the terminal label is CAPTURED-with-remainder-released; status recorded as RELEASED when captured_cents == 0, else the deposit is CAPTURED with released remainder. Invariant held+captured+released == original_amount_cents holds throughout."

  - entity: Claim
    initial_state: OPEN
    terminal_states: [APPROVED, PARTIALLY_APPROVED, DENIED]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /bookings/{id}/claims"
        actor: Owner
        preconditions:
          - "acting Owner owns the booking's listing"
          - "booking.status in {RETURNED, LATE, COMPLETED}"
          - "a Deposit exists for the booking"
        side_effects:
          - "provisional_capture_cents = min(claimed_amount_cents, deposit.held_cents) (calculations.deposit_settlement PROVISIONAL)"
          - "if the booking's Payout is PENDING, set Payout.status = HELD (cross-entity cascade)"
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/review"
        actor: Platform
        preconditions:
          - "claim is OPEN"
        side_effects:
          - "reviewed_by = X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/resolve (decision=APPROVE)"
        actor: Platform
        preconditions:
          - "claim is UNDER_REVIEW"
          - "expected_deposit_version == deposit.version (OCC)"
        side_effects:
          - "approved_amount_cents = claimed_amount_cents"
          - "deposit_capture_cents = min(approved_amount_cents, deposit.held_cents) (calculations.deposit_settlement FINAL)"
          - "coverage_paid_cents = max(0, min(approved_amount_cents - deposit_capture_cents, listing.declared_value_cents - deposit.original_amount_cents))"
          - "cascade: capture from Deposit (increments Deposit.version); Payout.damage_reimbursement_cents += deposit_capture_cents + coverage_paid_cents; recompute Payout.net_payout_cents; increment renter.upheld_claim_count; recompute renter.trust_score"
        note: "Cascade origin (depth>=3): resolve -> Deposit capture -> Payout recompute -> owner earnings/renter trust."
      - from: UNDER_REVIEW
        to: PARTIALLY_APPROVED
        trigger: "POST /claims/{id}/resolve (decision=PARTIAL)"
        actor: Platform
        preconditions:
          - "claim is UNDER_REVIEW"
          - "expected_deposit_version == deposit.version (OCC)"
          - "0 < approved_amount (resolve payload) < claimed_amount_cents"
        side_effects:
          - "approved_amount_cents = resolve payload approved_amount_cents"
          - "deposit_capture_cents = min(approved_amount_cents, deposit.held_cents)"
          - "coverage_paid_cents = max(0, min(approved_amount_cents - deposit_capture_cents, listing.declared_value_cents - deposit.original_amount_cents))"
          - "cascade identical to APPROVED branch with the partial amount"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/resolve (decision=DENY)"
        actor: Platform
        preconditions:
          - "claim is UNDER_REVIEW"
          - "expected_deposit_version == deposit.version (OCC)"
        side_effects:
          - "approved_amount_cents = 0; deposit_capture_cents = 0; coverage_paid_cents = 0 (deposit untouched)"
          - "if no other Claim on the booking is OPEN/UNDER_REVIEW and Payout.status == HELD, set Payout.status = PENDING (compensating: unblock payout, no capture)"

  - entity: Payout
    initial_state: PENDING
    terminal_states: [RELEASED]
    transitions:
      - from: null
        to: PENDING
        trigger: "system cascade on booking RETURN"
        actor: system
        preconditions:
          - "booking transitioned to RETURNED"
        side_effects:
          - "Payout created with computed amounts (calculations.owner_payout)"
      - from: PENDING
        to: HELD
        trigger: "system cascade on Claim OPEN"
        actor: system
        preconditions:
          - "a Claim on the booking moved to OPEN"
        side_effects:
          - "payout frozen pending claim adjudication"
      - from: HELD
        to: PENDING
        trigger: "system cascade on Claim DENIED (last open claim)"
        actor: system
        preconditions:
          - "no Claim on the booking remains in {OPEN, UNDER_REVIEW}"
        side_effects:
          - "payout unfrozen"
      - from: [PENDING, HELD]
        to: RELEASED
        trigger: "POST /payouts/{id}/release"
        actor: Platform | Owner
        preconditions:
          - "no Claim on the booking is in {OPEN, UNDER_REVIEW} (cross-entity dependency on Claim)"
        side_effects:
          - "booking -> COMPLETED; Deposit remainder released; owner.total_earnings_cents += net_payout_cents"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /bookings"
    occ_field: "expected_listing_version"
    description: |
      A renter quotes and requests a booking pinned to the Listing.version they
      observed. Creating the booking against a Listing whose version has since
      advanced (the owner re-priced, changed the demand multiplier, or adjusted
      quantity via PATCH /listings/{id}, or a prior booking consumed availability)
      is rejected: the renter's quoted price/availability view is stale and must
      be refreshed. Stated in OCC terms, expected_listing_version no longer equals
      the current Listing.version.
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
  - rule_id: claim-resolve-stale-deposit
    parent_entity: Deposit
    write_endpoint: "POST /claims/{id}/resolve"
    occ_field: "expected_deposit_version"
    description: |
      Multiple claims (e.g. a DAMAGE and a LOSS claim) may draw on the same
      booking Deposit. A resolver adjudicates a claim pinned to the Deposit.version
      it last read. If another claim has already captured from that deposit since,
      the Deposit.version has advanced and this resolve is rejected so the resolver
      re-reads the remaining held balance before capturing. Stated in OCC terms,
      expected_deposit_version no longer equals the current Deposit.version.
    error_id: ERR_STALE_DEPOSIT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dynamic_daily_pricing
    trigger: "booking create (POST /bookings), approved extension, GET /bookings/{id}/quote"
    algorithm: tiered_pricing
    formula: |
      billable_days = whole_days(start_date, end_date)         # half-open [start,end)
      # Duration discount tier (single tier for the whole window):
      if billable_days >= 28:      discount_bps = MONTHLY_DISCOUNT_BPS
      elif billable_days >= 7:     discount_bps = WEEKLY_DISCOUNT_BPS
      else:                        discount_bps = 0
      rental_subtotal_cents = 0
      for each day D in [start_date, end_date):                # one iteration per night
          raw = base_daily_rate_cents * (demand_multiplier_bps / 10000)
          if weekday(D) in {SAT, SUN}:
              raw = raw * ((10000 + WEEKEND_SURCHARGE_BPS) / 10000)
          raw = raw * ((10000 - discount_bps) / 10000)
          day_charge = round_half_up(raw)                      # ROUND PER DAY (pinned)
          rental_subtotal_cents += day_charge                  # then SUM
    input_set: "The listing's base_daily_rate_cents, demand_multiplier_bps, and the booking's current [start_date,end_date) window."
    constants:
      WEEKEND_SURCHARGE_BPS: 2000
      WEEKLY_DISCOUNT_BPS: 1000
      MONTHLY_DISCOUNT_BPS: 2500
    precision: "round_half_up to whole cents, applied PER DAY before summing (round-then-sum, NOT sum-then-round)."
    variants: []

  - name: booking_settlement_charge
    trigger: "PROVISIONAL at POST /bookings and on approved extension; FINAL at POST /bookings/{id}/return"
    algorithm: aggregation
    formula: |
      renter_service_fee_cents = round_half_up(rental_subtotal_cents * RENTER_SERVICE_FEE_BPS / 10000)
      PROVISIONAL: provisional_total_cents = rental_subtotal_cents + renter_service_fee_cents
      FINAL:       final_total_cents = rental_subtotal_cents + renter_service_fee_cents + late_fee_cents
    input_set: "Booking.rental_subtotal_cents (from dynamic_daily_pricing over the CURRENT window) and, for FINAL, late_fee_cents."
    constants:
      RENTER_SERVICE_FEE_BPS: 1200
    precision: "round_half_up on the summed rental_subtotal_cents (fee computed on the rounded subtotal, not per day)."
    variants:
      - name: PROVISIONAL
        when: "Computed at request time and after each approved extension, using the requested window; excludes any late fee."
        difference: "No late_fee_cents term; reflects the currently-agreed window only."
      - name: FINAL
        when: "Computed at RETURN using the actual settled window and accrued late fee."
        difference: "Adds late_fee_cents; if the return is late or the window was extended, final_total_cents > provisional_total_cents captured at booking."

  - name: late_fee_accrual
    trigger: "POST /_ops/detect-late-returns marks an ACTIVE booking LATE"
    algorithm: aggregation
    formula: |
      late_days = whole_days(end_date, logical_clock_now)          # days past window end
      per_day_penalty = round_half_up(base_daily_rate_cents * LATE_PENALTY_BPS / 10000)  # round PER late day
      late_fee_cents = per_day_penalty * late_days                 # then multiply/sum
    input_set: "Listing.base_daily_rate_cents and the number of whole days the logical clock is past Booking.end_date."
    constants:
      LATE_PENALTY_BPS: 15000
    precision: "round_half_up the per-day penalty ONCE, then multiply by late_days (round-per-day-then-sum). Summing raw then rounding once is a different, forbidden order."
    variants: []

  - name: deposit_settlement
    trigger: "PROVISIONAL at Claim OPEN (POST /bookings/{id}/claims); FINAL at Claim resolve (POST /claims/{id}/resolve)"
    algorithm: aggregation
    formula: |
      PROVISIONAL: provisional_capture_cents = min(claimed_amount_cents, deposit.held_cents)
      FINAL:       deposit_capture_cents = min(approved_amount_cents, deposit.held_cents)
                   coverage_paid_cents   = max(0, min(approved_amount_cents - deposit_capture_cents,
                                                      listing.declared_value_cents - deposit.original_amount_cents))
    input_set: "Claim.claimed_amount_cents (provisional) or approved_amount_cents (final), the Deposit's current held_cents, and the Listing's declared_value_cents."
    constants: {}
    precision: "integer cents; no rounding (all inputs are integer cents)."
    variants:
      - name: PROVISIONAL
        when: "At claim OPEN, an estimate of what could be captured, capped by currently-held deposit."
        difference: "Uses claimed_amount_cents (the owner's ask), not the adjudicated award."
      - name: FINAL
        when: "At resolve, the actual captured amount from the adjudicated award."
        difference: "Uses approved_amount_cents (claimed for APPROVED, partial for PARTIALLY_APPROVED, 0 for DENIED); diverges from PROVISIONAL whenever the claim is partially approved or denied, or when a prior claim reduced held_cents."

  - name: owner_payout
    trigger: "Payout create at booking RETURN; recompute on each Claim resolve capture"
    algorithm: aggregation
    formula: |
      gross_earnings_cents = booking.rental_subtotal_cents          # renter service fee is retained by platform
      owner_commission_cents = round_half_up(gross_earnings_cents * OWNER_COMMISSION_BPS / 10000)
      damage_reimbursement_cents = sum over claims C on this booking with status in {APPROVED, PARTIALLY_APPROVED}
                                     of (C.deposit_capture_cents + C.coverage_paid_cents)
      net_payout_cents = gross_earnings_cents - owner_commission_cents + damage_reimbursement_cents
    input_set: "Booking.rental_subtotal_cents at RETURN and the set of resolved (APPROVED/PARTIALLY_APPROVED) Claims on the booking."
    constants:
      OWNER_COMMISSION_BPS: 1500
    precision: "round_half_up on the commission; other terms are integer cents."
    variants: []

  - name: trust_score
    trigger: "on Rating create, on late-return detection, on Claim resolve (APPROVED/PARTIALLY_APPROVED)"
    algorithm: weighted_scoring
    formula: |
      avg_rating = mean(Rating.score where ratee_id == user.id)      # null/absent -> treat rating term as 0
      rating_term = round_half_up(RATING_POINTS_PER_STAR * (avg_rating - 3.0)) if rating_count > 0 else 0
      raw = BASE_TRUST + rating_term
            - LATE_PENALTY_POINTS * late_return_count
            - CLAIM_PENALTY_POINTS * upheld_claim_count
      trust_score = clamp(raw, 0, 500)
    input_set: "User.avg_rating, rating_count, late_return_count, upheld_claim_count."
    constants:
      BASE_TRUST: 300
      RATING_POINTS_PER_STAR: 40
      LATE_PENALTY_POINTS: 25
      CLAIM_PENALTY_POINTS: 40
    precision: "round_half_up on the rating term; final score clamped to integer [0,500]."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /users"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; for entity_backed ownership operations, X-User-ID matches the resource's owning FK."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all role-guarded endpoints"
  - priority: 3
    category: existence
    check: "Every path/body-referenced resource (user, listing, booking, handoff, claim, deposit, payout) exists; validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK bodies"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_referential
    check: "Referenced sibling entity is in the required state — e.g. booking approve/create requires listing.status == ACTIVE; pickup requires renter verification_status == VERIFIED; payout release requires no OPEN/UNDER_REVIEW claim on the booking."
    error_id: ERR_LISTING_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/approve"
  - priority: 6
    category: business_referential
    check: "Booking request and pickup require the acting renter's User.verification_status == VERIFIED."
    error_id: ERR_RENTER_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/pickup"
  - priority: 7
    category: business_referential
    check: "Payout release requires no Claim on the booking in {OPEN, UNDER_REVIEW}."
    error_id: ERR_CLAIM_UNRESOLVED
    http_status: 409
    applies_to: "POST /payouts/{id}/release"
  - priority: 8
    category: business_temporal
    check: "Requested rental window [start_date,end_date) (half-open; adjacency allowed) collides with >= listing.quantity overlapping bookings in {REQUESTED,APPROVED,ACTIVE,EXTENSION_REQUESTED,LATE}."
    error_id: ERR_LISTING_UNAVAILABLE
    http_status: 409
    applies_to: "POST /bookings, POST /bookings/{id}/extensions"
  - priority: 9
    category: business_temporal
    check: "Handoff slot [slot_start,slot_end] plus HANDOFF_BUFFER_MINUTES buffer collides with another SCHEDULED handoff on the same owner's calendar."
    error_id: ERR_HANDOFF_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /bookings/{id}/handoffs"
  - priority: 10
    category: business_constraint
    check: "Booking a high-value listing (declared_value_cents > HIGH_VALUE_THRESHOLD_CENTS) requires renter.trust_score >= MIN_TRUST_FOR_HIGH_VALUE."
    error_id: ERR_TRUST_TOO_LOW
    http_status: 422
    applies_to: "POST /bookings"
  - priority: 11
    category: business_constraint
    check: "A RETURN requires an existing RETURN ConditionReport with a non-empty photo_urls (>=1 photo); pickup requires a PICKUP ConditionReport with >=1 photo. Empty photo set is rejected."
    error_id: ERR_CONDITION_PHOTOS_REQUIRED
    http_status: 422
    applies_to: "POST /bookings/{id}/return, POST /bookings/{id}/pickup, POST /bookings/{id}/condition-reports"
  - priority: 12
    category: business_constraint
    check: "expected_listing_version / expected_deposit_version must match the current parent version (OCC)."
    error_id: ERR_STALE_LISTING_VERSION
    http_status: 412
    applies_to: "POST /bookings, PATCH /listings/{id}, POST /claims/{id}/resolve"
  - priority: 13
    category: business_fiscal
    check: "On claim resolve, the adjudicated award must not exceed the claimed amount; PARTIAL award must be strictly between 0 and claimed_amount_cents; deposit_capture may not exceed held_cents."
    error_id: ERR_INVALID_AWARD
    http_status: 422
    applies_to: "POST /claims/{id}/resolve"
  - priority: 14
    category: business_constraint
    check: "Request-body field types/enums/ranges are valid (e.g. end_date > start_date, score in 1..5, demand_multiplier_bps in range, non-empty photo_urls)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 15
    category: business_constraint
    check: "Registration email must be unique across users."
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /users"
  - priority: 16
    category: business_temporal
    check: "Extension new_end_date must be strictly after the current end_date."
    error_id: ERR_EXTENSION_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /bookings/{id}/extensions"
  - priority: 17
    category: business_constraint
    check: "Pickup requires a COMPLETED PICKUP handoff; return requires a COMPLETED RETURN handoff for the booking."
    error_id: ERR_HANDOFF_MISSING
    http_status: 409
    applies_to: "POST /bookings/{id}/pickup, POST /bookings/{id}/return"
  - priority: 18
    category: business_constraint
    check: "A rating requires booking.status == COMPLETED and the rater to be a participant (renter or listing owner) of the booking."
    error_id: ERR_RATING_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /bookings/{id}/ratings"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/users"
    description: "Register a new user (owner and/or renter)."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, phone]
    output: User
    side_effects: []
  - method: GET
    path: "/users/{id}"
    description: "Fetch a user profile including computed trust_score, verification_status, counters."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: User
    side_effects: []
  - method: POST
    path: "/users/{id}/verifications"
    description: "Submit an ID verification for self."
    roles: [Renter, Owner]
    code: 201
    input: [document_type, document_ref]
    output: VerificationRecord
    side_effects: ["User.verification_status set to PENDING"]
  - method: GET
    path: "/users/{id}/verifications"
    description: "List a user's verification records (reverse of VerificationRecord.user_id)."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: VerificationRecord[]
    side_effects: []
  - method: POST
    path: "/verifications/{id}/decide"
    description: "Platform approves or rejects a pending verification."
    roles: [Platform]
    code: 200
    input: [decision, "reject_reason?"]
    output: VerificationRecord
    side_effects: ["on APPROVE set valid_from/valid_until and User.verification_status=VERIFIED", "on REJECT set User.verification_status=REJECTED"]
  - method: POST
    path: "/listings"
    description: "Create a gear listing (starts DRAFT)."
    roles: [Owner]
    code: 201
    input: [owner_id, title, category, declared_value_cents, base_daily_rate_cents, deposit_cents, "quantity?", "demand_multiplier_bps?"]
    output: Listing
    side_effects: []
  - method: GET
    path: "/listings/{id}"
    description: "Fetch a listing."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: Listing
    side_effects: []
  - method: GET
    path: "/users/{id}/listings"
    description: "List an owner's listings (reverse of Listing.owner_id)."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: Listing[]
    side_effects: []
  - method: PATCH
    path: "/listings/{id}"
    description: "Update mutable listing pricing/availability fields; OCC-guarded."
    roles: [Owner]
    code: 200
    input: [expected_listing_version, "base_daily_rate_cents?", "demand_multiplier_bps?", "declared_value_cents?", "deposit_cents?", "quantity?"]
    output: Listing
    side_effects: ["increments Listing.version by 1"]
  - method: POST
    path: "/listings/{id}/activate"
    description: "Move a listing DRAFT/SUSPENDED -> ACTIVE."
    roles: [Owner]
    code: 200
    input: []
    output: Listing
    side_effects: []
  - method: POST
    path: "/listings/{id}/suspend"
    description: "Move a listing ACTIVE -> SUSPENDED."
    roles: [Owner]
    code: 200
    input: []
    output: Listing
    side_effects: []
  - method: POST
    path: "/bookings"
    description: "Create a rental request against a listing; OCC-guarded on the listing version, prices the window, holds an availability unit."
    roles: [Renter]
    code: 201
    input: [listing_id, renter_id, start_date, end_date, expected_listing_version]
    output: Booking
    side_effects: ["compute billable_days/rental_subtotal_cents/renter_service_fee_cents/provisional_total_cents", "increments Listing.active_booking_count by 1", "increments Listing.version by 1"]
  - method: GET
    path: "/bookings/{id}"
    description: "Fetch a booking with all computed pricing/settlement fields."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/bookings"
    description: "List bookings, filterable by listing_id (reverse of Booking.listing_id) or renter_id (reverse of Booking.renter_id) or status."
    roles: [Renter, Owner, Platform]
    code: 200
    input: ["listing_id?", "renter_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []
  - method: GET
    path: "/bookings/{id}/quote"
    description: "Computed read: the current dynamic-pricing quote for the booking's window."
    roles: [Renter, Owner]
    code: 200
    input: []
    output: "{ billable_days: integer, rental_subtotal_cents: integer, renter_service_fee_cents: integer, provisional_total_cents: integer, deposit_cents: integer }"
    side_effects: []
  - method: POST
    path: "/bookings/{id}/approve"
    description: "Owner approves a requested booking; creates the security Deposit hold."
    roles: [Owner]
    code: 200
    input: []
    output: Booking
    side_effects: ["create Deposit (HELD, original_amount_cents = listing.deposit_cents)"]
  - method: POST
    path: "/bookings/{id}/decline"
    description: "Owner declines a requested booking; releases the held availability unit."
    roles: [Owner]
    code: 200
    input: []
    output: Booking
    side_effects: ["decrement Listing.active_booking_count by 1", "cascade cancel SCHEDULED handoffs"]
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Renter cancels a REQUESTED or APPROVED booking; releases availability and deposit."
    roles: [Renter]
    code: 200
    input: []
    output: Booking
    side_effects: ["decrement Listing.active_booking_count by 1", "if APPROVED, release Deposit (held -> released)", "cascade cancel SCHEDULED handoffs"]
  - method: POST
    path: "/bookings/{id}/pickup"
    description: "Owner marks the item picked up; requires renter verified, completed PICKUP handoff, and PICKUP condition photos."
    roles: [Owner]
    code: 200
    input: []
    output: Booking
    side_effects: ["booking -> ACTIVE"]
  - method: POST
    path: "/bookings/{id}/return"
    description: "Owner marks the item returned; finalizes settlement and creates the owner Payout."
    roles: [Owner]
    code: 200
    input: []
    output: Booking
    side_effects: ["compute final_total_cents", "decrement Listing.active_booking_count by 1", "create Payout (PENDING)"]
  - method: POST
    path: "/bookings/{id}/extensions"
    description: "Renter requests to extend the rental end_date; re-checks availability over the extension window."
    roles: [Renter]
    code: 200
    input: [new_end_date]
    output: Booking
    side_effects: ["set extension_requested_end_date; booking -> EXTENSION_REQUESTED"]
  - method: POST
    path: "/bookings/{id}/extension-decision"
    description: "Owner approves or declines a pending extension; on approve re-prices the new window."
    roles: [Owner]
    code: 200
    input: [decision]
    output: Booking
    side_effects: ["on APPROVE set end_date, recompute pricing, increments Listing.version by 1; on DECLINE clear extension_requested_end_date"]
  - method: POST
    path: "/bookings/{id}/handoffs"
    description: "Owner schedules a pickup or return handoff appointment on their own calendar; buffered-overlap checked."
    roles: [Owner]
    code: 201
    input: [type, slot_start, slot_end]
    output: HandoffAppointment
    side_effects: []
  - method: GET
    path: "/bookings/{id}/handoffs"
    description: "List a booking's handoffs (reverse of HandoffAppointment.booking_id)."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: HandoffAppointment[]
    side_effects: []
  - method: GET
    path: "/users/{id}/handoffs"
    description: "List an owner's handoff appointments (reverse of HandoffAppointment.owner_id)."
    roles: [Owner, Platform]
    code: 200
    input: []
    output: HandoffAppointment[]
    side_effects: []
  - method: POST
    path: "/handoffs/{id}/complete"
    description: "Owner marks a scheduled handoff completed."
    roles: [Owner]
    code: 200
    input: []
    output: HandoffAppointment
    side_effects: []
  - method: POST
    path: "/bookings/{id}/condition-reports"
    description: "Record pickup or return condition photos (>=1 photo required)."
    roles: [Owner, Renter]
    code: 201
    input: [phase, photo_urls, recorded_by, "notes?"]
    output: ConditionReport
    side_effects: []
  - method: GET
    path: "/bookings/{id}/condition-reports"
    description: "List a booking's condition reports (reverse of ConditionReport.booking_id)."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: ConditionReport[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/claims"
    description: "Owner opens a damage/loss claim against a returned booking; freezes the payout."
    roles: [Owner]
    code: 201
    input: [claim_type, claimed_amount_cents, description]
    output: Claim
    side_effects: ["compute provisional_capture_cents", "if Payout PENDING -> HELD"]
  - method: GET
    path: "/bookings/{id}/claims"
    description: "List a booking's claims (reverse of Claim.booking_id)."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/review"
    description: "Platform moves a claim OPEN -> UNDER_REVIEW."
    roles: [Platform]
    code: 200
    input: []
    output: Claim
    side_effects: ["reviewed_by set"]
  - method: POST
    path: "/claims/{id}/resolve"
    description: "Platform adjudicates a claim (APPROVE/PARTIAL/DENY); OCC-guarded on deposit version; captures from deposit and recomputes payout."
    roles: [Platform]
    code: 200
    input: [decision, "approved_amount_cents?", expected_deposit_version]
    output: Claim
    side_effects: ["deposit capture cascade", "increments Deposit.version by 1", "recompute Payout.net_payout_cents", "increment renter.upheld_claim_count and recompute trust_score on APPROVE/PARTIAL"]
  - method: GET
    path: "/bookings/{id}/deposit"
    description: "Fetch the booking's deposit ledger (reverse of Deposit.booking_id; array of 0-1)."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: Deposit[]
    side_effects: []
  - method: POST
    path: "/payouts/{id}/release"
    description: "Release the owner payout once all claims are resolved; completes the booking and releases the deposit remainder."
    roles: [Platform, Owner]
    code: 200
    input: []
    output: Payout
    side_effects: ["booking -> COMPLETED", "release Deposit remainder", "increment owner.total_earnings_cents"]
  - method: GET
    path: "/bookings/{id}/payout"
    description: "Fetch the booking's payout (reverse of Payout.booking_id; array of 0-1)."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: Payout[]
    side_effects: []
  - method: GET
    path: "/users/{id}/payouts"
    description: "List an owner's payouts (reverse of Payout.owner_id)."
    roles: [Owner, Platform]
    code: 200
    input: []
    output: Payout[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/ratings"
    description: "Leave a rating for the counterparty on a completed booking."
    roles: [Renter, Owner]
    code: 201
    input: [ratee_id, direction, score, "comment?"]
    output: Rating
    side_effects: ["recompute ratee avg_rating, rating_count, trust_score"]
  - method: GET
    path: "/bookings/{id}/ratings"
    description: "List a booking's ratings (reverse of Rating.booking_id)."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: Rating[]
    side_effects: []
  - method: GET
    path: "/users/{id}/ratings"
    description: "List ratings authored by or about a user (reverse of Rating.rater_id and Rating.ratee_id)."
    roles: [Renter, Owner, Platform]
    code: 200
    input: []
    output: Rating[]
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock)."
    roles: [Platform]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: []
  - method: POST
    path: "/_ops/detect-late-returns"
    description: "Test-driving/system sweep: mark every ACTIVE booking whose end_date is before the logical clock as LATE, accruing late fees and trust penalties."
    roles: [Platform]
    code: 200
    input: []
    output: "{ marked_late_count: integer, booking_ids: string[] }"
    side_effects: ["per late booking: accrue late_fee_cents, increment renter.late_return_count, recompute trust_score"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or X-User-ID on a protected endpoint."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not permitted, or entity_backed user acting on a resource they do not own."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced user/listing/booking/handoff/claim/deposit/payout does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, bad enum, out-of-range number, end_date <= start_date, empty photo_urls, score outside 1..5."
  - id: ERR_DUPLICATE_EMAIL
    http: 409
    condition: "Registration email already in use."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state (e.g. approve a non-REQUESTED booking, resolve a non-UNDER_REVIEW claim, cancel a terminal booking)."
  - id: ERR_LISTING_NOT_ACTIVE
    http: 409
    condition: "Booking create/approve against a listing whose status is not ACTIVE."
  - id: ERR_RENTER_NOT_VERIFIED
    http: 409
    condition: "Pickup attempted while the renter's verification_status is not VERIFIED."
  - id: ERR_LISTING_UNAVAILABLE
    http: 409
    condition: "Requested rental/extension window overlaps >= listing.quantity concurrent bookings (half-open interval; adjacency allowed)."
  - id: ERR_HANDOFF_SLOT_CONFLICT
    http: 409
    condition: "Handoff slot plus buffer collides with another SCHEDULED handoff on the same owner's calendar (closed interval + HANDOFF_BUFFER_MINUTES)."
  - id: ERR_HANDOFF_MISSING
    http: 409
    condition: "Pickup/return attempted without a COMPLETED handoff of the matching type."
  - id: ERR_CONDITION_PHOTOS_REQUIRED
    http: 422
    condition: "Pickup/return attempted without a condition report of the matching phase carrying >=1 photo."
  - id: ERR_EXTENSION_WINDOW_INVALID
    http: 422
    condition: "Extension new_end_date is not strictly after the current end_date."
  - id: ERR_TRUST_TOO_LOW
    http: 422
    condition: "Booking a high-value listing while renter.trust_score < MIN_TRUST_FOR_HIGH_VALUE."
  - id: ERR_STALE_LISTING_VERSION
    http: 412
    condition: "POST /bookings or PATCH /listings expected_listing_version != current Listing.version."
  - id: ERR_STALE_DEPOSIT_VERSION
    http: 412
    condition: "POST /claims/{id}/resolve expected_deposit_version != current Deposit.version."
  - id: ERR_INVALID_AWARD
    http: 422
    condition: "Claim resolve award exceeds claimed amount, or PARTIAL award not strictly between 0 and claimed_amount_cents."
  - id: ERR_CLAIM_UNRESOLVED
    http: 409
    condition: "Payout release attempted while a claim on the booking is OPEN or UNDER_REVIEW."
  - id: ERR_RATING_NOT_ALLOWED
    http: 409
    condition: "Rating attempted before the booking is COMPLETED, or by a non-participant."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register."
    identity: "opaque"
    exclusive_operations:
      - "POST /users"
    shared_operations: []
  - name: Renter
    description: "A user acting as a renter of gear; owns their bookings."
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /bookings"
      - "POST /bookings/{id}/cancel"
      - "POST /bookings/{id}/extensions"
    shared_operations:
      - "POST /users/{id}/verifications"
      - "GET /users/{id}"
      - "GET /listings/{id}"
      - "GET /users/{id}/listings"
      - "GET /bookings/{id}"
      - "GET /bookings"
      - "GET /bookings/{id}/quote"
      - "POST /bookings/{id}/condition-reports"
      - "GET /bookings/{id}/condition-reports"
      - "GET /bookings/{id}/handoffs"
      - "GET /bookings/{id}/deposit"
      - "GET /bookings/{id}/claims"
      - "GET /bookings/{id}/payout"
      - "POST /bookings/{id}/ratings"
      - "GET /bookings/{id}/ratings"
      - "GET /users/{id}/ratings"
      - "GET /users/{id}/verifications"
  - name: Owner
    description: "A user acting as an owner of listings; owns their listings and drives the rental lifecycle from the owner side."
    identity: "entity_backed:User"
    exclusive_operations:
      - "POST /listings"
      - "PATCH /listings/{id}"
      - "POST /listings/{id}/activate"
      - "POST /listings/{id}/suspend"
      - "POST /bookings/{id}/approve"
      - "POST /bookings/{id}/decline"
      - "POST /bookings/{id}/pickup"
      - "POST /bookings/{id}/return"
      - "POST /bookings/{id}/extension-decision"
      - "POST /bookings/{id}/handoffs"
      - "POST /handoffs/{id}/complete"
      - "GET /users/{id}/handoffs"
      - "POST /bookings/{id}/claims"
    shared_operations:
      - "POST /users/{id}/verifications"
      - "GET /users/{id}"
      - "GET /listings/{id}"
      - "GET /users/{id}/listings"
      - "GET /bookings/{id}"
      - "GET /bookings"
      - "GET /bookings/{id}/quote"
      - "POST /bookings/{id}/condition-reports"
      - "GET /bookings/{id}/condition-reports"
      - "GET /bookings/{id}/handoffs"
      - "GET /bookings/{id}/deposit"
      - "GET /bookings/{id}/claims"
      - "GET /bookings/{id}/payout"
      - "GET /users/{id}/payouts"
      - "POST /payouts/{id}/release"
      - "POST /bookings/{id}/ratings"
      - "GET /bookings/{id}/ratings"
      - "GET /users/{id}/ratings"
      - "GET /users/{id}/verifications"
  - name: Platform
    description: "Operational operator: identity verification decisions, claim review/resolution, payout release, logical clock and ops sweeps."
    identity: "opaque"
    exclusive_operations:
      - "POST /verifications/{id}/decide"
      - "POST /claims/{id}/review"
      - "POST /claims/{id}/resolve"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/detect-late-returns"
    shared_operations:
      - "GET /users/{id}"
      - "GET /listings/{id}"
      - "GET /users/{id}/listings"
      - "GET /bookings/{id}"
      - "GET /bookings"
      - "GET /bookings/{id}/handoffs"
      - "GET /users/{id}/handoffs"
      - "GET /bookings/{id}/condition-reports"
      - "GET /bookings/{id}/deposit"
      - "GET /bookings/{id}/claims"
      - "GET /bookings/{id}/payout"
      - "GET /users/{id}/payouts"
      - "POST /payouts/{id}/release"
      - "GET /bookings/{id}/ratings"
      - "GET /users/{id}/ratings"
      - "GET /users/{id}/verifications"

# Global constants referenced across tables
constants:
  VERIFICATION_VALIDITY_DAYS: 365
  HIGH_VALUE_THRESHOLD_CENTS: 100000
  MIN_TRUST_FOR_HIGH_VALUE: 300
  HANDOFF_BUFFER_MINUTES: 60
  WEEKEND_SURCHARGE_BPS: 2000
  WEEKLY_DISCOUNT_BPS: 1000
  MONTHLY_DISCOUNT_BPS: 2500
  RENTER_SERVICE_FEE_BPS: 1200
  OWNER_COMMISSION_BPS: 1500
  LATE_PENALTY_BPS: 15000
  BASE_TRUST: 300
  RATING_POINTS_PER_STAR: 40
  LATE_PENALTY_POINTS: 25
  CLAIM_PENALTY_POINTS: 40
