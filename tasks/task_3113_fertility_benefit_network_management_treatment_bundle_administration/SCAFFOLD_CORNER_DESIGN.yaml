  # ===========================================================================
  - section: rbac
    instances:

      - name: claims_reviewer_cannot_adjudicate_returns_unauthorized
        claim_type: Violation → Error
        grounds:
          - roles.ClaimsReviewer.exclusive_operations
          - roles.ClaimsProcessor.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
        distinguishing_aspect: "ClaimsReviewer owns only appeal-decide, so adjudicate is a 403 ERR_UNAUTHORIZED for that role while the identical request from ClaimsProcessor succeeds — a peer-role partition, not a hierarchy, since ClaimsProcessor cannot decide an appeal either."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through an APPROVED authorization and a RECEIVED CLINIC_BUNDLE claim."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - *c_auth
            - *c_approve
            - call: "POST /claims"
              payload: { member_id: "${bm}", preauthorization_id: "${bph}", service_category: "CLINIC_BUNDLE", billed_cents: 1450000, service_date_iso: "2026-09-01T00:00:00Z" }
              as: ClaimsProcessor
              captures: { rcl: $.data.id }
          trigger:
            - call: "POST /claims/${rcl}/adjudicate"
              payload: {}
              as: ClaimsReviewer
              as_user_id: "rev-rbac"
              captures: { err_rev: $.data.error_id }
            - call: "POST /claims/${rcl}/adjudicate"
              payload: {}
              as: ClaimsProcessor
              captures: { rcl_v: $.data.version }
          assert:
            - "the first call returns 403 and err_rev == ERR_UNAUTHORIZED"
            - "the second call succeeds: Claim.${rcl}.claim_status == ADJUDICATED and Claim.${rcl}.allowed_cents == 1175000"
            - "Claim.${rcl}.member_cost_share_cents == 325000 and plan_paid_cents == 850000"
            - "Claim.${rcl}.version > ${rcl_v} - 1"
            - "ClaimsReviewer POST /claims/${rcl}/adjudicate returns ERR_UNAUTHORIZED while POST /claims/${rcl}/appeal-decide is its exclusive operation"

      - name: member_cannot_read_another_members_claim_returns_unauthorized
        claim_type: Violation → Error
        grounds:
          - roles.Member.identity
          - roles.Member.shared_operations
          - errors[ERR_UNAUTHORIZED]
          - endpoints.GET_/claims/{id}
        distinguishing_aspect: "Member is entity_backed:Member, so the acting X-User-ID must equal the member recorded on the resource; a second member reading the first member's claim is refused with 403 ERR_UNAUTHORIZED while the owning member reads it with 200."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through an APPROVED authorization and a RECEIVED claim, plus a second member on the same employer with its own advocate assignment and intake."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
            - *c_clinic
            - *c_clinic_v
            - *c_contract
            - *c_contract_act
            - *c_plan
            - *c_member_v
            - *c_select
            - *c_auth
            - *c_approve
            - call: "POST /claims"
              payload: { member_id: "${bm}", preauthorization_id: "${bph}", service_category: "CLINIC_BUNDLE", billed_cents: 1000000, service_date_iso: "2026-09-01T00:00:00Z" }
              as: ClaimsProcessor
              captures: { mcl: $.data.id }
            - call: "POST /members"
              payload: { employer_account_id: "${be}", external_ref: "BASE-3", full_name: "Other Member", state_code: "TX", required_track: "STANDARD_IVF" }
              as: CareAdvocate
              captures: { bm4: $.data.id }
          trigger:
            - call: "GET /claims/${mcl}"
              payload: {}
              as: Member
              as_user_id: "${bm4}"
              captures: { err: $.data.error_id }
            - call: "GET /claims/${mcl}"
              payload: {}
              as: Member
              as_user_id: "${bm}"
          assert:
            - "the foreign member's read returns 403 and err == ERR_UNAUTHORIZED"
            - "the owning member's read returns 200 and Claim.${mcl}.member_id == ${bm}"
            - "the owning member's read exposes member_cost_share_cents from the PROVISIONAL variant"
            - "the foreign member's own GET /claims?member_id=${bm4} returns 0 rows"
            - "GET /members/${bm} with as_user_id ${bm4} returns 403 ERR_UNAUTHORIZED"

      - name: member_cannot_create_a_treatment_plan_returns_unauthorized
        claim_type: Violation → Error
        grounds:
          - roles.Member.shared_operations
          - roles.CareAdvocate.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Member holds no write operation at all, so the plan-creation call that CareAdvocate performs is a 403 ERR_UNAUTHORIZED for Member — a role with read-only shared operations is refused on every exclusive_operations entry of every other role."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through member intake."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_bundle
            - *c_bundle_act
            - *c_adv
            - *c_member
            - *c_assign
            - *c_intake
          trigger:
            - call: "POST /treatment-plans"
              payload: { member_id: "${bm}", bundle_entitlement_id: "${bb}", pathway_type: "STANDARD_IVF", planned_cycles: 1 }
              as: Member
              as_user_id: "${bm}"
              captures: { err_plan: $.data.error_id }
            - call: "POST /members/${bm}/select-clinic"
              payload: { clinic_id: "00000000-0000-4000-8000-000000000001" }
              as: Member
              as_user_id: "${bm}"
              captures: { err_clinic: $.data.error_id }
          assert:
            - "the plan creation returns 403 and err_plan == ERR_UNAUTHORIZED"
            - "the clinic selection returns 403 and err_clinic == ERR_UNAUTHORIZED"
            - "err_plan != ERR_INVALID_REQUEST — the role gate fires before any payload or existence check"
            - "GET /treatment-plans?member_id=${bm} returns 0 rows"
            - "GET /members/${bm} returns 200 with Member.${bm}.member_status == CARE_ACTIVE for the same actor"

      - name: missing_x_user_role_header_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Priority 1 fires before priority 2: a request carrying no X-User-Role header at all returns 401 ERR_UNAUTHENTICATED, whereas one carrying an unrecognized role string is a different failure — the two must not collapse into one error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. The anchored base through one ADVOCATE registration only."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_adv
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
            - call: "GET /members/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: CareAdvocate
              as_user_id: "${ba}"
              captures: { err_ok: $.data.error_id }
          assert:
            - "the header-less call returns 401 and err == ERR_UNAUTHENTICATED"
            - "err != ERR_UNAUTHORIZED"
            - "the well-formed call returns 404 and err_ok == ERR_MEMBER_NOT_FOUND, so the authentication gate let it through to existence"
            - "GET /care-advocates/${ba} with as CareAdvocate returns 200"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

