              payload: { name: "Digital NoPrint", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_np: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_np}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_np_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "noprint@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_np: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_np}", offer_plan_id: "${plan_np}", expected_offer_plan_version: "${plan_np_v}" }
              as: SubscriptionOpsAgent
              captures: { sub_np: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_np}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_np: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_np}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 499 }
              as: SubscriptionOpsAgent
          trigger:
            - call: "POST /paywall/subscriptions/${sub_np}/holds"
              payload: { hold_type: "VACATION_DELIVERY", start_date: "2026-09-10", end_date: "2026-09-17" }
              as: Reader
              as_user_id: "${rd_np}"
              captures: { err_np: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_PLAN_NOT_PRINT_BUNDLE"
            - "Hold rows on Subscription.${sub_np} == 0"
            - "Subscription.${sub_np}.print_fulfillment_status == NOT_APPLICABLE"
            - "Subscription.${sub_np}.vacation_days_used_365 == 0"

      - name: group_account_funded_by_non_institutional_plan_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=47]
          - errors[ERR_PLAN_NOT_INSTITUTIONAL]
        distinguishing_aspect: "An ACTIVE DIGITAL_ONLY plan with no per_seat_price_cents passes existence and plan-state checks and must still be refused 422 as a group-account funding source."
