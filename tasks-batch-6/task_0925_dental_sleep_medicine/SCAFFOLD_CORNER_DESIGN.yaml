              as: Dentist
              as_user_id: "${dent_id}"
              captures: { lo_id: $.data.id }
            - call: "POST /lab-orders/${lo_id}/submit"
              payload: { promised_turnaround_days: 14 }
              as: Dentist
              as_user_id: "${dent_id}"
            - call: "POST /lab-orders/${lo_id}/ship"
              payload: { shipped_on: "2026-05-15" }
              as: LabTechnician
              as_user_id: "${lab_id}"
            - call: "POST /lab-orders/${lo_id}/receive"
              payload: { fit_outcome: "ACCEPTED" }
              as: Dentist
              as_user_id: "${dent_id}"
            - call: "POST /appliance-lots"
              payload: { manufacturer: "SomnoCorp", lot_code: "LOT-A" }
              as: PlatformAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /appliances"
              payload: { lab_order_id: "${lo_id}", lot_id: "${lot_id}", serial_number: "SN-0001", has_microrecorder: true }
              as: Dentist
              as_user_id: "${dent_id}"
              captures: { app_id: $.data.id }
            - call: "POST /adherence-downloads"
              payload: { appliance_id: "${app_id}", source: "OBJECTIVE_MICRORECORDER", window_start: "2026-07-08", window_end: "2026-08-06", nights_recorded: 30, nights_at_or_above_min_hours: 25, mean_hours_per_worn_night: 6.4 }
              as: Dentist
              as_user_id: "${dent_id}"
              captures: { dl1_id: $.data.id }
          trigger:
            - call: "POST /adherence-downloads"
              payload: { appliance_id: "${app_id}", source: "OBJECTIVE_MICRORECORDER", window_start: "2026-07-08", window_end: "2026-08-06", nights_recorded: 30, nights_at_or_above_min_hours: 10, mean_hours_per_worn_night: 2.0 }
