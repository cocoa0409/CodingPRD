          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CA fee rule; facility; patient; ATTORNEY requester with a valid authorization."
            - "Third-party SECURE_PORTAL request accepted, one 62-page general segment RETRIEVED, compilation completed, so the request sits in SENSITIVE_REVIEW with billing_status PENDING_INVOICE."
