              payload: { amount_cents: 5000, method: "CARD", kind: "POST" }
              as: FinancialCounselor
          trigger:
            - call: "POST /patient-access/appointments/${a_id}/payments"
              payload: { amount_cents: 5001, method: "CARD", kind: "REFUND" }
              as: FinancialCounselor
              captures: { err: $.data.error_id }
            - call: "POST /patient-access/appointments/${a_id}/payments"
