  # ---------------------------------------------------------------------------
  # Rule 6 — boundary precision on DIFFERENT metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: volume_tier_boundary_exactly_36000_seconds
        grounds:
          - calculations.royalty_statement_totals
          - errors[ERR_STATEMENT_EMPTY]
        distinguishing_aspect: |
          Metric = cumulative verified seconds; endpoint = POST .../royalty-statements/{id}/close.
          total_verified_seconds == 36000 hits the >= TIER_2 boundary exactly (36000 is
          IN TIER_2, 35999 would be TIER_1): volume_tier == TIER_2, total 309520 vs
          provisional 386900.
        test_recipe:
          setup:
            - "E1 VERIFIED: BROADCAST, market 6,000,000, 20000s → provisional 333500"
            - "E2 VERIFIED: BROADCAST, market 100, 16000s → provisional 53400"
            - "Statement OPEN for ACME [2026-07-01, 2026-08-01)"
          setup_api_calls:
            - call: "POST /archive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /archive/staff-members"
              payload: { email: "r@x.com", full_name: "R", department: "NEWS" }
              as: SystemAdmin
              captures: { staff_id: $.data.id }
