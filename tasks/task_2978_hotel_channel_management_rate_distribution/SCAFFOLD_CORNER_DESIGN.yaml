            - "Room type KING capacity 10 with inventory days on 2026-08-25, 2027-08-24 and 2027-08-25 - every date the three bookings touch has a row, so the InventoryDay prerequisite at priority 15 can never mask the horizon error."
            - "Channel BRAND (commission_bp 0) with a HEALTHY connection and plan BAR (25000) ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
