              captures: { i1: "$.data.id" }
            - call: POST /safety-incidents
              payload: { cook_id: "${cook_id}", subject_type: "COOK", category: "LABEL_MISSING", severity: "MINOR", description: "net weight missing on one box", occurred_at: "2026-07-30T11:00:00Z" }
              as: SafetyOfficer
              as_user_id: so-1
              captures: { i2: "$.data.id" }
            - call: POST /safety-incidents/${i1}/triage
              payload: { decision: "ACCEPT" }
              as: SafetyOfficer
              as_user_id: so-1
            - call: POST /safety-incidents/${i2}/triage
              payload: { decision: "ACCEPT" }
              as: SafetyOfficer
              as_user_id: so-1
            - call: POST /safety-incidents/${i1}/adjudicate
              payload: { decision: "SUBSTANTIATE", resolution_note: "photo confirms" }
              as: SafetyOfficer
              as_user_id: so-2
            - call: POST /safety-incidents/${i2}/adjudicate
              payload: { decision: "SUBSTANTIATE", resolution_note: "photo confirms" }
              as: SafetyOfficer
              as_user_id: so-2
          trigger:
            - call: GET /cooks/${cook_id}/compliance-summary
              payload: {}
              as: SafetyOfficer
              as_user_id: so-2
              captures: { score_0: "$.data.safety_score", subst_0: "$.data.substantiated_incident_count" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2027-01-23T00:00:00Z" }
              as: PlatformAdmin
            - call: GET /cooks/${cook_id}/compliance-summary
              payload: {}
              as: SafetyOfficer
              as_user_id: so-2
              captures: { score_25w: "$.data.safety_score" }
