            - call: "GET /golf/tee-times/${tt_id}"
              payload: {}
              as: ProShop
          assert:
            - "TeeTime.${tt_id}.version == 2"
            - "TeeTime.${tt_id}.confirmed_count == 1"

      - name: peak_threshold_at_boundary_already_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.booking_green_fee, entities.Course.fields.peak_end_hour]
        excluded_because:
          difficulty_instance: boundary_precision_check / peak_window_end_hour_exclusive_boundary
          rationale: "Peak/off-peak time-of-day breakpoint at the exclusive end-hour boundary is covered by the named §1.8 instance."

      - name: cap_threshold_already_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.official_handicap_index, entities.Golfer.fields.low_handicap_index]
        excluded_because:
          difficulty_instance: combinatorial_formula / official_index_soft_then_hard_cap_clamp
          rationale: "Soft/hard-cap reduction threshold against low_handicap_index is covered by the named §1.8 instance."

      - name: cascade_chain_already_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Booking.CONFIRMED_to_CANCELLED, calculations.standby_priority]
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_confirmed_promotes_standby_and_prices_it_depth3
          rationale: "The end-to-end cancel -> free-seat -> promote -> price cascade is covered by the named §1.8 instance."

      - name: dual_variant_index_already_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.provisional_handicap_index, calculations.official_handicap_index]
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_official_index_diverge_on_asof_date
          rationale: "Provisional vs official Handicap Index divergence is covered by the named §1.8 instance."

