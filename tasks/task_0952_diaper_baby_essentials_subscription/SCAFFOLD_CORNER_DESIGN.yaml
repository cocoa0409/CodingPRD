      - name: corner_gift_purchaser_cannot_touch_pipeline_r
        claim_type: role_denial
        grounds: ["validations[priority=3]", "errors[ERR_GIFT_PURCHASER_SCOPE]"]
        distinguishing_aspect: "A GiftPurchaser calling POST /subscriptions/{id}/cycles is caught by the scope-specific rung 3 with ERR_GIFT_PURCHASER_SCOPE (403), which runs before the generic role check precisely so the Pipeline confinement is reported by name."
