# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2317 — Digital Ticket Access Control & Fraud Prevention
#
# Every instance grounds exclusively in elements declared in SCAFFOLD.yaml
# §1.1–§1.7. Deleting this file leaves the scaffold's declared behaviour
# identical; it only makes coverage harder to audit.
#
# Shared fixture conventions used by every chain below:
#   logical clock starts at the mandatory default 2026-08-01T00:00:00Z
#   Event.barcode_anchor_at              = 2026-09-12T18:00:00Z
#   epoch(18:10:00Z)=20  epoch(18:10:30Z)=21  epoch(18:11:00Z)=22
#   epoch(18:12:00Z)=24  epoch(18:12:30Z)=25  epoch(18:12:31Z)=25
#   opaque X-User-IDs: admin-1 (VenueAdmin), boa-1/boa-2 (BoxOfficeAgent),
#                      appr-1 (TicketingApprover), gate-op-1 (GateOperator),
#                      sec-1 (SecurityInvestigator)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc
  # Two variant pairs in two DIFFERENT entity domains: occupancy (Event /
  # AccessZone / ReconciliationReport) and patron risk (Patron /
  # DeniedEntryIncident).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: occupancy_gate_live_vs_reconciled_variant_divergence
        grounds:
          - calculations.live_occupancy
          - calculations.reconciliation_variance
          - calculations.gate_clearance_projection
          - entities.Event.fields.live_occupancy
          - entities.Event.fields.peak_live_occupancy
          - entities.ReconciliationReport.fields.scan_derived_attendance
          - entities.ScanEvent.fields.source
        distinguishing_aspect: |
          On one identical ScanEvent stream of two admissions, the GATE_LIVE variant
          reports Event.live_occupancy == 1 because it excludes OFFLINE_BATCH scans,
          while the RECONCILED variant reports scan_derived_attendance == 2 because it
          includes them — a divergence of exactly 1 in the OCCUPANCY entity domain.
        test_recipe:
          setup:
            - "One Event ON_SALE→DOORS_OPEN with fire_code_capacity 200 and barcode_anchor_at 2026-09-12T18:00:00Z."
            - "One AccessZone GA1 (fire_code_capacity 200) and one Gate G1 on it at 20/min x 2 lanes."
            - "Two verified patrons, Ada and Ben, each holding one PAID ticket of 12000 cents bound to their own device."
            - "Logical clock at 2026-09-12T18:10:00Z (barcode epoch 20); one OFFLINE_CAPABLE ScanSession open on G1."
            - "Ada admitted through an ONLINE scan; Ben admitted through a one-item offline cache upload."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload:
                zone_code: "GA1"
                required_entitlement_level: "GA"
                fire_code_capacity: 200
                face_value_reference_cents: 8750
                credential_capacity: 4
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_ga_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_ga_id}", throughput_per_minute: 20, lanes_open: 2 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /patrons"
              payload: { email: "ben@example.com", display_name: "Ben Hall" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ben_id: $.data.id }
            - call: "POST /patrons/${p_ben_id}/verify-identity"
              payload: { document_reference: "DL-BEN-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_ga_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_ada_id: $.data.id }
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_ga_id}", holder_patron_id: "${p_ben_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_ben_id: $.data.id }
            - call: "POST /tickets/${t_ada_id}/device-binding"
              payload: { device_fingerprint: "DEV-ADA" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /tickets/${t_ben_id}/device-binding"
              payload: { device_fingerprint: "DEV-BEN" }
              as: Patron
              as_user_id: "${p_ben_id}"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "OFFLINE_CAPABLE", expected_gate_version: "${g1_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id }
            - call: "GET /tickets/${t_ada_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc_ada: $.data.current_barcode }
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc_ada}", device_fingerprint: "DEV-ADA", direction: "IN", dedupe_key: "S1-ONLINE-001" }
              as: GateOperator
              as_user_id: "gate-op-1"
            - call: "GET /tickets/${t_ben_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc_ben: $.data.current_barcode }
            - call: "POST /scan-sessions/${s1_id}/offline-batch"
              payload:
                scans:
                  - presented_barcode: "${bc_ben}"
                    device_fingerprint: "DEV-BEN"
                    direction: "IN"
                    dedupe_key: "S1-OFFLINE-001"
                    scanned_at: "2026-09-12T18:10:00Z"
              as: GateOperator
              as_user_id: "gate-op-1"
          trigger:
            - call: "GET /events/${ev_id}/occupancy"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { live_now: $.data.live_occupancy, clearance_now: $.data.projected_clearance_minutes }
            - call: "POST /scan-sessions/${s1_id}/close"
              as: GateOperator
              as_user_id: "gate-op-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "IN_PROGRESS" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "CLOSED" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "GET /events/${ev_id}"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_v: $.data.version }
            - call: "POST /events/${ev_id}/reconciliation-reports"
              payload: { reported_attendance: 2, expected_event_version: "${ev_v}" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { rep_id: $.data.id }
          assert:
            - "${live_now} == 1 — GATE_LIVE counts only the ONLINE ADMITTED scan"
            - "GET /events/${ev_id}/occupancy → data.peak_live_occupancy == 1"
            - "AccessZone.${z_ga_id}.occupancy_count == 1"
            - "${clearance_now} == 0 — both tickets are already admitted, so waiting == 0 and ceil(0 / (20*2)) == 0"
            - "Ticket.${t_ben_id}.admission_status == INSIDE even though it contributed 0 to Event.live_occupancy"
            - "ScanSession.${s1_id}.online_scan_count == 1 and ScanSession.${s1_id}.offline_uploaded_count == 1"
            - "ReconciliationReport.${rep_id}.scan_derived_attendance == 2 — RECONCILED counts distinct ADMITTED tickets across BOTH sources"
            - "ReconciliationReport.${rep_id}.variance_count == 0 and ReconciliationReport.${rep_id}.variance_pct == 0.00"
            - "ReconciliationReport.${rep_id}.fire_code_breach == false"
            - "The two variants diverge by exactly 1 over the identical ScanEvent stream: 1 (GATE_LIVE) vs 2 (RECONCILED)"

      - name: patron_fraud_score_provisional_vs_adjudicated_variant_divergence
        grounds:
          - calculations.patron_fraud_risk_score
          - calculations.denied_entry_remediation_credit
          - entities.Patron.fields.fraud_risk_score
          - entities.Patron.fields.fraud_risk_basis
          - entities.DeniedEntryIncident.fields.status
          - state_machines.DeniedEntryIncident.UNDER_REVIEW_to_REMEDIATED
        distinguishing_aspect: |
          On one identical incident set (a single DEVICE_MISMATCH), the PROVISIONAL variant
          scores the patron 45 while the ADJUDICATED variant scores the same patron 23
          because REMEDIATED weights are halved with round_half_up(45 * 0.5) — a divergence
          of 22 in the PATRON RISK entity domain, disjoint from the occupancy domain above.
        test_recipe:
          setup:
            - "Event DOORS_OPEN with fire_code_capacity 200; AccessZone GA1 (fire_code_capacity 200); Gate G1."
            - "Ada verified, holding a PAID ticket of 14000 cents bound to device DEV-ADA; Ben verified, holding a PAID ticket of 12000 cents, so Event.settlement_pool_cents == 26000."
            - "Logical clock at 2026-09-12T18:10:00Z (epoch 20); one ONLINE ScanSession open on G1."
            - "Ada's device_rebind_count is 0 (first binding never counts as a rebind), so churn_points == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload:
                zone_code: "GA1"
                required_entitlement_level: "GA"
                fire_code_capacity: 200
                face_value_reference_cents: 8750
                credential_capacity: 4
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_ga_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_ga_id}", throughput_per_minute: 20, lanes_open: 2 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /patrons"
              payload: { email: "ben@example.com", display_name: "Ben Hall" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ben_id: $.data.id }
            - call: "POST /patrons/${p_ben_id}/verify-identity"
              payload: { document_reference: "DL-BEN-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_ga_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 14000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_ada_id: $.data.id }
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_ga_id}", holder_patron_id: "${p_ben_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_ben_id: $.data.id }
            - call: "POST /tickets/${t_ada_id}/device-binding"
              payload: { device_fingerprint: "DEV-ADA" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "ONLINE", expected_gate_version: "${g1_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id }
            - call: "GET /tickets/${t_ada_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc_ada: $.data.current_barcode }
          trigger:
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc_ada}", device_fingerprint: "DEV-IMPOSTOR", direction: "IN", dedupe_key: "S1-ONLINE-001" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { denial_err: $.data.error_id }
            - call: "GET /denied-entry-incidents?ticket_id=${t_ada_id}"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { inc_id: "$.data[0].id" }
            - call: "GET /patrons/${p_ada_id}"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { score_prov: $.data.fraud_risk_score }
            - call: "POST /denied-entry-incidents/${inc_id}/start-review"
              as: SecurityInvestigator
              as_user_id: "sec-1"
            - call: "POST /denied-entry-incidents/${inc_id}/remediate"
              payload: { resolution_note: "Turnstile reader swap confirmed; goodwill credit applied" }
              as: SecurityInvestigator
              as_user_id: "sec-1"
            - call: "GET /patrons/${p_ada_id}"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { score_adj: $.data.fraud_risk_score }
          assert:
            - "${denial_err} == ERR_DEVICE_MISMATCH with HTTP 422"
            - "${score_prov} == 45 — PROVISIONAL: DEVICE_MISMATCH weight 45 plus churn_points 0"
            - "Patron.${p_ada_id}.fraud_risk_basis == PROVISIONAL immediately after incident creation"
            - "Patron.${p_ada_id}.strike_count == 1"
            - "DeniedEntryIncident.${inc_id}.category == DEVICE_MISMATCH and status == REMEDIATED after the remediate call"
            - "DeniedEntryIncident.${inc_id}.remediation_credit_cents == 15600"
            - "${score_adj} == 23 — ADJUDICATED: round_half_up(45 * 0.5) == 23"
            - "Patron.${p_ada_id}.fraud_risk_basis == ADJUDICATED after remediation"
            - "The two variants differ by 22 on the identical single-incident set"
            - "Patron.${p_ada_id}.remediation_credit_cents == 15600 and Event.${ev_id}.settlement_pool_cents == 10400"

  # ===========================================================================
  # Rule 2 — combinatorial_formula
  # Mode (a): nested min with conditional branches on two entity states.
  # Mode (b): pinned rounding ORDER (per-component and per-ticket, then sum).
  # Mode (c): pinned EVALUATION ORDER of a tier that looks self-referential.
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: resale_price_cap_nested_min_across_regime_and_seller_verification
        grounds:
          - calculations.resale_price_cap
          - entities.Event.fields.price_cap_regime
          - entities.Patron.fields.identity_verified
          - entities.ResaleListing.fields.cap_price_cents
          - validations[priority=35]
        distinguishing_aspect: |
          Mode (a): the same face_value_cents of 12000 yields three different
          cap_price_cents — 14500, 13200 and 12000 — because the formula nests
          min(round_half_up(face * pct), 2500) inside two independent conditional
          branches (Event.price_cap_regime and the seller Patron's identity_verified),
          so no single-branch reading reproduces all three.
        test_recipe:
          setup:
            - "Event E1 with price_cap_regime VENUE_POLICY, ON_SALE, one AccessZone."
            - "Event E2 with price_cap_regime STATUTORY, ON_SALE, one AccessZone."
            - "Ada is identity_verified; Cyd is registered but NOT verified."
            - "Ada holds one PAID 12000-cent ticket in E1 and one PAID 12000-cent ticket in E2; Cyd holds one PAID 12000-cent ticket in E2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
                price_cap_regime: "VENUE_POLICY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev1_id: $.data.id }
            - call: "POST /events/${ev1_id}/access-zones"
              payload:
                zone_code: "GA1"
                required_entitlement_level: "GA"
                fire_code_capacity: 200
                face_value_reference_cents: 8750
                credential_capacity: 4
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z1_id: $.data.id }
            - call: "POST /events/${ev1_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Statutory Matinee"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-13T18:00:00Z"
                doors_open_at: "2026-09-13T18:00:00Z"
                event_start_at: "2026-09-13T19:00:00Z"
                transfer_window_closes_at: "2026-09-13T17:00:00Z"
                price_cap_regime: "STATUTORY"
                transfer_limit_per_ticket: 2
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev2_id: $.data.id }
            - call: "POST /events/${ev2_id}/access-zones"
              payload:
                zone_code: "GA1"
                required_entitlement_level: "GA"
                fire_code_capacity: 200
                face_value_reference_cents: 8750
                credential_capacity: 4
                comp_discount_pct: 0.85
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z2_id: $.data.id }
            - call: "POST /events/${ev2_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /patrons"
              payload: { email: "cyd@example.com", display_name: "Cyd Novak" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_cyd_id: $.data.id }
            - call: "POST /tickets"
              payload: { event_id: "${ev1_id}", access_zone_id: "${z1_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_a1_id: $.data.id, t_a1_v: $.data.version }
            - call: "POST /tickets"
              payload: { event_id: "${ev2_id}", access_zone_id: "${z2_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_a2_id: $.data.id, t_a2_v: $.data.version }
            - call: "POST /tickets"
              payload: { event_id: "${ev2_id}", access_zone_id: "${z2_id}", holder_patron_id: "${p_cyd_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_c_id: $.data.id, t_c_v: $.data.version }
          trigger:
            - call: "POST /resale-listings"
              payload: { ticket_id: "${t_a1_id}", ask_price_cents: 14500, marketplace: "VERIFIED_PRIMARY", expected_ticket_version: "${t_a1_v}" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { lst_vp_id: $.data.id, cap_vp: $.data.cap_price_cents }
            - call: "POST /resale-listings"
              payload: { ticket_id: "${t_a2_id}", ask_price_cents: 13200, marketplace: "VERIFIED_PRIMARY", expected_ticket_version: "${t_a2_v}" }
              as: Patron
              as_user_id: "${p_ada_id}"
