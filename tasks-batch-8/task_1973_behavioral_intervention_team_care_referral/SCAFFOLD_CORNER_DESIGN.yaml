        claim_type: stale_version_rejection
        grounds:
          - "concurrency_rules[plan-create-stale-case]"
          - "errors[ERR_STALE_CASE_VERSION]"
        distinguishing_aspect: "OCC on CareCase.version: a plan draft carrying the pre-bump version is rejected 412 after an unrelated mutation (assign-manager) advanced the case."
        test_recipe:
          setup: ["staff chair/cm/cm2/rep; student s1; case c1 TRIAGED (LOW)"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
