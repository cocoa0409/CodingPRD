  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: inspection_deadline_exclusive_boundary
        grounds:
          - calculations.equipment_inspection_due_boundary
          - calculations.equipment_inspection_due_boundary.variants.exclusive_deadline
          - errors.ERR_EQUIPMENT_INSPECTION_OVERDUE
          - entities.Equipment.fields.inspection_status
          - state_machines.Equipment.transitions.PENDING_INSPECTION_to_IN_SERVICE
        distinguishing_aspect: "A numeric instant boundary on the inspection deadline: inspected_at one second before inspection_due_at is accepted, inspected_at exactly at it is rejected with 409 ERR_EQUIPMENT_INSPECTION_OVERDUE, and the derived inspection_status flips from DUE to OVERDUE at that same instant."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One enrolled BCO with an escrow deposit and a fleet unit whose inspection_due_at is exactly 2026-09-10T00:00:00Z, still in PENDING_INSPECTION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-TX-71", legal_name: "Nueces Fleet Services LLC", home_terminal_city: "Corpus Christi", revenue_split_pct: 0.68, oa_enrolled: false, liability_insurance_deductible_cents: 250000 }
              as: NetworkAdministrator
              captures: { bco_id: $.data.id }
            - call: "POST /network/escrow-transactions"
              payload: { capacity_owner_id: "${bco_id}", transaction_type: "ESCROW_DEPOSIT", amount_cents: 250000, effective_at: "2026-09-01T00:00:00Z" }
              as: SettlementOperator
