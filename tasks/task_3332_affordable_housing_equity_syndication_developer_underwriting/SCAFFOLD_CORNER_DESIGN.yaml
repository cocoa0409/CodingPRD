              as_user_id: "${inv_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SUBSCRIPTION_TERMINAL"
            - "FundSubscription.${sub_id}.status == DEFAULTED"
            - "FundSubscription.${sub_id}.paid_in_cents == 100000000"
            - "SyndicationFund.${fund_id}.funded_equity_cents == 100000000"

      - name: review_resolve_from_a_compliant_review_returns_review_not_escalated
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PortfolioReview.transitions.ESCALATED_to_NONCOMPLIANT
          - errors[ERR_REVIEW_NOT_ESCALATED]
          - validations[priority=6]
        distinguishing_aspect: "A NONCOMPLIANT outcome is only reachable from ESCALATED, so resolving an already COMPLIANT review returns ERR_REVIEW_NOT_ESCALATED and does not increment the project's compliance_failure_count."
        test_recipe:
          setup:
            - "Project Riverside Commons carries a COMPLIANT review of period 1."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /projects/${proj_a_id}/reviews"
              payload: { review_period_index: 1, review_period_end: "2026-06-30T00:00:00Z", occupancy_pct: 0.95, dscr_observed: 1.4, reserve_balance_cents: 60000000 }
              as: ComplianceOfficer
              captures: { review_id: $.data.id }
          trigger:
            - call: "POST /reviews/${review_id}/resolve"
              payload: {}
              as: AssetManager
              captures: { status_after_first: $.data.status }
            - call: "POST /reviews/${review_id}/resolve"
              payload: { outcome: "NONCOMPLIANT" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "PortfolioReview.${review_id}.status == COMPLIANT after the first resolve"
            - "the response status is 409 and error_id == ERR_REVIEW_NOT_ESCALATED"
            - "Project.${proj_a_id}.compliance_failure_count == 0"

      - name: commit_side_effect_chain_is_covered_by_the_cascade_instance
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Developer.transitions.ELIGIBLE_to_SUSPENDED
          - state_machines.SyndicationFund.transitions.OPEN_to_FROZEN
          - state_machines.Project.transitions.COMPLIANCE_PERIOD_to_DISTRESSED
        excluded_because:
          difficulty_instance: two_escalated_reviews_suspend_sponsor_then_freeze_fund
          rationale: "The three-hop escalation cascade and its end-state fund posture are asserted in full by the named §1.8 instance."

      - name: terminal_state_lockdown_on_a_defaulted_subscription
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.FundSubscription.transitions.PLEDGED_to_DEFAULTED
          - state_machines.FundSubscription.transitions.PLEDGED_to_DEFAULTED
          - errors[ERR_SUBSCRIPTION_TERMINAL]
        excluded_because:
          difficulty_instance: subscription_then_default_conserves_subscribed_equity
          rationale: "Reaching DEFAULTED and observing its effect on the fund's subscribed equity is asserted there; the terminal-lockdown rejection of a further pay-in is independently asserted by the payin_against_a_defaulted_subscription corner instance."

      - name: compound_parent_state_is_covered_by_the_posture_instance
        claim_type: Parent state derived from children
        grounds:
          - calculations.fund_posture
          - state_machines.SyndicationFund.transitions.OPEN_to_WATCH
          - state_machines.SyndicationFund.transitions.WATCH_to_OPEN
        excluded_because:
          difficulty_instance: project_status_revision_cycle_through_distressed_and_back
          rationale: "The fund posture swinging with its projects' states is asserted there, and the denormalized recompute-on-write behaviour is independently asserted by the derived_posture corner instance."

