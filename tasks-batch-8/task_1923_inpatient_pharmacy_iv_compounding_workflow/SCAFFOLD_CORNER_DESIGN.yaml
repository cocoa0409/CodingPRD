              as: PharmacyAdmin
              captures: { pres_b: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat NP", date_of_birth: "1996-08-01T00:00:00Z", sex: "M", height_cm: 180.0, weight_kg: 80.0, scr_mg_dl: 0.9 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugNP", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "PO", ordered_dose_mg: 100.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_a}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/medication-orders/${ord_id}/discontinue"
              payload: { reason: "not mine" }
              as: Prescriber
              as_user_id: "${pres_b}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_ORDER_PRESCRIBER (403); order remains PENDING"

