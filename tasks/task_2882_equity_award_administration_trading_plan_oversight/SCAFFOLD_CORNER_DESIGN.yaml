  # ===========================================================================
  - section: calculations
    instances:

      - name: calc_mobility_allocation_precision_round_then_sum
        claim_type: precision
        grounds:
          - calculations.mobility_tax_allocation
          - entities.TaxAllocation.fields.allocation_bps
          - entities.TaxAllocation.fields.tax_amount_cents
        excluded_because:
          difficulty_instance: combinatorial_formula / mobility_allocation_round_then_sum
          rationale: "The named 1.8 instance pins a three-jurisdiction 3/2/2 workday split whose largest-remainder allocation (4286/2857/2857 bps) and round-then-sum total (2296574 cents, one cent below the sum-then-round result) already assert both the remainder ordering and the pinned rounding order."

      - name: calc_withholding_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.withholding_mechanics
          - entities.VestingEvent.fields.shares_withheld
          - entities.VestingEvent.fields.shares_sold
        excluded_because:
          difficulty_instance: dual_variant_calc / withholding_method_divergence_share_withhold_vs_sell_to_cover
          rationale: "The named 1.8 instance settles two identical 1000-share events under SHARE_WITHHOLD and SELL_TO_COVER and asserts the divergence (400/0/0 versus 0/403/4925) plus the delta of 3 shares."

      - name: calc_burn_rate_gate_at_exact_limit
        claim_type: correct_result
        grounds:
          - calculations.burn_rate_variants
          - validations[priority=75]
          - errors[ERR_BURN_RATE_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: boundary_precision_check / burn_rate_exactly_at_limit_allowed
          rationale: "The named 1.8 instance approves a grant that lands exactly on the 100 bps limit (10000 shares of 1000000 outstanding), asserts headroom_shares 0, and then rejects a one-share grant - the threshold-1 / threshold / threshold+1 triple for this gate."

      - name: fungible_weighting_applies_to_full_value_awards_only
        claim_type: input_set_filtering
        grounds:
          - calculations.fungible_weighted_shares
          - entities.EquityPlan.fields.fungible_ratio_full_value_bps
          - entities.Grant.fields.weighted_reserve_shares
          - state_machines.Grant.PENDING_APPROVAL_to_APPROVED
        distinguishing_aspect: |
          With fungible_ratio_full_value_bps 15000, an RSU grant of 1000 shares commits 1500
          weighted shares while an NSO grant of the same 1000 shares commits exactly 1000:
          the ratio is applied only to the FULL_VALUE_AWARD_TYPES set, so the plan's committed
          total is 2500 (available_reserve_shares 997500), not 3000 and not 2000.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T09:00:00Z; ACTIVE plan with 1000000 authorized shares, 1000000 common shares outstanding and fungible_ratio_full_value_bps 15000."
            - "One ACTIVE participant; two DRAFT grants of 1000 target shares each - one RSU and one NSO at exercise_price_cents 2500 - each with a single TIME tranche of 1000 shares, both submitted by admin-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
