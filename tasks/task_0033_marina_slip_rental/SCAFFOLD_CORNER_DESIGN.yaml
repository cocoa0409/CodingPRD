scaffold_corner_design:

  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: marina_create_returns_201_with_all_required_fields
        claim_type: creation
        grounds: [entities.Marina, endpoints.POST_/marinas]
        distinguishing_aspect: "POST /marinas with all required fields returns 201 + Marina envelope; liveaboard_current_count defaults to 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /marinas"
              payload: { name: "MA", harbor_code: "MAA", liveaboard_cap: 5 }
              as: HarborMaster
              captures: { mar_id: $.data.id, v: $.data.version }
          assert:
            - "trigger response http_status == 201"
            - "Marina.${mar_id}.liveaboard_current_count == 0"
            - "Marina.${mar_id}.version == 1"

      - name: marina_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Marina
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /marinas/{id} for non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /marinas/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HarborMaster
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == \"ERR_NOT_FOUND\""
            - "trigger response http_status == 404"

      - name: marina_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Marina.fields.harbor_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /marinas without harbor_code returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /marinas"
              payload: { name: "Missing Code", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == \"ERR_INVALID_REQUEST\""

      - name: slip_create_defaults_status_to_available
        claim_type: defaults
        grounds: [entities.Slip.fields.status, entities.Slip.fields.pumpout_available, entities.Slip.fields.liveaboard_allowed]
        distinguishing_aspect: "Slip created via POST /marinas/{id}/slips defaults status=AVAILABLE, pumpout_available=false, liveaboard_allowed=false when omitted."
        test_recipe:
          setup: ["Marina exists."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "DefaultM", harbor_code: "DEF", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
          trigger:
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "D-1", length_ft: 30, beam_ft: 10, power_amp: "A30", base_daily_rate_cents: 2000 }
              as: HarborMaster
              captures: { slip_id: $.data.id }
          assert:
            - "Slip.${slip_id}.status == \"AVAILABLE\""
            - "Slip.${slip_id}.pumpout_available == false"
            - "Slip.${slip_id}.liveaboard_allowed == false"

      - name: tenant_initial_liveaboard_status_is_none
        claim_type: defaults
        grounds: [entities.Tenant.fields.liveaboard_status, state_machines.Tenant]
        distinguishing_aspect: "Newly created Tenant.liveaboard_status defaults to NONE."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /tenants"
              payload: { email: "newtenant@x.com", full_name: "New T" }
              as: HarborMaster
              captures: { t_id: $.data.id }
          assert:
            - "Tenant.${t_id}.liveaboard_status == \"NONE\""

      - name: slip_status_is_computed_not_writable
        claim_type: computed_fields
        grounds: [entities.Slip.fields.status]
        distinguishing_aspect: "Slip.status is source=computed; POST /marinas/{id}/slips ignores client-supplied status."
        test_recipe:
          setup: ["Marina exists."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "ComputeM", harbor_code: "CMP", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
          trigger:
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "C-1", length_ft: 30, beam_ft: 10, power_amp: "A30", base_daily_rate_cents: 2000 }
              as: HarborMaster
              captures: { slip_id: $.data.id }
          assert:
            - "Slip.${slip_id}.status == \"AVAILABLE\""

      - name: list_marinas_returns_pagination_envelope
        claim_type: listing
        grounds: [entities.Marina, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /marinas returns array response_type with pagination meta — total_count, has_more, limit, offset."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "L1", harbor_code: "LL1", liveaboard_cap: 1 }
              as: HarborMaster
            - call: "POST /marinas"
              payload: { name: "L2", harbor_code: "LL2", liveaboard_cap: 1 }
              as: HarborMaster
          trigger:
            - call: "GET /marinas"
              payload: {}
              as: HarborMaster
          assert:
            - "response_envelope.response_type == \"array\""
            - "meta includes pagination fields total_count, has_more"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: lease_cancel_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Lease
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /leases/{id}/cancel on a Lease in ACTIVE state returns ERR_INVALID_STATE (cancel only valid from RESERVED)."
        test_recipe:
          setup:
            - "Lease L_X in ACTIVE state."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "MX", harbor_code: "MXX", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "X-1", length_ft: 50, beam_ft: 15, power_amp: "A50", base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "tx2@x.com", full_name: "TX2" }
              as: HarborMaster
              captures: { tx_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${tx_id}", name: "VX2", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PX2", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${tx_id}"
              captures: { vx_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${tx_id}", vessel_id: "${vx_id}", start_date: "2026-07-10", end_date: "2026-07-15", expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${tx_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases/${lease_id}/check-in"
              payload: {}
              as: MarinaStaff
          trigger:
            - call: "POST /leases/${lease_id}/cancel"
              payload: {}
              as: Tenant
              as_user_id: "${tx_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == \"ERR_INVALID_STATE\""

      - name: terminal_state_ended_locks_lease
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Lease.terminal_states]
        distinguishing_aspect: "A Lease in ENDED (terminal) rejects every transition (check-in, check-out, cancel) with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Lease L_T checked-in then checked-out (now ENDED)."
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "MTERM", harbor_code: "MTE", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "T-1", length_ft: 50, beam_ft: 15, power_amp: "A50", base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "tt@x.com", full_name: "TT" }
              as: HarborMaster
              captures: { tt_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${tt_id}", name: "VT", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PT", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${tt_id}"
              captures: { vt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${tt_id}", vessel_id: "${vt_id}", start_date: "2026-07-10", end_date: "2026-07-12", expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${tt_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases/${lease_id}/check-in"
              payload: {}
              as: MarinaStaff
            - call: "POST /leases/${lease_id}/check-out"
              payload: {}
              as: MarinaStaff
          trigger:
            - call: "POST /leases/${lease_id}/check-in"
              payload: {}
              as: MarinaStaff
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == \"ERR_INVALID_STATE\""

      - name: slip_decommission_blocked_when_reserved_or_active_lease_exists
        claim_type: precondition_enforcement
        grounds: [state_machines.Slip.AVAILABLE_to_OUT_OF_SERVICE]
        distinguishing_aspect: "Decommission rejected when slip has a RESERVED lease; ERR_INVALID_STATE because Slip.status != AVAILABLE."
        test_recipe:
          setup: ["Slip currently RESERVED (lease reserved but not checked in)."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "MDEC", harbor_code: "MDC", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "D-1", length_ft: 50, beam_ft: 15, power_amp: "A50", base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "tdec@x.com", full_name: "TDec" }
              as: HarborMaster
              captures: { td_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${td_id}", name: "VD", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PD", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${td_id}"
              captures: { vd_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${td_id}", vessel_id: "${vd_id}", start_date: "2026-07-10", end_date: "2026-07-12", expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${td_id}"
          trigger:
            - call: "POST /slips/${slip_id}/decommission"
              payload: {}
              as: HarborMaster
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == \"ERR_INVALID_STATE\""

      - name: waitlist_expire_stale_moves_old_entries_to_expired
        claim_type: valid_transition
        grounds: [state_machines.TransferWaitlistEntry.QUEUED_to_EXPIRED]
        distinguishing_aspect: "POST /transfer-waitlist/expire-stale transitions QUEUED entries whose age >= WAITLIST_TTL_DAYS to EXPIRED."
        test_recipe:
          setup: ["Waitlist entry created at 2026-07-01; clock advanced 60 days."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "MEXP", harbor_code: "MEX", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "E-1", length_ft: 50, beam_ft: 15, power_amp: "A50", base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_a_id: $.data.id, slip_a_v0: $.data.version }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "E-2", length_ft: 50, beam_ft: 15, power_amp: "A50", base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_b_id: $.data.id }
            - call: "POST /tenants"
              payload: { email: "tex@x.com", full_name: "TEx" }
              as: HarborMaster
              captures: { te_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${te_id}", name: "VE", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PE", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${te_id}"
              captures: { ve_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_a_id}", tenant_id: "${te_id}", vessel_id: "${ve_id}", start_date: "2026-07-10", end_date: "2026-12-31", expected_slip_version: "${slip_a_v0}" }
              as: Tenant
              as_user_id: "${te_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases/${lease_id}/check-in"
              payload: {}
              as: MarinaStaff
            - call: "POST /transfer-waitlist"
              payload: { marina_id: "${mar_id}", tenant_id: "${te_id}", from_lease_id: "${lease_id}", target_slip_id: "${slip_b_id}" }
              as: Tenant
              as_user_id: "${te_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: HarborMaster
          trigger:
            - call: "POST /transfer-waitlist/expire-stale"
              payload: {}
              as: HarborMaster
          assert:
            - "TransferWaitlistEntry.${wl_id}.status == \"EXPIRED\""

      - name: error_cycle_revoked_to_pending_already_covered
        claim_type: valid_transition
        grounds: [state_machines.Tenant.REVOKED_to_PENDING]
        excluded_because:
          difficulty_instance: non_linear_state_machine / tenant_liveaboard_cycle_revoked_to_pending
          rationale: "Cycle transition is the asserted observable of the named §1.8 instance."

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: pumpout_charge_zero_when_slip_has_integrated_pumpout
        claim_type: correct_result
        grounds: [calculations.pumpout_charge]
        distinguishing_aspect: "PumpOutRequest completed on a slip with pumpout_available=true pins charge_cents=0."
        test_recipe:
          setup: ["Slip with pumpout_available=true; ACTIVE lease."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "MPO", harbor_code: "MPO", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "P-1", length_ft: 50, beam_ft: 15, power_amp: "A50", pumpout_available: true, base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "tpo@x.com", full_name: "TPO" }
              as: HarborMaster
              captures: { tp_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${tp_id}", name: "VPO", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PPO", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${tp_id}"
              captures: { vp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${tp_id}", vessel_id: "${vp_id}", start_date: "2026-07-10", end_date: "2026-07-15", expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${tp_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases/${lease_id}/check-in"
              payload: {}
              as: MarinaStaff
            - call: "POST /pump-out-requests"
              payload: { lease_id: "${lease_id}" }
              as: Tenant
              as_user_id: "${tp_id}"
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /pump-out-requests/${po_id}/complete"
              payload: {}
              as: MarinaStaff
          assert:
            - "PumpOutRequest.${po_id}.charge_cents == 0"
            - "PumpOutRequest.${po_id}.status == \"COMPLETED\""

      - name: pumpout_charge_portable_when_no_integrated_pumpout
        claim_type: correct_result
        grounds: [calculations.pumpout_charge.constants.PUMPOUT_PORTABLE_FEE_CENTS]
        distinguishing_aspect: "PumpOutRequest completed on a slip with pumpout_available=false pins charge_cents=PUMPOUT_PORTABLE_FEE_CENTS (2500)."
        test_recipe:
          setup: ["Slip with pumpout_available=false; ACTIVE lease."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "MPF", harbor_code: "MPF", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "PF-1", length_ft: 50, beam_ft: 15, power_amp: "A50", pumpout_available: false, base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "tpf@x.com", full_name: "TPF" }
              as: HarborMaster
              captures: { tp_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${tp_id}", name: "VPF", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PPF", insurance_expires_on: "2027-01-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${tp_id}"
              captures: { vp_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${tp_id}", vessel_id: "${vp_id}", start_date: "2026-07-10", end_date: "2026-07-15", expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${tp_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases/${lease_id}/check-in"
              payload: {}
              as: MarinaStaff
            - call: "POST /pump-out-requests"
              payload: { lease_id: "${lease_id}" }
              as: Tenant
              as_user_id: "${tp_id}"
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /pump-out-requests/${po_id}/complete"
              payload: {}
              as: MarinaStaff
          assert:
            - "PumpOutRequest.${po_id}.charge_cents == 2500"

      - name: winter_pricing_below_base
        claim_type: input_set_filtering
        grounds: [calculations.seasonal_lease_pricing]
        distinguishing_aspect: "Lease.start_date 2026-01-15 falls outside SUMMER window so WINTER multiplier 0.80 applies: 5000 * 0.80 = 4000 (no liveaboard)."
        test_recipe:
          setup: ["Slip base_daily_rate_cents=5000; lease 3 nights WINTER 2026-01-15..2026-01-18."]
          setup_api_calls:
            - call: "POST /marinas"
              payload: { name: "MWN", harbor_code: "MWN", liveaboard_cap: 1 }
              as: HarborMaster
              captures: { mar_id: $.data.id }
            - call: "POST /marinas/${mar_id}/slips"
              payload: { slip_number: "W-1", length_ft: 50, beam_ft: 15, power_amp: "A50", base_daily_rate_cents: 5000 }
              as: HarborMaster
              captures: { slip_id: $.data.id, slip_v0: $.data.version }
            - call: "POST /tenants"
              payload: { email: "twn@x.com", full_name: "TWN" }
              as: HarborMaster
              captures: { tw_id: $.data.id }
            - call: "POST /vessels"
              payload: { tenant_id: "${tw_id}", name: "VWN", loa_ft: 40, beam_ft: 12, insurance_policy_number: "PWN", insurance_expires_on: "2027-06-01", insurance_coverage_cents: 6000000 }
              as: Tenant
              as_user_id: "${tw_id}"
              captures: { vw_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: HarborMaster
            - call: "POST /leases"
              payload: { marina_id: "${mar_id}", slip_id: "${slip_id}", tenant_id: "${tw_id}", vessel_id: "${vw_id}", start_date: "2026-01-15", end_date: "2026-01-18", expected_slip_version: "${slip_v0}" }
              as: Tenant
              as_user_id: "${tw_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: HarborMaster
          trigger:
            - call: "POST /leases/${lease_id}/check-in"
              payload: {}
              as: MarinaStaff
          assert:
            - "Lease.${lease_id}.nightly_rate_cents == 4000"
            - "Lease.${lease_id}.total_cost_cents == 12000"

