  - section: validations
    instances:
      - name: developer_create_missing_auth_header_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails priority-1 authentication with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) regardless of payload validity."
        test_recipe:
          setup: ["Empty system"]
          setup_api_calls: []
          trigger:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (HTTP 400)"
            - "No Developer is persisted"

      - name: deposit_ownership_violation_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_RESOURCE_OWNERSHIP]"]
        distinguishing_aspect: "A Developer-role caller whose X-User-ID is a different developer's id cannot post deposits to the first developer's project."
        test_recipe:
          setup: ["Developers A and B onboarded; A's project P1 SUBMITTED (10 MW, required 1000000)"]
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "a@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_a: $.data.id }
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Beta Power Co", contact_email: "q@beta.example", developer_type: "UTILITY_SCALE" }
              as: QueueAdministrator
              captures: { dev_b: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_a}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_a}"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 100000 }
              as: Developer
              as_user_id: "${dev_b}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN_RESOURCE_OWNERSHIP (HTTP 403)"
            - "Project.${p1_id}.deposit_posted_cents remains 0"

      - name: deposit_overpayment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DEPOSIT_OVERPAYMENT]"]
        distinguishing_aspect: "A deposit that would push deposit_posted_cents above deposit_required_cents is rejected with 422 ERR_DEPOSIT_OVERPAYMENT; the ledger is unchanged."
        test_recipe:
          setup: ["P1 10 MW SOLAR SUBMITTED (required 1000000), 600000 already posted"]
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 600000 }
              as: Developer
              as_user_id: "${dev_id}"
          trigger:
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 400001 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err: $.data.error_id }
            - call: "GET /interconnection/projects/${p1_id}"
              as: QueueAdministrator
              captures: { posted: $.data.deposit_posted_cents }
          assert:
            - "${err} == ERR_DEPOSIT_OVERPAYMENT (HTTP 422; 600000 + 400001 > 1000000)"
            - "${posted} == 600000 (rejected deposit did not apply)"

      - name: milestone_submission_conflict_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_MILESTONE_SUBMISSION_CONFLICT]"]
        distinguishing_aspect: "A second SITE_CONTROL submission while one is PENDING_REVIEW for the same project is rejected; the uniqueness scope is (project_id, milestone_type) over PENDING_REVIEW/ACCEPTED."
        test_recipe:
          setup: ["QUEUED project with a SITE_CONTROL submission PENDING_REVIEW"]
          setup_api_calls:
            - call: "POST /interconnection/developers"
