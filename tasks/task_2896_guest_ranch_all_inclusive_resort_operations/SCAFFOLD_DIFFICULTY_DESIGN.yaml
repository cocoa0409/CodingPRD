# Task 2896 — Guest Ranch & All-Inclusive Resort Operations
# §1.8 Scaffold Difficulty Design (Test Targeting Index).
# Nine §0.5 rule_id blocks; every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only.
# All money literals are integer cents produced by executing the §1.3 formulas.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: package_total_provisional_at_hold_vs_final_at_early_checkout
        grounds:
          - calculations.package_charge_total
          - calculations.folio_settlement_amount
          - entities.Booking.fields.provisional_package_total_cents
          - entities.Booking.fields.realized_subtotal_cents
          - state_machines.Booking.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: |
          The dual variant lives on the Booking money domain: identical contract data priced by
          variant provisional_at_hold (7 contracted nights, los_discount_pct 0.00) yields
          1258691 cents, while variant final_at_checkout on the same booking after a 5-night
          realized stay yields 899065 cents — a divergence of 359626 cents that only the
          nights input differs on.
        test_recipe:
          setup:
            - "logical clock starts at the mandated default 2026-08-01T00:00:00Z"
            - "one IN_SEASON season with SUNDAY arrivals, 7..21 nights, deposit_pct 0.30 and the CLASSIC tier at 68500 cents adult nightly / 0.375 child discount / 15000 cents activity credit"
            - "one cabin with bed_capacity 4 and a party of two adults plus one child"
            - "booking 2026-10-11 -> 2026-10-18 (7 contracted nights) confirmed with its full deposit paid"
            - "party checks in on 2026-10-11 and departs early on 2026-10-16, so realized_nights is 5"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }, { code: "SIGNATURE", adult_nightly_rate_cents: 92000, child_discount_pct: 0.25, included_activity_credit_cents: 40000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "IN_SEASON" }
              as: RanchManager
            - call: "POST /cabins"
              payload: { name: "Aspen", bed_capacity: 4 }
              as: RanchManager
              captures: { cabin_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ben Adult", birth_date: "1983-07-11", weight_lb: 190 }
              as: ReservationsAgent
              captures: { g_a2: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Cal Child", birth_date: "2016-05-20", weight_lb: 95 }
              as: ReservationsAgent
              captures: { g_c1: $.data.id }
            - call: "POST /bookings"
              payload: { season_id: "${season_id}", cabin_id: "${cabin_id}", lead_guest_id: "${g_a1}", package_tier_code: "CLASSIC", arrival_date: "2026-10-11", departure_date: "2026-10-18", party_members: [{ guest_id: "${g_a1}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_a2}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_c1}", member_type: "CHILD", dietary_restrictions: ["NONE"] }] }
              as: ReservationsAgent
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 377607 }
              as: ReservationsAgent
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: ReservationsAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-11T16:00:00Z" }
              as: RanchManager
            - call: "POST /bookings/${booking_id}/check-in"
              payload: { dietary_briefing_ack: true }
              as: ReservationsAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T14:00:00Z" }
              as: RanchManager
          trigger:
            - call: "POST /bookings/${booking_id}/check-out"
              payload: { settle_payment_cents: 683290 }
              as: ReservationsAgent
          assert:
            - "Booking.${booking_id}.provisional_package_total_cents == 1258691"
            - "Booking.${booking_id}.deposit_required_cents == 377607"
            - "Booking.${booking_id}.realized_nights == 5"
            - "Booking.${booking_id}.realized_subtotal_cents == 899065"
            - "Booking.${booking_id}.gratuity_cents == 161832"
            - "Booking.${booking_id}.final_folio_total_cents == 1060897"
            - "Booking.${booking_id}.folio_balance_cents == 0"
            - "Booking.${booking_id}.provisional_package_total_cents - Booking.${booking_id}.realized_subtotal_cents == 359626"

      - name: retention_bonus_projected_vs_settled_below_vesting_cliff
        grounds:
          - calculations.retention_bonus
          - entities.StaffMember.fields.retention_bonus_projected_cents
          - entities.StaffMember.fields.retention_bonus_settled_cents
          - state_machines.StaffMember.ACTIVE_to_DEPARTED_EARLY
          - entities.Season.fields.retention_bonus_liability_cents
        distinguishing_aspect: |
          The second dual variant sits on a different entity domain — seasonal staff payroll, not
          booking money: with days_worked 45 of contract_days 92 the projected variant reports
          58696 cents while the settled variant collapses to 0 cents because 45*2 < 92 fails the
          50% vesting cliff.
        test_recipe:
          setup:
            - "one season carrying retention_bonus_cents 120000"
            - "one staff member hired 2026-08-15 on a contract ending 2026-11-15 (contract_days 92), onboarded into housing"
            - "logical clock advanced to 2026-09-29, exactly 45 contract days worked"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/staff-members"
              payload: { full_name: "Gus Guide", role_type: "GUIDE", certifications: ["EQUINE_HANDLER", "WILDERNESS_FIRST_AID"], hired_on: "2026-08-15", contract_end_date: "2026-11-15" }
              as: RanchManager
              captures: { staff_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T09:00:00Z" }
              as: RanchManager
            - call: "POST /staff-members/${staff_id}/onboard"
              payload: { housing_unit_code: "BUNKHOUSE-A", housing_bunk_number: 3 }
              as: RanchManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-29T10:00:00Z" }
              as: RanchManager
            - call: "GET /staff-members/${staff_id}"
              payload: {}
              as: RanchManager
              captures: { projected_before: $.data.retention_bonus_projected_cents }
          trigger:
            - call: "POST /staff-members/${staff_id}/separate"
              payload: { reason: "family emergency" }
              as: RanchManager
          assert:
            - "StaffMember.${staff_id}.contract_days == 92"
            - "StaffMember.${staff_id}.days_worked == 45"
            - "${projected_before} == 58696"
            - "StaffMember.${staff_id}.retention_bonus_settled_cents == 0"
            - "StaffMember.${staff_id}.employment_status == DEPARTED_EARLY"
            - "StaffMember.${staff_id}.separated_on == 2026-09-29"
            - "Season.${season_id}.retention_bonus_liability_cents == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: package_total_rounds_each_member_line_before_summing
        mode: b
        grounds:
          - calculations.package_charge_total
          - calculations.package_charge_total.rounding
          - entities.Season.fields.package_tiers
          - entities.Booking.fields.provisional_package_total_cents
        distinguishing_aspect: |
          Mode (b) — the same three factors (adult nightly rate, child discount, nights) can be
          combined in two arithmetic orders. The pinned order rounds the child nightly rate to
          whole cents first (68500 * (1 - 0.375) = 42812.5 -> 42813), multiplies by nights, and
          then sums the member lines, giving 1258691. Rounding once at the end of a single fused
          expression gives 1258688. The 3-cent gap is only reachable with a child discount whose
          product lands on a half-cent, so a naive implementation cannot hide.
        test_recipe:
          setup:
            - "OPEN season with CLASSIC tier adult_nightly_rate_cents 68500 and child_discount_pct 0.375"
            - "one cabin, two adult guests and one child guest"
            - "a 7-night CLASSIC hold, which is the length-of-stay band with surcharge_pct 0.00 so only the rounding order can move the number"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
            - call: "POST /cabins"
              payload: { name: "Aspen", bed_capacity: 4 }
              as: RanchManager
              captures: { cabin_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ben Adult", birth_date: "1983-07-11", weight_lb: 190 }
              as: ReservationsAgent
              captures: { g_a2: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Cal Child", birth_date: "2016-05-20", weight_lb: 95 }
              as: ReservationsAgent
              captures: { g_c1: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { season_id: "${season_id}", cabin_id: "${cabin_id}", lead_guest_id: "${g_a1}", package_tier_code: "CLASSIC", arrival_date: "2026-10-11", departure_date: "2026-10-18", party_members: [{ guest_id: "${g_a1}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_a2}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_c1}", member_type: "CHILD", dietary_restrictions: ["NONE"] }] }
              as: ReservationsAgent
              captures: { booking_id: $.data.id, provisional: $.data.provisional_package_total_cents }
          assert:
            - "${provisional} == 1258691"
            - "${provisional} != 1258688"
            - "Booking.${booking_id}.nights == 7"
            - "los_discount_pct resolves to 0.00 because nights <= LOS_BAND_1_MAX_NIGHTS 7, so no second multiplier masks the rounding order"
            - "Booking.${booking_id}.deposit_required_cents == 377607"

      - name: guide_staffing_requirement_is_max_of_three_independent_floors
        mode: a
        grounds:
          - calculations.guide_staffing_requirement
          - calculations.slot_readiness_posture
          - entities.ActivitySlot.fields.required_guide_count
          - entities.ActivitySlot.fields.terrain_grade
          - entities.Booking.fields.party_members
        distinguishing_aspect: |
          Mode (a) — a different combinatorial shape from the pricing instance: three independent
          floors (ability-mix ceiling, terrain floor, minor floor) are combined by max(), not by
          addition or by a single if/else ladder. Two MEADOW slots with the same rider count of
          three differ only in whether one rider is a minor: with the minor the answer is 2
          (minor floor wins), without the minor it is 1 (ability-mix ceiling wins). Summing the
          floors would give 3 and 2; taking only the first matching branch would give 1 and 1.
        test_recipe:
          setup:
            - "OPEN season, one cabin, two adult guests and one child guest, all three BEGINNER-assessed and waivered"
            - "one 7-night booking covering all three party members"
            - "slot MIX on 2026-10-12 15:00-17:00Z, MEADOW, min_ability_rank BEGINNER, capacity 6, mount_required false, holding all three riders including the minor"
            - "slot ADULTS on 2026-10-13 15:00-17:00Z, MEADOW, identical configuration, holding only the two adult riders (disjoint in time so no rider double-booking)"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026 Fall Season", arrival_weekday: "SUNDAY", season_start_date: "2026-09-06", season_end_date: "2026-11-15", min_stay_nights: 7, max_stay_nights: 21, deposit_pct: 0.30, buyout_premium_pct: 0.15, no_show_penalty_cents: 4500, retention_bonus_cents: 120000, dining_seat_capacity: 8, package_tiers: [{ code: "CLASSIC", adult_nightly_rate_cents: 68500, child_discount_pct: 0.375, included_activity_credit_cents: 15000 }] }
              as: RanchManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/advance"
              payload: { target_status: "OPEN" }
              as: RanchManager
            - call: "POST /cabins"
              payload: { name: "Aspen", bed_capacity: 4 }
              as: RanchManager
              captures: { cabin_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ann Adult", birth_date: "1985-04-02", weight_lb: 165 }
              as: ReservationsAgent
              captures: { g_a1: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ben Adult", birth_date: "1983-07-11", weight_lb: 190 }
              as: ReservationsAgent
              captures: { g_a2: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Cal Child", birth_date: "2016-05-20", weight_lb: 95 }
              as: ReservationsAgent
              captures: { g_c1: $.data.id }
            - call: "POST /guests/${g_a1}/waiver-signature"
              payload: { signed_on: "2026-08-01", equine_statute_ack: true }
              as: ReservationsAgent
            - call: "POST /guests/${g_a2}/waiver-signature"
              payload: { signed_on: "2026-08-01", equine_statute_ack: true }
              as: ReservationsAgent
            - call: "POST /guests/${g_c1}/waiver-signature"
              payload: { signed_on: "2026-08-01", equine_statute_ack: true, waiver_signed_by_guardian_guest_id: "${g_a1}" }
              as: ReservationsAgent
            - call: "GET /guests/${g_a1}"
              payload: {}
              as: HorseProgramDirector
              captures: { gv_a1: $.data.version }
            - call: "POST /guests/${g_a1}/rider-assessments"
              payload: { requested_ability: "BEGINNER", expected_guest_version: "${gv_a1}" }
              as: HorseProgramDirector
              captures: { ra_a1: $.data.id }
            - call: "POST /rider-assessments/${ra_a1}/evaluate"
              payload: { assessed_ability: "BEGINNER", assessed_by_note: "walk-trot in arena", evaluated_at: "2026-08-01T12:00:00Z" }
              as: HorseProgramDirector
            - call: "GET /guests/${g_a2}"
              payload: {}
              as: HorseProgramDirector
              captures: { gv_a2: $.data.version }
            - call: "POST /guests/${g_a2}/rider-assessments"
              payload: { requested_ability: "BEGINNER", expected_guest_version: "${gv_a2}" }
              as: HorseProgramDirector
              captures: { ra_a2: $.data.id }
            - call: "POST /rider-assessments/${ra_a2}/evaluate"
              payload: { assessed_ability: "BEGINNER", assessed_by_note: "walk-trot in arena", evaluated_at: "2026-08-01T12:00:00Z" }
              as: HorseProgramDirector
            - call: "GET /guests/${g_c1}"
              payload: {}
              as: HorseProgramDirector
              captures: { gv_c1: $.data.version }
            - call: "POST /guests/${g_c1}/rider-assessments"
              payload: { requested_ability: "BEGINNER", expected_guest_version: "${gv_c1}" }
              as: HorseProgramDirector
              captures: { ra_c1: $.data.id }
            - call: "POST /rider-assessments/${ra_c1}/evaluate"
              payload: { assessed_ability: "BEGINNER", assessed_by_note: "lead-line graduate", evaluated_at: "2026-08-01T12:00:00Z" }
              as: HorseProgramDirector
            - call: "POST /bookings"
              payload: { season_id: "${season_id}", cabin_id: "${cabin_id}", lead_guest_id: "${g_a1}", package_tier_code: "CLASSIC", arrival_date: "2026-10-11", departure_date: "2026-10-18", party_members: [{ guest_id: "${g_a1}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_a2}", member_type: "ADULT", dietary_restrictions: ["NONE"] }, { guest_id: "${g_c1}", member_type: "CHILD", dietary_restrictions: ["NONE"] }] }
              as: ReservationsAgent
              captures: { booking_id: $.data.id }
            - call: "POST /seasons/${season_id}/activity-slots"
              payload: { activity_type: "HIKE", starts_at: "2026-10-12T15:00:00Z", ends_at: "2026-10-12T17:00:00Z", terrain_grade: "MEADOW", min_ability_rank: "BEGINNER", capacity: 6, rider_surcharge_cents: 0, mount_required: false }
              as: RanchManager
