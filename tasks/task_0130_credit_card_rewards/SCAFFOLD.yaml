scenario: |
  Credit Card Rewards & Redemption: cashback categories (rotating quarterly, fixed
  bonus, baseline rate), signup bonus qualification (minimum spend within X days of
  account open), quarterly activation categories (must be activated within window
  to earn elevated rate), spending tiers (annual spend thresholds upgrade earning
  rate), points transfer to airlines/hotels (transfer partners with conversion
  ratios and minimum transfer increments), Statement Credit redemption (apply
  points as credit, minimum redemption thresholds, redemption value rates),
  expiration and forfeiture (points expire after inactivity period, forfeiture on
  account closure or delinquency).

domain_name: credit-card-rewards
api_prefix: /accounts

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - scheduled_deferred_actions
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Cardholder
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Unique cardholder email used for login lookup.
        constraints: "must be unique; lowercase RFC 5322"
      - name: display_name
        type: string
        source: input
        description: Human-readable name shown on receipts and statements.

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: cardholder_id
        type: string
        source: input
        description: FK to Cardholder.id.
      - name: opened_at
        type: datetime
        source: system
        description: Account open timestamp (ISO 8601, UTC, 3 fractional digits).
      - name: lifecycle_state
        type: enum
        source: computed
        description: Current account lifecycle state.
        default: ACTIVE
        constraints: "one of {ACTIVE, DELINQUENT, CLOSED}"
      - name: spending_tier
        type: enum
        source: computed
        description: Annual-spend driven tier (parallel to lifecycle_state).
        default: STANDARD
        constraints: "one of {STANDARD, GOLD, PLATINUM}"
      - name: ytd_qualifying_spend_cents
        type: integer
        source: computed
        description: Sum of POSTED purchase Transaction.amount_cents (refunds netted) since current calendar year start (Jan 1 UTC).
        default: 0
      - name: points_balance
        type: integer
        source: computed
        description: Currently spendable point balance (non-expired, non-forfeited, non-pending-transfer).
        default: 0
      - name: signup_bonus_state
        type: enum
        source: computed
        description: Lifecycle of the one-time signup bonus offer attached at account open.
        default: PENDING
        constraints: "one of {PENDING, QUALIFIED, AWARDED, EXPIRED, FORFEITED}"
      - name: signup_bonus_qualifying_spend_cents
        type: integer
        source: computed
        description: Sum of POSTED purchase amounts (refunds netted) inside the signup window.
        default: 0
      - name: signup_bonus_deadline_at
        type: datetime
        source: system
        description: opened_at + SIGNUP_WINDOW_DAYS (90 days). After this instant unqualified bonuses transition to EXPIRED.
      - name: last_qualifying_activity_at
        type: datetime
        source: computed
        description: Timestamp of most recent POSTED purchase, redemption, or transfer; drives points expiration.

  - name: CashbackCategory
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Unique category code (e.g., "GROCERY", "GAS", "DINING", "BASE").
        constraints: "uppercase A-Z and underscore; unique"
      - name: category_type
        type: enum
        source: input
        description: Kind of category, controls eligibility and activation requirement.
        constraints: "one of {BASELINE, FIXED_BONUS, ROTATING_QUARTERLY}"
      - name: base_rate_bps
        type: integer
        source: input
        description: Earn rate in basis points before tier multipliers (e.g., 100 = 1.00%, 500 = 5.00%).
        constraints: "0 <= base_rate_bps <= 10000"
      - name: requires_activation
        type: boolean
        source: input
        description: True iff category_type == ROTATING_QUARTERLY.

  - name: QuarterlyActivation
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: FK to Account.id.
      - name: category_id
        type: string
        source: input
        description: FK to CashbackCategory.id where category_type == ROTATING_QUARTERLY.
      - name: quarter_label
        type: string
        source: input
        description: Calendar quarter the activation grants elevated rate (e.g., "2026Q2").
        constraints: 'matches /^\d{4}Q[1-4]$/'
      - name: activation_window_start
        type: datetime
        source: system
        description: Inclusive start of the quarter (UTC midnight on first day of quarter).
      - name: activation_window_end
        type: datetime
        source: system
        description: Exclusive end of the quarter (UTC midnight on first day of NEXT quarter).
      - name: activated_at
        type: datetime
        source: system
        description: Timestamp activation was confirmed.

  - name: Transaction
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK to Account.id.
      - name: category_id
        type: string
        source: input
        description: FK to CashbackCategory.id — the merchant-classified category at time of post.
      - name: txn_type
        type: enum
        source: input
        description: Direction of the transaction.
        constraints: "one of {PURCHASE, REFUND}"
      - name: amount_cents
        type: integer
        source: input
        description: Absolute (always non-negative) cents amount. txn_type encodes sign.
        constraints: "amount_cents >= 1"
      - name: posted_at
        type: datetime
        source: system
        description: Server-minted posting time; drives signup window, quarter, and expiration anchors.
      - name: status
        type: enum
        source: computed
        description: Lifecycle of the transaction.
        default: POSTED
        constraints: "one of {POSTED, REVERSED}"
      - name: points_provisional
        type: integer
        source: computed
        description: Points awarded at post time using the rate effective at posted_at (provisional, see §1.3 calc_points_provisional).
      - name: points_final
        type: integer
        source: computed
        description: Points after refund netting and tier-upgrade backfill at calendar-month statement close.
        default: 0

  - name: TransferPartner
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Unique partner code (e.g., "AIR_BLUE", "HOTEL_PINE").
        constraints: "uppercase A-Z, digit, underscore; unique"
      - name: partner_type
        type: enum
        source: input
        description: Domain of the partner.
        constraints: "one of {AIRLINE, HOTEL}"
      - name: conversion_ratio_points_per_unit
        type: integer
        source: input
        description: Points needed per 1 partner-currency-unit (e.g., 2 = 2 points -> 1 mile).
        constraints: "conversion_ratio_points_per_unit >= 1"
      - name: min_transfer_increment
        type: integer
        source: input
        description: Minimum number of partner-currency units per transfer; transfer must be an integer multiple of this increment.
        constraints: "min_transfer_increment >= 1"
      - name: is_active
        type: boolean
        source: input
        description: Whether new transfers may be initiated to this partner.
        default: true

  - name: PointsTransfer
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: FK to Account.id.
      - name: partner_id
        type: string
        source: input
        description: FK to TransferPartner.id.
      - name: requested_partner_units
        type: integer
        source: input
        description: Number of partner-currency units to deliver (e.g., miles, hotel points).
      - name: points_debited
        type: integer
        source: computed
        description: Cardholder points spent = requested_partner_units * partner.conversion_ratio_points_per_unit.
      - name: status
        type: enum
        source: computed
        description: Lifecycle of the transfer.
        default: PENDING
        constraints: "one of {PENDING, COMPLETED, REVERSED}"
      - name: initiated_at
        type: datetime
        source: system
        description: Time the request was accepted.
      - name: completed_at
        type: datetime
        source: computed
        description: Time the partner confirmed (null until COMPLETED).

  - name: StatementCredit
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: FK to Account.id.
      - name: redemption_mode
        type: enum
        source: input
        description: Whether the cardholder named points spent or USD wanted.
        constraints: "one of {POINTS_FIRST, AMOUNT_FIRST}"
      - name: requested_points
        type: integer
        source: input
        description: When redemption_mode == POINTS_FIRST; else null.
      - name: requested_amount_cents
        type: integer
        source: input
        description: When redemption_mode == AMOUNT_FIRST; else null.
      - name: points_debited
        type: integer
        source: computed
        description: Final points subtracted from Account.points_balance.
      - name: credit_amount_cents
        type: integer
        source: computed
        description: Final USD cents credited to the account.
      - name: applied_at
        type: datetime
        source: system
        description: Time credit applied.
      - name: status
        type: enum
        source: computed
        description: Lifecycle of the credit.
        default: APPLIED
        constraints: "one of {APPLIED, REVERSED}"

  - name: PointsLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: FK to Account.id.
      - name: entry_type
        type: enum
        source: input
        description: Kind of points movement.
        constraints: "one of {EARN, EARN_ADJUST, SIGNUP_BONUS, TRANSFER_DEBIT, TRANSFER_REVERSE, REDEEM_DEBIT, REDEEM_REVERSE, EXPIRE, FORFEIT}"
      - name: source_entity_type
        type: enum
        source: input
        description: Entity that produced this entry.
        constraints: "one of {Transaction, PointsTransfer, StatementCredit, Account, System}"
      - name: source_entity_id
        type: string
        source: input
        description: id of the originating entity (or null when source_entity_type == System).
      - name: delta_points
        type: integer
        source: input
        description: Signed change in points balance (positive = credit to cardholder, negative = debit).
      - name: occurred_at
        type: datetime
        source: system
        description: Ledger entry timestamp.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    note: |
      Account has two parallel state dimensions: lifecycle_state (ACTIVE/DELINQUENT/CLOSED) and
      spending_tier (STANDARD/GOLD/PLATINUM). The two dimensions evolve independently — a
      DELINQUENT account does not lose its tier, and a tier upgrade does not change lifecycle.
      Below transitions cover lifecycle_state only; tier transitions are listed under the
      `spending_tier` axis further down.
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "POST /accounts/{id}/mark-delinquent (system or PlatformAdmin)"
        actor: PlatformAdmin
        preconditions:
          - "Account.lifecycle_state == ACTIVE"
        side_effects:
          - "Any PENDING PointsTransfer on this account is REVERSED (cascade hop 1)"
          - "On each REVERSE, a TRANSFER_REVERSE PointsLedgerEntry restores debited points (cascade hop 2)"
          - "Recompute Account.points_balance from the ledger (cascade hop 3)"
          - "All future earn calculations (calc_points_provisional) on this account return 0 until ACTIVE is restored"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "POST /accounts/{id}/clear-delinquency"
        actor: PlatformAdmin
        preconditions:
          - "Account.lifecycle_state == DELINQUENT"
        side_effects:
          - "Earn calculation re-enabled going forward; no retroactive backfill for transactions posted while DELINQUENT"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: Cardholder | PlatformAdmin
        preconditions:
          - "Account.lifecycle_state == ACTIVE"
          - "No PointsTransfer with status == PENDING"
        side_effects:
          - "All non-forfeited points are FORFEITED via a FORFEIT ledger entry equal to -points_balance (cascade hop 1)"
          - "Account.points_balance recomputed to 0 (cascade hop 2)"
          - "All future earn / redeem / transfer endpoints reject with ERR_ACCOUNT_CLOSED (cascade hop 3)"
          - "signup_bonus_state, if not AWARDED, transitions to FORFEITED"
      - from: DELINQUENT
        to: CLOSED
        trigger: "POST /accounts/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "Account.lifecycle_state == DELINQUENT"
        side_effects:
          - "Same forfeiture chain as ACTIVE -> CLOSED"

  - entity: Account
    initial_state: STANDARD
    terminal_states: []
    note: |
      Parallel dimension on Account: spending_tier. Driven by ytd_qualifying_spend_cents
      crossing thresholds during purchase posting; resets each January 1 UTC via a system
      transition triggered by POST /_sweep/year-rollover.
    transitions:
      - from: STANDARD
        to: GOLD
        trigger: "POST /transactions whose post brings ytd_qualifying_spend_cents >= TIER_GOLD_THRESHOLD_CENTS (600000)"
        actor: system
        preconditions:
          - "Account.lifecycle_state == ACTIVE"
          - "Pre-post tier == STANDARD"
        side_effects:
          - "spending_tier := GOLD effective for subsequent posts"
          - "Triggers calc_points_final backfill for already-POSTED purchases in the current calendar month (cascade hop 1)"
          - "For each affected Transaction, an EARN_ADJUST PointsLedgerEntry is appended with delta = (final - provisional) (cascade hop 2)"
          - "Account.points_balance recomputed (cascade hop 3)"
      - from: GOLD
        to: PLATINUM
        trigger: "POST /transactions whose post brings ytd_qualifying_spend_cents >= TIER_PLATINUM_THRESHOLD_CENTS (1500000)"
        actor: system
        preconditions:
          - "Account.lifecycle_state == ACTIVE"
          - "Pre-post tier == GOLD"
        side_effects:
          - "spending_tier := PLATINUM"
          - "Same current-month EARN_ADJUST backfill chain as GOLD upgrade"
      - from: GOLD
        to: STANDARD
        trigger: "POST /_sweep/year-rollover (system, runs once per year on Jan 1 UTC)"
        actor: system
        preconditions:
          - "new calendar year started (clock advance crossed Jan 1 00:00:00 UTC)"
        side_effects:
          - "ytd_qualifying_spend_cents := 0"
          - "spending_tier := STANDARD (no compensating ledger entry; tier downgrade does NOT claw back already-earned points)"
      - from: PLATINUM
        to: STANDARD
        trigger: "POST /_sweep/year-rollover"
        actor: system
        preconditions:
          - "new calendar year started"
        side_effects:
          - "Same as GOLD -> STANDARD downgrade"

  - entity: Transaction
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /transactions with txn_type == REFUND whose linked original Transaction has status == POSTED, identified by original_transaction_id in body"
        actor: Cardholder
        preconditions:
          - "original Transaction.status == POSTED"
          - "REFUND.amount_cents == original Transaction.amount_cents (full refund only; partials disallowed)"
          - "Account.lifecycle_state != CLOSED"
        side_effects:
          - "original Transaction.status := REVERSED"
          - "An EARN_ADJUST PointsLedgerEntry of -original.points_provisional is appended"
          - "Account.ytd_qualifying_spend_cents decremented by original.amount_cents (may downgrade tier? NO — tier downgrades only on year rollover; the invariant in calc_points_invariant pins this)"
          - "Account.last_qualifying_activity_at left unchanged (refund does NOT reset expiration)"

  - entity: PointsTransfer
    initial_state: PENDING
    terminal_states: [COMPLETED, REVERSED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /points-transfers/{id}/confirm (system, simulated partner ack via test endpoint)"
        actor: PlatformAdmin
        preconditions:
          - "Account.lifecycle_state == ACTIVE"
          - "PointsTransfer.status == PENDING"
        side_effects:
          - "completed_at := now"
          - "Account.last_qualifying_activity_at := now"
      - from: PENDING
        to: REVERSED
        trigger: "POST /points-transfers/{id}/reverse OR cascade from Account ACTIVE->DELINQUENT or *->CLOSED"
        actor: Cardholder | PlatformAdmin | system
        preconditions:
          - "PointsTransfer.status == PENDING"
        side_effects:
          - "TRANSFER_REVERSE PointsLedgerEntry of +points_debited is appended"
          - "Account.points_balance recomputed (invariant: net delta from PENDING+REVERSE pair == 0)"

  - entity: StatementCredit
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /statement-credits/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "StatementCredit.status == APPLIED"
          - "Account.lifecycle_state != CLOSED"
        side_effects:
          - "REDEEM_REVERSE PointsLedgerEntry of +points_debited is appended"
          - "Account.points_balance recomputed (invariant: invariant_statement_credit_balance holds)"

  - entity: QuarterlyActivation
    initial_state: ACTIVATED
    terminal_states: [EXPIRED]
    note: |
      Activation is a per-(account, category, quarter) record. Created in ACTIVATED state by
      POST /accounts/{id}/activate-category. Transitions to EXPIRED automatically when the
      clock advances past activation_window_end via POST /_sweep/run.
    transitions:
      - from: ACTIVATED
        to: EXPIRED
        trigger: "POST /_sweep/run after clock advance crosses activation_window_end"
        actor: system
        preconditions:
          - "QuarterlyActivation.activation_window_end <= now"
        side_effects:
          - "No retroactive change to already-POSTED Transactions earned under this activation"
          - "Subsequent POSTs against this (account, category) revert to category.base_rate_bps as if no activation existed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two concurrent POST /accounts/{id}/activate-category for the same (account, category, quarter)"
    guarantee: "At most one QuarterlyActivation row per (account_id, category_id, quarter_label); second rejected"
    error_id: ERR_ACTIVATION_ALREADY_EXISTS
    http_status: 409
    serialization: "First-writer-wins on uniqueness key (account_id, category_id, quarter_label)"

  - scenario: "POST /points-transfers and POST /statement-credits race for the same points balance such that, individually, each fits but together they exceed Account.points_balance"
    guarantee: "Exactly one succeeds; the loser is rejected"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    serialization: "First-writer-wins on Account.points_balance debit; balance check and decrement are atomic"

  - scenario: "Account close and a new statement-credit redemption arrive simultaneously"
    guarantee: "Exactly one wins; if close wins, redemption rejected as ERR_ACCOUNT_CLOSED"
    error_id: ERR_ACCOUNT_CLOSED
    http_status: 409
    serialization: "First-writer-wins on Account.lifecycle_state; loser sees CLOSED state"

  - scenario: "Account close and a new statement-credit redemption arrive simultaneously, redemption commits first"
    guarantee: "Close still succeeds; the redemption that won is honored and the FORFEIT entry sees the post-redemption balance"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Account.lifecycle_state; only one close attempt may be in-flight"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_points_provisional
    trigger: "On POST /transactions with txn_type == PURCHASE, before persisting Transaction.points_provisional. Also re-evaluated on EARN_ADJUST side effect from tier upgrade."
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED (see Quality Checklist Computation-determinism):
      # Step 1: pick category_rate_bps
      # Step 2: pick tier_multiplier_bps (basis points: 10000 = 1.00x)
      # Step 3: pick activation_multiplier_bps
      # Step 4: combined_bps = floor( (category_rate_bps * tier_multiplier_bps * activation_multiplier_bps) / 100000000 )
      #         (i.e., 10000 * 10000 denominator collapsed; floor BEFORE applying to dollars)
      # Step 5: points_provisional = floor( amount_cents * combined_bps / 10000 )
      # Step 6: if Account.lifecycle_state != ACTIVE at posted_at, points_provisional := 0

      category_rate_bps := CashbackCategory.base_rate_bps

      if Account.lifecycle_state != ACTIVE: return 0

      if CashbackCategory.category_type == ROTATING_QUARTERLY:
          q := quarter_of(posted_at)   # e.g., "2026Q2"
          a := find QuarterlyActivation where account_id, category_id, quarter_label == q
                                         AND a.activation_window_start <= posted_at < a.activation_window_end
                                         AND a.status == ACTIVATED
          if a is None: category_rate_bps := BASE_BPS  # fall back to 1.00%
          # else use category_rate_bps as declared

      tier_multiplier_bps := switch Account.spending_tier:
          STANDARD -> 10000     # 1.00x
          GOLD     -> 12500     # 1.25x
          PLATINUM -> 15000     # 1.50x

      activation_multiplier_bps := 10000   # already encoded in category_rate_bps fallback above

      combined_bps := floor( category_rate_bps * tier_multiplier_bps / 10000 )
      points_provisional := floor( amount_cents * combined_bps / 10000 )
      return points_provisional
    input_set: "Transaction with txn_type == PURCHASE. Tier and lifecycle read at posted_at (read-then-write semantics, atomic with status check)."
    constants:
      BASE_BPS: 100                       # 1.00% fallback rate when ROTATING but not activated
      TIER_GOLD_THRESHOLD_CENTS: 600000   # $6,000.00 annual qualifying spend
      TIER_PLATINUM_THRESHOLD_CENTS: 1500000 # $15,000.00
      TIER_GOLD_MULT_BPS: 12500
      TIER_PLATINUM_MULT_BPS: 15000
    precision: "Points are integers. Order of operations is: floor at combined_bps, then floor at points. NO rounding to nearest; explicit floor at each step."
    variants:
      - name: provisional
        when: "Computed at POST /transactions time using snapshot of Account.spending_tier at posted_at."
        difference: "Uses tier in effect at posted_at; ignores future intra-month tier upgrades."

  - name: calc_points_final
    trigger: "On tier upgrade side effect during same calendar month; also on EARN_ADJUST refund. Writes Transaction.points_final and emits EARN_ADJUST PointsLedgerEntry."
    algorithm: chronological
    formula: |
      # Two valid interpretations exist; we PIN one:
      # PINNED RULE (forward-looking): when a tier upgrade fires mid-month, EVERY Transaction
      # posted in the SAME calendar month (UTC), regardless of whether it was BEFORE or AFTER
      # the upgrade timestamp, is re-evaluated using the NEW tier. Transactions in PRIOR
      # calendar months are NOT touched.
      #
      # The forbidden interpretation (chronological): re-evaluate only transactions AFTER
      # the upgrade, not before. We REJECT this. The PRD must state forward-looking is the rule.
      #
      # For each Transaction T in current calendar month, account=A, status==POSTED:
      #   new_points := calc_points_provisional(T) with A.spending_tier := new_tier
      #   delta := new_points - T.points_provisional
      #   if delta != 0:
      #       T.points_final := new_points
      #       append EARN_ADJUST ledger entry { delta_points: delta, source: T.id }
      #   else:
      #       T.points_final := T.points_provisional
    input_set: "All Transactions for this account with status == POSTED and date_trunc('month', posted_at, UTC) == date_trunc('month', upgrade_time, UTC). Excludes REVERSED."
    constants: {}
    precision: "Integer floor as in calc_points_provisional."
    variants:
      - name: forward_looking
        when: "Tier upgrade backfill — applies new tier to ALL same-month POSTED transactions, including those posted BEFORE the upgrade instant."
        difference: "Includes pre-upgrade-in-month transactions; differs from the chronological alternative which would only re-rate post-upgrade transactions. For identical inputs (same monthly purchases, same upgrade time mid-month) the two variants produce DIFFERENT point totals."
      - name: chronological_alternative
        when: "Documented for contrast only — NOT the system behavior."
        difference: "Would re-rate only transactions strictly after upgrade_time. Implementations that do this are wrong."

  - name: calc_signup_bonus_qualification
    trigger: "On every POST /transactions and on POST /_clock/advance crossing signup_bonus_deadline_at."
    algorithm: threshold
    formula: |
      # Window is [opened_at, signup_bonus_deadline_at). Half-open: posts at exactly
      # signup_bonus_deadline_at do NOT count.
      qualifying := sum( T.amount_cents
                          for T in Transactions
                          where T.account_id == this
                            AND T.txn_type == PURCHASE
                            AND T.status == POSTED
                            AND opened_at <= T.posted_at < signup_bonus_deadline_at )
                  - sum( R.amount_cents
                          for R in Transactions
                          where R.account_id == this
                            AND R.txn_type == REFUND
                            AND opened_at <= R.posted_at < signup_bonus_deadline_at )

      account.signup_bonus_qualifying_spend_cents := qualifying

      if account.signup_bonus_state == PENDING:
          if qualifying >= SIGNUP_MIN_SPEND_CENTS:    # boundary: >= not >
              account.signup_bonus_state := QUALIFIED
              # then award:
              account.signup_bonus_state := AWARDED
              append SIGNUP_BONUS ledger entry { delta_points: SIGNUP_BONUS_POINTS }
          elif now >= signup_bonus_deadline_at:
              account.signup_bonus_state := EXPIRED   # cannot qualify after deadline
    input_set: "All Transactions where opened_at <= posted_at < signup_bonus_deadline_at."
    constants:
      SIGNUP_MIN_SPEND_CENTS: 300000     # $3,000.00
      SIGNUP_WINDOW_DAYS: 90
      SIGNUP_BONUS_POINTS: 60000
    precision: "Integer cents; integer points. Boundary is >= (3000.00 dollars triggers, 2999.99 does not)."
    variants:
      - name: posted_only
        when: "Refunds occurring INSIDE the window deduct from qualifying spend."
        difference: "Refunds posted AFTER signup_bonus_deadline_at do NOT claw back an AWARDED bonus."

  - name: calc_statement_credit_redemption
    trigger: "On POST /statement-credits."
    algorithm: tiered_pricing
    formula: |
      # Redemption value rate depends on Account.spending_tier:
      #   STANDARD  -> POINTS_PER_DOLLAR_STANDARD = 100  (1 cent per point)
      #   GOLD      -> POINTS_PER_DOLLAR_GOLD     = 90   (~1.11 cents per point)
      #   PLATINUM  -> POINTS_PER_DOLLAR_PLATINUM = 80   (1.25 cents per point)
      # Threshold: minimum redemption is MIN_REDEMPTION_POINTS = 2500 points OR cents-equivalent
      # depending on mode.
      #
      # Two redemption modes; PINNED rounding is per-redemption (we compute in cents first,
      # then floor to integer points or integer cents at the end):
      #
      # if redemption_mode == POINTS_FIRST:
      #     requested_points >= MIN_REDEMPTION_POINTS  (boundary: >=)
      #     credit_amount_cents := floor( requested_points * 100 / POINTS_PER_DOLLAR_TIER )
      #     points_debited := requested_points
      #
      # if redemption_mode == AMOUNT_FIRST:
      #     requested_amount_cents >= 2500  ($25.00 minimum)
      #     points_debited := ceil( requested_amount_cents * POINTS_PER_DOLLAR_TIER / 100 )
      #     credit_amount_cents := requested_amount_cents
      #
      # The two modes do NOT round-trip: a $30.00 AMOUNT_FIRST on STANDARD costs 3000 points,
      # but 3000 points POINTS_FIRST yields $30.00; on GOLD a $30.00 AMOUNT_FIRST costs
      # ceil(3000 * 90 / 100) = 2700 points, while 2700 points POINTS_FIRST yields
      # floor(2700 * 100 / 90) = floor(3000.0) = 3000 cents — these AGREE on GOLD by accident;
      # on PLATINUM a $30.01 AMOUNT_FIRST costs ceil(3001 * 80 / 100) = 2401, but 2401 points
      # POINTS_FIRST yields floor(2401 * 100 / 80) = 3001 cents — agreeable; the disagreement
      # surfaces at unaligned cent boundaries like $30.49 / odd points (see
      # boundary_precision_check instances).
    input_set: "Single StatementCredit; reads Account.points_balance and Account.spending_tier atomically."
    constants:
      MIN_REDEMPTION_POINTS: 2500
      MIN_REDEMPTION_CENTS: 2500
      POINTS_PER_DOLLAR_STANDARD: 100
      POINTS_PER_DOLLAR_GOLD: 90
      POINTS_PER_DOLLAR_PLATINUM: 80
    precision: "Integer points; integer cents. Rounding modes are PINNED: floor for POINTS_FIRST credit_amount; ceil for AMOUNT_FIRST points_debited (favor the system, never under-charge points)."
    variants:
      - name: points_first
        when: "Cardholder names a points amount."
        difference: "Floors the resulting cents — points are spent in full, cents are the dependent value, leftover fractional cent is lost."
      - name: amount_first
        when: "Cardholder names a USD amount."
        difference: "Ceils the points spent — cents are exact, points may slightly exceed the per-point ratio (rounded up to next integer point)."

  - name: calc_points_expiration
    trigger: "On POST /_sweep/run."
    algorithm: aggregation
    formula: |
      # An account whose last_qualifying_activity_at is older than EXPIRATION_INACTIVITY_DAYS
      # forfeits its ENTIRE positive points balance via a single EXPIRE ledger entry.
      # No partial expiration (i.e., NOT FIFO by ledger entry age).
      if Account.lifecycle_state == CLOSED: skip (already forfeited)
      if (now - Account.last_qualifying_activity_at) >= EXPIRATION_INACTIVITY_DAYS days:
          delta := -Account.points_balance
          if delta != 0:
              append EXPIRE PointsLedgerEntry { delta_points: delta }
              Account.points_balance := 0
    input_set: "All ACTIVE or DELINQUENT accounts with last_qualifying_activity_at older than EXPIRATION_INACTIVITY_DAYS."
    constants:
      EXPIRATION_INACTIVITY_DAYS: 365
    precision: "Boundary is >= (an account inactive for exactly 365 days expires; 364 days does not). Inactivity measured by floor of day difference, days = floor((now - last_qualifying_activity_at) / 86400 seconds)."

  - name: calc_transfer_partner_units
    trigger: "On POST /points-transfers."
    algorithm: threshold
    formula: |
      # Transfer must:
      #   (a) requested_partner_units > 0
      #   (b) requested_partner_units MOD partner.min_transfer_increment == 0
      # If either fails, ERR_INVALID_TRANSFER_INCREMENT.
      # points_debited := requested_partner_units * partner.conversion_ratio_points_per_unit
      # Then check points_debited <= Account.points_balance.
    input_set: "Single PointsTransfer with valid partner reference."
    constants: {}
    precision: "Integer arithmetic only. Boundary: increment is >= 1; 0 is invalid."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role in {Cardholder, PlatformAdmin}."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7 RBAC matrix."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-segment resources exist (left-to-right). Account id, Transaction id, PointsTransfer id, StatementCredit id, CashbackCategory id, TransferPartner id."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body FK references exist: account_id, category_id, partner_id, original_transaction_id."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "[POST /transactions, POST /points-transfers, POST /statement-credits, POST /accounts/{id}/activate-category]"

  - priority: 5
    category: state
    check: "Acting Cardholder.id == Account.cardholder_id when role == Cardholder."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "[POST /accounts/{id}/close, POST /transactions, POST /statement-credits, POST /points-transfers, POST /accounts/{id}/activate-category]"

  - priority: 6
    category: state
    check: "Account.lifecycle_state == ACTIVE for write operations against this account."
    error_id: ERR_ACCOUNT_CLOSED
    http_status: 409
    applies_to: "[POST /transactions, POST /points-transfers, POST /statement-credits, POST /accounts/{id}/activate-category, POST /accounts/{id}/close (if already CLOSED)]"

  - priority: 7
    category: state
    check: "Source Transaction.status == POSTED when txn_type == REFUND."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "[POST /transactions with txn_type == REFUND]"

  - priority: 8
    category: business_referential
    check: "QuarterlyActivation: CashbackCategory.category_type == ROTATING_QUARTERLY."
    error_id: ERR_CATEGORY_NOT_ACTIVATABLE
    http_status: 422
    applies_to: "[POST /accounts/{id}/activate-category]"

  - priority: 9
    category: business_temporal
    check: "QuarterlyActivation: now is BEFORE activation_window_end of the named quarter_label, AND now is AT-OR-AFTER (now >= start - PRE_ACTIVATION_LEAD_DAYS days, where lead == 14 days)."
    error_id: ERR_ACTIVATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "[POST /accounts/{id}/activate-category]"

  - priority: 10
    category: business_constraint
    check: "QuarterlyActivation uniqueness on (account_id, category_id, quarter_label)."
    error_id: ERR_ACTIVATION_ALREADY_EXISTS
    http_status: 409
    applies_to: "[POST /accounts/{id}/activate-category]"

  - priority: 11
    category: business_constraint
    check: "PointsTransfer: requested_partner_units > 0 AND (requested_partner_units MOD partner.min_transfer_increment) == 0."
    error_id: ERR_INVALID_TRANSFER_INCREMENT
    http_status: 422
    applies_to: "[POST /points-transfers]"

  - priority: 12
    category: business_constraint
    check: "TransferPartner.is_active == true."
    error_id: ERR_PARTNER_INACTIVE
    http_status: 422
    applies_to: "[POST /points-transfers]"

  - priority: 13
    category: business_constraint
    check: "StatementCredit: redemption_mode == POINTS_FIRST -> requested_points >= MIN_REDEMPTION_POINTS (2500); redemption_mode == AMOUNT_FIRST -> requested_amount_cents >= MIN_REDEMPTION_CENTS (2500)."
    error_id: ERR_BELOW_MINIMUM_REDEMPTION
    http_status: 422
    applies_to: "[POST /statement-credits]"

  - priority: 14
    category: business_constraint
    check: "StatementCredit body fields exclusive: POINTS_FIRST requires requested_points only; AMOUNT_FIRST requires requested_amount_cents only."
    error_id: ERR_INVALID_REDEMPTION_BODY
    http_status: 422
    applies_to: "[POST /statement-credits]"

  - priority: 15
    category: business_fiscal
    check: "PointsTransfer / StatementCredit: points_debited <= Account.points_balance."
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 422
    applies_to: "[POST /points-transfers, POST /statement-credits]"

  - priority: 16
    category: business_referential
    check: "Transaction (REFUND): original_transaction_id refers to a Transaction with txn_type == PURCHASE AND account_id == this account."
    error_id: ERR_REFUND_MISMATCH
    http_status: 422
    applies_to: "[POST /transactions]"

  - priority: 17
    category: business_constraint
    check: "Transaction (REFUND): amount_cents == original.amount_cents (no partials)."
    error_id: ERR_PARTIAL_REFUND_DISALLOWED
    http_status: 422
    applies_to: "[POST /transactions]"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Cardholder
  - method: POST
    path: /cardholders
    description: Create a Cardholder.
    roles: [PlatformAdmin]
    code: 201
    input: [email, display_name]
    output: Cardholder
    side_effects: []

  - method: GET
    path: /cardholders/{cardholder_id}
    description: Fetch a Cardholder.
    roles: [Cardholder, PlatformAdmin]
    code: 200
    input: []
    output: Cardholder
    side_effects: []

  # ----- Account
  - method: POST
    path: /accounts
    description: Open an account for a cardholder. Sets opened_at, signup_bonus_deadline_at, signup_bonus_state=PENDING.
    roles: [PlatformAdmin]
    code: 201
    input: [cardholder_id]
    output: Account
    side_effects:
      - "signup_bonus_deadline_at := opened_at + 90 days"
      - "last_qualifying_activity_at := opened_at"

  - method: GET
    path: /accounts/{account_id}
    description: Fetch account snapshot including points_balance and tier.
    roles: [Cardholder, PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: /accounts/{account_id}/mark-delinquent
    description: Transition lifecycle_state ACTIVE -> DELINQUENT. Cascades reversal of PENDING transfers.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects:
      - "All PENDING PointsTransfer on this account REVERSED"
      - "Recompute points_balance"

  - method: POST
    path: /accounts/{account_id}/clear-delinquency
    description: Transition lifecycle_state DELINQUENT -> ACTIVE.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: /accounts/{account_id}/close
    description: Close account; forfeit remaining points; expire signup bonus if not AWARDED.
    roles: [Cardholder, PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects:
      - "FORFEIT PointsLedgerEntry of -points_balance"
      - "points_balance := 0"
      - "signup_bonus_state := FORFEITED if not AWARDED"

  - method: POST
    path: /accounts/{account_id}/activate-category
    description: Activate a ROTATING_QUARTERLY category for the named quarter.
    roles: [Cardholder]
    code: 201
    input: [category_id, quarter_label]
    output: QuarterlyActivation
    side_effects:
      - "Subsequent POSTed PURCHASE transactions in that quarter against this category earn at category.base_rate_bps instead of BASE_BPS fallback"

  - method: GET
    path: /accounts/{account_id}/activations
    description: List activations for an account, with filtering by quarter_label.
    roles: [Cardholder, PlatformAdmin]
    code: 200
    input: ["quarter_label?"]
    output: QuarterlyActivation[]
    side_effects: []

  - method: GET
    path: /accounts/{account_id}/ledger
    description: List PointsLedgerEntry rows for the account (paginated, filterable by entry_type).
    roles: [Cardholder, PlatformAdmin]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: PointsLedgerEntry[]
    side_effects: []

  # ----- CashbackCategory
  - method: POST
    path: /cashback-categories
    description: Register a cashback category (admin-only).
    roles: [PlatformAdmin]
    code: 201
    input: [code, category_type, base_rate_bps]
    output: CashbackCategory
    side_effects:
      - "requires_activation := (category_type == ROTATING_QUARTERLY)"

  - method: GET
    path: /cashback-categories
    description: List categories.
    roles: [Cardholder, PlatformAdmin]
    code: 200
    input: ["category_type?", "limit?", "offset?"]
    output: CashbackCategory[]
    side_effects: []

  # ----- Transaction
  - method: POST
    path: /transactions
    description: Post a purchase or full refund. Triggers earn calc and tier upgrade detection.
    roles: [Cardholder]
    code: 201
    input: [account_id, category_id, txn_type, amount_cents, "original_transaction_id?"]
    output: Transaction
    side_effects:
      - "calc_points_provisional writes Transaction.points_provisional"
      - "Updates Account.ytd_qualifying_spend_cents (PURCHASE adds, REFUND subtracts)"
      - "May trigger tier upgrade transition with calc_points_final backfill cascade"
      - "Updates Account.last_qualifying_activity_at on PURCHASE only"
      - "May trigger calc_signup_bonus_qualification on PURCHASE inside signup window"

  - method: GET
    path: /transactions/{transaction_id}
    description: Fetch a transaction including points_provisional and points_final.
    roles: [Cardholder, PlatformAdmin]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  - method: GET
    path: /accounts/{account_id}/transactions
    description: List transactions for an account.
    roles: [Cardholder, PlatformAdmin]
    code: 200
    input: ["status?", "txn_type?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []

  # ----- TransferPartner
  - method: POST
    path: /transfer-partners
    description: Register a transfer partner.
    roles: [PlatformAdmin]
    code: 201
    input: [code, partner_type, conversion_ratio_points_per_unit, min_transfer_increment, "is_active?"]
    output: TransferPartner
    side_effects: []

  - method: GET
    path: /transfer-partners
    description: List partners.
    roles: [Cardholder, PlatformAdmin]
    code: 200
    input: ["partner_type?", "is_active?", "limit?", "offset?"]
    output: TransferPartner[]
    side_effects: []

  # ----- PointsTransfer
  - method: POST
    path: /points-transfers
    description: Initiate a points-to-partner transfer. Debits points immediately; status = PENDING.
    roles: [Cardholder]
    code: 201
    input: [account_id, partner_id, requested_partner_units]
    output: PointsTransfer
    side_effects:
      - "TRANSFER_DEBIT PointsLedgerEntry of -points_debited"
      - "Account.points_balance debited"
      - "Account.last_qualifying_activity_at := now"

  - method: POST
    path: /points-transfers/{transfer_id}/confirm
    description: Simulated partner acknowledgement; PENDING -> COMPLETED.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PointsTransfer
    side_effects:
      - "completed_at := now"

  - method: POST
    path: /points-transfers/{transfer_id}/reverse
    description: Manual reverse of a PENDING transfer.
    roles: [Cardholder, PlatformAdmin]
    code: 200
    input: []
    output: PointsTransfer
    side_effects:
      - "TRANSFER_REVERSE PointsLedgerEntry of +points_debited"
      - "Account.points_balance restored"

  # ----- StatementCredit
  - method: POST
    path: /statement-credits
    description: Redeem points as statement credit.
    roles: [Cardholder]
    code: 201
    input: [account_id, redemption_mode, "requested_points?", "requested_amount_cents?"]
    output: StatementCredit
    side_effects:
      - "REDEEM_DEBIT PointsLedgerEntry of -points_debited"
      - "Account.points_balance debited"
      - "Account.last_qualifying_activity_at := now"

  - method: POST
    path: /statement-credits/{credit_id}/reverse
    description: Reverse an applied statement credit.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: StatementCredit
    side_effects:
      - "REDEEM_REVERSE PointsLedgerEntry of +points_debited"

  # ----- Test-only / system endpoints
  - method: POST
    path: /_clock/advance
    description: Advance the simulated clock to the supplied ISO 8601 timestamp. Used by tests to cross signup deadlines, quarter boundaries, year rollover, and expiration thresholds.
    roles: [PlatformAdmin]
    code: 200
    input: [to_timestamp]
    output: null
    side_effects:
      - "Does NOT itself fire sweep transitions; tests must call /_sweep/run."

  - method: POST
    path: /_sweep/run
    description: Run periodic sweeps -- signup bonus expiry, activation expiry, points expiration.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "QuarterlyActivation ACTIVATED -> EXPIRED for activations whose window has closed"
      - "Account.signup_bonus_state PENDING -> EXPIRED for accounts past signup_bonus_deadline_at"
      - "calc_points_expiration on each eligible account"

  - method: POST
    path: /_sweep/year-rollover
    description: Reset annual tier counters; transition all GOLD/PLATINUM tiers to STANDARD.
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: null
    side_effects:
      - "Account.ytd_qualifying_spend_cents := 0 for all accounts"
      - "Account.spending_tier := STANDARD for all GOLD/PLATINUM accounts"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: Missing or malformed X-User-Role / X-User-ID headers.
  - id: ERR_FORBIDDEN
    http: 403
    condition: Role not permitted, or Cardholder trying to operate on someone else's Account.
  - id: ERR_NOT_FOUND
    http: 404
    condition: Path-segment resource id not in DB.
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: FK supplied in request body does not resolve.
  - id: ERR_VALIDATION
    http: 422
    condition: Generic body shape / type error not covered by a more specific error.
  - id: ERR_ACCOUNT_CLOSED
    http: 409
    condition: Account.lifecycle_state == CLOSED on a write endpoint, or attempt to re-close.
  - id: ERR_INVALID_STATE
    http: 409
    condition: Target resource not in valid source state for this transition (e.g., REFUND of an already REVERSED Transaction).
  - id: ERR_CATEGORY_NOT_ACTIVATABLE
    http: 422
    condition: POST /accounts/{id}/activate-category against a category whose category_type is not ROTATING_QUARTERLY.
  - id: ERR_ACTIVATION_WINDOW_CLOSED
    http: 422
    condition: Activation window for the supplied quarter_label has already ended, or is more than 14 days in the future.
  - id: ERR_ACTIVATION_ALREADY_EXISTS
    http: 409
    condition: A QuarterlyActivation row already exists for (account, category, quarter).
  - id: ERR_INVALID_TRANSFER_INCREMENT
    http: 422
    condition: requested_partner_units <= 0 or not a multiple of partner.min_transfer_increment.
  - id: ERR_PARTNER_INACTIVE
    http: 422
    condition: TransferPartner.is_active == false.
  - id: ERR_INSUFFICIENT_POINTS
    http: 422
    condition: Debit (transfer or redeem) would drive Account.points_balance below 0.
  - id: ERR_BELOW_MINIMUM_REDEMPTION
    http: 422
    condition: StatementCredit below MIN_REDEMPTION_POINTS (POINTS_FIRST) or MIN_REDEMPTION_CENTS (AMOUNT_FIRST).
  - id: ERR_INVALID_REDEMPTION_BODY
    http: 422
    condition: StatementCredit body has wrong fields for the named redemption_mode (e.g., POINTS_FIRST with requested_amount_cents).
  - id: ERR_REFUND_MISMATCH
    http: 422
    condition: REFUND.original_transaction_id resolves to a Transaction with wrong account or txn_type != PURCHASE.
  - id: ERR_PARTIAL_REFUND_DISALLOWED
    http: 422
    condition: REFUND.amount_cents != original.amount_cents.

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Cardholder
    description: An individual account holder; can transact, transfer, redeem, activate categories, and close their own account.
    identity: "entity_backed:Cardholder"
    exclusive_operations:
      - "POST /transactions"
      - "POST /points-transfers"
      - "POST /statement-credits"
      - "POST /accounts/{id}/activate-category"
    shared_operations:
      - "GET /cardholders/{id} (own only)"
      - "GET /accounts/{id} (own only)"
      - "GET /accounts/{id}/transactions (own only)"
      - "GET /accounts/{id}/activations (own only)"
      - "GET /accounts/{id}/ledger (own only)"
      - "POST /accounts/{id}/close (own only)"
      - "POST /points-transfers/{id}/reverse (own only)"
      - "GET /transactions/{id} (own account only)"
      - "GET /cashback-categories"
      - "GET /transfer-partners"

  - name: PlatformAdmin
    description: Operator role; can manage cardholders, accounts, categories, partners, run sweeps and advance the clock.
    identity: opaque
    exclusive_operations:
      - "POST /cardholders"
      - "POST /accounts"
      - "POST /accounts/{id}/mark-delinquent"
      - "POST /accounts/{id}/clear-delinquency"
      - "POST /cashback-categories"
      - "POST /transfer-partners"
      - "POST /points-transfers/{id}/confirm"
      - "POST /statement-credits/{id}/reverse"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
      - "POST /_sweep/year-rollover"
    shared_operations:
      - "GET /cardholders/{id} (any)"
      - "GET /accounts/{id} (any)"
      - "GET /accounts/{id}/transactions (any)"
      - "GET /accounts/{id}/activations (any)"
      - "GET /accounts/{id}/ledger (any)"
      - "POST /accounts/{id}/close (any)"
      - "POST /points-transfers/{id}/reverse (any)"
      - "GET /transactions/{id} (any)"
      - "GET /cashback-categories"
      - "GET /transfer-partners"
