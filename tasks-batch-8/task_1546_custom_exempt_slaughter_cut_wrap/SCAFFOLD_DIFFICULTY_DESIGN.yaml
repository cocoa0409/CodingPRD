            - { call: "POST /locker/animals/${anA}/complete-fabrication", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${anB}/start-fabrication", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${anB}/complete-fabrication", payload: {}, as: PlantOperator }
          trigger:
