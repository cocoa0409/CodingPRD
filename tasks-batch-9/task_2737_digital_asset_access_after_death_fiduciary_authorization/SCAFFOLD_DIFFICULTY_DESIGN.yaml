  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: review_window_is_half_open_so_an_adjacent_submission_is_allowed
        grounds:
          - validations[priority=58]
          - state_machines.PlatformRequest.transitions[DRAFT->SUBMITTED]
          - entities.PlatformRequest.fields.review_window_start
          - entities.PlatformRequest.fields.review_window_end
          - entities.Platform.fields.review_window_days
        distinguishing_aspect: |
          Two requests of the same (estate_id, platform_id, request_type) contend for one review
          window: the first occupies [2026-08-01T00:00:00Z, 2026-08-15T00:00:00Z). Submitting the
          second at 2026-08-14 overlaps by one day and is refused with ERR_REQUEST_WINDOW_OVERLAP,
          while submitting it at exactly 2026-08-15 — the excluded end — is ADJACENT and is accepted
          with window [2026-08-15T00:00:00Z, 2026-08-29T00:00:00Z), which a closed-interval
          implementation would wrongly reject.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; platform CloudVault with review_window_days 14"
            - "one estate with VERIFIED death certificate and letters"
            - "request A already SUBMITTED at 2026-08-01, so it occupies [2026-08-01, 2026-08-15)"
            - "request B created in DRAFT with the same platform and request_type"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
              payload: { name: "CloudVault", platform_type: "CLOUD_STORAGE", form_code: "CV-FORM-1", review_window_days: 14, refund_policy: "NONE", supports_online_tool: true, supports_transfer: true, supports_memorialization: true, supports_deletion: true, requires_court_order_for_content: false, license_terminates_at_death: false, transfer_fee_cents: 0, request_fee_cents: 0 }
              as: EstateAdmin
              captures: { p_cloud_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_name: "Rowan Ives", date_of_death: "2026-02-14", domicile_state: "CA", court_case_number: "PR-2737-U" }
              as: EstateAdmin
              captures: { est_id: $.data.id }
            - call: "POST /estates/${est_id}/fiduciaries"
              payload: { full_name: "Dana Ives", appointment_type: "EXECUTOR", court_reference: "APPT-2737-U1" }
              as: CourtRegistrar
              captures: { fid1_id: $.data.id }
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "DEATH_CERTIFICATE", reference_number: "DC-U", issued_on: "2026-02-16", jurisdiction: "CA" }
              as: CourtRegistrar
              captures: { dc_id: $.data.id }
            - call: "POST /documents/${dc_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/documents"
              payload: { doc_type: "LETTERS_OF_AUTHORITY", reference_number: "LOA-U", issued_on: "2026-03-01", jurisdiction: "CA", fiduciary_id: "${fid1_id}" }
              as: CourtRegistrar
              captures: { loa_id: $.data.id }
            - call: "POST /documents/${loa_id}/transitions"
              payload: { action: "VERIFY" }
              as: CourtRegistrar
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_cloud_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "CV-FORM-1" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_a_id: $.data.id }
            - call: "POST /platform-requests/${req_a_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { a_start: $.data.review_window_start, a_end: $.data.review_window_end }
            - call: "POST /estates/${est_id}/platform-requests"
              payload: { platform_id: "${p_cloud_id}", request_type: "CATALOG_ACCESS", requested_scope: "CATALOG_ONLY", death_certificate_document_id: "${dc_id}", letters_document_id: "${loa_id}", platform_form_code: "CV-FORM-1" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { req_b_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platform-requests/${req_b_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platform-requests/${req_b_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
              captures: { b_start: $.data.review_window_start, b_end: $.data.review_window_end }
          assert:
            - "${a_start} == 2026-08-01T00:00:00Z"
            - "${a_end} == 2026-08-15T00:00:00Z"
            - "${err_overlap} == ERR_REQUEST_WINDOW_OVERLAP"
            - "the 2026-08-14 submission returns HTTP 409"
            - "after the refusal: PlatformRequest.${req_b_id}.status == DRAFT"
            - "${b_start} == 2026-08-15T00:00:00Z"
            - "${b_end} == 2026-08-29T00:00:00Z"
            - "PlatformRequest.${req_b_id}.status == SUBMITTED"
            - "PlatformRequest.${req_a_id}.status == SUBMITTED and its window is unchanged"
            - "a WITHDRAW of request A clears its window, after which a third request may submit inside [2026-08-01, 2026-08-15) too"

      - name: refund_claim_intervals_are_closed_and_a_denial_releases_the_interval
        grounds:
          - validations[priority=60]
          - calculations.refund_entitlement
          - entities.SubscriptionTerm.fields.claimed_days_total
          - state_machines.RefundClaim.transitions[PLATFORM_REVIEW->DENIED]
        distinguishing_aspect: |
          The claimed interval is CLOSED on both ends, so a claim starting on 2026-06-30 collides with
          one ending on 2026-06-30 (ERR_CLAIM_PERIOD_OVERLAP) while one starting 2026-07-01 is
          accepted; and a DENIED claim RELEASES its days, so claimed_days_total falls from 183 back
          to 92 and the released interval becomes claimable again — an implementation that treats the
          interval as half-open, or that keeps DENIED days reserved, fails one of the four checks.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; platform StreamOne with refund_policy PRORATA_DAILY"
            - "one estate with VERIFIED death certificate and letters"
            - "one SUBSCRIPTION asset with a SubscriptionTerm 2026-01-01..2026-12-31, ANNUAL, period_fee_cents 11999"
            - "its CancellationOrder driven to CONFIRMED"
            - "one FILED RefundClaim covering 2026-04-01..2026-06-30 (91 days, 2992 cents)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EstateAdmin
            - call: "POST /platforms"
