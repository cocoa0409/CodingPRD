# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — WIC Benefits Management
# Nine §0.5 rules × 2 instances = 18 instances. Every grounds[] ref resolves into
# SCAFFOLD.yaml §1.1–§1.7; every setup_api_calls/trigger call resolves to a §1.5
# endpoint with payload ⊆ input and captures ⊆ output.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: income_recent_vs_average_diverges
        grounds:
          - calculations.income_determination
          - entities.Application.fields.annual_income_determined
          - entities.IncomeRecord.fields.gross_amount_cents
        distinguishing_aspect: "Same two income records yield 42000.00 under ANNUALIZE_RECENT but 39000.00 under AVERAGE_ALL — dual-variant on the Application/IncomeRecord domain (distinct from the FoodPrescription/EbtAccount value variant)."
        test_recipe:
          setup:
            - "Agency, household (size 3, pregnancy 0, NONE), participant CHILD, two MONTHLY income records (3000 then 3500), application income_method=AVERAGE_ALL."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency A", state_code: "CA", caseload_cap: 50 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 3, pregnancy_count: 0, adjunctive_program: "NONE" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Child One", ssn_last4: "1001", category: "CHILD" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}", income_method: "AVERAGE_ALL" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 300000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 350000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
          trigger:
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { determined: $.data.annual_income_determined }
          assert:
            - "Application.${app_id}.annual_income_determined == 39000.00"
            - "Application.${app_id}.income_limit == 47767.00"
            - "Application.${app_id}.income_eligible == true"

      - name: prescribed_value_vs_ebt_redeemed_value_diverges
        grounds:
          - calculations.prescribed_value
          - calculations.ebt_reconciliation
          - entities.FoodPrescription.fields.prescribed_value_cents
          - entities.EbtAccount.fields.redeemed_value_cents
        distinguishing_aspect: "FoodPrescription.prescribed_value_cents (2500, forward authorization) differs from EbtAccount.redeemed_value_cents (1400, chronological draw-down) — dual-variant across the FoodPrescription vs EbtAccount domains (distinct from the income variant)."
        test_recipe:
          setup:
            - "Certified PREGNANT participant with FULL prescription MILK6/EGGS2/JUICE3 (value 2500); MILK 4 units redeemed at an authorized vendor."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency B", state_code: "CA", caseload_cap: 50 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-03-02T00:00:00.000Z" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /vendors"
              payload: { agency_id: "${agency_id}", legal_name: "Grocer One", peer_group: "MEDIUM" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { vendor_id: $.data.id }
            - call: "POST /vendors/${vendor_id}/authorize"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, pregnancy_count: 1, adjunctive_program: "MEDICAID" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Preg One", ssn_last4: "2001", category: "PREGNANT" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}", income_method: "ANNUALIZE_RECENT" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 200000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/assess-risk"
              payload: { risk_factor_codes: ["ANEMIA"] }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "GET /certifications"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { cert_id: "$.data[0].id" }
            - call: "GET /participants/${p_id}"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { p_ver: $.data.version }
            - call: "POST /food-prescriptions"
              payload: { certification_id: "${cert_id}", issuance_mode: "FULL", line_items: [{food_category: "MILK", requested_units: 6}, {food_category: "EGGS", requested_units: 2}, {food_category: "JUICE", requested_units: 3}], expected_participant_version: "${p_ver}" }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { rx_id: $.data.id, rx_value: $.data.prescribed_value_cents }
            - call: "GET /ebt-accounts"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { ebt_id: "$.data[0].id" }
          trigger:
            - call: "POST /redemptions"
              payload: { ebt_account_id: "${ebt_id}", vendor_id: "${vendor_id}", food_category: "MILK", units: 4 }
              as: Participant
              as_user_id: "${p_id}"
          assert:
            - "FoodPrescription.${rx_id}.prescribed_value_cents == 2500"
            - "EbtAccount.${ebt_id}.redeemed_value_cents == 1400"
            - "EbtAccount.${ebt_id}.remaining_value_cents == 1100"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: prescribed_value_min_cap_three_inputs
        grounds:
          - calculations.prescribed_value
          - entities.FoodPrescription.fields.line_items
          - entities.FoodPrescription.fields.prescribed_value_cents
        distinguishing_aspect: "Mode (a): non-linear min(requested,cap)*price across 3 line items where MILK requested 6 is capped at 4 — value 2500, not the uncapped 6*350+2*300+3*250=3450."
        test_recipe:
          setup:
            - "Certified PREGNANT participant; FULL prescription MILK6 (cap4), EGGS2 (cap2), JUICE3 (cap2)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency C", state_code: "CA", caseload_cap: 50 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, pregnancy_count: 1, adjunctive_program: "SNAP" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Preg Two", ssn_last4: "2002", category: "PREGNANT" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 150000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/assess-risk"
              payload: { risk_factor_codes: ["GEST_DIABETES"] }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "GET /certifications"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { cert_id: "$.data[0].id" }
            - call: "GET /participants/${p_id}"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { p_ver: $.data.version }
          trigger:
            - call: "POST /food-prescriptions"
              payload: { certification_id: "${cert_id}", issuance_mode: "FULL", line_items: [{food_category: "MILK", requested_units: 6}, {food_category: "EGGS", requested_units: 2}, {food_category: "JUICE", requested_units: 3}], expected_participant_version: "${p_ver}" }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { rx_id: $.data.id }
          assert:
            - "FoodPrescription.${rx_id}.prescribed_value_cents == 2500"

      - name: prorated_floor_per_item_then_sum
        grounds:
          - calculations.prescribed_value
          - calculations.prescribed_value.variants.PRORATED
          - entities.FoodPrescription.fields.issuance_mode
        distinguishing_aspect: "Mode (b): rounding order pinned — floor-per-item-then-sum on 2026-03-20 (factor 12/31) gives 350 (MILK floor(4*12/31)=1, EGGS/JUICE floor to 0), NOT the sum-then-round 968."
        test_recipe:
          setup:
            - "Certified PREGNANT participant; clock 2026-03-20; PRORATED prescription MILK6/EGGS2/JUICE3."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency D", state_code: "CA", caseload_cap: 50 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-03-20T00:00:00.000Z" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, pregnancy_count: 1, adjunctive_program: "TANF" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Preg Three", ssn_last4: "2003", category: "PREGNANT" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 150000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/assess-risk"
              payload: { risk_factor_codes: ["GEST_DIABETES"] }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "GET /certifications"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { cert_id: "$.data[0].id" }
            - call: "GET /participants/${p_id}"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { p_ver: $.data.version }
          trigger:
            - call: "POST /food-prescriptions"
              payload: { certification_id: "${cert_id}", issuance_mode: "PRORATED", line_items: [{food_category: "MILK", requested_units: 6}, {food_category: "EGGS", requested_units: 2}, {food_category: "JUICE", requested_units: 3}], expected_participant_version: "${p_ver}" }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { rx_id: $.data.id }
          assert:
            - "FoodPrescription.${rx_id}.prescribed_value_cents == 350"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_fork_join_approve_vs_deny
        grounds:
          - state_machines.Application.RISK_ASSESSED_to_APPROVED
          - state_machines.Application.RISK_ASSESSED_to_DENIED
          - entities.Participant.fields.status
        distinguishing_aspect: "Branching fork-join on Application: RISK_ASSESSED->DENIED leaves Participant APPLICANT and active_caseload_count unchanged, whereas RISK_ASSESSED->APPROVED would mint a Certification and set Participant ACTIVE — divergent side-effect sets (distinct entity from the Vendor cyclic loop)."
        test_recipe:
          setup:
            - "Application in RISK_ASSESSED for a CHILD participant (income & risk eligible)."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency E", state_code: "CA", caseload_cap: 50 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 3, adjunctive_program: "SNAP" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Child Two", ssn_last4: "1002", category: "CHILD" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 100000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/assess-risk"
              payload: { risk_factor_codes: ["ANEMIA"] }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
          trigger:
            - call: "POST /applications/${app_id}/deny"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "GET /participants/${p_id}"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { p_status: $.data.status }
            - call: "GET /agencies/${agency_id}"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { caseload: $.data.active_caseload_count }
          assert:
            - "Application.${app_id}.status == DENIED"
            - "Participant.${p_id}.status == APPLICANT"
            - "Agency.${agency_id}.active_caseload_count == 0"

      - name: vendor_cyclic_authorize_suspend_reinstate
        grounds:
          - state_machines.Vendor.AUTHORIZED_to_SUSPENDED
          - state_machines.Vendor.SUSPENDED_to_AUTHORIZED
          - entities.Vendor.fields.violation_points
        distinguishing_aspect: "Cyclic revision loop AUTHORIZED->SUSPENDED->AUTHORIZED on Vendor with violation_points reset to 0 on reinstate — a cycle on a different entity than the Application fork-join."
        test_recipe:
          setup:
            - "AUTHORIZED vendor with 100 accumulated violation points forcing SUSPENDED."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency F", state_code: "CA", caseload_cap: 50 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /vendors"
              payload: { agency_id: "${agency_id}", legal_name: "Grocer Two", peer_group: "LARGE" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { vendor_id: $.data.id }
            - call: "POST /vendors/${vendor_id}/authorize"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /vendors/${vendor_id}/record-violation"
              payload: { points: 100 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { v_status_after_violation: $.data.status }
          trigger:
            - call: "POST /vendors/${vendor_id}/reinstate"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { v_status_after_reinstate: $.data.status, v_points: $.data.violation_points }
          assert:
            - "Vendor.${vendor_id}.status == AUTHORIZED"
            - "Vendor.${vendor_id}.violation_points == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: approve_to_cert_to_participant_to_ebt_depth3
        grounds:
          - state_machines.Application.RISK_ASSESSED_to_APPROVED
          - state_machines.Certification.initial_state
          - entities.Agency.fields.active_caseload_count
          - entities.EbtAccount.fields.status
        distinguishing_aspect: "Depth-3 cascade from approve: approve -> Certification ACTIVE (L1) -> Participant ACTIVE + active_caseload_count++ (L2) -> EbtAccount OPEN created (L3); each link caused by the prior, not by approve directly."
        test_recipe:
          setup:
            - "Application RISK_ASSESSED for an eligible PREGNANT participant; agency caseload 0."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency G", state_code: "CA", caseload_cap: 50 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, pregnancy_count: 1, adjunctive_program: "MEDICAID" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Preg Four", ssn_last4: "2004", category: "PREGNANT" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 150000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/assess-risk"
              payload: { risk_factor_codes: ["GEST_DIABETES"] }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "GET /participants/${p_id}"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { p_status: $.data.status }
            - call: "GET /agencies/${agency_id}"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { caseload: $.data.active_caseload_count }
            - call: "GET /ebt-accounts"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { ebt_status: "$.data[0].status" }
          assert:
            - "Participant.${p_id}.status == ACTIVE"
            - "Agency.${agency_id}.active_caseload_count == 1"
            - "${ebt_status} == OPEN"

      - name: terminate_to_prescription_to_ebt_depth3
        grounds:
          - state_machines.Certification.ACTIVE_to_TERMINATED
          - state_machines.FoodPrescription.ISSUED_to_VOIDED
          - entities.EbtAccount.fields.voided_value_cents
        distinguishing_aspect: "Depth-3 cascade from a DIFFERENT trigger (terminate): terminate -> Certification TERMINATED (L1) -> FoodPrescription VOIDED (L2) -> EbtAccount.voided_value_cents += 1100 & remaining recompute (L3)."
        test_recipe:
          setup:
            - "Certified PREGNANT participant, FULL prescription value 2500, MILK 4 redeemed (1100 unredeemed); then terminate."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency H", state_code: "CA", caseload_cap: 50 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-03-02T00:00:00.000Z" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /vendors"
              payload: { agency_id: "${agency_id}", legal_name: "Grocer Three", peer_group: "SMALL" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { vendor_id: $.data.id }
            - call: "POST /vendors/${vendor_id}/authorize"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, pregnancy_count: 1, adjunctive_program: "MEDICAID" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "Preg Five", ssn_last4: "2005", category: "PREGNANT" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 150000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/assess-risk"
