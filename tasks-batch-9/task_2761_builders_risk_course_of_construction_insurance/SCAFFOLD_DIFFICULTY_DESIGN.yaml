            - "err_submitted == ERR_INVALID_PROJECT_STATE with HTTP 409 - a correct expected_project_version does not rescue an unscreened project"
            - "err_inel == ERR_INVALID_PROJECT_STATE with HTTP 409 on the grade-D project, whose submission_risk_score was still stored"
            - "the ELIGIBLE attempt succeeds and BuildersRiskPolicy.${pl1}.status == DRAFT"
            - "err_under == ERR_INVALID_PROJECT_STATE with HTTP 409 - once inception moved the project to UNDER_CONSTRUCTION no further DRAFT policy may be created for it"
            - "GET /builders-risk/projects/${p1}/policies returns exactly 1 row and ConstructionProject.${p1}.in_force_policy_count == 1"
