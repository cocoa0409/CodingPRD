# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cinema Box Office & Seating — cross-references SCAFFOLD.yaml §1.1–§1.7 against
# the nine Difficulty Rules in the scaffold-generator skill §0.5.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ticket_provisional_vs_final_diverge_on_reprice
        grounds:
          - calculations.ticket_price_provisional
          - calculations.ticket_price_final
          - state_machines.Order.HELD_to_PAID
          - entities.Ticket.fields.provisional_price_cents
          - entities.Ticket.fields.final_price_cents
        distinguishing_aspect: |
          Same seat, same base 1000c: provisional quoted at HOLD under STANDARD
          profile (1000c) but final locked at PAY after the manager re-prices to
          PEAK (1300c) — divergence lives on the Ticket/Showtime pricing domain.
        test_recipe:
          setup:
            - "Auditorium A (4 seats), Film F (BOOKING), Showtime ON_SALE with STANDARD profile and base_price_cents 1000"
            - "Member M registered; one HELD order on one STANDARD seat at provisional 1000c"
            - "Manager re-prices the showtime to PEAK before pay"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T10:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
              as: CinemaManager
              captures: { st_v_open: "$.data.version" }
            - call: "GET /showtimes/${st_id}/seats"
              payload: {}
              as: CinemaManager
              captures: { seat0: "$.data[0].id" }
            - call: "POST /members"
              payload: { email: "m@x.com", full_name: "M" }
              as: CinemaManager
              captures: { m_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${seat0}"], expected_showtime_version: "${st_v_open}" }
              as: BoxOfficeAgent
              captures: { ord_id: "$.data.id" }
            - call: "PATCH /showtimes/${st_id}/pricing"
              payload: { pricing_profile: "PEAK" }
              as: CinemaManager
          trigger:
            - call: "POST /orders/${ord_id}/pay"
              payload: {}
              as: BoxOfficeAgent
              captures: { paid_ord: "$.data.id" }
          assert:
            - "GET /orders/${ord_id}/tickets returns one Ticket with provisional_price_cents == 1000"
            - "that Ticket.final_price_cents == 1300"
            - "Order.${ord_id}.tickets_subtotal_cents == 1300"

      - name: distributor_split_first_window_vs_aged
        grounds:
          - calculations.distributor_sliding_split
          - state_machines.Showtime.ON_SALE_to_CLOSED
          - entities.Settlement.fields.applied_distributor_pct
          - entities.Settlement.fields.distributor_share_cents
        distinguishing_aspect: |
          Two CLOSED showtimes of the SAME film with identical 6000c gross: a week-0
          showtime settles at pct 0.70 (distributor_share 4200c) while a week-3
          showtime settles at pct 0.35 (distributor_share 2100c) — divergence lives
          on the Settlement/Film rental domain, a different entity domain than the
          ticket-price variant above.
        test_recipe:
          setup:
            - "Film F released 2026-06-01; split_schedule [{0,0.70},{3,0.35}]; distributor MG 0"
            - "Two showtimes of F, both sold to 6000c gross, both past end and CLOSED"
            - "Showtime W0 starts in release week 0; Showtime W3 starts in week 3"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 }, { week_index: 3, distributor_pct: 0.35 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 6, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud0_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 2", seat_count: 6, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud3_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-03T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud0_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-04T13:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 3000 }
              as: CinemaManager
              captures: { st0_id: "$.data.id" }
            - call: "POST /auditoriums/${aud3_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-25T13:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 3000 }
              as: CinemaManager
              captures: { st3_id: "$.data.id" }
            - call: "POST /showtimes/${st0_id}/open"
              payload: {}
              as: CinemaManager
              captures: { st0_v: "$.data.version" }
            - call: "POST /showtimes/${st3_id}/open"
              payload: {}
              as: CinemaManager
              captures: { st3_v: "$.data.version" }
            - call: "GET /showtimes/${st0_id}/seats"
              payload: {}
              as: CinemaManager
              captures: { s0a: "$.data[0].id", s0b: "$.data[1].id" }
            - call: "GET /showtimes/${st3_id}/seats"
              payload: {}
              as: CinemaManager
              captures: { s3a: "$.data[0].id", s3b: "$.data[1].id" }
            - call: "POST /members"
              payload: { email: "m@x.com", full_name: "M" }
              as: CinemaManager
              captures: { m_id: "$.data.id" }
            - call: "POST /members"
              payload: { email: "n@x.com", full_name: "N" }
              as: CinemaManager
              captures: { n_id: "$.data.id" }
            - call: "POST /showtimes/${st0_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${s0a}", "${s0b}"], expected_showtime_version: "${st0_v}" }
              as: BoxOfficeAgent
              captures: { ord0: "$.data.id" }
            - call: "POST /orders/${ord0}/pay"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /showtimes/${st3_id}/orders"
              payload: { member_id: "${n_id}", seat_ids: ["${s3a}", "${s3b}"], expected_showtime_version: "${st3_v}" }
              as: BoxOfficeAgent
              captures: { ord3: "$.data.id" }
            - call: "POST /orders/${ord3}/pay"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-26T00:00:00.000Z" }
              as: CinemaManager
            - call: "POST /showtimes/${st0_id}/close"
              payload: {}
              as: CinemaManager
            - call: "POST /showtimes/${st3_id}/close"
              payload: {}
              as: CinemaManager
          trigger:
            - call: "GET /showtimes/${st0_id}/settlement"
              payload: {}
              as: CinemaManager
              captures: { set0_pct: "$.data[0].applied_distributor_pct" }
            - call: "GET /showtimes/${st3_id}/settlement"
              payload: {}
              as: CinemaManager
              captures: { set3_pct: "$.data[0].applied_distributor_pct" }
          assert:
            - "Settlement for ${st0_id}: applied_distributor_pct == 0.70 and distributor_share_cents == 4200 and house_share_cents == 1800"
            - "Settlement for ${st3_id}: applied_distributor_pct == 0.35 and distributor_share_cents == 2100 and house_share_cents == 3900"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: distributor_share_min_max_mg_floor
        grounds:
          - calculations.distributor_sliding_split
          - entities.Distributor.fields.minimum_guarantee_cents
          - entities.Settlement.fields.distributor_share_cents
        distinguishing_aspect: |
          Mode (a): the share formula has >=3 inputs (gross, week-selected pct,
          minimum_guarantee) with a non-linear max() that flips which term wins —
          at gross 4000c and pct 0.35 the sliding share 1400c is below MG 2000c so
          MG floors the distributor share to 2000c and house_share goes to 2000c.
        test_recipe:
          setup:
            - "Distributor with minimum_guarantee_cents 2000"
            - "Film F split [{0,0.70},{3,0.35}]; a week-3 showtime sold to gross 4000c, then CLOSED"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Floor Films", minimum_guarantee_cents: 2000 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 }, { week_index: 3, distributor_pct: 0.35 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-03T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-25T13:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 2000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
              as: CinemaManager
              captures: { st_v: "$.data.version" }
            - call: "GET /showtimes/${st_id}/seats"
              payload: {}
              as: CinemaManager
              captures: { sa: "$.data[0].id", sb: "$.data[1].id" }
            - call: "POST /members"
              payload: { email: "m@x.com", full_name: "M" }
              as: CinemaManager
              captures: { m_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${sa}", "${sb}"], expected_showtime_version: "${st_v}" }
              as: BoxOfficeAgent
              captures: { ord_id: "$.data.id" }
            - call: "POST /orders/${ord_id}/pay"
              payload: {}
              as: BoxOfficeAgent
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-26T00:00:00.000Z" }
              as: CinemaManager
          trigger:
            - call: "POST /showtimes/${st_id}/close"
              payload: {}
              as: CinemaManager
          assert:
            - "GET /showtimes/${st_id}/settlement: gross_receipts_cents == 4000"
            - "applied_distributor_pct == 0.35 (sliding share would be 1400)"
            - "distributor_share_cents == 2000 (MG floor wins via max)"
            - "house_share_cents == 2000"

      - name: combo_discount_round_then_sum
        grounds:
          - calculations.order_total
          - entities.ConcessionCombo.fields.member_discount_pct
          - entities.Order.fields.combos_subtotal_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned to round-per-combo-then-sum.
          Two SILVER-priced combos at 995c with member_discount_pct 0.125 each
          round to 871c (995 - round(124.375)=995-124), summing to 1742c; the
          sum-then-round alternative would yield 1741c. The scaffold pins 1742c.
        test_recipe:
          setup:
            - "Member M elevated to SILVER (loyalty_points >= 50)"
            - "Two combos C1, C2 each price 995c, member_discount_pct 0.125"
            - "Showtime ON_SALE, one HELD order on one STANDARD seat with both combos attached"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 8, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /combos"
              payload: { name: "Combo C1", price_cents: 995, member_discount_pct: 0.125 }
              as: CinemaManager
              captures: { c1_id: "$.data.id" }
            - call: "POST /combos"
              payload: { name: "Combo C2", price_cents: 995, member_discount_pct: 0.125 }
              as: CinemaManager
              captures: { c2_id: "$.data.id" }
            - call: "POST /members"
              payload: { email: "m@x.com", full_name: "M" }
              as: CinemaManager
              captures: { m_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            # --- elevate M to SILVER: buy 2 STANDARD seats at base 2500 (5000c subtotal -> 50 points) on a throwaway showtime ---
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-05T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 2500 }
              as: CinemaManager
              captures: { st_seed_id: "$.data.id" }
            - call: "POST /showtimes/${st_seed_id}/open"
              payload: {}
              as: CinemaManager
              captures: { st_seed_v: "$.data.version" }
            - call: "GET /showtimes/${st_seed_id}/seats"
              payload: {}
              as: CinemaManager
              captures: { seed_a: "$.data[0].id", seed_b: "$.data[1].id" }
            - call: "POST /showtimes/${st_seed_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${seed_a}", "${seed_b}"], expected_showtime_version: "${st_seed_v}" }
              as: BoxOfficeAgent
              captures: { seed_ord: "$.data.id" }
            - call: "POST /orders/${seed_ord}/pay"
              payload: {}
              as: BoxOfficeAgent
            # --- target showtime in a non-overlapping window; one STANDARD seat + both combos ---
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-06T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
              as: CinemaManager
              captures: { st_v: "$.data.version" }
            - call: "GET /showtimes/${st_id}/seats"
              payload: {}
              as: CinemaManager
              captures: { seat0: "$.data[0].id" }
          trigger:
            - call: "POST /showtimes/${st_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${seat0}"], combo_ids: ["${c1_id}", "${c2_id}"], expected_showtime_version: "${st_v}" }
              as: BoxOfficeAgent
              captures: { ord_id: "$.data.id" }
          assert:
            - "GET /members/${m_id}: tier == SILVER (loyalty_points == 50 after the seed purchase)"
            - "Order.${ord_id}.combos_subtotal_cents == 1742 (round-per-combo 871 + 871, NOT 1741)"
            - "Order.${ord_id}.tickets_subtotal_cents == 1000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_paid_branches_to_refunded
        grounds:
          - state_machines.Order.PAID_to_REFUNDED
          - state_machines.Order.PAID_to_EXCHANGED
          - entities.Order.fields.status
        distinguishing_aspect: |
          Order has a branch fork at PAID: PAID->REFUNDED (this instance) voids
          tickets, frees seats, reverses loyalty, and credits/returns money — a
          side-effect set distinct from PAID->EXCHANGED which instead spawns a
          successor order. Branch lives on the Order entity.
        test_recipe:
          setup:
            - "A PAID order on an ON_SALE future showtime, one STANDARD seat at 1000c"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
              as: CinemaManager
              captures: { st_v: "$.data.version" }
            - call: "GET /showtimes/${st_id}/seats"
              payload: {}
              as: CinemaManager
              captures: { seat0: "$.data[0].id" }
            - call: "POST /members"
              payload: { email: "m@x.com", full_name: "M" }
              as: CinemaManager
              captures: { m_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/orders"
              payload: { member_id: "${m_id}", seat_ids: ["${seat0}"], expected_showtime_version: "${st_v}" }
              as: BoxOfficeAgent
              captures: { ord_id: "$.data.id" }
            - call: "POST /orders/${ord_id}/pay"
              payload: {}
              as: BoxOfficeAgent
          trigger:
            - call: "POST /orders/${ord_id}/refund"
              payload: { refund_destination: "WALLET" }
              as: BoxOfficeAgent
          assert:
            - "Order.${ord_id}.status == REFUNDED"
            - "GET /orders/${ord_id}/tickets: the ticket.state == VOIDED"
            - "GET /showtimes/${st_id}/seats: seat ${seat0}.occupancy == FREE"
            - "GET /members/${m_id}: wallet_credit_cents == 1000 and loyalty_points == 0"

      - name: showtime_branches_scheduled_to_cancelled
        grounds:
          - state_machines.Showtime.SCHEDULED_to_ON_SALE
          - state_machines.Showtime.SCHEDULED_to_CANCELLED
          - entities.Showtime.fields.status
        distinguishing_aspect: |
          Showtime forks at SCHEDULED: SCHEDULED->CANCELLED (this instance) is a
          divergent branch from SCHEDULED->ON_SALE, terminal with no order cascade
          because none exist yet. Branch lives on the Showtime entity (different
          entity than the Order branch above).
        test_recipe:
          setup:
            - "A SCHEDULED showtime with no orders"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1000 }
              as: CinemaManager
              captures: { st_id: "$.data.id", st_v: "$.data.version" }
          trigger:
            - call: "POST /showtimes/${st_id}/cancel"
              payload: { expected_showtime_version: "${st_v}" }
              as: CinemaManager
          assert:
            - "Showtime.${st_id}.status == CANCELLED"
            - "GET /showtimes/${st_id}/seats: every seat.occupancy == FREE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_showtime_refund_payment_credit_wallet_depth3
        grounds:
          - state_machines.Showtime.ON_SALE_to_CANCELLED
          - state_machines.Order.PAID_to_REFUNDED
          - entities.Payment.fields.refunded_cents
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          Depth-3 chain originating from POST /showtimes/{id}/cancel: cancel
          mutates the Showtime (A) -> that drives each PAID Order to REFUNDED (B)
          -> the order refund mutates its Payment to REFUNDED (C) -> the WALLET
          destination credits the Member (D). Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "An ON_SALE future showtime with one PAID order (1 STANDARD seat, 1500c, paid in cash, no wallet applied)"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Acme Films", minimum_guarantee_cents: 0 }
              as: CinemaManager
              captures: { dist_id: "$.data.id" }
            - call: "POST /films"
              payload: { title: "F", runtime_minutes: 90, distributor_id: "${dist_id}", release_date: "2026-06-01T00:00:00.000Z", split_schedule: [ { week_index: 0, distributor_pct: 0.70 } ] }
              as: CinemaManager
              captures: { film_id: "$.data.id" }
            - call: "POST /auditoriums"
              payload: { name: "Hall 1", seat_count: 4, turnaround_minutes: 20 }
              as: CinemaManager
              captures: { aud_id: "$.data.id" }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-06-02T09:00:00.000Z" }
              as: CinemaManager
            - call: "POST /auditoriums/${aud_id}/showtimes"
              payload: { film_id: "${film_id}", starts_at: "2026-06-10T20:00:00.000Z", pricing_profile: "STANDARD", base_price_cents: 1500 }
              as: CinemaManager
              captures: { st_id: "$.data.id" }
            - call: "POST /showtimes/${st_id}/open"
              payload: {}
