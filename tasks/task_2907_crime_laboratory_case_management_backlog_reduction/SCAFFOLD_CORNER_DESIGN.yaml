  # ===========================================================================
  - section: calculations
    instances:

      - name: estimated_hours_is_the_method_rate_times_the_item_count
        claim_type: correct_result
        grounds:
          - calculations.exam_request_hour_estimate
          - entities.ExaminationRequest.fields.estimated_hours
          - entities.Assignment.fields.estimated_hours
        distinguishing_aspect: "round_half_up(2.50 * 3, 2) == 7.50 is written once at request creation and snapshotted onto the Assignment, and the encumbered ledger moves by exactly that 7.50 - not by the analyst's capacity or by any per-item rounding."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: LATENT_PRINTS, competency 4, capacity 40.00, training 8.00."
            - "Method M1 VALIDATED, LATENT_PRINTS, standard_hours_per_item 2.50, min_competency_level 2, max_items_per_request 10."
            - "Case C1 (OTHER) ACCEPTED with one LATENT_LIFT vault item."
            - "Hand-executed formula: estimated_hours = round_half_up(2.50 * 3, 2) == 7.50."
          setup_api_calls:
            - call: "POST /lab/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
