            - call: "POST /liquidation/buyer-accounts/${ba}/qualification-decisions"
              payload: { decision: "QUALIFY", business_verified: true, approved_credit_limit_cents: 999 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err_admin_qualify: "$.data.error_id" }
          assert:
            - "all five of ${err_buyer_lot}, ${err_seller_review}, ${err_ts_close}, ${err_ops_provision}, ${err_admin_qualify} == ERR_ROLE_NOT_PERMITTED at HTTP 403"
            - "${err_ts_close} is 403 and NOT ERR_LISTING_NOT_FOUND: priority 2 runs ahead of priority 3 even for an unknown path id"
            - "Lot.${lot1}.lot_status is still PENDING_REVIEW and manifest_reviewed_by_user_id is still null"
            - "exactly one BuyerAccount exists and BuyerAccount.${ba}.approved_credit_limit_cents is still 10000000"

      - name: seller_ops_cannot_write_to_another_sellers_lot_or_read_its_analytics
        claim_type: Peer roles - Role A cannot touch role B's resources
        grounds:
          - roles.SellerOps.ownership_rule
          - validations[priority 4 -> ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - endpoints[GET /liquidation/recovery-analytics]
        distinguishing_aspect: >
          The SellerOps ownership rule spans writes and one read: seller two cannot add a manifest
          line, void a line, submit or list seller one's lot, and cannot pull
          GET /liquidation/recovery-analytics?seller_id=<seller one> either - while every one of
          those calls succeeds for seller one on the same rows, proving the refusal is ownership
          and not the endpoint being broken.
        test_recipe:
          setup:
            - "Two sellers exist (S-1001 and S-1002). Lot one belongs to seller one and holds one ACTIVE 200-unit line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Northline Returns LLC", tax_id: "S-1001", state_code: "OH", contact_email: "ops@northline.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: "$.data.id" }
            - call: "POST /liquidation/seller-accounts"
              payload: { legal_name: "Southbend Overstock LLC", tax_id: "S-1002", state_code: "IN", contact_email: "ops@southbend.example" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s2: "$.data.id" }
            - call: "POST /liquidation/warehouses"
              payload: { name: "Columbus DC", state_code: "OH", dock_door_count: 2, turnaround_buffer_minutes: 15 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { w1: "$.data.id" }
            - call: "POST /liquidation/lots"
              payload: { seller_id: "${s1}", warehouse_id: "${w1}", title: "Owner gate lot", category_code: "APPAREL", condition_grade: "CUSTOMER_RETURNS" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { lot1: "$.data.id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "APP-OG", unit_count: 200, unit_retail_cents: 10000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s1}"
              captures: { ml1: "$.data.id" }
          trigger:
            - call: "POST /liquidation/lots/${lot1}/manifest-lines"
              payload: { sku: "INTRUDER", unit_count: 5, unit_retail_cents: 1000, declared_condition: "USED_GOOD" }
              as: SellerOps
              as_user_id: "${s2}"
              captures: { err_line: "$.data.error_id" }
            - call: "POST /liquidation/manifest-lines/${ml1}/voids"
              payload: {}
              as: SellerOps
              as_user_id: "${s2}"
              captures: { err_void: "$.data.error_id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s2}"
              captures: { err_submit: "$.data.error_id" }
            - call: "GET /liquidation/recovery-analytics"
              payload: { seller_id: "${s1}" }
              as: SellerOps
              as_user_id: "${s2}"
              captures: { err_analytics: "$.data.error_id" }
            - call: "POST /liquidation/lots/${lot1}/manifest-submissions"
              payload: {}
              as: SellerOps
              as_user_id: "${s1}"
          assert:
            - "${err_line} == ${err_void} == ${err_submit} == ${err_analytics} == ERR_NOT_RESOURCE_OWNER at HTTP 403"
            - "Lot.${lot1}.manifest_line_count is still 1 and declared_unit_count is still 200 (the intruding line was never created)"
            - "ManifestLine.${ml1}.line_status is still ACTIVE"
            - "the identical submission by seller one succeeds: Lot.${lot1}.lot_status == PENDING_REVIEW"
            - "GET /liquidation/recovery-analytics?seller_id=${s2} as seller two returns 200 with gross_recovery_rate 0.0000 - the endpoint itself is reachable for the owner"

      - name: buyer_cannot_pay_or_claim_on_another_buyers_sale_order
        claim_type: Peer roles - Role A cannot touch role B's resources
        grounds:
          - roles.Buyer.ownership_rule
          - validations[priority 4 -> ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: >
          Ownership at priority 4 outranks every money and state check that follows: buyer two's
          payment for an amount that would be legal for buyer one still returns
          ERR_NOT_RESOURCE_OWNER rather than a 409/422, and so does buyer two's pickup booking on
          an UNPAID order - which would otherwise have produced ERR_ORDER_NOT_PAID at priority 11.
        test_recipe:
          setup:
            - "Two qualified buyers exist. Buyer one bought a 200-unit lot FIXED_PRICE at 1000000, so the order carries total_due_cents 1148500 and is UNPAID."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
