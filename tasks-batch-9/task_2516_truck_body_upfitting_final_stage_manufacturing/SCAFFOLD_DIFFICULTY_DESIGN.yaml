              captures: { ei_hoist: "$.data.id" }
            - call: "POST /upfit/electrical-interfaces"
              payload: { upfit_order_id: "${uo}", interface_method: "BODY_BUILDER_MODULE", circuit_amp_draw: 27, signal_source: "BODY_CONTROLLER" }
              as: UpfitEngineer
