      - name: amendment_apply_requires_lease_active
        grounds:
          - state_machines.Amendment.APPROVED_to_APPLIED
          - errors[ERR_LEASE_NOT_ACTIVE]
        distinguishing_aspect: |
          Pair (Amendment, Lease): Amendment.apply requires the parent Lease to be
          in ACTIVE state. Different entity pair from Reconciliation/RecoveryPool.
        test_recipe:
          setup:
            - "Lease in DRAFT (not yet ACTIVE); Amendment proposed"
            - "Amendment approve blocked: approve does not require ACTIVE, but apply does — so we attempt apply directly on a PROPOSED amendment to surface ERR_INVALID_STATE first; then we transition Lease toward ACTIVE but block via abstraction to show ERR_LEASE_NOT_ACTIVE on apply"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
