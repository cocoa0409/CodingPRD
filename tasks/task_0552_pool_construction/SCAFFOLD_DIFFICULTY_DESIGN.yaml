  - rule_id: boundary_precision_check
    instances:
      - name: draw_net_equals_remaining_inclusive_boundary
        grounds:
          - state_machines.DrawRequest.APPROVED_to_FUNDED
          - validations[priority=15]
          - entities.PoolProject.fields.amount_remaining_cents
          - errors[ERR_DRAW_EXCEEDS_CONTRACT]
        distinguishing_aspect: |
          Money-threshold boundary on the draw FUND endpoint: net_disbursed 90000 == amount_remaining
          90000 funds successfully because the fiscal rule is `<=` (inclusive); at 89999 remaining the
          same net would be rejected. Distinct metric/endpoint from the zero-count punch boundary.
        test_recipe:
          setup:
            - "Permitted project (contract 90000); EXCAVATION gate budget 100000, PASSED; a draw requested 100000, APPROVED."
          setup_api_calls:
