            - call: "POST /land-bank/acquisition-packets"
              payload: { property_id: "${p_id}", funding_source_id: "${fs_id}", channel: "TAX_FORECLOSURE", offer_price_cents: 0, title_search_fee_cents: 12000, foreclosure_case_no: "TF-2026-0091" }
