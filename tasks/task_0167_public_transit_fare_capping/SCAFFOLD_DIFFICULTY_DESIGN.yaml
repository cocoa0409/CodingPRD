scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: trip_fare_provisional_vs_settled_diverge
        grounds:
          - calculations.trip_provisional_fare
          - calculations.trip_settled_fare
          - state_machines.Trip.fare_status=PROVISIONAL_to_fare_status=SETTLED
          - entities.Trip.fields.provisional_fare_cents
          - entities.Trip.fields.settled_fare_cents
        distinguishing_aspect: |
          Two algorithms (forward_looking trip_provisional_fare vs chronological trip_settled_fare) operate on the
          Trip entity domain and produce DIFFERENT integer cent values for the same Trip when out-of-order
          (backdated tap_in_at) inserts force the chronological replay to differ from the live forward-looking view.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R (rider)"
            - "POST /transit/employers → E (monthly_contribution_cap_cents=31500)"
            - "POST /transit/fsa-accounts → A for (R, E)"
            - "POST /transit/fsa-contributions → 100 cents, month=2026-05 to A; A.balance_cents=100"
            - "POST /transit/cards → C STANDARD for R, valid 2026-05-01..2026-12-31"
            - "POST /transit/cards/{C}/top-up amount=1000; C.wallet_balance_cents=1000"
          trigger:
            - "POST /transit/_clock/advance to 2026-05-20T17:00:00Z"
            - "POST /transit/trips card=C, idempotency_key=k_A, tap_in_at=2026-05-20T17:00:00Z → Trip_A; A.balance=0; wallet=825; paid_from_fsa=100; daily accumulated=275"
            - "POST /transit/trips/{Trip_A}/tap-out tap_out_at=2026-05-20T17:20:00Z"
            - "POST /transit/_clock/advance to 2026-05-20T18:00:00Z"
            - "POST /transit/trips card=C, idempotency_key=k_B, tap_in_at=2026-05-20T13:00:00Z (backdated) → Trip_B; daily accumulated=550; paid_from_wallet=275; wallet=550"
            - "POST /transit/trips/{Trip_B}/tap-out tap_out_at=2026-05-20T13:20:00Z"
            - "POST /transit/_clock/advance to 2026-05-20T19:00:00Z"
            - "POST /transit/trips card=C, idempotency_key=k_C, tap_in_at=2026-05-20T09:00:00Z (backdated) → Trip_C; daily accumulated=600; paid_from_wallet=50; wallet=500"
            - "POST /transit/trips/{Trip_C}/tap-out tap_out_at=2026-05-20T09:20:00Z"
            - "POST /transit/_clock/advance to 2026-05-21T01:00:00Z (past DAILY window_end)"
            - "POST /transit/_sweep/settle"
          assert:
            - "Trip_A.provisional_fare_cents == 275"
            - "Trip_A.settled_fare_cents == 50"
            - "Trip_B.provisional_fare_cents == 275"
            - "Trip_B.settled_fare_cents == 275"
            - "Trip_C.provisional_fare_cents == 50"
            - "Trip_C.settled_fare_cents == 275"
            - "Trip_A.fare_status == 'SETTLED' AND Trip_A.provisional_fare_cents != Trip_A.settled_fare_cents"

      - name: low_income_eligibility_declared_vs_verified_diverge
        grounds:
          - calculations.low_income_eligibility
          - state_machines.LowIncomeVerification.PENDING_to_ACTIVE
          - state_machines.LowIncomeVerification.PENDING_to_REJECTED
          - entities.LowIncomeVerification.fields.declared_annual_income_cents
          - entities.LowIncomeVerification.fields.verified_annual_income_cents
        distinguishing_aspect: |
          Two algorithms (provisional_declared variant vs final_verified variant) operate on the LowIncomeVerification
          entity domain — a different entity domain from Trip — and produce DIFFERENT boolean eligibility for the same
          rider: declared=$25,000 passes the $30,000 threshold while verified=$35,000 fails, driving REJECTED instead of ACTIVE.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/low-income-verifications rider_id=R, declared_annual_income_cents=2500000 → V (status=PENDING)"
          trigger:
            - "POST /transit/low-income-verifications/{V}/approve verified_annual_income_cents=3500000"
          assert:
            - "V.declared_annual_income_cents == 2500000 (provisional eligibility: declared <= 3000000 → true)"
            - "V.verified_annual_income_cents == 3500000 (final eligibility: verified > 3000000 → false)"
            - "V.status == 'REJECTED'"
            - "Rider(R).low_income_verified == false"

  - rule_id: combinatorial_formula
    instances:
      - name: provisional_fare_three_input_min_max_nesting
        grounds:
          - calculations.trip_provisional_fare
          - entities.Trip.fields.provisional_fare_cents
          - entities.FareCard.fields.discount_class
          - entities.FareCapPeriod.fields.accumulated_cents
        distinguishing_aspect: |
          Mode (a): the formula has FIVE inputs (base_fare, discount_class enum-driven tiered rate, transfer_eligible
          boolean from prior-trip search, remaining_daily, remaining_weekly) and combines them with non-linear
          interaction (tiered enum selection feeding nested min over three quantities). Replacing any one input changes
          the result via a different code path, not a linear coefficient.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/reduced-fare-certificates rider_id=R, program_type=SENIOR, valid_from=2026-01-01T00:00:00Z, valid_until=2027-01-01T00:00:00Z → CERT"
            - "POST /transit/reduced-fare-certificates/{CERT}/approve → CERT.status=ACTIVE"
            - "POST /transit/cards rider_id=R, discount_class=REDUCED_FARE, valid_from=2026-05-01, valid_until=2026-12-31 → C"
            - "POST /transit/cards/{C}/top-up amount=1000"
            - "POST /transit/trips card=C idempotency_key=k1 tap_in_at=2026-05-20T09:00:00Z → Trip1"
            - "POST /transit/trips/{Trip1}/tap-out tap_out_at=2026-05-20T09:20:00Z"
            - "POST /transit/trips card=C idempotency_key=k2 tap_in_at=2026-05-20T11:30:00Z → Trip2 (>120min, no transfer)"
            - "POST /transit/trips/{Trip2}/tap-out tap_out_at=2026-05-20T11:50:00Z"
            - "POST /transit/trips card=C idempotency_key=k3 tap_in_at=2026-05-20T14:00:00Z → Trip3 (>120min, no transfer)"
            - "POST /transit/trips/{Trip3}/tap-out tap_out_at=2026-05-20T14:20:00Z"
            - "POST /transit/trips card=C idempotency_key=k4 tap_in_at=2026-05-20T16:30:00Z → Trip4 (>120min, no transfer; daily accumulated=414)"
            - "POST /transit/trips/{Trip4}/tap-out tap_out_at=2026-05-20T16:50:00Z"
          trigger:
            - "POST /transit/trips card=C idempotency_key=k5 tap_in_at=2026-05-20T19:00:00Z → Trip5"
          assert:
            - "Trip1.provisional_fare_cents == 138  # round_half_up(275*0.5) = 138; min(138, 600, 3300) = 138"
            - "Trip4.provisional_fare_cents == 138  # daily_accum before = 414; min(138, 600-414=186, ...) = 138"
            - "Trip5.provisional_fare_cents == 48  # daily_accum before = 552; min(138, 600-552=48, ...) = 48 (cap binding)"

      - name: refund_split_rounding_order_pinned
        grounds:
          - calculations.refund_split_on_dispute_or_overcharge
          - calculations.trip_settled_fare
          - entities.Trip.fields.paid_from_fsa_cents
          - entities.FareCard.fields.wallet_balance_cents
          - entities.CommuterBenefitAccount.fields.balance_cents
        distinguishing_aspect: |
          Mode (b): the partial-refund split rounds the FSA share FIRST via round_half_up, then derives the wallet
          share as (refund_total - refund_to_fsa) without a second rounding. The opposite order — round both shares
          independently — would drift by 1 cent: refund_to_fsa=round_half_up(225*100/275)=82 and
          refund_to_wallet=round_half_up(225*175/275)=143 sums to 225, but on a different ratio (e.g., 100*44/275)
          the two independent roundings can disagree with the conserved total by ±1. The scaffold pins FSA-first
          rounding and wallet absorbs the remainder.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/employers → E"
            - "POST /transit/fsa-accounts rider_id=R, employer_id=E → A"
            - "POST /transit/fsa-contributions account_id=A, amount_cents=100, contribution_month=2026-05 → C1; A.balance_cents=100"
            - "POST /transit/cards rider_id=R, discount_class=STANDARD, valid_from=2026-05-01, valid_until=2026-12-31 → Card"
            - "POST /transit/cards/{Card}/top-up amount_cents=1000"
            - "POST /transit/_clock/advance to 2026-05-20T17:00:00Z"
            - "POST /transit/trips card=Card, idempotency_key=k_A, tap_in_at=2026-05-20T17:00:00Z → Trip_A (provisional=275; paid_from_fsa=100; paid_from_wallet=175; A.balance=0; wallet=825)"
            - "POST /transit/trips/{Trip_A}/tap-out tap_out_at=2026-05-20T17:20:00Z"
            - "POST /transit/_clock/advance to 2026-05-20T18:00:00Z"
            - "POST /transit/trips card=Card, idempotency_key=k_B, tap_in_at=2026-05-20T13:00:00Z (backdated) → Trip_B (prov=275; paid_from_wallet=275; wallet=550)"
            - "POST /transit/trips/{Trip_B}/tap-out tap_out_at=2026-05-20T13:20:00Z"
            - "POST /transit/_clock/advance to 2026-05-20T19:00:00Z"
            - "POST /transit/trips card=Card, idempotency_key=k_C, tap_in_at=2026-05-20T09:00:00Z (backdated) → Trip_C (prov=50; paid_from_wallet=50; wallet=500)"
            - "POST /transit/trips/{Trip_C}/tap-out tap_out_at=2026-05-20T09:20:00Z"
          trigger:
            - "POST /transit/_clock/advance to 2026-05-21T01:00:00Z (past DAILY window_end)"
            - "POST /transit/_sweep/settle"
          assert:
            - "Trip_A.settled_fare_cents == 50 (chronological replay: C=275, B=275, A=min(275, 600-550)=50)"
            - "CommuterBenefitAccount(A).balance_cents == 82  # refund_to_fsa = round_half_up(225*100/275) = round_half_up(81.8181...) = 82"
            - "FareCard(Card).wallet_balance_cents == 418  # initial 500 + refund_to_wallet 143 (= 225-82) - back_charge 225 (Trip_C settled went 50→275) = 418"

  - rule_id: non_linear_state_machine
    instances:
      - name: trip_parallel_dimensions_travel_x_fare
        grounds:
          - state_machines.Trip
          - entities.Trip.fields.travel_status
          - entities.Trip.fields.fare_status
        distinguishing_aspect: |
          Trip carries TWO parallel state dimensions (travel_status and fare_status) evolving INDEPENDENTLY on the
          same row: a trip can be travel_status=COMPLETED while fare_status cycles PROVISIONAL→DISPUTED→SETTLED with
          travel_status untouched. The cross-product (TAPPED_IN/PROVISIONAL, COMPLETED/PROVISIONAL, COMPLETED/DISPUTED,
          COMPLETED/SETTLED) cannot be expressed as a single linear pipeline.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/cards rider_id=R, discount_class=STANDARD, valid_from=2026-05-01, valid_until=2026-12-31 → C"
            - "POST /transit/cards/{C}/top-up amount=1000"
            - "POST /transit/trips card=C idempotency_key=k tap_in_at=2026-05-20T10:00:00Z → Trip (travel=TAPPED_IN, fare=PROVISIONAL)"
            - "POST /transit/trips/{Trip}/tap-out tap_out_at=2026-05-20T10:20:00Z (travel=COMPLETED, fare=PROVISIONAL)"
            - "POST /transit/disputes trip_id=Trip → D (Trip.fare=DISPUTED, travel=COMPLETED)"
            - "POST /transit/disputes/{D}/claim (D=INVESTIGATING; Trip.fare=DISPUTED still; travel=COMPLETED still)"
          trigger:
            - "POST /transit/disputes/{D}/resolve decision=REJECT"
          assert:
            - "Trip.travel_status == 'COMPLETED' (unchanged across the entire fare-side cycle)"
            - "Trip.fare_status == 'SETTLED' (DISPUTED → SETTLED via dispute resolution)"
            - "Trip.tap_out_at == '2026-05-20T10:20:00.000Z' (set during travel transition only, untouched by fare transitions)"

      - name: dispute_case_cyclic_open_investigating
        grounds:
          - state_machines.DisputeCase
          - state_machines.DisputeCase.OPEN_to_INVESTIGATING
          - state_machines.DisputeCase.INVESTIGATING_to_OPEN
        distinguishing_aspect: |
          DisputeCase exhibits a CYCLE: OPEN → INVESTIGATING → OPEN (via request-evidence) is reachable any number of
          times before terminal RESOLVED_* states. This is a different entity from Trip and exhibits a cyclic shape
          rather than parallel dimensions, so the two non-linear shapes do not duplicate.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/cards rider_id=R, discount_class=STANDARD, valid_from=2026-05-01, valid_until=2026-12-31 → C"
            - "POST /transit/cards/{C}/top-up amount=1000"
            - "POST /transit/trips card=C idempotency_key=k tap_in_at=2026-05-20T10:00:00Z → Trip"
            - "POST /transit/trips/{Trip}/tap-out tap_out_at=2026-05-20T10:20:00Z"
            - "POST /transit/disputes trip_id=Trip → D (status=OPEN, cycle_count=0)"
          trigger:
            - "POST /transit/disputes/{D}/claim → D.status=INVESTIGATING"
            - "POST /transit/disputes/{D}/request-evidence → D.status=OPEN (cycle 1)"
            - "POST /transit/disputes/{D}/claim → D.status=INVESTIGATING"
            - "POST /transit/disputes/{D}/request-evidence → D.status=OPEN (cycle 2)"
          assert:
            - "D.status == 'OPEN' after second request-evidence (confirming the cycle is traversable repeatedly)"
            - "D.version >= 5 (incremented by every claim and request-evidence, so two full cycles add 4)"

  - rule_id: transitive_cascade
    instances:
      - name: dispute_refund_depth_4_cascade
        grounds:
          - state_machines.DisputeCase.INVESTIGATING_to_RESOLVED_REFUNDED
          - state_machines.Trip.fare_status=DISPUTED_to_fare_status=SETTLED
          - entities.FareCapPeriod.fields.accumulated_cents
          - calculations.refund_split_on_dispute_or_overcharge
          - calculations.trip_settled_fare
        distinguishing_aspect: |
          Depth-4 cascade triggered by a single AgencyOfficer action (DisputeCase resolve REFUND):
          Link 1: DisputeCase INVESTIGATING→RESOLVED_REFUNDED;
          Link 2: that mutation forces the disputed Trip's fare_status DISPUTED→SETTLED with settled=0;
          Link 3: the Trip's settled=0 forces FareCapPeriod.accumulated_cents to decrement by the original provisional_fare;
          Link 4: the decrement reopens cap room in the same window, forcing the chronological settle of OTHER trips
          in the same period to back-charge their wallets (a previously cap-free trip now has positive settled_fare).
          Each link is caused by the previous link, not by the original action.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/cards rider_id=R, discount_class=STANDARD, valid_from=2026-05-01, valid_until=2026-12-31 → C"
            - "POST /transit/cards/{C}/top-up amount=10000"
            - "POST /transit/trips card=C idempotency_key=k1 tap_in_at=2026-05-20T10:00:00Z → T1 (prov=275, wallet=9725, daily=275)"
            - "POST /transit/trips/{T1}/tap-out tap_out_at=2026-05-20T10:20:00Z"
            - "POST /transit/trips card=C idempotency_key=k2 tap_in_at=2026-05-20T13:00:00Z → T2 (>120 from T1; prov=275, wallet=9450, daily=550)"
            - "POST /transit/trips/{T2}/tap-out tap_out_at=2026-05-20T13:20:00Z"
            - "POST /transit/trips card=C idempotency_key=k3 tap_in_at=2026-05-20T16:00:00Z → T3 (>120 from T2; prov=50 cap-binding, wallet=9400, daily=600)"
            - "POST /transit/trips/{T3}/tap-out tap_out_at=2026-05-20T16:20:00Z"
            - "POST /transit/trips card=C idempotency_key=k4 tap_in_at=2026-05-20T19:00:00Z → T4 (>120 from T3; prov=0 cap-free, wallet=9400)"
            - "POST /transit/trips/{T4}/tap-out tap_out_at=2026-05-20T19:20:00Z"
            - "POST /transit/disputes trip_id=T1 → D"
            - "POST /transit/disputes/{D}/claim"
          trigger:
            - "POST /transit/disputes/{D}/resolve decision=REFUND"
          assert:
            - "D.status == 'RESOLVED_REFUNDED' (Link 1)"
            - "T1.fare_status == 'SETTLED' AND T1.settled_fare_cents == 0 (Link 2 caused by Link 1)"
            - "FareCapPeriod(DAILY, C, 2026-05-20).accumulated_cents == 325 (Link 3 caused by Link 2: 600 - 275 = 325)"
            - "T3.settled_fare_cents == 275 AND T4.settled_fare_cents == 50 (Link 4 caused by Link 3: re-evaluation back-charges previously-capped trips)"
            - "FareCard(C).wallet_balance_cents == 9400 + 275 (refund T1) - 225 (back-charge T3) - 50 (back-charge T4) = 9400"

      - name: employer_suspend_to_fsa_freeze_to_charge_path_diverted
        grounds:
          - state_machines.Employer
          - entities.CommuterBenefitAccount.fields.status
          - calculations.fsa_split_at_charge
          - entities.Trip.fields.paid_from_fsa_cents
        distinguishing_aspect: |
          Depth-2 cascade triggered by an entirely different action (Employer suspend, not dispute resolve):
          Link 1: Employer.enrollment_status ACTIVE→SUSPENDED;
          Link 2: every CommuterBenefitAccount with this employer_id flips ACTIVE→FROZEN;
          Subsequent Trip tap-ins by that employer's riders observe FROZEN and route their entire fare to the wallet
          (paid_from_fsa_cents == 0 even though account.balance_cents > 0). The origin trigger differs from the dispute
          cascade above, so the scaffold captures two distinct propagation patterns.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/employers → E"
            - "POST /transit/fsa-accounts rider_id=R, employer_id=E → A"
            - "POST /transit/fsa-contributions account_id=A, amount_cents=1000, contribution_month=2026-05 → A.balance_cents=1000"
            - "POST /transit/cards rider_id=R, discount_class=STANDARD, valid_from=2026-05-01, valid_until=2026-12-31 → C"
            - "POST /transit/cards/{C}/top-up amount_cents=1000"
          trigger:
            - "POST /transit/employers/{E}/suspend (Link 1)"
            - "POST /transit/trips card=C idempotency_key=k tap_in_at=2026-05-20T10:00:00Z → Trip (Link 2 observed at tap-in)"
          assert:
            - "Employer(E).enrollment_status == 'SUSPENDED' (Link 1)"
            - "CommuterBenefitAccount(A).status == 'FROZEN' (Link 2 caused by Link 1)"
            - "Trip.paid_from_fsa_cents == 0 (cascade outcome: FSA frozen, all 275 cents to wallet)"
            - "FareCard(C).wallet_balance_cents == 725 (1000 - 275)"
            - "CommuterBenefitAccount(A).balance_cents == 1000 (unchanged; FSA bypassed entirely)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: card_not_active_beats_insufficient_funds
        grounds:
          - validations[priority=7]
          - validations[priority=18]
        distinguishing_aspect: |
          Pair: category=state (priority 7, ERR_CARD_NOT_ACTIVE) vs category=business_fiscal (priority 18,
          ERR_INSUFFICIENT_FUNDS). When a SUSPENDED card with empty wallet tap-ins, BOTH would fail; the scaffold
          pins state-before-fiscal so ERR_CARD_NOT_ACTIVE wins.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/cards rider_id=R, discount_class=STANDARD, valid_from=2026-05-01, valid_until=2026-12-31 → C (wallet=0)"
            - "POST /transit/cards/{C}/suspend → C.status=SUSPENDED"
          trigger:
            - "POST /transit/trips card=C idempotency_key=k tap_in_at=2026-05-20T10:00:00Z (card suspended + wallet empty)"
          assert:
            - "Response.status == 409"
            - "Response.data.error_id == 'ERR_CARD_NOT_ACTIVE'  # state check wins over business_fiscal"

      - name: reference_not_found_beats_device_already_bound
        grounds:
          - validations[priority=5]
          - validations[priority=14]
        distinguishing_aspect: |
          Different category pair: category=existence (priority 5, ERR_REFERENCE_NOT_FOUND) vs category=
          business_constraint (priority 14, ERR_DEVICE_ALREADY_BOUND). On POST /transit/mobile-tokens with a
          nonexistent rider_id AND a device_fingerprint already registered to another rider, existence wins.
          This is a structurally different priority comparison from the state/fiscal pair above.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R_real"
            - "POST /transit/mobile-tokens rider_id=R_real, wallet_provider=APPLE_PAY, device_fingerprint='dev-XYZ' → Tok1"
          trigger:
            - "POST /transit/mobile-tokens rider_id='00000000-0000-0000-0000-000000000000' (nonexistent), wallet_provider=GOOGLE_PAY, device_fingerprint='dev-XYZ' (existence + uniqueness BOTH fail)"
          assert:
            - "Response.status == 404"
            - "Response.data.error_id == 'ERR_REFERENCE_NOT_FOUND'  # existence beats business_constraint"

  - rule_id: boundary_precision_check
    instances:
      - name: transfer_window_inclusive_120_minutes
        grounds:
          - calculations.trip_provisional_fare
          - entities.Trip.fields.transfer_link_id
          - endpoints.POST_/transit/trips
        distinguishing_aspect: |
          Boundary on the TRANSFER_WINDOW_MINUTES metric (minutes between two tap_in_at values), on
          POST /transit/trips. Spec pins `0 < delta <= 120 minutes`. At exactly 120 minutes the second leg is
          transfer-eligible (provisional_fare_cents=0). At 120 minutes + 1 second the second leg is NOT eligible
          (provisional_fare_cents=275). Distinct metric (time delta) from the cap-cents boundary below.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R1, R2"
            - "POST /transit/cards rider_id=R1, discount_class=STANDARD, valid_from=2026-05-01, valid_until=2026-12-31 → C1; top-up 1000"
            - "POST /transit/cards rider_id=R2, discount_class=STANDARD, valid_from=2026-05-01, valid_until=2026-12-31 → C2; top-up 1000"
            - "POST /transit/trips card=C1, idempotency_key=k1a, tap_in_at=2026-05-20T10:00:00Z → T1a"
            - "POST /transit/trips/{T1a}/tap-out tap_out_at=2026-05-20T10:20:00Z"
            - "POST /transit/trips card=C2, idempotency_key=k2a, tap_in_at=2026-05-20T10:00:00Z → T2a"
            - "POST /transit/trips/{T2a}/tap-out tap_out_at=2026-05-20T10:20:00Z"
          trigger:
            - "POST /transit/trips card=C1, idempotency_key=k1b, tap_in_at=2026-05-20T12:00:00Z → T1b (delta = exactly 120min, inclusive)"
            - "POST /transit/trips card=C2, idempotency_key=k2b, tap_in_at=2026-05-20T12:00:01Z → T2b (delta = 120min 1s, exclusive)"
          assert:
            - "T1b.provisional_fare_cents == 0  # transfer eligible at exact boundary"
            - "T1b.transfer_link_id IS NOT NULL"
            - "T2b.provisional_fare_cents == 275  # not eligible beyond boundary"
            - "T2b.transfer_link_id IS NULL"

      - name: fsa_monthly_cap_inclusive_31500
        grounds:
          - validations[priority=17]
          - entities.Employer.fields.monthly_contribution_cap_cents
          - endpoints.POST_/transit/fsa-contributions
        distinguishing_aspect: |
          Boundary on the FSA monthly contribution sum metric (cents, not minutes), on POST /transit/fsa-contributions
          — a structurally different endpoint and metric from the transfer-window boundary. Spec pins
          `sum + new_amount <= monthly_contribution_cap_cents`. At exactly 31500 the contribution succeeds; at 31501 it
          is rejected with ERR_FSA_MONTHLY_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/employers monthly_contribution_cap_cents=31500 → E"
            - "POST /transit/fsa-accounts rider_id=R, employer_id=E → A"
            - "POST /transit/fsa-contributions account_id=A, amount_cents=31499, contribution_month=2026-05 (running sum = 31499)"
          trigger:
            - "POST /transit/fsa-contributions account_id=A, amount_cents=1, contribution_month=2026-05 (would reach exactly 31500) → expect SUCCESS"
            - "POST /transit/fsa-contributions account_id=A, amount_cents=1, contribution_month=2026-05 (would push to 31501) → expect FAILURE"
          assert:
            - "First trigger: Response.status == 201; CommuterBenefitAccount(A).balance_cents == 31500"
            - "Second trigger: Response.status == 409; Response.data.error_id == 'ERR_FSA_MONTHLY_CAP_EXCEEDED'"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: trip_tapin_blocked_by_card_status
        grounds:
          - validations[priority=7]
          - state_machines.FareCard.ACTIVE_to_SUSPENDED
          - entities.FareCard.fields.status
          - state_machines.Trip
        distinguishing_aspect: |
          Trip's tap-in transition depends on FareCard.status (an OTHER entity's state). Trip+FareCard pair. When
          FareCard.status=SUSPENDED, no Trip can be created on it regardless of any other rider/wallet/cap fact.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/cards rider_id=R, discount_class=STANDARD, valid_from=2026-05-01, valid_until=2026-12-31 → C; top-up 1000"
            - "POST /transit/cards/{C}/suspend → C.status=SUSPENDED"
          trigger:
            - "POST /transit/trips card=C, idempotency_key=k, tap_in_at=2026-05-20T10:00:00Z"
          assert:
            - "Response.status == 409"
            - "Response.data.error_id == 'ERR_CARD_NOT_ACTIVE'"
            - "FareCard(C).status == 'SUSPENDED' (the gating state on the OTHER entity)"

      - name: fsa_contribution_blocked_by_employer_status
        grounds:
          - state_machines.Employer
          - entities.Employer.fields.enrollment_status
          - entities.CommuterBenefitAccount.fields.status
          - endpoints.POST_/transit/fsa-contributions
        distinguishing_aspect: |
          FSAContribution's create depends on Employer.enrollment_status — a DIFFERENT entity pair (FSAContribution+Employer,
          not Trip+FareCard). When Employer.enrollment_status=SUSPENDED (cascading FROZEN onto CommuterBenefitAccount),
          POST /transit/fsa-contributions on that account is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/employers → E"
            - "POST /transit/fsa-accounts rider_id=R, employer_id=E → A"
            - "POST /transit/employers/{E}/suspend → E.enrollment_status=SUSPENDED, A.status=FROZEN"
          trigger:
            - "POST /transit/fsa-contributions account_id=A, amount_cents=1000, contribution_month=2026-05"
          assert:
            - "Response.status == 409"
            - "Response.data.error_id == 'ERR_INVALID_STATE'"
            - "CommuterBenefitAccount(A).balance_cents == 0 (unchanged)"
            - "Employer(E).enrollment_status == 'SUSPENDED' (the gating state on the OTHER entity)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: trip_in_flight_blocks_concurrent_tapin
        grounds:
          - validations[priority=8]
          - state_machines.Trip
          - entities.Trip.fields.travel_status
          - concurrency_rules[Two tap-ins on the same card while one Trip is still TAPPED_IN]
        distinguishing_aspect: |
          Interval semantics: an in-flight Trip occupies a half-OPEN interval (tap_in_at, ∞) on the card until
          tap_out_at is set. Adjacency/buffer treatment: no buffer — the moment tap-out happens, a new tap-in is
          allowed in the same instant. Resource entity: FareCard.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/cards rider_id=R, discount_class=STANDARD, valid_from=2026-05-01, valid_until=2026-12-31 → C; top-up 1000"
            - "POST /transit/trips card=C, idempotency_key=k1, tap_in_at=2026-05-20T10:00:00Z → T1 (TAPPED_IN, no tap-out)"
          trigger:
            - "POST /transit/trips card=C, idempotency_key=k2, tap_in_at=2026-05-20T10:30:00Z (T1 still TAPPED_IN)"
          assert:
            - "Response.status == 409"
            - "Response.data.error_id == 'ERR_TRIP_ALREADY_OPEN'"

      - name: reduced_fare_certificate_window_overlap
        grounds:
          - validations[priority=9]
          - entities.ReducedFareCertificate.fields.valid_from
          - entities.ReducedFareCertificate.fields.valid_until
          - entities.ReducedFareCertificate.fields.program_type
          - concurrency_rules[Two ReducedFareCertificate approvals creating overlapping validity windows]
        distinguishing_aspect: |
          Different interval semantics: a CLOSED interval [valid_from, valid_until] on a DIFFERENT resource entity
          (ReducedFareCertificate, not FareCard). Geometric treatment: any shared point — including a single endpoint
          shared between two windows — counts as overlap. No buffer; aggregate capacity is exactly 1 ACTIVE certificate
          per (rider_id, program_type) at any moment.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/reduced-fare-certificates rider_id=R, program_type=SENIOR, valid_from=2026-01-01T00:00:00Z, valid_until=2026-12-31T23:59:59Z → CERT1"
            - "POST /transit/reduced-fare-certificates/{CERT1}/approve → CERT1.status=ACTIVE"
            - "POST /transit/reduced-fare-certificates rider_id=R, program_type=SENIOR, valid_from=2026-06-01T00:00:00Z, valid_until=2027-06-01T00:00:00Z → CERT2 (overlaps [2026-06-01, 2026-12-31])"
          trigger:
            - "POST /transit/reduced-fare-certificates/{CERT2}/approve"
          assert:
            - "Response.status == 409"
            - "Response.data.error_id == 'ERR_CERTIFICATE_WINDOW_OVERLAP'"
            - "ReducedFareCertificate(CERT2).status == 'PENDING' (unchanged)"

  - rule_id: compensating_invariant
    instances:
      - name: dispute_refund_preserves_wallet_plus_settled_total
        grounds:
          - state_machines.DisputeCase.INVESTIGATING_to_RESOLVED_REFUNDED
          - calculations.refund_split_on_dispute_or_overcharge
          - entities.FareCard.fields.wallet_balance_cents
          - entities.Trip.fields.settled_fare_cents
        distinguishing_aspect: |
          Conserved quantity #1: TOTAL_RIDER_FUNDS = FareCard.wallet_balance_cents + sum(Trip.settled_fare_cents for
          this card). Forward action = tap-in (debits wallet, no settled yet → conserved counts unsettled as 0 then
          becomes settled at sweep). Compensating action = dispute REFUND, which sets settled_fare_cents=0 and credits
          back exactly provisional_fare_cents to wallet. Pre-action TOTAL_RIDER_FUNDS == post-compensation TOTAL_RIDER_FUNDS.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/cards rider_id=R, discount_class=STANDARD, valid_from=2026-05-01, valid_until=2026-12-31 → C"
            - "POST /transit/cards/{C}/top-up amount_cents=10000  # initial wallet = 10000"
            - "POST /transit/trips card=C, idempotency_key=k, tap_in_at=2026-05-20T10:00:00Z → T (prov=275; wallet=9725)"
            - "POST /transit/trips/{T}/tap-out tap_out_at=2026-05-20T10:20:00Z"
            - "POST /transit/_clock/advance to 2026-05-21T01:00:00Z"
            - "POST /transit/_sweep/settle  # T.fare_status=SETTLED, settled_fare_cents=275"
            - "POST /transit/disputes trip_id=T → D"
            - "POST /transit/disputes/{D}/claim"
          trigger:
            - "POST /transit/disputes/{D}/resolve decision=REFUND"
          assert:
            - "FareCard(C).wallet_balance_cents == 10000  # restored fully by refund"
            - "Trip(T).settled_fare_cents == 0  # refund forces settled to zero"
            - "TOTAL_RIDER_FUNDS_post == 10000 + 0 == TOTAL_RIDER_FUNDS_pre (10000 + 0 prior to tap-in)"

      - name: fsa_reversal_preserves_employer_contribution_net
        grounds:
          - endpoints.POST_/transit/fsa-contributions
          - endpoints.POST_/transit/fsa-contributions/{contrib_id}/reverse
          - entities.FSAContribution.fields.amount_cents
          - entities.FSAContribution.fields.status
          - entities.CommuterBenefitAccount.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity #2 (DIFFERENT type from quantity #1 above): EMPLOYER_NET_OUTFLOW = sum(FSAContribution
          .amount_cents) − sum(Trip.paid_from_fsa_cents on settled trips drawing from this account). Forward action =
          contribution (credits account, raises sum). Compensating action = reverse (creates negated FSAContribution).
          A contribute-then-reverse cycle with no intervening trips leaves both the contributions ledger sum AND the
          account balance at their pre-cycle values.
        test_recipe:
          setup:
            - "POST /transit/_clock/advance to 2026-05-20T08:00:00Z"
            - "POST /transit/riders → R"
            - "POST /transit/employers → E"
            - "POST /transit/fsa-accounts rider_id=R, employer_id=E → A  # initial balance=0"
            - "POST /transit/fsa-contributions account_id=A, amount_cents=5000, contribution_month=2026-05 → C1 (balance=5000)"
          trigger:
            - "POST /transit/fsa-contributions/{C1}/reverse  # creates C1_neg with amount_cents=-5000"
          assert:
            - "CommuterBenefitAccount(A).balance_cents == 0  # restored to pre-contribution value"
            - "sum(FSAContribution.amount_cents where account_id=A and status='APPLIED') == 0  # 5000 + (-5000)"
            - "EMPLOYER_NET_OUTFLOW_post == EMPLOYER_NET_OUTFLOW_pre (both 0; no trips drew from FSA)"
