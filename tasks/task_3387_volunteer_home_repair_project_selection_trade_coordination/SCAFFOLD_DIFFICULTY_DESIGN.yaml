  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: candidacy_requires_latest_assessment_scoped
        grounds:
          - state_machines.HomeownerApplication.ASSESSED_to_CANDIDATE
          - state_machines.HomeAssessment.COMPLETED_to_SCOPED
        distinguishing_aspect: |
          Pair HomeownerApplication x HomeAssessment: the CANDIDATE transition
          is rejected while the application's latest assessment is merely
          COMPLETED, and succeeds only after that assessment reaches SCOPED.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Application VERIFIED with an assessment completed (status COMPLETED, not yet SCOPED) — application is ASSESSING... (see chain; the failed CANDIDATE attempt happens from the post-completion state)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rebuild/funding-cycles"
              payload: { name: "FY27", fiscal_year: 2027, total_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { cyc: $.data.id }
            - call: "POST /rebuild/applications"
              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Gate A", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "17 Tenth St" }
              as: Anonymous
              captures: { app: $.data.id }
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "UNDER_VERIFICATION" }
              as: AffiliateStaff
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "VERIFIED" }
              as: AffiliateStaff
            - call: "POST /rebuild/assessments"
              payload: { application_id: "${app}", scheduled_on: "2026-09-02" }
              as: AffiliateStaff
              captures: { asm: $.data.id }
            - call: "POST /rebuild/assessments/${asm}/complete"
              payload: { safety_hazard_max_severity: 0, accessibility_needs_count: 0, scope_items: [{ category: "GENERAL", required_trade: "NONE", volunteer_performable: true, requires_permit: false, est_low_cents: 100000, est_high_cents: 100000, description: "paint" }] }
              as: Assessor
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "CANDIDATE" }
              as: AffiliateStaff
              captures: { err: $.data.error_id }
            - call: "PATCH /rebuild/assessments/${asm}"
              payload: { status: "SCOPED" }
              as: AffiliateStaff
          trigger:
            - call: "PATCH /rebuild/applications/${app}"
              payload: { status: "CANDIDATE" }
              as: AffiliateStaff
              captures: { st: $.data.status }
          assert:
            - "err == ERR_INVALID_STATE (the application is ASSESSING until its latest assessment is SCOPED — the state machine blocks CANDIDATE from ASSESSING at all)"
            - "st == CANDIDATE once the assessment is SCOPED (application auto-advanced to ASSESSED, making the transition legal)"
            - "the gating fact lives on HomeAssessment.status, a different entity than the one being transitioned"

      - name: event_lock_blocked_until_trade_work_scheduled
        grounds:
          - state_machines.RebuildEvent.PUBLISHED_to_LOCKED
          - entities.Project.fields.readiness_posture
          - errors[ERR_EVENT_NOT_LOCKABLE]
        distinguishing_aspect: |
          Pair RebuildEvent x TradeWorkOrder: LOCKED is rejected while a
          licensed-trade scope item is covered only by a QUOTE_REQUESTED order
          (posture BLOCKED), and succeeds after that order is SCHEDULED
          (posture READY) — the event's gate reads a different entity's state.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One selected project with one ELECTRICAL item (100000..100000) and one volunteer item (50000..50000) — estimate 150000, envelope 172500. Event (2026-10-10, max 2) PUBLISHED with a team leader enrolled. A work order exists but is only QUOTE_REQUESTED."
