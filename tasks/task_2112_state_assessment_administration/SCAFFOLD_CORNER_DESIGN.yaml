            - "read_created == 2026-08-01T00:00:00.000Z"
            - "the second trigger call returns HTTP 200 with data.current_utc == 2026-12-25T09:30:00.000Z"
            - "District.${d_id}.created_at == 2026-08-01T00:00:00.000Z"

