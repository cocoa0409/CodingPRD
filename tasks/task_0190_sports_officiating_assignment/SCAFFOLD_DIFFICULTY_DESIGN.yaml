  # ===========================================================================
  # OCC stale-version (concurrency_rules) — grouped under the concurrency layer.
  - rule_id: boundary_precision_check
    instances:
      - name: stale_game_version_on_offer_rejected_412
        grounds:
          - concurrency_rules[slot-offer-stale-game]
          - entities.Game.fields.version
          - errors[ERR_STALE_GAME_VERSION]
        distinguishing_aspect: "OCC boundary on Game.version (distinct metric, endpoint POST /crew-slots/{id}/offer): a 2-slot game whose first slot is accepted bumps Game.version; a second offer carrying the pre-accept (stale) version is rejected 412."
        test_recipe:
          setup:
            - "League OPEN; 2-slot game OPEN; first slot offered+accepted bumps Game.version; a second offer carrying the stale pre-accept version is rejected."
          setup_api_calls:
            - call: "POST /leagues"
