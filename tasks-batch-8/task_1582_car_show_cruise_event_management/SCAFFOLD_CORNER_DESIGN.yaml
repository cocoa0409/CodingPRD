scaffold_corner_design:
  - section: entities
    instances:
      - name: event_creation_missing_required_returns_400
        claim_type: required_fields
        grounds: ["entities.Event.fields.name", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /events without the required field `name` is rejected with ERR_VALIDATION (400) before any existence or state check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /events", payload: { event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00" }, as: Organizer, captures: { err: $.data.error_id } }
          assert:
            - "error == ERR_VALIDATION (HTTP 400); no Event row is created"

      - name: event_defaults_applied_on_create
        claim_type: defaults
        grounds: ["entities.Event.fields.tabulation_method", "entities.Event.fields.liability_policy_number", "entities.Event.fields.weather_posture"]
        distinguishing_aspect: "Omitting tabulation_method and liability_policy_number yields STRAIGHT_AVERAGE and empty policy; lifecycle DRAFT, posture NORMAL, permit ACTIVE, treasury 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /events", payload: { name: "Defaults", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00" }, as: Organizer, captures: { ev: $.data.id } }
          assert:
            - "Event.${ev}.tabulation_method == STRAIGHT_AVERAGE and liability_policy_number == '' (defaults applied)"
            - "lifecycle_status == DRAFT, weather_posture == NORMAL, sound_permit_status == ACTIVE"
            - "treasury_cents == 0 and noise_exceedance_count == 0 and version == 1"

      - name: event_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Event.fields.treasury_cents", "entities.Event.fields.noise_exceedance_count"]
        distinguishing_aspect: "Client-supplied computed fields (treasury_cents, noise_exceedance_count, lifecycle_status) in the create payload are ignored, not honored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /events", payload: { name: "Ignored", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", treasury_cents: 9999, lifecycle_status: "FINALIZED" }, as: Organizer, captures: { ev: $.data.id } }
          assert:
            - "Event.${ev}.treasury_cents == 0 (client value 9999 ignored)"
            - "lifecycle_status == DRAFT (client value FINALIZED ignored)"

      - name: registration_pricing_tier_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Registration.fields.pricing_tier", "entities.Registration.fields.fee_cents"]
        distinguishing_aspect: "pricing_tier is server-derived from the logical clock vs prereg_deadline; a client-supplied DAY_OF at pre-deadline clock is ignored and PREREG pricing applies."
        test_recipe:
          setup: ["Event REGISTRATION_OPEN, class prereg 3000, clock at default 2026-08-01 (before deadline)"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Tier", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "TI", email: "ti@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}", pricing_tier: "DAY_OF" }, as: RegistrationDesk, captures: { r1: $.data.id, tier: $.data.pricing_tier, fee: $.data.fee_cents } }
          assert:
            - "pricing_tier == PREREG (client DAY_OF ignored) and fee_cents == 3000 (non-member prereg)"

      - name: payment_immutable_common_fields_absent
        claim_type: immutability
        grounds: ["entities.Payment"]
        distinguishing_aspect: "Payment has common_fields: false — the create response carries id and created_at but no version or updated_at, and no update endpoint exists for the ledger."
        test_recipe:
          setup: ["Event REGISTRATION_OPEN; one registration PENDING_PAYMENT with fee 3000"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Ledger Shape", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "LS", email: "ls@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk, captures: { pay: $.data.id } }
          assert:
            - "Payment.${pay} response contains id, created_at, kind ENTRY_FEE, amount_cents 3000, status SUCCEEDED"
            - "Payment response has NO version and NO updated_at key (append-only ledger)"

      - name: registration_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "GET on a well-formed but non-existent registration UUID yields ERR_NOT_FOUND (404); same for a non-existent event id in a nested path."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /registrations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Organizer, captures: { err: $.data.error_id } }
            - { call: "GET /events/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/classes", payload: {}, as: Organizer }
          assert:
            - "first call: error == ERR_NOT_FOUND (HTTP 404)"
            - "second call: ERR_NOT_FOUND for the leftmost missing path segment (the event)"

      - name: registrations_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "entities.Registration"]
        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more: 2 registrations, limit=1 gives has_more true then false on the second page."
        test_recipe:
          setup: ["Event REGISTRATION_OPEN with two registrations (both PENDING_PAYMENT)"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Page Show", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "P1", email: "p1@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { pa: $.data.id } }
            - { call: "POST /registrants/${pa}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /registrants/${pa}/vehicles", payload: { year: 1971, make: "Chevrolet", model: "Chevelle" }, as: Organizer, captures: { v2: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${pa}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${pa}", vehicle_id: "${v2}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r2: $.data.id } }
          trigger:
            - { call: "GET /registrations", payload: { event_id: "${ev}", limit: 1, offset: 0 }, as: Organizer }
            - { call: "GET /registrations", payload: { event_id: "${ev}", limit: 1, offset: 1 }, as: Organizer }
          assert:
            - "page 1: exactly 1 item, total_count == 2, has_more == true"
            - "page 2: exactly 1 item, total_count == 2, has_more == false, and the two pages contain ${r1} and ${r2} without overlap"

  - section: state_machines
    instances:
      - name: event_publish_twice_returns_409
        claim_type: invalid_transition
        grounds: ["state_machines.Event.DRAFT_to_PUBLISHED", "errors[ERR_INVALID_EVENT_STATE]"]
        distinguishing_aspect: "publish is valid only from DRAFT; a second publish on PUBLISHED fails with ERR_INVALID_EVENT_STATE and changes nothing."
        test_recipe:
          setup: ["Event published (class + zone present, policy set)"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Twice", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
          trigger:
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer, captures: { err: $.data.error_id } }
          assert:
            - "error == ERR_INVALID_EVENT_STATE (HTTP 409); lifecycle_status remains PUBLISHED"

      - name: weather_cancelled_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.Event", "entities.Event.fields.weather_posture"]
        distinguishing_aspect: "CANCELLED is terminal for the weather axis: any further weather-decision (e.g. back to WATCH) fails with ERR_INVALID_EVENT_STATE."
        test_recipe:
          setup: ["Event REGISTRATION_OPEN, posture already CANCELLED"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Locked", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/weather-decision", payload: { posture: "CANCELLED", reason: "flooding" }, as: Organizer }
          trigger:
            - { call: "POST /events/${ev}/weather-decision", payload: { posture: "WATCH", reason: "maybe clearing" }, as: Organizer, captures: { err: $.data.error_id } }
          assert:
            - "error == ERR_INVALID_EVENT_STATE (HTTP 409); weather_posture remains CANCELLED"

      - name: registration_initial_state_pending
        claim_type: initial_state
        grounds: ["state_machines.Registration"]
        distinguishing_aspect: "A new registration starts in PENDING_PAYMENT with paid_cents 0, refunded_cents 0, no spot, no zone."
        test_recipe:
          setup: ["Event REGISTRATION_OPEN"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Init", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 50, has_power: false }, as: Organizer }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "IN", email: "in@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
          trigger:
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
          assert:
            - "Registration.${r1}.status == PENDING_PAYMENT, paid_cents == 0, refunded_cents == 0"
            - "spot_number is null and assigned_zone_id is null and checked_in_at is null"
            - "fee_cents == 3000 and pricing_tier == PREREG"

      - name: checkin_assigns_lowest_spot_and_timestamp
        claim_type: side_effect_execution
        grounds: ["state_machines.Registration.CONFIRMED_to_CHECKED_IN", "entities.Registration.fields.spot_number"]
        distinguishing_aspect: "Check-in executes all declared side effects at once: lowest free spot 1, checked_in_at equals the logical clock, zone FK set, zone count incremented."
        test_recipe:
          setup: ["Registration CONFIRMED with signed waiver; zone window 08:00-10:00; clock 08:30"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "Side FX", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 10, has_power: false, arrival_window_start: "2026-08-15T08:00:00Z", arrival_window_end: "2026-08-15T10:00:00Z" }, as: Organizer, captures: { zn: $.data.id } }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "SF", email: "sf@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /waivers", payload: { event_id: "${ev}", registrant_id: "${p1}", signature_name: "SF" }, as: RegistrationDesk }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T08:30:00Z" }, as: Organizer }
          trigger:
            - { call: "POST /registrations/${r1}/check-in", payload: { zone_id: "${zn}" }, as: RegistrationDesk, captures: { st: $.data.status, spot: $.data.spot_number, cz: $.data.assigned_zone_id, ct: $.data.checked_in_at } }
          assert:
            - "status == CHECKED_IN, spot_number == 1, assigned_zone_id == ${zn}"
            - "checked_in_at == 2026-08-15T08:30:00Z (logical clock, not wall clock)"
            - "GET /events/${ev}/zones shows assigned_count == 1"

      - name: no_show_auto_transition_at_start_judging
        claim_type: side_effect_execution
        grounds: ["state_machines.Registration.CONFIRMED_to_NO_SHOW", "state_machines.Event.REGISTRATION_LOCKED_to_JUDGING"]
        distinguishing_aspect: "start-judging flips every still-CONFIRMED registration to NO_SHOW (system actor) and releases its class count; a CHECKED_IN registration is untouched."
        test_recipe:
          setup: ["Event REGISTRATION_LOCKED with R1 CONFIRMED (paid, never arrived) and R2 CHECKED_IN; people's-choice class so no judged gating"]
          setup_api_calls:
            - { call: "POST /events", payload: { name: "NoShow", event_date: "2026-08-15", gates_open_at: "2026-08-15T09:00:00Z", judging_start_at: "2026-08-15T12:00:00Z", judging_end_at: "2026-08-15T14:00:00Z", ballot_close_at: "2026-08-15T14:30:00Z", prereg_deadline: "2026-08-14T23:59:59Z", curfew_start: "22:00", curfew_end: "07:00", liability_policy_number: "POL-1" }, as: Organizer, captures: { ev: $.data.id } }
            - { call: "POST /events/${ev}/classes", payload: { code: "OPEN", name: "Open", min_year: 1900, max_year: 2026, prereg_fee_cents: 3000, day_of_fee_cents: 4500, capacity: 40, judging_mode: "PEOPLES_CHOICE", award_depth: 1 }, as: Organizer, captures: { cl: $.data.id } }
            - { call: "POST /events/${ev}/zones", payload: { name: "Field", zone_type: "SHOW_FIELD", capacity: 10, has_power: false, arrival_window_start: "2026-08-15T08:00:00Z", arrival_window_end: "2026-08-15T10:00:00Z" }, as: Organizer, captures: { zn: $.data.id } }
            - { call: "POST /events/${ev}/publish", payload: {}, as: Organizer }
            - { call: "POST /events/${ev}/open-registration", payload: {}, as: Organizer }
            - { call: "POST /registrants", payload: { full_name: "NS1", email: "ns1@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p1: $.data.id } }
            - { call: "POST /registrants/${p1}/vehicles", payload: { year: 1970, make: "Ford", model: "Mustang" }, as: Organizer, captures: { v1: $.data.id } }
            - { call: "POST /registrations", payload: { event_id: "${ev}", registrant_id: "${p1}", vehicle_id: "${v1}", class_id: "${cl}" }, as: RegistrationDesk, captures: { r1: $.data.id } }
            - { call: "POST /registrations/${r1}/payments", payload: { amount_cents: 3000, method: "CASH" }, as: RegistrationDesk }
            - { call: "POST /registrants", payload: { full_name: "NS2", email: "ns2@example.com", club_member: false, is_minor: false }, as: Organizer, captures: { p2: $.data.id } }
            - { call: "POST /registrants/${p2}/vehicles", payload: { year: 1971, make: "Chevrolet", model: "Chevelle" }, as: Organizer, captures: { v2: $.data.id } }
