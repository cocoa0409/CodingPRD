  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_success_and_error
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Every response wraps data in the fixed envelope: success carries meta.api_request_id, meta.api_request_timestamp and response_type 'object'; failure carries response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup: ["One mold registered"]
          setup_api_calls:
            - { call: "POST /molds", payload: { mold_code: "MOLD-EN1", maintenance_interval_cycles: 10, prototype_parts_required: 1 }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
          trigger:
            - { call: "GET /molds/${mold_id}", payload: {}, as: ShopManager }
            - { call: "GET /molds/00000000-0000-0000-0000-000000000000", payload: {}, as: ShopManager, captures: { err: $.data.error_id } }
          assert:
            - "success response: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data holds the Mold"
            - "error response: response_type == error, err == ERR_NOT_FOUND, data.message present"

      - name: workorder_list_pagination_and_filter
        claim_type: listing
        grounds: ["endpoints[GET /work-orders]", response_envelope.pagination_fields]
        distinguishing_aspect: "Filter mold_id plus limit 1 returns exactly one item with total_count 2 and has_more true; offset 1 returns the second; defaults limit 10 / offset 0 per the fixed envelope."
        test_recipe:
          setup: ["One production mold; approved PN-100; two RELEASED work orders on the mold; one work order on a second mold"]
          setup_api_calls:
            - { call: "POST /molds", payload: { mold_code: "MOLD-PG1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold1: $.data.id } }
            - { call: "POST /molds", payload: { mold_code: "MOLD-PG2", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold2: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-PG1", part_number: "PN-100", mold_id: "${mold1}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_pg1: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-PG2", part_number: "PN-100", mold_id: "${mold1}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_pg2: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-PG3", part_number: "PN-100", mold_id: "${mold2}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "GET /work-orders?mold_id=${mold1}&limit=1&offset=0", payload: {}, as: ShopManager, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /work-orders?mold_id=${mold1}&limit=1&offset=1", payload: {}, as: ShopManager, captures: { second_id: "$.data[0].id" } }
          assert:
            - "first page: exactly 1 item, total_count == 2, has_more == true"
            - "second page: exactly 1 item, has_more == false"
            - "first_id != second_id and both belong to mold ${mold1} (the ${mold2} order is filtered out)"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: void_session_on_quenched_batch_rejected
        claim_type: violation_to_error
        grounds: [state_machines.LayupSession.ACTIVE_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Voiding a session whose batch was quenched is refused: disposed mass cannot be returned to a QUENCHED batch."
        test_recipe:
          setup: ["Clock T0; permit; approved PN-100; production mold; WO in LAYUP_IN_PROGRESS; session recorded; batch then quenched"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-VQ1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-VQ1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-VQ1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 100 }, as: Laminator, as_user_id: "op-lam-1", captures: { sess: $.data.id } }
            - { call: "POST /resin-batches/${batch_id}/quench", payload: {}, as: Laminator, as_user_id: "op-lam-1", captures: { b_status: $.data.status } }
          trigger:
            - { call: "POST /layup-sessions/${sess}/void", payload: {}, as: ShopManager, captures: { err: $.data.error_id } }
          assert:
            - "b_status == QUENCHED"
            - "err == ERR_INVALID_STATE"

      - name: consume_beyond_remaining_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_RESIN_MASS_INSUFFICIENT]", entities.ResinBatch.fields.remaining_mass_g]
        distinguishing_aspect: "resin_used_g 2000 against remaining 1020 fails with ERR_RESIN_MASS_INSUFFICIENT and the batch is unchanged."
        test_recipe:
          setup: ["Clock T0; permit; approved PN-100; production mold; WO in LAYUP_IN_PROGRESS; batch total 1020 g"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-MS1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-MS1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-MS1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
          trigger:
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 2000 }, as: Laminator, as_user_id: "op-lam-1", captures: { err: $.data.error_id } }
            - { call: "GET /resin-batches/${batch_id}", payload: {}, as: Laminator, as_user_id: "op-lam-1", captures: { remaining: $.data.remaining_mass_g, b_status: $.data.status } }
          assert:
            - "err == ERR_RESIN_MASS_INSUFFICIENT"
            - "remaining == 1020.0 and b_status == MIXED (rejected session changed nothing)"

      - name: batch_exhausted_at_exact_zero_then_rejected
        claim_type: violation_to_error
        grounds: [state_machines.ResinBatch.MIXED_to_EXHAUSTED, "errors[ERR_RESIN_BATCH_NOT_USABLE]"]
        distinguishing_aspect: "Consuming exactly the remaining 408 g (== boundary) is admitted and flips the batch EXHAUSTED; any further session hits ERR_RESIN_BATCH_NOT_USABLE."
        test_recipe:
          setup: ["Clock T0; permit; approved PN-100; production mold; WO in LAYUP_IN_PROGRESS; small batch total 408 g (400 resin + 8 catalyst)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-EX1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-EX1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-EX1", resin_system: "POLYESTER", resin_mass_g: 400, catalyst_mass_g: 8, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
          trigger:
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 408 }, as: Laminator, as_user_id: "op-lam-1", captures: { sess_status: $.data.status } }
            - { call: "GET /resin-batches/${batch_id}", payload: {}, as: Laminator, as_user_id: "op-lam-1", captures: { b_status: $.data.status, b_remaining: $.data.remaining_mass_g } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 1 }, as: Laminator, as_user_id: "op-lam-1", captures: { err: $.data.error_id } }
          assert:
            - "sess_status == ACTIVE and b_remaining == 0.0 and b_status == EXHAUSTED (exact-zero boundary)"
            - "err == ERR_RESIN_BATCH_NOT_USABLE"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: laminator_cannot_create_inspection_forbidden
        claim_type: exclusive_operations
        grounds: [roles.QualityInspector, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /inspections is exclusive to QualityInspector; a Laminator is rejected 403 before any state check."
        test_recipe:
          setup: ["Clock T0 (endpoint exists; role check fires before existence/state)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "POST /inspections", payload: { work_order_id: "00000000-0000-0000-0000-000000000000", method: "VISUAL", void_content_pct: 1.0, delamination_area_cm2: 0.0 }, as: Laminator, as_user_id: "op-lam-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN (403 precedes the 404 the unknown work order would otherwise earn)"

      - name: ehs_officer_cannot_create_mold
        claim_type: exclusive_operations
        grounds: [roles.ToolingEngineer, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /molds is exclusive to ToolingEngineer; an EHSOfficer is rejected 403."
        test_recipe:
          setup: ["Clock T0"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "POST /molds", payload: { mold_code: "MOLD-RB1", maintenance_interval_cycles: 10, prototype_parts_required: 1 }, as: EHSOfficer, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: inspector_who_laid_up_cannot_inspect
        claim_type: segregation_of_duties
        grounds: ["validations[priority=8]", "errors[ERR_SOD_INSPECTOR_LAMINATOR]", entities.Inspection.fields.inspector_id]
        distinguishing_aspect: "Segregation of duties: the QualityInspector whose X-User-ID matches a laminator_id on the work order's ACTIVE sessions is rejected 403; a different inspector inspects successfully."
        test_recipe:
          setup: ["Clock T0; permit; approved PN-100; production mold; WO demolded, standing IN_INSPECTION; its layup session was recorded by op-lam-1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-SD1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /cure-equipment", payload: { equipment_code: "OVEN-1", kind: "OVEN", max_parts_per_cycle: 10, turnaround_minutes: 0, max_temperature_c: 200, max_pressure_bar: 0 }, as: ShopManager, captures: { oven_id: $.data.id } }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-SD1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-SD1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 200 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /work-orders/${wo_id}/complete-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /cure-cycles", payload: { work_order_id: "${wo_id}", equipment_id: "${oven_id}", ramp_rate_c_per_min: 3.0, soak_temp_c: 180, soak_minutes: 120, scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T14:00:00Z" }, as: CureTechnician, captures: { cc_id: $.data.id } }
            - { call: "POST /cure-cycles/${cc_id}/start", payload: {}, as: CureTechnician }
            - { call: "POST /cure-cycles/${cc_id}/complete", payload: { recorded_min_temp_c: 178, recorded_max_temp_c: 181, recorded_soak_minutes: 120, recorded_ramp_rate_c_per_min: 3.0 }, as: CureTechnician }
            - { call: "POST /work-orders/${wo_id}/demold", payload: { actual_part_weight_g: 2000.0 }, as: Laminator, as_user_id: "op-lam-1" }
          trigger:
            - { call: "POST /inspections", payload: { work_order_id: "${wo_id}", method: "ULTRASONIC", void_content_pct: 1.0, delamination_area_cm2: 0.0 }, as: QualityInspector, as_user_id: "op-lam-1", captures: { err: $.data.error_id } }
            - { call: "POST /inspections", payload: { work_order_id: "${wo_id}", method: "ULTRASONIC", void_content_pct: 1.0, delamination_area_cm2: 0.0 }, as: QualityInspector, as_user_id: "op-qi-1", captures: { result: $.data.result } }
          assert:
            - "err == ERR_SOD_INSPECTOR_LAMINATOR (same person laid up and inspected)"
            - "result == PASS (an independent inspector proceeds)"

  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_plybook_patch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plybook-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH against the version captured at creation succeeds once (1 -> 2); replaying the same stale version is rejected 412 even though the book is still DRAFT."
        test_recipe:
          setup: ["Draft ply book; client holds version 1"]
          setup_api_calls:
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id, pb_v: $.data.version } }
          trigger:
            - { call: "PATCH /ply-books/${pb_id}", payload: { expected_ply_book_version: "${pb_v}", tolerance_pct: 0.06 }, as: ToolingEngineer, captures: { v_after: $.data.version, tol_after: $.data.tolerance_pct } }
            - { call: "PATCH /ply-books/${pb_id}", payload: { expected_ply_book_version: "${pb_v}", tolerance_pct: 0.07 }, as: ToolingEngineer, captures: { err: $.data.error_id } }
          assert:
            - "v_after == 2 and tol_after == 0.06 (fresh version admitted)"
            - "err == ERR_STALE_VERSION (stale base version 1 rejected)"

      - name: occ_mold_patch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[mold-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Mold maintenance parameters are OCC-guarded: a patch on the captured version succeeds; a second patch replaying the pre-mutation version fails 412."
        test_recipe:
          setup: ["Mold registered; client holds its version"]
          setup_api_calls:
            - { call: "POST /molds", payload: { mold_code: "MOLD-OC1", maintenance_interval_cycles: 10, prototype_parts_required: 1 }, as: ToolingEngineer, captures: { mold_id: $.data.id, m_v: $.data.version } }
          trigger:
            - { call: "PATCH /molds/${mold_id}", payload: { expected_mold_version: "${m_v}", maintenance_interval_cycles: 7 }, as: ToolingEngineer, captures: { v_after: $.data.version, iv_after: $.data.maintenance_interval_cycles } }
            - { call: "PATCH /molds/${mold_id}", payload: { expected_mold_version: "${m_v}", prototype_parts_required: 3 }, as: ToolingEngineer, captures: { err: $.data.error_id } }
          assert:
            - "v_after == 2 and iv_after == 7"
            - "err == ERR_STALE_VERSION"

      - name: pinned_ply_book_version_held_after_supersede
        claim_type: version_pinning
        grounds: [entities.WorkOrder.fields.pinned_ply_book_version, state_machines.PlyBook.APPROVED_to_SUPERSEDED]
        distinguishing_aspect: "A work order created against revision A (pinned at book version 2) keeps pinned_ply_book_version == 2 after revision B is approved and A is SUPERSEDED; its target weight stays 2000.0."
        test_recipe:
          setup: ["Revision A approved; work order created against it; revision B then approved, superseding A"]
          setup_api_calls:
            - { call: "POST /molds", payload: { mold_code: "MOLD-VP1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 }, { seq: 2, material_code: "CF-300", orientation_deg: 90, areal_weight_g_m2: 300 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_a: $.data.id } }
            - { call: "POST /ply-books/${pb_a}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-VP1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_a}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "B", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_b: $.data.id } }
            - { call: "POST /ply-books/${pb_b}/approve", payload: {}, as: ToolingEngineer }
          trigger:
            - { call: "GET /work-orders/${wo_id}", payload: {}, as: ShopManager, captures: { pinned: $.data.pinned_ply_book_version, target: $.data.target_part_weight_g, wo_pb: $.data.ply_book_id } }
            - { call: "GET /ply-books/${pb_a}", payload: {}, as: ShopManager, captures: { a_status: $.data.status } }
          assert:
            - "pinned == 2 and wo_pb == ${pb_a} (order still built to the pinned revision A)"
            - "target == 2000.0 (no recomputation from revision B)"
            - "a_status == SUPERSEDED"

      - name: permit_used_kg_derived_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [entities.EmissionPermit.fields.styrene_used_kg, calculations.styrene_emission_kg]
        excluded_because:
          difficulty_instance: "compensating_invariant / emission_ledger_void_restores_exactly"
          rationale: "Add-then-subtract reconciliation of the derived styrene_used_kg is asserted there with exact literals."

      - name: cascading_side_effects_layer_coverage
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "transitive_cascade / layup_session_to_permit_exhaustion_cascade"
          rationale: "The multi-hop cascade (batch -> permit -> EXHAUSTED) plus its downstream gate is asserted end-to-end by the named difficulty instance and its companion cure_complete_to_mold_maintenance_cascade."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: read_after_write_immediate_remaining_mass
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, entities.ResinBatch.fields.remaining_mass_g]
        distinguishing_aspect: "Consistency is immediate: the GET after a 300 g session reflects remaining_mass_g 720.0 in the same logical instant, with no reconciliation lag."
        test_recipe:
          setup: ["Clock T0; permit; approved PN-100; production mold; WO in LAYUP_IN_PROGRESS; batch total 1020 g"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: ShopManager }
            - { call: "POST /emission-permits", payload: { permit_code: "PER-Q3", period_start: "2026-06-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", styrene_quota_kg: 50.0 }, as: EHSOfficer }
            - { call: "POST /molds", payload: { mold_code: "MOLD-IM1", maintenance_interval_cycles: 10, prototype_parts_required: 1, tooling_phase: "PRODUCTION" }, as: ToolingEngineer, captures: { mold_id: $.data.id } }
            - { call: "POST /ply-books", payload: { part_number: "PN-100", revision: "A", part_area_m2: 2.0, plies: [ { seq: 1, material_code: "CF-200", orientation_deg: 0, areal_weight_g_m2: 200 } ], resin_system: "POLYESTER", target_fiber_volume_pct: 0.5 }, as: ToolingEngineer, captures: { pb_id: $.data.id } }
            - { call: "POST /ply-books/${pb_id}/approve", payload: {}, as: ToolingEngineer }
            - { call: "POST /work-orders", payload: { work_order_no: "WO-IM1", part_number: "PN-100", mold_id: "${mold_id}", ply_book_id: "${pb_id}", quantity: 1, due_date: "2026-07-01T00:00:00Z" }, as: ShopManager, captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/start-layup", payload: {}, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "POST /resin-batches", payload: { batch_code: "BATCH-IM1", resin_system: "POLYESTER", resin_mass_g: 1000, catalyst_mass_g: 20, target_ratio_pct: 2.0, ratio_tolerance_pct: 1.0, nominal_pot_life_minutes: 600 }, as: Laminator, as_user_id: "op-lam-1", captures: { batch_id: $.data.id } }
          trigger:
            - { call: "POST /layup-sessions", payload: { work_order_id: "${wo_id}", resin_batch_id: "${batch_id}", resin_used_g: 300 }, as: Laminator, as_user_id: "op-lam-1" }
            - { call: "GET /resin-batches/${batch_id}", payload: {}, as: ShopManager, captures: { remaining: $.data.remaining_mass_g, consumed: $.data.consumed_mass_g } }
          assert:
            - "remaining == 720.0 and consumed == 300.0 immediately after the write"
