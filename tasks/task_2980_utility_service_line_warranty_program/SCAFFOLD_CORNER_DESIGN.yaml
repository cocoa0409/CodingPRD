      - name: enrollment_parallel_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Enrollment.shape
          - state_machines.Enrollment.transitions
        excluded_because:
          difficulty_instance: enrollment_coverage_billing_and_cap_dimensions_advance_independently
          rationale: "§1.8 already drives coverage_status, billing_status and cap_status to three different values in one chain and asserts that each dimension moved without dragging the others, which is exactly the `parallel` shape claim."

      - name: dispatch_completion_cascades_down_to_the_enrollment_and_sibling_claims
        claim_type: cascade_down
        grounds:
          - state_machines.Dispatch.transitions.ACCEPTED_or_ON_SITE_to_COMPLETED
          - endpoints.POST /dispatches/{dispatchId}/events
        excluded_because:
          difficulty_instance: dispatch_completion_cascades_to_sibling_claim_denial
          rationale: "§1.8 walks the full four-hop cascade from one COMPLETE event through the ledger, the enrollment's cap dimension and into the sibling TRIAGE claim's denial, and asserts that terminal siblings are left alone."

      - name: enrollment_admission_is_guarded_by_the_sourcing_campaign_state
        claim_type: guarded_transitions
        grounds:
          - validations.campaign-must-be-mailed
          - errors.ERR_CAMPAIGN_NOT_MAILED
        excluded_because:
          difficulty_instance: enrollment_requires_sourcing_campaign_in_mailed_state
          rationale: "§1.8 already tests the cross-entity guard in both directions - refused while the campaign is APPROVED, admitted once the same campaign reaches MAILED - which is the whole `guarded transitions` claim for this scaffold."

      - name: benefit_reversal_syncs_the_enrollment_cap_dimension
        claim_type: ledger_sync
        grounds:
          - state_machines.Enrollment.transitions.ANNUAL_CAP_EXHAUSTED_to_WITHIN_CAP
          - entities.Enrollment.annual_benefit_used_cents
        excluded_because:
          difficulty_instance: benefit_reversal_restores_annual_cap_headroom
          rationale: "§1.8 posts a negative BENEFIT row and reconciles annual_benefit_used_cents and cap_status before and after, which is the ledger-sync claim for the only derived-from-ledger field pair in the scaffold."

