scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_prorated_vs_full_financial_domain
        grounds:
          - calculations.refund_amount
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Resolution.fields.refund_variant
        distinguishing_aspect: "Financial (Resolution/Claim) domain: a BASIC-tier household's REFUND resolution prorates to 50000 cents (365/730 of a 100000c price at clock 2026-01-01), whereas a PLUS-tier household with identical purchase inputs would return the full 100000 — same inputs, two algorithms, different cents."
        test_recipe:
          setup:
            - "One manufacturer; a BASIC household (WEIGHTED exposure default) with an ACTIVE subscription [2025-01-01,2027-01-01); one product priced 100000c purchased 2025-01-01 warranty 24mo (expiry 2027-01-01, span 730 days); logical clock set to 2026-01-01 (365 days elapsed)."
            - "A REFUND WARRANTY claim on the product with one RECEIPT document, submitted, then moved UNDER_REVIEW by concierge cx-reviewer."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "h1@x.test", display_name: "H1" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "Owner One", email: "o1@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "BASIC", period_start: "2025-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { sub: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "WM-100", serial_number: 1500, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100000, warranty_months: 24 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /claims"
              payload: { product_id: "${prod}", filed_by_member_id: "${owner}", claim_type: "WARRANTY", resolution_preference: "REFUND", issue_description: "motor failed" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/documents"
              payload: { doc_type: "RECEIPT", file_uri: "s3://r/1" }
              as: HouseholdOwner
              as_user_id: "${owner}"
            - call: "POST /claims/${claim}/submit"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
            - call: "POST /claims/${claim}/review"
              payload: {}
              as: ConciergeAgent
              as_user_id: "cx-reviewer"
          trigger:
            - call: "POST /claims/${claim}/approve"
              payload: {}
              as: ConciergeAgent
              as_user_id: "cx-approver"
            - call: "GET /resolutions"
              payload: { claim_id: "${claim}" }
              as: PlatformAdmin
              captures: { res: "$.data[0].id" }
          assert:
            - "Resolution.${res}.mode == REFUND"
            - "Resolution.${res}.refund_variant == PRORATED"
            - "Resolution.${res}.refund_amount_cents == 50000"

      - name: exposure_weighted_vs_count_risk_domain
        grounds:
          - calculations.recall_exposure_score
          - state_machines.RecallNotice.DRAFT_to_PUBLISHED
          - entities.Household.fields.recall_exposure_score
        distinguishing_aspect: "Risk (Household) domain: WEIGHTED mode sums severity weights (CRITICAL=5 on two matched products → 10) on Household.recall_exposure_score, whereas COUNT mode would report 2 for the identical two matches — a different entity domain than the refund calculation."
        test_recipe:
          setup:
            - "One manufacturer; a WEIGHTED household; two REGISTERED products of model TV-9 (serials 100 and 101); a DRAFT CRITICAL recall for TV-9 covering serials [100,200]."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Voltix", contact_email: "v@voltix.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "h2@x.test", display_name: "H2", exposure_scoring_mode: "WEIGHTED" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "Owner Two", email: "o2@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "TV-9", serial_number: 100, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 60000, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { p1: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "TV-9", serial_number: 101, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 60000, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { p2: $.data.id }
            - call: "POST /recall-notices"
              payload: { manufacturer_id: "${mfr}", affected_model_number: "TV-9", serial_range_start: 100, serial_range_end: 200, severity: "CRITICAL", remedy_type: "REPLACE", effective_from: "2025-06-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ManufacturerAgent
              as_user_id: "${mfr}"
              captures: { rn: $.data.id }
          trigger:
            - call: "POST /recall-notices/${rn}/publish"
              payload: {}
              as: ManufacturerAgent
              as_user_id: "${mfr}"
          assert:
            - "RecallNotice.${rn}.matched_product_count == 2"
            - "Household.${hh}.recall_exposure_score == 10"
            - "Product.${p1}.recall_status == RECALLED"

  # =================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: warranty_coverage_bonus_extends_mode_a
        grounds:
          - calculations.warranty_coverage
          - entities.Product.fields.coverage_status
          - entities.Subscription.fields.tier
        distinguishing_aspect: "Mode (a) non-linear formula with >=3 inputs (warranty_months, tier bonus, purchase_date, clock): a PLUS subscription's +6mo bonus extends a 12-month warranty (base expiry 2026-01-01) to 2026-07-01, so at clock 2026-06-01 coverage_status reads UNDER_WARRANTY; the same product with no ACTIVE PLUS bonus would read EXPIRED."
        test_recipe:
          setup:
            - "One manufacturer; a PLUS household with an ACTIVE subscription [2025-01-01,2027-01-01); a product warranty 12mo purchased 2025-01-01; logical clock set to 2026-06-01."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Frostco", contact_email: "f@frostco.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "h3@x.test", display_name: "H3" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "Owner Three", email: "o3@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "PLUS", period_start: "2025-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { sub: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "FR-1", serial_number: 5, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 80000, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /products/${prod}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Product.${prod}.warranty_expires_at == 2026-07-01T00:00:00Z"
            - "Product.${prod}.coverage_status == UNDER_WARRANTY"

      - name: settlement_round_per_component_mode_b
        grounds:
          - calculations.settlement_total
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - entities.Resolution.fields.settlement_total_cents
        distinguishing_aspect: "Mode (b) pinned rounding order: with PLUS FULL refund 100008c, shipping 4501c*0.5=2250.5->2251 and concierge 100008*0.05=5000.4->5000, round-per-component-then-sum yields 100008+2251-5000=97259, whereas sum-then-round of (100008+2250.5-5000.4)=97258.1->97258; the scaffold pins the per-component order (97259)."
        test_recipe:
          setup:
            - "One manufacturer; a PLUS household with an ACTIVE subscription [2025-01-01,2027-01-01); a product priced 100008c purchased 2025-01-01 warranty 24mo; a REFUND claim declaring shipping_cost_cents=4501, with one document, submitted and reviewed by cx-reviewer."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Miele", contact_email: "m@miele.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "h4@x.test", display_name: "H4" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "Owner Four", email: "o4@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "PLUS", period_start: "2025-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { sub: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "DW-7", serial_number: 900, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 100008, warranty_months: 24 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /claims"
              payload: { product_id: "${prod}", filed_by_member_id: "${owner}", claim_type: "WARRANTY", resolution_preference: "REFUND", issue_description: "leak", shipping_cost_cents: 4501 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/documents"
              payload: { doc_type: "RECEIPT", file_uri: "s3://r/4" }
              as: HouseholdOwner
              as_user_id: "${owner}"
            - call: "POST /claims/${claim}/submit"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
            - call: "POST /claims/${claim}/review"
              payload: {}
              as: ConciergeAgent
              as_user_id: "cx-reviewer"
          trigger:
            - call: "POST /claims/${claim}/approve"
              payload: {}
              as: ConciergeAgent
              as_user_id: "cx-approver"
            - call: "GET /resolutions"
              payload: { claim_id: "${claim}" }
              as: PlatformAdmin
              captures: { res: "$.data[0].id" }
          assert:
            - "Resolution.${res}.refund_amount_cents == 100008"
            - "Resolution.${res}.shipping_reimbursement_cents == 2251"
            - "Resolution.${res}.concierge_fee_cents == 5000"
            - "Resolution.${res}.settlement_total_cents == 97259"

  # =================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_revision_cycle_returns_to_submitted
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_NEEDS_DOCS
          - state_machines.Claim.NEEDS_DOCS_to_SUBMITTED
          - entities.Subscription.fields.claims_used
        distinguishing_aspect: "Claim is cyclic: SUBMITTED->UNDER_REVIEW->NEEDS_DOCS->SUBMITTED loops back to SUBMITTED, and the re-submit does NOT re-increment claims_used (stays 1) — a behaviour impossible in a linear A->B->C->D pipeline."
        test_recipe:
          setup:
            - "A BASIC household with an ACTIVE subscription and a product; a REFUND claim with one document, submitted (claims_used=1), reviewed by cx-reviewer, then request-docs (NEEDS_DOCS); one additional document added after entering NEEDS_DOCS."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Cyc", contact_email: "c@cyc.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "h5@x.test", display_name: "H5" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "Owner Five", email: "o5@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "BASIC", period_start: "2025-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { sub: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "BL-3", serial_number: 3, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 20000, warranty_months: 24 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /claims"
              payload: { product_id: "${prod}", filed_by_member_id: "${owner}", claim_type: "WARRANTY", resolution_preference: "REFUND", issue_description: "won't power" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { claim: $.data.id }
            - call: "POST /claims/${claim}/documents"
              payload: { doc_type: "RECEIPT", file_uri: "s3://r/5a" }
              as: HouseholdOwner
              as_user_id: "${owner}"
            - call: "POST /claims/${claim}/submit"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
            - call: "POST /claims/${claim}/review"
              payload: {}
              as: ConciergeAgent
              as_user_id: "cx-reviewer"
            - call: "POST /claims/${claim}/request-docs"
              payload: {}
              as: ConciergeAgent
              as_user_id: "cx-reviewer"
            - call: "POST /claims/${claim}/documents"
              payload: { doc_type: "PHOTO", file_uri: "s3://r/5b" }
              as: HouseholdOwner
              as_user_id: "${owner}"
          trigger:
            - call: "POST /claims/${claim}/submit"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
          assert:
            - "Claim.${claim}.status == SUBMITTED"
            - "Subscription.${sub}.claims_used == 1"

      - name: recall_match_fork_divergent_side_effects
        grounds:
          - state_machines.RecallMatch.MATCHED_to_DISMISSED
          - state_machines.RecallMatch.MATCHED_to_ACKNOWLEDGED
          - calculations.recall_exposure_score
        distinguishing_aspect: "RecallMatch forks from MATCHED with divergent side-effect sets: acknowledging match m1 leaves Household.recall_exposure_score unchanged, while dismissing match m2 recomputes it downward (removing that HIGH weight of 3) — from 6 to 3 — on a different entity than Claim."
        test_recipe:
          setup:
            - "A WEIGHTED household with two REGISTERED products of model AB-2 (serials 10, 11); a PUBLISHED HIGH recall matching both (exposure 3+3=6); match m1 on product p1 and m2 on product p2 both MATCHED."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Bagco", contact_email: "b@bagco.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "h6@x.test", display_name: "H6", exposure_scoring_mode: "WEIGHTED" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "Owner Six", email: "o6@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "AB-2", serial_number: 10, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 15000, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { p1: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "AB-2", serial_number: 11, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 15000, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { p2: $.data.id }
            - call: "POST /recall-notices"
              payload: { manufacturer_id: "${mfr}", affected_model_number: "AB-2", serial_range_start: 1, serial_range_end: 100, severity: "HIGH", remedy_type: "REPAIR", effective_from: "2025-06-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ManufacturerAgent
              as_user_id: "${mfr}"
              captures: { rn: $.data.id }
            - call: "POST /recall-notices/${rn}/publish"
              payload: {}
              as: ManufacturerAgent
              as_user_id: "${mfr}"
            - call: "GET /recall-matches"
              payload: { product_id: "${p1}" }
              as: PlatformAdmin
              captures: { m1: "$.data[0].id" }
            - call: "GET /recall-matches"
              payload: { product_id: "${p2}" }
              as: PlatformAdmin
              captures: { m2: "$.data[0].id" }
          trigger:
            - call: "POST /recall-matches/${m1}/acknowledge"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
            - call: "POST /recall-matches/${m2}/dismiss"
              payload: {}
              as: HouseholdOwner
              as_user_id: "${owner}"
          assert:
            - "RecallMatch.${m1}.status == ACKNOWLEDGED"
            - "RecallMatch.${m2}.status == DISMISSED"
            - "Household.${hh}.recall_exposure_score == 3"

  # =================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: publish_recall_cascade_depth3
        grounds:
          - state_machines.RecallNotice.DRAFT_to_PUBLISHED
          - entities.RecallMatch.fields.status
          - entities.Product.fields.recall_status
          - entities.Household.fields.recall_exposure_score
        distinguishing_aspect: "Depth-3 cascade triggered by recall publish: publish creates a RecallMatch (L1), whose creation flips the matched Product.recall_status to RECALLED (L2), which in turn recomputes Household.recall_exposure_score to 5 (L3) — each hop caused by the prior link, not directly by publish."
        test_recipe:
          setup:
            - "A WEIGHTED household with one REGISTERED product model GR-1 serial 50; a DRAFT CRITICAL recall for GR-1 covering serials [1,100]."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Grillz", contact_email: "g@grillz.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "h7@x.test", display_name: "H7", exposure_scoring_mode: "WEIGHTED" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "Owner Seven", email: "o7@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "GR-1", serial_number: 50, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 30000, warranty_months: 12 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /recall-notices"
              payload: { manufacturer_id: "${mfr}", affected_model_number: "GR-1", serial_range_start: 1, serial_range_end: 100, severity: "CRITICAL", remedy_type: "REPLACE", effective_from: "2025-06-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: ManufacturerAgent
              as_user_id: "${mfr}"
              captures: { rn: $.data.id }
          trigger:
            - call: "POST /recall-notices/${rn}/publish"
              payload: {}
              as: ManufacturerAgent
              as_user_id: "${mfr}"
            - call: "GET /recall-matches"
              payload: { product_id: "${prod}" }
              as: PlatformAdmin
              captures: { m: "$.data[0].id" }
          assert:
            - "RecallMatch.${m}.status == MATCHED"
            - "RecallMatch.${m}.severity_weight == 5"
            - "Product.${prod}.recall_status == RECALLED"
            - "Household.${hh}.recall_exposure_score == 5"

      - name: resolution_complete_cascade_depth3
        grounds:
          - state_machines.Resolution.DISPATCHED_to_COMPLETED
          - entities.Claim.fields.status
          - entities.RecallMatch.fields.status
          - entities.Household.fields.recall_exposure_score
        distinguishing_aspect: "Depth-3 cascade from a DIFFERENT trigger (resolution complete): complete sets Claim.status=RESOLVED (L1), which because it is a RECALL claim sets the linked RecallMatch.status=REMEDIED (L2), which recomputes Household.recall_exposure_score to 0 (L3)."
        test_recipe:
          setup:
            - "A WEIGHTED household, ACTIVE BASIC subscription, product model HT-4 serial 7; a PUBLISHED CRITICAL recall matching it (exposure 5); the match acknowledged; a RECALL REFUND claim referencing the match, documented, submitted, reviewed by cx-reviewer, approved by cx-approver (Resolution PENDING), then dispatched (REFUND, no RMA)."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { name: "Heatr", contact_email: "h@heatr.test" }
              as: PlatformAdmin
              captures: { mfr: $.data.id }
            - call: "POST /households"
              payload: { primary_email: "h8@x.test", display_name: "H8", exposure_scoring_mode: "WEIGHTED" }
              as: Anonymous
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/members"
              payload: { full_name: "Owner Eight", email: "o8@x.test", role: "OWNER" }
              as: Anonymous
              captures: { owner: $.data.id }
            - call: "POST /households/${hh}/subscriptions"
              payload: { tier: "BASIC", period_start: "2025-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z" }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { sub: $.data.id }
            - call: "POST /products"
              payload: { household_id: "${hh}", manufacturer_id: "${mfr}", model_number: "HT-4", serial_number: 7, purchase_date: "2025-01-01T00:00:00Z", purchase_price_cents: 40000, warranty_months: 24 }
              as: HouseholdOwner
              as_user_id: "${owner}"
              captures: { prod: $.data.id }
            - call: "POST /recall-notices"
              payload: { manufacturer_id: "${mfr}", affected_model_number: "HT-4", serial_range_start: 1, serial_range_end: 50, severity: "CRITICAL", remedy_type: "REFUND", effective_from: "2025-06-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: ManufacturerAgent
              as_user_id: "${mfr}"
