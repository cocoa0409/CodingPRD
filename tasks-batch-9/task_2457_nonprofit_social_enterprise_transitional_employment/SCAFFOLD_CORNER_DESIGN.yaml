  # ===========================================================================
  - section: calculations
    instances:

      - name: partner_conversion_rate_after_first_enrollment
        claim_type: correct_result
        grounds:
          - calculations.partner_conversion_rate
          - endpoints[GET /referral-partners/{referralPartnerId}]
        distinguishing_aspect: |
          The denominator counts referrals in EVERY status (3 submitted) while the numerator counts
          only ENROLLED (1), so the rate is 0.3333 at four decimals -- not 1.0000 (screened only) and
          not null (which is reserved for a partner with no referrals at all).
        test_recipe:
          setup:
            - "One LAUNCHED business line."
            - "One TIER_1 partner with quota 5 and three referrals; only CAND-001 is screened ELIGIBLE and enrolled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /business-lines"
              payload: { name: "Cafe & Catering", market_viability_score: 90, training_relevance_score: 80, mission_alignment_score: 75, training_slots_total: 3, supervisor_capacity: 2, target_gross_margin_pct: 0.2000, subsidy_cap_cents: 5000000 }
              as: ProgramDirector
              captures: { bl_id: $.data.id }
            - call: "POST /business-lines/${bl_id}/review"
              payload: { decision: "APPROVED" }
              as: ProgramDirector
            - call: "POST /business-lines/${bl_id}/launch"
              payload: {}
              as: ProgramDirector
              captures: { bl_v: $.data.version }
            - call: "POST /referral-partners"
              payload: { organization_name: "Eastside Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-001", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-002", declared_barrier_codes: ["JUSTICE_INVOLVED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-003", declared_barrier_codes: ["JUSTICE_INVOLVED"], household_income_cents: 100000, household_size: 2, hours_available_per_week: 40 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY", "LONG_TERM_UNEMPLOYED"], verified_household_income_cents: 100000, verified_household_size: 2, verified_hours_available_per_week: 40 }
              as: IntakeSpecialist
          trigger:
            - call: "POST /participants"
              payload: { referral_id: "${ref1_id}", business_line_id: "${bl_id}", wage_cents_per_hour: 1650, expected_business_line_version: "${bl_v}" }
              as: IntakeSpecialist
              captures: { p1_id: $.data.id }
            - call: "GET /referral-partners/${rp_id}"
              payload: {}
              as: FunderAnalyst
            - call: "GET /referrals/${ref1_id}"
              payload: {}
              as: IntakeSpecialist
          assert:
            - "the enrollment returns HTTP 201 with data.status == \"TRANSITIONAL_EMPLOYED\" and data.enrolled_at == \"2026-09-07T00:00:00Z\""
            - "the partner read: referrals_submitted_count == 3, enrolled_referral_count == 1, conversion_rate == 0.3333 (1/3 at four decimals, round_half_up)"
            - "the referral read: status == \"ENROLLED\" and eligibility_score == 100.10 ((3*12 + 35 + 20) * 1.10) with priority_band == \"BAND_A\""

      - name: eligibility_score_floor_boundary_50_00_vs_49_00
        claim_type: constants_applied
        grounds:
          - calculations.referral_eligibility_score
          - validations[priority 13]
          - errors[ERR_ELIGIBILITY_SCORE_BELOW_FLOOR]
        distinguishing_aspect: |
          One available hour decides eligibility because availability points are floor(hours/2):
          21 h gives 10 points and a 49.00 score that fails ELIGIBILITY_SCORE_FLOOR 50.00, while 22 h
          gives 11 points and exactly 50.00, which passes on >=. Both requests satisfy the other two
          ELIGIBLE conditions (>=1 verified barrier, hours >= MIN_WEEKLY_AVAILABILITY_HOURS 20), so
          only the score decides.
        test_recipe:
          setup:
            - "One TIER_2 partner (multiplier 1.00) with quota 5."
            - "One SUBMITTED referral: 2 verified barriers (24 pts), household_income_cents 200000 with household_size 1 -> fpl_ratio 1.5905 -> 15 income pts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /referral-partners"
              payload: { organization_name: "Midtown Bridge", mou_tier: "TIER_2", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp_id}", candidate_reference: "CAND-201", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], household_income_cents: 200000, household_size: 1, hours_available_per_week: 22 }
              as: ReferralPartner
              as_user_id: "${rp_id}"
              captures: { ref1_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], verified_household_income_cents: 200000, verified_household_size: 1, verified_hours_available_per_week: 21 }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
            - call: "POST /referrals/${ref1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], verified_household_income_cents: 200000, verified_household_size: 1, verified_hours_available_per_week: 22 }
              as: IntakeSpecialist
          assert:
            - "21-hour attempt: HTTP 422 with data.error_id == \"ERR_ELIGIBILITY_SCORE_BELOW_FLOOR\" (24 + 15 + 10 = 49 -> 49.00 < 50.00)"
            - "the referral is still \"SUBMITTED\" after the refusal (no partial write of the verified values)"
            - "22-hour attempt: HTTP 200 with data.status == \"ELIGIBLE\", data.eligibility_score == 50.00 (24 + 15 + 11), data.priority_band == \"BAND_B\""
            - "data.fpl_ratio == 1.5905 (200000 * 12 / 1509000 at four decimals) in the successful response"

      - name: tier_multiplier_changes_the_same_point_sum
        claim_type: precision
        grounds:
          - calculations.referral_eligibility_score
          - entities.ReferralPartner.mou_tier
        distinguishing_aspect: |
          The multiplier is applied once to the integer point sum, never per component: an identical
          50-point candidate scores 55.00 on TIER_1, 50.00 on TIER_2 and 45.00 on TIER_3, and the
          TIER_3 copy drops to BAND_C and can no longer be screened ELIGIBLE at all.
        test_recipe:
          setup:
            - "Three partners with identical quotas on TIER_1, TIER_2 and TIER_3."
            - "One identical referral under each: 2 verified barriers, household_income_cents 200000, household_size 1, 22 hours available (point sum 24 + 15 + 11 = 50)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /referral-partners"
              payload: { organization_name: "Tier One Works", mou_tier: "TIER_1", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp1_id: $.data.id }
            - call: "POST /referral-partners"
              payload: { organization_name: "Tier Two Works", mou_tier: "TIER_2", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp2_id: $.data.id }
            - call: "POST /referral-partners"
              payload: { organization_name: "Tier Three Works", mou_tier: "TIER_3", referral_quota_per_period: 5 }
              as: ProgramDirector
              captures: { rp3_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp1_id}", candidate_reference: "CAND-301", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], household_income_cents: 200000, household_size: 1, hours_available_per_week: 22 }
              as: ReferralPartner
              as_user_id: "${rp1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp2_id}", candidate_reference: "CAND-301", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], household_income_cents: 200000, household_size: 1, hours_available_per_week: 22 }
              as: ReferralPartner
              as_user_id: "${rp2_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /referrals"
              payload: { referral_partner_id: "${rp3_id}", candidate_reference: "CAND-301", declared_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], household_income_cents: 200000, household_size: 1, hours_available_per_week: 22 }
              as: ReferralPartner
              as_user_id: "${rp3_id}"
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /referrals/${r1_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], verified_household_income_cents: 200000, verified_household_size: 1, verified_hours_available_per_week: 22 }
              as: IntakeSpecialist
            - call: "POST /referrals/${r2_id}/screen"
              payload: { decision: "ELIGIBLE", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], verified_household_income_cents: 200000, verified_household_size: 1, verified_hours_available_per_week: 22 }
              as: IntakeSpecialist
            - call: "POST /referrals/${r3_id}/screen"
              payload: { decision: "WAITLISTED", verified_barrier_codes: ["JUSTICE_INVOLVED", "HOUSING_INSTABILITY"], verified_household_income_cents: 200000, verified_household_size: 1, verified_hours_available_per_week: 22 }
              as: IntakeSpecialist
          assert:
            - "TIER_1 screen: HTTP 200, eligibility_score == 55.00 (50 * 1.10), priority_band == \"BAND_B\", status == \"ELIGIBLE\""
            - "TIER_2 screen: HTTP 200, eligibility_score == 50.00 (50 * 1.00), priority_band == \"BAND_B\", status == \"ELIGIBLE\""
            - "TIER_3 screen: HTTP 200, eligibility_score == 45.00 (50 * 0.90), priority_band == \"BAND_C\", status == \"WAITLISTED\""
            - "the same (candidate_reference CAND-301) under three different partners is accepted -- uniqueness is per (referral_partner_id, candidate_reference)"
            - "all three fpl_ratio values are 1.5905, confirming the multiplier is not folded into the ratio"

      - name: completion_selects_open_period_by_shift_start_not_now
        claim_type: input_set_filtering
        grounds:
          - calculations.open_period_selector
          - validations[priority 21]
          - errors[ERR_NO_OPEN_SUBSIDY_PERIOD]
        distinguishing_aspect: |
          The anchor for a completion is WorkShift.starts_at, and CLOSED periods are never selected
          even when their interval covers that anchor. A September shift whose only covering period
          has been CLOSED is refused, while an October shift whose covering period is OPEN posts
          normally -- proving the selector filters on status AND anchors on the shift, not on now.
        test_recipe:
          setup:
            - "Launched line, TIER_1 partner, ELIGIBLE referral, participant p1 at wage 1650."
            - "September period 2026-09-01..2026-09-30 (later CLOSED) and October period 2026-10-01..2026-10-31 (OPEN)."
            - "Shift ws1 starts 2026-09-07T08:00Z (assignment created only AFTER the September period is closed, so the close is not blocked) and shift ws2 starts 2026-10-05T08:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
