scaffold_corner_design:
  # ===========================================================================
  # From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:
      - name: retailer_create_returns_201_with_every_declared_envelope_field
        claim_type: creation
        grounds:
          - entities.Retailer.fields.retailer_code
          - entities.Retailer.fields.min_image_count
          - entities.Retailer.fields.feed_slot_capacity
          - entities.Retailer.fields.max_concurrent_feed_windows
          - entities.Retailer.fields.enhanced_content_requires_approval
          - endpoints["POST /digital-shelf/retailers"]
        distinguishing_aspect: "A POST that supplies every optional envelope field returns 201 with those exact values echoed, feed_slots_reserved 0 and version 1."
        test_recipe:
          setup:
            - "empty database; the logical clock has been moved to 2026-08-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
          trigger:
            - call: "POST /digital-shelf/retailers"
              payload: { name: "MegaMart", retailer_code: "RETM", status: "PAUSED", min_image_count: 6, feed_slot_capacity: 30, max_concurrent_feed_windows: 4, enhanced_content_requires_approval: false }
              as: ShelfAdmin
              captures: { rm_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Retailer.${rm_id}.name == \"MegaMart\""
            - "Retailer.${rm_id}.retailer_code == \"RETM\""
            - "Retailer.${rm_id}.status == PAUSED"
            - "Retailer.${rm_id}.min_image_count == 6"
            - "Retailer.${rm_id}.feed_slot_capacity == 30"
            - "Retailer.${rm_id}.max_concurrent_feed_windows == 4"
            - "Retailer.${rm_id}.enhanced_content_requires_approval == false"
            - "Retailer.${rm_id}.feed_slots_reserved == 0"
            - "Retailer.${rm_id}.version == 1"

      - name: retailer_create_omitting_the_optional_envelope_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Retailer.fields.status
          - entities.Retailer.fields.min_image_count
          - entities.Retailer.fields.feed_slot_capacity
          - entities.Retailer.fields.max_concurrent_feed_windows
          - entities.Retailer.fields.enhanced_content_requires_approval
          - endpoints["POST /digital-shelf/retailers"]
        distinguishing_aspect: "Omitting all seven optional inputs yields status ACTIVE, min_image_count 1, feed_slot_capacity 10, max_concurrent_feed_windows 2 and enhanced_content_requires_approval true."
        test_recipe:
          setup:
            - "empty database; only the two required Retailer inputs are supplied"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
          trigger:
            - call: "POST /digital-shelf/retailers"
              payload: { name: "PlainMart", retailer_code: "RETP" }
              as: ShelfAdmin
              captures: { rp_id: $.data.id }
          assert:
            - "Retailer.${rp_id}.status == ACTIVE"
            - "Retailer.${rp_id}.min_image_count == 1"
            - "Retailer.${rp_id}.feed_slot_capacity == 10"
            - "Retailer.${rp_id}.max_concurrent_feed_windows == 2"
            - "Retailer.${rp_id}.enhanced_content_requires_approval == true"
            - "Retailer.${rp_id}.feed_slots_reserved == 0"

      - name: get_retailer_by_id_returns_the_stored_envelope_and_live_reserved_count
        claim_type: retrieval
        grounds:
          - entities.Retailer.fields.feed_slots_reserved
          - endpoints["GET /digital-shelf/retailers/{id}"]
        distinguishing_aspect: "GET by id returns the same envelope the POST stored, with feed_slots_reserved 0 because no job of this retailer is QUEUED or TRANSMITTED."
        test_recipe:
          setup:
            - "one Retailer SimpleMart (code RETS, min_image_count 1, feed_slot_capacity 10) exists and has no listings"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS", min_image_count: 1, feed_slot_capacity: 10 }
              as: ShelfAdmin
              captures: { rs_id: $.data.id }
          trigger:
            - call: "GET /digital-shelf/retailers/${rs_id}"
              payload: {}
              as: SyndicationOperator
              captures: { rs_v: $.data.version }
          assert:
            - "HTTP 200"
            - "Retailer.${rs_id}.retailer_code == \"RETS\""
            - "Retailer.${rs_id}.min_image_count == 1"
            - "Retailer.${rs_id}.feed_slots_reserved == 0"
            - "${rs_v} == 1"

      - name: retailers_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /digital-shelf/retailers"]
          - validations[priority=7]
        distinguishing_aspect: "With three retailers stored, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, and limit 2 offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "three Retailers exist: RETA (ACTIVE), RETB (ACTIVE) and RETC (PAUSED)"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "Alpha", retailer_code: "RETA" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "Beta", retailer_code: "RETB" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "Gamma", retailer_code: "RETC", status: "PAUSED" }
              as: ShelfAdmin
          trigger:
            - call: "GET /digital-shelf/retailers?limit=2&offset=0"
              payload: { limit: 2, offset: 0 }
              as: ShelfAdmin
            - call: "GET /digital-shelf/retailers?limit=2&offset=2"
              payload: { limit: 2, offset: 2 }
              as: ShelfAdmin
            - call: "GET /digital-shelf/retailers?status=PAUSED"
              payload: { status: "PAUSED" }
              as: ShelfAdmin
          assert:
            - "first response: meta.total_count == 3, meta.has_more == true, len(data) == 2"
            - "second response: meta.total_count == 3, meta.has_more == false, len(data) == 1"
            - "third response: meta.total_count == 1, len(data) == 1, data[0].retailer_code == \"RETC\""

      - name: get_retailer_with_unknown_id_returns_retailer_not_found
        claim_type: not_found
        grounds:
          - validations[priority=10]
          - errors[ERR_RETAILER_NOT_FOUND]
          - endpoints["GET /digital-shelf/retailers/{id}"]
        distinguishing_aspect: "A well-formed UUID that matches no Retailer row returns ERR_RETAILER_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
          trigger:
            - call: "GET /digital-shelf/retailers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ShelfAdmin
              captures: { e_nf: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${e_nf} == \"ERR_RETAILER_NOT_FOUND\""

      - name: product_create_without_gtin_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Product.fields.gtin
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
          - endpoints["POST /digital-shelf/products"]
        distinguishing_aspect: "gtin has source input and no default, so omitting it returns ERR_INVALID_REQUEST 400 and no Product row is created."
        test_recipe:
          setup:
            - "empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
          trigger:
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-E-1", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { e_req: $.data.error_id }
            - call: "GET /digital-shelf/products"
              payload: {}
              as: ContentAuthor
          assert:
            - "HTTP 400"
            - "${e_req} == \"ERR_INVALID_REQUEST\""
            - "the follow-up GET /digital-shelf/products returns meta.total_count == 0"

      - name: retailer_create_with_unknown_status_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Retailer.fields.status
          - validations[priority=8]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "status accepts only ACTIVE, PAUSED or OFFBOARDED, so the value SUSPENDED is rejected with ERR_INVALID_REQUEST 400 rather than stored verbatim."
        test_recipe:
          setup:
            - "empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
          trigger:
            - call: "POST /digital-shelf/retailers"
              payload: { name: "BadEnum", retailer_code: "RETX", status: "SUSPENDED" }
              as: ShelfAdmin
              captures: { e_enum: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${e_enum} == \"ERR_INVALID_REQUEST\""

      - name: content_version_revision_no_counts_existing_revisions_extra_field_ignored
        claim_type: computed_fields
        grounds:
          - entities.ContentVersion.fields.revision_no
          - entities.ContentVersion.fields.state
          - entities.ContentVersion.fields.pin_count
          - endpoints["POST /digital-shelf/content-versions"]
          - validations[priority=8]
        distinguishing_aspect: "The second revision of the same product gets revision_no 2 computed from the existing count, and a client-supplied revision_no of 99 is ignored rather than rejected."
        test_recipe:
          setup:
            - "one Product SKU-E-2 exists with exactly one ContentVersion (revision_no 1, DRAFT)"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-E-2", gtin: "00012345678943", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pe_id: $.data.id }
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pe_id}", image_count: 2 }
              as: ContentAuthor
              captures: { ve1_id: $.data.id }
          trigger:
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pe_id}", supersedes_content_version_id: "${ve1_id}", image_count: 3, revision_no: 99 }
              as: ContentAuthor
              captures: { ve2_id: $.data.id, ve2_rev: $.data.revision_no }
          assert:
            - "HTTP 201"
            - "${ve2_rev} == 2"
            - "ContentVersion.${ve2_id}.revision_no == 2"
            - "ContentVersion.${ve2_id}.state == DRAFT"
            - "ContentVersion.${ve2_id}.pin_count == 0"
            - "ContentVersion.${ve2_id}.supersedes_content_version_id == ${ve1_id}"
            - "ContentVersion.${ve1_id}.revision_no == 1"

      - name: media_asset_system_fields_ignored_input_on_create
        claim_type: system_fields
        grounds:
          - entities.MediaAsset.fields.approval_state
          - entities.MediaAsset.fields.approving_retailer_id
          - entities.MediaAsset.fields.decided_at
          - endpoints["POST /digital-shelf/media-assets"]
          - validations[priority=8]
        distinguishing_aspect: "Client-supplied approval_state APPROVED and approving_retailer_id are ignored: the row is created PENDING with approving_retailer_id null and decided_at null."
        test_recipe:
          setup:
            - "one Product SKU-E-3 and one Retailer RETS exist"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS" }
              as: ShelfAdmin
              captures: { rs2_id: $.data.id }
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-E-3", gtin: "00012345678950", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pe3_id: $.data.id }
          trigger:
            - call: "POST /digital-shelf/media-assets"
              payload: { product_id: "${pe3_id}", asset_role: "HERO_IMAGE", source_uri: "s3://brand/e/hero.jpg", approval_state: "APPROVED", approving_retailer_id: "${rs2_id}" }
              as: ContentAuthor
              captures: { me_id: $.data.id }
          assert:
            - "HTTP 201"
            - "MediaAsset.${me_id}.approval_state == PENDING"
            - "MediaAsset.${me_id}.approving_retailer_id == null"
            - "MediaAsset.${me_id}.decided_at == null"
            - "MediaAsset.${me_id}.version == 1"

      - name: retailer_code_immutable_under_patch_extra_field_ignored
        claim_type: immutability
        grounds:
          - entities.Retailer.fields.retailer_code
          - endpoints["PATCH /digital-shelf/retailers/{id}"]
        distinguishing_aspect: "The PATCH input list carries no retailer_code and no name, so a payload that includes retailer_code leaves the stored code untouched while the declared min_image_count edit still lands."
        test_recipe:
          setup:
            - "one Retailer SimpleMart (code RETS, min_image_count 1) exists at version 1"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS", min_image_count: 1 }
              as: ShelfAdmin
              captures: { ri_id: $.data.id }
            - call: "GET /digital-shelf/retailers/${ri_id}"
              payload: {}
              as: ShelfAdmin
              captures: { ri_v: $.data.version }
          trigger:
            - call: "PATCH /digital-shelf/retailers/${ri_id}"
              payload: { expected_retailer_version: "${ri_v}", min_image_count: 3, retailer_code: "RETZ", name: "RenamedMart" }
              as: ShelfAdmin
          assert:
            - "HTTP 200"
            - "Retailer.${ri_id}.retailer_code == \"RETS\""
            - "Retailer.${ri_id}.name == \"SimpleMart\""
            - "Retailer.${ri_id}.min_image_count == 3"
            - "Retailer.${ri_id}.version == 2"

      - name: retailer_listing_create_with_unknown_product_returns_product_not_found
        claim_type: parent_relationships
        grounds:
          - entities.RetailerListing.fields.product_id
          - validations[priority=11]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - endpoints["POST /digital-shelf/retailer-listings"]
        distinguishing_aspect: "The listing's product_id FK is resolved before the row is written, so an unknown product id returns ERR_PRODUCT_NOT_FOUND 404 even though the retailer_id is valid."
        test_recipe:
          setup:
            - "one Retailer RETS exists; no Product exists"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS" }
              as: ShelfAdmin
              captures: { rk_id: $.data.id }
          trigger:
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "00000000-0000-4000-8000-0000000000aa", retailer_id: "${rk_id}" }
              as: ContentAuthor
              captures: { e_pnf: $.data.error_id }
            - call: "GET /digital-shelf/retailer-listings"
              payload: {}
              as: ContentAuthor
          assert:
            - "HTTP 404"
            - "${e_pnf} == \"ERR_PRODUCT_NOT_FOUND\""
            - "the follow-up GET /digital-shelf/retailer-listings returns meta.total_count == 0"

      - name: same_product_on_two_retailers_scores_each_listing_independently
        claim_type: graph
        grounds:
          - entities.RetailerListing.parent
          - entities.RetailerListing.fields.retailer_id
          - calculations.listing_completeness_score
          - endpoints["GET /digital-shelf/retailer-listings/{id}/completeness"]
        distinguishing_aspect: "One Product joins two Retailers through two listings; the identical revision scores declared 100.00 against min_image_count 1 and 77.78 against min_image_count 3, proving the score is a property of the product-retailer edge and not of the product."
        test_recipe:
          setup:
            - "attribute title exists (max_chars 200, base_weight 40.00), so every retailer's denominator D == 40 + IMAGE_WEIGHT 20 == 60"
            - "Retailer RETS has min_image_count 1 and Retailer RETX has min_image_count 3, each with title REQUIRED"
            - "product SKU-G-1 has one DRAFT revision carrying title (27 characters) and image_count 1, and is listed on both retailers with nothing pinned"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS", min_image_count: 1 }
              as: ShelfAdmin
              captures: { rg1_id: $.data.id }
            - call: "POST /digital-shelf/retailers"
              payload: { name: "MaxMart", retailer_code: "RETX", min_image_count: 3 }
              as: ShelfAdmin
              captures: { rg2_id: $.data.id }
            - call: "POST /digital-shelf/retailers/${rg1_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers/${rg2_id}/requirements"
              payload: { attribute_key: "title", requirement_level: "REQUIRED" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-G-1", gtin: "00012345678967", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pg_id: $.data.id }
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pg_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vg_id: $.data.id }
            - call: "POST /digital-shelf/content-versions/${vg_id}/attribute-values"
              payload: { attribute_key: "title", value: "Bright Kitchen Blender 900W" }
              as: ContentAuthor
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pg_id}", retailer_id: "${rg1_id}" }
              as: ContentAuthor
              captures: { lg1_id: $.data.id }
            - call: "POST /digital-shelf/retailer-listings"
              payload: { product_id: "${pg_id}", retailer_id: "${rg2_id}" }
              as: ContentAuthor
              captures: { lg2_id: $.data.id }
          trigger:
            - call: "GET /digital-shelf/retailer-listings/${lg1_id}/completeness"
              payload: {}
              as: ContentAuthor
              captures: { g1_decl: $.data.declared_score, g1_cert: $.data.certified_score }
            - call: "GET /digital-shelf/retailer-listings/${lg2_id}/completeness"
              payload: {}
              as: ContentAuthor
              captures: { g2_decl: $.data.declared_score, g2_img: $.data.declared_image_component }
            - call: "GET /digital-shelf/retailer-listings?product_id=${pg_id}"
              payload: { product_id: "${pg_id}" }
              as: ContentAuthor
          assert:
            - "${g1_decl} == 100.00   # N == 40 + 20*min(1, 1/1) == 60 over D == 60"
            - "${g1_cert} == 0.00     # nothing pinned on either listing"
            - "${g2_decl} == 77.78    # N == 40 + 20*(1/3) == 46.6667 over D == 60 -> 77.7778 -> 77.78"
            - "${g2_img} == 6.67      # image component 20*(1/3) rounded for display"
            - "the third response returns meta.total_count == 2"
            - "RetailerListing.${lg1_id}.completeness_score_declared == 100.00"
            - "RetailerListing.${lg2_id}.completeness_score_declared == 77.78"

      - name: content_versions_list_filters_by_supersedes_pointer_for_reverse_reachability
        claim_type: graph
        grounds:
          - entities.ContentVersion.fields.supersedes_content_version_id
          - endpoints["GET /digital-shelf/content-versions"]
        distinguishing_aspect: "The self-referential supersedes edge is reverse-reachable: filtering the list by supersedes_content_version_id of revision 1 returns exactly revision 2, and filtering by revision 2 returns nothing."
        test_recipe:
          setup:
            - "product SKU-G-2 has revision 1 and revision 2, where revision 2 declares supersedes_content_version_id == revision 1"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-G-2", gtin: "00012345678974", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pgs_id: $.data.id }
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pgs_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vs1_id: $.data.id }
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pgs_id}", supersedes_content_version_id: "${vs1_id}", image_count: 2 }
              as: ContentAuthor
              captures: { vs2_id: $.data.id }
          trigger:
            - call: "GET /digital-shelf/content-versions?supersedes_content_version_id=${vs1_id}"
              payload: { supersedes_content_version_id: "${vs1_id}" }
              as: ContentAuthor
              captures: { back_id: "$.data[0].id" }
            - call: "GET /digital-shelf/content-versions?supersedes_content_version_id=${vs2_id}"
              payload: { supersedes_content_version_id: "${vs2_id}" }
              as: ContentAuthor
            - call: "GET /digital-shelf/content-versions?product_id=${pgs_id}&state=DRAFT"
              payload: { product_id: "${pgs_id}", state: "DRAFT" }
              as: ContentAuthor
          assert:
            - "first response: meta.total_count == 1 and ${back_id} == ${vs2_id}"
            - "second response: meta.total_count == 0"
            - "third response: meta.total_count == 2"

      - name: media_assets_list_filters_by_product_and_approval_state
        claim_type: listing
        grounds:
          - entities.MediaAsset.fields.approval_state
          - endpoints["GET /digital-shelf/media-assets"]
        distinguishing_aspect: "Two assets on the same product, one APPROVED and one still PENDING, are separated by the approval_state filter while the unfiltered list returns both."
        test_recipe:
          setup:
            - "Retailer RETS and product SKU-G-3 exist with two media assets, of which the hero asset has been APPROVED by RETS"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/retailers"
              payload: { name: "SimpleMart", retailer_code: "RETS" }
              as: ShelfAdmin
