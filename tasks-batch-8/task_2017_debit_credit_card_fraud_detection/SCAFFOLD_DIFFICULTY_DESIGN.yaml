  - rule_id: boundary_precision_check
    instances:
      - name: decline_threshold_equality
        grounds:
          - calculations.authorization_scoring
          - entities.RuleSet.fields.decline_threshold
          - endpoints["POST /fraudops/auth-transactions"]
        distinguishing_aspect: |
          Metric = integer score points on POST /auth-transactions. score == decline_threshold
          (100) DECLINES (inclusive >=), while 75 and exactly-at-review 60 REVIEW and 40
          APPROVES — a strict-greater-than implementation flips the 100 case.
