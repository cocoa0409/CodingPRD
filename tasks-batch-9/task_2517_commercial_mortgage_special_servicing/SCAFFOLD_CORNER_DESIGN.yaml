          assert:
            - "At clock 2026-06-01: the 2026-02-01 advance reports accrued_interest_usd 3333.33 (120 days) and the 2026-04-01 advance 1250.00 (60 days), even though the April row was created first"
            - "interest_accrued_through equals the clock at read time, 2026-06-01T00:00:00Z"
            - "At clock 2026-08-31 the 2026-02-15 advance reports 5416.67, i.e. day_count 195 with D1 = 15 and D2 clamped from 31 to 30"
            - "At clock 2026-10-01 the three advances report 6666.67 (240 days), 6277.78 (226 days) and 3750.00 (180 days) respectively"
            - "Every figure is derived from advanced_on and the clock only; no stored interest value was mutated by the clock moves and no Advance.version incremented"
