            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "XXX", team_name: "Team X" }, as: MeetDirector, captures: { team_x: "$.data.id" } }
            - { call: "POST /teams", payload: { meet_id: "${meet_id}", team_code: "YYY", team_name: "Team Y" }, as: MeetDirector, captures: { team_y: "$.data.id" } }
            - { call: "POST /swimmers", payload: { team_id: "${team_x}", full_name: "A Fast", birth_date: "2014-03-10", gender: "M" }, as: TeamCoach, as_user_id: "${team_x}", captures: { sw_a: "$.data.id" } }
