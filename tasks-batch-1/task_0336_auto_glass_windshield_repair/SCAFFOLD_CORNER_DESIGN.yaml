scaffold_corner_design:
  # =========================================================================
  # Entities — creation, retrieval, not-found, required fields, defaults,
  # computed/system fields, type/enum constraints, FK integrity, duplicates
  # =========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Customer
          - endpoints./customers
        distinguishing_aspect: "POST /customers with full_name,email,phone,service_address_state returns 201 with server-minted id, created_at, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "New Cust", email: "new@x.com", phone: "555-0200", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id, ver: $.data.version }
          assert:
            - "response status == 201"
            - "data.id is a non-empty UUID; data.version == 1; data.created_at present"

      - name: get_customer_not_found
        claim_type: Not Found
        grounds:
          - entities.Customer
          - endpoints./customers/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /customers/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404; data.error_id == ERR_NOT_FOUND"

      - name: create_vehicle_missing_required_vin_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Vehicle
          - endpoints./vehicles
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /vehicles omitting vin -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Veh Owner", email: "vown@x.com", phone: "555-0201", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", make: "Honda", model: "Civic", model_year: 2021, glass_part_number: "FW04200" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400; data.error_id == ERR_INVALID_REQUEST"

      - name: create_vehicle_default_adas_equipped_false
        claim_type: Defaults
        grounds:
          - entities.Vehicle.fields.adas_equipped
          - endpoints./vehicles
        distinguishing_aspect: "Omitting adas_equipped on POST /vehicles applies the declared default false."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Def Owner", email: "def@x.com", phone: "555-0202", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "LHGCM82633A004400", make: "Honda", model: "Civic", model_year: 2021, glass_part_number: "FW04201" }
              as: ServiceAdvisor
              captures: { adas: $.data.adas_equipped }
          assert:
            - "data.adas_equipped == false"

      - name: damage_assessment_recommendation_is_computed_not_input
        claim_type: Computed Fields
        grounds:
          - entities.DamageAssessment.fields.recommendation
          - calculations.repair_vs_replace_decision
          - endpoints./work-orders/{id}/damage-assessments
        distinguishing_aspect: "recommendation is server-computed from the measurements; a clearly-repairable reading (chip 1, crack 10, edge 90, not in view) yields REPAIR regardless of any client wish."
        test_recipe:
          setup: ["An OPEN work order exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Comp Owner", email: "comp@x.com", phone: "555-0203", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "MHGCM82633A004401", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04202" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ServiceAdvisor
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 10, in_driver_primary_view: false, edge_distance_mm: 90 }
              as: ServiceAdvisor
              captures: { rec: $.data.recommendation }
          assert:
            - "data.recommendation == REPAIR"
            - "data.status == DRAFT"

      - name: create_glass_part_invalid_bay_type_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ServiceBay.fields.bay_type
          - endpoints./service-bays
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /service-bays with bay_type=DETAIL (not in {INSTALL,CALIBRATION}) -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /service-bays"
              payload: { name: "Bad Bay", bay_type: "DETAIL", cleanroom: false }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400; data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_customer_email_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Customer.fields.email
          - validations[priority=17]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "A second POST /customers with an already-used email -> 409 ERR_DUPLICATE."
        test_recipe:
          setup: ["A customer with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "First", email: "dup@x.com", phone: "555-0204", service_address_state: "CA" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Second", email: "dup@x.com", phone: "555-0205", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409; data.error_id == ERR_DUPLICATE"

      - name: duplicate_vehicle_vin_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Vehicle.fields.vin
          - validations[priority=17]
          - errors[ERR_DUPLICATE]
        distinguishing_aspect: "A second POST /vehicles with an already-used VIN -> 409 ERR_DUPLICATE (different uniqueness key than email)."
        test_recipe:
          setup: ["A customer and one vehicle with VIN NHGCM82633A004402 exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Vin Owner", email: "vin@x.com", phone: "555-0206", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "NHGCM82633A004402", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04203" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "NHGCM82633A004402", make: "Honda", model: "Accord", model_year: 2022, adas_equipped: false, glass_part_number: "FW04204" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409; data.error_id == ERR_DUPLICATE"

      - name: create_vehicle_nonexistent_customer_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Vehicle.fields.customer_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /vehicles whose customer_id references no customer -> 404 ERR_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { customer_id: "00000000-0000-0000-0000-000000000000", vin: "OHGCM82633A004403", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04205" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404; data.error_id == ERR_NOT_FOUND"

      - name: list_customer_vehicles_reverse_reachability
        claim_type: Listing
        grounds:
          - entities.Vehicle.fields.customer_id
          - endpoints./customers/{id}/vehicles
        distinguishing_aspect: "GET /customers/{id}/vehicles returns the FK-linked vehicles (reverse-reachability for Vehicle.customer_id)."
        test_recipe:
          setup: ["A customer with one vehicle."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "List Owner", email: "list@x.com", phone: "555-0207", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "PHGCM82633A004404", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04206" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
          trigger:
            - call: "GET /customers/${cid}/vehicles"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "response is an array of length 1 containing the created vehicle"

      - name: glass_part_lookup_by_oem_number
        claim_type: Listing
        grounds:
          - entities.GlassPart.fields.oem_part_number
          - endpoints./glass-parts
        distinguishing_aspect: "GET /glass-parts?oem_part_number=FW04207 returns only matching SKUs (part lookup)."
        test_recipe:
          setup: ["Two glass parts with different oem numbers."]
          setup_api_calls:
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04207", description: "Match part", adas_compatible: true, unit_price_cents: 30000, on_hand_qty: 2 }
              as: ShopManager
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04208", description: "Other part", adas_compatible: false, unit_price_cents: 21000, on_hand_qty: 2 }
              as: ShopManager
          trigger:
            - call: "GET /glass-parts?oem_part_number=FW04207"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "response is an array; every element has oem_part_number == FW04207"

  # =========================================================================
  # State machines — invalid transitions, terminal lockdown, idempotency
  # =========================================================================
  - section: state_machines
    instances:
      - name: accept_assessment_twice_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.WorkOrder.OPEN_to_ASSESSED
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "After OPEN->ASSESSED, a second accept-assessment on the now-ASSESSED work order -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A work order moved OPEN->ASSESSED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Twice", email: "twice@x.com", phone: "555-0208", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "QHGCM82633A004405", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04209" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ServiceAdvisor
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 10, in_driver_primary_view: false, edge_distance_mm: 90 }
              as: ServiceAdvisor
              captures: { asmt: $.data.id }
            - call: "POST /work-orders/${wo}/accept-assessment"
              payload: { assessment_id: "${asmt}" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /work-orders/${wo}/accept-assessment"
              payload: { assessment_id: "${asmt}" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409; data.error_id == ERR_INVALID_STATE"

      - name: start_service_from_open_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_IN_SERVICE
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /work-orders/{id}/start-service on an OPEN (not SCHEDULED) work order -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A fresh OPEN work order with a technician."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Early", email: "early@x.com", phone: "555-0209", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "RHGCM82633A004406", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04210" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Early Tech", can_mobile: false, adas_certified: false, home_state: "CA" }
              as: ShopManager
              captures: { tid: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ServiceAdvisor
              captures: { wo: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409; data.error_id == ERR_INVALID_STATE"

      - name: cancel_completed_work_order_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.WorkOrder.OPEN_to_CANCELLED
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "cancel is defined only from {OPEN,ASSESSED,SCHEDULED}; cancelling an IN_SERVICE REPAIR work order -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A REPAIR work order driven to IN_SERVICE."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Late Cancel", email: "late@x.com", phone: "555-0210", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "SHGCM82633A004407", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04211" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Late Tech", can_mobile: false, adas_certified: false, home_state: "CA" }
              as: ShopManager
              captures: { tid: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Bay LC", bay_type: "INSTALL", cleanroom: false }
              as: ShopManager
              captures: { bid: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ServiceAdvisor
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 10, in_driver_primary_view: false, edge_distance_mm: 90 }
              as: ServiceAdvisor
              captures: { asmt: $.data.id }
            - call: "POST /work-orders/${wo}/accept-assessment"
              payload: { assessment_id: "${asmt}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo}", technician_id: "${tid}", service_bay_id: "${bid}", service_location: "IN_SHOP", start_at: "2026-06-13T08:00:00Z", end_at: "2026-06-13T09:00:00Z" }
              as: ServiceAdvisor
              captures: { appt: $.data.id }
            - call: "POST /work-orders/${wo}/schedule"
              payload: { appointment_id: "${appt}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments/${appt}/check-in"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /work-orders/${wo}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
          trigger:
            - call: "POST /work-orders/${wo}/cancel"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409; data.error_id == ERR_INVALID_STATE; work order stays IN_SERVICE"

      - name: void_warranty_twice_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Warranty.ACTIVE_to_VOID
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "VOID is terminal for Warranty; a second void on an already-VOID warranty -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A REPAIR work order completed (warranty issued ACTIVE), then warranty voided once."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "War Owner", email: "war@x.com", phone: "555-0211", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "THGCM82633A004408", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04212" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "War Tech", can_mobile: false, adas_certified: false, home_state: "CA" }
              as: ShopManager
              captures: { tid: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Bay W", bay_type: "INSTALL", cleanroom: false }
              as: ShopManager
              captures: { bid: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ServiceAdvisor
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 10, in_driver_primary_view: false, edge_distance_mm: 90 }
              as: ServiceAdvisor
              captures: { asmt: $.data.id }
            - call: "POST /work-orders/${wo}/accept-assessment"
              payload: { assessment_id: "${asmt}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo}", technician_id: "${tid}", service_bay_id: "${bid}", service_location: "IN_SHOP", start_at: "2026-06-13T08:00:00Z", end_at: "2026-06-13T09:00:00Z" }
              as: ServiceAdvisor
              captures: { appt: $.data.id }
            - call: "POST /work-orders/${wo}/schedule"
              payload: { appointment_id: "${appt}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments/${appt}/check-in"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /work-orders/${wo}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /payments"
              payload: { work_order_id: "${wo}", amount_cents: 9657, method: "CASH" }
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo}/complete"
              payload: {}
              as: ServiceAdvisor
            - call: "GET /work-orders/${wo}/warranties"
              payload: {}
              as: ServiceAdvisor
              captures: { war_id: "$.data[0].id" }
            - call: "POST /warranties/${war_id}/void"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /warranties/${war_id}/void"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409; data.error_id == ERR_INVALID_STATE"

      - name: repair_work_order_completes_directly_from_in_service
        claim_type: Valid Transition
        grounds:
          - state_machines.WorkOrder.IN_SERVICE_to_COMPLETED
          - entities.Warranty.fields.coverage_type
        distinguishing_aspect: "A REPAIR work order goes IN_SERVICE->COMPLETED directly (no cure, no recalibration) and issues a CHIP_REPAIR warranty."
        test_recipe:
          setup: ["A REPAIR work order in IN_SERVICE, fully paid 9657."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Rep Owner", email: "rep@x.com", phone: "555-0212", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cid: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cid}", vin: "UHGCM82633A004409", make: "Honda", model: "Civic", model_year: 2021, adas_equipped: false, glass_part_number: "FW04213" }
              as: ServiceAdvisor
              captures: { vid: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Rep Tech", can_mobile: false, adas_certified: false, home_state: "CA" }
              as: ShopManager
              captures: { tid: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Bay R", bay_type: "INSTALL", cleanroom: false }
              as: ShopManager
              captures: { bid: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cid}", vehicle_id: "${vid}" }
              as: ServiceAdvisor
              captures: { wo: $.data.id }
            - call: "POST /work-orders/${wo}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 10, in_driver_primary_view: false, edge_distance_mm: 90 }
              as: ServiceAdvisor
              captures: { asmt: $.data.id }
            - call: "POST /work-orders/${wo}/accept-assessment"
              payload: { assessment_id: "${asmt}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo}", technician_id: "${tid}", service_bay_id: "${bid}", service_location: "IN_SHOP", start_at: "2026-06-13T08:00:00Z", end_at: "2026-06-13T09:00:00Z" }
              as: ServiceAdvisor
              captures: { appt: $.data.id }
            - call: "POST /work-orders/${wo}/schedule"
              payload: { appointment_id: "${appt}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments/${appt}/check-in"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /work-orders/${wo}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /payments"
              payload: { work_order_id: "${wo}", amount_cents: 9657, method: "CASH" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /work-orders/${wo}/complete"
              payload: {}
              as: ServiceAdvisor
              captures: { st: $.data.status }
          assert:
            - "WorkOrder.${wo}.status == COMPLETED"
            - "GET /work-orders/${wo}/warranties returns one Warranty with coverage_type == CHIP_REPAIR and status ACTIVE"

      - name: finish_install_on_repair_work_order_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.WorkOrder.IN_SERVICE_to_CURING
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
