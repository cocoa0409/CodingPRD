          - endpoints[POST /broadcast-ops/data-feeds/{id}/suspend].side_effects
          - state_machines.SystemPrep.VALIDATED_to_PENDING
          - state_machines.Production.REHEARSED_to_SURVEYED
          - state_machines.Rehearsal.SCHEDULED_to_ABORTED
          - entities.ShowExecution.fields.readiness_hold
        distinguishing_aspect: |
          Depth 4, strictly serial: suspending the DataFeed reverts the only VALIDATED SystemPrep to
          PENDING (link 1); *because* the validated-prep count fell below required_validated_preps,
          provisioning_conditions breaks and the Production drops REHEARSED -> SURVEYED (link 2);
          *because* the production left {PROVISIONED, REHEARSED}, the still-SCHEDULED second Rehearsal
          is ABORTED and the PRE_SHOW ShowExecution has readiness_hold set (link 3); *because* the
          production is no longer REHEARSED, the subsequent ON_AIR attempt is refused (link 4). No
          link is reachable from the trigger except through its predecessor.
        test_recipe:
          setup:
            - "The canonical TIER_3 production driven all the way to REHEARSED: approved 2-position survey, assigned TIER_3 truck, CONFIRMED PRIMARY booking on FIBER FIB-A, one VALIDATED GRAPHICS prep on feed STATSCO, two ACCEPTED crew calls, one COMPLETED rehearsal."
            - "A second Rehearsal created afterwards and left in SCHEDULED."
            - "A ShowExecution created and left in PRE_SHOW with readiness_hold == false."
            - "required_validated_preps for TIER_3 is 1, so this single prep is the whole provisioning gate."
