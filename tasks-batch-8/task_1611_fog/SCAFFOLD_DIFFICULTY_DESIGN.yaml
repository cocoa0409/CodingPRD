            - call: "POST /interceptors"
              payload: { establishment_id: "${eb}", nominal_capacity_gal: 50 }
              as: ProgramAdmin
              captures: { ib: $.data.id }
            - call: "POST /interceptors/${ib}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /interceptors/${ib}/commission"
              payload: {}
              as: Inspector
            - call: "POST /haulers"
              payload: { name: "Prio Haul", permit_number: "PN-PRI", insurance_expires_on: "2027-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { h: $.data.id }
            - call: "POST /haulers/${h}/permit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /pump-manifests"
              payload: { establishment_id: "${ea}", interceptor_id: "${ib}", hauler_id: "${h}", pump_date: "2026-08-01T00:00:00Z", pumped_volume_gal: 1500 }
              as: FseContact
              as_user_id: "${ea}"
              captures: { m: $.data.id }
            - call: "POST /haulers/${h}/suspend"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /pump-manifests/${m}/verify"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HAULER_NOT_PERMITTED (priority 9 business_safety beats priority 10 business_referential)"
            - "ERR_INTERCEPTOR_MISMATCH is NOT returned although interceptor ${ib} belongs to ${eb} != ${ea}"
            - "PumpManifest.${m}.status remains SUBMITTED"

      - name: variance_approve_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_VARIANCE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Error-category pair state (priority 6) vs business_temporal (priority
          11): the variance is already terminal DENIED AND its window still
          overlaps an APPROVED same-scope variance — both fail; the state error
          must win. Different category pair from the safety-vs-referential
          sibling.
        test_recipe:
          setup:
            - "LOW establishment (COMPLIANT)"
            - "V1 PUMPING_FREQUENCY window [2027-01-01, 2027-07-01) APPROVED"
            - "V2 same scope window [2027-03-01, 2027-09-01) created (V1 is APPROVED, not open) then DENIED"
