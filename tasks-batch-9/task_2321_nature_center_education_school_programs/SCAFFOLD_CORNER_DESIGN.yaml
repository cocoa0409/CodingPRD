              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off2_id}/submit-for-review"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off2_id}/review"
              payload: { decision: "PUBLISH" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/program-offerings"
              payload: { title: "Streamside Erosion", grade_band: "G3_5", delivery_mode: "ONSITE_FIELD_TRIP", duration_minutes: 120, max_group_size: 60, min_chaperone_ratio_students_per_adult: 10, base_fee_cents_per_student: 1233, requires_live_animal: false, requires_trail_segment: false, public_contact_required: false }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off3_id: $.data.id }
          trigger:
            - call: "GET /nature-center/program-offerings"
              payload: { grade_band: "G3_5", status: "PUBLISHED", limit: 50, offset: 0 }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { first_id: "$.data[0].id" }
            - call: "GET /nature-center/program-offerings"
              payload: { grade_band: "G3_5", status: "PUBLISHED", limit: 1, offset: 1 }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { page2_id: "$.data[0].id" }
            - call: "GET /nature-center/program-offerings"
              payload: { status: "DRAFT", limit: 50, offset: 0 }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { draft_id: "$.data[0].id" }
          assert:
            - "the first listing returns exactly 2 rows, both with status PUBLISHED"
            - "${first_id} == ${off1_id}"
            - "the second listing returns exactly 1 row"
            - "${page2_id} == ${off2_id}"
            - "the third listing returns exactly 1 row"
            - "${draft_id} == ${off3_id}"
            - "no listing response contains ProgramOffering.${off3_id} unless status DRAFT was requested"
      - name: program_offering_get_returns_not_found_for_an_unknown_id
        claim_type: Not Found
        grounds:
          - validations.priority_6
          - errors.ERR_OFFERING_NOT_FOUND
          - endpoints.GET /nature-center/program-offerings/{id}
        distinguishing_aspect: |
          The unknown id is shaped exactly like a real one and the caller holds a permitted role,
          so the only thing distinguishing the request is the absence of the row: the response
          must be the entity-specific 404 code rather than a generic 400 or an empty 200 envelope.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "No ProgramOffering with id off-9999 was ever created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T07:00:00Z" }
              as: EducationDirector
              as_user_id: "ed-01"
          trigger:
            - call: "GET /nature-center/program-offerings/off-9999"
              payload: {}
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_OFFERING_NOT_FOUND"
            - "HTTP status == 404"
            - "the response body carries the §1.0 error envelope with a non-empty message"
      - name: creates_missing_a_required_field_are_rejected
        claim_type: Required Fields
        grounds:
          - validations.priority_4
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST /nature-center/bookings
          - endpoints.POST /nature-center/program-offerings
          - endpoints.POST /nature-center/permits
        distinguishing_aspect: |
          Each omission is of a field with no declared default, on three different entities, and
          every referenced foreign key in the booking body is valid — so priority 4 must fire
          ahead of the priority 7 existence sweep and ahead of any business rule, proving the
          schema gate runs before anything reads the database.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "A PUBLISHED ProgramOffering and an ACTIVE SchoolPartner both exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T07:00:00Z" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/program-offerings"
              payload: { title: "Pond Ecology Field Study", grade_band: "G3_5", delivery_mode: "ONSITE_FIELD_TRIP", duration_minutes: 120, max_group_size: 60, min_chaperone_ratio_students_per_adult: 10, base_fee_cents_per_student: 1233, requires_live_animal: false, requires_trail_segment: false, public_contact_required: false }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off_id: $.data.id }
            - call: "POST /nature-center/program-offerings/${off_id}/standard-alignments"
              payload: { standard_code: "3-LS4-3", dimension: "DISCIPLINARY_CORE_IDEA" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/standard-alignments"
              payload: { standard_code: "3-LS4-4", dimension: "SCIENCE_PRACTICE" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/materials"
              payload: { phase: "PRE_VISIT", url_slug: "off-pre" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off_pre: $.data.id }
            - call: "POST /nature-center/program-offerings/${off_id}/materials"
              payload: { phase: "POST_VISIT", url_slug: "off-post" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off_post: $.data.id }
            - call: "POST /nature-center/curriculum-materials/${off_pre}/publish"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/curriculum-materials/${off_post}/publish"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/submit-for-review"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/review"
              payload: { decision: "PUBLISH" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/schools"
              payload: { name: "Cedar Grove Elementary", district_code: "LEA-77", title_i_pct: 0.82, distance_miles: 12.5 }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { school_id: $.data.id }
          trigger:
            - call: "POST /nature-center/bookings"
              payload: { school_id: "${school_id}", offering_id: "${off_id}", start_utc: "2026-09-29T14:00:00Z", end_utc: "2026-09-29T16:00:00Z", chaperone_count: 3 }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { err1: $.data.error_id }
            - call: "POST /nature-center/program-offerings"
              payload: { title: "Vernal Pools", delivery_mode: "ONSITE_FIELD_TRIP", duration_minutes: 90, max_group_size: 40, min_chaperone_ratio_students_per_adult: 10, base_fee_cents_per_student: 800 }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { err2: $.data.error_id }
            - call: "POST /nature-center/permits"
              payload: { agency: "USFWS", permit_number: "MB-2026-900", valid_from: "2026-01-01T00:00:00Z" }
              as: StewardshipManager
              as_user_id: "sm-01"
              captures: { err3: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_REQUEST"
            - "${err2} == ERR_INVALID_REQUEST"
            - "${err3} == ERR_INVALID_REQUEST"
            - "HTTP status == 400 on all three calls"
            - "no Booking, ProgramOffering or Permit row was created by the three rejected calls"
      - name: omitted_optional_fields_fall_back_to_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.ProgramOffering
          - entities.TrailSegment.fields.recovery_buffer_minutes
          - entities.ScholarshipFund.fields.transport_sublimit_pct
          - entities.Educator.fields.animal_handling_tier
        distinguishing_aspect: |
          Four entities are created with the smallest legal body each, and the asserted defaults
          are the ones that later drive arithmetic (a 30-minute trail recovery buffer, a 0.25
          transport sublimit) rather than cosmetic flags — so a wrong default here would silently
          change interval overlap and award ceilings downstream.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "No other rows exist"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T07:00:00Z" }
              as: EducationDirector
              as_user_id: "ed-01"
          trigger:
            - call: "POST /nature-center/program-offerings"
              payload: { title: "Vernal Pools", grade_band: "G6_8", delivery_mode: "VIRTUAL", duration_minutes: 60, max_group_size: 40, min_chaperone_ratio_students_per_adult: 12, base_fee_cents_per_student: 800 }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { o_id: $.data.id, o_animal: $.data.requires_live_animal, o_trail: $.data.requires_trail_segment, o_contact: $.data.public_contact_required, o_st: $.data.status }
            - call: "POST /nature-center/trail-segments"
              payload: { name: "Ridge Spur", capacity_persons: 40, habitat_sensitivity: "MODERATE", weekly_visitor_budget_persons: 200 }
              as: StewardshipManager
              as_user_id: "sm-01"
              captures: { t_id: $.data.id, t_buf: $.data.recovery_buffer_minutes, t_st: $.data.status, t_wk: $.data.visitors_this_week }
            - call: "POST /nature-center/scholarship-funds"
              payload: { funder_name: "Riverbend Foundation", fiscal_year: 2027, total_cents: 5000000 }
              as: GrantsOfficer
              as_user_id: "go-01"
              captures: { f_id: $.data.id, f_sub: $.data.transport_sublimit_pct, f_st: $.data.status, f_avail: $.data.available_cents, f_pend: $.data.pending_cents }
            - call: "POST /nature-center/educators"
              payload: { full_name: "Rae Alder", employment_type: "STAFF_NATURALIST" }
              as: EducationDirector
              as_user_id: "ed-01"
              captures: { e_id: $.data.id, e_st: $.data.status, e_tier: $.data.animal_handling_tier, e_load: $.data.delivery_load_minutes_this_week }
          assert:
            - "${o_animal} == false"
            - "${o_trail} == false"
            - "${o_contact} == false"
            - "${o_st} == DRAFT"
            - "${t_buf} == 30"
            - "${t_st} == OPEN"
            - "${t_wk} == 0"
            - "${f_sub} == 0.25"
            - "${f_st} == OPEN"
            - "${f_avail} == 5000000"
            - "${f_pend} == 0"
            - "${e_st} == APPLICANT"
            - "${e_tier} == NONE"
            - "${e_load} == 0"
            - "Educator.${e_id}.curriculum_certified_grade_bands == []"
            - "Educator.${e_id}.season_end_date == null"
            - "ScholarshipFund.${f_id}.committed_cents == 0"
            - "ScholarshipFund.${f_id}.disbursed_cents == 0"
            - "ProgramOffering.${o_id}.published_at == null"
      - name: booking_create_computes_chaperone_requirement_and_provisional_fee
        claim_type: Computed Fields
        grounds:
          - calculations.chaperone_requirement
          - calculations.booking_fee_assessment
          - entities.Booking.fields.required_chaperones
          - entities.SchoolPartner.fields.equity_tier
        distinguishing_aspect: |
          The headcount 23 is deliberately not a multiple of the ratio and lands inside the 15-29
          discount band, so one create call must exercise the ceiling in one calculation and the
          rounding-before-multiplication order in another; the school's equity_tier is asserted
          from the same fixture to show a derived field computed from an input the caller supplied
          as a raw percentage.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "ProgramOffering PUBLISHED, ONSITE_FIELD_TRIP, ratio 10, base fee 1233 cents"
            - "SchoolPartner with title_i_pct 0.82"
