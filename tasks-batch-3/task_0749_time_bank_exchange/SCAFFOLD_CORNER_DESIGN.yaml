              captures: { m: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m}", delta_minutes: 300, memo: "seed" }
              as: PlatformAdmin
            - call: "GET /members/${m}"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { v_pre: $.data.version }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m}", delta_minutes: 15, memo: "bump" }
              as: PlatformAdmin
              captures: { v_now: $.data.version }
          trigger:
            - call: "POST /redemptions"
              payload: { member_id: "${m}", reward_code: "FARMERS_MARKET_15", expected_member_version: "${v_pre}" }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 412"
            - "response.data.error_id == ERR_STALE_MEMBER_VERSION"

      - name: occ_redemption_correct_version_succeeds
        claim_type: Optimistic Concurrency
        grounds:
          - concurrency_rules[redemption-stale-member-version]
        distinguishing_aspect: "Client passing the CURRENT Member.version succeeds; the OCC gate only rejects stale values."
        test_recipe:
          setup:
            - "Member M with seed 300; client reads current version and immediately posts."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "occ-ok@x.com", display_name: "N", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m}", delta_minutes: 300, memo: "seed" }
              as: PlatformAdmin
            - call: "GET /members/${m}"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { v_curr: $.data.version }
          trigger:
            - call: "POST /redemptions"
              payload: { member_id: "${m}", reward_code: "FARMERS_MARKET_15", expected_member_version: "${v_curr}" }
              as: Member
              as_user_id: "${m}"
              captures: { r_id: $.data.id, r_status: $.data.status }
          assert:
            - "HTTP status == 201"
            - "Redemption.${r_id}.status == REQUESTED"

      - name: cascading_side_effects_project_cancel_depth_3
        claim_type: Cascading Side Effects
        grounds:
          - state_machines.GroupProject
        excluded_because:
          difficulty_instance: project_cancel_cascade_depth_3
          rationale: "Covered by Rule 4 instance #1."

      - name: dual_variant_calculation_forward_vs_chronological
        claim_type: Dual Variant Calculation
        grounds:
          - calculations.forward_looking_balance
        excluded_because:
          difficulty_instance: forward_looking_vs_chronological_balance_on_member
          rationale: "Covered by Rule 1 instance #1."

      - name: derived_field_reconciliation_completed_exchange_count
        claim_type: Derived Field Reconciliation
        grounds:
          - entities.Member.fields.completed_exchange_count
        distinguishing_aspect: "completed_exchange_count is derived; after one SETTLED exchange as provider, provider's count == 1 (recomputed on settle side-effect)."
        test_recipe:
          setup:
            - "Providers M2 completed one exchange as provider (M1 requester, e1 SETTLED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "df-m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "df-m2@x.com", display_name: "M2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "G", title: "G", minutes_per_session: 60 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "G", needed_minutes: 60, earliest_start_utc: "2026-03-02T10:00:00Z", latest_start_utc: "2026-03-02T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-02T10:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T11:30:00Z" }
              as: PlatformAdmin
            - call: "POST /exchanges/${e1}/mark-delivered"
              payload: {}
              as: Member
              as_user_id: "${m2}"
            - call: "POST /exchanges/${e1}/settle"
              payload: {}
              as: Member
              as_user_id: "${m1}"
          trigger:
            - call: "GET /members/${m2}"
              payload: {}
              as: Member
              as_user_id: "${m2}"
              captures: { cec: $.data.completed_exchange_count, chr: $.data.chronological_balance_minutes }
          assert:
            - "Member.${m2}.completed_exchange_count == 1"
            - "Member.${m2}.chronological_balance_minutes == 60 (paired +60 EARNED entry)"

      - name: pagination_filtering_ledger_entries
        claim_type: Pagination With Filtering
        grounds:
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /ledger-entries?member_id=... with limit=2&offset=1 returns exactly one page slice and correct total_count."
        test_recipe:
          setup:
            - "Member M with 5 ADMIN_ADJUSTMENT ledger entries (each +15 min)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "pg@x.com", display_name: "N", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m}", delta_minutes: 15, memo: "e1" }
              as: PlatformAdmin
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m}", delta_minutes: 15, memo: "e2" }
              as: PlatformAdmin
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m}", delta_minutes: 15, memo: "e3" }
              as: PlatformAdmin
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m}", delta_minutes: 15, memo: "e4" }
              as: PlatformAdmin
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m}", delta_minutes: 15, memo: "e5" }
              as: PlatformAdmin
          trigger:
            - call: "GET /ledger-entries?member_id=${m}&limit=2&offset=1"
