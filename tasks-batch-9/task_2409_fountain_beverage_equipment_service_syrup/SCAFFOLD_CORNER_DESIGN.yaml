      - name: frozen_posture_outranks_the_exhausted_national_pool
        claim_type: priority_conflict
        grounds:
          - validations[priority 13 ERR_OUTLET_POSTURE_FROZEN]
          - validations[priority 32 ERR_ALLOCATION_POOL_EXHAUSTED]
        excluded_because:
          difficulty_instance: frozen_posture_outranks_allocation_pool_exhausted
          rationale: "§1.8 already stages an allocation request that violates both rules and pins the priority-13 answer; §1.9 covers the 13-versus-14 pair on serve instead."

      - name: van_window_conflict_outranks_the_insufficient_van_parts
        claim_type: priority_conflict
        grounds:
          - validations[priority 24 ERR_VAN_WINDOW_CONFLICT]
          - validations[priority 26 ERR_INSUFFICIENT_VAN_PARTS]
        excluded_because:
          difficulty_instance: van_window_conflict_outranks_insufficient_van_parts
          rationale: "§1.8 already dispatches into an occupied van window while asking for more parts than the van holds; §1.9 covers the 10-versus-25 pair and the guarded-off parts checks instead."

  # ===========================================================================
  # ENDPOINTS
  # ===========================================================================
  - section: endpoints
    instances:

      - name: supply_item_patch_raises_the_pool_and_moves_the_promo_window
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /fountain-network/supply-items/{id}]
        distinguishing_aspect: "The PATCH accepts a partial body: national_allocation_units and both promo bounds are rewritten, version goes 1 -> 2, and the untouched fields (sku_code, case_pack_units, ounces_per_unit, reserved_pool_units) keep their created values."
        test_recipe:
          setup:
            - "One promotional SKU created with national_allocation_units 40 and window 2026-06-01..2026-07-01."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "SKU-PROMO", brand_name: "Summer Splash", supply_form: "CARTRIDGE", case_pack_units: 6, ounces_per_unit: 1200, promotional: true, promo_window_start: "2026-06-01T00:00:00Z", promo_window_end: "2026-07-01T00:00:00Z", national_allocation_units: 40 }
              as: NetworkAdmin
              captures: { si: $.data.id }
          trigger:
            - call: "PATCH /fountain-network/supply-items/${si}"
              payload: { national_allocation_units: 90, promo_window_start: "2026-07-15T00:00:00Z", promo_window_end: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
          assert:
            - "HTTP status == 200"
            - "SupplyItem.${si}.national_allocation_units == 90"
            - "SupplyItem.${si}.promo_window_start == \"2026-07-15T00:00:00Z\""
            - "SupplyItem.${si}.promo_window_end == \"2026-09-01T00:00:00Z\""
            - "SupplyItem.${si}.case_pack_units == 6"
            - "SupplyItem.${si}.ounces_per_unit == 1200"
            - "SupplyItem.${si}.reserved_pool_units == 0"
            - "SupplyItem.${si}.version == 2"

      - name: van_part_stock_read_back_returns_the_four_ledger_buckets
        claim_type: standard_crud
        grounds:
          - endpoints[GET /fountain-network/van-part-stocks/{id}]
          - entities.VanPartStock
        distinguishing_aspect: "A freshly loaded van row reads back with on_van_units 5, initial_units 5 and reserved_units, consumed_units and restocked_units all 0 at version 1 — the create endpoint seeds the ledger rather than leaving the buckets null."
