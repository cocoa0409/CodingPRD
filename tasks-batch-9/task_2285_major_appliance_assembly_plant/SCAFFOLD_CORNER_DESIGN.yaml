            - *c_seq1
            - *c_slot2
            - *c_seq2
            - call: "POST /build-slots"
              payload: { line_id: "${line_id}", model_variant_id: "${wmt_id}", sequence_index: 3, planned_start: "2026-08-03T08:00:00Z" }
              as: ProductionPlanner
              captures: { slott_id: $.data.id }
          trigger:
            - call: "GET /shift-plans/${shift_a_id}"
