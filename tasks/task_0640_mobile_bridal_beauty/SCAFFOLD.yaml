scenario: |
  640. Mobile & Bridal Beauty (Hair/Makeup) Booking: artist roster & portfolio, event date &
  party size/timeline, trial session & contract, per-face pricing & travel fee, deposit & balance,
  on-location scheduling & assistant, touch-up/extended-stay add-on, cancellation/weather
domain_name: mobile-bridal-beauty
api_prefix: /bridal-beauty

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - scheduled_deferred_actions
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities (Artist, BridalEvent, TrialSession, Contract, Invoice) linked by
  # foreign keys, not nested ownership. BookingFace and ServiceAssignment and AddOn
  # hang off BridalEvent / ServiceAssignment by FK, but the URL surface is flat:
  # /events/{id}, /artists/{id}, /invoices/{id} addressed at top level by their own id.

  state_machine_shape: parallel
  # BridalEvent runs a cyclic quote-revision loop (QUOTED -> REVISION_REQUESTED -> QUOTED).
  # Invoice carries TWO independent state axes (deposit_status x balance_status) that evolve
  # separately. ServiceAssignment is a branching fork-join (artist + optional assistant block
  # the same on-location window with divergent side-effect sets). Multiple non-linear shapes.

  relationship_patterns:
    - one_to_many       # BridalEvent -> BookingFace; ServiceAssignment -> AddOn; Invoice -> Payment
    - cross_aggregate   # Contract pins Artist rate snapshot; ServiceAssignment references Artist + BridalEvent
    - many_to_many      # Artist can serve many events; an event's window can hold artist + assistant

  role_model: peer_roles
  # Coordinator owns the platform-operations surface (roster, scheduling, invoices, clock).
  # Artist acts on their own assignments and trials. Client (the booking party lead) owns
  # their own BridalEvent, requests revisions, signs the contract, and pays.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# =====================================================================================
entities:
  - name: Artist
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: artist roster display name
      - name: skill_tier
        type: enum
        source: input
        description: "skill tier; constraints: one of {LEAD, SENIOR, JUNIOR}"
        constraints: "enum {LEAD, SENIOR, JUNIOR}"
      - name: hair_rate_per_face_cents
        type: integer
        source: input
        description: base hair styling rate per face in cents
        constraints: ">= 0"
      - name: makeup_rate_per_face_cents
        type: integer
        source: input
        description: base makeup rate per face in cents
        constraints: ">= 0"
      - name: travel_rate_per_km_cents
        type: integer
        source: input
        description: travel fee charged per kilometer of travel distance in cents
        constraints: ">= 0"
      - name: max_faces_per_hour
        type: integer
        source: input
        description: artist throughput, faces this artist can finish per on-location hour
        constraints: ">= 1"
      - name: can_assist
        type: boolean
        source: input
        description: whether this artist may be booked as an assistant on another artist's window
        default: false
      - name: status
        type: enum
        source: system
        description: "roster lifecycle; constraints: one of {ACTIVE, SUSPENDED, RETIRED}"
        default: ACTIVE
        constraints: "enum {ACTIVE, SUSPENDED, RETIRED}"
      - name: portfolio_published
        type: boolean
        source: computed
        description: true once at least one PUBLISHED PortfolioItem exists for this artist
        default: false

  - name: PortfolioItem
    parent: null
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the artist who owns this portfolio look"
      - name: look_name
        type: string
        source: input
        description: name of the showcased look
      - name: category
        type: enum
        source: input
        description: "service category; constraints: one of {HAIR, MAKEUP, BOTH}"
        constraints: "enum {HAIR, MAKEUP, BOTH}"
      - name: status
        type: enum
        source: system
        description: "publication state; constraints: one of {DRAFT, PUBLISHED}"
        default: DRAFT
        constraints: "enum {DRAFT, PUBLISHED}"

  - name: BridalEvent
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: opaque identifier of the booking party lead (the Client role user id)
      - name: event_date_utc
        type: datetime
        source: input
        description: calendar date/time of the wedding event (ISO 8601 UTC)
      - name: ready_by_utc
        type: datetime
        source: input
        description: timeline deadline by which all faces must be finished (ISO 8601 UTC)
        constraints: "must be > now and <= event_date_utc"
      - name: venue_distance_km
        type: number
        source: input
        description: one-way travel distance from artist base to venue, kilometers
        constraints: ">= 0"
      - name: party_size
        type: integer
        source: computed
        description: count of BookingFace rows attached to this event
        default: 0
      - name: status
        type: enum
        source: system
        description: "event lifecycle; constraints: one of {DRAFT, QUOTED, REVISION_REQUESTED, CONTRACTED, SCHEDULED, COMPLETED, CANCELLED}"
        default: DRAFT
        constraints: "enum {DRAFT, QUOTED, REVISION_REQUESTED, CONTRACTED, SCHEDULED, COMPLETED, CANCELLED}"
      - name: quote_revision
        type: integer
        source: system
        description: number of times a quote has been (re)issued; increments on each requote after a revision request
        default: 0
      - name: estimated_total_cents
        type: integer
        source: computed
        description: forward-looking quote total from per-face pricing + travel fee across all PENDING+CONFIRMED faces; recomputed on quote/requote
        default: 0
      - name: trial_required
        type: boolean
        source: input
        description: whether the client requires a trial session before contracting
        default: true

  - name: BookingFace
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> BridalEvent.id; the event this face belongs to"
      - name: person_label
        type: string
        source: input
        description: who this face is (e.g. BRIDE, BRIDESMAID_1)
      - name: service_type
        type: enum
        source: input
        description: "services requested; constraints: one of {HAIR, MAKEUP, BOTH}"
        constraints: "enum {HAIR, MAKEUP, BOTH}"
      - name: is_bride
        type: boolean
        source: input
        description: bride faces carry a surcharge multiplier in pricing
        default: false
      - name: status
        type: enum
        source: system
        description: "face lifecycle; constraints: one of {PENDING, CONFIRMED, REMOVED, SERVICED}"
        default: PENDING
        constraints: "enum {PENDING, CONFIRMED, REMOVED, SERVICED}"

  - name: TrialSession
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> BridalEvent.id; the event this trial precedes"
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the artist conducting the trial"
      - name: start_utc
        type: datetime
        source: input
        description: trial window start (ISO 8601 UTC)
      - name: end_utc
        type: datetime
        source: input
        description: trial window end (ISO 8601 UTC)
        constraints: "must be > start_utc"
      - name: status
        type: enum
        source: system
        description: "trial lifecycle; constraints: one of {BOOKED, COMPLETED, NO_SHOW, CANCELLED}"
        default: BOOKED
        constraints: "enum {BOOKED, COMPLETED, NO_SHOW, CANCELLED}"
      - name: trial_fee_cents
        type: integer
        source: input
        description: flat fee for the trial session
        constraints: ">= 0"

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> BridalEvent.id; the event this contract binds"
      - name: lead_artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the lead artist whose rates are pinned into this contract"
      - name: pinned_hair_rate_cents
        type: integer
        source: system
        description: snapshot of lead artist hair_rate_per_face_cents at signing; immune to later artist rate edits
      - name: pinned_makeup_rate_cents
        type: integer
        source: system
        description: snapshot of lead artist makeup_rate_per_face_cents at signing
      - name: pinned_travel_rate_per_km_cents
        type: integer
        source: system
        description: snapshot of lead artist travel_rate_per_km_cents at signing
      - name: contracted_total_cents
        type: integer
        source: computed
        description: locked event total computed at signing from pinned rates over CONFIRMED faces + travel; the authoritative price baseline
        default: 0
      - name: deposit_due_cents
        type: integer
        source: computed
        description: deposit portion of contracted_total_cents (see calc deposit_split)
        default: 0
      - name: status
        type: enum
        source: system
        description: "contract lifecycle; constraints: one of {DRAFT, SIGNED, VOIDED}"
        default: DRAFT
        constraints: "enum {DRAFT, SIGNED, VOIDED}"

  - name: ServiceAssignment
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> BridalEvent.id; the on-location event this assignment schedules"
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the lead artist working this on-location window"
      - name: assistant_artist_id
        type: string
        source: input
        description: "FK -> Artist.id; optional assistant artist booked into the same window; null when solo"
        default: null
      - name: window_start_utc
        type: datetime
        source: input
        description: on-location service window start (ISO 8601 UTC)
      - name: window_end_utc
        type: datetime
        source: input
        description: on-location service window end (ISO 8601 UTC)
        constraints: "must be > window_start_utc"
      - name: faces_committed
        type: integer
        source: system
        description: count of CONFIRMED faces on the event at the time this assignment was scheduled
        default: 0
      - name: status
        type: enum
        source: system
        description: "assignment lifecycle; constraints: one of {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}"
        default: SCHEDULED
        constraints: "enum {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: extended_until_utc
        type: datetime
        source: system
        description: window_end_utc extended by an EXTENDED_STAY add-on; null until extended
        default: null

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> ServiceAssignment.id; the on-location window this add-on extends"
      - name: addon_type
        type: enum
        source: input
        description: "add-on kind; constraints: one of {TOUCH_UP, EXTENDED_STAY}"
        constraints: "enum {TOUCH_UP, EXTENDED_STAY}"
      - name: quantity
        type: integer
        source: input
        description: TOUCH_UP -> number of touch-up faces; EXTENDED_STAY -> number of extra 30-minute blocks
        constraints: ">= 1"
      - name: amount_cents
        type: integer
        source: computed
        description: billed amount of this add-on (see calc addon_pricing)
        default: 0
      - name: status
        type: enum
        source: system
        description: "add-on lifecycle; constraints: one of {APPLIED, REVERSED}"
        default: APPLIED
        constraints: "enum {APPLIED, REVERSED}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> BridalEvent.id; the event this invoice bills"
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the signed contract this invoice draws its baseline from"
      - name: deposit_amount_cents
        type: integer
        source: computed
        description: deposit installment copied from contract.deposit_due_cents at invoice open
        default: 0
      - name: balance_amount_cents
        type: integer
        source: computed
        description: running remaining balance = contracted_total + add-ons - deposit - amount_paid; reconciled on every payment, add-on, and cancellation
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: sum of SUCCEEDED Payment.amount_cents on this invoice
        default: 0
      - name: deposit_status
        type: enum
        source: system
        description: "deposit axis; constraints: one of {DUE, PAID, REFUNDED, FORFEITED}"
        default: DUE
        constraints: "enum {DUE, PAID, REFUNDED, FORFEITED}"
      - name: balance_status
        type: enum
        source: system
        description: "balance axis; constraints: one of {NOT_DUE, DUE, PAID, WRITTEN_OFF}"
        default: NOT_DUE
        constraints: "enum {NOT_DUE, DUE, PAID, WRITTEN_OFF}"

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id; the invoice this payment applies to"
      - name: applies_to
        type: enum
        source: input
        description: "installment targeted; constraints: one of {DEPOSIT, BALANCE}"
        constraints: "enum {DEPOSIT, BALANCE}"
      - name: amount_cents
        type: integer
        source: input
        description: payment amount in cents
        constraints: ">= 1"
      - name: outcome
        type: enum
        source: system
        description: "settlement result; recorded payments are settled successfully; constraints: one of {SUCCEEDED}"
        default: SUCCEEDED
        constraints: "enum {SUCCEEDED}"

  - name: CancellationRecord
    parent: null
    common_fields: true
    fields:
      - name: event_id
        type: string
        source: input
        description: "FK -> BridalEvent.id; the event being cancelled"
      - name: reason
        type: enum
        source: input
        description: "cancellation cause; constraints: one of {CLIENT_CHOICE, WEATHER, ARTIST_UNAVAILABLE}"
        constraints: "enum {CLIENT_CHOICE, WEATHER, ARTIST_UNAVAILABLE}"
      - name: hours_before_event
        type: number
        source: computed
        description: (event_date_utc - clock_now) in hours at cancellation; drives the refund tier
        default: 0
      - name: refund_tier
        type: enum
        source: computed
        description: "policy tier resolved from reason + hours_before_event; constraints: one of {FULL_REFUND, DEPOSIT_FORFEIT, FULL_FORFEIT}"
        constraints: "enum {FULL_REFUND, DEPOSIT_FORFEIT, FULL_FORFEIT}"
      - name: deposit_refund_cents
        type: integer
        source: computed
        description: deposit amount returned under the resolved tier
        default: 0
      - name: balance_relief_cents
        type: integer
        source: computed
        description: outstanding balance written off under the resolved tier
        default: 0

# =====================================================================================
# §1.2 STATE MACHINE TABLE
# =====================================================================================
state_machines:
  - entity: BridalEvent
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /events/{id}/quote"
        actor: Coordinator
        preconditions:
          - "event has >= 1 BookingFace in status PENDING or CONFIRMED"
          - "ready_by_utc > clock_now"
        side_effects:
          - "run calc quote_total -> set estimated_total_cents over faces in {PENDING, CONFIRMED}"
          - "increment quote_revision by 1"
          - "set party_size = count of faces in {PENDING, CONFIRMED}"
      - from: QUOTED
        to: REVISION_REQUESTED
        trigger: "POST /events/{id}/request-revision"
        actor: Client
        preconditions:
          - "acting Client.id == event.client_id"
          - "no SIGNED Contract exists for this event"
        side_effects:
          - "clear estimated_total_cents to 0"
      - from: REVISION_REQUESTED
        to: QUOTED
        trigger: "POST /events/{id}/quote"
        actor: Coordinator
        preconditions:
          - "event has >= 1 BookingFace in status PENDING or CONFIRMED"
        side_effects:
          - "run calc quote_total -> reset estimated_total_cents"
          - "increment quote_revision by 1 (cyclic re-quote loop)"
          - "recompute party_size"
        note: "Cyclic loop QUOTED -> REVISION_REQUESTED -> QUOTED; quote_revision counts rounds."
      - from: QUOTED
        to: CONTRACTED
        trigger: "POST /contracts (sign) with this event_id"
        actor: Client
        preconditions:
          - "acting Client.id == event.client_id"
          - "if event.trial_required then a TrialSession for this event is in status COMPLETED"
          - "event has >= 1 BookingFace in status CONFIRMED"
        side_effects:
          - "Contract created in SIGNED, pinning lead artist rates (cross-aggregate snapshot)"
          - "run calc contract_total -> set Contract.contracted_total_cents over CONFIRMED faces"
          - "run calc deposit_split -> set Contract.deposit_due_cents"
          - "auto-open Invoice (deposit_status=DUE, balance_status=NOT_DUE) — cascade hop 1"
        note: "Cross-entity guard: contracting depends on TrialSession state when trial_required."
      - from: CONTRACTED
        to: SCHEDULED
        trigger: "POST /assignments with this event_id"
        actor: Coordinator
        preconditions:
          - "a SIGNED Contract exists for this event"
          - "Invoice.deposit_status == PAID"
          - "artist throughput covers party_size within the window (see validation P34)"
        side_effects:
          - "ServiceAssignment created in SCHEDULED"
          - "set assignment.faces_committed = count of CONFIRMED faces"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /events/{id}/complete"
        actor: Coordinator
        preconditions:
          - "every ServiceAssignment on this event is in status COMPLETED"
          - "Invoice.balance_status == PAID"
        side_effects:
          - "set all CONFIRMED BookingFace -> SERVICED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Client
        preconditions:
          - "acting Client.id == event.client_id"
        side_effects:
          - "CancellationRecord created (tier FULL_REFUND, no money moved at DRAFT)"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Client
        preconditions:
          - "acting Client.id == event.client_id"
        side_effects:
          - "CancellationRecord created (tier FULL_REFUND, no contract exists yet)"
      - from: CONTRACTED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Client
        preconditions:
          - "acting Client.id == event.client_id"
        side_effects:
          - "run calc cancellation_settlement -> resolve refund_tier, deposit_refund_cents, balance_relief_cents — cascade hop 1"
          - "Invoice deposit_status/balance_status transition per tier — cascade hop 2"
          - "all CONFIRMED/PENDING BookingFace -> REMOVED — cascade hop 3"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: Client
        preconditions:
          - "acting Client.id == event.client_id"
        side_effects:
          - "run calc cancellation_settlement -> resolve tier — cascade hop 1"
          - "Invoice deposit/balance transition per tier — cascade hop 2"
          - "all SCHEDULED ServiceAssignment -> CANCELLED, releasing their windows — cascade hop 3"
          - "all CONFIRMED/PENDING BookingFace -> REMOVED — cascade hop 4"

  - entity: TrialSession
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /trials/{id}/complete"
        actor: Artist
        preconditions:
          - "acting Artist.id == trial.artist_id"
          - "clock_now >= trial.start_utc"
        side_effects:
          - "none beyond status/version"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /trials/{id}/no-show"
        actor: Coordinator
        preconditions:
          - "clock_now >= trial.end_utc"
        side_effects:
          - "none beyond status/version"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /trials/{id}/cancel"
        actor: Client
        preconditions:
          - "acting Client.id == the event's client_id (cross-entity)"
        side_effects:
          - "release the trial window for the artist"

  - entity: Contract
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /contracts"
        actor: Client
        preconditions:
          - "parent BridalEvent in QUOTED"
          - "if event.trial_required then a COMPLETED TrialSession exists for the event"
        side_effects:
          - "pin lead artist rate snapshot; compute contracted_total_cents and deposit_due_cents"
          - "advance BridalEvent DRAFT/QUOTED -> CONTRACTED"
          - "open Invoice"
        note: "Created already SIGNED via the contract endpoint; DRAFT is the pre-persist conceptual state."
      - from: SIGNED
        to: VOIDED
        trigger: "system: BridalEvent -> CANCELLED while CONTRACTED/SCHEDULED"
        actor: system
        preconditions:
          - "owning event transitioned to CANCELLED"
        side_effects:
          - "contract no longer billable; Invoice settlement already handled by cancellation calc"

  - entity: ServiceAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /assignments/{id}/start"
        actor: Artist
        preconditions:
          - "acting Artist.id == assignment.artist_id"
          - "clock_now >= window_start_utc"
          - "owning BridalEvent in SCHEDULED"
        side_effects:
          - "none beyond status/version"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /assignments/{id}/complete"
        actor: Artist
        preconditions:
          - "acting Artist.id == assignment.artist_id"
          - "every AddOn on this assignment is in status APPLIED or REVERSED (none pending)"
        side_effects:
          - "if balance_status == NOT_DUE, advance Invoice balance_status -> DUE (bubble-up readiness)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel or system cascade from event cancel"
        actor: Coordinator
        preconditions:
          - "owning BridalEvent NOT in COMPLETED"
        side_effects:
          - "release window; reverse all APPLIED AddOn on this assignment -> REVERSED; recompute Invoice balance — cascade"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "owning BridalEvent NOT in COMPLETED"
        side_effects:
          - "release window; reverse APPLIED AddOn -> REVERSED; recompute Invoice balance — cascade"

  - entity: Invoice
    initial_state: DUE
    terminal_states: []
    note: |
      PARALLEL state axes — deposit_status and balance_status evolve independently on the
      same Invoice row. deposit_status: DUE -> PAID -> {REFUNDED|FORFEITED}.
      balance_status: NOT_DUE -> DUE -> {PAID|WRITTEN_OFF}.
    transitions:
      - from: "deposit_status=DUE"
        to: "deposit_status=PAID"
        trigger: "POST /invoices/{id}/payments (applies_to=DEPOSIT, SUCCEEDED, full deposit)"
        actor: Client
        preconditions:
          - "acting Client.id == event.client_id"
          - "payment amount_cents == deposit_amount_cents - already-paid-deposit (exact deposit settlement)"
        side_effects:
          - "increment amount_paid_cents; recompute balance_amount_cents (derived-field reconcile)"
      - from: "balance_status=NOT_DUE"
        to: "balance_status=DUE"
        trigger: "system: an assignment reaches COMPLETED"
        actor: system
        preconditions:
          - "deposit_status == PAID"
        side_effects:
          - "balance is now collectible"
      - from: "balance_status=DUE"
        to: "balance_status=PAID"
        trigger: "POST /invoices/{id}/payments (applies_to=BALANCE, SUCCEEDED, clears balance)"
        actor: Client
        preconditions:
          - "acting Client.id == event.client_id"
          - "deposit_status == PAID"
          - "post-payment balance_amount_cents == 0"
        side_effects:
          - "increment amount_paid_cents; set balance_amount_cents = 0"
      - from: "deposit_status=PAID"
        to: "deposit_status=REFUNDED"
        trigger: "system: cancellation_settlement with tier FULL_REFUND"
        actor: system
        preconditions:
          - "owning event CANCELLED with refund_tier FULL_REFUND"
        side_effects:
          - "deposit returned (deposit_refund_cents == deposit_amount_cents)"
      - from: "deposit_status=PAID"
        to: "deposit_status=FORFEITED"
        trigger: "system: cancellation_settlement with tier DEPOSIT_FORFEIT or FULL_FORFEIT"
        actor: system
        preconditions:
          - "owning event CANCELLED with refund_tier in {DEPOSIT_FORFEIT, FULL_FORFEIT}"
        side_effects:
          - "deposit retained by platform; deposit_refund_cents == 0"
      - from: "balance_status=DUE"
        to: "balance_status=WRITTEN_OFF"
        trigger: "system: cancellation_settlement writes off outstanding balance"
        actor: system
        preconditions:
          - "owning event CANCELLED and outstanding balance > 0"
        side_effects:
          - "balance_relief_cents == outstanding balance; balance_amount_cents -> 0"

# -------------------------------------------------------------------------------------
# §1.2.1 CONCURRENCY RULES (OCC only)
# -------------------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assignment-create-stale-event
    parent_entity: BridalEvent
    write_endpoint: "POST /assignments"
    occ_field: "expected_event_version"
    description: |
      Scheduling a ServiceAssignment against a BridalEvent whose version has advanced
      since the client last observed it is rejected. This captures the case where another
      coordinator has already scheduled the event (advancing it CONTRACTED -> SCHEDULED and
      bumping event.version), so the current writer's view of the event is stale and the
      second create would otherwise legitimately schedule a duplicate window.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
  - rule_id: contract-sign-stale-event
    parent_entity: BridalEvent
    write_endpoint: "POST /contracts"
    occ_field: "expected_event_version"
    description: |
      Signing a Contract against a BridalEvent whose version has advanced since the client
      last read it is rejected. Another writer may have re-quoted the event (incrementing
      quote_revision and event.version); the stale signer's pinned price would reference an
      outdated quote, so the system rejects the stale-version create.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# =====================================================================================
# §1.3 CALCULATION RULES TABLE
# =====================================================================================
calculations:
  - name: quote_total
    trigger: "BridalEvent DRAFT->QUOTED and REVISION_REQUESTED->QUOTED (POST /events/{id}/quote)"
    algorithm: forward_looking
    formula: |
      # FORWARD-LOOKING estimate: includes every face the client MIGHT bring (PENDING + CONFIRMED).
      faces = BookingFace where event_id == E.id AND status IN {PENDING, CONFIRMED}
      per_face_subtotal = 0
      for f in faces:
        base = 0
        if f.service_type in {HAIR, BOTH}:  base += A.hair_rate_per_face_cents
        if f.service_type in {MAKEUP, BOTH}: base += A.makeup_rate_per_face_cents
        if f.is_bride: base = round_half_up(base * BRIDE_SURCHARGE_MULT)   # per-line rounding
        per_face_subtotal += base
      travel_fee = round_half_up(A.travel_rate_per_km_cents * E.venue_distance_km)
      estimated_total_cents = per_face_subtotal + travel_fee
    input_set: "faces in {PENDING, CONFIRMED}; A = the event's quoting artist (preferred lead, see selector below)"
    constants:
      BRIDE_SURCHARGE_MULT: 1.5
    precision: "integer cents; round_half_up applied PER bride-line and PER travel-fee BEFORE summing (per-line rounding order pinned)"
    variants:
      - name: forward_looking_pending_included
        when: "at quote time, before any face is CONFIRMED"
        difference: "PENDING faces are counted, inflating the estimate vs the later contracted total which counts only CONFIRMED"
    selector:
      candidate_set: "Artist where status == ACTIVE AND skill_tier == LEAD"
      ranking: "lowest hair_rate_per_face_cents + makeup_rate_per_face_cents (cheapest LEAD)"
      tie_break: "created_at ASC"
      empty_fallback: "ERR_NO_LEAD_ARTIST (no ACTIVE LEAD artist on roster)"

  - name: contract_total
    trigger: "BridalEvent QUOTED->CONTRACTED (POST /contracts sign)"
    algorithm: aggregation
    formula: |
      # FINAL baseline: counts only CONFIRMED faces, priced at the LEAD ARTIST'S PINNED rates
      # (NOT the cheapest-LEAD selector used at quote). This is the dual variant of quote_total.
      faces = BookingFace where event_id == E.id AND status == CONFIRMED
      per_face_subtotal = 0
      for f in faces:
        base = 0
        if f.service_type in {HAIR, BOTH}:  base += C.pinned_hair_rate_cents
        if f.service_type in {MAKEUP, BOTH}: base += C.pinned_makeup_rate_cents
        if f.is_bride: base = round_half_up(base * BRIDE_SURCHARGE_MULT)
        per_face_subtotal += base
      travel_fee = round_half_up(C.pinned_travel_rate_per_km_cents * E.venue_distance_km)
      contracted_total_cents = per_face_subtotal + travel_fee
    input_set: "faces == CONFIRMED only; C = the just-created Contract with pinned rates of its lead_artist_id"
    constants:
      BRIDE_SURCHARGE_MULT: 1.5
    precision: "integer cents; round_half_up per bride-line and per travel-fee before summing"
    variants:
      - name: final_confirmed_only
        when: "at signing"
        difference: "excludes PENDING faces and uses pinned rates -> differs from estimated_total_cents for the same event"

  - name: deposit_split
    trigger: "contract signing (after contract_total)"
    algorithm: tiered_pricing
    formula: |
      # Deposit is a tiered percentage of contracted_total_cents keyed on the contracted tier.
      T = contracted_total_cents
      if   T <  TIER1_CEIL_CENTS:  pct = DEP_PCT_LOW      # T < 50000
      elif T <  TIER2_CEIL_CENTS:  pct = DEP_PCT_MID      # 50000 <= T < 200000
      else:                        pct = DEP_PCT_HIGH     # T >= 200000
      deposit_due_cents = round_half_up(T * pct)
    input_set: "single Contract.contracted_total_cents"
    constants:
      TIER1_CEIL_CENTS: 50000
      TIER2_CEIL_CENTS: 200000
      DEP_PCT_LOW: 0.25
      DEP_PCT_MID: 0.30
      DEP_PCT_HIGH: 0.40
    precision: "integer cents, round_half_up; boundary is half-open [lo, hi): T == 50000 falls in MID tier, T == 200000 falls in HIGH tier"

  - name: addon_pricing
    trigger: "POST /assignments/{id}/addons (AddOn created APPLIED)"
    algorithm: threshold
    formula: |
      A = ServiceAssignment.artist
      if addon.addon_type == TOUCH_UP:
        # touch-up billed at HALF the makeup per-face rate, per touch-up face
        amount_cents = round_half_up(A.makeup_rate_per_face_cents * TOUCH_UP_FACTOR) * addon.quantity
      else:  # EXTENDED_STAY
        # each extra 30-min block billed at a flat overtime rate
        amount_cents = EXTENDED_STAY_BLOCK_CENTS * addon.quantity
        # side-effect: extend the assignment window
        assignment.extended_until_utc = window_end_utc + (addon.quantity * 30 minutes)
    input_set: "single AddOn + its assignment's artist"
    constants:
      TOUCH_UP_FACTOR: 0.5
      EXTENDED_STAY_BLOCK_CENTS: 8000
    precision: "integer cents; round_half_up on the per-touch-up unit BEFORE multiplying by quantity (per-unit rounding order pinned)"

  - name: balance_reconcile
    trigger: "every Payment (SUCCEEDED), AddOn create/reverse, assignment cancel, event cancel"
    algorithm: aggregation
    formula: |
      addons_applied = sum(AddOn.amount_cents where assignment.event_id == E.id AND status == APPLIED)
      paid = sum(Payment.amount_cents where invoice_id == I.id AND outcome == SUCCEEDED)
      gross_due = Contract.contracted_total_cents + addons_applied
      balance_amount_cents = max(0, gross_due - paid - relief_written_off)
      amount_paid_cents = paid
    input_set: "SUCCEEDED payments + APPLIED add-ons on the event; relief from any cancellation"
    constants: {}
    precision: "integer cents; max(0, ...) floor — balance never negative"
    variants:
      - name: with_addons_vs_baseline
        when: "after at least one APPLIED add-on"
        difference: "balance recompute that includes add-ons diverges from the bare contracted baseline"

  - name: cancellation_settlement
    trigger: "BridalEvent {CONTRACTED, SCHEDULED} -> CANCELLED (POST /events/{id}/cancel)"
    algorithm: threshold
    formula: |
      hours = (E.event_date_utc - clock_now) / 3600   # may be fractional
      if reason == WEATHER:
        tier = FULL_REFUND                              # weather is always fully forgiven
      elif hours >= FULL_REFUND_MIN_HOURS:              # >= 720h (30 days)
        tier = FULL_REFUND
      elif hours >= DEPOSIT_FORFEIT_MIN_HOURS:          # >= 72h (3 days), < 720h
        tier = DEPOSIT_FORFEIT
      else:                                             # < 72h
        tier = FULL_FORFEIT
      # money movement:
      if tier == FULL_REFUND:
        deposit_refund_cents = Invoice.deposit_amount_cents if deposit_status==PAID else 0
        balance_relief_cents = Invoice.balance_amount_cents   # whole outstanding balance forgiven
      elif tier == DEPOSIT_FORFEIT:
        deposit_refund_cents = 0
        balance_relief_cents = Invoice.balance_amount_cents   # balance forgiven, deposit kept
      else:  # FULL_FORFEIT
        deposit_refund_cents = 0
        balance_relief_cents = Invoice.balance_amount_cents   # balance written off but deposit kept AND
        # any UNPAID balance still owed is also forfeited to platform as liquidated damages (no further refund)
    input_set: "single event + its invoice; clock_now from logical clock"
    constants:
      FULL_REFUND_MIN_HOURS: 720
      DEPOSIT_FORFEIT_MIN_HOURS: 72
    precision: "hours computed as float; boundary inclusive on the lower bound (>=). Exactly 720h -> FULL_REFUND; exactly 72h -> DEPOSIT_FORFEIT"
    variants:
      - name: weather_override
        when: "reason == WEATHER"
        difference: "ignores the hours threshold entirely and always grants FULL_REFUND — diverges from CLIENT_CHOICE at identical hours"

  - name: throughput_required_hours
    trigger: "POST /assignments (validation P34) and scheduling"
    algorithm: aggregation
    formula: |
      confirmed = count(BookingFace where event_id==E.id AND status==CONFIRMED)
      # combined capacity of lead + optional assistant over the window
      lead_cap = A_lead.max_faces_per_hour
      asst_cap = A_assistant.max_faces_per_hour if assistant present else 0
      window_hours = (window_end_utc - window_start_utc) / 3600
      capacity = floor((lead_cap + asst_cap) * window_hours)
      required_ok = capacity >= confirmed
    input_set: "CONFIRMED faces + assignment window + lead/assistant throughput"
    constants: {}
    precision: "floor on capacity (partial hour does not yield a partial face). Boundary: capacity == confirmed PASSES (>=); capacity == confirmed - 1 FAILS"

# =====================================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority)
# =====================================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path/body referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "acting Client.id == owning event.client_id for client-scoped writes (ownership)"
    error_id: ERR_NOT_EVENT_OWNER
    http_status: 403
    applies_to: "POST /events/{id}/request-revision, /cancel, /trials/{id}/cancel, POST /contracts, POST /invoices/{id}/payments"
  - priority: 5
    category: existence
    check: "OCC: expected_event_version matches BridalEvent.version (else stale)"
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
    applies_to: "POST /assignments, POST /contracts"
  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: business_referential
    check: "if event.trial_required, a COMPLETED TrialSession for the event must exist before contracting"
    error_id: ERR_TRIAL_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /contracts"
  - priority: 8
    category: business_constraint
    check: "lead_artist_id (and assistant) refer to Artist with status == ACTIVE"
    error_id: ERR_ARTIST_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /contracts, POST /assignments"
  - priority: 9
    category: business_constraint
    check: "assistant_artist_id (when present) is an Artist with can_assist == true and != artist_id"
    error_id: ERR_INVALID_ASSISTANT
    http_status: 409
    applies_to: "POST /assignments"
  - priority: 10
    category: business_temporal
    check: "TrialSession window [start_utc, end_utc) does not overlap another non-terminal trial for the same artist (closed-open, adjacency allowed)"
    error_id: ERR_TRIAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /trials"
  - priority: 11
    category: business_temporal
    check: "ServiceAssignment window for an artist (as lead OR assistant) must keep a 60-minute TRAVEL_BUFFER gap from that artist's other non-cancelled (status != CANCELLED) assignment windows; the new window [start, end) expanded by 60 min on each side must not overlap an existing window. Existing window [s,e) blocks any new window whose [start-60min, end+60min) intersects [s,e). Adjacency exactly at the 60-min gap is allowed (closed-open)."
    error_id: ERR_ASSIGNMENT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /assignments"
  - priority: 12
    category: business_temporal
    check: "assignment window_end_utc <= owning event.ready_by_utc (faces must finish by the timeline deadline)"
    error_id: ERR_WINDOW_PAST_DEADLINE
    http_status: 422
    applies_to: "POST /assignments"
  - priority: 13
    category: business_constraint
    check: "throughput: floor((lead_cap + asst_cap) * window_hours) >= CONFIRMED face count (calc throughput_required_hours)"
    error_id: ERR_INSUFFICIENT_THROUGHPUT
    http_status: 422
    applies_to: "POST /assignments"
  - priority: 14
    category: business_fiscal
    check: "deposit payment amount_cents exactly settles remaining deposit (== deposit_amount_cents - paid_deposit); over/under rejected"
    error_id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /invoices/{id}/payments (applies_to=DEPOSIT)"
  - priority: 15
    category: business_fiscal
    check: "balance payment may not exceed current balance_amount_cents (overpayment rejected)"
    error_id: ERR_BALANCE_OVERPAY
    http_status: 422
    applies_to: "POST /invoices/{id}/payments (applies_to=BALANCE)"
  - priority: 16
    category: business_fiscal
    check: "balance payment rejected while deposit_status != PAID (deposit must settle first)"
    error_id: ERR_DEPOSIT_NOT_SETTLED
    http_status: 409
    applies_to: "POST /invoices/{id}/payments (applies_to=BALANCE)"
  - priority: 17
    category: business_constraint
    check: "EXTENDED_STAY add-on cannot push extended_until_utc past event.ready_by_utc"
    error_id: ERR_EXTENSION_PAST_DEADLINE
    http_status: 422
    applies_to: "POST /assignments/{id}/addons"
  - priority: 18
    category: business_constraint
    check: "request body required fields present and typed; enums in declared set; integers >= declared minimum"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =====================================================================================
# §1.5 API ENDPOINT TABLE
# =====================================================================================
endpoints:
  # ---- Artist roster & portfolio ----
  - method: POST
    path: "/bridal-beauty/artists"
    description: "register a roster artist"
    roles: [Coordinator]
    code: 201
    input: [display_name, skill_tier, hair_rate_per_face_cents, makeup_rate_per_face_cents, travel_rate_per_km_cents, max_faces_per_hour, "can_assist?"]
    output: Artist
    side_effects: ["Artist created in ACTIVE"]
  - method: GET
    path: "/bridal-beauty/artists/{id}"
    description: "fetch an artist"
    roles: [Coordinator, Artist, Client]
    code: 200
    input: []
    output: Artist
    side_effects: []
  - method: GET
    path: "/bridal-beauty/artists"
    description: "list artists (paginated; filter by status/skill_tier)"
    roles: [Coordinator, Artist, Client]
    code: 200
    input: ["status?", "skill_tier?", "limit?", "offset?"]
    output: Artist[]
    side_effects: []
  - method: PATCH
    path: "/bridal-beauty/artists/{id}"
    description: "edit artist rates or status (rate edits do NOT touch pinned contract rates)"
    roles: [Coordinator]
    code: 200
    input: ["hair_rate_per_face_cents?", "makeup_rate_per_face_cents?", "travel_rate_per_km_cents?", "max_faces_per_hour?", "status?", "can_assist?", expected_artist_version]
    output: Artist
    side_effects: ["increments Artist.version by 1"]
  - method: POST
    path: "/bridal-beauty/artists/{id}/portfolio"
    description: "add a portfolio item (DRAFT)"
    roles: [Coordinator, Artist]
    code: 201
    input: [look_name, category]
    output: PortfolioItem
    side_effects: ["PortfolioItem created in DRAFT"]
  - method: POST
    path: "/bridal-beauty/portfolio/{id}/publish"
    description: "publish a portfolio item; sets artist.portfolio_published computed flag"
    roles: [Coordinator, Artist]
    code: 200
    input: []
    output: PortfolioItem
    side_effects: ["PortfolioItem -> PUBLISHED", "recompute Artist.portfolio_published"]
  - method: GET
    path: "/bridal-beauty/artists/{id}/portfolio"
    description: "list an artist's portfolio items (reverse-reachability for PortfolioItem.artist_id)"
    roles: [Coordinator, Artist, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PortfolioItem[]
    side_effects: []

  # ---- Bridal events & faces ----
  - method: POST
    path: "/bridal-beauty/events"
    description: "create a bridal event (DRAFT)"
    roles: [Client, Coordinator]
    code: 201
    input: [client_id, event_date_utc, ready_by_utc, venue_distance_km, "trial_required?"]
    output: BridalEvent
    side_effects: ["BridalEvent created in DRAFT, estimated_total_cents=0, quote_revision=0"]
  - method: GET
    path: "/bridal-beauty/events/{id}"
    description: "fetch an event with computed totals"
    roles: [Client, Coordinator, Artist]
    code: 200
    input: []
    output: BridalEvent
    side_effects: []
  - method: GET
    path: "/bridal-beauty/events"
    description: "list events (paginated; filter by status/client_id)"
    roles: [Coordinator, Client]
    code: 200
    input: ["status?", "client_id?", "limit?", "offset?"]
    output: BridalEvent[]
    side_effects: []
  - method: POST
    path: "/bridal-beauty/events/{id}/faces"
    description: "add a booking face to an event"
    roles: [Client, Coordinator]
    code: 201
    input: [person_label, service_type, "is_bride?"]
    output: BookingFace
    side_effects: ["BookingFace created PENDING", "recompute event.party_size"]
  - method: POST
    path: "/bridal-beauty/faces/{id}/confirm"
    description: "confirm a pending face"
    roles: [Client, Coordinator]
    code: 200
    input: []
    output: BookingFace
    side_effects: ["BookingFace PENDING -> CONFIRMED"]
  - method: POST
    path: "/bridal-beauty/faces/{id}/remove"
    description: "remove a face from the event"
    roles: [Client, Coordinator]
    code: 200
    input: []
    output: BookingFace
    side_effects: ["BookingFace -> REMOVED", "recompute event.party_size"]
  - method: GET
    path: "/bridal-beauty/events/{id}/faces"
    description: "list faces of an event (reverse-reachability for BookingFace.event_id)"
    roles: [Client, Coordinator, Artist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BookingFace[]
    side_effects: []
  - method: POST
    path: "/bridal-beauty/events/{id}/quote"
    description: "issue/re-issue a quote (DRAFT->QUOTED or REVISION_REQUESTED->QUOTED)"
    roles: [Coordinator]
    code: 200
    input: []
    output: BridalEvent
    side_effects: ["run quote_total", "increment quote_revision", "set estimated_total_cents", "recompute party_size"]
  - method: POST
    path: "/bridal-beauty/events/{id}/request-revision"
    description: "client requests a quote revision (QUOTED->REVISION_REQUESTED)"
    roles: [Client]
    code: 200
    input: []
    output: BridalEvent
    side_effects: ["clear estimated_total_cents to 0"]
  - method: POST
    path: "/bridal-beauty/events/{id}/complete"
    description: "complete the event (SCHEDULED->COMPLETED)"
    roles: [Coordinator]
    code: 200
    input: []
    output: BridalEvent
    side_effects: ["all CONFIRMED faces -> SERVICED"]
  - method: POST
    path: "/bridal-beauty/events/{id}/cancel"
    description: "cancel the event; runs cancellation_settlement cascade if contracted"
    roles: [Client]
    code: 200
    input: [reason]
    output: CancellationRecord
    side_effects: ["CancellationRecord created", "cascade: invoice settlement, assignment release, face removal, contract void"]
  - method: GET
    path: "/bridal-beauty/events/{id}/cancellation"
    description: "list the cancellation record(s) of an event (reverse-reachability for CancellationRecord.event_id)"
    roles: [Client, Coordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: CancellationRecord[]
    side_effects: []

  # ---- Trials ----
  - method: POST
    path: "/bridal-beauty/trials"
    description: "book a trial session (BOOKED)"
    roles: [Coordinator, Client]
    code: 201
    input: [event_id, artist_id, start_utc, end_utc, trial_fee_cents]
    output: TrialSession
    side_effects: ["TrialSession created BOOKED after window-conflict check"]
  - method: GET
    path: "/bridal-beauty/trials/{id}"
    description: "fetch a trial"
    roles: [Coordinator, Client, Artist]
    code: 200
    input: []
    output: TrialSession
    side_effects: []
  - method: GET
    path: "/bridal-beauty/trials"
    description: "list trials (filter by event_id or artist_id)"
    roles: [Coordinator, Client, Artist]
    code: 200
    input: ["event_id?", "artist_id?", "status?", "limit?", "offset?"]
    output: TrialSession[]
    side_effects: []
  - method: POST
    path: "/bridal-beauty/trials/{id}/complete"
    description: "mark trial completed (BOOKED->COMPLETED)"
    roles: [Artist]
    code: 200
    input: []
    output: TrialSession
    side_effects: ["TrialSession -> COMPLETED"]
  - method: POST
    path: "/bridal-beauty/trials/{id}/no-show"
    description: "mark trial no-show (BOOKED->NO_SHOW)"
    roles: [Coordinator]
    code: 200
    input: []
    output: TrialSession
    side_effects: ["TrialSession -> NO_SHOW"]
  - method: POST
    path: "/bridal-beauty/trials/{id}/cancel"
    description: "cancel a trial (BOOKED->CANCELLED)"
    roles: [Client]
    code: 200
    input: []
    output: TrialSession
    side_effects: ["TrialSession -> CANCELLED; window released"]

  # ---- Contracts ----
  - method: POST
    path: "/bridal-beauty/contracts"
    description: "sign a contract for a QUOTED event; pins lead artist rates and opens invoice"
    roles: [Client]
    code: 201
    input: [event_id, lead_artist_id, expected_event_version]
    output: Contract
    side_effects: ["pin rates", "run contract_total + deposit_split", "event QUOTED->CONTRACTED", "open Invoice", "increments BridalEvent.version by 1"]
  - method: GET
    path: "/bridal-beauty/contracts/{id}"
    description: "fetch a contract"
    roles: [Client, Coordinator]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/bridal-beauty/contracts"
    description: "list contracts (filter by event_id or lead_artist_id) — reverse-reachability for Contract.event_id and Contract.lead_artist_id"
    roles: [Client, Coordinator]
    code: 200
    input: ["event_id?", "lead_artist_id?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  # ---- Assignments & add-ons ----
  - method: POST
    path: "/bridal-beauty/assignments"
    description: "schedule an on-location service window (CONTRACTED->SCHEDULED); OCC on event.version"
    roles: [Coordinator]
    code: 201
    input: [event_id, artist_id, "assistant_artist_id?", window_start_utc, window_end_utc, expected_event_version]
    output: ServiceAssignment
    side_effects: ["ServiceAssignment created SCHEDULED", "set faces_committed", "event CONTRACTED->SCHEDULED", "increments BridalEvent.version by 1"]
  - method: GET
    path: "/bridal-beauty/assignments/{id}"
    description: "fetch an assignment"
    roles: [Coordinator, Artist, Client]
    code: 200
    input: []
    output: ServiceAssignment
    side_effects: []
  - method: GET
    path: "/bridal-beauty/assignments"
    description: "list assignments (filter by event_id or artist_id or assistant_artist_id) — reverse-reachability for ServiceAssignment FKs"
    roles: [Coordinator, Artist, Client]
    code: 200
    input: ["event_id?", "artist_id?", "assistant_artist_id?", "status?", "limit?", "offset?"]
    output: ServiceAssignment[]
    side_effects: []
  - method: POST
    path: "/bridal-beauty/assignments/{id}/start"
    description: "start the on-location window (SCHEDULED->IN_PROGRESS)"
    roles: [Artist]
    code: 200
    input: []
    output: ServiceAssignment
    side_effects: ["ServiceAssignment -> IN_PROGRESS"]
  - method: POST
    path: "/bridal-beauty/assignments/{id}/complete"
    description: "complete the window (IN_PROGRESS->COMPLETED); may make balance DUE"
    roles: [Artist]
    code: 200
    input: []
    output: ServiceAssignment
    side_effects: ["ServiceAssignment -> COMPLETED", "if deposit PAID and balance NOT_DUE -> balance_status DUE"]
  - method: POST
    path: "/bridal-beauty/assignments/{id}/cancel"
    description: "cancel the window; reverses add-ons and reconciles balance"
    roles: [Coordinator]
    code: 200
    input: []
    output: ServiceAssignment
    side_effects: ["ServiceAssignment -> CANCELLED", "APPLIED AddOn -> REVERSED", "run balance_reconcile"]
  - method: POST
    path: "/bridal-beauty/assignments/{id}/addons"
    description: "apply a touch-up or extended-stay add-on; bills and reconciles balance"
    roles: [Coordinator, Artist]
    code: 201
    input: [addon_type, quantity]
    output: AddOn
    side_effects: ["AddOn created APPLIED", "run addon_pricing", "EXTENDED_STAY sets extended_until_utc", "run balance_reconcile"]
  - method: GET
    path: "/bridal-beauty/assignments/{id}/addons"
    description: "list add-ons of an assignment (reverse-reachability for AddOn.assignment_id)"
    roles: [Coordinator, Artist, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  # ---- Invoices & payments ----
  - method: GET
    path: "/bridal-beauty/invoices/{id}"
    description: "fetch an invoice with both status axes and reconciled balance"
    roles: [Client, Coordinator]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/bridal-beauty/invoices"
    description: "list invoices (filter by event_id or contract_id) — reverse-reachability for Invoice.event_id and Invoice.contract_id"
    roles: [Client, Coordinator]
    code: 200
    input: ["event_id?", "contract_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/bridal-beauty/invoices/{id}/payments"
    description: "record a payment against deposit or balance; reconciles invoice axes"
    roles: [Client]
    code: 201
    input: [applies_to, amount_cents]
    output: Payment
    side_effects: ["Payment created SUCCEEDED", "run balance_reconcile", "advance deposit_status/balance_status"]
  - method: GET
    path: "/bridal-beauty/invoices/{id}/payments"
    description: "list payments of an invoice (reverse-reachability for Payment.invoice_id)"
    roles: [Client, Coordinator]
    code: 200
    input: ["applies_to?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/bridal-beauty/_clock/set_current_utc"
    description: "set the server logical clock. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Coordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced to to_iso8601"]

# =====================================================================================
# §1.6 ERROR CODE CATALOG
# =====================================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/malformed X-User-Role or X-User-ID header"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "referenced resource does not exist"
  - id: ERR_NOT_EVENT_OWNER
    http: 403
    condition: "acting Client is not the owner (client_id) of the event"
  - id: ERR_STALE_EVENT_VERSION
    http: 412
    condition: "expected_event_version does not match BridalEvent.version (OCC)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_TRIAL_NOT_COMPLETED
    http: 409
    condition: "trial_required event has no COMPLETED TrialSession at contracting"
  - id: ERR_ARTIST_NOT_ACTIVE
    http: 409
    condition: "lead or assistant artist is not ACTIVE"
  - id: ERR_INVALID_ASSISTANT
    http: 409
    condition: "assistant artist has can_assist=false or equals the lead artist"
  - id: ERR_TRIAL_WINDOW_CONFLICT
    http: 409
    condition: "trial window overlaps another non-terminal trial of the same artist (closed-open)"
  - id: ERR_ASSIGNMENT_WINDOW_CONFLICT
    http: 409
    condition: "assignment window (incl. travel buffer) overlaps another non-cancelled window for the same artist as lead or assistant"
  - id: ERR_WINDOW_PAST_DEADLINE
    http: 422
    condition: "assignment window_end_utc later than event.ready_by_utc"
  - id: ERR_INSUFFICIENT_THROUGHPUT
    http: 422
    condition: "lead+assistant throughput cannot service CONFIRMED faces within window"
  - id: ERR_DEPOSIT_AMOUNT_MISMATCH
    http: 422
    condition: "deposit payment does not exactly settle the remaining deposit"
  - id: ERR_BALANCE_OVERPAY
    http: 422
    condition: "balance payment exceeds current balance_amount_cents"
  - id: ERR_DEPOSIT_NOT_SETTLED
    http: 409
    condition: "balance payment attempted while deposit_status != PAID"
  - id: ERR_EXTENSION_PAST_DEADLINE
    http: 422
    condition: "extended-stay add-on would push extended_until_utc past event.ready_by_utc"
  - id: ERR_NO_LEAD_ARTIST
    http: 409
    condition: "quote requested but no ACTIVE LEAD artist exists on the roster"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing/invalid required field, bad enum, or below-minimum integer"

# =====================================================================================
# §1.7 RBAC MATRIX
# =====================================================================================
roles:
  - name: Coordinator
    description: "platform operator: owns roster, scheduling, quoting, invoicing visibility, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /artists (register)"
      - "PATCH /artists/{id}"
      - "POST /events/{id}/quote"
      - "POST /events/{id}/complete"
      - "POST /assignments (schedule)"
      - "POST /assignments/{id}/cancel"
      - "POST /trials/{id}/no-show"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /artists/{id}/portfolio, POST /portfolio/{id}/publish (with Artist)"
      - "POST /events, POST /events/{id}/faces, /confirm, /remove (with Client)"
      - "POST /trials (with Client)"
      - "POST /assignments/{id}/addons (with Artist)"
      - "GET reads across resources"
  - name: Artist
    description: "a roster artist acting on their own trials, assignments, and portfolio"
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /trials/{id}/complete"
      - "POST /assignments/{id}/start"
      - "POST /assignments/{id}/complete"
    shared_operations:
      - "POST /artists/{id}/portfolio, POST /portfolio/{id}/publish (with Coordinator)"
      - "POST /assignments/{id}/addons (with Coordinator)"
      - "GET reads on own artist/trials/assignments"
  - name: Client
    description: "the booking party lead who owns a BridalEvent, requests revisions, signs, and pays"
    identity: opaque
    exclusive_operations:
      - "POST /events/{id}/request-revision"
      - "POST /events/{id}/cancel"
      - "POST /contracts (sign)"
      - "POST /trials/{id}/cancel"
      - "POST /invoices/{id}/payments"
    shared_operations:
      - "POST /events, POST /events/{id}/faces, /confirm, /remove (with Coordinator)"
      - "POST /trials (with Coordinator)"
      - "GET reads on own events, contracts, invoices"
