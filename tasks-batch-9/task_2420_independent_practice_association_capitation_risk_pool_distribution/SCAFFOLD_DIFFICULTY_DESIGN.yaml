            - "StopLossRecovery.${rec_sl}.excess_cents == 1"
            - "StopLossRecovery.${rec_sl}.recovery_cents == 1 (round_half_up(1 * 9000 / 10000) == round_half_up(0.9))"
            - "StopLossRecovery.${rec_sl}.status == \"DRAFT\""

      - name: enrollment_file_row_count_boundary_at_zero_then_one
        metric: "EnrollmentFile.row_count and EnrollmentFile.matched_row_count against the minimum of 1"
        endpoint: "POST /ipa/enrollment-files/{id}/state"
        grounds:
          - validations.priority_22_ERR_ENROLLMENT_FILE_EMPTY
          - calculations.enrollment_row_matching
          - calculations.file_claimed_capitation
          - state_machines.EnrollmentFile.RECEIVED_to_PARSED
          - state_machines.EnrollmentFile.PARSED_to_RECONCILED
        distinguishing_aspect: |
          A third, independent boundary: two different counters on the same
          entity (row_count for PARSED, matched_row_count for RECONCILED) each
          walked from 0 to 1 through POST /ipa/enrollment-files/{id}/state.
          The interesting part is that row_count 1 is enough to PARSE but a
          single UNMATCHED row leaves matched_row_count at 0, so the very next
          transition fails on the OTHER counter with the same error id.
        test_recipe:
          setup:
            - "Agreement AGR_EF is ACTIVE with one ACTIVE PRIMARY_CARE physician (npi 1500000001) and one enrollee with external_member_id EF-0001."
            - "An EnrollmentFile for coverage_month 2026-07 exists in status RECEIVED with zero rows."
            - "Logical clock is 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
