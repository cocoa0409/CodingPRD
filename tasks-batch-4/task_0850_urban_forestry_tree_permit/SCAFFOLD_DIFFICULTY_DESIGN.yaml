  # =========================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: protected_dbh_threshold_inclusive_at_eight
        grounds:
          - entities.Tree.fields.is_protected
          - endpoints
        distinguishing_aspect: "Numeric threshold on dbh_inches at the create endpoint: dbh=8.0 -> is_protected true; dbh=7.5 -> is_protected false (inclusive lower boundary at exactly 8.0)."
        test_recipe:
          setup:
            - "Zone Z1 and non-protected Species Oak."
            - "Two trees created: one dbh=8.0, one dbh=7.5."
          setup_api_calls:
            - call: "POST /forestry/zones"
              payload: { name: "Z1", target_canopy_pct: 30.0, area_sqm: 100 }
              as: ForestryAdmin
              captures: { z1: $.data.id }
            - call: "POST /forestry/species"
              payload: { name: "Oak", is_protected_species: false, is_native: true, mature_canopy_sqm: 50.0, base_replacement_value_dollars: 187.50, base_appraisal_value_per_sqin: 27.00, min_spacing_m: 5.0 }
              as: ForestryAdmin
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 8.0, canopy_radius_m: 4.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t_at: $.data.id, prot_at: $.data.is_protected }
            - call: "POST /forestry/trees"
              payload: { zone_id: "${z1}", species_id: "${s1}", dbh_inches: 7.5, canopy_radius_m: 4.0, latitude: 40.0, longitude: -83.0, condition_class: "GOOD" }
              as: ForestryStaff
              captures: { t_below: $.data.id, prot_below: $.data.is_protected }
          assert:
            - "Tree.${t_at}.is_protected == true"
            - "Tree.${t_below}.is_protected == false"

      - name: zero_replacement_count_for_small_protected_species
        grounds:
          - calculations.required_replacement_count
          - calculations.mitigation_fee
          - entities.Permit.fields.required_replacement_count
        distinguishing_aspect: "Zero-count edge on a DIFFERENT metric/endpoint (permit review): a species-protected tree with dbh=6.0 (< tier-1 8.0) yields required_replacement_count==0 and mitigation_fee_cents==0 despite being a valid REMOVAL permit."
        test_recipe:
          setup:
            - "Zone Z1, protected Species Heritage (is_protected_species=true, base_replacement_value_dollars=100.00), Tree T6 dbh=6.0 GOOD -> is_protected true via species."
