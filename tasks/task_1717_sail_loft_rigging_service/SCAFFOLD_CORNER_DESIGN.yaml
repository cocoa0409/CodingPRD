        claim_type: rbac_denial
        grounds: [roles.Sailmaker.exclusive_operations, errors.ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Rigger role attempting the Sailmaker-exclusive POST /sail-designs → ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["C41/B41 with MS41 FROZEN"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C41", email: "c41@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c41_id: $.data.id }
            - call: "POST /lofts/customers/${c41_id}/boats"
              payload: { boat_name: "B41", hull_length_m: 9.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b41_id: $.data.id, b41_v: $.data.version }
            - call: "POST /lofts/boats/${b41_id}/measurement-sheets"
              payload: { i_height_m: 10.0, j_base_m: 3.0, p_main_m: 12.0, e_main_m: 4.0 }
              as: Measurer
              captures: { ms41_id: $.data.id }
            - call: "POST /lofts/boats/${b41_id}/measurement-sheets/${ms41_id}/freeze"
              payload: {}
              as: Measurer
            - call: "GET /lofts/boats/${b41_id}"
              payload: {}
              as: Rigger
              captures: { b41_v2: $.data.version }
          trigger:
            - call: "POST /lofts/boats/${b41_id}/sail-designs"
              payload: { measurement_sheet_id: "${ms41_id}", cloth_tier: "CRUISE", reinforcement_level: 1, option_codes: [], expected_boat_version: "${b41_v2}" }
              as: Rigger
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE"

      - name: customer_cannot_approve_another_customers_design
        claim_type: rbac_denial
        grounds: [roles.Customer.identity, state_machines.SailDesign.SUBMITTED_to_APPROVED]
        distinguishing_aspect: "Customer identity is entity_backed — X-User-ID must equal boat.customer_id; a different customer's id → ERR_FORBIDDEN_ROLE (or NOT_FOUND scoping)."
        test_recipe:
          setup: ["C42a owns B42 with D42 SUBMITTED; C42b is a different customer"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C42a", email: "c42a@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c42a_id: $.data.id }
            - call: "POST /lofts/customers"
              payload: { full_name: "C42b", email: "c42b@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c42b_id: $.data.id }
            - call: "POST /lofts/customers/${c42a_id}/boats"
              payload: { boat_name: "B42", hull_length_m: 9.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b42_id: $.data.id }
            - call: "POST /lofts/boats/${b42_id}/measurement-sheets"
              payload: { i_height_m: 10.0, j_base_m: 3.0, p_main_m: 12.0, e_main_m: 4.0 }
              as: Measurer
              captures: { ms42_id: $.data.id }
            - call: "POST /lofts/boats/${b42_id}/measurement-sheets/${ms42_id}/freeze"
              payload: {}
              as: Measurer
            - call: "GET /lofts/boats/${b42_id}"
              payload: {}
              as: Sailmaker
              captures: { b42_v: $.data.version }
            - call: "POST /lofts/boats/${b42_id}/sail-designs"
              payload: { measurement_sheet_id: "${ms42_id}", cloth_tier: "CRUISE", reinforcement_level: 1, option_codes: [], expected_boat_version: "${b42_v}" }
              as: Sailmaker
              captures: { d42_id: $.data.id }
            - call: "POST /lofts/boats/${b42_id}/sail-designs/${d42_id}/submit"
              payload: {}
              as: Sailmaker
          trigger:
            - call: "POST /lofts/boats/${b42_id}/sail-designs/${d42_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${c42b_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id in {ERR_FORBIDDEN_ROLE, ERR_RESOURCE_NOT_FOUND} (non-owner cannot act on another customer's design)"
            - "SailDesign.${d42_id}.design_status == SUBMITTED (unchanged)"

  # ===========================================================================
  # Section: cross-cutting — OCC, cascading, threshold layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: boat_version_increments_on_design_revision_create
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.design-revision-stale-boat, entities.Boat]
        distinguishing_aspect: "Successful design-revision create increments Boat.version by exactly 1, giving the OCC check something to observe."
        test_recipe:
          setup: ["C43/B43 with MS43 FROZEN; no designs yet"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C43", email: "c43@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c43_id: $.data.id }
            - call: "POST /lofts/customers/${c43_id}/boats"
              payload: { boat_name: "B43", hull_length_m: 9.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z" }
              as: LoftManager
              captures: { b43_id: $.data.id }
            - call: "POST /lofts/boats/${b43_id}/measurement-sheets"
              payload: { i_height_m: 10.0, j_base_m: 3.0, p_main_m: 12.0, e_main_m: 4.0 }
              as: Measurer
              captures: { ms43_id: $.data.id }
            - call: "POST /lofts/boats/${b43_id}/measurement-sheets/${ms43_id}/freeze"
              payload: {}
              as: Measurer
            - call: "GET /lofts/boats/${b43_id}"
              payload: {}
              as: Sailmaker
              captures: { b43_v: $.data.version }
          trigger:
            - call: "POST /lofts/boats/${b43_id}/sail-designs"
              payload: { measurement_sheet_id: "${ms43_id}", cloth_tier: "CRUISE", reinforcement_level: 1, option_codes: [], expected_boat_version: "${b43_v}" }
              as: Sailmaker
            - call: "GET /lofts/boats/${b43_id}"
              payload: {}
              as: Sailmaker
              captures: { b43_v_after: $.data.version }
          assert:
            - "Boat.${b43_id}.version_after - version_before == 1"

      - name: mast_event_hold_releases_to_booked_when_fail_closed_by_pass
        claim_type: cascading_side_effects
        grounds: [state_machines.MastServiceEvent.RIGGING_HOLD_to_BOOKED, state_machines.RiggingInspection.REPORTED_to_CLOSED]
        distinguishing_aspect: "Closing the FAIL inspection via a passing replacement returns held mast events from RIGGING_HOLD to BOOKED (reverse cascade)."
        test_recipe:
          setup: ["C44/B44; ME44 RIGGING_HOLD; RI44 FAIL REPORTED; RI44b PASS REPORTED (the replacement)"]
          setup_api_calls:
            - call: "POST /lofts/customers"
              payload: { full_name: "C44", email: "c44@x.com", credit_limit_cents: 900000000 }
              as: LoftManager
              captures: { c44_id: $.data.id }
            - call: "POST /lofts/customers/${c44_id}/boats"
              payload: { boat_name: "B44", hull_length_m: 10.0, racing_class: "NONE", standing_rigging_install_date: "2024-01-01T00:00:00Z", running_rigging_hours_accumulated: 0 }
              as: LoftManager
              captures: { b44_id: $.data.id }
            - call: "POST /lofts/boats/${b44_id}/mast-service-events"
              payload: { service_kind: "UNSTEP", slot_start_utc: "2026-09-20T08:00:00Z", slot_end_utc: "2026-09-20T12:00:00Z" }
              as: Rigger
              captures: { me44_id: $.data.id }
            - call: "GET /lofts/boats/${b44_id}"
              payload: {}
              as: Rigger
              captures: { b44_v: $.data.version }
            - call: "POST /lofts/boats/${b44_id}/rigging-inspections"
              payload: { rigging_scope: "STANDING", expected_boat_version: "${b44_v}" }
              as: Rigger
              captures: { ri44_id: $.data.id }
            - call: "POST /lofts/boats/${b44_id}/rigging-inspections/${ri44_id}/report"
              payload: { verdict: "FAIL" }
              as: Rigger
            - call: "GET /lofts/boats/${b44_id}"
              payload: {}
              as: Rigger
              captures: { b44_v2: $.data.version }
            - call: "POST /lofts/boats/${b44_id}/rigging-inspections"
              payload: { rigging_scope: "STANDING", expected_boat_version: "${b44_v2}" }
              as: Rigger
              captures: { ri44b_id: $.data.id }
            - call: "POST /lofts/boats/${b44_id}/rigging-inspections/${ri44b_id}/report"
              payload: { verdict: "PASS" }
              as: Rigger
          trigger:
            - call: "POST /lofts/boats/${b44_id}/rigging-inspections/${ri44_id}/close"
              payload: {}
              as: Rigger
          assert:
            - "RiggingInspection.${ri44_id}.inspection_status == CLOSED (passing replacement exists)"
            - "MastServiceEvent.${me44_id}.event_status == BOOKED (hold released)"
            - "Boat.${b44_id}.status == ACTIVE"

