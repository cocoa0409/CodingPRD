            - "third sweep at 2027-08-01T00:00:00Z: ${expired_count_1} == 1 and expiring_soon_count == 0"
            - "CatalogEntry.${entry_id}.status == EXPIRED (expires_at <= clock, half-open upper bound)"
            - "Application.${app_id}.catalog_visibility == HIDDEN"

      - name: sweep_marks_the_notification_overdue_and_freezes_the_vendor
        claim_type: Bulk action
        grounds:
          - endpoints[POST /compliance-sweeps]
          - state_machines.VendorIncident.PENDING_to_OVERDUE
          - calculations.incident_notification_due_at
          - calculations.vendor_privacy_posture
        distinguishing_aspect: |
          The sweep's second job is the notification clock: a PENDING notification whose
          due instant has passed becomes OVERDUE and drags the vendor's posture to FROZEN
          on the SAME sweep, in the mandated order (notification first, then vendor
          recompute). An implementation that recomputes the posture before flipping the
          notification leaves the vendor on RESTRICTED.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Vendor V with breach_notification_hours 48."
            - "Incident I: detected_at 2026-07-31T00:00:00Z, 50 affected students, max_data_tier 2 -> MODERATE, effective_hours = min(48, 72) = 48, so notification_due_at is 2026-08-02T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Lakeside Analytics", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /vendor-incidents"
              payload: { vendor_id: "${v_id}", incident_type: "BREACH", detected_at: "2026-07-31T00:00:00Z", affected_student_count: 50, max_data_tier: 2 }
              as: PrivacyOfficeAdmin
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /compliance-sweeps"
              payload: {}
              as: PrivacyOfficeAdmin
              captures: { overdue_count: $.data.overdue_notification_count }
          assert:
            - "after setup VendorIncident.${inc_id}.severity == MODERATE and notification_due_at == 2026-08-02T00:00:00.000Z and notification_status == PENDING"
            - "after setup Vendor.${v_id}.privacy_posture == RESTRICTED (a REPORTED incident, not yet overdue)"
            - "${overdue_count} == 1, evaluated_entry_count == 0, expiring_soon_count == 0, expired_count == 0, recomputed_vendor_count == 1"
            - "VendorIncident.${inc_id}.notification_status == OVERDUE and response_status == REPORTED (the two dimensions are independent)"
            - "Vendor.${v_id}.risk_score == 8.00 (MODERATE weight 8 at decay 1.0, age 4 days)"
            - "Vendor.${v_id}.privacy_posture == FROZEN (rule 1 fires on the OVERDUE notification)"

      - name: clock_endpoint_moves_time_without_touching_any_row
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - calculations.incident_notification_due_at
        distinguishing_aspect: |
          Setting the clock must echo the new instant and change NOTHING else: after
          jumping three days past notification_due_at the incident is still PENDING and
          the vendor is still RESTRICTED, and only the explicit sweep flips it. An
          implementation that runs the sweep implicitly on a clock change reports OVERDUE
          before any sweep is called.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Vendor V (breach_notification_hours 48) with incident I detected_at 2026-07-31T00:00:00Z, 50 students, tier 2 -> notification_due_at 2026-08-02T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficeAdmin
            - call: "POST /vendors"
              payload: { legal_name: "Lakeside Analytics", hq_country_code: "US", breach_notification_hours: 48, data_deletion_days: 30, signed_state_addendum: true, subprocessor_disclosure_complete: true }
              as: PrivacyOfficeAdmin
              captures: { v_id: $.data.id }
            - call: "POST /vendor-incidents"
              payload: { vendor_id: "${v_id}", incident_type: "BREACH", detected_at: "2026-07-31T00:00:00Z", affected_student_count: 50, max_data_tier: 2 }
              as: PrivacyOfficeAdmin
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PrivacyOfficeAdmin
              captures: { now: $.data.current_utc }
            - call: "GET /vendor-incidents/${inc_id}"
              as: PrivacyOfficeAdmin
          assert:
            - "clock call: status == 200 and ${now} == 2026-08-05T00:00:00.000Z"
            - "GET call: VendorIncident.${inc_id}.notification_status == PENDING (still not swept)"
            - "VendorIncident.${inc_id}.notification_due_at == 2026-08-02T00:00:00.000Z (never recomputed by a clock move)"
            - "Vendor.${v_id}.privacy_posture == RESTRICTED (no implicit sweep, so no FROZEN)"

      - name: computed_read_of_an_application_matches_its_accepted_commitments
        claim_type: Computed read
        grounds:
          - endpoints[GET /applications/{applicationId}]
          - calculations.exposed_sensitivity_points
          - calculations.application_max_permitted_tier
          - calculations.vendor_risk_score
        distinguishing_aspect: |
          A plain GET on the application must already carry the derived numbers: with
          STUDENT_ID (tier 2, 90 days, HARD_DELETE) = 2.50 and GEOLOCATION (tier 3, 365
          days, ANONYMIZE) = 6.00 * 1.25 * 1.15 = 8.625 -> 8.63, the read returns 11.13,
          max_permitted_tier 4 for ASSESSMENT and catalog_visibility HIDDEN, and the
