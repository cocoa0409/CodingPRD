  - section: endpoints
    instances:
      - name: program_patch_recomputes_the_effective_cap_and_bumps_the_version
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /programs/{program_id}]
          - calculations.program_pla_credit_capacity
          - entities.Program.fields.effective_pla_cap_credits
        distinguishing_aspect: |
          PATCHing total_credits_required from 120 to 80 flips which arm of
          min(pla_max_credits, floor(total * pct / 10000)) binds — the cap drops
          from 30 to 20 in the PATCH response itself — and each PATCH increments
          Program.version by exactly one while untouched fields keep their values.
        test_recipe:
          setup:
            - "Program BSCS created with total_credits_required 120, pla_max_credits 30, pla_max_pct_bp 2500 — cap 30 because floor(120*2500/10000) == 30 ties the explicit ceiling."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO", "MILITARY_TRAINING", "INDUSTRY_CREDENTIAL"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id", cap0: "$.data.effective_pla_cap_credits", v0: "$.data.version" }
          trigger:
            - call: "PATCH /programs/${prog_id}"
              payload: { total_credits_required: 80 }
              as: PlaCoordinator
              captures: { cap1: "$.data.effective_pla_cap_credits", v1: "$.data.version" }
            - call: "GET /programs/${prog_id}"
              as: Registrar
              captures: { cap_read: "$.data.effective_pla_cap_credits" }
          assert:
            - "the create response had effective_pla_cap_credits == 30 and version == 1"
            - "the PATCH response has total_credits_required == 80 and effective_pla_cap_credits == 20 — floor(80 * 2500 / 10000) now binds below pla_max_credits 30"
            - "the PATCH response has version == 2; residency_min_credits is still 30, pla_max_credits still 30 and allowed_source_types unchanged"
            - "GET /programs/${prog_id} returns the same effective_pla_cap_credits == 20 — the derived field is persisted, not per-response"
            - "a second PATCH {pla_max_credits: 12} returns effective_pla_cap_credits == 12 and version == 3"
            - "a PATCH with an empty body still returns 200 and does NOT change effective_pla_cap_credits"

