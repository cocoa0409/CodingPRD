        distinguishing_aspect: >-
          The DRAFT to SUBMITTED transition requires computed_at non-null, so submitting a freshly
          created report is refused with ERR_UDS_REPORT_NOT_COMPUTED / 409 rather than the generic
          ERR_INVALID_STATE_TRANSITION, and the report stays DRAFT with all aggregates null.
        test_recipe:
          setup:
