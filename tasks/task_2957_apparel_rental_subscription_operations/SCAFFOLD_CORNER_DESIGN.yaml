  - section: endpoints
    instances:
      - name: endpoint_style_preferences_patch_updates_only_the_supplied_keys
        claim_type: standard_crud
        grounds:
          - "endpoints.PATCH /members/{member_id}/style-preferences"
          - "entities.Member.fields.preferred_categories"
          - "entities.Member.fields.size_profile"
          - "endpoints.GET /members/{member_id}/personalization-summary"
        distinguishing_aspect: >-
          Both body fields are optional, so a PATCH that carries only size_profile must leave preferred_categories
          exactly as the previous PATCH left it rather than resetting it to the creation default []. The
          personalization summary reads the same two columns, so the second response proves the write landed on
          the Member row and is not merely echoed back.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "membership plan SIG4 exists"
            - "member Nora Ellery on SIG4 created with preferred_categories [GOWN, DRESS] and size_profile M"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership-plans"
              payload: { code: "SIG4", name: "Signature 4", item_slots: 3, monthly_fee_cents: 10000, monthly_swaps_allowed: 2, shipping_cadence_days: 7, waiver_monthly_fee_cents: 1800, waiver_coverage_cents: 10000 }
              as: PlatformAdmin
              captures: { plan_sig4_id: "$.data.id" }
            - call: "POST /members"
              payload: { membership_plan_id: "${plan_sig4_id}", email: "nora@example.com", full_name: "Nora Ellery", waiver_active: false, preferred_categories: ["GOWN", "DRESS"], size_profile: "M" }
              as: PlatformAdmin
              captures: { member_id: "$.data.id" }
          trigger:
            - call: "PATCH /members/${member_id}/style-preferences"
              payload: { preferred_categories: ["KNITWEAR", "ACCESSORY"], size_profile: "S" }
              as: Member
              as_user_id: "${member_id}"
            - call: "PATCH /members/${member_id}/style-preferences"
              payload: { size_profile: "L" }
              as: Member
              as_user_id: "${member_id}"
            - call: "GET /members/${member_id}/personalization-summary"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "first PATCH: HTTP 200 with Member.preferred_categories == [KNITWEAR, ACCESSORY] and size_profile == S"
            - "second PATCH: HTTP 200 with Member.size_profile == L"
            - "second PATCH: Member.preferred_categories is still [KNITWEAR, ACCESSORY]"
            - "personalization-summary: preferred_categories == [KNITWEAR, ACCESSORY] and size_profile == L"
            - "personalization-summary: feedback_count == 0 and fit_confidence_score == 50 and dominant_fit_rating == null"
            - "GET /members/${member_id} reports status == ACTIVE"
      - name: endpoint_technician_patch_flips_one_certification_only
        claim_type: standard_crud
        grounds:
          - "endpoints.PATCH /technicians/{technician_id}"
          - "entities.Technician.fields.repair_certified"
          - "entities.Technician.fields.photography_certified"
        distinguishing_aspect: >-
          All three PATCH fields are optional and independent, so clearing repair_certified must leave
          photography_certified true and status ACTIVE. An implementation that treats the PATCH body as a full
          replacement clears the photography flag as a side effect, which would silently make the technician
          useless for the photography leg.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "technicians T-INSP-1 and T-REP-2 both ACTIVE with repair_certified true and photography_certified true"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /technicians"
              payload: { employee_code: "T-INSP-1", full_name: "Ivo Sandoval", repair_certified: true, photography_certified: true, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_insp_id: "$.data.id" }
            - call: "POST /technicians"
              payload: { employee_code: "T-REP-2", full_name: "Marta Lindqvist", repair_certified: true, photography_certified: true, status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_rep_id: "$.data.id" }
          trigger:
            - call: "PATCH /technicians/${tech_rep_id}"
              payload: { repair_certified: false }
              as: PlatformAdmin
            - call: "GET /technicians/${tech_rep_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP 200 with Technician.repair_certified == false"
            - "Technician.photography_certified == true and status == ACTIVE"
            - "Technician.employee_code == T-REP-2 and full_name == Marta Lindqvist"
            - "GET /technicians?status=ACTIVE returns total_count == 2"
      - name: endpoint_depth_plan_patch_rederives_the_requirement_but_not_from_planned_depth
        claim_type: standard_crud
        grounds:
          - "endpoints.PATCH /styles/{style_id}/depth-plan"
          - "calculations.style_depth_requirement"
          - "entities.Style.fields.required_depth_units"
          - "entities.Style.fields.planned_depth_units"
        distinguishing_aspect: >-
          After the PATCH committed_days is 10 * (5 + 2) == 70 and required_depth_units is ceil(70 / 30) == 3, so
          with one active unit depth_gap_units is 2 and replenishment_flag is true. The second PATCH raises
          planned_depth_units to 9 and must change NOTHING derived: planned_depth_units is the planner's intent
          and never an input to the requirement, so required_depth_units stays 3 and depth_gap_units stays 2.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "style AUR-GOWN-01 with forecast_monthly_requests 8, avg_rental_days 6, planned_depth_units 3"
            - "one size-M grade-A unit AUR-GOWN-001 of that style, IN_STOCK and FLOOR_READY"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /styles"
              payload: { style_code: "AUR-GOWN-01", brand: "Aurelia", category: "GOWN", retail_price_cents: 48000, acquisition_cost_cents: 21000, size_run: ["S", "M", "L"], expected_rental_turns_per_unit: 12, planned_eol_value_cents: 9000, forecast_monthly_requests: 8, avg_rental_days: 6, planned_depth_units: 3 }
              as: InventoryPlanner
              captures: { style_gown_id: "$.data.id" }
            - call: "POST /styles/${style_gown_id}/rental-units"
              payload: { unit_code: "AUR-GOWN-001", size: "M", acquisition_cost_cents: 21000, condition_grade: "A" }
              as: InventoryPlanner
              captures: { unit1_id: "$.data.id" }
          trigger:
            - call: "PATCH /styles/${style_gown_id}/depth-plan"
              payload: { forecast_monthly_requests: 10, avg_rental_days: 5 }
              as: InventoryPlanner
            - call: "PATCH /styles/${style_gown_id}/depth-plan"
              payload: { planned_depth_units: 9 }
              as: InventoryPlanner
          assert:
            - "first PATCH: HTTP 200 with Style.forecast_monthly_requests == 10 and avg_rental_days == 5"
            - "first PATCH: Style.required_depth_units == 3 and active_unit_count == 1 and depth_gap_units == 2 and replenishment_flag == true"
            - "first PATCH: Style.planned_depth_units is still 3"
            - "second PATCH: HTTP 200 with Style.planned_depth_units == 9"
            - "second PATCH: Style.required_depth_units == 3 and depth_gap_units == 2 and replenishment_flag == true"
            - "GET /styles?replenishment_flag=true returns total_count == 1"
      - name: endpoint_return_initiation_creates_the_inbound_leg_for_the_reservation
