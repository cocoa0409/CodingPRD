              payload: { description: "Rig", scheduled_value_cents: 1000000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { asset_id: $.data.id }
            - call: "POST /trustee/cases/${case_id}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${case_id}/claims"
              payload: { creditor_id: "${cred_l}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred_l}"
              captures: { claim_id: $.data.id }
            - call: "POST /trustee/claims/${claim_id}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${claim_id}/objections"
              payload: { grounds: "INSUFFICIENT_DOCUMENTATION", proposed_allowed_amount_cents: 0, proposed_priority_class: "GENERAL_UNSECURED" }
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Court
            - call: "POST /trustee/cases/${case_id}/begin_liquidation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
          trigger:
            - call: "POST /trustee/cases/${case_id}/begin_distribution"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OBJECTIONS_PENDING   # Case posture transition depends on the state of child Claim entities (OBJECTED blocks)"

      - name: sale_create_gated_by_asset_state
        grounds:
          - state_machines.Asset.MARKED_FOR_SALE_to_IN_AUCTION
          - state_machines.AuctionSale.transitions
        distinguishing_aspect: |
          Pair = AuctionSale -> Asset (different pair from instance 1). Sale
          creation is valid only when the referenced Asset is MARKED_FOR_SALE;
          an UNDER_INVESTIGATION asset rejects the sale even though every
          sale-local field is well-formed.
        test_recipe:
          setup:
            - "Case in LIQUIDATION; asset UNDER_INVESTIGATION (never marked for sale)"
          setup_api_calls:
            - call: "POST /trustee/creditors"
              payload: { legal_name: "Creditor M", creditor_ref: "CR-M-1", contact_email: "m@x.com" }
              as: Clerk
              captures: { cred_m: $.data.id }
            - call: "POST /trustee/cases"
              payload: { case_number: "26-10014", debtor_name: "Debtor Fourteen", filed_on: "2026-01-15T00:00:00Z", district: "D.Del.", trustee_user_id: "trust-0001" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /trustee/cases/${case_id}/assets"
              payload: { description: "Press", scheduled_value_cents: 300000 }
              as: Trustee
              as_user_id: "trust-0001"
              captures: { asset_id: $.data.id }
            - call: "POST /trustee/cases/${case_id}/begin_investigation"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/cases/${case_id}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "POST /trustee/cases/${case_id}/claims"
              payload: { creditor_id: "${cred_m}", received_at: "2026-02-01T00:00:00Z", filed_amount_cents: 100000, priority_class: "GENERAL_UNSECURED" }
              as: Creditor
              as_user_id: "${cred_m}"
              captures: { claim_id: $.data.id }
            - call: "POST /trustee/claims/${claim_id}/review"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/claims/${claim_id}/allow"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
            - call: "POST /trustee/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Court
            - call: "POST /trustee/cases/${case_id}/begin_liquidation"
