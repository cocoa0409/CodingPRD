  # ===========================================================================
  - section: validations
    instances:
      - name: pool_gating_violations
        claim_type: violation_to_error
        grounds: ["errors[ERR_POOL_PROGRAM_REQUIRED]", "errors[ERR_EXCHANGE_NOT_REQUESTED]", "errors[ERR_POOL_CUSTOMER_MISMATCH]"]
        distinguishing_aspect: "Pool gating trio: enrollment requires pool_program (ERR_POOL_PROGRAM_REQUIRED); reserve requires the RO to have exchange_requested (ERR_EXCHANGE_NOT_REQUESTED); reserve requires customer match (ERR_POOL_CUSTOMER_MISMATCH)."
        test_recipe:
          setup: ["C1 pool_program=true with pool unit U1 and RO1 (exchange_requested=false); C2 pool_program=false with RO2 (exchange_requested=true)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Navasota", account_number: "NA-470", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: true }, as: ServiceManager, captures: { c1: $.data.id } }
            - { call: "POST /customers", payload: { name: "Ozona", account_number: "OZ-471", credit_limit_cents: 99999999, warranty_terms_days: 365, pool_program: false }, as: ServiceManager, captures: { c2: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${c1}", serial_number: "P-4701", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500 }, as: IntakeCoordinator, captures: { a1: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${c2}", serial_number: "P-4711", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500 }, as: IntakeCoordinator, captures: { a2: $.data.id } }
            - { call: "POST /pool-units", payload: { customer_id: "${c1}", asset_id: "${a1}" }, as: IntakeCoordinator, captures: { u1: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${c1}", asset_id: "${a1}", failure_mode: "SEAL_LEAK", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro1: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${c2}", asset_id: "${a2}", failure_mode: "SEAL_LEAK", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5, exchange_requested: true }, as: IntakeCoordinator, captures: { ro2: $.data.id } }
          trigger:
            - { call: "POST /pool-units", payload: { customer_id: "${c2}", asset_id: "${a2}" }, as: IntakeCoordinator, captures: { err1: $.data.error_id } }
            - { call: "POST /pool-units/${u1}/reserve", payload: { repair_order_id: "${ro1}" }, as: IntakeCoordinator, captures: { err2: $.data.error_id } }
            - { call: "POST /pool-units/${u1}/reserve", payload: { repair_order_id: "${ro2}" }, as: IntakeCoordinator, captures: { err3: $.data.error_id } }
          assert:
            - "enroll for non-program customer -> err1 == ERR_POOL_PROGRAM_REQUIRED"
            - "reserve for RO without exchange_requested -> err2 == ERR_EXCHANGE_NOT_REQUESTED"
            - "reserve C1's unit for C2's order -> err3 == ERR_POOL_CUSTOMER_MISMATCH"
            - "PoolUnit.${u1}.pool_status == IN_POOL after all rejections"

      - name: certification_not_applicable_on_pump
        claim_type: violation_to_error
        grounds: ["errors[ERR_CERTIFICATION_NOT_APPLICABLE]", "validations[priority=5]", entities.RepairOrder.fields.requires_certification]
        distinguishing_aspect: "The applicability gate fires before from-state evaluation: a certification attempt on a PUMP order (requires_certification false) returns ERR_CERTIFICATION_NOT_APPLICABLE even though the RO is also in the wrong state."
        test_recipe:
          setup: ["PUMP RO in RECEIVED"]
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Pearsall", account_number: "PA-480", credit_limit_cents: 99999999, warranty_terms_days: 365 }, as: ServiceManager, captures: { cust: $.data.id } }
            - { call: "POST /assets", payload: { customer_id: "${cust}", serial_number: "P-4801", equipment_class: "PUMP", manufacturer: "Flowserve", model: "M2", rated_flow_gpm: 500 }, as: IntakeCoordinator, captures: { asset: $.data.id } }
            - { call: "POST /repair-orders", payload: { customer_id: "${cust}", asset_id: "${asset}", failure_mode: "SEAL_LEAK", failure_description: "x", intake_priority: "STANDARD", planned_start_date: "2026-08-10", planned_end_date: "2026-08-20", estimated_bay_hours: 5 }, as: IntakeCoordinator, captures: { ro: $.data.id, ro_reqcert: $.data.requires_certification } }
          trigger:
            - { call: "POST /repair-orders/${ro}/certifications", payload: { set_pressure_psig: 100, seat_leakage_class: "CLASS_V" }, as: Certifier, as_user_id: "cert-002", captures: { err: $.data.error_id } }
          assert:
            - "RepairOrder.${ro}.requires_certification == false"
            - "error_id == ERR_CERTIFICATION_NOT_APPLICABLE (applicability gate beats from-state check within priority 5)"
