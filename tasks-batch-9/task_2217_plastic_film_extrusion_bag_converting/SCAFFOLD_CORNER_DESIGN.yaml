            - *a_run1_new
            - *a_run1_start
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_roll1
          trigger:
            - { call: "POST /extrusion-runs/${run1}/complete", payload: { gross_output_kg: 500.0, scrap_kg: 100.0 }, as: ExtrusionOperator }
            - { call: "GET /regrind-pools/${pool_nf}/balance", payload: {}, as: ExtrusionOperator }
          assert:
            - "POST /extrusion-runs/${run1}/complete -> 200 and the response body already shows status COMPLETED"
            - "the same response shows ExtrusionRun.${run1}.net_output_kg == 400.000, scrap_kg == 100.000, virgin_feed_kg == 500.000"
            - "the same response shows gauge_capability_index == 4.000, gauge_capability_state == CAPABLE, actual_recycled_content_pct == 0.000, regrind_applied_pct == 0.000"
            - "the immediately following balance read shows RegrindPool.${pool_nf}.available_kg == 100.000 and generation_count == 1"
            - "FilmRoll.${roll1}.status == WOUND and actual_recycled_content_pct == 0.000"
      - name: cascade_effects_are_visible_in_the_triggering_requests_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_dossier_revocation_quarantines_lot_wears_plate_and_freezes_line
          rationale: "Every hop of the cascade is asserted immediately after the single triggering call in the named 1.8 instance, with no re-read delay."
