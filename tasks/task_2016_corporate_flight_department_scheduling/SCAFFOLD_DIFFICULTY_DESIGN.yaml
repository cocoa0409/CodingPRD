              as: FlightDeptManager
              captures: { ac_id: $.data.id }
            # Trip1: 10:00-12:00
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T10:00:00Z", requested_return_utc: "2026-08-10T12:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip1: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip1}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T10:00:00Z", scheduled_arrival_utc: "2026-08-10T12:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { leg1: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip1}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax}"
            - call: "POST /flight-ops/trip-requests/${trip1}/approve"
              payload: {}
              as: FlightDeptManager
            - call: "GET /flight-ops/trip-requests/${trip1}"
              as: FlightDeptManager
              captures: { trip1_v: $.data.version }
            - call: "POST /flight-ops/trip-requests/${trip1}/assign-aircraft"
              payload: { expected_trip_request_version: "${trip1_v}" }
              as: Dispatcher
              as_user_id: "disp-1"
            # Trip2: 13:30-14:30 — exactly 90 min after leg1 arrival, half-open permits
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "Y", requested_departure_utc: "2026-08-10T13:30:00Z", requested_return_utc: "2026-08-10T14:30:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
