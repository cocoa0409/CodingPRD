            - call: "GET /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", limit: 2, offset: 3 }
              as: PlantAdmin
              captures: { p3_total: $.total_count, p3_more: $.has_more }
            - call: "GET /bin-designs"
              payload: { limit: 100, offset: 0 }
              as: PlantAdmin
              captures: { all_total: $.total_count, all_more: $.has_more }
            - call: "GET /bin-designs"
              payload: { author_engineer_id: "${eng_b_id}", limit: 10, offset: 0 }
              as: PlantAdmin
              captures: { auth_total: $.total_count, auth_first: "$.data[0].id" }
            - call: "GET /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", author_engineer_id: "${eng_b_id}", limit: 10, offset: 0 }
              as: PlantAdmin
              captures: { and_total: $.total_count, and_first: "$.data[0].id" }
            - call: "GET /bin-designs"
              payload: { sealed_by_engineer_id: "${eng_b_id}", limit: 10, offset: 0 }
              as: PlantAdmin
              captures: { sealed_total: $.total_count, sealed_more: $.has_more }
            - call: "GET /bin-designs"
              payload: { dealer_id: "${dlr_a_id}" }
              as: PlantAdmin
              captures: { def_total: $.total_count, def_more: $.has_more }
            - call: "GET /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", limit: 0, offset: 0 }
              as: PlantAdmin
              captures: { e_limit0: $.data.error_id }
            - call: "GET /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", limit: 101, offset: 0 }
              as: PlantAdmin
              captures: { e_limit101: $.data.error_id }
          assert:
            - "limit 2 offset 0 under the Alpha filter returns HTTP 200 with total_count 3, has_more true and exactly 2 rows whose ids are DA1 then DA2 - ascending created_at, not id order"
            - "limit 2 offset 2 returns total_count 3, has_more false and exactly 1 row whose id is DA3"
            - "limit 2 offset 3 - past the end of the filtered set - returns HTTP 200 with an empty data array, total_count still 3 and has_more false"
            - "the unfiltered read returns total_count 5 with has_more false, so total_count tracks the filter and not the page"
            - "filtering by author PE-1003 alone returns total_count 2 with DA3 first, and adding the Alpha dealer filter narrows it to total_count 1 with DA3 - the filters are ANDed"
            - "filtering by sealed_by_engineer_id on a column that is null for all five rows returns HTTP 200 with total_count 0, has_more false and an empty data array"
            - "omitting limit and offset entirely applies the declared defaults limit 10 and offset 0, returning total_count 3 with all 3 Alpha rows and has_more false"
            - "limit 0 returns HTTP 400 with error_id ERR_INVALID_REQUEST because the declared minimum is 1, and limit 101 returns HTTP 400 because the declared maximum is 100 - neither is silently clamped"

      - name: every_detach_reconciles_the_load_totals_and_renumbers_the_surviving_freight_sequence
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.freight_load_allocation
          - endpoints.POST /freight-loads/{id}/assign-order
          - endpoints.POST /dealer-orders/{id}/cancel
          - entities.FreightLoad.cube_utilization_pct
          - entities.DealerOrder.freight_sequence
        distinguishing_aspect: "Three kits with DIFFERENT weight-to-cube densities ride one STEP_DECK, so every derived field has a distinct value per stage and no arithmetic accident can hide a stale total. The load is then emptied one order at a time and each cancel must re-derive assigned_weight_kg, assigned_cube_m3, cube_utilization_pct, linehaul_cost_cents, order_count AND every survivor's allocated_freight_cents - the linehaul falls 231434 -> 212202 -> 192611 because the per-kg component shrinks with the load, so an implementation that merely subtracts the detached order's share leaves the survivors over-charged. freight_sequence is renumbered from 1 rather than left with a hole: cancelling sequence 1 promotes the old sequence 2 to 1. Emptying the load entirely drives it to CANCELLED with all five derived fields at 0, so the base linehaul is not charged to an empty trailer, and the detached orders each end at allocated_freight_cents 0 with freight_sequence null."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST, GrainProfile CORN, CoatingSpec G115, engineer PE-1001, Dealer Alpha with staging_slots 2."
            - "BinDesign D1 12.0 m x 9.6 m ASD."
            - "Three DRAFT orders on D1, created in this order: O1 NONE/GRAVITY (6410.4 kg, 18.45 m3), O2 AERATION/GRAVITY (6530.4 kg, 20.35 m3), O3 AERATION/SWEEP_AUGER (6870.4 kg, 23.75 m3)."
