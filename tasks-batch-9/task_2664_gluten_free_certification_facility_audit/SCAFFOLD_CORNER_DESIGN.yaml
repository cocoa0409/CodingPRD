            - "Product.${prod_id}.formula_cleared_by_user_id == null"
            - "Product.${prod_id}.threshold_ppm == null"

      - name: formula_review_with_a_draft_line_is_rejected_as_ingredient_not_approved
        claim_type: violation_to_error
        grounds:
