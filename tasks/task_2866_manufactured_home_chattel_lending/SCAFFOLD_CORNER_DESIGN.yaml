              payload: { loan_id: "${l1}", carrier_name: "Foremost", policy_number: "FM-2026-77410", dwelling_coverage_cents: 4700000, wind_deductible_cents: 100000, wind_endorsement: true, effective_date: "2026-08-01T00:00:00Z", expiry_date: "2027-08-01T00:00:00Z", expected_loan_version: "${l1_v}" }
              as: ClosingAgent
              captures: { p: "$.data.id" }
            - call: "POST /chattel/loans/${l1}/fund"
              payload: { first_due_date: "2026-09-01T00:00:00Z" }
              as: ClosingAgent
          trigger:
            - call: "POST /chattel/loans"
              payload: { borrower_id: "${b}", unit_id: "${u}", origination_valuation_id: "${v}", principal_cents: 1000000, requested_term_months: 240 }
              as: CreditAnalyst
              captures: { l2: "$.data.id" }
            - call: "POST /chattel/loans/${l2}/submit-underwriting"
              payload: {}
              as: CreditAnalyst
            - call: "POST /chattel/loans/${l2}/decline"
              payload: { decline_reason: "second lien not permitted on the same collateral" }
              as: CreditAnalyst
              as_user_id: "analyst-uw-02"
            - call: "POST /chattel/loans"
              payload: { borrower_id: "${b}", unit_id: "${u}", origination_valuation_id: "${v}", principal_cents: 500000, requested_term_months: 240 }
              as: CreditAnalyst
              captures: { l3: "$.data.id" }
            - call: "GET /chattel/borrowers/${b}"
              payload: {}
              as: CreditAnalyst
          assert:
            - "HTTP 200 on the borrower read"
            - "Loan.${l1}.servicing_state == CURRENT and principal_balance_cents == 4600000"
            - "Loan.${l2}.underwriting_state == DECLINED and servicing_state == NOT_SERVICING and ltv_bps == 1731 and apr_bps == 1275"
            - "Loan.${l3}.underwriting_state == DRAFT and servicing_state == NOT_SERVICING and principal_balance_cents == 0"
            - "Borrower.${b}.total_outstanding_principal_cents == 4600000, NOT 6100000"
            - "Borrower.${b}.units_under_recovery_hold_count == 0 and status == ACTIVE"
            - "GET /chattel/loans?borrower_id=${b} has total_count 3 (all three loans exist; only one is inside the exposure input set)"

      - name: valuation_rounding_precision_at_the_three_marked_points
        claim_type: precision
        grounds:
          - calculations.unit_book_valuation.precision
        excluded_because:
          difficulty_instance: dual_variant_calc / valuation_origination_vs_recovery_liquidation_on_one_unit
          rationale: "That §1.8 instance pins book_base_cents 5365440, location_adjustment_cents 160963 and forced_sale_discount_cents 1215809 as exact literals, which is precisely the round_half_up behaviour at all three marked rounding points."
      - name: interest_accrual_chronological_two_step_versus_single_span
        claim_type: chronological
        grounds:
          - calculations.interest_accrual.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / deficiency_settlement_commission_tier_keyed_on_gross_proceeds
          rationale: "That §1.8 instance accrues 92 days and then 11 days in two separate servicing assessments and asserts the resulting 165505 cents, which is the declared two-step-versus-single-span behaviour of the accrual."
      - name: payment_waterfall_variant_selection_by_collateral_classification
        claim_type: variant_selection
        grounds:
          - calculations.payment_waterfall_allocation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / payment_allocation_chattel_order_vs_real_property_escrow_first
          rationale: "That §1.8 instance posts the identical 100000-cent payment before and after the unit's conversion and asserts allocation_variant flips from CHATTEL_CONTRACT_ORDER to REAL_PROPERTY_ESCROW_FIRST."
      - name: ltv_tier_boundary_at_the_cap
        claim_type: tiered_pricing
        grounds:
          - calculations.loan_rate_and_term.constants.LTV_TIER_BPS
          - calculations.loan_rate_and_term.constants.LTV_CAP_BPS
        excluded_because:
          difficulty_instance: boundary_precision_check / ltv_exactly_at_cap_passes_one_basis_point_over_fails
          rationale: "That §1.8 instance tests ltv_bps exactly 9500 (accepted, 150 bps tier) against 9501 (refused), which is both the tier boundary and the inclusive cap endpoint."
      - name: deficiency_settlement_commission_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.deficiency_settlement
        excluded_because:
          difficulty_instance: combinatorial_formula / deficiency_settlement_commission_tier_keyed_on_gross_proceeds
          rationale: "That §1.8 instance shows the tier is keyed on gross_proceeds_cents 6100000 rather than net_proceeds_cents 5559500, which is the cross-tier straddling case for this schedule."
      - name: aggregation_running_total_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.payment_waterfall_allocation
          - calculations.borrower_exposure
        excluded_because:
          difficulty_instance: compensating_invariant / payment_reversal_restores_obligation_total
          rationale: "That §1.8 instance asserts every obligation bucket returns to its exact pre-payment amount after a reversal, with no interest re-accrual, which is the aggregation-after-reversal claim."

  - section: validations
    instances:

      - name: second_unit_reusing_a_hud_label_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - entities.ManufacturedUnit.fields.hud_label_number
          - errors[ERR_DUPLICATE_HUD_LABEL]
        distinguishing_aspect: "hud_label_number is globally unique across ManufacturedUnit, not unique per community or per parcel: a second unit on an entirely different private parcel that reuses label ALB0412345 is refused with ERR_DUPLICATE_HUD_LABEL (409)."
        test_recipe:
          setup:
            - "One Borrower who owns two separate parcels."
            - "One ManufacturedUnit already recorded under hud_label_number ALB0412345 on the first parcel."
          setup_api_calls:
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "PRIVATE_LAND", land_owner_borrower_id: "${b}", land_parcel_apn: "072-114-003", land_county: "Bibb" }
              as: ClosingAgent
              captures: { u1: "$.data.id" }
          trigger:
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2020, width_class: "SINGLE_WIDE", square_feet: 980, condition_grade: "EXCELLENT", installation_type: "PIER_AND_ANCHOR", wind_zone: 1, placement_type: "PRIVATE_LAND", land_owner_borrower_id: "${b}", land_parcel_apn: "072-990-114", land_county: "Bibb" }
              as: ClosingAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_DUPLICATE_HUD_LABEL with HTTP 409"
            - "GET /chattel/units returns total_count 1 (the refused create persisted nothing)"
            - "ManufacturedUnit.${u1}.model_year == 2020 is false - the surviving unit is untouched at 2018"

      - name: private_land_unit_carrying_a_community_id_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - entities.ManufacturedUnit.fields.community_id
          - entities.ManufacturedUnit.fields.land_owner_borrower_id
          - errors[ERR_PLACEMENT_FIELDS_INCONSISTENT]
        distinguishing_aspect: "The placement consistency rule is two-sided: it is not enough to supply the PRIVATE_LAND fields, community_id must also be absent. A payload carrying a real community_id, a real lot_number AND the full private-land triple is refused with ERR_PLACEMENT_FIELDS_INCONSISTENT (422) rather than silently preferring one placement."
        test_recipe:
          setup:
            - "One Borrower and one Community, both valid targets, so the failure is the combination and not a bad reference."
          setup_api_calls:
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
          trigger:
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "PRIVATE_LAND", community_id: "${c}", lot_number: "A-14", placement_start_date: "2026-08-01T00:00:00Z", land_owner_borrower_id: "${b}", land_parcel_apn: "072-114-003", land_county: "Bibb" }
              as: ClosingAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_PLACEMENT_FIELDS_INCONSISTENT with HTTP 422"
            - "the error is NOT ERR_INVALID_REQUEST - every field parses and every enum member is declared, so priority 6 passes and priority 13 is the first rule that bites"
            - "Community.${c} exists and GET /chattel/units?community_id=${c} returns total_count 0"

      - name: duplicate_label_error_precedes_inconsistent_placement_error
        claim_type: priority_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=13]
        distinguishing_aspect: "One payload violates both rules at once - it reuses hud_label_number ALB0412345 and it declares PRIVATE_LAND while carrying a community_id - and the response must be ERR_DUPLICATE_HUD_LABEL (409) from priority 12, not the 422 from priority 13."
        test_recipe:
          setup:
            - "One Borrower, one Community, and one existing unit already holding hud_label_number ALB0412345."
          setup_api_calls:
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000 }
              as: PlatformAdmin
              captures: { c: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "PRIVATE_LAND", land_owner_borrower_id: "${b}", land_parcel_apn: "072-114-003", land_county: "Bibb" }
              as: ClosingAgent
              captures: { u1: "$.data.id" }
          trigger:
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2020, width_class: "SINGLE_WIDE", square_feet: 980, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 1, placement_type: "PRIVATE_LAND", community_id: "${c}", lot_number: "B-02", placement_start_date: "2026-08-01T00:00:00Z", land_owner_borrower_id: "${b}", land_parcel_apn: "072-990-114", land_county: "Bibb" }
              as: ClosingAgent
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_DUPLICATE_HUD_LABEL with HTTP 409"
            - "${err} is NOT ERR_PLACEMENT_FIELDS_INCONSISTENT and the status is NOT 422"
            - "GET /chattel/units returns total_count 1"

      - name: valuation_against_a_guide_not_yet_effective_is_refused
        claim_type: temporal_validation
        grounds:
          - validations[priority=10]
          - entities.BookValueGuide.fields.effective_date
          - errors[ERR_GUIDE_NOT_EFFECTIVE]
        distinguishing_aspect: "The guide's effective_date must be at or before the logical clock: a 2026-09-01 edition is a perfectly valid stored guide but cannot be cited on 2026-08-01, so the valuation create is refused with ERR_GUIDE_NOT_EFFECTIVE (422) even though every reference resolves and the unit version is current."
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One guide whose effective_date is 2026-09-01T00:00:00Z, i.e. one month in the future."
            - "One private-land unit ready to be valued."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-FALL", region_code: "SOUTH_ATLANTIC", effective_date: "2026-09-01T00:00:00Z", base_value_per_sqft_cents: 4600, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g: "$.data.id" }
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "PRIVATE_LAND", land_owner_borrower_id: "${b}", land_parcel_apn: "072-114-003", land_county: "Bibb" }
              as: ClosingAgent
              captures: { u: "$.data.id", u_v: "$.data.version" }
          trigger:
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u}", guide_id: "${g}", variant: "ORIGINATION", expected_unit_version: "${u_v}" }
              as: CreditAnalyst
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == ERR_GUIDE_NOT_EFFECTIVE with HTTP 422"
            - "${err} is NOT ERR_GUIDE_NOT_FOUND (the guide exists) and NOT ERR_STALE_UNIT_VERSION (the version is current)"
            - "ManufacturedUnit.${u}.version is still ${u_v} - a refused valuation does not bump the unit"
            - "GET /chattel/valuations?unit_id=${u} returns total_count 0"

      - name: clock_may_stand_still_but_never_run_backwards
        claim_type: temporal_validation
        grounds:
          - validations[priority=8]
          - endpoints[POST /chattel/_clock/set_current_utc]
          - errors[ERR_CLOCK_REGRESSION]
        distinguishing_aspect: "The clock rule is monotonic-non-strict: re-setting the clock to the value it already holds is accepted, while any earlier instant - even one still in the future relative to the 2026-08-01 default - is refused with ERR_CLOCK_REGRESSION (422) and leaves the clock where it was."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { t1: "$.data.current_utc" }
          trigger:
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { t2: "$.data.current_utc" }
          assert:
            - "${err} == ERR_CLOCK_REGRESSION with HTTP 422"
            - "${t1} == 2026-09-01T00:00:00Z"
            - "${t2} == 2026-09-01T00:00:00Z with HTTP 200 - setting the clock to its current value is not a regression"
            - "the rejected 2026-08-15 call did not move the clock: the third call proves it is still at 2026-09-01"

      - name: filing_type_mismatch_error_precedes_incomplete_documents_error
        claim_type: priority_ordering
        grounds:
          - validations[priority=38]
          - validations[priority=39]
          - errors[ERR_FILING_TYPE_MISMATCH]
          - errors[ERR_FILING_DOCUMENTS_INCOMPLETE]
        distinguishing_aspect: "A land-home deed of trust tendered on a PERSONAL_PROPERTY loan with only one of its three required documents violates both rules; priority 38 wins and the caller is told the instrument is wrong for the classification (ERR_FILING_TYPE_MISMATCH) before it is told which documents are missing. Correcting only the type then surfaces ERR_FILING_DOCUMENTS_INCOMPLETE from priority 39."
        test_recipe:
          setup:
            - "One DRAFT loan on a PERSONAL_PROPERTY (freshly created, unconverted) private-land unit; no filing exists yet."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g: "$.data.id" }
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PERMANENT_FOUNDATION", wind_zone: 1, placement_type: "PRIVATE_LAND", land_owner_borrower_id: "${b}", land_parcel_apn: "072-114-003", land_county: "Bibb" }
              as: ClosingAgent
              captures: { u: "$.data.id", u_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u}", guide_id: "${g}", variant: "ORIGINATION", expected_unit_version: "${u_v}" }
              as: CreditAnalyst
              captures: { v: "$.data.id" }
            - call: "POST /chattel/valuations/${v}/certify"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
            - call: "POST /chattel/loans"
              payload: { borrower_id: "${b}", unit_id: "${u}", origination_valuation_id: "${v}", principal_cents: 1500000, requested_term_months: 240 }
              as: CreditAnalyst
              captures: { l: "$.data.id" }
          trigger:
            - call: "POST /chattel/lien-filings"
              payload: { loan_id: "${l}", filing_type: "LAND_HOME_DEED_OF_TRUST", submitted_documents: ["DEED_OF_TRUST"] }
              as: ClosingAgent
              captures: { err1: "$.data.error_id" }
            - call: "POST /chattel/lien-filings"
              payload: { loan_id: "${l}", filing_type: "TITLE_LIEN", submitted_documents: ["TITLE_APPLICATION"] }
              as: ClosingAgent
              captures: { err2: "$.data.error_id" }
          assert:
            - "${err1} == ERR_FILING_TYPE_MISMATCH with HTTP 422 (the loan's collateral_classification is PERSONAL_PROPERTY, which requires TITLE_LIEN)"
            - "${err1} is NOT ERR_FILING_DOCUMENTS_INCOMPLETE even though two of the three deed-of-trust documents are absent"
            - "${err2} == ERR_FILING_DOCUMENTS_INCOMPLETE with HTTP 422 (LIEN_ENTRY_FORM is missing)"
            - "GET /chattel/lien-filings?loan_id=${l} returns total_count 0 - neither refused attempt created a filing row"
            - "Loan.${l}.perfection_state == UNPERFECTED"

      - name: fourth_filing_attempt_is_refused_at_the_attempt_limit
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - validations[priority=24]
          - entities.LienFiling.fields.attempt_number
          - errors[ERR_FILING_ATTEMPT_LIMIT]
          - errors[ERR_FILING_INVALID_STATE]
        distinguishing_aspect: "MAX_FILING_ATTEMPTS is checked BEFORE the increment, so attempts 1, 2 and 3 are all allowed to reach the agency and only the fourth tender is refused with ERR_FILING_ATTEMPT_LIMIT (409); the same walk also shows agency-response refusing to act on a REJECTED filing with ERR_FILING_INVALID_STATE (409), since only resubmit may follow a rejection."
        test_recipe:
          setup:
            - "One DRAFT loan on a PERSONAL_PROPERTY unit with one TITLE_LIEN filing at attempt_number 1, status SUBMITTED."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g: "$.data.id" }
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "PRIVATE_LAND", land_owner_borrower_id: "${b}", land_parcel_apn: "072-114-003", land_county: "Bibb" }
              as: ClosingAgent
              captures: { u: "$.data.id", u_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u}", guide_id: "${g}", variant: "ORIGINATION", expected_unit_version: "${u_v}" }
              as: CreditAnalyst
              captures: { v: "$.data.id" }
            - call: "POST /chattel/valuations/${v}/certify"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
            - call: "POST /chattel/loans"
              payload: { borrower_id: "${b}", unit_id: "${u}", origination_valuation_id: "${v}", principal_cents: 1500000, requested_term_months: 240 }
              as: CreditAnalyst
              captures: { l: "$.data.id" }
            - call: "POST /chattel/lien-filings"
              payload: { loan_id: "${l}", filing_type: "TITLE_LIEN", submitted_documents: ["TITLE_APPLICATION", "LIEN_ENTRY_FORM"] }
              as: ClosingAgent
              captures: { f: "$.data.id" }
          trigger:
            - call: "POST /chattel/lien-filings/${f}/agency-response"
              payload: { outcome: "REJECTED", rejection_code: "NAME_MISMATCH" }
              as: PlatformAdmin
            - call: "POST /chattel/lien-filings/${f}/agency-response"
              payload: { outcome: "RECORDED", agency_reference: "GA-TL-00001" }
              as: PlatformAdmin
              captures: { err_state: "$.data.error_id" }
            - call: "POST /chattel/lien-filings/${f}/resubmit"
              payload: { submitted_documents: ["TITLE_APPLICATION", "LIEN_ENTRY_FORM"] }
              as: ClosingAgent
            - call: "POST /chattel/lien-filings/${f}/agency-response"
              payload: { outcome: "REJECTED", rejection_code: "FEE_SHORTFALL" }
              as: PlatformAdmin
            - call: "POST /chattel/lien-filings/${f}/resubmit"
              payload: { submitted_documents: ["TITLE_APPLICATION", "LIEN_ENTRY_FORM"] }
              as: ClosingAgent
            - call: "POST /chattel/lien-filings/${f}/agency-response"
              payload: { outcome: "REJECTED", rejection_code: "MISSING_DOCUMENT" }
              as: PlatformAdmin
            - call: "POST /chattel/lien-filings/${f}/resubmit"
              payload: { submitted_documents: ["TITLE_APPLICATION", "LIEN_ENTRY_FORM"] }
              as: ClosingAgent
              captures: { err_limit: "$.data.error_id" }
          assert:
            - "${err_state} == ERR_FILING_INVALID_STATE with HTTP 409 - agency-response requires SUBMITTED and the filing was REJECTED at that moment"
            - "the second and third resubmits returned HTTP 200 and drove attempt_number to 2 then 3"
            - "${err_limit} == ERR_FILING_ATTEMPT_LIMIT with HTTP 409 - the check is attempt_number < 3 evaluated before the increment"
            - "LienFiling.${f}.attempt_number == 3 (the refused fourth tender did not increment it)"
            - "LienFiling.${f}.status == REJECTED and rejection_code == MISSING_DOCUMENT and agency_reference == null"
            - "Loan.${l}.perfection_state == FILING_REJECTED"
            - "ManufacturedUnit.${u}.title_status == ACTIVE_TITLE (no recording ever happened)"

      - name: rescinding_a_classification_that_was_never_converted_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - state_machines.unit_classification
          - errors[ERR_UNIT_CLASSIFICATION_INVALID_STATE]
        distinguishing_aspect: "Each conversion action has its own required source classification: RESCIND requires REAL_PROPERTY, so calling it on a unit still sitting in the default PERSONAL_PROPERTY state is refused with ERR_UNIT_CLASSIFICATION_INVALID_STATE (409), and this state check at priority 20 fires ahead of the land-document completeness check at priority 48 that would also fail."
        test_recipe:
          setup:
            - "One private-land unit in its default classification PERSONAL_PROPERTY, with no land documents recorded."
          setup_api_calls:
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PERMANENT_FOUNDATION", wind_zone: 1, placement_type: "PRIVATE_LAND", land_owner_borrower_id: "${b}", land_parcel_apn: "072-114-003", land_county: "Bibb" }
              as: ClosingAgent
              captures: { u: "$.data.id", u_v: "$.data.version" }
          trigger:
            - call: "POST /chattel/units/${u}/convert-classification"
              payload: { action: "RESCIND" }
              as: ClosingAgent
              captures: { err1: "$.data.error_id" }
            - call: "POST /chattel/units/${u}/convert-classification"
              payload: { action: "COMPLETE" }
              as: ClosingAgent
              captures: { err2: "$.data.error_id" }
            - call: "POST /chattel/units/${u}/convert-classification"
              payload: { action: "INITIATE" }
              as: ClosingAgent
              captures: { err3: "$.data.error_id" }
          assert:
            - "${err1} == ERR_UNIT_CLASSIFICATION_INVALID_STATE with HTTP 409"
            - "${err2} == ERR_UNIT_CLASSIFICATION_INVALID_STATE with HTTP 409 (COMPLETE requires CONVERSION_PENDING)"
            - "${err3} == ERR_LAND_DOCUMENTS_INCOMPLETE with HTTP 422 - INITIATE passes the priority 20 classification check and is stopped later, at priority 48"
            - "ManufacturedUnit.${u}.classification == PERSONAL_PROPERTY and version is still ${u_v} after all three refusals"
            - "ManufacturedUnit.${u}.deed_recorded == false and affixation_affidavit_recorded == false"

