  # --- RetrievalRequest ---
  - method: POST
    path: "/archive/retrieval-requests"
    description: "Create a retrieval request (SUBMITTED); validates catalog_status in {CATALOGED, ARCHIVED} (ERR_ASSET_NOT_RETRIEVABLE, ERR_ASSET_DISPOSED), hold CLEAR, rights posture by purpose, deadline"
    roles: [Requester]
