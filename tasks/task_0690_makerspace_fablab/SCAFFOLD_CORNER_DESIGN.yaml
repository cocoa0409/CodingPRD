              as: StaffInstructor
              as_user_id: "${c18}"
              captures: { cert_c18: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${c18}", machine_id: "${laser_p}", certification_id: "${cert_c18}", start_at: "2026-05-30T10:00:00Z", end_at: "2026-05-30T11:00:00Z", supervision_mode: "SUPERVISED" }
              as: Member
