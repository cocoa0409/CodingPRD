      - name: life_safety_cure_ceiling_and_franchise_termination_guards_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CURE_PERIOD_TOO_LONG_FOR_LIFE_SAFETY]
          - errors[ERR_FRANCHISE_TERMINATED]
          - validations[priority=55]
          - validations[priority=37]
        distinguishing_aspect: "A notice over an overdue LIFE_SAFETY item is capped at a 10-day cure even though the global ceiling is 60, and once escalation terminates the franchise the property refuses any new plan outright."
        test_recipe:
          setup:
            - "One property with a plan carrying one LIFE_SAFETY item of 2000000 cents, issued at the default clock so its deadline is 2026-10-30."
            - "The clock is advanced to 2026-10-31 and the plan is swept, so the life-safety item is overdue."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Jerningham Hotels LLC", contact_email: "ops@jerninghamh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Jerningham Old Wharf", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-33.1.1", brand_estimated_cost_cents: 2000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/plans/${plan_id}/compliance-sweep"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
          trigger:
            - call: "POST /pip/default-notices"
              payload: { plan_id: "${plan_id}", cure_period_days: 11 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_cure_ceiling: $.data.error_id }
            - call: "POST /pip/default-notices"
              payload: { plan_id: "${plan_id}", cure_period_days: 10 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-11T00:00:00Z" }
              as: BrandManager
              as_user_id: "bm-001"
