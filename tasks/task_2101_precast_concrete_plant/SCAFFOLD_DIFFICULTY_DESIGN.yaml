scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: trimmed_average_vs_set_average_release_strength
        grounds:
          - calculations.cylinder_set_qualified_strength
          - calculations.cylinder_break_strength_psi
          - entities.CylinderSet.fields.strength_variant
          - entities.CylinderSet.fields.qualified_strength_psi
          - entities.CylinderBreak.fields.inclusion_status
          - state_machines.CylinderSet.TESTING_to_RELEASE_MET
        distinguishing_aspect: |
          This dual-variant calculation lives on the CylinderSet strength domain: the same three
          break loads yield 3575 psi under TRIMMED_AVERAGE (specimen_count 3) but 3350 psi under
          SET_AVERAGE, so the identical cylinders clear a 3500 psi release threshold under one
          variant and fail it under the other.
        test_recipe:
          setup:
            - "Mix M40-STD is QUALIFIED with required_release_psi 3500."
            - "Bed run R1 on bed B1 is TENSIONED then CAST, so its status is CURING."
            - "One piece is assigned to R1 and is on QC hold awaiting release strength."
            - "R1 has one CuringCycle in status COMPLETED."
            - "R1 has one CylinderSet with purpose RELEASE and specimen_count 3, status CAST, no breaks yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /projects"
              payload: { name: "Riverfront Garage", jobsite_city: "Nashville", erection_start_date: "2026-09-15" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { proj_id: $.data.id }
            - call: "POST /mix-designs"
              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { mix_id: $.data.id }
            - call: "POST /mix-designs/${mix_id}/qualify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
            - call: "POST /steam-zones"
              payload: { zone_code: "Z1", boiler_capacity_bhp: 100, therm_rate_cents_per_therm: 95 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { zone_id: $.data.id }
            - call: "POST /casting-beds"
              payload: { bed_code: "B1", steam_zone_id: "${zone_id}", bed_type: "LONG_LINE_PRESTRESS", length_ft: 400, max_strand_force_kips: 900, turnaround_buffer_hours: 6 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bed_id: $.data.id }
            - call: "POST /bed-runs"
              payload: { bed_id: "${bed_id}", mix_design_id: "${mix_id}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-04T06:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { run_id: $.data.id }
            - call: "POST /pieces"
              payload: { project_id: "${proj_id}", mix_design_id: "${mix_id}", piece_mark: "DT-101", erection_sequence_no: 10, length_ft: 53.10, width_ft: 9.50, height_ft: 13.70, weight_lb: 48200, concrete_volume_cy: 12.50 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { pc1_id: $.data.id }
            - call: "POST /pieces/${pc1_id}/assign-run"
              payload: { bed_run_id: "${run_id}" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /bed-runs/${run_id}/tension"
              payload: { strand_count: 24, strand_diameter_in: 0.500, measured_elongation_in: 35.500 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /bed-runs/${run_id}/cylinder-sets"
              payload: { purpose: "RELEASE", specimen_count: 3, cured_with_member: true }
              as: QCTechnician
              as_user_id: "qc-alice"
              captures: { set_id: $.data.id }
            - call: "POST /bed-runs/${run_id}/curing-cycles"
              payload: { steam_zone_id: "${zone_id}", planned_start: "2026-08-03T12:00:00Z", planned_end: "2026-08-04T00:00:00Z", ramp_rate_f_per_hr: 30, soak_temp_f: 150, soak_hours: 8, steam_demand_bhp: 40 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { cyc_id: $.data.id }
            - call: "POST /bed-runs/${run_id}/cast"
              payload: {}
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /curing-cycles/${cyc_id}/complete"
              payload: {}
              as: ProductionSupervisor
              as_user_id: "ps-carl"
          trigger:
            - call: "POST /cylinder-sets/${set_id}/breaks"
              payload: { load_lbf: 36443, diameter_in: 4.00 }
              as: QCTechnician
              as_user_id: "qc-alice"
              captures: { brk_low_id: $.data.id }
            - call: "POST /cylinder-sets/${set_id}/breaks"
              payload: { load_lbf: 45239, diameter_in: 4.00 }
              as: QCTechnician
              as_user_id: "qc-alice"
              captures: { brk_hi_id: $.data.id }
            - call: "POST /cylinder-sets/${set_id}/breaks"
              payload: { load_lbf: 44611, diameter_in: 4.00 }
              as: QCTechnician
              as_user_id: "qc-alice"
              captures: { brk_mid_id: $.data.id }
          assert:
            - "CylinderBreak.${brk_low_id}.computed_psi == 2900"
            - "CylinderBreak.${brk_hi_id}.computed_psi == 3600"
            - "CylinderBreak.${brk_mid_id}.computed_psi == 3550"
            - "CylinderSet.${set_id}.raw_mean_psi == 3350.00"
            - "CylinderSet.${set_id}.valid_break_count == 2"
            - "CylinderSet.${set_id}.qualified_strength_psi == 3575"
            - "CylinderSet.${set_id}.strength_variant == TRIMMED_AVERAGE"
            - "CylinderSet.${set_id}.status == RELEASE_MET"
            - "CylinderBreak.${brk_low_id}.inclusion_status == DISCARDED_OUTLIER"
            - "CylinderBreak.${brk_hi_id}.inclusion_status == VALID"
            - "CylinderBreak.${brk_mid_id}.inclusion_status == VALID"
            - "CylinderSet.${set_id}.qualified_strength_psi != CylinderSet.${set_id}.raw_mean_psi (3575 vs 3350.00 - the untrimmed SET_AVERAGE reading would have been 3350 and would NOT have met the 3500 psi threshold)"
            - "after the 2nd break only, CylinderSet.${set_id}.valid_break_count == 0 and qualified_strength_psi == null, because the 2-break mean of 3250.00 puts BOTH 2900 and 3600 outside the +/-10 percent band"
            - "BedRun.${run_id}.status == RELEASE_READY"

      - name: metered_vs_modeled_curing_energy
        grounds:
          - calculations.curing_energy_accounting
          - entities.CuringCycle.fields.energy_source
          - entities.CuringCycle.fields.energy_variance_pct
          - entities.CuringCycle.fields.variance_flagged
          - state_machines.CuringCycle.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          The second dual-variant calculation sits on a completely different entity domain -
          CuringCycle steam energy, not cylinder strength - and the divergence is monetary: the
          same 40 bhp / 150 F / 8 h profile bills 13526 cents under MODELED and 16150 cents under
          METERED, and only the METERED branch can raise variance_flagged.
        test_recipe:
          setup:
            - "Bed run R1 is CURING with one assigned piece."
            - "R1 has two CuringCycle rows on zone Z1, both RUNNING: cycle A draws 40 bhp from 12:00 to 24:00 on 2026-08-03 with a 150 F soak for 8 h at 30 F/hr; cycle B draws 30 bhp from 00:00 to 06:00 on 2026-08-04 with a 140 F soak for 6 h at 40 F/hr."
            - "Zone Z1 charges 95 cents per therm and its boiler capacity of 100 bhp is never exceeded (peak concurrent demand is 40 bhp)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /projects"
              payload: { name: "Riverfront Garage", jobsite_city: "Nashville", erection_start_date: "2026-09-15" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { proj_id: $.data.id }
            - call: "POST /mix-designs"
              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { mix_id: $.data.id }
            - call: "POST /mix-designs/${mix_id}/qualify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
            - call: "POST /steam-zones"
              payload: { zone_code: "Z1", boiler_capacity_bhp: 100, therm_rate_cents_per_therm: 95 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { zone_id: $.data.id }
            - call: "POST /casting-beds"
              payload: { bed_code: "B1", steam_zone_id: "${zone_id}", bed_type: "LONG_LINE_PRESTRESS", length_ft: 400, max_strand_force_kips: 900, turnaround_buffer_hours: 6 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bed_id: $.data.id }
            - call: "POST /bed-runs"
              payload: { bed_id: "${bed_id}", mix_design_id: "${mix_id}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-04T06:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { run_id: $.data.id }
            - call: "POST /pieces"
              payload: { project_id: "${proj_id}", mix_design_id: "${mix_id}", piece_mark: "DT-101", erection_sequence_no: 10, length_ft: 53.10, width_ft: 9.50, height_ft: 13.70, weight_lb: 48200, concrete_volume_cy: 12.50 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { pc1_id: $.data.id }
            - call: "POST /pieces/${pc1_id}/assign-run"
              payload: { bed_run_id: "${run_id}" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /bed-runs/${run_id}/tension"
              payload: { strand_count: 24, strand_diameter_in: 0.500, measured_elongation_in: 35.500 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /bed-runs/${run_id}/curing-cycles"
              payload: { steam_zone_id: "${zone_id}", planned_start: "2026-08-03T12:00:00Z", planned_end: "2026-08-04T00:00:00Z", ramp_rate_f_per_hr: 30, soak_temp_f: 150, soak_hours: 8, steam_demand_bhp: 40 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { cyc_a_id: $.data.id, cyc_a_modeled: $.data.modeled_therms }
            - call: "POST /bed-runs/${run_id}/curing-cycles"
              payload: { steam_zone_id: "${zone_id}", planned_start: "2026-08-04T00:00:00Z", planned_end: "2026-08-04T06:00:00Z", ramp_rate_f_per_hr: 40, soak_temp_f: 140, soak_hours: 6, steam_demand_bhp: 30 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { cyc_b_id: $.data.id }
            - call: "POST /bed-runs/${run_id}/cast"
              payload: {}
              as: ProductionSupervisor
              as_user_id: "ps-carl"
          trigger:
            - call: "POST /curing-cycles/${cyc_a_id}/complete"
              payload: { metered_therms: 170.00 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /curing-cycles/${cyc_b_id}/complete"
              payload: {}
              as: ProductionSupervisor
              as_user_id: "ps-carl"
          assert:
            - "CuringCycle.${cyc_a_id}.modeled_therms == 142.38"
            - "CuringCycle.${cyc_a_id}.energy_source == METERED"
            - "CuringCycle.${cyc_a_id}.energy_therms == 170.00"
            - "CuringCycle.${cyc_a_id}.energy_variance_pct == 19.40"
            - "CuringCycle.${cyc_a_id}.variance_flagged == true"
            - "CuringCycle.${cyc_a_id}.energy_cost_cents == 16150"
            - "CuringCycle.${cyc_b_id}.modeled_therms == 80.40"
            - "CuringCycle.${cyc_b_id}.energy_source == MODELED"
            - "CuringCycle.${cyc_b_id}.energy_therms == 80.40"
            - "CuringCycle.${cyc_b_id}.energy_variance_pct == null"
            - "CuringCycle.${cyc_b_id}.variance_flagged == false"
            - "CuringCycle.${cyc_b_id}.energy_cost_cents == 7638"
            - "CuringCycle.${cyc_a_id}.energy_cost_cents (16150) != the 13526 cents that its own modeled_therms of 142.38 would have billed under the MODELED variant"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: jacking_force_floor_overrides_strength_class_adjustment
        grounds:
          - calculations.strand_jacking_force
          - entities.BedRun.fields.computed_jacking_force_kips
          - entities.BedRun.fields.theoretical_elongation_in
          - entities.CastingBed.fields.committed_strand_force_kips
          - state_machines.BedRun.SCHEDULED_to_TENSIONED
        distinguishing_aspect: |
          Mode (a): a four-input formula whose inputs interact non-linearly - strand_count,
          strand_diameter_in, the bed's seating loss and the mix's strength class fold into one
          adjustment percentage that is then swallowed by an outer max() floor. For C40 the floor
          binds and the answer is exactly 768.00 kips (32.00 x 24), NOT the 762.17 kips the
          seating-loss expression alone produces; for C60 the floor does not bind and the answer
          is 773.32 kips.
        test_recipe:
          setup:
            - "Mix M40-STD (C40) and mix M60-HP (C60) are both QUALIFIED."
            - "Beds B1 and B2 are both LONG_LINE_PRESTRESS, 400 ft, 900 kip abutments, AVAILABLE, committed_strand_force_kips 0.00."
            - "Run R1 on B1 uses M40-STD and run R2 on B2 uses M60-HP; both are SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-designs"
              payload: { code: "M40-STD", strength_class: "C40", design_28day_psi: 6000, required_release_psi: 3500, w_c_ratio: 0.38, cement_lb_per_cy: 705, unit_cost_cents_per_cy: 14500 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { mix40_id: $.data.id }
            - call: "POST /mix-designs/${mix40_id}/qualify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
            - call: "POST /mix-designs"
              payload: { code: "M60-HP", strength_class: "C60", design_28day_psi: 9000, required_release_psi: 4500, w_c_ratio: 0.32, cement_lb_per_cy: 800, unit_cost_cents_per_cy: 19200 }
              as: QualityEngineer
              as_user_id: "qe-bob"
              captures: { mix60_id: $.data.id }
            - call: "POST /mix-designs/${mix60_id}/qualify"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-bob"
            - call: "POST /steam-zones"
              payload: { zone_code: "Z1", boiler_capacity_bhp: 100, therm_rate_cents_per_therm: 95 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { zone_id: $.data.id }
            - call: "POST /casting-beds"
              payload: { bed_code: "B1", steam_zone_id: "${zone_id}", bed_type: "LONG_LINE_PRESTRESS", length_ft: 400, max_strand_force_kips: 900, turnaround_buffer_hours: 6 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bed1_id: $.data.id }
            - call: "POST /casting-beds"
              payload: { bed_code: "B2", steam_zone_id: "${zone_id}", bed_type: "LONG_LINE_PRESTRESS", length_ft: 400, max_strand_force_kips: 900, turnaround_buffer_hours: 6 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bed2_id: $.data.id }
            - call: "POST /bed-runs"
              payload: { bed_id: "${bed1_id}", mix_design_id: "${mix40_id}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-04T06:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { run40_id: $.data.id }
            - call: "POST /bed-runs"
              payload: { bed_id: "${bed2_id}", mix_design_id: "${mix60_id}", scheduled_start: "2026-08-03T06:00:00Z", scheduled_end: "2026-08-04T06:00:00Z" }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
              captures: { run60_id: $.data.id }
          trigger:
            - call: "POST /bed-runs/${run40_id}/tension"
              payload: { strand_count: 24, strand_diameter_in: 0.500, measured_elongation_in: 35.500 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
            - call: "POST /bed-runs/${run60_id}/tension"
              payload: { strand_count: 24, strand_diameter_in: 0.500, measured_elongation_in: 35.500 }
              as: ProductionSupervisor
              as_user_id: "ps-carl"
          assert:
            - "BedRun.${run40_id}.computed_jacking_force_kips == 768.00"
            - "BedRun.${run40_id}.theoretical_elongation_in == 35.225"
            - "BedRun.${run40_id}.elongation_deviation_pct == 0.78"
            - "BedRun.${run60_id}.computed_jacking_force_kips == 773.32"
            - "BedRun.${run60_id}.theoretical_elongation_in == 35.469"
            - "BedRun.${run60_id}.elongation_deviation_pct == 0.09"
            - "BedRun.${run40_id}.computed_jacking_force_kips != 762.17 (the value the seating-loss expression alone yields before the MIN_JACK_KIPS_PER_STRAND floor of 32.00 kips is applied)"
            - "CastingBed.${bed1_id}.committed_strand_force_kips == 768.00"
            - "CastingBed.${bed1_id}.status == OCCUPIED"
            - "CastingBed.${bed2_id}.committed_strand_force_kips == 773.32"
            - "BedRun.${run40_id}.status == TENSIONED"
            - "BedRun.${run60_id}.status == TENSIONED"

      - name: permit_fee_rounds_each_line_before_summing
        grounds:
          - calculations.shipment_permit_fee
          - calculations.shipment_load_metrics
          - entities.ShipmentLine.fields.line_surcharge_cents
          - entities.Shipment.fields.permit_fee_cents
          - state_machines.Piece.production_status.YARDED_to_LOADED
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-line-then-sum. Two identical 9.50 x 13.70 x 53.10 ft
          pieces each accrue a raw surcharge of 1739.60 cents; rounding each to 1740 and summing
          gives a permit_fee_cents of 39480, while summing the raw amounts (3479.20) and rounding
          once gives 39479 - a one-cent divergence that pins the rounding order.
        test_recipe:
          setup:
            - "Two oversize pieces DT-101 (erection_sequence_no 10) and DT-102 (erection_sequence_no 20), each 53.10 x 9.50 x 13.70 ft and 48200 lb, have been cast on run R1, released, stripped and stored in yard slot S1."
            - "Both pieces have qc_status CLEARED."
            - "HaulPermit TN-8891 for the project mandates 1 escort and is linked to shipment SH1, which is still BUILDING with no lines."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
