# =============================================================================
# SCAFFOLD — Task 2913: Bowling League & Sanctioned Average Administration
# Sections §1.0 - §1.7. Difficulty design (§1.8) lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design (§1.9) in
# SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2913. Bowling League & Sanctioned Average Administration (certified bowling
  league): league formation with team composition, schedule and bylaw adoption
  at an organizational meeting, membership sanctioning with member registration
  and fee remittance to the national body, average calculation from certified
  games with minimum game requirements and prior-season carryover, handicap
  formula application from base and percentage with team handicap computation,
  vacancy, substitute and legal lineup rules with forfeit and preallocation
  procedures, prize fund accumulation and distribution formula approved by the
  league, award applications for honor scores with verification requirements,
  protest and rules interpretation escalation to the association

domain_name: bowling-league-sanctioned-average-administration

# Flat topology: every resource is a root-level collection reached by its own
# id; parent scoping travels in request bodies / query filters, not in URL
# nesting. The only nested read is the League -> Team sub-resource list.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: cyclic
  # Membership carries two independent state axes (sanction_status x
  # remittance_status); Protest loops UNDER_REVIEW -> REMANDED -> UNDER_REVIEW;
  # FeeRemittance loops REJECTED -> SUBMITTED; AwardApplication loops
  # RETURNED_FOR_EVIDENCE -> SUBMITTED; Match forks into
  # CERTIFIED | FORFEITED | VOID with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # League -> Team, Team -> Membership, Match -> SeriesEntry
    - many_to_many         # Member <-> League through Membership (season affiliation)
    - cross_aggregate      # AwardApplication -> SeriesEntry, Protest -> Match, PrizeAward -> Team

  role_model: segregation_of_duties
  # The secretary who verifies an honor score may not be the bowler who shot
  # it; the treasurer who disburses may not be the officer who approved the
  # distribution plan; the secretary who filed a protest may not rule on it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 56 endpoints / 58 error codes / 11 calculations /
  # 47 validation rules / 11 state-machine blocks / 3 OCC rules / 5 roles.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- League ---
  - name: League
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Chartered league name.
        constraints: 1..120 chars, non-blank
      - name: season_year
        type: integer
        source: input
        description: Season the charter covers (the 2026-2027 season is 2026).
        constraints: 2000..2100
      - name: center_name
        type: string
        source: input
        description: Bowling center hosting the league.
      - name: declared_team_count
        type: integer
        source: input
        description: Number of teams the organizational meeting declared; League auto-sanctions when confirmed_team_count reaches it.
        constraints: 2..24
      - name: organizational_meeting_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the organizational meeting at which bylaws are adopted.
      - name: secretary_member_id
        type: string
        source: input
        description: "FK -> Member.id; the Member who acts as LeagueSecretary for this league. X-User-ID of a LeagueSecretary request MUST equal this value."
      - name: treasurer_member_id
        type: string
        source: input
        description: "FK -> Member.id; the Member who acts as LeagueTreasurer for this league. X-User-ID of a LeagueTreasurer request MUST equal this value."
      - name: status
        type: enum
        source: system
        description: League lifecycle state.
        default: FORMING
        constraints: "FORMING | BYLAWS_ADOPTED | SANCTIONED | IN_SEASON | SEASON_CLOSED | PRIZES_DISBURSED"
      - name: bylaws_adopted_at
        type: datetime
        source: system
        description: Logical-clock instant at which the current bylaw set was adopted; reset on every re-adoption. Null while FORMING.
      - name: handicap_base
        type: integer
        source: input
        description: Bylaw - scratch base score from which handicap is measured.
        constraints: 180..300, adopted via POST /leagues/{id}/bylaws
      - name: handicap_percentage
        type: number
        source: input
        description: Bylaw - handicap percentage applied to ADULT members.
        constraints: 0.50..1.00, two decimals
      - name: handicap_percentage_youth
        type: number
        source: input
        description: Bylaw - handicap percentage applied to Member.member_class == YOUTH.
        constraints: 0.50..1.00, two decimals
      - name: max_handicap_per_game
        type: integer
        source: input
        description: Bylaw - hard ceiling on any single bowler's handicap_per_game.
        constraints: 0..120
      - name: handicap_average_basis
        type: enum
        source: input
        description: Bylaw - which average feeds the handicap formula.
        constraints: "ENTERING | CURRENT"
      - name: minimum_games_for_average
        type: integer
        source: input
        description: Bylaw - certified games required before an average is ESTABLISHED.
        constraints: 1..30
      - name: carryover_policy
        type: enum
        source: input
        description: Bylaw - how a prior-season record feeds a not-yet-established average.
        constraints: "NONE | PRIOR_SEASON_FULL | BLENDED"
      - name: vacancy_average
        type: integer
        source: input
        description: Bylaw - average attributed to a VACANCY lineup slot when computing team handicap.
        constraints: 0..300
      - name: vacancy_score
        type: integer
        source: input
        description: Bylaw - scratch pins credited per game to a VACANCY slot.
        constraints: 0..300
      - name: absentee_deduction
        type: integer
        source: input
        description: Bylaw - pins subtracted from a bowler's basis average for each game of an ABSENTEE slot.
        constraints: 0..50
      - name: lineup_positions
        type: integer
        source: input
        description: Bylaw - lineup positions per team per match; also the roster depth used by team_handicap_per_game.
        constraints: 2..6
      - name: legal_lineup_minimum
        type: integer
        source: input
        description: Bylaw - minimum positions occupied by a SANCTIONED bowler for a lineup to be legal; also the sanctioned-roster count that confirms a Team.
        constraints: 1..6, <= lineup_positions
      - name: max_vacancy_slots_per_lineup
        type: integer
        source: input
        description: Bylaw - maximum VACANCY slots tolerated in one team lineup.
        constraints: 0..3
      - name: weekly_dues_cents
        type: integer
        source: input
        description: Bylaw - weekly dues per bowler in cents.
        constraints: 0..10000
      - name: weekly_expense_cents
        type: integer
        source: input
        description: Bylaw - non-prize portion of weekly dues in cents; the remainder accrues to the prize fund.
        constraints: 0..weekly_dues_cents
      - name: max_dues_arrears_weeks
        type: integer
        source: input
        description: Bylaw - arrears weeks a bowler may carry and still appear in a lineup.
        constraints: 0..10
      - name: prize_place_weights
        type: array
        source: input
        description: Bylaw - ordered distribution weights, element 0 = first place. Length must equal the plan's place_count and the elements must sum to exactly 1.00.
        constraints: 1..12 numbers, each 0.01..1.00 with two decimals, sum == 1.00
      - name: total_weeks
        type: integer
        source: system
        description: Scheduled weeks; written by POST /leagues/{id}/schedule.
        default: 0
      - name: sanctioned_member_count
        type: integer
        source: computed
        description: count(Membership where league_id == this.id AND sanction_status == SANCTIONED).
        default: 0
      - name: confirmed_team_count
        type: integer
        source: computed
        description: count(Team where league_id == this.id AND status == CONFIRMED).
        default: 0
      - name: certified_week_high_water
        type: integer
        source: computed
        description: Greatest W such that every Match of this league with week_number <= W has status in {CERTIFIED, FORFEITED, VOID}; 0 when week 1 is not fully settled.
        default: 0

  # ---------------------------------------------------------------- Member ---
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Bowler's legal name.
        constraints: 1..120 chars, non-blank
      - name: email
        type: string
        source: input
        description: Contact e-mail; unique across Members.
        constraints: must contain '@', unique
      - name: member_class
        type: enum
        source: input
        description: National membership class; drives the handicap percentage and the sanction fee tier.
        constraints: "ADULT | YOUTH"
      - name: national_member_number
        type: string
        source: system
        description: Number minted by the national body when this Member's first Membership is sanctioned; format "NM-<zero-padded 6-digit sequence in Member.created_at ASC order of first sanctioning>". Null until then.
      - name: sanctioned_membership_count
        type: integer
        source: computed
        description: count(Membership where member_id == this.id AND sanction_status == SANCTIONED).
        default: 0

  # ------------------------------------------------------------------ Team ---
  - name: Team
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; the league this team competes in."
      - name: name
        type: string
        source: input
        description: Team name; unique within the league (case-sensitive).
        constraints: 1..80 chars, unique per league_id
      - name: status
        type: enum
        source: system
        description: PROVISIONAL at creation; CONFIRMED once sanctioned_roster_count reaches league.legal_lineup_minimum. No transition leaves CONFIRMED.
        default: PROVISIONAL
        constraints: "PROVISIONAL | CONFIRMED"
      - name: sanctioned_roster_count
        type: integer
        source: computed
        description: count(Membership where team_id == this.id AND sanction_status == SANCTIONED).
        default: 0
      - name: team_handicap_per_game
        type: integer
        source: computed
        description: Roster team handicap per §1.3 team_handicap_per_game (per-bowler floor first, then sum over the top league.lineup_positions roster handicaps).
        default: 0
      - name: total_points
        type: number
        source: computed
        description: Sum of this team's points over every Match with status in {CERTIFIED, FORFEITED} (VOID matches contribute nothing); one decimal place.
        default: 0
      - name: total_scratch_pins
        type: integer
        source: computed
        description: Sum of scratch pins recorded by this team's SeriesEntry rows on matches with status in {CERTIFIED, FORFEITED}; standings tie-break.
        default: 0

  # ------------------------------------------------------------ Membership ---
  - name: Membership
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; the season affiliation's league."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the person bowling. At most one Membership per (member_id, league_id)."
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; nullable - a SUBSTITUTE may be rostered to no team. Must belong to the same league_id."
      - name: roster_role
        type: enum
        source: input
        description: Roster standing declared at registration.
        constraints: "REGULAR | SUBSTITUTE"
      - name: sanction_status
        type: enum
        source: system
        description: "State axis 1 - national sanctioning. UNSANCTIONED -> PENDING_REMITTANCE -> SANCTIONED; reverts to UNSANCTIONED when the remittance is rejected."
        default: UNSANCTIONED
        constraints: "UNSANCTIONED | PENDING_REMITTANCE | SANCTIONED"
      - name: remittance_status
        type: enum
        source: system
        description: "State axis 2 - fee money, evolving independently of sanction_status. UNPAID -> INVOICED -> REMITTED, or INVOICED -> REFUNDED on rejection."
        default: UNPAID
        constraints: "UNPAID | INVOICED | REMITTED | REFUNDED"
      - name: prior_season_average
        type: integer
        source: input
        description: Certified average carried from the previous season; nullable when the bowler has no prior record.
        constraints: 0..300 when present
      - name: prior_season_games
        type: integer
        source: input
        description: Certified games behind prior_season_average.
        default: 0
        constraints: 0..200
      - name: entering_average
        type: integer
        source: computed
        description: Frozen entering average per §1.3 entering_average; nullable when no usable prior record exists.
      - name: certified_games
        type: integer
        source: computed
        description: Count of recorded games on this membership's certified average-bearing SeriesEntry rows per §1.3 bowler_average input_set.
        default: 0
      - name: certified_pins
        type: integer
        source: computed
        description: Sum of pins over the same games counted by certified_games.
        default: 0
      - name: current_average
        type: integer
        source: computed
        description: Season average per §1.3 bowler_average; nullable when neither certified games nor a usable prior record exist.
      - name: average_status
        type: enum
        source: computed
        description: ESTABLISHED when certified_games >= league.minimum_games_for_average, otherwise PROVISIONAL.
        default: PROVISIONAL
        constraints: "PROVISIONAL | ESTABLISHED"
      - name: handicap_per_game
        type: integer
        source: computed
        description: Per-game handicap per §1.3 bowler_handicap; 0 while sanction_status != SANCTIONED.
        default: 0
      - name: dues_paid_cents
        type: integer
        source: computed
        description: Sum of DuesPayment.amount_cents recorded against this membership.
        default: 0
      - name: dues_arrears_weeks
        type: integer
        source: computed
        description: "max(0, league.certified_week_high_water - count(distinct DuesPayment.week_number for this membership where week_number <= league.certified_week_high_water))."
        default: 0

  # --------------------------------------------------------- FeeRemittance ---
  - name: FeeRemittance
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; league remitting sanction fees to the national body."
      - name: membership_ids
        type: array
        source: input
        description: Ordered list of Membership.id values covered by this remittance; every element must be a Membership of league_id (see the Membership entity). Length 1..60, no duplicates.
      - name: declared_amount_cents
        type: integer
        source: input
        description: Amount the secretary declares on the remittance form; must equal computed_amount_cents at submission.
        constraints: 0..10000000
      - name: computed_amount_cents
        type: integer
        source: computed
        description: Server-computed remittance total per §1.3 remittance_amount; recomputed on every submission.
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: Late-filing penalty component of computed_amount_cents per §1.3 remittance_amount.
        default: 0
      - name: member_count
        type: integer
        source: computed
        description: Length of membership_ids.
        default: 0
      - name: status
        type: enum
        source: system
        description: "DRAFT -> SUBMITTED -> ACCEPTED | REJECTED; REJECTED -> SUBMITTED on re-filing."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED | REJECTED"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submission; null while DRAFT.
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the LeagueSecretary who submitted; audit only, not a foreign key.
      - name: national_receipt_no
        type: string
        source: input
        description: Receipt number supplied by the national body on acceptance; null otherwise.
      - name: rejection_reason
        type: string
        source: input
        description: Reason recorded by the national body on rejection; null otherwise.

  # -------------------------------------------------------------- LanePair ---
  - name: LanePair
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; league whose matches may occupy this lane pair."
      - name: pair_number
        type: integer
        source: input
        description: Lane pair number at the center; unique per league_id.
        constraints: 1..60, unique per league_id
      - name: certified_through
        type: datetime
        source: input
        description: Last instant at which the lane pair's certification is valid (inclusive).
      - name: revoked_at
        type: datetime
        source: system
        description: Logical-clock instant of certification revocation; null unless revoked.
      - name: certification_status
        type: enum
        source: computed
        description: "REVOKED when revoked_at is set; else CERTIFIED when certified_through >= clock now; else EXPIRED."
        constraints: "CERTIFIED | EXPIRED | REVOKED"
      - name: last_certified_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent certification or recertification.

  # ----------------------------------------------------------------- Match ---
  - name: Match
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; league whose schedule contains this match."
      - name: week_number
        type: integer
        source: input
        description: Schedule week this match belongs to.
        constraints: 1..40
      - name: home_team_id
        type: string
        source: input
        description: "FK -> Team.id; home side. Must belong to league_id and differ from away_team_id."
      - name: away_team_id
        type: string
        source: input
        description: "FK -> Team.id; away side. Must belong to league_id."
      - name: lane_pair_id
        type: string
        source: input
        description: "FK -> LanePair.id; lane pair the match occupies. Must belong to league_id."
      - name: forfeiting_team_id
        type: string
        source: input
        description: "FK -> Team.id; side charged with the forfeit. Null unless status == FORFEITED."
      - name: starts_at
        type: datetime
        source: input
        description: Scheduled start instant (inclusive) of the lane-pair occupation.
      - name: ends_at
        type: datetime
        source: input
        description: Scheduled end instant (exclusive) of the lane-pair occupation; must be > starts_at.
      - name: status
        type: enum
        source: system
        description: "DRAFT (created before the league is sanctioned) -> SCHEDULED -> LINEUPS_SUBMITTED -> OPEN -> SCORES_ENTERED -> CERTIFIED, with branches to FORFEITED and to VOID."
        default: DRAFT
        constraints: "DRAFT | SCHEDULED | LINEUPS_SUBMITTED | OPEN | SCORES_ENTERED | CERTIFIED | FORFEITED | VOID"
      - name: home_team_handicap_per_game
        type: integer
        source: computed
        description: Match-time team handicap of the home lineup per §1.3 team_handicap_per_game (lineup variant); 0 until the home lineup is submitted.
        default: 0
      - name: away_team_handicap_per_game
        type: integer
        source: computed
        description: Match-time team handicap of the away lineup per §1.3 team_handicap_per_game (lineup variant); 0 until the away lineup is submitted.
        default: 0
      - name: home_points
        type: number
        source: computed
        description: Points awarded to the home side per §1.3 match_points; one decimal place.
        default: 0
      - name: away_points
        type: number
        source: computed
        description: Points awarded to the away side per §1.3 match_points; one decimal place.
        default: 0
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant at which the match was certified; null unless status == CERTIFIED. Cleared when the match is voided.
      - name: void_reason
        type: string
        source: system
        description: "Protest.id and remedy recorded when a protest voids the match; null otherwise."

  # ----------------------------------------------------------- SeriesEntry ---
  - name: SeriesEntry
    parent: Match
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: "FK -> Match.id; match this lineup slot belongs to."
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; side that owns the slot; must be the match's home_team_id or away_team_id."
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; bowler occupying the slot. Null for VACANCY and FORFEIT slots."
      - name: position
        type: integer
        source: input
        description: Lineup position; unique per (match_id, team_id).
        constraints: 1..league.lineup_positions
      - name: entry_type
        type: enum
        source: input
        description: "REGULAR / SUBSTITUTE / VACANCY / ABSENTEE / PREBOWL are lineup inputs; FORFEIT rows are created only by POST /matches/{id}/forfeit."
        constraints: "REGULAR | SUBSTITUTE | VACANCY | ABSENTEE | PREBOWL | FORFEIT"
      - name: prebowled_at
        type: datetime
        source: input
        description: Instant a PREBOWL series was rolled; required for entry_type == PREBOWL, must be strictly before the match's starts_at, and forbidden otherwise.
      - name: game1_pins
        type: integer
        source: input
        description: Pins for game 1; null when the game was not rolled.
        constraints: 0..300
      - name: game2_pins
        type: integer
        source: input
        description: Pins for game 2; null when the game was not rolled.
        constraints: 0..300
      - name: game3_pins
        type: integer
        source: input
        description: Pins for game 3; null when the game was not rolled.
        constraints: 0..300
      - name: games_recorded
        type: integer
        source: computed
        description: Count of non-null game1_pins/game2_pins/game3_pins.
        default: 0
      - name: scratch_series
        type: integer
        source: computed
        description: Sum of the non-null game pins on this slot.
        default: 0
      - name: handicap_per_game_applied
        type: integer
        source: computed
        description: Per-game handicap frozen onto the slot when the lineup is submitted, per §1.3 team_handicap_per_game slot rules.
        default: 0
      - name: counts_toward_average
        type: boolean
        source: computed
        description: True exactly when entry_type is in {REGULAR, SUBSTITUTE, PREBOWL} and membership_id is not null.
        default: false
      - name: certified
        type: boolean
        source: system
        description: Set true when the match is certified; set back to false when the match is voided.
        default: false

  # ----------------------------------------------------------- DuesPayment ---
  - name: DuesPayment
    parent: Membership
    common_fields: false
    fields:
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; bowler paying weekly dues."
      - name: week_number
        type: integer
        source: input
        description: Schedule week the dues cover; at most one DuesPayment per (membership_id, week_number).
        constraints: 1..league.total_weeks
      - name: amount_cents
        type: integer
        source: input
        description: Cents tendered; must equal the league's weekly_dues_cents.
        constraints: 0..10000
      - name: prize_share_cents
        type: integer
        source: computed
        description: "league.weekly_dues_cents - league.weekly_expense_cents; the portion that accrues to the prize fund."
        default: 0
      - name: expense_share_cents
        type: integer
        source: computed
        description: "league.weekly_expense_cents; the portion retained for league expenses."
        default: 0

  # ------------------------------------------------------------- PrizeFund ---
  - name: PrizeFund
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; league whose prize money this fund holds. Exactly one PrizeFund per league, created by POST /leagues."
      - name: status
        type: enum
        source: system
        description: "ACCUMULATING -> PLAN_DRAFTED -> PLAN_APPROVED -> DISBURSED; DISBURSED reverts to PLAN_APPROVED when a paid award is reversed."
        default: ACCUMULATING
        constraints: "ACCUMULATING | PLAN_DRAFTED | PLAN_APPROVED | DISBURSED"
      - name: collected_prize_cents
        type: integer
        source: computed
        description: Sum of DuesPayment.prize_share_cents over every dues payment of every Membership of this league.
        default: 0
      - name: basis_variant
        type: enum
        source: input
        description: Variant selected when the distribution plan is drafted; decides which §1.3 prize_fund_basis variant feeds plan_basis_cents.
        constraints: "PROJECTED_SEASON_END | CERTIFIED_TO_DATE"
      - name: place_count
        type: integer
        source: input
        description: Number of paying places in the drafted plan; must equal the length of league.prize_place_weights.
        constraints: 1..12
      - name: plan_basis_cents
        type: integer
        source: computed
        description: Basis amount of the drafted plan per §1.3 prize_fund_basis.
        default: 0
      - name: reserve_cents
        type: integer
        source: computed
        description: Reserve withheld from plan_basis_cents per §1.3 prize_distribution_waterfall step 2.
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Association administrative fee per §1.3 prize_distribution_waterfall step 3.
        default: 0
      - name: net_distributable_cents
        type: integer
        source: computed
        description: "plan_basis_cents - reserve_cents - admin_fee_cents."
        default: 0
      - name: paid_award_total_cents
        type: integer
        source: computed
        description: Sum of PrizeAward.amount_cents over this fund's awards with status == PAID.
        default: 0
      - name: undistributed_balance_cents
        type: integer
        source: computed
        description: "collected_prize_cents - paid_award_total_cents; the conserved-money invariant of §1.3 prize_money_conservation."
        default: 0
      - name: plan_drafted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent plan draft; null while ACCUMULATING.
      - name: plan_approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the LeagueSecretary who approved the plan; audit only, compared against the disbursing treasurer for segregation of duties.
      - name: disbursed_at
        type: datetime
        source: system
        description: Logical-clock instant of disbursement; null unless status == DISBURSED.

  # ------------------------------------------------------------ PrizeAward ---
  - name: PrizeAward
    parent: PrizeFund
    common_fields: true
    fields:
      - name: prize_fund_id
        type: string
        source: input
        description: "FK -> PrizeFund.id; fund this award draws from."
      - name: team_id
        type: string
        source: input
        description: "FK -> Team.id; team standing in this place."
      - name: place
        type: integer
        source: computed
        description: Standings place this award pays, 1 = first.
      - name: weight
        type: number
        source: computed
        description: "league.prize_place_weights[place - 1] copied at approval."
      - name: amount_cents
        type: integer
        source: computed
        description: Award amount per §1.3 prize_distribution_waterfall, remainder cents included.
      - name: status
        type: enum
        source: system
        description: "PENDING at plan approval -> PAID at disbursement -> REVERSED when the treasurer reverses the payment."
        default: PENDING
        constraints: "PENDING | PAID | REVERSED"
      - name: reversal_reason
        type: string
        source: input
        description: Reason recorded when the award is reversed; null otherwise.

  # ------------------------------------------------------ AwardApplication ---
  - name: AwardApplication
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; league in which the honor score was shot."
      - name: membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the bowler claiming the honor score."
      - name: series_entry_id
        type: string
        source: input
        description: "FK -> SeriesEntry.id; the slot carrying the claimed score. Its membership_id must equal this application's membership_id."
      - name: award_type
        type: enum
        source: input
        description: Honor-score category claimed; each carries its own threshold in §1.3 honor_score_threshold.
        constraints: "PERFECT_GAME_300 | HIGH_GAME_298_PLUS | SERIES_800_SCRATCH | HANDICAP_SERIES_700"
      - name: claimed_game_number
        type: integer
        source: input
        description: Game 1..3 carrying the claimed game score; required for PERFECT_GAME_300 and HIGH_GAME_298_PLUS, forbidden for the series award types.
        constraints: 1..3
      - name: claimed_pins
        type: integer
        source: computed
        description: Pins evaluated against the award threshold - the claimed game's pins for game awards, SeriesEntry.scratch_series for SERIES_800_SCRATCH, and scratch_series + 3 * handicap_per_game_applied for HANDICAP_SERIES_700.
        default: 0
      - name: status
        type: enum
        source: system
        description: "SUBMITTED -> LEAGUE_VERIFIED -> ASSOCIATION_CERTIFIED | ASSOCIATION_DENIED, with the loop SUBMITTED -> RETURNED_FOR_EVIDENCE -> SUBMITTED."
        default: SUBMITTED
        constraints: "SUBMITTED | RETURNED_FOR_EVIDENCE | LEAGUE_VERIFIED | ASSOCIATION_CERTIFIED | ASSOCIATION_DENIED"
      - name: lane_certification_verified
        type: boolean
        source: computed
        description: True when the match's LanePair had revoked_at null and certified_through >= Match.starts_at at verification time.
        default: false
      - name: sanctioned_at_game_time
        type: boolean
        source: computed
        description: True when the claiming Membership.sanction_status == SANCTIONED and the SeriesEntry.certified is true.
        default: false
      - name: evidence_note
        type: string
        source: input
        description: Free-text evidence supplied by the applicant or requested by the secretary.
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the LeagueSecretary who verified; audit only.
      - name: association_ruling_note
        type: string
        source: input
        description: Note recorded with the association's certification decision.
      - name: round_count
        type: integer
        source: computed
        description: Number of times this application has entered SUBMITTED, counting the initial filing.
        default: 1

  # --------------------------------------------------------------- Protest ---
  - name: Protest
    parent: League
    common_fields: true
    fields:
      - name: league_id
        type: string
        source: input
        description: "FK -> League.id; league whose bylaws the protest invokes."
      - name: match_id
        type: string
        source: input
        description: "FK -> Match.id; match under protest. Null for a pure RULES_INTERPRETATION protest."
      - name: filed_by_membership_id
        type: string
        source: input
        description: "FK -> Membership.id; the bowler filing. Must be a Membership of league_id with sanction_status == SANCTIONED."
      - name: category
        type: enum
        source: input
        description: Protest ground.
        constraints: "LINEUP_LEGALITY | SCORE_ERROR | RULES_INTERPRETATION | ELIGIBILITY"
      - name: protest_note
        type: string
        source: input
        description: Statement of the protest as filed.
        constraints: 1..1000 chars, non-blank
      - name: status
        type: enum
        source: system
        description: "FILED -> UNDER_REVIEW -> {REMANDED -> UNDER_REVIEW} -> UPHELD | DENIED | ESCALATED -> ASSOCIATION_RULED."
        default: FILED
        constraints: "FILED | UNDER_REVIEW | REMANDED | UPHELD | DENIED | ESCALATED | ASSOCIATION_RULED"
      - name: remedy
        type: enum
        source: input
        description: Remedy applied when the protest is upheld by the league or by the association.
        default: NONE
        constraints: "NONE | VOID_MATCH | FORFEIT_AWARD"
      - name: review_round
        type: integer
        source: computed
        description: Number of times the protest has entered UNDER_REVIEW.
        default: 0
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant of filing.
      - name: deadline_at
        type: datetime
        source: computed
        description: "Match.certified_at + 72 hours for a protest citing a match; null when match_id is null. Filing after this instant is refused."
      - name: ruling_note
        type: string
        source: input
        description: League ruling rationale; null until a ruling is recorded.
      - name: association_ruling
        type: string
        source: input
        description: Association's final ruling text; null until ASSOCIATION_RULED.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: League
    state_field: status
    initial_state: FORMING
    terminal_states: []
    transitions:
      - from: FORMING
        to: BYLAWS_ADOPTED
        trigger: "POST /leagues/{id}/bylaws"
        actor: LeagueSecretary
        preconditions:
          - "X-User-ID == League.secretary_member_id"
          - "expected_league_version == League.version"
          - "sum(prize_place_weights) == 1.00 and every weight >= 0.01"
          - "legal_lineup_minimum <= lineup_positions"
          - "weekly_expense_cents <= weekly_dues_cents"
        side_effects:
          - "writes every bylaw field onto the League"
          - "bylaws_adopted_at = logical clock now (this is the instant the §1.3 remittance_amount late-filing window is measured from)"
          - "increments League.version by 1"
      - from: BYLAWS_ADOPTED
        to: BYLAWS_ADOPTED
        trigger: "POST /leagues/{id}/bylaws (amendment re-adopted at a later meeting; supersedes the prior bylaw set)"
        actor: LeagueSecretary
        preconditions:
          - "expected_league_version == League.version"
          - "same bylaw validity checks as the FORMING -> BYLAWS_ADOPTED transition"
        side_effects:
          - "overwrites every bylaw field and resets bylaws_adopted_at to logical clock now"
          - "recomputes Membership.entering_average, Membership.current_average, Membership.average_status and Membership.handicap_per_game for every Membership of the league"
          - "recomputes Team.team_handicap_per_game for every Team of the league"
          - "increments League.version by 1"
        note: "Self-loop; the amendment path is the League's non-linear edge."
      - from: IN_SEASON
        to: IN_SEASON
        trigger: "POST /leagues/{id}/bylaws (special-meeting amendment while the season is under way)"
        actor: LeagueSecretary
        preconditions:
          - "X-User-ID == League.secretary_member_id"
          - "expected_league_version == League.version"
          - "same bylaw validity checks as the FORMING -> BYLAWS_ADOPTED transition"
        side_effects:
          - "overwrites every bylaw field and resets bylaws_adopted_at to logical clock now"
          - "recomputes Membership.entering_average, Membership.current_average, Membership.average_status and Membership.handicap_per_game for every Membership of the league from the already-certified pins (no certified pin is added or removed)"
          - "recomputes Team.team_handicap_per_game for every Team; Match.home_team_handicap_per_game and away_team_handicap_per_game stay frozen at the values captured when each lineup was submitted"
          - "increments League.version by 1"
        note: "Second self-loop; a mid-season amendment re-derives every average and handicap without touching certified pins, which is how the §1.3 bowler_handicap variants are observed on identical data."
      - from: BYLAWS_ADOPTED
        to: SANCTIONED
        trigger: "system: confirmed_team_count reaches declared_team_count (hop 3 of the remittance-acceptance cascade)"
        actor: system
        preconditions:
          - "League.status == BYLAWS_ADOPTED"
          - "confirmed_team_count == declared_team_count"
        side_effects:
          - "hop 4: every Match of this league with status == DRAFT moves to SCHEDULED"
      - from: SANCTIONED
        to: IN_SEASON
        trigger: "POST /matches/{id}/open (the league's first opened match)"
        actor: LeagueSecretary
        preconditions:
          - "League.status == SANCTIONED"
        side_effects:
          - "no further cascade; the league is now in season and dues may be recorded"
      - from: IN_SEASON
        to: SEASON_CLOSED
        trigger: "POST /leagues/{id}/close-season"
        actor: LeagueSecretary
        preconditions:
          - "League.status == IN_SEASON"
          - "every Match of the league has status in {CERTIFIED, FORFEITED, VOID}"
        side_effects:
          - "lineup submission, score entry and match certification are refused from here on"
      - from: SEASON_CLOSED
        to: PRIZES_DISBURSED
        trigger: "POST /prize-funds/{id}/disburse"
        actor: LeagueTreasurer
        preconditions:
          - "League.status == SEASON_CLOSED"
          - "the league's PrizeFund.status == PLAN_APPROVED"
        side_effects:
          - "see the PrizeFund PLAN_APPROVED -> DISBURSED transition"
      - from: PRIZES_DISBURSED
        to: SEASON_CLOSED
        trigger: "POST /prize-awards/{id}/reverse (compensating action)"
        actor: LeagueTreasurer
        preconditions:
          - "the reversed PrizeAward.status == PAID"
        side_effects:
          - "see the PrizeFund DISBURSED -> PLAN_APPROVED transition"

  - entity: Team
    state_field: status
    initial_state: PROVISIONAL
    terminal_states: [CONFIRMED]
    transitions:
      - from: PROVISIONAL
        to: CONFIRMED
        trigger: "system: hop 2 of the remittance-acceptance cascade - a roster Membership reached sanction_status SANCTIONED"
        actor: system
        preconditions:
          - "sanctioned_roster_count >= league.legal_lineup_minimum"
        side_effects:
          - "recomputes Team.team_handicap_per_game per §1.3 team_handicap_per_game (roster variant)"
          - "increments League.confirmed_team_count by 1, which fires hop 3 when it equals League.declared_team_count"

  - entity: Membership
    state_field: sanction_status
    initial_state: UNSANCTIONED
    terminal_states: []
    note: "Axis 1 of two independent state dimensions on Membership; axis 2 is remittance_status below. The two axes advance on the same requests but are not derivable from one another - a REFUNDED row can be UNSANCTIONED, an INVOICED row can be PENDING_REMITTANCE, and a re-filed remittance moves axis 2 REFUNDED -> INVOICED while axis 1 repeats UNSANCTIONED -> PENDING_REMITTANCE."
    transitions:
      - from: UNSANCTIONED
        to: PENDING_REMITTANCE
        trigger: "POST /fee-remittances/{id}/submit"
        actor: LeagueSecretary
        preconditions:
          - "Membership.id is an element of FeeRemittance.membership_ids"
          - "Membership.sanction_status == UNSANCTIONED"
        side_effects:
          - "axis 2 on the same row: remittance_status UNPAID -> INVOICED (or REFUNDED -> INVOICED on a re-filing)"
      - from: PENDING_REMITTANCE
        to: SANCTIONED
        trigger: "POST /fee-remittances/{id}/national-decision with decision == ACCEPT (hop 1 of the remittance-acceptance cascade)"
        actor: AssociationOfficer
        preconditions:
          - "FeeRemittance.status == SUBMITTED"
        side_effects:
          - "axis 2: remittance_status INVOICED -> REMITTED"
          - "Member.national_member_number is minted when it is still null"
          - "recomputes Membership.entering_average, current_average, average_status and handicap_per_game"
          - "increments League.sanctioned_member_count by 1"
          - "hop 2: the roster Team's sanctioned_roster_count increases and the Team moves PROVISIONAL -> CONFIRMED once it reaches league.legal_lineup_minimum"
      - from: PENDING_REMITTANCE
        to: UNSANCTIONED
        trigger: "POST /fee-remittances/{id}/national-decision with decision == REJECT"
        actor: AssociationOfficer
        preconditions:
          - "FeeRemittance.status == SUBMITTED"
        side_effects:
          - "axis 2: remittance_status INVOICED -> REFUNDED"
          - "handicap_per_game is forced back to 0; no Team or League counter changes because the row never reached SANCTIONED"

  - entity: Membership
    state_field: remittance_status
    initial_state: UNPAID
    terminal_states: []
    note: "Axis 2 of two independent state dimensions on Membership."
    transitions:
      - from: UNPAID
        to: INVOICED
        trigger: "POST /fee-remittances/{id}/submit"
        actor: LeagueSecretary
        preconditions:
          - "Membership.id is an element of FeeRemittance.membership_ids"
        side_effects:
          - "FeeRemittance.computed_amount_cents includes this membership's fee tier per §1.3 remittance_amount"
      - from: INVOICED
        to: REMITTED
        trigger: "POST /fee-remittances/{id}/national-decision with decision == ACCEPT"
        actor: AssociationOfficer
        preconditions:
          - "FeeRemittance.status == SUBMITTED"
        side_effects:
          - "the national receipt number is stored on the FeeRemittance"
      - from: INVOICED
        to: REFUNDED
        trigger: "POST /fee-remittances/{id}/national-decision with decision == REJECT"
        actor: AssociationOfficer
        preconditions:
          - "FeeRemittance.status == SUBMITTED"
        side_effects:
          - "fees are treated as returned to the league; the row becomes eligible for a re-filing"
      - from: REFUNDED
        to: INVOICED
        trigger: "POST /fee-remittances/{id}/submit on a REJECTED remittance (re-filing loop)"
        actor: LeagueSecretary
        preconditions:
          - "FeeRemittance.status == REJECTED"
          - "Membership.sanction_status == UNSANCTIONED"
        side_effects:
          - "axis 1 on the same row repeats UNSANCTIONED -> PENDING_REMITTANCE"

  - entity: FeeRemittance
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fee-remittances/{id}/submit"
        actor: LeagueSecretary
        preconditions:
          - "League.status in {BYLAWS_ADOPTED, SANCTIONED, IN_SEASON}"
          - "every Membership in membership_ids has sanction_status == UNSANCTIONED"
          - "declared_amount_cents == computed_amount_cents recomputed at submission time"
        side_effects:
          - "computed_amount_cents, penalty_cents and member_count are written per §1.3 remittance_amount"
          - "submitted_at = logical clock now; submitted_by_user_id = X-User-ID"
          - "every listed Membership advances on both axes (UNSANCTIONED -> PENDING_REMITTANCE, UNPAID -> INVOICED)"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /fee-remittances/{id}/national-decision with decision == ACCEPT"
        actor: AssociationOfficer
        preconditions:
          - "national_receipt_no is supplied"
        side_effects:
          - "hop 1 -> hop 4 of the remittance-acceptance cascade fire in membership_ids order: Membership sanctioning, then Team confirmation, then League sanctioning, then Match release"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fee-remittances/{id}/national-decision with decision == REJECT"
        actor: AssociationOfficer
        preconditions:
          - "rejection_reason is supplied"
        side_effects:
          - "every listed Membership reverts to UNSANCTIONED and its remittance_status becomes REFUNDED"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /fee-remittances/{id}/submit (re-filing loop after a rejection)"
        actor: LeagueSecretary
        preconditions:
          - "declared_amount_cents supplied on the re-filing equals computed_amount_cents recomputed against the current logical clock"
        side_effects:
          - "penalty_cents is recomputed against the current clock, so a re-filing after the 21-day window carries the late penalty"
          - "every listed Membership advances UNSANCTIONED -> PENDING_REMITTANCE and REFUNDED -> INVOICED"

  - entity: LanePair
    state_field: certification_status
    initial_state: CERTIFIED
    terminal_states: [REVOKED]
    transitions:
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system: the logical clock advances strictly past certified_through (observed on any read after POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "revoked_at is null"
          - "certified_through < logical clock now"
        side_effects:
          - "POST /matches/{id}/open on any match assigned to this pair is refused with ERR_LANE_PAIR_NOT_CERTIFIED"
      - from: EXPIRED
        to: CERTIFIED
        trigger: "POST /lane-pairs/{id}/certification with action == RECERTIFY (recertification loop)"
        actor: AssociationOfficer
        preconditions:
          - "revoked_at is null (a REVOKED pair is refused with ERR_LANE_PAIR_NOT_CERTIFIED per §1.4 priority 24)"
          - "certified_through supplied is > logical clock now"
        side_effects:
          - "certified_through is replaced and last_certified_at = logical clock now"
      - from: CERTIFIED
        to: REVOKED
        trigger: "POST /lane-pairs/{id}/certification with action == REVOKE"
        actor: AssociationOfficer
        preconditions:
          - "revoked_at is null"
        side_effects:
          - "revoked_at = logical clock now; every future open on this pair is refused"
      - from: EXPIRED
        to: REVOKED
        trigger: "POST /lane-pairs/{id}/certification with action == REVOKE"
        actor: AssociationOfficer
        preconditions:
          - "revoked_at is null"
        side_effects:
          - "revoked_at = logical clock now"

  - entity: Match
    state_field: status
    initial_state: DRAFT
    terminal_states: [FORFEITED, VOID]
    note: "Branching machine: SCORES_ENTERED forks to CERTIFIED, LINEUPS_SUBMITTED/OPEN fork to FORFEITED, and CERTIFIED forks again to VOID or FORFEITED under a protest remedy, each branch carrying a different side-effect set."
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "system: hop 4 of the remittance-acceptance cascade - the League reached SANCTIONED"
        actor: system
        preconditions:
          - "League.status == SANCTIONED"
        side_effects:
          - "the match becomes eligible for lineup submission"
        note: "A match created by POST /leagues/{id}/schedule while the league is already SANCTIONED or IN_SEASON is created directly in SCHEDULED and never occupies DRAFT."
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /matches/{id}/lineups (only one of the two sides has slots so far)"
        actor: TeamCaptain | LeagueSecretary
        preconditions:
          - "expected_match_version == Match.version"
          - "League.status in {SANCTIONED, IN_SEASON}"
          - "team_id is the match's home_team_id or away_team_id"
          - "every slot with a membership_id names a Membership with sanction_status == SANCTIONED whose team_id equals team_id or whose roster_role == SUBSTITUTE"
          - "every named Membership has dues_arrears_weeks <= league.max_dues_arrears_weeks"
          - "lineup legality per §1.4 priority 32 (ERR_ILLEGAL_LINEUP)"
          - "no bowler buffer conflict per §1.4 priority 28 (ERR_BOWLER_SCHEDULE_CONFLICT)"
        side_effects:
          - "replaces this team's SeriesEntry rows for the match (the prior submission is superseded and its rows are deleted)"
          - "freezes SeriesEntry.handicap_per_game_applied on every created slot"
          - "recomputes the submitting side's team handicap onto Match.home_team_handicap_per_game or away_team_handicap_per_game"
          - "increments Match.version by 1"
      - from: SCHEDULED
        to: LINEUPS_SUBMITTED
        trigger: "POST /matches/{id}/lineups (this submission completes both sides)"
        actor: TeamCaptain | LeagueSecretary
        preconditions:
          - "same preconditions as the SCHEDULED -> SCHEDULED self-loop"
          - "the opposing side already has SeriesEntry rows for this match"
        side_effects:
          - "same slot side effects as the self-loop, plus the match becomes openable"
          - "increments Match.version by 1"
      - from: LINEUPS_SUBMITTED
        to: LINEUPS_SUBMITTED
        trigger: "POST /matches/{id}/lineups (a side re-submits and supersedes its own lineup before the match opens)"
        actor: TeamCaptain | LeagueSecretary
        preconditions:
          - "expected_match_version == Match.version"
          - "same slot preconditions as the SCHEDULED self-loop"
        side_effects:
          - "the superseded side's SeriesEntry rows are deleted and replaced; team handicap is recomputed"
          - "increments Match.version by 1"
      - from: LINEUPS_SUBMITTED
        to: OPEN
        trigger: "POST /matches/{id}/open"
        actor: LeagueSecretary
        preconditions:
          - "the assigned LanePair has revoked_at == null and certified_through >= Match.starts_at"
          - "League.status in {SANCTIONED, IN_SEASON}"
        side_effects:
          - "League SANCTIONED -> IN_SEASON when this is the league's first opened match"
      - from: OPEN
        to: SCORES_ENTERED
        trigger: "POST /matches/{id}/scores"
        actor: LeagueSecretary
        preconditions:
          - "every SeriesEntry of both sides with entry_type in {REGULAR, SUBSTITUTE, ABSENTEE} appears in the payload"
          - "every submitted pin value is 0..300"
        side_effects:
          - "writes game pins and computes SeriesEntry.games_recorded and scratch_series"
          - "computes Match.home_points and Match.away_points per §1.3 match_points"
      - from: SCORES_ENTERED
        to: CERTIFIED
        trigger: "POST /matches/{id}/certify"
        actor: LeagueSecretary
        preconditions:
          - "Match.status == SCORES_ENTERED"
          - "League.status == IN_SEASON"
        side_effects:
          - "hop 1: every SeriesEntry of the match gets certified = true and certified_at = logical clock now on the Match"
          - "hop 2: caused by hop 1 - each Membership behind a certified average-bearing slot recomputes certified_games, certified_pins, current_average, average_status and handicap_per_game per §1.3 bowler_average and §1.3 bowler_handicap"
          - "hop 3: caused by hop 2 - each affected Team recomputes team_handicap_per_game from its new roster handicaps, and total_points / total_scratch_pins absorb this match"
          - "hop 4: caused by hop 1 - League.certified_week_high_water is recomputed and PrizeFund.plan_basis_cents becomes stale for the CERTIFIED_TO_DATE variant"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "POST /matches/{id}/forfeit (a side never turned up and no lineup was ever submitted)"
        actor: LeagueSecretary
        preconditions:
          - "forfeiting_team_id is the match's home_team_id or away_team_id"
        side_effects:
          - "the forfeiting side has no SeriesEntry rows to replace, so FORFEIT rows are created for positions 1..league.lineup_positions with membership_id null, 0 pins and counts_toward_average false"
          - "the forfeiting side receives 0 points and the opponent receives the full 4 points"
          - "the forfeiting side's Match.home_team_handicap_per_game or away_team_handicap_per_game is recomputed from the FORFEIT rows and becomes 0"
      - from: LINEUPS_SUBMITTED
        to: FORFEITED
        trigger: "POST /matches/{id}/forfeit"
        actor: LeagueSecretary
        preconditions:
          - "forfeiting_team_id is the match's home_team_id or away_team_id"
        side_effects:
          - "the forfeiting side's SeriesEntry rows are replaced by FORFEIT rows with membership_id null and 0 pins in all three games (preallocation procedure)"
          - "the forfeiting side receives 0 points and the opponent receives the full 4 points"
          - "the forfeiting side's Match.home_team_handicap_per_game or away_team_handicap_per_game is recomputed from the FORFEIT rows and becomes 0"
          - "the opponent's already-recorded pins keep counts_toward_average true; FORFEIT rows never count"
      - from: OPEN
        to: FORFEITED
        trigger: "POST /matches/{id}/forfeit"
        actor: LeagueSecretary
        preconditions:
          - "forfeiting_team_id is the match's home_team_id or away_team_id"
        side_effects:
          - "identical to the LINEUPS_SUBMITTED -> FORFEITED branch"
      - from: CERTIFIED
        to: VOID
        trigger: "POST /protests/{id}/ruling with decision == UPHOLD and remedy == VOID_MATCH, or POST /protests/{id}/association-ruling with remedy == VOID_MATCH"
        actor: LeagueSecretary | AssociationOfficer
        preconditions:
          - "Protest.match_id == Match.id"
          - "Match.status == CERTIFIED"
        side_effects:
          - "hop 1: Match.status = VOID, certified_at = null, home_points = 0, away_points = 0, void_reason records the protest id and remedy"
          - "hop 2: caused by hop 1 - every SeriesEntry of the match gets certified = false"
          - "hop 3: caused by hop 2 - every affected Membership recomputes certified_games, certified_pins, current_average, average_status and handicap_per_game, landing exactly on its pre-certification values"
          - "hop 4: caused by hop 3 - every affected Team recomputes team_handicap_per_game, total_points and total_scratch_pins, and League.certified_week_high_water is recomputed"
      - from: CERTIFIED
        to: FORFEITED
        trigger: "POST /protests/{id}/ruling with decision == UPHOLD and remedy == FORFEIT_AWARD"
        actor: LeagueSecretary
        preconditions:
          - "Protest.match_id == Match.id and Protest.category == LINEUP_LEGALITY"
          - "Match.status == CERTIFIED"
        side_effects:
          - "forfeiting_team_id is set to the side the protest was filed against; its SeriesEntry rows become FORFEIT rows with 0 pins and certified stays true"
          - "points are rewritten to 0 for the forfeiting side and 4 for the protesting side"
          - "the forfeiting side's bowlers lose those games from certified_games and certified_pins, so their averages and handicaps are recomputed; the protesting side keeps its certified games"
          - "the forfeiting side's Match.home_team_handicap_per_game or away_team_handicap_per_game is recomputed from the FORFEIT rows and becomes 0"
        note: "Divergent branch: unlike VOID, the protesting side's pins and points survive."

  - entity: PrizeFund
    state_field: status
    initial_state: ACCUMULATING
    terminal_states: []
    transitions:
      - from: ACCUMULATING
        to: PLAN_DRAFTED
        trigger: "POST /prize-funds/{id}/distribution-plans"
        actor: LeagueTreasurer
        preconditions:
          - "expected_prize_fund_version == PrizeFund.version"
          - "place_count == length(league.prize_place_weights)"
          - "League.status in {IN_SEASON, SEASON_CLOSED}"
        side_effects:
          - "basis_variant, place_count, plan_basis_cents, reserve_cents, admin_fee_cents and net_distributable_cents are written per §1.3 prize_fund_basis and §1.3 prize_distribution_waterfall"
          - "plan_drafted_at = logical clock now; increments PrizeFund.version by 1"
      - from: PLAN_DRAFTED
        to: PLAN_DRAFTED
        trigger: "POST /prize-funds/{id}/distribution-plans (a fresh draft supersedes the prior one)"
        actor: LeagueTreasurer
        preconditions:
          - "expected_prize_fund_version == PrizeFund.version"
          - "place_count == length(league.prize_place_weights)"
        side_effects:
          - "every plan field is overwritten from the newly selected variant; increments PrizeFund.version by 1"
      - from: PLAN_DRAFTED
        to: PLAN_APPROVED
        trigger: "POST /prize-funds/{id}/approve-plan"
        actor: LeagueSecretary
        preconditions:
          - "League.status == SEASON_CLOSED"
          - "at least place_count Teams of the league have status == CONFIRMED"
        side_effects:
          - "creates one PENDING PrizeAward per place per §1.3 prize_distribution_waterfall, in ascending place order"
          - "plan_approved_by_user_id = X-User-ID"
      - from: PLAN_APPROVED
        to: DISBURSED
        trigger: "POST /prize-funds/{id}/disburse"
        actor: LeagueTreasurer
        preconditions:
          - "X-User-ID != PrizeFund.plan_approved_by_user_id (segregation of duties)"
          - "sum of PENDING PrizeAward.amount_cents <= PrizeFund.undistributed_balance_cents"
        side_effects:
          - "every PENDING PrizeAward becomes PAID; paid_award_total_cents and undistributed_balance_cents are recomputed"
          - "disbursed_at = logical clock now; League SEASON_CLOSED -> PRIZES_DISBURSED"
      - from: DISBURSED
        to: PLAN_APPROVED
        trigger: "POST /prize-awards/{id}/reverse (compensating action)"
        actor: LeagueTreasurer
        preconditions:
          - "the reversed PrizeAward belongs to this fund and has status == PAID"
        side_effects:
          - "the award becomes REVERSED; paid_award_total_cents drops by its amount and undistributed_balance_cents rises by exactly the same amount, so collected_prize_cents == paid_award_total_cents + undistributed_balance_cents still holds"
          - "disbursed_at = null; League PRIZES_DISBURSED -> SEASON_CLOSED"

  - entity: PrizeAward
    state_field: status
    initial_state: PENDING
    terminal_states: [REVERSED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /prize-funds/{id}/disburse"
        actor: LeagueTreasurer
        preconditions:
          - "the parent PrizeFund.status == PLAN_APPROVED"
        side_effects:
          - "PrizeFund.paid_award_total_cents increases by amount_cents"
      - from: PAID
        to: REVERSED
        trigger: "POST /prize-awards/{id}/reverse"
        actor: LeagueTreasurer
        preconditions:
          - "reversal_reason is supplied"
        side_effects:
          - "PrizeFund.paid_award_total_cents decreases by amount_cents and undistributed_balance_cents increases by the same amount"
          - "the parent PrizeFund returns to PLAN_APPROVED"

  - entity: AwardApplication
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [ASSOCIATION_CERTIFIED, ASSOCIATION_DENIED]
    transitions:
      - from: SUBMITTED
        to: LEAGUE_VERIFIED
        trigger: "POST /award-applications/{id}/league-verification with decision == VERIFY"
        actor: LeagueSecretary
        preconditions:
          - "League.secretary_member_id != the applicant Membership's member_id (segregation of duties)"
          - "the cited SeriesEntry's Match.status == CERTIFIED"
          - "claimed_pins >= the award type's threshold per §1.3 honor_score_threshold"
          - "the Match's LanePair had revoked_at null and certified_through >= Match.starts_at"
        side_effects:
          - "verified_by_user_id = X-User-ID; the lane_certification_verified and sanctioned_at_game_time flags computed at submission are re-asserted and must both be true"
      - from: SUBMITTED
        to: RETURNED_FOR_EVIDENCE
        trigger: "POST /award-applications/{id}/league-verification with decision == RETURN_FOR_EVIDENCE"
        actor: LeagueSecretary
        preconditions:
          - "evidence_note is supplied"
        side_effects:
          - "the applicant may resupply evidence, which returns the application to SUBMITTED"
      - from: RETURNED_FOR_EVIDENCE
        to: SUBMITTED
        trigger: "POST /award-applications/{id}/evidence (applicant loop)"
        actor: Bowler
        preconditions:
          - "X-User-ID == the applicant Membership's member_id"
        side_effects:
          - "evidence_note is replaced and round_count increases by 1"
      - from: LEAGUE_VERIFIED
        to: ASSOCIATION_CERTIFIED
        trigger: "POST /award-applications/{id}/association-decision with decision == CERTIFY"
        actor: AssociationOfficer
        preconditions:
          - "lane_certification_verified == true and sanctioned_at_game_time == true"
        side_effects:
          - "association_ruling_note is stored; the honor score is on the national record"
      - from: LEAGUE_VERIFIED
        to: ASSOCIATION_DENIED
        trigger: "POST /award-applications/{id}/association-decision with decision == DENY"
        actor: AssociationOfficer
        preconditions:
          - "association_ruling_note is supplied"
        side_effects:
          - "the claim is closed; no further transition is possible"

  - entity: Protest
    state_field: status
    initial_state: FILED
    terminal_states: [UPHELD, DENIED, ASSOCIATION_RULED]
    note: "Cyclic machine: UNDER_REVIEW -> REMANDED -> UNDER_REVIEW may repeat, each pass incrementing review_round."
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /protests/{id}/review"
        actor: LeagueSecretary
        preconditions:
          - "League.secretary_member_id != the filing Membership's member_id (segregation of duties)"
        side_effects:
          - "review_round increases by 1"
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /protests/{id}/ruling with decision == REMAND"
        actor: LeagueSecretary
        preconditions:
          - "ruling_note is supplied"
          - "review_round < MAX_REVIEW_ROUNDS (3) - a REMAND at review_round 3 is refused with ERR_REVIEW_ROUND_LIMIT per §1.4 priority 42"
        side_effects:
          - "the protest waits for a further hearing; no match state changes"
      - from: REMANDED
        to: UNDER_REVIEW
        trigger: "POST /protests/{id}/review (second and later hearings)"
        actor: LeagueSecretary
        preconditions:
          - "League.secretary_member_id != the filing Membership's member_id"
        side_effects:
          - "review_round increases by 1, unlocking the ESCALATED path at review_round >= 2"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /protests/{id}/ruling with decision == UPHOLD"
        actor: LeagueSecretary
        preconditions:
          - "ruling_note is supplied"
          - "remedy == NONE, or remedy == VOID_MATCH with Match.status == CERTIFIED, or remedy == FORFEIT_AWARD with Match.status == CERTIFIED and category == LINEUP_LEGALITY"
        side_effects:
          - "the remedy is applied to the cited Match (see the Match CERTIFIED -> VOID and CERTIFIED -> FORFEITED branches)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /protests/{id}/ruling with decision == DENY"
        actor: LeagueSecretary
        preconditions:
          - "ruling_note is supplied"
        side_effects:
          - "no match state changes"
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /protests/{id}/ruling with decision == ESCALATE"
        actor: LeagueSecretary
        preconditions:
          - "ruling_note is supplied"
          - "category == RULES_INTERPRETATION or review_round >= 2"
        side_effects:
          - "jurisdiction passes to the association; the league may no longer rule"
      - from: ESCALATED
        to: ASSOCIATION_RULED
        trigger: "POST /protests/{id}/association-ruling"
        actor: AssociationOfficer
        preconditions:
          - "association_ruling is supplied"
          - "remedy == NONE, or remedy == VOID_MATCH with Match.status == CERTIFIED"
        side_effects:
          - "the association's remedy is applied to the cited Match (same hops as a league UPHOLD)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version - the only sanctioned
# write-write conflict mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: bylaws-adopt-stale-league
    parent_entity: League
    write_endpoint: "POST /leagues/{id}/bylaws"
    occ_field: "expected_league_version"
    description: |
      Adopting a bylaw set against a League whose version has advanced since
      the client last read it is refused. A bylaw adoption legitimately
      supersedes the prior set, so the second adoption would otherwise succeed
      on identical state and silently overwrite an amendment the client never
      saw - including a changed handicap_base that every membership handicap
      derives from.
    error_id: ERR_STALE_LEAGUE_VERSION
    http_status: 412

  - rule_id: lineup-submit-stale-match
    parent_entity: Match
    write_endpoint: "POST /matches/{id}/lineups"
    occ_field: "expected_match_version"
    description: |
      Submitting a lineup against a Match whose version has advanced is
      refused. Because a re-submission legitimately supersedes and deletes the
      side's prior SeriesEntry rows, a submission carrying a stale version
      would overwrite a lineup revision the submitter never observed.
    error_id: ERR_STALE_MATCH_VERSION
    http_status: 412

  - rule_id: distribution-plan-stale-fund
    parent_entity: PrizeFund
    write_endpoint: "POST /prize-funds/{id}/distribution-plans"
    occ_field: "expected_prize_fund_version"
    description: |
      Drafting a distribution plan against a PrizeFund whose version has
      advanced is refused. A fresh draft legitimately supersedes the prior
      one, so a stale draft would replace plan figures computed from a
      different basis_variant without the drafter ever seeing them.
    error_id: ERR_STALE_PRIZE_FUND_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: entering_average
    trigger: "On POST /memberships, on the Membership PENDING_REMITTANCE -> SANCTIONED transition, and on every League BYLAWS_ADOPTED -> BYLAWS_ADOPTED amendment"
    algorithm: threshold
    formula: |
      IF prior_season_average IS NOT NULL
         AND prior_season_games >= MIN_PRIOR_GAMES_FOR_CARRYOVER
         AND league.carryover_policy IN {PRIOR_SEASON_FULL, BLENDED}:
             entering_average = prior_season_average
      ELSE:
             entering_average = NULL
    input_set: "The Membership's own declared prior-season record only; no SeriesEntry data participates."
    constants:
      MIN_PRIOR_GAMES_FOR_CARRYOVER: 21
    precision: "integer; no rounding occurs (the value is copied)"

  - name: bowler_average
    trigger: "On the Match SCORES_ENTERED -> CERTIFIED transition (hop 2), on the Match CERTIFIED -> VOID and CERTIFIED -> FORFEITED transitions (decertification), and on every League bylaw amendment"
    algorithm: aggregation
    formula: |
      # (a) input set - certified, average-bearing slots of this membership only
      rows = SeriesEntry WHERE membership_id == this.id
                           AND certified == true
                           AND counts_toward_average == true
      certified_games = SUM(rows.games_recorded)
      certified_pins  = SUM(rows.scratch_series)

      # (b) variant selection on the minimum-games threshold
      IF certified_games >= league.minimum_games_for_average:
          average_status  = ESTABLISHED
          current_average = floor(certified_pins / certified_games)     # variant established_current_only
      ELSE:
          average_status = PROVISIONAL                                   # variant provisional_carryover
          IF league.carryover_policy == NONE:
              current_average = (certified_games >= 1)
                                ? floor(certified_pins / certified_games) : NULL
          ELIF league.carryover_policy == PRIOR_SEASON_FULL:
              current_average = (entering_average IS NOT NULL)
                                ? entering_average
                                : ((certified_games >= 1) ? floor(certified_pins / certified_games) : NULL)
          ELSE:   # BLENDED
              current_average = (entering_average IS NOT NULL)
                  ? floor((entering_average * prior_season_games + certified_pins)
                          / (prior_season_games + certified_games))
                  : ((certified_games >= 1) ? floor(certified_pins / certified_games) : NULL)
    input_set: "SeriesEntry rows with certified == true AND counts_toward_average == true (entry_type IN {REGULAR, SUBSTITUTE, PREBOWL} with a non-null membership_id). VACANCY, ABSENTEE and FORFEIT slots are excluded, and rows on DRAFT/SCHEDULED/LINEUPS_SUBMITTED/OPEN/SCORES_ENTERED/VOID matches are excluded because they are not certified."
    constants: {}
    precision: "integer, truncate toward zero (bowling convention); never round half up"
    variants:
      - name: established_current_only
        when: "certified_games >= league.minimum_games_for_average"
        difference: "Ignores the prior-season record entirely; the average is the truncated quotient of certified pins over certified games."
      - name: provisional_carryover
        when: "certified_games < league.minimum_games_for_average"
        difference: "Blends or substitutes the prior-season record per league.carryover_policy, so the same certified pins yield a different average than the established variant would."

  - name: bowler_handicap
    trigger: "Whenever bowler_average is recomputed, on the Membership PENDING_REMITTANCE -> SANCTIONED and PENDING_REMITTANCE -> UNSANCTIONED transitions, and on every League bylaw amendment"
    algorithm: threshold
    formula: |
      IF sanction_status != SANCTIONED:
          handicap_per_game = 0                       # gate: unsanctioned bowlers carry no handicap
      ELSE:
          IF league.handicap_average_basis == ENTERING:
              basis_average = entering_average                              # variant entering_basis
          ELSE:                                                            # CURRENT
              basis_average = (current_average IS NOT NULL)
                              ? current_average : entering_average          # variant current_basis
          IF basis_average IS NULL:
              handicap_per_game = 0
          ELSE:
              pct = (Member(member_id).member_class == YOUTH)
                    ? league.handicap_percentage_youth
                    : league.handicap_percentage
              handicap_per_game = min(league.max_handicap_per_game,
                                      floor(max(0, league.handicap_base - basis_average) * pct))
    input_set: "The Membership's own averages, its Member's member_class, and the league's bylaw fields. No sibling membership participates."
    constants: {}
    precision: "integer; the product is floored BEFORE the max_handicap_per_game ceiling is applied"
    variants:
      - name: entering_basis
        when: "league.handicap_average_basis == ENTERING"
        difference: "Uses the frozen entering_average, so certified games rolled this season never move the handicap."
      - name: current_basis
        when: "league.handicap_average_basis == CURRENT"
        difference: "Uses the live current_average, so the identical certified pins produce a different handicap than the entering basis - a bowler entering at 180 who has blended up to 182 draws 34 instead of 36 at base 220 / 0.90."

  - name: team_handicap_per_game
    trigger: "Team.team_handicap_per_game on the Team PROVISIONAL -> CONFIRMED transition, on cascade hop 3 of match certification, on match voiding and on bylaw amendment; Match.home_team_handicap_per_game / away_team_handicap_per_game on every POST /matches/{id}/lineups"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER - each bowler's handicap is floored FIRST, then the
      # floored integers are summed. Summing the unrounded products and flooring
      # once is WRONG and yields a different integer (e.g. averages
      # 178/183/191/205 at base 220 / 0.90 give 37+33+26+13 = 109 per-bowler,
      # but floor((42+37+29+15) * 0.90) = 110 if flooring is deferred).

      # variant roster_depth (Team.team_handicap_per_game)
      candidates = Membership WHERE team_id == team.id AND sanction_status == SANCTIONED
      ranked     = candidates ORDER BY handicap_per_game DESC, created_at ASC
      chosen     = first min(league.lineup_positions, count(ranked)) rows of ranked
      Team.team_handicap_per_game = SUM(chosen.handicap_per_game)

      # variant lineup_actual (Match.<side>_team_handicap_per_game)
      FOR each SeriesEntry s of the side, handicap_per_game_applied is frozen at
      lineup submission as:
        REGULAR | SUBSTITUTE | PREBOWL -> Membership(s.membership_id).handicap_per_game
        VACANCY   -> min(league.max_handicap_per_game,
                         floor(max(0, league.handicap_base - league.vacancy_average)
                               * league.handicap_percentage))
        ABSENTEE  -> min(league.max_handicap_per_game,
                         floor(max(0, league.handicap_base
                                      - max(0, basis_average - league.absentee_deduction))
                               * pct))          # basis_average and pct per bowler_handicap
        FORFEIT   -> 0
      Match.<side>_team_handicap_per_game = SUM(handicap_per_game_applied of that side's slots)
    input_set: "roster_depth: SANCTIONED memberships of the team, ranked by handicap_per_game DESC then created_at ASC, truncated to league.lineup_positions (fewer candidates are all taken; no vacancy padding). lineup_actual: exactly the SeriesEntry rows of that side on that match."
    constants: {}
    precision: "integer; per-bowler floor first, then integer summation - the summation itself introduces no rounding"
    variants:
      - name: roster_depth
        when: "reading Team.team_handicap_per_game"
        difference: "Ranks the whole sanctioned roster and keeps the top league.lineup_positions handicaps, so a deep roster's team handicap differs from any single lineup's."
      - name: lineup_actual
        when: "reading Match.home_team_handicap_per_game or Match.away_team_handicap_per_game"
        difference: "Sums the handicaps frozen onto the submitted slots, including VACANCY and ABSENTEE substitutes that no roster ranking would ever select."

  - name: match_points
    trigger: "On the Match OPEN -> SCORES_ENTERED transition, and rewritten on the LINEUPS_SUBMITTED/OPEN -> FORFEITED and CERTIFIED -> FORFEITED transitions"
    algorithm: threshold
    formula: |
      IF Match.status == FORFEITED:
          points(forfeiting side) = 0
          points(opposing side)   = POINTS_PER_MATCH          # full award, no game comparison
      ELSE:
          FOR g IN 1..3:
              side_total(g) = SUM over that side's slots of
                                  (game{g}_pins IF entry_type != VACANCY
                                   ELSE league.vacancy_score,
                                   treating NULL as 0 and FORFEIT rows as 0)
                              + Match.<side>_team_handicap_per_game
              IF home_total(g) > away_total(g):  home += 1
              ELIF away_total(g) > home_total(g): away += 1
              ELSE: home += 0.5 ; away += 0.5
          series_total(side) = side_total(1) + side_total(2) + side_total(3)
          IF home series_total > away series_total:  home += 1
          ELIF away > home: away += 1
          ELSE: home += 0.5 ; away += 0.5
    input_set: "Only the SeriesEntry rows of the match itself; the per-game team handicap is the value frozen on the Match at lineup submission, never a live roster recompute."
    constants:
      POINTS_PER_MATCH: 4
    precision: "one decimal place; only .0 and .5 arise"

  - name: remittance_amount
    trigger: "On every FeeRemittance DRAFT -> SUBMITTED and REJECTED -> SUBMITTED transition"
    algorithm: tiered_pricing
    formula: |
      elapsed_days = floor((submitted_at - league.bylaws_adopted_at) / 86400 seconds)
      penalty_per_member = (elapsed_days > LATE_FILING_GRACE_DAYS)
                           ? LATE_PENALTY_CENTS : 0
      FOR each membership m in membership_ids (in list order):
          national_fee(m) = (Member(m.member_id).member_class == ADULT)
                            ? NATIONAL_FEE_ADULT_CENTS : NATIONAL_FEE_YOUTH_CENTS
      member_count            = count(membership_ids)
      penalty_cents           = member_count * penalty_per_member
      computed_amount_cents   = SUM(national_fee(m) + LOCAL_ASSOCIATION_FEE_CENTS)
                                + penalty_cents
    input_set: "Exactly the memberships listed in membership_ids, each priced by its Member.member_class at submission time; memberships of the league that are absent from the list are not priced."
    constants:
      NATIONAL_FEE_ADULT_CENTS: 2600
      NATIONAL_FEE_YOUTH_CENTS: 1200
      LOCAL_ASSOCIATION_FEE_CENTS: 500
      LATE_FILING_GRACE_DAYS: 21
      LATE_PENALTY_CENTS: 1000
    precision: "integer cents; elapsed_days is a floor of whole days, so the penalty flips only when elapsed_days is strictly greater than 21"

  - name: prize_fund_basis
    trigger: "On the PrizeFund ACCUMULATING -> PLAN_DRAFTED and PLAN_DRAFTED -> PLAN_DRAFTED transitions"
    algorithm: forward_looking
    formula: |
      prize_share_per_week_cents = league.weekly_dues_cents - league.weekly_expense_cents
      settled = SUM of DuesPayment.prize_share_cents over every DuesPayment whose
                Membership.league_id == league.id
                AND week_number <= league.certified_week_high_water

      # variant certified_to_date
      plan_basis_cents = settled

      # variant projected_season_end
      weeks_remaining  = max(0, league.total_weeks - league.certified_week_high_water)
      plan_basis_cents = settled
                         + weeks_remaining
                           * league.sanctioned_member_count
                           * prize_share_per_week_cents
    input_set: "Dues payments are included only when their week_number is at or below league.certified_week_high_water; dues already collected for a week whose matches are not all settled are excluded from `settled` under both variants."
    constants: {}
    precision: "integer cents; no rounding (all terms are integers)"
    variants:
      - name: certified_to_date
        when: "basis_variant == CERTIFIED_TO_DATE (the settled-money basis; it is legal from IN_SEASON onward and is how the final plan is drafted once the season is closed)"
        difference: "Counts only money already collected for fully settled weeks; ignores the remaining schedule entirely."
      - name: projected_season_end
        when: "basis_variant == PROJECTED_SEASON_END (the provisional plan drafted mid-season)"
        difference: "Adds a projection of every remaining week's dues for every sanctioned member, so identical dues data produces a strictly larger basis whenever weeks_remaining > 0 - 11200 becomes 16800 for 8 sanctioned members, 1 remaining week and a 700-cent weekly prize share."

  - name: prize_distribution_waterfall
    trigger: "On the PrizeFund ACCUMULATING/PLAN_DRAFTED -> PLAN_DRAFTED transition (figures) and on PLAN_DRAFTED -> PLAN_APPROVED (PrizeAward rows)"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER. The reserve tier is read from plan_basis_cents,
      # NOT from the net that the reserve itself reduces, and the admin fee is a
      # percentage of the post-reserve amount. Evaluating the tier against the
      # net (which depends on the reserve, which depends on the tier) is the
      # circular reading this order forbids.
      STEP 1: reserve_pct = (plan_basis_cents >= RESERVE_TIER_THRESHOLD_CENTS)
                            ? RESERVE_PCT_AT_OR_ABOVE_TIER : RESERVE_PCT_BELOW_TIER
      STEP 2: reserve_cents = floor(plan_basis_cents * reserve_pct)
      STEP 3: admin_fee_cents = round_half_up((plan_basis_cents - reserve_cents)
                                              * ASSOCIATION_ADMIN_PCT)
      STEP 4: net_distributable_cents = plan_basis_cents - reserve_cents - admin_fee_cents

      # Standings that decide which team stands in which place
      STEP 5: candidates = Team WHERE league_id == league.id AND status == CONFIRMED
              ranked     = candidates ORDER BY total_points DESC,
                                               total_scratch_pins DESC,
                                               created_at ASC          # never id
              IF count(candidates) < place_count: reject with ERR_NO_ELIGIBLE_TEAMS
              place p (1..place_count) belongs to ranked[p-1]

      # Waterfall with an explicit remainder rule
      STEP 6: raw(p) = floor(net_distributable_cents * league.prize_place_weights[p-1])
      STEP 7: remainder = net_distributable_cents - SUM(raw(p))
              allocate the remainder one cent at a time to places in ASCENDING
              place order starting at place 1, wrapping back to place 1 if the
              remainder exceeds place_count
              amount_cents(p) = raw(p) + cents allocated to p
    input_set: "plan_basis_cents as computed by prize_fund_basis for the selected variant; teams with status == PROVISIONAL are never candidates, so their pins and points do not shift any place."
    constants:
      RESERVE_TIER_THRESHOLD_CENTS: 100000
      RESERVE_PCT_BELOW_TIER: 0.05
      RESERVE_PCT_AT_OR_ABOVE_TIER: 0.08
      ASSOCIATION_ADMIN_PCT: 0.03
    precision: "integer cents; reserve floors, admin fee rounds half up, per-place amounts floor and the floor remainder is fully allocated so SUM(amount_cents) == net_distributable_cents exactly"

  - name: honor_score_threshold
    trigger: "On POST /award-applications (claimed_pins and the threshold check) and re-evaluated on the SUBMITTED -> LEAGUE_VERIFIED transition"
    algorithm: threshold
    formula: |
      s = SeriesEntry(series_entry_id)
      CASE award_type:
        PERFECT_GAME_300:     claimed_pins = s.game{claimed_game_number}_pins
                              eligible IFF claimed_pins == 300
        HIGH_GAME_298_PLUS:   claimed_pins = s.game{claimed_game_number}_pins
                              eligible IFF 298 <= claimed_pins <= 299
        SERIES_800_SCRATCH:   claimed_pins = s.scratch_series
                              eligible IFF claimed_pins >= 800
        HANDICAP_SERIES_700:  claimed_pins = s.scratch_series
                                             + 3 * s.handicap_per_game_applied
                              eligible IFF claimed_pins >= 700
    input_set: "One SeriesEntry row, which must be certified and average-bearing (counts_toward_average == true); VACANCY, ABSENTEE and FORFEIT slots can never carry an honor score."
    constants:
      PERFECT_GAME_PINS: 300
      HIGH_GAME_FLOOR: 298
      SERIES_SCRATCH_FLOOR: 800
      SERIES_HANDICAP_FLOOR: 700
    precision: "integer pins; the comparisons are inclusive at the floor (>= 800 and >= 700) and exact at 300"

  - name: certified_pin_conservation
    trigger: "Invariant re-asserted after every Match certify, void and protest-driven forfeit"
    algorithm: aggregation
    formula: |
      FOR every Membership m:
        m.certified_games == SUM(s.games_recorded) and
        m.certified_pins  == SUM(s.scratch_series)
        over s IN SeriesEntry WHERE s.membership_id == m.id
                                AND s.certified == true
                                AND s.counts_toward_average == true

      Compensating pair: POST /matches/{id}/certify followed by a protest remedy
      VOID_MATCH on the same match MUST return m.certified_games and
      m.certified_pins to the exact integers they held before the certify call,
      and therefore m.current_average, m.average_status and m.handicap_per_game
      to their pre-certify values as well.
    input_set: "All certified average-bearing slots of the membership across every match of the league."
    constants: {}
    precision: "exact integers; no drift of even one pin is tolerated"

  - name: prize_money_conservation
    trigger: "Invariant re-asserted after every dues payment, plan approval, disbursement and award reversal"
    algorithm: aggregation
    formula: |
      FOR every PrizeFund f:
        f.collected_prize_cents == f.paid_award_total_cents
                                   + f.undistributed_balance_cents
      where f.paid_award_total_cents == SUM(PrizeAward.amount_cents
                                            WHERE prize_fund_id == f.id
                                              AND status == PAID)

      Compensating pair: POST /prize-funds/{id}/disburse followed by
      POST /prize-awards/{id}/reverse on every paid award MUST restore
      f.undistributed_balance_cents to its exact pre-disbursement value and
      f.paid_award_total_cents to 0, leaving collected_prize_cents untouched.
    input_set: "Every DuesPayment of every Membership of the league feeds collected_prize_cents; only PAID awards reduce the undistributed balance (PENDING and REVERSED awards never do)."
    constants: {}
    precision: "exact integer cents; the reserve and admin fee remain inside undistributed_balance_cents and are never treated as paid"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST violated rule decides the response and no later rule is
#      consulted, so a request that violates several rules always returns the
#      lowest-priority-number error)
# =============================================================================
validations:

  # --- 1-3: authentication and role ------------------------------------------
  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles AND that role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For the entity_backed roles (Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer), X-User-ID is the id of an existing Member"
    error_id: ERR_UNKNOWN_ACTOR
    http_status: 403
    applies_to: "all endpoints whose roles list contains an entity_backed role"

  # --- 4-5: existence --------------------------------------------------------
  - priority: 4
    category: existence
    check: "Every resource named by a path parameter exists, resolved left to right"
    error_id: ERR_LEAGUE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters; the concrete code is the ERR_<ENTITY>_NOT_FOUND of the first missing path resource (ERR_LEAGUE_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_TEAM_NOT_FOUND, ERR_MEMBERSHIP_NOT_FOUND, ERR_FEE_REMITTANCE_NOT_FOUND, ERR_LANE_PAIR_NOT_FOUND, ERR_MATCH_NOT_FOUND, ERR_SERIES_ENTRY_NOT_FOUND, ERR_DUES_PAYMENT_NOT_FOUND, ERR_PRIZE_FUND_NOT_FOUND, ERR_PRIZE_AWARD_NOT_FOUND, ERR_AWARD_APPLICATION_NOT_FOUND, ERR_PROTEST_NOT_FOUND)"

  - priority: 5
    category: existence
    check: "Every id carried in the request body resolves to an existing row, in declaration order of the input list"
    error_id: ERR_MEMBERSHIP_NOT_FOUND
    http_status: 404
    applies_to: "POST /teams, POST /memberships, POST /leagues, POST /lane-pairs, POST /fee-remittances, POST /matches/{id}/lineups, POST /award-applications, POST /protests; the concrete code is the ERR_<ENTITY>_NOT_FOUND of the first unresolvable body id"

  # --- 6-8: ownership and officer binding (needs the resource loaded, so it
  #          follows existence and precedes shape checks) ---------------------
  - priority: 6
    category: auth
    check: "When the acting role is LeagueSecretary, X-User-ID equals League.secretary_member_id of the league the target resource belongs to"
    error_id: ERR_NOT_LEAGUE_SECRETARY
    http_status: 403
    applies_to: "every POST endpoint whose roles list contains LeagueSecretary (read endpoints carry no officer binding)"

  - priority: 7
    category: auth
    check: "When the acting role is LeagueTreasurer, X-User-ID equals League.treasurer_member_id of the league the target resource belongs to"
    error_id: ERR_NOT_LEAGUE_TREASURER
    http_status: 403
    applies_to: "every POST endpoint whose roles list contains LeagueTreasurer (read endpoints carry no officer binding)"

  - priority: 8
    category: auth
    check: "When the acting role is Bowler, X-User-ID equals Member.id behind the membership the request acts on; when it is TeamCaptain, X-User-ID is the Member behind some Membership of this league whose team_id equals the team the request acts for (the captaincy is carried by the X-User-Role header, not by a roster field, so roster_role REGULAR and SUBSTITUTE are both acceptable and the membership need not be SANCTIONED - the slots themselves are gated by priority 23)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /memberships/{id}/dues-payments, POST /award-applications, POST /award-applications/{id}/evidence, POST /protests, POST /matches/{id}/lineups"

  # --- 9: request shape ------------------------------------------------------
  - priority: 9
    category: business_constraint
    check: "All required inputs are present; enum inputs carry a declared value; integers are integers; cents and pins are non-negative; percentages are in [0, 1]; array inputs are non-empty; ISO-8601 instants parse and carry an explicit UTC offset; conditionally-required inputs obey their declared condition in both directions (claimed_game_number is required for award_type PERFECT_GAME_300 and HIGH_GAME_298_PLUS and forbidden for the two series award types; prebowled_at is required on a PREBOWL slot and forbidden on every other entry_type; membership_id is required on REGULAR, SUBSTITUTE, PREBOWL and ABSENTEE slots and forbidden on a VACANCY slot; certified_through is required for action RECERTIFY and forbidden for action REVOKE; national_receipt_no is required for decision ACCEPT and rejection_reason for decision REJECT on a national decision); pagination limit is in 1..100 and offset is >= 0; and cross-field bylaw coherence holds (sum(prize_place_weights) == 1.00 with every weight >= 0.01, legal_lineup_minimum <= lineup_positions, max_vacancy_slots_per_lineup < lineup_positions, weekly_expense_cents <= weekly_dues_cents, vacancy_average <= handicap_base)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with an input list"

  # --- 10-11: referential coherence -----------------------------------------
  - priority: 10
    category: business_referential
    check: "Every entity referenced together in one request belongs to the same League (team and membership on a lineup slot, membership and series entry on an award application, match and filing membership on a protest, memberships listed on a fee remittance)"
    error_id: ERR_CROSS_LEAGUE_REFERENCE
    http_status: 422
    applies_to: "POST /memberships, POST /fee-remittances, POST /matches/{id}/lineups, POST /award-applications, POST /protests, POST /leagues/{id}/schedule"

  - priority: 11
    category: business_referential
    check: "Referenced rows stand in the required relationship: series_entry_id on an award application belongs to membership_id; the team a lineup is submitted for is the match's home_team_id or away_team_id; the forfeiting team is a participant of the match; a protest's match belongs to the protest's league"
    error_id: ERR_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /matches/{id}/lineups, POST /matches/{id}/forfeit, POST /award-applications, POST /protests"

  # --- 12-14: optimistic concurrency (§1.2.1) --------------------------------
  - priority: 12
    category: state
    check: "expected_league_version equals the League's current version"
    error_id: ERR_STALE_LEAGUE_VERSION
    http_status: 412
    applies_to: "POST /leagues/{id}/bylaws"

  - priority: 13
    category: state
    check: "expected_match_version equals the Match's current version"
    error_id: ERR_STALE_MATCH_VERSION
    http_status: 412
    applies_to: "POST /matches/{id}/lineups"

  - priority: 14
    category: state
    check: "expected_prize_fund_version equals the PrizeFund's current version"
    error_id: ERR_STALE_PRIZE_FUND_VERSION
    http_status: 412
    applies_to: "POST /prize-funds/{id}/distribution-plans"

  # --- 15-22: state preconditions -------------------------------------------
  - priority: 15
    category: state
    check: "The League's status admits the requested operation (bylaw adoption needs FORMING, and an amendment needs BYLAWS_ADOPTED or IN_SEASON; schedule generation needs BYLAWS_ADOPTED; team, membership and lane-pair creation need FORMING or BYLAWS_ADOPTED; match operations need SANCTIONED or IN_SEASON; season close needs IN_SEASON with every Match already CERTIFIED, FORFEITED or VOID; plan approval and disbursement need SEASON_CLOSED; a weekly dues payment and a fee remittance carry no league-status gate of their own beyond their own priority 21 membership gate, so arrears may still be settled after the season closes)"
    error_id: ERR_LEAGUE_STATE_INVALID
    http_status: 409
    applies_to: "all league-scoped mutations"

  - priority: 16
    category: state
    check: "The Match's status admits the requested transition (lineups need DRAFT, SCHEDULED or LINEUPS_SUBMITTED; open needs LINEUPS_SUBMITTED; scores need OPEN; certify needs SCORES_ENTERED; forfeit needs SCHEDULED, LINEUPS_SUBMITTED or OPEN - the CERTIFIED -> FORFEITED branch is reached only through an upheld protest remedy, never through POST /matches/{id}/forfeit)"
    error_id: ERR_MATCH_STATE_INVALID
    http_status: 409
    applies_to: "POST /matches/{id}/lineups, POST /matches/{id}/open, POST /matches/{id}/scores, POST /matches/{id}/certify, POST /matches/{id}/forfeit"

  - priority: 17
    category: state
    check: "The FeeRemittance's status admits the transition (submit needs DRAFT or REJECTED; a national decision needs SUBMITTED)"
    error_id: ERR_REMITTANCE_STATE_INVALID
    http_status: 409
    applies_to: "POST /fee-remittances/{id}/submit, POST /fee-remittances/{id}/national-decision"

  - priority: 18
    category: state
    check: "The PrizeFund's status admits the transition (draft needs ACCUMULATING or PLAN_DRAFTED; approve needs PLAN_DRAFTED; disburse needs PLAN_APPROVED; award reversal needs the fund DISBURSED)"
    error_id: ERR_PRIZE_FUND_STATE_INVALID
    http_status: 409
    applies_to: "POST /prize-funds/{id}/distribution-plans, POST /prize-funds/{id}/approve-plan, POST /prize-funds/{id}/disburse, POST /prize-awards/{id}/reverse"

  - priority: 19
    category: state
    check: "The AwardApplication's status admits the transition (league verification needs SUBMITTED; evidence resubmission needs RETURNED_FOR_EVIDENCE; an association decision needs LEAGUE_VERIFIED)"
    error_id: ERR_AWARD_APPLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /award-applications/{id}/league-verification, POST /award-applications/{id}/evidence, POST /award-applications/{id}/association-decision"

  - priority: 20
    category: state
    check: "The Protest's status admits the transition (review needs FILED or REMANDED; a ruling needs UNDER_REVIEW; an ESCALATE ruling additionally needs category == RULES_INTERPRETATION or review_round >= 2; an association ruling needs ESCALATED)"
    error_id: ERR_PROTEST_STATE_INVALID
    http_status: 409
    applies_to: "POST /protests/{id}/review, POST /protests/{id}/ruling, POST /protests/{id}/association-ruling"

  - priority: 21
    category: state
    check: "The Membership's sanction_status and remittance_status admit the operation (a dues payment needs sanction_status SANCTIONED; listing on a remittance needs sanction_status UNSANCTIONED or PENDING_REMITTANCE with remittance_status UNPAID or REFUNDED)"
    error_id: ERR_MEMBERSHIP_STATE_INVALID
    http_status: 409
    applies_to: "POST /fee-remittances, POST /memberships/{id}/dues-payments"

  - priority: 22
    category: state
    check: "The Team a lineup is submitted for, and the opposing Team on that match, both have status CONFIRMED (a scheduled match may name a Team that never reached CONFIRMED once declared_team_count was met by other teams)"
    error_id: ERR_TEAM_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /matches/{id}/lineups"

  # --- 23-26: business_safety (sanctioning and certification compliance;
  #            these outrank every temporal, constraint and fiscal rule) ------
  - priority: 23
    category: business_safety
    check: "Every REGULAR, SUBSTITUTE or PREBOWL lineup slot names a Membership whose sanction_status is SANCTIONED"
    error_id: ERR_BOWLER_NOT_SANCTIONED
    http_status: 422
    applies_to: "POST /matches/{id}/lineups, POST /award-applications"

  - priority: 24
    category: business_safety
    check: "The Match's LanePair has certification_status CERTIFIED when the match is opened for bowling, and a RECERTIFY action is refused on a pair whose revoked_at is already set (REVOKED is terminal, so no recertification revives it)"
    error_id: ERR_LANE_PAIR_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /matches/{id}/open, POST /lane-pairs/{id}/certification"

  - priority: 25
    category: business_safety
    check: "An honor-score application reaches league verification only when lane_certification_verified is true AND sanctioned_at_game_time is true"
    error_id: ERR_AWARD_EVIDENCE_INCOMPLETE
    http_status: 422
    applies_to: "POST /award-applications/{id}/league-verification"

  - priority: 26
    category: business_safety
    check: "Segregation of duties: the verifying LeagueSecretary is not the applicant member; the disbursing LeagueTreasurer's X-User-ID differs from PrizeFund.plan_approved_by_user_id; the reviewing or ruling LeagueSecretary is not the protest's filing member"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /award-applications/{id}/league-verification, POST /prize-funds/{id}/disburse, POST /protests/{id}/review, POST /protests/{id}/ruling"

  # --- 27-31: business_temporal ---------------------------------------------
  - priority: 27
    category: business_temporal
    check: "No two non-VOID, non-FORFEITED Matches on the same LanePair have overlapping [starts_at, ends_at) windows; touching endpoints (one ends exactly when the next starts) do not overlap"
    error_id: ERR_LANE_PAIR_CONFLICT
    http_status: 409
    applies_to: "POST /leagues/{id}/schedule"

  - priority: 28
    category: business_temporal
    check: "A bowler named on a lineup slot has no other lineup slot on a non-VOID match whose window, widened by TRAVEL_BUFFER_MINUTES = 30 on both sides, touches or overlaps this match's own unwidened [starts_at, ends_at] window (closed-interval comparison, so a gap of exactly 30 minutes still conflicts and 31 minutes does not)"
    error_id: ERR_BOWLER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /matches/{id}/lineups"

  - priority: 29
    category: business_temporal
    check: "The Match's LanePair.certified_through is at or after the match's starts_at"
    error_id: ERR_LANE_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /matches/{id}/open"

  - priority: 30
    category: business_temporal
    check: "A protest is filed at or before Match.certified_at + PROTEST_WINDOW_HOURS (72), and an honor-score application at or before Match.certified_at + AWARD_WINDOW_HOURS (168)"
    error_id: ERR_FILING_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /protests, POST /award-applications"

  - priority: 31
    category: business_temporal
    check: "A PREBOWL slot carries a prebowled_at strictly earlier than the match's starts_at"
    error_id: ERR_PREBOWL_NOT_BEFORE_MATCH
    http_status: 422
    applies_to: "POST /matches/{id}/lineups"

  # --- 32-40: business_constraint ------------------------------------------
  - priority: 32
    category: business_constraint
    check: "A lineup carries exactly league.lineup_positions slots, positions 1..lineup_positions each exactly once, and at least league.legal_lineup_minimum of them are REGULAR, SUBSTITUTE or PREBOWL"
    error_id: ERR_ILLEGAL_LINEUP
    http_status: 422
    applies_to: "POST /matches/{id}/lineups"

  - priority: 33
    category: business_constraint
    check: "The number of VACANCY plus ABSENTEE slots in a lineup does not exceed league.max_vacancy_slots_per_lineup"
    error_id: ERR_VACANCY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /matches/{id}/lineups"

  - priority: 34
    category: business_constraint
    check: "No membership appears twice in one lineup, and no membership appears on both sides of the same match"
    error_id: ERR_DUPLICATE_BOWLER_IN_LINEUP
    http_status: 422
    applies_to: "POST /matches/{id}/lineups"

  - priority: 35
    category: business_constraint
    check: "A SUBSTITUTE slot names a SANCTIONED membership of the same league whose team_id is null or differs from the opposing team"
    error_id: ERR_SUBSTITUTE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /matches/{id}/lineups"

  - priority: 36
    category: business_constraint
    check: "Every submitted game score is an integer in [0, 300], and each REGULAR, SUBSTITUTE or PREBOWL slot carries all three game scores (GAMES_PER_SERIES = 3)"
    error_id: ERR_SCORE_SET_INVALID
    http_status: 422
    applies_to: "POST /matches/{id}/scores"

  - priority: 37
    category: business_constraint
    check: "Schedule generation references exactly League.declared_team_count distinct Teams of the league, names a different home and away Team on every match, and gives every match a LanePair of the league"
    error_id: ERR_TEAM_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /leagues/{id}/schedule"

  - priority: 38
    category: business_constraint
    check: "A member holds at most one Membership per League, and a membership is listed at most once across all non-REJECTED FeeRemittances of the league"
    error_id: ERR_DUPLICATE_MEMBERSHIP
    http_status: 422
    applies_to: "POST /memberships, POST /fee-remittances"

  - priority: 39
    category: business_constraint
    check: "At most one non-denied AwardApplication exists per (series_entry_id, award_type) pair, and the claimed score reaches the award type's threshold per §1.3 honor_score_threshold"
    error_id: ERR_AWARD_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /award-applications"

  - priority: 40
    category: business_constraint
    check: "The count of CONFIRMED Teams in the league is at least the plan's place_count (the length of league.prize_place_weights)"
    error_id: ERR_NO_ELIGIBLE_TEAMS
    http_status: 422
    applies_to: "POST /prize-funds/{id}/distribution-plans, POST /prize-funds/{id}/approve-plan"

  # --- 41-42: business_referential (remedy applicability) -------------------
  - priority: 41
    category: business_referential
    check: "A protest remedy is applicable to its subject: VOID_MATCH requires the protested Match to be CERTIFIED, FORFEIT_AWARD requires category LINEUP_LEGALITY and a named forfeiting team, and NONE is the only remedy allowed with a DENIED ruling"
    error_id: ERR_REMEDY_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /protests/{id}/ruling, POST /protests/{id}/association-ruling"

  - priority: 42
    category: business_referential
    check: "The hearing cycle terminates at MAX_REVIEW_ROUNDS (3): a REMAND ruling is refused when Protest.review_round has already reached 3, because REMANDED's only exit is a further review and that fourth hearing would never be legal - the round-3 hearing must end in UPHOLD, DENY or ESCALATE"
    error_id: ERR_REVIEW_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /protests/{id}/ruling"

  # --- 43-47: business_fiscal (money checks run last) -----------------------
  - priority: 43
    category: business_fiscal
    check: "A bowler whose dues_arrears_weeks exceeds league.max_dues_arrears_weeks may not be named on a lineup slot"
    error_id: ERR_DUES_ARREARS_BLOCK
    http_status: 422
    applies_to: "POST /matches/{id}/lineups"

  - priority: 44
    category: business_fiscal
    check: "declared_amount_cents on a submitted FeeRemittance equals the computed_amount_cents of §1.3 remittance_amount"
    error_id: ERR_REMITTANCE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /fee-remittances/{id}/submit"

  - priority: 45
    category: business_fiscal
    check: "A membership is charged dues at most once per week_number"
    error_id: ERR_DUES_WEEK_ALREADY_PAID
    http_status: 409
    applies_to: "POST /memberships/{id}/dues-payments"

  - priority: 46
    category: business_fiscal
    check: "PrizeFund.undistributed_balance_cents is at least net_distributable_cents at disbursement time, so the money invariant of §1.3 prize_money_conservation cannot be broken"
    error_id: ERR_INSUFFICIENT_PRIZE_FUND
    http_status: 422
    applies_to: "POST /prize-funds/{id}/disburse"

  - priority: 47
    category: business_fiscal
    check: "amount_cents on a dues payment equals league.weekly_dues_cents exactly (the prize and expense shares are derived from the bylaws, so a short or over tender would credit the prize fund with money the league never collected)"
    error_id: ERR_DUES_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /memberships/{id}/dues-payments"

# =============================================================================
# §1.5 API Endpoint Table
#   api_prefix is "" - every collection is a root-level segment and the only
#   nested read is GET /leagues/{id}/teams. Every path parameter is literally
#   {id}.
# =============================================================================
endpoints:

  # --- registry and charter -------------------------------------------------
  - method: POST
    path: "/members"
    description: "Register a person with the national body. Issues the national member number; no league affiliation is created here."
    roles: [AssociationOfficer]
    code: 201
    input: [full_name, email, member_class]
    output: Member
    side_effects:
      - "national_member_number stays NULL here; the NM-<6 digits> number is minted by the national body on this Member's first Membership sanctioning (Membership PENDING_REMITTANCE -> SANCTIONED)"
      - "sanctioned_membership_count starts at 0"

  - method: POST
    path: "/leagues"
    description: "Charter a league at its organizational meeting. The acting LeagueSecretary must be the member named as secretary_member_id. Bylaw fields are NOT accepted here - they are adopted separately by POST /leagues/{id}/bylaws - so a freshly chartered league is FORMING with null bylaws."
    roles: [LeagueSecretary]
    code: 201
    input: [name, season_year, center_name, declared_team_count, organizational_meeting_at, secretary_member_id, treasurer_member_id]
    output: League
    side_effects:
      - "creates exactly one PrizeFund for the league in status ACCUMULATING with basis_variant PROJECTED_SEASON_END and place_count 0 (discoverable only through GET /prize-funds?league_id=...)"
      - "status = FORMING, version = 1, total_weeks = 0, sanctioned_member_count = 0, confirmed_team_count = 0, certified_week_high_water = 0"

  - method: POST
    path: "/leagues/{id}/bylaws"
    description: "Adopt or amend the league bylaws at an organizational meeting. Optimistically concurrent on League.version per §1.2.1 rule bylaws-adopt-stale-league. Re-adoption on an already BYLAWS_ADOPTED league is a legal amendment that supersedes the previous bylaw set and recomputes every derived average and handicap in the league."
    roles: [LeagueSecretary]
    code: 200
    input: [expected_league_version, handicap_base, handicap_percentage, handicap_percentage_youth, max_handicap_per_game, handicap_average_basis, minimum_games_for_average, carryover_policy, vacancy_average, vacancy_score, absentee_deduction, lineup_positions, legal_lineup_minimum, max_vacancy_slots_per_lineup, weekly_dues_cents, weekly_expense_cents, max_dues_arrears_weeks, prize_place_weights]
    output: League
    side_effects:
      - "writes every bylaw field; status FORMING -> BYLAWS_ADOPTED or BYLAWS_ADOPTED -> BYLAWS_ADOPTED"
      - "bylaws_adopted_at = logical clock now (the §1.3 remittance_amount late-filing window starts here)"
      - "recomputes entering_average, current_average, average_status and handicap_per_game on every Membership of the league and team_handicap_per_game on every Team"
      - "increments League.version by 1"

  - method: POST
    path: "/leagues/{id}/schedule"
    description: "Adopt the season schedule. Creates one Match per submitted slot; matches are created DRAFT while the league is BYLAWS_ADOPTED and are promoted to SCHEDULED by cascade hop 4 once the league reaches SANCTIONED. Each element of matches carries week_number, home_team_id, away_team_id, lane_pair_id, starts_at and ends_at."
    roles: [LeagueSecretary]
    code: 201
    input: [total_weeks, matches]
    output: Match[]
    side_effects:
      - "creates every Match in DRAFT with home_points 0, away_points 0 and both team handicaps 0"
      - "sets League.total_weeks, which the §1.3 prize_fund_basis PROJECTED_SEASON_END variant projects against"
      - "rejects the whole request (no match is created) when any lane pair window collides per §1.4 priority 27"

  - method: POST
    path: "/leagues/{id}/close-season"
    description: "Close the season once every match has reached CERTIFIED, FORFEITED or VOID. Freezes lineup submission, score entry and certification, and unlocks the prize distribution workflow."
    roles: [LeagueSecretary]
    code: 200
    input: []
    output: League
    side_effects:
      - "status IN_SEASON -> SEASON_CLOSED"
      - "PrizeFund distribution plans drafted from here on may use the CERTIFIED_TO_DATE variant"

  - method: POST
    path: "/teams"
    description: "Enter a team in the league. Teams start PROVISIONAL and are confirmed by cascade once their sanctioned roster reaches the legal lineup minimum."
    roles: [LeagueSecretary]
    code: 201
    input: [league_id, name]
    output: Team
    side_effects:
      - "status = PROVISIONAL, sanctioned_roster_count 0, team_handicap_per_game 0, total_points 0, total_scratch_pins 0"

  - method: POST
    path: "/memberships"
    description: "Enrol a member in the league, optionally on a team, with the declared prior-season record. Membership starts UNSANCTIONED / UNPAID and carries no handicap until the national fee is remitted and accepted."
    roles: [LeagueSecretary]
    code: 201
    input: ["league_id", "member_id", "team_id?", "roster_role", "prior_season_average?", "prior_season_games?"]
    output: Membership
    side_effects:
      - "computes entering_average per §1.3 entering_average from the league's carryover_policy (null while the league is still FORMING with no adopted bylaws)"
      - "sanction_status = UNSANCTIONED, remittance_status = UNPAID, handicap_per_game = 0, average_status = PROVISIONAL"

  - method: POST
    path: "/lane-pairs"
    description: "Register a certified lane pair for the league. Certification is an association act, so the association officer - not the league secretary - owns this surface."
    roles: [AssociationOfficer]
    code: 201
    input: [league_id, pair_number, certified_through]
    output: LanePair
    side_effects:
      - "last_certified_at = logical clock now; revoked_at = null"
      - "certification_status is derived on every read: REVOKED when revoked_at is set, EXPIRED when the logical clock is strictly past certified_through, otherwise CERTIFIED"

  - method: POST
    path: "/lane-pairs/{id}/certification"
    description: "Recertify a lane pair to a later certified_through (action RECERTIFY, which revives an EXPIRED pair) or withdraw its certification (action REVOKE). REVOKED is terminal: RECERTIFY on a pair whose revoked_at is set is refused with ERR_LANE_PAIR_NOT_CERTIFIED."
    roles: [AssociationOfficer]
    code: 200
    input: ["action", "certified_through?"]
    output: LanePair
    side_effects:
      - "RECERTIFY: certified_through is advanced and last_certified_at = logical clock now; revoked_at is never cleared, so a REVOKED pair can not be revived"
      - "REVOKE: revoked_at = logical clock now; matches on this pair can no longer be opened"

  # --- sanctioning and fee remittance --------------------------------------
  - method: POST
    path: "/fee-remittances"
    description: "Open a draft remittance listing the memberships whose national and local fees the league is about to forward. Pricing is not computed until submission."
    roles: [LeagueTreasurer]
    code: 201
    input: [league_id, membership_ids, declared_amount_cents]
    output: FeeRemittance
    side_effects:
      - "status = DRAFT; member_count = length(membership_ids); computed_amount_cents 0 and penalty_cents 0 until submission"

  - method: POST
    path: "/fee-remittances/{id}/submit"
    description: "Submit the remittance to the national body. Prices every listed membership per §1.3 remittance_amount, applies the late-filing penalty when more than 21 days have elapsed since bylaws_adopted_at, and refuses the submission when declared_amount_cents disagrees with the computed total. A re-filing after a rejection may correct the declared amount by supplying declared_amount_cents."
    roles: [LeagueTreasurer]
    code: 200
    input: ["declared_amount_cents?"]
    output: FeeRemittance
    side_effects:
      - "computes computed_amount_cents, penalty_cents and member_count per §1.3 remittance_amount"
      - "status DRAFT -> SUBMITTED or REJECTED -> SUBMITTED; submitted_at = logical clock now; submitted_by_user_id = X-User-ID"
      - "overwrites declared_amount_cents when the input supplies it (the re-filing correction path)"
      - "every listed Membership moves sanction_status UNSANCTIONED -> PENDING_REMITTANCE and remittance_status UNPAID|REFUNDED -> INVOICED"

  - method: POST
    path: "/fee-remittances/{id}/national-decision"
    description: "Record the national body's ACCEPT or REJECT of a submitted remittance. ACCEPT is the head of the four-hop sanctioning cascade: Membership -> Team -> League -> Match."
    roles: [AssociationOfficer]
    code: 200
    input: ["decision", "national_receipt_no?", "rejection_reason?"]
    output: FeeRemittance
    side_effects:
      - "ACCEPT hop 1: every listed Membership reaches sanction_status SANCTIONED and remittance_status REMITTED, gains its handicap_per_game per §1.3 bowler_handicap, and increments Member.sanctioned_membership_count and League.sanctioned_member_count"
      - "ACCEPT hop 2: every affected Team increments sanctioned_roster_count and moves PROVISIONAL -> CONFIRMED once it reaches league.legal_lineup_minimum, recomputing team_handicap_per_game"
      - "ACCEPT hop 3: League.confirmed_team_count increments and the league moves BYLAWS_ADOPTED -> SANCTIONED once it equals declared_team_count"
      - "ACCEPT hop 4: every DRAFT Match of the league moves to SCHEDULED"
      - "REJECT: status -> REJECTED, every listed Membership falls back to sanction_status UNSANCTIONED and remittance_status REFUNDED, handicaps return to 0, and the remittance may be re-submitted"

  # --- match operations -----------------------------------------------------
  - method: POST
    path: "/matches/{id}/lineups"
    description: "Submit one side's legal lineup. Optimistically concurrent on Match.version per §1.2.1 rule lineup-submit-stale-match. Each element of slots carries position, entry_type, membership_id (null for VACANCY and FORFEIT) and prebowled_at (PREBOWL only). A re-submission by the same side supersedes its own previous slots. The response's version is the value the next submission must echo."
    roles: [TeamCaptain, LeagueSecretary]
    code: 200
    input: [expected_match_version, team_id, slots]
    output: Match
    side_effects:
      - "deletes and replaces that side's SeriesEntry rows; the new rows are discoverable through GET /series-entries?match_id=..."
      - "freezes SeriesEntry.handicap_per_game_applied per §1.3 team_handicap_per_game (lineup_actual variant), including the VACANCY and ABSENTEE substitutions"
      - "sets counts_toward_average true only on REGULAR, SUBSTITUTE and PREBOWL slots"
      - "writes Match.home_team_handicap_per_game or away_team_handicap_per_game"
      - "status SCHEDULED -> SCHEDULED, SCHEDULED -> LINEUPS_SUBMITTED once both sides have slots, or LINEUPS_SUBMITTED -> LINEUPS_SUBMITTED on a supersede"
      - "increments Match.version by 1"

  - method: POST
    path: "/matches/{id}/open"
    description: "Open the match for bowling. Refused unless the assigned lane pair is CERTIFIED and its certified_through is at or after the match's starts_at. Opening the league's first match also carries the league SANCTIONED -> IN_SEASON."
    roles: [LeagueSecretary]
    code: 200
    input: []
    output: Match
    side_effects:
      - "status LINEUPS_SUBMITTED -> OPEN"
      - "League SANCTIONED -> IN_SEASON when this is the league's first opened match"

  - method: POST
    path: "/matches/{id}/scores"
    description: "Record the three game scores of every bowling slot. Each element of entries carries series_entry_id, game1_pins, game2_pins and game3_pins. An ABSENTEE slot must appear in entries but its three game fields are omitted or null (the bowler did not roll), so it records games_recorded 0 and scratch_series 0 while still contributing its frozen handicap; a VACANCY slot is never listed in entries at all. Computes each slot's scratch series and both sides' match points per §1.3 match_points, including the vacancy_score substitution for VACANCY slots."
    roles: [LeagueSecretary]
    code: 200
    input: [entries]
    output: Match
    side_effects:
      - "writes game pins and computes SeriesEntry.games_recorded and scratch_series"
      - "computes Match.home_points and Match.away_points per §1.3 match_points"
      - "status OPEN -> SCORES_ENTERED; nothing is certified yet, so no average moves"

  - method: POST
    path: "/matches/{id}/certify"
    description: "Certify the match. This is the only way games become certified games, and it is the head of the average/handicap cascade: SeriesEntry -> Membership -> Team -> League."
    roles: [LeagueSecretary]
    code: 200
    input: []
    output: Match
    side_effects:
      - "hop 1: every SeriesEntry of the match gets certified = true; Match.certified_at = logical clock now"
      - "hop 2: each Membership behind a certified average-bearing slot recomputes certified_games, certified_pins, current_average, average_status and handicap_per_game per §1.3 bowler_average and §1.3 bowler_handicap"
      - "hop 3: each affected Team recomputes team_handicap_per_game, total_points and total_scratch_pins"
      - "hop 4: League.certified_week_high_water is recomputed, which moves the §1.3 prize_fund_basis inputs"
      - "status SCORES_ENTERED -> CERTIFIED"

  - method: POST
    path: "/matches/{id}/forfeit"
    description: "Declare a forfeit against one side from SCHEDULED, LINEUPS_SUBMITTED or OPEN, running the preallocation procedure: the forfeiting side's slots are replaced by (or created as) FORFEIT rows scoring 0 in all three games and the opponent takes the full four points."
    roles: [LeagueSecretary]
    code: 200
    input: ["forfeiting_team_id"]
    output: Match
    side_effects:
      - "replaces the forfeiting side's SeriesEntry rows with FORFEIT rows - membership_id null, game1_pins / game2_pins / game3_pins 0, games_recorded 0, scratch_series 0, handicap_per_game_applied 0, counts_toward_average false and certified false - creating them for positions 1..league.lineup_positions when that side never submitted a lineup"
      - "home_points / away_points are rewritten to 0 and POINTS_PER_MATCH"
      - "recomputes the forfeiting side's Match.home_team_handicap_per_game or away_team_handicap_per_game from the FORFEIT rows, so it becomes 0"
      - "status SCHEDULED, LINEUPS_SUBMITTED or OPEN -> FORFEITED (the CERTIFIED -> FORFEITED branch is driven only by an upheld protest remedy)"

  # --- weekly dues and the prize fund ---------------------------------------
  - method: POST
    path: "/memberships/{id}/dues-payments"
    description: "Record one week's dues for one sanctioned bowler and split it into the prize share and the expense share per the league bylaws. amount_cents must equal league.weekly_dues_cents exactly per §1.4 priority 47. DuesPayment is immutable: it has no version and no update endpoint."
    roles: [LeagueTreasurer, Bowler]
    code: 201
    input: [week_number, amount_cents]
    output: DuesPayment
    side_effects:
      - "prize_share_cents = league.weekly_dues_cents - league.weekly_expense_cents; expense_share_cents = league.weekly_expense_cents"
      - "increments Membership.dues_paid_cents and recomputes dues_arrears_weeks"
      - "increments the league PrizeFund.collected_prize_cents and undistributed_balance_cents, preserving the §1.3 prize_money_conservation invariant"

  - method: POST
    path: "/prize-funds/{id}/distribution-plans"
    description: "Draft (or redraft) the prize distribution plan the league must approve. Optimistically concurrent on PrizeFund.version per §1.2.1 rule distribution-plan-stale-fund. basis_variant selects the dual-variant basis of §1.3 prize_fund_basis; place_count must equal the length of league.prize_place_weights."
    roles: [LeagueTreasurer]
    code: 200
    input: [expected_prize_fund_version, basis_variant, place_count]
    output: PrizeFund
    side_effects:
      - "computes plan_basis_cents per §1.3 prize_fund_basis for the selected variant"
      - "computes reserve_cents, admin_fee_cents and net_distributable_cents in the pinned order of §1.3 prize_distribution_waterfall"
      - "status ACCUMULATING -> PLAN_DRAFTED or PLAN_DRAFTED -> PLAN_DRAFTED; plan_drafted_at = logical clock now"
      - "increments PrizeFund.version by 1; no PrizeAward exists yet"

  - method: POST
    path: "/prize-funds/{id}/approve-plan"
    description: "Approve the drafted plan on behalf of the league. Materialises one PENDING PrizeAward per prize place from the current standings; the approving secretary's id is recorded so the disbursing treasurer can be checked against it."
    roles: [LeagueSecretary]
    code: 200
    input: []
    output: PrizeFund
    side_effects:
      - "creates place_count PrizeAward rows in PENDING with place, weight and amount_cents per §1.3 prize_distribution_waterfall (discoverable through GET /prize-awards?prize_fund_id=...)"
      - "status PLAN_DRAFTED -> PLAN_APPROVED; plan_approved_by_user_id = X-User-ID"
      - "refused with ERR_NO_ELIGIBLE_TEAMS when the league has fewer CONFIRMED teams than place_count"

  - method: POST
    path: "/prize-funds/{id}/disburse"
    description: "Pay every approved award. Segregation of duties: the acting treasurer's X-User-ID must differ from plan_approved_by_user_id, so the same person can never both approve and pay."
    roles: [LeagueTreasurer]
    code: 200
    input: []
    output: PrizeFund
    side_effects:
      - "every PENDING PrizeAward becomes PAID"
      - "paid_award_total_cents = sum of paid amounts; undistributed_balance_cents decreases by the same amount"
      - "status PLAN_APPROVED -> DISBURSED; disbursed_at = logical clock now; League SEASON_CLOSED -> PRIZES_DISBURSED"

  - method: POST
    path: "/prize-awards/{id}/reverse"
    description: "Reverse a paid award (compensating action). Reversing every paid award of a fund restores the fund to PLAN_APPROVED and the league to SEASON_CLOSED with the money invariant intact."
    roles: [LeagueTreasurer]
    code: 200
    input: [reversal_reason]
    output: PrizeAward
    side_effects:
      - "status PAID -> REVERSED; the award's amount_cents returns to PrizeFund.undistributed_balance_cents and leaves paid_award_total_cents"
      - "PrizeFund DISBURSED -> PLAN_APPROVED and League PRIZES_DISBURSED -> SEASON_CLOSED on the FIRST reversal, even while other awards are still PAID (the plan is no longer fully disbursed); disbursed_at = null"
      - "preserves collected_prize_cents == paid_award_total_cents + undistributed_balance_cents per §1.3 prize_money_conservation"

  # --- honor-score awards ---------------------------------------------------
  - method: POST
    path: "/award-applications"
    description: "Apply for an honor-score award on a certified game or series. The applying Bowler must be the member behind membership_id, the series entry must belong to that membership, and the claimed score must reach the award type's threshold per §1.3 honor_score_threshold. claimed_game_number is required for the per-game award types and ignored for the series types."
    roles: [Bowler]
    code: 201
    input: ["league_id", "membership_id", "series_entry_id", "award_type", "claimed_game_number?", "evidence_note?"]
    output: AwardApplication
    side_effects:
      - "computes claimed_pins per §1.3 honor_score_threshold"
      - "computes lane_certification_verified from the match's LanePair as it stands at this instant (revoked_at is null AND certified_through >= Match.starts_at) and sanctioned_at_game_time from the membership's sanction_status and SeriesEntry.certified; both flags are re-evaluated against the then-current LanePair and Membership on the SUBMITTED -> LEAGUE_VERIFIED transition, so a lane pair revoked after the game was bowled leaves an outstanding claim unverifiable per §1.4 priority 25"
      - "status = SUBMITTED, round_count = 1"

  - method: POST
    path: "/award-applications/{id}/league-verification"
    description: "The league secretary verifies the application (decision VERIFY) or returns it for more evidence (decision RETURN_FOR_EVIDENCE). Segregation of duties: the secretary may not verify an application whose applicant member is the secretary."
    roles: [LeagueSecretary]
    code: 200
    input: ["decision", "evidence_note?"]
    output: AwardApplication
    side_effects:
      - "VERIFY: status SUBMITTED -> LEAGUE_VERIFIED; verified_by_user_id = X-User-ID; requires lane_certification_verified and sanctioned_at_game_time both true"
      - "RETURN_FOR_EVIDENCE: status SUBMITTED -> RETURNED_FOR_EVIDENCE and evidence_note records what is missing"

  - method: POST
    path: "/award-applications/{id}/evidence"
    description: "The applicant resubmits a returned application with fresh evidence. This is the applicant-side loop of the award machine and increments round_count each time."
    roles: [Bowler]
    code: 200
    input: [evidence_note]
    output: AwardApplication
    side_effects:
      - "status RETURNED_FOR_EVIDENCE -> SUBMITTED; round_count increments by 1; verified_by_user_id is cleared"

  - method: POST
    path: "/award-applications/{id}/association-decision"
    description: "The association certifies (decision CERTIFY) or denies (decision DENY) a league-verified honor score."
    roles: [AssociationOfficer]
    code: 200
    input: ["decision", "association_ruling_note?"]
    output: AwardApplication
    side_effects:
      - "CERTIFY: status LEAGUE_VERIFIED -> ASSOCIATION_CERTIFIED (terminal)"
      - "DENY: status LEAGUE_VERIFIED -> ASSOCIATION_DENIED (terminal); association_ruling_note records the reason"

  # --- protests and rules interpretation ------------------------------------
  - method: POST
    path: "/protests"
    description: "File a protest. match_id is required for LINEUP_LEGALITY, SCORE_ERROR and ELIGIBILITY protests and omitted for a pure RULES_INTERPRETATION question. The filing window closes 72 hours after the protested match's certified_at."
    roles: [Bowler, TeamCaptain]
    code: 201
    input: ["league_id", "match_id?", "filed_by_membership_id", "category", "protest_note"]
    output: Protest
    side_effects:
      - "status = FILED, review_round = 0, remedy = NONE; filed_at = logical clock now"
      - "deadline_at = Match.certified_at + 72 hours when match_id is present, otherwise null"

  - method: POST
    path: "/protests/{id}/review"
    description: "Open a hearing on a filed or remanded protest. Increments review_round. A remand loop must terminate: once review_round reaches MAX_REVIEW_ROUNDS (3) a further REMAND ruling is refused with ERR_REVIEW_ROUND_LIMIT, so no fourth hearing can ever be opened. Segregation of duties: the reviewing secretary may not be the filing member."
    roles: [LeagueSecretary]
    code: 200
    input: []
    output: Protest
    side_effects:
      - "status FILED -> UNDER_REVIEW or REMANDED -> UNDER_REVIEW; review_round increments by 1"

  - method: POST
    path: "/protests/{id}/ruling"
    description: "Rule on a protest under review: UPHOLD with a remedy, DENY, REMAND for another hearing, or ESCALATE to the association. An upheld VOID_MATCH remedy voids the protested match and unwinds every certified pin it contributed; an upheld FORFEIT_AWARD remedy forfeits the offending side while the protesting side keeps its games."
    roles: [LeagueSecretary]
    code: 200
    input: ["decision", "remedy?", "ruling_note?", "forfeiting_team_id?"]
    output: Protest
    side_effects:
      - "UPHOLD + VOID_MATCH: Match CERTIFIED -> VOID and the four-hop decertification cascade runs, restoring every affected Membership and Team to its pre-certification figures"
      - "UPHOLD + FORFEIT_AWARD: Match CERTIFIED -> FORFEITED with forfeiting_team_id set; only the forfeiting side loses its certified games"
      - "DENY: status -> DENIED (terminal) and remedy stays NONE"
      - "REMAND: status -> REMANDED, awaiting another review"
      - "ESCALATE: status -> ESCALATED; only the association may rule from here"

  - method: POST
    path: "/protests/{id}/association-ruling"
    description: "The association rules on an escalated protest and may impose the same remedies the league could have imposed."
    roles: [AssociationOfficer]
    code: 200
    input: ["remedy", "association_ruling", "forfeiting_team_id?"]
    output: Protest
    side_effects:
      - "status ESCALATED -> ASSOCIATION_RULED (terminal); association_ruling records the ruling text"
      - "a VOID_MATCH remedy runs the same four-hop decertification cascade as a league ruling"

  # --- test-driving surface --------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary instant so certification windows, lane-pair expiry, the 21-day remittance penalty and the 72-hour protest window are all deterministic. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to wall-clock time."
    roles: [AssociationOfficer]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "every subsequent timestamp the server stamps, and every window comparison it makes, uses this instant"
      - "LanePair.certification_status is re-derived on the next read, so advancing the clock past certified_through moves a pair CERTIFIED -> EXPIRED with no request against the pair itself"

  # --- reads: single resources ----------------------------------------------
  - method: GET
    path: "/members/{id}"
    description: "Read one member and the number of leagues they are currently sanctioned in."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/leagues/{id}"
    description: "Read one league with its adopted bylaws, status and derived counters."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: League
    side_effects: []

  - method: GET
    path: "/teams/{id}"
    description: "Read one team with its sanctioned roster count, roster-variant team handicap and standings figures."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: GET
    path: "/memberships/{id}"
    description: "Read one membership with both state axes, its certified games and pins, its current average and its per-game handicap."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: GET
    path: "/fee-remittances/{id}"
    description: "Read one fee remittance with its computed amount, penalty and member count."
    roles: [LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: FeeRemittance
    side_effects: []

  - method: GET
    path: "/lane-pairs/{id}"
    description: "Read one lane pair; certification_status is derived against the logical clock on every read."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: LanePair
    side_effects: []

  - method: GET
    path: "/matches/{id}"
    description: "Read one match with its status, frozen team handicaps and points."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: Match
    side_effects: []

  - method: GET
    path: "/series-entries/{id}"
    description: "Read one lineup slot with its frozen handicap, recorded games, scratch series and certification flag."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: SeriesEntry
    side_effects: []

  - method: GET
    path: "/dues-payments/{id}"
    description: "Read one weekly dues payment with its prize and expense split."
    roles: [LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: DuesPayment
    side_effects: []

  - method: GET
    path: "/prize-funds/{id}"
    description: "Read the league's prize fund with the drafted plan figures and the money-conservation triple."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: PrizeFund
    side_effects: []

  - method: GET
    path: "/prize-awards/{id}"
    description: "Read one prize award with its place, weight and amount."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: PrizeAward
    side_effects: []

  - method: GET
    path: "/award-applications/{id}"
    description: "Read one honor-score application with its verification flags and round count."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: AwardApplication
    side_effects: []

  - method: GET
    path: "/protests/{id}"
    description: "Read one protest with its review round, remedy and deadline."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: []
    output: Protest
    side_effects: []

  # --- reads: collections (every FK of §1.1 is an optional filter here, which
  #     is also how cascade-created children - SeriesEntry, PrizeAward and the
  #     PrizeFund created by POST /leagues - are discovered) ------------------
  - method: GET
    path: "/leagues"
    description: "List leagues, filterable by season, status and the two officer bindings."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["season_year?", "status?", "secretary_member_id?", "treasurer_member_id?", "limit?", "offset?"]
    output: League[]
    side_effects: []

  - method: GET
    path: "/leagues/{id}/teams"
    description: "List the league's teams (sub-resource reverse lookup for Team.league_id), ordered by created_at ascending."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Team[]
    side_effects: []

  - method: GET
    path: "/memberships"
    description: "List memberships, filterable by league, member, team and either state axis."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["league_id?", "member_id?", "team_id?", "sanction_status?", "remittance_status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []

  - method: GET
    path: "/fee-remittances"
    description: "List fee remittances of a league, filterable by status."
    roles: [LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["league_id?", "status?", "limit?", "offset?"]
    output: FeeRemittance[]
    side_effects: []

  - method: GET
    path: "/lane-pairs"
    description: "List lane pairs of a league, filterable by derived certification status."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["league_id?", "certification_status?", "limit?", "offset?"]
    output: LanePair[]
    side_effects: []

  - method: GET
    path: "/matches"
    description: "List matches, filterable by league, week, either side, lane pair, the forfeiting side and status."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["league_id?", "week_number?", "home_team_id?", "away_team_id?", "lane_pair_id?", "forfeiting_team_id?", "status?", "limit?", "offset?"]
    output: Match[]
    side_effects: []

  - method: GET
    path: "/series-entries"
    description: "List lineup slots, filterable by match, team, membership and certification. This is the only discovery channel for slots created by a lineup submission; ordered by team_id then position ascending."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["match_id?", "team_id?", "membership_id?", "entry_type?", "certified?", "limit?", "offset?"]
    output: SeriesEntry[]
    side_effects: []

  - method: GET
    path: "/dues-payments"
    description: "List dues payments of a membership, filterable by week."
    roles: [LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["membership_id?", "week_number?", "limit?", "offset?"]
    output: DuesPayment[]
    side_effects: []

  - method: GET
    path: "/prize-funds"
    description: "List prize funds, filterable by league and status. This is the discovery channel for the PrizeFund created by POST /leagues."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["league_id?", "status?", "limit?", "offset?"]
    output: PrizeFund[]
    side_effects: []

  - method: GET
    path: "/prize-awards"
    description: "List prize awards, filterable by fund, team and status; ordered by place ascending. This is the discovery channel for awards created by plan approval."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["prize_fund_id?", "team_id?", "status?", "limit?", "offset?"]
    output: PrizeAward[]
    side_effects: []

  - method: GET
    path: "/award-applications"
    description: "List honor-score applications, filterable by league, membership, series entry and status."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["league_id?", "membership_id?", "series_entry_id?", "award_type?", "status?", "limit?", "offset?"]
    output: AwardApplication[]
    side_effects: []

  - method: GET
    path: "/protests"
    description: "List protests, filterable by league, match, filing membership and status."
    roles: [Bowler, TeamCaptain, LeagueSecretary, LeagueTreasurer, AssociationOfficer]
    code: 200
    input: ["league_id?", "match_id?", "filed_by_membership_id?", "category?", "status?", "limit?", "offset?"]
    output: Protest[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty on any request"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "X-User-Role is not a declared role, or the role is not listed on the endpoint (e.g. a Bowler submitting a lineup, a LeagueSecretary approving a fee remittance on behalf of the national body)"
  - id: ERR_UNKNOWN_ACTOR
    http: 403
    condition: "X-User-ID is not an existing Member while acting as Bowler, TeamCaptain, LeagueSecretary or LeagueTreasurer"
  - id: ERR_NOT_LEAGUE_SECRETARY
    http: 403
    condition: "A LeagueSecretary mutation whose X-User-ID is not the target league's secretary_member_id"
  - id: ERR_NOT_LEAGUE_TREASURER
    http: 403
    condition: "A LeagueTreasurer mutation whose X-User-ID is not the target league's treasurer_member_id"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Bowler acting on a membership, dues payment, award application or protest that is not their own, or a TeamCaptain submitting a lineup for a team they hold no Membership on"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The secretary verifying their own honor score, the treasurer disbursing a plan they themselves approved, or the secretary reviewing or ruling on a protest they filed"

  # --- existence ------------------------------------------------------------
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "member_id, secretary_member_id or treasurer_member_id names no Member"
  - id: ERR_LEAGUE_NOT_FOUND
    http: 404
    condition: "league_id or the {id} of a league path names no League"
  - id: ERR_TEAM_NOT_FOUND
    http: 404
    condition: "team_id, home_team_id, away_team_id or forfeiting_team_id names no Team"
  - id: ERR_MEMBERSHIP_NOT_FOUND
    http: 404
    condition: "membership_id, an element of membership_ids, filed_by_membership_id or a lineup slot's membership_id names no Membership"
  - id: ERR_FEE_REMITTANCE_NOT_FOUND
    http: 404
    condition: "The {id} of a fee-remittance path names no FeeRemittance"
  - id: ERR_LANE_PAIR_NOT_FOUND
    http: 404
    condition: "lane_pair_id or the {id} of a lane-pair path names no LanePair"
  - id: ERR_MATCH_NOT_FOUND
    http: 404
    condition: "match_id or the {id} of a match path names no Match"
  - id: ERR_SERIES_ENTRY_NOT_FOUND
    http: 404
    condition: "series_entry_id, an entries element's series_entry_id or the {id} of a series-entry path names no SeriesEntry"
  - id: ERR_DUES_PAYMENT_NOT_FOUND
    http: 404
    condition: "The {id} of a dues-payment path names no DuesPayment"
  - id: ERR_PRIZE_FUND_NOT_FOUND
    http: 404
    condition: "The {id} of a prize-fund path names no PrizeFund"
  - id: ERR_PRIZE_AWARD_NOT_FOUND
    http: 404
    condition: "The {id} of a prize-award path names no PrizeAward"
  - id: ERR_AWARD_APPLICATION_NOT_FOUND
    http: 404
    condition: "The {id} of an award-application path names no AwardApplication"
  - id: ERR_PROTEST_NOT_FOUND
    http: 404
    condition: "The {id} of a protest path names no Protest"

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required input, undeclared enum value, wrong type, negative cents or pins, percentage outside [0, 1], empty array, unparseable instant, a conditionally-required input violated in either direction (claimed_game_number absent on a game award or present on a series award, prebowled_at absent on a PREBOWL slot or present on any other entry_type, membership_id present on a VACANCY slot, certified_through absent on a RECERTIFY or present on a REVOKE, national_receipt_no absent on an ACCEPT or rejection_reason absent on a REJECT), a pagination limit outside 1..100 or a negative offset, or an incoherent bylaw set (weights not summing to 1.00, legal_lineup_minimum above lineup_positions, weekly_expense_cents above weekly_dues_cents)"

  # --- referential coherence ------------------------------------------------
  - id: ERR_CROSS_LEAGUE_REFERENCE
    http: 422
    condition: "Two entities referenced by one request belong to different leagues (a team from league A on a match of league B, a membership of league A on league B's remittance)"
  - id: ERR_REFERENCE_MISMATCH
    http: 422
    condition: "Referenced rows are not in the required relationship: an award application's series entry belongs to another membership, a lineup is submitted for a team that is not a participant, a protest names a match outside its league"
  - id: ERR_REMEDY_NOT_APPLICABLE
    http: 422
    condition: "VOID_MATCH ruled on a match that is not CERTIFIED, FORFEIT_AWARD ruled on a protest whose category is not LINEUP_LEGALITY or with no forfeiting team named, or a remedy other than NONE attached to a DENY ruling"

  # --- optimistic concurrency (§1.2.1) --------------------------------------
  - id: ERR_STALE_LEAGUE_VERSION
    http: 412
    condition: "expected_league_version does not equal League.version on POST /leagues/{id}/bylaws"
  - id: ERR_STALE_MATCH_VERSION
    http: 412
    condition: "expected_match_version does not equal Match.version on POST /matches/{id}/lineups"
  - id: ERR_STALE_PRIZE_FUND_VERSION
    http: 412
    condition: "expected_prize_fund_version does not equal PrizeFund.version on POST /prize-funds/{id}/distribution-plans"

  # --- state preconditions --------------------------------------------------
  - id: ERR_LEAGUE_STATE_INVALID
    http: 409
    condition: "The league's status forbids the operation - scheduling a FORMING league, opening a match in a SEASON_CLOSED league, closing a season with an unsettled match, approving a plan before the season is closed"
  - id: ERR_MATCH_STATE_INVALID
    http: 409
    condition: "The match's status forbids the transition - certifying a match that is not SCORES_ENTERED, submitting a lineup on an OPEN match, forfeiting a VOID match, opening a match twice"
  - id: ERR_REMITTANCE_STATE_INVALID
    http: 409
    condition: "Submitting an already SUBMITTED or ACCEPTED remittance, or recording a national decision on a remittance that is not SUBMITTED"
  - id: ERR_MEMBERSHIP_STATE_INVALID
    http: 409
    condition: "Recording dues for a membership that is not SANCTIONED, or listing an already SANCTIONED or INVOICED membership on a new remittance"
  - id: ERR_TEAM_NOT_CONFIRMED
    http: 409
    condition: "A lineup is submitted on a match one of whose teams never reached CONFIRMED"
  - id: ERR_PRIZE_FUND_STATE_INVALID
    http: 409
    condition: "Approving a plan that is not PLAN_DRAFTED, disbursing a fund that is not PLAN_APPROVED, reversing an award whose fund is not DISBURSED, or redrafting after approval"
  - id: ERR_AWARD_APPLICATION_STATE_INVALID
    http: 409
    condition: "Verifying an application that is not SUBMITTED, resubmitting evidence on one that is not RETURNED_FOR_EVIDENCE, or an association decision on one that is not LEAGUE_VERIFIED"
  - id: ERR_PROTEST_STATE_INVALID
    http: 409
    condition: "Reviewing a protest that is not FILED or REMANDED, ruling on one that is not UNDER_REVIEW, or an association ruling on one that is not ESCALATED"

  # --- business_safety ------------------------------------------------------
  - id: ERR_BOWLER_NOT_SANCTIONED
    http: 422
    condition: "A REGULAR, SUBSTITUTE or PREBOWL lineup slot, or an honor-score application, names a membership whose sanction_status is not SANCTIONED"
  - id: ERR_LANE_PAIR_NOT_CERTIFIED
    http: 422
    condition: "Opening a match whose lane pair is REVOKED or EXPIRED, or a RECERTIFY action on a lane pair whose revoked_at is already set"
  - id: ERR_LANE_CERTIFICATION_EXPIRED
    http: 422
    condition: "Opening a match whose lane pair carries a certified_through earlier than the match's starts_at"
  - id: ERR_AWARD_EVIDENCE_INCOMPLETE
    http: 422
    condition: "League verification of an application whose lane_certification_verified or sanctioned_at_game_time is false"

  # --- business_temporal ----------------------------------------------------
  - id: ERR_LANE_PAIR_CONFLICT
    http: 409
    condition: "Two scheduled matches on the same lane pair have overlapping [starts_at, ends_at) windows; back-to-back matches that merely touch do not conflict"
  - id: ERR_BOWLER_SCHEDULE_CONFLICT
    http: 409
    condition: "A bowler is named on two matches whose windows, widened by the 30-minute travel buffer on both sides, touch or overlap"
  - id: ERR_FILING_WINDOW_CLOSED
    http: 422
    condition: "A protest filed more than 72 hours, or an honor-score application filed more than 168 hours, after the match's certified_at"
  - id: ERR_PREBOWL_NOT_BEFORE_MATCH
    http: 422
    condition: "A PREBOWL slot whose prebowled_at is at or after the match's starts_at, or missing entirely"

  # --- business_constraint --------------------------------------------------
  - id: ERR_ILLEGAL_LINEUP
    http: 422
    condition: "A lineup whose slot count differs from lineup_positions, whose positions are not exactly 1..lineup_positions, or which carries fewer than legal_lineup_minimum bowling slots"
  - id: ERR_VACANCY_LIMIT_EXCEEDED
    http: 422
    condition: "A lineup with more VACANCY plus ABSENTEE slots than max_vacancy_slots_per_lineup"
  - id: ERR_DUPLICATE_BOWLER_IN_LINEUP
    http: 422
    condition: "The same membership appears twice in one lineup or on both sides of one match"
  - id: ERR_SUBSTITUTE_NOT_ELIGIBLE
    http: 422
    condition: "A SUBSTITUTE slot names a membership of another league or a member rostered to the opposing team"
  - id: ERR_SCORE_SET_INVALID
    http: 422
    condition: "A game score outside 0..300, or a bowling slot whose three game scores are not all supplied"
  - id: ERR_TEAM_COUNT_MISMATCH
    http: 422
    condition: "A schedule that does not reference exactly declared_team_count distinct teams of the league, or a match whose home and away team are the same"
  - id: ERR_DUPLICATE_MEMBERSHIP
    http: 422
    condition: "A second membership for the same member in the same league, or a membership listed on two live fee remittances"
  - id: ERR_AWARD_THRESHOLD_NOT_MET
    http: 422
    condition: "A claimed honor score below the award type's threshold (e.g. 299 claimed as PERFECT_GAME_300, a 799 scratch series claimed as SERIES_800_SCRATCH), or a duplicate application for the same series entry and award type"
  - id: ERR_NO_ELIGIBLE_TEAMS
    http: 422
    condition: "The league has fewer CONFIRMED teams than the plan's place_count, so the waterfall has an empty place to fill"
  - id: ERR_REVIEW_ROUND_LIMIT
    http: 422
    condition: "A REMAND ruling is issued on a protest whose review_round has already reached 3 (MAX_REVIEW_ROUNDS); the remand loop must terminate in an UPHOLD, DENY or ESCALATE ruling at the third hearing"

  # --- business_fiscal ------------------------------------------------------
  - id: ERR_DUES_ARREARS_BLOCK
    http: 422
    condition: "A lineup slot names a bowler whose dues_arrears_weeks exceeds max_dues_arrears_weeks"
  - id: ERR_REMITTANCE_AMOUNT_MISMATCH
    http: 422
    condition: "declared_amount_cents disagrees with the computed national + local + penalty total at submission"
  - id: ERR_DUES_WEEK_ALREADY_PAID
    http: 409
    condition: "A second dues payment for the same membership and week_number"
  - id: ERR_INSUFFICIENT_PRIZE_FUND
    http: 422
    condition: "Disbursement would drive undistributed_balance_cents below zero and break the money-conservation invariant"
  - id: ERR_DUES_AMOUNT_MISMATCH
    http: 422
    condition: "amount_cents on a dues payment is not exactly league.weekly_dues_cents"

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties)
# =============================================================================
roles:

  - name: Bowler
    description: "A sanctioned or prospective league bowler acting for their own membership: pays weekly dues, claims honor scores and files protests."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /award-applications"
      - "POST /award-applications/{id}/evidence"
    shared_operations:
      - "POST /memberships/{id}/dues-payments (shared with LeagueTreasurer)"
      - "POST /protests (shared with TeamCaptain)"
      - "every GET except the fee-remittance and dues-payment reads"

  - name: TeamCaptain
    description: "A bowler acting for their own team: submits that team's legal lineup each week and may file protests on the team's behalf. The captaincy is asserted by the X-User-Role header and bound by §1.4 priority 8 to a Membership of the team being acted for; it is not a Membership.roster_role value."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /matches/{id}/lineups (shared with LeagueSecretary; a plain Bowler is refused with ERR_FORBIDDEN_ROLE)"
      - "POST /protests (shared with Bowler)"
      - "every GET except the fee-remittance and dues-payment reads"

  - name: LeagueSecretary
    description: "The league officer named as League.secretary_member_id: adopts bylaws and the schedule, runs match operations, verifies honor scores, hears protests and approves the prize distribution plan. Every LeagueSecretary mutation is bound to that one league."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /leagues"
      - "POST /leagues/{id}/bylaws"
      - "POST /leagues/{id}/schedule"
      - "POST /leagues/{id}/close-season"
      - "POST /teams"
      - "POST /memberships"
      - "POST /matches/{id}/open"
      - "POST /matches/{id}/scores"
      - "POST /matches/{id}/certify"
      - "POST /matches/{id}/forfeit"
      - "POST /prize-funds/{id}/approve-plan"
      - "POST /award-applications/{id}/league-verification"
      - "POST /protests/{id}/review"
      - "POST /protests/{id}/ruling"
    shared_operations:
      - "POST /matches/{id}/lineups (shared with TeamCaptain)"
      - "every GET"
    segregation_constraints:
      - "may not verify an honor-score application whose applicant member is the secretary (ERR_SEGREGATION_OF_DUTIES)"
      - "may not review or rule on a protest the secretary filed (ERR_SEGREGATION_OF_DUTIES)"
      - "approves the distribution plan but can never disburse it - that surface belongs to the treasurer"

  - name: LeagueTreasurer
    description: "The league officer named as League.treasurer_member_id: remits sanction fees, records weekly dues, drafts the distribution plan, pays the awards and reverses payments."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /fee-remittances"
      - "POST /fee-remittances/{id}/submit"
      - "POST /prize-funds/{id}/distribution-plans"
      - "POST /prize-funds/{id}/disburse"
      - "POST /prize-awards/{id}/reverse"
    shared_operations:
      - "POST /memberships/{id}/dues-payments (shared with Bowler)"
      - "every GET"
    segregation_constraints:
      - "may not disburse a plan whose plan_approved_by_user_id equals the acting treasurer's X-User-ID (ERR_SEGREGATION_OF_DUTIES)"
      - "drafts the plan but can never approve it - that surface belongs to the secretary"

  - name: AssociationOfficer
    description: "An officer of the national body and its local association: registers members, certifies lane pairs, accepts or rejects fee remittances, certifies honor scores, rules on escalated protests and drives the logical clock. Not tied to any persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /members"
      - "POST /lane-pairs"
      - "POST /lane-pairs/{id}/certification"
      - "POST /fee-remittances/{id}/national-decision"
      - "POST /award-applications/{id}/association-decision"
      - "POST /protests/{id}/association-ruling"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET"
