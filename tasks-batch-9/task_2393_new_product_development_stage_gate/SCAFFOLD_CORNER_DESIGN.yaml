            - "limit 100 returns all 12 rows with has_more false"
            - "offset 12 returns an empty array with total_count 12 and has_more false, and not a 404"
            - "limit 1 returns the single highest fielded_at row, which is ${pg_ct1_id} fielded 2026-07-24, confirming fielded_at descending order"
            - "every row carries concept_score 34.20 from (0.6 * 40.00 + 0.4 * 30.00) * 0.95"
            - "only ${pg_ct1_id} has is_authoritative true, because it has the highest fielded_at, while ${pg_ct12_id} created last has is_authoritative false"

      - name: xc_filters_compose_as_conjunctions_and_never_widen_a_page
        claim_type: filter_contract
        grounds:
          - endpoints[GET /innovation-projects]
          - endpoints[GET /deliverables]
        distinguishing_aspect: |
          Every declared filter is an AND term over the same collection, so combining category with
          dev_status narrows to the intersection and can legally return zero rows, an unmatched
          shelf_reset_window_id returns an empty page rather than a 404, and total_count always
          reports the filtered population rather than the table.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 requiring CONSUMER_CONCEPT_TEST, one retailer window, and four projects across three categories, one screened and one killed on score."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: ["CONSUMER_CONCEPT_TEST"], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { fl_g2_id: $.data.id }
            - call: "POST /retailers"
              payload: { name: "Filter Grocery", channel: "GROCERY", acv_contribution_pct: 25.00, presentation_lead_days: 14 }
              as: PortfolioAdmin
