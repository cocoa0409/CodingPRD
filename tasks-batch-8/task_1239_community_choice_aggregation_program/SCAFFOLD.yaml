scenario: "1239. Community Choice Aggregation Program Operations (California CCA): customer enrollment by opt-out & notice cycle, load forecast & supply portfolio contracting, rate setting vs incumbent utility generation rate, billing via utility & payment remittance, opt-out/opt-up product election, renewable content claim & reporting, bad-debt & uncollectible sharing, regulatory compliance & exit fee"
domain_name: "community-choice-aggregation-program"
api_prefix: "/cca"
complexity_profile:
  primary_archetype: "compliance_audit"
  secondary_archetype: "ledger_reconciliation"
  complexity_layers:
    - "dual_variant_calculation"
    - "cascading_side_effects"
    - "optimistic_concurrency"
    - "scheduled_deferred_actions"
    - "ops_run_checkpoint"
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Authority
    parent: null
    common_fields: true
    description: "The CCA Joint Powers Authority itself — the top-level program configuration aggregate. Exactly one instance exists per deployment; created once by the bootstrap endpoint."
    fields:
      - name: display_name
        type: string
        source: input
        description: "Legal name of the joint powers authority"
      - name: utility_territory_code
        type: enum
        source: input
        description: "Incumbent IOU territory this CCA serves"
        constraints: "one of {PGE, SCE, SDGE}; immutable after creation"
      - name: er_balancing_authority
        type: string
        source: input
        description: "CAISO balancing authority identifier used for scheduling"
      - name: rate_setting_policy
        type: enum
        source: input
        description: "Governing-board adopted rate policy controlling rate floor behavior vs incumbent"
        constraints: "one of {COST_PLUS, DISCOUNT_TO_INCUMBENT, VALUE_BASED}"
      - name: discount_floor_bps
        type: integer
        source: input
        description: "When rate_setting_policy == DISCOUNT_TO_INCUMBENT, minimum basis-points discount any adopted default-product rate must carry vs the incumbent generation rate; otherwise ignored"
        default: 0
        constraints: "0 <= discount_floor_bps <= 2000"
      - name: rps_target_pct
        type: number
        source: input
        description: "Renewable Portfolio Standard target fraction the portfolio must meet per compliance period, e.g. 0.60"
        constraints: "0 < rps_target_pct <= 1.0"
      - name: bad_debt_trueup_cap_pct
        type: number
        source: input
        description: "Maximum fraction of billed generation revenue the CCA must absorb as incremental uncollectible share per true-up; excess rolls to the utility per tariff"
        default: 0.01
        constraints: "0 <= bad_debt_trueup_cap_pct <= 0.05"
      - name: climate_reserve_balance_cents
        type: integer
        source: computed
        description: "Cumulative rate-stabilization reserve ledger balance; credited by settlements, debited by approved draws"
        default: 0
      - name: version
        type: integer
        source: system
        description: "OCC counter; increments on every mutation of the authority or on any cascade that mutates it"
        default: 1
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the program itself"
        constraints: "one of {FORMING, ACTIVE, SUSPENDED, DISSOLVED}"

  - name: ServiceAccount
    parent: null
    common_fields: true
    description: "A utility-metered customer premises eligible for CCA service. Created in bulk by the enrollment-phase ingest endpoint; carries its own parallel state dimensions."
    fields:
      - name: utility_account_number
        type: string
        source: input
        description: "Incumbent utility's account identifier; unique within the authority"
        constraints: "unique per authority; immutable"
      - name: service_class
        type: enum
        source: input
        description: "Rate class used for load forecasting and rate comparison"
        constraints: "one of {RESIDENTIAL, SMALL_COMMERCIAL, LARGE_COMMERCIAL, INDUSTRIAL, AGRICULTURAL, STREETLIGHT}"
      - name: annual_kwh_estimate
        type: integer
        source: input
        description: "Forecast annual consumption used by load_forecast_snapshot calculation"
        constraints: ">= 0"
      - name: annual_peak_kw
        type: number
        source: input
        description: "Forecast coincident peak contribution in kW; feeds resource-adequacy obligation math"
        constraints: ">= 0"
      - name: da_eligible
        type: boolean
        source: input
        description: "Whether the account is a direct-access-eligible customer (direct-access accounts are excluded from opt-out enrollment waves)"
      - name: enrollment_state
        type: enum
        source: system
        description: "Parallel dimension 1: enrollment posture"
        constraints: "one of {PROSPECT, NOTICED, ENROLLED, OPTED_OUT, OPTED_BACK_TO_BUNDLED, CLOSED}"
        default: PROSPECT
      - name: product_election
        type: enum
        source: system
        description: "Parallel dimension 2: which product the account takes; only meaningful while enrollment_state == ENROLLED"
        constraints: "one of {DEFAULT, OPT_UP_100, OPT_DOWN_ECONOMY}"
        default: DEFAULT
      - name: current_enrollment_notice_id
        type: string
        source: system
        description: "FK -> EnrollmentNotice.id; the notice wave currently governing this account, null when PROSPECT"
      - name: vintage_year
        type: integer
        source: computed
        description: "PCIA vintage year: calendar year of the account's first ENROLLED transition; locks the exit-fee rate table used for that account"
      - name: cumulative_billed_cents
        type: integer
        source: computed
        description: "Running lifetime billed generation charges posted via billing extracts"
        default: 0
      - name: cumulative_remitted_cents
        type: integer
        source: computed
        description: "Running lifetime remitted payments applied via remittance files"
        default: 0
      - name: uncollectible_flag
        type: boolean
        source: system
        description: "Set true when the account is written off into a bad-debt pool; never set back to false"
        default: false

  - name: EnrollmentNotice
    parent: null
    common_fields: true
    description: "A statutory opt-out notice wave: accounts are mailed notices, given a cooling-off window, then mass-enrolled unless they opt out."
    fields:
      - name: wave_label
        type: string
        source: input
        description: "Human label, e.g. '2026-PHASE-2-RESIDENTIAL'"
      - name: notice_mailed_on
        type: datetime
        source: input
        description: "Date notices were mailed; statutory clock starts here"
      - name: opt_out_deadline
        type: datetime
        source: computed
        description: "notice_mailed_on + NOTICE_COOLING_OFF_DAYS; opt-outs after this instant are rejected for this wave"
      - name: enrollment_effective_on
        type: datetime
        source: computed
        description: "opt_out_deadline + ENROLLMENT_LAG_DAYS; accounts flip to ENROLLED at this instant via the epoch-advance ops run"
      - name: status
        type: enum
        source: system
        description: "Wave lifecycle"
        constraints: "one of {DRAFT, ISSUED, CLOSED, ENROLLING, SETTLED, CANCELLED}"
        default: DRAFT
      - name: target_service_classes
        type: array
        source: input
        description: "Service classes in scope for this wave; only PROSPECT accounts whose service_class is in this set are swept"
      - name: account_count_noticed
        type: integer
        source: computed
        description: "Count of accounts swept to NOTICED when the wave is issued"
        default: 0
      - name: account_count_opted_out
        type: integer
        source: computed
        description: "Count of accounts that returned OPTED_OUT at wave close"
        default: 0
      - name: account_count_enrolled
        type: integer
        source: computed
        description: "Count of accounts that flipped to ENROLLED at the ENROLLING epoch"
        default: 0

  - name: OptOutRequest
    parent: null
    common_fields: false
    description: "Append-only record of a single opt-out / opt-back-to-bundled election by an account. Immutable once recorded; the audit trail for enrollment disputes."
    fields:
      - name: service_account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; the account electing out"
      - name: enrollment_notice_id
        type: string
        source: input
        description: "FK -> EnrollmentNotice.id; the wave whose window this election was made under; must equal the account's current_enrollment_notice_id"
      - name: election_type
        type: enum
        source: input
        description: "OPT_OUT means leave CCA service entirely; OPT_BACK_TO_BUNDLED means an already-ENROLLED account returns to incumbent bundled service"
        constraints: "one of {OPT_OUT, OPT_BACK_TO_BUNDLED}"
      - name: received_at
        type: datetime
        source: system
        description: "Server logical-clock timestamp when the election was recorded"
      - name: channel
        type: enum
        source: input
        description: "How the election arrived"
        constraints: "one of {WEB, PHONE, MAIL}"
      - name: reversal_of_request_id
        type: string
        source: input
        description: "FK -> OptOutRequest.id; optional — when present this record rescinds an earlier opt-out before the wave closes"
        default: null

  - name: Product
    parent: null
    common_fields: true
    description: "A retail generation product (rate schedule) offered by the authority, e.g. default 50% renewable and opt-up 100% renewable."
    fields:
      - name: product_code
        type: string
        source: input
        description: "Stable program code, e.g. 'STANDARD50', 'EVERGREEN100'"
        constraints: "unique per authority"
      - name: election_key
        type: enum
        source: input
        description: "Which ServiceAccount.product_election value maps to this product"
        constraints: "one of {DEFAULT, OPT_UP_100, OPT_DOWN_ECONOMY}; unique per authority"
      - name: renewable_pct
        type: number
        source: input
        description: "Advertised renewable content fraction, e.g. 0.50 or 1.00"
        constraints: "0 <= renewable_pct <= 1.0"
      - name: status
        type: enum
        source: system
        description: "DRAFT products accept rate drafting; ADOPTED rates are live; RETIRED products keep historical reads"
        constraints: "one of {DRAFT, ADOPTED, RETIRED}"
        default: DRAFT
      - name: is_default
        type: boolean
        source: system
        description: "Exactly one ADOPTED product with election_key == DEFAULT must exist per authority before any wave may be issued"
        default: false

  - name: RateSchedule
    parent: Product
    common_fields: true
    description: "A versioned, board-adopted tariff sheet for a product and calendar period. Rates are compared against the incumbent utility generation rate before adoption."
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id"
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the calendar window this schedule governs"
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the calendar window"
      - name: energy_rate_cents_per_kwh
        type: number
        source: input
        description: "Flat generation energy rate, cents per kWh"
        constraints: "> 0"
      - name: pcia_rate_cents_per_kwh
        type: number
        source: input
        description: "Power Charge Indifference Adjustment (exit fee) passthrough rate collected on behalf of the incumbent, by vintage schedule this schedule references"
        constraints: ">= 0"
      - name: incumbent_benchmark_rate_cents_per_kwh
        type: number
        source: input
        description: "The incumbent utility's published generation rate used as the comparison baseline at adoption time"
        constraints: "> 0"
      - name: comparison_margin_bps
        type: integer
        source: computed
        description: "round_half_up(10000 * (incumbent_benchmark_rate_cents_per_kwh - energy_rate_cents_per_kwh) / incumbent_benchmark_rate_cents_per_kwh); positive means CCA is cheaper"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> PROPOSED -> ADOPTED -> SUPERSEDED; a REJECTED branch exists off PROPOSED"
        constraints: "one of {DRAFT, PROPOSED, ADOPTED, SUPERSEDED, REJECTED}"
        default: DRAFT
      - name: adopted_by
        type: string
        source: system
        description: "Opaque id of the BoardDirector who adopted the schedule; used for segregation-of-duties checks vs proposer"
        default: null
      - name: proposed_by
        type: string
        source: system
        description: "Opaque id of the RateAnalyst who proposed the schedule"
        default: null

  - name: SupplyContract
    parent: null
    common_fields: true
    description: "A wholesale energy / resource-adequacy contract in the supply portfolio."
    fields:
      - name: counterparty
        type: string
        source: input
        description: "Supplier legal name"
      - name: contract_type
        type: enum
        source: input
        description: "ENERGY_BLOCK is energy-only; RA_CAPACITY is resource adequacy capacity; REC_ONLY is unbundled renewable energy credits; PPA is bundled energy + RECs"
        constraints: "one of {ENERGY_BLOCK, RA_CAPACITY, REC_ONLY, PPA}"
      - name: delivery_start
        type: datetime
        source: input
        description: "Inclusive start of delivery window"
      - name: delivery_end
        type: datetime
        source: input
        description: "Exclusive end of delivery window"
      - name: capacity_mw
        type: number
        source: input
        description: "Contracted nameplate / RA capacity"
        constraints: "> 0"
      - name: total_mwh
        type: number
        source: input
        description: "Total energy over the delivery window; 0 for pure RA_CAPACITY contracts"
        constraints: ">= 0"
      - name: price_dollars_per_mwh
        type: number
        source: input
        description: "Fixed contract price"
        constraints: ">= 0"
      - name: rps_eligible_pct
        type: number
        source: input
        description: "Fraction of delivered MWh that carries RPS-eligible renewable attributes"
        constraints: "0 <= rps_eligible_pct <= 1.0"
      - name: vintage_year
        type: integer
        source: input
        description: "PCIA-relevant commitment vintage: contracts committed in or before an account's vintage year raise that vintage's exit fee"
      - name: status
        type: enum
        source: system
        description: "NEGOTIATING -> EXECUTED -> DELIVERING -> CLOSED; TERMINATED is an early-exit branch off EXECUTED/DELIVERING with a compensation side effect"
        constraints: "one of {NEGOTIATING, EXECUTED, DELIVERING, CLOSED, TERMINATED}"
        default: NEGOTIATING
      - name: termination_fee_cents
        type: integer
        source: computed
        description: "Computed at TERMINATED via contract_termination_fee; debited from climate_reserve_balance_cents"
        default: 0

  - name: LoadForecast
    parent: null
    common_fields: false
    description: "Append-only snapshot of the forecast used to size procurement. Two variants exist (adopted-plan vs actual-trued) and produce divergent coverage positions for identical accounts."
    fields:
      - name: snapshot_label
        type: string
        source: input
        description: "e.g. 'PLAN-2027', 'TRUEUP-2026-Q2'"
      - name: forecast_variant
        type: enum
        source: input
        description: "ADOPTED_PLAN uses annual_kwh_estimate as filed; ACTUAL_TRUED uses billing-extract actuals for accounts with at least one closed settlement and estimates otherwise"
        constraints: "one of {ADOPTED_PLAN, ACTUAL_TRUED}"
      - name: as_of
        type: datetime
        source: system
        description: "Logical-clock time the snapshot was computed"
      - name: period_year
        type: integer
        source: input
        description: "Calendar year being forecast"
      - name: total_energy_mwh
        type: number
        source: computed
        description: "Sum over in-scope accounts per forecast_variant, converted kWh -> MWh"
      - name: coincident_peak_mw
        type: number
        source: computed
        description: "Sum of annual_peak_kw of in-scope accounts / 1000"
      - name: ra_requirement_mw
        type: number
        source: computed
        description: "coincident_peak_mw * (1 + RA_PLANNING_RESERVE_MARGIN), rounded up to 0.1 MW"
      - name: coverage_gap_mwh
        type: integer
        source: computed
        description: "total_energy_mwh - sum of total_mwh of EXECUTED/DELIVERING contracts whose delivery window overlaps any part of period_year; negative means short"

  - name: BillingExtract
    parent: null
    common_fields: true
    description: "A monthly generation-charge file the CCA hands to the incumbent utility, which bills customers on the CCA's behalf. Drives billed-amount ledger entries per account."
    fields:
      - name: billing_month
        type: string
        source: input
        description: "YYYY-MM of service month"
        constraints: "format YYYY-MM"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> SUBMITTED -> ACCEPTED -> SETTLED; REJECTED_BY_UTILITY is a revert branch from SUBMITTED back to DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, REJECTED_BY_UTILITY, SETTLED}"
        default: DRAFT
      - name: submitted_on
        type: datetime
        source: system
        description: "Logical-clock date the extract left DRAFT"
      - name: line_count
        type: integer
        source: computed
        description: "Count of BillingLine children"
        default: 0
      - name: total_billed_cents
        type: integer
        source: computed
        description: "Sum of line generation_charge_cents over all lines"
        default: 0
      - name: total_pcia_collected_cents
        type: integer
        source: computed
        description: "Sum of line pcia_charge_cents over all lines; owed to the incumbent, not revenue"
        default: 0

  - name: BillingLine
    parent: BillingExtract
    common_fields: false
    description: "One account's charge inside a BillingExtract. Immutable once the parent extract leaves DRAFT."
    fields:
      - name: billing_extract_id
        type: string
        source: system
        description: "FK -> BillingExtract.id; set at creation by the nested endpoint path"
      - name: service_account_id
        type: string
        source: input
        description: "FK -> ServiceAccount.id; must be ENROLLED for the billed month"
      - name: usage_kwh
        type: integer
        source: input
        description: "Metered usage for the month"
        constraints: "> 0"
      - name: generation_charge_cents
        type: integer
        source: computed
        description: "usage_kwh * adopted energy_rate_cents_per_kwh for the account's product_election, rounded per line to whole cents (round_half_up)"
      - name: pcia_charge_cents
        type: integer
        source: computed
        description: "usage_kwh * pcia_rate_cents_per_kwh for the account's vintage_year schedule, rounded per line to whole cents (round_half_up)"
      - name: product_election_at_billing
        type: enum
        source: system
        description: "Snapshot of the account's product_election when the line was posted; election changes never rewrite history"
        constraints: "one of {DEFAULT, OPT_UP_100, OPT_DOWN_ECONOMY}"

  - name: RemittanceFile
    parent: null
    common_fields: true
    description: "Payment remittance the incumbent utility sends back after collecting on the CCA's behalf. Settles BillingExtracts and feeds the bad-debt true-up."
    fields:
      - name: remittance_period
        type: string
        source: input
        description: "YYYY-MM the utility is remitting for; must match an ACCEPTED BillingExtract's billing_month"
        constraints: "format YYYY-MM"
      - name: gross_remittance_cents
        type: integer
        source: input
        description: "Total cash remitted before utility fee"
        constraints: ">= 0"
      - name: utility_fee_bps
        type: integer
        source: input
        description: "Billing-agent fee the utility deducts, basis points of gross"
        constraints: "0 <= utility_fee_bps <= 300"
      - name: net_remittance_cents
        type: integer
        source: computed
        description: "gross_remittance_cents - round_half_up(gross_remittance_cents * utility_fee_bps / 10000)"
      - name: applied_cents
        type: integer
        source: computed
        description: "Portion of net_remittance_cents actually applied to account ledgers via waterfall application; must equal net_remittance_cents at settlement"
        default: 0
      - name: status
        type: enum
        source: system
        description: "RECEIVED -> RECONCILED -> SETTLED; DISPUTED is a revert branch from RECONCILED back to RECEIVED"
        constraints: "one of {RECEIVED, RECONCILED, DISPUTED, SETTLED}"
        default: RECEIVED

  - name: BadDebtPool
    parent: null
    common_fields: true
    description: "A periodic pool of written-off uncollectible account balances. Sharing between CCA and utility is computed at close; the CCA's share is capped by authority policy."
    fields:
      - name: pool_period
        type: string
        source: input
        description: "Quarter label, e.g. '2026-Q3'"
        constraints: "unique per authority"
      - name: status
        type: enum
        source: system
        description: "ACCRUING -> CLOSED -> TRUED_UP"
        constraints: "one of {ACCRUING, CLOSED, TRUED_UP}"
        default: ACCRUING
      - name: written_off_cents
        type: integer
        source: computed
        description: "Sum of written-off uncollectible balances swept into this pool at close"
        default: 0
      - name: billed_generation_cents
        type: integer
        source: computed
        description: "Total SETTLED billed generation revenue in the pool period (denominator for the cap)"
        default: 0
      - name: cca_share_cents
        type: integer
        source: computed
        description: "min(written_off_cents, round_half_up(billed_generation_cents * authority.bad_debt_trueup_cap_pct))"
      - name: utility_share_cents
        type: integer
        source: computed
        description: "written_off_cents - cca_share_cents"
      - name: reserve_draw_cents
        type: integer
        source: computed
        description: "Amount debited from Authority.climate_reserve_balance_cents at TRUED_UP; equals cca_share_cents, clamped to the reserve balance (deficit remainder is expensed, recorded in expensed_cents)"
        default: 0
      - name: expensed_cents
        type: integer
        source: computed
        description: "cca_share_cents - reserve_draw_cents; the portion of CCA share not coverable from reserve"
        default: 0

  - name: ComplianceFiling
    parent: null
    common_fields: true
    description: "A regulatory filing to the CPUC — e.g. the annual RPS compliance report or an ERRA forecast filing. Has a two-key approval chain with segregation of duties."
    fields:
      - name: filing_type
        type: enum
        source: input
        description: "RPS_ANNUAL is the renewable content claim & report; ERRA_FORECAST is the exit-fee forecast filing; PSD is the Power Source Disclosure label filing"
        constraints: "one of {RPS_ANNUAL, ERRA_FORECAST, PSD}"
      - name: compliance_year
        type: integer
        source: input
        description: "Calendar year the filing covers"
      - name: rps_actual_pct
        type: number
        source: computed
        description: "For RPS_ANNUAL: RPS-eligible MWh retired / total retail MWh served that year, per renewable_content_attainment; null for other types"
      - name: rps_shortfall_mwh
        type: integer
        source: computed
        description: "For RPS_ANNUAL: max(0, authority.rps_target_pct * retail_mwh - rps_eligible_mwh), rounded up to whole MWh"
      - name: status
        type: enum
        source: system
        description: "DRAFT -> PREPARED -> REVIEWED -> FILED -> ACCEPTED_BY_CPUC; REJECTED_BY_CPUC loops back to DRAFT (cyclic revision loop); WITHDRAWN is terminal-off-DRAFT"
        constraints: "one of {DRAFT, PREPARED, REVIEWED, FILED, ACCEPTED_BY_CPUC, REJECTED_BY_CPUC, WITHDRAWN}"
        default: DRAFT
      - name: prepared_by
        type: string
        source: system
        description: "Opaque id of the ComplianceOfficer who moved DRAFT->PREPARED"
      - name: reviewed_by
        type: string
        source: system
        description: "Opaque id of the ComplianceOfficer who moved PREPARED->REVIEWED; MUST differ from prepared_by (segregation of duties)"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times this filing has cycled REJECTED_BY_CPUC -> DRAFT"
        default: 0

  - name: RECRetirement
    parent: null
    common_fields: false
    description: "An immutable WREGIS-style retirement of renewable energy credits against a compliance year's RPS claim."
    fields:
      - name: compliance_filing_id
        type: string
        source: input
        description: "FK -> ComplianceFiling.id; the RPS_ANNUAL filing this retirement supports; filing must be in {DRAFT, PREPARED, REVIEWED} (retirements attach before the two-key chain completes; FILED and beyond are locked)"
      - name: supply_contract_id
        type: string
        source: input
        description: "FK -> SupplyContract.id; the PPA or REC_ONLY contract the attributes come from"
      - name: retired_mwh
        type: number
        source: input
        description: "RPS-eligible MWh retired"
        constraints: "> 0"
      - name: retirement_serial
        type: string
        source: input
        description: "External registry serial; unique per authority"
      - name: retired_on
        type: datetime
        source: system
        description: "Logical-clock date recorded"

state_machines:
  - entity: Authority
    initial_state: FORMING
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMING
        to: ACTIVE
        trigger: "POST /cca/authority/activate"
        actor: BoardDirector
        preconditions:
          - "At least one ADOPTED Product with election_key == DEFAULT exists"
          - "At least one ADOPTED RateSchedule exists for that default product covering the current logical-clock date"
        side_effects:
          - "Authority.version increments by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cca/authority/suspend"
        actor: BoardDirector
        preconditions:
          - "No EnrollmentNotice currently in status ENROLLING"
        side_effects:
          - "All EnrollmentNotice in ISSUED transition to CANCELLED; their NOTICED accounts revert to PROSPECT and current_enrollment_notice_id is nulled"
          - "Authority.version increments by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cca/authority/reinstate"
        actor: BoardDirector
        preconditions: []
        side_effects:
          - "Authority.version increments by 1"
      - from: ACTIVE
        to: DISSOLVED
        trigger: "POST /cca/authority/dissolve"
        actor: BoardDirector
        preconditions:
          - "No ServiceAccount with enrollment_state == ENROLLED exists"
          - "Every ComplianceFiling for the trailing 4 compliance years is in {ACCEPTED_BY_CPUC, WITHDRAWN}"
          - "Every BadDebtPool is TRUED_UP"
        side_effects:
          - "Authority.version increments by 1"

  - entity: EnrollmentNotice
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /cca/enrollment-notices/{id}/issue"
        actor: ProgramOperator
        preconditions:
          - "Authority.status == ACTIVE"
          - "notice_mailed_on >= current logical-clock date"
          - "At least one ADOPTED default Product exists with an ADOPTED RateSchedule covering enrollment_effective_on"
          - "target_service_classes is non-empty"
        side_effects:
          - "Sweep: every ServiceAccount with enrollment_state == PROSPECT, da_eligible == false, and service_class IN target_service_classes transitions to NOTICED with current_enrollment_notice_id set to this notice"
          - "account_count_noticed is set to the sweep count"
          - "opt_out_deadline and enrollment_effective_on are stamped from notice_mailed_on"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /cca/enrollment-notices/{id}/close (allowed once logical clock >= opt_out_deadline)"
        actor: ProgramOperator
        preconditions:
          - "logical clock >= opt_out_deadline"
        side_effects:
          - "account_count_opted_out recomputed: count of OptOutRequest rows with enrollment_notice_id == this notice, election_type == OPT_OUT, and no later reversal request"
      - from: CLOSED
        to: ENROLLING
        trigger: "POST /cca/_clock/advance_epoch (system epoch-advance ops run) when logical clock >= enrollment_effective_on"
        actor: system
        preconditions:
          - "logical clock >= enrollment_effective_on"
        side_effects:
          - "Every ServiceAccount with current_enrollment_notice_id == this notice and enrollment_state == NOTICED transitions to ENROLLED, product_election := DEFAULT, vintage_year := year(enrollment_effective_on)"
          - "account_count_enrolled is set to that flip count"
      - from: ENROLLING
        to: SETTLED
        trigger: "system: immediately after the ENROLLING sweep completes (same ops-run checkpoint)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade link: each flipped account's ENROLLED transition itself bubbles up — Authority.updated_at refreshed; Authority.version NOT incremented by this link (only direct authority mutations increment it)"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /cca/enrollment-notices/{id}/cancel"
        actor: ProgramOperator
        preconditions:
          - "logical clock < opt_out_deadline"
        side_effects:
          - "All NOTICED accounts with current_enrollment_notice_id == this notice revert to PROSPECT; current_enrollment_notice_id nulled"
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /cca/enrollment-notices/{id}/cancel"
        actor: ProgramOperator
        preconditions:
          - "logical clock < enrollment_effective_on"
        side_effects:
          - "All remaining NOTICED accounts revert to PROSPECT; current_enrollment_notice_id nulled"

  - entity: ServiceAccount
    initial_state: PROSPECT
    terminal_states: [CLOSED]
    note: "Parallel dimensions: enrollment_state (lifecycle) and product_election (only mutable while ENROLLED) evolve independently on the same row."
    transitions:
      - from: PROSPECT
        to: NOTICED
        trigger: "system: EnrollmentNotice ISSUED sweep"
        actor: system
        preconditions:
          - "service_class IN notice.target_service_classes"
          - "da_eligible == false"
        side_effects:
          - "current_enrollment_notice_id := notice.id"
      - from: NOTICED
        to: OPTED_OUT
        trigger: "POST /cca/opt-out-requests with election_type == OPT_OUT"
        actor: CustomerService
        preconditions:
          - "logical clock < governing notice.opt_out_deadline"
          - "enrollment_notice_id in payload == current_enrollment_notice_id"
        side_effects:
          - "current_enrollment_notice_id stays set (audit) but account is excluded from the ENROLLING sweep"
      - from: NOTICED
        to: NOTICED
        trigger: "POST /cca/opt-out-requests with reversal_of_request_id set (rescission before wave close)"
        actor: CustomerService
        preconditions:
          - "Referenced OptOutRequest exists, has election_type == OPT_OUT, belongs to this account, and logical clock < opt_out_deadline"
        side_effects:
          - "Account remains NOTICED and re-enters the ENROLLING sweep; the earlier request is marked reversed via the new row"
      - from: NOTICED
        to: ENROLLED
        trigger: "system: epoch-advance ENROLLING sweep of the governing notice"
        actor: system
        preconditions:
          - "logical clock >= notice.enrollment_effective_on"
          - "No unreversed OptOutRequest with election_type == OPT_OUT for this account under this notice"
        side_effects:
          - "product_election := DEFAULT"
          - "vintage_year := year(enrollment_effective_on)"
      - from: ENROLLED
        to: OPTED_BACK_TO_BUNDLED
        trigger: "POST /cca/opt-out-requests with election_type == OPT_BACK_TO_BUNDLED"
        actor: CustomerService
        preconditions:
          - "enrollment_state == ENROLLED"
        side_effects:
          - "Cascade hop 1: account becomes ineligible for future BillingLine posting (billing-line creation validation rejects)"
          - "Cascade hop 2 (from hop 1's ineligibility): the next ACTUAL_TRUED LoadForecast snapshot excludes this account, which itself changes coverage_gap_mwh on that snapshot"
      - from: OPTED_BACK_TO_BUNDLED
        to: CLOSED
        trigger: "POST /cca/service-accounts/{id}/close"
        actor: CustomerService
        preconditions:
          - "cumulative_billed_cents - cumulative_remitted_cents == 0 (zero open balance)"
        side_effects: []
      - from: ENROLLED
        to: CLOSED
        trigger: "POST /cca/service-accounts/{id}/close"
        actor: CustomerService
        preconditions:
          - "cumulative_billed_cents - cumulative_remitted_cents == 0"
        side_effects: []
      - from: ENROLLED
        to: ENROLLED
        trigger: "POST /cca/service-accounts/{id}/product-election (product_election dimension move)"
        actor: CustomerService
        preconditions:
          - "enrollment_state == ENROLLED"
          - "Target Product exists, status == ADOPTED, and its election_key == payload.product_election"
          - "An ADOPTED RateSchedule for the target product covers the current logical-clock date"
        side_effects:
          - "product_election := payload.product_election; applies to future BillingLines only"
          - "ServiceAccount.version increments by 1"

  - entity: Product
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /cca/products/{id}/adopt"
        actor: BoardDirector
        preconditions:
          - "At least one ADOPTED RateSchedule exists for this product"
          - "If election_key == DEFAULT: no other ADOPTED product with election_key == DEFAULT exists for the authority"
        side_effects:
          - "is_default set true when election_key == DEFAULT"
      - from: ADOPTED
        to: RETIRED
        trigger: "POST /cca/products/{id}/retire"
        actor: BoardDirector
        preconditions:
          - "No ServiceAccount with product_election == this product's election_key AND enrollment_state == ENROLLED exists"
          - "If is_default: another ADOPTED default product already exists"
        side_effects:
          - "is_default := false"

  - entity: RateSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REJECTED]
    note: "Branching: PROPOSED forks to ADOPTED or REJECTED with divergent side-effect sets."
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /cca/rate-schedules/{id}/propose"
        actor: RateAnalyst
        preconditions:
          - "period_end > period_start"
          - "Parent Product.status == DRAFT or ADOPTED"
        side_effects:
          - "proposed_by := X-User-ID of the RateAnalyst"
          - "comparison_margin_bps computed"
      - from: PROPOSED
        to: ADOPTED
        trigger: "POST /cca/rate-schedules/{id}/adopt"
        actor: BoardDirector
        preconditions:
          - "Segregation of duties: X-User-ID != proposed_by"
          - "If authority.rate_setting_policy == DISCOUNT_TO_INCUMBENT: comparison_margin_bps >= authority.discount_floor_bps"
          - "No other ADOPTED RateSchedule for the same product has an overlapping [period_start, period_end) window (half-open adjacency allowed)"
        side_effects:
          - "adopted_by := X-User-ID of the BoardDirector"
          - "Cascade hop 1: any previously ADOPTED RateSchedule for the same product whose window is fully contained inside the new window transitions to SUPERSEDED"
          - "Cascade hop 2: that SUPERSEDED transition refreshes Product.updated_at and re-evaluates whether Product has any ADOPTED schedule (used by Product.adopt precondition and Authority.activate precondition)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /cca/rate-schedules/{id}/reject"
        actor: BoardDirector
        preconditions:
          - "Segregation of duties: X-User-ID != proposed_by"
        side_effects:
          - "No cascade; schedule is terminal"
      - from: DRAFT
        to: DRAFT
        trigger: "PUT /cca/rate-schedules/{id}"
        actor: RateAnalyst
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "comparison_margin_bps recomputed from updated inputs"

  - entity: SupplyContract
    initial_state: NEGOTIATING
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: NEGOTIATING
        to: EXECUTED
        trigger: "POST /cca/supply-contracts/{id}/execute"
        actor: PortfolioManager
        preconditions:
          - "delivery_end > delivery_start"
          - "If contract_type == REC_ONLY or PPA: rps_eligible_pct > 0"
          - "If contract_type == RA_CAPACITY: capacity_mw > 0; else total_mwh > 0"
        side_effects:
          - "Becomes visible to coverage_gap_mwh on the next LoadForecast snapshot"
      - from: EXECUTED
        to: DELIVERING
        trigger: "POST /cca/_clock/advance_epoch (system) when logical clock >= delivery_start"
        actor: system
        preconditions:
          - "logical clock >= delivery_start"
        side_effects: []
      - from: DELIVERING
        to: CLOSED
        trigger: "POST /cca/_clock/advance_epoch (system) when logical clock >= delivery_end"
        actor: system
        preconditions:
          - "logical clock >= delivery_end"
        side_effects: []
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /cca/supply-contracts/{id}/terminate"
        actor: PortfolioManager
        preconditions: []
        side_effects:
          - "termination_fee_cents := contract_termination_fee(this contract, logical clock)"
          - "Cascade hop 1: Authority.climate_reserve_balance_cents debited by min(termination_fee_cents, balance) — reserve floor 0, deficit remainder discarded (expense)"
          - "Cascade hop 2: the Authority debit refreshes Authority.updated_at and increments Authority.version by 1"
      - from: DELIVERING
        to: TERMINATED
        trigger: "POST /cca/supply-contracts/{id}/terminate"
        actor: PortfolioManager
        preconditions: []
        side_effects:
          - "Same as EXECUTED -> TERMINATED (fee uses remaining-window fraction)"

  - entity: BillingExtract
    initial_state: DRAFT
    terminal_states: [SETTLED]
    note: "Branching with revert: SUBMITTED -> REJECTED_BY_UTILITY -> DRAFT (correction loop)."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /cca/billing-extracts/{id}/submit"
        actor: BillingCoordinator
        preconditions:
          - "line_count > 0"
          - "Authority.status == ACTIVE"
        side_effects:
          - "submitted_on := logical clock"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /cca/billing-extracts/{id}/utility-accept (utility-side webhook simulation)"
        actor: UtilityLiaison
        preconditions: []
        side_effects:
          - "Cascade hop 1: every child BillingLine's generation_charge_cents added to its ServiceAccount.cumulative_billed_cents"
          - "Cascade hop 2: each such account mutation refreshes that account's updated_at and version"
      - from: SUBMITTED
        to: REJECTED_BY_UTILITY
        trigger: "POST /cca/billing-extracts/{id}/utility-reject"
        actor: UtilityLiaison
        preconditions: []
        side_effects: []
      - from: REJECTED_BY_UTILITY
        to: DRAFT
        trigger: "POST /cca/billing-extracts/{id}/reopen"
        actor: BillingCoordinator
        preconditions: []
        side_effects:
          - "Lines may now be added/removed again"
      - from: ACCEPTED
        to: SETTLED
        trigger: "system: when a RemittanceFile with matching remittance_period reaches SETTLED"
        actor: system
        preconditions:
          - "RemittanceFile.remittance_period == billing_month and that file is SETTLED"
        side_effects:
          - "Extract total_billed_cents is locked into BadDebtPool.billed_generation_cents attribution for the pool whose period contains billing_month"

  - entity: RemittanceFile
    initial_state: RECEIVED
    terminal_states: [SETTLED]
    note: "Branching with revert: RECONCILED -> DISPUTED -> RECEIVED."
    transitions:
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /cca/remittance-files/{id}/reconcile"
        actor: BillingCoordinator
        preconditions:
          - "An ACCEPTED or SETTLED BillingExtract exists with billing_month == remittance_period"
        side_effects:
          - "Waterfall application: net_remittance_cents applied to that billing month's BillingLines, oldest account created_at first among ENROLLED and OPTED_BACK_TO_BUNDLED accounts with positive billed-unremitted balance; each credit increments account.cumulative_remitted_cents"
          - "Overpayment remainder (net exceeding total open balances) is credited to Authority.climate_reserve_balance_cents per the overpayment_to_reserve variant"
          - "applied_cents := net_remittance_cents"
      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /cca/remittance-files/{id}/dispute"
        actor: UtilityLiaison
        preconditions: []
        side_effects:
          - "Compensation: every cumulative_remitted_cents credit applied at RECONCILED is reversed from the affected accounts; applied_cents := 0"
      - from: DISPUTED
        to: RECEIVED
        trigger: "POST /cca/remittance-files/{id}/reopen"
        actor: BillingCoordinator
        preconditions: []
        side_effects: []
      - from: RECONCILED
        to: SETTLED
        trigger: "POST /cca/remittance-files/{id}/settle"
        actor: FinanceController
        preconditions:
          - "Segregation of duties: X-User-ID != the BillingCoordinator opaque id recorded at reconcile (stored on file as reconciled_by)"
          - "applied_cents == net_remittance_cents"
        side_effects:
          - "Cascade hop 1: matching BillingExtract (billing_month == remittance_period) transitions ACCEPTED -> SETTLED"
          - "Cascade hop 2: that extract SETTLED transition attributes its total_billed_cents to the BadDebtPool whose pool_period contains billing_month, incrementing pool.billed_generation_cents"

  - entity: BadDebtPool
    initial_state: ACCRUING
    terminal_states: [TRUED_UP]
    transitions:
      - from: ACCRUING
        to: CLOSED
        trigger: "POST /cca/bad-debt-pools/{id}/close"
        actor: FinanceController
        preconditions:
          - "logical clock is past the last day of pool_period"
        side_effects:
          - "Sweep: every ServiceAccount with uncollectible_flag == true whose write-off was recorded in pool_period contributes (cumulative_billed_cents - cumulative_remitted_cents) to written_off_cents"
          - "cca_share_cents, utility_share_cents computed per bad_debt_sharing calculation"
      - from: CLOSED
        to: TRUED_UP
        trigger: "POST /cca/bad-debt-pools/{id}/true-up"
        actor: FinanceController
        preconditions:
          - "Segregation of duties: X-User-ID != the opaque id that closed the pool (stored as closed_by)"
        side_effects:
          - "Cascade hop 1: Authority.climate_reserve_balance_cents debited by reserve_draw_cents = min(cca_share_cents, balance)"
          - "Cascade hop 2: the Authority debit increments Authority.version by 1 and refreshes updated_at"
          - "Cascade hop 3: expensed_cents := cca_share_cents - reserve_draw_cents"

  - entity: ComplianceFiling
    initial_state: DRAFT
    terminal_states: [ACCEPTED_BY_CPUC, WITHDRAWN]
    note: "Cyclic: FILED -> REJECTED_BY_CPUC -> DRAFT -> ... revision loop; revision_count accumulates."
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /cca/compliance-filings/{id}/prepare"
        actor: ComplianceOfficer
        preconditions:
          - "If filing_type == RPS_ANNUAL: at least one RECRetirement exists referencing this filing (zero-REC claims are rejected at prepare)"
        side_effects:
          - "prepared_by := X-User-ID"
          - "If filing_type == RPS_ANNUAL: rps_actual_pct and rps_shortfall_mwh computed via renewable_content_attainment"
      - from: PREPARED
        to: REVIEWED
        trigger: "POST /cca/compliance-filings/{id}/review"
        actor: ComplianceOfficer
        preconditions:
          - "Segregation of duties: X-User-ID != prepared_by"
        side_effects:
          - "reviewed_by := X-User-ID"
      - from: REVIEWED
        to: FILED
        trigger: "POST /cca/compliance-filings/{id}/file"
        actor: BoardDirector
        preconditions: []
        side_effects: []
      - from: FILED
        to: ACCEPTED_BY_CPUC
        trigger: "POST /cca/compliance-filings/{id}/cpuc-accept"
        actor: UtilityLiaison
        preconditions: []
        side_effects: []
      - from: FILED
        to: REJECTED_BY_CPUC
        trigger: "POST /cca/compliance-filings/{id}/cpuc-reject"
        actor: UtilityLiaison
        preconditions: []
        side_effects: []
      - from: REJECTED_BY_CPUC
        to: DRAFT
        trigger: "POST /cca/compliance-filings/{id}/revise"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "revision_count += 1"
          - "prepared_by, reviewed_by cleared (new cycle requires fresh two-key chain)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /cca/compliance-filings/{id}/withdraw"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

concurrency_rules:
  - rule_id: notice-issue-stale-authority
    parent_entity: Authority
    write_endpoint: "POST /cca/enrollment-notices/{id}/issue"
    occ_field: "expected_authority_version"
    description: |
      Issuing an EnrollmentNotice against an Authority whose version has advanced
      since the client last observed it is rejected. Issuance sweeps account state
      under policy fields (rate policy, default product requirement) that the
      observed Authority version governed; a stale writer must re-read and re-issue.
    error_id: ERR_STALE_AUTHORITY_VERSION
    http_status: 412
  - rule_id: remittance-reconcile-stale-extract
    parent_entity: BillingExtract
    write_endpoint: "POST /cca/remittance-files/{id}/reconcile"
    occ_field: "expected_extract_version"
    description: |
      Reconciling a RemittanceFile against a BillingExtract whose version has
      advanced since the client last observed it is rejected: the waterfall
      application distributes cash against the extract's line set, and a newer
      extract version means that line set changed under the reconciler's feet.
    error_id: ERR_STALE_EXTRACT_VERSION
    http_status: 412

calculations:
  - name: load_forecast_snapshot
    trigger: "POST /cca/load-forecasts (snapshot creation)"
    algorithm: aggregation
    formula: |
      in_scope = ServiceAccount where enrollment_state IN {NOTICED, ENROLLED}
                 (ACTUAL_TRUED variant additionally requires: if the account has
                 at least one BillingLine in a SETTLED extract, use
                 trailing-12-month actual average monthly kWh * 12 in place of
                 annual_kwh_estimate; else use annual_kwh_estimate)
      total_energy_mwh = sum(effective_annual_kwh) / 1000, rounded to 0.001
      coincident_peak_mw = sum(annual_peak_kw) / 1000, rounded to 0.001
      ra_requirement_mw = ceil_to_0p1(coincident_peak_mw * (1 + RA_PLANNING_RESERVE_MARGIN))
      coverage_gap_mwh = round(total_energy_mwh) - sum(SupplyContract.total_mwh
                         where status IN {EXECUTED, DELIVERING}
                         and delivery_start < date(period_year+1,1,1)
                         and delivery_end > date(period_year,1,1))
    input_set: "ServiceAccount in enrollment_state {NOTICED, ENROLLED}; SupplyContract in {EXECUTED, DELIVERING} whose delivery window overlaps period_year at all"
    constants:
      RA_PLANNING_RESERVE_MARGIN: 0.15
      KWH_PER_MWH: 1000
    precision: "total_energy_mwh and coincident_peak_mw to 0.001; ra_requirement_mw up to 0.1 MW; coverage_gap_mwh whole MWh"
    variants:
      - name: ADOPTED_PLAN
        when: "forecast_variant == ADOPTED_PLAN"
        difference: "Uses annual_kwh_estimate verbatim for every in-scope account"
      - name: ACTUAL_TRUED
        when: "forecast_variant == ACTUAL_TRUED"
        difference: "Accounts with at least one BillingLine in a SETTLED extract use trailing actuals (sum of usage_kwh over their SETTLED lines, annualized by * 12 / count_of_distinct_billed_months); all others fall back to annual_kwh_estimate — identical accounts can therefore produce divergent total_energy_mwh and coverage_gap_mwh across the two variants"

  - name: rate_comparison_margin
    trigger: "RateSchedule DRAFT->PROPOSED and on DRAFT update"
    algorithm: weighted_scoring
    formula: |
      comparison_margin_bps = round_half_up(
        10000 * (incumbent_benchmark_rate_cents_per_kwh - energy_rate_cents_per_kwh)
                / incumbent_benchmark_rate_cents_per_kwh)
      adoption_gate (only when authority.rate_setting_policy == DISCOUNT_TO_INCUMBENT):
        ADOPT requires comparison_margin_bps >= authority.discount_floor_bps
    input_set: "Single RateSchedule row + Authority.rate_setting_policy, discount_floor_bps"
    constants:
      BPS_DENOMINATOR: 10000
    precision: "integer basis points, round_half_up on the raw division"
    variants: []

  - name: billing_line_charges
    trigger: "POST /cca/billing-extracts/{id}/lines (line posting)"
    algorithm: tiered_pricing
    formula: |
      schedule = ADOPTED RateSchedule for the Product whose election_key ==
                 account.product_election, where period_start <= service_month_start
                 and period_end > service_month_start
      generation_charge_cents = round_half_up(usage_kwh * schedule.energy_rate_cents_per_kwh)
      vintage schedule = ADOPTED RateSchedule whose product is the authority default
                 and whose pcia table matches account.vintage_year (this scaffold pins:
                 pcia_rate_cents_per_kwh carried on the same schedule row)
      pcia_charge_cents = round_half_up(usage_kwh * schedule.pcia_rate_cents_per_kwh)
      Rounding order is pinned: each line is rounded to whole cents INDEPENDENTLY
      (round per line, then the extract total sums already-rounded lines —
      never sum-then-round).
    input_set: "One ServiceAccount (ENROLLED), its product, the ADOPTED RateSchedule covering the billing month"
    constants: {}
    precision: "whole cents per line, round_half_up, per-line-then-sum order pinned"
    variants: []

  - name: remittance_waterfall
    trigger: "RemittanceFile RECEIVED->RECONCILED"
    algorithm: waterfall_allocation
    formula: |
      net = gross_remittance_cents - round_half_up(gross_remittance_cents * utility_fee_bps / 10000)
      eligible lines = BillingLine whose parent extract.billing_month == remittance_period
        and whose account has positive (cumulative_billed_cents - cumulative_remitted_cents)
      order: account.created_at ASC (tie impossible at 1ms resolution; if a tie ever
        occurs, fall back to updated_at ASC — never id)
      apply: fill each account's open balance in order; remainder after all eligible
        accounts are zeroed is booked to Authority.climate_reserve_balance_cents
        (overpayment reserve credit)
      applied_cents must equal net at settle-time
    input_set: "BillingLines of the matching-month ACCEPTED extract; accounts with positive open balance"
    constants: {}
    precision: "whole cents; fee rounded once on the file, never per line"
    variants:
      - name: overpayment_to_reserve
        when: "net exceeds the sum of open balances"
        difference: "Excess is credited to Authority.climate_reserve_balance_cents instead of being rejected — same file produces different reserve balances depending on account balance state"

  - name: bad_debt_sharing
    trigger: "BadDebtPool ACCRUING->CLOSED"
    algorithm: threshold
    formula: |
      written_off_cents = sum over flagged accounts (cumulative_billed_cents - cumulative_remitted_cents)
      billed_generation_cents = sum of total_billed_cents over BillingExtract
        with status == SETTLED whose billing_month falls inside pool_period
      cap_cents = round_half_up(billed_generation_cents * authority.bad_debt_trueup_cap_pct)
      cca_share_cents = min(written_off_cents, cap_cents)
      utility_share_cents = written_off_cents - cca_share_cents
      Boundary is inclusive-of-cap: written_off == cap_cents => cca absorbs all of it.
    input_set: "uncollectible_flag accounts with write-off inside pool_period; SETTLED extracts whose billing_month is within pool_period"
    constants: {}
    precision: "whole cents, round_half_up on the cap product"
    variants: []

  - name: renewable_content_attainment
    trigger: "ComplianceFiling DRAFT->PREPARED for filing_type == RPS_ANNUAL"
    algorithm: aggregation
    formula: |
      retired_mwh_total = sum(RECRetirement.retired_mwh where compliance_filing_id == this filing)
      retail_mwh = sum(BillingLine.usage_kwh where parent extract status == SETTLED
        and billing_month inside compliance_year) / 1000
      rps_eligible_mwh = min(retired_mwh_total,
        sum over referenced contracts (retired_mwh * contract.rps_eligible_pct))
      rps_actual_pct = round_half_up_4dp(rps_eligible_mwh / retail_mwh)  // 0 if retail_mwh == 0
      rps_shortfall_mwh = ceil(max(0, authority.rps_target_pct * retail_mwh - rps_eligible_mwh))
    input_set: "RECRetirement rows for this filing; their SupplyContracts; SETTLED BillingLines in compliance_year"
    constants: {}
    precision: "rps_actual_pct 4 decimal places round_half_up; shortfall whole MWh rounded up"
    variants: []

  - name: contract_termination_fee
    trigger: "SupplyContract EXECUTED/DELIVERING -> TERMINATED"
    algorithm: constraint_propagation
    formula: |
      total_window_days = (delivery_end - delivery_start) in whole days
      remaining_days = max(0, (delivery_end - logical_clock) in whole days)
      remaining_fraction = remaining_days / total_window_days
      remaining_mwh = total_mwh * remaining_fraction
      fee_dollars = remaining_mwh * price_dollars_per_mwh * TERMINATION_FEE_PCT
      termination_fee_cents = round_half_up(fee_dollars * 100)
      Reserve debit clamps: debit = min(termination_fee_cents, climate_reserve_balance_cents);
      the (fee - debit) remainder is expensed and does not drive the reserve negative.
      Evaluation order pinned: remaining_fraction -> remaining_mwh -> fee -> clamp.
    input_set: "Single SupplyContract + logical clock + Authority.climate_reserve_balance_cents"
    constants:
      TERMINATION_FEE_PCT: 0.20
    precision: "whole cents, round_half_up at the final multiplication only"
    variants: []

  - name: pcia_exit_fee_passthrough
    trigger: "BillingLine posting (embedded in billing_line_charges) and ERRA_FORECAST ComplianceFiling preparation"
    algorithm: chronological
    formula: |
      For billing: pcia_charge_cents = round_half_up(usage_kwh * pcia_rate_cents_per_kwh)
      of the RateSchedule adopted for the account's vintage_year.
      For the ERRA forecast filing: projected_pcia_cents = sum over ENROLLED accounts of
      (effective annual kWh from the latest LoadForecast snapshot) * pcia rate for that
      account's vintage_year, accumulated account-by-account in created_at ASC order
      with a running integer accumulator (per-account rounding before accumulation —
      never accumulate-then-round). Two valid accumulator orders (per-account round-then-sum
      vs sum-then-round) diverge; this scaffold pins round-then-sum.
    input_set: "ENROLLED accounts; latest LoadForecast snapshot; RateSchedule pcia rates by vintage"
    constants: {}
    precision: "whole cents per account, round_half_up, pinned round-then-accumulate order"
    variants:
      - name: provisional_vintage
        when: "Account's vintage_year schedule row has not yet been ADOPTED at forecast time"
        difference: "Uses the most recently SUPERSEDED schedule's pcia rate as the provisional figure; final billing always uses the ADOPTED row — provisional vs final produce different forecasts for identical accounts"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /cca/_clock/set_current_utc and POST /cca/_clock/advance_epoch is also authenticated (all are); genuinely all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-parameter resources exist, validated left-to-right (product before schedule, extract before line, notice before accounts-in-sweep)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all parameterized endpoints"
  - priority: 4
    category: existence
    check: "Body-referenced FK resources exist (service_account_id, product_id, compliance_filing_id, supply_contract_id, enrollment_notice_id, reversal_of_request_id)"
    error_id: ERR_REFERENCED_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking FK fields in the body"
  - priority: 5
    category: state
    check: "Target resource's state machine permits the requested transition from its current state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Terminal-state lockdown with audit-distinct error: triggers fired against SETTLED extract/remittance, TRUED_UP pool, or ACCEPTED_BY_CPUC filing"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints whose target is in a terminal state"
  - priority: 7
    category: state
    check: "Authority is in a posture that allows the operation (e.g., issue requires ACTIVE; line posting requires extract DRAFT)"
    error_id: ERR_AUTHORITY_POSTURE
    http_status: 409
    applies_to: "notice issue, line posting, election change, account close"
  - priority: 8
    category: state
    check: "Authority/program prerequisites: authority activate and notice issue require an ADOPTED default product with a covering ADOPTED rate schedule"
    error_id: ERR_NO_DEFAULT_PRODUCT
    http_status: 422
    applies_to: "POST /cca/authority/activate, POST /cca/enrollment-notices/{id}/issue, POST /cca/service-accounts/{id}/product-election, POST /cca/billing-extracts/{id}/lines"
  - priority: 9
    category: business_temporal
    check: "Statutory clock rules: opt-out received_at must be < governing notice.opt_out_deadline; notice close requires clock >= opt_out_deadline; cancel requires clock < deadline; pool close requires clock past period end"
    error_id: ERR_STATUTE_WINDOW_VIOLATION
    http_status: 422
    applies_to: "opt-out creation, notice close, notice cancel, pool close"
  - priority: 10
    category: business_constraint
    check: "Segregation of duties: the two-key approval chains forbid the same X-User-ID on adjacent steps (rate propose vs adopt/reject; filing prepare vs review; remittance reconcile vs settle; pool close vs true-up)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "adopt, reject, review, settle, true-up endpoints"
  - priority: 11
    category: business_constraint
    check: "Structural uniqueness and overlap: product_code unique; election_key unique per authority; retirement_serial unique; RateSchedule ADOPTED windows for the same product must not overlap (half-open adjacency allowed); utility_account_number unique"
    error_id: ERR_UNIQUENESS_CONFLICT
    http_status: 409
    applies_to: "product create, rate-schedule adopt, REC retirement create, account ingest"
  - priority: 12
    category: business_referential
    check: "Cross-entity referential state: line posting requires the account ENROLLED; opt-out requires the notice currently governing the account; REC retirement requires its filing in {DRAFT, PREPARED, REVIEWED}; election change requires target product ADOPTED with covering schedule"
    error_id: ERR_REFERENTIAL_STATE
    http_status: 422
    applies_to: "line posting, opt-out, REC retirement, product election"
  - priority: 13
    category: business_referential
    check: "RPS_ANNUAL filing prepare requires at least one attached RECRetirement"
    error_id: ERR_ZERO_REC_CLAIM
    http_status: 422
    applies_to: "POST /cca/compliance-filings/{id}/prepare"

  - priority: 14
    category: business_fiscal
    check: "Fiscal gates: rate adoption under DISCOUNT_TO_INCUMBENT requires comparison_margin_bps >= discount_floor_bps; account close requires zero open balance"
    error_id: ERR_FISCAL_GATE
    http_status: 422
    applies_to: "rate adopt, account close, remittance reconcile"
  - priority: 15
    category: state
    check: "Dissolve precondition set: no ENROLLED accounts, all filings in {ACCEPTED_BY_CPUC, WITHDRAWN} for trailing 4 years, all pools TRUED_UP"
    error_id: ERR_DISSOLUTION_BLOCKED
    http_status: 409
    applies_to: "POST /cca/authority/dissolve"
  - priority: 16
    category: business_constraint
    check: "Field-level constraints: enums valid, kwh > 0, pct within [0,1], delivery_end > delivery_start, billing_month format YYYY-MM"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"
endpoints:
  # --- bootstrap & clock ---
  - method: POST
    path: "/cca/authority"
    description: "Bootstrap: create the singleton Authority (rejects with ERR_UNIQUENESS_CONFLICT if one already exists)"
    roles: [BoardDirector]
    code: 201
    input: [display_name, utility_territory_code, er_balancing_authority, rate_setting_policy, 'discount_floor_bps?', rps_target_pct, 'bad_debt_trueup_cap_pct?']
    output: Authority
    side_effects: ["status FORMING", "climate_reserve_balance_cents := 0"]
  - method: GET
    path: "/cca/authority"
    description: "Read the singleton authority (returns array of length 1)"
    roles: [BoardDirector, RateAnalyst, ProgramOperator, PortfolioManager, BillingCoordinator, FinanceController, ComplianceOfficer, UtilityLiaison, CustomerService]
    code: 200
    input: []
    output: Authority[]
    side_effects: []
  - method: PATCH
    path: "/cca/authority"
    description: "Update policy fields (rate_setting_policy, discount_floor_bps, rps_target_pct, bad_debt_trueup_cap_pct); carries OCC expected_authority_version"
    roles: [BoardDirector]
    code: 200
    input: ['rate_setting_policy?', 'discount_floor_bps?', 'rps_target_pct?', 'bad_debt_trueup_cap_pct?', expected_authority_version]
    output: Authority
    side_effects: ["Authority.version increments by 1"]
  - method: POST
    path: "/cca/authority/activate"
    description: "FORMING -> ACTIVE; requires adopted default product + covering adopted schedule"
    roles: [BoardDirector]
    code: 200
    input: []
    output: Authority
    side_effects: ["Authority.version increments by 1"]
  - method: POST
    path: "/cca/authority/suspend"
    description: "ACTIVE -> SUSPENDED; cancels ISSUED waves and reverts their NOTICED accounts"
    roles: [BoardDirector]
    code: 200
    input: []
    output: Authority
    side_effects: ["cascade to EnrollmentNotice ISSUED -> CANCELLED and accounts NOTICED -> PROSPECT"]
  - method: POST
    path: "/cca/authority/reinstate"
    description: "SUSPENDED -> ACTIVE"
    roles: [BoardDirector]
    code: 200
    input: []
    output: Authority
    side_effects: ["Authority.version increments by 1"]
  - method: POST
    path: "/cca/authority/dissolve"
    description: "ACTIVE -> DISSOLVED under strict preconditions"
    roles: [BoardDirector]
    code: 200
    input: []
    output: Authority
    side_effects: []
  - method: POST
    path: "/cca/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server startup default time is exactly 2026-05-01T00:00:00Z; before any set call the clock reads that default and MUST NOT fall back to wall-clock time."
    roles: [BoardDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []
  - method: POST
    path: "/cca/_clock/advance_epoch"
    description: "Test-driving endpoint: run the epoch-advance ops checkpoint at the current logical time — fires EnrollmentNotice CLOSED->ENROLLING->SETTLED sweeps and SupplyContract EXECUTED->DELIVERING->CLOSED transitions whose time gates are met"
    roles: [BoardDirector]
    code: 200
    input: []
    output: "{ advanced_notices: integer, flipped_accounts: integer, advanced_contracts: integer }"
    side_effects: ["per state machines: ENROLLING sweep, contract delivery transitions"]

  # --- service accounts ---
  - method: POST
    path: "/cca/service-accounts/ingest"
    description: "Bulk ingest of eligible accounts for enrollment phases; rejects any duplicate utility_account_number atomically (all-or-nothing)"
    roles: [ProgramOperator]
    code: 201
    input: [accounts]
    output: "{ ingested_count: integer, account_ids: string[] }"
    side_effects: ["each account created PROSPECT"]
  - method: GET
    path: "/cca/service-accounts"
    description: "List accounts with filters"
    roles: [ProgramOperator, CustomerService, BillingCoordinator, FinanceController, PortfolioManager]
    code: 200
    input: ['enrollment_state?', 'product_election?', 'service_class?', 'current_enrollment_notice_id?', 'uncollectible_flag?', 'limit?', 'offset?']
    output: ServiceAccount[]
    side_effects: []
  - method: GET
    path: "/cca/service-accounts/{id}"
    description: "Read one account"
    roles: [ProgramOperator, CustomerService, BillingCoordinator, FinanceController]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: []
  - method: POST
    path: "/cca/service-accounts/{id}/product-election"
    description: "Change product_election while ENROLLED (DEFAULT / OPT_UP_100 / OPT_DOWN_ECONOMY)"
    roles: [CustomerService]
    code: 200
    input: [product_election]
    output: ServiceAccount
    side_effects: ["ServiceAccount.version increments by 1"]
  - method: POST
    path: "/cca/service-accounts/{id}/close"
    description: "Close account; requires zero open balance"
    roles: [CustomerService]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: []
  - method: POST
    path: "/cca/service-accounts/{id}/write-off"
    description: "Flag account uncollectible into the currently ACCRUING BadDebtPool (records write-off attribution period)"
    roles: [FinanceController]
    code: 200
    input: []
    output: ServiceAccount
    side_effects: ["uncollectible_flag := true; attribution stamped to the ACCRUING pool whose pool_period contains the current logical date"]

  # --- enrollment notices & opt-outs ---
  - method: POST
    path: "/cca/enrollment-notices"
    description: "Create a notice wave in DRAFT"
    roles: [ProgramOperator]
    code: 201
    input: [wave_label, notice_mailed_on, target_service_classes]
    output: EnrollmentNotice
    side_effects: []
  - method: GET
    path: "/cca/enrollment-notices"
    description: "List notices"
    roles: [ProgramOperator, CustomerService, ComplianceOfficer]
    code: 200
    input: ['status?', 'limit?', 'offset?']
    output: EnrollmentNotice[]
    side_effects: []
  - method: GET
    path: "/cca/enrollment-notices/{id}"
    description: "Read one notice"
    roles: [ProgramOperator, CustomerService, ComplianceOfficer]
    code: 200
    input: []
    output: EnrollmentNotice
    side_effects: []
  - method: POST
    path: "/cca/enrollment-notices/{id}/issue"
    description: "DRAFT -> ISSUED; sweeps eligible PROSPECT accounts to NOTICED. OCC on Authority version."
    roles: [ProgramOperator]
    code: 200
    input: [expected_authority_version]
    output: EnrollmentNotice
    side_effects: ["sweep accounts PROSPECT->NOTICED", "account_count_noticed set", "increments Authority.version by 1"]
  - method: POST
    path: "/cca/enrollment-notices/{id}/close"
    description: "ISSUED -> CLOSED once clock >= opt_out_deadline"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: EnrollmentNotice
    side_effects: ["account_count_opted_out recomputed"]
  - method: POST
    path: "/cca/enrollment-notices/{id}/cancel"
    description: "ISSUED/CLOSED -> CANCELLED before enrollment_effective_on; reverts accounts"
    roles: [ProgramOperator]
    code: 200
    input: []
    output: EnrollmentNotice
    side_effects: ["accounts NOTICED -> PROSPECT, current_enrollment_notice_id nulled"]
  - method: GET
    path: "/cca/enrollment-notices/{id}/opt-out-requests"
    description: "Reverse-reachability: all OptOutRequest rows under this notice"
    roles: [ProgramOperator, CustomerService]
    code: 200
    input: []
    output: OptOutRequest[]
    side_effects: []
  - method: POST
    path: "/cca/opt-out-requests"
    description: "Record an opt-out (or rescission) for an account; drives NOTICED -> OPTED_OUT or ENROLLED -> OPTED_BACK_TO_BUNDLED"
    roles: [CustomerService]
    code: 201
    input: [service_account_id, enrollment_notice_id, election_type, channel, 'reversal_of_request_id?']
    output: OptOutRequest
    side_effects: ["account state transition per ServiceAccount machine"]
  - method: GET
    path: "/cca/opt-out-requests"
    description: "Filtered list (also serves ServiceAccount -> OptOutRequest and OptOutRequest self-reference reverse reachability)"
    roles: [CustomerService, ProgramOperator]
    code: 200
    input: ['service_account_id?', 'enrollment_notice_id?', 'election_type?', 'reversal_of_request_id?', 'limit?', 'offset?']
    output: OptOutRequest[]
    side_effects: []
  - method: GET
    path: "/cca/opt-out-requests/{id}"
    description: "Read one opt-out request"
    roles: [CustomerService, ProgramOperator]
    code: 200
    input: []
    output: OptOutRequest
    side_effects: []

  # --- products & rates ---
  - method: POST
    path: "/cca/products"
    description: "Create a product in DRAFT"
    roles: [RateAnalyst]
    code: 201
    input: [product_code, election_key, renewable_pct]
    output: Product
    side_effects: []
  - method: GET
    path: "/cca/products"
    description: "List products"
    roles: [RateAnalyst, BoardDirector, CustomerService, ProgramOperator]
    code: 200
    input: ['status?', 'election_key?', 'limit?', 'offset?']
    output: Product[]
    side_effects: []
  - method: GET
    path: "/cca/products/{id}"
    description: "Read one product"
    roles: [RateAnalyst, BoardDirector, CustomerService]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/cca/products/{id}/adopt"
    description: "DRAFT -> ADOPTED"
    roles: [BoardDirector]
    code: 200
    input: []
    output: Product
    side_effects: ["is_default set when election_key == DEFAULT"]
  - method: POST
    path: "/cca/products/{id}/retire"
    description: "ADOPTED -> RETIRED"
    roles: [BoardDirector]
    code: 200
    input: []
    output: Product
    side_effects: ["is_default := false"]
  - method: GET
    path: "/cca/products/{id}/rate-schedules"
    description: "Reverse-reachability: schedules of a product"
    roles: [RateAnalyst, BoardDirector, CustomerService]
    code: 200
    input: []
    output: RateSchedule[]
    side_effects: []
  - method: POST
    path: "/cca/rate-schedules"
    description: "Create a schedule in DRAFT under a product"
    roles: [RateAnalyst]
    code: 201
    input: [product_id, period_start, period_end, energy_rate_cents_per_kwh, pcia_rate_cents_per_kwh, incumbent_benchmark_rate_cents_per_kwh]
    output: RateSchedule
    side_effects: ["comparison_margin_bps computed"]
  - method: GET
    path: "/cca/rate-schedules"
    description: "Filtered list of schedules"
    roles: [RateAnalyst, BoardDirector, CustomerService]
    code: 200
    input: ['product_id?', 'status?', 'limit?', 'offset?']
    output: RateSchedule[]
    side_effects: []
  - method: GET
    path: "/cca/rate-schedules/{id}"
    description: "Read one schedule"
    roles: [RateAnalyst, BoardDirector, CustomerService]
    code: 200
    input: []
    output: RateSchedule
    side_effects: []
  - method: PUT
    path: "/cca/rate-schedules/{id}"
    description: "Update a DRAFT schedule's rates/window; recomputes comparison_margin_bps"
    roles: [RateAnalyst]
    code: 200
    input: ['period_start?', 'period_end?', 'energy_rate_cents_per_kwh?', 'pcia_rate_cents_per_kwh?', 'incumbent_benchmark_rate_cents_per_kwh?']
    output: RateSchedule
    side_effects: ["comparison_margin_bps recomputed"]
  - method: POST
    path: "/cca/rate-schedules/{id}/propose"
    description: "DRAFT -> PROPOSED"
    roles: [RateAnalyst]
    code: 200
    input: []
    output: RateSchedule
    side_effects: ["proposed_by set"]
  - method: POST
    path: "/cca/rate-schedules/{id}/adopt"
    description: "PROPOSED -> ADOPTED; segregation of duties vs proposed_by; fiscal gate vs incumbent; supersedes contained schedules"
    roles: [BoardDirector]
    code: 200
    input: []
    output: RateSchedule
    side_effects: ["adopted_by set", "contained ADOPTED schedules -> SUPERSEDED"]
  - method: POST
    path: "/cca/rate-schedules/{id}/reject"
    description: "PROPOSED -> REJECTED; segregation of duties vs proposed_by"
    roles: [BoardDirector]
    code: 200
    input: []
    output: RateSchedule
    side_effects: []

  # --- supply portfolio ---
  - method: POST
    path: "/cca/supply-contracts"
    description: "Create a contract in NEGOTIATING"
    roles: [PortfolioManager]
    code: 201
    input: [counterparty, contract_type, delivery_start, delivery_end, capacity_mw, total_mwh, price_dollars_per_mwh, rps_eligible_pct, vintage_year]
    output: SupplyContract
    side_effects: []
  - method: GET
    path: "/cca/supply-contracts"
    description: "List contracts"
    roles: [PortfolioManager, FinanceController, ComplianceOfficer]
    code: 200
    input: ['status?', 'contract_type?', 'vintage_year?', 'limit?', 'offset?']
    output: SupplyContract[]
    side_effects: []
  - method: GET
    path: "/cca/supply-contracts/{id}"
    description: "Read one contract"
    roles: [PortfolioManager, FinanceController, ComplianceOfficer]
    code: 200
    input: []
    output: SupplyContract
    side_effects: []
  - method: POST
    path: "/cca/supply-contracts/{id}/execute"
    description: "NEGOTIATING -> EXECUTED"
    roles: [PortfolioManager]
    code: 200
    input: []
    output: SupplyContract
    side_effects: []
  - method: POST
    path: "/cca/supply-contracts/{id}/terminate"
    description: "EXECUTED/DELIVERING -> TERMINATED; fee computed, reserve debited"
    roles: [PortfolioManager]
    code: 200
    input: []
    output: SupplyContract
    side_effects: ["termination_fee_cents computed", "Authority.climate_reserve_balance_cents debited (clamped)", "Authority.version incremented"]
  - method: GET
    path: "/cca/supply-contracts/{id}/rec-retirements"
    description: "Reverse-reachability: retirements referencing this contract"
    roles: [ComplianceOfficer, PortfolioManager]
    code: 200
    input: []
    output: RECRetirement[]
    side_effects: []

  # --- load forecast ---
  - method: POST
    path: "/cca/load-forecasts"
    description: "Compute and persist a forecast snapshot (ADOPTED_PLAN or ACTUAL_TRUED variant)"
    roles: [PortfolioManager]
    code: 201
    input: [snapshot_label, forecast_variant, period_year]
    output: LoadForecast
    side_effects: ["load_forecast_snapshot calculation runs"]
  - method: GET
    path: "/cca/load-forecasts"
    description: "List snapshots"
    roles: [PortfolioManager, RateAnalyst, FinanceController]
    code: 200
    input: ['forecast_variant?', 'period_year?', 'limit?', 'offset?']
    output: LoadForecast[]
    side_effects: []
  - method: GET
    path: "/cca/load-forecasts/{id}"
    description: "Read one snapshot"
    roles: [PortfolioManager, RateAnalyst, FinanceController]
    code: 200
    input: []
    output: LoadForecast
    side_effects: []

  # --- billing ---
  - method: POST
    path: "/cca/billing-extracts"
    description: "Create a DRAFT extract for a billing month"
    roles: [BillingCoordinator]
    code: 201
    input: [billing_month]
    output: BillingExtract
    side_effects: []
  - method: GET
    path: "/cca/billing-extracts"
    description: "List extracts"
    roles: [BillingCoordinator, FinanceController, UtilityLiaison]
    code: 200
    input: ['status?', 'billing_month?', 'limit?', 'offset?']
    output: BillingExtract[]
    side_effects: []
  - method: GET
    path: "/cca/billing-extracts/{id}"
    description: "Read one extract"
    roles: [BillingCoordinator, FinanceController, UtilityLiaison]
    code: 200
    input: []
    output: BillingExtract
    side_effects: []
  - method: POST
    path: "/cca/billing-extracts/{id}/lines"
    description: "Post a BillingLine into a DRAFT extract; computes charges per billing_line_charges"
    roles: [BillingCoordinator]
    code: 201
    input: [service_account_id, usage_kwh]
    output: BillingLine
    side_effects: ["extract line_count, total_billed_cents, total_pcia_collected_cents recomputed"]
  - method: GET
    path: "/cca/billing-extracts/{id}/lines"
    description: "Reverse-reachability: lines of an extract"
    roles: [BillingCoordinator, FinanceController, UtilityLiaison]
    code: 200
    input: []
    output: BillingLine[]
    side_effects: []
  - method: GET
    path: "/cca/billing-lines"
    description: "Filtered list of billing lines (ServiceAccount -> BillingLine reverse reachability)"
    roles: [BillingCoordinator, FinanceController, CustomerService]
    code: 200
    input: ['service_account_id?', 'billing_extract_id?', 'limit?', 'offset?']
    output: BillingLine[]
    side_effects: []
  - method: GET
    path: "/cca/billing-lines/{id}"
    description: "Read one billing line"
    roles: [BillingCoordinator, FinanceController, CustomerService]
    code: 200
    input: []
    output: BillingLine
    side_effects: []
  - method: POST
    path: "/cca/billing-extracts/{id}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [BillingCoordinator]
    code: 200
    input: []
    output: BillingExtract
    side_effects: ["submitted_on set"]
  - method: POST
    path: "/cca/billing-extracts/{id}/utility-accept"
    description: "SUBMITTED -> ACCEPTED; cascades billed cents onto account ledgers"
    roles: [UtilityLiaison]
    code: 200
    input: []
    output: BillingExtract
    side_effects: ["cumulative_billed_cents credited per line; account versions incremented"]
  - method: POST
    path: "/cca/billing-extracts/{id}/utility-reject"
    description: "SUBMITTED -> REJECTED_BY_UTILITY"
    roles: [UtilityLiaison]
    code: 200
    input: []
    output: BillingExtract
    side_effects: []
  - method: POST
    path: "/cca/billing-extracts/{id}/reopen"
    description: "REJECTED_BY_UTILITY -> DRAFT"
    roles: [BillingCoordinator]
    code: 200
    input: []
    output: BillingExtract
    side_effects: []

  # --- remittance ---
  - method: POST
    path: "/cca/remittance-files"
    description: "Register an incoming utility remittance (RECEIVED)"
    roles: [BillingCoordinator]
    code: 201
    input: [remittance_period, gross_remittance_cents, utility_fee_bps]
    output: RemittanceFile
    side_effects: ["net_remittance_cents computed"]
  - method: GET
    path: "/cca/remittance-files"
    description: "List remittance files"
    roles: [BillingCoordinator, FinanceController, UtilityLiaison]
    code: 200
    input: ['status?', 'remittance_period?', 'limit?', 'offset?']
    output: RemittanceFile[]
    side_effects: []
  - method: GET
    path: "/cca/remittance-files/{id}"
    description: "Read one remittance file"
    roles: [BillingCoordinator, FinanceController, UtilityLiaison]
    code: 200
    input: []
    output: RemittanceFile
    side_effects: []
  - method: POST
    path: "/cca/remittance-files/{id}/reconcile"
    description: "RECEIVED -> RECONCILED; waterfall-applies cash to account ledgers. OCC on the matching BillingExtract version."
    roles: [BillingCoordinator]
    code: 200
    input: [expected_extract_version]
    output: RemittanceFile
    side_effects: ["remittance_waterfall runs", "increments BillingExtract.version by 1", "account cumulative_remitted_cents credited"]
  - method: POST
    path: "/cca/remittance-files/{id}/dispute"
    description: "RECONCILED -> DISPUTED; reverses applied credits (compensation)"
    roles: [UtilityLiaison]
    code: 200
    input: []
    output: RemittanceFile
    side_effects: ["applied credits reversed from accounts", "applied_cents := 0"]
  - method: POST
    path: "/cca/remittance-files/{id}/reopen"
    description: "DISPUTED -> RECEIVED"
    roles: [BillingCoordinator]
    code: 200
    input: []
    output: RemittanceFile
    side_effects: []
  - method: POST
    path: "/cca/remittance-files/{id}/settle"
    description: "RECONCILED -> SETTLED; segregation of duties vs reconciler; cascades extract -> SETTLED -> pool attribution"
    roles: [FinanceController]
    code: 200
    input: []
    output: RemittanceFile
    side_effects: ["BillingExtract ACCEPTED -> SETTLED", "BadDebtPool.billed_generation_cents incremented"]

  # --- bad debt ---
  - method: POST
    path: "/cca/bad-debt-pools"
    description: "Open an ACCRUING pool for a quarter"
    roles: [FinanceController]
    code: 201
    input: [pool_period]
    output: BadDebtPool
    side_effects: []
  - method: GET
    path: "/cca/bad-debt-pools"
    description: "List pools"
    roles: [FinanceController, UtilityLiaison, BoardDirector]
    code: 200
    input: ['status?', 'limit?', 'offset?']
    output: BadDebtPool[]
    side_effects: []
  - method: GET
    path: "/cca/bad-debt-pools/{id}"
    description: "Read one pool"
    roles: [FinanceController, UtilityLiaison, BoardDirector]
    code: 200
    input: []
    output: BadDebtPool
    side_effects: []
  - method: POST
    path: "/cca/bad-debt-pools/{id}/close"
    description: "ACCRUING -> CLOSED; computes sharing split"
    roles: [FinanceController]
    code: 200
    input: []
    output: BadDebtPool
    side_effects: ["bad_debt_sharing calculation runs"]
  - method: POST
    path: "/cca/bad-debt-pools/{id}/true-up"
    description: "CLOSED -> TRUED_UP; segregation of duties vs closer; reserve draw cascade"
    roles: [FinanceController]
    code: 200
    input: []
    output: BadDebtPool
    side_effects: ["Authority.climate_reserve_balance_cents debited by reserve_draw_cents", "Authority.version incremented", "expensed_cents computed"]

  # --- compliance ---
  - method: POST
    path: "/cca/compliance-filings"
    description: "Create a filing in DRAFT"
    roles: [ComplianceOfficer]
    code: 201
    input: [filing_type, compliance_year]
    output: ComplianceFiling
    side_effects: []
  - method: GET
    path: "/cca/compliance-filings"
    description: "List filings"
    roles: [ComplianceOfficer, BoardDirector, UtilityLiaison]
    code: 200
    input: ['filing_type?', 'status?', 'compliance_year?', 'limit?', 'offset?']
    output: ComplianceFiling[]
    side_effects: []
  - method: GET
    path: "/cca/compliance-filings/{id}"
    description: "Read one filing"
    roles: [ComplianceOfficer, BoardDirector, UtilityLiaison]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: []
  - method: GET
    path: "/cca/compliance-filings/{id}/rec-retirements"
    description: "Reverse-reachability: retirements supporting this filing"
    roles: [ComplianceOfficer, BoardDirector]
    code: 200
    input: []
    output: RECRetirement[]
    side_effects: []
  - method: POST
    path: "/cca/compliance-filings/{id}/prepare"
    description: "DRAFT -> PREPARED; computes RPS attainment for RPS_ANNUAL"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: ["prepared_by set", "rps_actual_pct, rps_shortfall_mwh computed for RPS_ANNUAL"]
  - method: POST
    path: "/cca/compliance-filings/{id}/review"
    description: "PREPARED -> REVIEWED; segregation of duties vs prepared_by"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: ["reviewed_by set"]
  - method: POST
    path: "/cca/compliance-filings/{id}/file"
    description: "REVIEWED -> FILED"
    roles: [BoardDirector]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: []
  - method: POST
    path: "/cca/compliance-filings/{id}/cpuc-accept"
    description: "FILED -> ACCEPTED_BY_CPUC"
    roles: [UtilityLiaison]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: []
  - method: POST
    path: "/cca/compliance-filings/{id}/cpuc-reject"
    description: "FILED -> REJECTED_BY_CPUC"
    roles: [UtilityLiaison]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: []
  - method: POST
    path: "/cca/compliance-filings/{id}/revise"
    description: "REJECTED_BY_CPUC -> DRAFT; revision_count += 1"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: ["revision_count incremented", "prepared_by/reviewed_by cleared"]
  - method: POST
    path: "/cca/compliance-filings/{id}/withdraw"
    description: "DRAFT -> WITHDRAWN"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceFiling
    side_effects: []

  # --- REC retirements ---
  - method: POST
    path: "/cca/rec-retirements"
    description: "Record a REC retirement against an RPS_ANNUAL filing from a contract"
    roles: [ComplianceOfficer]
    code: 201
    input: [compliance_filing_id, supply_contract_id, retired_mwh, retirement_serial]
    output: RECRetirement
    side_effects: []
  - method: GET
    path: "/cca/rec-retirements"
    description: "Filtered list of retirements"
    roles: [ComplianceOfficer, BoardDirector]
    code: 200
    input: ['compliance_filing_id?', 'supply_contract_id?', 'limit?', 'offset?']
    output: RECRetirement[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers, or undeclared role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role is not in the endpoint's roles list"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-parameter resource id does not exist"
  - id: ERR_REFERENCED_NOT_FOUND
    http: 404
    condition: "Body-referenced FK id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Field-level validation failure: bad enum, non-positive quantity, malformed YYYY-MM, delivery_end <= delivery_start, missing required field"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State machine has no transition for this trigger from the resource's current state (includes terminal-state lockdown and idempotent re-fire)"
  - id: ERR_AUTHORITY_POSTURE
    http: 409
    condition: "Authority status (or parent-entity status) blocks the operation: e.g., notice issue while SUSPENDED, line posting into non-DRAFT extract"
  - id: ERR_STATUTE_WINDOW_VIOLATION
    http: 422
    condition: "Statutory timing window breached: opt-out after opt_out_deadline, notice close before deadline, cancel after enrollment_effective_on, pool close before period end"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Same X-User-ID attempted adjacent steps of a two-key chain (propose/adopt, prepare/review, reconcile/settle, close/true-up)"
  - id: ERR_UNIQUENESS_CONFLICT
    http: 409
    condition: "Unique-field collision (utility_account_number, product_code, election_key per authority, retirement_serial) or ADOPTED rate-window overlap for the same product, or second Authority bootstrap"
  - id: ERR_REFERENTIAL_STATE
    http: 422
    condition: "Cross-entity referential state failure: billing line for non-ENROLLED account, opt-out under a notice that does not govern the account, REC retirement against a filing not in {DRAFT, PREPARED, REVIEWED}, election to non-ADOPTED product"
  - id: ERR_FISCAL_GATE
    http: 422
    condition: "Fiscal rule breached: rate adoption margin below discount_floor_bps under DISCOUNT_TO_INCUMBENT, account close with nonzero open balance"
  - id: ERR_STALE_AUTHORITY_VERSION
    http: 412
    condition: "expected_authority_version does not match the authority's current version (OCC on notice issue)"
  - id: ERR_STALE_EXTRACT_VERSION
    http: 412
    condition: "expected_extract_version does not match the matching BillingExtract's current version (OCC on remittance reconcile)"
  - id: ERR_NO_DEFAULT_PRODUCT
    http: 422
    condition: "Operation requires an ADOPTED default product with a covering ADOPTED rate schedule and none exists (authority activate, notice issue, product election, billing line posting)"
  - id: ERR_ZERO_REC_CLAIM
    http: 422
    condition: "RPS_ANNUAL filing prepare attempted with zero REC retirements attached"
  - id: ERR_DISSOLUTION_BLOCKED
    http: 409
    condition: "Dissolve precondition failed: enrolled accounts remain, filings open, or pools not trued up"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Trigger fired against a terminal-state resource (distinct from ERR_INVALID_STATE for audit clarity on closed books: SETTLED extract/remittance, TRUED_UP pool, ACCEPTED_BY_CPUC filing)"

roles:
  - name: BoardDirector
    description: "Governing-board member: adopts rates and products, activates/suspends/dissolves the authority, files regulatory submissions, operates the logical clock"
    identity: "opaque"
    exclusive_operations: ["authority activate/suspend/reinstate/dissolve/patch", "product adopt/retire", "rate-schedule adopt/reject", "compliance-filing file", "clock endpoints"]
    shared_operations: ["read authority, products, schedules, pools, filings"]
  - name: RateAnalyst
    description: "Drafts products and rate schedules, proposes rates; cannot adopt what they proposed"
    identity: "opaque"
    exclusive_operations: ["product create", "rate-schedule create/update/propose"]
    shared_operations: ["read products, schedules, load forecasts"]
  - name: ProgramOperator
    description: "Runs enrollment operations: ingests accounts, creates and issues notice waves, closes/cancels waves"
    identity: "opaque"
    exclusive_operations: ["service-account ingest", "enrollment-notice create/issue/close/cancel"]
    shared_operations: ["read accounts, notices, opt-out requests"]
  - name: CustomerService
    description: "Records customer elections: opt-outs, rescissions, product election changes, account closures"
    identity: "opaque"
    exclusive_operations: ["opt-out-request create", "product-election change", "account close"]
    shared_operations: ["read accounts, notices, products"]
  - name: PortfolioManager
    description: "Manages the supply portfolio: contracts, execution, termination, load forecasts"
    identity: "opaque"
    exclusive_operations: ["supply-contract create/execute/terminate", "load-forecast create"]
    shared_operations: ["read contracts, forecasts"]
  - name: BillingCoordinator
    description: "Builds and submits billing extracts, registers and reconciles remittances; cannot settle what they reconciled"
    identity: "opaque"
    exclusive_operations: ["billing-extract create/lines/submit/reopen", "remittance-file create/reconcile/reopen"]
    shared_operations: ["read extracts, lines, remittances"]
  - name: FinanceController
    description: "Settles remittances, manages bad-debt pools and write-offs; cannot settle files they reconciled (they never reconcile), cannot true-up pools they closed"
    identity: "opaque"
    exclusive_operations: ["remittance-file settle", "bad-debt-pool create/close/true-up", "account write-off"]
    shared_operations: ["read accounts, extracts, remittances, pools"]
  - name: ComplianceOfficer
    description: "Prepares and reviews regulatory filings, records REC retirements; cannot review what they prepared"
    identity: "opaque"
    exclusive_operations: ["compliance-filing create/prepare/review/revise/withdraw", "rec-retirement create"]
    shared_operations: ["read filings, retirements, contracts"]
  - name: UtilityLiaison
    description: "Acts for the incumbent utility side: accepts/rejects extracts, disputes remittances, returns CPUC dispositions"
    identity: "opaque"
    exclusive_operations: ["billing-extract utility-accept/utility-reject", "remittance-file dispute", "compliance-filing cpuc-accept/cpuc-reject"]
    shared_operations: ["read extracts, remittances, filings"]
