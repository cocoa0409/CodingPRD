        grounds: ["validations[priority=9]", "errors[ERR_NO_ITEMS]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / schedule_empty_item_set"
          rationale: "The empty-item-set ERR_NO_ITEMS path is asserted directly by the named §1.8 boundary instance."
      - name: error_porch_attestation_required_stub
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_PORCH_ATTESTATION_REQUIRED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / schedule_safety_beats_capacity_fiscal"
          rationale: "ERR_PORCH_ATTESTATION_REQUIRED is the returned error of the named §1.8 priority-conflict instance."
      - name: error_route_window_conflict_stub
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ROUTE_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / route_window_overlap_on_vehicle"
          rationale: "The vehicle route-window overlap is the trigger of the named §1.8 overlap instance."
      - name: error_stop_slot_conflict_stub
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_STOP_SLOT_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / stop_slot_overlap_with_buffer_on_route"
          rationale: "The buffered stop-slot conflict is the trigger of the named §1.8 overlap instance."
      - name: error_route_not_open_stub
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_ROUTE_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / schedule_requires_route_open"
          rationale: "ERR_ROUTE_NOT_OPEN is asserted by the named §1.8 cross-entity instance."
      - name: error_partner_suspended_stub
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_PARTNER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / resume_requires_partner_active"
          rationale: "ERR_PARTNER_SUSPENDED is asserted by the named §1.8 cross-entity instance."

  - section: state_machines
    instances:
