            - "${err} == ERR_180_DAY_WINDOW_NOT_OPEN with HTTP 422 and no DeferralElection row is created"
            - "EligibleGain.${gain_id}.status is still ELIGIBLE with elected_amount == 0.00 and unelected_amount == 200000.00 after the rejection"
            - "After the clock moves to 2027-01-15 the identical request answers HTTP 201 with ${days} == 15 and ${elec_status} == DEFERRED"
            - "EligibleGain.${gain_id}.status == FULLY_INVESTED with elected_amount == 200000.00 and unelected_amount == 0.00"

      - name: wcsh_schedule_mismatch_and_closed_window_rejected
        claim_type: error_triggerable
        grounds:
