- rule_id: priority_pair_validation_conflict
  instances:
  - name: state_vs_business_fiscal_return_conflict
    grounds:
    - validations[priority=5]
    - validations[priority=18]
    - calculations.mileage_true_up_settlement
    - state_machines.CarAssignment.ACTIVE_to_COMPLETED
    - entities.CarReturn.fields.mileage_overage_cents
    - entities.LeaseFleetCar.fields.status
    distinguishing_aspect: 'A second POST /api/v1/car-returns against a placement already closed by its

      first return violates two validations at the same time: priority 5 (category

      `state`, ERR_INVALID_STATE — CarAssignment.status is COMPLETED, not ACTIVE) and

      priority 18 (category `business_fiscal`, ERR_CREDIT_LIMIT_EXCEEDED — the

      lessee''s outstanding_balance_cents of 60000 plus the return''s projected charge

      exceeds the 60000 credit ceiling). The lower priority number wins, so the

      response is ERR_INVALID_STATE / 409 and never ERR_CREDIT_LIMIT_EXCEEDED / 402.

      This is the `state` vs `business_fiscal` error-category pair.

      '
    test_recipe:
      setup:
      - Logical clock at 2026-09-01T00:00:00Z; empty DB.
      - A RETAINED order for 1 car of a fresh car type is component-reserved, released, changed over and
        completed on 2026-09-03, producing one LeaseFleetCar in status HELD with built_date 2026-09-03.
      - A NET lease contract (term 2026-09-01..2027-09-01, fleet_car_cap 10) is ACTIVE for a lessee whose
        credit_ceiling_cents is 60000 and whose outstanding_balance_cents starts at 0.
      - 'The car is placed 2026-09-05..2026-10-05 with mileage_allowance 0, then returned with mileage_since_last
        5000: blocks = ceil(30/30) = 1, included_miles = 1 * 0 = 0, overage = max(0, 5000 - 0) = 5000,
        mileage_overage_cents = 5000 * 12 = 60000 — exactly at the 60000 ceiling, which passes.'
      - That first return is settled, so Lessee.outstanding_balance_cents = 60000 and the placement is
        COMPLETED; the car is UNDER_REPAIR.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/car-types
