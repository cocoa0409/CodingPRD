  - rule_id: transitive_cascade
    instances:
      - name: co_approval_cascades_to_allowance_freeze
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - state_machines.AllowanceItem.OPEN_to_FROZEN
          - calculations.project_contract_position
          - calculations.project_budget_posture
          - entities.Project.fields.budget_posture
        distinguishing_aspect: |
          Depth-4 cascade originating at the ChangeOrder SUBMITTED -> APPROVED transition:
          approval mutates Project.approved_change_order_total, which forces contract_sum_current
          to 950315.50, which forces budget_posture to OVER_GMP, which in turn forces every OPEN
          AllowanceItem on the project to FROZEN. Each link is caused by the previous link, not by
          the original request.
        test_recipe:
          setup:
            - "Project is UNDER_CONSTRUCTION with base_contract_amount 900000.00 and gmp_cap 950000.00, budget_posture WITHIN_BUDGET."
            - "One AllowanceItem is OPEN."
            - "A ChangeOrder priced at 50315.50 sits in SUBMITTED."
          setup_api_calls:
