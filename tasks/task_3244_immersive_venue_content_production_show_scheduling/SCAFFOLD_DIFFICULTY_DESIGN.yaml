            - "error_id == ERR_RENDER_BLOCKED_BY_MAINTENANCE"
            - "RenderBatch.${yb_id}.status remains OPEN"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: show_reserved_window_half_open_overlap
        grounds:
          - calculations.calc_changeover_time
          - validations[priority=5]
        distinguishing_aspect: |
          Half-open interval semantics on the Show resource: show windows reserve
          [start - rehearsal, end + changeover). A second show whose reserved
          window starts strictly inside the first show's window is rejected with
          ERR_SHOW_CONFLICT, while a show whose reserved window merely touches the
          boundary (b.start == a.end) is allowed.
        test_recipe:
          setup:
            - "Production P ACTIVE with APPROVED asset."
            - "Show A: FILM 2026-09-03T19:00 + 120 min, peak_rush 35 -> reserved [17:00, 22:20) (rehearsal 120, changeover 80)."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "TP", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { tp_id: $.data.id }
            - call: "POST /venue/productions/${tp_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${tp_id}", title: "TA", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { ta_id: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${ta_id}"] }
              as: ContentProducer
              captures: { tb_id: $.data.id }
            - call: "POST /venue/render-batches/${tb_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${tb_id}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${ta_id}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${tp_id}", show_format: "FILM", start_time: "2026-09-03T19:00:00Z", length_minutes: 120, peak_rush_minutes: 35 }
              as: VenueScheduler
              captures: { tsa_id: $.data.id }
            - call: "POST /venue/shows/${tsa_id}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
          trigger:
            - call: "POST /venue/shows"
              payload: { production_id: "${tp_id}", show_format: "CONCERT", start_time: "2026-09-03T21:30:00Z", length_minutes: 60 }
              as: VenueScheduler
              captures: { err_id: $.data.error_id }
            - call: "POST /venue/shows"
              payload: { production_id: "${tp_id}", show_format: "CONCERT", start_time: "2026-09-04T00:20:00Z", length_minutes: 60 }
              as: VenueScheduler
              captures: { tsc_id: $.data.id, tsc_status: $.data.status }
          assert:
            - "Overlapping show create returns ERR_SHOW_CONFLICT (its reserved start 19:30 lies inside A's [17:00, 22:20))"
            - "Touching show created successfully — Show.${tsc_id}.status == TENTATIVE (reserved start 22:20 == A's reserved end 22:20; boundary-touch allowed under half-open semantics)"

      - name: maintenance_buffer_closed_interval_conflict
        grounds:
          - validations[priority=6]
          - entities.MaintenanceWindow.fields.buffer_minutes
        distinguishing_aspect: |
          Different resource and different interval semantics: maintenance windows
          on a VenueSystem treat the post-window buffer as a CLOSED extension —
          [start_time, end_time + buffer_minutes] inclusive — so a window whose
          closed buffer end exactly equals a show's reserved start still conflicts
          (inclusive endpoint), unlike the half-open show-window rule.
        test_recipe:
          setup:
            - "Production P ACTIVE with APPROVED asset; Show S in REHEARSAL: FILM 2026-09-03T19:00 + 90 min, peak_rush 0 -> reserved [17:00, 21:30)."
            - "ENV_FX system V registered."
          setup_api_calls:
            - call: "POST /venue-systems"
              payload: { name: "EnvFX-3", kind: "ENV_FX" }
              as: VenueOpsEngineer
              captures: { uv_id: $.data.id }
            - call: "POST /venue/productions"
              payload: { title: "UP", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { up_id: $.data.id }
            - call: "POST /venue/productions/${up_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${up_id}", title: "UA", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { ua_id: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${ua_id}"] }
              as: ContentProducer
              captures: { ub_id: $.data.id }
            - call: "POST /venue/render-batches/${ub_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${ub_id}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${ua_id}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${up_id}", show_format: "FILM", start_time: "2026-09-03T19:00:00Z", length_minutes: 90, peak_rush_minutes: 0 }
              as: VenueScheduler
              captures: { us_id: $.data.id }
            - call: "POST /venue/shows/${us_id}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
          trigger:
            - call: "POST /venue/maintenance-windows"
              payload: { venue_system_id: "${uv_id}", start_time: "2026-09-03T15:30:00Z", end_time: "2026-09-03T16:30:00Z", buffer_minutes: 30 }
              as: VenueOpsEngineer
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_MAINTENANCE_CONFLICT (closed buffer end 17:00 touches show reserved start 17:00)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: booking_confirm_cancel_conserves_zone_seat_inventory
        grounds:
          - state_machines.Booking.HELD_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.calc_ticket_price
        distinguishing_aspect: |
          Conserved quantity: zone seat inventory. Confirming then cancelling a
          booking of N seats returns the zone's remaining capacity to exactly its
          prior value; the cancel compensates with refund_cents ==
          line_total_cents and the seats return to the pool (a subsequent booking
          of the same N seats succeeds).
        test_recipe:
          setup:
            - "Production P (base 10000c, non-haptic) ACTIVE with APPROVED asset; Show S CONFIRMED; APEX zone empty (100 seats)."
            - "Booking BK1: APEX 100 seats, CONFIRMED (line_total 26165263.16 with B0_APEX = 246842.1053)."
          setup_api_calls:
            - call: "POST /venue/productions"
              payload: { title: "IP", production_type: "ORIGINAL", base_price_cents: 10000, is_haptic_capable: false }
              as: ProductionDirector
              captures: { ip_id: $.data.id }
            - call: "POST /venue/productions/${ip_id}/activate"
              payload: {}
              as: ProductionDirector
            - call: "POST /venue/assets"
              payload: { production_id: "${ip_id}", title: "IA", capture_format: "WRAP_8K", storage_gb: 100, render_hours_base: 2 }
              as: ContentProducer
              captures: { ia_id: $.data.id }
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${ia_id}"] }
              as: ContentProducer
              captures: { ib_id: $.data.id }
            - call: "POST /venue/render-batches/${ib_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T03:00:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${ib_id}/settle"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/assets/${ia_id}/qc/approve"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/shows"
              payload: { production_id: "${ip_id}", show_format: "FILM", start_time: "2026-09-03T19:00:00Z", length_minutes: 90 }
              as: VenueScheduler
              captures: { is_id: $.data.id }
            - call: "POST /venue/shows/${is_id}/schedule-rehearsal"
              payload: {}
              as: VenueScheduler
            - call: "GET /venue/productions/${ip_id}"
              payload: {}
              as: ProductionDirector
              captures: { ip_v: $.data.version }
            - call: "POST /venue/shows/${is_id}/confirm"
              payload: { expected_production_version: "${ip_v}" }
              as: VenueScheduler
            - call: "POST /venue/shows/${is_id}/bookings"
              payload: { zone: "APEX", seats: 100 }
              as: Guest
              captures: { ibk_id: $.data.id, ibk_line: $.data.line_total_cents }
            - call: "POST /venue/bookings/${ibk_id}/confirm"
              payload: {}
              as: Guest
          trigger:
            - call: "POST /venue/bookings/${ibk_id}/cancel"
              payload: {}
              as: Guest
              captures: { ibk_refund: $.data.refund_cents, ibk_status: $.data.status }
            - call: "POST /venue/shows/${is_id}/bookings"
              payload: { zone: "APEX", seats: 100 }
              as: Guest
              captures: { ibk2_id: $.data.id, ibk2_status: $.data.status }
          assert:
            - "Booking.${ibk_id}.status == CANCELLED"
            - "Booking.${ibk_id}.refund_cents == 26165263.16 (full compensation, equals its line_total_cents)"
            - "APEX zone accepts a fresh 100-seat booking — Booking.${ibk2_id}.status == HELD (inventory conserved)"

      - name: sponsor_active_count_conserved_across_pause_cancel
        grounds:
          - state_machines.Campaign.ACTIVE_to_PAUSED
          - state_machines.Campaign.PAUSED_to_CANCELLED
          - entities.Sponsor.fields.active_campaign_count
        distinguishing_aspect: |
          Different conserved quantity: Sponsor.active_campaign_count. The forward
          action (activate, +1) paired with compensating actions (pause, -1; then
          cancel from PAUSED, no further decrement) returns the count to exactly
          its pre-activation value: active_campaign_count(after) ==
          active_campaign_count(before activation).
        test_recipe:
          setup:
            - "Sponsor S with active_campaign_count == 0; Campaign C in flight, ACTIVE."
          setup_api_calls:
            - call: "POST /venue/sponsors"
              payload: { name: "GLOBEX", brand_tier: "PREMIUM" }
              as: SponsorshipManager
              captures: { gs_id: $.data.id, gs_v0: $.data.version }
            - call: "POST /venue/campaigns"
              payload: { sponsor_id: "${gs_id}", start_time: "2026-08-31T00:00:00Z", end_time: "2026-09-30T00:00:00Z", exterior_slots: 1, spot_seconds: 30, contracted_impressions: 5000 }
              as: SponsorshipManager
              captures: { gc_id: $.data.id }
            - call: "POST /venue/campaigns/${gc_id}/activate"
              payload: { expected_sponsor_version: "${gs_v0}" }
              as: SponsorshipManager
          trigger:
            - call: "POST /venue/campaigns/${gc_id}/pause"
              payload: {}
              as: SponsorshipManager
            - call: "POST /venue/campaigns/${gc_id}/cancel"
              payload: {}
              as: SponsorshipManager
            - call: "GET /venue/sponsors/${gs_id}"
              payload: {}
              as: SponsorshipManager
              captures: { gs_count: $.data.active_campaign_count, gc_status_check: $.data.version }
          assert:
            - "Sponsor.${gs_id}.active_campaign_count == 0 (conserved across activate/pause/cancel)"
            - "Campaign.${gc_id}.status == CANCELLED"
