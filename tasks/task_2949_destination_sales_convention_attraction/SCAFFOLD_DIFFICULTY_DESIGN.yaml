              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { opp_v_a: $.data.version }
            - call: "POST /bid-packages"
              payload: { opportunity_id: "${opp_id}", expected_opportunity_version: "${opp_v_a}" }
              as: SalesManager
              as_user_id: "sales-11"
              captures: { bid_id: $.data.id }
            - call: "POST /bid-packages/${bid_id}/request-incentive"
              payload: { incentive_request_amount: 60000.00, service_commitment_codes: ["AIRPORT_SHUTTLE"] }
              as: SalesManager
              as_user_id: "sales-11"
              captures: { cap_amount: $.data.incentive_cap_amount }
            - call: "GET /incentive-funds/${fund_id}"
              payload: {}
              as: IncentiveApprover
              captures: { fund_v_a: $.data.version }
          trigger:
            - call: "POST /bid-packages/${bid_id}/incentive-decisions"
              payload: { fund_id: "${fund_id}", decision: "APPROVED", approved_amount: 60000.00, rationale: "Self-approval attempt above the cap", expected_fund_version: "${fund_v_a}" }
              as: IncentiveApprover
              as_user_id: "sales-11"
              captures: { err: $.data.error_id }
          assert:
            - "${cap_amount} == 11086.88"
            - "HTTP 403 and ${err} == ERR_SEGREGATION_OF_DUTIES"
            - "${err} != ERR_INCENTIVE_EXCEEDS_CAP"
            - "BidPackage.${bid_id}.status is still INCENTIVE_PENDING and approved_incentive_amount is null"
            - "the same call repeated with as_user_id approver-01 fails with ERR_INCENTIVE_EXCEEDS_CAP (422), proving both rules were live"

      - name: hall_hold_limit_priority_22_outranks_hall_capacity_insufficient_priority_25
