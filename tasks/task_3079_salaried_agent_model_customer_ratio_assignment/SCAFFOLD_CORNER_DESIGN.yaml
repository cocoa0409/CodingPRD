          assert:
            - "pipeline == 2 — the CLOSED client left the regional demand count"
            - "agents == 2 and occupancy == 0.25 (2 over 2 * 4.0)"
            - "GET /clients?region_id=${region_id} returns 3 rows while only 2 are counted in the pipeline"
            - "Client.${client_1}.status == CLOSED and Client.${client_3}.status == UNASSIGNED"

      - name: client_scoped_close_rejects_a_transaction_belonging_to_another_client
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/clients/{id}/transactions/{id}/close
          - errors.ERR_TRANSACTION_NOT_FOUND
          - entities.Transaction.fields.client_id
        distinguishing_aspect: "The client-scoped close validates the pair: closing client A's path with client B's transaction id is a 404 ERR_TRANSACTION_NOT_FOUND, and no cascade fires for either client."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One region with a high ratio target, one lead agent, two assigned clients each with a transaction in REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
