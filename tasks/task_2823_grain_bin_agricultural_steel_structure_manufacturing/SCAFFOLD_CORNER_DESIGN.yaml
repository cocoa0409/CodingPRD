      - name: bin_design_revision_cycle_loops_back_to_draft
        claim_type: cyclic
        grounds:
          - state_machines[BinDesign].transitions
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / bin_design_revision_cycle_returns_to_draft_and_supersedes_analyses
          rationale: "The named §1.8 instance walks DRAFT -> UNDER_REVIEW -> REVISION_REQUIRED -> DRAFT twice, asserts revision_round as the loop counter, and asserts that each pass supersedes the prior analyses; the cyclic-shape claim and the revise side-effect list are fully exercised there."

      - name: dealer_order_dimensions_change_independently
        claim_type: parallel
        grounds:
          - state_machines[DealerOrder].note
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / dealer_order_production_and_financial_dimensions_advance_independently
          rationale: "The named §1.8 instance pays a deposit on a DRAFT order and confirms an AWAITING_DEPOSIT order, asserting that each dimension advances without disturbing the other two; that is exactly the parallel-shape claim."

      - name: design_recall_cascades_down_to_orders_and_loads
        claim_type: cascade_down
        grounds:
          - state_machines[BinDesign].transitions
          - state_machines[DealerOrder].transitions
          - state_machines[FreightLoad].transitions
        excluded_because:
          difficulty_instance: transitive_cascade / structural_underdesign_determination_cascades_design_recall_to_order_hold_to_load_detach_to_load_cancel
          rationale: "The named §1.8 instance verifies all four hops end-to-end - design RECALLED, orders HOLD_ENGINEERING, orders detached with allocation re-run, load CANCELLED at order_count 0 - and asserts that terminal orders are skipped."

      - name: coil_lot_mass_ledger_stays_synchronised_with_its_runs
        claim_type: ledger_sync
        grounds:
          - calculations.coil_mass_ledger
          - state_machines[CoilLot].transitions
          - state_machines[RollFormingRun].transitions
        excluded_because:
          difficulty_instance: compensating_invariant / voiding_a_completed_run_restores_the_coil_lot_steel_mass_conservation_identity_with_zero_drift
          rationale: "The named §1.8 instance reconciles received_kg == remaining_kg + reserved_kg + consumed_kg + scrap_kg before and after schedule, complete and void, which is the ledger-sync claim for this ancestor field set."

      - name: quarantined_coil_lot_guards_new_run_scheduling
        claim_type: guarded_transitions
        grounds:
          - state_machines[CoilLot].transitions
          - state_machines[RollFormingRun].transitions
          - errors[ERR_COIL_LOT_NOT_AVAILABLE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / roll_forming_run_create_blocked_when_coil_lot_is_quarantined_by_a_coating_determination
          rationale: "The named §1.8 instance drives the lot into QUARANTINED through a COATING_INADEQUATE determination and then shows the cross-entity precondition rejecting a new run with ERR_COIL_LOT_NOT_AVAILABLE."

      - name: order_cancel_reverses_the_credit_commitment
        claim_type: cross_entity
        grounds:
          - state_machines[DealerOrder].transitions
          - state_machines[Dealer].transitions
          - calculations.dealer_credit_ledger
        excluded_because:
          difficulty_instance: transitive_cascade / order_cancel_cascades_credit_release_to_dealer_reactivation_to_held_order_requeue
          rationale: "The named §1.8 instance asserts the full credit-release chain - hold zeroed, dealer recomputed and reactivated, sibling HOLD_CREDIT orders requeued - which subsumes the cross-entity side-effect claim for this pair."

  # =========================================================================
  # SECTION 3 - CALCULATIONS (claim-extraction-guide "From Table 3")
  # =========================================================================
  - section: calculations
    instances:
      - name: governing_load_case_switches_to_wind_uplift_and_to_seismic_base_shear_when_they_beat_grain
        claim_type: correct_result
        grounds:
          - calculations.structural_stiffener_requirement
          - entities.BinDesign.governing_load_case
          - entities.Jurisdiction.seismic_design_category
        distinguishing_aspect: "The GRAIN_LATERAL branch wins on almost every realistic bin, so the other two arms of the three-way max are the ones an implementation can silently omit. A tall narrow 6.0 m bin at 150 mph makes wind_demand_kpa 40.5 dominate grain 35.648, and a wide bin in seismic category D holding a low-k grain makes seismic_demand_kpa 22.407 dominate grain 20.37. Each design also pins the whole downstream chain the winner drives: the stiffener count, the utilization ratio, the sheet gauge ladder pick and the roof_ring_required flag, so a partially-correct max cannot pass."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (min_design_wind_speed_mph 95, seismic_design_category A) and Jurisdiction CA-VALLEY (min 100, seismic_design_category D, seal_required true, permit_review_days 30)."
            - "GrainProfile CORN (721 kg/m3, k 0.42, max_safe 15.0) and GrainProfile LOWK (721 kg/m3, k 0.30, max_safe 14.0)."
            - "CoatingSpec G115 (max_ambient_moisture_pct 18.0), engineer PE-1001 licensed in both jurisdictions, Dealer Alpha."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "CA-VALLEY", name: "California Central Valley", seal_required: true, min_design_wind_speed_mph: 100, seismic_design_category: "D", permit_review_days: 30 }
              as: PlantAdmin
              captures: { j_q_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "CORN", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.42, max_safe_moisture_pct: 15.0, aeration_cfm_per_m3_base: 2.5, drying_multiplier: 4.0 }
              as: PlantAdmin
              captures: { gp_corn_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "LOWK", bulk_density_kg_per_m3: 721, janssen_k_ratio: 0.30, max_safe_moisture_pct: 14.0, aeration_cfm_per_m3_base: 2.2, drying_multiplier: 3.5 }
              as: PlantAdmin
              captures: { gp_lowk_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
          trigger:
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_corn_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 6.0, eave_height_m: 12.0, roof_pitch_deg: 30, design_wind_speed_mph: 150, moisture_pct: 14.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { dw_id: $.data.id, dw_case: $.data.governing_load_case, dw_count: $.data.required_stiffener_count }
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_q_id}", grain_profile_id: "${gp_lowk_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 12.0, eave_height_m: 9.6, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 13.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { dq_id: $.data.id, dq_case: $.data.governing_load_case, dq_count: $.data.required_stiffener_count }
          assert:
            - "the 6.0 m x 12.0 m bin at 150 mph returns HTTP 201 with grain_lateral_kpa 35.648, moisture_factor 1.0, grain_demand_kpa 35.648, wind_demand_kpa 40.5, seismic_demand_kpa 4.244, governing_demand_kpa 40.5 and governing_load_case == WIND_UPLIFT"
            - "that design also reports circumference_m 18.85, sheet_courses 15, sheets_per_course 18, sidewall_sheet_count 270, roof_panel_count 21, capacity_m3 355.61"
            - "its stiffener chain is required_stiffener_count 11 == ceil(40.5 * 18.85 / 90.0) + 2, utilization_ratio 0.7711, verdict PASS, sheet_gauge_mm 2.5 (gauge demand 40.5 * 0.05 == 2.025 climbs the ladder to 2.5) and roof_ring_required == true because 150 >= 115"
            - "the 12.0 m x 9.6 m bin in seismic category D on the low-k grain returns HTTP 201 with grain_lateral_kpa 20.37, grain_demand_kpa 20.37, wind_demand_kpa 7.938, seismic_demand_kpa 22.407, governing_demand_kpa 22.407 and governing_load_case == SEISMIC_BASE_SHEAR"
            - "that design reports required_stiffener_count 10 == ceil(22.407 * 37.699 / 90.0), utilization_ratio 0.9386, verdict PASS, sheet_gauge_mm 1.3, roof_ring_required == false and capacity_m3 1216.25"
            - "the seismic design's seismic_demand_kpa uses SEISMIC_FACTOR 0.33 for category D read from its own Jurisdiction row, not the category A factor 0.05 of the dealer's jurisdiction"

      - name: stiffener_count_clamps_at_the_maximum_and_a_failing_analysis_blocks_review
        claim_type: constants_applied
        grounds:
          - calculations.structural_stiffener_requirement
          - validations[priority 11]
          - errors[ERR_NO_PASSING_ANALYSIS]
          - errors[ERR_DESIGN_ANALYSIS_FAILED]
        distinguishing_aspect: "STIFFENER_MAX_COUNT is a hard clamp, so the raw requirement 39 must be stored as 24 and the utilization ratio must be computed from the CLAMPED count - 1.6056, not the 0.9878 an unclamped count would give - which is what makes verdict FAIL. The same design also separates the two review-gate errors: with no analysis at all submit-review returns ERR_NO_PASSING_ANALYSIS, while with a FAIL analysis present it returns ERR_DESIGN_ANALYSIS_FAILED. An implementation that clamps after computing utilization, or that collapses the two errors, fails. The sheet gauge is a second clamp: demand 3.5611 mm exceeds every ladder rung, so the top rung 3.0 is used rather than an error."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST, CoatingSpec G115, engineer PE-1001, Dealer Alpha."
            - "GrainProfile DENSE (1100 kg/m3, k 0.55, max_safe_moisture_pct 13.0)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NE-WEST", name: "Nebraska West", seal_required: false, min_design_wind_speed_mph: 95, seismic_design_category: "A", permit_review_days: 0 }
              as: PlantAdmin
              captures: { j_ns_id: $.data.id }
            - call: "POST /grain-profiles"
              payload: { grain_code: "DENSE", bulk_density_kg_per_m3: 1100, janssen_k_ratio: 0.55, max_safe_moisture_pct: 13.0, aeration_cfm_per_m3_base: 2.8, drying_multiplier: 4.5 }
              as: PlantAdmin
              captures: { gp_dense_id: $.data.id }
            - call: "POST /coating-specs"
              payload: { coating_code: "G115", zinc_mass_g_per_m2: 350, coating_cost_per_kg_cents: 42, changeover_minutes: 120, max_ambient_moisture_pct: 18.0 }
              as: PlantAdmin
              captures: { cs_g115_id: $.data.id }
            - call: "POST /engineers"
              payload: { name: "Dana Author", license_number: "PE-1001", licensed_jurisdiction_codes: ["IA-CENTRAL", "NE-WEST", "CA-VALLEY"] }
              as: PlantAdmin
              captures: { eng_a_id: $.data.id }
            - call: "POST /dealers"
              payload: { name: "Alpha Grain Systems", region_code: "NE-01", jurisdiction_id: "${j_ns_id}", credit_limit_cents: 900000000, program_tier: "BASE", staging_slots: 2, high_cube_access: true }
              as: PlantAdmin
              captures: { dlr_a_id: $.data.id }
          trigger:
            - call: "POST /bin-designs"
              payload: { dealer_id: "${dlr_a_id}", jurisdiction_id: "${j_ns_id}", grain_profile_id: "${gp_dense_id}", coating_spec_id: "${cs_g115_id}", diameter_m: 15.5, eave_height_m: 12.0, roof_pitch_deg: 30, design_wind_speed_mph: 105, moisture_pct: 12.0, design_method: "ASD" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { df_id: $.data.id, df_v1: $.data.version, df_count: $.data.required_stiffener_count, df_util: $.data.utilization_ratio }
            - call: "POST /bin-designs/${df_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { e_no_analysis: $.data.error_id }
            - call: "POST /bin-designs/${df_id}/analyses"
              payload: { design_method: "ASD", expected_bin_design_version: "${df_v1}" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { an_verdict: $.data.verdict, an_count: $.data.required_stiffener_count }
            - call: "POST /bin-designs/${df_id}/submit-review"
              payload: {}
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { e_failed: $.data.error_id }
            - call: "GET /bin-designs/${df_id}"
              payload: {}
              as: PlantAdmin
              captures: { df_status: $.data.status }
          assert:
            - "the design returns HTTP 201 with grain_lateral_kpa 71.221, moisture_factor 1.0 (12.0 is below max_safe 13.0), grain_demand_kpa 71.221, wind_demand_kpa 7.682, seismic_demand_kpa 6.475 and governing_load_case == GRAIN_LATERAL"
            - "circumference_m 48.695, sheet_courses 15, sheets_per_course 45, sidewall_sheet_count 675, roof_panel_count 55, capacity_m3 2545.56"
            - "required_stiffener_count == 24, not 39: the raw requirement ceil(71.221 * 48.695 / 90.0) == 39 is clamped to STIFFENER_MAX_COUNT"
            - "utilization_ratio == 1.6056 == 71.221 * 48.695 / (24 * 90.0), computed from the clamped count, and verdict == FAIL"
            - "sheet_gauge_mm == 3.0: the gauge demand 71.221 * 0.05 == 3.5611 mm exceeds every rung of the ladder, so the top rung is used"
            - "submit-review with no analysis rows returns HTTP 422 with error_id ERR_NO_PASSING_ANALYSIS"
            - "the analysis row is created with HTTP 201, verdict == FAIL and required_stiffener_count == 24, mirroring the design"
            - "submit-review with the FAIL analysis present returns HTTP 422 with error_id ERR_DESIGN_ANALYSIS_FAILED - a different error from the empty-set case"
            - "the design is still status == DRAFT after both rejections"

      - name: aeration_demand_multiplies_the_package_by_the_depth_and_moisture_penalties_then_ceils
        claim_type: correct_result
        grounds:
          - calculations.aeration_and_drying_capacity
          - entities.DealerOrder.required_fan_cfm
          - entities.DealerOrder.drying_hours_estimate
          - entities.KitLine
        distinguishing_aspect: "This uses the AERATION package, whose package_multiplier is the literal 1.0, which isolates the two penalty factors from the grain's drying_multiplier: raw CFM is base 10078.016 times depth penalty 1.216 times moisture penalty 1.48, and the stored value is the CEILING 18138 of 18137.20383488, not a round. The drying-hours arm is then driven by the same 4.0 points of moisture excess through a completely different factor (1 + excess * 0.25 == 2.0), so an implementation that reuses the CFM moisture penalty in the hours formula lands on 15529 instead of 20107. Fan count is a third derivation from the same number: ceil(18138 / 5000) == 4 units."
        test_recipe:
          setup:
            - "Jurisdiction IA-CENTRAL (min_design_wind_speed_mph 105, seismic_design_category B, seal_required true, permit_review_days 21)."
