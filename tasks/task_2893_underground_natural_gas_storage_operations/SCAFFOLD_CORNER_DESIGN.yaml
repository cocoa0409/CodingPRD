            - "${e2} == ERR_FIELD_FROZEN with HTTP 422 and CompressorUnit.${u1}.status is still AVAILABLE with scheduled_run_count == 0"
            - "after the well is registered StorageField.${f1}.field_posture == OPEN with rates 150000 / 150000"
            - "the second activate returns HTTP 200 with StorageContract.${c1}.status == ACTIVE"
            - "the second booking returns HTTP 201 with CompressorRun.${r1}.status == SCHEDULED, fuel_consumed_dth == null, duration_hours == 8"
            - "CompressorUnit.${u1}.status == COMMITTED with scheduled_run_count == 1 and lifetime_fuel_dth == 0.00"
            - "GET /compressor-units/${u1}/runs with limit 100 returns total_count == 1"

      - name: compressor_run_completion_burns_field_gas_and_reprices_deliverability
        claim_type: valid_transition
        grounds:
          - state_machines.CompressorRun.transitions.SCHEDULED_to_COMPLETED
          - calculations.compressor_fuel_burn
          - calculations.deliverability_rates
          - entities.CompressorUnit.fields.lifetime_fuel_dth
          - entities.StorageField.fields.fuel_gas_used_dth
        distinguishing_aspect: |
          Completion is the only place fuel is actually drawn, and it moves FIVE derived quantities
          at once from one 220.80 Dth burn (3000 hp effective / utilization 0.500000 / band MID /
          8 hours / INJECTION multiplier 1.00): the unit's lifetime_fuel_dth and its return to
          AVAILABLE as scheduled_run_count hits 0, the field's fuel_gas_used_dth, and — because
          working gas drops to 249779.20 — an ASYMMETRIC rate move where withdrawal falls to 149880
          while injection RISES to 150120.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1 (posture OPEN, rates 150000 / 150000, working gas 250000)."
            - "Compressor unit U-1 rated 6000 hp with derate_factor 0.00 carries a SCHEDULED 3000 hp INJECTION run over 2026-08-02T00:00:00Z to 2026-08-02T08:00:00Z; the clock is moved to exactly 2026-08-02T08:00:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-1", rated_horsepower: 6000, derate_factor: 0.00 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-02T08:00:00Z", allocated_horsepower: 3000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: FieldOperator
          trigger:
            - call: "POST /compressor-runs/${r1}/complete"
              payload: {}
              as: FieldOperator
            - call: "GET /compressor-units/${u1}"
              payload: {}
              as: FieldOperator
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
          assert:
            - "the completion returns HTTP 200 with CompressorRun.${r1}.status == COMPLETED"
            - "CompressorRun.${r1}.effective_horsepower == 3000.00, utilization_ratio == 0.500000, utilization_band == MID, duration_hours == 8"
            - "CompressorRun.${r1}.fuel_consumed_dth == 220.80 (3000.00 * 8 * 0.0092 * 1.00, inside the 25.00 / 5000.00 clamp)"
            - "CompressorUnit.${u1}.lifetime_fuel_dth == 220.80, scheduled_run_count == 0, status == AVAILABLE"
            - "StorageField.${f1}.fuel_gas_used_dth == 220.80 and working_gas_inventory_dth == 249779.20"
            - "StorageField.${f1}.inventory_pct == 49.96, current_pressure_psig == 1499, deliverability_tier == TIER_2 (the burn crossed the 50% tier floor downward)"
            - "StorageField.${f1}.max_withdrawal_rate_dth_per_day == 149880 and max_injection_rate_dth_per_day == 150120"
            - "StorageField.${f1}.field_posture == OPEN and retained_fuel_pool_dth == 0.000 (fuel burnt by compression is not shipper-retained fuel)"

      - name: compressor_run_windows_must_be_future_at_booking_and_elapsed_at_completion
        claim_type: precondition_enforcement
        grounds:
          - validations.priority_22_ERR_RUN_WINDOW_IN_PAST
          - validations.priority_23_ERR_RUN_WINDOW_NOT_ELAPSED
          - state_machines.CompressorRun.transitions.SCHEDULED_to_COMPLETED
          - errors.ERR_RUN_WINDOW_IN_PAST
          - errors.ERR_RUN_WINDOW_NOT_ELAPSED
        distinguishing_aspect: |
          The compressor pair mirrors the MIT pair but on different resources and with different
          statuses: booking a window that starts before the clock is 422, while completing before
          window_end_at is 409 — and a clock strictly INSIDE the window (2026-08-02T04:00:00Z for a
          00:00-08:00 window) is still "not elapsed", so no fuel is drawn and the unit stays
          COMMITTED with lifetime_fuel_dth 0.00.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1; compressor unit U-1 rated 6000 hp, derate 0.00; the clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-1", rated_horsepower: 6000, derate_factor: 0.00 }
              as: FieldOperator
              captures: { u1: $.data.id }
          trigger:
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-07-31T00:00:00Z", window_end_at: "2026-08-02T08:00:00Z", allocated_horsepower: 3000, mode: "INJECTION" }
              as: FieldOperator
              captures: { e1: $.data.error_id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-02T08:00:00Z", allocated_horsepower: 3000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r1: $.data.id }
            - call: "POST /compressor-runs/${r1}/complete"
              payload: {}
              as: FieldOperator
              captures: { e2: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T04:00:00Z" }
              as: FieldOperator
            - call: "POST /compressor-runs/${r1}/complete"
              payload: {}
              as: FieldOperator
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_RUN_WINDOW_IN_PAST with HTTP 422 and no CompressorRun row is created"
            - "the second call returns HTTP 201 with CompressorRun.${r1}.status == SCHEDULED and fuel_consumed_dth == null"
            - "${e2} == ERR_RUN_WINDOW_NOT_ELAPSED with HTTP 409 (clock 2026-08-01T00:00:00Z is before the window)"
            - "${e3} == ERR_RUN_WINDOW_NOT_ELAPSED with HTTP 409 (clock 2026-08-02T04:00:00Z is inside the window, which is still not elapsed)"
            - "CompressorRun.${r1}.status is still SCHEDULED with fuel_consumed_dth == null"
            - "CompressorUnit.${u1}.status == COMMITTED, scheduled_run_count == 1, lifetime_fuel_dth == 0.00"
            - "StorageField.${f1}.working_gas_inventory_dth == 250000 and fuel_gas_used_dth == 0"
            - "GET /compressor-units/${u1}/runs with status SCHEDULED and limit 100 returns total_count == 1"

      - name: season_flip_curtails_interruptible_counterflow_and_spares_firm
        claim_type: side_effect_execution
        grounds:
          - endpoints[POST /storage-fields/{id}/season]
          - state_machines.Nomination.transitions.CONFIRMED_to_CURTAILED
          - entities.StorageContract.fields.service_class
          - entities.ImbalanceLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          The season sweep is narrower than the emergency sweep on exactly one axis: it takes only
          INTERRUPTIBLE nominations whose direction now runs counter to the new season, so on the
          same field and the same gas day a FIRM 80000 Dth INJECTION nomination survives a flip to
          WITHDRAWAL untouched while an INTERRUPTIBLE 40000 Dth INJECTION nomination is CURTAILED with
          a -40000.000 CURTAILMENT_CREDIT — and the field's own quantities (working gas, posture,
          both rates) do not move at all.
        test_recipe:
          setup:
            - "Field F_MINI (season INJECTION) with one well MINI-1; posture OPEN, rates 150000 / 150000."
            - "Shipper NORTHLINE holds two ACTIVE contracts on the field: FIRM CN-F and INTERRUPTIBLE CN-I."
            - "For gas day 2026-08-20 both file INJECTION nominations that confirm in full: 80000 Dth FIRM and 40000 Dth INTERRUPTIBLE (the interruptible share floor(150000 * 30 / 100) == 45000 leaves room)."
          setup_api_calls:
