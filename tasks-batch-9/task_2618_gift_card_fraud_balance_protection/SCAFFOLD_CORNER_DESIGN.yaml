              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 3000, merchant_store_id: "${store1_id}", pos_terminal_id: "T-50" }
              as: PosAssociate
            - call: "POST /victim-claims"
              payload: { card_id: "${card_id}", claimant_name: "Ravi Anand", claimant_contact: "ravi@example.test", disputed_amount_cents: 3000, purchased_at: "2026-08-01T00:00:00Z", purchase_receipt_ref: "RCPT-5001", packaging_photo_ref: "PHOTO-5001" }
              as: FraudAnalyst
              as_user_id: "analyst-50"
              captures: { claim_id: $.data.id }
            - call: "POST /victim-claims/${claim_id}/decide"
