# =============================================================================
# Mobile & House-Call Veterinary Service — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 Difficulty Rules x >=2 instances each (>=18 total)
# =============================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_vs_invoice_total_on_estimate
        grounds:
          - calculations.invoice_total
          - calculations.estimate_total
          - entities.Estimate.fields.estimate_total_cents
          - entities.Estimate.fields.invoice_total_cents
        distinguishing_aspect: |
          On the Estimate entity, estimate_total_cents (projects full requested
          vaccine qty) and invoice_total_cents (caps VACCINE_DOSE at the doses
          actually administered) diverge: 24000 vs 17500 for the same line set.
        test_recipe:
          setup:
            - "ServiceArea for ZIP 11201 ACTIVE, travel_surcharge_cents=2000, euthanasia_allowed=true"
            - "TECH clinician on the route; VET present only for the route lead requirement (VACCINE visit needs no vet)"
            - "RollingClinic with vaccine_stock_count=10, controlled_stock_ml=50"
            - "Patient (DOG, 30kg, home_zip 11201); VACCINE Appointment with vaccine_doses=1"
            - "Appointment booked as a stop, route LOCKED, clinician arrived (IN_VISIT)"
            - "Estimate with EXAM_FEE 9000x1 and VACCINE_DOSE 6500x2, APPROVED"
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 2000, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Tech Tara", clinician_role: "TECH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-1", controlled_stock_ml: 50, vaccine_stock_count: 10 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner O", species: "DOG", weight_kg: 30, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "VACCINE", requested_start: "2026-02-01T09:00:00Z", requested_end: "2026-02-01T10:00:00Z", vaccine_doses: 1 }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${tech_id}", rolling_clinic_id: "${van_id}", service_date: "2026-02-01T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-02-01T09:00:00Z", window_end: "2026-02-01T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /route-days/${rd_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
            - call: "POST /estimates"
              payload: { appointment_id: "${appt_id}", line_items: [ { code: "EXAM_FEE", label: "Exam", unit_cents: 9000, qty: 1 }, { code: "VACCINE_DOSE", label: "Vaccine", unit_cents: 6500, qty: 2 } ] }
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id, est_total: $.data.estimate_total_cents }
            - call: "POST /estimates/${est_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/complete-visit"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
            - call: "GET /estimates/${est_id}"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { inv_total: $.data.invoice_total_cents }
          assert:
            - "Estimate.${est_id}.estimate_total_cents == 24000"
            - "Estimate.${est_id}.invoice_total_cents == 17500"
            - "Estimate.${est_id}.status == INVOICED"

      - name: controlled_running_balance_vs_recount_on_rolling_clinic
        grounds:
          - calculations.reconcile_controlled_balance
          - entities.RollingClinic.fields.controlled_stock_ml
          - entities.RollingClinic.fields.controlled_reconciled_ml
          - state_machines.RouteDay.LOCKED_to_RECONCILED
        distinguishing_aspect: |
          On the RollingClinic entity, controlled_stock_ml is the forward running
          balance produced by DISPENSE/WASTE side-effects, while
          controlled_reconciled_ml is an independent created_at-ordered replay
          recount; both must equal 42.0 after a 6.0 DISPENSE + 2.0 WASTE on a
          50.0 start.
        test_recipe:
          setup:
            - "ServiceArea ZIP 11201 ACTIVE, euthanasia_allowed=true"
            - "Two VETs (admin + witness), each with valid non-expired DEA"
            - "RollingClinic controlled_stock_ml=50"
            - "EUTHANASIA Appointment for a 30kg dog, booked, route LOCKED, IN_VISIT"
            - "DISPENSE 6.0 then WASTE 2.0 logged; estimate approved; visit completed; payment captured"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T08:00:00Z" }
              as: Dispatcher
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 2000, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Vet A", clinician_role: "VET", dea_number: "AV1234567", dea_expires_on: "2027-01-01T00:00:00Z" }
              as: Dispatcher
              captures: { vetA_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Dr Vet B", clinician_role: "VET", dea_number: "BV7654321", dea_expires_on: "2027-01-01T00:00:00Z" }
              as: Dispatcher
              captures: { vetB_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-2", controlled_stock_ml: 50, vaccine_stock_count: 0 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner E", species: "DOG", weight_kg: 30, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EUTHANASIA", requested_start: "2026-02-01T09:00:00Z", requested_end: "2026-02-01T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${vetA_id}", rolling_clinic_id: "${van_id}", service_date: "2026-02-01T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-02-01T09:00:00Z", window_end: "2026-02-01T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
            - call: "POST /route-days/${rd_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${vetA_id}"
            - call: "POST /appointments/${appt_id}/euthanasia-log"
              payload: { rolling_clinic_id: "${van_id}", administering_vet_id: "${vetA_id}", entry_type: "DISPENSE", amount_ml: 6.0 }
              as: Clinician
              as_user_id: "${vetA_id}"
            - call: "POST /appointments/${appt_id}/euthanasia-log"
              payload: { rolling_clinic_id: "${van_id}", administering_vet_id: "${vetA_id}", entry_type: "WASTE", amount_ml: 2.0, witness_vet_id: "${vetB_id}" }
              as: Clinician
              as_user_id: "${vetA_id}"
            - call: "POST /estimates"
              payload: { appointment_id: "${appt_id}", line_items: [ { code: "EUTH_FEE", label: "Euthanasia", unit_cents: 30000, qty: 1 } ] }
              as: Clinician
              as_user_id: "${vetA_id}"
              captures: { est_id: $.data.id, est_total: $.data.estimate_total_cents }
            - call: "POST /estimates/${est_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${vetA_id}"
            - call: "POST /appointments/${appt_id}/complete-visit"
              payload: {}
              as: Clinician
              as_user_id: "${vetA_id}"
            - call: "POST /payments"
              payload: { estimate_id: "${est_id}", amount_cents: 32000, method: "CARD" }
              as: Clinician
              as_user_id: "${vetA_id}"
          trigger:
            - call: "POST /route-days/${rd_id}/reconcile"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /rolling-clinics/${van_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { recon: $.data.controlled_reconciled_ml, run: $.data.controlled_stock_ml }
          assert:
            - "RollingClinic.${van_id}.controlled_stock_ml == 42.0"
            - "RollingClinic.${van_id}.controlled_reconciled_ml == 42.0"
            - "RouteDay.${rd_id}.posture == RECONCILED"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: estimate_round_per_line_then_sum_order
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: two lines of unit_cents=333 qty=0.5 round
          per-line (167+167=334); sum-then-round would give 333. The scaffold
          pins round-per-line-then-sum, so subtotal_cents==334, not 333.
        test_recipe:
          setup:
            - "ServiceArea ZIP 11201 ACTIVE, travel_surcharge_cents=0"
            - "VACCINE Appointment for a covered patient in SCHEDULED phase (estimate creatable)"
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Tech Tia", clinician_role: "TECH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-3", controlled_stock_ml: 0, vaccine_stock_count: 5 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner R", species: "CAT", weight_kg: 4, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "VACCINE", requested_start: "2026-02-02T09:00:00Z", requested_end: "2026-02-02T10:00:00Z", vaccine_doses: 1 }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${tech_id}", rolling_clinic_id: "${van_id}", service_date: "2026-02-02T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-02-02T09:00:00Z", window_end: "2026-02-02T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /estimates"
              payload: { appointment_id: "${appt_id}", line_items: [ { code: "SUPPLY", label: "Half A", unit_cents: 333, qty: 0.5 }, { code: "SUPPLY", label: "Half B", unit_cents: 333, qty: 0.5 } ] }
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id, sub: $.data.subtotal_cents }
          assert:
            - "Estimate.${est_id}.subtotal_cents == 334"
            - "Estimate.${est_id}.estimate_total_cents == 334"

      - name: invoice_min_cap_nonlinear_branch
        grounds:
          - calculations.invoice_total
          - entities.Appointment.fields.vaccine_doses
          - entities.Estimate.fields.invoice_total_cents
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear formula: invoice_total branches on
          li.code=='VACCINE_DOSE', applies min(li.qty, appointment.vaccine_doses),
          rounds per line, then adds travel_surcharge — 9000 + min(2,1)*6500 +
          2000 == 17500.
        test_recipe:
          setup:
            - "Same booked-and-completed VACCINE visit as estimate_vs_invoice_total_on_estimate: vaccine_doses=1, estimate VACCINE_DOSE qty 2"
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 2000, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Tech Tom", clinician_role: "TECH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-4", controlled_stock_ml: 0, vaccine_stock_count: 10 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner V", species: "DOG", weight_kg: 20, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "VACCINE", requested_start: "2026-02-03T09:00:00Z", requested_end: "2026-02-03T10:00:00Z", vaccine_doses: 1 }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${tech_id}", rolling_clinic_id: "${van_id}", service_date: "2026-02-03T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-02-03T09:00:00Z", window_end: "2026-02-03T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
            - call: "POST /route-days/${rd_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
            - call: "POST /estimates"
              payload: { appointment_id: "${appt_id}", line_items: [ { code: "EXAM_FEE", label: "Exam", unit_cents: 9000, qty: 1 }, { code: "VACCINE_DOSE", label: "Vaccine", unit_cents: 6500, qty: 2 } ] }
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /estimates/${est_id}/approve"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/complete-visit"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
            - call: "GET /estimates/${est_id}"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { inv: $.data.invoice_total_cents }
          assert:
            - "Estimate.${est_id}.invoice_total_cents == 17500"
            - "RollingClinic.${van_id}.vaccine_stock_count == 9"

  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: appointment_branch_refer_vs_complete
        grounds:
          - state_machines.Appointment.IN_VISIT_to_REFERRED
          - state_machines.Appointment.IN_VISIT_to_AWAITING_PAYMENT
        distinguishing_aspect: |
          Appointment IN_VISIT forks: refer -> REFERRED creates a Referral and
          SKIPs the stop and VOIDs the estimate; complete-visit -> AWAITING_PAYMENT
          INVOICEs the estimate and SERVICEs the stop — divergent side-effect sets
          from the same source state, on the Appointment entity (branching).
        test_recipe:
          setup:
            - "EXAM Appointment booked, route LOCKED, arrived (IN_VISIT), DRAFT estimate created (no approve)"
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 1000, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Tech Tess", clinician_role: "TECH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-5", controlled_stock_ml: 0, vaccine_stock_count: 5 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner B", species: "DOG", weight_kg: 18, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EXAM", requested_start: "2026-02-04T09:00:00Z", requested_end: "2026-02-04T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${tech_id}", rolling_clinic_id: "${van_id}", service_date: "2026-02-04T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-02-04T09:00:00Z", window_end: "2026-02-04T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /route-days/${rd_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /appointments/${appt_id}/arrive"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
            - call: "POST /estimates"
              payload: { appointment_id: "${appt_id}", line_items: [ { code: "EXAM_FEE", label: "Exam", unit_cents: 9000, qty: 1 } ] }
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/refer"
              payload: { hospital_name: "City Animal ER", reason: "acute abdomen" }
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { ref_id: $.data.id }
            - call: "GET /route-stops/${stop_id}"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { stop_status: $.data.status }
            - call: "GET /estimates/${est_id}"
              payload: {}
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { est_status: $.data.status }
          assert:
            - "Appointment.${appt_id}.status == REFERRED"
            - "Referral.${ref_id}.status == OPEN"
            - "RouteStop.${stop_id}.status == SKIPPED"
            - "Estimate.${est_id}.status == VOID"
            - "RouteDay.${rd_id}.stop_count == 0"

      - name: estimate_revise_self_cycle
        grounds:
          - state_machines.Estimate.DRAFT_to_DRAFT
          - calculations.estimate_total
          - entities.Estimate.fields.version
        distinguishing_aspect: |
          Estimate exhibits a DRAFT->DRAFT self-cycle: PUT /estimates revises
          line_items, recomputes estimate_total_cents, and bumps version each loop
          — a cyclic shape on a different entity than the Appointment branch.
        test_recipe:
          setup:
            - "DRAFT estimate (one line, total 9000) on a SCHEDULED EXAM appointment, travel_surcharge 0"
          setup_api_calls:
            - call: "POST /service-areas"
              payload: { zip_code: "11201", name: "BK North", travel_surcharge_cents: 0, euthanasia_allowed: true }
              as: Dispatcher
              captures: { area_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "Tech Ty", clinician_role: "TECH" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /rolling-clinics"
              payload: { plate: "VAN-6", controlled_stock_ml: 0, vaccine_stock_count: 5 }
              as: Dispatcher
              captures: { van_id: $.data.id }
            - call: "POST /patients"
              payload: { owner_name: "Owner C", species: "CAT", weight_kg: 5, home_zip: "11201" }
              as: Dispatcher
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EXAM", requested_start: "2026-02-05T09:00:00Z", requested_end: "2026-02-05T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${tech_id}", rolling_clinic_id: "${van_id}", service_date: "2026-02-05T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-02-05T09:00:00Z", window_end: "2026-02-05T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
            - call: "POST /estimates"
              payload: { appointment_id: "${appt_id}", line_items: [ { code: "EXAM_FEE", label: "Exam", unit_cents: 9000, qty: 1 } ] }
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id, est_v: $.data.version }
          trigger:
            - call: "PUT /estimates/${est_id}"
              payload: { line_items: [ { code: "EXAM_FEE", label: "Exam", unit_cents: 9000, qty: 1 }, { code: "MED", label: "Meds", unit_cents: 4500, qty: 2 } ] }
              as: Clinician
              as_user_id: "${tech_id}"
              captures: { est_total2: $.data.estimate_total_cents, est_v2: $.data.version }
          assert:
            - "Estimate.${est_id}.estimate_total_cents == 18000"
            - "Estimate.${est_id}.status == DRAFT"
            - "Estimate.${est_id}.version == 2"

  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: reconcile_cascade_depth3_routeday_vehicle_clinician
        grounds:
          - state_machines.RouteDay.LOCKED_to_RECONCILED
          - entities.RollingClinic.fields.status
          - entities.Clinician.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from RouteDay reconcile: RouteDay->RECONCILED causes
          RollingClinic DEPLOYED->IN_DEPOT, and the vehicle returning to depot in
          turn releases the lead Clinician ON_ROUTE->AVAILABLE. Each hop is caused
          by the prior hop, not by the reconcile call directly.
        test_recipe:
          setup:
            - "A LOCKED route with a single serviced EXAM stop (no euthanasia), vehicle DEPLOYED, clinician ON_ROUTE"
          setup_api_calls:
            - call: "POST /service-areas"
