# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0272_escape_room_attraction_booking
# 9 rules x 2 instances = 18 instances. Every grounds[] resolves into SCAFFOLD.yaml
# §1.1-§1.7; every setup_api_calls/trigger call resolves to a §1.5 endpoint.
# All price/fee literals were computed by code against §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_diverges_from_quote_on_partial_checkin
        grounds:
          - calculations.price_quote
          - calculations.price_settlement
          - state_machines.Booking.lifecycle_status.CHECKED_IN_to_COMPLETED
          - entities.Booking.fields.quoted_charge_cents
          - entities.Booking.fields.final_charge_cents
        distinguishing_aspect: |
          price_quote (forward, group_size=4 -> large-group multiplier applies -> 14400) and
          price_settlement (chronological, only 3 participants checked in -> below large_group_threshold ->
          9000) operate on the SAME Booking but produce different cents; this is the Booking-domain half.
        test_recipe:
          setup:
            - "Venue open all day; Room base=2000, large_group_threshold=4, large_multiplier_bps=12000, peak_multiplier_bps=15000, reset_buffer=30, game=60, waiver_required=false, min_age=0, min_group=1, max_group=8."
            - "PricingRule for the room peaks Wednesdays (mask=4) 12:00-18:00 UTC."
            - "One AVAILABLE game master. One OPEN slot on Wed 2026-07-01T14:00:00Z (peak)."
            - "Booking group_size=4 confirmed (quote 14400). 4 participants added; only 3 marked present."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER One", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Vault", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 5000, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /pricing-rules"
              payload: { venue_id: "${ven}", room_id: "${room}", peak_dow_mask: 4, peak_start_minute_of_day: 720, peak_end_minute_of_day: 1080, large_group_threshold: 4, peak_multiplier_bps: 15000, large_group_multiplier_bps: 12000 }
              as: VenueManager
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T14:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 4, expected_time_slot_version: "${slot_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
            - call: "POST /bookings/${bk}/participants"
              payload: { display_name: "P1", age: 30 }
              as: Customer
              as_user_id: "${cust}"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /bookings/${bk}/participants"
              payload: { display_name: "P2", age: 30 }
              as: Customer
              as_user_id: "${cust}"
              captures: { p2: $.data.id, p2_v: $.data.version }
            - call: "POST /bookings/${bk}/participants"
              payload: { display_name: "P3", age: 30 }
              as: Customer
              as_user_id: "${cust}"
              captures: { p3: $.data.id, p3_v: $.data.version }
            - call: "POST /bookings/${bk}/participants"
              payload: { display_name: "P4", age: 30 }
              as: Customer
              as_user_id: "${cust}"
              captures: { p4: $.data.id, p4_v: $.data.version }
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk_v2: $.data.version }
            - call: "POST /participants/${p1}/mark-present"
              payload: { expected_participant_version: "${p1_v}" }
              as: GameMaster
              as_user_id: "${gm}"
            - call: "POST /participants/${p2}/mark-present"
              payload: { expected_participant_version: "${p2_v}" }
              as: GameMaster
              as_user_id: "${gm}"
            - call: "POST /participants/${p3}/mark-present"
              payload: { expected_participant_version: "${p3_v}" }
              as: GameMaster
              as_user_id: "${gm}"
            - call: "POST /bookings/${bk}/check-in"
              payload: { expected_booking_version: "${bk_v2}" }
              as: GameMaster
              as_user_id: "${gm}"
              captures: { bk_v3: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/complete"
              payload: { expected_booking_version: "${bk_v3}" }
              as: GameMaster
              as_user_id: "${gm}"
          assert:
            - "Booking.${bk}.quoted_charge_cents == 14400"
            - "Booking.${bk}.final_charge_cents == 9000"
            - "Booking.${bk}.lifecycle_status == COMPLETED"
            - "Booking.${bk}.payment_status == CAPTURED"

      - name: customer_strike_count_is_distinct_risk_domain
        grounds:
          - calculations.no_show_strike_score
          - calculations.price_quote
          - state_machines.Booking.lifecycle_status.CONFIRMED_to_NO_SHOW
          - entities.Customer.fields.no_show_strike_count
        distinguishing_aspect: |
          The second dual-variant subject is the Customer domain: no_show_strike_score is a chronological
          count over the customer's NO_SHOW bookings (risk scoring), distinct from the Booking-domain cents
          calc; one NO_SHOW raises Customer.no_show_strike_count from 0 to 1.
        test_recipe:
          setup:
            - "Venue with no_show_strike_limit=3. Room base=2000 etc. as above. One GM, one OPEN peak slot."
            - "Customer with a single CONFIRMED booking (quote 14400) and one participant."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER Two", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Vault", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 5000, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /pricing-rules"
              payload: { venue_id: "${ven}", room_id: "${room}", peak_dow_mask: 4, peak_start_minute_of_day: 720, peak_end_minute_of_day: 1080, large_group_threshold: 4, peak_multiplier_bps: 15000, large_group_multiplier_bps: 12000 }
              as: VenueManager
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T14:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 4, expected_time_slot_version: "${slot_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
            - call: "POST /bookings/${bk}/participants"
              payload: { display_name: "P1", age: 30 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk_v2: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/no-show"
              payload: { expected_booking_version: "${bk_v2}" }
              as: GameMaster
              as_user_id: "${gm}"
          assert:
            - "Customer.${cust}.no_show_strike_count == 1"
            - "Booking.${bk}.lifecycle_status == NO_SHOW"
            - "Booking.${bk}.no_show_fee_cents == 7200"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: price_quote_nested_peak_then_large_multiplier_chain
        grounds:
          - calculations.price_quote
          - entities.PricingRule.fields.peak_multiplier_bps
          - entities.PricingRule.fields.large_group_multiplier_bps
          - state_machines.Booking.lifecycle_status.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base_price, peak_multiplier, large_group_multiplier, group_size) with
          conditional branches and pinned step order — peak floor THEN large-group floor THEN multiply:
          2000 ->(x1.5 floor)3000 ->(x1.2 floor)3600 ->(x4)14400.
        test_recipe:
          setup:
            - "Venue open all day. Room base=2000, peak_bps=15000, large_bps=12000, threshold=4, private_surcharge=5000, buffer=30, game=60."
            - "PricingRule peaks Wed 12:00-18:00. One GM, one OPEN peak slot. DRAFT booking group_size=4 created."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER Cmb1", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Vault", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 5000, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /pricing-rules"
              payload: { venue_id: "${ven}", room_id: "${room}", peak_dow_mask: 4, peak_start_minute_of_day: 720, peak_end_minute_of_day: 1080, large_group_threshold: 4, peak_multiplier_bps: 15000, large_group_multiplier_bps: 12000 }
              as: VenueManager
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T14:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 4, expected_time_slot_version: "${slot_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Booking.${bk}.quoted_charge_cents == 14400"
            - "Booking.${bk}.lifecycle_status == CONFIRMED"

      - name: per_participant_rounding_order_pinned_round_then_multiply
        grounds:
          - calculations.price_quote
          - entities.PricingRule.fields.peak_multiplier_bps
          - entities.Booking.fields.quoted_charge_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order matters. base=2000, peak_bps=13333, group=4. Pinned order is
          floor-per-participant THEN multiply: floor(2000*13333/10000)=2666, *4 = 10664 — NOT
          multiply-then-round (8000*1.3333 floor = 10666). The scaffold pins round-then-multiply.
        test_recipe:
          setup:
            - "Venue open all day. Room base=2000, no large multiplier interest (threshold=99 so large never applies), buffer=30, game=60."
            - "PricingRule peaks Wed 12:00-18:00 with peak_bps=13333. One GM, one OPEN peak slot. DRAFT booking group_size=4."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER Cmb2", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Vault", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 0, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /pricing-rules"
              payload: { venue_id: "${ven}", room_id: "${room}", peak_dow_mask: 4, peak_start_minute_of_day: 720, peak_end_minute_of_day: 1080, large_group_threshold: 99, peak_multiplier_bps: 13333, large_group_multiplier_bps: 10000 }
              as: VenueManager
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T14:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 4, expected_time_slot_version: "${slot_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Booking.${bk}.quoted_charge_cents == 10664"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_parallel_lifecycle_and_payment_axes
        grounds:
          - state_machines.Booking.lifecycle_status.DRAFT_to_CONFIRMED
          - state_machines.Booking.payment_status.UNPAID_to_AUTHORIZED
          - entities.Booking.fields.lifecycle_status
          - entities.Booking.fields.payment_status
        distinguishing_aspect: |
          Parallel state dimensions on the SAME Booking row: lifecycle_status (DRAFT->CONFIRMED) and
          payment_status (UNPAID->AUTHORIZED) advance independently under one confirm call.
        test_recipe:
          setup:
            - "Venue open all day; Room as canonical; one GM, one OPEN slot; DRAFT booking group_size=2 (no large), off-peak slot at 09:00 so quote=4000."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER Par", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Vault", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 0, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Booking.${bk}.lifecycle_status == CONFIRMED"
            - "Booking.${bk}.payment_status == AUTHORIZED"
            - "Booking.${bk}.quoted_charge_cents == 4000"

      - name: timeslot_branch_with_revert_held_back_to_open
        grounds:
          - state_machines.TimeSlot.status.OPEN_to_HELD
          - state_machines.TimeSlot.status.HELD_to_OPEN
          - state_machines.Booking.lifecycle_status.DRAFT_to_CANCELLED
          - entities.TimeSlot.fields.status
        distinguishing_aspect: |
          TimeSlot is a branching-with-revert machine on a DIFFERENT entity: OPEN->HELD on slot grab,
          then HELD->OPEN when the DRAFT booking is cancelled (revert edge), restoring booking_id=null.
        test_recipe:
          setup:
            - "Venue open all day; Room canonical; one GM; one OPEN slot; a DRAFT booking that grabbed it (slot HELD)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER Rev", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Vault", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 0, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "C Six" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/cancel"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /time-slots/${slot}"
              as: Customer
              as_user_id: "${cust}"
              captures: { slot_status_after: $.data.status }
          assert:
            - "Booking.${bk}.lifecycle_status == CANCELLED"
            - "TimeSlot.${slot}.status == OPEN"
            - "TimeSlot.${slot}.booking_id == null"
            - "TimeSlot.${slot}.assigned_game_master_id == null"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: confirm_cascade_depth3_giftcard_depletes
        grounds:
          - state_machines.Booking.lifecycle_status.DRAFT_to_CONFIRMED
          - calculations.gift_card_balance
          - state_machines.GiftCard.status.ACTIVE_to_DEPLETED
          - entities.GiftCard.fields.balance_cents
          - entities.GiftCard.fields.status
        distinguishing_aspect: |
          Depth-3 chain from confirm: confirm -> append SPEND GiftCardEntry (delta -10000) -> GiftCard.balance
          recompute to 0 -> GiftCard.status auto-transitions ACTIVE->DEPLETED. Each hop caused by the prior.
        test_recipe:
          setup:
            - "Venue open all day; Room canonical (off-peak slot, group 4 -> quote with large = 9600 off-peak)."
            - "GiftCard balance 10000 ACTIVE. DRAFT booking group_size=4 off-peak (quote 9600)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER Cas1", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Vault", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 0, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /pricing-rules"
              payload: { venue_id: "${ven}", room_id: "${room}", peak_dow_mask: 4, peak_start_minute_of_day: 720, peak_end_minute_of_day: 1080, large_group_threshold: 4, peak_multiplier_bps: 15000, large_group_multiplier_bps: 12000 }
              as: VenueManager
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot: $.data.id, slot_v: $.data.version }
            - call: "POST /gift-cards"
              payload: { venue_id: "${ven}", code: "GC-A", initial_balance_cents: 10000 }
              as: VenueManager
              captures: { gc: $.data.id }
            - call: "POST /customers"
              payload: { email: "c7@x.com", full_name: "C Seven" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot}", customer_id: "${cust}", group_size: 4, expected_time_slot_version: "${slot_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/confirm"
              payload: { gift_card_id: "${gc}", expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Booking.${bk}.quoted_charge_cents == 9600"
            - "Booking.${bk}.gift_card_applied_cents == 9600"
            - "GiftCard.${gc}.balance_cents == 400"
            - "GiftCard.${gc}.status == ACTIVE"

      - name: reschedule_cascade_depth2_old_slot_frees_gamemaster
        grounds:
          - state_machines.Booking.lifecycle_status.CONFIRMED_to_CONFIRMED
          - state_machines.TimeSlot.status.HELD_to_OPEN
          - calculations.gamemaster_load
          - entities.GameMaster.fields.active_assignment_count
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (reschedule): reschedule -> old slot BOOKED->OPEN -> freed
          GameMaster.active_assignment_count decremented. Originates from CONFIRMED->CONFIRMED, not confirm.
        test_recipe:
          setup:
            - "Venue open all day; Room canonical buffer=30 game=60; ONE GM; two OPEN slots same room, non-overlapping (09:00 and 12:00)."
            - "Booking CONFIRMED on the 09:00 slot. GM active_assignment_count == 1."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "ER Cas2", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440, no_show_fee_pct: 0.5, no_show_strike_limit: 3 }
              as: PlatformAdmin
              captures: { ven: $.data.id }
            - call: "POST /rooms"
              payload: { venue_id: "${ven}", name: "Vault", min_group_size: 1, max_group_size: 8, base_price_cents: 2000, game_minutes: 60, min_age: 0, waiver_required: false, private_surcharge_cents: 0, reset_buffer_minutes: 30 }
              as: VenueManager
              captures: { room: $.data.id }
            - call: "POST /game-masters"
              payload: { venue_id: "${ven}", full_name: "GM A" }
              as: VenueManager
              captures: { gm: $.data.id }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T09:00:00Z" }
              as: VenueManager
              captures: { slot1: $.data.id, slot1_v: $.data.version }
            - call: "POST /time-slots"
              payload: { room_id: "${room}", start_utc: "2026-07-01T12:00:00Z" }
              as: VenueManager
              captures: { slot2: $.data.id, slot2_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c8@x.com", full_name: "C Eight" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${slot1}", customer_id: "${cust}", group_size: 2, expected_time_slot_version: "${slot1_v}", is_private: false }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk: $.data.id, bk_v: $.data.version }
            - call: "POST /bookings/${bk}/confirm"
              payload: { expected_booking_version: "${bk_v}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bk_v2: $.data.version }
            - call: "GET /time-slots/${slot1}"
              as: Customer
              as_user_id: "${cust}"
              captures: { slot1_v_now: $.data.version }
          trigger:
            - call: "POST /bookings/${bk}/reschedule"
              payload: { new_time_slot_id: "${slot2}", expected_time_slot_version: "${slot1_v_now}", expected_booking_version: "${bk_v2}" }
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /game-masters/${gm}"
              as: VenueManager
              captures: { gm_load: $.data.active_assignment_count }
            - call: "GET /time-slots/${slot1}"
              as: Customer
              as_user_id: "${cust}"
              captures: { slot1_status: $.data.status }
          assert:
            - "TimeSlot.${slot1}.status == OPEN"
            - "TimeSlot.${slot2}.status == BOOKED"
            - "GameMaster.${gm}.active_assignment_count == 1"
            - "Booking.${bk}.time_slot_id == ${slot2}"

