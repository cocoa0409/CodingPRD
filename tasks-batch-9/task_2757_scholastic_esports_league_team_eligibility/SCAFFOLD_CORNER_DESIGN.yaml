  - section: errors
    # §1.6 requires only that every declared error id be triggerable by at least one test.
    # The 70-id coverage audit is the comment block at the END of this file, after the last
    # section, so that it can account for the rbac, complexity_layers and consistency_model
    # instances too. The single instance here probes the shape of the error channel itself,
    # which no domain instance asserts: envelope, status pairing and non-leakage.
    instances:
      - name: every_error_response_uses_the_declared_error_envelope_and_its_catalogued_status
        claim_type: error_triggerability
        grounds:
          - response_envelope.error
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_STUDENT_NOT_FOUND]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_GPA_THRESHOLDS]
          - errors[ERR_DUPLICATE_NCES_CODE]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          One instance walks six distinct HTTP statuses (401, 403, 404, 400, 422, 409, 412)
          through the SAME endpoint family and asserts the response envelope is identical
          in shape every time: response_type "error", data holding exactly error_id and
          message, meta present, and no domain fields leaked alongside the error. The
          status is read from the catalog per error id, so a handler that collapses
          everything to 400 or 500, or that returns a bare string body, fails here even
          though the error ids are right.
        test_recipe:
          setup:
            - "One district, one school and one student exist"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "NCES-001" }
              as: LeagueAdmin
              captures: { s_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Ada Lin", birthdate: "2009-05-10", grade_level: 11 }
              as: LeagueAdmin
              captures: { st1_id: $.data.id, st1_v: $.data.version }
          trigger:
            - call: "GET /districts/${d_id}"
              as: "Superintendent (a role outside the seven declared roles)"
              as_user_id: "someone"
              captures: { e_401: $.data.error_id }
            - call: "POST /titles"
              payload: { name: "Rocket Clash", publisher: "Astro Interactive", age_rating: "E10", min_player_age: 13 }
              as: Coach
              as_user_id: "coach-x"
              captures: { e_403: $.data.error_id }
            - call: "GET /students/00000000-0000-4000-8000-000000000000"
              as: LeagueAdmin
              captures: { e_404: $.data.error_id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", nces_code: "NCES-777" }
              as: LeagueAdmin
              captures: { e_400: $.data.error_id }
            - call: "POST /districts"
              payload: { name: "Bad Thresholds District", state_code: "CA", min_gpa: 1.500, probation_gpa_floor: 2.000 }
              as: LeagueAdmin
              captures: { e_422: $.data.error_id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "Duplicate Code High", nces_code: "NCES-001" }
              as: LeagueAdmin
              captures: { e_409: $.data.error_id }
            - call: "POST /students/${st1_id}/academic-postings"
              payload: { term_label: "2026-FALL", term_gpa: 3.200, term_credits: 6, expected_student_version: "${st1_v}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
              captures: { st1_v2: $.data.version }
            - call: "POST /students/${st1_id}/academic-postings"
              payload: { term_label: "2026-SPRING", term_gpa: 2.900, term_credits: 6, expected_student_version: "${st1_v}" }
              as: EligibilityOfficer
              as_user_id: "officer-a"
              captures: { e_412: $.data.error_id }
            - call: "GET /students/${st1_id}"
              as: LeagueAdmin
          assert:
            - "trigger 1 returns 401 with data.error_id == ERR_UNAUTHENTICATED — an X-User-Role outside the seven declared roles is unauthenticated, not unauthorized, and it is decided before the path id is even resolved"
            - "trigger 2 returns 403 with data.error_id == ERR_UNAUTHORIZED"
            - "trigger 3 returns 404 with data.error_id == ERR_STUDENT_NOT_FOUND"
            - "trigger 4 returns 400 with data.error_id == ERR_INVALID_REQUEST (School.name is required and has no default)"
            - "trigger 5 returns 422 with data.error_id == ERR_INVALID_GPA_THRESHOLDS — a semantic cross-field rule is 422, not 400"
            - "trigger 6 returns 409 with data.error_id == ERR_DUPLICATE_NCES_CODE"
            - "trigger 7 is the only successful call in the trigger list and exists solely to make the captured ${st1_v} stale: it returns 200 with data.version == ${st1_v2}, one increment above ${st1_v}, and latest_term_gpa == 3.200"
            - "trigger 8 replays the now-stale ${st1_v} and returns 412 with data.error_id == ERR_STALE_VERSION"
            - "every one of triggers 1-6 and trigger 8 returns response_type == \"error\" with data containing exactly the keys error_id and message, message non-empty, and meta.api_request_id plus meta.api_request_timestamp present"
            - "no error body carries entity fields alongside the error (no id, no version, no district/school/student payload) — the error channel is disjoint from the success channel"
            - "trigger 9 shows Student.${st1_id}.version == ${st1_v2} and latest_term_gpa == 3.200, with no 2026-SPRING term recorded — the 412 in trigger 8 wrote nothing"
            - "no error response returns HTTP 500, and no two of these seven ids share a status by accident: the statuses observed on the error calls are exactly 401, 403, 404, 400, 422, 409 and 412 in trigger order"

  - section: rbac
    instances:
      - name: each_roles_exclusive_operation_is_refused_to_every_other_role
        claim_type: role_forbidden_operations
        grounds:
          - rbac.LeagueAdmin.exclusive_operations
          - rbac.DistrictAdmin.exclusive_operations
          - rbac.AthleticDirector.exclusive_operations
          - rbac.Coach.exclusive_operations
          - rbac.EligibilityOfficer.exclusive_operations
          - rbac.IntegrityOfficer.exclusive_operations
          - rbac.Recruiter.exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          One exclusive operation per role, each attempted by a role that is NOT in its
          declared list, including two cases chosen so that the caller would otherwise
          have passed every later check: the Coach who owns the team is still refused
          `withdraw`, and the AthleticDirector of the right school is still refused
          `register`. That pins the role check at priority 2, ahead of ownership at
          priority 3 and state at 12+. It also proves LeagueAdmin is NOT a superuser: it
          cannot log a recruiting contact.
        test_recipe:
          setup:
            - "One district, one school, one CERTIFIED coach, an APPROVED title approval, a DRAFT season, a DRAFT team with one unverified STARTER slot and one REPORTED fair-play case"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
              payload: { district_id: "${d_id}", name: "North High", nces_code: "NCES-001" }
              as: LeagueAdmin
              captures: { s_id: $.data.id }
            - call: "POST /coaches"
              payload: { school_id: "${s_id}", full_name: "Dana Reed", email: "dana@north.k12" }
              as: LeagueAdmin
              captures: { c_id: $.data.id }
            - call: "POST /coaches/${c_id}/certification"
              payload: { action: "CERTIFY", background_check_expires_on: "2027-06-30" }
              as: AthleticDirector
              as_user_id: "${s_id}"
            - call: "POST /titles"
              payload: { name: "Rocket Clash", publisher: "Astro Interactive", age_rating: "E10", min_player_age: 13 }
              as: LeagueAdmin
              captures: { t_id: $.data.id }
            - call: "POST /title-approvals"
              payload: { district_id: "${d_id}", title_id: "${t_id}", requested_by_school_id: "${s_id}" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /title-approvals/${ap_id}/decision"
              payload: { action: "APPROVE" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
            - call: "POST /seasons"
              payload: { title_id: "${t_id}", name: "Fall 2026 Varsity" }
              as: LeagueAdmin
              captures: { se_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${se_id}", school_id: "${s_id}", title_id: "${t_id}", coach_id: "${c_id}", name: "North Alpha" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { tm1_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${s_id}", full_name: "Ada Lin", birthdate: "2009-05-10", grade_level: 11 }
              as: LeagueAdmin
              captures: { st1_id: $.data.id }
            - call: "POST /roster-slots"
              payload: { team_id: "${tm1_id}", student_id: "${st1_id}", slot_role: "STARTER" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { sl1_id: $.data.id }
            - call: "POST /fair-play-cases"
              payload: { team_id: "${tm1_id}", subject_type: "STUDENT", case_type: "SMURFING", evidence_ref: "EV-1", subject_student_id: "${st1_id}" }
              as: IntegrityOfficer
              as_user_id: "integrity-a"
              captures: { fc1_id: $.data.id }
          trigger:
            - call: "POST /seasons/${se_id}/advance"
              payload: { to_status: "REGISTRATION_OPEN" }
              as: DistrictAdmin
              as_user_id: "${d_id}"
              captures: { e_advance: $.data.error_id }
            - call: "POST /title-approvals/${ap_id}/decision"
              payload: { action: "REVOKE" }
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { e_decision: $.data.error_id }
            - call: "POST /teams/${tm1_id}/withdraw"
              payload: { withdrawal_note: "not going ahead" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { e_withdraw: $.data.error_id }
            - call: "POST /teams/${tm1_id}/register"
              payload: {}
              as: AthleticDirector
              as_user_id: "${s_id}"
              captures: { e_register: $.data.error_id }
            - call: "POST /roster-slots/${sl1_id}/verify-enrollment"
              payload: { enrollment_document_ref: "REG-0001", verified_birthdate: "2009-05-10" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { e_verify: $.data.error_id }
            - call: "POST /fair-play-cases/${fc1_id}/investigate"
              payload: { investigation_note: "let me look" }
              as: Coach
              as_user_id: "${c_id}"
              captures: { e_investigate: $.data.error_id }
            - call: "POST /students/${st1_id}/recruiting-contacts"
              payload: { org_code: "STATE-U", channel: "EMAIL", purpose: "camp invitation" }
              as: LeagueAdmin
              captures: { e_recruit: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: IntegrityOfficer
              as_user_id: "integrity-a"
              captures: { e_clock: $.data.error_id }
          assert:
            - "all eight triggers return 403 with data.error_id == ERR_UNAUTHORIZED"
            - "trigger 3 is refused even though the caller IS the team's coach — the priority-2 role check runs before the priority-3 ownership check, so ownership never saves a role that is not listed"
            - "trigger 4 is refused even though the AthleticDirector's X-User-ID is the team's school — register is Coach-exclusive"
            - "trigger 7 shows LeagueAdmin is not a superuser: POST /students/{studentId}/recruiting-contacts is Recruiter-exclusive"
            - "nothing moved: Season.${se_id}.status == DRAFT, TitleApproval.${ap_id}.status == APPROVED, Team.${tm1_id}.status == DRAFT with registered_at null, RosterSlot.${sl1_id}.verification_status == UNVERIFIED, FairPlayCase.${fc1_id}.status == REPORTED with investigator_user_id null, Student.${st1_id}.recruiting_contact_log == []"
