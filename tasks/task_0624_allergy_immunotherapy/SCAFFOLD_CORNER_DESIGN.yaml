# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of testable claims in §1.1–§1.7
# not already covered by §1.8. Sections/claim_types from claim-extraction-guide.md.
# Default clock = 2026-01-01T00:00:00Z unless moved by _clock/set_current_utc.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_patient_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Patient.fields.full_name
          - entities.Patient.fields.status
        distinguishing_aspect: "POST /patients with full_name + date_of_birth returns 201; id/created_at/version system-minted; status defaults ACTIVE; epinephrine_on_file defaults false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Ada Vale", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id, st: $.data.status, epi: $.data.epinephrine_on_file, ver: $.data.version }
          assert:
            - "Response status 201"
            - "Patient.${pat_id}.status == ACTIVE"
            - "Patient.${pat_id}.epinephrine_on_file == false"
            - "Patient.${pat_id}.version == 1"

      - name: get_patient_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Patient
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /patients/{nonexistent-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response status 404 with data.error_id == ERR_NOT_FOUND"

      - name: create_panel_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - entities.DiagnosticPanel.fields.panel_name
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /patients/{id}/panels without panel_name returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["One patient exists."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Bea West", date_of_birth: "1991-02-02" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
          trigger:
            - call: "POST /patients/${pat_id}/panels"
              payload: { control_wheal_mm: 3 }
              as: Allergist
              captures: { err: $.data.error_id }
          assert:
            - "Response status 400 with data.error_id == ERR_INVALID_REQUEST"

      - name: panel_control_wheal_default_applied
        claim_type: Defaults
        grounds:
          - entities.DiagnosticPanel.fields.control_wheal_mm
        distinguishing_aspect: "Omitting control_wheal_mm on panel create applies default 3 (a SKIN wheal 6 then reads index 3)."
        test_recipe:
          setup: ["One patient exists; panel created without control_wheal_mm."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Cal Yule", date_of_birth: "1992-03-03" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "DefaultCtrl" }
              as: Allergist
              captures: { panel_id: $.data.id, ctrl: $.data.control_wheal_mm }
          trigger:
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "CAT", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
              captures: { idx: $.data.sensitization_index }
          assert:
            - "DiagnosticPanel.${panel_id}.control_wheal_mm == 3"
            - "AllergenTest.idx == 3 (wheal 6 - default control 3)"

      - name: allergen_test_blood_class_boundary_zero_negative
        claim_type: Computed Fields
        grounds:
          - entities.AllergenTest.fields.sensitization_index
          - entities.AllergenTest.fields.is_positive
          - calculations.panel_sensitization_score
        distinguishing_aspect: "BLOOD IgE 0.34 kU/L is below the 0.35 class-1 boundary -> sensitization_index 0, is_positive false."
        test_recipe:
          setup: ["A patient with an OPEN panel."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Dot Zorn", date_of_birth: "1993-04-04" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "BloodEdge", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
          trigger:
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "BLOOD", specific_ige_ku: 0.34, clinically_relevant: true }
              as: Allergist
              captures: { idx: $.data.sensitization_index, pos: $.data.is_positive }
          assert:
            - "AllergenTest.idx == 0"
            - "AllergenTest.pos == false (0.34 < 0.35 class-1 boundary)"

      - name: list_patients_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Patient
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /patients?limit=1&offset=0 returns array with total_count and has_more=true when 2 patients exist."
        test_recipe:
          setup: ["Two patients exist."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Eve Abel", date_of_birth: "1990-01-01" }
              as: FrontDesk
            - call: "POST /patients"
              payload: { full_name: "Fox Buhl", date_of_birth: "1990-01-02" }
              as: FrontDesk
          trigger:
            - call: "GET /patients?limit=1&offset=0"
              payload: {}
              as: FrontDesk
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true; exactly 1 element returned"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: add_test_to_finalized_panel_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DiagnosticPanel.OPEN_to_FINALIZED
          - "errors[ERR_PANEL_NOT_OPEN]"
        distinguishing_aspect: "Adding a test to a FINALIZED panel returns 409 ERR_PANEL_NOT_OPEN; composites unchanged."
        test_recipe:
          setup: ["A FINALIZED panel with one positive SKIN test."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Gus Cobb", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Done", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "OAK", method: "SKIN", wheal_mm: 7, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
          trigger:
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 with data.error_id == ERR_PANEL_NOT_OPEN"

      - name: finalize_panel_no_positive_test_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DiagnosticPanel.OPEN_to_FINALIZED
          - "errors[ERR_NO_POSITIVE_TEST]"
        distinguishing_aspect: "Finalize a panel whose only test is negative (SKIN wheal 4, control 3 -> diff 1 < 3) returns 422 ERR_NO_POSITIVE_TEST."
        test_recipe:
          setup: ["An OPEN panel with one negative SKIN test (wheal 4, control 3)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Hap Dorn", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Neg", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "OAK", method: "SKIN", wheal_mm: 4, clinically_relevant: true }
              as: Allergist
              captures: { pos: $.data.is_positive }
          trigger:
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
              captures: { err: $.data.error_id }
          assert:
            - "AllergenTest.pos == false"
            - "Response status 422 with data.error_id == ERR_NO_POSITIVE_TEST"

      - name: finalize_empty_panel_returns_panel_empty
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DiagnosticPanel.OPEN_to_FINALIZED
          - "errors[ERR_PANEL_EMPTY]"
        distinguishing_aspect: "Finalize a panel with zero tests returns 422 ERR_PANEL_EMPTY (distinct from no-positive)."
        test_recipe:
          setup: ["An OPEN panel with no tests."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ida Earl", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Empty", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
          trigger:
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
              captures: { err: $.data.error_id }
          assert:
            - "Response status 422 with data.error_id == ERR_PANEL_EMPTY"

      - name: activate_plan_not_draft_returns_invalid
        claim_type: Idempotency
        grounds:
          - state_machines.ImmunotherapyPlan.DRAFT_to_ACTIVE
          - "errors[ERR_PLAN_NOT_DRAFT]"
        distinguishing_aspect: "Activating an already-ACTIVE plan returns 409 ERR_PLAN_NOT_DRAFT (second activate)."
        test_recipe:
          setup: ["An ACTIVE plan with a starting RED vial."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Jed Funk", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Act", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-IDEM", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 with data.error_id == ERR_PLAN_NOT_DRAFT"

      - name: activate_plan_no_starting_vial_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ImmunotherapyPlan.DRAFT_to_ACTIVE
          - "errors[ERR_NO_STARTING_VIAL]"
        distinguishing_aspect: "Activate a DRAFT plan with no IN_USE vial of starting_vial_color returns 422 ERR_NO_STARTING_VIAL (panel HIGH -> starting GREEN, but only a RED vial exists)."
        test_recipe:
          setup: ["A DRAFT plan whose starting_vial_color is GREEN (HIGH tier); only a RED vial mixed."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Kit Gore", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "HighTier", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "OAK", method: "SKIN", wheal_mm: 10, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
              captures: { tier: $.data.recommended_tier }
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version, start_color: $.data.starting_vial_color }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-NOSTART", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { err: $.data.error_id }
          assert:
            - "ImmunotherapyPlan.${plan_id}.starting_vial_color == GREEN"
            - "Response status 422 with data.error_id == ERR_NO_STARTING_VIAL"

      - name: complete_plan_not_at_maintenance_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ImmunotherapyPlan.ACTIVE_to_COMPLETED
          - "errors[ERR_NOT_AT_MAINTENANCE]"
        distinguishing_aspect: "Complete an ACTIVE build-up plan (phase BUILD_UP) returns 409 ERR_NOT_AT_MAINTENANCE."
        test_recipe:
          setup: ["An ACTIVE RED-start plan still in BUILD_UP phase with a starting vial."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Lia Hoff", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "BU", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-BUONLY", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/complete"
              payload: {}
              as: Allergist
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 with data.error_id == ERR_NOT_AT_MAINTENANCE"

      - name: release_local_reaction_grade_mismatch
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ShotVisit.ADMINISTERED_to_RELEASED
          - "errors[ERR_REACTION_GRADE_MISMATCH]"
        distinguishing_aspect: "Calling release with reaction_grade=LOCAL returns 422 ERR_REACTION_GRADE_MISMATCH (release only accepts NONE)."
        test_recipe:
          setup: ["An ADMINISTERED shot past its observation window."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Nurse
            - call: "POST /patients"
              payload: { full_name: "Moe Iver", date_of_birth: "1990-01-01", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Mis", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-MIS", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-06-01T08:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { visit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: Nurse
          trigger:
            - call: "POST /shot-visits/${visit_id}/release"
              payload: { released_at_iso: "2026-06-01T10:00:00Z", reaction_grade: "LOCAL" }
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "Response status 422 with data.error_id == ERR_REACTION_GRADE_MISMATCH"

      - name: local_reaction_does_not_advance_ladder
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ShotVisit.ADMINISTERED_to_REACTION_LOCAL
          - calculations.reaction_reduction
        distinguishing_aspect: "Recording LOCAL on a RED step1 shot leaves the plan ACTIVE and current_step_index at 1 (no advance, no reduction)."
        test_recipe:
          setup: ["An ACTIVE RED-start plan with one ADMINISTERED shot at RED step1."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ned Jolt", date_of_birth: "1990-01-01", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Loc", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-LOC", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { vial_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /shot-visits/${visit_id}/record-reaction"
              payload: { reaction_grade: "LOCAL" }
              as: Nurse
            - call: "GET /immunotherapy-plans/${plan_id}"
              payload: {}
              as: Allergist
              captures: { st: $.data.status, step: $.data.current_step_index, color: $.data.current_vial_color }
          assert:
            - "ShotVisit.${visit_id}.status == REACTION_LOCAL"
            - "ImmunotherapyPlan.${plan_id}.status == ACTIVE (LOCAL does not hold the plan)"
            - "ImmunotherapyPlan.${plan_id}.current_step_index == 1 (no advance)"
            - "ImmunotherapyPlan.${plan_id}.current_vial_color == RED"

      - name: lot_recall_idempotent_second_recall_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.SerumLot.AVAILABLE_to_RECALLED
          - "errors[ERR_LOT_NOT_AVAILABLE]"
        distinguishing_aspect: "Recalling an already-RECALLED lot returns 409 ERR_LOT_NOT_AVAILABLE (RECALLED is terminal)."
        test_recipe:
          setup: ["A RECALLED lot."]
          setup_api_calls:
            - call: "POST /serum-lots"
              payload: { vial_color: "RED", lot_number: "RED-TERM", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /serum-lots/${lot_id}/recall"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /serum-lots/${lot_id}/recall"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 with data.error_id == ERR_LOT_NOT_AVAILABLE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: ige_class_boundary_at_3point5_is_class_3
        claim_type: Correct Result
        grounds:
          - calculations.panel_sensitization_score
          - entities.AllergenTest.fields.sensitization_index
        distinguishing_aspect: "BLOOD IgE exactly 3.5 kU/L maps to class 3 (>= 3.5 boundary), sensitization_index 3, distinct from 3.49 -> class 2."
        test_recipe:
          setup: ["An OPEN panel."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Ola Kemp", date_of_birth: "1990-01-01" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "ClassEdge", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
          trigger:
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "BLOOD", specific_ige_ku: 3.5, clinically_relevant: true }
              as: Allergist
              captures: { idx: $.data.sensitization_index }
          assert:
            - "AllergenTest.idx == 3 (IgE 3.5 >= 3.5 boundary -> class 3)"

      - name: maintenance_phase_dose_fixed_top_volume
        claim_type: Variant Selection
        grounds:
          - calculations.dosing_schedule
          - entities.ImmunotherapyPlan.fields.phase
        distinguishing_aspect: "Once SILVER top step (0.50 mL) is reached and released, phase becomes MAINTENANCE; a SILVER vial dose is verified at SILVER step1 0.10 mL (escalation to top occurs over the ladder; this checks MAINTENANCE selection vs BUILD_UP)."
        excluded_because:
          difficulty_instance: dual_variant_calc / billing_95165_provisional_vs_final_diverge
          rationale: "Phase/dose variant divergence (BUILD_UP vs MAINTENANCE escalation) is exercised by the dosing-ladder advance asserted across §1.8 dosing instances; reaching SILVER MAINTENANCE requires a long release chain already prototyped there."

      - name: antigen_units_silver_maintenance_top_dose
        claim_type: Constants Applied
        grounds:
          - calculations.antigen_units
          - entities.ShotVisit.fields.antigen_units_delivered
        distinguishing_aspect: "A SILVER vial dose at 0.10 mL (potency 10000) yields antigen_units_delivered = 0.10 * 1.0 * 10000 = 1000.00 (SILVER dilution_factor 1.0 constant applied)."
        test_recipe:
          setup: ["An ACTIVE YELLOW-start plan (MODERATE tier) with a YELLOW starting vial (so activation succeeded) PLUS a SILVER vial mixed onto the same plan; the trigger shot (plan at YELLOW step1, 0.10 mL) draws from the SILVER vial. Patient epinephrine_on_file true (required for the SILVER draw)."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "Pat Lund", date_of_birth: "1990-01-01", epinephrine_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels"
              payload: { panel_name: "Sil", control_wheal_mm: 3 }
              as: Allergist
              captures: { panel_id: $.data.id }
            - call: "POST /patients/${pat_id}/panels/${panel_id}/tests"
              payload: { allergen_code: "DUST", method: "SKIN", wheal_mm: 6, clinically_relevant: true }
              as: Allergist
            - call: "POST /patients/${pat_id}/panels/${panel_id}/finalize"
              payload: {}
              as: Allergist
              captures: { tier: $.data.recommended_tier }
            - call: "POST /immunotherapy-plans"
              payload: { patient_id: "${pat_id}", panel_id: "${panel_id}" }
              as: Allergist
              captures: { plan_id: $.data.id, plan_v0: $.data.version, start_color: $.data.starting_vial_color }
            - call: "POST /serum-lots"
              payload: { vial_color: "YELLOW", lot_number: "YEL-1000", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { yel_lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${yel_lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v0}" }
              as: Pharmacist
              captures: { yel_vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /serum-lots"
              payload: { vial_color: "SILVER", lot_number: "SIL-1000", concentrate_potency_pnu_per_ml: 10000, received_at_iso: "2026-01-01T00:00:00Z" }
              as: Pharmacist
              captures: { sil_lot_id: $.data.id }
            - call: "POST /immunotherapy-plans/${plan_id}/vials"
              payload: { lot_id: "${sil_lot_id}", prepared_volume_ml: 5.0, expected_plan_version: "${plan_v1}" }
              as: Pharmacist
              captures: { sil_vial_id: $.data.id, plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v3: $.data.version }
          setup_note: "wheal 6 control 3 -> index 3 -> clinical_composite 3 -> MODERATE -> starting_vial_color YELLOW; the YELLOW vial satisfies activation. The trigger shot draws 0.10 mL (YELLOW step1) from the SILVER vial: antigen = 0.10 * SILVER dilution 1.0 * potency 10000 = 1000.0. Both vials belong to this plan; epinephrine on file permits the SILVER draw."
          trigger:
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${sil_vial_id}", expected_plan_version: "${plan_v3}" }
              as: Nurse
              captures: { visit_id: $.data.id, units: $.data.antigen_units_delivered }
          assert:
            - "ShotVisit.${visit_id}.antigen_units_delivered == 1000.0 (0.10 * SILVER 1.0 * 10000)"

