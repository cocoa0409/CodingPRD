              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${pdbc_id}/allocate"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${pdbc_id}/issue-statements"
              payload: {}
              as: PropertyManager
            - call: "GET /statements"
              payload: { billing_cycle_id: "${pdbc_id}" }
              as: PropertyManager
              captures: { pdst_id: "$.data[0].id" }
            - call: "POST /statements/${pdst_id}/disputes"
              payload: { reason: "RATIO_ERROR", credit_amount_cents: 6000 }
