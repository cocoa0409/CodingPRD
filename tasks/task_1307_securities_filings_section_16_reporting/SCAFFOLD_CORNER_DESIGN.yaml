        grounds: [calculations.insider_shares_balance, entities.SecurityTransaction.fields.shares_owned_after]
        distinguishing_aspect: "Confirming a later-dated transaction before an earlier-dated one still yields chronologically correct running balances after the whole-chain recompute (tie-break created_at ASC, never id)."
        test_recipe:
          setup:
            - "Issuer I; person P ACTIVE (designated 2026-08-03); clock 2026-08-05"
            - "T_later: purchase 50 @ 10.00 dated 2026-08-05 confirmed FIRST; T_earlier: purchase 100 @ 10.00 dated 2026-08-04 confirmed SECOND"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Acme Corp", ticker: "ACME", cik: "0000000001", shares_outstanding: 1000000, fiscal_year_end_month: 12, edgar_ccc: "CCC12345" }
