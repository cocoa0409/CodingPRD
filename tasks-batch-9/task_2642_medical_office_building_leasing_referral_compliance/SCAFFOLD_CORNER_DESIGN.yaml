      - name: lease_minimum_term_boundary_eleven_versus_twelve_months
        claim_type: threshold
        grounds:
          - calculations.lease_term_months
          - validations[30]
          - errors.ERR_MIN_TERM_NOT_MET
        distinguishing_aspect: "2026-09-01..2027-07-31 computes 11 months and is refused at creation with 422 ERR_MIN_TERM_NOT_MET, while extending the end date by one day to 2027-08-31 computes 12 and is admitted — the one-year Stark space-lease floor sits exactly on this boundary."
        test_recipe:
          setup:
            - "One reference Building with a 5000 sf STANDARD_EXAM suite and one non-physician-owned INDEPENDENT_PRACTICE tenant."
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Meridian Medical Plaza", total_rentable_sf: 100000, market_base_rent_psf_annual: 30.00, operating_expense_annual_psf: 9.60, total_parking_stalls: 400, patient_min_reserve_pct: 0.60 }
              as: PortfolioAdmin
              captures: { k6_b_id: $.data.id }
            - call: "POST /buildings/${k6_b_id}/suites"
              payload: { suite_number: "210", floor: 2, rentable_sf: 5000, suite_class: "STANDARD_EXAM", power_amps_available: 200 }
              as: PortfolioAdmin
              captures: { k6_s_id: $.data.id }
            - call: "POST /tenants"
              payload: { legal_name: "Northgate Medical Group PC", affiliation: "INDEPENDENT_PRACTICE", primary_specialty: "GASTROENTEROLOGY", is_physician_owned: false, npi: "1234568351" }
              as: PortfolioAdmin
              captures: { k6_t_id: $.data.id }
          trigger:
            - call: "POST /leases"
              payload: { building_id: "${k6_b_id}", suite_id: "${k6_s_id}", tenant_id: "${k6_t_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2027-07-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
            - call: "POST /leases"
              payload: { building_id: "${k6_b_id}", suite_id: "${k6_s_id}", tenant_id: "${k6_t_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2027-08-30", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
            - call: "POST /leases"
              payload: { building_id: "${k6_b_id}", suite_id: "${k6_s_id}", tenant_id: "${k6_t_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2027-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { k6_l_id: $.data.id }
            - call: "GET /leases"
              payload: { suite_id: "${k6_s_id}" }
              as: LeasingAgent
          assert:
            - "The 2027-07-31 end date returns 422 with data.error_id == 'ERR_MIN_TERM_NOT_MET'"
            - "The 2027-08-30 end date also returns 422 ERR_MIN_TERM_NOT_MET — one day short of a full twelfth month still computes 11"
            - "The 2027-08-31 end date returns 201 with Lease.${k6_l_id}.term_months == 12"
            - "GET /leases?suite_id=${k6_s_id} returns meta.total_count == 1 — the two refusals persisted nothing"

      - name: ti_cost_share_applies_three_level_share_precedence
