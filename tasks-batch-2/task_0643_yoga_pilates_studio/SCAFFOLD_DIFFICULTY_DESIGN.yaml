              payload: { member_id: "${m1_id}", workshop_id: "${w_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { en1_id: $.data.id }
            - call: "POST /enrollments/${en1_id}/confirm"
              payload: { expected_workshop_version: "${w_v0}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /enrollments"
              payload: { member_id: "${m2_id}", workshop_id: "${w_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { en2_id: $.data.id }
            - call: "GET /workshops/${w_id}"
              payload: {}
              as: StudioManager
