scenario: |
  1875. Post-Production Workflow & Dailies Management (post-production facility): media ingest &
  proxy generation, dailies distribution with security watermarking, edit bay/artist scheduling &
  version tracking, conform, color & sound turnover with change lists, review/approval rounds &
  note consolidation, deliverable spec (mezzanine/broadcast) & QC failure remediation, archive/LTO
  & asset retention, vendor allocation & bid tracking

domain_name: post-production-workflow
api_prefix: /post-production

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Project working title" }
      - { name: client_code, type: string, source: input, description: "Client billing code (3-8 uppercase alphanum)" }
      - { name: fps, type: number, source: input, description: "Project base frame rate (23.976 | 24 | 25 | 29.97 | 30)" }
      - { name: resolution_width, type: integer, source: input, description: "Master raster width in pixels (e.g. 1920, 3840, 4096)" }
      - { name: resolution_height, type: integer, source: input, description: "Master raster height in pixels" }
      - { name: storage_quota_gb, type: integer, source: input, description: "Project online storage quota in GiB" }
      - { name: storage_used_gb, type: number, source: computed, description: "Sum of proxied_bytes + source_bytes for non-purged MediaAssets, in GiB, rounded to 3 decimals" }
      - { name: security_tier, type: enum, source: input, description: "STANDARD | ELEVATED | LOCKDOWN — watermarking strictness" }
      - { name: status, type: enum, source: system, description: "SETUP | ACTIVE | WRAPPING | CLOSED | ARCHIVED" }
      - { name: open_change_list_count, type: integer, source: computed, description: "Count of ChangeLists in OPEN or SUPERSEDED-PENDING state for this project" }
      - { name: conform_ready, type: boolean, source: computed, description: "True iff every MediaAsset in scope has status CONFORMED or LOCKED, no ReviewRound has unresolved_critical=true, and at least one TurnoverPackage exists in ISSUED or later" }

  - name: MediaBatch
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: batch_label, type: string, source: input, description: "Human label, unique per project, e.g. 'DAY03-CAM_A'" }
      - { name: ingest_window_start, type: datetime, source: input, description: "Start of declared ingest window (ISO8601 UTC)" }
      - { name: ingest_window_end, type: datetime, source: input, description: "End of declared ingest window; must be strictly greater than start" }
      - { name: status, type: enum, source: system, description: "DECLARED | INGESTING | PROXYING | READY | FAILED | PURGED" }
      - { name: asset_count, type: integer, source: computed, description: "Count of MediaAssets whose batch_id == this batch" }
      - { name: failed_asset_count, type: integer, source: computed, description: "Count of MediaAssets in this batch with status FAILED" }
      - { name: proxy_progress_pct, type: integer, source: computed, description: "floor(100 * proxies_done / max(1, asset_count)); proxies_done counts assets with proxy_status == DONE" }

  - name: MediaAsset
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: batch_id, type: string, source: input, description: "FK -> MediaBatch.id; ingest batch" }
      - { name: reel_name, type: string, source: input, description: "Camera reel / card name, e.g. 'A001C002'" }
      - { name: clip_name, type: string, source: input, description: "Clip identifier; composite uniqueness (project_id, reel_name, clip_name)" }
      - { name: source_bytes, type: integer, source: input, description: "Source media size in bytes (> 0)" }
      - { name: proxy_bytes, type: integer, source: system, description: "Proxy file size in bytes; 0 until proxy_status == DONE" }
      - { name: duration_frames, type: integer, source: input, description: "Clip duration in project frames (> 0)" }
      - { name: proxy_status, type: enum, source: system, description: "PENDING | RUNNING | DONE | FAILED" }
      - { name: status, type: enum, source: system, description: "INGESTED | VERIFIED | CONFORMED | LOCKED | FAILED | PURGED" }
      - { name: qc_fail_count, type: integer, source: computed, description: "Count of QCReport rows with asset_id == this asset and verdict == FAIL" }
      - { name: retained_until, type: datetime, source: system, description: "Retention horizon; null while status != ARCHIVED-eligible; set by ArchiveJob completion" }

  - name: WatermarkProfile
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: profile_name, type: string, source: input, description: "Profile label, unique per project" }
      - { name: opacity_pct, type: integer, source: input, description: "Watermark opacity 1-100" }
      - { name: position, type: enum, source: input, description: "TOP_LEFT | TOP_RIGHT | BOTTOM_LEFT | BOTTOM_RIGHT | CENTER | DIAGONAL_TILE" }
      - { name: includes_recipient_email, type: boolean, source: input, description: "Burn recipient email into visible watermark" }
      - { name: forensic_enabled, type: boolean, source: input, description: "Embed forensic (invisible) watermark payload" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: DailiesPackage
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: batch_id, type: string, source: input, description: "FK -> MediaBatch.id; the batch being distributed" }
      - { name: watermark_profile_id, type: string, source: input, description: "FK -> WatermarkProfile.id; must be ACTIVE at publish" }
      - { name: distribution_list, type: array, source: input, description: "List of recipient emails, 1..50 entries, all unique, lowercase" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | REVOKED" }
      - { name: published_at, type: datetime, source: system, description: "Set on publish; null otherwise" }
      - { name: revoked_at, type: datetime, source: system, description: "Set on revoke; null otherwise" }
      - { name: recipient_count, type: integer, source: computed, description: "len(distribution_list)" }

  - name: EditBay
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: bay_name, type: string, source: input, description: "Bay label, unique per project (e.g. 'BAY-07')" }
      - { name: bay_type, type: enum, source: input, description: "OFFLINE | ONLINE | COLOR | SOUND | QC" }
      - { name: capacity_hours_per_day, type: integer, source: input, description: "Bookable hours per calendar day, 1..24" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | MAINTENANCE | DECOMMISSIONED" }

  - name: Booking
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: bay_id, type: string, source: input, description: "FK -> EditBay.id" }
      - { name: artist_email, type: string, source: input, description: "Booked artist; lowercase email" }
      - { name: session_date, type: string, source: input, description: "Calendar date YYYY-MM-DD" }
      - { name: start_hour, type: integer, source: input, description: "Start hour 0..23 inclusive" }
      - { name: end_hour, type: integer, source: input, description: "End hour 1..24 exclusive; must be > start_hour" }
      - { name: version_tag, type: string, source: input, description: "Editorial version label booked (e.g. 'v014'); immutable after CHECKED_IN" }
      - { name: status, type: enum, source: system, description: "RESERVED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }
      - { name: booked_hours, type: integer, source: computed, description: "end_hour - start_hour" }

  - name: TurnoverPackage
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: turnover_kind, type: enum, source: input, description: "CONFORM | COLOR | SOUND" }
      - { name: sequence_label, type: string, source: input, description: "Sequence/reel label, unique per (project, turnover_kind)" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; awarded vendor required before ISSUE" }
      - { name: status, type: enum, source: system, description: "DRAFT | STAGED | ISSUED | ACKED | RETURNED | CLOSED | VOID" }
      - { name: issued_at, type: datetime, source: system, description: "Set on ISSUE" }
      - { name: change_list_revision, type: integer, source: computed, description: "Highest ChangeList.revision attached to this turnover; 0 when none" }

  - name: ChangeList
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: turnover_id, type: string, source: input, description: "FK -> TurnoverPackage.id" }
      - { name: revision, type: integer, source: system, description: "Per-turnover monotone revision, starts at 1" }
      - { name: entries, type: array, source: input, description: "List of change entries; each entry has {asset_id, operation: ADD|DELETE|TRIM|SLIP, frames_delta}" }
      - { name: net_frames_delta, type: integer, source: computed, description: "Sum of frames_delta across entries; TRIM/DELETE contribute negative values" }
      - { name: status, type: enum, source: system, description: "OPEN | APPLIED | SUPERSEDED | REJECTED" }

  - name: ReviewRound
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: round_label, type: string, source: input, description: "e.g. 'RR-03'; unique per project" }
      - { name: target_kind, type: enum, source: input, description: "DAILIES | CUT | VENDOR_RETURN | DELIVERABLE" }
      - { name: target_ref_id, type: string, source: input, description: "ID of DailiesPackage | TurnoverPackage | Deliverable under review" }
      - { name: status, type: enum, source: system, description: "OPEN | NOTES_CLOSED | APPROVED | REJECTED | VOID" }
      - { name: unresolved_critical, type: boolean, source: computed, description: "True iff any ReviewNote in this round has severity == CRITICAL and status != RESOLVED" }
      - { name: open_note_count, type: integer, source: computed, description: "Count of ReviewNotes with status != RESOLVED and != VOID" }

  - name: ReviewNote
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: round_id, type: string, source: input, description: "FK -> ReviewRound.id" }
      - { name: author_email, type: string, source: input, description: "Note author; lowercase" }
      - { name: severity, type: enum, source: input, description: "INFO | MINOR | MAJOR | CRITICAL" }
      - { name: body, type: string, source: input, description: "Free text, 1..2000 chars" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKED | RESOLVED | VOID" }

  - name: Deliverable
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: spec_kind, type: enum, source: input, description: "MEZZANINE | BROADCAST" }
      - { name: sequence_label, type: string, source: input, description: "Sequence being mastered" }
      - { name: container, type: enum, source: input, description: "MXF_OP1A | MOV_PRORES | IMF" }
      - { name: requires_qc, type: boolean, source: input, description: "If false, deliverable skips QC and may not transition to DELIVERED" }
      - { name: status, type: enum, source: system, description: "SPEC_DRAFT | RENDERING | RENDERED | QC_QUEUED | QC_PASSED | QC_FAILED | DELIVERED | REJECTED | SUPERSEDED" }
      - { name: render_progress_pct, type: integer, source: computed, description: "0-100; 100 iff status in {RENDERED, QC_QUEUED, QC_PASSED, QC_FAILED, DELIVERED}" }
      - { name: qc_attempt_count, type: integer, source: computed, description: "Count of QCReport rows for this deliverable" }

  - name: QCReport
    parent: Project
    common_fields: false
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: deliverable_id, type: string, source: input, description: "FK -> Deliverable.id" }
      - { name: asset_id, type: string, source: input, description: "FK -> MediaAsset.id; optional scope of the failure (null when report is deliverable-wide)" }
      - { name: attempt_no, type: integer, source: system, description: "Per-deliverable monotone attempt counter, starts at 1" }
      - { name: verdict, type: enum, source: input, description: "PASS | FAIL" }
      - { name: fail_codes, type: array, source: input, description: "List of QC fail codes; required when verdict == FAIL, must be empty on PASS" }
      - { name: issued_by, type: string, source: system, description: "X-User-ID of issuing QC operator" }

  - name: ArchiveJob
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: lto_generation, type: enum, source: input, description: "LTO7 | LTO8 | LTO9" }
      - { name: target_scope, type: enum, source: input, description: "SOURCES_ONLY | SOURCES_AND_PROXIES | FULL_PROJECT" }
      - { name: retention_years, type: integer, source: input, description: "Retention horizon in years, 1..25" }
      - { name: status, type: enum, source: system, description: "QUEUED | WRITING | VERIFYING | SEALED | FAILED | CANCELLED" }
      - { name: sealed_at, type: datetime, source: system, description: "Set on SEALED" }
      - { name: bytes_written, type: integer, source: computed, description: "Total bytes sealed across the job scope" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: vendor_name, type: string, source: input, description: "Vendor legal name, unique across the facility" }
      - { name: capabilities, type: array, source: input, description: "Subset of {CONFORM, COLOR, SOUND, QC, ARCHIVE}; 1..5 unique entries" }
      - { name: day_rate_cents, type: integer, source: input, description: "Standard day rate in cents, >= 0" }
      - { name: capacity_slots, type: integer, source: input, description: "Max concurrent awarded TurnoverPackages, 1..20" }
      - { name: status, type: enum, source: system, description: "ONBOARDED | SUSPENDED | OFFBOARDED" }

  - name: VendorBid
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: turnover_id, type: string, source: input, description: "FK -> TurnoverPackage.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: bid_amount_cents, type: integer, source: input, description: "Bid in cents, > 0" }
      - { name: eta_days, type: integer, source: input, description: "Promised turnaround in days, 1..60" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | WITHDRAWN | AWARDED | REJECTED | EXPIRED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: SETUP
    terminal_states: [ARCHIVED]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: POST /post-production/projects/{project_id}/activate
        actor: PostSupervisor
        preconditions:
          - "Project has at least one EditBay in status AVAILABLE"
          - "Project has at least one WatermarkProfile in status ACTIVE"
        side_effects:
          - "Project.version increments"
      - from: ACTIVE
        to: WRAPPING
        trigger: POST /post-production/projects/{project_id}/wrap
        actor: PostSupervisor
        preconditions:
          - "All Deliverables for the project are in {DELIVERED, REJECTED, SUPERSEDED}"
          - "All ReviewRounds with target_kind in {CUT, VENDOR_RETURN, DELIVERABLE} are in {APPROVED, REJECTED, VOID}; ReviewRounds with target_kind == DAILIES may still be OPEN (they will be voided by the cascade below)"
          - "open_change_list_count == 0"
        side_effects:
          - "All DailiesPackages in PUBLISHED transition to REVOKED (dailies window closes); each revoke in turn voids ReviewRounds targeting the package, which in turn voids their OPEN ReviewNotes"
      - from: WRAPPING
        to: CLOSED
        trigger: POST /post-production/projects/{project_id}/close
        actor: PostSupervisor
        preconditions:
          - "At least one ArchiveJob for the project is in SEALED state"
          - "No ArchiveJob is in {QUEUED, WRITING, VERIFYING}"
        side_effects:
          - "All EditBays in AVAILABLE transition to MAINTENANCE"
      - from: CLOSED
        to: ARCHIVED
        trigger: POST /post-production/projects/{project_id}/archive
        actor: PostSupervisor
        preconditions:
          - "Every ArchiveJob for the project is in {SEALED, CANCELLED}"
        side_effects:
          - "Project archived; all child lists remain readable"

  - entity: MediaBatch
    initial_state: DECLARED
    terminal_states: [READY, PURGED]
    transitions:
      - from: DECLARED
        to: INGESTING
        trigger: POST /post-production/projects/{project_id}/batches/{batch_id}/start-ingest
        actor: MediaManager
        preconditions:
          - "Project.status == ACTIVE"
          - "Current logical clock is within [ingest_window_start, ingest_window_end]"
        side_effects: []
      - from: INGESTING
        to: PROXYING
        trigger: POST /post-production/projects/{project_id}/batches/{batch_id}/finish-ingest
        actor: MediaManager
        preconditions:
          - "asset_count >= 1"
          - "failed_asset_count == 0"
        side_effects:
          - "Every MediaAsset in batch: proxy_status PENDING -> RUNNING"
      - from: PROXYING
        to: READY
        trigger: system (last MediaAsset in batch reaches proxy_status DONE)
        actor: system
        preconditions:
          - "All MediaAssets in batch have proxy_status == DONE"
        side_effects:
          - "Project.storage_used_gb recomputed"
      - from: INGESTING
        to: FAILED
        trigger: system (any MediaAsset in batch transitions to FAILED)
        actor: system
        preconditions: []
        side_effects:
          - "MediaManager alerted; batch must be re-declared"
      - from: PROXYING
        to: FAILED
        trigger: system (any MediaAsset proxy transitions to FAILED)
        actor: system
        preconditions: []
        side_effects: []
      - from: FAILED
        to: PURGED
        trigger: POST /post-production/projects/{project_id}/batches/{batch_id}/purge
        actor: MediaManager
        preconditions: []
        side_effects:
          - "All child MediaAssets transition to PURGED"
          - "Project.storage_used_gb recomputed"
      - from: READY
        to: PURGED
        trigger: POST /post-production/projects/{project_id}/batches/{batch_id}/purge
        actor: MediaManager
        preconditions:
          - "No DailiesPackage in PUBLISHED references this batch"
          - "No OPEN ChangeList entry references an asset in this batch"
        side_effects:
          - "All child MediaAssets transition to PURGED"
          - "Project.storage_used_gb recomputed"

  - entity: MediaAsset
    initial_state: INGESTED
    terminal_states: [LOCKED, PURGED]
    transitions:
      - from: INGESTED
        to: VERIFIED
        trigger: POST /post-production/projects/{project_id}/assets/{asset_id}/verify
        actor: MediaManager
        preconditions:
          - "proxy_status == DONE"
        side_effects: []
      - from: VERIFIED
        to: CONFORMED
        trigger: POST /post-production/projects/{project_id}/assets/{asset_id}/conform
        actor: ConformEditor
        preconditions:
          - "Project.status == ACTIVE"
          - "Asset is referenced by at least one TurnoverPackage in {STAGED, ISSUED} with turnover_kind == CONFORM"
        side_effects: []
      - from: CONFORMED
        to: LOCKED
        trigger: POST /post-production/projects/{project_id}/assets/{asset_id}/lock
        actor: ConformEditor
        preconditions:
          - "All ChangeLists referencing this asset are in {APPLIED, SUPERSEDED, REJECTED}"
        side_effects:
          - "Project.conform_ready recomputed"
      - from: INGESTED
        to: FAILED
        trigger: system (checksum mismatch during ingest)
        actor: system
        preconditions: []
        side_effects:
          - "Parent MediaBatch transitions to FAILED"
      - from: VERIFIED
        to: FAILED
        trigger: system (proxy render crash)
        actor: system
        preconditions: []
        side_effects:
          - "Parent MediaBatch transitions to FAILED"

  - entity: WatermarkProfile
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /post-production/projects/{project_id}/watermark-profiles/{profile_id}/activate
        actor: PostSupervisor
        preconditions:
          - "If Project.security_tier == LOCKDOWN then forensic_enabled must be true and opacity_pct >= 20"
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: POST /post-production/projects/{project_id}/watermark-profiles/{profile_id}/retire
        actor: PostSupervisor
        preconditions:
          - "No DailiesPackage in PUBLISHED references this profile"
        side_effects: []

  - entity: DailiesPackage
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: POST /post-production/projects/{project_id}/dailies/{package_id}/publish
        actor: DailiesCoordinator
        preconditions:
          - "Referenced MediaBatch.status == READY"
          - "Referenced WatermarkProfile.status == ACTIVE"
          - "Project.status == ACTIVE"
          - "distribution_list non-empty"
        side_effects:
          - "published_at set to current logical clock"
      - from: PUBLISHED
        to: REVOKED
        trigger: POST /post-production/projects/{project_id}/dailies/{package_id}/revoke OR system (Project WRAPPING)
        actor: DailiesCoordinator | system
        preconditions: []
        side_effects:
          - "revoked_at set"
          - "Any ReviewRound with target_ref_id == this package and status OPEN transitions to VOID"

  - entity: EditBay
    initial_state: AVAILABLE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: POST /post-production/projects/{project_id}/bays/{bay_id}/maintenance
        actor: PostSupervisor
        preconditions:
          - "No Booking for this bay with status in {RESERVED, CHECKED_IN} on or after today's logical date"
        side_effects: []
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: POST /post-production/projects/{project_id}/bays/{bay_id}/release
        actor: PostSupervisor
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: DECOMMISSIONED
        trigger: POST /post-production/projects/{project_id}/bays/{bay_id}/decommission
        actor: PostSupervisor
        preconditions:
          - "No Booking for this bay with status in {RESERVED, CHECKED_IN}"
        side_effects:
          - "All future RESERVED Bookings for this bay transition to CANCELLED"
      - from: MAINTENANCE
        to: DECOMMISSIONED
        trigger: POST /post-production/projects/{project_id}/bays/{bay_id}/decommission
        actor: PostSupervisor
        preconditions: []
        side_effects: []

  - entity: Booking
    initial_state: RESERVED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: POST /post-production/projects/{project_id}/bookings/{booking_id}/check-in
        actor: Artist
        preconditions:
          - "session_date == current logical date"
          - "Current logical hour >= start_hour and < end_hour"
          - "Booking.artist_email == X-User-ID (lowercase)"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: POST /post-production/projects/{project_id}/bookings/{booking_id}/complete
        actor: Artist
        preconditions:
          - "Booking.artist_email == X-User-ID"
        side_effects: []
      - from: RESERVED
        to: CANCELLED
        trigger: POST /post-production/projects/{project_id}/bookings/{booking_id}/cancel
        actor: PostSupervisor | Artist
        preconditions:
          - "If actor is Artist, Booking.artist_email == X-User-ID and session_date > current logical date"
        side_effects: []
      - from: RESERVED
        to: NO_SHOW
        trigger: system (logical clock reaches session_date at end_hour without CHECKED_IN)
        actor: system
        preconditions: []
        side_effects: []

  - entity: TurnoverPackage
    initial_state: DRAFT
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: DRAFT
        to: STAGED
        trigger: POST /post-production/projects/{project_id}/turnovers/{turnover_id}/stage
        actor: ConformEditor
        preconditions:
          - "Project.status == ACTIVE"
          - "turnover_kind == CONFORM requires at least one MediaAsset in {VERIFIED, CONFORMED}"
        side_effects: []
      - from: STAGED
        to: ISSUED
        trigger: POST /post-production/projects/{project_id}/turnovers/{turnover_id}/issue
        actor: PostSupervisor
        preconditions:
          - "A VendorBid for this turnover exists in status AWARDED"
          - "vendor_id == awarded bid's vendor_id"
          - "Awarded vendor.capacity_slots not exceeded by concurrent ISSUED turnovers"
        side_effects:
          - "issued_at set"
      - from: ISSUED
        to: ACKED
        trigger: POST /post-production/projects/{project_id}/turnovers/{turnover_id}/ack
        actor: VendorRep
        preconditions:
          - "VendorRep's vendor_id == TurnoverPackage.vendor_id"
        side_effects: []
      - from: ACKED
        to: RETURNED
        trigger: POST /post-production/projects/{project_id}/turnovers/{turnover_id}/return
        actor: VendorRep
        preconditions:
          - "No ChangeList on this turnover is in OPEN"
        side_effects:
          - "ReviewRound created automatically with target_kind == VENDOR_RETURN"
      - from: RETURNED
        to: CLOSED
        trigger: POST /post-production/projects/{project_id}/turnovers/{turnover_id}/close
        actor: PostSupervisor
        preconditions:
          - "Auto-created ReviewRound for this turnover is in {APPROVED, VOID}"
        side_effects:
          - "Vendor.capacity_slots released (slot freed)"
      - from: DRAFT
        to: VOID
        trigger: POST /post-production/projects/{project_id}/turnovers/{turnover_id}/void
        actor: PostSupervisor
        preconditions: []
        side_effects:
          - "All VendorBids in SUBMITTED transition to EXPIRED"
          - "AWARDED bid (if any) transitions to REJECTED and vendor slot released"

  - entity: ChangeList
    initial_state: OPEN
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: OPEN
        to: APPLIED
        trigger: POST /post-production/projects/{project_id}/change-lists/{change_list_id}/apply
        actor: ConformEditor
        preconditions:
          - "Parent TurnoverPackage.status in {ISSUED, ACKED}"
          - "Every entry.asset_id resolves to a MediaAsset in {VERIFIED, CONFORMED, LOCKED}"
        side_effects:
          - "For each entry with operation in {TRIM, DELETE}: MediaAsset.duration_frames adjusted by frames_delta (DELETE sets duration contribution to 0 within this turnover's scope)"
          - "Project.conform_ready recomputed"
          - "Any other ChangeList on the same turnover still in OPEN transitions to SUPERSEDED"
      - from: OPEN
        to: REJECTED
        trigger: POST /post-production/projects/{project_id}/change-lists/{change_list_id}/reject
        actor: ConformEditor
        preconditions: []
        side_effects: []
      - from: OPEN
        to: SUPERSEDED
        trigger: system (a newer ChangeList on the same turnover reaches APPLIED)
        actor: system
        preconditions: []
        side_effects:
          - "Project.open_change_list_count recomputed"

  - entity: ReviewRound
    initial_state: OPEN
    terminal_states: [APPROVED, REJECTED, VOID]
    transitions:
      - from: OPEN
        to: NOTES_CLOSED
        trigger: POST /post-production/projects/{project_id}/review-rounds/{round_id}/close-notes
        actor: ReviewerLead
        preconditions: []
        side_effects:
          - "unresolved_critical and open_note_count recomputed"
      - from: NOTES_CLOSED
        to: APPROVED
        trigger: POST /post-production/projects/{project_id}/review-rounds/{round_id}/approve
        actor: ReviewerLead
        preconditions:
          - "unresolved_critical == false"
          - "open_note_count == 0"
        side_effects:
          - "Project.conform_ready recomputed when target_kind in {CUT, DELIVERABLE}"
      - from: NOTES_CLOSED
        to: REJECTED
        trigger: POST /post-production/projects/{project_id}/review-rounds/{round_id}/reject
        actor: ReviewerLead
        preconditions: []
        side_effects:
          - "If target_kind == DELIVERABLE, linked Deliverable transitions to REJECTED"
      - from: OPEN
        to: VOID
        trigger: system (parent DailiesPackage revoked OR TurnoverPackage voided)
        actor: system
        preconditions: []
        side_effects: []

  - entity: ReviewNote
    initial_state: OPEN
    terminal_states: [RESOLVED, VOID]
    transitions:
      - from: OPEN
        to: ACKED
        trigger: POST /post-production/projects/{project_id}/review-notes/{note_id}/ack
        actor: ConformEditor
        preconditions:
          - "Parent ReviewRound.status == OPEN"
        side_effects: []
      - from: ACKED
        to: RESOLVED
        trigger: POST /post-production/projects/{project_id}/review-notes/{note_id}/resolve
        actor: ConformEditor
        preconditions:
          - "Parent ReviewRound.status in {OPEN, NOTES_CLOSED}"
        side_effects:
          - "Parent ReviewRound.unresolved_critical and open_note_count recomputed"
      - from: OPEN
        to: RESOLVED
        trigger: POST /post-production/projects/{project_id}/review-notes/{note_id}/resolve
        actor: ConformEditor
        preconditions:
          - "Parent ReviewRound.status in {OPEN, NOTES_CLOSED}"
        side_effects:
          - "Parent ReviewRound.unresolved_critical and open_note_count recomputed"
      - from: OPEN
        to: VOID
        trigger: system (parent ReviewRound transitions to VOID)
        actor: system
        preconditions: []
        side_effects: []

  - entity: Deliverable
    initial_state: SPEC_DRAFT
    terminal_states: [DELIVERED, SUPERSEDED]
    transitions:
      - from: SPEC_DRAFT
        to: RENDERING
        trigger: POST /post-production/projects/{project_id}/deliverables/{deliverable_id}/render
        actor: ConformEditor
        preconditions:
          - "Project.conform_ready == true"
        side_effects:
          - "render_progress_pct begins reporting 0"
      - from: RENDERING
        to: RENDERED
        trigger: POST /post-production/projects/{project_id}/deliverables/{deliverable_id}/render-complete
        actor: ConformEditor
        preconditions: []
        side_effects:
          - "render_progress_pct := 100"
      - from: RENDERED
        to: QC_QUEUED
        trigger: POST /post-production/projects/{project_id}/deliverables/{deliverable_id}/enqueue-qc
        actor: QCOperator
        preconditions:
          - "requires_qc == true"
        side_effects: []
      - from: QC_QUEUED
        to: QC_PASSED
        trigger: POST /post-production/projects/{project_id}/deliverables/{deliverable_id}/qc-reports (verdict == PASS)
        actor: QCOperator
        preconditions:
          - "Deliverable.status == QC_QUEUED"
        side_effects:
          - "QCReport appended with attempt_no = qc_attempt_count + 1"
      - from: QC_QUEUED
        to: QC_FAILED
        trigger: POST /post-production/projects/{project_id}/deliverables/{deliverable_id}/qc-reports (verdict == FAIL)
        actor: QCOperator
        preconditions:
          - "Deliverable.status == QC_QUEUED"
        side_effects:
          - "QCReport appended; if asset_id present, MediaAsset.qc_fail_count incremented"
      - from: QC_FAILED
        to: RENDERING
        trigger: POST /post-production/projects/{project_id}/deliverables/{deliverable_id}/render
        actor: ConformEditor
        preconditions:
          - "qc_attempt_count < 3"
        side_effects: []
      - from: QC_PASSED
        to: DELIVERED
        trigger: POST /post-production/projects/{project_id}/deliverables/{deliverable_id}/deliver
        actor: PostSupervisor
        preconditions:
          - "Project.status == ACTIVE"
        side_effects: []
      - from: RENDERED
        to: DELIVERED
        trigger: POST /post-production/projects/{project_id}/deliverables/{deliverable_id}/deliver
        actor: PostSupervisor
        preconditions:
          - "requires_qc == false"
        side_effects: []
      - from: QC_FAILED
        to: REJECTED
        trigger: POST /post-production/projects/{project_id}/deliverables/{deliverable_id}/reject
        actor: PostSupervisor
        preconditions:
          - "qc_attempt_count >= 3"
        side_effects:
          - "ReviewRound with target_ref_id == this deliverable transitions to REJECTED"
      - from: SPEC_DRAFT
        to: SUPERSEDED
        trigger: POST /post-production/projects/{project_id}/deliverables (creating a new Deliverable with same (sequence_label, spec_kind) supersedes this one)
        actor: ConformEditor
        preconditions: []
        side_effects: []
      - from: RENDERING
        to: SUPERSEDED
        trigger: system (newer Deliverable for same sequence_label + spec_kind created)
        actor: system
        preconditions: []
        side_effects: []

  - entity: ArchiveJob
    initial_state: QUEUED
    terminal_states: [SEALED, CANCELLED]
    transitions:
      - from: QUEUED
        to: WRITING
        trigger: POST /post-production/projects/{project_id}/archive-jobs/{job_id}/start
        actor: MediaManager
        preconditions:
          - "No other ArchiveJob for this project is in {WRITING, VERIFYING}"
        side_effects: []
      - from: WRITING
        to: VERIFYING
        trigger: POST /post-production/projects/{project_id}/archive-jobs/{job_id}/verify
        actor: MediaManager
        preconditions: []
        side_effects:
          - "bytes_written computed"
      - from: VERIFYING
        to: SEALED
        trigger: POST /post-production/projects/{project_id}/archive-jobs/{job_id}/seal
        actor: MediaManager
        preconditions:
          - "If target_scope == FULL_PROJECT then Project.status must be in {WRAPPING, CLOSED}"
        side_effects:
          - "sealed_at set"
          - "Each in-scope MediaAsset.retained_until := sealed_at + retention_years years"
      - from: WRITING
        to: FAILED
        trigger: system (LTO write error)
        actor: system
        preconditions: []
        side_effects: []
      - from: QUEUED
        to: CANCELLED
        trigger: POST /post-production/projects/{project_id}/archive-jobs/{job_id}/cancel
        actor: MediaManager
        preconditions: []
        side_effects: []
      - from: FAILED
        to: QUEUED
        trigger: POST /post-production/projects/{project_id}/archive-jobs/{job_id}/retry
        actor: MediaManager
        preconditions: []
        side_effects: []

  - entity: Vendor
    initial_state: ONBOARDED
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDED
        to: SUSPENDED
        trigger: POST /post-production/vendors/{vendor_id}/suspend
        actor: FacilityAdmin
        preconditions: []
        side_effects:
          - "All VendorBids by this vendor in SUBMITTED transition to EXPIRED"
      - from: SUSPENDED
        to: ONBOARDED
        trigger: POST /post-production/vendors/{vendor_id}/reinstate
        actor: FacilityAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: POST /post-production/vendors/{vendor_id}/offboard
        actor: FacilityAdmin
        preconditions:
          - "No TurnoverPackage references this vendor in {ISSUED, ACKED, RETURNED}"
        side_effects: []

  - entity: VendorBid
    initial_state: SUBMITTED
    terminal_states: [AWARDED, REJECTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: AWARDED
        trigger: POST /post-production/projects/{project_id}/vendor-bids/{bid_id}/award
        actor: PostSupervisor
        preconditions:
          - "Parent TurnoverPackage.status == STAGED"
          - "No other bid for this turnover is AWARDED"
          - "Vendor.status == ONBOARDED"
          - "Vendor.capabilities contains turnover_kind"
        side_effects:
          - "All other SUBMITTED bids for the same turnover transition to REJECTED"
          - "TurnoverPackage.vendor_id set to bid.vendor_id"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /post-production/projects/{project_id}/vendor-bids/{bid_id}/withdraw
        actor: VendorRep
        preconditions:
          - "VendorRep.vendor_id == bid.vendor_id"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: system (a competing bid on the same turnover is awarded)
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: EXPIRED
        trigger: system (parent TurnoverPackage voided OR vendor suspended)
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-bay
    parent_entity: EditBay
    write_endpoint: "POST /post-production/projects/{project_id}/bookings"
    occ_field: expected_bay_version
    description: |
      Creating a Booking against an EditBay whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just booked, checked in, or placed the bay in
      maintenance (all of which legitimately mutate EditBay.version) and the
      current writer's view of bay availability is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: change-list-apply-stale-turnover
    parent_entity: TurnoverPackage
    write_endpoint: "POST /post-production/projects/{project_id}/change-lists/{change_list_id}/apply"
    occ_field: expected_turnover_version
    description: |
      Applying a ChangeList against a TurnoverPackage whose version has
      advanced since the client last observed it is rejected. Another writer
      may have just applied a competing change list (which transitions this
      one to SUPERSEDED via the side-effect chain) or advanced the turnover;
      the current writer's view of the turnover is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: deliverable-render-stale-project
    parent_entity: Project
    write_endpoint: "POST /post-production/projects/{project_id}/deliverables/{deliverable_id}/render"
    occ_field: expected_project_version
    description: |
      Triggering a render against a Project whose version has advanced since
      the client last observed it is rejected. conform_ready is computed on
      the Project and flips as a side effect of asset locks, change-list
      applications, and review approvals; a render issued against a stale
      snapshot risks launching on a superseded readiness evaluation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: storage_used_gb
    trigger: "MediaAsset create/purge; proxy completion; batch purge"
    algorithm: aggregation
    formula: |
      storage_used_gb = round_half_up(
        sum( (asset.source_bytes + asset.proxy_bytes)
             for asset in MediaAsset
             where asset.project_id == project.id
               and asset.status != PURGED
        ) / (1024^3),
        3
      )
    input_set: "All MediaAssets for the project with status != PURGED"
    precision: "3 decimal places (GiB), round_half_up"
    variants:
      - name: provisional_storage
        when: "Computed during ingest before proxies finish (proxy_bytes still 0)"
        difference: "Uses source_bytes only; recomputed when each proxy completes"
      - name: final_storage
        when: "Computed after batch READY or after purge"
        difference: "Includes proxy_bytes for DONE assets"

  - name: proxy_progress_pct
    trigger: "Any MediaAsset in batch changes proxy_status"
    algorithm: aggregation
    formula: |
      proxy_progress_pct = floor(100 * done_count / max(1, asset_count))
      where done_count = count of assets with proxy_status == DONE in the batch
    input_set: "MediaAssets with batch_id == this batch"
    precision: "integer percent, floor"

  - name: change_list_net_delta
    trigger: "ChangeList creation"
    algorithm: aggregation
    formula: |
      net_frames_delta = sum(
        entry.frames_delta * (1 if entry.operation in {ADD, SLIP} else -1)
        for entry in entries
      )
    input_set: "ChangeList.entries as submitted"
    precision: "integer frames"

  - name: watermark_compliance_score
    trigger: "DailiesPackage publish"
    algorithm: weighted_scoring
    formula: |
      score = 0
      if profile.forensic_enabled: score += 50
      score += min(40, profile.opacity_pct // 2)   # 0..40 contribution
      if profile.includes_recipient_email: score += 10
      if profile.position == DIAGONAL_TILE: score += 10  # bonus, may push above 100
      score = min(score, 100)
    input_set: "WatermarkProfile fields at time of publish"
    precision: "integer, capped at 100"
    constants:
      MIN_SCORE_STANDARD: 40
      MIN_SCORE_ELEVATED: 60
      MIN_SCORE_LOCKDOWN: 90
    variants:
      - name: standard_gate
        when: "Project.security_tier == STANDARD"
        difference: "publish requires score >= 40"
      - name: elevated_gate
        when: "Project.security_tier == ELEVATED"
        difference: "publish requires score >= 60 AND includes_recipient_email == true"
      - name: lockdown_gate
        when: "Project.security_tier == LOCKDOWN"
        difference: "publish requires score >= 90 AND forensic_enabled == true"

  - name: vendor_load_factor
    trigger: "VendorBid award, TurnoverPackage close/void, Vendor suspend"
    algorithm: forward_looking
    formula: |
      load = count of TurnoverPackages with vendor_id == vendor.id
             and status in {ISSUED, ACKED}
      utilization_pct = floor(100 * load / vendor.capacity_slots)
    input_set: "TurnoverPackages per vendor"
    precision: "integer percent"
    variants:
      - name: provisional_load
        when: "Computed at bid-award evaluation time, before turnover issued"
        difference: "Counts only ISSUED turnovers (ACKED not yet visible)"
      - name: steady_load
        when: "Computed after turnover transitions to ACKED or CLOSED"
        difference: "Counts ISSUED and ACKED"

  - name: bay_utilization_hours
    trigger: "Booking create/cancel/check-in/complete/no-show"
    algorithm: chronological
    formula: |
      For a given (bay, session_date):
      booked = sum(booked_hours for Booking
                   where bay_id == bay
                     and session_date == date
                     and status in {RESERVED, CHECKED_IN, COMPLETED})
      utilization_pct = floor(100 * booked / bay.capacity_hours_per_day)
      Bookings processed in (session_date ASC, start_hour ASC, created_at ASC)
      when emitting per-day rollups.
    input_set: "Bookings for one bay on one date"
    precision: "integer percent"

  - name: qc_attempt_escalation
    trigger: "QCReport appended with verdict == FAIL"
    algorithm: threshold
    formula: |
      qc_attempt_count increments by 1 per report.
      If qc_attempt_count >= 3 and verdict == FAIL:
        Deliverable eligible for POST .../reject
      If qc_attempt_count < 3:
        Deliverable may transition QC_FAILED -> RENDERING
    input_set: "QCReport rows for one deliverable"
    precision: "integer attempts"
    constants:
      MAX_QC_ATTEMPTS: 3

  - name: retained_until_horizon
    trigger: "ArchiveJob seal"
    algorithm: chronological
    formula: |
      For each MediaAsset in job scope:
        retained_until = sealed_at + retention_years * 365 days
      Retention years are treated as fixed 365-day years; leap days are NOT
      added. sealed_at is taken from the logical clock at the moment of seal.
    input_set: "MediaAssets whose status != PURGED and whose batch is within job scope"
    precision: "ISO8601 datetime, UTC"

  - name: project_conform_ready
    trigger: "Asset lock, ChangeList apply/reject, ReviewRound approve/reject, TurnoverPackage issue"
    algorithm: constraint_propagation
    formula: |
      conform_ready = (
        count(MediaAsset where project_id == p.id and status not in {CONFORMED, LOCKED, PURGED}) == 0
        and count(ReviewRound where project_id == p.id and unresolved_critical == true) == 0
        and count(TurnoverPackage where project_id == p.id and status in {ISSUED, ACKED, RETURNED, CLOSED}) >= 1
      )
    input_set: "All assets, review rounds, and turnovers for the project"
    precision: "boolean"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-templated id resolves to an existing entity (left-to-right); FK fields in body resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body shape: required fields present, types match, enums valid, ranges respected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 5
    category: state
    check: "OCC expected_*_version matches parent's current version on OCC-guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST bookings, POST change-lists apply, POST deliverables render"

  - priority: 6
    category: state
    check: "Target resource is in the required from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: business_temporal
    check: "Ingest start must be inside batch ingest window; booking session_date/hours must be in the future or present day"
    error_id: ERR_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST batches start-ingest, POST bookings, POST bookings check-in"

  - priority: 8
    category: business_temporal
    check: "Booking hour interval [start_hour, end_hour) does not overlap any existing non-terminal Booking for the same bay on the same session_date (half-open: end_hour == other.start_hour is allowed)"
    error_id: ERR_BOOKING_OVERLAP
    http_status: 409
    applies_to: "POST bookings"

  - priority: 9
    category: business_referential
    check: "Referenced WatermarkProfile is ACTIVE and satisfies the project security_tier gate (watermark_compliance_score)"
    error_id: ERR_WATERMARK_NONCOMPLIANT
    http_status: 422
    applies_to: "POST dailies publish"

  - priority: 10
    category: business_referential
    check: "DailiesPackage.distribution_list emails unique and lowercase; batch referenced is READY"
    error_id: ERR_DISTRIBUTION_INVALID
    http_status: 422
    applies_to: "POST dailies publish"

  - priority: 11
    category: business_safety
    check: "MediaAsset composite uniqueness (project_id, reel_name, clip_name) among non-PURGED assets"
    error_id: ERR_DUPLICATE_ASSET
    http_status: 409
    applies_to: "POST assets"

  - priority: 12
    category: business_referential
    check: "VendorBid award: vendor capability covers turnover_kind and vendor.status == ONBOARDED"
    error_id: ERR_VENDOR_INELIGIBLE
    http_status: 422
    applies_to: "POST vendor-bids award"

  - priority: 13
    category: business_fiscal
    check: "Vendor load: concurrent ISSUED+ACKED turnovers for vendor < capacity_slots before issuing turnover"
    error_id: ERR_VENDOR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST turnovers issue"

  - priority: 14
    category: business_fiscal
    check: "Project storage_used_gb + incoming asset bytes does not exceed storage_quota_gb"
    error_id: ERR_STORAGE_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST assets"

  - priority: 15
    category: business_constraint
    check: "Deliverable reject requires qc_attempt_count >= MAX_QC_ATTEMPTS"
    error_id: ERR_QC_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST deliverables reject"

  - priority: 16
    category: business_constraint
    check: "Deliverable render-from-QC_FAILED requires qc_attempt_count < MAX_QC_ATTEMPTS"
    error_id: ERR_QC_ATTEMPTS_EXHAUSTED
    http_status: 422
    applies_to: "POST deliverables render"

  - priority: 17
    category: business_constraint
    check: "ChangeList apply requires every entry.asset_id resolve to a non-terminal MediaAsset"
    error_id: ERR_ASSET_NOT_CONFORMABLE
    http_status: 422
    applies_to: "POST change-lists apply"

  - priority: 18
    category: business_constraint
    check: "Booking check-in requires X-User-ID == artist_email (case-insensitive)"
    error_id: ERR_ARTIST_MISMATCH
    http_status: 403
    applies_to: "POST bookings check-in, POST bookings complete"

  - priority: 19
    category: business_constraint
    check: "EditBay decommission/maintenance requires no forward RESERVED or CHECKED_IN bookings"
    error_id: ERR_BAY_OCCUPIED
    http_status: 409
    applies_to: "POST bays maintenance, POST bays decommission"

  - priority: 20
    category: business_constraint
    check: "Project wrap/close/archive preconditions per state machine (deliverables terminal, review rounds closed, archive jobs sealed)"
    error_id: ERR_PROJECT_NOT_WRAPPABLE
    http_status: 422
    applies_to: "POST projects wrap, POST projects close, POST projects archive"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Project ---
  - method: POST
    path: "/post-production/projects"
    description: "Create a Project (starts in SETUP)"
    roles: [PostSupervisor]
    code: 201
    input: [title, client_code, fps, resolution_width, resolution_height, storage_quota_gb, security_tier]
    output: Project
    side_effects: ["status := SETUP; storage_used_gb := 0; open_change_list_count := 0; conform_ready := false"]

  - method: GET
    path: "/post-production/projects"
    description: "List projects with pagination + filters"
    roles: [PostSupervisor, MediaManager, ConformEditor, DailiesCoordinator, ReviewerLead, QCOperator, FacilityAdmin]
    code: 200
    input: ["status?", "security_tier?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}"
    description: "Get one project"
    roles: [PostSupervisor, MediaManager, ConformEditor, DailiesCoordinator, ReviewerLead, QCOperator, FacilityAdmin, VendorRep, Artist]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/activate"
    description: "SETUP -> ACTIVE"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: Project
    side_effects: ["Project.version increments"]

  - method: POST
    path: "/post-production/projects/{id}/wrap"
    description: "ACTIVE -> WRAPPING"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: Project
    side_effects: ["All PUBLISHED DailiesPackages -> REVOKED"]

  - method: POST
    path: "/post-production/projects/{id}/close"
    description: "WRAPPING -> CLOSED"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: Project
    side_effects: ["All AVAILABLE EditBays -> MAINTENANCE"]

  - method: POST
    path: "/post-production/projects/{id}/archive"
    description: "CLOSED -> ARCHIVED"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: Project
    side_effects: []

  # --- MediaBatch ---
  - method: POST
    path: "/post-production/projects/{id}/batches"
    description: "Declare a MediaBatch"
    roles: [MediaManager]
    code: 201
    input: [batch_label, ingest_window_start, ingest_window_end]
    output: MediaBatch
    side_effects: ["status := DECLARED"]

  - method: GET
    path: "/post-production/projects/{id}/batches"
    description: "List batches for project"
    roles: [PostSupervisor, MediaManager, ConformEditor, DailiesCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MediaBatch[]
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}/batches/{batch_id}"
    description: "Get one batch"
    roles: [PostSupervisor, MediaManager, ConformEditor, DailiesCoordinator]
    code: 200
    input: []
    output: MediaBatch
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/batches/{batch_id}/start-ingest"
    description: "DECLARED -> INGESTING"
    roles: [MediaManager]
    code: 200
    input: []
    output: MediaBatch
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/batches/{batch_id}/finish-ingest"
    description: "INGESTING -> PROXYING"
    roles: [MediaManager]
    code: 200
    input: []
    output: MediaBatch
    side_effects: ["Child MediaAssets proxy_status PENDING -> RUNNING"]

  - method: POST
    path: "/post-production/projects/{id}/batches/{batch_id}/purge"
    description: "FAILED or READY -> PURGED"
    roles: [MediaManager]
    code: 200
    input: []
    output: MediaBatch
    side_effects: ["Child MediaAssets -> PURGED", "Project.storage_used_gb recomputed"]

  # --- MediaAsset ---
  - method: POST
    path: "/post-production/projects/{id}/assets"
    description: "Register a MediaAsset into a batch"
    roles: [MediaManager]
    code: 201
    input: [batch_id, reel_name, clip_name, source_bytes, duration_frames]
    output: MediaAsset
    side_effects: ["status := INGESTED; proxy_status := PENDING; batch.asset_count recomputed", "Project.storage_used_gb recomputed"]

  - method: GET
    path: "/post-production/projects/{id}/assets"
    description: "List assets for project"
    roles: [PostSupervisor, MediaManager, ConformEditor, DailiesCoordinator, QCOperator]
    code: 200
    input: ["batch_id?", "status?", "proxy_status?", "limit?", "offset?"]
    output: MediaAsset[]
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}/assets/{asset_id}"
    description: "Get one asset"
    roles: [PostSupervisor, MediaManager, ConformEditor, DailiesCoordinator, QCOperator]
    code: 200
    input: []
    output: MediaAsset
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/assets/{asset_id}/proxy-complete"
    description: "Test-driving/system hook: mark proxy DONE and set proxy_bytes"
    roles: [MediaManager]
    code: 200
    input: [proxy_bytes]
    output: MediaAsset
    side_effects: ["proxy_status := DONE", "batch.proxy_progress_pct recomputed", "if last pending asset: batch -> READY"]

  - method: POST
    path: "/post-production/projects/{id}/assets/{asset_id}/verify"
    description: "INGESTED -> VERIFIED"
    roles: [MediaManager]
    code: 200
    input: []
    output: MediaAsset
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/assets/{asset_id}/conform"
    description: "VERIFIED -> CONFORMED"
    roles: [ConformEditor]
    code: 200
    input: []
    output: MediaAsset
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/assets/{asset_id}/lock"
    description: "CONFORMED -> LOCKED"
    roles: [ConformEditor]
    code: 200
    input: []
    output: MediaAsset
    side_effects: ["Project.conform_ready recomputed"]

  # --- WatermarkProfile ---
  - method: POST
    path: "/post-production/projects/{id}/watermark-profiles"
    description: "Create a WatermarkProfile (DRAFT)"
    roles: [PostSupervisor]
    code: 201
    input: [profile_name, opacity_pct, position, includes_recipient_email, forensic_enabled]
    output: WatermarkProfile
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}/watermark-profiles"
    description: "List watermark profiles"
    roles: [PostSupervisor, DailiesCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WatermarkProfile[]
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/watermark-profiles/{profile_id}/activate"
    description: "DRAFT -> ACTIVE"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: WatermarkProfile
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/watermark-profiles/{profile_id}/retire"
    description: "ACTIVE -> RETIRED"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: WatermarkProfile
    side_effects: []

  # --- DailiesPackage ---
  - method: POST
    path: "/post-production/projects/{id}/dailies"
    description: "Create a DailiesPackage (DRAFT)"
    roles: [DailiesCoordinator]
    code: 201
    input: [batch_id, watermark_profile_id, distribution_list]
    output: DailiesPackage
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}/dailies"
    description: "List dailies packages"
    roles: [PostSupervisor, DailiesCoordinator, ReviewerLead]
    code: 200
    input: ["batch_id?", "status?", "limit?", "offset?"]
    output: DailiesPackage[]
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}/dailies/{package_id}"
    description: "Get one dailies package"
    roles: [PostSupervisor, DailiesCoordinator, ReviewerLead]
    code: 200
    input: []
    output: DailiesPackage
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/dailies/{package_id}/publish"
    description: "DRAFT -> PUBLISHED"
    roles: [DailiesCoordinator]
    code: 200
    input: []
    output: DailiesPackage
    side_effects: ["published_at set", "watermark_compliance_score evaluated"]

  - method: POST
    path: "/post-production/projects/{id}/dailies/{package_id}/revoke"
    description: "PUBLISHED -> REVOKED"
    roles: [DailiesCoordinator]
    code: 200
    input: []
    output: DailiesPackage
    side_effects: ["revoked_at set", "OPEN ReviewRounds targeting this package -> VOID"]

  # --- EditBay ---
  - method: POST
    path: "/post-production/projects/{id}/bays"
    description: "Register an EditBay"
    roles: [PostSupervisor]
    code: 201
    input: [bay_name, bay_type, capacity_hours_per_day]
    output: EditBay
    side_effects: ["status := AVAILABLE"]

  - method: GET
    path: "/post-production/projects/{id}/bays"
    description: "List bays"
    roles: [PostSupervisor, ConformEditor, Artist]
    code: 200
    input: ["status?", "bay_type?", "limit?", "offset?"]
    output: EditBay[]
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/bays/{bay_id}/maintenance"
    description: "AVAILABLE -> MAINTENANCE"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: EditBay
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/bays/{bay_id}/release"
    description: "MAINTENANCE -> AVAILABLE"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: EditBay
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/bays/{bay_id}/decommission"
    description: "AVAILABLE|MAINTENANCE -> DECOMMISSIONED"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: EditBay
    side_effects: ["Future RESERVED bookings -> CANCELLED"]

  # --- Booking ---
  - method: POST
    path: "/post-production/projects/{id}/bookings"
    description: "Create a Booking (RESERVED); OCC-guarded on bay"
    roles: [PostSupervisor, Artist]
    code: 201
    input: [bay_id, artist_email, session_date, start_hour, end_hour, version_tag, expected_bay_version]
    output: Booking
    side_effects: ["EditBay.version increments by 1", "bay_utilization_hours recomputed for (bay, session_date)"]

  - method: GET
    path: "/post-production/projects/{id}/bookings"
    description: "List bookings"
    roles: [PostSupervisor, ConformEditor, Artist]
    code: 200
    input: ["bay_id?", "session_date?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}/bookings/{booking_id}"
    description: "Get one booking"
    roles: [PostSupervisor, ConformEditor, Artist]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/bookings/{booking_id}/check-in"
    description: "RESERVED -> CHECKED_IN"
    roles: [Artist]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/bookings/{booking_id}/complete"
    description: "CHECKED_IN -> COMPLETED"
    roles: [Artist]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/bookings/{booking_id}/cancel"
    description: "RESERVED -> CANCELLED"
    roles: [PostSupervisor, Artist]
    code: 200
    input: []
    output: Booking
    side_effects: ["bay_utilization_hours recomputed"]

  # --- TurnoverPackage ---
  - method: POST
    path: "/post-production/projects/{id}/turnovers"
    description: "Create a TurnoverPackage (DRAFT)"
    roles: [ConformEditor]
    code: 201
    input: [turnover_kind, sequence_label]
    output: TurnoverPackage
    side_effects: ["status := DRAFT"]

  - method: GET
    path: "/post-production/projects/{id}/turnovers"
    description: "List turnovers"
    roles: [PostSupervisor, ConformEditor, VendorRep, ReviewerLead]
    code: 200
    input: ["status?", "turnover_kind?", "vendor_id?", "limit?", "offset?"]
    output: TurnoverPackage[]
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}/turnovers/{turnover_id}"
    description: "Get one turnover"
    roles: [PostSupervisor, ConformEditor, VendorRep, ReviewerLead]
    code: 200
    input: []
    output: TurnoverPackage
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/turnovers/{turnover_id}/stage"
    description: "DRAFT -> STAGED"
    roles: [ConformEditor]
    code: 200
    input: []
    output: TurnoverPackage
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/turnovers/{turnover_id}/issue"
    description: "STAGED -> ISSUED"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: TurnoverPackage
    side_effects: ["issued_at set", "vendor_load_factor recomputed"]

  - method: POST
    path: "/post-production/projects/{id}/turnovers/{turnover_id}/ack"
    description: "ISSUED -> ACKED"
    roles: [VendorRep]
    code: 200
    input: []
    output: TurnoverPackage
    side_effects: ["vendor_load_factor recomputed"]

  - method: POST
    path: "/post-production/projects/{id}/turnovers/{turnover_id}/return"
    description: "ACKED -> RETURNED; auto-creates ReviewRound"
    roles: [VendorRep]
    code: 200
    input: []
    output: TurnoverPackage
    side_effects: ["ReviewRound created with target_kind == VENDOR_RETURN"]

  - method: POST
    path: "/post-production/projects/{id}/turnovers/{turnover_id}/close"
    description: "RETURNED -> CLOSED"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: TurnoverPackage
    side_effects: ["Vendor.capacity_slots slot released", "vendor_load_factor recomputed"]

  - method: POST
    path: "/post-production/projects/{id}/turnovers/{turnover_id}/void"
    description: "DRAFT -> VOID"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: TurnoverPackage
    side_effects: ["SUBMITTED VendorBids -> EXPIRED", "AWARDED bid -> REJECTED"]

  # --- ChangeList ---
  - method: POST
    path: "/post-production/projects/{id}/change-lists"
    description: "Create a ChangeList against a turnover"
    roles: [ConformEditor]
    code: 201
    input: [turnover_id, entries]
    output: ChangeList
    side_effects: ["revision := next per-turnover integer", "net_frames_delta computed", "Project.open_change_list_count recomputed"]

  - method: GET
    path: "/post-production/projects/{id}/change-lists"
    description: "List change lists"
    roles: [PostSupervisor, ConformEditor, VendorRep]
    code: 200
    input: ["turnover_id?", "status?", "limit?", "offset?"]
    output: ChangeList[]
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/change-lists/{change_list_id}/apply"
    description: "OPEN -> APPLIED; OCC-guarded on turnover"
    roles: [ConformEditor]
    code: 200
    input: [expected_turnover_version]
    output: ChangeList
    side_effects:
      - "Sibling OPEN ChangeLists on same turnover -> SUPERSEDED"
      - "MediaAsset duration_frames adjusted per entries"
      - "TurnoverPackage.version increments by 1"
      - "Project.conform_ready recomputed"

  - method: POST
    path: "/post-production/projects/{id}/change-lists/{change_list_id}/reject"
    description: "OPEN -> REJECTED"
    roles: [ConformEditor]
    code: 200
    input: []
    output: ChangeList
    side_effects: ["Project.open_change_list_count recomputed"]

  # --- ReviewRound ---
  - method: POST
    path: "/post-production/projects/{id}/review-rounds"
    description: "Open a ReviewRound (target must exist)"
    roles: [ReviewerLead]
    code: 201
    input: [round_label, target_kind, target_ref_id]
    output: ReviewRound
    side_effects: ["status := OPEN"]

  - method: GET
    path: "/post-production/projects/{id}/review-rounds"
    description: "List review rounds"
    roles: [PostSupervisor, ReviewerLead, ConformEditor, DailiesCoordinator]
    code: 200
    input: ["target_kind?", "status?", "limit?", "offset?"]
    output: ReviewRound[]
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}/review-rounds/{round_id}"
    description: "Get one review round"
    roles: [PostSupervisor, ReviewerLead, ConformEditor]
    code: 200
    input: []
    output: ReviewRound
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/review-rounds/{round_id}/close-notes"
    description: "OPEN -> NOTES_CLOSED"
    roles: [ReviewerLead]
    code: 200
    input: []
    output: ReviewRound
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/review-rounds/{round_id}/approve"
    description: "NOTES_CLOSED -> APPROVED"
    roles: [ReviewerLead]
    code: 200
    input: []
    output: ReviewRound
    side_effects: ["Project.conform_ready recomputed"]

  - method: POST
    path: "/post-production/projects/{id}/review-rounds/{round_id}/reject"
    description: "NOTES_CLOSED -> REJECTED"
    roles: [ReviewerLead]
    code: 200
    input: []
    output: ReviewRound
    side_effects: ["If target_kind == DELIVERABLE, linked Deliverable -> REJECTED"]

  # --- ReviewNote ---
  - method: POST
    path: "/post-production/projects/{id}/review-notes"
    description: "Add a ReviewNote to a round"
    roles: [ReviewerLead, ConformEditor, PostSupervisor]
    code: 201
    input: [round_id, author_email, severity, body]
    output: ReviewNote
    side_effects: ["Parent ReviewRound.unresolved_critical and open_note_count recomputed"]

  - method: GET
    path: "/post-production/projects/{id}/review-notes"
    description: "List review notes"
    roles: [PostSupervisor, ReviewerLead, ConformEditor]
    code: 200
    input: ["round_id?", "severity?", "status?", "limit?", "offset?"]
    output: ReviewNote[]
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/review-notes/{note_id}/ack"
    description: "OPEN -> ACKED"
    roles: [ConformEditor]
    code: 200
    input: []
    output: ReviewNote
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/review-notes/{note_id}/resolve"
    description: "OPEN|ACKED -> RESOLVED"
    roles: [ConformEditor]
    code: 200
    input: []
    output: ReviewNote
    side_effects: ["Parent ReviewRound.unresolved_critical and open_note_count recomputed"]

  # --- Deliverable ---
  - method: POST
    path: "/post-production/projects/{id}/deliverables"
    description: "Create a Deliverable (SPEC_DRAFT); supersedes prior with same (sequence_label, spec_kind)"
    roles: [ConformEditor]
    code: 201
    input: [spec_kind, sequence_label, container, requires_qc]
    output: Deliverable
    side_effects: ["Prior non-terminal Deliverable with same (sequence_label, spec_kind) -> SUPERSEDED"]

  - method: GET
    path: "/post-production/projects/{id}/deliverables"
    description: "List deliverables"
    roles: [PostSupervisor, ConformEditor, QCOperator]
    code: 200
    input: ["status?", "spec_kind?", "limit?", "offset?"]
    output: Deliverable[]
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}/deliverables/{deliverable_id}"
    description: "Get one deliverable"
    roles: [PostSupervisor, ConformEditor, QCOperator]
    code: 200
    input: []
    output: Deliverable
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/deliverables/{deliverable_id}/render"
    description: "SPEC_DRAFT or QC_FAILED -> RENDERING; OCC-guarded on project"
    roles: [ConformEditor]
    code: 200
    input: [expected_project_version]
    output: Deliverable
    side_effects: ["Project.version increments by 1"]

  - method: POST
    path: "/post-production/projects/{id}/deliverables/{deliverable_id}/render-complete"
    description: "RENDERING -> RENDERED"
    roles: [ConformEditor]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["render_progress_pct := 100"]

  - method: POST
    path: "/post-production/projects/{id}/deliverables/{deliverable_id}/enqueue-qc"
    description: "RENDERED -> QC_QUEUED"
    roles: [QCOperator]
    code: 200
    input: []
    output: Deliverable
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/deliverables/{deliverable_id}/qc-reports"
    description: "Append QCReport; PASS -> QC_PASSED; FAIL -> QC_FAILED"
    roles: [QCOperator]
    code: 201
    input: [verdict, "asset_id?", "fail_codes?"]
    output: QCReport
    side_effects:
      - "QCReport.attempt_no := deliverable.qc_attempt_count + 1"
      - "On PASS: Deliverable -> QC_PASSED"
      - "On FAIL: Deliverable -> QC_FAILED; if asset_id present, MediaAsset.qc_fail_count += 1"

  - method: POST
    path: "/post-production/projects/{id}/deliverables/{deliverable_id}/deliver"
    description: "QC_PASSED or (RENDERED & requires_qc == false) -> DELIVERED"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: Deliverable
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/deliverables/{deliverable_id}/reject"
    description: "QC_FAILED -> REJECTED; requires qc_attempt_count >= 3"
    roles: [PostSupervisor]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["ReviewRound targeting this deliverable -> REJECTED"]

  # --- QCReport read ---
  - method: GET
    path: "/post-production/projects/{id}/deliverables/{deliverable_id}/qc-reports"
    description: "List QC reports for a deliverable"
    roles: [PostSupervisor, ConformEditor, QCOperator]
    code: 200
    input: ["verdict?", "limit?", "offset?"]
    output: QCReport[]
    side_effects: []

  # --- ArchiveJob ---
  - method: POST
    path: "/post-production/projects/{id}/archive-jobs"
    description: "Create an ArchiveJob (QUEUED)"
    roles: [MediaManager]
    code: 201
    input: [lto_generation, target_scope, retention_years]
    output: ArchiveJob
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}/archive-jobs"
    description: "List archive jobs"
    roles: [PostSupervisor, MediaManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ArchiveJob[]
    side_effects: []

  - method: GET
    path: "/post-production/projects/{id}/archive-jobs/{job_id}"
    description: "Get one archive job"
    roles: [PostSupervisor, MediaManager]
    code: 200
    input: []
    output: ArchiveJob
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/archive-jobs/{job_id}/start"
    description: "QUEUED -> WRITING"
    roles: [MediaManager]
    code: 200
    input: []
    output: ArchiveJob
    side_effects: []

  - method: POST
    path: "/post-production/projects/{id}/archive-jobs/{job_id}/verify"
    description: "WRITING -> VERIFYING"
    roles: [MediaManager]
    code: 200
    input: []
    output: ArchiveJob
    side_effects: ["bytes_written computed"]

  - method: POST
    path: "/post-production/projects/{id}/archive-jobs/{job_id}/seal"
    description: "VERIFYING -> SEALED"
    roles: [MediaManager]
    code: 200
    input: []
    output: ArchiveJob
    side_effects: ["sealed_at set", "in-scope MediaAsset.retained_until := sealed_at + retention_years * 365d"]

  - method: POST
    path: "/post-production/projects/{id}/archive-jobs/{job_id}/cancel"
    description: "QUEUED -> CANCELLED"
    roles: [MediaManager]
    code: 200
    input: []
    output: ArchiveJob
