        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, response_envelope]
        distinguishing_aspect: "Immediate consistency: a mutation's effects are visible in the same request's response AND in the immediately following GET — no delayed reconciliation anywhere."
        test_recipe:
          setup: ["application UNDER_REVIEW with one rubric score"]
          setup_api_calls:
            - call: "POST /authorizer/applications"
              payload: { school_name: "Cons Academy", founding_group: "FG K1", cycle_year: 2027, proposed_grades: "K-8" }
              as: Applicant
              as_user_id: applicant_k1
              captures: { app_id: $.data.id }
