            - call: "POST /v1/pharmacy-sites"
              payload: { site_code: "SAC2", site_state: "CA", licensed_states: ["CA"], cold_pack_capacity_units: 60, csr_registered: true }
              as: ComplianceOfficer
              captures: { site_ep3: $.data.id }
            - call: "POST /v1/products"
              payload: { sku: "EPT-03", product_name: "Single shipment pack", medication_scope: "OTC", cold_pack_required: false, unit_dose_mg_per_kg: 0.02, pack_size_units: 10, unit_price_cents: 1000 }
              as: PlatformAdmin
              captures: { prod_ep3: $.data.id }
            - call: "POST /v1/pets"
              payload: { pet_name: "Poppy", species: "DOG", breed: "Dalmatian", weight_kg: 25.0, owner_state: "CA" }
              as: Customer
              captures: { pet_ep3: $.data.id }
            - call: "POST /v1/autoship-plans"
              payload: { pet_id: "${pet_ep3}" }
              as: Customer
              as_user_id: "${pet_ep3}"
              captures: { plan_ep3: $.data.id }
            - call: "POST /v1/autoship-plans/${plan_ep3}/items"
              payload: { product_id: "${prod_ep3}", cadence_days: 28, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_ep3}"
              captures: { item_ep3: $.data.id }
            - call: "GET /v1/autoship-plans/${plan_ep3}"
              payload: {}
              as: Customer
              as_user_id: "${pet_ep3}"
              captures: { plan_ep3_v: $.data.version }
            - call: "POST /v1/autoship-plans/${plan_ep3}/compose"
              payload: { expected_plan_version: "${plan_ep3_v}" }
              as: Customer
              as_user_id: "${pet_ep3}"
              captures: { order_ep3: $.data.id }
            - call: "POST /v1/shipments"
              payload: { order_id: "${order_ep3}" }
              as: PharmacyTechnician
              captures: { ship_ep3: $.data.id }
          trigger:
            - call: "POST /v1/shipments"
              payload: { order_id: "${order_ep3}" }
              as: PharmacyTechnician
              captures: { err_ep3: $.data.error_id }
          assert:
            - "the second creation is refused with error_id == ${err_ep3} == \"ERR_ORDER_ALREADY_SHIPPED\" and http status 409"
            - "GET /v1/orders/${order_ep3}/shipments still returns exactly 1 row, the original ${ship_ep3}"
            - "the original shipment is untouched: Shipment.${ship_ep3}.shipment_status is still PENDING"
            - "the reference is one-to-one rather than one-to-many, so the reverse list is length 0 or 1 by construction"

  # ===========================================================================
  - section: errors
    instances:

      - name: invalid_weights_are_refused_at_the_envelope_level
        claim_type: Violation to Error
        grounds:
          - errors.ERR_INVALID_REQUEST
          - validations[priority=12]
          - endpoints.POST_/v1/autoship-plans/{plan_id}/items
