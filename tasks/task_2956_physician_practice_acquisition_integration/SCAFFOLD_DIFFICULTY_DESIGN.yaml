          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status BOARD_REVIEW with one Physician and target_close_on 2026-11-01."
            - "One COMMERCIAL PayerContract in novation_status NOTICE_SENT with notice_days_required 0 and committee_slots_per_cycle 2."
            - "One CredentialingPackage in status SUBMITTED, committee_cycle_key 2026-08-15, projected_effective_on 2026-11-01."
