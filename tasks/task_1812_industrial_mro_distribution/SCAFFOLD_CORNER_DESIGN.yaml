          assert:
            - "err == ERR_FORBIDDEN_ROLE"

      - name: branch_manager_cannot_confirm_order_returns_forbidden
        claim_type: role_exclusive_denied
        grounds: [roles.BranchManager, roles.DistributionAdmin, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Order confirm is DistributionAdmin-exclusive; BranchManager (who owns mark-ready/mark-fulfilled) cannot confirm."
        test_recipe:
          setup: ["Customer, stocked item, SUBMITTED WILL_CALL order"]
          setup_api_calls:
            - call: "POST /mro/customers"
