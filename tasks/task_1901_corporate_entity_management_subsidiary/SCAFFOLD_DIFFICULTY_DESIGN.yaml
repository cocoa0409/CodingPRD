      - name: late_fee_component_rounding_order
        grounds:
          - calculations.late_filing_penalty
          - entities.AnnualFiling.fields.penalty_cents
        distinguishing_aspect: |
          Mode (b) combinatorial (distinct from mode (a) in
          franchise_tax_tiered_block_ceil): nested rounding order is pinned -
          each penalty component is rounded half-up to whole cents BEFORE
          summation. With tax 26000 and report fee 5000 at 4 days late the raw
          components are 38.48 and 8.20; the pinned order yields
