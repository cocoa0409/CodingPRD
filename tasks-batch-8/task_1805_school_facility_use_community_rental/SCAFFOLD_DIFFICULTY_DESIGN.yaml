          assert:
            - "RentalRequest.request_status == UNDER_REVIEW after two full cycles"
            - "RentalRequest.revision_round == 2 (increments on RESUBMITTED only, not on request_revision)"
            - "RentalRequest.submitted_at == 2026-08-10T00:00:00Z (original submission timestamp preserved through the loop)"
            - "RentalRequest.headcount_estimate == 120 (latest resubmission value)"
            - "A third cycle is legal; a fourth request_revision (revision_round == 3) is rejected with ERR_REVISION_LIMIT_EXCEEDED"

