            - "Settle as pm-001: HTTP 403 with error_id == ERR_SEGREGATION_OF_DUTIES and the production is still WRAPPED with settlement_total_cents == null"
            - "Settle as us-001: HTTP 200, status == SETTLED, labor_subtotal_cents == 208000, overrun_minutes == 0 (no weather hold, no extended play) so overrun_fee_cents == 0, settlement_total_cents == 208000, labor_variance_cents == 0 (208000 settled - 208000 provisional)"
            - "The CONFIRMED PRIMARY booking is RELEASED by settlement and its fiber path's committed_mbps_total is back to 0"
            - "Wrap again on the SETTLED production: HTTP 409 with error_id == ERR_PRODUCTION_STATE_INVALID - SETTLED is terminal and accepts no further trigger"

      - name: crew_member_cannot_read_a_production_but_can_read_its_own_calls
        claim_type: shared_operation_access
        grounds:
          - roles.CrewMember.shared_operations
          - roles.UnionSteward.shared_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The read surface is not uniform: every GET is open to the four operator roles, but CrewMember
          shares only the two crew-call reads. So the same GET /productions/{id} succeeds for a
          UnionSteward - a role with no operational authority at all - and is a 403 for a CrewMember,
          while GET /crew-calls/{id} succeeds for both.
        test_recipe:
          setup:
            - "One PLANNED production, one crew member, one OFFERED call to that member."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call1_id: $.data.id }
          trigger:
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: UnionSteward
              as_user_id: "us-001"
              captures: { seen_status: $.data.status }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: CrewMember
              as_user_id: "${cm1_id}"
              captures: { err: $.data.error_id }
            - call: "GET /broadcast-ops/crew-calls/${call1_id}"
              as: CrewMember
              as_user_id: "${cm1_id}"
              captures: { own_call: $.data.id }
          assert:
            - "UnionSteward read: HTTP 200 with status == PLANNED and the full readiness / ledger payload"
            - "CrewMember read of the production: HTTP 403 with error_id == ERR_UNAUTHORIZED"
            - "CrewMember read of the call: HTTP 200 with id == ${call1_id}, provisional_total_cents == 104000 and both cost variants present"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: truck_assignment_occ_token_must_match_the_current_production_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[truck-assignment-stale-production]
          - errors[ERR_STALE_PRODUCTION_VERSION]
        distinguishing_aspect: |
          The OCC token is the production's version, and the version advances on writes that the truck
          client never issued - here a crew-call creation. Replaying the version read before that call
          must be a 412 ERR_STALE_PRODUCTION_VERSION, and the refusal must be total: the second truck
          stays AVAILABLE, the first stays ASSIGNED and the version does not advance. Re-reading and
          retrying then performs the supersede, which is where the version increment is observable.
        test_recipe:
          setup:
            - "A TIER_3 production, two TIER_2 trucks and one certified staff member; truck A is assigned and a crew call has since bumped the version."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-A", tier_rating: "TIER_2", camera_channel_capacity: 8, power_draw_amps: 90, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_a: $.data.id }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-B", tier_rating: "TIER_2", camera_channel_capacity: 8, power_draw_amps: 90, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_b: $.data.id }
            - call: "POST /broadcast-ops/productions/${prod_id}/truck-assignment"
              payload: { truck_id: "${truck_a}", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv2: $.data.version }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", call_time_utc: "2026-08-15T14:00:00Z", scheduled_release_utc: "2026-08-16T00:00:00Z", expected_production_version: "${pv2}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { call1_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/productions/${prod_id}/truck-assignment"
              payload: { truck_id: "${truck_b}", expected_production_version: "${pv2}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err: $.data.error_id }
            - call: "GET /broadcast-ops/productions/${prod_id}"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv3: $.data.version }
            - call: "POST /broadcast-ops/productions/${prod_id}/truck-assignment"
              payload: { truck_id: "${truck_b}", expected_production_version: "${pv3}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv4: $.data.version, held: $.data.truck_id }
          assert:
            - "Stale token (${pv2}, the version before the crew call): HTTP 412 with error_id == ERR_STALE_PRODUCTION_VERSION"
            - "After the refusal: Production.${prod_id}.truck_id == ${truck_a}, ProductionTruck.${truck_b}.status == AVAILABLE, ProductionTruck.${truck_a}.status == ASSIGNED and version == ${pv3} (unchanged by the refusal)"
            - "Fresh token: HTTP 200 with truck_id == ${truck_b}, version == ${pv3} + 1"
            - "Supersede side effects: ProductionTruck.${truck_a}.status back to AVAILABLE (no other live production holds it) and ${truck_b}.status == ASSIGNED"
            - "${pv1} < ${pv2} < ${pv3} < ${pv4}: every accepted write advanced the version exactly once"

      - name: path_booking_occ_token_must_match_the_current_production_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[path-booking-create-stale-production]
          - errors[ERR_STALE_PRODUCTION_VERSION]
        distinguishing_aspect: |
          The second concurrency rule guards a creation rather than an action endpoint, and its 412
          must be decided before the capacity ledger is touched: after the refusal the transmission
          path's committed_mbps_total and active_booking_count must both still be zero, which is the
          only way to tell a pre-validation OCC check from one that reserves first and rolls back.
        test_recipe:
          setup:
            - "A TIER_3 production whose version has been advanced by a truck assignment, and one PRIMARY_ELIGIBLE fiber circuit."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-A", tier_rating: "TIER_2", camera_channel_capacity: 8, power_draw_amps: 90, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_a: $.data.id }
            - call: "POST /broadcast-ops/productions/${prod_id}/truck-assignment"
              payload: { truck_id: "${truck_a}", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pv2: $.data.version }
            - call: "POST /broadcast-ops/transmission-paths"
              payload: { path_code: "FIB-1", path_type: "FIBER", carrier_code: "NORTHNET", capacity_mbps: 600, redundancy_class: "PRIMARY_ELIGIBLE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { path_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_id}", path_id: "${path_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T17:00:00Z", window_end_utc: "2026-08-15T23:00:00Z", requested_mbps: 200, expected_production_version: "${pv1}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_id}", path_id: "${path_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T17:00:00Z", window_end_utc: "2026-08-15T23:00:00Z", requested_mbps: 200, expected_production_version: "${pv2}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { booking_id: $.data.id, bstat: $.data.status }
          assert:
            - "Stale token ${pv1}: HTTP 412 with error_id == ERR_STALE_PRODUCTION_VERSION"
            - "After the refusal: TransmissionPath.${path_id}.committed_mbps_total == 0 and active_booking_count == 0; the path-bookings listing for the production is empty"
            - "Fresh token ${pv2}: HTTP 201 with status == RESERVED, and TransmissionPath.${path_id}.committed_mbps_total == 200 with active_booking_count == 1"
            - "Production.${prod_id}.readiness_score_preflight == 25.00 (the RESERVED PRIMARY earns the transmission weight in the forward-looking variant) while readiness_score_certified == 0.00 (the booking is not CONFIRMED), and the stage is still PLANNED - no approved survey"

      - name: crew_call_occ_outranks_the_budget_check
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[crew-call-create-stale-production]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_production_version_outranks_labor_budget_exceeded
          rationale: "That instance sends a crew-call creation that is both stale and over budget and asserts the 412 ERR_STALE_PRODUCTION_VERSION, then retries with the fresh version to get the 422 - covering the third concurrency rule's stale path, its success path and the version increment."

      - name: feed_suspension_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /broadcast-ops/data-feeds/{id}/suspend].side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / feed_suspension_cascades_prep_then_production_then_rehearsal_and_show_hold
          rationale: "That instance verifies the full four-level chain from one suspend call - prep reverted, consumer count decremented, production demoted, SCHEDULED rehearsal aborted and PRE_SHOW show held - plus the ordering evidence that the show hold is set only because the production was demoted."

      - name: crew_call_cost_variants_both_appear_on_the_row
        claim_type: dual_variant_calculation
        grounds:
          - calculations.crew_call_labor_cost.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / crew_call_provisional_versus_settled_labor_cost_diverge
          rationale: "That instance pins both variants on one call from the same inputs and asserts the delta the release applies to the production's labor ledger, which is this layer's whole claim."

      - name: production_ledger_reconciles_after_every_source_change
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Production.fields.labor_committed_cents
          - entities.Production.fields.readiness_score_certified
        excluded_because:
          difficulty_instance: compensating_invariant / crew_call_cancellation_restores_labor_budget_exactly
          rationale: "Reconciliation after create, after the settled-variant switch and after removal of a source row is covered by that instance together with accepted_crew_call_cancellation_cascades_to_stage_demotion_then_show_hold and path_booking_release_restores_committed_bandwidth_exactly."

      - name: cumulative_technical_downtime_forces_the_show_off_air_at_the_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.ShowExecution.air_status.system_forced_OFF_AIR
          - entities.ShowExecution.fields.technical_downtime_minutes
        distinguishing_aspect: |
          The only cumulative threshold in the scaffold: technical downtime accumulates across
          incidents and crosses MAX_TECHNICAL_DOWNTIME_MINUTES (20) exactly on the third one, at which
          point the system - not the operator - drives the air dimension to OFF_AIR. Weather-hold
          minutes must not contribute to that accumulator (they feed the settlement fee base instead),
          the boundary is >= rather than >, off_air_at_utc is stamped from the logical clock rather than
          from the incident's started_at_utc, and OFF_AIR then locks the dimension while
