# =============================================================================
# Task 902 — Cardiac & Pulmonary Rehab Program : seed tables (SCAFFOLD.yaml)
# §1.0–§1.7. (§1.8 → SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 → SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  902. Cardiac & Pulmonary Rehab Program: physician referral & risk
  stratification, phase (I–III) & 36-session authorization cap,
  monitored-exercise & vitals, education & goal, insurance visit-limit &
  billing, missed-session & completion, outcome (6MWT) & discharge,
  maintenance program

domain_name: cardiac-pulmonary-rehab
api_prefix: /rehab

complexity_profile:
  primary_archetype: quota_allocation           # finite pools: 36-session cap + insurance visit-limit
  secondary_archetype: ledger_reconciliation     # provisional vs adjudicated billing
  complexity_layers:
    - optimistic_concurrency                      # OCC on RehabProgram.version for session create
    - dual_variant_calculation                    # estimated vs adjudicated; provisional vs verified 6MWT
    - cascading_side_effects                       # adverse vitals → hold → cancel scheduled
    - rate_threshold_triggers                      # 36-session cap, visit-limit, consecutive-missed, SpO2/RPE

  entity_topology: flat                            # peer entities under one prefix, FK references in body
  state_machine_shape: cyclic                      # session reschedule loop, claim denial→resubmit loop, program hold↔active
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                           # physician / coordinator / clinician / billing own distinct surfaces
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number (unique per patient)" }
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD)" }

  - name: Physician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Referring physician name" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier" }
      - { name: specialty, type: string, source: input, required: false, description: "Optional specialty label" }

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Exercise physiologist / rehab clinician name" }
      - { name: credential, type: enum, source: input, description: "RN | RRT | EP (exercise physiologist)" }

  - name: MonitoringStation
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Station label, e.g. Treadmill-1" }
      - { name: station_type, type: enum, source: input, description: "TELEMETRY | STANDARD" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: physician_id, type: string, source: input, description: "FK -> Physician.id; must equal X-User-ID for ReferringPhysician" }
      - { name: program_type, type: enum, source: input, description: "CARDIAC | PULMONARY" }
      - { name: indication, type: string, source: input, description: "Diagnosis / indication text" }
      - { name: risk_stratification, type: enum, source: input, description: "LOW | MODERATE | HIGH (AACVPR-style tier assigned by referring physician)" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACCEPTED / DECLINED", default: PENDING }

  - name: RehabProgram
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id (copied from referral)" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id (must be ACCEPTED)" }
      - { name: program_type, type: enum, source: system, description: "CARDIAC | PULMONARY (copied from referral)" }
      - { name: risk_stratification, type: enum, source: system, description: "LOW | MODERATE | HIGH (copied from referral; drives billing multiplier and telemetry requirement)" }
      - { name: current_phase, type: enum, source: input, default: PHASE_I, description: "PHASE_I | PHASE_II | PHASE_III (updatable by coordinator; PHASE_I=inpatient, II=outpatient monitored, III=maintenance-track)" }
      - { name: authorized_session_cap, type: integer, source: input, default: 36, description: "Program-level session authorization cap (defaults to 36 per SESSION_CAP; may be set lower at creation for shorter authorizations)" }
      - { name: sessions_used, type: integer, source: computed, default: 0, description: "count of RehabSession with status==COMPLETED for this program" }
      - { name: sessions_scheduled, type: integer, source: computed, default: 0, description: "count of RehabSession with status==SCHEDULED for this program" }
      - { name: sessions_remaining_authorized, type: integer, source: computed, description: "= authorized_session_cap - sessions_used (chronological / completed-only)" }
      - { name: consecutive_missed_count, type: integer, source: computed, default: 0, description: "running count of consecutive MISSED sessions; reset to 0 on any COMPLETED session" }
      - { name: total_billed_cents, type: integer, source: computed, default: 0, description: "sum of billed_amount_cents over non-VOID BillingClaim" }
      - { name: total_reimbursed_cents, type: integer, source: computed, default: 0, description: "sum of reimbursement over non-VOID claims (adjudicated if PAID, else estimated on SUBMITTED)" }
      - { name: total_patient_responsibility_cents, type: integer, source: computed, default: 0, description: "sum of patient responsibility over non-VOID claims" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "sum of patient_responsibility_cents over DENIED claims (unrecovered from payer)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE <-> ON_HOLD -> COMPLETION_PENDING? ; terminal DISCHARGED / WITHDRAWN", default: DRAFT }

  - name: InsuranceAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> RehabProgram.id" }
      - { name: payer_name, type: string, source: input, description: "Insurance payer name" }
      - { name: authorized_visits, type: integer, source: input, description: "Payer-authorized visit-limit (billable sessions); positive integer" }
      - { name: allowed_amount_cents, type: integer, source: input, description: "Payer allowed amount per visit (cents) used for estimated reimbursement" }
      - { name: copay_cents, type: integer, source: input, description: "Per-visit patient copay in cents" }
      - { name: visits_billed, type: integer, source: computed, default: 0, description: "count of non-VOID BillingClaim against this authorization" }
      - { name: status, type: enum, source: system, description: "PENDING -> APPROVED -> EXHAUSTED", default: PENDING }

  - name: RehabSession
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> RehabProgram.id" }
      - { name: clinician_id, type: string, source: input, description: "FK -> Clinician.id (supervising clinician)" }
      - { name: station_id, type: string, source: input, description: "FK -> MonitoringStation.id (occupied exercise station)" }
      - { name: session_type, type: enum, source: input, description: "MONITORED_EXERCISE | EDUCATION | ASSESSMENT" }
      - { name: phase, type: enum, source: input, description: "PHASE_I | PHASE_II | PHASE_III (session's phase label)" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC start of the session interval" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC end (must be strictly after scheduled_start)" }
      - { name: pre_hr, type: integer, source: input, required: false, description: "Pre-exercise heart rate (bpm); recorded at complete" }
      - { name: post_hr, type: integer, source: input, required: false, description: "Post-exercise heart rate (bpm); recorded at complete" }
      - { name: post_spo2, type: integer, source: input, required: false, description: "Post-exercise SpO2 %; recorded at complete" }
      - { name: rpe, type: integer, source: input, required: false, description: "Borg RPE 6-20; recorded at complete" }
      - { name: exercise_minutes, type: integer, source: input, required: false, description: "Monitored exercise minutes; recorded at complete" }
      - { name: adverse_event, type: boolean, source: computed, default: false, description: "true when post_spo2 < SPO2_MIN_THRESHOLD or rpe >= RPE_MAX_THRESHOLD at completion" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED / MISSED / CANCELLED ; MISSED -> SCHEDULED (reschedule) ; COMPLETED -> VOIDED", default: SCHEDULED }

  - name: CarePlanItem
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> RehabProgram.id" }
      - { name: item_type, type: enum, source: input, description: "EDUCATION_MODULE | GOAL" }
      - { name: title, type: string, source: input, description: "Education topic or goal statement" }
      - { name: target_description, type: string, source: input, required: false, description: "Optional measurable target for a GOAL item" }
      - { name: status, type: enum, source: system, description: "OPEN -> ACHIEVED / NOT_ACHIEVED / WAIVED", default: OPEN }

  - name: OutcomeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> RehabProgram.id" }
      - { name: assessment_type, type: enum, source: input, default: SIX_MINUTE_WALK, description: "SIX_MINUTE_WALK (6MWT)" }
      - { name: timing, type: enum, source: input, description: "BASELINE | DISCHARGE" }
      - { name: distance_meters, type: integer, source: input, description: "6MWT distance in meters (draft value; may be corrected at finalize)" }
      - { name: improvement_meters, type: integer, source: computed, description: "DISCHARGE only: distance_meters - matching BASELINE distance_meters" }
      - { name: improvement_pct, type: number, source: computed, description: "DISCHARGE only: round_half_up((discharge-baseline)/baseline*100, 1)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> FINALIZED", default: DRAFT }

  - name: BillingClaim
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> RehabProgram.id" }
      - { name: session_id, type: string, source: input, description: "FK -> RehabSession.id (must be COMPLETED)" }
      - { name: authorization_id, type: string, source: input, description: "FK -> InsuranceAuthorization.id (must be APPROVED, same program)" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "session billed amount per session_billed_amount calc, frozen at claim create" }
      - { name: estimated_reimbursement_cents, type: integer, source: computed, description: "= max(0, min(billed_amount_cents, allowed_amount_cents) - copay_cents), frozen at create" }
      - { name: estimated_patient_responsibility_cents, type: integer, source: computed, description: "= billed_amount_cents - estimated_reimbursement_cents, frozen at create" }
      - { name: adjudicated_reimbursement_cents, type: integer, source: computed, required: false, description: "set at adjudicate PAID = max(0, adjudicated_allowed_cents - copay_cents)" }
      - { name: patient_responsibility_cents, type: integer, source: computed, description: "SUBMITTED/DRAFT: mirrors estimated; PAID: billed - adjudicated_reimbursement; DENIED: full billed_amount_cents" }
      - { name: denial_reason, type: string, source: input, required: false, description: "provided at adjudicate when outcome==DENIED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> PAID / DENIED ; DENIED -> SUBMITTED (resubmit) ; any non-terminal-of-payer -> VOID", default: DRAFT }

  - name: MaintenanceProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> RehabProgram.id (source discharged program)" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id (copied)" }
      - { name: tier, type: enum, source: system, default: STANDARD, description: "STANDARD | INTENSIVE (INTENSIVE when discharge 6MWT improvement_pct < MAINTENANCE_INTENSIVE_THRESHOLD_PCT)" }
      - { name: monthly_visit_allowance, type: integer, source: system, description: "monthly maintenance visits by tier (STANDARD=4, INTENSIVE=8)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> CANCELLED", default: ACTIVE }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Referral
    initial_state: PENDING
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /rehab/referrals/{referralId}/decision (decision=ACCEPT)"
        actor: RehabCoordinator
        preconditions:
          - "Referral must be PENDING (ERR_REFERRAL_NOT_PENDING)"
        side_effects: []
      - from: PENDING
        to: DECLINED
        trigger: "POST /rehab/referrals/{referralId}/decision (decision=DECLINE)"
        actor: RehabCoordinator
        preconditions:
          - "Referral must be PENDING (ERR_REFERRAL_NOT_PENDING)"
        side_effects: []

  - entity: InsuranceAuthorization
    initial_state: PENDING
    terminal_states: [EXHAUSTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /rehab/authorizations/{authorizationId}/approve"
        actor: RehabCoordinator
        preconditions:
          - "Authorization must be PENDING (ERR_AUTHORIZATION_NOT_PENDING)"
        side_effects: []
      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (automatic when visits_billed reaches authorized_visits)"
        actor: system
        preconditions:
          - "Authorization is APPROVED and visits_billed == authorized_visits"
        side_effects: []

  - entity: RehabProgram
    initial_state: DRAFT
    terminal_states: [DISCHARGED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rehab/programs/{programId}/activate"
        actor: RehabCoordinator
        preconditions:
          - "Program must be DRAFT (ERR_PROGRAM_NOT_DRAFT)"
          - "At least one APPROVED InsuranceAuthorization exists for the program (ERR_NO_APPROVED_AUTHORIZATION) — cross-entity dep (Program -> InsuranceAuthorization)"
          - "At least one FINALIZED BASELINE OutcomeAssessment exists for the program (ERR_BASELINE_OUTCOME_REQUIRED)"
        side_effects: []
      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /rehab/programs/{programId}/hold ; OR system (adverse_event at session complete) ; OR system (consecutive_missed_count reaches MAX_CONSECUTIVE_MISSED)"
        actor: RehabCoordinator | RehabClinician | system
        preconditions:
          - "Program must be ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
        side_effects:
          - "All RehabSession of this program with status==SCHEDULED are transitioned to CANCELLED (cascade; each release its station/clinician interval)"
      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /rehab/programs/{programId}/resume"
        actor: RehabCoordinator
        preconditions:
          - "Program must be ON_HOLD (ERR_PROGRAM_NOT_ON_HOLD)"
        side_effects:
          - "consecutive_missed_count reset to 0"
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /rehab/programs/{programId}/discharge"
        actor: RehabCoordinator
        preconditions:
          - "Program must be ACTIVE (ERR_PROGRAM_NOT_ACTIVE)"
          - "No RehabSession of this program in status==SCHEDULED (ERR_ACTIVE_SESSIONS_EXIST)"
          - "At least one FINALIZED DISCHARGE OutcomeAssessment exists for the program (ERR_NO_FINALIZED_DISCHARGE_OUTCOME) — cross-entity dep (Program -> OutcomeAssessment)"
        side_effects:
          - "Create MaintenanceProgram in ACTIVE (tier from discharge 6MWT improvement_pct; monthly_visit_allowance by tier)"
          - "All OPEN CarePlanItem of GOAL type transitioned to NOT_ACHIEVED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /rehab/programs/{programId}/withdraw"
        actor: RehabCoordinator
        preconditions:
          - "Program must be DRAFT, ACTIVE, or ON_HOLD (ERR_PROGRAM_ALREADY_TERMINAL)"
        side_effects:
          - "All RehabSession of this program in SCHEDULED transitioned to CANCELLED"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /rehab/programs/{programId}/withdraw"
        actor: RehabCoordinator
        preconditions:
          - "Program must be DRAFT, ACTIVE, or ON_HOLD (ERR_PROGRAM_ALREADY_TERMINAL)"
        side_effects:
          - "All RehabSession of this program in SCHEDULED transitioned to CANCELLED"
      - from: ON_HOLD
        to: WITHDRAWN
        trigger: "POST /rehab/programs/{programId}/withdraw"
        actor: RehabCoordinator
        preconditions:
          - "Program must be DRAFT, ACTIVE, or ON_HOLD (ERR_PROGRAM_ALREADY_TERMINAL)"
        side_effects:
          - "All RehabSession of this program in SCHEDULED transitioned to CANCELLED"

  - entity: RehabSession
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /rehab/sessions/{sessionId}/complete"
        actor: RehabClinician
        preconditions:
          - "Session must be SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
          - "Parent program must be ACTIVE (ERR_PROGRAM_NOT_ACTIVE) — cross-entity dep (RehabSession -> RehabProgram)"
        side_effects:
          - "Compute adverse_event from post_spo2/rpe (adverse_vitals_check)"
          - "program.sessions_used += 1 ; program.consecutive_missed_count reset to 0 ; program.version += 1"
          - "If adverse_event: program transitions ACTIVE -> ON_HOLD (which cascades: cancel remaining SCHEDULED sessions)"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /rehab/sessions/{sessionId}/mark-missed"
        actor: RehabClinician
        preconditions:
          - "Session must be SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
        side_effects:
          - "program.consecutive_missed_count += 1 ; program.version += 1"
          - "If consecutive_missed_count reaches MAX_CONSECUTIVE_MISSED and program is ACTIVE: program -> ON_HOLD (cascade cancels remaining SCHEDULED sessions)"
      - from: MISSED
        to: SCHEDULED
        trigger: "POST /rehab/sessions/{sessionId}/reschedule"
        actor: RehabCoordinator
        preconditions:
          - "Session must be MISSED (ERR_SESSION_NOT_MISSED)"
          - "New interval must not overlap another SCHEDULED session on the same station (ERR_STATION_OVERLAP)"
          - "New interval must respect clinician turnover buffer (ERR_CLINICIAN_UNAVAILABLE)"
        side_effects:
          - "scheduled_start / scheduled_end updated to new interval"
        note: "Cyclic edge MISSED -> SCHEDULED (rescheduling loop)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /rehab/sessions/{sessionId}/cancel ; OR system (program enters ON_HOLD/WITHDRAWN)"
        actor: RehabCoordinator | system
        preconditions:
          - "Session must be SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
        side_effects: []
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /rehab/sessions/{sessionId}/void"
        actor: RehabCoordinator
        preconditions:
          - "Session must be COMPLETED (ERR_SESSION_NOT_COMPLETED)"
          - "No non-VOID BillingClaim references this session (ERR_SESSION_HAS_ACTIVE_CLAIM)"
        side_effects:
          - "program.sessions_used -= 1 ; program.version += 1 (compensates the complete side effect; conserves authorized_session_cap = sessions_used + sessions_remaining_authorized)"

  - entity: OutcomeAssessment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /rehab/outcomes/{outcomeId}/finalize"
        actor: RehabClinician
        preconditions:
          - "Assessment must be DRAFT (ERR_OUTCOME_NOT_DRAFT)"
          - "For DISCHARGE timing: a FINALIZED BASELINE OutcomeAssessment must exist for the program (ERR_BASELINE_OUTCOME_REQUIRED)"
        side_effects:
          - "distance_meters optionally corrected from finalize payload (final_distance_meters)"
          - "For DISCHARGE: improvement_meters and improvement_pct recomputed against FINALIZED BASELINE (verified variant)"

  - entity: CarePlanItem
    initial_state: OPEN
    terminal_states: [ACHIEVED, NOT_ACHIEVED, WAIVED]
    transitions:
      - from: OPEN
        to: ACHIEVED
        trigger: "POST /rehab/care-plan-items/{itemId}/resolve (resolution=ACHIEVED)"
        actor: RehabClinician
        preconditions:
          - "Item must be OPEN (ERR_CARE_ITEM_NOT_OPEN)"
        side_effects: []
      - from: OPEN
        to: NOT_ACHIEVED
        trigger: "POST /rehab/care-plan-items/{itemId}/resolve (resolution=NOT_ACHIEVED) ; OR system (GOAL items on program discharge)"
        actor: RehabClinician | system
        preconditions:
          - "Item must be OPEN (ERR_CARE_ITEM_NOT_OPEN)"
        side_effects: []
      - from: OPEN
        to: WAIVED
        trigger: "POST /rehab/care-plan-items/{itemId}/resolve (resolution=WAIVED)"
        actor: RehabClinician
        preconditions:
          - "Item must be OPEN (ERR_CARE_ITEM_NOT_OPEN)"
        side_effects: []

  - entity: BillingClaim
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rehab/claims/{claimId}/submit"
        actor: BillingSpecialist
        preconditions:
          - "Claim must be DRAFT (ERR_CLAIM_NOT_SUBMITTABLE)"
        side_effects:
          - "program.total_reimbursed_cents / total_patient_responsibility_cents recomputed"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /rehab/claims/{claimId}/adjudicate (outcome=PAID)"
        actor: BillingSpecialist
        preconditions:
          - "Claim must be SUBMITTED (ERR_CLAIM_NOT_ADJUDICABLE)"
        side_effects:
          - "adjudicated_reimbursement_cents = max(0, adjudicated_allowed_cents - copay_cents) ; patient_responsibility_cents = billed_amount_cents - adjudicated_reimbursement_cents"
          - "program billing totals recomputed"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /rehab/claims/{claimId}/adjudicate (outcome=DENIED)"
        actor: BillingSpecialist
        preconditions:
          - "Claim must be SUBMITTED (ERR_CLAIM_NOT_ADJUDICABLE)"
        side_effects:
          - "patient_responsibility_cents = billed_amount_cents ; denial_reason recorded"
          - "program.outstanding_balance_cents += billed_amount_cents (cascade: claim denial -> program balance)"
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /rehab/claims/{claimId}/resubmit"
        actor: BillingSpecialist
        preconditions:
          - "Claim must be DENIED (ERR_CLAIM_NOT_DENIED)"
        side_effects:
          - "program.outstanding_balance_cents -= billed_amount_cents (reverses the denial balance add)"
        note: "Cyclic edge DENIED -> SUBMITTED (denial/resubmit loop)"
      - from: SUBMITTED
        to: VOID
        trigger: "POST /rehab/claims/{claimId}/void"
        actor: BillingSpecialist
        preconditions:
          - "Claim must be DRAFT, SUBMITTED, or DENIED (ERR_CLAIM_NOT_VOIDABLE)"
        side_effects:
          - "authorization.visits_billed -= 1 ; program billing totals recomputed (conserves money identity: total_billed == total_reimbursed + total_patient_responsibility over non-VOID claims)"
          - "If claim was DENIED: program.outstanding_balance_cents -= billed_amount_cents"
      - from: DENIED
        to: VOID
        trigger: "POST /rehab/claims/{claimId}/void"
        actor: BillingSpecialist
        preconditions:
          - "Claim must be DRAFT, SUBMITTED, or DENIED (ERR_CLAIM_NOT_VOIDABLE)"
        side_effects:
          - "authorization.visits_billed -= 1 ; program.outstanding_balance_cents -= billed_amount_cents ; program billing totals recomputed"
      - from: DRAFT
        to: VOID
        trigger: "POST /rehab/claims/{claimId}/void"
        actor: BillingSpecialist
        preconditions:
          - "Claim must be DRAFT, SUBMITTED, or DENIED (ERR_CLAIM_NOT_VOIDABLE)"
        side_effects:
          - "authorization.visits_billed -= 1 ; program billing totals recomputed"

  - entity: MaintenanceProgram
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /rehab/maintenance-programs/{maintenanceId}/cancel"
        actor: RehabCoordinator
        preconditions:
          - "Maintenance program must be ACTIVE (ERR_MAINTENANCE_NOT_ACTIVE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: session-create-stale-program
    parent_entity: RehabProgram
    write_endpoint: "POST /rehab/sessions"
    occ_field: "expected_program_version"
    description: |
      Scheduling a RehabSession against a RehabProgram whose version has
      advanced since the client last observed it is rejected. Every schedule,
      completion, void, and missed-session cascade bumps the program version
      (sessions_scheduled / sessions_used are derived counters on the program);
      a client that scheduled against a now-stale view of remaining capacity
      is rejected so its capacity assumption is re-derived from a fresh read.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: session_billed_amount
    trigger: "BillingClaim creation (POST /rehab/claims)"
    algorithm: tiered_pricing
    formula: |
      base = BASE_RATE_CENTS[session.session_type]
      risk_mult = RISK_MULTIPLIER[program.risk_stratification]
      telemetry = TELEMETRY_SURCHARGE_CENTS if station.station_type == "TELEMETRY" else 0
      raw = round_half_up(base * risk_mult) + telemetry
      billed_amount_cents = min(raw, MAX_BILLED_PER_SESSION_CENTS)
    input_set: "the single COMPLETED session referenced by the claim; program.risk_stratification; session.station.station_type"
    constants:
      BASE_RATE_CENTS: { MONITORED_EXERCISE: 15000, EDUCATION: 8000, ASSESSMENT: 10000 }
      RISK_MULTIPLIER: { LOW: 1.00, MODERATE: 1.10, HIGH: 1.25 }
      TELEMETRY_SURCHARGE_CENTS: 3000
      MAX_BILLED_PER_SESSION_CENTS: 20000
    precision: "round_half_up on base*risk_mult to whole cents BEFORE adding telemetry, then cap"
    note: "Combinatorial mode (a): >=3 inputs (session_type, risk, station_type) with conditional surcharge + min cap"

  - name: claim_reimbursement
    trigger: "claim create (estimated variant), claim adjudicate PAID (adjudicated variant)"
    algorithm: dual_variant
    formula: |
      estimated_reimbursement_cents = max(0, min(billed_amount_cents, allowed_amount_cents) - copay_cents)
      estimated_patient_responsibility_cents = billed_amount_cents - estimated_reimbursement_cents
      # adjudicated (final) variant, computed at PAID:
      adjudicated_reimbursement_cents = max(0, adjudicated_allowed_cents - copay_cents)
      patient_responsibility_cents (PAID) = billed_amount_cents - adjudicated_reimbursement_cents
    input_set: "one BillingClaim; allowed_amount_cents & copay_cents from its InsuranceAuthorization; adjudicated_allowed_cents from adjudicate payload"
    constants: {}
    precision: "integer cents; max(0, .) floors at zero"
    variants:
      - name: estimated
        when: "at claim create/submit, before payer adjudication"
        difference: "uses authorization.allowed_amount_cents (contracted rate)"
      - name: adjudicated
        when: "at adjudicate outcome==PAID"
        difference: "uses payer-returned adjudicated_allowed_cents; typically differs from contracted allowed, producing a different reimbursement and patient responsibility"
    note: "Dual-variant on the BILLING domain (BillingClaim)"

  - name: six_minute_walk_improvement
    trigger: "discharge OutcomeAssessment read (provisional variant), discharge OutcomeAssessment finalize (verified variant)"
    algorithm: dual_variant
    formula: |
      baseline = distance_meters of the program's BASELINE OutcomeAssessment
      improvement_meters = discharge.distance_meters - baseline
      improvement_pct = round_half_up((discharge.distance_meters - baseline) / baseline * 100, 1)
    input_set: "program's BASELINE and DISCHARGE OutcomeAssessment records"
    constants: {}
    precision: "improvement_meters integer; improvement_pct 1 decimal, round_half_up"
    variants:
      - name: provisional
        when: "DISCHARGE assessment still DRAFT; uses draft distance_meters against FINALIZED baseline"
        difference: "reflects the un-verified draft distance which may be corrected at finalize"
      - name: verified
        when: "DISCHARGE assessment FINALIZED"
        difference: "uses the (possibly corrected) final_distance_meters supplied at finalize; can differ from provisional"
    note: "Dual-variant on the CLINICAL OUTCOME domain (OutcomeAssessment) — distinct entity domain from claim_reimbursement"

  - name: patient_statement_total
    trigger: "GET /rehab/programs/{programId}/statement"
    algorithm: aggregation
    formula: |
      For each non-VOID BillingClaim of the program:
        claim_dollars = round_half_up(claim.patient_responsibility_cents / 100)   # per-claim rounding FIRST
      statement_total_dollars = sum(claim_dollars over the claims)                 # THEN sum
    input_set: "all BillingClaim of the program with status != VOID, ordered by created_at ASC"
    constants: {}
    precision: "round_half_up EACH claim's cents to whole dollars, THEN sum (round-per-line-then-sum). This differs from sum-cents-then-round."
    note: "Combinatorial mode (b): nested rounding where order matters; the scaffold pins round-per-line-then-sum"

  - name: session_capacity_accounting
    trigger: "session create, complete, void, mark-missed"
    algorithm: aggregation
    formula: |
      sessions_used = count(RehabSession where program_id==P and status==COMPLETED)
      sessions_scheduled = count(RehabSession where program_id==P and status==SCHEDULED)
      sessions_remaining_authorized = authorized_session_cap - sessions_used          # chronological (completed-only)
      projected_remaining = authorized_session_cap - sessions_used - sessions_scheduled # forward-looking
    input_set: "RehabSession rows of the program filtered by status"
    constants:
      SESSION_CAP: 36
    precision: "integer counts"
    note: "Forward-looking vs chronological remaining capacity; SESSION_CAP=36 authorization cap"

  - name: adverse_vitals_check
    trigger: "session complete (vitals recorded)"
    algorithm: threshold
    formula: |
      adverse_event = (post_spo2 is not null and post_spo2 < SPO2_MIN_THRESHOLD)
                      or (rpe is not null and rpe >= RPE_MAX_THRESHOLD)
    input_set: "the completing session's post_spo2 and rpe"
    constants:
      SPO2_MIN_THRESHOLD: 85
      RPE_MAX_THRESHOLD: 18
    precision: "boolean; SpO2 strict < 85, RPE >= 18"
    note: "Boundary: SpO2 85 is NOT adverse (strict <), 84 IS; RPE 18 IS adverse (>=), 17 is not"

  - name: maintenance_tier
    trigger: "program discharge (MaintenanceProgram creation)"
    algorithm: threshold
    formula: |
      tier = "INTENSIVE" if discharge.improvement_pct < MAINTENANCE_INTENSIVE_THRESHOLD_PCT else "STANDARD"
      monthly_visit_allowance = MONTHLY_ALLOWANCE[tier]
    input_set: "the program's FINALIZED DISCHARGE OutcomeAssessment improvement_pct"
    constants:
      MAINTENANCE_INTENSIVE_THRESHOLD_PCT: 10.0
      MONTHLY_ALLOWANCE: { STANDARD: 4, INTENSIVE: 8 }
    precision: "improvement_pct compared with strict <"
    note: "Low functional gain (<10%) routes to INTENSIVE maintenance"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7; entity_backed roles acting on own resource must match X-User-ID (ownership)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK resources exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints referencing resources

  - priority: 4
    category: state
    check: "OCC: expected_program_version must equal current RehabProgram.version"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /rehab/sessions"

  - priority: 5
    category: state
    check: "Target resource in a legal from-state for the requested transition (program status, session status, claim status, referral status, authorization status, outcome status, care item status)"
    error_id: "ERR_*_NOT_* (e.g. ERR_PROGRAM_NOT_ACTIVE, ERR_SESSION_NOT_SCHEDULED, ERR_CLAIM_NOT_ADJUDICABLE)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-aggregate references are consistent (claim.session belongs to claim.program; claim.authorization belongs to claim.program; session.station & clinician resolvable; outcome/session program matches)"
    error_id: ERR_CROSS_PROGRAM_REFERENCE
    http_status: 409
    applies_to: "POST /rehab/claims, POST /rehab/sessions"

  - priority: 7
    category: business_safety
    check: "HIGH risk_stratification program requires a TELEMETRY station for MONITORED_EXERCISE sessions"
    error_id: ERR_TELEMETRY_STATION_REQUIRED
    http_status: 422
    applies_to: "POST /rehab/sessions, POST /rehab/sessions/{id}/reschedule"

  - priority: 8
    category: business_temporal
    check: "Session interval [scheduled_start, scheduled_end) must not overlap another SCHEDULED session on the same station (half-open; adjacency where end==next.start is allowed)"
    error_id: ERR_STATION_OVERLAP
    http_status: 409
    applies_to: "POST /rehab/sessions, POST /rehab/sessions/{id}/reschedule"

  - priority: 9
    category: business_temporal
    check: "Supervising clinician must be free within CLINICIAN_TURNOVER_BUFFER_MINUTES of another SCHEDULED session (buffered interval; adjacency within 15 min is NOT allowed)"
    error_id: ERR_CLINICIAN_UNAVAILABLE
    http_status: 409
    applies_to: "POST /rehab/sessions, POST /rehab/sessions/{id}/reschedule"

  - priority: 10
    category: business_constraint
    check: "scheduled_end must be strictly after scheduled_start"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 400
    applies_to: "POST /rehab/sessions, POST /rehab/sessions/{id}/reschedule"

  - priority: 11
    category: business_fiscal
    check: "Scheduling must not exceed the 36-session authorization cap: sessions_used + sessions_scheduled < authorized_session_cap"
    error_id: ERR_SESSION_CAP_REACHED
    http_status: 409
    applies_to: "POST /rehab/sessions, POST /rehab/sessions/{id}/reschedule"

  - priority: 12
    category: business_fiscal
    check: "Claim creation must not exceed the payer visit-limit: authorization.visits_billed < authorization.authorized_visits"
    error_id: ERR_VISIT_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /rehab/claims"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Patients ----
  - { method: POST, path: "/rehab/patients", description: "Register a patient", roles: [RehabCoordinator], code: 201, input: [mrn, full_name, date_of_birth], output: Patient, side_effects: [] }
  - { method: GET, path: "/rehab/patients/{patientId}", description: "Get a patient", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: Patient, side_effects: [] }

  # ---- Physicians ----
  - { method: POST, path: "/rehab/physicians", description: "Register a referring physician record", roles: [RehabCoordinator], code: 201, input: [full_name, npi, "specialty?"], output: Physician, side_effects: [] }
  - { method: GET, path: "/rehab/physicians/{physicianId}", description: "Get a physician", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: Physician, side_effects: [] }

  # ---- Clinicians ----
  - { method: POST, path: "/rehab/clinicians", description: "Register a rehab clinician record", roles: [RehabCoordinator], code: 201, input: [full_name, credential], output: Clinician, side_effects: [] }
  - { method: GET, path: "/rehab/clinicians/{clinicianId}", description: "Get a clinician", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: Clinician, side_effects: [] }

  # ---- Monitoring Stations ----
  - { method: POST, path: "/rehab/stations", description: "Register a monitoring/exercise station", roles: [RehabCoordinator], code: 201, input: [name, station_type], output: MonitoringStation, side_effects: [] }
  - { method: GET, path: "/rehab/stations/{stationId}", description: "Get a station", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: MonitoringStation, side_effects: [] }

  # ---- Referrals ----
  - method: POST
    path: "/rehab/referrals"
    description: "Referring physician creates a referral with risk stratification"
    roles: [ReferringPhysician]
    code: 201
    input: [patient_id, physician_id, program_type, indication, risk_stratification]
    output: Referral
    side_effects: ["status=PENDING"]
  - { method: GET, path: "/rehab/referrals/{referralId}", description: "Get a referral", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: Referral, side_effects: [] }
  - { method: GET, path: "/rehab/referrals", description: "List referrals (reverse-reachability for Patient/Physician FKs)", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: ["patient_id?", "physician_id?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - method: POST
    path: "/rehab/referrals/{referralId}/decision"
    description: "Coordinator accepts or declines a pending referral"
    roles: [RehabCoordinator]
    code: 200
    input: [decision]   # ACCEPT | DECLINE
    output: Referral
    side_effects: ["status -> ACCEPTED or DECLINED"]

  # ---- Programs ----
  - method: POST
    path: "/rehab/programs"
    description: "Create a rehab program from an ACCEPTED referral"
    roles: [RehabCoordinator]
    code: 201
    input: [referral_id, "current_phase?", "authorized_session_cap?"]
    output: RehabProgram
    side_effects: ["status=DRAFT", "patient_id/program_type/risk_stratification copied from referral", "authorized_session_cap defaults to 36"]
  - { method: GET, path: "/rehab/programs/{programId}", description: "Get a program with computed capacity & billing fields", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: RehabProgram, side_effects: [] }
  - { method: GET, path: "/rehab/programs", description: "List programs (reverse-reachability for Patient/Referral FKs)", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: ["patient_id?", "referral_id?", "limit?", "offset?"], output: "RehabProgram[]", side_effects: [] }
  - method: POST
    path: "/rehab/programs/{programId}/activate"
    description: "Activate a DRAFT program (requires APPROVED authorization + FINALIZED BASELINE outcome)"
    roles: [RehabCoordinator]
    code: 200
    input: []
    output: RehabProgram
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/rehab/programs/{programId}/hold"
    description: "Place an ACTIVE program ON_HOLD (cascade: cancel remaining SCHEDULED sessions)"
    roles: [RehabCoordinator, RehabClinician]
    code: 200
    input: ["reason?"]
    output: RehabProgram
    side_effects: ["status -> ON_HOLD", "cancel SCHEDULED sessions"]
  - method: POST
    path: "/rehab/programs/{programId}/resume"
    description: "Resume an ON_HOLD program"
    roles: [RehabCoordinator]
    code: 200
    input: []
    output: RehabProgram
    side_effects: ["status -> ACTIVE", "consecutive_missed_count reset to 0"]
  - method: POST
    path: "/rehab/programs/{programId}/discharge"
    description: "Discharge an ACTIVE program (requires FINALIZED DISCHARGE outcome; creates MaintenanceProgram)"
    roles: [RehabCoordinator]
    code: 200
    input: []
    output: RehabProgram
    side_effects: ["status -> DISCHARGED", "create MaintenanceProgram", "OPEN GOAL CarePlanItems -> NOT_ACHIEVED"]
  - method: POST
    path: "/rehab/programs/{programId}/withdraw"
    description: "Withdraw a program (patient dropout) from DRAFT/ACTIVE/ON_HOLD"
    roles: [RehabCoordinator]
    code: 200
    input: ["reason?"]
    output: RehabProgram
    side_effects: ["status -> WITHDRAWN", "cancel SCHEDULED sessions"]
  - method: GET
    path: "/rehab/programs/{programId}/statement"
    description: "Computed patient billing statement (round-per-claim-then-sum dollar total)"
    roles: [RehabCoordinator, BillingSpecialist]
    code: 200
    input: []
    output: "{ statement_total_dollars: integer, claim_count: integer, total_patient_responsibility_cents: integer, outstanding_balance_cents: integer }"
    side_effects: []

  # ---- Insurance Authorizations ----
  - method: POST
    path: "/rehab/authorizations"
    description: "Create an insurance authorization for a program"
    roles: [RehabCoordinator]
    code: 201
    input: [program_id, payer_name, authorized_visits, allowed_amount_cents, copay_cents]
    output: InsuranceAuthorization
    side_effects: ["status=PENDING"]
  - { method: GET, path: "/rehab/authorizations/{authorizationId}", description: "Get an authorization", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: InsuranceAuthorization, side_effects: [] }
  - { method: GET, path: "/rehab/authorizations", description: "List authorizations (reverse-reachability for program_id FK)", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: ["program_id?", "limit?", "offset?"], output: "InsuranceAuthorization[]", side_effects: [] }
  - method: POST
    path: "/rehab/authorizations/{authorizationId}/approve"
    description: "Approve a PENDING authorization"
    roles: [RehabCoordinator]
    code: 200
    input: []
    output: InsuranceAuthorization
    side_effects: ["status -> APPROVED"]

  # ---- Sessions ----
  - method: POST
    path: "/rehab/sessions"
    description: "Schedule a monitored session on a station/clinician (OCC on program.version). Requires parent program status==ACTIVE (ERR_PROGRAM_NOT_ACTIVE — cross-entity dep RehabSession->RehabProgram)."
    roles: [RehabCoordinator]
    code: 201
    input: [program_id, clinician_id, station_id, session_type, phase, scheduled_start, scheduled_end, expected_program_version]
    output: RehabSession
    side_effects: ["status=SCHEDULED", "increments RehabProgram.version by 1", "sessions_scheduled recomputed"]
  - { method: GET, path: "/rehab/sessions/{sessionId}", description: "Get a session (incl. vitals & adverse_event)", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: RehabSession, side_effects: [] }
  - { method: GET, path: "/rehab/sessions", description: "List sessions (reverse-reachability for program/clinician/station FKs)", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: ["program_id?", "clinician_id?", "station_id?", "status?", "limit?", "offset?"], output: "RehabSession[]", side_effects: [] }
  - method: POST
    path: "/rehab/sessions/{sessionId}/complete"
    description: "Clinician records vitals and completes the session"
    roles: [RehabClinician]
    code: 200
    input: ["pre_hr?", "post_hr?", "post_spo2?", "rpe?", "exercise_minutes?"]
    output: RehabSession
    side_effects: ["status -> COMPLETED", "adverse_event computed", "program.sessions_used += 1", "consecutive_missed_count reset", "program.version += 1", "if adverse_event: program -> ON_HOLD (cascade)"]
  - method: POST
    path: "/rehab/sessions/{sessionId}/mark-missed"
    description: "Clinician marks a scheduled session as missed (no-show)"
    roles: [RehabClinician]
    code: 200
    input: []
    output: RehabSession
    side_effects: ["status -> MISSED", "program.consecutive_missed_count += 1", "program.version += 1", "if count reaches MAX_CONSECUTIVE_MISSED: program -> ON_HOLD (cascade)"]
  - method: POST
    path: "/rehab/sessions/{sessionId}/reschedule"
    description: "Reschedule a MISSED session to a new interval (cyclic MISSED -> SCHEDULED)"
    roles: [RehabCoordinator]
    code: 200
    input: [scheduled_start, scheduled_end, "clinician_id?", "station_id?"]
    output: RehabSession
    side_effects: ["status -> SCHEDULED", "interval updated"]
  - method: POST
    path: "/rehab/sessions/{sessionId}/cancel"
    description: "Cancel a SCHEDULED session"
    roles: [RehabCoordinator]
    code: 200
    input: []
    output: RehabSession
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/rehab/sessions/{sessionId}/void"
    description: "Void a COMPLETED session (compensating; decrements sessions_used)"
    roles: [RehabCoordinator]
    code: 200
    input: []
    output: RehabSession
    side_effects: ["status -> VOIDED", "program.sessions_used -= 1", "program.version += 1"]

  # ---- Care Plan Items (education & goal) ----
  - method: POST
    path: "/rehab/care-plan-items"
    description: "Add an education module or goal to a program"
    roles: [RehabClinician]
    code: 201
    input: [program_id, item_type, title, "target_description?"]
    output: CarePlanItem
    side_effects: ["status=OPEN"]
  - { method: GET, path: "/rehab/care-plan-items/{itemId}", description: "Get a care plan item", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: CarePlanItem, side_effects: [] }
  - { method: GET, path: "/rehab/care-plan-items", description: "List care plan items (reverse-reachability for program_id FK)", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: ["program_id?", "item_type?", "limit?", "offset?"], output: "CarePlanItem[]", side_effects: [] }
  - method: POST
    path: "/rehab/care-plan-items/{itemId}/resolve"
    description: "Resolve an OPEN item (ACHIEVED / NOT_ACHIEVED / WAIVED)"
    roles: [RehabClinician]
    code: 200
    input: [resolution]
    output: CarePlanItem
    side_effects: ["status -> resolution"]

  # ---- Outcome Assessments (6MWT) ----
  - method: POST
    path: "/rehab/outcomes"
    description: "Record a 6MWT outcome assessment (BASELINE or DISCHARGE) as DRAFT"
    roles: [RehabClinician]
    code: 201
    input: [program_id, timing, distance_meters, "assessment_type?"]
    output: OutcomeAssessment
    side_effects: ["status=DRAFT"]
  - { method: GET, path: "/rehab/outcomes/{outcomeId}", description: "Get an outcome assessment (incl. provisional improvement)", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: OutcomeAssessment, side_effects: [] }
  - { method: GET, path: "/rehab/outcomes", description: "List outcomes (reverse-reachability for program_id FK)", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: ["program_id?", "timing?", "limit?", "offset?"], output: "OutcomeAssessment[]", side_effects: [] }
  - method: POST
    path: "/rehab/outcomes/{outcomeId}/finalize"
    description: "Finalize a DRAFT outcome; optionally correct distance; recompute verified improvement"
    roles: [RehabClinician]
    code: 200
    input: ["final_distance_meters?"]
    output: OutcomeAssessment
    side_effects: ["status -> FINALIZED", "DISCHARGE: improvement_meters/improvement_pct recomputed (verified)"]

  # ---- Billing Claims ----
  - method: POST
    path: "/rehab/claims"
    description: "Create a claim for a COMPLETED session against an APPROVED authorization"
    roles: [BillingSpecialist]
    code: 201
    input: [program_id, session_id, authorization_id]
    output: BillingClaim
    side_effects: ["status=DRAFT", "billed_amount_cents & estimated reimbursement/responsibility computed", "authorization.visits_billed += 1"]
  - { method: GET, path: "/rehab/claims/{claimId}", description: "Get a claim", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: BillingClaim, side_effects: [] }
  - { method: GET, path: "/rehab/claims", description: "List claims (reverse-reachability for program/session/authorization FKs)", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: ["program_id?", "session_id?", "authorization_id?", "status?", "limit?", "offset?"], output: "BillingClaim[]", side_effects: [] }
  - method: POST
    path: "/rehab/claims/{claimId}/submit"
    description: "Submit a DRAFT claim to the payer"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: BillingClaim
    side_effects: ["status -> SUBMITTED", "program billing totals recomputed"]
  - method: POST
    path: "/rehab/claims/{claimId}/adjudicate"
    description: "Adjudicate a SUBMITTED claim (PAID with adjudicated_allowed_cents, or DENIED with denial_reason)"
    roles: [BillingSpecialist]
    code: 200
    input: [outcome, "adjudicated_allowed_cents?", "denial_reason?"]
    output: BillingClaim
    side_effects: ["status -> PAID or DENIED", "PAID: adjudicated reimbursement/responsibility computed", "DENIED: program.outstanding_balance_cents += billed_amount_cents"]
  - method: POST
    path: "/rehab/claims/{claimId}/resubmit"
    description: "Resubmit a DENIED claim (cyclic DENIED -> SUBMITTED)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: BillingClaim
    side_effects: ["status -> SUBMITTED", "program.outstanding_balance_cents -= billed_amount_cents"]
  - method: POST
    path: "/rehab/claims/{claimId}/void"
    description: "Void a DRAFT/SUBMITTED/DENIED claim (compensating; conserves money identity)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: BillingClaim
    side_effects: ["status -> VOID", "authorization.visits_billed -= 1", "if was DENIED: outstanding_balance_cents -= billed_amount_cents", "program billing totals recomputed"]

  # ---- Maintenance Programs ----
  - { method: GET, path: "/rehab/maintenance-programs/{maintenanceId}", description: "Get a maintenance program", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: [], output: MaintenanceProgram, side_effects: [] }
  - { method: GET, path: "/rehab/maintenance-programs", description: "List maintenance programs (reverse-reachability for program_id and patient_id FKs)", roles: [ReferringPhysician, RehabCoordinator, RehabClinician, BillingSpecialist], code: 200, input: ["program_id?", "patient_id?", "limit?", "offset?"], output: "MaintenanceProgram[]", side_effects: [] }
  - method: POST
    path: "/rehab/maintenance-programs/{maintenanceId}/cancel"
    description: "Cancel an ACTIVE maintenance program"
    roles: [RehabCoordinator]
    code: 200
    input: []
    output: MaintenanceProgram
    side_effects: ["status -> CANCELLED"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock."
    roles: [RehabCoordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- auth --
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for operation, or entity_backed ownership mismatch" }
  # -- existence --
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id does not exist" }
  - { id: ERR_PHYSICIAN_NOT_FOUND, http: 404, condition: "Physician id does not exist" }
  - { id: ERR_CLINICIAN_NOT_FOUND, http: 404, condition: "Clinician id does not exist" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "MonitoringStation id does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "Referral id does not exist" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "RehabProgram id does not exist" }
  - { id: ERR_AUTHORIZATION_NOT_FOUND, http: 404, condition: "InsuranceAuthorization id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "RehabSession id does not exist" }
  - { id: ERR_CARE_PLAN_ITEM_NOT_FOUND, http: 404, condition: "CarePlanItem id does not exist" }
  - { id: ERR_OUTCOME_NOT_FOUND, http: 404, condition: "OutcomeAssessment id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "BillingClaim id does not exist" }
  - { id: ERR_MAINTENANCE_NOT_FOUND, http: 404, condition: "MaintenanceProgram id does not exist" }
  # -- input validation --
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field / wrong type / malformed body" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum-typed field carries a value outside its declared set" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "scheduled_end not strictly after scheduled_start" }
  - { id: ERR_INVALID_DECISION, http: 400, condition: "Referral decision not ACCEPT/DECLINE" }
  # -- OCC --
  - { id: ERR_STALE_PROGRAM_VERSION, http: 412, condition: "expected_program_version != current RehabProgram.version" }
  # -- state --
  - { id: ERR_REFERRAL_NOT_PENDING, http: 409, condition: "Referral not PENDING for decision" }
  - { id: ERR_PROGRAM_NOT_DRAFT, http: 409, condition: "Program not DRAFT for activate" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Program not ACTIVE for the operation (hold, discharge, session schedule/complete)" }
  - { id: ERR_PROGRAM_NOT_ON_HOLD, http: 409, condition: "Program not ON_HOLD for resume" }
  - { id: ERR_PROGRAM_ALREADY_TERMINAL, http: 409, condition: "Program already DISCHARGED/WITHDRAWN" }
  - { id: ERR_AUTHORIZATION_NOT_PENDING, http: 409, condition: "Authorization not PENDING for approve" }
  - { id: ERR_SESSION_NOT_SCHEDULED, http: 409, condition: "Session not SCHEDULED for complete/mark-missed/cancel" }
  - { id: ERR_SESSION_NOT_MISSED, http: 409, condition: "Session not MISSED for reschedule" }
  - { id: ERR_SESSION_NOT_COMPLETED, http: 409, condition: "Session not COMPLETED for void" }
  - { id: ERR_SESSION_HAS_ACTIVE_CLAIM, http: 409, condition: "Session has a non-VOID claim and cannot be voided" }
  - { id: ERR_OUTCOME_NOT_DRAFT, http: 409, condition: "Outcome not DRAFT for finalize" }
  - { id: ERR_CARE_ITEM_NOT_OPEN, http: 409, condition: "CarePlanItem not OPEN for resolve" }
  - { id: ERR_CLAIM_NOT_SUBMITTABLE, http: 409, condition: "Claim not DRAFT for submit" }
  - { id: ERR_CLAIM_NOT_ADJUDICABLE, http: 409, condition: "Claim not SUBMITTED for adjudicate" }
  - { id: ERR_CLAIM_NOT_DENIED, http: 409, condition: "Claim not DENIED for resubmit" }
  - { id: ERR_CLAIM_NOT_VOIDABLE, http: 409, condition: "Claim not in DRAFT/SUBMITTED/DENIED for void" }
  - { id: ERR_MAINTENANCE_NOT_ACTIVE, http: 409, condition: "Maintenance program not ACTIVE for cancel" }
  # -- business constraint --
  - { id: ERR_NO_APPROVED_AUTHORIZATION, http: 409, condition: "Activate requires >=1 APPROVED authorization (Program->InsuranceAuthorization dep)" }
  - { id: ERR_BASELINE_OUTCOME_REQUIRED, http: 409, condition: "FINALIZED BASELINE outcome required (activate; discharge-outcome finalize)" }
  - { id: ERR_NO_FINALIZED_DISCHARGE_OUTCOME, http: 409, condition: "Discharge requires >=1 FINALIZED DISCHARGE outcome (Program->OutcomeAssessment dep)" }
  - { id: ERR_ACTIVE_SESSIONS_EXIST, http: 409, condition: "Discharge blocked while SCHEDULED sessions remain" }
  - { id: ERR_REFERRAL_NOT_ACCEPTED, http: 409, condition: "Program creation requires an ACCEPTED referral" }
  # -- business referential --
  - { id: ERR_CROSS_PROGRAM_REFERENCE, http: 409, condition: "Claim session/authorization belong to a different program, or cross-aggregate reference mismatch" }
  # -- business safety --
  - { id: ERR_TELEMETRY_STATION_REQUIRED, http: 422, condition: "HIGH-risk program MONITORED_EXERCISE session on a non-TELEMETRY station" }
  # -- business temporal --
  - { id: ERR_STATION_OVERLAP, http: 409, condition: "Session interval overlaps another SCHEDULED session on the same station" }
  - { id: ERR_CLINICIAN_UNAVAILABLE, http: 409, condition: "Clinician busy within turnover buffer of another SCHEDULED session" }
  # -- business fiscal / capacity --
  - { id: ERR_SESSION_CAP_REACHED, http: 409, condition: "sessions_used + sessions_scheduled would exceed 36-session cap" }
  - { id: ERR_VISIT_LIMIT_REACHED, http: 409, condition: "authorization.visits_billed would exceed authorized_visits" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ReferringPhysician
    description: "External referring physician; creates referrals with risk stratification and reads records"
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /rehab/referrals — create referral (referral.physician_id must equal X-User-ID)"
    shared_operations:
      - "GET (all read endpoints)"

  - name: RehabCoordinator
    description: "Program operations: config records, referral decisions, program lifecycle, authorizations, session scheduling, maintenance"
    identity: "opaque"
    exclusive_operations:
      - "POST /rehab/patients, /rehab/physicians, /rehab/clinicians, /rehab/stations"
      - "POST /rehab/referrals/{id}/decision"
      - "POST /rehab/programs and all program lifecycle (activate/hold/resume/discharge/withdraw)"
      - "POST /rehab/authorizations and /approve"
      - "POST /rehab/sessions, /reschedule, /cancel, /void"
      - "POST /rehab/maintenance-programs/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /rehab/programs/{id}/hold (shared with RehabClinician)"
      - "GET /rehab/programs/{id}/statement (shared with BillingSpecialist)"
      - "GET (all read endpoints)"

  - name: RehabClinician
    description: "Exercise physiologist / rehab clinician; completes sessions, records vitals, manages care plan items and outcomes"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /rehab/sessions/{id}/complete, /mark-missed"
      - "POST /rehab/care-plan-items, /resolve"
      - "POST /rehab/outcomes, /finalize"
    shared_operations:
      - "POST /rehab/programs/{id}/hold (shared with RehabCoordinator)"
      - "GET (all read endpoints)"

  - name: BillingSpecialist
    description: "Revenue-cycle billing; creates and adjudicates claims, reads statements"
    identity: "opaque"
    exclusive_operations:
      - "POST /rehab/claims, /submit, /adjudicate, /resubmit, /void"
    shared_operations:
      - "GET /rehab/programs/{id}/statement (shared with RehabCoordinator)"
      - "GET (all read endpoints)"
