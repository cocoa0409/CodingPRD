          - state_machines.SampleShipment.SHIPPED_to_DELIVERED
          - errors[ERR_INVALID_SHIPMENT_STATE]
        distinguishing_aspect: "The action is conditioned on the shipment already being SHIPPED, which only the wave release can achieve: delivering straight out of ALLOCATED must fail with 409 and leave delivered_at null, so the campaign's final cost stays 0 and the obligation axis stays NONE."
        test_recipe:
          setup:
            - "One campaign in SAMPLING_ACTIVE with one screened non-holdout enrollment and one ALLOCATED shipment in a PLANNED (never locked, never released) wave."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
