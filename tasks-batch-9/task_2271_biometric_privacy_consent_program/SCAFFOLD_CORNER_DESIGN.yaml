              captures: { swept: $.data.swept_asset_count, destroyed: $.data.destroyed_template_count, expired: $.data.expired_consent_count, breached: $.data.sla_breached_accommodation_count, posture: $.data.program_posture }
          assert:
            - "${due_at} == 2026-09-14T00:00:00.000Z, so the sweep runs at the inclusive boundary"
            - "HTTP 200 with ${swept} == 1, ${destroyed} == 1, ${expired} == 1, ${breached} == 1 and ${posture} == RESTRICTED"
            - "BiometricAsset ${asset_id} is GATED with templates_destroyed_at == 2026-09-14T00:00:00.000Z and enrolled_subject_count 0"
            - "ConsentRecord ${c1_id} is EXPIRED and GET /accommodations with created_from_consent_id ${c1_id} returns total_count 0 — a retention expiry is not a refusal"
            - "AlternativeAccommodation ${acc_id} is still REQUESTED but sla_breached is now true, and ComplianceProgram.version incremented by exactly 1"

      - name: multi_hop_cascades_are_covered_by_the_transitive_cascade_difficulty_instances
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.VendorContract.EXECUTED_to_TERMINATED
        excluded_because:
          difficulty_instance: contract_termination_gates_asset_expires_consent_spawns_accommodation_restricts_program
          rationale: "The end-to-end chain claim is that instance's entire subject: it verifies five ordered hops from a contract termination down to the program posture, which no shorter corner test can strengthen."

      - name: dual_variant_layer_is_covered_by_the_dual_variant_difficulty_instances
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.pra_exposure_estimate
          - calculations.effective_retention_and_destruction
        excluded_because:
          difficulty_instance: pra_exposure_stacked_vs_subject_capped_divergence
          rationale: "Both declared dual-variant calculations are covered by dedicated difficulty instances that run each variant over shared inputs and pin the delta, so the layer-level claim is already exhausted."

  - section: consistency_model
    instances:
      - name: computed_fields_are_visible_in_the_same_response_that_changed_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.inventory_completeness_pct
          - entities.BiometricAsset.fields.destruction_due_at
        distinguishing_aspect: "There is no read-your-writes lag anywhere in the system: the activation response already carries the pinned policy, the stamped collection_started_at and the computed destruction_due_at, and an immediately following program read shows the recomputed completeness and posture with no intervening call."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL, a PUBLISHED policy, a PUBLISHED (IL, EMPLOYEE) notice and one CLASSIFIED in-house asset; the clock is set to 2026-08-15 before activation."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v1}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np1_id: $.data.id }
            - call: "POST /notice-packets/${np1_id}/transitions"
              payload: { to_status: "PUBLISHED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_id: $.data.id }
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pinned: $.data.pinned_policy_id, started: $.data.collection_started_at, due: $.data.destruction_due_at }
            - call: "GET /programs/${prog_id}"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pct: $.data.inventory_completeness_pct, posture: $.data.posture }
          assert:
            - "The transition response itself already carries ${pinned} == ${pol1_id}, ${started} == 2026-08-15T00:00:00.000Z and ${due} == 2026-09-14T00:00:00.000Z — no second read is needed"
            - "The immediately following program read reports ${pct} == 100.00 and ${posture} == OPEN"
            - "No polling or delay is required anywhere: every derived field in this scenario is correct in the first response that could contain it"
