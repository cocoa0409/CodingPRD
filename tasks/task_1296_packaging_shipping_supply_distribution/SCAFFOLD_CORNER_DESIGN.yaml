              payload: {}
              as: PlatformAdmin
              captures: { c2: $.data.freight_class }
            - call: "GET /packaging-distribution/order-lines/${l3}"
              payload: {}
              as: PlatformAdmin
              captures: { c3: $.data.freight_class }
          assert:
