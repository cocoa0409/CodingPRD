scaffold_corner_design:

  # ===========================================================================
  # SECTION: entities  (claim-extraction-guide "From Table 1")
  # ===========================================================================
  - section: entities
    instances:

      - name: interop_profile_creation_echoes_every_declared_input_field
        claim_type: creation
        grounds:
          - entities.InteropProfile
          - endpoints[POST /mdl/interop-profiles]
        distinguishing_aspect: "POST /mdl/interop-profiles with every optional input supplied returns 201 and echoes each supplied value verbatim; an implementation that silently substitutes its own default for a supplied optional (for example forcing revocation_freshness_seconds back to 300) fails."
        test_recipe:
          setup:
            - "Empty database. No setup is required: InteropProfile is a root entity with parent null."
          setup_api_calls: []
          trigger:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-FULL", standard_version: "ISO_18013_7_2024", accepted_issuer_states: ["IA", "KS"], required_assurance_level: "IAL1_5", max_devices_per_holder: 3, max_active_credentials_per_holder: 4, proofing_validity_days: 90, revocation_freshness_seconds: 45, age_only_allowed_elements: ["age_over_21"] }
              as: SystemAdmin
              as_user_id: "admin-001"
          assert:
            - "POST /mdl/interop-profiles status == 201"
            - "response data.profile_code == \"AAMVA-MDL-FULL\""
            - "response data.standard_version == \"ISO_18013_7_2024\""
            - "response data.accepted_issuer_states == [\"IA\", \"KS\"]"
            - "response data.required_assurance_level == \"IAL1_5\""
            - "response data.max_devices_per_holder == 3"
            - "response data.max_active_credentials_per_holder == 4"
            - "response data.proofing_validity_days == 90"
            - "response data.revocation_freshness_seconds == 45"
            - "response data.age_only_allowed_elements == [\"age_over_21\"]"

      - name: holder_retrieval_returns_stored_record_with_zeroed_counters
        claim_type: retrieval
        grounds:
          - entities.Holder
          - endpoints[GET /mdl/holders/{id}]
        distinguishing_aspect: "GET /mdl/holders/{id} returns exactly the stored input fields plus the four computed counters at their creation values (active_credential_count 0, bound_device_count 0, revoked_credential_count 0, address_version 1); an implementation that starts address_version at 0 fails."
        test_recipe:
          setup:
            - "One Holder created with the minimum required field set; no device, credential or proofing session exists."
          setup_api_calls:
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { holder_id: "$.data.id" }
          trigger:
            - call: "GET /mdl/holders/${holder_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-001"
          assert:
            - "GET /mdl/holders/${holder_id} status == 200"
            - "response data.legal_name == \"Rosa Ibarra\""
            - "response data.physical_credential_number == \"NE-4417820\""
            - "response data.physical_credential_status == \"VALID\""
            - "response data.restriction_codes == []"
            - "response data.active_credential_count == 0"
            - "response data.bound_device_count == 0"
            - "response data.revoked_credential_count == 0"
            - "response data.address_version == 1"

      - name: reader_app_listing_honours_limit_and_offset_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /mdl/verifiers/{id}/reader-apps]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two ReaderApp rows under one verifier, GET /mdl/verifiers/{id}/reader-apps with limit 1 and offset 1 returns exactly one row while total_count stays 2 and has_more is false; an implementation that reports total_count as the page length (1) or leaves has_more true at the last page fails."
        test_recipe:
          setup:
            - "One APPROVED Verifier with two reader apps registered under distinct app_identifiers and distinct certificate_serials, so neither the 24-hour renewal-buffer rule nor the duplicate-serial rule fires."
          setup_api_calls:
            - call: "POST /mdl/verifiers"
              payload: { organization_name: "Prairie Cellars", category: "AGE_RESTRICTED_RETAIL", purpose_scope: ["family_name", "age_over_21"], retention_ceiling_days: 30 }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { verifier_id: "$.data.id" }
            - call: "POST /mdl/verifiers/${verifier_id}/trust-decision"
              payload: { decision: "APPROVE" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/reader-apps"
              payload: { verifier_id: "${verifier_id}", app_identifier: "till-a", certificate_serial: "SER-A1", cert_not_before: "2026-07-01T00:00:00Z", cert_not_after: "2027-07-01T00:00:00Z", requested_elements: ["family_name", "age_over_21"], base_rate_cents: 30 }
              as: VerifierOperator
              as_user_id: "${verifier_id}"
            - call: "POST /mdl/reader-apps"
              payload: { verifier_id: "${verifier_id}", app_identifier: "till-b", certificate_serial: "SER-B1", cert_not_before: "2026-07-01T00:00:00Z", cert_not_after: "2027-07-01T00:00:00Z", requested_elements: ["family_name", "age_over_21"], base_rate_cents: 30 }
              as: VerifierOperator
              as_user_id: "${verifier_id}"
          trigger:
            - call: "GET /mdl/verifiers/${verifier_id}/reader-apps"
              payload: { limit: 1, offset: 1 }
              as: SystemAdmin
              as_user_id: "admin-001"
          assert:
            - "GET /mdl/verifiers/${verifier_id}/reader-apps status == 200"
            - "response meta/pagination total_count == 2"
            - "response has_more == false"
            - "len(response data) == 1"
            - "response data[0].trust_state == \"PENDING\""
            - "response data[0].query_count == 0"

      - name: holder_get_with_unknown_id_returns_holder_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /mdl/holders/{id}]
          - errors[ERR_HOLDER_NOT_FOUND]
        distinguishing_aspect: "GET /mdl/holders/{id} for an id that matches no Holder returns 404 with error_id ERR_HOLDER_NOT_FOUND, not a 200 with an empty body and not a generic 500."
        test_recipe:
          setup:
            - "Empty database; no Holder has ever been created."
          setup_api_calls: []
          trigger:
            - call: "GET /mdl/holders/hol-does-not-exist"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "GET /mdl/holders/hol-does-not-exist status == 404"
            - "response data.error_id == \"ERR_HOLDER_NOT_FOUND\""

      - name: holder_create_missing_required_physical_credential_number_rejected
        claim_type: required_fields
        grounds:
          - entities.Holder.fields.physical_credential_number
          - validations[priority 3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /mdl/holders omitting physical_credential_number - an input field with no declared default - returns 400 ERR_INVALID_REQUEST; an implementation that stores a null eligibility number fails."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { err: "$.data.error_id" }
          assert:
            - "POST /mdl/holders status == 400"
            - "response data.error_id == \"ERR_INVALID_REQUEST\""

      - name: interop_profile_omitted_optionals_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.InteropProfile.fields.required_assurance_level
          - entities.InteropProfile.fields.max_devices_per_holder
          - entities.InteropProfile.fields.revocation_freshness_seconds
          - entities.InteropProfile.fields.age_only_allowed_elements
        distinguishing_aspect: "POST /mdl/interop-profiles supplying only the two required inputs applies every declared default exactly: IAL2, 2, 2, 180, 300 and the three-element AGE_ONLY allow-list; an implementation that leaves age_only_allowed_elements empty (and would therefore reject every AGE_ONLY presentation) fails."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-MIN", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              as_user_id: "admin-001"
          assert:
            - "POST /mdl/interop-profiles status == 201"
            - "response data.accepted_issuer_states == []"
            - "response data.required_assurance_level == \"IAL2\""
            - "response data.max_devices_per_holder == 2"
            - "response data.max_active_credentials_per_holder == 2"
            - "response data.proofing_validity_days == 180"
            - "response data.revocation_freshness_seconds == 300"
            - "response data.age_only_allowed_elements == [\"age_over_18\", \"age_over_21\", \"portrait\"]"

      - name: proofing_evidence_strength_points_computed_from_type_and_quality
        claim_type: computed_fields
        grounds:
          - entities.ProofingEvidence.fields.strength_points
          - calculations.proofing_assurance_score.constants.POINTS
        distinguishing_aspect: "A DOCUMENT_SCAN evidence item of quality FAIR is stored with strength_points 150 resolved from POINTS at creation time, and superseded false while it is the only item of its type; an implementation that stores 0 or that copies a client-supplied score fails."
        test_recipe:
          setup:
            - "One InteropProfile, one Holder and one COLLECTING proofing session."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { holder_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions"
              payload: { holder_id: "${holder_id}", requested_assurance_level: "IAL2" }
              as: ProofingAgent
              as_user_id: "pa-001"
              captures: { session_id: "$.data.id" }
          trigger:
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "DOCUMENT_SCAN", quality: "FAIR", captured_at: "2026-07-20T09:00:00Z", source_reference: "doc-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
          assert:
            - "POST /mdl/proofing-sessions/${session_id}/evidence status == 201"
            - "response data.strength_points == 150"
            - "response data.superseded == false"
            - "response data.evidence_type == \"DOCUMENT_SCAN\""
            - "response data.quality == \"FAIR\""

      - name: interop_profile_system_fields_are_server_generated
        claim_type: system_fields
        grounds:
          - entities.InteropProfile.fields.is_active
          - entities.InteropProfile.fields.pending_republish_count
          - endpoints[POST /mdl/interop-profiles].side_effects
        distinguishing_aspect: "The creation response carries a server-minted id plus created_at, updated_at and version == 1, with the system field is_active true and the computed field pending_republish_count 0 - none of which appear in the endpoint's input list; an implementation whose version starts at 0 fails, and so does one that omits is_active."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-SYS", standard_version: "ISO_18013_5_2024" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { profile_id: "$.data.id", profile_v: "$.data.version" }
          assert:
            - "POST /mdl/interop-profiles status == 201"
            - "response data.id is a non-empty string"
            - "response data.created_at is a parseable ISO 8601 datetime"
            - "response data.updated_at is a parseable ISO 8601 datetime"
            - "response data.version == 1"
            - "response data.is_active == true"
            - "response data.pending_republish_count == 0"

      - name: device_create_with_invalid_enum_platform_rejected
        claim_type: type_constraints
        grounds:
          - entities.Device.fields.platform
          - validations[priority 3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /mdl/devices with platform \"WINDOWS_PHONE\", outside the declared set {IOS, ANDROID}, returns 400 ERR_INVALID_REQUEST and creates no Device row; an implementation that stores the unknown enum value fails."
        test_recipe:
          setup:
            - "One Holder exists so that the body foreign key resolves and priority 3 is the first failing rule."
          setup_api_calls:
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { holder_id: "$.data.id" }
          trigger:
            - call: "POST /mdl/devices"
              payload: { holder_id: "${holder_id}", platform: "WINDOWS_PHONE", model_name: "Lumia", hardware_attestation_token: "att-tok-x", protection_method: "BIOMETRIC" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { err: "$.data.error_id" }
            - call: "GET /mdl/holders/${holder_id}/devices"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-001"
          assert:
            - "POST /mdl/devices status == 400"
            - "response data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /mdl/holders/${holder_id}/devices response total_count == 0"

      - name: proofing_evidence_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.ProofingEvidence
          - complexity_profile.consistency_model
        distinguishing_aspect: "ProofingEvidence is declared common_fields false, so its rows carry id and created_at but no version and no updated_at, and §1.5 exposes no update or delete endpoint for them - only POST and GET /mdl/proofing-sessions/{id}/evidence; an implementation that adds a version field to evidence rows fails."
        test_recipe:
          setup:
            - "One InteropProfile, one Holder, one COLLECTING session with a single evidence item appended."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { holder_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions"
              payload: { holder_id: "${holder_id}", requested_assurance_level: "IAL2" }
              as: ProofingAgent
              as_user_id: "pa-001"
              captures: { session_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "BIOMETRIC_MATCH", quality: "STRONG", captured_at: "2026-07-20T09:05:00Z", source_reference: "bio-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
          trigger:
            - call: "GET /mdl/proofing-sessions/${session_id}/evidence"
              payload: {}
              as: ProofingAgent
              as_user_id: "pa-001"
          assert:
            - "GET /mdl/proofing-sessions/${session_id}/evidence status == 200"
            - "len(response data) == 1"
            - "response data[0].id is a non-empty string"
            - "response data[0].created_at is a parseable ISO 8601 datetime"
            - "response data[0] has no key \"version\""
            - "response data[0] has no key \"updated_at\""
            - "response data[0].strength_points == 200"

      - name: reader_app_with_unknown_verifier_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ReaderApp.fields.verifier_id
          - validations[priority 5]
          - errors[ERR_VERIFIER_NOT_FOUND]
        distinguishing_aspect: "POST /mdl/reader-apps naming a verifier_id that matches no Verifier returns 404 ERR_VERIFIER_NOT_FOUND, because body foreign keys (priority 5) are resolved before the ownership check at priority 6 and before the trust-status check at priority 16; an implementation that returns 403 ERR_NOT_RESOURCE_OWNER or 403 ERR_VERIFIER_NOT_TRUSTED fails."
        test_recipe:
          setup:
            - "Empty database; no Verifier has ever been created."
          setup_api_calls: []
          trigger:
            - call: "POST /mdl/reader-apps"
              payload: { verifier_id: "ver-does-not-exist", app_identifier: "till-a", certificate_serial: "SER-A1", cert_not_before: "2026-07-01T00:00:00Z", cert_not_after: "2027-07-01T00:00:00Z", requested_elements: ["family_name"] }
              as: VerifierOperator
              as_user_id: "ver-does-not-exist"
              captures: { err: "$.data.error_id" }
          assert:
            - "POST /mdl/reader-apps status == 404"
            - "response data.error_id == \"ERR_VERIFIER_NOT_FOUND\""

      - name: presentation_session_joins_credential_and_reader_app_graph
        claim_type: graph_topology
        grounds:
          - complexity_profile.entity_topology
          - entities.PresentationSession.fields.credential_id
          - entities.PresentationSession.fields.reader_app_id
          - endpoints[GET /mdl/presentation-sessions]
        distinguishing_aspect: "The junction row is reachable from both arms of the graph: filtering GET /mdl/presentation-sessions by credential_id and by reader_app_id each return the same single session id; an implementation that indexes only one of the two foreign keys fails."
        test_recipe:
          setup:
            - "Full issuance chain to an ACTIVE credential on a BOUND device, plus an APPROVED verifier whose reader app is LISTED under a trust-list snapshot covering the default clock instant, and one CONSENT_PENDING presentation session."
          setup_api_calls:
            - call: "POST /mdl/interop-profiles"
              payload: { profile_code: "AAMVA-MDL-2026", standard_version: "ISO_18013_5_2021" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { profile_id: "$.data.id" }
            - call: "POST /mdl/holders"
              payload: { legal_name: "Rosa Ibarra", date_of_birth: "1990-04-11", address_line1: "18 Cedar Row", city: "Waverly", state_code: "NE", postal_code: "68462", physical_credential_number: "NE-4417820", physical_credential_expires_on: "2030-06-30" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { holder_id: "$.data.id" }
            - call: "POST /mdl/devices"
              payload: { holder_id: "${holder_id}", platform: "ANDROID", model_name: "Pixel 9", hardware_attestation_token: "att-tok-a1", protection_method: "BIOMETRIC" }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { device_id: "$.data.id" }
            - call: "POST /mdl/devices/${device_id}/attest"
              payload: { attestation_result: "PASS", secure_element_grade: "HARDWARE_STRONGBOX" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/proofing-sessions"
              payload: { holder_id: "${holder_id}", requested_assurance_level: "IAL2" }
              as: ProofingAgent
              as_user_id: "pa-001"
              captures: { session_id: "$.data.id" }
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "DOCUMENT_SCAN", quality: "STRONG", captured_at: "2026-07-20T09:00:00Z", source_reference: "doc-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/evidence"
              payload: { evidence_type: "BIOMETRIC_MATCH", quality: "STRONG", captured_at: "2026-07-20T09:05:00Z", source_reference: "bio-1" }
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/submit"
              payload: {}
              as: ProofingAgent
              as_user_id: "pa-001"
            - call: "POST /mdl/proofing-sessions/${session_id}/adjudicate"
              payload: { decision: "VERIFY" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
            - call: "GET /mdl/devices/${device_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { device_v: "$.data.version" }
            - call: "POST /mdl/credentials"
              payload: { holder_id: "${holder_id}", device_id: "${device_id}", proofing_session_id: "${session_id}", valid_from: "2026-08-01T00:00:00Z", valid_until: "2031-07-01T00:00:00Z", expected_device_version: "${device_v}" }
              as: CredentialAdjudicator
              as_user_id: "ca-001"
              captures: { credential_id: "$.data.id" }
            - call: "POST /mdl/credentials/${credential_id}/activate"
              payload: { device_unlock_proof: "BIOMETRIC" }
              as: Holder
              as_user_id: "${holder_id}"
            - call: "POST /mdl/verifiers"
              payload: { organization_name: "Prairie Cellars", category: "AGE_RESTRICTED_RETAIL", purpose_scope: ["family_name", "age_over_21"], retention_ceiling_days: 30 }
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { verifier_id: "$.data.id" }
            - call: "POST /mdl/verifiers/${verifier_id}/trust-decision"
              payload: { decision: "APPROVE" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/reader-apps"
              payload: { verifier_id: "${verifier_id}", app_identifier: "till-a", certificate_serial: "SER-A1", cert_not_before: "2026-07-01T00:00:00Z", cert_not_after: "2027-07-01T00:00:00Z", requested_elements: ["family_name", "age_over_21"], base_rate_cents: 30 }
              as: VerifierOperator
              as_user_id: "${verifier_id}"
              captures: { reader_app_id: "$.data.id" }
            - call: "POST /mdl/reader-apps/${reader_app_id}/list-decision"
              payload: { decision: "LIST" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "GET /mdl/interop-profiles/${profile_id}"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-001"
              captures: { profile_v: "$.data.version" }
            - call: "POST /mdl/trust-list-snapshots"
              payload: { interop_profile_id: "${profile_id}", effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-12-01T00:00:00Z", expected_interop_profile_version: "${profile_v}" }
              as: SystemAdmin
              as_user_id: "admin-001"
            - call: "POST /mdl/presentation-sessions"
              payload: { credential_id: "${credential_id}", reader_app_id: "${reader_app_id}", context: "ROUTINE", purpose: "age check at till", requested_elements: ["family_name", "age_over_21"], handset_handling: "NO_SURRENDER", retention_days: 7 }
              as: VerifierOperator
              as_user_id: "${verifier_id}"
              captures: { presentation_id: "$.data.id" }
          trigger:
            - call: "GET /mdl/presentation-sessions"
              payload: { credential_id: "${credential_id}" }
              as: PrivacyAuditor
              as_user_id: "pauditor-001"
            - call: "GET /mdl/presentation-sessions"
