          - errors[ERR_DUPLICATE_PERMIT]
        distinguishing_aspect: |
          Error-category pair (state, business_constraint): a duplicate
          (state_code, permit_type) permit create against a load that was replanned
          back to PLANNED violates BOTH the state precondition (permits require
          SURVEYED+) and the duplicate constraint; priority 7 beats 10, so the
          response is ERR_LOAD_INVALID_STATE, not ERR_DUPLICATE_PERMIT.
        test_recipe:
          setup:
            - "Load 96000 lbs, 150x100x400 in, states [CA], SURVEYED; one CA OVERWEIGHT permit exists in DRAFT"
            - "Load replanned back to PLANNED (survey_result reset); the duplicate CA OVERWEIGHT create carries the CURRENT load version so OCC passes and the priority conflict is reached"
          setup_api_calls:
            - { call: "POST /heavy-haul/customers", payload: { company_name: "Delta Fabrication", credit_limit_cents: 100000000 }, as: PlatformAdmin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads", payload: { cargo_description: "Girder section", gross_weight_lbs: 96000, width_in: 150, height_in: 100, length_in: 400, origin: "Lodi CA", destination: "Merced CA" }, as: Shipper, as_user_id: "${cust_id}", captures: { load_id: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "J. Fox", driver_oversize_endorsed: true }, as: Dispatcher }
            - { call: "POST /heavy-haul/loads/${load_id}/survey", payload: { route_miles: 500, states_crossed: ["CA"], min_bridge_clearance_in: 200, max_bridge_weight_lbs: 120000 }, as: Dispatcher, captures: { lv3: "$.data.version" } }
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERWEIGHT", expected_load_version: "${lv3}" }, as: PermitClerk, captures: { p_ow: "$.data.id" } }
            - { call: "POST /heavy-haul/loads/${load_id}/plan", payload: { trailer_type: "EXTENDABLE_DOUBLE_DROP", trailer_axle_count: 6, driver_name: "J. Fox", driver_oversize_endorsed: true }, as: Dispatcher, captures: { lv5: "$.data.version" } }
          trigger:
            - { call: "POST /heavy-haul/loads/${load_id}/permits", payload: { state_code: "CA", permit_type: "OVERWEIGHT", expected_load_version: "${lv5}" }, as: PermitClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_LOAD_INVALID_STATE (state priority 7 wins over business_constraint priority 10)"
            - "the same request would have matched ERR_DUPLICATE_PERMIT had the load been SURVEYED - one call, two latent failures, pinned winner"

      - name: safety_beats_fiscal_at_depart
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_ESCORT_REQUIREMENT_UNMET]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (business_safety, business_fiscal): at depart the
          escort coverage check (safety, priority 8) and the credit check (fiscal,
          priority 11) both fail - escort was cancelled after CLEARED and the
          provisional estimate 475740 exceeds remaining credit 400000; the response
          is ERR_ESCORT_REQUIREMENT_UNMET, not ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Customer credit_limit 400000; load 96000 lbs, 150x100x400 in, states [CA], fully CLEARED (estimate 475740 > 400000)"
            - "The only REAR escort booking is cancelled while the load stays CLEARED (gate does not demote)"
          setup_api_calls:
