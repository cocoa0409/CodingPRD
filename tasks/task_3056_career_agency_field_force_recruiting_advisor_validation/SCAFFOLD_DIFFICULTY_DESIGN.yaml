          Depth 4, each hop caused by the previous one: the evaluate call mutates the
          ValidationPeriod, which is what drives EmploymentContract VALIDATING->VALIDATED,
          which is what upgrades Advisor.validation_posture, which is what unlocks the
          ancestor's override accrual (an ACTION change on the DD and MD), which is what
          finally recomputes DistrictOffice.override_paid_cents. Triggering transition:
          POST /validation-periods/{id}/evaluate.
