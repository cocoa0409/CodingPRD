  # =========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier_min_audience_inclusive_boundary
        grounds:
          - calculations.tier_resolution
          - validations[priority=8]
        distinguishing_aspect: |
          Metric: declared_audience numeric threshold at tier.min_audience
          (INCLUSIVE boundary). Endpoint: POST /wire/subscriptions/{id}/activate.
          Tests that audience == min_audience selects the tier (not the next
          lower one) — precision is `>=` not `>`. Different metric and endpoint
          from instance 2 (empty-set quota check on POST /wire/publications).
        test_recipe:
          setup:
            - "Tier A: min=1, max=10000, multiplier=10000, quota=5, overage=100"
            - "Tier B: min=10000, max=50000, multiplier=15000, quota=10, overage=200"
            - "Subscriber declared_audience=10000 (exactly at tier B's min boundary)"
            - "Package base=100000"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P8", display_name: "P8", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 100000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "TA", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100, member_discount_pct: 0 }
              as: PlatformAdmin
            - call: "POST /wire/tiers"
              payload: { code: "TB", min_audience: 10000, max_audience: 50000, circulation_multiplier_basis_points: 15000, monthly_republish_quota: 10, overage_per_article_cents: 200, member_discount_pct: 0 }
              as: PlatformAdmin
              captures: { tier_b_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "Bnd", billing_email: "b@b.com", declared_audience: 10000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
          trigger:
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
          assert:
            - "Subscription.${subp_id}.tier_id == ${tier_b_id}"
            - "Subscription.${subp_id}.monthly_price_cents == 150000"

      - name: quota_exact_crossing_zero_vs_overage
        grounds:
          - calculations.compute_overage_cents
          - entities.Publication.fields.within_quota
        distinguishing_aspect: |
          Metric: empty-set/zero-count edge — when republish_count_current_month
          exactly equals monthly_republish_quota, the publication IS still
          within_quota (boundary is `<=`, not `<`). Only the (quota+1)-th
          republication in the month is billed. Endpoint: POST /wire/publications.
          Different metric and endpoint from instance 1.
        test_recipe:
          setup:
            - "Tier quota=2, overage=250; subscription ACTIVE; entitlement to F"
            - "Two published articles A1, A2, A3 on feed F"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P9", display_name: "P9", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T9", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 2, overage_per_article_cents: 250, member_discount_pct: 0 }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F9", topic: "WORLD", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "Q", billing_email: "q@q.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
            - call: "POST /wire/subscriptions/${subp_id}/entitlements"
              payload: { feed_id: "${feed_id}" }
              as: SalesOps
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "A1", body_word_count: 100, slug: "a1" }
              as: Editor
              captures: { a1: $.data.id }
            - call: "POST /wire/articles/${a1}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "A2", body_word_count: 100, slug: "a2" }
              as: Editor
              captures: { a2: $.data.id }
            - call: "POST /wire/articles/${a2}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "A3", body_word_count: 100, slug: "a3" }
              as: Editor
              captures: { a3: $.data.id }
            - call: "POST /wire/articles/${a3}/publish"
              payload: {}
              as: Editor
          trigger:
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${a1}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
              captures: { p1_within: $.data.within_quota, p1_billed: $.data.billed_amount_cents }
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${a2}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
              captures: { p2_within: $.data.within_quota, p2_billed: $.data.billed_amount_cents }
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${a3}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
              captures: { p3_within: $.data.within_quota, p3_billed: $.data.billed_amount_cents }
          assert:
            - "${p1_within} == true"
            - "${p1_billed} == 0"
            - "${p2_within} == true"
            - "${p2_billed} == 0"
            - "${p3_within} == false"
            - "${p3_billed} == 250"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: subscription_activate_depends_on_subscriber_state
        grounds:
          - state_machines.Subscription.DRAFT_to_ACTIVE
          - entities.Subscriber.fields.status
        distinguishing_aspect: |
          Pair: Subscription → Subscriber. Subscription cannot transition
          DRAFT→ACTIVE unless Subscriber.status == ACTIVE. Different pair from
          instance 2 (Publication → Entitlement).
        test_recipe:
          setup:
            - "Subscriber S in SUSPENDED state with subscription SUB in DRAFT"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P10", display_name: "P10", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T10", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100, member_discount_pct: 0 }
              as: PlatformAdmin
            - call: "POST /wire/subscribers"
              payload: { legal_name: "S", billing_email: "s@s.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v1: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/suspend"
              payload: {}
              as: SalesOps
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "GET /wire/subscribers/${sub_id}"
              payload: {}
              as: SalesOps
              captures: { sub_v2: $.data.version }
          trigger:
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v2}" }
              as: SalesOps
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_INVALID_STATE'"

      - name: publication_record_depends_on_entitlement_state
        grounds:
          - state_machines.Entitlement.LIVE_to_REVOKED
          - validations[priority=10]
        distinguishing_aspect: |
          Pair: Publication → Entitlement. Publication creation requires a LIVE
          entitlement for (subscription, feed). If entitlement was REVOKED,
          publication fails with ERR_NO_ENTITLEMENT. Different pair from
          instance 1.
        test_recipe:
          setup:
            - "Subscription SUB ACTIVE, entitlement E was granted then REVOKED"
            - "Published article A on feed F"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P11", display_name: "P11", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T11", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100, member_discount_pct: 0 }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F11", topic: "BUSINESS", embargo_window_minutes: 0 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "U", billing_email: "u@u.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
            - call: "POST /wire/subscriptions/${subp_id}/entitlements"
              payload: { feed_id: "${feed_id}" }
              as: SalesOps
              captures: { ent_id: $.data.id }
            - call: "POST /wire/entitlements/${ent_id}/revoke"
              payload: {}
              as: SalesOps
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "N", body_word_count: 100, slug: "n1" }
              as: Editor
              captures: { art_id: $.data.id }
            - call: "POST /wire/articles/${art_id}/publish"
              payload: {}
              as: Editor
          trigger:
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${art_id}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_NO_ENTITLEMENT'"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: embargo_window_blocks_republication_until_expiry
        grounds:
          - entities.Article.fields.embargo_until
          - validations[priority=5]
        distinguishing_aspect: |
          Interval semantics: half-open [published_at, embargo_until) —
          republication is REJECTED when current_utc < embargo_until, ALLOWED
          at embargo_until exactly (>=). Resource: Article. Different interval
          semantic from instance 2 (30-day notice window on Subscriber).
        test_recipe:
          setup:
            - "Feed F with embargo_window_minutes=120"
            - "Subscription SUB ACTIVE with entitlement to F, quota=5"
            - "Article A published at 2026-05-10T00:00:00Z; embargo_until = 2026-05-10T02:00:00Z"
            - "Current clock is 2026-05-10T01:00:00Z (inside embargo window)"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P12", display_name: "P12", media_rights: "TEXT_ONLY", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
              payload: { code: "T12", min_audience: 1, max_audience: 10000, circulation_multiplier_basis_points: 10000, monthly_republish_quota: 5, overage_per_article_cents: 100, member_discount_pct: 0 }
              as: PlatformAdmin
            - call: "POST /wire/feeds"
              payload: { code: "F12", topic: "NATIONAL", embargo_window_minutes: 120 }
              as: PlatformAdmin
              captures: { feed_id: $.data.id }
            - call: "POST /wire/subscribers"
              payload: { legal_name: "T", billing_email: "t@t.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id, sub_v: $.data.version }
            - call: "POST /wire/subscribers/${sub_id}/subscriptions"
              payload: { package_id: "${pkg_id}", start_at: "2026-05-10T00:00:00Z" }
              as: SalesOps
              captures: { subp_id: $.data.id }
            - call: "POST /wire/subscriptions/${subp_id}/activate"
              payload: { expected_subscriber_version: "${sub_v}" }
              as: SalesOps
            - call: "POST /wire/subscriptions/${subp_id}/entitlements"
              payload: { feed_id: "${feed_id}" }
              as: SalesOps
            - call: "POST /wire/articles"
              payload: { feed_id: "${feed_id}", headline: "EM", body_word_count: 100, slug: "em1" }
              as: Editor
              captures: { art_id: $.data.id }
            - call: "POST /wire/articles/${art_id}/publish"
              payload: {}
              as: Editor
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T01:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wire/publications"
              payload: { subscription_id: "${subp_id}", article_id: "${art_id}" }
              as: SubscriberRep
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_TEMPORAL_VIOLATION'"

      - name: termination_notice_window_requires_full_30_days
        grounds:
          - entities.Subscriber.fields.termination_notice_at
          - state_machines.Subscriber.ACTIVE_to_TERMINATED
          - validations[priority=5]
        distinguishing_aspect: |
          Interval semantics: closed 30-day notice period [notice_at, notice_at+30d]
          — termination is REJECTED when current_utc < notice_at + 30 days
          (INCLUSIVE lower bound for the termination action at exactly +30 days).
          Resource: Subscriber. Different semantic from instance 1 (half-open
          embargo window on Article).
        test_recipe:
          setup:
            - "Subscriber S ACTIVE; termination notice given at 2026-05-10T00:00:00Z"
            - "Current clock is 2026-06-08T00:00:00Z (29 days after notice; < 30 days)"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/subscribers"
              payload: { legal_name: "TN", billing_email: "tn@tn.com", declared_audience: 5000 }
              as: SalesOps
              captures: { sub_id: $.data.id }
            - call: "POST /wire/subscribers/${sub_id}/give-termination-notice"
              payload: {}
              as: SalesOps
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wire/subscribers/${sub_id}/terminate"
              payload: {}
              as: SalesOps
              captures: { err: $.data.error_id }
          assert:
            - "${err} == 'ERR_TEMPORAL_VIOLATION'"

  # =========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: member_credit_balance_conserved_through_invoice_issue_and_dismiss
        grounds:
          - calculations.member_credit_apply_to_invoice
          - state_machines.Publication.AUDIT_FLAGGED_to_DISMISSED
        distinguishing_aspect: |
          Conserved quantity: subscriber.member_credit_balance_cents plus
          invoice.member_credit_applied_cents must equal pre-issue credit
          balance; on dismiss with refund, balance increases by exactly
          publication.billed_amount_cents. Conserved quantity differs from
          instance 2 (republish count).
        test_recipe:
          setup:
            - "Member subscriber with member_credit_balance_cents = 5000"
            - "Subscription ACTIVE; 2 publications recorded; 1 over-quota (billed_amount=250)"
            - "Invoice drafted"
          setup_api_calls:
            - call: "POST /wire/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wire/packages"
              payload: { code: "P13", display_name: "P13", media_rights: "TEXT_AND_PHOTO", base_monthly_fee_cents: 10000 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /wire/tiers"
