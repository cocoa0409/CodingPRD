      - name: safety_quiet_hours_outranks_constraint_pitch_slot_overlap
        grounds:
          - validations[priority=63]
          - validations[priority=75]
          - errors[ERR_QUIET_HOURS_VIOLATION]
          - errors[ERR_PITCH_SLOT_OVERLAP]
          - calculations.pitch_slot_conflict
        distinguishing_aspect: |
          A DIFFERENT error-category pair: BUSINESS_SAFETY (priority 63, ERR_QUIET_HOURS_VIOLATION,
          422) versus BUSINESS_CONSTRAINT (priority 75, ERR_PITCH_SLOT_OVERLAP, 409). The 20:45-21:45
          request violates both on zone OT (quiet window opens at minute 1260) and safety wins with
          422; the control request at 19:30-20:30 violates only the overlap rule and returns 409,
          proving both rules were live.
