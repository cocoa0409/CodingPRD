  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: deficiency_reinspection_fail_repair_cycle
        grounds:
          - state_machines.DeficiencyItem.READY_FOR_REINSPECTION_to_IN_REPAIR
          - state_machines.DeficiencyItem.IN_REPAIR_to_READY_FOR_REINSPECTION
          - state_machines.ReinspectionVisit.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Cyclic machine on DeficiencyItem: the FAIL branch of a reinspection
          visit loops the item back READY_FOR_REINSPECTION -> IN_REPAIR, and
          the item can re-enter READY_FOR_REINSPECTION and pass on a second
          visit — an unbounded repair loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Home h1 orientation IN_PROGRESS; item d1 WARRANTABLE 20000 decided COMPLETE_BEFORE_CLOSING, repair started and completed once"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
            - { call: "POST /api/homebuyers", payload: { full_name: "Alice Avery", email: "alice@example.com" }, as: CustomerCareManager, captures: { b1: "$.data.id" } }
            - { call: "POST /api/reps", payload: { full_name: "Rita Rep", email: "rita@example.com" }, as: CustomerCareManager, captures: { r1: "$.data.id" } }
            - { call: "POST /api/homes", payload: { community_id: "${c1}", primary_buyer_id: "${b1}", lot_number: "L-101", address: "1 Riverbend Way", sales_price_cents: 45000000, closing_date: "2026-09-20T17:00:00Z" }, as: CustomerCareManager, captures: { h1: "$.data.id" } }
            - { call: "POST /api/homes/${h1}/mark-ready", payload: {}, as: CustomerCareManager }
            - { call: "POST /api/appointments", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-25T14:00:00Z" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { a1: "$.data.id" } }
            - { call: "POST /api/appointments/${a1}/confirm", payload: {}, as: CustomerCareManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T14:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/appointments/${a1}/start", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items", payload: { home_id: "${h1}", appointment_id: "${a1}", system_key: "PLUMBING", title: "Kitchen trap leaks" }, as: CustomerCareRep, as_user_id: "${r1}", captures: { d1: "$.data.id" } }
            - { call: "POST /api/deficiency-items/${d1}/classify", payload: { classification: "WARRANTABLE", estimated_repair_cost_cents: 20000 }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d1}/decide", payload: { resolution: "COMPLETE_BEFORE_CLOSING" }, as: CustomerCareManager }
            - { call: "POST /api/deficiency-items/${d1}/start-repair", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/deficiency-items/${d1}/complete-repair", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/reinspection-visits", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-26T10:00:00Z", duration_minutes: 60 }, as: CustomerCareRep, as_user_id: "${r1}", captures: { v1: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-26T10:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/reinspection-visits/${v1}/complete", payload: { results: [ { deficiency_item_id: "${d1}", outcome: "FAIL" } ] }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "GET /api/deficiency-items/${d1}", payload: {}, as: CustomerCareManager, captures: { st_after_fail: "$.data.status" } }
            - { call: "POST /api/deficiency-items/${d1}/complete-repair", payload: {}, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "POST /api/reinspection-visits", payload: { home_id: "${h1}", rep_id: "${r1}", scheduled_start: "2026-08-27T10:00:00Z", duration_minutes: 60 }, as: CustomerCareRep, as_user_id: "${r1}", captures: { v2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-27T10:00:00Z" }, as: CustomerCareManager }
            - { call: "POST /api/reinspection-visits/${v2}/complete", payload: { results: [ { deficiency_item_id: "${d1}", outcome: "PASS" } ] }, as: CustomerCareRep, as_user_id: "${r1}" }
            - { call: "GET /api/deficiency-items/${d1}", payload: {}, as: CustomerCareManager, captures: { st_after_pass: "$.data.status" } }
          assert:
            - "after FAIL: DeficiencyItem.${d1}.status == IN_REPAIR (loop back, observed ${st_after_fail})"
            - "item re-enters READY_FOR_REINSPECTION via complete-repair after the loop"
            - "after second-visit PASS: DeficiencyItem.${d1}.status == VERIFIED (observed ${st_after_pass})"

      - name: signature_signed_stale_resign_cycle
        grounds:
          - state_machines.AcknowledgmentSignature.SIGNED_to_STALE
          - state_machines.AcknowledgmentSignature.STALE_to_SIGNED
          - state_machines.Home.ACKNOWLEDGED_to_ORIENTED
        distinguishing_aspect: |
          Cyclic machine on AcknowledgmentSignature (a DIFFERENT entity than
          DeficiencyItem): signing flips home to ACKNOWLEDGED/READY_TO_CLOSE,
          identifying a new deficiency stales the signature and reverts the
          home, and the buyer can re-sign — PENDING -> SIGNED -> STALE ->
          SIGNED with the open-item snapshot refreshed from 0 to 1.
        test_recipe:
          setup:
            - "Home h1 with orientation completed, acknowledgment signed (snapshot count 0), home READY_TO_CLOSE"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "Riverbend" }, as: CustomerCareManager, captures: { c1: "$.data.id" } }
