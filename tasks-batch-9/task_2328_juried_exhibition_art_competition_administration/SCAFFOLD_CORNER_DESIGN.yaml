      - name: entry_state_check_precedes_fee_amount_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=7]
          - validations[priority=46]
          - errors[ERR_ENTRY_STATE_INVALID]
          - errors[ERR_FEE_AMOUNT_MISMATCH]
        distinguishing_aspect: "A DRAFT entry paid with a wrong amount violates the p7 state rule (409) and the p46 fiscal rule (402) at once; the state error must win, and after the entry is properly submitted the same wrong amount then surfaces the fiscal error — the two are observed on the same endpoint in one recipe."
        test_recipe:
          setup: ["Exhibition OPEN_FOR_ENTRIES; MEMBER artist from CA with one DRAFT entry holding one work plus PRIMARY image; frozen fee will be 3713."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: CallManager }
            - { call: "POST /exhibitions", payload: { title: "Regional Juried Biennial", season_year: 2026, call_opens_at: "2026-09-01T00:00:00Z", call_closes_at: "2026-10-01T00:00:00Z", notification_at: "2026-10-20T00:00:00Z", delivery_window_start_at: "2026-11-02T00:00:00Z", delivery_window_end_at: "2026-11-06T23:59:59Z", opening_at: "2026-11-12T18:00:00Z", closing_at: "2026-12-13T00:00:00Z", entry_fee_base_cents: 4500, entry_fee_additional_cents: 1500, max_dimension_cm: 200, max_weight_kg: 40, per_work_insurance_cap_cents: 5000000, allowed_media_categories: ["PAINTING", "PHOTOGRAPHY", "SCULPTURE"], eligible_state_codes: ["CA", "OR"], acceptance_capacity: 3, waitlist_capacity: 1, jury_quorum: 1, advance_score_threshold: 7.0, score_weight_technique: 0.4, score_weight_originality: 0.35, score_weight_relevance: 0.25, commission_pct: 0.35, sales_tax_pct: 0.0875, award_budget_cents: 500000, claim_deadline_days: 30, works_included_in_base: 2, member_discount_pct: 0.175, max_works_per_entry: 5, max_entries_per_artist: 1 }, as: CallManager, captures: { ex_id: $.data.id } }
            - { call: "POST /exhibitions/${ex_id}/phase-advance", payload: { target_status: "OPEN_FOR_ENTRIES" }, as: CallManager }
            - { call: "POST /artists", payload: { legal_name: "Ana Ruiz", email: "ana.ruiz@example.org", residency_state_code: "CA", member_status: "MEMBER", tax_form_on_file: true, payout_method: "ACH" }, as: CallManager, captures: { a1_id: $.data.id } }
            - { call: "POST /entries", payload: { exhibition_id: "${ex_id}", artist_id: "${a1_id}" }, as: Artist, as_user_id: "${a1_id}", captures: { e1_id: $.data.id } }
            - { call: "POST /entries/${e1_id}/artworks", payload: { title: "Ridge Line", medium_category: "PAINTING", width_cm: 90, height_cm: 60, depth_cm: 4, weight_kg: 6, year_created: 2026, declared_value_cents: 400000 }, as: Artist, as_user_id: "${a1_id}", captures: { aw_id: $.data.id } }
            - { call: "POST /artworks/${aw_id}/images", payload: { role: "PRIMARY", format: "JPEG", pixel_long_edge: 2400, pixel_short_edge: 1600, file_bytes: 3145728, color_profile: "SRGB", capture_date: "2026-08-15T00:00:00Z", credit_line: "Photo: Ana Ruiz", checksum_sha256: "va01" }, as: Artist, as_user_id: "${a1_id}" }
          trigger:
            - { call: "POST /entries/${e1_id}/fee-payment", payload: { amount_cents: 9999 }, as: Artist, as_user_id: "${a1_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /entries/${e1_id}/submit", payload: {}, as: Artist, as_user_id: "${a1_id}" }
            - { call: "POST /entries/${e1_id}/fee-payment", payload: { amount_cents: 9999 }, as: Artist, as_user_id: "${a1_id}", captures: { err2: $.data.error_id } }
          assert:
            - "the DRAFT-state payment returns HTTP 409 with error_id == ERR_ENTRY_STATE_INVALID (p7 beats p46)"
            - "Entry.${e1_id}.status is still DRAFT with entry_fee_cents == null and fee_paid_cents == 0"
            - "after submit, Entry.${e1_id}.status == PENDING_FEE and entry_fee_cents == 3713"
            - "the identical wrong amount now returns HTTP 402 with error_id == ERR_FEE_AMOUNT_MISMATCH"
            - "Entry.${e1_id}.status is still PENDING_FEE and fee_paid_cents == 0; Artwork.${aw_id}.status is still DRAFT"

