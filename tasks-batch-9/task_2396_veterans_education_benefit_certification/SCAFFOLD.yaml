    input: []
    output: YellowRibbonAgreement
    side_effects: []
  - method: GET
    path: "/yellow-ribbon-agreements"
    description: "List Yellow Ribbon agreements"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: ["academic_year?", "degree_level?", "status?", "limit?", "offset?"]
    output: YellowRibbonAgreement[]
    side_effects: []
  - method: POST
    path: "/yellow-ribbon-agreements/{id}/close"
    description: "Close a Yellow Ribbon agreement to new awards"
    roles: [SupervisorySCO]
    code: 200
    input: []
    output: YellowRibbonAgreement
    side_effects:
      - "sets status = CLOSED; later award creations are rejected with ERR_AGREEMENT_CLOSED"

  # --- EnrollmentCertification ----------------------------------------------
  - method: POST
    path: "/enrollment-certifications"
    description: "Draft an enrollment certification for a student, term and program"
    roles: [SchoolCertifyingOfficial, SupervisorySCO]
    code: 201
    input: [student_id, term_id, program_id, credit_hours_total, credit_hours_online, term_start_certified, term_end_certified]
    output: EnrollmentCertification
    side_effects:
      - "creates the certification with status = DRAFT and amount_basis = null"
      - "computes certified_days, rate_of_pursuit_pct, rop_tier_pct, training_time, modality, mha_eligible and mha_monthly_rate_cents per CALC-1"
  - method: GET
    path: "/enrollment-certifications/{id}"
    description: "Read one enrollment certification"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, StateApprovingAgent, VaProcessingOffice]
    code: 200
    input: []
    output: EnrollmentCertification
    side_effects: []
  - method: GET
    path: "/enrollment-certifications"
    description: "List enrollment certifications; every foreign key is a filter so children are reachable from any parent id"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, StateApprovingAgent, VaProcessingOffice]
    code: 200
    input: ["student_id?", "term_id?", "program_id?", "pinned_catalog_version_id?", "submitted_by_official_id?", "certified_by_official_id?", "status?", "limit?", "offset?"]
    output: EnrollmentCertification[]
    side_effects: []
  - method: PATCH
    path: "/enrollment-certifications/{id}"
    description: "Revise a DRAFT or RETURNED certification; a RETURNED certification moves back to DRAFT"
    roles: [SchoolCertifyingOfficial, SupervisorySCO]
    code: 200
    input: ["credit_hours_total?", "credit_hours_online?", "term_start_certified?", "term_end_certified?"]
    output: EnrollmentCertification
    side_effects:
      - "overwrites the supplied fields, sets status = DRAFT, clears return_reason"
      - "recomputes the CALC-1 fields"
  - method: POST
    path: "/enrollment-certifications/{id}/submit"
    description: "Submit a certification for supervisory certification; pins the effective catalog version"
    roles: [SchoolCertifyingOfficial, SupervisorySCO]
    code: 200
    input: []
    output: EnrollmentCertification
    side_effects:
      - "sets status = SUBMITTED, submitted_by_official_id = X-User-ID, pinned_catalog_version_id = the resolved effective catalog version"
      - "appends a CertificationAuditEntry with event_type = CERTIFICATION_SUBMITTED"
  - method: POST
    path: "/enrollment-certifications/{id}/return"
    description: "Return a submitted certification to the front-line official for revision"
    roles: [SupervisorySCO]
    code: 200
    input: [return_reason]
    output: EnrollmentCertification
    side_effects:
      - "sets status = RETURNED and return_reason"
      - "appends a CertificationAuditEntry with event_type = CERTIFICATION_RETURNED"
  - method: POST
    path: "/enrollment-certifications/{id}/certify"
    description: "Certify enrollment to VA. Runs CALC-2, CALC-3 variant AS_CERTIFIED and CALC-4 variant CALENDAR_FULL_TERM, and debits the student's entitlement."
    roles: [SupervisorySCO]
    code: 200
    input: []
    output: EnrollmentCertification
    side_effects:
      - "sets status = CERTIFIED, certified_by_official_id = X-User-ID, amount_basis = AS_CERTIFIED"
      - "computes mha_term_total_cents (CALC-2), net_covered_cents / ay_cap_remaining_before_cents / va_tuition_cents / cap_charged_cents / yr_gap_cents (CALC-3), entitlement_days_charged (CALC-4)"
      - "debits VeteranStudent.entitlement_days_remaining by entitlement_days_charged (INV-1)"
      - "recomputes VeteranStudent.benefit_payment_protected per CALC-7"
      - "appends a CertificationAuditEntry with event_type = CERTIFICATION_CERTIFIED"
  - method: POST
    path: "/enrollment-certifications/{id}/void"
    description: "Void a DRAFT or RETURNED certification"
    roles: [SupervisorySCO]
    code: 200
    input: []
    output: EnrollmentCertification
    side_effects:
      - "sets status = VOID (terminal)"
      - "appends a CertificationAuditEntry with event_type = CERTIFICATION_VOIDED"
  - method: POST
    path: "/enrollment-certifications/{id}/record-va-payment"
    description: "Record the tuition and housing amounts VA actually disbursed; closes the 38 USC 3679(e) protection window for this certification"
    roles: [VaProcessingOffice]
    code: 200
    input: [tuition_amount_cents, mha_amount_cents, posted_on]
    output: EnrollmentCertification
    side_effects:
      - "sets tuition_paid_cents, mha_paid_cents and tuition_payment_posted_on = posted_on"
      - "recomputes VeteranStudent.benefit_payment_protected per CALC-7"
      - "appends a CertificationAuditEntry with event_type = VA_PAYMENT_RECORDED"
  - method: GET
    path: "/enrollment-certifications/{id}/audit-entries"
    description: "Read the append-only audit trail of one certification, ascending by sequence_index"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, StateApprovingAgent, VaProcessingOffice]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: CertificationAuditEntry[]
    side_effects: []

  # --- TuitionFeeReport ------------------------------------------------------
  - method: POST
    path: "/tuition-fee-reports"
    description: "Report tuition and fees for a certification's covered portion. A new report supersedes the prior REPORTED one, so the write is guarded by optimistic concurrency on the certification's version."
    roles: [BursarOfficer]
    code: 201
    input: [certification_id, gross_tuition_cents, mandatory_fees_cents, tuition_specific_aid_cents, non_tuition_aid_cents, expected_certification_version]
    output: TuitionFeeReport
    side_effects:
      - "rejected with ERR_STALE_CERTIFICATION_VERSION (412) when expected_certification_version does not equal the certification's current version"
      - "computes net_covered_cents per CALC-3 step S1"
      - "sets any prior REPORTED report for the same certification to SUPERSEDED"
      - "writes EnrollmentCertification.net_covered_cents and increments EnrollmentCertification.version by 1"
  - method: GET
    path: "/tuition-fee-reports/{id}"
    description: "Read one tuition and fee report"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: []
    output: TuitionFeeReport
    side_effects: []
  - method: GET
    path: "/tuition-fee-reports"
    description: "List tuition and fee reports, optionally scoped to one certification"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: ["certification_id?", "status?", "limit?", "offset?"]
    output: TuitionFeeReport[]
    side_effects: []

  # --- YellowRibbonAward -----------------------------------------------------
  - method: POST
    path: "/yellow-ribbon-awards"
    description: "Match a certification's Yellow Ribbon gap against an agreement. Guarded by optimistic concurrency on the agreement's version because the write debits the shared pool."
    roles: [SupervisorySCO]
    code: 201
    input: [certification_id, agreement_id, expected_agreement_version]
    output: YellowRibbonAward
    side_effects:
      - "rejected with ERR_STALE_AGREEMENT_VERSION (412) when expected_agreement_version does not equal the agreement's current version"
      - "rejected with ERR_CERTIFICATION_NOT_CERTIFIED (409) unless certification.status == CERTIFIED, then with ERR_AGREEMENT_CLOSED (409) unless agreement.status == ACTIVE (validation priority 12)"
      - "computes yr_gap_basis_cents, per_student_remaining_before_cents, pool_remaining_before_cents, school_share_cents, va_match_cents and student_out_of_pocket_cents per CALC-3 step S8"
      - "debits YellowRibbonAgreement.pool_remaining_cents by school_share_cents, increments participant_count by 1 and increments YellowRibbonAgreement.version by 1 (INV-2)"
  - method: GET
    path: "/yellow-ribbon-awards/{id}"
    description: "Read one Yellow Ribbon award"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: []
    output: YellowRibbonAward
    side_effects: []
  - method: GET
    path: "/yellow-ribbon-awards"
    description: "List Yellow Ribbon awards, optionally scoped to one certification or agreement"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: ["certification_id?", "agreement_id?", "status?", "limit?", "offset?"]
    output: YellowRibbonAward[]
    side_effects: []
  - method: POST
    path: "/yellow-ribbon-awards/{id}/finalize"
    description: "Finalize a provisional Yellow Ribbon award once VA has confirmed the match"
    roles: [SupervisorySCO]
    code: 200
    input: []
    output: YellowRibbonAward
    side_effects:
      - "sets status = FINAL; the agreement's pool_remaining_cents and participant_count are unchanged"
  - method: POST
    path: "/yellow-ribbon-awards/{id}/reverse"
    description: "Reverse a Yellow Ribbon award and return its school share to the agreement pool"
    roles: [SupervisorySCO]
    code: 200
    input: [reversal_reason]
    output: YellowRibbonAward
    side_effects:
      - "sets status = REVERSED and reversal_reason"
      - "credits YellowRibbonAgreement.pool_remaining_cents by school_share_cents, decrements participant_count by 1 and increments the agreement's version by 1 (INV-2)"
      - "appends a CertificationAuditEntry with event_type = AWARD_REVERSED"

  # --- EnrollmentChangeReport ------------------------------------------------
  - method: POST
    path: "/enrollment-change-reports"
    description: "Report a change in enrollment against a certified certification. Scores lateness and liability per CALC-5 and opens the amendment."
    roles: [SchoolCertifyingOfficial, SupervisorySCO]
    code: 201
    input: [certification_id, change_type, effective_date, mitigating_circumstances_flag, "new_credit_hours?", "new_credit_hours_online?", "new_term_end_certified?", "punitive_grade_flag?", "disbursed_tuition_aid_cents?"]
    output: EnrollmentChangeReport
    side_effects:
      - "computes reported_on, days_late, reporting_status and liability_party per CALC-5"
      - "sets the certification's status = AMENDMENT_PENDING"
      - "appends a CertificationAuditEntry with event_type = AMENDMENT_OPENED"
      - "rejected with ERR_PROTECTED_STUDENT_PENALTY when punitive_grade_flag is true and the student is protected per CALC-7"
  - method: GET
    path: "/enrollment-change-reports/{id}"
    description: "Read one enrollment change report"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: []
    output: EnrollmentChangeReport
    side_effects: []
  - method: GET
    path: "/enrollment-change-reports"
    description: "List enrollment change reports, optionally scoped to one certification or reconciling official"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: ["certification_id?", "reconciled_by_official_id?", "change_type?", "reporting_status?", "status?", "limit?", "offset?"]
    output: EnrollmentChangeReport[]
    side_effects: []
  - method: POST
    path: "/enrollment-change-reports/{id}/reconcile"
    description: "Reconcile a reported change: recompute the certification on the AS_RECONCILED basis, restore entitlement and raise any overpayment debt (CASCADE-A)"
    roles: [SupervisorySCO]
    code: 200
    input: []
    output: EnrollmentChangeReport
    side_effects:
      - "CASCADE-A L1: status = RECONCILED, reconciled_by_official_id = X-User-ID"
      - "CASCADE-A L2: the certification is recomputed on the AS_RECONCILED basis and moves to CERTIFIED or TERMINATED"
      - "CASCADE-A L3a: VeteranStudent.entitlement_days_remaining is credited by the entitlement delta (INV-1)"
      - "CASCADE-A L3b: a BenefitDebt is created per CALC-6 when principal_cents > 0"
      - "CASCADE-A L4: VeteranStudent.open_debt_principal_cents grows for STUDENT debts, notification_due_on is stamped, and a DEBT_CREATED audit entry is appended"
      - "CASCADE-A L5: a PROVISIONAL YellowRibbonAward on the certification is reversed when the reconciled yr_gap_cents is 0"
      - "appends a CertificationAuditEntry with event_type = AMENDMENT_RECONCILED"

  # --- BenefitDebt -----------------------------------------------------------
  - method: GET
    path: "/benefit-debts/{id}"
    description: "Read one benefit debt"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice, Student]
    code: 200
    input: []
    output: BenefitDebt
    side_effects: []
  - method: GET
    path: "/benefit-debts"
    description: "List benefit debts; every foreign key is a filter. A Student may only pass their own student_id."
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice, Student]
    code: 200
    input: ["student_id?", "certification_id?", "change_report_id?", "waived_by_official_id?", "debtor_type?", "collection_status?", "notification_status?", "limit?", "offset?"]
    output: BenefitDebt[]
    side_effects: []
  - method: POST
    path: "/benefit-debts/{id}/notify"
    description: "Send the debt notification to the debtor"
    roles: [SchoolCertifyingOfficial, SupervisorySCO]
    code: 200
    input: [notification_channel]
    output: BenefitDebt
    side_effects:
      - "sets notification_status = SENT, notification_channel and notified_on = clock date"
  - method: POST
    path: "/benefit-debts/{id}/acknowledge"
    description: "Student acknowledges the debt notification"
    roles: [Student]
    code: 200
    input: []
    output: BenefitDebt
    side_effects:
      - "sets notification_status = ACKNOWLEDGED and acknowledged_on = clock date"
  - method: POST
    path: "/benefit-debts/{id}/mark-overdue"
    description: "Escalate a debt whose notification deadline has passed"
    roles: [VaProcessingOffice]
    code: 200
    input: []
    output: BenefitDebt
    side_effects:
      - "sets notification_status = OVERDUE; rejected with ERR_INVALID_REQUEST while the clock date is on or before notification_due_on"
  - method: POST
    path: "/benefit-debts/{id}/repayments"
    description: "Book a repayment against the debt, allocated tuition-component-first per the CALC-6 waterfall"
    roles: [BursarOfficer]
    code: 200
    input: [amount_cents]
    output: BenefitDebt
    side_effects:
      - "allocates the amount to tuition_repaid_cents then mha_repaid_cents, updates repaid_cents / outstanding_cents / collection_status"
      - "decreases VeteranStudent.open_debt_principal_cents for STUDENT debts"
  - method: POST
    path: "/benefit-debts/{id}/waive"
    description: "Waive the debt. The waiving official may not be the official who reconciled the change report that created it."
    roles: [SupervisorySCO]
    code: 200
    input: [waiver_reason]
    output: BenefitDebt
    side_effects:
      - "sets collection_status = WAIVED, waived_by_official_id = X-User-ID, waiver_reason, outstanding_cents = 0"
      - "decreases VeteranStudent.open_debt_principal_cents by the pre-waiver outstanding_cents for STUDENT debts"
      - "appends a CertificationAuditEntry with event_type = DEBT_WAIVED"

  # --- StudentAccountCharge --------------------------------------------------
  - method: POST
    path: "/student-account-charges"
    description: "Post a charge to the student's account. LATE_FEE and REINSTATEMENT_FEE are barred while the student is protected under 38 USC 3679(e)."
    roles: [BursarOfficer]
    code: 201
    input: [student_id, term_id, charge_type, amount_cents]
    output: StudentAccountCharge
    side_effects:
      - "creates the charge with status = POSTED"
      - "rejected with ERR_PROTECTED_STUDENT_PENALTY when charge_type IN {LATE_FEE, REINSTATEMENT_FEE} and the student is protected per CALC-7"
  - method: GET
    path: "/student-account-charges/{id}"
    description: "Read one student account charge"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: []
    output: StudentAccountCharge
    side_effects: []
  - method: GET
    path: "/student-account-charges"
    description: "List student account charges, optionally scoped to one student or term"
    roles: [SchoolCertifyingOfficial, SupervisorySCO, BursarOfficer, VaProcessingOffice]
    code: 200
    input: ["student_id?", "term_id?", "charge_type?", "limit?", "offset?"]
    output: StudentAccountCharge[]
    side_effects: []
# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not listed in the target endpoint's roles"
  - id: ERR_OFFICIAL_NOT_REGISTERED
    http: 403
    condition: "X-User-Role is SchoolCertifyingOfficial or SupervisorySCO but X-User-ID matches no CertifyingOfficial"
  - id: ERR_OFFICIAL_INACTIVE
    http: 403
    condition: "The acting CertifyingOfficial has status == INACTIVE"
  - id: ERR_OFFICIAL_LEVEL_MISMATCH
    http: 403
    condition: "The acting CertifyingOfficial's official_level does not match the claimed role tier"
  - id: ERR_STUDENT_SCOPE_VIOLATION
    http: 403
    condition: "A Student acts on or reads a resource that does not belong to the VeteranStudent identified by X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong type, undeclared enum member, out-of-range pagination, or mark-overdue before notification_due_on"
  - id: ERR_OFFICIAL_NOT_FOUND
    http: 404
    condition: "No CertifyingOfficial matches the supplied id"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "No VeteranStudent matches the supplied id"
  - id: ERR_TERM_NOT_FOUND
    http: 404
    condition: "No AcademicTerm matches the supplied id"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "No Program matches the supplied id"
  - id: ERR_CATALOG_VERSION_NOT_FOUND
    http: 404
    condition: "No CatalogVersion matches the supplied id"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No YellowRibbonAgreement matches the supplied id"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "No EnrollmentCertification matches the supplied id"
  - id: ERR_TUITION_REPORT_NOT_FOUND
    http: 404
    condition: "No TuitionFeeReport matches the supplied id"
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "No YellowRibbonAward matches the supplied id"
  - id: ERR_CHANGE_REPORT_NOT_FOUND
    http: 404
    condition: "No EnrollmentChangeReport matches the supplied id"
  - id: ERR_DEBT_NOT_FOUND
    http: 404
    condition: "No BenefitDebt matches the supplied id"
  - id: ERR_CHARGE_NOT_FOUND
    http: 404
    condition: "No StudentAccountCharge matches the supplied id"
  - id: ERR_STALE_CERTIFICATION_VERSION
    http: 412
    condition: "expected_certification_version does not equal the referenced EnrollmentCertification's current version"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version does not equal the referenced YellowRibbonAgreement's current version"
  - id: ERR_OFFICIAL_ALREADY_INACTIVE
    http: 409
    condition: "Deactivating a CertifyingOfficial whose status is already INACTIVE"
  - id: ERR_COE_ALREADY_VERIFIED
    http: 409
    condition: "Verifying a COE whose coe_status is already VERIFIED"
  - id: ERR_COE_NOT_VERIFIED
    http: 409
    condition: "Expiring a COE whose coe_status is not VERIFIED, or certifying a student whose coe_status is not VERIFIED"
  - id: ERR_TERM_ALREADY_CLOSED
    http: 409
    condition: "Closing an AcademicTerm whose status is already CLOSED"
  - id: ERR_TERM_CLOSED
    http: 409
    condition: "Submitting an EnrollmentCertification whose AcademicTerm.status is CLOSED"
  - id: ERR_AGREEMENT_ALREADY_CLOSED
    http: 409
    condition: "Closing a YellowRibbonAgreement whose status is already CLOSED"
  - id: ERR_AGREEMENT_CLOSED
    http: 409
    condition: "Creating a YellowRibbonAward against a YellowRibbonAgreement whose status is CLOSED"
  - id: ERR_CATALOG_NOT_SUBMITTABLE
    http: 409
    condition: "Submitting a CatalogVersion to the SAA from a review_status outside {DRAFT, REJECTED, SUSPENDED}"
  - id: ERR_CATALOG_NOT_PENDING_SAA
    http: 409
    condition: "Recording an SAA decision on a CatalogVersion whose review_status is not PENDING_SAA"
  - id: ERR_CATALOG_NOT_SUSPENDABLE
    http: 409
    condition: "Suspending a CatalogVersion whose review_status is outside {APPROVED, APPROVED_WITH_CONDITIONS}"
  - id: ERR_CERTIFICATION_NOT_SUBMITTABLE
    http: 409
    condition: "Submitting an EnrollmentCertification whose status is outside {DRAFT, RETURNED}"
  - id: ERR_CERTIFICATION_NOT_SUBMITTED
    http: 409
    condition: "Returning or certifying an EnrollmentCertification whose status is not SUBMITTED"
  - id: ERR_CERTIFICATION_NOT_CERTIFIED
    http: 409
    condition: "Creating a change report, recording a VA payment or creating a Yellow Ribbon award against an EnrollmentCertification whose status is not CERTIFIED, or reconciling one whose status is not AMENDMENT_PENDING"
  - id: ERR_CERTIFICATION_NOT_EDITABLE
    http: 409
    condition: "Patching or voiding an EnrollmentCertification whose status is outside {DRAFT, RETURNED}"
  - id: ERR_CERTIFICATION_TERMINAL
    http: 409
    condition: "Any state-changing operation on an EnrollmentCertification whose status is TERMINATED or VOID"
  - id: ERR_AWARD_NOT_PROVISIONAL
    http: 409
    condition: "Finalizing a YellowRibbonAward whose status is not PROVISIONAL"
  - id: ERR_AWARD_ALREADY_REVERSED
    http: 409
    condition: "Reversing a YellowRibbonAward whose status is already REVERSED"
  - id: ERR_CHANGE_REPORT_ALREADY_RECONCILED
    http: 409
    condition: "Reconciling an EnrollmentChangeReport whose status is already RECONCILED"
  - id: ERR_DEBT_ALREADY_SETTLED
    http: 409
    condition: "Repaying or waiving a BenefitDebt whose collection_status is SATISFIED or WAIVED"
  - id: ERR_DEBT_ALREADY_NOTIFIED
    http: 409
    condition: "Notifying a BenefitDebt whose notification_status is not PENDING, or marking overdue one whose notification_status is outside {PENDING, SENT}"
  - id: ERR_DEBT_NOT_NOTIFIED
    http: 409
    condition: "Acknowledging a BenefitDebt whose notification_status is outside {SENT, OVERDUE}"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The official certifying an EnrollmentCertification is the same official who submitted it"
  - id: ERR_PROGRAM_NOT_APPROVED
    http: 422
    condition: "Certifying against a Program whose approval_status is outside {APPROVED, CONDITIONAL}"
  - id: ERR_PROTECTED_STUDENT_PENALTY
    http: 422
    condition: "38 USC 3679(e) violation: posting a LATE_FEE or REINSTATEMENT_FEE charge, setting a REGISTRATION_HOLD, or filing a punitive-grade change report while the student's CALC-7 protection predicate is true"
  - id: ERR_CATALOG_COMPLIANCE_INCOMPLETE
    http: 422
    condition: "Submitting a CatalogVersion to the SAA with any of the three catalog compliance booleans false"
  - id: ERR_WAIVER_SEGREGATION
    http: 422
    condition: "The official waiving a BenefitDebt is the same official who reconciled the change report that created it"
  - id: ERR_CERTIFICATION_DEADLINE_PASSED
    http: 422
    condition: "Certifying after the term's certification_deadline"
  - id: ERR_DELIMITING_DATE_PASSED
    http: 422
    condition: "term_end_certified falls after the student's delimiting_date"
  - id: ERR_CERTIFIED_DATES_OUTSIDE_TERM
    http: 422
    condition: "The certified enrollment period is not contained in the term's start_date..end_date"
  - id: ERR_CHANGE_DATE_OUTSIDE_TERM
    http: 422
    condition: "A change report's effective_date falls outside the certified enrollment period"
  - id: ERR_OVERLAPPING_ENROLLMENT_PERIOD
    http: 409
    condition: "CLOSED-interval collision: the certified period shares at least one day, including a touching endpoint, with another SUBMITTED / CERTIFIED / AMENDMENT_PENDING certification of the same student"
  - id: ERR_CATALOG_WINDOW_OVERLAP
    http: 409
    condition: "HALF-OPEN interval collision: [effective_start, effective_end) intersects another PENDING_SAA / APPROVED / APPROVED_WITH_CONDITIONS catalog version of the same program"
  - id: ERR_CATALOG_VERSION_NOT_EFFECTIVE
    http: 422
    condition: "No approved CatalogVersion of the program covers term_start_certified under half-open semantics"
  - id: ERR_AGREEMENT_SCOPE_MISMATCH
    http: 422
    condition: "The agreement's academic_year or degree_level does not match the certification's term and program"
  - id: ERR_DUPLICATE_STUDENT_NUMBER
    http: 409
    condition: "student_number already used by another VeteranStudent"
  - id: ERR_DUPLICATE_TERM_CODE
    http: 409
    condition: "term_code already used by another AcademicTerm"
  - id: ERR_DUPLICATE_PROGRAM_CODE
    http: 409
    condition: "program_code already used by another Program"
  - id: ERR_DUPLICATE_OFFICIAL_EMAIL
    http: 409
    condition: "email already used by another CertifyingOfficial"
  - id: ERR_INVALID_TERM_DATES
    http: 422
    condition: "AcademicTerm date ordering violated (start_date >= end_date, drop_deadline outside the term, or certification_deadline before start_date)"
  - id: ERR_INVALID_CREDIT_SPLIT
    http: 422
    condition: "credit_hours_online exceeds credit_hours_total, or new_credit_hours_online exceeds new_credit_hours"
  - id: ERR_TUITION_REPORT_MISSING
    http: 422
    condition: "Certifying without a REPORTED TuitionFeeReport for the certification"
  - id: ERR_YR_INELIGIBLE_STUDENT
    http: 422
    condition: "Creating a Yellow Ribbon award for a student whose chapter is not CH33 or whose benefit_level_pct is not 100"
  - id: ERR_AWARD_ALREADY_EXISTS
    http: 409
    condition: "A PROVISIONAL or FINAL YellowRibbonAward already exists for the certification"
  - id: ERR_VA_PAYMENT_ALREADY_RECORDED
    http: 409
    condition: "Recording a VA payment on a certification whose tuition_payment_posted_on is already set"
  - id: ERR_CLOCK_REWIND
    http: 422
    condition: "to_iso8601 is earlier than the current logical clock value"
  - id: ERR_YR_PARTICIPANT_LIMIT_REACHED
    http: 409
    condition: "The agreement's participant_count already equals max_participants"
  - id: ERR_YR_POOL_EXHAUSTED
    http: 422
    condition: "The agreement's pool_remaining_cents is 0"
  - id: ERR_INSUFFICIENT_ENTITLEMENT
    http: 422
    condition: "The entitlement days the certification would charge exceed the student's entitlement_days_remaining"
  - id: ERR_REPAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "A repayment amount exceeds the debt's outstanding_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SchoolCertifyingOfficial
    description: "Front-line school certifying official who builds and submits enrollment certifications, verifies certificates of eligibility, files change reports and notifies debtors. Never certifies."
    identity: "entity_backed:CertifyingOfficial"
    exclusive_operations: []
    shared_operations:
      - "POST /veteran-students"
      - "POST /veteran-students/{id}/verify-coe"
      - "POST /enrollment-certifications"
      - "PATCH /enrollment-certifications/{id}"
      - "POST /enrollment-certifications/{id}/submit"
      - "POST /enrollment-change-reports"
      - "POST /benefit-debts/{id}/notify"
      - "all GET reads except GET /benefit-debts scoped to a Student"

  - name: SupervisorySCO
    description: "Supervisory certifying official who owns the approval side of segregation of duties: certifies, returns, voids, reconciles amendments, waives debts, and maintains terms, programs, catalog versions and Yellow Ribbon agreements."
    identity: "entity_backed:CertifyingOfficial"
    exclusive_operations:
      - "POST /academic-terms"
      - "POST /academic-terms/{id}/close"
      - "POST /programs"
      - "POST /catalog-versions"
      - "POST /catalog-versions/{id}/submit-to-saa"
      - "POST /yellow-ribbon-agreements"
      - "POST /yellow-ribbon-agreements/{id}/close"
      - "POST /enrollment-certifications/{id}/return"
      - "POST /enrollment-certifications/{id}/certify"
      - "POST /enrollment-certifications/{id}/void"
      - "POST /yellow-ribbon-awards"
      - "POST /yellow-ribbon-awards/{id}/finalize"
      - "POST /yellow-ribbon-awards/{id}/reverse"
      - "POST /enrollment-change-reports/{id}/reconcile"
      - "POST /benefit-debts/{id}/waive"
    shared_operations:
      - "POST /veteran-students"
      - "POST /veteran-students/{id}/verify-coe"
      - "POST /enrollment-certifications"
      - "PATCH /enrollment-certifications/{id}"
      - "POST /enrollment-certifications/{id}/submit"
      - "POST /enrollment-change-reports"
      - "POST /benefit-debts/{id}/notify"
      - "POST /_clock/set_current_utc"
      - "all GET reads"

  - name: BursarOfficer
    description: "Student accounts officer who prices the covered tuition portion, posts student account charges, sets and releases account holds, and books repayments."
    identity: "opaque"
    exclusive_operations:
      - "POST /tuition-fee-reports"
      - "POST /student-account-charges"
      - "POST /veteran-students/{id}/account-holds"
      - "POST /benefit-debts/{id}/repayments"
    shared_operations:
      - "GET /tuition-fee-reports, GET /tuition-fee-reports/{id}, GET /student-account-charges, GET /student-account-charges/{id}, GET /benefit-debts, GET /benefit-debts/{id}, GET /veteran-students, GET /veteran-students/{id}, GET /enrollment-certifications, GET /enrollment-certifications/{id}"

  - name: StateApprovingAgent
    description: "State Approving Agency reviewer who decides catalog version approvals and suspends previously approved catalog versions."
    identity: "opaque"
    exclusive_operations:
      - "POST /catalog-versions/{id}/saa-decision"
      - "POST /catalog-versions/{id}/suspend"
    shared_operations:
      - "GET /catalog-versions, GET /catalog-versions/{id}, GET /programs, GET /programs/{id}, GET /enrollment-certifications, GET /enrollment-certifications/{id}, GET /enrollment-certifications/{id}/audit-entries"

  - name: VaProcessingOffice
    description: "VA regional processing office operator who credentials certifying officials, expires certificates of eligibility, records actual VA disbursements, escalates unnotified debts, and advances the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /certifying-officials"
      - "POST /certifying-officials/{id}/deactivate"
      - "POST /veteran-students/{id}/expire-coe"
      - "POST /enrollment-certifications/{id}/record-va-payment"
      - "POST /benefit-debts/{id}/mark-overdue"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET reads"

  - name: Student
    description: "The veteran student, who may read their own record and their own debts and must acknowledge a debt notification."
    identity: "entity_backed:VeteranStudent"
    exclusive_operations:
      - "POST /benefit-debts/{id}/acknowledge"
    shared_operations:
      - "GET /veteran-students/{id} for their own id, GET /benefit-debts filtered to their own student_id, GET /benefit-debts/{id} for their own debts"
