            - call: "POST /repair-program/parts-orders/ffffffff-ffff-ffff-ffff-ffffffffffff/deliver"
              payload: {}
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { e4: $.data.error_id }
            - call: "POST /repair-program/parts-orders/ffffffff-ffff-ffff-ffff-ffffffffffff/core-returns"
              payload: { core_condition: "INTACT", received_at: "2026-08-01T00:00:00Z" }
              as: RepairProviderTech
              as_user_id: "u_tech_1"
              captures: { e5: $.data.error_id }
            - call: "POST /repair-program/repair-providers"
              payload: { legal_name: "Unauthorised Applicant", region_code: "US-CA", requested_access_tier: "TIER_3_STANDARD", technician_count: 4 }
              as: RepairProviderTech
