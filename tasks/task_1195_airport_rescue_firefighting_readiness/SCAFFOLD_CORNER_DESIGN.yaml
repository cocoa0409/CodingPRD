            - { call: "POST /arff/out-of-service-events/${oos1}/restore", as: ArffChief, captures: { e8: $.data.error_id } }
            - { call: "POST /arff/response-drills/${dr1}/execute", payload: { first_vehicle_arrival_seconds: 100, all_vehicles_arrival_seconds: 200 }, as: ArffChief, captures: { e9: $.data.error_id } }
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T11:30:00Z" }, as: AirportManager }
