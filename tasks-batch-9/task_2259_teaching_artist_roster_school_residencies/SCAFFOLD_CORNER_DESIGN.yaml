        grounds:
          - errors[ERR_RESIDENCY_NOT_FINALIZED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / funder_certification_gated_by_residency_finalization
          rationale: "That instance certifies only after the scope residency reaches COMPLETED, having first been refused."

      - name: blackout_date_blocks_scheduling
        claim_type: every_code_triggerable
        grounds:
          - errors[ERR_CALENDAR_BLACKOUT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / calendar_blackout_closed_interval_includes_its_end_date
          rationale: "The code is raised there on the blackout end date and released on the following day."

      - name: overlapping_artist_bookings_are_refused
        claim_type: every_code_triggerable
        grounds:
          - errors[ERR_ARTIST_SCHEDULE_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / artist_half_open_pairwise_overlap_rejects_but_abutting_allowed
          rationale: "That instance triggers the code on a true overlap and shows the abutting interval passing."

      - name: school_capacity_overflow_is_refused
        claim_type: every_code_triggerable
        grounds:
          - errors[ERR_SCHOOL_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / school_aggregate_capacity_load_at_boundary_instant
          rationale: "The third concurrent booking raises the code there, while the boundary-abutting booking is accepted."

      - name: voucher_linkage_and_period_errors
        claim_type: every_code_triggerable
        grounds:
          - errors[ERR_EVALUATION_MISSING]
          - errors[ERR_VOUCHER_PERIOD_MISMATCH]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / business_referential_precedes_business_temporal_on_voucher_open
          rationale: "Both codes are triggered there on the same voucher-open request, in their declared priority order."

  # ===========================================================================
  - section: RBAC
    instances:

      - name: curriculum_specialist_may_read_but_never_schedule
        claim_type: role_restriction
        grounds:
          - rbac.roles.CurriculumSpecialist
          - endpoints[POST /sessions]
          - endpoints[POST /sessions/{id}/confirm]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The curriculum role owns alignment yet is excluded from BOTH scheduling endpoints, while its read access to the same collection is unrestricted — so authorisation is per operation, not per entity."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; school Riverbend; DRAFT residency 'Story in Motion' (no artist needed: authorisation is decided before any body reference resolves)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /school-partners"
              payload: { name: "Riverbend Arts Academy", district_name: "Riverbend USD", grade_span: "K-8", concurrent_session_capacity: 2, total_enrollment: 600, frl_pct: 0.62, ell_pct: 0.28, iep_pct: 0.14 }
              as: ProgramDirector
              captures: { s1_id: $.data.id }
            - call: "POST /residencies"
              payload: { school_partner_id: "${s1_id}", title: "Story in Motion", discipline: "DANCE", grade_band: "G3_5", instruction_language: "es", contracted_session_count: 10, session_length_minutes: 60, budget_cents: 200000, collaboration_expectation: "OBSERVE", required_strands: ["CREATING"], term_start_date: "2026-09-08", term_end_date: "2026-12-18", enrolled_student_count: 48 }
              as: ProgramDirector
              captures: { r1_id: $.data.id }
            - call: "GET /residencies/${r1_id}"
              payload: {}
              as: CurriculumSpecialist
              captures: { rv_1: $.data.version }
          trigger:
            - call: "POST /sessions"
              payload: { residency_id: "${r1_id}", assigned_artist_id: "00000000-0000-4000-8000-0000000000aa", session_date: "2026-09-15", start_time: "09:00", end_time: "10:00", session_type: "REGULAR", expected_residency_version: "${rv_1}" }
              as: CurriculumSpecialist
              captures: { e_create: $.data.error_id }
            - call: "POST /sessions/00000000-0000-4000-8000-0000000000bb/confirm"
              payload: { classroom_teacher_name: "Ms. Delgado", co_planning_completed: true }
              as: CurriculumSpecialist
              captures: { e_confirm: $.data.error_id }
            - call: "GET /sessions"
              payload: { residency_id: "${r1_id}", limit: 10, offset: 0 }
              as: CurriculumSpecialist
              captures: { read_ok: $.data }
          assert:
            - "${e_create} == ERR_UNAUTHORIZED with HTTP status 403"
            - "${e_confirm} == ERR_UNAUTHORIZED with HTTP status 403 — authorisation (priority 2) precedes existence of the session id (priority 3)"
            - "the listing succeeds with HTTP status 200 and total_count == 0"
            - "Residency.${r1_id}.version == ${rv_1}"
            - "Residency.${r1_id}.sessions_unscheduled_count == 10"

      - name: missing_role_header_is_unauthenticated_not_unauthorized
        claim_type: role_restriction
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Priority 1 and priority 2 are separate rules with separate codes: a request with NO X-Role header is 401 ERR_UNAUTHENTICATED, while a well-formed request from a real but wrong role on the very same endpoint is 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /school-partners"
              payload: { name: "Nowhere Elementary", district_name: "Nowhere USD", grade_span: "K-5", concurrent_session_capacity: 1, total_enrollment: 300, frl_pct: 0.5, ell_pct: 0.2, iep_pct: 0.1 }
              as: NO_ROLE_HEADER
              captures: { e_unauth: $.data.error_id }
            - call: "POST /school-partners"
              payload: { name: "Nowhere Elementary", district_name: "Nowhere USD", grade_span: "K-5", concurrent_session_capacity: 1, total_enrollment: 300, frl_pct: 0.5, ell_pct: 0.2, iep_pct: 0.1 }
              as: SchoolLiaison
              captures: { e_forbidden: $.data.error_id }
          assert:
            - "${e_unauth} == ERR_UNAUTHENTICATED with HTTP status 401 (the X-Role header is absent)"
            - "${e_forbidden} == ERR_UNAUTHORIZED with HTTP status 403 (SchoolLiaison is not on POST /school-partners)"
            - "no SchoolPartner row was persisted"

