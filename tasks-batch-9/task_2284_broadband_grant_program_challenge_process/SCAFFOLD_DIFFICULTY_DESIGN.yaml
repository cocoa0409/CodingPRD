              as: Subgrantee
              as_user_id: "${s1_id}"
            - call: "POST /broadband/location-claims"
              payload: { application_id: "${a1_id}", location_id: "${l5_id}", claimed_cost_cents: 900002 }
              as: Subgrantee
              as_user_id: "${s1_id}"
            - call: "POST /broadband/applications/${a1_id}/submit"
              payload: {}
              as: Subgrantee
              as_user_id: "${s1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-06T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/close-challenge-window"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /broadband/programs/${p_id}/open-scoring"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /broadband/applications/${a1_id}"
              payload: {}
