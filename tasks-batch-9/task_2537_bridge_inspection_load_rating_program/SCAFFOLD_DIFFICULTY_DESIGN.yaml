      - name: team_leader_qualification_beats_element_quantity_mismatch
        grounds:
          - validations.priority_13_ERR_TEAM_LEADER_NOT_QUALIFIED
          - validations.priority_19_ERR_ELEMENT_QUANTITY_MISMATCH
          - calculations.qualification_status
        distinguishing_aspect: |
          One submit call violates a business_safety rule at priority 13 (the team leader's NBIS
          refresher lapsed on 2026-09-15 and the logical clock now reads 2026-10-01, so
          qualification_status is EXPIRED) and a business_constraint rule at priority 19 (the DECK row
          quantities sum to 990 against a total_quantity of 1000). The quantity arithmetic is a purely
          local check that a naive implementation runs first while iterating the element rows; the
          spec requires the qualification error, and it requires the clock - not wall time - to decide
          that the certificate has lapsed.
        test_recipe:
          setup:
            - "Ivy Inspector is created with nbis_refresher_expiry_date 2026-09-15 and team_leader_certified true; at clock 2026-09-01 she is CURRENT, so the inspection is created successfully."
            - "The DECK element condition is written with cs1 600 + cs2 200 + cs3 150 + cs4 40 = 990 against total_quantity 1000; the sum rule is only evaluated at submit, so the create succeeds."
            - "All three ROUTINE element groups are present and every cs3+cs4 row carries photos, so priorities 18 and 20 are satisfied and cannot mask the pair under test."
            - "The clock is then advanced to 2026-10-01T09:00:00Z, past the refresher expiry; inspection_date 2026-09-02T10:00:00Z stays inside the field window and before the clock, so priority 27 is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2026-09-15", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true, underwater_elements: false, fracture_critical: false }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "DECK", element_group: "DECK_GROUP", unit: "SQM", total_quantity: 1000, cs1_qty: 600, cs2_qty: 200, cs3_qty: 150, cs4_qty: 40, photo_count: 6, defect_notes: "Spalling and delamination in bay 3" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_deck_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "ABUTMENT", element_group: "SUBSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 3, cs2_qty: 1, cs3_qty: 0, cs4_qty: 0, photo_count: 1, defect_notes: "Minor map cracking" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T09:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspections/${ins_id}/submit"
              payload: { inspection_date: "2026-09-02T10:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
          assert:
            - "HTTP 422 with error_id ERR_TEAM_LEADER_NOT_QUALIFIED"
            - "NOT ERR_ELEMENT_QUANTITY_MISMATCH even though ElementCondition.${ec_deck_id} sums to 990 against total_quantity 1000"
            - "Personnel.${insp_id}.qualification_status == EXPIRED at clock 2026-10-01T09:00:00Z (it read CURRENT at 2026-09-01T00:00:00Z)"
            - "Inspection.${ins_id}.status is still DRAFT, submitted_at == null and bridge_health_index == null"
            - "Bridge.${br_id}.last_routine_inspection_date == null and bridge_health_index == null"
            - "After PUT /element-conditions/${ec_deck_id} sets cs4_qty to 50 the same submit still returns ERR_TEAM_LEADER_NOT_QUALIFIED, and only after the clock is set back to 2026-09-02T12:00:00Z does the submit succeed - the quantity fix alone never changes the outcome"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rating_factor_exactly_one_no_posting
        grounds:
          - calculations.load_rating_factor
          - calculations.posting_decision
          - entities.LoadRating.fields.posting_required
          - entities.Bridge.fields.posted_limit_tons
        distinguishing_aspect: |
          The operating rating factor lands on exactly 1.000 after ROUND_HALF_UP to three decimals
          (numerator 897.75, denominator 897.75), and the posting rule is "posting_required when the
          operating rating factor is strictly below 1.000". A sibling rating one tick lower - 0.999
          from dead loads 466.0 / 34.0 - must post. Implementations that use <= 1, that compare the
          unrounded quotient, or that round to two decimals get the boundary case wrong in exactly
          one direction, and the two ratings differ only in the third decimal place.
        test_recipe:
          setup:
            - "Baseline staff plus Rita Rating (PE-11021); Cedar Creek Bridge with one ACCEPTED ROUTINE inspection whose SUPERSTRUCTURE element group yields condition_factor_phi_c 0.85."
            - "Both load ratings are LRFR / HL93 with capacity_c_kn_m 2000, live_load_ll_kn_m 500, impact_im_factor 1.33, system_factor_phi_s 1.00 and resistance_factor_phi 0.90; only the dead loads differ."
            - "Each create needs a fresh Bridge version because the first rating bumps the bridge, so the chain re-reads GET /bridges/{id} between the two creates."
