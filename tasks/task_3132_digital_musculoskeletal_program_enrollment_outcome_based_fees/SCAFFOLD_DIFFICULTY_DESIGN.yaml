              payload: { approving_clinician_id: "${leo_id}", expected_eligibility_file_version: "${f_v}" }
              as: Clinician
              as_user_id: "${leo_id}"
            - call: "POST /msk/clients/${ks_id}/run-weekly-reconciliation"
              payload: {}
              as: ClinicalOps
            - call: "POST /msk/enrollments/${e_a}/sessions"
              payload: { session_date: "2026-09-08T09:00:00Z", session_week: 1, recorded_via: "SENSOR", planned_reps: 15, planned_minutes: 20 }
              as: EnrollmentOps
              captures: { sa1: $.data.id }
            - call: "POST /msk/enrollments/${e_b}/sessions"
              payload: { session_date: "2026-09-08T10:00:00Z", session_week: 1, recorded_via: "SENSOR", planned_reps: 15, planned_minutes: 20 }
              as: EnrollmentOps
              captures: { sb1: $.data.id }
            - call: "POST /msk/exercise-sessions/${sa1}/complete"
              payload: { completed_denominator_units: 1, pain_score_after: 6.5 }
              as: Member
              as_user_id: "${m_a}"
            - call: "POST /msk/exercise-sessions/${sb1}/complete"
              payload: { completed_denominator_units: 1, pain_score_after: 5.5 }
              as: Member
              as_user_id: "${m_b}"
            - call: "POST /msk/clients/${ks_id}/run-weekly-reconciliation"
