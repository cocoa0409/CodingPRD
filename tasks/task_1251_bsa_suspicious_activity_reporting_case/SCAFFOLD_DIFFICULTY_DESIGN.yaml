# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 9 rules x >=2 instances; every setup_api_calls chain drives empty-DB -> setup
# state using only §1.5 endpoints. All numeric asserts were pre-computed by
# executing the §1.3 formulas (decimal, round_half_up).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: alert_score_tuned_vs_baseline_diverge
        grounds: [calculations.alert_risk_score, entities.Alert.fields.risk_score, entities.Alert.fields.baseline_score, entities.MonitoringScenario.fields.baseline_weight_amount]
        distinguishing_aspect: "Dual-variant logic on the ALERT domain: identical transactions yield alert.risk_score == 48 under the ACTIVE tuned threshold weights (0.6/0.25/0.15) but alert.baseline_score == 47 under the scenario baseline weights (0.5/0.3/0.2); both variants are stored on the same alert and differ by exactly 1."
        test_recipe:
          setup:
            - "Scenario STRUCT-CASH-7D ACTIVE with ACTIVE threshold v1 (threshold 1000000 cents, lookback 7d, min_count 3, tuned weights 0.6/0.25/0.15) and baseline weights 0.5/0.3/0.2"
            - "Account holds exactly 3 matching CASH_DEPOSIT CREDIT transactions in the window (2026-05-03, 2026-05-10]: 400000 (US), 400000 (US), 200000 (IR high-risk) — aggregate 1000000, count 3, geo fraction 1/3"
            - "Logical clock at 2026-05-10T00:00:00Z"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-1001" }, as: ComplianceAdmin, captures: { ac1: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT", baseline_weight_amount: 0.5, baseline_weight_velocity: 0.3, baseline_weight_geo: 0.2, stale_alert_days: 30 }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.6, weight_velocity: 0.25, weight_geo: 0.15, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Raised amount weight after Q1 backtest", backtest_precision: 0.81, backtest_recall: 0.66 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-04T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-05T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 200000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "IR", posted_at: "2026-05-06T10:00:00Z", channel: "ONLINE" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${ac1}" }, as: ComplianceAdmin, captures: { al1: $.data.alert_id } }
            - { call: "GET /alerts/${al1}", as: BSAAnalyst, as_user_id: "${an1}" }
          assert:
            - "Alert.${al1}.risk_score == 48 (TUNED: round4(0.6*0.5)+round4(0.25*0.5)+round4(0.15/3) = 0.3000+0.1250+0.0500 = 0.4750 -> 47.5 -> 48)"
            - "Alert.${al1}.baseline_score == 47 (BASELINE: 0.2500+0.1500+0.0667 = 0.4667 -> 46.67 -> 47)"
            - "Alert.${al1}.risk_score - Alert.${al1}.baseline_score == 1"
            - "Alert.${al1}.aggregate_amount_cents == 1000000 and Alert.${al1}.txn_count == 3"
            - "Alert.${al1}.scenario_threshold_id == ${th1} (version pinned at generation)"
            - "Alert.${al1}.status == NEW"

      - name: customer_risk_standard_vs_enhanced_diverge
        grounds: [calculations.customer_risk_rating_recompute, entities.Customer.fields.risk_score_standard, entities.Customer.fields.risk_score_enhanced, entities.Customer.fields.risk_rating]
        distinguishing_aspect: "Dual-variant logic on the CUSTOMER domain (distinct from the Alert domain instance): identical facts (3 open LE inquiries) yield risk_score_standard == 550 and rating HIGH for a LOW-risk-country customer, but risk_score_enhanced == 825 and rating PROHIBITED for a HIGH-risk-country customer — same inputs, different variant, different rating band."
        test_recipe:
          setup:
            - "Customer A (country_code US, country_risk LOW) and Customer B (country_code IR, country_risk HIGH) each have exactly 3 open LawEnforcementInquiries and no SARs/exits"
            - "Logical clock at default 2026-05-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Pat Lowrisk", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cuA: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Harriet Highrisk", country_code: "IR", country_risk: "HIGH" }, as: ComplianceAdmin, captures: { cuB: $.data.id } }
            - { call: "POST /law-enforcement-inquiries", payload: { agency_name: "FBI", inquiry_reference: "LE-A-1", subject_customer_id: "${cuA}" }, as: ComplianceAdmin }
            - { call: "POST /law-enforcement-inquiries", payload: { agency_name: "IRS-CI", inquiry_reference: "LE-A-2", subject_customer_id: "${cuA}" }, as: ComplianceAdmin }
            - { call: "POST /law-enforcement-inquiries", payload: { agency_name: "DEA", inquiry_reference: "LE-A-3", subject_customer_id: "${cuA}" }, as: ComplianceAdmin }
            - { call: "POST /law-enforcement-inquiries", payload: { agency_name: "FBI", inquiry_reference: "LE-B-1", subject_customer_id: "${cuB}" }, as: ComplianceAdmin }
            - { call: "POST /law-enforcement-inquiries", payload: { agency_name: "IRS-CI", inquiry_reference: "LE-B-2", subject_customer_id: "${cuB}" }, as: ComplianceAdmin }
            - { call: "POST /law-enforcement-inquiries", payload: { agency_name: "DEA", inquiry_reference: "LE-B-3", subject_customer_id: "${cuB}" }, as: ComplianceAdmin }
          trigger:
            - { call: "GET /customers/${cuA}", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "GET /customers/${cuB}", as: BSAAnalyst, as_user_id: "${an1}" }
          assert:
            - "Customer.${cuA}.risk_score_standard == 550 (100 + 3*150) and risk_score_enhanced == 825 (round_half_up(550*1.5))"
            - "Customer.${cuA}.risk_rating == HIGH (applicable STANDARD 550 in [400,700))"
            - "Customer.${cuB}.risk_score_standard == 550 and risk_score_enhanced == 825"
            - "Customer.${cuB}.risk_rating == PROHIBITED (applicable ENHANCED 825 >= 700) — same facts, different variant, different band"
            - "Customer.${cuA}.open_le_inquiry_count == 3 and Customer.${cuB}.open_le_inquiry_count == 3"

  - rule_id: combinatorial_formula
    instances:
      - name: alert_score_component_rounding_order
        grounds: [calculations.alert_risk_score]
        distinguishing_aspect: "Mode (b) nested rounding: the pinned order (round each component to 4dp, then sum, scale, round) yields risk_score == 48 for aggregate 1033320/count 3/geo 1-of-3 under weights 0.5/0.3/0.2, while the forbidden sum-then-round order yields 47 — the 4dp pre-rounding of the geo component (0.0666... -> 0.0667) is what pushes 47.49966... up to 47.50."
        test_recipe:
          setup:
            - "Scenario STRUCT-CASH-7D ACTIVE; ACTIVE threshold v1 has weights 0.5/0.3/0.2 equal to the scenario baseline weights; threshold 1000000, lookback 7, min_count 3"
            - "Account holds 3 matching txns in (2026-05-03, 2026-05-10]: 400000 + 400000 + 233320 = 1033320 cents; exactly 1 of 3 with counterparty_country IR"
            - "Clock at 2026-05-10T00:00:00Z"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-2001" }, as: ComplianceAdmin, captures: { ac1: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT", baseline_weight_amount: 0.5, baseline_weight_velocity: 0.3, baseline_weight_geo: 0.2 }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.75, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-04T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-05T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 233320, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "IR", posted_at: "2026-05-06T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${ac1}" }, as: ComplianceAdmin, captures: { al1: $.data.alert_id } }
            - { call: "GET /alerts/${al1}", as: BSAAnalyst, as_user_id: "${an1}" }
          assert:
            - "Alert.${al1}.aggregate_amount_cents == 1033320 and txn_count == 3"
            - "Alert.${al1}.risk_score == 48 — pinned order: round4(0.5*0.51666)=0.2583, round4(0.3*0.5)=0.1500, round4(0.2/3)=0.0667; sum 0.4750 -> 47.50 -> round_half_up 48"
            - "Alert.${al1}.risk_score != 47 — the sum-then-round order (0.47499666... -> 47.49966...) would yield 47 and is non-conformant"

      - name: sar_deadline_conditional_branches
        grounds: [calculations.sar_filing_deadline, entities.SARReport.fields.deadline_at, entities.Case.fields.initial_detection_at]
        distinguishing_aspect: "Mode (a) combinatorial branching over >=3 inputs (is_continuing x subject_unidentified x detection source): an initial SAR with an identified subject gets detection+30d (2026-05-31), an unidentified subject adds the conditional 30d extension (2026-06-30), and a continuing SAR ignores detection entirely and uses prior_filed_at+120d (2026-09-02) while its review due_at is prior_filed_at+90d (2026-08-03) — four different dates from one formula."
        test_recipe:
          setup:
            - "Case C1 for customer with one LINKED alert created at clock default 2026-05-01T00:00:00Z (initial_detection_at == 2026-05-01); SAR1 created with subject_unidentified=false, activity [2026-03-10, 2026-04-10]"
            - "Case C2 for the same customer, no alerts (initial_detection_at == case created_at == 2026-05-01); SAR2 created with subject_unidentified=true, activity [2026-04-11, 2026-05-01]"
            - "SAR1 filed at 2026-05-05T00:00:00Z, case C1 QA-closed, its continuing review completed with FILE_CONTINUING_SAR producing SAR3"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Quinn QA", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { qa1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-3001" }, as: ComplianceAdmin, captures: { ac1: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT" }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.7, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 500000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-28T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 500000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-29T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 300000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-30T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${ac1}", evaluated_at: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin, captures: { al1: $.data.alert_id } }
            - { call: "POST /alerts/${al1}/triage", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases", payload: { customer_id: "${cu1}", source_alert_id: "${al1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { c1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { c2: $.data.id } }
            - { call: "POST /alerts/${al1}/link-to-case", payload: { case_id: "${c1}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { c1_v: $.data.version } }
            - { call: "POST /cases/${c1}/sar-decision", payload: { decision: "SAR_REQUIRED", decision_rationale: "Structured cash deposits under reporting threshold", expected_case_version: "${c1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c1}/sar-reports", payload: { activity_start_date: "2026-03-10", activity_end_date: "2026-04-10", subject_unidentified: false }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar1: $.data.id, sar1_v: $.data.version, sar1_deadline: $.data.deadline_at } }
            - { call: "PUT /sar-reports/${sar1}/narrative", payload: { narrative: "Narrative: Between 2026-03-10 and 2026-04-10 the subject account received a pattern of cash deposits in amounts between 300000 and 500000 cents, each below the 1000000-cent reporting threshold, aggregating 1300000 cents across three branch and ATM visits within seven days. The customer could not explain the source of funds when contacted, the stated occupation is inconsistent with cash-intensive activity, and the deposits were followed by rapid transfers out of the account. This activity is consistent with structuring designed to evade currency transaction reporting requirements under 31 USC 5324 and is being reported as suspicious.", expected_sar_version: "${sar1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar1}/submit-qa", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /sar-reports/${sar1}/qa-review", payload: { outcome: "PASS", notes: "Narrative complete" }, as: QAReviewer, as_user_id: "${qa1}" }
            - { call: "POST /sar-reports/${sar1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /sar-reports/${sar1}/file", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c1}/qa-review", payload: { outcome: "PASS", notes: "Filed timely" }, as: QAReviewer, as_user_id: "${qa1}" }
            - { call: "GET /sar-reports/${sar1}/continuing-reviews", as: BSAAnalyst, as_user_id: "${an1}", captures: { rev1: "$.data[0].id" } }
            - { call: "POST /continuing-reviews/${rev1}/start", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /continuing-reviews/${rev1}/complete", payload: { outcome: "FILE_CONTINUING_SAR" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar3: $.data.created_continuing_sar_id } }
            - { call: "POST /cases/${c2}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c2}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { c2_v: $.data.version } }
            - { call: "POST /cases/${c2}/sar-decision", payload: { decision: "SAR_REQUIRED", decision_rationale: "Subject unidentified; continuing structured activity suspected", expected_case_version: "${c2_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c2}/sar-reports", payload: { activity_start_date: "2026-04-11", activity_end_date: "2026-05-01", subject_unidentified: true }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar2: $.data.id, sar2_deadline: $.data.deadline_at } }
          trigger:
            - { call: "GET /sar-reports/${sar1}", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "GET /sar-reports/${sar2}", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "GET /sar-reports/${sar3}", as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "GET /continuing-reviews/${rev1}", as: BSAAnalyst, as_user_id: "${an1}" }
          assert:
            - "SARReport.${sar1}.deadline_at == 2026-05-31T00:00:00Z (initial, identified: detection 2026-05-01 + 30d)"
            - "SARReport.${sar2}.deadline_at == 2026-06-30T00:00:00Z (initial, subject_unidentified: detection + 30d + 30d extension)"
            - "SARReport.${sar3}.deadline_at == 2026-09-02T00:00:00Z (continuing: prior filed_at 2026-05-05 + 120d; detection date ignored)"
            - "SARReport.${sar3}.is_continuing == true and SARReport.${sar3}.prior_sar_id == ${sar1}"
            - "ContinuingReview.${rev1}.due_at == 2026-08-03T00:00:00Z (filed + 90d) and filing_deadline_at == 2026-09-02T00:00:00Z (filed + 120d)"
      - name: qa_quota_pool_snapshot_order
        grounds: [calculations.qa_sample_quota, entities.QAReview.fields.period_month, "validations[priority=16]"]
        distinguishing_aspect: "Mode (c) circular-looking dependency: the monthly quota must be computed from the completion pool counted BEFORE and INDEPENDENTLY of sampling state, so with 6 May completions the quota is clamp(ceil(6*0.34),1,25) == 3 and a third sample succeeds; an implementation that subtracts already-sampled items from the pool recomputes ceil(5*0.34) == 2 after the first sample and wrongly rejects the third."
        test_recipe:
          setup:
            - "Six cases for one customer, each driven create -> assign -> start -> decision NO_SAR -> qa PASS to CLOSED, all within logical month 2026-05 (default clock 2026-05-01T00:00:00Z)"
            - "completed_in_month == 6, so monthly_quota == 3"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Quinn QA", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { qa1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { k1: $.data.id } }
            - { call: "POST /cases/${k1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${k1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { k1_v: $.data.version } }
