      - name: billing_sweep_boards_members_only_from_the_departure_date
        claim_type: conditional_action
        grounds:
          - state_machines.Member.CONTRACTED_to_ON_TOUR
          - endpoints.POST_/seasons/{season_id}/run-billing-cycle
          - entities.Season.fields.billing_epoch
        distinguishing_aspect: "The sweep is a multi-purpose conditional action: on 2027-06-11 it must increment billing_epoch and touch nothing else, and on 2027-06-12 — the tour_departure_date itself, an inclusive comparison — it must board the CONTRACTED member. With the first installment not due until 2027-07-15, neither sweep may assess a late fee, which separates the boarding rule from the delinquency rule."
        test_recipe:
          setup:
            - "A member holds an EXECUTED 399900 STANDARD_3 contract and an ACTIVE plan whose first installment falls on 2027-07-15. The clock is moved to the day before departure."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "POST /members/${member_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 90 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_id}", tuition_amount_cents: 399900, payment_plan_type: "STANDARD_3" }
              as: MembershipCoordinator
              captures: { contract_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_id}/sign"
              payload: { signature_name: "Avery Nakamura" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /member-contracts/${contract_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "GET /members/${member_id}"
              as: BusinessManager
              captures: { member_v: "$.data.version" }
            - call: "POST /payment-plans"
              payload: { member_id: "${member_id}", member_contract_id: "${contract_id}", first_due_date: "2027-07-15", expected_member_version: "${member_v}" }
              as: BusinessManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-11T12:00:00Z" }
              as: BusinessManager
          trigger:
            - call: "POST /seasons/${season_id}/run-billing-cycle"
              payload: {}
              as: BusinessManager
              captures: { epoch_after_first: "$.data.billing_epoch" }
            - call: "GET /members/${member_id}"
              as: BusinessManager
              captures: { status_before_departure: "$.data.membership_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-12T00:00:00Z" }
              as: BusinessManager
            - call: "POST /seasons/${season_id}/run-billing-cycle"
              payload: {}
              as: BusinessManager
              captures: { epoch_after_second: "$.data.billing_epoch" }
          assert:
            - "${epoch_after_first} == 1 and ${status_before_departure} == CONTRACTED — one day early the boarding condition is false"
            - "${epoch_after_second} == 2 and Member.${member_id}.membership_status == ON_TOUR — the comparison is >= tour_departure_date, so the departure date itself boards the member"
            - "PaymentPlan.${plan_id}.installments_due_count == 0, arrears_cents == 0, late_fee_accrued_cents == 0, delinquency_strikes == 0 and status == ACTIVE after both sweeps"
            - "Season.${season_id}.tuition_charged_cents == 399900 — the CONTRACTED-to-ON_TOUR move does not change the charged rollup because both statuses are inside its input set"

      - name: site_booking_link_requires_every_reference_to_resolve
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/site-bookings
