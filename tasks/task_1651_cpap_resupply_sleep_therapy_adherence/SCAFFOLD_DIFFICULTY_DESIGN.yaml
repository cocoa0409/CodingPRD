              payload: { patient_id: "${pat15}", component_supply_plan_id: "${mask15}", requested_quantity: 1, expected_patient_version: "${pat15_v3}" }
              as: IntakeCoordinator
              captures: { overlap_err: $.data.error_id }
          assert:
            - "second dispense on 2026-10-29 rejected: ${overlap_err} == 'ERR_CADENCE_NOT_MET'   # interval [2026-08-01, 2026-10-30) still occupied"

      - name: mask_exchange_window_rolling_anchor_aggregate_capacity
        grounds:
          - calculations.mask_exchange_window_check
          - entities.MaskExchange.fields.window_anchor_on
          - entities.MaskExchange.fields.superseded_by_exchange_id
        distinguishing_aspect: |
          Interval semantics = aggregate-capacity rolling window on resource
          Patient's mask-exchange quota. The window anchor stays FIXED while
          the current window is open (current_date <= anchor + window_days)
          and ROLLS forward to the latest completed_on only when a new
          exchange is requested after the prior window has expired. This
          rolling-with-capacity semantic differs from component cadence's
          fixed half-open arithmetic: the same Patient resource can have
          multiple sequential windows with independent quotas.
        test_recipe:
          setup:
            - "PayerPolicy p1 mask_exchange_window_days=30, max_exchanges_per_window=2; Patient pat16 RENTAL setup 2026-08-01"
            - "Window 1 (anchor 2026-08-01): Exchange A completed 2026-08-10, Exchange B completed 2026-08-15 — quota of 2 consumed"
            - "Advance clock past window 1 expiry (2026-09-01 > 2026-08-31)"
            - "Exchange C requested 2026-09-05 — new window rolls, anchor = B.completed_on = 2026-08-15 (per rolling rule); but since current_date > A.window_anchor_on + 30 the anchor rolls; C's effective anchor is 2026-08-15"
            - "Exchange C completed 2026-09-06"
            - "Exchange D requested 2026-09-10 — same window as C (anchor 2026-08-15, expires 2026-09-14); only C has completed in this window (1 < 2), so approve succeeds"
          setup_api_calls:
            - call: "POST /sleep-therapy/_clock/set_current_utc"
