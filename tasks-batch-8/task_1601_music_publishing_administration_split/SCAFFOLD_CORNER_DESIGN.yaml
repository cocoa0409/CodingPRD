            - { call: "POST /society-registrations", payload: { work_id: "${k}", society_id: "${soc}" }, as: CopyrightSpecialist, captures: { reg: $.data.id } }
            - { call: "POST /society-registrations/${reg}/submit", payload: {}, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/acknowledge", payload: { society_work_number: "880000300" }, as: CopyrightSpecialist }
            - { call: "POST /society-registrations/${reg}/register", payload: { iswc: "T-900000300-1" }, as: CopyrightSpecialist }
            - { call: "POST /sub-publishers", payload: { name: "US Sub", home_territory_code: "US" }, as: PublisherAdmin, captures: { sp: $.data.id } }
            - { call: "POST /sub-publishing-agreements", payload: { sub_publisher_id: "${sp}", territory_codes: ["US"], income_types: ["PERFORMANCE"], retention_bp: 1500, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PublisherAdmin, captures: { ag: $.data.id } }
            - { call: "POST /sub-publishing-agreements/${ag}/activate", payload: {}, as: PublisherAdmin }
            - { call: "POST /licensees", payload: { name: "StreamCo", licensee_type: "STREAMING" }, as: PublisherAdmin, captures: { lic: $.data.id } }
            - { call: "POST /royalty-statements", payload: { source_type: "LICENSEE", source_id: "${lic}", income_type: "PERFORMANCE", territory_code: "US", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", gross_amount_cents: 3333, lines: [ { line_number: 1, reported_title: "Retention Song", reported_work_code: "${k_code}", gross_cents: 3333 } ] }, as: RoyaltyAnalyst, captures: { st: $.data.id } }
            - { call: "POST /royalty-statements/${st}/match", payload: {}, as: RoyaltyAnalyst }
          trigger:
            - { call: "POST /royalty-statements/${st}/allocate", payload: {}, as: RoyaltyAnalyst, captures: { ret: $.data.retained_cents, tot: $.data.allocated_total_cents } }
            - { call: "GET /allocation-lines?statement_id=${st}", as: RoyaltyAnalyst, captures: { a0: "$.data[0].provisional_amount_cents", a1: "$.data[1].provisional_amount_cents" } }
          assert:
            - "${ret} == 499 (floor(3333 * 1500/10000) = floor(499.95))"
            - "${a0} == 1417 (writer pool floor(2834/2)) and ${a1} == 1417 (publisher pool 2834-1417)"
            - "${tot} == 2834 and 499 + 2834 + 0 == 3333 (gross conserved)"

