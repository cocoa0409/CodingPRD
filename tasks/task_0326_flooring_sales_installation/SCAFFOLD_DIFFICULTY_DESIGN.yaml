      - name: job_single_occupancy_closed_interval_overlap_rejected
        grounds:
          - validations[priority=15]
          - entities.InstallSlot.fields.job_id
          - entities.InstallSlot.fields.start_at
        distinguishing_aspect: "Single-occupancy closed-interval semantics on the Job resource (a different resource entity than the InstallCrew buffer rule): one ACCEPTED job already has a SCHEDULED slot 09:00-12:00 on crew A; a second slot for the SAME job on a different crew B at 11:00-13:00 shares [11:00,12:00] and is rejected ERR_JOB_SLOT_OVERLAP — closed-interval intersection on Job, not the crew buffer/half-open arithmetic of instance one."
        test_recipe:
          setup:
            - "One ACCEPTED CARPET job; two CARPET crews A and B each with ample capacity and buffer 0; the job's first slot 09:00-12:00 on crew A is SCHEDULED; a second slot for the same job on crew B at 11:00-13:00 overlaps in time."
