  # =========================================================================
  # RULE 5 - priority_pair_validation_conflict
  # Three conflicts, each on a DIFFERENT ERROR-CATEGORY PAIR:
  #   5A -> state (45) vs business_constraint (68)
  #   5B -> business_safety (62) vs business_fiscal (100)
  #   5C -> business_temporal (76) vs business_constraint (80)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: expired_check_state_error_outranks_unlicensed_state_business_constraint
        grounds:
          - validations[priority=45]
          - validations[priority=68]
          - calculations.eligibility_certification_validity
          - entities.Provider.fields.licensed_state_codes
        distinguishing_aspect: |
          The category pair here is state x business_constraint: one POST
          /lifeline/enrollments simultaneously violates priority 45
          (ERR_ELIGIBILITY_CHECK_EXPIRED, category state) and priority 68
          (ERR_PROVIDER_NOT_LICENSED_IN_STATE, category business_constraint) and MUST return
          ERR_ELIGIBILITY_CHECK_EXPIRED, while a control request that violates only 68
          proves the licensing rule really was live.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Provider licensed ONLY in NM with enrollment_cap 50, ACTIVE."
            - "Subscriber S1 at a TX address with an ELIGIBLE_CONFIRMED check confirmed 2026-08-01, so expires_at is 2026-10-30T00:00:00Z."
            - "Clock then moved to 2026-10-30T00:00:00.001Z - one millisecond past the inclusive expiry."
            - "Subscriber S2 at a second TX address with a check confirmed AFTER the clock move, therefore unexpired."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143010", study_area_code: "489010", licensed_state_codes: ["NM"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_a_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", unit_designator: "Apt 4B", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-I1" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk1_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk1_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00.001Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "450 Yandell Dr", unit_designator: "Unit 12", city: "El Paso", state_code: "TX", postal_code: "79902" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { addr2_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Bea Tso", date_of_birth: "1975-09-02", last4_ssn: "8823", address_id: "${addr2_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000, qualifying_benefit: "NONE", tribal_lands_flag: false }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub2_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-I2" }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { chk2_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk2_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
          trigger:
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub1_id}", provider_id: "${prov_a_id}", eligibility_check_id: "${chk1_id}", certified_address_id: "${addr1_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${prov_a_id}"
              captures: { dual_err: $.data.error_id }
            - call: "POST /lifeline/enrollments"
