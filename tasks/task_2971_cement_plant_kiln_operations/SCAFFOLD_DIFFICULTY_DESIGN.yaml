      - name: requarantine_withdrawal_cascades_three_hops_into_plant_production_posture
        grounds: >
          §1.2 KilnRun's RELEASED -> QUARANTINED transition declares hop 1 (clinker
          Silo.unreleased_tonnes += clinker_tonnes, available_tonnes recomputed downward), hop 2
          (every PLANNED CementBatch on that silo whose clinker_tonnes_drawn now exceeds
          available_tonnes moves to feed_state FEED_SHORT and releases its reservation, walked
          created_at ASC), and hop 3 (Plant.production_posture = CONSTRAINED).
        distinguishing_aspect: >
          A one-hop implementation only bumps unreleased_tonnes, so batch B2 stays FEED_READY with a
          500.00 t reservation against clinker that is no longer sellable and start-grinding still
          succeeds. The correct end state is B2 feed_state FEED_SHORT, SC1.reserved_tonnes 0.00 and
          Plant.production_posture CONSTRAINED, with start-grinding refused by
          ERR_BATCH_FEED_SHORT.
        test_recipe:
          setup: >
            Run R0 completed and released (SC1: on_hand 583.78, unreleased 0.00, available 583.78),
            then batch B2 planned for 500.00 t of that clinker (SC1: reserved 500.00, available
            83.78). Plant.production_posture is NORMAL. LAB1 then records a failing free lime of
            1.62 on the already-released run.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
