              as_user_id: "u-dir-01"
            - call: "POST /studio/director-notes"
              payload: { review_session_id: "${session_id}", shot_stage_task_id: "${t_layout_id}", severity: "MAJOR", note_text: "Re-block the entire opening beat." }
              as: Director
              as_user_id: "u-dir-01"
              captures: { note_major_id: "$.data.id" }
            - call: "POST /studio/director-notes"
              payload: { review_session_id: "${session_id}", shot_stage_task_id: "${t_layout_id}", severity: "MINOR", note_text: "Prop label is misspelled." }
              as: Director
              as_user_id: "u-dir-01"
              captures: { note_minor_id: "$.data.id" }
          trigger:
            - call: "POST /studio/review-sessions/${session_id}/close"
              payload: {}
              as: Director
              as_user_id: "u-dir-01"
              captures: { s_status: "$.data.status", s_notes: "$.data.note_count", s_retakes: "$.data.retake_issued_count" }
            - call: "GET /studio/director-notes/${note_major_id}"
              as: Director
              captures: { n_major_status: "$.data.status" }
            - call: "GET /studio/director-notes/${note_minor_id}"
              as: Director
              captures: { n_minor_status: "$.data.status" }
            - call: "GET /studio/stage-tasks/${t_layout_id}"
              as: ProductionManager
              captures: { t_status: "$.data.status", t_rev: "$.data.revision_count", t_esc: "$.data.escalated" }
            - call: "GET /studio/shots/${shot_id}"
              as: ProductionManager
              captures: { sh_status: "$.data.status", sh_retakes: "$.data.retake_count", sh_esc: "$.data.escalation_flag" }
            - call: "GET /studio/productions/${prod_id}"
              as: ProductionManager
              captures: { p_retakes: "$.data.total_retake_count", p_at_risk: "$.data.at_risk_shot_count", p_completed: "$.data.completed_shot_count" }
          assert:
            - "${rev_after_1} == 1 and ${esc_after_1} == false"
            - "${rev_after_2} == 2 and ${esc_after_2} == false"
            - "${task_status_approved} == APPROVED"
            - "${s_status} == CLOSED, ${s_notes} == 2, ${s_retakes} == 1 (only the MAJOR note issued a retake)"
            - "${n_major_status} == RETAKE_ISSUED"
            - "${n_minor_status} == OPEN (link 1 never reaches a MINOR note)"
            - "${t_status} == RETAKE, ${t_rev} == 3, ${t_esc} == true (link 2 plus the >= 3 escalation latch)"
            - "${sh_status} == IN_PRODUCTION, ${sh_retakes} == 3, ${sh_esc} == true (link 3)"
            - "${p_retakes} == 3, ${p_at_risk} == 1, ${p_completed} == 0 (link 4)"
      - name: design_gate_approval_activates_production_and_unblocks_shots
        grounds:
          - state_machines.PreProductionGate.IN_REVIEW_to_APPROVED
          - state_machines.Production.PRE_PRODUCTION_to_PRODUCTION_ACTIVE
          - state_machines.PreProductionGate.APPROVED_to_LOCKED
          - state_machines.Shot.BLOCKED_PREPROD_to_READY
        distinguishing_aspect: |
          Depth-3 chain over a fan-out: approving the last gate activates the production (link 1), the
          activation locks every approved gate of that production (link 2) and simultaneously releases all
          of its BLOCKED_PREPROD shots to READY (link 3). One request mutates four rows across three tables.
        test_recipe:
          setup:
            - "Production AD02 was created with gate types SCRIPT and STORYBOARD, so two gates exist at sequence_index 1 and 2"
            - "two shots were created while the production was still PRE_PRODUCTION, so both sit at BLOCKED_PREPROD"
            - "the SCRIPT gate is already APPROVED and the STORYBOARD gate is IN_REVIEW"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Copper Skies", production_code: "AD02", format: "SERIES_EPISODE", budget_cents: 60000000, render_allowance_cents: 4000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT", "STORYBOARD"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id", p_phase_0: "$.data.phase" }
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD02_010_0010", sequence_code: "010", frame_count: 96, budget_cents: 800000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_a_id: "$.data.id", shot_a_status_0: "$.data.status" }
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD02_010_0020", sequence_code: "010", frame_count: 96, budget_cents: 800000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_b_id: "$.data.id", shot_b_status_0: "$.data.status" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_1_id: "$.data[0].id", gate_2_id: "$.data[1].id" }
            - call: "POST /studio/pre-production-gates/${gate_1_id}/submit"
              payload: { package_url: "s3://ad02/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_1_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
              captures: { gate_1_status_mid: "$.data.status" }
            - call: "POST /studio/pre-production-gates/${gate_2_id}/submit"
              payload: { package_url: "s3://ad02/boards/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
          trigger:
            - call: "POST /studio/pre-production-gates/${gate_2_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
              captures: { gate_2_status: "$.data.status" }
            - call: "GET /studio/productions/${prod_id}"
              as: ProductionManager
              captures: { p_phase_1: "$.data.phase", p_shot_count: "$.data.shot_count" }
            - call: "GET /studio/pre-production-gates/${gate_1_id}"
              as: ProductionManager
              captures: { gate_1_status: "$.data.status" }
            - call: "GET /studio/pre-production-gates/${gate_2_id}"
              as: ProductionManager
              captures: { gate_2_status_after: "$.data.status" }
            - call: "GET /studio/shots/${shot_a_id}"
              as: ProductionManager
              captures: { shot_a_status: "$.data.status" }
            - call: "GET /studio/shots/${shot_b_id}"
              as: ProductionManager
              captures: { shot_b_status: "$.data.status" }
          assert:
            - "${p_phase_0} == PRE_PRODUCTION and ${shot_a_status_0} == BLOCKED_PREPROD and ${shot_b_status_0} == BLOCKED_PREPROD"
            - "${gate_1_status_mid} == APPROVED (not yet LOCKED, because the second gate was still outstanding)"
            - "${gate_2_status} == APPROVED as returned by the decision call"
            - "${p_phase_1} == PRODUCTION_ACTIVE and ${p_shot_count} == 2 (link 1)"
            - "${gate_1_status} == LOCKED and ${gate_2_status_after} == LOCKED (link 2)"
            - "${shot_a_status} == READY and ${shot_b_status} == READY (link 3)"
            - "submitting the STORYBOARD gate before the SCRIPT gate is approved returns 409 with error_id ERR_GATE_SEQUENCE_VIOLATION"

  # =========================================================================
  # Rule 5 — priority-pair validation conflicts (state vs fiscal, safety vs referential)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: task_state_error_precedes_render_capacity_error
        grounds:
          - validations[priority=11]
          - validations[priority=33]
          - errors[ERR_TASK_STATE_INVALID]
          - errors[ERR_RENDER_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          A single request violates a state rule at priority 11 and a fiscal rule at priority 33: the
          target stage task is still NOT_STARTED and the 95 requested cores also blow past the 30 cores
          the NORMAL headroom leaves. The state error must win, so the capacity error is never reported.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with shots AD01_010_0010 and AD01_010_0020"
            - "shot A's LAYOUT task is assigned and IN_PROGRESS; shot B's LAYOUT task was never assigned and is NOT_STARTED"
            - "render pool FARM-A has 100 cores at 175 cents per core-hour and one NORMAL job holding 60 cores over 2026-08-10 00:00 -> 06:00"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 50000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_a_id: "$.data.id" }
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0020", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_b_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_a_id}"
              as: ProductionManager
              captures: { ta_layout_id: "$.data[0].id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_b_id}"
              as: ProductionManager
              captures: { tb_layout_id: "$.data[0].id", tb_status_0: "$.data[0].status" }
            - call: "POST /studio/stage-tasks/${ta_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/render-pools"
              payload: { name: "FARM-A", total_cores: 100, cost_per_core_hour_cents: 175 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { pool_id: "$.data.id" }
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_v0: "$.data.version" }
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${ta_layout_id}", priority: "NORMAL", requested_cores: 60, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v0}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_v1: "$.data.version" }
          trigger:
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${tb_layout_id}", priority: "NORMAL", requested_cores: 95, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v1}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
          assert:
            - "${tb_status_0} == NOT_STARTED"
            - "the trigger returns 409 with error_id ERR_TASK_STATE_INVALID"
            - "the response error_id is not ERR_RENDER_CAPACITY_EXCEEDED even though 95 cores exceed the 30 available at NORMAL priority"
            - "GET /studio/render-pools/${pool_id} still reports committed_core_hours == 360.00, reserved_job_count == 1 and version == ${pool_v1}"
            - "assigning shot B's LAYOUT task and repeating the identical request then returns 409 with error_id ERR_RENDER_CAPACITY_EXCEEDED, which proves both rules were live"
      - name: partner_security_tier_error_precedes_cross_production_error
        grounds:
          - validations[priority=14]
          - validations[priority=21]
          - errors[ERR_SECURITY_TIER_INSUFFICIENT]
          - errors[ERR_CROSS_PRODUCTION_REFERENCE]
        distinguishing_aspect: |
          A different category pair than the first instance: business_safety at priority 14 against
          business_referential at priority 21. The package demands TIER3 clearance from a TIER1 partner
          and its stage_task_ids point at a shot of another production; only the security error surfaces.
        test_recipe:
          setup:
            - "Productions AD01 and AD02 are both PRODUCTION_ACTIVE, each with one shot and its LAYOUT task"
            - "Partner Northwind Animation is APPROVED at security_certification_level TIER1 with mfa_enforced false"
            - "a DRAFT package under AD01 declares security_tier TIER3 and scopes AD02's LAYOUT task"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_a_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_a_id}"
              as: ProductionManager
              captures: { gate_a_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_a_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_a_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/productions"
              payload: { title: "Copper Skies", production_code: "AD02", format: "SERIES_EPISODE", budget_cents: 60000000, render_allowance_cents: 4000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_b_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_b_id}"
              as: ProductionManager
              captures: { gate_b_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_b_id}/submit"
              payload: { package_url: "s3://ad02/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_b_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_b_id}", shot_code: "AD02_010_0010", sequence_code: "010", frame_count: 96, budget_cents: 800000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_b_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_b_id}"
              as: ProductionManager
              captures: { tb_layout_id: "$.data[0].id" }
            - call: "POST /studio/outsource-partners"
              payload: { legal_name: "Northwind Animation", security_certification_level: "TIER1", mfa_enforced: false, watermark_required: false }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { partner_id: "$.data.id", q_roll: "$.data.quality_score_rolling" }
            - call: "POST /studio/outsource-partners/${partner_id}/status"
              payload: { status: "APPROVED" }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
            - call: "POST /studio/outsource-packages"
              payload: { production_id: "${prod_a_id}", partner_id: "${partner_id}", package_code: "AD01-PKG-X", security_tier: "TIER3", fee_cents: 250000, stage_task_ids: ["${tb_layout_id}"], quality_min_score: 50.00 }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { pkg_id: "$.data.id", pkg_status_0: "$.data.status" }
          trigger:
            - call: "POST /studio/outsource-packages/${pkg_id}/issue"
              payload: {}
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
          assert:
            - "${pkg_status_0} == DRAFT (a draft package is allowed to hold a foreign scope)"
            - "${q_roll} == 50.00, so the quality floor at priority 16 is satisfied and cannot mask the comparison"
            - "the trigger returns 422 with error_id ERR_SECURITY_TIER_INSUFFICIENT (TIER1 < TIER3)"
            - "the response error_id is not ERR_CROSS_PRODUCTION_REFERENCE"
            - "GET /studio/outsource-packages/${pkg_id} still reports status DRAFT and fee_committed_cents == 0"
            - "raising the partner to TIER3 and repeating the identical issue then returns 422 with error_id ERR_CROSS_PRODUCTION_REFERENCE, which proves both rules were live"

  # =========================================================================
  # Rule 6 — boundary and precision checks (threshold latch, first index in group)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: retake_escalation_fires_at_exactly_third_revision
        grounds:
          - calculations.stage_retake_escalation
          - entities.ShotStageTask.fields.escalated
          - entities.Shot.fields.escalation_flag
          - entities.Production.fields.at_risk_shot_count
        distinguishing_aspect: |
          RETAKE_ESCALATION_THRESHOLD is 3 and the comparison is >=, so the boundary is walked from below:
          revision_count 2 must still read escalated false, the third RETAKE flips it, and a fourth RETAKE
          leaves the latch alone rather than double-counting the shot as at risk.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with shot AD01_010_0010"
            - "the LAYOUT task is assigned to u-artist-01 and has already been retaken twice, so revision_count is 2"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t_layout_id: "$.data[0].id" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/stage-tasks/${t_layout_id}/submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/stage-tasks/${t_layout_id}/review-decision"
              payload: { decision: "RETAKE", note: "First pass rejected." }
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { rev_1: "$.data.revision_count", esc_1: "$.data.escalated" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/stage-tasks/${t_layout_id}/review-decision"
              payload: { decision: "RETAKE", note: "Second pass rejected." }
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { rev_2: "$.data.revision_count", esc_at_two: "$.data.escalated" }
            - call: "GET /studio/shots/${shot_id}"
              as: ProductionManager
              captures: { shot_esc_at_two: "$.data.escalation_flag", shot_retakes_at_two: "$.data.retake_count" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
          trigger:
            - call: "POST /studio/stage-tasks/${t_layout_id}/review-decision"
              payload: { decision: "RETAKE", note: "Third pass rejected." }
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { rev_3: "$.data.revision_count", esc_at_three: "$.data.escalated" }
            - call: "GET /studio/shots/${shot_id}"
              as: ProductionManager
              captures: { shot_esc_at_three: "$.data.escalation_flag", shot_retakes_at_three: "$.data.retake_count" }
            - call: "GET /studio/productions/${prod_id}"
              as: ProductionManager
              captures: { p_at_risk_at_three: "$.data.at_risk_shot_count", p_retakes_at_three: "$.data.total_retake_count" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/submit"
              payload: {}
              as: Artist
              as_user_id: "u-artist-01"
            - call: "POST /studio/stage-tasks/${t_layout_id}/review-decision"
              payload: { decision: "RETAKE", note: "Fourth pass rejected." }
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { rev_4: "$.data.revision_count", esc_at_four: "$.data.escalated" }
            - call: "GET /studio/productions/${prod_id}"
              as: ProductionManager
              captures: { p_at_risk_at_four: "$.data.at_risk_shot_count", p_retakes_at_four: "$.data.total_retake_count" }
          assert:
            - "${rev_1} == 1 and ${esc_1} == false"
            - "${rev_2} == 2 and ${esc_at_two} == false (threshold minus one)"
            - "${shot_esc_at_two} == false and ${shot_retakes_at_two} == 2"
            - "${rev_3} == 3 and ${esc_at_three} == true (exactly at the threshold, comparison is >=)"
            - "${shot_esc_at_three} == true and ${shot_retakes_at_three} == 3"
            - "${p_at_risk_at_three} == 1 and ${p_retakes_at_three} == 3"
            - "${rev_4} == 4 and ${esc_at_four} == true (already latched)"
            - "${p_at_risk_at_four} == 1 (the shot is counted once, not twice) and ${p_retakes_at_four} == 4"
      - name: first_deliverable_in_empty_group_gets_v01
        grounds:
          - calculations.deliverable_version_label
          - entities.Deliverable.fields.version_index
          - entities.Deliverable.fields.version_label
          - validations[priority=32]
        distinguishing_aspect: |
          The empty-group boundary: the first deliverable of a (production, shot, type) group must be
          version_index 1 with the zero-padded label v01 rather than v0, v1 or v00, and the padding must
          survive the increment to v02 after a QC failure frees the group.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE and approves both ACEScg and Rec709"
            - "shot AD01_010_0010 exists and no deliverable has ever been created for the production"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, approved_color_spaces: ["ACEScg", "Rec709"], gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/productions/${prod_id}"
              as: ProductionManager
              captures: { p_v0: "$.data.version" }
          trigger:
            - call: "POST /studio/deliverables"
              payload: { production_id: "${prod_id}", shot_id: "${shot_id}", deliverable_type: "PROXY_MP4", color_space: "Rec709", resolution: "1920x1080", frame_rate: 24.0, bit_depth: 8, expected_production_version: "${p_v0}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { d1_id: "$.data.id", d1_index: "$.data.version_index", d1_label: "$.data.version_label", d1_status: "$.data.status" }
            - call: "POST /studio/deliverables/${d1_id}/submit"
              payload: {}
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { d1_status_submitted: "$.data.status" }
            - call: "POST /studio/deliverables/${d1_id}/qc-decision"
              payload: { decision: "FAIL", qc_note: "Burn-in is missing." }
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { d1_status_failed: "$.data.status", d1_note: "$.data.qc_note" }
            - call: "GET /studio/productions/${prod_id}"
              as: ProductionManager
              captures: { p_v1: "$.data.version" }
            - call: "POST /studio/deliverables"
              payload: { production_id: "${prod_id}", shot_id: "${shot_id}", deliverable_type: "PROXY_MP4", color_space: "Rec709", resolution: "1920x1080", frame_rate: 24.0, bit_depth: 8, expected_production_version: "${p_v1}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { d2_index: "$.data.version_index", d2_label: "$.data.version_label" }
          assert:
            - "${d1_index} == 1 and ${d1_label} == v01 and ${d1_status} == DRAFT"
            - "${d1_label} is exactly the three-character string v01, not v1, v0 or v00"
            - "${d1_status_submitted} == SUBMITTED"
            - "${d1_status_failed} == QC_FAILED and ${d1_note} == Burn-in is missing."
            - "${d2_index} == 2 and ${d2_label} == v02"
            - "a third create issued while the v02 row is still DRAFT returns 409 with error_id ERR_DELIVERABLE_VERSION_CONFLICT"
            - "a create for the same production and type but shot_id omitted starts its own group at version_index 1 and label v01"

  # =========================================================================
  # Rule 7 — cross-entity state dependencies
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: stage_assign_blocked_while_production_in_pre_production
        grounds:
          - validations[priority=10]
          - state_machines.Shot.BLOCKED_PREPROD_to_READY
          - state_machines.ShotStageTask.NOT_STARTED_to_IN_PROGRESS
          - errors[ERR_PRODUCTION_PHASE_INVALID]
        distinguishing_aspect: |
          The legality of a write on a ShotStageTask is decided by the phase of its grandparent Production,
          two hops up the graph: the task itself is a perfectly assignable NOT_STARTED row, and the only
          thing that changes between the rejected and the accepted call is a gate decision elsewhere.
        test_recipe:
          setup:
            - "Production AD03 is still PRE_PRODUCTION with a single SCRIPT gate outstanding"
            - "shot AD03_010_0010 was created during pre-production, so it sits at BLOCKED_PREPROD with five NOT_STARTED stage tasks"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Tin Lantern", production_code: "AD03", format: "SHORT", budget_cents: 20000000, render_allowance_cents: 2000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id", p_phase_0: "$.data.phase" }
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD03_010_0010", sequence_code: "010", frame_count: 72, budget_cents: 500000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_id: "$.data.id", shot_status_0: "$.data.status" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t_layout_id: "$.data[0].id", t_layout_status_0: "$.data[0].status", t_anim_id: "$.data[1].id" }
          trigger:
            - call: "POST /studio/stage-tasks/${t_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad03/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/stage-tasks/${t_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { t_layout_status_1: "$.data.status", t_layout_artist: "$.data.assigned_artist_user_id" }
            - call: "GET /studio/shots/${shot_id}"
              as: ProductionManager
              captures: { shot_status_1: "$.data.status", shot_stage: "$.data.current_stage" }
          assert:
            - "${p_phase_0} == PRE_PRODUCTION, ${shot_status_0} == BLOCKED_PREPROD and ${t_layout_status_0} == NOT_STARTED"
            - "the first assign returns 409 with error_id ERR_PRODUCTION_PHASE_INVALID"
            - "after the rejection GET /studio/stage-tasks/${t_layout_id} still reports status NOT_STARTED and assigned_artist_user_id null"
            - "${t_layout_status_1} == IN_PROGRESS and ${t_layout_artist} == u-artist-01"
            - "${shot_status_1} == IN_PRODUCTION and ${shot_stage} == LAYOUT"
            - "assigning ${t_anim_id} at this point returns 409 with error_id ERR_PREVIOUS_STAGE_NOT_APPROVED, a second cross-entity dependency on the sibling task"
      - name: client_review_session_requires_calibrated_room
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - entities.ScreeningRoom.fields.calibration_status
          - errors[ERR_ROOM_NOT_CALIBRATED]
          - errors[ERR_CALIBRATION_EXPIRED]
        distinguishing_aspect: |
          A ReviewSession's legality depends on state that lives entirely on a different entity and is
          re-derived from the logical clock: an uncalibrated room blocks the booking, and a calibration
          that was valid at booking time can lapse before the session is allowed to start.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE and approves ACEScg and Rec709"
            - "screening room CLIENT-A is Rec709, 20 seats, calibration_valid_days 30, and has never been calibrated"
            - "the logical clock stands at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, approved_color_spaces: ["ACEScg", "Rec709"], gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/screening-rooms"
              payload: { name: "CLIENT-A", seat_capacity: 20, room_color_space: "Rec709", turnover_buffer_minutes: 30, calibration_valid_days: 30 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { room_id: "$.data.id", room_cal_0: "$.data.calibration_status", room_last_cal_0: "$.data.last_calibrated_at" }
          trigger:
            - call: "POST /studio/review-sessions"
              payload: { production_id: "${prod_id}", screening_room_id: "${room_id}", session_type: "CLIENT_REVIEW", window_start: "2026-09-06T10:00:00Z", window_end: "2026-09-06T11:00:00Z", attendee_count: 12 }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/screening-rooms/${room_id}/calibrate"
              payload: {}
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { room_cal_1: "$.data.calibration_status", room_last_cal_1: "$.data.last_calibrated_at" }
            - call: "POST /studio/review-sessions"
              payload: { production_id: "${prod_id}", screening_room_id: "${room_id}", session_type: "CLIENT_REVIEW", window_start: "2026-09-06T10:00:00Z", window_end: "2026-09-06T11:00:00Z", attendee_count: 12 }
              as: Director
              as_user_id: "u-dir-01"
              captures: { session_id: "$.data.id", session_status_0: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "GET /studio/screening-rooms/${room_id}"
              as: ProductionManager
              captures: { room_cal_2: "$.data.calibration_status" }
            - call: "POST /studio/review-sessions/${session_id}/start"
              payload: {}
              as: Director
              as_user_id: "u-dir-01"
          assert:
            - "${room_cal_0} == UNCALIBRATED and ${room_last_cal_0} is null"
            - "the first booking returns 422 with error_id ERR_ROOM_NOT_CALIBRATED"
            - "${room_cal_1} == CALIBRATED and ${room_last_cal_1} == 2026-08-01T00:00:00Z (the calibration stamps the logical clock, not wall time)"
            - "${session_status_0} == SCHEDULED for the identical booking after calibration"
            - "${room_cal_2} == EXPIRED (35 days elapsed against a 30-day validity, re-derived on read without any write)"
            - "the start call returns 422 with error_id ERR_CALIBRATION_EXPIRED and GET /studio/review-sessions/${session_id} still reports status SCHEDULED"
            - "re-calibrating the room at the 2026-09-05 clock and starting again returns 200 with status IN_PROGRESS"

  # =========================================================================
  # Rule 8 — resource / temporal overlap under two different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: screening_room_turnover_buffer_rejects_zero_gap_booking
        grounds:
          - validations[priority=25]
          - entities.ScreeningRoom.fields.turnover_buffer_minutes
          - errors[ERR_ROOM_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Buffered-adjacency semantics on an exclusive resource: the room is blocked not by the raw session
          window but by that window grown 30 minutes on each side, so a booking that starts exactly when
          the previous one ends conflicts while a 30-minute gap is legal. Cancelling the incumbent releases
          the buffer immediately.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE"
            - "screening room STAGE-1 has 12 seats, a 30-minute turnover buffer and a fresh calibration"
            - "a SCHEDULED DIRECTOR_REVIEW session already holds 2026-08-20 09:00 -> 11:00"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/screening-rooms"
              payload: { name: "STAGE-1", seat_capacity: 12, room_color_space: "ACEScg", turnover_buffer_minutes: 30, calibration_valid_days: 30 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { room_id: "$.data.id" }
            - call: "POST /studio/screening-rooms/${room_id}/calibrate"
              payload: {}
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/review-sessions"
              payload: { production_id: "${prod_id}", screening_room_id: "${room_id}", session_type: "DIRECTOR_REVIEW", window_start: "2026-08-20T09:00:00Z", window_end: "2026-08-20T11:00:00Z", attendee_count: 6 }
              as: Director
              as_user_id: "u-dir-01"
              captures: { session_1_id: "$.data.id" }
          trigger:
            - call: "POST /studio/review-sessions"
              payload: { production_id: "${prod_id}", screening_room_id: "${room_id}", session_type: "DIRECTOR_REVIEW", window_start: "2026-08-20T11:00:00Z", window_end: "2026-08-20T12:00:00Z", attendee_count: 4 }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/review-sessions"
              payload: { production_id: "${prod_id}", screening_room_id: "${room_id}", session_type: "DIRECTOR_REVIEW", window_start: "2026-08-20T11:30:00Z", window_end: "2026-08-20T12:30:00Z", attendee_count: 4 }
              as: Director
              as_user_id: "u-dir-01"
              captures: { session_2_id: "$.data.id", session_2_status: "$.data.status" }
            - call: "POST /studio/review-sessions/${session_1_id}/cancel"
              payload: { reason: "Director travelling." }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { session_1_status: "$.data.status" }
            - call: "POST /studio/review-sessions"
              payload: { production_id: "${prod_id}", screening_room_id: "${room_id}", session_type: "DIRECTOR_REVIEW", window_start: "2026-08-20T09:00:00Z", window_end: "2026-08-20T10:30:00Z", attendee_count: 4 }
              as: Director
              as_user_id: "u-dir-01"
              captures: { session_3_status: "$.data.status" }
          assert:
            - "the 11:00 -> 12:00 booking returns 409 with error_id ERR_ROOM_WINDOW_CONFLICT (its buffered window 10:30 -> 12:30 intersects the stored 09:00 -> 11:00)"
            - "${session_2_status} == SCHEDULED for 11:30 -> 12:30, whose buffered window starts exactly at 11:00 and therefore only touches the half-open incumbent"
            - "${session_1_status} == CANCELLED"
            - "${session_3_status} == SCHEDULED, proving a CANCELLED session no longer reserves its buffer while the 11:30 session's buffer still allows a 10:30 finish"
            - "a 13th attendee in this room returns 422 with error_id ERR_ROOM_SEAT_CAPACITY_EXCEEDED, an independent per-resource limit"
      - name: render_pool_aggregate_capacity_allows_adjacent_windows
        grounds:
          - calculations.render_pool_admission
          - entities.RenderPool.fields.committed_core_hours
          - validations[priority=33]
          - errors[ERR_RENDER_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Different interval semantics from the screening room: the render pool is a shared, additive
          resource with no turnover buffer, so a job starting exactly when another ends is admitted at full
          size, while a job straddling both windows is measured against the peak concurrent commitment and
          rejected.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with shot AD01_010_0010 and its LAYOUT task IN_PROGRESS"
            - "render pool FARM-A has 100 cores at 175 cents per core-hour and no reservations"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t_layout_id: "$.data[0].id" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/render-pools"
              payload: { name: "FARM-A", total_cores: 100, cost_per_core_hour_cents: 175 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { pool_id: "$.data.id" }
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_v0: "$.data.version" }
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${t_layout_id}", priority: "NORMAL", requested_cores: 60, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v0}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { job_1_id: "$.data.id" }
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_v1: "$.data.version" }
          trigger:
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${t_layout_id}", priority: "NORMAL", requested_cores: 60, window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T12:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v1}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { job_2_id: "$.data.id", job_2_status: "$.data.status" }
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_v2: "$.data.version", pool_cch_2: "$.data.committed_core_hours" }
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${t_layout_id}", priority: "NORMAL", requested_cores: 60, window_start: "2026-08-10T03:00:00Z", window_end: "2026-08-10T09:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v2}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_v3: "$.data.version", pool_cch_3: "$.data.committed_core_hours", pool_jobs_3: "$.data.reserved_job_count" }
          assert:
            - "${job_2_status} == RESERVED: the windows touch at 06:00 and half-open intervals do not intersect, so the full 60 cores are available again"
            - "${pool_cch_2} == 720.00 (two 60-core six-hour reservations) and ${pool_v2} > ${pool_v1}"
            - "the 03:00 -> 09:00 request returns 409 with error_id ERR_RENDER_CAPACITY_EXCEEDED (it intersects both reservations, peak commitment 60 against a NORMAL ceiling of 90, so only 30 cores are free)"
            - "${pool_cch_3} == 720.00, ${pool_jobs_3} == 2 and ${pool_v3} == ${pool_v2} (the rejected request left no trace)"
            - "GET /studio/productions/${prod_id} reports render_committed_cents == 35040 (two jobs of 17520)"

  # =========================================================================
  # Rule 9 — compensating invariants over two different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: render_job_cancel_restores_pool_committed_core_hours
        grounds:
          - state_machines.RenderJob.RESERVED_to_CANCELLED
          - entities.RenderPool.fields.committed_core_hours
          - entities.Shot.fields.render_cost_committed_cents
          - entities.Production.fields.render_committed_cents
        distinguishing_aspect: |
          Conserved quantity number one is render capacity and its money shadow: a reservation adds
          360.00 core-hours to the pool, 17,520 cents to the shot and the same to the production, and the
          cancellation must return every one of those figures to its exact pre-reservation value while the
          job keeps a null final cost and the pool version still moves forward.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with shot AD01_010_0010 and its LAYOUT task IN_PROGRESS"
            - "render pool FARM-A has 100 cores at 175 cents per core-hour, 0.00 committed core-hours and 0 reserved jobs"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t_layout_id: "$.data[0].id" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/render-pools"
              payload: { name: "FARM-A", total_cores: 100, cost_per_core_hour_cents: 175 }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { pool_id: "$.data.id", pool_cch_0: "$.data.committed_core_hours", pool_jobs_0: "$.data.reserved_job_count", pool_v0: "$.data.version" }
          trigger:
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${t_layout_id}", priority: "NORMAL", requested_cores: 60, window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-10T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v0}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { job_id: "$.data.id", job_est: "$.data.estimated_cost_cents", job_cch: "$.data.committed_core_hours" }
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_cch_1: "$.data.committed_core_hours", pool_jobs_1: "$.data.reserved_job_count", pool_v1: "$.data.version" }
            - call: "GET /studio/shots/${shot_id}"
              as: ProductionManager
              captures: { shot_rc_1: "$.data.render_cost_committed_cents" }
            - call: "GET /studio/productions/${prod_id}"
              as: ProductionManager
              captures: { p_rc_1: "$.data.render_committed_cents" }
            - call: "POST /studio/render-jobs/${job_id}/cancel"
              payload: {}
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { job_status_2: "$.data.status", job_final_2: "$.data.final_cost_cents", job_est_2: "$.data.estimated_cost_cents" }
            - call: "GET /studio/render-pools/${pool_id}"
              as: ProductionManager
              captures: { pool_cch_2: "$.data.committed_core_hours", pool_jobs_2: "$.data.reserved_job_count", pool_v2: "$.data.version" }
            - call: "GET /studio/shots/${shot_id}"
              as: ProductionManager
              captures: { shot_rc_2: "$.data.render_cost_committed_cents", shot_ra_2: "$.data.render_cost_actual_cents" }
            - call: "GET /studio/productions/${prod_id}"
              as: ProductionManager
              captures: { p_rc_2: "$.data.render_committed_cents", p_ra_2: "$.data.render_actual_cents" }
          assert:
            - "${pool_cch_0} == 0.00 and ${pool_jobs_0} == 0"
            - "${job_est} == 17520 (cost_per_frame 146 times 120 frames) and ${job_cch} == 360.00"
            - "${pool_cch_1} == 360.00, ${pool_jobs_1} == 1 and ${pool_v1} > ${pool_v0}"
            - "${shot_rc_1} == 17520 and ${p_rc_1} == 17520"
            - "${job_status_2} == CANCELLED, ${job_final_2} is null and ${job_est_2} == 17520 (the estimate is history, not a live commitment)"
            - "${pool_cch_2} == 0.00 and ${pool_jobs_2} == 0, exactly the pre-reservation figures"
            - "${pool_v2} > ${pool_v1} (compensation still counts as a write)"
            - "${shot_rc_2} == 0, ${shot_ra_2} == 0, ${p_rc_2} == 0 and ${p_ra_2} == 0 with no residual drift of a single cent"
            - "a second POST /studio/render-jobs/${job_id}/cancel returns 409 with error_id ERR_RENDER_JOB_STATE_INVALID and does not double-refund"
      - name: package_recall_restores_production_committed_cents
        grounds:
          - state_machines.OutsourcePartner.APPROVED_to_SUSPENDED
          - state_machines.OutsourcePackage.DELIVERED_to_RECALLED
          - calculations.production_budget_position
          - entities.OutsourcePackage.fields.fee_committed_cents
          - entities.Production.fields.available_cents
        distinguishing_aspect: |
          A different conserved quantity from the render instance: the production budget position plus the
          earned-value ledger. Suspending the partner unwinds a 4,900,000-cent fee, its 735,000-cent
          overhead and the 100,000 cents of BCWP that the approved stage had earned, and reinstating the
          partner must not undo the unwind.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with budget 100,000,000 cents and contingency 0.10, so 110,000,000 is spendable"
            - "shot AD01_010_0010 has budget 1,000,000 cents and its LAYOUT task is assigned"
            - "Partner Northwind Animation is APPROVED at TIER1 with watermark_required false"
            - "package AD01-PKG-A (fee 4,900,000 cents) scopes that LAYOUT task, has been issued, accepted and delivered, and the supervisor has approved the stage"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id", p_available_0: "$.data.available_cents" }
            - call: "GET /studio/pre-production-gates?production_id=${prod_id}"
              as: ProductionManager
              captures: { gate_script_id: "$.data[0].id" }
            - call: "POST /studio/pre-production-gates/${gate_script_id}/submit"
              payload: { package_url: "s3://ad01/script/v1.pdf" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/pre-production-gates/${gate_script_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Director
              as_user_id: "u-dir-01"
            - call: "POST /studio/shots"
              payload: { production_id: "${prod_id}", shot_code: "AD01_010_0010", sequence_code: "010", frame_count: 120, budget_cents: 1000000, planned_start_at: "2026-08-01T00:00:00Z", planned_finish_at: "2026-09-30T00:00:00Z" }
              as: ProductionManager
              captures: { shot_id: "$.data.id" }
            - call: "GET /studio/stage-tasks?shot_id=${shot_id}"
              as: ProductionManager
              captures: { t_layout_id: "$.data[0].id" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/assign"
              payload: { assigned_artist_user_id: "u-artist-01" }
              as: ProductionManager
              as_user_id: "u-pm-01"
            - call: "POST /studio/outsource-partners"
              payload: { legal_name: "Northwind Animation", security_certification_level: "TIER1", mfa_enforced: false, watermark_required: false }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { partner_id: "$.data.id" }
            - call: "POST /studio/outsource-partners/${partner_id}/status"
              payload: { status: "APPROVED" }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
            - call: "POST /studio/outsource-packages"
              payload: { production_id: "${prod_id}", partner_id: "${partner_id}", package_code: "AD01-PKG-A", security_tier: "TIER1", fee_cents: 4900000, stage_task_ids: ["${t_layout_id}"], quality_min_score: 50.00 }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { pkg_id: "$.data.id" }
            - call: "POST /studio/outsource-packages/${pkg_id}/issue"
              payload: {}
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
            - call: "POST /studio/outsource-packages/${pkg_id}/accept"
              payload: {}
              as: PartnerRepresentative
              as_user_id: "${partner_id}"
              captures: { pkg_fee_1: "$.data.fee_committed_cents" }
            - call: "POST /studio/outsource-packages/${pkg_id}/deliver"
              payload: { watermark_applied: false }
              as: PartnerRepresentative
              as_user_id: "${partner_id}"
              captures: { pkg_status_1: "$.data.status", pkg_deliveries: "$.data.delivery_count" }
            - call: "POST /studio/stage-tasks/${t_layout_id}/review-decision"
              payload: { decision: "APPROVED" }
              as: Supervisor
              as_user_id: "u-sup-01"
              captures: { t_status_1: "$.data.status", t_pkg_1: "$.data.outsource_package_id" }
            - call: "GET /studio/productions/${prod_id}"
              as: ProductionManager
              captures: { p_direct_1: "$.data.direct_committed_cents", p_overhead_1: "$.data.overhead_fee_cents", p_total_1: "$.data.total_committed_cents", p_available_1: "$.data.available_cents", p_bcwp_1: "$.data.bcwp_cents" }
          trigger:
            - call: "POST /studio/outsource-partners/${partner_id}/status"
              payload: { status: "SUSPENDED" }
              as: OutsourceCoordinator
              as_user_id: "u-oc-01"
              captures: { partner_status_2: "$.data.status" }
            - call: "GET /studio/outsource-packages/${pkg_id}"
              as: OutsourceCoordinator
              captures: { pkg_status_2: "$.data.status", pkg_fee_2: "$.data.fee_committed_cents" }
            - call: "GET /studio/stage-tasks/${t_layout_id}"
              as: ProductionManager
              captures: { t_status_2: "$.data.status", t_pkg_2: "$.data.outsource_package_id", t_rev_2: "$.data.revision_count" }
            - call: "GET /studio/shots/${shot_id}"
              as: ProductionManager
              captures: { shot_bcwp_2: "$.data.bcwp_cents", shot_status_2: "$.data.status", shot_retakes_2: "$.data.retake_count" }
            - call: "GET /studio/productions/${prod_id}"
