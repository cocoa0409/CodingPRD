# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: work_order_cost_estimate_vs_final_diverge
        grounds:
          - calculations.work_order_cost
          - state_machines.WorkOrder.SCHEDULED_to_DISPATCHED
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - entities.WorkOrder.fields.estimated_cost_cents
          - entities.WorkOrder.fields.final_cost_cents
        distinguishing_aspect: |
          On the WorkOrder domain: estimate (800 gal -> 29000) and final (1500 gal -> 54000)
          are produced by the same formula on the same row yet differ because measured gallons
          cross the overage tier; estimated_cost_cents != final_cost_cents.
        test_recipe:
          setup:
            - "Account GOOD; Site with service_minutes=60; ACTIVE technician 08:00-17:00; OPEN route."
            - "PUMPING work order estimated_gallons=800 scheduled (estimate computed), dispatched, started, then completed with measured_gallons=1500."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "1 Pine", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-06-10" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-06-10", window_start_minute: 540, estimated_gallons: 800 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { measured_gallons: 1500 }
              as: FieldTech
              as_user_id: "${tech_id}"
          assert:
            - "WorkOrder.${wo_id}.estimated_cost_cents == 29000"
            - "WorkOrder.${wo_id}.final_cost_cents == 54000"
            - "WorkOrder.${wo_id}.final_cost_cents != WorkOrder.${wo_id}.estimated_cost_cents"

      - name: site_risk_provisional_vs_final_diverge
        grounds:
          - calculations.site_risk_score
          - state_machines.InspectionReport.DRAFT_to_FINALIZED
          - state_machines.PermitFiling.SUBMITTED_to_APPROVED
          - entities.Site.fields.risk_score
        distinguishing_aspect: |
          On the Site domain (different entity than work_order_cost): provisional risk at report
          finalize (CONDITIONAL,2 defects,1990 asset,2026 -> 61) differs from final risk after
          permit APPROVE (relief = base 30 -> 31); Site.risk_score changes 61 -> 31.
        test_recipe:
          setup:
            - "Site with one ACTIVE Asset install_year=1990; clock 2026; COMPLETED INSPECTION work order."
            - "DRAFT report defect_count=2; finalize result=CONDITIONAL (provisional risk 61); permit filed, cooling-off elapsed, submitted, then APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "2 Oak", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${site_id}", asset_type: "SEPTIC_TANK", capacity_gallons: 1200, install_year: 1990 }
              as: Dispatcher
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-06-02" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "INSPECTION", scheduled_date: "2026-06-02", window_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /inspection-reports"
              payload: { work_order_id: "${wo_id}", defect_count: 2 }
              as: ComplianceOfficer
              captures: { rep_id: $.data.id }
            - call: "POST /inspection-reports/${rep_id}/finalize"
              payload: { result: "CONDITIONAL" }
              as: ComplianceOfficer
              captures: { fin_at: $.data.finalized_at }
            - call: "POST /permit-filings"
              payload: { inspection_report_id: "${rep_id}", site_id: "${site_id}" }
              as: ComplianceOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /permit-filings/${pf_id}/submit"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /permit-filings/${pf_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
          assert:
            - "Site.${site_id}.risk_score == 31"
            - "InspectionReport.${rep_id} provisional caused Site.${site_id}.risk_score == 61 before decide"
            - "PermitFiling.${pf_id}.status == APPROVED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pumping_tiered_overage_with_emergency_surcharge
        grounds:
          - calculations.work_order_cost
          - entities.WorkOrder.fields.emergency_surcharge_applies
          - entities.WorkOrder.fields.final_cost_cents
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Mode (a) non-linear formula with >=3 inputs (gallons, tier rates, emergency flag):
          EMERGENCY 1200 gal -> trip 9000 + 1000*25 + 200*40 = 42000, then *1.5 surcharge = 63000.
        test_recipe:
          setup:
            - "Account GOOD; Site service_minutes=60; ACTIVE tech 08:00-17:00; OPEN route."
            - "EMERGENCY work order scheduled (estimated_gallons omitted -> 0 estimate base), dispatched, started, completed measured_gallons=1200."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "3 Elm", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-06-11" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "EMERGENCY", scheduled_date: "2026-06-11", window_start_minute: 600, estimated_gallons: 0 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { measured_gallons: 1200 }
              as: FieldTech
              as_user_id: "${tech_id}"
          assert:
            - "WorkOrder.${wo_id}.emergency_surcharge_applies == true"
            - "WorkOrder.${wo_id}.final_cost_cents == 63000"

      - name: repair_invoice_round_per_line_then_sum
        grounds:
          - calculations.invoice_total
          - entities.RepairLine.fields.line_total_cents
          - entities.WorkOrder.fields.invoice_total_cents
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Mode (b) nested-rounding order: two RepairLines (q1,unit101,bps825) each round to 109,
          per-line-then-sum = 218 (pinned); sum-then-round would be 219. invoice_total = 9000 + 218 = 9218.
        test_recipe:
          setup:
            - "Account GOOD; Site service_minutes=60; ACTIVE tech 08:00-17:00; OPEN route."
            - "REPAIR work order scheduled, dispatched, started; two RepairLines added (q=1, unit_price_cents=101, tax_rate_bps=825 each); then completed."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "4 Fir", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-06-12" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "REPAIR", scheduled_date: "2026-06-12", window_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /repair-lines"
              payload: { work_order_id: "${wo_id}", part_name: "Gasket", quantity: 1, unit_price_cents: 101, tax_rate_bps: 825 }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /repair-lines"
              payload: { work_order_id: "${wo_id}", part_name: "Clamp", quantity: 1, unit_price_cents: 101, tax_rate_bps: 825 }
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
          assert:
            - "WorkOrder.${wo_id}.final_cost_cents == 9000"
            - "WorkOrder.${wo_id}.invoice_total_cents == 9218"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_dispatched_revert_to_scheduled
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_DISPATCHED
          - state_machines.WorkOrder.DISPATCHED_to_SCHEDULED
          - entities.WorkOrder.fields.technician_id
        distinguishing_aspect: |
          WorkOrder is non-linear via revert: DISPATCHED -> SCHEDULED (technician_id cleared),
          a backward edge that re-enables re-dispatch; not a linear A->B->C pipeline.
        test_recipe:
          setup:
            - "Account GOOD; Site; ACTIVE tech; OPEN route; PUMPING WO scheduled then dispatched (technician_id set)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "5 Ash", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-06-13" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-06-13", window_start_minute: 540, estimated_gallons: 500 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/revert"
              payload: {}
              as: Dispatcher
          assert:
            - "WorkOrder.${wo_id}.status == SCHEDULED"
            - "WorkOrder.${wo_id}.technician_id == null"

      - name: permit_filing_rejected_reopen_resubmit_cycle
        grounds:
          - state_machines.PermitFiling.SUBMITTED_to_REJECTED
          - state_machines.PermitFiling.REJECTED_to_DRAFT
          - state_machines.PermitFiling.DRAFT_to_SUBMITTED
          - entities.PermitFiling.fields.submission_count
        distinguishing_aspect: |
          PermitFiling (different entity than WorkOrder) is cyclic: REJECTED -> DRAFT -> SUBMITTED
          loops back; submission_count increments to 2 on the second SUBMIT.
        test_recipe:
          setup:
            - "Site COMPLIANT via COMPLETED inspection + finalized PASS report; cooling-off elapsed; filing submitted then REJECTED, then reopened to DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "6 Bay", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-06-02" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "INSPECTION", scheduled_date: "2026-06-02", window_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /inspection-reports"
              payload: { work_order_id: "${wo_id}", defect_count: 0 }
              as: ComplianceOfficer
              captures: { rep_id: $.data.id }
            - call: "POST /inspection-reports/${rep_id}/finalize"
              payload: { result: "PASS" }
              as: ComplianceOfficer
            - call: "POST /permit-filings"
              payload: { inspection_report_id: "${rep_id}", site_id: "${site_id}" }
              as: ComplianceOfficer
              captures: { pf_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /permit-filings/${pf_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /permit-filings/${pf_id}/decide"
              payload: { decision: "REJECT", decision_reason: "missing sketch" }
              as: ComplianceOfficer
            - call: "POST /permit-filings/${pf_id}/reopen"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /permit-filings/${pf_id}/submit"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "PermitFiling.${pf_id}.status == SUBMITTED"
            - "PermitFiling.${pf_id}.submission_count == 2"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: account_hold_cascade_cancel_then_route_recount
        grounds:
          - state_machines.Account.GOOD_to_HOLD
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - entities.Route.fields.assigned_stop_count
          - entities.Route.fields.booked_minutes
        distinguishing_aspect: |
          Depth-3 cascade from Account hold: hold -> WorkOrder SCHEDULED->CANCELLED (route_id
          cleared) -> Route.assigned_stop_count recomputed 1->0 and booked_minutes 60->0. Each
          hop caused by the prior, not by the hold directly.
        test_recipe:
          setup:
            - "Account GOOD; Site service_minutes=60; ACTIVE tech 08:00-17:00; OPEN route; one PUMPING WO SCHEDULED on the route (assigned_stop_count=1, booked_minutes=60)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "7 Cove", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-06-14" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-06-14", window_start_minute: 540, estimated_gallons: 500 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /accounts/${acct_id}/hold"
              payload: {}
              as: Dispatcher
          assert:
            - "WorkOrder.${wo_id}.status == CANCELLED"
            - "WorkOrder.${wo_id}.route_id == null"
            - "Route.${route_id}.assigned_stop_count == 0"
            - "Route.${route_id}.booked_minutes == 0"

      - name: pumping_complete_cascade_due_date_then_reminder
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - calculations.next_pump_due
          - entities.Site.fields.next_pump_due_date
          - entities.Reminder.fields.due_date
        distinguishing_aspect: |
          Depth-2 cascade from PUMPING complete (different trigger than account hold): complete ->
          Site.last_pumped_date set + next_pump_due_date recomputed -> that recompute emits a
          Reminder(PUMP_DUE, due_date=next_pump_due_date). 2026-06-15 + 36mo = 2029-06-15.
        test_recipe:
          setup:
            - "Account GOOD; Site; ACTIVE ServicePlan frequency_months=36; ACTIVE tech; OPEN route; PUMPING WO scheduled/dispatched/started, scheduled_date=2026-06-15."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /sites"
              payload: { account_id: "${acct_id}", address: "8 Dune", county_code: "KING", service_minutes: 60 }
              as: Dispatcher
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /service-plans"
              payload: { site_id: "${site_id}", frequency_months: 36, estimated_gallons: 800, expected_site_version: "${site_v}" }
              as: Dispatcher
            - call: "POST /technicians"
              payload: { name: "Tina", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /routes"
              payload: { technician_id: "${tech_id}", route_date: "2026-06-15" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", work_type: "PUMPING", scheduled_date: "2026-06-15", window_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { route_id: "${route_id}" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { measured_gallons: 900 }
              as: FieldTech
              as_user_id: "${tech_id}"
          assert:
            - "Site.${site_id}.last_pumped_date == 2026-06-15"
            - "Site.${site_id}.next_pump_due_date == 2029-06-15"
            - "GET /sites/${site_id}/reminders contains a Reminder with reminder_type==PUMP_DUE and due_date==2029-06-15"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancel_completed_state_beats_account_hold_fiscal
        grounds:
          - validations[priority=20]
          - validations[priority=30]
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          state (priority 20, ERR_INVALID_STATE) vs business_constraint/fiscal (priority 30,
          ERR_ACCOUNT_ON_HOLD): cancelling a COMPLETED WO whose account is also on HOLD returns
          ERR_INVALID_STATE (cancel is not defined from COMPLETED), not the hold error.
        test_recipe:
          setup:
            - "PUMPING WO completed (terminal); then its Account put on HOLD; attempt to cancel the completed WO."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { name: "Acme", billing_email: "a@x.com" }
              as: Dispatcher
