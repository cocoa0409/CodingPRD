# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1154: Rollover & Plan-to-Plan Transfer Processing
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# All grounds entries are quoted strings (bracket refs included).
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: plan_creation_applies_defaults
        claim_type: defaults
        grounds: ["entities.Plan.fields.accepts_incoming_rollovers", "entities.Plan.fields.spousal_consent_threshold_cents"]
        distinguishing_aspect: "Omitting every optional flag on plan creation yields the pinned defaults: all accepts_* true, allows_in_plan_roth_conversion true, requires_spousal_consent true, threshold 500000, status ACTIVE, version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Defaults Plan", plan_type: "PLAN_403B" }, as: PlanSponsorAdmin, captures: { pl: "$.data.id", st: "$.data.status", v: "$.data.version", roll: "$.data.accepts_incoming_rollovers", loans: "$.data.accepts_loan_transfers", thr: "$.data.spousal_consent_threshold_cents" } }
          trigger: []
          assert:
            - "Plan.${pl}: status == ACTIVE (${st}), version == 1 (${v})"
            - "defaults applied: accepts_incoming_rollovers == true (${roll}), accepts_loan_transfers == true (${loans}), spousal_consent_threshold_cents == 500000 (${thr})"

      - name: participant_create_missing_required_dob
        claim_type: required_fields
        grounds: ["entities.Participant.fields.date_of_birth", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing date_of_birth on participant creation is rejected with ERR_VALIDATION (400); no row persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/participants", payload: { full_name: "No Dob", employment_status: "ACTIVE", marital_status: "SINGLE" }, as: PlanSponsorAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION (${err}) with HTTP 400"

      - name: account_computed_totals
        claim_type: computed_fields
        grounds: ["entities.Account.fields.vested_balance_cents", "entities.Account.fields.total_balance_cents", "entities.Account.fields.basis_cents"]
        distinguishing_aspect: "Computed totals derive from source rows with per-row floor: total 11,600,000; vested 10,800,000 (employer floored at 60%); basis 1,300,000; any client-supplied totals are ignored."
        test_recipe:
          setup: ["Plan A and participant P1 exist"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 8000000, basis_cents: 0, vested_pct: 100 }, { source_type: "EMPLOYER_PRETAX", balance_cents: 2000000, basis_cents: 0, vested_pct: 60 }, { source_type: "ROTH", balance_cents: 1000000, basis_cents: 800000, vested_pct: 100 }, { source_type: "AFTER_TAX", balance_cents: 600000, basis_cents: 500000, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id", tot: "$.data.total_balance_cents", vested: "$.data.vested_balance_cents", basis: "$.data.basis_cents" } }
          assert:
            - "Account.${a1}: total_balance_cents == 11600000 (${tot}), vested_balance_cents == 10800000 (${vested}), basis_cents == 1300000 (${basis})"

      - name: account_duplicate_participant_plan_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_ACCOUNT_ALREADY_EXISTS]", "validations[priority=6]"]
        distinguishing_aspect: "Second account for the same (participant_id, plan_id) pair is rejected ERR_ACCOUNT_ALREADY_EXISTS (409)."
        test_recipe:
          setup: ["Plan A, P1, and one existing account for (P1, Plan A)"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}" }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}" }, as: PlanSponsorAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ACCOUNT_ALREADY_EXISTS (${err}) with HTTP 409"

      - name: not_found_variants_return_404
        claim_type: not_found
        grounds: ["errors[ERR_PLAN_NOT_FOUND]", "errors[ERR_ACCOUNT_NOT_FOUND]", "errors[ERR_CASE_NOT_FOUND]", "errors[ERR_TAX_FORM_NOT_FOUND]", "errors[ERR_DOCUMENT_NOT_FOUND]", "errors[ERR_DISBURSEMENT_NOT_FOUND]", "errors[ERR_PARTICIPANT_NOT_FOUND]", "errors[ERR_LOAN_NOT_FOUND]", "errors[ERR_REDEPOSIT_NOT_FOUND]", "errors[ERR_VERIFICATION_NOT_FOUND]"]
        distinguishing_aspect: "Random UUIDs on single-resource and action paths return the entity-specific 404 error id; the error envelope carries data.error_id and data.message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/plans/00000000-0000-4000-8000-000000000000", as: RolloverProcessor, captures: { e1: "$.data.error_id" } }
            - { call: "GET /v1/accounts/00000000-0000-4000-8000-000000000000", as: RolloverProcessor, captures: { e2: "$.data.error_id" } }
            - { call: "GET /v1/rollover-cases/00000000-0000-4000-8000-000000000000", as: RolloverProcessor, captures: { e3: "$.data.error_id" } }
            - { call: "GET /v1/tax-forms/00000000-0000-4000-8000-000000000000", as: TaxReportingOfficer, captures: { e4: "$.data.error_id" } }
            - { call: "GET /v1/participants/00000000-0000-4000-8000-000000000000", as: RolloverProcessor, captures: { e5: "$.data.error_id" } }
            - { call: "GET /v1/loans/00000000-0000-4000-8000-000000000000", as: RolloverProcessor, captures: { e6: "$.data.error_id" } }
            - { call: "POST /v1/documents/00000000-0000-4000-8000-000000000000/submit", payload: {}, as: Participant, as_user_id: "00000000-0000-4000-8000-000000000001", captures: { e7: "$.data.error_id" } }
            - { call: "POST /v1/disbursements/00000000-0000-4000-8000-000000000000/issue", payload: {}, as: RolloverProcessor, captures: { e8: "$.data.error_id" } }
            - { call: "POST /v1/redeposits/00000000-0000-4000-8000-000000000000/credit", payload: {}, as: RolloverProcessor, captures: { e9: "$.data.error_id" } }
            - { call: "POST /v1/verifications/00000000-0000-4000-8000-000000000000/complete", payload: { outcome: "VERIFIED" }, as: RolloverProcessor, captures: { e10: "$.data.error_id" } }
          assert:
            - "ERR_PLAN_NOT_FOUND (${e1}), ERR_ACCOUNT_NOT_FOUND (${e2}), ERR_CASE_NOT_FOUND (${e3}), ERR_TAX_FORM_NOT_FOUND (${e4}), ERR_PARTICIPANT_NOT_FOUND (${e5})"
            - "ERR_LOAN_NOT_FOUND (${e6}), ERR_DOCUMENT_NOT_FOUND (${e7}), ERR_DISBURSEMENT_NOT_FOUND (${e8}), ERR_REDEPOSIT_NOT_FOUND (${e9}), ERR_VERIFICATION_NOT_FOUND (${e10}) — all HTTP 404"

      - name: money_source_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.MoneySourceBalance.fields.source_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "An unknown source_type enum member inside initial_balances is rejected ERR_VALIDATION and the whole account creation rolls back (no partial rows)."
        test_recipe:
          setup: ["Plan A and P1 exist"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "CRYPTO", balance_cents: 1000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/accounts?participant_id=${p1}", as: RolloverProcessor }
          assert:
            - "error_id == ERR_VALIDATION (${err})"
            - "no account persisted: GET /v1/accounts?participant_id=${p1} returns total_count == 0"

      - name: plan_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: ["entities.Plan"]
        distinguishing_aspect: "Client-supplied id/created_at/version in the create payload are ignored; the server mints id (typeless UUID) and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/plans", payload: { plan_name: "SysFields", plan_type: "IRA", id: "11111111-2222-4333-8444-555555555555", version: 99, created_at: "2001-01-01T00:00:00.000Z" }, as: PlanSponsorAdmin, captures: { new_id: "$.data.id", v: "$.data.version" } }
          assert:
            - "server-minted id != client-supplied id (${new_id} != 11111111-2222-4333-8444-555555555555) and version == 1 (${v})"

      - name: participant_age_computed_from_clock
        claim_type: computed_fields
        grounds: ["entities.Participant.fields.age_months", "entities.Participant.fields.current_age_years"]
        distinguishing_aspect: "age_months/current_age_years derive from the logical clock: dob 1966-11-01 at clock 2026-05-01 gives age_months == 714 and current_age_years == 59.5; with the clock at 2026-04-01 the same participant reads 713."
        test_recipe:
          setup: ["clock set to 2026-05-01; participant born 1966-11-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Age Probe", date_of_birth: "1966-11-01", employment_status: "ACTIVE", marital_status: "SINGLE" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
          trigger:
            - { call: "GET /v1/participants/${p1}", as: RolloverProcessor, captures: { m_now: "$.data.age_months", y_now: "$.data.current_age_years" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "GET /v1/participants/${p1}", as: RolloverProcessor, captures: { m_prev: "$.data.age_months" } }
          assert:
            - "at 2026-05-01: age_months == 714 (${m_now}) and current_age_years == 59.5 (${y_now})"
            - "at 2026-04-01: age_months == 713 (${m_prev}) — computed, never stored"

      - name: case_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "List responses use the fixed envelope: response_type array plus limit/offset/total_count/has_more with defaults limit=10 offset=0; limit=1 on a 2-case account returns has_more == true and total_count == 2; rows come in created_at ASC order."
        test_recipe:
          setup: ["Plan A, clock 2026-05-01, P1 SEPARATED SINGLE, account A1; two DRAFT cases on A1 (creation is not slot-gated; only submit is)"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 500000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "DIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust" }, as: Participant, as_user_id: "${p1}", captures: { c2: "$.data.id" } }
          trigger:
            - { call: "GET /v1/rollover-cases?source_account_id=${a1}&limit=1&offset=0", as: RolloverProcessor, captures: { first_id: "$.data[0].id" } }
          assert:
            - "response_type == array; pagination fields present: total_count == 2, has_more == true, limit == 1, offset == 0"
            - "first row is the earlier-created case (${first_id} == ${c1}) — created_at ASC ordering"

  - section: state_machines
    instances:
      - name: case_created_in_initial_draft
        claim_type: initial_state
        grounds: ["state_machines.RolloverCase"]
        distinguishing_aspect: "A newly created RolloverCase starts in DRAFT with version 1 and no computed amounts (gross_cents null) regardless of case_type."
        test_recipe:
          setup: ["Plan A, clock 2026-05-01, P1 SEPARATED SINGLE, account A1"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 500000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/rollover-cases", payload: { case_type: "DIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust" }, as: Participant, as_user_id: "${p1}", captures: { st: "$.data.status", v: "$.data.version", g: "$.data.gross_cents" } }
          assert:
            - "status == DRAFT (${st}), version == 1 (${v}), gross_cents is null (${g})"

      - name: case_submit_computes_docs_and_routes
        claim_type: side_effect_execution
        grounds: ["state_machines.RolloverCase.DRAFT_to_SUBMITTED", "calculations.required_document_rules"]
        distinguishing_aspect: "Submit on an INDIRECT case for a SEPARATED SINGLE participant creates exactly [SEPARATION_VERIFICATION, IDENTITY_PROOF] (in that order) and routes to DOCS_PENDING; qualifying_event == SEPARATION is stored."
        test_recipe:
          setup: ["Plan A, clock 2026-05-01, P1 SEPARATED SINGLE, account A1 PRE_TAX 500,000, DRAFT indirect case"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 500000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /v1/rollover-cases/${c1}/submit", payload: {}, as: Participant, as_user_id: "${p1}", captures: { st: "$.data.status", qe: "$.data.qualifying_event" } }
            - { call: "GET /v1/rollover-cases/${c1}/documents", as: RolloverProcessor, captures: { t0: "$.data[0].doc_type", t1: "$.data[1].doc_type", s0: "$.data[0].status" } }
          assert:
            - "status == DOCS_PENDING (${st}); qualifying_event == SEPARATION (${qe})"
            - "documents created in pinned order: [0].doc_type == SEPARATION_VERIFICATION (${t0}), [1].doc_type == IDENTITY_PROOF (${t1}), both initially REQUIRED (${s0})"

      - name: conversion_without_docs_routes_straight_to_review
        claim_type: valid_transition
        grounds: ["state_machines.RolloverCase.DRAFT_to_SUBMITTED"]
        distinguishing_aspect: "IN_PLAN_ROTH_CONVERSION for an ACTIVE SINGLE participant needs no qualifying event and no documents: submit routes DRAFT directly to ELIGIBILITY_REVIEW (auto-transition on empty doc set)."
        test_recipe:
          setup: ["Plan A (allows_in_plan_roth_conversion default true), clock 2026-05-01, P2 ACTIVE SINGLE dob 1970-01-01, account A2 with PRE_TAX 3,000,000 and AFTER_TAX 600,000/500,000"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Con Vert", date_of_birth: "1970-01-01", employment_status: "ACTIVE", marital_status: "SINGLE" }, as: PlanSponsorAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p2}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 3000000, basis_cents: 0, vested_pct: 100 }, { source_type: "AFTER_TAX", balance_cents: 600000, basis_cents: 500000, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a2: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "IN_PLAN_ROTH_CONVERSION", source_account_id: "${a2}", receiving_account_id: "${a2}", requested_amount_cents: 3000000 }, as: Participant, as_user_id: "${p2}", captures: { c2: "$.data.id" } }
          trigger:
            - { call: "POST /v1/rollover-cases/${c2}/submit", payload: {}, as: Participant, as_user_id: "${p2}", captures: { st: "$.data.status" } }
            - { call: "GET /v1/rollover-cases/${c2}/documents", as: RolloverProcessor }
          assert:
            - "status == ELIGIBILITY_REVIEW (${st}) — empty document set auto-routes past DOCS_PENDING"
            - "documents list is empty (total_count == 0)"

      - name: case_cancel_from_completed_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.RolloverCase", "errors[ERR_CASE_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: cancel on a completed conversion case returns ERR_CASE_INVALID_STATE and nothing mutates (irrevocability of in-plan Roth conversion)."
        test_recipe:
          setup: ["Plan A, clock 2026-05-01, P2 ACTIVE SINGLE (dob 1970-01-01), account A2 PRE_TAX 3,000,000; conversion case for 3,000,000 approved by proc-1 and executed by proc-2 -> COMPLETED"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Con Vert", date_of_birth: "1970-01-01", employment_status: "ACTIVE", marital_status: "SINGLE" }, as: PlanSponsorAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p2}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 3000000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a2: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "IN_PLAN_ROTH_CONVERSION", source_account_id: "${a2}", receiving_account_id: "${a2}", requested_amount_cents: 3000000 }, as: Participant, as_user_id: "${p2}", captures: { c2: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${c2}/submit", payload: {}, as: Participant, as_user_id: "${p2}" }
            - { call: "POST /v1/rollover-cases/${c2}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c2}/execute-conversion", payload: {}, as: RolloverProcessor, as_user_id: "proc-2", captures: { st_done: "$.data.status" } }
          trigger:
            - { call: "POST /v1/rollover-cases/${c2}/cancel", payload: {}, as: Participant, as_user_id: "${p2}", captures: { err: "$.data.error_id" } }
            - { call: "GET /v1/accounts/${a2}/source-balances", as: RolloverProcessor, captures: { rows: "$.data" } }
          assert:
            - "conversion completed (${st_done} == COMPLETED); cancel -> ERR_CASE_INVALID_STATE (${err})"
            - "no compensation happened: PRE_TAX == 0 and ROTH == 3000000 with basis 3000000 in ${rows} (conversion is irrevocable)"

      - name: verification_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.SourcePlanVerification", "errors[ERR_VERIFICATION_INVALID_STATE]"]
        distinguishing_aspect: "A VERIFIED verification is terminal: a second complete call returns ERR_VERIFICATION_INVALID_STATE and verified_at does not change."
        test_recipe:
          setup: ["Plan A, clock 2026-05-01, P1 SEPARATED SINGLE, account A1, DIRECT case submitted (docs pending state irrelevant), OUTBOUND verification created"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
