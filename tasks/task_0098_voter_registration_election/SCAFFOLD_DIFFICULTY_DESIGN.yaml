  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ballot_issue_requires_registration_active
        grounds:
          - state_machines.AbsenteeBallot.request_status=REQUESTED_to_request_status=ISSUED
          - errors[ERR_INVALID_STATE]
          - entities.VoterRegistration.fields.status
        distinguishing_aspect: |
          AbsenteeBallot's REQUESTED->ISSUED transition depends on the linked VoterRegistration being
          ACTIVE (entity pair AbsenteeBallot->VoterRegistration); a withdrawn registration blocks issue.
          NOTE: a ballot can only exist while the registration is ACTIVE; we reach the blocked case by
          observing that issue checks the live registration state at issue time.
