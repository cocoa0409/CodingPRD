  # ===========================================================================
  - section: consistency_model
    instances:

      - name: disposition_effects_visible_in_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/bureau/submissions/{id}/dispose
        distinguishing_aspect: "Immediate consistency: the dispose response itself carries the terminal status and computed finding counts, and a same-instant GET of the insurer shows the recomputed quality_score_bps — no async lag."
        test_recipe:
          setup:
            - "ACTIVE insurer, ACTIVE plan; a submission in EDITING with 1 WARNING finding."
          setup_api_calls:
            - call: "POST /bureau/insurers"
              payload: { insurer_code: "INS-018", legal_name: "Eighteenth Member Mutual" }
              as: BureauAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /bureau/statistical-plans"
              payload: { plan_code: "SP-V", line_of_business: "COMMERCIAL_PROPERTY", min_premium_cents: 1, max_record_age_months: 60 }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/statistical-plans/${plan_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions"
              payload: { insurer_id: "${ins_id}", plan_id: "${plan_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", record_count: 10, written_premium_cents: 100000 }
              as: InsurerUser
              as_user_id: "${ins_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /bureau/submissions/${sub_id}/begin-edit"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/submissions/${sub_id}/findings"
              payload: { edit_code: "W-1", severity: "WARNING", affected_records: 1 }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/submissions/${sub_id}/dispose"
              payload: {}
              as: BureauAdmin
            - call: "GET /bureau/insurers/${ins_id}"
              payload: {}
              as: BureauAdmin
          assert:
            - "the dispose response carries submission_status == ACCEPTED_WITH_WARNINGS and warning_finding_count == 1 in the same envelope"
            - "the immediate GET shows MemberInsurer.${ins_id}.quality_score_bps == 9950"
