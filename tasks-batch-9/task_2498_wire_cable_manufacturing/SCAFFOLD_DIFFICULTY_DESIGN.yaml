              as: CertificationOfficer
              captures: { insp_var_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/reinstate"
              payload: {}
              as: CertificationOfficer
          assert:
            - "after the PASS inspection: ListingCertification.${cert_id}.status == ACTIVE, open_variation_count == 0, last_inspection_date == 2026-06-05, next_inspection_due_date == 2026-09-03"
            - "FactoryInspection.${insp_pass_id}.status == CLOSED and FactoryInspection.${insp_pass_id}.corrective_action_due_date == null"
            - "after the VARIATION inspection: ListingCertification.${cert_id}.status == VARIATION_NOTICE and open_variation_count == 1"
            - "after the VARIATION inspection: ListingCertification.${cert_id}.last_inspection_date == 2026-08-10 and next_inspection_due_date == 2026-11-08"
            - "FactoryInspection.${insp_var_id}.status == OPEN and FactoryInspection.${insp_var_id}.corrective_action_due_date == 2026-09-09"
            - "after the reinstatement: ListingCertification.${cert_id}.status == ACTIVE and open_variation_count == 0"
            - "after the reinstatement: FactoryInspection.${insp_var_id}.status == CLOSED"
