        distinguishing_aspect: "An Applicant calling POST /properties (PropertyManager-exclusive) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["An owner exists."]
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Own23", email: "own23@x.com", management_fee_pct: 0.08 }
