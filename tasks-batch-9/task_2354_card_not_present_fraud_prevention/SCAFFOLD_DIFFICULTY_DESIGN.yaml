              captures: { addr_id: $.data.id }
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P1-weighted", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
            - call: "POST /fraud/risk-models"
              payload: { model_version_label: "M1", calibration_intercept: 0.05, calibration_slope: 1.20 }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { model_id: $.data.id }
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PUBLISH_SHADOW" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PROMOTE" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1 Junior", seniority: "JUNIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id, an1_v: $.data.version }
            - call: "POST /fraud/analysts"
              payload: { display_name: "LEAD1", seniority: "LEAD", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 3 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id, lead_v: $.data.version }
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 75000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.5417 }
              as: CheckoutService
              captures: { asmt_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${asmt_id}" }
              as: PlatformAdmin
              captures: { case_id: "$.data[0].id" }
            - call: "POST /fraud/review-cases/${case_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v}" }
              as: ReviewLead
              as_user_id: "${lead_id}"
            - call: "POST /fraud/review-cases/${case_id}/resolve"
              payload: { action: "ESCALATE", resolution_note: "hand to a lead" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /fraud/review-cases/${case_id}/assign"
              payload: { analyst_id: "${lead_id}", expected_analyst_version: "${lead_v}" }
              as: ReviewLead
              as_user_id: "${lead_id}"
          trigger:
            - call: "POST /fraud/review-cases/${case_id}/resolve"
              payload: { action: "APPROVE", resolution_note: "verified by phone callback" }
              as: ReviewLead
              as_user_id: "${lead_id}"
          assert:
            - "Analyst.${an1_id}.open_case_count == 0"
            - "Analyst.${an1_id}.resolved_case_count == 0"
            - "Analyst.${lead_id}.open_case_count == 0"
            - "Analyst.${lead_id}.resolved_case_count == 1"
            - "ReviewCase.${case_id}.state == RESOLVED_APPROVE"
            - "ReviewCase.${case_id}.escalation_count == 1"
            - "ReviewCase.${case_id}.resolved_late == false"
            - "CheckoutAssessment.${asmt_id}.state == DECIDED_APPROVE"
            - "CheckoutAssessment.${asmt_id}.decision == REVIEW"
            - "CheckoutAssessment.${asmt_id}.decision_reason == MANUAL_REVIEW"
            - "CheckoutAssessment.${asmt_id}.final_disposition == APPROVED"
            - "Customer.${cust_id}.approved_count == 1"
            - "Customer.${cust_id}.lifetime_net_approved_cents == 75000"
            - "Invariant B reconciles for both analysts: 0 == the count of ReviewCase rows in state ASSIGNED for each"
