      - name: delivery_invalid_state_fires_on_a_settled_row_and_is_itself_masked_by_the_stay
        claim_type: triggerable
        grounds:
          - errors.ERR_DELIVERY_INVALID_STATE
          - validations.priority_42_ERR_DELIVERY_INVALID_STATE
          - validations.priority_41_ERR_STAY_INVALID_STATE
        distinguishing_aspect: |
          ERR_DELIVERY_INVALID_STATE needs a delivery that has already been settled: honouring a
          DELIVERED row twice and denying a DELIVERED row both hit it. Its one blind spot is the
          voided stay - there the delivery is WAIVED but its stay is VOID, and priority 41 answers
          first, so the same shaped request produces a different error id.
