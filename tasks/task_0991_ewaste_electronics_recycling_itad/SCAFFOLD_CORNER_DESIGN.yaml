            - { call: "POST /itad/items/${i1}/sanitizations", payload: { method: "NIST_CLEAR", outcome: "PASS" }, as: DestructionTechnician, as_user_id: "tech-1", captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /itad/sanitizations/${s1}/verify", payload: { verdict: "APPROVE" }, as: DestructionTechnician, as_user_id: "tech-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED (role gate fires before the segregation check)"

      - name: account_manager_cannot_read_other_account
        claim_type: rbac_denial
        grounds: ["validations[priority=4]", roles]
        distinguishing_aspect: "Ownership rule: an AccountManager reading another account's resource is rejected 403 ERR_UNAUTHORIZED even though the role is allowed on the endpoint."
        test_recipe:
          setup: ["two accounts acct1 and acct2 exist"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Own One", contact_email: "o1@x.example" }, as: PlatformAdmin, captures: { acct1: $.data.id } }
            - { call: "POST /itad/accounts", payload: { company_name: "Own Two", contact_email: "o2@x.example" }, as: PlatformAdmin, captures: { acct2: $.data.id } }
          trigger:
            - { call: "GET /itad/accounts/${acct2}", payload: {}, as: AccountManager, as_user_id: "${acct1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED (entity_backed ownership: X-User-ID != account id)"

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_manifest_amend_stale_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[manifest-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with the observed version succeeds and bumps the manifest version; a second PATCH replaying the same expected version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["account; clock 2026-05-01; manifest DRAFT (version 1)"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "OCC Co", contact_email: "occ@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id, m_v1: $.data.version } }
            - { call: "PATCH /itad/manifests/${m}", payload: { expected_manifest_version: "${m_v1}", declared_item_count: 5 }, as: AccountManager, as_user_id: "${acct}", captures: { m_v2: $.data.version } }
          trigger:
            - { call: "PATCH /itad/manifests/${m}", payload: { expected_manifest_version: "${m_v1}", declared_item_count: 7 }, as: AccountManager, as_user_id: "${acct}", captures: { err: $.data.error_id } }
          assert:
            - "first PATCH succeeded with declared_item_count 5 and version advanced to 2 (m_v2 == m_v1 + 1)"
            - "replayed PATCH with the stale version fails: error_id == ERR_STALE_VERSION, HTTP 412, declared_item_count stays 5"

      - name: occ_requote_stale_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[settlement-requote-stale-manifest]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a QUOTE supersedes the prior one and bumps the manifest version; a re-quote replaying the pre-supersede version is rejected 412."
        test_recipe:
          setup: ["account; clock 2026-05-01; manifest RECEIVED (declared 1) with one triaged item; QUOTE s1 created at manifest version m_v"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "OC2 Co", contact_email: "oc2@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-OC2", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "GET /itad/manifests/${m}", payload: {}, as: IntakeOperator, captures: { m_v: $.data.version } }
            - { call: "POST /itad/manifests/${m}/settlements", payload: { expected_manifest_version: "${m_v}" }, as: IntakeOperator, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /itad/manifests/${m}/settlements", payload: { expected_manifest_version: "${m_v}" }, as: IntakeOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_VERSION (the first quote bumped Manifest.version, so the replayed expectation is stale)"

      - name: occ_manifest_version_increments_on_patch
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[manifest-amend-stale-version]"]
        distinguishing_aspect: "Happy path: PATCH with the current version succeeds and the response version is exactly old + 1."
        test_recipe:
          setup: ["account; manifest DRAFT version 1"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "OCV Co", contact_email: "ocv@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id, m_v1: $.data.version } }
          trigger:
            - { call: "PATCH /itad/manifests/${m}", payload: { expected_manifest_version: "${m_v1}", scheduled_end: "2026-06-01T12:00:00Z" }, as: AccountManager, as_user_id: "${acct}", captures: { m_v2: $.data.version } }
          assert:
            - "m_v1 == 1 and m_v2 == 2 (version increments by exactly one per mutation)"

      - name: listing_gate_relaxed_when_policy_flag_false
        claim_type: conditional_feature_flag
        grounds: [entities.CompliancePolicy.fields.resale_requires_verified_sanitization, "validations[priority=13]"]
        distinguishing_aspect: "With the ACTIVE policy's resale_requires_verified_sanitization false, a data-bearing item at data_status SANITIZED (logged, unverified) CAN be listed — behavior flips on the entity-level policy flag."
        test_recipe:
          setup: ["account; clock 2026-05-01; policy ACTIVE with resale_requires_verified_sanitization false; manifest RECEIVED; data-bearing item triaged RESALE; PASS sanitization logged (SANITIZED, not VERIFIED)"]
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Flag Co", contact_email: "fg@x.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/compliance-policies", payload: { standard: "R2", sanitization_methods_allowed: ["NIST_CLEAR"], export_allowed: true, resale_requires_verified_sanitization: false, is_active: true, weight_cert_freshness: 0.5, weight_volume: 0.2, weight_violations: 0.3 }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-FG1", category: "LAPTOP", weight_kg: 2.0, data_bearing: true, hazmat_flag: false, declared_grade: "B" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/items/${i1}/sanitizations", payload: { method: "NIST_CLEAR", outcome: "PASS" }, as: DestructionTechnician, as_user_id: "tech-1" }
          trigger:
            - { call: "POST /itad/listings", payload: { item_id: "${i1}", asking_price_cents: 30000, floor_price_cents: 20000, channel: "RETAIL" }, as: IntakeOperator, captures: { l_status: $.data.status } }
          assert:
            - "listing created ACTIVE with data_status merely SANITIZED because the flag is false (strict default would have required VERIFIED)"

      - name: policy_activation_deactivates_others
        claim_type: conditional_feature_flag
        grounds: [entities.CompliancePolicy.fields.is_active]
        distinguishing_aspect: "Exactly one policy is active: creating a second policy with is_active=true flips the first to false (created_at ASC list order)."
        test_recipe:
          setup: ["policy p1 created active; policy p2 then created active"]
          setup_api_calls:
            - { call: "POST /itad/compliance-policies", payload: { standard: "R2", sanitization_methods_allowed: ["NIST_CLEAR"], export_allowed: true, resale_requires_verified_sanitization: true, is_active: true, weight_cert_freshness: 0.5, weight_volume: 0.2, weight_violations: 0.3 }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "POST /itad/compliance-policies", payload: { standard: "E_STEWARDS", sanitization_methods_allowed: ["PHYSICAL_DESTROY"], export_allowed: false, resale_requires_verified_sanitization: true, is_active: true, weight_cert_freshness: 0.3, weight_volume: 0.2, weight_violations: 0.5 }, as: PlatformAdmin, captures: { p2: $.data.id } }
          trigger:
            - { call: "GET /itad/compliance-policies", payload: {}, as: PlatformAdmin, captures: { pa: "$.data[0].is_active", pb: "$.data[1].is_active" } }
          assert:
            - "first-listed policy (p1, older) has is_active == false; second-listed (p2) has is_active == true"

  - section: consistency_model
    instances:
      - name: finalize_immediately_visible
        claim_type: immediate_consistency
        grounds: [complexity_profile, state_machines.Settlement.QUOTE_OPEN_to_FINALIZED]
        distinguishing_aspect: "Immediate consistency: the finalize response and the very next GET /itad/accounts/{id} already show credit_balance_cents == 51000, and the ledger entry's balance_after_cents agrees (no asynchronous lag)."
