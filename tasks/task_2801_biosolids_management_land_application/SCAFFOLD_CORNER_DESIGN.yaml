          rationale: "The daily_net == 0 edge and the NO_DRAWDOWN_SENTINEL value 9999 are asserted by the named §1.8 instance."

  - section: validations
    instances:
      - name: val_role_check_outranks_existence_on_certify
        claim_type: priority_ordering
        grounds:
          - validations.priority_2_auth
          - validations.priority_3_existence
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_BATCH_NOT_FOUND]
        distinguishing_aspect: "A LabAnalyst calls certify on a batchId that does not exist: two rules are violated and the answer is ERR_UNAUTHORIZED 403 at priority 2, never ERR_BATCH_NOT_FOUND 404 at priority 3, so role rejection leaks no existence information."
        test_recipe:
          setup:
            - "One facility exists. No SolidsBatch row exists. LabAnalyst is not among the roles §1.5 declares for POST /solids-batches/{batchId}/certify."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-facilities"
              payload: { name: "North Water Reclamation Plant", npdes_permit_number: "NP-1001", storage_capacity_wet_tons: 5000.00, daily_production_wet_tons: 40.00, loadout_bay_count: 2 }
              as: FacilityOperator
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /solids-batches/00000000-0000-0000-0000-000000000000/certify"
              payload: {}
              as: LabAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${err} == \"ERR_UNAUTHORIZED\""
            - "the response HTTP status == 403"
            - "the response error_id is NOT \"ERR_BATCH_NOT_FOUND\""

