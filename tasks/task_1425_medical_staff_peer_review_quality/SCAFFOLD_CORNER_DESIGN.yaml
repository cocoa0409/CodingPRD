  - section: endpoints
    instances:
      - name: provider_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope"]
        distinguishing_aspect: "limit/offset pagination: page 1 of 2 providers with limit=1 returns exactly 1 row, total_count == 2, has_more == true; page 2 returns the other row with has_more == false."
        test_recipe:
          setup: ["two providers P1 (created first) and P2"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Page One", specialty: "SURGERY" }, as: QualityDirector, captures: { p1: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Page Two", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p2: $.data.id } }
          trigger:
            - { call: "GET /peer-review/providers", payload: { limit: 1, offset: 0 }, as: QualityDirector }
            - { call: "GET /peer-review/providers", payload: { limit: 1, offset: 1 }, as: QualityDirector }
          assert:
            - "page 1: data length == 1, data[0].id == ${p1}, total_count == 2, has_more == true"
            - "page 2: data length == 1, data[0].id == ${p2}, total_count == 2, has_more == false"
            - "both responses carry meta.api_request_id and meta.api_request_timestamp"

      - name: case_list_filter_by_status
        claim_type: listing
        grounds: ["entities.ReviewCase.fields.status"]
        distinguishing_aspect: "status filter returns exactly the matching subset: after screening one of two cases in, ?status=SCREENED_IN yields only it and ?status=REFERRED yields only the other."
        test_recipe:
          setup: ["provider; case1 left REFERRED; case2 screened in"]
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Filt", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "filter case 1" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-21T00:00:00Z", description: "filter case 2" }, as: PeerReviewCoordinator, captures: { case2: $.data.id } }
