        test_recipe:
          setup: ["Empty system."]
          setup_api_calls: []
          trigger:
            - call: "GET /cold-chain/chillers"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "http 401; error_id == ERR_UNAUTHENTICATED (undeclared role / missing headers)"
      - name: serial_collision_batch_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SERIAL_NOT_UNIQUE]"
        distinguishing_aspect: "A batch whose serial_start_seq collides with an existing fleet serial is rejected wholesale (ERR_SERIAL_NOT_UNIQUE); zero rows from the colliding batch persist."
        test_recipe:
          setup: ["One chiller with serial DP-0001 exists."]
          setup_api_calls:
            - call: "POST /cold-chain/chillers"
              payload: { model: "COMPACT", serial_prefix: "DP", quantity: 1 }
