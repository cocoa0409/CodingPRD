      - name: first_telemetry_flips_activated_to_in_service_with_posture_progression
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Machine.ACTIVATED_to_IN_SERVICE
          - calculations.machine_connectivity_posture
          - endpoints.POST_/agdata/machines/{id}/telemetry-ingest
        distinguishing_aspect: "The derived posture walks OFFLINE -> NO_PLAN -> CONNECTED as provisioning and plan activation land, while the lifecycle only moves REGISTERED -> ACTIVATED at the dealer handshake and ACTIVATED -> IN_SERVICE at the first accepted batch — two dimensions, four observable checkpoints."
        test_recipe:
          setup:
            - "One machine carried step by step through provisioning, plan activation, dealer activation and first ingest, reading it after each milestone."
          setup_api_calls:
            - *k_clock
            - *k_org
            - *k_dealer
            - *k_machine
            - *k_prov_begin
            - *k_prov_ok
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { posture_after_prov: $.data.connectivity_posture }
            - *k_plan_std
            - *k_plan_act
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { posture_mid: $.data.connectivity_posture, life_mid: $.data.lifecycle_status }
          trigger:
            - *k_mact
            - call: "GET /agdata/machines/${machine_id}"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { life_act: $.data.lifecycle_status, posture_act: $.data.connectivity_posture }
            - call: "POST /agdata/machines/${machine_id}/telemetry-ingest"
              payload: { batch_id: "b-first", start_hour_iso: "2026-09-01T00:00:00Z", hour_count: 2, payload_mb: 10 }
              as: System
              captures: { life_end: $.data.lifecycle_status }
          assert:
            - "posture_after_prov == NO_PLAN (modem PROVISIONED, no ACTIVE plan yet)"
            - "posture_mid == CONNECTED and life_mid == REGISTERED (plan ACTIVE, dealer handshake not yet done)"
            - "life_act == ACTIVATED and posture_act == CONNECTED after the dealer handshake"
            - "life_end == IN_SERVICE after the first accepted telemetry batch"

