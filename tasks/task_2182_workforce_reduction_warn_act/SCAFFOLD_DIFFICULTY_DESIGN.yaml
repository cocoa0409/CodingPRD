              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { sel_alice: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { before_active: $.data.active_headcount, before_pending: $.data.pending_separation_count, before_roster: $.data.roster_count }
          trigger:
            - call: "POST /selections/${sel_alice}/decide"
              payload: { decision: "SELECT" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "GET /sites/${site_id}"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
