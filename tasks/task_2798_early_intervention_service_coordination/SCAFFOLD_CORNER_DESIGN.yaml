      - name: makeup_scheduling_error_sweep
        claim_type: error_triggerability
        grounds:
          - errors[ERR_MAKEUP_TARGET_INVALID]
          - errors[ERR_MAKEUP_WINDOW_EXPIRED]
          - errors[ERR_MAKEUP_ALREADY_SCHEDULED]
          - calculations.makeup_obligation
        distinguishing_aspect: |
          All three makeup guards on one line: a makeup aimed at a DELIVERED visit rather than a
          CANCELLED_PROVIDER one, a makeup scheduled 32 days after the cancellation (past
          MAKEUP_WINDOW_DAYS 30) and a second makeup for a cancellation that already has one. The
          32-day and 27-day attempts differ only by scheduling date, which pins the window to the
          cancelled visit's date rather than to the authorization window, and the 2 owed units stay
          below MAKEUP_AT_RISK_THRESHOLD_UNITS 4 so the line must NOT be AT_RISK.
