  # =========================================================================
  # RULE 3 — non_linear_state_machine
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: space_contract_bounded_negotiation_cycle_exhausts_on_fourth_counter
        grounds:
          - state_machines.SpaceContract.OFFERED_to_COUNTERED
          - state_machines.SpaceContract.COUNTERED_to_OFFERED
          - entities.SpaceContract.fields.negotiation_round
          - validations[priority=46]
          - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          A true CYCLE, not a forward chain: OFFERED->COUNTERED->OFFERED can be traversed three times and
          only the exhibitor's COUNTER edge consumes budget (negotiation_round 1, 2, 3 while three REOFFERs
          consume none), so the fourth COUNTER from a legitimately OFFERED contract is rejected with
          ERR_NEGOTIATION_ROUNDS_EXHAUSTED — a counter with no cycle would exhaust after six moves.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-15T00:00:00Z."
            - "VenueContract MCC / HALL_A EXECUTED; Show in SPACE_SELECTION with booth A100 (400 sqft CORNER MAIN_AISLE)."
            - "Exhibitor 'Nordic Furnishings' ACTIVE with one OFFERED contract sc1 on A100, negotiation_round 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "A100", width_ft: 20, depth_ft: 20, location_class: "CORNER", premium_zone: "MAIN_AISLE", max_height_ft: 16 }
              as: FloorManager
              captures: { b_a: $.data.id }
            - call: "POST /shows/${show_id}/booths"
              payload: { booth_number: "C050", width_ft: 10, depth_ft: 20, location_class: "INLINE", premium_zone: "NONE", max_height_ft: 12 }
              as: FloorManager
            - call: "POST /shows/${show_id}/publish-floor-plan"
              payload: {}
              as: ShowDirector
            - call: "POST /exhibitors"
              payload: { legal_name: "Nordic Furnishings", contact_email: "sales@nordic.example", consecutive_years: 6 }
              as: SalesRep
              captures: { ex1: $.data.id }
            - call: "GET /shows/${show_id}"
              payload: {}
              as: ShowDirector
              captures: { show_v1: $.data.version }
            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex1}", expected_show_version: "${show_v1}", requested_sqft: 400, premium_placement_requested: true, booth_ids: ["${b_a}"] }
              as: SalesRep
              captures: { sc1: $.data.id }
          trigger:
            - call: "POST /space-contracts/${sc1}/negotiate"
              payload: { action: "COUNTER", requested_discount_pct: 8 }
              as: Exhibitor
              as_user_id: "${ex1}"
            - call: "POST /space-contracts/${sc1}/negotiate"
              payload: { action: "REOFFER", approved_discount_pct: 5 }
              as: SalesRep
              as_user_id: "u_sales_1"
            - call: "POST /space-contracts/${sc1}/negotiate"
              payload: { action: "COUNTER", requested_discount_pct: 8 }
              as: Exhibitor
              as_user_id: "${ex1}"
            - call: "POST /space-contracts/${sc1}/negotiate"
              payload: { action: "REOFFER", approved_discount_pct: 5 }
              as: SalesRep
              as_user_id: "u_sales_1"
            - call: "POST /space-contracts/${sc1}/negotiate"
              payload: { action: "COUNTER", requested_discount_pct: 8 }
              as: Exhibitor
              as_user_id: "${ex1}"
            - call: "POST /space-contracts/${sc1}/negotiate"
              payload: { action: "REOFFER", approved_discount_pct: 5 }
              as: SalesRep
              as_user_id: "u_sales_1"
            - call: "POST /space-contracts/${sc1}/negotiate"
              payload: { action: "COUNTER", requested_discount_pct: 8 }
              as: Exhibitor
              as_user_id: "${ex1}"
              captures: { err_id: $.data.error_id }
          assert:
            - "After the first COUNTER: SpaceContract.${sc1}.status == COUNTERED and negotiation_round == 1"
            - "After the first REOFFER: SpaceContract.${sc1}.status == OFFERED and negotiation_round == 1"
            - "After the first REOFFER: SpaceContract.${sc1}.approved_discount_pct == 5 and space_fee_cents == 1478466"
            - "After the third COUNTER: SpaceContract.${sc1}.negotiation_round == 3"
            - "After the third REOFFER: SpaceContract.${sc1}.status == OFFERED and negotiation_round == 3"
            - "The fourth COUNTER returns HTTP 422 with ${err_id} == ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
            - "After the rejected fourth COUNTER: SpaceContract.${sc1}.status == OFFERED and negotiation_round == 3"
            - "After the rejected fourth COUNTER: Booth.${b_a}.status == HELD and Show.${show_id}.held_net_sqft == 400"

      - name: sponsorship_deal_two_axes_advance_independently
        grounds:
          - state_machines.SponsorshipDeal.PROPOSED_to_SIGNED
          - state_machines.SponsorshipDeal.SIGNED_to_CANCELLED
          - state_machines.SponsorshipDeal.NOT_STARTED_to_PARTIAL
          - entities.SponsorshipDeal.fields.deal_status
          - entities.SponsorshipDeal.fields.fulfillment_status
        distinguishing_aspect: |
          Two PARALLEL state dimensions on one row: the commercial axis moves PROPOSED->SIGNED->CANCELLED
          while the fulfillment axis independently moves NOT_STARTED->PARTIAL and then STAYS at PARTIAL
          through the cancellation, because the fulfillment axis declares no CANCELLED member — a single
          combined status enum could not represent (CANCELLED, PARTIAL).
        test_recipe:
          setup:
            - "VenueContract MCC / HALL_A EXECUTED; Show 'National Buyers Expo' still in PLANNING (no booths needed)."
            - "SponsorshipPackage ENTRY_ARCH with inventory_total 2, two obligation codes and priority_point_value 12."
            - "Exhibitor 'Nordic Furnishings' ACTIVE with 0 points."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ShowDirector
            - call: "POST /venue-contracts"
              payload: { venue_code: "MCC", hall_code: "HALL_A", hall_gross_sqft: 250000, min_aisle_ratio_pct: 30, max_booth_height_ft: 20, contract_year_start: 2027, contract_year_count: 3, committed_net_sqft_per_year: 1200, attrition_allowance_pct: 15, advance_order_discount_pct: 20, labor_rate_cents_per_hour: 9500, electrical_rate_cents_per_amp: 4200, material_handling_rate_cents_per_cwt: 8800 }
              as: ShowDirector
              captures: { vc_id: $.data.id }
            - call: "POST /venue-contracts/${vc_id}/execute"
              payload: {}
              as: ShowDirector
            - call: "POST /shows"
              payload: { venue_contract_id: "${vc_id}", name: "National Buyers Expo", edition_year: 2027, move_in_start: "2027-03-01", event_start: "2027-03-05", event_end: "2027-03-07", move_out_end: "2027-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3275, selection_desk_capacity: 2 }
              as: ShowDirector
              captures: { show_id: $.data.id }
            - call: "POST /shows/${show_id}/sponsorship-packages"
              payload: { package_code: "ENTRY_ARCH", list_price_cents: 700000, price_floor_cents: 500000, inventory_total: 2, exclusivity_category: "OUTDOOR_FURNITURE", obligation_codes: ["LOGO_ON_ENTRY_ARCH", "BAG_INSERT"], priority_point_value: 12 }
              as: ShowDirector
              captures: { pkg_id: $.data.id }
            - call: "POST /exhibitors"
              payload: { legal_name: "Nordic Furnishings", contact_email: "sales@nordic.example", consecutive_years: 6 }
              as: SalesRep
              captures: { ex1: $.data.id }
            - call: "POST /sponsorship-packages/${pkg_id}/deals"
              payload: { exhibitor_id: "${ex1}", negotiated_price_cents: 600000 }
              as: SalesRep
              as_user_id: "u_sales_1"
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /sponsorship-deals/${deal_id}/sign"
              payload: {}
              as: ShowDirector
              as_user_id: "u_dir_1"
            - call: "GET /sponsorship-deals/${deal_id}/obligations"
              payload: {}
              as: ShowDirector
              captures: { ob1: "$.data[0].id", ob2: "$.data[1].id" }
            - call: "POST /sponsorship-deals/${deal_id}/obligations/${ob1}/resolve"
              payload: { disposition: "DELIVERED" }
              as: FloorManager
              as_user_id: "u_floor_1"
            - call: "POST /sponsorship-deals/${deal_id}/cancel"
              payload: { cancellation_reason: "Sponsor withdrew after the arch was hung" }
              as: ShowDirector
              as_user_id: "u_dir_1"
          assert:
            - "After sign: SponsorshipDeal.${deal_id}.deal_status == SIGNED and fulfillment_status == NOT_STARTED"
            - "After sign: SponsorshipDeal.${deal_id}.obligation_count == 2 and resolved_obligation_count == 0"
            - "After sign: FulfillmentObligation.${ob1}.due_date == 2027-02-19 and status == PENDING"
            - "After resolving ob1: FulfillmentObligation.${ob1}.status == DELIVERED"
            - "After resolving ob1: SponsorshipDeal.${deal_id}.fulfillment_status == PARTIAL and resolved_obligation_count == 1"
            - "After resolving ob1: SponsorshipDeal.${deal_id}.deal_status == SIGNED (commercial axis untouched)"
            - "After resolving ob1: SponsorshipDeal.${deal_id}.fulfillment_credited == false and Exhibitor.${ex1}.sponsorship_fulfillment_points == 0"
            - "After cancel: SponsorshipDeal.${deal_id}.deal_status == CANCELLED"
            - "After cancel: SponsorshipDeal.${deal_id}.fulfillment_status == PARTIAL (fulfillment axis unchanged)"
            - "After cancel: FulfillmentObligation.${ob1}.status == DELIVERED and FulfillmentObligation.${ob2}.status == PENDING"
            - "After cancel: SponsorshipPackage.${pkg_id}.inventory_committed == 0 and inventory_available == 2"

  # =========================================================================
  # RULE 4 — transitive_cascade
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: venue_termination_cascades_four_levels_to_booth_and_service_order_release
        grounds:
          - state_machines.VenueContract.EXECUTED_to_TERMINATED
          - state_machines.Show.PLANNING_to_CANCELLED
          - state_machines.SpaceContract.SIGNED_to_CANCELLED
          - state_machines.Booth.ASSIGNED_to_AVAILABLE
          - concurrency_rules[venue-contract-terminate-stale]
        distinguishing_aspect: |
          A DEPTH-4 chain in which each link is a different entity and each link's own side effects fire:
          VenueContract TERMINATED -> Show CANCELLED -> SpaceContract CANCELLED (fee forced to 0) ->
          {Booth ASSIGNED->AVAILABLE, ServiceOrder SUBMITTED->CANCELLED, points_awarded reversed}.  The
          caller touches only the venue contract; nothing in the request names the booth or the order.
