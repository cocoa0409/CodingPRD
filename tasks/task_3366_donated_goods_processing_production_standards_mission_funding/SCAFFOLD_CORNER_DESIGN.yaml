              payload: { items: [{ category: "TEXTILES", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 25.0 }, { category: "TEXTILES", condition_grade: "UNSALABLE", estimated_value_cents: 0, weight_lbs: 25.0 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
