  - rule_id: priority_pair_validation_conflict
    instances:
      - name: locked_strategy_beats_budget_exceeded_on_commitment_create
        grounds:
          - validations.priority_11.ERR_STRATEGY_LOCKED
          - validations.priority_22.ERR_STRATEGY_BUDGET_EXCEEDED
          - calculations.strategy_budget_available
        distinguishing_aspect: |
          One POST /resource-commitments body violates two rules eleven
          priorities apart: the strategy has been submitted (state rule at
          priority 11) and the requested funding overruns the remaining
          envelope (fiscal rule at priority 22). The identical body is issued
          twice — once before the submit, when only the fiscal rule is
          violated, and once after, when both are — so the lower-priority
          error is proven reachable and the winner is proven to be the
          state rule, not the arithmetic one.
        test_recipe:
          setup:
            - "AssessmentCycle in STRATEGY_DEVELOPMENT with posture OPEN and one SELECTED PriorityCandidate"
            - "ImplementationStrategy in approval_state DRAFT with authorized_budget_cents 5000000 and one DRAFT StrategyObjective"
            - "one PENDING ResourceCommitment for 1500000 cents on that strategy, so budget_available_cents == 3500000"
            - "the INTERNAL ResponsibleParty has fte_capacity_bp 10000 and committed_fte_bp 2500, leaving ample FTE headroom so the priority-20 rule cannot interfere"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
