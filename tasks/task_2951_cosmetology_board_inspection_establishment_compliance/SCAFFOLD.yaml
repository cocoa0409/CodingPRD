scenario: |
  2951. Cosmetology Board Inspection & Establishment Compliance (state cosmetology board): establishment licensing with facility, sanitation and equipment requirements, practitioner license verification and posting requirements at the workstation, routine and complaint-driven inspections with violation scoring and immediate closure authority for imminent hazards, sanitation and disinfection protocol verification including implement handling and foot spa procedures, booth rental relationships and independent contractor license obligations, citation, fine schedule and hearing rights, infection incident investigation and reporting to health authorities, school-to-license pipeline verification and apprenticeship program oversight

domain_name: cosmetology-board-compliance
api_prefix: "/cosmetology"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Graph topology: Practitioner and Establishment are joined many-to-many through
    Workstation + BoothRental; Inspection is self-referential through
    reinspection_of_id; LedgerEntry is polymorphic across Citation / Establishment /
    Practitioner / Inspection subjects. Cyclic machines: Citation
    AMENDED -> CONTESTED -> HEARING_SCHEDULED -> AMENDED (bounded at 2 rounds) and
    Establishment ACTIVE -> PROBATION -> ACTIVE. Inspection carries two independent
    state dimensions (status x hazard_state). Segregation of duties: the Inspector
    who conducted an inspection may never preside over a hearing on a citation
    derived from it.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Establishment
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the licensed establishment.
        constraints: non-empty, max 200 chars
      - name: establishment_type
        type: enum
        source: input
        description: Category of licensed facility, which determines equipment requirements.
        constraints: "one of {SALON, BARBERSHOP, NAIL_SALON, ESTHETICS_SPA, SCHOOL_CLINIC}"
      - name: county_code
        type: string
        source: input
        description: Board district / county code used for inspection routing.
        constraints: exactly 3 uppercase letters
      - name: station_capacity
        type: integer
        source: input
        description: Maximum number of Workstation rows the facility permit allows.
        constraints: ">= 1"
      - name: station_count
        type: integer
        source: computed
        description: Count of Workstation rows whose establishment_id equals this Establishment.id (no status filter; Workstations are never deleted).
        default: 0
      - name: license_status
        type: enum
        source: system
        description: Establishment licensing lifecycle state; see state_machines[Establishment].
        default: PENDING_INSPECTION
        constraints: "one of {PENDING_INSPECTION, ACTIVE, PROBATION, SUSPENDED, CLOSED_IMMINENT_HAZARD, REVOKED}"
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived gate over child operations; recomputed by calculations.establishment_demerit_and_posture.
        default: CLEAR
        constraints: "one of {CLEAR, WATCH, RESTRICTED, FROZEN}"
      - name: demerit_balance
        type: number
        source: computed
        description: Running demerit total; equals sum of LedgerEntry.delta_points over entries with ledger_type == DEMERIT_POINTS and establishment_id == this id.
        default: 0.00
        constraints: 2 decimal places, may not be negative
      - name: open_critical_citation_count
        type: integer
        source: computed
        description: Count of Citation rows whose inspection's establishment_id equals this id, whose status IN {ISSUED, CONTESTED, HEARING_SCHEDULED, AFFIRMED, AMENDED, DELINQUENT} and whose max_finding_severity IN {CRITICAL, IMMINENT_HAZARD}.
        default: 0
      - name: outstanding_fine_total_cents
        type: integer
        source: computed
        description: Sum of Citation.outstanding_fine_cents over Citation rows whose inspection's establishment_id equals this id and whose status NOT IN {DISMISSED, SETTLED}.
        default: 0
      - name: delinquent_fine_total_cents
        type: integer
        source: computed
        description: Sum of Citation.outstanding_fine_cents over Citation rows whose inspection's establishment_id equals this id and whose status == DELINQUENT.
        default: 0
      - name: foot_spa_biofilm_current
        type: boolean
        source: computed
        description: True when the establishment has zero Workstation rows with station_type == FOOT_SPA (vacuous), otherwise true only when EVERY such Workstation has at least one SanitationLog with log_type == FOOT_SPA_WEEKLY_BIOFILM whose performed_at >= current_utc - 7 days.
        default: true
      - name: last_finalized_inspection_at
        type: datetime
        source: system
        description: finalized_at of the most recently FINALIZED Inspection of this establishment, ordered by finalized_at DESC then created_at DESC; null when none.
        default: null

  - name: Practitioner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Legal name printed on the practitioner license.
        constraints: non-empty, max 200 chars
      - name: license_type
        type: enum
        source: input
        description: Discipline of the license or candidacy; APPRENTICE selects the apprentice credited-hours variant.
        constraints: "one of {COSMETOLOGIST, BARBER, NAIL_TECHNICIAN, ESTHETICIAN, INSTRUCTOR, APPRENTICE}"
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; null for apprenticeship-only candidates who never enrolled in a licensed school."
        default: null
      - name: license_status
        type: enum
        source: system
        description: Practitioner licensing lifecycle state; see state_machines[Practitioner].
        default: STUDENT
        constraints: "one of {STUDENT, EXAM_ELIGIBLE, ACTIVE, PROBATION, SUSPENDED, LAPSED, REVOKED}"
      - name: license_expires_on
        type: string
        source: system
        description: Calendar date (YYYY-MM-DD) on which the license lapses, stamped by the ISSUE_LICENSE and REINSTATE license-actions as the UTC date of (effective_at + LICENSE_TERM_DAYS days); null while license_status IN {STUDENT, EXAM_ELIGIBLE}. Never accepted as request input.
        default: null
      - name: credited_hours_school
        type: number
        source: computed
        description: SCHOOL_CLOCK_HOUR portion of calculations.practitioner_credited_hours.
        default: 0.00
      - name: credited_hours_apprentice
        type: number
        source: computed
        description: APPRENTICE_HOUR portion of calculations.practitioner_credited_hours; the variant applied depends on this row's license_type.
        default: 0.00
      - name: credited_hours_total
        type: number
        source: computed
        description: round(credited_hours_school + credited_hours_apprentice, 2).
        default: 0.00
      - name: required_clock_hours_effective
        type: number
        source: computed
        description: School(school_id).required_clock_hours when school_id is non-null, otherwise the constant APPRENTICE_STANDALONE_REQUIRED_HOURS.
        default: 1600.00
      - name: exam_eligible
        type: boolean
        source: computed
        description: True exactly when credited_hours_total >= required_clock_hours_effective.
        default: false
      - name: sanction_points
        type: number
        source: computed
        description: Equals sum of LedgerEntry.delta_points over entries with ledger_type == SANCTION_POINTS and practitioner_id == this id.
        default: 0.00
      - name: suspension_cause_points
        type: number
        source: system
        description: Snapshot of sanction_points at the instant an automatic threshold suspension fired; consumed and reset to null by the REINSTATE license action, which posts the exact compensating reversal.
        default: null

  - name: School
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Registered name of the licensed cosmetology school.
        constraints: non-empty, max 200 chars
      - name: county_code
        type: string
        source: input
        description: Board district / county code of the school campus.
        constraints: exactly 3 uppercase letters
      - name: required_clock_hours
        type: number
        source: input
        description: Clock hours a candidate of this school must accumulate before exam eligibility.
        constraints: "> 0, 2 decimal places"
      - name: accreditation_status
        type: enum
        source: input
        description: Board accreditation state; only ACCREDITED schools may back SCHOOL_CLOCK_HOUR training records.
        default: ACCREDITED
        constraints: "one of {ACCREDITED, PROBATIONARY, WITHDRAWN}"
      - name: apprenticeship_program_approved
        type: boolean
        source: input
        description: True when the board has approved this school to sponsor apprenticeship hours.
        default: false

  - name: TrainingRecord
    parent: Practitioner
    common_fields: false
    fields:
      - name: practitioner_id
        type: string
        source: input
        description: "FK -> Practitioner.id; the candidate earning the hours."
      - name: credit_type
        type: enum
        source: input
        description: Which hour ledger this record feeds.
        constraints: "one of {SCHOOL_CLOCK_HOUR, APPRENTICE_HOUR}"
      - name: hours
        type: number
        source: input
        description: Raw hours claimed on this record before daily / weekly caps and ratios are applied.
        constraints: "> 0, <= 24, 2 decimal places"
      - name: performed_on
        type: string
        source: input
        description: UTC calendar date (YYYY-MM-DD) the hours were performed; the grouping key for both daily and ISO-week caps.
      - name: discipline
        type: enum
        source: input
        description: Curriculum area the hours are booked against.
        constraints: "one of {THEORY, PRACTICAL, SANITATION, DISINFECTION, BUSINESS_LAW}"
      - name: school_id
        type: string
        source: input
        description: "FK -> School.id; required when credit_type == SCHOOL_CLOCK_HOUR and MUST be null when credit_type == APPRENTICE_HOUR."
        default: null
      - name: sponsor_practitioner_id
        type: string
        source: input
        description: "FK -> Practitioner.id; required when credit_type == APPRENTICE_HOUR (the supervising INSTRUCTOR) and MUST be null when credit_type == SCHOOL_CLOCK_HOUR."
        default: null

  - name: Workstation
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the facility that owns this station."
      - name: station_number
        type: integer
        source: input
        description: Station label inside the facility; unique per establishment_id.
        constraints: ">= 1, unique within establishment_id"
      - name: station_type
        type: enum
        source: input
        description: Equipment class of the station; gates which SanitationLog log_types are legal here.
        constraints: "one of {STYLING_CHAIR, NAIL_TABLE, FOOT_SPA, FACIAL_ROOM}"
      - name: posted_practitioner_id
        type: string
        source: input
        description: "FK -> Practitioner.id; the practitioner whose license card is posted at this station, null when nothing is posted."
        default: null
      - name: posting_status
        type: enum
        source: computed
        description: Derived posting-compliance verdict; recomputed by calculations.workstation_posting_status.
        default: MISSING_POSTING
        constraints: "one of {MISSING_POSTING, STALE_POSTING, COMPLIANT}"
      - name: last_biofilm_cycle_at
        type: datetime
        source: computed
        description: performed_at of the most recent SanitationLog on this Workstation with log_type == FOOT_SPA_WEEKLY_BIOFILM, ordered by performed_at DESC then created_at DESC; null when none.
        default: null

  - name: BoothRental
    parent: Workstation
    common_fields: true
    fields:
      - name: workstation_id
        type: string
        source: input
        description: "FK -> Workstation.id; the station occupied for the rental term."
      - name: practitioner_id
        type: string
        source: input
        description: "FK -> Practitioner.id; the employee or independent-contractor booth renter."
      - name: rental_type
        type: enum
        source: input
        description: Employment classification; BOOTH_RENTER_INDEPENDENT_CONTRACTOR carries the independent licence-posting obligation.
        constraints: "one of {EMPLOYEE, BOOTH_RENTER_INDEPENDENT_CONTRACTOR}"
      - name: term_start_at
        type: datetime
        source: input
        description: Inclusive start of the occupancy interval (ISO 8601 UTC, three fractional digits).
      - name: term_end_at
        type: datetime
        source: input
        description: Exclusive end of the occupancy interval; null means open-ended (treated as +infinity by the overlap rule).
        default: null
      - name: monthly_rent_cents
        type: integer
        source: input
        description: Monthly booth rent in cents; 0 is legal for EMPLOYEE rows.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Rental lifecycle state; see state_machines[BoothRental].
        default: PROPOSED
        constraints: "one of {PROPOSED, ACTIVE, TERMINATED, VOIDED}"
      - name: terminated_at
        type: datetime
        source: system
        description: Instant the rental left ACTIVE or PROPOSED for a terminal state; null while PROPOSED or ACTIVE.
        default: null

  - name: Inspection
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the facility under inspection."
      - name: inspection_type
        type: enum
        source: input
        description: Why the visit happens; REINSPECTION is exempt from the 24-hour cool-down buffer.
        constraints: "one of {ROUTINE, COMPLAINT_DRIVEN, REINSPECTION}"
      - name: reinspection_of_id
        type: string
        source: input
        description: "FK -> Inspection.id; required when inspection_type == REINSPECTION and MUST be null otherwise (self-referential edge)."
        default: null
      - name: inspector_user_id
        type: string
        source: input
        description: Opaque Inspector operator id credited with the visit; the segregation-of-duties check compares it to Hearing.presiding_officer_user_id.
      - name: complaint_reference
        type: string
        source: input
        description: External complaint docket reference; required when inspection_type == COMPLAINT_DRIVEN, MUST be null otherwise.
        default: null
      - name: window_start_at
        type: datetime
        source: input
        description: Inclusive start of the scheduled inspection window (ISO 8601 UTC).
      - name: window_end_at
        type: datetime
        source: input
        description: Inclusive end of the scheduled inspection window; must be strictly after window_start_at.
      - name: status
        type: enum
        source: system
        description: Workflow dimension of the Inspection state machine.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, PENDING_REVIEW, FINALIZED}"
      - name: hazard_state
        type: enum
        source: system
        description: Imminent-hazard dimension of the Inspection state machine; evolves independently of status.
        default: NONE
        constraints: "one of {NONE, HAZARD_DECLARED, HAZARD_CLEARED}"
      - name: started_at
        type: datetime
        source: system
        description: current_utc stamped when status moved SCHEDULED -> IN_PROGRESS; null before.
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: current_utc stamped when status moved IN_PROGRESS -> PENDING_REVIEW; the repeat-offense cutoff for the PROVISIONAL score variant.
        default: null
      - name: finalized_at
        type: datetime
        source: system
        description: current_utc stamped when status moved PENDING_REVIEW -> FINALIZED; the repeat-offense cutoff for the FINAL score variant.
        default: null
      - name: finding_count
        type: integer
        source: computed
        description: Count of ViolationFinding rows whose inspection_id equals this id.
        default: 0
      - name: provisional_adjusted_score
        type: number
        source: computed
        description: PROVISIONAL variant output of calculations.inspection_adjusted_score, written at submit; null before submit.
        default: null
      - name: final_adjusted_score
        type: number
        source: computed
        description: FINAL variant output of calculations.inspection_adjusted_score, written at finalize; null before finalize.
        default: null
      - name: provisional_outcome
        type: enum
        source: computed
        description: Outcome band derived from provisional_adjusted_score at submit.
        default: null
        constraints: "one of {PASS, CONDITIONAL_PASS, FAIL, IMMEDIATE_CLOSURE} or null"
      - name: final_outcome
        type: enum
        source: computed
        description: Outcome band derived from final_adjusted_score at finalize.
        default: null
        constraints: "one of {PASS, CONDITIONAL_PASS, FAIL, IMMEDIATE_CLOSURE} or null"
      - name: demerit_balance_before_finalize
        type: number
        source: system
        description: Snapshot of Establishment.demerit_balance taken at the very start of the finalize cascade, before this inspection's demerit LedgerEntry is posted; the pinned tier input for calculations.citation_fine_amount.
        default: null
      - name: citation_count
        type: integer
        source: computed
        description: Count of Citation rows whose inspection_id equals this id.
        default: 0

  - name: ViolationCode
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: Board rule citation string, e.g. "VC-DIS-210"; globally unique.
        constraints: non-empty, unique across all ViolationCode rows
      - name: category
        type: enum
        source: input
        description: Regulatory family the rule belongs to.
        constraints: "one of {SANITATION, DISINFECTION, IMPLEMENT_HANDLING, FOOT_SPA, LICENSING_POSTING, FACILITY, EQUIPMENT, RECORDKEEPING}"
      - name: severity
        type: enum
        source: input
        description: Severity band; selects SEVERITY_WEIGHT and controls on-site-correction credit eligibility.
        constraints: "one of {MINOR, MAJOR, CRITICAL, IMMINENT_HAZARD}"
      - name: base_points
        type: number
        source: input
        description: Per-unit demerit points before severity weight, observed count and repeat factor.
        constraints: "> 0, 2 decimal places"
      - name: fine_cents_base
        type: integer
        source: input
        description: Statutory base fine in cents contributed by one finding of this code.
        constraints: ">= 0"

  - name: ViolationFinding
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the visit that recorded the finding."
      - name: violation_code_id
        type: string
        source: input
        description: "FK -> ViolationCode.id; the rule violated."
      - name: attributed_practitioner_id
        type: string
        source: input
        description: "FK -> Practitioner.id; null when the violation is attributed to the establishment itself rather than to an individual."
        default: null
      - name: workstation_id
        type: string
        source: input
        description: "FK -> Workstation.id; null when the finding is not station-specific."
        default: null
      - name: observed_count
        type: integer
        source: input
        description: Number of distinct occurrences observed; multiplies the per-unit points.
        constraints: ">= 1"
      - name: corrected_on_site
        type: boolean
        source: input
        description: True when the inspector witnessed correction before leaving; earns a severity-gated credit that differs between the PROVISIONAL and FINAL score variants.
        default: false
      - name: severity
        type: enum
        source: computed
        description: Copied from ViolationCode.severity at creation and frozen thereafter.
        constraints: "one of {MINOR, MAJOR, CRITICAL, IMMINENT_HAZARD}"
      - name: repeat_factor_provisional
        type: number
        source: computed
        description: Repeat multiplier resolved with cutoff_at = Inspection.submitted_at; null before submit.
        default: null
      - name: repeat_factor_final
        type: number
        source: computed
        description: Repeat multiplier resolved with cutoff_at = Inspection.finalized_at; null before finalize.
        default: null
      - name: provisional_points
        type: number
        source: computed
        description: Per-finding PROVISIONAL points, rounded to 2 dp before summation; null before submit.
        default: null
      - name: final_points
        type: number
        source: computed
        description: Per-finding FINAL points, rounded to 2 dp before summation; null before finalize.
        default: null
      - name: declared_hazard
        type: boolean
        source: system
        description: Set true by POST /cosmetology/inspections/{id}/hazard-declaration when this finding is named as the imminent hazard.
        default: false
      - name: note
        type: string
        source: input
        description: Free-text inspector note.
        default: null

  - name: Citation
    parent: Inspection
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the FINALIZED visit the citation is derived from."
      - name: subject_type
        type: enum
        source: input
        description: Whether the establishment or an individual practitioner is cited; selects SUBJECT_FACTOR.
        constraints: "one of {ESTABLISHMENT, PRACTITIONER}"
      - name: subject_practitioner_id
        type: string
        source: input
        description: "FK -> Practitioner.id; required when subject_type == PRACTITIONER and MUST be null when subject_type == ESTABLISHMENT."
        default: null
      - name: citation_number
        type: string
        source: system
        description: Board-minted human citation number; unique.
      - name: max_finding_severity
        type: enum
        source: computed
        description: Highest severity among the ViolationFinding rows of this citation's inspection, ordered MINOR < MAJOR < CRITICAL < IMMINENT_HAZARD; null when the inspection has zero findings.
        default: null
        constraints: "one of {MINOR, MAJOR, CRITICAL, IMMINENT_HAZARD} or null"
      - name: demerit_tier_multiplier
        type: number
        source: computed
        description: DEMERIT_TIER_MULTIPLIER selected from Inspection.demerit_balance_before_finalize; frozen at citation creation.
      - name: assessed_fine_cents
        type: integer
        source: computed
        description: Output of calculations.citation_fine_amount; re-derived only by a hearing AMENDED decision.
      - name: administrative_fee_cents
        type: integer
        source: computed
        description: Step 3 of calculations.citation_total_due_cents.
      - name: total_due_cents
        type: integer
        source: computed
        description: Step 4 of calculations.citation_total_due_cents; assessed_fine_cents + administrative_fee_cents.
      - name: outstanding_fine_cents
        type: integer
        source: computed
        description: Equals sum of LedgerEntry.delta_cents over entries with ledger_type == FINE_CENTS and citation_id == this id.
        default: 0
      - name: status
        type: enum
        source: system
        description: Citation lifecycle state; see state_machines[Citation].
        default: ISSUED
        constraints: "one of {ISSUED, CONTESTED, HEARING_SCHEDULED, AFFIRMED, AMENDED, DISMISSED, SETTLED, DELINQUENT}"
      - name: issued_at
        type: datetime
        source: system
        description: current_utc at citation creation.
      - name: due_at
        type: datetime
        source: computed
        description: issued_at + PAYMENT_TERM_DAYS days; the delinquency sweep boundary.
      - name: contest_deadline_at
        type: datetime
        source: computed
        description: issued_at + CONTEST_WINDOW_DAYS days for round 1; re-based to the amending Hearing.decided_at + CONTEST_WINDOW_DAYS when status becomes AMENDED.
      - name: hearing_round_count
        type: integer
        source: system
        description: Number of Hearing rows created against this citation; capped by MAX_HEARING_ROUNDS.
        default: 0

  - name: Hearing
    parent: Citation
    common_fields: true
    fields:
      - name: citation_id
        type: string
        source: input
        description: "FK -> Citation.id; the contested citation being heard."
      - name: presiding_officer_user_id
        type: string
        source: input
        description: Opaque HearingOfficer operator id; MUST NOT equal the inspector_user_id of the citation's Inspection (segregation of duties).
      - name: scheduled_at
        type: datetime
        source: input
        description: Instant the hearing is calendared for; must be >= current_utc at creation.
      - name: status
        type: enum
        source: system
        description: Hearing lifecycle state.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, DECIDED}"
      - name: decision
        type: enum
        source: system
        description: Branch chosen by the presiding officer; null while SCHEDULED.
        default: null
        constraints: "one of {AFFIRMED, AMENDED, DISMISSED} or null"
      - name: amended_fine_cents
        type: integer
        source: system
        description: Replacement assessed fine supplied with an AMENDED decision; null for AFFIRMED and DISMISSED.
        default: null
      - name: rationale
        type: string
        source: system
        description: Written rationale recorded with the decision.
        default: null
      - name: round_index
        type: integer
        source: system
        description: Citation.hearing_round_count after this Hearing was created (1 for the first hearing, 2 for the second).
      - name: decided_at
        type: datetime
        source: system
        description: current_utc stamped when status moved SCHEDULED -> DECIDED; null before.
        default: null

  - name: SanitationLog
    parent: Workstation
    common_fields: false
    fields:
      - name: workstation_id
        type: string
        source: input
        description: "FK -> Workstation.id; the station whose implements or foot spa were processed."
      - name: log_type
        type: enum
        source: input
        description: Which disinfection protocol was executed; gates the station_type check and the minimum contact time.
        constraints: "one of {IMPLEMENT_DISINFECTION, FOOT_SPA_AFTER_CLIENT, FOOT_SPA_END_OF_DAY, FOOT_SPA_WEEKLY_BIOFILM}"
      - name: performed_at
        type: datetime
        source: input
        description: Inclusive start of the disinfection cycle (ISO 8601 UTC, three fractional digits).
      - name: contact_minutes
        type: number
        source: input
        description: Wet-contact duration in minutes; must be >= MIN_CONTACT_MINUTES[log_type].
        constraints: "> 0, 2 decimal places"
      - name: disinfectant_epa_reg_number
        type: string
        source: input
        description: EPA registration number of the hospital-grade disinfectant used.
        constraints: non-empty
      - name: implement_batch_count
        type: integer
        source: input
        description: Number of implements in the batch; required when log_type == IMPLEMENT_DISINFECTION, MUST be null for FOOT_SPA_* types.
        default: null
      - name: occupancy_end_at
        type: datetime
        source: computed
        description: performed_at + contact_minutes minutes; the exclusive end of the cycle's occupancy interval on the station.

  - name: InfectionIncident
    parent: Establishment
    common_fields: true
    fields:
      - name: establishment_id
        type: string
        source: input
        description: "FK -> Establishment.id; the facility where exposure is suspected."
      - name: suspected_practitioner_id
        type: string
        source: input
        description: "FK -> Practitioner.id; null when no individual is implicated."
        default: null
      - name: case_count
        type: integer
        source: input
        description: Number of client infection cases in the cluster; >= MULTI_CASE_THRESHOLD selects the short notification window.
        constraints: ">= 1"
      - name: onset_date
        type: string
        source: input
        description: UTC calendar date (YYYY-MM-DD) of earliest symptom onset.
      - name: narrative
        type: string
        source: input
        description: Reporter's description of the cluster.
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: Investigation lifecycle state; see state_machines[InfectionIncident].
        default: REPORTED
        constraints: "one of {REPORTED, NOTIFIED, ESCALATED_OVERDUE, RESOLVED_SUBSTANTIATED, RESOLVED_UNSUBSTANTIATED}"
      - name: reported_at
        type: datetime
        source: system
        description: current_utc at creation; the base of notification_deadline_at.
      - name: notification_deadline_at
        type: datetime
        source: computed
        description: Output of calculations.infection_notification_deadline.
      - name: notified_at
        type: datetime
        source: system
        description: current_utc stamped when the health authority notification was filed; null before.
        default: null
      - name: health_authority_reference
        type: string
        source: system
        description: Reference number returned by the public health authority; null before notification.
        default: null
      - name: findings_summary
        type: string
        source: system
        description: Investigator's closing summary recorded with the resolution; null before resolution.
        default: null

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: ledger_type
        type: enum
        source: system
        description: Which conserved quantity this entry moves.
        constraints: "one of {FINE_CENTS, DEMERIT_POINTS, SANCTION_POINTS}"
      - name: entry_reason
        type: enum
        source: system
        description: The transition that posted the entry.
        constraints: "one of {CITATION_ASSESSMENT, CITATION_PAYMENT, CITATION_LATE_PENALTY, CITATION_AMENDMENT_ADJUSTMENT, CITATION_DISMISSAL_REVERSAL, INSPECTION_DEMERIT_ASSESSMENT, INSPECTION_DEMERIT_REVERSAL, INFECTION_SANCTION_ASSESSMENT, REINSTATEMENT_SANCTION_REVERSAL}"
      - name: delta_cents
        type: integer
        source: system
        description: Signed cents movement; non-null exactly when ledger_type == FINE_CENTS, null otherwise.
        default: null
      - name: delta_points
        type: number
        source: system
        description: Signed points movement, 2 dp; non-null exactly when ledger_type IN {DEMERIT_POINTS, SANCTION_POINTS}, null otherwise.
        default: null
      - name: citation_id
        type: string
        source: system
        description: "FK -> Citation.id; set for every FINE_CENTS entry and for INSPECTION_DEMERIT_REVERSAL entries posted by a dismissal, null otherwise."
        default: null
      - name: establishment_id
        type: string
        source: system
        description: "FK -> Establishment.id; set for every DEMERIT_POINTS entry, null otherwise."
        default: null
      - name: practitioner_id
        type: string
        source: system
        description: "FK -> Practitioner.id; set for every SANCTION_POINTS entry, null otherwise."
        default: null
      - name: inspection_id
        type: string
        source: system
        description: "FK -> Inspection.id; set for INSPECTION_DEMERIT_ASSESSMENT and INSPECTION_DEMERIT_REVERSAL entries, null otherwise."
        default: null
      - name: occurred_at
        type: datetime
        source: system
        description: current_utc at the instant the entry was posted; the chronological replay key for ledger reconstruction (tie-break created_at ASC).

state_machines:
  - entity: Establishment
    dimension: license_status
    initial_state: PENDING_INSPECTION
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_INSPECTION
        to: ACTIVE
        trigger: "POST /cosmetology/inspections/{id}/finalize (system consequence, hop 1 of the finalize cascade)"
        actor: system
        preconditions:
          - "Establishment.license_status == PENDING_INSPECTION"
          - "Inspection.final_outcome IN {PASS, CONDITIONAL_PASS}"
        side_effects:
          - "recompute calculations.establishment_demerit_and_posture -> Establishment.compliance_posture"
          - "increments Establishment.version by 1"
        note: "A FAIL or IMMEDIATE_CLOSURE finalize leaves license_status at PENDING_INSPECTION."
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /cosmetology/inspections/{id}/finalize (system consequence, hop 3 of the finalize cascade)"
        actor: system
        preconditions:
          - "Establishment.license_status == ACTIVE"
          - "Establishment.demerit_balance >= PROBATION_DEMERIT_THRESHOLD (100.00) after the INSPECTION_DEMERIT_ASSESSMENT LedgerEntry was posted"
          - "Establishment.demerit_balance < REVOCATION_DEMERIT_THRESHOLD (200.00)"
        side_effects:
          - "every BoothRental with status == PROPOSED on a Workstation of this Establishment moves PROPOSED -> VOIDED (hop 4)"
          - "increments Establishment.version by 1"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /cosmetology/hearings/{id}/decision with decision == DISMISSED (system consequence, hop 3 of the dismissal cascade)"
        actor: system
        preconditions:
          - "Establishment.license_status == PROBATION"
          - "Establishment.demerit_balance < PROBATION_DEMERIT_THRESHOLD (100.00) after the INSPECTION_DEMERIT_REVERSAL LedgerEntry was posted"
          - "Establishment has zero Citation rows with status == DELINQUENT"
        side_effects:
          - "recompute calculations.establishment_demerit_and_posture -> Establishment.compliance_posture"
          - "increments Establishment.version by 1"
        note: "This closes the ACTIVE -> PROBATION -> ACTIVE cycle; VOIDED BoothRentals are NOT resurrected."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /_clock/set_current_utc delinquency sweep (system consequence, hop 2)"
        actor: system
        preconditions:
          - "Establishment.license_status IN {ACTIVE, PROBATION}"
          - "a Citation of this Establishment moved to DELINQUENT in this sweep and its max_finding_severity IN {CRITICAL, IMMINENT_HAZARD}"
        side_effects:
          - "recompute posture -> FROZEN"
          - "every BoothRental with status == ACTIVE on a Workstation of this Establishment moves ACTIVE -> TERMINATED with terminated_at = current_utc"
          - "increments Establishment.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /_clock/set_current_utc delinquency sweep (system consequence, hop 2)"
        actor: system
        preconditions:
          - "Establishment.license_status IN {ACTIVE, PROBATION}"
          - "a Citation of this Establishment moved to DELINQUENT in this sweep and its max_finding_severity IN {CRITICAL, IMMINENT_HAZARD}"
        side_effects:
          - "recompute posture -> FROZEN"
          - "every BoothRental with status == ACTIVE on a Workstation of this Establishment moves ACTIVE -> TERMINATED with terminated_at = current_utc"
          - "increments Establishment.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cosmetology/citations/{id}/payments that settles the last DELINQUENT citation (system consequence)"
        actor: system
        preconditions:
          - "Establishment.license_status == SUSPENDED"
          - "Establishment has zero Citation rows with status == DELINQUENT after this payment"
          - "Establishment.demerit_balance < PROBATION_DEMERIT_THRESHOLD (100.00)"
        side_effects:
          - "recompute calculations.establishment_demerit_and_posture -> Establishment.compliance_posture"
          - "increments Establishment.version by 1"
      - from: ACTIVE
        to: CLOSED_IMMINENT_HAZARD
        trigger: "POST /cosmetology/inspections/{id}/hazard-declaration"
        actor: Inspector
        preconditions:
          - "Inspection.hazard_state == NONE"
          - "Inspection.status IN {IN_PROGRESS, PENDING_REVIEW}"
          - "the named ViolationFinding belongs to this Inspection and its severity == IMMINENT_HAZARD"
        side_effects:
          - "ViolationFinding.declared_hazard := true"
          - "Inspection.hazard_state NONE -> HAZARD_DECLARED"
          - "recompute posture -> FROZEN"
          - "increments Establishment.version by 1"
      - from: PROBATION
        to: CLOSED_IMMINENT_HAZARD
        trigger: "POST /cosmetology/inspections/{id}/hazard-declaration"
        actor: Inspector
        preconditions:
          - "Inspection.hazard_state == NONE"
          - "Inspection.status IN {IN_PROGRESS, PENDING_REVIEW}"
          - "the named ViolationFinding belongs to this Inspection and its severity == IMMINENT_HAZARD"
        side_effects:
          - "ViolationFinding.declared_hazard := true"
          - "Inspection.hazard_state NONE -> HAZARD_DECLARED"
          - "recompute posture -> FROZEN"
          - "increments Establishment.version by 1"
      - from: PENDING_INSPECTION
        to: CLOSED_IMMINENT_HAZARD
        trigger: "POST /cosmetology/inspections/{id}/hazard-declaration"
        actor: Inspector
        preconditions:
          - "Inspection.hazard_state == NONE"
          - "Inspection.status IN {IN_PROGRESS, PENDING_REVIEW}"
          - "the named ViolationFinding belongs to this Inspection and its severity == IMMINENT_HAZARD"
        side_effects:
          - "ViolationFinding.declared_hazard := true"
          - "Inspection.hazard_state NONE -> HAZARD_DECLARED"
          - "recompute posture -> FROZEN"
          - "increments Establishment.version by 1"
      - from: CLOSED_IMMINENT_HAZARD
        to: ACTIVE
        trigger: "POST /cosmetology/inspections/{id}/hazard-clearance"
        actor: BoardAdmin
        preconditions:
          - "Inspection.hazard_state == HAZARD_DECLARED"
          - "clearing_reinspection_id names an Inspection with inspection_type == REINSPECTION, establishment_id == this Establishment.id, status == FINALIZED, hazard_state == NONE and final_adjusted_score <= HAZARD_CLEARANCE_MAX_SCORE (10.00)"
          - "Establishment.foot_spa_biofilm_current == true"
        side_effects:
          - "Inspection.hazard_state HAZARD_DECLARED -> HAZARD_CLEARED"
          - "recompute calculations.establishment_demerit_and_posture -> Establishment.compliance_posture"
          - "increments Establishment.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /cosmetology/inspections/{id}/finalize (system consequence, hop 3 of the finalize cascade)"
        actor: system
        preconditions:
          - "Establishment.license_status IN {ACTIVE, PROBATION}"
          - "Establishment.demerit_balance >= REVOCATION_DEMERIT_THRESHOLD (200.00) after the INSPECTION_DEMERIT_ASSESSMENT LedgerEntry was posted"
        side_effects:
          - "every BoothRental with status IN {PROPOSED, ACTIVE} on a Workstation of this Establishment moves to VOIDED (from PROPOSED) or TERMINATED (from ACTIVE)"
          - "recompute posture -> FROZEN"
          - "increments Establishment.version by 1"
      - from: PROBATION
        to: REVOKED
        trigger: "POST /cosmetology/inspections/{id}/finalize (system consequence, hop 3 of the finalize cascade)"
        actor: system
        preconditions:
          - "Establishment.license_status IN {ACTIVE, PROBATION}"
          - "Establishment.demerit_balance >= REVOCATION_DEMERIT_THRESHOLD (200.00) after the INSPECTION_DEMERIT_ASSESSMENT LedgerEntry was posted"
        side_effects:
          - "every BoothRental with status IN {PROPOSED, ACTIVE} on a Workstation of this Establishment moves to VOIDED (from PROPOSED) or TERMINATED (from ACTIVE)"
          - "recompute posture -> FROZEN"
          - "increments Establishment.version by 1"

  - entity: Inspection
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /cosmetology/inspections/{id}/start"
        actor: Inspector
        preconditions:
          - "Inspection.status == SCHEDULED"
        side_effects:
          - "Inspection.started_at := current_utc"
          - "increments Inspection.version by 1"
      - from: IN_PROGRESS
        to: PENDING_REVIEW
        trigger: "POST /cosmetology/inspections/{id}/submit"
        actor: Inspector
        preconditions:
          - "Inspection.status == IN_PROGRESS"
        side_effects:
          - "Inspection.submitted_at := current_utc"
          - "for every ViolationFinding of this Inspection: write repeat_factor_provisional and provisional_points per calculations.inspection_adjusted_score variant PROVISIONAL"
          - "recompute calculations.inspection_adjusted_score variant PROVISIONAL -> Inspection.provisional_adjusted_score"
          - "derive Inspection.provisional_outcome from provisional_adjusted_score and hazard_state"
          - "increments Inspection.version by 1"
        note: "An Inspection with zero ViolationFinding rows submits successfully with provisional_adjusted_score == 0.00."
      - from: PENDING_REVIEW
        to: FINALIZED
        trigger: "POST /cosmetology/inspections/{id}/finalize"
        actor: BoardAdmin
        preconditions:
          - "Inspection.status == PENDING_REVIEW"
        side_effects:
          - "Inspection.demerit_balance_before_finalize := Establishment.demerit_balance (snapshot taken BEFORE any ledger posting in this cascade)"
          - "Inspection.finalized_at := current_utc"
          - "for every ViolationFinding of this Inspection: write repeat_factor_final and final_points per calculations.inspection_adjusted_score variant FINAL"
          - "recompute calculations.inspection_adjusted_score variant FINAL -> Inspection.final_adjusted_score"
          - "derive Inspection.final_outcome from final_adjusted_score and hazard_state"
          - "cascade hop 2: create LedgerEntry(ledger_type=DEMERIT_POINTS, entry_reason=INSPECTION_DEMERIT_ASSESSMENT, delta_points=+final_adjusted_score, establishment_id, inspection_id) which recomputes Establishment.demerit_balance"
          - "cascade hop 3: the new demerit_balance recomputes Establishment.compliance_posture and may drive license_status PENDING_INSPECTION -> ACTIVE, ACTIVE -> PROBATION, or ACTIVE|PROBATION -> REVOKED"
          - "cascade hop 4: a license_status move to PROBATION or REVOKED voids every PROPOSED BoothRental of the Establishment"
          - "cascade hop 5: each BoothRental VOIDED in hop 4 whose practitioner_id equals its Workstation.posted_practitioner_id clears that Workstation.posted_practitioner_id to null, which recomputes Workstation.posting_status to MISSING_POSTING and increments Workstation.version by 1"
          - "Establishment.last_finalized_inspection_at := Inspection.finalized_at"
          - "increments Inspection.version by 1"

  - entity: Inspection
    dimension: hazard_state
    initial_state: NONE
    terminal_states: [HAZARD_CLEARED]
    transitions:
      - from: NONE
        to: HAZARD_DECLARED
        trigger: "POST /cosmetology/inspections/{id}/hazard-declaration"
        actor: Inspector
        preconditions:
          - "Inspection.hazard_state == NONE"
          - "Inspection.status IN {IN_PROGRESS, PENDING_REVIEW}"
          - "hazard_violation_finding_id names a ViolationFinding of this Inspection whose severity == IMMINENT_HAZARD"
        side_effects:
          - "ViolationFinding.declared_hazard := true"
          - "Establishment.license_status moves to CLOSED_IMMINENT_HAZARD from PENDING_INSPECTION, ACTIVE or PROBATION"
          - "Establishment.compliance_posture := FROZEN"
          - "increments Inspection.version by 1"
        note: "Independent of the status dimension: declaring a hazard never changes Inspection.status, and the inspection may still be submitted and finalized afterwards."
      - from: HAZARD_DECLARED
        to: HAZARD_CLEARED
        trigger: "POST /cosmetology/inspections/{id}/hazard-clearance"
        actor: BoardAdmin
        preconditions:
          - "Inspection.hazard_state == HAZARD_DECLARED"
          - "Establishment.license_status == CLOSED_IMMINENT_HAZARD"
          - "clearing_reinspection_id names a FINALIZED REINSPECTION of the same Establishment with hazard_state == NONE and final_adjusted_score <= HAZARD_CLEARANCE_MAX_SCORE (10.00)"
          - "Establishment.foot_spa_biofilm_current == true"
        side_effects:
          - "Establishment.license_status CLOSED_IMMINENT_HAZARD -> ACTIVE"
          - "recompute Establishment.compliance_posture"
          - "increments Inspection.version by 1"

  - entity: Citation
    dimension: status
    initial_state: ISSUED
    terminal_states: [SETTLED, DISMISSED]
    transitions:
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /cosmetology/citations/{id}/contest"
        actor: EstablishmentOwner | Practitioner
        preconditions:
          - "Citation.status IN {ISSUED, AMENDED}"
          - "current_utc <= Citation.contest_deadline_at"
        side_effects:
          - "increments Citation.version by 1"
      - from: AMENDED
        to: CONTESTED
        trigger: "POST /cosmetology/citations/{id}/contest"
        actor: EstablishmentOwner | Practitioner
        preconditions:
          - "Citation.status IN {ISSUED, AMENDED}"
          - "current_utc <= Citation.contest_deadline_at (re-based to the amending Hearing.decided_at + CONTEST_WINDOW_DAYS)"
        side_effects:
          - "increments Citation.version by 1"
        note: "Closes the AMENDED -> CONTESTED -> HEARING_SCHEDULED -> AMENDED cycle, bounded at MAX_HEARING_ROUNDS rounds."
      - from: CONTESTED
        to: HEARING_SCHEDULED
        trigger: "POST /cosmetology/citations/{id}/hearings"
        actor: BoardAdmin
        preconditions:
          - "Citation.status == CONTESTED"
          - "Citation.hearing_round_count < MAX_HEARING_ROUNDS (2)"
          - "presiding_officer_user_id != Inspection(Citation.inspection_id).inspector_user_id"
        side_effects:
          - "create Hearing with status SCHEDULED and round_index = Citation.hearing_round_count + 1"
          - "increments Citation.hearing_round_count by 1"
          - "increments Citation.version by 1"
      - from: HEARING_SCHEDULED
        to: AFFIRMED
        trigger: "POST /cosmetology/hearings/{id}/decision with decision == AFFIRMED"
        actor: HearingOfficer
        preconditions:
          - "Hearing.status == SCHEDULED"
          - "Citation.status == HEARING_SCHEDULED"
        side_effects:
          - "Hearing.status SCHEDULED -> DECIDED, Hearing.decided_at := current_utc"
          - "Citation.assessed_fine_cents, administrative_fee_cents, total_due_cents and outstanding_fine_cents are unchanged; no LedgerEntry is posted"
          - "increments Citation.version by 1"
      - from: HEARING_SCHEDULED
        to: AMENDED
        trigger: "POST /cosmetology/hearings/{id}/decision with decision == AMENDED"
        actor: HearingOfficer
        preconditions:
          - "Hearing.status == SCHEDULED"
          - "Citation.status == HEARING_SCHEDULED"
          - "amended_fine_cents is present and >= FINE_FLOOR_CENTS (5000) and <= Citation.assessed_fine_cents"
        side_effects:
          - "Hearing.status SCHEDULED -> DECIDED, Hearing.amended_fine_cents := amended_fine_cents, Hearing.decided_at := current_utc"
          - "Citation.assessed_fine_cents := amended_fine_cents; administrative_fee_cents and total_due_cents re-derived by calculations.citation_total_due_cents steps 2-4"
          - "create LedgerEntry(ledger_type=FINE_CENTS, entry_reason=CITATION_AMENDMENT_ADJUSTMENT, delta_cents = new total_due_cents - old total_due_cents, citation_id) which recomputes Citation.outstanding_fine_cents"
          - "Citation.contest_deadline_at := Hearing.decided_at + CONTEST_WINDOW_DAYS days"
          - "increments Citation.version by 1"
        note: "Demerit points are NOT adjusted by an AMENDED decision; only a DISMISSED decision reverses demerits."
      - from: HEARING_SCHEDULED
        to: DISMISSED
        trigger: "POST /cosmetology/hearings/{id}/decision with decision == DISMISSED"
        actor: HearingOfficer
        preconditions:
          - "Hearing.status == SCHEDULED"
          - "Citation.status == HEARING_SCHEDULED"
        side_effects:
          - "Hearing.status SCHEDULED -> DECIDED, Hearing.decided_at := current_utc"
          - "cascade hop 2a: create LedgerEntry(ledger_type=FINE_CENTS, entry_reason=CITATION_DISMISSAL_REVERSAL, delta_cents = -Citation.outstanding_fine_cents, citation_id) which drives Citation.outstanding_fine_cents to exactly 0"
          - "cascade hop 2b: create LedgerEntry(ledger_type=DEMERIT_POINTS, entry_reason=INSPECTION_DEMERIT_REVERSAL, delta_points = -Inspection.final_adjusted_score, establishment_id, inspection_id, citation_id) which recomputes Establishment.demerit_balance"
          - "cascade hop 3: the reduced demerit_balance recomputes Establishment.compliance_posture and may drive license_status PROBATION -> ACTIVE"
          - "increments Citation.version by 1"
      - from: ISSUED
        to: DELINQUENT
        trigger: "POST /_clock/set_current_utc delinquency sweep (system)"
        actor: system
        preconditions:
          - "Citation.status IN {ISSUED, AFFIRMED, AMENDED}"
          - "Citation.due_at < current_utc (strict: a citation whose due_at equals the new clock value is not yet delinquent)"
          - "Citation.outstanding_fine_cents > 0"
        side_effects:
          - "create LedgerEntry(ledger_type=FINE_CENTS, entry_reason=CITATION_LATE_PENALTY, delta_cents = round_half_up(Citation.outstanding_fine_cents * LATE_PENALTY_PCT), citation_id) which recomputes Citation.outstanding_fine_cents"
          - "when Citation.max_finding_severity IN {CRITICAL, IMMINENT_HAZARD}: Establishment.license_status ACTIVE|PROBATION -> SUSPENDED"
          - "increments Citation.version by 1"
      - from: AFFIRMED
        to: DELINQUENT
        trigger: "POST /_clock/set_current_utc delinquency sweep (system)"
        actor: system
        preconditions:
          - "Citation.status IN {ISSUED, AFFIRMED, AMENDED}"
          - "Citation.due_at < current_utc (strict: a citation whose due_at equals the new clock value is not yet delinquent)"
          - "Citation.outstanding_fine_cents > 0"
        side_effects:
          - "create LedgerEntry(ledger_type=FINE_CENTS, entry_reason=CITATION_LATE_PENALTY, delta_cents = round_half_up(Citation.outstanding_fine_cents * LATE_PENALTY_PCT), citation_id)"
          - "when Citation.max_finding_severity IN {CRITICAL, IMMINENT_HAZARD}: Establishment.license_status ACTIVE|PROBATION -> SUSPENDED"
          - "increments Citation.version by 1"
      - from: AMENDED
        to: DELINQUENT
        trigger: "POST /_clock/set_current_utc delinquency sweep (system)"
        actor: system
        preconditions:
          - "Citation.status IN {ISSUED, AFFIRMED, AMENDED}"
          - "Citation.due_at < current_utc (strict: a citation whose due_at equals the new clock value is not yet delinquent)"
          - "Citation.outstanding_fine_cents > 0"
        side_effects:
          - "create LedgerEntry(ledger_type=FINE_CENTS, entry_reason=CITATION_LATE_PENALTY, delta_cents = round_half_up(Citation.outstanding_fine_cents * LATE_PENALTY_PCT), citation_id)"
          - "when Citation.max_finding_severity IN {CRITICAL, IMMINENT_HAZARD}: Establishment.license_status ACTIVE|PROBATION -> SUSPENDED"
          - "increments Citation.version by 1"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /cosmetology/citations/{id}/payments"
        actor: BoardAdmin | EstablishmentOwner | Practitioner
        preconditions:
          - "Citation.status NOT IN {SETTLED, DISMISSED}"
          - "amount_cents == Citation.outstanding_fine_cents (a partial payment leaves the status unchanged)"
        side_effects:
          - "create LedgerEntry(ledger_type=FINE_CENTS, entry_reason=CITATION_PAYMENT, delta_cents = -amount_cents, citation_id)"
          - "Citation.outstanding_fine_cents recomputed to 0"
          - "increments Citation.version by 1"
      - from: AFFIRMED
        to: SETTLED
        trigger: "POST /cosmetology/citations/{id}/payments"
        actor: BoardAdmin | EstablishmentOwner | Practitioner
        preconditions:
          - "Citation.status NOT IN {SETTLED, DISMISSED}"
          - "amount_cents == Citation.outstanding_fine_cents"
        side_effects:
          - "create LedgerEntry(ledger_type=FINE_CENTS, entry_reason=CITATION_PAYMENT, delta_cents = -amount_cents, citation_id)"
          - "increments Citation.version by 1"
      - from: AMENDED
        to: SETTLED
        trigger: "POST /cosmetology/citations/{id}/payments"
        actor: BoardAdmin | EstablishmentOwner | Practitioner
        preconditions:
          - "Citation.status NOT IN {SETTLED, DISMISSED}"
          - "amount_cents == Citation.outstanding_fine_cents"
        side_effects:
          - "create LedgerEntry(ledger_type=FINE_CENTS, entry_reason=CITATION_PAYMENT, delta_cents = -amount_cents, citation_id)"
          - "increments Citation.version by 1"
      - from: DELINQUENT
        to: SETTLED
        trigger: "POST /cosmetology/citations/{id}/payments"
        actor: BoardAdmin | EstablishmentOwner | Practitioner
        preconditions:
          - "Citation.status NOT IN {SETTLED, DISMISSED}"
          - "amount_cents == Citation.outstanding_fine_cents"
        side_effects:
          - "create LedgerEntry(ledger_type=FINE_CENTS, entry_reason=CITATION_PAYMENT, delta_cents = -amount_cents, citation_id)"
          - "when the Establishment has zero remaining DELINQUENT citations and license_status == SUSPENDED: Establishment.license_status SUSPENDED -> ACTIVE"
          - "increments Citation.version by 1"

  - entity: Practitioner
    dimension: license_status
    initial_state: STUDENT
    terminal_states: [REVOKED]
    transitions:
      - from: STUDENT
        to: EXAM_ELIGIBLE
        trigger: "POST /cosmetology/practitioners/{id}/license-actions with action == GRANT_EXAM_ELIGIBILITY"
        actor: BoardAdmin
        preconditions:
          - "Practitioner.license_status == STUDENT"
          - "Practitioner.exam_eligible == true (credited_hours_total >= required_clock_hours_effective)"
        side_effects:
          - "increments Practitioner.version by 1"
      - from: EXAM_ELIGIBLE
        to: ACTIVE
        trigger: "POST /cosmetology/practitioners/{id}/license-actions with action == ISSUE_LICENSE"
        actor: BoardAdmin
        preconditions:
          - "Practitioner.license_status == EXAM_ELIGIBLE"
        side_effects:
          - "Practitioner.license_expires_on := UTC date of (effective_at + LICENSE_TERM_DAYS days), where effective_at defaults to current_utc"
          - "increments Practitioner.version by 1"
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /cosmetology/practitioners/{id}/license-actions with action == PLACE_ON_PROBATION"
        actor: BoardAdmin
        preconditions:
          - "Practitioner.license_status == ACTIVE"
        side_effects:
          - "increments Practitioner.version by 1"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /cosmetology/practitioners/{id}/license-actions with action == REINSTATE"
        actor: BoardAdmin
        preconditions:
          - "Practitioner.license_status IN {PROBATION, SUSPENDED, LAPSED}"
        side_effects:
          - "when Practitioner.suspension_cause_points is non-null: create LedgerEntry(ledger_type=SANCTION_POINTS, entry_reason=REINSTATEMENT_SANCTION_REVERSAL, delta_points = -suspension_cause_points, practitioner_id) and set suspension_cause_points := null"
          - "increments Practitioner.version by 1"
        note: "Closes the ACTIVE -> PROBATION -> ACTIVE cycle."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cosmetology/practitioners/{id}/license-actions with action == SUSPEND, or system threshold breach when sanction_points >= SANCTION_SUSPENSION_THRESHOLD (15.00)"
        actor: BoardAdmin | system
        preconditions:
          - "Practitioner.license_status IN {ACTIVE, PROBATION}"
        side_effects:
          - "when the trigger is the system threshold breach: Practitioner.suspension_cause_points := Practitioner.sanction_points"
          - "cascade: every BoothRental of this Practitioner with status == ACTIVE moves ACTIVE -> TERMINATED with terminated_at = current_utc, and every BoothRental with status == PROPOSED moves PROPOSED -> VOIDED"
          - "cascade: each such rental whose practitioner_id equals its Workstation.posted_practitioner_id clears that Workstation.posted_practitioner_id to null, recomputing Workstation.posting_status to MISSING_POSTING and incrementing Workstation.version by 1"
          - "increments Practitioner.version by 1"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /cosmetology/practitioners/{id}/license-actions with action == SUSPEND, or system threshold breach when sanction_points >= SANCTION_SUSPENSION_THRESHOLD (15.00)"
        actor: BoardAdmin | system
        preconditions:
          - "Practitioner.license_status IN {ACTIVE, PROBATION}"
        side_effects:
          - "when the trigger is the system threshold breach: Practitioner.suspension_cause_points := Practitioner.sanction_points"
          - "cascade: every BoothRental of this Practitioner with status == ACTIVE moves to TERMINATED and every PROPOSED one moves to VOIDED"
          - "cascade: each such rental whose practitioner_id equals its Workstation.posted_practitioner_id clears that posting, recomputing Workstation.posting_status to MISSING_POSTING"
          - "increments Practitioner.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cosmetology/practitioners/{id}/license-actions with action == REINSTATE"
        actor: BoardAdmin
        preconditions:
          - "Practitioner.license_status IN {PROBATION, SUSPENDED, LAPSED}"
        side_effects:
          - "when Practitioner.suspension_cause_points is non-null: create LedgerEntry(ledger_type=SANCTION_POINTS, entry_reason=REINSTATEMENT_SANCTION_REVERSAL, delta_points = -suspension_cause_points, practitioner_id) and set suspension_cause_points := null"
          - "increments Practitioner.version by 1"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /_clock/set_current_utc licence-expiry sweep (system)"
        actor: system
        preconditions:
          - "Practitioner.license_status == ACTIVE"
          - "Practitioner.license_expires_on is non-null and UTC date of current_utc > license_expires_on"
        side_effects:
          - "cascade: every BoothRental of this Practitioner with status == ACTIVE keeps status ACTIVE but each covering Workstation recomputes posting_status to STALE_POSTING"
          - "increments Practitioner.version by 1"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /cosmetology/practitioners/{id}/license-actions with action == REINSTATE"
        actor: BoardAdmin
        preconditions:
          - "Practitioner.license_status IN {PROBATION, SUSPENDED, LAPSED}"
        side_effects:
          - "Practitioner.license_expires_on := UTC date of (effective_at + LICENSE_TERM_DAYS days), where effective_at defaults to current_utc"
          - "recompute posting_status on every Workstation whose posted_practitioner_id equals this Practitioner.id"
          - "increments Practitioner.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /cosmetology/practitioners/{id}/license-actions with action == REVOKE"
        actor: BoardAdmin
        preconditions:
          - "Practitioner.license_status == SUSPENDED"
        side_effects:
          - "increments Practitioner.version by 1"

  - entity: BoothRental
    dimension: status
    initial_state: PROPOSED
    terminal_states: [TERMINATED, VOIDED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /cosmetology/booth-rentals/{id}/activation"
        actor: BoardAdmin | EstablishmentOwner
        preconditions:
          - "BoothRental.status == PROPOSED"
          - "Practitioner(BoothRental.practitioner_id).license_status == ACTIVE (PROBATION is NOT sufficient to activate a rental — see validation priority 32)"
          - "Workstation(BoothRental.workstation_id).posted_practitioner_id == BoothRental.practitioner_id"
          - "Establishment(Workstation.establishment_id).license_status IN {PENDING_INSPECTION, ACTIVE, PROBATION}"
          - "Establishment.compliance_posture != FROZEN"
        side_effects:
          - "recompute calculations.workstation_posting_status -> Workstation.posting_status (becomes COMPLIANT when the term covers current_utc)"
          - "increments Workstation.version by 1"
          - "increments BoothRental.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /cosmetology/booth-rentals/{id}/termination, or a cascade from Practitioner SUSPEND / Establishment SUSPENDED or REVOKED"
        actor: BoardAdmin | EstablishmentOwner | system
        preconditions:
          - "BoothRental.status == ACTIVE"
        side_effects:
          - "BoothRental.terminated_at := terminated_at input when supplied, otherwise current_utc"
          - "BoothRental.term_end_at := BoothRental.terminated_at"
          - "when Workstation.posted_practitioner_id == BoothRental.practitioner_id: clear it to null, recompute posting_status to MISSING_POSTING and increment Workstation.version by 1"
          - "increments BoothRental.version by 1"
      - from: PROPOSED
        to: VOIDED
        trigger: "cascade from Establishment ACTIVE -> PROBATION, Establishment -> REVOKED, or Practitioner -> SUSPENDED (system)"
        actor: system
        preconditions:
          - "BoothRental.status == PROPOSED"
        side_effects:
          - "BoothRental.terminated_at := current_utc"
          - "when Workstation.posted_practitioner_id == BoothRental.practitioner_id: clear it to null, recompute posting_status to MISSING_POSTING and increment Workstation.version by 1"
          - "increments BoothRental.version by 1"

  - entity: InfectionIncident
    dimension: status
    initial_state: REPORTED
    terminal_states: [RESOLVED_SUBSTANTIATED, RESOLVED_UNSUBSTANTIATED]
    transitions:
      - from: REPORTED
        to: NOTIFIED
        trigger: "POST /cosmetology/infection-incidents/{id}/notification"
        actor: BoardAdmin | HealthAuthorityLiaison
        preconditions:
          - "InfectionIncident.status IN {REPORTED, ESCALATED_OVERDUE}"
        side_effects:
          - "InfectionIncident.notified_at := notified_at input when supplied, otherwise current_utc"
          - "InfectionIncident.health_authority_reference := health_authority_reference"
          - "increments InfectionIncident.version by 1"
      - from: REPORTED
        to: ESCALATED_OVERDUE
        trigger: "POST /_clock/set_current_utc notification-deadline sweep (system)"
        actor: system
        preconditions:
          - "InfectionIncident.status == REPORTED"
          - "current_utc > InfectionIncident.notification_deadline_at"
        side_effects:
          - "increments InfectionIncident.version by 1"
      - from: ESCALATED_OVERDUE
        to: NOTIFIED
        trigger: "POST /cosmetology/infection-incidents/{id}/notification"
        actor: BoardAdmin | HealthAuthorityLiaison
        preconditions:
          - "InfectionIncident.status IN {REPORTED, ESCALATED_OVERDUE}"
        side_effects:
          - "InfectionIncident.notified_at := notified_at input when supplied, otherwise current_utc"
          - "InfectionIncident.health_authority_reference := health_authority_reference"
          - "increments InfectionIncident.version by 1"
      - from: NOTIFIED
        to: RESOLVED_SUBSTANTIATED
        trigger: "POST /cosmetology/infection-incidents/{id}/resolution with resolution == SUBSTANTIATED"
        actor: BoardAdmin
        preconditions:
          - "InfectionIncident.status == NOTIFIED"
        side_effects:
          - "InfectionIncident.findings_summary := findings_summary"
          - "cascade hop 2: when suspected_practitioner_id is non-null, create LedgerEntry(ledger_type=SANCTION_POINTS, entry_reason=INFECTION_SANCTION_ASSESSMENT, delta_points = +SUBSTANTIATED_SANCTION_POINTS (10.00), practitioner_id) which recomputes Practitioner.sanction_points"
          - "cascade hop 3: when the recomputed sanction_points >= SANCTION_SUSPENSION_THRESHOLD (15.00), Practitioner.license_status ACTIVE|PROBATION -> SUSPENDED with suspension_cause_points := sanction_points, which itself terminates the practitioner's ACTIVE BoothRentals (hop 4) and clears the matching Workstation postings (hop 5)"
          - "increments InfectionIncident.version by 1"
      - from: NOTIFIED
        to: RESOLVED_UNSUBSTANTIATED
        trigger: "POST /cosmetology/infection-incidents/{id}/resolution with resolution == UNSUBSTANTIATED"
        actor: BoardAdmin
        preconditions:
          - "InfectionIncident.status == NOTIFIED"
        side_effects:
          - "InfectionIncident.findings_summary := findings_summary"
          - "no LedgerEntry is posted and Practitioner.sanction_points is unchanged"
          - "increments InfectionIncident.version by 1"

concurrency_rules:
  - rule_id: booth-rental-create-stale-workstation
    parent_entity: Workstation
    write_endpoint: "POST /cosmetology/booth-rentals"
    occ_field: "expected_workstation_version"
    description: |
      Creating a BoothRental against a Workstation whose version has advanced
      since the client last observed it is rejected. A station legitimately
      carries a chain of successive rentals (adjacent terms are permitted by the
      half-open overlap rule), so a second create is a valid product operation
      rather than an error; the stale-version check is what forces the caller to
      re-read the station's current occupancy chain before booking on top of it.
    error_id: ERR_STALE_WORKSTATION_VERSION
    http_status: 412
  - rule_id: citation-create-stale-inspection
    parent_entity: Inspection
    write_endpoint: "POST /cosmetology/citations"
    occ_field: "expected_inspection_version"
    description: |
      Creating a Citation against an Inspection whose version has advanced since
      the client last observed it is rejected. One FINALIZED inspection may
      legitimately yield several citations (one against the establishment plus one
      per attributed practitioner), so a repeat create is valid product behavior;
      the stale-version check forces the caller to re-read Inspection.citation_count
      and final_adjusted_score before assessing another fine off the same visit.
    error_id: ERR_STALE_INSPECTION_VERSION
    http_status: 412

calculations:
  - name: inspection_adjusted_score
    trigger: "POST /cosmetology/inspections/{id}/submit writes the PROVISIONAL variant into Inspection.provisional_adjusted_score; POST /cosmetology/inspections/{id}/finalize writes the FINAL variant into Inspection.final_adjusted_score"
    algorithm: weighted_scoring
    formula: |
      # Rounding order is PINNED: round EACH finding to 2 dp first, then sum, then
      # round the sum to 2 dp. "Sum the unrounded products then round once" is
      # explicitly NOT the rule and yields different cents on repeat multipliers.
      cutoff_at = Inspection.submitted_at        # variant PROVISIONAL
      cutoff_at = Inspection.finalized_at        # variant FINAL
      on_site_credit = 0.50                      # variant PROVISIONAL
      on_site_credit = 0.25                      # variant FINAL

      findings = ViolationFinding rows with inspection_id == Inspection.id,
                 processed in order performed by created_at ASC (tie-break: none
                 needed; created_at is unique per finding within an inspection)

      for each finding f:
        code = ViolationCode(f.violation_code_id)
        repeat_count(f) = count of ViolationFinding g such that
              g.violation_code_id == f.violation_code_id
          AND g.inspection_id != f.inspection_id
          AND Inspection(g.inspection_id).establishment_id == Inspection.establishment_id
          AND Inspection(g.inspection_id).status == FINALIZED
          AND Inspection(g.inspection_id).finalized_at >= cutoff_at - REPEAT_LOOKBACK_DAYS days
          AND Inspection(g.inspection_id).finalized_at <  cutoff_at
        repeat_factor(f) = 1.0 if repeat_count(f) == 0
                           1.5 if repeat_count(f) == 1
                           2.0 if repeat_count(f) >= 2
        credit(f) = on_site_credit if (f.corrected_on_site == true
                                       AND f.severity IN {MINOR, MAJOR})
                    else 0.00
        points(f) = round_half_up(code.base_points
                                  * SEVERITY_WEIGHT[f.severity]
                                  * f.observed_count
                                  * repeat_factor(f)
                                  * (1 - credit(f)), 2)     # STEP 1: round per finding

      adjusted_score = round_half_up(sum over findings of points(f), 2)   # STEP 2: sum, then round
      # Empty finding set -> adjusted_score == 0.00 (not null).

      outcome band (applied to the same variant's score):
        IMMEDIATE_CLOSURE if Inspection.hazard_state == HAZARD_DECLARED
        FAIL              else if adjusted_score > CONDITIONAL_PASS_CEILING (40.00)
                               or any finding severity == CRITICAL
                               or any finding severity == IMMINENT_HAZARD
        CONDITIONAL_PASS  else if adjusted_score > PASS_CEILING (10.00)
        PASS              else
    input_set: |
      All ViolationFinding rows of this Inspection with no status filter (findings are
      never deleted). The repeat_count sub-query reads ONLY findings belonging to
      OTHER inspections of the SAME establishment whose status == FINALIZED and whose
      finalized_at lies in the half-open window [cutoff_at - 730 days, cutoff_at).
      Findings on SCHEDULED, IN_PROGRESS or PENDING_REVIEW inspections never count.
    constants:
      SEVERITY_WEIGHT: { MINOR: 1.0, MAJOR: 2.5, CRITICAL: 5.0, IMMINENT_HAZARD: 8.0 }
      REPEAT_LOOKBACK_DAYS: 730
      PROVISIONAL_ON_SITE_CREDIT: 0.50
      FINAL_ON_SITE_CREDIT: 0.25
      PASS_CEILING: 10.00
      CONDITIONAL_PASS_CEILING: 40.00
    precision: "2 decimal places, round_half_up, applied twice (per finding, then on the sum)"
    variants:
      - name: PROVISIONAL
        when: "Evaluated at POST /cosmetology/inspections/{id}/submit; written to Inspection.provisional_adjusted_score and ViolationFinding.provisional_points"
        difference: "on_site_credit = 0.50 and cutoff_at = submitted_at — the inspector's on-site-correction credit is granted in full because it is still self-reported"
      - name: FINAL
        when: "Evaluated at POST /cosmetology/inspections/{id}/finalize; written to Inspection.final_adjusted_score and ViolationFinding.final_points"
        difference: "on_site_credit = 0.25 and cutoff_at = finalized_at — board review halves the unverified on-site credit and re-resolves repeat_count against every inspection finalized up to the finalize instant, so identical findings score strictly higher than the PROVISIONAL variant whenever any MINOR/MAJOR finding has corrected_on_site == true"

  - name: practitioner_credited_hours
    trigger: "POST /cosmetology/training-records (recomputes credited_hours_school, credited_hours_apprentice, credited_hours_total, required_clock_hours_effective and exam_eligible on the subject Practitioner) and re-read on POST /cosmetology/practitioners/{id}/license-actions with action == GRANT_EXAM_ELIGIBILITY"
    algorithm: chronological
    formula: |
      records = TrainingRecord rows with practitioner_id == P.id,
                ordered by performed_on ASC, then created_at ASC

      school_records = records with credit_type == SCHOOL_CLOCK_HOUR
      appr_records   = records with credit_type == APPRENTICE_HOUR

      # SCHOOL ledger: per-UTC-date cap, ratio 1.00, identical in both variants
      credited_hours_school = round_half_up(
          sum over each distinct performed_on date d of
              min( sum(school_records.hours where performed_on == d),
                   SCHOOL_DAILY_CAP_HOURS ), 2)

      # APPRENTICE ledger: the variant is selected by P.license_type
      if P.license_type == APPRENTICE:          # variant APPRENTICE_TRACK
        credited_hours_apprentice = round_half_up(
            sum over each distinct ISO week w (Monday 00:00:00.000Z .. Sunday 23:59:59.999Z
                                              containing performed_on) of
                round_half_up( min( sum(appr_records.hours where iso_week(performed_on) == w),
                                    APPRENTICE_WEEKLY_CAP_HOURS )
                               * APPRENTICE_CREDIT_RATIO, 2), 2)
        # rounding order PINNED: round per ISO week first, then sum, then round
      else:                                      # variant SCHOOL_EQUIVALENCE_TRACK
        credited_hours_apprentice = round_half_up(
            sum over each distinct performed_on date d of
                min( sum(appr_records.hours where performed_on == d),
                     SCHOOL_DAILY_CAP_HOURS ) * SCHOOL_EQUIVALENCE_RATIO, 2)

      credited_hours_total = round_half_up(credited_hours_school + credited_hours_apprentice, 2)
      required_clock_hours_effective = School(P.school_id).required_clock_hours
                                       if P.school_id is non-null
                                       else APPRENTICE_STANDALONE_REQUIRED_HOURS
      exam_eligible = (credited_hours_total >= required_clock_hours_effective)
    input_set: |
      Every TrainingRecord row for the practitioner; TrainingRecords are append-only
      and are never voided or deleted, so there is no status filter. Grouping keys are
      the record's performed_on UTC date (school ledger and SCHOOL_EQUIVALENCE_TRACK)
      and the ISO-8601 week containing performed_on (APPRENTICE_TRACK).
    constants:
      SCHOOL_DAILY_CAP_HOURS: 8.0
      APPRENTICE_WEEKLY_CAP_HOURS: 40.0
      APPRENTICE_CREDIT_RATIO: 0.60
      SCHOOL_EQUIVALENCE_RATIO: 1.00
      APPRENTICE_STANDALONE_REQUIRED_HOURS: 1600.00
    precision: "2 decimal places, round_half_up, applied per group then on the sum"
    variants:
      - name: APPRENTICE_TRACK
        when: "Practitioner.license_type == APPRENTICE"
        difference: "APPRENTICE_HOUR records are pooled per ISO week, capped at 40.0 h/week, then discounted by the 0.60 apprenticeship credit ratio"
      - name: SCHOOL_EQUIVALENCE_TRACK
        when: "Practitioner.license_type != APPRENTICE (a licensed or candidate practitioner logging supervised hours)"
        difference: "the identical APPRENTICE_HOUR record set is instead pooled per UTC date, capped at 8.0 h/day, and credited at ratio 1.00 — the same rows therefore yield a different credited_hours_apprentice than APPRENTICE_TRACK"

  - name: citation_fine_amount
    trigger: "POST /cosmetology/citations (writes Citation.demerit_tier_multiplier and Citation.assessed_fine_cents); re-derived on a hearing AMENDED decision, which replaces assessed_fine_cents with Hearing.amended_fine_cents"
    algorithm: tiered_pricing
    formula: |
      findings = ViolationFinding rows with inspection_id == Citation.inspection_id,
                 no status filter, ordered by created_at ASC
      base_cents = sum over findings of ViolationCode(f.violation_code_id).fine_cents_base

      excess_points = max(0, Inspection.final_adjusted_score - EXCESS_POINT_THRESHOLD)
      surcharge_cents = round_half_up(PER_POINT_SURCHARGE_CENTS * excess_points)

      # Tier input is PINNED to the pre-cascade snapshot, NOT the live balance:
      b = Inspection.demerit_balance_before_finalize
      demerit_tier_multiplier = 1.00 if b <  20.00
                                1.25 if 20.00 <= b <  50.00
                                1.60 if 50.00 <= b < 200.00
                                2.00 if b >= 200.00

      subject_factor = SUBJECT_FACTOR[Citation.subject_type]

      raw_cents = round_half_up(base_cents * demerit_tier_multiplier * subject_factor)
                  + surcharge_cents
      assessed_fine_cents = min(FINE_CEILING_CENTS,
                                max(FINE_FLOOR_CENTS, raw_cents))
      # boundary semantics: the ceiling clamp is inclusive — raw_cents == 250000
      # is NOT clamped, raw_cents == 250001 is clamped to 250000.
      max_finding_severity = highest severity among findings under the total order
                             MINOR < MAJOR < CRITICAL < IMMINENT_HAZARD, null when
                             findings is empty
    input_set: |
      Every ViolationFinding of the citation's Inspection (which is necessarily
      FINALIZED, so final_adjusted_score and demerit_balance_before_finalize are both
      non-null). The tier lookup deliberately reads the snapshot taken before the
      finalize cascade posted this inspection's own demerits, so an establishment is
      never tiered up by the very inspection being cited.
    constants:
      PER_POINT_SURCHARGE_CENTS: 400
      EXCESS_POINT_THRESHOLD: 30.00
      FINE_FLOOR_CENTS: 5000
      FINE_CEILING_CENTS: 250000
      SUBJECT_FACTOR: { ESTABLISHMENT: 1.00, PRACTITIONER: 0.50 }
    precision: "whole cents, round_half_up applied once to the base*tier*subject product and once to the surcharge, before the clamp"

  - name: citation_total_due_cents
    trigger: "POST /cosmetology/citations, and again on a hearing AMENDED decision"
    algorithm: constraint_propagation
    formula: |
      # This looks circular (the administrative fee scales with what is owed, and
      # what is owed includes the fee). The evaluation order is PINNED so the value
      # is well defined; total_due_cents MUST NEVER re-enter step 2.
      STEP 1: assessed_fine_cents = calculations.citation_fine_amount
      STEP 2: admin_fee_pct = 0.05 if assessed_fine_cents <= 25000
                              0.08 if 25000 < assessed_fine_cents <= 100000
                              0.12 if assessed_fine_cents > 100000
              # keyed on assessed_fine_cents ALONE
      STEP 3: administrative_fee_cents = round_half_up(assessed_fine_cents * admin_fee_pct)
      STEP 4: total_due_cents = assessed_fine_cents + administrative_fee_cents
      STEP 5: create LedgerEntry(ledger_type=FINE_CENTS,
                                 entry_reason=CITATION_ASSESSMENT,
                                 delta_cents=+total_due_cents,
                                 citation_id=Citation.id)
      STEP 6: outstanding_fine_cents = sum of LedgerEntry.delta_cents over
              ledger_type == FINE_CENTS and citation_id == Citation.id
      due_at             = issued_at + PAYMENT_TERM_DAYS days
      contest_deadline_at = issued_at + CONTEST_WINDOW_DAYS days
    input_set: "Exactly one Citation row plus the FINE_CENTS LedgerEntry rows carrying its citation_id; no other rows participate."
    constants:
      ADMIN_FEE_PCT_TIER_1: 0.05
      ADMIN_FEE_PCT_TIER_2: 0.08
      ADMIN_FEE_PCT_TIER_3: 0.12
      ADMIN_FEE_TIER_1_CEILING_CENTS: 25000
      ADMIN_FEE_TIER_2_CEILING_CENTS: 100000
      PAYMENT_TERM_DAYS: 30
      CONTEST_WINDOW_DAYS: 20
      LATE_PENALTY_PCT: 0.10
    precision: "whole cents, round_half_up on step 3 only"

  - name: establishment_demerit_and_posture
    trigger: "Recomputed on POST /cosmetology/inspections/{id}/finalize, POST /cosmetology/hearings/{id}/decision, POST /cosmetology/citations/{id}/payments, POST /cosmetology/infection-incidents/{id}/resolution and POST /_clock/set_current_utc — i.e. on every write that appends a DEMERIT_POINTS or FINE_CENTS LedgerEntry or changes license_status"
    algorithm: aggregation
    formula: |
      demerit_balance = round_half_up(
          sum of LedgerEntry.delta_points where ledger_type == DEMERIT_POINTS
                                            and establishment_id == E.id, 2)
      # Floor: the sum is a signed running total and MAY legitimately reach exactly
      # 0.00 after a reversal, but MUST NOT be clamped — a negative sum is a defect.

      outstanding_fine_total_cents = sum of Citation.outstanding_fine_cents over
          Citations whose Inspection.establishment_id == E.id
          and status NOT IN {DISMISSED, SETTLED}
      delinquent_fine_total_cents = same sum restricted to status == DELINQUENT
      open_critical_citation_count = count of those Citations whose
          max_finding_severity IN {CRITICAL, IMMINENT_HAZARD}
          and status NOT IN {DISMISSED, SETTLED}
      station_count = count of Workstation rows with establishment_id == E.id

      foot_spa_biofilm_current =
          true when EVERY Workstation of E with station_type == FOOT_SPA has a
          SanitationLog with log_type == FOOT_SPA_WEEKLY_BIOFILM whose
          performed_at >= current_utc - BIOFILM_CURRENCY_DAYS days;
          vacuously true when E has zero FOOT_SPA workstations.

      compliance_posture =
        FROZEN     if E.license_status IN {SUSPENDED, CLOSED_IMMINENT_HAZARD, REVOKED}
                      OR demerit_balance >= PROBATION_DEMERIT_THRESHOLD
        RESTRICTED else if demerit_balance >= RESTRICTED_DEMERIT_THRESHOLD
                      OR open_critical_citation_count >= 1
        WATCH      else if demerit_balance >= WATCH_DEMERIT_THRESHOLD
        CLEAR      else
      # Boundary semantics are inclusive-at-the-threshold: 49.99 -> WATCH,
      # 50.00 -> RESTRICTED, 99.99 -> RESTRICTED, 100.00 -> FROZEN.
    input_set: |
      All DEMERIT_POINTS LedgerEntry rows carrying establishment_id == E.id (both
      positive assessments and negative reversals), plus every Citation reachable
      through E's Inspections. DISMISSED and SETTLED citations are excluded from all
      three money/count aggregates but their reversal ledger rows still participate in
      demerit_balance.
    constants:
      WATCH_DEMERIT_THRESHOLD: 20.00
      RESTRICTED_DEMERIT_THRESHOLD: 50.00
      PROBATION_DEMERIT_THRESHOLD: 100.00
      REVOCATION_DEMERIT_THRESHOLD: 200.00
      BIOFILM_CURRENCY_DAYS: 7
    precision: "demerit_balance 2 decimal places round_half_up; all *_cents fields whole cents; counts are integers"

  - name: practitioner_sanction_points
    trigger: "POST /cosmetology/infection-incidents/{id}/resolution with resolution == SUBSTANTIATED, and POST /cosmetology/practitioners/{id}/license-actions with action == REINSTATE"
    algorithm: threshold
    formula: |
      sanction_points = round_half_up(
          sum of LedgerEntry.delta_points where ledger_type == SANCTION_POINTS
                                            and practitioner_id == P.id, 2)
      if sanction_points >= SANCTION_SUSPENSION_THRESHOLD
         and P.license_status IN {ACTIVE, PROBATION}:
             P.license_status := SUSPENDED
             P.suspension_cause_points := sanction_points   # snapshot, never recomputed
      # Boundary is inclusive: 14.99 leaves the licence untouched, 15.00 suspends.
      # REINSTATE posts a compensating REINSTATEMENT_SANCTION_REVERSAL entry of
      # delta_points = -P.suspension_cause_points (the snapshot taken at suspension,
      # NOT -SUBSTANTIATED_SANCTION_POINTS), so the SANCTION_POINTS rows for the
      # practitioner sum to exactly 0.00 and sanction_points becomes 0.00 - the
      # whole sanction history that caused the suspension is wiped, not just the
      # last assessment. REINSTATE then sets suspension_cause_points := null.
      # REINSTATE from LAPSED or PROBATION, where suspension_cause_points is null,
      # posts no reversal entry at all and leaves sanction_points unchanged.
    input_set: "All SANCTION_POINTS LedgerEntry rows carrying practitioner_id == P.id, including negative reinstatement reversals."
    constants:
      SUBSTANTIATED_SANCTION_POINTS: 10.00
      SANCTION_SUSPENSION_THRESHOLD: 15.00
    precision: "2 decimal places, round_half_up"

  - name: infection_notification_deadline
    trigger: "POST /cosmetology/infection-incidents (writes notification_deadline_at); evaluated again by POST /_clock/set_current_utc to escalate overdue incidents"
    algorithm: threshold
    formula: |
      window_hours = NOTIFY_WINDOW_HOURS_MULTI  if case_count >= MULTI_CASE_THRESHOLD
                     NOTIFY_WINDOW_HOURS_SINGLE else
      notification_deadline_at = reported_at + window_hours hours
      # Threshold is inclusive: case_count == 1 -> 72 h, case_count == 2 -> 24 h.
      # On POST /_clock/set_current_utc, every InfectionIncident with
      # status == REPORTED and notification_deadline_at < new current_utc moves to
      # ESCALATED_OVERDUE (strict <: an incident whose deadline equals the new clock
      # value is still on time).
    input_set: "The single InfectionIncident row; the escalation sweep scans all rows with status == REPORTED."
    constants:
      MULTI_CASE_THRESHOLD: 2
      NOTIFY_WINDOW_HOURS_MULTI: 24
      NOTIFY_WINDOW_HOURS_SINGLE: 72
    precision: "whole hours added to an ISO-8601 instant with millisecond precision preserved"

  - name: workstation_posting_status
    trigger: "POST /cosmetology/workstations/{id}/posting, POST /cosmetology/booth-rentals/{id}/activation, POST /cosmetology/booth-rentals/{id}/termination, POST /cosmetology/practitioners/{id}/license-actions and POST /_clock/set_current_utc"
    algorithm: projection
    formula: |
      if W.posted_practitioner_id is null:
          posting_status = MISSING_POSTING
      else:
          P = Practitioner(W.posted_practitioner_id)
          posting_valid =
                P.license_status == ACTIVE
            AND P.license_expires_on >= date(current_utc)
            AND there exists a BoothRental R with R.workstation_id == W.id
                and R.practitioner_id == P.id
                and R.status == ACTIVE
                and R.term_start_at <= current_utc
                and (R.term_end_at is null OR current_utc < R.term_end_at)
          posting_status = COMPLIANT if posting_valid else STALE_POSTING

      last_biofilm_cycle_at = max(SanitationLog.performed_at) over logs with
          workstation_id == W.id and log_type == FOOT_SPA_WEEKLY_BIOFILM,
          null when none exist
    input_set: |
      The Workstation row, its posted Practitioner, and every BoothRental on that
      workstation with status == ACTIVE. PROPOSED, TERMINATED and VOIDED rentals never
      make a posting COMPLIANT. Rental coverage uses the half-open interval
      [term_start_at, term_end_at) with a null end meaning +infinity.
    constants:
      LICENSE_TERM_DAYS: 730
    precision: "not applicable — enum result; license_expires_on is compared as a UTC calendar date, so a licence expiring today is still valid"

validations:
  # ---------------------------------------------------------------- auth (1-9)
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role names a role declared in §1.7 (BoardAdmin, Inspector, HearingOfficer, EstablishmentOwner, Practitioner, SchoolRegistrar, HealthAuthorityLiaison); an unknown role string is treated as an unauthenticated caller, not an unauthorized one"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "the role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "for an entity_backed role (EstablishmentOwner -> Establishment, Practitioner -> Practitioner, SchoolRegistrar -> School), X-User-ID must resolve to an existing row of that entity; a syntactically valid but unknown id is an authorization failure, not a 404"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints whose roles list includes EstablishmentOwner, Practitioner or SchoolRegistrar"
  # ----------------------------------------------------------- existence (10-15)
  - priority: 10
    category: existence
    check: "every id embedded in the path exists, validated left-to-right; the specific error names the missing entity (ERR_ESTABLISHMENT_NOT_FOUND, ERR_PRACTITIONER_NOT_FOUND, ERR_SCHOOL_NOT_FOUND, ERR_TRAINING_RECORD_NOT_FOUND, ERR_WORKSTATION_NOT_FOUND, ERR_BOOTH_RENTAL_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_VIOLATION_FINDING_NOT_FOUND, ERR_CITATION_NOT_FOUND, ERR_HEARING_NOT_FOUND, ERR_INFECTION_INCIDENT_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND)"
    error_id: ERR_<ENTITY>_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 12
    category: existence
    check: "every foreign-key id supplied in the request body exists (establishment_id, practitioner_id, school_id, sponsor_practitioner_id, workstation_id, violation_code_id, attributed_practitioner_id, posted_practitioner_id, reinspection_of_id, subject_practitioner_id, hazard_violation_finding_id, clearing_reinspection_id), validated in the field order declared by the endpoint's input list"
    error_id: ERR_<ENTITY>_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields"
  - priority: 14
    category: auth
    check: "ownership scope for entity_backed roles: an EstablishmentOwner may only read or write rows reachable from the Establishment whose id equals X-User-ID; a Practitioner only rows reachable from their own Practitioner row; a SchoolRegistrar only Practitioners and TrainingRecords whose school_id equals X-User-ID. Runs AFTER existence so a caller cannot probe for row existence, and BEFORE any state check."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints whose roles list includes EstablishmentOwner, Practitioner or SchoolRegistrar"
  # ------------------------------------------------------------- shape (16-25)
  - priority: 16
    category: business_constraint
    check: "request body shape: no unknown fields rejected silently (unknown fields are ignored), all required fields present, enum fields carry a declared member, integer/decimal fields are non-negative where the field description says so, all *_at fields parse as ISO-8601 UTC instants and all *_on fields as ISO-8601 calendar dates"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 18
    category: business_constraint
    check: "pagination arguments: limit is an integer in [1, 100] (default 10) and offset is an integer >= 0 (default 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all list endpoints"
  - priority: 20
    category: business_constraint
    check: "conditional field pairing: window_end_at > window_start_at on inspection creation; term_end_at > term_start_at when supplied on booth-rental creation; complaint_reference required when inspection_type == COMPLAINT_DRIVEN and forbidden otherwise; reinspection_of_id required when inspection_type == REINSPECTION and forbidden otherwise; subject_practitioner_id required when subject_type == PRACTITIONER and forbidden otherwise; school_id required when credit_type == SCHOOL_CLOCK_HOUR and sponsor_practitioner_id required when credit_type == APPRENTICE_HOUR; amended_fine_cents required when decision == AMENDED and forbidden otherwise; implement_batch_count required when log_type == IMPLEMENT_DISINFECTION"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /cosmetology/inspections, POST /cosmetology/booth-rentals, POST /cosmetology/citations, POST /cosmetology/training-records, POST /cosmetology/hearings/{id}/decision, POST /cosmetology/sanitation-logs"
  - priority: 22
    category: business_temporal
    check: "the logical clock may only move forward: to_iso8601 must be strictly greater than the current clock value (startup default 2026-08-01T00:00:00Z)"
    error_id: ERR_CLOCK_MUST_ADVANCE
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  # -------------------------------------------------------- state preconditions
  - priority: 30
    category: state
    check: "the target Establishment.license_status is operable for the requested write: PENDING_INSPECTION, ACTIVE and PROBATION are operable; SUSPENDED, CLOSED_IMMINENT_HAZARD and REVOKED reject every write that adds capacity or personnel (workstations, postings, booth rentals) and every new ROUTINE inspection"
    error_id: ERR_ESTABLISHMENT_NOT_OPERABLE
    http_status: 409
    applies_to: "POST /cosmetology/establishments/{id}/workstations, POST /cosmetology/workstations/{id}/posting, POST /cosmetology/booth-rentals, POST /cosmetology/inspections"
  - priority: 32
    category: state
    check: "the referenced Practitioner.license_status is ACTIVE (PROBATION permitted only for booth-rental termination and finding attribution); STUDENT, EXAM_ELIGIBLE, SUSPENDED, LAPSED and REVOKED practitioners cannot be posted at a workstation or given an ACTIVE rental"
    error_id: ERR_PRACTITIONER_LICENSE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cosmetology/workstations/{id}/posting, POST /cosmetology/booth-rentals/{id}/activation"
  - priority: 34
    category: state
    check: "Inspection.status == SCHEDULED"
    error_id: ERR_INSPECTION_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /cosmetology/inspections/{id}/start"
  - priority: 36
    category: state
    check: "Inspection.status == IN_PROGRESS"
    error_id: ERR_INSPECTION_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /cosmetology/inspections/{id}/findings, POST /cosmetology/inspections/{id}/submit, POST /cosmetology/inspections/{id}/hazard-declaration"
  - priority: 38
    category: state
    check: "Inspection.status == PENDING_REVIEW"
    error_id: ERR_INSPECTION_NOT_PENDING_REVIEW
    http_status: 409
    applies_to: "POST /cosmetology/inspections/{id}/finalize"
  - priority: 40
    category: state
    check: "the referenced Inspection.status == FINALIZED (the citation's inspection, and the clearing reinspection on a hazard clearance)"
    error_id: ERR_INSPECTION_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /cosmetology/citations, POST /cosmetology/inspections/{id}/hazard-clearance"
  - priority: 42
    category: state
    check: "Inspection.hazard_state == NONE — a hazard may be declared at most once per inspection"
    error_id: ERR_HAZARD_ALREADY_DECLARED
    http_status: 409
    applies_to: "POST /cosmetology/inspections/{id}/hazard-declaration"
  - priority: 43
    category: state
    check: "Inspection.hazard_state == HAZARD_DECLARED"
    error_id: ERR_HAZARD_NOT_DECLARED
    http_status: 409
    applies_to: "POST /cosmetology/inspections/{id}/hazard-clearance"
  - priority: 44
    category: state
    check: "Citation.status IN {ISSUED, AMENDED} — an AMENDED citation re-enters the contest cycle on its re-based deadline, but CONTESTED, HEARING_SCHEDULED, AFFIRMED, DELINQUENT, DISMISSED and SETTLED citations are all past the contest stage. Contesting is deliberately NOT gated on hearing_round_count, so a citation amended in round 2 can still be contested and the round cap surfaces later as ERR_HEARING_ROUNDS_EXHAUSTED at priority 82."
    error_id: ERR_CITATION_NOT_CONTESTABLE
    http_status: 409
    applies_to: "POST /cosmetology/citations/{id}/contest"
  - priority: 45
    category: state
    check: "Citation.status == CONTESTED"
    error_id: ERR_CITATION_NOT_CONTESTED
    http_status: 409
    applies_to: "POST /cosmetology/citations/{id}/hearings"
  - priority: 46
    category: state
    check: "Hearing.status == SCHEDULED"
    error_id: ERR_HEARING_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /cosmetology/hearings/{id}/decision"
  - priority: 47
    category: state
    check: "Citation.status NOT IN {SETTLED, DISMISSED} — a closed citation accepts no further payment"
    error_id: ERR_CITATION_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /cosmetology/citations/{id}/payments"
  - priority: 48
    category: state
    check: "BoothRental.status == PROPOSED"
    error_id: ERR_BOOTH_RENTAL_NOT_PROPOSED
    http_status: 409
    applies_to: "POST /cosmetology/booth-rentals/{id}/activation"
  - priority: 49
    category: state
    check: "BoothRental.status == ACTIVE"
    error_id: ERR_BOOTH_RENTAL_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cosmetology/booth-rentals/{id}/termination"
  - priority: 50
    category: state
    check: "InfectionIncident.status IN {REPORTED, ESCALATED_OVERDUE} — an already-notified or resolved incident cannot be notified again"
    error_id: ERR_INCIDENT_NOT_NOTIFIABLE
    http_status: 409
    applies_to: "POST /cosmetology/infection-incidents/{id}/notification"
  - priority: 51
    category: state
    check: "InfectionIncident.status == NOTIFIED — the health authority must be informed before an investigation can be resolved"
    error_id: ERR_INCIDENT_NOT_NOTIFIED
    http_status: 409
    applies_to: "POST /cosmetology/infection-incidents/{id}/resolution"
  - priority: 52
    category: state
    check: "the requested license action is legal from the practitioner's current license_status: GRANT_EXAM_ELIGIBILITY only from STUDENT; ISSUE_LICENSE only from EXAM_ELIGIBLE; PLACE_ON_PROBATION only from ACTIVE; SUSPEND only from ACTIVE or PROBATION; REINSTATE only from PROBATION, SUSPENDED or LAPSED; REVOKE only from ACTIVE, PROBATION or SUSPENDED; nothing is legal from EXAM_ELIGIBLE except ISSUE_LICENSE and nothing at all is legal from REVOKED"
    error_id: ERR_LICENSE_ACTION_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /cosmetology/practitioners/{id}/license-actions"
  # ------------------------------------------------ optimistic concurrency (55)
  - priority: 55
    category: state
    check: "expected_workstation_version equals the current Workstation.version"
    error_id: ERR_STALE_WORKSTATION_VERSION
    http_status: 412
    applies_to: "POST /cosmetology/booth-rentals"
  - priority: 56
    category: state
    check: "expected_inspection_version equals the current Inspection.version"
    error_id: ERR_STALE_INSPECTION_VERSION
    http_status: 412
    applies_to: "POST /cosmetology/citations"
  # ------------------------------------------- business_safety / regulatory (59)
  - priority: 59
    category: business_safety
    check: "hazard_violation_finding_id must name a ViolationFinding whose inspection_id equals the inspection being acted on and whose severity == IMMINENT_HAZARD; a MINOR, MAJOR or CRITICAL finding cannot support immediate closure"
    error_id: ERR_HAZARD_FINDING_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /cosmetology/inspections/{id}/hazard-declaration"
  - priority: 60
    category: business_safety
    check: "the Establishment's compliance_posture is not FROZEN. Posture is FROZEN when license_status IN {SUSPENDED, CLOSED_IMMINENT_HAZARD, REVOKED} OR demerit_balance >= 100.00, so an establishment that is still operable (PENDING_INSPECTION, ACTIVE or PROBATION) can nevertheless be frozen purely on accumulated demerits. A FROZEN establishment may not add workstations, change postings or open booth rentals."
    error_id: ERR_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /cosmetology/establishments/{id}/workstations, POST /cosmetology/workstations/{id}/posting, POST /cosmetology/booth-rentals"
  - priority: 61
    category: business_safety
    check: "segregation of duties: the presiding_officer_user_id on a hearing must differ from the inspector_user_id of the Inspection behind the citation, and a hearing decision may not be recorded by the X-User-ID that presided over a prior round of the same citation's inspection as inspector. The same user may never both inspect and adjudicate."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /cosmetology/citations/{id}/hearings, POST /cosmetology/hearings/{id}/decision"
  - priority: 62
    category: business_safety
    check: "a hazard clearance requires a distinct REINSPECTION whose reinspection_of_id equals the hazard-declaring inspection, whose status is FINALIZED, and whose final_adjusted_score <= HAZARD_CLEARANCE_MAX_SCORE (10.00); a reinspection that scored above the ceiling cannot lift an immediate closure"
    error_id: ERR_HAZARD_CLEARANCE_REINSPECTION_REQUIRED
    http_status: 422
    applies_to: "POST /cosmetology/inspections/{id}/hazard-clearance"
  - priority: 63
    category: business_safety
    check: "contact_minutes meets the minimum wet contact time for the log_type: IMPLEMENT_DISINFECTION >= 10, FOOT_SPA_AFTER_CLIENT >= 10, FOOT_SPA_END_OF_DAY >= 10, FOOT_SPA_WEEKLY_BIOFILM >= 360. The comparison is inclusive — exactly the minimum is compliant."
    error_id: ERR_DISINFECTANT_CONTACT_TIME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /cosmetology/sanitation-logs"
  - priority: 64
    category: business_safety
    check: "the log_type matches the workstation's station_type: FOOT_SPA_AFTER_CLIENT, FOOT_SPA_END_OF_DAY and FOOT_SPA_WEEKLY_BIOFILM are only valid on a FOOT_SPA station; IMPLEMENT_DISINFECTION is valid on STYLING_CHAIR, NAIL_TABLE and FACIAL_ROOM stations only"
    error_id: ERR_SANITATION_LOG_STATION_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /cosmetology/sanitation-logs"
  - priority: 65
    category: business_safety
    check: "the workstation's posting_status is COMPLIANT — a station whose posted licence is MISSING_POSTING or STALE_POSTING may not have sanitation work logged against it, because the board cannot attribute the procedure to a verified licensee"
    error_id: ERR_WORKSTATION_POSTING_NONCOMPLIANT
    http_status: 409
    applies_to: "POST /cosmetology/sanitation-logs"
  # ---------------------------------------------------- business_temporal (66-71)
  - priority: 66
    category: business_temporal
    check: "no two BoothRentals with status IN {PROPOSED, ACTIVE} on the same Workstation may overlap. Interval geometry is HALF-OPEN [term_start_at, term_end_at) with a null term_end_at meaning +infinity, and there is NO buffer: two rentals that merely touch (R2.term_start_at == R1.term_end_at) are accepted; an overlap of a single millisecond is rejected. TERMINATED and VOIDED rentals are ignored, and a terminated rental's effective end for this check is its terminated_at."
    error_id: ERR_BOOTH_RENTAL_OVERLAP
    http_status: 409
    applies_to: "POST /cosmetology/booth-rentals"
  - priority: 67
    category: business_temporal
    check: "no two Inspections with status IN {SCHEDULED, IN_PROGRESS, PENDING_REVIEW} on the same Establishment may overlap. Interval geometry is CLOSED [window_start_at, window_end_at] — touching endpoints DO collide, unlike booth rentals. Applies to every inspection_type including REINSPECTION."
    error_id: ERR_INSPECTION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /cosmetology/inspections"
  - priority: 68
    category: business_temporal
    check: "a ROUTINE or COMPLAINT_DRIVEN inspection window must additionally clear a symmetric INSPECTION_COOLDOWN_HOURS (24 h) buffer around every non-terminal inspection window on the same establishment: the requested window must satisfy window_start_at >= other.window_end_at + 24h OR window_end_at <= other.window_start_at - 24h. REINSPECTION is EXEMPT from the buffer but still subject to the strict closed-overlap check at priority 67, so a reinspection may be booked the morning after the inspection it follows."
    error_id: ERR_INSPECTION_WINDOW_COOLDOWN
    http_status: 409
    applies_to: "POST /cosmetology/inspections"
  - priority: 69
    category: business_temporal
    check: "foot-spa cycles on the same Workstation must not overlap and must be separated by at least FOOT_SPA_CYCLE_GAP_MINUTES (5 min): a new log occupies [performed_at, performed_at + contact_minutes) (its computed occupancy_end_at) and the next log's performed_at must be >= previous occupancy_end_at + 5 min. The gap is inclusive — exactly 5 minutes is accepted."
    error_id: ERR_FOOT_SPA_CYCLE_GAP_VIOLATION
    http_status: 409
    applies_to: "POST /cosmetology/sanitation-logs"
  - priority: 70
    category: business_temporal
    check: "current_utc <= Citation.contest_deadline_at (issued_at + CONTEST_WINDOW_DAYS (20) days, or the amending Hearing.decided_at + 20 days once the citation has been AMENDED); the boundary is inclusive, so a contest filed at exactly the deadline instant is accepted. CONTEST_WINDOW_DAYS (20) is deliberately SHORTER than PAYMENT_TERM_DAYS (30), so the contest window closes while the citation is still ISSUED and this rule is reachable before the delinquency sweep moves the citation out of the contestable set."
    error_id: ERR_CONTEST_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /cosmetology/citations/{id}/contest"
  # -------------------------------------------------- business_referential (72-79)
  - priority: 72
    category: business_referential
    check: "a practitioner referenced in an establishment-scoped write must be linked to that establishment through a BoothRental with status IN {PROPOSED, ACTIVE} on one of its Workstations: attributed_practitioner_id on a finding, and posted_practitioner_id on a posting"
    error_id: ERR_PRACTITIONER_NOT_LINKED_TO_ESTABLISHMENT
    http_status: 422
    applies_to: "POST /cosmetology/inspections/{id}/findings, POST /cosmetology/workstations/{id}/posting"
  - priority: 73
    category: business_referential
    check: "a finding's workstation_id, when supplied, must name a Workstation belonging to the inspection's establishment"
    error_id: ERR_WORKSTATION_NOT_IN_ESTABLISHMENT
    http_status: 422
    applies_to: "POST /cosmetology/inspections/{id}/findings"
  - priority: 74
    category: business_referential
    check: "reinspection_of_id must name an Inspection on the SAME establishment whose status == FINALIZED and whose final_outcome IN {CONDITIONAL_PASS, FAIL, IMMEDIATE_CLOSURE}; a passing inspection has nothing to reinspect and a cross-establishment parent is rejected"
    error_id: ERR_REINSPECTION_PARENT_REQUIRED
    http_status: 422
    applies_to: "POST /cosmetology/inspections"
  - priority: 76
    category: business_referential
    check: "sponsor_practitioner_id on an APPRENTICE_HOUR training record must name a Practitioner other than the subject whose license_type IN {COSMETOLOGIST, BARBER, NAIL_TECHNICIAN, ESTHETICIAN, INSTRUCTOR} and whose license_status == ACTIVE; school_id on a SCHOOL_CLOCK_HOUR record must name a School whose accreditation_status != WITHDRAWN, and an APPRENTICE_HOUR record additionally requires the sponsoring practitioner's school (when set) or the subject's school to have apprenticeship_program_approved == true when the subject's license_type == APPRENTICE"
    error_id: ERR_SPONSOR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /cosmetology/training-records"
  - priority: 78
    category: business_referential
    check: "when subject_type == PRACTITIONER, subject_practitioner_id must equal the attributed_practitioner_id of at least one ViolationFinding on the cited Inspection; an establishment-subject citation requires the inspection to carry at least one finding"
    error_id: ERR_CITATION_SUBJECT_NOT_IN_FINDINGS
    http_status: 422
    applies_to: "POST /cosmetology/citations"
  # --------------------------------------------------- business_constraint (80-87)
  - priority: 79
    category: business_constraint
    check: "station_number is unique within the establishment: no two Workstation rows sharing an establishment_id may carry the same integer station_number, and numbering is not required to be contiguous"
    error_id: ERR_DUPLICATE_STATION_NUMBER
    http_status: 409
    applies_to: "POST /cosmetology/establishments/{id}/workstations"
  - priority: 80
    category: business_constraint
    check: "the establishment's station_count after the write must not exceed Establishment.station_capacity; the comparison is inclusive, so adding the station that brings station_count to exactly station_capacity succeeds and the next one fails"
    error_id: ERR_STATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /cosmetology/establishments/{id}/workstations"
  - priority: 82
    category: business_constraint
    check: "Citation.hearing_round_count < MAX_HEARING_ROUNDS (2) — a citation gets at most two adjudication rounds, after which its last decision stands"
    error_id: ERR_HEARING_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /cosmetology/citations/{id}/hearings"
  - priority: 84
    category: business_constraint
    check: "ISSUE_LICENSE requires the practitioner's exam_eligible == true; GRANT_EXAM_ELIGIBILITY requires credited_hours_total >= required_clock_hours_effective"
    error_id: ERR_EXAM_ELIGIBILITY_REQUIRED
    http_status: 409
    applies_to: "POST /cosmetology/practitioners/{id}/license-actions"
  - priority: 86
    category: business_constraint
    check: "GRANT_EXAM_ELIGIBILITY additionally requires at least one SANITATION-discipline and one DISINFECTION-discipline TrainingRecord, and, for a school-affiliated candidate, that the School's accreditation_status == ACCREDITED at the moment of the action"
    error_id: ERR_TRAINING_HOURS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /cosmetology/practitioners/{id}/license-actions"
  # ------------------------------------------------------- business_fiscal (88-95)
  - priority: 88
    category: business_fiscal
    check: "amount_cents must be > 0 and <= Citation.outstanding_fine_cents — overpayment is refused rather than credited"
    error_id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /cosmetology/citations/{id}/payments"
  - priority: 90
    category: business_fiscal
    check: "the establishment's delinquent_fine_total_cents must be 0 before it may expand capacity or personnel; unpaid-but-not-yet-delinquent fines do not block. Ordered strictly after the business_safety posture check at priority 60, so an establishment that is both FROZEN and delinquent reports ERR_POSTURE_FROZEN."
    error_id: ERR_OUTSTANDING_FINES_BLOCK_EXPANSION
    http_status: 402
    applies_to: "POST /cosmetology/establishments/{id}/workstations, POST /cosmetology/booth-rentals"

endpoints:
  # ============================== READS ==============================
  - method: GET
    path: "/cosmetology/establishments/{id}"
    description: "Fetch one establishment with its computed compliance fields (station_count, compliance_posture, demerit_balance, open_critical_citation_count, outstanding_fine_total_cents, delinquent_fine_total_cents, foot_spa_biofilm_current)."
    roles: [BoardAdmin, Inspector, HearingOfficer, EstablishmentOwner, HealthAuthorityLiaison]
    code: 200
    input: []
    output: Establishment
    side_effects: []
  - method: GET
    path: "/cosmetology/establishments"
    description: "List establishments, newest first by created_at DESC then id ASC."
    roles: [BoardAdmin, Inspector, HearingOfficer, HealthAuthorityLiaison]
    code: 200
    input: ["license_status?", "county_code?", "compliance_posture?", "establishment_type?", "limit?", "offset?"]
    output: Establishment[]
    side_effects: []
  - method: GET
    path: "/cosmetology/practitioners/{id}"
    description: "Fetch one practitioner with credited-hour ledger and sanction totals."
    roles: [BoardAdmin, Inspector, HearingOfficer, SchoolRegistrar, Practitioner, EstablishmentOwner]
    code: 200
    input: []
    output: Practitioner
    side_effects: []
  - method: GET
    path: "/cosmetology/practitioners"
    description: "List practitioners, created_at DESC then id ASC. Reverse-reachability for Practitioner.school_id."
    roles: [BoardAdmin, Inspector, HearingOfficer, SchoolRegistrar]
    code: 200
    input: ["school_id?", "license_status?", "license_type?", "exam_eligible?", "limit?", "offset?"]
    output: Practitioner[]
    side_effects: []
  - method: GET
    path: "/cosmetology/schools/{id}"
    description: "Fetch one school with its clock-hour requirement and accreditation posture."
    roles: [BoardAdmin, Inspector, SchoolRegistrar, Practitioner]
    code: 200
    input: []
    output: School
    side_effects: []
  - method: GET
    path: "/cosmetology/training-records/{id}"
    description: "Fetch one training record."
    roles: [BoardAdmin, SchoolRegistrar, Practitioner]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: []
  - method: GET
    path: "/cosmetology/training-records"
    description: "List training records, performed_on ASC then created_at ASC. Reverse-reachability for TrainingRecord.practitioner_id, TrainingRecord.school_id and TrainingRecord.sponsor_practitioner_id."
    roles: [BoardAdmin, SchoolRegistrar, Practitioner]
    code: 200
    input: ["practitioner_id?", "school_id?", "sponsor_practitioner_id?", "credit_type?", "discipline?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []
  - method: GET
    path: "/cosmetology/workstations/{id}"
    description: "Fetch one workstation with its recomputed posting_status, last_biofilm_cycle_at and current version (the OCC token required by booth-rental creation)."
    roles: [BoardAdmin, Inspector, EstablishmentOwner, Practitioner]
    code: 200
    input: []
    output: Workstation
    side_effects: []
  - method: GET
    path: "/cosmetology/workstations"
    description: "List workstations, station_number ASC then created_at ASC. Reverse-reachability for Workstation.establishment_id and Workstation.posted_practitioner_id."
    roles: [BoardAdmin, Inspector, EstablishmentOwner]
    code: 200
    input: ["establishment_id?", "posted_practitioner_id?", "station_type?", "posting_status?", "limit?", "offset?"]
    output: Workstation[]
    side_effects: []
  - method: GET
    path: "/cosmetology/workstations/{id}/sanitation-logs"
    description: "List the sanitation and disinfection log entries recorded at one workstation, performed_at ASC then created_at ASC. Sub-resource reverse-reachability for SanitationLog.workstation_id."
    roles: [BoardAdmin, Inspector, EstablishmentOwner, HealthAuthorityLiaison]
    code: 200
    input: ["log_type?", "limit?", "offset?"]
    output: SanitationLog[]
    side_effects: []
  - method: GET
    path: "/cosmetology/booth-rentals/{id}"
    description: "Fetch one booth-rental agreement."
    roles: [BoardAdmin, Inspector, EstablishmentOwner, Practitioner]
    code: 200
    input: []
    output: BoothRental
    side_effects: []
  - method: GET
    path: "/cosmetology/booth-rentals"
    description: "List booth rentals, term_start_at ASC then created_at ASC. Reverse-reachability for BoothRental.workstation_id and BoothRental.practitioner_id."
    roles: [BoardAdmin, Inspector, EstablishmentOwner, Practitioner]
    code: 200
    input: ["workstation_id?", "practitioner_id?", "status?", "rental_type?", "limit?", "offset?"]
    output: BoothRental[]
    side_effects: []
  - method: GET
    path: "/cosmetology/inspections/{id}"
    description: "Fetch one inspection with both score variants, both outcome variants, the demerit snapshot and the current version (the OCC token required by citation creation)."
    roles: [BoardAdmin, Inspector, HearingOfficer, EstablishmentOwner, HealthAuthorityLiaison]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/cosmetology/inspections"
    description: "List inspections, window_start_at DESC then created_at DESC. Reverse-reachability for Inspection.establishment_id and Inspection.reinspection_of_id."
    roles: [BoardAdmin, Inspector, HearingOfficer, EstablishmentOwner, HealthAuthorityLiaison]
    code: 200
    input: ["establishment_id?", "reinspection_of_id?", "status?", "inspection_type?", "hazard_state?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/cosmetology/violation-codes/{id}"
    description: "Fetch one violation code from the board's published schedule."
    roles: [BoardAdmin, Inspector, HearingOfficer, EstablishmentOwner]
    code: 200
    input: []
    output: ViolationCode
    side_effects: []
  - method: GET
    path: "/cosmetology/violation-findings/{id}"
    description: "Fetch one violation finding with its provisional and final point values and repeat factors."
    roles: [BoardAdmin, Inspector, HearingOfficer, EstablishmentOwner]
    code: 200
    input: []
    output: ViolationFinding
    side_effects: []
  - method: GET
    path: "/cosmetology/violation-findings"
    description: "List violation findings, created_at ASC (the same order the scoring calculation walks). Reverse-reachability for ViolationFinding.inspection_id, violation_code_id, attributed_practitioner_id and workstation_id."
    roles: [BoardAdmin, Inspector, HearingOfficer, EstablishmentOwner]
    code: 200
    input: ["inspection_id?", "violation_code_id?", "attributed_practitioner_id?", "workstation_id?", "declared_hazard?", "limit?", "offset?"]
    output: ViolationFinding[]
    side_effects: []
  - method: GET
    path: "/cosmetology/citations/{id}"
    description: "Fetch one citation with its fine breakdown (assessed_fine_cents, administrative_fee_cents, total_due_cents, outstanding_fine_cents), demerit tier multiplier, hearing round count and the two deadlines."
    roles: [BoardAdmin, Inspector, HearingOfficer, EstablishmentOwner, Practitioner]
    code: 200
    input: []
    output: Citation
    side_effects: []
  - method: GET
    path: "/cosmetology/citations"
    description: "List citations, issued_at DESC then created_at DESC. Reverse-reachability for Citation.inspection_id and Citation.subject_practitioner_id."
    roles: [BoardAdmin, Inspector, HearingOfficer, EstablishmentOwner, Practitioner]
    code: 200
    input: ["inspection_id?", "subject_practitioner_id?", "subject_type?", "status?", "limit?", "offset?"]
    output: Citation[]
    side_effects: []
  - method: GET
    path: "/cosmetology/citations/{id}/hearings"
    description: "List the adjudication rounds held on one citation, round_index ASC. Sub-resource reverse-reachability for Hearing.citation_id."
    roles: [BoardAdmin, HearingOfficer, EstablishmentOwner, Practitioner]
    code: 200
    input: ["limit?", "offset?"]
    output: Hearing[]
    side_effects: []
  - method: GET
    path: "/cosmetology/hearings/{id}"
    description: "Fetch one hearing with its presiding officer, decision and amended fine."
    roles: [BoardAdmin, HearingOfficer, EstablishmentOwner, Practitioner]
    code: 200
    input: []
    output: Hearing
    side_effects: []
  - method: GET
    path: "/cosmetology/infection-incidents/{id}"
    description: "Fetch one infection incident with its computed notification deadline."
    roles: [BoardAdmin, Inspector, HealthAuthorityLiaison, EstablishmentOwner]
    code: 200
    input: []
    output: InfectionIncident
    side_effects: []
  - method: GET
    path: "/cosmetology/infection-incidents"
    description: "List infection incidents, reported_at DESC then created_at DESC. Reverse-reachability for InfectionIncident.establishment_id and suspected_practitioner_id."
    roles: [BoardAdmin, Inspector, HealthAuthorityLiaison]
    code: 200
    input: ["establishment_id?", "suspected_practitioner_id?", "status?", "limit?", "offset?"]
    output: InfectionIncident[]
    side_effects: []
  - method: GET
    path: "/cosmetology/ledger-entries/{id}"
    description: "Fetch one immutable ledger entry."
    roles: [BoardAdmin, HearingOfficer]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []
  - method: GET
    path: "/cosmetology/ledger-entries"
    description: "List ledger entries, occurred_at ASC then created_at ASC — the audit channel that proves the compensating-invariant sums. Reverse-reachability for LedgerEntry.citation_id, establishment_id, practitioner_id and inspection_id."
    roles: [BoardAdmin, HearingOfficer]
    code: 200
    input: ["establishment_id?", "citation_id?", "practitioner_id?", "inspection_id?", "ledger_type?", "entry_reason?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  # ============================== WRITES: registry ==============================
  - method: POST
    path: "/cosmetology/violation-codes"
    description: "Publish an entry in the board's violation schedule (immutable reference data; no version field)."
    roles: [BoardAdmin]
    code: 201
    input: [code, category, severity, base_points, fine_cents_base]
    output: ViolationCode
    side_effects: ["none — reference data only"]
  - method: POST
    path: "/cosmetology/schools"
    description: "Register a licensed cosmetology school, its clock-hour requirement, its accreditation posture and whether its apprenticeship program is board-approved."
    roles: [BoardAdmin]
    code: 201
    input: ["name", "county_code", "required_clock_hours", "accreditation_status?", "apprenticeship_program_approved?"]
    output: School
    side_effects: ["none"]
  - method: POST
    path: "/cosmetology/practitioners"
    description: "Enrol a practitioner candidate. license_status starts at STUDENT; school_id may be omitted for a pure apprenticeship candidate, in which case required_clock_hours_effective falls back to APPRENTICE_STANDALONE_REQUIRED_HOURS (1600.00)."
    roles: [BoardAdmin, SchoolRegistrar]
    code: 201
    input: ["full_name", "license_type", "school_id?"]
    output: Practitioner
    side_effects:
      - "sets license_status = STUDENT, credited_hours_school = 0.00, credited_hours_apprentice = 0.00, credited_hours_total = 0.00, sanction_points = 0.00, exam_eligible = false"
      - "recomputes required_clock_hours_effective from School.required_clock_hours or the standalone fallback"
  - method: POST
    path: "/cosmetology/practitioners/{id}/license-actions"
    description: "Apply a board licensing action. action is one of GRANT_EXAM_ELIGIBILITY, ISSUE_LICENSE, PLACE_ON_PROBATION, SUSPEND, REINSTATE, REVOKE. effective_at defaults to the current logical clock."
    roles: [BoardAdmin]
    code: 200
    input: ["action", "effective_at?", "reason?"]
    output: Practitioner
    side_effects:
      - "GRANT_EXAM_ELIGIBILITY: STUDENT -> EXAM_ELIGIBLE after re-running practitioner_credited_hours"
      - "ISSUE_LICENSE: EXAM_ELIGIBLE -> ACTIVE and sets license_expires_on = date(effective_at) + LICENSE_TERM_DAYS (730) days"
      - "PLACE_ON_PROBATION: ACTIVE -> PROBATION"
      - "SUSPEND: ACTIVE|PROBATION -> SUSPENDED, snapshots suspension_cause_points = sanction_points, then cascades: every BoothRental of this practitioner with status IN {PROPOSED, ACTIVE} becomes VOIDED, and every Workstation whose posted_practitioner_id is this practitioner is recomputed to STALE_POSTING"
      - "REINSTATE: PROBATION|SUSPENDED|LAPSED -> ACTIVE and appends a compensating LedgerEntry(ledger_type=SANCTION_POINTS, entry_reason=REINSTATEMENT_SANCTION_REVERSAL, delta_points = -suspension_cause_points, practitioner_id=this), then recomputes sanction_points"
      - "REVOKE: -> REVOKED (terminal) with the same booth-rental and posting cascade as SUSPEND"
      - "increments Practitioner.version by 1"
  - method: POST
    path: "/cosmetology/training-records"
    description: "Append one immutable clock-hour or apprentice-hour record (no version field, never amended). Recomputes the subject practitioner's credited-hour ledger."
    roles: [BoardAdmin, SchoolRegistrar]
    code: 201
    input: ["practitioner_id", "credit_type", "hours", "performed_on", "discipline", "school_id?", "sponsor_practitioner_id?"]
    output: TrainingRecord
    side_effects:
      - "recomputes practitioner_credited_hours (credited_hours_school, credited_hours_apprentice, credited_hours_total, required_clock_hours_effective, exam_eligible) on the subject Practitioner"
      - "increments Practitioner.version by 1"
  # ============================== WRITES: establishment ==============================
  - method: POST
    path: "/cosmetology/establishments"
    description: "Register an establishment. license_status starts at PENDING_INSPECTION and compliance_posture at CLEAR; the establishment is operable for setup writes but cannot be ACTIVE until an inspection finalizes with outcome PASS."
    roles: [BoardAdmin, EstablishmentOwner]
    code: 201
    input: [legal_name, establishment_type, county_code, station_capacity]
    output: Establishment
    side_effects:
      - "sets license_status = PENDING_INSPECTION, compliance_posture = CLEAR, station_count = 0, demerit_balance = 0.00, open_critical_citation_count = 0, outstanding_fine_total_cents = 0, delinquent_fine_total_cents = 0, foot_spa_biofilm_current = true (vacuously, zero FOOT_SPA stations)"
  - method: POST
    path: "/cosmetology/establishments/{id}/workstations"
    description: "Add a workstation to an establishment. Capacity, posture and delinquency gates all apply here."
    roles: [BoardAdmin, EstablishmentOwner]
    code: 201
    input: [station_number, station_type]
    output: Workstation
    side_effects:
      - "sets posting_status = MISSING_POSTING and last_biofilm_cycle_at = null"
      - "recomputes Establishment.station_count and Establishment.foot_spa_biofilm_current"
      - "increments Establishment.version by 1"
  - method: POST
    path: "/cosmetology/workstations/{id}/posting"
    description: "Post a practitioner's licence at the workstation, as required at the point of service. Recomputes posting_status, which stays STALE_POSTING until the practitioner also holds an ACTIVE booth rental covering the current logical clock."
    roles: [BoardAdmin, EstablishmentOwner]
    code: 200
    input: [posted_practitioner_id]
    output: Workstation
    side_effects:
      - "sets posted_practitioner_id and recomputes workstation_posting_status"
      - "increments Workstation.version by 1"
  - method: POST
    path: "/cosmetology/booth-rentals"
    description: "Open a booth-rental or employment agreement on a workstation. Requires expected_workstation_version — the version the client last observed on the parent Workstation — because a posting change or a competing rental silently advances it."
    roles: [BoardAdmin, EstablishmentOwner]
    code: 201
    input: ["workstation_id", "practitioner_id", "rental_type", "term_start_at", "term_end_at?", "monthly_rent_cents", "expected_workstation_version"]
    output: BoothRental
    side_effects:
      - "sets status = PROPOSED"
      - "increments Workstation.version by 1"
  - method: POST
    path: "/cosmetology/booth-rentals/{id}/activation"
    description: "Activate a proposed rental. Requires the practitioner's licence to be ACTIVE and the workstation's posted_practitioner_id to already name that same practitioner."
    roles: [BoardAdmin, EstablishmentOwner]
    code: 200
    input: []
    output: BoothRental
    side_effects:
      - "PROPOSED -> ACTIVE"
      - "recomputes the parent Workstation's posting_status (typically STALE_POSTING -> COMPLIANT) and increments Workstation.version by 1"
      - "increments BoothRental.version by 1"
  - method: POST
    path: "/cosmetology/booth-rentals/{id}/termination"
    description: "Terminate an active rental. terminated_at defaults to the current logical clock."
    roles: [BoardAdmin, EstablishmentOwner, Practitioner]
    code: 200
    input: ["terminated_at?", "reason?"]
    output: BoothRental
    side_effects:
      - "ACTIVE -> TERMINATED and sets terminated_at"
      - "recomputes the parent Workstation's posting_status (COMPLIANT -> STALE_POSTING when the terminated practitioner is still posted) and increments Workstation.version by 1"
      - "increments BoothRental.version by 1"
  # ============================== WRITES: inspection ==============================
  - method: POST
    path: "/cosmetology/inspections"
    description: "Schedule an inspection window. ROUTINE and COMPLAINT_DRIVEN windows must clear a symmetric 24-hour cooldown buffer around every non-terminal window on the establishment; REINSPECTION is exempt from the buffer but not from the strict closed-interval overlap check."
    roles: [BoardAdmin, Inspector]
    code: 201
    input: ["establishment_id", "inspection_type", "window_start_at", "window_end_at", "inspector_user_id", "complaint_reference?", "reinspection_of_id?"]
    output: Inspection
    side_effects:
      - "sets status = SCHEDULED, hazard_state = NONE, finding_count = 0, citation_count = 0 and leaves both score variants null"
  - method: POST
    path: "/cosmetology/inspections/{id}/start"
    description: "Open the inspection on site. Records started_at from the current logical clock."
    roles: [BoardAdmin, Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "SCHEDULED -> IN_PROGRESS, sets started_at = current_utc"
      - "increments Inspection.version by 1"
  - method: POST
    path: "/cosmetology/inspections/{id}/findings"
    description: "Record one observed violation against the open inspection. severity is copied from the ViolationCode; provisional and final point values stay null until the corresponding scoring pass runs."
    roles: [BoardAdmin, Inspector]
    code: 201
    input: ["violation_code_id", "observed_count", "corrected_on_site", "attributed_practitioner_id?", "workstation_id?", "note?"]
    output: ViolationFinding
    side_effects:
      - "copies severity from ViolationCode.severity and sets declared_hazard = false"
      - "recomputes Inspection.finding_count and increments Inspection.version by 1"
  - method: POST
    path: "/cosmetology/inspections/{id}/submit"
    description: "Submit the inspection for board review. Runs the PROVISIONAL variant of inspection_adjusted_score (on-site credit 0.50, repeat window anchored at submitted_at)."
    roles: [BoardAdmin, Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "IN_PROGRESS -> PENDING_REVIEW, sets submitted_at = current_utc"
      - "writes ViolationFinding.repeat_factor_provisional and ViolationFinding.provisional_points on every finding"
      - "writes Inspection.provisional_adjusted_score and Inspection.provisional_outcome"
      - "increments Inspection.version by 1"
  - method: POST
    path: "/cosmetology/inspections/{id}/finalize"
    description: "Finalize board review. Runs the FINAL variant of inspection_adjusted_score (on-site credit 0.25, repeat window anchored at finalized_at), snapshots the establishment's pre-cascade demerit balance, then drives the five-hop compliance cascade."
    roles: [BoardAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects:
      - "hop 1: PENDING_REVIEW -> FINALIZED, sets finalized_at = current_utc, writes ViolationFinding.repeat_factor_final and final_points on every finding, then Inspection.final_adjusted_score and Inspection.final_outcome"
      - "hop 2: snapshots Inspection.demerit_balance_before_finalize = Establishment.demerit_balance (BEFORE hop 3), then appends LedgerEntry(ledger_type=DEMERIT_POINTS, entry_reason=INSPECTION_DEMERIT_ASSESSMENT, delta_points = +final_adjusted_score, establishment_id, inspection_id)"
      - "hop 3: recomputes Establishment.demerit_balance from the DEMERIT_POINTS ledger"
      - "hop 4: re-derives Establishment.license_status — CLOSED_IMMINENT_HAZARD when final_outcome == IMMEDIATE_CLOSURE; REVOKED when demerit_balance >= 200.00; PROBATION when demerit_balance >= 100.00; ACTIVE when final_outcome == PASS and the current status is PENDING_INSPECTION or PROBATION; otherwise unchanged"
      - "hop 5: recomputes Establishment.compliance_posture, open_critical_citation_count, outstanding_fine_total_cents, delinquent_fine_total_cents and last_finalized_inspection_at, and increments Establishment.version by 1"
      - "increments Inspection.version by 1"
  - method: POST
    path: "/cosmetology/inspections/{id}/hazard-declaration"
    description: "Declare an imminent hazard on the open inspection and exercise immediate closure authority. hazard_violation_finding_id must name a finding on this inspection whose severity == IMMINENT_HAZARD."
    roles: [BoardAdmin, Inspector]
    code: 200
    input: [hazard_violation_finding_id, narrative]
    output: Inspection
    side_effects:
      - "hazard_state NONE -> HAZARD_DECLARED (an independent dimension: status stays IN_PROGRESS)"
      - "sets ViolationFinding.declared_hazard = true on the named finding"
      - "immediately sets Establishment.license_status = CLOSED_IMMINENT_HAZARD, recomputes compliance_posture (-> FROZEN) and increments Establishment.version by 1 — closure does not wait for finalize"
      - "increments Inspection.version by 1"
  - method: POST
    path: "/cosmetology/inspections/{id}/hazard-clearance"
    description: "Lift an immediate closure. clearing_reinspection_id must name a FINALIZED REINSPECTION whose reinspection_of_id is this inspection and whose final_adjusted_score <= 10.00."
    roles: [BoardAdmin]
    code: 200
    input: [clearing_reinspection_id]
    output: Inspection
    side_effects:
      - "hazard_state HAZARD_DECLARED -> HAZARD_CLEARED (terminal on that dimension)"
      - "sets Establishment.license_status = PROBATION, recomputes compliance_posture and increments Establishment.version by 1"
      - "increments Inspection.version by 1"
  # ============================== WRITES: enforcement ==============================
  - method: POST
    path: "/cosmetology/citations"
    description: "Issue a citation for a finalized inspection. Requires expected_inspection_version — the version the client last observed on the parent Inspection — because the finalize cascade and any earlier citation on the same inspection both advance it."
    roles: [BoardAdmin]
    code: 201
    input: ["inspection_id", "subject_type", "subject_practitioner_id?", "expected_inspection_version"]
    output: Citation
    side_effects:
      - "assigns citation_number, sets status = ISSUED and issued_at = current_utc"
      - "runs citation_fine_amount then citation_total_due_cents, writing max_finding_severity, demerit_tier_multiplier, assessed_fine_cents, administrative_fee_cents, total_due_cents"
      - "appends LedgerEntry(ledger_type=FINE_CENTS, entry_reason=CITATION_ASSESSMENT, delta_cents = +total_due_cents, citation_id, establishment_id) and recomputes outstanding_fine_cents"
      - "sets due_at = issued_at + PAYMENT_TERM_DAYS (30) days and contest_deadline_at = issued_at + CONTEST_WINDOW_DAYS (20) days"
      - "recomputes Establishment.outstanding_fine_total_cents, open_critical_citation_count and compliance_posture; increments Establishment.version by 1"
      - "recomputes Inspection.citation_count and increments Inspection.version by 1"
  - method: POST
    path: "/cosmetology/citations/{id}/contest"
    description: "Exercise the hearing right by contesting a citation within the 20-day contest window. An AMENDED citation may be contested again on its re-based deadline, bounded by MAX_HEARING_ROUNDS."
    roles: [BoardAdmin, EstablishmentOwner, Practitioner]
    code: 200
    input: [grounds]
    output: Citation
    side_effects:
      - "ISSUED -> CONTESTED, or AMENDED -> CONTESTED which closes the adjudication cycle"
      - "increments Citation.version by 1"
  - method: POST
    path: "/cosmetology/citations/{id}/hearings"
    description: "Schedule an adjudication round. presiding_officer_user_id must differ from the inspector_user_id on the citation's inspection (segregation of duties), and at most two rounds are permitted per citation."
    roles: [BoardAdmin]
    code: 201
    input: [presiding_officer_user_id, scheduled_at]
    output: Hearing
    side_effects:
      - "sets status = SCHEDULED, round_index = Citation.hearing_round_count + 1, decision = null"
      - "Citation CONTESTED -> HEARING_SCHEDULED, increments Citation.hearing_round_count, increments Citation.version by 1"
  - method: POST
    path: "/cosmetology/hearings/{id}/decision"
    description: "Record the presiding officer's decision. AFFIRMED leaves the fine intact; AMENDED replaces it with amended_fine_cents and posts the delta; DISMISSED reverses the whole assessment and the inspection's demerits."
    roles: [BoardAdmin, HearingOfficer]
    code: 200
    input: ["decision", "amended_fine_cents?", "rationale"]
    output: Hearing
    side_effects:
      - "Hearing SCHEDULED -> DECIDED, sets decision and decided_at = current_utc"
      - "AFFIRMED: Citation HEARING_SCHEDULED -> AFFIRMED, no ledger movement"
      - "AMENDED: Citation -> AMENDED; re-runs citation_total_due_cents from amended_fine_cents (re-deriving administrative_fee_cents from the NEW fine tier) and appends LedgerEntry(FINE_CENTS, CITATION_AMENDMENT_ADJUSTMENT, delta_cents = new_total_due - old_total_due); a citation left AMENDED may be contested again, which is the cyclic path back to CONTESTED"
      - "DISMISSED cascade hop 2a: Citation -> DISMISSED, appends LedgerEntry(FINE_CENTS, CITATION_DISMISSAL_REVERSAL, delta_cents = -outstanding_fine_cents_before) so the FINE_CENTS ledger for this citation sums to exactly 0 and outstanding_fine_cents returns to 0"
      - "DISMISSED cascade hop 2b: appends LedgerEntry(DEMERIT_POINTS, INSPECTION_DEMERIT_REVERSAL, delta_points = -Inspection.final_adjusted_score, establishment_id, inspection_id) when this was the last non-dismissed citation on that inspection"
      - "DISMISSED cascade hop 3: recomputes Establishment.demerit_balance, outstanding_fine_total_cents, delinquent_fine_total_cents, open_critical_citation_count and compliance_posture, re-derives license_status (PROBATION -> ACTIVE when demerit_balance falls back below 100.00 and no hazard closure is in force) and increments Establishment.version by 1"
      - "increments Hearing.version and Citation.version by 1 each"
  - method: POST
    path: "/cosmetology/citations/{id}/payments"
    description: "Record a payment against a citation's outstanding balance. Overpayment is refused rather than credited."
    roles: [BoardAdmin, EstablishmentOwner, Practitioner]
    code: 201
    input: ["amount_cents", "payer_reference?"]
    output: LedgerEntry
    side_effects:
      - "appends LedgerEntry(ledger_type=FINE_CENTS, entry_reason=CITATION_PAYMENT, delta_cents = -amount_cents, citation_id, establishment_id) and recomputes Citation.outstanding_fine_cents"
      - "Citation -> SETTLED when outstanding_fine_cents reaches exactly 0"
      - "recomputes Establishment.outstanding_fine_total_cents, delinquent_fine_total_cents, open_critical_citation_count and compliance_posture; increments Establishment.version by 1"
      - "increments Citation.version by 1"
  # ============================== WRITES: sanitation & public health ==============================
  - method: POST
    path: "/cosmetology/sanitation-logs"
    description: "Record one immutable disinfection or foot-spa procedure at a workstation (no version field). Contact-time minimums, station-type matching, posting compliance and the 5-minute foot-spa cycle gap are all enforced here."
    roles: [BoardAdmin, EstablishmentOwner, Practitioner]
    code: 201
    input: ["workstation_id", "log_type", "performed_at", "contact_minutes", "disinfectant_epa_reg_number", "implement_batch_count?"]
    output: SanitationLog
    side_effects:
      - "computes occupancy_end_at = performed_at + contact_minutes minutes"
      - "recomputes Workstation.last_biofilm_cycle_at when log_type == FOOT_SPA_WEEKLY_BIOFILM and increments Workstation.version by 1"
      - "recomputes Establishment.foot_spa_biofilm_current and increments Establishment.version by 1"
  - method: POST
    path: "/cosmetology/infection-incidents"
    description: "Open an infection incident investigation. The notification deadline is 24 hours from reported_at when case_count >= 2 and 72 hours otherwise."
    roles: [BoardAdmin, Inspector, EstablishmentOwner, HealthAuthorityLiaison]
    code: 201
    input: ["establishment_id", "case_count", "onset_date", "suspected_practitioner_id?", "narrative"]
    output: InfectionIncident
    side_effects:
      - "sets status = REPORTED, reported_at = current_utc and computes notification_deadline_at via infection_notification_deadline"
  - method: POST
    path: "/cosmetology/infection-incidents/{id}/notification"
    description: "Record the mandated report to the public-health authority. notified_at defaults to the current logical clock."
    roles: [BoardAdmin, HealthAuthorityLiaison]
    code: 200
    input: ["health_authority_reference", "notified_at?"]
    output: InfectionIncident
    side_effects:
      - "REPORTED|ESCALATED_OVERDUE -> NOTIFIED, sets notified_at and health_authority_reference"
      - "increments InfectionIncident.version by 1"
  - method: POST
    path: "/cosmetology/infection-incidents/{id}/resolution"
    description: "Close the investigation. resolution is SUBSTANTIATED or UNSUBSTANTIATED; only SUBSTANTIATED drives the sanction cascade."
    roles: [BoardAdmin, HealthAuthorityLiaison]
    code: 200
    input: [resolution, findings_summary]
    output: InfectionIncident
    side_effects:
      - "hop 1: NOTIFIED -> RESOLVED_SUBSTANTIATED or RESOLVED_UNSUBSTANTIATED, sets findings_summary"
      - "hop 2 (SUBSTANTIATED with suspected_practitioner_id set): appends LedgerEntry(ledger_type=SANCTION_POINTS, entry_reason=INFECTION_SANCTION_ASSESSMENT, delta_points = +SUBSTANTIATED_SANCTION_POINTS (10.00), practitioner_id) and recomputes practitioner_sanction_points. An infection resolution posts SANCTION_POINTS ONLY — it never posts a DEMERIT_POINTS row, so Establishment.demerit_balance and compliance_posture are untouched by this endpoint"
      - "hop 3: when the recomputed sanction_points reaches SANCTION_SUSPENSION_THRESHOLD (15.00) the Practitioner's license_status ACTIVE|PROBATION -> SUSPENDED and suspension_cause_points is snapshotted"
      - "hop 4: that suspension terminates the practitioner's ACTIVE BoothRentals and voids their PROPOSED ones, clearing Workstation.posted_practitioner_id to null so posting_status becomes MISSING_POSTING, and increments each affected Workstation.version and BoothRental.version by 1"
      - "increments InfectionIncident.version by 1"
  # ============================== TEST-DRIVING ==============================
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, window, expiry and overlap rule reads. The clock's startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time; to_iso8601 must be strictly greater than the current value. Advancing the clock also runs the three time-driven sweeps described in side_effects."
    roles: [BoardAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "delinquency sweep: every Citation with status IN {ISSUED, AFFIRMED, AMENDED} (a CONTESTED or HEARING_SCHEDULED citation is under adjudication and is exempt) whose due_at < the new clock and whose outstanding_fine_cents > 0 becomes DELINQUENT, appends LedgerEntry(FINE_CENTS, CITATION_LATE_PENALTY, delta_cents = round_half_up(outstanding_fine_cents * LATE_PENALTY_PCT (0.10))), and — when max_finding_severity IN {CRITICAL, IMMINENT_HAZARD} — sets its Establishment.license_status to SUSPENDED"
      - "infection sweep: every InfectionIncident with status == REPORTED whose notification_deadline_at < the new clock becomes ESCALATED_OVERDUE"
      - "licence-expiry sweep: every Practitioner with license_status IN {ACTIVE, PROBATION} whose license_expires_on < the new clock's UTC date becomes LAPSED"
      - "recomputes every affected Citation.outstanding_fine_cents, Establishment aggregate (demerit_balance, outstanding_fine_total_cents, delinquent_fine_total_cents, open_critical_citation_count, compliance_posture, foot_spa_biofilm_current) and Workstation.posting_status, incrementing the version of each mutated entity by 1"

errors:
  # ---- auth / shape ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing or empty, or X-User-Role names a role not declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed on the endpoint, an entity_backed role's X-User-ID does not resolve to a row of its backing entity, or the resolved actor is outside the resource's ownership scope"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, undeclared enum member, negative quantity, unparseable ISO-8601 instant or date, out-of-range pagination argument, or a violated conditional field pairing"
  - id: ERR_CLOCK_MUST_ADVANCE
    http: 422
    condition: "to_iso8601 is less than or equal to the current logical clock value (startup default 2026-08-01T00:00:00Z)"
  # ---- existence ----
  - id: ERR_ESTABLISHMENT_NOT_FOUND
    http: 404
    condition: "no Establishment with the given id"
  - id: ERR_PRACTITIONER_NOT_FOUND
    http: 404
    condition: "no Practitioner with the given id (path id, practitioner_id, sponsor_practitioner_id, posted_practitioner_id, attributed_practitioner_id, subject_practitioner_id or suspected_practitioner_id)"
  - id: ERR_SCHOOL_NOT_FOUND
    http: 404
    condition: "no School with the given id"
  - id: ERR_TRAINING_RECORD_NOT_FOUND
    http: 404
    condition: "no TrainingRecord with the given id"
  - id: ERR_WORKSTATION_NOT_FOUND
    http: 404
    condition: "no Workstation with the given id (path id or workstation_id)"
  - id: ERR_BOOTH_RENTAL_NOT_FOUND
    http: 404
    condition: "no BoothRental with the given id"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "no Inspection with the given id (path id, inspection_id, reinspection_of_id or clearing_reinspection_id)"
  - id: ERR_VIOLATION_CODE_NOT_FOUND
    http: 404
    condition: "no ViolationCode with the given id"
  - id: ERR_VIOLATION_FINDING_NOT_FOUND
    http: 404
    condition: "no ViolationFinding with the given id (path id or hazard_violation_finding_id)"
  - id: ERR_CITATION_NOT_FOUND
    http: 404
    condition: "no Citation with the given id"
  - id: ERR_HEARING_NOT_FOUND
    http: 404
    condition: "no Hearing with the given id"
  - id: ERR_INFECTION_INCIDENT_NOT_FOUND
    http: 404
    condition: "no InfectionIncident with the given id"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "no LedgerEntry with the given id"
  # ---- state preconditions ----
  - id: ERR_ESTABLISHMENT_NOT_OPERABLE
    http: 409
    condition: "the Establishment's license_status is SUSPENDED, CLOSED_IMMINENT_HAZARD or REVOKED and the request would add capacity, change a posting, open a rental or schedule a routine inspection"
  - id: ERR_PRACTITIONER_LICENSE_NOT_ACTIVE
    http: 409
    condition: "the referenced Practitioner's license_status is not ACTIVE where the operation demands an active licence"
  - id: ERR_INSPECTION_NOT_SCHEDULED
    http: 409
    condition: "start was attempted on an inspection whose status is not SCHEDULED"
  - id: ERR_INSPECTION_NOT_IN_PROGRESS
    http: 409
    condition: "a finding, submit or hazard declaration was attempted on an inspection whose status is not IN_PROGRESS"
  - id: ERR_INSPECTION_NOT_PENDING_REVIEW
    http: 409
    condition: "finalize was attempted on an inspection whose status is not PENDING_REVIEW"
  - id: ERR_INSPECTION_NOT_FINALIZED
    http: 409
    condition: "a citation or a hazard clearance referenced an inspection whose status is not FINALIZED"
  - id: ERR_HAZARD_ALREADY_DECLARED
    http: 409
    condition: "a second hazard declaration was attempted on an inspection whose hazard_state is already HAZARD_DECLARED or HAZARD_CLEARED"
  - id: ERR_HAZARD_NOT_DECLARED
    http: 409
    condition: "a hazard clearance was attempted on an inspection whose hazard_state is NONE or already HAZARD_CLEARED"
  - id: ERR_CITATION_NOT_CONTESTABLE
    http: 409
    condition: "contest was attempted on a citation whose status is neither ISSUED nor AMENDED"
  - id: ERR_CITATION_NOT_CONTESTED
    http: 409
    condition: "a hearing was scheduled on a citation whose status is not CONTESTED"
  - id: ERR_HEARING_ALREADY_DECIDED
    http: 409
    condition: "a decision was recorded on a hearing whose status is already DECIDED"
  - id: ERR_CITATION_ALREADY_SETTLED
    http: 409
    condition: "a payment was attempted on a citation whose status is SETTLED or DISMISSED"
  - id: ERR_BOOTH_RENTAL_NOT_PROPOSED
    http: 409
    condition: "activation was attempted on a rental whose status is not PROPOSED"
  - id: ERR_BOOTH_RENTAL_NOT_ACTIVE
    http: 409
    condition: "termination was attempted on a rental whose status is not ACTIVE"
  - id: ERR_INCIDENT_NOT_NOTIFIABLE
    http: 409
    condition: "notification was attempted on an incident whose status is not REPORTED or ESCALATED_OVERDUE"
  - id: ERR_INCIDENT_NOT_NOTIFIED
    http: 409
    condition: "resolution was attempted on an incident whose status is not NOTIFIED"
  - id: ERR_LICENSE_ACTION_NOT_PERMITTED
    http: 409
    condition: "the requested licence action is not legal from the practitioner's current license_status (including any action from the terminal REVOKED state)"
  # ---- optimistic concurrency ----
  - id: ERR_STALE_WORKSTATION_VERSION
    http: 412
    condition: "expected_workstation_version does not equal the parent Workstation's current version"
  - id: ERR_STALE_INSPECTION_VERSION
    http: 412
    condition: "expected_inspection_version does not equal the parent Inspection's current version"
  # ---- business_safety ----
  - id: ERR_HAZARD_FINDING_NOT_ELIGIBLE
    http: 422
    condition: "the finding named for immediate closure belongs to a different inspection or its severity is not IMMINENT_HAZARD"
  - id: ERR_POSTURE_FROZEN
    http: 409
    condition: "the Establishment's compliance_posture is FROZEN (non-operable licence status or demerit_balance >= 100.00) and the request would add capacity or personnel"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the presiding officer of a hearing is the same user as the inspector on the citation's inspection, or the acting X-User-ID recording a decision inspected that same inspection"
  - id: ERR_HAZARD_CLEARANCE_REINSPECTION_REQUIRED
    http: 422
    condition: "the clearing reinspection is not a FINALIZED REINSPECTION of this inspection, or its final_adjusted_score exceeds HAZARD_CLEARANCE_MAX_SCORE (10.00)"
  - id: ERR_DISINFECTANT_CONTACT_TIME_INSUFFICIENT
    http: 422
    condition: "contact_minutes is below the wet contact-time minimum for the log_type"
  - id: ERR_SANITATION_LOG_STATION_TYPE_MISMATCH
    http: 422
    condition: "the log_type is not a procedure the workstation's station_type supports"
  - id: ERR_WORKSTATION_POSTING_NONCOMPLIANT
    http: 409
    condition: "a sanitation log was recorded at a workstation whose posting_status is MISSING_POSTING or STALE_POSTING"
  # ---- business_temporal ----
  - id: ERR_BOOTH_RENTAL_OVERLAP
    http: 409
    condition: "the requested half-open rental term overlaps an existing PROPOSED or ACTIVE rental on the same workstation (touching endpoints are allowed)"
  - id: ERR_INSPECTION_WINDOW_OVERLAP
    http: 409
    condition: "the requested closed inspection window intersects a non-terminal inspection window on the same establishment (touching endpoints DO collide)"
  - id: ERR_INSPECTION_WINDOW_COOLDOWN
    http: 409
    condition: "a ROUTINE or COMPLAINT_DRIVEN window falls inside the symmetric 24-hour cooldown buffer around a non-terminal window on the same establishment; REINSPECTION is exempt"
  - id: ERR_FOOT_SPA_CYCLE_GAP_VIOLATION
    http: 409
    condition: "a foot-spa log starts before the previous cycle's occupancy_end_at plus the mandatory 5-minute gap"
  - id: ERR_CONTEST_WINDOW_EXPIRED
    http: 409
    condition: "the current logical clock is past Citation.contest_deadline_at"
  # ---- business_referential ----
  - id: ERR_PRACTITIONER_NOT_LINKED_TO_ESTABLISHMENT
    http: 422
    condition: "the named practitioner has no PROPOSED or ACTIVE booth rental on any workstation of the establishment in question"
  - id: ERR_WORKSTATION_NOT_IN_ESTABLISHMENT
    http: 422
    condition: "the finding's workstation_id names a workstation belonging to a different establishment than the inspection"
  - id: ERR_REINSPECTION_PARENT_REQUIRED
    http: 422
    condition: "reinspection_of_id is absent for a REINSPECTION, names an inspection on another establishment, is not FINALIZED, or its final_outcome is PASS"
  - id: ERR_SPONSOR_NOT_ELIGIBLE
    http: 422
    condition: "the apprentice sponsor is the subject themselves, is not an ACTIVE licensee, the named school's accreditation_status is WITHDRAWN, or the apprenticeship program is not board-approved for an APPRENTICE subject"
  - id: ERR_CITATION_SUBJECT_NOT_IN_FINDINGS
    http: 422
    condition: "the cited practitioner is not the attributed practitioner on any finding of the inspection, or an establishment-subject citation was issued against an inspection with zero findings"
  # ---- business_constraint ----
  - id: ERR_DUPLICATE_STATION_NUMBER
    http: 409
    condition: "another workstation of the same establishment already carries this station_number"
  - id: ERR_STATION_CAPACITY_EXCEEDED
    http: 409
    condition: "adding the workstation would push station_count above station_capacity"
  - id: ERR_HEARING_ROUNDS_EXHAUSTED
    http: 409
    condition: "the citation already has MAX_HEARING_ROUNDS (2) adjudication rounds"
  - id: ERR_EXAM_ELIGIBILITY_REQUIRED
    http: 409
    condition: "a licence was issued to a practitioner whose exam_eligible is false, or exam eligibility was granted with credited_hours_total below required_clock_hours_effective"
  - id: ERR_TRAINING_HOURS_INSUFFICIENT
    http: 422
    condition: "the candidate lacks a SANITATION or a DISINFECTION discipline record, or their school's accreditation_status is not ACCREDITED at the moment of the action"
  # ---- business_fiscal ----
  - id: ERR_PAYMENT_EXCEEDS_OUTSTANDING
    http: 422
    condition: "amount_cents is not strictly positive or exceeds the citation's outstanding_fine_cents"
  - id: ERR_OUTSTANDING_FINES_BLOCK_EXPANSION
    http: 402
    condition: "the establishment's delinquent_fine_total_cents is greater than 0 and the request would add capacity or personnel"

roles:
  - name: BoardAdmin
    description: "State cosmetology board staff. Owns the reference registries, licensing actions, board review of inspections, citation issuance and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /cosmetology/violation-codes"
      - "POST /cosmetology/schools"
      - "POST /cosmetology/practitioners/{id}/license-actions"
      - "POST /cosmetology/inspections/{id}/finalize"
      - "POST /cosmetology/inspections/{id}/hazard-clearance"
      - "POST /cosmetology/citations"
      - "POST /cosmetology/citations/{id}/hearings"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /cosmetology/practitioners and POST /cosmetology/training-records (with SchoolRegistrar)"
      - "POST /cosmetology/inspections, /start, /findings, /submit, /hazard-declaration (with Inspector)"
      - "POST /cosmetology/establishments and all establishment capacity writes (with EstablishmentOwner)"
      - "POST /cosmetology/hearings/{id}/decision (with HearingOfficer)"
      - "POST /cosmetology/infection-incidents/{id}/notification and /resolution (with HealthAuthorityLiaison)"
      - "every GET endpoint"
  - name: Inspector
    description: "Field inspector. Schedules and conducts inspections, records findings, declares imminent hazards and submits for board review, but may never finalize a review, issue a citation or adjudicate one."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /cosmetology/inspections"
      - "POST /cosmetology/inspections/{id}/start"
      - "POST /cosmetology/inspections/{id}/findings"
      - "POST /cosmetology/inspections/{id}/submit"
      - "POST /cosmetology/inspections/{id}/hazard-declaration"
      - "POST /cosmetology/infection-incidents"
      - "read access to establishments, practitioners, workstations, sanitation logs, booth rentals, inspections, findings, citations and incidents"
  - name: HearingOfficer
    description: "Adjudicator of contested citations. Records hearing decisions only, and never for a citation whose inspection they conducted."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /cosmetology/hearings/{id}/decision"
      - "read access to establishments, practitioners, inspections, findings, citations, hearings and the ledger"
  - name: EstablishmentOwner
    description: "Licensed establishment owner acting for their own salon. X-User-ID is the Establishment id, so every write is scoped to that establishment's own workstations, rentals, sanitation logs, citations and incidents."
    identity: "entity_backed:Establishment"
    exclusive_operations: []
    shared_operations:
      - "POST /cosmetology/establishments"
      - "POST /cosmetology/establishments/{id}/workstations"
      - "POST /cosmetology/workstations/{id}/posting"
      - "POST /cosmetology/booth-rentals, /activation, /termination"
      - "POST /cosmetology/sanitation-logs"
      - "POST /cosmetology/citations/{id}/contest and /payments"
      - "POST /cosmetology/infection-incidents"
      - "read access scoped to their own establishment"
  - name: Practitioner
    description: "Individual licensee or booth renter. X-User-ID is the Practitioner id. May terminate their own rental, log their own sanitation procedures, and contest or pay a citation naming them."
    identity: "entity_backed:Practitioner"
    exclusive_operations: []
    shared_operations:
      - "POST /cosmetology/booth-rentals/{id}/termination"
      - "POST /cosmetology/sanitation-logs"
      - "POST /cosmetology/citations/{id}/contest and /payments"
      - "read access to their own practitioner record, training records, rentals, workstations and citations"
  - name: SchoolRegistrar
    description: "Registrar of a licensed school. X-User-ID is the School id. Enrols candidates and files clock-hour records for candidates whose school_id equals that id."
    identity: "entity_backed:School"
    exclusive_operations: []
    shared_operations:
      - "POST /cosmetology/practitioners"
      - "POST /cosmetology/training-records"
      - "read access to their own school, its practitioners and their training records"
  - name: HealthAuthorityLiaison
    description: "Public-health authority liaison. Receives and closes infection incident investigations; has read-only visibility into establishments, sanitation logs and inspections."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /cosmetology/infection-incidents"
      - "POST /cosmetology/infection-incidents/{id}/notification"
