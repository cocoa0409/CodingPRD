  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # (1) Chair overlap WITH trailing turnover buffer
      - name: rto_chair_overlap_with_turnover_buffer
        grounds:
          - validations[priority=8]
          - entities.Chair.fields.turnover_buffer_minutes
          - errors[ERR_CHAIR_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Chair overlap uses [start, end + turnover_buffer_minutes) — a 45-min appointment
          ending at 645 reserves the chair through 655 (10-min buffer). A second booking
          starting at 650 is rejected (ERR_CHAIR_DOUBLE_BOOKED) even though raw service
          intervals [600,645) and [650,695) do not overlap. Buffer-extended interval
          semantics.
        test_recipe:
          setup:
            - "Chair with 10-min turnover; one BOOKED appointment [600,645) on it; same stylist on a separate chair is not the constraint."
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "S One", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty1: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "S Two", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty2: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M1", email: "m1ov@x.com" }
              as: FrontDesk
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M2", email: "m2ov@x.com" }
              as: FrontDesk
              captures: { m2: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${m1}", chair_id: "${chair_id}", stylist_id: "${sty1}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt1: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { member_id: "${m2}", chair_id: "${chair_id}", stylist_id: "${sty2}", style_service_id: "${svc_id}", start_minute: 650, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CHAIR_DOUBLE_BOOKED"
            - "http_status == 409"

      # (2) Stylist overlap WITHOUT buffer (back-to-back allowed) -> different semantics
      - name: rto_stylist_overlap_no_buffer_backtoback_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_STYLIST_DOUBLE_BOOKED]
          - entities.Stylist.fields.shift_start_minute
        distinguishing_aspect: |
          Stylist overlap uses bare [start, end) with NO buffer, so a stylist's second
          appointment starting exactly at the first's end_minute (645) is ACCEPTED
          (adjacency allowed), whereas an overlapping start (630 < 645) is rejected
          (ERR_STYLIST_DOUBLE_BOOKED) — different interval semantics (no buffer, adjacency
          permitted) on a different resource (Stylist) than the Chair-buffer rule.
        test_recipe:
          setup:
            - "A stylist with a BOOKED appointment [600,645) on Chair A; a second booking on Chair B for the same stylist starting at 630 overlaps."
          setup_api_calls:
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair A", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_a: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair B", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_b: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Solo Stylist", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M1", email: "m1sty@x.com" }
              as: FrontDesk
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { full_name: "M2", email: "m2sty@x.com" }
              as: FrontDesk
              captures: { m2: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${m1}", chair_id: "${chair_a}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt1: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { member_id: "${m2}", chair_id: "${chair_b}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 630, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STYLIST_DOUBLE_BOOKED"
            - "http_status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      # (1) Conserved: blowout credits — cancel refunds exactly what booking consumed
      - name: ci_credit_conservation_book_then_cancel
        grounds:
          - state_machines.Appointment.BOOKED_to_CANCELLED
          - calculations.blowout_credit_balance
          - entities.Member.fields.blowout_credit_balance
        distinguishing_aspect: |
          Invariant: Member.blowout_credit_balance after (book consuming 1 credit) then
          (cancel) equals the pre-booking balance exactly — conserved quantity is BLOWOUT
          CREDITS (integer count). A VIP member with 5 credits books (->4) then cancels
          (->5).
        test_recipe:
          setup:
            - "VIP member with 5 blowout credits; books a CREDIT appointment consuming 1 credit (balance 4)."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "VIP", monthly_fee_cents: 9900, included_blowout_credits: 5, member_discount_pct: 0.25 }
              as: FinanceManager
              captures: { plan_id: $.data.id }
            - call: "POST /style-services"
              payload: { name: "Classic Blowout", base_duration_minutes: 45, base_price_cents: 6000, blowout_credit_cost: 1 }
              as: FrontDesk
              captures: { svc_id: $.data.id }
            - call: "POST /chairs"
              payload: { label: "Chair 1", open_minute: 480, close_minute: 1200, turnover_buffer_minutes: 10 }
              as: FrontDesk
              captures: { chair_id: $.data.id }
            - call: "POST /stylists"
              payload: { full_name: "Sam Senior", commission_tier: "SENIOR", shift_start_minute: 480, shift_end_minute: 1200 }
              as: FrontDesk
              captures: { sty_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "VIP Member", email: "vip1@x.com", membership_plan_id: "${plan_id}" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /appointments"
              payload: { member_id: "${mem_id}", chair_id: "${chair_id}", stylist_id: "${sty_id}", style_service_id: "${svc_id}", start_minute: 600, payment_method: "CREDIT" }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: FrontDesk
          assert:
            - "Appointment.${appt_id}.credits_applied == 1"
            - "Member.${mem_id}.blowout_credit_balance == 5"

      # (2) Conserved: product stock units — sell then void restores stock exactly
      - name: ci_stock_conservation_sell_then_void
        grounds:
          - state_machines.RetailSale.SOLD_to_VOIDED
          - entities.Product.fields.stock_qty
          - calculations.retail_commission
        distinguishing_aspect: |
          Invariant: Product.stock_qty after (sell 3 units) then (void the sale) equals
          the original stock exactly — conserved quantity is PRODUCT STOCK UNITS (distinct
          from the blowout-credit invariant of instance 1). Stock 10 -> 7 -> 10.
        test_recipe:
          setup:
            - "A product with stock 10; a member; a SOLD sale of 3 units (stock now 7)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "CO-01", name: "Conditioner", unit_price_cents: 2500, initial_stock: 10, retail_commission_pct: 0.10 }
              as: FrontDesk
              captures: { prod_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Buyer", email: "buyer2@x.com" }
              as: FrontDesk
              captures: { mem_id: $.data.id }
            - call: "POST /retail-sales"
              payload: { product_id: "${prod_id}", member_id: "${mem_id}", quantity: 3 }
              as: FrontDesk
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /retail-sales/${sale_id}/void"
              payload: {}
              as: FrontDesk
          assert:
            - "RetailSale.${sale_id}.status == VOIDED"
            - "Product.${prod_id}.stock_qty == 10"

  # ===========================================================================
  # Optimistic concurrency (cross-references §1.2.1) — surfaced here as a 10th
  # rule_id group is NOT required by §0.5; OCC is covered via §1.9. The two
  # §1.2.1 races are exercised by corner instances. (No extra block needed.)
