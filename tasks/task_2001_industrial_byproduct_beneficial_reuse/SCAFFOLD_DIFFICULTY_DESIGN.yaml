            - "OfftakeCommitment.${k_id}.status == ACTIVE"
            - "SupplyAgreement.${a_id}.delivered_month_to_date_tons == 20.0"

      - name: eligibility_deny_revise_and_suspend_reinstate_cycles
        grounds:
          - state_machines.ReuseEligibility.SUBMITTED_to_DENIED
          - state_machines.ReuseEligibility.DENIED_to_DRAFT
          - state_machines.ReuseEligibility.SUSPENDED_to_APPROVED
        distinguishing_aspect: |
          ReuseEligibility is cyclic on a different entity than Shipment: SUBMITTED -> DENIED ->
          DRAFT -> SUBMITTED -> APPROVED (revision loop) and APPROVED -> SUSPENDED -> APPROVED
          (suspension loop), with decision_reason cleared on revise.
        test_recipe:
          setup:
