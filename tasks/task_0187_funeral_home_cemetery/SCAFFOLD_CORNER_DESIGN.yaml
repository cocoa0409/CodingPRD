              as: Arranger
              as_user_id: "arr-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/acknowledge-disclosure"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/statement-lines"
              payload: { gpl_item_id: "${svc_item_id}", quantity: 1 }
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /cases/${case_id}/contract"
              payload: { funding_type: "AT_NEED_DIRECT" }
              as: Arranger
              as_user_id: "arr-1"
              captures: { contract_id: $.data.id }
            - call: "POST /cases/${case_id}/issue-gfs"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "POST /contracts/${contract_id}/trust-deposits"
              payload: { kind: "PRINCIPAL", amount_cents: 60000 }
              as: TrustOfficer
              as_user_id: "to-1"
            - call: "POST /contracts/${contract_id}/submit-for-funding"
              payload: {}
              as: Arranger
              as_user_id: "arr-1"
            - call: "GET /contracts/${contract_id}"
              payload: {}
              as: TrustOfficer
              as_user_id: "to-1"
              captures: { c_v0: $.data.version }
            - call: "POST /contracts/${contract_id}/trust-deposits"
              payload: { kind: "PRINCIPAL", amount_cents: 40000 }
              as: TrustOfficer
