# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rules × 2 instances = 18 instances.
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: session_charge_contracted_vs_standard
        grounds:
          - calculations.session_charge
          - entities.Patient.fields.payer_class
          - entities.TreatmentSession.fields.billed_amount_cents
          - state_machines.TreatmentSession.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: "Same modality+order inputs (HEMODIALYSIS, epo=0, iron=false → gross 28500) yield billed_amount_cents=23370 for a CONTRACTED patient but 28500 for a STANDARD patient; the variant lives on TreatmentSession charge accounting."
        test_recipe:
          setup:
            - "Clinic OPEN; one ACTIVE HEMODIALYSIS order each for a CONTRACTED patient and a STANDARD patient; a station+machine; clock at 2026-06-01 (Mon, MWF date)."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "Riverside", dialyzer_reuse_limit: 12 }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "M1", model: "Fresenius", supports_hdf: false }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "C1", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { sid: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "MON_AM", day_pattern: "MWF", start_minute: 360, end_minute: 600 }
              as: ClinicAdmin
              captures: { shid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "P-CON", full_name: "Con Patient", payer_class: "CONTRACTED", coinsurance_pct: 0.0 }
              as: Scheduler
              captures: { pcon: $.data.id, pcon_v: $.data.version }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "P-STD", full_name: "Std Patient", payer_class: "STANDARD", coinsurance_pct: 0.0 }
              as: Scheduler
              captures: { pstd: $.data.id, pstd_v: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${pcon}", modality: "HEMODIALYSIS", epo_units: 0, iron_ordered: false, effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { ocon: $.data.id }
            - call: "POST /orders/${ocon}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /orders"
              payload: { patient_id: "${pstd}", modality: "HEMODIALYSIS", epo_units: 0, iron_ordered: false, effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { ostd: $.data.id }
            - call: "POST /orders/${ostd}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /sessions"
              payload: { patient_id: "${pcon}", order_id: "${ocon}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${pcon_v}" }
              as: Scheduler
              captures: { scon: $.data.id }
            - call: "POST /sessions/${scon}/check-in"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /sessions/${scon}/complete"
              payload: {}
              as: Scheduler
              captures: { con_billed: $.data.billed_amount_cents }
          assert:
            - "TreatmentSession.${scon}.billed_amount_cents == 23370"
            - "A STANDARD patient completing the identical HEMODIALYSIS session yields billed_amount_cents == 28500 (variant delta 5130)"

      - name: adherence_rolling_vs_cumulative
        grounds:
          - calculations.patient_adherence_score
          - entities.Patient.fields.adherence_status
          - state_machines.TreatmentSession.BOOKED_to_MISSED
          - state_machines.TreatmentSession.CHECKED_IN_to_COMPLETED
        distinguishing_aspect: "Over the same 11 qualifying (COMPLETED|MISSED) sessions the cumulative variant returns 72.7 while the rolling-8 variant returns 71.4; the variant lives on Patient adherence, a different entity domain than session_charge."
        test_recipe:
          setup:
            - "One RESIDENT patient with 12 terminal sessions in service_date order C,C,M,C,(CANCELLED),M,C,C,M,C,C,C across distinct MWF/TTHS dates; CANCELLED excluded from both variant denominators."
            - "Sessions are completed/missed/cancelled via the clinical axis; adherence read via GET adherence."
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "AdhClinic", dialyzer_reuse_limit: 99 }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T08:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "AM1", model: "Baxter", supports_hdf: false }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "AC1", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { sid: $.data.id }
            - call: "POST /shifts"
