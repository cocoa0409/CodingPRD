            - "st_end == EXPIRED and pnl == 0 and exitp == 19000 (expiry settles at entry on the first day of the contract month)"

      - name: provisional_cog_projection_formula
        claim_type: correct_result
        grounds: [calculations.cost_of_gain]
        excluded_because:
          difficulty_instance: cog_provisional_vs_final_diverge
          rationale: "The §1.8 instance pins the provisional variant's literal (2530392.16) mid-lifecycle and the final variant's literal at confirm."

  # ===========================================================================
  - section: validations
    instances:
      - name: request_missing_required_field_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Request-shape validation: POST /feedlot/owners without billing_email fails with ERR_INVALID_REQUEST (400) before any business rule runs."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-NOFIELD" }
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A call with no X-User-Role/X-User-ID headers fails at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /feedlot/pens"
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400; no role/user headers sent)"

      - name: claim_above_loss_value_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_CLAIM_EXCEEDS_LOSS_VALUE]"]
        distinguishing_aspect: "Fiscal cap: claimed_amount_cents 140001 exceeds the loss's computed loss_value_cents 140000 by one cent -> ERR_CLAIM_EXCEEDS_LOSS_VALUE (422)."
        test_recipe:
          setup: ["Lot L-V1 (5 steers, purchase 700000c, no accrued costs); insured death loss of 1 head on 2026-08-01 -> loss value 140000c"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-V1", billing_email: "v1@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-V1", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-01", head_count: 1, cause: "RESPIRATORY", insured: true }
              as: CattleHealthTech
              captures: { d_id: $.data.id, d_value: $.data.loss_value_cents }
          trigger:
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 140001 }
              as: CattleHealthTech
              captures: { err: $.data.error_id }
          assert:
            - "d_value == 140000"
            - "err == ERR_CLAIM_EXCEEDS_LOSS_VALUE (http 422; claimed == loss value would be allowed, +1 is not)"

      - name: claim_on_uninsured_loss_rejected
        claim_type: conditional_validation
        grounds: ["validations[priority=11]", "errors[ERR_DEATH_LOSS_NOT_INSURED]"]
        distinguishing_aspect: "Conditional on the loss's insured flag: claim filing against an uninsured loss fails with ERR_DEATH_LOSS_NOT_INSURED."
        test_recipe:
          setup: ["Lot L-V2 with an uninsured death loss (insured=false)"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-V2", billing_email: "v2@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-V2", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-01", head_count: 1, cause: "RESPIRATORY", insured: false }
              as: CattleHealthTech
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 100000 }
              as: CattleHealthTech
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DEATH_LOSS_NOT_INSURED"

      - name: second_claim_on_same_loss_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_CLAIM_ALREADY_EXISTS]"]
        distinguishing_aspect: "Aggregate uniqueness: at most one InsuranceClaim per DeathLoss, regardless of the first claim's state."
        test_recipe:
          setup: ["Lot L-V3 with insured death loss (value 140000c) and an existing UNDER_REVIEW claim"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-V3", billing_email: "v3@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-V3", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-01", head_count: 1, cause: "RESPIRATORY", insured: true }
              as: CattleHealthTech
              captures: { d_id: $.data.id }
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 100000 }
              as: CattleHealthTech
          trigger:
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 50000 }
              as: CattleHealthTech
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CLAIM_ALREADY_EXISTS"

      - name: step_up_first_assignment_must_be_step_one_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_STEP_UP_VIOLATION]"]
        distinguishing_aspect: "Step-up rule at the boundary of program start: a lot's FIRST ration assignment must be step_level 1; starting at step 2 fails with ERR_STEP_UP_VIOLATION."
        test_recipe:
          setup: ["Lot L-V4 OPEN; ration R-V4 at step_level 2"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-V4", billing_email: "v4@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/rations"
              payload: { ration_name: "R-V4", step_level: 2, cost_per_ton_cents: 22000 }
              as: FeedManager
              captures: { r_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-V4", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /feedlot/ration-assignments"
              payload: { lot_id: "${l_id}", ration_id: "${r_id}", start_date: "2026-08-01", end_date: "2026-08-15" }
              as: FeedManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STEP_UP_VIOLATION"

      - name: over_assignment_beyond_lot_head_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority=11]", "errors[ERR_OVER_ASSIGNMENT]"]
        distinguishing_aspect: "Aggregate validation: each assignment is individually legal, but 6 + 6 head across two pens exceeds the lot's head_count_current of 10 -> ERR_OVER_ASSIGNMENT."
        test_recipe:
          setup: ["Lot L-V5 (10 steers); pens V-01 and V-02; first assignment of 6 head to V-01 succeeded"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-V5", billing_email: "v5@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "V-01", capacity_head: 100 }
              as: FeedyardManager
              captures: { p1: $.data.id }
            - call: "POST /feedlot/pens"
              payload: { pen_code: "V-02", capacity_head: 100 }
              as: FeedyardManager
              captures: { p2: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-V5", sex_class: "STEER", head_count_in: 10, in_weight_total_lbs: 7000, purchase_cost_cents: 1400000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p1}", lot_id: "${l_id}", head_count: 6, start_date: "2026-08-01" }
              as: FeedyardManager
          trigger:
            - call: "POST /feedlot/assignments"
              payload: { pen_id: "${p2}", lot_id: "${l_id}", head_count: 6, start_date: "2026-08-01" }
              as: FeedyardManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OVER_ASSIGNMENT (12 > 10 head_count_current)"

      - name: future_loss_date_uses_default_clock_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=3]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "Proves the fixed startup clock: with no set_current_utc call, the logical date is exactly 2026-08-01, so a death loss dated 2026-08-02 is future-dated and fails with ERR_INVALID_REQUEST — deterministic regardless of wall-clock time."
        test_recipe:
          setup: ["Lot L-V6 OPEN, arrival 2026-08-01; the logical clock has NOT been set (startup default 2026-08-01T00:00:00Z)"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-V6", billing_email: "v6@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-V6", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-02", head_count: 1, cause: "RESPIRATORY", insured: false }
              as: CattleHealthTech
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (loss_date 2026-08-02 is after the default logical date 2026-08-01)"

      - name: health_event_on_marketed_lot_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_LOT_NOT_OPEN]"]
        distinguishing_aspect: "Treatment recording requires the lot OPEN: once MARKETED, cattle may no longer be doctored into the record — ERR_LOT_NOT_OPEN."
        test_recipe:
          setup: ["Lot L-V7 (5 head) is MARKETED"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-V7", billing_email: "v7@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-V7", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/lots/${l_id}/market"
              as: FeedyardManager
          trigger:
            - call: "POST /feedlot/health-events"
              payload: { lot_id: "${l_id}", treatment_date: "2026-08-01", drug_product: "DRAXXIN", withdrawal_days: 0, head_treated: 1, treatment_cost_cents: 500 }
              as: CattleHealthTech
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_LOT_NOT_OPEN"

