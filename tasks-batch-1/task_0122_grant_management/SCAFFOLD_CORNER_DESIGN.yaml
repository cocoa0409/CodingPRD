            - "close response data.closeout_unobligated_cents == 19000000"

      - name: indirect_tdc_base_includes_equipment_no_exclusions
        claim_type: Variant Selection
        grounds:
          - calculations.indirect_cost_recovery
          - entities.IndirectCostRate.fields.base_type
          - entities.FinancialReport.fields.indirect_cost_cents
        distinguishing_aspect: |
          base_type TDC variant: the rate applies to the full direct_total with NO equipment/subaward
          exclusion. Lines PERSONNEL 10000000 + EQUIPMENT 5000000 with NEGOTIATED 0.20 over TDC yield
          indirect_cost_cents == round_half_up(0.20 * 15000000) == 3000000 (vs 2000000 if MTDC had excluded equipment).
        test_recipe:
          setup:
            - "ACTIVE Award; NEGOTIATED 0.20 rate with base_type TDC; DRAFT INTERIM report with PERSONNEL 10000000 and EQUIPMENT 5000000."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C22", applicant_org_name: "Corner Org 22", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c22_app_id: $.data.id }
            - call: "POST /applications/${c22_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c22_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c22_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c22_award_id: $.data.id, c22_v0: $.data.version }
            - call: "POST /indirect-cost-rates"
              payload: { award_id: "${c22_award_id}", rate_type: "NEGOTIATED", negotiated_rate: 0.20, base_type: "TDC", expected_award_version: "${c22_v0}" }
              as: FinanceOfficer
            - call: "POST /financial-reports"
              payload: { award_id: "${c22_award_id}", period_label: "FY2026-Q1", report_basis: "INTERIM", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 10000000 }, { category: "EQUIPMENT", amount_cents: 5000000 } ] }
              as: FinanceOfficer
              captures: { c22_fr_id: $.data.id }
            - call: "POST /financial-reports/${c22_fr_id}/certify"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /financial-reports/${c22_fr_id}/accept"
              payload: {}
              as: AgencyOfficer
              captures: { c22_indirect: $.data.indirect_cost_cents }
          assert:
            - "FinancialReport.${c22_fr_id}.indirect_cost_cents == 3000000"
            - "FinancialReport.${c22_fr_id}.approved_direct_cents == 15000000"

      - name: single_audit_threshold_above_boundary_at_one_dollar_over
        claim_type: Constants Applied
        grounds:
          - calculations.single_audit_threshold
          - entities.SingleAudit.fields.federal_expenditures_cents
          - entities.SingleAudit.fields.audit_required
        distinguishing_aspect: |
          The SINGLE_AUDIT_THRESHOLD_CENTS constant (75000000) is applied: federal_expenditures_cents
          75000100 (well above) -> audit_required true. This exercises the constant on the above-threshold
          side, complementing the §1.8 exact-boundary pair at 75000000 / 74999999.
        test_recipe:
          setup:
            - "An ACTIVE Award; a SingleAudit created at expenditures 75000100."
