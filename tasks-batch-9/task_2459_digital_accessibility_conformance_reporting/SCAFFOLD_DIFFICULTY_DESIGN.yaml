      - name: complaint_fork_join_branches_carry_different_side_effects
        grounds:
          - state_machines.Complaint.TRIAGED_to_LINKED
          - state_machines.Complaint.TRIAGED_to_ACCOMMODATED
          - state_machines.Complaint.LINKED_to_CLOSED
          - state_machines.Complaint.ACCOMMODATED_to_CLOSED
        distinguishing_aspect: |
          Non-linearity instance 3 of 3, on a third entity (Complaint): a fork-join where TRIAGED
          splits by route into LINKED and ACCOMMODATED with disjoint side-effect sets — the
          REMEDIATION branch writes linked_issue_id and bumps KnownIssue.linked_complaint_count,
          the ACCOMMODATION branch writes accommodation_fulfilled_at and bumps
          Product.accommodations_fulfilled_count — and both join at CLOSED.
        test_recipe:
          setup:
            - "One product and component; one MINOR known issue that has been triaged and then DEFERRED by the prioritization board"
            - "Complaint A is TRIAGED on the REMEDIATION route; complaint B is TRIAGED on the ACCOMMODATION route with needed_by_date 2026-09-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
