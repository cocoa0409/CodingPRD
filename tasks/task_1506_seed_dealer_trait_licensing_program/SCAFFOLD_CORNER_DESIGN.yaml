              payload: { program_id: "${prog}", variety_id: "${v2}", field_id: "${f1}", planting_date: "2027-04-15T00:00:00Z", expected_harvest_date: "2027-10-01T00:00:00Z", replication_index: 1 }
              as: Agronomist
              captures: { p1: $.data.id }
            - call: "POST /dealer/plot-trials/${p1}/record_planting"
              as: Agronomist
            - call: "POST /dealer/plot-trials/${p1}/record_harvest"
              payload: { yield_bu_per_acre: 64.2, moisture_pct: 13.1 }
              as: Agronomist
            - call: "POST /dealer/plot-trials"
              payload: { program_id: "${prog}", variety_id: "${v2}", field_id: "${f2}", planting_date: "2027-04-20T00:00:00Z", expected_harvest_date: "2027-10-05T00:00:00Z", replication_index: 2 }
              as: Agronomist
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /dealer/plot-trials/${p1}/publish"
              as: Agronomist
              captures: { err: $.data.error_id }
            - call: "POST /dealer/plot-trials/${p2}/record_planting"
              as: Agronomist
            - call: "POST /dealer/plot-trials/${p2}/record_harvest"
              payload: { yield_bu_per_acre: 61.8, moisture_pct: 13.4 }
              as: Agronomist
            - call: "POST /dealer/plot-trials/${p1}/publish"
              as: Agronomist
              captures: { p1_st: $.data.status }
          assert:
