# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted, or Customer X-User-ID does not match Order.customer_id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Field shape/range violation (window inversion, quantity < 1, non-positive multiplier, unknown enum)" }
  - { id: ERR_STORE_DAY_NOT_FOUND, http: 404, condition: "StoreDay id does not exist" }
  - { id: ERR_DAYPART_NOT_FOUND, http: 404, condition: "Daypart id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id does not exist" }
  - { id: ERR_PRODUCTION_RUN_NOT_FOUND, http: 404, condition: "ProductionRun id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "Dough or cheese batch id does not exist" }
  - { id: ERR_LOCKER_SLOT_NOT_FOUND, http: 404, condition: "LockerSlot id does not exist" }
  - { id: ERR_CREW_SHIFT_NOT_FOUND, http: 404, condition: "CrewShift id does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "DemandEvent id does not exist" }
  - { id: ERR_HOLD_UNIT_NOT_FOUND, http: 404, condition: "HoldUnit id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state that permits this transition" }
  - { id: ERR_NO_DAYPARTS_DEFINED, http: 409, condition: "open requires at least one PLANNED daypart" }
  - { id: ERR_DAYPARTS_STILL_ACTIVE, http: 409, condition: "close requires every daypart CLOSED" }
  - { id: ERR_LOCKER_SLOTS_OCCUPIED, http: 409, condition: "store-day close requires no OCCUPIED locker slots" }
  - { id: ERR_RUNS_IN_PROGRESS, http: 409, condition: "daypart close blocked by BAKING runs" }
  - { id: ERR_DAYPART_NOT_ACTIVE, http: 409, condition: "Operation requires daypart status ACTIVE" }
  - { id: ERR_PREORDER_DAYPART_NOT_PLANNED, http: 409, condition: "PORTAL_PREORDER order creation requires daypart status PLANNED" }
  - { id: ERR_PREORDER_DAYPART_NOT_ACTIVE, http: 409, condition: "start-preparation of a preorder requires the promised daypart ACTIVE" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "start-preparation of a portal order requires payment_status PAID" }
  - { id: ERR_DAYPART_RESTRICTED, http: 409, condition: "Daypart posture RESTRICTED (store waste_pct_standard >= target) gates start-preparation" }
  - { id: ERR_DAYPART_WINDOW_OVERLAP, http: 409, condition: "New daypart window overlaps an existing daypart of the same store day (half-open semantics)" }
  - { id: ERR_EVENT_WINDOW_OVERLAP, http: 409, condition: "New demand event window intersects an existing non-cancelled event of the same store day (closed semantics; adjacency counts)" }
  - { id: ERR_EVENT_NOT_CANCELLABLE, http: 409, condition: "Only SCHEDULED events (clock < window_start_at) may be cancelled" }
  - { id: ERR_SHIFT_CONFLICT, http: 409, condition: "Crew member double-booked, or station capacity (1 per station) exceeded for the window" }
  - { id: ERR_BATCH_STATE, http: 409, condition: "Batch advance called from a state with no forward transition" }
  - { id: ERR_PROOF_NOT_READY, http: 409, condition: "clock < proofing_started_at + 120 minutes" }
  - { id: ERR_CHEESE_NOT_READY, http: 409, condition: "clock < prepped_at + 30 minutes" }
  - { id: ERR_DOUGH_UNAVAILABLE, http: 409, condition: "Dough batch not PROOFED or remaining_units < quantity" }
  - { id: ERR_CHEESE_UNAVAILABLE, http: 409, condition: "Cheese batch not READY or remaining_units < quantity" }
  - { id: ERR_RACK_CAPACITY_EXCEEDED, http: 409, condition: "Racking would exceed daypart rack_capacity" }
  - { id: ERR_NO_LOCKER_AVAILABLE, http: 409, condition: "No IDLE locker slot in the store day at mark-ready" }
  - { id: ERR_NOT_PORTAL_ORDER, http: 409, condition: "claim on a COUNTER order" }
  - { id: ERR_PICKUP_CODE_INVALID, http: 409, condition: "pickup_code does not match" }
  - { id: ERR_PICKUP_CODE_EXPIRED, http: 409, condition: "clock > code_expires_at" }
  - { id: ERR_INVALID_DISCARD_REASON, http: 400, condition: "Manual discard reason not in {DAMAGED, QUALITY}" }
  - { id: ERR_PROMO_PRICE_INVALID, http: 422, condition: "promo_price_cents present but >= list_price_cents" }
  - { id: ERR_PROMO_PRICE_LOCKED, http: 409, condition: "promo_price_cents change attempted while product is referenced by a non-CLOSED run of an OPEN store day" }
  - { id: ERR_CUSTOMIZATION_NOT_ALLOWED, http: 422, condition: "Order line customized=true for a product with customization_allowed=false" }
  - { id: ERR_DUPLICATE_BUSINESS_DATE, http: 409, condition: "StoreDay business_date already exists" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Product sku already exists" }
  - { id: ERR_DUPLICATE_SLOT_NUMBER, http: 409, condition: "LockerSlot slot_number already exists for the store day" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the current version (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: StoreManager
    description: "Owns store-day lifecycle, products, demand events, locker installation, daypart planning; superset visibility"
    identity: opaque
    exclusive_operations:
      - "POST /store-days, PUT /store-days/{id}, open/close/reconcile"
      - "POST /store-days/{id}/dayparts, PUT /dayparts/{id}"
      - "POST /store-days/{id}/demand-events, POST /demand-events/{id}/cancel"
      - "POST /products, PUT /products/{id}"
      - "POST /store-days/{id}/locker-slots"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: ShiftLead
    description: "Runs the shift: plans production runs, closes dayparts, discards units, ends crew shifts, places counter orders"
    identity: opaque
    exclusive_operations:
      - "POST /dayparts/{id}/production-runs"
      - "POST /dayparts/{id}/close"
      - "POST /hold-units/{id}/discard"
      - "POST /store-days/{id}/crew-shifts, POST /crew-shifts/{id}/end"
    shared_operations:
      - "POST /orders (COUNTER kind placement on behalf of walk-ins)"
      - "All GET endpoints"
  - name: CrewMember
    description: "Works stations: mixes/proofs batches, bakes and racks runs, prepares and readies orders"
    identity: opaque
    exclusive_operations:
      - "POST /store-days/{id}/dough-batches, POST /dough-batches/{id}/advance"
      - "POST /store-days/{id}/cheese-batches, POST /cheese-batches/{id}/advance"
      - "POST /production-runs/{id}/start-baking, POST /production-runs/{id}/rack"
      - "POST /orders/{id}/start-preparation, POST /orders/{id}/mark-ready"
    shared_operations:
      - "All GET endpoints"
  - name: Customer
    description: "Portal customer; X-User-ID is an opaque customer handle that must equal the Order.customer_id supplied at order creation for order-scoped calls"
    identity: opaque
    exclusive_operations:
      - "POST /orders (portal kinds)"
      - "POST /orders/{id}/pay, /claim, /cancel (own orders only)"
    shared_operations:
      - "GET /orders/{id}, GET /orders (own orders), GET /store-days, GET /products, GET dayparts"
