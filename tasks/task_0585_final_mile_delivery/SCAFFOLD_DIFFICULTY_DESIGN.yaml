  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: route_weight_capacity_boundary
        grounds:
          - validations[priority=12]
          - calculations.route_load_reconciliation
          - entities.DeliveryTeam.fields.max_daily_weight_lbs
        distinguishing_aspect: |
          At the route weight boundary on POST /routes/{routeId}/stops: adding a stop bringing
          committed_weight to exactly 500 (== max_daily_weight_lbs) succeeds, but the next stop
          pushing it to 501 (> 500) is rejected with ERR_ROUTE_WEIGHT_EXCEEDED — strict
          committed+new > max.
        test_recipe:
          setup:
            - "Team max_daily_weight_lbs 500; a PLANNING route already carries order1 (300) and order2 (200) so committed_weight == 500; order3 (weight 1) is SCHEDULED with a matching window."
          setup_api_calls:
