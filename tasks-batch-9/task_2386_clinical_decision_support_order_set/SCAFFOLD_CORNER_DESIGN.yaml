              as: CommitteeChair
              as_user_id: "${chair_id}"
              captures: { score: $.data.priority_score, status: $.data.status }
          assert:
            - "HTTP 200"
            - "${intake_score} == 30.00"
            - "${status} == TRIAGE_ACCEPTED and triaged_at == \"2026-08-01T00:00:00Z\""
            - "${score} == 6.00 (min(40, 6 * 1 peer-reviewed citation) plus 0 urgency plus 0 safety, multiplied by 1 + 0 backlog age)"
            - "ContentRequest.version == 2"

