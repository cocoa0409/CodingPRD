              as: ComplianceManager
              captures: { p3_first: "$.data[0].id", p3_second: "$.data[1].id" }
            - call: "GET /leak-events?status=VERIFIED_CLOSED&limit=2&offset=0"
              payload: {}
              as: ComplianceManager
          assert:
            - "page 1 (offset 0) returns exactly [${e1}, ${e2}] with total_count 5 and has_more true, read BEFORE the sixth event exists"
            - "page 2 (offset 2), read AFTER the insert, returns exactly [${e3}, ${e4}] - no row is duplicated from page 1 and none is skipped"
            - "page 2 reports total_count 6 and has_more true, so the count reflects the insert while the window does not"
            - "page 3 (offset 4) returns exactly [${e5}, ${e6}] with total_count 6 and has_more false - the appended row lands last, never in the middle"
            - "the VERIFIED_CLOSED filter returns an empty data array with total_count 0 and has_more false, and Store.${store_id}.open_leak_event_count == 6"

      - name: full_cascade_from_a_second_failed_verification_down_to_penalty_exposure
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.LeakEvent.VERIFICATION_FAILED_to_RETROFIT_MANDATED
        excluded_because:
          difficulty_instance: second_failed_verification_cascades_event_system_store_and_penalty
          rationale: "That §1.8 transitive-cascade instance already walks the four-level chain end to end - event to RETROFIT_MANDATED, system to RETROFIT_MANDATED with retrofit_due_on stamped, store to NON_COMPLIANT, and every open inspection repriced at the 1.50 multiplier - with the intermediate levels asserted individually."
      - name: both_leak_rate_variants_produce_their_declared_results
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.system_leak_rate_pct.variants
        excluded_because:
          difficulty_instance: leak_rate_rolling_average_vs_annualizing_diverge_on_one_system
          rationale: "The layer's claim is that both variants compute correctly over the same ledger and that the delta is right; that instance asserts 10.0 against 40.6 on twin systems, which is the layer claim in full."

      - name: leak_rate_threshold_is_evaluated_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.system_leak_rate_pct.constants.LEAK_THRESHOLDS
        excluded_because:
          difficulty_instance: leak_rate_exactly_at_threshold_opens_event_on_service_record
          rationale: "That boundary-precision instance drives 19.9 / 20.0 through the same 100 lb COMMERCIAL_REFRIGERATION system and asserts the event opens only at 20.0, which is exactly the instantaneous-threshold boundary claim for this layer."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_value_is_already_settled_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.RefrigerantSystem.fields.leak_rate_pct
          - entities.Store.fields.compliance_status
          - entities.Inspection.fields.penalty_exposure_usd
        distinguishing_aspect: "No read-after-write lag anywhere in the cascade: the system create response already carries applicability / required_certification_type / threshold, the service-record response already names the LeakEvent it opened, and the inspection created one instant later is already priced at the AT_RISK multiplier - so a correct implementation needs no second request, no background job and no compliance run to settle any denormalised field."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, one UNIVERSAL technician, one HIGH-certified machine, one cylinder holding 40.0 lb. A single 100 lb system is created and then charged with 20.0 lb, which lands the rolling leak rate exactly on the 20.0 percent COMMERCIAL threshold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id, store_status_at_create: $.data.compliance_status }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Marek Olsen", epa_certification_number: "EPA-608-22222", certification_type: "UNIVERSAL", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech2_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
          trigger:
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id, sys_applicability: $.data.applicability, sys_req_cert: $.data.required_certification_type, sys_threshold: $.data.threshold_pct, sys_charge_at_create: $.data.current_charge_lbs, sys_v: $.data.version }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: ComplianceManager
              captures: { store_charge_after_system: $.data.total_regulated_charge_lbs, store_regulated_after_system: $.data.regulated_system_count }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech2_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id, eq1_status: $.data.status }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech2_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 20.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 60, expected_system_version: "${sys_v}" }
              as: Technician
              as_user_id: "${tech2_id}"
              captures: { rec1_id: $.data.id, rec1_rate_after: $.data.leak_rate_pct_after, rec1_charge_after: $.data.system_charge_after_lbs, rec1_retention: $.data.retention_until }
            - call: "GET /leak-events?triggering_service_record_id=${rec1_id}"
              payload: {}
              as: ComplianceManager
              captures: { ev_id: "$.data[0].id", ev_status: "$.data[0].status", ev_deadline: "$.data[0].repair_deadline" }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys_rate: $.data.leak_rate_pct, sys_charge: $.data.current_charge_lbs, sys_state: $.data.compliance_state }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: ComplianceManager
              captures: { store_status: $.data.compliance_status, store_open_events: $.data.open_leak_event_count }
            - call: "POST /inspections"
              payload: { store_id: "${store_id}", inspector_name: "Inspector Vale", citations: [ { citation_code: "608-LEAK-REC", severity: "MINOR", violation_days: 1 } ] }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { insp_id: $.data.id, insp_penalty: $.data.penalty_exposure_usd, insp_multiplier: $.data.chronic_multiplier_applied }
          assert:
            - "the system create response itself already carries applicability REGULATED, required_certification_type TYPE_II, threshold_pct 20.0, current_charge_lbs 80.0 and version 1 - no follow-up read is needed"
            - "the store read immediately after the system create shows total_regulated_charge_lbs 80.0 and regulated_system_count 1"
            - "the service-record response already carries leak_rate_pct_after 20.0, system_charge_after_lbs 100.0 and retention_until 2029-08-01T00:00:00Z in the same response body"
            - "the very next reads show LeakEvent status OPEN with repair_deadline 2026-08-31T00:00:00Z, system leak_rate_pct exactly 20.0 with current_charge_lbs 100.0 and compliance_state LEAK_OPEN, and Store compliance_status AT_RISK with open_leak_event_count 1"
            - "the inspection created one instant later is already priced at penalty_exposure_usd 344.44 with chronic_multiplier_applied 1.25 (275.55 x 1.25 = 344.4375 rounded half-up), and Store.penalty_exposure_total_usd reads 344.44 with no compliance run in between"
            - "POST /compliance-runs immediately afterwards changes nothing: stores_recomputed_count 0 and every value above is unchanged, proving the sweep is for deadlines only and not for settling denormalised state"
