              captures: { oh_over_error: $.error.error_id }
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${oh_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 250000 }
              as: SponsorOperator
              captures: { oh_at_id: $.data.id, oh_at_status: $.data.status }
          assert:
            - "tx_basis_limit == 260000 (floor(2600000 * 1000 / 10000) on the net-worth basis)"
            - "oh_basis_limit == 250000 (floor(2500000 * 1000 / 10000): OH is a strict state, so the basis is the lesser of 2600000 and 2500000)"
            - "tx_over_error == \"ERR_CONCENTRATION_LIMIT_EXCEEDED\" with response http status == 422"
            - "tx_at_status == \"PENDING\" with response http status == 201 (260000 is exactly at the limit, and 260000 >= the 250000 first-ticket minimum, so no gate fires)"
