            - { call: "POST /records/requesters", payload: { full_name: "Pat Public", email: "pat@example.org", requester_type: "GENERAL_PUBLIC" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { requester_id: $.data.id } }
            - { call: "POST /records/video-assets", payload: { incident_number: "INC-2026-0658", device_serial: "AXON-0658", officer_badge: "B-1155", recorded_start_at: "2026-07-06T09:00:00Z", duration_ms: 1800000, classification: "ROUTINE", retention_category: "INVESTIGATIVE_3Y", scheduled_purge_at: "2029-07-06T00:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { asset_id: $.data.id } }
            - { call: "POST /records/requests", payload: { requester_id: "${requester_id}", received_at: "2026-08-01T00:00:00Z", subject_incident_number: "INC-2026-0658", requested_date_from: "2026-07-06T00:00:00Z", requested_date_to: "2026-07-07T00:00:00Z", scope_narrative: "Half an hour of BWC video" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { req_id: $.data.id, req_v1: $.data.version } }
            - { call: "POST /records/requests/${req_id}/scope-clarification", payload: { scope_narrative: "The single half-hour recording", requested_date_from: "2026-07-06T00:00:00Z", requested_date_to: "2026-07-06T23:59:59Z", expected_request_version: "${req_v1}" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
