    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: BuildShipOrder[]
    side_effects: []

  # --- WorkshopSession ---
  - method: POST
    path: "/workshops"
    description: "Start a workshop session (WALK_IN; PARTY/BUILD_SHIP sessions are created by their parent flows)"
    roles: [WorkshopAssociate]
    code: 201
    input: [store_id, customer_id, plush_model_id, origin_type, "collection_drop_id?", "party_reservation_id?", "build_ship_order_id?"]
    output: WorkshopSession
    side_effects:
      - "status initialized to SELECT"
      - "Walk-in admission: walkin_capacity_occupancy evaluated; ERR_STATION_AT_CAPACITY if full"
      - "Licensed model: drop window + per-customer limit validated"
  - method: GET
    path: "/workshops/{id}"
    description: "Get a workshop session"
    roles: [Customer, WorkshopAssociate, StoreManager]
    code: 200
    input: []
    output: WorkshopSession
    side_effects: []
  - method: POST
    path: "/workshops/{id}/advance-step"
    description: "Advance the session one station step (SELECT->SELECTED->STUFFED->SOUNDED->BATHED->DRESSED)"
    roles: [WorkshopAssociate]
    code: 200
    input: []
    output: WorkshopSession
    side_effects:
      - "Applies the current step's transition incl. consumable consumption, station reassignment via station_selector, StuffedAnimal minting at SELECT->SELECTED, drop units_claimed bump"
  - method: POST
    path: "/workshops/{id}/abandon"
    description: "Abandon a non-terminal session, restoring consumables and releasing drop units"
    roles: [WorkshopAssociate]
    code: 200
    input: []
    output: WorkshopSession
    side_effects: ["Consumable restoration per stage", "CollectionDrop.units_claimed -= 1 if licensed", "Party/BuildShip parent updates"]
  - method: POST
    path: "/workshops/{id}/payment"
    description: "Pay for a DRESSED session (CASH | GIFT_CARD | GIFT_CARD_LINKED)"
    roles: [Customer]
    code: 200
    input: [payment_amount_cents, pay_tender, "gift_card_id?", "registry_id?"]
    output: WorkshopSession
    side_effects:
      - "Session -> PAID; StuffedAnimal -> COMPLETED"
      - "Party guest -> ATTENDED / BuildShipOrder -> READY_FOR_PICKUP as applicable"
      - "Gift card balance debit; EXHAUSTED at 0"

  # --- StuffedAnimal ---
  - method: GET
    path: "/animals/{id}"
    description: "Get a stuffed animal"
    roles: [Customer, WorkshopAssociate, StoreManager]
    code: 200
    input: []
    output: StuffedAnimal
    side_effects: []
  - method: GET
    path: "/animals/{id}/workshops"
    description: "List workshop sessions whose minted animal this is (0 or 1 entries)"
    roles: [Customer, WorkshopAssociate, StoreManager]
    code: 200
    input: []
    output: WorkshopSession[]
    side_effects: []
  - method: GET
    path: "/workshops/{id}/animals"
    description: "List stuffed animals minted by this session (0 or 1 entries)"
    roles: [Customer, WorkshopAssociate, StoreManager]
    code: 200
    input: []
    output: StuffedAnimal[]
    side_effects: []
  - method: GET
    path: "/workshops/{id}/party-guests"
    description: "List party guests whose session this is (0 or 1 entries)"
    roles: [Customer, PartyHost, StoreManager]
    code: 200
    input: []
    output: PartyGuest[]
    side_effects: []
  - method: GET
    path: "/workshops/{id}/build-ship-orders"
    description: "List build-and-ship orders assembled by this session (0 or 1 entries)"
    roles: [WorkshopAssociate, StoreManager]
    code: 200
    input: []
    output: BuildShipOrder[]
    side_effects: []
  - method: POST
    path: "/animals/{id}/birth-certificate"
    description: "Personalize the birth certificate (name + birth date); allowed until the origin session is PAID"
    roles: [Customer]
    code: 200
    input: [birth_cert_name, birth_cert_birth_date]
    output: StuffedAnimal
    side_effects: ["increments StuffedAnimal.version by 1"]
  - method: POST
    path: "/animals/{id}/report-lost"
    description: "Report a completed animal lost (owner only)"
    roles: [Customer]
    code: 200
    input: []
    output: StuffedAnimal
    side_effects: []
  - method: POST
    path: "/animals/{id}/mark-recovered"
    description: "Mark a lost animal recovered (owner only)"
    roles: [Customer]
    code: 200
    input: []
    output: StuffedAnimal
    side_effects: []
  - method: POST
    path: "/animals/{id}/mark-found-cancel"
    description: "Cancel a lost report, returning the animal to COMPLETED (owner only)"
    roles: [Customer]
    code: 200
    input: []
    output: StuffedAnimal
    side_effects: []

  # --- PartyReservation ---
  - method: POST
    path: "/parties"
    description: "Quote and create a party reservation"
    roles: [Customer]
    code: 201
    input: [store_id, customer_id, party_start, duration_minutes, guest_count, package_tier, staffing_mode]
    output: PartyReservation
    side_effects: ["deposit_amount_cents computed per party_deposit_required (guest_count mode)"]
  - method: GET
    path: "/parties/{id}"
    description: "Get a party reservation"
    roles: [Customer, PartyHost, StoreManager]
    code: 200
    input: []
    output: PartyReservation
    side_effects: []
  - method: POST
    path: "/parties/{id}/pay-deposit"
    description: "Pay the deposit; books the appointment block and reserves a host (STAFF_HOSTED)"
    roles: [Customer]
    code: 200
    input: [payment_amount_cents]
    output: PartyReservation
    side_effects: ["Create AppointmentBlock", "Host reservation via party_host_selector"]
  - method: POST
    path: "/parties/{id}/pay-balance"
    description: "Pay the remaining balance after finalize"
    roles: [Customer]
    code: 200
    input: [payment_amount_cents]
    output: PartyReservation
    side_effects: ["paid_amount_cents += payment_amount_cents"]
  - method: POST
    path: "/parties/{id}/finalize"
    description: "Finalize a confirmed party after its block ends; computes final_amount_due_cents"
    roles: [StoreManager]
    code: 200
    input: []
    output: PartyReservation
    side_effects: ["Runs party_final_amount_due"]
  - method: POST
    path: "/parties/{id}/cancel"
    description: "Cancel a party; computes the deposit refund per the cancel-refund mode"
    roles: [Customer]
    code: 200
    input: []
    output: PartyReservation
    side_effects: ["Deposit refund computation", "AppointmentBlock RELEASED", "Confirmed-party cascade to sessions/guests"]
  - method: POST
    path: "/parties/{id}/reschedule"
    description: "Move the party to a new start time (OCC-guarded; re-runs overlap and host checks)"
    roles: [Customer]
    code: 200
    input: [new_party_start, expected_party_version]
    output: PartyReservation
    side_effects: ["AppointmentBlock times updated", "Host re-selected", "increments PartyReservation.version by 1"]
  - method: GET
    path: "/parties/{id}/guests"
    description: "List guests of a party"
    roles: [Customer, PartyHost, StoreManager]
    code: 200
    input: []
    output: PartyGuest[]
    side_effects: []
  - method: GET
    path: "/parties/{id}/workshops"
    description: "List workshop sessions created for this party's guests"
    roles: [Customer, PartyHost, StoreManager]
    code: 200
    input: []
    output: WorkshopSession[]
    side_effects: []
  - method: GET
    path: "/parties/{id}/appointment-blocks"
    description: "List appointment blocks held by this party"
    roles: [Customer, PartyHost, StoreManager]
    code: 200
    input: []
    output: AppointmentBlock[]
    side_effects: []

  # --- PartyGuest ---
  - method: POST
    path: "/party-guests"
    description: "Add a guest to a reservation"
    roles: [Customer]
    code: 201
    input: [party_reservation_id, guest_name]
    output: PartyGuest
    side_effects: ["status initialized to INVITED"]
  - method: GET
    path: "/party-guests/{id}"
    description: "Get a party guest"
    roles: [Customer, PartyHost, StoreManager]
    code: 200
    input: []
    output: PartyGuest
    side_effects: []
  - method: POST
    path: "/party-guests/{id}/confirm"
    description: "Confirm an invited guest (bounded by reservation guest_count)"
    roles: [Customer]
    code: 200
    input: []
    output: PartyGuest
    side_effects: []
  - method: POST
    path: "/party-guests/{id}/cancel"
    description: "Cancel a guest while the reservation is pre-confirmed"
    roles: [Customer]
    code: 200
    input: []
    output: PartyGuest
    side_effects: []

  # --- BuildShipOrder ---
  - method: POST
    path: "/build-ship-orders"
    description: "Place an online build-and-ship order fulfilled at a store"
    roles: [Customer]
    code: 201
    input: [store_id, customer_id, plush_model_id, sound_chip_requested, recipient_name]
    output: BuildShipOrder
    side_effects: ["status initialized to PLACED"]
  - method: GET
    path: "/build-ship-orders/{id}"
    description: "Get a build-and-ship order"
    roles: [Customer, WorkshopAssociate, StoreManager]
    code: 200
    input: []
    output: BuildShipOrder
    side_effects: []
  - method: GET
    path: "/build-ship-orders/{id}/workshops"
    description: "List workshop sessions assembling this order (0 or 1 entries)"
    roles: [WorkshopAssociate, StoreManager]
    code: 200
    input: []
    output: WorkshopSession[]
    side_effects: []
  - method: GET
    path: "/build-ship-orders/{id}/workshops"
    description: "List workshop sessions assembling this order (0 or 1 entries)"
    roles: [WorkshopAssociate, StoreManager]
    code: 200
    input: []
    output: WorkshopSession[]
    side_effects: []
  - method: POST
    path: "/build-ship-orders/{id}/start-assembly"
    description: "Begin store assembly; creates the linked workshop session"
    roles: [WorkshopAssociate]
    code: 200
    input: []
    output: BuildShipOrder
    side_effects: ["Create origin_type=BUILD_SHIP WorkshopSession", "Stock sufficiency precheck"]
  - method: POST
    path: "/build-ship-orders/{id}/handoff"
    description: "Hand a READY_FOR_PICKUP order to the carrier"
    roles: [WorkshopAssociate]
    code: 200
    input: [carrier_code, tracking_number]
    output: BuildShipOrder
    side_effects: ["handed_over_at = current logical clock"]
  - method: POST
    path: "/build-ship-orders/{id}/cancel"
    description: "Cancel a placed/in-assembly order"
    roles: [Customer]
    code: 200
    input: []
    output: BuildShipOrder
    side_effects: ["Cancels linked session if any"]

  # --- GiftCard ---
  - method: POST
    path: "/gift-cards"
    description: "Issue a gift card"
    roles: [StoreManager]
    code: 201
    input: [code, initial_balance_cents]
    output: GiftCard
    side_effects: ["balance_cents initialized to initial_balance_cents"]
  - method: GET
    path: "/gift-cards/{id}"
    description: "Get a gift card"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: GiftCard
    side_effects: []
  - method: POST
    path: "/gift-cards/{id}/disable"
    description: "Disable a gift card"
    roles: [StoreManager]
    code: 200
    input: []
    output: GiftCard
    side_effects: []

  # --- Registry ---
  - method: POST
    path: "/registries"
    description: "Create a stuffed-animal registry"
    roles: [Customer]
    code: 201
    input: [customer_id, name]
    output: Registry
    side_effects: []
  - method: GET
    path: "/registries/{id}"
    description: "Get a registry"
    roles: [Customer, StoreManager]
    code: 200
    input: []
    output: Registry
    side_effects: []
  - method: POST
    path: "/registries/{id}/link-animal"
    description: "Link a COMPLETED animal owned by the registry owner (an animal may be linked to at most one registry)"
    roles: [Customer]
    code: 200
    input: [stuffed_animal_id]
    output: Registry
    side_effects: ["linked_animal_ids += stuffed_animal_id", "increments Registry.version by 1"]
  - method: POST
    path: "/registries/{id}/link-gift-card"
    description: "Link a gift card to this registry, enabling GIFT_CARD_LINKED tender for the registry owner's sessions"
    roles: [Customer]
    code: 200
    input: [gift_card_id]
    output: Registry
    side_effects: ["linked_gift_card_ids += gift_card_id", "increments Registry.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or missing X-User-ID for an entity_backed role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Field shape violation: bad enum, out-of-range value, duplicate unique key" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_party_version does not match the current PartyReservation.version on reschedule" }
  - { id: ERR_OUTSIDE_TIME_WINDOW, http: 409, condition: "Temporal rule violated: lead time, drop window, finalize timing, or clock regression" }
  - { id: ERR_DROP_LIMIT_REACHED, http: 409, condition: "Licensed drop per-customer limit reached or total_units exhausted" }
  - { id: ERR_STATION_AT_CAPACITY, http: 409, condition: "No station of the required type has occupancy < capacity (includes buffer-window occupancy)" }
  - { id: ERR_HOST_UNAVAILABLE, http: 409, condition: "STAFF_HOSTED party requested but no eligible PARTY_HOST is free for the block" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Stuffing grams or sound-chip units on hand below the amount the operation consumes" }
  - { id: ERR_GIFT_CARD_INSUFFICIENT, http: 409, condition: "Gift card balance below the payment amount, card not ACTIVE, or linked tender without full coverage" }
  - { id: ERR_GIFT_CARD_NOT_LINKED, http: 409, condition: "GIFT_CARD_LINKED tender used without the card in the registry's linked_gift_card_ids or the session's animal missing from its linked_animal_ids" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 409, condition: "Cross-entity reference invalid: licensed model without matching collection_drop_id, animal already linked to another registry, origin/FK combination inconsistent" }
  - { id: ERR_PARTY_GUEST_LIMIT, http: 409, condition: "Confirming this guest would exceed the reservation's guest_count" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 409, condition: "payment_amount_cents does not equal the required amount (deposit, balance, or session total)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "A registered retail customer booking parties, building animals, paying, and managing their own registry/gift cards"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /parties, POST /parties/{id}/pay-deposit, POST /parties/{id}/pay-balance, POST /parties/{id}/cancel, POST /parties/{id}/reschedule"
      - "POST /workshops/{id}/payment"
      - "POST /animals/{id}/birth-certificate, /report-lost, /mark-recovered, /mark-found-cancel"
      - "POST /registries, POST /registries/{id}/link-animal, POST /registries/{id}/link-gift-card"
      - "POST /party-guests, POST /party-guests/{id}/confirm, /cancel"
      - "POST /build-ship-orders, POST /build-ship-orders/{id}/cancel"
    shared_operations:
      - "GET reads of stores, plush models, drops, own parties/guests/orders/animals/registries/gift cards"
  - name: WorkshopAssociate
    description: "Store associate running workshop stations and assembling build-and-ship orders"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /workshops, POST /workshops/{id}/advance-step, POST /workshops/{id}/abandon"
      - "POST /build-ship-orders/{id}/start-assembly, POST /build-ship-orders/{id}/handoff"
    shared_operations:
      - "GET reads of stations, consumables, workshops, staff, build-ship orders"
  - name: PartyHost
    description: "Staff member who hosts parties; read visibility over parties and guests"
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "GET /parties/{id}, GET /parties/{id}/guests, GET /parties/{id}/appointment-blocks, GET /staff/{id}"
  - name: StoreManager
    description: "Store operator administering catalog, stock, staffing, parties finalization, and consignment settlement"
    identity: "opaque"
    exclusive_operations:
      - "POST /stores, /staff, /stations, /plush-models, /consumables, /consumables/{id}/restock, /collection-drops, /gift-cards, /gift-cards/{id}/disable"
      - "POST /parties/{id}/finalize"
      - "POST /stores/{id}/consignments/run"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across all resources"
