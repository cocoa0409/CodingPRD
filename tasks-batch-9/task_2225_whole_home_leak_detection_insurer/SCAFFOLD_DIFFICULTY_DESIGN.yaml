  - rule_id: transitive_cascade
    instances:
      - name: telemetry_burst_three_hop_cascade
        grounds:
          - calculations.anomaly_classification
          - calculations.auto_shutoff_decision
          - calculations.escalation_sla_evaluation
          - state_machines.AnomalyEvent.event_state.DETECTED_to_ALERTED
          - state_machines.Device.valve_state.OPEN_to_CLOSED
          - entities.IrrigationWindow.fields.status
          - entities.IrrigationWindow.fields.suspended_at
          - entities.EscalationTicket.fields.homeowner_deadline_at
        distinguishing_aspect: |
          DEPTH 4 from a single POST /devices/{id}/telemetry: the accepted reading causes the AnomalyEvent (hop 1),
          the ALERTED event causes the EscalationTicket in PENDING_HOMEOWNER (hop 2), the same event causes
          auto_shutoff_decision to drive Device.valve_state OPEN -> CLOSED (hop 3), and that closure causes the
          property's ACTIVE IrrigationWindow to move to SUSPENDED_BY_SHUTOFF (hop 4) — each hop is only reachable
          because the previous hop landed. The triggering transition is a telemetry ingest, distinct from the
          transfer-acceptance trigger used by transfer_accept_five_hop_cascade.
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} (irrigation_present true); Device ${d1} on that property is install-verified at 62.0 psi by InstallerTech user tech-01."
