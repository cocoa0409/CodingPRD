      - name: terminated_member_cannot_be_reactivated_or_reused
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Member.terminal_states
          - endpoints["POST /members/{member_id}/terminate"]
          - validations[priority=12].ERR_MEMBER_NOT_ENROLLED
        distinguishing_aspect: |
          TERMINATED is the only terminal enrollment state and it locks down two
          different surfaces at once: the activate edge (409) and every
          member-scoped write that requires ACTIVE enrollment (409 on the
          purchase-line path), while payout_hold stays true forever.
        test_recipe:
          setup:
            - "Member Harbor Grill was ACTIVE with a countersigned letter for METRO-01 and has just been terminated."
            - "A RECEIVED June batch belongs to METRO-01."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
            - call: "POST /purchase-batches"
              payload: { distributor_id: "${dist_id}", period_start: "2026-06-01", period_end: "2026-06-30", source_reference: "METRO-2026-06" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /members/${m1_id}/terminate"
              as: GpoAdmin
          trigger:
            - call: "POST /members/${m1_id}/activate"
              as: GpoAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /members/${m1_id}/terminate"
              as: GpoAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-88120", vendor_item_description: "Beef patty 4oz 40ct case", normalized_item_key_reported: "BEEF-PATTY-4OZ-CS40", cases_shipped: 30, invoice_unit_cost_cents: 9140, distributor_base_cost_cents: 8533, invoice_date: "2026-06-05" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { e3: $.data.error_id }
          assert:
            - "${e1} == ERR_INVALID_STATE (409) — no TERMINATED -> ACTIVE edge is declared"
            - "${e2} == ERR_INVALID_STATE (409) — terminate is not idempotent from TERMINATED"
            - "${e3} == ERR_MEMBER_NOT_ENROLLED (409) — the priority-12 enrollment gate, reached before the priority-15 letter check"
            - "Member.${m1_id}.enrollment_status == TERMINATED, payout_hold == true, active_letter_count == 0"
            - "AuthorizationLetter.${loa1_id}.status == REVOKED (cascaded by terminate) and Distributor.${dist_id}.active_letter_count == 0"

      - name: second_countersign_on_an_active_letter_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.AuthorizationLetter.SUBMITTED_to_ACTIVE
          - validations[priority=11].ERR_INVALID_STATE
        distinguishing_aspect: |
          Replaying the same trigger is an error, not a no-op — and critically
          the counters must not double-count: a second ACCEPT that silently
          re-ran the side effect would leave active_letter_count at 2 for a
          member holding one letter, which would then survive a revoke as 1.
        test_recipe:
          setup:
            - "One ACTIVE letter between Member Harbor Grill and METRO-01, countersigned once."
          setup_api_calls:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
            - call: "POST /members"
              payload: { legal_name: "Harbor Grill LLC", tier_id: "${tier_id}", committed_annual_spend_cents: 20000000 }
              as: GpoAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /authorization-letters"
              payload: { member_id: "${m1_id}", distributor_id: "${dist_id}", effective_from: "2026-01-01T00:00:00.000Z", effective_to: "2028-01-01T00:00:00.000Z", signatory_name: "A Ruiz", scope: "PURCHASE_DATA_AND_PRICING" }
              as: MemberOperator
              as_user_id: "${m1_id}"
              captures: { loa1_id: $.data.id }
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /authorization-letters/${loa1_id}/countersign"
              payload: { decision: "ACCEPT" }
              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /authorization-letters/${loa1_id}/revoke"
              as: MemberOperator
              as_user_id: "${m1_id}"
            - call: "POST /authorization-letters/${loa1_id}/revoke"
