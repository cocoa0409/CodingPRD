      - name: traffic_revision_returns_an_armed_playlist_to_imported_and_reconserves_spots
        claim_type: Valid Transition
        grounds: "§1.2 Playlist ARMED -> IMPORTED (revision loop note: 'IMPORTED -> VALIDATED -> ARMED -> IMPORTED is the revision loop'); §1.3 spot_inventory_conservation; §1.2.1 OCC rule playlist-revision-stale-playlist"
        distinguishing_aspect: "A revision is a backward edge in the cycle, not an update in place: traffic_revision increments, armed_at_utc is cleared to null, SCHEDULED items are deleted and replaced wholesale, and the spot ledger of the referenced order must be re-derived (scheduled 2 -> 1, unplaced 2 -> 3) so the conservation identity still totals the ordered 4. Then the cycle must be re-traversable to ARMED."
