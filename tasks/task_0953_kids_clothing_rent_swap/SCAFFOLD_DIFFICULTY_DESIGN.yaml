              as: PlatformAdmin
              captures: { m_b1: $.data.id }
            - call: "POST /kidswear/members/${m_b1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-B1-5", name: "Bound Tee", brand_tier: "STANDARD", retail_price_cents: 3000, size_code: "5", season: "SS", category: "TOP", demand_band: "MEDIUM" }
              as: MerchandisePlanner
              captures: { st_b1: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${st_b1}", acquired_at: "2026-01-01T00:00:00Z", current_grade: "A", cycles_completed: 0 }
              as: MerchandisePlanner
              captures: { u_b1: $.data.id }
            - call: "POST /kidswear/garment-units"
