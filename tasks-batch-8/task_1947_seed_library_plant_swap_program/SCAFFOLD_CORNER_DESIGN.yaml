      - name: calc_pack_zero_allocatable_rejected
        claim_type: boundary
        grounds: ["calculations.pack_allocation", "errors[ERR_PACK_QUANTITY_EXCEEDS_ALLOCATABLE]"]
        distinguishing_aspect: "Empty-pool edge: lot with 15 seeds at certified 50.00 viability has viable 7; seeds_per_packet 10 makes floor(7/10) == 0 allocatable, so even packet_count 1 is rejected."
        test_recipe:
          setup: ["ACTIVE lot L: 15 seeds, certified viability 50.00 -> viable 7"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "GARDEN", region_zone: "ZONE_7A", label_stock_count: 10 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "HERB", approved_zones: ["ZONE_7A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "ZV1", harvest_year: 2026, seeds_received: 15, provisional_viability_pct: 50.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 50 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 1, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_PACK_QUANTITY_EXCEEDS_ALLOCATABLE   # floor(7/10) == 0 allocatable"

      - name: calc_tier_probation_boundary_0_60
        claim_type: boundary
        grounds: ["calculations.member_effective_borrow_limit"]
        distinguishing_aspect: "Return-rate tier boundary: rate 1/3 (0.3333) with 3 terminals IS below 0.60 -> PROBATION (limit 2), verified by admitting 2 concurrent borrows and rejecting the 3rd. The 0.60 comparison is strict ('<')."
        test_recipe:
          setup: ["Member MP with 3 terminal checkouts (1 VERIFIED + 2 WRITTEN_OFF -> rate 0.3333 -> PROBATION limit 2); 3 more packets available"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", site_type: "LIBRARY_BRANCH", region_zone: "ZONE_5A", label_stock_count: 10 }
              as: ProgramAdmin
              captures: { s_id: "$.data.id" }
            - call: "POST /api/seed-varieties"
              payload: { variety_name: "V", species: "Sp", category: "VEGETABLE", approved_zones: ["ZONE_5A"] }
              as: ProgramAdmin
              captures: { v_id: "$.data.id" }
            - call: "POST /api/seed-lots"
              payload: { variety_id: "${v_id}", home_site_id: "${s_id}", lot_code: "PB1", harvest_year: 2026, seeds_received: 300, provisional_viability_pct: 90.00 }
              as: ProgramAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /api/volunteers"
              payload: { email: "v@x.com", full_name: "V" }
              as: ProgramAdmin
              captures: { vol_id: "$.data.id" }
            - call: "POST /api/volunteers/${vol_id}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/submit-for-review"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/germination-tests"
              payload: { seeds_tested: 100, sprouted_count: 90 }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { t_id: "$.data.id" }
            - call: "POST /api/germination-tests/${t_id}/certify"
              payload: { outcome: "PASS" }
              as: ProgramAdmin
            - call: "POST /api/seed-lots/${lot_id}/pack"
              payload: { packet_count: 6, seeds_per_packet: 10 }
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "GET /api/seed-packets?lot_id=${lot_id}"
              as: ProgramAdmin
              captures: { p1: "$.data[0].id", p2: "$.data[1].id", p3: "$.data[2].id", p4: "$.data[3].id", p5: "$.data[4].id", p6: "$.data[5].id" }
            - call: "POST /api/members"
              payload: { email: "mp@x.com", full_name: "MP", home_site_id: "${s_id}" }
              as: ProgramAdmin
              captures: { mp: "$.data.id" }
            # p1 -> verified
            - call: "POST /api/checkouts"
              payload: { member_id: "${mp}", packet_id: "${p1}" }
