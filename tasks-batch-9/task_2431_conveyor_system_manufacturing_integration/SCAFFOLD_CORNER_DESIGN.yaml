              as: DesignEngineer
              captures: { seg_v3b: $.data.id }
          assert:
            - "the response is 201 and ConveyorSegment.${seg_v3b}.segment_code == 'IB-01' with rated_capacity_cph == 800"
            - "ConveyorSegment.${seg_v3b}.id != ConveyorSegment.${seg_v3a}.id and ConveyorSegment.${seg_v3b}.project_id == ${proj_v3b}"
            - "Project.${proj_v3b}.design_version == 2 while Project.${proj_v3a}.design_version == 2 (each project counts its own edits)"

      - name: malformed_enum_beats_an_unknown_project_id_and_returns_invalid_request
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          A request that both names a non-existent project_id and carries equipment_class TROLLEY must return
          400 ERR_INVALID_REQUEST from priority 5, never the 404 ERR_PROJECT_NOT_FOUND of priority 6.
        test_recipe:
          setup:
            - "No project with the id 11111111-1111-4111-8111-111111111111 exists."
          setup_api_calls: []
          trigger:
            - call: "POST /segments"
              payload: { project_id: "11111111-1111-4111-8111-111111111111", segment_code: "IB-01", equipment_class: "TROLLEY", rated_capacity_cph: 1500, availability_pct: 96, source_share_bps: 10000 }
              as: DesignEngineer
              captures: { err_v4: $.data.error_id }
          assert:
            - "the response is 400 with error_id ERR_INVALID_REQUEST"
            - "the error_id is not ERR_PROJECT_NOT_FOUND, proving priority 5 runs before priority 6"
            - "the response body carries the documented error envelope fields error_id, message and details"

      - name: flow_link_joining_segments_of_two_projects_returns_cross_project_reference
        claim_type: violation_to_error
