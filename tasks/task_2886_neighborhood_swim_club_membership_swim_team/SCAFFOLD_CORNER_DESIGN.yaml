            - call: "GET /swim-club/households/${h_b_id}"
              payload: {}
              as: PoolManager
              captures: { h_b_owed: $.data.guest_fee_owed_cents, h_b_consumed: $.data.guest_passes_consumed }
          assert:
            - "${cat_passes} == 0, ${h_a_granted} == 0 and ${h_a_bal_0} == 0: the pass arm of the formula is inert for both households"
            - "${s27_policy} == PASS_FIRST and ${v_a_variant} == PASS_FIRST, copied onto the visit at creation"
            - "${v_a_weekend} == true for the 2027-07-10 Saturday visit and ${v_b_weekend} == false for the 2027-07-08 Thursday visit"
            - "${v_a_passes} == 0 and ${v_b_passes} == 0: with a zero balance PASS_FIRST consumes nothing on either day"
            - "${v_a_fee} == 2400 == 3 * 800 (GUEST_FEE_WEEKEND_CENTS)"
            - "${v_b_fee} == 1500 == 3 * 500 (GUEST_FEE_WEEKDAY_CENTS)"
            - "${v_a_fee} != ${v_b_fee} on identical guest_count, so a single hard-coded rate cannot satisfy both"
            - "${h_a_owed} == 2400 and ${h_b_owed} == 1500, each posted to its own household"
            - "${h_a_consumed} == 0, ${h_b_consumed} == 0 and ${h_a_bal_1} == 0: no pass counter moved, because there were none to move"

      - name: precision_party_discount_tier_lower_bound_is_inclusive
