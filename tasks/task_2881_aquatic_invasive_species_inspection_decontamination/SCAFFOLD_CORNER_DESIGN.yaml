              payload: { target_status: "OPEN", reason: "season start" }
              as: ProgramAdmin
          assert:
            - "the trigger returns 200 with data.status == OPEN"
            - "data.seal_stock_count == 3, data.seals_in_circulation_count == 0, data.seals_retired_count == 0"
            - "data.seal_stock_count + data.seals_in_circulation_count + data.seals_retired_count == data.seal_stock_initial_count == 3"
            - "data.version == ${st_v} + 1"
            - "data.decon_service_available == false because certified_inspector_count is still 0"

      - name: precondition_enforcement_station_cannot_open_without_hours_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.InspectionStation.PLANNED_to_OPEN
          - validations.priority_14
          - errors.ERR_INVALID_STATION_STATE
        distinguishing_aspect: "The transition's second precondition is a child-row existence test: with zero StationHours rows the OPEN call returns 409 ERR_INVALID_STATION_STATE and the station stays PLANNED with seal_stock_count still 0; declaring one window makes the identical call succeed."
        test_recipe:
          setup:
