scenario: |
  Generate task harder than expert level!

  2548. Trade Show Organization & Exhibitor Sales (trade show producer): venue selection, date scheduling and multi-year contracting with attrition and cancellation clauses, floor plan design with booth inventory, aisle requirements and premium location pricing, exhibitor sales with priority point systems for space selection and rebooking on site, sponsorship inventory packaging beyond booth space with fulfillment obligations, attendee acquisition, registration categories and qualification screening for buyer audiences, exhibitor services coordination including labor, utilities and material handling ordering, show floor rules enforcement covering booth height, noise and sales conduct, post-show reporting on attendance quality and lead generation

domain_name: trade-show-exhibitor-sales
api_prefix: ""   # flat topology: every aggregate is a top-level collection (/venue-contracts, /shows, /booths, /exhibitors, /space-contracts, /selection-appointments, /sponsorship-deals, /registrations, /lead-scans, /rule-violations)

complexity_profile:
  primary_archetype: quota_allocation          # finite booth inventory + finite sponsorship inventory competed for, held, committed, released
  secondary_archetype: temporal_windowing      # venue date blocks with dark-day buffers; selection-appointment windows against desk capacity
  complexity_layers:
    - optimistic_concurrency                   # OCC on Show.version / VenueContract.version for every inventory-consuming write
    - cascading_side_effects                   # venue termination -> show cancel -> contract cancel -> booth release + points reversal
    - dual_variant_calculation                 # advance-vs-floor service rates; provisional-vs-certified priority points
    - selector_policy                          # server picks the booth when booth_ids is omitted; server ranks selection appointments

  entity_topology: flat
  # Every entity is a peer top-level collection linked by FK fields; no entity is
  # addressed through a parent id chain deeper than one segment. Sub-resource GETs
  # exist only as reverse-reachability read paths, never as the write surface.

  state_machine_shape: cyclic
  # SpaceContract cycles OFFERED -> COUNTERED -> OFFERED with a bounded round counter.
  # SponsorshipDeal carries two independent axes (deal_status x fulfillment_status).
  # SelectionAppointment forks ACTIVE -> {EXERCISED, FORFEITED} with divergent side effects.
  # Show is posture_driven: floor_posture is derived from booth aggregates + upheld violations
  # and gates every inventory-consuming child operation.

  relationship_patterns:
    - one_to_many          # Show -> Booth, SponsorshipDeal -> FulfillmentObligation
    - many_to_many         # SponsorshipDeal joins Exhibitor x SponsorshipPackage; LeadScan joins SpaceContract x Registration
    - self_referential     # Booth.combined_parent_booth_id -> Booth.id; SpaceContract.rebooked_from_space_contract_id -> SpaceContract.id
    - cross_aggregate      # venue date conflicts are detected across VenueContract boundaries via venue_code + hall_code

  role_model: segregation_of_duties
  # The operator id that reports a RuleViolation may not adjudicate it; the operator id
  # that proposes a SponsorshipDeal may not sign it. Role membership alone is never
  # sufficient authority for the second step of either pair.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 50 endpoints / 34 error codes / 12 calculations / 9 state machines /
  # 6 OCC rules. Density target: every money field is a function of at least three
  # entities, and every terminal transition must return a named conserved quantity
  # to its pre-transition value.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: VenueContract
    parent: null
    common_fields: true
    fields:
      - name: venue_code
        type: string
        source: input
        description: "Venue identifier code shared by every contract signed with that venue"
        constraints: "1-32 chars, uppercase A-Z, 0-9 and underscore only"
      - name: hall_code
        type: string
        source: input
        description: "Exhibit hall inside the venue; (venue_code, hall_code) is the physical resource whose date occupancy is exclusive"
        constraints: "1-32 chars, uppercase A-Z, 0-9 and underscore only"
      - name: hall_gross_sqft
        type: integer
        source: input
        description: "Gross floor area of the hall as contracted"
        constraints: ">= 1"
      - name: min_aisle_ratio_pct
        type: integer
        source: input
        description: "Fire-marshal minimum percentage of gross area that must remain aisle; a Show may declare a higher ratio but never a lower one"
        constraints: "0 <= value <= 90"
      - name: max_booth_height_ft
        type: integer
        source: input
        description: "Hall rigging height limit; every Booth.max_height_ft must be <= this value"
        constraints: ">= 1"
      - name: contract_year_start
        type: integer
        source: input
        description: "First edition year covered by this multi-year agreement"
        constraints: ">= 2026"
      - name: contract_year_count
        type: integer
        source: input
        description: "Number of consecutive edition years covered; a Show.edition_year outside [contract_year_start, contract_year_start + contract_year_count - 1] is rejected"
        constraints: "1 <= value <= 10"
      - name: committed_net_sqft_per_year
        type: integer
        source: input
        description: "Net sold square footage the producer commits to per edition year; the basis of the attrition clause"
        constraints: ">= 1"
      - name: attrition_allowance_pct
        type: integer
        source: input
        description: "Percentage of committed_net_sqft_per_year forgiven before attrition damages accrue"
        constraints: "0 <= value <= 100"
      - name: advance_order_discount_pct
        type: integer
        source: input
        description: "Discount applied to exhibitor service orders placed on or before a Show's advance_order_deadline"
        constraints: "0 <= value <= 60"
      - name: labor_rate_cents_per_hour
        type: integer
        source: input
        description: "Straight-time installation labor rate in cents per hour"
        constraints: ">= 1"
      - name: electrical_rate_cents_per_amp
        type: integer
        source: input
        description: "Utility rate in cents per ordered amp of 120V service"
        constraints: ">= 1"
      - name: material_handling_rate_cents_per_cwt
        type: integer
        source: input
        description: "Material handling rate in cents per hundredweight (cwt) of freight"
        constraints: ">= 1"
      - name: cancellation_fee_schedule
        type: array
        source: input
        description: "Ordered buckets [{min_days_out: integer, pct: integer}, ...] used by calculations.space_contract_cancellation_fee; evaluated highest min_days_out first"
        constraints: "1-6 buckets; every min_days_out >= 0 and distinct; every pct in 0..100; exactly one bucket MUST have min_days_out == 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the master agreement"
        default: DRAFT
        constraints: "DRAFT | EXECUTED | TERMINATED"
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the contract was executed; null while DRAFT"
        default: null
      - name: terminated_effective_date
        type: string
        source: system
        description: "Effective date supplied on termination (ISO 8601 date); null unless TERMINATED"
        default: null
      - name: show_count
        type: integer
        source: computed
        description: "Number of Show rows whose venue_contract_id equals this contract and whose status != CANCELLED"

  - name: Show
    parent: null
    common_fields: true
    fields:
      - name: venue_contract_id
        type: string
        source: input
        description: "FK -> VenueContract.id; the executed master agreement that supplies the hall, rate card, attrition clause and cancellation schedule"
      - name: name
        type: string
        source: input
        description: "Marketing name of this edition"
        constraints: "1-120 chars"
      - name: edition_year
        type: integer
        source: input
        description: "Edition year; must fall inside the parent contract's year span"
        constraints: ">= 2026"
      - name: move_in_start
        type: string
        source: input
        description: "First day of exhibitor move-in (ISO 8601 date); start of the hall occupancy interval"
      - name: event_start
        type: string
        source: input
        description: "First open show day (ISO 8601 date)"
      - name: event_end
        type: string
        source: input
        description: "Last open show day (ISO 8601 date)"
      - name: move_out_end
        type: string
        source: input
        description: "Last day of move-out (ISO 8601 date); end of the hall occupancy interval"
      - name: gross_sqft
        type: integer
        source: input
        description: "Gross floor area this edition takes in the hall; must be <= VenueContract.hall_gross_sqft"
        constraints: ">= 1"
      - name: aisle_ratio_pct
        type: integer
        source: input
        description: "Percentage of gross_sqft reserved for aisles, cross-aisles and fire lanes on this floor plan"
        constraints: "0 <= value <= 90"
      - name: base_rate_cents_per_sqft
        type: integer
        source: input
        description: "Published booth rate in cents per net square foot before location and zone multipliers"
        constraints: ">= 1"
      - name: selection_desk_capacity
        type: integer
        source: input
        description: "Number of space-selection desks staffed on selection day; caps how many SelectionAppointment windows may overlap at any instant"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Edition lifecycle"
        default: PLANNING
        constraints: "PLANNING | SPACE_SELECTION | SELLING | ON_SITE | CLOSED | CANCELLED"
      - name: selection_round
        type: integer
        source: system
        description: "Current priority-point selection round; advanced only by POST /shows/{id}/advance-selection-round"
        default: 0
      - name: floor_posture
        type: enum
        source: computed
        description: "Derived gate over every inventory-consuming child operation; see calculations.show_floor_posture"
        constraints: "OPEN | SPACE_LOCKED | FROZEN"
      - name: net_sellable_sqft
        type: integer
        source: computed
        description: "Sellable area after aisle deduction; see calculations.show_net_sellable_sqft. 0 until the floor plan is published"
      - name: sellable_booth_sqft
        type: integer
        source: computed
        description: "Sum of Booth.area_sqft over booths of this show whose status != MERGED"
      - name: held_net_sqft
        type: integer
        source: computed
        description: "Sum of Booth.area_sqft over booths of this show whose status == HELD"
      - name: assigned_net_sqft
        type: integer
        source: computed
        description: "Sum of Booth.area_sqft over booths of this show whose status == ASSIGNED"
      - name: available_net_sqft
        type: integer
        source: computed
        description: "Sum of Booth.area_sqft over booths of this show whose status == AVAILABLE"
      - name: committed_ratio_pct
        type: integer
        source: computed
        description: "Percentage of booth inventory held or assigned; see calculations.show_floor_posture"
      - name: upheld_violation_count
        type: integer
        source: computed
        description: "Count of RuleViolation rows with status == UPHELD whose space_contract_id belongs to a SpaceContract of this show"
      - name: advance_order_deadline
        type: string
        source: computed
        description: "move_in_start minus ADVANCE_ORDER_LEAD_DAYS (ISO 8601 date); see calculations.service_order_line_total"
      - name: attrition_shortfall_sqft
        type: integer
        source: computed
        description: "Net square footage below the forgiven floor at close; see calculations.show_attrition_settlement. 0 until status == CLOSED"
      - name: attrition_settlement_cents
        type: integer
        source: computed
        description: "Attrition damages owed to the venue; see calculations.show_attrition_settlement. 0 until status == CLOSED"
      - name: cancellation_reason
        type: string
        source: system
        description: "Reason recorded when the edition is cancelled directly or by cascade; null otherwise"
        default: null

  - name: Booth
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: "FK -> Show.id; the edition whose floor plan owns this booth"
      - name: space_contract_id
        type: string
        source: system
        description: "FK -> SpaceContract.id; set when the booth becomes HELD, cleared when it returns to AVAILABLE"
        default: null
      - name: combined_parent_booth_id
        type: string
        source: system
        description: "FK -> Booth.id; set on every child booth absorbed by a combine operation, null on standalone and surviving booths"
        default: null
      - name: booth_number
        type: string
        source: input
        description: "Floor plan label, unique per show"
        constraints: "1-16 chars, uppercase A-Z and 0-9 only"
      - name: width_ft
        type: integer
        source: input
        description: "Booth frontage in feet"
        constraints: ">= 1"
      - name: depth_ft
        type: integer
        source: input
        description: "Booth depth in feet"
        constraints: ">= 1"
      - name: area_sqft
        type: integer
        source: computed
        description: "width_ft * depth_ft, plus the absorbed area of every child booth after a combine"
      - name: location_class
        type: enum
        source: input
        description: "Geometry class driving the location multiplier in calculations.booth_space_fee"
        constraints: "INLINE | CORNER | PENINSULA | ISLAND"
      - name: premium_zone
        type: enum
        source: input
        description: "Traffic zone driving the zone multiplier in calculations.booth_space_fee"
        default: NONE
        constraints: "NONE | MAIN_AISLE | ENTRANCE | FOOD_COURT"
      - name: max_height_ft
        type: integer
        source: input
        description: "Maximum permitted structure height in this booth; validated against VenueContract.max_booth_height_ft at creation and enforced by floor rules on site"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Inventory state"
        default: AVAILABLE
        constraints: "AVAILABLE | HELD | ASSIGNED | MERGED"

  - name: Exhibitor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Exhibiting company legal name"
        constraints: "1-160 chars; unique across exhibitors (case-insensitive)"
      - name: contact_email
        type: string
        source: input
        description: "Primary sales contact email"
        constraints: "must contain exactly one '@'"
      - name: consecutive_years
        type: integer
        source: input
        description: "Number of consecutive prior editions exhibited, migrated from the legacy system at creation; incremented by one on every successful rebook"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Eligibility state; a SUSPENDED exhibitor cannot acquire new space until reinstated"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: ledger_points
        type: integer
        source: system
        description: "Running sum of every priority-point adjustment posted through POST /exhibitors/{id}/priority-point-adjustments"
        default: 0
      - name: sponsorship_fulfillment_points
        type: integer
        source: system
        description: "Points credited when a SponsorshipDeal reaches fulfillment_status == COMPLETE; never credited twice for the same deal"
        default: 0
      - name: penalty_points
        type: integer
        source: system
        description: "Running sum of penalties from RuleViolation rows upheld against this exhibitor plus forfeited selection appointments"
        default: 0
      - name: space_points_provisional
        type: integer
        source: computed
        description: "Space-derived points under the PROVISIONAL variant of calculations.exhibitor_priority_points"
      - name: space_points_certified
        type: integer
        source: computed
        description: "Space-derived points under the CERTIFIED variant of calculations.exhibitor_priority_points"
      - name: provisional_priority_points
        type: integer
        source: computed
        description: "Forward-looking standing used for sales conversations and dashboards; see calculations.exhibitor_priority_points variant PROVISIONAL"
      - name: certified_priority_points
        type: integer
        source: computed
        description: "Closed-book standing that alone orders space selection; see calculations.exhibitor_priority_points variant CERTIFIED"
      - name: priority_tier
        type: enum
        source: computed
        description: "Band of provisional_priority_points; see calculations.exhibitor_priority_points"
        constraints: "BRONZE | SILVER | GOLD | PLATINUM"

  - name: SelectionAppointment
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: "FK -> Show.id; the edition whose floor is being selected"
      - name: exhibitor_id
        type: string
        source: input
        description: "FK -> Exhibitor.id; the invited exhibitor"
      - name: round_index
        type: integer
        source: input
        description: "Selection round this appointment belongs to; the appointment can only be activated when Show.selection_round equals this value"
        constraints: ">= 1"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the desk window (ISO 8601 UTC)"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the desk window (ISO 8601 UTC); intervals are half-open [window_start, window_end)"
      - name: state
        type: enum
        source: system
        description: "Appointment lifecycle"
        default: SCHEDULED
        constraints: "SCHEDULED | ACTIVE | EXERCISED | FORFEITED | EXPIRED"
      - name: rank
        type: integer
        source: computed
        description: "1-based position among the appointments activated in the same round; see calculations.selection_appointment_rank. null while SCHEDULED"
        default: null
      - name: certified_points_at_rank
        type: integer
        source: system
        description: "Exhibitor.certified_priority_points snapshotted at activation so a later violation cannot retroactively reorder an in-flight round; null while SCHEDULED"
        default: null

  - name: SpaceContract
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: "FK -> Show.id; the edition being sold"
      - name: exhibitor_id
        type: string
        source: input
        description: "FK -> Exhibitor.id; the buyer"
      - name: rebooked_from_space_contract_id
        type: string
        source: system
        description: "FK -> SpaceContract.id; set on the contract created by an on-site rebook, null on originals"
        default: null
      - name: status
        type: enum
        source: system
        description: "Negotiation and lifecycle state; OFFERED <-> COUNTERED is a bounded cycle"
        default: OFFERED
        constraints: "OFFERED | COUNTERED | SIGNED | CANCELLED | CLOSED_OUT"
      - name: requested_sqft
        type: integer
        source: input
        description: "Net square footage the exhibitor asked for; drives the booth selector when booth_ids is omitted"
        constraints: ">= 1"
      - name: offered_booth_ids
        type: array
        source: system
        description: "Ordered list of Booth.id values currently held or assigned by this contract; rewritten on every offer, counter and re-offer"
      - name: offered_net_sqft
        type: integer
        source: computed
        description: "Sum of Booth.area_sqft over offered_booth_ids"
      - name: assigned_net_sqft
        type: integer
        source: computed
        description: "Sum of Booth.area_sqft over booths whose space_contract_id is this contract and whose status == ASSIGNED; 0 until SIGNED"
      - name: premium_placement_requested
        type: boolean
        source: input
        description: "Whether the exhibitor asked the selector to prefer premium zones over the cheapest fitting booth"
        default: false
      - name: requested_discount_pct
        type: number
        source: input
        description: "Discount percentage the exhibitor asked for in its most recent counter; 0 until a counter is filed"
        default: 0
        constraints: "0 <= value <= 40"
      - name: approved_discount_pct
        type: number
        source: system
        description: "Discount percentage granted by the producer on the current offer; enters calculations.booth_space_fee"
        default: 0
      - name: negotiation_round
        type: integer
        source: system
        description: "Number of counters filed by the exhibitor; a counter beyond MAX_NEGOTIATION_ROUNDS is rejected"
        default: 0
      - name: volume_tier_pct
        type: number
        source: computed
        description: "Volume discount percentage selected from VOLUME_TIER by offered_net_sqft; see calculations.booth_space_fee"
      - name: space_fee_cents
        type: integer
        source: computed
        description: "Booth space charge; see calculations.booth_space_fee. Recomputed on every offer/counter transition and frozen at SIGNED"
      - name: sponsorship_attached_cents
        type: integer
        source: computed
        description: "Sum of SponsorshipDeal.negotiated_price_cents for deals of this exhibitor on this show with deal_status == SIGNED"
      - name: bundle_discount_pct
        type: number
        source: computed
        description: "Bundle discount percentage selected from BUNDLE_TIER by the pre-discount subtotal; see calculations.space_contract_invoice_total"
      - name: bundle_discount_cents
        type: integer
        source: computed
        description: "Bundle discount in cents; see calculations.space_contract_invoice_total"
      - name: invoice_total_cents
        type: integer
        source: computed
        description: "Amount invoiced for space plus attached sponsorship after the bundle discount; see calculations.space_contract_invoice_total"
      - name: min_deposit_cents
        type: integer
        source: computed
        description: "round_half_up(space_fee_cents * MIN_DEPOSIT_PCT / 100); the deposit floor enforced at signing"
      - name: deposit_paid_cents
        type: integer
        source: system
        description: "Deposit recorded at signing; 0 before signing"
        default: 0
      - name: cancellation_fee_cents
        type: integer
        source: computed
        description: "Liquidated damages owed on cancellation; see calculations.space_contract_cancellation_fee. 0 while not cancelled"
      - name: fee_applied_to_deposit_cents
        type: integer
        source: computed
        description: "min(cancellation_fee_cents, deposit_paid_cents); the portion of the deposit consumed by the fee"
      - name: refund_cents
        type: integer
        source: computed
        description: "deposit_paid_cents - fee_applied_to_deposit_cents; cash returned to the exhibitor"
      - name: balance_due_cents
        type: integer
        source: computed
        description: "cancellation_fee_cents - fee_applied_to_deposit_cents; unpaid remainder invoiced after cancellation"
      - name: points_awarded
        type: integer
        source: system
        description: "Space points granted to the exhibitor at signing and reversed exactly on cancellation; 0 unless the contract has been signed"
        default: 0
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant of signing; null until SIGNED"
        default: null
      - name: last_offer_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who produced the current offer; null until a re-offer is filed"
        default: null
      - name: cancellation_reason
        type: string
        source: system
        description: "Reason recorded on cancellation, direct or cascaded; null otherwise"
        default: null

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - name: space_contract_id
        type: string
        source: input
        description: "FK -> SpaceContract.id; the signed contract being serviced"
      - name: service_type
        type: enum
        source: input
        description: "Which rate card line applies"
        constraints: "LABOR | ELECTRICAL | MATERIAL_HANDLING"
      - name: quantity
        type: number
        source: input
        description: "Ordered quantity: hours for LABOR, amps for ELECTRICAL, hundredweight for MATERIAL_HANDLING"
        constraints: "> 0"
      - name: billable_quantity
        type: number
        source: computed
        description: "quantity after service-type minimums; see calculations.service_order_line_total"
      - name: unit_rate_cents
        type: integer
        source: computed
        description: "Rate card value copied from the VenueContract for this service_type"
      - name: rate_variant
        type: enum
        source: computed
        description: "ADVANCE when ordered on or before Show.advance_order_deadline, FLOOR after it; see calculations.service_order_line_total"
        constraints: "ADVANCE | FLOOR"
      - name: line_total_cents
        type: integer
        source: computed
        description: "Charge for this order; see calculations.service_order_line_total"
      - name: ordered_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the order was accepted; fixes rate_variant"
      - name: status
        type: enum
        source: system
        description: "Order state"
        default: SUBMITTED
        constraints: "SUBMITTED | CANCELLED"

  - name: RuleViolation
    parent: null
    common_fields: true
    fields:
      - name: space_contract_id
        type: string
        source: input
        description: "FK -> SpaceContract.id; the exhibiting party charged with the violation"
      - name: violation_type
        type: enum
        source: input
        description: "Which show floor rule was broken"
        constraints: "BOOTH_HEIGHT | NOISE | AISLE_ENCROACHMENT | SALES_CONDUCT"
      - name: measured_value
        type: number
        source: input
        description: "Measured structure height in feet; required when violation_type == BOOTH_HEIGHT, ignored otherwise"
        default: null
      - name: notes
        type: string
        source: input
        description: "Floor manager's narrative"
        constraints: "1-500 chars"
      - name: status
        type: enum
        source: system
        description: "Adjudication state"
        default: OPEN
        constraints: "OPEN | UPHELD | WAIVED"
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reporter; the same operator id may never adjudicate this row"
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the adjudicating show director; null while OPEN"
        default: null
      - name: penalty_points
        type: integer
        source: computed
        description: "PENALTY_POINTS[violation_type] when status == UPHELD, otherwise 0"
      - name: waiver_reason
        type: string
        source: system
        description: "Required narrative recorded when the disposition is WAIVED; null otherwise"
        default: null

  - name: SponsorshipPackage
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: "FK -> Show.id; the edition whose sponsorship inventory this package draws from"
      - name: package_code
        type: string
        source: input
        description: "Rate card code, unique per show"
        constraints: "1-32 chars, uppercase A-Z, 0-9 and underscore only"
      - name: list_price_cents
        type: integer
        source: input
        description: "Published price of one unit of this package"
        constraints: ">= 1"
      - name: price_floor_cents
        type: integer
        source: input
        description: "Author-set floor for one unit; validation 61 enforces BOTH this floor and the hard cap round_half_up(list_price_cents * (100 - MAX_SPONSOR_DISCOUNT_PCT) / 100), so the effective floor is the greater of the two"
        constraints: ">= 1 and <= list_price_cents"
      - name: inventory_total
        type: integer
        source: input
        description: "Number of units available for sale"
        constraints: ">= 1"
      - name: inventory_committed
        type: integer
        source: computed
        description: "Count of SponsorshipDeal rows on this package whose deal_status IN {PROPOSED, SIGNED}"
      - name: inventory_available
        type: integer
        source: computed
        description: "inventory_total - inventory_committed"
      - name: exclusivity_category
        type: string
        source: input
        description: "Market category locked by this package; the literal NONE means the package is non-exclusive"
        default: NONE
        constraints: "1-32 chars, uppercase A-Z, 0-9 and underscore only"
      - name: obligation_codes
        type: array
        source: input
        description: "Fulfillment obligations the producer owes the sponsor; one FulfillmentObligation row is created per code when the deal is signed"
        constraints: "1-8 entries, each 1-32 chars uppercase A-Z/0-9/underscore, no duplicates"
      - name: priority_point_value
        type: integer
        source: input
        description: "Points credited to the sponsor once every obligation of a signed deal is resolved"
        constraints: ">= 0"

  - name: SponsorshipDeal
    parent: null
    common_fields: true
    fields:
      - name: sponsorship_package_id
        type: string
        source: input
        description: "FK -> SponsorshipPackage.id; the packaged inventory being bought"
      - name: exhibitor_id
        type: string
        source: input
        description: "FK -> Exhibitor.id; the sponsor"
      - name: negotiated_price_cents
        type: integer
        source: input
        description: "Agreed price for one unit; must be >= SponsorshipPackage.price_floor_cents"
        constraints: ">= 1"
      - name: deal_status
        type: enum
        source: system
        description: "Commercial axis; evolves independently of fulfillment_status"
        default: PROPOSED
        constraints: "PROPOSED | SIGNED | CANCELLED"
      - name: fulfillment_status
        type: enum
        source: computed
        description: "Delivery axis derived from the deal's FulfillmentObligation rows; see calculations.sponsorship_fulfillment_status"
        default: NOT_STARTED
        constraints: "NOT_STARTED | PARTIAL | COMPLETE | BREACHED"
      - name: obligation_count
        type: integer
        source: computed
        description: "Count of FulfillmentObligation rows of this deal"
      - name: resolved_obligation_count
        type: integer
        source: computed
        description: "Count of this deal's obligations whose status IN {DELIVERED, WAIVED}"
      - name: fulfillment_credited
        type: boolean
        source: system
        description: "True once priority_point_value has been credited to the sponsor for this deal; blocks double credit"
        default: false
      - name: proposed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who proposed the deal; the same operator id may never sign it"
      - name: signed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the show director who signed; null until SIGNED"
        default: null
      - name: cancellation_reason
        type: string
        source: system
        description: "Reason recorded on cancellation; null otherwise"
        default: null

  - name: FulfillmentObligation
    parent: null
    common_fields: true
    fields:
      - name: sponsorship_deal_id
        type: string
        source: input
        description: "FK -> SponsorshipDeal.id; the signed deal this obligation belongs to"
      - name: obligation_code
        type: string
        source: system
        description: "Code copied from SponsorshipPackage.obligation_codes at deal signing"
      - name: due_date
        type: string
        source: system
        description: "Show.event_start minus OBLIGATION_LEAD_DAYS (ISO 8601 date)"
      - name: status
        type: enum
        source: system
        description: "Delivery state; MISSED is written only by the show-close sweep"
        default: PENDING
        constraints: "PENDING | DELIVERED | WAIVED | MISSED"
      - name: resolved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who delivered or waived the obligation; null while PENDING or MISSED"
        default: null
      - name: note
        type: string
        source: system
        description: "Narrative supplied at resolution; required when the disposition is WAIVED"
        default: null

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: "FK -> Show.id; the edition being attended"
      - name: category
        type: enum
        source: input
        description: "Registration category; PRESS and EXHIBITOR_STAFF bypass buyer screening"
        constraints: "BUYER | VIP_BUYER | PRESS | STUDENT | EXHIBITOR_STAFF"
      - name: company_name
        type: string
        source: input
        description: "Registrant's employer"
        constraints: "1-160 chars"
      - name: job_title
        type: string
        source: input
        description: "Registrant's title; matched case-insensitively against BUYER_TITLE_KEYWORDS"
        constraints: "1-120 chars"
      - name: purchasing_authority
        type: enum
        source: input
        description: "Screening answer describing buying power"
        constraints: "NONE | INFLUENCER | RECOMMENDER | DECISION_MAKER"
      - name: annual_spend_band
        type: enum
        source: input
        description: "Screening answer describing annual category spend"
        constraints: "UNDER_50K | K50_250K | K250K_1M | OVER_1M"
      - name: email
        type: string
        source: input
        description: "Registrant email, unique per show (case-insensitive)"
        constraints: "must contain exactly one '@'"
      - name: qualification_score
        type: integer
        source: computed
        description: "Buyer qualification score; see calculations.registration_qualification_score. 0 for bypass categories"
      - name: qualification_status
        type: enum
        source: system
        description: "Screening outcome; WAITLISTED rows can be resolved manually by a show director"
        default: PENDING
        constraints: "PENDING | QUALIFIED | WAITLISTED | REJECTED"
      - name: screening_override_reason
        type: string
        source: system
        description: "Narrative recorded when a show director overrides a waitlisted screening result; null otherwise"
        default: null
      - name: lead_scan_count
        type: integer
        source: computed
        description: "Count of LeadScan rows referencing this registration; a registration with >= 1 scan counts as attended in the post-show report"

  - name: LeadScan
    parent: null
    common_fields: false
    fields:
      - name: space_contract_id
        type: string
        source: input
        description: "FK -> SpaceContract.id; the exhibitor booth whose scanner captured the badge"
      - name: registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the badge that was scanned"
      - name: scanned_at
        type: datetime
        source: system
        description: "Logical-clock instant of the scan; the row is append-only and has no update endpoint"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  - entity: VenueContract
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /venue-contracts/{id}/execute"
        actor: ShowDirector
        preconditions:
          - "status == DRAFT"
          - "cancellation_fee_schedule contains exactly one bucket with min_days_out == 0"
        side_effects:
          - "sets executed_at to the current logical clock"
          - "increments VenueContract.version by 1"
        note: "Shows may only be created under an EXECUTED contract."
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /venue-contracts/{id}/terminate"
        actor: ShowDirector
        preconditions:
          - "status == EXECUTED"
          - "expected_venue_contract_version == version (see concurrency_rules.venue-contract-terminate-stale)"
        side_effects:
          - "sets terminated_effective_date to the supplied effective_date"
          - "CASCADE LINK 1: every Show with venue_contract_id == this contract and status IN {PLANNING, SPACE_SELECTION, SELLING, ON_SITE} transitions to CANCELLED with cancellation_reason 'VENUE_CONTRACT_TERMINATED', processed in Show.created_at ASC order"
          - "recomputes show_count"
          - "increments VenueContract.version by 1"
        note: "Link 1 fires the Show CANCELLED transition, which itself fires links 2-4 documented on that transition."

  - entity: Show
    initial_state: PLANNING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNING
        to: SPACE_SELECTION
        trigger: "POST /shows/{id}/publish-floor-plan"
        actor: ShowDirector
        preconditions:
          - "status == PLANNING"
          - "VenueContract.status == EXECUTED"
          - "aisle_ratio_pct >= VenueContract.min_aisle_ratio_pct"
          - "count of booths of this show with status != MERGED >= 1"
          - "sellable_booth_sqft <= net_sellable_sqft computed by calculations.show_net_sellable_sqft"
        side_effects:
          - "writes net_sellable_sqft per calculations.show_net_sellable_sqft"
          - "writes advance_order_deadline = move_in_start - ADVANCE_ORDER_LEAD_DAYS days"
          - "recomputes floor_posture per calculations.show_floor_posture"
          - "increments Show.version by 1"
      - from: SPACE_SELECTION
        to: SELLING
        trigger: "POST /shows/{id}/transition with target_status SELLING"
        actor: ShowDirector
        preconditions:
          - "status == SPACE_SELECTION"
          - "no SelectionAppointment of this show is in state ACTIVE"
        side_effects:
          - "every SelectionAppointment of this show in state SCHEDULED transitions to EXPIRED (no penalty)"
          - "recomputes floor_posture"
          - "increments Show.version by 1"
      - from: SELLING
        to: ON_SITE
        trigger: "POST /shows/{id}/transition with target_status ON_SITE"
        actor: ShowDirector
        preconditions:
          - "status == SELLING"
        side_effects:
          - "recomputes floor_posture (the ON_SITE branch of calculations.show_floor_posture becomes reachable)"
          - "increments Show.version by 1"
        note: "Rebooking, lead scanning and floor-rule reporting are only legal while ON_SITE."
      - from: ON_SITE
        to: CLOSED
        trigger: "POST /shows/{id}/transition with target_status CLOSED"
        actor: ShowDirector
        preconditions:
          - "status == ON_SITE"
        side_effects:
          - "every SpaceContract of this show with status == SIGNED transitions to CLOSED_OUT"
          - "every SpaceContract of this show with status IN {OFFERED, COUNTERED} transitions to CANCELLED with cancellation_reason 'SHOW_CLOSED_UNSIGNED' and a waived fee (cancellation_fee_cents = 0)"
          - "CASCADE LINK 1: every FulfillmentObligation whose deal has deal_status == SIGNED and whose own status == PENDING transitions to MISSED, processed in FulfillmentObligation.created_at ASC order"
          - "recomputes attrition_shortfall_sqft and attrition_settlement_cents per calculations.show_attrition_settlement"
          - "recomputes floor_posture"
          - "increments Show.version by 1"
        note: "Link 1 fires the obligation MISSED transition, which bubbles fulfillment_status to BREACHED (link 2) and penalises the sponsor (link 3)."
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /shows/{id}/transition with target_status CANCELLED, or cascade from VenueContract EXECUTED->TERMINATED"
        actor: ShowDirector | system
        preconditions:
          - "status IN {PLANNING, SPACE_SELECTION, SELLING, ON_SITE}"
        side_effects:
          - "sets cancellation_reason from the request's cancellation_reason, or 'VENUE_CONTRACT_TERMINATED' when cascaded"
          - "every SelectionAppointment of this show in state IN {SCHEDULED, ACTIVE} transitions to EXPIRED (no penalty)"
          - "CASCADE LINK 2: every SpaceContract of this show with status IN {OFFERED, COUNTERED, SIGNED} transitions to CANCELLED with cancellation_reason 'SHOW_CANCELLED' and cancellation_fee_cents forced to 0, processed in SpaceContract.created_at ASC order"
          - "every SponsorshipDeal on a package of this show with deal_status IN {PROPOSED, SIGNED} transitions to CANCELLED with cancellation_reason 'SHOW_CANCELLED'"
          - "recomputes floor_posture, sellable/held/assigned/available aggregates"
          - "increments Show.version by 1"
        note: "The same transition row applies from SPACE_SELECTION, SELLING and ON_SITE; the from-set is the precondition above."

  - entity: Booth
    initial_state: AVAILABLE
    terminal_states: [MERGED]
    transitions:
      - from: AVAILABLE
        to: HELD
        trigger: "POST /space-contracts, POST /selection-appointments/{id}/exercise, POST /space-contracts/{id}/negotiate, POST /space-contracts/{id}/rebook"
        actor: SalesRep | ShowDirector | Exhibitor
        preconditions:
          - "status == AVAILABLE"
          - "combined_parent_booth_id == null"
          - "show_id equals the show_id of the holding SpaceContract"
        side_effects:
          - "sets space_contract_id to the holding contract"
          - "recomputes Show.held_net_sqft, Show.available_net_sqft, Show.committed_ratio_pct and Show.floor_posture"
          - "increments Booth.version and Show.version by 1"
      - from: HELD
        to: ASSIGNED
        trigger: "POST /space-contracts/{id}/sign"
        actor: Exhibitor
        preconditions:
          - "status == HELD"
          - "space_contract_id equals the contract being signed"
        side_effects:
          - "recomputes Show.held_net_sqft, Show.assigned_net_sqft, Show.committed_ratio_pct and Show.floor_posture"
          - "increments Booth.version and Show.version by 1"
      - from: HELD
        to: AVAILABLE
        trigger: "POST /space-contracts/{id}/negotiate (booth set replaced), POST /space-contracts/{id}/cancel, POST /shows/{id}/advance-selection-round (appointment forfeited), Show CANCELLED cascade"
        actor: Exhibitor | SalesRep | ShowDirector | system
        preconditions:
          - "status == HELD"
        side_effects:
          - "clears space_contract_id to null"
          - "recomputes Show.held_net_sqft, Show.available_net_sqft, Show.committed_ratio_pct and Show.floor_posture"
          - "increments Booth.version and Show.version by 1"
      - from: ASSIGNED
        to: AVAILABLE
        trigger: "POST /space-contracts/{id}/cancel, or Show CANCELLED / VenueContract TERMINATED cascade"
        actor: Exhibitor | ShowDirector | system
        preconditions:
          - "status == ASSIGNED"
        side_effects:
          - "clears space_contract_id to null"
          - "recomputes Show.assigned_net_sqft, Show.available_net_sqft, Show.committed_ratio_pct and Show.floor_posture"
          - "increments Booth.version and Show.version by 1"
        note: "This is the compensating leg of the area invariant in calculations.show_booth_area_conservation."
      - from: AVAILABLE
        to: MERGED
        trigger: "POST /booths/{id}/combine"
        actor: ShowDirector
        preconditions:
          - "status == AVAILABLE"
          - "combined_parent_booth_id == null"
          - "child booth and surviving booth share the same show_id"
          - "child booth id != surviving booth id"
        side_effects:
          - "sets combined_parent_booth_id to the surviving booth's id"
          - "adds this booth's area_sqft to the surviving booth's area_sqft"
          - "recomputes Show.sellable_booth_sqft, Show.available_net_sqft, Show.committed_ratio_pct and Show.floor_posture"
          - "increments Booth.version (both rows) and Show.version by 1"
        note: "MERGED is terminal: a merged booth can never be held, assigned or un-merged."

  - entity: SelectionAppointment
    initial_state: SCHEDULED
    terminal_states: [EXERCISED, FORFEITED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /shows/{id}/advance-selection-round (system, for appointments whose round_index == the new Show.selection_round)"
        actor: system
        preconditions:
          - "state == SCHEDULED"
          - "round_index == Show.selection_round after the increment"
          - "window_end > current logical clock"
          - "Exhibitor.status == ACTIVE"
        side_effects:
          - "writes certified_points_at_rank = Exhibitor.certified_priority_points at this instant"
          - "writes rank per calculations.selection_appointment_rank"
          - "increments SelectionAppointment.version by 1"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "POST /shows/{id}/advance-selection-round (window already elapsed, or Exhibitor.status != ACTIVE), Show SPACE_SELECTION->SELLING, Show CANCELLED cascade"
        actor: system
        preconditions:
          - "state == SCHEDULED"
        side_effects:
          - "leaves rank null and certified_points_at_rank null"
          - "no penalty is charged to the exhibitor"
          - "increments SelectionAppointment.version by 1"
      - from: ACTIVE
        to: EXERCISED
        trigger: "POST /selection-appointments/{id}/exercise"
        actor: Exhibitor | SalesRep
        preconditions:
          - "state == ACTIVE"
          - "current logical clock >= window_start and < window_end"
          - "Show.floor_posture != FROZEN"
          - "Exhibitor.status == ACTIVE"
          - "expected_show_version == Show.version (see concurrency_rules.appointment-exercise-stale-show)"
        side_effects:
          - "creates one SpaceContract in status OFFERED for (show_id, exhibitor_id) with offered_booth_ids resolved by calculations.booth_selector"
          - "each selected Booth transitions AVAILABLE -> HELD"
          - "recomputes the new contract's volume_tier_pct, space_fee_cents, min_deposit_cents, bundle fields and invoice_total_cents"
          - "increments SelectionAppointment.version and Show.version by 1"
        note: "Divergent-branch sibling of ACTIVE -> FORFEITED: this branch consumes inventory and charges no penalty."
      - from: ACTIVE
        to: FORFEITED
        trigger: "POST /shows/{id}/advance-selection-round (appointment still ACTIVE when the next round opens)"
        actor: system
        preconditions:
          - "state == ACTIVE"
        side_effects:
          - "adds FORFEIT_PENALTY_POINTS to Exhibitor.penalty_points"
          - "every Booth with status == HELD whose space_contract_id belongs to a contract created by this appointment is untouched (holds already converted into a contract survive)"
          - "increments SelectionAppointment.version and Exhibitor.version by 1"
        note: "Divergent-branch sibling of ACTIVE -> EXERCISED: this branch consumes no inventory and charges a penalty."

  - entity: SpaceContract
    initial_state: OFFERED
    terminal_states: [CANCELLED, CLOSED_OUT]
    transitions:
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /space-contracts/{id}/negotiate with action COUNTER"
        actor: Exhibitor
        preconditions:
          - "status == OFFERED"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS"
          - "Show.status IN {SPACE_SELECTION, SELLING}"
          - "X-User-ID == exhibitor_id"
        side_effects:
          - "increments negotiation_round by 1"
          - "writes requested_discount_pct from the request"
          - "increments SpaceContract.version by 1"
        note: "Cycle leg 1 of the bounded OFFERED <-> COUNTERED loop."
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /space-contracts/{id}/negotiate with action REOFFER"
        actor: SalesRep | ShowDirector
        preconditions:
          - "status == COUNTERED"
          - "Show.status IN {SPACE_SELECTION, SELLING}"
          - "approved_discount_pct <= DISCOUNT_APPROVAL_THRESHOLD_PCT unless the actor is ShowDirector"
          - "Show.floor_posture != SPACE_LOCKED when approved_discount_pct > DISCOUNT_APPROVAL_THRESHOLD_PCT"
        side_effects:
          - "writes approved_discount_pct and last_offer_by_user_id"
          - "replaces offered_booth_ids when offered_booth_ids is supplied: booths dropped from the set transition HELD -> AVAILABLE and booths added transition AVAILABLE -> HELD"
          - "recomputes volume_tier_pct, space_fee_cents, min_deposit_cents, bundle_discount_pct, bundle_discount_cents, invoice_total_cents"
          - "increments SpaceContract.version and Show.version by 1"
        note: "Cycle leg 2; negotiation_round is NOT incremented, so only the exhibitor's counters consume the round budget."
      - from: OFFERED
        to: SIGNED
        trigger: "POST /space-contracts/{id}/sign"
        actor: Exhibitor
        preconditions:
          - "status == OFFERED"
          - "Show.status IN {SPACE_SELECTION, SELLING}"
          - "Exhibitor.status == ACTIVE"
          - "X-User-ID == exhibitor_id"
          - "offered_booth_ids is non-empty and every referenced booth has status == HELD with space_contract_id == this contract"
          - "deposit_paid_cents >= min_deposit_cents"
          - "expected_show_version == Show.version (see concurrency_rules.space-contract-sign-stale-show)"
        side_effects:
          - "freezes space_fee_cents, volume_tier_pct, bundle_discount_pct, bundle_discount_cents and invoice_total_cents at their current values"
          - "writes deposit_paid_cents and signed_at"
          - "every booth in offered_booth_ids transitions HELD -> ASSIGNED"
          - "writes points_awarded = floor(assigned_net_sqft / SQFT_PER_POINT_BLOCK) * POINTS_PER_BLOCK and adds it to the exhibitor's space point base"
          - "recomputes Exhibitor.space_points_provisional, provisional_priority_points and priority_tier"
          - "recomputes Show.assigned_net_sqft, Show.held_net_sqft, Show.committed_ratio_pct and Show.floor_posture"
          - "increments SpaceContract.version, Exhibitor.version and Show.version by 1"
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /space-contracts/{id}/cancel, or Show CANCELLED / CLOSED cascade"
        actor: Exhibitor | ShowDirector | system
        preconditions:
          - "status IN {OFFERED, COUNTERED}"
        side_effects:
          - "writes cancellation_reason"
          - "cancellation_fee_cents = 0 (nothing was signed), fee_applied_to_deposit_cents = 0, refund_cents = deposit_paid_cents, balance_due_cents = 0"
          - "every booth in offered_booth_ids transitions HELD -> AVAILABLE"
          - "recomputes Show.held_net_sqft, Show.available_net_sqft, Show.committed_ratio_pct and Show.floor_posture"
          - "increments SpaceContract.version and Show.version by 1"
        note: "Applies identically from COUNTERED; the from-set is the precondition above."
      - from: SIGNED
        to: CANCELLED
        trigger: "POST /space-contracts/{id}/cancel, or Show CANCELLED / VenueContract TERMINATED cascade"
        actor: Exhibitor | ShowDirector | system
        preconditions:
          - "status == SIGNED"
          - "Show.status != CLOSED"
        side_effects:
          - "writes cancellation_reason"
          - "writes cancellation_fee_cents per calculations.space_contract_cancellation_fee (forced to 0 when the cancellation is cascaded from a Show CANCELLED or VenueContract TERMINATED)"
          - "writes fee_applied_to_deposit_cents = min(cancellation_fee_cents, deposit_paid_cents), refund_cents = deposit_paid_cents - fee_applied_to_deposit_cents, balance_due_cents = cancellation_fee_cents - fee_applied_to_deposit_cents"
          - "CASCADE LINK 3a: every booth of this contract transitions ASSIGNED -> AVAILABLE with space_contract_id cleared"
          - "CASCADE LINK 3b: every ServiceOrder of this contract with status == SUBMITTED transitions to CANCELLED"
          - "CASCADE LINK 3c: subtracts points_awarded from the exhibitor's space point base and resets points_awarded to 0, then recomputes provisional_priority_points and priority_tier"
          - "recomputes Show.assigned_net_sqft, Show.available_net_sqft, Show.committed_ratio_pct and Show.floor_posture"
          - "increments SpaceContract.version, Exhibitor.version, Show.version and every touched Booth/ServiceOrder version by 1"
        note: "Links 3a-3c are the compensating legs of calculations.show_booth_area_conservation, calculations.space_contract_deposit_conservation and calculations.exhibitor_point_ledger_conservation."
      - from: SIGNED
        to: CLOSED_OUT
        trigger: "POST /shows/{id}/transition with target_status CLOSED (system)"
        actor: system
        preconditions:
          - "status == SIGNED"
          - "Show.status transitions ON_SITE -> CLOSED in the same request"
        side_effects:
          - "booths keep status ASSIGNED (the floor is history, not inventory, after close)"
          - "the contract's assigned_net_sqft now enters the CERTIFIED variant of calculations.exhibitor_priority_points"
          - "recomputes Exhibitor.space_points_certified and certified_priority_points"
          - "increments SpaceContract.version and Exhibitor.version by 1"

  - entity: SponsorshipDeal
    dimension: deal_status
    initial_state: PROPOSED
    terminal_states: [CANCELLED]
    transitions:
      - from: PROPOSED
        to: SIGNED
        trigger: "POST /sponsorship-deals/{id}/sign"
        actor: ShowDirector
        preconditions:
          - "deal_status == PROPOSED"
          - "Show.status IN {PLANNING, SPACE_SELECTION, SELLING}"
          - "Exhibitor.status == ACTIVE"
          - "X-User-ID != proposed_by_user_id (segregation of duties)"
          - "SponsorshipPackage.inventory_available >= 1 counting this deal's own PROPOSED hold"
        side_effects:
          - "writes signed_by_user_id"
          - "creates one FulfillmentObligation per entry of SponsorshipPackage.obligation_codes, in the declared array order, each with status PENDING and due_date = Show.event_start - OBLIGATION_LEAD_DAYS days"
          - "recomputes fulfillment_status per calculations.sponsorship_fulfillment_status (NOT_STARTED)"
          - "recomputes SponsorshipPackage.inventory_committed and inventory_available"
          - "recomputes Exhibitor.provisional_priority_points (sponsorship spend points now count) and priority_tier"
          - "recomputes sponsorship_attached_cents, bundle_discount_pct, bundle_discount_cents and invoice_total_cents on every non-terminal SpaceContract of this exhibitor on the same show"
          - "increments SponsorshipDeal.version and Exhibitor.version by 1"
        note: "The deal_status axis moves; the fulfillment_status axis stays at its derived value."
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /sponsorship-deals/{id}/cancel, or Show CANCELLED cascade"
        actor: ShowDirector | Exhibitor | system
        preconditions:
          - "deal_status == PROPOSED"
        side_effects:
          - "writes cancellation_reason"
          - "recomputes SponsorshipPackage.inventory_committed and inventory_available (the PROPOSED hold is released)"
          - "increments SponsorshipDeal.version by 1"
        note: "Compensating leg of calculations.sponsorship_inventory_conservation."
      - from: SIGNED
        to: CANCELLED
        trigger: "POST /sponsorship-deals/{id}/cancel, or Show CANCELLED cascade"
        actor: ShowDirector | Exhibitor | system
        preconditions:
          - "deal_status == SIGNED"
          - "Show.status != CLOSED"
        side_effects:
          - "writes cancellation_reason"
          - "every FulfillmentObligation of this deal with status == PENDING stays PENDING and is excluded from the show-close MISSED sweep because its deal is no longer SIGNED"
          - "fulfillment_status keeps its current derived value (the delivery axis is not rewound by a commercial cancellation)"
          - "recomputes SponsorshipPackage.inventory_committed and inventory_available"
          - "subtracts the sponsorship spend points of this deal from the exhibitor's provisional base, and subtracts sponsorship_fulfillment_points credited by this deal when fulfillment_credited == true, then recomputes provisional_priority_points and priority_tier"
          - "recomputes sponsorship_attached_cents, bundle_discount_pct, bundle_discount_cents and invoice_total_cents on every non-terminal SpaceContract of this exhibitor on the same show"
          - "increments SponsorshipDeal.version and Exhibitor.version by 1"

  - entity: SponsorshipDeal
    dimension: fulfillment_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: PARTIAL
        trigger: "POST /sponsorship-deals/{id}/obligations/{id}/resolve (bubble-up recompute)"
        actor: system
        preconditions:
          - "obligation_count >= 2"
          - "1 <= resolved_obligation_count < obligation_count"
          - "no obligation of this deal has status == MISSED"
        side_effects:
          - "increments SponsorshipDeal.version by 1"
        note: "Purely derived: the commercial axis (deal_status) is untouched."
      - from: PARTIAL
        to: COMPLETE
        trigger: "POST /sponsorship-deals/{id}/obligations/{id}/resolve (bubble-up recompute)"
        actor: system
        preconditions:
          - "resolved_obligation_count == obligation_count"
          - "no obligation of this deal has status == MISSED"
        side_effects:
          - "CASCADE LINK 2: when fulfillment_credited == false, adds SponsorshipPackage.priority_point_value to Exhibitor.sponsorship_fulfillment_points and sets fulfillment_credited = true"
          - "CASCADE LINK 3: recomputes Exhibitor.provisional_priority_points and Exhibitor.priority_tier from the new sponsorship_fulfillment_points"
          - "increments SponsorshipDeal.version and Exhibitor.version by 1"
      - from: NOT_STARTED
        to: COMPLETE
        trigger: "POST /sponsorship-deals/{id}/obligations/{id}/resolve on a single-obligation deal"
        actor: system
        preconditions:
          - "obligation_count == 1"
          - "resolved_obligation_count == 1"
        side_effects:
          - "identical to PARTIAL -> COMPLETE, including CASCADE LINK 2 and LINK 3"
          - "increments SponsorshipDeal.version and Exhibitor.version by 1"
      - from: PARTIAL
        to: BREACHED
        trigger: "Show ON_SITE -> CLOSED sweep marking a PENDING obligation MISSED"
        actor: system
        preconditions:
          - "deal_status == SIGNED"
          - "at least one obligation of this deal has status == MISSED"
        side_effects:
          - "CASCADE LINK 2: adds BREACH_PENALTY_POINTS to Exhibitor.penalty_points"
          - "CASCADE LINK 3: recomputes Exhibitor.provisional_priority_points, certified_priority_points and priority_tier; when Exhibitor.penalty_points >= SUSPENSION_PENALTY_THRESHOLD the exhibitor transitions ACTIVE -> SUSPENDED"
          - "increments SponsorshipDeal.version and Exhibitor.version by 1"
        note: "Applies identically from NOT_STARTED; the from-set is {NOT_STARTED, PARTIAL}."

  - entity: FulfillmentObligation
    initial_state: PENDING
    terminal_states: [DELIVERED, WAIVED, MISSED]
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /sponsorship-deals/{id}/obligations/{id}/resolve with disposition DELIVERED"
        actor: FloorManager | ShowDirector
        preconditions:
          - "status == PENDING"
          - "SponsorshipDeal.deal_status == SIGNED"
        side_effects:
          - "writes resolved_by_user_id and note"
          - "CASCADE LINK 1: recomputes SponsorshipDeal.resolved_obligation_count and fulfillment_status, which fires the deal's fulfillment-axis transition and its own links"
          - "increments FulfillmentObligation.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /sponsorship-deals/{id}/obligations/{id}/resolve with disposition WAIVED"
        actor: ShowDirector
        preconditions:
          - "status == PENDING"
          - "SponsorshipDeal.deal_status == SIGNED"
          - "note is present and non-empty"
        side_effects:
          - "writes resolved_by_user_id and note"
          - "CASCADE LINK 1: identical to the DELIVERED branch — a waived obligation counts as resolved for fulfillment_status"
          - "increments FulfillmentObligation.version by 1"
        note: "Only a ShowDirector may waive; a FloorManager attempting disposition WAIVED is rejected with ERR_ROLE_NOT_PERMITTED."
      - from: PENDING
        to: MISSED
        trigger: "Show ON_SITE -> CLOSED sweep"
        actor: system
        preconditions:
          - "status == PENDING"
          - "SponsorshipDeal.deal_status == SIGNED"
        side_effects:
          - "recomputes SponsorshipDeal.fulfillment_status to BREACHED and fires that transition's links"
          - "increments FulfillmentObligation.version by 1"

  - entity: Registration
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /shows/{id}/registrations (automatic screening)"
        actor: system
        preconditions:
          - "category IN {PRESS, EXHIBITOR_STAFF} (bypass), or qualification_score >= QUALIFY_SCORE_MIN"
        side_effects:
          - "writes qualification_score per calculations.registration_qualification_score"
          - "increments Registration.version by 1"
      - from: PENDING
        to: WAITLISTED
        trigger: "POST /shows/{id}/registrations (automatic screening)"
        actor: system
        preconditions:
          - "category NOT IN {PRESS, EXHIBITOR_STAFF}"
          - "WAITLIST_SCORE_MIN <= qualification_score < QUALIFY_SCORE_MIN"
        side_effects:
          - "writes qualification_score"
          - "increments Registration.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /shows/{id}/registrations (automatic screening)"
        actor: system
        preconditions:
          - "category NOT IN {PRESS, EXHIBITOR_STAFF}"
          - "qualification_score < WAITLIST_SCORE_MIN"
        side_effects:
          - "writes qualification_score"
          - "increments Registration.version by 1"
      - from: WAITLISTED
        to: QUALIFIED
        trigger: "POST /registrations/{id}/screen with decision QUALIFIED"
        actor: ShowDirector
        preconditions:
          - "qualification_status == WAITLISTED"
          - "Show.status IN {PLANNING, SPACE_SELECTION, SELLING, ON_SITE}"
          - "reason is present and non-empty"
        side_effects:
          - "writes screening_override_reason; qualification_score is NOT recomputed"
          - "increments Registration.version by 1"
      - from: WAITLISTED
        to: REJECTED
        trigger: "POST /registrations/{id}/screen with decision REJECTED"
        actor: ShowDirector
        preconditions:
          - "qualification_status == WAITLISTED"
          - "Show.status IN {PLANNING, SPACE_SELECTION, SELLING, ON_SITE}"
          - "reason is present and non-empty"
        side_effects:
          - "writes screening_override_reason"
          - "increments Registration.version by 1"

  - entity: RuleViolation
    initial_state: OPEN
    terminal_states: [UPHELD, WAIVED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /rule-violations/{id}/adjudicate with disposition UPHELD"
        actor: ShowDirector
        preconditions:
          - "status == OPEN"
          - "X-User-ID != reported_by_user_id (segregation of duties)"
        side_effects:
          - "writes adjudicated_by_user_id and penalty_points = PENALTY_POINTS[violation_type]"
          - "CASCADE LINK 1: adds penalty_points to Exhibitor.penalty_points"
          - "CASCADE LINK 2: recomputes Exhibitor.provisional_priority_points, certified_priority_points and priority_tier; when Exhibitor.penalty_points >= SUSPENSION_PENALTY_THRESHOLD the exhibitor transitions ACTIVE -> SUSPENDED"
          - "CASCADE LINK 3: recomputes Show.upheld_violation_count and Show.floor_posture (three upheld violations freeze an ON_SITE floor)"
          - "increments RuleViolation.version, Exhibitor.version and Show.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /rule-violations/{id}/adjudicate with disposition WAIVED"
        actor: ShowDirector
        preconditions:
          - "status == OPEN"
          - "X-User-ID != reported_by_user_id (segregation of duties)"
          - "waiver_reason is present and non-empty"
        side_effects:
          - "writes adjudicated_by_user_id and waiver_reason; penalty_points stays 0"
          - "Exhibitor.penalty_points, Show.upheld_violation_count and Show.floor_posture are unchanged"
          - "increments RuleViolation.version by 1"
        note: "Divergent branch of the same trigger: UPHELD propagates three links, WAIVED propagates none."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:

  - rule_id: space-contract-create-stale-show
    parent_entity: Show
    write_endpoint: "POST /space-contracts"
    occ_field: "expected_show_version"
    description: |
      Creating a SpaceContract converts AVAILABLE booth inventory into HELD
      inventory, so the request is authored against a floor plan the client has
      read. When Show.version has advanced past the value the client observed,
      the client's picture of which booths are still AVAILABLE (and of the
      committed ratio that gates the write) is stale and the create is rejected.
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412

  - rule_id: appointment-exercise-stale-show
    parent_entity: Show
    write_endpoint: "POST /selection-appointments/{id}/exercise"
    occ_field: "expected_show_version"
    description: |
      Exercising a selection appointment picks booths out of the AVAILABLE pool.
      An exercise carrying a Show.version older than the current one was composed
      against a superseded floor plan — the booth the exhibitor is choosing may
      already be held by an earlier exercise — and is rejected.
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412

  - rule_id: space-contract-sign-stale-show
    parent_entity: Show
    write_endpoint: "POST /space-contracts/{id}/sign"
    occ_field: "expected_show_version"
    description: |
      Signing converts HELD inventory into ASSIGNED inventory and can push the
      show's committed ratio across a posture threshold. A sign whose
      expected_show_version predates the current Show.version was decided against
      a stale committed ratio and is rejected.
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412

  - rule_id: booth-combine-stale-show
    parent_entity: Show
    write_endpoint: "POST /booths/{id}/combine"
    occ_field: "expected_show_version"
    description: |
      Combining booths rewrites the show's sellable inventory. A combine carrying
      a superseded Show.version was planned against a floor plan whose booth set
      has since changed and is rejected rather than silently absorbing a booth
      another writer has already held.
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412

  - rule_id: rebook-stale-target-show
    parent_entity: Show
    write_endpoint: "POST /space-contracts/{id}/rebook"
    occ_field: "expected_target_show_version"
    description: |
      An on-site rebook creates a SpaceContract on the *target* edition and holds
      booths there. The OCC field pins the target Show, not the show being
      rebooked from; a stale target version means the next edition's floor plan
      has moved on since the exhibitor was shown it and the rebook is rejected.
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412

  - rule_id: venue-contract-terminate-stale
    parent_entity: VenueContract
    write_endpoint: "POST /venue-contracts/{id}/terminate"
    occ_field: "expected_venue_contract_version"
    description: |
      Termination cascades to every non-terminal Show under the contract, so the
      blast radius is a function of the contract's current child set. A terminate
      carrying a VenueContract.version older than the current one was authorised
      against a smaller blast radius than the one it would execute and is
      rejected.
    error_id: ERR_STALE_VENUE_CONTRACT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: show_net_sellable_sqft
    trigger: "POST /shows/{id}/publish-floor-plan (Show PLANNING -> SPACE_SELECTION)"
    algorithm: aggregation
    formula: |
      net_sellable_sqft = floor(gross_sqft * (100 - aisle_ratio_pct) / 100)
      advance_order_deadline = date(move_in_start) - ADVANCE_ORDER_LEAD_DAYS days
      # Gate evaluated in the same request, BEFORE the write:
      #   sellable_booth_sqft = sum of Booth.area_sqft for booths of this show with status != MERGED
      #   sellable_booth_sqft <= net_sellable_sqft  else ERR_FLOOR_INVENTORY_OVERCOMMITTED
    input_set: "Booths of this show with status != MERGED; MERGED children are excluded because their area has already been folded into the surviving booth"
    constants:
      ADVANCE_ORDER_LEAD_DAYS: 21
      DARK_DAY_BUFFER_DAYS: 2
    precision: "integer square feet, floor (never round up — an aisle may not be narrowed by rounding)"
    variants: []

  - name: booth_space_fee
    trigger: "POST /space-contracts, POST /selection-appointments/{id}/exercise, POST /space-contracts/{id}/negotiate, POST /space-contracts/{id}/rebook; frozen by POST /space-contracts/{id}/sign"
    algorithm: tiered_pricing
    formula: |
      offered_net_sqft = sum of Booth.area_sqft over offered_booth_ids
      volume_tier_pct  = VOLUME_TIER selected by offered_net_sqft:
                           offered_net_sqft >= 4000 -> 12
                           offered_net_sqft >= 2000 -> 8
                           offered_net_sqft >= 1000 -> 5      # >= is inclusive: exactly 1000 sqft earns 5
                           otherwise                -> 0
      total_discount_pct = min(40, volume_tier_pct + approved_discount_pct)
      # PINNED ROUNDING ORDER: round each booth line, THEN sum the rounded lines.
      # (sum-then-round produces a different total and is wrong)
      for each booth b in offered_booth_ids, in offered_booth_ids array order:
          gross_line_exact = b.area_sqft * Show.base_rate_cents_per_sqft
                             * LOCATION_MULT[b.location_class] * ZONE_MULT[b.premium_zone]
          net_line_cents   = round_half_up(gross_line_exact * (100 - total_discount_pct) / 100)
      space_fee_cents  = sum of net_line_cents
      min_deposit_cents = round_half_up(space_fee_cents * MIN_DEPOSIT_PCT / 100)
    input_set: "Exactly the booths listed in SpaceContract.offered_booth_ids at the moment of the recompute; booths released by a re-offer leave the set before the recompute runs"
    constants:
      LOCATION_MULT: { INLINE: 1.00, CORNER: 1.10, PENINSULA: 1.20, ISLAND: 1.30 }
      ZONE_MULT: { NONE: 1.00, MAIN_AISLE: 1.08, ENTRANCE: 1.15, FOOD_COURT: 1.05 }
      VOLUME_TIER_PCT: { "4000": 12, "2000": 8, "1000": 5, "0": 0 }
      MIN_DEPOSIT_PCT: 25
      MAX_NEGOTIATION_ROUNDS: 3
      DISCOUNT_APPROVAL_THRESHOLD_PCT: 10
      MAX_APPROVED_DISCOUNT_PCT: 40
    precision: "whole cents; gross_line_exact carries full precision, round_half_up applied once per booth line"
    variants: []
    note: |
      Three interacting inputs per line (area, location class, premium zone) plus a
      contract-level tier selected from the summed area plus a negotiated discount:
      the same 1000 sqft can cost less than 999 sqft because the tier is a step
      function of the total, not of the line.

  - name: space_contract_invoice_total
    trigger: "every recompute of booth_space_fee, plus SponsorshipDeal PROPOSED->SIGNED and SIGNED->CANCELLED for the same exhibitor on the same show"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED. The bundle tier looks circular — it is selected
      # from a subtotal that the discount then reduces — so the order below is the
      # definition, and re-selecting the tier from invoice_total_cents is WRONG.
      step 1: space_fee_cents               = calculations.booth_space_fee
      step 2: sponsorship_attached_cents    = sum of SponsorshipDeal.negotiated_price_cents
                                              over deals with deal_status == SIGNED whose
                                              exhibitor_id == this contract's exhibitor_id and whose
                                              SponsorshipPackage.show_id == this contract's show_id
      step 3: subtotal_cents                = space_fee_cents + sponsorship_attached_cents
      step 4: bundle_discount_pct           = BUNDLE_TIER selected by subtotal_cents (the PRE-discount value):
                                                subtotal_cents >= 5000000 -> 4
                                                subtotal_cents >= 2000000 -> 2.5
                                                otherwise                 -> 0
      step 5: bundle_discount_cents         = round_half_up(subtotal_cents * bundle_discount_pct / 100)
      step 6: invoice_total_cents           = subtotal_cents - bundle_discount_cents
      # invoice_total_cents may legitimately fall below the tier threshold that
      # selected the discount. That is not an inconsistency to be iterated away.
    input_set: "SIGNED sponsorship deals only; PROPOSED and CANCELLED deals contribute 0 to sponsorship_attached_cents"
    constants:
      BUNDLE_TIER_PCT: { "5000000": 4, "2000000": 2.5, "0": 0 }
    precision: "whole cents, round_half_up once at step 5"
    variants: []

  - name: service_order_line_total
    trigger: "POST /space-contracts/{id}/service-orders"
    algorithm: tiered_pricing
    formula: |
      unit_rate_cents = LABOR             -> VenueContract.labor_rate_cents_per_hour
                        ELECTRICAL        -> VenueContract.electrical_rate_cents_per_amp
                        MATERIAL_HANDLING -> VenueContract.material_handling_rate_cents_per_cwt
      billable_quantity = MATERIAL_HANDLING ? max(quantity, MIN_BILLABLE_CWT) : quantity
      rate_variant      = date(ordered_at) <= Show.advance_order_deadline ? ADVANCE : FLOOR
      ADVANCE: line_total_cents = round_half_up(billable_quantity * unit_rate_cents
                                               * (100 - VenueContract.advance_order_discount_pct) / 100)
      FLOOR:   line_total_cents = round_half_up(billable_quantity * unit_rate_cents
                                               * FLOOR_RATE_MULTIPLIER) + EXPEDITE_FEE_CENTS
    input_set: "The order's own quantity and service_type, the rate card on the Show's VenueContract, and the logical clock at acceptance. Cancelled orders keep their computed line_total_cents for the record but are excluded from any billing aggregate."
    constants:
      MIN_BILLABLE_CWT: 2
      FLOOR_RATE_MULTIPLIER: 1.35
      EXPEDITE_FEE_CENTS: 7500
    precision: "whole cents, round_half_up applied to the rate product before the flat expedite fee is added"
    variants:
      - name: ADVANCE
        when: "date(ordered_at) <= Show.advance_order_deadline"
        difference: "the advance_order_discount_pct from the venue rate card is subtracted and no expedite fee applies"
      - name: FLOOR
        when: "date(ordered_at) > Show.advance_order_deadline"
        difference: "the rate is multiplied by FLOOR_RATE_MULTIPLIER and a flat EXPEDITE_FEE_CENTS is added AFTER rounding, so the same quantity costs strictly more than under ADVANCE for every positive rate"

  - name: exhibitor_priority_points
    trigger: "SpaceContract OFFERED->SIGNED, SIGNED->CANCELLED, SIGNED->CLOSED_OUT; SponsorshipDeal PROPOSED->SIGNED, SIGNED->CANCELLED; SponsorshipDeal fulfillment PARTIAL->COMPLETE and NOT_STARTED->COMPLETE; RuleViolation OPEN->UPHELD; SelectionAppointment ACTIVE->FORFEITED; POST /exhibitors/{id}/priority-point-adjustments"
    algorithm: weighted_scoring
    formula: |
      # Shared terms (both variants)
      ledger        = Exhibitor.ledger_points                     # sum of posted adjustments
      fulfillment   = Exhibitor.sponsorship_fulfillment_points
      penalties     = Exhibitor.penalty_points
      contract_points(c) = floor(effective_sqft(c) / SQFT_PER_POINT_BLOCK) * POINTS_PER_BLOCK
                           + (REBOOK_BONUS_POINTS if c.rebooked_from_space_contract_id != null else 0)
      deal_points(d)     = floor(d.negotiated_price_cents / CENTS_PER_SPEND_POINT)

      # PROVISIONAL variant (forward-looking)
      provisional_set   = SpaceContracts of this exhibitor with status IN {OFFERED, COUNTERED, SIGNED}
                          whose Show.status IN {PLANNING, SPACE_SELECTION, SELLING, ON_SITE}
      effective_sqft(c) = c.assigned_net_sqft if c.status == SIGNED else c.offered_net_sqft
      space_points_provisional = sum of contract_points(c) over provisional_set
      spend_provisional = sum of deal_points(d) over SponsorshipDeals of this exhibitor with deal_status == SIGNED
      provisional_priority_points = max(0, ledger + space_points_provisional + spend_provisional
                                            + fulfillment - penalties)

      # CERTIFIED variant (closed book, decayed)
      certified_set     = SpaceContracts of this exhibitor with status == CLOSED_OUT whose Show.status == CLOSED
      edition_age(c)    = year(current logical clock) - c.Show.edition_year
      certified_contribution(c) = floor(contract_points(c) * CERTIFIED_DECAY_FACTOR)
                                    if edition_age(c) > CERTIFIED_DECAY_EDITION_AGE
                                  else contract_points(c)
      space_points_certified = sum of certified_contribution(c) over certified_set
      spend_certified   = sum of deal_points(d) over SponsorshipDeals of this exhibitor with
                          deal_status == SIGNED whose SponsorshipPackage.show_id has Show.status == CLOSED
      certified_priority_points = max(0, ledger + space_points_certified + spend_certified
                                          + fulfillment - penalties)

      priority_tier = provisional_priority_points >= 1000 -> PLATINUM
                      provisional_priority_points >=  600 -> GOLD
                      provisional_priority_points >=  300 -> SILVER
                      otherwise                           -> BRONZE
    input_set: "Every term is floored independently before summation, so the sum is order-insensitive and needs no processing-order tie-break. The status filters above are exhaustive: a contract that is neither in provisional_set nor certified_set contributes to neither variant."
    constants:
      SQFT_PER_POINT_BLOCK: 100
      POINTS_PER_BLOCK: 2
      REBOOK_BONUS_POINTS: 5
      CENTS_PER_SPEND_POINT: 500000
      CERTIFIED_DECAY_EDITION_AGE: 3
      CERTIFIED_DECAY_FACTOR: 0.5
      TIER_FLOORS: { PLATINUM: 1000, GOLD: 600, SILVER: 300, BRONZE: 0 }
    precision: "integer points; every division is floored, the final value is floored at 0"
    variants:
      - name: PROVISIONAL
        when: "read as Exhibitor.provisional_priority_points; used for tiering, sales dashboards and the rebook bonus display"
        difference: "counts unsigned OFFERED/COUNTERED holds at their offered_net_sqft and signed contracts on still-open shows; applies no age decay"
      - name: CERTIFIED
        when: "read as Exhibitor.certified_priority_points; the ONLY input to space-selection ranking"
        difference: "counts only CLOSED_OUT contracts on CLOSED shows and halves (floored) the contribution of editions more than CERTIFIED_DECAY_EDITION_AGE years old, so the same exhibitor's two standings diverge whenever any contract is still open"

  - name: booth_selector
    trigger: "POST /space-contracts and POST /selection-appointments/{id}/exercise when booth_ids is omitted; POST /space-contracts/{id}/rebook when booth_ids is omitted"
    algorithm: threshold
    formula: |
      # ELIGIBILITY FILTER (all conditions required)
      candidates = Booth where show_id == target Show.id
                     AND status == AVAILABLE
                     AND combined_parent_booth_id == null
                     AND area_sqft >= requested_sqft
                     AND (premium_placement_requested == true OR premium_zone != ENTRANCE)
      # RANKING (total order; no id, uuid or insertion pointer participates)
      if premium_placement_requested == false:
          ORDER BY area_sqft ASC, LOCATION_RANK[location_class] ASC, booth_number ASC
      else:
          ORDER BY ZONE_RANK[premium_zone] ASC, area_sqft ASC,
                   LOCATION_RANK[location_class] ASC, booth_number ASC
      # TIE-BREAK: booth_number ASC, compared as a case-sensitive byte-wise string.
      # booth_number is unique per show, so the order is total and the winner is unique.
      selected = the single first-ranked candidate
      # EMPTY-POOL FALLBACK: candidates empty -> no booth is held, no partial write is
      # made, and the request fails with ERR_NO_ELIGIBLE_BOOTH (422).
    input_set: "Only AVAILABLE, un-merged booths of the target show. HELD, ASSIGNED and MERGED booths are never candidates, and a booth of a different show is never a candidate even when the caller names it explicitly."
    constants:
      LOCATION_RANK: { INLINE: 1, CORNER: 2, PENINSULA: 3, ISLAND: 4 }
      ZONE_RANK: { ENTRANCE: 1, MAIN_AISLE: 2, FOOD_COURT: 3, NONE: 4 }
    precision: "n/a — selection, not arithmetic"
    variants: []
    note: |
      Non-premium requests are steered to the smallest sufficient inline space, so a
      buyer who does not pay for placement can never be handed an ENTRANCE booth by
      the selector; premium requests invert the primary key to zone rank.

  - name: selection_appointment_rank
    trigger: "POST /shows/{id}/advance-selection-round"
    algorithm: chronological
    formula: |
      # ELIGIBILITY FILTER
      candidates = SelectionAppointment where show_id == this show
                     AND state == SCHEDULED
                     AND round_index == Show.selection_round after the increment
                     AND Exhibitor.status == ACTIVE
                     AND window_end > current logical clock
      # certified_points_at_rank is snapshotted onto each candidate from
      # Exhibitor.certified_priority_points at ranking time, so later point movement
      # does not reshuffle a round already in progress.
      ORDER BY certified_points_at_rank DESC,
               Exhibitor.consecutive_years DESC,
               Exhibitor.created_at ASC
      rank = 1-based position in that order
      # TIE-BREAK: Exhibitor.created_at ASC — the longest-registered exhibitor wins a
      # dead heat. Exhibitor.id is NEVER consulted.
      # EMPTY-POOL FALLBACK: no candidates -> the round still advances, selection_round
      # increments, and zero ranks are written. The request succeeds with 200.
      # AGGREGATE CAP: only the first Show.selection_desk_capacity ranks are moved to
      # ACTIVE by this call; ranks beyond the cap stay SCHEDULED for the next round.
    input_set: "SCHEDULED appointments of the round being opened whose exhibitor is ACTIVE and whose window has not already closed. A SUSPENDED exhibitor is filtered out and its appointment is expired rather than ranked."
    constants: {}
    precision: "integer rank starting at 1"
    variants: []

  - name: show_floor_posture
    trigger: "recomputed after every write that changes Show.held_net_sqft, Show.assigned_net_sqft, Show.sellable_booth_sqft, Show.status or Show.upheld_violation_count"
    algorithm: threshold
    formula: |
      committed_ratio_pct = 0 if sellable_booth_sqft == 0
                            else round_half_up(100 * (held_net_sqft + assigned_net_sqft)
                                                   / sellable_booth_sqft)
      floor_posture = FROZEN       if committed_ratio_pct >= FROZEN_RATIO_PCT
                                      or (status == ON_SITE
                                          and upheld_violation_count >= ONSITE_FREEZE_VIOLATIONS)
                      SPACE_LOCKED else if committed_ratio_pct >= SPACE_LOCKED_RATIO_PCT
                      OPEN         otherwise
      available_net_sqft = sellable_booth_sqft - held_net_sqft - assigned_net_sqft
      # Posture gates (each returns its own error, never a generic one):
      #   FROZEN       blocks POST /space-contracts, /exercise, /rebook and booth creation
      #                -> ERR_SHOW_FLOOR_FROZEN
      #   SPACE_LOCKED blocks booth creation -> ERR_SHOW_FLOOR_SPACE_LOCKED and caps a
      #                re-offer's approved_discount_pct at DISCOUNT_APPROVAL_THRESHOLD_PCT
      # Posture NEVER blocks signing, cancelling or closing out an existing hold, so a
      # frozen floor can still be worked down to OPEN.
    input_set: "The show's own denormalized area ledger and upheld violation counter; no scan of child rows is required, which is why show_booth_area_conservation must hold after every write"
    constants:
      SPACE_LOCKED_RATIO_PCT: 85
      FROZEN_RATIO_PCT: 100
      ONSITE_FREEZE_VIOLATIONS: 3
    precision: "integer percent, round_half_up"
    variants: []

  - name: show_attrition_settlement
    trigger: "POST /shows/{id}/transition with target_status CLOSED (Show ON_SITE -> CLOSED)"
    algorithm: threshold
    formula: |
      committed          = VenueContract.committed_net_sqft_per_year
      allowance_sqft     = floor(committed * VenueContract.attrition_allowance_pct / 100)
      forgiven_floor_sqft = committed - allowance_sqft
      actual_net_sqft    = sum of SpaceContract.assigned_net_sqft over contracts of this
                           show with status IN {SIGNED, CLOSED_OUT}
      attrition_shortfall_sqft   = max(0, forgiven_floor_sqft - actual_net_sqft)
      attrition_settlement_cents = attrition_shortfall_sqft * ATTRITION_RATE_CENTS_PER_SQFT
      # actual_net_sqft exactly equal to forgiven_floor_sqft owes NOTHING; one square
      # foot below owes ATTRITION_RATE_CENTS_PER_SQFT. The floor is inclusive.
    input_set: "SIGNED and CLOSED_OUT contracts only. CANCELLED contracts do not count toward the venue commitment even though they once did, which is exactly how a late cancellation creates an attrition bill."
    constants:
      ATTRITION_RATE_CENTS_PER_SQFT: 1800
    precision: "integer square feet (allowance floored, favouring the venue), whole cents"
    variants: []

  - name: space_contract_cancellation_fee
    trigger: "POST /space-contracts/{id}/cancel; also computed (as zero) on the cascade path from Show CANCELLED and VenueContract TERMINATED"
    algorithm: waterfall_allocation
    formula: |
      # Step 1 — liability
      if the cancel is a cascade from Show->CANCELLED or VenueContract->TERMINATED:
          cancellation_fee_cents = 0          # the producer cancelled, not the exhibitor
      else if status_before IN {OFFERED, COUNTERED}:
          cancellation_fee_cents = 0          # an unsigned hold carries no penalty
      else:                                    # status_before == SIGNED
          days_out = number of whole days from date(current logical clock)
                     to date(Show.event_start), i.e. date(event_start) - date(now)
          bucket   = the first entry of CANCELLATION_FEE_SCHEDULE, scanned in
                     min_days_out DESC order, whose min_days_out <= days_out;
                     if days_out < 0 the min_days_out == 0 bucket is used
          cancellation_fee_cents = round_half_up(space_fee_cents * bucket.pct / 100)
      # Step 2 — waterfall against money already collected (order is pinned)
      fee_applied_to_deposit_cents = min(cancellation_fee_cents, deposit_paid_cents)
      refund_cents                 = deposit_paid_cents - fee_applied_to_deposit_cents
      balance_due_cents            = cancellation_fee_cents - fee_applied_to_deposit_cents
      # The deposit bucket fills the fee first; only the overflow becomes a balance due,
      # and only the remainder is refunded. Exactly one of refund_cents and
      # balance_due_cents can be non-zero.
    input_set: "The contract's own frozen space_fee_cents (not invoice_total_cents — sponsorship is billed on its own deal) and deposit_paid_cents, plus the venue's schedule and the logical clock"
    constants:
      CANCELLATION_FEE_SCHEDULE: "VenueContract.cancellation_fee_schedule, an array of {min_days_out, pct} objects; the seeded default is [{min_days_out: 180, pct: 25}, {min_days_out: 90, pct: 50}, {min_days_out: 0, pct: 100}]"
    precision: "whole cents, round_half_up once at step 1"
    variants: []

  - name: registration_qualification_score
    trigger: "POST /shows/{id}/registrations and POST /registrations/{id}/screen"
    algorithm: weighted_scoring
    formula: |
      if category IN {PRESS, EXHIBITOR_STAFF}:
          qualification_score = 0
          qualification_status = QUALIFIED        # credentialed bypass, not a buyer score
      else:
          authority_pts = AUTHORITY_PTS[purchasing_authority]
          spend_pts     = SPEND_PTS[annual_spend_band]
          title_pts     = TITLE_MATCH_PTS if any keyword in BUYER_TITLE_KEYWORDS occurs as a
                          case-insensitive substring of job_title else 0
          raw           = authority_pts + spend_pts + title_pts
          qualification_score = round_half_up(raw * CATEGORY_WEIGHT[category])
          qualification_status = QUALIFIED   if qualification_score >= QUALIFY_SCORE_MIN
                                 WAITLISTED  if qualification_score >= WAITLIST_SCORE_MIN
                                 REJECTED    otherwise
      # An override supplied to /screen sets qualification_status directly and records
      # screening_override_reason, but qualification_score is still computed and stored
      # so the report can tell scored-and-passed from overridden.
    input_set: "The registration's own declared purchasing_authority, annual_spend_band, job_title and category. Nothing about the exhibitor or the show enters the score."
    constants:
      AUTHORITY_PTS: { NONE: 0, INFLUENCER: 15, RECOMMENDER: 25, DECISION_MAKER: 40 }
      SPEND_PTS: { UNDER_50K: 5, K50_250K: 15, K250K_1M: 25, OVER_1M: 35 }
      TITLE_MATCH_PTS: 10
      BUYER_TITLE_KEYWORDS: ["CHIEF", "VP", "VICE PRESIDENT", "DIRECTOR", "HEAD OF", "BUYER", "OWNER", "PARTNER"]
      CATEGORY_WEIGHT: { BUYER: 1.00, VIP_BUYER: 1.15, STUDENT: 0.50 }
      QUALIFY_SCORE_MIN: 60
      WAITLIST_SCORE_MIN: 40
    precision: "integer score; the category weight is applied to the summed raw points once, then round_half_up. Weighting each component separately and summing is a different number and is wrong."
    variants: []

  - name: sponsorship_fulfillment_status
    trigger: "POST /sponsorship-deals/{id}/sign, POST /sponsorship-deals/{id}/obligations/{id}/resolve, POST /shows/{id}/transition with target_status CLOSED"
    algorithm: aggregation
    formula: |
      obs            = FulfillmentObligations of this deal
      obligation_count        = count(obs)
      resolved_obligation_count = count of obs with status IN {DELIVERED, WAIVED}
      fulfillment_status =
          NOT_STARTED  if obligation_count == 0
          BREACHED     else if any ob.status == MISSED
          COMPLETE     else if resolved_obligation_count == obligation_count
          NOT_STARTED  else if resolved_obligation_count == 0
          PARTIAL      otherwise
      # BREACHED outranks COMPLETE-by-count: a single MISSED obligation cannot be
      # papered over by waiving the rest.
      # On the NOT_STARTED->COMPLETE and PARTIAL->COMPLETE edges only, the deal credits
      # SponsorshipPackage.priority_point_value to Exhibitor.sponsorship_fulfillment_points
      # and sets fulfillment_credited = true. The credit is guarded by fulfillment_credited
      # so re-entering COMPLETE can never double-credit.
    input_set: "The deal's own obligations. WAIVED counts as resolved (the producer released the obligation); MISSED is sticky and is only set by show close."
    constants: {}
    precision: "integer counts"
    variants: []

  - name: show_post_show_report
    trigger: "GET /shows/{id}/post-show-report"
    algorithm: aggregation
    formula: |
      # Requires Show.status == CLOSED, else ERR_SHOW_NOT_CLOSED (409).
      regs                    = Registrations of this show
      total_registrations     = count(regs)
      qualified_registrations = count of regs with qualification_status == QUALIFIED
      attended_registrations  = count of regs with lead_scan_count >= 1
      qualified_attended      = count of regs with qualification_status == QUALIFIED
                                and lead_scan_count >= 1
      attendance_quality_index = 0 if attended_registrations == 0
                                 else round_half_up(100 * qualified_attended
                                                        / attended_registrations)

      report_contracts = SpaceContracts of this show with status IN {SIGNED, CLOSED_OUT}
      for each c in report_contracts, ordered by SpaceContract.created_at ASC:
          lead_count           = count of LeadScan with space_contract_id == c.id
          qualified_lead_count = count of those scans whose Registration
                                 .qualification_status == QUALIFIED
          exhibitor_lead_quality_pct = 0 if lead_count == 0
                                       else round_half_up(100 * qualified_lead_count / lead_count)
      # PINNED ROUNDING ORDER: round EACH contract's percentage first, then average the
      # rounded percentages, then round the average. Pooling every scan
      # (sum(qualified_lead_count) / sum(lead_count)) yields a DIFFERENT number and is wrong.
      scored_contracts = report_contracts with lead_count >= 1
      show_lead_quality_index = 0 if scored_contracts is empty
                                else round_half_up(
                                       sum of exhibitor_lead_quality_pct over scored_contracts
                                       / count(scored_contracts))
      total_lead_scans = sum of lead_count over report_contracts
      # A signed exhibitor who scanned nothing is present in exhibitor_lines with
      # lead_count 0 and exhibitor_lead_quality_pct 0, but is EXCLUDED from the
      # show_lead_quality_index denominator. Including it would dilute every honest
      # exhibitor's number toward zero.
      attrition_shortfall_sqft   = Show.attrition_shortfall_sqft   (frozen at close)
      attrition_settlement_cents = Show.attrition_settlement_cents (frozen at close)
    input_set: "SIGNED and CLOSED_OUT contracts of a CLOSED show plus every registration of that show; CANCELLED contracts and their orphaned scans are excluded from every figure"
    constants: {}
    precision: "integer percent everywhere; two rounding passes for show_lead_quality_index (per contract, then on the mean)"
    variants: []

  # --- Conserved quantities: each is an explicit formula over stored fields that must
  # --- hold after EVERY write, and must return to its pre-operation value after a
  # --- compensating pair (hold/release, sign/cancel, propose/cancel, credit/reverse).

  - name: show_booth_area_conservation
    trigger: "asserted after every write that touches a Booth.status or a SpaceContract's booth set: POST /space-contracts, /exercise, /negotiate, /rebook, /sign, /cancel, the CLOSED_OUT cascade at show close, POST /shows/{id}/booths, POST /booths/{id}/combine"
    algorithm: aggregation
    formula: |
      INVARIANT A (partition of the floor):
        Show.sellable_booth_sqft == Show.available_net_sqft + Show.held_net_sqft
                                    + Show.assigned_net_sqft
      INVARIANT B (ledger agrees with the rows):
        Show.held_net_sqft     == sum of Booth.area_sqft over booths of the show with status == HELD
        Show.assigned_net_sqft == sum of Booth.area_sqft over booths of the show with status == ASSIGNED
        Show.available_net_sqft == sum of Booth.area_sqft over booths with status == AVAILABLE
      INVARIANT C (merge conserves area):
        combining child booths into a parent sets each child to MERGED and adds each
        child's area_sqft to the parent's area_sqft; Show.sellable_booth_sqft is unchanged
        by a combine, because MERGED booths leave the partition exactly as their area
        enters the survivor.
      INVARIANT D (compensation, no drift):
        for any contract, the sequence sign -> cancel returns all three of
        available_net_sqft / held_net_sqft / assigned_net_sqft to the exact values they
        held immediately before the corresponding hold was taken.
    input_set: "All booths of the show; MERGED booths are excluded from every term of invariants A and B"
    constants: {}
    precision: "exact integer square feet; no rounding is permitted anywhere in the area ledger"
    variants: []

  - name: sponsorship_inventory_conservation
    trigger: "asserted after POST /sponsorship-packages/{id}/deals, POST /sponsorship-deals/{id}/sign and POST /sponsorship-deals/{id}/cancel"
    algorithm: aggregation
    formula: |
      INVARIANT A: SponsorshipPackage.inventory_total ==
                   SponsorshipPackage.inventory_committed + SponsorshipPackage.inventory_available
      INVARIANT B: inventory_committed == count of SponsorshipDeals of the package with
                   deal_status IN {PROPOSED, SIGNED}
                   (a unit is consumed at PROPOSE, not at SIGN — a proposal holds the slot)
      INVARIANT C: 0 <= inventory_available <= inventory_total at all times
      INVARIANT D: propose -> cancel restores inventory_committed and inventory_available
                   to their exact pre-propose values
    input_set: "Deals of the package; CANCELLED deals release their unit and are excluded from inventory_committed"
    constants:
      MAX_SPONSOR_DISCOUNT_PCT: 20
      OBLIGATION_LEAD_DAYS: 14
    precision: "exact integer unit counts"
    variants: []

  - name: space_contract_deposit_conservation
    trigger: "asserted after POST /space-contracts/{id}/deposits and POST /space-contracts/{id}/cancel"
    algorithm: aggregation
    formula: |
      INVARIANT A (every collected cent is accounted for):
        SpaceContract.deposit_paid_cents ==
            SpaceContract.refund_cents + SpaceContract.fee_applied_to_deposit_cents
      INVARIANT B (the fee is fully split):
        SpaceContract.cancellation_fee_cents ==
            SpaceContract.fee_applied_to_deposit_cents + SpaceContract.balance_due_cents
      INVARIANT C: refund_cents == 0 OR balance_due_cents == 0  (never both non-zero)
      INVARIANT D: deposit_paid_cents == sum of accepted deposit amounts, and while the
                   contract is not CANCELLED, refund_cents == 0 and
                   fee_applied_to_deposit_cents == 0 and balance_due_cents == 0
    input_set: "The contract's own money fields; no cross-contract netting is ever performed"
    constants: {}
    precision: "exact whole cents; the split is computed with min() and subtraction only, so it cannot lose a cent to rounding"
    variants: []

  - name: exhibitor_point_ledger_conservation
    trigger: "asserted after every write that can move a point: SpaceContract sign/cancel and the CLOSED_OUT cascade, SponsorshipDeal sign/cancel, obligation resolve, RuleViolation uphold/waive, appointment forfeit, POST /exhibitors/{id}/priority-point-adjustments"
    algorithm: aggregation
    formula: |
      INVARIANT A (the tally equals its parts):
        Exhibitor.provisional_priority_points == max(0,
            Exhibitor.ledger_points
          + Exhibitor.space_points_provisional
          + Exhibitor.sponsorship_fulfillment_points
          - Exhibitor.penalty_points)
        where space_points_provisional is itself the sum of SpaceContract.points_awarded
        over the exhibitor's contracts in provisional_set plus the sponsorship spend term
      INVARIANT B (per-contract attribution):
        SpaceContract.points_awarded == the contract's contract_points contribution while
        the contract is in provisional_set, and exactly 0 once it is CANCELLED
      INVARIANT C (compensation, no drift):
        sign -> cancel returns Exhibitor.provisional_priority_points and
        Exhibitor.priority_tier to their exact pre-sign values, and sets the contract's
        points_awarded back to 0
      INVARIANT D (penalties are additive and never negative):
        Exhibitor.penalty_points == sum of RuleViolation.penalty_points over the
        exhibitor's violations with status == UPHELD, plus FORFEIT_PENALTY_POINTS per
        FORFEITED appointment, plus BREACH_PENALTY_POINTS per BREACHED deal;
        waiving a violation subtracts exactly what upholding it added
    input_set: "The exhibitor's own denormalized point fields, reconciled against the child rows that produced them"
    constants:
      PENALTY_POINTS: { BOOTH_HEIGHT: 10, NOISE: 5, AISLE_ENCROACHMENT: 8, SALES_CONDUCT: 15 }
      FORFEIT_PENALTY_POINTS: 3
      BREACH_PENALTY_POINTS: 20
      SUSPENSION_PENALTY_THRESHOLD: 30
    precision: "exact integer points; the max(0, ...) clamp is applied only to the published totals, never to the underlying penalty_points counter"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ---------------------------------------------------------------------------
validations:

  # --- request shape (structural parsing precedes every semantic check) ------
  - priority: 1
    category: business_constraint
    check: "Request body parses, every required input field for the endpoint is present, every enum field holds a declared value, every *_cents / *_sqft / *_pct / quantity field is an integer in range (pct fields 0..100, money and area fields >= 0, quantity >= 1), and every *_at / *_date field is a valid ISO-8601 UTC timestamp or date"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all
    note: "Structural, single-field checks only. Nothing here consults the database, which is why it outranks existence."

  # --- authentication / authorization ---------------------------------------
  - priority: 2
    category: auth
    check: "X-Role header is present and holds one of ShowDirector | SalesRep | FloorManager | Exhibitor | Registrant"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The X-Role value appears in the endpoint's declared roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: "When X-Role is Exhibitor, X-Role-Id is present and resolves to an existing Exhibitor row (identity: entity_backed:Exhibitor)"
    error_id: ERR_IDENTITY_REQUIRED
    http_status: 403
    applies_to: "every endpoint whose roles include Exhibitor"
  - priority: 5
    category: auth
    check: "When X-Role is Exhibitor, the addressed SpaceContract / SelectionAppointment / SponsorshipDeal / Booth belongs to that exhibitor (SpaceContract.exhibitor_id == X-Role-Id, and for a Booth its space_contract_id resolves to such a contract)"
    error_id: ERR_EXHIBITOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /space-contracts/{id}/negotiate, /sign, /deposits, /cancel, /rebook, /service-orders, /lead-scans; POST /selection-appointments/{id}/exercise; POST /sponsorship-deals/{id}/cancel"
  - priority: 6
    category: auth
    check: "The X-User-ID signing a SponsorshipDeal differs from SponsorshipDeal.proposed_by_user_id"
    error_id: ERR_SOD_SPONSORSHIP_SIGN
    http_status: 403
    applies_to: "POST /sponsorship-deals/{id}/sign"
    note: "Segregation of duties leg 1: the operator who packaged and priced the sponsorship may not be the operator who commits the show to it."
  - priority: 7
    category: auth
    check: "The X-User-ID adjudicating a RuleViolation differs from RuleViolation.reported_by_user_id"
    error_id: ERR_SOD_VIOLATION_ADJUDICATION
    http_status: 403
    applies_to: "POST /rule-violations/{id}/adjudicate"
    note: "Segregation of duties leg 2: the floor manager who wrote the citation may not rule on it, for either disposition."
  - priority: 8
    category: auth
    check: "When a REOFFER carries approved_discount_pct > DISCOUNT_APPROVAL_THRESHOLD_PCT, the approving X-User-ID differs from SpaceContract.last_offer_by_user_id"
    error_id: ERR_SOD_DISCOUNT_APPROVAL
    http_status: 403
    applies_to: "POST /space-contracts/{id}/negotiate with action REOFFER"
    note: "Segregation of duties leg 3: the operator who made the previous offer may not self-approve the deep discount on the next one."

  # --- existence (path resources first, then body references) ---------------
  - priority: 9
    category: existence
    check: "The VenueContract addressed by the path exists"
    error_id: ERR_VENUE_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /venue-contracts/{id}, GET /venue-contracts/{id}/shows, POST /venue-contracts/{id}/execute, POST /venue-contracts/{id}/terminate; also the body reference venue_contract_id on POST /shows"
  - priority: 10
    category: existence
    check: "The Show addressed by the path exists"
    error_id: ERR_SHOW_NOT_FOUND
    http_status: 404
    applies_to: "every /shows/{id}... endpoint; also the body reference show_id on POST /space-contracts"
  - priority: 11
    category: existence
    check: "The Exhibitor addressed by the path or referenced by exhibitor_id in the body exists"
    error_id: ERR_EXHIBITOR_NOT_FOUND
    http_status: 404
    applies_to: "GET /exhibitors/{id}, POST /exhibitors/{id}/priority-point-adjustments, POST /exhibitors/{id}/reinstate; body reference exhibitor_id on POST /space-contracts, POST /shows/{id}/selection-appointments, POST /sponsorship-packages/{id}/deals"
  - priority: 12
    category: existence
    check: "Every booth id in the body's booth_ids array, and the Booth addressed by the path, exists"
    error_id: ERR_BOOTH_NOT_FOUND
    http_status: 404
    applies_to: "GET /booths/{id}, POST /booths/{id}/combine; body reference booth_ids on POST /space-contracts, POST /space-contracts/{id}/negotiate, POST /space-contracts/{id}/rebook, POST /selection-appointments/{id}/exercise, POST /booths/{id}/combine"
  - priority: 13
    category: existence
    check: "The SpaceContract addressed by the path exists"
    error_id: ERR_SPACE_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "every /space-contracts/{id}... endpoint"
  - priority: 14
    category: existence
    check: "The SelectionAppointment addressed by the path exists"
    error_id: ERR_APPOINTMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /selection-appointments/{id}, POST /selection-appointments/{id}/exercise"
  - priority: 15
    category: existence
    check: "The SponsorshipPackage addressed by the path exists"
    error_id: ERR_SPONSORSHIP_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "POST /sponsorship-packages/{id}/deals"
  - priority: 16
    category: existence
    check: "The SponsorshipDeal addressed by the path exists"
    error_id: ERR_SPONSORSHIP_DEAL_NOT_FOUND
    http_status: 404
    applies_to: "GET /sponsorship-deals/{id}, GET /sponsorship-deals/{id}/obligations, POST /sponsorship-deals/{id}/sign, /cancel, /obligations/{id}/resolve"
  - priority: 17
    category: existence
    check: "The FulfillmentObligation addressed by the second path id exists AND its sponsorship_deal_id equals the first path id"
    error_id: ERR_OBLIGATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /sponsorship-deals/{id}/obligations/{id}/resolve"
    note: "A real obligation addressed under the wrong deal is a 404, not a 422: the nested path is the identity."
  - priority: 18
    category: existence
    check: "The Registration addressed by the path, or referenced by registration_id in the body, exists"
    error_id: ERR_REGISTRATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /registrations/{id}/screen, GET /registrations/{id}/lead-scans; body reference registration_id on POST /space-contracts/{id}/lead-scans"
  - priority: 19
    category: existence
    check: "The RuleViolation addressed by the path exists"
    error_id: ERR_RULE_VIOLATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /rule-violations/{id}/adjudicate"

  # --- state preconditions --------------------------------------------------
  - priority: 20
    category: state
    check: "The VenueContract is in the status the operation requires: EXECUTED for POST /shows and POST /venue-contracts/{id}/terminate (else ERR_VENUE_CONTRACT_NOT_EXECUTED), DRAFT for POST /venue-contracts/{id}/execute (else ERR_VENUE_CONTRACT_NOT_DRAFT, which is what a replayed execute receives)"
    error_id: ERR_VENUE_CONTRACT_NOT_EXECUTED | ERR_VENUE_CONTRACT_NOT_DRAFT
    http_status: 409
    applies_to: "POST /shows (the referenced contract), POST /venue-contracts/{id}/terminate, POST /venue-contracts/{id}/execute"
  - priority: 21
    category: state
    check: "Show.status is in the set the operation declares (per §1.2): PLANNING for publish-floor-plan and booth creation, SPACE_SELECTION for advance-selection-round and appointment exercise, {SPACE_SELECTION, SELLING} for contract offer/counter/reoffer/sign/rebook, {SPACE_SELECTION, SELLING, ON_SITE} for service orders and registration creation, ON_SITE for lead scans, {PLANNING, SPACE_SELECTION, SELLING} for sponsorship package creation and deal sign, {SPACE_SELECTION, SELLING, ON_SITE} for contract cancellation and deal cancellation"
    error_id: ERR_INVALID_SHOW_STATUS
    http_status: 409
    applies_to: "POST /shows/{id}/publish-floor-plan, /booths, /advance-selection-round, /sponsorship-packages, /registrations; POST /space-contracts; POST /space-contracts/{id}/negotiate, /sign, /cancel, /rebook, /service-orders, /lead-scans; POST /selection-appointments/{id}/exercise; POST /sponsorship-deals/{id}/sign, /cancel"
    note: "Priority-pair partner of ERR_DEPOSIT_BELOW_MINIMUM (priority 62): a sign on an ON_SITE show with an underfunded deposit reports THIS error, because the show being past selling closes the door before the money is even counted."
  - priority: 22
    category: state
    check: "The requested target_status is reachable from the current Show.status per the §1.2 Show transition table AND every precondition that table attaches to the chosen transition holds — notably no SelectionAppointment of this show may be in state ACTIVE when target_status == SELLING"
    error_id: ERR_INVALID_SHOW_TRANSITION
    http_status: 409
    applies_to: "POST /shows/{id}/transition"
  - priority: 23
    category: state
    check: "Show.status == CLOSED"
    error_id: ERR_SHOW_NOT_CLOSED
    http_status: 409
    applies_to: "GET /shows/{id}/post-show-report"
  - priority: 24
    category: state
    check: "SpaceContract.status is in the set the operation declares: OFFERED for counter and sign, COUNTERED for reoffer, {OFFERED, COUNTERED, SIGNED} for cancel, SIGNED for deposits, service orders, lead scans and rule violations, CLOSED_OUT for rebook"
    error_id: ERR_INVALID_CONTRACT_STATUS
    http_status: 409
    applies_to: "POST /space-contracts/{id}/negotiate, /sign, /deposits, /cancel, /rebook, /service-orders, /lead-scans, /rule-violations"
  - priority: 25
    category: state
    check: "SelectionAppointment.state == ACTIVE"
    error_id: ERR_INVALID_APPOINTMENT_STATE
    http_status: 409
    applies_to: "POST /selection-appointments/{id}/exercise"
  - priority: 26
    category: state
    check: "SponsorshipDeal.deal_status is PROPOSED for sign, {PROPOSED, SIGNED} for cancel, SIGNED for obligation resolution"
    error_id: ERR_INVALID_DEAL_STATUS
    http_status: 409
    applies_to: "POST /sponsorship-deals/{id}/sign, /cancel, /obligations/{id}/resolve"
  - priority: 27
    category: state
    check: "FulfillmentObligation.status == PENDING"
    error_id: ERR_OBLIGATION_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /sponsorship-deals/{id}/obligations/{id}/resolve"
    note: "Idempotency guard: the second resolve of the same obligation fails here rather than double-crediting sponsorship_fulfillment_points."
  - priority: 28
    category: state
    check: "RuleViolation.status == OPEN"
    error_id: ERR_VIOLATION_ALREADY_ADJUDICATED
    http_status: 409
    applies_to: "POST /rule-violations/{id}/adjudicate"
  - priority: 29
    category: state
    check: "No Booth involved in the operation has status == MERGED"
    error_id: ERR_BOOTH_MERGED
    http_status: 409
    applies_to: "POST /space-contracts, POST /space-contracts/{id}/negotiate, /rebook, POST /selection-appointments/{id}/exercise, POST /booths/{id}/combine"
  - priority: 30
    category: state
    check: "Every expected_*_version supplied in the body equals the current version of the named parent row, per §1.2.1"
    error_id: "ERR_STALE_SHOW_VERSION | ERR_STALE_VENUE_CONTRACT_VERSION (per the matching §1.2.1 rule)"
    http_status: 412
    applies_to: "POST /space-contracts, POST /space-contracts/{id}/sign, /rebook, POST /selection-appointments/{id}/exercise, POST /booths/{id}/combine, POST /venue-contracts/{id}/terminate"
    note: "OCC sits after existence and per-row state checks (a stale version on a non-existent or wrongly-stated row still reports the sharper error) and strictly before every business rule."

  # --- business_safety: floor safety, compliance and standing ----------------
  - priority: 31
    category: business_safety
    check: "Exhibitor.status == ACTIVE"
    error_id: ERR_EXHIBITOR_SUSPENDED
    http_status: 422
    applies_to: "POST /space-contracts, POST /space-contracts/{id}/sign, /rebook, POST /selection-appointments/{id}/exercise, POST /shows/{id}/selection-appointments, POST /sponsorship-packages/{id}/deals, POST /sponsorship-deals/{id}/sign"
    note: "Priority-pair partner of ERR_APPOINTMENT_WINDOW_CLOSED (priority 55): an exercise by a suspended exhibitor after the window shut reports THIS error, because standing is a compliance gate and the window is only a schedule."
  - priority: 32
    category: business_safety
    check: "Show.floor_posture != FROZEN"
    error_id: ERR_SHOW_FLOOR_FROZEN
    http_status: 409
    applies_to: "POST /space-contracts, POST /space-contracts/{id}/rebook, POST /selection-appointments/{id}/exercise, POST /shows/{id}/booths"
    note: "Blocks operations that consume NEW inventory only; sign, deposit, cancel and adjudicate stay open on a frozen floor so the condition can be worked down."
  - priority: 33
    category: business_safety
    check: "Show.floor_posture == OPEN"
    error_id: ERR_SHOW_FLOOR_SPACE_LOCKED
    http_status: 409
    applies_to: "POST /shows/{id}/booths, POST /space-contracts/{id}/negotiate with action REOFFER and approved_discount_pct > DISCOUNT_APPROVAL_THRESHOLD_PCT"
  - priority: 34
    category: business_safety
    check: "Booth.max_height_ft <= VenueContract.max_booth_height_ft, and a reported BOOTH_HEIGHT violation's measured_value > Booth.max_height_ft"
    error_id: ERR_BOOTH_HEIGHT_LIMIT
    http_status: 422
    applies_to: "POST /shows/{id}/booths, POST /space-contracts/{id}/rule-violations"

  # --- business_referential: the graph must actually connect -----------------
  - priority: 35
    category: business_referential
    check: "SelectionAppointment.exhibitor_id equals the acting exhibitor and SelectionAppointment.show_id equals the show whose booths are being held"
    error_id: ERR_APPOINTMENT_EXHIBITOR_MISMATCH
    http_status: 422
    applies_to: "POST /selection-appointments/{id}/exercise"
    note: "Runs BEFORE the booth-membership check at priority 36: on an exercise the appointment is the identity of the operation, so an appointment whose own show does not match the booths being claimed reports THIS error rather than ERR_BOOTH_NOT_IN_SHOW."
  - priority: 36
    category: business_referential
    check: "Every booth in booth_ids has show_id == the target Show of the operation"
    error_id: ERR_BOOTH_NOT_IN_SHOW
    http_status: 422
    applies_to: "POST /space-contracts, POST /space-contracts/{id}/negotiate, /rebook, POST /selection-appointments/{id}/exercise, POST /booths/{id}/combine"
    note: "Priority-pair partner of ERR_BOOTH_NOT_AVAILABLE (priority 40): a booth that belongs to another show AND is already held there reports THIS error, because a cross-show reference is a broken relationship, not an inventory shortage."
  - priority: 37
    category: business_referential
    check: "Registration.show_id equals the show of the SpaceContract being scanned against"
    error_id: ERR_REGISTRATION_SHOW_MISMATCH
    http_status: 422
    applies_to: "POST /space-contracts/{id}/lead-scans"
  - priority: 38
    category: business_referential
    check: "The rebook target show is a different Show under the SAME VenueContract as the source contract's show, with a strictly greater edition_year, in status IN {PLANNING, SPACE_SELECTION, SELLING}"
    error_id: ERR_REBOOK_TARGET_INVALID
    http_status: 422
    applies_to: "POST /space-contracts/{id}/rebook"
  - priority: 39
    category: business_referential
    check: "Every booth id in the combine request belongs to the surviving booth's show and the surviving booth is not itself listed as a child"
    error_id: ERR_INVALID_COMBINE_SET
    http_status: 422
    applies_to: "POST /booths/{id}/combine"

  # --- business_constraint: inventory, uniqueness and bounded loops ----------
  - priority: 40
    category: business_constraint
    check: "Every booth in booth_ids has status == AVAILABLE (or is already HELD by THIS contract on a re-offer)"
    error_id: ERR_BOOTH_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /space-contracts, POST /space-contracts/{id}/negotiate, /rebook, POST /selection-appointments/{id}/exercise"
  - priority: 41
    category: business_constraint
    check: "When booth_ids is omitted, calculations.booth_selector finds at least one eligible booth"
    error_id: ERR_NO_ELIGIBLE_BOOTH
    http_status: 422
    applies_to: "POST /space-contracts, POST /space-contracts/{id}/rebook, POST /selection-appointments/{id}/exercise"
    note: "Empty-pool fallback of the selector: no partial hold is written and the request fails atomically."
  - priority: 42
    category: business_constraint
    check: "Show.aisle_ratio_pct >= VenueContract.min_aisle_ratio_pct"
    error_id: ERR_AISLE_RATIO_VIOLATION
    http_status: 422
    applies_to: "POST /shows, POST /shows/{id}/publish-floor-plan"
  - priority: 43
    category: business_constraint
    check: "The show's booth collection is publishable: it holds at least one booth with status != MERGED (else ERR_FLOOR_PLAN_EMPTY, checked only on publish-floor-plan) and the sum of Booth.area_sqft over those booths is <= Show.net_sellable_sqft (else ERR_FLOOR_INVENTORY_OVERCOMMITTED — an aggregate check: each booth is individually legal, the collection is not)"
    error_id: ERR_FLOOR_INVENTORY_OVERCOMMITTED | ERR_FLOOR_PLAN_EMPTY
    http_status: 422
    applies_to: "POST /shows/{id}/booths, POST /shows/{id}/publish-floor-plan"
  - priority: 44
    category: business_constraint
    check: "Booth.booth_number is unique among the booths of the same show"
    error_id: ERR_DUPLICATE_BOOTH_NUMBER
    http_status: 409
    applies_to: "POST /shows/{id}/booths"
  - priority: 45
    category: business_constraint
    check: "The exhibitor has no other SpaceContract on this show with status IN {OFFERED, COUNTERED, SIGNED}"
    error_id: ERR_DUPLICATE_ACTIVE_CONTRACT
    http_status: 409
    applies_to: "POST /space-contracts, POST /selection-appointments/{id}/exercise, POST /space-contracts/{id}/rebook"
  - priority: 46
    category: business_constraint
    check: "SpaceContract.negotiation_round < MAX_NEGOTIATION_ROUNDS before a COUNTER is accepted"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /space-contracts/{id}/negotiate with action COUNTER"
    note: "Termination condition of the bounded OFFERED <-> COUNTERED cycle; REOFFER never consumes budget, so only the exhibitor's counters can exhaust it."
  - priority: 47
    category: business_constraint
    check: "SponsorshipPackage.inventory_available >= 1"
    error_id: ERR_SPONSORSHIP_INVENTORY_EXHAUSTED
    http_status: 409
    applies_to: "POST /sponsorship-packages/{id}/deals"
  - priority: 48
    category: business_constraint
    check: "When SponsorshipPackage.exclusivity_category is non-null, no other package of the SAME show sharing that exclusivity_category already has a deal with deal_status IN {PROPOSED, SIGNED} for a DIFFERENT exhibitor"
    error_id: ERR_EXCLUSIVITY_CATEGORY_TAKEN
    http_status: 409
    applies_to: "POST /sponsorship-packages/{id}/deals"
    note: "Cross-aggregate uniqueness: the conflict lives on a sibling package, not on the package being sold."
  - priority: 49
    category: business_constraint
    check: "No LeadScan already exists for this (space_contract_id, registration_id) pair"
    error_id: ERR_DUPLICATE_LEAD_SCAN
    http_status: 409
    applies_to: "POST /space-contracts/{id}/lead-scans"
    note: "Keeps Registration.lead_scan_count and the report's per-contract denominators honest: one badge, one exhibitor, one scan."
  - priority: 50
    category: business_constraint
    check: "A WAIVED disposition carries a non-empty reason (waiver_reason for a RuleViolation, note for a FulfillmentObligation), and a screening override carries a non-empty reason"
    error_id: ERR_WAIVER_REASON_REQUIRED
    http_status: 422
    applies_to: "POST /rule-violations/{id}/adjudicate, POST /sponsorship-deals/{id}/obligations/{id}/resolve, POST /registrations/{id}/screen"

  # --- business_temporal: calendars, windows and overlap --------------------
  - priority: 51
    category: business_temporal
    check: "move_in_start <= event_start <= event_end <= move_out_end, all four interpreted as UTC dates"
    error_id: ERR_INVALID_SHOW_WINDOW
    http_status: 422
    applies_to: "POST /shows"
  - priority: 52
    category: business_temporal
    check: "The show's whole occupancy window falls inside the venue contract's term: year(move_in_start) and year(move_out_end) both lie in [contract_year_start, contract_year_start + contract_year_count - 1], and edition_year == year(event_start)"
    error_id: ERR_SHOW_OUTSIDE_CONTRACT_TERM
    http_status: 422
    applies_to: "POST /shows"
  - priority: 53
    category: business_temporal
    check: "No other Show in status IN {PLANNING, SPACE_SELECTION, SELLING, ON_SITE, CLOSED} on the same (VenueContract.venue_code, VenueContract.hall_code) has an occupancy window that overlaps this one, where each window is the CLOSED interval [move_in_start - DARK_DAY_BUFFER_DAYS, move_out_end + DARK_DAY_BUFFER_DAYS]"
    error_id: ERR_HALL_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /shows"
    note: "Closed intervals with a symmetric buffer: a move_in exactly DARK_DAY_BUFFER_DAYS after another show's move_out still collides, and one further day is clear. CANCELLED shows release their hall."
  - priority: 54
    category: business_temporal
    check: "window_start < window_end for the appointment, and both fall on or before Show.event_start"
    error_id: ERR_INVALID_APPOINTMENT_WINDOW
    http_status: 422
    applies_to: "POST /shows/{id}/selection-appointments"
  - priority: 55
    category: business_temporal
    check: "current logical clock >= window_start AND current logical clock < window_end (half-open window)"
    error_id: ERR_APPOINTMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /selection-appointments/{id}/exercise"
    note: "Half-open, unlike the hall's closed interval: an exercise exactly at window_end is late. Priority-pair partner of ERR_EXHIBITOR_SUSPENDED (priority 31)."
  - priority: 56
    category: business_temporal
    check: "The count of SCHEDULED appointments of the same show and round_index whose HALF-OPEN [window_start, window_end) intervals overlap the requested one, plus this one, is <= Show.selection_desk_capacity"
    error_id: ERR_SELECTION_DESK_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /shows/{id}/selection-appointments"
    note: "Aggregate temporal overlap: each appointment is individually legal, the concurrent set is not. Half-open semantics mean an appointment starting exactly when another ends does NOT overlap."
  - priority: 57
    category: business_temporal
    check: "date(ordered_at) <= Show.move_out_end"
    error_id: ERR_SERVICE_ORDER_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /space-contracts/{id}/service-orders"
  - priority: 58
    category: business_temporal
    check: "date(scanned_at) is within the closed interval [Show.move_in_start, Show.move_out_end]"
    error_id: ERR_LEAD_SCAN_OUTSIDE_SHOW_WINDOW
    http_status: 422
    applies_to: "POST /space-contracts/{id}/lead-scans"

  # --- business_fiscal: money last ------------------------------------------
  - priority: 59
    category: business_fiscal
    check: "approved_discount_pct <= DISCOUNT_APPROVAL_THRESHOLD_PCT unless X-Role == ShowDirector"
    error_id: ERR_DISCOUNT_APPROVAL_REQUIRED
    http_status: 403
    applies_to: "POST /space-contracts/{id}/negotiate with action REOFFER"
  - priority: 60
    category: business_fiscal
    check: "approved_discount_pct <= MAX_APPROVED_DISCOUNT_PCT for every role, ShowDirector included"
    error_id: ERR_DISCOUNT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /space-contracts/{id}/negotiate with action REOFFER"
  - priority: 61
    category: business_fiscal
    check: "negotiated_price_cents >= SponsorshipPackage.price_floor_cents AND negotiated_price_cents >= round_half_up(list_price_cents * (100 - MAX_SPONSOR_DISCOUNT_PCT) / 100)"
    error_id: ERR_SPONSORSHIP_PRICE_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /sponsorship-packages/{id}/deals"
    note: "Two independent floors; the binding one is whichever is higher, so a package can be protected either by an absolute floor or by a percentage cap on discounting."
  - priority: 62
    category: business_fiscal
    check: "deposit_paid_cents >= SpaceContract.min_deposit_cents at the moment of signing"
    error_id: ERR_DEPOSIT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /space-contracts/{id}/sign"
  - priority: 63
    category: business_fiscal
    check: "deposit_paid_cents + amount_cents <= SpaceContract.invoice_total_cents"
    error_id: ERR_DEPOSIT_EXCEEDS_INVOICE
    http_status: 422
    applies_to: "POST /space-contracts/{id}/deposits, POST /space-contracts/{id}/sign"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
#   api_prefix is "" — every collection is a flat top-level resource.
#   Path ids are always the literal template segment {id}; a nested resolve path
#   carries two ({parent-id}/{child-id}), read left to right.
#   Headers on every call: X-Role (mandatory), X-Role-Id (mandatory for the
#   Exhibitor role), X-User-ID (operator identity, used by the three
#   segregation-of-duties rules).
# ---------------------------------------------------------------------------
endpoints:

  # ---- VenueContract -------------------------------------------------------
  - method: POST
    path: "/venue-contracts"
    description: "Register a multi-year hall contract in DRAFT with its attrition allowance, cancellation-fee schedule and exhibitor-services rate card"
    roles: [ShowDirector]
    code: 201
    input: [venue_code, hall_code, hall_gross_sqft, min_aisle_ratio_pct, max_booth_height_ft, contract_year_start, contract_year_count, committed_net_sqft_per_year, attrition_allowance_pct, advance_order_discount_pct, labor_rate_cents_per_hour, electrical_rate_cents_per_amp, material_handling_rate_cents_per_cwt, "cancellation_fee_schedule?"]
    output: VenueContract
    side_effects: ["status = DRAFT", "show_count = 0", "cancellation_fee_schedule defaults to [{min_days_out:180,pct:25},{min_days_out:90,pct:50},{min_days_out:0,pct:100}] when omitted"]
  - method: POST
    path: "/venue-contracts/{id}/execute"
    description: "Countersign the contract, moving DRAFT -> EXECUTED and unlocking show creation"
    roles: [ShowDirector]
    code: 200
    input: []
    output: VenueContract
    side_effects: ["status = EXECUTED", "writes executed_at from the logical clock", "increments version"]
  - method: POST
    path: "/venue-contracts/{id}/terminate"
    description: "Terminate an executed contract; cascades CANCELLED down every non-terminal Show and, through them, to space contracts, booths, service orders and exhibitor points"
    roles: [ShowDirector]
    code: 200
    input: [expected_venue_contract_version, terminated_effective_date, "reason?"]
    output: VenueContract
    side_effects: ["status = TERMINATED", "CASCADE: Show -> CANCELLED for every non-terminal show (see §1.2)", "increments version", "guarded by concurrency_rules.venue-contract-terminate-stale"]
  - method: GET
    path: "/venue-contracts/{id}"
    description: "Read one venue contract including its rate card and current show_count"
    roles: [ShowDirector, SalesRep, FloorManager]
    code: 200
    input: []
    output: VenueContract
    side_effects: []
  - method: GET
    path: "/venue-contracts/{id}/shows"
    description: "List the shows booked under this contract (FK reverse-reachability for Show.venue_contract_id)"
    roles: [ShowDirector, SalesRep, FloorManager]
    code: 200
    input: ["status?"]
    output: Show[]
    side_effects: []

  # ---- Show ----------------------------------------------------------------
  - method: POST
    path: "/shows"
    description: "Create an edition of the show in PLANNING; validates the date window, the contract term, the aisle ratio and hall occupancy against sibling editions"
    roles: [ShowDirector]
    code: 201
    input: [venue_contract_id, name, edition_year, move_in_start, event_start, event_end, move_out_end, gross_sqft, aisle_ratio_pct, base_rate_cents_per_sqft, selection_desk_capacity]
    output: Show
    side_effects: ["status = PLANNING", "floor_posture = OPEN", "selection_round = 0", "all area and money ledgers initialise to 0", "increments VenueContract.show_count and VenueContract.version"]
  - method: GET
    path: "/shows/{id}"
    description: "Read one show with its derived area ledger, committed_ratio_pct, floor_posture and version (the OCC source for every inventory write)"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: []
    output: Show
    side_effects: []
  - method: POST
    path: "/shows/{id}/publish-floor-plan"
    description: "Freeze the floor plan and open space selection: PLANNING -> SPACE_SELECTION"
    roles: [ShowDirector]
    code: 200
    input: []
    output: Show
    side_effects: ["computes net_sellable_sqft and advance_order_deadline per calculations.show_net_sellable_sqft", "aggregate checks ERR_FLOOR_PLAN_EMPTY and ERR_FLOOR_INVENTORY_OVERCOMMITTED", "recomputes sellable_booth_sqft, available_net_sqft, committed_ratio_pct and floor_posture", "increments version"]
  - method: POST
    path: "/shows/{id}/transition"
    description: "Drive the show's lifecycle: target_status SELLING | ON_SITE | CLOSED | CANCELLED. CLOSED runs the attrition settlement, the CLOSED_OUT sweep over signed contracts and the MISSED sweep over pending sponsorship obligations; CANCELLED runs the cancellation cascade"
    roles: [ShowDirector]
    code: 200
    input: [target_status, "cancellation_reason?"]
    output: Show
    side_effects: ["see §1.2 state_machines[entity=Show] for the per-target cascade links", "CLOSED writes attrition_shortfall_sqft and attrition_settlement_cents per calculations.show_attrition_settlement", "increments version"]
  - method: POST
    path: "/shows/{id}/advance-selection-round"
    description: "Open the next priority-point selection round: increments selection_round, ranks the round's SCHEDULED appointments, activates the first selection_desk_capacity of them, expires the ineligible ones and forfeits any appointment still ACTIVE from the previous round"
    roles: [ShowDirector, SalesRep]
    code: 200
    input: []
    output: Show
    side_effects: ["writes rank and certified_points_at_rank per calculations.selection_appointment_rank", "SCHEDULED -> ACTIVE up to selection_desk_capacity", "SCHEDULED -> EXPIRED for elapsed windows and non-ACTIVE exhibitors", "ACTIVE -> FORFEITED with FORFEIT_PENALTY_POINTS for leftovers", "increments version"]
  - method: GET
    path: "/shows/{id}/post-show-report"
    description: "Computed read (CLOSED shows only): attendance quality, per-exhibitor lead quality and the frozen attrition settlement"
    roles: [ShowDirector, SalesRep]
    code: 200
    input: []
    output: { total_registrations: integer, qualified_registrations: integer, attended_registrations: integer, qualified_attended: integer, attendance_quality_index: integer, scored_contract_count: integer, total_lead_scans: integer, show_lead_quality_index: integer, attrition_shortfall_sqft: integer, attrition_settlement_cents: integer, exhibitor_lines: array }
    side_effects: []

  # ---- Booth ---------------------------------------------------------------
  - method: POST
    path: "/shows/{id}/booths"
    description: "Add a booth to a PLANNING show's floor plan; area_sqft is computed from width_ft * depth_ft"
    roles: [ShowDirector, FloorManager]
    code: 201
    input: [booth_number, width_ft, depth_ft, location_class, "premium_zone?", max_height_ft]
    output: Booth
    side_effects: ["status = AVAILABLE", "area_sqft = width_ft * depth_ft", "premium_zone defaults to NONE", "recomputes Show.sellable_booth_sqft, available_net_sqft, committed_ratio_pct, floor_posture", "increments Show.version"]
  - method: GET
    path: "/booths/{id}"
    description: "Read one booth with its status, area and current space_contract_id"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: []
    output: Booth
    side_effects: []
  - method: GET
    path: "/booths"
    description: "Filtered booth list; FK reverse-reachability for Booth.show_id, Booth.space_contract_id and the self-FK Booth.combined_parent_booth_id"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: ["show_id?", "space_contract_id?", "combined_parent_booth_id?", "status?", "premium_zone?", "location_class?"]
    output: Booth[]
    side_effects: []
  - method: POST
    path: "/booths/{id}/combine"
    description: "Merge one or more AVAILABLE booths into the path booth to build an island; children become MERGED and their area moves to the survivor"
    roles: [FloorManager, ShowDirector]
    code: 200
    input: [expected_show_version, booth_ids]
    output: Booth
    side_effects: ["children: status = MERGED with combined_parent_booth_id = survivor", "survivor.area_sqft += sum of child area_sqft", "Show.sellable_booth_sqft is unchanged (area is conserved, not created)", "increments Show.version", "guarded by concurrency_rules.booth-combine-stale-show"]

  # ---- Exhibitor -----------------------------------------------------------
  - method: POST
    path: "/exhibitors"
    description: "Register an exhibitor account with its historical consecutive_years"
    roles: [ShowDirector, SalesRep]
    code: 201
    input: [legal_name, contact_email, "consecutive_years?"]
    output: Exhibitor
    side_effects: ["status = ACTIVE", "every point counter initialises to 0", "consecutive_years defaults to 0"]
  - method: GET
    path: "/exhibitors/{id}"
    description: "Read one exhibitor including both priority-point variants and the derived priority_tier"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: []
    output: Exhibitor
    side_effects: []
  - method: POST
    path: "/exhibitors/{id}/priority-point-adjustments"
    description: "Post a manual priority-point adjustment to the exhibitor's ledger (loyalty grants, negotiated make-goods, corrections)"
    roles: [ShowDirector]
    code: 200
    input: [points_delta, reason]
    output: Exhibitor
    side_effects: ["ledger_points += points_delta", "recomputes both priority-point variants and priority_tier", "increments version"]
  - method: POST
    path: "/exhibitors/{id}/reinstate"
    description: "Clear accumulated penalty points and return a SUSPENDED exhibitor to ACTIVE"
    roles: [ShowDirector]
    code: 200
    input: [reason]
    output: Exhibitor
    side_effects: ["status = ACTIVE", "penalty_points = 0", "recomputes both priority-point variants and priority_tier", "increments version"]

  # ---- SelectionAppointment ------------------------------------------------
  - method: POST
    path: "/shows/{id}/selection-appointments"
    description: "Book an exhibitor a space-selection slot in a numbered round; the desk capacity is an aggregate cap over overlapping half-open windows"
    roles: [ShowDirector, SalesRep]
    code: 201
    input: [exhibitor_id, round_index, window_start, window_end]
    output: SelectionAppointment
    side_effects: ["state = SCHEDULED", "rank and certified_points_at_rank stay null until the round opens"]
  - method: GET
    path: "/selection-appointments/{id}"
    description: "Read one selection appointment with its rank and the certified points snapshotted at ranking time"
    roles: [ShowDirector, SalesRep, Exhibitor]
    code: 200
    input: []
    output: SelectionAppointment
    side_effects: []
  - method: GET
    path: "/selection-appointments"
    description: "Filtered appointment list; FK reverse-reachability for SelectionAppointment.show_id and .exhibitor_id"
    roles: [ShowDirector, SalesRep, Exhibitor]
    code: 200
    input: ["show_id?", "exhibitor_id?", "round_index?", "state?"]
    output: SelectionAppointment[]
    side_effects: []
  - method: POST
    path: "/selection-appointments/{id}/exercise"
    description: "Exercise an ACTIVE appointment: holds booths (explicit booth_ids or the selector's choice) and creates the exhibitor's OFFERED space contract"
    roles: [Exhibitor, SalesRep]
    code: 201
    input: [expected_show_version, requested_sqft, "premium_placement_requested?", "booth_ids?"]
    output: SpaceContract
    side_effects: ["appointment state = EXERCISED", "creates SpaceContract in OFFERED", "selected booths AVAILABLE -> HELD", "prices the contract per calculations.booth_space_fee and calculations.space_contract_invoice_total", "increments Show.version", "guarded by concurrency_rules.appointment-exercise-stale-show"]

  # ---- SpaceContract -------------------------------------------------------
  - method: POST
    path: "/space-contracts"
    description: "Open a space contract off-appointment (direct sale): holds booths and prices the offer"
    roles: [SalesRep, ShowDirector, Exhibitor]
    code: 201
    input: [show_id, exhibitor_id, expected_show_version, requested_sqft, "premium_placement_requested?", "booth_ids?"]
    output: SpaceContract
    side_effects: ["status = OFFERED", "negotiation_round = 0", "selected booths AVAILABLE -> HELD with space_contract_id set", "computes volume_tier_pct, space_fee_cents, min_deposit_cents, bundle fields, invoice_total_cents", "recomputes Show.held_net_sqft, committed_ratio_pct, floor_posture", "increments Show.version", "guarded by concurrency_rules.space-contract-create-stale-show"]
  - method: GET
    path: "/space-contracts/{id}"
    description: "Read one space contract with its full pricing, deposit and cancellation ledger"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: []
    output: SpaceContract
    side_effects: []
  - method: GET
    path: "/space-contracts"
    description: "Filtered contract list; FK reverse-reachability for SpaceContract.show_id, .exhibitor_id and the self-FK .rebooked_from_space_contract_id"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: ["show_id?", "exhibitor_id?", "rebooked_from_space_contract_id?", "status?"]
    output: SpaceContract[]
    side_effects: []
  - method: POST
    path: "/space-contracts/{id}/negotiate"
    description: "One leg of the bounded negotiation cycle. action COUNTER (Exhibitor) records a requested discount and consumes a round; action REOFFER (SalesRep/ShowDirector) writes the approved discount, optionally swaps the booth set, and reprices"
    roles: [Exhibitor, SalesRep, ShowDirector]
    code: 200
    input: [action, "requested_discount_pct?", "approved_discount_pct?", "booth_ids?"]
    output: SpaceContract
    side_effects: ["COUNTER: OFFERED -> COUNTERED, negotiation_round += 1", "REOFFER: COUNTERED -> OFFERED, writes approved_discount_pct and last_offer_by_user_id, releases dropped booths HELD -> AVAILABLE and holds added booths AVAILABLE -> HELD, reprices per calculations.booth_space_fee and calculations.space_contract_invoice_total"]
  - method: POST
    path: "/space-contracts/{id}/sign"
    description: "Sign the current offer with the deposit; freezes the price, converts held booths to assigned and awards provisional priority points"
    roles: [Exhibitor]
    code: 200
    input: [expected_show_version, deposit_paid_cents]
    output: SpaceContract
    side_effects: ["status = SIGNED, writes signed_at", "booths HELD -> ASSIGNED", "freezes space_fee_cents / bundle fields / invoice_total_cents", "writes points_awarded and recomputes the exhibitor's provisional points and tier", "recomputes Show.assigned_net_sqft, held_net_sqft, committed_ratio_pct, floor_posture", "increments Show.version", "guarded by concurrency_rules.space-contract-sign-stale-show"]
  - method: POST
    path: "/space-contracts/{id}/deposits"
    description: "Post an additional payment against a signed contract, up to the invoice total"
    roles: [Exhibitor, SalesRep]
    code: 200
    input: [amount_cents]
    output: SpaceContract
    side_effects: ["deposit_paid_cents += amount_cents", "asserts calculations.space_contract_deposit_conservation", "increments version"]
  - method: POST
    path: "/space-contracts/{id}/cancel"
    description: "Cancel the contract; computes the day-banded cancellation fee, waterfalls it against the deposit and releases every downstream commitment"
    roles: [Exhibitor, ShowDirector]
    code: 200
    input: [cancellation_reason]
    output: SpaceContract
    side_effects: ["status = CANCELLED", "writes cancellation_fee_cents / fee_applied_to_deposit_cents / refund_cents / balance_due_cents per calculations.space_contract_cancellation_fee", "booths -> AVAILABLE, SUBMITTED service orders -> CANCELLED, points_awarded reversed to 0", "recomputes Show area ledger and floor_posture"]
  - method: POST
    path: "/space-contracts/{id}/rebook"
    description: "On-site rebooking: create next edition's OFFERED contract from a closed-out one, carrying the rebook bonus and the priority-point history forward"
    roles: [SalesRep, ShowDirector, Exhibitor]
    code: 201
    input: [target_show_id, expected_target_show_version, requested_sqft, "premium_placement_requested?", "booth_ids?"]
    output: SpaceContract
    side_effects: ["creates a new SpaceContract in OFFERED on the target show with rebooked_from_space_contract_id set", "target-show booths AVAILABLE -> HELD", "prices the new offer and adds REBOOK_BONUS_POINTS to the exhibitor's provisional points", "increments the target Show.version", "guarded by concurrency_rules.rebook-stale-target-show"]

  # ---- ServiceOrder / RuleViolation / LeadScan (exhibitor services & floor) --
  - method: POST
    path: "/space-contracts/{id}/service-orders"
    description: "Order labor, electrical or material handling against a signed contract; the rate variant is decided by the advance-order deadline"
    roles: [Exhibitor, FloorManager]
    code: 201
    input: [service_type, quantity, ordered_at]
    output: ServiceOrder
    side_effects: ["status = SUBMITTED", "writes billable_quantity, unit_rate_cents, rate_variant and line_total_cents per calculations.service_order_line_total"]
  - method: GET
    path: "/space-contracts/{id}/service-orders"
    description: "List the service orders of a contract (FK reverse-reachability for ServiceOrder.space_contract_id)"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: ["status?", "service_type?"]
    output: ServiceOrder[]
    side_effects: []
  - method: POST
    path: "/space-contracts/{id}/rule-violations"
    description: "Cite an exhibitor for a show-floor rule breach (booth height, noise, aisle encroachment, sales conduct)"
    roles: [FloorManager, ShowDirector]
    code: 201
    input: [violation_type, "measured_value?", "notes?"]
    output: RuleViolation
    side_effects: ["status = OPEN", "penalty_points = 0 until adjudicated", "writes reported_by_user_id from X-User-ID"]
  - method: GET
    path: "/space-contracts/{id}/rule-violations"
    description: "List the citations written against a contract (FK reverse-reachability for RuleViolation.space_contract_id)"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: ["status?", "violation_type?"]
    output: RuleViolation[]
    side_effects: []
  - method: POST
    path: "/rule-violations/{id}/adjudicate"
    description: "Rule on an open citation: disposition UPHELD charges the penalty and can freeze the floor or suspend the exhibitor; disposition WAIVED charges nothing"
    roles: [ShowDirector]
    code: 200
    input: [disposition, "waiver_reason?"]
    output: RuleViolation
    side_effects: ["UPHELD: penalty_points = PENALTY_POINTS[violation_type], adds to Exhibitor.penalty_points, recomputes points and tier, may suspend the exhibitor, recomputes Show.upheld_violation_count and floor_posture", "WAIVED: no propagation at all", "writes adjudicated_by_user_id"]
  - method: POST
    path: "/space-contracts/{id}/lead-scans"
    description: "Record a badge scan by an exhibitor against a registration; immutable once written"
    roles: [Exhibitor, FloorManager]
    code: 201
    input: [registration_id, scanned_at]
    output: LeadScan
    side_effects: ["increments Registration.lead_scan_count and Registration.version", "no version field on LeadScan itself (common_fields: false)"]
  - method: GET
    path: "/space-contracts/{id}/lead-scans"
    description: "List an exhibitor's captured leads for this contract (FK reverse-reachability for LeadScan.space_contract_id)"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: []
    output: LeadScan[]
    side_effects: []
  - method: GET
    path: "/registrations/{id}/lead-scans"
    description: "List the scans of one attendee badge (FK reverse-reachability for LeadScan.registration_id)"
    roles: [ShowDirector, SalesRep, FloorManager]
    code: 200
    input: []
    output: LeadScan[]
    side_effects: []

  # ---- Sponsorship ---------------------------------------------------------
  - method: POST
    path: "/shows/{id}/sponsorship-packages"
    description: "Package sponsorship inventory beyond booth space, with a price floor, an exclusivity category and the obligation codes the show owes the sponsor"
    roles: [ShowDirector]
    code: 201
    input: [package_code, list_price_cents, price_floor_cents, inventory_total, "exclusivity_category?", obligation_codes, priority_point_value]
    output: SponsorshipPackage
    side_effects: ["inventory_committed = 0", "inventory_available = inventory_total"]
  - method: GET
    path: "/shows/{id}/sponsorship-packages"
    description: "List the show's sponsorship inventory with live committed/available counts (FK reverse-reachability for SponsorshipPackage.show_id)"
    roles: [ShowDirector, SalesRep, Exhibitor]
    code: 200
    input: ["exclusivity_category?"]
    output: SponsorshipPackage[]
    side_effects: []
  - method: POST
    path: "/sponsorship-packages/{id}/deals"
    description: "Propose a sponsorship deal at a negotiated price; consumes one inventory unit immediately and claims the exclusivity category"
    roles: [SalesRep, ShowDirector]
    code: 201
    input: [exhibitor_id, negotiated_price_cents]
    output: SponsorshipDeal
    side_effects: ["deal_status = PROPOSED, fulfillment_status = NOT_STARTED", "writes proposed_by_user_id from X-User-ID", "inventory_committed += 1, inventory_available -= 1", "asserts calculations.sponsorship_inventory_conservation"]
  - method: GET
    path: "/sponsorship-deals/{id}"
    description: "Read one deal with both of its independent status axes"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: []
    output: SponsorshipDeal
    side_effects: []
  - method: GET
    path: "/sponsorship-deals"
    description: "Filtered deal list; FK reverse-reachability for SponsorshipDeal.sponsorship_package_id and .exhibitor_id"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: ["sponsorship_package_id?", "exhibitor_id?", "deal_status?", "fulfillment_status?"]
    output: SponsorshipDeal[]
    side_effects: []
  - method: POST
    path: "/sponsorship-deals/{id}/sign"
    description: "Commit the show to the sponsorship (a different operator than the proposer must sign); materialises the fulfillment obligations and repackages the exhibitor's bundle pricing"
    roles: [ShowDirector]
    code: 200
    input: []
    output: SponsorshipDeal
    side_effects: ["deal_status = SIGNED, writes signed_by_user_id", "creates one PENDING FulfillmentObligation per obligation_code with due_date = event_start - OBLIGATION_LEAD_DAYS", "recomputes the exhibitor's provisional points and tier", "reprices sponsorship_attached_cents and the bundle discount on every non-terminal SpaceContract of this exhibitor on this show"]
  - method: POST
    path: "/sponsorship-deals/{id}/cancel"
    description: "Cancel a proposed or signed sponsorship; releases the inventory unit and reverses the spend and fulfillment points"
    roles: [ShowDirector, Exhibitor]
    code: 200
    input: [cancellation_reason]
    output: SponsorshipDeal
    side_effects: ["deal_status = CANCELLED", "inventory_committed -= 1, inventory_available += 1", "reverses sponsorship spend points and any credited fulfillment points", "reprices the exhibitor's non-terminal space contracts on this show"]
  - method: GET
    path: "/sponsorship-deals/{id}/obligations"
    description: "List the fulfillment obligations materialised by signing (FK reverse-reachability for FulfillmentObligation.sponsorship_deal_id; the only discovery channel for these cascade-created rows)"
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor]
    code: 200
    input: ["status?"]
    output: FulfillmentObligation[]
    side_effects: []
  - method: POST
    path: "/sponsorship-deals/{id}/obligations/{id}/resolve"
    description: "Resolve one obligation of a signed deal (first path id = deal, second = obligation): disposition DELIVERED or WAIVED. Completing the last one credits the package's priority points exactly once"
    roles: [FloorManager, ShowDirector]
    code: 200
    input: [disposition, "note?"]
    output: FulfillmentObligation
    side_effects: ["status = DELIVERED | WAIVED, writes resolved_by_user_id", "bubbles SponsorshipDeal.resolved_obligation_count and fulfillment_status per calculations.sponsorship_fulfillment_status", "on the edge into COMPLETE with fulfillment_credited == false: adds priority_point_value to Exhibitor.sponsorship_fulfillment_points, sets fulfillment_credited = true, recomputes points and tier"]

  # ---- Registration --------------------------------------------------------
  - method: POST
    path: "/shows/{id}/registrations"
    description: "Register an attendee and screen them for buyer qualification in the same request"
    roles: [Registrant, ShowDirector]
    code: 201
    input: [category, company_name, job_title, purchasing_authority, annual_spend_band, email]
    output: Registration
    side_effects: ["writes qualification_score and qualification_status per calculations.registration_qualification_score", "lead_scan_count = 0"]
  - method: GET
    path: "/registrations/{id}"
    description: "Read one registration with its computed qualification score, status, any override reason and its lead_scan_count"
    roles: [ShowDirector, SalesRep, FloorManager, Registrant]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: GET
    path: "/shows/{id}/registrations"
    description: "List a show's registrations with their scores and attendance counters (FK reverse-reachability for Registration.show_id)"
    roles: [ShowDirector, SalesRep]
    code: 200
    input: ["category?", "qualification_status?"]
    output: Registration[]
    side_effects: []
  - method: POST
    path: "/registrations/{id}/screen"
    description: "Manually override a waitlisted registration: decision QUALIFIED or REJECTED with a recorded reason; the computed score is preserved untouched"
    roles: [ShowDirector]
    code: 200
    input: [decision, reason]
    output: Registration
    side_effects: ["qualification_status = decision", "writes screening_override_reason", "qualification_score is NOT recomputed", "increments version"]

  # ---- test-driving endpoint ----------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and MUST NOT fall back to real wall-clock time. Every deadline, window, day-band and decay rule in this scaffold reads this clock."
    roles: [ShowDirector, SalesRep, FloorManager, Exhibitor, Registrant]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sets the logical clock; no business row is modified and no version is incremented"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_VALIDATION
    http: 422
    condition: "Malformed body, missing required input field, undeclared enum value, out-of-range integer, or unparseable timestamp"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-Role header absent or not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is not listed on the endpoint (includes a FloorManager attempting disposition WAIVED on an obligation)"
  - id: ERR_IDENTITY_REQUIRED
    http: 403
    condition: "X-Role is Exhibitor but X-Role-Id is absent or does not resolve to an Exhibitor row"
  - id: ERR_EXHIBITOR_SCOPE_VIOLATION
    http: 403
    condition: "An Exhibitor addresses a contract, appointment, deal or booth belonging to a different exhibitor"
  - id: ERR_SOD_SPONSORSHIP_SIGN
    http: 403
    condition: "The X-User-ID signing a sponsorship deal equals proposed_by_user_id"
  - id: ERR_SOD_VIOLATION_ADJUDICATION
    http: 403
    condition: "The X-User-ID adjudicating a citation equals reported_by_user_id"
  - id: ERR_SOD_DISCOUNT_APPROVAL
    http: 403
    condition: "An above-threshold discount is approved by the same X-User-ID recorded in last_offer_by_user_id"
  - id: ERR_VENUE_CONTRACT_NOT_FOUND
    http: 404
    condition: "No VenueContract for the given id"
  - id: ERR_SHOW_NOT_FOUND
    http: 404
    condition: "No Show for the given id"
  - id: ERR_EXHIBITOR_NOT_FOUND
    http: 404
    condition: "No Exhibitor for the given id"
  - id: ERR_BOOTH_NOT_FOUND
    http: 404
    condition: "No Booth for a path id or for an element of booth_ids"
  - id: ERR_SPACE_CONTRACT_NOT_FOUND
    http: 404
    condition: "No SpaceContract for the given id"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "No SelectionAppointment for the given id"
  - id: ERR_SPONSORSHIP_PACKAGE_NOT_FOUND
    http: 404
    condition: "No SponsorshipPackage for the given id"
  - id: ERR_SPONSORSHIP_DEAL_NOT_FOUND
    http: 404
    condition: "No SponsorshipDeal for the given id"
  - id: ERR_OBLIGATION_NOT_FOUND
    http: 404
    condition: "No FulfillmentObligation for the second path id, or it exists but belongs to a different deal"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "No Registration for the path id or for the body's registration_id"
  - id: ERR_RULE_VIOLATION_NOT_FOUND
    http: 404
    condition: "No RuleViolation for the given id"
  - id: ERR_VENUE_CONTRACT_NOT_EXECUTED
    http: 409
    condition: "The venue contract is DRAFT or TERMINATED where EXECUTED is required"
  - id: ERR_VENUE_CONTRACT_NOT_DRAFT
    http: 409
    condition: "Execution was requested on a venue contract that is already EXECUTED or TERMINATED"
  - id: ERR_INVALID_SHOW_STATUS
    http: 409
    condition: "Show.status is outside the set the operation allows"
  - id: ERR_INVALID_SHOW_TRANSITION
    http: 409
    condition: "The requested target_status is not reachable from the show's current status"
  - id: ERR_SHOW_NOT_CLOSED
    http: 409
    condition: "The post-show report was requested for a show that is not CLOSED"
  - id: ERR_INVALID_CONTRACT_STATUS
    http: 409
    condition: "SpaceContract.status is outside the set the operation allows"
  - id: ERR_INVALID_APPOINTMENT_STATE
    http: 409
    condition: "The selection appointment is not ACTIVE"
  - id: ERR_INVALID_DEAL_STATUS
    http: 409
    condition: "SponsorshipDeal.deal_status is outside the set the operation allows"
  - id: ERR_OBLIGATION_ALREADY_RESOLVED
    http: 409
    condition: "The obligation is already DELIVERED, WAIVED or MISSED"
  - id: ERR_VIOLATION_ALREADY_ADJUDICATED
    http: 409
    condition: "The citation is already UPHELD or WAIVED"
  - id: ERR_BOOTH_MERGED
    http: 409
    condition: "A booth referenced by the operation has status MERGED"
  - id: ERR_STALE_SHOW_VERSION
    http: 412
    condition: "expected_show_version (or expected_target_show_version) does not equal the show's current version"
  - id: ERR_STALE_VENUE_CONTRACT_VERSION
    http: 412
    condition: "expected_venue_contract_version does not equal the contract's current version"
  - id: ERR_EXHIBITOR_SUSPENDED
    http: 422
    condition: "The exhibitor's status is SUSPENDED"
  - id: ERR_SHOW_FLOOR_FROZEN
    http: 409
    condition: "floor_posture is FROZEN and the operation would consume new inventory"
  - id: ERR_SHOW_FLOOR_SPACE_LOCKED
    http: 409
    condition: "floor_posture is SPACE_LOCKED (or FROZEN) where OPEN is required"
  - id: ERR_BOOTH_HEIGHT_LIMIT
    http: 422
    condition: "A booth's max_height_ft exceeds the hall limit, or a BOOTH_HEIGHT citation's measured_value does not exceed the booth's limit"
  - id: ERR_BOOTH_NOT_IN_SHOW
    http: 422
    condition: "A referenced booth belongs to a different show than the operation's target"
  - id: ERR_APPOINTMENT_EXHIBITOR_MISMATCH
    http: 422
    condition: "The appointment's exhibitor_id or show_id does not match the exercising context"
  - id: ERR_REGISTRATION_SHOW_MISMATCH
    http: 422
    condition: "The scanned registration belongs to a different show than the contract"
  - id: ERR_REBOOK_TARGET_INVALID
    http: 422
    condition: "The rebook target show is the same show, sits under a different venue contract, has an edition_year that is not strictly later, or is not open for sale"
  - id: ERR_INVALID_COMBINE_SET
    http: 422
    condition: "A combine set names a booth of another show, or names the surviving booth as its own child"
  - id: ERR_BOOTH_NOT_AVAILABLE
    http: 409
    condition: "A referenced booth is HELD or ASSIGNED to another contract"
  - id: ERR_NO_ELIGIBLE_BOOTH
    http: 422
    condition: "The booth selector's candidate pool is empty"
  - id: ERR_AISLE_RATIO_VIOLATION
    http: 422
    condition: "The show's aisle_ratio_pct is below the hall's min_aisle_ratio_pct"
  - id: ERR_FLOOR_INVENTORY_OVERCOMMITTED
    http: 422
    condition: "The booths of the show would occupy more than net_sellable_sqft in aggregate"
  - id: ERR_FLOOR_PLAN_EMPTY
    http: 422
    condition: "publish-floor-plan was called on a show with no booth in a status other than MERGED"
  - id: ERR_DUPLICATE_BOOTH_NUMBER
    http: 409
    condition: "The booth_number is already used on this show"
  - id: ERR_DUPLICATE_ACTIVE_CONTRACT
    http: 409
    condition: "The exhibitor already holds a non-terminal space contract on this show"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 422
    condition: "A COUNTER was attempted at negotiation_round == MAX_NEGOTIATION_ROUNDS"
  - id: ERR_SPONSORSHIP_INVENTORY_EXHAUSTED
    http: 409
    condition: "The package has no available inventory unit left"
  - id: ERR_EXCLUSIVITY_CATEGORY_TAKEN
    http: 409
    condition: "Another exhibitor already holds a live deal in this exclusivity category on this show"
  - id: ERR_DUPLICATE_LEAD_SCAN
    http: 409
    condition: "This contract already scanned this registration"
  - id: ERR_WAIVER_REASON_REQUIRED
    http: 422
    condition: "A waive or override disposition arrived without a non-empty reason"
  - id: ERR_INVALID_SHOW_WINDOW
    http: 422
    condition: "The show's four dates are not in non-decreasing order"
  - id: ERR_SHOW_OUTSIDE_CONTRACT_TERM
    http: 422
    condition: "The show's occupancy window or edition_year falls outside the venue contract's term"
  - id: ERR_HALL_OCCUPANCY_CONFLICT
    http: 409
    condition: "The show's buffered occupancy interval overlaps another live show in the same hall"
  - id: ERR_INVALID_APPOINTMENT_WINDOW
    http: 422
    condition: "window_start is not strictly before window_end, or the window falls after event_start"
  - id: ERR_APPOINTMENT_WINDOW_CLOSED
    http: 422
    condition: "The logical clock is outside the appointment's half-open [window_start, window_end)"
  - id: ERR_SELECTION_DESK_CAPACITY_EXCEEDED
    http: 409
    condition: "Overlapping appointments in the round would exceed selection_desk_capacity"
  - id: ERR_SERVICE_ORDER_WINDOW_CLOSED
    http: 422
    condition: "ordered_at falls after the show's move_out_end"
  - id: ERR_LEAD_SCAN_OUTSIDE_SHOW_WINDOW
    http: 422
    condition: "scanned_at falls outside [move_in_start, move_out_end]"
  - id: ERR_DISCOUNT_APPROVAL_REQUIRED
    http: 403
    condition: "A discount above DISCOUNT_APPROVAL_THRESHOLD_PCT was approved by a role other than ShowDirector"
  - id: ERR_DISCOUNT_EXCEEDS_CAP
    http: 422
    condition: "approved_discount_pct exceeds MAX_APPROVED_DISCOUNT_PCT"
  - id: ERR_SPONSORSHIP_PRICE_BELOW_FLOOR
    http: 422
    condition: "negotiated_price_cents is below the package's absolute floor or below the maximum sponsor discount"
  - id: ERR_DEPOSIT_BELOW_MINIMUM
    http: 422
    condition: "The deposit at signing is below min_deposit_cents"
  - id: ERR_DEPOSIT_EXCEEDS_INVOICE
    http: 422
    condition: "Total deposits would exceed invoice_total_cents"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ShowDirector
    identity: opaque
    description: "The producer's show director: owns the venue contract, the calendar, the floor plan, sponsorship commitments, discount authority above the sales threshold, citation adjudication and registration overrides"
    exclusive_operations:
      - "POST /venue-contracts, /venue-contracts/{id}/execute, /venue-contracts/{id}/terminate"
      - "POST /shows, POST /shows/{id}/publish-floor-plan, POST /shows/{id}/transition"
      - "POST /exhibitors/{id}/priority-point-adjustments, POST /exhibitors/{id}/reinstate"
      - "POST /shows/{id}/sponsorship-packages, POST /sponsorship-deals/{id}/sign"
      - "POST /rule-violations/{id}/adjudicate"
      - "POST /registrations/{id}/screen"
      - "approving approved_discount_pct > DISCOUNT_APPROVAL_THRESHOLD_PCT on a REOFFER"
      - "disposition WAIVED on POST /sponsorship-deals/{id}/obligations/{id}/resolve"
    shared_operations:
      - "POST /shows/{id}/advance-selection-round, POST /shows/{id}/booths, POST /booths/{id}/combine (with FloorManager)"
      - "POST /exhibitors, POST /shows/{id}/selection-appointments, POST /space-contracts, /negotiate (REOFFER), /cancel, /rebook, POST /sponsorship-packages/{id}/deals (with SalesRep)"
      - "POST /space-contracts/{id}/rule-violations, POST /sponsorship-deals/{id}/obligations/{id}/resolve (with FloorManager)"
      - "every GET, POST /shows/{id}/registrations, POST /_clock/set_current_utc"
  - name: SalesRep
    identity: opaque
    description: "Exhibit-space sales: opens and re-offers contracts within the discount threshold, books selection appointments, proposes sponsorships and drives rebooking on the floor"
    exclusive_operations: []
    shared_operations:
      - "POST /exhibitors, POST /shows/{id}/selection-appointments, POST /shows/{id}/advance-selection-round"
      - "POST /space-contracts, POST /space-contracts/{id}/negotiate (REOFFER up to DISCOUNT_APPROVAL_THRESHOLD_PCT), /deposits, /rebook"
      - "POST /selection-appointments/{id}/exercise (on behalf of an exhibitor at the desk)"
      - "POST /sponsorship-packages/{id}/deals"
      - "GET reads across shows, booths, contracts, deals, registrations and the post-show report; POST /_clock/set_current_utc"
    note: "A SalesRep may propose a sponsorship but may never sign one (segregation of duties), and may never approve a discount above the threshold."
  - name: FloorManager
    identity: opaque
    description: "Show-floor operations: builds and merges the physical floor plan, takes service orders, writes rule citations and marks sponsorship deliverables delivered"
    exclusive_operations: []
    shared_operations:
      - "POST /shows/{id}/booths, POST /booths/{id}/combine (with ShowDirector)"
      - "POST /space-contracts/{id}/service-orders, /rule-violations, /lead-scans"
      - "POST /sponsorship-deals/{id}/obligations/{id}/resolve with disposition DELIVERED"
      - "GET reads across booths, contracts, service orders, citations, deals and obligations; POST /_clock/set_current_utc"
    note: "A FloorManager may cite but never adjudicate, and may mark an obligation DELIVERED but never WAIVED."
  - name: Exhibitor
    identity: "entity_backed:Exhibitor"
    description: "The exhibiting company itself, identified by X-Role-Id == Exhibitor.id; may only ever touch its own appointments, contracts, orders, scans and deals"
    exclusive_operations:
      - "POST /space-contracts/{id}/sign"
      - "POST /space-contracts/{id}/negotiate with action COUNTER"
    shared_operations:
      - "POST /selection-appointments/{id}/exercise, POST /space-contracts, /deposits, /cancel, /rebook"
      - "POST /space-contracts/{id}/service-orders, /lead-scans"
      - "POST /sponsorship-deals/{id}/cancel"
      - "GET reads scoped to its own rows; POST /_clock/set_current_utc"
  - name: Registrant
    identity: opaque
    description: "A prospective attendee submitting their own registration for buyer-qualification screening; holds no other authority anywhere in the API"
    exclusive_operations: []
    shared_operations:
      - "POST /shows/{id}/registrations (with ShowDirector)"
      - "POST /_clock/set_current_utc"
