            - "${err} == ERR_NOT_FOUND and the error body also carries meta.api_request_id and data.message"

      - name: invoices_filtered_list_by_event_and_status
        claim_type: computed_read
        grounds: ["endpoints[GET /campus/invoices]"]
        distinguishing_aspect: "The invoices list honors event_id and status filters: after an ADMIN cancel the event's only invoice is VOIDED; filtering status=PROVISIONAL for that event returns an empty array with total_count 0."
        test_recipe:
          setup: ["INTERNAL org; approved event ADMIN-cancelled (invoice VOIDED)"]
          setup_api_calls:
            - { call: "POST /campus/organizations", payload: { name: "Dept AD", org_type: "INTERNAL_DEPARTMENT", contact_email: "ad@univ.edu" }, as: Scheduler, captures: { org_id: $.data.id } }
            - { call: "POST /campus/rooms", payload: { name: "FLT-1", building_code: "FLT", capacity: 30, internal_hourly_rate_cents: 1000, student_hourly_rate_cents: 500, external_hourly_rate_cents: 2000 }, as: FacilitiesManager, captures: { room_id: $.data.id, room_v: $.data.version } }
            - { call: "POST /campus/event-reservations", payload: { room_id: "${room_id}", title: "E", expected_attendance: 5, start_at: "2026-09-14T14:00:00Z", end_at: "2026-09-14T15:00:00Z", expected_room_version: "${room_v}" }, as: OrgRequester, as_user_id: "${org_id}", captures: { ev_id: $.data.id } }
            - { call: "POST /campus/event-reservations/${ev_id}/approve", payload: {}, as: Scheduler }
            - { call: "POST /campus/event-reservations/${ev_id}/cancel", payload: {}, as: Scheduler }
          trigger:
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}" }, as: FinanceAdmin, captures: { st: "$.data[0].status" } }
            - { call: "GET /campus/invoices", payload: { event_id: "${ev_id}", status: "PROVISIONAL" }, as: FinanceAdmin }
          assert:
            - "${st} == VOIDED (ADMIN cancel with fee 0 voids)"
            - "status=PROVISIONAL filter: total_count == 0 and an empty data array"

