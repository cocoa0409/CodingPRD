            - call: "POST /carriers/${cb2_id}/inquiries"
              payload: { subject_name: "Fay Farrell", subject_dob: "1979-06-17", subject_address: "24 Fern St, Denton TX", subject_driver_license: "FAY2-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${cb2_id}"
              captures: { rep_f2a: $.data.report_id }
            - call: "GET /consumers/${cf2_id}/claims"
              payload: { status: "ACTIVE" }
              as: ExchangeComplianceOfficer
              captures: { f2_claim2: "$.data[0].id" }
          trigger:
            - call: "POST /consumers/${cf2_id}/disputes"
              payload: { loss_claim_id: "${f2_claim2}", dispute_reason: "WRONG_AMOUNT", dispute_statement: "Wrong amount", expected_consumer_version: "${cf2_v}" }
