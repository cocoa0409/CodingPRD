    side_effects: ["status=ACTIVE", "tax_exempt_status=NONE", "outstanding_cents=0", "version=1"]

  - method: GET
    path: "/accounts"
    description: "List accounts"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: ["limit?", "offset?"]
    output: "Account[]"
    side_effects: []

  - method: GET
    path: "/accounts/{account_id}"
    description: "Get an account (includes computed outstanding_cents, credit_available_cents, version)"
    roles: [AccountManager, Buyer, WarehouseOps]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{account_id}/suspend"
