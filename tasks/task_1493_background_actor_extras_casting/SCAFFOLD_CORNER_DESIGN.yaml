            - { call: "POST /central-casting/casting-calls", payload: { production_id: "${prod}", shoot_date: "2026-08-10", general_call_time: "2026-08-10T07:00:00Z", scheduled_duration_minutes: 600, location: "Lot 110", union_slots: 0, nonunion_slots: 1, union_rate_cents: 10000, nonunion_rate_cents: 10000 }, as: CastingDirector, captures: { cc: $.data.id } }
            - { call: "POST /central-casting/casting-calls/${cc}/publish", payload: {}, as: CastingDirector }
            - { call: "POST /central-casting/casting-calls/${cc}/lock", payload: {}, as: CastingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:55:00Z" }, as: AgencyAdmin }
            - { call: "POST /central-casting/casting-calls/${cc}/start-shooting", payload: {}, as: CastingAssociate }
          trigger:
            - { call: "POST /central-casting/casting-calls/${cc}/wrap", payload: {}, as: CastingAssociate, captures: { cst: $.data.status, cac: $.data.actual_compliant } }
            - { call: "POST /central-casting/productions/${prod}/wrap", payload: {}, as: CastingDirector, captures: { pst: $.data.status, ci: $.data.compliance_index } }
          assert:
            - "Call wrap: status == WRAPPED, actual_compliant == true (0 >= 0 vacuous compliance)"
            - "Production wrap: status == WRAPPED, compliance_index == 100 (no penalty)"
