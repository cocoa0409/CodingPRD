      - name: system_fields_are_generated_and_stamped_from_the_logical_clock
        claim_type: system_fields
        grounds:
          - entities.DraftOrder.fields.received_at
          - entities.DeficiencyNotice.fields.notice_sequence
          - entities.DeficiencyNotice.fields.issued_at
          - entities.SegregationHold.fields.placed_at
          - entities.Communication.fields.sent_at
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Every timestamp on this surface comes from the injectable logical clock, never from the host
          wall clock, and the ids/sequences are server-assigned: notice_sequence starts at 1 and
          increments per draft order, so two notices on the same draft are 1 and 2 (not a global counter
          and not a client value). Because the clock is injectable, a test can move it backwards between
          two writes and the second row must carry the EARLIER stamp — impossible for a wall-clock
          implementation.
        test_recipe:
          setup:
            - "A PUBLISHED plan with requires_model_language true, one participant with an assignable PRE_TAX_DEFERRAL source of 1000000, one case."
            - "A draft with uses_model_language false is received at 2026-09-10, so a deficiency notice can be issued and the draft can cycle."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Clock Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], requires_model_language: true, earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Pia Lindqvist", ssn_last4: "7878", date_of_birth: "1978-07-07", participation_start_date: "2010-01-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlanAdministrator
              captures: { clock1: $.data.current_utc }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Nils Lindqvist", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1980-08-08", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-SYS", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { draft_id: $.data.id, received: $.data.received_at }
            - call: "GET /segregation-holds"
              payload: { qdro_case_id: "${case_id}" }
              as: PlanAdministrator
              captures: { placed: "$.data[0].placed_at", hold_expires: "$.data[0].expires_at" }
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "first notice" }
              as: QdroAnalyst
              as_user_id: "analyst-1"
              captures: { seq1: $.data.notice_sequence, issued1: $.data.issued_at, deadline1: $.data.resubmission_deadline_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /draft-orders/${draft_id}/resubmit"
              payload: { document_reference: "DRO-2663-SYS-r2", uses_model_language: false, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: Participant
              as_user_id: "${part_id}"
            - call: "POST /draft-orders/${draft_id}/deficiency-notices"
              payload: { reviewer_notes: "second notice" }
              as: QdroAnalyst
              as_user_id: "analyst-1"
              captures: { seq2: $.data.notice_sequence, issued2: $.data.issued_at, deadline2: $.data.resubmission_deadline_at }
          assert:
            - "${clock1} == \"2026-09-10T00:00:00Z\" — the clock endpoint echoes the instant it installed."
            - "${received} == \"2026-09-10T00:00:00Z\" and ${placed} == \"2026-09-10T00:00:00Z\" and ${hold_expires} == \"2028-03-11T00:00:00Z\" (2026-09-10 plus 548 days) — all three from the logical clock."
            - "${seq1} == 1 and ${seq2} == 2 — notice_sequence is per-draft-order and server-assigned; no client field can influence it."
            - "${issued1} == \"2026-09-10T00:00:00Z\" with ${deadline1} == \"2026-11-09T00:00:00Z\", and ${issued2} == \"2026-09-20T00:00:00Z\" with ${deadline2} == \"2026-11-19T00:00:00Z\" — each notice's 60-day window runs from ITS OWN issuance, so the two deadlines differ by exactly the 10 days the clock advanced."
            - "GET /draft-orders/${draft_id} reports received_at still \"2026-09-10T00:00:00Z\" after the resubmission — received_at is the first receipt and is not restamped, while revision_number is 2."
            - "GET /qdro-cases/${case_id}/communications reports the RECEIPT_ACKNOWLEDGMENT with sent_at \"2026-09-10T00:00:00Z\" and both DEFICIENCY_NOTICE rows with sent_at \"2026-09-10T00:00:00Z\" and \"2026-09-20T00:00:00Z\" respectively — Communication has no version field to consult, so sent_at is the only ordering key."

      - name: immutable_entities_expose_no_version_and_no_mutator
        claim_type: immutability
        grounds:
          - entities.ValuationSnapshot
          - entities.TaxReport
          - entities.Communication
          - endpoints[GET /plan-accounts/{id}/valuation-snapshots]
          - endpoints[GET /tax-reports]
          - endpoints[GET /qdro-cases/{id}/communications]
        distinguishing_aspect: |
          Three entities are declared `common_fields: false` — ValuationSnapshot, TaxReport and
          Communication — which means they carry id/created_at/updated_at semantics only insofar as the
          scaffold declares them, have NO version field, and §1.5 exposes no endpoint that updates or
          deletes them. They are append-only evidence: a snapshot can only be superseded by adding
          another as_of_date, a tax line only by appending a corrective line, a communication only by
          sending another. The remaining eleven entities do carry version.
        test_recipe:
          setup:
            - "A PUBLISHED plan, a participant, an account with one assignable PRE_TAX_DEFERRAL source of 1000000, a snapshot on 2026-06-30, one case with one received draft at clock 2026-09-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Immutable Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Ravi Chandrasekaran", ssn_last4: "9090", date_of_birth: "1977-09-09", participation_start_date: "2010-01-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 1000000, source: "TRUSTEE_STATEMENT" }
              as: PlanAdministrator
              captures: { snap_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Meena Chandrasekaran", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1981-01-01", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-IMM", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { draft_id: $.data.id, draft_v: $.data.version }
          trigger:
            - call: "GET /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30" }
              as: PlanAdministrator
              captures: { snap_echo: "$.data[0].id", snap_balance: "$.data[0].balance_cents" }
            - call: "GET /qdro-cases/${case_id}/communications"
              payload: { template_code: "RECEIPT_ACKNOWLEDGMENT" }
              as: PlanAdministrator
              captures: { comm_origin: "$.data[0].origin", comm_sent: "$.data[0].sent_at" }
            - call: "POST /plan-accounts/${acct_id}/valuation-snapshots"
              payload: { as_of_date: "2026-06-30", balance_cents: 9999999, source: "MANUAL_ADJUSTMENT" }
              as: PlanAdministrator
              captures: { e_dup: $.data.error_id }
          assert:
            - "${snap_echo} == \"${snap_id}\" and ${snap_balance} == 1000000; the snapshot row contains NO version key, and §1.5 declares no POST/PUT/PATCH/DELETE on /plan-accounts/{id}/valuation-snapshots/{id} — the only way to change the account's history is to append a different as_of_date."
            - "${comm_origin} == \"SYSTEM\" and ${comm_sent} == \"2026-09-01T00:00:00Z\"; the Communication row contains NO version key and §1.5 exposes no mutator for it."
            - "${e_dup} == \"ERR_SNAPSHOT_DUPLICATE\" with HTTP 409 — an in-place correction is impossible even by re-POSTing the same as_of_date, and GET /plan-accounts/${acct_id}/valuation-snapshots still reports balance_cents 1000000 for 2026-06-30 (never 9999999)."
            - "By contrast the mutable neighbours DO carry version: ${acct_v} == 1 and ${draft_v} == 1 are present integers, and GET /qdro-cases/${case_id} reports version 2 after the receipt."
            - "A TaxReport row is likewise version-free: after any distribution, GET /tax-reports with alternate_payee_account_id set returns rows with no version key, and §1.5 exposes only GETs under /tax-reports."

      - name: child_creation_requires_a_resolvable_parent_in_the_right_collection
        claim_type: parent_relationships
        grounds:
          - validations[priority=30]
          - validations[priority=32]
          - entities.MoneySource.fields.plan_account_id
          - entities.DraftOrder.fields.qdro_case_id
          - entities.AttorneyAuthorization.fields.qdro_case_id
        distinguishing_aspect: |
          Sub-resource creation hangs off the parent's own collection, so the parent id is validated as a
          PATH parameter (priority 30) and reports the PARENT's 404 — a money source posted under an
          unknown /plan-accounts/{id} is ERR_PLAN_ACCOUNT_NOT_FOUND, never a MoneySource-flavoured error,
          because MoneySource has no collection of its own. When the same relationship travels in the body
          instead (POST /draft-orders.qdro_case_id) the check moves to priority 32 — one rung after the
          shape check — which is observable by sending a body FK that is unknown AND a malformed enum in
          the same request: the 400 wins.
        test_recipe:
          setup:
            - "A PUBLISHED plan with one participant, one plan account and one case at clock 2026-09-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Parent Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Ilse Brandt", ssn_last4: "1313", date_of_birth: "1976-01-01", participation_start_date: "2010-01-01" }
              as: PlanAdministrator
              captures: { part_id: $.data.id }
            - call: "POST /participants/${part_id}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acct_id: $.data.id }
            - call: "POST /plan-accounts/${acct_id}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
              payload: { participant_id: "${part_id}", alternate_payee_name: "Otto Brandt", valuation_date: "2026-06-30", marital_period_start: "2012-03-01", marital_period_end: "2026-02-01", alternate_payee_dob: "1979-09-09", alternate_payee_address_on_file: true }
              as: QdroAnalyst
              captures: { case_id: $.data.id, case_v: $.data.version }
          trigger:
            - call: "POST /plan-accounts/{id}/money-sources"
              payload: { source_code: "ROTH", balance_cents: 1000 }
              as: PlanAdministrator
              captures: { e_parent_path: $.data.error_id }
            - call: "POST /qdro-cases/{id}/attorney-authorizations"
              payload: { represents: "PARTICIPANT", attorney_name: "Orphan Counsel", attorney_bar_number: "BAR-2", attorney_email: "o@c.example", disclosure_scope: "LIMITED", effective_from: "2026-08-01", expires_at: "2027-08-01T00:00:00Z" }
              as: QdroAnalyst
              captures: { e_parent_case: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "00000000-0000-4000-8000-000000000003", expected_case_version: "${case_v}", document_reference: "DRO-2663-ORPH", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { e_body_fk: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "00000000-0000-4000-8000-000000000003", expected_case_version: "${case_v}", document_reference: "DRO-2663-ORPH2", uses_model_language: true, proposed_approach: "JOINT_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { e_shape_wins: $.data.error_id }
            - call: "POST /draft-orders"
              payload: { qdro_case_id: "${case_id}", expected_case_version: "${case_v}", document_reference: "DRO-2663-OK", uses_model_language: true, proposed_approach: "SEPARATE_INTEREST", proposed_formula_code: "PERCENTAGE_OF_ACCOUNT", proposed_percentage_bps: 4000 }
              as: QdroAnalyst
              captures: { ok_draft: $.data.id, ok_case: $.data.qdro_case_id }
          assert:
            - "${e_parent_path} == \"ERR_PLAN_ACCOUNT_NOT_FOUND\" with HTTP 404 — the child reports the PARENT's error id, since MoneySource owns no collection segment."
            - "${e_parent_case} == \"ERR_QDRO_CASE_NOT_FOUND\" with HTTP 404 for the same reason."
            - "${e_body_fk} == \"ERR_QDRO_CASE_NOT_FOUND\" with HTTP 404 — resolved at priority 32 from the body."
            - "${e_shape_wins} == \"ERR_INVALID_REQUEST\" with HTTP 400 — the same unknown body FK plus an undeclared proposed_approach literal reports the 400, proving priority 25 precedes priority 32."
            - "${ok_case} == \"${case_id}\" and the created draft is reachable from its parent: GET /draft-orders with qdro_case_id=${case_id} returns exactly 1 row whose id is ${ok_draft}."
            - "None of the three refusals created anything: GET /plan-accounts/${acct_id}/money-sources returns 1 row and GET /qdro-cases/${case_id}/attorney-authorizations returns 0 rows."

      - name: cross_aggregate_associations_are_validated_across_the_hierarchy
        claim_type: hybrid
        grounds:
          - complexity_profile.entity_topology
          - entities.SegregationHold.fields.plan_account_id
          - entities.SegregationHold.fields.qdro_case_id
          - entities.AlternatePayeeAccount.fields.qdro_case_id
          - endpoints[GET /segregation-holds]
          - endpoints[GET /participants/{id}/qdro-cases]
        distinguishing_aspect: |
          The topology is hybrid: Plan -> Participant -> PlanAccount -> MoneySource is a strict hierarchy,
          QdroCase hangs off Participant, and SegregationHold is a root-level entity that points at BOTH a
          QdroCase and a PlanAccount, which belong to different branches. The association must be
          consistent in both directions — the hold created for a case must name the PlanAccount reached
          through that case's participant, and listing holds by plan_account_id must return holds from
          every case on that account, while listing by qdro_case_id returns only that case's. A flat
          implementation that keys holds by case alone cannot answer the account-level query used by the
          aggregate-exposure check.
        test_recipe:
          setup:
            - "One PUBLISHED plan with TWO participants; participant A has one account with an assignable PRE_TAX_DEFERRAL source of 1000000, participant B has one account with an assignable PRE_TAX_DEFERRAL source of 500000."
            - "Two non-overlapping cases on participant A and one case on participant B, each with a received draft at clock 2026-09-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "Topology Plan", plan_type: "DEFINED_CONTRIBUTION", model_language_version: "MLA-2026.1", acceptable_formula_codes: ["PERCENTAGE_OF_ACCOUNT"], allowed_approaches: ["SEPARATE_INTEREST"], earnings_adjustment_method: "PERIOD_END" }
              as: PlanAdministrator
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/procedure-status"
              payload: { to_status: "PUBLISHED" }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Alma Ruiz", ssn_last4: "2323", date_of_birth: "1975-02-02", participation_start_date: "2000-01-01" }
              as: PlanAdministrator
              captures: { partA: $.data.id }
            - call: "POST /participants/${partA}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acctA: $.data.id }
            - call: "POST /plan-accounts/${acctA}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 1000000 }
              as: PlanAdministrator
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Bruno Ruiz", ssn_last4: "2424", date_of_birth: "1975-02-02", participation_start_date: "2000-01-01" }
              as: PlanAdministrator
              captures: { partB: $.data.id }
            - call: "POST /participants/${partB}/plan-accounts"
              payload: {}
              as: PlanAdministrator
              captures: { acctB: $.data.id }
            - call: "POST /plan-accounts/${acctB}/money-sources"
              payload: { source_code: "PRE_TAX_DEFERRAL", balance_cents: 500000 }
              as: PlanAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlanAdministrator
            - call: "POST /qdro-cases"
