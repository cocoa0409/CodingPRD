          assert:
            - "the first leakage test returns 200 with ContainmentZone.${zone1_id}.leakage_status == FAIL (17.9 < 18.00 floor) even though 1.00 % <= 5.00 % target"
            - "the third call returns 200 with ContainmentZone.${zone1_id}.leakage_status == PASS at exactly 18.0 Pa"
            - "ContainmentZone.${zone1_id}.test_count == 2 and measured_static_pressure_pa == 18.0"

