scaffold_corner_design:
  # ===========================================================================
  # Entities — creation, system/computed fields, defaults
  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_mints_system_fields_and_defaults
        claim_type: Creation
        grounds:
          - entities.Member.fields.loyalty_points
          - entities.Member.fields.loyalty_tier
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: "POST /members returns 201 with server-minted id, version 1, loyalty_points 0, loyalty_tier BRONZE, wallet_credit_cents 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "new@x.com", full_name: "New M" }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Member.${m_id}.loyalty_points == 0"
            - "Member.${m_id}.loyalty_tier == \"BRONZE\""
            - "Member.${m_id}.wallet_credit_cents == 0"
            - "Member.${m_id}.version == 1"

      - name: create_product_initializes_stock_reserved_zero
        claim_type: Computed Fields
        grounds:
          - entities.Product.fields.stock_reserved
        distinguishing_aspect: "POST /products with stock_on_hand 10 returns stock_reserved 0 regardless of any client-supplied value (computed)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "P-1", category: "GEAR", name: "Cap", price_cents: 2000, stock_on_hand: 10 }
              as: StoreManager
              captures: { p_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Product.${p_id}.stock_on_hand == 10"
            - "Product.${p_id}.stock_reserved == 0"

      - name: shoepair_copies_reminder_threshold_from_product
        claim_type: Computed Fields
        grounds:
          - entities.ShoePair.fields.reminder_threshold_km
        distinguishing_aspect: "ShoePair.reminder_threshold_km equals the SHOE product's max_mileage_km at creation; status ACTIVE, total_mileage_km 0."
        test_recipe:
          setup:
            - "Member; SHOE Product with max_mileage_km 800."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "msp@x.com", full_name: "M SP" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SHOE-2", category: "SHOE", name: "Racer", price_cents: 18000, stock_on_hand: 5, max_mileage_km: 800 }
              as: StoreManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /shoe-pairs"
              payload: { member_id: "${m_id}", product_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sp_id: $.data.id }
          assert:
            - "ShoePair.${sp_id}.reminder_threshold_km == 800"
            - "ShoePair.${sp_id}.total_mileage_km == 0"
            - "ShoePair.${sp_id}.status == \"ACTIVE\""

  # ===========================================================================
  # State machines — invalid transitions, terminal lockdown, side effects
  # ===========================================================================
  - section: state_machines
    instances:
      - name: fulfill_cart_order_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Order.PLACED_to_FULFILLED
        distinguishing_aspect: "Fulfilling an order still in CART (never placed) is rejected with ERR_INVALID_STATE; no pricing or points side effects fire."
        test_recipe:
          setup:
            - "Member; Staff; GEAR product stock 5; Order O in CART with one line (not placed)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Sam", role_type: "BOTH" }
              as: StoreManager
              captures: { staff_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mcart@x.com", full_name: "M Cart" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "C-1", category: "GEAR", name: "Tee", price_cents: 3000, stock_on_hand: 5 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /orders/${ord_id}/fulfill"
              payload: {}
              as: Staff
              as_user_id: "${staff_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_INVALID_STATE\""

      - name: activate_already_active_subscription_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Subscription.PENDING_to_ACTIVE
        distinguishing_aspect: "Activating a subscription that is already ACTIVE (second activate) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Member with a CLUB_BASIC subscription already activated (ACTIVE)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mact@x.com", full_name: "M Act" }
              as: Anonymous
              captures: { m_id: $.data.id, m_ver: $.data.version }
            - call: "POST /members/${m_id}/subscription"
              payload: { tier: "CLUB_BASIC", expected_member_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_INVALID_STATE\""

      - name: cancel_completed_appointment_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.FittingAppointment.SCHEDULED_to_COMPLETED
          - state_machines.FittingAppointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "A COMPLETED appointment (terminal) cannot be cancelled; ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Store; Fitter; Member; appointment booked and COMPLETED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Fay", role_type: "FITTER" }
              as: StoreManager
              captures: { f_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mcomp@x.com", full_name: "M Comp" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /fitting-appointments"
              payload: { member_id: "${m_id}", fitter_id: "${f_id}", service_type: "FOLLOWUP", start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T10:30:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
            - call: "POST /fitting-appointments/${a_id}/complete"
              payload: { gait_result: { pronation: "NEUTRAL" } }
              as: Staff
              as_user_id: "${f_id}"
          trigger:
            - call: "POST /fitting-appointments/${a_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_INVALID_STATE\""

      - name: session_cancel_cascades_all_enrollments_to_cancelled
        claim_type: Side Effect Execution
        grounds:
          - state_machines.TrainingSession.SCHEDULED_to_CANCELLED
          - state_machines.SessionEnrollment.ENROLLED_to_CANCELLED
        distinguishing_aspect: "Cancelling a session sets every ENROLLED/WAITLISTED enrollment to CANCELLED and enrolled_count to 0."
        test_recipe:
          setup:
            - "Store; Coach; SCHEDULED session capacity 2; two members ENROLLED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Cody", role_type: "COACH" }
              as: StoreManager
              captures: { coach_id: $.data.id }
            - call: "POST /members"
              payload: { email: "ma@x.com", full_name: "MA" }
              as: Anonymous
              captures: { ma_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mb@x.com", full_name: "MB" }
              as: Anonymous
              captures: { mb_id: $.data.id }
            - call: "POST /training-sessions"
              payload: { coach_id: "${coach_id}", store_id: "${store_id}", level: "BEGINNER", start_at: "2026-07-12T09:00:00Z", end_at: "2026-07-12T10:00:00Z", capacity: 2 }
              as: StoreManager
              captures: { sess_id: $.data.id }
            - call: "POST /training-sessions/${sess_id}/enrollments"
              payload: { member_id: "${ma_id}" }
              as: Member
              as_user_id: "${ma_id}"
              captures: { ena_id: $.data.id }
            - call: "POST /training-sessions/${sess_id}/enrollments"
              payload: { member_id: "${mb_id}" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { enb_id: $.data.id }
          trigger:
            - call: "POST /training-sessions/${sess_id}/cancel"
              payload: {}
              as: StoreManager
          assert:
            - "TrainingSession.${sess_id}.status == \"CANCELLED\""
            - "TrainingSession.${sess_id}.enrolled_count == 0"
            - "SessionEnrollment.${ena_id}.status == \"CANCELLED\""
            - "SessionEnrollment.${enb_id}.status == \"CANCELLED\""

      - name: run_log_below_threshold_keeps_shoepair_active
        claim_type: Side Effect Execution
        grounds:
          - calculations.shoe_mileage_rollup
          - state_machines.ShoePair.ACTIVE_to_REORDER_DUE
        distinguishing_aspect: "Total mileage 499 (below reminder_threshold_km 500) leaves status ACTIVE — the complement of the exact-threshold difficulty instance."
        test_recipe:
          setup:
            - "Member; SHOE Product max_mileage_km 500; ShoePair; one run-log of 300 km (total 300)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mlow@x.com", full_name: "M Low" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "SHOE-3", category: "SHOE", name: "Daily", price_cents: 12000, stock_on_hand: 5, max_mileage_km: 500 }
              as: StoreManager
              captures: { p_id: $.data.id }
            - call: "POST /shoe-pairs"
              payload: { member_id: "${m_id}", product_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /shoe-pairs/${sp_id}/run-logs"
              payload: { distance_km: 300 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /shoe-pairs/${sp_id}/run-logs"
              payload: { distance_km: 199 }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "ShoePair.${sp_id}.total_mileage_km == 499"
            - "ShoePair.${sp_id}.status == \"ACTIVE\""

  # ===========================================================================
  # Calculations — non-difficulty branches
  # ===========================================================================
  - section: calculations
    instances:
      - name: fitting_fee_no_subscription_full_base_price
        claim_type: Correct Result
        grounds:
          - calculations.fitting_fee
        distinguishing_aspect: "With no subscription, completing a SHOE_FITTING charges the full base 3000 (no included allowance, no discount)."
        test_recipe:
          setup:
            - "Store; Fitter; Member with no subscription; SCHEDULED SHOE_FITTING appointment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Fay", role_type: "FITTER" }
              as: StoreManager
              captures: { f_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mns@x.com", full_name: "M NoSub" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /fitting-appointments"
              payload: { member_id: "${m_id}", fitter_id: "${f_id}", service_type: "SHOE_FITTING", start_at: "2026-07-10T14:00:00Z", end_at: "2026-07-10T14:30:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /fitting-appointments/${a_id}/complete"
              payload: { gait_result: { pronation: "UNDER" } }
              as: Staff
              as_user_id: "${f_id}"
          assert:
            - "FittingAppointment.${a_id}.fee_cents == 3000"

      - name: order_return_refund_nets_restocking_fee
        claim_type: Correct Result
        grounds:
          - state_machines.Order.FULFILLED_to_RETURNED
          - entities.Order.fields.refund_cents
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: "Returning a FULFILLED order (final_total 10000) credits refund_cents 8500 = 10000 - round_half_up(10000*0.15) to the wallet and restocks units."
        test_recipe:
          setup:
            - "Member (no sub, BRONZE); Staff; GEAR Product priced 10000 stock 5; Order O with one line qty 1, placed then fulfilled at clock 2026-07-01 (final_total 10000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /members"
              payload: { email: "mrf@x.com", full_name: "M Refund" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Sam", role_type: "BOTH" }
              as: StoreManager
              captures: { staff_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "RF-1", category: "GEAR", name: "Shell", price_cents: 10000, stock_on_hand: 5 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ord_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ord_id}/fulfill"
              payload: {}
              as: Staff
              as_user_id: "${staff_id}"
          trigger:
            - call: "POST /orders/${ord_id}/return"
              payload: { reason: "fit" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Order.${ord_id}.status == \"RETURNED\""
            - "Order.${ord_id}.refund_cents == 8500"
            - "Member.${m_id}.wallet_credit_cents == 8500"
            - "Product.${prod_id}.stock_on_hand == 5"

  # ===========================================================================
  # Validations / Errors — breadth of the catalog
  # ===========================================================================
  - section: validations
    instances:
      - name: order_line_missing_required_qty_returns_validation
        claim_type: Violation to Error
        grounds:
          - validations[priority=3]
        distinguishing_aspect: "POST /orders/{id}/lines without qty returns ERR_VALIDATION (400)."
        test_recipe:
          setup:
            - "Member; GEAR product; CART order."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mv@x.com", full_name: "M Val" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "V-1", category: "GEAR", name: "Hat", price_cents: 1000, stock_on_hand: 5 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == \"ERR_VALIDATION\""

      - name: shoepair_create_on_non_shoe_product_returns_error
        claim_type: Violation to Error
        grounds:
          - validations[priority=8]
          - errors[ERR_PRODUCT_NOT_SHOE]
        distinguishing_aspect: "Creating a shoe pair against a GEAR product returns ERR_PRODUCT_NOT_SHOE (422)."
        test_recipe:
          setup:
            - "Member; GEAR (non-shoe) product."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mns2@x.com", full_name: "M NS" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "NS-1", category: "GEAR", name: "Gel", price_cents: 500, stock_on_hand: 5 }
              as: StoreManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /shoe-pairs"
              payload: { member_id: "${m_id}", product_id: "${prod_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == \"ERR_PRODUCT_NOT_SHOE\""

      - name: appointment_in_past_returns_error
        claim_type: Temporal validation
        grounds:
          - validations[priority=7]
          - errors[ERR_APPOINTMENT_IN_PAST]
        distinguishing_aspect: "Booking with start_at before the logical clock (2026-06-01 vs default 2026-07-01) returns ERR_APPOINTMENT_IN_PAST (422)."
        test_recipe:
          setup:
            - "Store; Fitter; Member; clock at default 2026-07-01."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Fay", role_type: "FITTER" }
              as: StoreManager
              captures: { f_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mpast@x.com", full_name: "M Past" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /fitting-appointments"
              payload: { member_id: "${m_id}", fitter_id: "${f_id}", service_type: "GAIT_ANALYSIS", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T10:30:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == \"ERR_APPOINTMENT_IN_PAST\""

      - name: place_order_insufficient_stock_returns_error
        claim_type: Violation to Error
        grounds:
          - validations[priority=8]
          - errors[ERR_INSUFFICIENT_STOCK]
        distinguishing_aspect: "Placing an order whose line qty 5 exceeds stock_on_hand 1 returns ERR_INSUFFICIENT_STOCK (409)."
        test_recipe:
          setup:
            - "Member; GEAR product stock_on_hand 1; CART order with a line qty 5."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mstk@x.com", full_name: "M Stk" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "ST-1", category: "GEAR", name: "Band", price_cents: 800, stock_on_hand: 1 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /orders/${ord_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_INSUFFICIENT_STOCK\""

      - name: coach_overlap_returns_coach_unavailable
        claim_type: Temporal validation
        grounds:
          - validations[priority=8]
          - errors[ERR_COACH_UNAVAILABLE]
        distinguishing_aspect: "Same coach, two overlapping sessions at a store with ample room_count (5) returns ERR_COACH_UNAVAILABLE (not a room conflict)."
        test_recipe:
          setup:
            - "Store (session_room_count 5); Coach C1; session T1 (coach C1) 10:00-11:00 SCHEDULED."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Big", region_code: "CA", session_room_count: 5 }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Coach One", role_type: "COACH" }
              as: StoreManager
              captures: { c1_id: $.data.id }
            - call: "POST /training-sessions"
              payload: { coach_id: "${c1_id}", store_id: "${store_id}", level: "BEGINNER", start_at: "2026-07-12T10:00:00Z", end_at: "2026-07-12T11:00:00Z", capacity: 10 }
              as: StoreManager
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /training-sessions"
              payload: { coach_id: "${c1_id}", store_id: "${store_id}", level: "BEGINNER", start_at: "2026-07-12T10:30:00Z", end_at: "2026-07-12T11:30:00Z", capacity: 10 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_COACH_UNAVAILABLE\""

      - name: allocate_unpaid_registration_returns_not_paid
        claim_type: Violation to Error
        grounds:
          - validations[priority=6]
          - errors[ERR_REGISTRATION_NOT_PAID]
        distinguishing_aspect: "Allocating a packet for a RESERVED but UNPAID registration returns ERR_REGISTRATION_NOT_PAID (409)."
        test_recipe:
          setup:
            - "OPEN event; Staff; Member registered (UNPAID/RESERVED)."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Sam", role_type: "BOTH" }
              as: StoreManager
              captures: { staff_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mnp@x.com", full_name: "M NP" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /race-events"
              payload: { name: "Dash", event_date: "2026-08-01T08:00:00Z", packet_capacity: 3, entry_fee_cents: 4000 }
              as: StoreManager
              captures: { ev_id: $.data.id }
            - call: "POST /race-events/${ev_id}/registrations"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /race-registrations/${reg_id}/allocate"
              payload: {}
              as: Staff
              as_user_id: "${staff_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == \"ERR_REGISTRATION_NOT_PAID\""

      - name: return_after_window_on_fulfilled_order_returns_window_expired
        claim_type: Temporal validation
        grounds:
          - validations[priority=7]
          - errors[ERR_RETURN_WINDOW_EXPIRED]
        distinguishing_aspect: "A still-FULFILLED order returned after fulfilled_at + 30 days (clock 2026-09-01) fails only the temporal check -> ERR_RETURN_WINDOW_EXPIRED (422); distinct from the state-wins conflict instance."
        test_recipe:
          setup:
            - "Member; Staff; GEAR product stock 5; Order placed and fulfilled at 2026-07-01 (still FULFILLED); clock advanced to 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Sam", role_type: "BOTH" }
              as: StoreManager
              captures: { staff_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mwin@x.com", full_name: "M Win" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "W-1", category: "GEAR", name: "Sock2", price_cents: 2000, stock_on_hand: 5 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ord_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ord_id}/fulfill"
              payload: {}
              as: Staff
              as_user_id: "${staff_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /orders/${ord_id}/return"
              payload: { reason: "late" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == \"ERR_RETURN_WINDOW_EXPIRED\""

  # ===========================================================================
  # Errors — not-found breadth + stubs for §1.8-covered triggers
  # ===========================================================================
  - section: errors
    instances:
      - name: get_missing_member_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_MEMBER_NOT_FOUND]
        distinguishing_aspect: "GET /members/{id} for a non-existent UUID returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == \"ERR_MEMBER_NOT_FOUND\""

      - name: register_on_missing_event_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_EVENT_NOT_FOUND]
        distinguishing_aspect: "POST /race-events/{id}/registrations for a non-existent event returns ERR_EVENT_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Member exists; no event."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mne@x.com", full_name: "M NE" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /race-events/00000000-0000-4000-8000-000000000000/registrations"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == \"ERR_EVENT_NOT_FOUND\""

      - name: error_invalid_state_covered_by_return_conflict
        claim_type: Violation to Error
        grounds:
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / return_state_beats_return_window_temporal
          rationale: "ERR_INVALID_STATE is asserted as the winning error of the named §1.8 conflict instance."

      - name: error_event_full_covered_by_boundary
        claim_type: Violation to Error
        grounds:
          - errors[ERR_EVENT_FULL]
        excluded_because:
          difficulty_instance: boundary_precision_check / race_packet_pool_exhausted_rejects_registration
          rationale: "ERR_EVENT_FULL is the asserted outcome of the packet-pool-exhausted boundary instance."

      - name: error_fitter_unavailable_covered_by_overlap
        claim_type: Violation to Error
        grounds:
          - errors[ERR_FITTER_UNAVAILABLE]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / fitting_pairwise_buffer_conflict_on_fitter
          rationale: "ERR_FITTER_UNAVAILABLE is the asserted outcome of the fitter-buffer overlap instance."

  # ===========================================================================
  # RBAC — denials
  # ===========================================================================
  - section: rbac
    instances:
      - name: member_cannot_create_product
        claim_type: RBAC Denial
        grounds:
          - roles.Member
          - roles.StoreManager
        distinguishing_aspect: "A Member calling POST /products (a StoreManager-exclusive op) gets ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup:
            - "A registered member."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mrb@x.com", full_name: "M RBAC" }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku: "X-1", category: "GEAR", name: "X", price_cents: 100, stock_on_hand: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == \"ERR_UNAUTHORIZED\""

      - name: member_cannot_fulfill_order_staff_only
        claim_type: RBAC Denial
        grounds:
          - roles.Member
          - roles.Staff
        distinguishing_aspect: "A Member calling POST /orders/{id}/fulfill (Staff-exclusive) gets ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup:
            - "Member with a PLACED order."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mff@x.com", full_name: "M FF" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "FF-1", category: "GEAR", name: "Y", price_cents: 1000, stock_on_hand: 5 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ord_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /orders/${ord_id}/fulfill"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == \"ERR_UNAUTHORIZED\""

  # ===========================================================================
  # Endpoints — reverse-reachability list + pagination envelope
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_staff_for_store_returns_array_envelope
        claim_type: Computed read
        grounds:
          - entities.StaffMember.fields.store_id
        distinguishing_aspect: "GET /stores/{id}/staff returns response_type array of the store's staff (reverse lookup for StaffMember.store_id)."
        test_recipe:
          setup:
            - "Store with one staff member."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Main", region_code: "CA" }
              as: StoreManager
              captures: { store_id: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store_id}", full_name: "Sam", role_type: "BOTH" }
              as: StoreManager
              captures: { staff_id: $.data.id }
          trigger:
            - call: "GET /stores/${store_id}/staff"
              payload: {}
              as: StoreManager
          assert:
            - "response.response_type == \"array\""
            - "response.data length == 1"
            - "response.data[0].id == ${staff_id}"

      - name: list_orders_by_member_paginated
        claim_type: Listing
        grounds:
          - entities.Order.fields.member_id
        distinguishing_aspect: "GET /orders?member_id=.. returns the member's orders with pagination fields total_count and has_more (reverse lookup for Order.member_id)."
        test_recipe:
          setup:
            - "Member with one CART order."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mlist@x.com", full_name: "M List" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "GET /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "response.response_type == \"array\""
            - "response.meta.total_count == 1"
            - "response.meta.has_more == false"

  # ===========================================================================
  # Cross-cutting complexity layers — optimistic concurrency (OCC)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: subscription_create_stale_member_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[subscription-create-stale-member]
          - entities.Member.fields.loyalty_points
        distinguishing_aspect: "A second POST /members/{id}/subscription carrying the original (now stale) expected_member_version is rejected with ERR_STALE_VERSION (412) because the first create advanced Member.version."
        test_recipe:
          setup:
            - "Member M registered at version 1; a first subscription created with expected_member_version 1 (Member.version now 2)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mocc@x.com", full_name: "M OCC" }
              as: Anonymous
              captures: { m_id: $.data.id, m_ver0: $.data.version }
            - call: "POST /members/${m_id}/subscription"
              payload: { tier: "CLUB_BASIC", expected_member_version: "${m_ver0}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /members/${m_id}/subscription"
              payload: { tier: "CLUB_PRO", expected_member_version: "${m_ver0}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == \"ERR_STALE_VERSION\""

  # ===========================================================================
  # Consistency model — immediate visibility
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: place_order_reservation_visible_immediately
        claim_type: immediate
        grounds:
          - state_machines.Order.CART_to_PLACED
          - entities.Product.fields.stock_reserved
        distinguishing_aspect: "Immediately after POST /orders/{id}/place, GET /products/{id} shows the reserved units (stock_on_hand 7, stock_reserved 3) in the same synchronous view."
        test_recipe:
          setup:
            - "Member; GEAR product stock 10; CART order with one line qty 3."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mim@x.com", full_name: "M Imm" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "IM-1", category: "GEAR", name: "Z", price_cents: 1000, stock_on_hand: 10 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${m_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${prod_id}", qty: 3 }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /orders/${ord_id}/place"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /products/${prod_id}"
              payload: {}
              as: StoreManager
          assert:
            - "Product.${prod_id}.stock_on_hand == 7"
            - "Product.${prod_id}.stock_reserved == 3"
