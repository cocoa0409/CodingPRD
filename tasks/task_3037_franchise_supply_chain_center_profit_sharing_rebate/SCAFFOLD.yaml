scenario: |
  Franchise Supply Chain Center & Profit-Sharing Rebate (Domino's): company-operated supply centers producing dough and distributing food and equipment to franchised stores, weekly order and delivery cadence with a single truck serving multiple stores, cost-plus pricing to stores with a profit-sharing rebate returned to franchisees that purchase exclusively, store-level food cost variance analysis against theoretical usage, equipment and smallwares sales integrated with the same delivery, capacity planning for national promotions creating ingredient surges, franchisee compliance with approved-supplier requirements, rebate calculation, holdback and settlement timing

domain_name: franchise-supply-chain
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
    - temporal_windowing
    - bulk_operations
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: SupplyCenter
    parent: null
    common_fields: true
    fields:
      - name: center_code
        type: string
        source: input
        description: "Unique center identifier code"
        constraints: "unique, immutable after creation"
      - name: display_name
        type: string
        source: input
        description: "Human-readable center name"
      - name: base_weekly_capacity_units
        type: integer
        source: input
        description: "Baseline production capacity in dough-equivalent units per week"
      - name: surge_capacity_multiplier
        type: number
        source: input
        default: 1.0
        description: "Capacity multiplier during confirmed promotions (1.0 = no surge)"
      - name: ops_run_index
        type: integer
        source: system
        default: 0
        description: "Monotone counter incremented by run_ops checkpoint"
      - name: rebate_pool_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Accumulated profit-sharing pool for current quarter"
      - name: rebate_pool_locked_cents
        type: integer
        source: computed
        default: 0
        description: "Portion of pool locked by unsettled holdbacks"
      - name: posture
        type: enum
        source: computed
        description: "ACTIVE | CONSTRAINED | SURGE_MODE | SUSPENDED"
      - name: status
        type: enum
        source: system
        description: "DRAFT → ACTIVE → SUSPENDED → ACTIVE / DECOMMISSIONED"

  - name: Store
    parent: SupplyCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: system
        description: "FK -> SupplyCenter.id"
      - name: store_number
        type: string
        source: input
        description: "Unique store identifier within center"
        constraints: "unique per center, immutable"
      - name: operator_name
        type: string
        source: input
        description: "Franchisee operator legal name"
      - name: compliance_tier
        type: enum
        source: computed
        description: "FULL_COMPLIANCE | PROBATION | NON_COMPLIANT"
      - name: exclusive_purchase_pct
        type: number
        source: computed
        default: 0
        description: "Percentage of weekly purchases from this center (0.0–1.0)"
      - name: rebate_eligibility_status
        type: enum
        source: computed
        description: "ELIGIBLE | CONDITIONAL | INELIGIBLE"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        default: 0
        description: "Unpaid invoiced amount across all settled POs"
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum allowed outstanding balance"
      - name: status
        type: enum
        source: system
        description: "ONBOARDING → ACTIVE → SUSPENDED → ACTIVE / TERMINATED"

  - name: Product
    parent: SupplyCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: system
        description: "FK -> SupplyCenter.id"
      - name: sku
        type: string
        source: input
        description: "Stock-keeping unit code"
        constraints: "unique per center"
      - name: name
        type: string
        source: input
        description: "Product display name"
      - name: category
        type: enum
        source: input
        description: "DOUGH | FOOD_INGREDIENT | EQUIPMENT | SMALLWARES | PACKAGING"
      - name: base_cost_cents_per_unit
        type: integer
        source: input
        description: "Production or acquisition cost per unit"
      - name: shelf_life_days
        type: integer
        source: input
        required: false
        description: "Days until expiration; null for non-perishables"
      - name: is_promotion_eligible
        type: boolean
        source: input
        default: false
        description: "Whether this product participates in national promotions"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | DISCONTINUED | RECALLED"

  - name: DeliveryRoute
    parent: SupplyCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: system
        description: "FK -> SupplyCenter.id"
      - name: route_code
        type: string
        source: input
        description: "Route identifier (e.g., R1, R2)"
      - name: day_of_week
        type: enum
        source: input
        description: "MONDAY | TUESDAY | WEDNESDAY | THURSDAY | FRIDAY | SATURDAY | SUNDAY"
      - name: truck_capacity_units
        type: integer
        source: input
        description: "Maximum load in dough-equivalent units"
      - name: assigned_store_ids
        type: array
        source: input
        description: "Ordered list of Store.id values served by this route"
      - name: status
        type: enum
        source: system
        description: "PLANNED → DISPATCHED → COMPLETED / CANCELLED"
      - name: dispatched_at
        type: datetime
        source: system
        required: false
        description: "Timestamp when route left the center"

  - name: DeliveryStop
    parent: DeliveryRoute
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: system
        description: "FK -> DeliveryRoute.id"
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id"
      - name: sequence_number
        type: integer
        source: system
        description: "Stop order on the route (1-based)"
      - name: estimated_arrival
        type: datetime
        source: system
        description: "Projected arrival time"
      - name: actual_arrival
        type: datetime
        source: input
        required: false
        description: "Recorded arrival time, null until completed"
      - name: status
        type: enum
        source: system
        description: "PENDING → ARRIVED → COMPLETED / SKIPPED / FAILED"

  - name: PurchaseOrder
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id"
      - name: center_id
        type: string
        source: system
        description: "FK -> SupplyCenter.id"
      - name: week_start_date
        type: datetime
        source: input
        description: "Monday 00:00:00 UTC of the ordering week"
      - name: status
        type: enum
        source: system
        description: "DRAFT → SUBMITTED → CONFIRMED → LOADED → DELIVERED → SETTLED / CANCELLED / REJECTED"
      - name: subtotal_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of line extended prices before markup"
      - name: markup_cents
        type: integer
        source: computed
        default: 0
        description: "Total cost-plus markup applied"
      - name: delivery_fee_cents
        type: integer
        source: computed
        default: 0
        description: "Route delivery surcharge"
      - name: total_cents
        type: integer
        source: computed
        default: 0
        description: "subtotal + markup + delivery_fee"
      - name: theoretical_usage_cents
        type: integer
        source: computed
        default: 0
        description: "Expected ingredient cost based on sales mix"
      - name: actual_usage_cents
        type: integer
        source: computed
        default: 0
        description: "Recorded actual ingredient cost from invoice"
      - name: food_cost_variance_pct
        type: number
        source: computed
        description: "(actual - theoretical) / theoretical, null until settled"
      - name: promotion_id
        type: string
        source: input
        required: false
        description: "FK -> PromotionEvent.id, if order is under a promotion"
      - name: route_id
        type: string
        source: system
        required: false
        description: "FK -> DeliveryRoute.id assigned at confirmation"

  - name: OrderLine
    parent: PurchaseOrder
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> PurchaseOrder.id"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id"
      - name: quantity
        type: integer
        source: input
        description: "Units ordered"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Cost-plus unit price at time of order"
      - name: extended_price_cents
        type: integer
        source: computed
        description: "= quantity * unit_price_cents"
      - name: theoretical_usage_cents
        type: integer
        source: computed
        description: "Ingredient cost component for variance analysis"
      - name: status
        type: enum
        source: system
        description: "PENDING → CONFIRMED → SHIPPED → DELIVERED / SHORTED / CANCELLED"

  - name: PriceBook
    parent: SupplyCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: system
        description: "FK -> SupplyCenter.id"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id"
      - name: store_tier
        type: enum
        source: input
        description: "STANDARD | VOLUME_DISCOUNT | PREMIUM"
      - name: markup_pct
        type: number
        source: input
        description: "Cost-plus markup percentage (e.g., 0.15 = 15%)"
      - name: min_quantity
        type: integer
        source: input
        default: 1
        description: "Minimum order quantity for this price tier"
      - name: effective_from
        type: datetime
        source: input
        description: "Start of price validity window"
      - name: effective_until
        type: datetime
        source: input
        description: "End of price validity window"
      - name: status
        type: enum
        source: system
        description: "ACTIVE | SUPERSEDED | EXPIRED"

  - name: RebatePool
    parent: SupplyCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: system
        description: "FK -> SupplyCenter.id"
      - name: quarter
        type: string
        source: input
        description: "Quarter identifier, e.g., 2026-Q3"
      - name: pool_total_cents
        type: integer
        source: computed
        default: 0
        description: "Total profit-sharing pool for the quarter"
      - name: distributed_cents
        type: integer
        source: computed
        default: 0
        description: "Amount already paid out"
      - name: holdback_cents
        type: integer
        source: computed
        default: 0
        description: "Amount reserved for pending settlements"
      - name: status
        type: enum
        source: system
        description: "OPEN → CALCULATING → SETTLING → CLOSED"

  - name: RebateLedger
    parent: RebatePool
    common_fields: true
    fields:
      - name: pool_id
        type: string
        source: system
        description: "FK -> RebatePool.id"
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id"
      - name: entry_type
        type: enum
        source: system
        description: "ACCRUAL | HOLDBACK | SETTLEMENT | ADJUSTMENT | FORFEITURE"
      - name: amount_cents
        type: integer
        source: computed
        description: "Positive = credit to store, negative = clawback"
      - name: running_balance_cents
        type: integer
        source: computed
        description: "Store's cumulative rebate balance after this entry"
      - name: source_order_id
        type: string
        source: system
        required: false
        description: "FK -> PurchaseOrder.id for accruals"
      - name: settlement_date
        type: datetime
        source: input
        required: false
        description: "Scheduled settlement date for HOLDBACK entries"
      - name: status
        type: enum
        source: system
        description: "PENDING → POSTED → SETTLED / VOIDED"

  - name: ComplianceAgreement
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id"
      - name: agreement_type
        type: enum
        source: input
        description: "EXCLUSIVE_PURCHASE | APPROVED_SUPPLIER | BRAND_STANDARD"
      - name: start_date
        type: datetime
        source: input
        description: "Agreement effective start"
      - name: end_date
        type: datetime
        source: input
        required: false
        description: "Agreement expiry; null for perpetual"
      - name: exclusive_purchase_threshold
        type: number
        source: input
        description: "Minimum exclusive purchase percentage required (e.g., 0.95)"
      - name: status
        type: enum
        source: system
        description: "PROPOSED → ACTIVE → BREACHED → CURED / TERMINATED"
      - name: breach_count
        type: integer
        source: system
        default: 0
        description: "Number of compliance breaches recorded"
      - name: cure_deadline
        type: datetime
        source: system
        required: false
        description: "Deadline to cure a breach before termination"

  - name: PromotionEvent
    parent: SupplyCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: system
        description: "FK -> SupplyCenter.id"
      - name: promotion_code
        type: string
        source: input
        description: "National promotion identifier"
      - name: start_date
        type: datetime
        source: input
        description: "Promotion start"
      - name: end_date
        type: datetime
        source: input
        description: "Promotion end"
      - name: surge_multiplier
        type: number
        source: input
        description: "Demand surge factor (e.g., 2.5 = 150% increase)"
      - name: affected_product_ids
        type: array
        source: input
        description: "Product.id values participating in promotion"
      - name: capacity_reserved_units
        type: integer
        source: computed
        default: 0
        description: "Production capacity reserved for this promotion"
      - name: status
        type: enum
        source: system
        description: "FORECASTED → CONFIRMED → EXECUTING → CLOSED / CANCELLED"

  - name: CapacityPlan
    parent: SupplyCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: system
        description: "FK -> SupplyCenter.id"
      - name: week_start_date
        type: datetime
        source: input
        description: "Week being planned (Monday)"
      - name: baseline_units
        type: integer
        source: computed
        description: "Normal weekly capacity"
      - name: surge_units
        type: integer
        source: computed
        default: 0
        description: "Additional units from promotions"
      - name: allocated_units
        type: integer
        source: computed
        default: 0
        description: "Units already committed to confirmed orders"
      - name: available_units
        type: integer
        source: computed
        description: "= baseline + surge - allocated"
      - name: status
        type: enum
        source: system
        description: "OPEN → LOCKED → RECONCILED / OVERBOOKED"

  - name: FoodCostVariance
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id"
      - name: week_start_date
        type: datetime
        source: input
        description: "Week of analysis"
      - name: theoretical_cents
        type: integer
        source: computed
        description: "Sum of theoretical usage from all settled POs"
      - name: actual_cents
        type: integer
        source: computed
        description: "Sum of actual usage from all settled POs"
      - name: variance_cents
        type: integer
        source: computed
        description: "= actual - theoretical"
      - name: variance_pct
        type: number
        source: computed
        description: "= variance_cents / theoretical_cents"
      - name: severity
        type: enum
        source: computed
        description: "GREEN | YELLOW | RED based on variance_pct thresholds"
      - name: status
        type: enum
        source: system
        description: "PENDING → FINALIZED / FLAGGED"

state_machines:
  - entity: SupplyCenter
    initial_state: DRAFT
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /supply-centers/{centerId}/activate"
        actor: SupplyChainAdmin
        preconditions:
          - "base_weekly_capacity_units > 0"
          - "At least one Product with status=ACTIVE"
        side_effects:
          - "posture = ACTIVE"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /supply-centers/{centerId}/suspend"
        actor: SupplyChainAdmin
        preconditions: []
        side_effects:
          - "All PLANNED routes → CANCELLED"
          - "All DRAFT and SUBMITTED POs → REJECTED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /supply-centers/{centerId}/activate"
        actor: SupplyChainAdmin
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /supply-centers/{centerId}/decommission"
        actor: SupplyChainAdmin
        preconditions:
          - "No stores in ACTIVE status"
          - "No POs in SUBMITTED, CONFIRMED, LOADED, or DELIVERED"
          - "No routes in PLANNED or DISPATCHED"
          - "All RebatePools in CLOSED status"
        side_effects:
          - "All remaining stores → TERMINATED"

  - entity: Store
    initial_state: ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /supply-centers/{centerId}/stores/{storeId}/activate"
        actor: SupplyChainAdmin
        preconditions:
          - "Center is ACTIVE"
          - "At least one ACTIVE ComplianceAgreement"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /supply-centers/{centerId}/stores/{storeId}/suspend OR system (automatic when outstanding_balance_cents > credit_limit_cents)"
        actor: SupplyChainAdmin | system
        preconditions: []
        side_effects:
          - "All DRAFT and SUBMITTED POs → CANCELLED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /supply-centers/{centerId}/stores/{storeId}/activate"
        actor: SupplyChainAdmin
        preconditions:
          - "outstanding_balance_cents <= credit_limit_cents"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /supply-centers/{centerId}/stores/{storeId}/terminate"
        actor: SupplyChainAdmin
        preconditions:
          - "No POs in SUBMITTED, CONFIRMED, LOADED, or DELIVERED"
          - "outstanding_balance_cents == 0"
        side_effects:
          - "All ComplianceAgreements → TERMINATED"

  - entity: DeliveryRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /supply-centers/{centerId}/routes/{routeId}/dispatch"
        actor: RouteCoordinator
        preconditions:
          - "Center is ACTIVE or SURGE_MODE"
          - "All assigned stores are ACTIVE"
          - "Total load <= truck_capacity_units"
        side_effects:
          - "dispatched_at = now"
          - "All DeliveryStops → PENDING"

      - from: DISPATCHED
        to: COMPLETED
        trigger: "system (automatic when all DeliveryStops are COMPLETED, SKIPPED, or FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "All DELIVERED POs on this route → SETTLED"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /supply-centers/{centerId}/routes/{routeId}/cancel"
        actor: RouteCoordinator
        preconditions: []
        side_effects:
          - "All assigned CONFIRMED POs → SUBMITTED (unassigned from route)"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /supply-centers/{centerId}/routes/{routeId}/cancel"
        actor: RouteCoordinator
        preconditions:
          - "No DeliveryStops have status=COMPLETED"
        side_effects:
          - "All DeliveryStops → SKIPPED"
          - "All LOADED POs → CONFIRMED"

  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [SETTLED, CANCELLED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /supply-centers/{centerId}/stores/{storeId}/purchase-orders/{orderId}/submit"
        actor: StoreManager
        preconditions:
          - "Store is ACTIVE"
          - "Center is ACTIVE or SURGE_MODE"
          - "Order has at least one line"
          - "Total <= store credit_limit minus outstanding balance"
        side_effects:
          - "subtotal_cents, markup_cents, delivery_fee_cents, total_cents computed"

      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /supply-centers/{centerId}/purchase-orders/{orderId}/confirm"
        actor: SupplyChainAdmin
        preconditions:
          - "CapacityPlan for week has available_units >= order total units"
          - "If promotion_id set: PromotionEvent is CONFIRMED or EXECUTING"
        side_effects:
          - "route_id assigned to next PLANNED route covering store"
          - "All OrderLines → CONFIRMED"
          - "CapacityPlan.allocated_units += order units"

      - from: CONFIRMED
        to: LOADED
        trigger: "POST /supply-centers/{centerId}/purchase-orders/{orderId}/load"
        actor: RouteCoordinator
        preconditions:
          - "Assigned route is DISPATCHED"
        side_effects:
          - "All OrderLines → SHIPPED"

      - from: LOADED
        to: DELIVERED
        trigger: "POST /supply-centers/{centerId}/purchase-orders/{orderId}/deliver"
        actor: RouteCoordinator
        preconditions:
          - "DeliveryStop for this store is ARRIVED"
        side_effects:
          - "All OrderLines → DELIVERED"
          - "actual_usage_cents recorded from invoice"

      - from: DELIVERED
        to: SETTLED
        trigger: "system (automatic when route completes OR POST /supply-centers/{centerId}/purchase-orders/{orderId}/settle)"
        actor: system | SupplyChainAdmin
        preconditions:
          - "All OrderLines are DELIVERED or SHORTED"
        side_effects:
          - "food_cost_variance_pct computed"
          - "Store.outstanding_balance_cents += total_cents"
          - "RebateLedger ACCRUAL entry created if store eligible"
          - "FoodCostVariance for week updated"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /supply-centers/{centerId}/stores/{storeId}/purchase-orders/{orderId}/cancel"
        actor: StoreManager
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /supply-centers/{centerId}/stores/{storeId}/purchase-orders/{orderId}/cancel"
        actor: StoreManager
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /supply-centers/{centerId}/purchase-orders/{orderId}/reject"
        actor: SupplyChainAdmin
        preconditions: []
        side_effects: []

  - entity: OrderLine
    initial_state: PENDING
    terminal_states: [DELIVERED, SHORTED, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "system (cascade from PO confirmation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: SHIPPED
        trigger: "system (cascade from PO loading)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SHIPPED
        to: DELIVERED
        trigger: "system (cascade from PO delivery)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SHIPPED
        to: SHORTED
        trigger: "POST /supply-centers/{centerId}/purchase-orders/{orderId}/lines/{lineId}/mark-shorted"
        actor: RouteCoordinator
        preconditions: []
        side_effects:
          - "PO total_cents recalculated without this line"
          - "CapacityPlan.allocated_units -= line quantity"

      - from: PENDING
        to: CANCELLED
        trigger: "system (cascade from PO cancellation)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ComplianceAgreement
    initial_state: PROPOSED
    terminal_states: [CURED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /supply-centers/{centerId}/stores/{storeId}/compliance-agreements/{agreementId}/activate"
        actor: SupplyChainAdmin
        preconditions:
          - "Store is ACTIVE or ONBOARDING"
        side_effects:
          - "Store.rebate_eligibility_status re-evaluated"

      - from: ACTIVE
        to: BREACHED
        trigger: "system (automatic when exclusive_purchase_pct < threshold for 2 consecutive weeks)"
        actor: system
        preconditions: []
        side_effects:
          - "breach_count += 1"
          - "cure_deadline = now + 7 days"
          - "Store.rebate_eligibility_status = CONDITIONAL"
          - "Store.compliance_tier = PROBATION"

      - from: BREACHED
        to: CURED
        trigger: "POST /supply-centers/{centerId}/stores/{storeId}/compliance-agreements/{agreementId}/cure"
        actor: SupplyChainAdmin
        preconditions:
          - "Current exclusive_purchase_pct >= threshold"
        side_effects:
          - "Store.rebate_eligibility_status re-evaluated"
          - "Store.compliance_tier re-evaluated"

      - from: BREACHED
        to: TERMINATED
        trigger: "system (automatic when cure_deadline passes without cure) OR POST /supply-centers/{centerId}/stores/{storeId}/compliance-agreements/{agreementId}/terminate"
        actor: system | SupplyChainAdmin
        preconditions: []
        side_effects:
          - "Store.rebate_eligibility_status = INELIGIBLE"
          - "Store.compliance_tier = NON_COMPLIANT"

  - entity: PromotionEvent
    initial_state: FORECASTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: FORECASTED
        to: CONFIRMED
        trigger: "POST /supply-centers/{centerId}/promotions/{promotionId}/confirm"
        actor: SupplyChainAdmin
        preconditions:
          - "Center has sufficient surge capacity"
        side_effects:
          - "Center.posture = SURGE_MODE"
          - "Center.surge_capacity_multiplier = promotion.surge_multiplier"
          - "CapacityPlan for affected weeks: surge_units increased"

      - from: CONFIRMED
        to: EXECUTING
        trigger: "system (automatic when start_date reached)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EXECUTING
        to: CLOSED
        trigger: "system (automatic when end_date reached) OR POST /supply-centers/{centerId}/promotions/{promotionId}/close"
        actor: system | SupplyChainAdmin
        preconditions: []
        side_effects:
          - "Center.surge_capacity_multiplier = 1.0"
          - "Center.posture re-evaluated"
          - "CapacityPlan for future weeks: surge_units reset"

      - from: FORECASTED
        to: CANCELLED
        trigger: "POST /supply-centers/{centerId}/promotions/{promotionId}/cancel"
        actor: SupplyChainAdmin
        preconditions: []
        side_effects:
          - "All POs referencing this promotion → REJECTED"

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /supply-centers/{centerId}/promotions/{promotionId}/cancel"
        actor: SupplyChainAdmin
        preconditions:
          - "No POs referencing this promotion are beyond SUBMITTED"
        side_effects:
          - "Center.posture re-evaluated"
          - "Affected POs → REJECTED"

  - entity: RebatePool
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CALCULATING
        trigger: "system (automatic at quarter end) OR POST /supply-centers/{centerId}/rebate-pools/{poolId}/calculate"
        actor: system | SupplyChainAdmin
        preconditions: []
        side_effects:
          - "pool_total_cents computed from all settled POs in quarter"
          - "Per-store rebate shares computed"

      - from: CALCULATING
        to: SETTLING
        trigger: "POST /supply-centers/{centerId}/rebate-pools/{poolId}/settle"
        actor: SupplyChainAdmin
        preconditions:
          - "All RebateLedger entries are POSTED or SETTLED"
        side_effects:
          - "HOLDBACK entries created for disputed amounts"
          - "SETTLEMENT entries scheduled"

      - from: SETTLING
        to: CLOSED
        trigger: "system (automatic when all SETTLEMENT entries are SETTLED or VOIDED)"
        actor: system
        preconditions: []
        side_effects:
          - "Center.rebate_pool_balance_cents = 0"
          - "Center.rebate_pool_locked_cents = 0"

  - entity: RebateLedger
    initial_state: PENDING
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: PENDING
        to: POSTED
        trigger: "system (cascade from RebatePool SETTLING)"
        actor: system
        preconditions: []
        side_effects: []

      - from: POSTED
        to: SETTLED
        trigger: "system (automatic when settlement_date reached AND no active dispute)"
        actor: system
        preconditions: []
        side_effects:
          - "Store.outstanding_balance_cents -= amount_cents (if positive)"

      - from: POSTED
        to: VOIDED
        trigger: "POST /supply-centers/{centerId}/rebate-ledgers/{ledgerId}/void"
        actor: SupplyChainAdmin
        preconditions:
          - "Entry is not SETTLED"
        side_effects:
          - "RebatePool.distributed_cents -= amount_cents"
          - "RebatePool.holdback_cents adjusted"

  - entity: CapacityPlan
    initial_state: OPEN
    terminal_states: [RECONCILED, OVERBOOKED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /supply-centers/{centerId}/capacity-plans/{planId}/lock"
        actor: SupplyChainAdmin
        preconditions:
          - "allocated_units <= baseline_units + surge_units"
        side_effects: []

      - from: LOCKED
        to: RECONCILED
        trigger: "system (automatic at week end via run_ops)"
        actor: system
        preconditions: []
        side_effects:
          - "Variance between allocated and actual production recorded"

      - from: OPEN
        to: OVERBOOKED
        trigger: "system (automatic when allocated_units > baseline + surge)"
        actor: system
        preconditions: []
        side_effects:
          - "Center.posture = CONSTRAINED"
          - "New PO confirmations blocked"

      - from: OVERBOOKED
        to: OPEN
        trigger: "system (automatic when allocated_units <= baseline + surge after cancellations)"
        actor: system
        preconditions: []
        side_effects:
          - "Center.posture re-evaluated"

  - entity: FoodCostVariance
    initial_state: PENDING
    terminal_states: [FINALIZED, FLAGGED]
    transitions:
      - from: PENDING
        to: FINALIZED
        trigger: "system (automatic at week end via run_ops)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: FLAGGED
        trigger: "system (automatic when variance_pct exceeds RED threshold)"
        actor: system
        preconditions: []
        side_effects:
          - "Alert to SupplyChainAdmin"
          - "Store.compliance_tier may be downgraded"

concurrency_rules:
  - rule_id: purchase-order-submit-stale-store
    parent_entity: Store
    write_endpoint: "POST /supply-centers/{centerId}/stores/{storeId}/purchase-orders/{orderId}/submit"
    occ_field: "expected_store_version"
    description: |
      Submitting a PurchaseOrder against a Store whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just created or cancelled a PO (which changes
      Store.outstanding_balance_cents and Store.version), or suspended the
      store, making the current writer's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: price-book-create-stale-center
    parent_entity: SupplyCenter
    write_endpoint: "POST /supply-centers/{centerId}/price-books"
    occ_field: "expected_center_version"
    description: |
      Creating a PriceBook against a SupplyCenter whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just modified capacity or posture, making
      the pricing decision stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: capacity-plan-lock-stale-center
    parent_entity: SupplyCenter
    write_endpoint: "POST /supply-centers/{centerId}/capacity-plans/{planId}/lock"
    occ_field: "expected_center_version"
    description: |
      Locking a CapacityPlan against a SupplyCenter whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just confirmed a PO or activated a promotion,
      changing allocated_units and making the lock decision stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: cost_plus_unit_price
    trigger: "order line creation or PO submission"
    algorithm: tiered_pricing
    formula: |
      For a given store, product, and quantity:
      1. Find the ACTIVE PriceBook matching (center_id, product_id, store_tier)
         where effective_from <= now < effective_until
         and min_quantity <= quantity
      2. If multiple tiers match, select the one with the highest min_quantity
         that still satisfies min_quantity <= quantity
      3. unit_price_cents = floor(base_cost_cents_per_unit * (1 + markup_pct))
      4. extended_price_cents = quantity * unit_price_cents
    constants:
      DEFAULT_MARKUP_PCT: 0.15
      VOLUME_DISCOUNT_THRESHOLD: 100
      VOLUME_DISCOUNT_MARKUP_PCT: 0.12
      PREMIUM_MARKUP_PCT: 0.20
    precision: "integer cents, floor on unit price"
    variants:
      - name: provisional
        when: "PO is DRAFT or SUBMITTED"
        difference: "Uses current PriceBook; recalculated on submit"
      - name: confirmed
        when: "PO is CONFIRMED or later"
        difference: "Locked at confirmation; recalculation requires re-confirmation"

  - name: order_total_cents
    trigger: "PO submission, line changes, confirmation"
    algorithm: aggregation
    formula: |
      subtotal_cents = sum(extended_price_cents for all PENDING/CONFIRMED lines)
      markup_cents = subtotal_cents - sum(base_cost * quantity for all lines)
      delivery_fee_cents = compute_delivery_fee(store, center, week)
      total_cents = subtotal_cents + markup_cents + delivery_fee_cents
    precision: "integer cents"
    variants:
      - name: with_promotion
        when: "promotion_id is set and promotion is active"
        difference: "delivery_fee_cents waived; surge surcharge applied to subtotal"

  - name: theoretical_usage
    trigger: "PO settlement"
    algorithm: aggregation
    formula: |
      For each DELIVERED OrderLine in the PO:
        theoretical_usage_cents = quantity * product.base_cost_cents_per_unit * ingredient_yield_factor
      ingredient_yield_factor varies by product category:
        DOUGH: 0.85
        FOOD_INGREDIENT: 0.92
        PACKAGING: 1.00
        EQUIPMENT: 0.00 (excluded from food cost)
        SMALLWARES: 0.00 (excluded)
      PO.theoretical_usage_cents = sum of line theoretical_usage_cents
    constants:
      DOUGH_YIELD: 0.85
      FOOD_INGREDIENT_YIELD: 0.92
      PACKAGING_YIELD: 1.00
    precision: "integer cents, floor per line"

  - name: food_cost_variance
    trigger: "PO settlement"
    algorithm: threshold
    formula: |
      if theoretical_usage_cents == 0:
        variance_pct = null (no food items)
        severity = GREEN
      else:
        variance_cents = actual_usage_cents - theoretical_usage_cents
        variance_pct = variance_cents / theoretical_usage_cents
        if variance_pct <= 0.05: severity = GREEN
        elif variance_pct <= 0.10: severity = YELLOW
        else: severity = RED
    constants:
      GREEN_THRESHOLD: 0.05
      YELLOW_THRESHOLD: 0.10
    precision: "4 decimal places, round_half_up"

  - name: rebate_accrual
    trigger: "PO settlement"
    algorithm: aggregation
    formula: |
      if Store.rebate_eligibility_status == INELIGIBLE:
        accrual = 0
      elif Store.rebate_eligibility_status == CONDITIONAL:
        accrual = floor(total_cents * 0.02 * exclusive_purchase_pct)
      else:  # ELIGIBLE
        accrual = floor(total_cents * 0.05 * exclusive_purchase_pct)
      Create RebateLedger entry type=ACCRUAL, amount_cents=accrual
    constants:
      ELIGIBLE_RATE: 0.05
      CONDITIONAL_RATE: 0.02
    precision: "integer cents, floor"
    variants:
      - name: standard
        when: "No promotion active"
        difference: "Base rate as above"
      - name: promotion_boost
        when: "PO has promotion_id and promotion is EXECUTING"
        difference: "Rate multiplied by 1.5x for promotional items only"

  - name: rebate_pool_calculation
    trigger: "RebatePool CALCULATING transition"
    algorithm: aggregation
    formula: |
      pool_total_cents = sum(total_cents for all SETTLED POs in quarter) * 0.10
      For each store with rebate_eligibility_status != INELIGIBLE:
        store_share = store's accrual sum / total accrual sum
        store_rebate = floor(pool_total_cents * store_share)
      holdback_cents = sum of disputed or flagged amounts
      distributed_cents = pool_total_cents - holdback_cents
    constants:
      POOL_RATE: 0.10
    precision: "integer cents, floor"

  - name: route_load_utilization
    trigger: "route dispatch, PO assignment"
    algorithm: aggregation
    formula: |
      route_load = sum(quantity for all CONFIRMED/LOADED POs assigned to route)
      utilization_pct = route_load / truck_capacity_units
      if utilization_pct > 1.0: reject with ERR_ROUTE_OVERLOADED
    precision: "4 decimal places"

  - name: surge_capacity_allocation
    trigger: "promotion confirmation, capacity plan lock"
    algorithm: constraint_propagation
    formula: |
      For each affected week:
        surge_units = floor(baseline_units * (surge_multiplier - 1))
        total_capacity = baseline_units + surge_units
        if allocated_units > total_capacity:
          CapacityPlan.status = OVERBOOKED
          Center.posture = CONSTRAINED
    precision: "integer units, floor"

  - name: exclusive_purchase_percentage
    trigger: "weekly ops run, PO settlement"
    algorithm: aggregation
    formula: |
      For a given store and trailing 4-week window:
        center_purchases = sum(total_cents for SETTLED POs from this center)
        total_purchases = center_purchases + external_purchases_cents
        exclusive_purchase_pct = center_purchases / total_purchases
      external_purchases_cents is input via weekly compliance report
    precision: "4 decimal places, round_half_up"

  - name: compliance_tier_evaluation
    trigger: "exclusive_purchase_pct change, agreement status change"
    algorithm: threshold
    formula: |
      if any ACTIVE agreement has status == BREACHED:
        tier = NON_COMPLIANT
      elif exclusive_purchase_pct >= 0.95:
        tier = FULL_COMPLIANCE
      elif exclusive_purchase_pct >= 0.80:
        tier = PROBATION
      else:
        tier = NON_COMPLIANT
    constants:
      FULL_COMPLIANCE_THRESHOLD: 0.95
      PROBATION_THRESHOLD: 0.80

  - name: stale_order_expiry
    trigger: "run_ops"
    algorithm: checkpoint
    formula: |
      For each PurchaseOrder in DRAFT status:
        if created more than 2 ops runs ago: PO → CANCELLED
      For each PurchaseOrder in SUBMITTED status:
        if submitted more than 1 ops run ago: PO → REJECTED

  - name: settlement_timing
    trigger: "RebatePool SETTLING"
    algorithm: chronological
    formula: |
      SETTLEMENT entries are processed in order:
        1. Sort by store_id, then by settlement_date, then by created_at
        2. For each entry: if store has no active dispute, mark SETTLED
        3. Disputed entries remain POSTED until dispute resolved
      Holdback entries have settlement_date = pool close + 30 days
    constants:
      HOLDBACK_DAYS: 30

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Role must have permission for this operation"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist within scope"
    error_id: "ERR_CENTER_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_PROMOTION_NOT_FOUND | ERR_POOL_NOT_FOUND | ERR_LEDGER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_VARIANCE_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Center must be ACTIVE or SURGE_MODE for operational actions"
    error_id: ERR_CENTER_NOT_ACTIVE
    http_status: 409
    applies_to: "store activation, PO submission, route dispatch, promotion confirmation"

  - priority: 5
    category: state
    check: "Store must be ACTIVE for PO operations"
    error_id: ERR_STORE_NOT_ACTIVE
    http_status: 409
    applies_to: "PO submit, PO cancel"

  - priority: 6
    category: state
    check: "Target resource must be in correct state for transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 7
    category: business_safety
    check: "Product must be ACTIVE and not RECALLED"
    error_id: ERR_PRODUCT_UNAVAILABLE
    http_status: 409
    applies_to: "order line creation, price book creation"

  - priority: 8
    category: business_constraint
    check: "Capacity plan must have available units"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "PO confirmation"

  - priority: 9
    category: business_constraint
    check: "Route load must not exceed truck capacity"
    error_id: ERR_ROUTE_OVERLOADED
    http_status: 409
    applies_to: "route dispatch, PO confirmation"

  - priority: 10
    category: business_fiscal
    check: "Store credit limit must not be exceeded"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "PO submission"

  - priority: 11
    category: business_referential
    check: "Price book effective window must not overlap with existing ACTIVE book for same product+tier"
    error_id: ERR_PRICE_BOOK_OVERLAP
    http_status: 409
    applies_to: "price book creation"

  - priority: 12
    category: business_temporal
    check: "Promotion dates must not overlap with existing CONFIRMED or EXECUTING promotion for same products"
    error_id: ERR_PROMOTION_OVERLAP
    http_status: 409
    applies_to: "promotion confirmation"

  - priority: 13
    category: business_temporal
    check: "Price book effective_from must be before effective_until"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 400
    applies_to: "price book creation, promotion creation"

  - priority: 14
    category: business_constraint
    check: "Store must have ACTIVE compliance agreement for rebate accrual"
    error_id: ERR_COMPLIANCE_REQUIRED
    http_status: 409
    applies_to: "PO settlement with rebate"

  - priority: 15
    category: business_fiscal
    check: "Rebate pool must have sufficient balance for settlement"
    error_id: ERR_POOL_INSUFFICIENT
    http_status: 409
    applies_to: "rebate settlement"

endpoints:
  # --- SupplyCenter ---
  - method: POST
    path: "/supply-centers"
    description: "Create a new Supply Center"
    roles: [SupplyChainAdmin]
    code: 201
    input: [center_code, display_name, base_weekly_capacity_units, "surge_capacity_multiplier?"]
    output: SupplyCenter
    side_effects:
      - "status=DRAFT, posture=ACTIVE, ops_run_index=0"
      - "rebate_pool_balance_cents=0, rebate_pool_locked_cents=0"

  - method: GET
    path: "/supply-centers/{centerId}"
    description: "Get a Supply Center"
    roles: [Any, SupplyChainAdmin, StoreManager, RouteCoordinator]
    code: 200
    input: []
    output: SupplyCenter
    side_effects: []

  - method: POST
    path: "/supply-centers/{centerId}/activate"
    description: "Activate a Supply Center"
    roles: [SupplyChainAdmin]
    code: 200
    input: []
    output: SupplyCenter
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/supply-centers/{centerId}/suspend"
    description: "Suspend a Supply Center"
    roles: [SupplyChainAdmin]
    code: 200
    input: [reason]
    output: SupplyCenter
    side_effects: ["status → SUSPENDED, cascade to routes and POs"]

  - method: POST
    path: "/supply-centers/{centerId}/decommission"
    description: "Decommission a Supply Center"
    roles: [SupplyChainAdmin]
    code: 200
    input: []
    output: SupplyCenter
    side_effects: ["status → DECOMMISSIONED"]

  - method: POST
    path: "/supply-centers/{centerId}/run_ops"
    description: "Run operations checkpoint"
    roles: [SupplyChainAdmin]
    code: 200
    input: []
    output: SupplyCenter
    side_effects:
      - "ops_run_index += 1"
      - "Stale POs expired"
      - "Compliance evaluations run"
      - "CapacityPlans reconciled"
      - "Rebate settlements processed"

  # --- Store ---
  - method: POST
    path: "/supply-centers/{centerId}/stores"
    description: "Create a Store"
    roles: [SupplyChainAdmin]
    code: 201
    input: [store_number, operator_name, credit_limit_cents]
    output: Store
    side_effects: ["status=ONBOARDING, compliance_tier=FULL_COMPLIANCE, rebate_eligibility_status=ELIGIBLE"]

  - method: GET
    path: "/supply-centers/{centerId}/stores/{storeId}"
    description: "Get a Store"
    roles: [Any, SupplyChainAdmin, StoreManager, RouteCoordinator]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: GET
    path: "/supply-centers/{centerId}/stores"
    description: "List Stores"
    roles: [Any, SupplyChainAdmin, StoreManager, RouteCoordinator]
    code: 200
    input: ["status?", "compliance_tier?", "limit?", "offset?"]
    output: "Store[]"
    side_effects: []

  - method: POST
    path: "/supply-centers/{centerId}/stores/{storeId}/activate"
    description: "Activate a Store"
    roles: [SupplyChainAdmin]
    code: 200
    input: []
    output: Store
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/supply-centers/{centerId}/stores/{storeId}/suspend"
    description: "Suspend a Store"
    roles: [SupplyChainAdmin]
    code: 200
    input: [reason]
    output: Store
    side_effects: ["status → SUSPENDED"]

  - method: POST
    path: "/supply-centers/{centerId}/stores/{storeId}/terminate"
    description: "Terminate a Store"
    roles: [SupplyChainAdmin]
    code: 200
    input: []
    output: Store
    side_effects: ["status → TERMINATED"]

  # --- Product ---
  - method: POST
    path: "/supply-centers/{centerId}/products"
    description: "Create a Product"
    roles: [SupplyChainAdmin]
    code: 201
    input: [sku, name, category, base_cost_cents_per_unit, "shelf_life_days?", "is_promotion_eligible?"]
    output: Product
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/supply-centers/{centerId}/products/{productId}"
    description: "Get a Product"
    roles: [Any, SupplyChainAdmin, StoreManager, RouteCoordinator]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/supply-centers/{centerId}/products"
    description: "List Products"
    roles: [Any, SupplyChainAdmin, StoreManager, RouteCoordinator]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: POST
    path: "/supply-centers/{centerId}/products/{productId}/discontinue"
    description: "Discontinue a Product"
    roles: [SupplyChainAdmin]
    code: 200
    input: []
    output: Product
    side_effects: ["status → DISCONTINUED"]

  - method: POST
    path: "/supply-centers/{centerId}/products/{productId}/recall"
    description: "Recall a Product"
    roles: [SupplyChainAdmin]
    code: 200
    input: [reason]
    output: Product
    side_effects: ["status → RECALLED"]

  # --- PriceBook ---
  - method: POST
    path: "/supply-centers/{centerId}/price-books"
    description: "Create a Price Book entry"
    roles: [SupplyChainAdmin]
    code: 201
    input: [product_id, store_tier, markup_pct, min_quantity, effective_from, effective_until, expected_center_version]
    output: PriceBook
    side_effects:
      - "status=ACTIVE"
      - "increments SupplyCenter.version by 1"

  - method: GET
    path: "/supply-centers/{centerId}/price-books/{priceBookId}"
    description: "Get a Price Book"
    roles: [Any, SupplyChainAdmin, StoreManager, RouteCoordinator]
    code: 200
    input: []
    output: PriceBook
    side_effects: []

  - method: GET
    path: "/supply-centers/{centerId}/price-books"
    description: "List Price Books"
    roles: [Any, SupplyChainAdmin, StoreManager, RouteCoordinator]
    code: 200
    input: ["product_id?", "store_tier?", "status?", "limit?", "offset?"]
    output: "PriceBook[]"
    side_effects: []

  # --- DeliveryRoute ---
  - method: POST
    path: "/supply-centers/{centerId}/routes"
    description: "Create a Delivery Route"
    roles: [RouteCoordinator]
    code: 201
    input: [route_code, day_of_week, truck_capacity_units, assigned_store_ids]
    output: DeliveryRoute
    side_effects: ["status=PLANNED"]

