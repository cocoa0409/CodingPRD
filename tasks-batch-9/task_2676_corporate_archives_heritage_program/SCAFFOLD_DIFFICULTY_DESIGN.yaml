              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "OH-TAPE-1", unit_count: 2, condition_grade: "GOOD", original_format: "MAGNETIC_TAPE", sensitivity_level: "INTERNAL" }
              as: Archivist
              captures: { item_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "Interview recordings deposited by the heritage office", transfer_instrument_reference: "DOG-2026-014" }
              as: Archivist
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
            - call: "POST /oral-history-interviews"
              payload: { accession_id: "${acc_id}", narrator_name: "Helen Ward", interview_date: "2026-06-12T14:00:00Z" }
              as: Archivist
              captures: { oh_id: $.data.id }
          trigger:
            - call: "POST /oral-history-interviews/${oh_id}/transcription"
              payload: { transcription_action: "START_DRAFT" }
              as: Archivist
            - call: "POST /oral-history-interviews/${oh_id}/transcription"
              payload: { transcription_action: "MARK_REVIEWED" }
              as: Archivist
              captures: { mid_release: $.data.release_state }
            - call: "POST /oral-history-interviews/${oh_id}/consent"
              payload: { consent_action: "SIGN" }
              as: Archivist
              captures: { after_sign: $.data.release_state }
            - call: "POST /oral-history-interviews/${oh_id}/transcription"
              payload: { transcription_action: "APPROVE" }
              as: Archivist
              captures: { final_release: $.data.release_state }
          assert:
            - "after the two transcription calls and BEFORE consent: OralHistoryInterview.${oh_id}.transcription_status == REVIEWED and consent_status == PENDING and release_state == WITHHELD"
            - "after SIGN: OralHistoryInterview.${oh_id}.consent_status == SIGNED and transcription_status == REVIEWED and release_state == RESEARCH_ROOM_ONLY"
            - "after APPROVE: OralHistoryInterview.${oh_id}.transcription_status == APPROVED and release_state == PUBLIC"
            - "OralHistoryInterview.${oh_id}.withdrawal_count == 0"

      - name: deaccession_fork_join_two_clearances_then_execute
        grounds:
          - state_machines.DeaccessionProposal.SUBMITTED_to_HERITAGE_CLEARED
          - state_machines.DeaccessionProposal.HERITAGE_CLEARED_to_DUALLY_CLEARED
          - state_machines.DeaccessionProposal.DUALLY_CLEARED_to_APPROVED
          - state_machines.DeaccessionProposal.APPROVED_to_EXECUTED
          - calculations.unit_custody_conservation
        distinguishing_aspect: |
          A fork-join: two clearances granted by two different roles in either order
          converge on the single DUALLY_CLEARED join state, and only from the join can
          approval proceed. This run takes the heritage-first branch, so the machine
          passes through HERITAGE_CLEARED rather than LEGAL_CLEARED, proving order
          independence. Neither partner instance has a join state: the AccessRequest
          machine loops back onto itself and the OralHistoryInterview machine keeps two
          axes permanently separate.
        test_recipe:
          setup:
            - "A processed Accession holding one ACCESSIONED ArchivalItem with unit_count 4 (units_on_shelf 4, units_on_loan 0, units_deaccessioned 0)."
