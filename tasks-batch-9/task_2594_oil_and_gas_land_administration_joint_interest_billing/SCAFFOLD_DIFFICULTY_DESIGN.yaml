    instances:
      - name: lease_expiry_cascades_four_hops_into_suspended_disbursements
        grounds:
          - state_machines.Lease.PRIMARY_TERM_to_EXPIRED
          - state_machines.Well.POOLED_EFFECTIVE_to_POOLED_TERMINATED
          - state_machines.ProductionRevenue.RELEASED_to_SUSPENDED
          - state_machines.OwnerDisbursement.ACCRUED_to_SUSPENDED
          - calculations.unit_allocation_factor
          - endpoints.POST_/land-admin/obligation-runs
        depth: 4
        chain: "Lease.tenure_status -> WellLeaseAllocation.allocation_status -> Well.pooling_status -> ProductionRevenue.distribution_status -> OwnerDisbursement.disbursement_status"
        distinguishing_aspect: |
          Trigger is the system obligation run crossing a primary-term expiry date. Hop 1 withdraws
          L-001's committed allocation BECAUSE the lease expired. Hop 2 terminates the unit BECAUSE
          the withdrawal left only one committed allocation (and re-normalizes the surviving
          allocation_factor to 1.000000) - it is caused by hop 1's withdrawal, not by the lease row.
          Hop 3 suspends the already RELEASED June revenue BECAUSE the unit it was distributed from no
          longer exists. Hop 4 suspends the six ACCRUED owner disbursements BECAUSE their parent
          revenue was suspended, and recomputes each owner's suspense balance. Cut any link and the
          following one cannot fire.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Leases L-001 (640.00 gross acres, royalty 0.187500, primary term ending 2026-09-30) and L-002 (320.00 gross acres, royalty 0.250000, primary term ending 2027-12-31)"
