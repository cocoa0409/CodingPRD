            RATIO_SHARED debit was re-priced in place when the tier floor moved, so no COVERAGE_BREACH was
            manufactured; GET /shift-assignments/${shift_bedside} shows assigned_acuity_load_units == 2.0
            against capacity_units_effective 4.0 and GET /obstetric-units/${unit_id} shows
            coverage_deficit_units == 0.0 with staffing_posture == "INDUCTION_FROZEN" (readiness NOT_READY,
            no drill was ever run).
      - name: four_cesarean_event_ids_from_a_duplicate_declaration_through_a_zero_length_incision_to_a_locked_abort
        claim_type: Error Triggerability
        grounds: |
          §1.6 ERR_CESAREAN_EVENT_IN_PROGRESS (409), ERR_FETAL_CATEGORY_BLOCKS_ABORT (422),
          ERR_CESAREAN_TIMESTAMP_OUT_OF_RANGE (400) and ERR_CESAREAN_ALREADY_INCISED (409); §1.5
          POST /emergency-cesareans ("At most one event per encounter may be non-terminal"),
          /mobilize-team, /record-incision (input_types incision_at "must satisfy
          decision_at < incision_at <= clock_now") and /abort-to-vaginal ("Requires incision_at to be null
          and the latest FetalMonitoringAssessment on the encounter to be CATEGORY_I or CATEGORY_II");
          §1.4 carve-out (g) of the priority-8 note; §1.3 decision_to_incision_measurement
          (D2I_TARGET_MINUTES CATEGORY_1_CRASH 15, floor, inclusive) and cesarean_readiness_derivation
          (current_drill null => NOT_READY regardless of how good the mean is).
        distinguishing_aspect: |
          The abort door is probed twice on the same event and closes for two DIFFERENT reasons: first a
          422 because the latest fetal reading is CATEGORY_III (a clinical gate that would reopen if a
          CATEGORY_I reading arrived), then a 409 because incision_at is now stamped (an irreversible
          structural gate). Between them, incision_at == decision_at is rejected 400 - the window is
          strict on the left and inclusive on the right, so a zero-length decision-to-incision interval is
          not a 0-minute triumph. The duplicate declaration is a 409 rather than a second row, and the
          post-incision readiness recompute proves the drill clause dominates: mean_d2i 5.0 minutes,
          far under both ceilings, still leaves the unit NOT_READY because no drill was ever validated.
        test_recipe:
          setup: |
            Clock 2026-08-01T06:00:00Z. One unit with two LDR beds and two OR rooms. Four staff each on an
            ACTIVE shift so mobilize-team's 11.1 and 8.08 checks pass: rn_charge (RN, ADVANCED cert) on a
            CHARGE shift - the assessment interpreter, on the case via priority 12; anes
            (ANESTHESIOLOGIST, or_circulating_qualified true) and tech (SURGICAL_TECH,
            or_circulating_qualified true) on TRIAGE shifts - deliberately NOT OR_STANDBY, because this unit
            has no validated drill and priority 11.2 refuses to activate an OR_STANDBY slot whose holder is
            not drill-current, while mobilize-team only demands an ACTIVE shift of any slot; neo
            (NEONATAL_RESUSCITATOR) on a TRIAGE shift. One ANTEPARTUM encounter holding LDR-01 (so the bed is OCCUPIED and 13.3 is satisfied),
            with no CareAssignment and no drill anywhere on the unit.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Marrowstone Island Birthing Unit LDR", licensed_ldr_beds: 4, licensed_or_rooms: 2 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-02", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "OR-01", bed_type: "OR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_or1: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "OR-02", bed_type: "OR" }
              as: PerinatalSafetyOfficer
