            - "Sailing.${sail_w}.gross_ticket_revenue_cents == 300000"
            - "Sailing.${sail_w}.projected_onboard_revenue_cents == 72000"
            - "Sailing.${sail_w}.available_lower_berth_days_gross == 80 and available_lower_berth_days_net == 72"
            - "Sailing.${sail_w}.ralbd_gross_cents == 4650 and ralbd_net_cents == 5167"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: sod_auth_beats_group_block_state_precondition
        grounds:
          - validations[priority=8].ERR_SEGREGATION_OF_DUTIES
          - validations[priority=10].ERR_GROUP_BLOCK_NOT_TENTATIVE
          - roles.GroupSalesAgent.four_eyes_rule
        distinguishing_aspect: |
          The same call violates the priority 8 four-eyes rule (403) and the priority 10 state
          precondition (409): the block is already DEFINITE, so it is no longer TENTATIVE, and
          the caller is also the operator who created it. The auth-class rule must answer first,
          so the response is 403 ERR_SEGREGATION_OF_DUTIES and the state error is never reached -
          a caller must not learn the block's state from a call they were never allowed to make.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing SOD-2701 OPEN_FOR_SALE with an IA allotment of 4 cabins and a 730..0 fare window."
            - "Operator gsa-001 creates a TENTATIVE group block holding 2 cabins."
            - "Operator gsa-002 signs the block DEFINITE with contract_reference CT-9001, so status == DEFINITE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "SOD-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 20, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_s: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_s}", cabin_category_id: "${cat_ia}", physical_cabins: 4, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_s: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_s}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 150000, third_berth_fare_cents: 50000, fourth_berth_fare_cents: 40000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_s}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_s}", cabin_category_id: "${cat_ia}", agency_name: "Meridian Travel", cabins_held: 2, review_date: "2026-09-01T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_s: $.data.id }
            - call: "POST /group-blocks/${blk_s}/confirm-definite"
              payload: { contract_reference: "CT-9001" }
              as: GroupSalesAgent
              as_user_id: "gsa-002"
          trigger:
            - call: "POST /group-blocks/${blk_s}/confirm-definite"
              payload: { contract_reference: "CT-9002" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
          assert:
            - "the trigger returns HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "the response is NOT 409 and NOT ERR_GROUP_BLOCK_NOT_TENTATIVE"
            - "GroupBlock.${blk_s}.status == DEFINITE"
            - "GroupBlock.${blk_s}.created_by_user_id == gsa-001 and confirmed_by_user_id == gsa-002"
            - "GroupBlock.${blk_s}.contract_reference == CT-9001 (the second contract reference is not written)"
            - "SailingInventory.${inv_s}.group_held_cabins == 2 and available_cabins == 2"

      - name: berth_safety_beats_exhausted_promotion_fiscal_check
        grounds:
          - validations[priority=12].ERR_MAX_OCCUPANCY_EXCEEDED
          - validations[priority=20].ERR_PROMOTION_NOT_ACTIVE
          - state_machines.Promotion.ACTIVE_to_EXHAUSTED
        distinguishing_aspect: |
          Both violated rules return 422, so the HTTP status cannot disambiguate them - only the
          error_id proves the ordering. The party of 4 does not fit the 3-berth category
          (priority 12, business_safety) and the quoted promotion has already burned its single
          redemption and left ACTIVE (priority 20, business_fiscal). Safety is checked eight
          priorities earlier than money, so ERR_MAX_OCCUPANCY_EXCEEDED wins. This pair is
          within-status, unlike the 403-over-409 pair above.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing PRM-2701 OPEN_FOR_SALE; named category OVS with max_occupancy 3 and lower_berths 2, allotment of 10 cabins, oversell_allowance 0."
            - "A GENERAL promotion with max_redemptions 1 is ACTIVE over 2026-08-01..2026-08-31."
            - "One booking has already quoted that promotion, so redemption_count == 1 and the Promotion has transitioned ACTIVE -> EXHAUSTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "OVS", tier_rank: 2, max_occupancy: 3, lower_berths: 2, onboard_spend_lower_per_night_cents: 11000, onboard_spend_upper_per_night_cents: 7000 }
              as: RevenueManager
              captures: { cat_ovs: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "BOREAL", voyage_code: "PRM-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 20, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_r: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_r}", cabin_category_id: "${cat_ovs}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_r: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_r}", cabin_category_id: "${cat_ovs}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 150000, third_berth_fare_cents: 50000, fourth_berth_fare_cents: 40000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_r}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { sail_r_v: $.data.version }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_r}", code: "FLASH1", audience: "GENERAL", discount_pct: 0.10, starts_on: "2026-08-01T00:00:00Z", ends_on: "2026-08-31T00:00:00Z", max_redemptions: 1, expected_sailing_version: "${sail_r_v}" }
              as: RevenueManager
              captures: { promo_r: $.data.id }
            - call: "POST /promotions/${promo_r}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_a: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_b: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_r}", cabin_category_id: "${cat_ovs}", guest_id: "${g_a}", occupancy_adults: 2, promotion_id: "${promo_r}" }
              as: ReservationAgent
              captures: { bk_r1: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_r}", cabin_category_id: "${cat_ovs}", guest_id: "${g_b}", occupancy_adults: 2, third_berth_guests: 1, fourth_berth_guests: 1, promotion_id: "${promo_r}" }
              as: ReservationAgent
          assert:
            - "the trigger returns 422 with data.error_id == ERR_MAX_OCCUPANCY_EXCEEDED"
            - "the response is NOT ERR_PROMOTION_NOT_ACTIVE and NOT ERR_PROMO_EXHAUSTED"
            - "Promotion.${promo_r}.status == EXHAUSTED and redemption_count == 1 (the refused booking does not burn a redemption)"
            - "SailingInventory.${inv_r}.booked_cabins == 1 and available_cabins == 9"
            - "GET /bookings?guest_id=${g_b} returns total_count == 0"

      - name: missing_fare_window_temporal_beats_promo_audience_referential
        grounds:
          - validations[priority=15].ERR_NO_FARE_RULE_FOR_WINDOW
          - validations[priority=17].ERR_PROMO_AUDIENCE_MISMATCH
          - calculations.guest_loyalty_tier
        distinguishing_aspect: |
          A business_temporal rule at priority 15 and a business_referential rule at priority 17
          are both violated by one POST /bookings: the clock sits at days_to_sail 100, inside the
          gap left by the single 365..120 fare window, and the quoted promotion is REPEAT_GUEST
          while the guest's loyalty_tier is NONE. The nearer pair (15 vs 17) makes the ordering
          harder to get right than a wide gap, and both errors are 422.
        test_recipe:
          setup:
            - "Sailing FWG-2701 OPEN_FOR_SALE with an IA allotment of 10 cabins and exactly ONE fare window, 365..120."
            - "A REPEAT_GUEST promotion over 2026-09-20..2026-10-31 is created while the clock is at 2026-08-01T00:00:00Z and activated after the clock moves to 2026-10-02T00:00:00Z, which is days_to_sail 100 - outside every fare window."
            - "Guest has prior_sailings_count 0, so calc guest_loyalty_tier gives loyalty_tier NONE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "FWG-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 20, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_f: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_f}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 2 }
              as: RevenueManager
              captures: { inv_f: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_f}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail_f}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { sail_f_v: $.data.version }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_f}", code: "LOYAL10", audience: "REPEAT_GUEST", discount_pct: 0.10, starts_on: "2026-09-20T00:00:00Z", ends_on: "2026-10-31T00:00:00Z", max_redemptions: 50, expected_sailing_version: "${sail_f_v}" }
              as: RevenueManager
              captures: { promo_f: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: RevenueManager
            - call: "POST /promotions/${promo_f}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_none: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_f}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 2, promotion_id: "${promo_f}" }
              as: ReservationAgent
          assert:
            - "the trigger returns 422 with data.error_id == ERR_NO_FARE_RULE_FOR_WINDOW"
            - "the response is NOT ERR_PROMO_AUDIENCE_MISMATCH"
            - "Guest.${g_none}.loyalty_tier == NONE and bookings_count == 0"
            - "Promotion.${promo_f}.status == ACTIVE and redemption_count == 0"
            - "SailingInventory.${inv_f}.booked_cabins == 0 and waitlisted_bookings_count == 0"

      - name: stale_inventory_version_beats_oversell_safety_check
        grounds:
          - validations[priority=9].ERR_STALE_INVENTORY_VERSION
          - validations[priority=14].ERR_OVERSELL_NOT_PERMITTED
          - concurrency_rules.oversell-adjust-stale-inventory
        distinguishing_aspect: |
          A state-class rule at priority 9 masks a business_safety rule at priority 14, and the
          two disagree on HTTP status as well as error_id: the PATCH carries a superseded
          expected_inventory_version AND asks for oversell on a named (non-guarantee) category.
          The declared concurrency rule answers first, so the caller gets 412 and must re-read
          before they can ever be told the allowance itself is illegal - the opposite direction
          from a scaffold that validated the payload before the version.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing OCC-2701 in PLANNED with a named category OV (is_guarantee false)."
            - "The OV allotment is created with 10 physical cabins and oversell_allowance 0; its version at creation is captured as ${inv_v0}."
            - "A legal PATCH re-setting oversell_allowance to 0 with the current version succeeds, so ${inv_v0} is now superseded and the stored version is ${inv_v1}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "OV", tier_rank: 2, max_occupancy: 4, onboard_spend_lower_per_night_cents: 11000, onboard_spend_upper_per_night_cents: 7000 }
              as: RevenueManager
              captures: { cat_ov: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "BOREAL", voyage_code: "OCC-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 20, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_o: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_o}", cabin_category_id: "${cat_ov}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_o: $.data.id, inv_v0: $.data.version }
            - call: "PATCH /sailing-inventories/${inv_o}"
              payload: { oversell_allowance: 0, expected_inventory_version: "${inv_v0}" }
              as: RevenueManager
              captures: { inv_v1: $.data.version }
          trigger:
            - call: "PATCH /sailing-inventories/${inv_o}"
              payload: { oversell_allowance: 3, expected_inventory_version: "${inv_v0}" }
              as: RevenueManager
          assert:
            - "the trigger returns HTTP 412 with data.error_id == ERR_STALE_INVENTORY_VERSION"
            - "the response is NOT 422 and NOT ERR_OVERSELL_NOT_PERMITTED"
            - "SailingInventory.${inv_o}.oversell_allowance == 0"
            - "SailingInventory.${inv_o}.effective_oversell_cabins == 0"
            - "SailingInventory.${inv_o}.available_cabins == 10"
            - "SailingInventory.${inv_o}.version == ${inv_v1} (the refused PATCH does not bump the version)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: ralbd_net_exactly_at_alert_floor_is_not_flagged
        grounds:
          - calculations.sailing_ralbd
          - calculations.sailing_ralbd.constants.RALBD_ALERT_FLOOR_CENTS
          - entities.Sailing.fields.revenue_alert
        distinguishing_aspect: |
          Three sailings differing only in base fare pin the alert boundary from both sides and
          through the rounding step: 20000 exactly (>= floor, no alert), 19999.5 which
          round_half_up lifts to 20000 (no alert, so the comparison must happen AFTER rounding),
          and 19900 (alert). An implementation using strict > , or comparing before rounding,
          fails exactly one of the three.
