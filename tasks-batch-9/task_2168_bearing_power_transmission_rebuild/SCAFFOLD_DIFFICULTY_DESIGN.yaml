            - "the response error_id != ERR_VIBRATION_LINK_REQUIRED"
            - "Inspection.${insp_id}.status == DRAFT"
            - "Inspection.${insp_id}.remaining_life_score == null and remaining_life_grade == null"
            - "Inspection.${insp_id}.submitted_by_user_id == null"
