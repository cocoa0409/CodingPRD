              as: CollectiveDirector
              captures: { donor_id: $.data.id }
          trigger:
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 100000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { settled_id: $.data.id, settled_status: $.data.status, settled_net: $.data.net_amount_cents }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 200000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "DEFER" }
              as: TreasuryOfficer
              captures: { pending_id: $.data.id, pending_status: $.data.status, pending_fee: $.data.processing_fee_cents, pending_net: $.data.net_amount_cents }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 300000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "DECLINE" }
              as: TreasuryOfficer
              captures: { failed_id: $.data.id, failed_status: $.data.status, failed_fee: $.data.processing_fee_cents, failed_net: $.data.net_amount_cents }
          assert:
            - "${settled_status} == SETTLED"
            - "${settled_net} == 97470"
            - "${pending_status} == PENDING"
            - "${pending_fee} == 0"
            - "${pending_net} == 0"
            - "${failed_status} == FAILED"
            - "${failed_fee} == 0"
            - "${failed_net} == 0"
            - "Collective.${col_id}.settled_net_funds_cents == 97470"
            - "DonorMember.${donor_id}.lifetime_settled_cents == 97470"
            - "Collective.${col_id}.funding_posture == OPEN"

