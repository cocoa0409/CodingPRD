          - state_machines.ShowBooking.ANNOUNCED_to_CANCELLED
          - state_machines.ShowBooking.REFUNDING_to_REFUNDED
          - calculations.refund_liability
          - entities.FairEdition.fields.refund_liability_committed_cents
