  - rule_id: boundary_precision_check
    instances:

      - name: income_and_asset_tests_at_exact_limits_versus_one_cent_over
        grounds:
          - calculations.income_relief_tier
          - calculations.exemption_benefit_amount
          - validations[priority=30]
          - validations[priority=31]
          - errors[ERR_INCOME_LIMIT_EXCEEDED]
          - entities.IncomeCertification.fields.relief_tier
        distinguishing_aspect: |
          Three exact-edge comparisons in ONE determination: household_income_cents == income_limit_cents
          (6000000) must land on TIER_PARTIAL and not be rejected, the same value must NOT reach
          TIER_HIGH (6000000*4 == 24000000 > 3*6000000 == 18000000), and countable_asset_cents ==
          asset_limit_cents (4000000) must pass the separate asset gate. The paired off-by-one case
          (6000001) is rejected, proving the boundary is inclusive on the upper edge only.
        test_recipe:
          setup:
            - "DISABILITY_INCOME program: relief_pct_bps 3000, max_exempt_value_cents 12000000, income_limit_cents 6000000, asset_limit_cents 4000000, requires_income_certification true."
