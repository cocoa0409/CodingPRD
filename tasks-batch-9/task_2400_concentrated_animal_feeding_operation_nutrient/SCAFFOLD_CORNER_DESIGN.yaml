              as_user_id: "${op_id}"
              captures: { vol_after_first: $.data.current_volume_gallons }
            - call: "POST /cafo/manure-storages/${st_id}/intake"
              payload: { gallons: 500000 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { days_after_second: $.data.days_of_storage_available }
          assert:
            - "the captured vol_after_first == 1000000.00 and at that point available_capacity_gallons == 3488300.00 with days_of_storage_available == 377"
            - "the captured days_after_second == 323"
            - "ManureStorage.${st_id}.cumulative_intake_gallons == 1500000.00, current_volume_gallons == 1500000.00 and available_capacity_gallons == 2988300.00"
            - "ManureStorage.${st_id}.design_capacity_gallons == 5385960.00 and operating_capacity_gallons == 4488300.00 are untouched by intake"
            - "Operation.${op_id}.design_storage_days is STILL 485, because DESIGN_BASIS ignores current contents"
      - name: approving_successor_plan_supersedes_predecessor_and_locks_its_budgets
