  # =======================================================================
  - section: errors
    instances:

      - name: corner_every_path_id_not_found_error_is_triggerable
        claim_type: error_triggerable
        grounds: ["errors[ERR_ZONE_NOT_FOUND]", "errors[ERR_PERFORMER_NOT_FOUND]", "errors[ERR_APPLICATION_NOT_FOUND]", "errors[ERR_AUDITION_NOT_FOUND]", "errors[ERR_PERMIT_NOT_FOUND]", "errors[ERR_INVOICE_NOT_FOUND]", "errors[ERR_DRAW_NOT_FOUND]", "errors[ERR_ENTRY_NOT_FOUND]", "errors[ERR_BOOKING_NOT_FOUND]", "errors[ERR_COMPLAINT_NOT_FOUND]", "errors[ERR_CLOSURE_NOT_FOUND]", "validations[priority=30]"]
        distinguishing_aspect: "Each collection resolves its own path id against its own table, so an unknown id on each of the eleven single-resource paths returns 404 with that collection's dedicated error_id rather than a shared generic one."
        test_recipe:
          setup:
            - "Empty database, so every id below resolves to nothing."
          setup_api_calls: []
          trigger:
            - call: "GET /busking/zones/00000000-0000-4000-8000-000000000000"
              as: PermitOfficer
            - call: "GET /busking/performers/00000000-0000-4000-8000-000000000000"
              as: PermitOfficer
            - call: "GET /busking/permit-applications/00000000-0000-4000-8000-000000000000"
              as: PermitOfficer
            - call: "GET /busking/auditions/00000000-0000-4000-8000-000000000000"
              as: PermitOfficer
            - call: "GET /busking/permits/00000000-0000-4000-8000-000000000000"
              as: PermitOfficer
            - call: "POST /busking/fee-invoices/00000000-0000-4000-8000-000000000000/payments"
              payload: { amount_cents: 100 }
              as: PermitOfficer
            - call: "GET /busking/lottery-draws/00000000-0000-4000-8000-000000000000"
              as: PermitOfficer
            - call: "GET /busking/lottery-entries/00000000-0000-4000-8000-000000000000"
              as: PermitOfficer
            - call: "GET /busking/session-bookings/00000000-0000-4000-8000-000000000000"
              as: PermitOfficer
            - call: "GET /busking/complaints/00000000-0000-4000-8000-000000000000"
              as: PermitOfficer
            - call: "GET /busking/closure-orders/00000000-0000-4000-8000-000000000000"
              as: PermitOfficer
          assert:
            - 'Every call returns HTTP 404'
            - 'The eleven data.error_id values are, in call order, ERR_ZONE_NOT_FOUND, ERR_PERFORMER_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_AUDITION_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_DRAW_NOT_FOUND, ERR_ENTRY_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND and ERR_CLOSURE_NOT_FOUND'
