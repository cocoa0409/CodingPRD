  - rule_id: priority_pair_validation_conflict
    instances:
      - name: close_state_priority_9_beats_contractor_payable_priority_14
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - errors[ERR_APPLICATION_STATE_INVALID]
          - errors[ERR_CONTRACTOR_NOT_PAYABLE]
          - state_machines.LoanApplication.APPROVED_to_CLOSED
          - calculations.contractor_payment_control
        distinguishing_aspect: |
          One close request violates BOTH the state rule at priority 9 (the application is
          still SIZED, not APPROVED) and the contractor-safety rule at priority 14 (a line's
          contractor's licence expired on 2026-08-05 against a 2026-08-10 clock); the
          response must be ERR_APPLICATION_STATE_INVALID, and after the committee approval
          removes only the priority-9 breach the identical call returns
