            - "1Z-E-3003 is delivered at 2026-08-01T12:00:00Z (on time); the clock then moves to 2026-08-02T03:00:00Z and the other two are delivered three hours late."
            - "All three are swept onto INV1 (three lines of 2660, no tier discount) and the invoice is ISSUED."
          setup_api_calls:
            - call: "POST /shipper-accounts"
              payload: { account_number: "SH-2001", name: "Acme Parcel" }
              as: CarrierAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
