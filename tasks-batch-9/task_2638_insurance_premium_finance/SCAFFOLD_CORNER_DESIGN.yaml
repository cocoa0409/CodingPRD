            - "the notice records its issuer: ${sd_notice_by} == 'analyst-notice', ${sd_notice_eff} == '2026-10-22' == 2026-10-12 + 10 notice days, and ${sd_notice_due} == 94438 == 89941 unpaid installment 1 + 4497 late fee"
