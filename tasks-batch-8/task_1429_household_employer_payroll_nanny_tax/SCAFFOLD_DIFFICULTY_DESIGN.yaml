            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Vera Valet", ssn: "123456789", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
