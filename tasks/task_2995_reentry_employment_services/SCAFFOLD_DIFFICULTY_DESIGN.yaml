      - COHORT variant participants_served ${co_served} == 2
      - COHORT variant benchmark_met ${co_bench} == false
      - EXIT_BASED variant denominator_placements ${ex_den} == 1
      - EXIT_BASED variant retention_rate_pct ${ex_ret} == 100.0
      - EXIT_BASED variant recidivism_rate_pct ${ex_rec} == 0.0
      - EXIT_BASED variant participants_served ${ex_served} == 1
      - EXIT_BASED variant benchmark_met ${ex_bench} == true
      - ${co_ret} != ${ex_ret} — the same retention numerator over two different denominators
      - Participant.${p1_id}.stage == EXITED and Participant.${p2_id}.stage == PLACED
- rule_id: combinatorial_formula
  instances:
  - name: job_match_score_double_cap_saturation_at_100
    grounds:
    - calculations.job_match_score
    - calculations.participant_barrier_score
    - entities.Placement.fields.match_breakdown
    - entities.JobOpening.fields.transit_accessible
    - entities.SessionEnrollment.fields.disclosure_script_reviewed
    distinguishing_aspect: 'Mode (a): six independently rounded inputs feed a non-linearly nested formula with TWO
