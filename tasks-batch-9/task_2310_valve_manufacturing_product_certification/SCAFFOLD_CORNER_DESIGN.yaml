              as: QualityManager
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-C2001", material_grade: "CF8M", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-C2001", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${m_id}", component_type: "BODY", net_weight_kg: 120.500 }
              as: ProcurementSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /valve-mfg/monogram-licenses"
              payload: { license_code: "MON-C20", facility_code: "FAC-1", scope_valve_types: ["BALL"], lead_auditor_user_id: "aud-c20", audit_window_start: "2026-07-01T00:00:00Z", audit_window_end: "2026-07-31T00:00:00Z" }
              as: QualityManager
              captures: { lic_id: $.data.id }
            - call: "POST /valve-mfg/valve-units"
              payload: { model_id: "${m_id}", body_component_id: "${c_id}", monogram_license_id: "${lic_id}", serial_number: "SN-C20-1" }
              as: ProductEngineer
              captures: { u_id: $.data.id }
            - call: "POST /valve-mfg/valve-units/${u_id}/build-actions"
              payload: { action: "ADVANCE", to_build_status: "MACHINED" }
              as: TestTechnician
