              as: ProgramAdmin
              captures: { now: $.data.current_utc }
          assert:
            - "${err} == ERR_CLOCK_REGRESSION with HTTP 422 (equal instant is not an advance)"
            - "${now} == 2027-01-02T00:00:00Z (the rejected set did not move the clock; a strictly later set succeeds)"

