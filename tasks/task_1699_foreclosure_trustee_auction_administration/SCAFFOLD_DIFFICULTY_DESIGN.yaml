            - { call: "POST /api/notices-of-trustee-sale/${nots_a}/publications", payload: { run_date: "2026-11-16", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pa3: $.data.id } }
            - { call: "POST /api/notices-of-trustee-sale/${nots_b}/publications", payload: { run_date: "2026-11-16", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { pb3: $.data.id } }
