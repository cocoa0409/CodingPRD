              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D2", email: "d2@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D3", email: "d3@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", origin: "WRITTEN_CONSENT", resolution_type: "ORDINARY", title: "R", text: "t" }
              as: CorporateSecretary
              captures: { r: $.data.id }
            - call: "POST /resolutions/${r}/circulate_consent"
              as: CorporateSecretary
            - call: "POST /vote_records"
              payload: { resolution_id: "${r}", channel: "WRITTEN_CONSENT", vote: "FOR" }
              as: Director
              as_user_id: "${d1}"
            - call: "POST /_clock/set_current_utc"
