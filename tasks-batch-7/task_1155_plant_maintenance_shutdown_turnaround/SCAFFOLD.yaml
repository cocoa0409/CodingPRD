# =============================================================================
# Task 1155 — Plant Maintenance Shutdown & Turnaround Management (v1)
# =============================================================================

scenario: |
  generate task hard than expert level! 1155. Plant Maintenance Shutdown & Turnaround Management (plant turnaround contractor): scope freeze & work-list ranking, critical-path schedule & shift plan, contractor mobilization & badging, permit-to-work & isolation coordination, discovery work & change authorization, materials staging & lay-down area, daily cost/progress reporting, startup punch list & handover

domain_name: plant-turnaround
api_prefix: ""                  # collections are root-mounted (flat/graph topology), e.g. /turnarounds, /work-items

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency      # OCC on WorkItem.version and LayDownArea.version
    - cascading_side_effects      # permit revoke -> work item hold -> slip/posture; discovery authorize -> committed -> posture
    - dual_variant_calculation    # EAC forecast (PROVISIONAL vs COMMITTED); fatigue eligibility (PENALTY_WEIGHTED vs HOURS_LEDGER)
    - ops_run_checkpoint          # POST /turnarounds/{id}/run-ops expires permits, releases stale reservations
  entity_topology: graph          # flat peers + WorkItemDependency DAG (self-referential) + Permit<->Isolation many-to-many
  state_machine_shape: cyclic     # WorkItem rework loop, DiscoveryWork appeal loop, Permit ACTIVE<->SUSPENDED, PunchItem READY<->REOPENED
  relationship_patterns:
    - one_to_many                 # Turnaround -> WorkItem/Contractor/Shift/Isolation/DiscoveryWork/LayDownArea/DailyReport/PunchItem
    - many_to_many                # ShiftAssignment (Worker x Shift); Permit <-> Isolation via required_isolation_ids
    - self_referential            # WorkItemDependency predecessor/successor both -> WorkItem (DAG, cycle-rejected)
    - cross_aggregate             # PunchItem.work_item_id, DiscoveryWork.origin_work_item_id
  role_model: segregation_of_duties  # reporter != authorizer (discoveries); submitter != approver (daily reports)
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Turnaround
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Turnaround display name" }
      - { name: plant_unit, type: string, source: input, description: "Plant unit identifier (e.g. CRU-2)" }
      - { name: planned_start, type: datetime, source: input, description: "Planned execution window start (ISO8601 UTC)" }
      - { name: planned_end, type: datetime, source: input, description: "Planned execution window end (ISO8601 UTC)" }
      - { name: authorized_budget_cents, type: integer, source: input, description: "Authorized budget in cents; must be > 0" }
      - { name: contingency_budget_cents, type: integer, source: input, description: "Contingency drawdown pool in cents; must be >= 0" }
      - { name: status, type: enum, source: system, description: "PLANNING | SCOPE_FROZEN | MOBILIZATION | EXECUTION | STARTUP | HANDED_OVER | CANCELLED" }
      - { name: cost_posture, type: enum, source: computed, description: "WITHIN_BUDGET | AT_RISK | OVERRUN — derived per calculation eac_cost_forecast" }
      - { name: committed_cost_cents, type: integer, source: computed, description: "Sum of estimated_cost_cents over scope WorkItems in {FROZEN, SCHEDULED, IN_PROGRESS, ON_HOLD, REOPENED}" }
      - { name: reported_cost_cents, type: integer, source: computed, description: "Sum of total_cost_cents over APPROVED DailyReports of this turnaround" }
      - { name: critical_path_slip_hours, type: number, source: computed, default: 0, description: "Sum of remaining_hours over critical-path WorkItems currently ON_HOLD" }
      - { name: schedule_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run-ops" }
      - { name: scope_frozen_at, type: datetime, source: system, description: "Timestamp of freeze-scope; null until frozen", default: null }
      - { name: handed_over_at, type: datetime, source: system, description: "Timestamp of handover; null until handed over", default: null }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: WorkItem
    parent: null
    common_fields: true
    fields:
      - { name: turnaround_id, type: string, source: system, description: "FK -> Turnaround.id; owning turnaround" }
      - { name: discovery_id, type: string, source: system, description: "FK -> DiscoveryWork.id; set only on DISCOVERY_ADDENDUM items created by authorization cascade; null otherwise", default: null }
      - { name: planned_shift_id, type: string, source: input, description: "FK -> Shift.id; shift the item is scheduled into; null until scheduled", default: null }
      - { name: title, type: string, source: input, description: "Work item title" }
      - { name: system_area, type: string, source: input, description: "Plant system/area tag" }
      - { name: work_type, type: enum, source: input, description: "CORRECTIVE | PREVENTIVE | INSPECTION | DISCOVERY_ADDENDUM" }
      - { name: risk_class, type: enum, source: input, description: "A | B | C (A = highest risk)" }
      - { name: estimated_hours, type: number, source: input, description: "Estimated labor hours; must be > 0" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimated direct cost in cents; must be >= 0" }
      - { name: requires_permit, type: boolean, source: input, default: false, description: "Whether start requires an ACTIVE permit covering this item" }
      - { name: rank_score, type: number, source: computed, description: "Computed at freeze-scope per work_rank_score; null while PROPOSED", default: null }
      - { name: rank_position, type: integer, source: computed, description: "1-based position after freeze-scope ordering; null while PROPOSED", default: null }
      - { name: is_critical_path, type: boolean, source: computed, default: false, description: "True when total_float == 0 per critical_path_float at freeze-scope" }
      - { name: actual_hours, type: number, source: input, description: "Actual labor hours, recorded on complete; null until COMPLETE", default: null }
      - { name: remaining_hours, type: number, source: computed, description: "= max(0, estimated_hours - coalesce(actual_hours, 0))" }
      - { name: status, type: enum, source: system, description: "PROPOSED | FROZEN | DEFERRED | SCHEDULED | IN_PROGRESS | ON_HOLD | COMPLETE | REOPENED | VERIFIED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: WorkItemDependency
    parent: null
    common_fields: false
    fields:
      - { name: turnaround_id, type: string, source: system, description: "FK -> Turnaround.id; denormalized scope guard (must match both endpoints' turnaround)" }
      - { name: predecessor_work_item_id, type: string, source: input, description: "FK -> WorkItem.id; must finish before successor starts" }
      - { name: successor_work_item_id, type: string, source: system, description: "FK -> WorkItem.id; taken from the path work item" }
      - { name: lag_hours, type: integer, source: input, default: 0, description: "Lag between predecessor completion and successor start; >= 0" }

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - { name: turnaround_id, type: string, source: system, description: "FK -> Turnaround.id; owning turnaround" }
      - { name: name, type: string, source: input, description: "Contractor company name" }
      - { name: craft, type: string, source: input, description: "Primary craft (e.g. PIPEFITTING)" }
      - { name: headcount_cap, type: integer, source: input, description: "Maximum workers holding a live badge (BADGED or SUSPENDED) at once; must be >= 1" }
      - { name: badged_headcount, type: integer, source: computed, default: 0, description: "Count of workers with badge_status in {BADGED, SUSPENDED}" }
      - { name: mobilization_status, type: enum, source: system, description: "INVITED | MOBILIZING | MOBILIZED | DEMOBILIZED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: contractor_id, type: string, source: system, description: "FK -> Contractor.id; employing contractor" }
      - { name: full_name, type: string, source: input, description: "Worker legal name" }
      - { name: trade, type: string, source: input, description: "Trade (e.g. WELDER)" }
      - { name: badge_status, type: enum, source: system, description: "REGISTERED | VETTED | BADGED | SUSPENDED | DEBADGED" }
      - { name: ledger_hours, type: number, source: computed, default: 0, description: "Sum of planned_hours over this worker's ShiftAssignments in {ASSIGNED, COMPLETED} (HOURS_LEDGER variant input)" }
      - { name: fatigue_penalty_score, type: integer, source: computed, default: 0, description: "Penalty score per fatigue_eligibility PENALTY_WEIGHTED variant" }
      - { name: total_shift_hours, type: number, source: computed, default: 0, description: "Sum of actual_hours over COMPLETED ShiftAssignments" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: turnaround_id, type: string, source: system, description: "FK -> Turnaround.id; owning turnaround" }
      - { name: shift_date, type: string, source: input, description: "Calendar date YYYY-MM-DD of the shift" }
      - { name: shift_type, type: enum, source: input, description: "DAY | NIGHT" }
      - { name: starts_at, type: datetime, source: input, description: "Shift start (ISO8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Shift end (ISO8601 UTC); must be strictly after starts_at" }
      - { name: planned_headcount, type: integer, source: input, description: "Maximum non-CANCELLED assignments on this shift; must be >= 1" }
      - { name: status, type: enum, source: system, description: "PLANNED | LOCKED | COMPLETED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: system, description: "FK -> Shift.id; assigned shift (from path)" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; assigned worker" }
      - { name: planned_hours, type: number, source: input, description: "Planned hours on this shift; must be > 0" }
      - { name: actual_hours, type: number, source: input, description: "Actual hours, recorded on complete; null until COMPLETED", default: null }
      - { name: status, type: enum, source: system, description: "ASSIGNED | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: work_item_id, type: string, source: system, description: "FK -> WorkItem.id; covered work item (from path)" }
      - { name: permit_type, type: enum, source: input, description: "COLD_WORK | HOT_WORK | CONFINED_SPACE" }
      - { name: hazard_class, type: enum, source: input, description: "LOW | HIGH" }
      - { name: valid_from, type: datetime, source: input, description: "Validity window start (inclusive)" }
      - { name: valid_until, type: datetime, source: input, description: "Validity window end (exclusive for activation; run-ops expires when valid_until <= now); must be > valid_from" }
      - { name: required_isolation_ids, type: array, source: input, description: "FK -> Isolation.id (array of ids); isolations that must be VERIFIED before activation; may be empty" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ISSUED | ACTIVE | SUSPENDED | CLOSED | REVOKED | EXPIRED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: Isolation
    parent: null
    common_fields: true
    fields:
      - { name: turnaround_id, type: string, source: system, description: "FK -> Turnaround.id; owning turnaround" }
      - { name: equipment_tag, type: string, source: input, description: "Equipment being isolated (e.g. EXCH-E201)" }
      - { name: isolation_mode, type: enum, source: input, description: "EXCLUSIVE | SHARED — two SHARED isolations may coexist on one equipment_tag; any EXCLUSIVE involvement conflicts" }
      - { name: isolated_from, type: datetime, source: input, description: "Isolation window start (CLOSED interval)" }
      - { name: isolated_until, type: datetime, source: input, description: "Isolation window end (CLOSED interval); must be > isolated_from" }
      - { name: status, type: enum, source: system, description: "PLANNED | ISOLATED | VERIFIED | DEISOLATED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: DiscoveryWork
    parent: null
    common_fields: true
    fields:
      - { name: turnaround_id, type: string, source: system, description: "FK -> Turnaround.id; owning turnaround" }
      - { name: origin_work_item_id, type: string, source: input, description: "FK -> WorkItem.id; work item where the discovery was found; optional", default: null }
      - { name: description, type: string, source: input, description: "Discovery description" }
      - { name: quoted_cost_cents, type: integer, source: input, description: "Contractor-quoted cost; must be > 0" }
      - { name: quoted_hours, type: number, source: input, description: "Contractor-quoted hours; must be > 0" }
      - { name: authorized_cost_cents, type: integer, source: input, description: "Authorized cost set at decision; null until AUTHORIZED", default: null }
      - { name: status, type: enum, source: system, description: "REPORTED | TRIAGED | AUTHORIZED | REJECTED" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the reporter (SoD anchor)" }
      - { name: authorized_by_user_id, type: string, source: system, description: "X-User-ID of the decider; null until first decision", default: null }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of appeals filed; appeal allowed while appeal_count < 2" }
      - { name: triage_note, type: string, source: input, description: "Triage note; optional", default: null }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: LayDownArea
    parent: null
    common_fields: true
    fields:
      - { name: turnaround_id, type: string, source: system, description: "FK -> Turnaround.id; owning turnaround" }
      - { name: name, type: string, source: input, description: "Lay-down area name" }
      - { name: capacity_sqm, type: integer, source: input, description: "Total staging capacity in square meters; must be > 0" }
      - { name: occupied_sqm, type: integer, source: computed, default: 0, description: "Sum of area_sqm over StagingReservations in {RESERVED, STAGED}" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1 (OCC anchor for reservations)" }

  - name: StagingReservation
    parent: null
    common_fields: true
    fields:
      - { name: laydown_area_id, type: string, source: system, description: "FK -> LayDownArea.id; hosting area (from path)" }
      - { name: material_description, type: string, source: input, description: "Staged material description" }
      - { name: area_sqm, type: integer, source: input, description: "Reserved square meters; must be > 0" }
      - { name: window_from, type: datetime, source: input, description: "Staging window start" }
      - { name: window_until, type: datetime, source: input, description: "Staging window end; must be > window_from" }
      - { name: status, type: enum, source: system, description: "RESERVED | STAGED | RELEASED | CANCELLED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: DailyReport
    parent: null
    common_fields: true
    fields:
      - { name: turnaround_id, type: string, source: system, description: "FK -> Turnaround.id; owning turnaround" }
      - { name: contractor_id, type: string, source: system, description: "FK -> Contractor.id; taken from the submitter's X-User-ID (ContractorSupervisor identity)" }
      - { name: report_date, type: string, source: input, description: "Reported date YYYY-MM-DD; must not be after the current logical date" }
      - { name: lines, type: array, source: input, description: "Labor lines: [{worker_id, shift_id, hours, hazard_flag}]; must be non-empty" }
      - { name: line_costs_cents, type: array, source: computed, description: "Per-line costs in input order, each rounded half-up to cents (daily_report_total); null until submit", default: null }
      - { name: labor_cost_cents, type: integer, source: computed, description: "Sum of per-line rounded costs; null until submit", default: null }
      - { name: overhead_cents, type: integer, source: computed, description: "Overhead per overhead_allocation (tier keyed on reported cost excluding this report); null until submit", default: null }
      - { name: total_cost_cents, type: integer, source: computed, description: "= labor_cost_cents + overhead_cents; null until submit", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | VOIDED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of submitter; set at submit", default: null }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; set at approve", default: null }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

  - name: PunchItem
    parent: null
    common_fields: true
    fields:
      - { name: turnaround_id, type: string, source: system, description: "FK -> Turnaround.id; owning turnaround" }
      - { name: work_item_id, type: string, source: input, description: "FK -> WorkItem.id; punched work item (must be COMPLETE or VERIFIED)" }
      - { name: category, type: enum, source: input, description: "A | B — category A must be VERIFIED before handover; B may carry over" }
      - { name: description, type: string, source: input, description: "Punch description" }
      - { name: status, type: enum, source: system, description: "OPEN | READY | VERIFIED | REOPENED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version, starts at 1" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Turnaround
    field: status
    initial_state: PLANNING
    terminal_states: [HANDED_OVER, CANCELLED]
    transitions:
      - from: PLANNING
        to: SCOPE_FROZEN
        trigger: "POST /turnarounds/{id}/freeze-scope"
        actor: TurnaroundManager
        preconditions:
          - "At least one WorkItem in PROPOSED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Compute work_rank_score + rank_position + is_critical_path for every PROPOSED WorkItem"
          - "WorkItems with rank_position <= scope_cutoff_count -> FROZEN; all other PROPOSED -> DEFERRED"
          - "scope_frozen_at := now; committed_cost_cents recomputed (eac_cost_forecast)"
          - "increments Turnaround.version by 1"
      - from: SCOPE_FROZEN
        to: MOBILIZATION
        trigger: "POST /turnarounds/{id}/advance"
        actor: TurnaroundManager
        preconditions: []
        side_effects: ["increments Turnaround.version by 1"]
      - from: MOBILIZATION
        to: EXECUTION
        trigger: "POST /turnarounds/{id}/advance"
        actor: TurnaroundManager
        preconditions:
          - "At least one Contractor with mobilization_status == MOBILIZED (ERR_NO_MOBILIZED_CONTRACTOR)"
        side_effects: ["increments Turnaround.version by 1"]
      - from: EXECUTION
        to: STARTUP
        trigger: "POST /turnarounds/{id}/advance"
        actor: TurnaroundManager
        preconditions:
          - "Gate order: (1) every scope WorkItem (status not in {DEFERRED, CANCELLED}) must be VERIFIED (ERR_WORK_ITEMS_OPEN); (2) no Permit in {REQUESTED, ISSUED, ACTIVE, SUSPENDED} (ERR_PERMITS_STILL_ACTIVE); (3) no Isolation in {PLANNED, ISOLATED, VERIFIED} (ERR_ISOLATIONS_ENGAGED)"
        side_effects: ["increments Turnaround.version by 1"]
      - from: STARTUP
        to: HANDED_OVER
        trigger: "POST /turnarounds/{id}/handover"
        actor: TurnaroundManager
        preconditions:
          - "Count of PunchItems with category == A and status in {OPEN, READY, REOPENED} must equal 0 (ERR_OPEN_PUNCH_ITEMS); category B may carry over"
        side_effects:
          - "handed_over_at := now"
          - "increments Turnaround.version by 1"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /turnarounds/{id}/cancel"
        actor: TurnaroundManager
        preconditions: []
        side_effects:
          - "WorkItems in PROPOSED or FROZEN -> CANCELLED; DEFERRED WorkItems unchanged"
          - "increments Turnaround.version by 1"
      - from: SCOPE_FROZEN
        to: CANCELLED
        trigger: "POST /turnarounds/{id}/cancel"
        actor: TurnaroundManager
        preconditions: []
        side_effects:
          - "WorkItems in PROPOSED or FROZEN -> CANCELLED; DEFERRED WorkItems unchanged"
          - "increments Turnaround.version by 1"

  - entity: Turnaround
    field: cost_posture
    initial_state: WITHIN_BUDGET
    terminal_states: []
    transitions:
      - from: WITHIN_BUDGET
        to: AT_RISK
        trigger: "system (eac_cost_forecast recompute: forecast_provisional_cents > authorized_budget_cents AND committed_cost_cents <= authorized_budget_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WITHIN_BUDGET
        to: OVERRUN
        trigger: "system (eac_cost_forecast recompute: committed_cost_cents > authorized_budget_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_RISK
        to: OVERRUN
        trigger: "system (committed_cost_cents exceeds authorized_budget_cents)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_RISK
        to: WITHIN_BUDGET
        trigger: "system (forecast_provisional_cents returns to <= authorized_budget_cents, e.g. discovery REJECTED removes its quote)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERRUN
        to: WITHIN_BUDGET
        trigger: "system (committed_cost_cents returns to <= authorized_budget_cents and provisional likewise, e.g. report VOID lowers actuals)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERRUN
        to: AT_RISK
        trigger: "system (committed returns under budget but provisional still exceeds it)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: WorkItem
    field: status
    initial_state: PROPOSED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: FROZEN
        trigger: "system (POST /turnarounds/{id}/freeze-scope; rank_position <= scope_cutoff_count)"
        actor: system
        preconditions: []
        side_effects: ["committed_cost_cents recompute on parent Turnaround"]
      - from: PROPOSED
        to: DEFERRED
        trigger: "system (POST /turnarounds/{id}/freeze-scope; rank_position > scope_cutoff_count)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: SCHEDULED
        trigger: "POST /work-items/{id}/schedule"
        actor: Planner
        preconditions:
          - "Turnaround.status in {MOBILIZATION, EXECUTION} (ERR_INVALID_STATE)"
        side_effects: ["increments WorkItem.version by 1"]
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /work-items/{id}/start"
        actor: ContractorSupervisor
        preconditions:
          - "Turnaround.status == EXECUTION (ERR_INVALID_STATE)"
          - "If requires_permit: a Permit for this WorkItem with status == ACTIVE must exist (ERR_PERMIT_NOT_ACTIVE)"
        side_effects:
          - "increments WorkItem.version by 1"
          - "If a critical-path WorkItem leaves ON_HOLD via this transition: critical_path_slip_hours recompute"
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /work-items/{id}/start"
        actor: ContractorSupervisor
        preconditions:
          - "Turnaround.status == EXECUTION (ERR_INVALID_STATE)"
          - "If requires_permit: a Permit for this WorkItem with status == ACTIVE must exist (ERR_PERMIT_NOT_ACTIVE)"
        side_effects:
          - "increments WorkItem.version by 1"
          - "critical_path_slip_hours recompute (item leaves the ON_HOLD set)"
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /work-items/{id}/start"
        actor: ContractorSupervisor
        preconditions:
          - "Turnaround.status == EXECUTION (ERR_INVALID_STATE)"
          - "If requires_permit: a Permit for this WorkItem with status == ACTIVE must exist (ERR_PERMIT_NOT_ACTIVE)"
        side_effects: ["increments WorkItem.version by 1"]
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /work-items/{id}/hold"
        actor: ContractorSupervisor
        preconditions: []
        side_effects:
          - "Permits for this WorkItem in ACTIVE -> SUSPENDED (conditional cascade; CLOSED/REVOKED/EXPIRED untouched)"
          - "If is_critical_path: critical_path_slip_hours recompute on parent Turnaround (item enters ON_HOLD set) followed by eac_cost_forecast recompute"
          - "increments WorkItem.version by 1"
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "system (covering Permit transitioned to REVOKED or EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "critical_path_slip_hours recompute on parent Turnaround when is_critical_path, then eac_cost_forecast recompute"
          - "increments WorkItem.version by 1"
        note: "Cascade link 2 of the permit-revoke chain; only fires when the WorkItem is IN_PROGRESS (conditional)"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /work-items/{id}/complete"
        actor: ContractorSupervisor
        preconditions: []
        side_effects:
          - "actual_hours recorded; remaining_hours recomputed"
          - "committed_cost_cents recompute (COMPLETE leaves the committed input set)"
          - "increments WorkItem.version by 1"
      - from: COMPLETE
        to: VERIFIED
        trigger: "POST /work-items/{id}/verify with outcome=VERIFIED"
        actor: OperationsRep
        preconditions: []
        side_effects: ["increments WorkItem.version by 1"]
      - from: COMPLETE
        to: REOPENED
        trigger: "POST /work-items/{id}/verify with outcome=REOPENED"
        actor: OperationsRep
        preconditions: []
        side_effects:
          - "committed_cost_cents recompute (REOPENED re-enters the committed input set)"
          - "increments WorkItem.version by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "system (Turnaround cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FROZEN
        to: CANCELLED
        trigger: "system (Turnaround cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["committed_cost_cents recompute"]

  - entity: Contractor
    field: mobilization_status
    initial_state: INVITED
    terminal_states: [DEMOBILIZED]
    transitions:
      - from: INVITED
        to: MOBILIZING
        trigger: "POST /contractors/{id}/mobilize"
        actor: ContractorSupervisor
        preconditions:
          - "Turnaround.status in {MOBILIZATION, EXECUTION} (ERR_INVALID_STATE)"
          - "Acting ContractorSupervisor's X-User-ID must equal this contractor's id (ERR_FORBIDDEN)"
        side_effects: ["increments Contractor.version by 1"]
      - from: MOBILIZING
        to: MOBILIZED
        trigger: "POST /contractors/{id}/mobilize"
        actor: ContractorSupervisor
        preconditions:
          - "badged_headcount >= 1 (ERR_NO_BADGED_WORKERS)"
          - "Acting ContractorSupervisor's X-User-ID must equal this contractor's id (ERR_FORBIDDEN)"
        side_effects: ["increments Contractor.version by 1"]
      - from: MOBILIZED
        to: DEMOBILIZED
        trigger: "POST /contractors/{id}/mobilize"
        actor: ContractorSupervisor
        preconditions:
          - "Turnaround.status == STARTUP (ERR_INVALID_STATE)"
        side_effects:
          - "Workers in BADGED or SUSPENDED -> DEBADGED (cascade); their ASSIGNED ShiftAssignments -> CANCELLED"
          - "increments Contractor.version by 1"

  - entity: Worker
    field: badge_status
    initial_state: REGISTERED
    terminal_states: [DEBADGED]
    transitions:
      - from: REGISTERED
        to: VETTED
        trigger: "POST /workers/{id}/vet"
        actor: PermitCoordinator
        preconditions:
          - "Turnaround.status not in {CANCELLED, HANDED_OVER} (ERR_INVALID_STATE)"
        side_effects: ["increments Worker.version by 1"]
      - from: VETTED
        to: BADGED
        trigger: "POST /workers/{id}/badge"
        actor: PermitCoordinator
        preconditions:
          - "Contractor.mobilization_status in {MOBILIZING, MOBILIZED} (ERR_INVALID_STATE)"
          - "Contractor.badged_headcount < Contractor.headcount_cap (ERR_CONTRACTOR_HEADCOUNT_CAP)"
          - "Turnaround.status in {MOBILIZATION, EXECUTION} (ERR_INVALID_STATE)"
        side_effects:
          - "Contractor.badged_headcount += 1"
          - "increments Worker.version by 1"
      - from: BADGED
        to: SUSPENDED
        trigger: "POST /workers/{id}/badge-transition with to=SUSPENDED"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["increments Worker.version by 1"]
      - from: SUSPENDED
        to: BADGED
        trigger: "POST /workers/{id}/badge-transition with to=BADGED"
        actor: PermitCoordinator
        preconditions:
          - "Contractor.badged_headcount < Contractor.headcount_cap (ERR_CONTRACTOR_HEADCOUNT_CAP)"
        side_effects:
          - "Contractor.badged_headcount += 1"
          - "increments Worker.version by 1"
      - from: BADGED
        to: DEBADGED
        trigger: "POST /workers/{id}/badge-transition with to=DEBADGED or system (contractor demobilization)"
        actor: PermitCoordinator
        preconditions: []
        side_effects:
          - "This worker's ShiftAssignments in ASSIGNED -> CANCELLED (cascade)"
          - "Contractor.badged_headcount -= 1"
          - "increments Worker.version by 1"
      - from: SUSPENDED
        to: DEBADGED
        trigger: "POST /workers/{id}/badge-transition with to=DEBADGED or system (contractor demobilization)"
        actor: PermitCoordinator
        preconditions: []
        side_effects:
          - "This worker's ShiftAssignments in ASSIGNED -> CANCELLED (cascade)"
          - "Contractor.badged_headcount -= 1"
          - "increments Worker.version by 1"

  - entity: Shift
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOCKED
        trigger: "POST /shifts/{id}/lock"
        actor: Planner
        preconditions:
          - "At least one ShiftAssignment in ASSIGNED on this shift (ERR_EMPTY_SHIFT)"
        side_effects: ["increments Shift.version by 1"]

  - entity: ShiftAssignment
    field: status
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /assignments/{id}/complete"
        actor: ContractorSupervisor
        preconditions:
          - "Turnaround.status == EXECUTION (ERR_INVALID_STATE)"
        side_effects:
          - "Worker.total_shift_hours += actual_hours; Worker fatigue fields recompute (fatigue_eligibility)"
          - "increments ShiftAssignment.version by 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /assignments/{id}/cancel or system (worker debadged)"
        actor: "Planner | ContractorSupervisor | system"
        preconditions: []
        side_effects:
          - "Worker fatigue fields recompute (assignment leaves the ledger input set)"
          - "increments ShiftAssignment.version by 1"

  - entity: Permit
    field: status
    initial_state: REQUESTED
    terminal_states: [CLOSED, REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /permits/{id}/transition with to=ISSUED"
        actor: PermitCoordinator
        preconditions:
          - "Every isolation in required_isolation_ids has status in {ISOLATED, VERIFIED} (ERR_ISOLATION_NOT_VERIFIED)"
          - "now < valid_until (ERR_PERMIT_WINDOW_INVALID)"
        side_effects: ["increments Permit.version by 1"]
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /permits/{id}/transition with to=ACTIVE"
        actor: PermitCoordinator
        preconditions:
          - "Every isolation in required_isolation_ids has status == VERIFIED (ERR_ISOLATION_NOT_VERIFIED)"
          - "Turnaround.status == EXECUTION (ERR_INVALID_STATE)"
          - "valid_from <= now < valid_until per the logical clock (ERR_PERMIT_WINDOW_INVALID)"
          - "WorkItem.status not in {VERIFIED, CANCELLED, COMPLETE} (ERR_INVALID_STATE)"
        side_effects: ["increments Permit.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /permits/{id}/transition with to=ACTIVE"
        actor: PermitCoordinator
        preconditions:
          - "Every isolation in required_isolation_ids has status == VERIFIED (ERR_ISOLATION_NOT_VERIFIED)"
          - "Turnaround.status == EXECUTION (ERR_INVALID_STATE)"
          - "valid_from <= now < valid_until (ERR_PERMIT_WINDOW_INVALID)"
        side_effects: ["increments Permit.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /permits/{id}/transition with to=SUSPENDED or system (covered WorkItem placed ON_HOLD)"
        actor: "PermitCoordinator | system"
        preconditions: []
        side_effects: ["increments Permit.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /permits/{id}/transition with to=CLOSED"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["increments Permit.version by 1"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /permits/{id}/transition with to=CLOSED"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["increments Permit.version by 1"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /permits/{id}/transition with to=REVOKED"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["increments Permit.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /permits/{id}/transition with to=REVOKED"
        actor: PermitCoordinator
        preconditions: []
        side_effects:
          - "Cascade link 1: covered WorkItem in IN_PROGRESS -> ON_HOLD (that transition itself recomputes critical_path_slip_hours and cost posture on the parent Turnaround — cascade links 2 and 3)"
          - "increments Permit.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /permits/{id}/transition with to=REVOKED"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["increments Permit.version by 1"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (run-ops: valid_until <= now)"
        actor: system
        preconditions: []
        side_effects: ["increments Permit.version by 1"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (run-ops: valid_until <= now)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: covered WorkItem in IN_PROGRESS -> ON_HOLD (conditional); slip/posture recompute follows from that transition"
          - "increments Permit.version by 1"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (run-ops: valid_until <= now)"
        actor: system
        preconditions: []
        side_effects: ["increments Permit.version by 1"]

  - entity: Isolation
    field: status
    initial_state: PLANNED
    terminal_states: [DEISOLATED]
    transitions:
      - from: PLANNED
        to: ISOLATED
        trigger: "POST /isolations/{id}/transition with to=ISOLATED"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["increments Isolation.version by 1"]
      - from: ISOLATED
        to: VERIFIED
        trigger: "POST /isolations/{id}/transition with to=VERIFIED"
        actor: PermitCoordinator
        preconditions: []
        side_effects: ["increments Isolation.version by 1"]
      - from: VERIFIED
        to: DEISOLATED
        trigger: "POST /isolations/{id}/transition with to=DEISOLATED"
        actor: PermitCoordinator
        preconditions:
          - "No Permit whose required_isolation_ids contains this isolation is in {ISSUED, ACTIVE, SUSPENDED} (ERR_ISOLATION_IN_USE)"
        side_effects: ["increments Isolation.version by 1"]
      - from: ISOLATED
        to: DEISOLATED
        trigger: "POST /isolations/{id}/transition with to=DEISOLATED"
        actor: PermitCoordinator
        preconditions:
          - "No Permit whose required_isolation_ids contains this isolation is in {ISSUED, ACTIVE, SUSPENDED} (ERR_ISOLATION_IN_USE)"
        side_effects: ["increments Isolation.version by 1"]

  - entity: DiscoveryWork
    field: status
    initial_state: REPORTED
    terminal_states: [AUTHORIZED]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /discoveries/{id}/triage"
        actor: TurnaroundManager
        preconditions: []
        side_effects: ["increments DiscoveryWork.version by 1"]
      - from: TRIAGED
        to: AUTHORIZED
        trigger: "POST /discoveries/{id}/decide with outcome=AUTHORIZED"
        actor: TurnaroundManager
        preconditions:
          - "X-User-ID of the decider must differ from reported_by_user_id (ERR_SOD_VIOLATION)"
          - "authorized_cost_cents present and > 0 (ERR_INVALID_REQUEST)"
          - "authorized_cost_cents <= contingency_remaining_cents (ERR_CONTINGENCY_EXCEEDED)"
        side_effects:
          - "Cascade link 1: create addendum WorkItem (work_type=DISCOVERY_ADDENDUM, risk_class=C, requires_permit=false, status=FROZEN, estimated_cost_cents=authorized_cost_cents, estimated_hours=quoted_hours, discovery_id back-reference) and recompute Turnaround.committed_cost_cents (adds the addendum estimate)"
          - "Cascade link 2: eac_cost_forecast recompute on the parent Turnaround flips cost_posture per its own machine"
          - "authorized_by_user_id := decider; authorized_cost_cents recorded"
          - "increments DiscoveryWork.version by 1 and Turnaround.version by 1"
      - from: TRIAGED
        to: REJECTED
        trigger: "POST /discoveries/{id}/decide with outcome=REJECTED"
        actor: TurnaroundManager
        preconditions:
          - "X-User-ID of the decider must differ from reported_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "eac_cost_forecast recompute (quote leaves the pending input set)"
          - "increments DiscoveryWork.version by 1"
      - from: REJECTED
        to: TRIAGED
        trigger: "POST /discoveries/{id}/appeal"
        actor: "ContractorSupervisor | TurnaroundManager"
        preconditions:
          - "appeal_count < 2 (ERR_APPEAL_LIMIT)"
        side_effects:
          - "appeal_count += 1"
          - "eac_cost_forecast recompute (quote re-enters the pending input set)"
          - "increments DiscoveryWork.version by 1"

  - entity: LayDownArea
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions: []

  - entity: StagingReservation
    field: status
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: RESERVED
        to: STAGED
        trigger: "POST /reservations/{id}/stage"
        actor: ContractorSupervisor
        preconditions: []
        side_effects: ["increments StagingReservation.version by 1"]
      - from: STAGED
        to: RELEASED
        trigger: "POST /reservations/{id}/release or system (run-ops: window_until <= now)"
        actor: "ContractorSupervisor | system"
        preconditions: []
        side_effects:
          - "LayDownArea.occupied_sqm -= area_sqm (laydown_occupancy); increments LayDownArea.version by 1"
          - "increments StagingReservation.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /reservations/{id}/release"
        actor: ContractorSupervisor
        preconditions: []
        side_effects:
          - "LayDownArea.occupied_sqm -= area_sqm; increments LayDownArea.version by 1"
          - "increments StagingReservation.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "system (run-ops: window_until <= now)"
        actor: system
        preconditions: []
        side_effects:
          - "LayDownArea.occupied_sqm -= area_sqm; increments LayDownArea.version by 1"
          - "increments StagingReservation.version by 1"

  - entity: DailyReport
    field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /daily-reports/{id}/submit"
        actor: ContractorSupervisor
        preconditions:
          - "Acting ContractorSupervisor's X-User-ID must equal contractor_id (ERR_FORBIDDEN)"
        side_effects:
          - "Compute line_costs_cents per line (shift_labor_cost), labor_cost_cents (daily_report_total), overhead_cents (overhead_allocation), total_cost_cents"
          - "submitted_by_user_id := X-User-ID"
          - "increments DailyReport.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /daily-reports/{id}/approve"
        actor: CostController
        preconditions:
          - "X-User-ID of the approver must differ from submitted_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "Turnaround.reported_cost_cents += total_cost_cents; eac_cost_forecast recompute; approved_by_user_id := X-User-ID"
          - "increments DailyReport.version by 1 and Turnaround.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /daily-reports/{id}/reject"
        actor: CostController
        preconditions: []
        side_effects:
          - "No ledger effect; computed cost fields retained for resubmission review"
          - "increments DailyReport.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /daily-reports/{id}/void"
        actor: CostController
        preconditions:
          - "No APPROVED DailyReport with a later report_date exists for the same (turnaround_id, contractor_id) (ERR_REPORT_SEQUENCE)"
        side_effects:
          - "Turnaround.reported_cost_cents -= total_cost_cents; eac_cost_forecast recompute (compensation of the approve side effect)"
          - "increments DailyReport.version by 1 and Turnaround.version by 1"

  - entity: PunchItem
    field: status
    initial_state: OPEN
    terminal_states: [VERIFIED]
    transitions:
      - from: OPEN
        to: READY
        trigger: "POST /punch-items/{id}/ready"
        actor: ContractorSupervisor
        preconditions: []
        side_effects: ["increments PunchItem.version by 1"]
      - from: REOPENED
        to: READY
        trigger: "POST /punch-items/{id}/ready"
        actor: ContractorSupervisor
        preconditions: []
        side_effects: ["increments PunchItem.version by 1"]
      - from: READY
        to: VERIFIED
        trigger: "POST /punch-items/{id}/verify with outcome=VERIFIED"
        actor: OperationsRep
        preconditions: []
        side_effects: ["increments PunchItem.version by 1"]
      - from: READY
        to: REOPENED
        trigger: "POST /punch-items/{id}/verify with outcome=REOPENED"
        actor: OperationsRep
        preconditions: []
        side_effects: ["increments PunchItem.version by 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; state-precondition conflicts live in 1.2/1.4)
# =============================================================================
concurrency_rules:
  - rule_id: work-item-estimate-stale
    parent_entity: WorkItem
    write_endpoint: "POST /work-items/{id}/estimate"
    occ_field: "expected_work_item_version"
    description: |
      Re-estimating a PROPOSED WorkItem is legitimate at any time before scope
      freeze, so a second well-formed estimate would also succeed on its own.
      The server rejects an estimate whose expected_work_item_version no longer
      matches the WorkItem's current version, i.e. the planner's view of the
      item is stale because another estimate has already been applied.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: laydown-reservation-stale-area
    parent_entity: LayDownArea
    write_endpoint: "POST /laydown-areas/{id}/reservations"
    occ_field: "expected_laydown_area_version"
    description: |
      Creating a StagingReservation commits shared lay-down capacity computed
      from the area's occupied_sqm at read time. The server rejects a creation
      whose expected_laydown_area_version no longer matches the LayDownArea's
      current version, i.e. the free-space figure the request was based on is
      stale because another reservation or release has already been applied.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: work_rank_score
    trigger: "POST /turnarounds/{id}/freeze-scope (for every PROPOSED WorkItem of the turnaround)"
    algorithm: weighted_scoring
    formula: |
      downstream_count(w) = number of distinct WorkItems reachable from w by
        following WorkItemDependency successor edges (transitive closure,
        same turnaround; the DAG is guaranteed acyclic by ERR_DEPENDENCY_CYCLE).
      cost_term = max(0, COST_TERM_CAP - floor(estimated_cost_cents / COST_TERM_DIVISOR))
      rank_score = RISK_WEIGHT[risk_class] * 1000 + DOWNSTREAM_WEIGHT * downstream_count + cost_term
      rank_position: order by rank_score DESC, tie-break created_at ASC; positions are 1-based.
      Items with rank_position <= scope_cutoff_count become FROZEN (inclusive cutoff); the rest DEFERRED.
    input_set: "All WorkItems of the turnaround with status == PROPOSED at freeze time"
    constants:
      RISK_WEIGHT: { A: 5, B: 3, C: 1 }
      DOWNSTREAM_WEIGHT: 25
      COST_TERM_CAP: 500
      COST_TERM_DIVISOR: 10000
    precision: "integers; floor division for cost_term"

  - name: critical_path_float
    trigger: "POST /turnarounds/{id}/freeze-scope and POST /work-items/{id}/dependencies (dependency graph changes)"
    algorithm: topological
    formula: |
      Build the DAG over PROPOSED WorkItems of the turnaround using
      WorkItemDependency edges (predecessor -> successor, lag_hours).
      path_length(w) = estimated_hours(w) + max over successors s of (lag_hours(w->s) + path_length(s));
        leaf items use their own estimated_hours.
      project_length = max path_length over all items.
      total_float(w) = project_length - path_length(w).
      is_critical_path(w) = (total_float(w) == 0).
      Evaluation order: topological order (successors before predecessors); the
      graph is acyclic because dependency creation rejects cycles.
      critical_path_slip_hours (Turnaround) = sum of remaining_hours over items
        where is_critical_path AND status == ON_HOLD; recomputed on every
        WorkItem transition into or out of ON_HOLD.
    input_set: "WorkItems with status == PROPOSED at freeze time (network frozen at scope freeze)"
    precision: "hours as numbers; no rounding"

  - name: shift_labor_cost
    trigger: "POST /daily-reports/{id}/submit — applied to each labor line independently"
    algorithm: tiered_pricing
    formula: |
      Per line with inputs (hours, shift.shift_type, line.hazard_flag):
        regular_hours = min(hours, 8)
        ot1_hours     = min(max(hours - 8, 0), 4)
        ot2_hours     = max(hours - 12, 0)          # exactly 12.0h contributes ZERO ot2
        base = regular_hours * BASE_RATE_CENTS
             + ot1_hours * BASE_RATE_CENTS * OT1_MULT
             + ot2_hours * BASE_RATE_CENTS * OT2_MULT
        if shift_type == NIGHT: base = base * NIGHT_MULT
        if hazard_flag:         base = base * HAZARD_MULT
        line_cost = round_half_up(base)             # to integer cents, once, here
        line_cost = min(line_cost, DAILY_CAP_CENTS) # cap applied AFTER rounding
    input_set: "Each element of DailyReport.lines; shift_type resolved via line.shift_id (must belong to the same turnaround)"
    constants:
      BASE_RATE_CENTS: 8500
      OT1_MULT: 1.5
      OT2_MULT: 2.0
      NIGHT_MULT: 1.20
      HAZARD_MULT: 1.15
      DAILY_CAP_CENTS: 250000
    precision: "round_half_up to integer cents once per line, BEFORE the cap; multiplications unrounded until then"

  - name: daily_report_total
    trigger: "POST /daily-reports/{id}/submit — after shift_labor_cost has priced every line"
    algorithm: aggregation
    formula: |
      PINNED ROUNDING ORDER (nested rounding, order matters):
        (1) round each line to integer cents via shift_labor_cost (per-line rounding);
        (2) labor_cost_cents = sum of the ROUNDED per-line costs.
      The alternative order (sum raw line values, round once) is FORBIDDEN:
      e.g. two lines of 0.1h hazard DAY yield 977.5 each raw; per-line-then-sum
      gives 978 + 978 = 1956, sum-then-round would give 1955.
    input_set: "DailyReport.lines of the submitting report only"
    precision: "integer cents; per-line rounding then summation (pinned)"

  - name: overhead_allocation
    trigger: "POST /daily-reports/{id}/submit — after daily_report_total"
    algorithm: threshold
    formula: |
      CIRCULAR-LOOKING DEPENDENCY, PINNED EVALUATION ORDER:
        (1) tier_base := Turnaround.reported_cost_cents EXCLUDING this candidate
            report (i.e. sum of total_cost_cents over OTHER APPROVED reports).
        (2) tier := LOW when tier_base < OVERHEAD_TIER_THRESHOLD_CENTS else HIGH.
        (3) overhead_cents = round_half_up(labor_cost_cents * OVERHEAD_PCT[tier]).
        (4) total_cost_cents = labor_cost_cents + overhead_cents.
      Keying the tier on a total that would include this report is FORBIDDEN;
      step (1) must be evaluated before step (3).
    input_set: "The candidate report's labor_cost_cents and the turnaround's OTHER APPROVED DailyReports"
    constants:
      OVERHEAD_TIER_THRESHOLD_CENTS: 200000
      OVERHEAD_PCT: { LOW: 0.10, HIGH: 0.15 }
    precision: "round_half_up to integer cents at step (3)"

  - name: eac_cost_forecast
    trigger: "freeze-scope; WorkItem status changes into/out of the committed input set; DiscoveryWork report/triage/decide/appeal; DailyReport approve/void; critical_path_slip_hours recompute"
    algorithm: forward_looking
    formula: |
      committed_cost_cents = sum(estimated_cost_cents) over WorkItems of the
        turnaround with status in {FROZEN, SCHEDULED, IN_PROGRESS, ON_HOLD, REOPENED}.
      pending_quote_cents = sum(quoted_cost_cents) over DiscoveryWork with
        status in {REPORTED, TRIAGED}.
      overrun_cents = floor(critical_path_slip_hours / HOURS_PER_SLIP_DAY) * DAILY_OVERHEAD_CENTS.
      forecast_committed_cents  = committed_cost_cents.
      forecast_provisional_cents = committed_cost_cents + pending_quote_cents + overrun_cents.
      Evaluation order is pinned: committed first, then provisional, then posture:
        cost_posture = OVERRUN        if committed_cost_cents > authorized_budget_cents
                     = AT_RISK        elif forecast_provisional_cents > authorized_budget_cents
                     = WITHIN_BUDGET  otherwise.
      contingency_remaining_cents = contingency_budget_cents
        - sum(authorized_cost_cents) over DiscoveryWork with status == AUTHORIZED.
    input_set: "WorkItems and DiscoveryWork of the turnaround; APPROVED reports feed reported_cost_cents (NOT the forecast)"
    constants:
      HOURS_PER_SLIP_DAY: 8
      DAILY_OVERHEAD_CENTS: 50000
    precision: "integer cents; floor for slip days"
    variants:
      - name: COMMITTED
        when: "forecast_committed_cents field and posture OVERRUN leg"
        difference: "Excludes pending discovery quotes and schedule overrun; for identical data it is strictly lower whenever pending quotes or slip exist"
      - name: PROVISIONAL
        when: "forecast_provisional_cents field and posture AT_RISK leg"
        difference: "Includes REPORTED/TRIAGED discovery quotes and critical-path overrun; diverges from COMMITTED by exactly pending_quote_cents + overrun_cents"

  - name: fatigue_eligibility
    trigger: "POST /shifts/{id}/assignments (gate), POST /assignments/{id}/complete and /cancel (recompute stored fields)"
    algorithm: weighted_scoring
    formula: |
      Both variants are computed over the worker's ShiftAssignments with status
      in {ASSIGNED, COMPLETED} (CANCELLED and NO_SHOW excluded), ordered by
      shift.starts_at ASC with tie-break assignment.created_at ASC.
      HOURS_LEDGER variant: ledger_hours = sum(planned_hours).
      PENALTY_WEIGHTED variant: walk the ordered assignments; for each one:
        + NIGHT_PENALTY if its shift.shift_type == NIGHT
        + REST_PENALTY if the gap from the previous kept assignment's
          shift.ends_at to this shift.starts_at is in [MIN_REST_HOURS, RECOVERY_REST_HOURS)
      For a CANDIDATE assignment (create gate): insert the candidate's shift into
      the ordering and compute the PROJECTED penalty score; reject when
      projected_score >= FATIGUE_SCORE_LIMIT with ERR_FATIGUE_LIMIT.
      Stored Worker.fatigue_penalty_score / ledger_hours reflect only existing
      assignments (recomputed after every create/complete/cancel).
    input_set: "ShiftAssignments of the worker with status in {ASSIGNED, COMPLETED} plus (for the gate) the candidate"
    constants:
      MIN_REST_HOURS: 10
      RECOVERY_REST_HOURS: 14
      REST_PENALTY: 10
      NIGHT_PENALTY: 5
      FATIGUE_SCORE_LIMIT: 20
      FATIGUE_HOURS_LIMIT: 60
    precision: "integer penalty points; hours unrounded"
    variants:
      - name: HOURS_LEDGER
        when: "Worker.ledger_hours field (advisory eligibility view)"
        difference: "Chronological hours accumulator; admits any worker whose ledger stays <= FATIGUE_HOURS_LIMIT regardless of rest patterns"
      - name: PENALTY_WEIGHTED
        when: "The assignment-creation gate and Worker.fatigue_penalty_score"
        difference: "Weighted violation scoring; rejects workers whom HOURS_LEDGER would admit (e.g. 22 ledger hours but score 20)"

  - name: laydown_occupancy
    trigger: "POST /laydown-areas/{id}/reservations (check + update), POST /reservations/{id}/stage (no change), /release (update), run-ops (auto-release update)"
    algorithm: aggregation
    formula: |
      occupied_sqm = sum(area_sqm) over StagingReservations of the area with
        status in {RESERVED, STAGED}.
      Create check (aggregate-capacity semantics — windows may overlap freely,
      space is shared): occupied_sqm + candidate.area_sqm <= capacity_sqm,
      equality ADMITTED (inclusive), else ERR_LAYDOWN_CAPACITY_EXCEEDED.
    input_set: "StagingReservations of the LayDownArea with status in {RESERVED, STAGED}"
    precision: "integer square meters"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role must be one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per the endpoint's roles list; entity-backed ownership: ContractorSupervisor's X-User-ID must equal the path/target contractor's id for contractor-scoped writes (mobilize, register worker, submit report)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path identifiers exist, validated left-to-right (turnaround, then nested resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: business_referential
    check: "OCC fields expected_work_item_version / expected_laydown_area_version match the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /work-items/{id}/estimate, POST /laydown-areas/{id}/reservations"
  - priority: 5
    category: business_referential
    check: "Request shape: required fields present, enum members valid, quantities positive, windows start < end; also daily report_date must not be after the current logical date"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 6
    category: business_referential
    check: "Cross-scope references must resolve within the same turnaround: dependency endpoints' items, permit required_isolation_ids, report lines' shift_id, and report lines' workers must belong to the submitting contractor"
    error_id: ERR_CROSS_SCOPE_REFERENCE
    http_status: 409
    applies_to: "POST /work-items/{id}/dependencies, POST /work-items/{id}/permits, POST /turnarounds/{id}/daily-reports"
  - priority: 7
    category: state
    check: "Target resource in a legal state for this operation per its state machine (covers scope-frozen edits: work item create/estimate/dependency only while turnaround PLANNING)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints and state-gated writes"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: discovery decider != reporter (X-User-ID); daily report approver != submitter (X-User-ID)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /discoveries/{id}/decide, POST /daily-reports/{id}/approve"
  - priority: 9
    category: business_safety
    check: "Worker badge must be BADGED for shift assignment and report lines; projected fatigue penalty score must stay < 20; start of a requires_permit work item needs an ACTIVE permit; permit activation needs all required isolations VERIFIED; de-isolation blocked while referenced by a live permit"
    error_id: "ERR_BADGE_NOT_CLEARED | ERR_FATIGUE_LIMIT | ERR_PERMIT_NOT_ACTIVE | ERR_ISOLATION_NOT_VERIFIED | ERR_ISOLATION_IN_USE"
    http_status: 409
    applies_to: "POST /shifts/{id}/assignments, POST /turnarounds/{id}/daily-reports, POST /work-items/{id}/start, POST /permits/{id}/transition, POST /isolations/{id}/transition"
  - priority: 10
    category: business_temporal
    check: "Shift assignment overlap (half-open intervals) and minimum rest gap (>= 10h, equality admitted); isolation window conflict (CLOSED intervals, mode-conditional sharing); permit activation/issue inside its validity window per the logical clock"
    error_id: "ERR_SHIFT_OVERLAP | ERR_REST_PERIOD_VIOLATION | ERR_ISOLATION_CONFLICT | ERR_PERMIT_WINDOW_INVALID"
    http_status: 409
    applies_to: "POST /shifts/{id}/assignments, POST /turnarounds/{id}/isolations, POST /permits/{id}/transition"
  - priority: 11
    category: business_constraint
    check: "Dependency graph must stay acyclic (self-loop counts as a cycle); contractor badge cap (badged_headcount < headcount_cap); shift headcount (assignments < planned_headcount); shift must be PLANNED to accept assignments; shift lock needs >= 1 assignment; mobilization to MOBILIZED needs >= 1 badged worker; advance gates; handover gate (zero open category-A punch items); appeal limit (< 2); report uniqueness per (turnaround, contractor, report_date); void only the latest APPROVED report per contractor"
    error_id: "ERR_DEPENDENCY_CYCLE | ERR_CONTRACTOR_HEADCOUNT_CAP | ERR_SHIFT_HEADCOUNT_FULL | ERR_SHIFT_LOCKED | ERR_EMPTY_SHIFT | ERR_NO_BADGED_WORKERS | ERR_NO_MOBILIZED_CONTRACTOR | ERR_WORK_ITEMS_OPEN | ERR_PERMITS_STILL_ACTIVE | ERR_ISOLATIONS_ENGAGED | ERR_OPEN_PUNCH_ITEMS | ERR_APPEAL_LIMIT | ERR_DUPLICATE_REPORT | ERR_REPORT_SEQUENCE"
    http_status: 409
    applies_to: "dependency/badge/shift/mobilize/advance/handover/appeal/report endpoints"
  - priority: 12
    category: business_fiscal
    check: "Discovery authorization must fit remaining contingency: authorized_cost_cents <= contingency_remaining_cents"
    error_id: ERR_CONTINGENCY_EXCEEDED
    http_status: 409
    applies_to: "POST /discoveries/{id}/decide"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Turnaround lifecycle ---
  - { method: POST, path: "/turnarounds", description: "Create a Turnaround", roles: [TurnaroundManager], code: 201, input: [name, plant_unit, planned_start, planned_end, authorized_budget_cents, contingency_budget_cents], output: Turnaround, side_effects: ["status=PLANNING, cost_posture=WITHIN_BUDGET, committed=0, reported=0, critical_path_slip_hours=0, schedule_run_index=0"] }
  - { method: GET, path: "/turnarounds/{id}", description: "Get a Turnaround", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: Turnaround, side_effects: [] }
  - { method: POST, path: "/turnarounds/{id}/freeze-scope", description: "Freeze scope: rank PROPOSED work items, FROZEN up to scope_cutoff_count (inclusive), rest DEFERRED", roles: [TurnaroundManager], code: 200, input: [scope_cutoff_count], output: Turnaround, side_effects: ["work_rank_score + critical_path_float computed for all PROPOSED items", "items -> FROZEN/DEFERRED", "scope_frozen_at set", "increments Turnaround.version by 1"] }
  - { method: POST, path: "/turnarounds/{id}/advance", description: "Advance status one step per the Turnaround machine (gates per target state)", roles: [TurnaroundManager], code: 200, input: [], output: Turnaround, side_effects: ["status advance", "increments Turnaround.version by 1"] }
  - { method: POST, path: "/turnarounds/{id}/cancel", description: "Cancel a turnaround (only from PLANNING or SCOPE_FROZEN)", roles: [TurnaroundManager], code: 200, input: [], output: Turnaround, side_effects: ["PROPOSED/FROZEN work items -> CANCELLED", "increments Turnaround.version by 1"] }
  - { method: POST, path: "/turnarounds/{id}/handover", description: "Hand over to operations; requires zero open category-A punch items", roles: [TurnaroundManager], code: 200, input: [operations_acknowledged], output: Turnaround, side_effects: ["status=HANDED_OVER, handed_over_at set", "increments Turnaround.version by 1"] }
  - { method: GET, path: "/turnarounds/{id}/cost-summary", description: "Computed cost read: both EAC variants, posture, contingency remaining", roles: [TurnaroundManager, Planner, CostController], code: 200, input: [], output: { committed_cost_cents: integer, reported_cost_cents: integer, forecast_committed_cents: integer, forecast_provisional_cents: integer, contingency_remaining_cents: integer, cost_posture: string }, side_effects: [] }
  - { method: POST, path: "/turnarounds/{id}/run-ops", description: "Ops-run checkpoint: expire permits with valid_until <= now (cascade holds), auto-release reservations with window_until <= now, bump schedule_run_index", roles: [TurnaroundManager], code: 200, input: [], output: Turnaround, side_effects: ["permits ISSUED/ACTIVE/SUSPENDED past window -> EXPIRED (+ work-item hold cascade)", "reservations RESERVED/STAGED past window -> RELEASED (+ occupied_sqm decrement)", "schedule_run_index += 1", "increments Turnaround.version by 1"] }
  # --- Work items ---
  - { method: POST, path: "/turnarounds/{id}/work-items", description: "Propose a work item (turnaround must be PLANNING)", roles: [Planner], code: 201, input: [title, system_area, work_type, risk_class, estimated_hours, estimated_cost_cents, "requires_permit?"], output: WorkItem, side_effects: ["status=PROPOSED"] }
  - { method: GET, path: "/turnarounds/{id}/work-items", description: "List work items of a turnaround (filterable, paginated)", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: ["status?", "work_type?", "is_critical_path?", "limit?", "offset?"], output: "WorkItem[]", side_effects: [] }
  - { method: GET, path: "/work-items/{id}", description: "Get a work item", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: WorkItem, side_effects: [] }
  - { method: POST, path: "/work-items/{id}/estimate", description: "Re-estimate a PROPOSED work item (OCC-guarded)", roles: [Planner], code: 200, input: [estimated_hours, estimated_cost_cents, risk_class, expected_work_item_version], output: WorkItem, side_effects: ["increments WorkItem.version by 1"] }
  - { method: POST, path: "/work-items/{id}/dependencies", description: "Add dependency: predecessor_work_item_id must finish before this item; cycle-safe", roles: [Planner], code: 201, input: [predecessor_work_item_id, "lag_hours?"], output: WorkItemDependency, side_effects: ["critical_path_float recompute (pre-freeze)"] }
  - { method: GET, path: "/work-items/{id}/dependencies", description: "List dependencies where this item is predecessor or successor", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: "WorkItemDependency[]", side_effects: [] }
  - { method: GET, path: "/turnarounds/{id}/dependencies", description: "List all dependency edges of a turnaround's work-item DAG", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: "WorkItemDependency[]", side_effects: [] }
  - { method: POST, path: "/work-items/{id}/schedule", description: "Schedule a FROZEN work item (optionally into a shift)", roles: [Planner], code: 200, input: ["planned_shift_id?"], output: WorkItem, side_effects: ["status -> SCHEDULED", "increments WorkItem.version by 1"] }
  - { method: POST, path: "/work-items/{id}/start", description: "Start/resume work (SCHEDULED|ON_HOLD|REOPENED -> IN_PROGRESS)", roles: [ContractorSupervisor], code: 200, input: [], output: WorkItem, side_effects: ["status -> IN_PROGRESS", "permit gate when requires_permit", "slip recompute when leaving ON_HOLD", "increments WorkItem.version by 1"] }
  - { method: POST, path: "/work-items/{id}/hold", description: "Place an IN_PROGRESS work item on hold; ACTIVE permits auto-suspend", roles: [ContractorSupervisor], code: 200, input: [], output: WorkItem, side_effects: ["status -> ON_HOLD", "ACTIVE permits for this item -> SUSPENDED", "slip + posture recompute when critical", "increments WorkItem.version by 1"] }
  - { method: POST, path: "/work-items/{id}/complete", description: "Complete an IN_PROGRESS work item, recording actual hours", roles: [ContractorSupervisor], code: 200, input: [actual_hours], output: WorkItem, side_effects: ["status -> COMPLETE", "actual_hours/remaining_hours recorded", "committed recompute", "increments WorkItem.version by 1"] }
  - { method: POST, path: "/work-items/{id}/verify", description: "Verify completed work; outcome VERIFIED (terminal) or REOPENED (rework loop)", roles: [OperationsRep], code: 200, input: [outcome], output: WorkItem, side_effects: ["status -> VERIFIED or REOPENED", "committed recompute on REOPENED", "increments WorkItem.version by 1"] }
  - { method: GET, path: "/work-items/{id}/permits", description: "List permits covering a work item", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: "Permit[]", side_effects: [] }
  - { method: GET, path: "/work-items/{id}/discoveries", description: "List discoveries whose origin is this work item", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: "DiscoveryWork[]", side_effects: [] }
  - { method: GET, path: "/work-items/{id}/punch-items", description: "List punch items on this work item", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: "PunchItem[]", side_effects: [] }
  # --- Contractors & workers ---
  - { method: POST, path: "/turnarounds/{id}/contractors", description: "Invite a contractor (turnaround SCOPE_FROZEN or later, pre-terminal)", roles: [TurnaroundManager], code: 201, input: [name, craft, headcount_cap], output: Contractor, side_effects: ["mobilization_status=INVITED, badged_headcount=0"] }
  - { method: GET, path: "/turnarounds/{id}/contractors", description: "List contractors of a turnaround", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: ["limit?", "offset?"], output: "Contractor[]", side_effects: [] }
  - { method: GET, path: "/contractors/{id}", description: "Get a contractor", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: Contractor, side_effects: [] }
  - { method: POST, path: "/contractors/{id}/mobilize", description: "Advance mobilization one step (INVITED->MOBILIZING->MOBILIZED->DEMOBILIZED); acting supervisor must own the contractor", roles: [ContractorSupervisor], code: 200, input: [], output: Contractor, side_effects: ["mobilization step per machine", "MOBILIZED->DEMOBILIZED debadges workers and cancels their ASSIGNED assignments", "increments Contractor.version by 1"] }
  - { method: POST, path: "/contractors/{id}/workers", description: "Register a worker under a contractor (ownership-checked)", roles: [ContractorSupervisor], code: 201, input: [full_name, trade], output: Worker, side_effects: ["badge_status=REGISTERED"] }
  - { method: GET, path: "/contractors/{id}/workers", description: "List workers of a contractor", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: ["badge_status?", "limit?", "offset?"], output: "Worker[]", side_effects: [] }
  - { method: GET, path: "/contractors/{id}/daily-reports", description: "List daily reports filed by a contractor", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: ["status?", "limit?", "offset?"], output: "DailyReport[]", side_effects: [] }
  - { method: GET, path: "/workers/{id}", description: "Get a worker", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: Worker, side_effects: [] }
  - { method: POST, path: "/workers/{id}/vet", description: "Vet a REGISTERED worker", roles: [PermitCoordinator], code: 200, input: [], output: Worker, side_effects: ["badge_status -> VETTED", "increments Worker.version by 1"] }
  - { method: POST, path: "/workers/{id}/badge", description: "Badge a VETTED worker (headcount cap enforced)", roles: [PermitCoordinator], code: 200, input: [], output: Worker, side_effects: ["badge_status -> BADGED", "Contractor.badged_headcount += 1", "increments Worker.version by 1"] }
  - { method: POST, path: "/workers/{id}/badge-transition", description: "Suspend/reinstate/debadge a worker; DEBADGED cascades to cancel ASSIGNED assignments", roles: [PermitCoordinator], code: 200, input: [to], output: Worker, side_effects: ["badge_status per machine", "DEBADGED cancels ASSIGNED assignments and decrements badged_headcount", "BADGED (reinstate) increments badged_headcount with cap check", "increments Worker.version by 1"] }
  - { method: GET, path: "/workers/{id}/assignments", description: "List assignments of a worker", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: "ShiftAssignment[]", side_effects: [] }
  # --- Shifts & assignments ---
  - { method: POST, path: "/turnarounds/{id}/shifts", description: "Plan a shift", roles: [Planner], code: 201, input: [shift_date, shift_type, starts_at, ends_at, planned_headcount], output: Shift, side_effects: ["status=PLANNED"] }
  - { method: GET, path: "/turnarounds/{id}/shifts", description: "List shifts of a turnaround", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: ["shift_type?", "status?", "limit?", "offset?"], output: "Shift[]", side_effects: [] }
  - { method: GET, path: "/shifts/{id}", description: "Get a shift", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: Shift, side_effects: [] }
  - { method: GET, path: "/shifts/{id}/work-items", description: "List work items scheduled into this shift", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: "WorkItem[]", side_effects: [] }
  - { method: POST, path: "/shifts/{id}/lock", description: "Lock a PLANNED shift (requires at least one ASSIGNED assignment)", roles: [Planner], code: 200, input: [], output: Shift, side_effects: ["status -> LOCKED", "increments Shift.version by 1"] }
  - { method: POST, path: "/shifts/{id}/assignments", description: "Assign a worker to a PLANNED shift (badge, fatigue, overlap, rest-gap, headcount gates)", roles: [Planner, ContractorSupervisor], code: 201, input: [worker_id, planned_hours], output: ShiftAssignment, side_effects: ["status=ASSIGNED", "Worker fatigue fields recompute"] }
  - { method: GET, path: "/shifts/{id}/assignments", description: "List assignments of a shift", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: "ShiftAssignment[]", side_effects: [] }
  - { method: POST, path: "/assignments/{id}/complete", description: "Complete an ASSIGNED assignment with actual hours", roles: [ContractorSupervisor], code: 200, input: [actual_hours], output: ShiftAssignment, side_effects: ["status -> COMPLETED", "Worker.total_shift_hours += actual_hours; fatigue recompute", "increments ShiftAssignment.version by 1"] }
  - { method: POST, path: "/assignments/{id}/cancel", description: "Cancel an ASSIGNED assignment (compensates the assignment)", roles: [Planner, ContractorSupervisor], code: 200, input: [], output: ShiftAssignment, side_effects: ["status -> CANCELLED", "Worker fatigue recompute", "increments ShiftAssignment.version by 1"] }
  # --- Permits & isolations ---
  - { method: POST, path: "/turnarounds/{id}/isolations", description: "Plan an equipment isolation (closed-interval, mode-conditional conflict check)", roles: [PermitCoordinator], code: 201, input: [equipment_tag, isolation_mode, isolated_from, isolated_until], output: Isolation, side_effects: ["status=PLANNED"] }
  - { method: GET, path: "/turnarounds/{id}/isolations", description: "List isolations of a turnaround", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: ["equipment_tag?", "status?", "limit?", "offset?"], output: "Isolation[]", side_effects: [] }
  - { method: GET, path: "/isolations/{id}", description: "Get an isolation", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: Isolation, side_effects: [] }
  - { method: POST, path: "/isolations/{id}/transition", description: "Move isolation PLANNED->ISOLATED->VERIFIED->DEISOLATED (de-isolation blocked while referenced by a live permit)", roles: [PermitCoordinator], code: 200, input: [to], output: Isolation, side_effects: ["status per machine", "increments Isolation.version by 1"] }
  - { method: GET, path: "/isolations/{id}/permits", description: "List permits whose required_isolation_ids include this isolation", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: "Permit[]", side_effects: [] }
  - { method: POST, path: "/work-items/{id}/permits", description: "Request a permit-to-work covering a scoped work item", roles: [PermitCoordinator], code: 201, input: [permit_type, hazard_class, valid_from, valid_until, required_isolation_ids], output: Permit, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/permits/{id}", description: "Get a permit", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: Permit, side_effects: [] }
  - { method: POST, path: "/permits/{id}/transition", description: "Move permit per machine (ISSUED/ACTIVE/SUSPENDED/CLOSED/REVOKED); REVOKED cascades a hold onto an IN_PROGRESS work item", roles: [PermitCoordinator], code: 200, input: [to], output: Permit, side_effects: ["status per machine", "REVOKED/EXPIRED cascade: covered IN_PROGRESS work item -> ON_HOLD, slip+posture recompute", "increments Permit.version by 1"] }
  # --- Discovery work & change authorization ---
  - { method: POST, path: "/turnarounds/{id}/discoveries", description: "Report discovery work (turnaround must be EXECUTION); reporter id recorded for SoD", roles: [ContractorSupervisor, TurnaroundManager], code: 201, input: ["origin_work_item_id?", description, quoted_cost_cents, quoted_hours], output: DiscoveryWork, side_effects: ["status=REPORTED, appeal_count=0, reported_by_user_id set", "eac_cost_forecast recompute (quote enters pending set)"] }
  - { method: GET, path: "/turnarounds/{id}/discoveries", description: "List discoveries of a turnaround", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: ["status?", "limit?", "offset?"], output: "DiscoveryWork[]", side_effects: [] }
  - { method: GET, path: "/discoveries/{id}", description: "Get a discovery", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: DiscoveryWork, side_effects: [] }
  - { method: GET, path: "/discoveries/{id}/work-items", description: "List addendum work items created from this discovery (0 or 1)", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: "WorkItem[]", side_effects: [] }
  - { method: POST, path: "/discoveries/{id}/triage", description: "Triage a REPORTED discovery", roles: [TurnaroundManager], code: 200, input: ["triage_note?"], output: DiscoveryWork, side_effects: ["status -> TRIAGED", "increments DiscoveryWork.version by 1"] }
  - { method: POST, path: "/discoveries/{id}/decide", description: "Authorize (creates addendum work item, draws contingency) or reject a TRIAGED discovery; SoD enforced", roles: [TurnaroundManager], code: 200, input: [outcome, "authorized_cost_cents?"], output: DiscoveryWork, side_effects: ["AUTHORIZED: addendum WorkItem created FROZEN; committed += authorized_cost_cents; forecast/posture recompute; Turnaround.version += 1", "REJECTED: quote leaves pending set; forecast recompute", "increments DiscoveryWork.version by 1"] }
  - { method: POST, path: "/discoveries/{id}/appeal", description: "Appeal a REJECTED discovery back to TRIAGED (max 2 appeals)", roles: [ContractorSupervisor, TurnaroundManager], code: 200, input: [], output: DiscoveryWork, side_effects: ["appeal_count += 1", "quote re-enters pending set; forecast recompute", "increments DiscoveryWork.version by 1"] }
  # --- Lay-down areas & staging ---
  - { method: POST, path: "/turnarounds/{id}/laydown-areas", description: "Create a lay-down area", roles: [TurnaroundManager], code: 201, input: [name, capacity_sqm], output: LayDownArea, side_effects: ["occupied_sqm=0, status=OPEN"] }
  - { method: GET, path: "/turnarounds/{id}/laydown-areas", description: "List lay-down areas of a turnaround", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: ["limit?", "offset?"], output: "LayDownArea[]", side_effects: [] }
  - { method: GET, path: "/laydown-areas/{id}", description: "Get a lay-down area", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: LayDownArea, side_effects: [] }
  - { method: POST, path: "/laydown-areas/{id}/reservations", description: "Reserve staging space (OCC on area version; aggregate capacity check, windows may overlap)", roles: [ContractorSupervisor, Planner], code: 201, input: [material_description, area_sqm, window_from, window_until, expected_laydown_area_version], output: StagingReservation, side_effects: ["status=RESERVED", "LayDownArea.occupied_sqm += area_sqm", "increments LayDownArea.version by 1"] }
  - { method: GET, path: "/laydown-areas/{id}/reservations", description: "List reservations of an area", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: ["status?", "limit?", "offset?"], output: "StagingReservation[]", side_effects: [] }
  - { method: POST, path: "/reservations/{id}/stage", description: "Mark reserved material physically staged", roles: [ContractorSupervisor], code: 200, input: [], output: StagingReservation, side_effects: ["status -> STAGED", "increments StagingReservation.version by 1"] }
  - { method: POST, path: "/reservations/{id}/release", description: "Release staging space (RESERVED->CANCELLED or STAGED->RELEASED); compensates the reservation", roles: [ContractorSupervisor], code: 200, input: [], output: StagingReservation, side_effects: ["status per machine", "LayDownArea.occupied_sqm -= area_sqm", "increments LayDownArea.version by 1 and StagingReservation.version by 1"] }
  # --- Daily cost/progress reports ---
  - { method: POST, path: "/turnarounds/{id}/daily-reports", description: "Draft a daily labor report (one per contractor per date; workers/shifts must belong to this turnaround and contractor)", roles: [ContractorSupervisor], code: 201, input: [report_date, lines], output: DailyReport, side_effects: ["status=DRAFT, contractor_id from X-User-ID"] }
  - { method: GET, path: "/turnarounds/{id}/daily-reports", description: "List daily reports of a turnaround", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: ["status?", "contractor_id?", "limit?", "offset?"], output: "DailyReport[]", side_effects: [] }
  - { method: GET, path: "/daily-reports/{id}", description: "Get a daily report", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: DailyReport, side_effects: [] }
  - { method: POST, path: "/daily-reports/{id}/submit", description: "Submit a DRAFT report; computes per-line costs, labor total, overhead, grand total", roles: [ContractorSupervisor], code: 200, input: [], output: DailyReport, side_effects: ["shift_labor_cost per line", "daily_report_total", "overhead_allocation", "submitted_by_user_id set", "increments DailyReport.version by 1"] }
  - { method: POST, path: "/daily-reports/{id}/approve", description: "Approve a SUBMITTED report (approver != submitter); posts to the turnaround cost ledger", roles: [CostController], code: 200, input: [], output: DailyReport, side_effects: ["status -> APPROVED", "Turnaround.reported_cost_cents += total_cost_cents; forecast/posture recompute", "increments DailyReport.version by 1 and Turnaround.version by 1"] }
  - { method: POST, path: "/daily-reports/{id}/reject", description: "Reject a SUBMITTED report back to DRAFT (no ledger effect)", roles: [CostController], code: 200, input: ["reason?"], output: DailyReport, side_effects: ["status -> DRAFT", "increments DailyReport.version by 1"] }
  - { method: POST, path: "/daily-reports/{id}/void", description: "Void the latest APPROVED report for its contractor (compensates the ledger posting)", roles: [CostController], code: 200, input: [], output: DailyReport, side_effects: ["status -> VOIDED", "Turnaround.reported_cost_cents -= total_cost_cents; forecast/posture recompute", "increments DailyReport.version by 1 and Turnaround.version by 1"] }
  # --- Punch list & handover ---
  - { method: POST, path: "/turnarounds/{id}/punch-items", description: "Raise a punch item on a COMPLETE or VERIFIED work item (turnaround EXECUTION or STARTUP)", roles: [OperationsRep, ContractorSupervisor], code: 201, input: [work_item_id, category, description], output: PunchItem, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/turnarounds/{id}/punch-items", description: "List punch items of a turnaround", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: ["category?", "status?", "limit?", "offset?"], output: "PunchItem[]", side_effects: [] }
  - { method: GET, path: "/punch-items/{id}", description: "Get a punch item", roles: [TurnaroundManager, Planner, PermitCoordinator, ContractorSupervisor, CostController, OperationsRep], code: 200, input: [], output: PunchItem, side_effects: [] }
  - { method: POST, path: "/punch-items/{id}/ready", description: "Mark an OPEN or REOPENED punch item ready for verification", roles: [ContractorSupervisor], code: 200, input: [], output: PunchItem, side_effects: ["status -> READY", "increments PunchItem.version by 1"] }
  - { method: POST, path: "/punch-items/{id}/verify", description: "Verify (close) or reopen a READY punch item", roles: [OperationsRep], code: 200, input: [outcome], output: PunchItem, side_effects: ["status -> VERIFIED or REOPENED", "increments PunchItem.version by 1"] }
  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving). Startup default before any call is exactly 2026-05-01T00:00:00Z; the server never falls back to wall-clock time", roles: [TurnaroundManager], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock set; permit windows, run-ops expiry, and report_date checks read this clock"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / missing X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for the endpoint, or ContractorSupervisor X-User-ID does not own the target contractor" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, invalid enum member, non-positive quantity, window start >= end, AUTHORIZED decision without authorized_cost_cents, false/missing operations_acknowledged, report_date after current logical date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a legal state for the operation (includes scope-frozen edits and terminal-state writes)" }
  - { id: ERR_CROSS_SCOPE_REFERENCE, http: 409, condition: "Referenced resource belongs to a different turnaround, or report-line worker not employed by the submitting contractor" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: discovery decider == reporter, or report approver == submitter" }
  - { id: ERR_BADGE_NOT_CLEARED, http: 409, condition: "Worker badge_status is not BADGED (assignment or report line)" }
  - { id: ERR_FATIGUE_LIMIT, http: 409, condition: "Projected fatigue penalty score >= 20 for the candidate assignment" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 409, condition: "Work item requires_permit but no ACTIVE permit covers it" }
  - { id: ERR_ISOLATION_NOT_VERIFIED, http: 409, condition: "Required isolation not in the required status ({ISOLATED,VERIFIED} for issue; VERIFIED for activation)" }
  - { id: ERR_PERMIT_WINDOW_INVALID, http: 409, condition: "now outside [valid_from, valid_until) on activation, or now >= valid_until on issue" }
  - { id: ERR_ISOLATION_CONFLICT, http: 409, condition: "Same equipment_tag, closed-interval overlap, and at least one of the pair is EXCLUSIVE" }
  - { id: ERR_ISOLATION_IN_USE, http: 409, condition: "De-isolation blocked: a referencing permit is ISSUED, ACTIVE, or SUSPENDED" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "Worker already assigned to a shift whose half-open interval intersects the candidate" }
  - { id: ERR_REST_PERIOD_VIOLATION, http: 409, condition: "Gap between consecutive assignments' shifts < MIN_REST_HOURS (10); gap == 10 admitted" }
  - { id: ERR_SHIFT_LOCKED, http: 409, condition: "Assignments accepted only while the shift is PLANNED" }
  - { id: ERR_SHIFT_HEADCOUNT_FULL, http: 409, condition: "Non-CANCELLED assignments already equal planned_headcount" }
  - { id: ERR_EMPTY_SHIFT, http: 409, condition: "Lock requires at least one ASSIGNED assignment" }
  - { id: ERR_CONTRACTOR_HEADCOUNT_CAP, http: 409, condition: "badged_headcount already equals headcount_cap (badge/reinstate rejected at the cap)" }
  - { id: ERR_NO_BADGED_WORKERS, http: 409, condition: "MOBILIZING -> MOBILIZED requires badged_headcount >= 1" }
  - { id: ERR_NO_MOBILIZED_CONTRACTOR, http: 409, condition: "MOBILIZATION -> EXECUTION requires at least one MOBILIZED contractor" }
  - { id: ERR_WORK_ITEMS_OPEN, http: 409, condition: "EXECUTION -> STARTUP requires every scope work item VERIFIED (checked first)" }
  - { id: ERR_PERMITS_STILL_ACTIVE, http: 409, condition: "EXECUTION -> STARTUP requires no permit in {REQUESTED, ISSUED, ACTIVE, SUSPENDED} (checked second)" }
  - { id: ERR_ISOLATIONS_ENGAGED, http: 409, condition: "EXECUTION -> STARTUP requires no isolation in {PLANNED, ISOLATED, VERIFIED} (checked third)" }
  - { id: ERR_OPEN_PUNCH_ITEMS, http: 409, condition: "Handover requires zero punch items with category A in {OPEN, READY, REOPENED}" }
  - { id: ERR_DEPENDENCY_CYCLE, http: 409, condition: "Dependency would create a cycle (self-loop counts) in the turnaround's work-item DAG" }
  - { id: ERR_CONTINGENCY_EXCEEDED, http: 409, condition: "authorized_cost_cents exceeds contingency_remaining_cents" }
  - { id: ERR_APPEAL_LIMIT, http: 409, condition: "appeal_count already equals 2" }
  - { id: ERR_LAYDOWN_CAPACITY_EXCEEDED, http: 409, condition: "occupied_sqm + area_sqm would exceed capacity_sqm (equality admitted)" }
  - { id: ERR_DUPLICATE_REPORT, http: 409, condition: "A non-VOIDED DailyReport already exists for (turnaround, contractor, report_date)" }
  - { id: ERR_REPORT_SEQUENCE, http: 409, condition: "Void blocked: a later-dated APPROVED report exists for the same contractor" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TurnaroundManager
    description: "Turnaround authority: owns scope freeze, phase advances, change authorization, handover, ops runs"
    identity: opaque
    exclusive_operations:
      - "POST /turnarounds, POST /turnarounds/{id}/freeze-scope|advance|cancel|handover|run-ops"
      - "POST /turnarounds/{id}/contractors, POST /turnarounds/{id}/laydown-areas"
      - "POST /discoveries/{id}/triage|decide"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /turnarounds/{id}/discoveries, POST /discoveries/{id}/appeal (shared with ContractorSupervisor)"
      - "All GET endpoints"
  - name: Planner
    description: "Planning & scheduling: work list, dependency network, shift plan, shift assignments"
    identity: opaque
    exclusive_operations:
      - "POST /turnarounds/{id}/work-items, POST /work-items/{id}/estimate|dependencies|schedule"
      - "POST /turnarounds/{id}/shifts, POST /shifts/{id}/lock"
    shared_operations:
      - "POST /shifts/{id}/assignments, POST /assignments/{id}/cancel (shared with ContractorSupervisor)"
      - "POST /laydown-areas/{id}/reservations (shared with ContractorSupervisor)"
      - "All GET endpoints"
  - name: PermitCoordinator
    description: "Permit-to-work and isolation control; worker vetting and badging"
    identity: opaque
    exclusive_operations:
      - "POST /turnarounds/{id}/isolations, POST /isolations/{id}/transition"
      - "POST /work-items/{id}/permits, POST /permits/{id}/transition"
      - "POST /workers/{id}/vet|badge|badge-transition"
    shared_operations:
      - "All GET endpoints"
  - name: ContractorSupervisor
    description: "Contractor-side supervisor: mobilization, worker registry, field execution, reports, staging"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "POST /contractors/{id}/mobilize, POST /contractors/{id}/workers (own contractor only)"
      - "POST /work-items/{id}/start|hold|complete"
      - "POST /assignments/{id}/complete"
      - "POST /turnarounds/{id}/daily-reports, POST /daily-reports/{id}/submit (own contractor's reports)"
      - "POST /reservations/{id}/stage|release"
      - "POST /punch-items/{id}/ready"
    shared_operations:
      - "POST /shifts/{id}/assignments, POST /assignments/{id}/cancel (shared with Planner; own workers only when acting as supervisor)"
      - "POST /laydown-areas/{id}/reservations (shared with Planner)"
      - "POST /turnarounds/{id}/discoveries, POST /discoveries/{id}/appeal (shared with TurnaroundManager)"
      - "POST /turnarounds/{id}/punch-items (shared with OperationsRep)"
      - "All GET endpoints"
  - name: CostController
    description: "Cost ledger control: approves/rejects/voids daily reports (SoD vs submitter)"
    identity: opaque
    exclusive_operations:
      - "POST /daily-reports/{id}/approve|reject|void"
    shared_operations:
      - "All GET endpoints"
  - name: OperationsRep
    description: "Operations representative: verifies completed work, owns punch verification, witnesses handover"
    identity: opaque
    exclusive_operations:
      - "POST /work-items/{id}/verify"
      - "POST /punch-items/{id}/verify"
    shared_operations:
      - "POST /turnarounds/{id}/punch-items (shared with ContractorSupervisor)"
      - "All GET endpoints"
