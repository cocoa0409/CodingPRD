      - name: recommendation_window_and_issue_gates
        claim_type: violation_to_error
        grounds:
          - validations[priority 12]
          - validations[priority 30]
          - validations[priority 39]
          - errors[ERR_RECOMMENDATION_WINDOW_INVALID]
          - errors[ERR_INSUFFICIENT_SHRINK_HISTORY]
          - errors[ERR_RECOMMENDATION_NOT_ISSUABLE]
          - calculations.shrink_history_order_feedback
        distinguishing_aspect: |
          Both arms of the window rule fire: a reversed window and a 62-day window are
          ERR_RECOMMENDATION_WINDOW_INVALID (422), a legal window containing no lots is
          ERR_INSUFFICIENT_SHRINK_HISTORY (422), and none of the three refusals moves
          Item.version — only the accepted call takes it from 1 to 2, after which a second issue is
          ERR_RECOMMENDATION_NOT_ISSUABLE (409).
        test_recipe:
          setup:
            - "The MEAT base chain at clock 2026-08-10T08:00:00.000Z; one 24-unit lot created that day."
