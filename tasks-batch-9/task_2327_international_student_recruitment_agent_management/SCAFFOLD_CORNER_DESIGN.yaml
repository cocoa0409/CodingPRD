          - errors[ERR_STALE_CONTRACT_VERSION]
          - endpoints["POST /recruitment/contracts/{id}/commission-schedules"]
        distinguishing_aspect: |
          The rate-card append is OCC-guarded on AgentContract.version, and appending a card
          is itself a write that bumps that version. A client that read the contract once and
          appends twice therefore fails on the second call with ERR_STALE_CONTRACT_VERSION
          (412) even though the interval it offers tiles perfectly; re-reading the contract
          and replaying the identical body succeeds.
