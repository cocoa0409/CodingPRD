            - "Presentation.${pres_n_id}.drawn_amount_cents == 8002000"
            - "SettlementClaim.${claim_s_id}.variant_applied == SIGHT_HONOUR"
            - "SettlementClaim.${claim_s_id}.commission_bps_applied == 12"
            - "SettlementClaim.${claim_s_id}.commission_cents == 9602"
            - "SettlementClaim.${claim_s_id}.discount_cents == 0"
            - "SettlementClaim.${claim_s_id}.days_to_maturity == 0"
            - "SettlementClaim.${claim_s_id}.doc_examination_fee_cents == 7502"
            - "SettlementClaim.${claim_s_id}.net_proceeds_cents == 7984896"
            - "SettlementClaim.${claim_n_id}.variant_applied == NEGOTIATION_UNDER_DISCOUNT"
            - "SettlementClaim.${claim_n_id}.commission_bps_applied == 20"
            - "SettlementClaim.${claim_n_id}.commission_cents == 16004"
            - "SettlementClaim.${claim_n_id}.days_to_maturity == 90"
            - "SettlementClaim.${claim_n_id}.discount_cents == 90023"
            - "SettlementClaim.${claim_n_id}.doc_examination_fee_cents == 7502"
            - "SettlementClaim.${claim_n_id}.net_proceeds_cents == 7888471"
            - "${net_s} - ${net_n} == 96425"
            - "Presentation.${pres_n_id}.maturity_date == \"2026-12-13\""
            - "Presentation.${pres_s_id}.settlement_status == PAID"
            - "Presentation.${pres_n_id}.settlement_status == NEGOTIATED"

  # =======================================================================
  # RULE 2 - combinatorial_formula
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: doc_examination_fee_round_per_document_then_sum
        grounds:
          - calculations.settlement_proceeds
          - entities.SettlementClaim.fields.doc_examination_fee_cents
          - entities.PresentedDocument.fields.invoice_amount_cents
          - state_machines.Presentation.CLAIM_LODGED_to_PAID
        distinguishing_aspect: |
          MODE (b) - nested rounding where the order matters. The two invoice amounts
          3001000 and 5001000 each land on an exact half-cent at 5 bps (1500.5 and
          2500.5); rounding per document then summing gives 1501 + 2501 + 3500 = 7502,
          while summing the exact rationals then rounding once gives 4001 + 3500 = 7501.
          The scaffold pins per-document-then-sum, so 7502 is correct and 7501 is the
          falsifiable wrong answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z, then advanced to 2026-09-14T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 50000000."
            - "One SIGHT_PAYMENT credit of amount_cents 10000000, incoterm FOB, ISSUED, requiring an invoice and a bill of lading."
            - "One presentation carrying exactly three documents: invoices of 3001000 and 5001000 and one bill of lading, concluded COMPLYING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
