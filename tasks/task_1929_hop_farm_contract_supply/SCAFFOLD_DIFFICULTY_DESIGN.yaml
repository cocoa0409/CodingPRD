            - { call: "POST /api/lab-tests", payload: { harvest_lot_id: "${lot_a}", test_type: "PROVISIONAL", alpha_pct: 13.0 }, as: LabTechnician }
            - { call: "POST /api/harvest-lots", payload: { planting_plan_id: "${p_id}", wet_lbs: 1125 }, as: FarmManager, captures: { lot_b: $.data.id } }
            - { call: "POST /api/harvest-lots/${lot_b}/load-kiln", payload: { kiln_id: "${k_id}", kiln_window_start: "2026-08-20T12:30:00Z", kiln_window_end: "2026-08-20T16:00:00Z" }, as: FarmManager }
