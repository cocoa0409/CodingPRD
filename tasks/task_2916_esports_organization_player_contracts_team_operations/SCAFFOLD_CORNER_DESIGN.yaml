        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - errors[ERR_DELIVERABLE_DUE_OUTSIDE_DEAL]
          - errors[ERR_DELIVERABLE_QUOTA_EXCEEDED]
          - errors[ERR_EXCLUSIVITY_CONFLICT]
          - calculations.exclusivity_conflict
          - calculations.deliverable_fee_share
        distinguishing_aspect: |
          One endpoint, three escalating gates: due_at == deal.ends_at is already outside the
          half-open window (priority 10), the third placement on a two-item deal is refused at
