            mvr_point_threshold: 7
            rehire_cooldown_days: 180
            medical_cert_grace_days: 15
          as: SafetyDirector
          captures:
            carrier_id: $.data.id
        trigger:
        - call: GET /carriers/${carrier_id}
          payload: {}
          as: SafetyDirector
          captures:
            carrier_v: $.data.version
        - call: PATCH /carriers/${carrier_id}
          payload:
            safety_rating: CONDITIONAL
            expected_carrier_version: ${carrier_v}
          as: SafetyDirector
          captures:
            carrier_v2: $.data.version
        - call: PATCH /carriers/${carrier_id}
          payload:
            safety_rating: UNSATISFACTORY
            expected_carrier_version: ${carrier_v2}
          as: SafetyDirector
        assert:
        - 'After the CONDITIONAL patch: Carrier.${carrier_id}.posture == OPEN and version == ${carrier_v} + 1'
        - 'After the UNSATISFACTORY patch: Carrier.${carrier_id}.posture == FROZEN and version == ${carrier_v} + 2'
        - Carrier.${carrier_id}.filled_requisitions == 0 and deficiency_ratio == 0.0 throughout
