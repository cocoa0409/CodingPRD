# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — car-sharing
# Breadth probe over §1.1-§1.7. Instances covered by §1.8 are emitted as
# excluded_because stubs (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: create_host_returns_201_active
        claim_type: creation
        grounds: ["entities.Host", "endpoints.\"POST /hosts\""]
        distinguishing_aspect: "POST /hosts with name+email returns 201 with server-minted id, status=ACTIVE, and zeroed ledger fields."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /hosts", payload: { name: "Host AA", email: "haa@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
          assert:
            - "Host.${host_id}.status == ACTIVE"
            - "Host.${host_id}.pending_balance_cents == 0"
            - "Host.${host_id}.available_balance_cents == 0"
            - "Host.${host_id}.version == 1"

      - name: get_vehicle_not_found
        claim_type: not_found
        grounds: ["entities.Vehicle", "errors[ERR_VEHICLE_NOT_FOUND]"]
        distinguishing_aspect: "GET /vehicles/{unknown-uuid} returns ERR_VEHICLE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /vehicles/00000000-0000-0000-0000-0000000000ff", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VEHICLE_NOT_FOUND"
            - "http status == 404"

      - name: create_vehicle_missing_required_field_rejected
        claim_type: required_fields
        grounds: ["entities.Vehicle.fields.base_daily_price_cents", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /vehicles omitting the required base_daily_price_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A registered host."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host AB", email: "hab@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
          trigger:
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, location_city: "SF" }, as: Host, as_user_id: "${host_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "http status == 400"

      - name: vehicle_computed_booked_nights_defaults_zero
        claim_type: computed_fields
        grounds: ["entities.Vehicle.fields.booked_night_count"]
        distinguishing_aspect: "A newly created vehicle has computed booked_night_count == 0 and completed_trip_count == 0 regardless of any input."
        test_recipe:
          setup: ["A registered host."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host AC", email: "hac@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
          trigger:
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF" }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
          assert:
            - "Vehicle.${vehicle_id}.booked_night_count == 0"
            - "Vehicle.${vehicle_id}.completed_trip_count == 0"
            - "Vehicle.${vehicle_id}.status == DRAFT"

      - name: list_vehicles_pagination_envelope
        claim_type: listing
        grounds: ["endpoints.\"GET /vehicles\"", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /vehicles returns an array response with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["A host with one vehicle."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host AD", email: "had@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF" }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
          trigger:
            - { call: "GET /vehicles", payload: { host_id: "${host_id}" }, as: PlatformAdmin }
          assert:
            - "response_type == array"
            - "meta/pagination includes total_count == 1 and has_more == false"

  # ------------------------------------------------------------ State machines
  - section: state_machines
    instances:
      - name: approve_already_confirmed_trip_invalid
        claim_type: invalid_transition
        grounds: ["state_machines.Trip.REQUESTED_to_CONFIRMED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a Trip already in CONFIRMED returns ERR_INVALID_STATE (409); no second pending credit is applied."
        test_recipe:
          setup: ["A CONFIRMED trip."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host BA", email: "hba@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest BA", email: "gba@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-21", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF" }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
            - { call: "POST /trips/${trip_id}/approve", payload: {}, as: Host, as_user_id: "${host_id}" }
          trigger:
            - { call: "POST /trips/${trip_id}/approve", payload: {}, as: Host, as_user_id: "${host_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: checkin_from_requested_invalid
        claim_type: invalid_transition
        grounds: ["state_machines.Trip.CONFIRMED_to_CHECKED_IN", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Checking in a REQUESTED (not-yet-approved) trip returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A REQUESTED trip (never approved)."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host BB", email: "hbb@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest BB", email: "gbb@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-22", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF" }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
          trigger:
            - { call: "POST /trips/${trip_id}/check-in", payload: { odometer_reading: 10000, fuel_level_pct: 100, photo_refs: ["in1"] }, as: Guest, as_user_id: "${guest_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: cancel_completed_trip_terminal_locked
        claim_type: terminal_lockdown
        grounds: ["state_machines.Trip.CHECKED_OUT_to_COMPLETED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) trip returns ERR_INVALID_STATE (409); no ledger movement occurs."
        test_recipe:
          setup: ["A COMPLETED trip."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host BC", email: "hbc@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest BC", email: "gbc@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-23", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF", odometer_current: 10000 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
            - { call: "POST /trips/${trip_id}/approve", payload: {}, as: Host, as_user_id: "${host_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /trips/${trip_id}/check-in", payload: { odometer_reading: 10000, fuel_level_pct: 100, photo_refs: ["in1"] }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-08T09:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /trips/${trip_id}/check-out", payload: { odometer_reading: 10500, fuel_level_pct: 100, photo_refs: ["out1"] }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /trips/${trip_id}/complete", payload: {}, as: Host, as_user_id: "${host_id}" }
          trigger:
            - { call: "POST /trips/${trip_id}/cancel", payload: { reason: "too late" }, as: Host, as_user_id: "${host_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: guest_double_verify_idempotency_rejected
        claim_type: idempotency
        grounds: ["state_machines.Guest.PENDING_REVIEW_to_VERIFIED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Verifying an already-VERIFIED guest returns ERR_INVALID_STATE (409); verification is not idempotently re-applied."
        test_recipe:
          setup: ["A VERIFIED guest."]
          setup_api_calls:
            - { call: "POST /guests", payload: { name: "Guest BD", email: "gbd@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-24", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "http status == 409"

      - name: vehicle_snooze_then_relist_valid
        claim_type: valid_transition
        grounds: ["state_machines.Vehicle.LISTED_to_SNOOZED", "state_machines.Vehicle.SNOOZED_to_LISTED"]
        distinguishing_aspect: "A LISTED vehicle can be snoozed then re-listed; final status is LISTED and version has incremented on each transition."
        test_recipe:
          setup: ["A LISTED vehicle."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host BE", email: "hbe@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF" }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}" }
            - { call: "POST /vehicles/${vehicle_id}/snooze", payload: {}, as: Host, as_user_id: "${host_id}" }
          trigger:
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}" }
          assert:
            - "Vehicle.${vehicle_id}.status == LISTED"
            - "Vehicle.${vehicle_id}.version == 4"

  # -------------------------------------------------------------- Calculations
  - section: calculations
    instances:
      - name: monthly_discount_selected_over_weekly
        claim_type: correct_result
        grounds: ["calculations.estimated_trip_settlement", "entities.Trip.fields.discounted_subtotal_cents"]
        distinguishing_aspect: "A 28-night trip selects the monthly discount 0.25 (not weekly): floor(280000*0.75)=210000, proving the higher threshold wins."
        test_recipe:
          setup: ["Verified guest, STANDARD plan, LISTED vehicle base 10000; booking 2026-06-01..2026-06-29 (28 nights)."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host CA", email: "hca@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest CA", email: "gca@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-25", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF" }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
          trigger:
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-29", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
          assert:
            - "Trip.${trip_id}.nights == 28"
            - "Trip.${trip_id}.discounted_subtotal_cents == 210000"
            - "Trip.${trip_id}.protection_premium_cents == 70000"
            - "Trip.${trip_id}.estimated_total_cents == 280000"

      - name: pricing_rule_override_applied_to_nights
        claim_type: correct_result
        grounds: ["calculations.estimated_trip_settlement", "entities.PricingRule.fields.daily_price_cents"]
        distinguishing_aspect: "An ACTIVE PricingRule of 20000 covering 2026-06-01..06-03 overrides the base 10000 for a 3-night trip: subtotal 60000 (no length discount below 7 nights)."
        test_recipe:
          setup: ["LISTED vehicle base 10000 with an ACTIVE pricing rule 2026-06-01..2026-06-03 at 20000/night; verified guest."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host CB", email: "hcb@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest CB", email: "gcb@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-26", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF" }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /pricing-rules", payload: { vehicle_id: "${vehicle_id}", start_date: "2026-06-01", end_date: "2026-06-03", daily_price_cents: 20000 }, as: Host, as_user_id: "${host_id}", captures: { rule_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
          trigger:
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-04", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
          assert:
            - "Trip.${trip_id}.nights == 3"
            - "Trip.${trip_id}.discounted_subtotal_cents == 60000"
            - "Trip.${trip_id}.estimated_total_cents == 67500"

      - name: late_return_fee_applied
        claim_type: correct_result
        grounds: ["calculations.final_trip_settlement", "entities.Trip.fields.late_fee_cents", "entities.Guest.fields.late_return_count"]
        distinguishing_aspect: "Returning at 2026-06-10T12:00Z vs scheduled 2026-06-08T11:00Z with 2h grace yields late_days=2 and late_fee=2*floor(10000*1.5)=30000; Guest.late_return_count increments."
        test_recipe:
          setup: ["CHECKED_IN 7-night trip (checkin odo 10000, fuel 100); clock advanced to a late return time at check-out."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host CC", email: "hcc@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest CC", email: "gcc@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
            - { call: "POST /guests/${guest_id}/submit-verification", payload: { license_number: "DL-27", license_state: "CA", license_expiry_date: "2030-01-01" }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /guests/${guest_id}/verify", payload: {}, as: PlatformAdmin }
            - { call: "POST /protection-plans", payload: { tier: "STANDARD", deductible_cents: 100000, daily_premium_cents: 2500, coverage_limit_cents: 1500000, host_earnings_pct: 0.8 }, as: PlatformAdmin, captures: { plan_id: "$.data.id" } }
            - { call: "POST /vehicles", payload: { host_id: "${host_id}", make: "Toyota", model: "Corolla", year: 2022, base_daily_price_cents: 10000, location_city: "SF", odometer_current: 10000 }, as: Host, as_user_id: "${host_id}", captures: { vehicle_id: "$.data.id" } }
            - { call: "POST /vehicles/${vehicle_id}/list", payload: {}, as: Host, as_user_id: "${host_id}", captures: { vehicle_v: "$.data.version" } }
            - { call: "POST /trips", payload: { vehicle_id: "${vehicle_id}", guest_id: "${guest_id}", protection_plan_id: "${plan_id}", start_date: "2026-06-01", end_date: "2026-06-08", expected_vehicle_version: "${vehicle_v}" }, as: Guest, as_user_id: "${guest_id}", captures: { trip_id: "$.data.id" } }
            - { call: "POST /trips/${trip_id}/approve", payload: {}, as: Host, as_user_id: "${host_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /trips/${trip_id}/check-in", payload: { odometer_reading: 10000, fuel_level_pct: 100, photo_refs: ["in1"] }, as: Guest, as_user_id: "${guest_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T12:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /trips/${trip_id}/check-out", payload: { odometer_reading: 10500, fuel_level_pct: 100, photo_refs: ["out1"] }, as: Guest, as_user_id: "${guest_id}" }
          assert:
            - "Trip.${trip_id}.late_days == 2"
            - "Trip.${trip_id}.late_fee_cents == 30000"
            - "Trip.${trip_id}.final_total_cents == 110500"
            - "Guest.${guest_id}.late_return_count == 1"

      - name: claim_coverage_cap_uncovered_remainder
        claim_type: correct_result
        grounds: ["calculations.claim_settlement", "entities.Claim.fields.uncovered_cents"]
        distinguishing_aspect: "Damage 2000000 above coverage 1500000: covered caps at 1500000, host_recovery 1500000, guest_deductible 100000, uncovered 500000 — the coverage-cap branch of the nested-min formula."
        test_recipe:
          setup: ["A CHECKED_OUT trip on STANDARD plan; host claim for 2000000 that is UNDER_REVIEW."]
          setup_api_calls:
            - { call: "POST /hosts", payload: { name: "Host CD", email: "hcd@x.com" }, as: Anonymous, captures: { host_id: "$.data.id" } }
            - { call: "POST /guests", payload: { name: "Guest CD", email: "gcd@x.com" }, as: Anonymous, captures: { guest_id: "$.data.id" } }
