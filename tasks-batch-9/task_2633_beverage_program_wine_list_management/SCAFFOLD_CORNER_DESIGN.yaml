      - name: sommelier_owns_venue_writes_and_peers_cannot_reach_them
        claim_type: Peer Isolation
        grounds:
          - rbac[VenueSommelier].exclusive_operations
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_VENUE_SCOPE_VIOLATION]
          - validations[priority 3]
          - validations[priority 4]
        distinguishing_aspect: >-
          The sommelier's writes are refused for two different reasons that must not be conflated: a
          wrong role gets ERR_FORBIDDEN_ROLE at priority 3, while the RIGHT role at the WRONG venue gets
          ERR_VENUE_SCOPE_VIOLATION at priority 4 — and the latter fires before the body FK on wine_id
          is even resolved, so a sommelier of venue B cannot probe venue A's list with a bogus wine id.
