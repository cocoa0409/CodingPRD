            - "BudgetLine.${v_bl_id}.variance_decided_by_user_id == risk-rita after the successful decision"
            - "Show.${v_sh_id}.budget_posture == OVER_BUDGET and Show.${v_sh_id}.breakeven_cents == 1250000 == 1000000 + MIN(250000, expense_cap 1000000) after the successful decision"

  # =====================================================================
  # RULE 6 — boundary_precision_check
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: variance_pct_at_exactly_ten_percent_stays_within_tolerance
        grounds:
          - "calculations.budget_line_variance_recognition"
          - "entities.BudgetLine.fields.variance_pct"
          - "entities.BudgetLine.fields.required_approver_role"
          - "state_machines.BudgetLine.WITHIN_TOLERANCE_to_PENDING_APPROVAL"
          - "endpoints[POST /vendor-invoices/{vendor_invoice_id}/approve]"
        distinguishing_aspect: |
          METRIC: BudgetLine.variance_pct against VARIANCE_TOLERANCE_PCT 10.00, probed through
          POST /vendor-invoices/{vendor_invoice_id}/approve. Three lines with identical
          budgeted_cents 1500000 are driven to actual 1650000 (exactly 10.00 -> stays
          WITHIN_TOLERANCE because the band is <=, not <), 1650074 (raw 10.004933% which
          ROUND_HALF_UP at two decimals collapses to 10.00, so it ALSO stays within tolerance —
          the band compares the ROUNDED value, not the raw ratio) and 1651000 (10.07 -> escalates).
          The 1650074 case is the precision half of the claim: an implementation comparing the
          unrounded ratio escalates it and fails.
