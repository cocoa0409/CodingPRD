              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Nia Author", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { author_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Val Verifier", role_type: "ANESTHESIA_MONITOR", monitoring_certified: true }
              as: PracticeAdministrator
              captures: { verif_id: $.data.id }
            - call: "POST /anesthesia-permits"
