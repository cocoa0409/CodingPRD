          - state_machines.DiscrepancyCase
        distinguishing_aspect: "The declared model is immediate, so the substantiate response itself must already reflect the derived facility posture, and reads issued straight afterwards must show the sibling submission reverted with its new FATAL finding — no settling delay."
        test_recipe:
          setup:
