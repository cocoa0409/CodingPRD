            - { call: "POST /completion/delay-events", payload: { program_id: "${prog_id}", category: "CENTER_CAUSED", impact_days: 6, reason: "paint booth downtime" }, as: ProgramManager, captures: { ev2: $.data.id, seq2: $.data.event_seq } }
          trigger:
            - { call: "POST /completion/delay-events/${ev1}/confirm", payload: {}, as: CenterAdmin }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { cdd1: $.data.committed_delivery_date } }
            - { call: "POST /completion/delay-events/${ev2}/confirm", payload: {}, as: CenterAdmin }
            - { call: "GET /completion/programs/${prog_id}", as: ProgramManager, captures: { cdd2: $.data.committed_delivery_date } }
          assert:
