      - call: POST /dropship/vendors/${v1_id}/activate
        payload: {}
        as: MerchandiseManager
        as_user_id: mm-activator-V1
        captures:
          v1_ver: $.data.version
      trigger:
      - call: POST /dropship/items
        payload:
          vendor_id: ${v1_id}
          sku: SKU-COMPUTED-1
          unit_retail_cents: 24999
          ship_method: GROUND
          lead_time_days: 3
          unit_cost_cents: 1
        as: MerchandiseManager
        captures:
          icp_id: $.data.id
      assert:
      - DropshipItem.${icp_id}.unit_cost_cents == 21249
      - DropshipItem.${icp_id}.unit_cost_cents != 1 (the client-supplied value is ignored)
      - DropshipItem.${icp_id}.unit_retail_cents == 24999
      - DropshipItem.${icp_id}.status == DRAFT
  - name: corner_order_system_fields_generated_and_client_extra_field_ignored
