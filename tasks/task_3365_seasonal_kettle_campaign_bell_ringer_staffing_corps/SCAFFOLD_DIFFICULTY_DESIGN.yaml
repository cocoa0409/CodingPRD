              as: PlatformAdmin
              captures: { campaign_id: "$.data.id" }
            - call: "POST /api/host-sites"
              payload: { campaign_id: "${campaign_id}", retailer_name: "Northgate Market", store_number: "114", city: "Springfield", state_code: "IL", permission_starts_on: "2026-11-01T00:00:00Z", permission_ends_on: "2026-12-24T23:59:59Z", exclusivity_scope: "NON_EXCLUSIVE", max_kettles: 3 }
              as: KettleCoordinator
              captures: { host_id: "$.data.id", host_v: "$.data.version" }
            - call: "POST /api/host-sites/${host_id}/approve"
              payload: { decision: "APPROVE", expected_host_site_version: "${host_v}" }
              as: KettleCoordinator
