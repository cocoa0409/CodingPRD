      - name: corner_error_second_scoring_reports_review_state_invalid
        claim_type: "Violation → Error"
        grounds:
          - errors.ERR_REVIEW_STATE_INVALID
          - state_machines.PostCrisisReview.OPEN_to_SCORED
        distinguishing_aspect: "SCORED is terminal for the post-crisis ledger, so a second score cannot overwrite reported_delta with the other variant — the reputation record is write-once even though both variants remain stored side by side."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "SEV3 incident ACTIVATED with no notices, claims or interviews, reputation_index_before 90.00, then RESOLVED at 2026-08-10T13:00:00Z with reputation_index_after 82.60."
            - "The resolve cascade opened one PostCrisisReview; exposure_factor is 0.0000 because total_claim_count is 0, so RAW and ADJUSTED both read -7.40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
