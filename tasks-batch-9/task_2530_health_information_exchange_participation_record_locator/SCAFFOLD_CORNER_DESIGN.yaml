            - "${errV8_a} == ERR_JUSTIFICATION_TOO_SHORT: the 21-character note is below BREAK_GLASS_JUSTIFICATION_MIN_CHARS 40"
            - "${bgV8_2_review} == UNDER_REVIEW: the refused decision left the review dimension untouched"
            - "${errV8_b} == ERR_JUSTIFICATION_TOO_SHORT: the 20-character justification_text is refused at creation"
            - "${pV8_points} == 0"
            - "${pV8_status} == CERTIFIED"
      - name: reconciled_issuance_requires_the_sample_set_its_own_calculation_consumes
        claim_type: Cascading validation
        grounds:
          - validations.priority_34
          - errors.ERR_NO_RECONCILIATION_BASIS
          - calculations.participation_fee.input_set
          - calculations.participation_fee.constants.QUALITY_MULTIPLIER
        distinguishing_aspect: |
          Check B (deriving the qualifying FeedQualitySample set for the billing period) must run before
          check A (priority 34) can decide anything, and the same derived set then feeds the RECONCILED
          fee. With no samples the issuance is refused with ERR_NO_RECONCILIATION_BASIS; after one
          in-period sample of 8000 messages the identical request succeeds at 8000 x 1.75 == 14000 plus
          250000, times the grade-A multiplier 0.95, for exactly 250800 cents - a figure that is joint
          proof that the sample set was found, that the grade was read at issuance and
          that the multiplier was applied after the tier waterfall.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with declared_annual_patient_volume 120000 and one ADT feed."
            - "The clock is advanced to 2026-09-01T00:00:00Z so that the August period has elapsed."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Ironvale Community Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 120000, primary_contact_email: "hie@ironvale.example" }
              as: HieAdmin
              captures: { pV9_id: $.data.id }
            - call: "POST /hie/participants/${pV9_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pV9_id}"
            - call: "POST /hie/participants/${pV9_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pV9_ver: $.data.version }
            - call: "POST /hie/participants/${pV9_id}/data-feeds"
              payload: { feed_type: "ADT", expected_participant_version: "${pV9_ver}" }
              as: HieAdmin
              captures: { feedV9_id: $.data.id }
            - call: "POST /hie/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HieAdmin
          trigger:
            - call: "POST /hie/participants/${pV9_id}/participation-invoices"
              payload: { billing_period_start: "2026-08-01T00:00:00Z", billing_period_end: "2026-09-01T00:00:00Z", basis_variant: "RECONCILED", due_date: "2026-09-15T00:00:00Z" }
              as: HieAdmin
              captures: { errV9: $.data.error_id }
            - call: "POST /hie/data-feeds/${feedV9_id}/quality-samples"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", messages_received: 8000, messages_rejected: 100, required_fields_missing_count: 200, duplicate_count: 50, timeliness_p95_seconds: 250 }
              as: HieAdmin
              captures: { sampV9_id: $.data.id }
            - call: "GET /hie/participants/${pV9_id}/scorecard"
              payload: {}
              as: HieAdmin
              captures: { scV9_score: $.data.quality_score, scV9_grade: $.data.grade }
            - call: "POST /hie/participants/${pV9_id}/participation-invoices"
              payload: { billing_period_start: "2026-08-01T00:00:00Z", billing_period_end: "2026-09-01T00:00:00Z", basis_variant: "RECONCILED", due_date: "2026-09-15T00:00:00Z" }
              as: HieAdmin
              captures: { invV9_id: $.data.id, invV9_volume: $.data.volume_fee_cents, invV9_total: $.data.total_cents, invV9_units: $.data.billable_volume_units, invV9_mult: $.data.quality_multiplier, invV9_basis: $.data.basis_variant, invV9_status: $.data.status }
          assert:
            - "${errV9} == ERR_NO_RECONCILIATION_BASIS"
            - "${scV9_score} == 98.78"
            - "${scV9_grade} == A"
            - "${invV9_units} == 8000"
            - "${invV9_volume} == 14000"
            - "${invV9_mult} == 0.95"
            - "${invV9_total} == 250800"
            - "${invV9_basis} == RECONCILED"
            - "${invV9_status} == ISSUED"
      - name: state_check_outranks_the_break_glass_session_check
        claim_type: Priority Ordering
        grounds:
          - validations.priority_12
          - validations.priority_17
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suspended_participant_citing_closed_session_returns_not_certified_not_session_error
          rationale: "That instance violates priorities 12 and 17 in one request and asserts ERR_PARTICIPANT_NOT_CERTIFIED, then repairs the state to expose ERR_BREAK_GLASS_SESSION_NOT_OPEN."
      - name: referential_conformance_check_outranks_the_fiscal_delinquency_check
        claim_type: Priority Ordering
        grounds:
