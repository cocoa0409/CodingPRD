# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3484_immigration_court_docket_management_case_completion
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Shared fixture anchors (&c_*) are defined on first use and aliased later.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: court_create_returns_computed_backlog_fields
        claim_type: Creation
        grounds:
          - entities.Court
          - endpoints.POST_/eoir/courts
        distinguishing_aspect: "A court created with the five required inputs returns 201 with the inputs echoed plus computed pending_case_count 0, completions_ytd 0, is_backlog_critical false, version 1, and system id/created_at/updated_at."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &c_clock
              call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - &c_court
              call: "POST /eoir/courts"
              payload: { court_code: "CT-STD", name: "Standard Court", city: "Omaha", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Court.${court_id}.court_code == \"CT-STD\" and annual_completion_goal == 100 and detained_daily_hearing_capacity == 2"
            - "Court.${court_id}.pending_case_count == 0 and completions_ytd == 0 and is_backlog_critical == false"
            - "Court.${court_id}.version == 1 and id/created_at/updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: case_create_applies_defaults_and_system_fields
        claim_type: Defaults
        grounds:
          - entities.Case.fields.interpreter_required
          - entities.Case.fields.status
          - entities.Case.fields.filed_at
        distinguishing_aspect: "Omitting interpreter_required stores the default true; the system pins status FILED, assigned_judge_id null, filed_at equal to the logical clock, and target_completion_date exactly 365 days later for NON_DETAINED."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One court."]
          setup_api_calls:
            - *c_clock
            - *c_court
          trigger:
            - &c_case
              call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "S-1", respondent_full_name: "R Std", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Case.${case_id}.interpreter_required == true (default applied — field omitted from the request)"
            - "Case.${case_id}.status == FILED and assigned_judge_id is null and completed_at is null"
            - "Case.${case_id}.filed_at == \"2026-09-01T00:00:00Z\" (logical clock, not wall clock)"
            - "Case.${case_id}.target_completion_date == \"2027-09-01T00:00:00Z\" (filed + 365 days, NON_DETAINED)"
            - "Case.${case_id}.continuance_count == 0 and days_pending_calendar == 0 and is_past_goal == false"

      - name: case_create_with_computed_field_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Case.fields.priority_score
          - entities.Case.fields.status
          - validations[priority=1]
        distinguishing_aspect: "Client-supplied priority_score and status values are silently ignored (unknown-field tolerance): the created case still computes priority_score from the formula (0 for a fresh NON_DETAINED case) and status FILED."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One court."]
          setup_api_calls:
            - *c_clock
            - *c_court
          trigger:
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "S-2", respondent_full_name: "R Rig", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false, priority_score: 9999, status: "COMPLETED" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id }
          assert:
            - "the response status is 201 (unknown/computed input fields are ignored, not rejected)"
            - "Case.${case_id}.priority_score == 0 (formula output, not the supplied 9999)"
            - "Case.${case_id}.status == FILED (not the supplied COMPLETED)"

      - name: case_get_with_unknown_id_returns_case_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/eoir/cases/{caseId}
          - errors.ERR_CASE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated case id yields the entity-specific 404 ERR_CASE_NOT_FOUND with the error envelope, not a generic 400/500."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /eoir/cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CASE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: interpreter_get_unknown_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/eoir/interpreters/{interpreterId}
          - errors.ERR_INTERPRETER_NOT_FOUND
        distinguishing_aspect: "The interpreter single-GET surfaces ERR_INTERPRETER_NOT_FOUND, proving the interpreter collection route is independently addressable."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /eoir/interpreters/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_INTERPRETER_NOT_FOUND"

      - name: case_number_unique_within_court_only
        claim_type: Type Constraints
        grounds:
          - entities.Case.fields.case_number
          - errors.ERR_CASE_NUMBER_NOT_UNIQUE
        distinguishing_aspect: "case_number uniqueness is scoped to the venue court: duplicating S-1 inside the same court is a 409, while the same case_number under a different court succeeds."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Two courts."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-OTH", name: "Other Court", city: "Reno", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_b: $.data.id }
            - *c_case
          trigger:
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "S-1", respondent_full_name: "R Dup", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_b}", case_number: "S-1", respondent_full_name: "R Ok", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_b: $.data.id }
          assert:
            - "the duplicate within court CT-STD is rejected with 409 and error_id == ERR_CASE_NUMBER_NOT_UNIQUE"
            - "the same case_number under CT-OTH succeeds with 201 (Case.${case_b} created) — uniqueness is per-court"

      - name: court_code_globally_unique
        claim_type: Type Constraints
        grounds:
          - entities.Court.fields.court_code
          - errors.ERR_COURT_CODE_NOT_UNIQUE
        distinguishing_aspect: "court_code is globally unique (unlike case_number): a second court with code CT-STD is rejected even though every other field differs."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One court created."]
          setup_api_calls:
            - *c_clock
            - *c_court
          trigger:
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-STD", name: "Duplicate Code Court", city: "Nowhere", annual_completion_goal: 5, detained_daily_hearing_capacity: 0 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_COURT_CODE_NOT_UNIQUE"
            - "GET /eoir/courts/{first id} still shows the original court unchanged"

      - name: case_create_with_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Case.fields.custody_status
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "custody_status outside {DETAINED, NON_DETAINED} is a 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One court."]
          setup_api_calls:
            - *c_clock
            - *c_court
          trigger:
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "S-9", respondent_full_name: "R Enum", custody_status: "MAYBE", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /eoir/cases?court_id=${court_id} returns 0 rows"

      - name: case_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Case.fields.case_number
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required case_number entirely is a 400 ERR_INVALID_REQUEST from the required-field check — distinct from the 409 uniqueness failure."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One court."]
          setup_api_calls:
            - *c_clock
            - *c_court
          trigger:
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", respondent_full_name: "R Missing", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /eoir/cases?court_id=${court_id} returns 0 rows"

      - name: judges_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/eoir/judges
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three judges, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the final row with has_more false; filters combine with pagination."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One court with three judges."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge A", max_pending_cases: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge B", max_pending_cases: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge C", max_pending_cases: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "GET /eoir/judges"
              payload: { court_id: "${court_id}", limit: 2, offset: 0 }
              as: CourtAdministrator
              as_user_id: "admin-01"
          assert:
            - "the response status is 200 and response_type is array with exactly 2 rows"
            - "total_count == 3 and has_more == true (total_count counts the whole filtered set, not the page)"
            - "GET /eoir/judges?court_id=${court_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /eoir/judges with no parameters returns 3 rows under the default limit 10 / offset 0"

      - name: reassignment_and_docket_review_are_immutable_records
        claim_type: Immutability
        grounds:
          - entities.CaseReassignment
          - entities.DocketReview
          - endpoints.POST_/eoir/courts/{courtId}/docket-reviews
        distinguishing_aspect: "common_fields: false entities carry id and created_at but no version/updated_at, and have no update endpoint: running the docket checkpoint twice creates two snapshots with run_index 1 then 2 rather than mutating one row."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One empty court."]
          setup_api_calls:
            - *c_clock
            - *c_court
          trigger:
            - call: "POST /eoir/courts/${court_id}/docket-reviews"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { rev1: $.data.id }
            - call: "POST /eoir/courts/${court_id}/docket-reviews"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { rev2: $.data.id }
          assert:
            - "DocketReview.${rev1}.run_index == 1 and DocketReview.${rev2}.run_index == 2 (per-court monotonic, immutable snapshots)"
            - "neither response carries a version or updated_at field (common_fields false)"
            - "GET /eoir/docket-reviews?court_id=${court_id} returns exactly 2 rows"
            - "both snapshots report pending_case_count == 0, completions_ytd == 0, pace_ratio_calendar == 0.0 and pace_ratio_hearing_day == 0.0, cases_finalized_by_lapse == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: completed_case_rejects_further_mutations
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Case
          - errors.ERR_CASE_ALREADY_TERMINAL
        distinguishing_aspect: "Once COMPLETED, the case machine is closed: hearing creation, venue-motion filing, and administrative closure against it all fail with ERR_CASE_ALREADY_TERMINAL before any OCC or stage logic runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One court (plus a second court for the venue-motion trigger), one judge, one PRO_SE English non-detained case driven FILED -> CALENDAR -> MERITS -> DECIDED -> APPEALED -> COMPLETED via affirmation."
          setup_api_calls:
            - *c_clock
            - *c_court
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-B2", name: "Second Court", city: "Reno", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_b: $.data.id }
            - &c_judge
              call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Std", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_id: $.data.id }
            - &c_case_eng
              call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "E-1", respondent_full_name: "R Eng", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id }
            - &c_assign
              call: "POST /eoir/cases/${case_id}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v2: $.data.version }
            - &c_master
              call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_m: $.data.id }
            - &c_clock_m
              call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T10:30:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - &c_complete_m
              call: "POST /eoir/hearings/${h_m}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - &c_get4
              call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v4: $.data.version }
            - &c_merits
              call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "INDIVIDUAL_MERITS", scheduled_start: "2026-09-04T10:00:00Z", expected_case_version: "${case_v4}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_i: $.data.id }
            - &c_clock_i
              call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T12:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - &c_complete_i
              call: "POST /eoir/hearings/${h_i}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - &c_get5
              call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v5: $.data.version }
            - &c_decide
              call: "POST /eoir/decisions"
              payload: { case_id: "${case_id}", outcome: "REMOVAL", expected_case_version: "${case_v5}" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { dec_id: $.data.id }
            - &c_appeal
              call: "POST /eoir/appeals"
              payload: { decision_id: "${dec_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { app_id: $.data.id }
            - &c_affirm
              call: "POST /eoir/appeals/${app_id}/decide"
              payload: { ruling: "AFFIRMED" }
              as: BoardMember
              as_user_id: "bm-01"
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v8: $.data.version }
          trigger:
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-10T10:00:00Z", expected_case_version: "${case_v8}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err1: $.data.error_id }
            - call: "POST /eoir/venue-motions"
              payload: { case_id: "${case_id}", destination_court_id: "${court_b}", reason: "forum convenience" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err2: $.data.error_id }
            - call: "POST /eoir/cases/${case_id}/administrative-closure"
              payload: { closure_reason: "OTHER" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { err3: $.data.error_id }
          assert:
            - "Case.${case_id}.status == COMPLETED with completed_at == \"2026-09-04T12:00:00Z\""
            - "all three mutations fail with 409 and error_id == ERR_CASE_ALREADY_TERMINAL"
            - "Decision.${dec_id}.status == FINAL and Appeal.${app_id}.status == AFFIRMED, unchanged"

      - name: final_decision_rejects_late_appeal_attempt
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Decision
          - errors.ERR_DECISION_NOT_APPEALABLE
        distinguishing_aspect: "A FINAL decision (appeal affirmed) rejects a new appeal with ERR_DECISION_NOT_APPEALABLE even though the clock is still inside the original appeal window — terminal state, not time, blocks the filing."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One case driven to COMPLETED via affirmation; clock remains 2026-09-04T12:00:00Z (inside the original window)."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
            - *c_complete_m
            - *c_get4
            - *c_merits
            - *c_clock_i
            - *c_complete_i
            - *c_get5
            - *c_decide
            - *c_appeal
            - *c_affirm
          trigger:
            - call: "POST /eoir/appeals"
              payload: { decision_id: "${dec_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DECISION_NOT_APPEALABLE (decision is FINAL, terminal)"
            - "error_id != ERR_APPEAL_WINDOW_EXPIRED (the window is still open; state alone rejects)"

      - name: hearing_complete_twice_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Hearing.SCHEDULED_to_COMPLETED
          - errors.ERR_HEARING_NOT_SCHEDULED
        distinguishing_aspect: "COMPLETED is terminal for hearings: a second complete call on the same hearing is a 409 ERR_HEARING_NOT_SCHEDULED and does not re-fire the case-advance side effect."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Case docketed with a master hearing 2026-09-03T10:00; clock at 2026-09-03T10:30."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
          trigger:
            - call: "POST /eoir/hearings/${h_m}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "POST /eoir/hearings/${h_m}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first complete returns 200 and Hearing.${h_m}.status == COMPLETED; Case.${case_id}.status == MERITS"
            - "second complete returns 409 with error_id == ERR_HEARING_NOT_SCHEDULED"
            - "Case.${case_id}.status remains MERITS (side effect did not re-fire)"

      - name: notice_mark_defective_twice_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.HearingNotice.SERVED_to_DEFECTIVE
          - errors.ERR_NOTICE_ALREADY_DEFECTIVE
        distinguishing_aspect: "DEFECTIVE is terminal for notices: the second mark-defective call fails with ERR_NOTICE_ALREADY_DEFECTIVE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Case docketed with a master hearing and a SERVED notice."
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - call: "POST /eoir/notices"
              payload: { hearing_id: "${h_m}", service_method: "MAIL", served_at: "2026-08-20T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /eoir/notices/${notice_id}/mark-defective"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/notices/${notice_id}/mark-defective"
              payload: {}
              as: CourtAdministrator
