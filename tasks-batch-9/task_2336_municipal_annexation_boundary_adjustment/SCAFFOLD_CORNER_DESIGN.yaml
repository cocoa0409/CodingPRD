      - name: unauthenticated_requests_are_rejected_before_any_other_check
        claim_type: authentication_required
        grounds:
          - validations[priority=1]
        distinguishing_aspect: |
          Priority 1 outranks everything, so a request with no operator identity must return
          ERR_UNAUTHENTICATED even when it is malformed, aimed at an unknown id, and would also
          have failed the role check — three different requests that would each raise a different
          error when authenticated all collapse to 401.
        test_recipe:
          setup:
            - "One statute profile and one municipality exist so that the authenticated forms of these calls are otherwise well-formed."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_r5: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_r5}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_r5: $.data.id }
          trigger:
            - call: "GET /municipalities/${muni_r5}"
              payload: {}
              as: NONE
              captures: { r5_e_read: $.data.error_id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_r5}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: NONE
              captures: { r5_e_write: $.data.error_id }
            - call: "GET /annexation-cases/no-such-case"
              payload: {}
              as: NONE
              captures: { r5_e_missing: $.data.error_id }
          assert:
            - "${r5_e_read} == ERR_UNAUTHENTICATED with status 401"
            - "${r5_e_write} == ERR_UNAUTHENTICATED with status 401"
            - "${r5_e_missing} == ERR_UNAUTHENTICATED with status 401 — priority 1 wins over the 404"
            - "GET /annexation-cases?municipality_id=${muni_r5} returns total_count == 0"

      - name: both_the_owner_and_the_clerk_may_use_the_shared_consent_operations
        claim_type: shared_operation
        grounds:
          - roles[PropertyOwner]
          - roles[CityClerk]
          - endpoints[POST /parcel-owner-consents]
          - endpoints[POST /parcel-owner-consents/{consentId}/withdraw]
        distinguishing_aspect: |
          Consent recording is the one operation two roles share, and the owner-scope rule must not
          leak onto the clerk: an owner signing for himself and the clerk recording a walk-in
          signature for a different owner both succeed, and the clerk may withdraw a signature the
          owner made. The petition aggregate must reflect all of it identically regardless of which
          role wrote the row.
        test_recipe:
          setup:
            - "A CIRCULATING petition on a certified territory of two 50,000,000-cent parcels owned by OW1 and OW2."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["PETITION_MAJORITY"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
