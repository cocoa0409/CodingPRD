- rule_id: compensating_invariant
  applies: true
  rationale: |
    Four §1.2 transitions exist purely to undo an earlier one, and each has a conserved
    quantity that must return to its exact pre-action value: subscription accept/rescind
    conserves capital_raised_cents and the ownership split, wrap certify/void conserves
    recouped_amount_cents and deferred_royalty_cents, participant terminate/reinstate
    conserves total_pool_points and the pool share percentages, and closing-notice
    issue/withdraw conserves budget_committed_cents and the budget line's own state.
  instances:
  - name: subscription_accept_then_rescind_conserves_capital_and_ownership
    grounds:
    - '§1.2 Subscription ACCEPTED -> RESCINDED (precondition: Production.offering_status IN {OFFERING, FULLY_SUBSCRIBED})'
    - §1.3 investor_ownership_allocation re-proration
    - §1.1 Production.capital_raised_cents, .escrow_balance_cents, .active_investor_count
    distinguishing_aspect: |
      Rescinding the second of two accepted 60,000,000 subscriptions must return the
      production to the exact state it held after the first accept: capital_raised_cents
      60,000,000, escrow 60,000,000, active_investor_count 1, and the surviving account
      back to ownership_pct 1.000000 from 0.500000. An implementation that removes the
