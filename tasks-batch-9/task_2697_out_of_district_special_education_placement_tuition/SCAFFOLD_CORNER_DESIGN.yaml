          rationale: "The auto-dispute branch is a strict > comparison against VARIANCE_TOLERANCE_PCT. That §1.8 instance tests threshold-minus, threshold-exact and threshold-plus with pre-computed submitted amounts (782563 last passing, 782564 first failing) and adds a raw-ratio-above-tolerance-but-rounds-down case that only a round-then-compare implementation gets right."
