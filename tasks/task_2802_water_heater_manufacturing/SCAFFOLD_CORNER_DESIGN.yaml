      - name: disassemble_returns_pieces_without_resurrecting_consumed_lot
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /mfg/heater-units/{id}/disassemble]
          - state_machines.HeaterUnit.ASSEMBLED_to_SCRAPPED
          - state_machines.ComponentLot.RELEASED_to_CONSUMED
          - calculations.component_lot_quantity_ledger
          - calculations.tank_lot_quantity_ledger
          - validations[priority 8]
          - validations[priority 11]
          - errors[ERR_INVALID_UNIT_STATE]
          - errors[ERR_COMPONENT_SUPPLIER_NOT_QUALIFIED]
        distinguishing_aspect: >
          The compensation is deliberately asymmetric: scrapping a unit gives the pieces back to the ledger
          (consumed_quantity drops, remaining_quantity rises, the conservation invariant holds) but a lot that
          already reached the terminal CONSUMED state is NOT resurrected. So the freed piece is visible in the
          numbers yet unusable, and the next assemble against that lot is refused. A SHIPPED unit cannot be
          disassembled at all, which keeps the accrued warranty reserve from being unwound by a scrapping.
