          - errors[ERR_TRANSFER_ALREADY_OPEN]
        distinguishing_aspect: "Item with a PLANNED transfer rejects a second transfer create with ERR_TRANSFER_ALREADY_OPEN."
        test_recipe:
          setup: ["Item I LISTED at S; transfer PLANNED S->T; third OPERATING plant T2 available"]
          setup_api_calls:
            - { call: "POST /portfolio/brands", payload: { name: "B-VA8", category_name: "storage", core_flag: true, private_label_share_pct: 40, annual_net_revenue_cents: 1000000000 }, as: PortfolioManager, captures: { b_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA8-S", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { ps_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA8-T", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pt_id: $.data.id } }
            - { call: "POST /portfolio/plants", payload: { name: "P-VA8-T2", quarterly_capacity_units: 1000000 }, as: PortfolioManager, captures: { pt2_id: $.data.id } }
