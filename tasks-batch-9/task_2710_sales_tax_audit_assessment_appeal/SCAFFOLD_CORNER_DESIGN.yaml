  # ===========================================================================
  # Convention for the two header-level denials below: a call written with
  # `as: NONE` models a request sent with NO X-User-Role / X-User-ID header at
  # all, and every denial call carries `captures: { denied: "$.data.error_id" }`
  # so it is unambiguously a negative trigger rather than a role the endpoint
  # accepts.
  - section: rbac
    instances:
      - name: a_wrong_role_or_a_missing_header_cannot_reach_any_business_rule
        claim_type: Other role's exclusive operation denied
        grounds: [roles.SelectionAnalyst.shared_operations, roles.SelectionAnalyst.exclusive_operations, errors.ERR_UNAUTHENTICATED, errors.ERR_ROLE_NOT_PERMITTED, validations.priority_1, validations.priority_2]
        distinguishing_aspect: |
          Priorities 1 and 2 run before the body is even parsed. A headerless POST
          /taxpayers carrying a perfectly valid body is 401 ERR_UNAUTHENTICATED; a
          FieldAuditor POST /taxpayers whose body is ALSO missing the required
          permit_number is 403 ERR_ROLE_NOT_PERMITTED, not 400 ERR_INVALID_REQUEST;
          and an AuditSupervisor POST /information-returns — an operation exclusive to
          SelectionAnalyst — naming an unresolvable taxpayer_id is 403, not 404. The
          same body from the right role then succeeds, proving nothing but the caller
          identity was wrong.
        test_recipe:
          setup:
            - "Empty database except one taxpayer created by the SelectionAnalyst, so the role-denied calls have something legitimate to be compared against."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
            - call: "POST /taxpayers"
              payload: { legal_name: "Ridgeline Tools LLC", permit_number: "P-2710-B1", industry_naics_code: "444140", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 100000000 }
              as: SelectionAnalyst
              captures: { te_id: "$.data.id" }
          trigger:
            - call: "POST /taxpayers"
              payload: { legal_name: "Northgate Supply Inc", permit_number: "P-2710-B2", industry_naics_code: "444140", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 90000000 }
              as: NONE
              captures: { denied: "$.data.error_id" }
            - call: "POST /taxpayers"
              payload: { legal_name: "Northgate Supply Inc", industry_naics_code: "444140", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 90000000 }
              as: FieldAuditor
              as_user_id: "auditor-1"
              captures: { denied2: "$.data.error_id" }
            - call: "POST /information-returns"
              payload: { taxpayer_id: "00000000-0000-0000-0000-000000000000", source_type: "FEDERAL_1099K", period_start: "2026-01-01", period_end: "2026-03-31", reported_amount_cents: 120000000, matched_return_amount_cents: 90000000 }
              as: AuditSupervisor
              as_user_id: "supervisor-1"
              captures: { denied3: "$.data.error_id" }
            - call: "POST /information-returns"
              payload: { taxpayer_id: "${te_id}", source_type: "FEDERAL_1099K", period_start: "2026-01-01", period_end: "2026-03-31", reported_amount_cents: 120000000, matched_return_amount_cents: 90000000 }
              as: SelectionAnalyst
              captures: { ir_id: "$.data.id" }
          assert:
            - "trigger call 1: response.status == 401 and ${denied} == ERR_UNAUTHENTICATED"
            - "trigger call 2: response.status == 403 and ${denied2} == ERR_ROLE_NOT_PERMITTED (priority 2 beats the missing permit_number at priority 5)"
            - "trigger call 3: response.status == 403 and ${denied3} == ERR_ROLE_NOT_PERMITTED (priority 2 beats the unresolvable FK at priority 6)"
            - "trigger call 4: response.status == 201 and InformationReturn.${ir_id}.taxpayer_id == ${te_id} and match_status == UNDER_REPORTED and variance_cents == 30000000"
            - "GET /taxpayers with limit 10 offset 0 still reports total_count 1 (no denied call created anything)"

