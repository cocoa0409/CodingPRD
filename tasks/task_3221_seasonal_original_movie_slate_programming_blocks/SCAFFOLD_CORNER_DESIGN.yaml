# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3221_seasonal_original_movie_slate_programming_blocks
# Breadth probe over §1.1–§1.7 claims not already exercised by §1.8.
# Corners covered by a §1.8 instance appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: season_create_applies_defaults_and_rejects_bad_window
        claim_type: Creation
        grounds:
          - entities.Season
          - endpoints.POST_/slate/seasons
          - errors.ERR_INVALID_WINDOW
        distinguishing_aspect: "A season created with delivery_deadline AFTER air_window_start is rejected 422 ERR_INVALID_WINDOW; a well-formed season comes back 201 with status DRAFT, version 1, and all three computed counters at 0."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z (unset). One studio."
          setup_api_calls:
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
          trigger:
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Bad Window", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-11-05T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 3, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
          assert:
            - "err == ERR_INVALID_WINDOW with http 422 (delivery_deadline 2027-11-05 >= air_window_start 2027-11-01)"
            - "Season.${season_id}.status == DRAFT and version == 1"
            - "Season.${season_id}.booked_shoot_days == 0 and committed_title_count == 0 and premiered_title_count == 0"

      - name: title_computed_status_ignores_client_input
        claim_type: Computed Fields
        grounds:
          - entities.Title.fields.status
          - endpoints.POST_/slate/titles
        distinguishing_aspect: "A client-supplied status field on title creation is ignored — the new Title is always PITCHED with a null delivered_at, never the client-sent value."
        test_recipe:
          setup:
            - "Studio + DRAFT season exist."
          setup_api_calls:
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 3, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "Snowed Inn", genre: "ROMANCE", tone_rating: "WARM", content_flags: ["ALCOHOL"], duration_minutes: 88 }
              as: SlatePlanner
              captures: { t1: $.data.id }
          assert:
            - "Title.${t1}.status == PITCHED (system-set initial state)"
            - "Title.${t1}.delivered_at is null"
            - "Title.${t1}.content_flags == [\"ALCOHOL\"] (ALCOHOL is a permitted flag; only VIOLENCE/GAMBLING/HORROR trip the brand rule at approve)"
            - "Title.${t1}.version == 1 and id/created_at/updated_at are non-null"

      - name: title_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/slate/titles
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three titles in one season, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; status=PITCHED filter returns all 3 while status=APPROVED returns 0."
        test_recipe:
          setup:
            - "Studio + DRAFT season with three PITCHED titles."
          setup_api_calls:
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 5, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "A", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "B", genre: "FAMILY", tone_rating: "GENTLE", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "C", genre: "COMEDY", tone_rating: "GENTLE", content_flags: [], duration_minutes: 95 }
              as: SlatePlanner
          trigger:
            - call: "GET /slate/titles"
              payload: { season_id: "${season_id}", limit: 2, offset: 0 }
              as: SlatePlanner
          assert:
            - "first page returns exactly 2 rows with total_count == 3 and has_more == true, response_type == array"
            - "GET /slate/titles?season_id=${season_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /slate/titles?season_id=${season_id}&status=PITCHED returns 3 rows; status=APPROVED returns 0 rows"
            - "GET /slate/titles?season_id=${season_id} with no pagination params applies defaults limit=10 offset=0"

      - name: deal_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/slate/deals/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated deal id yields 404 ERR_NOT_FOUND, not a 400 and not an empty object."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 500000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /slate/deals/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND and http status == 404"
            - "the error envelope carries meta.api_request_id and data.message"

      - name: license_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.LicenseGrant
          - endpoints.POST_/slate/licenses
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required royalty_rate on license creation returns 400 ERR_INVALID_REQUEST before any FK or state processing."
        test_recipe:
          setup:
            - "Studio + season + one title exist."
          setup_api_calls:
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 2, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T1", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /slate/licenses"
              payload: { season_id: "${season_id}", title_id: "${t1}", category: "MERCHANDISE", licensee: "X", reported_revenue_cents: 100 }
              as: LicensingManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST and http status == 400 (royalty_rate missing)"

      - name: title_duration_out_of_range_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Title.fields.duration_minutes
          - validations.priority_12
        distinguishing_aspect: "duration_minutes 59 (below the 60..180 range) is rejected 400; 60 and 180 are accepted — the range is inclusive at both ends."
        test_recipe:
          setup:
            - "Studio + DRAFT season exist."
          setup_api_calls:
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 5, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "Too Short", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 59 }
              as: SlatePlanner
              captures: { err: $.data.error_id }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "Exactly Sixty", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 60 }
              as: SlatePlanner
              captures: { t60: $.data.id }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "Exactly 180", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 180 }
              as: SlatePlanner
              captures: { t180: $.data.id }
          assert:
            - "err == ERR_INVALID_REQUEST and http status == 400"
            - "Title.${t60}.duration_minutes == 60 and Title.${t180}.duration_minutes == 180 (inclusive bounds)"

      - name: season_fk_reverse_reachable_from_studio_filtered_list
        claim_type: Parent Relationships
        grounds:
          - entities.Season.fields.studio_id
          - endpoints.GET_/slate/seasons
        distinguishing_aspect: "Seasons are discoverable from their studio via the filtered list GET /slate/seasons?studio_id=... — a season of studio A never appears under studio B's filter."
        test_recipe:
          setup:
            - "Two studios; one season under studio A."
          setup_api_calls:
            - call: "POST /slate/studios"
              payload: { name: "Studio A", ad_budget_cents: 100 }
              as: PlatformAdmin
              captures: { sa: $.data.id }
            - call: "POST /slate/studios"
              payload: { name: "Studio B", ad_budget_cents: 100 }
              as: PlatformAdmin
              captures: { sb: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${sa}", year: 2027, label: "Countdown", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 10 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
          trigger:
            - call: "GET /slate/seasons"
              payload: { studio_id: "${sa}" }
              as: PlatformAdmin
            - call: "GET /slate/seasons"
              payload: { studio_id: "${sb}" }
              as: PlatformAdmin
          assert:
            - "studio A's filtered list contains exactly 1 row (Season.${season_id})"
            - "studio B's filtered list contains 0 rows with total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: title_deliver_without_wrapped_shoot_returns_no_wrapped_shoot
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Title.IN_PRODUCTION_to_DELIVERED
          - errors.ERR_NO_WRAPPED_SHOOT
        distinguishing_aspect: "An IN_PRODUCTION title whose only production slot is still BOOKED cannot be delivered — ERR_NO_WRAPPED_SHOOT fires even though the state precondition (IN_PRODUCTION) holds."
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, LOCKED season, approved title with one BOOKED (not wrapped) slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { sv: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T1", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
            - call: "POST /slate/titles/${t1}/approve"
              payload: { expected_season_version: "${sv}" }
              as: SlatePlanner
            - call: "POST /slate/locations"
              payload: { studio_id: "${studio_id}", name: "Stage A", blackout_windows: [] }
              as: ProductionManager
              captures: { loc: $.data.id }
            - call: "POST /slate/production-slots"
              payload: { title_id: "${t1}", location_id: "${loc}", shoot_start: "2027-03-10T00:00:00Z", shoot_end: "2027-03-20T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
          trigger:
            - call: "POST /slate/titles/${t1}/deliver"
              payload: {}
              as: ProductionManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_WRAPPED_SHOOT and http status == 409"
            - "Title.${t1}.status == IN_PRODUCTION (unchanged)"
            - "Title.${t1}.delivered_at is null"

      - name: title_deliver_after_deadline_returns_delivery_late
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Title.IN_PRODUCTION_to_DELIVERED
          - errors.ERR_DELIVERY_LATE
        distinguishing_aspect: "With a WRAPPED slot in place, delivering with the logical clock at 2027-10-01T00:00:01Z — one second past the 2027-10-01T00:00:00Z deadline — fails ERR_DELIVERY_LATE; rewinding to exactly the deadline succeeds (<= is inclusive)."
        test_recipe:
          setup:
            - "Clock initially 2027-03-01T00:00:00Z. Studio, LOCKED season, approved title with a WRAPPED slot."
            - "Clock advanced to 2027-10-01T00:00:01Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { sv: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T1", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
            - call: "POST /slate/titles/${t1}/approve"
              payload: { expected_season_version: "${sv}" }
              as: SlatePlanner
            - call: "POST /slate/locations"
              payload: { studio_id: "${studio_id}", name: "Stage A", blackout_windows: [] }
              as: ProductionManager
              captures: { loc: $.data.id }
            - call: "POST /slate/production-slots"
              payload: { title_id: "${t1}", location_id: "${loc}", shoot_start: "2027-03-10T00:00:00Z", shoot_end: "2027-03-20T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
              captures: { slot: $.data.id }
            - call: "POST /slate/production-slots/${slot}/wrap"
              payload: {}
              as: ProductionManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-10-01T00:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /slate/titles/${t1}/deliver"
              payload: {}
              as: ProductionManager
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/titles/${t1}/deliver"
              payload: {}
              as: ProductionManager
          assert:
            - "err == ERR_DELIVERY_LATE and http status == 422 (one second past deadline)"
            - "at exactly the deadline the deliver succeeds: Title.${t1}.status == DELIVERED and delivered_at == 2027-10-01T00:00:00Z (<= inclusive)"

      - name: casting_confirm_from_confirmed_is_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Casting
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Confirming an already-CONFIRMED casting is a no-such-transition error (ERR_INVALID_STATE 409) — not idempotent success — and fulfilled_pictures is not double-counted."
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, LOCKED season (required 1), approved title, talent with broad availability, ACTIVE deal (commitment 1), casting CONFIRMED (deal FULFILLED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { sv: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T1", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
            - call: "POST /slate/titles/${t1}/approve"
              payload: { expected_season_version: "${sv}" }
              as: SlatePlanner
            - call: "POST /slate/talent"
              payload: { studio_id: "${studio_id}", stage_name: "Holly Star", availability_windows: [{ start: "2027-01-01T00:00:00Z", end: "2027-12-01T00:00:00Z" }] }
              as: TalentAgent
              captures: { talent_id: $.data.id }
            - call: "POST /slate/deals"
              payload: { talent_id: "${talent_id}", season_id: "${season_id}", picture_commitment: 1 }
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /slate/castings"
              payload: { title_id: "${t1}", talent_id: "${talent_id}" }
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { c1: $.data.id }
            - call: "POST /slate/castings/${c1}/confirm"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
          trigger:
            - call: "POST /slate/castings/${c1}/confirm"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE and http status == 409"
            - "TalentDeal.${deal_id}.fulfilled_pictures == 1 (no double count)"
            - "TalentDeal.${deal_id}.status == FULFILLED"

      - name: production_slot_wrap_from_wrapped_is_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ProductionSlot
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "WRAPPED is terminal: wrapping a WRAPPED slot fails ERR_INVALID_STATE and Season.booked_shoot_days is not decremented a second time."
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, LOCKED season, approved title, one slot WRAPPED (booked_shoot_days back to 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 500000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { sv: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T1", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
            - call: "POST /slate/titles/${t1}/approve"
              payload: { expected_season_version: "${sv}" }
              as: SlatePlanner
            - call: "POST /slate/locations"
              payload: { studio_id: "${studio_id}", name: "Stage A", blackout_windows: [] }
              as: ProductionManager
              captures: { loc: $.data.id }
            - call: "POST /slate/production-slots"
              payload: { title_id: "${t1}", location_id: "${loc}", shoot_start: "2027-03-10T00:00:00Z", shoot_end: "2027-03-20T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
              captures: { slot: $.data.id }
            - call: "POST /slate/production-slots/${slot}/wrap"
              payload: {}
              as: ProductionManager
          trigger:
            - call: "POST /slate/production-slots/${slot}/wrap"
              payload: {}
