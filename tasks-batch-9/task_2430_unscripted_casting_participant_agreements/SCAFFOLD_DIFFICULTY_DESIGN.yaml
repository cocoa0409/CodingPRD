              captures: { wp2_id: $.data.id }
            - call: "GET /casting/productions/${prod_id}"
              payload: {}
              as: ProductionAdmin
              captures: { wc_at_floor: $.data.welfare_committed_cents }
          assert:
            - "${tier0} == STANDARD"
