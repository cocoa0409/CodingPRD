scenario: |
  EV battery swap station: battery inventory management with battery ledger (battery ID/model/capacity/cycle count),
  battery-status (idle/charging/in-use/fault/retired) tracking, station-level inventory balance, cross-station battery
  dispatch, and warranty-and-recall handling; swap reservation with available-battery query by vehicle model,
  reservation-time-slot booking, queue-handling on-site for walk-in users, reservation no-show rules, and
  vehicle-model-to-battery-model compatibility check; swap process (inspection / removal-and-installation / charging)
  with vehicle-arrival check-in, pre-swap battery inspection (vehicle-side battery SOC and condition), automated or
  manual removal-and-installation, removed-battery handover to charging slot, new-battery installation verification,
  and swap-completion confirmation; SOH (state of health) assessment with capacity-test on charge cycle,
  internal-resistance measurement, cycle-count tracking, temperature-history analysis, degradation-curve fitting,
  and SOH-grade tagging; billing rules with per-swap pricing, SOC-difference-based pricing, time-of-use
  electricity-cost pass-through, member-subscription deduction, and refund rules; battery cascade utilization with
  retired-battery (SOH below EV threshold) collection, secondary-use grading (energy-storage/low-speed-vehicle),
  cascade-application-stage tracking, end-of-life recycling handover, and traceability across the lifecycle;
  event-driven synchronization with payment, mapping, grid, and battery-manufacturer warranty systems; audit logging
  for swap events and battery-status changes.

domain_name: "ev-battery-swap"
api_prefix: "/swap-stations"

complexity_profile:
  primary_archetype: "quota / allocation"
  secondary_archetype: "pricing engine"
  complexity_layers:
    - "cascading side effects"
    - "dual-variant calculation"
    - "rate / threshold triggers"
    - "scheduled / deferred actions"

  entity_topology: "hybrid"
  state_machine_shape: "branching"  # branching with revert (reservation no-show/cancel) plus a cascade lifecycle on Battery
  relationship_patterns:
    - one_to_many        # Station has many Batteries, ChargingSlots, Reservations
    - many_to_many       # VehicleModel <-> BatteryModel compatibility via CompatibilityRule
    - cross_aggregate    # SwapEvent references Reservation, Vehicle, two Batteries (incoming/outgoing), Station, BillingRecord

  role_model: "peer_roles"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable station name"
        constraints: "length 1..120; unique"
      - name: latitude
        type: number
        source: input
        description: "Geographic latitude in decimal degrees"
        constraints: "-90.0 .. 90.0"
      - name: longitude
        type: number
        source: input
        description: "Geographic longitude in decimal degrees"
        constraints: "-180.0 .. 180.0"
      - name: total_slots
        type: integer
        source: input
        description: "Total number of charging slots installed"
        constraints: ">= 1; <= 64"
      - name: status
        type: enum
        source: computed
        description: "Operational posture of the station"
        constraints: "OPEN | RESTRICTED | OFFLINE"
        default: "OPEN"
      - name: idle_battery_count
        type: integer
        source: computed
        description: "Cached count of batteries at this station with status=IDLE"
        default: 0
      - name: charging_battery_count
        type: integer
        source: computed
        description: "Cached count of batteries at this station with status=CHARGING"
        default: 0

  - name: BatteryModel
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: "Manufacturer model code, primary join key (e.g., BM-A1)"
        constraints: "unique; length 2..32"
      - name: rated_capacity_kwh
        type: number
        source: input
        description: "Nameplate energy capacity in kWh"
        constraints: "> 0"
      - name: nominal_voltage
        type: number
        source: input
        description: "Nominal pack voltage (V)"
        constraints: "> 0"
      - name: ev_soh_floor_pct
        type: number
        source: input
        description: "Below this SOH percent, battery is no longer eligible for EV swap and must be retired"
        constraints: "0 < value < 100"
        default: 80.0
      - name: manufacturer
        type: string
        source: input
        description: "Battery manufacturer name"

  - name: VehicleModel
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: "Vehicle model code (e.g., VM-Sedan-2024)"
        constraints: "unique; length 2..32"
      - name: name
        type: string
        source: input
        description: "Marketing name"
      - name: pack_voltage_min
        type: number
        source: input
        description: "Minimum supported pack voltage (V)"
        constraints: ">= 0"
      - name: pack_voltage_max
        type: number
        source: input
        description: "Maximum supported pack voltage (V)"
        constraints: "> pack_voltage_min"

  - name: CompatibilityRule
    parent: null
    common_fields: false
    fields:
      - name: vehicle_model_code
        type: string
        source: input
        description: "FK to VehicleModel.code"
      - name: battery_model_code
        type: string
        source: input
        description: "FK to BatteryModel.code"
      - name: connector_match
        type: boolean
        source: input
        description: "Whether physical connector geometry matches"
        default: true
      - name: bms_handshake_supported
        type: boolean
        source: input
        description: "Whether BMS firmware handshake is supported between the pair"
        default: true

  - name: Battery
    parent: null
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial number, globally unique"
        constraints: "unique; length 6..64"
      - name: battery_model_code
        type: string
        source: input
        description: "FK to BatteryModel.code"
      - name: station_id
        type: string
        source: computed
        description: "FK to Station.id; current physical location (null if dispatched in transit)"
      - name: status
        type: enum
        source: computed
        description: "Operational status of the battery"
        constraints: "IDLE | CHARGING | IN_USE | FAULT | RETIRED | RECYCLED | IN_TRANSIT"
        default: "IDLE"
      - name: soc_pct
        type: number
        source: computed
        description: "State of charge, 0..100"
        default: 0.0
        constraints: "0 <= value <= 100"
      - name: soh_pct
        type: number
        source: computed
        description: "Most recent SOH assessment percent, 0..100"
        default: 100.0
      - name: soh_grade
        type: enum
        source: computed
        description: "Grade derived from soh_pct; pinned thresholds in calc soh_grade_tagging"
        constraints: "A | B | C | RETIRED_EV"
        default: "A"
      - name: cycle_count
        type: integer
        source: computed
        description: "Number of full equivalent charge cycles"
        default: 0
      - name: cascade_stage
        type: enum
        source: computed
        description: "Cascade lifecycle stage after EV retirement"
        constraints: "NONE | ENERGY_STORAGE | LOW_SPEED_VEHICLE | END_OF_LIFE"
        default: "NONE"
      - name: warranty_expires_at
        type: datetime
        source: input
        description: "Manufacturer warranty end date"
      - name: recall_flag
        type: boolean
        source: computed
        description: "True if manufacturer recall event has marked this battery"
        default: false

  - name: ChargingSlot
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK to Station.id"
      - name: slot_number
        type: integer
        source: input
        description: "Slot index within station, 1..Station.total_slots"
        constraints: ">= 1; unique per station"
      - name: status
        type: enum
        source: computed
        description: "Slot occupancy status"
        constraints: "EMPTY | OCCUPIED | OUT_OF_SERVICE"
        default: "EMPTY"
      - name: battery_id
        type: string
        source: computed
        description: "FK to Battery.id currently in this slot (null when EMPTY)"
      - name: tou_zone
        type: enum
        source: input
        description: "Time-of-use electricity zone for the slot's metering"
        constraints: "PEAK | SHOULDER | OFF_PEAK"
        default: "SHOULDER"

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: vin
        type: string
        source: input
        description: "Vehicle identification number, unique"
        constraints: "unique; length 11..17"
      - name: vehicle_model_code
        type: string
        source: input
        description: "FK to VehicleModel.code"
      - name: owner_member_id
        type: string
        source: input
        description: "FK to Member.id"
      - name: installed_battery_id
        type: string
        source: computed
        description: "FK to Battery.id currently installed in this vehicle (status=IN_USE)"

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Member full name"
      - name: phone
        type: string
        source: input
        description: "Contact phone, unique"
        constraints: "unique"
      - name: subscription_tier
        type: enum
        source: input
        description: "Subscription plan tier"
        constraints: "NONE | BASIC | PREMIUM"
        default: "NONE"
      - name: subscription_swaps_remaining
        type: integer
        source: computed
        description: "Pre-paid swap credits remaining in the current subscription period"
        default: 0
      - name: no_show_count_30d
        type: integer
        source: computed
        description: "Rolling 30-day count of reservation no-shows"
        default: 0
      - name: reservation_blocked_until
        type: datetime
        source: computed
        description: "Member is blocked from creating new reservations until this timestamp"

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK to Member.id"
      - name: vehicle_id
        type: string
        source: input
        description: "FK to Vehicle.id"
      - name: station_id
        type: string
        source: input
        description: "FK to Station.id"
      - name: slot_start_at
        type: datetime
        source: input
        description: "Reserved slot start (inclusive)"
      - name: slot_end_at
        type: datetime
        source: input
        description: "Reserved slot end (exclusive); pinned 15 min after slot_start_at"
      - name: status
        type: enum
        source: computed
        description: "Reservation lifecycle status"
        constraints: "BOOKED | CHECKED_IN | FULFILLED | CANCELLED | NO_SHOW"
        default: "BOOKED"
      - name: held_battery_id
        type: string
        source: computed
        description: "FK to Battery.id soft-held for this reservation (compatible IDLE battery)"
      - name: queue_position
        type: integer
        source: computed
        description: "1-indexed queue position if walk-in; null if scheduled reservation"

  - name: SwapEvent
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: "FK to Reservation.id; required (walk-ins create a synthetic reservation first)"
      - name: vehicle_id
        type: string
        source: computed
        description: "Denormalized from Reservation.vehicle_id"
      - name: station_id
        type: string
        source: computed
        description: "Denormalized from Reservation.station_id"
      - name: outgoing_battery_id
        type: string
        source: computed
        description: "Battery removed from vehicle (was vehicle.installed_battery_id)"
      - name: incoming_battery_id
        type: string
        source: computed
        description: "Battery installed into vehicle (was Reservation.held_battery_id)"
      - name: outgoing_soc_pct
        type: number
        source: input
        description: "Measured SOC of removed battery at check-in"
        constraints: "0 <= value <= 100"
      - name: incoming_soc_pct
        type: number
        source: computed
        description: "SOC of the new battery installed (snapshotted from Battery.soc_pct at installation)"
      - name: phase
        type: enum
        source: computed
        description: "Phase of the swap workflow"
        constraints: "CHECKED_IN | INSPECTED | UNINSTALLED | INSTALLED | COMPLETED | ABORTED"
        default: "CHECKED_IN"
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "Estimate computed at check-in (uses BatteryModel rated_capacity_kwh and current TOU zone)"
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Final amount computed at COMPLETED (actual incoming.soc_pct realized) — see calc swap_billing"
        default: 0
      - name: completed_at
        type: datetime
        source: computed
        description: "Set when phase becomes COMPLETED"

  - name: BillingRecord
    parent: null
    common_fields: true
    fields:
      - name: swap_event_id
        type: string
        source: input
        description: "FK to SwapEvent.id"
      - name: member_id
        type: string
        source: input
        description: "FK to Member.id"
      - name: per_swap_base_cents
        type: integer
        source: computed
        description: "Per-swap base fee in cents (pinned at COMPLETED)"
      - name: soc_diff_cents
        type: integer
        source: computed
        description: "Charge component derived from SOC delta * rated capacity * TOU rate"
      - name: tou_pass_through_cents
        type: integer
        source: computed
        description: "Time-of-use pass-through electricity component"
      - name: subscription_deduction_cents
        type: integer
        source: computed
        description: "Subscription credit applied (>= 0)"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "Final amount payable; equals per_swap_base + soc_diff + tou_pass_through - subscription_deduction (never < 0)"
      - name: payment_status
        type: enum
        source: computed
        description: "Payment lifecycle"
        constraints: "PENDING | PAID | REFUNDED | FAILED"
        default: "PENDING"
      - name: refund_cents
        type: integer
        source: computed
        description: "Refunded amount in cents (<= amount_due_cents)"
        default: 0

  - name: SOHAssessment
    parent: Battery
    common_fields: false
    fields:
      - name: battery_id
        type: string
        source: input
        description: "FK to Battery.id"
      - name: capacity_test_kwh
        type: number
        source: input
        description: "Measured capacity from the most recent charge cycle (kWh)"
      - name: internal_resistance_mohm
        type: number
        source: input
        description: "Measured internal resistance (milliohms)"
      - name: avg_temperature_c
        type: number
        source: input
        description: "Average temperature during the last 24h cycle window (Celsius)"
      - name: cycle_count_at_assessment
        type: integer
        source: input
        description: "Battery.cycle_count value at time of assessment"
      - name: degradation_slope
        type: number
        source: computed
        description: "Fitted slope from degradation_curve_fit calc"
      - name: soh_pct_out
        type: number
        source: computed
        description: "Output SOH percent from this assessment"
      - name: soh_grade_out
        type: enum
        source: computed
        description: "Output grade"
        constraints: "A | B | C | RETIRED_EV"

  - name: DispatchOrder
    parent: null
    common_fields: true
    fields:
      - name: source_station_id
        type: string
        source: input
        description: "FK to Station.id (origin)"
      - name: dest_station_id
        type: string
        source: input
        description: "FK to Station.id (destination)"
      - name: battery_id
        type: string
        source: input
        description: "FK to Battery.id being moved"
      - name: status
        type: enum
        source: computed
        description: "Dispatch lifecycle"
        constraints: "REQUESTED | IN_TRANSIT | DELIVERED | CANCELLED"
        default: "REQUESTED"
      - name: dispatched_at
        type: datetime
        source: computed
        description: "When the battery left source_station"
      - name: delivered_at
        type: datetime
        source: computed
        description: "When the battery arrived at dest_station"

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: event_type
        type: enum
        source: system
        description: "Type of audited event"
        constraints: "BATTERY_STATUS_CHANGE | SWAP_PHASE_CHANGE | DISPATCH_CHANGE | RECALL_APPLIED | RESERVATION_CHANGE"
      - name: entity_type
        type: string
        source: system
        description: "Affected entity type (e.g., Battery, SwapEvent)"
      - name: entity_id
        type: string
        source: system
        description: "Affected entity id"
      - name: from_value
        type: string
        source: system
        description: "Prior value (status string or other) — null when first set"
      - name: to_value
        type: string
        source: system
        description: "New value"
      - name: actor_role
        type: string
        source: system
        description: "Role that triggered the change"
      - name: actor_id
        type: string
        source: system
        description: "Acting user id"
      - name: occurred_at
        type: datetime
        source: system
        description: "When the change took effect (server clock)"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Battery
    initial_state: IDLE
    terminal_states: [RECYCLED]
    transitions:
      - from: IDLE
        to: CHARGING
        trigger: "POST /batteries/{id}/start-charging"
        actor: StationOperator
        preconditions:
          - "Battery.status == IDLE"
          - "ChargingSlot.status == EMPTY and ChargingSlot.battery_id is null"
          - "Battery.recall_flag == false"
        side_effects:
          - "ChargingSlot.status := OCCUPIED; ChargingSlot.battery_id := Battery.id"
          - "Station.idle_battery_count := Station.idle_battery_count - 1"
          - "Station.charging_battery_count := Station.charging_battery_count + 1"
          - "AuditLog append BATTERY_STATUS_CHANGE IDLE->CHARGING"
      - from: CHARGING
        to: IDLE
        trigger: "POST /batteries/{id}/finish-charging"
        actor: StationOperator | system
        preconditions:
          - "Battery.status == CHARGING"
          - "Body soc_pct >= 95 (charging complete)"
        side_effects:
          - "Battery.cycle_count := Battery.cycle_count + 1"
          - "Battery.soc_pct := soc_pct from body"
          - "Create SOHAssessment row (capacity_test_kwh, internal_resistance_mohm, avg_temperature_c required) — runs calc soh_assessment_compute then calc soh_grade_tagging — see Rule 4 cascade"
          - "If new soh_grade == RETIRED_EV → transition Battery to RETIRED (this triggers cascade_stage assignment, see RETIRED->ENERGY_STORAGE/LOW_SPEED_VEHICLE)"
          - "Else: Battery.status := IDLE; Station.charging_battery_count -= 1; Station.idle_battery_count += 1"
          - "ChargingSlot.status := EMPTY; ChargingSlot.battery_id := null"
          - "AuditLog append BATTERY_STATUS_CHANGE CHARGING->IDLE (or CHARGING->RETIRED)"
      - from: IDLE
        to: IN_USE
        trigger: "POST /swap-events/{id}/install (phase UNINSTALLED -> INSTALLED, new battery in vehicle)"
        actor: StationOperator
        preconditions:
          - "Battery.status == IDLE"
          - "Battery.id == Reservation.held_battery_id (the one held for this swap)"
          - "CompatibilityRule exists for (Vehicle.vehicle_model_code, Battery.battery_model_code) with connector_match=true and bms_handshake_supported=true"
          - "Battery.recall_flag == false"
        side_effects:
          - "Battery.status := IN_USE; Vehicle.installed_battery_id := Battery.id"
          - "Station.idle_battery_count -= 1"
          - "SwapEvent.incoming_battery_id := Battery.id; SwapEvent.incoming_soc_pct := Battery.soc_pct"
      - from: IN_USE
        to: IDLE
        trigger: "POST /swap-events/{id}/uninstall (phase INSPECTED -> UNINSTALLED, old battery removed)"
        actor: StationOperator
        preconditions:
          - "Battery.status == IN_USE"
          - "Battery.id == Vehicle.installed_battery_id"
        side_effects:
          - "Battery.status := IDLE; Battery.station_id := Station.id (the swap station)"
          - "Battery.soc_pct := SwapEvent.outgoing_soc_pct"
          - "Station.idle_battery_count += 1"
          - "Vehicle.installed_battery_id := null"
      - from: IDLE
        to: FAULT
        trigger: "POST /batteries/{id}/report-fault"
        actor: StationOperator
        preconditions:
          - "Battery.status IN {IDLE, CHARGING}"
        side_effects:
          - "If was CHARGING: ChargingSlot.status := EMPTY; Station.charging_battery_count -= 1"
          - "If was IDLE: Station.idle_battery_count -= 1"
          - "AuditLog append BATTERY_STATUS_CHANGE *->FAULT"
      - from: FAULT
        to: IDLE
        trigger: "POST /batteries/{id}/clear-fault"
        actor: StationOperator
        preconditions:
          - "Battery.status == FAULT"
          - "Battery.recall_flag == false"
        side_effects:
          - "Battery.status := IDLE; Station.idle_battery_count += 1"
      - from: IDLE
        to: IN_TRANSIT
        trigger: "POST /dispatch-orders/{id}/dispatch"
        actor: PlatformAdmin
        preconditions:
          - "Battery.status == IDLE"
          - "DispatchOrder.status == REQUESTED"
        side_effects:
          - "Battery.status := IN_TRANSIT; Battery.station_id := null"
          - "DispatchOrder.status := IN_TRANSIT; DispatchOrder.dispatched_at := now()"
          - "source Station.idle_battery_count -= 1"
      - from: IN_TRANSIT
        to: IDLE
        trigger: "POST /dispatch-orders/{id}/deliver"
        actor: PlatformAdmin
        preconditions:
          - "DispatchOrder.status == IN_TRANSIT"
        side_effects:
          - "Battery.status := IDLE; Battery.station_id := DispatchOrder.dest_station_id"
          - "DispatchOrder.status := DELIVERED; DispatchOrder.delivered_at := now()"
          - "dest Station.idle_battery_count += 1"
      - from: CHARGING
        to: RETIRED
        trigger: "system auto-transition when calc soh_grade_tagging output == RETIRED_EV"
        actor: system
        preconditions:
          - "Battery.status == CHARGING (auto-transition runs at finish-charging only)"
          - "Battery.soh_pct < BatteryModel.ev_soh_floor_pct"
        side_effects:
          - "Battery.status := RETIRED; Battery.soh_grade := RETIRED_EV"
          - "ChargingSlot.status := EMPTY; ChargingSlot.battery_id := null"
          - "Station.charging_battery_count -= 1"
          - "AuditLog append BATTERY_STATUS_CHANGE CHARGING->RETIRED"
          - "Auto-trigger calc cascade_grading which determines the next cascade transition; see Rule 4 chain (finish-charging -> retire -> cascade_stage assignment -> recycle eligibility)"
      - from: RETIRED
        to: RETIRED
        trigger: "POST /batteries/{id}/grade-cascade"
        actor: PlatformAdmin
        preconditions:
          - "Battery.status == RETIRED"
          - "Battery.cascade_stage == NONE"
        side_effects:
          - "Battery.cascade_stage := result of calc cascade_grading (ENERGY_STORAGE | LOW_SPEED_VEHICLE | END_OF_LIFE)"
      - from: RETIRED
        to: RECYCLED
        trigger: "POST /batteries/{id}/recycle"
        actor: PlatformAdmin
        preconditions:
          - "Battery.status == RETIRED"
          - "Battery.cascade_stage == END_OF_LIFE"
        side_effects:
          - "Battery.status := RECYCLED"
          - "Battery.station_id := null"
          - "Emit external event RECYCLE_HANDOVER (mock event-driven sync to manufacturer)"
      - from: IDLE
        to: RETIRED
        trigger: "POST /recalls/{id}/apply  (manufacturer recall hits this serial number)"
        actor: PlatformAdmin
        preconditions:
          - "Battery.status IN {IDLE, CHARGING}"
        side_effects:
          - "Battery.recall_flag := true"
          - "Battery.status := RETIRED"
          - "If was IDLE: Station.idle_battery_count -= 1"
          - "If was CHARGING: Station.charging_battery_count -= 1; ChargingSlot.status := EMPTY; ChargingSlot.battery_id := null"
          - "Battery.cascade_stage := END_OF_LIFE (recalls bypass secondary use)"
          - "AuditLog append RECALL_APPLIED"
    notes: "Battery state machine has a forward pipeline (IDLE→CHARGING→IDLE cycle) plus a branching path at finish-charging (IDLE OR RETIRED depending on SOH grade), plus a cascade tail (RETIRED→{ENERGY_STORAGE,LOW_SPEED_VEHICLE,END_OF_LIFE}→RECYCLED). The IDLE↔CHARGING↔IDLE round-trip is a cycle. Cross-entity gating: Battery transitions IDLE→IN_USE require CompatibilityRule existence and Vehicle state."

  - entity: Reservation
    initial_state: BOOKED
    terminal_states: [FULFILLED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /reservations/{id}/check-in"
        actor: StationOperator
        preconditions:
          - "Reservation.status == BOOKED"
          - "now() within [slot_start_at, slot_end_at)"
          - "Reservation.held_battery_id exists and that Battery.status == IDLE"
          - "Compatibility rule exists for (Vehicle.vehicle_model_code, held Battery.battery_model_code)"
        side_effects:
          - "Reservation.status := CHECKED_IN"
          - "Create SwapEvent row with phase=CHECKED_IN, outgoing_battery_id := Vehicle.installed_battery_id"
          - "Compute provisional_total_cents (calc swap_billing variant provisional)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /reservations/{id}/cancel"
        actor: Member | StationOperator
        preconditions:
          - "Reservation.status == BOOKED"
          - "now() <= slot_start_at - 5 minutes (free cancellation window)"
        side_effects:
          - "Reservation.status := CANCELLED"
          - "Release held battery: Battery(held_battery_id).remains IDLE — no transition needed; only soft-release the hold"
          - "Reservation.held_battery_id := null"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system auto when POST /_sweep/no-show runs and now() > slot_end_at and status still BOOKED"
        actor: system
        preconditions:
          - "Reservation.status == BOOKED"
          - "now() > Reservation.slot_end_at"
        side_effects:
          - "Reservation.status := NO_SHOW"
          - "Member.no_show_count_30d := count of NO_SHOW reservations by this member in last 30 days"
          - "If Member.no_show_count_30d >= 3 → Member.reservation_blocked_until := now() + 72 hours (cascade Rule 4 chain: sweep -> NO_SHOW -> member block)"
          - "Reservation.held_battery_id := null (release soft hold)"
      - from: CHECKED_IN
        to: FULFILLED
        trigger: "POST /swap-events/{id}/complete (final phase set to COMPLETED)"
        actor: StationOperator
        preconditions:
          - "SwapEvent.phase == INSTALLED"
        side_effects:
          - "Reservation.status := FULFILLED"
          - "SwapEvent.phase := COMPLETED; SwapEvent.completed_at := now()"
          - "Create BillingRecord (calc swap_billing variant final)"
          - "If Member.subscription_swaps_remaining > 0 → decrement by 1 and apply subscription_deduction_cents"
          - "Emit external event SWAP_COMPLETED (mock sync to payment system)"
          - "AuditLog append SWAP_PHASE_CHANGE INSTALLED->COMPLETED"
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /swap-events/{id}/abort"
        actor: StationOperator
        preconditions:
          - "SwapEvent.phase IN {CHECKED_IN, INSPECTED}"
        side_effects:
          - "Reservation.status := CANCELLED; SwapEvent.phase := ABORTED"
          - "Release Reservation.held_battery_id (battery stays IDLE)"

  - entity: SwapEvent
    initial_state: CHECKED_IN
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: CHECKED_IN
        to: INSPECTED
        trigger: "POST /swap-events/{id}/inspect"
        actor: StationOperator
        preconditions:
          - "SwapEvent.phase == CHECKED_IN"
          - "Body provides outgoing_soc_pct in [0, 100]"
        side_effects:
          - "SwapEvent.outgoing_soc_pct := body.outgoing_soc_pct"
          - "SwapEvent.phase := INSPECTED"
      - from: INSPECTED
        to: UNINSTALLED
        trigger: "POST /swap-events/{id}/uninstall"
        actor: StationOperator
        preconditions:
          - "SwapEvent.phase == INSPECTED"
        side_effects:
          - "Battery(outgoing_battery_id) IN_USE -> IDLE (sub-cascade); Vehicle.installed_battery_id := null"
          - "Battery(outgoing_battery_id).soc_pct := SwapEvent.outgoing_soc_pct; .station_id := SwapEvent.station_id"
          - "Station.idle_battery_count += 1"
          - "SwapEvent.phase := UNINSTALLED"
      - from: UNINSTALLED
        to: INSTALLED
        trigger: "POST /swap-events/{id}/install"
        actor: StationOperator
        preconditions:
          - "SwapEvent.phase == UNINSTALLED"
          - "Body provides verify=true (BMS handshake passed)"
          - "Reservation.held_battery_id exists and that Battery.status == IDLE"
        side_effects:
          - "Battery(held_battery_id) IDLE -> IN_USE; Vehicle.installed_battery_id := held_battery_id"
          - "SwapEvent.incoming_battery_id := held_battery_id; SwapEvent.incoming_soc_pct := Battery.soc_pct"
          - "Station.idle_battery_count -= 1"
          - "SwapEvent.phase := INSTALLED"
      - from: INSTALLED
        to: COMPLETED
        trigger: "POST /swap-events/{id}/complete"
        actor: StationOperator
        preconditions:
          - "SwapEvent.phase == INSTALLED"
        side_effects:
          - "SwapEvent.phase := COMPLETED; SwapEvent.completed_at := now()"
          - "Compute SwapEvent.final_total_cents via calc swap_billing variant final"
          - "Create BillingRecord (this is where the conserved-quantity invariants apply, see Rule 9)"
          - "Reservation transitions CHECKED_IN -> FULFILLED (bubble up)"
      - from: CHECKED_IN
        to: ABORTED
        trigger: "POST /swap-events/{id}/abort"
        actor: StationOperator
        preconditions:
          - "SwapEvent.phase IN {CHECKED_IN, INSPECTED, UNINSTALLED}"
        side_effects:
          - "SwapEvent.phase := ABORTED"
          - "If UNINSTALLED at time of abort: re-install outgoing battery into vehicle (Battery IDLE->IN_USE; Vehicle.installed_battery_id := outgoing_battery_id; Station.idle_battery_count -= 1) — compensating action, see Rule 9 invariants"
          - "Release Reservation.held_battery_id soft hold"
          - "Reservation -> CANCELLED"

  - entity: DispatchOrder
    initial_state: REQUESTED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: IN_TRANSIT
        trigger: "POST /dispatch-orders/{id}/dispatch"
        actor: PlatformAdmin
        preconditions:
          - "DispatchOrder.status == REQUESTED"
          - "Battery.status == IDLE and Battery.station_id == source_station_id"
        side_effects:
          - "DispatchOrder.status := IN_TRANSIT; DispatchOrder.dispatched_at := now()"
          - "Battery IDLE -> IN_TRANSIT (sub-cascade)"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /dispatch-orders/{id}/deliver"
        actor: PlatformAdmin
        preconditions:
          - "DispatchOrder.status == IN_TRANSIT"
        side_effects:
          - "DispatchOrder.status := DELIVERED; DispatchOrder.delivered_at := now()"
          - "Battery IN_TRANSIT -> IDLE; Battery.station_id := dest_station_id"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /dispatch-orders/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "DispatchOrder.status == REQUESTED"
        side_effects:
          - "DispatchOrder.status := CANCELLED"

  - entity: BillingRecord
    initial_state: PENDING
    terminal_states: [PAID, REFUNDED, FAILED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /billing-records/{id}/pay"
        actor: Member
        preconditions:
          - "BillingRecord.payment_status == PENDING"
        side_effects:
          - "BillingRecord.payment_status := PAID"
          - "Emit external event PAYMENT_OK"
      - from: PENDING
        to: FAILED
        trigger: "POST /billing-records/{id}/mark-failed"
        actor: system
        preconditions:
          - "BillingRecord.payment_status == PENDING"
        side_effects:
          - "BillingRecord.payment_status := FAILED"
      - from: PAID
        to: REFUNDED
        trigger: "POST /billing-records/{id}/refund"
        actor: PlatformAdmin
        preconditions:
          - "BillingRecord.payment_status == PAID"
          - "Body provides refund_cents in (0, BillingRecord.amount_due_cents]"
        side_effects:
          - "BillingRecord.refund_cents := body.refund_cents"
          - "BillingRecord.payment_status := REFUNDED"
          - "If refund_cents == amount_due_cents AND Member had subscription_deduction applied → restore Member.subscription_swaps_remaining += 1 (compensating action, conserved quantity — see Rule 9)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two reservations attempt to soft-hold the same compatible IDLE battery at overlapping time slots on the same station"
    guarantee: "Only the first reservation succeeds; the second is rejected because the only compatible IDLE battery is already held"
    error_id: ERR_NO_COMPATIBLE_BATTERY
    http_status: 409
    serialization: "First-writer-wins on battery hold (held_battery_id)"
  - scenario: "Two operators attempt to install different IDLE batteries into the same Vehicle simultaneously"
    guarantee: "At most one install succeeds per SwapEvent; second install rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on SwapEvent.phase transition UNINSTALLED->INSTALLED"
  - scenario: "Recall applied to a battery while it is being installed in a swap event"
    guarantee: "Recall is rejected if Battery.status == IN_USE; install is rejected if Battery.recall_flag becomes true mid-flow"
    error_id: ERR_BATTERY_RECALLED
    http_status: 409
    serialization: "First-writer-wins; the loser observes the other's state change"
  - scenario: "Two dispatch orders try to move the same IDLE battery"
    guarantee: "Only the first dispatch transitions the battery to IN_TRANSIT; the second is rejected"
    error_id: ERR_BATTERY_NOT_IDLE
    http_status: 409
    serialization: "First-writer-wins on Battery.status"
  - scenario: "Pay and mark-failed both attempted on the same PENDING BillingRecord"
    guarantee: "Exactly one terminal payment outcome wins; the other rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on BillingRecord.payment_status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: swap_billing
    trigger: "On Reservation.check-in (provisional variant) and on SwapEvent.complete (final variant)"
    algorithm: tiered_pricing
    formula: |
      # All amounts in integer cents. Round per-component half-up.
      per_swap_base_cents = PER_SWAP_BASE_CENTS                        # 500 cents
      soc_delta = max(0, incoming_soc_pct - outgoing_soc_pct)          # percent
      energy_kwh = (soc_delta / 100.0) * BatteryModel.rated_capacity_kwh
      tou_rate_cents_per_kwh = TOU_RATE[ChargingSlot.tou_zone of the slot the incoming battery came from]
        # PEAK=40, SHOULDER=25, OFF_PEAK=15
      soc_diff_cents = round_half_up(energy_kwh * tou_rate_cents_per_kwh * SOC_DIFF_MULTIPLIER)
        # SOC_DIFF_MULTIPLIER = 1.20  (markup over raw electricity)
      tou_pass_through_cents = round_half_up(energy_kwh * tou_rate_cents_per_kwh * 1.00)
        # pure pass-through electricity
      subtotal_cents = per_swap_base_cents + soc_diff_cents + tou_pass_through_cents
      subscription_deduction_cents = SUBSCRIPTION_DEDUCTION_BY_TIER[Member.subscription_tier]
        # NONE=0, BASIC=500, PREMIUM=1500 ; only applied if Member.subscription_swaps_remaining > 0
      amount_due_cents = max(0, subtotal_cents - subscription_deduction_cents)
    input_set: "Provisional uses incoming_soc_pct = Battery(held_battery_id).soc_pct at check-in time; Final uses incoming_soc_pct snapshotted at INSTALL phase (SwapEvent.incoming_soc_pct), which may differ if held battery was swapped or if its SOC drifted while charging continued"
    constants:
      PER_SWAP_BASE_CENTS: 500
      TOU_RATE_PEAK: 40
      TOU_RATE_SHOULDER: 25
      TOU_RATE_OFF_PEAK: 15
      SOC_DIFF_MULTIPLIER: 1.20
      SUBSCRIPTION_DEDUCTION_NONE: 0
      SUBSCRIPTION_DEDUCTION_BASIC: 500
      SUBSCRIPTION_DEDUCTION_PREMIUM: 1500
    precision: "Integer cents; per-component round_half_up before summation; sum order is base + soc_diff + tou_pass_through; deduction applied last"
    variants:
      - name: provisional
        when: "Computed at Reservation check-in for display to member"
        difference: "Uses the held battery's current soc_pct at hold time; if that battery is later swapped (dispatch arrives mid-window) or its soc_pct drifts (continued charging), the final differs"
      - name: final
        when: "Computed at SwapEvent.complete to write BillingRecord.amount_due_cents"
        difference: "Uses SwapEvent.incoming_soc_pct snapshotted at INSTALL phase — the actual battery installed and its actual SOC at install time"

  - name: soh_assessment_compute
    trigger: "On finish-charging — creates a SOHAssessment row and computes Battery.soh_pct"
    algorithm: weighted_scoring
    formula: |
      # All inputs from the assessment row.
      capacity_factor = (capacity_test_kwh / BatteryModel.rated_capacity_kwh) * 100.0
      resistance_penalty = max(0, internal_resistance_mohm - RESISTANCE_BASELINE_MOHM) * RESISTANCE_PENALTY_PER_MOHM
        # RESISTANCE_BASELINE_MOHM=50, RESISTANCE_PENALTY_PER_MOHM=0.10
      temperature_penalty = 0.0
      if avg_temperature_c > TEMP_HIGH_C: temperature_penalty = (avg_temperature_c - TEMP_HIGH_C) * TEMP_PENALTY_PER_C
      if avg_temperature_c < TEMP_LOW_C:  temperature_penalty = (TEMP_LOW_C - avg_temperature_c) * TEMP_PENALTY_PER_C
        # TEMP_HIGH_C=35, TEMP_LOW_C=10, TEMP_PENALTY_PER_C=0.05
      cycle_penalty = max(0, cycle_count_at_assessment - CYCLE_BASELINE) * CYCLE_PENALTY_PER_CYCLE
        # CYCLE_BASELINE=500, CYCLE_PENALTY_PER_CYCLE=0.005
      soh_pct = capacity_factor - resistance_penalty - temperature_penalty - cycle_penalty
      soh_pct = round_half_up(clamp(soh_pct, 0.0, 100.0), 2)
      Battery.soh_pct := soh_pct
      SOHAssessment.soh_pct_out := soh_pct
    input_set: "Latest SOHAssessment row for this battery; cycle_count_at_assessment is read from Battery.cycle_count AFTER finish-charging increment"
    constants:
      RESISTANCE_BASELINE_MOHM: 50
      RESISTANCE_PENALTY_PER_MOHM: 0.10
      TEMP_HIGH_C: 35
      TEMP_LOW_C: 10
      TEMP_PENALTY_PER_C: 0.05
      CYCLE_BASELINE: 500
      CYCLE_PENALTY_PER_CYCLE: 0.005
    precision: "2 decimal places, round_half_up; clamp to [0, 100]"
    variants:
      - name: standard
        when: "Always (single-mode calc)"
        difference: "n/a"

  - name: soh_grade_tagging
    trigger: "Immediately after soh_assessment_compute completes; reads new Battery.soh_pct"
    algorithm: threshold
    formula: |
      if soh_pct >= GRADE_A_FLOOR (90.0): grade = A
      elif soh_pct >= GRADE_B_FLOOR (BatteryModel.ev_soh_floor_pct, default 80.0): grade = B
      elif soh_pct >= GRADE_C_FLOOR (70.0): grade = C
      else: grade = RETIRED_EV
      # Boundary: strictly less than ev_soh_floor_pct -> retired. ev_soh_floor_pct itself -> B.
      Battery.soh_grade := grade
      SOHAssessment.soh_grade_out := grade
      if grade == RETIRED_EV: auto-transition Battery CHARGING->RETIRED (cascade chain)
    input_set: "Battery.soh_pct (output of soh_assessment_compute) and BatteryModel.ev_soh_floor_pct"
    constants:
      GRADE_A_FLOOR: 90.0
      GRADE_C_FLOOR: 70.0
    precision: "Comparison uses the soh_pct value as rounded by soh_assessment_compute (2 decimal places)"

  - name: cascade_grading
    trigger: "On RETIRED battery, POST /batteries/{id}/grade-cascade"
    algorithm: threshold
    formula: |
      # cycle_count drives cascade allocation; recall_flag forces END_OF_LIFE.
      if Battery.recall_flag == true: stage = END_OF_LIFE
      elif Battery.cycle_count < CASCADE_ENERGY_STORAGE_MAX_CYCLES (1500): stage = ENERGY_STORAGE
      elif Battery.cycle_count < CASCADE_LSV_MAX_CYCLES (2500): stage = LOW_SPEED_VEHICLE
      else: stage = END_OF_LIFE
      Battery.cascade_stage := stage
    input_set: "Battery.cycle_count and Battery.recall_flag"
    constants:
      CASCADE_ENERGY_STORAGE_MAX_CYCLES: 1500
      CASCADE_LSV_MAX_CYCLES: 2500

  - name: degradation_curve_fit
    trigger: "On every SOHAssessment row creation, after soh_assessment_compute populates soh_pct_out"
    algorithm: aggregation
    formula: |
      # Fit slope of soh_pct over cycle_count_at_assessment using LATEST N assessments for this battery, ordered by created_at ASC.
      # N = DEGRADATION_WINDOW (default 5). If fewer than 2 points exist, slope = 0.0.
      window = SOHAssessment rows for this battery, ordered by created_at ASC, take LAST DEGRADATION_WINDOW rows
      if len(window) < 2: slope = 0.0
      else:
        # Simple linear regression of soh_pct_out (y) against cycle_count_at_assessment (x)
        x = [row.cycle_count_at_assessment for row in window]
        y = [row.soh_pct_out for row in window]
        slope = sum((xi - mean(x)) * (yi - mean(y))) / sum((xi - mean(x))**2)
        slope = round_half_up(slope, 4)
      SOHAssessment.degradation_slope := slope
    input_set: "All SOHAssessment rows for this battery (filtered to this battery_id), sorted by created_at ASC; take last DEGRADATION_WINDOW rows including the row just inserted"
    constants:
      DEGRADATION_WINDOW: 5
    precision: "4 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of {Member, StationOperator, PlatformAdmin}"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (e.g., Station before ChargingSlot)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"
  - priority: 4
    category: state
    check: "Battery.status is in the set of valid 'from' states for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all Battery transition endpoints"
  - priority: 5
    category: state
    check: "SwapEvent.phase is in the valid 'from' phases for the requested phase transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all SwapEvent phase endpoints"
  - priority: 6
    category: business_safety
    check: "Battery.recall_flag must be false for any IDLE/CHARGING transition that puts the battery into IN_USE or CHARGING"
    error_id: ERR_BATTERY_RECALLED
    http_status: 409
    applies_to: "POST /batteries/{id}/start-charging, POST /swap-events/{id}/install"
  - priority: 7
    category: business_safety
    check: "Vehicle model and Battery model must have a CompatibilityRule with connector_match=true and bms_handshake_supported=true"
    error_id: ERR_INCOMPATIBLE_MODEL
    http_status: 422
    applies_to: "POST /reservations, POST /swap-events/{id}/install"
  - priority: 8
    category: business_referential
    check: "Reservation slot_end_at must equal slot_start_at + 15 minutes"
    error_id: ERR_INVALID_TIME_SLOT
    http_status: 422
    applies_to: "POST /reservations"
  - priority: 9
    category: business_temporal
    check: "Reservation slot_start_at must be >= now() + 5 minutes (no immediate-past bookings)"
    error_id: ERR_INVALID_TIME_SLOT
    http_status: 422
    applies_to: "POST /reservations"
  - priority: 10
    category: business_temporal
    check: "Reservation slot_start_at must not overlap any existing BOOKED reservation by the same Member (half-open intervals; touching boundaries OK)"
    error_id: ERR_RESERVATION_OVERLAP_MEMBER
    http_status: 409
    applies_to: "POST /reservations"
  - priority: 11
    category: business_temporal
    check: "At the requested station, the count of BOOKED reservations whose [slot_start_at, slot_end_at) STRICTLY overlap the new slot (excluding touching boundaries) plus the new request must not exceed Station.total_slots; touching boundaries are explicitly allowed (different interval semantics than rule 10)"
    error_id: ERR_STATION_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /reservations"
  - priority: 12
    category: business_constraint
    check: "At least one IDLE Battery at the station must be compatible with the Vehicle.vehicle_model_code and not already soft-held by another BOOKED reservation"
    error_id: ERR_NO_COMPATIBLE_BATTERY
    http_status: 409
    applies_to: "POST /reservations"
  - priority: 13
    category: business_constraint
    check: "Member.reservation_blocked_until must be null or in the past"
    error_id: ERR_MEMBER_BLOCKED
    http_status: 403
    applies_to: "POST /reservations"
  - priority: 14
    category: business_fiscal
    check: "BillingRecord refund_cents in (0, amount_due_cents]"
    error_id: ERR_REFUND_EXCEEDS_PAID
    http_status: 422
    applies_to: "POST /billing-records/{id}/refund"
  - priority: 15
    category: business_constraint
    check: "Battery.cascade_stage transitions in cascade_grading must respect cycle_count and recall_flag (boundary at exact CASCADE_ENERGY_STORAGE_MAX_CYCLES — < goes to ENERGY_STORAGE, >= goes to LOW_SPEED_VEHICLE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /batteries/{id}/grade-cascade, POST /batteries/{id}/recycle"
  - priority: 16
    category: business_constraint
    check: "DispatchOrder source_station_id != dest_station_id"
    error_id: ERR_INVALID_DISPATCH
    http_status: 422
    applies_to: "POST /dispatch-orders"
  - priority: 17
    category: business_constraint
    check: "Battery must be IDLE and at source_station for dispatch to start"
    error_id: ERR_BATTERY_NOT_IDLE
    http_status: 409
    applies_to: "POST /dispatch-orders/{id}/dispatch"
  - priority: 18
    category: business_fiscal
    check: "Pagination limit in [1, 100]; offset >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all list endpoints"
  - priority: 19
    category: business_constraint
    check: "Version mismatch on PATCH (optimistic concurrency)"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/stations"
    description: "Register a station"
    roles: [PlatformAdmin]
    code: 201
    input: [name, latitude, longitude, total_slots]
    output: Station
    side_effects: []

  - method: GET
    path: "/stations"
    description: "List stations with pagination and optional status filter"
    roles: [PlatformAdmin, StationOperator, Member]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Station[]
    side_effects: []

  - method: GET
    path: "/stations/{id}"
    description: "Get station detail with idle/charging counts"
    roles: [PlatformAdmin, StationOperator, Member]
    code: 200
    input: []
    output: Station
    side_effects: []

  - method: POST
    path: "/stations/{id}/charging-slots"
    description: "Add a charging slot to a station"
    roles: [PlatformAdmin]
    code: 201
    input: [slot_number, tou_zone]
    output: ChargingSlot
    side_effects: []

  - method: GET
    path: "/stations/{id}/charging-slots"
    description: "List charging slots at a station"
    roles: [PlatformAdmin, StationOperator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ChargingSlot[]
    side_effects: []

  - method: POST
    path: "/battery-models"
    description: "Register a battery model"
    roles: [PlatformAdmin]
    code: 201
    input: [code, rated_capacity_kwh, nominal_voltage, manufacturer, "ev_soh_floor_pct?"]
    output: BatteryModel
    side_effects: []

  - method: POST
    path: "/vehicle-models"
    description: "Register a vehicle model"
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, pack_voltage_min, pack_voltage_max]
    output: VehicleModel
    side_effects: []

  - method: POST
    path: "/compatibility-rules"
    description: "Declare compatibility between a vehicle model and battery model"
    roles: [PlatformAdmin]
    code: 201
    input: [vehicle_model_code, battery_model_code, "connector_match?", "bms_handshake_supported?"]
    output: CompatibilityRule
    side_effects: []

  - method: GET
    path: "/compatibility-rules"
    description: "Query compatibility rules (filter by vehicle_model_code)"
    roles: [PlatformAdmin, StationOperator, Member]
    code: 200
    input: ["vehicle_model_code?", "battery_model_code?", "limit?", "offset?"]
    output: CompatibilityRule[]
    side_effects: []

  - method: POST
    path: "/batteries"
    description: "Register a battery on a station (status starts IDLE)"
    roles: [PlatformAdmin]
    code: 201
    input: [serial_number, battery_model_code, station_id, warranty_expires_at, "soc_pct?", "soh_pct?"]
    output: Battery
    side_effects: ["Station.idle_battery_count += 1"]

  - method: GET
    path: "/batteries"
    description: "List batteries with filters"
    roles: [PlatformAdmin, StationOperator]
    code: 200
    input: ["station_id?", "status?", "battery_model_code?", "vehicle_model_compatible?", "limit?", "offset?"]
    output: Battery[]
    side_effects: []

  - method: GET
    path: "/batteries/{id}"
    description: "Battery detail including soh, cycle_count, cascade_stage"
    roles: [PlatformAdmin, StationOperator, Member]
    code: 200
    input: []
    output: Battery
    side_effects: []

  - method: POST
    path: "/batteries/{id}/start-charging"
    description: "Move IDLE battery into a CHARGING slot"
    roles: [StationOperator]
    code: 200
    input: [charging_slot_id]
    output: Battery
    side_effects: ["calc nothing yet; status flip; slot occupancy"]

  - method: POST
    path: "/batteries/{id}/finish-charging"
    description: "Complete charge cycle; runs SOH assessment and may auto-retire"
    roles: [StationOperator]
    code: 200
    input: [soc_pct, capacity_test_kwh, internal_resistance_mohm, avg_temperature_c]
    output: Battery
    side_effects:
      - "calc soh_assessment_compute -> Battery.soh_pct"
      - "calc soh_grade_tagging -> Battery.soh_grade"
      - "calc degradation_curve_fit -> SOHAssessment.degradation_slope"
      - "Auto-transition CHARGING -> RETIRED if soh_grade == RETIRED_EV (cascade Rule 4)"
      - "Battery.cycle_count += 1"

  - method: POST
    path: "/batteries/{id}/report-fault"
    description: "Mark battery FAULT"
    roles: [StationOperator]
    code: 200
    input: ["reason?"]
    output: Battery
    side_effects: []

  - method: POST
    path: "/batteries/{id}/clear-fault"
    description: "Return FAULT battery to IDLE"
    roles: [StationOperator]
    code: 200
    input: []
    output: Battery
    side_effects: []

  - method: POST
    path: "/batteries/{id}/grade-cascade"
    description: "Assign cascade_stage to a RETIRED battery"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Battery
    side_effects: ["calc cascade_grading"]

  - method: POST
    path: "/batteries/{id}/recycle"
    description: "Move RETIRED battery (END_OF_LIFE cascade) to RECYCLED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Battery
    side_effects: ["external recycle handover event"]

  - method: GET
    path: "/batteries/{id}/soh-assessments"
    description: "List SOH assessments for a battery"
    roles: [PlatformAdmin, StationOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: SOHAssessment[]
    side_effects: []

  - method: POST
    path: "/vehicles"
    description: "Register a vehicle"
    roles: [Member, PlatformAdmin]
    code: 201
    input: [vin, vehicle_model_code, owner_member_id, "installed_battery_id?"]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles/{id}"
    description: "Vehicle detail"
    roles: [Member, PlatformAdmin, StationOperator]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/members"
    description: "Register a member"
    roles: [PlatformAdmin]
    code: 201
    input: [name, phone, "subscription_tier?", "subscription_swaps_remaining?"]
    output: Member
    side_effects: []

  - method: GET
    path: "/members/{id}"
    description: "Member detail including no_show_count_30d and reservation_blocked_until"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/reservations"
    description: "Create a reservation; soft-holds an IDLE compatible battery"
    roles: [Member, StationOperator]
    code: 201
    input: [member_id, vehicle_id, station_id, slot_start_at, slot_end_at]
    output: Reservation
    side_effects:
      - "Pick one IDLE Battery at station compatible with Vehicle.vehicle_model_code"
      - "  Eligibility filter: Battery.status == IDLE AND Battery.station_id == station_id AND CompatibilityRule exists AND Battery.recall_flag == false AND Battery.id not already held by another BOOKED reservation"
      - "  Ranking: ORDER BY Battery.soh_pct DESC, then Battery.cycle_count ASC, then Battery.created_at ASC"
      - "  Tie-break: Battery.id ASC"
      - "  Fallback if empty: 409 ERR_NO_COMPATIBLE_BATTERY"
      - "Reservation.held_battery_id := picked battery id"

  - method: GET
    path: "/reservations"
    description: "List reservations with filters"
    roles: [Member, StationOperator, PlatformAdmin]
    code: 200
    input: ["member_id?", "station_id?", "status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/reservations/{id}"
    description: "Reservation detail"
    roles: [Member, StationOperator, PlatformAdmin]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/reservations/{id}/check-in"
    description: "Vehicle has arrived; reservation -> CHECKED_IN and SwapEvent created"
    roles: [StationOperator]
    code: 200
    input: []
    output: Reservation
    side_effects:
      - "Create SwapEvent (phase=CHECKED_IN)"
      - "Compute provisional billing"

  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a BOOKED reservation; soft-release held battery"
    roles: [Member, StationOperator]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/reservations/walk-in"
    description: "Create a walk-in reservation immediately (queue-aware)"
    roles: [StationOperator]
    code: 201
    input: [member_id, vehicle_id, station_id]
    output: Reservation
    side_effects:
      - "queue_position := (count of BOOKED+CHECKED_IN walk-in reservations at this station with same arrival) + 1"
      - "slot_start_at := now() + 5*queue_position minutes; slot_end_at := slot_start_at + 15 minutes"
      - "soft-hold a battery using same eligibility/ranking as /reservations"

  - method: GET
    path: "/swap-events/{id}"
    description: "Get swap event detail"
    roles: [StationOperator, PlatformAdmin, Member]
    code: 200
    input: []
    output: SwapEvent
    side_effects: []

  - method: POST
    path: "/swap-events/{id}/inspect"
    description: "Record pre-swap inspection (outgoing SOC)"
    roles: [StationOperator]
    code: 200
    input: [outgoing_soc_pct]
    output: SwapEvent
    side_effects: []

  - method: POST
    path: "/swap-events/{id}/uninstall"
    description: "Remove outgoing battery from vehicle; place into station inventory"
    roles: [StationOperator]
    code: 200
    input: []
    output: SwapEvent
    side_effects:
      - "Battery(outgoing) IN_USE -> IDLE; Vehicle.installed_battery_id := null"
      - "Station.idle_battery_count += 1"

  - method: POST
    path: "/swap-events/{id}/install"
    description: "Install incoming battery into vehicle; verify BMS handshake"
    roles: [StationOperator]
    code: 200
    input: [verify]
    output: SwapEvent
    side_effects:
      - "Battery(incoming) IDLE -> IN_USE; Vehicle.installed_battery_id := incoming"
      - "Station.idle_battery_count -= 1"

  - method: POST
    path: "/swap-events/{id}/complete"
    description: "Finalize swap and create BillingRecord"
    roles: [StationOperator]
    code: 200
    input: []
    output: SwapEvent
    side_effects:
      - "Reservation -> FULFILLED"
      - "Compute final billing (calc swap_billing variant final)"
      - "Create BillingRecord"
      - "If Member.subscription_swaps_remaining > 0 decrement and apply subscription_deduction_cents"

  - method: POST
    path: "/swap-events/{id}/abort"
    description: "Abort an in-progress swap (compensating action)"
    roles: [StationOperator]
    code: 200
    input: []
    output: SwapEvent
    side_effects: ["Compensating: re-install outgoing battery if already uninstalled; release held battery"]

  - method: POST
    path: "/dispatch-orders"
    description: "Create a cross-station dispatch order"
    roles: [PlatformAdmin]
    code: 201
    input: [source_station_id, dest_station_id, battery_id]
    output: DispatchOrder
    side_effects: []

  - method: POST
    path: "/dispatch-orders/{id}/dispatch"
    description: "Begin transit (battery -> IN_TRANSIT)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DispatchOrder
    side_effects: []

  - method: POST
    path: "/dispatch-orders/{id}/deliver"
    description: "Arrival at destination (battery -> IDLE at dest_station)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DispatchOrder
    side_effects: []

  - method: POST
    path: "/dispatch-orders/{id}/cancel"
    description: "Cancel a REQUESTED dispatch"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: DispatchOrder
    side_effects: []

  - method: POST
    path: "/recalls"
    description: "Manufacturer recall affecting specific serial numbers"
    roles: [PlatformAdmin]
    code: 201
    input: [battery_model_code, serial_numbers]
    output: object
    side_effects: ["Each matching Battery: apply recall (sets recall_flag, status -> RETIRED, cascade_stage -> END_OF_LIFE)"]

  - method: GET
    path: "/billing-records"
    description: "List billing records"
    roles: [Member, PlatformAdmin]
    code: 200
    input: ["member_id?", "payment_status?", "limit?", "offset?"]
    output: BillingRecord[]
    side_effects: []

  - method: GET
    path: "/billing-records/{id}"
    description: "Billing record detail"
    roles: [Member, PlatformAdmin]
    code: 200
    input: []
    output: BillingRecord
    side_effects: []

  - method: POST
    path: "/billing-records/{id}/pay"
    description: "Mark billing as PAID (mock payment-system event)"
    roles: [Member]
    code: 200
    input: []
    output: BillingRecord
    side_effects: ["Emit PAYMENT_OK event"]

  - method: POST
    path: "/billing-records/{id}/mark-failed"
    description: "Mark billing as FAILED (system-only)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BillingRecord
    side_effects: []

  - method: POST
    path: "/billing-records/{id}/refund"
    description: "Refund a PAID billing record"
    roles: [PlatformAdmin]
    code: 200
    input: [refund_cents]
    output: BillingRecord
    side_effects:
      - "Set BillingRecord.payment_status := REFUNDED"
      - "If full refund AND subscription_deduction was applied: restore Member.subscription_swaps_remaining += 1"

  - method: GET
    path: "/audit-logs"
    description: "List audit logs"
    roles: [PlatformAdmin]
    code: 200
    input: ["entity_type?", "entity_id?", "event_type?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server clock"
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso]
    output: object
    side_effects: []

  - method: POST
    path: "/_sweep/no-show"
    description: "Test-only: run the no-show sweep that flips BOOKED -> NO_SHOW for expired reservations"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects: ["For each reservation BOOKED with now() > slot_end_at, transition to NO_SHOW; cascade Member.no_show_count_30d and possibly Member.reservation_blocked_until"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "X-User-Role or X-User-ID header missing"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not authorized for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a valid 'from' state for the requested transition"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "version field on PATCH does not match current resource version"
  - id: ERR_BATTERY_RECALLED
    http: 409
    condition: "Battery.recall_flag == true blocks the requested operation"
  - id: ERR_INCOMPATIBLE_MODEL
    http: 422
    condition: "No CompatibilityRule with connector_match and bms_handshake_supported between vehicle and battery model"
  - id: ERR_INVALID_TIME_SLOT
    http: 422
    condition: "Reservation slot is malformed (slot_end != slot_start + 15 min, or slot_start in the past)"
  - id: ERR_RESERVATION_OVERLAP_MEMBER
    http: 409
    condition: "Member has another BOOKED reservation that overlaps (half-open, touching boundaries OK)"
  - id: ERR_STATION_CAPACITY_FULL
    http: 409
    condition: "Adding this reservation would exceed Station.total_slots concurrent strict overlaps (touching OK)"
  - id: ERR_NO_COMPATIBLE_BATTERY
    http: 409
    condition: "No eligible IDLE battery at the station for the vehicle model"
  - id: ERR_MEMBER_BLOCKED
    http: 403
    condition: "Member.reservation_blocked_until is in the future (no-show penalty)"
  - id: ERR_REFUND_EXCEEDS_PAID
    http: 422
    condition: "refund_cents out of (0, amount_due_cents]"
  - id: ERR_BATTERY_NOT_IDLE
    http: 409
    condition: "Battery is not IDLE or not at the expected station for dispatch"
  - id: ERR_INVALID_DISPATCH
    http: 422
    condition: "source_station_id equals dest_station_id, or other dispatch field invalid"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit out of [1,100] or offset < 0"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Unique field violation (battery serial_number, member phone, model code, vin)"
  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Generic missing/invalid required field"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "An EV owner who makes reservations and pays for swaps"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /billing-records/{id}/pay"
    shared_operations:
      - "POST /reservations (with StationOperator)"
      - "POST /reservations/{id}/cancel (with StationOperator)"
      - "POST /vehicles (with PlatformAdmin)"
      - "GET /reservations (own only)"
      - "GET /billing-records (own only)"
      - "GET /members/{id} (self only)"

  - name: StationOperator
    description: "On-site staff who run the swap process"
    identity: "entity_backed:Station"
    exclusive_operations:
      - "POST /reservations/walk-in"
      - "POST /reservations/{id}/check-in"
      - "POST /swap-events/{id}/inspect"
      - "POST /swap-events/{id}/uninstall"
      - "POST /swap-events/{id}/install"
      - "POST /swap-events/{id}/complete"
      - "POST /swap-events/{id}/abort"
      - "POST /batteries/{id}/start-charging"
      - "POST /batteries/{id}/finish-charging"
      - "POST /batteries/{id}/report-fault"
      - "POST /batteries/{id}/clear-fault"
    shared_operations:
      - "POST /reservations (with Member)"
      - "POST /reservations/{id}/cancel (with Member)"

  - name: PlatformAdmin
    description: "Operator with platform-wide administrative powers"
    identity: "opaque"
    exclusive_operations:
      - "POST /stations"
      - "POST /stations/{id}/charging-slots"
      - "POST /battery-models"
      - "POST /vehicle-models"
      - "POST /compatibility-rules"
      - "POST /batteries"
      - "POST /batteries/{id}/grade-cascade"
      - "POST /batteries/{id}/recycle"
      - "POST /dispatch-orders"
      - "POST /dispatch-orders/{id}/dispatch"
      - "POST /dispatch-orders/{id}/deliver"
      - "POST /dispatch-orders/{id}/cancel"
      - "POST /recalls"
      - "POST /members"
      - "POST /billing-records/{id}/mark-failed"
      - "POST /billing-records/{id}/refund"
      - "GET /audit-logs"
      - "POST /_clock/advance"
      - "POST /_sweep/no-show"
    shared_operations:
      - "POST /vehicles (with Member)"
