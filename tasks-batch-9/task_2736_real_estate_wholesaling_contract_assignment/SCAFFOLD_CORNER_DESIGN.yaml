            - "PurchaseContract.${pc_id}.contract_status == DRAFT, assignment_status == NOT_MARKETED, structure_election == UNDECIDED"
            - "PurchaseContract.${pc_id}.assignment_deadline_at == 2026-09-13T00:00:00Z (closing_window_start_at minus 48h)"
            - "SellerLead.${sl_id}.status == UNDER_CONTRACT"

      - name: equity_skimming_outranks_mao_exceeded_on_contract_create
        claim_type: priority_ordering
        grounds:
          - validations[priority=28]
          - validations[priority=40]
          - errors[ERR_EQUITY_SKIMMING_PROHIBITED]
        distinguishing_aspect: "One request violates both the seller-protection floor at priority 28 (price 6000000 < 18200000) and the underwriting ceiling at priority 40 (price 6000000 > max_allowable_offer_cents 5000000); the response must be ERR_EQUITY_SKIMMING_PROHIBITED, never ERR_MAO_EXCEEDED."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-06T00:00:00Z."
            - "One wholesaler; one PROTECTED lead (market value 30000000, senior lien 500000, two distress flags) whose equity floor is 18200000."
            - "One deliberately pessimistic FINALIZED AGGRESSIVE analysis over three 10000000 comparables with a 1500000 low-side roof scope, giving max_allowable_offer_cents floor(10000000 * 0.75) - 1500000 - 1000000 == 5000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wholesalers"
              payload: { legal_name: "Keystone Property Partners LLC", state_code: "TX", disclosure_template_version: "DISC-2026.1" }
              as: PlatformAdmin
              captures: { w_id: "$.data.id" }
            - call: "POST /seller-leads"
              payload: { wholesaler_id: "${w_id}", owner_name: "Dana Ruiz", property_address: "118 Cedar St, Austin TX", state_code: "TX", estimated_market_value_cents: 30000000, recorded_senior_lien_cents: 500000, distress_flags: ["FORECLOSURE_NOTICE", "PROBATE"] }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_id: "$.data.id" }
            - call: "POST /seller-leads/${sl_id}/protection-screen"
              payload: { screening_variant: "STATUTORY" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { sl_v2: "$.data.version" }
            - call: "POST /deal-analyses"
              payload:
                seller_lead_id: "${sl_id}"
                subject_gla_sqft: 1800
                comparables:
                  - { sale_price_cents: 10000000, distance_miles: 0.10, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                  - { sale_price_cents: 10000000, distance_miles: 0.20, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                  - { sale_price_cents: 10000000, distance_miles: 0.30, closed_days_ago: 10, gla_sqft: 1800, adjustment_cents: 0 }
                repair_scope_items:
                  - { code: "ROOF", low_cents: 1500000, high_cents: 1800000 }
                expected_seller_lead_version: "${sl_v2}"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { da_id: "$.data.id" }
            - call: "POST /deal-analyses/${da_id}/finalize"
              payload: { valuation_variant: "AGGRESSIVE" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { mao: "$.data.max_allowable_offer_cents" }
          trigger:
            - call: "POST /purchase-contracts"
              payload:
                seller_lead_id: "${sl_id}"
                deal_analysis_id: "${da_id}"
                purchase_price_cents: 6000000
                earnest_money_cents: 200000
                inspection_period_days: 7
                option_start_at: "2026-08-06T00:00:00Z"
                closing_window_start_at: "2026-09-15T00:00:00Z"
                closing_window_end_at: "2026-09-30T00:00:00Z"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${mao} == 5000000, so the attempted price 6000000 does violate the priority 40 ceiling as well"
            - "Response status is 422 and ${err} == ERR_EQUITY_SKIMMING_PROHIBITED, not ERR_MAO_EXCEEDED"
            - "Exactly one error_id is reported; the response is a single error object, not a list of violations"
            - "GET /purchase-contracts filtered by seller_lead_id ${sl_id} returns total_count == 0"

      - name: sms_campaign_publish_without_dnc_scrub_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - errors[ERR_DNC_SCRUB_REQUIRED]
          - state_machines.MarketingCampaign.DRAFT_to_PUBLISHED.preconditions
        distinguishing_aspect: "Conditional validation: the do-not-call scrub is demanded only for the SMS and COLD_CALL channels, so an SMS campaign with full disclosures but dnc_scrubbed false is rejected 422 ERR_DNC_SCRUB_REQUIRED while the identical DIRECT_MAIL campaign publishes."
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-02T00:00:00Z."
            - "One wholesaler with two DRAFT campaigns that both disclose intent to assign and unlicensed status and both leave dnc_scrubbed at its false default: one on SMS, one on DIRECT_MAIL."
          setup_api_calls:
