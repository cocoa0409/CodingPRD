      - name: committee_decline_appraisal_cancellation_cascade
        grounds:
          - state_machines.CommitteeDecision.OPEN_to_DECLINED
          - state_machines.LoanApplication.COMMITTEE_REVIEW_to_DECLINED
          - state_machines.Appraisal.ENGAGED_to_CANCELLED
          - calculations.committee_quorum_rule
        distinguishing_aspect: |
          Depth-3 cascade triggered by a VOTE (distinct trigger from the clock
          cascade above): a member's DECLINE vote closes the decision (hop 1),
          the declined decision moves the application to DECLINED (hop 2), and
          the application's decline cancels the still-ENGAGED second appraisal
          the committee had ordered mid-review (hop 3) — which itself frees
          the appraiser's engagement window for another application.
        test_recipe:
          setup:
            - "Application at COMMITTEE_REVIEW, proposed == 60,000,000 (SMALL: decline threshold 1); appraisal A1 ACCEPTED (120,000,000 appraised); appraisal A2 ENGAGED mid-review with appraiser2 window 2026-08-11..2026-08-14"
