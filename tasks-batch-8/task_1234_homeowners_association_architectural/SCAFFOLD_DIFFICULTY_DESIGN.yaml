            - { call: "POST /arc/_sweeps/daily", as: Manager, captures: { deemed_d5: $.data.applications_deemed_approved } }
            - { call: "GET /arc/applications/${app}", as: Manager, captures: { status_d5: $.data.status } }
          assert:
            - "at elapsed == 4 (2026-05-05): applications_deemed_approved == 0 and status == UNDER_REVIEW"
            - "at elapsed == 5 (2026-05-06): applications_deemed_approved == 1 and status == DEEMED_APPROVED"

      - name: quorum_ratio_exactly_two_thirds_approves
        grounds:
          - calculations.quorum_decision_tally
          - entities.Association.fields.quorum_min
        distinguishing_aspect: |
          Metric: approve ratio A/(A+D). A=2,D=1 lands exactly on 2/3 and approves (>=
          boundary, integer-pinned as 3*A >= 2*(A+D)); A=1,D=2 denies. Also exercises
          quorum at exactly quorum_min=3. Reached via POST /arc/applications/{id}/decide —
          distinct endpoint and metric from the sweep-day boundary.
        test_recipe:
          setup:
            - "Association supermajority_required=true, committee_size 5, quorum_min 3"
            - "Two complete applications (same property) UNDER_REVIEW at 2026-05-01; app1 ballots A,A,D; app2 ballots A,D,D"
