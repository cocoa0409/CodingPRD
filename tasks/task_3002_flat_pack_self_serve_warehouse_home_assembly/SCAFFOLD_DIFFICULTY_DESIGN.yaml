              payload: { provider_id: "CREW-A", window_start: "2026-09-10T10:00:00Z", window_end: "2026-09-10T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /api/orders/${order_id}/pickup-complete"
              payload: {}
              as: StoreOps
            - call: "POST /api/orders/${order_id}/assembly-jobs"
              payload: { provider_id: "CREW-A", window_start: "2026-09-10T10:00:00Z", window_end: "2026-09-10T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { job_id: $.data.id, job_st: $.data.status, job_est: $.data.estimated_minutes }
          assert:
            - "first attempt: error_id == ERR_INVALID_STATE (409) — order PAID is neither FULFILLED nor DELIVERED"
            - "after pickup-complete (Order FULFILLED), the identical job request succeeds: status REQUESTED, estimated_minutes == 30"
