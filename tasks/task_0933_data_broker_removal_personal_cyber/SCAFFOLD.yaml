      escalated_alert_count: integer
      unchanged_alert_count: integer
    side_effects:
      - "increments BreachEvent.ingest_count"
      - "creates BreachAlert rows for newly matched identifiers (INITIAL_INGEST variant)"
      - "raises severity / severity_points / escalation_count on existing alerts whose recomputed ordinal is strictly higher (RE_INGEST_MONOTONE variant)"
      - "leaves existing alerts whose recomputed ordinal is lower or equal completely untouched, including updated_at and version"

  - method: GET
    path: "/breach-alerts"
