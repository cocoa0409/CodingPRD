      - name: platform_admin_cannot_be_denied_the_clock_control
        claim_type: Shared operations
        grounds:
          - roles.PlatformAdmin
          - endpoints.POST_/api/_clock/set_current_utc
        distinguishing_aspect: "The logical clock is exclusive to PlatformAdmin; the same call as MonetizationReviewer is rejected, proving the exclusivity is real rather than advertised."
