  # =====================================================================
  # SECTION: validations
  # =====================================================================
  - section: validations
    instances:
      - name: weight_below_tare_rejected
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=8]'
          - 'errors[ERR_WEIGHT_BELOW_TARE]'
        distinguishing_aspect: "A WEIGHT count line whose gross_weight_g (500) equals the product's empty_container_weight_g (500) yields net liquid 0 and is rejected with ERR_WEIGHT_BELOW_TARE at finalize (422)."
        test_recipe:
          setup: ["gin empty 500; OPEN session with WEIGHT line gross 500"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GIN-BT", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000, empty_container_weight_g: 500, density_g_per_ml: 0.94 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /count-sessions"
              payload: { label: "BT", counted_at: "2026-02-10T00:00:00Z" }
              as: InventoryManager
              captures: { cs_id: $.data.id, cs_v: $.data.version }
            - call: "POST /count-sessions/${cs_id}/count-lines"
              payload: { product_id: "${pid}", count_method: "WEIGHT", gross_weight_g: 500, expected_count_session_version: "${cs_v}" }
              as: InventoryManager
              captures: { cs_v2: $.data.version }
          trigger:
            - call: "POST /count-sessions/${cs_id}/finalize"
              payload: { expected_count_session_version: "${cs_v2}" }
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_WEIGHT_BELOW_TARE"

      - name: keg_yield_on_bottle_rejected_not_a_keg
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=9]'
          - 'errors[ERR_NOT_A_KEG]'
        distinguishing_aspect: "GET /products/{id}/keg-yield on a BOTTLE product returns ERR_NOT_A_KEG (422)."
        test_recipe:
          setup: ["a BOTTLE product"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GIN-NK", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /products/${pid}/keg-yield"
              payload: { pour_size_ml: 44 }
              as: BarManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_NOT_A_KEG"

      - name: invalid_par_reorder_point_above_par_rejected
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=10]'
          - 'errors[ERR_INVALID_PAR]'
        distinguishing_aspect: "POST /par-settings with reorder_point_units 30 > par_level_units 24 returns ERR_INVALID_PAR (422)."
        test_recipe:
          setup: ["a product"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "VOD-IP", name: "Vodka", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2200 }
              as: InventoryManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /par-settings"
              payload: { product_id: "${pid}", par_level_units: 24, reorder_point_units: 30 }
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_INVALID_PAR"

      - name: duplicate_count_line_for_product_rejected
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=12]'
          - 'errors[ERR_DUPLICATE_COUNT_LINE]'
        distinguishing_aspect: "Adding a second CountLine for the same product in one session returns ERR_DUPLICATE_COUNT_LINE (409)."
        test_recipe:
          setup: ["OPEN session already has a line for product P"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-DC", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /count-sessions"
              payload: { label: "DC", counted_at: "2026-02-10T00:00:00Z" }
              as: InventoryManager
              captures: { cs_id: $.data.id, cs_v: $.data.version }
            - call: "POST /count-sessions/${cs_id}/count-lines"
              payload: { product_id: "${pid}", count_method: "UNITS", counted_units: 2, expected_count_session_version: "${cs_v}" }
              as: InventoryManager
              captures: { cs_v2: $.data.version }
          trigger:
            - call: "POST /count-sessions/${cs_id}/count-lines"
              payload: { product_id: "${pid}", count_method: "UNITS", counted_units: 3, expected_count_session_version: "${cs_v2}" }
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_DUPLICATE_COUNT_LINE"

      - name: reorder_suggestion_without_active_par_rejected
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=13]'
          - 'errors[ERR_NO_ACTIVE_PAR]'
        distinguishing_aspect: "GET /products/{id}/reorder-suggestion for a product with no ACTIVE ParSetting returns ERR_NO_ACTIVE_PAR (422)."
        test_recipe:
          setup: ["a product with no par setting"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-NP", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /products/${pid}/reorder-suggestion"
              payload: {}
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_NO_ACTIVE_PAR"

      - name: empty_menu_engineering_rejected
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=14]'
          - 'errors[ERR_EMPTY_MENU]'
        distinguishing_aspect: "GET /menu-items/engineering with no ACTIVE menu item (zero cumulative sales) returns ERR_EMPTY_MENU (422)."
        test_recipe:
          setup: ["empty DB, no menu items"]
          setup_api_calls: []
          trigger:
            - call: "GET /menu-items/engineering"
              payload: {}
              as: BarManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_EMPTY_MENU"

      - name: short_receipt_blocks_po_close
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=15]'
          - 'errors[ERR_SHORT_RECEIPT]'
          - 'state_machines.PurchaseOrder.RECEIVED_to_CLOSED'
        distinguishing_aspect: "Closing a RECEIVED PO whose posted invoice received fewer units (4) than ordered (10) returns ERR_SHORT_RECEIPT (422)."
        test_recipe:
          setup: ["PO ordered 10; invoice posted received only 4, advancing PO to RECEIVED"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-SR", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${pid}", ordered_qty: 10, unit_cost_cents: 100 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-SR", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${pid}", received_qty: 4, unit_cost_cents: 100 }
              as: PurchasingAgent
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
          trigger:
            - call: "POST /purchase-orders/${po_id}/close"
              payload: {}
              as: PurchasingAgent
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_SHORT_RECEIPT"

      - name: invoice_line_product_not_on_po_rejected
        claim_type: Cross-entity validation
        grounds:
          - 'validations[priority=6]'
          - 'errors[ERR_PRODUCT_NOT_ON_PO]'
        distinguishing_aspect: "Adding an invoice line whose product is not on any POLine of the invoice's PO returns ERR_PRODUCT_NOT_ON_PO (422)."
        test_recipe:
          setup: ["PO submitted with product A only; DRAFT invoice; attempt to bill product B not on PO"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-ON", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pa: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-OFF", name: "B", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 200 }
              as: InventoryManager
              captures: { pb: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${pa}", ordered_qty: 5, unit_cost_cents: 100 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-ON", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${pb}", received_qty: 1, unit_cost_cents: 200 }
              as: PurchasingAgent
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_PRODUCT_NOT_ON_PO"

  # =====================================================================
  # SECTION: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: keg_yield_default_line_loss_applied
        claim_type: Computed read
        grounds:
          - 'endpoints.GET./products/{id}/keg-yield'
          - 'calculations.keg_yield'
        distinguishing_aspect: "Omitting line_loss_pct applies the DEFAULT_LINE_LOSS_PCT 0.05, so servings_net == 117 (same as the explicit 0.05 case) for a 58670 mL keg at pour 473."
        test_recipe:
          setup: ["a KEG product"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "KEG-DL", name: "Lager", container_type: "KEG", container_volume_ml: 58670, unit_cost_cents: 15000 }
              as: InventoryManager
              captures: { keg_id: $.data.id }
          trigger:
            - call: "GET /products/${keg_id}/keg-yield"
              payload: { pour_size_ml: 473 }
              as: BarManager
          assert:
            - "response data.servings_theoretical == 124"
            - "response data.servings_net == 117"

      - name: record_sales_accumulates_units_sold
        claim_type: Action endpoint
        grounds:
          - 'endpoints.POST./menu-items/{id}/record-sales'
          - 'entities.MenuItem.fields.units_sold'
        distinguishing_aspect: "Two record-sales calls of 30 and 10 accumulate units_sold to 40 on the menu item."
        test_recipe:
          setup: ["published recipe + ACTIVE menu item"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "RUM-RS", name: "Rum", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 1800 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /recipes"
              payload: { name: "Daiq RS" }
              as: BarManager
              captures: { rec_id: $.data.id }
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${pid}", pour_ml: 60 }
              as: BarManager
            - call: "POST /recipes/${rec_id}/publish"
              payload: {}
              as: BarManager
            - call: "POST /menu-items"
              payload: { recipe_id: "${rec_id}", menu_price_cents: 900 }
              as: BarManager
              captures: { mi_id: $.data.id }
            - call: "POST /menu-items/${mi_id}/record-sales"
              payload: { quantity: 30, sold_at: "2026-03-05T00:00:00Z" }
              as: BarManager
          trigger:
            - call: "POST /menu-items/${mi_id}/record-sales"
              payload: { quantity: 10, sold_at: "2026-03-06T00:00:00Z" }
              as: BarManager
          assert:
            - "MenuItem.${mi_id}.units_sold == 40"

  # =====================================================================
  # SECTION: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: bar_manager_cannot_create_product
        claim_type: peer_roles
        grounds:
          - 'roles.BarManager'
          - 'roles.InventoryManager'
          - 'endpoints.POST./products'
        distinguishing_aspect: "POST /products is exclusive to InventoryManager; a BarManager attempting it gets ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "GIN-RB", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: BarManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 403"
            - "response data.error_id == ERR_UNAUTHORIZED"

      - name: inventory_manager_cannot_post_invoice
        claim_type: peer_roles
        grounds:
          - 'roles.InventoryManager'
          - 'roles.PurchasingAgent'
          - 'endpoints.POST./invoices/{id}/post'
        distinguishing_aspect: "POST /invoices/{id}/post is exclusive to PurchasingAgent; an InventoryManager attempting it gets ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["a DRAFT invoice on a submitted PO"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-IV", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${pid}", ordered_qty: 2, unit_cost_cents: 100 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-IV", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${pid}", received_qty: 2, unit_cost_cents: 100 }
              as: PurchasingAgent
          trigger:
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 403"
            - "response data.error_id == ERR_UNAUTHORIZED"

      - name: unknown_role_returns_unauthenticated
        claim_type: peer_roles
        grounds:
          - 'validations[priority=1]'
          - 'errors[ERR_UNAUTHENTICATED]'
        distinguishing_aspect: "A request with an unknown X-User-Role (Stranger) returns ERR_UNAUTHENTICATED (401) before any business processing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "GIN-NA", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: Stranger
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 401"
            - "response data.error_id == ERR_UNAUTHENTICATED"

  # =====================================================================
  # SECTION: cross_cutting (complexity layers)
  # =====================================================================
  - section: cross_cutting
    instances:
      - name: occ_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[countline-add-stale-session]'
          - 'entities.CountSession.fields.version'
        distinguishing_aspect: "Adding a count-line with the current expected_count_session_version succeeds and increments CountSession.version from 1 to 2."
        test_recipe:
          setup: ["fresh OPEN count session at version 1"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-OK", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /count-sessions"
              payload: { label: "OK", counted_at: "2026-02-10T00:00:00Z" }
              as: InventoryManager
              captures: { cs_id: $.data.id, cs_v: $.data.version }
          trigger:
            - call: "POST /count-sessions/${cs_id}/count-lines"
              payload: { product_id: "${pid}", count_method: "UNITS", counted_units: 2, expected_count_session_version: "${cs_v}" }
              as: InventoryManager
              captures: { new_v: $.data.version }
          assert:
            - "response status == 201"
            - "CountSession.${cs_id}.version == 2"

      - name: occ_stale_version_on_countline_add_rejected
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[countline-add-stale-session]'
          - 'errors[ERR_STALE_VERSION]'
        distinguishing_aspect: "After one count-line add bumps the session to version 2, a second add still carrying the stale captured version-1 value is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["OPEN session; one line added (version now 2); second add reuses the stale version-1 value"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-ST1", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pa: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-ST2", name: "B", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pb: $.data.id }
            - call: "POST /count-sessions"
              payload: { label: "ST", counted_at: "2026-02-10T00:00:00Z" }
              as: InventoryManager
              captures: { cs_id: $.data.id, cs_v1: $.data.version }
            - call: "POST /count-sessions/${cs_id}/count-lines"
              payload: { product_id: "${pa}", count_method: "UNITS", counted_units: 2, expected_count_session_version: "${cs_v1}" }
              as: InventoryManager
          trigger:
            - call: "POST /count-sessions/${cs_id}/count-lines"
              payload: { product_id: "${pb}", count_method: "UNITS", counted_units: 1, expected_count_session_version: "${cs_v1}" }
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 412"
            - "response data.error_id == ERR_STALE_VERSION"

      - name: archived_product_excluded_from_default_list
        claim_type: soft_delete
        grounds:
          - 'entities.Product.fields.status'
          - 'endpoints.GET./products'
        distinguishing_aspect: "An ARCHIVED product is excluded from GET /products when status=ACTIVE is supplied; only the one ACTIVE product is returned."
        test_recipe:
          setup: ["one ACTIVE product and one ARCHIVED product"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-AC", name: "Active", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
            - call: "POST /products"
              payload: { sku: "P-AR", name: "ToArchive", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { arid: $.data.id }
            - call: "POST /products/${arid}/archive"
              payload: {}
              as: InventoryManager
          trigger:
            - call: "GET /products"
              payload: { status: "ACTIVE" }
              as: InventoryManager
          assert:
            - "response total_count == 1"
            - "the ARCHIVED product ${arid} is not in the ACTIVE-filtered listing"

      - name: par_supersede_recomputes_reorder_flag
        claim_type: derived_field_reconciliation
        grounds:
          - 'endpoints.POST./par-settings'
          - 'entities.ParSetting.fields.status'
          - 'entities.Product.fields.needs_reorder'
        distinguishing_aspect: "Creating a second ParSetting supersedes the prior (status SUPERSEDED) and recomputes Product.needs_reorder against the new reorder_point; with on_hand 0 and the new reorder_point 5, needs_reorder becomes true."
        test_recipe:
          setup: ["product on_hand 0; first par reorder_point 0 (no reorder); then a second par reorder_point 5"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-SUP", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 100 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /par-settings"
              payload: { product_id: "${pid}", par_level_units: 10, reorder_point_units: 0 }
              as: InventoryManager
              captures: { par1_id: $.data.id }
          trigger:
            - call: "POST /par-settings"
              payload: { product_id: "${pid}", par_level_units: 12, reorder_point_units: 5 }
              as: InventoryManager
              captures: { par2_id: $.data.id }
          assert:
            - "ParSetting.${par1_id}.status == SUPERSEDED"
            - "ParSetting.${par2_id}.status == ACTIVE"
            - "Product.${pid}.needs_reorder == true"

  # =====================================================================
  # SECTION: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: invoice_post_immediate_landed_cost_visible
        claim_type: immediate
        grounds:
          - 'state_machines.Invoice.DRAFT_to_POSTED'
          - 'entities.Product.fields.unit_cost_cents'
        distinguishing_aspect: "Posting an invoice immediately lands the billed unit_cost on the Product: unit_cost_cents updates from 2000 to 2150 and on_hand_units to 3 on post, visible on the next read."
        test_recipe:
          setup: ["product unit_cost 2000; submitted PO; invoice line billed at 2150"]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-LC", name: "A", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { pid: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${pid}", ordered_qty: 3, unit_cost_cents: 2000 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-LC", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${pid}", received_qty: 3, unit_cost_cents: 2150 }
              as: PurchasingAgent
          trigger:
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
          assert:
            - "Product.${pid}.unit_cost_cents == 2150"
            - "Product.${pid}.on_hand_units == 3"

  # =====================================================================
  # SECTION: errors — stubs already covered by §1.8 difficulty instances
  # =====================================================================
  - section: errors
    instances:
      - name: error_stale_version_on_finalize_stub
        claim_type: Violation → Error
        grounds:
          - 'concurrency_rules[count-finalize-stale-session]'
          - 'errors[ERR_STALE_VERSION]'
        excluded_because:
          difficulty_instance: dual_variant_calc / depletion_theoretical_vs_actual_variance_on_countline
          rationale: "The finalize OCC path uses the same expected_count_session_version mechanism exercised across §1.8 count-session finalize chains and the §1.9 OCC stale-version instance; the stale-version 412 is structurally identical on the finalize endpoint."
      - name: error_count_window_overlap_stub
        claim_type: Violation → Error
        grounds:
          - 'errors[ERR_COUNT_WINDOW_OVERLAP]'
        excluded_because:
          difficulty_instance: resource_temporal_overlap / count_window_strict_after_half_open
          rationale: "ERR_COUNT_WINDOW_OVERLAP is asserted as the failure path of the named §1.8 temporal-overlap instance."
      - name: error_line_overlap_stub
        claim_type: Violation → Error
        grounds:
          - 'errors[ERR_LINE_OVERLAP]'
        excluded_because:
          difficulty_instance: resource_temporal_overlap / keg_tap_closed_interval_overlap_adjacency_allowed
          rationale: "ERR_LINE_OVERLAP is asserted as the failure path of the named §1.8 keg-tap overlap instance."
      - name: error_recipe_not_published_stub
        claim_type: Violation → Error
        grounds:
          - 'errors[ERR_RECIPE_NOT_PUBLISHED]'
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / menuitem_requires_recipe_published
          rationale: "ERR_RECIPE_NOT_PUBLISHED is asserted as the failure path of the named §1.8 cross-entity instance."
