      - name: corner_plan_document_create_with_unknown_provider_not_found
        claim_type: flat
        grounds:
          - validations[priority=6]
          - errors.ERR_PLAN_PROVIDER_NOT_FOUND
        distinguishing_aspect: "Under the flat topology ownership travels only through FK fields in the body, so an unknown pooled_plan_provider_id on a POST is a 404 for the referenced collection — the same rule that a nested write path would have made structurally impossible."
        test_recipe:
          setup:
            - "One REGISTERED PooledPlanProvider that sponsors nothing yet, so every acting identity below is a real row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegulatorOps
            - call: "POST /pep/plan-providers"
              payload: { legal_name: "Meridian Pooled Plan Services LLC", ein: "410000001", fidelity_bond_amount_cents: 100000000 }
              as: RegulatorOps
              captures: { ppp_id: $.data.id }
            - call: "POST /pep/plan-providers/${ppp_id}/register"
              payload: { registration_effective_date: "2026-08-03" }
              as: RegulatorOps
          trigger:
            - call: "POST /pep/plan-documents"
              payload: { pooled_plan_provider_id: "00000000-0000-4000-8000-000000000000", plan_name: "Meridian PEP", plan_number: "001", plan_year_end_date: "2026-12-31", base_eligibility_min_age: 21, base_eligibility_service_months: 12, base_vesting_schedule: "CLIFF_3YR", base_match_formula_code: "SAFE_HARBOR_BASIC" }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              expect_error: ERR_PLAN_PROVIDER_NOT_FOUND
            - call: "POST /pep/adopting-employers"
              payload: { plan_document_id: "00000000-0000-4000-8000-000000000000", legal_name: "Palisade Machining LLC", ein: "420000041", election_window_close_date: "2026-09-30", participant_count: 13, hce_count: 3, nhce_count: 10, benefiting_hce_count: 3, benefiting_nhce_count: 9, hce_avg_deferral_pct: 6.00, nhce_avg_deferral_pct: 4.00 }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              expect_error: ERR_PLAN_DOCUMENT_NOT_FOUND
            - call: "POST /pep/plan-documents"
              payload: { pooled_plan_provider_id: "${ppp_id}", plan_name: "Meridian PEP", plan_number: "001", plan_year_end_date: "2026-12-31", base_eligibility_min_age: 21, base_eligibility_service_months: 12, base_vesting_schedule: "CLIFF_3YR", base_match_formula_code: "SAFE_HARBOR_BASIC" }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
              captures: { plan_id: $.data.id }
          assert:
            - "the unknown pooled_plan_provider_id returns 404 ERR_PLAN_PROVIDER_NOT_FOUND and the unknown plan_document_id returns 404 ERR_PLAN_DOCUMENT_NOT_FOUND — the error id names the collection the missing FK points at"
            - "neither 404 is a 403: priority 4 has no owning row to compare X-User-ID against when the body FK does not resolve, so the priority-6 FK check decides"
            - "the third call, identical to the first but carrying the real provider id, returns 201 — the only difference between the rejected and accepted request is FK resolvability"
            - "GET /pep/plan-providers/${ppp_id}/plan-documents returns total_count == 1"

