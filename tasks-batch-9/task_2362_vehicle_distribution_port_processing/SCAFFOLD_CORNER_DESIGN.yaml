          - errors.ERR_RELEASE_ORDER_NOT_FOUND
          - errors.ERR_HOLD_ORDER_NOT_FOUND
        distinguishing_aspect: "Nine reads against unknown but well-formed UUIDs each return the entity-specific 404 code for their own path segment — no shared generic ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database; only the logical clock is set."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
          trigger:
            - call: "GET /vpc/processing-centers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PortOperationsPlanner
              captures: { e_center: $.data.error_id }
            - call: "GET /vpc/vessels/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PortOperationsPlanner
              captures: { e_vessel: $.data.error_id }
