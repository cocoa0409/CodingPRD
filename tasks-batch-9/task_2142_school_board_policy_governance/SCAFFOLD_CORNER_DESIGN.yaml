              payload: { to_iso8601: "2026-08-09T00:00:00Z" }
              as: BoardClerk
          trigger:
            - call: "POST /governance/manual-publications/${pub}/publish"
              payload: {}
              as: PolicyAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_PUBLICATION_ALREADY_PUBLISHED"
            - "ManualPublication.${pub}.published_at == 2026-08-02T18:00:00Z"
            - "ManualPublication.${pub}.status == PUBLISHED"
            - "ManualPublication.${pub}.entry_count == 1"

      - name: first_reading_item_on_an_already_read_version_returns_not_eligible
        claim_type: Violation to Error
        grounds:
          - errors[ERR_POLICY_VERSION_NOT_ELIGIBLE]
          - validations[priority=70]
        distinguishing_aspect: "POLICY_FIRST_READING demands a DRAFT version; listing a WITHDRAWN version on an unlocked agenda returns ERR_POLICY_VERSION_NOT_ELIGIBLE at HTTP 422 with no agenda item created."
        test_recipe:
          setup:
            - "Policy BP-4119 with one version pv1 that has been WITHDRAWN."
            - "Meeting M is still DRAFT, so the agenda is not yet locked."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-4119", title: "Employee Conflict of Interest", category: "PERSONNEL", legal_requirement_level: "REQUIRED_BY_LAW", manual_section: "4000.19" }
              as: PolicyAnalyst
              captures: { pol: $.data.id, pol_v: $.data.version }
            - call: "POST /governance/policies/${pol}/versions"
              payload: { body_text: "Version one text.", summary_of_change: "Initial adoption draft", expected_policy_version: "${pol_v}" }
              as: PolicyAnalyst
              captures: { pv1: $.data.id }
            - call: "POST /governance/policy-versions/${pv1}/withdraw"
              payload: { withdrawn_reason: "Counsel asked for a rewrite." }
              as: PolicyAnalyst
            - call: "POST /governance/meetings"
              payload: { title: "September Regular Meeting", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-10T18:00:00Z" }
              as: BoardClerk
              captures: { m: $.data.id, m_v: $.data.version }
          trigger:
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${m}", item_type: "POLICY_FIRST_READING", title: "First reading of a withdrawn draft", expected_meeting_version: "${m_v}", policy_version_id: "${pv1}" }
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response data.error_id == ERR_POLICY_VERSION_NOT_ELIGIBLE"
            - "PolicyVersion.${pv1}.status == WITHDRAWN"
            - "GET /governance/agenda-items?meeting_id=${m} returns total_count == 0"

      - name: duplicate_notice_code_publication_label_and_cycle_year_each_conflict
        claim_type: Violation to Error
        grounds:
          - errors[ERR_DUPLICATE_NOTICE_CODE]
          - errors[ERR_DUPLICATE_PUBLICATION_LABEL]
          - errors[ERR_DUPLICATE_EVALUATION_CYCLE]
          - validations[priority=30]
        distinguishing_aspect: "Three independent global uniqueness scopes each raise their own 409: LegalMandate.notice_code, ManualPublication.publication_label and SuperintendentEvaluation.cycle_year."
        test_recipe:
          setup:
            - "One policy, one mandate LUS-2026-030, one edition 2026-FALL and one evaluation cycle 2027 already exist."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-9010", title: "Board Retreat Guidelines", category: "GOVERNANCE", legal_requirement_level: "LOCAL_DISCRETION", manual_section: "9000.10" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
            - call: "POST /governance/legal-mandates"
              payload: { notice_code: "LUS-2026-030", policy_id: "${pol}", citation: "GC 54954", issued_on: "2026-08-01T00:00:00Z", compliance_deadline: "2026-12-01T00:00:00Z", required_action: "ADOPT_NEW" }
              as: LegalUpdateService
              captures: { man: $.data.id }
            - call: "POST /governance/manual-publications"
