            - { call: "POST /iz-compliance/projects", payload: { name: "Mismatch One", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p1_id: $.data.id } }
