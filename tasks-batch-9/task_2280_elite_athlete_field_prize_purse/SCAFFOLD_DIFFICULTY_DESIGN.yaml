      - name: race_result_parallel_dimensions_with_record_resubmission_loop
        grounds:
          - state_machines.RaceResult.PROVISIONAL_to_CERTIFIED
          - state_machines.RaceResult.CLAIMED_to_SUBMITTED
          - state_machines.RaceResult.SUBMITTED_to_REJECTED
          - state_machines.RaceResult.SUBMITTED_to_RATIFIED
          - entities.RaceResult.fields.certification_status
          - entities.RaceResult.fields.record_claim_status
        distinguishing_aspect: >-
          RaceResult carries two INDEPENDENT state dimensions: certification_status stays pinned at
          CERTIFIED across four consecutive record_claim_status transitions (CLAIMED -> SUBMITTED ->
          REJECTED -> SUBMITTED -> RATIFIED), and the REJECTED -> SUBMITTED hop is a genuine loop back
          into a state the row already occupied. Falsifiable in one sentence: an implementation with a
          single status column either loses CERTIFIED when the claim moves, or refuses the second
          submission after a rejection, so it cannot report
          (certification_status == CERTIFIED, record_claim_status == RATIFIED,
          sanctioning_submission_ref == "PKG-2") at the end.
          Distinct from invitation_negotiation_cycle_offered_countered_to_round_cap, which is a cycle on
          ONE dimension of a different entity (Invitation) bounded by a counter rather than two
          dimensions moving independently.
        test_recipe:
          setup: >-
            Edition with course_record_male_seconds = 7500 so a 7412 finish raises a record claim at
            certify-results. One domestic ELITE MALE athlete, accepted, bibbed, raced, result certified,
