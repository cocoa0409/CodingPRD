    code: 200
    input: ["limit?", "offset?", "tour_id?", "gear_unit_id?", "rider_line_id?", "status?"]
    output: ReservationLine[]
    side_effects: []
  - method: POST
    path: "/backline/reservation-lines/{id}/dispatch"
    description: "SOURCED -> DISPATCHED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: ReservationLine
    side_effects: ["unit RESERVED -> OUT_ON_RENTAL", "increments ReservationLine.version"]
  - method: POST
