scaffold_difficulty_design:

  # =====================================================================
  # RULE 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: depletion_theoretical_vs_actual_variance_on_countline
        grounds:
          - calculations.depletion_variance
          - state_machines.CountSession.OPEN_to_FINALIZED
          - entities.CountLine.fields.variance_units
          - entities.CountLine.fields.theoretical_units
        distinguishing_aspect: "On CountLine for the Tequila Product, the theoretical variant (sales x recipe pour / container = 2.6667 units) and the actual variant (prior 0 + received 8 - closing 4.5 = 3.5 units) diverge, yielding variance_units 0.8333 and variance_cost_cents 2079 — depletion accounting on the inventory/count domain."
        test_recipe:
          setup:
            - "Tequila Product (BOTTLE, 750 mL); unit_cost lands at 2495 after the invoice posts"
            - "PUBLISHED Margarita recipe with one tequila line pour_ml=50; MenuItem at 1300 sells it; 40 units sold in window"
            - "PO submitted, invoice posts received_qty=8 tequila so on-hand and landed cost are set"
            - "OPEN count session counted_at after the sales; one WEIGHT count line closing to 4.5 bottles"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: InventoryManager
            - call: "POST /products"
              payload: { sku: "TEQ-750", name: "Tequila", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2400, empty_container_weight_g: 500, density_g_per_ml: 0.94, case_pack: 12 }
              as: InventoryManager
              captures: { teq_id: $.data.id }
            - call: "POST /recipes"
              payload: { name: "Margarita" }
              as: BarManager
              captures: { rec_id: $.data.id }
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${teq_id}", pour_ml: 50 }
              as: BarManager
            - call: "POST /recipes/${rec_id}/publish"
              payload: {}
              as: BarManager
            - call: "POST /menu-items"
              payload: { recipe_id: "${rec_id}", menu_price_cents: 1300 }
              as: BarManager
              captures: { mi_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme Spirits", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${teq_id}", ordered_qty: 8, unit_cost_cents: 2495 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-1", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${teq_id}", received_qty: 8, unit_cost_cents: 2495 }
              as: PurchasingAgent
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
            - call: "POST /menu-items/${mi_id}/record-sales"
              payload: { quantity: 40, sold_at: "2026-03-10T00:00:00Z" }
              as: BarManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-31T00:00:00Z" }
              as: InventoryManager
            - call: "POST /count-sessions"
              payload: { label: "March end", counted_at: "2026-03-31T00:00:00Z" }
              as: InventoryManager
              captures: { cs_id: $.data.id, cs_v: $.data.version }
            - call: "POST /count-sessions/${cs_id}/count-lines"
              payload: { product_id: "${teq_id}", count_method: "UNITS", counted_units: 4.5, expected_count_session_version: "${cs_v}" }
              as: InventoryManager
              captures: { cs_v2: $.data.version }
          trigger:
            - call: "POST /count-sessions/${cs_id}/finalize"
              payload: { expected_count_session_version: "${cs_v2}" }
              as: InventoryManager
              captures: { tvc: $.data.total_variance_cost_cents }
          assert:
            - "CountSession.${cs_id}.status == FINALIZED"
            - "CountSession.${cs_id}.total_variance_cost_cents == 2079"
            - "the Tequila CountLine theoretical_units == 2.6667 and variance_units == 0.8333 and variance_cost_cents == 2079"

      - name: recipe_cost_round_per_line_vs_sum_then_round
        grounds:
          - calculations.compute_recipe_cost
          - state_machines.RecipeSpec.DRAFT_to_PUBLISHED
          - entities.RecipeSpec.fields.recipe_cost_cents
          - entities.RecipeLine.fields.line_cost_cents
        distinguishing_aspect: "On the RecipeSpec/menu domain, round-per-line gives recipe_cost_cents 295 (166+114+15) whereas sum-then-round of the raw fractional line costs gives 296; the spec pins round-per-line so 295 is authoritative — a different entity domain than the CountLine variance above."
        test_recipe:
          setup:
            - "Three Products: Tequila (750 mL, unit_cost 2495), Cointreau (700 mL, unit_cost 3200), Lime (1000 mL, unit_cost 600)"
            - "DRAFT recipe with three lines: tequila 50 mL, cointreau 25 mL, lime 25 mL"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "TEQ-A", name: "Tequila", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2495 }
              as: InventoryManager
              captures: { teq_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "COIN-A", name: "Cointreau", container_type: "BOTTLE", container_volume_ml: 700, unit_cost_cents: 3200 }
              as: InventoryManager
              captures: { coin_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "LIME-A", name: "Lime Juice", container_type: "BOTTLE", container_volume_ml: 1000, unit_cost_cents: 600 }
              as: InventoryManager
              captures: { lime_id: $.data.id }
            - call: "POST /recipes"
              payload: { name: "Margarita" }
              as: BarManager
              captures: { rec_id: $.data.id }
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${teq_id}", pour_ml: 50 }
              as: BarManager
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${coin_id}", pour_ml: 25 }
              as: BarManager
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${lime_id}", pour_ml: 25 }
              as: BarManager
          trigger:
            - call: "POST /recipes/${rec_id}/publish"
              payload: {}
              as: BarManager
              captures: { rc: $.data.recipe_cost_cents }
          assert:
            - "RecipeSpec.${rec_id}.recipe_cost_cents == 295"
            - "the tequila line line_cost_cents == 166 and cointreau line == 114 and lime line == 15"

  # =====================================================================
  # RULE 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: recipe_cost_rounding_order_mode_b
        grounds:
          - calculations.compute_recipe_cost
          - entities.RecipeLine.fields.line_cost_cents
          - state_machines.RecipeSpec.DRAFT_to_PUBLISHED
        distinguishing_aspect: "Mode (b): the pinned ROUND-PER-LINE-THEN-SUM order yields 295 while SUM-THEN-ROUND yields 296 for the identical three-line Margarita; the order is the only thing that changes the cent total."
        test_recipe:
          setup:
            - "Same three Products and DRAFT three-line Margarita as the recipe dual-variant instance"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "TEQ-B", name: "Tequila", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2495 }
              as: InventoryManager
              captures: { teq_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "COIN-B", name: "Cointreau", container_type: "BOTTLE", container_volume_ml: 700, unit_cost_cents: 3200 }
              as: InventoryManager
              captures: { coin_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "LIME-B", name: "Lime Juice", container_type: "BOTTLE", container_volume_ml: 1000, unit_cost_cents: 600 }
              as: InventoryManager
              captures: { lime_id: $.data.id }
            - call: "POST /recipes"
              payload: { name: "Margarita B" }
              as: BarManager
              captures: { rec_id: $.data.id }
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${teq_id}", pour_ml: 50 }
              as: BarManager
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${coin_id}", pour_ml: 25 }
              as: BarManager
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${lime_id}", pour_ml: 25 }
              as: BarManager
          trigger:
            - call: "POST /recipes/${rec_id}/publish"
              payload: {}
              as: BarManager
              captures: { rc: $.data.recipe_cost_cents }
          assert:
            - "RecipeSpec.${rec_id}.recipe_cost_cents == 295"
            - "RecipeSpec.${rec_id}.recipe_cost_cents != 296"

      - name: invoice_subtotal_discount_tax_order_mode_c
        grounds:
          - calculations.reconcile_invoice
          - state_machines.Invoice.DRAFT_to_POSTED
          - entities.Invoice.fields.invoice_total_cents
          - entities.Invoice.fields.tax_cents
        distinguishing_aspect: "Mode (c): the circular-looking total depends on discount which depends on the subtotal tier which depends on the line extensions; the pinned order extensions->subtotal(49140)->discount(2457)->tax on (subtotal-discount)(4085)->total(52268) makes the value well-defined."
        test_recipe:
          setup:
            - "Two Products on a submitted PO; invoice with two lines 12 tequila @2495 and 6 cointreau @3200; freight 1500"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "TEQ-C", name: "Tequila", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2400 }
              as: InventoryManager
              captures: { teq_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "COIN-C", name: "Cointreau", container_type: "BOTTLE", container_volume_ml: 700, unit_cost_cents: 3000 }
              as: InventoryManager
              captures: { coin_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme Spirits", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${teq_id}", ordered_qty: 12, unit_cost_cents: 2495 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${coin_id}", ordered_qty: 6, unit_cost_cents: 3200 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-C", freight_cents: 1500 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${teq_id}", received_qty: 12, unit_cost_cents: 2495 }
              as: PurchasingAgent
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${coin_id}", received_qty: 6, unit_cost_cents: 3200 }
              as: PurchasingAgent
          trigger:
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
              captures: { tot: $.data.invoice_total_cents }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 49140"
            - "Invoice.${inv_id}.discount_cents == 2457"
            - "Invoice.${inv_id}.tax_cents == 4085"
            - "Invoice.${inv_id}.invoice_total_cents == 52268"

      - name: keg_yield_floor_nonlinear_mode_a
        grounds:
          - calculations.keg_yield
          - entities.Product.fields.container_volume_ml
          - entities.Product.fields.unit_cost_cents
        distinguishing_aspect: "Mode (a): >=3 inputs (container_volume_ml 58670, pour_size_ml 473, line_loss_pct 0.05) combine non-linearly through floor; servings_theoretical=124 (no loss) vs servings_net=117 (5% loss) differ because the floor is applied after the loss multiply, not before."
        test_recipe:
          setup:
            - "A KEG Product, half-barrel 58670 mL, unit_cost 15000 cents"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "KEG-HB", name: "House Lager", container_type: "KEG", container_volume_ml: 58670, unit_cost_cents: 15000 }
              as: InventoryManager
              captures: { keg_id: $.data.id }
          trigger:
            - call: "GET /products/${keg_id}/keg-yield"
              payload: { pour_size_ml: 473, line_loss_pct: 0.05 }
              as: BarManager
          assert:
            - "response data.servings_theoretical == 124"
            - "response data.servings_net == 117"
            - "response data.cost_per_serving_cents == 128"

  # =====================================================================
  # RULE 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_post_then_void_compensation_branch
        grounds:
          - state_machines.Invoice.DRAFT_to_POSTED
          - state_machines.Invoice.POSTED_to_VOID
          - entities.Invoice.fields.status
          - entities.Product.fields.on_hand_units
        distinguishing_aspect: "Invoice has a non-linear branch DRAFT->POSTED->VOID with a divergent compensating side-effect set on VOID (reverses on_hand and reverts PO RECEIVED->SUBMITTED), unlike a linear pipeline; this is the Invoice entity."
        test_recipe:
          setup:
            - "Product on a submitted PO; invoice posted (on_hand += 10, PO RECEIVED), then voided"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GIN-V", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { gin_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${gin_id}", ordered_qty: 10, unit_cost_cents: 2000 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-V", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${gin_id}", received_qty: 10, unit_cost_cents: 2000 }
              as: PurchasingAgent
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: PurchasingAgent
          assert:
            - "Invoice.${inv_id}.status == VOID"
            - "Product.${gin_id}.on_hand_units == 0"
            - "PurchaseOrder.${po_id}.status == SUBMITTED"

      - name: recipe_publish_revise_cycle
        grounds:
          - state_machines.RecipeSpec.DRAFT_to_PUBLISHED
          - state_machines.RecipeSpec.PUBLISHED_to_DRAFT
          - entities.RecipeSpec.fields.status
        distinguishing_aspect: "RecipeSpec admits a cycle DRAFT->PUBLISHED->DRAFT via revise (a back edge), distinct from a one-way pipeline; this is the RecipeSpec entity, different from the Invoice branch above."
        test_recipe:
          setup:
            - "A DRAFT recipe with one line; published, then revised back to DRAFT"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "RUM-R", name: "Rum", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 1800 }
              as: InventoryManager
              captures: { rum_id: $.data.id }
            - call: "POST /recipes"
              payload: { name: "Daiquiri" }
              as: BarManager
              captures: { rec_id: $.data.id }
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${rum_id}", pour_ml: 60 }
              as: BarManager
            - call: "POST /recipes/${rec_id}/publish"
              payload: {}
              as: BarManager
          trigger:
            - call: "POST /recipes/${rec_id}/revise"
              payload: {}
              as: BarManager
          assert:
            - "RecipeSpec.${rec_id}.status == DRAFT"
            - "RecipeSpec.${rec_id}.version == 3"

  # =====================================================================
  # RULE 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: invoice_post_cascade_onhand_to_reorder_flag
        grounds:
          - state_machines.Invoice.DRAFT_to_POSTED
          - calculations.reconcile_invoice
          - entities.Product.fields.on_hand_units
          - entities.Product.fields.needs_reorder
        distinguishing_aspect: "Depth-3 cascade triggered by invoice post: post -> Product.on_hand_units increases (A->B) -> that on_hand change itself forces needs_reorder recompute against the ACTIVE ParSetting flipping it true->false (B->C); each hop is caused by the prior hop."
        test_recipe:
          setup:
            - "Product with ACTIVE par (par 24, reorder_point 10), on_hand 0 so needs_reorder true; PO submitted for 12 units; invoice posts 12 units"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "VOD-R", name: "Vodka", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2200, case_pack: 12 }
              as: InventoryManager
              captures: { vod_id: $.data.id }
            - call: "POST /par-settings"
              payload: { product_id: "${vod_id}", par_level_units: 24, reorder_point_units: 10 }
              as: InventoryManager
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${vod_id}", ordered_qty: 12, unit_cost_cents: 2200 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-R", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${vod_id}", received_qty: 12, unit_cost_cents: 2200 }
              as: PurchasingAgent
          trigger:
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
          assert:
            - "Product.${vod_id}.on_hand_units == 12"
            - "Product.${vod_id}.needs_reorder == false"
            - "Invoice.${inv_id}.status == POSTED"

      - name: waste_log_cascade_onhand_to_reorder_flag
        grounds:
          - entities.WasteLog.fields.wasted_units
          - entities.Product.fields.on_hand_units
          - entities.Product.fields.needs_reorder
          - calculations.reorder_quantity
        distinguishing_aspect: "Depth-2 cascade from a different trigger (waste-log create): logging waste -> Product.on_hand_units decreases (A->B) -> the decreased on_hand forces needs_reorder recompute flipping false->true (B->C); originates from the waste-log endpoint, not invoice post."
        test_recipe:
          setup:
            - "Product with ACTIVE par (par 24, reorder_point 10); on_hand seeded to 11 via a posted invoice so needs_reorder false; then 2 units wasted"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "WHIS-W", name: "Whiskey", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 3000, case_pack: 1 }
              as: InventoryManager
              captures: { wh_id: $.data.id }
            - call: "POST /par-settings"
              payload: { product_id: "${wh_id}", par_level_units: 24, reorder_point_units: 10 }
              as: InventoryManager
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${wh_id}", ordered_qty: 11, unit_cost_cents: 3000 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-W", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${wh_id}", received_qty: 11, unit_cost_cents: 3000 }
              as: PurchasingAgent
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
          trigger:
            - call: "POST /waste-logs"
              payload: { product_id: "${wh_id}", reason: "BREAKAGE", wasted_units: 2 }
              as: BarManager
              captures: { wc: $.data.waste_cost_cents }
          assert:
            - "Product.${wh_id}.on_hand_units == 9"
            - "Product.${wh_id}.needs_reorder == true"
            - "WasteLog waste_cost_cents == 6000"

  # =====================================================================
  # RULE 5 — Validation priority conflicts across different category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_product_not_on_po
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - state_machines.Invoice.DRAFT_to_POSTED
        distinguishing_aspect: "state (ERR_INVALID_STATE, p4) vs business_referential (ERR_PRODUCT_NOT_ON_PO, p6): posting an already-POSTED invoice that also has a line whose product is not on the PO returns ERR_INVALID_STATE (lower priority wins), not ERR_PRODUCT_NOT_ON_PO."
        test_recipe:
          setup:
            - "An invoice already POSTED whose draft also carried a product not on the PO would, if re-posted, hit both; we re-post a POSTED invoice"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GIN-P5", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { gin_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${gin_id}", ordered_qty: 5, unit_cost_cents: 2000 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-P5", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${gin_id}", received_qty: 5, unit_cost_cents: 2000 }
              as: PurchasingAgent
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
          trigger:
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: not_found_beats_recipe_not_published
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_RECIPE_NOT_PUBLISHED]
        distinguishing_aspect: "existence (ERR_NOT_FOUND, p3) vs business_referential (ERR_RECIPE_NOT_PUBLISHED, p7): creating a MenuItem with a non-existent recipe_id returns ERR_NOT_FOUND, never the publish-state error, because existence is checked before recipe-publish status."
        test_recipe:
          setup:
            - "No recipe with the supplied id exists"
          setup_api_calls:
            - call: "POST /recipes"
              payload: { name: "Placeholder" }
              as: BarManager
          trigger:
            - call: "POST /menu-items"
              payload: { recipe_id: "00000000-0000-4000-8000-000000000000", menu_price_cents: 1200 }
              as: BarManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

  # =====================================================================
  # RULE 6 — Boundary-precision checks on different metrics/endpoints
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: invoice_tier_boundary_inclusive_at_40000
        grounds:
          - calculations.reconcile_invoice
          - entities.Invoice.fields.discount_cents
          - state_machines.Invoice.DRAFT_to_POSTED
        distinguishing_aspect: "Subtotal exactly == 40000 takes the 5% tier (>= boundary inclusive), giving discount_cents 2000; a subtotal of 39984 falls to the 3% tier — the boundary metric is the invoice subtotal on the invoice-post endpoint."
        test_recipe:
          setup:
            - "Invoice with one line 16 units @2500 => subtotal exactly 40000, freight 0"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "TEQ-B6", name: "Tequila", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2500 }
              as: InventoryManager
              captures: { teq_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${teq_id}", ordered_qty: 16, unit_cost_cents: 2500 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-B6", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${teq_id}", received_qty: 16, unit_cost_cents: 2500 }
              as: PurchasingAgent
          trigger:
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
              captures: { disc: $.data.discount_cents }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 40000"
            - "Invoice.${inv_id}.discount_cents == 2000"
            - "Invoice.${inv_id}.tax_cents == 3325"
            - "Invoice.${inv_id}.invoice_total_cents == 41325"

      - name: reorder_threshold_boundary_on_hand_equals_reorder_point
        grounds:
          - calculations.reorder_quantity
          - entities.ParSetting.fields.reorder_point_units
          - entities.Product.fields.on_hand_units
        distinguishing_aspect: "On-hand exactly == reorder_point (10) does NOT trigger replenishment (the trigger is on_hand < reorder_point, strict), so suggested_qty == 0 on the reorder-suggestion endpoint — a different metric and endpoint than the invoice subtotal tier."
        test_recipe:
          setup:
            - "Product with ACTIVE par (par 24, reorder_point 10); on_hand seeded to exactly 10 via a posted invoice for 10 units"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "VOD-B6", name: "Vodka", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2200, case_pack: 12 }
              as: InventoryManager
              captures: { vod_id: $.data.id }
            - call: "POST /par-settings"
              payload: { product_id: "${vod_id}", par_level_units: 24, reorder_point_units: 10 }
              as: InventoryManager
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${vod_id}", ordered_qty: 10, unit_cost_cents: 2200 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-B6V", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${vod_id}", received_qty: 10, unit_cost_cents: 2200 }
              as: PurchasingAgent
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
          trigger:
            - call: "GET /products/${vod_id}/reorder-suggestion"
              payload: {}
              as: InventoryManager
          assert:
            - "Product.${vod_id}.on_hand_units == 10"
            - "response data.triggered == false"
            - "response data.suggested_qty == 0"

  # =====================================================================
  # RULE 7 — Cross-entity state dependencies across different entity pairs
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: menuitem_requires_recipe_published
        grounds:
          - validations[priority=7]
          - state_machines.RecipeSpec.DRAFT_to_PUBLISHED
          - entities.MenuItem.fields.recipe_id
        distinguishing_aspect: "MenuItem create is gated by RecipeSpec.status == PUBLISHED (MenuItem->RecipeSpec pair): a DRAFT recipe yields ERR_RECIPE_NOT_PUBLISHED while the same recipe once PUBLISHED accepts the menu item."
        test_recipe:
          setup:
            - "A DRAFT recipe with one line (not yet published)"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GIN-X7", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { gin_id: $.data.id }
            - call: "POST /recipes"
              payload: { name: "Negroni" }
              as: BarManager
              captures: { rec_id: $.data.id }
            - call: "POST /recipes/${rec_id}/lines"
              payload: { product_id: "${gin_id}", pour_ml: 30 }
              as: BarManager
          trigger:
            - call: "POST /menu-items"
              payload: { recipe_id: "${rec_id}", menu_price_cents: 1400 }
              as: BarManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_RECIPE_NOT_PUBLISHED"

      - name: invoice_post_requires_po_submitted_or_received
        grounds:
          - state_machines.Invoice.DRAFT_to_POSTED
          - state_machines.PurchaseOrder.DRAFT_to_SUBMITTED
          - entities.Invoice.fields.purchase_order_id
        distinguishing_aspect: "Invoice post is gated by the referenced PurchaseOrder.status IN {SUBMITTED, RECEIVED} (Invoice->PurchaseOrder pair, different from MenuItem->RecipeSpec): posting against a still-DRAFT PO is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A DRAFT PO (never submitted) with one line; a DRAFT invoice with one matching line"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "RUM-X7", name: "Rum", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 1800 }
              as: InventoryManager
              captures: { rum_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${rum_id}", ordered_qty: 6, unit_cost_cents: 1800 }
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-X7", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${rum_id}", received_qty: 6, unit_cost_cents: 1800 }
              as: PurchasingAgent
          trigger:
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

  # =====================================================================
  # RULE 8 — Resource temporal-overlap conflicts across different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: count_window_strict_after_half_open
        grounds:
          - state_machines.CountSession.OPEN_to_FINALIZED
          - validations[priority=16]
          - entities.CountSession.fields.counted_at
          - errors[ERR_COUNT_WINDOW_OVERLAP]
        distinguishing_aspect: "CountSession per-product depletion windows are half-open and must be strictly chronologically ordered: a second finalize whose counted_at equals the prior FINALIZED session's counted_at for a shared product is rejected (adjacency at equal endpoint forbidden) with ERR_COUNT_WINDOW_OVERLAP."
        test_recipe:
          setup:
            - "One product; a first count session FINALIZED at counted_at 2026-03-15T00:00:00Z; a second OPEN session with a line on the same product at the same counted_at"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: InventoryManager
            - call: "POST /products"
              payload: { sku: "GIN-O8", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { gin_id: $.data.id }
            - call: "POST /count-sessions"
              payload: { label: "First", counted_at: "2026-03-15T00:00:00Z" }
              as: InventoryManager
              captures: { cs1_id: $.data.id, cs1_v: $.data.version }
            - call: "POST /count-sessions/${cs1_id}/count-lines"
              payload: { product_id: "${gin_id}", count_method: "UNITS", counted_units: 3, expected_count_session_version: "${cs1_v}" }
              as: InventoryManager
              captures: { cs1_v2: $.data.version }
            - call: "POST /count-sessions/${cs1_id}/finalize"
              payload: { expected_count_session_version: "${cs1_v2}" }
              as: InventoryManager
            - call: "POST /count-sessions"
              payload: { label: "Second same instant", counted_at: "2026-03-15T00:00:00Z" }
              as: InventoryManager
              captures: { cs2_id: $.data.id, cs2_v: $.data.version }
            - call: "POST /count-sessions/${cs2_id}/count-lines"
              payload: { product_id: "${gin_id}", count_method: "UNITS", counted_units: 2, expected_count_session_version: "${cs2_v}" }
              as: InventoryManager
              captures: { cs2_v2: $.data.version }
          trigger:
            - call: "POST /count-sessions/${cs2_id}/finalize"
              payload: { expected_count_session_version: "${cs2_v2}" }
              as: InventoryManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_COUNT_WINDOW_OVERLAP"

      - name: keg_tap_closed_interval_overlap_adjacency_allowed
        grounds:
          - validations[priority=17]
          - entities.KegTap.fields.tapped_from
          - entities.KegTap.fields.tapped_until
          - errors[ERR_LINE_OVERLAP]
        distinguishing_aspect: "KegTap draft-line occupations are CLOSED intervals where adjacency (next.tapped_from == prev.tapped_until) is ALLOWED but interior overlap is rejected — different interval geometry (closed, touching-permitted) than the CountSession half-open strict-after window, and on a different resource entity (KegTap)."
        test_recipe:
          setup:
            - "A KEG product; one tap on draft line 1 spanning 08:00-12:00; a second overlapping tap on the same line spanning 11:00-15:00"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "KEG-O8", name: "Lager", container_type: "KEG", container_volume_ml: 58670, unit_cost_cents: 15000 }
              as: InventoryManager
              captures: { keg_id: $.data.id }
            - call: "POST /keg-taps"
              payload: { product_id: "${keg_id}", draft_line_no: 1, tapped_from: "2026-03-01T08:00:00Z", tapped_until: "2026-03-01T12:00:00Z" }
              as: BarManager
          trigger:
            - call: "POST /keg-taps"
              payload: { product_id: "${keg_id}", draft_line_no: 1, tapped_from: "2026-03-01T11:00:00Z", tapped_until: "2026-03-01T15:00:00Z" }
              as: BarManager
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_LINE_OVERLAP"

  # =====================================================================
  # RULE 9 — Compensating-action invariants across different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_void_conserves_product_on_hand
        grounds:
          - state_machines.Invoice.DRAFT_to_POSTED
          - state_machines.Invoice.POSTED_to_VOID
          - entities.Product.fields.on_hand_units
        distinguishing_aspect: "Conserved quantity = Product.on_hand_units: post then void must leave on_hand exactly equal to its pre-post value (0 here), pinned as on_hand_after_void == on_hand_before_post; the void's -received_qty exactly cancels the post's +received_qty."
        test_recipe:
          setup:
            - "Fresh product on_hand 0; PO submitted for 7 units; invoice posts 7 (on_hand 7) then voids (on_hand back to 0)"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "GIN-I9", name: "Gin", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 2000 }
              as: InventoryManager
              captures: { gin_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${gin_id}", ordered_qty: 7, unit_cost_cents: 2000 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
            - call: "POST /invoices"
              payload: { purchase_order_id: "${po_id}", vendor_invoice_no: "INV-I9", freight_cents: 0 }
              as: PurchasingAgent
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/lines"
              payload: { product_id: "${gin_id}", received_qty: 7, unit_cost_cents: 2000 }
              as: PurchasingAgent
            - call: "POST /invoices/${inv_id}/post"
              payload: {}
              as: PurchasingAgent
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: PurchasingAgent
          assert:
            - "Product.${gin_id}.on_hand_units == 0"
            - "Invoice.${inv_id}.status == VOID"

      - name: po_cancel_conserves_ordered_total_zero_basis
        grounds:
          - state_machines.PurchaseOrder.SUBMITTED_to_CANCELLED
          - state_machines.PurchaseOrder.DRAFT_to_SUBMITTED
          - entities.PurchaseOrder.fields.ordered_total_cents
          - entities.Product.fields.on_hand_units
        distinguishing_aspect: "Conserved quantity = received stock basis (sum of Product.on_hand_units across PO products): cancelling a SUBMITTED PO that has no posted invoice must leave every product's on_hand at its pre-PO value (0), since a cancel with no receipts injects no stock — a different conserved quantity (stock basis) than the invoice-void on_hand cancellation."
        test_recipe:
          setup:
            - "Product on_hand 0; PO submitted for 9 units but no invoice posted; PO cancelled"
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "RUM-I9", name: "Rum", container_type: "BOTTLE", container_volume_ml: 750, unit_cost_cents: 1800 }
              as: InventoryManager
              captures: { rum_id: $.data.id }
            - call: "POST /purchase-orders"
              payload: { vendor_name: "Acme", expected_at: "2026-03-02T00:00:00Z" }
              as: PurchasingAgent
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/lines"
              payload: { product_id: "${rum_id}", ordered_qty: 9, unit_cost_cents: 1800 }
              as: PurchasingAgent
            - call: "POST /purchase-orders/${po_id}/submit"
              payload: {}
              as: PurchasingAgent
          trigger:
            - call: "POST /purchase-orders/${po_id}/cancel"
              payload: {}
              as: PurchasingAgent
          assert:
            - "PurchaseOrder.${po_id}.status == CANCELLED"
            - "Product.${rum_id}.on_hand_units == 0"
