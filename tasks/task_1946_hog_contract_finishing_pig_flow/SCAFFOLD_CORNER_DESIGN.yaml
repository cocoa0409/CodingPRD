            - "Grower wash verify -> 403 ERR_FORBIDDEN_ROLE (${err2}); wash stays RECORDED"

  # ============================================================ cross-cutting layers
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_barn_version_rejected
        claim_type: optimistic_concurrency
        grounds: [ "concurrency_rules[pig-group-create-stale-barn]", "errors[ERR_STALE_BARN_VERSION]"]
        distinguishing_aspect: "OCC on Barn.version: after a first group booking bumps the barn to version 2, a second create still carrying version 1 is 412 ERR_STALE_BARN_VERSION — even though its interval is disjoint and every other check would pass."
        test_recipe:
          setup: ["contract ACTIVE; barn B1 at version 1"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v1: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v1}" }, as: FieldTech, captures: { group_a: $.data.id } }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-07-13", target_market_date: "2026-08-24", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v1}" }, as: FieldTech, captures: { err: $.data.error_id } }
            - { call: "GET /barns/${barn_id}", payload: {}, as: IntegratorAdmin, captures: { barn_v_now: $.data.version } }
          assert:
            - "First create succeeds with version 1 and bumps Barn.version to 2 (${barn_v_now} == 2)"
            - "Second create with stale version 1 -> HTTP 412 ERR_STALE_BARN_VERSION (${err}) despite a non-overlapping interval"
            - "Only one group exists on the barn afterwards"

      - name: occ_stale_slot_version_rejected
        claim_type: optimistic_concurrency
        grounds: [ "concurrency_rules[market-load-create-stale-slot]", "errors[ERR_STALE_SLOT_VERSION]"]
        distinguishing_aspect: "OCC on PackerSlot.version: a booking carrying the pre-first-booking version is 412 even though capacity (200+200 <= 500) and window would pass."
        test_recipe:
          setup: ["group PLACED 1000 head; slot 2026-07-13 cap 500 at version 1"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 500, min_weight_lbs: 240, max_weight_lbs: 320 }, as: IntegratorAdmin, captures: { slot1: $.data.id, slot_v1: $.data.version } }
          trigger:
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 200, expected_slot_version: "${slot_v1}" }, as: FieldTech, captures: { load1: $.data.id } }
            - { call: "POST /market-loads", payload: { group_id: "${group_id}", slot_id: "${slot1}", head_count: 200, expected_slot_version: "${slot_v1}" }, as: FieldTech, captures: { err: $.data.error_id } }
          assert:
            - "First booking (version 1) succeeds and bumps slot to version 2"
            - "Second booking with stale version 1 -> HTTP 412 ERR_STALE_SLOT_VERSION (${err})"
            - "PackerSlot.reserved_head == 200 (only the first booking counted)"

      - name: pagination_limit_offset_filter
        claim_type: pagination_with_filtering
        grounds: [response_envelope]
        distinguishing_aspect: "Default limit 10 applies with has_more/total_count correct; offset walks the second page; grower_status filter intersects with pagination."
        test_recipe:
          setup: ["12 growers created (all ACTIVE)"]
          setup_api_calls:
            - { call: "POST /growers", payload: { legal_name: "G01", grower_code: "G-01", email: "g01@x.com" }, as: IntegratorAdmin }
            - { call: "POST /growers", payload: { legal_name: "G02", grower_code: "G-02", email: "g02@x.com" }, as: IntegratorAdmin }
            - { call: "POST /growers", payload: { legal_name: "G03", grower_code: "G-03", email: "g03@x.com" }, as: IntegratorAdmin }
            - { call: "POST /growers", payload: { legal_name: "G04", grower_code: "G-04", email: "g04@x.com" }, as: IntegratorAdmin }
            - { call: "POST /growers", payload: { legal_name: "G05", grower_code: "G-05", email: "g05@x.com" }, as: IntegratorAdmin }
            - { call: "POST /growers", payload: { legal_name: "G06", grower_code: "G-06", email: "g06@x.com" }, as: IntegratorAdmin }
            - { call: "POST /growers", payload: { legal_name: "G07", grower_code: "G-07", email: "g07@x.com" }, as: IntegratorAdmin }
            - { call: "POST /growers", payload: { legal_name: "G08", grower_code: "G-08", email: "g08@x.com" }, as: IntegratorAdmin }
            - { call: "POST /growers", payload: { legal_name: "G09", grower_code: "G-09", email: "g09@x.com" }, as: IntegratorAdmin }
            - { call: "POST /growers", payload: { legal_name: "G10", grower_code: "G-10", email: "g10@x.com" }, as: IntegratorAdmin }
            - { call: "POST /growers", payload: { legal_name: "G11", grower_code: "G-11", email: "g11@x.com" }, as: IntegratorAdmin }
            - { call: "POST /growers", payload: { legal_name: "G12", grower_code: "G-12", email: "g12@x.com" }, as: IntegratorAdmin, captures: { g12: $.data.id } }
            - { call: "POST /growers/${g12}/suspend", payload: {}, as: IntegratorAdmin }
          trigger:
            - { call: "GET /growers", payload: {}, as: IntegratorAdmin }
            - { call: "GET /growers", payload: { offset: 10 }, as: IntegratorAdmin }
            - { call: "GET /growers", payload: { grower_status: "SUSPENDED" }, as: IntegratorAdmin }
          assert:
            - "Page 1 (defaults): 10 items, total_count == 12, has_more == true"
            - "Page 2 (offset 10): 2 items, has_more == false"
            - "Filter SUSPENDED: total_count == 1 (only G-12)"

      - name: site_capacity_reconciled_on_barn_status_change
        claim_type: derived_field_reconciliation
        grounds: [entities.Site.fields.total_capacity_head, state_machines.Barn]
        distinguishing_aspect: "Derived field tracks its sources across mutations: 1200+800=2000 at creation, drops to 1200 while one barn is OUT_OF_SERVICE, back to 2000 on return."
        test_recipe:
          setup: ["site with barns B1 (1200) and B2 (800)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B2", capacity_head: 800, floor_space_sqft: 6400 }, as: IntegratorAdmin, captures: { barn2: $.data.id } }
          trigger:
            - { call: "GET /sites/${site_id}", payload: {}, as: IntegratorAdmin, captures: { cap0: $.data.total_capacity_head } }
            - { call: "POST /barns/${barn2}/mark-out-of-service", payload: {}, as: IntegratorAdmin }
            - { call: "GET /sites/${site_id}", payload: {}, as: IntegratorAdmin, captures: { cap1: $.data.total_capacity_head } }
            - { call: "POST /barns/${barn2}/return-to-service", payload: {}, as: IntegratorAdmin }
            - { call: "GET /sites/${site_id}", payload: {}, as: IntegratorAdmin, captures: { cap2: $.data.total_capacity_head } }
          assert:
            - "total_capacity_head == 2000 initially (${cap0})"
            - "== 1200 while B2 OUT_OF_SERVICE (${cap1})"
            - "== 2000 again after return-to-service (${cap2})"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.MarketLoad]
        excluded_because:
          difficulty_instance: cascade_delivery_to_settlement_creation
          rationale: "3-level cascade asserted end-to-end there."

      - name: dual_variant_calculation_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.settlement_pay, calculations.feed_budget_gate]
        excluded_because:
          difficulty_instance: feed_hard_cap_vs_phase_plan_divergence
          rationale: "Both variant domains covered by §1.8 rule 1 instances."

      - name: rate_threshold_triggers_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.performance_bonus, calculations.slot_reserved_head]
        excluded_because:
          difficulty_instance: slot_capacity_exact_fit_then_one_over
          rationale: "Slot FULL auto-flip at exact capacity and mortality threshold crossing asserted in §1.8."

  # ============================================================ consistency model
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate model: a feed delivery's effect on PigGroup.cumulative_feed_lbs and a mortality report's effect on head_current are visible in the very next read — no lag, no recomputation delay."
        test_recipe:
          setup: ["group PLACED 1000 head"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 1000, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/confirm-placement", payload: {}, as: FieldTech }
          trigger:
            - { call: "POST /feed-orders", payload: { group_id: "${group_id}", phase: "STARTER", diet_code: "ST-1", quantity_lbs: 40000, requested_delivery_date: "2026-03-05" }, as: FieldTech, captures: { o1: $.data.id } }
            - { call: "POST /feed-orders/${o1}/schedule", payload: { scheduled_delivery_date: "2026-03-05" }, as: FeedMill }
            - { call: "POST /feed-orders/${o1}/deliver", payload: { delivered_lbs: 40000 }, as: FeedMill }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-06T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${group_id}/mortality-reports", payload: { report_date: "2026-03-06", mortality_count: 5, cull_count: 2, reason_code: "STRESS" }, as: Grower, as_user_id: "${grower_id}" }
            - { call: "GET /pig-groups/${group_id}", payload: {}, as: FieldTech, captures: { cum: $.data.cumulative_feed_lbs, head: $.data.head_current, mort: $.data.mortality_total } }
          assert:
            - "Read immediately after writes: cumulative_feed_lbs == 40000 (${cum})"
            - "head_current == 993 (${head}); mortality_total == 5 (${mort}); cull_total == 2"
