  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  # NOTE: This scenario does not naturally contain resource temporal-overlap
  # rules (no bookings, no schedules, no shared physical resources). The closest
  # temporal rule is the lien holder_response_due_at window, but that is a
  # one-sided deadline, not an interval-overlap conflict on a shared resource.
  # We satisfy the rule with two genuine overlap-style rules that differ in
  # interval semantics:
  #   (a) TierMatrix severity range overlap on publish (closed-integer intervals
  #       on the shared program-scoped injury_category "resource": publish
  #       supersedes any prior PUBLISHED row whose [min,max] integer interval
  #       overlaps the new row, with NO buffer between intervals — touching at
  #       the boundary counts as overlap).
  #   (b) Active-claim uniqueness per Claimant (claim lifecycle as a
  #       half-open temporal interval on the shared Claimant "resource":
  #       a second claim on the same claimant is rejected while the first is
  #       in any non-terminal state — i.e., the occupation window runs from
  #       claim creation to claim terminal state, and any overlap rejects).
  - rule_id: resource_temporal_overlap
    instances:
      - name: matrix_severity_interval_overlap_on_publish
        grounds:
          - endpoints.POST tier-matrices/{tmid}/publish
          - entities.TierMatrix.fields.severity_score_min
        distinguishing_aspect: |
          Interval semantic = closed integer range, touching-at-boundary
          counts as overlap. Resource = (program, injury_category). Publishing
          a new row whose [severity_score_min, severity_score_max] intersects
          an existing PUBLISHED row supersedes the old row (matrix_state ->
          SUPERSEDED). Distinct interval semantics from the active-claim rule.
        test_recipe:
          setup:
            - "Program has PUBLISHED matrix row A: category=QUALIFYING_CAT_A, range [0,49]"
            - "Row B in DRAFT: same category, range [49,100] (touches at 49)"
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-OVL1", tort_name: "Overlap1", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 0, severity_score_max: 49, base_award_cents: 3000000 }
              as: ProgramAdministrator
              captures: { tmid_a: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid_a}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 49, severity_score_max: 100, base_award_cents: 8000000 }
              as: ProgramAdministrator
              captures: { tmid_b: $.data.id }
          trigger:
            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid_b}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /settlement-programs/${pid}/tier-matrices/${tmid_a}"
              as: ProgramAdministrator
              captures: { state_a: $.data.matrix_state }
            - call: "GET /settlement-programs/${pid}/tier-matrices/${tmid_b}"
              as: ProgramAdministrator
              captures: { state_b: $.data.matrix_state }
          assert:
            - "captured state_a == SUPERSEDED (closed-interval boundary 49 == 49 counts as overlap)"
            - "captured state_b == PUBLISHED"

      - name: active_claim_lifecycle_overlap_on_claimant
        grounds:
          - validations[priority=11]
          - entities.Claim.fields.claimant_id
        distinguishing_aspect: |
          Interval semantic = half-open lifecycle window [claim.created_at,
          claim.terminal_transition). Resource = Claimant. A second claim on
          the same claimant is rejected while the first occupies any
          non-terminal state — no grace gap. Distinct interval semantics from
          the closed-integer matrix range rule.
        test_recipe:
          setup:
            - "Claimant with one claim already in SUBMITTED state"
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-OVL2", tort_name: "Overlap2", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Paula", date_of_birth: "1960-01-01", ssn_last4: "6767", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid1: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid1}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid2: $.data.id }
          trigger:
            - call: "POST /settlement-programs/${pid}/claims/${cid2}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_DUPLICATE_ACTIVE_CLAIM (lifecycle window of claim 1 overlaps claim 2 screen attempt)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: disbursement_void_refunds_qsf
        grounds:
          - state_machines.Disbursement.PENDING_to_VOIDED
          - calculations.qsf_reconciliation
        distinguishing_aspect: |
          Conserved quantity = program.qsf_remaining_cents (monetary).
          prepare-disbursement debits QSF by net_award_cents; voiding a
          PENDING disbursement must credit back exactly that disbursement's
          amount_cents, leaving qsf_remaining_cents unchanged net of the
          pair (prepare + void).
        test_recipe:
          setup:
            - "Claim READY_FOR_DISBURSEMENT with qsf_reservation_cents = 5000000; program.qsf_remaining_cents debited to 95000000 (from principal 100000000)"
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-INV1", tort_name: "Inv1", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 0, severity_score_max: 100, base_award_cents: 5000000 }
              as: ProgramAdministrator
              captures: { tmid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Quinn", date_of_birth: "1960-01-01", ssn_last4: "7878", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "X", record_type: "DIAGNOSTIC", severity_score: 70, confirms_qualifying_injury: true }
              as: RecordsAnalyst
              captures: { r1: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "Y", record_type: "TREATMENT", severity_score: 65, confirms_qualifying_injury: false }
              as: RecordsAnalyst
              captures: { r2: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r1}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r2}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/verify-injury"
              payload: {}
              as: RecordsAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { v_pre: $.data.version }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/assign-tier"
              payload: { tier_matrix_id: "${tmid}", expected_claim_version: "${v_pre}" }
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens"
              payload: { lien_type: "MEDICARE", holder_name: "CMS", asserted_amount_cents: 100000 }
              as: LienAnalyst
              captures: { lid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid}/waive"
              payload: { resolution_notes: "Waived" }
              as: LienAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/finalize-liens"
              payload: {}
              as: LienAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/prepare-disbursement"
              payload: {}
              as: DisbursementApprover
              as_user_id: "user_approver_1"
            - call: "GET /settlement-programs/${pid}"
              as: ProgramAdministrator
              captures: { qsf_after_prepare: $.data.qsf_remaining_cents }
            - call: "GET /settlement-programs/${pid}/claims/${cid}/disbursements"
              as: DisbursementApprover
              captures: { did: "$.data.0.id", amount: "$.data.0.amount_cents" }
          trigger:
            - call: "POST /settlement-programs/${pid}/claims/${cid}/disbursements/${did}/void"
              payload: {}
              as: DisbursementApprover
              as_user_id: "user_approver_1"
            - call: "GET /settlement-programs/${pid}"
              as: ProgramAdministrator
              captures: { qsf_after_void: $.data.qsf_remaining_cents }
          assert:
            - "captured qsf_after_prepare == 95000000 (= 100000000 - 5000000 reservation)"
            - "captured qsf_after_void == 100000000 (void refunded the reservation)"
            - "conservation: prepare_debit + void_credit == 0 net change"

      - name: appeal_uphold_then_withdraw_conserves_active_appeal_count
        grounds:
          - state_machines.Appeal.FILED_to_WITHDRAWN
          - state_machines.Appeal.UNDER_REVIEW_to_UPHELD
          - entities.Claim.fields.active_appeal_id
        distinguishing_aspect: |
          Conserved quantity = claim.active_appeal_id pointer (referential
          integrity, not monetary). Filing an appeal SETS active_appeal_id;
          withdrawing (or upholding, or denying) MUST clear it back to null.
          Distinct conserved quantity from monetary QSF used in the other
          instance.
        test_recipe:
          setup:
            - "Claim TIER_ASSIGNED with appeal FILED"
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-INV2", tort_name: "Inv2", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 0, severity_score_max: 49, base_award_cents: 3000000 }
              as: ProgramAdministrator
              captures: { tmid_low: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid_low}/publish"
