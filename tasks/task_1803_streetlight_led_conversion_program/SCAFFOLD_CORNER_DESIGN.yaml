        as: ProgramManager
      - call: POST /streetlights/conversion-routes/${route}/release
        payload: {}
        as: ProgramManager
      - call: GET /streetlights/work-orders
        payload:
          route_id: ${route}
        as: ProgramManager
        captures:
          wo1: $.data.0.id
          wo2: $.data.1.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-02-19T09:00:00Z'
        as: ProgramManager
      - call: POST /streetlights/work-orders/${wo1}/dispatch
        payload:
          new_fixture_wattage: 90
          new_cct_kelvin: 3000
          shielding: SEMI_CUTOFF
        as: FieldSupervisor
        as_user_id: ${crew}
      - call: POST /streetlights/work-orders/${wo1}/complete
