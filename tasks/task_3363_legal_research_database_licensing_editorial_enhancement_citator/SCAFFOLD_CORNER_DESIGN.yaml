        grounds: ["validations[priority=29]", "errors[ERR_DUPLICATE_CITATION]", calculations.citation_normalization]
        distinguishing_aspect: "Uniqueness is judged on the NORMALIZED form: \"123 F.3d 456\" and \"123 F3d 456\" differ raw but normalize identically, so the second publish collides with 409."
        test_recipe:
          setup: ["document D1 published with raw \"123 F.3d 456\"; document D2 ingested with raw \"123 F3d 456\""]
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "First v. Dup", raw_citation_string: "123 F.3d 456", decision_date: "2026-01-01"}
              as: ContentIngester
              captures: {d1: $.data.id}
            - {call: "POST /legal-research/documents/${d1}/publish", payload: {references: []}, as: ContentIngester}
            - call: "POST /legal-research/documents"
              payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "Second v. Dup", raw_citation_string: "123 F3d 456", decision_date: "2026-02-01"}
              as: ContentIngester
              captures: {d2: $.data.id}
          trigger:
            - {call: "POST /legal-research/documents/${d2}/publish", payload: {references: []}, as: ContentIngester, captures: {err: $.data.error_id}}
          assert:
            - "error_id == ERR_DUPLICATE_CITATION (409); PrimaryDocument.${d2}.ingestion_status remains RECEIVED and normalized_citation IS NULL"

