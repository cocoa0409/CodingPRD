    side_effects:
      - "file_frozen=true, frozen_until = logical clock + ExchangeRule.data_freeze_days days"
      - "all of the consumer's ISSUED LossHistoryReports -> FROZEN"
      - "increments Consumer.version by 1"

  # --- QuoteInquiry / LossHistoryReport ---
  - method: POST
    path: "/carriers/{carrierId}/inquiries"
    description: "Submit a quote inquiry. Runs identity_match_score, resolves the subject consumer, and — when the disposition is not UNMATCHED, the consumer file is not frozen, and the carrier passes reciprocity — issues a LossHistoryReport with both risk score variants and the retention-filtered inclusion set."
    roles: [CarrierUnderwriter]
    code: 201
    input: [subject_name, subject_dob, subject_address, subject_driver_license, permissible_purpose, "subject_vehicle_identifier?"]
    output: QuoteInquiry
    side_effects:
      - "identity_match_score and risk_certainty_score computed"
      - "when a report is issued: report_inclusion_set and risk_score_dual computed; ReportClaimEntry rows created; report_id set"
      - "when UNMATCHED: matched_consumer_id null, report_id null, report_blocked_reason NONE"
      - "when frozen: report_blocked_reason FROZEN and no report"
      - "when carrier fails reciprocity: report_blocked_reason RECIPROCITY and no report"

  - method: GET
    path: "/carriers/{carrierId}/inquiries"
    description: "List a carrier's inquiries"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierUnderwriter]
    code: 200
    input: ["match_disposition?", "limit?", "offset?"]
    output: "QuoteInquiry[]"
    side_effects: []

  - method: GET
    path: "/inquiries/{inquiryId}"
    description: "Get an inquiry"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierUnderwriter]
    code: 200
    input: []
    output: QuoteInquiry
    side_effects: []

  - method: GET
    path: "/inquiries"
    description: "List inquiries across carriers (filterable by carrier, matched consumer, or generated report)"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: ["carrier_id?", "matched_consumer_id?", "report_id?", "match_disposition?", "limit?", "offset?"]
    output: "QuoteInquiry[]"
    side_effects: []

  - method: GET
    path: "/reports/{reportId}"
    description: "Get a loss history report"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierUnderwriter, Consumer]
    code: 200
    input: []
    output: LossHistoryReport
    side_effects: []

  - method: GET
    path: "/reports"
    description: "List reports across carriers (filterable by generating inquiry, subject consumer, or receiving carrier)"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: ["inquiry_id?", "consumer_id?", "carrier_id?", "status?", "limit?", "offset?"]
    output: "LossHistoryReport[]"
    side_effects: []

  - method: GET
    path: "/report-entries"
    description: "List report claim entries across reports (filterable by owning report, snapshotted claim, subject consumer, or contributing carrier)"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: ["report_id?", "loss_claim_id?", "consumer_id?", "contributing_carrier_id?", "limit?", "offset?"]
    output: "ReportClaimEntry[]"
    side_effects: []

  - method: GET
    path: "/report-entries/{entryId}"
    description: "Get a single report claim entry"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierUnderwriter, Consumer]
    code: 200
    input: []
    output: ReportClaimEntry
    side_effects: []

  - method: GET
    path: "/reports/{reportId}/entries"
    description: "List a report's claim entries in entry_sequence order"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierUnderwriter, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReportClaimEntry[]"
    side_effects: []

  - method: GET
    path: "/reports/{reportId}/adverse-action-notices"
    description: "List adverse action notices citing this report"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierUnderwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AdverseActionNotice[]"
    side_effects: []

  - method: GET
    path: "/claims/{claimId}/report-entries"
    description: "List report entries that snapshot this claim"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierDataSteward, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReportClaimEntry[]"
    side_effects: []

  - method: GET
    path: "/carriers/{carrierId}/reports"
    description: "List reports delivered to a carrier"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierUnderwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "LossHistoryReport[]"
    side_effects: []

  # --- ConsumerDispute ---
  - method: POST
    path: "/consumers/{consumerId}/disputes"
    description: "File a dispute against a loss claim (OCC-guarded on the consumer's version)"
    roles: [Consumer]
    code: 201
    input: [loss_claim_id, dispute_reason, dispute_statement, expected_consumer_version]
    output: ConsumerDispute
    side_effects:
      - "claim -> UNDER_DISPUTE"
      - "reinvestigation_due_at = logical clock + ExchangeRule.reinvestigation_days days"
      - "increments Consumer.version by 1"

  - method: GET
    path: "/consumers/{consumerId}/disputes"
    description: "List a consumer's disputes"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, Consumer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ConsumerDispute[]"
    side_effects: []

  - method: GET
    path: "/disputes"
    description: "List disputes across consumers (filterable by consumer or disputed claim)"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: ["consumer_id?", "loss_claim_id?", "status?", "limit?", "offset?"]
    output: "ConsumerDispute[]"
    side_effects: []

  - method: GET
    path: "/disputes/{disputeId}"
    description: "Get a dispute"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, Consumer]
    code: 200
    input: []
    output: ConsumerDispute
    side_effects: []

  - method: POST
    path: "/disputes/{disputeId}/begin-reinvestigation"
    description: "Move a FILED dispute into UNDER_REINVESTIGATION"
    roles: [ExchangeComplianceOfficer]
    code: 200
    input: []
    output: ConsumerDispute
    side_effects: ["append ContributionAuditEvent DISPUTE_REINVESTIGATED"]

  - method: POST
    path: "/disputes/{disputeId}/resolve"
    description: "Resolve a dispute. AMENDED requires the corrected claim fields and creates the replacement claim in the same request."
    roles: [ExchangeComplianceOfficer]
    code: 200
    input: [resolution_code, resolution_notes, "corrected_loss_date?", "corrected_loss_type?", "corrected_cause_of_loss_code?", "corrected_paid_amount_cents?", "corrected_claim_status_code?", "corrected_vehicle_identifier?"]
    output: ConsumerDispute
    side_effects:
      - "claim transitions per resolution_code (ACTIVE | AMENDED + replacement | WITHDRAWN)"
      - "dispute terminal state set; resolved_at = logical clock"

  # --- AdverseActionNotice ---
  - method: POST
    path: "/carriers/{carrierId}/adverse-action-notices"
    description: "File an adverse action notice citing a report that influenced pricing or declination"
    roles: [CarrierUnderwriter]
    code: 201
    input: [report_id, action_type, notice_reason_codes, report_influence_rank]
    output: AdverseActionNotice
    side_effects:
      - "consumer_id derived from the report"
      - "outstanding cap enforced"

  - method: GET
    path: "/carriers/{carrierId}/adverse-action-notices"
    description: "List a carrier's adverse action notices"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierUnderwriter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AdverseActionNotice[]"
    side_effects: []

  - method: GET
    path: "/adverse-action-notices"
    description: "List adverse action notices across carriers (filterable by carrier, cited report, or addressed consumer)"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: ["carrier_id?", "report_id?", "consumer_id?", "status?", "limit?", "offset?"]
    output: "AdverseActionNotice[]"
    side_effects: []

  - method: GET
    path: "/adverse-action-notices/{noticeId}"
    description: "Get an adverse action notice"
    roles: [PlatformAdmin, ExchangeComplianceOfficer, CarrierUnderwriter, Consumer]
    code: 200
    input: []
    output: AdverseActionNotice
    side_effects: []

  - method: POST
    path: "/adverse-action-notices/{noticeId}/send"
    description: "Send a DRAFT notice (sets the disclosure deadline)"
    roles: [CarrierUnderwriter]
    code: 200
    input: []
    output: AdverseActionNotice
    side_effects: ["disclosure_deadline = logical clock + ExchangeRule.disclosure_window_days days"]

  - method: POST
    path: "/adverse-action-notices/{noticeId}/acknowledge"
    description: "Consumer acknowledges receipt of a SENT notice"
    roles: [Consumer]
    code: 200
    input: []
    output: AdverseActionNotice
    side_effects: []

  - method: POST
    path: "/adverse-action-notices/{noticeId}/cancel"
    description: "Cancel a DRAFT notice"
    roles: [CarrierUnderwriter]
    code: 200
    input: []
    output: AdverseActionNotice
    side_effects: []

  # --- Audit ---
  - method: GET
    path: "/audit-events"
    description: "List contribution audit events, most recent first"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: ["carrier_id?", "consumer_id?", "event_type?", "limit?", "offset?"]
    output: "ContributionAuditEvent[]"
    side_effects: []

  - method: GET
    path: "/audit-events/{eventId}"
    description: "Get a single audit event"
    roles: [PlatformAdmin, ExchangeComplianceOfficer]
    code: 200
    input: []
    output: ContributionAuditEvent
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated resource does not exist" }
  - { id: ERR_REFERENCED_NOT_FOUND, http: 404, condition: "Body-declared foreign key does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, bad enum member, or claim row failing standardized coding" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in wrong state for the operation (terminal batch void, resolve of resolved dispute, send of non-DRAFT notice, dispute against non-ACTIVE claim)" }
  - { id: ERR_CARRIER_NOT_ACTIVE, http: 409, condition: "Carrier is PROVISIONAL or WITHDRAWN; inquiry and batch endpoints require ACTIVE or, for batches, non-WITHDRAWN" }
  - { id: ERR_RECIPROCITY_REQUIRED, http: 409, condition: "Carrier is SUSPENDED for contribution lag; reports are withheld until contribution resumes" }
  - { id: ERR_PERMISSIBLE_PURPOSE, http: 403, condition: "permissible_purpose missing/out of enum, or CONSUMER_REQUEST inquiry whose subject does not resolve to the acting consumer" }
  - { id: ERR_CONSUMER_FILE_FROZEN, http: 409, condition: "Consumer file is frozen; file access and report issuance blocked until frozen_until" }
  - { id: ERR_DISPUTE_ALREADY_OPEN, http: 409, condition: "A dispute against this claim is already FILED or UNDER_REINVESTIGATION" }
  - { id: ERR_DISPUTE_OVERDUE, http: 409, condition: "Logical clock at or past reinvestigation_due_at; begin-reinvestigation and resolve are closed" }
  - { id: ERR_BATCH_CONSTRAINT, http: 422, condition: "Batch size outside [min_batch_claims, max_batch_claims] or duplicate claim_number within the carrier" }
  - { id: ERR_INQUIRY_CAP_EXCEEDED, http: 409, condition: "Carrier's outstanding adverse-action notices at or above max_outstanding_inquiries" }
  - { id: ERR_EXCHANGE_RULE_EXISTS, http: 409, condition: "POST /exchange-rules when the singleton already exists" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Exchange operator; provisions carriers, consumers, and rules; drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /exchange-rules, PATCH /exchange-rules"
      - "POST /carriers, POST /consumers"
    shared_operations:
      - "GET reads across carriers, batches, claims, consumers, inquiries, reports, disputes, notices, audit events"

  - name: ExchangeComplianceOfficer
    description: "Compliance authority; withdraws carriers, freezes consumer files, voids batches, runs reinvestigations. Segregated from contribution (CarrierDataSteward) and underwriting (CarrierUnderwriter): the same role cannot contribute data and adjudicate disputes about it."
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers/{id}/withdraw"
      - "POST /consumers/{id}/freeze"
      - "POST /batches/{id}/void"
      - "POST /disputes/{id}/begin-reinvestigation, POST /disputes/{id}/resolve"
    shared_operations:
      - "GET reads across the exchange"

  - name: CarrierDataSteward
    description: "Carrier-side contribution role; X-User-ID equals the Carrier.id the steward acts for"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /carriers/{id}/batches (only for own carrier)"
      - "POST /claims/{id}/amendments (only for claims own carrier contributed)"
    shared_operations:
      - "GET own carrier, own batches, own claims"

  - name: CarrierUnderwriter
    description: "Carrier-side quote/decision role; X-User-ID equals the Carrier.id the underwriter acts for"
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /carriers/{id}/inquiries (only for own carrier)"
      - "POST /carriers/{id}/adverse-action-notices (only for own carrier)"
      - "POST /adverse-action-notices/{id}/send and /cancel (only own carrier's notices)"
    shared_operations:
      - "GET own carrier's inquiries, reports, notices"

  - name: Consumer
    description: "Data subject; X-User-ID equals the Consumer.id"
    identity: "entity_backed:Consumer"
    exclusive_operations:
      - "GET /consumers/{id}/file (own file only)"
      - "POST /consumers/{id}/disputes (own id only)"
      - "POST /adverse-action-notices/{id}/acknowledge (only notices addressed to self)"
    shared_operations:
      - "GET own consumer record, own claims, own disputes, notices addressed to self"
