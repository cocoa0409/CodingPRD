              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/council-requests"
              payload: { resident_id: "${res_id}", requested_domain: "SPIRITUAL", requested_program_id: "${prog_id}", vote_count: 4, note: "Four votes only" }
              as: CouncilRepresentative
              as_user_id: "${res_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /recreation/council-requests/${req_id}/review"
              payload: { decision: "ADOPTED", decision_note: "Trying to adopt" }
              as: ActivityDirector
              captures: { err_id: $.data.error_id }
            - call: "POST /recreation/council-requests/${req_id}/review"
              payload: { decision: "DEFERRED", decision_note: "Revisit after the next council meeting" }
