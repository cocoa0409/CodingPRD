              as: ComplianceOfficer
              captures: { p1: $.data.id }
            - call: "POST /charity-care/policies/${p1}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /charity-care/policies"
              payload: { policy_code: "FAP-2027", fpl_base_cents: 1600000, fpl_increment_cents: 550000, full_discount_max_fpl_pct: 200, partial_discount_max_fpl_pct: 300, partial_discount_floor_pct: 50.0, asset_limit_cents: 2500000, retroactive_window_days: 240, notification_period_days: 120, eca_notice_days: 30, doc_response_days: 30, presumptive_partial_score_threshold: 70.0, presumptive_full_score_threshold: 90.0, effective_from: "2027-01-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }
              as: ComplianceOfficer
