            - "the captured s1_avail == 350 and s1_res == 50 and s1_dep == 0"
            - "the captured w1_status == CANCELLED"
            - "the captured s2_avail == 400 and s2_res == 0 and s2_dep == 0"
            - "the captured w2_status == ABORTED"
            - "the captured s3_avail == 400 and s3_res == 0 and s3_dep == 0"
            - "the captured w3_status == COMPLETED"
            - "the captured s4_avail == 350 and s4_res == 0 and s4_dep == 50"
            - "the captured rec_loss == 0 and rec_damage == 0"
            - "the captured s5_avail == 400 and s5_res == 0 and s5_dep == 0"
            - "FenceProduct.${p_panel_id}.damaged_count == 0 and lost_count == 0"
            - "FenceProduct.${p_panel_id}.available_count + reserved_count + deployed_count + damaged_count + lost_count == 400 at every one of the five snapshots"
            - "WorkOrder.${w1_id}.reserved_unit_counts is empty and WorkOrder.${w2_id}.reserved_unit_counts is empty"
            - "exactly 1 Invoice row exists for contract ${c_id} and its invoice_kind == MOBILIZATION with total_cents == 85487"
            - "RentalContract.${c_id}.lifecycle_status == DEMOBILIZING"
            - "RentalContract.${c_id}.deployed_linear_feet == 0"

      - name: open_balance_conservation_across_issue_and_void
        grounds:
          - calculations.account_exposure
          - state_machines.Invoice.ISSUED_to_PARTIALLY_PAID
          - state_machines.Invoice.PARTIALLY_PAID_to_VOID
          - state_machines.RentalContract.billing_to_SETTLED
          - state_machines.RentalContract.billing_SETTLED_to_CURRENT
          - entities.CustomerAccount.fields.lifetime_credited_cents
          - validations.priority_7_ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          Voiding a PARTIALLY_PAID invoice must remove exactly the still-open 45487
          from open_balance_cents and add exactly 45487 to lifetime_credited_cents
          while leaving amount_paid_cents at the 40000 already collected: cash is
          never refunded by a void. The compensation is also visible in the parallel
          state: billing_status settles to SETTLED while lifecycle_status stays
          ACTIVE, and the next periodic run re-opens it to CURRENT with
          open_balance_cents exactly 29403 and lifetime_credited_cents untouched at
          45487. Reversing the full total_cents, or moving amount_paid_cents, breaks
          the identity in a way no single-invoice assertion would catch.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01, then 2026-08-20 for mobilization, then 2026-09-17 for the periodic run."
            - "Municipality HRB-01, rental_tax_rate_bp 890; jobsite SOIL with requires_sidewalk_closure false."
            - "CONSTRUCTION contract 500 ft, NONE screen, term 3, no add-ons -> monthly 27000, one_time 78500."
            - "The install is completed by dc-001, so the MOBILIZATION invoice of 85487 carries issued_by_user_id dc-001 and the void by am-001 does not violate segregation of duties."
            - "Account credit_limit_cents 100000000 so credit_hold_flag stays false throughout."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/municipalities"
              payload: { name: "City of Harbor Point", jurisdiction_code: "HRB-01", permit_lead_time_days: 5, max_concurrent_closure_linear_feet: 800, rental_tax_rate_bp: 890, permit_review_rounds_allowed: 2, allows_solid_wind_screen: true }
              as: PlatformAdmin
              captures: { m1_id: "$.data.id"}
            - call: "POST /fence-rentals/accounts"
              payload: { legal_name: "Ridgeline Builders LLC", billing_email: "ap@ridgeline.example", credit_limit_cents: 100000000 }
              as: AccountManager
              as_user_id: "am-001"
              captures: { a1_id: "$.data.id"}
            - call: "POST /fence-rentals/products"
              payload: { code: "PANEL-CL-10", category: "FENCE_PANEL", description: "10 ft chain-link fence panel", panel_length_ft: 10, unit_monthly_rate_cents: 0, replacement_cost_cents_per_unit: 24000, fleet_age_months: 18, wind_load_rating_mph: 90, owned_count: 400 }
              as: PlatformAdmin
            - call: "POST /fence-rentals/crews"
              payload: { crew_code: "CRW-A", depot_code: "DEP-1", daily_capacity_hours: 12.0 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { c1_id: "$.data.id"}
            - call: "POST /fence-rentals/jobsites"
              payload: { customer_account_id: "${a1_id}", municipality_id: "${m1_id}", site_label: "Foundry Road Phase Yard", address_line: "402 Foundry Road", site_condition: "SOIL", requires_sidewalk_closure: false }
              as: AccountManager
              as_user_id: "am-001"
              captures: { j1_id: "$.data.id", j1_v: "$.data.version"}
            - call: "POST /fence-rentals/jobsites/${j1_id}/quotes"
              payload: { expected_jobsite_version: "${j1_v}", contract_type: "CONSTRUCTION", linear_feet: 500, panel_product_code: "PANEL-CL-10", term_months: 3, wind_screen: "NONE" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { q1_id: "$.data.id"}
            - call: "POST /fence-rentals/quotes/${q1_id}/issue"
              payload: {}
              as: AccountManager
              as_user_id: "am-001"
            - call: "POST /fence-rentals/quotes/${q1_id}/accept"
              payload: { accepted_by_name: "R. Vance" }
              as: CustomerContact
              as_user_id: "${a1_id}"
            - call: "POST /fence-rentals/contracts"
              payload: { quote_id: "${q1_id}", terms_acknowledged_by: "R. Vance" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { c_id: "$.data.id"}
            - call: "POST /fence-rentals/contracts/${c_id}/work-orders"
              payload: { work_order_type: "DELIVERY_INSTALL", ordered_linear_feet: 500 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
              captures: { wi_id: "$.data.id"}
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/work-orders/${wi_id}/dispatch"
              payload: { crew_id: "${c1_id}", scheduled_start_utc: "2026-08-20T08:00:00Z" }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "POST /fence-rentals/work-orders/${wi_id}/complete"
              payload: { completed_linear_feet: 500 }
              as: DispatchCoordinator
              as_user_id: "dc-001"
            - call: "GET /fence-rentals/invoices?contract_id=${c_id}&invoice_kind=MOBILIZATION"
              as: AccountManager
              as_user_id: "am-001"
              captures: { mob_id: "$.data[0].id", mob_total: "$.data[0].total_cents", mob_issuer: "$.data[0].issued_by_user_id"}
          trigger:
            - call: "POST /fence-rentals/accounts/${a1_id}/payments"
              payload: { amount_cents: 40000 }
              as: AccountManager
              as_user_id: "am-002"
              captures: { bal_after_pay: "$.data.open_balance_cents", credited_after_pay: "$.data.lifetime_credited_cents"}
            - call: "POST /fence-rentals/invoices/${mob_id}/void"
              payload: { void_reason_code: "BILLED_IN_ERROR" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { void_status: "$.data.status", void_paid: "$.data.amount_paid_cents"}
            - call: "GET /fence-rentals/accounts/${a1_id}"
              as: AccountManager
              as_user_id: "am-001"
              captures: { bal_after_void: "$.data.open_balance_cents", credited_after_void: "$.data.lifetime_credited_cents"}
            - call: "GET /fence-rentals/contracts/${c_id}"
              as: AccountManager
              as_user_id: "am-001"
              captures: { life_after_void: "$.data.lifecycle_status", bill_after_void: "$.data.billing_status"}
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-17T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fence-rentals/contracts/${c_id}/billing-runs"
              payload: { period_start_utc: "2026-08-20T00:00:00Z", period_end_utc: "2026-09-17T00:00:00Z" }
              as: AccountManager
              as_user_id: "am-001"
              captures: { per_id: "$.data.id", per_total: "$.data.total_cents", per_late: "$.data.late_fee_cents"}
            - call: "GET /fence-rentals/accounts/${a1_id}"
              as: AccountManager
              as_user_id: "am-001"
              captures: { bal_final: "$.data.open_balance_cents", credited_final: "$.data.lifetime_credited_cents", hold_final: "$.data.credit_hold_flag"}
            - call: "GET /fence-rentals/contracts/${c_id}"
              as: AccountManager
              as_user_id: "am-001"
              captures: { life_final: "$.data.lifecycle_status", bill_final: "$.data.billing_status"}
          assert:
            - "the captured mob_total == 85487 and mob_issuer == dc-001"
            - "the captured bal_after_pay == 45487 and credited_after_pay == 0"
            - "Invoice.${mob_id}.status was PARTIALLY_PAID immediately after the payment with amount_paid_cents == 40000"
            - "the captured void_status == VOID"
            - "the captured void_paid == 40000"
            - "the captured bal_after_void == 0"
            - "the captured credited_after_void == 45487"
            - "the captured life_after_void == ACTIVE"
            - "the captured bill_after_void == SETTLED"
            - "Invoice.${per_id}.invoice_kind == PERIODIC"
            - "Invoice.${per_id}.billable_days == 28"
            - "Invoice.${per_id}.lines has exactly one entry with line_type == RENTAL and amount_cents == 27000"
            - "Invoice.${per_id}.subtotal_cents == 27000"
            - "Invoice.${per_id}.tax_cents == 2403"
            - "the captured per_late == 0"
            - "the captured per_total == 29403"
            - "the captured bal_final == 29403"
            - "the captured credited_final == 45487"
            - "the captured hold_final == false"
            - "the captured life_final == ACTIVE"
            - "the captured bill_final == CURRENT"
