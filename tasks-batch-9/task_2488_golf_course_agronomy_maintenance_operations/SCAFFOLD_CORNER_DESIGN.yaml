              as: Superintendent
              as_user_id: "super-1"
              captures: { wx_frost2_id: $.data.id }
            - call: "GET /courses/${course_id}"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { cv6: $.data.version, posture_6: $.data.play_posture, frost_6: $.data.frost_delay_minutes }
            - call: "POST /weather-events/${wx_frost2_id}/clear"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
            - call: "GET /courses/${course_id}"
